<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코발트인더스트리 — 글로벌 홈페이지 확장 플랫폼</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --ink:#000000;
    --muted:#6d6d6d;
    --line:rgba(0,0,0,.14);
    --inset:#9a9a9a;
    --accent:#a02d25;
    --pill:75px;
    --maxw:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body,#app-root{width:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit;}
  img{max-width:100%; display:block;}
  .inner{width:100%; max-width:var(--maxw); margin:0 auto; padding:0 32px;}

  .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .kicker::before{content:''; width:22px; height:1px; background:var(--ink);}

  header.topnav{position:fixed; top:0; left:0; width:100%; z-index:100; height:66px; display:flex; align-items:center; transition:background .3s ease, border-color .3s ease, backdrop-filter .3s ease; border-bottom:1px solid transparent;}
  header.topnav.on-dark{color:#fff;}
  header.topnav.scrolled{background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-color:var(--line); color:#000;}
  .topnav .inner{display:flex; align-items:center; justify-content:space-between; width:100%;}
  .logo{font-size:16px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:8px;}
  .logo i{font-size:18px;}
  .menu{display:flex; gap:28px; align-items:center;}
  .menu button{font-size:13px; letter-spacing:.02em; padding:6px 2px; position:relative; transition:opacity .2s ease;}
  .menu button.active::after{content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:var(--accent);}
  .menu button:hover{opacity:.6;}
  .locale-switch{display:flex; gap:10px; font-size:11px;}
  .locale-switch button{opacity:.5;}
  .locale-switch button.active{opacity:1; font-weight:600;}

  .page{padding-top:66px; animation:fadeInPage .5s ease both;}
  @keyframes fadeInPage{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  /* ── Hero (home) ── */
  .hero{position:relative; min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#0a0a0a; color:#fff; overflow:hidden; padding:40px 24px;}
  .hero-gradient{position:absolute; inset:0; background:linear-gradient(120deg, rgba(160,224,171,.55), rgba(255,172,46,.5) 45%, rgba(165,45,37,.6) 85%); background-size:220% 220%; animation:gradientShift 14s ease-in-out infinite; opacity:.75;}
  .hero-overlay{position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, transparent 0%, rgba(0,0,0,.55) 78%);}
  @keyframes gradientShift{0%,100%{background-position:0% 30%;} 50%{background-position:100% 70%;}}
  .hero-content{position:relative; z-index:1; max-width:960px;}
  .hero-title{font-size:clamp(48px, 9vw, 128px); font-weight:400; line-height:.95; letter-spacing:-.01em; margin-bottom:28px;}
  .hero-sub{font-size:18px; color:rgba(255,255,255,.8); max-width:520px; margin:0 auto 40px; line-height:1.6;}
  .hero-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .pill{border-radius:var(--pill); padding:13px 30px; font-size:15px; transition:opacity .25s cubic-bezier(.19,1,.22,1), transform .25s cubic-bezier(.19,1,.22,1);}
  .pill:hover{transform:translateY(-2px);}
  .pill-dark{border:1px solid rgba(255,255,255,.4); color:#fff; background:transparent;}
  .pill-light{border:1px solid var(--ink); color:var(--ink); background:transparent;}
  .pill-fill{background:var(--ink); color:#fff;}
  .scroll-badge{position:absolute; bottom:28px; left:32px; z-index:1; width:70px; height:70px; border-radius:50%; border:1px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; animation:spinSlow 12s linear infinite; color:#fff;}
  @keyframes spinSlow{from{transform:rotate(0);} to{transform:rotate(360deg);}}

  /* ── Statement sections (home) ── */
  .statement{padding:120px 0; border-bottom:1px solid var(--line);}
  .statement.dark{background:#000; color:#fff; border-color:rgba(255,255,255,.15);}
  .statement-head{font-size:clamp(32px, 5.4vw, 64px); font-weight:300; line-height:1.15; max-width:820px;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center; padding:110px 0; border-bottom:1px solid var(--line);}
  .split.reverse .split-media{order:2;}
  .split-media{aspect-ratio:4/3; background:var(--inset); position:relative; overflow:hidden;}
  .split-media svg{width:100%; height:100%;}
  .split-text h3{font-size:clamp(26px,3vw,38px); font-weight:400; margin-bottom:18px; line-height:1.25;}
  .split-text p{font-size:16px; color:var(--muted); line-height:1.7; margin-bottom:24px;}
  .stat-row{display:flex; gap:48px; padding:90px 0;}
  .stat-item b{display:block; font-size:clamp(32px,4vw,54px); font-weight:400;}
  .stat-item span{font-size:13px; color:var(--muted);}

  /* ── Generic sub-page shell ── */
  .subhero{padding:70px 0 56px; border-bottom:1px solid var(--line);}
  .subhero h1{font-size:clamp(36px,5vw,64px); font-weight:400; line-height:1.1; margin-bottom:18px;}
  .subhero p{font-size:16px; color:var(--muted); max-width:600px; line-height:1.6;}
  .section{padding:64px 0;}

  /* ── About page ── */
  .about-block{display:grid; grid-template-columns:220px 1fr; gap:40px; padding:36px 0; border-bottom:1px solid var(--line);}
  .about-block h4{font-size:13px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  .about-block .content{font-size:16px; line-height:1.75;}
  .org-strip{display:flex; flex-wrap:wrap; gap:12px; margin-top:18px;}
  .org-chip{border:1px solid var(--ink); border-radius:var(--pill); padding:8px 18px; font-size:13px;}

  /* ── Newsroom ── */
  .filter-chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;}
  .chip{border:1px solid var(--ink); border-radius:var(--pill); padding:9px 20px; font-size:13px; transition:background .2s ease, color .2s ease;}
  .chip.active{background:var(--ink); color:#fff; animation:badgeIn .3s ease;}
  @keyframes badgeIn{from{transform:scale(.9);} to{transform:scale(1);}}
  .admin-add{margin-left:auto; display:flex; align-items:center; gap:6px; border:1px solid var(--accent); color:var(--accent); border-radius:var(--pill); padding:9px 20px; font-size:13px;}
  .news-row{display:grid; grid-template-columns:280px 1fr auto; gap:32px; align-items:center; padding:28px 0; border-bottom:1px solid var(--line); cursor:pointer; animation:rowStagger .5s ease both;}
  .news-row .thumb{aspect-ratio:16/10; background:var(--inset); overflow:hidden;}
  .news-row .thumb svg{width:100%; height:100%;}
  .news-row h3{font-size:20px; font-weight:500; margin-bottom:8px;}
  .news-row p{font-size:14px; color:var(--muted); line-height:1.6;}
  .news-row .meta{font-size:12px; color:var(--muted); white-space:nowrap; text-align:right;}
  @keyframes rowStagger{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  /* ── Case studies ── */
  .filter-bar{display:flex; gap:16px; flex-wrap:wrap; padding:24px 0 36px; border-bottom:1px solid var(--line); margin-bottom:40px;}
  .filter-bar select{border:1px solid var(--ink); border-radius:0; padding:10px 14px; font-size:13px; background:#fff;}
  .case-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--line);}
  .case-card{background:#fff; padding:32px 28px; cursor:pointer; transition:background .25s ease; animation:rowStagger .5s ease both;}
  .case-card:hover{background:#f3f3f3;}
  .case-tag{font-size:11px; color:var(--accent); letter-spacing:.06em; margin-bottom:14px; display:block;}
  .case-card h4{font-size:19px; font-weight:500; margin-bottom:10px; line-height:1.3;}
  .case-card p{font-size:13.5px; color:var(--muted); line-height:1.6;}
  .case-meta{display:flex; gap:10px; margin-top:16px; font-size:11px; color:var(--muted);}

  /* ── Recruit ── */
  .recruit-layout{display:grid; grid-template-columns:1fr 1fr; gap:56px;}
  .job-item{border:1px solid var(--ink); padding:22px 24px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .job-item h5{font-size:16px; font-weight:500; margin-bottom:4px;}
  .job-item span{font-size:12.5px; color:var(--muted);}
  .job-apply-btn{border:1px solid var(--ink); border-radius:var(--pill); padding:8px 18px; font-size:13px;}
  .dropzone{border:1px dashed var(--ink); padding:30px; text-align:center; margin-bottom:18px; transition:background .2s ease;}
  .dropzone.drag{background:#f5f5f5;}
  .progress-track{height:3px; background:var(--line); margin-top:14px; overflow:hidden;}
  .progress-bar{height:100%; background:var(--accent); width:0%; transition:width .3s ease;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px; letter-spacing:.02em;}
  .field input, .field select{width:100%; border:none; border-bottom:1px solid var(--ink); padding:10px 2px; font-size:14px; background:transparent;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .track-panel{background:#000; color:#fff; padding:36px; margin-top:8px;}
  .status-badge{display:inline-flex; align-items:center; gap:8px; border-radius:var(--pill); padding:7px 16px; font-size:12.5px; margin-top:14px;}
  .status-badge.접수{background:#333;}
  .status-badge.서류심사{background:var(--accent);}
  .status-badge.면접{background:#2a7a4a;}

  footer{border-top:1px solid var(--line); padding:48px 0;}
  .footer-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; font-size:12.5px; color:var(--muted); line-height:1.8;}

  #toast{position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:#000; color:#fff; padding:14px 24px; border-radius:var(--pill); font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; z-index:300; display:flex; align-items:center; gap:10px;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px;}
  .modal-box{background:#fff; max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:40px; animation:modalIn .3s ease;}
  @keyframes modalIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .modal-close{float:right; font-size:20px;}

  @media (max-width:900px){
    .menu, .locale-switch{display:none;}
    .split, .about-block, .recruit-layout{grid-template-columns:1fr;}
    .case-grid{grid-template-columns:1fr;}
    .news-row{grid-template-columns:1fr; gap:14px;}
    .news-row .meta{text-align:left;}
    .footer-cols{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app-root"></div>

<script type="text/babel">
const {useState, useEffect, useRef} = React;

const LABELS = {
  ko:{about:'회사소개', newsroom:'뉴스룸', casestudy:'고객사례', recruit:'채용', home:'홈'},
  en:{about:'Company', newsroom:'News', casestudy:'Case Studies', recruit:'Careers', home:'Home'}
};

const NAV_ITEMS = [
  {key:'about', label:'회사소개'},
  {key:'newsroom', label:'뉴스룸'},
  {key:'casestudy', label:'고객사례'},
  {key:'recruit', label:'채용'}
];

const NEWS_DATA = [
  {id:1, cat:'수상·인증', date:'2026.06.02', title:'코발트인더스트리, 스마트팩토리 품질혁신 인증 획득', excerpt:'전 공정 이력 관리 체계를 인정받아 산업 품질 인증을 새롭게 획득했습니다.', file:'quality-cert-2026.pdf'},
  {id:2, cat:'신제품', date:'2026.05.14', title:'차세대 5축 CNC 라인 신규 도입 소식', excerpt:'정밀도를 높인 신규 가공 라인을 도입해 다품종 생산 대응력을 확장합니다.', file:'new-cnc-line.pdf'},
  {id:3, cat:'파트너십', date:'2026.04.20', title:'동남아 물류 파트너사와 수출 협력 확대', excerpt:'현지 물류 파트너사와 협력을 확대해 해외 납품 대응 속도를 높입니다.', file:'partnership-sea.pdf'},
  {id:4, cat:'채용소식', date:'2026.03.28', title:'기술연구소 신입·경력 공개채용 안내', excerpt:'자동화 설비 설계 직군을 중심으로 신입 및 경력 채용을 진행합니다.', file:'recruit-notice.pdf'},
  {id:5, cat:'수상·인증', date:'2026.02.11', title:'ISO 9001 갱신 심사 통과', excerpt:'정기 갱신 심사에서 전 항목 적합 판정을 받아 인증을 유지합니다.', file:'iso-renewal.pdf'}
];
const NEWS_CATS = ['전체','수상·인증','신제품','파트너십','채용소식'];

const CASE_DATA = [
  {id:1, industry:'자동차', year:'2025', biz:'정밀가공', title:'자동차 부품사 정밀가공 라인 이관', summary:'기존 수작업 공정을 5축 CNC 기반으로 전환해 생산 유연성을 높이는 사례입니다.'},
  {id:2, industry:'전자', year:'2025', biz:'자동화설비', title:'전자부품 조립 자동화 설비 구축 사례', summary:'로봇 팔과 비전 검사를 결합한 조립 라인으로 공정 효율을 개선하는 사례입니다.'},
  {id:3, industry:'에너지', year:'2024', biz:'품질관리', title:'에너지 설비 부품 품질 이력 관리 사례', summary:'전 공정 이력 추적 시스템으로 불량 원인 분석 시간을 단축하는 사례입니다.'},
  {id:4, industry:'물류', year:'2024', biz:'해외수출', title:'물류 장비 부품 해외 수출 대응 사례', summary:'현지 인증 요건에 맞춘 수출 대응 체계를 구축하는 사례입니다.'},
  {id:5, industry:'자동차', year:'2023', biz:'자동화설비', title:'자동차 시트 부품 자동화 라인 확장', summary:'기존 라인에 자동화 설비를 추가 도입해 생산량을 확대하는 사례입니다.'},
  {id:6, industry:'전자', year:'2023', biz:'정밀가공', title:'전자 하우징 정밀가공 협업 사례', summary:'미세 공차 요구에 대응하는 정밀가공 협업 체계를 구성하는 사례입니다.'}
];

const JOBS = [
  {id:1, title:'자동화설비 설계 엔지니어', team:'기술연구소 · 경력 3년 이상'},
  {id:2, title:'품질관리 검사원', team:'품질경영실 · 신입/경력'},
  {id:3, title:'해외영업 담당자', team:'영업본부 · 경력 2년 이상'}
];

function Toast({msg}){
  return <div id="toast" className={msg ? 'show' : ''}><i className="ti ti-circle-check"></i><span>{msg}</span></div>;
}

function TopNav({page, setPage, locale, setLocale}){
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const onDark = page === 'home' && !scrolled;
  return (
    <header className={'topnav' + (scrolled ? ' scrolled' : '') + (onDark ? ' on-dark' : '')}>
      <div className="inner">
        <div className="logo" onClick={() => setPage('home')} style={{cursor:'pointer'}}><i className="ti ti-cube"></i>코발트인더스트리</div>
        <nav className="menu">
          {NAV_ITEMS.map(item => (
            <button key={item.key} className={page === item.key ? 'active' : ''} onClick={() => setPage(item.key)}>
              {locale === 'ko' ? item.label : LABELS.en[item.key]}
            </button>
          ))}
        </nav>
        <div className="locale-switch">
          <button className={locale === 'ko' ? 'active' : ''} onClick={() => setLocale('ko')}>KR</button>
          <button className={locale === 'en' ? 'active' : ''} onClick={() => setLocale('en')}>EN</button>
        </div>
      </div>
    </header>
  );
}

function HomePage({setPage, locale}){
  const t = locale === 'ko'
    ? {title:['하나의 이야기,','다국어로 흐르다'], sub:'글로벌 홈 & 다국어 전환 내비게이션으로, 언어를 바꿔도 지금 보던 화면 그대로 이어지는 확장 플랫폼을 선보입니다.', cta1:'뉴스룸 보기', cta2:'고객사례 살펴보기'}
    : {title:['One story,','many languages'], sub:'A global home with language-aware navigation that keeps your current page in place.', cta1:'View Newsroom', cta2:'Explore Case Studies'};
  return (
    <div className="page" style={{paddingTop:0}}>
      <section className="hero">
        <div className="hero-gradient"></div>
        <div className="hero-overlay"></div>
        <div className="hero-content">
          <div className="kicker" style={{color:'rgba(255,255,255,.7)', justifyContent:'center'}}><span style={{background:'#fff'}}></span>글로벌 홈 · 다국어 내비게이션</div>
          <h1 className="hero-title">{t.title[0]}<br/>{t.title[1]}</h1>
          <p className="hero-sub">{t.sub}</p>
          <div className="hero-actions">
            <button className="pill pill-fill" onClick={() => setPage('newsroom')}>{t.cta1}</button>
            <button className="pill pill-dark" onClick={() => setPage('casestudy')}>{t.cta2}</button>
          </div>
        </div>
        <div className="scroll-badge"><i className="ti ti-arrow-down"></i></div>
      </section>

      <section className="split">
        <div className="split-text">
          <div className="kicker">플랫폼 확장 방향</div>
          <h3>브랜드 홈페이지를<br/>운영 플랫폼으로 확장합니다</h3>
          <p>MVP 데모의 원페이지 구조를 넘어, 뉴스룸·고객사례·채용까지 하나의 관리 가능한 플랫폼으로 확장하는 구현 데모입니다.</p>
          <button className="pill pill-light" onClick={() => setPage('about')}>회사소개 자세히 보기</button>
        </div>
        <div className="split-media">
          <svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#9a9a9a"/><g stroke="#000" strokeWidth="1" opacity=".5"><line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/></g><circle cx="200" cy="150" r="52" fill="none" stroke="#a02d25" strokeWidth="2"/><circle cx="200" cy="150" r="6" fill="#a02d25"/></svg>
        </div>
      </section>

      <section className="stat-row inner">
        <div className="stat-item"><b>2</b><span>지원 언어(국·영)</span></div>
        <div className="stat-item"><b>20+</b><span>구현 화면</span></div>
        <div className="stat-item"><b>4</b><span>확장 모듈</span></div>
      </section>

      <section className="statement dark">
        <div className="inner">

        </div>
      </section>
    </div>

function NewsroomPage({toast}){
  const [cat, setCat] = useState('전체');
  const [list, setList] = useState(NEWS_DATA);
  const [detail, setDetail] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({title:'', cat:'수상·인증', body:''});

  const filtered = cat === '전체' ? list : list.filter(n => n.cat === cat);

  function addNews(e){
    e.preventDefault();
    if(!form.title.trim() || !form.body.trim()){ toast('제목과 내용을 입력해주세요'); return; }
    const item = {id:Date.now(), cat:form.cat, date:'2026.07.27', title:form.title, excerpt:form.body, file:'new-release.pdf'};
    setList([item, ...list]);
    setShowAdd(false);
    setForm({title:'', cat:'수상·인증', body:''});
    toast('새 보도자료가 목록 최상단에 등록되었습니다');
  }

  return (
    <div className="page">
      <section className="subhero inner">
        <div className="kicker">뉴스룸 &amp; 보도자료 관리 게시판</div>
        <h1>뉴스룸</h1>
        <p>최신 보도자료를 카테고리별로 확인하고, 관리자는 새 보도자료를 직접 등록할 수 있습니다.</p>
      </section>
      <section className="inner">
        <div className="filter-chips">
          {NEWS_CATS.map(c => (
            <button key={c} className={'chip' + (cat === c ? ' active' : '')} onClick={() => setCat(c)}>{c}</button>
          ))}
          <button className="admin-add" onClick={() => setShowAdd(true)}><i className="ti ti-plus"></i>새 보도자료 등록</button>
        </div>
        <div>
          {filtered.map((n, i) => (
            <div key={n.id} className="news-row" style={{animationDelay:(i*0.05)+'s'}} onClick={() => setDetail(n)}>
              <div className="thumb"><svg viewBox="0 0 300 190"><rect width="300" height="190" fill="#9a9a9a"/><rect x="20" y="130" width="70" height="40" fill="#a02d25" opacity=".7"/><rect x="100" y="90" width="70" height="80" fill="#000" opacity=".5"/><rect x="180" y="60" width="70" height="110" fill="#a02d25" opacity=".4"/></svg></div>
              <div>
                <span className="case-tag">{n.cat}</span>
                <h3>{n.title}</h3>
                <p>{n.excerpt}</p>
              </div>
              <div className="meta">{n.date}<br/><i className="ti ti-paperclip"></i> 첨부 1</div>
            </div>
          ))}
        </div>
      </section>

      {detail && (
        <div className="modal-overlay" onClick={() => setDetail(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <span className="modal-close" onClick={() => setDetail(null)} style={{cursor:'pointer'}}>&times;</span>
            <span className="case-tag">{detail.cat} · {detail.date}</span>
            <h3 style={{fontSize:'22px', margin:'14px 0'}}>{detail.title}</h3>
            <p style={{color:'var(--muted)', lineHeight:1.7, marginBottom:'22px'}}>{detail.excerpt} 상세 보도자료 본문은 담당 부서 검수 후 게시됩니다.</p>
            <button className="pill pill-light" onClick={() => { toast('첨부파일(' + detail.file + ') 다운로드를 시작합니다'); }}><i className="ti ti-download"></i> 첨부파일 다운로드</button>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={() => setShowAdd(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <span className="modal-close" onClick={() => setShowAdd(false)} style={{cursor:'pointer'}}>&times;</span>
            <h3 style={{fontSize:'20px', marginBottom:'20px'}}>새 보도자료 등록</h3>
            <form onSubmit={addNews}>
              <div className="field"><label>카테고리</label>
                <select value={form.cat} onChange={e => setForm({...form, cat:e.target.value})}>
                  {NEWS_CATS.filter(c => c !== '전체').map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="field"><label>제목</label><input value={form.title} onChange={e => setForm({...form, title:e.target.value})} placeholder="보도자료 제목" /></div>
              <div className="field"><label>내용 요약</label><input value={form.body} onChange={e => setForm({...form, body:e.target.value})} placeholder="한 줄 요약" /></div>
              <button type="submit" className="pill pill-fill" style={{width:'100%'}}>등록하기</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function CaseStudyPage(){
  const [industry, setIndustry] = useState('전체');
  const [year, setYear] = useState('전체');
  const [biz, setBiz] = useState('전체');
  const [detail, setDetail] = useState(null);

  useEffect(() => {
    const q = [];
    if(industry !== '전체') q.push('industry=' + encodeURIComponent(industry));
    if(year !== '전체') q.push('year=' + year);
    if(biz !== '전체') q.push('biz=' + encodeURIComponent(biz));
    const qs = q.length ? '?' + q.join('&') : '';
    history.replaceState(null, '', location.pathname + qs);
  }, [industry, year, biz]);

  const industries = ['전체', ...new Set(CASE_DATA.map(c => c.industry))];
  const years = ['전체', ...new Set(CASE_DATA.map(c => c.year))];
  const bizs = ['전체', ...new Set(CASE_DATA.map(c => c.biz))];

  const filtered = CASE_DATA.filter(c =>
    (industry === '전체' || c.industry === industry) &&
    (year === '전체' || c.year === year) &&
    (biz === '전체' || c.biz === biz)
  );

  return (
    <div className="page">
      <section className="subhero inner">
        <div className="kicker">고객사례 필터링 디렉터리</div>
        <h1>고객사례</h1>
        <p>업종·연도·사업영역 조건을 조합해 고객사례를 탐색할 수 있는 디렉터리입니다.</p>
      </section>
      <section className="inner">
        <div className="filter-bar">
          <select value={industry} onChange={e => setIndustry(e.target.value)}>{industries.map(v => <option key={v}>{v}</option>)}</select>
          <select value={year} onChange={e => setYear(e.target.value)}>{years.map(v => <option key={v}>{v}</option>)}</select>
          <select value={biz} onChange={e => setBiz(e.target.value)}>{bizs.map(v => <option key={v}>{v}</option>)}</select>
          <span style={{fontSize:'13px', color:'var(--muted)', alignSelf:'center'}}>{filtered.length}건 표시 중</span>
        </div>
        <div className="case-grid">
          {filtered.map((c, i) => (
            <div key={c.id} className="case-card" style={{animationDelay:(i*0.05)+'s'}} onClick={() => setDetail(c)}>
              <span className="case-tag">{c.biz}</span>
              <h4>{c.title}</h4>
              <p>{c.summary}</p>
              <div className="case-meta"><span>{c.industry}</span><span>·</span><span>{c.year}</span></div>
            </div>
          ))}
          {filtered.length === 0 && <div style={{padding:'40px', color:'var(--muted)'}}>조건에 맞는 사례가 없습니다.</div>}
        </div>
      </section>

      {detail && (
        <div className="modal-overlay" onClick={() => setDetail(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <span className="modal-close" onClick={() => setDetail(null)} style={{cursor:'pointer'}}>&times;</span>
            <span className="case-tag">{detail.biz} · {detail.industry} · {detail.year}</span>
            <h3 style={{fontSize:'22px', margin:'14px 0'}}>{detail.title}</h3>
            <p style={{color:'var(--muted)', lineHeight:1.7}}>{detail.summary} 상세 수행 범위와 도입 효과는 담당 영업팀 상담을 통해 안내됩니다.</p>
          </div>
        </div>
      )}
    </div>
  );
}

function RecruitPage({toast}){
  const [drag, setDrag] = useState(false);
  const [fileName, setFileName] = useState('');
  const [progress, setProgress] = useState(0);
  const [applyOpen, setApplyOpen] = useState(null);
  const [form, setForm] = useState({name:'', phone:''});
  const [receiptNo, setReceiptNo] = useState('');
  const [lookupInput, setLookupInput] = useState('');
  const [lookupResult, setLookupResult] = useState(null);
  const fileRef = useRef(null);

  const MOCK_STATUS = {'CB-20260501':'접수', 'CB-20260318':'서류심사', 'CB-20260212':'면접'};

  function handleFile(name){
    setFileName(name);
    setProgress(0);
    let p = 0;
    const timer = setInterval(() => {
      p += 20;
      setProgress(p);
      if(p >= 100) clearInterval(timer);
    }, 120);
  }

  function submitApply(e){
    e.preventDefault();
    if(!form.name.trim() || !form.phone.trim() || !fileName){ toast('이름·연락처·이력서 파일을 모두 입력해주세요'); return; }
    if(!fileName.toLowerCase().endsWith('.pdf')){ toast('이력서는 PDF 파일만 업로드할 수 있습니다'); return; }
    const no = 'CB-2026' + String(Date.now()).slice(-6);
    setReceiptNo(no);
    setApplyOpen(null);
    toast('지원이 완료되었습니다. 접수번호 ' + no);
  }

  function lookupStatus(e){
    e.preventDefault();
    const status = MOCK_STATUS[lookupInput.trim()] || (lookupInput.trim() === receiptNo ? '접수' : null);
    setLookupResult(status || '조회 결과 없음');
  }

  return (
    <div className="page">
      <section className="subhero inner">
        <div className="kicker">채용 지원 폼 &amp; 지원 현황 트래킹</div>
        <h1>채용</h1>
        <p>공고를 확인하고 지원한 뒤, 접수번호로 지원 현황 트래킹까지 한 화면에서 진행할 수 있습니다.</p>
      </section>
      <section className="inner recruit-layout">
        <div>
          <h4 style={{fontSize:'13px', color:'var(--muted)', marginBottom:'18px', letterSpacing:'.04em'}}>진행 중인 채용공고</h4>
          {JOBS.map(j => (
            <div key={j.id} className="job-item">
              <div><h5>{j.title}</h5><span>{j.team}</span></div>
              <button className="job-apply-btn" onClick={() => setApplyOpen(j)}>지원하기</button>
            </div>
          ))}

          <div className="track-panel">
            <h4 style={{fontSize:'13px', letterSpacing:'.04em', marginBottom:'16px', opacity:.7}}>지원 현황 트래킹 조회</h4>
            <form onSubmit={lookupStatus} style={{display:'flex', gap:'10px'}}>
              <input value={lookupInput} onChange={e => setLookupInput(e.target.value)} placeholder="접수번호 입력 (예: CB-20260501)" style={{flex:1, background:'transparent', border:'1px solid rgba(255,255,255,.4)', color:'#fff', padding:'10px 14px', fontSize:'13px'}} />
              <button type="submit" className="pill pill-dark">조회</button>
            </form>
            {lookupResult && <div className={'status-badge ' + lookupResult}>{lookupResult}</div>}
          </div>
        </div>

        <div>
          <h4 style={{fontSize:'13px', color:'var(--muted)', marginBottom:'18px', letterSpacing:'.04em'}}>이력서 업로드 미리보기</h4>
          <div className={'dropzone' + (drag ? ' drag' : '')}
            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if(f) handleFile(f.name); }}
            onClick={() => fileRef.current.click()}>
            <i className="ti ti-file-upload" style={{fontSize:'28px'}}></i>
            <p style={{marginTop:'10px', fontSize:'14px'}}>{fileName || '이력서 PDF 파일을 드래그하거나 클릭해 업로드'}</p>
            <input ref={fileRef} type="file" accept="application/pdf" style={{display:'none'}} onChange={e => e.target.files[0] && handleFile(e.target.files[0].name)} />
            {fileName && <div className="progress-track"><div className="progress-bar" style={{width:progress + '%'}}></div></div>}
          </div>
          {receiptNo && <p style={{fontSize:'13px', color:'var(--accent)'}}>최근 발급 접수번호: {receiptNo}</p>}
        </div>
      </section>

      {applyOpen && (
        <div className="modal-overlay" onClick={() => setApplyOpen(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <span className="modal-close" onClick={() => setApplyOpen(null)} style={{cursor:'pointer'}}>&times;</span>
            <h3 style={{fontSize:'20px', marginBottom:'6px'}}>{applyOpen.title}</h3>
            <p style={{fontSize:'13px', color:'var(--muted)', marginBottom:'22px'}}>{applyOpen.team}</p>
            <form onSubmit={submitApply}>
              <div className="field"><label>이름</label><input value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="이름" /></div>
              <div className="field"><label>연락처</label><input value={form.phone} onChange={e => setForm({...form, phone:e.target.value})} placeholder="010-0000-0000" /></div>
              <div className="field"><label>이력서 (PDF)</label>
                <div className={'dropzone' + (drag ? ' drag' : '')} style={{padding:'18px'}} onClick={() => fileRef.current.click()}>
                  <p style={{fontSize:'13px'}}>{fileName || '이력서 PDF 업로드'}</p>
                </div>
              </div>
              <button type="submit" className="pill pill-fill" style={{width:'100%', marginTop:'8px'}}>지원 완료하기</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [page, setPage] = useState('home');
  const [locale, setLocale] = useState('ko');
  const [toastMsg, setToastMsg] = useState('');

  function toast(msg){
    setToastMsg(msg);
    setTimeout(() => setToastMsg(''), 2800);
  }

  useEffect(() => { window.scrollTo(0,0); }, [page]);

  let body;
  if(page === 'home') body = <HomePage setPage={setPage} locale={locale} />;
  else if(page === 'about') body = <AboutPage />;
  else if(page === 'newsroom') body = <NewsroomPage toast={toast} />;
  else if(page === 'casestudy') body = <CaseStudyPage />;
  else if(page === 'recruit') body = <RecruitPage toast={toast} />;

  return (
    <div style={{width:'100%'}}>
      <TopNav page={page} setPage={setPage} locale={locale} setLocale={setLocale} />
      {body}
      <footer>
        <div className="inner footer-cols">
          <div>코발트인더스트리<br/>© 2026 자체 개발 데모 프로젝트</div>
          <div>본사 · 1공장<br/>경기도 산업단지 내 위치</div>
          <div>고객센터<br/>영업 · 품질 · 채용 문의 접수</div>
        </div>
      </footer>
      <Toast msg={toastMsg} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
