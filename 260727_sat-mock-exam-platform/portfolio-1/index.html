<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모의고사 온라인 응시 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f5f5f5;
    --border:#e5e5e5;
    --border-strong:#d4d4d4;
    --text:#171717;
    --text2:#525252;
    --text3:#737373;
    --accent:#2563eb;
    --accent-soft:#dbeaff;
    --mint:#dcfce7;
    --primary:#0a0a0a;
    --radius-btn:8px;
    --radius-card:12px;
    --radius-pill:9999px;
    --radius-input:6px;
    --shadow-ring: 0 0 0 4px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseLive{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(37,99,235,.35);}50%{opacity:.55;box-shadow:0 0 0 6px rgba(37,99,235,0);}}
  @keyframes dashFlow{to{stroke-dashoffset:-40;}}
  @keyframes barGrow{from{width:0;}}
  @keyframes rippleFx{from{transform:scale(0);opacity:.45;}to{transform:scale(2.6);opacity:0;}}

  .app-shell{display:flex;width:100%;min-height:100vh;}

  /* ---- sidebar (linear-sidebar-cmdk) ---- */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:260px;
    background:var(--bg);border-right:1px solid var(--border);
    display:flex;flex-direction:column;z-index:20;
  }
  .sidebar-brand{
    height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .brand-mark{
    width:28px;height:28px;border-radius:8px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.2;overflow:hidden;}
  .brand-text b{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;}
  .brand-text span{font-size:11px;color:var(--text3);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}

  .sidebar-cmdk-hint{
    margin:12px 16px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-input);
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
  }
  .sidebar-cmdk-hint span{font-size:12px;color:var(--text3);}
  .kbd{
    font-size:11px;font-weight:600;color:var(--text2);background:#fff;border:1px solid var(--border-strong);
    border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums;
  }

  .sidebar-section-title{
    padding:14px 16px 6px;font-size:11px;font-weight:600;color:var(--text3);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .sidebar-nav{padding:0 10px;display:flex;flex-direction:column;gap:2px;}
  .sidebar-link{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-input);
    border:none;background:transparent;color:var(--text2);font-size:13.5px;font-weight:500;
    text-align:left;width:100%;position:relative;transition:background .12s ease,color .12s ease;
    text-decoration:none;cursor:pointer;box-sizing:border-box;
  }
  .sidebar-link svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.6;}
  .sidebar-link:hover{background:var(--surface);color:var(--text);}
  .sidebar-link.active{background:var(--accent-soft);color:#173a8a;}
  .sidebar-link.active::before{
    content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--accent);
  }
  .sidebar-link .count{
    margin-left:auto;font-size:11px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-pill);padding:1px 7px;color:var(--text3);
  }
  .sidebar-link.active .count{background:#fff;}

  .sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:8px;}
  .sidebar-avatar{width:26px;height:26px;border-radius:var(--radius-pill);background:var(--surface);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);}
  .sidebar-footer div b{display:block;font-size:12.5px;color:var(--text);}
  .sidebar-footer div span{font-size:11px;color:var(--text3);}

  /* ---- main ---- */
  .main-wrap{margin-left:260px;flex:1;min-width:0;width:calc(100% - 260px);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);z-index:10;
  }
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);}
  .breadcrumb a{color:var(--text3);text-decoration:none;}
  .breadcrumb b{color:var(--text);font-weight:600;}
  .breadcrumb .divider{color:var(--border-strong);}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .btn{
    border-radius:var(--radius-btn);border:1px solid var(--border);background:#fff;color:var(--text);
    font-size:13px;font-weight:500;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;
    position:relative;overflow:hidden;transition:border-color .12s ease,background .12s ease;
  }
  .btn:hover{border-color:var(--border-strong);background:var(--surface);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-cmdk{font-family:'Pretendard';font-variant-numeric:tabular-nums;}
  .ripple-el{position:absolute;border-radius:50%;background:rgba(0,0,0,.18);pointer-events:none;
    animation:rippleFx .55s ease-out forwards;}

  .content{
    padding:24px;flex:1;width:100%;max-width:1120px;
    background-image:radial-gradient(circle at 1px 1px, rgba(23,23,23,.08) 1px, transparent 0);
    background-size:22px 22px;
  }
  .view-fade{animation:fadeIn .28s ease both;}

  /* status strip */
  .status-strip{
    display:flex;align-items:center;gap:18px;padding:12px 16px;border:1px solid var(--border);
    border-radius:var(--radius-card);background:var(--surface);margin-bottom:20px;flex-wrap:wrap;
  }
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulseLive 1.8s ease-in-out infinite;}
  .status-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);}
  .status-item b{color:var(--text);font-variant-numeric:tabular-nums;font-size:14px;}
  .status-item.timer b{font-size:18px;font-weight:700;letter-spacing:.02em;}
  .status-warn{margin-left:auto;font-size:12px;color:#b45309;background:#fff7ed;border:1px solid #fed7aa;
    padding:4px 10px;border-radius:var(--radius-pill);display:flex;align-items:center;gap:5px;}

  /* primary focus: question card */
  .exam-grid{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start;}
  .q-card{border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;background:#fff;}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .q-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);background:var(--surface);
    border:1px solid var(--border);color:var(--text2);}
  .q-tag.subject{background:var(--accent-soft);color:#173a8a;border-color:transparent;}
  .q-title{font-size:16px;font-weight:600;color:var(--text);margin:0 0 10px;}
  .q-passage{font-size:14px;line-height:1.7;color:var(--text2);margin:0 0 18px;padding:14px;background:var(--surface);
    border-radius:var(--radius-input);}
  .choice-list{display:flex;flex-direction:column;gap:8px;}
  .choice{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);
    border-radius:var(--radius-input);background:#fff;text-align:left;width:100%;font-size:13.5px;color:var(--text);
    transition:border-color .12s ease,background .12s ease;
  }
  .choice:hover{border-color:var(--border-strong);}
  .choice.selected{border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .choice .badge{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0;}
  .choice.selected .badge{background:var(--accent);border-color:var(--accent);color:#fff;}
  .q-actions{display:flex;justify-content:space-between;margin-top:20px;}

  /* priority rail */
  .rail{border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;background:#fff;}
  .rail h4{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;}
  .rail-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .rail-cell{
    aspect-ratio:1/1;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11.5px;
    font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;position:relative;
  }
  .rail-cell.answered{background:var(--mint);border-color:#86efac;color:#166534;}
  .rail-cell.current{outline:2px solid var(--accent);outline-offset:1px;}
  .rail-cell.flagged::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#f59e0b;}
  .rail-legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:11.5px;color:var(--text3);}
  .rail-legend div{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:3px;flex-shrink:0;}

  /* secondary strip */
  .secondary-strip{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .progress-track{flex:1;height:8px;border-radius:var(--radius-pill);background:var(--surface);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:var(--accent);border-radius:var(--radius-pill);animation:barGrow .6s ease both;}
  .secondary-strip span{font-size:12px;color:var(--text3);white-space:nowrap;}

  /* cmdk overlay */
  .cmdk-overlay{
    position:fixed;inset:0;background:rgba(15,15,15,.35);display:flex;align-items:flex-start;
    justify-content:center;padding-top:14vh;z-index:100;
  }
  .cmdk-modal{width:520px;max-width:92vw;background:#fff;border-radius:14px;border:1px solid var(--border);
    box-shadow:0 20px 20px rgba(0,0,0,.09);overflow:hidden;animation:fadeIn .18s ease both;}
  .cmdk-input{width:100%;border:none;border-bottom:1px solid var(--border);padding:16px;font-size:14px;
    outline:none;font-family:'Pretendard';}
  .cmdk-results{max-height:340px;overflow:auto;padding:8px;}
  .cmdk-group-title{font-size:11px;color:var(--text3);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.04em;}
  .cmdk-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
    text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text);}
  .cmdk-item:hover{background:var(--surface);}
  .cmdk-item svg{width:15px;height:15px;color:var(--text3);}

  /* question navigator page */
  .filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-chip{padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);background:#fff;
    font-size:12.5px;color:var(--text2);font-weight:500;}
  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
  .nav-cell{aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;
    font-weight:700;color:var(--text2);position:relative;}
  .nav-cell.answered{background:var(--mint);border-color:#86efac;color:#166534;}
  .nav-cell.flagged{background:#fff7ed;border-color:#fed7aa;color:#b45309;}
  .nav-cell.selected{outline:2px solid var(--accent);outline-offset:1px;}
  .qn-detail{border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;margin-top:20px;background:var(--surface);}

  /* submission page */
  .flow-diagram{border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;background:#fff;margin-bottom:20px;}
  .flow-nodes{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .flow-node{flex:1;text-align:center;padding:14px 10px;border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);}
  .flow-node b{display:block;font-size:13px;color:var(--text);margin-bottom:4px;}
  .flow-node span{font-size:11px;color:var(--text3);}
  .sim-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;}
  .stat-box{border:1px solid var(--border);border-radius:var(--radius-input);padding:14px;text-align:center;background:#fff;}
  .stat-box b{display:block;font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .stat-box span{font-size:11.5px;color:var(--text3);}
  .sub-table{width:100%;border-collapse:collapse;font-size:13px;}
  .sub-table th{text-align:left;color:var(--text3);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  .sub-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text2);}
  .row-badge{font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);font-weight:600;}
  .row-badge.done{background:var(--mint);color:#166534;}
  .row-badge.wait{background:var(--surface);color:var(--text3);border:1px solid var(--border);}
  .row-badge.proc{background:var(--accent-soft);color:#173a8a;}

  /* grading page */
  .grade-hero{display:flex;gap:24px;align-items:center;border:1px solid var(--border);border-radius:var(--radius-card);
    padding:24px;margin-bottom:20px;background:#fff;}
  .grade-score{font-size:44px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .grade-bars{flex:1;display:flex;flex-direction:column;gap:10px;}
  .grade-bar-row{display:flex;align-items:center;gap:10px;}
  .grade-bar-row span{width:56px;font-size:12px;color:var(--text3);flex-shrink:0;}
  .grade-bar-track{flex:1;height:8px;background:var(--surface);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--border);}
  .grade-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-pill);animation:barGrow .8s ease both;}
  .access-banner{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text3);border:1px dashed var(--border-strong);
    border-radius:var(--radius-input);padding:10px 14px;margin-bottom:16px;}
  .qr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  .qr-row .ok{color:#16a34a;}
  .qr-row .no{color:#dc2626;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;padding:12px 18px;
    border-radius:var(--radius-input);font-size:13px;display:flex;align-items:center;gap:8px;
    box-shadow:0 10px 15px rgba(0,0,0,.15);z-index:200;animation:fadeIn .2s ease both;}

  @media (max-width:960px){
    .exam-grid{grid-template-columns:1fr;}
    .nav-grid{grid-template-columns:repeat(6,1fr);}
  }
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const NAV_ITEMS = [
  { key: 'main', label: '실시간 응시 화면', icon: 'monitor-play' },
  { key: 'question-nav', label: '문제 네비게이터', icon: 'grid-3x3' },
  { key: 'submission', label: '동시 제출 처리', icon: 'git-merge' },
  { key: 'grading', label: '자동 채점 리포트', icon: 'clipboard-check' },
];

const TOTAL_Q = 20;
const SUBJECTS = ['국어', '수학', '영어'];

function buildQuestions() {
  const passages = [
    '다음 글의 중심 내용으로 가장 적절한 것을 고르시오.',
    '밑줄 친 부분과 문맥상 의미가 가장 가까운 것을 고르시오.',
    '다음 함수의 극값을 구하는 과정으로 옳은 것을 고르시오.',
    '주어진 지문을 바탕으로 필자의 주장을 추론하시오.',
    '다음 대화의 흐름상 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.',
  ];
  const arr = [];
  for (let i = 1; i <= TOTAL_Q; i++) {
    arr.push({
      id: i,
      subject: SUBJECTS[i % 3],
      difficulty: i % 3 === 0 ? '상' : i % 3 === 1 ? '중' : '하',
      prompt: passages[i % passages.length],
      passage: '모의고사 문제은행에서 불러온 지문 데이터입니다. 학생은 이 화면에서 지문을 읽고 보기 중 하나를 선택하며, 선택 즉시 서버로 임시 저장 요청이 전송됩니다.',
      choices: ['보기 A', '보기 B', '보기 C', '보기 D', '보기 E'],
    });
  }
  return arr;
}

function Icon({ name, ...rest }) {
  return <i data-lucide={name} {...rest}></i>;
}

function useLucideRefresh(deps) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
}

function RippleButton({ className, onClick, children, ...rest }) {
  const ref = useRef(null);
  const handle = (e) => {
    const btn = ref.current;
    if (btn) {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const span = document.createElement('span');
      span.className = 'ripple-el';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      setTimeout(() => span.remove(), 550);
    }
    onClick && onClick(e);
  };
  return (
    <button ref={ref} className={className} onClick={handle} {...rest}>
      {children}
    </button>
  );
}

function Sidebar({ activeView, setActiveView, answeredCount }) {
  useLucideRefresh([activeView]);
  return (
    <aside className="sidebar" data-sidebar>
      <div className="sidebar-brand">
        <div className="brand-mark"><Icon name="graduation-cap" width="15" height="15" /></div>
        <div className="brand-text">
          <b>모의고사 콘솔</b>
          <span>2026 정기 모의고사 · 3교시</span>
        </div>
      </div>
      <div className="sidebar-cmdk-hint">
        <span>빠른 이동</span>
        <span className="kbd">⌘ K</span>
      </div>
      <div className="sidebar-section-title">응시 워크플로우</div>
      <nav className="sidebar-nav">
        {NAV_ITEMS.map((item) => (
          <a
            key={item.key}
            className={'sidebar-link' + (activeView === item.key ? ' active' : '')}
            onClick={() => setActiveView(item.key)}
          >
            <Icon name={item.icon} />
            {item.label}
            {item.key === 'main' && <span className="count">{answeredCount}/{TOTAL_Q}</span>}
          </a>
        ))}
      </nav>
      <div className="sidebar-footer">
        <div className="sidebar-avatar">학</div>
        <div>
          <b>응시자 계정</b>
          <span>role: student</span>
        </div>
      </div>
    </aside>
  );
}

function Breadcrumb({ label }) {
  return (
    <div className="breadcrumb">
      <a>모의고사</a>
      <span className="divider">/</span>
      <a>2026 정기 모의고사</a>
      <span className="divider">/</span>
      <b>{label}</b>
    </div>
  );
}

function CmdkOverlay({ open, onClose, onNavigate }) {
  const [q, setQ] = useState('');
  useLucideRefresh([open]);
  useEffect(() => {
    if (open) setQ('');
  }, [open]);
  if (!open) return null;
  const filtered = NAV_ITEMS.filter((n) => n.label.includes(q));
  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk-modal" onClick={(e) => e.stopPropagation()}>
        <input
          className="cmdk-input"
          autoFocus
          placeholder="명령 또는 화면 검색…"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        <div className="cmdk-results">
          <div className="cmdk-group-title">화면 이동</div>
          {filtered.map((n) => (
            <button key={n.key} className="cmdk-item" onClick={() => { onNavigate(n.key); onClose(); }}>
              <Icon name={n.icon} /> {n.label}
            </button>
          ))}
          {filtered.length === 0 && <div className="cmdk-item">검색 결과가 없습니다</div>}
        </div>
      </div>
    </div>
  );
}

function MainView({ questions, qIndex, setQIndex, answers, setAnswers, flagged, setFlagged, timeLeft, showToast }) {
  useLucideRefresh([qIndex]);
  const current = questions[qIndex - 1];
  const selected = answers[current.id];

  const selectChoice = (idx) => {
    setAnswers((prev) => ({ ...prev, [current.id]: idx }));
    showToast('답안이 자동 저장되었습니다');
  };

  const goto = (n) => { if (n >= 1 && n <= TOTAL_Q) setQIndex(n); };

  const answeredCount = Object.keys(answers).length;
  const pct = Math.round((answeredCount / TOTAL_Q) * 100);
  const mm = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const ss = String(timeLeft % 60).padStart(2, '0');

  return (
    <div className="view-fade">
      {/* status-strip region */}
      <div className="status-strip">
        <div className="status-item timer">
          <span className="live-dot"></span>
          <Icon name="timer" width="15" height="15" />
          <b>{mm}:{ss}</b>
          <span>남은 시간 (서버 동기화)</span>
        </div>
        <div className="status-item">
          <Icon name="cloud-check" width="15" height="15" />
          <span>자동저장 완료 · 방금 전</span>
        </div>
        {timeLeft < 300 && (
          <div className="status-warn">
            <Icon name="alert-triangle" width="13" height="13" /> 제출 임박
          </div>
        )}
      </div>

      {/* primary-focus + priority-rail regions */}
      <div className="exam-grid">
        <div className="q-card">
          <div className="q-meta">
            <span className="q-tag subject">{current.subject}</span>
            <span className="q-tag">난이도 {current.difficulty}</span>
            <span className="q-tag">{current.id}번 / {TOTAL_Q}문항</span>
          </div>
          <h3 className="q-title">{current.prompt}</h3>
          <p className="q-passage">{current.passage}</p>
          <div className="choice-list">
            {current.choices.map((c, idx) => (
              <button
                key={idx}
                className={'choice' + (selected === idx ? ' selected' : '')}
                onClick={() => selectChoice(idx)}
              >
                <span className="badge">{String.fromCharCode(65 + idx)}</span>
                {c}
              </button>
            ))}
          </div>
          <div className="q-actions">
            <RippleButton className="btn" onClick={() => goto(qIndex - 1)}>
              <Icon name="chevron-left" width="15" height="15" /> 이전 문항
            </RippleButton>
            <div style={{ display: 'flex', gap: 8 }}>
              <RippleButton
                className="btn"
                onClick={() => {
                  setFlagged((prev) => {
                    const next = new Set(prev);
                    next.has(current.id) ? next.delete(current.id) : next.add(current.id);
                    return next;
                  });
                  showToast(flagged.has(current.id) ? '검토표시가 해제되었습니다' : '검토표시로 등록되었습니다');
                }}
              >
                <Icon name="flag" width="15" height="15" /> 검토표시
              </RippleButton>
              <RippleButton className="btn btn-primary" onClick={() => goto(qIndex + 1)}>
                다음 문항 <Icon name="chevron-right" width="15" height="15" />
              </RippleButton>
            </div>
          </div>
        </div>

        <div className="rail">
          <h4>문항 네비게이터</h4>
          <div className="rail-grid">
            {questions.map((q) => {
              const isAnswered = answers[q.id] !== undefined;
              const isFlagged = flagged.has(q.id);
              return (
                <button
                  key={q.id}
                  className={
                    'rail-cell' +
                    (isAnswered ? ' answered' : '') +
                    (q.id === qIndex ? ' current' : '') +
                    (isFlagged ? ' flagged' : '')
                  }
                  onClick={() => goto(q.id)}
                  title={q.id + '번 문항으로 이동'}
                >
                  {q.id}
                </button>
              );
            })}
          </div>
          <div className="rail-legend">
            <div><span className="dot" style={{ background: '#dcfce7', border: '1px solid #86efac' }}></span>답변완료</div>
            <div><span className="dot" style={{ background: '#fff', border: '1px solid #d4d4d4' }}></span>미답변</div>
            <div><span className="dot" style={{ background: '#f59e0b' }}></span>검토표시</div>
          </div>
        </div>
      </div>

      {/* secondary region */}
      <div className="secondary-strip">
        <div className="progress-track">
          <div className="progress-fill" style={{ width: pct + '%' }}></div>
        </div>
        <span>{pct}% 완료 · {answeredCount}/{TOTAL_Q}문항</span>
      </div>
    </div>
  );
}

function QuestionNavView({ questions, answers, flagged, qIndex, setQIndex, setActiveView }) {
  const [filter, setFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  useLucideRefresh([filter, selected]);

  const filters = [
    { key: 'all', label: '전체' },
    { key: 'answered', label: '답변완료' },
    { key: 'unanswered', label: '미답변' },
    { key: 'flagged', label: '검토표시' },
  ];

  const matches = (q) => {
    if (filter === 'answered') return answers[q.id] !== undefined;
    if (filter === 'unanswered') return answers[q.id] === undefined;
    if (filter === 'flagged') return flagged.has(q.id);
    return true;
  };

  const selectedQ = selected ? questions.find((q) => q.id === selected) : null;

  return (
    <div className="view-fade">
      <div className="filter-row">
        {filters.map((f) => (
          <button
            key={f.key}
            className={'filter-chip' + (filter === f.key ? ' active' : '')}
            onClick={() => setFilter(f.key)}
          >
            {f.label}
          </button>
        ))}
      </div>
      <div className="nav-grid">
        {questions.map((q) => {
          const isAnswered = answers[q.id] !== undefined;
          const isFlagged = flagged.has(q.id);
          const visible = matches(q);
          return (
            <button
              key={q.id}
              className={
                'nav-cell' +
                (isAnswered ? ' answered' : '') +
                (isFlagged ? ' flagged' : '') +
                (selected === q.id ? ' selected' : '')
              }
              style={{ opacity: visible ? 1 : 0.25 }}
              onClick={() => setSelected(q.id)}
            >
              {q.id}
            </button>
          );
        })}
      </div>
      {selectedQ && (
        <div className="qn-detail">
          <div className="q-meta">
            <span className="q-tag subject">{selectedQ.subject}</span>
            <span className="q-tag">난이도 {selectedQ.difficulty}</span>
          </div>
          <p style={{ fontSize: 13.5, color: 'var(--text2)', margin: '10px 0' }}>{selectedQ.prompt}</p>
          <p style={{ fontSize: 12.5, color: 'var(--text3)', margin: '0 0 14px' }}>
            상태: {answers[selectedQ.id] !== undefined ? '답변완료' : '미답변'}
            {flagged.has(selectedQ.id) ? ' · 검토표시됨' : ''}
          </p>
          <RippleButton
            className="btn btn-primary"
            onClick={() => { setQIndex(selectedQ.id); setActiveView('main'); }}
          >
            <Icon name="arrow-right" width="14" height="14" /> 이 문항 응시화면으로 이동
          </RippleButton>
        </div>
      )}
    </div>
  );
}

function SubmissionView({ showToast }) {
  const [running, setRunning] = useState(false);
  const [rows, setRows] = useState([]);
  const [stats, setStats] = useState({ done: 0, proc: 0, wait: 0 });
  useLucideRefresh([running, rows.length]);

  const runSimulation = () => {
    if (running) return;
    setRunning(true);
    const N = 24;
    setRows([]);
    setStats({ done: 0, proc: 0, wait: N });
    showToast('동시 접속 시뮬레이션을 시작합니다');
    for (let i = 1; i <= N; i++) {
      setTimeout(() => {
        setStats((s) => ({ ...s, wait: s.wait - 1, proc: s.proc + 1 }));
      }, i * 80);
      setTimeout(() => {
        setStats((s) => ({ ...s, proc: s.proc - 1, done: s.done + 1 }));
        setRows((r) => [
          {
            id: i,
            student: '응시자 #' + (1000 + i),
            time: new Date().toLocaleTimeString('ko-KR', { hour12: false }),
            status: 'done',
          },
          ...r,
        ].slice(0, 8));
        if (i === N) setRunning(false);
      }, i * 80 + 420);
    }
  };

  return (
    <div className="view-fade">
      <div className="flow-diagram">
        <h4 style={{ margin: '0 0 16px', fontSize: 13, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
          제출 처리 파이프라인
        </h4>
        <div className="flow-nodes">
          <div className="flow-node">
            <b>제출 큐</b>
            <span>동시 요청 버퍼링</span>
          </div>
          <svg width="48" height="18" style={{ flexShrink: 0 }}>
            <circle cx="2" cy="9" r="2" fill="var(--accent)" />
            <line x1="4" y1="9" x2="44" y2="9" stroke="var(--accent)" strokeWidth="2" strokeDasharray="6 4" style={{ animation: 'dashFlow 1s linear infinite' }} />
            <circle cx="46" cy="9" r="2" fill="var(--accent)" />
          </svg>
          <div className="flow-node">
            <b>트랜잭션 락</b>
            <span>SELECT … FOR UPDATE</span>
          </div>
          <svg width="48" height="18" style={{ flexShrink: 0 }}>
            <circle cx="2" cy="9" r="2" fill="var(--accent)" />
            <line x1="4" y1="9" x2="44" y2="9" stroke="var(--accent)" strokeWidth="2" strokeDasharray="6 4" style={{ animation: 'dashFlow 1s linear infinite' }} />
            <circle cx="46" cy="9" r="2" fill="var(--accent)" />
          </svg>
          <div className="flow-node">
            <b>DB 커밋</b>
            <span>정합성 확정 기록</span>
          </div>
        </div>
        <div className="sim-stats">
          <div className="stat-box"><b>{stats.wait}</b><span>대기 중</span></div>
          <div className="stat-box"><b>{stats.proc}</b><span>처리 중</span></div>
          <div className="stat-box"><b>{stats.done}</b><span>완료</span></div>
        </div>
        <RippleButton className="btn btn-primary" onClick={runSimulation} disabled={running}>
          <Icon name="play" width="14" height="14" /> {running ? '시뮬레이션 진행 중…' : '동시 접속 시뮬레이션 실행'}
        </RippleButton>
      </div>

      <div className="q-card">
        <h4 style={{ margin: '0 0 12px', fontSize: 13, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
          최근 제출 로그
        </h4>
        <table className="sub-table">
          <thead>
            <tr><th>응시자</th><th>제출 시각</th><th>처리 상태</th></tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan="3" style={{ color: 'var(--text3)' }}>시뮬레이션을 실행하면 제출 로그가 표시됩니다.</td></tr>
            )}
            {rows.map((r) => (
              <tr key={r.id}>
                <td>{r.student}</td>
                <td>{r.time}</td>
                <td><span className="row-badge done">제출 완료</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function GradingView({ questions, answers }) {
  const [animScore, setAnimScore] = useState(0);
  useLucideRefresh([animScore]);
  const finalScore = 82;

  useEffect(() => {
    let n = 0;
    const t = setInterval(() => {
      n += 4;
      if (n >= finalScore) { n = finalScore; clearInterval(t); }
      setAnimScore(n);
    }, 24);
    return () => clearInterval(t);
  }, []);

  const bySubject = SUBJECTS.map((s) => {
    const total = questions.filter((q) => q.subject === s).length;
    const correctRate = s === '국어' ? 78 : s === '수학' ? 64 : 91;
    return { subject: s, total, rate: correctRate };
  });

  return (
    <div className="view-fade">
      <div className="access-banner">
        <Icon name="lock" width="14" height="14" /> 역할 기반 접근 제어 — 본인 성적만 조회 가능한 화면입니다.
      </div>
      <div className="grade-hero">
        <div>
          <div className="grade-score">{animScore}<span style={{ fontSize: 18, color: 'var(--text3)' }}>점</span></div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>총점 (100점 만점)</div>
        </div>
        <div className="grade-bars">
          {bySubject.map((b) => (
            <div className="grade-bar-row" key={b.subject}>
              <span>{b.subject}</span>
              <div className="grade-bar-track">
                <div className="grade-bar-fill" style={{ width: b.rate + '%' }}></div>
              </div>
              <span style={{ width: 34, textAlign: 'right' }}>{b.rate}%</span>
            </div>
          ))}
        </div>
      </div>

      <div className="q-card">
        <h4 style={{ margin: '0 0 4px', fontSize: 13, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
          문항별 정오표
        </h4>
        {questions.slice(0, 10).map((q) => {
          const answered = answers[q.id] !== undefined;
          const correct = answered && (q.id % 4 !== 0);
          return (
            <div className="qr-row" key={q.id}>
              <Icon name={correct ? 'check-circle-2' : 'x-circle'} width="16" height="16" className={correct ? 'ok' : 'no'} />
              <span style={{ width: 46 }}>{q.id}번</span>
              <span style={{ color: 'var(--text3)', width: 60 }}>{q.subject}</span>
              <span style={{ color: 'var(--text3)' }}>난이도 {q.difficulty}</span>
              <span style={{ marginLeft: 'auto', color: 'var(--text3)' }}>{answered ? (correct ? '정답' : '오답') : '미제출'}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [activeView, setActiveView] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [questions] = useState(buildQuestions);
  const [qIndex, setQIndex] = useState(1);
  const [answers, setAnswers] = useState({});
  const [flagged, setFlagged] = useState(new Set());
  const [timeLeft, setTimeLeft] = useState(58 * 60 + 12);
  const [toast, setToast] = useState(null);

  useLucideRefresh([activeView]);

  useEffect(() => {
    const t = setInterval(() => setTimeLeft((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setCmdkOpen((v) => !v);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => setToast(null), 2200);
  };

  const labelOf = (key) => (NAV_ITEMS.find((n) => n.key === key) || {}).label || '';

  return (
    <div className="app-shell">
      <Sidebar activeView={activeView} setActiveView={setActiveView} answeredCount={Object.keys(answers).length} />
      <div className="main-wrap">
        <header className="topbar">
          <Breadcrumb label={labelOf(activeView)} />
          <div className="topbar-actions">
            <RippleButton className="btn btn-cmdk" onClick={() => setCmdkOpen(true)}>
              <Icon name="search" width="14" height="14" /> 검색 ⌘ K
            </RippleButton>
            <RippleButton className="btn btn-primary" onClick={() => showToast('리포트를 PDF로 내보냅니다')}>
              <Icon name="download" width="14" height="14" /> 리포트 내보내기
            </RippleButton>
          </div>
        </header>
        <div className="content">
          {activeView === 'main' && (
            <MainView
              questions={questions}
              qIndex={qIndex}
              setQIndex={setQIndex}
              answers={answers}
              setAnswers={setAnswers}
              flagged={flagged}
              setFlagged={setFlagged}
              timeLeft={timeLeft}
              showToast={showToast}
            />
          )}
          {activeView === 'question-nav' && (
            <QuestionNavView
              questions={questions}
              answers={answers}
              flagged={flagged}
              qIndex={qIndex}
              setQIndex={setQIndex}
              setActiveView={setActiveView}
            />
          )}
          {activeView === 'submission' && <SubmissionView showToast={showToast} />}
          {activeView === 'grading' && <GradingView questions={questions} answers={answers} />}
        </div>
      </div>
      <CmdkOverlay open={cmdkOpen} onClose={() => setCmdkOpen(false)} onNavigate={setActiveView} />
      {toast && (
        <div className="toast">
          <Icon name="check" width="14" height="14" /> {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
