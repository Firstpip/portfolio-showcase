<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모의고사 운영 분석 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/phosphor-icons@1.4.2/src/css/phosphor.css" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#fdfbf7;
    --surface:#f7f2ea;
    --ash:#efefef;
    --card:#ffffff;
    --border:#e8e8e8;
    --text:#202020;
    --text2:#4d4d4d;
    --text3:#828282;
    --primary:#ff682c;
    --primary-wash:#fff1e8;
    --accent:#0f9a82;
    --accent-bright:#1ef6c7;
    --brass:#816729;
    --radius-card:16px;
    --radius-sharp:6px 0px 0px 0px;
    --shadow-elevated:0 14px 28px rgba(32,32,32,.08), 0 2px 6px rgba(32,32,32,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseLive{0%,100%{opacity:1;}50%{opacity:.45;}}
  @keyframes chartDraw{from{stroke-dashoffset:600;}to{stroke-dashoffset:0;}}
  @keyframes barGrow{from{height:0;}}
  @keyframes rippleFx{from{transform:scale(0);opacity:.4;}to{transform:scale(2.6);opacity:0;}}
  @keyframes countPulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

  .shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

  /* ---- topbar-analytics header ---- */
  .app-header{
    position:sticky;top:0;z-index:30;background:rgba(253,251,247,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;
    padding:0 28px;height:64px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--text);flex-shrink:0;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:flex;
    align-items:center;justify-content:center;}
  .project-switcher{
    position:relative;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--ash);
    border-radius:200px;border:none;font-size:12.5px;font-weight:600;color:var(--text2);flex-shrink:0;
  }
  .switcher-menu{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--border);
    border-radius:12px;box-shadow:var(--shadow-elevated);width:220px;padding:6px;z-index:40;}
  .switcher-item{width:100%;text-align:left;background:transparent;border:none;padding:9px 10px;border-radius:8px;
    font-size:12.5px;color:var(--text2);}
  .switcher-item:hover{background:var(--surface);}
  .global-nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;}
  .nav-link{background:transparent;border:none;color:var(--text3);font-size:13px;font-weight:600;padding:9px 14px;
    border-radius:200px;white-space:nowrap;}
  .nav-link:hover{color:var(--text);background:var(--ash);}
  .nav-link.active{color:var(--text);background:var(--primary-wash);}
  .header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--text2);position:relative;}
  .icon-btn i{font-size:16px;}
  .avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--text);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

  /* ---- tab bar ---- */
  .tab-bar{display:flex;gap:4px;padding:12px 28px;border-bottom:1px solid var(--border);background:var(--bg);}
  .tab{background:transparent;border:none;padding:8px 4px;margin-right:22px;font-size:13px;font-weight:600;
    color:var(--text3);border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-bottom-color:var(--primary);}

  .content{max-width:1320px;margin:0 auto;width:100%;padding:28px;flex:1;}
  .view-fade{animation:fadeIn .3s ease both;}

  /* stat row (KPI cards, archetype signature) */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .stat-card{background:var(--card);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-elevated);
    transition:transform .15s ease, box-shadow .15s ease;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 20px 32px rgba(32,32,32,.11);}
  .stat-label{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .stat-value{font-size:36px;font-weight:400;color:var(--text);font-variant-numeric:tabular-nums;
    animation:countPulse .4s ease;}
  .stat-value small{font-size:14px;color:var(--text3);font-weight:500;}
  .stat-delta{font-size:12px;color:var(--accent);margin-top:6px;display:flex;align-items:center;gap:4px;}
  .sparkline{margin-top:10px;}

  /* two-column: hero-viz + kpi-side */
  .analysis-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
  .panel{background:var(--card);border-radius:var(--radius-card);padding:28px;box-shadow:var(--shadow-elevated);}
  .panel.sharp-corner{border-radius:var(--radius-sharp) 16px 16px 16px;}
  .panel h4{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;}
  .panel .sub{font-size:12px;color:var(--text3);margin-bottom:18px;}
  .chart-wrap{position:relative;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;
    animation:pulseLive 1.6s ease-in-out infinite;margin-right:6px;}

  .kpi-list{display:flex;flex-direction:column;gap:0;}
  .kpi-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
  .kpi-row:last-child{border-bottom:none;}
  .kpi-row .name{font-size:12.5px;color:var(--text2);}
  .kpi-row .val{font-size:13px;font-weight:700;color:var(--text);}
  .kpi-row .val.hi{color:var(--accent);}
  .kpi-row .val.lo{color:var(--primary);}

  /* widget grid */
  .widget-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  .session-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .session-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow-elevated);}
  .session-card b{display:block;font-size:13.5px;color:var(--text);margin-bottom:8px;}
  .status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:200px;display:inline-block;margin-bottom:10px;}
  .status-pill.wait{background:var(--ash);color:var(--text3);}
  .status-pill.run{background:#e6f9f4;color:var(--accent);}
  .status-pill.end{background:var(--primary-wash);color:var(--primary);}
  .timeline-list{display:flex;flex-direction:column;gap:10px;}
  .timeline-item{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text2);}
  .timeline-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}

  /* buttons */
  .btn{border-radius:0px;border:1px solid var(--text);background:transparent;color:var(--text);font-size:13px;
    font-weight:600;padding:10px 20px;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden;}
  .btn-cta{background:var(--text);color:#fff;border-color:var(--text);}
  .btn-accent{background:var(--accent-bright);color:#0a2e27;border-color:var(--accent-bright);}
  .ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;
    animation:rippleFx .55s ease-out forwards;}

  /* analytics view */
  .filter-row{display:flex;gap:8px;margin-bottom:16px;}
  .filter-chip{padding:7px 14px;border-radius:200px;border:1px solid var(--border);background:#fff;
    font-size:12px;color:var(--text2);font-weight:600;}
  .filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);}
  .q-table{width:100%;border-collapse:collapse;font-size:13px;}
  .q-table th{text-align:left;color:var(--text3);font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border);}
  .q-table td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text2);}
  .q-table tr{cursor:pointer;}
  .q-table tr:hover{background:var(--surface);}
  .rate-track{width:90px;height:6px;background:var(--ash);border-radius:200px;overflow:hidden;display:inline-block;
    vertical-align:middle;margin-right:8px;}
  .rate-fill{height:100%;border-radius:200px;animation:barGrow .6s ease both;}
  .outlier{color:var(--primary);font-weight:700;}

  /* load-test view */
  .scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .scenario-card{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow-elevated);}
  .scenario-card b{font-size:13.5px;color:var(--text);}
  .scenario-card .meta{font-size:11.5px;color:var(--text3);margin:6px 0 10px;}
  .bt-bars{display:flex;align-items:flex-end;gap:6px;height:90px;}
  .bt-bar{flex:1;background:var(--accent-bright);border-radius:4px 4px 0 0;animation:barGrow .7s ease both;}
  .bt-bar.bottleneck{background:var(--primary);}

  /* sessions view */
  .session-full-card{background:var(--card);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-elevated);
    display:flex;align-items:center;gap:20px;margin-bottom:12px;}
  .session-full-card .info{flex:1;}
  .session-full-card b{font-size:14.5px;color:var(--text);display:block;margin-bottom:4px;}
  .session-full-card .meta{font-size:12px;color:var(--text3);}
  .mini-progress{width:120px;height:6px;background:var(--ash);border-radius:200px;overflow:hidden;}
  .mini-progress-fill{height:100%;background:var(--accent-bright);animation:barGrow .6s ease both;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 18px;
    border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-elevated);
    z-index:200;animation:fadeIn .2s ease both;}

  @media (max-width:1080px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .analysis-grid, .widget-grid{grid-template-columns:1fr;}
    .scenario-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body data-archetype="topbar-analytics">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const NAV_ITEMS = [
  { key: 'main', label: '실시간 응시 현황 모니터링', icon: 'ph-broadcast' },
  { key: 'analytics', label: '문제별 정답률 분석', icon: 'ph-chart-bar' },
  { key: 'load-test', label: '부하 테스트 대시보드', icon: 'ph-gauge' },
  { key: 'sessions', label: '다중 시험 세션 관리', icon: 'ph-stack' },
];

const QUESTIONS = Array.from({ length: 24 }, (_, i) => ({
  id: i + 1,
  subject: ['국어', '수학', '영어'][i % 3],
  difficulty: ['하', '중', '상'][i % 3],
  rate: [92, 88, 74, 81, 45, 67, 90, 38, 71, 84, 55, 79][i % 12],
}));

function Icon({ name, ...rest }) { return <i className={'ph ' + name} {...rest}></i>; }

function RippleButton({ className, onClick, children, ...rest }) {
  const handle = (e) => {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple-el';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 550);
    onClick && onClick(e);
  };
  return <button className={className} onClick={handle} {...rest}>{children}</button>;
}

function Sparkline({ points, color }) {
  const d = points.map((p, i) => (i === 0 ? 'M' : 'L') + (i * 12) + ',' + (30 - p * 2.4)).join(' ');
  return (
    <svg className="sparkline" width="100" height="32" viewBox="0 0 100 32">
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

function HeroChart({ range }) {
  const base = range === 'today' ? [12, 18, 30, 52, 74, 91, 88, 60, 40] : range === 'week' ? [30, 42, 38, 55, 70, 66, 80, 74, 68] : [20, 35, 44, 40, 58, 62, 71, 69, 77];
  const pts = base.map((v, i) => [i * 62, 190 - v * 1.7]);
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
  const area = path + ' L' + pts[pts.length - 1][0] + ',200 L0,200 Z';
  return (
    <svg width="100%" height="200" viewBox="0 0 500 200" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#ff682c" stopOpacity="0.18" />
          <stop offset="100%" stopColor="#ff682c" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#areaFill)" />
      <path d={path} fill="none" stroke="#ff682c" strokeWidth="2.5" strokeDasharray="600" style={{ animation: 'chartDraw 1.1s ease forwards' }} />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill="#ffffff" stroke="#ff682c" strokeWidth="2" />)}
    </svg>
  );
}

function Header({ activeView, setActiveView, showToast }) {
  const [switcherOpen, setSwitcherOpen] = useState(false);
  return (
    <header className="app-header">
      <div className="brand">
        <div className="brand-mark"><Icon name="ph-chart-line-up" /></div>
        운영 콘솔
      </div>
      <div style={{ position: 'relative' }}>
        <button className="project-switcher" onClick={() => setSwitcherOpen((v) => !v)}>
          2026 정기 모의고사 <Icon name="ph-caret-down" />
        </button>
        {switcherOpen && (
          <div className="switcher-menu">
            <button className="switcher-item" onClick={() => { showToast('2026 정기 모의고사로 전환되었습니다'); setSwitcherOpen(false); }}>2026 정기 모의고사</button>
            <button className="switcher-item" onClick={() => { showToast('2026 여름방학 특강반으로 전환되었습니다'); setSwitcherOpen(false); }}>2026 여름방학 특강반</button>
            <button className="switcher-item" onClick={() => { showToast('2025 누적 문제은행으로 전환되었습니다'); setSwitcherOpen(false); }}>2025 누적 문제은행</button>
          </div>
        )}
      </div>
      <nav className="global-nav">
        {NAV_ITEMS.map((n) => (
          <button key={n.key} className={'nav-link' + (activeView === n.key ? ' active' : '')} onClick={() => setActiveView(n.key)}>
            {n.label}
          </button>
        ))}
      </nav>
      <div className="header-actions">
        <button className="icon-btn" onClick={() => showToast('검색창을 엽니다')}><Icon name="ph-magnifying-glass" /></button>
        <button className="icon-btn" onClick={() => showToast('알림 3건이 있습니다')}><Icon name="ph-bell" /></button>
        <button className="avatar-btn" onClick={() => showToast('운영자 계정 메뉴')}>관</button>
      </div>
    </header>
  );
}

function MainView({ range, setRange, showToast }) {
  const rangeMultiplier = range === 'today' ? 1 : range === 'week' ? 6.2 : 24.5;
  return (
    <div className="view-fade">
      <div className="tab-bar" style={{ padding: 0, border: 'none', marginBottom: 20 }}>
        {[['today', '오늘'], ['week', '이번 주'], ['month', '이번 달']].map(([k, l]) => (
          <button key={k} className={'tab' + (range === k ? ' active' : '')} onClick={() => setRange(k)}>{l}</button>
        ))}
      </div>

      <div className="stat-row">
        <div className="stat-card">
          <div className="stat-label"><span className="live-dot"></span>실시간 접속자</div>
          <div className="stat-value">{Math.round(214 * (range === 'today' ? 1 : 0.4))}<small> 명</small></div>
          <Sparkline points={[4, 8, 6, 10, 14, 12, 16]} color="#ff682c" />
        </div>
        <div className="stat-card">
          <div className="stat-label"><Icon name="ph-target" />평균 점수</div>
          <div className="stat-value">76.4<small> 점</small></div>
          <div className="stat-delta"><Icon name="ph-trend-up" /> 안정적 유지</div>
        </div>
        <div className="stat-card">
          <div className="stat-label"><Icon name="ph-check-circle" />제출 처리량</div>
          <div className="stat-value">{Math.round(1280 * rangeMultiplier).toLocaleString()}</div>
          <Sparkline points={[6, 9, 7, 11, 9, 13, 15]} color="#0f9a82" />
        </div>
        <div className="stat-card">
          <div className="stat-label"><Icon name="ph-timer" />평균 응답시간</div>
          <div className="stat-value">118<small> ms</small></div>
          <div className="stat-delta"><Icon name="ph-shield-check" /> 목표 이내</div>
        </div>
      </div>

      <div className="analysis-grid">
        <div className="panel">
          <h4>응시자 접속 추이</h4>
          <div className="sub">시간대별 접속자 수 및 제출 처리량 (구간: {range === 'today' ? '오늘' : range === 'week' ? '이번 주' : '이번 달'})</div>
          <div className="chart-wrap"><HeroChart range={range} /></div>
        </div>
        <div className="panel sharp-corner">
          <h4>핵심 지표 요약</h4>
          <div className="sub">문항 정답률 상하위 · 부하 테스트 요약</div>
          <div className="kpi-list">
            <div className="kpi-row"><span className="name">최고 정답률 문항 (7번)</span><span className="val hi">92%</span></div>
            <div className="kpi-row"><span className="name">최저 정답률 문항 (8번)</span><span className="val lo">38%</span></div>
            <div className="kpi-row"><span className="name">최근 부하 테스트 에러율</span><span className="val">0.4%</span></div>
            <div className="kpi-row"><span className="name">동시 제출 처리 최대치</span><span className="val">312건/분</span></div>
            <div className="kpi-row"><span className="name">활성 시험 세션</span><span className="val">3개</span></div>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="panel">
          <h4>다중 시험 세션 상태</h4>
          <div className="sub">진행 중인 세션 요약</div>
          <div className="session-cards">
            <div className="session-card">
              <span className="status-pill run">진행 중</span>
              <b>2026 정기 모의고사 A반</b>
              <span style={{ fontSize: 12, color: 'var(--text3)' }}>응시 142명 · 진행률 68%</span>
            </div>
            <div className="session-card">
              <span className="status-pill wait">대기</span>
              <b>2026 정기 모의고사 B반</b>
              <span style={{ fontSize: 12, color: 'var(--text3)' }}>응시 예정 98명</span>
            </div>
            <div className="session-card">
              <span className="status-pill end">종료</span>
              <b>2026 사전 진단평가</b>
              <span style={{ fontSize: 12, color: 'var(--text3)' }}>응시 완료 210명</span>
            </div>
          </div>
        </div>
        <div className="panel">
          <h4>최근 제출 타임라인</h4>
          <div className="sub">실시간 이벤트 로그</div>
          <div className="timeline-list">
            <div className="timeline-item"><span className="timeline-dot"></span>응시자 #1042 — 3교시 제출 완료</div>
            <div className="timeline-item"><span className="timeline-dot"></span>응시자 #1041 — 3교시 제출 완료</div>
            <div className="timeline-item"><span className="timeline-dot"></span>B반 세션 — 대기 상태로 생성됨</div>
            <div className="timeline-item"><span className="timeline-dot"></span>응시자 #1038 — 재시도 후 제출 성공</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AnalyticsView() {
  const [filter, setFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  const visible = QUESTIONS.filter((q) => filter === 'all' || (filter === 'outlier' && q.rate < 50) || (filter === q.subject));

  return (
    <div className="view-fade">
      <div className="filter-row">
        {['all', '국어', '수학', '영어', 'outlier'].map((f) => (
          <button key={f} className={'filter-chip' + (filter === f ? ' active' : '')} onClick={() => setFilter(f)}>
            {f === 'all' ? '전체' : f === 'outlier' ? '이상치 문항' : f}
          </button>
        ))}
      </div>
      <div className="panel">
        <table className="q-table">
          <thead><tr><th>문항</th><th>과목</th><th>난이도</th><th>정답률</th><th>비고</th></tr></thead>
          <tbody>
            {visible.map((q) => (
              <tr key={q.id} onClick={() => setSelected(q.id)}>
                <td>{q.id}번</td>
                <td>{q.subject}</td>
                <td>난이도 {q.difficulty}</td>
                <td>
                  <span className="rate-track"><span className="rate-fill" style={{ width: q.rate + '%', background: q.rate < 50 ? '#ff682c' : '#0f9a82' }}></span></span>
                  {q.rate}%
                </td>
                <td>{q.rate < 50 ? <span className="outlier">난이도 대비 이상치</span> : '정상 범위'}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {selected && (
          <div style={{ marginTop: 18, padding: 16, background: 'var(--surface)', borderRadius: 12, fontSize: 13, color: 'var(--text2)' }}>
            {selected}번 문항 상세 — 회차별 정답률 추이와 소요 시간 분포를 별도 집계 뷰에서 함께 확인할 수 있는 구조입니다.
          </div>
        )}
      </div>
    </div>
  );
}

function LoadTestView({ showToast }) {
  const [bars, setBars] = useState([40, 45, 38, 52, 90, 48, 42]);
  const [running, setRunning] = useState(false);

  const runTest = () => {
    setRunning(true);
    showToast('부하 테스트 시나리오를 실행합니다');
    setTimeout(() => {
      setBars(bars.map(() => 30 + Math.round(Math.random() * 65)));
      setRunning(false);
      showToast('부하 테스트가 완료되었습니다');
    }, 900);
  };

  return (
    <div className="view-fade">
      <div className="scenario-grid">
        <div className="scenario-card">
          <b>동시 접속 300명</b>
          <div className="meta">평균 응답 132ms · 에러율 0.2%</div>
        </div>
        <div className="scenario-card">
          <b>동시 제출 폭주 500건</b>
          <div className="meta">평균 응답 240ms · 에러율 0.6%</div>
        </div>
        <div className="scenario-card">
          <b>피크 시간대 재현</b>
          <div className="meta">평균 응답 188ms · 에러율 0.4%</div>
        </div>
      </div>
      <div className="panel">
        <h4>응답시간 분포 (초 단위 구간)</h4>
        <div className="sub">병목 구간은 주황색으로 표시됩니다</div>
        <div className="bt-bars">
          {bars.map((v, i) => (
            <div key={i} className={'bt-bar' + (v > 70 ? ' bottleneck' : '')} style={{ height: v + '%' }} title={v + 'ms 대역'}></div>
          ))}
        </div>
        <div style={{ marginTop: 20 }}>
          <RippleButton className="btn btn-accent" onClick={runTest} disabled={running}>
            <Icon name="ph-play" /> {running ? '테스트 실행 중…' : '부하 테스트 시나리오 실행'}
          </RippleButton>
        </div>
      </div>
    </div>
  );
}

function SessionsView({ showToast }) {
  const [sessions, setSessions] = useState([
    { id: 1, name: '2026 정기 모의고사 A반', status: 'run', count: 142, pct: 68 },
    { id: 2, name: '2026 정기 모의고사 B반', status: 'wait', count: 98, pct: 0 },
    { id: 3, name: '2026 사전 진단평가', status: 'end', count: 210, pct: 100 },
    { id: 4, name: '2026 여름방학 특강 모의고사', status: 'wait', count: 54, pct: 0 },
  ]);

  const cycle = (id) => {
    setSessions((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const next = s.status === 'wait' ? 'run' : s.status === 'run' ? 'end' : 'wait';
      showToast(s.name + ' 상태가 변경되었습니다');
      return { ...s, status: next, pct: next === 'end' ? 100 : next === 'run' ? Math.max(s.pct, 20) : 0 };
    }));
  };

  const label = { wait: '대기', run: '진행 중', end: '종료' };

  return (
    <div className="view-fade">
      {sessions.map((s) => (
        <div className="session-full-card" key={s.id}>
          <div className="info">
            <b>{s.name}</b>
            <span className="meta">응시 {s.count}명 · 문제은행: 2026-표준세트</span>
          </div>
          <div style={{ textAlign: 'center' }}>
            <span className={'status-pill ' + s.status}>{label[s.status]}</span>
            <div className="mini-progress"><div className="mini-progress-fill" style={{ width: s.pct + '%' }}></div></div>
          </div>
          <RippleButton className="btn" onClick={() => cycle(s.id)}>
            <Icon name="ph-arrows-clockwise" /> 상태 전환
          </RippleButton>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [activeView, setActiveView] = useState('main');
  const [range, setRange] = useState('today');
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(window.__toastTimer2);
    window.__toastTimer2 = setTimeout(() => setToast(null), 2200);
  };

  return (
    <div className="shell">
      <Header activeView={activeView} setActiveView={setActiveView} showToast={showToast} />
      <nav className="tab-bar">
        <button className="tab active" onClick={() => showToast('개요 탭')}>개요</button>
        <button className="tab" onClick={() => showToast('이벤트 로그로 이동합니다')}>이벤트</button>
        <button className="tab" onClick={() => showToast('인사이트 리포트로 이동합니다')}>인사이트</button>
        <button className="tab" onClick={() => showToast('설정 화면으로 이동합니다')}>설정</button>
      </nav>
      <div className="content">
        {activeView === 'main' && <MainView range={range} setRange={setRange} showToast={showToast} />}
        {activeView === 'analytics' && <AnalyticsView />}
        {activeView === 'load-test' && <LoadTestView showToast={showToast} />}
        {activeView === 'sessions' && <SessionsView showToast={showToast} />}
      </div>
      {toast && <div className="toast"><Icon name="ph-check-circle" /> {toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
