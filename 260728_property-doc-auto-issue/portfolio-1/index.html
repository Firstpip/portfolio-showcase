<style>
:root{
  --flame:#fa5d00;
  --flame-dark:#d94f00;
  --teal:#1ef6da;
  --cream:#fff8f1;
  --paper:#ffffff;
  --marigold:#fee3b5;
  --ink:#1d1e1c;
  --stone:#615f5c;
  --driftwood:#8e8b87;
  --bone:#c0bbb6;
  --mist:#d9d9d9;
  --shadow-btn:rgba(0,0,0,.2) 0px 1px 4px 0px;
  --shadow-card:rgba(250,166,0,.22) 6px 4px 24px 0px;
  --ok-fg:#1f7a4d; --ok-bg:#e2f5ea;
  --warn-fg:#9a5b00; --warn-bg:#feecd2;
  --bad-fg:#b5341f; --bad-bg:#fce3de;
  --wait-fg:#5c5a57; --wait-bg:#eeeae4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--bone);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseLive{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.3);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

.screen{animation:fadeInUp .34s cubic-bezier(.16,1,.3,1) both;}
.stagger{animation:fadeInUp .42s cubic-bezier(.16,1,.3,1) both;}

.app-shell{display:flex;width:100%;min-height:100vh;}

.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:246px;
  background:var(--paper);border-right:1px solid var(--bone);
  display:flex;flex-direction:column;z-index:30;
}
.sidebar-brand{height:68px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--mist);}
.sidebar-brand .mark{width:34px;height:34px;border-radius:10px;background:var(--flame);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sidebar-brand .name{font-size:16px;font-weight:700;letter-spacing:.36px;color:var(--ink);}
.sidebar-brand .sub{font-size:11px;color:var(--driftwood);font-weight:500;}
.sidebar-section{font-size:12px;font-weight:600;color:var(--driftwood);text-transform:uppercase;letter-spacing:.5px;padding:20px 22px 8px;}
.sidebar-nav{padding:0 12px;display:flex;flex-direction:column;gap:2px;}
.sidebar-link{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;
  font-size:14.5px;font-weight:500;color:var(--stone);position:relative;transition:background .15s,color .15s;
}
.sidebar-link:hover{background:var(--cream);color:var(--ink);}
.sidebar-link.active{background:var(--marigold);color:var(--ink);font-weight:600;}
.sidebar-link .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--flame);color:#fff;border-radius:999px;padding:2px 8px;}
.sidebar-foot{margin-top:auto;padding:18px 22px;border-top:1px solid var(--mist);display:flex;align-items:center;gap:10px;}
.sidebar-foot .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--flame),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;}
.sidebar-foot .who{font-size:13px;font-weight:600;}
.sidebar-foot .role{font-size:11.5px;color:var(--driftwood);}

.main-wrap{margin-left:246px;flex:1;min-width:0;width:calc(100% - 246px);display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:68px;display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;background:rgba(255,248,241,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:.3px;margin:0;}
.live-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ok-fg);background:var(--ok-bg);padding:6px 12px;border-radius:999px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok-fg);animation:pulseLive 1.6s ease-in-out infinite;}

.content{padding:30px 32px 60px;flex:1;}

.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:11px 20px;border-radius:16px;transition:transform .12s,filter .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--flame);color:#fff;box-shadow:var(--shadow-btn);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--flame);border:1px solid var(--bone);}
.btn-ghost:hover{background:var(--cream);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}

.card{background:var(--paper);border-radius:20px;padding:26px;box-shadow:0 1px 2px rgba(29,30,28,.05);border:1px solid rgba(192,187,182,.4);}
.card-glow{box-shadow:var(--shadow-card);}

/* ===== insight-board composition ===== */
.insight-grid{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:stretch;}
.hero-viz{min-height:360px;display:flex;flex-direction:column;}
.hero-viz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.seg{display:flex;background:var(--cream);border-radius:12px;padding:3px;}
.seg button{padding:6px 14px;font-size:12.5px;font-weight:600;border-radius:9px;color:var(--stone);}
.seg button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

.kpi-side{display:flex;flex-direction:column;gap:14px;}
.kpi-mini{background:var(--paper);border-radius:16px;padding:16px 18px;border:1px solid rgba(192,187,182,.4);}
.kpi-mini .label{font-size:12px;color:var(--driftwood);font-weight:600;}
.kpi-mini .val{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:.2px;}
.kpi-mini .delta{font-size:12px;font-weight:600;margin-top:2px;}
.kpi-mini .delta.up{color:var(--ok-fg);}
.kpi-mini .delta.down{color:var(--bad-fg);}
.priority-list{background:var(--paper);border-radius:16px;padding:16px 18px;border:1px solid rgba(192,187,182,.4);flex:1;display:flex;flex-direction:column;}
.priority-list .ttl{font-size:12.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.priority-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--cream);}
.priority-row:last-child{border-bottom:none;}
.priority-row .addr{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.priority-row .reason{font-size:11px;color:var(--bad-fg);}

.widget-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:20px;margin-top:20px;}
.widget-card{min-height:280px;display:flex;flex-direction:column;}
.widget-card h3{font-size:14.5px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:8px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg);}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg);}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg);}
.badge.wait{background:var(--wait-bg);color:var(--wait-fg);}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--driftwood);text-transform:uppercase;letter-spacing:.4px;padding:0 12px 10px;border-bottom:1px solid var(--mist);}
td{padding:13px 12px;font-size:13.5px;border-bottom:1px solid var(--cream);}
tr.rowclick{cursor:pointer;transition:background .12s;}
tr.rowclick:hover{background:var(--cream);}

.progressbar{height:7px;background:var(--cream);border-radius:99px;overflow:hidden;position:relative;}
.progressbar .fill{height:100%;border-radius:99px;transform-origin:left;animation:barGrow .8s cubic-bezier(.16,1,.3,1) both;}

.formrow{margin-bottom:16px;}
.formrow label{display:block;font-size:12.5px;font-weight:600;color:var(--stone);margin-bottom:6px;}
.formrow input,.formrow select,.formrow textarea{
  width:100%;padding:12px 15px;border:1px solid var(--bone);border-radius:16px;font-size:14px;background:var(--paper);

.formrow input:focus,.formrow select:focus,.formrow textarea:focus{outline:2px solid var(--flame);outline-offset:1px;}
.chip-select{display:flex;gap:10px;}
.chip-select button{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--bone);font-size:13.5px;font-weight:600;text-align:center;transition:all .15s;}
.chip-select button.active{border-color:var(--flame);background:#fff2e8;color:var(--flame);}

.adapter-row{display:flex;gap:16px;margin-bottom:22px;}
.adapter-card{flex:1;border:1px solid rgba(192,187,182,.5);border-radius:18px;padding:18px 20px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.adapter-card:hover{box-shadow:var(--shadow-card);transform:translateY(-2px);}
.adapter-card h4{margin:0 0 6px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.adapter-card p{margin:0;font-size:12.5px;color:var(--driftwood);}

.stepper{display:flex;align-items:center;gap:8px;margin:18px 0;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--driftwood);}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--cream);border:2px solid var(--bone);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .25s;}
.step.done .dot{background:var(--ok-fg);border-color:var(--ok-fg);color:#fff;}
.step.active .dot{background:var(--flame);border-color:var(--flame);color:#fff;animation:pulseLive 1s ease-in-out infinite;}
.step.done,.step.active{color:var(--ink);}
.step-line{flex:1;height:2px;background:var(--bone);margin-top:-22px;}

.upload-zone{border:2px dashed var(--bone);border-radius:18px;padding:36px;text-align:center;background:var(--cream);transition:border-color .15s,background .15s;}
.upload-zone.drag{border-color:var(--flame);background:#fff2e8;}

.modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--paper);border-radius:22px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:fadeInUp .28s cubic-bezier(.16,1,.3,1) both;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--mist);}
.modal-head h3{margin:0;font-size:17px;font-weight:700;}
.modal-body{padding:24px 26px;}
.modal-foot{padding:18px 26px;border-top:1px solid var(--mist);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--stone);}
.close-x:hover{background:var(--cream);}

.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream);font-size:13.5px;}
.kv .k{color:var(--driftwood);font-weight:500;}
.kv .v{font-weight:600;text-align:right;}

.toast-wrap{position:fixed;bottom:26px;right:26px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .3s cubic-bezier(.16,1,.3,1) both;}

.filter-chips{display:flex;gap:8px;margin-bottom:18px;}
.filter-chips button{padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--bone);color:var(--stone);}
.filter-chips button.active{background:var(--flame);color:#fff;border-color:var(--flame);}

.parse-field{background:var(--cream);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.parse-field .lbl{font-size:11.5px;font-weight:700;color:var(--driftwood);text-transform:uppercase;margin-bottom:4px;}
.parse-field .cnt{font-size:14px;font-weight:600;}

.ring{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--cream);stroke-width:9;}
.ring-fg{fill:none;stroke:var(--flame);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}

.deposit-slider{width:100%;accent-color:var(--flame);margin:14px 0;}

@media (max-width:960px){
  .insight-grid{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
}
</style>

function Icon({name, size=17, className=''}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[name]);
  return <i ref={ref} data-lucide={name} style={{width:size,height:size}} className={className}></i>;
}

function useToasts(){
  const [toasts,setToasts] = useState([]);
  const push = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };
  return {toasts, push};
}

function CountUp({value, duration=800}){
  const [v,setV] = useState(0);
  useEffect(()=>{
    let start=null;
    const step = (ts)=>{
      if(!start) start=ts;
      const p = Math.min((ts-start)/duration,1);
      setV(Math.floor(p*value));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[value]);
  return <span>{v.toLocaleString()}</span>;
}

function StatusBadge({status}){
  const map = {
    '완료':{cls:'ok',icon:'check-circle'},
    '처리중':{cls:'warn',icon:'loader-2'},
    '대기':{cls:'wait',icon:'clock'},
    '실패':{cls:'bad',icon:'alert-triangle'},
    '일부실패':{cls:'warn',icon:'alert-triangle'},
    'OCR 폴백':{cls:'warn',icon:'scan-line'},
  };
  const m = map[status] || {cls:'wait',icon:'circle'};
  return <span className={'badge '+m.cls}><Icon name={m.icon} size={12}/>{status}</span>;
}

function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>

function BatchQueue({push}){
  const [batches,setBatches] = useState(INITIAL_BATCHES);
  const [webhook,setWebhook] = useState('https://internal.example.com/hooks/issue-callback');
  const [confirmRetry,setConfirmRetry] = useState(null);
  const [dragOver,setDragOver] = useState(false);

  const uploadSample = ()=>{
    const id = 'BJ-'+(119+batches.length);
    setBatches(b=>[{id,file:'신규_업로드_'+(batches.length+1)+'.csv',total:120,done:0,fail:0,status:'처리중'}, ...b]);
    push('배치 작업이 큐에 등록되었습니다');
    let done=0;
    const timer = setInterval(()=>{
      done += 24;
      setBatches(bs=>bs.map(x=>x.id===id?{...x,done:Math.min(done,120),status:done>=120?'완료':'처리중'}:x));
      if(done>=120) clearInterval(timer);
    },500);
  };

  const doRetry = (id)=>{
    setBatches(b=>b.map(x=>x.id===id?{...x,fail:0,status:'완료'}:x));
    push('실패 건 재처리가 완료되었습니다');
    setConfirmRetry(null);
  };

  const saveWebhook = ()=> push('Webhook URL이 저장되었습니다');

  return (
    <div className="screen">
      <div
        className={'upload-zone '+(dragOver?'drag':'')}
        onDragOver={e=>{e.preventDefault();setDragOver(true);}}
        onDragLeave={()=>setDragOver(false)}
        onDrop={e=>{e.preventDefault();setDragOver(false);uploadSample();}}
        style={{marginBottom:22}}
      >
        <Icon name="upload-cloud" size={32} className="" />
        <p style={{fontWeight:600,margin:'10px 0 4px'}}>CSV 파일을 드래그하거나 아래 버튼으로 업로드하세요</p>
        <p style={{fontSize:12.5,color:'var(--driftwood)',margin:'0 0 16px'}}>주소, 소유자명, 문서유형 컬럼 포함</p>
        <button className="btn btn-primary" onClick={uploadSample}><Icon name="file-plus" size={15}/> 샘플 CSV 업로드</button>
      </div>

      <div className="card" style={{marginBottom:22}}>
        <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700}}>배치 작업 큐</h3>
        <table>
          <thead><tr><th>작업 ID</th><th>파일명</th><th>진행률</th><th>실패</th><th>상태</th><th>액션</th></tr></thead>
          <tbody>
            {batches.map(b=>(
              <tr key={b.id}>
                <td style={{fontWeight:600}}>{b.id}</td>
                <td>{b.file}</td>
                <td style={{width:180}}>
                  <div className="progressbar">
                    <div className="fill" style={{width:(b.done/b.total*100)+'%',background:b.status==='일부실패'?'#e0a63a':'#fa5d00'}}></div>
                  </div>
                  <div style={{fontSize:11,color:'var(--driftwood)',marginTop:4}}>{b.done}/{b.total}건</div>
                </td>
                <td>{b.fail>0 ? <span style={{color:'var(--bad-fg)',fontWeight:600}}>{b.fail}건</span> : '-'}</td>
                <td><StatusBadge status={b.status}/></td>
                <td>
                  {b.fail>0 ? <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmRetry(b.id)}><Icon name="refresh-cw" size={13}/> 재시도</button> : <span style={{color:'var(--driftwood)',fontSize:12}}>-</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="card">
        <h3 style={{margin:'0 0 12px',fontSize:15,fontWeight:700}}>결과 전송 Webhook</h3>
        <div className="formrow">
          <label>Callback URL</label>
          <input value={webhook} onChange={e=>setWebhook(e.target.value)}/>
        </div>
        <button className="btn btn-dark btn-sm" onClick={saveWebhook}><Icon name="save" size={13}/> 저장</button>
      </div>

      {confirmRetry && (
        <Modal title="실패 건 재처리" onClose={()=>setConfirmRetry(null)}
          footer={<>
            <button className="btn btn-ghost" onClick={()=>setConfirmRetry(null)}>취소</button>
            <button className="btn btn-primary" onClick={()=>doRetry(confirmRetry)}>재처리 실행</button>
          </>}>
          <p style={{margin:0,fontSize:14,lineHeight:1.6}}>{confirmRetry} 작업의 실패 건을 재처리 큐에 다시 등록하시겠습니까? 성공한 건에는 영향을 주지 않습니다.</p>
        </Modal>
      )}
    </div>
  );
}

        <div className="card">
          <h3 style={{margin:'0 0 14px',fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}><Icon name="shield-check" size={17}/> 공동인증서 갱신</h3>
          <div style={{display:'flex',alignItems:'center',gap:20}}>
            <svg width="90" height="90" className="ring">
              <circle className="ring-bg" cx="45" cy="45" r="35"/>
              <circle className="ring-fg" cx="45" cy="45" r="35" strokeDasharray={circumference} strokeDashoffset={offset}/>
            </svg>
            <div>
              <div style={{fontSize:24,fontWeight:700}}>{daysLeft}일 남음</div>
              <div style={{fontSize:12.5,color:'var(--driftwood)'}}>갱신일: 2026.09.08</div>
            </div>
          </div>
        </div>
        <div className="card">
          <h3 style={{margin:'0 0 14px',fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}><Icon name="wallet" size={17}/> 예치금 잔액 알림</h3>
          <div style={{fontSize:24,fontWeight:700,marginBottom:4}}>128,400원</div>
          <div style={{fontSize:12.5,color:'var(--driftwood)',marginBottom:6}}>임계치 이하 시 알림: {threshold.toLocaleString()},000원</div>
          <input type="range" className="deposit-slider" min="10" max="100" value={threshold} onChange={e=>setThreshold(Number(e.target.value))}/>
          <button className="btn btn-dark btn-sm" onClick={()=>push('알림 임계치가 저장되었습니다')}><Icon name="save" size={13}/> 저장</button>
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}><Icon name="key" size={17}/> API Key 관리</h3>
          <button className="btn btn-primary btn-sm" onClick={()=>setNewKeyModal(true)}><Icon name="plus" size={14}/> 새 API Key 발급</button>
        </div>
        <table>
          <thead><tr><th>이름</th><th>키</th><th>접근 IP</th><th>발급일</th><th>액션</th></tr></thead>
          <tbody>
            {keys.map(k=>(
              <tr key={k.id}>
                <td style={{fontWeight:600}}>{k.label}</td>
                <td style={{fontFamily:'monospace',fontSize:12.5}}>{k.key}</td>
                <td>{k.ip}</td>
                <td>{k.issued}</td>
                <td><button className="btn btn-ghost btn-sm" onClick={()=>setDeleteId(k.id)}><Icon name="trash-2" size={13}/> 삭제</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {newKeyModal && (
        <Modal title="새 API Key 발급" onClose={()=>setNewKeyModal(false)}
          footer={<>
            <button className="btn btn-ghost" onClick={()=>setNewKeyModal(false)}>취소</button>
            <button className="btn btn-primary" onClick={createKey}>발급</button>
          </>}>
          <div className="formrow">
            <label>키 이름</label>
            <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="예: 정산 서버 키"/>
          </div>
        </Modal>
      )}
      {deleteId && (
        <Modal title="API Key 삭제" onClose={()=>setDeleteId(null)}
          footer={<>
            <button className="btn btn-ghost" onClick={()=>setDeleteId(null)}>취소</button>
            <button className="btn btn-primary" onClick={doDelete}>삭제</button>
          </>}>
          <p style={{margin:0,fontSize:14}}>정말 삭제하시겠습니까? 해당 키를 사용하는 연동은 즉시 중단됩니다.</p>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [screen,setScreen] = useState('main');
  const [detail,setDetail] = useState(null);
  const {toasts, push} = useToasts();

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[screen]);

  return (
    <div style={{width:'100%'}}>
      <div className="app-shell">
        <aside className="sidebar">
          <div className="sidebar-brand">
            <div className="mark"><Icon name="file-text" size={18} className=""/></div>
            <div>
              <div className="name">공부서류 발급허브</div>
              <div className="sub">등기·건축물대장 자동화</div>
            </div>
          </div>
          <div className="sidebar-section">발급 운영</div>
          <nav className="sidebar-nav">
            {NAV.map(n=>(
              <div key={n.key} className={'sidebar-link '+(screen===n.key?'active':'')} onClick={()=>setScreen(n.key)} style={{cursor:'pointer'}}>
                <Icon name={n.icon} size={17}/>{n.label}
              </div>
            ))}
          </nav>
          <div className="sidebar-foot">
            <div className="avatar">김</div>
            <div>
              <div className="who">김민수</div>
              <div className="role">운영 관리자</div>
            </div>
          </div>
        </aside>

        <div className="main-wrap">
          <div className="topbar">
            <h1>{NAV.find(n=>n.key===screen)?.label}</h1>
            <div className="live-pill"><span className="live-dot"></span> 실시간 연동 중</div>
          </div>
          <div className="content">
            {screen==='main' && <MainDashboard push={push} openDetail={setDetail}/>}
            {screen==='issue-engine' && <IssueEngine push={push}/>}
            {screen==='batch-queue' && <BatchQueue push={push}/>}
            {screen==='document-parse' && <DocumentParse push={push}/>}
            {screen==='settings' && <Settings push={push}/>}
          </div>
        </div>
      </div>

      {detail && (
        <Modal title={detail.id+' 발급 상세'} onClose={()=>setDetail(null)}
          footer={<button className="btn btn-ghost" onClick={()=>setDetail(null)}>닫기</button>}>
          <div className="kv"><span className="k">주소</span><span className="v">{detail.addr}</span></div>
          <div className="kv"><span className="k">문서 유형</span><span className="v">{detail.type}</span></div>
          <div className="kv"><span className="k">브로커</span><span className="v">{detail.broker}</span></div>
          <div className="kv"><span className="k">상태</span><span className="v"><StatusBadge status={detail.status}/></span></div>
          <div className="kv"><span className="k">요청 시각</span><span className="v">{detail.time}</span></div>
        </Modal>
      )}

      <div className="toast-wrap">
        {toasts.map(t=>(
          <div key={t.id} className="toast"><Icon name="check-circle" size={16}/>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
