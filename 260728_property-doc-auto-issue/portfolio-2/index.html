<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 고객사 서류 발급 관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<style>
:root{
  --iris:#5683da;
  --iris-dark:#3f68bf;
  --ember:#ff8964;
  --bg:#ffffff;
  --linen:#f6f6f6;
  --surface:#e5e5e7;
  --ink:#090a0c;
  --smoke:#95979e;
  --frost:#d1d1d1;
  --slate:#4a4b50;
  --ok-fg:#1d7a52; --ok-bg:#e2f5ea;
  --warn-fg:#95500a; --warn-bg:#ffeadd;
  --bad-fg:#c23a1f; --bad-bg:#fde3dc;
  --shadow-sm:rgba(0,0,0,.08) 0px 2px 8px 0px;
  --shadow-md:rgba(0,0,0,.12) 0px 8px 24px 0px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--linen);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.1px;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--frost);border-radius:8px;}

@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,137,100,.55);}70%{box-shadow:0 0 0 8px rgba(255,137,100,0);}}
@keyframes drawerSlide{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes auroraShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}

.screen{animation:fadeSlide .3s cubic-bezier(.16,1,.3,1) both;}
.stagger{animation:fadeSlide .38s cubic-bezier(.16,1,.3,1) both;}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

.topnav{
  position:sticky;top:0;z-index:40;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--frost);
}
.topnav-inner{max-width:1280px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:28px;}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;flex-shrink:0;}
.brand .mark{width:30px;height:30px;border-radius:9999px;background:linear-gradient(120deg,var(--iris),var(--ember),var(--iris));background-size:200% 200%;animation:auroraShift 6s ease infinite;display:flex;align-items:center;justify-content:center;color:#fff;}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;}
.tab{padding:9px 16px;border-radius:9999px;font-size:13.5px;font-weight:600;color:var(--smoke);white-space:nowrap;transition:background .15s,color .15s;}
.tab:hover{background:var(--linen);color:var(--ink);}
.tab.active{background:var(--ink);color:#fff;}
.tab .cnt{margin-left:6px;font-size:10.5px;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:9999px;}
.tab.active .cnt{background:rgba(255,255,255,.22);}
.tab:not(.active) .cnt{background:var(--surface);color:var(--slate);}
.top-cta{flex-shrink:0;}

.hero-band{
  width:100%;background:linear-gradient(180deg,#0d1420 0%,#182238 55%,var(--linen) 100%);
  padding:26px 28px 0;
}
.hero-inner{max-width:1280px;margin:0 auto;padding-bottom:22px;}
.hero-title{color:#fff;font-size:21px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px;}
.hero-sub{color:#a9a9aa;font-size:13px;margin:0;}

.status-strip{
  display:flex;align-items:center;gap:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:9999px;padding:6px 8px;margin-top:16px;backdrop-filter:blur(6px);
}
.status-chip{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:9999px;color:#fff;flex:1;justify-content:center;}
.status-chip .n{font-size:16px;font-weight:700;}
.status-chip .l{font-size:11px;color:#b9bcc4;}
.status-chip + .status-chip{border-left:1px solid rgba(255,255,255,.14);}
.live-tag{display:flex;align-items:center;gap:6px;background:var(--ember);color:#1d0e07;font-size:11px;font-weight:700;padding:5px 12px;border-radius:9999px;}
.live-tag .dot{width:6px;height:6px;border-radius:9999px;background:#1d0e07;animation:livePulse 1.8s ease-out infinite;}

.content{max-width:1280px;margin:0 auto;width:100%;padding:26px 28px 60px;}

.tower-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;}
.primary-focus{background:#fff;border:1px solid var(--frost);border-radius:16px;padding:22px;}
.primary-focus h3{margin:0 0 16px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.priority-rail{background:#fff;border:1px solid var(--frost);border-radius:16px;padding:20px;display:flex;flex-direction:column;}
.priority-rail h3{margin:0 0 14px;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);}

.event-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linen);animation:rowIn .3s ease both;}
.event-row:last-child{border-bottom:none;}
.event-dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0;}
.event-body{flex:1;min-width:0;}
.event-tenant{font-size:12px;color:var(--smoke);font-weight:600;}
.event-addr{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-time{font-size:11.5px;color:var(--smoke);}

.priority-item{border-radius:12px;background:var(--linen);padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .12s;}
.priority-item:hover{transform:translateX(2px);}
.priority-item .tenant{font-size:11px;font-weight:700;color:var(--iris);}
.priority-item .addr{font-size:12.5px;font-weight:600;margin:3px 0;}
.priority-item .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--smoke);}
.priority-item .score{font-weight:700;color:var(--ember);}

.secondary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:20px;}
.sec-card{background:#fff;border:1px solid var(--frost);border-radius:16px;padding:20px;}
.sec-card h4{margin:0 0 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;}

.pill-btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:9999px;transition:filter .12s,transform .12s;}
.pill-btn:active{transform:scale(.96);}
.pill-primary{background:var(--iris);color:#fff;}
.pill-primary:hover{filter:brightness(1.08);}
.pill-ghost{background:transparent;border:1px solid var(--frost);color:var(--ink);}
.pill-ghost:hover{background:var(--linen);}
.pill-white{background:#fff;color:var(--ink);border:1px solid var(--frost);}
.pill-sm{padding:6px 14px;font-size:12px;}

.card-flat{background:#fff;border:1px solid var(--frost);border-radius:16px;padding:22px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:9999px;}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg);}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg);}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg);}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;font-weight:700;color:var(--smoke);text-transform:uppercase;letter-spacing:.4px;padding:0 12px 10px;border-bottom:1px solid var(--frost);}
td{padding:13px 12px;font-size:13px;border-bottom:1px solid var(--linen);}
tr.rowclick{cursor:pointer;transition:background .12s;}
tr.rowclick:hover{background:var(--linen);}

.formrow{margin-bottom:14px;}
.formrow label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;}
.formrow input,.formrow select{width:100%;padding:10px 14px;border:1px solid var(--frost);border-radius:9999px;font-size:13.5px;background:#fff;}
.formrow input:focus,.formrow select:focus{outline:2px solid var(--iris);outline-offset:1px;}

.tag-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:9999px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(9,10,12,.4);z-index:100;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:-16px 0 40px rgba(0,0,0,.18);z-index:101;animation:drawerSlide .32s cubic-bezier(.16,1,.3,1) both;display:flex;flex-direction:column;}
.drawer-head{padding:22px 24px;border-bottom:1px solid var(--frost);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{margin:0;font-size:16px;font-weight:700;}
.drawer-body{padding:22px 24px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--frost);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:9999px;display:flex;align-items:center;justify-content:center;}
.close-x:hover{background:var(--linen);}

.modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.42);display:flex;align-items:center;justify-content:center;z-index:110;padding:20px;}
.modal{background:#fff;border-radius:20px;max-width:460px;width:100%;box-shadow:var(--shadow-md);animation:fadeSlide .26s cubic-bezier(.16,1,.3,1) both;}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--frost);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--frost);display:flex;justify-content:flex-end;gap:10px;}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--linen);font-size:13px;}
.kv .k{color:var(--smoke);}
.kv .v{font-weight:600;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:9999px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-md);animation:fadeSlide .28s cubic-bezier(.16,1,.3,1) both;}

.sparkbar{display:flex;align-items:flex-end;gap:3px;height:64px;}
.sparkbar div{flex:1;background:var(--iris);border-radius:3px 3px 0 0;}

.slider-input{width:100%;accent-color:var(--iris);}

@media (max-width:960px){
  .tower-grid{grid-template-columns:1fr;}
  .secondary-grid{grid-template-columns:1fr;}
  .status-strip{flex-wrap:wrap;border-radius:16px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

  {name:'주소 오류',value:6,color:'#ff8964'},

  {id:'RP-23',period:'2026년 5월',status:'완료',generated:'2026.06.01'},

function useToasts(){
  const [toasts,setToasts] = useState([]);
  const push = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };
  return {toasts, push};
}

function StatusBadge({status}){
  const map = {
    '완료':'ok','처리중':'warn','지연':'warn','실패':'bad','정상':'ok','잔액 부족 임박':'warn',
  };
  return <span className={'badge '+(map[status]||'warn')}>{status}</span>;
}

function Drawer({title, onClose, children, footer}){
  return (
    <>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="drawer-head">
          <h3>{title}</h3>
          <button className="close-x" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        <div className="drawer-body">{children}</div>
        {footer && <div className="drawer-foot">{footer}</div>}
      </div>
    </>
  );
}
function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="close-x" onClick={onClose}><i className="ph ph-x"></i></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function TopNav({screen,setScreen,onAddTenant}){
  return (
    <div className="topnav">
      <div className="topnav-inner">
        <div className="brand"><span className="mark"><i className="ph ph-shield-check" style={{fontSize:15}}></i></span> 서류관제 플랫폼</div>
        <div className="tabs">
          {TABS.map(t=>(
            <button key={t.key} className={'tab '+(screen===t.key?'active':'')} onClick={()=>setScreen(t.key)}>
              <i className={'ph '+t.icon} style={{marginRight:6}}></i>{t.label}
              {t.cnt ? <span className="cnt">{t.cnt}</span> : null}

          ))}

        <button className="pill-btn pill-primary top-cta" onClick={onAddTenant}><i className="ph ph-plus"></i> 신규 고객사</button>

  );
}

function HeroBand({stats}){
  return (
    <div className="hero-band">
      <div className="hero-inner">
        <h1 className="hero-title" style={{fontSize:44,letterSpacing:'-1.2px'}}>전체 발급 네트워크 실시간 관제</h1>
        <p className="hero-sub" style={{fontSize:14}}>3개 고객사 · 2개 브로커(코드에프·틸코) 통합 처리 현황</p>
        <div className="status-strip" style={{boxShadow:'0 2 6 rgba(9,10,12,.06)'}}>
          <div className="status-chip"><div><div className="n" style={{fontSize:20}}>{stats.processing}건</div><div className="l">처리중</div></div></div>

        </div>

function MainConsole({push, openDrawer}){
  const [events,setEvents] = useState(EVENTS);
  const [priority,setPriority] = useState(PRIORITY_Q.slice(0,3));

  const bump = (addr)=>{
    setPriority(p=>p.filter(x=>x.addr!==addr));
    push('해당 건이 최우선 재처리 큐로 이동되었습니다');
  };

  return (
    <div className="screen">
      <HeroBand stats={{processing:18, today:342, failRate:'2.1%', tenants:3}}/>
      <div className="content" style={{paddingTop:22}}>
        <div className="tower-grid">
          <div className="primary-focus stagger">
            <h3><i className="ph ph-pulse"></i> 실시간 처리 타임라인</h3>
            {events.map((e,i)=>(
              <div className="event-row" key={i} style={{animationDelay:(i*0.04)+'s',cursor:'pointer'}} onClick={()=>openDrawer(e)}>
                <div className="event-dot" style={{background:e.status==='완료'?'#1d7a52':e.status==='실패'?'#c23a1f':e.status==='지연'?'#ff8964':'#5683da'}}></div>
                <div className="event-body">
                  <div className="event-tenant">{e.tenant} · {e.type}</div>
                  <div className="event-addr">{e.addr}</div>
                </div>
                <StatusBadge status={e.status}/>
                <div className="event-time">{e.time}</div>
              </div>
            ))}
          </div>
          <div className="priority-rail stagger" style={{animationDelay:'.06s'}}>
            <h3>우선 대응 큐</h3>
            {priority.map(p=>(
              <div className="priority-item" key={p.addr} onClick={()=>bump(p.addr)}>
                <div className="tenant">{p.tenant}</div>
                <div className="addr">{p.addr}</div>
                <div className="meta"><span>{p.reason}</span><span className="score">{p.score}점</span></div>
                <div className="meta" style={{marginTop:4}}><span>{p.deadline}</span><span style={{color:'var(--iris)',fontWeight:600}}>클릭하여 승급</span></div>
              </div>
            ))}
            {priority.length===0 && <div style={{fontSize:12.5,color:'var(--smoke)'}}>대응이 필요한 건이 없습니다</div>}
          </div>
        </div>

        <div className="secondary-grid">
          <div className="sec-card stagger" style={{animationDelay:'.1s'}}>
            <h4><i className="ph ph-chart-donut"></i> 실패 사유 분포</h4>
            <ResponsiveContainer width="100%" height={150}>
              <PieChart>
                <Pie data={FAIL_REASONS} dataKey="value" nameKey="name" innerRadius={38} outerRadius={60} paddingAngle={3}>
                  {FAIL_REASONS.map((s,i)=><Cell key={i} fill={s.color}/>)}
                </Pie>
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}}/>
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div className="sec-card stagger" style={{animationDelay:'.14s'}}>
            <h4><i className="ph ph-chart-bar"></i> 시간대별 처리량</h4>
            <div className="sparkbar">
              {THROUGHPUT.map((v,i)=><div key={i} style={{height:(v/80*100)+'%',background:i===THROUGHPUT.length-1?'var(--ember)':'var(--iris)'}}></div>)}
            </div>
            <p style={{fontSize:11.5,color:'var(--smoke)',marginTop:10}}>최근 10시간 처리 건수 추이</p>
          </div>
          <div className="sec-card stagger" style={{animationDelay:'.18s'}}>
            <h4><i className="ph ph-buildings"></i> 고객사 처리 비중</h4>
            {TENANTS_INIT.map(t=>(
              <div key={t.id} style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'7px 0',borderBottom:'1px solid var(--linen)'}}>
                <span style={{fontWeight:600}}>{t.name}</span>
                <StatusBadge status={t.status}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function RetryQueue({push}){
  const [items,setItems] = useState(PRIORITY_Q);
  const [selected,setSelected] = useState([]);
  const [confirm,setConfirm] = useState(false);

  const toggle = (addr)=> setSelected(s=> s.includes(addr) ? s.filter(x=>x!==addr) : [...s,addr]);

  const runBulk = ()=>{
    setItems(it=>it.filter(x=>!selected.includes(x.addr)));
    push(selected.length+'건이 일괄 재처리 큐에 등록되었습니다 (멱등키로 중복 방지)');
    setSelected([]);
    setConfirm(false);
  };

  return (
    <div className="screen content">
      <div className="card-flat">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>실패 사유별 재처리 큐 — 마감 임박순 정렬</h3>
          <button className="pill-btn pill-primary pill-sm" disabled={selected.length===0} onClick={()=>setConfirm(true)}>
            <i className="ph ph-check-square"></i> 선택 건 일괄 재처리 ({selected.length})
          </button>
        </div>
        <table>
          <thead><tr><th></th><th>고객사</th><th>주소</th><th>실패 사유</th><th>마감</th><th>우선순위 점수</th></tr></thead>
          <tbody>
            {items.map(p=>(
              <tr key={p.addr} className="rowclick" onClick={()=>toggle(p.addr)}>
                <td><input type="checkbox" checked={selected.includes(p.addr)} onChange={()=>toggle(p.addr)} onClick={e=>e.stopPropagation()}/></td>
                <td style={{fontWeight:600}}>{p.tenant}</td>
                <td>{p.addr}</td>
                <td>{p.reason}</td>
                <td style={{color:'var(--ember)',fontWeight:600}}>{p.deadline}</td>
                <td>{p.score}점</td>
              </tr>
            ))}
            {items.length===0 && <tr><td colSpan="6" style={{color:'var(--smoke)',textAlign:'center',padding:'24px 0'}}>재처리 대기 건이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>

      {confirm && (
        <Modal title="일괄 재처리 실행" onClose={()=>setConfirm(false)}
          footer={<>
            <button className="pill-btn pill-ghost" onClick={()=>setConfirm(false)}>취소</button>
            <button className="pill-btn pill-primary" onClick={runBulk}>실행</button>
          </>}>
          <p style={{margin:0,fontSize:13.5,lineHeight:1.6}}>선택한 {selected.length}건을 우선순위 큐에서 재처리하시겠습니까? 멱등키 기반으로 이미 처리된 건은 중복 실행되지 않습니다.</p>
        </Modal>
      )}
    </div>
  );
}

function TenantAccess({push}){
  const [tenants,setTenants] = useState(TENANTS_INIT);
  const [ipModal,setIpModal] = useState(null);
  const [ipValue,setIpValue] = useState('');

  const openIpModal = (t)=>{ setIpModal(t); setIpValue(t.ip); };
  const saveIp = ()=>{
    setTenants(ts=>ts.map(t=>t.id===ipModal.id?{...t,ip:ipValue}:t));
    push(ipModal.name+'의 접근 IP가 갱신되었습니다');
    setIpModal(null);
  };
  const revokeKey = (id)=>{
    setTenants(ts=>ts.map(t=>t.id===id?{...t,key:'회수됨'}:t));
    push('API Key가 회수되었습니다');
  };

  return (
    <div className="screen content">
      <div className="card-flat">
        <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700}}>고객사별 API 접근 관리</h3>
        <table>
          <thead><tr><th>고객사</th><th>API Key</th><th>접근 IP</th><th>예치금</th><th>상태</th><th>액션</th></tr></thead>
          <tbody>
            {tenants.map(t=>(
              <tr key={t.id}>
                <td style={{fontWeight:600}}>{t.name}</td>
                <td style={{fontFamily:'monospace',fontSize:12}}>{t.key}</td>
                <td>{t.ip}</td>
                <td>{t.deposit.toLocaleString()}원</td>
                <td><StatusBadge status={t.status}/></td>
                <td style={{display:'flex',gap:6}}>
                  <button className="pill-btn pill-ghost pill-sm" onClick={()=>openIpModal(t)}><i className="ph ph-pencil-simple"></i> IP 설정</button>
                  <button className="pill-btn pill-ghost pill-sm" onClick={()=>revokeKey(t.id)}><i className="ph ph-prohibit"></i> 회수</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {ipModal && (
        <Modal title={ipModal.name+' — 접근 IP 화이트리스트'} onClose={()=>setIpModal(null)}
          footer={<>
            <button className="pill-btn pill-ghost" onClick={()=>setIpModal(null)}>취소</button>
            <button className="pill-btn pill-primary" onClick={saveIp}>저장</button>
          </>}>
          <div className="formrow">
            <label>허용 IP</label>
            <input value={ipValue} onChange={e=>setIpValue(e.target.value)}/>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Reports({push}){
  const [reports,setReports] = useState(REPORTS_INIT);
  const [period,setPeriod] = useState('2026년 7월');
  const [generating,setGenerating] = useState(false);

  const generate = ()=>{
    setGenerating(true);
    setTimeout(()=>{
      setReports(r=>[{id:'RP-'+(25+r.length),period,status:'완료',generated:'2026.07.28'}, ...r]);
      setGenerating(false);
      push(period+' 리포트가 생성되었습니다');
    },1400);
  };

  return (
    <div className="screen content">
      <div className="card-flat" style={{marginBottom:20}}>
        <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700}}>기간별 리포트 생성</h3>
        <div style={{display:'flex',gap:12,alignItems:'flex-end'}}>
          <div className="formrow" style={{flex:1,marginBottom:0}}>
            <label>대상 기간</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)}>
              <option>2026년 7월</option><option>2026년 6월</option><option>2026년 5월</option>
            </select>
          </div>
          <button className="pill-btn pill-primary" onClick={generate} disabled={generating}>
            <i className={'ph '+(generating?'ph-spinner-gap':'ph-file-plus')}></i> {generating?'생성 중...':'리포트 생성'}
          </button>
        </div>
      </div>
      <div className="card-flat">
        <table>
          <thead><tr><th>리포트</th><th>기간</th><th>상태</th><th>생성일</th><th>다운로드</th></tr></thead>
          <tbody>
            {reports.map(r=>(
              <tr key={r.id}>
                <td style={{fontWeight:600}}>{r.id}</td>
                <td>{r.period}</td>
                <td><StatusBadge status={r.status}/></td>
                <td>{r.generated}</td>
                <td><button className="pill-btn pill-ghost pill-sm" onClick={()=>push(r.id+' 리포트를 다운로드합니다')}><i className="ph ph-download-simple"></i> PDF</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AuditLog(){
  return (
    <div className="screen content">
      <div className="card-flat">
        <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700}}>발급 이력 감사 로그</h3>
        <table>
          <thead><tr><th>시각</th><th>주체</th><th>액션</th><th>대상</th></tr></thead>
          <tbody>
            {AUDIT_LOG.map((a,i)=>(
              <tr key={i}>
                <td style={{color:'var(--smoke)'}}>{a.time}</td>
                <td style={{fontWeight:600}}>{a.actor}{a.actor2 && <span style={{color:'var(--smoke)',fontWeight:400}}> · {a.actor2}</span>}</td>
                <td>{a.action}</td>
                <td>{a.target}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen] = useState('main');
  const [drawerEvent,setDrawerEvent] = useState(null);
  const [addTenantOpen,setAddTenantOpen] = useState(false);
  const [newTenantName,setNewTenantName] = useState('');
  const {toasts, push} = useToasts();

  const createTenant = ()=>{
    if(!newTenantName){ push('고객사명을 입력해 주세요'); return; }
    push(newTenantName+' 고객사가 등록되었습니다 — API Key가 자동 발급되었습니다');
    setNewTenantName('');
    setAddTenantOpen(false);
  };

  return (
    <div className="shell">
      <TopNav screen={screen} setScreen={setScreen} onAddTenant={()=>setAddTenantOpen(true)}/>
      {screen==='main' && <MainConsole push={push} openDrawer={setDrawerEvent}/>}
      {screen==='retry-queue' && <RetryQueue push={push}/>}
      {screen==='tenant-access' && <TenantAccess push={push}/>}
      {screen==='reports' && <Reports push={push}/>}
      {screen==='audit-log' && <AuditLog/>}

      {drawerEvent && (
        <Drawer title="발급 이벤트 상세" onClose={()=>setDrawerEvent(null)}
          footer={<button className="pill-btn pill-ghost" onClick={()=>setDrawerEvent(null)}>닫기</button>}>
          <div className="kv"><span className="k">고객사</span><span className="v">{drawerEvent.tenant}</span></div>
          <div className="kv"><span className="k">주소</span><span className="v">{drawerEvent.addr}</span></div>
          <div className="kv"><span className="k">문서 유형</span><span className="v">{drawerEvent.type}</span></div>
          <div className="kv"><span className="k">상태</span><span className="v"><StatusBadge status={drawerEvent.status}/></span></div>
          <div className="kv"><span className="k">시각</span><span className="v">{drawerEvent.time}</span></div>
        </Drawer>
      )}

      {addTenantOpen && (
        <Modal title="신규 고객사 등록" onClose={()=>setAddTenantOpen(false)}
          footer={<>
            <button className="pill-btn pill-ghost" onClick={()=>setAddTenantOpen(false)}>취소</button>
            <button className="pill-btn pill-primary" onClick={createTenant}>등록</button>
          </>}>
          <div className="formrow">
            <label>고객사명</label>
            <input value={newTenantName} onChange={e=>setNewTenantName(e.target.value)} placeholder="예: 정도법무사사무소"/>
          </div>
        </Modal>
      )}

      <div className="toast-wrap">
        {toasts.map(t=>(
          <div key={t.id} className="toast"><i className="ph ph-check-circle"></i>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
