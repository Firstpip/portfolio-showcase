<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슈거스캔 — 카메라 당류·나트륨 시각화 앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --lime:#beff50;
    --ash:#d2d2c8;
    --blue:#1e3af6;
    --bg:#ffffff;
    --parchment:#f5f5eb;
    --ink:#14140f;
    --graphite:#6e6e64;
    --smoke:#b9b9b7;
    --charcoal:#30302a;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  a{text-decoration:none;color:inherit;}
  ::selection{background:var(--lime);color:var(--ink);}

  @keyframes scanSweep{
    0%{ top:6%; opacity:.2;}
    8%{ opacity:1;}
    50%{ top:88%; opacity:1;}
    58%{ opacity:.2;}
    100%{ top:6%; opacity:.2;}
  }
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes floatBob{
    0%,100%{ transform:translateY(0) rotate(-2deg);}
    50%{ transform:translateY(-14px) rotate(2deg);}
  }
  @keyframes toastIn{
    from{ opacity:0; transform:translate(-50%,16px);}
    to{ opacity:1; transform:translate(-50%,0);}
  }
  @keyframes barGrow{
    from{ width:0%; }
  }

  .reveal{ animation: fadeInUp .6s ease both; }

  .topnav{
    position:sticky; top:0; z-index:40; width:100%; height:72px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--ash);
  }
  .topnav .logo{ display:flex; align-items:center; gap:8px; font-weight:500; font-size:20px; letter-spacing:-0.02em;}
  .topnav .logo .ti{ font-size:22px; }
  .navlinks{ display:flex; align-items:center; gap:28px; }
  .ghost-btn{ font-weight:500; font-size:14px; color:var(--ink); padding:8px 4px; transition:color .2s; border-bottom:1px solid transparent;}
  .ghost-btn:hover{ color:var(--graphite); border-bottom:1px solid var(--ink); }
  .pill-cta{
    background:var(--lime); color:var(--ink); font-weight:500; font-size:14px;
    padding:12px 20px; border-radius:9999px; transition:transform .15s ease;
  }
  .pill-cta:hover{ transform:translateY(-2px); }
  .pill-cta:active{ transform:scale(.96); }

  section{ width:100%; }

  .hero{
    background:var(--parchment);
    padding:96px 40px 80px;
    display:flex; align-items:center; gap:64px; justify-content:center;
    max-width:1200px; margin:0 auto; width:100%;
  }
  .hero-copy{ max-width:560px; }
  .eyebrow{
    display:inline-block; font-size:10px; font-weight:500; letter-spacing:.1em;
    text-transform:uppercase; color:var(--graphite); background:var(--bg);
    padding:6px 14px; border-radius:9999px; margin-bottom:20px; border:1px solid var(--ash);
  }
  .hero h1{
    font-size:56px; line-height:0.98; letter-spacing:-0.03em; font-weight:500; margin:0 0 20px;
  }
  .hero p.lede{ font-size:18px; line-height:1.6; color:var(--graphite); margin:0 0 32px; }
  .hero-ctas{ display:flex; gap:12px; align-items:center; }
  .btn-lime{
    background:var(--lime); color:var(--ink); font-weight:500; font-size:16px;
    padding:16px 20px 16px 24px; border-radius:28px; display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s ease;
  }
  .btn-lime:hover{ transform:translateY(-2px); }
  .btn-lime:active{ transform:scale(.97); }
  .btn-ghost-underline{
    font-weight:500; font-size:16px; border-bottom:1px solid var(--ink); padding-bottom:2px;
  }

  .hero-visual{ position:relative; width:320px; height:420px; flex-shrink:0; }
  .phone-frame{
    position:absolute; inset:0; margin:auto; width:240px; height:420px; background:var(--bg);
    border-radius:36px; border:8px solid var(--ink); overflow:hidden; box-shadow:none;
  }
  .phone-screen{ position:absolute; inset:8px; border-radius:26px; background:linear-gradient(180deg,#eaffb0,var(--parchment) 60%); overflow:hidden;}
  .viewfinder{ position:absolute; left:20px; right:20px; top:70px; bottom:70px; border:2px solid var(--ink); border-radius:16px; }
  .viewfinder::before,.viewfinder::after{ content:''; position:absolute; width:24px; height:24px; border:3px solid var(--lime); }
  .viewfinder::before{ top:-3px; left:-3px; border-right:none; border-bottom:none; }
  .viewfinder::after{ bottom:-3px; right:-3px; border-left:none; border-top:none; }
  .scan-line{ position:absolute; left:6%; right:6%; height:3px; background:var(--blue); top:10%; border-radius:2px; animation:scanSweep 2.6s ease-in-out infinite; }
  .cube-float{ position:absolute; width:26px; height:26px; background:var(--lime); border-radius:6px; border:2px solid var(--ink); animation:floatBob 3.4s ease-in-out infinite; }

  .section-inner{ max-width:1200px; margin:0 auto; padding:80px 40px; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 48px; }
  .section-head .eyebrow{ display:inline-block; }
  .section-head h2{ font-size:32px; letter-spacing:-0.02em; font-weight:500; margin:12px 0 12px; }
  .section-head p{ color:var(--graphite); font-size:16px; line-height:1.6; }

  .feature-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .feature-card{
    background:var(--parchment); border-radius:28px; padding:36px 32px; transition:transform .2s ease;
  }
  .feature-card:hover{ transform:translateY(-6px); }
  .feature-card .ti{ font-size:28px; color:var(--ink); }
  .feature-card h3{ font-size:20px; font-weight:500; margin:20px 0 10px; letter-spacing:-0.01em; }
  .feature-card p{ font-size:14px; color:var(--graphite); line-height:1.6; margin:0 0 16px; }
  .feature-card .tech-bullets{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .feature-card .tech-bullets li{ font-size:12.5px; color:var(--graphite); padding-left:14px; position:relative; }
  .feature-card .tech-bullets li::before{ content:'—'; position:absolute; left:0; color:var(--ink); }

  .demo-section{ background:var(--bg); border-top:1px solid var(--ash); border-bottom:1px solid var(--ash); }
  .tab-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px; }
  .tab-btn{
    padding:10px 18px; border-radius:9999px; font-size:14px; font-weight:500; border:1px solid var(--ash);
    color:var(--graphite); transition:all .2s ease;
  }
  .tab-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .tab-btn:not(.active):hover{ border-color:var(--ink); color:var(--ink); }

  .editor-canvas{ display:grid; grid-template-columns:240px 1fr 320px; gap:20px; align-items:stretch; }
  @media (max-width:1100px){ .editor-canvas{ grid-template-columns:1fr; } }

  .panel{ background:var(--parchment); border-radius:28px; padding:24px; }
  .panel-title{ font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--graphite); margin-bottom:16px; }

  .history-item{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px; margin-bottom:6px;
    transition:background .15s ease;
  }
  .history-item:hover{ background:rgba(0,0,0,.04); }
  .history-item.active{ background:#fff; }
  .history-item .dot{ width:8px; height:8px; border-radius:50%; background:var(--lime); flex-shrink:0; }
  .history-item .meta{ font-size:12px; color:var(--graphite); }
  .history-item .name{ font-size:13.5px; font-weight:500; }

  .canvas-panel{ background:var(--bg); border:1px solid var(--ash); border-radius:28px; padding:32px; min-height:460px; display:flex; flex-direction:column; }

  .cam-frame{
    position:relative; width:100%; max-width:340px; aspect-ratio:3/4; margin:0 auto; background:var(--ink);
    border-radius:24px; overflow:hidden;
  }
  .cam-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.9) contrast(.96); }
  .cam-guide{ position:absolute; inset:24px; border:2px dashed rgba(255,255,255,.7); border-radius:16px; }
  .cam-scanline{ position:absolute; left:8%; right:8%; height:3px; background:var(--lime); border-radius:3px; animation:scanSweep 2.2s ease-in-out infinite; }
  .cam-caption{ position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#fff; font-size:12px; letter-spacing:.02em; text-shadow:0 1px 4px rgba(0,0,0,.4); }

  .result-card{ background:var(--parchment); border-radius:20px; padding:20px; margin-top:20px; }
  .result-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--ash); font-size:14px; }
  .result-row:last-child{ border-bottom:none; }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:9999px; }
  .badge-ok{ background:#e4f7d3; color:#3f6b12; }
  .badge-warn{ background:#fdeecb; color:#8a5a0a; }
  .badge-info{ background:#e4e9ff; color:var(--blue); }

  .ocr-field{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--ash); }
  .ocr-field label{ width:100px; font-size:12.5px; color:var(--graphite); flex-shrink:0; }
  .ocr-field input{ flex:1; border:1px solid var(--ash); border-radius:8px; padding:8px 10px; font-size:14px; background:#fff; }
  .ocr-field input:focus{ outline:none; border-color:var(--blue); }

  .viz-stage{ position:relative; width:100%; max-width:340px; aspect-ratio:1/1; margin:0 auto; border-radius:20px; overflow:hidden; background:var(--ink); }
  .viz-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; }
  .cube-row{ position:absolute; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:0 16px; }
  .sugar-cube{ width:22px; height:22px; background:var(--lime); border:2px solid var(--ink); border-radius:5px; }
  .sugar-cube.half{ background:linear-gradient(90deg, var(--lime) 50%, transparent 50%); }
  .salt-pile{ position:absolute; top:16px; right:16px; display:grid; grid-template-columns:repeat(6,4px); gap:2px; }
  .salt-grain{ width:4px; height:4px; background:#fff; border-radius:1px; }

  .stat-bar-wrap{ margin-top:8px; }
  .stat-bar-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--graphite); margin-bottom:6px; }
  .stat-bar-track{ height:8px; background:var(--ash); border-radius:9999px; overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:9999px; animation:barGrow 1s ease both; }

  .inspector-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .inspector-row .num{ font-size:26px; font-weight:500; letter-spacing:-0.02em; }
  .inspector-row .unit{ font-size:13px; color:var(--graphite); margin-left:4px; }

  .btn-inline{
    padding:12px 16px; border-radius:14px; font-size:13.5px; font-weight:500; background:var(--ink); color:#fff;
    display:inline-flex; align-items:center; gap:6px; transition:transform .15s ease;
  }
  .btn-inline:hover{ transform:translateY(-2px); }
  .btn-inline.secondary{ background:transparent; border:1px solid var(--ash); color:var(--ink); }

  .compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .compare-card{ background:var(--parchment); border-radius:20px; padding:20px; position:relative; }
  .compare-card select{ width:100%; padding:10px; border-radius:10px; border:1px solid var(--ash); margin-bottom:14px; background:#fff; }
  .win-badge{ position:absolute; top:14px; right:14px; }

  .tech-strip{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .tech-pill{ padding:8px 16px; border-radius:9999px; border:1px solid var(--ash); font-size:13px; color:var(--graphite); }

  .progress-rail{ display:flex; gap:0; position:relative; }
  .progress-step{ flex:1; text-align:center; position:relative; padding:0 12px; }
  .progress-step .idx{
    width:40px; height:40px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px; font-weight:500; position:relative; z-index:2;
  }
  .progress-step::before{
    content:''; position:absolute; top:20px; left:-50%; width:100%; height:2px; background:var(--ash); z-index:1;
  }
  .progress-step:first-child::before{ display:none; }
  .progress-step h4{ font-size:14.5px; font-weight:500; margin:0 0 8px; }
  .progress-step p{ font-size:12.5px; color:var(--graphite); line-height:1.5; }

  .metrics-band{ background:var(--charcoal); color:#f5f5eb; }
  .metrics-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; text-align:center; }
  .metric-num{ font-size:40px; font-weight:500; color:var(--lime); letter-spacing:-0.02em; }
  .metric-label{ font-size:13px; color:#b9b9b7; margin-top:6px; }

  footer{ background:var(--ink); color:var(--parchment); padding:56px 40px 32px; }
  .footer-inner{ max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px; }
  .footer-inner .logo{ font-size:18px; font-weight:500; margin-bottom:8px; }
  .footer-inner p{ font-size:13px; color:var(--smoke); margin:0; }
  .footer-links{ display:flex; gap:20px; }
  .footer-links span{ font-size:13px; color:var(--smoke); }

  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:14px 22px; border-radius:14px; font-size:13.5px; z-index:100; animation:toastIn .3s ease both;
    display:flex; align-items:center; gap:8px;
  }

  @media (max-width:900px){
    .hero{ flex-direction:column; padding:64px 24px; }
    .hero h1{ font-size:38px; }
    .feature-grid{ grid-template-columns:1fr; }
    .metrics-grid{ grid-template-columns:repeat(2,1fr); }
    .compare-grid{ grid-template-columns:1fr; }
    .section-inner{ padding:56px 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function Icon({name, className, style}){
  return <i className={`ti ti-${name} ${className||''}`} style={style}></i>;
}

const PRODUCTS = [
  {barcode:'8801023456781', name:'제로슈거 스파클링', brand:'맑은샘음료', category:'탄산음료', totalSize:'500mL', servingSize:'250mL', sugar:0, sodium:15, calorie:2, imgSeed:'sugar-sodium-scan-consumer-p1'},
  {barcode:'8801023456782', name:'딸기맛 우유', brand:'연강목장', category:'가공유', totalSize:'240mL', servingSize:'240mL', sugar:23, sodium:135, calorie:180, imgSeed:'sugar-sodium-scan-consumer-p2'},
  {barcode:'8801023456783', name:'짜장맛 큰컵라면', brand:'해오름식품', category:'라면', totalSize:'120g', servingSize:'120g', sugar:6, sodium:1690, calorie:505, imgSeed:'sugar-sodium-scan-consumer-p3'},
  {barcode:'8801023456784', name:'통밀 크래커', brand:'들녘베이커리', category:'과자', totalSize:'200g', servingSize:'30g', sugar:4, sodium:95, calorie:140, imgSeed:'sugar-sodium-scan-consumer-p4'},
  {barcode:'8801023456785', name:'저당 그래놀라바', brand:'들녘베이커리', category:'과자', totalSize:'120g', servingSize:'25g', sugar:5, sodium:60, calorie:110, imgSeed:'sugar-sodium-scan-consumer-p5'},
];

const DAILY_SUGAR = 50; // g
const DAILY_SODIUM = 2000; // mg
function toCubes(g){ return Math.round((g/4)*2)/2; }
function toSalt(mg){ return Math.round(mg*2.54)/1000; }

function CubeRow({grams}){
  const cubes = toCubes(grams);
  const full = Math.floor(cubes);
  const half = cubes - full >= 0.5;
  const items = [];
  for(let i=0;i<full;i++) items.push(<div className="sugar-cube" key={'f'+i}></div>);
  if(half) items.push(<div className="sugar-cube half" key="h"></div>);
  if(items.length===0) items.push(<div className="sugar-cube" style={{opacity:.25}} key="z"></div>);
  return <div className="cube-row">{items}</div>;
}

function StatBar({label, value, max, color}){
  const pct = Math.min(100, Math.round((value/max)*100));
  return (
    <div className="stat-bar-wrap">
      <div className="stat-bar-label"><span>{label}</span><span>{pct}%</span></div>
      <div className="stat-bar-track"><div className="stat-bar-fill" style={{width:pct+'%', background:color}}></div></div>
    </div>
  );
}

function Toast({message, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2200); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><Icon name="check" />{message}</div>;
}

function HistoryPanel({history, selected, onSelect}){
  return (
    <div className="panel">
      <div className="panel-title">최근 스캔 기록</div>
      {history.map((h,i)=>(
        <div key={i} className={"history-item" + (selected===i ? " active":"")} onClick={()=>onSelect(i)}>
          <div className="dot"></div>
          <div>
            <div className="name">{h.name}</div>
            <div className="meta">{h.time} · {h.mode}</div>
          </div>
        </div>
      ))}
      <div style={{marginTop:16, paddingTop:16, borderTop:'1px solid var(--ash)'}}>
        <div className="panel-title" style={{marginBottom:8}}>촬영 모드</div>
        <div style={{fontSize:12.5, color:'var(--graphite)', lineHeight:1.6}}>
          후면 카메라를 우선 요청하며, 권한 거부 시 파일 업로드 방식으로 자동 전환됩니다.
        </div>
      </div>
    </div>
  );
}

function InspectorPanel({product, onConfirm}){
  if(!product){
    return (
      <div className="panel">
        <div className="panel-title">영양정보 인스펙터</div>
        <p style={{fontSize:13, color:'var(--graphite)', lineHeight:1.6}}>제품을 스캔하거나 기록에서 선택하면 당류·나트륨 정보가 여기에 표시됩니다.</p>
      </div>
    );
  }
  const cubes = toCubes(product.sugar);
  const salt = toSalt(product.sodium);
  return (
    <div className="panel">
      <div className="panel-title">영양정보 인스펙터</div>
      <div style={{fontSize:14, fontWeight:500, marginBottom:2}}>{product.name}</div>
      <div style={{fontSize:12, color:'var(--graphite)', marginBottom:16}}>{product.brand} · {product.servingSize} 기준</div>
      <div className="inspector-row">
        <div><Icon name="cube" style={{color:'var(--ink)', marginRight:6}} />당류</div>
        <div><span className="num">{cubes}</span><span className="unit">개(각설탕)</span></div>
      </div>
      <StatBar label={"1일 기준치 대비 (당류 "+product.sugar+"g)"} value={product.sugar} max={DAILY_SUGAR} color="var(--lime)" />
      <div className="inspector-row" style={{marginTop:18}}>
        <div><Icon name="droplet" style={{color:'var(--blue)', marginRight:6}} />나트륨</div>
        <div><span className="num">{salt}</span><span className="unit">g(소금)</span></div>
      </div>
      <StatBar label={"1일 기준치 대비 (나트륨 "+product.sodium+"mg)"} value={product.sodium} max={DAILY_SODIUM} color="var(--blue)" />
      <button className="btn-inline" style={{marginTop:20, width:'100%', justifyContent:'center'}} onClick={onConfirm}>
        <Icon name="check" /> 수치 확정
      </button>
    </div>
  );
}

function BarcodeCanvas({onFound, onNotFound}){
  const [scanning, setScanning] = useState(false);
  const [phase, setPhase] = useState('idle'); // idle | found | notfound
  const run = ()=>{
    setScanning(true); setPhase('idle');
    setTimeout(()=>{
      setScanning(false);
      const found = Math.random() > 0.3;
      if(found){
        const p = PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
        setPhase('found'); onFound(p);
      } else {
        setPhase('notfound');
      }
    }, 900);
  };
  return (
    <div>
      <div className="cam-frame">
        <img className="cam-photo" src="https://picsum.photos/seed/sugar-sodium-scan-consumer-barcode/600/800" alt="바코드 촬영 프리뷰" />
        <div className="cam-guide"></div>
        {scanning && <div className="cam-scanline"></div>}
        <div className="cam-caption">바코드를 프레임 안에 맞춰주세요</div>
      </div>
      <div style={{display:'flex', gap:10, justifyContent:'center', marginTop:20}}>
        <button className="btn-inline" onClick={run}><Icon name="scan" /> {scanning ? '인식 중…' : '바코드 스캔하기'}</button>
        <button className="btn-inline secondary" onClick={onNotFound}><Icon name="keyboard" /> 번호 직접 입력</button>
      </div>
      {phase==='found' && (
        <div className="result-card reveal">
          <div className="result-row"><span>인식 결과</span><span className="badge badge-ok"><Icon name="check" style={{fontSize:11}} />등록 제품</span></div>
        </div>
      )}
      {phase==='notfound' && (
        <div className="result-card reveal">
          <div style={{fontSize:13.5, color:'var(--graphite)', marginBottom:12}}>등록되지 않은 바코드입니다. 영양성분표 촬영으로 안내합니다.</div>
          <button className="btn-inline" onClick={onNotFound}><Icon name="camera" /> 영양성분표 촬영하기</button>
        </div>
      )}
    </div>
  );
}

function OcrCanvas({onConfirm}){
  const [stage, setStage] = useState('capture'); // capture | processing | review
  const [fields, setFields] = useState({sugar:'12', sodium:'1690', serving:'1회 제공량(30g)'});
  const capture = ()=>{
    setStage('processing');
    setTimeout(()=> setStage('review'), 1100);
  };
  const update = (k,v)=> setFields(f=>({...f,[k]:v}));
  return (
    <div>
      <div className="cam-frame">
        <img className="cam-photo" src="https://picsum.photos/seed/sugar-sodium-scan-consumer-ocr/600/800?grayscale" alt="영양성분표 촬영 프리뷰" />
        <div className="cam-guide"></div>
        {stage==='processing' && <div className="cam-scanline"></div>}
        <div className="cam-caption">영양성분표 전체가 보이도록 촬영하세요</div>
      </div>
      <div style={{display:'flex', justifyContent:'center', marginTop:20}}>
        <button className="btn-inline" onClick={capture}>
          <Icon name="camera" /> {stage==='processing' ? '인식 처리 중…' : '촬영하고 인식하기'}
        </button>
      </div>
      {stage==='review' && (
        <div className="result-card reveal">
          <div style={{fontSize:12.5, color:'var(--graphite)', marginBottom:10}}>인식 결과 — 신뢰도가 낮은 항목은 직접 수정할 수 있습니다</div>
          <div className="ocr-field">
            <label>당류(g)</label>
            <input value={fields.sugar} onChange={e=>update('sugar', e.target.value)} />
            <span className="badge badge-ok">신뢰도 높음</span>
          </div>
          <div className="ocr-field">
            <label>나트륨(mg)</label>
            <input value={fields.sodium} onChange={e=>update('sodium', e.target.value)} />
            <span className="badge badge-warn">확인 필요</span>
          </div>
          <div className="ocr-field">
            <label>기준</label>
            <input value={fields.serving} onChange={e=>update('serving', e.target.value)} />
            <span className="badge badge-info">1회 제공량</span>
          </div>
          <button className="btn-inline" style={{marginTop:16, width:'100%', justifyContent:'center'}}
            onClick={()=> onConfirm({
              barcode:'-', name:'촬영한 영양성분표 제품', brand:'미등록 제품', category:'미분류',
              totalSize:'-', servingSize: fields.serving,
              sugar:Number(fields.sugar)||0, sodium:Number(fields.sodium)||0, calorie:0,
              imgSeed:'sugar-sodium-scan-consumer-ocrresult'
            })}
          >
            <Icon name="check" /> 확정하고 시각화 보기
          </button>
        </div>
      )}
    </div>
  );
}

function VisualizeCanvas({product}){
  if(!product){
    return <p style={{color:'var(--graphite)', fontSize:14, textAlign:'center', margin:'60px 0'}}>바코드 스캔 또는 영양성분표 인식을 먼저 진행해주세요.</p>;
  }
  const cubes = toCubes(product.sugar);
  const salt = toSalt(product.sodium);
  const grains = Array.from({length:24});
  return (
    <div style={{textAlign:'center'}}>
      <div className="viz-stage">
        <img className="viz-photo" src={"https://picsum.photos/seed/"+product.imgSeed+"/500/500"} alt={product.name} />
        <div className="salt-pile">{grains.map((_,i)=>(<div className="salt-grain" key={i}></div>))}</div>
        <CubeRow grams={product.sugar} />
      </div>
      <div style={{marginTop:20, fontSize:15, fontWeight:500}}>{product.name}</div>
      <div style={{fontSize:12.5, color:'var(--graphite)', marginBottom:20}}>당류 {product.sugar}g → 각설탕 {cubes}개 · 나트륨 {product.sodium}mg → 소금 약 {salt}g</div>
      <div style={{maxWidth:320, margin:'0 auto'}}>
        <StatBar label="1일 당류 기준치 대비" value={product.sugar} max={DAILY_SUGAR} color="var(--lime)" />
        <div style={{height:12}}></div>
        <StatBar label="1일 나트륨 기준치 대비" value={product.sodium} max={DAILY_SODIUM} color="var(--blue)" />
      </div>
      <div style={{display:'flex', gap:10, justifyContent:'center', marginTop:24}}>
        <button className="btn-inline" onClick={()=>window.__scanToast && window.__scanToast('결과 이미지를 저장했습니다')}><Icon name="download" /> 이미지 저장</button>
        <button className="btn-inline secondary" onClick={()=>window.__scanToast && window.__scanToast('공유 링크가 복사되었습니다')}><Icon name="share" /> 공유하기</button>
      </div>
    </div>
  );
}

function CompareCanvas(){
  const [aIdx, setAIdx] = useState(2);
  const [bIdx, setBIdx] = useState(3);
  const a = PRODUCTS[aIdx], b = PRODUCTS[bIdx];
  const per100 = (p)=> p.sugar / (parseInt(p.totalSize)||100) * 100;
  const aBetter = per100(a) <= per100(b);
  return (
    <div>
      <div className="compare-grid">
        {[[a,aIdx,setAIdx, aBetter],[b,bIdx,setBIdx, !aBetter]].map(([p, idx, setIdx, isBest], i)=>(
          <div className="compare-card" key={i}>
            {isBest && <span className="win-badge badge badge-ok"><Icon name="leaf" style={{fontSize:11}} />저당·저나트륨</span>}
            <select value={idx} onChange={e=>setIdx(Number(e.target.value))}>
              {PRODUCTS.map((pr,pi)=>(<option value={pi} key={pi}>{pr.name}</option>))}
            </select>
            <img src={"https://picsum.photos/seed/"+p.imgSeed+"/300/180"} style={{width:'100%', borderRadius:14, marginBottom:14, display:'block'}} alt={p.name} />
            <CubeRow grams={p.sugar} />
            <div style={{fontSize:13, marginTop:12}}>당류 {p.sugar}g · 나트륨 {p.sodium}mg</div>
            <div style={{fontSize:11.5, color:'var(--graphite)'}}>소금 환산 약 {toSalt(p.sodium)}g</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex', gap:10, justifyContent:'center', marginTop:24}}>
        <button className="btn-inline" onClick={()=>window.__scanToast && window.__scanToast('비교 결과를 저장했습니다')}><Icon name="download" /> 비교 결과 저장</button>
        <button className="btn-inline secondary" onClick={()=>window.__scanToast && window.__scanToast('공유 링크가 복사되었습니다')}><Icon name="share" /> 공유하기</button>
      </div>
    </div>
  );
}

const TABS = [
  {key:'barcode', label:'바코드 스캔'},
  {key:'ocr', label:'영양성분표 인식'},
  {key:'visualize', label:'각설탕·소금 시각화'},
  {key:'compare', label:'제품 비교'},
];

const FEATURES = [
  {icon:'camera', title:'모바일 웹 카메라 촬영 인터페이스', desc:'브라우저 후면 카메라로 바코드·영양성분표 모드를 전환하고, iOS Safari 정책과 권한 거부 상황을 파일 업로드로 폴백합니다.', bullets:['MediaDevices.getUserMedia 후면 카메라 우선 요청','권한 거부 시 파일 업로드 폴백 자동 전환','Canvas 기반 촬영 가이드 오버레이 렌더링']},
  {icon:'barcode', title:'바코드 인식 및 제품 자동 조회', desc:'ZXing 기반 클라이언트 사이드 디코딩으로 서버 왕복 없이 즉시 인식하고 제품 DB를 조회합니다.', bullets:['클라이언트 사이드 바코드 디코딩','프레임 스로틀링으로 신속 인식 구조','미등록 시 영양성분표 촬영 자동 안내']},
  {icon:'scan', title:'영양성분표 인식 및 시각화', desc:'상용 OCR API 연동으로 수치를 추출하고, 1회 제공량 기준으로 정규화한 뒤 각설탕·소금 개수로 환산합니다.', bullets:['Canvas 기반 이미지 전처리(기울기·대비)','신뢰도 낮은 필드 사용자 확인·수정 UI','당류 4g=각설탕 1개 환산 로직']},
];

function DemoScreen({tab, setTab, history, historyIdx, onSelectHistory, selected, onFound, onNotFound, onOcrConfirm, onConfirmInspector, onBackHome}){
  return (
    <div className="demo-screen section-inner" style={{paddingTop:32}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20, flexWrap:'wrap', gap:12}}>
        <div>
          <span className="eyebrow">LIVE DEMO</span>
          <h2 style={{fontSize:26, margin:'8px 0 0', letterSpacing:'-0.02em', fontWeight:500}}>실제 동작하는 스캔 데모</h2>
        </div>
        <button className="btn-ghost-underline" style={{fontSize:14}} onClick={onBackHome}><Icon name="arrow-left" style={{marginRight:4}} />홈으로</button>
      </div>
      <div className="tab-row">
        {TABS.map(t=>(
          <button key={t.key} className={"tab-btn"+(tab===t.key?" active":"")} onClick={()=>setTab(t.key)}>{t.label}</button>
        ))}
      </div>
      <div className="editor-canvas">
        <HistoryPanel history={history} selected={historyIdx} onSelect={onSelectHistory} />
        <div className="canvas-panel">
          {tab==='barcode' && <BarcodeCanvas onFound={onFound} onNotFound={onNotFound} />}
          {tab==='ocr' && <OcrCanvas onConfirm={onOcrConfirm} />}
          {tab==='visualize' && <VisualizeCanvas product={selected} />}
          {tab==='compare' && <CompareCanvas />}
        </div>
        <InspectorPanel product={selected} onConfirm={onConfirmInspector} />
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('home'); // 'home' | 'barcode' | 'ocr' | 'visualize' | 'compare'
  const [selected, setSelected] = useState(PRODUCTS[2]);
  const [history, setHistory] = useState([
    {name:'짜장맛 큰컵라면', time:'10분 전', mode:'바코드', product: PRODUCTS[2]},
    {name:'딸기맛 우유', time:'32분 전', mode:'바코드', product: PRODUCTS[1]},
  ]);
  const [historyIdx, setHistoryIdx] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(()=>{ window.__scanToast = (msg)=> setToast(msg); },[]);

  const handleFound = (p)=>{
    setSelected(p);
    setHistory(h=>[{name:p.name, time:'방금 전', mode:'바코드', product:p}, ...h].slice(0,6));
    setHistoryIdx(0);
  };
  const handleOcrConfirm = (p)=>{
    setSelected(p);
    setScreen('visualize');
    setHistory(h=>[{name:p.name, time:'방금 전', mode:'OCR', product:p}, ...h].slice(0,6));
    setHistoryIdx(0);
  };
  const handleNotFound = ()=> setScreen('ocr');
  const handleSelectHistory = (i)=>{ setHistoryIdx(i); setSelected(history[i].product); setScreen('visualize'); };
  const isDemo = screen !== 'home';

  const goHomeThenScroll = (id)=>{
    setScreen('home');
    setTimeout(()=>{ const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 60);
  };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      {toast && <Toast message={toast} onDone={()=>setToast(null)} />}

      <header className="topnav">
        <div className="logo" style={{cursor:'pointer'}} onClick={()=>setScreen('home')}><Icon name="camera" style={{color:'var(--lime)', WebkitTextStroke:'1px var(--ink)'}} />슈거스캔</div>
        <nav className="navlinks">
          <a className="ghost-btn" onClick={()=>goHomeThenScroll('about')}>서비스 소개</a>
          <a className="ghost-btn" onClick={()=>setScreen('barcode')}>데모 체험</a>
          <a className="ghost-btn" onClick={()=>goHomeThenScroll('tech')}>기술 스택</a>
        </nav>
        <button className="pill-cta" onClick={()=>setScreen('barcode')}>데모 체험하기</button>
      </header>

      <main style={{flex:1, width:'100%'}}>
        {isDemo ? (
          <DemoScreen
            tab={screen} setTab={setScreen}
            history={history} historyIdx={historyIdx} onSelectHistory={handleSelectHistory}
            selected={selected} onFound={handleFound} onNotFound={handleNotFound} onOcrConfirm={handleOcrConfirm}
            onConfirmInspector={()=>setToast('영양정보 수치를 확정했습니다')}
            onBackHome={()=>setScreen('home')}
          />
        ) : (
        <React.Fragment>
        <section className="hero">
          <div className="hero-copy reveal">
            <span className="eyebrow">CAMERA-BASED NUTRITION SCAN</span>
            <h1>카메라로 찍으면,<br/>당류·나트륨이 보입니다</h1>
            <p className="lede">가공식품 바코드나 영양성분표를 촬영하면 당류는 각설탕 개수로, 나트륨은 소금 환산량으로 즉시 시각화하는 모바일 웹 서비스입니다.</p>
            <div className="hero-ctas">
              <button className="btn-lime" onClick={()=>setScreen('barcode')}><Icon name="scan" /> 지금 스캔해보기</button>
              <button className="btn-ghost-underline" onClick={()=>setScreen('compare')}>제품 비교 보기</button>
            </div>
          </div>
          <div className="hero-visual reveal" style={{animationDelay:'.15s'}}>
            <div className="phone-frame">
              <div className="phone-screen">
                <div className="viewfinder"><div className="scan-line"></div></div>
              </div>
            </div>
            <div className="cube-float" style={{top:10, left:0}}></div>
            <div className="cube-float" style={{bottom:40, right:0, animationDelay:'1.1s'}}></div>
            <div className="cube-float" style={{top:60, right:20, animationDelay:'2.2s', width:18, height:18}}></div>
          </div>
        </section>

        <section className="section-inner" style={{paddingTop:56, paddingBottom:56}}>
          <div className="section-head">
            <span className="eyebrow">QUICK ACCESS</span>
            <h2>바로 체험해보기</h2>
            <p>네 가지 인식·시각화 경로를 원하는 순서대로 바로 열어볼 수 있습니다.</p>
          </div>
          <div className="tab-row" style={{justifyContent:'center'}}>
            {TABS.map(t=>(
              <button key={t.key} className="tab-btn" onClick={()=>setScreen(t.key)}>{t.label}</button>
            ))}
          </div>
        </section>

        <section id="about" className="section-inner">
          <div className="section-head">
            <span className="eyebrow">CORE CAPABILITIES</span>
            <h2>촬영 한 번으로 완성되는 인식 흐름</h2>
            <p>바코드·영양성분표 두 가지 인식 경로를 모두 지원하며, 인식 결과는 사용자가 직접 확인·수정할 수 있습니다.</p>
          </div>
          <div className="feature-grid">
            {FEATURES.map((f,i)=>(
              <div className="feature-card reveal" style={{animationDelay:(i*0.08)+'s'}} key={i}>
                <Icon name={f.icon} />
                <h3>{f.title}</h3>
                <p>{f.desc}</p>
                <ul className="tech-bullets">{f.bullets.map((b,bi)=>(<li key={bi}>{b}</li>))}</ul>
              </div>
            ))}

        </section>

        <section id="tech" className="section-inner">
          <div className="section-head">
            <span className="eyebrow">TECH STACK</span>
            <h2>구현에 사용하는 기술</h2>
          </div>
          <div className="tech-strip">
            {['React 18','TypeScript','Tailwind CSS','Node.js','Express','PostgreSQL','Prisma','ZXing'].map((t,i)=>(
              <span className="tech-pill" key={i}>{t}</span>
            ))}
          </div>
        </section>

        <section className="section-inner">
          <div className="section-head">
            <span className="eyebrow">ROADMAP</span>
            <h2>개발 진행 단계</h2>
          </div>
          <div className="progress-rail">
            {[
              {t:'요구사항 분석 및 화면 흐름 설계', d:'카메라 촬영→인식→시각화 흐름을 정의하고 PostgreSQL 제품 스키마 16개 항목을 설계합니다.'},
              {t:'카메라·바코드·OCR 연동 개발', d:'브라우저 카메라 API, ZXing 바코드 디코딩, 상용 OCR API 연동을 구현합니다.'},
              {t:'시각화·비교 UI 개발', d:'Canvas 기반 각설탕·소금 합성 그래픽과 제품 비교 화면을 React로 구현합니다.'},
              {t:'통합 테스트 및 반응형 최적화', d:'모바일 브라우저 크로스 테스트, iOS Safari 정책 대응 검증을 수행합니다.'},
            ].map((s,i)=>(
              <div className="progress-step" key={i}>
                <div className="idx">{i+1}</div>
                <h4>{s.t}</h4>
                <p>{s.d}</p>
              </div>
            ))}
          </div>
        </section>

        <section className="metrics-band">
          <div className="section-inner">
            <div className="metrics-grid">
              <div><div className="metric-num">8~10</div><div className="metric-label">구현 화면 개수</div></div>
              <div><div className="metric-num">18~22</div><div className="metric-label">연동 API 엔드포인트</div></div>
              <div><div className="metric-num">14~18</div><div className="metric-label">재사용 컴포넌트</div></div>
              <div><div className="metric-num">6~8</div><div className="metric-label">DB 테이블</div></div>
            </div>
          </div>
        </section>
        </React.Fragment>
        )}
      </main>

      <footer>
        <div className="footer-inner">
          <div>
            <div className="logo"><Icon name="camera" style={{color:'var(--lime)'}} /> 슈거스캔</div>
            <p>© 2026 슈거스캔 — 자체 개발 프로젝트</p>
          </div>
          <div className="footer-links">
            <span>식품·영양·건강</span>
            <span>모바일 웹 전용</span>
            <span>비회원 이용</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
