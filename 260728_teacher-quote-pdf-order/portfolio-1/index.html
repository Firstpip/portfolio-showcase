<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그리너클래스 파트너센터 — 교사 견적·발급 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --obsidian:#09090b; --graphite:#18181b; --slate:#27272a; --iron:#3f3f46; --steel:#52525b;
    --fog:#71717a; --ash:#a1a1aa; --mist:#d4d4d8; --cloud:#ececee; --paper:#f4f4f5; --snow:#ffffff;
    --ember:#ff5a00; --ember-soft:#fff1e8;
    --r-card:36px; --r-btn:14px; --r-badge:12px; --r-pill:10000px;
  }
  *{box-sizing:border-box}
  html,body{width:100%;margin:0;padding:0;background:var(--paper);font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;color:var(--obsidian);}
  #app-root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--mist);border-radius:10px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,90,0,0.45);}70%{box-shadow:0 0 0 8px rgba(255,90,0,0);}100%{box-shadow:0 0 0 0 rgba(255,90,0,0);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}

  .tree-sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--snow);border-right:1px solid var(--cloud);display:flex;flex-direction:column;z-index:20;}
  .sidebar-brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--cloud);}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:var(--obsidian);display:flex;align-items:center;justify-content:center;color:var(--ember);flex-shrink:0;}
  .brand-name{font-size:14px;font-weight:600;color:var(--obsidian);line-height:1.25;}
  .brand-sub{font-size:11px;color:var(--fog);}
  .sidebar-search{padding:12px 14px;display:flex;gap:8px;}
  .sb-btn{flex:1;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--iron);background:var(--paper);border:1px solid var(--cloud);border-radius:var(--r-btn);padding:8px 10px;transition:background .15s;}
  .sb-btn:hover{background:var(--cloud);}
  .tree-nav{flex:1;overflow-y:auto;padding:4px 10px;}
  .tree-group{margin-bottom:2px;}
  .tree-item{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:none;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--iron);text-align:left;transition:background .12s;}
  .tree-item:hover{background:var(--paper);}
  .tree-item.active{background:var(--ember-soft);color:var(--obsidian);font-weight:600;}
  .tree-item .tg{color:var(--ash);width:14px;display:inline-flex;}
  .tree-item.depth-1{padding-left:26px;font-size:12.5px;}
  .tree-item.depth-2{padding-left:46px;font-size:12px;color:var(--fog);}
  .tree-badge{margin-left:auto;background:var(--ember);color:#fff;font-size:10px;font-weight:700;border-radius:var(--r-pill);padding:1px 6px;}
  .sidebar-footer{padding:12px 14px;border-top:1px solid var(--cloud);display:flex;flex-direction:column;gap:4px;}
  .footer-link{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fog);background:none;border:none;padding:6px 4px;border-radius:8px;}
  .footer-link:hover{background:var(--paper);color:var(--iron);}

  .main-wrap{margin-left:250px;flex:1;min-width:0;width:calc(100% - 250px);min-height:100vh;display:flex;flex-direction:column;}
  .page-breadcrumb{padding:18px 40px 0;font-size:12.5px;color:var(--fog);display:flex;align-items:center;gap:6px;}
  .page-breadcrumb b{color:var(--obsidian);font-weight:600;}

  .page-body{max-width:1180px;width:100%;margin:0 auto;padding:18px 40px 60px;animation:fadeInUp .35s ease;}
  .page-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .page-icon-lg{width:52px;height:52px;border-radius:16px;background:var(--obsidian);color:#fff;display:flex;align-items:center;justify-content:center;}
  .page-meta{display:flex;gap:6px;}
  .meta-action{font-size:12px;color:var(--fog);background:var(--paper);border:1px solid var(--cloud);border-radius:8px;padding:5px 9px;display:flex;align-items:center;gap:5px;}
  .page-title{font-size:32px;font-weight:700;margin:14px 0 6px;letter-spacing:-0.5px;}
  .page-desc{font-size:15px;color:var(--steel);line-height:1.55;max-width:720px;margin-bottom:26px;}

  .block{padding:10px 0;border-radius:8px;}
  .block-callout{display:flex;gap:10px;background:var(--ember-soft);border-radius:16px;padding:16px 18px;margin:14px 0;border-left:4px solid var(--ember);}
  .block-callout .ci{color:var(--ember);flex-shrink:0;margin-top:1px;}
  .block-callout p{margin:0;font-size:14px;color:var(--iron);line-height:1.6;}
  .block-divider{border:none;border-top:1px solid var(--cloud);margin:22px 0;}
  .block-toggle{margin:14px 0;border:1px solid var(--cloud);border-radius:16px;padding:14px 16px;}
  .toggle-head{display:flex;align-items:center;gap:8px;background:none;border:none;width:100%;text-align:left;font-size:14px;font-weight:600;color:var(--obsidian);}
  .toggle-head .ta{transition:transform .2s;color:var(--fog);}
  .toggle-head.open .ta{transform:rotate(90deg);}
  .toggle-body{padding:12px 4px 2px 22px;font-size:13px;color:var(--steel);}
  .ver-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--cloud);}
  .ver-row:last-child{border-bottom:none;}

  .split{display:flex;gap:24px;align-items:flex-start;}
  .list-rail{width:340px;flex-shrink:0;background:var(--snow);border:1px solid var(--cloud);border-radius:var(--r-card);padding:6px;max-height:640px;overflow-y:auto;}
  .rail-item{display:flex;flex-direction:column;gap:4px;width:100%;background:none;border:none;border-radius:24px;padding:14px 16px;text-align:left;margin-bottom:2px;}
  .rail-item:hover{background:var(--paper);}
  .rail-item.active{background:var(--obsidian);}
  .rail-item.active .ri-title,.rail-item.active .ri-sub{color:#fff;}
  .rail-item.active .ri-sub{color:var(--ash);}
  .ri-top{display:flex;justify-content:space-between;align-items:center;}
  .ri-title{font-size:14px;font-weight:600;color:var(--obsidian);}
  .ri-sub{font-size:12px;color:var(--fog);}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-badge);display:inline-flex;align-items:center;gap:4px;}
  .badge-done{background:#dcfce7;color:#166534;}
  .badge-wait{background:#fef3c7;color:#92400e;}
  .badge-revise{background:#fee2e2;color:#991b1b;}

  .detail-panel{flex:1;min-width:0;background:var(--snow);border:1px solid var(--cloud);border-radius:var(--r-card);padding:28px;}
  .dp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .dp-title{font-size:20px;font-weight:700;}
  .dp-sub{font-size:12.5px;color:var(--fog);margin-top:4px;}
  .dp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  .sum-card{background:var(--paper);border-radius:20px;padding:14px 16px;}
  .sum-label{font-size:11.5px;color:var(--fog);margin-bottom:4px;}
  .sum-value{font-size:18px;font-weight:700;color:var(--obsidian);}
  table.doc-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
  table.doc-table th{font-size:11.5px;color:var(--fog);text-align:left;padding:8px 10px;border-bottom:1px solid var(--cloud);font-weight:600;}
  table.doc-table td{font-size:13.5px;padding:10px 10px;border-bottom:1px solid var(--cloud);color:var(--iron);}
  .dp-actions{display:flex;gap:10px;margin-top:8px;}

  .btn{border-radius:var(--r-btn);padding:11px 18px;font-size:13.5px;font-weight:500;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;transition:transform .12s, box-shadow .12s;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--obsidian);color:#fff;box-shadow:inset 0 0.5px 0 rgba(255,255,255,.5), 0 4px 10px rgba(0,0,0,.12);}
  .btn-primary:hover{box-shadow:inset 0 0.5px 0 rgba(255,255,255,.5), 0 6px 16px rgba(0,0,0,.18);}
  .btn-ghost{background:#fff;color:var(--iron);border:1px solid var(--iron);border-radius:var(--r-pill);}
  .btn-outline{background:var(--paper);color:var(--iron);border:1px solid var(--cloud);}
  .btn-danger-outline{background:#fff;color:#b91c1c;border:1px solid #fecaca;}
  .btn-accent{background:var(--ember);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .section-title{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--obsidian);}

  .calc-block{background:var(--snow);border:1px solid var(--cloud);border-radius:var(--r-card);padding:28px;}
  .kit-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--cloud);}
  .kit-row:last-child{border-bottom:none;}
  .kit-name{font-size:14px;font-weight:500;color:var(--obsidian);}
  .kit-price{font-size:12px;color:var(--fog);}
  .stepper{display:flex;align-items:center;gap:10px;}
  .step-btn{width:28px;height:28px;border-radius:8px;background:var(--paper);border:1px solid var(--cloud);display:flex;align-items:center;justify-content:center;color:var(--iron);}
  .step-btn:hover{background:var(--cloud);}
  .qty-val{width:24px;text-align:center;font-size:14px;font-weight:600;}
  .num-input{width:90px;padding:9px 10px;border:1px solid var(--cloud);border-radius:12px;font-size:14px;font-family:inherit;}
  .calc-result{margin-top:20px;background:var(--paper);border-radius:20px;padding:20px;}
  .cr-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--steel);padding:5px 0;}
  .cr-total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:var(--obsidian);padding-top:12px;margin-top:8px;border-top:1px solid var(--mist);}

  .approval-row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--cloud);}
  .approval-row:last-child{border-bottom:none;}
  .chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--mist);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .chk.checked{background:var(--obsidian);border-color:var(--obsidian);color:#fff;}
  .av{width:38px;height:38px;border-radius:12px;flex-shrink:0;}
  .bulk-bar{position:sticky;bottom:0;background:var(--obsidian);color:#fff;border-radius:20px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;animation:fadeInUp .25s ease;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(9,9,11,0.35);display:flex;justify-content:flex-end;z-index:100;animation:fadeInUp .18s ease;}
  .drawer{width:420px;max-width:92vw;height:100%;background:#fff;padding:26px;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12);}
  .id-card-preview{width:100%;height:170px;border-radius:20px;background:linear-gradient(135deg,#fff1e8 0%,#f4f4f5 100%);border:1px dashed var(--ash);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--fog);margin:14px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(9,9,11,.4);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal-box{width:420px;max-width:90vw;background:#fff;border-radius:28px;padding:26px;animation:fadeInScale .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal-box h3{margin:0 0 6px;font-size:18px;}
  .modal-box p.hint{font-size:12.5px;color:var(--fog);margin:0 0 16px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--iron);display:block;margin-bottom:6px;}
  .field select,.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--cloud);border-radius:12px;font-family:inherit;font-size:13.5px;margin-bottom:14px;}
  .field textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--obsidian);color:#fff;padding:13px 18px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);}

  .pdf-card{background:#fff;border:1px solid var(--cloud);border-radius:var(--r-card);padding:0;overflow:hidden;max-width:640px;}
  .pdf-head{padding:26px 30px;border-bottom:2px solid var(--obsidian);display:flex;justify-content:space-between;align-items:flex-start;}
  .pdf-body{padding:24px 30px;}
  .stamp{width:88px;height:88px;border-radius:50%;border:3px solid #d33;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;transform:rotate(-8deg);opacity:.9;}
  .stamp span{font-size:10px;font-weight:800;color:#d33;text-align:center;line-height:1.3;}
  .ver-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .ver-tab{padding:7px 16px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--paper);color:var(--fog);border:1px solid var(--cloud);}
  .ver-tab.active{background:var(--obsidian);color:#fff;border-color:var(--obsidian);}

  .stepper-flow{display:flex;align-items:center;gap:0;margin:20px 0;}
  .flow-node{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .flow-dot{width:30px;height:30px;border-radius:50%;background:var(--cloud);color:var(--fog);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .flow-dot.done{background:var(--obsidian);color:#fff;}
  .flow-dot.now{background:var(--ember);color:#fff;animation:pulseDot 1.8s infinite;}
  .flow-label{font-size:11px;color:var(--fog);}
  .flow-line{flex:1;height:2px;background:var(--cloud);margin-top:-22px;}
  .flow-line.done{background:var(--obsidian);}

  .skel{background:linear-gradient(90deg,var(--paper) 0px, var(--cloud) 40px, var(--paper) 80px);background-size:200px 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
</style>
</head>

function toPascalIconName(name){
  return name.split('-').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join('');
}
function iconSvgMarkup(name,size){
  const nodes = (window.lucide && window.lucide.icons && window.lucide.icons[toPascalIconName(name)]) || [];
  const inner = nodes.map(([tag,attrs])=>{
    const attrStr = Object.keys(attrs).map(k=>`${k}="${attrs[k]}"`).join(' ');
    return `<${tag} ${attrStr}></${tag}>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
function Icon({name, size=16, className=''}){
  // dangerouslySetInnerHTML로 정적 SVG 문자열을 주입 — lucide.createIcons()의 실시간 DOM 치환은
  // React의 재조정(reconciliation)과 충돌해 removeChild 크래시를 유발하므로 사용하지 않는다.
  return <span className={className} style={{display:'inline-flex',width:size,height:size,flexShrink:0}} dangerouslySetInnerHTML={{__html: iconSvgMarkup(name,size)}}/>;
}

function QuoteScreen({pushToast}){
  const [qty,setQty] = useState({'sea-wallet':10,'paper-gacha':0,'energy-theater':0,'denim-basic':0,'cap-craft':0});

  const tier = useMemo(()=> INSTRUCTOR_TIERS.find(t=>people>=t.min && people<=t.max) || INSTRUCTOR_TIERS[0], [people]);

    <div className="page-body">
      <div className="page-icon-row">
        <div className="page-icon-lg"><Icon name="calculator" size={22}/></div>
      </div>

      <div className="block-callout">
        <span className="ci"><Icon name="lightbulb" size={17}/></span>
        <p>단가 기준 변경 이력을 별도 테이블로 관리하여, 이후 단가가 바뀌어도 과거 견적서의 금액은 계산 당시 기준으로 그대로 유지되도록 설계합니다.</p>
      </div>

      <div className="calc-block">

            <div className="stepper">

        <div className="calc-result">
          <div className="cr-row"><span>교구 합계 ({kitCount}개)</span><span>{totalKits.toLocaleString()}원</span></div>
          <div className="cr-row"><span>강사비 ({tier.min}~{tier.max===9999?'∞':tier.max}명 구간)</span><span>{tier.fee.toLocaleString()}원</span></div>

        <div className="dp-actions">

        </div>
      </div>
    </div>
  );
}

function ApprovalScreen({pushToast}){
  const [queue,setQueue] = useState(APPROVAL_QUEUE);
  const [selected,setSelected] = useState([]);
  const [preview,setPreview] = useState(null);
  const [rejectReason,setRejectReason] = useState('');

  const toggleSel = id => setSelected(s=> s.includes(id)? s.filter(x=>x!==id) : [...s,id]);
  const approve = (id)=>{ setQueue(q=>q.filter(x=>x.id!==id)); setPreview(null); setSelected(s=>s.filter(x=>x!==id)); pushToast('승인 처리 및 승인 완료 문자가 발송되었습니다'); };
  const reject = (id)=>{ if(!rejectReason.trim()) return; setQueue(q=>q.filter(x=>x.id!==id)); setPreview(null); setRejectReason(''); pushToast('반려 처리되었습니다'); };
  const bulkApprove = ()=>{ setQueue(q=>q.filter(x=>!selected.includes(x.id))); pushToast(`${selected.length}건 일괄 승인 처리되었습니다`); setSelected([]); };

  return (
    <div className="page-body">
      <div className="page-icon-row"><div className="page-icon-lg"><Icon name="shield-check" size={22}/></div></div>
      <h1 className="page-title">관리자 승인 워크플로우</h1>
      <p className="page-desc">고유번호증 첨부 회원가입 신청을 검토해 승인 또는 반려 처리하는 상태 머신 기반 승인 큐를 구현합니다.</p>

      <div className="list-rail" style={{width:'100%',maxHeight:'none'}}>
        {queue.length===0 && <div style={{padding:30,textAlign:'center',color:'var(--fog)',fontSize:13}}>승인 대기 중인 신청이 없습니다.</div>}
        {queue.map(a=>(
          <div className="approval-row" key={a.id}>
            <button className={`chk ${selected.includes(a.id)?'checked':''}`} onClick={()=>toggleSel(a.id)}>
              {selected.includes(a.id) && <Icon name="check" size={12}/>}
            </button>
            <div className="av" style={{background:`hsl(${a.name.charCodeAt(0)*7%360},70%,88%)`,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'var(--obsidian)',fontSize:13}}>{a.name[0]}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600}}>{a.name} 선생님 · <span style={{fontWeight:400,color:'var(--fog)'}}>{a.role}</span></div>
              <div style={{fontSize:12,color:'var(--fog)'}}>{a.org} · 제출 {a.submittedAt}</div>
            </div>
            <button className="btn btn-outline" onClick={()=>setPreview(a)}><Icon name="eye" size={13}/>미리보기</button>
          </div>
        ))}
      </div>

      {selected.length>0 && (
        <div className="bulk-bar">
          <span style={{fontSize:13}}>{selected.length}건 선택됨</span>
          <button className="btn btn-accent" onClick={bulkApprove}><Icon name="check-check" size={14}/>선택 일괄 승인</button>
        </div>
      )}

      {preview && (
        <div className="drawer-overlay" onClick={()=>setPreview(null)}>
          <div className="drawer" onClick={e=>e.stopPropagation()}>
            <h3 style={{margin:'0 0 4px'}}>{preview.name} 선생님</h3>
            <p style={{fontSize:12.5,color:'var(--fog)',margin:'0 0 12px'}}>{preview.org} · {preview.role}</p>
            <div className="id-card-preview">
              <Icon name="id-card" size={28}/>
              <span style={{fontSize:12}}>고유번호증 미리보기</span>
            </div>
            <div className="field">
              <label>반려 사유 (반려 시 필수)</label>
              <textarea placeholder="반려 사유를 입력하세요" value={rejectReason} onChange={e=>setRejectReason(e.target.value)}/>
            </div>
            <div className="modal-actions">
              <button className="btn btn-danger-outline" disabled={!rejectReason.trim()} onClick={()=>reject(preview.id)}><Icon name="x" size={13}/>반려</button>
              <button className="btn btn-primary" onClick={()=>approve(preview.id)}><Icon name="check" size={13}/>승인</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                  <div className="flow-label">{label}</div>
                </div>
                {i<STEP_LABELS.length-1 && <div className={`flow-line ${i<order.step?'done':''}`}/>}
              </React.Fragment>
            ))}
          </div>

          <div className="dp-summary">
            <div className="sum-card"><div className="sum-label">명단 파일</div><div className="sum-value" style={{fontSize:13}}><Icon name="file-spreadsheet" size={14}/> {order.listFile}</div></div>
            <div className="sum-card"><div className="sum-label">배송 주소</div><div className="sum-value" style={{fontSize:12.5}}>{order.address}</div></div>
            <div className="sum-card"><div className="sum-label">청구 금액</div><div className="sum-value">{order.amount.toLocaleString()}원</div></div>
          </div>

          <div className="dp-actions">
            <button className="btn btn-primary" disabled={order.step>=4} onClick={advance}><Icon name="arrow-right-circle" size={14}/>다음 단계로 진행</button>
            <button className="btn btn-outline" onClick={()=>pushToast('청구서가 재발송되었습니다')}><Icon name="receipt" size={14}/>청구서 발송</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function QuickAddModal({onClose,pushToast}){
  const [teacher,setTeacher] = useState('');
  const [type,setType] = useState('견적서');
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>새 발급 문서</h3>
        <p className="hint">교사와 문서 종류를 선택해 신규 발급 문서를 생성합니다.</p>
        <div className="field">
          <label>교사 선택</label>
          <select value={teacher} onChange={e=>setTeacher(e.target.value)}>
            <option value="">선택하세요</option>
            {DOCS.map(d=><option key={d.id} value={d.teacher}>{d.teacher} ({d.org})</option>)}
          </select>
        </div>
        <div className="field">
          <label>문서 종류</label>
          <select value={type} onChange={e=>setType(e.target.value)}>
            <option>견적서</option>
            <option>자원기부확인서</option>
          </select>
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>취소</button>
          <button className="btn btn-primary" disabled={!teacher} onClick={()=>{pushToast(`${teacher} 선생님의 ${type}가 생성되었습니다`); onClose();}}>생성</button>
        </div>
      </div>
    </div>
  );
}

function ReissueModal({doc,onClose,pushToast}){
  const [reason,setReason] = useState('');
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>재발행 요청</h3>
        <p className="hint">{doc.docNo} 문서의 수정을 요청합니다. 요청 시 관리자에게 알림이 전송되고, 재발행되면 새 회차가 생성되며 이전 회차는 그대로 보존됩니다.</p>
        <div className="field">
          <label>수정 요청 사유</label>
          <textarea placeholder="예: 인원 수 변경으로 강사비 재산정 요청" value={reason} onChange={e=>setReason(e.target.value)}/>
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>취소</button>
          <button className="btn btn-primary" disabled={!reason.trim()} onClick={()=>{pushToast('재발행 요청이 접수되었습니다'); onClose();}}>요청 제출</button>
        </div>
      </div>
    </div>
  );
}

function SearchModal({onClose,setScreen}){
  const [q,setQ] = useState('');
  const items = [
    {label:'발급 이력', id:'main'},{label:'견적 계산', id:'quote'},{label:'승인 워크플로우', id:'approval'},
    {label:'PDF 자동 발행', id:'pdf-issue'},{label:'주문 접수', id:'order'},
  ].filter(i=>i.label.includes(q));
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="field">
          <label>검색</label>
          <input autoFocus placeholder="화면 또는 문서 검색" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        {items.map(i=>(
          <button key={i.id} className="footer-link" style={{width:'100%',padding:'10px 8px',fontSize:13.5}} onClick={()=>{setScreen(i.id); onClose();}}><Icon name="arrow-right" size={13}/>{i.label}</button>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreenRaw] = useState('main');
  const [selectedId,setSelectedId] = useState(DOCS[0].id);
  const [toasts,setToasts] = useState([]);
  const [quickAdd,setQuickAdd] = useState(false);
  const [reissueDoc,setReissueDoc] = useState(null);
  const [searchOpen,setSearchOpen] = useState(false);

  const setScreen = (s)=>{
    const map = {'doc-quote':'main','doc-donation':'main','approval-group':'approval','calc-group':'quote'};
    setScreenRaw(map[s]||s);
  };

  const pushToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3200);
  };

  const breadcrumbMap = {
    main:['발급 이력'], quote:['계산 도구','견적 계산'], approval:['진행 관리','승인 워크플로우'],
    'pdf-issue':['PDF 발행'], order:['진행 관리','주문 접수'],
  };
  const crumbs = breadcrumbMap[screen] || ['발급 이력'];

  return (
    <div style={{display:'flex',width:'100%',minHeight:'100vh',borderRadius:36}} data-archetype="notion-blocks-tree">
      <TreeSidebar screen={screen} setScreen={setScreen} onSearch={()=>setSearchOpen(true)} onQuickAdd={()=>setQuickAdd(true)} pendingCount={APPROVAL_QUEUE.length} pushToast={pushToast}/>
      <div className="main-wrap">
        <div className="page-breadcrumb">
          {crumbs.map((c,i)=>(<React.Fragment key={c}><span>{i===crumbs.length-1?<b>{c}</b>:c}</span>{i<crumbs.length-1 && <Icon name="chevron-right" size={11}/>}</React.Fragment>))}
        </div>
        {screen==='main' && <MainScreen selectedId={selectedId} setSelectedId={setSelectedId} openReissue={setReissueDoc} pushToast={pushToast}/>}
        {screen==='quote' && <QuoteScreen pushToast={pushToast}/>}
        {screen==='approval' && <ApprovalScreen pushToast={pushToast}/>}
        {screen==='pdf-issue' && <PdfIssueScreen pushToast={pushToast}/>}
        {screen==='order' && <OrderScreen pushToast={pushToast}/>}
      </div>
      {quickAdd && <QuickAddModal onClose={()=>setQuickAdd(false)} pushToast={pushToast}/>}
      {reissueDoc && <ReissueModal doc={reissueDoc} onClose={()=>setReissueDoc(null)} pushToast={pushToast}/>}
      {searchOpen && <SearchModal onClose={()=>setSearchOpen(false)} setScreen={setScreen}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App/>);
</script>
</body>
</html>
