<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그리너클래스 오퍼레이션 콘솔 — 운영 통합 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root{
    --primary:#d4c7ff; --secondary:#e3e3e2; --accent:#f6bc1e; --bg:#f2f0eb; --surface:#ffffff;
    --text:#292827; --text2:#666666; --violet:#714cb6; --wine:#421d24;
    --r-card:16px; --r-btn:16px; --r-tab:8px; --r-pill:999px;
    --shadow-subtle: inset 0 0 0 1px rgba(113,76,182,.28), 0 1px 3px rgba(41,40,39,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;background:var(--bg);font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;color:var(--text);}
  #app-root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:10px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes livePing{0%{opacity:.9;}50%{opacity:.25;}100%{opacity:.9;}}

  .app-header{position:sticky;top:0;z-index:30;height:60px;background:rgba(242,240,235,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--secondary);display:flex;align-items:center;padding:0 28px;gap:24px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--text);flex-shrink:0;}
  .brand-badge{width:30px;height:30px;border-radius:9px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;}
  .project-switcher{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);background:var(--surface);border:1px solid var(--secondary);padding:6px 12px;border-radius:var(--r-pill);}
  .global-nav{display:flex;gap:4px;flex:1;}
  .nav-link{font-size:13.5px;color:var(--text2);background:none;border:none;padding:9px 14px;border-radius:10px;font-weight:500;}
  .nav-link:hover{background:rgba(0,0,0,.03);}
  .nav-link.active{background:var(--primary);color:var(--text);font-weight:700;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .hact{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--secondary);display:flex;align-items:center;justify-content:center;color:var(--text2);position:relative;}
  .hact .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--wine);border-radius:50%;}
  .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text);}

  .tab-bar{display:flex;gap:22px;padding:0 28px;border-bottom:1px solid var(--secondary);background:var(--bg);position:sticky;top:60px;z-index:25;}
  .tab{background:none;border:none;padding:13px 2px;font-size:13.5px;color:var(--text2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--text);font-weight:700;border-bottom:2px solid var(--wine);}

  .content{max-width:1280px;margin:0 auto;padding:26px 28px 70px;animation:fadeInUp .35s ease;}

  .status-strip{display:flex;align-items:center;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-subtle);padding:16px 26px;gap:0;margin-bottom:22px;}
  .stat-item{display:flex;flex-direction:column;gap:3px;padding:0 26px;flex:1;position:relative;}
  .stat-item:not(:last-child):after{content:'';position:absolute;right:0;top:6px;bottom:6px;width:1px;background:var(--secondary);}
  .stat-label{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#2fae66;animation:livePing 1.6s infinite;}
  .stat-value{font-size:28px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
  .stat-trend{font-size:11px;font-weight:600;}
  .stat-trend.up{color:#1d7a45;} .stat-trend.down{color:#b3261e;}

  .command-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:22px;}
  .panel{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-subtle);padding:22px 24px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .panel-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;}

  .timeline{display:flex;flex-direction:column;}
  .tl-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--secondary);cursor:pointer;border-radius:8px;transition:background .12s;}
  .tl-row:hover{background:rgba(0,0,0,.02);}
  .tl-row:last-child{border-bottom:none;}
  .tl-time{width:52px;flex-shrink:0;font-size:11.5px;color:var(--text2);padding-top:2px;}
  .tl-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .tl-body{flex:1;font-size:13px;color:var(--text);}
  .tl-tag{font-size:10.5px;color:var(--text2);}

  .priority-rail{display:flex;flex-direction:column;gap:10px;}
  .pr-item{background:var(--bg);border-radius:12px;padding:12px 14px;border-left:3px solid var(--wine);}
  .pr-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;}
  .pr-due{font-size:11px;color:#b3261e;font-weight:700;}
  .pr-sub{font-size:11.5px;color:var(--text2);margin-top:2px;}
  .pr-btn{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--violet);background:none;border:none;padding:0;display:flex;align-items:center;gap:4px;}

  .secondary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .widget{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-subtle);padding:18px 20px;transition:transform .18s ease;}
  .widget:hover{transform:scale(1.02);}
  .widget-title{font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:10px;}
  .chart-box{height:120px;position:relative;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--secondary);border-radius:12px;padding:9px 14px;flex:1;max-width:340px;}
  .search-box input{border:none;outline:none;font-size:13px;font-family:inherit;background:none;flex:1;color:var(--text);}
  .filter-chip{font-size:12.5px;padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--secondary);background:var(--surface);color:var(--text2);margin-right:6px;}
  .filter-chip.active{background:var(--primary);color:var(--text);border-color:var(--primary);font-weight:700;}

  table.data-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-subtle);}
  table.data-table th{text-align:left;font-size:11.5px;color:var(--text2);padding:13px 16px;border-bottom:1px solid var(--secondary);font-weight:600;background:rgba(0,0,0,.015);}
  table.data-table td{padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--secondary);color:var(--text);}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table tbody tr{cursor:pointer;transition:background .12s;}
  table.data-table tbody tr:hover{background:rgba(0,0,0,.02);}

  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;}
  .badge-ok{background:#dcf5e6;color:#166534;}
  .badge-wait{background:#fdecc8;color:#8a5a00;}
  .badge-no{background:#fbdede;color:#991b1b;}
  .badge-lilac{background:var(--primary);color:var(--text);}

  .btn{border-radius:var(--r-btn);padding:11px 18px;font-size:13.5px;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;transition:transform .12s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--text);}
  .btn-primary:hover{filter:brightness(0.96);}
  .btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--secondary);}
  .btn-danger{background:#fff;color:#b3261e;border:1px solid #f3c6c2;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}

  .toggle-switch{width:38px;height:22px;border-radius:999px;background:var(--secondary);position:relative;transition:background .2s;flex-shrink:0;border:none;}
  .toggle-switch.on{background:#2fae66;}
  .toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .toggle-switch.on .toggle-knob{left:18px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(41,40,39,.4);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal-box{width:460px;max-width:90vw;background:var(--surface);border-radius:20px;padding:26px;animation:fadeInScale .2s ease;box-shadow:0 24px 60px rgba(41,40,39,.22);max-height:86vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 6px;font-size:19px;}
  .modal-box p.hint{font-size:12.5px;color:var(--text2);margin:0 0 16px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--text);display:block;margin-bottom:6px;}
  .field select,.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--secondary);border-radius:10px;font-family:inherit;font-size:13.5px;margin-bottom:14px;background:var(--bg);}
  .field textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(41,40,39,.32);display:flex;justify-content:flex-end;z-index:150;}
  .drawer{width:440px;max-width:92vw;height:100%;background:var(--surface);padding:26px;overflow-y:auto;box-shadow:-10px 0 34px rgba(41,40,39,.15);animation:fadeInUp .2s ease;}
  .drawer-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--secondary);font-size:13px;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--wine);color:#fff;padding:13px 18px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);}

  .price-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--secondary);}
  .price-input{width:110px;padding:8px 10px;border:1px solid var(--secondary);border-radius:10px;font-family:inherit;font-size:13.5px;text-align:right;}

  h1.page-title{font-size:34px;font-weight:600;letter-spacing:-0.6px;margin:0 0 6px;}
  p.page-desc{font-size:14.5px;color:var(--text2);line-height:1.55;max-width:760px;margin:0 0 22px;}

  .hero-band{position:relative;border-radius:20px;padding:34px 36px;margin:22px 0 26px;overflow:hidden;
    background:
      radial-gradient(circle at 12% 30%, rgba(246,188,30,.35) 0%, transparent 55%),
      radial-gradient(circle at 85% 20%, rgba(113,76,182,.30) 0%, transparent 55%),
      radial-gradient(circle at 60% 100%, rgba(212,199,255,.55) 0%, transparent 60%),
      linear-gradient(135deg, #fbf3e6 0%, #f2f0eb 60%, #ece3f7 100%);
  }
  .hero-band .hero-eyebrow{font-size:12.5px;font-weight:700;color:var(--violet);letter-spacing:.02em;margin-bottom:8px;position:relative;z-index:1;}
  .hero-band h2{font-size:32px;font-weight:600;letter-spacing:-0.9px;color:var(--wine);margin:0 0 8px;position:relative;z-index:1;max-width:560px;line-height:1.2;}
  .hero-band p{font-size:14px;color:var(--text);opacity:.85;margin:0;position:relative;z-index:1;max-width:520px;}
  .hero-wave{position:absolute;right:-10px;bottom:-30px;opacity:.9;z-index:0;}

  .dark-band{background:#0c4243;border-radius:var(--r-card);padding:22px 24px;color:#fff;}
  .dark-band .panel-title{color:#fff;}
  .dark-band .pr-item{background:rgba(255,255,255,.08);border-left:3px solid var(--accent);}
  .dark-band .pr-sub{color:rgba(255,255,255,.65);}
  .dark-band .pr-due{color:#ffb4a8;}
  .dark-band .pr-top{color:#fff;}
  .dark-band .pr-btn{color:var(--accent);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect} = React;
const {ResponsiveContainer,AreaChart,Area,BarChart,Bar,PieChart,Pie,Cell,XAxis,Tooltip} = Recharts;

function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t=><div className="toast" key={t.id}><Icon name="check-circle"/>{t.msg}</div>)}</div>;
}

function Header({screen,setScreen,pushToast}){
  const items = [
    {id:'main',label:'개요'},{id:'members',label:'회원 관리'},{id:'orders-billing',label:'주문·청구'},
    {id:'notification',label:'알림 템플릿'},{id:'pricing',label:'단가 기준'},
  ];
  return (
    <header className="app-header">
      <div className="brand"><div className="brand-badge"><Icon name="tree-structure"/></div>그리너클래스 오퍼레이션</div>
      <div className="project-switcher">파트너 운영 콘솔 <Icon name="caret-down" size={12}/></div>
      <nav className="global-nav">
        {items.map(i=>(
          <button key={i.id} className={`nav-link ${screen===i.id?'active':''}`} onClick={()=>setScreen(i.id)}>{i.label}</button>

      </nav>
      <div className="header-actions">
        <button className="hact" onClick={()=>pushToast('빠른 검색을 표시합니다')}><Icon name="magnifying-glass"/></button>

      </div>
    </header>
  );
}


function OverviewScreen({pushToast,openDetail}){
  const [tab,setTab] = useState('전체 현황');
  return (
    <React.Fragment>
      <nav className="tab-bar">
        <button role="tab" className={`tab ${tab==='전체 현황'?'active':''}`} onClick={()=>setTab('전체 현황')}>전체 현황</button>
        <button role="tab" className={`tab ${tab==='실시간 처리'?'active':''}`} onClick={()=>setTab('실시간 처리')}>실시간 처리</button>
        <button role="tab" className={`tab ${tab==='지연 항목'?'active':''}`} onClick={()=>setTab('지연 항목')}>지연 항목</button>
      </nav>

  const [toasts,setToasts] = useState([]);
  const pushToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);
  };
  const openDetail = (e)=> pushToast(`상세: ${e.text}`);

  return (
    <div data-archetype="topbar-analytics" style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column',borderRadius:16}}>
      <Header screen={screen} setScreen={setScreen} pushToast={pushToast}/>
      {screen==='main' && <OverviewScreen pushToast={pushToast} openDetail={openDetail}/>}
      {screen==='members' && <MembersScreen pushToast={pushToast}/>}
      {screen==='orders-billing' && <OrdersBillingScreen pushToast={pushToast}/>}
      {screen==='notification' && <NotificationScreen pushToast={pushToast}/>}
      {screen==='pricing' && <PricingScreen pushToast={pushToast}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App/>);
</script>
</body>
</html>
