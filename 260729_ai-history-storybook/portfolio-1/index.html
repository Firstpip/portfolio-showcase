<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관광 미션 기반 AI 역사동화 생성 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --ink:#17191c;
    --paper:#ffffff;
    --mist:#f2f2f3;
    --fog:#fafafb;
    --slate:#777b86;
    --ash:#979799;
    --peach:#fbe1d1;
    --sienna:#5d2a1a;
    --line:#ececec;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--peach);color:var(--sienna);}

  /* ── keyframes ── */
  @keyframes fadeSlideUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes cardStagger{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes shimmer{ 0%{background-position:-320px 0;} 100%{background-position:320px 0;} }
  @keyframes pulseSoft{ 0%,100%{box-shadow:0 0 0 0 rgba(23,25,28,.16);} 50%{box-shadow:0 0 0 10px rgba(23,25,28,0);} }
  @keyframes progressFill{ from{width:4%;} to{width:100%;} }
  @keyframes toastSlide{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes modalFadeScale{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
  @keyframes floatBook{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(1deg);} }

  .skeleton{
    background:linear-gradient(90deg, var(--mist) 25%, #e7e7e9 37%, var(--mist) 63%);
    background-size:400px 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    border-radius:16px;
  }
  .topnav{width:100%;height:72px;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em;}
  .brand .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--peach);
    animation:floatBook 5s ease-in-out infinite;}
  .step-pill{font-size:13px;color:var(--slate);background:var(--fog);border:1px solid var(--line);padding:6px 14px;border-radius:9999px;}
  .hist-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--ink);color:var(--ink);
    border-radius:9999px;padding:9px 18px;font-size:14px;font-weight:500;transition:transform .15s ease, background .15s ease;}
  .hist-btn:hover{background:var(--ink);color:#fff;transform:translateY(-1px);}

  .app-shell{width:100%;min-height:calc(100vh - 72px);display:flex;flex-direction:column;background:var(--paper);}
  .stepper{width:100%;display:flex;gap:8px;padding:20px 32px 0 32px;overflow-x:auto;background:var(--fog);border-bottom:1px solid var(--line);}
  .step-tab{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:9999px 9999px 0 0;background:transparent;
    border:none;color:var(--slate);font-size:14px;font-weight:500;white-space:nowrap;position:relative;transition:color .15s ease;}
  .step-tab.active{color:var(--ink);background:var(--paper);box-shadow:0 -1px 0 0 var(--line) inset;}
  .step-tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--ink);border-radius:3px 3px 0 0;}
  .step-tab .num{width:20px;height:20px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .step-tab.active .num{background:var(--ink);color:var(--peach);}

  .main-wrap{width:100%;flex:1;display:flex;min-width:0;background:var(--paper);}
  .step-body{flex:1;min-width:0;padding:40px 40px 64px 40px;animation:fadeSlideUp .35s ease;}
  .summary-side{width:320px;flex-shrink:0;border-left:1px solid var(--line);background:var(--fog);padding:32px 26px;}

  .hero-head{max-width:720px;margin-bottom:32px;}
  .hero-head h1{font-size:clamp(28px, 3.6vw, 48px);line-height:1.25;letter-spacing:-0.02em;font-weight:700;margin:0 0 12px 0;}
  .hero-head p{font-size:16px;color:var(--slate);line-height:1.6;margin:0;}

  .card{background:var(--mist);border-radius:24px;padding:28px;border:none;}
  .card-white{background:var(--paper);border-radius:20px;padding:20px 22px 16px 16px;
    box-shadow:0 0 0 1px rgba(4,23,43,.05), 0 20px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.06);}
  .card-peach{background:var(--peach);color:var(--sienna);border-radius:24px;padding:28px;}

  .input-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .txt-input{flex:1;min-width:220px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);
    font-size:16px;background:var(--paper);color:var(--ink);}
  .txt-input:focus{outline:2px solid var(--ink);outline-offset:1px;}

  .btn-pill{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;padding:13px 26px;font-size:15px;font-weight:500;border:none;transition:transform .15s ease, opacity .15s ease;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary.loading{animation:pulseSoft 1.4s infinite;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn-ghost:hover{background:var(--mist);}
  .btn-sm{padding:8px 16px;font-size:13px;}
  .btn-disabled{opacity:.4;pointer-events:none;}

  .invite-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;}
  @media (max-width:900px){.invite-grid{grid-template-columns:1fr;}}
  .invite-grid .card, .invite-grid .card-peach{animation:cardStagger .4s ease both;}
  .invite-grid .card-peach{animation-delay:.08s;}
  .tag-label{font-size:13px;font-weight:500;color:var(--ash);margin-bottom:10px;display:block;}
  .invite-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px 0;}
  .invite-body{font-size:16px;line-height:1.65;margin:0;}

  .mission-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:24px;}
  @media (max-width:900px){.mission-grid{grid-template-columns:1fr;}}
  .mission-card{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);
    animation:cardStagger .4s ease both;transition:box-shadow .18s ease, transform .18s ease;}
  .mission-card:hover{box-shadow:0 10px 24px rgba(23,25,28,.08);transform:translateY(-2px);}
  .mission-card.done{border-color:var(--ink);}
  .mission-thumb{width:100%;height:130px;object-fit:cover;display:block;filter:saturate(.9) sepia(.08);}
  .mission-info{padding:16px 18px 18px 18px;}
  .mission-place{font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .mission-desc{font-size:13.5px;color:var(--slate);margin:8px 0 14px 0;line-height:1.5;}
  .mission-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;background:var(--mist);
    border:none;border-radius:9999px;padding:8px 14px;color:var(--slate);}
  .mission-toggle.on{background:var(--ink);color:var(--peach);}

  .story-stage{margin-top:28px;}
  .story-card{display:flex;gap:24px;background:var(--paper);border-radius:24px;border:1px solid var(--line);
    padding:22px;animation:cardStagger .4s ease both;}
  @media (max-width:760px){.story-card{flex-direction:column;}}
  .story-img-wrap{width:260px;flex-shrink:0;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;}
  .story-img-wrap img{width:100%;height:220px;object-fit:cover;display:block;filter:saturate(.82) sepia(.14) contrast(1.03);
    transition:transform .3s ease;}
  .story-img-wrap:hover img{transform:scale(1.05);}
  .story-page-badge{position:absolute;top:10px;left:10px;background:rgba(23,25,28,.72);color:#fff;font-size:12px;
    padding:4px 10px;border-radius:9999px;}
  .story-text h3{font-size:19px;margin:0 0 10px 0;font-weight:600;}
  .story-text p{font-size:15px;line-height:1.7;color:var(--ink);margin:0 0 14px 0;}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:20px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mist);border:none;padding:0;}
  .dot.active{background:var(--ink);width:22px;border-radius:9999px;transition:width .2s ease;}
  .story-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;}

  .pdf-layout{display:grid;grid-template-columns:280px 1fr;gap:32px;margin-top:24px;}
  @media (max-width:820px){.pdf-layout{grid-template-columns:1fr;}}
  .book-mock{background:linear-gradient(160deg, var(--peach), #f6cfae);border-radius:16px;padding:26px;height:340px;
    display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 30px -12px rgba(93,42,26,.35);
    animation:floatBook 6s ease-in-out infinite;}
  .book-mock h4{color:var(--sienna);font-size:20px;line-height:1.35;margin:0;font-weight:700;}
  .book-mock .pages-count{font-size:13px;color:var(--sienna);opacity:.8;}
  .style-toggle{display:flex;gap:8px;margin:18px 0 22px 0;}
  .style-opt{padding:9px 18px;border-radius:9999px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--slate);}
  .style-opt.active{border-color:var(--ink);color:var(--ink);background:var(--mist);font-weight:600;}
  .progress-track{width:100%;height:10px;border-radius:9999px;background:var(--mist);overflow:hidden;margin:18px 0;}
  .progress-fill{height:100%;background:var(--ink);border-radius:9999px;animation:progressFill 1.6s ease forwards;}
  .export-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:background .15s ease;}
  .export-row:hover{background:var(--fog);}
  .export-row:last-child{border-bottom:none;}

  .guard-list{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .guard-row{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:14px 18px;cursor:pointer;transition:box-shadow .15s ease;animation:cardStagger .35s ease both;}
  .guard-row:hover{box-shadow:0 6px 16px rgba(23,25,28,.06);}
  .guard-left{display:flex;align-items:center;gap:12px;}
  .badge{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:9999px;display:flex;align-items:center;gap:6px;}
  .badge.pass{background:#e7f3ea;color:#1c6b3c;}
  .badge.review{background:var(--peach);color:var(--sienna);}
  .strength-toggle{display:flex;gap:6px;margin:20px 0;}
  .strength-opt{padding:8px 16px;border-radius:9999px;border:1px solid var(--line);font-size:13px;background:var(--paper);color:var(--slate);}
  .strength-opt.active{background:var(--ink);color:var(--peach);border-color:var(--ink);}

  .side-block{margin-bottom:26px;}
  .side-title{font-size:12.5px;font-weight:600;color:var(--ash);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px 0;}
  .side-step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--slate);padding:7px 0;}
  .side-step .dotmark{width:8px;height:8px;border-radius:50%;background:var(--mist);flex-shrink:0;}
  .side-step.done .dotmark{background:var(--ink);}
  .side-step.current{color:var(--ink);font-weight:600;}
  .side-step.current .dotmark{background:var(--sienna);}
  .guard-mini{display:flex;justify-content:space-between;background:var(--paper);border-radius:16px;padding:16px 18px;border:1px solid var(--line);}
  .guard-mini .num{font-size:22px;font-weight:700;}
  .tip-card{background:var(--peach);color:var(--sienna);border-radius:18px;padding:18px;font-size:13.5px;line-height:1.6;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(23,25,28,.35);z-index:60;display:flex;justify-content:flex-end;}
  .drawer{width:400px;max-width:90vw;height:100%;background:var(--paper);padding:28px;overflow-y:auto;animation:fadeSlideUp .25s ease;box-shadow:-12px 0 30px rgba(0,0,0,.12);}
  .run-row{padding:14px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:background .15s ease;}
  .run-row:hover{background:var(--fog);}
  .run-row .status{font-size:12px;color:var(--slate);}

  .modal-overlay{position:fixed;inset:0;background:rgba(23,25,28,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal-box{background:var(--paper);border-radius:24px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;
    padding:30px;animation:modalFadeScale .2s ease;}
  .modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;float:right;}

  .toast{position:fixed;bottom:28px;right:28px;background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;
    font-size:14px;display:flex;align-items:center;gap:10px;z-index:100;animation:toastSlide .25s ease;box-shadow:0 12px 26px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STEPS = [
  { key:'main', label:'AI 초대장 및 프롤로그 생성', icon:'mail' },
  { key:'storybook', label:'AI 역사동화 및 삽화 생성', icon:'book-open' },
  { key:'pdf-export', label:'PDF 전자책 자동 제작', icon:'file-down' },
  { key:'safety-guard', label:'유해 콘텐츠 필터링 가드레일', icon:'shield-check' },
];

const MISSIONS = [
  { id:1, place:'영릉(세종대왕릉)', mission:'세종대왕의 발명품 3가지를 찾아 사진으로 남겨보세요', seed:'yeoju-yeongneung' },
  { id:2, place:'신륵사', mission:'남한강변 전탑 앞에서 소원을 담은 문장을 완성해보세요', seed:'yeoju-silleuksa' },
  { id:3, place:'여주 도자기 마을', mission:'전통 도자기 문양 하나를 따라 그려보세요', seed:'yeoju-pottery' },
  { id:4, place:'파사성', mission:'성벽 위에서 남한강을 내려다본 소감을 기록해보세요', seed:'yeoju-pasaseong' },
];

const INVITE_VARIANTS = (name) => ([
  { title:`${name}님을 위한 시간 여행 초대장`, body:`${name}님, 지금부터 여주의 옛 이야기 속으로 떠나는 특별한 여정이 시작됩니다. 곳곳에 숨겨진 미션을 완료하면 당신만을 위한 역사동화가 만들어져요.`, prologue:`오랜 세월 강물이 흘러온 여주 땅에, ${name}(이)라는 이름을 가진 여행자가 도착했습니다. 이 여행자의 발걸음을 따라, 잊혀졌던 이야기들이 다시 눈을 뜨기 시작합니다.` },
  { title:`${name}님, 여주의 시간지기가 되어주세요`, body:`${name}님을 위한 여정 지도가 준비되었습니다. 미션을 하나씩 완료할 때마다 이야기의 다음 장이 열립니다.`, prologue:`강가의 오래된 나루터에 ${name}(이)라는 낯선 발자국이 찍혔습니다. 그 발자국을 따라 사백 년 전의 여주가 서서히 눈을 뜹니다.` },
  { title:`${name}님을 기다린 이야기가 있습니다`, body:`${name}님이 남긴 여정의 흔적들이 모여, 이 세상에 단 하나뿐인 동화책이 완성될 예정입니다.`, prologue:`${name}(이)라는 이름이 불리자, 잠들어 있던 여주의 옛 시간이 천천히 다시 흐르기 시작했습니다.` },
]);

function buildStoryPages(missions, variant){
  const done = missions.filter(m=>m.done);
  const base = done.length ? done : missions;
  return base.map((m, i)=>({
    page:i+1,
    place:m.place,
    text:`${i+1}번째 이야기 — ${m.place}에서, 옛 사람들은 강물의 흐름을 읽으며 계절을 점쳤습니다. 그 지혜를 이어받은 우리의 여행자는 오늘도 한 걸음씩 역사 속으로 걸어 들어갑니다. (버전 ${variant+1})`,
    seed:`${m.seed}-illust-${variant}`,
  }));
}

function Toast({ message, onDone }){
  useEffect(()=>{
    if(!message) return;
    const t = setTimeout(onDone, 2600);
    return ()=>clearTimeout(t);
  }, [message]);
  if(!message) return null;
  return (
    <div className="toast">
      <i data-lucide="check-circle-2" className="w-4 h-4"></i>
      <span>{message}</span>
    </div>
  );
}

function Modal({ title, onClose, children }){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="닫기"><i data-lucide="x" className="w-4 h-4"></i></button>
        <h3 style={{fontSize:'20px', fontWeight:700, margin:'2px 0 18px 0', clear:'both'}}>{title}</h3>
        {children}
      </div>
    </div>
  );
}

function App(){
  const [step, setStep] = useState(0);
  const [name, setName] = useState('민서');
  const [inviteLoading, setInviteLoading] = useState(false);
  const [invite, setInvite] = useState(null);
  const [variant, setVariant] = useState(0);

  const [missions, setMissions] = useState(MISSIONS.map(m=>({...m, done:false})));
  const [storyLoading, setStoryLoading] = useState(false);
  const [storyPages, setStoryPages] = useState(null);
  const [storyVariant, setStoryVariant] = useState(0);
  const [pageIdx, setPageIdx] = useState(0);
  const [pageModal, setPageModal] = useState(null);

  const [pdfStyle, setPdfStyle] = useState('classic');
  const [pdfState, setPdfState] = useState('idle');
  const [exportModal, setExportModal] = useState(null);

  const [strength, setStrength] = useState('표준');
  const [guardItems, setGuardItems] = useState(null);
  const [guardLoading, setGuardLoading] = useState(false);
  const [guardModal, setGuardModal] = useState(null);

  const [historyOpen, setHistoryOpen] = useState(false);
  const [runModal, setRunModal] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(()=>{ window.lucide && window.lucide.createIcons(); });

  useEffect(()=>{
    if(!guardItems && step===3){
      setGuardItems(buildGuardItems('표준'));
    }
  }, [step]);

  function buildGuardItems(str){
    const base = [
      { id:1, name:'맞춤 초대장 텍스트', type:'텍스트', status:'통과', score:'세이프티 점수 98/100' },
      { id:2, name:'동화 프롤로그', type:'텍스트', status:'통과', score:'세이프티 점수 96/100' },
      { id:3, name:'역사동화 1페이지', type:'텍스트', status:'통과', score:'세이프티 점수 95/100' },
      { id:4, name:'역사동화 2페이지', type:'텍스트', status:'통과', score:'세이프티 점수 94/100' },
      { id:5, name:'삽화 1페이지', type:'이미지', status: str==='엄격' ? '재검토' : '통과', score:'시각 콘텐츠 스코어 92/100' },
      { id:6, name:'삽화 2페이지', type:'이미지', status:'통과', score:'시각 콘텐츠 스코어 97/100' },
      { id:7, name:'삽화 3페이지', type:'이미지', status: str==='관대' ? '통과' : '재검토', score:'시각 콘텐츠 스코어 88/100' },
    ];
    return base;
  }

  function go(i){ setStep(i); }

  function generateInvite(){
    setInviteLoading(true);
    setTimeout(()=>{
      const v = INVITE_VARIANTS(name.trim() || '여행자')[variant % 3];
      setInvite(v);
      setInviteLoading(false);
      setToast('초대장과 프롤로그가 도착했습니다');
    }, 1100);
  }
  function regenerateInvite(){
    setVariant(v=>v+1);
    setInviteLoading(true);
    setTimeout(()=>{
      const v2 = INVITE_VARIANTS(name.trim() || '여행자')[(variant+1) % 3];
      setInvite(v2);
      setInviteLoading(false);
      setToast('다른 버전으로 다시 생성되었습니다');
    }, 900);
  }

  function toggleMission(id){
    setMissions(ms=>ms.map(m=>m.id===id ? {...m, done:!m.done} : m));
  }

  function generateStory(){
    setStoryLoading(true);
    setPageIdx(0);
    setTimeout(()=>{
      setStoryPages(buildStoryPages(missions, storyVariant));
      setStoryLoading(false);
      setToast('미션 데이터를 반영한 동화가 완성되었습니다');
    }, 1400);
  }
  function regenPage(){
    setStoryVariant(v=>v+1);
    setToast('선택한 페이지의 삽화가 재생성되었습니다');
    if(pageModal){
      const p = storyPages[pageModal.page-1];
      setPageModal({...p, seed:p.seed+'-r'});
    }
  }

  function generatePdf(){
    setPdfState('generating');
    setTimeout(()=>{
      setPdfState('done');
      setToast('PDF 전자책 제작이 완료되었습니다');
    }, 1650);
  }
  function downloadPdf(){
    setToast('PDF 다운로드가 시작되었습니다');
  }

  function reverifyAll(){
    setGuardLoading(true);
    setTimeout(()=>{
      setGuardItems(buildGuardItems(strength));
      setGuardLoading(false);
      setToast('전체 재검증이 완료되었습니다');
    }, 1000);
  }
  function changeStrength(s){
    setStrength(s);
    setGuardItems(buildGuardItems(s));
    setToast(`안전 필터링 강도가 '${s}'(으)로 재계산되었습니다`);
  }

  const RUNS = [
    { id:1, who:'서연', date:'2026.07.21 14:20', status:'완료 · 4페이지' },
    { id:2, who:'도윤', date:'2026.07.19 11:05', status:'완료 · 4페이지' },
    { id:3, who:'하은', date:'2026.07.15 09:42', status:'완료 · 3페이지' },
  ];
  const EXPORTS = [
    { id:1, title:'민서의 여주 이야기', date:'2026.07.24', pages:4 },
    { id:2, title:'하은의 여주 이야기', date:'2026.07.15', pages:3 },
  ];

  const doneCount = missions.filter(m=>m.done).length;
  const passCount = guardItems ? guardItems.filter(g=>g.status==='통과').length : 0;
  const reviewCount = guardItems ? guardItems.filter(g=>g.status==='재검토').length : 0;

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <header className="topnav">
        <div className="brand">
          <span className="brand-mark"><i data-lucide="book-open" className="w-4 h-4"></i></span>
          여주 이야기 공방
        </div>
        <div style={{display:'flex', alignItems:'center', gap:14}}>
          <span className="step-pill">STEP {step+1} / 4</span>
          <button className="hist-btn" onClick={()=>setHistoryOpen(true)}>
            <i data-lucide="history" className="w-4 h-4"></i>
            <span>실행 이력</span>
          </button>
        </div>
      </header>

      <div className="app-shell">
        <nav className="stepper">
          {STEPS.map((s, i)=>(
            <button key={s.key} className={"step-tab" + (i===step ? ' active' : '')} onClick={()=>go(i)}>
              <span className="num">{i+1}</span>
              <i data-lucide={s.icon} className="w-4 h-4"></i>
              <span>{s.label}</span>
            </button>
          ))}
        </nav>

        <div className="main-wrap">
          <main className="step-body">
            {step===0 && (
              <div>
                <div className="hero-head">
                  <h1>이름 하나로 시작되는<br/>맞춤형 여행 초대장</h1>
                  <p>여행자의 이름을 입력하면 AI가 즉시 개인화된 초대장 문구와 동화 프롤로그를 생성합니다. 이 결과는 다음 단계인 역사동화 생성의 도입부로 이어집니다.</p>
                </div>
                <div className="card">
                  <span className="tag-label">여행자 정보</span>
                  <div className="input-row">
                    <input className="txt-input" value={name} onChange={e=>setName(e.target.value)} placeholder="이름을 입력해주세요" />
                    <button className={"btn-pill btn-primary" + (inviteLoading ? ' loading' : '')} onClick={generateInvite} disabled={inviteLoading}>
                      <i data-lucide="wand-2" className="w-4 h-4"></i>
                      <span>{inviteLoading ? '생성 중...' : '초대장 생성하기'}</span>
                    </button>
                  </div>
                </div>

                {inviteLoading && (
                  <div className="invite-grid">
                    <div className="skeleton" style={{height:170}}></div>
                    <div className="skeleton" style={{height:170}}></div>
                  </div>
                )}

                {!inviteLoading && invite && (
                  <div className="invite-grid">
                    <div className="card-peach">
                      <span className="tag-label" style={{color:'var(--sienna)', opacity:.75}}>맞춤 초대장</span>
                      <h3 className="invite-title">{invite.title}</h3>
                      <p className="invite-body">{invite.body}</p>
                    </div>
                    <div className="card">
                      <span className="tag-label">동화 프롤로그</span>
                      <h3 className="invite-title">프롤로그</h3>
                      <p className="invite-body">{invite.prologue}</p>
                      <button className="btn-pill btn-ghost btn-sm" style={{marginTop:16}} onClick={regenerateInvite}>
                        <i data-lucide="refresh-ccw" className="w-4 h-4"></i>
                        <span>다른 버전으로 다시 생성</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {step===1 && (
              <div>
                <div className="hero-head">
                  <h1>관광지 미션 수행 데이터로<br/>완성되는 역사동화</h1>
                  <p>여행자가 방문한 관광지와 완료한 미션 데이터를 바탕으로, 페이지별 이야기와 삽화를 함께 생성합니다.</p>
                </div>
                <div className="mission-grid">
                  {missions.map((m,i)=>(
                    <div key={m.id} className={"mission-card" + (m.done?' done':'')} style={{animationDelay:(i*0.05)+'s'}}>
                      <img className="mission-thumb" src={`https://picsum.photos/seed/${m.seed}/400/260`} alt={m.place} />
                      <div className="mission-info">
                        <div className="mission-place">
                          <span>{m.place}</span>
                          <i data-lucide="map-pin" className="w-4 h-4" style={{color:'var(--slate)'}}></i>
                        </div>
                        <p className="mission-desc">{m.mission}</p>
                        <button className={"mission-toggle" + (m.done?' on':'')} onClick={()=>toggleMission(m.id)}>
                          <i data-lucide={m.done ? 'check' : 'circle'} className="w-3 h-3"></i>
                          <span>{m.done ? '완료됨' : '미완료'}</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{marginTop:24}}>
                  <button className={"btn-pill btn-primary" + (storyLoading ? ' loading' : '')} onClick={generateStory} disabled={storyLoading}>
                    <i data-lucide="sparkles" className="w-4 h-4"></i>
                    <span>{storyLoading ? '동화와 삽화 생성 중...' : '미션 데이터로 동화 생성하기'}</span>
                  </button>
                </div>

                {storyLoading && (
                  <div className="story-stage">
                    <div className="skeleton" style={{height:250}}></div>
                  </div>
                )}

                {!storyLoading && storyPages && (
                  <div className="story-stage">
                    <div className="story-card">
                      <div className="story-img-wrap" onClick={()=>setPageModal(storyPages[pageIdx])}>
                        <img src={`https://picsum.photos/seed/${storyPages[pageIdx].seed}/500/440`} alt={storyPages[pageIdx].place} />
                        <span className="story-page-badge">{storyPages[pageIdx].page} / {storyPages.length} 페이지</span>
                      </div>
                      <div className="story-text">
                        <h3>{storyPages[pageIdx].place}</h3>
                        <p>{storyPages[pageIdx].text}</p>
                        <button className="btn-pill btn-ghost btn-sm" onClick={()=>setPageModal(storyPages[pageIdx])}>
                          <i data-lucide="expand" className="w-4 h-4"></i>
                          <span>자세히 보기</span>
                        </button>
                      </div>
                    </div>
                    <div className="story-nav">
                      <button className="btn-pill btn-ghost btn-sm" onClick={()=>setPageIdx(i=>Math.max(0,i-1))}>
                        <i data-lucide="chevron-left" className="w-4 h-4"></i>
                      </button>
                      <div className="dots">
                        {storyPages.map((p,i)=>(
                          <button key={i} className={"dot"+(i===pageIdx?' active':'')} onClick={()=>setPageIdx(i)}></button>
                        ))}
                      </div>
                      <button className="btn-pill btn-ghost btn-sm" onClick={()=>setPageIdx(i=>Math.min(storyPages.length-1,i+1))}>
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {step===2 && (
              <div>
                <div className="hero-head">
                  <h1>텍스트와 삽화를 결합한<br/>PDF 전자책 자동 제작</h1>
                  <p>완성된 동화 텍스트와 삽화를 표지 스타일에 맞춰 페이지 단위로 조합하고, 즉시 다운로드 가능한 PDF로 만듭니다.</p>
                </div>
                <div className="pdf-layout">
                  <div className="book-mock">
                    <div>
                      <span style={{fontSize:12, color:'var(--sienna)', opacity:.75}}>표지 미리보기</span>
                      <h4>{name || '여행자'}의 여주 이야기</h4>
                    </div>
                    <span className="pages-count">{storyPages ? storyPages.length : 4}페이지 · {pdfStyle==='classic' ? '클래식' : '모던'} 표지</span>
                  </div>
                  <div>
                    <span className="tag-label">표지 스타일</span>
                    <div className="style-toggle">
                      <button className={"style-opt"+(pdfStyle==='classic'?' active':'')} onClick={()=>setPdfStyle('classic')}>클래식</button>
                      <button className={"style-opt"+(pdfStyle==='modern'?' active':'')} onClick={()=>setPdfStyle('modern')}>모던</button>
                    </div>

                    {pdfState==='idle' && (
                      <button className="btn-pill btn-primary" onClick={generatePdf}>
                        <i data-lucide="file-cog" className="w-4 h-4"></i>
                        <span>PDF로 만들기</span>
                      </button>
                    )}
                    {pdfState==='generating' && (
                      <div>
                        <div className="progress-track"><div className="progress-fill"></div></div>
                        <span style={{fontSize:13, color:'var(--slate)'}}>페이지를 조합하는 중입니다...</span>
                      </div>
                    )}
                    {pdfState==='done' && (
                      <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
                        <button className="btn-pill btn-primary" onClick={downloadPdf}>
                          <i data-lucide="download" className="w-4 h-4"></i>
                          <span>PDF 다운로드</span>
                        </button>
                        <button className="btn-pill btn-ghost" onClick={()=>setPdfState('idle')}>
                          <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                          <span>다시 만들기</span>
                        </button>
                      </div>
                    )}

                    <div style={{marginTop:32}}>
                      <span className="tag-label">최근 생성 이력</span>
                      {EXPORTS.map(ex=>(
                        <div className="export-row" key={ex.id} onClick={()=>setExportModal(ex)}>
                          <span style={{fontSize:14.5, fontWeight:500}}>{ex.title}</span>
                          <span style={{fontSize:13, color:'var(--slate)'}}>{ex.date} · {ex.pages}p</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {step===3 && (
              <div>
                <div className="hero-head">
                  <h1>아동 대상 콘텐츠를 위한<br/>유해 콘텐츠 필터링 가드레일</h1>
                  <p>생성된 텍스트와 삽화는 필터링 단계를 거쳐 통과/재검토로 분류되며, 강도 조절과 재검증이 가능합니다.</p>
                </div>
                <span className="tag-label">안전 필터링 강도</span>
                <div className="strength-toggle">
                  {['관대','표준','엄격'].map(s=>(
                    <button key={s} className={"strength-opt"+(strength===s?' active':'')} onClick={()=>changeStrength(s)}>{s}</button>
                  ))}
                </div>
                <button className={"btn-pill btn-primary"+(guardLoading?' loading':'')} onClick={reverifyAll} disabled={guardLoading}>
                  <i data-lucide="refresh-ccw" className="w-4 h-4"></i>
                  <span>{guardLoading ? '재검증 중...' : '전체 재검증'}</span>
                </button>

                {guardLoading && <div className="skeleton" style={{height:220, marginTop:20}}></div>}

                {!guardLoading && guardItems && (
                  <div className="guard-list">
                    {guardItems.map((g,i)=>(
                      <div className="guard-row" key={g.id} style={{animationDelay:(i*0.04)+'s'}} onClick={()=>setGuardModal(g)}>
                        <div className="guard-left">
                          <i data-lucide={g.type==='이미지' ? 'image' : 'file-text'} className="w-4 h-4" style={{color:'var(--slate)'}}></i>
                          <span style={{fontSize:14.5}}>{g.name}</span>
                        </div>
                        <span className={"badge " + (g.status==='통과' ? 'pass' : 'review')}>
                          <i data-lucide={g.status==='통과' ? 'badge-check' : 'alert-triangle'} className="w-3 h-3"></i>
                          {g.status}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          <aside className="summary-side">
            <div className="side-block">
              <p className="side-title">진행 현황</p>
              {STEPS.map((s,i)=>(
                <div key={s.key} className={"side-step" + (i<step?' done':'') + (i===step?' current':'')}>
                  <span className="dotmark"></span>
                  <span>{s.label}</span>
                </div>
              ))}
            </div>
            <div className="side-block">
              <p className="side-title">가드레일 상태</p>
              <div className="guard-mini">
                <div>
                  <div className="num">{passCount}</div>
                  <span style={{fontSize:12, color:'var(--slate)'}}>통과</span>
                </div>
                <div>
                  <div className="num" style={{color:'var(--sienna)'}}>{reviewCount}</div>
                  <span style={{fontSize:12, color:'var(--slate)'}}>재검토</span>
                </div>
                <div>
                  <div className="num">{doneCount}/4</div>
                  <span style={{fontSize:12, color:'var(--slate)'}}>미션 완료</span>
                </div>
              </div>
            </div>
            <div className="side-block">
              <p className="side-title">도움말</p>
              <div className="tip-card">
                {step===0 && '이름을 입력하고 초대장을 생성하면, 프롤로그가 다음 단계의 동화 도입부로 자동 연결됩니다.'}
                {step===1 && '완료한 미션이 많을수록 더 풍부한 페이지 구성의 동화가 만들어집니다.'}
                {step===2 && '표지 스타일을 변경한 뒤에도 언제든 다시 PDF를 생성할 수 있습니다.'}
                {step===3 && '강도를 엄격으로 조정하면 삽화 콘텐츠가 더 보수적으로 재검토됩니다.'}
              </div>
            </div>
          </aside>
        </div>
      </div>

      {historyOpen && (
        <div className="drawer-overlay" onClick={()=>setHistoryOpen(false)}>
          <div className="drawer" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
              <h3 style={{fontSize:19, fontWeight:700, margin:0}}>실행 이력</h3>
              <button className="modal-close" style={{float:'none'}} onClick={()=>setHistoryOpen(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
            </div>
            {RUNS.map(r=>(
              <div className="run-row" key={r.id} onClick={()=>setRunModal(r)}>
                <div style={{fontWeight:600, fontSize:14.5}}>{r.who}님의 여정</div>
                <div className="status">{r.date} · {r.status}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {pageModal && (
        <Modal title={pageModal.place + ' — ' + pageModal.page + '페이지'} onClose={()=>setPageModal(null)}>
          <img src={`https://picsum.photos/seed/${pageModal.seed}/480/320`} style={{width:'100%', borderRadius:16, marginBottom:16, filter:'saturate(.82) sepia(.14)'}} />
          <p style={{fontSize:15, lineHeight:1.7}}>{pageModal.text}</p>
          <button className="btn-pill btn-ghost btn-sm" onClick={regenPage}>
            <i data-lucide="refresh-ccw" className="w-4 h-4"></i>
            <span>이 페이지 삽화 재생성</span>
          </button>
        </Modal>
      )}

      {exportModal && (
        <Modal title={exportModal.title} onClose={()=>setExportModal(null)}>
          <p style={{fontSize:14.5, color:'var(--slate)', lineHeight:1.7}}>생성일: {exportModal.date}<br/>총 페이지: {exportModal.pages}페이지<br/>표지 스타일: 클래식</p>
          <button className="btn-pill btn-primary btn-sm" onClick={()=>{ setToast('선택한 PDF를 다시 다운로드했습니다'); setExportModal(null); }}>
            <i data-lucide="download" className="w-4 h-4"></i>
            <span>다시 다운로드</span>
          </button>
        </Modal>
      )}

      {guardModal && (
        <Modal title={guardModal.name} onClose={()=>setGuardModal(null)}>
          <p style={{fontSize:14.5, color:'var(--slate)', lineHeight:1.7}}>유형: {guardModal.type}<br/>{guardModal.score}<br/>강도 기준: {strength}</p>
          <span className={"badge " + (guardModal.status==='통과' ? 'pass' : 'review')}>
            <i data-lucide={guardModal.status==='통과' ? 'badge-check' : 'alert-triangle'} className="w-3 h-3"></i>
            {guardModal.status}
          </span>
        </Modal>
      )}

      {runModal && (
        <Modal title={runModal.who + '님의 여정 상세'} onClose={()=>setRunModal(null)}>
          <p style={{fontSize:14.5, color:'var(--slate)', lineHeight:1.7}}>실행 일시: {runModal.date}<br/>결과: {runModal.status}<br/>안전 필터링: 전체 통과</p>
        </Modal>
      )}

      <Toast message={toast} onDone={()=>setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
