<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 콘텐츠 생성 파이프라인 운영 콘솔 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root{
    --bg:#000000;
    --haze:#f5f5f5;
    --ink-on-light:#1b1b1b;
    --white:#ffffff;
    --primary:#2b7fff;
    --accent:#f75745;
    --twilight:#426188;
    --muted:#9aa3ad;
    --panel:#111316;
    --panel-2:#15181c;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--white);
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent);color:#fff;}

  @keyframes glowPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(247,87,69,.35);} 50%{box-shadow:0 0 0 9px rgba(247,87,69,0);} }
  @keyframes slideFade{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
  @keyframes cardPop{ from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes gradientShift{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  @keyframes toastPop{ from{opacity:0; transform:translateY(8px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes modalPop{ from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);} }
  @keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }

  .app-bg{
    width:100%;min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(43,127,255,.16), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(247,87,69,.12), transparent 40%),
      linear-gradient(180deg, #030405, #000000 60%);
    background-size:200% 200%;
    animation:gradientShift 18s ease infinite;
  }
  header.topbar{width:100%;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .brand2{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16.5px;letter-spacing:-.01em;}
  .brand2 .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;align-items:center;justify-content:center;}
  .concurrency{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);}
  .conc-track{width:80px;height:6px;border-radius:9999px;background:rgba(255,255,255,.1);overflow:hidden;}
  .conc-fill{height:100%;background:var(--primary);border-radius:9999px;}

  .tabrow{display:flex;gap:6px;padding:16px 32px;overflow-x:auto;border-bottom:1px solid var(--line);}
  .tab-btn{background:transparent;border:1px solid transparent;color:var(--muted);font-size:13.5px;font-weight:500;
    padding:9px 16px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .15s ease;}
  .tab-btn.active{background:var(--haze);color:var(--ink-on-light);}
  .tab-btn:not(.active):hover{border-color:var(--line);color:var(--white);}

  .content-wrap{width:100%;padding:28px 32px 60px 32px;animation:slideFade .3s ease;}
  .page-head{max-width:760px;margin-bottom:24px;}
  .page-head h1{font-size:clamp(26px, 3.4vw, 48px);font-weight:700;letter-spacing:-.01em;margin:0 0 10px 0;}
  .page-head p{font-size:14.5px;color:var(--muted);line-height:1.6;margin:0;}

  .btn2{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:11px 20px;font-size:13.5px;font-weight:500;
    border:1px solid var(--line);transition:transform .12s ease, background .15s ease;}
  .btn2:hover{transform:translateY(-1px);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-accent.loading{animation:glowPulse 1.3s infinite;}
  .btn-ghost2{background:transparent;color:var(--white);}
  .btn-ghost2:hover{background:rgba(255,255,255,.06);}
  .btn-sm2{padding:7px 14px;font-size:12.5px;}

  .board-region{display:grid;grid-template-columns:1fr 280px;gap:22px;}
  @media (max-width:960px){.board-region{grid-template-columns:1fr;}}
  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
  .column{width:270px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .col-header{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:12px;color:var(--white);}
  .count{background:rgba(255,255,255,.08);color:var(--muted);font-size:11.5px;padding:3px 9px;border-radius:9999px;}
  .card{background:var(--haze);color:var(--ink-on-light);border-radius:12px;padding:14px;margin-bottom:10px;
    cursor:pointer;animation:cardPop .3s ease both;transition:transform .15s ease, outline .15s ease;outline:2px solid transparent;}
  .card:hover{transform:translateY(-2px);outline-color:var(--primary);}
  .card.failed-card{background:#2a1614;color:#ffd9d3;border:1px solid rgba(247,87,69,.4);}
  .card-title{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .tag{font-size:11px;background:rgba(43,127,255,.14);color:#1a5fd6;padding:3px 9px;border-radius:9999px;font-weight:500;}
  .failed-card .tag{background:rgba(247,87,69,.16);color:var(--accent);}
  .avatar{width:24px;height:24px;border-radius:9999px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .priority{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:5px;}
  .select-chk{margin-right:6px;}

  .matrix-side{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:20px;height:fit-content;}
  .matrix-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px 0;font-weight:600;}
  .filter-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;color:var(--white);}
  .filter-chip{padding:7px 14px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);background:transparent;}
  .filter-chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .retry-bar{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:1fr;}}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;
    animation:cardPop .3s ease both;transition:border-color .15s ease;}
  .stat-card:hover{border-color:var(--primary);}
  .stat-card.warn{border-color:var(--accent);}
  .stat-label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .stat-num{font-size:30px;font-weight:700;letter-spacing:-.01em;}
  .stat-trend{font-size:12px;color:var(--muted);margin-top:4px;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:36px;margin-top:14px;}
  .spark i{display:block;width:6px;background:var(--primary);border-radius:2px 2px 0 0;transform-origin:bottom;animation:barGrow .5s ease both;}
  .stat-card.warn .spark i{background:var(--accent);}
  .range-toggle{display:flex;gap:6px;margin-bottom:6px;}

  .prompt-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:22px;}
  @media (max-width:900px){.prompt-layout{grid-template-columns:1fr;}}
  .version-row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;
    cursor:pointer;font-size:13px;transition:border-color .15s ease;}
  .version-row.selA{border-color:var(--primary);}
  .version-row.selB{border-color:var(--accent);}
  .version-row .vtitle{font-weight:600;display:flex;justify-content:space-between;}
  .version-row .vdate{color:var(--muted);font-size:11.5px;margin-top:4px;}
  .active-badge{font-size:10.5px;background:rgba(43,127,255,.18);color:var(--primary);padding:2px 8px;border-radius:9999px;}
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:760px){.compare-grid{grid-template-columns:1fr;}}
  .compare-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:13.5px;line-height:1.7;}
  .compare-card h4{margin:0 0 10px 0;font-size:13px;color:var(--muted);}
  .diff-hl{background:rgba(247,87,69,.24);color:#ffcfc9;padding:0 3px;border-radius:3px;}

  .filter-tabs{display:flex;gap:8px;margin:20px 0 16px 0;}
  .log-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;animation:cardPop .3s ease both;transition:border-color .15s ease;}
  .log-row:hover{border-color:var(--primary);}
  .log-left{display:flex;align-items:center;gap:12px;font-size:13.5px;}
  .verdict{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:9999px;}
  .verdict.pass{background:rgba(43,127,255,.16);color:var(--primary);}
  .verdict.block{background:rgba(247,87,69,.18);color:var(--accent);}
  .verdict.retry{background:rgba(255,255,255,.1);color:var(--muted);}

  .modal-overlay2{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:80;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal-box2{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:500px;width:100%;
    max-height:86vh;overflow-y:auto;padding:26px;animation:modalPop .18s ease;color:var(--white);}
  .modal-close2{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--white);
    display:flex;align-items:center;justify-content:center;float:right;}

  .drawer2-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;justify-content:flex-end;}
  .drawer2{width:380px;max-width:90vw;height:100%;background:var(--panel);border-left:1px solid var(--line);padding:24px;
    overflow-y:auto;animation:slideFade .22s ease;color:var(--white);}

  .toast2{position:fixed;bottom:26px;right:26px;background:var(--haze);color:var(--ink-on-light);padding:13px 20px;
    border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:9px;z-index:100;animation:toastPop .22s ease;}

  .txt-input2{width:100%;padding:11px 14px;border-radius:4px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);
    color:#fff;font-size:13.5px;margin-bottom:12px;}
  .select2{padding:9px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:13px;}

  .ops-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;margin:4px 0 26px 0;padding:30px 32px;
    border-radius:20px;position:relative;overflow:hidden;border:1px solid var(--line);
    background:
      radial-gradient(circle at 12% 15%, rgba(43,127,255,.24), transparent 55%),
      radial-gradient(circle at 90% 85%, rgba(247,87,69,.20), transparent 50%),
      var(--panel);}
  @media (max-width:900px){.ops-hero{grid-template-columns:1fr;}}
  .ops-hero-eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px 0;font-weight:600;}
  .ops-hero-title{font-size:clamp(30px,4vw,54px);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0 0 14px 0;}
  .grad-word{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ops-hero-sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:440px;margin:0;}
  .wave-track{display:flex;align-items:flex-end;gap:14px;height:150px;}
  .wave-stage{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
  .wave-bars{display:flex;align-items:flex-end;gap:3px;height:92px;}
  .wave-bars i{width:6px;border-radius:2px 2px 0 0;background:var(--primary);animation:barGrow .6s ease both;transform-origin:bottom;}
  .wave-stage.warn .wave-bars i{background:var(--accent);}
  .wave-label{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.4;}
  .wave-connector{width:100%;height:1px;background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);margin-top:-1px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const TABS = [
  { key:'main', label:'배치 생성 큐 및 재시도 관리', icon:'ph-queue' },
  { key:'pipeline-monitor', label:'파이프라인 단계별 소요시간 모니터링', icon:'ph-chart-line' },
  { key:'prompt-console', label:'AI 프롬프트 버전 관리 및 A/B 재생성 비교', icon:'ph-flask' },
  { key:'moderation-log', label:'유해 콘텐츠 감사 로그 및 재검증', icon:'ph-shield-warning' },
];

const INIT_JOBS = [
  { id:221, who:'정우', status:'대기', meta:'동화 4p', avatar:'JW', priority:true },
  { id:222, who:'하람', status:'대기', meta:'동화 3p', avatar:'HR', priority:false },
  { id:219, who:'서아', status:'처리중', meta:'삽화 생성중', avatar:'SA', priority:false },
  { id:220, who:'도현', status:'처리중', meta:'텍스트 생성중', avatar:'DH', priority:true },
  { id:214, who:'예린', status:'완료', meta:'완료 · 4p', avatar:'YR', priority:false },
  { id:210, who:'찬희', status:'실패', meta:'삽화 API 오류', avatar:'CH', priority:true },
  { id:205, who:'지안', status:'실패', meta:'응답 타임아웃', avatar:'JA', priority:false },
];

const STATS = [
  { key:'text', label:'동화 텍스트 생성 평균 (여정 프롤로그)', value:'3.2초', warn:false, spark:[8,14,10,16,12,18,15,20] },
  { key:'image', label:'관광 미션 삽화 생성 평균', value:'11.8초', warn:true, spark:[16,20,18,26,22,30,28,34] },
  { key:'filter', label:'아동 유해 콘텐츠 필터링 평균', value:'0.6초', warn:false, spark:[4,5,4,6,5,7,6,8] },
];

const FLOW_STAGES = [
  { label:'초대장·프롤로그 생성 (여행자 이름 개인화)', spark:[10,14,11,16,13,18], warn:false },
  { label:'역사동화·삽화 생성 (관광 미션 데이터 반영)', spark:[18,24,20,30,26,34], warn:true },
  { label:'유해 콘텐츠 필터링 (아동 안전 검증)', spark:[4,6,5,7,6,8], warn:false },
  { label:'PDF 전자책 조합·다운로드', spark:[8,10,9,12,10,13], warn:false },
];

const VERSIONS = [
  { id:'v4', label:'프롬프트 v4', date:'2026.07.26', active:true, body:'아동 친화적 어휘로 문장을 짧게 유지하고, 지역 역사 사실을 각주처럼 덧붙입니다.' },
  { id:'v3', label:'프롬프트 v3', date:'2026.07.18', active:false, body:'문장을 길게 서술하며 감정 묘사를 강조합니다.' },
  { id:'v2', label:'프롬프트 v2', date:'2026.07.10', active:false, body:'역사적 사실 나열 위주로 구성합니다.' },
  { id:'v1', label:'프롬프트 v1', date:'2026.07.02', active:false, body:'기본 템플릿, 개인화 변수 없이 고정 문장을 사용합니다.' },
];

const LOGS = [
  { id:1, name:'삽화 3페이지 (찬희 배치)', type:'이미지', verdict:'재생성', time:'10:24', reason:'인물 표정 과장 표현 감지 — 안전 기준 초과 가능성' },
  { id:2, name:'동화 텍스트 2페이지 (하람 배치)', type:'텍스트', verdict:'통과', time:'10:12', reason:'검증 항목 전체 통과' },
  { id:3, name:'삽화 1페이지 (지안 배치)', type:'이미지', verdict:'차단', time:'09:58', reason:'배경 요소 중 위험 소품으로 오인될 형상 감지' },
  { id:4, name:'초대장 텍스트 (도현 배치)', type:'텍스트', verdict:'통과', time:'09:40', reason:'검증 항목 전체 통과' },
];

function Toast2({ message, onDone }){
  useEffect(()=>{ if(!message) return; const t = setTimeout(onDone, 2600); return ()=>clearTimeout(t); }, [message]);
  if(!message) return null;
  return <div className="toast2"><i className="ph ph-check-circle"></i><span>{message}</span></div>;
}

function Modal2({ title, onClose, children }){
  return (
    <div className="modal-overlay2" onClick={onClose}>
      <div className="modal-box2" onClick={e=>e.stopPropagation()}>
        <button className="modal-close2" onClick={onClose}><i className="ph ph-x"></i></button>
        <h3 style={{fontSize:17.5, fontWeight:700, margin:'2px 0 16px 0', clear:'both'}}>{title}</h3>
        {children}
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('main');
  const [jobs, setJobs] = useState(INIT_JOBS);
  const [selectedFailed, setSelectedFailed] = useState([]);
  const [jobModal, setJobModal] = useState(null);
  const [newJobOpen, setNewJobOpen] = useState(false);
  const [newJobName, setNewJobName] = useState('');
  const [newJobPages, setNewJobPages] = useState('4');
  const [onlyPriority, setOnlyPriority] = useState(false);

  const [range, setRange] = useState('24시간');
  const [statModal, setStatModal] = useState(null);

  const [selA, setSelA] = useState('v4');
  const [selB, setSelB] = useState('v3');
  const [abResult, setAbResult] = useState(null);
  const [abLoading, setAbLoading] = useState(false);
  const [versions, setVersions] = useState(VERSIONS);

  const [logFilter, setLogFilter] = useState('전체');
  const [logs, setLogs] = useState(LOGS);
  const [logModal, setLogModal] = useState(null);

  const [historyOpen, setHistoryOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const concurrencyCount = jobs.filter(j=>j.status==='처리중').length;

  function openJob(j){ setJobModal(j); }
  function advanceJob(id){
    setJobs(js=>js.map(j=>{
      if(j.id!==id) return j;
      const order=['대기','처리중','완료'];
      const idx = order.indexOf(j.status);
      const next = idx>=0 && idx<order.length-1 ? order[idx+1] : j.status;
      return {...j, status:next};
    }));
    setToast('작업 상태가 다음 단계로 이동되었습니다');
    setJobModal(null);
  }
  function retryJob(id){
    setJobs(js=>js.map(j=> j.id===id ? {...j, status:'대기', meta:'재시도 대기'} : j));
    setToast('선택한 작업이 재시도 큐에 등록되었습니다');
    setJobModal(null);
  }
  function toggleSelectFailed(id){
    setSelectedFailed(s=> s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  }
  function bulkRetry(){
    setJobs(js=>js.map(j=> selectedFailed.includes(j.id) ? {...j, status:'대기', meta:'일괄 재시도 대기'} : j));
    setToast(`실패 작업 ${selectedFailed.length}건이 일괄 재시도 등록되었습니다`);
    setSelectedFailed([]);
  }
  function submitNewJob(){
    const id = Math.floor(Math.random()*90)+230;
    setJobs(js=>[{ id, who:newJobName || '익명', status:'대기', meta:`동화 ${newJobPages}p`, avatar:(newJobName||'익명').slice(0,2), priority:false }, ...js]);
    setNewJobOpen(false); setNewJobName('');
    setToast('새 배치 작업이 큐에 등록되었습니다');
  }

  function refreshRange(r){ setRange(r); setToast(`최근 ${r} 기준으로 지표를 갱신했습니다`); }

  function runAB(){
    setAbLoading(true);
    setTimeout(()=>{
      setAbResult({
        a: versions.find(v=>v.id===selA),
        b: versions.find(v=>v.id===selB),
      });
      setAbLoading(false);
      setToast('A/B 재생성 비교가 완료되었습니다');
    }, 1200);
  }
  function rollbackTo(id){
    setVersions(vs=>vs.map(v=>({...v, active: v.id===id})));
    setToast(`${id} 버전으로 롤백되었습니다`);
  }

  const filteredLogs = logFilter==='전체' ? logs : logs.filter(l=> (logFilter==='차단' && l.verdict==='차단') || (logFilter==='재생성' && l.verdict==='재생성'));
  function approveLog(id){
    setLogs(ls=>ls.map(l=> l.id===id ? {...l, verdict:'통과', reason:'운영자 재검증 완료 — 오탐으로 판정'} : l));
    setToast('오탐으로 재검증되어 통과 처리되었습니다');
    setLogModal(null);
  }

  function cardBody(j){
    return (
      <React.Fragment>
        <div className="card-title">
          {j.priority && <span className="priority"></span>}
          {j.who}님 배치 #{j.id}
        </div>
        <div className="card-meta">
          <span className="tag">{j.meta}</span>
          <span className="avatar">{j.avatar}</span>
        </div>
      </React.Fragment>
    );
  }

  const j221 = jobs.find(j=>j.id===221);
  const j222 = jobs.find(j=>j.id===222);
  const j219 = jobs.find(j=>j.id===219);
  const j220 = jobs.find(j=>j.id===220);
  const j214 = jobs.find(j=>j.id===214);
  const j210 = jobs.find(j=>j.id===210);
  const j205 = jobs.find(j=>j.id===205);
  const visible = (j)=> j && (!onlyPriority || j.priority);

  return (
    <div className="app-bg" data-archetype="kanban-board">
      <header className="topbar">
        <div className="brand2">
          <span className="mark"><i className="ph ph-lightning"></i></span>
          여주 파이프라인 오퍼레이션
        </div>
        <div style={{display:'flex', alignItems:'center', gap:18}}>
          <div className="concurrency">
            <span>동시 처리 {concurrencyCount}/3</span>
            <div className="conc-track"><div className="conc-fill" style={{width:(concurrencyCount/3*100)+'%'}}></div></div>
          </div>
          <button className="btn2 btn-ghost2 btn-sm2" onClick={()=>setHistoryOpen(true)}>
            <i className="ph ph-clock-counter-clockwise"></i>
            <span>실행 로그</span>
          </button>
        </div>
      </header>

      <nav className="tabrow">
        {TABS.map(t=>(
          <button key={t.key} className={"tab-btn"+(tab===t.key?' active':'')} onClick={()=>setTab(t.key)}>
            <i className={"ph "+t.icon}></i>
            <span>{t.label}</span>
          </button>
        ))}
      </nav>

      <div className="content-wrap">
        {tab==='main' && (
          <div>
            <div className="page-head">
              <h1>배치 생성 큐 및 재시도 관리</h1>
              <p>다수의 동화 생성 요청을 상태별로 추적하고, 실패한 작업만 선택해 일괄 재시도합니다.</p>
            </div>

            <div className="ops-hero">
              <div>
                <p className="ops-hero-eyebrow">여주 관광 미션 · 역사동화 생성 <span className="grad-word">AI</span> 파이프라인</p>
                <h2 className="ops-hero-title">동화 한 편이<br/>완성되기까지</h2>
                <p className="ops-hero-sub">이름 입력부터 초대장·프롤로그, 역사동화·삽화 생성, 유해 콘텐츠 필터링, PDF 전자책 조합까지 — 배치 처리 현황을 실시간으로 추적합니다.</p>
              </div>
              <div>
                <div className="wave-track">
                  {FLOW_STAGES.map((s,idx)=>(
                    <div key={idx} className={"wave-stage"+(s.warn?' warn':'')}>
                      <div className="wave-bars">
                        {s.spark.map((v,i)=>(<i key={i} style={{height:v*2.2+'px', animationDelay:(idx*0.1+i*0.04)+'s'}}></i>))}
                      </div>
                      <div className="wave-label">{s.label}</div>
                    </div>
                  ))}
                </div>
                <div className="wave-connector"></div>
              </div>
            </div>

            <div style={{display:'flex', gap:10, marginBottom:18}}>
              <button className="btn2 btn-accent" onClick={()=>setNewJobOpen(true)}>
                <i className="ph ph-plus"></i>
                <span>새 배치 등록</span>
              </button>
              <button className={"btn2 btn-ghost2"+(onlyPriority?' active':'')} style={onlyPriority?{background:'rgba(43,127,255,.16)', borderColor:'var(--primary)'}:{}} onClick={()=>setOnlyPriority(o=>!o)}>
                <i className="ph ph-funnel"></i>
                <span>{onlyPriority ? '우선순위만 보는 중' : '우선순위만 보기'}</span>
              </button>
            </div>

            <div className="board-region">
              <div className="board">
                <section className="column">
                  <div className="col-header">
                    <span>대기</span>
                    <span className="count">{jobs.filter(j=>j.status==='대기' && visible(j)).length}</span>
                  </div>
                  {visible(j221) && j221.status==='대기' && (
                    <div className="card" onClick={()=>openJob(j221)}>{cardBody(j221)}</div>
                  )}
                  {visible(j222) && j222.status==='대기' && (
                    <div className="card" onClick={()=>openJob(j222)}>{cardBody(j222)}</div>
                  )}
                  {visible(j210) && j210.status==='대기' && (
                    <div className="card" onClick={()=>openJob(j210)}>{cardBody(j210)}</div>
                  )}
                  {visible(j205) && j205.status==='대기' && (
                    <div className="card" onClick={()=>openJob(j205)}>{cardBody(j205)}</div>
                  )}
                  {jobs.filter(j=>j.id>=230 && j.status==='대기' && visible(j)).map(j=>(
                    <div key={j.id} className="card" onClick={()=>openJob(j)}>{cardBody(j)}</div>
                  ))}
                </section>

                <section className="column">
                  <div className="col-header">
                    <span>처리중</span>
                    <span className="count">{jobs.filter(j=>j.status==='처리중' && visible(j)).length}</span>
                  </div>
                  {visible(j219) && j219.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j219)}>{cardBody(j219)}</div>
                  )}
                  {visible(j220) && j220.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j220)}>{cardBody(j220)}</div>
                  )}
                  {visible(j221) && j221.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j221)}>{cardBody(j221)}</div>
                  )}
                  {visible(j222) && j222.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j222)}>{cardBody(j222)}</div>
                  )}
                  {visible(j210) && j210.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j210)}>{cardBody(j210)}</div>
                  )}
                  {visible(j205) && j205.status==='처리중' && (
                    <div className="card" onClick={()=>openJob(j205)}>{cardBody(j205)}</div>
                  )}
                </section>

                <section className="column">
                  <div className="col-header">
                    <span>완료</span>
                    <span className="count">{jobs.filter(j=>j.status==='완료' && visible(j)).length}</span>
                  </div>
                  {visible(j214) && j214.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j214)}>{cardBody(j214)}</div>
                  )}
                  {visible(j219) && j219.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j219)}>{cardBody(j219)}</div>
                  )}
                  {visible(j220) && j220.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j220)}>{cardBody(j220)}</div>
                  )}
                  {visible(j221) && j221.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j221)}>{cardBody(j221)}</div>
                  )}
                  {visible(j222) && j222.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j222)}>{cardBody(j222)}</div>
                  )}
                  {visible(j210) && j210.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j210)}>{cardBody(j210)}</div>
                  )}
                  {visible(j205) && j205.status==='완료' && (
                    <div className="card" onClick={()=>openJob(j205)}>{cardBody(j205)}</div>
                  )}
                </section>

                <section className="column">
                  <div className="col-header">
                    <span>실패</span>
                    <span className="count">{jobs.filter(j=>j.status==='실패' && visible(j)).length}</span>
                  </div>
                  {visible(j210) && j210.status==='실패' && (
                    <div className="card failed-card" onClick={()=>openJob(j210)}>
                      {cardBody(j210)}
                      <label style={{display:'flex', alignItems:'center', marginTop:8, fontSize:11}} onClick={e=>e.stopPropagation()}>
                        <input type="checkbox" className="select-chk" checked={selectedFailed.includes(j210.id)} onChange={()=>toggleSelectFailed(j210.id)} />
                        일괄 재시도 선택
                      </label>
                    </div>
                  )}
                  {visible(j205) && j205.status==='실패' && (
                    <div className="card failed-card" onClick={()=>openJob(j205)}>
                      {cardBody(j205)}
                      <label style={{display:'flex', alignItems:'center', marginTop:8, fontSize:11}} onClick={e=>e.stopPropagation()}>
                        <input type="checkbox" className="select-chk" checked={selectedFailed.includes(j205.id)} onChange={()=>toggleSelectFailed(j205.id)} />
                        일괄 재시도 선택
                      </label>
                    </div>
                  )}
                </section>
              </div>

              <aside className="matrix-side">
                <p className="matrix-title">우선순위 / 재시도 필터</p>
                <div className="filter-row">
                  <button className={"filter-chip"+(onlyPriority?' on':'')} onClick={()=>setOnlyPriority(o=>!o)}>우선순위 높음</button>
                </div>
                <div className="filter-row">
                  <span style={{color:'var(--muted)'}}>실패 대기열</span>
                  <span style={{marginLeft:'auto'}}>{jobs.filter(j=>j.status==='실패').length}건</span>
                </div>
                <div className="retry-bar">
                  <p className="matrix-title">선택된 재시도</p>
                  <button className="btn2 btn-accent btn-sm2" disabled={!selectedFailed.length} style={!selectedFailed.length?{opacity:.35}:{}} onClick={bulkRetry}>
                    <i className="ph ph-arrows-clockwise"></i>
                    <span>선택 {selectedFailed.length}건 일괄 재시도</span>
                  </button>
                </div>
              </aside>
            </div>
          </div>
        )}

        {tab==='pipeline-monitor' && (
          <div>
            <div className="page-head">
              <h1>파이프라인 단계별 소요시간 모니터링</h1>
              <p>여주 관광 미션 기반 역사동화·삽화 생성과 유해 콘텐츠 필터링, 각 단계의 처리 시간을 집계해 병목 구간을 파악합니다.</p>
            </div>
            <div className="range-toggle">
              {['1시간','24시간'].map(r=>(
                <button key={r} className={"btn2 btn-sm2"+(range===r?' btn-accent':' btn-ghost2')} onClick={()=>refreshRange(r)}>{r}</button>
              ))}
            </div>
            <div className="stat-grid">
              {STATS.map(s=>(
                <div key={s.key} className={"stat-card"+(s.warn?' warn':'')} onClick={()=>setStatModal(s)}>
                  <div className="stat-label">{s.label}</div>
                  <div className="stat-num">{s.value}</div>
                  <div className="stat-trend">{s.warn ? '임계값 초과 — 지연 감지' : '정상 범위'}</div>
                  <div className="spark">
                    {s.spark.map((v,i)=>(<i key={i} style={{height:v+'px', animationDelay:(i*0.05)+'s'}}></i>))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==='prompt-console' && (
          <div>
            <div className="page-head">
              <h1>AI 프롬프트 버전 관리 및 A/B 재생성 비교</h1>
              <p>여주 역사동화 프롤로그·동화 생성 프롬프트를 버전별로 관리하고, 두 버전을 동시에 재생성해 결과를 비교합니다.</p>
            </div>
            <div className="prompt-layout">
              <div>
                <p className="matrix-title">동화 프롬프트 버전 이력</p>
                {versions.map(v=>(
                  <div key={v.id} className={"version-row"+(selA===v.id?' selA':'')+(selB===v.id?' selB':'')}>
                    <div className="vtitle">
                      <span onClick={()=>setSelA(v.id)}>{v.label}</span>
                      {v.active && <span className="active-badge">사용중</span>}
                    </div>
                    <div className="vdate">{v.date}</div>
                    <div style={{display:'flex', gap:6, marginTop:8}}>
                      <button className="btn2 btn-ghost2 btn-sm2" onClick={()=>setSelA(v.id)}>A로 선택</button>
                      <button className="btn2 btn-ghost2 btn-sm2" onClick={()=>setSelB(v.id)}>B로 선택</button>
                      {!v.active && <button className="btn2 btn-ghost2 btn-sm2" onClick={()=>rollbackTo(v.id)}>롤백</button>}
                    </div>
                  </div>
                ))}
              </div>
              <div>
                <button className={"btn2 btn-accent"+(abLoading?' loading':'')} onClick={runAB} disabled={abLoading}>
                  <i className="ph ph-flask"></i>
                  <span>{abLoading ? '재생성 실행 중...' : `A(${selA}) vs B(${selB}) 재생성 실행`}</span>
                </button>
                {abResult && !abLoading && (
                  <div className="compare-grid">
                    <div className="compare-card">
                      <h4>버전 {abResult.a.label}</h4>
                      <p>{abResult.a.body} <span className="diff-hl">개인화 변수 결합</span></p>
                    </div>
                    <div className="compare-card">
                      <h4>버전 {abResult.b.label}</h4>
                      <p>{abResult.b.body} <span className="diff-hl">서술 톤 차이</span></p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {tab==='moderation-log' && (
          <div>
            <div className="page-head">
              <h1>유해 콘텐츠 감사 로그 및 재검증</h1>
              <p>필터링 가드레일이 차단·재생성한 이력을 감사 로그로 확인하고 오탐 여부를 재검증합니다.</p>
            </div>
            <div className="filter-tabs">
              {['전체','차단','재생성'].map(f=>(
                <button key={f} className={"btn2 btn-sm2"+(logFilter===f?' btn-accent':' btn-ghost2')} onClick={()=>setLogFilter(f)}>{f}</button>
              ))}
            </div>
            {filteredLogs.map(l=>(
              <div className="log-row" key={l.id} onClick={()=>setLogModal(l)}>
                <div className="log-left">
                  <i className={"ph "+(l.type==='이미지' ? 'ph-image' : 'ph-file-text')}></i>
                  <span>{l.name}</span>
                </div>
                <div style={{display:'flex', alignItems:'center', gap:10}}>
                  <span style={{fontSize:11.5, color:'var(--muted)'}}>{l.time}</span>
                  <span className={"verdict "+(l.verdict==='통과'?'pass':l.verdict==='차단'?'block':'retry')}>{l.verdict}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {historyOpen && (
        <div className="drawer2-overlay" onClick={()=>setHistoryOpen(false)}>
          <div className="drawer2" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
              <h3 style={{fontSize:17, fontWeight:700, margin:0}}>실행 로그</h3>
              <button className="modal-close2" style={{float:'none'}} onClick={()=>setHistoryOpen(false)}><i className="ph ph-x"></i></button>
            </div>
            {jobs.slice(0,5).map(j=>(
              <div key={j.id} className="log-row" onClick={()=>{ setHistoryOpen(false); setJobModal(j); }}>
                <div className="log-left"><i className="ph ph-cube"></i><span>{j.who}님 배치 #{j.id}</span></div>
                <span style={{fontSize:11.5, color:'var(--muted)'}}>{j.status}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {newJobOpen && (
        <Modal2 title="새 배치 작업 등록" onClose={()=>setNewJobOpen(false)}>
          <input className="txt-input2" placeholder="여행자 이름" value={newJobName} onChange={e=>setNewJobName(e.target.value)} />
          <select className="select2" value={newJobPages} onChange={e=>setNewJobPages(e.target.value)} style={{marginBottom:16}}>
            <option value="3">3페이지 동화</option>
            <option value="4">4페이지 동화</option>
            <option value="5">5페이지 동화</option>
          </select>
          <div>
            <button className="btn2 btn-accent" onClick={submitNewJob}>
              <i className="ph ph-plus"></i>
              <span>큐에 등록</span>
            </button>
          </div>
        </Modal2>
      )}

      {jobModal && (
        <Modal2 title={jobModal.who+'님 배치 #'+jobModal.id} onClose={()=>setJobModal(null)}>
          <p style={{fontSize:13.5, color:'var(--muted)', lineHeight:1.7}}>현재 상태: {jobModal.status}<br/>메타: {jobModal.meta}<br/>우선순위: {jobModal.priority ? '높음' : '보통'}</p>
          <div style={{display:'flex', gap:8, marginTop:14}}>
            {jobModal.status!=='완료' && jobModal.status!=='실패' && (
              <button className="btn2 btn-accent btn-sm2" onClick={()=>advanceJob(jobModal.id)}>
                <i className="ph ph-arrow-right"></i><span>다음 단계로 이동</span>
              </button>
            )}
            {jobModal.status==='실패' && (
              <button className="btn2 btn-accent btn-sm2" onClick={()=>retryJob(jobModal.id)}>
                <i className="ph ph-arrows-clockwise"></i><span>재시도</span>
              </button>
            )}
          </div>
        </Modal2>
      )}

      {statModal && (
        <Modal2 title={statModal.label} onClose={()=>setStatModal(null)}>
          <p style={{fontSize:13.5, color:'var(--muted)', lineHeight:1.7}}>
            현재 값: {statModal.value}<br/>
            상태: {statModal.warn ? '임계값 초과 — 병목 구간으로 표시됨' : '정상 범위'}<br/>
            집계 기준: 최근 {range}
          </p>
        </Modal2>
      )}

      {logModal && (
        <Modal2 title={logModal.name} onClose={()=>setLogModal(null)}>
          <p style={{fontSize:13.5, color:'var(--muted)', lineHeight:1.7}}>유형: {logModal.type}<br/>시각: {logModal.time}<br/>사유: {logModal.reason}</p>
          <span className={"verdict "+(logModal.verdict==='통과'?'pass':logModal.verdict==='차단'?'block':'retry')} style={{marginTop:10, display:'inline-block'}}>{logModal.verdict}</span>
          {logModal.verdict!=='통과' && (
            <div style={{marginTop:14}}>
              <button className="btn2 btn-accent btn-sm2" onClick={()=>approveLog(logModal.id)}>
                <i className="ph ph-check"></i><span>오탐으로 재검증</span>
              </button>
            </div>
          )}
        </Modal2>
      )}

      <Toast2 message={toast} onDone={()=>setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
