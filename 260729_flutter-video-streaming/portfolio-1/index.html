<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

<style>
:root{
  --bg:#f6f3f1;
  --ink:#242424;
  --graphite:#4e4d4d;
  --smoke:#797776;
  --ash:#cecac8;
  --accent:#2b59d1;
  --periwinkle:#cfdaf5;
  --white:#ffffff;
  --green:#1a8f5e;
  --amber:#b8790f;
  --red:#c23f26;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--bg);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--ash);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:#fff;border-right:1px solid var(--ash);padding:22px 14px;overflow-y:auto;z-index:10;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;border-bottom:1px solid var(--ash);margin-bottom:18px;}
.sidebar-brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-brand-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;}
.sidebar-brand-sub{font-size:11px;color:var(--smoke);}
.sidebar-section{margin-bottom:22px;}
.sidebar-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--smoke);padding:0 10px;margin-bottom:8px;font-weight:600;}
.sidebar-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;border-radius:8px;font-size:13.5px;color:var(--graphite);line-height:1.3;margin-bottom:2px;}
.sidebar-link i{font-size:17px;flex-shrink:0;}
.sidebar-link:hover{background:var(--bg);}
.sidebar-link.active{background:var(--periwinkle);color:var(--ink);font-weight:600;}
.sidebar-footer{position:absolute;bottom:18px;left:14px;right:14px;padding:12px;border:1px solid var(--ash);border-radius:10px;font-size:11.5px;color:var(--smoke);}

/* main */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:30px 36px 90px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px;}
.page-title{font-size:40px;font-weight:700;letter-spacing:-0.02em;}
.page-desc{color:var(--smoke);font-size:13.5px;margin-top:6px;max-width:640px;line-height:1.5;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}
.page-meta{font-size:12px;color:var(--smoke);margin-top:10px;display:flex;align-items:center;gap:6px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulseDot 1.6s ease infinite;display:inline-block;}

.btn-primary{background:var(--accent);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:opacity .15s;}
.btn-primary:hover{opacity:.88;}
.btn-secondary{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;}
.btn-ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:9px 18px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;}
.btn-sm{padding:6px 14px;font-size:12.5px;border-radius:999px;background:var(--periwinkle);color:var(--ink);font-weight:600;}
.btn-sm.danger{background:#fce6e0;color:var(--red);}

.stat-row{display:flex;gap:14px;margin:22px 0 26px;}
.stat-card{flex:1;background:#fff;border:1px solid var(--ash);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;min-height:104px;}
.stat-label{font-size:11.5px;color:var(--smoke);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.stat-value{font-size:32px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12px;color:var(--green);font-weight:600;}
.stat-sparkline{position:absolute;right:14px;bottom:14px;width:76px;height:30px;opacity:.75;}

.content-row{display:flex;gap:18px;align-items:flex-start;}
.content-main{flex:1;min-width:0;}
.priority-rail{width:288px;flex-shrink:0;background:#fff;border:1px solid var(--ash);border-radius:10px;padding:16px;}
.rail-title{font-size:13.5px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.rail-sub{font-size:11.5px;color:var(--smoke);margin-bottom:12px;}
.rail-item{border:1px solid var(--ash);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:background .15s;}
.rail-item:hover{background:var(--bg);}
.rail-item-name{font-size:12.5px;font-weight:600;margin-bottom:3px;}
.rail-item-reason{font-size:11.5px;color:var(--red);margin-bottom:8px;}
.rail-item-foot{display:flex;justify-content:space-between;align-items:center;}
.rail-item-count{font-size:11px;color:var(--smoke);}

.tab-bar{display:flex;gap:22px;border-bottom:1px solid var(--ash);margin-bottom:16px;}
.tab{padding:9px 2px;font-size:13.5px;color:var(--smoke);border-bottom:2px solid transparent;transition:.2s;font-weight:500;}
.tab.active{color:var(--ink);border-color:var(--accent);font-weight:700;}

.board-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.board-col{background:#faf9f7;border:1px solid var(--ash);border-radius:10px;padding:12px;min-height:340px;}
.board-col-title{font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;color:var(--graphite);text-transform:uppercase;letter-spacing:.03em;}
.board-col-count{background:var(--ash);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;}
.job-card{background:#fff;border:1px solid var(--ash);border-radius:8px;padding:11px 12px;margin-bottom:9px;transition:transform .15s,box-shadow .15s;animation:cardIn .35s ease both;}
.job-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(36,36,36,.09);}
.job-card-id{font-size:10.5px;color:var(--smoke);margin-bottom:3px;font-variant-numeric:tabular-nums;}
.job-card-name{font-size:12.5px;font-weight:600;margin-bottom:6px;line-height:1.35;}
.job-card-meta{font-size:11px;color:var(--smoke);display:flex;justify-content:space-between;}
.job-progress-track{height:4px;background:var(--ash);border-radius:4px;margin-top:8px;overflow:hidden;}
.job-progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.badge-queued{background:#eee;color:var(--graphite);}
.badge-processing{background:#dde6fb;color:var(--accent);}
.badge-completed{background:#dff3e8;color:var(--green);}
.badge-failed{background:#fce6e0;color:var(--red);}
.badge-ok{background:#dff3e8;color:var(--green);}
.badge-warn{background:#fbe9d0;color:var(--amber);}

.data-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.data-table th{text-align:left;color:var(--smoke);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--ash);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
.data-table td{padding:11px 12px;border-bottom:1px solid #eee;}
.data-table tr:hover td{background:var(--bg);cursor:pointer;}

.data-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--ash);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--smoke);flex:1;min-width:180px;max-width:280px;}
.search-box input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
.chip{border:1px solid var(--ash);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--graphite);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.secondary-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:26px;}
.chart-card{background:#fff;border:1px solid var(--ash);border-radius:10px;padding:20px 22px;}
.chart-card-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.chart-card-sub{font-size:11.5px;color:var(--smoke);margin-bottom:12px;}

.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.info-card{background:#fff;border:1px solid var(--ash);border-radius:10px;padding:18px;transition:transform .15s,box-shadow .15s;}
.info-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(36,36,36,.08);}
.info-card-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.info-card-value{font-size:24px;font-weight:700;letter-spacing:-0.01em;margin-bottom:3px;}
.info-card-sub{font-size:11.5px;color:var(--smoke);}

.section-block{background:#fff;border:1px solid var(--ash);border-radius:10px;padding:20px 22px;margin-bottom:20px;}
.section-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section-block-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}

.player-mock{background:var(--ink);border-radius:14px;aspect-ratio:16/9;max-width:640px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.player-mock-bg{position:absolute;inset:0;background:linear-gradient(135deg,#2b59d1 0%,#242424 60%,#111 100%);opacity:.85;}
.player-mock-play{position:relative;z-index:2;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;backdrop-filter:blur(4px);}
.player-mock-bar{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;}
.player-mock-track{height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;}
.player-mock-fill{height:100%;background:var(--periwinkle);border-radius:4px;transition:width .3s;}
.player-mock-label{color:#fff;font-size:11px;margin-top:8px;display:flex;justify-content:space-between;opacity:.85;}

.profile-row{display:flex;gap:10px;margin:18px 0;}
.profile-btn{flex:1;border:1px solid var(--ash);border-radius:10px;padding:14px 12px;text-align:left;transition:all .15s;background:#fff;}
.profile-btn i{font-size:18px;margin-bottom:6px;display:block;}
.profile-btn-name{font-size:13px;font-weight:700;}
.profile-btn-sub{font-size:11px;color:var(--smoke);margin-top:2px;}
.profile-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.profile-btn.active .profile-btn-sub{color:#c9c9c9;}

.modal-overlay{position:fixed;inset:0;background:rgba(36,36,36,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .18s ease;}
.modal-box{background:#fff;border-radius:14px;padding:26px;max-width:540px;width:100%;max-height:84vh;overflow:auto;animation:fadeInScale .2s ease;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-shrink:0;}
.modal-field{margin-bottom:14px;}
.modal-field label{font-size:12px;color:var(--smoke);font-weight:600;display:block;margin-bottom:6px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;border:1px solid var(--ash);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;}
.modal-field textarea{resize:vertical;min-height:70px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.log-line{font-size:12px;color:var(--graphite);background:var(--bg);padding:9px 12px;border-radius:6px;margin-bottom:6px;font-variant-numeric:tabular-nums;}
.manifest-box{background:var(--ink);color:#e6e6e6;border-radius:8px;padding:14px;font-size:12px;line-height:1.7;white-space:pre-wrap;font-variant-numeric:tabular-nums;}

.toast-stack{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:9px;animation:slideUp .22s ease;box-shadow:0 8px 22px rgba(0,0,0,.2);}
.toast i{color:#a7fccd;}

@media (max-width:1180px){
  .board-grid{grid-template-columns:repeat(2,1fr);}
  .secondary-grid{grid-template-columns:1fr;}
  .card-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:640px){
  .sidebar{width:100%;position:relative;border-right:none;border-bottom:1px solid var(--ash);}
  .main-wrap{margin-left:0;width:100%;padding:22px 16px 70px;}
  .page-header{flex-wrap:wrap;}
  .page-actions{flex-wrap:wrap;width:100%;}
  .page-title{font-size:28px;}
  .stat-row{flex-direction:column;}
  .content-row{flex-direction:column;}
  .priority-rail{width:100%;}
  .board-grid{grid-template-columns:1fr;}
  .card-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ---------- utils ---------- */
function useCountUp(target, duration){
  const [val, setVal] = useState(0);
  useEffect(()=>{
    let start = null; let raf;
    function step(ts){
      if(!start) start = ts;
      const p = Math.min((ts-start)/duration, 1);
      setVal(Math.round(target*p));
      if(p<1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return val;
}

function Sparkline({data, color}){
  const w=76,h=30;
  const max = Math.max(...data), min = Math.min(...data);
  const range = (max-min)||1;
  const pts = data.map((d,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((d-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={"0 0 "+w+" "+h}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(
        <div className="toast" key={t.id}><i className="ph ph-check-circle"></i>{t.text}</div>
      ))}
    </div>
  );
}

function Modal({title, onClose, children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

                <div className="rail-title"><i className="ph ph-gauge"></i>현재 재생 지표</div>
                <div className="rail-sub">{networkProfiles[profileKey].label} 프로파일 기준</div>
                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                  <div className="info-card" style={{padding:14}}>
                    <div className="info-card-title"><i className="ph ph-broadcast"></i>현재 비트레이트</div>
                    <div className="info-card-value" style={{fontSize:18}}>{networkProfiles[profileKey].bitrate}</div>
                  </div>
                  <div className="info-card" style={{padding:14}}>
                    <div className="info-card-title"><i className="ph ph-timer"></i>세그먼트 로드 시간</div>
                    <div className="info-card-value" style={{fontSize:18}}>{networkProfiles[profileKey].loadTime}</div>
                  </div>
                  <div className="info-card" style={{padding:14}}>
                    <div className="info-card-title"><i className="ph ph-drop"></i>평균 버퍼 길이</div>
                    <div className="info-card-value" style={{fontSize:18}}>{(networkProfiles[profileKey].buffer.reduce((a,b)=>a+b,0)/networkProfiles[profileKey].buffer.length).toFixed(1)}초</div>
                  </div>
                </div>
              </aside>
            </div>
          </div>
        )}

        {screen==='infra-cdn' && (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">AWS·Cloudflare CDN 인프라 구성</div>
                <div className="page-desc">스트리밍 세그먼트가 저장되는 AWS S3 오리진과 Cloudflare CDN 캐시 규칙 구성을 확인·관리합니다.</div>
              </div>
              <div className="page-actions">
                <button className="btn-primary" onClick={()=>setModal({type:'invalidate'})}><i className="ph ph-arrows-clockwise"></i>캐시 무효화 요청</button>
              </div>
            </div>

            <div className="card-grid">
              {s3Buckets.map((b,i)=>(
                <div className="info-card" key={i} onClick={()=>setModal({type:'bucket', bucket:b})} style={{cursor:'pointer'}}>
                  <div className="info-card-title"><i className="ph ph-database"></i>{b.name}</div>
                  <div className="info-card-value">{b.sizeGB.toLocaleString()}GB</div>
                  <div className="info-card-sub">오브젝트 {b.objects.toLocaleString()}개</div>
                </div>
              ))}
            </div>

            <div className="section-block">
              <div className="section-block-head">
                <div className="section-block-title"><i className="ph ph-globe"></i>리전별 CDN 캐시 히트율</div>
              </div>
              <table className="data-table">
                <thead><tr><th>리전</th><th>캐시 히트율</th><th>요청 수</th><th>상태</th></tr></thead>
                <tbody>
                  {cdnRegions.map((r,i)=>(
                    <tr key={i} onClick={()=>setModal({type:'region', region:r})}>
                      <td>{r.region}</td><td>{r.hitRate}%</td><td>{r.requests.toLocaleString()}</td>
                      <td><span className={"badge "+(r.hitRate>=90?'badge-ok':'badge-warn')}>{r.hitRate>=90?'양호':'점검 필요'}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="section-block">
              <div className="section-block-head">
                <div className="section-block-title"><i className="ph ph-clock-counter-clockwise"></i>캐시 무효화 이력</div>
              </div>
              <table className="data-table">
                <thead><tr><th>경로</th><th>요청 시각</th><th>상태</th></tr></thead>
                <tbody>
                  {invalidations.map((v,i)=>(
                    <tr key={i}><td>{v.path}</td><td>{v.requestedAt}</td><td><span className="badge badge-ok">{v.status}</span></td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {screen==='cost-report' && (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">인프라 비용 리포트</div>
                <div className="page-desc">AWS S3·EC2·Cloudflare CDN 등 스트리밍 인프라 서비스별 월간 과금 현황을 확인합니다.</div>
              </div>
              <div className="page-actions">
                <button className="btn-secondary" onClick={exportCSV}><i className="ph ph-download-simple"></i>CSV로 내보내기</button>
              </div>
            </div>

            <div className="secondary-grid">
              <div className="chart-card">
                <div className="chart-card-title">월별 인프라 비용 추이</div>
                <div className="chart-card-sub">최근 6개월</div>
                <div style={{height:200}}>
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={monthlyTrend}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false} />
                      <XAxis dataKey="month" fontSize={11} stroke="#797776" />
                      <YAxis fontSize={11} stroke="#797776" width={44} tickFormatter={v=>(v/10000)+'만'} />
                      <Tooltip formatter={v=>v.toLocaleString()+'원'} />
                      <Bar dataKey="cost" fill="#242424" radius={[4,4,0,0]} />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>
              <div className="chart-card">
                <div className="chart-card-title">서비스별 비중</div>
                <div className="chart-card-sub">이번 달 합계 {costBreakdown.reduce((a,b)=>a+b.cost,0).toLocaleString()}원</div>
                <div style={{height:200}}>
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie data={costBreakdown} dataKey="cost" nameKey="service" innerRadius={42} outerRadius={68} paddingAngle={2}>
                        {costBreakdown.map((s,i)=><Cell key={i} fill={['#2b59d1','#242424','#4e4d4d','#a0b5eb','#cecac8'][i%5]} />)}
                      </Pie>
                      <Tooltip formatter={v=>v.toLocaleString()+'원'} />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              </div>
            </div>

            <div className="section-block">
              <div className="section-block-head"><div className="section-block-title"><i className="ph ph-receipt"></i>서비스별 상세 내역</div></div>
              <table className="data-table">
                <thead><tr><th>서비스</th><th>이번 달 비용</th><th>전월 대비</th></tr></thead>
                <tbody>
                  {costBreakdown.map((c,i)=>(
                    <tr key={i}><td>{c.service}</td><td>{c.cost.toLocaleString()}원</td><td style={{color:'#1a8f5e'}}>{['-4%','+3%','+1%','-2%','+6%'][i]}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </main>

      {modal && modal.type==='upload' && (
        <Modal title="새 트랜스코딩 작업 업로드" onClose={()=>setModal(null)}>
          <form onSubmit={handleUploadSubmit}>
            <div className="modal-field"><label>파일명</label><input name="filename" placeholder="예: campaign_teaser_v3.mp4" /></div>
            <div className="modal-field"><label>목표 해상도</label>
              <select><option>1080p / 720p / 480p</option><option>1080p / 720p</option><option>720p / 480p / 360p</option></select>
            </div>
            <div className="modal-field"><label>우선순위</label><select><option>보통</option><option>높음</option></select></div>
            <div className="modal-actions">
              <button type="button" className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button type="submit" className="btn-primary">등록</button>
            </div>
          </form>
        </Modal>
      )}

      {modal && modal.type==='job' && (
        <Modal title={modal.job.filename} onClose={()=>setModal(null)}>
          <div style={{marginBottom:12}}><span className={"badge "+badgeClass[modal.job.status]}>{badgeLabel[modal.job.status]}</span></div>
          <div className="log-line">작업 ID: {modal.job.id}</div>
          <div className="log-line">목표 해상도: {modal.job.resolution}</div>
          <div className="log-line">원본 길이: {modal.job.duration} · 접수: {modal.job.submittedAt}</div>
          {modal.job.status==='failed' && <div className="log-line" style={{color:'#c23f26'}}>실패 사유: {modal.job.reason}</div>}
          <div style={{marginTop:14, marginBottom:8, fontSize:12.5, fontWeight:700}}>FFmpeg 워커 로그</div>
          <div className="log-line">[00:00] input probed — codec h264, 30fps</div>
          <div className="log-line">[00:04] segmenting to HLS ladder (1080p/720p/480p)</div>
          <div className="log-line">[00:11] queue → worker-03 assigned</div>
          <div className="modal-actions">
            {modal.job.status==='failed' && <button className="btn-primary" onClick={()=>retryJob(modal.job.id)}>재시도</button>}
            <button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button>
          </div>
        </Modal>
      )}

      {modal && modal.type==='historyDetail' && (
        <Modal title={modal.row.filename} onClose={()=>setModal(null)}>
          <div className="log-line">해상도: {modal.row.resolution}</div>
          <div className="log-line">총 처리 시간: {modal.row.time}</div>
          <div className="log-line">완료 시각: {modal.row.completedAt}</div>
          <div className="modal-actions"><button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button></div>
        </Modal>
      )}

      {modal && modal.type==='manifest' && (
        <Modal title="HLS 매니페스트 뷰어 — master.m3u8" onClose={()=>setModal(null)}>
          <div className="manifest-box">{manifestText}</div>
          <div style={{marginTop:14, fontSize:12.5, fontWeight:700}}>비트레이트 옵션</div>
          <table className="data-table" style={{marginTop:8}}>
            <thead><tr><th>해상도</th><th>대역폭</th></tr></thead>
            <tbody>
              <tr><td>1920×1080</td><td>5.0 Mbps</td></tr>
              <tr><td>1280×720</td><td>2.8 Mbps</td></tr>
              <tr><td>854×480</td><td>1.2 Mbps</td></tr>
              <tr><td>640×360</td><td>0.6 Mbps</td></tr>
            </tbody>
          </table>
          <div className="modal-actions"><button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button></div>
        </Modal>
      )}

      {modal && modal.type==='endpoint' && (
        <Modal title={modal.ep.path} onClose={()=>setModal(null)}>
          <div style={{marginBottom:10}}><span className={"badge "+(modal.ep.status==='정상'?'badge-ok':'badge-warn')}>{modal.ep.status}</span></div>
          <div className="log-line">프로토콜: {modal.ep.protocol} · 메서드: {modal.ep.method}</div>
          <div className="log-line">요청 수(24h): {modal.ep.requests.toLocaleString()}건</div>
          <div className="log-line">평균 응답 시간: {modal.ep.latency}ms · 오류율: {modal.ep.errorRate}%</div>
          <div style={{marginTop:14, marginBottom:8, fontSize:12.5, fontWeight:700}}>최근 요청 타임라인</div>
          <div className="log-line">10:41:02 — 200 OK — 41ms</div>
          <div className="log-line">10:41:05 — 200 OK — 38ms</div>
          <div className="log-line">10:41:09 — 200 OK — 52ms</div>
          <div className="modal-actions"><button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button></div>
        </Modal>
      )}

      {modal && modal.type==='invalidate' && (
        <Modal title="캐시 무효화 요청" onClose={()=>setModal(null)}>
          <form onSubmit={submitInvalidation}>
            <div className="modal-field">
              <label>무효화 경로</label>
              <select value={invalidatePath} onChange={e=>setInvalidatePath(e.target.value)}>
                <option>/v1/streams/9210/*</option>
                <option>/v1/streams/9104/1080p/*</option>
                <option>/v1/streams/*/thumbnails.vtt</option>
              </select>
            </div>
            <div className="modal-field"><label>사유</label><textarea placeholder="예: 원본 재변환 후 CDN 캐시 갱신"></textarea></div>
            <div className="modal-actions">
              <button type="button" className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button type="submit" className="btn-primary">요청 제출</button>
            </div>
          </form>
        </Modal>
      )}

      {modal && modal.type==='bucket' && (
        <Modal title={modal.bucket.name} onClose={()=>setModal(null)}>
          <div className="log-line">저장 용량: {modal.bucket.sizeGB.toLocaleString()}GB</div>
          <div className="log-line">오브젝트 수: {modal.bucket.objects.toLocaleString()}개</div>
          <div className="log-line">라이프사이클 정책: 30일 경과 세그먼트 Glacier 이관</div>
          <div className="modal-actions"><button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button></div>
        </Modal>
      )}

      {modal && modal.type==='region' && (
        <Modal title={modal.region.region} onClose={()=>setModal(null)}>
          <div className="log-line">캐시 히트율: {modal.region.hitRate}%</div>
          <div className="log-line">요청 수(24h): {modal.region.requests.toLocaleString()}건</div>
          <div className="log-line">오리진 요청 비율: {(100-modal.region.hitRate).toFixed(1)}%</div>
          <div className="modal-actions"><button className="btn-ghost" onClick={()=>setModal(null)}>닫기</button></div>
        </Modal>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
