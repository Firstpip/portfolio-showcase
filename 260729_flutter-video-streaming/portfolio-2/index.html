<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>엣지레이더 글로벌 CDN 트래픽 관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f2f0eb;
  --ink:#292827;
  --muted:#666666;
  --border:#e3e3e2;
  --primary:#d4c7ff;
  --accent:#f6bc1e;
  --surface:#ffffff;
  --green:#1f8a5f;
  --amber:#b8790f;
  --red:#c23f26;
  --lagoon:#0c4243;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--bg);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawerIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pingMarker{0%{box-shadow:0 0 0 0 rgba(246,188,30,.55)}70%{box-shadow:0 0 0 14px rgba(246,188,30,0)}100%{box-shadow:0 0 0 0 rgba(246,188,30,0)}}
@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* topnav */
.topnav{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(242,240,235,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;}
.brand-name{font-size:15.5px;font-weight:700;letter-spacing:-0.01em;}
.brand-sub{font-size:11px;color:var(--muted);}
.nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.nav-link{padding:9px 14px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500;}
.nav-link:hover{background:#fff;}
.nav-link.active{background:var(--ink);color:#fff;font-weight:600;}
.nav-cta{display:flex;gap:8px;align-items:center;}

.btn-primary{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:opacity .15s;}
.btn-primary:hover{opacity:.85;}
.btn-lilac{background:var(--primary);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;}
.btn-ghost{background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;display:inline-flex;gap:6px;align-items:center;}
.btn-outline{border:1px solid var(--ink);border-radius:8px;padding:8px 14px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;}
.btn-icon{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.btn-icon:hover{transform:scale(1.06);}

/* map screen */
.map-stage{position:relative;flex:1;min-height:calc(100vh - 64px);overflow:hidden;background:
  radial-gradient(circle at 20% 30%, rgba(212,199,255,.5), transparent 45%),
  radial-gradient(circle at 80% 70%, rgba(246,188,30,.25), transparent 40%),
  linear-gradient(180deg, #f7f5f0 0%, #ece8df 100%);}
.geo-map{position:absolute;inset:0;}
.geo-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(41,40,39,.08) 1px, transparent 1px);background-size:26px 26px;opacity:.6;}
.geo-band{position:absolute;left:6%;right:6%;top:22%;height:56%;border:1px dashed rgba(41,40,39,.12);border-radius:50%;}
.marker{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);}
.marker.selected{animation:pingMarker 1.6s ease infinite;}
.marker-label{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;background:#fff;padding:2px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.08);}

.map-hero{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;animation:cardPop .35s ease;}
.map-hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 12px;border-radius:999px;margin-bottom:10px;}
.map-hero-title{font-size:40px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);text-shadow:0 2px 18px rgba(242,240,235,.9);}
.map-topbar{margin-top:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:12px 24px;display:flex;gap:26px;box-shadow:0 12px 30px rgba(41,40,39,.1);}
.map-topbar-item{text-align:center;}
.map-topbar-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.map-topbar-value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}

.drawer-panel{position:absolute;left:20px;top:20px;width:270px;max-height:calc(100% - 40px);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:20px;box-shadow:0 16px 40px rgba(41,40,39,.14);padding:16px;overflow-y:auto;animation:cardPop .3s ease;}
.drawer-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 14px;margin-bottom:12px;background:#fff;}
.drawer-search input{border:none;outline:none;flex:1;font-size:13px;background:transparent;}
.result-list{list-style:none;margin:0;padding:0;}
.result-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;transition:background .15s;}
.result-item:hover{background:var(--bg);}
.result-item.active{background:var(--primary);}
.result-item-name{font-size:13px;font-weight:600;}
.result-item-hit{font-size:11px;color:var(--muted);}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.detail-card{position:absolute;right:20px;bottom:20px;width:300px;background:#fff;border-radius:20px;border:1px solid var(--border);box-shadow:0 18px 44px rgba(41,40,39,.16);padding:18px;animation:cardPop .3s ease;}
.detail-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.detail-card-title{font-size:16px;font-weight:700;}
.detail-metric-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bg);font-size:12.5px;}
.detail-metric-row span:first-child{color:var(--muted);}
.detail-metric-row span:last-child{font-weight:600;font-variant-numeric:tabular-nums;}

.map-controls{position:absolute;right:20px;top:20px;display:flex;flex-direction:column;gap:6px;}
.legend{position:absolute;left:20px;bottom:20px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:14px;padding:12px 16px;font-size:11.5px;box-shadow:0 10px 26px rgba(41,40,39,.1);}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.legend-row:last-child{margin-bottom:0;}

/* page content */
.page{max-width:1200px;margin:0 auto;padding:36px 28px 90px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;}
.page-title{font-size:34px;font-weight:700;letter-spacing:-0.015em;}
.page-desc{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:660px;line-height:1.55;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}

.grid-2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:22px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 24px;box-shadow:0 10px 26px rgba(41,40,39,.06);}
.panel-title{font-size:15px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px;}
.panel-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}

.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px;box-shadow:0 10px 24px rgba(41,40,39,.06);transition:transform .18s, box-shadow .18s;}
.metric-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(41,40,39,.12);}
.metric-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.metric-value{font-size:28px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.metric-foot{font-size:12px;margin-top:6px;font-weight:600;}
.metric-foot.up{color:var(--green);}
.metric-foot.warn{color:var(--amber);}

.data-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.data-table th{text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
.data-table td{padding:11px 12px;border-bottom:1px solid #f0efea;}
.data-table tr:hover td{background:var(--bg);cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.badge-ok{background:#dff3e8;color:var(--green);}
.badge-warn{background:#fdf1d6;color:var(--amber);}
.badge-danger{background:#fce6e0;color:var(--red);}
.badge-lilac{background:var(--primary);color:var(--ink);}

.priority-list{display:flex;flex-direction:column;gap:10px;}
.priority-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:16px;padding:12px 14px;background:#fff;}
.priority-rank{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.priority-name{flex:1;font-size:13px;font-weight:600;}
.priority-sub{font-size:11.5px;color:var(--muted);}
.priority-actions{display:flex;gap:4px;}

.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:20px;}
.timeline-item{position:relative;padding-bottom:20px;}
.timeline-item::before{content:'';position:absolute;left:-26px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
.timeline-time{font-size:11px;color:var(--muted);}
.timeline-title{font-size:13px;font-weight:700;margin:2px 0 3px;}
.timeline-desc{font-size:12px;color:var(--muted);}

.price-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bg);}
.price-row input{width:110px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;text-align:right;}

.dark-band{position:relative;overflow:hidden;background:var(--lagoon);border-radius:24px;padding:44px 40px;display:flex;align-items:center;gap:40px;color:#fff;}
.dark-band-text{flex:1;position:relative;z-index:2;}
.dark-band-title{font-size:32px;font-weight:600;letter-spacing:-0.01em;line-height:1.25;margin-bottom:12px;}
.dark-band-desc{font-size:14px;color:rgba(255,255,255,.78);line-height:1.6;max-width:480px;margin-bottom:22px;}
.dark-band-btn{border:1px solid #fff;color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;background:transparent;}
.dark-band-btn:hover{background:rgba(255,255,255,.12);}
.dark-band-art{position:relative;width:220px;height:160px;flex-shrink:0;}
.dark-band-shape{position:absolute;border-radius:20px;opacity:.5;animation:floatSlow 5s ease-in-out infinite;}
.dark-band-shape.s1{width:130px;height:130px;background:var(--primary);top:0;right:40px;transform:rotate(12deg);animation-delay:0s;}
.dark-band-shape.s2{width:90px;height:90px;background:var(--accent);bottom:0;right:0;transform:rotate(-8deg);animation-delay:.6s;}
.dark-band-shape.s3{width:70px;height:70px;background:#ffffff;opacity:.15;top:30px;right:120px;animation-delay:1.1s;}
@media (max-width:720px){ .dark-band{flex-direction:column;} }

.drawer-slide{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:#fff;box-shadow:-16px 0 40px rgba(41,40,39,.16);z-index:120;padding:26px;overflow-y:auto;animation:drawerIn .22s ease;}
.drawer-overlay{position:fixed;inset:0;background:rgba(41,40,39,.28);z-index:110;animation:fadeIn .18s ease;}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.drawer-title{font-size:19px;font-weight:700;}
.drawer-close{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;}
.field textarea{resize:vertical;min-height:70px;}
.field-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.toast-stack{position:fixed;left:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:9px;animation:drawerIn .22s ease;box-shadow:0 10px 26px rgba(0,0,0,.2);}
.toast i{color:var(--accent);}

@media (max-width:1100px){
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .drawer-panel{width:220px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const {BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, CartesianGrid, RadarChart, PolarGrid, PolarAngleAxis, Radar} = Recharts;

/* ---------- mock data ---------- */
const regions = [
  {id:'icn', name:'서울(ICN)', x:83, y:36, hitRate:96.8, trafficTB:41.2, requests:812000, loadDeviation:4, startupMs:210, rebufferPct:0.4, switches:1.2, qoeScore:4.6},
  {id:'nrt', name:'도쿄(NRT)', x:88, y:39, hitRate:94.5, trafficTB:24.6, requests:342000, loadDeviation:9, startupMs:260, rebufferPct:0.6, switches:1.6, qoeScore:4.4},
  {id:'sin', name:'싱가포르(SIN)', x:79, y:60, hitRate:91.2, trafficTB:15.8, requests:198000, loadDeviation:14, startupMs:340, rebufferPct:1.1, switches:2.1, qoeScore:4.1},
  {id:'fra', name:'프랑크푸르트(FRA)', x:51, y:29, hitRate:88.4, trafficTB:19.4, requests:104000, loadDeviation:22, startupMs:410, rebufferPct:1.8, switches:2.8, qoeScore:3.7},
  {id:'iad', name:'버지니아(IAD)', x:26, y:33, hitRate:92.7, trafficTB:28.9, requests:265000, loadDeviation:11, startupMs:280, rebufferPct:0.8, switches:1.7, qoeScore:4.3},
  {id:'gru', name:'상파울루(GRU)', x:33, y:70, hitRate:81.6, trafficTB:9.1, requests:58000, loadDeviation:29, startupMs:520, rebufferPct:2.6, switches:3.4, qoeScore:3.2},
];

function statusOf(hit){ return hit>=93 ? 'ok' : hit>=87 ? 'warn' : 'danger'; }
const statusColor = {ok:'#1f8a5f', warn:'#f6bc1e', danger:'#c23f26'};
const statusLabel = {ok:'양호', warn:'주의', danger:'위험'};

const failoverPriority = [
  {rank:1, name:'Cloudflare — Primary', sub:'평균 응답 38ms · 가동률 99.98%'},
  {rank:2, name:'AWS CloudFront — Secondary', sub:'평균 응답 52ms · 가동률 99.95%'},
  {rank:3, name:'Fastly — Tertiary', sub:'평균 응답 61ms · 가동률 99.90%'},
];

const initialTimeline = [
  {time:'07-28 22:14', title:'상파울루(GRU) → Fastly 전환', desc:'Cloudflare 엣지 응답 지연 임계치(300ms) 초과로 자동 전환'},
  {time:'07-27 03:41', title:'프랑크푸르트(FRA) 헬스체크 경고', desc:'오리진 응답 지연 증가 감지 — 전환 없이 모니터링 강화'},
  {time:'07-25 19:02', title:'싱가포르(SIN) → CloudFront 전환', desc:'네트워크 피어링 장애로 2차 경로 자동 전환, 6분 후 복구'},
];

const auditLog = [
  {time:'07-28 22:14', field:'상파울루 우선순위', before:'Cloudflare', after:'Fastly'},
  {time:'07-22 10:05', field:'글로벌 헬스체크 주기', before:'60초', after:'30초'},
  {time:'07-18 14:30', field:'프랑크푸르트 임계치', before:'400ms', after:'300ms'},
];

const initialUnitPrices = {storage:38, transfer:92, cdn:26, compute:410};

/* ---------- utils ---------- */
function Toast({toasts}){
  return <div className="toast-stack">{toasts.map(t=><div className="toast" key={t.id}><i data-lucide="check-circle-2"></i>{t.text}</div>)}</div>;
}

function Drawer({title, onClose, children}){
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer-slide">
        <div className="drawer-head">
          <div className="drawer-title">{title}</div>
          <button className="drawer-close" onClick={onClose}><i data-lucide="x"></i></button>
        </div>
        {children}
      </div>
    </React.Fragment>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [selectedRegion, setSelectedRegion] = useState(regions[0].id);
  const [zoom, setZoom] = useState(1);
  const [search, setSearch] = useState('');
  const [drawer, setDrawer] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [priorities, setPriorities] = useState(failoverPriority);
  const [timeline, setTimeline] = useState(initialTimeline);
  const [unitPrices, setUnitPrices] = useState(initialUnitPrices);
  const [month, setMonth] = useState('2026년 7월');

  useEffect(()=>{ lucide.createIcons(); });

  function pushToast(text){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3200);
  }

  const region = regions.find(r=>r.id===selectedRegion);
  const filteredRegions = regions.filter(r=>r.name.toLowerCase().includes(search.toLowerCase()));
  const totalTraffic = regions.reduce((a,b)=>a+b.trafficTB,0).toFixed(1);
  const avgHit = (regions.reduce((a,b)=>a+b.hitRate,0)/regions.length).toFixed(1);

  function moveRank(idx, dir){
    setPriorities(list=>{
      const next=[...list];
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=next.length) return list;
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      return next.map((p,i)=>({...p, rank:i+1}));
    });
  }
  function savePriorities(){ pushToast('라우팅 우선순위가 저장되었습니다'); }
  function simulateFailover(){
    const now = '07-29 ' + new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0');
    setTimeline(t=>[{time:now, title:'싱가포르(SIN) → Fastly 전환', desc:'헬스체크 실패 3회 연속 감지로 자동 페일오버 실행'}, ...t]);
    pushToast('장애조치 이벤트가 타임라인에 기록되었습니다');
  }

  const monthlyUsage = regions.map(r=>({
    name:r.name, storageGB: Math.round(r.trafficTB*8), transferGB: Math.round(r.trafficTB*22),
  }));
  function estCost(row){
    return Math.round(row.storageGB*unitPrices.storage + row.transferGB*unitPrices.transfer + row.transferGB*0.3*unitPrices.cdn);
  }
  const totalCost = monthlyUsage.reduce((a,r)=>a+estCost(r),0);
  function exportCSV(){ pushToast(month+' 정산 데이터를 CSV로 내보냈습니다'); }

  const navItems = [
    {key:'region-analytics', label:'리전별 캐시 히트율 & 트랜스코딩 부하 분산 분석'},
    {key:'failover-routing', label:'멀티 CDN 장애조치 & 라우팅 정책 관리'},
    {key:'cost-settlement', label:'스트리밍 비용 정산 & 리전별 과금 리포트'},
    {key:'video-qoe', label:'재생 품질 분석'},
  ];

  return (
    <div className="shell" data-archetype="map-canvas">
      <header className="topnav">
        <button className="brand" onClick={()=>setScreen('main')}>
          <div className="brand-mark"><i data-lucide="radar"></i></div>
          <div style={{textAlign:'left'}}>
            <div className="brand-name">EdgeRadar</div>
            <div className="brand-sub">엣지레이더 관제 플랫폼</div>
          </div>
        </button>
        <nav className="nav-links">
          <button className={"nav-link"+(screen==='main'?' active':'')} onClick={()=>setScreen('main')}>글로벌 트래픽 지도</button>
          {navItems.map(n=>(
            <button key={n.key} className={"nav-link"+(screen===n.key?' active':'')} onClick={()=>setScreen(n.key)}>{n.label}</button>
          ))}
        </nav>
        <div className="nav-cta">
          <button className="btn-ghost" onClick={()=>pushToast('알림 3건을 확인했습니다')}><i data-lucide="bell"></i></button>
          <button className="btn-lilac" onClick={()=>pushToast('운영 리포트를 생성했습니다')}><i data-lucide="file-down"></i>리포트</button>
        </div>
      </header>

      {screen==='main' && (
        <div className="map-stage">
          <div className="geo-map" style={{transform:'scale('+zoom+')', transition:'transform .25s ease'}}>
            <div className="geo-dots"></div>
            <div className="geo-band"></div>
            <div className="marker" style={{left:regions[0].x+'%', top:regions[0].y+'%', background:statusColor[statusOf(regions[0].hitRate)], boxShadow:selectedRegion===regions[0].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[0].id)}></div>
            <div className="marker" style={{left:regions[1].x+'%', top:regions[1].y+'%', background:statusColor[statusOf(regions[1].hitRate)], boxShadow:selectedRegion===regions[1].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[1].id)}></div>
            <div className="marker" style={{left:regions[2].x+'%', top:regions[2].y+'%', background:statusColor[statusOf(regions[2].hitRate)], boxShadow:selectedRegion===regions[2].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[2].id)}></div>
            <div className="marker" style={{left:regions[3].x+'%', top:regions[3].y+'%', background:statusColor[statusOf(regions[3].hitRate)], boxShadow:selectedRegion===regions[3].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[3].id)}></div>
            <div className="marker" style={{left:regions[4].x+'%', top:regions[4].y+'%', background:statusColor[statusOf(regions[4].hitRate)], boxShadow:selectedRegion===regions[4].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[4].id)}></div>
            <div className="marker" style={{left:regions[5].x+'%', top:regions[5].y+'%', background:statusColor[statusOf(regions[5].hitRate)], boxShadow:selectedRegion===regions[5].id?'0 0 0 6px rgba(246,188,30,.35)':'0 2px 6px rgba(0,0,0,.18)'}} onClick={()=>setSelectedRegion(regions[5].id)}></div>
            <div className="marker-label" style={{left:region.x+'%', top:region.y+'%'}}>{region.name}</div>
          </div>

          <div className="map-hero">
            <div className="map-hero-eyebrow"><i data-lucide="satellite"></i>실시간 글로벌 관제</div>
            <div className="map-hero-title">엣지 트래픽을 한눈에 조망합니다</div>
            <div className="map-topbar">
              <div className="map-topbar-item"><div className="map-topbar-label">합산 트래픽</div><div className="map-topbar-value">{totalTraffic}TB</div></div>
              <div className="map-topbar-item"><div className="map-topbar-label">평균 히트율</div><div className="map-topbar-value">{avgHit}%</div></div>
              <div className="map-topbar-item"><div className="map-topbar-label">모니터링 리전</div><div className="map-topbar-value">{regions.length}개</div></div>
            </div>
          </div>

          <div className="drawer-panel">
            <div className="drawer-search"><i data-lucide="search"></i><input placeholder="리전 검색" value={search} onChange={e=>setSearch(e.target.value)} /></div>
            <ul className="result-list">
              {filteredRegions.map(r=>{
                const st = statusOf(r.hitRate);
                return (
                  <li key={r.id} className={"result-item"+(selectedRegion===r.id?' active':'')} onClick={()=>setSelectedRegion(r.id)}>
                    <div>
                      <div className="result-item-name">{r.name}</div>
                      <div className="result-item-hit">히트율 {r.hitRate}% · {r.trafficTB}TB</div>
                    </div>
                    <div className="status-dot" style={{background:statusColor[st]}}></div>
                  </li>
                );
              })}
            </ul>
          </div>

          <div className="map-controls">
            <button className="btn-icon" onClick={()=>setZoom(z=>Math.min(z+0.1,1.4))}><i data-lucide="plus"></i></button>
            <button className="btn-icon" onClick={()=>setZoom(z=>Math.max(z-0.1,0.9))}><i data-lucide="minus"></i></button>
          </div>

          <div className="legend">
            <div className="legend-row"><span className="status-dot" style={{background:statusColor.ok}}></span>양호 (히트율 93%+)</div>
            <div className="legend-row"><span className="status-dot" style={{background:statusColor.warn}}></span>주의 (87~93%)</div>
            <div className="legend-row"><span className="status-dot" style={{background:statusColor.danger}}></span>위험 (87% 미만)</div>
          </div>

          <div className="detail-card">
            <div className="detail-card-head">
              <div className="detail-card-title">{region.name}</div>
              <span className="badge" style={{background:statusColor[statusOf(region.hitRate)]+'22', color:statusColor[statusOf(region.hitRate)]}}>{statusLabel[statusOf(region.hitRate)]}</span>
            </div>
            <div className="detail-metric-row"><span>캐시 히트율</span><span>{region.hitRate}%</span></div>
            <div className="detail-metric-row"><span>일일 트래픽</span><span>{region.trafficTB}TB</span></div>
            <div className="detail-metric-row"><span>요청 수(24h)</span><span>{region.requests.toLocaleString()}</span></div>
            <div className="detail-metric-row"><span>부하 편차</span><span>{region.loadDeviation}%</span></div>
            <button className="btn-outline" style={{marginTop:12, width:'100%', justifyContent:'center'}} onClick={()=>setDrawer({type:'regionDetail', region})}>상세 리포트 보기</button>
          </div>
        </div>
      )}

      {screen==='region-analytics' && (
        <div className="page">
          <div className="page-header">
            <div>
              <div className="page-title">리전별 캐시 히트율 & 트랜스코딩 부하 분산 분석</div>
              <div className="page-desc">리전별 캐시 히트율과 트랜스코딩 작업 부하 분산 현황을 비교 분석합니다. 자동 갱신 주기 5분 이내.</div>
            </div>
          </div>

          <div className="grid-2">
            <div className="panel">
              <div className="panel-title"><i data-lucide="bar-chart-3"></i>리전별 캐시 히트율</div>
              <div className="panel-sub">리전 간 비교</div>
              <div style={{height:220}}>
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={regions}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false} />
                    <XAxis dataKey="name" fontSize={10.5} stroke="#666" />
                    <YAxis fontSize={11} stroke="#666" width={32} domain={[70,100]} />
                    <Tooltip formatter={v=>v+'%'} />
                    <Bar dataKey="hitRate" fill="#d4c7ff" radius={[6,6,0,0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="panel">
              <div className="panel-title"><i data-lucide="activity"></i>부하 편차 추이</div>
              <div className="panel-sub">기준치 20% 초과 시 재분산 권장</div>
              <div style={{height:220}}>
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={regions}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
                    <XAxis dataKey="name" fontSize={10.5} stroke="#666" />
                    <YAxis fontSize={11} stroke="#666" width={28} />
                    <Tooltip formatter={v=>v+'%'} />
                    <Line type="monotone" dataKey="loadDeviation" stroke="#f6bc1e" strokeWidth={3} dot={{r:4}} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-title"><i data-lucide="table"></i>리전 상세 비교</div>
            <div className="panel-sub">클릭 시 상세 리포트를 확인할 수 있습니다</div>
            <table className="data-table">
              <thead><tr><th>리전</th><th>캐시 히트율</th><th>오리진 요청 수</th><th>부하 편차</th><th>상태</th></tr></thead>
              <tbody>
                {regions.map(r=>(
                  <tr key={r.id} onClick={()=>setDrawer({type:'regionDetail', region:r})}>
                    <td>{r.name}</td><td>{r.hitRate}%</td><td>{r.requests.toLocaleString()}</td>
                    <td>{r.loadDeviation}%</td>
                    <td>{r.loadDeviation>=20 ? <span className="badge badge-warn">재분산 권장</span> : <span className="badge badge-ok">안정</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {screen==='failover-routing' && (
        <div className="page">
          <div className="page-header">
            <div>
              <div className="page-title">멀티 CDN 장애조치 & 라우팅 정책 관리</div>
              <div className="page-desc">단일 CDN 장애 시 대체 경로로 자동 전환하는 라우팅 정책을 구성하고 장애조치 이력을 확인합니다.</div>
            </div>
            <div className="page-actions">
              <button className="btn-ghost" style={{border:'1px solid var(--ink)'}} onClick={simulateFailover}><i data-lucide="zap"></i>장애 시뮬레이션</button>
              <button className="btn-primary" onClick={savePriorities}><i data-lucide="save"></i>우선순위 저장</button>
            </div>
          </div>

          <div className="grid-2">
            <div className="panel">
              <div className="panel-title"><i data-lucide="list-ordered"></i>CDN 경로 우선순위</div>
              <div className="panel-sub">화살표로 순서를 재정렬할 수 있습니다</div>
              <div className="priority-list">
                {priorities.map((p,i)=>(
                  <div className="priority-item" key={p.name}>
                    <div className="priority-rank">{p.rank}</div>
                    <div style={{flex:1}}>
                      <div className="priority-name">{p.name}</div>
                      <div className="priority-sub">{p.sub}</div>
                    </div>
                    <div className="priority-actions">
                      <button className="btn-icon" onClick={()=>moveRank(i,-1)}><i data-lucide="chevron-up"></i></button>
                      <button className="btn-icon" onClick={()=>moveRank(i,1)}><i data-lucide="chevron-down"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="panel">
              <div className="panel-title"><i data-lucide="history"></i>장애조치 이력</div>
              <div className="panel-sub">자동 전환 시각·사유 기록</div>
              <div className="timeline">
                {timeline.map((t,i)=>(
                  <div className="timeline-item" key={i}>
                    <div className="timeline-time">{t.time}</div>
                    <div className="timeline-title">{t.title}</div>
                    <div className="timeline-desc">{t.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-title"><i data-lucide="shield-check"></i>라우팅 정책 변경 감사 로그</div>
            <table className="data-table">
              <thead><tr><th>변경 시각</th><th>항목</th><th>변경 전</th><th>변경 후</th></tr></thead>
              <tbody>
                {auditLog.map((a,i)=>(
                  <tr key={i} onClick={()=>setDrawer({type:'auditDetail', item:a})}>
                    <td>{a.time}</td><td>{a.field}</td><td>{a.before}</td><td>{a.after}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {screen==='cost-settlement' && (
        <div className="page">
          <div className="page-header">
            <div>
              <div className="page-title">스트리밍 비용 정산 & 리전별 과금 리포트</div>
              <div className="page-desc">리전별 대역폭·스토리지 사용량을 기반으로 CDN·스토리지 비용을 정산하고 리포트를 생성합니다.</div>
            </div>
            <div className="page-actions">
              <select value={month} onChange={e=>setMonth(e.target.value)} style={{border:'1px solid var(--border)', borderRadius:8, padding:'8px 12px', fontSize:13}}>
                <option>2026년 7월</option><option>2026년 6월</option><option>2026년 5월</option>
              </select>
              <button className="btn-primary" onClick={exportCSV}><i data-lucide="download"></i>CSV 내보내기</button>
            </div>
          </div>

          <div className="grid-3">
            <div className="metric-card" style={{borderRadius:20, boxShadow:'0 16px 40px rgba(41,40,39,.14)'}}><div className="metric-label">이번 달 예상 비용</div><div className="metric-value">{totalCost.toLocaleString()}원</div><div className="metric-foot up">단가 변경 시 즉시 재계산</div></div>
            <div className="metric-card" style={{borderRadius:20, boxShadow:'0 16px 40px rgba(41,40,39,.14)'}}><div className="metric-label">합산 전송량</div><div className="metric-value">{monthlyUsage.reduce((a,r)=>a+r.transferGB,0).toLocaleString()}GB</div><div className="metric-foot">리전 {regions.length}개 합산</div></div>
            <div className="metric-card" style={{borderRadius:20, boxShadow:'0 16px 40px rgba(41,40,39,.14)', padding:22}}><div className="metric-label">합산 저장량</div><div className="metric-value">{monthlyUsage.reduce((a,r)=>a+r.storageGB,0).toLocaleString()}GB</div><div className="metric-foot">오리진 + 캐시</div></div>
          </div>

          <div className="grid-2">
            <div className="panel">
              <div className="panel-title"><i data-lucide="table-properties"></i>리전별 사용량 · 예상 비용</div>
              <table className="data-table">
                <thead><tr><th>리전</th><th>저장(GB)</th><th>전송(GB)</th><th>예상 비용</th></tr></thead>
                <tbody>
                  {monthlyUsage.map((r,i)=>(
                    <tr key={i}><td>{r.name}</td><td>{r.storageGB.toLocaleString()}</td><td>{r.transferGB.toLocaleString()}</td><td>{estCost(r).toLocaleString()}원</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="panel">
              <div className="panel-title"><i data-lucide="sliders-horizontal"></i>단가 테이블 (원/GB)</div>
              <div className="panel-sub">값을 변경하면 예상 비용이 즉시 재계산됩니다</div>
              <div className="price-row"><span>S3 오리진 저장</span><input type="number" value={unitPrices.storage} onChange={e=>setUnitPrices(u=>({...u, storage:Number(e.target.value)}))} /></div>
              <div className="price-row"><span>데이터 전송</span><input type="number" value={unitPrices.transfer} onChange={e=>setUnitPrices(u=>({...u, transfer:Number(e.target.value)}))} /></div>
              <div className="price-row"><span>Cloudflare CDN</span><input type="number" value={unitPrices.cdn} onChange={e=>setUnitPrices(u=>({...u, cdn:Number(e.target.value)}))} /></div>
              <div className="price-row" style={{borderBottom:'none'}}><span>트랜스코딩 컴퓨트(시간당)</span><input type="number" value={unitPrices.compute} onChange={e=>setUnitPrices(u=>({...u, compute:Number(e.target.value)}))} /></div>
            </div>
          </div>

          <div className="dark-band">
            <div className="dark-band-text">
              <div className="dark-band-title">저활용 리전을 자동으로 감지합니다</div>
              <div className="dark-band-desc">캐시 히트율이 낮고 전송 비용이 큰 리전을 매달 자동 하이라이트해, 라우팅 우선순위 조정만으로 비용을 절감할 여지를 제안합니다.</div>
              <button className="dark-band-btn" onClick={()=>{setScreen('failover-routing'); pushToast('라우팅 정책 화면으로 이동했습니다');}}>라우팅 정책 확인하기</button>
            </div>
            <div className="dark-band-art">
              <div className="dark-band-shape s1"></div>
              <div className="dark-band-shape s2"></div>
              <div className="dark-band-shape s3"></div>
            </div>
          </div>
        </div>
      )}

      {screen==='video-qoe' && (
        <div className="page">
          <div className="page-header">
            <div>
              <div className="page-title">재생 품질 분석</div>
              <div className="page-desc">리전별 재생 시작 지연·리버퍼링 비율·화질 전환 횟수 등 사용자 체감 재생 품질(QoE) 지표를 확인합니다.</div>
            </div>
          </div>

          <div className="grid-2">
            <div className="panel">
              <div className="panel-title"><i data-lucide="gauge"></i>리전별 평균 시작 지연</div>
              <div style={{height:220}}>
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={regions}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false} />
                    <XAxis dataKey="name" fontSize={10.5} stroke="#666" />
                    <YAxis fontSize={11} stroke="#666" width={34} />
                    <Tooltip formatter={v=>v+'ms'} />
                    <Bar dataKey="startupMs" fill="#0c4243" radius={[6,6,0,0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="panel">
              <div className="panel-title"><i data-lucide="radar"></i>종합 체감 품질(QoE) 스코어</div>
              <div style={{height:220}}>
                <ResponsiveContainer width="100%" height="100%">
                  <RadarChart data={regions} outerRadius={80}>
                    <PolarGrid stroke="#e3e3e2" />
                    <PolarAngleAxis dataKey="name" fontSize={10} stroke="#666" />
                    <Radar dataKey="qoeScore" stroke="#f6bc1e" fill="#f6bc1e" fillOpacity={0.35} />
                    <Tooltip formatter={v=>v+' / 5.0'} />
                  </RadarChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-title"><i data-lucide="list-checks"></i>리전별 QoE 상세 지표</div>
            <table className="data-table">
              <thead><tr><th>리전</th><th>시작 지연</th><th>리버퍼링 비율</th><th>화질 전환(시간당)</th><th>체감 점수</th></tr></thead>
              <tbody>
                {regions.map(r=>(
                  <tr key={r.id} onClick={()=>setDrawer({type:'qoeDetail', region:r})}>
                    <td>{r.name}</td><td>{r.startupMs}ms</td><td>{r.rebufferPct}%</td><td>{r.switches}회</td>
                    <td><span className={"badge "+(r.qoeScore>=4.2?'badge-ok':r.qoeScore>=3.5?'badge-warn':'badge-danger')}>{r.qoeScore.toFixed(1)}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {drawer && drawer.type==='regionDetail' && (
        <Drawer title={drawer.region.name+' 상세 리포트'} onClose={()=>setDrawer(null)}>
          <div className="field"><label>캐시 히트율</label><input readOnly value={drawer.region.hitRate+'%'} /></div>
          <div className="field"><label>일일 트래픽</label><input readOnly value={drawer.region.trafficTB+'TB'} /></div>
          <div className="field"><label>요청 수(24h)</label><input readOnly value={drawer.region.requests.toLocaleString()} /></div>
          <div className="field"><label>부하 편차</label><input readOnly value={drawer.region.loadDeviation+'%'} /></div>
          <div className="field-actions"><button className="btn-primary" onClick={()=>{setDrawer(null); pushToast('리전 리포트를 다운로드했습니다');}}>리포트 다운로드</button></div>
        </Drawer>
      )}

      {drawer && drawer.type==='auditDetail' && (
        <Drawer title={drawer.item.field} onClose={()=>setDrawer(null)}>
          <div className="field"><label>변경 시각</label><input readOnly value={drawer.item.time} /></div>
          <div className="field"><label>변경 전</label><input readOnly value={drawer.item.before} /></div>
          <div className="field"><label>변경 후</label><input readOnly value={drawer.item.after} /></div>
          <div className="field-actions"><button className="btn-outline" onClick={()=>setDrawer(null)}>닫기</button></div>
        </Drawer>
      )}

      {drawer && drawer.type==='qoeDetail' && (
        <Drawer title={drawer.region.name+' 재생 품질'} onClose={()=>setDrawer(null)}>
          <div className="field"><label>평균 시작 지연</label><input readOnly value={drawer.region.startupMs+'ms'} /></div>
          <div className="field"><label>리버퍼링 비율</label><input readOnly value={drawer.region.rebufferPct+'%'} /></div>
          <div className="field"><label>화질 전환 횟수(시간당)</label><input readOnly value={drawer.region.switches+'회'} /></div>
          <div className="field"><label>사용자 체감 점수</label><input readOnly value={drawer.region.qoeScore.toFixed(1)+' / 5.0'} /></div>
          <div className="field-actions"><button className="btn-outline" onClick={()=>setDrawer(null)}>닫기</button></div>
        </Drawer>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
