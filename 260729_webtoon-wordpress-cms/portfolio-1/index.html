<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKCRANE — 웹툰 퍼블리셔 쇼케이스 홈페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root{
  --primary:#ffffff;
  --secondary:#000000;
  --accent:#a02d25;
  --bg:#ffffff;
  --surface:#9a9a9a;
  --text-primary:#000000;
  --text-secondary:#6d6d6d;
  --border:#000000;
  --border-soft:rgba(0,0,0,0.14);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#root{width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
ul{list-style:none;margin:0;padding:0;}
img{display:block;max-width:100%;}

/* ── keyframes ── */
@keyframes introLineUp{
  0%{opacity:0;transform:translateY(38px);}
  100%{opacity:1;transform:translateY(0);}
}
@keyframes introFadeOut{
  0%{opacity:1;visibility:visible;}
  99%{opacity:0;visibility:visible;}
  100%{opacity:0;visibility:hidden;}
}
@keyframes rotateScroll{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes heroFade{
  0%{opacity:0;transform:translateY(24px);}
  100%{opacity:1;transform:translateY(0);}
}
@keyframes drawerIn{
  from{transform:translateX(100%);}
  to{transform:translateX(0);}
}
@keyframes scrimIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes chipPulse{
  0%{box-shadow:0 0 0 0 rgba(160,45,37,0.35);}
  70%{box-shadow:0 0 0 8px rgba(160,45,37,0);}
  100%{box-shadow:0 0 0 0 rgba(160,45,37,0);}
}
@keyframes bannerSheen{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}

/* ── intro ── */
.intro-overlay{
  position:fixed;inset:0;z-index:200;background:#000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  animation:introFadeOut .9s cubic-bezier(.19,1,.22,1) 2.05s forwards;
}
.intro-line{
  color:#fff;font-weight:400;letter-spacing:-.01em;text-align:center;
  font-size:clamp(32px,7vw,84px);line-height:1.08;
  opacity:0;animation:introLineUp .9s cubic-bezier(.19,1,.22,1) forwards;
}
.intro-line + .intro-line{margin-top:4px;}

/* ── top nav ── */
.topnav{
  position:fixed;top:0;left:0;width:100%;height:66px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;transition:background .5s ease,border-color .5s ease;
  border-bottom:1px solid transparent;
}
.topnav.solid{background:#fff;border-bottom:1px solid var(--border-soft);}
.topnav.on-dark{color:#fff;}
.brand{font-size:16px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.brand-mark{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-block;}
.nav-menu{display:flex;gap:34px;align-items:center;}
.nav-menu button{font-size:12px;letter-spacing:.06em;font-weight:400;padding:6px 0;position:relative;}
.nav-menu button.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;}
.nav-cta{display:flex;align-items:center;gap:14px;}
.pill-btn{
  border-radius:75px;padding:11px 33px;font-size:16px;font-weight:400;
  border:1px solid var(--border);transition:border-color .8s cubic-bezier(.19,1,.22,1),letter-spacing .8s cubic-bezier(.19,1,.22,1),background .3s ease;
}
.pill-btn:hover{letter-spacing:.03em;}
.pill-btn.dark{border-color:#000;color:#000;}
.pill-btn.on-hero{border-color:rgba(255,255,255,.5);color:#fff;}
.pill-btn.filled{background:var(--secondary);color:#fff;border-color:var(--secondary);}
.hamburger-btn{display:none;}
.mobile-menu{
  position:fixed;inset:0;background:#000;color:#fff;z-index:120;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:26px;padding:0 40px;
}
.mobile-menu button{font-size:32px;font-weight:400;}
.mobile-close{position:absolute;top:22px;right:28px;}

/* ── hero ── */
.hero{
  position:relative;width:100%;min-height:100vh;
  background:linear-gradient(160deg,#0b0b0c 0%,#171512 42%,#3a2018 68%,#a02d25 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;padding:120px 24px 80px;
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 55%);
  pointer-events:none;
}
.hero-eyebrow{font-size:12px;letter-spacing:.18em;color:rgba(255,255,255,.65);margin-bottom:22px;opacity:0;animation:heroFade .9s cubic-bezier(.19,1,.22,1) .1s forwards;}
.hero-title{
  font-size:clamp(52px,9vw,124px);font-weight:400;line-height:.98;text-align:center;letter-spacing:-.01em;
  opacity:0;animation:heroFade 1s cubic-bezier(.19,1,.22,1) .25s forwards;
}
.hero-sub{
  margin-top:26px;font-size:18px;color:rgba(255,255,255,.75);max-width:520px;text-align:center;line-height:1.6;
  opacity:0;animation:heroFade 1s cubic-bezier(.19,1,.22,1) .5s forwards;
}
.hero-actions{margin-top:40px;display:flex;gap:16px;opacity:0;animation:heroFade 1s cubic-bezier(.19,1,.22,1) .7s forwards;}
.scroll-badge{
  position:absolute;left:30px;bottom:30px;width:88px;height:88px;color:#fff;
}
.scroll-badge svg{animation:rotateScroll 9s linear infinite;}
.scroll-badge-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}

/* ── sections (white) ── */
.section{width:100%;padding:96px 40px;}
.section-inner{max-width:1078px;margin:0 auto;}
.section-label{font-size:12px;letter-spacing:.14em;color:var(--text-secondary);margin-bottom:18px;}
.section-head{font-size:clamp(30px,4vw,54px);font-weight:400;line-height:1.15;max-width:640px;}
.section-head-light{font-weight:300;font-size:clamp(28px,3.4vw,46px);}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:52px;}
.wwd-card{border-top:1px solid var(--border);padding-top:22px;}
.wwd-num{font-size:12px;color:var(--text-secondary);margin-bottom:10px;}
.wwd-title{font-size:20px;margin-bottom:10px;}
.wwd-desc{font-size:15px;color:var(--text-secondary);line-height:1.65;}

/* preview gallery on home */
.preview-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:52px;margin-bottom:28px;}
.text-link{font-size:14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding-bottom:2px;}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.work-card{cursor:pointer;}
.work-card .thumb{width:100%;aspect-ratio:480/623;overflow:hidden;background:#eee;position:relative;}
.work-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.19,1,.22,1);filter:grayscale(.12) contrast(1.05);}
.work-card:hover .thumb img{transform:scale(1.045);}
.work-card .badge{position:absolute;top:10px;left:10px;background:#000;color:#fff;font-size:11px;padding:4px 10px;border-radius:75px;}
.work-card .cap{margin-top:14px;font-size:16px;}
.work-card .cap-sub{font-size:13px;color:var(--text-secondary);margin-top:4px;}

.pub-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:16px;margin-top:44px;}
.pub-card{cursor:pointer;}
.pub-card .thumb{width:100%;aspect-ratio:145/200;background:#eee;overflow:hidden;}
.pub-card .thumb img{width:100%;height:100%;object-fit:cover;}
.pub-card .cap{margin-top:10px;font-size:12.5px;line-height:1.4;}

.news-preview-list{margin-top:44px;display:flex;flex-direction:column;}
.news-row{display:flex;gap:24px;padding:22px 0;border-top:1px solid var(--border-soft);cursor:pointer;align-items:center;}
.news-row:last-child{border-bottom:1px solid var(--border-soft);}
.news-row .thumb{width:72px;height:72px;flex:none;background:#eee;overflow:hidden;}
.news-row .thumb img{width:100%;height:100%;object-fit:cover;}
.news-row .meta{font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
.news-row .title{font-size:17px;}
.pin-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:75px;padding:2px 9px;margin-right:8px;}

/* CTA / join us */
.cta-band{background:#0a0a0a;color:#fff;padding:96px 40px;text-align:center;}
.cta-band .section-head{color:#fff;margin:0 auto;text-align:center;}
.cta-demo-toggle{
  margin-top:34px;display:inline-flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.25);border-radius:75px;padding:8px 18px;
}
.switch{width:38px;height:20px;border-radius:75px;background:rgba(255,255,255,.25);position:relative;transition:background .3s;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.19,1,.22,1);}
.switch.on .knob{left:20px;}

/* footer */
.footer{padding:64px 40px 40px;border-top:1px solid var(--border-soft);}
.footer-inner{max-width:1078px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;}
.footer-col{font-size:11px;color:var(--text-secondary);line-height:1.7;}
.footer-col b{color:var(--text-primary);display:block;margin-bottom:6px;font-size:12px;}

/* Works screen */
.works-screen{width:100%;padding-top:66px;}
.works-body{max-width:1240px;margin:0 auto;padding:56px 40px 100px;display:flex;gap:48px;align-items:flex-start;}
.filter-rail{width:200px;flex:none;position:sticky;top:100px;}
.filter-rail-title{font-size:12px;color:var(--text-secondary);letter-spacing:.1em;margin-bottom:18px;}
.filter-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:15px;}
.filter-item button{font-size:15px;}
.filter-item.active{font-weight:600;}
.filter-item .sort-note{font-size:11px;color:var(--text-secondary);}
.gallery-col{flex:1;min-width:0;}
.gallery-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;}
.pager{display:flex;gap:8px;margin-top:52px;justify-content:center;}
.pager button{width:34px;height:34px;border:1px solid var(--border-soft);font-size:13px;}
.pager button.active{background:#000;color:#fff;border-color:#000;}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;animation:scrimIn .3s ease;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(480px,92vw);background:#fff;z-index:151;
  box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow-y:auto;animation:drawerIn .5s cubic-bezier(.19,1,.22,1);
}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:#fff;}
.drawer-body{padding:0 0 40px;}
.drawer-hero{width:100%;aspect-ratio:480/623;max-height:340px;object-fit:cover;background:#eee;}
.drawer-content{padding:28px 26px;}
.drawer-content h2{font-size:26px;margin:0 0 14px;}
.drawer-content p{font-size:15px;line-height:1.75;color:#222;margin:0 0 16px;}
.drawer-linkbtns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

.popover{
  position:fixed;z-index:151;background:#fff;border:1px solid #000;padding:18px;width:240px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
}
.popover img{width:100%;aspect-ratio:145/200;object-fit:cover;margin-bottom:12px;}

/* News screen */
.news-screen{width:100%;padding-top:66px;}
.news-body{max-width:900px;margin:0 auto;padding:56px 24px 100px;}
.news-chips{display:flex;gap:10px;margin:36px 0 30px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);border-radius:75px;padding:9px 20px;font-size:13px;}
.chip.active{background:#000;color:#fff;animation:chipPulse .6s ease;}
.pin-banners{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:36px;}
.pin-banner{
  position:relative;height:150px;border-radius:0;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#101010,#3a2018 60%,#a02d25);
  background-size:200% 100%;
  padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
}
.pin-banner:hover{animation:bannerSheen 2.4s linear infinite;}
.news-list-row{display:flex;gap:20px;padding:24px 0;border-top:1px solid var(--border-soft);cursor:pointer;}
.news-list-row:last-child{border-bottom:1px solid var(--border-soft);}

/* About screen */
.about-screen{width:100%;padding-top:66px;}
.about-hero{padding:80px 40px 40px;max-width:900px;margin:0 auto;}
.about-subnav{display:flex;gap:24px;padding:0 40px;max-width:1078px;margin:0 auto 40px;border-bottom:1px solid var(--border-soft);}
.about-subnav button{padding:14px 0;font-size:13px;letter-spacing:.05em;border-bottom:2px solid transparent;}
.about-subnav button.on{border-color:#000;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1078px;margin:0 auto;padding:0 40px 80px;}
.stat-card{border-top:1px solid var(--border);padding-top:16px;}
.stat-num{font-size:clamp(32px,4vw,48px);font-weight:400;}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:6px;}
.inquiry-wrap{max-width:1078px;margin:0 auto;padding:0 40px 90px;display:grid;grid-template-columns:1fr 1fr;gap:60px;}
.inquiry-form{display:flex;flex-direction:column;gap:14px;}
.inquiry-form input,.inquiry-form textarea{border:none;border-bottom:1px solid var(--border);padding:12px 2px;font-size:15px;font-family:inherit;background:transparent;}
.inquiry-form textarea{resize:vertical;min-height:90px;}
.map-box{background:#111;color:#fff;height:100%;min-height:260px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.map-pin{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(160,45,37,.25);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:14px 26px;border-radius:75px;font-size:14px;z-index:200;animation:heroFade .3s ease;}

@media (max-width:860px){
  .topnav{padding:0 20px;}
  .nav-menu{display:none;}
  .hamburger-btn{display:flex;}
  .grid-3{grid-template-columns:1fr;}
  .card-grid{grid-template-columns:repeat(2,1fr);}
  .pub-strip{grid-template-columns:repeat(4,1fr);}
  .works-body{flex-direction:column;padding:36px 20px 70px;}
  .filter-rail{width:100%;position:static;display:flex;gap:18px;}
  .filter-item{border-bottom:none;padding:0;}
  .stat-grid{grid-template-columns:repeat(2,1fr);padding:0 20px 60px;}
  .inquiry-wrap{grid-template-columns:1fr;padding:0 20px 60px;}
  .section{padding:64px 20px;}
  .footer-inner{padding:0;}
}
</style>
</head>

function Icon({name,size=18,style}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[]);
  return <i data-lucide={name} style={{width:size,height:size,...style}} ref={ref}></i>;
}

function TopNav({view,setView,scrolled,onHamburger,onDark,joinActive}){
  return (
    <header className={"topnav " + (scrolled?"solid":"") + (onDark && !scrolled ? " on-dark":"")}>
      <div className="brand" onClick={()=>setView('main')} style={{cursor:'pointer'}}>
        <span className="brand-mark"></span>INKCRANE
      </div>
      <nav className="nav-menu">
        <button className={view==='works'?'active':''} onClick={()=>setView('works')}>WORKS</button>
        <button className={view==='news'?'active':''} onClick={()=>setView('news')}>NEWS</button>
        <button className={view==='about'?'active':''} onClick={()=>setView('about')}>ABOUT</button>
      </nav>
      <div className="nav-cta">
        {joinActive ? (
          <button className={"pill-btn " + (scrolled||!onDark ? "dark":"on-hero")} onClick={()=>setView('news-joinus')}>공모전·채용 소식</button>
        ) : (
          <a className={"pill-btn " + (scrolled||!onDark ? "dark":"on-hero")} href="mailto:people@inkcrane.studio">인재 채용 문의</a>
        )}
        <button className="hamburger-btn" onClick={onHamburger} aria-label="메뉴 열기">
          <Icon name="menu" size={24} style={{color: (onDark && !scrolled) ? '#fff':'#000'}}/>
        </button>
      </div>
    </header>
  );
}

function MobileMenu({setView,close}){
  return (
    <div className="mobile-menu">
      <button className="mobile-close" onClick={close}><Icon name="x" size={28} style={{color:'#fff'}}/></button>
      <button onClick={()=>{setView('works');close();}}>WORKS</button>
      <button onClick={()=>{setView('news');close();}}>NEWS</button>
      <button onClick={()=>{setView('about');close();}}>ABOUT</button>
    </div>
  );
}

function Intro({show}){
  if(!show) return null;

    <div className="intro-overlay">
      <span className="intro-line" style={{animationDelay:'.1s'}}>이야기가 태어나는 곳</span>
      <span className="intro-line" style={{animationDelay:'.55s'}}>INKCRANE</span>
    </div>
  );
}

function ScrollBadge(){

    <div className="scroll-badge">
      <svg viewBox="0 0 100 100" width="88" height="88">
        <defs>
          <path id="circlePath" d="M50,50 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0"/>
        </defs>
        <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.5)" strokeWidth="1"/>
        <text fontSize="7.4" letterSpacing="2" fill="#fff">
          <textPath href="#circlePath">SCROLL DOWN · SCROLL DOWN · </textPath>
        </text>

function App(){
  const [view,setView] = useState('main');
  const [showIntro,setShowIntro] = useState(true);
  const [scrolled,setScrolled] = useState(false);
  const [mobileOpen,setMobileOpen] = useState(false);
  const [activeWork,setActiveWork] = useState(null);
  const [activePub,setActivePub] = useState(null);
  const [pubPos,setPubPos] = useState({top:0,left:0});
  const [activeNews,setActiveNews] = useState(null);
  const [joinActive,setJoinActive] = useState(true);
  const [newsInitialCat,setNewsInitialCat] = useState('전체');
  const [toast,setToast] = useState(null);

  useEffect(()=>{
    if(sessionStorage.getItem('inkcrane_intro_seen')){
      setShowIntro(false);
    } else {
      sessionStorage.setItem('inkcrane_intro_seen','1');
      const t = setTimeout(()=>setShowIntro(false),3000);
      return ()=>clearTimeout(t);
    }
  },[]);

  useEffect(()=>{
    const onScroll = ()=>setScrolled(window.scrollY>80);
    window.addEventListener('scroll',onScroll);
    return ()=>window.removeEventListener('scroll',onScroll);
  },[]);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const changeView = (v)=>{
    setView(v==='news-joinus' ? 'news' : v);
    if(v==='news-joinus') setNewsInitialCat('JOIN US'); else setNewsInitialCat('전체');
    window.scrollTo({top:0});
  };

  const openPub = (pub,e)=>{
    const rect = e.currentTarget.getBoundingClientRect();
    setPubPos({top:Math.min(rect.top,window.innerHeight-320)+ 'px', left: Math.min(rect.left, window.innerWidth-260)+'px'});
    setActivePub(pub);
  };

  const showToast = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null),2200); };

  return (
    <div style={{width:'100%',minHeight:'100vh'}}>
      <Intro show={showIntro}/>
      <TopNav view={view} setView={changeView} scrolled={scrolled} onDark={view==='main' && !scrolled} onHamburger={()=>setMobileOpen(true)} joinActive={joinActive}/>
      {mobileOpen && <MobileMenu setView={changeView} close={()=>setMobileOpen(false)}/>}

      {view==='main' && <Home setView={changeView} joinActive={joinActive} setJoinActive={setJoinActive}/>}
      {view==='works' && <WorksScreen onOpenWork={setActiveWork} onOpenPub={openPub}/>}
      {view==='news' && <NewsScreen onOpenNews={setActiveNews} initialCat={newsInitialCat} onToast={showToast}/>}
      {view==='about' && <AboutScreen onToast={showToast}/>}

      {view!=='main' && (
        <footer className="footer">
          <div className="footer-inner">
            <div className="footer-col"><b>INKCRANE</b>서울특별시 마포구 성산로 128<br/>© 2026 샘플기업 인크레인 스튜디오 — 자체 개발 프로젝트</div>
            <div className="footer-col"><b>CONTACT</b>hello@inkcrane.studio<br/>02-000-0000</div>
            <div className="footer-col"><b>SOCIAL</b>Instagram · X · YouTube</div>
          </div>
        </footer>
      )}

      <WorkDrawer work={activeWork} onClose={()=>setActiveWork(null)} onToast={showToast}/>
      <PubPopover pub={activePub} pos={pubPos} onClose={()=>setActivePub(null)}/>
      <NewsDrawer news={activeNews} onClose={()=>setActiveNews(null)} onToast={showToast}/>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
