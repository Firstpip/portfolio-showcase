<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKCRANE Studio — 웹툰·출판 콘텐츠 CMS 관리자</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --primary:#0071e3;
  --secondary:#d6d6d6;
  --accent:#f61e1e;
  --bg:#ffffff;
  --canvas:#f5f5f7;
  --surface:#ffffff;
  --text-primary:#1d1d1f;
  --text-secondary:#707070;
  --border:#d6d6d6;
  --radius-card:28px;
  --radius-pill:980px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
input,select,textarea{font-family:inherit;}
img{display:block;max-width:100%;}

@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes progressFill{
  from{width:0%;}
  to{width:var(--fill,72%);}
}
@keyframes togglePop{
  0%{transform:scale(1);}
  40%{transform:scale(1.18);}
  100%{transform:scale(1);}
}
@keyframes toastSlide{
  from{opacity:0;transform:translate(-50%,10px);}
  to{opacity:1;transform:translate(-50%,0);}
}
@keyframes chevronRotate{
  from{transform:rotate(0deg);}
  to{transform:rotate(90deg);}
}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* ── sidebar ── */
.tree-sidebar{
  position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--canvas);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;overflow-y:auto;
}
.sidebar-brand{padding:18px 16px 10px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;}
.brand-dot{width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.sidebar-search{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px;}
.side-btn{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--text-secondary);
  background:#fff;border:1px solid var(--border);
}
.nav-section-label{padding:14px 16px 6px;font-size:11px;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;}
.app-nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;border-radius:10px;margin:0 8px;color:var(--text-primary);
}
.app-nav-item.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--primary);font-weight:600;}
.app-nav-item i{font-size:17px;}

.tree-nav{padding:6px 8px 20px;flex:1;}
.tree-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;font-size:13.5px;}
.tree-item:hover{background:rgba(0,0,0,.04);}
.tree-item.selected{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.tree-toggle{width:16px;font-size:10px;color:var(--text-secondary);transition:transform .2s ease;}
.tree-toggle.open{animation:chevronRotate .2s ease forwards;}
.tree-icon{font-size:14px;color:var(--text-secondary);}
.tree-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-count{font-size:11px;color:var(--text-secondary);}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);}
.sidebar-footer .side-btn{margin-top:8px;}

/* ── main wrap ── */
.main-wrap{margin-left:250px;flex:1;min-width:0;width:calc(100% - 250px);min-height:100vh;background:#fff;}
.topbar{
  height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);z-index:30;
}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-actions{display:flex;gap:10px;align-items:center;}

.pill-btn{
  border-radius:var(--radius-pill);padding:9px 20px;font-size:14px;font-weight:400;
  background:var(--primary);color:#fff;transition:opacity .2s;
}
.pill-btn:hover{opacity:.88;}
.pill-btn.ghost{background:transparent;border:1px solid var(--text-primary);color:var(--text-primary);}
.pill-btn.small{padding:6px 14px;font-size:12.5px;}
.icon-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.icon-btn:hover{background:var(--canvas);}

.page-content{max-width:1180px;margin:0 auto;padding:32px 28px 80px;animation:fadeSlideUp .4s ease;}

/* dashboard */
.hero-band{
  border-radius:var(--radius-card);padding:40px;color:#fff;margin-bottom:28px;
  background:linear-gradient(135deg,#1d1d1f 0%,#0071e3 68%,#3b8bf0 100%);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;
}
.hero-band h1{font-size:clamp(28px,4vw,56px);font-weight:600;margin:0 0 8px;letter-spacing:-.01em;}
.hero-band p{margin:0;font-size:15px;opacity:.85;max-width:460px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px;min-width:0;}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start;min-width:0;}
.dash-grid > *{min-width:0;}
.stat-card{background:var(--canvas);border-radius:var(--radius-card);padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0;overflow:hidden;}
.stat-num{font-size:32px;font-weight:600;}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px;}
.cat-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.cat-tab{padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;background:var(--canvas);flex:none;white-space:nowrap;}
.cat-tab.on{background:var(--text-primary);color:#fff;}
.recent-list{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;}
.recent-row{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);}
.recent-row:last-child{border-bottom:none;}
.recent-row:hover{background:var(--canvas);cursor:pointer;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;}
.status-dot.public{background:#1fae5e;}
.status-dot.draft{background:#b4b4b4;}
.status-dot.private{background:var(--accent);}
.badge-cat{font-size:11px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--canvas);color:var(--text-secondary);}

/* editor screen */
.editor-shell{display:flex;gap:0;}
.editor-canvas{flex:1;min-width:0;padding:32px 40px 100px;}
.page-breadcrumb{font-size:12.5px;color:var(--text-secondary);margin-bottom:18px;display:flex;gap:6px;align-items:center;}
.page-body{max-width:820px;margin:0 auto;}
.page-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.page-icon-large{font-size:40px;}
.page-meta{display:flex;gap:10px;}
.meta-action{font-size:12.5px;color:var(--text-secondary);padding:5px 10px;border-radius:8px;}
.meta-action:hover{background:var(--canvas);}
.page-title{font-size:34px;font-weight:600;margin:8px 0 20px;letter-spacing:-.01em;}

.block-list{display:flex;flex-direction:column;}
.block{position:relative;padding:5px 4px 5px 34px;border-radius:8px;}
.block:hover{background:rgba(0,113,227,.04);}
.block-handle,.block-add{position:absolute;left:4px;top:6px;font-size:13px;color:var(--text-secondary);opacity:0;width:14px;}
.block:hover .block-handle,.block:hover .block-add{opacity:1;}
.block-add{left:16px;}
.block p{margin:0;font-size:16px;line-height:1.6;}
.block h2{margin:22px 0 4px;font-size:24px;font-weight:600;}
.block-toggle .toggle-summary{font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px;}
.toggle-arrow{transition:transform .2s ease;font-size:12px;}
.toggle-arrow.open{transform:rotate(90deg);}
.toggle-content{padding:6px 0 6px 22px;font-size:14.5px;color:var(--text-secondary);line-height:1.6;}
.toggle-content.hidden{display:none;}
.block-callout{display:flex;gap:10px;background:#eef6ff;border-radius:12px;padding:14px 16px;align-items:flex-start;}
.callout-icon{font-size:18px;}
.callout-text{margin:0;font-size:14.5px;line-height:1.6;}
.block-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.block-2col img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;}
.block-2col .caption{font-size:12px;color:var(--text-secondary);margin-top:6px;}
.block-table table{width:100%;border-collapse:collapse;font-size:13.5px;}
.block-table td,.block-table th{border:1px solid var(--border);padding:8px 10px;text-align:left;}
.block-divider hr{border:none;border-top:1px solid var(--border);margin:18px 0;}
.block-image img{width:100%;border-radius:12px;}
.block-image .caption{font-size:12px;color:var(--text-secondary);margin-top:6px;}
.add-block-btn{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-secondary);padding:8px 12px;border-radius:8px;border:1px dashed var(--border);}
.add-block-btn:hover{background:var(--canvas);}

.slash-menu{
  position:fixed;z-index:80;background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.14);width:230px;padding:8px;
}
.slash-input{width:100%;border:none;border-bottom:1px solid var(--border);padding:8px 6px;font-size:13.5px;margin-bottom:6px;}
.slash-group-title{font-size:11px;color:var(--text-secondary);padding:6px 8px 2px;}
.slash-item{padding:8px;font-size:13.5px;border-radius:8px;display:flex;align-items:center;gap:8px;}
.slash-item:hover{background:var(--canvas);}

/* right inspector */
.inspector{width:300px;flex:none;border-left:1px solid var(--border);padding:24px 22px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.insp-title{font-size:13px;font-weight:600;margin-bottom:16px;letter-spacing:.02em;}
.insp-group{margin-bottom:22px;}
.insp-label{font-size:12px;color:var(--text-secondary);margin-bottom:8px;}
.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-select button{padding:6px 12px;border-radius:var(--radius-pill);font-size:12.5px;background:var(--canvas);}
.chip-select button.on{background:var(--primary);color:#fff;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.switch{width:38px;height:22px;border-radius:var(--radius-pill);background:var(--secondary);position:relative;transition:background .25s;}
.switch.on{background:#34c759;}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.19,1,.22,1);box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch.on .knob{left:18px;animation:togglePop .3s ease;}
.order-ctrl{display:flex;align-items:center;gap:8px;}
.order-ctrl button{width:26px;height:26px;border-radius:8px;background:var(--canvas);}
.linkbtn-row{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.linkbtn-row input{width:100%;border:none;border-bottom:1px solid var(--border);padding:6px 2px;font-size:12.5px;margin-top:6px;}
.linkbtn-row-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;}
.add-link-btn{font-size:12.5px;color:var(--primary);}

/* settings screen */
.settings-table{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;}
.settings-row{display:grid;grid-template-columns:1.4fr .7fr .7fr .5fr .8fr .9fr;gap:12px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border);font-size:13.5px;}
.settings-row.head{background:var(--canvas);font-size:12px;color:var(--text-secondary);}
.settings-row:last-child{border-bottom:none;}
.mini-switch{width:32px;height:18px;border-radius:var(--radius-pill);background:var(--secondary);position:relative;}
.mini-switch.on{background:#34c759;}
.mini-switch .k{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;}
.mini-switch.on .k{left:16px;}

/* media screen */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}
.media-card{border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;background:#fff;}
.media-thumb{width:100%;aspect-ratio:4/3;background:var(--canvas);position:relative;overflow:hidden;}
.media-thumb img{width:100%;height:100%;object-fit:cover;}
.media-info{padding:12px 14px;}
.media-name{font-size:13px;margin-bottom:6px;}
.derive-badges{display:flex;gap:6px;flex-wrap:wrap;}
.derive-badge{font-size:10.5px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--canvas);color:var(--text-secondary);}
.upload-drop{
  border:1.5px dashed var(--border);border-radius:var(--radius-card);padding:36px;text-align:center;color:var(--text-secondary);
  margin-bottom:24px;font-size:13.5px;
}
.progress-track{width:100%;height:6px;border-radius:6px;background:var(--canvas);margin-top:10px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);border-radius:6px;animation:progressFill 1.4s ease forwards;}
.spin-icon{animation:spin 1s linear infinite;display:inline-block;}

.toast{position:fixed;bottom:26px;left:50%;background:#1d1d1f;color:#fff;padding:12px 22px;border-radius:var(--radius-pill);font-size:13.5px;z-index:200;animation:toastSlide .3s ease forwards;}

.color-swatch-row{display:flex;gap:10px;margin-top:14px;}
.color-swatch{width:36px;height:36px;border-radius:12px;}

.mobile-sidebar-toggle{display:none;}
@media (max-width:900px){
  .tree-sidebar{width:250px;transform:translateX(-100%);transition:transform .25s cubic-bezier(.19,1,.22,1);z-index:100;}
  .tree-sidebar.mobile-open{transform:translateX(0);box-shadow:0 0 0 2000px rgba(0,0,0,.35);}
  .main-wrap{margin-left:0;width:100%;}
  .mobile-sidebar-toggle{display:flex;}
  .editor-shell{flex-direction:column;}
  .inspector{width:100%;position:static;height:auto;border-left:none;border-top:1px solid var(--border);}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:1fr;}
  .settings-row{grid-template-columns:1fr;gap:6px;}
}
</style>
</head>
<body data-archetype="notion-blocks-tree" data-portfolio="webtoon-cms-admin-demo">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const CONTENT = {
  WEBTOON:[
    {id:'wt1',title:'표류도시',status:'public',pinned:true,order:1,exposure:['WORKS'],seed:'cms-wt1'},
    {id:'wt2',title:'야간정원사',status:'public',pinned:false,order:2,exposure:['WORKS'],seed:'cms-wt2'},
    {id:'wt3',title:'여름의 온도',status:'public',pinned:false,order:3,exposure:['WORKS'],seed:'cms-wt3'},
    {id:'wt4',title:'클로저의 밤',status:'draft',pinned:false,order:4,exposure:['WORKS'],seed:'cms-wt4'},
  ],
  PUBLICATION:[
    {id:'pb1',title:'표류도시 1권',status:'public',pinned:false,order:1,exposure:['WORKS'],seed:'cms-pb1'},
    {id:'pb2',title:'단편 앤솔러지 Vol.2',status:'public',pinned:false,order:2,exposure:['WORKS'],seed:'cms-pb2'},
    {id:'pb3',title:'클로저의 밤 2권',status:'private',pinned:false,order:3,exposure:['WORKS'],seed:'cms-pb3'},
  ],
  NEWS:[
    {id:'n1',title:'표류도시 200화 돌파 기념 사인회 안내',status:'public',pinned:true,order:1,exposure:['NEWS'],seed:'cms-n1'},
    {id:'n2',title:'단편 앤솔러지 Vol.2 예약 판매 시작',status:'public',pinned:true,order:2,exposure:['NEWS'],seed:'cms-n2'},
    {id:'n4',title:'야간정원사 애니메이션 콜라보 예고',status:'draft',pinned:false,order:3,exposure:['NEWS'],seed:'cms-n4'},
  ],
  'JOIN US':[
    {id:'n3',title:'2026 하반기 스토리 공모전 접수 안내',status:'public',pinned:false,order:1,exposure:['NEWS'],seed:'cms-n3'},
  ],
};
const CATS = ['WEBTOON','PUBLICATION','NEWS','JOIN US'];

function flatten(){
  const out=[];
  CATS.forEach(c=>CONTENT[c].forEach(it=>out.push({...it,category:c})));
  return out;
}

function Icon({name,size=17,style}){
  return <i className={"ph ph-"+name} style={{fontSize:size,...style}}></i>;
}

function Sidebar({view,setView:setViewRaw,openTree,setOpenTree,selectItem,selectedId,onToast,mobileOpen,onCloseMobile}){
  const [searchOpen,setSearchOpen] = useState(false);
  const setView = (v)=>{ setViewRaw(v); onCloseMobile(); };
  return (
    <aside className={"tree-sidebar "+(mobileOpen?'mobile-open':'')}>
      <div className="sidebar-brand" style={{justifyContent:'space-between'}}>
        <span style={{display:'flex',alignItems:'center',gap:10}}><span className="brand-dot">IC</span>INKCRANE CMS</span>
        <button className="mobile-sidebar-toggle icon-btn" onClick={onCloseMobile} aria-label="메뉴 닫기"><Icon name="x" size={16}/></button>
      </div>
      <div className="sidebar-search">
        <button className="side-btn" onClick={()=>setSearchOpen(!searchOpen)}><Icon name="magnifying-glass" size={14}/>빠른 검색</button>
        {searchOpen && <input autoFocus placeholder="제목으로 검색" style={{width:'100%',border:'1px solid var(--border)',borderRadius:8,padding:'7px 10px',fontSize:12.5}}/>}
        <button className="side-btn" onClick={()=>{setView('editor');onToast('새 콘텐츠 초안이 생성되었습니다');}}><Icon name="plus" size={14}/>새 콘텐츠</button>
      </div>

      <div className="nav-section-label">WORKSPACE</div>
      <div className={"app-nav-item "+(view==='main'?'on':'')} onClick={()=>setView('main')}><Icon name="squares-four"/>통합 콘텐츠 대시보드</div>
      <div className={"app-nav-item "+(view==='editor'?'on':'')} onClick={()=>setView('editor')}><Icon name="text-columns"/>자유형 블록 편집기</div>
      <div className={"app-nav-item "+(view==='settings'?'on':'')} onClick={()=>setView('settings')}><Icon name="sliders-horizontal"/>노출 설정 관리</div>
      <div className={"app-nav-item "+(view==='media'?'on':'')} onClick={()=>setView('media')}><Icon name="images"/>미디어 라이브러리</div>

      <div className="nav-section-label">콘텐츠 트리</div>
      <nav className="tree-nav">
        <div className="tree-item" onClick={()=>setOpenTree(o=>({...o,root:!o.root}))}>
          <span className={"tree-toggle "+(openTree.root?'open':'')}>{openTree.root?'▾':'▸'}</span>
          <span className="tree-icon"><Icon name="folder" size={14}/></span>
          <span className="tree-label">콘텐츠 전체</span>
        </div>
        {openTree.root && CATS.map(cat=>(
          <React.Fragment key={cat}>
            <div className="tree-item" style={{paddingLeft:28}} onClick={()=>setOpenTree(o=>({...o,[cat]:!o[cat]}))}>
              <span className={"tree-toggle "+(openTree[cat]?'open':'')}>{openTree[cat]?'▾':'▸'}</span>
              <span className="tree-icon"><Icon name="folder-simple" size={14}/></span>
              <span className="tree-label">{cat}</span>
              <span className="tree-count">{CONTENT[cat].length}</span>
            </div>
            {openTree[cat] && CONTENT[cat].map(it=>(
              <div key={it.id} className={"tree-item "+(selectedId===it.id?'selected':'')} style={{paddingLeft:56}}
                onClick={()=>{selectItem(it.id,cat);setView('editor');}}>
                <span className="tree-toggle"></span>
                <span className="tree-icon"><Icon name="file-text" size={13}/></span>
                <span className="tree-label">{it.title}</span>
              </div>
            ))}
          </React.Fragment>
        ))}
      </nav>

      <div className="sidebar-footer">
        <div style={{fontSize:11.5,color:'#707070'}}>© 2026 샘플기업 인크레인 스튜디오</div>
        <button className="side-btn" onClick={()=>onToast('워크스페이스 설정을 엽니다')}><Icon name="gear" size={14}/>설정</button>
      </div>
    </aside>
  );
}

function TopBar({title,children,onMenu}){
  return (
    <div className="topbar">
      <div style={{display:'flex',alignItems:'center',gap:10}}>

function Inspector({item,onToast}){
  const [category,setCategory] = useState(item.category);
  const [exposure,setExposure] = useState(item.exposure||[]);
  const [pinned,setPinned] = useState(item.pinned);
  const [order,setOrder] = useState(item.order||1);
  const [links,setLinks] = useState([
    {label:'작품 보러가기',url:'#',target:'_self',enabled:true},
    {label:'구매하러 가기',url:'#',target:'_blank',enabled:false},
  ]);

  const toggleExposure = (v)=> setExposure(e=> e.includes(v) ? e.filter(x=>x!==v) : [...e,v]);
  const toggleLink = (idx)=> setLinks(ls=> ls.map((l,i)=> i===idx? {...l,enabled:!l.enabled}: l));

  return (
    <aside className="inspector">
      <div className="insp-title">노출 설정</div>

      <div className="insp-group">
        <div className="insp-label">카테고리</div>
        <div className="chip-select">

        </div>
      </div>

      <div className="insp-group">
        <div className="insp-label">노출 위치</div>
        <div className="chip-select">
          {['WORKS','NEWS'].map(v=>(<button key={v} className={exposure.includes(v)?'on':''} onClick={()=>toggleExposure(v)}>{v}</button>))}
        </div>
      </div>

      <div className="insp-group">
        <div className="toggle-row">
          <span className="insp-label" style={{marginBottom:0}}>상단 고정</span>
          <span className={"switch "+(pinned?'on':'')} onClick={()=>{setPinned(!pinned);onToast(pinned?'상단 고정이 해제되었습니다':'목록 최상단으로 고정되었습니다');}}><span className="knob"></span></span>
        </div>
        <div className="toggle-row">
          <span className="insp-label" style={{marginBottom:0}}>노출 순서</span>
          <div className="order-ctrl">
            <button onClick={()=>setOrder(o=>Math.max(1,o-1))}><Icon name="caret-up" size={12}/></button>
            <span style={{fontSize:13}}>{order}</span>
            <button onClick={()=>setOrder(o=>o+1)}><Icon name="caret-down" size={12}/></button>
          </div>
        </div>
      </div>

      <div className="insp-group">
        <div className="insp-label">링크 버튼 (최대 2개)</div>
        {links.map((l,i)=>(
          <div key={i} className="linkbtn-row">
            <div className="linkbtn-row-head">
              <span>{l.label}</span>
              <span className={"mini-switch "+(l.enabled?'on':'')} onClick={()=>toggleLink(i)}><span className="k"></span></span>
            </div>
            {l.enabled && (
              <React.Fragment>
                <input defaultValue={l.url} placeholder="링크 URL"/>
                <div style={{display:'flex',gap:8,marginTop:6,fontSize:11.5,color:'#707070'}}>
                  <label><input type="checkbox" defaultChecked={l.target==='_blank'} style={{marginRight:4}}/>새 창 열기</label>
                </div>
              </React.Fragment>
            )}
          </div>
        ))}
        <button className="add-link-btn" disabled={links.length>=2}>+ 버튼 추가</button>
      </div>

      <button className="pill-btn" style={{width:'100%'}} onClick={()=>onToast('노출 설정이 저장되었습니다')}>변경사항 저장</button>
    </aside>
  );
}

function SettingsScreen({selectItem,setView,onToast}){
  const [items,setItems] = useState(flatten().map(it=>({...it,links:[
    {label:'작품 보러가기',url:'#',target:'_self',enabled:true},
    {label:'구매하러 가기',url:'#',target:'_blank',enabled:it.category!=='NEWS'},
  ]})));
  const [expandedId,setExpandedId] = useState(null);
  const move = (id,dir)=> setItems(list=> list.map(it=> it.id===id? {...it,order: Math.max(1,it.order+dir)}: it));
  const togglePin = (id)=> setItems(list=> list.map(it=> it.id===id? {...it,pinned:!it.pinned}: it));
  const toggleLink = (id,idx)=> setItems(list=> list.map(it=> it.id===id? {...it,links: it.links.map((l,i)=> i===idx? {...l,enabled:!l.enabled}: l)}: it));
  return (
    <div className="page-content">
      <h2 style={{fontSize:24,fontWeight:600,marginBottom:6}}>노출 설정 관리</h2>
      <p style={{color:'#707070',fontSize:14,marginBottom:22}}>카테고리·노출 위치·상단 고정·순서·조건부 링크 버튼을 목록에서 바로 조정합니다.</p>

        {items.map(it=>(
          <React.Fragment key={it.id}>
            <div className="settings-row">
              <span style={{cursor:'pointer'}} onClick={()=>{selectItem(it.id,it.category);setView('editor');}}>{it.title}</span>
              <span className="badge-cat">{it.category}</span>
              <span><span className={"status-dot "+it.status}></span>{it.status==='public'?'공개':it.status==='draft'?'초안':'비공개'}</span>
              <span className={"mini-switch "+(it.pinned?'on':'')} onClick={()=>{togglePin(it.id);onToast('고정 상태가 변경되었습니다');}}><span className="k"></span></span>
              <div className="order-ctrl">
                <button onClick={()=>move(it.id,-1)}><Icon name="caret-up" size={11}/></button>
                <span style={{fontSize:12.5}}>{it.order}</span>
                <button onClick={()=>move(it.id,1)}><Icon name="caret-down" size={11}/></button>
              </div>
              <button className="badge-cat" onClick={()=>setExpandedId(expandedId===it.id?null:it.id)}>
                {it.links.filter(l=>l.enabled).length}/2 개 <Icon name={expandedId===it.id?'caret-up':'caret-down'} size={11} style={{marginLeft:4}}/>
              </button>
            </div>
            {expandedId===it.id && (
              <div style={{padding:'14px 22px',background:'var(--canvas)',borderBottom:'1px solid var(--border)'}}>
                {it.links.map((l,i)=>(
                  <div key={i} className="linkbtn-row" style={{background:'#fff'}}>
                    <div className="linkbtn-row-head">
                      <span>{l.label}</span>
                      <span className={"mini-switch "+(l.enabled?'on':'')} onClick={()=>toggleLink(it.id,i)}><span className="k"></span></span>
                    </div>
                    {l.enabled && (
                      <React.Fragment>
                        <input defaultValue={l.url} placeholder="링크 URL"/>
                        <label style={{fontSize:11.5,color:'#707070',display:'block',marginTop:6}}>
                          <input type="checkbox" defaultChecked={l.target==='_blank'} style={{marginRight:4}}/>새 창 열기

                      </React.Fragment>
                    )}
                  </div>
                ))}

            )}

        ))}
      </div>
    </div>
  );
}

  const selectItem = (id,cat)=>{ setSelectedId(id); setSelectedCat(cat); };
  const item = {...(CONTENT[selectedCat].find(i=>i.id===selectedId)), category:selectedCat};

  const showToast = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null),2200); };

  const titles = {main:'통합 콘텐츠 대시보드',editor:'자유형 블록 편집기',settings:'노출 설정 관리',media:'미디어 라이브러리'};

  return (
    <div className="app-shell">
      <Sidebar view={view} setView={setView} openTree={openTree} setOpenTree={setOpenTree} selectItem={selectItem} selectedId={selectedId} onToast={showToast} mobileOpen={sidebarOpen} onCloseMobile={()=>setSidebarOpen(false)}/>
      <div className="main-wrap">
        <TopBar title={titles[view]} onMenu={()=>setSidebarOpen(true)}>
          {view==='editor' && <button className="pill-btn ghost" onClick={()=>showToast('미리보기를 새 창에서 확인합니다')}>미리보기</button>}
          <button className="pill-btn" onClick={()=>showToast('저장되었습니다')}>저장</button>
        </TopBar>

        {view==='main' && <Dashboard selectItem={selectItem} setView={setView}/>}
        {view==='editor' && (
          <div className="editor-shell">
            <Editor item={item} onToast={showToast}/>
            <Inspector item={item} onToast={showToast}/>
          </div>
        )}
        {view==='settings' && <SettingsScreen selectItem={selectItem} setView={setView} onToast={showToast}/>}
        {view==='media' && <MediaScreen onToast={showToast}/>}
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
