<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서베이렌즈 통계 분석 시스템 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --ink:#101010;
  --graphite:#242424;
  --slate:#6b7280;
  --stone:#898989;
  --silver:#e5e7eb;
  --paper:#f4f4f4;
  --white:#ffffff;
  --action-blue:#0099ff;
  --accent:#3ad98a;
  --accent-dark:#1e9e64;
  --red:#d64545;
  --amber:#c98a1a;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--paper);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--graphite);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--white);border-right:1px solid var(--silver);padding:20px 12px;overflow-y:auto;z-index:20;display:flex;flex-direction:column;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--silver);margin-bottom:16px;}
.sidebar-brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sidebar-brand-name{font-size:15px;font-weight:600;letter-spacing:0.01em;}
.sidebar-brand-sub{font-size:11px;color:var(--stone);}
.sidebar-section{margin-bottom:20px;}
.sidebar-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--stone);padding:0 8px;margin-bottom:8px;font-weight:600;}
.sidebar-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--graphite);line-height:1.3;margin-bottom:2px;transition:background .15s;}
.sidebar-link i{width:16px;height:16px;flex-shrink:0;color:var(--stone);}
.sidebar-link:hover{background:var(--paper);}
.sidebar-link.active{background:var(--ink);color:var(--white);font-weight:600;}
.sidebar-link.active i{color:var(--white);}
.sidebar-footer{margin-top:auto;padding:12px;border-radius:10px;background:var(--paper);font-size:11px;color:var(--stone);}
.sidebar-footer strong{color:var(--graphite);display:block;font-size:12px;margin-bottom:2px;}

/* main */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:28px 36px 80px;}
.view-fade{animation:fadeIn .3s ease both;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:4px;}
.page-title{font-size:32px;font-weight:600;letter-spacing:-0.01em;}
.page-desc{color:var(--slate);font-size:13.5px;margin-top:6px;max-width:620px;line-height:1.5;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}
.page-meta{font-size:12px;color:var(--stone);margin-top:10px;display:flex;align-items:center;gap:6px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulseDot 1.6s ease infinite;display:inline-block;}

.btn-primary{background:var(--ink);color:var(--white);border-radius:9999px;padding:10px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:opacity .15s;}
.btn-primary:hover{opacity:.85;}
.btn-primary i{width:15px;height:15px;}
.btn-ghost{background:transparent;border:1px solid var(--silver);color:var(--graphite);border-radius:9999px;padding:9px 18px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;transition:background .15s;}
.btn-ghost:hover{background:var(--paper);}
.btn-ghost i{width:14px;height:14px;}
.btn-sm{padding:6px 14px;font-size:12.5px;border-radius:9999px;background:var(--paper);color:var(--graphite);font-weight:600;border:1px solid var(--silver);}
.btn-sm.on{background:var(--ink);color:var(--white);border-color:var(--ink);}
.btn-sm.danger{color:var(--red);}
.icon-btn{width:34px;height:34px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--slate);flex-shrink:0;}
.icon-btn:hover{background:var(--silver);}
.icon-btn i{width:16px;height:16px;}

.stat-row{display:flex;gap:14px;margin:22px 0 24px;}
.stat-card{flex:1;background:var(--white);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;min-height:100px;box-shadow:0 4px 8px rgba(36,36,36,.05);animation:slideUp .35s ease both;transition:transform .18s ease;}
.stat-card:hover{transform:scale(1.02);}
.stat-label{font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.stat-value{font-size:32px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12px;color:var(--accent-dark);font-weight:600;}
.stat-sub.down{color:var(--red);}
.stat-sparkline{position:absolute;right:16px;bottom:16px;width:70px;height:28px;opacity:.8;}

.content-row{display:flex;gap:16px;align-items:stretch;}
.content-main{flex:1;min-width:0;background:var(--white);border-radius:12px;padding:20px 22px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.kpi-side{width:296px;flex-shrink:0;background:var(--white);border-radius:12px;padding:18px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.rail-title{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.rail-title i{width:16px;height:16px;color:var(--red);}
.rail-sub{font-size:11.5px;color:var(--stone);margin-bottom:14px;}
.rail-item{border:1px solid var(--silver);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:background .15s,transform .15s;cursor:pointer;}
.rail-item:hover{background:var(--paper);transform:translateX(2px);}
.rail-item-name{font-size:12.5px;font-weight:600;margin-bottom:3px;}
.rail-item-reason{font-size:11.5px;color:var(--red);margin-bottom:8px;}
.rail-item-foot{display:flex;justify-content:space-between;align-items:center;}
.rail-item-count{font-size:11px;color:var(--stone);}

.tab-bar{display:flex;gap:20px;border-bottom:1px solid var(--silver);margin-bottom:16px;}
.tab{padding:9px 2px;font-size:13.5px;color:var(--stone);border-bottom:2px solid transparent;transition:.2s;font-weight:500;}
.tab.active{color:var(--ink);border-color:var(--accent-dark);font-weight:700;}

.chart-wrap{position:relative;height:260px;width:100%;}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
.widget-card{background:var(--white);border-radius:12px;padding:16px 18px;box-shadow:0 4px 8px rgba(36,36,36,.05);animation:slideUp .35s ease both;}
.widget-title{font-size:12.5px;font-weight:700;margin-bottom:10px;color:var(--graphite);display:flex;align-items:center;gap:6px;}
.widget-title i{width:14px;height:14px;color:var(--slate);}
.widget-chart{height:150px;position:relative;}
.timeline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper);font-size:12px;}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-dark);margin-top:5px;flex-shrink:0;}
.timeline-text{color:var(--graphite);flex:1;}
.timeline-time{color:var(--stone);font-size:11px;white-space:nowrap;}

.section-block{margin-top:28px;}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section-title{font-size:18px;font-weight:600;}

.data-toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:8px;padding:8px 12px;flex:1;min-width:200px;max-width:320px;}
.search-box i{width:15px;height:15px;color:var(--stone);}
.search-box input{background:none;border:none;outline:none;font-size:13px;width:100%;color:var(--graphite);}
.filter-chip{padding:7px 14px;border-radius:9999px;font-size:12.5px;background:var(--paper);color:var(--slate);border:1px solid transparent;font-weight:500;}
.filter-chip.active{background:var(--ink);color:var(--white);}
.export-btn{margin-left:auto;}

.data-table-wrap{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);padding:12px 16px;border-bottom:1px solid var(--silver);font-weight:600;background:var(--paper);}
.data-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--paper);color:var(--graphite);}
.data-table tr.tbl-row{cursor:pointer;transition:background .12s;}
.data-table tr.tbl-row:hover{background:var(--paper);}
.data-table tr:last-child td{border-bottom:none;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;}
.badge-wait{background:var(--paper);color:var(--slate);}
.badge-processing{background:#e8f2ff;color:var(--action-blue);}
.badge-done{background:#e4faf0;color:var(--accent-dark);}
.badge-error{background:#fce8e8;color:var(--red);}

.upload-drop{border:1.5px dashed var(--silver);border-radius:12px;padding:40px 20px;text-align:center;background:var(--white);transition:border-color .15s,background .15s;cursor:pointer;}
.upload-drop:hover,.upload-drop.drag{border-color:var(--ink);background:var(--paper);}
.upload-drop i{width:34px;height:34px;color:var(--stone);margin-bottom:10px;}
.upload-drop-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.upload-drop-sub{font-size:12px;color:var(--stone);}

.upload-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:18px;}
.upload-card{background:var(--white);border-radius:10px;padding:14px;box-shadow:0 4px 8px rgba(36,36,36,.05);animation:slideUp .3s ease both;}
.upload-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.upload-card-name{font-size:12.5px;font-weight:600;line-height:1.4;word-break:break-all;}
.upload-progress-track{height:5px;background:var(--paper);border-radius:4px;overflow:hidden;margin-top:10px;}
.upload-progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}

.analysis-layout{display:flex;gap:16px;align-items:flex-start;}
.q-list{width:280px;flex-shrink:0;background:var(--white);border-radius:12px;padding:14px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.q-item{padding:11px 12px;border-radius:8px;font-size:12.5px;margin-bottom:4px;transition:background .15s;line-height:1.4;}
.q-item:hover{background:var(--paper);}
.q-item.active{background:var(--ink);color:var(--white);font-weight:600;}
.q-item-meta{font-size:11px;color:var(--stone);margin-top:3px;}
.q-item.active .q-item-meta{color:var(--silver);}
.analysis-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.stat-summary-row{display:flex;gap:12px;}
.mini-stat{flex:1;background:var(--white);border-radius:10px;padding:14px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.mini-stat-label{font-size:11px;color:var(--stone);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.mini-stat-value{font-size:22px;font-weight:700;}
.result-card{background:var(--white);border-radius:12px;padding:18px 20px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.result-card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.result-card-title i{width:16px;height:16px;color:var(--accent-dark);}
.group-select-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.group-select-row select{padding:8px 12px;border-radius:8px;border:1px solid var(--silver);font-size:12.5px;background:var(--white);color:var(--graphite);}
.test-result-box{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.test-result-item{display:flex;flex-direction:column;gap:2px;}
.test-result-item-label{font-size:11px;color:var(--stone);}
.test-result-item-value{font-size:20px;font-weight:700;}
.sig-badge{padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:700;}
.sig-badge.sig{background:#e4faf0;color:var(--accent-dark);}
.sig-badge.nonsig{background:var(--paper);color:var(--slate);}

.settings-grid{display:flex;flex-direction:column;gap:16px;max-width:680px;}
.settings-card{background:var(--white);border-radius:12px;padding:20px 22px;box-shadow:0 4px 8px rgba(36,36,36,.05);}
.settings-card-title{font-size:14.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.settings-card-title i{width:16px;height:16px;color:var(--slate);}
.settings-card-desc{font-size:12px;color:var(--stone);margin-bottom:16px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--paper);}
.settings-row:first-of-type{border-top:none;}
.settings-row-label{font-size:13px;font-weight:500;}
.settings-row-desc{font-size:11.5px;color:var(--stone);margin-top:2px;}
.toggle{width:40px;height:22px;border-radius:9999px;background:var(--silver);position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent-dark);}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:var(--white);position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{left:20px;}
.settings-input{padding:9px 12px;border-radius:8px;border:1px solid var(--silver);font-size:13px;width:100%;color:var(--graphite);background:var(--paper);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
.modal-box{background:var(--white);border-radius:14px;width:560px;max-width:100%;max-height:86vh;overflow-y:auto;padding:24px 26px;animation:fadeInScale .2s ease both;box-shadow:0 20px 50px rgba(16,16,16,.25);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:9999px;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close i{width:15px;height:15px;}
.modal-field-row{display:flex;gap:16px;margin-bottom:12px;}
.modal-field{flex:1;}
.modal-field-label{font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.modal-field-value{font-size:13.5px;font-weight:500;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.compare-pane{border:1px solid var(--silver);border-radius:10px;padding:14px;}
.compare-pane-title{font-size:11px;color:var(--stone);text-transform:uppercase;margin-bottom:10px;font-weight:600;}
.scan-preview{width:100%;height:140px;background:var(--paper);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--stone);}
.scan-preview i{width:36px;height:36px;}
.compare-field{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--paper);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--white);padding:12px 18px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,.2);}
.toast i{width:15px;height:15px;color:var(--accent);}

@media (max-width: 900px){
  .content-row{flex-direction:column;}
  .kpi-side{width:100%;}
  .widget-grid{grid-template-columns:1fr;}
  .analysis-layout{flex-direction:column;}
  .q-list{width:100%;}
  .compare-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {AreaChart, Area, LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid} = Recharts;

const NAV = [
  {group:'조사 운영', items:[
    {key:'main', label:'개요', icon:'layout-dashboard'},
    {key:'upload', label:'설문지 업로드', icon:'upload-cloud'},
    {key:'survey-list', label:'설문지 관리', icon:'folder-clock'},
  ]},
  {group:'분석', items:[
    {key:'analysis', label:'통계 분석', icon:'flask-conical'},
  ]},
  {group:'환경설정', items:[
    {key:'settings', label:'설정', icon:'settings'},
  ]},
];

const TREND_DATA = [
  {d:'7/01', ocr:12, stat:8}, {d:'7/03', ocr:18, stat:11}, {d:'7/05', ocr:15, stat:14},
  {d:'7/07', ocr:24, stat:17}, {d:'7/09', ocr:29, stat:22}, {d:'7/11', ocr:26, stat:24},
  {d:'7/13', ocr:34, stat:27}, {d:'7/15', ocr:31, stat:29}, {d:'7/17', ocr:38, stat:33},
  {d:'7/19', ocr:42, stat:36}, {d:'7/21', ocr:40, stat:38}, {d:'7/23', ocr:47, stat:41},
  {d:'7/25', ocr:51, stat:45}, {d:'7/27', ocr:49, stat:47}, {d:'7/29', ocr:55, stat:52},
];

const ACCURACY_DATA = TREND_DATA.map((r,i)=>({d:r.d, rate: 82 + Math.round(Math.sin(i/2)*3) + i*0.4}));

const DONUT_DATA = [
  {name:'유의미(p<0.05)', value:22, color:'#3ad98a'},
  {name:'비유의미', value:14, color:'#e5e7eb'},
];

const TYPE_BAR = [
  {name:'서술형', value:38}, {name:'숫자', value:52}, {name:'체크박스', value:64}, {name:'손글씨', value:29},
];

const TIMELINE = [
  {t:'10분 전', text:'서울권 청년정책 설문지 42건 OCR 처리 완료'},
  {t:'32분 전', text:'문항 7 정규성 검사 자동 재실행 완료 (Shapiro-Wilk)'},
  {t:'1시간 전', text:'경기북부 보건인식조사 배치 118건 업로드 접수'},
  {t:'2시간 전', text:'문항 3 t-test 결과 갱신 (p=0.031, 유의미)'},
];

const PRIORITY_QUEUE = [
  {id:1, name:'경기북부_보건인식_042.pdf', reason:'손글씨 신뢰도 61% — 검수 필요', count:3},
  {id:2, name:'서울청년정책_응답지_118.pdf', reason:'체크박스 중복 표기 감지', count:2},
  {id:3, name:'전남지역_고령층_027.pdf', reason:'숫자 항목 인식 신뢰도 58%', count:5},
];

const SURVEY_ROWS = [

function Sparkline({data, color}){
  const pts = data.map((v,i)=> `${(i/(data.length-1))*70},${28 - (v/Math.max(...data))*24}`).join(' ');
  return (
    <svg className="stat-sparkline" viewBox="0 0 70 28" preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

function UploadView({addToast}){
  const [files, setFiles] = useState([
    {id:1, name:'서울권_청년정책_설문_042.pdf', status:'done', progress:100},
    {id:2, name:'경기북부_보건인식_118.pdf', status:'processing', progress:64},
  ]);
  const [drag, setDrag] = useState(false);

  function simulateUpload(){
    const id = Date.now();
    const name = `설문지_스캔본_${String(files.length+1).padStart(3,'0')}.pdf`;
    setFiles(f => [{id, name, status:'processing', progress:8}, ...f]);
    let p = 8;
    const timer = setInterval(()=>{
      p += 22;
      if (p >= 100){
        p = 100;
        clearInterval(timer);
        setFiles(f => f.map(x => x.id===id ? {...x, status:'done', progress:100} : x));
        addToast(`${name} OCR 처리가 완료되었습니다`);
      } else {
        setFiles(f => f.map(x => x.id===id ? {...x, progress:p} : x));
      }
    }, 450);
  }

  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">설문지 업로드</div>
          <div className="page-desc">스캔된 설문지 PDF/이미지를 일괄 업로드하면 외부 AI OCR API 연동으로 텍스트·숫자·체크박스·손글씨 응답까지 자동 인식해 정형 데이터로 변환합니다.</div>
        </div>
        <div className="page-actions">
          <button className="btn-primary" onClick={simulateUpload}><i data-lucide="plus"></i> 일괄 업로드 시작</button>
        </div>
      </div>

      <div className="upload-drop"
        onClick={simulateUpload}
        onDragOver={e=>{e.preventDefault(); setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault(); setDrag(false); simulateUpload();}}
        style={drag ? {borderColor:'#101010', background:'#f4f4f4'} : {}}
      >
        <i data-lucide="upload-cloud"></i>
        <div className="upload-drop-title">여기로 파일을 드래그하거나 클릭해 업로드</div>
        <div className="upload-drop-sub">PDF, JPG, PNG · 최대 200장 일괄 처리 지원</div>
      </div>

      <div className="upload-card-grid">
        {files.map(f => (
          <div className="upload-card" key={f.id}>
            <div className="upload-card-head">
              <div className="upload-card-name">{f.name}</div>
              <span className={"badge " + STATUS_CLASS[f.status]}>{STATUS_LABEL[f.status]}</span>
            </div>
            <div className="upload-progress-track"><div className="upload-progress-fill" style={{width:f.progress+'%'}}></div></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AnalysisView(){
  const [activeQ, setActiveQ] = useState(QUESTIONS[2]);
  const [groupA, setGroupA] = useState('서울권');
  const [groupB, setGroupB] = useState('경기권');
  const [result, setResult] = useState({p:0.031, t:2.41, sig:true});
  const [running, setRunning] = useState(false);

  function runTest(){
    setRunning(true);
    setTimeout(()=>{
      const p = Math.round(Math.random()*80)/1000 + 0.005;
      setResult({p, t: (1.8 + Math.random()*1.5).toFixed(2), sig: p < 0.05});
      setRunning(false);
    }, 900);
  }

  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">통계 분석</div>
          <div className="page-desc">문항별 응답 데이터의 평균·표준편차 산출은 물론 t-test, ANOVA, 정규성 검사를 자동 수행하고 해석 가능한 형태로 제공합니다.</div>
        </div>
      </div>

      <div className="analysis-layout" style={{marginTop:'20px'}}>
        <div className="q-list">
          {QUESTIONS.map(q => (
            <div className={"q-item" + (activeQ.id===q.id ? ' active':'')} key={q.id} onClick={()=>setActiveQ(q)}>
              <div>{q.label}</div>
              <div className="q-item-meta">응답 {q.n}건</div>
            </div>
          ))}
        </div>
        <div className="analysis-main">
          <div className="stat-summary-row">
            <div className="mini-stat"><div className="mini-stat-label">평균</div><div className="mini-stat-value">3.42</div></div>
            <div className="mini-stat"><div className="mini-stat-label">표준편차</div><div className="mini-stat-value">0.87</div></div>
            <div className="mini-stat"><div className="mini-stat-label">응답 수</div><div className="mini-stat-value">{activeQ.n}</div></div>
            <div className="mini-stat"><div className="mini-stat-label">정규성(Shapiro-Wilk)</div><div className="mini-stat-value" style={{fontSize:'15px',color:'#3ad98a'}}>정규분포 만족</div></div>
          </div>

          <div className="result-card">
            <div className="result-card-title"><i data-lucide="split"></i> 그룹 간 비교 검정</div>
            <div className="group-select-row">
              <select value={groupA} onChange={e=>setGroupA(e.target.value)}>
                <option>서울권</option><option>경기권</option><option>충청권</option>
              </select>
              <span style={{color:'#898989', fontSize:'12.5px'}}>vs</span>
              <select value={groupB} onChange={e=>setGroupB(e.target.value)}>
                <option>경기권</option><option>서울권</option><option>전라권</option>
              </select>
              <button className="btn-primary" onClick={runTest} disabled={running}>
                <i data-lucide="play"></i> {running ? '검정 실행 중…' : '검정 실행'}
              </button>
            </div>
            <div className="test-result-box">
              <div className="test-result-item"><div className="test-result-item-label">t-value</div><div className="test-result-item-value">{result.t}</div></div>
              <div className="test-result-item"><div className="test-result-item-label">p-value</div><div className="test-result-item-value">{result.p}</div></div>
              <span className={"sig-badge " + (result.sig ? 'sig':'nonsig')}>{result.sig ? '유의미한 차이 (p<0.05)' : '유의미하지 않음'}</span>

            {rows[1] && (<tr className="tbl-row" onClick={()=>setSelected(rows[1])}><td>{rows[1].name}</td><td>{rows[1].uploaded}</td><td>{rows[1].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[1].status]}>{STATUS_LABEL[rows[1].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[2] && (<tr className="tbl-row" onClick={()=>setSelected(rows[2])}><td>{rows[2].name}</td><td>{rows[2].uploaded}</td><td>{rows[2].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[2].status]}>{STATUS_LABEL[rows[2].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[3] && (<tr className="tbl-row" onClick={()=>setSelected(rows[3])}><td>{rows[3].name}</td><td>{rows[3].uploaded}</td><td>{rows[3].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[3].status]}>{STATUS_LABEL[rows[3].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[4] && (<tr className="tbl-row" onClick={()=>setSelected(rows[4])}><td>{rows[4].name}</td><td>{rows[4].uploaded}</td><td>{rows[4].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[4].status]}>{STATUS_LABEL[rows[4].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[5] && (<tr className="tbl-row" onClick={()=>setSelected(rows[5])}><td>{rows[5].name}</td><td>{rows[5].uploaded}</td><td>{rows[5].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[5].status]}>{STATUS_LABEL[rows[5].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[6] && (<tr className="tbl-row" onClick={()=>setSelected(rows[6])}><td>{rows[6].name}</td><td>{rows[6].uploaded}</td><td>{rows[6].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[6].status]}>{STATUS_LABEL[rows[6].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[7] && (<tr className="tbl-row" onClick={()=>setSelected(rows[7])}><td>{rows[7].name}</td><td>{rows[7].uploaded}</td><td>{rows[7].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[7].status]}>{STATUS_LABEL[rows[7].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[8] && (<tr className="tbl-row" onClick={()=>setSelected(rows[8])}><td>{rows[8].name}</td><td>{rows[8].uploaded}</td><td>{rows[8].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[8].status]}>{STATUS_LABEL[rows[8].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[9] && (<tr className="tbl-row" onClick={()=>setSelected(rows[9])}><td>{rows[9].name}</td><td>{rows[9].uploaded}</td><td>{rows[9].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[9].status]}>{STATUS_LABEL[rows[9].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
            {rows[10] && (<tr className="tbl-row" onClick={()=>setSelected(rows[10])}><td>{rows[10].name}</td><td>{rows[10].uploaded}</td><td>{rows[10].respondents}명</td><td><span className={"badge " + STATUS_CLASS[rows[10].status]}>{STATUS_LABEL[rows[10].status]}</span></td><td><i data-lucide="chevron-right" style={{width:'15px',height:'15px',color:'#898989'}}></i></td></tr>)}
          </tbody>
        </table>
      </div>

      {selected && (
        <Modal title={selected.name} onClose={()=>setSelected(null)}>
          <div className="modal-field-row">

            <div className="modal-field"><div className="modal-field-label">응답자 수</div><div className="modal-field-value">{selected.respondents}명</div></div>
            <div className="modal-field"><div className="modal-field-label">상태</div><div className="modal-field-value"><span className={"badge " + STATUS_CLASS[selected.status]}>{STATUS_LABEL[selected.status]}</span></div></div>
          </div>
          <div className="compare-grid">
            <div className="compare-pane">
              <div className="compare-pane-title">원본 스캔 이미지</div>

            </div>
            <div className="compare-pane">
              <div className="compare-pane-title">OCR 정형화 결과</div>
              <div className="compare-field"><span>문항 1</span><span>4 (그렇다)</span></div>
              <div className="compare-field"><span>문항 2</span><span>주 3회</span></div>
              <div className="compare-field"><span>문항 3</span><span>매우 만족</span></div>

}

function SettingsView({addToast}){
  const [roles, setRoles] = useState({admin:true, analyst:true, viewer:false});
  const [notify, setNotify] = useState({ocrDone:true, error:true, weekly:false});
  const [apiKey, setApiKey] = useState('');

  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">설정</div>
          <div className="page-desc">외부 OCR API 연동, 역할 기반 접근 제어, 알림 규칙을 관리합니다.</div>
        </div>
      </div>

      <div className="settings-grid" style={{marginTop:'20px'}}>
        <div className="settings-card">
          <div className="settings-card-title"><i data-lucide="plug"></i> 외부 OCR API 연동</div>
          <div className="settings-card-desc">Naver Clova OCR / Upstage Document AI 등 손글씨 인식 API 키를 등록합니다.</div>
          <input className="settings-input" placeholder="API 키를 입력하세요" value={apiKey} onChange={e=>setApiKey(e.target.value)} />
          <div style={{marginTop:'12px', display:'flex', justifyContent:'flex-end'}}>
            <button className="btn-primary" onClick={()=>addToast('OCR API 키가 저장되었습니다')}><i data-lucide="save"></i> 저장</button>
          </div>
        </div>

        <div className="settings-card">
          <div className="settings-card-title"><i data-lucide="shield-check"></i> 역할 기반 접근 제어</div>
          <div className="settings-card-desc">응답자 개인정보가 포함된 화면의 열람 권한을 역할별로 제어합니다.</div>
          {['admin','analyst','viewer'].map(k => (
            <div className="settings-row" key={k}>
              <div>
                <div className="settings-row-label">{k==='admin' ? '관리자' : k==='analyst' ? '분석가' : '열람자'}</div>
                <div className="settings-row-desc">{k==='viewer' ? '통계 요약만 열람 가능' : '개인정보 포함 원본 열람 가능'}</div>
              </div>
              <div className={"toggle" + (roles[k] ? ' on':'')} onClick={()=>setRoles(r=>({...r,[k]:!r[k]}))}><div className="toggle-knob"></div></div>
            </div>
          ))}
        </div>

        <div className="settings-card">
          <div className="settings-card-title"><i data-lucide="bell"></i> 알림 설정</div>
          <div className="settings-row">
            <div><div className="settings-row-label">OCR 처리 완료 알림</div></div>
            <div className={"toggle" + (notify.ocrDone ? ' on':'')} onClick={()=>setNotify(n=>({...n, ocrDone:!n.ocrDone}))}><div className="toggle-knob"></div></div>
          </div>
          <div className="settings-row">
            <div><div className="settings-row-label">오류 발생 즉시 알림</div></div>
            <div className={"toggle" + (notify.error ? ' on':'')} onClick={()=>setNotify(n=>({...n, error:!n.error}))}><div className="toggle-knob"></div></div>
          </div>
          <div className="settings-row">
            <div><div className="settings-row-label">주간 통계 요약 메일</div></div>
            <div className={"toggle" + (notify.weekly ? ' on':'')} onClick={()=>setNotify(n=>({...n, weekly:!n.weekly}))}><div className="toggle-knob"></div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);

  function addToast(text){
    const id = Date.now();
    setToasts(t => [...t, {id, text}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 2600);
  }

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-brand-mark">SL</div>
          <div>
            <div className="sidebar-brand-name">SurveyLens</div>
            <div className="sidebar-brand-sub">통계 분석 플랫폼</div>
          </div>
        </div>
        {NAV.map(g => (
          <div className="sidebar-section" key={g.group}>
            <div className="sidebar-section-title">{g.group}</div>
            {g.items.map(item => (
              <button key={item.key} className={"sidebar-link" + (view===item.key ? ' active':'')} onClick={()=>setView(item.key)}>
                <i data-lucide={item.icon}></i>{item.label}
              </button>
            ))}
          </div>
        ))}
        <div className="sidebar-footer">
          <strong>SurveyLens Demo</strong>
          자체 개발 프로젝트 · 구현 데모
        </div>
      </aside>
      <main className="main-wrap">
        {view === 'main' && <MainView go={setView} addToast={addToast} />}
        {view === 'upload' && <UploadView addToast={addToast} />}
        {view === 'analysis' && <AnalysisView />}
        {view === 'survey-list' && <SurveyListView addToast={addToast} />}
        {view === 'settings' && <SettingsView addToast={addToast} />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
