<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리서치옵스 통합 관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --iris:#5683da;
  --iris-dark:#3f68bd;
  --ember:#ff8964;
  --ember-dark:#e06e4a;
  --frost:#d1d1d1;
  --linen:#e5e5e7;
  --ink:#090a0c;
  --smoke:#95979e;
  --ash:#a9a9aa;
  --white:#ffffff;
  --warm-white:#f6f6f6;
  --green:#22a06b;
  --red:#e35555;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--warm-white);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--frost);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* header (no sidebar — topbar-analytics identity) */
.app-header{position:sticky;top:0;z-index:30;height:60px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--frost);display:flex;align-items:center;padding:0 28px;gap:22px;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-mark{width:32px;height:32px;border-radius:9999px;background:linear-gradient(135deg,var(--iris),var(--ember));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;background:var(--linen);font-size:12.5px;font-weight:600;flex-shrink:0;}
.project-switcher i{font-size:13px;}
.global-nav{display:flex;gap:4px;flex:1;justify-content:center;}
.nav-link{padding:8px 16px;border-radius:9999px;font-size:13.5px;font-weight:500;color:var(--smoke);transition:.15s;}
.nav-link:hover{background:var(--linen);color:var(--ink);}
.nav-link.active{background:var(--ink);color:var(--white);font-weight:600;}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--linen);color:var(--ink);position:relative;flex-shrink:0;}
.icon-btn:hover{background:var(--frost);}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ember);}
.avatar{width:34px;height:34px;border-radius:9999px;background:var(--iris);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}

/* secondary tab row */
.tab-bar{display:flex;gap:6px;padding:12px 28px;background:var(--white);border-bottom:1px solid var(--linen);}
.tab{padding:7px 16px;border-radius:9999px;font-size:12.5px;font-weight:600;color:var(--smoke);}
.tab.active{background:var(--iris);color:#fff;}
.tab:hover:not(.active){background:var(--linen);}

.content{max-width:1240px;margin:0 auto;width:100%;padding:28px 28px 90px;flex:1;}
.view-fade{animation:fadeIn .3s ease both;}

.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;}
.page-title{font-size:42px;font-weight:700;letter-spacing:-0.03em;}
.page-desc{color:var(--smoke);font-size:13.5px;margin-top:6px;max-width:640px;line-height:1.55;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}

.btn-primary{background:var(--iris);color:#fff;border-radius:9999px;padding:10px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:filter .15s;}
.btn-primary:hover{filter:brightness(0.93);}
.btn-ghost{background:transparent;border:1px solid var(--frost);color:var(--ink);border-radius:9999px;padding:9px 18px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;}
.btn-ghost:hover{background:var(--linen);}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:9999px;background:var(--linen);color:var(--ink);font-weight:600;}
.btn-sm.on{background:var(--iris);color:#fff;}

/* status strip — slim, not boxy KPI cards */
.status-strip{display:flex;align-items:center;gap:0;background:var(--white);border-radius:9999px;padding:10px 22px;box-shadow:0 4px 6px rgba(0,0,0,.06);margin-bottom:20px;overflow-x:auto;}
.strip-live{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--green);padding-right:18px;border-right:1px solid var(--linen);margin-right:18px;white-space:nowrap;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:glowPulse 1.5s ease infinite;}
.stat-item{display:flex;align-items:baseline;gap:8px;padding:0 18px;border-right:1px solid var(--linen);white-space:nowrap;}
.stat-item:last-child{border-right:none;}
.stat-label{font-size:11.5px;color:var(--smoke);font-weight:600;}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:var(--ink);}

.command-row{display:flex;gap:16px;align-items:stretch;margin-bottom:20px;}
.primary-focus{flex:1;min-width:0;background:var(--white);border-radius:12px;padding:20px 22px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.focus-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.focus-title i{color:var(--iris);font-size:16px;}

.gantt-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--warm-white);cursor:pointer;transition:background .15s;border-radius:8px;}
.gantt-row:hover{background:var(--warm-white);}
.gantt-row:last-child{border-bottom:none;}
.gantt-name{width:190px;flex-shrink:0;font-size:12.5px;font-weight:600;line-height:1.3;}
.gantt-track{flex:1;height:26px;background:var(--linen);border-radius:9999px;position:relative;overflow:hidden;display:flex;}
.gantt-seg{height:100%;transition:width .5s ease;}
.gantt-pct{width:44px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;color:var(--smoke);}

.priority-rail{width:308px;flex-shrink:0;background:var(--white);border-radius:12px;padding:18px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.rail-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:2px;}
.rail-title i{color:var(--ember);font-size:16px;}
.rail-sub{font-size:11.5px;color:var(--smoke);margin-bottom:12px;}
.rail-item{border:1px solid var(--linen);border-radius:9999px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s;cursor:pointer;}
.rail-item:hover{background:var(--warm-white);}
.rail-item-name{font-size:12px;font-weight:600;}
.rail-item-score{font-size:11px;font-weight:700;color:var(--ember-dark);background:rgba(255,137,100,.14);padding:2px 9px;border-radius:9999px;flex-shrink:0;}

.secondary-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;}
.widget-card{background:var(--white);border-radius:12px;padding:18px 20px;box-shadow:0 4px 6px rgba(0,0,0,.05);animation:riseIn .35s ease both;}
.widget-title{font-size:12.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.widget-title i{color:var(--smoke);font-size:15px;}

.stat-circle-wrap{display:flex;align-items:center;gap:18px;}
.stat-circle{width:96px;height:96px;border-radius:30px;background:radial-gradient(circle at 30% 20%, rgba(86,131,218,.16), rgba(255,137,100,.12) 70%, transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--linen);}
.stat-circle-num{font-size:30px;font-weight:700;color:var(--ink);}
.mini-list{list-style:none;margin:0;padding:0;font-size:12px;}
.mini-list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--warm-white);color:var(--ink);}
.mini-list li:last-child{border-bottom:none;}
.mini-list span.muted{color:var(--smoke);}

.data-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--linen);border-radius:9999px;padding:8px 14px;flex:1;min-width:200px;max-width:300px;}
.search-box i{color:var(--smoke);}
.search-box input{background:none;border:none;outline:none;font-size:13px;width:100%;}
.filter-chip{padding:7px 14px;border-radius:9999px;font-size:12.5px;background:var(--linen);color:var(--smoke);font-weight:500;}
.filter-chip.active{background:var(--iris);color:#fff;}

.review-layout{display:flex;gap:16px;align-items:flex-start;}
.queue-list{width:320px;flex-shrink:0;background:var(--white);border-radius:12px;padding:14px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.queue-item{border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:background .15s;border:1px solid transparent;}
.queue-item:hover{background:var(--warm-white);}
.queue-item.active{background:rgba(86,131,218,.08);border-color:var(--iris);}
.queue-item-name{font-size:12.5px;font-weight:600;margin-bottom:3px;}
.queue-item-conf{font-size:11.5px;color:var(--ember-dark);}

.review-main{flex:1;min-width:0;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.compare-pane{background:var(--white);border-radius:12px;padding:16px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.compare-pane-title{font-size:11px;color:var(--smoke);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:10px;}
.scan-preview{width:100%;height:200px;background:var(--warm-white);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--smoke);font-size:32px;}
.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field-row label{font-size:11px;color:var(--smoke);font-weight:600;}
.field-row input{padding:8px 10px;border-radius:4px;border:1px solid var(--frost);font-size:13px;}
.audit-table{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.05);margin-top:18px;}
.audit-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--smoke);padding:10px 16px;background:var(--warm-white);font-weight:700;border-bottom:1px solid var(--linen);}
.audit-table td{padding:10px 16px;font-size:12.5px;border-bottom:1px solid var(--warm-white);}
.audit-table tr:last-child td{border-bottom:none;}

.filter-builder{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--white);border-radius:12px;padding:16px 18px;box-shadow:0 4px 6px rgba(0,0,0,.05);margin-bottom:18px;}
.filter-builder select{padding:8px 14px;border-radius:9999px;border:1px solid var(--frost);font-size:12.5px;background:var(--warm-white);}
.result-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.result-card{background:var(--white);border-radius:12px;padding:18px 20px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.result-card-title{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.result-card-title i{color:var(--iris);}
.sig-badge{padding:5px 14px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-block;margin-top:10px;}
.sig-badge.sig{background:rgba(34,160,107,.14);color:var(--green);}
.sig-badge.nonsig{background:var(--linen);color:var(--smoke);}
.chart-wrap{height:220px;width:100%;}

.export-layout{display:flex;gap:16px;align-items:flex-start;}
.export-form{width:340px;flex-shrink:0;background:var(--white);border-radius:12px;padding:18px 20px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;}
.checkbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--frost);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.checkbox.on{background:var(--iris);border-color:var(--iris);color:#fff;}
.format-row{display:flex;gap:8px;margin:14px 0;}
.format-pill{flex:1;text-align:center;padding:10px;border-radius:9999px;border:1.5px solid var(--frost);font-size:12.5px;font-weight:600;}
.format-pill.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.export-progress{margin-top:16px;}
.progress-track{height:6px;background:var(--linen);border-radius:9999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--iris),var(--ember));border-radius:9999px;transition:width .4s ease;}
.report-list{flex:1;min-width:0;background:var(--white);border-radius:12px;padding:16px 18px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
.report-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--warm-white);}
.report-item:last-child{border-bottom:none;}
.report-item-name{font-size:13px;font-weight:600;}
.report-item-meta{font-size:11.5px;color:var(--smoke);}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.project-card{background:var(--white);border-radius:12px;padding:18px 20px;box-shadow:0 4px 6px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:riseIn .35s ease both;}
.project-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.1);}
.project-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.project-card-name{font-size:14.5px;font-weight:700;}
.badge{padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
.badge-ocr{background:rgba(86,131,218,.14);color:var(--iris-dark);}
.badge-review{background:rgba(255,137,100,.16);color:var(--ember-dark);}
.badge-analysis{background:#eef3ff;color:var(--iris-dark);}
.badge-report{background:rgba(34,160,107,.14);color:var(--green);}
.project-card-progress{margin-top:10px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
.modal-box{background:var(--white);border-radius:16px;width:580px;max-width:100%;max-height:86vh;overflow-y:auto;padding:24px 26px;animation:fadeInScale .2s ease both;box-shadow:0 25px 60px rgba(9,10,12,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:9999px;background:var(--linen);display:flex;align-items:center;justify-content:center;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.toast i{color:var(--ember);}

@media (max-width:960px){
  .global-nav{display:none;}
  .command-row{flex-direction:column;}
  .priority-rail{width:100%;}
  .secondary-grid{grid-template-columns:1fr;}
  .review-layout{flex-direction:column;}
  .queue-list{width:100%;}
  .compare-grid{grid-template-columns:1fr;}
  .result-grid{grid-template-columns:1fr;}
  .export-layout{flex-direction:column;}
  .export-form{width:100%;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const {BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, PieChart, Pie, Cell} = Recharts;

const NAV = [
  {key:'main', label:'개요', icon:'ph-gauge'},

  {key:'export', label:'리포트 내보내기', icon:'ph-export'},
  {key:'projects', label:'프로젝트 관리', icon:'ph-squares-four'},
];

const SUB_TABS = {
  main: ['오늘','이번주','이번달'],
  'quality-review': ['전체','신뢰도 70% 미만','신뢰도 50% 미만'],
  'segment-compare': ['비교 결과','원본 데이터'],
  export: ['새 리포트','히스토리'],
  projects: ['전체','진행중','완료'],
};

const PROJECTS = [

];

const STAGE_COLOR = {ocr:'#5683da', review:'#ff8964', analysis:'#8aa8e8', report:'#22a06b'};
const STAGE_LABEL = {ocr:'OCR 진행', review:'검수', analysis:'통계분석', report:'리포트'};

const QUALITY_QUEUE = [
  {id:1, project:'경기북부 보건인식조사', field:'문항 7 손글씨', conf:58, score:92},
  {id:2, project:'전남지역 고령층 생활실태', field:'문항 3 숫자 응답', conf:61, score:81},
  {id:3, project:'부산 해양산업 종사자 설문', field:'문항 9 체크박스', conf:66, score:74},
  {id:4, project:'서울권 청년정책 인식조사', field:'문항 5 서술형', conf:69, score:58},
];

const REPORT_HISTORY = [
  {name:'대전권_소상공인_만족도_최종.pdf', date:'2026.07.28', size:'4.2MB'},
  {name:'서울권_청년정책_중간분석.xlsx', date:'2026.07.24', size:'1.8MB'},
  {name:'경기북부_보건인식_1차_리포트.pdf', date:'2026.07.18', size:'3.1MB'},
];

const AUDIT_LOG = [
  {who:'김민수', action:'문항 7 응답값 보정', target:'경기북부_042.pdf', time:'2026.07.29 14:22'},
  {who:'이지은', action:'세그먼트 비교 리포트 생성', target:'서울권 vs 경기권', time:'2026.07.29 11:05'},
  {who:'박서준', action:'설문지 접근 권한 요청', target:'전남지역_027.pdf', time:'2026.07.28 09:41'},
];

function Toast({toasts}){
  return (

function MiniSpark({data, color}){
  const max = Math.max(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*56},${22 - (v/max)*18}`).join(' ');
  return (
    <svg width="56" height="22" viewBox="0 0 56 22" style={{flexShrink:0}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

          <button className="icon-btn" onClick={()=>addToast('읽지 않은 알림 3건이 있습니다')}><i className="ph ph-bell"></i><span className="notif-dot"></span></button>
          <div className="avatar">김</div>
        </div>
      </header>

      <nav className="tab-bar">
        {SUB_TABS[view][0] && (<button role="tab" className={"tab" + (subTab===SUB_TABS[view][0]?' active':'')} onClick={()=>setSubTab(SUB_TABS[view][0])}>{SUB_TABS[view][0]}</button>)}
        {SUB_TABS[view][1] && (<button role="tab" className={"tab" + (subTab===SUB_TABS[view][1]?' active':'')} onClick={()=>setSubTab(SUB_TABS[view][1])}>{SUB_TABS[view][1]}</button>)}
        {SUB_TABS[view][2] && (<button role="tab" className={"tab" + (subTab===SUB_TABS[view][2]?' active':'')} onClick={()=>setSubTab(SUB_TABS[view][2])}>{SUB_TABS[view][2]}</button>)}
      </nav>

      <div className="content">
        {view === 'main' && <MainView activeTab={subTab} />}
        {view === 'quality-review' && <QualityReviewView activeTab={subTab} />}
        {view === 'segment-compare' && <SegmentCompareView />}
        {view === 'export' && <ExportView activeTab={subTab} addToast={addToast} />}
        {view === 'projects' && <ProjectsView activeTab={subTab} />}
      </div>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
