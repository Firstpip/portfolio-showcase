<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짐프리 여행자 예약 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#beff50;
    --accent:#1e3af6;
    --bg:#ffffff;
    --parchment:#f5f5eb;
    --ash:#d2d2c8;
    --ink:#14140f;
    --graphite:#6e6e64;
    --smoke:#b9b9b7;
    --charcoal:#30302a;
    --stone:#919183;
    --radius-card:28px;
    --radius-btn:28px;
    --radius-pill:9999px;
    --radius-input:8px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
  @keyframes shimmerMove{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes ringGrow{from{stroke-dashoffset:283;}to{stroke-dashoffset:var(--dash-target,120);}}

  .fade-up{animation:fadeInUp .5s ease both;}
  .slide-in{animation:slideInRight .4s ease both;}
  .pulse-dot{animation:pulseDot 1.6s ease-in-out infinite;}
  .shimmer{background:linear-gradient(90deg,var(--ash) 0%,#efefe6 40%,var(--ash) 80%);background-size:600px 100%;animation:shimmerMove 1.4s linear infinite;}

  .eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--graphite);}
  .h-display{font-size:56px;line-height:1.05;letter-spacing:-.02em;font-weight:600;}
  .h-lg{font-size:44px;line-height:1.1;letter-spacing:-.02em;font-weight:600;}
  .h-md{font-size:28px;line-height:1.15;letter-spacing:-.01em;font-weight:600;}
  .h-sm{font-size:20px;line-height:1.2;font-weight:600;}
  .body-text{font-size:16px;line-height:1.55;color:var(--graphite);}
  .body-sm{font-size:14px;line-height:1.5;color:var(--graphite);}
  .caption{font-size:12px;line-height:1.4;color:var(--stone);}

  .container{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* topnav */
  .topnav{position:sticky;top:0;z-index:50;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ash);}
  .topnav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .nav-links{display:flex;align-items:center;gap:28px;}
  .nav-link{font-size:15px;font-weight:500;color:var(--ink);padding:8px 2px;border-bottom:2px solid transparent;transition:border-color .15s;}
  .nav-link:hover{border-color:var(--primary);}
  .nav-cta-group{display:flex;align-items:center;gap:10px;}

  /* quicknav — persistent feature shortcuts across all views */
  .quicknav{position:sticky;top:72px;z-index:40;width:100%;background:var(--parchment);border-bottom:1px solid var(--ash);overflow-x:auto;}
  .quicknav-inner{display:flex;gap:8px;padding:10px 24px;}
  .quicknav-chip{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--ash);color:var(--graphite);white-space:nowrap;}
  .quicknav-chip.active{background:var(--ink);border-color:var(--ink);color:var(--primary);}

  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 22px;border-radius:var(--radius-btn);transition:transform .15s,box-shadow .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:var(--ink);}
  .btn-primary:hover{box-shadow:0 6px 18px rgba(190,255,80,.55);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ash);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{box-shadow:0 6px 18px rgba(20,20,15,.25);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-block{width:100%;justify-content:center;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{box-shadow:0 6px 18px rgba(30,58,246,.35);}

  /* hero */
  .hero{background:var(--parchment);padding:96px 0 80px;overflow:hidden;position:relative;}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
  .hero-cta{display:flex;gap:12px;margin-top:32px;}
  .hero-art{position:relative;height:360px;}
  .hero-art svg{width:100%;height:100%;}

  .trust-row{display:flex;gap:28px;margin-top:40px;flex-wrap:wrap;}
  .trust-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--graphite);font-weight:500;}

  /* wizard */
  .section{padding:88px 0;}
  .section-head{margin-bottom:44px;max-width:640px;}
  .wizard-shell{background:#fff;border:1px solid var(--ash);border-radius:32px;padding:44px;}
  .stepper{display:flex;align-items:center;margin-bottom:40px;}
  .step-item{display:flex;align-items:center;gap:10px;flex:1;}
  .step-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--ash);color:var(--stone);flex-shrink:0;transition:all .2s;}
  .step-circle.active{background:var(--ink);border-color:var(--ink);color:var(--primary);}
  .step-circle.done{background:var(--primary);border-color:var(--primary);color:var(--ink);}
  .step-label{font-size:13px;font-weight:600;color:var(--stone);white-space:nowrap;}
  .step-label.active{color:var(--ink);}
  .step-line{flex:1;height:2px;background:var(--ash);margin:0 8px;position:relative;top:-11px;}

  .wizard-body-grid{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start;}
  .step-body{min-height:340px;}
  .service-pick-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .service-card{border:2px solid var(--ash);border-radius:var(--radius-card);padding:28px;text-align:left;transition:all .18s;}
  .service-card:hover{border-color:var(--ink);}
  .service-card.selected{border-color:var(--primary);background:var(--parchment);}
  .service-icon{width:48px;height:48px;border-radius:14px;background:var(--parchment);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .service-card.selected .service-icon{background:var(--primary);}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink);}
  .field input,.field select{border:1.5px solid var(--ash);border-radius:var(--radius-input);padding:12px 14px;font-size:14px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .stepper-count{display:flex;align-items:center;gap:12px;}
  .count-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--ash);display:flex;align-items:center;justify-content:center;font-weight:700;}

  .autocomplete-wrap{position:relative;}
  .ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--ash);border-radius:14px;margin-top:6px;box-shadow:0 12px 32px rgba(20,20,15,.14);z-index:10;overflow:hidden;}
  .ac-item{padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ash);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--parchment);}

  .map-mini{position:relative;height:200px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#eef0e2 0%,#e4e7d6 100%);margin-top:16px;border:1px solid var(--ash);}
  .map-mini .marker{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(30,58,246,.18);}
  .map-mini .marker.self{background:var(--ink);}
  .distance-card{margin-top:14px;background:var(--parchment);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;}

  .summary-side{position:sticky;top:96px;background:var(--parchment);border-radius:var(--radius-card);padding:28px;display:flex;flex-direction:column;gap:18px;}
  .summary-row{display:flex;justify-content:space-between;font-size:14px;}
  .summary-row b{font-weight:600;}
  .tip-item{display:flex;gap:10px;font-size:13px;color:var(--graphite);align-items:flex-start;}
  .price-box{background:#fff;border-radius:16px;padding:18px;}
  .price-box .amount{font-size:24px;font-weight:700;letter-spacing:-.02em;}

  .step-nav{display:flex;justify-content:space-between;margin-top:32px;}

  /* feature grid */
  .feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .feat-card{border:1.5px solid var(--ash);border-radius:var(--radius-card);padding:28px 24px;display:flex;flex-direction:column;gap:14px;transition:transform .18s,border-color .18s;background:#fff;}
  .feat-card:hover{transform:translateY(-4px);border-color:var(--ink);}
  .feat-icon{width:44px;height:44px;border-radius:12px;background:var(--parchment);display:flex;align-items:center;justify-content:center;}
  .feat-card h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.3;}
  .feat-card p{font-size:13.5px;color:var(--graphite);line-height:1.5;margin:0;flex:1;}
  .feat-enter{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);border-bottom:1.5px solid var(--ink);align-self:flex-start;padding-bottom:2px;}

  /* full page views */
  .page-view{width:100%;min-height:calc(100vh - 72px);}
  .view-header{background:var(--parchment);padding:48px 0 40px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--graphite);margin-bottom:18px;}

  /* payment */
  .currency-tabs{display:flex;gap:8px;margin-bottom:24px;}
  .currency-tab{padding:10px 20px;border-radius:var(--radius-pill);border:1.5px solid var(--ash);font-weight:700;font-size:14px;}
  .currency-tab.active{background:var(--ink);border-color:var(--ink);color:var(--primary);}
  .pay-grid{display:grid;grid-template-columns:1fr 380px;gap:32px;}
  .order-card{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:32px;}
  .order-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ash);font-size:14px;}
  .order-row:last-child{border-bottom:none;}
  .pay-panel{background:var(--parchment);border-radius:var(--radius-card);padding:28px;height:fit-content;}
  .paypal-btn{width:100%;background:linear-gradient(90deg,#ffc439,#f7b600);color:#003087;font-weight:800;padding:16px;border-radius:var(--radius-btn);font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;}
  .status-badge.wait{background:#f0e6c8;color:#8a6d1a;}
  .status-badge.done{background:var(--primary);color:var(--ink);}

  /* login */
  .login-shell{max-width:440px;margin:0 auto;background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:40px;}
  .sns-btn{width:100%;padding:15px;border-radius:var(--radius-btn);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;border:1.5px solid var(--ash);}
  .sns-btn.line{background:#06c755;color:#fff;border-color:#06c755;}
  .sns-btn.google{background:#fff;color:var(--ink);}
  .divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--stone);font-size:13px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--ash);}
  .guest-result{margin-top:20px;background:var(--parchment);border-radius:16px;padding:20px;}

  /* admin */
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .toggle-group{display:flex;background:var(--parchment);border-radius:var(--radius-pill);padding:4px;}
  .toggle-btn{padding:9px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;color:var(--graphite);}
  .toggle-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(20,20,15,.1);}
  .res-list{display:flex;flex-direction:column;gap:10px;}
  .res-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--ash);border-radius:18px;padding:16px 18px;}
  .urgency-dot{width:9px;height:9px;border-radius:50%;}
  .urgency-dot.high{background:#e0483e;}
  .urgency-dot.mid{background:#e0a83e;}
  .urgency-dot.low{background:var(--stone);}
  .res-type-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);background:var(--parchment);}
  .res-select{border:1.5px solid var(--ash);border-radius:var(--radius-input);padding:8px 10px;font-size:12.5px;font-weight:600;}
  .admin-map{position:relative;height:420px;border-radius:24px;background:linear-gradient(135deg,#eef0e2,#e4e7d6);overflow:hidden;border:1px solid var(--ash);}
  .admin-map .marker{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);}
  .detail-panel{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:32px;}
  .detail-field{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--ash);font-size:14px;}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.25);}

  footer{background:var(--ink);color:var(--parchment);padding:56px 0 28px;margin-top:0;}
  .footer-inner{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:24px;}
  .footer-cols{display:flex;gap:64px;}
  .footer-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--stone);margin-bottom:12px;}
  .footer-col a{display:block;font-size:14px;color:var(--parchment);opacity:.85;margin-bottom:8px;}
  .footer-bottom{border-top:1px solid #3a3a33;margin-top:40px;padding-top:20px;font-size:12.5px;color:var(--stone);}

  @media (max-width:900px){
    .hero-grid,.wizard-body-grid,.pay-grid{grid-template-columns:1fr;}
    .feat-grid{grid-template-columns:1fr 1fr;}
    .field-grid,.service-pick-row{grid-template-columns:1fr;}
    .nav-links{display:none;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const ICON = (name, props={}) => <i data-lucide={name} {...props}></i>;

// ---- mock data ----
const ADDR_SUGGESTIONS = [
  {name:"부산역 1번 출구", lat:35.1152, lng:129.0410},
  {name:"해운대해수욕장", lat:35.1587, lng:129.1604},
  {name:"김해공항 국제선 청사", lat:35.1795, lng:128.9382},
  {name:"서면역 7번 출구", lat:35.1578, lng:129.0594},
  {name:"광안리해수욕장", lat:35.1532, lng:129.1187},
];
const HUBS = [
  {name:"부산역 짐프리 거점", lat:35.1149, lng:129.0403},
  {name:"해운대 짐프리 거점", lat:35.1601, lng:129.1610},
  {name:"김해공항 짐프리 거점", lat:35.1802, lng:128.9391},
];
const PRICE_TABLE = {
  KRW:{delivery:29000, storage:12000, symbol:"₩", locale:"ko-KR"},
  TWD:{delivery:680, storage:280, symbol:"NT$", locale:"en-US"},
  JPY:{delivery:3200, storage:1350, symbol:"¥", locale:"ja-JP"},
  USD:{delivery:22, storage:9, symbol:"$", locale:"en-US"},
};
const TODAY_RESERVATIONS = [
  {id:"JP-48210", type:"배송", name:"다나카 유키", hub:"해운대 짐프리 거점", dueLabel:"11:30 마감", urgency:"high", status:"접수"},
  {id:"JP-48214", type:"보관", name:"첸웨이", hub:"부산역 짐프리 거점", dueLabel:"13:00 마감", urgency:"mid", status:"처리중"},
  {id:"JP-48219", type:"배송", name:"사라 존슨", hub:"김해공항 짐프리 거점", dueLabel:"15:20 마감", urgency:"mid", status:"접수"},
  {id:"JP-48223", type:"보관", name:"応本 隼人", hub:"해운대 짐프리 거점", dueLabel:"내일 09:00", urgency:"low", status:"완료"},
  {id:"JP-48227", type:"배송", name:"리우팡", hub:"부산역 짐프리 거점", dueLabel:"내일 10:40", urgency:"low", status:"접수"},
];

function haversine(a, b){
  const R = 6371;
  const dLat = (b.lat-a.lat) * Math.PI/180;
  const dLng = (b.lng-a.lng) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function nearestHub(point){
  let best=null, bestD=Infinity;
  HUBS.forEach(h=>{ const d=haversine(point,h); if(d<bestD){bestD=d;best=h;} });
  return {hub:best, distance:bestD};
}

function Toast({message,onClose}){
  useEffect(()=>{ const t=setTimeout(onClose, 2600); return ()=>clearTimeout(t); },[]);
  return (
    <div className="toast slide-in">
      {ICON('check-circle',{style:{width:18,height:18}})}
      <span>{message}</span>
    </div>
  );
}

function Header({setView,scrollToWizard}){
  return (
    <header className="topnav">
      <div className="topnav-inner">
        <div className="brand" onClick={()=>setView('home')} style={{cursor:'pointer'}}>
          <span className="brand-mark">{ICON('luggage',{style:{width:18,height:18}})}</span>
          짐프리
        </div>
        <nav className="nav-links">
          <a className="nav-link" onClick={()=>setView('home')}>홈</a>
          <a className="nav-link" onClick={scrollToWizard}>예약하기</a>
          <a className="nav-link" onClick={()=>setView('login')}>예약조회</a>
        </nav>
        <div className="nav-cta-group">
          <button className="btn btn-ghost btn-sm" onClick={()=>setView('login')}>로그인</button>
          <button className="btn btn-primary btn-sm" onClick={scrollToWizard}>지금 예약하기</button>
        </div>
      </div>
    </header>
  );
}

function QuickNav({view,setView,scrollToWizard}){
  const items = [
    {key:'home', label:'예약 폼 (배송·보관 분기 + 위치 자동완성)', action:scrollToWizard},
    {key:'payment', label:'다통화 결제 연동 (PayPal)', action:()=>setView('payment')},
    {key:'login', label:'LINE·구글 소셜 로그인 + 게스트 예약조회', action:()=>setView('login')},
    {key:'admin-today', label:'관리자 오늘 할 일 & 실시간 예약 현황', action:()=>setView('admin-today')},
  ];
  return (
    <div className="quicknav">
      <div className="container quicknav-inner">
        {items.map(it=>(
          <button key={it.key} className={"quicknav-chip "+(view===it.key?'active':'')} onClick={it.action}>{it.label}</button>
        ))}
      </div>
    </div>
  );
}

function HeroArt(){
  return (
    <svg viewBox="0 0 420 360" fill="none">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

function Stepper({step}){
  const labels = ["서비스 선택","상세 정보","위치 확인","결제 확인"];
  return (
    <div className="stepper">
      {labels.map((l,i)=>{
        const n=i+1;
        const state = n<step ? 'done' : n===step ? 'active' : '';
        return (
          <React.Fragment key={l}>
            <div className="step-item">
              <div className={"step-circle "+state}>{n<step ? ICON('check',{style:{width:15,height:15}}) : n}</div>
              <span className={"step-label "+(n===step?'active':'')}>{l}</span>
            </div>
            {i<labels.length-1 && <div className="step-line"/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

          <div className="divider">또는</div>
          <div className="field" style={{marginBottom:12}}><label>예약번호</label><input value={resNo} onChange={e=>setResNo(e.target.value)} placeholder="예: JP-48210"/></div>
          <div className="field" style={{marginBottom:16}}><label>연락처 뒷 4자리</label><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="예: 1234" maxLength={4}/></div>
          <button className="btn btn-dark btn-block" onClick={guestLookup}>예약 조회하기</button>

          {result && (
            <div className="guest-result slide-in">
              <div className="summary-row"><span>예약번호</span><b>{result.id}</b></div>
              <div className="summary-row"><span>서비스</span><b>{result.type}</b></div>
              <div className="summary-row"><span>거점</span><b>{result.hub}</b></div>
              <div className="summary-row"><span>보관일수</span><b>{result.days}일</b></div>
              <div className="summary-row"><span>상태</span><b style={{color:'#1e3af6'}}>{result.status}</b></div>
            </div>
          )}
        </div>
      </div>
      {toast && <Toast message={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

function AdminTodayView({goHome}){
  const [mode,setMode] = useState('list');
  const [reservations,setReservations] = useState(TODAY_RESERVATIONS);
  const [selectedId,setSelectedId] = useState(null);
  const [toast,setToast] = useState(null);

  function changeStatus(id,status){
    setReservations(rs=>rs.map(r=>r.id===id?{...r,status}:r));
    setToast(id+" 상태가 "+status+"(으)로 변경되었습니다");
  }

  const selected = reservations.find(r=>r.id===selectedId);

  return (
    <div className="page-view fade-up">
      <div className="view-header">
        <div className="container">
          <a className="back-link" onClick={goHome}>{ICON('arrow-left',{style:{width:14,height:14}})} 홈으로</a>
          <div className="eyebrow" style={{marginBottom:8}}>관리자 오늘 할 일 & 실시간 예약 현황</div>
          <h1 className="h-lg">오늘 처리할 예약 {reservations.length}건</h1>
        </div>
      </div>
      <div className="container" style={{padding:'40px 24px'}}>
        {selected ? (
          <div className="detail-panel slide-in">
            <a className="back-link" onClick={()=>setSelectedId(null)}>{ICON('arrow-left',{style:{width:14,height:14}})} 목록으로</a>
            <h2 className="h-sm" style={{marginBottom:16}}>예약 상세 — {selected.id}</h2>
            <div className="detail-field"><span>고객명</span><b>{selected.name}</b></div>
            <div className="detail-field"><span>서비스 유형</span><b>{selected.type}</b></div>
            <div className="detail-field"><span>거점</span><b>{selected.hub}</b></div>
            <div className="detail-field"><span>마감</span><b>{selected.dueLabel}</b></div>
            <div className="detail-field"><span>현재 상태</span><b>{selected.status}</b></div>
            <div style={{display:'flex',gap:10,marginTop:20}}>
              {['접수','처리중','완료'].map(s=>(
                <button key={s} className={"btn btn-sm "+(selected.status===s?'btn-dark':'btn-ghost')} onClick={()=>changeStatus(selected.id,s)}>{s}</button>
              ))}
            </div>
          </div>
        ) : (
          <React.Fragment>
            <div className="admin-toolbar">
              <div className="toggle-group">
                <button className={"toggle-btn "+(mode==='list'?'active':'')} onClick={()=>setMode('list')}>{ICON('list',{style:{width:14,height:14}})} 목록</button>
                <button className={"toggle-btn "+(mode==='map'?'active':'')} onClick={()=>setMode('map')}>{ICON('map',{style:{width:14,height:14}})} 지도</button>
              </div>
              <span className="caption">마감 임박순 자동 정렬</span>
            </div>
            {mode==='list' ? (
              <div className="res-list">
                {[...reservations].sort((a,b)=>({high:0,mid:1,low:2}[a.urgency]-{high:0,mid:1,low:2}[b.urgency])).map(r=>(
                  <div className="res-row" key={r.id} onClick={()=>setSelectedId(r.id)} style={{cursor:'pointer'}}>
                    <div className={"urgency-dot "+r.urgency+" pulse-dot"}></div>
                    <div>
                      <div style={{fontWeight:700,fontSize:14}}>{r.name} <span className="caption">· {r.id}</span></div>
                      <div className="caption">{r.hub} · {r.dueLabel}</div>
                    </div>
                    <span className="res-type-badge">{r.type}</span>
                    <select className="res-select" value={r.status} onClick={e=>e.stopPropagation()} onChange={e=>changeStatus(r.id,e.target.value)}>
                      <option>접수</option><option>처리중</option><option>완료</option>
                    </select>
                    {ICON('chevron-right',{style:{width:16,height:16,color:'var(--stone)'}})}
                  </div>
                ))}
              </div>
            ) : (
              <div className="admin-map">
                {[[28,40],[55,25],[70,60],[40,70],[60,45]].map((p,i)=>(
                  <div key={i} className="marker" style={{left:p[0]+'%',top:p[1]+'%'}}></div>
                ))}
              </div>
            )}
          </React.Fragment>
        )}
      </div>
      {toast && <Toast message={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

function App(){
  const [view,setView] = useState('home');
  const wizardRef = useRef(null);
  const features = [
    {name:"예약 폼 (배송·보관 분기 + 위치 자동완성)", description:"배송 또는 보관을 선택하고 주소 자동완성으로 가까운 거점을 즉시 확인합니다."},
    {name:"다통화 결제 연동 (PayPal)", description:"KRW/TWD/JPY/USD 통화별 정액가로 PayPal 결제를 진행합니다."},
    {name:"LINE·구글 소셜 로그인 + 게스트 예약조회", description:"소셜 로그인 또는 예약번호만으로 예약 상세를 조회합니다."},
    {name:"관리자 오늘 할 일 & 실시간 예약 현황", description:"당일 예약을 목록·지도로 확인하고 상태를 즉시 업데이트합니다."},
  ];

  useEffect(()=>{ lucide.createIcons(); });
  useEffect(()=>{ window.__gotoPayment = ()=>setView('payment'); window.scrollTo(0,0); },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[view]);

  function scrollToWizard(){
    setView('home');
    setTimeout(()=>{ wizardRef.current && wizardRef.current.scrollIntoView({behavior:'smooth'}); },50);
  }

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Header setView={setView} scrollToWizard={scrollToWizard}/>
      <QuickNav view={view} setView={setView} scrollToWizard={scrollToWizard}/>
      <main style={{flex:1,width:'100%'}}>
        {view==='home' && (
          <React.Fragment>
            <Hero scrollToWizard={scrollToWizard} setView={setView}/>
            <Wizard wizardRef={wizardRef}/>
            <FeatureGrid features={features} setView={setView} scrollToWizard={scrollToWizard}/>
          </React.Fragment>
        )}
        {view==='payment' && <PaymentView goHome={()=>setView('home')}/>}
        {view==='login' && <LoginView goHome={()=>setView('home')}/>}
        {view==='admin-today' && <AdminTodayView goHome={()=>setView('home')}/>}
      </main>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
