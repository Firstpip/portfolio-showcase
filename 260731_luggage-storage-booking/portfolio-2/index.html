<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짐프리 통합 운영 관제 시스템 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root{
    --ink:#000000;
    --offblack:#242424;
    --parchment:#f6f3f1;
    --ash:#cecac8;
    --lake:#2b59d1;
    --periwinkle:#cfdaf5;
    --sky:#a0b5eb;
    --mint:#a7fccd;
    --coral:#ff9473;
    --gold:#ecda98;
    --graphite:#4e4d4d;
    --smoke:#797776;
    --radius-card:32px;
    --radius-btn:100px;
    --radius-panel:22px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--parchment);color:var(--offblack);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes radarPing{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(2.6);opacity:0;}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(43,89,209,.35);}50%{box-shadow:0 0 0 8px rgba(43,89,209,0);}}
  @keyframes shimmerMove{0%{background-position:-320px 0;}100%{background-position:320px 0;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  .fade-up{animation:fadeInUp .5s ease both;}
  .slide-up{animation:slideUp .35s ease both;}
  .shimmer{background:linear-gradient(90deg,var(--ash) 0%,#e7e3df 40%,var(--ash) 80%);background-size:640px 100%;animation:shimmerMove 1.3s linear infinite;}

  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--smoke);}
  .h-display{font-size:46px;line-height:1.15;letter-spacing:-.02em;font-weight:600;}
  .h-lg{font-size:36px;line-height:1.18;letter-spacing:-.015em;font-weight:600;}
  .h-md{font-size:24px;line-height:1.2;font-weight:600;}
  .h-sm{font-size:18px;line-height:1.25;font-weight:600;}
  .body-text{font-size:16px;line-height:1.5;color:var(--graphite);}
  .body-sm{font-size:13.5px;line-height:1.45;color:var(--graphite);}
  .mono-label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em;text-transform:uppercase;font-weight:600;}

  .container{max-width:1432px;margin:0 auto;padding:0 24px;}

  .app-shell{position:relative;width:100%;min-height:100vh;background:var(--parchment);}

  /* topbar */
  .announce-bar{background:var(--ink);color:var(--parchment);height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:ui-monospace,monospace;letter-spacing:.03em;}
  .topbar{position:sticky;top:0;z-index:60;background:rgba(246,243,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--ash);}
  .topbar-inner{max-width:1432px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--lake);}
  .tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .tab-btn{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;padding:9px 16px;border-radius:var(--radius-btn);color:var(--offblack);}
  .tab-btn.active{background:var(--offblack);color:var(--parchment);}
  .pill-btn{display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;text-transform:uppercase;padding:12px 22px;border-radius:var(--radius-btn);}
  .pill-btn.blue{background:var(--lake);color:#fff;}
  .pill-btn.black{background:var(--offblack);color:#fff;}
  .pill-btn.ghost{background:transparent;border:1px solid var(--offblack);color:var(--offblack);}
  .pill-btn.sm{padding:8px 16px;font-size:11.5px;}

  /* map view */
  .map-stage{position:relative;height:calc(100vh - 64px);overflow:hidden;}
  .map-canvas-area{position:absolute;inset:0;background:
      radial-gradient(circle at 20% 30%, rgba(160,181,235,.35), transparent 40%),
      radial-gradient(circle at 75% 65%, rgba(255,148,115,.22), transparent 45%),
      linear-gradient(135deg,#eef1ea 0%,#e6e9df 100%);
  }
  .route-line{position:absolute;border-top:2px dashed rgba(36,36,36,.25);}
  .marker{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);display:flex;align-items:center;justify-content:center;}
  .marker.normal{background:var(--lake);}
  .marker.full{background:var(--coral);}
  .marker.maint{background:var(--smoke);}
  .marker-ring{position:absolute;inset:-9px;border-radius:50%;border:2px solid currentColor;opacity:.5;animation:radarPing 2.2s ease-out infinite;}
  .drawer{position:absolute;left:20px;top:20px;width:290px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--ash);border-radius:var(--radius-panel);padding:18px;box-shadow:0 16px 40px rgba(20,20,20,.16);max-height:calc(100% - 130px);overflow:auto;}
  .drawer input{width:100%;border:1px solid var(--ash);border-radius:100px;padding:10px 16px;font-size:13.5px;margin-bottom:14px;background:#fff;}
  .drawer .result-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .drawer .result-list li{padding:10px 12px;border-radius:16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .drawer .result-list li:hover{background:var(--periwinkle);}
  .drawer .result-list li.active{background:var(--lake);color:#fff;}
  .detail-card{position:absolute;right:20px;bottom:20px;width:280px;background:#fff;border-radius:var(--radius-panel);padding:20px;box-shadow:0 16px 40px rgba(20,20,20,.18);}
  .map-control{position:absolute;right:20px;top:20px;display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 26px rgba(20,20,20,.14);}
  .map-control button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .map-control button:hover{background:var(--periwinkle);}
  .legend{position:absolute;left:20px;bottom:20px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 26px rgba(20,20,20,.14);display:flex;flex-direction:column;gap:8px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  /* generic page */
  .page{padding:56px 0 80px;}
  .page-head{margin-bottom:36px;max-width:680px;}

  .card{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:32px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}

  /* zone mgmt */
  .zone-card{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:26px;display:flex;flex-direction:column;gap:14px;}
  .zone-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .radius-visual{position:relative;height:120px;background:var(--parchment);border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .radius-circle{border-radius:50%;background:rgba(43,89,209,.14);border:1.5px solid var(--lake);transition:all .2s;}
  .radius-track{width:100%;}
  input[type=range]{width:100%;accent-color:var(--lake);}
  .overlap-badge{background:var(--coral);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;display:inline-flex;align-items:center;gap:6px;}

  /* stats */
  .filter-bar{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
  .filter-bar select{border:1px solid var(--ash);border-radius:100px;padding:10px 18px;font-size:13.5px;background:#fff;font-weight:600;}
  .stat-tile{background:#fff;border:1px solid var(--ash);border-radius:24px;padding:22px;}
  .stat-tile .num{font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .chart-wrap{position:relative;height:260px;background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:24px;}
  .donut-wrap{display:flex;align-items:center;gap:24px;}

  /* notify center */
  .lang-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .lang-tab{padding:8px 16px;border-radius:100px;font-size:12.5px;font-weight:700;border:1px solid var(--ash);}
  .lang-tab.active{background:var(--lake);color:#fff;border-color:var(--lake);}
  .template-preview{background:var(--periwinkle);border-radius:var(--radius-card);padding:28px;min-height:180px;}
  .log-table{width:100%;border-collapse:collapse;}
  .log-table th{text-align:left;font-family:ui-monospace,monospace;font-size:11px;text-transform:uppercase;color:var(--smoke);padding:10px 12px;border-bottom:1px solid var(--ash);}
  .log-table td{padding:12px;font-size:13.5px;border-bottom:1px solid var(--ash);}
  .log-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
  .log-badge.ok{background:var(--mint);color:#1a5c3a;}
  .log-badge.retry{background:var(--gold);color:#6b5410;}
  .log-badge.fail{background:var(--coral);color:#7a2c15;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--offblack);color:#fff;padding:14px 26px;border-radius:100px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:300;box-shadow:0 16px 40px rgba(0,0,0,.3);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.4);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
  .modal-box{background:#fff;border-radius:28px;padding:32px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:700;}
  .field input{border:1px solid var(--ash);border-radius:14px;padding:11px 14px;font-size:14px;}

  @media (max-width:960px){
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .tabs{display:none;}
    .drawer{width:220px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;
const PH = (name, cls="") => <i className={"ph ph-"+name+" "+cls}></i>;

const HUBS = [
  {id:'h1', name:'해운대 짐프리 거점', status:'normal', today:24, load:62, manager:'정민아', x:34, y:38, radius:1.8},
  {id:'h2', name:'부산역 짐프리 거점', status:'full', today:41, load:94, manager:'김도윤', x:58, y:55, radius:2.4},
  {id:'h3', name:'김해공항 짐프리 거점', status:'normal', today:19, load:48, manager:'이서준', x:72, y:28, radius:2.0},
  {id:'h4', name:'서면 짐프리 거점', status:'maint', today:6, load:12, manager:'박지후', x:46, y:70, radius:1.5},
  {id:'h5', name:'광안리 짐프리 거점', status:'normal', today:15, load:35, manager:'최유나', x:22, y:62, radius:1.6},
];

const NOTIFY_TYPES = ['예약확인','결제완료','픽업알림'];
const LANGS = ['한국어','English','日本語','中文'];
const NOTIFY_LOG = [
  {id:1, type:'예약확인', lang:'English', to:'s.johnson@mail.com', status:'ok'},
  {id:2, type:'결제완료', lang:'日本語', to:'y.tanaka@mail.jp', status:'ok'},
  {id:3, type:'픽업알림', lang:'中文', to:'w.chen@mail.cn', status:'retry'},
  {id:4, type:'예약확인', lang:'한국어', to:'test@mail.kr', status:'fail'},
  {id:5, type:'결제완료', lang:'English', to:'sarah@mail.com', status:'ok'},
];

function Toast({message,onClose}){
  useEffect(()=>{ const t=setTimeout(onClose,2400); return ()=>clearTimeout(t); },[]);
  return <div className="toast slide-up">{PH('check-circle')}<span>{message}</span></div>;
}

function TopBar({tab,setTab}){
  const items = [
    {key:'main', label:'실시간 거점 운영 관제 맵'},
    {key:'zone-mgmt', label:'거점·서비스 반경 관리'},
    {key:'stats', label:'예약 통계 및 매출 분석 대시보드'},
    {key:'notify-center', label:'다국어 알림 자동 발송 센터'},
  ];
  return (
    <React.Fragment>
      <div className="announce-bar">짐프리 관제 콘솔 · 5개 거점 실시간 연동 중</div>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand"><span className="brand-dot"></span>짐프리 OPS</div>
          <div className="tabs">
            {items.map(it=>(
              <button key={it.key} className={"tab-btn "+(tab===it.key?'active':'')} onClick={()=>setTab(it.key)}>{it.label}</button>
            ))}
          </div>
          <button className="pill-btn ghost sm" onClick={()=>setTab('main')}>{PH('arrow-counter-clockwise')} 관제 홈</button>
        </div>
      </div>
    </React.Fragment>
  );
}

function MapView(){
  const [selected,setSelected] = useState(HUBS[0].id);
  const [query,setQuery] = useState('');
  const hub = HUBS.find(h=>h.id===selected);
  const filtered = HUBS.filter(h=>h.name.includes(query));

  return (
    <div className="map-stage" data-region="map">
      <div className="map-canvas-area map">
        <div className="route-line" style={{left:'20%',top:'40%',width:'160px',transform:'rotate(18deg)'}}></div>
        <div className="route-line" style={{left:'45%',top:'62%',width:'140px',transform:'rotate(-12deg)'}}></div>
        {HUBS.map(h=>(
          <div key={h.id} className="marker" style={{left:h.x+'%',top:h.y+'%',background:h.status==='full'?'#ff9473':h.status==='maint'?'#797776':'#2b59d1',color:h.status==='full'?'#ff9473':h.status==='maint'?'#797776':'#2b59d1',cursor:'pointer'}} onClick={()=>setSelected(h.id)}>
            {h.id===selected && <span className="marker-ring"></span>}
          </div>
        ))}
        <div className="marker" style={{left:'64%',top:'46%',background:'#a0b5eb',width:8,height:8,opacity:.8}} title="이동 중인 배송 차량"></div>
        <div className="marker" style={{left:'38%',top:'50%',background:'#a0b5eb',width:8,height:8,opacity:.8}} title="이동 중인 배송 차량"></div>
      </div>

      <aside className="drawer list-panel">
        <input placeholder="거점 검색" value={query} onChange={e=>setQuery(e.target.value)}/>
        <ul className="result-list">
          {filtered.map(h=>(
            <li key={h.id} className={h.id===selected?'active':''} onClick={()=>setSelected(h.id)}>
              <span>{h.name}</span>
              {PH('caret-right')}
            </li>
          ))}
        </ul>
      </aside>

      <div className="detail-card slide-up" key={hub.id}>
        <div className="eyebrow" style={{marginBottom:6}}>선택 거점 상세</div>
        <div className="h-sm" style={{marginBottom:14}}>{hub.name}</div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}}><span className="body-sm">오늘 처리</span><b>{hub.today}건</b></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}}><span className="body-sm">담당자</span><b>{hub.manager}</b></div>
        <div style={{marginTop:6}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span className="body-sm">포화율</span><b>{hub.load}%</b></div>
          <div style={{height:8,borderRadius:100,background:'var(--parchment)',overflow:'hidden'}}>
            <div style={{height:'100%',width:hub.load+'%',borderRadius:100,background:hub.load>85?'var(--coral)':'var(--lake)'}}></div>
          </div>
        </div>
      </div>

      <div className="map-control">
        <button onClick={()=>{}}>＋</button>
        <button onClick={()=>{}}>－</button>
      </div>

      <div className="legend">
        <div className="mono-label" style={{marginBottom:2}}>상태 범례</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'#2b59d1'}}></span>정상</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'#ff9473'}}></span>포화</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'#797776'}}></span>점검</div>
      </div>
    </div>
  );
}

function ZoneMgmtView(){
  const [hubs,setHubs] = useState(HUBS.map(h=>({...h})));
  const [showAdd,setShowAdd] = useState(false);
  const [newName,setNewName] = useState('');
  const [toast,setToast] = useState(null);

  function updateRadius(id,val){
    setHubs(hs=>hs.map(h=>h.id===id?{...h,radius:val}:h));
  }
  const overlap = hubs[0].radius + hubs[1].radius > 4.0;

  function addHub(){
    if(!newName){ setToast('거점 주소를 입력해주세요'); return; }
    setHubs(hs=>[...hs,{id:'h'+(hs.length+1),name:newName,status:'normal',today:0,load:10,manager:'미배정',x:50,y:50,radius:1.5}]);
    setShowAdd(false); setNewName('');
    setToast('신규 거점이 등록되었습니다');
  }

  return (
    <div className="page">
      <div className="container">
        <div className="page-head fade-up">
          <div className="eyebrow" style={{marginBottom:10}}>거점·서비스 반경 관리</div>
          <h1 className="h-display">거점 위치와 커버리지를 지도에서 직접 설정합니다</h1>
        </div>
        <button className="pill-btn blue" style={{marginBottom:24}} onClick={()=>setShowAdd(true)}>{PH('plus-circle')} 거점 등록</button>
        {overlap && <div className="overlap-badge" style={{marginBottom:20}}>{PH('warning-circle')} 해운대 · 부산역 거점 반경이 중첩되었습니다</div>}
        <div className="grid-3">
          {hubs.map((h,i)=>(
            <div className="zone-card fade-up" key={h.id} style={{animationDelay:(i*.04)+'s'}}>
              <div className="zone-top">
                <div>
                  <div className="h-sm">{h.name}</div>
                  <div className="body-sm">담당 {h.manager}</div>
                </div>
                <span className="mono-label" style={{color: h.status==='normal'?'#2b59d1':h.status==='full'?'#ff9473':'#797776'}}>{h.status==='normal'?'정상':h.status==='full'?'포화':'점검'}</span>
              </div>
              <div className="radius-visual">
                <div className="radius-circle" style={{width:(h.radius*36)+'px',height:(h.radius*36)+'px'}}></div>
              </div>
              <div className="radius-track">
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:4}}><span className="body-sm">서비스 반경</span><b>{h.radius.toFixed(1)}km</b></div>
                <input type="range" min="0.5" max="3" step="0.1" value={h.radius} onChange={e=>updateRadius(h.id,parseFloat(e.target.value))}/>
              </div>
            </div>
          ))}
        </div>
      </div>
      {showAdd && (
        <div className="modal-overlay" onClick={()=>setShowAdd(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="h-sm" style={{marginBottom:18}}>신규 거점 등록</div>
            <div className="field"><label>거점 주소 (Google Places 자동완성)</label><input placeholder="예: 남포동 국제시장 입구" value={newName} onChange={e=>setNewName(e.target.value)}/></div>
            <div style={{display:'flex',gap:10,marginTop:14}}>
              <button className="pill-btn ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>setShowAdd(false)}>취소</button>
              <button className="pill-btn blue" style={{flex:1,justifyContent:'center'}} onClick={addHub}>등록하기</button>
            </div>
          </div>
        </div>
      )}
      {toast && <Toast message={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

function DonutChart({segments,size=140}){
  const total = segments.reduce((s,x)=>s+x.value,0);
  let acc = 0;
  const r = size/2 - 14;
  const c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={"0 0 "+size+" "+size}>
      {segments.map((s,i)=>{
        const frac = s.value/total;
        const dash = frac*c;
        const el = (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color} strokeWidth="18"
            strokeDasharray={dash+" "+(c-dash)} strokeDashoffset={-acc}
            transform={"rotate(-90 "+size/2+" "+size/2+")"}/>
        );
        acc += dash;
        return el;
      })}
      <text x="50%" y="50%" textAnchor="middle" dy="6" fontSize="18" fontWeight="700" fill="#242424">{total}</text>
    </svg>
  );
}

function NotifyCenterView(){
  const [type,setType] = useState(NOTIFY_TYPES[0]);
  const [lang,setLang] = useState(LANGS[0]);
  const [sending,setSending] = useState(false);
  const [toast,setToast] = useState(null);

  const previewText = {
    '한국어':{예약확인:'예약이 확정되었습니다. 예약번호: JP-48210',결제완료:'결제가 정상적으로 완료되었습니다.',픽업알림:'거점에 도착하시면 QR코드를 제시해주세요.'},
    'English':{예약확인:'Your reservation is confirmed. Booking No. JP-48210',결제완료:'Your payment has been completed.',픽업알림:'Please show your QR code at the hub.'},
    '日本語':{예약확인:'予約が確定しました。予約番号：JP-48210',결제완료:'お支払いが完了しました。',픽업알림:'拠点到着後にQRコードをご提示ください。'},
    '中文':{예약확인:'您的预订已确认。预订号：JP-48210',결제완료:'付款已完成。',픽업알림:'到达网点后请出示二维码。'},
  };

  function sendTest(){
    setSending(true);
    setTimeout(()=>{ setSending(false); setToast('테스트 발송이 완료되었습니다'); },1200);
  }

  return (
    <div className="page">
      <div className="container">
        <div className="page-head fade-up">
          <div className="eyebrow" style={{marginBottom:10}}>다국어 알림 자동 발송 센터</div>
          <h1 className="h-display">언어별 알림 템플릿을 관리하고 발송 로그를 확인합니다</h1>
        </div>
        <div className="grid-2" style={{alignItems:'start'}}>
          <div>
            <div className="tabs" style={{marginBottom:16}}>
              {NOTIFY_TYPES.map(t=>(
                <button key={t} className={"tab-btn "+(type===t?'active':'')} onClick={()=>setType(t)}>{t}</button>
              ))}
            </div>
            <div className="lang-tabs">
              {LANGS.map(l=>(
                <button key={l} className={"lang-tab "+(lang===l?'active':'')} onClick={()=>setLang(l)}>{l}</button>
              ))}
            </div>
            <div className="template-preview slide-up" key={type+lang}>
              <div className="mono-label" style={{marginBottom:10}}>{type} · {lang}</div>
              <p className="body-text" style={{color:'#242424'}}>{previewText[lang][type]}</p>
            </div>
            <button className="pill-btn blue" style={{marginTop:18}} onClick={sendTest} disabled={sending}>
              {sending ? <span className="shimmer" style={{width:80,height:12,borderRadius:8,display:'inline-block'}}></span> : <React.Fragment>{PH('paper-plane-tilt')} 발송 테스트</React.Fragment>}
            </button>
          </div>
          <div className="card">
            <div className="h-sm" style={{marginBottom:16}}>발송 로그</div>
            <table className="log-table">
              <thead><tr><th>유형</th><th>언어</th><th>수신처</th><th>상태</th></tr></thead>
              <tbody>
                {NOTIFY_LOG.map(l=>(
                  <tr key={l.id}>
                    <td>{l.type}</td><td>{l.lang}</td><td className="mono">{l.to}</td>
                    <td><span className={"log-badge "+l.status}>{l.status==='ok'?'성공':l.status==='retry'?'재시도':'실패'}</span></td>

            </table>
          </div>
        </div>
      </div>
      {toast && <Toast message={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

      {tab==='zone-mgmt' && <ZoneMgmtView/>}
      {tab==='stats' && <StatsView/>}
      {tab==='notify-center' && <NotifyCenterView/>}

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
