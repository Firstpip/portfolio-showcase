<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰노트 — 쿠폰 발급·적용 통합 커머스 앱</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#fafaf9;
  --surface:#ffffff;
  --border:#e8e6e5;
  --border-muted:#d6d3d1;
  --text:#0c0a09;
  --text-2:#78716c;
  --ash:#a8a29e;
  --primary:#3ba6f1;
  --primary-edge:#3398e1;
  --accent:#ef2436;
  --wash:#c1e1f7;
  --soot:#1c1917;
  --shadow-card:0 4px 16px rgba(0,0,0,0.05);
  --shadow-floating:0 12px 45px rgba(17,12,46,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.1px;
}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select{font-family:inherit;}
::selection{background:var(--wash);}

@keyframes fadeInUp{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
@keyframes slideInRight{ from{opacity:0;transform:translateX(28px);} to{opacity:1;transform:translateX(0);} }
@keyframes pulseDot{ 0%{box-shadow:0 0 0 0 rgba(239,36,54,0.45);} 70%{box-shadow:0 0 0 7px rgba(239,36,54,0);} 100%{box-shadow:0 0 0 0 rgba(239,36,54,0);} }
@keyframes toastIn{ from{opacity:0;transform:translate(-50%,14px);} to{opacity:1;transform:translate(-50%,0);} }

/* ── search-header (airbnb-search-grid 시그니처) ── */
.search-header{
  position:sticky;top:0;z-index:50;width:100%;
  background:rgba(250,250,249,0.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.header-row{
  max-width:1200px;margin:0 auto;padding:14px 24px 10px;
  display:flex;align-items:center;gap:20px;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:500;font-size:16px;color:var(--text);flex-shrink:0;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block;}
.search-bar{
  flex:1;max-width:520px;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:9999px;
  box-shadow:var(--shadow-card);overflow:hidden;
}
.search-segment{
  flex:1;padding:8px 16px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;
  transition:background .15s ease;
}
.search-segment:hover{background:var(--wash);}
.segment-label{font-size:10px;color:var(--text-2);font-weight:500;}
.segment-value{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-divider{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.search-submit{
  width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0;
}
.header-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-icon-btn{
  position:relative;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  transition:background .15s ease;
}
.nav-icon-btn:hover{background:var(--border);}
.nav-badge{
  position:absolute;top:4px;right:5px;min-width:15px;height:15px;padding:0 3px;border-radius:9999px;
  background:var(--accent);color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;
  animation:pulseDot 2.2s infinite;
}
.login-pill{
  display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;
  border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text);background:var(--surface);
  transition:all .15s ease;
}
.login-pill.active{background:var(--primary);border-color:var(--primary-edge);color:#fff;}

/* ── filter chips ── */
.filter-chips{
  max-width:1200px;margin:0 auto;padding:0 24px 14px;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;
  border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-2);font-weight:500;
  transition:all .15s ease;white-space:nowrap;
}
.chip.active{background:var(--soot);color:#fff;border-color:var(--soot);}
.chip:hover:not(.active){background:var(--wash);}
.chip-icon{font-size:14px;}

/* ── main layout ── */
.main{max-width:1200px;margin:0 auto;padding:28px 24px 96px;}

/* ── home view ── */
.home-hero{
  padding:40px 32px 32px;margin:-8px -32px 32px;border-radius:20px;
  background:radial-gradient(circle at 8% 0%, var(--wash) 0%, transparent 45%), radial-gradient(circle at 92% 100%, rgba(239,36,54,0.08) 0%, transparent 50%);
  animation:fadeInUp .5s ease both;position:relative;overflow:hidden;
}
.home-hero::after{
  content:'';position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle, rgba(59,166,241,0.16), transparent 70%);pointer-events:none;
}
.eyebrow{font-size:13px;color:var(--primary-edge);font-weight:500;margin:0 0 10px;}
.home-title{font-size:clamp(30px,4vw,42px);font-weight:400;letter-spacing:-1.1px;line-height:1.15;margin:0 0 14px;color:var(--text);}
.home-title .hl{color:var(--primary-edge);background:var(--wash);padding:2px 8px;border-radius:4px;}
.home-sub{font-size:16px;color:var(--text-2);line-height:1.65;max-width:560px;margin:0 0 22px;}
.login-toggle-row{display:flex;align-items:center;gap:12px;}
.mode-badge{font-size:13px;color:var(--text-2);padding:6px 12px;border-radius:9999px;background:var(--surface);border:1px solid var(--border);}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;}
@media (max-width:760px){.quick-grid{grid-template-columns:1fr;}}
.quick-tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:22px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  text-align:left;transition:transform .2s ease, box-shadow .2s ease;
  animation:fadeInUp .5s ease both;
}
.quick-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-floating);}
.quick-tile-icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--wash);color:var(--primary-edge);
}
.quick-tile-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.4;}
.quick-tile-desc{font-size:13px;color:var(--text-2);line-height:1.5;}

.section-title{font-size:20px;font-weight:600;letter-spacing:-0.3px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;}
.section-title .see-all{font-size:13px;font-weight:500;color:var(--primary-edge);display:flex;align-items:center;gap:4px;}
.preview-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;margin-bottom:40px;}
.preview-card{
  flex-shrink:0;width:190px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);
  transition:box-shadow .2s ease;
}
.preview-card:hover{box-shadow:var(--shadow-card);}
.preview-image{height:96px;position:relative;}
.preview-body{padding:12px;}
.preview-brand{font-size:11px;color:var(--text-2);margin-bottom:3px;}
.preview-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3;}
.preview-price{font-size:13px;font-weight:700;color:var(--text);}

/* ── card grid (coupon view) ── */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;
}
.listing-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease;
  animation:fadeInUp .45s ease both;
}
.listing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-floating);cursor:pointer;}
.card-image-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;}
.card-image-wrap .grad{position:absolute;inset:0;}
.card-favorite{
  position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;color:var(--text);
  transition:transform .15s ease;
}
.card-favorite:hover{transform:scale(1.08);}
.card-favorite.saved{color:var(--accent);}
.card-discount-badge{
  position:absolute;bottom:10px;left:10px;padding:5px 10px;border-radius:6px;
  background:var(--accent);color:#fff;font-size:12px;font-weight:700;
}
.card-body{padding:16px;}
.card-row-1{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin:0;}
.card-meta{font-size:12px;color:var(--text-2);}
.card-row-3{margin:4px 0 10px;}
.card-price-row{display:flex;align-items:baseline;gap:6px;}
.card-price-original{font-size:12px;color:var(--ash);text-decoration:line-through;}
.card-price{font-size:17px;font-weight:700;color:var(--text);}

/* ── quick-view drawer ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(12,10,9,0.4);z-index:80;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--surface);z-index:81;
  box-shadow:var(--shadow-floating);overflow-y:auto;animation:slideInRight .3s ease both;
}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border);}
.drawer-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-2);}
.drawer-close:hover{background:var(--border);}
.drawer-image{height:180px;position:relative;}
.drawer-body{padding:20px;}
.drawer-remaining{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;}
.drawer-title{font-size:19px;font-weight:600;margin:0 0 10px;}
.drawer-cond{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin:14px 0;font-size:13px;color:var(--text-2);line-height:1.6;}
.drawer-cta{
  width:100%;padding:14px;border-radius:9999px;background:var(--primary);color:#fff;font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease;
}
.drawer-cta:hover{background:var(--primary-edge);}
.drawer-cta:disabled{background:var(--ash);cursor:default;}

/* ── checkout ── */
.checkout-grid{display:grid;grid-template-columns:1.3fr 0.9fr;gap:24px;}
@media (max-width:820px){.checkout-grid{grid-template-columns:1fr;}}
.cart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 20px;margin-bottom:16px;}
.cart-item{display:flex;align-items:center;justify-content:between;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.cart-item-thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-title{font-size:14px;font-weight:600;color:var(--text);}
.cart-item-qty{font-size:12px;color:var(--text-2);}
.cart-item-price{font-size:14px;font-weight:600;color:var(--text);flex-shrink:0;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;position:sticky;top:100px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:12px;}
.summary-row.total{font-size:17px;font-weight:700;color:var(--text);border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}
.coupon-select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--text);margin-bottom:14px;background:var(--bg);}
.warn-line{font-size:12px;color:var(--accent);margin:-6px 0 12px;}
.pay-btn{
  width:100%;padding:15px;border-radius:9999px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;
  transition:background .15s ease;
}
.pay-btn:hover{background:var(--primary-edge);}
.pay-btn:disabled{background:var(--ash);}

/* ── notification ── */
.notif-filters{display:flex;gap:8px;margin-bottom:18px;}
.notif-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.notif-item{
  display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .15s ease;position:relative;
}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--bg);}
.notif-item.unread{background:rgba(59,166,241,0.05);}
.notif-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.notif-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;}
.notif-desc{font-size:13px;color:var(--text-2);line-height:1.5;}
.notif-time{font-size:11px;color:var(--ash);margin-top:5px;}
.unread-dot{position:absolute;top:20px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulseDot 2.2s infinite;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
  background:var(--soot);color:#fff;padding:13px 22px;border-radius:9999px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-floating);z-index:100;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;
}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-2);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function Icon({name, size=18, style}){
  return <i data-lucide={name} style={{width:size, height:size, ...style}}></i>;
}

function Toast({message}){
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle-2" size={16}/>{message}</div>;
}

function Header({view, setView, loggedIn, setLoggedIn, cartCount, unreadCount, activeCategory, setActiveCategory}){
  return (
    <header className="search-header">
      <div className="header-row">
        <button className="brand" onClick={()=>setView('main')}><span className="dot"></span>쿠폰노트</button>
        <div className="search-bar">
          <button className="search-segment" onClick={()=>setView('coupon')}>
            <span className="segment-label">카테고리</span>
            <span className="segment-value">{activeCategory}</span>
          </button>
          <span className="search-divider"></span>
          <button className="search-segment" onClick={()=>setView('coupon')}>
            <span className="segment-label">브랜드</span>
            <span className="segment-value">전체 브랜드</span>
          </button>
          <span className="search-divider"></span>
          <button className="search-segment" onClick={()=>setView('coupon')}>
            <span className="segment-label">유효기간</span>
            <span className="segment-value">이번 달</span>
          </button>
          <button className="search-submit" onClick={()=>setView('coupon')}><Icon name="search" size={16}/></button>
        </div>
        <nav className="header-nav">
          <button className="nav-icon-btn" title="홈" onClick={()=>setView('main')}><Icon name="home" size={19}/></button>
          <button className="nav-icon-btn" title="체크아웃" onClick={()=>setView('checkout')}>
            <Icon name="shopping-cart" size={19}/>
            {cartCount>0 && <span className="nav-badge">{cartCount}</span>}
            <span className="sr-only">쿠폰 적용 주문 체크아웃</span>
          </button>
          <button className="nav-icon-btn" title="알림" onClick={()=>setView('notification')}>
            <Icon name="bell" size={19}/>
            {unreadCount>0 && <span className="nav-badge">{unreadCount}</span>}
            <span className="sr-only">FCM 푸시 알림 센터</span>
          </button>
          <button className={"login-pill" + (loggedIn?' active':'')} onClick={()=>setLoggedIn(!loggedIn)}>
            <Icon name={loggedIn?'user-round-check':'user-round'} size={15}/>
            {loggedIn?'회원':'게스트'}
          </button>
        </nav>
      </div>
      <div className="filter-chips">
        {CATEGORIES.map(c=>(
          <button key={c.key} className={"chip"+(activeCategory===c.key?' active':'')}
            onClick={()=>{ setActiveCategory(c.key); setView('coupon'); }}>
            <Icon name={c.icon} size={13} style={{color: activeCategory===c.key ? '#fff' : 'inherit'}}/>
            <span>{c.key}</span>
          </button>
        ))}
      </div>
    </header>
  );
}

function HomeView({setView, loggedIn, setLoggedIn, onOpenCoupon}){
  return (
    <div>
      <section className="home-hero">
        <p className="eyebrow">게스트도 바로 시작 — 로그인은 선택입니다</p>
        <h1 className="home-title">로그인·<span className="hl">비로그인</span> 통합 홈</h1>
        <p className="home-sub">회원가입 없이도 쿠폰을 담고 사용할 수 있으며, 로그인하면 담아둔 쿠폰과 주문 내역이 계정으로 그대로 이어집니다.</p>
        <div className="login-toggle-row">
          <button className={"login-pill"+(loggedIn?' active':'')} onClick={()=>setLoggedIn(!loggedIn)}>
            <Icon name={loggedIn?'log-out':'log-in'} size={15}/>{loggedIn?'로그아웃':'로그인'}
          </button>
          <span className="mode-badge">{loggedIn?'회원 모드로 이용 중':'게스트 모드로 이용 중'}</span>
        </div>
      </section>

      <div className="quick-grid">
        <button className="quick-tile" style={{animationDelay:'60ms'}} onClick={()=>setView('coupon')}>
          <span className="quick-tile-icon"><Icon name="ticket-percent" size={20}/></span>
          <span className="quick-tile-title">쿠폰 발급·조회·적용</span>
          <span className="quick-tile-desc">카테고리·브랜드로 쿠폰을 탐색하고 즉시 담아 사용합니다.</span>
        </button>
        <button className="quick-tile" style={{animationDelay:'120ms'}} onClick={()=>setView('checkout')}>
          <span className="quick-tile-icon"><Icon name="shopping-cart" size={20}/></span>
          <span className="quick-tile-title">쿠폰 적용 주문 체크아웃</span>
          <span className="quick-tile-desc">장바구니에 쿠폰을 적용해 최종 결제 금액을 확인합니다.</span>
        </button>
        <button className="quick-tile" style={{animationDelay:'180ms'}} onClick={()=>setView('notification')}>
          <span className="quick-tile-icon"><Icon name="bell-ring" size={20}/></span>
          <span className="quick-tile-title">FCM 푸시 알림 센터</span>
          <span className="quick-tile-desc">쿠폰 발급·만료 임박·주문 상태 알림을 한곳에서 확인합니다.</span>
        </button>
      </div>

      <div className="section-title">
        이번 주 추천 쿠폰
        <button className="see-all" onClick={()=>setView('coupon')}>전체보기<Icon name="chevron-right" size={14}/></button>
      </div>
      <div className="preview-strip">
        {/* staggered entrance */}
        {COUPONS.slice(0,5).map((c,i)=>(
          <div key={c.id} className="preview-card" onClick={()=>onOpenCoupon(c)} style={{animation:`fadeInUp .5s ease both`, animationDelay:`${i*70}ms`}}>
            <div className="preview-image" style={{background:GRADIENTS[c.grad]}}></div>
            <div className="preview-body">
              <div className="preview-brand">{c.brand}</div>
              <div className="preview-title">{c.title}</div>
              <div className="preview-price">{c.final.toLocaleString()}원</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function CouponView({coupons, category, saved, onToggleSave, onOpen}){
  const filtered = category==='전체' ? coupons : coupons.filter(c=>c.category===category);
  return (
    <div>
      <div className="section-title">쿠폰 발급·조회·적용</div>
      {filtered.length===0 ? (
        <div className="empty-state">해당 카테고리의 쿠폰이 아직 없습니다.</div>
      ) : (
        <div className="card-grid">
          {filtered.map((c,i)=>(
            <article key={c.id} className="listing-card" style={{animationDelay:`${(i%8)*40}ms`}} onClick={()=>onOpen(c)}>
              <div className="card-image-wrap">
                <div className="grad" style={{background:GRADIENTS[c.grad]}}></div>
                <button className={"card-favorite"+(saved.has(c.id)?' saved':'')}
                  onClick={(e)=>{e.stopPropagation(); onToggleSave(c.id);}}>
                  <Icon name="heart" size={15} style={{fill: saved.has(c.id)?'currentColor':'none'}}/>
                </button>
                <span className="card-discount-badge">{c.discount}</span>
              </div>
              <div className="card-body">
                <div className="card-row-1">
                  <h3 className="card-title">{c.title}</h3>
                </div>
                <div className="card-meta">{c.brand}</div>
                <div className="card-row-3"><span className="card-meta">{c.expiresIn} · 잔여 {c.remaining}장</span></div>
                <div className="card-price-row">
                  <span className="card-price-original">{c.original.toLocaleString()}원</span>
                  <strong className="card-price">{c.final.toLocaleString()}원</strong>
                </div>
              </div>
            </article>
          ))}
        </div>
      )}
    </div>
  );
}

function QuickViewDrawer({coupon, onClose, onAdd, saved}){
  if(!coupon) return null;
  const disabled = coupon.remaining<=0;
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="drawer-header">
          <strong style={{fontSize:15}}>{coupon.brand}</strong>
          <button className="drawer-close" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <div className="drawer-image" style={{background:GRADIENTS[coupon.grad]}}></div>
        <div className="drawer-body">
          <div className="drawer-remaining">잔여 {coupon.remaining}장 · {coupon.expiresIn}</div>
          <h2 className="drawer-title">{coupon.title}</h2>
          <div className="card-price-row">
            <span className="card-price-original">{coupon.original.toLocaleString()}원</span>
            <strong className="card-price" style={{fontSize:22}}>{coupon.final.toLocaleString()}원</strong>
          </div>
          <div className="drawer-cond"><Icon name="info" size={13} style={{marginRight:6}}/>{coupon.cond}</div>
          <button className="drawer-cta" disabled={disabled} onClick={()=>onAdd(coupon)}>
            <Icon name={saved.has(coupon.id)?'check':'ticket-plus'} size={16}/>
            {disabled ? '쿠폰 소진' : (saved.has(coupon.id) ? '쿠폰함에 담김' : '쿠폰 담기')}
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function CheckoutView({myCoupons, showToast}){
  const [cart] = useState([
    {id:1, title:'브런치가든 브런치세트', qty:1, price:18000, grad:1},
    {id:2, title:'굿모닝베이커리 크루아상 세트', qty:2, price:4500, grad:2},
  ]);
  const [selectedCoupon, setSelectedCoupon] = useState(myCoupons.length ? myCoupons[0].id : '');
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const coupon = myCoupons.find(c=>c.id===Number(selectedCoupon));
  const minOrder = 10000;
  const meetsMin = subtotal >= minOrder;
  let discount = 0;
  if(coupon && meetsMin){
    discount = coupon.discount.includes('%') ? Math.round(subtotal*parseInt(coupon.discount)/100)
      : coupon.discount.includes('원') ? parseInt(coupon.discount.replace(/[^0-9]/g,''))
      : 0;
  }
  const total = Math.max(0, subtotal - discount);

  return (
    <div>
      <div className="section-title">쿠폰 적용 주문 체크아웃</div>
      <div className="checkout-grid">
        <div>
          <div className="cart-card">
            {cart.map(item=>(
              <div className="cart-item" key={item.id}>
                <div className="cart-item-thumb" style={{background:GRADIENTS[item.grad]}}></div>
                <div className="cart-item-info">
                  <div className="cart-item-title">{item.title}</div>
                  <div className="cart-item-qty">수량 {item.qty}개</div>
                </div>
                <div className="cart-item-price">{(item.price*item.qty).toLocaleString()}원</div>
              </div>
            ))}
          </div>
        </div>
        <div className="summary-card">
          <select className="coupon-select" value={selectedCoupon} onChange={e=>setSelectedCoupon(e.target.value)}>
            <option value="">쿠폰 미적용</option>
            {myCoupons.map(c=>(<option key={c.id} value={c.id}>{c.brand} · {c.title}</option>))}
          </select>
          {!meetsMin && coupon && <div className="warn-line"><Icon name="alert-circle" size={12} style={{marginRight:4}}/>최소 주문금액 {minOrder.toLocaleString()}원 미달로 쿠폰이 적용되지 않습니다</div>}
          <div className="summary-row"><span>상품 금액</span><span>{subtotal.toLocaleString()}원</span></div>
          <div className="summary-row"><span>쿠폰 할인</span><span>-{discount.toLocaleString()}원</span></div>
          <div className="summary-row total"><span>최종 결제 금액</span><span>{total.toLocaleString()}원</span></div>
          <button className="pay-btn" style={{marginTop:14}} onClick={()=>showToast('주문이 완료되었습니다')}>
            결제하기
          </button>
        </div>
      </div>
    </div>
  );
}

function NotificationView({notifs, onRead}){
  const [filter, setFilter] = useState('전체');
  const types = ['전체','쿠폰','만료임박','주문','공지'];
  const iconOf = t => t==='쿠폰'?'ticket-percent': t==='만료임박'?'alarm-clock': t==='주문'?'package': 'megaphone';
  const colorOf = t => t==='만료임박' ? {background:'#fdeaea', color:'var(--accent)'} : {background:'var(--wash)', color:'var(--primary-edge)'};
  const filtered = filter==='전체' ? notifs : notifs.filter(n=>n.type===filter);

  return (
    <div>
      <div className="section-title">FCM 푸시 알림 센터</div>
      <div className="notif-filters">
        {types.map(t=>(
          <button key={t} className={"chip"+(filter===t?' active':'')} onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>
      <div className="notif-list">
        {filtered.length===0 ? <div className="empty-state">알림이 없습니다.</div> : filtered.map(n=>(
          <div key={n.id} className={"notif-item"+(!n.read?' unread':'')} onClick={()=>onRead(n.id)}>
            <span className="notif-icon" style={colorOf(n.type)}><Icon name={iconOf(n.type)} size={17}/></span>
            <div>
              <div className="notif-title">{n.title}</div>
              <div className="notif-desc">{n.desc}</div>
              <div className="notif-time">{n.time}</div>
            </div>
            {!n.read && <span className="unread-dot"></span>}
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [loggedIn, setLoggedIn] = useState(false);
  const [activeCategory, setActiveCategory] = useState('전체');
  const [saved, setSaved] = useState(new Set());
  const [openCoupon, setOpenCoupon] = useState(null);
  const [notifs, setNotifs] = useState(INIT_NOTIFS);
  const [toast, setToast] = useState(null);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const showToast = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null), 2400); };

  const handleAdd = (coupon)=>{
    setSaved(prev=>{
      const next = new Set(prev);
      if(!next.has(coupon.id)){ next.add(coupon.id); showToast(`${coupon.brand} 쿠폰이 담겼습니다`); }
      return next;
    });
    setOpenCoupon(null);
  };

  const myCoupons = COUPONS.filter(c=>saved.has(c.id));
  const unreadCount = notifs.filter(n=>!n.read).length;

  return (
    <div data-archetype="airbnb-search-grid">
      <Header view={view} setView={setView} loggedIn={loggedIn} setLoggedIn={setLoggedIn}
        cartCount={myCoupons.length} unreadCount={unreadCount}
        activeCategory={activeCategory} setActiveCategory={setActiveCategory}/>
      <main className="main">
        {view==='main' && <HomeView setView={setView} loggedIn={loggedIn} setLoggedIn={setLoggedIn} onOpenCoupon={setOpenCoupon}/>}
        {view==='coupon' && <CouponView coupons={COUPONS} category={activeCategory} saved={saved} onToggleSave={(id)=>{
          setSaved(prev=>{ const next=new Set(prev); next.has(id)?next.delete(id):next.add(id); return next; });
        }} onOpen={setOpenCoupon}/>}
        {view==='checkout' && <CheckoutView myCoupons={myCoupons} showToast={showToast}/>}
        {view==='notification' && <NotificationView notifs={notifs} onRead={(id)=>{
          setNotifs(prev=>prev.map(n=>n.id===id?{...n, read:true}:n));
        }}/>}
      </main>
      <QuickViewDrawer coupon={openCoupon} onClose={()=>setOpenCoupon(null)} onAdd={handleAdd} saved={saved}/>
      <Toast message={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
