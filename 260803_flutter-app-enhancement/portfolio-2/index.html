<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰·결제 통합 운영 관리 콘솔</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/dist/index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#000000;
  --sidebar-bg:#0c0c0c;
  --panel:#1b1b1b;
  --card:rgba(255,255,255,0.035);
  --card-hover:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.09);
  --haze:#f5f5f5;
  --text:#ffffff;
  --text-2:#9aa3ad;
  --primary:#ec2bff;
  --primary-soft:rgba(236,43,255,0.16);
  --accent:#aef745;
  --danger:#ff5c7a;
  --amber:#ffc555;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--bg);}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--primary-soft);}

@keyframes fadeIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
@keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }
@keyframes glowPulse{ 0%{box-shadow:0 0 0 0 rgba(174,247,69,0.35);} 70%{box-shadow:0 0 0 9px rgba(174,247,69,0);} 100%{box-shadow:0 0 0 0 rgba(174,247,69,0);} }
@keyframes lineDraw{ from{stroke-dashoffset:600;} to{stroke-dashoffset:0;} }
@keyframes toastPop{ from{opacity:0;transform:translate(-50%,14px) scale(0.97);} to{opacity:1;transform:translate(-50%,0) scale(1);} }

.app-shell{display:flex;min-height:100vh;}

/* ── sidebar (stripe-multipane 시그니처) ── */
.sidebar{
  width:252px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);
  padding:20px 14px;display:flex;flex-direction:column;gap:22px;
  background-image:radial-gradient(circle at 20% 0%, rgba(236,43,255,0.10), transparent 55%);
}
.sidebar-brand{padding:6px 8px 14px;border-bottom:1px solid var(--border);}
.sidebar-brand .brand-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.sidebar-brand .brand-name .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary);}
.env-select{
  margin-top:10px;width:100%;font-size:12px;color:var(--text-2);background:var(--card);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:6px;
}
.sidebar-section{display:flex;flex-direction:column;gap:2px;}
.sidebar-section-title{font-size:11px;color:var(--text-2);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:6px 10px 4px;}
.sidebar-link{
  display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:13px;
  color:var(--text-2);text-align:left;line-height:1.4;transition:background .15s ease, color .15s ease;
}
.sidebar-link:hover{background:var(--card-hover);color:var(--text);}
.sidebar-link.active{background:var(--primary-soft);color:var(--text);}
.sidebar-link.active .sl-icon{color:var(--primary);}
.sl-icon{flex-shrink:0;font-size:16px;}

/* ── main ── */
.main{flex:1;min-width:0;padding:26px 32px 80px;}
.page-header{
  margin:-8px -12px 22px;padding:20px 12px 14px;border-radius:16px;animation:fadeIn .4s ease both;position:relative;
  background:radial-gradient(circle at 6% 0%, rgba(236,43,255,0.14), transparent 55%), radial-gradient(circle at 100% 100%, rgba(174,247,69,0.08), transparent 60%);
}
.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.page-title{font-size:26px;font-weight:600;letter-spacing:-0.4px;margin:0;}
.page-actions{display:flex;gap:8px;}
.btn-secondary{
  padding:9px 16px;border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--text-2);
  display:flex;align-items:center;gap:6px;transition:all .15s ease;
}
.btn-secondary:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
.btn-primary{
  padding:9px 18px;border-radius:8px;background:var(--primary);color:#0c0a09;font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:6px;transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:hover{transform:scale(1.035);box-shadow:0 8px 24px rgba(236,43,255,0.35);}
.page-meta{font-size:12px;color:var(--text-2);margin-top:6px;}

/* KPI stat row */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 26px;}
@media (max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  animation:fadeIn .45s ease both;position:relative;overflow:hidden;
}
.stat-label{font-size:12px;color:var(--text-2);margin-bottom:10px;}
.stat-value{font-size:30px;font-weight:700;letter-spacing:-0.5px;}
.stat-delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
.stat-delta.positive{color:var(--accent);}
.stat-delta.negative{color:var(--danger);}
.stat-sparkline{position:absolute;right:14px;bottom:14px;width:76px;height:30px;}

/* tabs */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:10px 4px;margin-right:22px;font-size:13px;color:var(--text-2);position:relative;font-weight:500;}
.tab.active{color:var(--text);}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px;}

.data-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search-input{
  flex:1;min-width:200px;padding:9px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:13px;
}
.search-input::placeholder{color:var(--text-2);}
.filter-chip{padding:8px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--text-2);background:var(--card);}
.filter-chip.active{color:var(--text);border-color:var(--primary);}
.export-btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;}
.export-btn:hover{color:var(--text);}

/* table */
.data-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table thead th{
  text-align:left;padding:12px 18px;font-size:11px;color:var(--text-2);font-weight:600;
  text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);
}
.data-table tbody td{padding:13px 18px;border-bottom:1px solid var(--border);color:var(--text);}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr{transition:background .15s ease;}
.data-table tbody tr:hover{background:var(--card-hover);}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;display:inline-block;}
.badge.success{background:rgba(174,247,69,0.16);color:var(--accent);}
.badge.pending{background:rgba(255,197,85,0.16);color:var(--amber);}
.badge.fail{background:rgba(255,92,122,0.16);color:var(--danger);}
.row-more{color:var(--text-2);}

/* insight-board (analytics) */
.insight-board{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px;}
@media (max-width:1000px){.insight-board{grid-template-columns:1fr;}}
.hero-viz{
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;
  background-image:radial-gradient(circle at 90% 10%, rgba(174,247,69,0.10), transparent 60%);
}
.hero-viz-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.hero-metric-label{font-size:13px;color:var(--text-2);}
.hero-metric-value{font-size:48px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0;}
.range-toggle{display:flex;gap:4px;}
.range-btn{padding:6px 12px;border-radius:8px;font-size:12px;color:var(--text-2);border:1px solid var(--border);}
.range-btn.active{color:var(--text);border-color:var(--primary);background:var(--primary-soft);}
.kpi-side{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;}
.kpi-side-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:2px;}
.kpi-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kpi-list-item:last-child{border-bottom:none;}
.kpi-tag{font-size:11px;color:var(--danger);font-weight:600;}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:1000px){.widget-grid{grid-template-columns:1fr;}}
.widget-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
.widget-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:14px;}
.donut-legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px;}
.donut-legend-item{display:flex;align-items:center;gap:7px;color:var(--text-2);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:96px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bar{width:100%;border-radius:4px 4px 0 0;transform-origin:bottom;animation:barGrow .6s ease both;}
.bar-label{font-size:10px;color:var(--text-2);}
.timeline-item{display:flex;gap:10px;padding:9px 0;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--border);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}

/* release checklist */
.checklist-tabs{display:flex;gap:8px;margin-bottom:16px;}
.checklist-group{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.checklist-group-title{padding:14px 18px;font-size:13px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);}
.checklist-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
.checklist-row:last-child{border-bottom:none;}
.check-toggle{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.check-toggle.done{background:var(--accent);border-color:var(--accent);color:#0c0a09;}
.checklist-name{flex:1;font-size:13px;}
.checklist-name.done{color:var(--text-2);text-decoration:line-through;}
.assignee-tag{font-size:11px;color:var(--text-2);padding:4px 10px;border-radius:6px;border:1px solid var(--border);}
.readiness-badge{
  padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.readiness-badge.ready{background:rgba(174,247,69,0.16);color:var(--accent);animation:glowPulse 2.4s infinite;}
.readiness-badge.pending{background:rgba(255,197,85,0.16);color:var(--amber);}
.haze-callout{
  background:var(--haze);color:#1b1b1b;border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.6;
  display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;
}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:var(--haze);color:#1b1b1b;padding:12px 20px;border-radius:9999px;font-size:13px;font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,0.5);z-index:100;animation:toastPop .3s ease both;display:flex;align-items:center;gap:8px;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function Icon({name, size=16, style, color}){
  return <i className={"ph ph-"+name} style={{fontSize:size, color, ...style}}></i>;
}

function useCountUp(target, duration=900){
  const [val, setVal] = useState(0);
  useEffect(()=>{
    let start = null;
    let raf;
    function step(ts){
      if(!start) start = ts;
      const p = Math.min(1, (ts-start)/duration);
      setVal(Math.round(target*p));
      if(p<1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

function Sparkline({points, color}){
  const w=76, h=30;
  const max = Math.max(...points), min = Math.min(...points);
  const norm = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

const TEMPLATES = [

const PAYMENTS = [

function Toast({message}){
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle" size={15}/>{message}</div>;
}

function Sidebar({view, setView}){
  const items = [
    {group:'쿠폰', links:[
      {id:'main', label:'쿠폰 발급 관리자 콘솔', icon:'ticket'},

function MainView({showToast}){
  const [tab, setTab] = useState('발급 현황');
  const [modalOpen, setModalOpen] = useState(false);
  const [period, setPeriod] = useState('이번 달');
  const [statusFilter, setStatusFilter] = useState('전체');

  const issued = useCountUp(18420);
  const periods = ['이번 주','이번 달','최근 90일'];
  const cyclePeriod = ()=>{
    const i = periods.indexOf(period);
    setPeriod(periods[(i+1)%periods.length]);

  const toggleSegment = (s)=>{
    setSegments(prev=>{

    });

  return (

      </div>

      <div className="stat-row">
        <div className="stat-card">
          <div className="stat-label">이번 달 발급 수</div>
          <div className="stat-value">{issued.toLocaleString()}</div>
          <div className="stat-delta positive"><Icon name="trend-up" size={12}/>+12%</div>
          <Sparkline points={[8,12,10,15,13,18,20]} color="var(--primary)"/>
        </div>
        <div className="stat-card">
          <div className="stat-label">활성 템플릿</div>
          <div className="stat-value">24</div>
          <div className="stat-delta positive"><Icon name="trend-up" size={12}/>+3</div>
          <Sparkline points={[18,19,20,22,21,23,24]} color="var(--accent)"/>
        </div>
        <div className="stat-card">
          <div className="stat-label">평균 사용률</div>
          <div className="stat-value">61%</div>
          <div className="stat-delta negative"><Icon name="trend-down" size={12}/>-4%</div>
          <Sparkline points={[70,68,66,64,63,62,61]} color="var(--danger)"/>
        </div>
        <div className="stat-card">
          <div className="stat-label">만료 임박 쿠폰</div>

function PaymentView({showToast}){
  const [statusFilter, setStatusFilter] = useState('전체');
  const [range, setRange] = useState('최근 7일');
  const filtered = statusFilter==='전체' ? PAYMENTS : PAYMENTS.filter(p=>p.status===statusFilter);
  const total = PAYMENTS.reduce((s,p)=>s+p.amount,0);
  const totalDiscount = PAYMENTS.reduce((s,p)=>s+p.discount,0);
  const ranges = ['최근 7일','최근 30일','최근 90일'];
  const cycleRange = ()=> setRange(ranges[(ranges.indexOf(range)+1)%ranges.length]);
  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <h1 className="page-title">결제내역 조회 및 정산 뷰</h1>
          <div className="page-actions">
            <button className="btn-secondary" onClick={cycleRange}><Icon name="calendar-blank" size={14}/>{range}</button>
            <button className="btn-primary" onClick={()=>showToast('정산 리포트를 생성합니다')}><Icon name="download-simple" size={14}/>정산 리포트</button>
          </div>
        </div>
      </div>
      <div className="stat-row" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="stat-card"><div className="stat-label">총 결제 금액</div><div className="stat-value">{total.toLocaleString()}원</div><Sparkline points={[4,6,5,7,8,7,9]} color="var(--primary)"/></div>
        <div className="stat-card"><div className="stat-label">쿠폰 할인 총액</div><div className="stat-value">{totalDiscount.toLocaleString()}원</div><Sparkline points={[2,3,3,4,5,5,6]} color="var(--accent)"/></div>
        <div className="stat-card"><div className="stat-label">순 결제 금액</div><div className="stat-value">{(total-totalDiscount).toLocaleString()}원</div><Sparkline points={[4,5,5,6,6,7,7]} color="var(--amber)"/></div>
      </div>
      <div className="data-toolbar">
        <input className="search-input" placeholder="거래 ID 또는 상품명 검색…"/>
        {['전체','success','pending','fail'].map(s=>(
          <button key={s} className={"filter-chip"+(statusFilter===s?' active':'')} onClick={()=>setStatusFilter(s)}>
            {s==='전체'?'전체':s==='success'?'완료':s==='pending'?'대기':'환불'}
          </button>
        ))}
      </div>
      <div className="data-table-wrap">
        <table className="data-table">
          <thead><tr><th>거래 ID</th><th>결제 일시</th><th>상품</th><th>적용 쿠폰</th><th>할인액</th><th>결제 금액</th><th>상태</th></tr></thead>
          <tbody>
            {filtered.map(p=>(
              <tr key={p.id}>
                <td>{p.id}</td><td>{p.date}</td><td>{p.item}</td><td>{p.coupon}</td>
                <td>{p.discount.toLocaleString()}원</td><td>{p.amount.toLocaleString()}원</td>
                <td><span className={"badge "+p.status}>{p.status==='success'?'완료':p.status==='pending'?'대기':'환불'}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ReleaseView({showToast}){
  const [state, setState] = useState(CHECKLIST);
  const [cat, setCat] = useState('전체');
  const cats = ['전체', ...Object.keys(CHECKLIST)];
  const toggle = (group, id)=>{
    setState(prev=>{
      const next = {...prev, [group]: prev[group].map(i=>i.id===id?{...i, done:!i.done}:i)};
      showToast('체크리스트 상태가 갱신되었습니다');
      return next;
    });
  };
  const allItems = Object.values(state).flat();
  const doneCount = allItems.filter(i=>i.done).length;
  const ready = doneCount===allItems.length;
  const groups = cat==='전체' ? Object.entries(state) : [[cat, state[cat]]];

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <h1 className="page-title">스토어 출시 QA 체크리스트 대시보드</h1>
          <span className={"readiness-badge "+(ready?'ready':'pending')}>
            <Icon name={ready?'check-circle':'clock-countdown'} size={14}/>
            {ready?'제출 가능':`준비 중 (${doneCount}/${allItems.length})`}
          </span>
        </div>
      </div>
      <div className="haze-callout">
        <Icon name="info" size={15} style={{marginTop:1}}/>
        미완료 항목이 하나라도 있으면 제출 준비 상태 배지가 자동으로 미완료로 표시됩니다.
      </div>
      <div className="checklist-tabs">
        {cats.map(c=>(<button key={c} className={"filter-chip"+(cat===c?' active':'')} onClick={()=>setCat(c)}>{c}</button>))}
      </div>
      {groups.map(([g, list])=>(
        <div className="checklist-group" key={g}>
          <div className="checklist-group-title">{g}</div>
          {list.map(item=>(
            <div className="checklist-row" key={item.id}>
              <button className={"check-toggle"+(item.done?' done':'')} onClick={()=>toggle(g, item.id)}>
                {item.done && <Icon name="check" size={13}/>}
              </button>
              <span className={"checklist-name"+(item.done?' done':'')}>{item.name}</span>
              <span className="assignee-tag">{item.assignee}</span>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);
  const showToast = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null), 2600); };
  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar view={view} setView={setView}/>
      <main className="main">
        {view==='main' && <MainView showToast={showToast}/>}
        {view==='payment' && <PaymentView showToast={showToast}/>}
        {view==='analytics' && <AnalyticsView/>}
        {view==='release' && <ReleaseView showToast={showToast}/>}
      </main>
      <Toast message={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
