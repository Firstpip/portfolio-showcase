<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>웰컴라이드 콘솔 — 차량 이용가이드 통합 운영</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --primary:#da56ce;
  --secondary:#d1d1d1;
  --accent:#97ff64;
  --bg:#ffffff;
  --surface:#e5e5e7;
  --text:#090a0c;
  --text2:#95979e;
  --border:#dcdcdf;
  --danger:#e0507a;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.text-display-sm{font-size:42px;letter-spacing:-2.1px;line-height:1.02;font-weight:600;margin:0;}
.text-heading{font-size:24px;letter-spacing:-0.48px;line-height:1.25;font-weight:600;margin:0;}
.text-heading-sm{font-size:22px;line-height:1.25;font-weight:600;margin:0;}
.text-subheading{font-size:18px;letter-spacing:-0.36px;line-height:1.5;font-weight:600;margin:0;}
.text-body-lg{font-size:16px;letter-spacing:-0.16px;line-height:1.5;}
.text-body{font-size:14px;letter-spacing:-0.14px;line-height:1.5;}
.text-caption{font-size:11px;letter-spacing:-0.1px;line-height:1.38;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes ping{
  0%{transform:scale(1);opacity:.9;}
  75%,100%{transform:scale(2.2);opacity:0;}
}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}

.screen-enter{animation:fadeInUp .35s ease both;}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

.topnav{
  width:100%;height:64px;flex-shrink:0;position:sticky;top:0;z-index:30;
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;
}
.topnav-left{display:flex;align-items:center;gap:28px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-0.3px;}
.tab-list{display:flex;gap:4px;}
.tab-item{
  padding:10px 16px;border-radius:9999px;font-size:13.5px;font-weight:600;color:var(--text2);
  position:relative;transition:background .15s ease,color .15s ease;
}
.tab-item:hover{background:var(--surface);color:var(--text);transform:scale(1.03);}
.rail-item:hover{transform:scale(1.01);}
.tab-item.active{background:var(--text);color:#fff;}
.topnav-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);color:var(--text2);position:relative;
}
.icon-btn:hover{background:var(--surface);color:var(--text);}
.avatar-btn{
  width:36px;height:36px;border-radius:9999px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
}
.profile-drop{
  position:absolute;top:52px;right:32px;background:#fff;border:1px solid var(--border);
  border-radius:10px;padding:8px;width:180px;box-shadow:0 8px 24px rgba(9,10,12,0.12);z-index:40;
  animation:fadeInUp .18s ease both;
}
.profile-drop button{width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;}
.profile-drop button:hover{background:var(--surface);}

.hero-band{width:100%;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fdf3fc 0%,#ffffff 100%);}
.hero-inner{max-width:1320px;margin:0 auto;padding:28px 32px 22px;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.hero-quick{display:flex;gap:10px;}
.hero-stats{display:flex;gap:0;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;flex-wrap:wrap;}
.hero-stat{padding:0 24px;border-right:1px solid var(--border);}
.hero-stat:first-child{padding-left:0;}
.hero-stat:last-child{border-right:none;}
.hero-stat .num{font-size:19px;font-weight:700;letter-spacing:-0.4px;}
.hero-stat .lbl{font-size:11.5px;color:var(--text2);margin-top:2px;}

.page-body{max-width:1320px;margin:0 auto;width:100%;padding:26px 32px 60px;flex:1;}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9999px;font-weight:600;font-size:13.5px;padding:10px 18px;transition:transform .12s ease,background .15s ease,opacity .15s ease;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{opacity:0.9;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface);}
.btn-outline.active{background:var(--text);color:#fff;border-color:var(--text);}
.btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger);}
.btn-danger:hover{background:#fdecf1;}
.btn-sm{padding:7px 13px;font-size:12.5px;}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:9999px;padding:4px 10px;font-size:11px;font-weight:600;}
.tag-done{background:rgba(151,255,100,0.22);color:#3f8a1f;}
.tag-pending{background:rgba(218,86,206,0.12);color:var(--primary);}
.tag-fail{background:rgba(224,80,122,0.12);color:var(--danger);}
.tag-neutral{background:var(--surface);color:var(--text2);}

.card{background:#fff;border:1px solid var(--border);border-radius:10px;}

.master-detail{display:flex;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:560px;}
.list-rail{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:#fcfcfd;}
.list-rail-head{padding:16px;border-bottom:1px solid var(--border);}
.rail-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9999px;padding:8px 14px;background:#fff;}
.rail-search input{border:none;outline:none;background:transparent;font-size:13px;flex:1;}
.rail-items{overflow-y:auto;flex:1;}
.rail-item{
  padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s ease;
}
.rail-item:hover{background:var(--surface);}
.rail-item.selected{background:#fdf1fc;border-left:3px solid var(--primary);}
.rail-item-top{display:flex;justify-content:space-between;align-items:center;}
.rail-item-name{font-size:13.5px;font-weight:700;}
.rail-item-cat{font-size:11px;color:var(--text2);margin-top:2px;}
.rail-badges{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}

.detail-panel{flex:1;min-width:0;padding:26px 28px;overflow-y:auto;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.detail-actions{display:flex;gap:8px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin:18px 0 8px;}
.field-textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;
  line-height:1.6;resize:vertical;min-height:96px;color:var(--text);background:#fcfcfd;
}
.dropzone{
  border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--text2);
  background:#fcfcfd;
}
.lang-status-row{display:flex;gap:8px;flex-wrap:wrap;}

.data-table{width:100%;border-collapse:collapse;}
.data-table th{
  text-align:left;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;
  padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;
}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#fcfcfd;}
.qr-mini{
  width:34px;height:34px;border-radius:6px;border:1px solid var(--border);
  background:
    linear-gradient(90deg, var(--text) 0 5px, transparent 5px 10px) 0 0/100% 10px repeat-y,
    linear-gradient(0deg, var(--text) 0 5px, transparent 5px 10px) 0 0/10px 100% repeat-x;
  background-color:#fff;position:relative;
}
.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;}
.checkbox.checked{background:var(--primary);border-color:var(--primary);color:#fff;}
.history-row{padding:10px 14px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;gap:10px;}
.history-row:last-child{border-bottom:none;}

.diff-layout{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.diff-col{padding:20px;}
.diff-col + .diff-col{border-left:1px solid var(--border);}
.diff-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.diff-text{font-size:13.5px;line-height:1.7;background:#fcfcfd;border:1px solid var(--border);border-radius:8px;padding:14px;min-height:140px;}
.diff-text.editable{outline:none;}
.queue-row{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;
}
.queue-row:hover{background:var(--surface);}
.queue-row.selected{background:#fdf1fc;}
.state-actions{display:flex;gap:8px;margin-top:16px;}

.chart-card{padding:20px;}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.chart-box{width:100%;height:260px;position:relative;}
.filter-chip-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(9,10,12,0.45);
  display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;
}
.modal-box{width:380px;background:#fff;border-radius:14px;padding:26px;position:relative;animation:fadeInUp .22s ease both;}
.modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--surface);}

.toast-stack{position:fixed;bottom:28px;right:28px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;animation:slideInRight .22s ease both;min-width:220px;
}
.toast.fail{background:var(--danger);}
.toast i{color:var(--accent);}
.toast.fail i{color:#fff;}

.bar-track{height:8px;border-radius:9999px;background:var(--surface);overflow:hidden;margin-top:4px;}
.bar-fill{height:100%;border-radius:9999px;background:var(--primary);transform-origin:left;animation:barGrow .8s ease both;}

.live-dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;}
.live-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--primary);animation:ping 1.8s ease-out infinite;}

.app-footer{width:100%;border-top:1px solid var(--border);background:#fcfcfd;}
.app-footer-inner{max-width:1320px;margin:0 auto;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.app-footer-links{display:flex;gap:18px;}
.footer-link{font-size:12.5px;color:var(--text2);font-weight:600;}
.footer-link:hover{color:var(--primary);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { BarChart, Bar, LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Legend } = Recharts;

const NAV_ITEMS = [
  { key: 'main', label: '가이드 콘텐츠 통합 관리', icon: 'ph-notebook' },
  { key: 'qr-management', label: 'QR/링크 발급 관리', icon: 'ph-qr-code' },
  { key: 'translation-quality', label: '다국어 번역 품질 관리', icon: 'ph-translate' },
  { key: 'stats', label: '차종별 가이드 열람 통계', icon: 'ph-chart-bar' },
];

const TITLES = {
  'main': ['가이드 콘텐츠 통합 관리', '차종별 원고와 번역 상태를 한 화면에서 관리합니다'],
  'qr-management': ['QR / 링크 발급 관리', '차종별 QR코드와 링크를 조회하고 재발급합니다'],
  'translation-quality': ['다국어 번역 품질 관리', '자동 번역 결과를 검수하고 승인 상태를 관리합니다'],
  'stats': ['차종별 가이드 열람 통계', '기간 · 차종 · 언어별 열람 및 QR 스캔 현황을 확인합니다'],
};

const LANGS = ['en', 'zh', 'ja'];
const LANG_LABEL = { ko: '한국어', en: 'English', zh: '中文', ja: '日本語' };

const GUIDES = [
  { id: 'avante', name: '아반떼', category: '경제형 · 5인승', updated: '2026.07.29', content: '연료는 가솔린이며 주유구는 운전석 뒤쪽에 있습니다. 주차 시 사이드미러가 자동으로 접힙니다. 트렁크는 실내 레버 또는 스마트키로만 개방됩니다.', status: { en: 'done', zh: 'done', ja: 'pending' } },
  { id: 'k5', name: 'K5', category: '중형 · 5인승', updated: '2026.07.28', content: '하이패스 단말기가 기본 장착되어 있습니다. 무선충전 패드는 콘솔박스 앞쪽입니다. 전방 충돌 경고음이 울리면 즉시 감속하세요.', status: { en: 'done', zh: 'pending', ja: 'pending' } },
  { id: 'carnival', name: '카니발', category: '대형 · 9인승', updated: '2026.07.30', content: '전동 슬라이딩 도어는 리모컨 버튼으로 여닫습니다. 3열 좌석은 접이식이며 트렁크 공간 확보가 가능합니다.', status: { en: 'done', zh: 'done', ja: 'done' } },
  { id: 'starex', name: '스타렉스', category: '승합 · 11인승', updated: '2026.07.22', content: '디젤 차량으로 주유 시 경유를 넣어야 합니다. 탑승 인원이 많을 경우 안전벨트 착용을 재확인하세요.', status: { en: 'pending', zh: 'pending', ja: 'pending' } },
  { id: 'grandeur', name: '그랜저', category: '대형세단 · 5인승', updated: '2026.07.26', content: '스마트 트렁크 기능으로 차 뒤에서 대기하면 자동으로 열립니다. 통풍/열선 시트 버튼은 센터 콘솔에 있습니다.', status: { en: 'done', zh: 'done', ja: 'pending' } },
  { id: 'ray', name: '레이', category: '경차 · 4인승', updated: '2026.07.20', content: '슬라이딩 도어로 좁은 주차공간에서도 승하차가 편리합니다. 연비 절감을 위해 에코 모드 버튼을 활용하세요.', status: { en: 'done', zh: 'pending', ja: 'done' } },
];

const QR_ROWS = GUIDES.map((g, i) => ({
  id: g.id, name: g.name, issued: '2026.0' + (7 - (i % 3)) + '.1' + (i + 1), link: 'welcomeride.example/g/' + g.id,
  expiring: i % 4 === 0, history: [
    { at: '2026.06.02', ev: '최초 발급' },
    { at: '2026.07.0' + (i + 1), ev: '재발급 (만료 갱신)' },
  ]
}));

const CHART_DATA_VIEWS = [
  { name: '아반떼', views: 412 }, { name: 'K5', views: 356 }, { name: '카니발', views: 298 },
  { name: '스타렉스', views: 184 }, { name: '그랜저', views: 267 }, { name: '레이', views: 143 },
];
const CHART_DATA_TREND = [
  { day: '7/24', scans: 58 }, { day: '7/25', scans: 74 }, { day: '7/26', scans: 61 },
  { day: '7/27', scans: 88 }, { day: '7/28', scans: 95 }, { day: '7/29', scans: 102 }, { day: '7/30', scans: 132 },
];
const CHART_DATA_LANG = [
  { name: 'KO', value: 28 }, { name: 'EN', value: 34 }, { name: 'ZH', value: 22 }, { name: 'JA', value: 16 },
];
const PIE_COLORS = ['#95979e', '#da56ce', '#97ff64', '#5683da'];

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = (msg, fail) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, fail }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };
  return [toasts, push];
}

function ToastStack({ toasts }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div className={"toast" + (t.fail ? " fail" : "")} key={t.id}>
          <i className={"ph " + (t.fail ? "ph-x-circle" : "ph-check-circle")}></i>{t.msg}
        </div>
      ))}
    </div>
  );
}

function TopNav({ screen, setScreen, showToast }) {
  const [profileOpen, setProfileOpen] = useState(false);
  return (
    <header className="topnav">
      <div className="topnav-left">
        <div className="brand">
          <div className="brand-mark"><i className="ph ph-steering-wheel"></i></div>
          <div className="brand-name">웰컴라이드 콘솔</div>
        </div>
        <div className="tab-list">
          {NAV_ITEMS.map(item => (
            <button key={item.key} className={"tab-item" + (screen === item.key ? " active" : "")} onClick={() => setScreen(item.key)}>
              {item.label}
            </button>
          ))}
        </div>
      </div>
      <div className="topnav-right" style={{ position: 'relative' }}>
        <button className="icon-btn" onClick={() => showToast('알림함을 확인했습니다')}><i className="ph ph-bell"></i></button>
        <button className="icon-btn" onClick={() => showToast('검색을 실행했습니다')}><i className="ph ph-magnifying-glass"></i></button>
        <button className="avatar-btn" onClick={() => setProfileOpen(!profileOpen)}>운영</button>
        {profileOpen && (
          <div className="profile-drop">
            <button onClick={() => { setProfileOpen(false); showToast('계정 설정을 열었습니다'); }}><i className="ph ph-gear"></i>계정 설정</button>
            <button onClick={() => { setProfileOpen(false); showToast('로그아웃 되었습니다'); }}><i className="ph ph-sign-out"></i>로그아웃</button>
          </div>
        )}
      </div>
    </header>
  );
}

function HeroBand({ screen, setScreen, showToast }) {
  return (
    <div className="hero-band">
      <div className="hero-inner">
        <div className="hero-top">
          <div>
            <div className="text-display-sm">{TITLES[screen][0]}</div>
            <div className="text-body" style={{ color: 'var(--text2)', marginTop: 6 }}>{TITLES[screen][1]}</div>
          </div>
          <div className="hero-quick">
            <button className="btn btn-outline" onClick={() => { setScreen('translation-quality'); showToast('번역 검수 큐로 이동했습니다'); }}>
              <i className="ph ph-clipboard-text"></i> 번역 검수 시작
            </button>
            <button className="btn btn-primary" onClick={() => showToast('새 가이드 등록 폼을 열었습니다')}>
              <i className="ph ph-plus"></i> 새 가이드 등록
            </button>
          </div>
        </div>
        <div className="hero-stats">
          <div className="hero-stat"><div className="num">6종</div><div className="lbl">등록 차종</div></div>
          <div className="hero-stat"><div className="num">83%</div><div className="lbl">번역 완료율</div></div>
          <div className="hero-stat"><div className="num">2,480회</div><div className="lbl">이번달 QR 스캔</div></div>
          <div className="hero-stat"><div className="num"><span className="live-dot" style={{ marginRight: 6 }}></span>실시간</div><div className="lbl">운영 상태</div></div>
        </div>
      </div>
    </div>
  );
}

function StatusTag({ status }) {
  if (status === 'done') return <span className="tag tag-done"><i className="ph ph-check"></i>완료</span>;
  if (status === 'pending') return <span className="tag tag-pending"><i className="ph ph-clock"></i>미승인</span>;
  return <span className="tag tag-fail"><i className="ph ph-x"></i>실패</span>;
}

function MainScreen({ showToast }) {
  const [guides, setGuides] = useState(GUIDES);
  const [selectedId, setSelectedId] = useState(GUIDES[0].id);
  const [query, setQuery] = useState('');
  const [draft, setDraft] = useState(GUIDES[0].content);

  const selected = guides.find(g => g.id === selectedId);
  const filtered = guides.filter(g => g.name.includes(query));

  function selectGuide(g) {
    setSelectedId(g.id);
    setDraft(g.content);
  }

  function save() {
    setGuides(gs => gs.map(g => g.id === selectedId ? { ...g, content: draft, updated: '2026.08.03' } : g));
    showToast(selected.name + ' 가이드를 저장했습니다');
  }

  return (
    <div className="screen-enter master-detail">
      <div className="list-rail">
        <div className="list-rail-head">
          <div className="rail-search">
            <i className="ph ph-magnifying-glass" style={{ color: 'var(--text2)' }}></i>
            <input placeholder="차종 검색" value={query} onChange={e => setQuery(e.target.value)} />
          </div>
        </div>
        <div className="rail-items">
          {filtered.map(g => (
            <div key={g.id} className={"rail-item" + (selectedId === g.id ? " selected" : "")} onClick={() => selectGuide(g)}>
              <div className="rail-item-top">
                <div className="rail-item-name">{g.name}</div>
                <i className="ph ph-caret-right" style={{ color: 'var(--text2)', fontSize: 14 }}></i>
              </div>
              <div className="rail-item-cat">{g.category} · {g.updated}</div>
              <div className="rail-badges">
                {LANGS.map(l => <span key={l} className={"tag " + (g.status[l] === 'done' ? "tag-done" : "tag-pending")}>{LANG_LABEL[l]}</span>)}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="detail-panel" key={selectedId} style={{ animation: 'fadeInUp .25s ease both' }}>
        <div className="detail-head">
          <div>
            <div className="text-heading">{selected.name}</div>
            <div className="text-body" style={{ color: 'var(--text2)', marginTop: 4 }}>{selected.category} · 최종수정 {selected.updated}</div>
          </div>
          <div className="detail-actions">
            <button className="btn btn-outline btn-sm" onClick={() => showToast(selected.name + ' 가이드를 복제했습니다')}><i className="ph ph-copy"></i>복제</button>
            <button className="btn btn-danger btn-sm" onClick={() => showToast(selected.name + ' 가이드를 삭제 처리했습니다', true)}><i className="ph ph-trash"></i>삭제</button>
          </div>
        </div>

        <div className="field-label">번역 상태</div>
        <div className="lang-status-row">
          <span className="tag tag-neutral">KO 원문</span>
          {LANGS.map(l => <StatusTag key={l} status={selected.status[l]} />)}
        </div>

        <div className="field-label">한국어 원고</div>
        <textarea className="field-textarea" value={draft} onChange={e => setDraft(e.target.value)}></textarea>

        <div className="field-label">이미지 자료</div>
        <div className="dropzone">
          <i className="ph ph-image" style={{ fontSize: 22 }}></i>
          <div className="text-body" style={{ marginTop: 6 }}>이미지를 드래그하거나 클릭하여 업로드</div>
        </div>

        <button className="btn btn-primary" style={{ marginTop: 22 }} onClick={save}><i className="ph ph-floppy-disk"></i>변경사항 저장</button>
      </div>
    </div>
  );
}

function QrManagementScreen({ showToast }) {
  const [selected, setSelected] = useState([]);
  const [openHistory, setOpenHistory] = useState(null);
  const [processing, setProcessing] = useState(false);

  function toggle(id) {
    setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  }

  function bulkReissue() {
    if (!selected.length) { showToast('재발급할 항목을 선택하세요', true); return; }
    setProcessing(true);
    setTimeout(() => {
      setProcessing(false);
      const failCount = selected.includes('starex') ? 1 : 0;
      const okCount = selected.length - failCount;
      showToast(okCount + '건 재발급 완료' + (failCount ? ', ' + failCount + '건 실패(재시도 필요)' : ''), failCount > 0);
      setSelected([]);
    }, 1000);
  }

  return (
    <div className="screen-enter">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <div className="text-body" style={{ color: 'var(--text2)' }}>{selected.length}개 선택됨</div>
        <button className="btn btn-primary" onClick={bulkReissue}>
          <i className="ph ph-arrows-clockwise"></i>{processing ? '재발급 처리 중...' : '선택 항목 일괄 재발급'}
        </button>
      </div>
      <div className="card">
        <table className="data-table">
          <thead>
            <tr>
              <th></th><th>차종</th><th>QR 미리보기</th><th>연결 링크</th><th>발급일</th><th>상태</th><th>액션</th>
            </tr>
          </thead>
          <tbody>
            {QR_ROWS.map(row => (
              <React.Fragment key={row.id}>
                <tr>
                  <td>
                    <div className={"checkbox" + (selected.includes(row.id) ? " checked" : "")} onClick={() => toggle(row.id)}>
                      {selected.includes(row.id) && <i className="ph ph-check" style={{ fontSize: 11 }}></i>}
                    </div>
                  </td>
                  <td style={{ fontWeight: 700 }}>{row.name}</td>
                  <td><div className="qr-mini"></div></td>
                  <td style={{ color: 'var(--text2)' }}>{row.link}</td>
                  <td>{row.issued}</td>
                  <td>{row.expiring ? <span className="tag tag-pending"><i className="ph ph-clock"></i>만료 임박</span> : <span className="tag tag-done"><i className="ph ph-check"></i>정상</span>}</td>
                  <td style={{ display: 'flex', gap: 6 }}>
                    <button className="btn btn-outline btn-sm" onClick={() => showToast(row.name + ' QR 이미지를 다운로드했습니다')}><i className="ph ph-download-simple"></i>다운로드</button>
                    <button className="btn btn-outline btn-sm" onClick={() => setOpenHistory(openHistory === row.id ? null : row.id)}><i className="ph ph-clock-counter-clockwise"></i>이력</button>
                  </td>
                </tr>
                {openHistory === row.id && (
                  <tr>
                    <td colSpan="7" style={{ padding: 0, background: '#fcfcfd' }}>
                      {row.history.map((h, i) => (
                        <div className="history-row" key={i}><i className="ph ph-git-commit" style={{ color: 'var(--primary)' }}></i>{h.at} · {h.ev}</div>
                      ))}
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function TranslationQualityScreen({ showToast }) {
  const queue = [];
  GUIDES.forEach(g => LANGS.forEach(l => { if (g.status[l] === 'pending') queue.push({ guideId: g.id, name: g.name, lang: l, ko: g.content }); }));

  const [items, setItems] = useState(queue);
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [draft, setDraft] = useState(queue[0] ? mockTranslate(queue[0].ko, queue[0].lang) : '');

  function mockTranslate(ko, lang) {
    if (lang === 'en') return '(auto) ' + ko.slice(0, 40) + '...';
    if (lang === 'zh') return '(自动) ' + ko.slice(0, 40) + '...';
    return '(自動) ' + ko.slice(0, 40) + '...';
  }

  function selectItem(i) {
    setSelectedIdx(i);
    setDraft(mockTranslate(items[i].ko, items[i].lang));
  }

  function resolve(action) {
    const target = items[selectedIdx];
    showToast(target.name + ' (' + LANG_LABEL[target.lang] + ') ' + (action === 'approve' ? '승인 처리했습니다' : action === 'reject' ? '반려 처리했습니다' : '수정요청으로 전환했습니다'), action === 'reject');
    const next = items.filter((_, i) => i !== selectedIdx);
    setItems(next);
    setSelectedIdx(0);
    setDraft(next[0] ? mockTranslate(next[0].ko, next[0].lang) : '');
  }

  const current = items[selectedIdx];

  return (
    <div className="screen-enter" style={{ display: 'flex', gap: 20 }}>
      <div className="card" style={{ width: 260, flexShrink: 0, borderRadius: 10 }}>
        <div style={{ padding: '14px 16px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between' }}>
          <span className="text-body" style={{ fontWeight: 700 }}>검수 대기열</span>
          <span className="tag tag-pending">{items.length}건</span>
        </div>
        {items.map((it, i) => (
          <div key={it.guideId + it.lang} className={"queue-row" + (selectedIdx === i ? " selected" : "")} onClick={() => selectItem(i)}>
            <span className="text-body">{it.name} · {LANG_LABEL[it.lang]}</span>
            <i className="ph ph-caret-right" style={{ fontSize: 13, color: 'var(--text2)' }}></i>
          </div>
        ))}
        {!items.length && <div className="text-body" style={{ padding: 16, color: 'var(--text2)' }}>모든 번역이 검수 완료되었습니다</div>}
      </div>

      {current ? (
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="diff-layout">
            <div className="diff-col">
              <div className="diff-col-head"><span className="text-body" style={{ fontWeight: 700 }}>원문 (한국어)</span><span className="tag tag-neutral">원문</span></div>
              <div className="diff-text">{current.ko}</div>
            </div>
            <div className="diff-col">
              <div className="diff-col-head"><span className="text-body" style={{ fontWeight: 700 }}>번역문 ({LANG_LABEL[current.lang]})</span><span className="tag tag-pending">미승인</span></div>
              <div className="diff-text editable" contentEditable suppressContentEditableWarning onInput={e => setDraft(e.currentTarget.textContent)}>{draft}</div>
            </div>
          </div>
          <div className="state-actions">
            <button className="btn btn-primary" onClick={() => resolve('approve')}><i className="ph ph-check-circle"></i>승인</button>
            <button className="btn btn-outline" onClick={() => resolve('request')}><i className="ph ph-pencil-simple"></i>수정요청</button>
            <button className="btn btn-danger" onClick={() => resolve('reject')}><i className="ph ph-x-circle"></i>반려</button>
          </div>
        </div>
      ) : (
        <div className="card" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text2)' }}>검수할 항목이 없습니다</div>
      )}
    </div>
  );
}

function StatsScreen({ showToast }) {
  const [range, setRange] = useState('7d');
  const [langFilter, setLangFilter] = useState('all');

  return (
    <div className="screen-enter">
      <div className="filter-chip-row">
        {[['7d', '최근 7일'], ['30d', '최근 30일'], ['all', '전체 기간']].map(([k, l]) => (
          <button key={k} className={"btn btn-outline btn-sm" + (range === k ? " active" : "")} onClick={() => setRange(k)}>{l}</button>
        ))}
        <div style={{ width: 1, background: 'var(--border)', margin: '0 6px' }}></div>
        {['all', 'ko', 'en', 'zh', 'ja'].map(l => (
          <button key={l} className={"btn btn-outline btn-sm" + (langFilter === l ? " active" : "")} onClick={() => { setLangFilter(l); showToast('언어 필터를 적용했습니다'); }}>{l === 'all' ? '전체 언어' : LANG_LABEL[l]}</button>
        ))}
        <div style={{ flex: 1 }}></div>
        <button className="btn btn-primary btn-sm" onClick={() => showToast('통계 CSV 파일을 생성했습니다')}><i className="ph ph-file-csv"></i>CSV로 내보내기</button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 18 }}>
        <div className="card chart-card">
          <div className="chart-head"><span className="text-subheading">차종별 열람 건수</span><span className="tag tag-neutral">{range === '7d' ? '최근 7일' : range === '30d' ? '최근 30일' : '전체'}</span></div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={CHART_DATA_VIEWS}>
                <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false} />
                <XAxis dataKey="name" tick={{ fontSize: 12, fill: '#95979e' }} axisLine={{ stroke: '#dcdcdf' }} tickLine={false} />
                <YAxis tick={{ fontSize: 12, fill: '#95979e' }} axisLine={false} tickLine={false} />
                <Tooltip />
                <Bar dataKey="views" fill="#da56ce" radius={[6, 6, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card chart-card">
          <div className="chart-head"><span className="text-subheading">언어별 비중</span></div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={CHART_DATA_LANG} dataKey="value" nameKey="name" innerRadius={55} outerRadius={85} paddingAngle={3}>
                  {CHART_DATA_LANG.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip />
                <Legend iconType="circle" wrapperStyle={{ fontSize: 12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card chart-card" style={{ gridColumn: '1 / -1' }}>
          <div className="chart-head"><span className="text-subheading">기간별 QR 스캔 추이</span><span className="text-caption" style={{ color: 'var(--text2)' }}>최근 7일</span></div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={CHART_DATA_TREND}>
                <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false} />
                <XAxis dataKey="day" tick={{ fontSize: 12, fill: '#95979e' }} axisLine={{ stroke: '#dcdcdf' }} tickLine={false} />
                <YAxis tick={{ fontSize: 12, fill: '#95979e' }} axisLine={false} tickLine={false} />
                <Tooltip />
                <Line type="monotone" dataKey="scans" stroke="#da56ce" strokeWidth={2.5} dot={{ r: 3, fill: '#da56ce' }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, showToast] = useToasts();

  return (
    <div className="app-shell">
      <TopNav screen={screen} setScreen={setScreen} showToast={showToast} />
      <HeroBand screen={screen} setScreen={setScreen} showToast={showToast} />
      <main className="page-body">
        {screen === 'main' && <MainScreen showToast={showToast} />}
        {screen === 'qr-management' && <QrManagementScreen showToast={showToast} />}
        {screen === 'translation-quality' && <TranslationQualityScreen showToast={showToast} />}
        {screen === 'stats' && <StatsScreen showToast={showToast} />}
      </main>
      <footer className="app-footer">
        <div className="app-footer-inner">
          <div className="text-caption" style={{ color: 'var(--text2)' }}>© 2026 웰컴라이드 콘솔 — 자체 개발 프로젝트</div>
          <div className="app-footer-links">
            <button className="footer-link" onClick={() => showToast('운영 가이드 문서를 열었습니다')}>운영 가이드</button>
            <button className="footer-link" onClick={() => showToast('API 문서를 열었습니다')}>API 문서</button>
            <button className="footer-link" onClick={() => showToast('버전 정보를 확인했습니다')}>v1.0 데모</button>
          </div>
        </div>
      </footer>
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
