  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(250,93,0,0.5);}
    70%{box-shadow:0 0 0 8px rgba(250,93,0,0);}
    100%{box-shadow:0 0 0 0 rgba(250,93,0,0);}
  }
  @keyframes toastSlideIn{
    from{opacity:0;transform:translate(-50%,16px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  @keyframes shimmerMove{
    0%{background-position:-200px 0;}
    100%{background-position:200px 0;}
  }
  @keyframes rippleAnim{
    from{transform:scale(0);opacity:0.5;}
    to{transform:scale(2.4);opacity:0;}
  }
  @keyframes barGrow{
    from{transform:scaleX(0);}
    to{transform:scaleX(1);}
  }

  .fade-in{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both;}
  .live-dot{
    width:9px;height:9px;border-radius:50%;background:var(--primary);
    animation:pulseDot 2s infinite;
    display:inline-block;

  .toast{animation:toastSlideIn .3s cubic-bezier(.16,1,.3,1) both;}

  .ripple-span{

    pointer-events:none;

  .hover-lift{transition:transform .18s ease, box-shadow .18s ease;}

  .bar-fill{transform-origin:left;animation:barGrow 1s cubic-bezier(.16,1,.3,1) both;}

  .btn-primary{

  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{
    background:transparent;color:var(--primary);font-weight:500;font-size:14px;
    padding:10px 18px;border-radius:var(--radius-btn);border:1px solid var(--border);
    transition:border-color .15s ease, background .15s ease;

  .btn-ghost:hover{background:#fef1e4;border-color:var(--primary);}
  .btn-disabled{
    background:#efe9e3;color:#a5a19c;font-weight:500;font-size:14px;
    padding:10px 18px;border-radius:var(--radius-btn);cursor:not-allowed;
  }

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;

  .badge-orange{background:#ffe8d6;color:#c24b00;}
  .badge-green{background:#dff5ec;color:#1a8b5f;}
  .badge-red{background:#fde3df;color:#c0311a;}
  .badge-gray{background:#efe9e3;color:#615f5c;}
  .badge-teal{background:#dbfaf5;color:#0f8f7c;}

    display:flex;align-items:center;justify-content:center;z-index:200;
    padding:24px;

  .tab-btn{
    padding:9px 16px;font-size:13.5px;font-weight:600;border-radius:999px;

  .tab-btn:not(.active):hover{background:#fef1e4;}

  th{
    text-align:left;font-size:12px;font-weight:600;color:var(--text-2);

function Icon({ name, size=18, className='' }) {
  const ref = useRef(null);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
  return <i data-lucide={name} className={className} style={{ width:size, height:size }} ref={ref}></i>;
}

function useRipple() {
  return (e) => {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const span = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    span.className = 'ripple-span';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 620);
  };
}

function CountUp({ value, duration=900, suffix='' }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / duration);
      setN(Math.floor(value * (1 - Math.pow(1-p, 3))));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span>{n.toLocaleString()}{suffix}</span>;
}

function Toast({ toast }) {

    }}>
      <Icon name="check-circle" size={16} />
      {toast}
    </div>
  );
}

}

function FormField({ label, placeholder, value, readOnly }) {
  const [v, setV] = useState(value || '');
  return (
    <label style={{ display:'block' }}>
      <div style={{ fontSize:12.5, fontWeight:600, color:'var(--text-2)', marginBottom:6 }}>{label}</div>
      <input
        readOnly={readOnly}
        value={v}
        placeholder={placeholder}
        onChange={e => setV(e.target.value)}
        style={{
          width:'100%', padding:'11px 14px', borderRadius:14, border:'1px solid var(--secondary)',
          fontSize:14, background: readOnly ? '#f7f2ec' : '#fff', outline:'none'
        }}
      />
    </label>
  );
}

function ProductionScreen({ setToast }) {
  const [rows, setRows] = useState(PRODUCTION_ROWS_INIT);
  const ripple = useRipple();

  const addRow = () => {
    setRows(prev => [...prev, { id:Date.now(), date:'2026.08.03', site:'', product:'', qty:0, workers:0, defect:0 }]);
  };
  const updateCell = (id, key, value) => {
    setRows(prev => prev.map(r => r.id === id ? { ...r, [key]: value } : r));
  };
  const save = () => setToast('생산일보가 저장되었습니다');

  const consumption = useMemo(() => {
    const acc = {};
    rows.forEach(r => {
      const prod = PRODUCTS.find(p => p.name === r.product);
      if (!prod) return;
      prod.bom.forEach(b => { acc[b.mat] = (acc[b.mat] || 0) + b.ratio * Number(r.qty || 0); });
    });
    return acc;
  }, [rows]);

  const goodQty = rows.reduce((s,r) => s + Number(r.qty||0) - Number(r.defect||0), 0);
  const defectQty = rows.reduce((s,r) => s + Number(r.defect||0), 0);

  return (
    <div className="fade-in" style={{ display:'grid', gridTemplateColumns:'1fr 300px', gap:20 }}>
      <div className="card" style={{ padding:22 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:600 }}>생산일보 입력 (그리드)</h3>
          <div style={{ display:'flex', gap:10 }}>
            <button className="btn-ghost ripple-btn" onMouseDown={ripple} onClick={addRow}>+ 행 추가</button>
            <button className="btn-primary ripple-btn" onMouseDown={ripple} onClick={save}>저장</button>
          </div>
        </div>
        <div style={{ overflowX:'auto' }}>
          <table>
            <thead>
              <tr>
                <th>일자</th><th>현장</th><th>제품</th><th style={{textAlign:'right'}}>수량</th>
                <th style={{textAlign:'right'}}>인원</th><th style={{textAlign:'right'}}>불량</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.id}>
                  <td className="grid-cell"><input value={r.date} onChange={e => updateCell(r.id,'date',e.target.value)} /></td>
                  <td className="grid-cell">
                    <select value={r.site} onChange={e => updateCell(r.id,'site',e.target.value)} style={{ width:'100%', border:'none', background:'transparent', fontSize:13.5 }}>
                      <option value="">현장 선택</option>
                      {SITES.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                    </select>
                  </td>
                  <td className="grid-cell">
                    <select value={r.product} onChange={e => updateCell(r.id,'product',e.target.value)} style={{ width:'100%', border:'none', background:'transparent', fontSize:13.5 }}>
                      <option value="">제품 선택</option>
                      {PRODUCTS.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                    </select>
                  </td>
                  <td className="grid-cell"><input type="number" value={r.qty} onChange={e => updateCell(r.id,'qty',e.target.value)} style={{ textAlign:'right' }} /></td>
                  <td className="grid-cell"><input type="number" value={r.workers} onChange={e => updateCell(r.id,'workers',e.target.value)} style={{ textAlign:'right' }} /></td>
                  <td className="grid-cell"><input type="number" value={r.defect} onChange={e => updateCell(r.id,'defect',e.target.value)} style={{ textAlign:'right' }} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{ display:'flex', gap:12, marginTop:18 }}>
          <div className="card" style={{ padding:'12px 18px', flex:1 }}>
            <div style={{ fontSize:12, color:'var(--text-2)' }}>완제품 상태 · 양품</div>
            <div style={{ fontSize:20, fontWeight:700 }}>{goodQty.toLocaleString()}개</div>
          </div>
          <div className="card" style={{ padding:'12px 18px', flex:1 }}>
            <div style={{ fontSize:12, color:'var(--text-2)' }}>완제품 상태 · 불량</div>
            <div style={{ fontSize:20, fontWeight:700, color:'#c0311a' }}>{defectQty.toLocaleString()}개</div>
          </div>
          <div className="card" style={{ padding:'12px 18px', flex:1 }}>
            <div style={{ fontSize:12, color:'var(--text-2)' }}>출고대기</div>
            <div style={{ fontSize:20, fontWeight:700 }}>{Math.max(0, goodQty - 40).toLocaleString()}개</div>
          </div>
        </div>
      </div>

      <div className="card hover-lift" style={{ padding:22, alignSelf:'start' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
          <Icon name="zap" size={16} />
          <h4 style={{ margin:0, fontSize:15, fontWeight:600 }}>자재 자동 차감</h4>
        </div>
        <div style={{ fontSize:12.5, color:'var(--text-2)', marginBottom:14 }}>
          BOM 매핑 기준으로 생산 수량 입력 시 실시간 계산됩니다
        </div>
        {Object.keys(consumption).length === 0 && (
          <div style={{ fontSize:13, color:'var(--text-2)' }}>제품과 수량을 입력하면 차감 내역이 표시됩니다.</div>

        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {Object.entries(consumption).map(([mat, qty]) => (
            <div key={mat} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid var(--border)', paddingBottom:10 }}>
              <span style={{ fontSize:13.5 }}>{mat}</span>
              <span style={{ fontWeight:700, color:'var(--primary)' }}>-{qty}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

        background:'#fff', boxShadow:'var(--shadow-lg)', overflow:'hidden'
      }}>
        <div style={{ background:'var(--primary)', color:'#fff', padding:'16px 20px', display:'flex', alignItems:'center', gap:10 }}>
          <Icon name="hard-hat" size={18} />
          <div style={{ fontWeight:700, fontSize:15 }}>시공일보 입력</div>
        </div>
        <div style={{ padding:20 }}>
          <FormField label="현장" placeholder="가평 A동 물류센터" value="가평 A동 물류센터" />
          <div style={{ height:12 }}></div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <FormField label="투입 인원" placeholder="8명" value="8" />
            <FormField label="시공 면적" placeholder="240㎡" value="240" />
          </div>
          <div style={{ height:14 }}></div>
          <div style={{ fontSize:12.5, fontWeight:600, color:'var(--text-2)', marginBottom:8 }}>투입 자재</div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:16 }}>
            {['단열판넬 50T ×12', '철골 H빔 300 ×6'].map(t => (
              <span key={t} className="badge badge-orange">{t}</span>
            ))}
          </div>

          <div style={{ fontSize:12.5, fontWeight:600, color:'var(--text-2)', marginBottom:8 }}>현장 사진</div>
          <div style={{ display:'flex', gap:8, marginBottom:16, flexWrap:'wrap' }}>
            {photos.map(p => (
              <img key={p} src={`https://picsum.photos/seed/mes-console-site-${p}/90/90`} style={{ width:74, height:74, borderRadius:12, objectFit:'cover' }} />
            ))}
            <button onClick={() => setPhotoOpen(true)} className="ripple-btn" style={{
              width:74, height:74, borderRadius:12, border:'2px dashed var(--secondary)',
              display:'flex', alignItems:'center', justifyContent:'center'
            }} onMouseDown={ripple}>
              <Icon name="camera" size={22} />
            </button>
          </div>

          <div style={{ marginBottom:20 }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:12.5, fontWeight:600, color:'var(--text-2)', marginBottom:8 }}>
              <span>시공 진척률</span><span>{progress}%</span>
            </div>
            <input type="range" min="0" max="100" value={progress} onChange={e => setProgress(Number(e.target.value))} style={{ width:'100%', accentColor:'#fa5d00' }} />
            <div style={{ height:8, background:'#f2e9dd', borderRadius:999, marginTop:8 }}>
              <div className="bar-fill" style={{ height:'100%', width:`${progress}%`, background:'var(--primary)', borderRadius:999 }}></div>
            </div>
          </div>

          <button className="btn-primary ripple-btn" onMouseDown={ripple} onClick={() => setToast('시공일보가 제출되었습니다')} style={{ width:'100%' }}>
            시공일보 제출
          </button>
        </div>
      </div>

      {photoOpen && (
        <Modal title="현장 사진 업로드" onClose={() => setPhotoOpen(false)}>
          <div style={{
            border:'2px dashed var(--border)', borderRadius:16, padding:'36px 20px', textAlign:'center', marginBottom:16
          }}>
            <Icon name="image-plus" size={30} />
            <div style={{ marginTop:10, fontWeight:600, fontSize:14 }}>모바일 카메라로 여러 장 촬영·업로드</div>
            <div style={{ fontSize:12, color:'var(--text-2)', marginTop:4 }}>AWS S3 프리사인드 URL로 즉시 전송됩니다</div>
          </div>
          <button className="btn-primary ripple-btn" onMouseDown={ripple} onClick={() => { addPhoto(); setPhotoOpen(false); setToast('사진 1장이 업로드되었습니다'); }} style={{ width:'100%' }}>
            촬영 시뮬레이션
          </button>
        </Modal>
      )}
    </div>
  );
}

/* ---------- shell ---------- */

const NAV = [
  { key:'main', label:'실시간 통합 대시보드', icon:'layout-dashboard' },
  { key:'master-data', label:'마스터데이터 관리', icon:'database' },
  { key:'production', label:'생산일보 관리', icon:'clipboard-list' },
  { key:'construction-mobile', label:'시공일보 관리', icon:'hard-hat' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [toast, setToastMsg] = useState(null);
  const [role, setRole] = useState('admin');

  const setToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2400);
  };

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const screenLabel = NAV.find(n => n.key === screen)?.label || '';

  return (
    <div style={{ display:'flex', width:'100%', minHeight:'100vh' }}>
      <aside style={{
        position:'fixed', left:0, top:0, bottom:0, width:236, background:'#fffaf3',
        borderRight:'1px solid var(--border)', padding:'22px 16px', display:'flex', flexDirection:'column'
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:9, padding:'0 8px', marginBottom:28 }}>
          <div style={{
            width:32, height:32, borderRadius:10, background:'var(--primary)',
            display:'flex', alignItems:'center', justifyContent:'center'
          }}>
            <Icon name="factory" size={17} className="text-white" />
          </div>
          <span style={{ fontWeight:700, fontSize:16.5 }}>라인허브</span>
        </div>

        <nav style={{ display:'flex', flexDirection:'column', gap:4, flex:1 }}>
          {NAV.map(item => (
            <div key={item.key} className={`nav-item ${screen===item.key?'active':''}`} onClick={() => setScreen(item.key)} style={{ cursor:'pointer' }}>
              <Icon name={item.icon} size={17} />
              {item.label}
            </div>
          ))}
        </nav>

        <div style={{ borderTop:'1px solid var(--border)', paddingTop:16 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>
            권한 시뮬레이션
          </div>
          <select value={role} onChange={e => setRole(e.target.value)} style={{
            width:'100%', padding:'9px 12px', borderRadius:12, border:'1px solid var(--secondary)', fontSize:13, background:'#fff'
          }}>
            {Object.entries(roleLabel).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </div>
      </aside>

      <main className="main-wrap" style={{ marginLeft:236, flex:1, minWidth:0, width:'calc(100% - 236px)', minHeight:'100vh' }}>
        <div style={{
          position:'sticky', top:0, zIndex:50, background:'rgba(255,248,241,0.92)', backdropFilter:'blur(6px)',
          borderBottom:'1px solid var(--border)', padding:'16px 32px', display:'flex', justifyContent:'space-between', alignItems:'center'
        }}>
          <div>
            <div style={{ fontSize:12, color:'var(--text-2)' }}>라인허브 · 생산관리 콘솔</div>
            <div style={{ fontSize:19, fontWeight:700 }}>{screenLabel}</div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:16 }}>
            <Icon name="bell" size={19} />
            <div style={{
              width:34, height:34, borderRadius:'50%', background:'var(--primary)', color:'#fff',
              display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700
            }}>김</div>
          </div>
        </div>

        <div style={{ padding:'26px 32px 60px' }}>
          {screen === 'main' && <DashboardScreen setToast={setToast} role={role} />}
          {screen === 'master-data' && <MasterDataScreen setToast={setToast} role={role} />}
          {screen === 'production' && <ProductionScreen setToast={setToast} />}
          {screen === 'construction-mobile' && <ConstructionMobileScreen setToast={setToast} />}
        </div>
      </main>

      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
