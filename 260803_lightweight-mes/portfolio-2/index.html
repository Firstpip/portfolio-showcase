<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파운드리OS — 생산·시공 통합 분석 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --primary:#5683da;
    --primary-dark:#3f68c2;
    --accent:#ff8964;
    --bg:#ffffff;
    --surface:#f6f6f6;
    --card:#ffffff;
    --text:#090a0c;
    --text-2:#75777e;
    --border:#d1d1d1;
    --radius-card:12px;
    --radius-btn:9999px;
    --shadow-card:0 1px 3px rgba(9,10,12,0.06);
    --shadow-elevated:0 6px 20px rgba(9,10,12,0.10);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes slideInRight{ from{transform:translateX(100%);} to{transform:translateX(0);} }
  @keyframes skeletonPulse{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }
  @keyframes progressFill{ from{width:0%;} to{width:var(--pw, 60%);} }
  @keyframes scaleIn{ from{opacity:0;transform:scale(0.94);} to{opacity:1;transform:scale(1);} }
  @keyframes dotBlink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  @keyframes auroraPulse{ 0%,100%{opacity:0.4; transform:translateY(0);} 50%{opacity:0.75; transform:translateY(-6px);} }

  .aurora-beam{
    position:absolute; top:-60px; left:6%; width:170px; height:380px;
    background:linear-gradient(180deg, rgba(86,131,218,0.55) 0%, rgba(255,137,100,0.45) 55%, rgba(255,255,255,0) 100%);
    filter:blur(42px); opacity:0.55; pointer-events:none; animation:auroraPulse 6s ease-in-out infinite;
  }
  .aurora-glow{
    position:absolute; bottom:-160px; right:10%; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,170,129,0.32), transparent 65%);
    pointer-events:none;
  }
  .card-glow{
    position:absolute; top:-30px; right:-30px; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,137,100,0.22), transparent 70%);
    pointer-events:none;
  }

  .fade-in{animation:fadeIn .4s ease both;}
  .scale-in{animation:scaleIn .28s cubic-bezier(.16,1,.3,1) both;}
  .skeleton-line{background:#eceef1;border-radius:6px;animation:skeletonPulse 1.1s ease-in-out infinite;}
  .live-blink{width:7px;height:7px;border-radius:50%;background:#2fbf71;display:inline-block;animation:dotBlink 1.6s infinite;}

  .pill-btn{
    border-radius:var(--radius-btn); font-weight:500; font-size:13.5px; padding:10px 20px;
    letter-spacing:-0.01em; transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .pill-primary{background:var(--primary); color:#fff;}
  .pill-primary:hover{background:var(--primary-dark);}
  .pill-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .pill-ghost:hover{border-color:var(--primary); color:var(--primary);}
  .pill-disabled{background:#f0f0f0; color:#b7b8bb; cursor:not-allowed;}

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); }
  .card-elevated{ box-shadow:var(--shadow-elevated); }
  .hover-card{ transition:box-shadow .18s ease, border-color .18s ease; }
  .hover-card:hover{ box-shadow:var(--shadow-elevated); border-color:#c3c9d6; }

  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
    padding:5px 12px; border-radius:999px; border:1px solid var(--border); color:var(--text-2);
    transition:background .15s ease, color .15s ease, border-color .15s ease; cursor:pointer;
  }
  .chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; }
  .badge-blue{ background:rgba(86,131,218,0.12); color:#3f68c2; }
  .badge-coral{ background:rgba(255,137,100,0.15); color:#c85a34; }
  .badge-green{ background:rgba(47,191,113,0.14); color:#1f8a52; }
  .badge-red{ background:rgba(224,77,58,0.12); color:#c0311a; }
  .badge-gray{ background:#eeeeef; color:#75777e; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:0.04em; padding:9px 12px; border-bottom:1px solid var(--border); }
  td{ padding:11px 12px; font-size:13.5px; border-bottom:1px solid #eeeeef; }
  tr.row-hover:hover{ background:#f8f9fb; cursor:pointer; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(9,10,12,0.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; }
  .modal-box{ background:#fff; border-radius:16px; max-width:640px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow-elevated); }
  .drawer-overlay{ position:fixed; inset:0; background:rgba(9,10,12,0.4); z-index:200; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:#fff; box-shadow:-10px 0 30px rgba(9,10,12,0.14); z-index:201; overflow-y:auto; animation:slideInRight .3s cubic-bezier(.16,1,.3,1) both; }

  .tab-link{
    padding:8px 4px; font-size:14px; font-weight:500; color:var(--text-2); position:relative;
    border-bottom:2px solid transparent; transition:color .15s ease;
  }
  .tab-link.active{ color:var(--text); border-bottom-color:var(--primary); }
  .tab-link:hover{ color:var(--text); }

  ::placeholder{ color:#b7b8bb; }
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell, ResponsiveContainer, XAxis, YAxis, Tooltip, CartesianGrid, LineChart, Line } = Recharts;

/* ---------- mock data ---------- */

const TREND = [
  { month:'3월', production:6200, construction:58 },
  { month:'4월', production:7100, construction:63 },
  { month:'5월', production:6800, construction:69 },
  { month:'6월', production:8300, construction:74 },
  { month:'7월', production:9426, construction:81 },
  { month:'8월', production:5200, construction:52 },
];

const SITE_SHARE = [
  { name:'가평 A동', value:28, color:'#5683da' },
  { name:'평택 2공장', value:22, color:'#ff8964' },
  { name:'울산 냉동창고', value:18, color:'#95979e' },
  { name:'세종 데이터센터', value:19, color:'#8fb0ea' },
  { name:'광주 조립라인', value:13, color:'#ffb79f' },
];

const MONTHLY_OUTBOUND = [
  { m:'3월', qty:5200 }, { m:'4월', qty:6100 }, { m:'5월', qty:5800 },
  { m:'6월', qty:7400 }, { m:'7월', qty:7810 },
];

const ACTIVITY_LOG = [
  { time:'09:42', text:'가평 A동 — 생산일보 등록 (김도현)' },
  { time:'09:15', text:'울산 냉동창고 — 자재 재고 임계치 도달 알림' },
  { time:'08:58', text:'평택 2공장 — 시공 진척률 63% → 68% 갱신' },
  { time:'08:30', text:'세종 데이터센터 — 기준정보 변경 승인 (관리자)' },
];

const SEARCH_ROWS_ALL = [
  { site:'가평 A동 물류센터', product:'조립식 판넬 세트-A', period:'2026.07', qty:1240, status:'생산완료' },
  { site:'평택 2공장 증축', product:'단열 지붕 모듈', period:'2026.07', qty:860, status:'출고대기' },
  { site:'울산 냉동창고 신축', product:'철골 프레임 유닛', period:'2026.06', qty:520, status:'출고' },
  { site:'세종 데이터센터 부속동', product:'조립식 판넬 세트-A', period:'2026.07', qty:1420, status:'생산완료' },
  { site:'광주 조립라인 이전', product:'단열 지붕 모듈', period:'2026.06', qty:390, status:'미출고' },
  { site:'가평 A동 물류센터', product:'철골 프레임 유닛', period:'2026.06', qty:710, status:'출고' },
];

const BACKUP_HISTORY = [
  { id:'B-0801', date:'2026.08.01 00:00', size:'482MB', status:'성공' },
  { id:'B-0731', date:'2026.07.31 00:00', size:'479MB', status:'성공' },
  { id:'B-0730', date:'2026.07.30 00:00', size:'—', status:'실패' },
  { id:'B-0729', date:'2026.07.29 00:00', size:'474MB', status:'성공' },
];

const PERMISSION_MATRIX = [
  { feature:'마스터데이터 수정', admin:true, production:true, construction:false, viewer:false },
  { feature:'생산일보 입력', admin:true, production:true, construction:false, viewer:false },
  { feature:'시공일보 입력', admin:true, production:false, construction:true, viewer:false },
  { feature:'엑셀 다운로드', admin:true, production:true, construction:true, viewer:true },
  { feature:'백업/배포 관리', admin:true, production:false, construction:false, viewer:false },
];

const DEPLOY_HISTORY = [
  { id:'D-231', at:'2026.08.01 14:02', target:'production', status:'성공' },
  { id:'D-230', at:'2026.07.29 11:20', target:'staging', status:'성공' },
  { id:'D-229', at:'2026.07.27 16:44', target:'production', status:'성공' },
];

/* ---------- shared ---------- */

function Ph({ name, size=18, weight='regular', style }) {
  return <i className={`ph${weight==='fill'?'-fill':''} ph-${name}`} style={{ fontSize:size, ...style }}></i>;
}

function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className="scale-in" style={{
      position:'fixed', left:'50%', bottom:28, transform:'translateX(-50%)',
      background:'#090a0c', color:'#fff', padding:'12px 22px', borderRadius:999,
      fontSize:13.5, fontWeight:500, zIndex:400, display:'flex', alignItems:'center', gap:8,
      boxShadow:'0 10px 30px rgba(0,0,0,0.25)'
    }}>
      <Ph name="check-circle" weight="fill" size={16} style={{ color:'#5683da' }} />
      {toast}
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box scale-in" style={wide ? { maxWidth: 780 } : {}} onClick={e => e.stopPropagation()}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px 24px', borderBottom:'1px solid var(--border)' }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:600 }}>{title}</h3>
          <button onClick={onClose} style={{ padding:8, borderRadius:999 }}><Ph name="x" size={18} /></button>
        </div>
        <div style={{ padding:'20px 24px' }}>{children}</div>
      </div>
    </div>
  );
}

function Drawer({ title, onClose, children }) {
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px 24px', borderBottom:'1px solid var(--border)' }}>
          <h3 style={{ margin:0, fontSize:17, fontWeight:600 }}>{title}</h3>
          <button onClick={onClose} style={{ padding:8, borderRadius:999 }}><Ph name="x" size={18} /></button>
        </div>
        <div style={{ padding:'20px 24px' }}>{children}</div>
      </div>
    </React.Fragment>
  );
}

function StatusBadge({ status }) {
  const map = {
    '생산완료':'badge-blue', '출고대기':'badge-coral', '출고':'badge-green',
    '미출고':'badge-gray', '성공':'badge-green', '실패':'badge-red',
  };
  return <span className={`badge ${map[status]||'badge-gray'}`}>{status}</span>;
}

/* ---------- screens ---------- */

function AnalyticsMainScreen() {
  const [siteFilter, setSiteFilter] = useState('전체');
  const [periodFilter, setPeriodFilter] = useState('최근 6개월');
  const [drill, setDrill] = useState(null);
  const [syncTag, setSyncTag] = useState(false);

  const sites = ['전체', '가평 A동', '평택 2공장', '울산 냉동창고'];
  const periods = ['최근 6개월', '최근 12개월', '올해'];

  const applyFilter = (setter, val) => {
    setter(val);
    setSyncTag(true);
    try { window.history.replaceState(null, '', `#site=${siteFilter}&period=${periodFilter}`); } catch(e) {}
    setTimeout(() => setSyncTag(false), 1400);
  };

  return (
    <div className="fade-in">
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:18, flexWrap:'wrap' }}>
        <span style={{ fontSize:12.5, fontWeight:600, color:'var(--text-2)' }}>현장</span>
        {sites.map(s => (
          <span key={s} className={`chip ${siteFilter===s?'active':''}`} onClick={() => applyFilter(setSiteFilter, s)}>{s}</span>
        ))}
        <span style={{ width:1, height:18, background:'var(--border)', margin:'0 4px' }}></span>
        <span style={{ fontSize:12.5, fontWeight:600, color:'var(--text-2)' }}>기간</span>
        {periods.map(p => (
          <span key={p} className={`chip ${periodFilter===p?'active':''}`} onClick={() => applyFilter(setPeriodFilter, p)}>{p}</span>
        ))}
        {syncTag && <span className="badge badge-blue" style={{ marginLeft:'auto' }}><Ph name="link-simple" size={12} />필터가 URL에 저장됨</span>}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 300px', gap:18, marginBottom:18 }}>
        {/* hero-viz */}
        <div className="card hover-card" style={{ padding:24 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
            <div>
              <div style={{ fontSize:12, color:'var(--text-2)', marginBottom:2 }}>생산량 · 시공 진척률 추이</div>
              <div style={{ fontSize:22, fontWeight:700 }}>{siteFilter} · {periodFilter}</div>
            </div>
            <span style={{ fontSize:12, color:'var(--text-2)' }}>구간 클릭 시 현장별 상세</span>
          </div>
          <div style={{ height:280 }}>
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={TREND} onClick={(e) => e && e.activeLabel && setDrill(e.activeLabel)}>
                <defs>
                  <linearGradient id="prodGrad2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#5683da" stopOpacity={0.32} />
                    <stop offset="100%" stopColor="#5683da" stopOpacity={0} />
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="#eeeeef" vertical={false} />
                <XAxis dataKey="month" tick={{ fontSize:11.5, fill:'#75777e' }} axisLine={false} tickLine={false} />
                <YAxis hide />
                <Tooltip contentStyle={{ borderRadius:10, border:'1px solid #d1d1d1', fontSize:12.5 }} />
                <Area type="monotone" dataKey="production" stroke="#5683da" strokeWidth={2.5} fill="url(#prodGrad2)" cursor="pointer" />
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>

        {/* kpi-side */}
        <div className="card hover-card" style={{ padding:22, position:'relative', overflow:'hidden' }}>
          <div className="card-glow"></div>
          <div style={{ fontSize:13, fontWeight:600, marginBottom:14, position:'relative' }}>핵심 지표</div>
          <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:20 }}>
            {[
              { label:'총 생산량', value:'43,026개', icon:'stack' },
              { label:'평균 진척률', value:'66.2%', icon:'chart-line-up' },
              { label:'재고 회전율', value:'4.8회/월', icon:'arrows-clockwise' },
              { label:'활성 현장', value:'5곳', icon:'map-pin-area' },
            ].map(k => (
              <div key={k.label} style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ width:34, height:34, borderRadius:10, background:'rgba(86,131,218,0.1)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <Ph name={k.icon} size={17} style={{ color:'#3f68c2' }} />
                </div>
                <div>
                  <div style={{ fontSize:11.5, color:'var(--text-2)' }}>{k.label}</div>
                  <div style={{ fontSize:15.5, fontWeight:700 }}>{k.value}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{ fontSize:12, fontWeight:600, color:'var(--text-2)', marginBottom:8 }}>인사이트</div>
          <div style={{ background:'var(--surface)', borderRadius:10, padding:'12px 14px', fontSize:12.5, lineHeight:1.5 }}>
            이번달 가평 A동 생산량이 전월 대비 급증했습니다. 세종 데이터센터는 진척률 81%로 납기 준수가 유력합니다.
          </div>
        </div>
      </div>

      {/* widget-grid */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1.3fr', gap:18 }}>
        <div className="card hover-card" style={{ padding:20 }}>
          <div style={{ fontSize:13.5, fontWeight:600, marginBottom:6 }}>현장별 생산 비중</div>
          <div style={{ height:150 }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={SITE_SHARE} dataKey="value" innerRadius={40} outerRadius={60} paddingAngle={2}>
                  {SITE_SHARE.map((e,i) => <Cell key={i} fill={e.color} />)}
                </Pie>
                <Tooltip contentStyle={{ borderRadius:10, fontSize:12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="card hover-card" style={{ padding:20 }}>
          <div style={{ fontSize:13.5, fontWeight:600, marginBottom:10 }}>월별 출고량</div>
          <div style={{ height:150 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={MONTHLY_OUTBOUND}>
                <CartesianGrid stroke="#eeeeef" vertical={false} />
                <XAxis dataKey="m" tick={{ fontSize:11, fill:'#75777e' }} axisLine={false} tickLine={false} />
                <YAxis hide />
                <Tooltip contentStyle={{ borderRadius:10, fontSize:12 }} />
                <Bar dataKey="qty" fill="#ff8964" radius={[6,6,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="card hover-card" style={{ padding:20 }}>
          <div style={{ fontSize:13.5, fontWeight:600, marginBottom:12 }}>최근 활동 타임라인</div>
          <div style={{ display:'flex', flexDirection:'column', gap:11 }}>
            {ACTIVITY_LOG.map((a,i) => (
              <div key={i} style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                <span style={{ fontSize:11, color:'var(--text-2)', minWidth:38 }}>{a.time}</span>
                <span style={{ fontSize:12.5, lineHeight:1.4 }}>{a.text}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {drill && (
        <Modal title={`${drill} 상세 분석`} onClose={() => setDrill(null)} wide>
          <table>
            <thead><tr><th>현장</th><th>제품</th><th style={{textAlign:'right'}}>생산량</th><th>상태</th></tr></thead>
            <tbody>
              {SEARCH_ROWS_ALL.slice(0,4).map((r,i) => (
                <tr key={i}>
                  <td style={{ fontWeight:600 }}>{r.site}</td>
                  <td>{r.product}</td>
                  <td style={{ textAlign:'right' }}>{r.qty.toLocaleString()}</td>
                  <td><StatusBadge status={r.status} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </Modal>
      )}
    </div>
  );
}

function SearchScreen() {
  const [siteQ, setSiteQ] = useState('전체');
  const [productQ, setProductQ] = useState('전체');
  const [statusQ, setStatusQ] = useState('전체');
  const [results, setResults] = useState(SEARCH_ROWS_ALL);
  const [loading, setLoading] = useState(false);
  const [cached, setCached] = useState(false);
  const [lastQuery, setLastQuery] = useState('전체|전체|전체');
  const [detail, setDetail] = useState(null);

  const runSearch = () => {
    const key = `${siteQ}|${productQ}|${statusQ}`;
    setLoading(true);
    const isCache = key === lastQuery;
    setTimeout(() => {
      const filtered = SEARCH_ROWS_ALL.filter(r =>
        (siteQ==='전체' || r.site.includes(siteQ)) &&
        (productQ==='전체' || r.product===productQ) &&
        (statusQ==='전체' || r.status===statusQ)
      );
      setResults(filtered);
      setCached(isCache);
      setLastQuery(key);
      setLoading(false);
    }, isCache ? 180 : 750);
  };

  return (
    <div className="fade-in">
      <div className="card" style={{ padding:20, marginBottom:18 }}>
        <div style={{ fontSize:13.5, fontWeight:600, marginBottom:14 }}>다중 조건 검색</div>
        <div style={{ display:'flex', gap:14, flexWrap:'wrap', alignItems:'flex-end' }}>
          <div>
            <div style={{ fontSize:11.5, color:'var(--text-2)', marginBottom:6 }}>현장</div>
            <select value={siteQ} onChange={e => setSiteQ(e.target.value)} style={{ padding:'9px 14px', borderRadius:10, border:'1px solid var(--border)', fontSize:13.5 }}>
              <option>전체</option><option>가평</option><option>평택</option><option>울산</option><option>세종</option><option>광주</option>
            </select>
          </div>
          <div>
            <div style={{ fontSize:11.5, color:'var(--text-2)', marginBottom:6 }}>제품</div>
            <select value={productQ} onChange={e => setProductQ(e.target.value)} style={{ padding:'9px 14px', borderRadius:10, border:'1px solid var(--border)', fontSize:13.5 }}>
              <option>전체</option><option>조립식 판넬 세트-A</option><option>단열 지붕 모듈</option><option>철골 프레임 유닛</option>
            </select>
          </div>
          <div>
            <div style={{ fontSize:11.5, color:'var(--text-2)', marginBottom:6 }}>상태</div>
            <select value={statusQ} onChange={e => setStatusQ(e.target.value)} style={{ padding:'9px 14px', borderRadius:10, border:'1px solid var(--border)', fontSize:13.5 }}>
              <option>전체</option><option>생산완료</option><option>출고대기</option><option>출고</option><option>미출고</option>
            </select>
          </div>
          <button className="pill-btn pill-primary" onClick={runSearch}>검색 실행</button>
        </div>
      </div>

      {loading && (
        <div className="card" style={{ padding:20 }}>
          {[1,2,3].map(i => <div key={i} className="skeleton-line" style={{ height:16, marginBottom:12, width:`${90-i*8}%` }}></div>)}
        </div>
      )}

      {!loading && results && (
        <div className="card">
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 18px', borderBottom:'1px solid var(--border)' }}>
            <div style={{ fontSize:13, color:'var(--text-2)' }}>검색 결과 {results.length}건</div>
            {cached && <span className="badge badge-blue"><Ph name="lightning" weight="fill" size={12} />캐시된 결과 · 0.18초</span>}
          </div>
          <table>
            <thead><tr><th>현장</th><th>제품</th><th>기간</th><th style={{textAlign:'right'}}>수량</th><th>상태</th></tr></thead>
            <tbody>
              {results.map((r,i) => (
                <tr key={i} className="row-hover" onClick={() => setDetail(r)}>
                  <td style={{ fontWeight:600 }}>{r.site}</td>
                  <td>{r.product}</td>
                  <td>{r.period}</td>
                  <td style={{ textAlign:'right' }}>{r.qty.toLocaleString()}</td>
                  <td><StatusBadge status={r.status} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {detail && (
        <Drawer title={detail.site} onClose={() => setDetail(null)}>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            <div><div style={{ fontSize:11.5, color:'var(--text-2)' }}>제품</div><div style={{ fontWeight:600 }}>{detail.product}</div></div>
            <div><div style={{ fontSize:11.5, color:'var(--text-2)' }}>기간</div><div style={{ fontWeight:600 }}>{detail.period}</div></div>
            <div><div style={{ fontSize:11.5, color:'var(--text-2)' }}>수량</div><div style={{ fontWeight:600 }}>{detail.qty.toLocaleString()}개</div></div>
            <div><div style={{ fontSize:11.5, color:'var(--text-2)' }}>상태</div><StatusBadge status={detail.status} /></div>
          </div>
        </Drawer>
      )}
    </div>
  );
}

function ExportBackupScreen({ setToast }) {
  const [exportStage, setExportStage] = useState('idle');
  const [downloads, setDownloads] = useState([{ name:'생산현황_2026-07.xlsx', at:'2026.07.31 18:02' }]);
  const [history, setHistory] = useState(BACKUP_HISTORY);
  const [autoBackup, setAutoBackup] = useState(true);

  const runExport = () => {
    setExportStage('loading');
    setTimeout(() => {
      setExportStage('idle');
      setDownloads(prev => [{ name:`생산현황_2026-08.xlsx`, at:'2026.08.03 11:20' }, ...prev]);
      setToast('엑셀 파일이 생성되었습니다');
    }, 1400);
  };

  const retryBackup = (id) => {
    setHistory(prev => prev.map(h => h.id === id ? { ...h, status:'성공', size:'481MB' } : h));
    setToast('백업이 재시도되어 성공했습니다');
  };

  return (
    <div className="fade-in" style={{ display:'grid', gridTemplateColumns:'340px 1fr', gap:20 }}>
      <div className="card" style={{ padding:22, alignSelf:'start' }}>
        <div style={{ fontSize:14, fontWeight:600, marginBottom:14 }}>엑셀 다운로드</div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, marginBottom:16 }}>
          <label style={{ fontSize:12.5, color:'var(--text-2)' }}>대상 범위</label>
          <select style={{ padding:'9px 12px', borderRadius:10, border:'1px solid var(--border)', fontSize:13.5 }}>
            <option>전체 현장 · 이번달</option>
            <option>가평 A동 물류센터</option>
            <option>세종 데이터센터 부속동</option>
          </select>
        </div>
        {exportStage === 'idle' && (
          <button className="pill-btn pill-primary" style={{ width:'100%' }} onClick={runExport}>다운로드 시작</button>
        )}
        {exportStage === 'loading' && (
          <div style={{ padding:'10px 0' }}>
            <div style={{ height:8, background:'#eceef1', borderRadius:999, overflow:'hidden' }}>
              <div style={{ height:'100%', background:'var(--primary)', borderRadius:999, animation:'progressFill 1.3s ease forwards', '--pw':'100%' }}></div>
            </div>
            <div style={{ fontSize:11.5, color:'var(--text-2)', textAlign:'center', marginTop:8 }}>엑셀 생성 중...</div>
          </div>
        )}
        <div style={{ marginTop:20, fontSize:12, fontWeight:600, color:'var(--text-2)' }}>최근 다운로드</div>
        <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
          {downloads.map((d,i) => (
            <div key={i} className="fade-in" style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5 }}>
              <Ph name="file-xls" size={16} style={{ color:'#1f8a52' }} />
              <div style={{ flex:1 }}>{d.name}<div style={{ fontSize:11, color:'var(--text-2)' }}>{d.at}</div></div>
            </div>
          ))}
        </div>
      </div>

      <div className="card" style={{ padding:22 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div style={{ fontSize:14, fontWeight:600 }}>자동 백업 이력</div>
          <label style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5, color:'var(--text-2)' }}>
            <span className="live-blink" style={{ background: autoBackup ? '#2fbf71' : '#c7c8cb' }}></span>
            매일 자정 자동 실행
            <button onClick={() => { setAutoBackup(v=>!v); setToast(autoBackup ? '자동 백업이 꺼졌습니다' : '자동 백업이 켜졌습니다'); }} className="pill-btn pill-ghost" style={{ padding:'5px 14px', fontSize:11.5 }}>
              {autoBackup ? '사용 중' : '꺼짐'}
            </button>
          </label>
        </div>
        <table>
          <thead><tr><th>백업 ID</th><th>일시</th><th>용량</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {history.map(h => (
              <tr key={h.id}>
                <td style={{ fontWeight:600 }}>{h.id}</td>
                <td style={{ color:'var(--text-2)' }}>{h.date}</td>
                <td>{h.size}</td>
                <td><StatusBadge status={h.status} /></td>
                <td style={{ textAlign:'right' }}>
                  {h.status === '실패' && (
                    <button className="pill-btn pill-ghost" style={{ padding:'5px 14px', fontSize:11.5 }} onClick={() => retryBackup(h.id)}>재시도</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function SettingsIntegrationScreen({ setToast }) {
  const [matrix, setMatrix] = useState(PERMISSION_MATRIX);
  const [deploying, setDeploying] = useState(false);
  const [deployHistory, setDeployHistory] = useState(DEPLOY_HISTORY);

  const toggleCell = (fi, role) => {
    setMatrix(prev => prev.map((row,i) => i===fi ? { ...row, [role]: !row[role] } : row));
  };

  const runDeploy = () => {
    setDeploying(true);
    setTimeout(() => {
      setDeploying(false);
      setDeployHistory(prev => [{ id:`D-${232+prev.length}`, at:'2026.08.03 11:25', target:'production', status:'성공' }, ...prev]);
      setToast('배포 자동화가 완료되었습니다');
    }, 1600);
  };

  const roles = [ ['admin','관리자'], ['production','생산'], ['construction','시공'], ['viewer','조회자'] ];

  return (
    <div className="fade-in" style={{ display:'flex', flexDirection:'column', gap:20 }}>
      <div className="card" style={{ padding:22 }}>
        <div style={{ fontSize:14, fontWeight:600, marginBottom:6 }}>권한 세분화 설정</div>
        <div style={{ fontSize:12.5, color:'var(--text-2)', marginBottom:16 }}>메뉴/기능 단위로 권한 계층별 접근 범위를 개별 지정합니다</div>
        <table>
          <thead>
            <tr>
              <th>기능</th>
              {roles.map(([k,v]) => <th key={k} style={{ textAlign:'center' }}>{v}</th>)}
            </tr>
          </thead>
          <tbody>
            {matrix.map((row, fi) => (
              <tr key={row.feature}>
                <td style={{ fontWeight:600 }}>{row.feature}</td>
                {roles.map(([k]) => (
                  <td key={k} style={{ textAlign:'center' }}>
                    <button onClick={() => toggleCell(fi, k)} style={{ padding:6 }}>
                      {row[k]
                        ? <Ph name="check-circle" weight="fill" size={18} style={{ color:'#2fbf71' }} />
                        : <Ph name="x-circle" size={18} style={{ color:'#d1d1d1' }} />
                      }
                    </button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <div className="card" style={{ padding:22 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
            <Ph name="cloud-check" size={20} style={{ color:'#3f68c2' }} />
            <div style={{ fontSize:14, fontWeight:600 }}>AWS S3 클라우드 스토리지 연동</div>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 0', borderBottom:'1px solid var(--border)' }}>
            <span style={{ fontSize:13 }}>연동 상태</span>
            <span className="badge badge-green">정상</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 0' }}>
            <span style={{ fontSize:13 }}>마지막 동기화</span>
            <span style={{ fontSize:12.5, color:'var(--text-2)' }}>2026.08.03 11:04</span>
          </div>
        </div>
        <div className="card" style={{ padding:22 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <Ph name="rocket-launch" size={20} style={{ color:'#c85a34' }} />
              <div style={{ fontSize:14, fontWeight:600 }}>Docker Compose · CI/CD 배포</div>
            </div>
            <button className="pill-btn pill-primary" style={{ padding:'7px 16px', fontSize:12.5 }} onClick={runDeploy} disabled={deploying}>
              {deploying ? '배포 중...' : '지금 배포'}
            </button>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {deployHistory.slice(0,4).map(d => (
              <div key={d.id} className="fade-in" style={{ display:'flex', justifyContent:'space-between', fontSize:12.5 }}>
                <span>{d.id} · {d.target}</span>
                <span style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ color:'var(--text-2)' }}>{d.at}</span>
                  <StatusBadge status={d.status} />
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

];

        backdropFilter:'blur(6px)', position:'sticky', top:0, zIndex:60

          <nav style={{ display:'flex', gap:24, flex:1 }}>
            {NAV.map(item => (

              </span>
            ))}
          </nav>
          <div style={{ display:'flex', alignItems:'center', gap:16 }}>

          </div>
        </div>
      </header>

      {screen === 'main' && (
        <div style={{
          width:'100%', position:'relative', overflow:'hidden',
          background:'linear-gradient(135deg, rgba(86,131,218,0.08), rgba(255,137,100,0.06) 70%)',
          borderBottom:'1px solid var(--border)'
        }}>
          <div className="aurora-beam"></div>
          <div className="aurora-glow"></div>
          <div style={{ maxWidth:1280, margin:'0 auto', padding:'36px 28px 28px', position:'relative', zIndex:1 }}>
            <div style={{ fontSize:12.5, fontWeight:600, color:'var(--primary)', letterSpacing:'0.04em', marginBottom:8 }}>ANALYTICS PLATFORM</div>
            <h1 style={{ margin:'0 0 8px', fontSize:44, fontWeight:700, letterSpacing:'-0.02em' }}>생산·시공 데이터를 한눈에, 다각도로</h1>
            <p style={{ margin:0, fontSize:14, color:'var(--text-2)', maxWidth:560 }}>
              현장별·월별·기간별 필터 조합으로 생산·시공·자재 이력을 분석하고, 대용량 데이터를 즉시 내려받습니다.
            </p>
          </div>
        </div>
      )}

      <main style={{ flex:1, width:'100%' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'24px 28px 60px' }}>
          {screen === 'main' && <AnalyticsMainScreen />}
          {screen === 'search' && <SearchScreen />}
