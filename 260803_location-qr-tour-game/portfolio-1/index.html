<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도심 탐험 GPS 미션 투어 게임 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#171721; --surface:#1e1e2a; --surface2:#272735;
    --border-mist: rgba(226,227,237,0.16); --border-mist-strong: rgba(226,227,237,0.32);
    --text:#ededf3; --text-muted:#c3c3cc; --primary:#5266eb; --primary-soft:rgba(82,102,235,0.18);
    --white:#ffffff; --success:#3ddc97; --warning:#f5a742; --locked:#5a5a68;
    --radius-card:12px; --radius-pill:32px; --radius-nav:40px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{width:100%; height:100%; margin:0; padding:0; background:var(--bg);}
  body{font-family:'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif; color:var(--text); overflow:hidden;}
  #app-root{width:100%; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border-mist-strong); border-radius:8px;}

  @keyframes pulseRing{
    0%{transform:scale(0.6); opacity:0.9;}
    70%{transform:scale(2.2); opacity:0;}
    100%{transform:scale(2.2); opacity:0;}
  }
  @keyframes floatBob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }
  @keyframes fadeInScale{
    from{opacity:0; transform:translateY(10px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @keyframes scanLine{
    0%{top:6%;}
    50%{top:92%;}
    100%{top:6%;}
  }
  @keyframes popIn{
    0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.08) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  @keyframes shimmerBar{
    0%{background-position:-200px 0;}
    100%{background-position:200px 0;}
  }
  @keyframes toastIn{
    from{opacity:0; transform:translate(-50%, 12px);}
    to{opacity:1; transform:translate(-50%, 0);}
  }
  @keyframes waveBar{
    0%,100%{transform:scaleY(0.3);}
    50%{transform:scaleY(1);}
  }

  .screen{width:100%; height:100%; position:relative; animation:fadeInScale 0.32s cubic-bezier(0.19,1,0.22,1);}

  /* ---------- MAP SCREEN (map-canvas archetype) ---------- */
  .map-wrap{position:absolute; inset:0; overflow:hidden; background:
    radial-gradient(ellipse at 30% 20%, #202038 0%, #171721 55%),
    linear-gradient(180deg, #171721 0%, #14141c 100%);}
  .map-grid{position:absolute; inset:0; opacity:0.55;}
  .marker{position:absolute; transform:translate(-50%,-100%); z-index:5;}
  .marker-pin{width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.45);
    border:2px solid rgba(255,255,255,0.25); cursor:pointer; transition:transform 0.2s ease;}
  .marker-pin:hover{transform:rotate(-45deg) scale(1.12);}
  .marker-pin i{transform:rotate(45deg); font-size:15px;}
  .marker[data-status="active"] .marker-pin{background:var(--primary);}
  .marker[data-status="complete"] .marker-pin{background:var(--success);}
  .marker[data-status="locked"] .marker-pin{background:var(--locked); opacity:0.75;}
  .marker[data-selected="true"] .marker-pin{outline:2px solid #fff; outline-offset:2px;}
  .player-dot{position:absolute; width:16px; height:16px; border-radius:50%; background:var(--primary);
    border:3px solid var(--white); transform:translate(-50%,-50%); z-index:6; box-shadow:0 0 0 4px rgba(82,102,235,0.25);}
  .player-ring{position:absolute; inset:-14px; border-radius:50%; border:2px solid var(--primary);
    animation:pulseRing 2.2s cubic-bezier(0.2,0.6,0.4,1) infinite;}

  .topbar{position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center;
    justify-content:space-between; padding:16px 20px; background:linear-gradient(180deg, rgba(23,23,33,0.92) 0%, rgba(23,23,33,0) 100%);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-badge{width:36px; height:36px; border-radius:10px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:18px;}
  .brand-name{font-weight:700; font-size:16px; letter-spacing:0.2px;}
  .brand-sub{font-size:12px; color:var(--text-muted);}
  .points-chip{display:flex; align-items:center; gap:6px; background:rgba(30,30,42,0.85);
    backdrop-filter:blur(10px); border:1px solid var(--border-mist); border-radius:var(--radius-pill);
    padding:8px 14px; font-size:14px; font-weight:600;}
  .points-chip i{color:var(--warning);}

  .drawer{position:absolute; top:78px; left:16px; width:290px; max-height:calc(100% - 190px);
    background:rgba(30,30,42,0.92); backdrop-filter:blur(14px); border:1px solid var(--border-mist);
    border-radius:var(--radius-card); box-shadow:0 20px 45px rgba(0,0,0,0.4); z-index:15;
    display:flex; flex-direction:column; overflow:hidden;}
  .drawer-head{padding:16px 16px 10px;}
  .drawer-title{font-size:15px; font-weight:700; margin:0 0 10px;}
  .search-box{display:flex; align-items:center; gap:8px; background:var(--surface2);
    border:1px solid var(--border-mist); border-radius:var(--radius-pill); padding:9px 14px;}
  .search-box input{flex:1; background:none; border:none; color:var(--text); font-size:13px; outline:none;}
  .search-box i{color:var(--text-muted); font-size:15px;}
  .result-list{overflow-y:auto; padding:4px 10px 12px;}
  .quest-item{display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:9px;
    cursor:pointer; transition:background 0.15s ease;}
  .quest-item:hover{background:rgba(255,255,255,0.05);}
  .quest-item.is-selected{background:var(--primary-soft);}
  .quest-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .quest-dot.active{background:var(--primary);}
  .quest-dot.complete{background:var(--success);}
  .quest-dot.locked{background:var(--locked);}
  .quest-item-name{font-size:13px; font-weight:600;}
  .quest-item-meta{font-size:11px; color:var(--text-muted);}

  .detail-card{position:absolute; right:16px; bottom:100px; width:300px; z-index:15;
    background:var(--surface); border:1px solid var(--border-mist); border-radius:var(--radius-card);
    box-shadow:0 20px 45px rgba(0,0,0,0.45); padding:20px; animation:fadeInScale 0.28s ease;}
  .detail-status{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:var(--radius-pill); text-transform:uppercase; letter-spacing:0.4px;}
  .detail-status.active{background:var(--primary-soft); color:#a9b4f7;}
  .detail-status.complete{background:rgba(61,220,151,0.15); color:var(--success);}
  .detail-status.locked{background:rgba(255,255,255,0.06); color:var(--text-muted);}
  .detail-title{font-size:18px; font-weight:700; margin:12px 0 6px;}
  .detail-desc{font-size:13px; color:var(--text-muted); line-height:1.55; margin:0 0 16px;}
  .detail-cta{width:100%; background:var(--primary); color:#fff; padding:12px; border-radius:var(--radius-pill);
    font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;}
  .detail-cta:disabled{background:var(--surface2); color:var(--text-muted); cursor:not-allowed;}

  .map-control{position:absolute; right:16px; top:78px; z-index:15; display:flex; flex-direction:column;
    background:rgba(30,30,42,0.92); backdrop-filter:blur(10px); border:1px solid var(--border-mist);
    border-radius:var(--radius-card); overflow:hidden;}
  .map-control button{width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    font-size:17px; border-bottom:1px solid var(--border-mist);}
  .map-control button:last-child{border-bottom:none;}
  .map-control button:hover{background:rgba(255,255,255,0.06);}

  .legend{position:absolute; left:16px; bottom:100px; z-index:14; background:rgba(30,30,42,0.9);
    backdrop-filter:blur(10px); border:1px solid var(--border-mist); border-radius:var(--radius-card);
    padding:12px 14px; font-size:12px; display:flex; flex-direction:column; gap:7px;}
  .legend-row{display:flex; align-items:center; gap:8px; color:var(--text-muted);}
  .legend-dot{width:8px; height:8px; border-radius:50%;}

  .mission-bar{position:absolute; left:16px; right:16px; bottom:16px; z-index:16; display:flex;
    gap:8px; background:rgba(30,30,42,0.94); backdrop-filter:blur(14px); border:1px solid var(--border-mist);
    border-radius:var(--radius-nav); padding:8px; box-shadow:0 16px 40px rgba(0,0,0,0.4);}
  .mission-step{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 4px;
    border-radius:calc(var(--radius-nav) - 6px); transition:background 0.18s ease;}
  .mission-step:hover{background:rgba(255,255,255,0.06);}
  .mission-step i{font-size:19px; color:var(--text-muted);}
  .mission-step span{font-size:10.5px; font-weight:600; color:var(--text-muted); text-align:center; line-height:1.3;}
  .mission-step.done i, .mission-step.done span{color:var(--success);}
  .mission-step-num{position:absolute; top:2px; right:16%; width:14px; height:14px; border-radius:50%;
    background:var(--primary); font-size:9px; display:flex; align-items:center; justify-content:center; font-weight:800;}

  .headline-badge{position:absolute; left:20px; bottom:190px; z-index:14; max-width:230px; font-size:11px;
    color:var(--text-muted); background:rgba(30,30,42,0.7); border-left:2px solid var(--primary);
    padding:8px 12px; border-radius:0 8px 8px 0;}

  /* ---------- QR SCAN SCREEN ---------- */
  .qr-screen{position:absolute; inset:0; background:
    repeating-linear-gradient(115deg, #101018 0px, #14141d 3px, #0e0e15 6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .qr-topbar{position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; z-index:5;}
  .icon-btn{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; font-size:18px;}
  .icon-btn:hover{background:rgba(255,255,255,0.16);}
  .icon-btn.active{background:var(--primary);}
  .qr-frame{position:relative; width:230px; height:230px;}
  .qr-frame .corner{position:absolute; width:34px; height:34px; border:3px solid var(--primary);}
  .qr-frame .tl{top:0; left:0; border-right:none; border-bottom:none; border-radius:8px 0 0 0;}
  .qr-frame .tr{top:0; right:0; border-left:none; border-bottom:none; border-radius:0 8px 0 0;}
  .qr-frame .bl{bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 8px;}
  .qr-frame .br{bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 8px 0;}
  .scan-line{position:absolute; left:6%; right:6%; height:2px; background:linear-gradient(90deg, transparent, var(--primary) 50%, transparent);
    animation:scanLine 2.4s ease-in-out infinite; box-shadow:0 0 10px 1px rgba(82,102,235,0.7);}
  .qr-hint{margin-top:26px; font-size:14px; color:var(--text-muted); text-align:center; max-width:260px; line-height:1.6;}
  .qr-actions{margin-top:34px; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .qr-scan-btn{background:var(--primary); color:#fff; padding:14px 34px; border-radius:var(--radius-pill);
    font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .qr-success{display:flex; flex-direction:column; align-items:center; gap:14px; animation:popIn 0.5s cubic-bezier(0.2,1.4,0.4,1);}
  .qr-success-icon{width:78px; height:78px; border-radius:50%; background:rgba(61,220,151,0.15);
    display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--success);}

  /* ---------- MINIGAME SCREEN ---------- */
  .game-screen{position:absolute; inset:0; background:linear-gradient(160deg, #1b1b28 0%, #14141d 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  .game-topbar{position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;}
  .game-title{font-size:15px; font-weight:700;}
  .game-timer{font-size:12px; color:var(--text-muted); background:var(--surface2); padding:5px 12px; border-radius:var(--radius-pill);}
  .puzzle-board{display:grid; grid-template-columns:repeat(4, 76px); gap:12px; margin-top:8px;}
  .puzzle-tile{width:76px; height:76px; border-radius:14px; background:var(--surface); border:1px solid var(--border-mist);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--text);
    transition:all 0.2s cubic-bezier(0.2,0.8,0.3,1); animation:floatBob 3.4s ease-in-out infinite;}
  .puzzle-tile:nth-child(2){animation-delay:0.2s;}
  .puzzle-tile:nth-child(3){animation-delay:0.4s;}
  .puzzle-tile:nth-child(4){animation-delay:0.6s;}
  .puzzle-tile.is-picked{outline:2px solid var(--primary); background:var(--primary-soft); transform:scale(1.06);}
  .puzzle-tile.is-correct{background:rgba(61,220,151,0.14); border-color:var(--success); color:var(--success);}
  .game-hint{margin-top:20px; font-size:13px; color:var(--text-muted); text-align:center;}
  .game-clear{display:flex; flex-direction:column; align-items:center; gap:16px; animation:popIn 0.5s cubic-bezier(0.2,1.4,0.4,1);}
  .clear-badge{width:96px; height:96px; border-radius:28px; background:linear-gradient(135deg, var(--primary), #7d8bf2);
    display:flex; align-items:center; justify-content:center; font-size:46px; box-shadow:0 16px 40px rgba(82,102,235,0.4);}
  .clear-title{font-size:22px; font-weight:800;}

  /* ---------- REWARD SCREEN ---------- */
  .reward-screen{position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, #23233a 0%, #14141d 60%);
    display:flex; flex-direction:column; align-items:center; padding:70px 24px 30px; overflow-y:auto;}
  .reward-badge{width:104px; height:104px; border-radius:50%; background:linear-gradient(150deg, #f5a742, #f56b42);
    display:flex; align-items:center; justify-content:center; font-size:48px; box-shadow:0 20px 46px rgba(245,167,66,0.3);
    animation:popIn 0.55s cubic-bezier(0.2,1.4,0.4,1);}
  .reward-points{font-size:40px; font-weight:800; margin:18px 0 2px; letter-spacing:-0.5px;}
  .reward-sub{font-size:13px; color:var(--text-muted); margin-bottom:26px;}
  .voice-card, .share-card{width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border-mist);
    border-radius:var(--radius-card); padding:18px; margin-bottom:14px;}
  .voice-row{display:flex; align-items:center; gap:14px;}
  .play-toggle{width:44px; height:44px; border-radius:50%; background:var(--primary); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff;}
  .wave{display:flex; align-items:center; gap:3px; height:22px; flex:1;}
  .wave span{width:3px; border-radius:2px; background:var(--primary); display:inline-block;}
  .wave.is-playing span{animation:waveBar 0.9s ease-in-out infinite;}
  .share-title{font-size:13px; font-weight:700; margin:0 0 12px; color:var(--text-muted);}
  .share-row{display:flex; gap:10px;}
  .share-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px;
    border-radius:14px; background:var(--surface2); font-size:12px; font-weight:600;}
  .share-btn:hover{background:rgba(255,255,255,0.08);}
  .share-btn i{font-size:22px;}
  .reward-back{margin-top:8px; color:var(--text-muted); font-size:13px; display:flex; align-items:center; gap:6px;}

  .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:var(--surface2);
    border:1px solid var(--border-mist-strong); color:var(--text); padding:12px 20px; border-radius:var(--radius-pill);
    font-size:13px; font-weight:600; z-index:60; display:flex; align-items:center; gap:8px; box-shadow:0 12px 30px rgba(0,0,0,0.4);
    animation:toastIn 0.3s cubic-bezier(0.2,0.8,0.3,1);}
  .toast i{color:var(--success); font-size:16px;}

  .hero-heading{position:absolute; left:20px; bottom:236px; z-index:14; font-size:34px; font-weight:800;
    letter-spacing:-0.5px; max-width:280px; line-height:1.15; text-shadow:0 4px 16px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const QUESTS = [
  { id:1, name:'남산 전망대 미션', status:'complete', x:24, y:32, desc:'서울 전경이 내려다보이는 전망대에서 첫 번째 스토리 조각을 확인합니다.', type:'qr' },
  { id:2, name:'명동 상점가 퀘스트', status:'active', x:52, y:22, desc:'상점가 곳곳에 숨겨진 QR 코드를 찾아 스캔하면 다음 스토리로 이어집니다.', type:'qr' },
  { id:3, name:'정동길 역사 탐방', status:'locked', x:38, y:55, desc:'이전 미션을 완료하면 잠금이 해제되는 역사 탐방 구간입니다.', type:'game' },
  { id:4, name:'청계천 야간 미션', status:'active', x:68, y:48, desc:'야간 조명 아래 미니게임을 클리어해 다음 지점으로 향합니다.', type:'game' },
  { id:5, name:'북촌 골목 수수께끼', status:'locked', x:60, y:74, desc:'좁은 골목 사이 QR 코드를 스캔해 수수께끼를 풀어야 합니다.', type:'qr' },
  { id:6, name:'동대문 야시장 챌린지', status:'locked', x:82, y:68, desc:'야시장 상점을 돌며 마지막 퀘스트를 완료합니다.', type:'game' },
];

const STATUS_LABEL = { active:'진행중', complete:'완료', locked:'잠김' };
const STATUS_ICON = { active:'ph-navigation-arrow', complete:'ph-check', locked:'ph-lock-simple' };

function TopBar({ points }) {
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-badge"><i className="ph-fill ph-compass"></i></div>
        <div>
          <div className="brand-name">시티퀘스트 투어</div>
          <div className="brand-sub">도심 탐험 GPS 미션</div>
        </div>
      </div>
      <div className="points-chip"><i className="ph-fill ph-coin"></i>{points.toLocaleString('ko-KR')}P</div>
    </div>
  );
}

function MapScreen({ points, onEnterQr, onEnterGame, onEnterReward, questsState, onSelectQuest, selectedId }) {
  const [query, setQuery] = useState('');
  const [zoom, setZoom] = useState(1);
  const selected = questsState.find(q => q.id === selectedId) || null;
  const filtered = questsState.filter(q => q.name.includes(query));

  return (
    <div className="screen map-wrap">
      <svg className="map-grid" viewBox="0 0 100 100" preserveAspectRatio="none"
        style={{ transform:`scale(${zoom})`, transformOrigin:'44% 40%', transition:'transform 0.25s ease' }}>
        <defs>
          <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="#2a2a3d" />
            <stop offset="100%" stopColor="#1c1c29" />
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="url(#roadGrad)" opacity="0.35" />
        <path d="M0,30 L100,22" stroke="#3a3a52" strokeWidth="0.9" fill="none" />
        <path d="M0,58 L100,50" stroke="#3a3a52" strokeWidth="0.9" fill="none" />
        <path d="M20,0 L28,100" stroke="#3a3a52" strokeWidth="0.9" fill="none" />
        <path d="M64,0 L58,100" stroke="#3a3a52" strokeWidth="0.9" fill="none" />
        <path d="M0,80 L100,86" stroke="#2c2c40" strokeWidth="0.6" fill="none" />
        <rect x="8" y="8" width="10" height="8" rx="1" fill="#22222f" />
        <rect x="45" y="10" width="14" height="7" rx="1" fill="#22222f" />
        <rect x="72" y="14" width="9" height="9" rx="1" fill="#22222f" />
        <rect x="14" y="62" width="11" height="9" rx="1" fill="#22222f" />
        <rect x="70" y="72" width="13" height="8" rx="1" fill="#22222f" />
      </svg>

      <div className="player-dot map-pin" style={{ left:'44%', top:'40%' }}>
        <div className="player-ring"></div>
      </div>

      {questsState.map(q => (
        <div key={q.id} className="marker" data-status={q.status} data-selected={selectedId===q.id}
          style={{ left:`${q.x}%`, top:`${q.y}%` }} onClick={() => onSelectQuest(q.id)}>
          <div className="marker-pin"><i className={`ph-fill ${STATUS_ICON[q.status]}`}></i></div>
        </div>
      ))}

      <TopBar points={points} />

      <div className="hero-heading">GPS 위치 기반 퀘스트 활성화가 지도 위에서 실시간으로 진행됩니다</div>

      <div className="drawer">
        <div className="drawer-head">
          <div className="drawer-title">퀘스트 목록</div>
          <div className="search-box">
            <i className="ph-magnifying-glass"></i>
            <input placeholder="퀘스트 검색" value={query} onChange={e=>setQuery(e.target.value)} />
          </div>
        </div>
        <div className="result-list">
          {filtered.map(q => (
            <div key={q.id} className={`quest-item ${selectedId===q.id?'is-selected':''}`} onClick={()=>onSelectQuest(q.id)}>
              <span className={`quest-dot ${q.status}`}></span>
              <div>
                <div className="quest-item-name">{q.name}</div>
                <div className="quest-item-meta">{STATUS_LABEL[q.status]} · {q.type==='qr'?'QR 인증형':'미니게임형'}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="map-control">
        <button aria-label="확대" onClick={()=>setZoom(z=>Math.min(1.6, +(z+0.2).toFixed(1)))}><i className="ph-plus"></i></button>
        <button aria-label="축소" onClick={()=>setZoom(z=>Math.max(0.8, +(z-0.2).toFixed(1)))}><i className="ph-minus"></i></button>
      </div>

      <div className="legend">
        <div className="legend-row"><span className="legend-dot" style={{background:'var(--primary)'}}></span>진행중</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'var(--success)'}}></span>완료</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'var(--locked)'}}></span>잠김</div>
      </div>

      {selected && (
        <div className="detail-card">
          <span className={`detail-status ${selected.status}`}>{STATUS_LABEL[selected.status]}</span>
          <div className="detail-title">{selected.name}</div>
          <p className="detail-desc">{selected.desc}</p>
          <button className="detail-cta" disabled={selected.status==='locked'}
            onClick={() => {
              if (selected.status === 'locked') return;
              if (selected.type === 'qr') onEnterQr(); else onEnterGame();
            }}>
            <i className="ph-fill ph-play"></i>
            {selected.status==='locked' ? '이전 미션을 먼저 완료하세요' : '미션 시작'}
          </button>
        </div>
      )}

      <MissionBar active="main" onEnterQr={onEnterQr} onEnterGame={onEnterGame} onEnterReward={onEnterReward} />
    </div>
  );
}

function MissionBar({ active, onEnterQr, onEnterGame, onEnterReward }) {
  return (
    <div className="mission-bar">
      <div className={`mission-step ${active==='qr'?'done':''}`} onClick={onEnterQr}>
        <i className="ph-qr-code"></i>
        <span>QR 코드 스캔 인증</span>
      </div>
      <div className={`mission-step ${active==='game'?'done':''}`} onClick={onEnterGame}>
        <i className="ph-game-controller"></i>
        <span>2D 미니게임 클리어</span>
      </div>
      <div className={`mission-step ${active==='reward'?'done':''}`} onClick={onEnterReward}>
        <i className="ph-trophy"></i>
        <span>음성 안내 및 리워드 지급</span>
      </div>
    </div>
  );
}

function QrScreen({ onBack, onNext, onEnterQr, onEnterGame, onEnterReward }) {
  const [status, setStatus] = useState('scanning');
  const [torchOn, setTorchOn] = useState(false);

  return (
    <div className="screen qr-screen">
      <div className="qr-topbar">
        <button className="icon-btn" onClick={onBack}><i className="ph-arrow-left"></i></button>
        <button className={`icon-btn ${torchOn?'active':''}`} onClick={()=>setTorchOn(v=>!v)}>
          <i className="ph-flashlight"></i>
        </button>
      </div>

      {status === 'scanning' && (
        <React.Fragment>
          <div className="qr-frame">
            <div className="corner tl"></div><div className="corner tr"></div>
            <div className="corner bl"></div><div className="corner br"></div>
            <div className="scan-line"></div>
          </div>
          <p className="qr-hint">현장에 배치된 QR 코드를 프레임 안에 맞춰주세요.<br/>카메라가 자동으로 코드를 인식합니다.</p>
          <div className="qr-actions">
            <button className="qr-scan-btn" onClick={()=>setStatus('success')}>
              <i className="ph-fill ph-camera"></i>QR 코드 스캔 인증
            </button>
          </div>
        </React.Fragment>
      )}

      {status === 'success' && (
        <div className="qr-success">
          <div className="qr-success-icon"><i className="ph-fill ph-check-circle"></i></div>
          <div style={{fontSize:'19px', fontWeight:800}}>인증 완료</div>
          <p className="qr-hint" style={{marginTop:0}}>QR 코드 검증이 완료되어 미션 상태가 갱신되었습니다.</p>
          <button className="qr-scan-btn" onClick={onNext}>
            <i className="ph-fill ph-arrow-right"></i>다음 단계로 이동
          </button>
        </div>
      )}
      <MissionBar active="qr" onEnterQr={onEnterQr} onEnterGame={onEnterGame} onEnterReward={onEnterReward} />
    </div>
  );
}

function GameScreen({ onBack, onNext, onEnterQr, onEnterGame, onEnterReward }) {
  const [tiles, setTiles] = useState([3,1,4,2]);
  const [picked, setPicked] = useState(null);
  const [cleared, setCleared] = useState(false);
  const [seconds, setSeconds] = useState(0);

  useEffect(() => {
    if (cleared) return;
    const t = setInterval(()=>setSeconds(s=>s+1), 1000);
    return () => clearInterval(t);
  }, [cleared]);

  function handleTap(idx) {
    if (cleared) return;
    if (picked === null) { setPicked(idx); return; }
    if (picked === idx) { setPicked(null); return; }
    const next = [...tiles];
    [next[picked], next[idx]] = [next[idx], next[picked]];
    setTiles(next);
    setPicked(null);
    if (next.every((v,i)=>v===i+1)) setTimeout(()=>setCleared(true), 260);
  }

  return (
    <div className="screen game-screen">
      <div className="game-topbar">
        <button className="icon-btn" onClick={onBack}><i className="ph-arrow-left"></i></button>
        <div className="game-title">2D 미니게임 클리어</div>
        <div className="game-timer">{String(Math.floor(seconds/60)).padStart(2,'0')}:{String(seconds%60).padStart(2,'0')}</div>
      </div>

      {!cleared ? (
        <React.Fragment>
          <div className="puzzle-board">
            {tiles.map((v, i) => (
              <div key={i} className={`puzzle-tile ${picked===i?'is-picked':''} ${v===i+1?'is-correct':''}`}
                onClick={()=>handleTap(i)}>{v}</div>
            ))}
          </div>
          <p className="game-hint">타일을 두 번 눌러 순서를 맞추면 미션이 클리어됩니다 (1→2→3→4)</p>
        </React.Fragment>
      ) : (
        <div className="game-clear">
          <div className="clear-badge"><i className="ph-fill ph-puzzle-piece"></i></div>
          <div className="clear-title">미니게임 클리어!</div>
          <p className="game-hint" style={{marginTop:0}}>퍼즐 완료 신호가 스토리 진행 로직에 전달되었습니다.</p>
          <button className="qr-scan-btn" onClick={onNext}>
            <i className="ph-fill ph-arrow-right"></i>보상 확인하기
          </button>
        </div>
      )}
      <MissionBar active="game" onEnterQr={onEnterQr} onEnterGame={onEnterGame} onEnterReward={onEnterReward} />
    </div>
  );
}

function RewardScreen({ onBack, points, onClaim, claimed, onEnterQr, onEnterGame, onEnterReward }) {
  const [playing, setPlaying] = useState(false);
  const [toast, setToast] = useState(null);

  function share(channel) {
    setToast(`${channel} 공유 링크가 생성되었습니다`);
    setTimeout(()=>setToast(null), 2200);
  }

  return (
    <div className="screen reward-screen">
      <div className="qr-topbar" style={{position:'absolute'}}>
        <button className="icon-btn" onClick={onBack}><i className="ph-arrow-left"></i></button>
      </div>

      <div className="reward-badge"><i className="ph-fill ph-trophy"></i></div>
      <div className="reward-points">{claimed ? points.toLocaleString('ko-KR') : (points-120).toLocaleString('ko-KR')}P</div>
      <div className="reward-sub">청계천 야간 미션 완료 보상</div>

      {!claimed && (
        <button className="qr-scan-btn" style={{marginBottom:22}} onClick={onClaim}>
          <i className="ph-fill ph-gift"></i>보상 120P 수령하기
        </button>
      )}

      <div className="voice-card">
        <div className="voice-row">
          <button className="play-toggle" onClick={()=>setPlaying(p=>!p)}>
            <i className={playing ? 'ph-fill ph-pause' : 'ph-fill ph-play'}></i>
          </button>
          <div>
            <div style={{fontSize:13, fontWeight:700}}>음성 힌트 · 야간 미션 안내</div>
            <div style={{fontSize:11, color:'var(--text-muted)'}}>성우 음성 파일 재생 00:42</div>
          </div>
        </div>
        <div className={`wave ${playing?'is-playing':''}`} style={{marginTop:14}}>
          {[10,16,8,20,12,18,9,15,11,19,7,14].map((h,i)=>(
            <span key={i} style={{height:h, animationDelay:`${i*0.07}s`}}></span>
          ))}
        </div>
      </div>

      <div className="share-card">
        <div className="share-title">미션 결과 공유하기</div>
        <div className="share-row">
          <button className="share-btn" onClick={()=>share('카카오톡')}>
            <i className="ph-fill ph-chat-circle-text" style={{color:'#f5d742'}}></i>카카오톡
          </button>
          <button className="share-btn" onClick={()=>share('인스타그램')}>
            <i className="ph-fill ph-instagram-logo" style={{color:'#e07a5f'}}></i>인스타그램
          </button>
        </div>
      </div>

      <button className="reward-back" onClick={onBack}><i className="ph-map-trifold"></i>지도로 돌아가기</button>

      {toast && <div className="toast"><i className="ph-fill ph-check-circle"></i>{toast}</div>}
      <MissionBar active="reward" onEnterQr={onEnterQr} onEnterGame={onEnterGame} onEnterReward={onEnterReward} />
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [points, setPoints] = useState(1240);
  const [claimed, setClaimed] = useState(false);
  const [selectedId, setSelectedId] = useState(2);
  const [questsState] = useState(QUESTS);

  function claimReward() {
    setClaimed(true);
    setPoints(p => p + 120);
  }

  return (
    <div data-archetype="map-canvas" style={{ width:'100%', height:'100%', position:'relative' }}>
      {view === 'main' && (
        <MapScreen points={points} questsState={questsState} selectedId={selectedId}
          onSelectQuest={setSelectedId}
          onEnterQr={() => setView('qr')}
          onEnterGame={() => setView('game')}
          onEnterReward={() => setView('reward')} />
      )}
      {view === 'qr' && <QrScreen onBack={()=>setView('main')} onNext={()=>setView('game')}
        onEnterQr={()=>setView('qr')} onEnterGame={()=>setView('game')} onEnterReward={()=>setView('reward')} />}
      {view === 'game' && <GameScreen onBack={()=>setView('main')} onNext={()=>setView('reward')}
        onEnterQr={()=>setView('qr')} onEnterGame={()=>setView('game')} onEnterReward={()=>setView('reward')} />}
      {view === 'reward' && <RewardScreen onBack={()=>setView('main')} points={points} claimed={claimed} onClaim={claimReward}
        onEnterQr={()=>setView('qr')} onEnterGame={()=>setView('game')} onEnterReward={()=>setView('reward')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
