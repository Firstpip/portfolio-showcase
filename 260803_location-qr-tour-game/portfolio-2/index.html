<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS 투어 게임 통합 운영 콘솔 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#000000; --ink-soft:#181818; --muted:#6d6d6d; --mist:#9a9a9a; --pewter:#808080;
    --accent:#a02d25; --accent-soft:#f6e6e4; --hair:#000000; --sidebar:#000000; --sidebar-text:#ffffff;
    --radius-card:4px; --radius-pill:9999px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{width:100%; height:100%; margin:0; padding:0; background:var(--bg);}
  body{font-family:'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif; color:var(--ink);}
  #app-root{width:100%; min-height:100vh;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input, select{font-family:inherit;}
  ::-webkit-scrollbar{width:7px; height:7px;}
  ::-webkit-scrollbar-thumb{background:var(--mist); border-radius:8px;}

  @keyframes fadeInScale{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes slideInPanel{ from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;} }
  @keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  @keyframes toastRise{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes countRing{ from{stroke-dashoffset:283;} }

  /* ---------- SHELL (sidebar-classic) ---------- */
  .shell{display:flex; width:100%; min-height:100vh;}
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:236px; background:var(--sidebar); color:var(--sidebar-text);
    display:flex; flex-direction:column; padding:22px 16px; z-index:30;}
  .side-brand{display:flex; align-items:center; gap:10px; padding:0 6px 24px; border-bottom:1px solid rgba(255,255,255,0.14); margin-bottom:18px;}
  .side-brand-mark{width:32px; height:32px; border:1px solid #fff; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center;}
  .side-brand-name{font-size:14px; font-weight:700; letter-spacing:0.2px;}
  .side-brand-sub{font-size:10.5px; color:rgba(255,255,255,0.5);}
  .side-nav{display:flex; flex-direction:column; gap:2px;}
  .side-item{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:2px; font-size:13px;
    font-weight:600; color:rgba(255,255,255,0.62); position:relative; transition:all 0.15s ease;}
  .side-item:hover{color:#fff; background:rgba(255,255,255,0.06);}
  .side-item.is-active{color:#fff; background:rgba(255,255,255,0.1);}
  .side-item.is-active::before{content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:3px; background:var(--accent);}
  .side-item i{width:16px; height:16px; flex-shrink:0;}
  .side-foot{margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.14); display:flex; align-items:center; gap:10px;}
  .avatar{width:32px; height:32px; border-radius:var(--radius-pill); overflow:hidden; flex-shrink:0; background:#333;}
  .avatar img{width:100%; height:100%; display:block;}
  .side-foot-name{font-size:12px; font-weight:700;}
  .side-foot-role{font-size:10.5px; color:rgba(255,255,255,0.5);}

  .main-wrap{margin-left:236px; flex:1; min-width:0; width:calc(100% - 236px); min-height:100vh; background:var(--bg);}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid var(--hair);}
  .page-title{font-size:22px; font-weight:800; letter-spacing:-0.3px;}
  .page-sub{font-size:12px; color:var(--muted); margin-top:3px;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .search-pill{display:flex; align-items:center; gap:8px; border:1px solid var(--hair); border-radius:var(--radius-pill); padding:9px 16px;}
  .search-pill input{border:none; outline:none; font-size:12.5px; width:170px; background:none;}
  .icon-ghost{width:36px; height:36px; border:1px solid var(--hair); border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center;}
  .icon-ghost:hover{background:#000; color:#fff;}
  .content{padding:28px 32px 60px; animation:fadeInScale 0.3s ease;}

  .live-banner{position:relative; height:44px; overflow:hidden; display:flex; align-items:center;
    padding:0 32px; color:#fff; font-size:12px; font-weight:700; letter-spacing:0.2px;
    background:linear-gradient(90deg, rgb(160,224,171) 0%, rgb(255,172,46) 50%, rgb(165,45,37) 100%);}
  .live-banner-dot{width:7px; height:7px; border-radius:50%; background:#fff; margin-right:10px;
    animation:pulseDot 1.6s ease-in-out infinite; box-shadow:0 0 0 3px rgba(255,255,255,0.35);}
  .live-banner span.muted{margin-left:8px; opacity:0.85; font-weight:500;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 11px;
    border-radius:var(--radius-pill); border:1px solid var(--hair); text-transform:uppercase; letter-spacing:0.3px;}
  .badge.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
  .badge.soft{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft);}
  .badge.mute{color:var(--muted); border-color:#ccc;}

  .btn{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:10px 22px;
    border-radius:var(--radius-pill); border:1px solid var(--hair); transition:all 0.15s ease;}
  .btn:hover{background:#000; color:#fff;}
  .btn.filled{background:#000; color:#fff;}
  .btn.filled:hover{background:#222;}
  .btn.small{padding:7px 14px; font-size:12px;}

  /* ---------- DASHBOARD (insight-board composition) ---------- */
  .dash-top{display:grid; grid-template-columns:2.1fr 1fr; gap:20px; margin-bottom:20px;}
  .card{border:1px solid var(--hair); border-radius:var(--radius-card); background:#fff;}
  .hero-viz{padding:22px;}
  .hero-viz-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:14px;}
  .hero-viz-title{font-size:15px; font-weight:800;}
  .chart-box{position:relative; height:260px;}
  .kpi-side{display:flex; flex-direction:column; gap:14px;}
  .kpi-card{border:1px solid var(--hair); border-radius:var(--radius-card); padding:18px;}
  .kpi-label{font-size:11.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px;}
  .kpi-value{font-size:54px; font-weight:800; letter-spacing:-1.5px; line-height:1.05; margin-top:6px;}
  .kpi-value.small{font-size:32px;}
  .kpi-delta{font-size:11.5px; color:var(--muted); margin-top:6px;}
  .kpi-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulseDot 1.8s ease-in-out infinite;}

  .widget-grid{display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:20px;}
  .widget{border:1px solid var(--hair); border-radius:var(--radius-card); padding:20px; display:flex; flex-direction:column;}
  .widget-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .widget-title{font-size:13.5px; font-weight:800;}

  table.plist{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.plist th{text-align:left; font-size:10.5px; color:var(--muted); font-weight:700; padding:6px 8px;
    border-bottom:1px solid var(--hair); cursor:pointer; user-select:none;}
  table.plist td{padding:9px 8px; border-bottom:1px solid #eee;}
  table.plist tr.row{cursor:pointer; transition:background 0.12s ease;}
  table.plist tr.row:hover{background:#f7f5f2;}
  .status-chip{font-size:10px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill);}
  .status-chip.active{background:var(--accent-soft); color:var(--accent);}
  .status-chip.complete{background:#000; color:#fff;}
  .status-chip.idle{color:var(--muted); border:1px solid #ddd;}

  .mini-widget-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #eee; font-size:12px;}
  .mini-widget-row:last-child{border-bottom:none;}

  .detail-panel{position:fixed; top:0; right:0; bottom:0; width:340px; background:#fff; border-left:1px solid var(--hair);
    z-index:50; padding:26px 22px; overflow-y:auto; animation:slideInPanel 0.24s cubic-bezier(0.19,1,0.22,1);}
  .detail-panel-close{position:absolute; top:20px; right:20px;}
  .detail-panel h3{font-size:19px; font-weight:800; margin:26px 0 4px;}
  .log-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #eee; font-size:12px;}
  .log-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}
  .overlay-dim{position:fixed; inset:0; background:rgba(0,0,0,0.32); z-index:40;}

  /* ---------- CONTENT SCREEN ---------- */
  .story-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:22px;}
  .story-list{display:flex; flex-direction:column; gap:10px;}
  .story-item{border:1px solid var(--hair); border-radius:var(--radius-card); padding:16px; cursor:pointer; transition:background 0.15s ease;}
  .story-item:hover{background:#f7f5f2;}
  .story-item.is-active{background:var(--ink); color:#fff;}
  .story-item-title{font-size:13.5px; font-weight:700;}
  .story-item-meta{font-size:11px; color:var(--muted); margin-top:4px;}
  .story-item.is-active .story-item-meta{color:rgba(255,255,255,0.6);}
  .editor-card{border:1px solid var(--hair); border-radius:var(--radius-card); padding:22px;}
  .editor-textarea{width:100%; min-height:150px; border:1px solid var(--hair); border-radius:2px; padding:12px;
    font-size:13px; font-family:inherit; resize:vertical; outline:none; line-height:1.7;}
  .upload-zone{border:1.5px dashed var(--hair); border-radius:var(--radius-card); padding:24px; text-align:center;
    margin-top:14px; transition:background 0.15s ease;}
  .upload-zone.is-drag{background:var(--accent-soft); border-color:var(--accent);}
  .version-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #eee; font-size:12px;}

  /* ---------- MONITORING SCREEN ---------- */
  .mon-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:20px;}
  .mon-card{border:1px solid var(--hair); border-radius:var(--radius-card); padding:18px;}
  .mon-card.alert{border-color:var(--accent); background:var(--accent-soft);}
  .mon-label{font-size:11px; color:var(--muted); font-weight:700;}
  .mon-value{font-size:32px; font-weight:800; margin-top:6px; letter-spacing:-1px;}
  .gauge-wrap{display:flex; align-items:center; gap:14px;}
  .queue-bars{display:flex; align-items:flex-end; gap:5px; height:60px; margin-top:10px;}
  .queue-bars span{flex:1; background:var(--ink); transform-origin:bottom; animation:barGrow 0.6s cubic-bezier(0.2,0.8,0.3,1) backwards;}

  /* ---------- CAMPAIGN SCREEN ---------- */
  .camp-grid{display:grid; grid-template-columns:1fr 1.4fr; gap:20px;}
  .rank-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee;}
  .rank-num{width:24px; height:24px; border-radius:50%; border:1px solid var(--hair); display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;}
  .rank-num.top{background:var(--accent); color:#fff; border-color:var(--accent);}

  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#000; color:#fff;
    padding:12px 20px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:600; z-index:70;
    animation:toastRise 0.3s ease; display:flex; align-items:center; gap:8px;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const NAV = [
  { key:'main', label:'가입자 진행 현황 관리', icon:'layout-dashboard' },
  { key:'content', label:'콘텐츠 및 스토리 관리', icon:'notebook-pen' },
  { key:'monitoring', label:'이벤트 트래픽 대응 인프라 모니터링', icon:'activity' },
  { key:'campaign', label:'소셜 공유 캠페인 관리', icon:'share-2' },
];

const PARTICIPANTS = [
  { id:1, name:'김민수', email:'minsu.kim@example.com', point:2840, quest:'동대문 야시장 챌린지', status:'complete', joined:'2026.08.01' },
  { id:2, name:'이지은', email:'jieun.lee@example.com', point:1920, quest:'청계천 야간 미션', status:'active', joined:'2026.08.02' },
  { id:3, name:'박준호', email:'junho.park@example.com', point:2410, quest:'북촌 골목 수수께끼', status:'active', joined:'2026.08.01' },
  { id:4, name:'최서연', email:'seoyeon.choi@example.com', point:640, quest:'명동 상점가 퀘스트', status:'idle', joined:'2026.08.03' },
  { id:5, name:'정우진', email:'woojin.jung@example.com', point:3120, quest:'전체 퀘스트 완료', status:'complete', joined:'2026.07.31' },
  { id:6, name:'한소희', email:'sohee.han@example.com', point:1150, quest:'정동길 역사 탐방', status:'active', joined:'2026.08.02' },
];

const STORIES = [
  { id:1, title:'프롤로그 · 도시의 신호', updated:'2026.08.02', versions:3 },
  { id:2, title:'2장 · 명동 상점가의 단서', updated:'2026.08.01', versions:5 },
  { id:3, title:'3장 · 청계천 야간 미션 힌트', updated:'2026.07.30', versions:2 },
  { id:4, title:'최종장 · 야시장의 비밀', updated:'2026.07.28', versions:4 },
];

function useLucide(deps) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, deps);
}

function LineChart({ id, labels, data, color }) {
  const ref = useRef(null);
  useEffect(() => {
    const ctx = ref.current.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,240);
    grad.addColorStop(0, color + '33'); grad.addColorStop(1, color + '02');
    const chart = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{ data, borderColor:color, backgroundColor:grad, fill:true, tension:0.35, pointRadius:0, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ x:{ grid:{display:false}, ticks:{font:{size:10}, color:'#6d6d6d'} }, y:{ grid:{color:'#f0f0f0'}, ticks:{font:{size:10}, color:'#6d6d6d'} } } }
    });
    return () => chart.destroy();
  }, []);
  return <canvas ref={ref} id={id}></canvas>;
}

function DoughnutChart({ id, labels, data, colors }) {
  const ref = useRef(null);
  useEffect(() => {
    const chart = new Chart(ref.current.getContext('2d'), {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'#fff' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:11}}}} }
    });
    return () => chart.destroy();
  }, []);
  return <canvas ref={ref} id={id}></canvas>;
}

function Sidebar({ view, setView }) {
  useLucide([view]);
  return (
    <aside className="sidebar">
      <div className="side-brand">
        <div className="side-brand-mark"><i data-lucide="compass" style={{width:15,height:15}}></i></div>
        <div>
          <div className="side-brand-name">시티퀘스트 운영 콘솔</div>
          <div className="side-brand-sub">GPS 투어 게임 관리자</div>
        </div>
      </div>
      <nav className="side-nav">
        {NAV.map(n => (
          <div key={n.key} className={`side-item ${view===n.key?'is-active':''}`} onClick={()=>setView(n.key)}>
            <i data-lucide={n.icon}></i>{n.label}
          </div>
        ))}
      </nav>
      <div className="side-foot">
        <div className="avatar"><img src="https://source.boringavatars.com/beam/64/operator-kim?colors=000000,a02d25,6d6d6d,ffffff,9a9a9a" alt="관리자" /></div>
        <div>
          <div className="side-foot-name">운영자 김하늘</div>
          <div className="side-foot-role">이벤트 운영팀</div>
        </div>
      </div>
    </aside>
  );
}

function DetailPanel({ user, onClose }) {
  if (!user) return null;
  return (
    <React.Fragment>
      <div className="overlay-dim" onClick={onClose}></div>
      <div className="detail-panel">
        <button className="icon-ghost detail-panel-close" onClick={onClose}><i data-lucide="x" style={{width:16,height:16}}></i></button>
        <div className="avatar" style={{width:52, height:52}}><img src={`https://source.boringavatars.com/beam/64/${user.email}?colors=000000,a02d25,6d6d6d,ffffff,9a9a9a`} alt={user.name} /></div>
        <h3>{user.name}</h3>
        <div style={{fontSize:12, color:'var(--muted)'}}>{user.email}</div>
        <div style={{display:'flex', gap:8, margin:'14px 0'}}>
          <span className={`status-chip ${user.status}`}>{user.status==='complete'?'전체 완료':user.status==='active'?'진행중':'대기'}</span>
          <span className="badge mute">가입 {user.joined}</span>
        </div>
        <div className="widget" style={{padding:14, marginBottom:14}}>
          <div className="widget-title" style={{marginBottom:8}}>누적 포인트</div>
          <div className="kpi-value small">{user.point.toLocaleString('ko-KR')}P</div>
        </div>
        <div className="widget-title" style={{marginBottom:6}}>퀘스트 진행 이력</div>
        <div className="log-item"><span className="log-dot"></span>{user.quest} 진행 중 · 포인트 적립</div>
        <div className="log-item"><span className="log-dot"></span>QR 코드 스캔 인증 완료 · +120P</div>
        <div className="log-item"><span className="log-dot"></span>회원가입 및 최초 접속 · {user.joined}</div>
      </div>
    </React.Fragment>
  );
}

function MainDashboard({ onGo }) {
  const [query, setQuery] = useState('');
  const [sortKey, setSortKey] = useState('point');
  const [sortAsc, setSortAsc] = useState(false);
  const [selected, setSelected] = useState(null);

  const filtered = PARTICIPANTS.filter(p => p.name.includes(query) || p.email.includes(query))
    .sort((a,b) => sortAsc ? (a[sortKey]>b[sortKey]?1:-1) : (a[sortKey]<b[sortKey]?1:-1));

  function toggleSort(key) {
    if (sortKey === key) setSortAsc(v=>!v); else { setSortKey(key); setSortAsc(false); }
  }

  return (
    <div className="content">
      <div className="dash-top">
        <div className="card hero-viz">
          <div className="hero-viz-head">
            <div className="hero-viz-title">실시간 참여자 추이</div>
            <span className="badge soft"><i data-lucide="trending-up" style={{width:12,height:12}}></i>지난 7일</span>
          </div>
          <div className="chart-box">
            <LineChart id="hero-chart" labels={['월','화','수','목','금','토','일']} data={[420,610,540,780,860,940,1120]} color="#a02d25" />
          </div>
        </div>
        <div className="kpi-side">
          <div className="kpi-card">
            <div className="kpi-label"><span className="kpi-dot"></span>총 참여자</div>
            <div className="kpi-value">12,480</div>
            <div className="kpi-delta">전일 대비 +342명</div>
          </div>
          <div className="kpi-card" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div>
              <div className="kpi-label">퀘스트 완료율</div>
              <div className="kpi-value small">68%</div>
            </div>
            <div>
              <div className="kpi-label">트래픽 상태</div>
              <span className="badge soft" style={{marginTop:6}}>정상</span>
            </div>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="widget">
          <div className="widget-head">
            <div className="widget-title">참여자 목록</div>
            <div className="search-pill" style={{padding:'6px 12px'}}>
              <i data-lucide="search" style={{width:13,height:13}}></i>
              <input placeholder="닉네임·이메일 검색" value={query} onChange={e=>setQuery(e.target.value)} style={{width:110}} />
            </div>
          </div>
          <table className="plist">
            <thead>
              <tr>
                <th onClick={()=>toggleSort('name')}>이름</th>
                <th onClick={()=>toggleSort('point')}>포인트순</th>
                <th onClick={()=>toggleSort('joined')}>가입일순</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => (
                <tr key={p.id} className="row" onClick={()=>setSelected(p)}>
                  <td>{p.name}</td>
                  <td>{p.point.toLocaleString('ko-KR')}P</td>
                  <td>{p.joined}</td>
                  <td><span className={`status-chip ${p.status}`}>{p.status==='complete'?'완료':p.status==='active'?'진행중':'대기'}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="widget">
          <div className="widget-head"><div className="widget-title">콘텐츠 현황</div>
            <button className="icon-ghost" onClick={()=>onGo('content')}><i data-lucide="arrow-up-right" style={{width:14,height:14}}></i></button>
          </div>
          {STORIES.slice(0,3).map(s => (
            <div className="mini-widget-row" key={s.id}><span>{s.title}</span><span className="badge mute">v{s.versions}</span></div>
          ))}
          <button className="btn small" style={{marginTop:14}} onClick={()=>onGo('content')}>콘텐츠 관리 열기</button>
        </div>

        <div className="widget">
          <div className="widget-head"><div className="widget-title">캠페인 현황</div>
            <button className="icon-ghost" onClick={()=>onGo('campaign')}><i data-lucide="arrow-up-right" style={{width:14,height:14}}></i></button>
          </div>
          <div style={{height:120}}>
            <DoughnutChart id="mini-donut" labels={['카카오톡','인스타그램']} data={[62,38]} colors={['#000000','#a02d25']} />
          </div>
        </div>
      </div>

      <DetailPanel user={selected} onClose={()=>setSelected(null)} />
    </div>
  );
}

function ContentScreen() {
  const [activeId, setActiveId] = useState(1);
  const [text, setText] = useState('플레이어는 도심 한복판에서 낯선 신호를 감지한다. GPS가 가리키는 첫 좌표로 이동하라는 안내가 화면에 표시된다...');
  const [drag, setDrag] = useState(false);
  const [toast, setToast] = useState(null);
  const [versions, setVersions] = useState([{ v:3, note:'GPS 안내 문구 수정', by:'김하늘', at:'08.02 14:20' }, { v:2, note:'오탈자 정정', by:'박도윤', at:'08.01 09:40' }]);

  function save() {
    setVersions(v => [{ v:v[0].v+1, note:'스토리 텍스트 갱신', by:'김하늘', at:'08.03 방금' }, ...v]);
    setToast('변경 이력이 저장되었습니다');
    setTimeout(()=>setToast(null), 2000);
  }
  function drop(e) {
    e.preventDefault(); setDrag(false);
    setToast('오디오 파일이 업로드되어 음성 안내로 연결되었습니다');
    setTimeout(()=>setToast(null), 2200);
  }

  const active = STORIES.find(s=>s.id===activeId);

  return (
    <div className="content">
      <div className="story-grid">
        <div>
          <div className="widget-title" style={{marginBottom:12}}>스토리 챕터</div>
          <div className="story-list">
            {STORIES.map(s => (
              <div key={s.id} className={`story-item ${activeId===s.id?'is-active':''}`} onClick={()=>setActiveId(s.id)}>
                <div className="story-item-title">{s.title}</div>
                <div className="story-item-meta">최종 수정 {s.updated} · v{s.versions}</div>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="editor-card">
            <div className="widget-title" style={{marginBottom:12}}>{active.title} 편집</div>
            <textarea className="editor-textarea" value={text} onChange={e=>setText(e.target.value)} />
            <div style={{display:'flex', gap:8, marginTop:12}}>
              <button className="btn filled" onClick={save}><i data-lucide="save" style={{width:14,height:14}}></i>변경 저장</button>
            </div>
            <div className={`upload-zone ${drag?'is-drag':''}`}
              onDragOver={e=>{e.preventDefault(); setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={drop}>
              <i data-lucide="upload-cloud" style={{width:22,height:22}}></i>
              <div style={{fontSize:12.5, marginTop:8}}>새 음성 파일을 이곳에 끌어다 놓거나 클릭해 업로드하세요</div>
            </div>
            <div className="widget-title" style={{margin:'20px 0 6px'}}>변경 이력</div>
            {versions.map((v,i) => (
              <div className="version-row" key={i}>
                <span>v{v.v} · {v.note}</span>
                <span style={{color:'var(--muted)'}}>{v.by} · {v.at}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      {toast && <div className="toast"><i data-lucide="check-circle" style={{width:14,height:14}}></i>{toast}</div>}
    </div>
  );
}

function MonitoringScreen() {
  const bars = [40,55,48,70,62,80,74,90,68,58];
  return (
    <div className="content">
      <div className="mon-grid">
        <div className="mon-card alert">

          <div className="mon-value">3,842</div>
          <span className="badge accent" style={{marginTop:8}}><i data-lucide="alert-triangle" style={{width:11,height:11}}></i>임계값 근접</span>
        </div>
        <div className="mon-card">
          <div className="mon-label">평균 응답 지연</div>
          <div className="mon-value">184ms</div>
          <div style={{fontSize:11, color:'var(--muted)', marginTop:6}}>목표 250ms 이내 유지</div>
        </div>
        <div className="mon-card">
          <div className="mon-label">Redis 캐시 적중률</div>

        </div>

      <div className="dash-top">
        <div className="card hero-viz">

            <span className="badge mute">오토스케일링 대응</span>
          </div>
          <div className="queue-bars">
            {bars.map((h,i)=>(<span key={i} style={{height:`${h}%`, animationDelay:`${i*0.05}s`}}></span>))}

        <div className="widget">
          <div className="widget-title" style={{marginBottom:12}}>컨테이너 오토스케일링 상태</div>
          <div className="mini-widget-row"><span>API 컨테이너</span><span className="badge soft">4 / 8 가동</span></div>
          <div className="mini-widget-row"><span>QR 검증 워커</span><span className="badge soft">2 / 4 가동</span></div>
          <div className="mini-widget-row"><span>정적 자산 CDN</span><span className="badge mute">캐시 정상</span></div>
          <div className="mini-widget-row"><span>DB 커넥션 풀</span><span className="badge mute">62% 사용</span></div>
        </div>
      </div>
    </div>
  );
}

function CampaignScreen() {
  const ranking = [
    { name:'동대문 야시장 챌린지', shares:842 },
    { name:'청계천 야간 미션', shares:611 },
    { name:'남산 전망대 미션', shares:398 },
  ];
  return (
    <div className="content">
      <div className="camp-grid">
        <div className="card" style={{padding:22}}>
          <div className="widget-title" style={{marginBottom:12}}>채널별 공유 비중</div>
          <div style={{height:230}}>
            <DoughnutChart id="camp-donut" labels={['카카오톡','인스타그램']} data={[1420,860]} colors={['#000000','#a02d25']} />
          </div>
        </div>
        <div className="card hero-viz">
          <div className="hero-viz-head">
            <div className="hero-viz-title">일자별 공유 추이</div>
            <div className="search-pill" style={{padding:'6px 12px'}}>
              <select style={{border:'none', outline:'none', fontSize:12}}><option>최근 7일</option><option>최근 30일</option></select>
            </div>
          </div>
          <div className="chart-box">
            <LineChart id="camp-line" labels={['월','화','수','목','금','토','일']} data={[120,180,160,240,310,280,360]} color="#000000" />
          </div>
        </div>
      </div>
      <div className="widget" style={{marginTop:20}}>
        <div className="widget-title" style={{marginBottom:6}}>가장 많이 공유된 미션 TOP 3</div>
        {ranking.map((r,i)=>(
          <div className="rank-row" key={r.name}>
            <div className={`rank-num ${i===0?'top':''}`}>{i+1}</div>
            <div style={{flex:1, fontSize:13, fontWeight:600}}>{r.name}</div>

          </div>
        ))}

    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [showAlerts, setShowAlerts] = useState(false);
  const current = NAV.find(n=>n.key===view);
  useLucide([view, showAlerts]);

  return (
    <div className="shell">
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="page-title">{current.label}</div>
            <div className="page-sub">시티퀘스트 투어 · 이벤트 운영 콘솔</div>
          </div>
          <div className="topbar-right">
            <div className="search-pill"><i data-lucide="search" style={{width:14,height:14}}></i><input placeholder="전체 검색" /></div>
            <button className="icon-ghost" style={{position:'relative'}} onClick={()=>setShowAlerts(v=>!v)}>
              <i data-lucide="bell" style={{width:15,height:15}}></i>
              <span style={{position:'absolute', top:6, right:7, width:6, height:6, borderRadius:'50%', background:'var(--accent)'}}></span>
            </button>
            {showAlerts && (
              <div className="card" style={{position:'absolute', top:64, right:32, width:260, padding:14, zIndex:45, background:'#fff'}}>
                <div className="widget-title" style={{marginBottom:8}}>알림</div>
                <div className="mini-widget-row"><span>동시 접속 임계값 근접</span><span className="badge accent">경고</span></div>
                <div className="mini-widget-row"><span>신규 참여자 342명 유입</span><span className="badge mute">정보</span></div>
              </div>
            )}
          </div>
        </div>
        <div className="live-banner">
          <span className="live-banner-dot"></span>이벤트 진행중 · 8월 24일 최종 오픈까지 카운트다운
          <span className="muted">실시간 참여자 데이터가 아래 대시보드에 반영됩니다</span>
        </div>
        {view === 'main' && <MainDashboard onGo={setView} />}
        {view === 'content' && <ContentScreen />}
        {view === 'monitoring' && <MonitoringScreen />}
        {view === 'campaign' && <CampaignScreen />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
