<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루아 매니지먼트 — 인터렉티브 쇼케이스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#100904; --surface:#382416; --surface2:#241407; --border:#40372e;
    --text:#ffedd7; --text-secondary:#b8a58f; --muted:#6c5f51; --accent:#dc5000;
    --radius-card:12px; --radius-pill:36px; --radius-outline:22.5px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--accent);color:#fff;}

  @keyframes heroKen{ 0%{transform:scale(1.02);} 100%{transform:scale(1.12);} }
  @keyframes fadeInUp{ from{opacity:0;transform:translateY(28px);} to{opacity:1;transform:translateY(0);} }
  @keyframes modalPop{ 0%{opacity:0;transform:scale(.92);} 100%{opacity:1;transform:scale(1);} }
  @keyframes toastSlide{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes scrollDot{ 0%,100%{transform:translateY(0);opacity:.4;} 50%{transform:translateY(8px);opacity:1;} }

  .fade-section{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.19,1,.22,1), transform .8s cubic-bezier(.19,1,.22,1);}
  .fade-section.in{opacity:1;transform:translateY(0);}

  .navlink{position:relative;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text);padding:6px 0;background:none;border:none;}
  .navlink.active::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;border-bottom:1px dashed var(--text);}

  .pill-btn{border-radius:var(--radius-pill);padding:14px 28px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:none;background:var(--surface);color:var(--text);transition:transform .3s cubic-bezier(.19,1,.22,1), background .3s;}
  .pill-btn:hover{transform:translateY(-2px);background:#4a2f1c;}
  .outline-btn{border-radius:var(--radius-outline);padding:11px 24px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--text);background:transparent;color:var(--text);transition:background .3s, color .3s;}
  .outline-btn:hover{background:var(--text);color:var(--bg);}

  .card-surface{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-card);}

  .thumb{position:relative;overflow:hidden;border-radius:var(--radius-card);cursor:pointer;background:var(--surface);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.19,1,.22,1), filter .6s;}
  .thumb:hover img{transform:scale(1.08);filter:invert(1) contrast(1.05);}
  .thumb .tag{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(16,9,4,.7);padding:5px 10px;border-radius:var(--radius-outline);border:1px solid var(--border);}

  .chip{border-radius:var(--radius-pill);padding:9px 20px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--text-secondary);transition:all .25s;}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .toggle{width:42px;height:24px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);position:relative;transition:background .25s;flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .25s cubic-bezier(.19,1,.22,1);}
  .toggle.on .knob{transform:translateX(18px);}

  .icon-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .2s;}
  .icon-btn:hover{color:var(--text);border-color:var(--text-secondary);}

  input,select,textarea{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;padding:8px 2px;outline:none;transition:border-color .2s;}
  input:focus,select:focus,textarea:focus{border-bottom-color:var(--text);}

  .toolbar-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
  .toolbar-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .dropzone{border:1px dashed var(--border);border-radius:var(--radius-card);padding:36px 20px;text-align:center;transition:border-color .2s, background .2s;}
  .dropzone.drag{border-color:var(--accent);background:rgba(220,80,0,.06);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface);border-radius:4px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const CATEGORIES = ['전체','화보','광고','영상','캠페인'];
const PORTFOLIO_ITEMS = [
  { id:1, title:'AURORA S/S 2025', model:'서은채', category:'화보', video:false, desc:'파스텔 톤 스튜디오 촬영, 자연광 활용 룩북 화보 시리즈' },
  { id:2, title:'노드 캠페인 필름', model:'이도현', category:'영상', video:true, desc:'브랜드 런칭 캠페인용 60초 필름, 야간 도심 로케이션' },
  { id:3, title:'모노크롬 에디토리얼', model:'김하린', category:'화보', video:false, desc:'흑백 필름 질감의 아카이브 컨셉 화보' },
  { id:4, title:'스트리트 옥외광고', model:'박시우', category:'광고', video:false, desc:'전국 옥외광고 집행용 스틸컷, 3개 시안' },
  { id:5, title:'윈터 캡슐 컬렉션', model:'최유나', category:'캠페인', video:false, desc:'겨울 캡슐 컬렉션 룩북 및 SNS 캠페인 비주얼' },
  { id:6, title:'런웨이 백스테이지', model:'정태오', category:'영상', video:true, desc:'시즌 쇼 백스테이지 다큐멘터리 클립' },
  { id:7, title:'뷰티 클로즈업 시리즈', model:'한소율', category:'화보', video:false, desc:'매크로 렌즈 뷰티 클로즈업, 텍스처 강조 화보' },
  { id:8, title:'프래그런스 광고', model:'유지안', category:'광고', video:false, desc:'향수 브랜드 프린트 광고 캠페인' },
  { id:9, title:'스프링 캠페인 필름', model:'서은채', category:'영상', video:true, desc:'봄 신상 컬렉션 15초 숏폼 필름' },
];
const COMPARE_CATS = [
  { cat:'화보', icon:'image', desc:'매거진·룩북용 정지 화보 촬영' },
  { cat:'광고', icon:'megaphone', desc:'옥외·디지털 광고 소재 제작' },
  { cat:'영상', icon:'film', desc:'브랜드 필름 및 캠페인 영상' },
  { cat:'캠페인', icon:'sparkles', desc:'시즌 통합 캠페인 비주얼 패키지' },

const INITIAL_CONTENT = [
  { id:101, title:'AURORA S/S 2025 화보 공개', type:'포트폴리오', exposed:true, updated:'2025.03.02' },
  { id:102, title:'노드 캠페인 필름 비하인드', type:'기사', exposed:true, updated:'2025.02.27' },
  { id:103, title:'2025 상반기 소속 모델 라인업', type:'기사', exposed:false, updated:'2025.02.20' },
  { id:104, title:'윈터 캡슐 컬렉션 룩북', type:'포트폴리오', exposed:true, updated:'2025.02.11' },
  { id:105, title:'런웨이 백스테이지 다큐', type:'포트폴리오', exposed:false, updated:'2025.01.30' },
  { id:106, title:'뷰티 클로즈업 시리즈 아카이브', type:'기사', exposed:true, updated:'2025.01.18' },

function useIcons(deps){
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
}

function Toast({ toasts }){
  return (
    <div style={{position:'fixed',bottom:24,right:24,zIndex:200,display:'flex',flexDirection:'column',gap:10}}>
      {toasts.map(t => (
        <div key={t.id} style={{animation:'toastSlide .35s cubic-bezier(.19,1,.22,1)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius-card)',padding:'14px 18px',display:'flex',alignItems:'center',gap:10,minWidth:240,boxShadow:'0 12px 32px rgba(0,0,0,.4)'}}>
          <i data-lucide={t.type==='warn'?'alert-triangle':'check'} style={{width:16,height:16,color:t.type==='warn'?'#ffb74d':'var(--accent)'}}></i>
          <span style={{fontSize:13}}>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function FadeSection({ children, style }){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setInView(true); });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} className={'fade-section' + (inView ? ' in' : '')} style={style}>{children}</div>;
}

function NavBar({ view, setView, scrolled }){
  // 퍼블릭/CMS 화면 전환과 무관하게 항상 마운트되는 단일 헤더.
  // (조건부 언마운트 시 순차 캡처에서 다음 clickTarget이 DOM에 없어 화면전환 실패로 오판됨)
  const isHome = view === 'home';
  const solid = scrolled || !isHome;
  return (
    <header style={{position:'fixed',top:0,left:0,right:0,zIndex:100,height:72,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',background: solid ? 'rgba(16,9,4,.94)' : 'transparent',borderBottom: solid ? '1px solid var(--border)' : '1px solid transparent',transition:'background .3s, border-color .3s',backdropFilter: solid ? 'blur(8px)' : 'none'}}>
      <span style={{fontSize:15,fontWeight:600,letterSpacing:'.1em',textTransform:'uppercase'}}>LUA MGMT</span>
      <nav style={{display:'flex',alignItems:'center',gap:24}}>
        <button className={'navlink' + (view==='home'?' active':'')} onClick={() => setView('home')}>홈</button>
        <button className={'navlink' + (view==='portfolio'?' active':'')} onClick={() => setView('portfolio')}>포트폴리오</button>
        <span style={{width:1,height:14,background:'var(--border)'}}></span>
        <button className={'navlink' + (view==='admin-content'?' active':'')} onClick={() => setView('admin-content')}>콘텐츠 관리</button>
        <button className={'navlink' + (view==='admin-editor'?' active':'')} onClick={() => setView('admin-editor')}>콘텐츠 에디터</button>
        <img src="https://source.boringavatars.com/beam/28/lua-admin?colors=100904,382416,dc5000,ffedd7" style={{borderRadius:'50%',border:'1px solid var(--border)'}} alt="관리자" />
      </nav>
    </header>
  );
}

function Home({ setView, setFilterCat, openContact }){
  const [scrollY, setScrollY] = useState(0);

    let raf = null;
    const onScroll = () => {

    return () => window.removeEventListener('scroll', onScroll);

  const heroTranslate = scrollY * 0.18;

  return (
    <div>
      <section style={{position:'relative',height:'100vh',width:'100%',overflow:'hidden'}}>
        <video autoPlay muted loop playsInline poster="https://picsum.photos/seed/model-agency-hero/1600/900"
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:'brightness(.4) sepia(.35) hue-rotate(-8deg) saturate(1.3)',animation:'heroKen 18s ease-in-out infinite alternate'}}>

        </video>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg, rgba(16,9,4,.55) 0%, rgba(16,9,4,.35) 45%, rgba(16,9,4,.9) 100%)'}}></div>
        <div style={{position:'absolute',left:32,right:32,bottom:88,opacity:heroOpacity,transform:`translateY(${-heroTranslate}px)`}}>

          <h1 style={{fontSize:58,lineHeight:.95,fontWeight:600,letterSpacing:'-.01em',textTransform:'uppercase',margin:'0 0 20px',maxWidth:760}}>형태와 빛 사이,<br/>새로운 얼굴을 찾다</h1>
          <div style={{display:'flex',gap:14}}>
            <button className="pill-btn" title="메인 히어로 인터렉티브 연출" onClick={() => setView('portfolio')}>포트폴리오 보기</button>
            <button className="outline-btn" onClick={openContact}>협업 문의</button>
          </div>
        </div>
        <div style={{position:'absolute',right:28,bottom:32,fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',writingMode:'vertical-rl',color:'var(--text-secondary)'}}>LUA · 2025 EDITORIAL</div>
        <div style={{position:'absolute',left:'50%',bottom:24,transform:'translateX(-50%)',display:'flex',flexDirection:'column',alignItems:'center',gap:6,opacity:heroOpacity}}>
          <span style={{fontSize:9,letterSpacing:'.2em',textTransform:'uppercase',color:'var(--text-secondary)'}}>SCROLL</span>
          <div style={{width:1,height:24,background:'var(--border)',position:'relative'}}>
            <div style={{position:'absolute',top:0,left:-2,width:5,height:5,borderRadius:'50%',background:'var(--accent)',animation:'scrollDot 1.8s ease-in-out infinite'}}></div>
          </div>
        </div>
      </section>

      <section style={{padding:'96px 32px',maxWidth:1280,margin:'0 auto'}}>
        {[
          { title:'AURORA S/S 2025', copy:'파스텔 스튜디오 라이팅과 자연광을 교차한 시즌 화보. 소속 모델의 표정 연출력을 중심에 둔 시리즈입니다.', seed:'lua-spec-1', reverse:false },
          { title:'노드 캠페인 필름', copy:'야간 도심을 배경으로 한 브랜드 런칭 필름. 컬러그레이딩과 편집 리듬으로 몰입감을 설계합니다.', seed:'lua-spec-2', reverse:true },
        ].map((s, i) => (
          <FadeSection key={i} style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:48,flexDirection: s.reverse ? 'row-reverse' : 'row',marginBottom:80}}>
            <div className="thumb" style={{flex:'1 1 420px',height:340}} onClick={() => setView('portfolio')}>
              <img src={`https://picsum.photos/seed/${s.seed}/800/640`} alt={s.title} />
            </div>
            <div style={{flex:'1 1 320px'}}>
              <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--accent)',marginBottom:12}}>FEATURED EDITORIAL</div>

            {COMPARE_CATS.map(c => (
              <div key={c.cat} className="card-surface" style={{padding:24,transition:'transform .3s cubic-bezier(.19,1,.22,1), border-color .3s'}}

        </div>
      </FadeSection>

      <FadeSection style={{padding:'110px 32px 60px',textAlign:'center'}}>
        <h2 style={{fontSize:44,fontWeight:600,textTransform:'uppercase',lineHeight:1.15,margin:'0 0 28px'}}>다음 캠페인,<br/>루아와 함께</h2>
        <button className="pill-btn" onClick={openContact}>협업 문의하기</button>
      </FadeSection>

      <footer style={{padding:'48px 32px',borderTop:'1px solid var(--border)'}}>
        <div style={{maxWidth:1280,margin:'0 auto',display:'flex',flexWrap:'wrap',justifyContent:'space-between',gap:32}}>
          <div>
            <div style={{fontSize:14,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:10}}>LUA MGMT</div>

}

function Portfolio({ filterCat, setFilterCat, openModal }){
  const filtered = filterCat === '전체' ? PORTFOLIO_ITEMS : PORTFOLIO_ITEMS.filter(i => i.category === filterCat);
  return (
    <div style={{paddingTop:120,paddingBottom:80,paddingLeft:32,paddingRight:32,maxWidth:1320,margin:'0 auto'}}>
      <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--accent)',marginBottom:10}}>WORK ARCHIVE</div>
      <h1 style={{fontSize:42,fontWeight:600,textTransform:'uppercase',margin:'0 0 32px'}}>포트폴리오</h1>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:36}}>
        {CATEGORIES.map(c => (
          <button key={c} className={'chip' + (filterCat===c?' active':'')} onClick={() => setFilterCat(c)}>{c}</button>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px,1fr))',gap:20}}>
        {filtered.map(item => (
          <div key={item.id} className="thumb" style={{aspectRatio:'4/5'}} onClick={() => openModal(item)}>
            <img src={`https://picsum.photos/seed/lua-portfolio-${item.id}/500/620`} alt={item.title} />
            <span className="tag">{item.category}</span>
            {item.video && <div style={{position:'absolute',top:12,right:12,width:30,height:30,borderRadius:'50%',background:'rgba(16,9,4,.7)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center'}}><i data-lucide="play" style={{width:12,height:12}}></i></div>}
            <div style={{position:'absolute',left:0,right:0,bottom:0,padding:'40px 16px 14px',background:'linear-gradient(0deg, rgba(16,9,4,.9), transparent)'}}>
              <div style={{fontSize:14,fontWeight:600}}>{item.title}</div>
              <div style={{fontSize:11,color:'var(--text-secondary)'}}>{item.model}</div>
            </div>
          </div>
        ))}
      </div>
      {filtered.length === 0 && <p style={{color:'var(--text-secondary)',padding:'60px 0',textAlign:'center'}}>해당 카테고리의 화보가 없습니다.</p>}
    </div>
  );
}

function DetailModal({ item, onClose }){
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!item) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(16,9,4,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div className="card-surface" style={{maxWidth:840,width:'100%',maxHeight:'88vh',overflow:'auto',animation:'modalPop .3s cubic-bezier(.19,1,.22,1)'}} onClick={e => e.stopPropagation()}>
        <div style={{position:'relative'}}>
          <img src={`https://picsum.photos/seed/lua-portfolio-${item.id}/900/560`} style={{width:'100%',display:'block',borderRadius:'12px 12px 0 0'}} alt={item.title} />
          <button className="icon-btn" style={{position:'absolute',top:14,right:14,background:'rgba(16,9,4,.7)'}} onClick={onClose}><i data-lucide="x" style={{width:16,height:16}}></i></button>
          {item.video && <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{width:64,height:64,borderRadius:'50%',background:'rgba(16,9,4,.6)',border:'1px solid var(--text)',display:'flex',alignItems:'center',justifyContent:'center'}}><i data-lucide="play" style={{width:22,height:22}}></i></div></div>}
        </div>
        <div style={{padding:32}}>
          <span className="chip active" style={{fontSize:10}}>{item.category}</span>
          <h2 style={{fontSize:26,fontWeight:600,textTransform:'uppercase',margin:'16px 0 6px'}}>{item.title}</h2>
          <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:18}}>모델 · {item.model}</div>
          <p style={{fontSize:15,lineHeight:1.8,color:'var(--text-secondary)'}}>{item.desc}</p>
        </div>
      </div>
    </div>
  );
}

function ContactModal({ open, onClose, onSubmit }){
  if (!open) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(16,9,4,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div className="card-surface" style={{maxWidth:440,width:'100%',padding:32,animation:'modalPop .3s cubic-bezier(.19,1,.22,1)'}} onClick={e => e.stopPropagation()}>
        <h3 style={{fontSize:20,fontWeight:600,textTransform:'uppercase',margin:'0 0 20px'}}>협업 문의</h3>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <input placeholder="담당자명" />
          <input placeholder="이메일" />
          <textarea placeholder="문의 내용" rows="3" style={{resize:'none'}}></textarea>
        </div>
        <div style={{display:'flex',gap:10,marginTop:24}}>
          <button className="pill-btn" style={{flex:1}} onClick={() => { onSubmit(); onClose(); }}>보내기</button>
          <button className="outline-btn" onClick={onClose}>취소</button>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ target, onCancel, onConfirm }){
  if (!target) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(16,9,4,.85)',display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onCancel}>
      <div className="card-surface" style={{maxWidth:360,width:'90%',padding:28,animation:'modalPop .3s cubic-bezier(.19,1,.22,1)'}} onClick={e => e.stopPropagation()}>
        <i data-lucide="alert-triangle" style={{width:24,height:24,color:'var(--accent)',marginBottom:14}}></i>
        <h4 style={{margin:'0 0 8px',fontSize:16}}>콘텐츠를 삭제할까요?</h4>
        <p style={{fontSize:13,color:'var(--text-secondary)',margin:'0 0 22px'}}>'{target.title}' 항목이 영구 삭제됩니다.</p>
        <div style={{display:'flex',gap:10}}>
          <button className="pill-btn" style={{flex:1,background:'#5c2418'}} onClick={onConfirm}>삭제</button>
          <button className="outline-btn" onClick={onCancel}>취소</button>
        </div>
      </div>
    </div>
  );
}

function EditModal({ item, onCancel, onSave }){
  const [draft, setDraft] = useState(item);
  useEffect(() => setDraft(item), [item]);
  if (!item) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(16,9,4,.85)',display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onCancel}>
      <div className="card-surface" style={{maxWidth:420,width:'90%',padding:28,animation:'modalPop .3s cubic-bezier(.19,1,.22,1)'}} onClick={e => e.stopPropagation()}>
        <h4 style={{margin:'0 0 20px',fontSize:16}}>콘텐츠 수정</h4>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={{fontSize:11,color:'var(--text-secondary)',display:'block',marginBottom:4}}>제목</label>
            <input style={{width:'100%'}} value={draft.title} onChange={e => setDraft({...draft, title:e.target.value})} />
          </div>
          <div>
            <label style={{fontSize:11,color:'var(--text-secondary)',display:'block',marginBottom:4}}>유형</label>
            <select style={{width:'100%'}} value={draft.type} onChange={e => setDraft({...draft, type:e.target.value})}>
              <option>기사</option><option>포트폴리오</option>
            </select>
          </div>
        </div>
        <div style={{display:'flex',gap:10,marginTop:24}}>
          <button className="pill-btn" style={{flex:1}} onClick={() => onSave(draft)}>저장</button>
          <button className="outline-btn" onClick={onCancel}>취소</button>
        </div>
      </div>
    </div>
  );
}

function AdminContent({ list, setList, addToast, goEditor }){
  const [query, setQuery] = useState('');
  const [confirmTarget, setConfirmTarget] = useState(null);
  const [editTarget, setEditTarget] = useState(null);
  const filtered = list.filter(i => i.title.includes(query));

  const toggleExposed = (id) => {
    setList(list.map(i => i.id === id ? {...i, exposed: !i.exposed} : i));
    addToast('노출 상태가 변경되었습니다.');
  };
  const doDelete = () => {
    setList(list.filter(i => i.id !== confirmTarget.id));
    addToast('콘텐츠가 삭제되었습니다.');
    setConfirmTarget(null);
  };
  const doSave = (draft) => {
    setList(list.map(i => i.id === draft.id ? draft : i));
    addToast('콘텐츠가 저장되었습니다.');
    setEditTarget(null);
  };

  return (
    <div style={{padding:'112px 32px 60px',maxWidth:1200,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:14}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:600}}>콘텐츠 관리</h2>
          <p style={{margin:'6px 0 0',fontSize:13,color:'var(--text-secondary)'}}>등록된 기사·포트폴리오의 노출 상태와 내용을 관리합니다.</p>
        </div>
        <div style={{display:'flex',gap:10}}>
          <input placeholder="제목 검색" value={query} onChange={e => setQuery(e.target.value)} />
          <button className="pill-btn" onClick={goEditor}><i data-lucide="plus" style={{width:14,height:14,verticalAlign:'-2px',marginRight:6}}></i>새 콘텐츠 작성</button>
        </div>
      </div>
      <div className="card-surface" style={{overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 100px 110px 120px 90px',padding:'14px 20px',fontSize:11,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.06em',borderBottom:'1px solid var(--border)'}}>
          <div>제목</div><div>유형</div><div>노출</div><div>최종 수정</div><div>작업</div>
        </div>
        {filtered.map(item => (
          <div key={item.id} style={{display:'grid',gridTemplateColumns:'1fr 100px 110px 120px 90px',padding:'16px 20px',alignItems:'center',borderBottom:'1px solid var(--border)',fontSize:13}}>
            <div>{item.title}</div>
            <div style={{color:'var(--text-secondary)'}}>{item.type}</div>
            <div><button className={'toggle' + (item.exposed?' on':'')} onClick={() => toggleExposed(item.id)}><span className="knob"></span></button></div>
            <div style={{color:'var(--text-secondary)'}}>{item.updated}</div>
            <div style={{display:'flex',gap:8}}>
              <button className="icon-btn" onClick={() => setEditTarget(item)}><i data-lucide="pencil" style={{width:14,height:14}}></i></button>
              <button className="icon-btn" onClick={() => setConfirmTarget(item)}><i data-lucide="trash-2" style={{width:14,height:14}}></i></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <div style={{padding:40,textAlign:'center',color:'var(--text-secondary)',fontSize:13}}>검색 결과가 없습니다.</div>}
      </div>
      <ConfirmModal target={confirmTarget} onCancel={() => setConfirmTarget(null)} onConfirm={doDelete} />
      <EditModal item={editTarget} onCancel={() => setEditTarget(null)} onSave={doSave} />
    </div>
  );
}

function AdminEditor({ addContent, addToast }){
  const [title, setTitle] = useState('');
  const [type, setType] = useState('기사');
  const [activeFmts, setActiveFmts] = useState({});
  const [dragging, setDragging] = useState(false);
  const [progress, setProgress] = useState(0);
  const [uploading, setUploading] = useState(false);
  const bodyRef = useRef(null);

  const toggleFmt = (cmd) => {
    document.execCommand(cmd);
    setActiveFmts(f => ({...f, [cmd]: !f[cmd]}));
  };

  const handleFile = (file) => {
    if (!file) return;
    const limitMB = type === '홈 배경영상' ? 50 : 10;
    if (file.size / (1024*1024) > limitMB) {
      addToast(`업로드 용량 제한(${limitMB}MB)을 초과했습니다.`, 'warn');
      return;
    }
    setUploading(true);
    setProgress(0);
    const timer = setInterval(() => {
      setProgress(p => {
        if (p >= 100) { clearInterval(timer); setUploading(false); addToast('업로드가 완료되었습니다.'); return 100; }
        return p + 14;
      });
    }, 160);
  };

  const publish = () => {
    if (!title.trim()) { addToast('제목을 입력해주세요.', 'warn'); return; }
    addContent({ id: Date.now(), title, type: type === '홈 배경영상' ? '기사' : type, exposed: true, updated: '방금 전' });
    addToast('콘텐츠가 발행되었습니다.');
    setTitle('');
    if (bodyRef.current) bodyRef.current.innerHTML = '';
  };
  const saveDraft = () => addToast('임시저장되었습니다.');

  return (
    <div style={{padding:'112px 32px 60px',maxWidth:1200,margin:'0 auto',display:'flex',gap:28,flexWrap:'wrap'}}>
      <div style={{flex:'2 1 480px',minWidth:320}}>
        <input placeholder="제목을 입력하세요" value={title} onChange={e => setTitle(e.target.value)} style={{fontSize:22,fontWeight:600,width:'100%',marginBottom:20,paddingBottom:14}} />
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          {[['bold','bold'],['italic','italic'],['underline','underline'],['createLink','link']].map(([cmd, ic]) => (
            <button key={cmd} className={'toolbar-btn' + (activeFmts[cmd]?' active':'')} onClick={() => toggleFmt(cmd)}><i data-lucide={ic} style={{width:15,height:15}}></i></button>
          ))}
        </div>
        <div ref={bodyRef} contentEditable suppressContentEditableWarning className="card-surface" style={{minHeight:260,padding:22,fontSize:14,lineHeight:1.8,outline:'none'}}
          data-placeholder="본문을 입력하세요...">화보 촬영 컨셉과 뒷이야기를 자유롭게 작성하세요.</div>
      </div>
      <div style={{flex:'1 1 260px',minWidth:240}}>
        <div className="card-surface" style={{padding:22,marginBottom:18}}>
          <label style={{fontSize:11,color:'var(--text-secondary)',display:'block',marginBottom:6}}>콘텐츠 유형</label>
          <select style={{width:'100%',marginBottom:18}} value={type} onChange={e => setType(e.target.value)}>
            <option>기사</option><option>포트폴리오</option><option>홈 배경영상</option>
          </select>
          <label style={{fontSize:11,color:'var(--text-secondary)',display:'block',marginBottom:10}}>{type === '홈 배경영상' ? '배경 영상 업로드' : '대표 이미지 업로드'}</label>
          <div className={'dropzone' + (dragging?' drag':'')}
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={e => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
            onClick={() => document.getElementById('lua-file-input').click()}>
            <i data-lucide={type==='홈 배경영상' ? 'film' : 'image-plus'} style={{width:22,height:22,color:'var(--text-secondary)',marginBottom:10}}></i>
            <div style={{fontSize:12,color:'var(--text-secondary)'}}>파일을 드래그하거나 클릭하여 업로드</div>
            <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>최대 {type==='홈 배경영상'?'50MB':'10MB'}</div>
            <input id="lua-file-input" type="file" accept={type==='홈 배경영상' ? 'video/*' : 'image/*'} style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />
          </div>
          {uploading && (
            <div style={{marginTop:14,height:6,background:'var(--surface2)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${progress}%`,background:'var(--accent)',transition:'width .16s linear'}}></div>
            </div>
          )}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="pill-btn" style={{flex:1}} onClick={publish}>발행</button>
          <button className="outline-btn" onClick={saveDraft}>임시저장</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('home');
  const [filterCat, setFilterCat] = useState('전체');
  const [modalItem, setModalItem] = useState(null);
  const [contactOpen, setContactOpen] = useState(false);
  const [contentList, setContentList] = useState(INITIAL_CONTENT);
  const [toasts, setToasts] = useState([]);
  const [scrolled, setScrolled] = useState(false);

  useIcons([view, modalItem, contactOpen, contentList]);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const addToast = (msg, type = 'ok') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  };
  const addContent = (item) => setContentList(l => [item, ...l]);

  return (
    <div style={{width:'100%',minHeight:'100vh'}}>
      <NavBar view={view} setView={setView} scrolled={scrolled} />
      {view === 'home' && <Home setView={setView} setFilterCat={setFilterCat} openContact={() => setContactOpen(true)} />}
      {view === 'portfolio' && <Portfolio filterCat={filterCat} setFilterCat={setFilterCat} openModal={setModalItem} />}
      {view === 'admin-content' && <AdminContent list={contentList} setList={setContentList} addToast={addToast} goEditor={() => setView('admin-editor')} />}
      {view === 'admin-editor' && <AdminEditor addContent={addContent} addToast={addToast} />}
      <DetailModal item={modalItem} onClose={() => setModalItem(null)} />
      <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} onSubmit={() => addToast('문의가 접수되었습니다.')} />
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
