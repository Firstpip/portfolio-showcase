<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGE OS — 콘텐츠 오퍼레이션 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#000000; --inkstone:#181818; --felt:#6d6d6d; --ash:#9a9a9a;
    --border:#000000; --accent:#a02d25;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  @keyframes fadeUp{ from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
  @keyframes glide{ from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:translateX(0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes toastIn{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  @keyframes heroFlow{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

  .pill{border-radius:75px;padding:10px 26px;font-size:13px;font-weight:400;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background .8s cubic-bezier(.19,1,.22,1), color .8s cubic-bezier(.19,1,.22,1);}
  .pill:hover{background:var(--ink);color:#fff;}
  .pill.filled{background:var(--ink);color:#fff;}
  .pill.filled:hover{background:#333;}
  .pill.danger{border-color:var(--accent);color:var(--accent);}
  .pill.danger:hover{background:var(--accent);color:#fff;}

  .row-item{border-bottom:1px solid var(--border);padding:16px 0;transition:padding-left .5s cubic-bezier(.19,1,.22,1);}
  .row-item:hover{padding-left:8px;}

  .tab{font-size:13px;padding:16px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--felt);}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}

  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--felt);display:block;margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;border:1px solid var(--border);border-radius:0;padding:9px 10px;font-size:13px;outline:none;background:#fff;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}

  .icon-sq{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--ink);background:#fff;transition:background .2s,color .2s;}
  .icon-sq:hover{background:var(--ink);color:#fff;}

  .status-badge{font-size:11px;padding:4px 10px;border-radius:75px;border:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
  .status-초안{color:var(--felt);border-color:var(--ash);}
  .status-검토{color:#8a6d00;border-color:#8a6d00;}
  .status-승인{color:#1a6b3a;border-color:#1a6b3a;}
  .status-발행{color:#fff;background:var(--ink);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--ash);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TREE = [
  { group:'기사', items:[
    { id:1, title:'2025 상반기 소속 모델 라인업', status:'검토' },
    { id:2, title:'노드 캠페인 필름 비하인드', status:'발행' },
    { id:3, title:'뷰티 클로즈업 시리즈 아카이브', status:'초안' },
  ]},
  { group:'포트폴리오', items:[
    { id:4, title:'AURORA S/S 2025 화보', status:'발행' },
    { id:5, title:'윈터 캡슐 컬렉션 룩북', status:'승인' },
    { id:6, title:'런웨이 백스테이지 다큐', status:'초안' },
  ]},
];

const WORKFLOW_ITEMS = [
  { id:1, title:'2025 상반기 소속 모델 라인업', author:'김에디터', status:'검토', history:['초안 작성 · 02.18','검토 요청 · 02.20'] },
  { id:2, title:'윈터 캡슐 컬렉션 룩북', author:'박에디터', status:'승인', history:['초안 작성 · 02.05','검토 완료 · 02.09','승인 · 02.11'] },
  { id:3, title:'뷰티 클로즈업 시리즈 아카이브', author:'이에디터', status:'초안', history:['초안 작성 · 02.22'] },
  { id:4, title:'스프링 캠페인 필름 티저', author:'김에디터', status:'검토', history:['초안 작성 · 02.24','검토 요청 · 02.25'] },
];

const SCHEDULE_ITEMS = [
  { id:1, title:'AURORA S/S 2025 화보', start:'2025-03-02', end:'2025-04-30', views:[420,510,380,610,720,890,940] },
  { id:2, title:'노드 캠페인 필름', start:'2025-02-27', end:'2025-03-27', views:[210,340,290,410,530,470,600] },
  { id:3, title:'윈터 캡슐 컬렉션', start:'2025-02-11', end:'2025-03-11', views:[890,760,650,540,430,380,300] },
];

function useIcons(){}

function Toast({ toasts }){
  return (
    <div style={{position:'fixed',bottom:24,right:24,zIndex:200,display:'flex',flexDirection:'column',gap:10}}>
      {toasts.map(t => (
        <div key={t.id} style={{animation:'toastIn .3s cubic-bezier(.19,1,.22,1)',background:'#fff',border:'1px solid var(--ink)',padding:'12px 18px',display:'flex',alignItems:'center',gap:10,minWidth:240}}>
          <i className={t.type==='warn' ? 'ti ti-alert-triangle' : 'ti ti-check'} style={{color:t.type==='warn' ? 'var(--accent)' : 'var(--ink)'}}></i>
          <span style={{fontSize:13}}>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function Sidebar({ view, setView }){
  const items = [
    { id:'main', label:'편집 캔버스', icon:'ti-layout-board' },
    { id:'workflow', label:'발행 승인', icon:'ti-checklist' },
    { id:'analytics', label:'노출 스케줄링', icon:'ti-calendar-time' },
    { id:'preview', label:'라이브 미리보기', icon:'ti-eye' },
  ];
  return (
    <aside style={{position:'fixed',left:0,top:0,bottom:0,width:240,borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',padding:'24px 0'}}>
      <div style={{padding:'0 24px 28px'}}>
        <div style={{fontSize:16,fontWeight:600,letterSpacing:'-.01em'}}>STAGE OS</div>
        <div style={{fontSize:11,color:'var(--felt)',marginTop:2}}>Content Operations</div>
      </div>
      <nav style={{display:'flex',flexDirection:'column',gap:2,padding:'0 12px'}}>
        {items.map(it => (
          <button key={it.id} onClick={() => setView(it.id)} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 12px',background: view===it.id ? 'var(--ink)' : 'transparent',color: view===it.id ? '#fff' : 'var(--ink)',border:'none',fontSize:13,textAlign:'left'}}>
            <i className={'ti ' + it.icon}></i>{it.label}
          </button>
        ))}
      </nav>
      <div style={{marginTop:'auto',padding:'0 24px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,paddingTop:18,borderTop:'1px solid var(--border)'}}>
          <img src="https://source.boringavatars.com/marble/28/stage-admin?colors=000000,636363,9a9a9a,a02d25" alt="관리자" />
          <div>
            <div style={{fontSize:12,fontWeight:600}}>운영 관리자</div>
            <div style={{fontSize:10,color:'var(--felt)'}}>admin@stageos.demo</div>
          </div>
        </div>
      </div>
    </aside>
  );
}

function TopBar({ title, sub }){
  return (
    <div style={{padding:'28px 0',marginBottom:8}}>
      <h1 style={{margin:0,fontSize:28,fontWeight:400}}>{title}</h1>
      {sub && <p style={{margin:'6px 0 0',fontSize:13,color:'var(--felt)'}}>{sub}</p>}
    </div>
  );
}

function EditorCanvas({ addToast }){
  const [activeGroup, setActiveGroup] = useState('기사');
  const [activeItem, setActiveItem] = useState(TREE[0].items[0]);
  const [exposed, setExposed] = useState(true);
  const [schedule, setSchedule] = useState('2025-03-05');
  const [livePreview, setLivePreview] = useState(false);
  const bodyRef = useRef(null);

  const requestApproval = () => addToast(`'${activeItem.title}' 승인 요청이 전송되었습니다.`);
  const saveDraft = () => addToast('자동 저장되었습니다.');

  return (
    <div style={{display:'flex',gap:0,border:'1px solid var(--border)',minHeight:560}}>
      <div style={{width:220,borderRight:'1px solid var(--border)',padding:'18px 0',flexShrink:0}}>
        {TREE.map(g => (
          <div key={g.group}>
            <div style={{padding:'6px 18px',fontSize:11,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--felt)'}}>{g.group}</div>
            {g.items.map(it => (
              <button key={it.id} onClick={() => { setActiveItem(it); setActiveGroup(g.group); }} style={{display:'block',width:'100%',textAlign:'left',padding:'9px 18px',background: activeItem.id===it.id ? '#f4f4f4' : 'transparent',border:'none',fontSize:13,borderLeft: activeItem.id===it.id ? '2px solid var(--ink)' : '2px solid transparent'}}>
                {it.title}
                <div style={{marginTop:4}}><span className={'status-badge status-' + it.status}>{it.status}</span></div>
              </button>
            ))}
          </div>
        ))}
      </div>

      <div style={{flex:1,padding:28,minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
          <div>
            <div style={{fontSize:11,color:'var(--felt)',textTransform:'uppercase',letterSpacing:'.06em'}}>{activeGroup}</div>
            <h2 style={{margin:'4px 0 0',fontSize:22,fontWeight:400}}>{activeItem.title}</h2>
          </div>
          <button className="pill" onClick={() => setLivePreview(!livePreview)}><i className={'ti ' + (livePreview ? 'ti-code' : 'ti-device-desktop')} style={{marginRight:6}}></i>{livePreview ? '편집으로 전환' : '실시간 미리보기'}</button>
        </div>
        {!livePreview ? (
          <div ref={bodyRef} contentEditable suppressContentEditableWarning style={{minHeight:300,border:'1px solid var(--border)',padding:22,fontSize:15,lineHeight:1.8,outline:'none'}}>
            {activeItem.title}에 대한 본문을 편집합니다. 좌측 트리에서 다른 콘텐츠를 선택하면 이 캔버스가 즉시 갱신됩니다.
          </div>
        ) : (
          <div style={{border:'1px solid var(--border)',padding:0,minHeight:300,background:'#fafafa'}}>
            <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border)',fontSize:11,color:'var(--felt)',display:'flex',alignItems:'center',gap:8}}>
              <span style={{width:6,height:6,borderRadius:'50%',background: exposed ? '#1a6b3a' : 'var(--ash)',animation:'pulseDot 1.6s ease-in-out infinite'}}></span>
              stage-os.demo/preview/{activeItem.id} · {exposed ? 'PUBLISHED' : 'DRAFT'}
            </div>
            <div style={{padding:'60px 30px'}}>
              <h2 style={{fontSize:38,fontWeight:400,lineHeight:1.05,margin:0}}>{activeItem.title}</h2>
              <p style={{color:'var(--felt)',fontSize:14,marginTop:14,maxWidth:480}}>공개 사이트에 실제로 노출될 레이아웃과 타이포그래피를 그대로 재사용한 실시간 미리보기입니다.</p>
            </div>
          </div>
        )}
      </div>

      <div style={{width:260,borderLeft:'1px solid var(--border)',padding:22,flexShrink:0}}>
        <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--felt)',marginBottom:16}}>인스펙터</div>
        <div className="field" style={{marginBottom:18,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <label style={{margin:0}}>노출 여부</label>
          <button className={'pill' + (exposed ? ' filled' : '')} style={{padding:'6px 16px',fontSize:11}} onClick={() => { setExposed(!exposed); addToast(exposed ? '비노출로 전환했습니다.' : '노출로 전환했습니다.'); }}>{exposed ? 'ON' : 'OFF'}</button>
        </div>
        <div className="field" style={{marginBottom:18}}>
          <label>예약 발행일</label>
          <input type="date" value={schedule} onChange={e => setSchedule(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:24}}>
          <label>현재 상태</label>
          <span className={'status-badge status-' + activeItem.status}>{activeItem.status}</span>
        </div>
        <button className="pill filled" style={{width:'100%',marginBottom:10}} onClick={requestApproval}>승인 요청</button>
        <button className="pill" style={{width:'100%'}} onClick={saveDraft}>임시 저장</button>
      </div>
    </div>
  );
}

function ApproveModal({ target, onCancel, onConfirm }){
  const [comment, setComment] = useState('');
  if (!target) return null;
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:150}} onClick={onCancel}>
      <div style={{background:'#fff',border:'1px solid var(--ink)',padding:28,width:400,maxWidth:'90%',animation:'fadeUp .3s cubic-bezier(.19,1,.22,1)'}} onClick={e => e.stopPropagation()}>
        <h4 style={{margin:'0 0 6px',fontSize:16,fontWeight:600}}>{target.mode === 'approve' ? '승인 처리' : '반려 처리'}</h4>
        <p style={{fontSize:13,color:'var(--felt)',margin:'0 0 16px'}}>{target.item.title}</p>
        <div className="field">
          <label>코멘트</label>
          <textarea rows="3" value={comment} onChange={e => setComment(e.target.value)} placeholder={target.mode === 'approve' ? '승인 사유 (선택)' : '반려 사유를 입력하세요'}></textarea>
        </div>
        <div style={{display:'flex',gap:10,marginTop:20}}>
          <button className={'pill' + (target.mode==='approve' ? ' filled' : ' danger')} style={{flex:1}} onClick={() => onConfirm(comment)}>{target.mode === 'approve' ? '승인 확정' : '반려 확정'}</button>
          <button className="pill" onClick={onCancel}>취소</button>
        </div>
      </div>
    </div>
  );
}

function Workflow({ items, setItems, addToast }){
  const [modal, setModal] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const runAction = (comment) => {
    const { item, mode } = modal;
    const newStatus = mode === 'approve' ? '승인' : '초안';
    setItems(items.map(i => i.id === item.id ? { ...i, status: newStatus, history: [...i.history, `${mode==='approve'?'승인':'반려'} · 지금 ${comment ? '· ' + comment : ''}`] } : i));
    addToast(mode === 'approve' ? '콘텐츠를 승인했습니다.' : '콘텐츠를 반려했습니다.');
    setModal(null);
  };

  return (
    <div>
      <TopBar title="발행 승인 워크플로우" sub="초안 → 검토 → 승인 → 발행, 4단계 상태 전이를 관리합니다." />
      <div style={{border:'1px solid var(--border)'}}>
        {items.map(item => (
          <div key={item.id} className="row-item" style={{padding:'18px 20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={() => setExpanded(expanded===item.id ? null : item.id)}>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <i className={'ti ' + (expanded===item.id ? 'ti-chevron-down' : 'ti-chevron-right')}></i>
                <div>
                  <div style={{fontSize:14}}>{item.title}</div>
                  <div style={{fontSize:11,color:'var(--felt)',marginTop:2}}>{item.author}</div>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <span className={'status-badge status-' + item.status}>{item.status}</span>
                {item.status === '검토' && (
                  <React.Fragment>
                    <button className="pill filled" style={{padding:'6px 16px',fontSize:11}} onClick={(e) => { e.stopPropagation(); setModal({ item, mode:'approve' }); }}>승인</button>
                    <button className="pill danger" style={{padding:'6px 16px',fontSize:11}} onClick={(e) => { e.stopPropagation(); setModal({ item, mode:'reject' }); }}>반려</button>
                  </React.Fragment>
                )}
              </div>
            </div>
            {expanded === item.id && (
              <div style={{marginTop:14,paddingLeft:30,animation:'fadeUp .3s cubic-bezier(.19,1,.22,1)'}}>
                {item.history.map((h, i) => (
                  <div key={i} style={{fontSize:12,color:'var(--felt)',padding:'6px 0',borderLeft:'1px solid var(--ash)',paddingLeft:14,marginLeft:2}}>{h}</div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
      <ApproveModal target={modal} onCancel={() => setModal(null)} onConfirm={runAction} />
    </div>
  );
}

function AnalyticsChart({ items }){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['월','화','수','목','금','토','일'],
        datasets: items.map((it, i) => ({
          label: it.title,
          data: it.views,
          borderColor: i === 0 ? '#a02d25' : (i === 1 ? '#000000' : '#9a9a9a'),
          backgroundColor: 'transparent',
          tension: 0.35,
          borderWidth: 2,
          pointRadius: 3,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, grid: { color: '#eee' } }, x: { grid: { display: false } } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [items]);
  return <div style={{position:'relative',height:260}}><canvas ref={canvasRef}></canvas></div>;
}

function Analytics({ items, setItems, addToast }){
  const [editing, setEditing] = useState(null);
  const ranking = [...items].sort((a,b) => b.views.reduce((s,v)=>s+v,0) - a.views.reduce((s,v)=>s+v,0));

  const saveSchedule = (id, start, end) => {
    setItems(items.map(i => i.id === id ? { ...i, start, end } : i));
    addToast('노출 일정이 저장되었습니다.');
    setEditing(null);
  };

  return (
    <div>
      <TopBar title="노출 스케줄링" sub="콘텐츠별 노출 기간을 예약하고 기간별 조회 추이를 확인합니다." />
      <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:24,alignItems:'start'}}>
        <div style={{border:'1px solid var(--border)',padding:22}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>기간별 조회 추이</div>
          <AnalyticsChart items={items} />
        </div>
        <div style={{border:'1px solid var(--border)',padding:22}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>인기 콘텐츠 랭킹</div>
          {ranking.map((it, i) => (
            <div key={it.id} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom: i < ranking.length-1 ? '1px solid #eee' : 'none',fontSize:13}}>
              <span>{i+1}. {it.title}</span>
              <span style={{color:'var(--felt)'}}>{it.views.reduce((s,v)=>s+v,0).toLocaleString()}회</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{border:'1px solid var(--border)',marginTop:24}}>
        <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1fr 100px',padding:'12px 20px',fontSize:11,color:'var(--felt)',textTransform:'uppercase',borderBottom:'1px solid var(--border)'}}>
          <div>콘텐츠</div><div>노출 시작</div><div>노출 종료</div><div>작업</div>
        </div>
        {items.map(it => (
          <div key={it.id} className="row-item" style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1fr 100px',padding:'14px 20px',alignItems:'center',fontSize:13}}>
            <div>{it.title}</div>
            {editing === it.id ? (
              <React.Fragment>
                <input type="date" defaultValue={it.start} id={`start-${it.id}`} style={{border:'1px solid var(--border)',padding:'6px 8px',fontSize:12}} />
                <input type="date" defaultValue={it.end} id={`end-${it.id}`} style={{border:'1px solid var(--border)',padding:'6px 8px',fontSize:12}} />
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{color:'var(--felt)'}}>{it.start}</div>
                <div style={{color:'var(--felt)'}}>{it.end}</div>
              </React.Fragment>
            )}
            <div>
              {editing === it.id ? (
                <button className="icon-sq" onClick={() => saveSchedule(it.id, document.getElementById(`start-${it.id}`).value, document.getElementById(`end-${it.id}`).value)}><i className="ti ti-check"></i></button>
              ) : (
                <button className="icon-sq" onClick={() => setEditing(it.id)}><i className="ti ti-calendar-time"></i></button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PublicPreview({ setView, addToast }){
  const [draftMode, setDraftMode] = useState(false);
  return (
    <div>
      <TopBar title="공개 사이트 라이브 미리보기" sub="발행/초안 상태를 토글해 실제 공개 사이트와 동일한 화면을 확인합니다." />
      <div style={{display:'flex',gap:10,marginBottom:18}}>
        <button className={'tab' + (!draftMode ? ' active' : '')} onClick={() => setDraftMode(false)}>발행본 보기</button>
        <button className={'tab' + (draftMode ? ' active' : '')} onClick={() => setDraftMode(true)}>초안 보기</button>
      </div>
      <div style={{border:'1px solid var(--border)',overflow:'hidden'}}>
        <div style={{padding:'10px 18px',borderBottom:'1px solid var(--border)',fontSize:11,color:'var(--felt)',display:'flex',justifyContent:'space-between'}}>
          <span>stage-os.demo/{draftMode ? 'preview' : 'live'}</span>
          <span>{draftMode ? 'DRAFT · 비공개' : 'PUBLISHED · 공개'}</span>
        </div>
        <div style={{position:'relative',minHeight:420,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',
          background: draftMode ? '#f4f4f4' : 'linear-gradient(120deg, rgb(160,224,171), rgb(255,172,46) 50%, rgb(165,45,37))',
          backgroundSize: draftMode ? 'auto' : '200% 200%',
          animation: draftMode ? 'none' : 'heroFlow 10s ease-in-out infinite'}}>
          <div style={{textAlign:'center',padding:'0 24px'}}>
            <h2 style={{fontSize:86,fontWeight:400,lineHeight:.95,margin:0,color: draftMode ? 'var(--ink)' : '#fff'}}>{draftMode ? 'DRAFT PREVIEW' : 'United, Unbound'}</h2>
            <p style={{marginTop:18,fontSize:14,color: draftMode ? 'var(--felt)' : 'rgba(255,255,255,.85)'}}>{draftMode ? '승인 전 콘텐츠는 이 화면에서만 확인 가능합니다.' : '승인·발행된 콘텐츠가 실제 공개 사이트에 반영된 모습입니다.'}</p>
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:10,marginTop:20}}>
        <button className="pill filled" onClick={() => { setView('workflow'); addToast('발행 승인 화면으로 이동합니다.'); }}>승인 요청으로 이동</button>
        <button className="pill" onClick={() => addToast('공유 링크가 복사되었습니다.')}>미리보기 링크 복사</button>
      </div>
    </div>
  );
}

function HeroBand({ setView }){
  return (
    <div style={{margin:'0 -40px 40px',padding:'56px 40px',position:'relative',overflow:'hidden',
      background:'linear-gradient(120deg, rgb(160,224,171), rgb(255,172,46) 50%, rgb(165,45,37))',
      backgroundSize:'220% 220%',animation:'heroFlow 16s ease-in-out infinite'}}>
      <div style={{position:'relative',maxWidth:640,animation:'glide .7s cubic-bezier(.19,1,.22,1)'}}>
        <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(255,255,255,.9)',marginBottom:16}}>STAGE OS · CONTENT OPERATIONS</div>
        <h1 style={{fontSize:78,fontWeight:300,lineHeight:1.1,color:'#fff',margin:'0 0 20px'}}>콘텐츠가 흐르는<br/>방식을 다시 설계합니다</h1>
        <button className="pill" style={{background:'transparent',border:'1px solid rgba(255,255,255,.55)',color:'#fff'}} onClick={() => setView('workflow')}>이번 주 발행 현황 보기</button>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [workflowItems, setWorkflowItems] = useState(WORKFLOW_ITEMS);
  const [scheduleItems, setScheduleItems] = useState(SCHEDULE_ITEMS);
  const [toasts, setToasts] = useState([]);

  const addToast = (msg, type='ok') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  };

  return (
    <div style={{display:'flex',width:'100%',minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView} />
      <main style={{marginLeft:240,flex:1,minWidth:0,width:'calc(100% - 240px)',padding:'0 40px 60px'}}>
        <HeroBand setView={setView} />
        {view === 'main' && <div><TopBar title="콘텐츠 편집 캔버스" sub="트리에서 콘텐츠를 선택하고 중앙 캔버스에서 편집, 우측에서 발행 설정을 조정합니다." /><EditorCanvas addToast={addToast} /></div>}
        {view === 'workflow' && <Workflow items={workflowItems} setItems={setWorkflowItems} addToast={addToast} />}
        {view === 'analytics' && <Analytics items={scheduleItems} setItems={setScheduleItems} addToast={addToast} />}
        {view === 'preview' && <PublicPreview setView={setView} addToast={addToast} />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
