    .drawer { width: 260px; }
    .field-row-2 { grid-template-columns: 1fr; }
    .stat-row { flex-direction: column; }
  }
</style>

/* ---------------- Toast ---------------- */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = (msg, type = 'default') => {
    const id = 't' + Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  };
  return [toasts, push];
}
function ToastContainer({ toasts }) {
  return (
    <div className="toast-container">
      {toasts.map((t) => (
        <div key={t.id} className={'toast ' + t.type}>
          <Icon name={t.type === 'success' ? 'check-circle' : t.type === 'error' ? 'x-circle' : 'bell'} size={16} />
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function AdminTablePage({ notify }) {
  const [rows, setRows] = useState(TABLE_ROWS);

  const [statusFilter, setStatusFilter] = useState('전체');
  const [editCell, setEditCell] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [exporting, setExporting] = useState(false);

  const filtered = rows.filter((p) =>
    (typeFilter === '전체' || p.type === typeFilter) &&
    (statusFilter === '전체' || p.status === statusFilter) &&
    (q.trim() === '' || p.name.includes(q.trim()) || p.city.includes(q.trim()))
  );

  function startEdit(id, field, val) { setEditCell(id + ':' + field); setEditVal(val); }
  function commitEdit(id, field) {
    setRows((prev) => prev.map((p) => (p.id === id ? { ...p, [field]: editVal } : p)));
    setEditCell(null);
    notify('셀 값이 저장되었습니다', 'success');
  }

  function copyFilterUrl() {
    const params = 'type=' + encodeURIComponent(typeFilter) + '&status=' + encodeURIComponent(statusFilter) + '&q=' + encodeURIComponent(q);
    if (navigator.clipboard) navigator.clipboard.writeText('https://app.example.com/admin-table?' + params);
    notify('현재 필터 조건의 링크가 클립보드에 복사되었습니다', 'success');
  }

  function exportCsv() {
    setExporting(true);
    setTimeout(() => {
      const header = 'ID,이름,유형,지역,상태,확신도,최근검증일\n';
      const body = filtered.map((p) => [p.id, p.name, p.type, p.region + ' ' + p.city, p.status, p.score, p.lastVerified].join(',')).join('\n');
      const blob = new Blob([header + body], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'partner-network-data.csv'; a.click();
      URL.revokeObjectURL(url);
      setExporting(false);
      notify(filtered.length + '건이 CSV로 내보내기 되었습니다', 'success');
    }, 1100);
  }

  return (
    <div>

      <div className="page-content">
        <div className="toolbar">
          <div className="search-wrap-light"><Icon name="magnifying-glass" size={14} /><input placeholder="파트너명 또는 지역으로 검색" value={q} onChange={(e) => setQ(e.target.value)} /></div>
          <select className="filter-select" value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}>
            <option>전체</option>{Object.keys(TYPE_META).map((t) => <option key={t}>{t}</option>)}

            <option>전체</option>{Object.keys(STATUS_META).map((s) => <option key={s}>{s}</option>)}

function NewEntityPage({ notify }) {
  const [type, setType] = useState('회사');
  const [name, setName] = useState('');
  const [region, setRegion] = useState('한국');
  const [address, setAddress] = useState('');
  const [geocoded, setGeocoded] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  function handleGeocode() {
    if (!address.trim()) { notify('주소를 먼저 입력해 주세요', 'error'); return; }
    setGeocoded(true);
    notify('좌표가 자동 산출되어 지도 미리보기에 반영되었습니다', 'success');
  }

  function submit() {
    if (!name.trim()) { notify('파트너명을 입력해 주세요', 'error'); return; }
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      notify(name + ' 항목이 검증 파이프라인 큐에 자동 등록되었습니다', 'success');
      setName(''); setAddress(''); setGeocoded(false);
    }, 900);
  }

  return (
    <div>
      <div className="hero-band"><div className="hero-beam"></div>
        <div className="hero-inner">
          <h1>신규 데이터 추가</h1>
          <p>유형 선택에 따라 확장 필드가 동적으로 바뀌고, 등록과 동시에 검증 파이프라인이 자동으로 트리거됩니다.</p>
        </div>
      </div>
      <div className="page-content">
        <div className="form-card">
          <div className="field-row"><label>파트너 유형</label>
            <div className="type-pill-grid">
              {Object.keys(TYPE_META).map((t) => (
                <button key={t} type="button" className={'type-pill' + (type === t ? ' selected' : '')} onClick={() => setType(t)}>{t}</button>
              ))}
            </div>
          </div>
          <div className="field-row-2">
            <div className="field-row"><label>파트너명</label><input value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 청해로지스틱스" /></div>
            <div className="field-row"><label>국가</label>
              <select value={region} onChange={(e) => setRegion(e.target.value)}><option>한국</option><option>베트남</option></select>
            </div>
          </div>
          <div className="field-row">
            <label>주소</label>
            <div style={{ display: 'flex', gap: 8 }}>
              <input style={{ flex: 1 }} value={address} onChange={(e) => { setAddress(e.target.value); setGeocoded(false); }} placeholder="예: 부산광역시 강서구 신항중앙로 100" />
              <button type="button" className="btn btn-ghost" onClick={handleGeocode}><Icon name="map-pin" size={14} />좌표 산출</button>
            </div>
          </div>
          {type === '창고' && <div className="field-row"><label>보관 면적(㎡)</label><input placeholder="예: 4,200" /></div>}
          {type === '항만' && <div className="field-row"><label>선석 수</label><input placeholder="예: 6" /></div>}
          {(type === '관세법인' || type === '회계법인') && <div className="field-row"><label>등록 라이선스 번호</label><input placeholder="예: KR-2024-00821" /></div>}

          <div className="geo-preview">
            <div className="geo-preview-map">{geocoded && <span className="pin"></span>}</div>
            <div style={{ fontSize: 12.5, color: 'var(--text2)' }}>
              {geocoded ? '좌표가 산출되어 지도에 반영될 준비가 되었습니다' : '주소 입력 후 좌표 산출 버튼을 누르면 지도 미리보기가 표시됩니다'}
            </div>
          </div>

          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={submit} disabled={submitting}>
            <Icon name={submitting ? 'spinner-gap' : 'plus-circle'} size={15} />{submitting ? '등록 중...' : '등록하고 검증 파이프라인 실행'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
const NAV_ITEMS = [
  { key: 'main', label: '파트너 네트워크 맵' },
  { key: 'admin-table', label: '데이터 관리 테이블' },
  { key: 'revalidation-scheduler', label: '재검증 스케줄러' },
  { key: 'new-entity-workflow', label: '신규 데이터 추가' },
];

function App() {
  const [page, setPage] = useState('main');
  const [toasts, notify] = useToasts();

  return (
    <div style={{ width: '100%', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="topnav">
        <div className="brand"><span className="brand-mark"><Icon name="anchor" size={16} /></span>PartnerGrid</div>
        <nav className="nav-scroll">
          {NAV_ITEMS.map((n) => (
            <button key={n.key} className={'nav-item' + (page === n.key ? ' active' : '')} onClick={() => setPage(n.key)}>{n.label}</button>
          ))}
        </nav>
        <button className="nav-cta" onClick={() => notify('관리자 계정으로 로그인되어 있습니다', 'default')}><Icon name="user-circle" size={15} />관리자</button>
      </header>

      <main style={{ flex: 1, width: '100%' }}>
        {page === 'main' && <MapPage notify={notify} />}
        {page === 'admin-table' && <AdminTablePage notify={notify} />}
        {page === 'revalidation-scheduler' && <SchedulerPage notify={notify} />}
        {page === 'new-entity-workflow' && <NewEntityPage notify={notify} />}
      </main>

      {page !== 'main' && <footer>© 2026 PartnerGrid — 자체 개발 프로젝트 (구현 데모)</footer>}

      <ToastContainer toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
