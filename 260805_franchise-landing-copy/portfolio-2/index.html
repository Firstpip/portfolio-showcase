<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가맹 리드 관리 및 상담 데이터 분석 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.15.0/umd/Recharts.min.js"></script>
<style>
  :root{
    --bg:#0d0b0a; --surf:#1c1816; --surf2:#241f1c; --line:rgba(247,241,234,.10);
    --txt:#f5efe8; --txt2:#b9a99c; --accent:#a02d25; --accent-soft:rgba(160,45,37,.16);
    --amber:#ffac2e; --green:#4caf7d; --felt:#6d6d6d; --ash:#9a9a9a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body,#root{width:100%; min-height:100vh;}
  body{font-family:'Pretendard',sans-serif; background:var(--bg); color:var(--txt); line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#332c28; border-radius:8px;}

  .app-header{position:sticky; top:0; z-index:50; height:64px; display:flex; align-items:center; gap:20px; padding:0 28px; background:rgba(13,11,10,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); width:100%;}
  .brand{font-weight:700; font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; white-space:nowrap;}
  .brand .sq{width:12px;height:12px;background:var(--accent);}
  .project-switcher{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--txt2); background:var(--surf); border:1px solid var(--line); padding:8px 14px; border-radius:75px; white-space:nowrap;}
  .global-nav{display:flex; gap:22px; font-size:14px; color:var(--txt2); margin-left:8px;}
  .global-nav a{color:inherit;}
  .global-nav a.active{color:var(--txt); font-weight:600;}
  .header-actions{margin-left:auto; display:flex; align-items:center; gap:14px;}
  .icon-btn{width:36px; height:36px; border-radius:75px; background:var(--surf); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--txt2);}
  .icon-btn:hover{color:var(--txt); border-color:rgba(247,241,234,.3);}
  .avatar{width:36px; height:36px; border-radius:75px; background:linear-gradient(135deg,var(--accent),var(--amber)); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  @media (max-width:900px){ .global-nav{display:none;} }

  .tab-bar{display:flex; gap:6px; padding:14px 28px; overflow-x:auto; border-bottom:1px solid var(--line); width:100%;}
  .tab{border:none; background:transparent; color:var(--txt2); font-size:13px; font-weight:600; padding:10px 16px; border-radius:0; border-bottom:2px solid transparent; white-space:nowrap; transition:.2s;}
  .tab.active{color:var(--txt); border-bottom-color:var(--accent);}
  .tab:hover{color:var(--txt);}

  .content{max-width:1320px; margin:0 auto; padding:28px 28px 60px; width:100%;}

  .stat-strip{display:flex; align-items:stretch; background:var(--surf); border:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .stat-strip-item{flex:1; min-width:180px; padding:12px 20px; position:relative; overflow:hidden; border-right:1px solid var(--line);}
  .stat-strip-item:last-child{border-right:none;}
  .stat-strip-label{font-size:11px; color:var(--txt2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .stat-strip-row{display:flex; align-items:baseline; gap:10px;}
  .stat-strip-value{font-size:28px; font-weight:700; letter-spacing:-.02em;}
  .stat-strip-unit{font-size:13px; color:var(--txt2); margin-left:3px; font-weight:500;}
  .stat-strip-delta{font-size:11px; margin-top:4px; color:var(--green); white-space:nowrap;}
  .stat-strip-delta.down{color:#e0665a;}
  .live-dot{width:7px;height:7px; border-radius:50%; background:var(--green); display:inline-block; animation:pulse 1.6s infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .sparkline{position:absolute; bottom:6px; right:14px; opacity:.45;}

  .dash-grid{display:grid; grid-template-columns:1fr 320px; gap:16px; align-items:start;}
  @media (max-width:1000px){ .dash-grid{grid-template-columns:1fr;} }

  .panel{background:var(--surf); border:1px solid var(--line);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
  .panel-head h3{font-size:15px; font-weight:700;}
  .panel-body{padding:22px;}

  .priority-rail{background:var(--surf); border:1px solid var(--line); position:sticky; top:96px;}
  .priority-item{display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:.15s;}
  .priority-item:hover{background:var(--surf2);}
  .priority-item .pdot{width:8px;height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}
  .priority-item .pdot.urgent{background:var(--accent);}
  .priority-item .pdot.warn{background:var(--amber);}
  .priority-item .pname{font-size:13px; font-weight:600;}
  .priority-item .pmeta{font-size:12px; color:var(--txt2); margin-top:3px;}
  .priority-item .ptime{font-size:11px; color:var(--accent); margin-top:4px;}

  .funnel{display:flex; flex-direction:column; gap:10px;}
  .funnel-row{display:flex; align-items:center; gap:14px;}
  .funnel-label{width:88px; font-size:12px; color:var(--txt2); flex-shrink:0;}
  .funnel-bar-wrap{flex:1; height:34px; background:var(--surf2); position:relative; cursor:pointer;}
  .funnel-bar{height:100%; background:linear-gradient(90deg, var(--accent), var(--amber)); display:flex; align-items:center; padding:0 12px; font-size:13px; font-weight:700; color:#000000; transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .funnel-count{width:56px; text-align:right; font-size:14px; font-weight:700; flex-shrink:0;}

  .chart-wrap{height:240px; width:100%; position:relative;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:4px 10px; border-radius:75px; background:var(--accent-soft); color:#ff9d8f; font-weight:600;}

  .btn{display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 16px; border-radius:75px; border:1px solid var(--line); background:var(--surf2); color:var(--txt); font-size:13px; font-weight:600;}
  .btn:hover{border-color:rgba(247,241,234,.35);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#ffffff;}

  .table{width:100%; border-collapse:collapse; font-size:13px;}
  .table th{text-align:left; color:var(--txt2); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:10px 14px; border-bottom:1px solid var(--line);}
  .table td{padding:14px; border-bottom:1px solid var(--line);}
  .table tr:hover td{background:var(--surf2);}
  .bar-input{width:100%;}

  .hist-bar{display:flex; align-items:flex-end; gap:6px; height:180px;}
  .hist-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;}
  .hist-fill{width:100%; background:var(--accent); transition:.4s ease; border-radius:2px 2px 0 0;}
  .hist-col:hover .hist-fill{background:var(--amber);}
  .hist-label{font-size:10px; color:var(--felt);}

  .cms-form{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;}
  @media (max-width:700px){ .cms-form{grid-template-columns:1fr;} }
  .cms-form label{font-size:12px; color:var(--txt2); display:block; margin-bottom:6px;}
  .cms-form input, .cms-form textarea{width:100%; background:var(--surf2); border:1px solid var(--line); color:var(--txt); padding:10px 12px; font-size:13px; font-family:inherit;}

  .drawer-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; justify-content:flex-end; z-index:100; opacity:0; animation:fadeIn .2s forwards;}
  @keyframes fadeIn{ to{opacity:1;} }
  .drawer{width:420px; max-width:90vw; height:100%; background:var(--surf); border-left:1px solid var(--line); padding:26px; overflow-y:auto; transform:translateX(100%); animation:slideIn .3s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes slideIn{ to{transform:translateX(0);} }
  @media (max-width:600px){ .drawer{width:100%;} }

  .toast-wrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{background:var(--surf); border:1px solid var(--line); border-left:3px solid var(--green); padding:14px 18px; font-size:13px; min-width:240px; animation:slideUp .3s ease;}
  @keyframes slideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .empty-hint{color:var(--felt); font-size:13px; padding:20px; text-align:center;}
  .toggle{width:40px; height:22px; border-radius:75px; background:var(--surf2); border:1px solid var(--line); position:relative; flex-shrink:0;}
  .toggle .dot{width:16px; height:16px; border-radius:50%; background:var(--ash); position:absolute; top:2px; left:2px; transition:.2s;}
  .toggle.on{background:var(--accent-soft); border-color:var(--accent);}
  .toggle.on .dot{left:20px; background:var(--accent);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useMemo} = React;
const {ResponsiveContainer, BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid} = Recharts;

const LEADS = [
  {id:1, name:'김도현', phone:'010-22**-9910', area:'서울 마포구', channel:'네이버', size:'15평', stage:'상담대기', waitH:26},
  {id:2, name:'박서연', phone:'010-88**-2214', area:'경기 수원시', channel:'인스타그램', size:'20평 이상', stage:'상담대기', waitH:31},
  {id:3, name:'이준혁', phone:'010-51**-7723', area:'부산 해운대구', channel:'지인추천', size:'10~15평', stage:'현장상담', waitH:4},
  {id:4, name:'최유나', phone:'010-77**-5501', area:'인천 남동구', channel:'네이버', size:'15~20평', stage:'상담대기', waitH:29},
];

const CHANNEL_REGION = [
  {region:'서울', 네이버:34, 인스타그램:21, 지인추천:9},
  {region:'경기·인천', 네이버:28, 인스타그램:18, 지인추천:11},
  {region:'부산·경남', 네이버:15, 인스타그램:9, 지인추천:6},
  {region:'기타', 네이버:8, 인스타그램:5, 지인추천:3},
];

const WEEKLY_TREND = [
  {week:'1주', 상담신청:38}, {week:'2주', 상담신청:44}, {week:'3주', 상담신청:41},
  {week:'4주', 상담신청:52}, {week:'5주', 상담신청:57}, {week:'6주', 상담신청:63},
];

const HIST_BUCKETS = [
  {label:'6~7천', pct:34, count:62}, {label:'7~8천', pct:58, count:104},
  {label:'8~9천', pct:100, count:178}, {label:'9~10천', pct:71, count:127},
  {label:'10~11천', pct:40, count:71}, {label:'11천~', pct:22, count:39},
];

const COPY_VERSIONS = [
  {id:'v1', slot:'헤드라인', text:'낮엔 홀 손님, 밤엔 배달까지 — 하나의 주방으로 두 개의 매출을 만듭니다', weight:60, views:1842, active:true},
  {id:'v2', slot:'헤드라인', text:'초기 투자 부담은 낮추고, 매출 채널은 두 배로 — 홀+배달 결합 창업', weight:40, views:1201, active:true},
  {id:'v3', slot:'서브헤드', text:'맞벌이 부부도 무리 없이 운영을 병행할 수 있는 구조입니다', weight:100, views:3043, active:true},
];

function Toast({msg, onClose}){
  React.useEffect(()=>{ const t=setTimeout(onClose,2600); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><i className="ph ph-check-circle" style={{color:'#4caf7d', marginRight:6}}></i>{msg}</div>;
}

function Sparkline({data, color}){
  const w=90,h=32; const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg className="sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" />
    </svg>
  );
}

function StatusStrip(){
  const items = [
    {label:'금일 신규 상담 신청', value:'18', unit:'건', delta:'▲ 전일 대비 4건 증가', down:false, spark:[8,10,9,13,12,16,18], color:'#a02d25', live:true},
    {label:'평균 응답 대기 구간', value:'3.4', unit:'시간', delta:'▼ 목표(4시간) 이내', down:true, spark:[5.1,4.6,4.2,3.9,3.7,3.5,3.4], color:'#ffac2e'},
    {label:'진행 중 리드 수', value:'63', unit:'건', delta:'▲ 전환율 41%', down:false, spark:[40,45,48,52,58,60,63], color:'#4caf7d'},
    {label:'24시간 이상 미응답', value:'4', unit:'건', delta:'우선 대응 필요', down:true, spark:[2,3,3,5,4,5,4], color:'#e0665a'},
  ];
  return (
    <section className="stat-strip">
      {items.map((it,i)=>(
        <div className="stat-strip-item" key={i}>
          <div className="stat-strip-label">{it.live && <span className="live-dot"></span>}{it.label}</div>
          <div className="stat-strip-row">
            <div className="stat-strip-value">{it.value}<span className="stat-strip-unit">{it.unit}</span></div>
            <Sparkline data={it.spark} color={it.color} />
          </div>
          <div className={"stat-strip-delta" + (it.down?' down':'')}>{it.delta}</div>
        </div>
      ))}
    </section>
  );
}

function FunnelPanel({onSelectStage}){
  const stages = [
    {name:'접수', count:182, pct:100},
    {name:'1차 상담', count:141, pct:78},
    {name:'현장상담', count:96, pct:53},
    {name:'계약검토', count:58, pct:32},
    {name:'가맹성사', count:31, pct:17},
  ];
  return (
    <div className="panel">
      <div className="panel-head">
        <h3>신규 리드 접수 → 상담 → 성사 퍼널</h3>
        <span className="badge"><i className="ph ph-broadcast"></i> 실시간 반영</span>
      </div>
      <div className="panel-body">
        <div className="funnel">
          {stages.map(s=>(
            <div className="funnel-row" key={s.name} onClick={()=>onSelectStage(s)}>
              <div className="funnel-label">{s.name}</div>
              <div className="funnel-bar-wrap">
                <div className="funnel-bar" style={{width:s.pct+'%'}}>{s.pct}%</div>
              </div>
              <div className="funnel-count">{s.count}건</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function LeadAnalyticsPanel(){
  const [range, setRange] = useState('week');
  return (
    <div className="panel">
      <div className="panel-head">
        <h3>지역·채널별 리드 성과 분석</h3>
        <div style={{display:'flex',gap:8}}>
          <button className={"btn" + (range==='week'?' btn-primary':'')} onClick={()=>setRange('week')}>주별</button>
          <button className={"btn" + (range==='month'?' btn-primary':'')} onClick={()=>setRange('month')}>월별</button>
        </div>
      </div>
      <div className="panel-body">
        <div className="chart-wrap" style={{marginBottom:24}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={CHANNEL_REGION}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(247,241,234,.08)" vertical={false} />
              <XAxis dataKey="region" stroke="#b9a99c" fontSize={12} />
              <YAxis stroke="#b9a99c" fontSize={12} />
              <Tooltip contentStyle={{background:'#241f1c', border:'1px solid rgba(247,241,234,.15)', color:'#f5efe8'}} />
              <Bar dataKey="네이버" stackId="a" fill="#a02d25" />
              <Bar dataKey="인스타그램" stackId="a" fill="#ffac2e" />
              <Bar dataKey="지인추천" stackId="a" fill="#4caf7d" />
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div className="chart-wrap">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={WEEKLY_TREND}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(247,241,234,.08)" vertical={false} />
              <XAxis dataKey="week" stroke="#b9a99c" fontSize={12} />
              <YAxis stroke="#b9a99c" fontSize={12} />
              <Tooltip contentStyle={{background:'#241f1c', border:'1px solid rgba(247,241,234,.15)', color:'#f5efe8'}} />
              <Line type="monotone" dataKey="상담신청" stroke="#ffac2e" strokeWidth={2.5} dot={{r:3}} />
            </LineChart>
          </ResponsiveContainer>
        </div>
        <p style={{fontSize:12, color:'#b9a99c', marginTop:14}}>조회 조건: {range==='week'?'최근 6주 주별 추이':'최근 6개월 월별 추이'} · URL 쿼리 파라미터로 공유 가능</p>
      </div>
    </div>
  );
}

function CalculatorInsightsPanel({onSelectBucket}){
  return (
    <div className="panel">
      <div className="panel-head">
        <h3>계산기 응답 로그 및 퍼널 인사이트</h3>
        <span className="badge"><i className="ph ph-database"></i> calculator_logs</span>
      </div>
      <div className="panel-body">
        <p style={{fontSize:13, color:'#b9a99c', marginBottom:18}}>랜딩페이지 수익 계산기에 입력된 초기 투자금 구간별 분포와, 해당 구간에서 실제 상담 신청으로 이어진 비율입니다.</p>
        <div className="hist-bar">
          {HIST_BUCKETS.map(b=>(
            <div className="hist-col" key={b.label} onClick={()=>onSelectBucket(b)}>
              <div className="hist-fill" style={{height:b.pct+'%'}}></div>
              <div className="hist-label">{b.label}</div>
            </div>
          ))}
        </div>
        <p style={{fontSize:11, color:'#736a63', marginTop:10}}>막대를 클릭하면 해당 구간의 응답 건수가 표시됩니다 · Redis 캐시 5분 주기 갱신</p>
      </div>
    </div>
  );
}

function CopyCmsPanel({showToast}){
  const [versions, setVersions] = useState(COPY_VERSIONS);
  const [showForm, setShowForm] = useState(false);
  const [draft, setDraft] = useState({slot:'헤드라인', text:'', weight:20});

  const totalBySlot = (slot) => versions.filter(v=>v.slot===slot && v.active).reduce((s,v)=>s+v.weight,0);

  function toggleActive(id){
    setVersions(versions.map(v=> v.id===id ? {...v, active: !v.active} : v));
  }

  function submitDraft(e){
    e.preventDefault();
    if(!draft.text.trim()) return;
    const newVersion = {id:'v'+(versions.length+1), slot:draft.slot, text:draft.text, weight:Number(draft.weight), views:0, active:true};
    setVersions([...versions, newVersion]);
    setShowForm(false);
    setDraft({slot:'헤드라인', text:'', weight:20});
    showToast('새 카피 버전이 등록되었습니다');
  }

  return (
    <div className="panel">
      <div className="panel-head">
        <h3>랜딩 카피 A/B 버전 관리</h3>
        <button className="btn btn-primary" onClick={()=>setShowForm(true)}><i className="ph ph-plus"></i> 새 버전 등록</button>
      </div>
      <div className="panel-body">
        <table className="table">
          <thead>
            <tr><th>슬롯</th><th>카피 문구</th><th>노출 비중</th><th>노출 수</th><th>사용</th></tr>
          </thead>
          <tbody>
            {versions.map(v=>(
              <tr key={v.id}>
                <td><span className="badge">{v.slot}</span></td>
                <td style={{maxWidth:360}}>{v.text}</td>
                <td>{v.weight}%{totalBySlot(v.slot)>100 && v.active && <span style={{color:'#e0665a', marginLeft:6, fontSize:11}}>합계 초과</span>}</td>
                <td>{v.views.toLocaleString()}</td>
                <td><div className={"toggle" + (v.active?' on':'')} onClick={()=>toggleActive(v.id)}><div className="dot"></div></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {showForm && (
        <div className="drawer-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setShowForm(false); }}>
          <div className="drawer">
            <h3 style={{fontSize:17, marginBottom:20}}>새 카피 버전 등록</h3>
            <form onSubmit={submitDraft}>
              <div className="cms-form" style={{gridTemplateColumns:'1fr'}}>
                <div>
                  <label>슬롯</label>
                  <select value={draft.slot} onChange={e=>setDraft({...draft, slot:e.target.value})} style={{width:'100%', background:'#241f1c', border:'1px solid rgba(247,241,234,.15)', color:'#f5efe8', padding:'10px 12px', fontFamily:'inherit'}}>
                    <option>헤드라인</option><option>서브헤드</option><option>CTA</option>
                  </select>
                </div>
                <div>
                  <label>카피 문구</label>
                  <textarea rows="3" value={draft.text} onChange={e=>setDraft({...draft, text:e.target.value})} placeholder="예: 초기 투자 부담을 낮춘 홀+배달 결합형 주점"></textarea>
                </div>
                <div>
                  <label>노출 비중 (0~100)</label>
                  <input type="number" min="0" max="100" value={draft.weight} onChange={e=>setDraft({...draft, weight: Math.max(0,Math.min(100, Number(e.target.value)))})} />
                </div>
              </div>
              <div style={{display:'flex', gap:10, marginTop:20}}>
                <button type="button" className="btn" onClick={()=>setShowForm(false)} style={{flex:1, justifyContent:'center'}}>취소</button>
                <button type="submit" className="btn btn-primary" disabled={!draft.text.trim()} style={{flex:1, justifyContent:'center'}}>등록하기</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function PriorityRail({onOpen}){
  const urgent = LEADS.filter(l=>l.waitH>=24);
  return (
    <div className="priority-rail">
      <div className="panel-head">
        <button className="tab active" style={{border:'none', padding:0, fontSize:14}} onClick={onOpen}>우선 대응 리드 큐</button>
        <span className="badge">{urgent.length}건</span>
      </div>
      {urgent.map(l=>(
        <div className="priority-item" key={l.id} onClick={onOpen}>
          <div className={"pdot " + (l.waitH>=28?'urgent':'warn')}></div>
          <div>
            <div className="pname">{l.name} · {l.area}</div>
            <div className="pmeta">{l.channel} 유입 · 희망 {l.size}</div>
            <div className="ptime">미응답 {l.waitH}시간 경과</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function LeadDrawer({onClose, showToast}){
  return (
    <div className="drawer-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="drawer">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
          <h3 style={{fontSize:17}}>우선 대응 리드 큐</h3>
          <button className="icon-btn" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        {LEADS.filter(l=>l.waitH>=24).map(l=>(
          <div key={l.id} style={{background:'#241f1c', border:'1px solid rgba(247,241,234,.1)', padding:16, marginBottom:12}}>
            <div style={{display:'flex', justifyContent:'space-between'}}>
              <strong style={{fontSize:14}}>{l.name}</strong>
              <span className="badge">미응답 {l.waitH}시간</span>
            </div>
            <p style={{fontSize:12, color:'#b9a99c', marginTop:8}}>연락처: {l.phone}</p>
            <p style={{fontSize:12, color:'#b9a99c'}}>희망 지역: {l.area} · 희망 평수: {l.size}</p>
            <p style={{fontSize:12, color:'#b9a99c'}}>유입 채널: {l.channel} · 현재 단계: {l.stage}</p>
            <div style={{display:'flex', gap:8, marginTop:14}}>
              <button className="btn btn-primary" style={{flex:1, justifyContent:'center'}} onClick={()=>showToast(l.name+' 리드에 담당자가 배정되었습니다')}>담당자 배정</button>
              <button className="btn" style={{flex:1, justifyContent:'center'}} onClick={()=>showToast(l.name+' 리드에 메모가 추가되었습니다')}>메모 추가</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const TABS = [
  {key:'overview', label:'실시간 리드 파이프라인 현황'},
  {key:'lead-analytics', label:'지역·채널별 리드 성과 분석'},
  {key:'calculator-insights', label:'계산기 응답 로그 및 퍼널 인사이트'},
  {key:'copy-cms', label:'랜딩 카피 A/B 버전 관리'},
];

function App(){
  const [tab, setTab] = useState('overview');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [stageDrawer, setStageDrawer] = useState(null);
  const [bucketDrawer, setBucketDrawer] = useState(null);
  const [toasts, setToasts] = useState([]);

  function showToast(msg){
    const id = toasts.length + Math.random();
    setToasts(t=>[...t, {id, msg}]);
  }
  function removeToast(id){ setToasts(t=>t.filter(x=>x.id!==id)); }

  return (
    <div data-archetype="topbar-analytics" style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <header className="app-header">
        <div className="brand"><span className="sq"></span>가맹 리드 관제</div>
        <div className="project-switcher"><i className="ph ph-storefront"></i> 담다 홀앤딜 <i className="ph ph-caret-down"></i></div>
        <nav className="global-nav">
          <a className={tab==='overview'?'active':''} onClick={()=>setTab('overview')} style={{cursor:'pointer'}}>개요</a>
          <a className={tab==='lead-analytics'?'active':''} onClick={()=>setTab('lead-analytics')} style={{cursor:'pointer'}}>성과분석</a>
          <a className={tab==='copy-cms'?'active':''} onClick={()=>setTab('copy-cms')} style={{cursor:'pointer'}}>카피관리</a>
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={()=>showToast('리드/카피 통합 검색은 다음 업데이트에서 제공됩니다')}><i className="ph ph-magnifying-glass"></i></button>
          <button className="icon-btn" onClick={()=>setDrawerOpen(true)}><i className="ph ph-bell"></i></button>
          <div className="avatar">HQ</div>
        </div>
      </header>

      <nav className="tab-bar">
        <button role="tab" aria-selected={tab==='overview'} className={"tab" + (tab==='overview'?' active':'')} onClick={()=>setTab('overview')}>{TABS[0].label}</button>
        <button role="tab" aria-selected={tab==='lead-analytics'} className={"tab" + (tab==='lead-analytics'?' active':'')} onClick={()=>setTab('lead-analytics')}>{TABS[1].label}</button>
        <button role="tab" aria-selected={tab==='calculator-insights'} className={"tab" + (tab==='calculator-insights'?' active':'')} onClick={()=>setTab('calculator-insights')}>{TABS[2].label}</button>
        <button role="tab" aria-selected={tab==='copy-cms'} className={"tab" + (tab==='copy-cms'?' active':'')} onClick={()=>setTab('copy-cms')}>{TABS[3].label}</button>
      </nav>

      <main className="content" style={{flex:1, width:'100%'}}>
        {tab==='overview' && (
          <div style={{padding:'4px 2px 24px'}}>
            <h1 style={{fontSize:48, fontWeight:700, letterSpacing:'-0.02em', lineHeight:1.15, margin:0}}>오늘도 놓치는 리드 없이,<br/>한 화면에서 관제합니다</h1>
            <p style={{fontSize:15, color:'#b9a99c', marginTop:12}}>실시간 리드 파이프라인부터 카피 성과까지, 본사 운영팀이 확인해야 할 지표를 한 곳에 모읍니다.</p>
          </div>
        )}
        <StatusStrip />
        <div className="dash-grid">
          <div>
            {tab==='overview' && <FunnelPanel onSelectStage={setStageDrawer} />}
            {tab==='lead-analytics' && <LeadAnalyticsPanel />}
            {tab==='calculator-insights' && <CalculatorInsightsPanel onSelectBucket={setBucketDrawer} />}
            {tab==='copy-cms' && <CopyCmsPanel showToast={showToast} />}
          </div>
          <PriorityRail onOpen={()=>setDrawerOpen(true)} />
        </div>
      </main>

      {drawerOpen && <LeadDrawer onClose={()=>setDrawerOpen(false)} showToast={showToast} />}

      {stageDrawer && (
        <div className="drawer-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setStageDrawer(null); }}>
          <div className="drawer">
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
              <h3 style={{fontSize:17}}>{stageDrawer.name} 단계 상세</h3>
              <button className="icon-btn" onClick={()=>setStageDrawer(null)}><i className="ph ph-x"></i></button>
            </div>
            <p style={{fontSize:13, color:'#b9a99c', marginBottom:16}}>현재 {stageDrawer.name} 단계에 있는 리드는 총 {stageDrawer.count}건이며, 전체 접수 대비 {stageDrawer.pct}%가 이 단계까지 도달했습니다.</p>
            <div className="empty-hint" style={{border:'1px dashed rgba(247,241,234,.15)'}}>단계별 리드 목록은 우측 상단 검색으로 필터링해 조회할 수 있습니다.</div>
          </div>
        </div>
      )}

      {bucketDrawer && (
        <div className="drawer-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setBucketDrawer(null); }}>
          <div className="drawer">
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
              <h3 style={{fontSize:17}}>투자금 {bucketDrawer.label}만원 구간</h3>
              <button className="icon-btn" onClick={()=>setBucketDrawer(null)}><i className="ph ph-x"></i></button>
            </div>
            <p style={{fontSize:13, color:'#b9a99c'}}>이 구간에서 계산기를 사용한 응답은 총 {bucketDrawer.count}건이며, 상담신청 전환 강도는 {bucketDrawer.pct}%로 집계됩니다.</p>
          </div>
        </div>
      )}

      <div className="toast-wrap">
        {toasts.map(t=> <Toast key={t.id} msg={t.msg} onClose={()=>removeToast(t.id)} />)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
