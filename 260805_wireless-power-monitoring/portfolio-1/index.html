<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무선 전력전송 통합 관제 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --primary:#fa5d00; --primary-dark:#d94f00; --secondary:#c0bbb6; --accent:#1ef6da;
    --bg:#fff8f1; --surface:#ffffff; --marigold:#fee3b5; --parchment:#e3d6c5;
    --text:#1d1e1c; --text2:#615f5c; --mist:#d9d9d9; --smoke:#a5a19c;
    --ok:#2f9e5b; --warn:#d98c1f; --danger:#e0483e; --offline:#9a958f;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.2);
    --shadow-lg: 6px 4px 24px rgba(250,166,0,0.25);
    --radius-card:20px; --radius-btn:16px; --radius-tag:999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary); border-radius:8px;}

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.8);} }
  @keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
  @keyframes countUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes sweepRadar{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes drawerIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

  .app-shell{display:flex; width:100%; min-height:100vh;}

  /* ── sidebar ── */
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:240px;
    background:var(--surface); border-right:1px solid var(--mist);
    display:flex; flex-direction:column; z-index:40;
  }
  .sidebar-brand{ padding:24px 20px 16px; display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--primary),#ff8a3d); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; box-shadow:var(--shadow-sm);}
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:0.015em; }
  .brand-sub{ font-size:11px; color:var(--text2); }
  .env-pill{ margin:0 20px 12px; padding:6px 12px; background:linear-gradient(90deg, var(--marigold) 25%, #fff4dd 50%, var(--marigold) 75%); background-size:200px 100%; animation:shimmer 2.6s linear infinite; border-radius:var(--radius-tag); font-size:11px; font-weight:600; color:#8a4a00; display:flex; align-items:center; gap:6px; width:fit-content; }
  .radar-icon{ display:inline-flex; animation:sweepRadar 3s linear infinite; }
  .env-dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); animation:pulseDot 2s ease-in-out infinite; }
  .sidebar-section{ padding:6px 12px; }
  .sidebar-section-title{ font-size:11px; font-weight:700; color:var(--smoke); text-transform:uppercase; letter-spacing:0.06em; padding:14px 12px 6px; }
  .sidebar-link{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
    font-size:14px; font-weight:500; color:var(--text2); text-decoration:none; border:none; background:none;
    width:100%; text-align:left; transition:background .15s, color .15s;
  }
  .sidebar-link i{ font-size:18px; }
  .sidebar-link:hover{ background:var(--bg); color:var(--text); }
  .sidebar-link.active{ background:var(--marigold); color:var(--primary-dark); font-weight:600; }
  .sidebar-footer{ margin-top:auto; padding:16px 20px; border-top:1px solid var(--mist); display:flex; align-items:center; gap:10px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--primary-dark); }

  .main-wrap{ margin-left:240px; flex:1; min-width:0; width:calc(100% - 240px); min-height:100vh; }

  /* ── header ── */
  .page-header{ padding:24px 32px 16px; display:flex; flex-direction:column; gap:4px; }
  .page-title-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .page-title{ font-size:38px; font-weight:700; letter-spacing:0.02em; margin:0; }
  .page-meta{ font-size:13px; color:var(--text2); }
  .page-actions{ display:flex; gap:8px; align-items:center; }
  .role-switch{ display:flex; background:var(--bg); border:1px solid var(--mist); border-radius:var(--radius-tag); padding:3px; }
  .role-switch button{ border:none; background:none; padding:6px 14px; border-radius:var(--radius-tag); font-size:12px; font-weight:600; color:var(--text2); }
  .role-switch button.active{ background:var(--primary); color:#fff; }
  .btn-secondary{ padding:9px 16px; border-radius:var(--radius-btn); background:var(--surface); border:1px solid var(--secondary); color:var(--text); font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .btn-secondary:hover{ background:var(--bg); }
  .btn-primary{ padding:9px 18px; border-radius:var(--radius-btn); background:var(--primary); border:none; color:#fff; font-size:13px; font-weight:600; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:6px; transition:transform .12s, background .15s; }
  .btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); }
  .btn-primary:disabled, .btn-secondary:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .btn-ghost{ border:none; background:none; color:var(--primary); font-size:13px; font-weight:600; padding:6px 4px; }
  .btn-danger{ padding:9px 16px; border-radius:var(--radius-btn); background:var(--danger); border:none; color:#fff; font-size:13px; font-weight:600; }

  main.content{ padding:0 32px 48px; }

  /* ── status strip (slim KPI) ── */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--mist); border-radius:var(--radius-card);
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:var(--shadow-sm); animation:fadeInUp .4s ease both;
  }
  .stat-info{ display:flex; flex-direction:column; gap:4px; }
  .stat-label{ font-size:12px; color:var(--text2); font-weight:600; }
  .stat-value{ font-size:30px; font-weight:700; letter-spacing:0.01em; animation:countUp .5s ease both; }
  .stat-delta{ font-size:12px; font-weight:600; }
  .stat-delta.positive{ color:var(--ok); }
  .stat-delta.negative{ color:var(--danger); }
  .stat-sparkline{ width:72px; height:28px; flex-shrink:0; }

  /* ── grid layout: primary + rail ── */
  .layout-grid{ display:grid; grid-template-columns:1fr 320px; gap:16px; margin-bottom:20px; align-items:start; }
  .panel{ background:var(--surface); border:1px solid var(--mist); border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow-sm); }
  .panel-title{ font-size:16px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel-sub{ font-size:12px; color:var(--text2); margin:0 0 16px; }

  .device-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .device-tile{
    border:1px solid var(--mist); border-radius:16px; padding:14px; background:var(--bg);
    cursor:pointer; transition:box-shadow .15s, transform .15s, border-color .15s; text-align:left;
  }
  .device-tile:hover{ box-shadow:var(--shadow-lg); transform:translateY(-2px); border-color:var(--primary); }
  .device-tile-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .device-tile-name{ font-size:13px; font-weight:700; }
  .device-tile-loc{ font-size:11px; color:var(--text2); margin-bottom:8px; }
  .device-tile-metrics{ display:flex; gap:10px; font-size:11px; color:var(--text2); }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .status-dot.ok{ background:var(--ok); }
  .status-dot.warn{ background:var(--warn); animation:pulseDot 1.6s ease-in-out infinite; }
  .status-dot.danger{ background:var(--danger); animation:pulseDot 1.1s ease-in-out infinite; }
  .status-dot.offline{ background:var(--offline); }

  .priority-list{ display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; }
  .priority-item{ display:flex; gap:10px; padding:12px; border-radius:14px; background:var(--bg); border:1px solid var(--mist); cursor:pointer; transition:background .15s; }
  .priority-item:hover{ background:var(--marigold); }
  .priority-badge{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:var(--radius-tag); height:fit-content; white-space:nowrap; }
  .priority-badge.urgent{ background:#fbe2df; color:var(--danger); }
  .priority-badge.warn{ background:#fbecd2; color:var(--warn); }
  .priority-item-body{ flex:1; min-width:0; }
  .priority-item-title{ font-size:12.5px; font-weight:600; margin-bottom:2px; }
  .priority-item-meta{ font-size:11px; color:var(--text2); }

  /* ── secondary widgets ── */
  .widget-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .donut-wrap{ display:flex; align-items:center; gap:20px; }
  .donut-legend{ display:flex; flex-direction:column; gap:8px; font-size:12px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  .bar-mini-row{ display:flex; align-items:flex-end; gap:8px; height:100px; }
  .bar-mini{ flex:1; background:linear-gradient(180deg,var(--primary),#ffb27a); border-radius:6px 6px 0 0; position:relative; animation:fadeInUp .5s ease both; }
  .bar-mini-label{ font-size:10px; color:var(--text2); text-align:center; margin-top:6px; }

  /* ── tab bar + table ── */
  .data-section{ background:var(--surface); border:1px solid var(--mist); border-radius:var(--radius-card); padding:20px 22px 24px; box-shadow:var(--shadow-sm); }
  .tab-bar{ display:flex; gap:4px; border-bottom:1px solid var(--mist); margin-bottom:16px; }
  .tab{ border:none; background:none; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text2); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--primary-dark); border-bottom-color:var(--primary); }
  .data-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .search-input{ flex:1; min-width:180px; padding:9px 14px; border:1px solid var(--secondary); border-radius:var(--radius-btn); font-size:13px; background:var(--bg); }
  .filter-chip{ padding:7px 14px; border-radius:var(--radius-tag); border:1px solid var(--secondary); background:var(--surface); font-size:12px; font-weight:600; color:var(--text2); display:flex; align-items:center; gap:6px; }
  .filter-chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .export-btn{ margin-left:auto; padding:9px 14px; border-radius:var(--radius-btn); background:var(--bg); border:1px solid var(--secondary); font-size:12px; font-weight:600; display:flex; gap:6px; align-items:center; }
  .data-table-wrap{ overflow-x:auto; }
  table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .data-table thead th{ text-align:left; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px; border-bottom:1px solid var(--mist); }
  .data-table tbody tr{ transition:background .12s; cursor:pointer; }
  .data-table tbody tr:hover{ background:var(--bg); }
  .data-table td{ padding:12px 10px; border-bottom:1px solid #f1ece4; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:var(--radius-tag); font-size:11px; font-weight:700; }
  .badge.ok{ background:#e2f3e7; color:var(--ok); }
  .badge.warn{ background:#fbecd2; color:var(--warn); }
  .badge.danger{ background:#fbe2df; color:var(--danger); }
  .badge.offline{ background:#ece9e5; color:var(--offline); }

  /* ── control screen ── */
  .control-layout{ display:grid; grid-template-columns:280px 1fr; gap:16px; }
  .device-pick-list{ display:flex; flex-direction:column; gap:8px; max-height:640px; overflow-y:auto; }
  .device-pick-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid transparent; background:var(--bg); font-size:13px; font-weight:500; text-align:left; }
  .device-pick-item.active{ border-color:var(--primary); background:var(--marigold); font-weight:700; }
  .control-card{ background:var(--surface); border:1px solid var(--mist); border-radius:var(--radius-card); padding:24px; box-shadow:var(--shadow-sm); margin-bottom:16px; }
  .control-toggle-row{ display:flex; gap:12px; margin:16px 0; }
  .toggle-btn{ flex:1; padding:16px; border-radius:16px; border:2px solid var(--mist); background:var(--surface); font-weight:700; font-size:14px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .toggle-btn.on{ border-color:var(--ok); color:var(--ok); background:#e2f3e7; }
  .toggle-btn.off{ border-color:var(--danger); color:var(--danger); background:#fbe2df; }
  .slider-row{ margin:20px 0; }
  .slider-label-row{ display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px; font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--primary); }
  .field-error{ color:var(--danger); font-size:12px; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .permission-note{ display:flex; gap:8px; align-items:center; background:#fbecd2; color:#8a4a00; padding:10px 14px; border-radius:12px; font-size:12.5px; margin-top:10px; }

  /* ── device detail ── */
  .detail-layout{ display:grid; grid-template-columns:260px 1fr; gap:16px; }
  .metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .metric-card{ background:var(--bg); border:1px solid var(--mist); border-radius:16px; padding:16px; text-align:center; }
  .metric-card .v{ font-size:24px; font-weight:700; margin:4px 0; }
  .metric-card .l{ font-size:11px; color:var(--text2); font-weight:600; }
  .efficiency-ring-wrap{ display:flex; align-items:center; gap:16px; }
  .chart-toggle-row{ display:flex; gap:6px; margin-bottom:12px; }
  .chart-wrap{ position:relative; height:280px; width:100%; }

  /* ── alarm ── */
  .threshold-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:8px; }
  .threshold-field{ display:flex; flex-direction:column; gap:6px; }
  .threshold-field label{ font-size:12px; font-weight:600; color:var(--text2); }
  .threshold-field input{ padding:10px 12px; border:1px solid var(--secondary); border-radius:var(--radius-btn); font-size:14px; background:var(--bg); }
  .threshold-field input:disabled{ opacity:.5; }
  .alarm-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; background:var(--bg); border:1px solid var(--mist); margin-bottom:10px; cursor:pointer; transition:box-shadow .15s; }
  .alarm-row:hover{ box-shadow:var(--shadow-sm); }
  .alarm-icon{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }

  /* ── system management ── */
  .sm-tabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--mist); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size:12px; font-weight:600; color:var(--text2); }
  .form-field input, .form-field select{ padding:10px 12px; border:1px solid var(--secondary); border-radius:var(--radius-btn); font-size:14px; background:var(--bg); }
  .icon-btn{ border:none; background:var(--bg); width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--text2); }
  .icon-btn:hover{ background:var(--marigold); color:var(--primary-dark); }
  .icon-btn.danger:hover{ background:#fbe2df; color:var(--danger); }
  .match-row{ display:flex; align-items:center; gap:12px; background:var(--bg); border:1px solid var(--mist); border-radius:16px; padding:16px; margin-bottom:14px; }

  /* ── modal / drawer / toast ── */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(29,30,28,0.45); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .18s ease; }
  .modal-box{ background:var(--surface); border-radius:22px; padding:28px; width:460px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(29,30,28,0.25); animation:fadeInUp .22s ease; }
  .modal-title{ font-size:19px; font-weight:700; margin:0 0 14px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .drawer-backdrop{ position:fixed; inset:0; background:rgba(29,30,28,0.4); z-index:100; display:flex; justify-content:flex-end; }
  .drawer-box{ width:420px; max-width:92vw; height:100%; background:var(--surface); padding:28px; overflow-y:auto; animation:drawerIn .25s ease; box-shadow:-10px 0 40px rgba(0,0,0,0.15); }
  .toast{ position:fixed; top:22px; right:22px; background:var(--text); color:#fff; padding:14px 20px; border-radius:14px; font-size:13px; font-weight:600; z-index:200; animation:toastIn .25s ease; box-shadow:0 10px 30px rgba(0,0,0,0.25); display:flex; align-items:center; gap:8px; }
  .close-x{ border:none; background:none; font-size:18px; color:var(--text2); position:absolute; top:20px; right:20px; }

  @media (max-width: 1080px){
    .layout-grid, .control-layout, .detail-layout, .widget-row{ grid-template-columns:1fr; }
    .stat-row, .metric-grid, .threshold-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>

/* ───────────── small components ───────────── */
function Sparkline({ data, color }) {
  const w = 72, h = 28;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i) => {
    const x = (i/(data.length-1)) * w;
    const y = h - ((v-min)/(max-min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color || 'var(--primary)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Donut({ segments }) {
  const total = segments.reduce((s,x) => s+x.value, 0);
  let acc = 0;
  const r = 40, c = 2*Math.PI*r;
  return (
    <svg width="110" height="110" viewBox="0 0 110 110">
      <g transform="rotate(-90 55 55)">
        {segments.map((s,i) => {
          const frac = s.value/total;
          const dash = frac*c;
          const el = (
            <circle key={i} cx="55" cy="55" r={r} fill="none" stroke={s.color} strokeWidth="14"
              strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-acc}
              style={{ transition:'stroke-dasharray .5s ease' }} />
          );
          acc += dash;
          return el;
        })}
      </g>
      <text x="55" y="50" textAnchor="middle" fontSize="20" fontWeight="700" fill="var(--text)">{total}</text>
      <text x="55" y="66" textAnchor="middle" fontSize="10" fill="var(--text2)">전체 설비</text>
    </svg>
  );
}

function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [message]);
  if (!message) return null;
  return (
    <div className="toast"><i className="ph-fill ph-check-circle"></i>{message}</div>
  );
}

          <div className="panel">
            <h3 className="panel-title" style={{marginBottom:12}}>설비 선택</h3>
            <div className="device-pick-list">
              {DEVICES.map(d => (
                <button key={d.id} className={"device-pick-item" + (selectedId===d.id?' active':'')} onClick={() => setSelectedId(d.id)}>
                  <span className={"status-dot " + d.status}></span>{d.name}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="control-card">
              <h3 className="panel-title">{device.name} · {device.loc}</h3>
              <p className="panel-sub">현재 상태: <span className={"badge " + device.status}>{STATUS_LABEL[device.status]}</span></p>

              <div className="control-toggle-row">
                <button className={"toggle-btn " + (isOn ? 'on':'off')} onClick={() => togglePower(true)} disabled={isOn}>
                  <i className="ph-fill ph-power"></i>송전 시작
                </button>
                <button className={"toggle-btn " + (!isOn ? 'on':'off')} onClick={() => togglePower(false)} disabled={!isOn}>
                  <i className="ph ph-power"></i>송전 정지
                </button>
              </div>
              {role !== 'admin' && <div className="permission-note"><i className="ph ph-lock-simple"></i>일반 사용자는 제어 명령을 실행할 수 없습니다 (조회 전용)</div>}

              <div className="slider-row">
                <div className="slider-label-row"><span>출력 레벨 설정</span><span>{outputLevel}%</span></div>
                <input type="range" min="0" max="100" value={outputLevel} onChange={e => { setOutputLevel(Number(e.target.value)); setError(''); }} disabled={role !== 'admin'} />
                {error && <div className="field-error"><i className="ph ph-warning"></i>{error}</div>}
              </div>
              <div style={{display:'flex', gap:10}}>
                <button className="btn-primary" onClick={applyOutput}><i className="ph ph-check"></i>출력 레벨 적용</button>
                <button className="btn-secondary" onClick={() => setConfirmReset(true)} disabled={role !== 'admin'}><i className="ph ph-arrow-counter-clockwise"></i>원격 리셋</button>
              </div>
            </div>

            <div className="data-section">
              <h3 className="panel-title">제어 명령 이력</h3>
              <nav className="tab-bar" data-tabs>
                {['전체','성공','거부'].map(t => (
                  <button key={t} className={"tab" + (resultFilter===t?' active':'')} onClick={() => setResultFilter(t)}>{t}</button>
                ))}
              </nav>
              <div className="data-table-wrap">
                <table className="data-table">
                  <thead><tr><th>시각</th><th>요청자</th><th>설비</th><th>명령</th><th>결과</th></tr></thead>
                  <tbody>
                    {filteredHistory.map(h => (
                      <tr key={h.id}>
                        <td>{h.time}</td><td>{h.user}</td><td>{h.device}</td><td>{h.cmd}</td>
                        <td><span className={"badge " + (h.result==='성공'?'ok':'danger')}>{h.result}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>

      {confirmReset && (
        <Modal title="원격 리셋 확인" onClose={() => setConfirmReset(false)}
          actions={<>
            <button className="btn-secondary" onClick={() => setConfirmReset(false)}>취소</button>
            <button className="btn-danger" onClick={doReset}>리셋 실행</button>
          </>}>
          <p style={{fontSize:14, color:'var(--text2)'}}>{device.name} 설비를 원격으로 리셋합니다. 진행 중인 송전이 일시 중단될 수 있습니다. 계속하시겠습니까?</p>
        </Modal>
      )}
    </div>
  );
}

/* ───────────── Device Detail ───────────── */
function DeviceDetailScreen({ role, setRole, showToast }) {
  const [selectedId, setSelectedId] = useState('d01');
  const [range, setRange] = useState('일');
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const device = DEVICES.find(d => d.id === selectedId);
  const efficiency = device.tx ? Math.round(device.rx/device.tx*100) : 0;

  const seriesFor = (r) => {
    const base = { '일':[62,68,71,75,79,82,84,80], '주':[70,73,76,74,78,81,85], '월':[68,70,74,77,79,81,83,85,84,86] }[r];
    return base;
  };
  const labelsFor = (r) => {
    if (r==='일') return ['00시','03시','06시','09시','12시','15시','18시','21시'];
    if (r==='주') return ['월','화','수','목','금','토','일'];
    return Array.from({length:10}, (_,i) => (i+1)+'일');
  };

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type:'line',
      data:{
        labels: labelsFor(range),
        datasets:[{ label:'전송 효율(%)', data: seriesFor(range), borderColor:'#fa5d00', backgroundColor:'rgba(250,93,0,0.12)', fill:true, tension:0.35, pointRadius:3 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:false, grid:{ color:'#f1ece4' } }, x:{ grid:{ display:false } } }
      }
    });
  }, [range, selectedId]);

  return (
    <div>
      <Header title="장치 상세" sub="개별 설비 수치 · 전송 효율 · 시계열 이력" role={role} setRole={setRole} onRefresh={() => showToast('장치 데이터가 갱신되었습니다')} />
      <main className="content">
        <section className="detail-layout">
          <div className="panel">
            <h3 className="panel-title" style={{marginBottom:12}}>설비 선택</h3>
            <div className="device-pick-list">
              {DEVICES.map(d => (
                <button key={d.id} className={"device-pick-item" + (selectedId===d.id?' active':'')} onClick={() => setSelectedId(d.id)}>
                  <span className={"status-dot " + d.status}></span>{d.name}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="control-card">
              <h3 className="panel-title">{device.name} · {device.loc}</h3>
              <div className="metric-grid">
                <div className="metric-card"><div className="l">송신 전력</div><div className="v">{device.tx}W</div></div>
                <div className="metric-card"><div className="l">수신 전력</div><div className="v">{device.rx}W</div></div>
                <div className="metric-card"><div className="l">온도</div><div className="v">{device.temp}℃</div></div>
                <div className="metric-card"><div className="l">배터리</div><div className="v">{device.battery}%</div></div>
              </div>
              <div className="efficiency-ring-wrap">
                <Donut segments={[{ value: efficiency, color:'var(--accent)' }, { value: 100-efficiency, color:'#eee5d8' }]} />
                <div>
                  <div style={{fontSize:13, color:'var(--text2)', fontWeight:600}}>전송 효율</div>
                  <div style={{fontSize:28, fontWeight:700}}>{efficiency}%</div>
                  <div style={{fontSize:12, color:'var(--text2)'}}>통신 상태: {device.comm}</div>
                </div>
              </div>
            </div>
            <div className="control-card">
              <div className="chart-toggle-row">
                {['일','주','월'].map(r => (
                  <button key={r} className={"filter-chip" + (range===r?' active':'')} onClick={() => setRange(r)}>{r} 단위</button>
                ))}
              </div>
              <div className="chart-wrap"><canvas ref={canvasRef}></canvas></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  );
}

/* ───────────── Alarm Screen ───────────── */
function AlarmScreen({ role, setRole, showToast }) {
  const [alarms, setAlarms] = useState(ALARMS_INIT);
  const [filter, setFilter] = useState('전체');
  const [detail, setDetail] = useState(null);
  const [thresholds, setThresholds] = useState({ overheat:65, overcurrent:5.0, lowEff:70, commTimeout:5 });
  const [savedFlash, setSavedFlash] = useState(false);

  function saveThresholds() {
    if (thresholds.overheat < 40 || thresholds.overheat > 90) { showToast('과온 임계치는 40~90℃ 범위여야 합니다'); return; }
    setSavedFlash(true);
    showToast('임계치가 저장되었습니다');
    setTimeout(() => setSavedFlash(false), 900);
  }

  function updateStatus(id, status) {
    setAlarms(a => a.map(x => x.id === id ? { ...x, status } : x));
    setDetail(d => d ? { ...d, status } : d);
    showToast('알람 상태가 "' + status + '"(으)로 변경되었습니다');
  }

  const filtered = filter === '전체' ? alarms : alarms.filter(a => a.status === filter);

  return (
    <div>
      <Header title="알람 관리" sub="이상 감지 임계치 · 알람 이력" role={role} setRole={setRole} onRefresh={() => showToast('알람 목록이 갱신되었습니다')} />
      <main className="content">
        <section className="control-card">
          <h3 className="panel-title"><i className="ph ph-sliders-horizontal" style={{color:'var(--primary)'}}></i>임계치 설정</h3>
          <p className="panel-sub">{role==='admin' ? '설비 전역에 적용되는 이상 감지 기준입니다.' : '조회 전용입니다. 변경은 관리자 권한이 필요합니다.'}</p>
          <div className="threshold-grid">
            <div className="threshold-field"><label>과온 임계치 (℃)</label><input type="number" value={thresholds.overheat} disabled={role!=='admin'} onChange={e => setThresholds(t => ({...t, overheat:Number(e.target.value)}))} /></div>
            <div className="threshold-field"><label>과전류 임계치 (A)</label><input type="number" step="0.1" value={thresholds.overcurrent} disabled={role!=='admin'} onChange={e => setThresholds(t => ({...t, overcurrent:Number(e.target.value)}))} /></div>
            <div className="threshold-field"><label>저효율 임계치 (%)</label><input type="number" value={thresholds.lowEff} disabled={role!=='admin'} onChange={e => setThresholds(t => ({...t, lowEff:Number(e.target.value)}))} /></div>
            <div className="threshold-field"><label>통신 단절 타임아웃 (분)</label><input type="number" value={thresholds.commTimeout} disabled={role!=='admin'} onChange={e => setThresholds(t => ({...t, commTimeout:Number(e.target.value)}))} /></div>
          </div>
          <button className="btn-primary" style={{marginTop:14}} onClick={saveThresholds} disabled={role!=='admin'}>
            <i className={"ph " + (savedFlash ? 'ph-check':'ph-floppy-disk')}></i>임계치 저장
          </button>
        </section>

        <section className="data-section" style={{marginTop:16}}>
          <h3 className="panel-title">알람 이력</h3>
          <nav className="tab-bar" data-tabs>
            {['전체','미확인','확인','해제'].map(t => (
              <button key={t} className={"tab" + (filter===t?' active':'')} onClick={() => setFilter(t)}>{t}</button>
            ))}
          </nav>
          {filtered.map(a => (
            <div key={a.id} className="alarm-row" onClick={() => setDetail(a)}>
              <div className="alarm-icon" style={{ background: a.level==='긴급' ? '#fbe2df' : '#fbecd2', color: a.level==='긴급' ? 'var(--danger)' : 'var(--warn)' }}>
                <i className="ph-fill ph-warning"></i>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:13.5}}>{a.device} · {a.type}</div>
                <div style={{fontSize:12, color:'var(--text2)'}}>{a.value} · {a.time}</div>
              </div>
              <span className={"badge " + (a.status==='미확인'?'danger':a.status==='확인'?'warn':'offline')}>{a.status}</span>
            </div>
          ))}
        </section>
      </main>

      {detail && (
        <Modal title="알람 상세" onClose={() => setDetail(null)}>
          <div style={{fontSize:13.5, lineHeight:1.9}}>
            <div><b>설비</b> — {detail.device}</div>
            <div><b>유형</b> — {detail.type}</div>
            <div><b>측정값</b> — {detail.value}</div>
            <div><b>발생 시각</b> — {detail.time}</div>
            <div><b>심각도</b> — {detail.level}</div>
            <div><b>현재 상태</b> — <span className={"badge " + (detail.status==='미확인'?'danger':detail.status==='확인'?'warn':'offline')}>{detail.status}</span></div>
          </div>
          <div className="modal-actions">
            <button className="btn-secondary" onClick={() => updateStatus(detail.id, '확인')}>확인 처리</button>
            <button className="btn-primary" onClick={() => updateStatus(detail.id, '해제')}>해제 처리</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────────── System Management ───────────── */
function SystemManagementScreen({ role, setRole, showToast }) {
  const [tab, setTab] = useState('설비');
  const [devices, setDevices] = useState(SYS_DEVICES_INIT);
  const [users, setUsers] = useState(USERS_INIT);
  const [formOpen, setFormOpen] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [userModal, setUserModal] = useState(false);
  const [matchTx, setMatchTx] = useState('');
  const [matchRx, setMatchRx] = useState('');
  const [matches, setMatches] = useState([{ tx:'무선전송 유닛 01', rx:'무선전송 유닛 02' }]);
  const [form, setForm] = useState({ name:'', loc:'', type:'송신부', alias:'' });

  function openAdd() { setEditTarget(null); setForm({ name:'', loc:'', type:'송신부', alias:'' }); setFormOpen(true); }
  function openEdit(d) { setEditTarget(d); setForm({ name:d.name, loc:d.loc, type:d.type, alias:d.alias }); setFormOpen(true); }

  function saveDevice() {
    if (!form.name || !form.loc) { showToast('설비명과 위치는 필수 입력입니다'); return; }
    if (editTarget) {
      setDevices(ds => ds.map(d => d.id === editTarget.id ? { ...d, ...form } : d));
      showToast('설비 정보가 수정되었습니다');
    } else {
      setDevices(ds => [{ id:'nd'+Date.now(), ...form }, ...ds]);
      showToast('설비가 등록되었습니다');
    }
    setFormOpen(false);
  }

  function confirmDelete() {
    setDevices(ds => ds.filter(d => d.id !== deleteTarget.id));
    showToast('설비가 삭제되었습니다');
    setDeleteTarget(null);
  }

  function doMatch() {
    if (!matchTx || !matchRx) { showToast('송신부와 수신부를 모두 선택하세요'); return; }
    if (matches.some(m => m.tx===matchTx && m.rx===matchRx)) { showToast('이미 매칭된 조합입니다'); return; }
    setMatches(m => [...m, { tx:matchTx, rx:matchRx }]);
    showToast('매칭이 완료되었습니다');
    setMatchTx(''); setMatchRx('');
  }

  function addUser(email, roleVal) {
    setUsers(u => [...u, { id:'u'+Date.now(), name:'신규 사용자', email, role: roleVal }]);
    showToast('계정이 추가되었습니다');
    setUserModal(false);
  }

  function changeUserRole(id) {
    setUsers(u => u.map(x => x.id===id ? { ...x, role: x.role==='관리자'?'일반 사용자':'관리자' } : x));
    showToast('권한이 변경되었습니다');
  }

  function removeUser(id) {
    setUsers(u => u.filter(x => x.id !== id));
    showToast('계정이 삭제되었습니다');
  }

  return (
    <div>
      <Header title="시스템 관리" sub="설비 등록 · 송수신부 매칭 · 사용자 계정" role={role} setRole={setRole} onRefresh={() => showToast('시스템 정보가 갱신되었습니다')} />
      <main className="content">
        <nav className="tab-bar sm-tabs" data-tabs>
          {['설비','매칭','계정'].map(t => (
            <button key={t} className={"tab" + (tab===t?' active':'')} onClick={() => setTab(t)}>{t}</button>
          ))}
        </nav>

        {tab==='설비' && (
          <section className="data-section">
            <div className="data-toolbar">
              <div style={{fontWeight:700}}>등록된 설비 {devices.length}건</div>
              <button className="btn-primary" style={{marginLeft:'auto'}} onClick={openAdd}><i className="ph ph-plus"></i>설비 등록</button>
            </div>
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th>설비명</th><th>위치</th><th>유형</th><th>별칭</th><th></th></tr></thead>
                <tbody>
                  {devices.map(d => (
                    <tr key={d.id}>
                      <td>{d.name}</td><td>{d.loc}</td><td>{d.type}</td><td>{d.alias || '-'}</td>
                      <td style={{display:'flex', gap:6}}>
                        <button className="icon-btn" onClick={() => openEdit(d)}><i className="ph ph-pencil-simple"></i></button>
                        <button className="icon-btn danger" onClick={() => setDeleteTarget(d)}><i className="ph ph-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}

        {tab==='매칭' && (
          <section className="panel">
            <h3 className="panel-title">송수신부 매칭</h3>
            <div style={{display:'flex', gap:12, alignItems:'center', margin:'14px 0'}}>
              <select className="filter-chip" style={{padding:'9px 14px'}} value={matchTx} onChange={e => setMatchTx(e.target.value)}>
                <option value="">송신부 선택</option>
                {devices.filter(d=>d.type==='송신부').map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
              </select>
              <i className="ph ph-arrow-right"></i>
              <select className="filter-chip" style={{padding:'9px 14px'}} value={matchRx} onChange={e => setMatchRx(e.target.value)}>
                <option value="">수신부 선택</option>
                {devices.filter(d=>d.type==='수신부').map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
              </select>
              <button className="btn-primary" onClick={doMatch}><i className="ph ph-link-simple"></i>매칭</button>
            </div>
            {matches.map((m,i) => (
              <div key={i} className="match-row"><i className="ph ph-link-simple" style={{color:'var(--primary)'}}></i>{m.tx} <i className="ph ph-arrow-right"></i> {m.rx}</div>
            ))}
          </section>
        )}

        {tab==='계정' && (
          <section className="data-section">
            <div className="data-toolbar">
              <div style={{fontWeight:700}}>사용자 계정 {users.length}명</div>
              <button className="btn-primary" style={{marginLeft:'auto'}} onClick={() => setUserModal(true)}><i className="ph ph-user-plus"></i>계정 추가</button>
            </div>
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th>이름</th><th>이메일</th><th>권한</th><th></th></tr></thead>
                <tbody>
                  {users.map(u => (
                    <tr key={u.id}>
                      <td>{u.name}</td><td>{u.email}</td>
                      <td><span className={"badge " + (u.role==='관리자'?'ok':'warn')}>{u.role}</span></td>
                      <td style={{display:'flex', gap:6}}>
                        <button className="icon-btn" onClick={() => changeUserRole(u.id)}><i className="ph ph-arrows-clockwise"></i></button>
                        <button className="icon-btn danger" onClick={() => removeUser(u.id)}><i className="ph ph-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}
      </main>

      {formOpen && (
        <Drawer title={editTarget ? '설비 정보 수정' : '신규 설비 등록'} onClose={() => setFormOpen(false)}>
          <div className="form-grid">
            <div className="form-field"><label>설비명</label><input value={form.name} onChange={e => setForm(f=>({...f, name:e.target.value}))} /></div>
            <div className="form-field"><label>위치</label><input value={form.loc} onChange={e => setForm(f=>({...f, loc:e.target.value}))} /></div>
            <div className="form-field"><label>유형</label>
              <select value={form.type} onChange={e => setForm(f=>({...f, type:e.target.value}))}>
                <option>송신부</option><option>수신부</option>
              </select>
            </div>
            <div className="form-field"><label>별칭</label><input value={form.alias} onChange={e => setForm(f=>({...f, alias:e.target.value}))} /></div>
          </div>
          <div className="modal-actions">
            <button className="btn-secondary" onClick={() => setFormOpen(false)}>취소</button>
            <button className="btn-primary" onClick={saveDevice}>저장</button>
          </div>
        </Drawer>
      )}

      {deleteTarget && (
        <Modal title="설비 삭제" onClose={() => setDeleteTarget(null)}
          actions={<>
            <button className="btn-secondary" onClick={() => setDeleteTarget(null)}>취소</button>
            <button className="btn-danger" onClick={confirmDelete}>삭제</button>
          </>}>
          <p style={{fontSize:14, color:'var(--text2)'}}>{deleteTarget.name} 설비를 목록에서 삭제합니다. 계속하시겠습니까?</p>
        </Modal>
      )}

      {userModal && (
        <UserAddModal onClose={() => setUserModal(false)} onAdd={addUser} />
      )}
    </div>
  );
}

function UserAddModal({ onClose, onAdd }) {
  const [email, setEmail] = useState('');
  const [roleVal, setRoleVal] = useState('일반 사용자');
  return (
    <Modal title="계정 추가" onClose={onClose}
      actions={<>
        <button className="btn-secondary" onClick={onClose}>취소</button>
        <button className="btn-primary" onClick={() => email ? onAdd(email, roleVal) : null}>추가</button>
      </>}>
      <div className="form-field" style={{marginBottom:12}}><label>이메일</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@site.io" /></div>
      <div className="form-field">
        <label>권한</label>
        <select value={roleVal} onChange={e=>setRoleVal(e.target.value)}>
          <option>일반 사용자</option><option>관리자</option>
        </select>
      </div>
    </Modal>
  );
}

/* ───────────── App root ───────────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [role, setRole] = useState('admin');
  const [toast, setToast] = useState('');
  const [deviceModal, setDeviceModal] = useState(null);

  function showToast(msg) { setToast(msg); }

  const screens = {
    'main': <MainScreen role={role} setRole={setRole} showToast={showToast} openDeviceModal={setDeviceModal} />,
    'control': <ControlScreen role={role} setRole={setRole} showToast={showToast} />,
    'device-detail': <DeviceDetailScreen role={role} setRole={setRole} showToast={showToast} />,
    'alarm': <AlarmScreen role={role} setRole={setRole} showToast={showToast} />,
    'system-management': <SystemManagementScreen role={role} setRole={setRole} showToast={showToast} />,
  };

  return (
    <div className="app-shell" data-archetype="stripe-multipane" style={{width:'100%'}}>
      <Sidebar screen={screen} setScreen={setScreen} />
      <div className="main-wrap">
        {screens[screen]}
      </div>
      <Toast message={toast} onClose={() => setToast('')} />
      {deviceModal && (
        <Modal title={deviceModal.name + ' 스냅샷'} onClose={() => setDeviceModal(null)}
          actions={<button className="btn-primary" onClick={() => setDeviceModal(null)}>닫기</button>}>
          <div style={{fontSize:13.5, lineHeight:1.9}}>
            <div><b>위치</b> — {deviceModal.loc}</div>
            <div><b>상태</b> — <span className={"badge " + deviceModal.status}>{STATUS_LABEL[deviceModal.status]}</span></div>
            <div><b>송신 전력</b> — {deviceModal.tx}W</div>
            <div><b>수신 전력</b> — {deviceModal.rx}W</div>
            <div><b>온도</b> — {deviceModal.temp}℃</div>
            <div><b>배터리</b> — {deviceModal.battery}%</div>
            <div><b>통신 상태</b> — {deviceModal.comm}</div>
            <div><b>최근 갱신</b> — {deviceModal.updated}</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
