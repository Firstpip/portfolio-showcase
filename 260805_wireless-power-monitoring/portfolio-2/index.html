<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 설비군 무선 전력전송 통합 관제 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  :root{
    --primary:#5683da; --primary-dark:#3f66bd; --secondary:#d1d1d1; --accent:#ff8964;
    --bg:#f8f9fc; --surface:#ffffff; --panel:#e5e5e7; --text:#090a0c; --text2:#95979e;
    --ok:#2f9e5b; --warn:#c9820f; --danger:#e0483e; --idle:#9a9ea8;
    --radius-card:12px; --radius-btn:9999px; --radius-input:4px; --radius-panel:30px;
    --shadow-sm: 0 4px 6px rgba(0,0,0,0.10);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.16);
    --shadow-xl: 0 6px 25px rgba(9,10,12,0.14);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
  #root{width:100%;}
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--secondary); border-radius:8px; }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pillPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(86,131,218,0.35);} 50%{box-shadow:0 0 0 6px rgba(86,131,218,0);} }
  @keyframes dashFlow{ from{stroke-dashoffset:24;} to{stroke-dashoffset:0;} }
  @keyframes riseIn{ from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toastSlide{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }
  @keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }

  .app-root{ width:100%; min-height:100vh; display:flex; flex-direction:column; }

  /* ── aurora beam (single, once) ── */
  .aurora-beam{ position:absolute; top:0; left:50%; width:340px; height:220px; transform:translateX(-50%);
    background:linear-gradient(180deg, rgba(86,131,218,0.28), rgba(255,137,100,0.22), transparent);
    filter:blur(30px); pointer-events:none; z-index:0; }

  /* ── header ── */
  .app-header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--secondary); display:flex; align-items:center; gap:20px; padding:0 28px; height:60px; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-0.02em; }
  .brand-mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; }
  .project-switcher{ position:relative; }
  .project-switcher-btn{ display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius-btn); border:1px solid var(--secondary); background:var(--surface); font-size:12.5px; font-weight:600; }
  .project-dropdown{ position:absolute; top:110%; left:0; background:var(--surface); border:1px solid var(--secondary); border-radius:14px; box-shadow:var(--shadow-md); width:220px; padding:6px; z-index:60; animation:fadeInUp .15s ease; }
  .project-dropdown button{ width:100%; text-align:left; padding:9px 12px; border:none; background:none; border-radius:9px; font-size:12.5px; }
  .project-dropdown button:hover{ background:var(--bg); }
  .global-nav{ display:flex; gap:4px; flex:1; }
  .nav-link{ border:none; background:none; padding:8px 14px; border-radius:var(--radius-btn); font-size:13px; font-weight:600; color:var(--text2); }
  .nav-link:hover{ background:var(--bg); color:var(--text); }
  .nav-link.active{ background:var(--text); color:#fff; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .icon-pill-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--secondary); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text2); position:relative; }
  .icon-pill-btn:hover{ background:var(--bg); }
  .notif-dot{ position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pillPulse 2s ease-in-out infinite; }
  .avatar-chip{ width:32px; height:32px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .role-pill-switch{ display:flex; background:var(--bg); border:1px solid var(--secondary); border-radius:var(--radius-btn); padding:3px; }
  .role-pill-switch button{ border:none; background:none; padding:6px 12px; border-radius:var(--radius-btn); font-size:11.5px; font-weight:700; color:var(--text2); }
  .role-pill-switch button.active{ background:var(--primary); color:#fff; }

  /* ── content ── */
  main.content{ max-width:1280px; margin:0 auto; padding:26px 28px 56px; width:100%; position:relative; z-index:1; }
  .content-header{ margin-bottom:18px; }
  .content-title{ font-size:44px; font-weight:800; letter-spacing:-0.03em; margin:0 0 4px; }
  .content-sub{ font-size:13px; color:var(--text2); }

  /* ── sub tab bar ── */
  .tab-bar{ display:flex; gap:6px; margin-bottom:20px; background:var(--panel); padding:4px; border-radius:var(--radius-btn); width:fit-content; }
  .tab{ border:none; background:none; padding:8px 16px; border-radius:var(--radius-btn); font-size:12.5px; font-weight:700; color:var(--text2); }
  .tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

  /* ── stat row ── */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow-sm); animation:fadeInUp .4s ease both; transition:transform .16s ease, box-shadow .16s ease; }
  .stat-card:hover{ transform:scale(1.025); box-shadow:var(--shadow-md); }
  .queue-row:hover{ transform:scale(1.012); }
  .stat-label{ font-size:11.5px; color:var(--text2); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
  .stat-value{ font-size:32px; font-weight:800; letter-spacing:-0.02em; margin:6px 0 4px; }
  .stat-delta{ font-size:12px; font-weight:600; }
  .stat-delta.positive{ color:var(--ok); }
  .stat-delta.negative{ color:var(--danger); }

  /* ── split monitor ── */
  .split-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:18px; }
  .panel{ background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow-sm); }
  .panel-title{ font-size:15.5px; font-weight:800; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel-sub{ font-size:12px; color:var(--text2); margin:0 0 14px; }
  .chart-wrap{ position:relative; height:280px; width:100%; }

  .feed-list{ display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; }
  .feed-item{ display:flex; gap:10px; padding:11px 12px; border-radius:12px; background:var(--bg); cursor:pointer; }
  .feed-item:hover{ background:var(--panel); }
  .feed-dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .feed-body{ flex:1; min-width:0; }
  .feed-title{ font-size:12.5px; font-weight:700; }
  .feed-meta{ font-size:11px; color:var(--text2); }

  /* ── bottom list (table) ── */
  .data-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .search-input{ flex:1; min-width:200px; padding:9px 14px; border:1px solid var(--secondary); border-radius:var(--radius-input); font-size:13px; background:var(--bg); }
  .filter-chip{ padding:7px 14px; border-radius:var(--radius-btn); border:1px solid var(--secondary); background:var(--surface); font-size:12px; font-weight:700; color:var(--text2); }
  .filter-chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .export-btn{ margin-left:auto; padding:9px 16px; border-radius:var(--radius-btn); background:var(--text); border:none; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; }
  table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .data-table thead th{ text-align:left; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.04em; padding:9px 10px; border-bottom:1px solid var(--secondary); }
  .data-table tbody tr{ cursor:pointer; transition:background .12s; }
  .data-table tbody tr:hover{ background:var(--bg); }
  .data-table td{ padding:13px 10px; border-bottom:1px solid #eef0f4; }
  .badge{ display:inline-block; padding:4px 12px; border-radius:var(--radius-btn); font-size:11px; font-weight:700; }
  .badge.ok{ background:#e2f3e7; color:var(--ok); }
  .badge.warn{ background:#fbecd2; color:var(--warn); }
  .badge.danger{ background:#fbe2df; color:var(--danger); }
  .badge.idle{ background:#eceef2; color:var(--idle); }
  .badge.primary{ background:#e7edfb; color:var(--primary-dark); }

  /* ── buttons ── */
  .btn-primary{ padding:10px 20px; border-radius:var(--radius-btn); background:var(--primary); border:none; color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm); transition:transform .12s; }
  .btn-primary:hover{ transform:translateY(-1px); background:var(--primary-dark); }
  .btn-primary:disabled{ opacity:.4; transform:none; }
  .btn-secondary{ padding:10px 18px; border-radius:var(--radius-btn); background:var(--surface); border:1px solid var(--secondary); color:var(--text); font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .btn-secondary:hover{ background:var(--bg); }
  .btn-danger{ padding:10px 18px; border-radius:var(--radius-btn); background:var(--danger); border:none; color:#fff; font-size:13px; font-weight:700; }
  .icon-btn{ border:none; background:var(--bg); width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--text2); }
  .icon-btn:hover{ background:var(--panel); color:var(--text); }
  .icon-btn.danger:hover{ background:#fbe2df; color:var(--danger); }

  /* ── analytics ── */
  .analytics-toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .cache-tag{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text2); background:var(--panel); padding:6px 12px; border-radius:var(--radius-btn); }

  /* ── access control ── */
  .role-tier-row{ display:flex; gap:14px; margin-bottom:22px; }
  .role-tier{ flex:1; border-radius:var(--radius-card); border:1px solid var(--secondary); padding:18px; background:var(--surface); text-align:center; }
  .role-tier .tier-icon{ width:44px; height:44px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .perm-table td, .perm-table th{ text-align:center; }
  .perm-table td:first-child, .perm-table th:first-child{ text-align:left; }

  /* ── provisioning ── */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size:12px; font-weight:700; color:var(--text2); }
  .form-field input, .form-field select{ padding:10px 12px; border:1px solid var(--secondary); border-radius:var(--radius-input); font-size:13.5px; background:var(--bg); }
  .queue-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius-card); border:1px solid var(--secondary); background:var(--surface); margin-bottom:10px; }
  .progress-track{ flex:1; height:6px; border-radius:99px; background:var(--panel); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:99px; transition:width .4s ease; transform-origin:left center; animation:barGrow .5s ease-out; }
  .sync-ring{ width:14px; height:14px; flex-shrink:0; }
  .sync-ring circle{ animation:dashFlow 1.4s linear infinite; }

  /* ── notification center ── */
  .channel-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border:1px solid var(--secondary); border-radius:var(--radius-card); margin-bottom:10px; background:var(--surface); }
  .switch{ width:42px; height:24px; border-radius:99px; background:var(--secondary); position:relative; border:none; }
  .switch.on{ background:var(--primary); }
  .switch-knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s ease; }
  .switch.on .switch-knob{ transform:translateX(18px); }
  .notif-row{ display:flex; gap:12px; padding:13px 14px; border-radius:var(--radius-card); background:var(--bg); margin-bottom:8px; cursor:pointer; }
  .notif-row.unread{ background:#eef2fc; }

  /* ── modal / toast ── */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(9,10,12,0.42); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .18s ease; }
  .modal-box{ background:var(--surface); border-radius:var(--radius-panel); padding:30px; width:460px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow-xl); animation:riseIn .22s ease; }
  .modal-title{ font-size:19px; font-weight:800; margin:0 0 14px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .close-x{ border:none; background:var(--bg); width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--text2); position:absolute; top:20px; right:20px; }
  .toast{ position:fixed; top:22px; right:22px; background:var(--text); color:#fff; padding:13px 20px; border-radius:var(--radius-btn); font-size:13px; font-weight:700; z-index:200; animation:toastSlide .25s ease; box-shadow:var(--shadow-md); display:flex; align-items:center; gap:8px; }

  @media (max-width: 1080px){
    .split-grid, .stat-row, .role-tier-row, .form-grid{ grid-template-columns:1fr; }
    .global-nav{ display:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.15.0/umd/Recharts.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, Legend } = Recharts;

/* ───────────── mock data ───────────── */
const GROUPS = [
  { id:'g1', name:'1공장 A동', devices:6, uptime:99.2, eff:88, alarms:0, trend:[82,84,85,86,88,87,89] },
  { id:'g2', name:'1공장 B동', devices:6, uptime:97.4, eff:79, alarms:2, trend:[80,78,76,75,74,76,78] },
  { id:'g3', name:'2공장 조립동', devices:5, uptime:98.8, eff:85, alarms:0, trend:[81,82,83,85,86,85,87] },
  { id:'g4', name:'2공장 검사동', devices:4, uptime:99.5, eff:90, alarms:0, trend:[85,86,88,89,90,90,91] },
  { id:'g5', name:'3공장 포장동', devices:4, uptime:91.1, eff:63, alarms:3, trend:[70,66,62,58,55,60,63] },
  { id:'g6', name:'옥외 시험장 A', devices:3, uptime:99.0, eff:82, alarms:0, trend:[78,79,80,81,82,82,83] },
  { id:'g7', name:'옥외 시험장 B', devices:2, uptime:95.6, eff:75, alarms:1, trend:[74,73,72,74,75,74,76] },
];

const FEED = [
  { id:'f1', level:'danger', title:'3공장 포장동 · 효율 저하 감지', meta:'2분 전 · 유닛 15' },
  { id:'f2', level:'warn', title:'1공장 B동 · 온도 임계치 근접', meta:'6분 전 · 유닛 07' },
  { id:'f3', level:'ok', title:'2공장 검사동 · 펌웨어 배포 완료', meta:'11분 전 · v2.4.1' },
  { id:'f4', level:'warn', title:'옥외 시험장 B · 통신 지연 발생', meta:'18분 전 · 유닛 19' },
  { id:'f5', level:'ok', title:'1공장 A동 · 정기 점검 완료', meta:'32분 전' },
  { id:'f6', level:'danger', title:'3공장 포장동 · 알람 3건 누적', meta:'40분 전' },
];

const CHART_DATA = Array.from({length:8}, (_,i) => ({
  t: (i*3)+'시',
  '1공장': 80+Math.round(Math.sin(i/1.3)*6)+i,
  '2공장': 76+Math.round(Math.cos(i/1.6)*5)+i,
  '3공장': 65+Math.round(Math.sin(i/2)*8),
}));

const ANALYTICS_DATA = {
  '일': GROUPS.map(g => ({ name:g.name.slice(0,5), 효율:g.eff, 가동률:Math.round(g.uptime) })),
  '주': GROUPS.map(g => ({ name:g.name.slice(0,5), 효율:g.eff-3, 가동률:Math.round(g.uptime)-1 })),
  '월': GROUPS.map(g => ({ name:g.name.slice(0,5), 효율:g.eff-6, 가동률:Math.round(g.uptime)-2 })),
};

const AUDIT_LOG = [
  { id:'l1', user:'김도현', action:'임계치 변경', target:'3공장 포장동', time:'2026-08-05 10:12' },
  { id:'l2', user:'박서연', action:'송전 정지', target:'1공장 B동 유닛07', time:'2026-08-05 09:58' },
  { id:'l3', user:'이현우', action:'설비 등록', target:'옥외 시험장 B 유닛19', time:'2026-08-05 09:41' },
  { id:'l4', user:'김도현', action:'권한 변경', target:'최지안 → 운영자', time:'2026-08-05 09:20' },
  { id:'l5', user:'박서연', action:'출력 레벨 조정', target:'2공장 조립동 유닛11', time:'2026-08-05 08:55' },
  { id:'l6', user:'이현우', action:'펌웨어 배포', target:'2공장 검사동 4대', time:'2026-08-05 08:30' },
];

const QUEUE_INIT = [
  { id:'q1', target:'1공장 A동 6대', version:'v2.4.2', status:'진행', progress:64 },
  { id:'q2', target:'2공장 조립동 5대', version:'v2.4.2', status:'대기', progress:0 },
  { id:'q3', target:'2공장 검사동 4대', version:'v2.4.1', status:'성공', progress:100 },
  { id:'q4', target:'3공장 포장동 4대', version:'v2.4.1', status:'실패', progress:40 },
];

const NOTIFS_INIT = [
  { id:'n1', title:'3공장 포장동 효율 저하 알람', time:'2분 전', unread:true },
  { id:'n2', title:'펌웨어 배포 v2.4.2 진행 중', time:'20분 전', unread:true },
  { id:'n3', title:'권한 변경 승인 요청', time:'1시간 전', unread:false },
  { id:'n4', title:'주간 효율 리포트 생성 완료', time:'어제', unread:false },
];

/* ───────────── shared UI ───────────── */
function Toast({ message, onClose }) {
  useEffect(() => { if(!message) return; const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [message]);
  if (!message) return null;
  return <div className="toast"><i className="ti ti-circle-check"></i>{message}</div>;
}

function Modal({ title, onClose, children, actions }) {
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()} style={{position:'relative', borderRadius:30}}>
        <button className="close-x" onClick={onClose}><i className="ti ti-x"></i></button>
        <h3 className="modal-title">{title}</h3>
        {children}
        {actions && <div className="modal-actions">{actions}</div>}
      </div>
    </div>
  );
}

function Header({ screen, setScreen, role, setRole, projectOpen, setProjectOpen, project, setProject, onSearch }) {
  const navItems = [
    { id:'main', label:'통합 관제 허브' },
    { id:'analytics', label:'효율 분석' },
    { id:'access-control', label:'권한 관리' },
    { id:'provisioning', label:'설비 관리' },
    { id:'notification-center', label:'알림 센터' },
  ];
  return (
    <header className="app-header">

/* ───────────── Main Screen (split-monitor) ───────────── */
function MainScreen({ showToast, openGroupModal }) {
  const [tab, setTab] = useState('실시간 모니터');
  const [listFilter, setListFilter] = useState('전체');
  const [search, setSearch] = useState('');

  const totals = useMemo(() => {
    const devices = GROUPS.reduce((s,g) => s+g.devices, 0);
    const uptime = (GROUPS.reduce((s,g) => s+g.uptime, 0)/GROUPS.length).toFixed(1);
    const alarms = GROUPS.reduce((s,g) => s+g.alarms, 0);
    return { devices, uptime, alarms };
  }, []);

  const filteredGroups = useMemo(() => {
    let list = GROUPS;
    if (listFilter==='알람') list = list.filter(g => g.alarms>0);
    if (listFilter==='정상') list = list.filter(g => g.alarms===0);
    if (search) list = list.filter(g => g.name.includes(search));
    return list;
  }, [listFilter, search]);

  return (
    <main className="content">
      <div className="aurora-beam"></div>
      <div className="content-header">
        <h1 className="content-title">통합 관제 허브</h1>
        <p className="content-sub">전체 설비군을 하나의 콘솔에서 실시간으로 조망합니다.</p>
      </div>

      <nav className="tab-bar" data-tabs>
        {['개요','실시간 모니터','설비군 이력'].map(t => (
          <button key={t} className={"tab"+(tab===t?' active':'')} onClick={() => setTab(t)}>{t}</button>
        ))}
      </nav>

      <section className="stat-row" data-stat-row>
        <div className="stat-card"><div className="stat-label">설비군</div><div className="stat-value">{GROUPS.length}개</div><div className="stat-delta positive">총 {totals.devices}대 연동</div></div>
        <div className="stat-card"><div className="stat-label">평균 가동률</div><div className="stat-value">{totals.uptime}%</div><div className="stat-delta positive">+0.4%p</div></div>
        <div className="stat-card"><div className="stat-label">미해결 알람</div><div className="stat-value">{totals.alarms}건</div><div className="stat-delta negative">3공장 포장동 집중</div></div>
        <div className="stat-card"><div className="stat-label">오늘 배포 건수</div><div className="stat-value">4건</div><div className="stat-delta positive">성공 1 · 진행 1</div></div>
      </section>

      <section className="split-grid">
        <div className="panel">
          <h3 className="panel-title"><i className="ti ti-chart-line" style={{color:'var(--primary)'}}></i>실시간 효율 추이</h3>
          <p className="panel-sub">설비군별 시간대 효율을 동일 시간축에서 비교합니다.</p>
          <div className="chart-wrap">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={CHART_DATA}>
                <CartesianGrid strokeDasharray="3 3" stroke="#eef0f4" />
                <XAxis dataKey="t" tick={{fontSize:11}} />
                <YAxis tick={{fontSize:11}} />
                <Tooltip />
                <Legend wrapperStyle={{fontSize:11}} />
                <Line type="monotone" dataKey="1공장" stroke="#5683da" strokeWidth={2.5} dot={false} />
                <Line type="monotone" dataKey="2공장" stroke="#ff8964" strokeWidth={2.5} dot={false} />
                <Line type="monotone" dataKey="3공장" stroke="#c9820f" strokeWidth={2.5} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="panel">
          <h3 className="panel-title"><i className="ti ti-activity" style={{color:'var(--accent)'}}></i>실시간 이벤트 피드</h3>
          <p className="panel-sub">전역 알람과 배포 이벤트를 시간순으로 표시합니다.</p>
          <div className="feed-list">
            {FEED.map(f => (
              <div key={f.id} className="feed-item" onClick={() => showToast(f.title + ' 상세는 해당 메뉴에서 확인할 수 있습니다')}>
                <span className="feed-dot" style={{ background: f.level==='danger'?'var(--danger)':f.level==='warn'?'var(--warn)':'var(--ok)' }}></span>
                <div className="feed-body">
                  <div className="feed-title">{f.title}</div>
                  <div className="feed-meta">{f.meta}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="panel">
        <div className="data-toolbar">
          <h3 className="panel-title" style={{marginBottom:0}}><i className="ti ti-list-details" style={{color:'var(--primary)'}}></i>설비군 목록</h3>

            <button key={f} className={"filter-chip"+(listFilter===f?' active':'')} onClick={() => setListFilter(f)}>{f}</button>

          <thead><tr><th>설비군</th><th>연동 설비</th><th>가동률</th><th>효율</th><th>알람</th></tr></thead>
          <tbody>
            {filteredGroups.map(g => (
              <tr key={g.id} onClick={() => openGroupModal(g)}>
                <td>{g.name}</td><td>{g.devices}대</td><td>{g.uptime}%</td><td>{g.eff}%</td>

              </tr>
            ))}
          </tbody>
        </table>
      </section>
    </main>
  );
}

/* ───────────── Provisioning Screen ───────────── */
function ProvisioningScreen({ showToast }) {
  const [tab, setTab] = useState('설비 등록');
  const [queue, setQueue] = useState(QUEUE_INIT);
  const [form, setForm] = useState({ name:'', group:'1공장 A동', tx:'', rx:'' });

  function registerDevice() {
    if (!form.name || !form.tx || !form.rx) { showToast('설비명과 송수신부 매칭 정보를 모두 입력하세요'); return; }
    if (form.tx === form.rx) { showToast('송신부와 수신부는 다른 유닛이어야 합니다'); return; }
    showToast('설비가 등록되고 송수신부 매칭이 검증되었습니다');
    setForm({ name:'', group:'1공장 A동', tx:'', rx:'' });
  }

  function retry(id) {
    setQueue(q => q.map(item => item.id===id ? { ...item, status:'진행', progress:5 } : item));
    showToast('배포를 재시도 큐에 재등록했습니다');
  }

  return (
    <main className="content">
      <div className="content-header">
        <h1 className="content-title">설비 관리</h1>
        <p className="content-sub">신규 설비 등록과 원격 펌웨어 배포 큐를 관리합니다.</p>
      </div>
      <nav className="tab-bar" data-tabs>
        {['설비 등록','배포 큐'].map(t => (
          <button key={t} className={"tab"+(tab===t?' active':'')} onClick={() => setTab(t)}>{t}</button>
        ))}
      </nav>

      {tab==='설비 등록' && (
        <section className="panel">
          <h3 className="panel-title">신규 설비 등록</h3>
          <div className="form-grid">
            <div className="form-field"><label>설비명</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="예: 무선전송 유닛 21" /></div>
            <div className="form-field"><label>소속 설비군</label>
              <select value={form.group} onChange={e=>setForm(f=>({...f,group:e.target.value}))}>
                {GROUPS.map(g => <option key={g.id}>{g.name}</option>)}
              </select>
            </div>
            <div className="form-field"><label>송신부 유닛 ID</label><input value={form.tx} onChange={e=>setForm(f=>({...f,tx:e.target.value}))} placeholder="TX-021" /></div>
            <div className="form-field"><label>수신부 유닛 ID</label><input value={form.rx} onChange={e=>setForm(f=>({...f,rx:e.target.value}))} placeholder="RX-021" /></div>
          </div>
          <button className="btn-primary" style={{marginTop:16}} onClick={registerDevice}><i className="ti ti-plus"></i>등록 및 매칭 검증</button>
        </section>
      )}

      {tab==='배포 큐' && (
        <section className="panel">
          <h3 className="panel-title">펌웨어 배포 큐</h3>
          {queue.map(q => (
            <div key={q.id} className="queue-row">
              <div style={{width:180}}>
                <div style={{fontWeight:700, fontSize:13}}>{q.target}</div>
                <div style={{fontSize:11.5, color:'var(--text2)'}}>{q.version}</div>
              </div>
              <div className="progress-track"><div className="progress-fill" style={{width:q.progress+'%'}}></div></div>
              <span className={"badge "+(q.status==='성공'?'ok':q.status==='진행'?'primary':q.status==='실패'?'danger':'idle')}>{q.status}</span>
              {q.status==='실패' && <button className="icon-btn" onClick={() => retry(q.id)}><i className="ti ti-refresh"></i></button>}
            </div>
          ))}
        </section>
      )}
    </main>
  );
}

/* ───────────── Notification Center ───────────── */
function NotificationScreen({ showToast }) {
  const [tab, setTab] = useState('알림');
  const [notifs, setNotifs] = useState(NOTIFS_INIT);
  const [channels, setChannels] = useState({ email:true, sms:false, inapp:true });

  function markRead(id) {
    setNotifs(n => n.map(x => x.id===id ? { ...x, unread:false } : x));
  }
  function toggleChannel(key) {
    setChannels(c => ({ ...c, [key]: !c[key] }));
    showToast('알림 채널 설정이 변경되었습니다');
  }

  return (
    <main className="content">
      <div className="content-header">
        <h1 className="content-title">알림 센터</h1>
        <p className="content-sub">채널별 알림 발송 설정과 수신 알림을 관리합니다.</p>
      </div>
      <nav className="tab-bar" data-tabs>
        {['알림','채널 설정'].map(t => (
          <button key={t} className={"tab"+(tab===t?' active':'')} onClick={() => setTab(t)}>{t}</button>
        ))}
      </nav>

      {tab==='알림' && (
        <section className="panel">
          {notifs.map(n => (
            <div key={n.id} className={"notif-row"+(n.unread?' unread':'')} onClick={() => markRead(n.id)}>
              <i className="ti ti-bell-ringing" style={{color:n.unread?'var(--primary)':'var(--text2)'}}></i>
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:13}}>{n.title}</div>
                <div style={{fontSize:11.5, color:'var(--text2)'}}>{n.time}</div>
              </div>
              {n.unread && <span className="badge primary">신규</span>}
            </div>
          ))}
        </section>
      )}

      {tab==='채널 설정' && (
        <section className="panel">
          {[['email','이메일 알림','ti-mail'],['sms','SMS 알림','ti-device-mobile'],['inapp','인앱 알림','ti-bell']].map(([key,label,icon]) => (
            <div key={key} className="channel-row">
              <div style={{display:'flex', alignItems:'center', gap:10}}><i className={"ti "+icon}></i>{label}</div>
              <button className={"switch"+(channels[key]?' on':'')} onClick={() => toggleChannel(key)}><span className="switch-knob"></span></button>
            </div>
          ))}
        </section>
      )}
    </main>
  );
}

                <div className="feed-body"><div className="feed-title">{g.name}</div><div className="feed-meta">{g.devices}대 · 효율 {g.eff}%</div></div>
              </div>
            ))}
          </div>
        </Modal>
      )}
      {groupModal && (
        <Modal title={groupModal.name + ' 요약'} onClose={() => setGroupModal(null)}
          actions={<button className="btn-primary" onClick={() => setGroupModal(null)}>닫기</button>}>
          <div style={{fontSize:13.5, lineHeight:1.9}}>
            <div><b>연동 설비</b> — {groupModal.devices}대</div>
            <div><b>가동률</b> — {groupModal.uptime}%</div>
            <div><b>전송 효율</b> — {groupModal.eff}%</div>
            <div><b>미해결 알람</b> — {groupModal.alarms}건</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
