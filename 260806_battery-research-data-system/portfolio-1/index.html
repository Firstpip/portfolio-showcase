<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배터리 소재 LOT 데이터 통합관리 시스템 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --primary:#fa5d00;
  --primary-dark:#d94f00;
  --secondary:#c0bbb6;
  --accent:#1ef6da;
  --bg:#fff8f1;
  --surface:#ffffff;
  --text:#1d1e1c;
  --text2:#615f5c;
  --text3:#8e8b87;
  --border:#e3d6c5;
  --border-input:#c0bbb6;
  --glow:#fee3b5;
  --danger:#c94a2f;
  --danger-bg:#fbe6e0;
  --warn:#b8790f;
  --warn-bg:#fdf1dd;
  --ok:#1f9d7c;
  --ok-bg:#e2f7f0;
  --radius-card:20px;
  --radius-btn:16px;
  --shadow-sm:0px 1px 4px 0px rgba(0,0,0,0.08);
  --shadow-lg:6px 4px 24px 0px rgba(250,93,0,0.16);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--bg);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:0.005em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(31,157,124,.4)}50%{opacity:.65;box-shadow:0 0 0 5px rgba(31,157,124,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanSweep{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;overflow-y:auto;z-index:20;display:flex;flex-direction:column;}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;border-bottom:1px solid var(--border);margin-bottom:18px;position:relative;}
.sidebar-brand::after{content:'';position:absolute;left:-14px;right:-14px;bottom:-1px;height:3px;background:linear-gradient(90deg,transparent,var(--glow),transparent);}
.sidebar-brand-mark{width:36px;height:36px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;box-shadow:var(--shadow-lg);}
.sidebar-brand-name{font-size:15px;font-weight:700;letter-spacing:0.01em;}
.sidebar-brand-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.sidebar-section{margin-bottom:22px;}
.sidebar-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:0 8px;margin-bottom:9px;font-weight:700;}
.sidebar-link{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 11px;border-radius:12px;font-size:13.5px;color:var(--text);line-height:1.35;margin-bottom:3px;transition:background .15s,color .15s;}
.sidebar-link i{width:16px;height:16px;flex-shrink:0;color:var(--text3);}
.sidebar-link:hover{background:var(--glow);}
.sidebar-link.active{background:var(--primary);color:#fff;font-weight:600;}
.sidebar-link.active i{color:#fff;}
.sidebar-footer{margin-top:auto;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--border);font-size:11px;color:var(--text3);}
.sidebar-footer strong{color:var(--text);display:block;font-size:12px;margin-bottom:2px;}

/* main */
.main-wrap{margin-left:250px;flex:1;min-width:0;width:calc(100% - 250px);padding:30px 38px 90px;}
.view-fade{animation:fadeIn .32s ease both;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:4px;}
.page-title{font-size:40px;font-weight:700;letter-spacing:-0.015em;}
.page-desc{color:var(--text2);font-size:13.5px;margin-top:7px;max-width:640px;line-height:1.55;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}
.page-meta{font-size:12px;color:var(--text3);margin-top:11px;display:flex;align-items:center;gap:7px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulseDot 1.7s ease infinite;display:inline-block;}

.btn-primary{background:var(--primary);color:#fff;border-radius:var(--radius-btn);padding:11px 20px;font-size:13.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:opacity .15s,transform .1s;box-shadow:var(--shadow-sm);}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary i{width:15px;height:15px;}
.btn-ghost{background:transparent;border:1px solid var(--border-input);color:var(--text);border-radius:var(--radius-btn);padding:10px 18px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;transition:background .15s;}
.btn-ghost:hover{background:var(--glow);}
.btn-ghost i{width:14px;height:14px;}
.btn-sm{padding:6px 14px;font-size:12.5px;border-radius:9999px;background:var(--bg);color:var(--text);font-weight:600;border:1px solid var(--border);}
.btn-sm.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-sm.danger{color:var(--danger);}
.icon-btn{width:34px;height:34px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text2);flex-shrink:0;border:1px solid var(--border);}
.icon-btn:hover{background:var(--glow);}
.icon-btn i{width:16px;height:16px;}

.stat-row{display:flex;gap:14px;margin:22px 0 22px;}
.stat-card{flex:1;background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;min-height:96px;box-shadow:var(--shadow-sm);animation:slideUp .35s ease both;transition:transform .18s ease;border:1px solid var(--border);}
.stat-card:hover{transform:translateY(-2px);}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.stat-value{font-size:29px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12px;color:var(--ok);font-weight:600;}
.stat-sub.down{color:var(--danger);}
.stat-sparkline{position:absolute;right:16px;bottom:16px;width:68px;height:26px;opacity:.85;}

.content-row{display:flex;gap:16px;align-items:flex-start;}
.content-main{flex:1;min-width:0;background:var(--surface);border-radius:var(--radius-card);padding:22px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.kpi-side{width:300px;flex-shrink:0;background:var(--surface);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.rail-title{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.rail-title i{width:16px;height:16px;color:var(--danger);}
.rail-sub{font-size:11.5px;color:var(--text3);margin-bottom:14px;}
.rail-item{border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:9px;transition:background .15s,transform .15s;cursor:pointer;}
.rail-item:hover{background:var(--bg);transform:translateX(2px);}
.rail-item-name{font-size:12.5px;font-weight:700;margin-bottom:3px;}
.rail-item-reason{font-size:11.5px;color:var(--danger);margin-bottom:8px;}
.rail-item-foot{display:flex;justify-content:space-between;align-items:center;}
.rail-item-count{font-size:11px;color:var(--text3);}

.tab-bar{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 2px;font-size:13.5px;color:var(--text3);border-bottom:2px solid transparent;transition:.2s;font-weight:500;white-space:nowrap;}
.tab.active{color:var(--text);border-color:var(--primary);font-weight:700;}

.data-toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:9px 13px;flex:1;min-width:200px;max-width:320px;border:1px solid var(--border);}
.search-box i{width:15px;height:15px;color:var(--text3);}
.search-box input{background:none;border:none;outline:none;font-size:13px;width:100%;color:var(--text);}
.filter-chip{padding:7px 14px;border-radius:9999px;font-size:12.5px;background:var(--bg);color:var(--text2);border:1px solid var(--border);font-weight:500;}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.export-btn{margin-left:auto;}

.data-table-wrap{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--border);}
.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;background:var(--bg);}
.data-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--bg);color:var(--text);}
.data-table tr.tbl-row{cursor:pointer;transition:background .12s;}
.data-table tr.tbl-row:hover{background:var(--bg);}
.data-table tr:last-child td{border-bottom:none;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
.badge-made{background:var(--bg);color:var(--text2);}
.badge-testing{background:#e5eefc;color:#2f6fd1;}
.badge-done{background:var(--ok-bg);color:var(--ok);}
.badge-discard{background:#f1eeeb;color:var(--text3);}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.badge-wait{background:var(--warn-bg);color:var(--warn);}
.badge-error{background:var(--danger-bg);color:var(--danger);}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
.widget-card{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);animation:slideUp .35s ease both;border:1px solid var(--border);}
.widget-title{font-size:12.5px;font-weight:700;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:6px;}
.widget-title i{width:14px;height:14px;color:var(--text2);}
.widget-chart{height:140px;position:relative;}
.timeline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg);font-size:12px;}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}
.timeline-text{color:var(--text);flex:1;}
.timeline-time{color:var(--text3);font-size:11px;white-space:nowrap;}

.section-block{margin-top:26px;}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section-title{font-size:17px;font-weight:700;}

/* collector view */
.device-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.device-card{background:var(--surface);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-sm);border:1px solid var(--border);animation:slideUp .3s ease both;position:relative;overflow:hidden;}
.device-card.err{border-color:var(--danger);}
.device-card.warn2{border-color:var(--warn);}
.device-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.device-name{font-size:13.5px;font-weight:700;}
.device-code{font-size:11px;color:var(--text3);margin-top:2px;}
.device-status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.device-status-dot.ok{background:var(--ok);animation:pulseDot 1.7s ease infinite;}
.device-status-dot.warn2{background:var(--warn);}
.device-status-dot.err{background:var(--danger);}
.device-meta{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6;}
.device-scan{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.5;width:40%;animation:scanSweep 2.4s linear infinite;}
.log-stream{max-height:280px;overflow-y:auto;}

/* parsing view */
.error-reason{font-size:11.5px;color:var(--danger);}

/* lineage view */
.lineage-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.lot-check-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.lot-check{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9999px;border:1px solid var(--border);font-size:12.5px;font-weight:600;transition:.15s;}
.lot-check.on{background:var(--glow);border-color:var(--primary);}
.lot-swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.breadcrumb-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chain-node{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:2px;}
.chain-node span{font-size:10.5px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
.chain-arrow{color:var(--text3);width:15px;height:15px;flex-shrink:0;}
.scale-toggle{display:flex;background:var(--bg);border-radius:9999px;padding:3px;border:1px solid var(--border);}
.scale-toggle button{padding:6px 14px;border-radius:9999px;font-size:12px;font-weight:600;color:var(--text2);}
.scale-toggle button.active{background:var(--primary);color:#fff;}
.toggle{width:40px;height:22px;border-radius:9999px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--ok);}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{left:20px;}
.chart-wrap{position:relative;height:280px;width:100%;}

/* notes view */
.notes-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.notes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.note-card{background:var(--surface);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:transform .15s;animation:slideUp .3s ease both;}
.note-card:hover{transform:translateY(-2px);}
.note-lot{font-size:11px;color:var(--primary);font-weight:700;margin-bottom:6px;}
.note-title{font-size:14.5px;font-weight:700;margin-bottom:6px;}
.note-body{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:12px;}
.note-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.note-tag{font-size:10.5px;padding:3px 9px;border-radius:9999px;background:var(--bg);color:var(--text2);border:1px solid var(--border);}
.note-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
.modal-box{background:var(--surface);border-radius:20px;width:600px;max-width:100%;max-height:86vh;overflow-y:auto;padding:26px 28px;animation:fadeInScale .2s ease both;box-shadow:0 24px 60px rgba(29,30,28,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-title{font-size:19px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:9999px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close i{width:15px;height:15px;}
.modal-field-row{display:flex;gap:16px;margin-bottom:12px;}
.modal-field{flex:1;}
.modal-field-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.modal-field-value{font-size:13.5px;font-weight:500;}
.modal-input{padding:10px 13px;border-radius:12px;border:1px solid var(--border-input);font-size:13px;width:100%;color:var(--text);background:var(--bg);}
.modal-textarea{padding:10px 13px;border-radius:12px;border:1px solid var(--border-input);font-size:13px;width:100%;color:var(--text);background:var(--bg);min-height:90px;resize:vertical;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.toast i{width:15px;height:15px;color:var(--accent);}

@media (max-width: 980px){
  .content-row{flex-direction:column;}
  .kpi-side{width:100%;}
  .widget-grid{grid-template-columns:1fr;}
  .device-grid{grid-template-columns:1fr 1fr;}
  .notes-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {AreaChart, Area, LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid} = Recharts;

const NAV = [
  {group:'LOT 관리', items:[
    {key:'main', label:'LOT 채번 및 레시피 관리', icon:'layers'},
  ]},
  {group:'자동화', items:[
    {key:'collector', label:'무인 자동 수집 에이전트', icon:'radar'},
    {key:'parsing', label:'엑셀 파싱 및 무결성 검증', icon:'file-check-2'},
  ]},
  {group:'분석', items:[
    {key:'lineage', label:'계통도 성능 분석', icon:'git-branch'},
  ]},
  {group:'연구자산', items:[
    {key:'notes', label:'연구노트', icon:'notebook-pen'},
  ]},
];

const LOTS = [
  {id:'LOT-260801-A01', recipe:'NCM811-R3.2', equip:'CYC-03', status:'측정 진행 중', updated:'12분 전'},
  {id:'LOT-260801-A02', recipe:'LFP-R1.8', equip:'EIS-04', status:'테스트 완료', updated:'38분 전'},
  {id:'LOT-260731-B14', recipe:'실리콘음극-R2.0', equip:'TGA-05', status:'제작 완료', updated:'1시간 전'},
  {id:'LOT-260731-B15', recipe:'NCM811-R3.2', equip:'CYC-03', status:'테스트 완료', updated:'2시간 전'},
  {id:'LOT-260730-C02', recipe:'고니켈-R4.1', equip:'XRD-01', status:'폐기', updated:'6시간 전'},
  {id:'LOT-260730-C03', recipe:'LFP-R1.9', equip:'SEM-02', status:'측정 진행 중', updated:'7시간 전'},
  {id:'LOT-260729-D08', recipe:'실리콘음극-R2.1', equip:'DSC-06', status:'제작 완료', updated:'어제'},
  {id:'LOT-260729-D09', recipe:'NCM622-R2.5', equip:'PSA-07', status:'테스트 완료', updated:'어제'},
  {id:'LOT-260728-E01', recipe:'고니켈-R4.0', equip:'ECM-08', status:'측정 진행 중', updated:'2일 전'},
  {id:'LOT-260728-E02', recipe:'LFP-R1.8', equip:'KFT-09', status:'테스트 완료', updated:'2일 전'},
];

const STATUS_BADGE = {
  '제작 완료':'badge-made', '측정 진행 중':'badge-testing', '테스트 완료':'badge-done', '폐기':'badge-discard',
};

const PRIORITY_QUEUE = [
  {id:1, name:'EIS-04 임피던스 파일', reason:'헤더 규격 불일치 — 재처리 필요', count:3},
  {id:2, name:'XRD-01 회절 데이터', reason:'다중 시트 구조 파싱 실패', count:2},

function Sparkline({data, color}){
  const max = Math.max(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*68},${26 - (v/max)*22}`).join(' ');
  return (
    <svg className="stat-sparkline" viewBox="0 0 68 26" preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-wrap">

        <div className="toast" key={t.id}>
          <i data-lucide="check-circle-2"></i>
          <span>{t.text}</span>
        </div>
      ))}
    </div>
  );
}

          <div className="page-title">엑셀 파싱 및 무결성 검증</div>

        </div>
        <div className="page-actions">
          <button className="btn-ghost" onClick={()=>addToast('파싱 규칙 매핑 정의서를 내려받습니다')}><i data-lucide="file-down"></i> 매핑 정의서</button>
        </div>
      </div>

      <div className="stat-row">
        <div className="stat-card"><div className="stat-label">오늘 파싱 건</div><div className="stat-value">{rows.length}건</div><div className="stat-sub">전체 처리 대상</div><Sparkline data={[5,6,6,7,7,8,rows.length]} color="#fa5d00" /></div>
        <div className="stat-card"><div className="stat-label">성공률</div><div className="stat-value">{Math.round(rows.filter(r=>r.status==='ok').length/rows.length*100)}%</div><div className="stat-sub">실시간 갱신</div><Sparkline data={[70,74,78,80,82,84,86]} color="#1f9d7c" /></div>
        <div className="stat-card"><div className="stat-label">오류 건</div><div className="stat-value">{errCount}건</div><div className="stat-sub down">재처리 대기</div><Sparkline data={[4,3,3,2,2,2,errCount]} color="#c94a2f" /></div>
      </div>

      <div className="content-main">
        <div className="data-toolbar">
          {FILTERS.map(f => (
            <button key={f} className={"filter-chip" + (filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>
          ))}
          <button className="btn-ghost export-btn" onClick={()=>addToast('오류 로그를 CSV로 내보냅니다')}><i data-lucide="download"></i> 오류 로그 내보내기</button>
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>파일명</th><th>설비</th><th>업로드 시각</th><th>상태</th><th>사유</th><th></th></tr></thead>
            <tbody>
              {filtered.map(r => (
                <tr key={r.file}>
                  <td>{r.file}</td>
                  <td>{r.equip}</td>
                  <td>{r.time}</td>
                  <td><span className={"badge " + PARSE_BADGE[r.status]}>{PARSE_LABEL[r.status]}</span></td>
                  <td className="error-reason">{r.reason}</td>
                  <td>{r.status==='error' && <button className="btn-sm on" onClick={()=>reprocess(r.file)}>재처리</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function LineageView({addToast}){
  const [selected, setSelected] = useState(['LOT-260801-A01','LOT-260731-B15']);
  const [scale, setScale] = useState('linear');
  const [outlierFilter, setOutlierFilter] = useState(true);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const keyMap = {'LOT-260801-A01':'a01','LOT-260731-B15':'b15','LOT-260729-D09':'d09','LOT-260728-E02':'e02'};

  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">계통도 성능 분석</div>
          <div className="page-desc">LOT을 검색하면 설비-레시피-환경변수-측정결과를 하나의 계통도로 확인하고, 변수 변화에 따른 성능 추이를 다차원으로 필터링합니다.</div>
        </div>
        <div className="page-actions">
          <button className="btn-ghost" onClick={()=>addToast('현재 분석 결과를 PDF로 내보냅니다')}><i data-lucide="file-text"></i> PDF</button>
          <button className="btn-ghost" onClick={()=>addToast('현재 분석 결과를 Excel로 내보냅니다')}><i data-lucide="sheet"></i> Excel</button>
        </div>
      </div>

      <div className="section-block" style={{marginTop:20}}>
        <div className="breadcrumb-chain">
          <div className="chain-node"><span>설비</span>CYC-03</div>
          <i data-lucide="chevron-right" className="chain-arrow"></i>
          <div className="chain-node"><span>레시피</span>NCM811-R3.2</div>
          <i data-lucide="chevron-right" className="chain-arrow"></i>
          <div className="chain-node"><span>환경변수</span>25.4℃ · 1.02atm</div>
          <i data-lucide="chevron-right" className="chain-arrow"></i>
          <div className="chain-node"><span>측정결과</span>50사이클 용량유지율 86.2%</div>
        </div>
      </div>

      <div className="content-main">
        <div className="lineage-toolbar">
          <div className="scale-toggle">
            <button className={scale==='linear'?'active':''} onClick={()=>setScale('linear')}>Linear</button>
            <button className={scale==='log'?'active':''} onClick={()=>setScale('log')}>Log</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5,fontWeight:600}}>
            이상값 제외
            <div className={"toggle" + (outlierFilter?' on':'')} onClick={()=>setOutlierFilter(v=>!v)}><div className="toggle-knob"></div></div>
          </div>
        </div>
        <div className="lot-check-grid">
          {LINEAGE_LOTS.map(l => (
            <div key={l.id} className={"lot-check" + (selected.includes(l.id)?' on':'')} onClick={()=>toggle(l.id)}>
              <span className="lot-swatch" style={{background:l.color}}></span>{l.id}
            </div>
          ))}
        </div>
        <div className="chart-wrap">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={CYCLE_DATA} margin={{top:10,right:16,left:-10,bottom:0}}>
              <CartesianGrid stroke="#f1eeeb" vertical={false} />
              <XAxis dataKey="c" tick={{fontSize:11, fill:'#8e8b87'}} axisLine={false} tickLine={false} label={{value:'사이클', position:'insideBottom', offset:-2, fontSize:11, fill:'#8e8b87'}} />
              <YAxis scale={scale==='log'?'log':'linear'} domain={scale==='log'?[70,'auto']:[70,100]} tick={{fontSize:11, fill:'#8e8b87'}} axisLine={false} tickLine={false} />
              <Tooltip />
              {LINEAGE_LOTS.filter(l=>selected.includes(l.id)).map(l => (
                <Line key={l.id} type="monotone" dataKey={keyMap[l.id]} stroke={l.color} strokeWidth={2.5} dot={{r:3}} name={l.id} />
              ))}
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function NotesView({addToast}){
  const [query, setQuery] = useState('');
  const [showNew, setShowNew] = useState(false);
  const filtered = NOTES.filter(n => (n.title+n.body+n.lot).toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">연구노트</div>
          <div className="page-desc">LOT 연계 연구노트를 항목·값 형태로 구조화해 저장하고, 실험 목적·실패 원인·특이 현상 태그로 통합 검색합니다.</div>
        </div>
        <div className="page-actions">
          <button className="btn-primary" onClick={()=>setShowNew(true)}><i data-lucide="plus"></i> 새 노트 작성</button>
        </div>
      </div>

      <div className="notes-toolbar">
        <div className="search-box" style={{maxWidth:360}}>
          <i data-lucide="search"></i>
          <input placeholder="LOT · 제목 · 태그로 검색" value={query} onChange={e=>setQuery(e.target.value)} />
        </div>
        <div className="filter-chip active">전체</div>
        <div className="filter-chip">실험목적</div>
        <div className="filter-chip">실패원인</div>
        <div className="filter-chip">특이현상</div>
      </div>

      <div className="notes-grid">
        {filtered.map((n,i) => (
          <div className="note-card" key={i} onClick={()=>addToast(n.lot + ' 계통도로 이동합니다')}>
            <div className="note-lot">{n.lot}</div>
            <div className="note-title">{n.title}</div>
            <div className="note-body">{n.body}</div>
            <div className="note-tags">{n.tags.map(t => <span className="note-tag" key={t}>{t}</span>)}</div>
            <div className="note-foot"><span>연구원 K</span><span>{i+1}일 전 수정</span></div>
          </div>
        ))}
      </div>

      {showNew && (
        <Modal title="새 연구노트 작성" onClose={()=>setShowNew(false)}>
          <div className="modal-field-row">
            <div className="modal-field"><div className="modal-field-label">연계 LOT</div><select className="modal-input"><option>LOT-260801-A01</option><option>LOT-260731-B15</option></select></div>
            <div className="modal-field"><div className="modal-field-label">태그</div><select className="modal-input"><option>실험목적</option><option>실패원인</option><option>특이현상</option></select></div>
          </div>
          <div className="modal-field" style={{marginBottom:12}}>
            <div className="modal-field-label">제목</div>
            <input className="modal-input" placeholder="노트 제목을 입력합니다" />
          </div>
          <div className="modal-field">
            <div className="modal-field-label">본문</div>
            <textarea className="modal-textarea" placeholder="비정형 관찰 내용을 입력하면 항목·값 구조로 저장됩니다"></textarea>
          </div>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={()=>setShowNew(false)}>취소</button>
            <button className="btn-primary" onClick={()=>{setShowNew(false); addToast('연구노트를 저장합니다');}}><i data-lucide="check"></i> 저장</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);
  const addToast = (text) => {
    const id = Date.now() + Math.random();
    setToasts(ts => [...ts, {id, text}]);
    setTimeout(()=> setToasts(ts => ts.filter(t=>t.id!==id)), 2600);
  };
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="sidebar-brand-mark">BR</div>
          <div>
            <div className="sidebar-brand-name">BatteryLot</div>
            <div className="sidebar-brand-sub">연구 데이터 통합관리</div>
          </div>
        </div>
        {NAV.map(g => (
          <div className="sidebar-section" key={g.group}>
            <div className="sidebar-section-title">{g.group}</div>
            {g.items.map(item => (
              <button key={item.key} className={"sidebar-link" + (view===item.key ? ' active':'')} onClick={()=>setView(item.key)}>
                <i data-lucide={item.icon}></i>{item.label}
              </button>
            ))}
          </div>
        ))}
        <div className="sidebar-footer">
          <strong>BatteryLot Demo</strong>
          자체 개발 프로젝트 · 맞춤 구현 데모
        </div>
      </aside>
      <main className="main-wrap">
        {view === 'main' && <MainView go={setView} addToast={addToast} />}
        {view === 'collector' && <CollectorView addToast={addToast} />}
        {view === 'parsing' && <ParsingView addToast={addToast} />}
        {view === 'lineage' && <LineageView addToast={addToast} />}
        {view === 'notes' && <NotesView addToast={addToast} />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
