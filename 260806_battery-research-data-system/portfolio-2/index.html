<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배터리 연구 데이터 분석·관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

<style>
:root{
  --primary:#5683da;
  --primary-dark:#3f6bc4;
  --secondary:#34363d;
  --accent:#ff8964;
  --bg:#0b0c10;
  --surface:#16181d;
  --surface2:#1d2027;
  --text:#f4f5f7;
  --text2:#9a9ca3;
  --text3:#6c6e76;
  --border:#26282f;
  --danger:#ff6b6b;
  --danger-bg:rgba(255,107,107,.12);
  --warn:#e0a84e;
  --warn-bg:rgba(224,168,78,.12);
  --ok:#4fd1a5;
  --ok-bg:rgba(79,209,165,.12);
  --radius-card:16px;
  --radius-btn:9999px;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(86,131,218,.22);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--bg);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.005em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
table{border-collapse:collapse;width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(79,209,165,.45)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(79,209,165,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes auroraGlow{0%,100%{opacity:.55}50%{opacity:.9}}

.app-root{width:100%;min-height:100vh;position:relative;}
.aurora-bg{position:fixed;top:-160px;left:50%;transform:translateX(-50%);width:900px;height:420px;background:radial-gradient(ellipse at center, rgba(86,131,218,.28), rgba(255,137,100,.10) 45%, transparent 70%);filter:blur(30px);animation:auroraGlow 6s ease-in-out infinite;pointer-events:none;z-index:0;}

/* header */
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;height:60px;padding:0 26px;background:rgba(11,12,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex-shrink:0;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#0b0c10;font-size:12px;font-weight:800;flex-shrink:0;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9999px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;color:var(--text2);flex-shrink:0;transition:background .15s;}
.project-switcher:hover{background:var(--surface);}
.project-switcher i{font-size:14px;}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;}
.global-nav a{padding:8px 13px;border-radius:9999px;font-size:12.5px;color:var(--text3);white-space:nowrap;transition:.15s;}
.global-nav a:hover{color:var(--text2);}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2);flex-shrink:0;border:1px solid var(--border);transition:background .15s;position:relative;}
.icon-btn:hover{background:var(--surface);}
.icon-btn i{font-size:16px;}
.notif-dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger);}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#0b0c10;flex-shrink:0;}

/* secondary tab bar */
.tab-bar-outer{position:sticky;top:60px;z-index:30;background:rgba(11,12,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.tab-bar{display:flex;gap:6px;max-width:1280px;margin:0 auto;padding:0 26px;overflow-x:auto;}
.tab{padding:13px 4px;margin-right:22px;font-size:13px;color:var(--text3);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap;transition:.15s;}
.tab.active{color:var(--text);border-color:var(--accent);}
.tab:hover{color:var(--text2);}

.content{max-width:1280px;margin:0 auto;padding:30px 26px 90px;position:relative;z-index:1;}
.view-fade{animation:fadeIn .32s ease both;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px;}
.page-title{font-size:44px;font-weight:700;letter-spacing:-0.02em;}
.page-desc{color:var(--text2);font-size:13.5px;margin-top:7px;max-width:640px;line-height:1.55;}
.page-actions{display:flex;gap:10px;flex-shrink:0;}
.page-meta{font-size:12px;color:var(--text3);margin-top:11px;display:flex;align-items:center;gap:7px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulseDot 1.7s ease infinite;display:inline-block;}

.btn-primary{background:var(--primary);color:#0b0c10;border-radius:var(--radius-btn);padding:10px 20px;font-size:13px;font-weight:700;display:inline-flex;gap:7px;align-items:center;transition:opacity .15s,transform .1s;box-shadow:var(--shadow-lg);}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary i{font-size:15px;}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-btn);padding:9px 18px;font-size:13px;display:inline-flex;gap:7px;align-items:center;transition:background .15s;}
.btn-ghost:hover{background:var(--surface2);}
.btn-ghost i{font-size:14px;}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:9999px;background:var(--surface2);color:var(--text2);font-weight:600;border:1px solid var(--border);}
.btn-sm.on{background:var(--primary);color:#0b0c10;border-color:var(--primary);}
.btn-sm.danger{color:var(--danger);}

.stat-row{display:flex;gap:14px;margin:20px 0 22px;}
.stat-card{flex:1;background:var(--surface);border-radius:var(--radius-card);padding:16px 18px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;min-height:96px;box-shadow:var(--shadow-sm);animation:slideUp .35s ease both;border:1px solid var(--border);}
.stat-card:hover{border-color:var(--primary);}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.stat-value{font-size:29px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;color:var(--text);}
.stat-sub{font-size:12px;color:var(--ok);font-weight:600;}
.stat-sub.down{color:var(--danger);}
.stat-sparkline{position:absolute;right:16px;bottom:16px;width:68px;height:26px;opacity:.9;}

.chart-panel{background:var(--surface);border-radius:var(--radius-card);padding:22px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:20px;}
.chart-wrap{position:relative;height:280px;width:100%;}

.split-grid{display:flex;gap:16px;align-items:flex-start;}
.split-left{flex:1;min-width:0;}
.split-right{width:320px;flex-shrink:0;background:var(--surface);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.rail-title{font-size:13.5px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:7px;}
.rail-title i{font-size:16px;color:var(--accent);}
.rail-sub{font-size:11.5px;color:var(--text3);margin-bottom:14px;}
.log-stream{max-height:340px;overflow-y:auto;}
.timeline-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}
.timeline-text{color:var(--text2);flex:1;}
.timeline-time{color:var(--text3);font-size:11px;white-space:nowrap;}

.lot-check-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.lot-check{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9999px;border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text2);transition:.15s;background:var(--surface2);}
.lot-check.on{background:rgba(86,131,218,.14);border-color:var(--primary);color:var(--text);}
.lot-swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.section-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.section-block{margin-top:26px;}

/* search */
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:9999px;padding:11px 16px;border:1px solid var(--border);margin-bottom:16px;}
.search-box i{font-size:16px;color:var(--text3);}
.search-box input{background:none;border:none;outline:none;font-size:13.5px;width:100%;color:var(--text);}
.filter-chip{padding:7px 14px;border-radius:9999px;font-size:12.5px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);font-weight:500;}
.filter-chip.active{background:var(--primary);color:#0b0c10;border-color:var(--primary);}
.notes-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.result-card{background:var(--surface);border-radius:var(--radius-card);padding:18px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:12px;cursor:pointer;transition:border-color .15s;animation:slideUp .3s ease both;}
.result-card:hover{border-color:var(--primary);}
.result-lot{font-size:11px;color:var(--primary);font-weight:700;margin-bottom:6px;}
.result-title{font-size:14.5px;font-weight:700;margin-bottom:6px;}
.result-body{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.result-tags{display:flex;gap:6px;flex-wrap:wrap;}
.result-tag{font-size:10.5px;padding:3px 9px;border-radius:9999px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}

/* audit view */
.perm-table-wrap{background:var(--surface);border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--border);margin-bottom:24px;}
.perm-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;background:var(--surface2);}
.perm-table td{padding:11px 16px;font-size:12.5px;border-bottom:1px solid var(--border);color:var(--text2);}
.perm-table tr:last-child td{border-bottom:none;}
.perm-table table{width:100%;border-collapse:collapse;}
.toggle{width:38px;height:21px;border-radius:9999px;background:var(--surface2);position:relative;transition:background .2s;flex-shrink:0;border:1px solid var(--border);}
.toggle.on{background:var(--primary);border-color:var(--primary);}
.toggle-knob{width:15px;height:15px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;}
.toggle.on .toggle-knob{left:19px;}

.data-table-wrap{background:var(--surface);border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--border);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;background:var(--surface2);}
.data-table td{padding:11px 16px;font-size:12.5px;border-bottom:1px solid var(--border);color:var(--text2);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr.tbl-row:hover{background:var(--surface2);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
.badge-view{background:rgba(86,131,218,.14);color:var(--primary);}
.badge-edit{background:var(--warn-bg);color:var(--warn);}
.badge-download{background:rgba(79,209,165,.14);color:var(--ok);}
.badge-delete{background:var(--danger-bg);color:var(--danger);}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.badge-wait{background:var(--warn-bg);color:var(--warn);}
.badge-error{background:var(--danger-bg);color:var(--danger);}

/* backup view */
.backup-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}

/* settings */
.settings-grid{display:flex;flex-direction:column;gap:16px;max-width:680px;}
.settings-card{background:var(--surface);border-radius:var(--radius-card);padding:20px 22px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.settings-card-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.settings-card-title i{font-size:16px;color:var(--text2);}
.settings-card-desc{font-size:12px;color:var(--text3);margin-bottom:16px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--border);}
.settings-row:first-of-type{border-top:none;}
.settings-row-label{font-size:13px;font-weight:500;}
.settings-row-desc{font-size:11.5px;color:var(--text3);margin-top:2px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:560px;max-width:100%;max-height:86vh;overflow-y:auto;padding:24px 26px;animation:fadeInScale .2s ease both;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:9999px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close i{font-size:15px;}
.modal-field-row{display:flex;gap:16px;margin-bottom:12px;}
.modal-field{flex:1;}
.modal-field-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.modal-field-value{font-size:13.5px;font-weight:500;}
.modal-input{padding:10px 13px;border-radius:10px;border:1px solid var(--border);font-size:13px;width:100%;color:var(--text);background:var(--surface2);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast i{font-size:15px;color:var(--accent);}

@media (max-width: 980px){
  .split-grid{flex-direction:column;}
  .split-right{width:100%;}
  .global-nav{display:none;}
}
</style>
</head>

function Sparkline({data, color}){
  const max = Math.max(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*68},${26 - (v/max)*22}`).join(' ');
  return (
    <svg className="stat-sparkline" viewBox="0 0 68 26" preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

function Icon({name, style}){
  return <i className={'ph ph-' + name} style={style}></i>;
}

function Toast({toasts}){
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><Icon name="check-circle" /><span>{t.text}</span></div>
      ))}
    </div>
  );
}

function Modal({title, onClose, children}){

        <div className="modal-head">

          <button className="modal-close" onClick={onClose}><Icon name="x" /></button>
        </div>

    </div>

}

              </tr>

  );

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);
  const [notifOpen, setNotifOpen] = useState(false);
  const addToast = (text) => {
    const id = Date.now() + Math.random();
    setToasts(ts => [...ts, {id, text}]);
    setTimeout(()=> setToasts(ts => ts.filter(t=>t.id!==id)), 2600);
  };

  return (
    <div className="app-root" data-archetype="topbar-analytics">
      <div className="aurora-bg"></div>
      <header className="app-header">
        <div className="brand"><div className="brand-mark">BR</div>BatteryOps</div>
        <button className="project-switcher" onClick={()=>addToast('2차전지 연구팀 워크스페이스로 전환합니다')}>
          2차전지 연구팀 <Icon name="caret-down" />
        </button>
        <nav className="global-nav">
          <a>연구소 개요</a><a>문서 센터</a><a>API 키 관리</a>
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={()=>addToast('검색 패널을 엽니다')}><Icon name="magnifying-glass" /></button>
          <button className="icon-btn" onClick={()=>{setNotifOpen(v=>!v); addToast('알림 3건을 확인합니다');}}><Icon name="bell" /><span className="notif-dot"></span></button>
          <button className="avatar-btn" onClick={()=>addToast('프로필 메뉴를 엽니다')}>K</button>
        </div>
      </header>

      <div className="tab-bar-outer">
        <nav className="tab-bar">
          {TABS.map(t => (
            <button key={t.key} className={"tab" + (view===t.key?' active':'')} onClick={()=>setView(t.key)}>{t.label}</button>
          ))}
        </nav>
      </div>

      <main className="content">
        {view === 'main' && <MainView addToast={addToast} />}
        {view === 'search' && <SearchView addToast={addToast} />}
        {view === 'audit' && <AuditView addToast={addToast} />}
        {view === 'backup' && <BackupView addToast={addToast} />}
        {view === 'settings' && <SettingsView addToast={addToast} />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
