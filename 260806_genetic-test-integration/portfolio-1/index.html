<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 검사 서비스 통합관리 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --flame:#fa5d00; --marigold:#fee3b5; --parchment:#e3d6c5;
  --ink:#1d1e1c; --paper:#ffffff; --cream:#fff8f1;
  --mist:#d9d9d9; --stone:#615f5c; --driftwood:#8e8b87;
  --ironwood:#4a4a47; --ash:#777571; --bone:#c0bbb6; --smoke:#a5a19c;
  --mint:#1ef6da;
  --text-caption:13px; --text-subheading:18px; --text-heading-sm:20px;
  --text-heading:24px; --text-heading-lg:28px; --text-display:48px;
  --radius-card:20px; --radius-btn:16px; --radius-input:16px; --radius-tag:999px;
  --shadow-sm:rgba(0,0,0,0.2) 0px 1px 4px 0px;
  --shadow-lg:rgba(250,166,0,0.25) 6px 4px 24px 0px;
  --strip:64px; --rail:272px; --info:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream); color:var(--ink);
  letter-spacing:0.015em; -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.5; overflow:hidden;
}
button{font-family:inherit;letter-spacing:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;letter-spacing:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--parchment);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRail{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(30,246,218,.55)}50%{box-shadow:0 0 0 6px rgba(30,246,218,0)}}
@keyframes shimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ringDraw{from{stroke-dashoffset:264}to{stroke-dashoffset:var(--dash,80)}}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes auroraDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-12px) scale(1.06)}}
@keyframes ripple{from{transform:scale(0);opacity:.5}to{transform:scale(2.8);opacity:0}}

.app-shell{display:flex;width:100%;height:100vh;overflow:hidden}

/* ── 시그니처 1: 워크스페이스 strip 64px ── */
.workspace-strip{
  width:var(--strip);flex:0 0 var(--strip);background:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;
}
.ws-item{
  width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:var(--bone);background:rgba(255,255,255,.07);
  transition:all .18s ease;position:relative;
}
.ws-item:hover{background:rgba(250,93,0,.28);color:#fff;transform:translateY(-2px)}
.ws-item.active{background:var(--flame);color:#fff;box-shadow:var(--shadow-sm)}
.ws-item.active::before{
  content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#fff;
}
.ws-divider{width:26px;height:1px;background:rgba(255,255,255,.16);margin:4px 0}
.ws-brand{
  width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--flame),#ff9a4d);
  display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:var(--shadow-sm);
}
.ws-brand i{font-size:20px;color:#fff}

/* ── 시그니처 2: 리스트 레일 272px (list-rail) ── */
.channel-list{
  width:var(--rail);flex:0 0 var(--rail);background:var(--paper);
  border-right:1px solid var(--mist);display:flex;flex-direction:column;overflow:hidden;
}
.channel-header{padding:16px 16px 12px;border-bottom:1px solid var(--mist);display:flex;align-items:center;justify-content:space-between}
.ws-name{font-size:var(--text-subheading);font-weight:700;letter-spacing:0.27px}
.ws-sub{font-size:11px;color:var(--driftwood);margin-top:2px;letter-spacing:.2px}
.new-conv{
  width:32px;height:32px;border-radius:10px;background:var(--cream);border:1px solid var(--bone);
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.new-conv:hover{background:var(--flame);border-color:var(--flame);color:#fff}
.channel-search{padding:12px 14px}
.channel-search input{
  width:100%;padding:10px 12px 10px 32px;border:1px solid var(--bone);border-radius:var(--radius-input);
  background:var(--cream);font-size:13px;outline:none;transition:.18s;
}
.channel-search input:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(250,93,0,.12)}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--driftwood)}
.rail-scroll{flex:1;overflow-y:auto;padding:0 8px 12px}
.channel-section{margin-top:6px}
.section-toggle{
  width:100%;display:flex;align-items:center;gap:6px;padding:8px 8px;font-size:11px;font-weight:700;
  color:var(--ash);letter-spacing:.6px;text-transform:uppercase;border-radius:8px;transition:.15s;
}
.section-toggle:hover{background:var(--cream);color:var(--ink)}
.section-toggle i{font-size:13px;transition:transform .2s}
.section-toggle.collapsed i{transform:rotate(-90deg)}
.channel-row{
  display:flex;align-items:center;gap:6px;padding:0 4px;border-radius:12px;transition:.15s;
  animation:slideRail .32s ease both;
}
.channel-row:hover{background:var(--cream)}
.channel-row.active{background:var(--flame);box-shadow:var(--shadow-sm)}
.channel-row.active .channel-prefix,.channel-row.active .channel-item{color:#fff;font-weight:600}
.channel-prefix{font-size:14px;color:var(--driftwood);padding-left:6px}
.channel-item{
  flex:1;text-align:left;padding:9px 2px;font-size:13.5px;color:var(--ironwood);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.channel-unread{
  min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--flame);color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:6px;
}
.channel-row.active .channel-unread{background:#fff;color:var(--flame)}
.dm-item{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;
  transition:.15s;text-align:left;animation:slideRail .3s ease both;
}
.dm-item:hover{background:var(--cream)}
.dm-item.active{background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--flame)}
.presence{width:9px;height:9px;border-radius:999px;flex:0 0 9px}
.presence.online{background:var(--mint);animation:pulseDot 2.4s infinite}
.presence.wait{background:var(--flame)}
.presence.done{background:var(--bone)}
.dm-name{flex:1;font-size:13.5px;color:var(--ink);font-weight:500}
.dm-meta{font-size:10.5px;color:var(--driftwood)}

/* ── 시그니처 3: 메인 (detail-panel) ── */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--cream);overflow:hidden}
.conv-header{
  height:62px;flex:0 0 62px;padding:0 22px;border-bottom:1px solid var(--mist);
  display:flex;align-items:center;justify-content:space-between;background:var(--cream);
}
.conv-title-row{display:flex;align-items:center;gap:9px;min-width:0}
.conv-prefix{font-size:17px;color:var(--driftwood)}
.conv-title{font-size:var(--text-heading-sm);font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-count{
  font-size:11px;color:var(--stone);background:var(--paper);border:1px solid var(--mist);
  padding:3px 9px;border-radius:var(--radius-tag);white-space:nowrap;
}
.conv-actions{display:flex;gap:6px;flex:0 0 auto}
.conv-action{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--stone);transition:.16s;border:1px solid transparent;
}
.conv-action:hover{background:var(--paper);border-color:var(--mist);color:var(--flame)}
.conv-action.on{background:var(--flame);color:#fff}
.conv-body{flex:1;overflow-y:auto;padding:22px}
.conv-input{
  flex:0 0 auto;padding:12px 22px 14px;border-top:1px solid var(--mist);background:var(--cream);
  display:flex;align-items:center;gap:10px;
}
.msg-input{
  flex:1;padding:12px 16px;border:1px solid var(--bone);border-radius:var(--radius-input);
  background:var(--paper);font-size:13.5px;outline:none;transition:.18s;
}
.msg-input:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(250,93,0,.12)}
.input-actions{display:flex;gap:5px}
.input-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--bone);background:var(--paper);
  display:flex;align-items:center;justify-content:center;color:var(--stone);transition:.16s;
}
.input-btn:hover{background:var(--flame);border-color:var(--flame);color:#fff}
.input-btn.send{background:var(--flame);border-color:var(--flame);color:#fff}
.input-btn.send:hover{filter:brightness(.92)}

/* ── 시그니처 4: info 패널 320px ── */
.info-panel{
  width:var(--info);flex:0 0 var(--info);background:var(--paper);border-left:1px solid var(--mist);
  display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .3s ease both;
}
.info-header{padding:16px 18px;border-bottom:1px solid var(--mist);display:flex;align-items:center;justify-content:space-between}
.info-header h3{font-size:var(--text-subheading);font-weight:700;letter-spacing:.27px}
.close-info{width:30px;height:30px;border-radius:9px;color:var(--stone);display:flex;align-items:center;justify-content:center;transition:.15s}
.close-info:hover{background:var(--cream);color:var(--flame)}
.info-scroll{flex:1;overflow-y:auto;padding:16px 18px 20px}
.info-section{margin-bottom:20px}
.info-label{font-size:11px;font-weight:700;color:var(--ash);letter-spacing:.6px;text-transform:uppercase;margin-bottom:9px}
.info-value{font-size:13.5px;color:var(--ironwood)}
.member-item{display:flex;align-items:center;gap:9px;padding:7px 0}
.member-avatar{
  width:30px;height:30px;border-radius:10px;background:var(--cream);border:1px solid var(--parchment);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--flame);
}
.member-name{flex:1;font-size:13px;font-weight:500}
.member-role{font-size:10.5px;color:var(--driftwood)}
.pinned-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border-radius:12px;
  background:var(--cream);font-size:12.5px;color:var(--ironwood);margin-bottom:6px;transition:.15s;text-align:left;
}
.pinned-item:hover{background:var(--marigold);color:var(--ink)}

/* ── 공통 컴포넌트 ── */
.card{
  background:var(--paper);border-radius:var(--radius-card);padding:22px 24px;
  box-shadow:var(--shadow-lg);border:1px solid rgba(227,214,197,.55);
}
.card.flat{box-shadow:none;border:1px solid var(--mist)}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--flame);margin-bottom:7px}
.h-hero{font-size:56px;line-height:1.2;letter-spacing:.6px;font-weight:600}
.h-display{font-size:48px;line-height:1.15;letter-spacing:.72px;font-weight:600}
.h-lg{font-size:28px;line-height:1.2;letter-spacing:.42px;font-weight:600}
.h-md{font-size:24px;line-height:1.26;letter-spacing:.36px;font-weight:600}
.h-sm{font-size:20px;line-height:1.3;letter-spacing:.3px;font-weight:600}
.sub{font-size:18px;line-height:1.4;letter-spacing:.27px;color:var(--stone)}
.cap{font-size:13px;line-height:1.35;letter-spacing:.2px;color:var(--driftwood)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:12px 24px;border-radius:var(--radius-btn);
  font-size:14px;font-weight:600;transition:.18s;
}
.btn-primary{background:var(--flame);color:#fff;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.btn-primary::after{
  content:'';position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;
  border-radius:999px;background:rgba(255,255,255,.55);transform:scale(0);opacity:0;pointer-events:none;
}
.btn-primary:active::after{animation:ripple .55s ease-out}
.btn-primary:hover{filter:brightness(.92);transform:translateY(-1px)}
.btn-primary:disabled{background:var(--bone);cursor:not-allowed;box-shadow:none;transform:none}
.btn-ghost{color:var(--flame);padding:10px 6px;font-weight:500}
.btn-ghost:hover{text-decoration:underline}
.btn-outline{background:var(--paper);border:1px solid var(--bone);color:var(--ink)}
.btn-outline:hover{border-color:var(--flame);color:var(--flame)}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:var(--radius-tag);
  font-size:11.5px;font-weight:600;
}
.tag-live{background:rgba(30,246,218,.18);color:#0b7a6c}
.tag-wait{background:rgba(250,93,0,.12);color:var(--flame)}
.tag-lock{background:#f0efed;color:var(--ash)}
.tag-done{background:#eceae7;color:var(--ironwood)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}

.filter-chip{
  padding:6px 13px;border-radius:var(--radius-tag);border:1px solid var(--bone);background:var(--paper);
  font-size:12px;font-weight:500;color:var(--stone);transition:.16s;
}
.filter-chip:hover{border-color:var(--flame);color:var(--flame)}
.filter-chip.on{background:var(--flame);border-color:var(--flame);color:#fff}

.rec-row{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:var(--paper);
  border:1px solid var(--mist);margin-bottom:8px;transition:.16s;width:100%;text-align:left;
  animation:fadeUp .34s ease both;
}
.rec-row:hover{border-color:var(--flame);box-shadow:var(--shadow-lg);transform:translateX(3px)}
.rec-avatar{
  width:38px;height:38px;border-radius:13px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
}
.svc-dots{display:flex;gap:4px}
.svc-dot{width:8px;height:8px;border-radius:3px}

.progress-track{height:7px;border-radius:999px;background:#f0ece7;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transform-origin:left;animation:growBar .8s cubic-bezier(.22,1,.36,1) both}

.skeleton{
  background:linear-gradient(90deg,#f3efe9 25%,#fbf7f2 50%,#f3efe9 75%);
  background-size:420px 100%;animation:shimmer 1.5s infinite linear;border-radius:8px;
}

.hero-wash{position:relative;overflow:hidden;border-radius:var(--radius-card)}
.hero-wash::after{
  content:'';position:absolute;right:-60px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(250,93,0,.34) 0%,rgba(254,227,181,.42) 45%,transparent 72%);
  animation:auroraDrift 9s ease-in-out infinite;pointer-events:none;
}

.drop-zone{
  border:2px dashed var(--bone);border-radius:var(--radius-card);padding:30px;text-align:center;
  background:var(--paper);transition:.2s;width:100%;
}
.drop-zone:hover{border-color:var(--flame);background:#fffdfa}

.sign-pad{
  border:1px solid var(--bone);border-radius:var(--radius-card);background:var(--paper);height:150px;
  position:relative;overflow:hidden;width:100%;
}
.consent-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;
  border:1px solid var(--mist);background:var(--paper);margin-bottom:9px;width:100%;text-align:left;transition:.16s;
}
.consent-item:hover{border-color:var(--flame)}
.consent-item.checked{border-color:var(--flame);background:#fffaf6}
.check-box{
  width:21px;height:21px;border-radius:7px;border:1.5px solid var(--bone);flex:0 0 21px;
  display:flex;align-items:center;justify-content:center;transition:.16s;margin-top:1px;
}
.consent-item.checked .check-box{background:var(--flame);border-color:var(--flame);color:#fff}

.svc-card{
  border:1.5px solid var(--mist);border-radius:16px;padding:16px;background:var(--paper);
  transition:.18s;text-align:left;width:100%;
}
.svc-card:hover:not(.locked){border-color:var(--flame);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.svc-card.on{border-color:var(--flame);background:#fffaf6}
.svc-card.locked{opacity:.62;cursor:not-allowed;background:#faf8f6}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:var(--ash);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--mist);white-space:nowrap;
}
.tbl td{padding:10px;border-bottom:1px solid #f2efeb;color:var(--ironwood)}
.tbl tbody tr{transition:.14s}
.tbl tbody tr:hover{background:var(--cream)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--parchment)}
.tl-item{position:relative;padding-bottom:18px;animation:fadeUp .36s ease both}
.tl-dot{
  position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:999px;
  border:2.5px solid var(--paper);box-shadow:0 0 0 1.5px var(--parchment);
}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(29,30,28,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:60;animation:fadeUp .2s ease both;padding:20px;
}
.modal{
  background:var(--paper);border-radius:var(--radius-card);width:100%;max-width:480px;
  box-shadow:0 24px 60px rgba(29,30,28,.24);overflow:hidden;
}
.modal-head{padding:20px 24px 14px;border-bottom:1px solid var(--mist);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px 24px;max-height:420px;overflow-y:auto}
.modal-foot{padding:14px 24px 20px;display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--stone);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border:1px solid var(--bone);border-radius:var(--radius-input);
  background:var(--paper);font-size:13.5px;outline:none;transition:.18s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(250,93,0,.12)}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:var(--radius-btn);
  font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;
  box-shadow:0 12px 34px rgba(29,30,28,.3);animation:toastIn .3s cubic-bezier(.22,1,.36,1) both;
}
.toast i{color:var(--mint);font-size:17px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useMemo} = React;

const SERVICES = [
  {id:'basic', short:'베', name:'베이직 진단',      color:'#fa5d00'},
  {id:'gene',  short:'정', name:'정밀 유전 분석',   color:'#1ea7f6'},
  {id:'risk',  short:'질', name:'질환 위험도 검사', color:'#9b6bf6'},
  {id:'type',  short:'건', name:'건강유형도측정',   color:'#12b886'},
];
const SVC = Object.fromEntries(SERVICES.map(s=>[s.id,s]));

const CUSTOMERS = [
  {id:1,name:'김서연',birth:'1988.04.12',phone:'010-2841-7702',life:'LC-240815',hosp:'서울마루병원',

function Ring({pct,color}){
  const dash = 264 - (264*pct/100);
  return (
    <svg width="92" height="92" viewBox="0 0 92 92">
      <circle cx="46" cy="46" r="42" fill="none" stroke="#f0ece7" strokeWidth="8"/>
      <circle cx="46" cy="46" r="42" fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
        strokeDasharray="264" style={{'--dash':dash, strokeDashoffset:dash, animation:'ringDraw 1.1s cubic-bezier(.22,1,.36,1) both'}}
        transform="rotate(-90 46 46)"/>
      <text x="46" y="52" textAnchor="middle" fontSize="20" fontWeight="700" fill="#1d1e1c">{pct}%</text>
    </svg>
  );
}

function Sparkline({data,color}){
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*220},${44-((v-min)/(max-min||1))*36}`).join(' ');
  return (
    <svg width="220" height="48" viewBox="0 0 220 48">
      <defs>
        <linearGradient id="spark-p1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={`0,48 ${pts} 220,48`} fill="url(#spark-p1)"/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

                  <button className="btn btn-primary" disabled={currentSvcs.length===0}
                    onClick={()=>setModal('reissue')}>
                    <i className="ti ti-file-check"></i> 저장 후 의뢰서 재발급
                  </button>
                </div>
              </div>

              <div className="card flat" style={{marginTop:16}}>
                <div className="info-label">변경 이력</div>
                <div className="timeline">
                  {[
                    {t:'2026.08.05 14:22',w:'운영자 정하윤',d:'건강유형도측정 추가 · 의뢰서 v3 발급',c:'#fa5d00'},
                    {t:'2026.08.03 09:41',w:'운영자 김도현',d:'정밀 유전 분석 추가 · 의뢰서 v2 발급',c:'#1ea7f6'},
                    {t:'2026.08.01 16:08',w:'시스템',    d:'베이직 진단 신청 등록 · 의뢰서 v1 발급',c:'#c0bbb6'},
                  ].map((it,i)=>(
                    <div className="tl-item" key={i} style={{animationDelay:(i*0.07)+'s'}}>
                      <span className="tl-dot" style={{background:it.c}}></span>
                      <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{it.d}</div>
                      <div className="cap">{it.t} · {it.w}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ══ VIEW: reservation ══ */}
          {view==='reservation' && (
            <div>
              <div className="grid-2" style={{marginBottom:16,alignItems:'stretch'}}>
                <div className="card">
                  <div className="eyebrow">개별 예약</div>
                  <div className="h-md" style={{marginBottom:10}}>부모 / 자식 서비스 선택</div>
                  {SERVICES.slice(0,3).map(s=>(
                    <div key={s.id} className="between" style={{padding:'9px 0',borderBottom:'1px solid #f2efeb'}}>
                      <span className="row" style={{gap:8}}>
                        <span className="svc-dot" style={{background:s.color,width:9,height:9}}></span>
                        <span style={{fontSize:13}}>{s.name}</span>
                      </span>
                      <button className="btn-ghost" style={{fontSize:12}}
                        onClick={()=>setModal('book')}>선택</button>
                    </div>
                  ))}
                  <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:14}}
                    onClick={()=>setModal('book')}>
                    <i className="ti ti-calendar-plus"></i> 개별 예약 등록
                  </button>
                </div>

                <div className="card hero-wash">
                  <div style={{position:'relative',zIndex:2}}>
                    <div className="eyebrow">엑셀 일괄 등록</div>
                    <div className="h-md" style={{marginBottom:12}}>매핑 규칙 4종 자동 적용</div>
                    <button className="drop-zone" onClick={()=>{
                      setParsing(true);
                      setTimeout(()=>{setParsing(false);setUploaded(true);fire('예약 12건 등록 · 실패 2건을 확인합니다');},1400);
                    }}>
                      {parsing ? (
                        <div>
                          <div className="skeleton" style={{height:12,width:'70%',margin:'0 auto 8px'}}></div>
                          <div className="skeleton" style={{height:12,width:'45%',margin:'0 auto'}}></div>
                          <div className="cap" style={{marginTop:12}}>행 단위 매핑 규칙 적용 중…</div>
                        </div>
                      ) : (
                        <div>
                          <i className="ti ti-file-spreadsheet" style={{fontSize:30,color:'#fa5d00'}}></i>
                          <div style={{fontSize:13.5,fontWeight:600,margin:'8px 0 4px'}}>예약목록_2026-08.xlsx</div>
                          <div className="cap">클릭하여 파싱 · 검증 파이프라인 실행</div>
                        </div>
                      )}
                    </button>
                  </div>
                </div>
              </div>

              <div className="card flat">
                <div className="between" style={{marginBottom:12}}>
                  <div className="info-label" style={{marginBottom:0}}>파싱 결과</div>
                  {uploaded && <span className="row" style={{gap:8}}>
                    <span className="tag tag-live">성공 12</span>
                    <span className="tag tag-wait">실패 2</span>
                  </span>}
                </div>
                {uploaded ? (
                  <table className="tbl">
                    <thead><tr><th>행</th><th>이름</th><th>라이프코드</th><th>병원명</th><th>서비스</th><th>결과</th></tr></thead>
                    <tbody>
                      {[
                        {r:2,n:'윤가람',l:'LC-240891',h:'서울마루병원',s:'베이직 진단',ok:true},
                        {r:3,n:'서동혁',l:'LC-240892',h:'한빛의원',s:'건강유형도측정',ok:true},
                        {r:4,n:'노아름',l:'—',       h:'새봄가정의학과',s:'정밀 유전 분석',ok:false,why:'라이프코드 형식 불일치'},
                        {r:5,n:'임태경',l:'LC-240894',h:'그린힐병원',s:'질환 위험도 검사',ok:true},
                        {r:6,n:'—',    l:'LC-240895',h:'서울마루병원',s:'베이직 진단',ok:false,why:'필수 항목 누락 (이름)'},
                      ].map(row=>(
                        <tr key={row.r}>
                          <td>{row.r}</td><td>{row.n}</td><td>{row.l}</td><td>{row.h}</td><td>{row.s}</td>
                          <td>{row.ok
                            ? <span className="tag tag-live">등록</span>
                            : <span className="row" style={{gap:6}}>
                                <span className="tag tag-wait">실패</span>
                                <span className="cap">{row.why}</span>
                              </span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : (
                  <div style={{textAlign:'center',padding:'26px 0'}}>
                    <svg width="120" height="76" viewBox="0 0 120 76">
                      <rect x="26" y="12" width="56" height="52" rx="8" fill="#fff8f1" stroke="#e3d6c5" strokeWidth="1.6"/>
                      <line x1="36" y1="28" x2="72" y2="28" stroke="#e3d6c5" strokeWidth="2.4" strokeLinecap="round"/>
                      <line x1="36" y1="38" x2="66" y2="38" stroke="#e3d6c5" strokeWidth="2.4" strokeLinecap="round"/>
                      <line x1="36" y1="48" x2="58" y2="48" stroke="#e3d6c5" strokeWidth="2.4" strokeLinecap="round"/>
                      <circle cx="82" cy="52" r="16" fill="none" stroke="#fa5d00" strokeWidth="2.6"/>
                      <line x1="93" y1="63" x2="104" y2="74" stroke="#fa5d00" strokeWidth="3" strokeLinecap="round"/>
                    </svg>
                    <div className="cap" style={{marginTop:8}}>엑셀을 업로드하면 행 단위 검증 결과가 표시됩니다</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ══ VIEW: customer-detail ══ */}
          {view==='customer-detail' && (
            <div>
              <div className="card hero-wash" style={{marginBottom:16}}>
                <div className="row" style={{gap:18,position:'relative',zIndex:2}}>
                  <div className="rec-avatar" style={{width:62,height:62,flex:'0 0 62px',borderRadius:20,fontSize:22,background:SVC[sel.svcs[0]].color}}>
                    {sel.name.slice(0,1)}
                  </div>
                  <div style={{flex:1}}>
                    <div className="row" style={{gap:9,marginBottom:5}}>
                      <span className="h-lg">{sel.name}</span>
                      <span className={'tag '+stateTag(sel.state)}>{sel.state}</span>
                    </div>
                    <div className="cap">{sel.birth} · {sel.phone} · {sel.hosp}</div>
                  </div>
                  <Ring pct={sel.progress} color="#fa5d00"/>
                </div>
              </div>

              <div className="grid-3" style={{marginBottom:16}}>
                {[
                  {l:'라이프코드',v:sel.life},{l:'검사 예약일',v:sel.book},{l:'검체 채취일',v:sel.pick},
                  {l:'바코드번호',v:sel.code},{l:'신청 서비스',v:sel.svcs.length+'건'},{l:'잠금 서비스',v:sel.locked.length+'건'},
                ].map(f=>(
                  <div className="card flat" key={f.l} style={{padding:'14px 16px'}}>
                    <div className="info-label" style={{marginBottom:5}}>{f.l}</div>
                    <div style={{fontSize:14,fontWeight:600}}>{f.v}</div>
                  </div>
                ))}
              </div>

              <div className="grid-2">
                <div className="card flat">
                  <div className="info-label">서비스별 진행 상태</div>
                  {sel.svcs.map(s=>(
                    <div key={s} style={{marginBottom:13}}>
                      <div className="between" style={{marginBottom:5}}>
                        <span className="row" style={{gap:7}}>
                          <span className="svc-dot" style={{background:SVC[s].color,width:9,height:9}}></span>
                          <span style={{fontSize:13}}>{SVC[s].name}</span>
                        </span>
                        <span className="cap">{sel.locked.includes(s)?'진행중':'대기'}</span>
                      </div>
                      <div className="progress-track">
                        <div className="progress-fill"
                          style={{width:(sel.locked.includes(s)?86:34)+'%',background:SVC[s].color}}></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="card flat">
                  <div className="info-label">발급 문서</div>
                  {['통합 동의서_v3.pdf','병원용 의뢰서_v3.pdf','검사 결과지_초안.pdf'].map((d,i)=>(
                    <div key={d} className="between" style={{padding:'10px 0',borderBottom:'1px solid #f2efeb'}}>
                      <span className="row" style={{gap:8}}>
                        <i className="ti ti-file-type-pdf" style={{color:'#fa5d00',fontSize:18}}></i>
                        <span style={{fontSize:12.5}}>{d}</span>
                      </span>
                      <button className="btn-ghost" style={{fontSize:12}}
                        onClick={()=>fire(`${d} 다운로드 이력을 감사 로그에 기록합니다`)}>다운로드</button>
                    </div>
                  ))}
                  <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:14}}
                    onClick={()=>goto('consent')}>서명 화면으로 이동</button>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* 시그니처 6: 하단 sticky 입력창 */}
        <footer className="conv-input">
          <input className="msg-input" value={memo} onChange={e=>setMemo(e.target.value)}
            placeholder={`${sel.name} 고객 기록에 운영 메모 작성…`} />
          <div className="input-actions">
            <button className="input-btn" title="파일 첨부" onClick={()=>fire('결과지 파일을 첨부합니다')}>
              <i className="ti ti-paperclip"></i>
            </button>
            <button className="input-btn" title="담당자 멘션" onClick={()=>fire('담당자를 멘션합니다')}>
              <i className="ti ti-at"></i>
            </button>
            <button className="input-btn send" title="메모 저장"
              onClick={()=>{ if(memo.trim()){setMemo('');fire('운영 메모를 기록했습니다');} else fire('메모 내용을 입력합니다'); }}>
              <i className="ti ti-send"></i>
            </button>
          </div>
        </footer>
      </main>

      {/* ── 시그니처 4: info 패널 ── */}
      {infoOpen && (
        <aside className="info-panel" data-info-panel>
          <div className="info-header">
            <h3>{sel.name} 정보</h3>
            <button className="close-info" title="정보 패널 접기" onClick={()=>setInfo(false)}>
              <i className="ti ti-x"></i>
            </button>
          </div>
          <div className="info-scroll">
            <div className="info-section">
              <div className="info-label">기본 정보</div>
              <div className="info-value" style={{lineHeight:1.9}}>
                라이프코드 · {sel.life}<br/>
                생년월일 · {sel.birth}<br/>
                연락처 · {sel.phone}<br/>
                병원 · {sel.hosp}
              </div>
            </div>

            <div className="info-section">
              <div className="info-label">신청 서비스 ({sel.svcs.length})</div>
              {sel.svcs.map(s=>(
                <div className="member-item" key={s}>
                  <span className="member-avatar" style={{color:SVC[s].color}}>{SVC[s].short}</span>
                  <span className="member-name">{SVC[s].name}</span>
                  <span className="member-role">{sel.locked.includes(s)?'진행중':'대기'}</span>
                </div>
              ))}
            </div>

            <div className="info-section">
              <div className="info-label">담당자</div>
              {[{n:'정하윤',r:'검사 운영'},{n:'김도현',r:'결과 관리'},{n:'배소민',r:'병원 지원'}].map(m=>(
                <div className="member-item" key={m.n}>
                  <span className="member-avatar">{m.n.slice(0,1)}</span>
                  <span className="member-name">{m.n}</span>
                  <span className="member-role">{m.r}</span>
                </div>
              ))}
            </div>

            <div className="info-section">
              <div className="info-label">고정된 항목</div>
              <button className="pinned-item" onClick={()=>goto('consent')}>
                <i className="ti ti-signature" style={{color:'#fa5d00'}}></i> 통합 동의서 서명 대기 3건
              </button>
              <button className="pinned-item" onClick={()=>goto('reservation')}>
                <i className="ti ti-file-spreadsheet" style={{color:'#fa5d00'}}></i> 엑셀 업로드 실패 2건
              </button>
              <button className="pinned-item" onClick={()=>setView('customer-detail')}>
                <i className="ti ti-user-search" style={{color:'#fa5d00'}}></i> 고객 상세보기
              </button>
            </div>

            <div className="cap" style={{paddingTop:6,borderTop:'1px solid #f2efeb'}}>
              © 2026 데모 헬스케어 플랫폼 — 자체 개발 프로젝트
            </div>
          </div>
        </aside>
      )}

      {/* ── 모달 ── */}
      {modal && (
        <div className="modal-backdrop" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="h-sm">
                {modal==='book'?'개별 예약 등록':modal==='reissue'?'의뢰서 재발급 확인':
                 modal==='new-customer'?'신규 고객 등록':'서비스 라인 추가'}
              </span>
              <button className="close-info" title="닫기" onClick={()=>setModal(null)}>
                <i className="ti ti-x"></i>
              </button>
            </div>
            <div className="modal-body">
              {modal==='reissue' ? (
                <div>
                  <div className="sub" style={{marginBottom:14}}>
                    선택 {currentSvcs.length}건으로 구성을 저장하고 병원용 의뢰서 PDF를 재생성합니다
                  </div>
                  <div className="card flat" style={{padding:14}}>
                    {currentSvcs.map(s=>(
                      <div className="row" key={s} style={{gap:8,padding:'5px 0'}}>
                        <span className="svc-dot" style={{background:SVC[s].color,width:8,height:8}}></span>
                        <span style={{fontSize:13}}>{SVC[s].name}</span>
                      </div>
                    ))}
                  </div>
                  <div className="cap" style={{marginTop:12}}>재발급 시 버전이 v4로 증가하며 변경 이력에 기록됩니다</div>
                </div>
              ) : (
                <div>
                  <div className="field">
                    <label>고객명</label>
                    <input placeholder="예: 김서연" defaultValue={modal==='book'?sel.name:''}/>
                  </div>
                  <div className="field">
                    <label>{modal==='add-service'?'서비스 라인명':'라이프코드'}</label>
                    <input placeholder={modal==='add-service'?'예: 대사증후군 검사':'예: LC-240815'}/>
                  </div>
                  <div className="field">
                    <label>{modal==='add-service'?'매핑 규칙':'검사 예약일'}</label>
                    <select defaultValue="">
                      <option value="" disabled>선택하세요</option>
                      {modal==='add-service'
                        ? ['바코드 기반','바코드 미사용','공급업체 연동'].map(o=><option key={o}>{o}</option>)
                        : ['2026.08.07','2026.08.08','2026.08.10'].map(o=><option key={o}>{o}</option>)}
                    </select>
                  </div>
                  <div className="field">
                    <label>비고</label>
                    <textarea rows="2" placeholder="운영 메모를 입력합니다"></textarea>
                  </div>
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={()=>{
                const m = modal;
                setModal(null);
                if(m==='reissue'){ fire('의뢰서 v4를 재발급했습니다'); }
                else if(m==='book'){ fire('개별 예약을 등록했습니다'); }
                else if(m==='new-customer'){ fire('신규 고객을 등록했습니다'); }
                else { fire('서비스 라인을 추가했습니다'); }
              }}>확인</button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div className="toast"><i className="ti ti-circle-check"></i>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
