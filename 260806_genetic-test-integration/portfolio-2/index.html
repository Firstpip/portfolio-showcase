<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검사 서비스 운영 통합 스위트 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --iris:#5683da; --ember:#ff8964; --molasses:#5a250a;
  --canvas:#12141c; --void:#090a0c; --card:#1c1f2b; --card-2:#0e0e10;
  --edge:#4a4b50; --iron:#6b6c6d; --smoke:#95979e; --ash:#a9a9aa;
  --frost:#d1d1d1; --linen:#e5e5e7; --snow:#ffffff; --ink:#f2f3f6;
  --t-caption:11px; --t-body:14px; --t-body-lg:16px; --t-sub:18px;
  --t-h-sm:22px; --t-h:24px; --t-d-sm:32px; --t-display:68px;
  --r-card:12px; --r-panel:30px; --r-input:4px; --r-pill:9999px;
  --gap:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--canvas); color:var(--ink);
  font-size:var(--t-body); line-height:1.5; letter-spacing:-0.14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
input,select,textarea{font-family:inherit;letter-spacing:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c3040;border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes tileRise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes beamPulse{0%,100%{opacity:.5;transform:scaleY(1)}50%{opacity:.95;transform:scaleY(1.08)}}
@keyframes dashFlow{to{stroke-dashoffset:-140}}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blinkDot{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes toastPop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.shell{display:flex;flex-direction:column;width:100%;height:100vh;overflow:hidden;position:relative}

/* 오로라 빔 — 좁은 수직 광선 (전면 배경 채우기 금지) */
.aurora{position:fixed;top:0;left:50%;transform:translateX(-50%);width:280px;height:420px;pointer-events:none;z-index:0}
.aurora .beam{
  position:absolute;left:50%;top:0;transform:translateX(-50%);width:74px;height:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(86,131,218,.55) 26%,rgba(255,137,100,.4) 62%,transparent 100%);
  filter:blur(28px);animation:beamPulse 6s ease-in-out infinite;transform-origin:top;
}
.aurora .glow{
  position:absolute;left:50%;top:52%;transform:translateX(-50%);width:340px;height:180px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,137,100,.24) 0%,transparent 68%);filter:blur(22px);
}

/* 상단 네비 (사이드바 없음) */
.topbar{
  position:relative;z-index:3;height:60px;flex:0 0 60px;display:flex;align-items:center;gap:18px;
  padding:0 24px;border-bottom:1px solid #22252f;background:rgba(18,20,28,.86);backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-0.2px}
.brand-mark{
  width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--iris),var(--ember));color:#fff;font-size:15px;
}
.topnav{display:flex;gap:4px;flex:1}
.nav-pill{
  padding:8px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:500;color:var(--smoke);
  transition:.18s;border:1px solid transparent;white-space:nowrap;
}
.nav-pill:hover{color:var(--ink);background:#1b1e28}
.nav-pill.on{background:var(--iris);color:#fff;border-color:var(--iris)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-pill{
  width:34px;height:34px;border-radius:var(--r-pill);border:1px solid #2b2f3c;display:flex;
  align-items:center;justify-content:center;color:var(--smoke);transition:.18s;position:relative;
}
.icon-pill:hover{border-color:var(--iris);color:var(--ink)}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:999px;background:var(--ember);animation:blinkDot 1.8s infinite}
.avatar-pill{
  height:34px;padding:0 6px 0 4px;border-radius:var(--r-pill);border:1px solid #2b2f3c;display:flex;
  align-items:center;gap:7px;transition:.18s;
}
.avatar-pill:hover{border-color:var(--iris)}
.avatar-sm{
  width:24px;height:24px;border-radius:999px;background:linear-gradient(140deg,var(--iris),#7fa4e8);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#fff;
}

/* 본문 */
.canvas-scroll{flex:1;overflow-y:auto;position:relative;z-index:2;padding:22px 24px 28px}
.view-head{margin-bottom:18px}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-caption);font-weight:600;
  letter-spacing:.6px;text-transform:uppercase;color:var(--ember);margin-bottom:8px;
}
.view-title{font-size:44px;line-height:1;letter-spacing:-2.2px;font-weight:600}
.view-sub{font-size:16px;color:var(--smoke);letter-spacing:-0.16px;margin-top:8px;max-width:640px}

/* ── bento grid ── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.tile{
  background:var(--card);border:1px solid #262a36;border-radius:var(--r-card);padding:18px 20px;
  transition:.2s;animation:tileRise .42s cubic-bezier(.22,1,.36,1) both;min-width:0;
}
.tile:hover{border-color:var(--iris)}
.tile.span2{grid-column:span 2}
.tile.span3{grid-column:span 3}
.tile.tall{grid-row:span 2}
.tile.dim{background:var(--card-2)}
.tile.beam{
  background:radial-gradient(120% 120% at 12% 0%,rgba(86,131,218,.16) 0%,transparent 55%),var(--card);
}
.tile.warm{
  background:radial-gradient(120% 120% at 88% 0%,rgba(255,137,100,.16) 0%,transparent 58%),var(--card);
}
.tile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tile-title{font-size:13px;font-weight:600;color:var(--ash);letter-spacing:-0.1px}
.tile-num{font-size:68px;line-height:.9;letter-spacing:-4px;font-weight:600}
.tile-num.sm{font-size:36px;letter-spacing:-1.6px}
.tile-lbl{font-size:11px;color:var(--smoke);letter-spacing:normal;margin-top:8px}
.tile-sub{font-size:24px;line-height:1.25;letter-spacing:-0.48px;font-weight:600}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);
  font-size:var(--t-caption);font-weight:500;letter-spacing:normal;
}
.chip-iris{background:rgba(86,131,218,.14);color:#8fb2ee}
.chip-ember{background:rgba(255,137,100,.14);color:var(--ember)}
.chip-ash{background:rgba(169,169,170,.12);color:var(--ash)}
.chip-ok{background:rgba(30,200,150,.14);color:#3fd6a5}

.pill-btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:var(--r-pill);
  font-size:13.5px;font-weight:500;transition:.18s;
}
.pill-primary{background:var(--iris);color:#fff}
.pill-primary:hover{filter:brightness(1.1);box-shadow:0 0 0 4px rgba(86,131,218,.18)}
.pill-primary:disabled{background:#2b3040;color:var(--iron);cursor:not-allowed;box-shadow:none}
.pill-ghost{border:1px solid #303236;color:var(--ink);background:transparent}
.pill-ghost:hover{background:#fff;color:var(--void);border-color:#fff}
.pill-white{background:#fff;color:var(--void)}
.pill-white:hover{filter:brightness(.92)}
.pill-sm{padding:7px 15px;font-size:12px}

.link-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;width:100%;
  text-align:left;transition:.16s;border:1px solid transparent;
}
.link-row:hover{background:#20242f;border-color:#2f3442}
.mini-avatar{
  width:28px;height:28px;border-radius:999px;flex:0 0 28px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:#fff;
}

.log-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.log-tbl th{
  text-align:left;padding:8px 9px;font-size:10.5px;font-weight:600;color:var(--iron);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #262a36;white-space:nowrap;
}
.log-tbl td{padding:9px;border-bottom:1px solid #1f222c;color:var(--ash)}
.log-tbl tbody tr{transition:.15s}
.log-tbl tbody tr:hover{background:#20242f}

.role-cell{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.role-on{background:rgba(86,131,218,.2);color:#8fb2ee}
.role-off{background:#1f222c;color:#4a4b50}

.q-bar{height:6px;border-radius:999px;background:#1f222c;overflow:hidden}
.q-fill{height:100%;border-radius:999px;transform-origin:left;animation:barUp .7s ease both}

.app-frame{
  border:1px solid #2b2f3c;border-radius:var(--r-card);overflow:hidden;background:var(--void);
}
.app-titlebar{
  height:30px;display:flex;align-items:center;gap:6px;padding:0 11px;background:#15171f;border-bottom:1px solid #22252f;
}
.tl-dot3{width:9px;height:9px;border-radius:999px}
.app-body{padding:16px}

.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--smoke);margin-bottom:5px;letter-spacing:normal}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid #303442;border-radius:var(--r-input);
  background:#171a23;color:var(--ink);font-size:13px;outline:none;transition:.18s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--iris)}

.modal-back{
  position:fixed;inset:0;background:rgba(9,10,12,.66);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:tileRise .2s ease both;
}
.modal{
  background:var(--card);border:1px solid #2b2f3c;border-radius:var(--r-panel);width:100%;max-width:470px;overflow:hidden;
}
.modal-head{padding:20px 24px 14px;border-bottom:1px solid #262a36;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:18px 24px;max-height:400px;overflow-y:auto}
.modal-foot{padding:14px 24px 20px;display:flex;gap:9px;justify-content:flex-end}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:80;
  background:#fff;color:var(--void);padding:12px 22px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);animation:toastPop .28s cubic-bezier(.22,1,.36,1) both;
}
.toast i{color:var(--iris);font-size:17px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect} = React;

/* KPI 카운트업 — 집계 지표가 갱신되며 올라가는 느낌 */
function useCountUp(target,ms=900){
  const [n,setN] = useState(0);
  useEffect(()=>{
    let cur = 0;
    const steps = 28, inc = target/steps;
    const id = setInterval(()=>{
      cur += inc;
      if(cur >= target){ setN(target); clearInterval(id); }
      else setN(Math.floor(cur));
    }, ms/steps);
    return ()=>clearInterval(id);
  },[target]);
  return n;
}

const NAV = [
  {view:'main',          label:'통합 운영 분석 허브'},
  {view:'access-audit',  label:'권한 및 감사 로그 관리'},
  {view:'results-notify',label:'결과 등록 및 다채널 알림 자동화'},
  {view:'desktop-sync',  label:'데스크탑 연동 일괄 등록 클라이언트'},
  {view:'provider-manage',label:'담당자 정보 관리'},
];

const SERVICES = [
  {id:'basic',name:'베이직 진단',      c:'#5683da', today:34, trend:[18,22,19,26,24,31,34]},
  {id:'gene', name:'정밀 유전 분석',   c:'#7fa4e8', today:21, trend:[12,15,13,18,16,19,21]},
  {id:'risk', name:'질환 위험도 검사', c:'#ff8964', today:17, trend:[9,11,14,12,15,16,17]},
  {id:'type', name:'건강유형도측정',   c:'#3fd6a5', today:12, trend:[2,4,5,7,9,10,12]},
];

const ROLES = ['통합 조회','결과 다운로드','권한 편집','감사 로그','예약 등록'];
const ACCOUNTS = [
  {n:'정하윤',r:'운영 총괄',   p:[1,1,1,1,1]},
  {n:'김도현',r:'결과 관리자', p:[1,1,0,0,1]},
  {n:'배소민',r:'병원 지원',   p:[1,0,0,0,1]},
  {n:'윤태리',r:'감사 담당',   p:[1,0,0,1,0]},
];

const AUDIT = [
  {t:'2026.08.06 09:41',a:'김도현',ac:'결과지 다운로드',tg:'LC-240855 · 정밀 유전 분석',lv:'민감'},
  {t:'2026.08.06 09:12',a:'정하윤',ac:'권한 변경',      tg:'배소민 · 결과 다운로드 해제',lv:'관리'},
  {t:'2026.08.06 08:57',a:'배소민',ac:'통합 리스트 조회',tg:'필터 8종 · 34건',        lv:'일반'},
  {t:'2026.08.05 18:22',a:'윤태리',ac:'감사 로그 열람',  tg:'2026.08.01~08.05',      lv:'관리'},
  {t:'2026.08.05 17:04',a:'김도현',ac:'RawData 내보내기',tg:'건강유형도측정 · 12건',   lv:'민감'},
  {t:'2026.08.05 15:30',a:'정하윤',ac:'계정 생성',      tg:'윤태리 · 감사 담당',      lv:'관리'},
];

const CHANNELS = [
  {n:'알림톡',  q:24, done:22, fail:2, c:'#5683da', icon:'chat-circle-text'},
  {n:'문자',    q:11, done:11, fail:0, c:'#7fa4e8', icon:'device-mobile'},
  {n:'이메일',  q:8,  done:6,  fail:2, c:'#ff8964', icon:'envelope-simple'},
];

function Trend({data,color,w=220,h=70}){
  const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-6-((v-min)/(max-min||1))*(h-18)}`).join(' ');
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={'g-'+color.slice(1)} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".34"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#g-${color.slice(1)})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        strokeDasharray="140" style={{animation:'dashFlow 5s linear infinite'}}/>
    </svg>
  );
}

function Donut({segs,size=124}){
  const total = segs.reduce((a,s)=>a+s.v,0);
  let acc = 0;
  const r = size/2-13, c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1f222c" strokeWidth="13"/>
      {segs.map((s,i)=>{
        const len = (s.v/total)*c, off = -acc; acc += len;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.c} strokeWidth="13"
          strokeDasharray={`${len} ${c-len}`} strokeDashoffset={off}
          transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="butt"/>;
      })}
      <text x={size/2} y={size/2+2} textAnchor="middle" fontSize="21" fontWeight="600" fill="#f2f3f6">{total}</text>
      <text x={size/2} y={size/2+18} textAnchor="middle" fontSize="10" fill="#95979e">건 / 오늘</text>
    </svg>
  );
}

function HubTotal(){
  const n = useCountUp(84);
  return <div className="tile-num">{n}</div>;
}

function App(){
  const [view,setView]   = useState('main');
  const [toast,setToast] = useState(null);
  const [modal,setModal] = useState(null);
  const [range,setRange] = useState('7일');
  const [lvFilter,setLv] = useState('전체');
  const [perm,setPerm]   = useState(ACCOUNTS.map(a=>a.p.slice()));
  const [sent,setSent]   = useState(false);
  const [hospital,setHosp] = useState('서울마루병원');
  const [synced,setSynced] = useState(false);

  const fire=(m)=>{setToast(m);setTimeout(()=>setToast(null),2300)};
  const togglePerm=(ai,pi)=>{
    const next = perm.map(r=>r.slice());
    next[ai][pi] = next[ai][pi]?0:1;
    setPerm(next);
    fire(`${ACCOUNTS[ai].n} · ${ROLES[pi]} 권한을 갱신했습니다`);
  };

  const logs = lvFilter==='전체' ? AUDIT : AUDIT.filter(l=>l.lv===lvFilter);

  const head = {
    'main':{e:'운영 허브',t:'통합 운영 분석 허브',s:'4개 검사 서비스의 처리 현황·대기 큐·알림 상태를 사전 집계된 지표로 한 화면에서 조망합니다'},
    'access-audit':{e:'접근 통제',t:'권한 및 감사 로그 관리',s:'계정별 기능 접근 범위를 제어하고, 민감정보 접근·다운로드 이력을 감사 로그로 추적합니다'},
    'results-notify':{e:'결과 · 알림',t:'결과 등록 및 다채널 알림 자동화',s:'결과 수신 즉시 고객 확인 페이지를 생성하고 채널별 큐로 분리해 안내를 발송합니다'},
    'desktop-sync':{e:'데스크탑 클라이언트',t:'데스크탑 연동 일괄 등록 클라이언트',s:'병원 담당자가 데스크탑 앱에서 웹과 동일한 파싱·매핑 엔진으로 예약을 일괄 등록합니다'},
    'provider-manage':{e:'담당자 관리',t:'담당자 정보 관리',s:'외부 검사기관 담당자 정보를 저장하고 결과지 생성 시 동적으로 반영하며 변경 이력을 보존합니다'},
  }[view];

  return (
    <div className="shell" data-archetype="bento-grid">
      <div className="aurora"><div className="beam"></div><div className="glow"></div></div>

      <header className="topbar">
        <div className="brand">
          <span className="brand-mark"><i className="ph-fill ph-hexagon"></i></span>
          검사 운영 스위트
        </div>
        <nav className="topnav">
          {NAV.map(n=>(
            <button key={n.view} className={'nav-pill'+(view===n.view?' on':'')} title={n.label}
              onClick={()=>setView(n.view)}>{n.label}</button>
          ))}
        </nav>

                {n:'건강유형도측정',   k:'라이프코드 (바코드 미사용)',c:'#3fd6a5'},
              ].map(m=>(
                <button key={m.n} className="link-row" onClick={()=>fire(`${m.n} 매핑 규칙을 확인합니다`)}>
                  <span style={{width:8,height:8,borderRadius:3,background:m.c,flex:'0 0 8px'}}></span>
                  <span style={{flex:1,fontSize:12.5}}>{m.n}</span>
                  <span style={{fontSize:11,color:'#6b6c6d'}}>{m.k}</span>
                </button>
              ))}
            </section>

            <section className="tile span2" style={{animationDelay:'.2s'}}>
              <div className="tile-head"><span className="tile-title">전송 결과</span></div>
              <table className="log-tbl">
                <thead><tr><th>행</th><th>이름</th><th>서비스</th><th>결과</th></tr></thead>
                <tbody>
                  {[
                    {r:2,n:'윤가람',s:'베이직 진단',ok:true},
                    {r:3,n:'서동혁',s:'건강유형도측정',ok:true},
                    {r:4,n:'노아름',s:'정밀 유전 분석',ok:false,w:'라이프코드 불일치'},
                    {r:5,n:'임태경',s:'질환 위험도 검사',ok:true},
                  ].map(row=>(
                    <tr key={row.r}>
                      <td>{row.r}</td><td style={{color:'#f2f3f6'}}>{row.n}</td><td>{row.s}</td>
                      <td>{row.ok?<span className="chip chip-ok">등록</span>
                        :<span style={{display:'flex',alignItems:'center',gap:7}}>
                          <span className="chip chip-ember">실패</span>
                          <span style={{fontSize:11,color:'#6b6c6d'}}>{row.w}</span></span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </section>
          </div>
        )}

        {/* ══ provider-manage ══ */}
        {view==='provider-manage' && (
          <div className="bento">
            <section className="tile span2 tall beam" style={{animationDelay:'0s'}}>
              <div className="tile-head">
                <span className="tile-title">외부 검사기관 담당자</span>
                <button className="chip chip-iris" onClick={()=>setModal('new-provider')}>담당자 추가</button>
              </div>
              {[
                {n:'서지훈',o:'검사기관 A',t:'02-1234-5678',s:'적용중',c:'#5683da'},
                {n:'문가영',o:'검사기관 A',t:'02-1234-5690',s:'적용중',c:'#7fa4e8'},
                {n:'조민석',o:'공급업체 B',t:'031-880-2200',s:'대기',  c:'#ff8964'},
                {n:'황수아',o:'공급업체 B',t:'031-880-2214',s:'보관',  c:'#a9a9aa'},
              ].map(p=>(
                <button key={p.n} className="link-row" onClick={()=>fire(`${p.n} 담당자 정보를 결과지 양식에 반영합니다`)}>
                  <span className="mini-avatar" style={{background:p.c}}>{p.n.slice(0,1)}</span>
                  <span style={{flex:1,minWidth:0}}>
                    <span style={{display:'block',fontSize:12.5,fontWeight:500}}>{p.n}</span>
                    <span style={{display:'block',fontSize:11,color:'#6b6c6d'}}>{p.o} · {p.t}</span>
                  </span>
                  <span className={'chip '+(p.s==='적용중'?'chip-ok':p.s==='대기'?'chip-ember':'chip-ash')}>{p.s}</span>
                </button>
              ))}
              <div className="tile-lbl" style={{marginTop:12}}>
                결과지 생성 시 담당자 정보가 동적으로 주입되어 고정값 수정 작업이 필요하지 않습니다
              </div>
            </section>

            <section className="tile" style={{animationDelay:'.05s'}}>
              <div className="tile-title">등록 담당자</div>
              <div className="tile-num sm" style={{color:'#5683da',marginTop:8}}>4</div>
              <div className="tile-lbl">기관 2곳 · 적용중 2명</div>
            </section>

            <section className="tile warm" style={{animationDelay:'.1s'}}>
              <div className="tile-title">이번 달 변경</div>
              <div className="tile-num sm" style={{color:'#ff8964',marginTop:8}}>3</div>
              <div className="tile-lbl">전부 이력 보존됨</div>
            </section>

            <section className="tile span2" style={{animationDelay:'.15s'}}>
              <div className="tile-head"><span className="tile-title">결과지 미리보기</span></div>
              <div style={{border:'1px solid #2b2f3c',borderRadius:10,padding:14,background:'#171a23'}}>
                <svg width="100%" height="88" viewBox="0 0 320 88">
                  <rect x="0" y="0" width="320" height="88" rx="6" fill="#0e0e10"/>
                  <rect x="16" y="14" width="120" height="8" rx="4" fill="#5683da"/>
                  <rect x="16" y="32" width="200" height="5" rx="2.5" fill="#2b2f3c"/>
                  <rect x="16" y="44" width="170" height="5" rx="2.5" fill="#2b2f3c"/>
                  <rect x="16" y="64" width="96" height="10" rx="5" fill="#ff8964" opacity=".85"/>
                  <text x="120" y="72" fontSize="8" fill="#6b6c6d">담당자 필드 · 동적 주입</text>
                </svg>
              </div>
              <button className="pill-btn pill-ghost pill-sm" style={{marginTop:12}}
                onClick={()=>fire('결과지 양식 미리보기를 생성합니다')}>양식 미리보기</button>
            </section>

            <section className="tile span2" style={{animationDelay:'.2s'}}>
              <div className="tile-head"><span className="tile-title">변경 이력</span></div>
              <table className="log-tbl">
                <thead><tr><th>일시</th><th>대상</th><th>변경 내용</th></tr></thead>
                <tbody>
                  {[
                    {d:'2026.08.05',t:'조민석',c:'연락처 수정 · 031-880-2200'},
                    {d:'2026.08.02',t:'문가영',c:'담당 서비스 추가 · 정밀 유전 분석'},
                    {d:'2026.07.28',t:'황수아',c:'상태 변경 · 적용중 → 보관'},
                  ].map((r,i)=>(
                    <tr key={i}><td style={{whiteSpace:'nowrap'}}>{r.d}</td>
                    <td style={{color:'#f2f3f6'}}>{r.t}</td><td>{r.c}</td></tr>
                  ))}
                </tbody>
              </table>
            </section>
          </div>
        )}
      </div>

      {modal && (
        <div className="modal-back" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span style={{fontSize:22,fontWeight:600,letterSpacing:'-0.4px'}}>
                {modal==='search'?'통합 검색':modal==='new-account'?'운영 계정 추가':'담당자 추가'}
              </span>
              <button className="icon-pill" title="닫기" onClick={()=>setModal(null)}>
                <i className="ph ph-x"></i>
              </button>
            </div>
            <div className="modal-body">
              {modal==='search' ? (
                <div>
                  <div className="field">
                    <label>검색어</label>
                    <input placeholder="고객명 · 라이프코드 · 계정명" autoFocus/>
                  </div>
                  <div className="field">
                    <label>검색 범위</label>
                    <select defaultValue="전체">
                      <option>전체</option><option>고객 기록</option><option>감사 로그</option><option>발송 로그</option>
                    </select>
                  </div>
                </div>
              ) : (
                <div>
                  <div className="field"><label>이름</label><input placeholder="예: 윤태리"/></div>
                  <div className="field">
                    <label>{modal==='new-account'?'역할':'소속 기관'}</label>
                    <select defaultValue="">
                      <option value="" disabled>선택하세요</option>
                      {(modal==='new-account'
                        ? ['운영 총괄','결과 관리자','병원 지원','감사 담당']
                        : ['검사기관 A','공급업체 B','신규 기관 등록']).map(o=><option key={o}>{o}</option>)}
                    </select>
                  </div>
                  <div className="field"><label>연락처</label><input placeholder="예: 02-1234-5678"/></div>
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="pill-btn pill-ghost" onClick={()=>setModal(null)}>취소</button>
              <button className="pill-btn pill-primary" onClick={()=>{
                const m=modal; setModal(null);
                fire(m==='search'?'검색 결과를 불러옵니다':m==='new-account'?'운영 계정을 추가했습니다':'담당자를 추가했습니다');
              }}>확인</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast"><i className="ph-fill ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
