<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACCP 실시간 위생관제 콘솔 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<style>
:root{
  --void:#08060d; --ink:#0e0b16; --recessed:#151020; --badge:#1c1626;
  --border:#2a2338; --accent-tint:#241a33;
  --primary:#e6e6e6; --secondary:#332d40; --accent:#9b6cff; --accent-2:#c9a8ff;
  --text-1:#ffffff; --text-2:#a79fb8; --text-3:#6f6580;
  --ok:#3ecf8e; --warn:#f5b942; --danger:#ff5c72;
  --radius-card:16px; --radius-lg:20px; --radius-pill:9999px; --radius-btn:10px;
  --shadow-key:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 1px rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);
  --shadow-key-accent:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(155,108,255,.35), 0 0 24px -6px rgba(155,108,255,.45);
  --sidebar-w:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app-mount{width:100%;min-height:100vh}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--void); color:var(--text-1); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,92,114,.55)}50%{box-shadow:0 0 0 7px rgba(255,92,114,0)}}
@keyframes pulseGlowOk{0%,100%{box-shadow:0 0 0 0 rgba(62,207,142,.5)}50%{box-shadow:0 0 0 6px rgba(62,207,142,0)}}
@keyframes shimmerSweep{0%{background-position:-360px 0}100%{background-position:360px 0}}
@keyframes gaugeFill{from{stroke-dashoffset:220}to{stroke-dashoffset:var(--dash,140)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastRise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.app-shell{display:flex;width:100%;min-height:100vh}

/* ── 사이드바 ── */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  background:var(--ink);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-key-accent)}
.brand-name{font-size:14px;font-weight:600;color:var(--text-1)}
.brand-sub{font-size:11px;color:var(--text-3);letter-spacing:.02em}
.env-pill{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:var(--radius-pill);background:var(--accent-tint);color:var(--accent-2);border:1px solid rgba(155,108,255,.3)}
.nav-section{margin-bottom:18px}
.nav-title{font-size:10.5px;letter-spacing:.09em;color:var(--text-3);text-transform:uppercase;padding:0 10px 8px}
.nav-link{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;
  border-radius:10px;color:var(--text-2);font-size:13.5px;font-weight:500;transition:all .15s ease;line-height:1.35;
}
.nav-link:hover{background:rgba(255,255,255,.04);color:var(--text-1)}
.nav-link.active{background:var(--accent-tint);color:var(--text-1);box-shadow:inset 0 0 0 1px rgba(155,108,255,.3)}
.nav-link .lucide-wrap{width:17px;height:17px;flex:0 0 17px;color:inherit}
.nav-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.nav-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulseGlowOk 2.2s infinite}
.nav-foot-text{font-size:11.5px;color:var(--text-3)}

/* ── 메인 ── */
.main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;width:calc(100% - var(--sidebar-w));display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 0}
.page-title-row{display:flex;flex-direction:column;gap:4px}
.page-title{font-size:24px;font-weight:600;letter-spacing:-.01em}
.page-sub{font-size:12.5px;color:var(--text-3)}
.page-actions{display:flex;gap:10px}
.btn-ghost{padding:9px 14px;border-radius:var(--radius-btn);background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--text-2);display:flex;align-items:center;gap:6px;transition:all .15s}
.btn-ghost:hover{border-color:var(--accent);color:var(--text-1)}
.btn-primary{padding:9px 16px;border-radius:var(--radius-btn);background:var(--primary);color:#241a33;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px -4px rgba(236,234,243,.25);transition:transform .15s}
.btn-primary:hover{transform:translateY(-1px)}

/* status-strip: 슬림 라이브 상태바 */
.status-strip{
  margin:18px 32px 0;padding:10px 18px;border-radius:var(--radius-pill);
  background:linear-gradient(90deg, var(--recessed) 0%, var(--ink) 50%, var(--recessed) 100%);
  background-size:720px 100%;
  border:1px solid var(--border);display:flex;align-items:center;gap:22px;
  animation:shimmerSweep 6s linear infinite, fadeInUp .5s ease;
}
.status-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.ok{background:var(--ok)}
.status-dot.warn{background:var(--warn)}
.status-dot.danger{background:var(--danger);animation:pulseGlow 1.6s infinite}
.status-strip .sep{width:1px;height:14px;background:var(--border)}
.status-strip .sync{margin-left:auto;font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}

/* stat-row */
.stat-row{margin:16px 32px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:var(--ink);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-key);animation:fadeInUp .5s ease}
.stat-label{font-size:11.5px;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.01em}
.stat-value.accent{color:var(--accent-2)}
.stat-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.stat-delta{font-size:11.5px;font-weight:600}
.stat-delta.up{color:var(--danger)}
.stat-delta.down{color:var(--ok)}
.spark{width:64px;height:26px}

/* primary-focus: 설비 모니터 그리드 */
.section-block{margin:26px 32px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600}
.section-title .lucide-wrap{width:16px;height:16px;margin-right:6px;color:var(--accent-2);vertical-align:-3px}
.chip-row{display:flex;gap:8px}
.chip{padding:6px 12px;border-radius:var(--radius-pill);background:var(--recessed);border:1px solid var(--border);font-size:11.5px;color:var(--text-2);transition:all .15s}
.chip.active{background:var(--accent-tint);color:var(--accent-2);border-color:rgba(155,108,255,.4)}
.chip:hover{color:var(--text-1)}

.equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.equip-tile{
  background:var(--ink);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-key);
  display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;
  animation:fadeInUp .5s ease;
}
.equip-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-key-accent)}
.equip-tile.danger{box-shadow:var(--shadow-key), 0 0 0 1px rgba(255,92,114,.35)}
.equip-tile-head{display:flex;align-items:center;justify-content:space-between}
.equip-name{font-size:13px;font-weight:600}
.equip-zone{font-size:10.5px;color:var(--text-3)}
.gauge-wrap{display:flex;align-items:center;gap:12px}
.gauge-temp{font-size:20px;font-weight:700}
.gauge-temp small{font-size:11px;color:var(--text-3);font-weight:500}
.badge{font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:600}
.badge.ok{background:rgba(62,207,142,.14);color:var(--ok)}
.badge.warn{background:rgba(245,185,66,.14);color:var(--warn)}
.badge.danger{background:rgba(255,92,114,.16);color:var(--danger)}

/* priority-rail table */
.table-card{background:var(--ink);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;animation:fadeInUp .55s ease}
.tab-bar{display:flex;gap:4px;padding:12px 16px 0}
.tab{padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--text-1);border-color:var(--accent)}
.tab:hover{color:var(--text-1)}
.data-toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--recessed);border-radius:var(--radius-btn);padding:8px 12px;border:1px solid var(--border)}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-size:12.5px;color:var(--text-1)}
.export-btn{padding:8px 12px;border-radius:var(--radius-btn);background:var(--recessed);border:1px solid var(--border);font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
table.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11px;color:var(--text-3);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--border)}
.data-table td{padding:11px 16px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-2)}
.data-table tr.row-danger td{color:var(--text-1)}
.data-table tbody tr{transition:background .15s}
.data-table tbody tr:hover{background:rgba(255,255,255,.03)}
.ack-btn{padding:6px 10px;border-radius:8px;background:var(--accent-tint);color:var(--accent-2);font-size:11px;font-weight:600;border:1px solid rgba(155,108,255,.3)}
.ack-btn:disabled{opacity:.4;cursor:default}

/* secondary widgets */
.widget-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 32px 40px}
.widget-card{background:var(--ink);border-radius:var(--radius-card);padding:18px;box-shadow:var(--shadow-key)}
.widget-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* 공용: 화면 컨테이너 */
.view-pad{padding-bottom:40px}

/* ── equipment 화면 ── */
.equip-layout{display:flex;gap:0;margin:20px 32px 40px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--ink)}
.equip-list{width:260px;flex:0 0 260px;border-right:1px solid var(--border);max-height:640px;overflow-y:auto}
.equip-list-item{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s}
.equip-list-item:hover{background:rgba(255,255,255,.03)}
.equip-list-item.active{background:var(--accent-tint)}
.equip-list-name{font-size:13px;font-weight:600;margin-bottom:3px}
.equip-list-meta{font-size:11px;color:var(--text-3)}
.equip-detail{flex:1;padding:24px;min-width:0}
.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.detail-title{font-size:18px;font-weight:700}
.detail-meta{font-size:12px;color:var(--text-3);margin-top:4px}
.range-tabs{display:flex;gap:6px}
.range-tab{padding:7px 12px;border-radius:8px;background:var(--recessed);font-size:11.5px;color:var(--text-3);border:1px solid var(--border)}
.range-tab.active{background:var(--accent-tint);color:var(--accent-2);border-color:rgba(155,108,255,.4)}
.chart-box{height:260px;position:relative;background:var(--recessed);border-radius:var(--radius-card);padding:16px;margin-bottom:20px}
.history-timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:0 0 10px}
.tl-body{flex:1}
.tl-title{font-size:12.5px;font-weight:600}
.tl-time{font-size:11px;color:var(--text-3);margin-top:2px}
.tl-popover{margin-top:8px;padding:10px 12px;background:var(--recessed);border-radius:10px;font-size:11.5px;color:var(--text-2);animation:fadeInUp .25s ease}

/* ── mobile 화면 ── */
.mobile-wrap{display:flex;gap:32px;margin:20px 32px 40px;flex-wrap:wrap}
.phone{width:280px;flex:0 0 280px;background:#000;border-radius:38px;padding:12px;box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.phone-screen{background:var(--ink);border-radius:28px;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.phone-notch{height:26px;display:flex;align-items:center;justify-content:center}
.phone-notch .pill{width:80px;height:6px;border-radius:99px;background:#1c1626}
.phone-status{display:flex;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--text-3)}
.phone-body{flex:1;padding:14px 16px;overflow-y:auto}
.notif-card{background:var(--recessed);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;animation:slideInRight .4s ease}
.notif-icon{width:32px;height:32px;border-radius:10px;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.notif-title{font-size:12.5px;font-weight:600}
.notif-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.mobile-panel-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.floorplan{position:relative;width:100%;height:420px;background:var(--recessed);border-radius:16px;overflow:hidden}
.floor-dot{position:absolute;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#08060d;cursor:pointer;transition:transform .15s}
.floor-dot:hover{transform:scale(1.25)}
.floor-callout{position:absolute;background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fadeInUp .2s ease;z-index:5;min-width:150px}
.mobile-side{flex:1;min-width:280px}
.send-test-btn{margin-top:14px;width:100%;padding:11px;border-radius:var(--radius-btn);background:var(--accent-tint);color:var(--accent-2);font-size:12.5px;font-weight:600;border:1px solid rgba(155,108,255,.35)}

/* ── settings 화면 ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 32px 40px}
.settings-card{background:var(--ink);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-key)}
.settings-card.full{grid-column:1 / -1}
.settings-card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:13px;font-weight:500}
.toggle-desc{font-size:11.5px;color:var(--text-3);margin-top:3px}
.switch{width:42px;height:24px;border-radius:99px;background:var(--secondary);position:relative;transition:background .2s;flex:0 0 42px}
.switch.on{background:var(--accent)}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on .knob{transform:translateX(18px)}
.threshold-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.threshold-row label{font-size:12.5px;color:var(--text-2);flex:0 0 90px}
.threshold-row input[type=range]{flex:1;accent-color:var(--accent)}
.threshold-val{font-size:12.5px;font-weight:600;width:52px;text-align:right}
.role-table td,.role-table th{padding:9px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05)}
.report-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.report-row:last-child{border-bottom:none}
.report-name{font-size:12.5px;font-weight:500}
.report-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--recessed);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--text-2)}
.icon-btn:hover{color:var(--accent-2);border-color:var(--accent)}

/* large text mode */
.large-text{font-size:120%}
.large-text .stat-value{font-size:34px}
.large-text .page-title{font-size:28px}

/* toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:12.5px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:toastRise .3s ease}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,3,8,.7);display:flex;align-items:center;justify-content:center;z-index:90;backdrop-filter:blur(4px)}
.modal-box{background:var(--ink);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;width:420px;max-width:90vw;animation:fadeInUp .25s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:8px;background:var(--recessed);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.modal-body{font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.loading-dot{display:inline-flex;gap:4px}
.loading-dot span{width:6px;height:6px;border-radius:50%;background:var(--accent-2);animation:spinSlow 1s linear infinite}

@media (max-width:1100px){
  .stat-row,.equip-grid{grid-template-columns:repeat(2,1fr)}
  .widget-row,.settings-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-archetype="stripe-multipane">
<div id="app-mount"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
const { LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, ResponsiveContainer, Tooltip, CartesianGrid, XAxis, YAxis } = Recharts;

const EQUIPMENT = [
  { id:'eq1', name:'냉장창고 A동', zone:'원료보관구역', temp:3.2, threshold:5, status:'ok', trend:[3.4,3.3,3.1,3.2,3.0,3.2,3.2] },
  { id:'eq2', name:'냉동창고 B동', zone:'원료보관구역', temp:-17.8, threshold:-15, status:'ok', trend:[-18,-17.9,-17.7,-17.8,-17.6,-17.9,-17.8] },

function Icon({ name, size=16 }){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, [name]);
  return <span className="lucide-wrap" ref={ref}><i data-lucide={name} style={{width:size,height:size}}></i></span>;
}

function Sparkline({ data, color }){
  const w=64,h=26;
  const min=Math.min(...data), max=Math.max(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/((max-min)||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="spark" viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Gauge({ value, threshold, danger, warn }){
  const pct = Math.min(1, Math.max(0, value/(threshold*1.15)));
  const r = 26, c = 2*Math.PI*r;
  const dash = c*(1-pct);
  const color = danger ? 'var(--danger)' : warn ? 'var(--warn)' : 'var(--ok)';
  return (
    <svg width="60" height="60" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r={r} fill="none" stroke="var(--secondary)" strokeWidth="6" />
      <circle cx="30" cy="30" r={r} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round"
        strokeDasharray={c} style={{'--dash':dash, animation:'gaugeFill 1s ease forwards', transform:'rotate(-90deg)', transformOrigin:'30px 30px'}} />
    </svg>
  );
}

function Toast({ items }){
  return (
    <div className="toast-wrap">
      {items.map(t=>(
        <div className="toast" key={t.id}><Icon name="check-circle" size={15}/>{t.text}</div>

  );
}

                  <div className="floor-dot" style={{left:d.x,top:d.y,background:d.color}} onClick={()=>setCallout(callout===d.id?null:d.id)}>{Math.round(e.temp)}</div>
                  {callout===d.id && (
                    <div className="floor-callout" style={{left:`calc(${d.x} + 26px)`, top:d.y}}>
                      <strong>{e.name}</strong><br/>{e.temp}℃ · {e.zone}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsView({ pushToast }){
  const [largeText, setLargeText] = useState(false);
  const [thresholds, setThresholds] = useState({ 살균:90, 냉장:5, 냉동:-15 });
  const roles = [
    { name:'김현장', role:'현장담당자', scope:'가공라인' },
    { name:'박관리', role:'사업장관리자', scope:'전체' },
    { name:'Nguyen Van A', role:'현장담당자', scope:'보관구역' },
  ];
  const reports = [
    { name:'2026년 8월 1주차 HACCP 점검 리포트', meta:'PDF · 1.2MB · 발급 완료' },
    { name:'2026년 7월 4주차 HACCP 점검 리포트', meta:'PDF · 1.1MB · 발급 완료' },
  ];

  useEffect(()=>{
    document.body.classList.toggle('large-text', largeText);
  }, [largeText]);

  return (
    <div className="view-pad">
      <div className="topbar">
        <div className="page-title-row">
          <div className="page-title">설정 및 접근성·리포트</div>
          <div className="page-sub">임계값 · 접근성 · 권한 · 리포트를 한 화면에서 관리합니다</div>
        </div>
      </div>
      <div className="settings-grid">
        <div className="settings-card">
          <h3><Icon name="type" size={15}/>접근성</h3>
          <div className="toggle-row">
            <div>
              <div className="toggle-label">큰글씨 모드</div>
              <div className="toggle-desc">고령자·외국인 근로자를 위해 전 화면의 글자 크기를 확대합니다</div>
            </div>
            <div className={`switch ${largeText?'on':''}`} role="button" tabIndex="0" onClick={()=>setLargeText(v=>!v)}><div className="knob"></div></div>
          </div>
          <div className="toggle-row">
            <div>
              <div className="toggle-label">아이콘 중심 동선</div>
              <div className="toggle-desc">텍스트 의존도를 낮춘 아이콘 우선 내비게이션을 적용합니다</div>
            </div>
            <div className="switch on" role="button" tabIndex="0" onClick={()=>pushToast('아이콘 중심 동선이 유지됩니다')}><div className="knob"></div></div>
          </div>
        </div>

        <div className="settings-card">
          <h3><Icon name="sliders-horizontal" size={15}/>알림 임계값</h3>
          {Object.entries(thresholds).map(([k,v])=>(
            <div className="threshold-row" key={k}>
              <label>{k} 기준</label>
              <input type="range" min="-20" max="100" value={v}
                onChange={e=>setThresholds(t=>({...t,[k]:Number(e.target.value)}))} />
              <div className="threshold-val">{v}℃</div>
            </div>
          ))}
          <button className="btn-primary" style={{marginTop:10}} onClick={()=>pushToast('임계값이 저장되었습니다')}>
            <Icon name="save" size={13}/>저장
          </button>
        </div>

        <div className="settings-card full">
          <h3><Icon name="users" size={15}/>사용자 권한</h3>
          <table className="role-table" style={{width:'100%'}}>
            <thead><tr><th style={{textAlign:'left',color:'var(--text-3)'}}>이름</th><th style={{textAlign:'left',color:'var(--text-3)'}}>직책</th><th style={{textAlign:'left',color:'var(--text-3)'}}>담당 구역</th><th></th></tr></thead>
            <tbody>
              {roles.map((r,i)=>(
                <tr key={i}>
                  <td>{r.name}</td><td>{r.role}</td><td>{r.scope}</td>
                  <td style={{textAlign:'right'}}><button className="icon-btn" onClick={()=>pushToast(`${r.name}님의 권한 편집 화면을 표시합니다`)}><Icon name="pencil" size={13}/></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="settings-card full">
          <h3><Icon name="file-text" size={15}/>식약처 리포트 조회 · 공유</h3>
          {reports.map((r,i)=>(
            <div className="report-row" key={i}>
              <div><div className="report-name">{r.name}</div><div className="report-meta">{r.meta}</div></div>
              <div style={{display:'flex',gap:8}}>
                <button className="icon-btn" onClick={()=>pushToast('리포트를 조회합니다')}><Icon name="eye" size={13}/></button>
                <button className="icon-btn" onClick={()=>pushToast('외부 공유 링크가 생성되었습니다')}><Icon name="share-2" size={13}/></button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);

  function pushToast(text){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }

  return (
    <div className="app-shell" style={{width:'100%'}}>
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><Icon name="shield-check" size={17}/></div>
          <div>
            <div className="brand-name">HACCP Console</div>
            <div className="brand-sub">필드푸드 제1공장</div>
          </div>
          <span className="env-pill">LIVE</span>
        </div>
        <div className="nav-section">
          <div className="nav-title">관제</div>
          {NAV.map(n=>(
            <button key={n.key} className={`nav-link ${view===n.key?'active':''}`} onClick={()=>setView(n.key)} title={n.label}>
              <Icon name={n.icon} size={16}/>{n.label}
            </button>
          ))}
        </div>
        <div className="nav-foot"><span className="dot"></span><span className="nav-foot-text">Supabase Realtime 연결됨</span></div>
      </aside>
      <div className="main-wrap">
        {view==='main' && <MainView pushToast={pushToast} goEquipment={()=>setView('equipment')} />}
        {view==='equipment' && <EquipmentView />}
        {view==='mobile' && <MobileView pushToast={pushToast} />}
        {view==='settings' && <SettingsView pushToast={pushToast} />}
      </div>
      <Toast items={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-mount')).render(<App />);
</script>
</body>
</html>
