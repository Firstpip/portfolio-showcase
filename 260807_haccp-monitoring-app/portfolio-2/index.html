<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 공장 통합 HACCP 관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<style>
:root{
  --ink:#101010; --graphite:#242424; --slate:#6b7280; --silver:#e5e7eb;
  --paper:#f4f4f4; --white:#ffffff;
  --blue:#0099ff; --green:#3ad98a; --green-tint:#e6faf1;
  --danger:#e0553f; --warn:#e0a72e;
  --radius-card:12px; --radius-lg:18px; --radius-pill:9999px;
  --shadow-sm:rgba(36,36,36,.06) 0px 4px 12px 0px;
  --shadow-md:rgba(36,36,36,.09) 0px 8px 24px -6px;
  --topbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app-mount{width:100%;min-height:100vh}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--paper); color:var(--graphite); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased; letter-spacing:-.005em;
}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--silver);border-radius:999px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tileIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes pulseDotGreen{0%,100%{box-shadow:0 0 0 0 rgba(58,217,138,.5)}50%{box-shadow:0 0 0 6px rgba(58,217,138,0)}}
@keyframes pulseDotRed{0%,100%{box-shadow:0 0 0 0 rgba(224,85,63,.5)}50%{box-shadow:0 0 0 6px rgba(224,85,63,0)}}
@keyframes barRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ringDraw{from{stroke-dashoffset:220}to{stroke-dashoffset:var(--dash,60)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.app-root{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* ── 상단 네비 (topnav-hero) ── */
.topnav{
  height:var(--topbar-h);width:100%;background:var(--white);border-bottom:1px solid var(--silver);
  display:flex;align-items:center;padding:0 28px;gap:28px;position:sticky;top:0;z-index:30;
}
.topnav-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.topnav-brand .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center}
.topnav-tabs{display:flex;gap:4px;flex:1}
.topnav-tab{padding:9px 15px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--slate);display:flex;align-items:center;gap:7px;transition:all .15s}
.topnav-tab:hover{background:var(--paper);color:var(--ink)}
.topnav-tab.active{background:var(--ink);color:var(--white)}
.topnav-actions{display:flex;align-items:center;gap:10px}
.pill-btn{padding:9px 16px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill-btn.dark{background:var(--ink);color:var(--white)}
.pill-btn.ghost{background:var(--paper);color:var(--graphite);border:1px solid var(--silver)}
.pill-btn:hover{transform:translateY(-1px);transition:transform .15s}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}

.page-wrap{flex:1;width:100%;max-width:1360px;margin:0 auto;padding:24px 28px 48px}

/* hero intro band (topnav-hero 시그니처) */
.hero-band{
  background:linear-gradient(120deg,var(--white) 0%, var(--green-tint) 100%);
  border:1px solid var(--silver);border-radius:var(--radius-lg);padding:26px 30px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;animation:fadeInUp .5s ease;
}
.hero-title{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero-sub{font-size:12.5px;color:var(--slate);margin-top:5px}
.hero-cta{display:flex;gap:10px}

/* ── bento grid ── */
.bento{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
}
.tile{
  background:var(--white);border-radius:var(--radius-lg);padding:20px;
  box-shadow:var(--shadow-sm);animation:tileIn .4s ease; transition:box-shadow .2s ease, transform .2s ease;
}
.tile:hover{box-shadow:var(--shadow-md);transform:scale(1.015)}
.tile-feature{grid-column:span 2;grid-row:span 2}
.tile-wide{grid-column:span 2}
.tile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tile-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.tile-title i{color:var(--green);font-size:16px}
.tile-badge{font-size:10.5px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--green-tint);color:#1c8a5c;font-weight:600}

.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heatmap .cell{aspect-ratio:1;border-radius:4px;transform-origin:bottom;animation:barRise .5s ease both}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:pulseDotGreen 2s infinite}
.anomaly-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px}
.anomaly-dot.danger{background:var(--danger);animation:pulseDotRed 1.6s infinite}
.anomaly-dot.warn{background:var(--warn)}
.heatmap-legend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--slate)}
.legend-sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:4px}

.metric-num{font-size:30px;font-weight:800;letter-spacing:-.02em}
.metric-label{font-size:11.5px;color:var(--slate);margin-top:4px}
.metric-delta{font-size:11px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:4px}
.metric-delta.up{color:var(--green)}
.metric-delta.down{color:var(--danger)}

.site-list{display:flex;flex-direction:column;gap:0}
.site-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--paper);cursor:pointer;transition:background .15s;border-radius:8px}
.site-row:hover{background:var(--paper)}
.site-row:last-child{border-bottom:none}
.site-name{font-size:12.5px;font-weight:600}
.site-meta{font-size:11px;color:var(--slate)}
.site-score{font-size:13px;font-weight:700}
.site-score.warn{color:var(--warn)}
.site-score.ok{color:var(--green)}

.widget-feed{display:flex;flex-direction:column;gap:10px}
.feed-item{display:flex;gap:10px;align-items:flex-start;animation:fadeInUp .4s ease}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px}
.feed-text{font-size:12px}
.feed-time{font-size:10.5px;color:var(--slate);margin-top:2px}

.pred-tile-ring{display:flex;align-items:center;gap:14px}
.pred-num{font-size:22px;font-weight:800}

/* ── compliance-report ── */
.crumb{font-size:12px;color:var(--slate);margin-bottom:6px}
.section-title{font-size:20px;font-weight:700;margin-bottom:4px}
.section-sub{font-size:12.5px;color:var(--slate);margin-bottom:18px}
.report-panel{display:grid;grid-template-columns:1.1fr 1.4fr;gap:18px}
.card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.freq-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--paper)}
.freq-row:last-child{border-bottom:none}
.seg{display:flex;background:var(--paper);border-radius:var(--radius-pill);padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;color:var(--slate)}
.seg button.active{background:var(--ink);color:var(--white)}
.report-list{margin-top:6px}
.report-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--paper)}
.report-item:last-child{border-bottom:none}
.status-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill)}
.status-pill.done{background:var(--green-tint);color:#1c8a5c}
.status-pill.wait{background:#fff4e0;color:#a06a10}
.status-pill.fail{background:#fdeceb;color:#b23a26}
.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;border:1px solid var(--silver)}
.icon-btn:hover{border-color:var(--green)}

/* ── anomaly-detection ── */
.anomaly-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.chart-box{height:280px;position:relative}
.anomaly-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.anomaly-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--paper)}
.anomaly-item.acked{opacity:.5}
.confirm-btn{padding:7px 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:11px;font-weight:600}
.confirm-btn:disabled{background:var(--silver);color:var(--slate)}

/* ── access-control ── */
.perm-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.tier-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--paper)}
.tier-row:last-child{border-bottom:none}
.tier-name{font-size:12.5px;font-weight:600}
.tier-desc{font-size:11px;color:var(--slate)}
.perm-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--silver);display:flex;align-items:center;justify-content:center}
.perm-check.on{background:var(--green);border-color:var(--green);color:#fff}
.audit-table{width:100%;border-collapse:collapse}
.audit-table th{text-align:left;font-size:10.5px;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--silver)}
.audit-table td{padding:10px;font-size:12px;border-bottom:1px solid var(--paper)}
.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-chip{padding:6px 12px;border-radius:var(--radius-pill);background:var(--paper);font-size:11.5px;font-weight:500;border:1px solid var(--silver)}
.filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* toast / modal */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 15px;font-size:12.5px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(0,0,0,.2);animation:toastRise .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,.35);display:flex;align-items:center;justify-content:center;z-index:90}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:24px;width:400px;max-width:90vw;animation:fadeInUp .25s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

@media (max-width:1100px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .tile-feature{grid-column:span 2}
  .report-panel,.anomaly-grid,.perm-layout{grid-template-columns:1fr}
}
</style>
</head>
<body data-archetype="bento-grid">
<div id="app-mount"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { LineChart, Line, AreaChart, Area, ResponsiveContainer, Tooltip, CartesianGrid, XAxis, YAxis } = Recharts;

const SITES = [
  { id:'s1', name:'제1공장 (본사)', region:'경기 화성', score:96, alerts:2 },
  { id:'s2', name:'제2공장', region:'충북 음성', score:88, alerts:5 },
  { id:'s3', name:'제3공장', region:'전남 나주', score:99, alerts:0 },
  { id:'s4', name:'제4공장(위탁)', region:'경북 구미', score:79, alerts:9 },
  { id:'s5', name:'제5공장', region:'경남 김해', score:93, alerts:3 },
];

const REPORTS = [
  { id:'r1', site:'제1공장', period:'2026년 8월 1주차', status:'done' },
  { id:'r2', site:'제2공장', period:'2026년 8월 1주차', status:'wait' },
  { id:'r3', site:'제4공장(위탁)', period:'2026년 7월 4주차', status:'fail' },
  { id:'r4', site:'제3공장', period:'2026년 7월 4주차', status:'done' },
];

const ANOMALIES = [
  { id:'a1', site:'제4공장 · 살균라인', msg:'표준편차 이탈 패턴 감지 — 경보 임계값 도달 전 사전 경고', level:'danger' },
  { id:'a2', site:'제2공장 · 냉장창고', msg:'완만한 상승 추세 — 24시간 내 임계값 근접 예상', level:'warn' },
  { id:'a3', site:'제5공장 · 포장구역', msg:'습도 이동평균 이탈 — 관찰 유지 권장', level:'warn' },
];

const AUDIT_LOG = [
  { time:'10:02', user:'박관리(최고관리자)', action:'임계값 변경', target:'제4공장 살균라인' },
  { time:'09:41', user:'이감독(사업장관리자)', action:'리포트 발급', target:'제1공장' },
  { time:'09:20', user:'Nguyen Van A(현장담당자)', action:'경보 확인 처리', target:'제2공장' },
  { time:'08:55', user:'박관리(최고관리자)', action:'권한 변경', target:'김현장 → 사업장관리자' },
  { time:'08:10', user:'이감독(사업장관리자)', action:'리포트 발급', target:'제3공장' },
];

const NAV = [
  { key:'main', label:'다중 사업장 통합 관제 허브', icon:'squares-four' },
  { key:'compliance-report', label:'HACCP 규정 준수 리포트 자동화', icon:'file-text' },
  { key:'anomaly-detection', label:'이상 패턴 분석 및 예측 알림', icon:'chart-line-up' },
  { key:'access-control', label:'근무자 권한 관리 및 감사로그', icon:'shield-check' },
];

function Icon({ name, size=16, weight='' }){
  return <i className={`ph${weight?'-'+weight:''} ph-${name}`} style={{fontSize:size}}></i>;
}

function Toast({ items }){
  return <div className="toast-wrap">{items.map(t=>(<div className="toast" key={t.id}><Icon name="check-circle" size={15}/>{t.text}</div>))}</div>;
}

function HeatCell({ v }){
  const color = v>80 ? '#3ad98a' : v>55 ? '#f0c94a' : '#e0553f';
  const alpha = 0.35 + (v/100)*0.65;
  return <div className="cell" style={{background:color, opacity:alpha}}></div>;
}

function MainView({ pushToast, goto }){
  const heat = useMemo(()=>Array.from({length:60},()=> Math.round(40 + Math.random()*60)), []);
  return (
    <div className="page-wrap">
      <div className="hero-band">
        <div>
          <div className="hero-title">다중 사업장 통합 관제 허브</div>
          <div className="hero-sub"><span className="live-dot"></span>5개 사업장의 HACCP 준수 현황을 하나의 화면에서 비교하고 통제합니다</div>
        </div>
        <div className="hero-cta">
          <button className="pill-btn ghost" onClick={()=>pushToast('전체 사업장 리포트를 내보냅니다')}><Icon name="export"/>전체 내보내기</button>
          <button className="pill-btn dark" onClick={()=>goto('compliance-report')}><Icon name="file-text"/>리포트 관리</button>
        </div>
      </div>

      <div className="bento">
        <div className="tile tile-feature">
          <div className="tile-head">
            <div className="tile-title"><Icon name="chart-line-up"/>다중 사업장 온도 이상 추이 히트맵</div>
            <span className="tile-badge">최근 60시간</span>
          </div>
          <div className="heatmap">
            {heat.map((v,i)=>(<HeatCell key={i} v={v} />))}
          </div>
          <div className="heatmap-legend">
            <span><span className="legend-sw" style={{background:'#3ad98a'}}></span>안정</span>
            <span><span className="legend-sw" style={{background:'#f0c94a'}}></span>주의</span>
            <span><span className="legend-sw" style={{background:'#e0553f'}}></span>이상</span>
          </div>
        </div>

        <div className="tile">
          <div className="tile-head"><div className="tile-title"><Icon name="check-circle"/>평균 규정 준수율</div></div>
          <div className="metric-num">91%</div>
          <div className="metric-label">5개 사업장 평균</div>
          <div className="metric-delta up"><Icon name="trend-up" size={12}/>전주 대비 +2%p</div>
        </div>
        <div className="tile">
          <div className="tile-head"><div className="tile-title"><Icon name="bell-ringing"/>금일 경보 발생</div></div>
          <div className="metric-num" style={{color:'var(--danger)'}}>19건</div>
          <div className="metric-label">전 사업장 합계</div>
          <div className="metric-delta down"><Icon name="trend-down" size={12}/>전일 대비 +4건</div>
        </div>

        <div className="tile tile-wide">
          <div className="tile-head"><div className="tile-title"><Icon name="buildings"/>사업장별 현황</div></div>
          <div className="site-list">
            {SITES.map((s,i)=>(
              <div className="site-row" key={s.id} style={{animation:`fadeInUp .4s ease ${i*0.06}s both`}} onClick={()=>pushToast(`${s.name} 상세 현황을 표시합니다`)}>
                <div><div className="site-name">{s.name}</div><div className="site-meta">{s.region} · 경보 {s.alerts}건</div></div>
                <div className={`site-score ${s.score>=90?'ok':'warn'}`}>{s.score}점</div>
              </div>
            ))}
          </div>
        </div>

        <div className="tile">
          <div className="tile-head"><div className="tile-title"><Icon name="file-text"/>리포트 발급</div></div>
          <div className="widget-feed">
            {REPORTS.slice(0,3).map(r=>(
              <div className="feed-item" key={r.id}>
                <span className="feed-dot" style={{background: r.status==='done'?'var(--green)':r.status==='wait'?'var(--warn)':'var(--danger)'}}></span>
                <div><div className="feed-text">{r.site} · {r.period}</div><div className="feed-time">{r.status==='done'?'발급 완료':r.status==='wait'?'생성 대기':'재시도 필요'}</div></div>
              </div>
            ))}
          </div>
        </div>
        <div className="tile">
          <div className="tile-head"><div className="tile-title"><Icon name="clock-counter-clockwise"/>권한 변경 이력</div></div>
          <div className="widget-feed">
            {AUDIT_LOG.slice(0,3).map((a,i)=>(
              <div className="feed-item" key={i}>
                <span className="feed-dot" style={{background:'var(--blue)'}}></span>
                <div><div className="feed-text">{a.user} · {a.action}</div><div className="feed-time">{a.time} · {a.target}</div></div>
              </div>
            ))}
          </div>
        </div>
        <div className="tile">
          <div className="tile-head"><div className="tile-title"><Icon name="lightning"/>예측 알림</div></div>
          <div className="pred-tile-ring">
            <svg width="56" height="56" viewBox="0 0 56 56">
              <circle cx="28" cy="28" r="24" fill="none" stroke="#e5e7eb" strokeWidth="6"/>
              <circle cx="28" cy="28" r="24" fill="none" stroke="var(--warn)" strokeWidth="6" strokeLinecap="round"
                strokeDasharray="150.8" style={{'--dash':60, animation:'ringDraw 1s ease forwards', transform:'rotate(-90deg)', transformOrigin:'28px 28px'}} />
            </svg>
            <div><div className="pred-num">3건</div><div className="metric-label">사전 경고 대기</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ComplianceReportView({ pushToast }){
  const [freq, setFreq] = useState('weekly');
  const [reports, setReports] = useState(REPORTS);

  function retry(id){
    setReports(rs=>rs.map(r=>r.id===id?{...r,status:'wait'}:r));
    pushToast('리포트 재생성이 큐에 등록되었습니다');
    setTimeout(()=>{
      setReports(rs=>rs.map(r=>r.id===id?{...r,status:'done'}:r));
    }, 1500);
  }

  return (
    <div className="page-wrap">
      <div className="crumb">관제 허브 / 리포트 자동화</div>
      <div className="section-title">HACCP 규정 준수 리포트 자동화</div>
      <div className="section-sub">사업장별 발급 주기를 설정하고 Bull Queue 기반 생성 상태를 추적합니다</div>
      <div className="report-panel">
        <div className="card">
          <div className="tile-title" style={{marginBottom:14}}><Icon name="calendar-check"/>발급 주기 설정</div>
          <div className="seg" style={{marginBottom:16}}>
            {[['weekly','주간'],['biweekly','격주'],['monthly','월간']].map(([k,l])=>(
              <button key={k} className={freq===k?'active':''} onClick={()=>{ setFreq(k); pushToast(`발급 주기가 ${l}으로 변경되었습니다`); }}>{l}</button>
            ))}
          </div>
          {SITES.slice(0,4).map(s=>(
            <div className="freq-row" key={s.id}>
              <div className="site-name">{s.name}</div>
              <div className="site-meta">{freq==='weekly'?'매주 월요일':freq==='biweekly'?'격주 월요일':'매월 1일'} 09:00</div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="tile-title" style={{marginBottom:14}}><Icon name="tray-arrow-down"/>발급 이력</div>
          <div className="report-list">
            {reports.map(r=>(
              <div className="report-item" key={r.id}>
                <div><div className="site-name">{r.site}</div><div className="site-meta">{r.period}</div></div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span className={`status-pill ${r.status}`}>{r.status==='done'?'발급 완료':r.status==='wait'?'생성중':'실패'}</span>
                  {r.status==='fail' ? (
                    <button className="icon-btn" onClick={()=>retry(r.id)}><Icon name="arrow-clockwise" size={14}/></button>
                  ) : (
                    <button className="icon-btn" onClick={()=>pushToast(`${r.site} 리포트를 다운로드합니다`)}><Icon name="download-simple" size={14}/></button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function AnomalyDetectionView({ pushToast }){
  const [range, setRange] = useState('24h');
  const [acked, setAcked] = useState({});
  const data = useMemo(()=>{
    const n = range==='24h'?24:range==='7d'?7:30;
    return Array.from({length:n},(_,i)=>({
      t: range==='24h' ? `${i}시` : range==='7d' ? `${i+1}일전` : `${i+1}`,
      actual: 60 + Math.sin(i/3)*8 + (i>n-4?6:0),
      upper: 68 + Math.sin(i/3)*8,
      lower: 52 + Math.sin(i/3)*8,
    }));
  }, [range]);

  return (
    <div className="page-wrap">
      <div className="crumb">관제 허브 / 이상 탐지</div>
      <div className="section-title">이상 패턴 분석 및 예측 알림</div>
      <div className="section-sub">이동평균·표준편차 기반 이상탐지와 예측 신뢰구간을 함께 확인합니다</div>
      <div className="anomaly-grid">
        <div className="card">
          <div className="tile-head">
            <div className="tile-title"><Icon name="chart-line-up"/>예측 신뢰구간 vs 실측값</div>
            <div className="seg">
              {[['24h','24시간'],['7d','7일'],['30d','30일']].map(([k,l])=>(
                <button key={k} className={range===k?'active':''} onClick={()=>setRange(k)}>{l}</button>
              ))}
            </div>
          </div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={data}>
                <CartesianGrid strokeDasharray="3 3" stroke="#eee" vertical={false}/>
                <XAxis dataKey="t" tick={{fill:'#6b7280',fontSize:10.5}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fill:'#6b7280',fontSize:10.5}} axisLine={false} tickLine={false}/>
                <Tooltip contentStyle={{borderRadius:8,fontSize:11,border:'1px solid #e5e7eb'}}/>
                <Area type="monotone" dataKey="upper" stroke="none" fill="#3ad98a" fillOpacity={0.12}/>
                <Area type="monotone" dataKey="lower" stroke="none" fill="#ffffff" fillOpacity={1}/>
                <Line type="monotone" dataKey="actual" stroke="#101010" strokeWidth={2.2} dot={false}/>
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="card">
          <div className="tile-title" style={{marginBottom:10}}><Icon name="warning"/>사전 경고 목록</div>
          <div className="anomaly-list">
            {ANOMALIES.map(a=>(
              <div className={`anomaly-item ${acked[a.id]?'acked':''}`} key={a.id}>
                <div style={{display:'flex',gap:10}}>
                  <span className={`anomaly-dot ${a.level}`}></span>
                  <div>
                    <div className="site-name">{a.site}</div>
                    <div className="site-meta" style={{marginTop:3}}>{a.msg}</div>
                  </div>
                </div>
                <button className="confirm-btn" disabled={acked[a.id]}
                  onClick={()=>{ setAcked(x=>({...x,[a.id]:true})); pushToast('이상 패턴 알림이 처리완료로 표시됩니다'); }}>
                  {acked[a.id] ? '처리완료' : '확인'}
                </button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function AccessControlView({ pushToast }){
  const [tierEdit, setTierEdit] = useState({ 최고관리자:{read:true,write:true,report:true}, 사업장관리자:{read:true,write:true,report:true}, 현장담당자:{read:true,write:false,report:false}, 조회전용:{read:true,write:false,report:false} });
  const [filter, setFilter] = useState('전체');

  function toggle(tier, perm){
    if (tier==='최고관리자') { pushToast('최고관리자 권한은 고정 값입니다'); return; }
    setTierEdit(t=>({...t,[tier]:{...t[tier],[perm]:!t[tier][perm]}}));
    pushToast(`${tier}의 권한이 변경되어 감사로그에 기록됩니다`);
  }

  const filteredLog = filter==='전체' ? AUDIT_LOG : AUDIT_LOG.filter(a=>a.action===filter);

  return (
    <div className="page-wrap">
      <div className="crumb">관제 허브 / 권한 관리</div>
      <div className="section-title">근무자 권한 관리 및 감사로그</div>
      <div className="section-sub">4단계 권한 계층과 조작 이력을 사업장 단위로 추적합니다</div>
      <div className="perm-layout">
        <div className="card">
          <div className="tile-title" style={{marginBottom:12}}><Icon name="shield-check"/>권한 계층</div>
          {Object.entries(tierEdit).map(([tier,perm])=>(
            <div className="tier-row" key={tier}>
              <div><div className="tier-name">{tier}</div><div className="tier-desc">조회 · 변경 · 리포트 발급</div></div>
              <div style={{display:'flex',gap:6}}>
                {['read','write','report'].map(p=>(
                  <div key={p} className={`perm-check ${perm[p]?'on':''}`} role="button" tabIndex="0" onClick={()=>toggle(tier,p)}>
                    {perm[p] && <Icon name="check" size={12}/>}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="tile-title" style={{marginBottom:12}}><Icon name="clock-counter-clockwise"/>감사로그</div>
          <div className="filter-row" style={{animation:'slideDown .3s ease'}}>
            {['전체','임계값 변경','리포트 발급','경보 확인 처리','권한 변경'].map(f=>(
              <button key={f} className={`filter-chip ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>
            ))}
          </div>
          <table className="audit-table">
            <thead><tr><th>시각</th><th>사용자</th><th>조작</th><th>대상</th></tr></thead>
            <tbody>
              {filteredLog.length ? filteredLog.map((a,i)=>(
                <tr key={i}><td>{a.time}</td><td>{a.user}</td><td>{a.action}</td><td>{a.target}</td></tr>
              )) : (
                <tr><td colSpan="4" style={{color:'var(--slate)',padding:'16px 10px'}}>해당 조건의 이력이 없습니다</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(text){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }
  return (
    <div className="app-root">
      <nav className="topnav">
        <div className="topnav-brand"><div className="mark"><Icon name="shield-check" size={16}/></div>Compliance Hub</div>
        <div className="topnav-tabs">
          {NAV.map(n=>(
            <button key={n.key} className={`topnav-tab ${view===n.key?'active':''}`} onClick={()=>setView(n.key)} title={n.label}>
              <Icon name={n.icon} size={15}/>{n.label}
            </button>
          ))}
        </div>
        <div className="topnav-actions">
          <button className="pill-btn ghost" onClick={()=>pushToast('알림 센터를 표시합니다')}><Icon name="bell"/></button>
          <div className="avatar-chip">관</div>
        </div>
      </nav>
      {view==='main' && <MainView pushToast={pushToast} goto={setView} />}
      {view==='compliance-report' && <ComplianceReportView pushToast={pushToast} />}
      {view==='anomaly-detection' && <AnomalyDetectionView pushToast={pushToast} />}
      {view==='access-control' && <AccessControlView pushToast={pushToast} />}
      <Toast items={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-mount')).render(<App />);
</script>
</body>
</html>
