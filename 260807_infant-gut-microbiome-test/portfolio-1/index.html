<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이크로베베 — 영유아 장내미생물 검사 신청 서비스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --primary:#006bff; --ink:#0b3558; --stone:#476788; --mist:#a6bbd1;
  --cloud:#f8f9fb; --paper:#ffffff; --pebble:#f0f3f8; --hairline:#d4e0ed;
  --accent:#e55cff; --cyan:#0099ff;
  --pos:#0f9d63; --warn:#c8860a; --neg:#e0472b;
  --radius-card:20px; --radius-btn:8px; --radius-pill:9999px;
  --shadow-card:0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 30px 50px rgba(71,103,136,.08);
  --shadow-sm:0 4px 5px rgba(71,103,136,.04), 0 4px 10px rgba(71,103,136,.03), 0 10px 20px rgba(71,103,136,.05);
  --shadow-pop:0 24px 60px -18px rgba(11,53,88,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app-root{width:100%;min-height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cloud); color:var(--ink);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--mist);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(15,157,99,.5)}50%{box-shadow:0 0 0 7px rgba(15,157,99,0)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── shell ── */
.shell{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--paper);border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding:22px 16px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;margin-bottom:14px;border-bottom:1px solid var(--hairline)}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--cyan));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(0,107,255,.5)}
.brand-mark i{color:#fff;width:19px;height:19px}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--stone);font-weight:600}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.side-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;color:var(--stone);transition:all .15s ease;text-align:left}
.side-link:hover{background:var(--pebble);color:var(--ink)}
.side-link.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
.side-link i{width:18px;height:18px;flex:0 0 auto}
.side-link .badge-count{margin-left:auto;background:var(--pebble);color:var(--primary);font-size:11px;font-weight:800;padding:2px 8px;border-radius:var(--radius-pill)}
.side-link.active .badge-count{background:rgba(255,255,255,.25);color:#fff}
.side-foot{border-top:1px solid var(--hairline);padding-top:14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.side-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5683da,var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;flex:0 0 auto}
.side-foot-name{font-size:12.5px;font-weight:700}
.side-foot-role{font-size:11px;color:var(--stone)}

.main-wrap{flex:1;min-width:0;width:calc(100% - 248px);margin-left:248px;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;background:rgba(248,249,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--radius-btn);padding:9px 13px}
.search-box i{width:15px;height:15px;color:var(--mist)}
.search-box input{border:none;outline:none;flex:1;font-size:13px;color:var(--ink);background:none}
.topbar-spacer{flex:1}
.icon-btn{position:relative;width:38px;height:38px;border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;color:var(--stone);transition:background .15s ease}
.icon-btn:hover{background:var(--pebble);color:var(--ink)}
.icon-btn i{width:18px;height:18px}
.notif-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--cloud)}

.content{flex:1;padding:24px 28px 64px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-title{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.page-sub{font-size:14px;color:var(--stone);margin-top:6px;max-width:560px}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:var(--radius-btn);background:var(--primary);color:#fff;font-size:14px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .12s ease}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary i{width:16px;height:16px}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:var(--radius-btn);background:var(--paper);border:1px solid var(--hairline);font-size:13.5px;font-weight:600;color:var(--ink)}
.btn-ghost:hover{border-color:var(--mist)}
.btn-ghost i{width:15px;height:15px}
.btn-dark{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:var(--radius-btn);background:var(--ink);color:#fff;font-size:14px;font-weight:700}
.btn-dark:hover{opacity:.92}

/* ── master-detail ── */
.master-detail{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.list-rail{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .35s ease}
.list-rail-search{display:flex;align-items:center;gap:8px;background:var(--pebble);border-radius:var(--radius-btn);padding:9px 12px}
.list-rail-search input{border:none;outline:none;background:none;flex:1;font-size:13px}
.list-rail-search i{width:14px;height:14px;color:var(--mist)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:6px 12px;border-radius:var(--radius-pill);background:var(--pebble);font-size:11.5px;font-weight:700;color:var(--stone);transition:all .15s ease}
.filter-chip:hover{background:var(--hairline)}
.filter-chip.active{background:var(--ink);color:#fff}
.rail-list{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto}
.rail-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:14px;text-align:left;transition:background .15s ease;border:1px solid transparent}
.rail-item:hover{background:var(--pebble)}
.rail-item.selected{background:rgba(0,107,255,.08);border-color:rgba(0,107,255,.25)}
.rail-avatar{width:36px;height:36px;border-radius:11px;background:var(--pebble);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--primary);flex:0 0 auto}
.rail-main{flex:1;min-width:0}
.rail-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-sub{font-size:11.5px;color:var(--stone);margin-top:2px}
.stage-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:800;flex:0 0 auto}
.stage-badge.s1{background:#eef2f7;color:var(--stone)}
.stage-badge.s2{background:rgba(0,107,255,.1);color:var(--primary)}
.stage-badge.s3{background:rgba(200,134,10,.14);color:var(--warn)}
.stage-badge.s4{background:rgba(229,92,255,.12);color:#a020c9}
.stage-badge.s5{background:rgba(15,157,99,.12);color:var(--pos)}

.detail-panel{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:26px;animation:fadeUp .4s ease;min-height:560px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--hairline);margin-bottom:18px}
.detail-title{font-size:22px;font-weight:800}
.detail-meta{font-size:12.5px;color:var(--stone);margin-top:5px}
.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.field{background:var(--pebble);border-radius:14px;padding:13px 15px}
.field .fl{font-size:11px;color:var(--stone);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.field .fv{font-size:14px;font-weight:700}
.section-label{font-size:12.5px;font-weight:800;color:var(--stone);text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px}
.stepper{display:flex;align-items:center;gap:0;margin-bottom:22px}
.step-node{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--pebble);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mist);z-index:2}
.step-node.done .step-dot{background:var(--pos);color:#fff}
.step-node.current .step-dot{background:var(--primary);color:#fff;animation:pulseDot 1.8s ease-in-out infinite}
.step-label{font-size:11px;font-weight:700;color:var(--stone);text-align:center}
.step-node.done .step-label,.step-node.current .step-label{color:var(--ink)}
.step-line{position:absolute;top:15px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--hairline);z-index:1}
.step-node.done .step-line{background:var(--pos)}
.api-log-list{display:flex;flex-direction:column;gap:8px}
.api-log-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--pebble);border-radius:12px;font-size:12.5px}
.api-log-row i{width:14px;height:14px;color:var(--pos);flex:0 0 auto}
.api-log-dir{font-weight:700;color:var(--ink)}
.api-log-time{margin-left:auto;color:var(--stone);font-size:11.5px}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc-card{border:1px solid var(--hairline);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:all .15s ease}
.doc-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.doc-card i{width:20px;height:20px;color:var(--primary)}
.doc-card-title{font-size:12.5px;font-weight:700}
.doc-card-sub{font-size:11px;color:var(--stone)}
.detail-actions{display:flex;gap:8px;margin-top:22px;justify-content:flex-end}
.empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:520px;color:var(--stone)}
.empty-detail i{width:52px;height:52px;color:var(--mist)}

/* ── status ── */
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.status-card{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;animation:fadeUp .4s ease}
.status-card:hover{transform:translateY(-3px);box-shadow:0 26px 50px -22px rgba(11,53,88,.28)}
.status-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--pos)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);animation:pulseDot 1.6s ease-in-out infinite}
.mini-stepper{display:flex;align-items:center;gap:0;margin:14px 0 10px}
.mini-node{width:9px;height:9px;border-radius:50%;background:var(--hairline);flex:0 0 auto}
.mini-node.done{background:var(--pos)}
.mini-node.current{background:var(--primary);width:11px;height:11px;box-shadow:0 0 0 4px rgba(0,107,255,.18)}
.mini-track{flex:1;height:2px;background:var(--hairline)}
.mini-track.done{background:var(--pos)}
.status-card-bottom{display:flex;justify-content:space-between;font-size:11.5px;color:var(--stone)}

/* ── questionnaire ── */
.qform-wrap{max-width:680px;margin:0 auto}
.qform-card{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:30px;animation:fadeUp .4s ease}
.qstepper{display:flex;gap:8px;margin-bottom:26px}
.qstep{flex:1;height:5px;border-radius:99px;background:var(--hairline);overflow:hidden}
.qstep.active .qstep-fill{display:block;height:100%;background:var(--primary);animation:barGrow .4s ease both;transform-origin:left}
.qstep.done{background:var(--pos)}
.qform-group{margin-bottom:18px}
.qform-label{font-size:13px;font-weight:700;margin-bottom:7px;display:block}
.qform-input{width:100%;padding:12px 14px;border-radius:var(--radius-btn);border:1px solid var(--hairline);font-size:14px;background:var(--pebble);outline:none;transition:border-color .15s ease}
.qform-input:focus{border-color:var(--primary);background:var(--paper)}
.qform-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qform-options{display:flex;gap:8px;flex-wrap:wrap}
.qopt{padding:9px 15px;border-radius:var(--radius-pill);border:1px solid var(--hairline);font-size:13px;font-weight:600;color:var(--stone);transition:all .15s ease}
.qopt.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.autosave-tag{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--stone);margin-top:16px}
.autosave-tag i{width:13px;height:13px}
.autosave-tag.saving{color:var(--primary)}
.autosave-tag.saving .shimmer-bar{width:60px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--pebble) 25%,var(--primary) 50%,var(--pebble) 75%);background-size:200px 100%;animation:shimmer 1.1s linear infinite}
.qform-actions{display:flex;justify-content:space-between;margin-top:24px}

/* ── result viewer ── */
.result-layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.result-list{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:6px;animation:fadeUp .35s ease}
.result-row{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:13px;text-align:left}
.result-row:hover{background:var(--pebble)}
.result-row.selected{background:rgba(0,107,255,.08)}
.viewer-card{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:0;overflow:hidden;animation:fadeUp .4s ease}
.viewer-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--hairline)}
.viewer-page{min-height:420px;padding:32px;display:flex;flex-direction:column;gap:16px}
.result-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.page-nav{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--hairline)}
.page-dots{display:flex;gap:5px;flex:1;justify-content:center}
.page-dot{width:7px;height:7px;border-radius:50%;background:var(--hairline)}
.page-dot.active{background:var(--primary);width:18px;border-radius:99px}
.metric-donut-wrap{display:flex;align-items:center;gap:18px}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(11,53,88,.45);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeUp .18s ease}
.modal{width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:24px;padding:26px;box-shadow:var(--shadow-pop)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:19px;font-weight:800}
.close-btn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--stone)}
.close-btn:hover{background:var(--pebble)}
.close-btn i{width:16px;height:16px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:200;display:flex;align-items:center;gap:9px;animation:toastIn .25s cubic-bezier(.2,.8,.3,1) both;box-shadow:var(--shadow-pop)}
.toast i{width:16px;height:16px;color:#5df0c3}

@media (max-width:1080px){
  .sidebar{display:none}
  .main-wrap{margin-left:0;width:100%}
  .master-detail,.result-layout{grid-template-columns:1fr}
  .field-grid,.doc-grid,.qform-row,.result-summary-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function Toast({text,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2400);return ()=>clearTimeout(t)},[]);
  return <div className="toast"><i data-lucide="check-circle-2"></i>{text}</div>;
}

function StageStepper({stage}){
  return (
    <div className="stepper">
      {STAGES.map((s,i)=>{
        const idx=i+1;
        const cls = idx<stage ? 'done' : idx===stage ? 'current' : '';
        return (
          <div className={"step-node "+cls} key={s}>
            {i<STAGES.length-1 && <span className="step-line"></span>}
            <span className="step-dot">{idx<stage?<i data-lucide="check" style={{width:14,height:14}}></i>:idx}</span>
            <span className="step-label">{s}</span>
          </div>
        );
      })}
    </div>
  );
}

function QuestionnaireView({notify}){
  const [step,setStep] = useState(0);
  const [child,setChild] = useState({name:'',birth:'',gender:''});
  const [answers,setAnswers] = useState({});
  const [saveState,setSaveState] = useState('idle');
  const saveTimer = useRef(null);

  const triggerAutosave = ()=>{
    setSaveState('saving');
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>setSaveState('saved'),1200);
  };

  const setChildField = (k,v)=>{ setChild(prev=>({...prev,[k]:v})); triggerAutosave(); };
  const setAnswer = (k,v)=>{ setAnswers(prev=>({...prev,[k]:v})); triggerAutosave(); };

  const canNext = step===0 ? (child.name && child.birth && child.gender) : Object.keys(answers).length>=QUESTIONS.length;

  const submit = ()=>{
    notify('문진표가 저장되었습니다');
    setStep(0); setChild({name:'',birth:'',gender:''}); setAnswers({}); setSaveState('idle');
  };

  return (
    <React.Fragment>
      <div className="page-head">
        <div>
          <div className="page-title">문진표 작성</div>
          <div className="page-sub">자녀 정보와 검사 관련 문진 항목을 단계별로 입력합니다. 입력 중 자동으로 임시저장됩니다.</div>
        </div>
      </div>
      <div className="qform-wrap">
        <div className="qform-card">
          <div className="qstepper">
            {[0,1].map(i=>(
              <div key={i} className={"qstep"+(i<step?' done':i===step?' active':'')}>
                {i===step && <div className="qstep-fill"></div>}
              </div>
            ))}
          </div>

          {step===0 && (
            <React.Fragment>
              <div className="qform-group">
                <label className="qform-label">자녀 이름</label>
                <input className="qform-input" placeholder="예: 이서아" value={child.name} onChange={e=>setChildField('name',e.target.value)} />
              </div>
              <div className="qform-row">
                <div className="qform-group">
                  <label className="qform-label">생년월일</label>
                  <input type="date" className="qform-input" value={child.birth} onChange={e=>setChildField('birth',e.target.value)} />
                </div>
                <div className="qform-group">
                  <label className="qform-label">성별</label>
                  <div className="qform-options">
                    {['여아','남아'].map(g=>(
                      <button key={g} className={"qopt"+(child.gender===g?' selected':'')} onClick={()=>setChildField('gender',g)}>{g}</button>
                    ))}
                  </div>
                </div>
              </div>
            </React.Fragment>
          )}

          {step===1 && QUESTIONS.map(q=>(
            <div className="qform-group" key={q.key}>
              <label className="qform-label">{q.label}</label>
              <div className="qform-options">
                {q.options.map(o=>(
                  <button key={o} className={"qopt"+(answers[q.key]===o?' selected':'')} onClick={()=>setAnswer(q.key,o)}>{o}</button>
                ))}
              </div>
            </div>
          ))}

          <div className={"autosave-tag"+(saveState==='saving'?' saving':'')}>
            {saveState==='saving' ? (<React.Fragment><span className="shimmer-bar"></span>자동 저장 중…</React.Fragment>) :
             saveState==='saved' ? (<React.Fragment><i data-lucide="check"></i>자동 저장됨 · 방금 전</React.Fragment>) :
             <React.Fragment><i data-lucide="cloud"></i>입력을 시작하면 자동 저장됩니다</React.Fragment>}
          </div>

          <div className="qform-actions">
            <button className="btn-ghost" disabled={step===0} style={{opacity:step===0?.4:1}} onClick={()=>setStep(s=>Math.max(0,s-1))}><i data-lucide="arrow-left"></i>이전</button>
            {step<1 ? (
              <button className="btn-primary" disabled={!canNext} style={{opacity:canNext?1:.5}} onClick={()=>canNext&&setStep(s=>s+1)}>다음<i data-lucide="arrow-right"></i></button>
            ) : (
              <button className="btn-primary" disabled={!canNext} style={{opacity:canNext?1:.5}} onClick={()=>canNext&&submit()}><i data-lucide="check"></i>문진표 제출</button>
            )}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {DONUT_DATA.map((d,i)=>(
                      <div key={d.name} style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
                        <span style={{width:10,height:10,borderRadius:3,background:DONUT_COLORS[i]}}></span>{d.name} {d.value}%
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {(page===0) && (
                <div className="result-summary-grid">
                  <div className="field"><div className="fl">수검자</div><div className="fv">{sel.child}</div></div>
                  <div className="field"><div className="fl">보호자</div><div className="fv">{sel.guardian}</div></div>
                  <div className="field"><div className="fl">검사 협력사</div><div className="fv">{sel.partner}</div></div>
                  <div className="field"><div className="fl">결과 확정일</div><div className="fv">{sel.registered}</div></div>
                </div>
              )}
            </div>
            <div className="page-nav">
              <button className="btn-ghost" disabled={page===0} style={{opacity:page===0?.4:1}} onClick={()=>setPage(p=>Math.max(0,p-1))}><i data-lucide="chevron-left"></i>이전</button>
              <div className="page-dots">
                {RESULT_PAGES.map((_,i)=>(<span key={i} className={"page-dot"+(i===page?' active':'')} onClick={()=>setPage(i)} style={{cursor:'pointer'}}></span>))}
              </div>
              <button className="btn-ghost" disabled={page===RESULT_PAGES.length-1} style={{opacity:page===RESULT_PAGES.length-1?.4:1}} onClick={()=>setPage(p=>Math.min(RESULT_PAGES.length-1,p+1))}>다음<i data-lucide="chevron-right"></i></button>
            </div>
          </div>
        )}
      </div>

      {returnOpen && (
        <div className="overlay" onClick={()=>setReturnOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">키트 반송 신청</div>
              <button className="close-btn" onClick={()=>setReturnOpen(false)}><i data-lucide="x"></i></button>
            </div>
            <div className="qform-group">
              <label className="qform-label">반송 운송장번호</label>
              <input className="qform-input" placeholder="예: 1234-5678-9012" value={tracking} onChange={e=>setTracking(e.target.value)} />
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setReturnOpen(false)}>취소</button>
              <button className="btn-primary" onClick={submitReturn}><i data-lucide="check"></i>신청하기</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function App(){
  const [view,setView] = useState('main');
  const [filter,setFilter] = useState('전체');
  const [search,setSearch] = useState('');
  const [selected,setSelected] = useState('c1');
  const [statusDetail,setStatusDetail] = useState(null);
  const [toast,setToast] = useState(null);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const notify = (msg)=>setToast(msg);

  return (
    <div className="shell">
      <IconBoot/>
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><i data-lucide="dna"></i></div>
          <div>
            <div className="brand-name">마이크로베베</div>
            <div className="brand-sub">영유아 장내미생물 검사</div>
          </div>
        </div>
        <nav className="side-nav">
          {NAV.map(n=>(
            <button key={n.key} className={"side-link"+(view===n.key?' active':'')} onClick={()=>setView(n.key)}>
              <i data-lucide={n.icon}></i>{n.label}
              {n.count && <span className="badge-count">{n.count}</span>}
            </button>
          ))}
        </nav>
        <div className="side-foot">
          <span className="side-avatar">운</span>
          <div>
            <div className="side-foot-name">운영 관리자</div>
            <div className="side-foot-role">검사 서비스팀</div>
          </div>
        </div>
      </aside>

      <div className="main-wrap">
        <div className="topbar">
          <div className="search-box">
            <i data-lucide="search"></i>
            <input placeholder="자녀명, 협력사, 주문번호로 검색" onFocus={()=>notify('상단 검색은 접수 현황 화면과 연동됩니다')} />
          </div>
          <span className="topbar-spacer"></span>
          <button className="icon-btn" onClick={()=>notify('신규 알림 3건이 있습니다')}><i data-lucide="bell"></i><span className="notif-dot"></span></button>
          <button className="icon-btn" onClick={()=>notify('설정 화면으로 이동합니다')}><i data-lucide="settings"></i></button>
        </div>

        <main className="content">
          {view==='main' && <MainView filter={filter} setFilter={setFilter} search={search} setSearch={setSearch} selected={selected} setSelected={setSelected} notify={notify} />}
          {view==='status' && <StatusView onOpen={setStatusDetail} />}
          {view==='questionnaire' && <QuestionnaireView notify={notify} />}
          {view==='result' && <ResultView notify={notify} />}
        </main>
      </div>

      {statusDetail && (
        <div className="overlay" onClick={()=>setStatusDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{statusDetail.child} 진행현황</div>
                <div className="page-sub" style={{marginTop:4}}>{statusDetail.partner} · 등록일 {statusDetail.registered}</div>
              </div>
              <button className="close-btn" onClick={()=>setStatusDetail(null)}><i data-lucide="x"></i></button>
            </div>
            <StageStepper stage={statusDetail.stage} />
            <div className="section-label">단계 이력</div>
            <div className="api-log-list">
              {API_LOGS[statusDetail.id].map((l,i)=>(
                <div className="api-log-row" key={i}>
                  <i data-lucide="clock"></i>
                  <span className="api-log-dir">{l.label}</span>
                  <span className="api-log-time">{l.time}</span>
                </div>
              ))}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={()=>setStatusDetail(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      {toast && <Toast text={toast} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
