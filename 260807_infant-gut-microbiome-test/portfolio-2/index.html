<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이옴옵스 — 검사 협력사 통합 운영 관제 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --grn:#3bf14a; --grn-deep:#1f9e2b; --purple:#9a24ef;
  --stone-canvas:#fafaf9; --paper:#ffffff; --stone-border:#e8e6e5; --stone-muted:#d6d3d1;
  --ash:#a8a29e; --warm-gray:#78716c; --ink:#0c0a09; --soot:#1c1917;
  --warn:#c8860a; --neg:#dc2626;
  --radius-card:10px; --radius-btn:9999px; --radius-sm:6px;
  --shadow-flat:0 1px 2px rgba(0,0,0,.05);
  --shadow-float:0 12px 45px rgba(17,12,46,.12);
  --shadow-pop:0 24px 60px -18px rgba(12,10,9,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app-root{width:100%;min-height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--stone-canvas); color:var(--ink);
  font-size:14px; line-height:1.64; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--stone-muted);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(59,241,74,.55)}50%{box-shadow:0 0 0 6px rgba(59,241,74,0)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawerSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes progressFill{from{width:0%}to{width:var(--target,100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column}
.topnav{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:6px;padding:0 24px;background:rgba(250,250,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--stone-border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.017em;flex:0 0 auto;margin-right:18px}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--soot);display:flex;align-items:center;justify-content:center}
.brand-mark i{color:var(--grn);font-size:15px}
.tabs{display:flex;align-items:center;gap:2px;flex:1}
.tab-link{padding:0 14px;height:32px;display:flex;align-items:center;gap:7px;border-radius:var(--radius-btn);font-size:13.5px;font-weight:500;color:var(--warm-gray);transition:all .15s ease;white-space:nowrap}
.tab-link:hover{color:var(--ink);background:var(--stone-border)}
.tab-link.active{background:var(--soot);color:#fff}
.tab-link i{font-size:15px}
.topnav-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.icon-btn{position:relative;width:34px;height:34px;border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;color:var(--warm-gray);transition:background .15s ease}
.icon-btn:hover{background:var(--stone-border);color:var(--ink)}
.icon-btn i{font-size:17px}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--purple);border:2px solid var(--stone-canvas)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--soot);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

.content{flex:1;max-width:1400px;margin:0 auto;padding:22px 24px 64px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.page-title{font-size:32px;font-weight:400;letter-spacing:-.021em;color:var(--ink)}
.page-sub{font-size:13.5px;color:var(--warm-gray);margin-top:6px;max-width:600px}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-btn);background:var(--grn);border:1px solid var(--grn-deep);color:var(--soot);font-size:13.5px;font-weight:600;transition:transform .12s ease}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary i{font-size:15px}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-btn);background:transparent;border:1px solid var(--stone-border);font-size:13.5px;font-weight:400;color:var(--ink)}
.btn-ghost:hover{background:var(--stone-border)}
.btn-ghost i{font-size:15px}
.btn-danger{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-btn);background:transparent;border:1px solid #fca5a5;color:var(--neg);font-size:13px;font-weight:600}
.btn-danger:hover{background:#fef2f2}

/* ── command tower ── */
.status-strip{display:flex;align-items:center;gap:0;background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:12px 18px;margin-bottom:16px;box-shadow:var(--shadow-flat);flex-wrap:wrap;gap:22px;animation:fadeUp .3s ease}
.strip-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--grn-deep)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulseDot 1.6s ease-in-out infinite}
.strip-metric{display:flex;align-items:center;gap:8px}
.strip-metric .dot{width:8px;height:8px;border-radius:50%}
.strip-metric .num{font-size:15px;font-weight:600}
.strip-metric .lbl{font-size:11.5px;color:var(--warm-gray)}
.strip-spacer{flex:1}

.tower-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;margin-bottom:16px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.board-col{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:12px;min-height:340px;box-shadow:var(--shadow-flat)}
.board-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--stone-border)}
.board-col-title{font-size:11.5px;font-weight:600;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.02em}
.board-col-count{font-size:11px;font-weight:700;background:var(--stone-border);color:var(--ink);padding:1px 7px;border-radius:99px}
.board-card{background:var(--stone-canvas);border:1px solid var(--stone-border);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:all .15s ease;animation:fadeUp .3s ease}
.board-card:hover{border-color:var(--grn-deep);transform:translateY(-1px)}
.board-card-name{font-size:12.5px;font-weight:600}
.board-card-sub{font-size:11px;color:var(--warm-gray);margin-top:3px}
.board-card-urgent{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10.5px;font-weight:700;color:var(--purple)}

.priority-rail{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:14px;box-shadow:var(--shadow-flat)}
.rail-head{font-size:12px;font-weight:700;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.priority-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--stone-border)}
.priority-item:last-child{border-bottom:none}
.priority-score{width:26px;height:26px;border-radius:8px;background:rgba(154,36,239,.1);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto}
.priority-main{flex:1;min-width:0}
.priority-title{font-size:12.5px;font-weight:600}
.priority-sub{font-size:11px;color:var(--warm-gray);margin-top:2px}
.priority-btn{font-size:11px;font-weight:700;color:var(--grn-deep);flex:0 0 auto}

.secondary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.widget-card{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-flat);animation:fadeUp .35s ease}
.widget-title{font-size:12px;font-weight:700;color:var(--warm-gray);margin-bottom:12px}
.widget-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.widget-bar-name{font-size:11px;width:64px;flex:0 0 auto;color:var(--warm-gray)}
.widget-bar-track{flex:1;height:7px;border-radius:999px;background:var(--stone-border);overflow:hidden}
.widget-bar-fill{height:100%;border-radius:999px;background:var(--grn);transform-origin:left;animation:barGrow .7s cubic-bezier(.2,.8,.3,1) both}
.widget-bar-num{font-size:11px;font-weight:700;width:22px;text-align:right}

/* ── flat table ── */
.table-card{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-flat)}
table.flat-table{width:100%;border-collapse:collapse}
.flat-table th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--stone-border);background:var(--stone-canvas)}
.flat-table td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--stone-border)}
.flat-table tr:last-child td{border-bottom:none}
.flat-table tr.clickable:hover{background:var(--stone-canvas);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pill.active{background:rgba(59,241,74,.15);color:var(--grn-deep)}
.pill.inactive{background:var(--stone-border);color:var(--warm-gray)}
.pill.warn{background:rgba(200,134,10,.14);color:var(--warn)}
.pill.purple{background:rgba(154,36,239,.1);color:var(--purple)}
.masked-key{font-family:monospace;font-size:12px;color:var(--warm-gray)}

.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{padding:7px 14px;border-radius:var(--radius-btn);background:var(--paper);border:1px solid var(--stone-border);font-size:12px;font-weight:600;color:var(--warm-gray);transition:all .15s ease}
.filter-chip:hover{border-color:var(--ash)}
.filter-chip.active{background:var(--soot);color:#fff;border-color:var(--soot)}

.subtab-row{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--stone-border)}
.subtab{padding:9px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--warm-gray);border-bottom:2px solid transparent}
.subtab.active{color:var(--ink);border-bottom-color:var(--grn)}

/* ── stat widgets ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:14px 16px;box-shadow:var(--shadow-flat)}
.stat-label{font-size:11px;color:var(--warm-gray);font-weight:600}
.stat-value{font-size:24px;font-weight:400;letter-spacing:-.017em;margin-top:4px}

/* ── dropzone / upload ── */
.dropzone{border:2px dashed var(--stone-muted);border-radius:var(--radius-card);padding:40px 24px;text-align:center;background:var(--paper);transition:all .15s ease;cursor:pointer}
.dropzone:hover{border-color:var(--grn-deep);background:rgba(59,241,74,.04)}
.dropzone i{font-size:34px;color:var(--ash);margin-bottom:10px;display:block}
.dropzone-title{font-size:14px;font-weight:600}
.dropzone-sub{font-size:12px;color:var(--warm-gray);margin-top:5px}
.upload-progress{background:var(--paper);border:1px solid var(--stone-border);border-radius:var(--radius-card);padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:12px}
.upload-progress i{font-size:20px;color:var(--grn-deep)}
.upload-progress-main{flex:1}
.upload-progress-name{font-size:12.5px;font-weight:600}
.upload-progress-track{height:6px;border-radius:99px;background:var(--stone-border);margin-top:6px;overflow:hidden}
.upload-progress-fill{height:100%;background:var(--grn);border-radius:99px;animation:progressFill 1.6s ease forwards}
.spin{display:inline-block;animation:spin 1s linear infinite}

/* ── modal / drawer ── */
.overlay{position:fixed;inset:0;background:rgba(12,10,9,.4);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeUp .16s ease}
.overlay.drawer-overlay{justify-content:flex-end;align-items:stretch}
.modal{width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:14px;padding:24px;box-shadow:var(--shadow-pop)}
.drawer{width:420px;max-width:92vw;height:100%;background:var(--paper);padding:22px;overflow-y:auto;animation:drawerSlide .28s cubic-bezier(.2,.8,.3,1) both;box-shadow:-16px 0 40px rgba(12,10,9,.16)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:600}
.close-btn{width:30px;height:30px;border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;color:var(--warm-gray)}
.close-btn:hover{background:var(--stone-border)}
.close-btn i{font-size:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.field{background:var(--stone-canvas);border:1px solid var(--stone-border);border-radius:8px;padding:11px 13px}
.field .fl{font-size:10.5px;color:var(--warm-gray);font-weight:700;margin-bottom:3px;text-transform:uppercase}
.field .fv{font-size:13px;font-weight:600}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.form-group{margin-bottom:14px}
.form-label{font-size:12.5px;font-weight:600;margin-bottom:6px;display:block}
.form-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--stone-border);font-size:13px;background:var(--stone-canvas);outline:none}
.form-input:focus{border-color:var(--grn-deep)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--soot);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;display:flex;align-items:center;gap:9px;animation:toastIn .25s cubic-bezier(.2,.8,.3,1) both;box-shadow:var(--shadow-pop)}
.toast i{font-size:16px;color:var(--grn)}

@media (max-width:1100px){
  .tower-grid{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .secondary-strip,.stat-row{grid-template-columns:repeat(2,1fr)}
  .field-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const {PieChart,Pie,Cell,ResponsiveContainer,Tooltip} = Recharts;

const STAGES = ['키트등록','검사접수','검사진행중','결과분석중','결과완료'];

  {id:'c8',child:'강나윤',partner:'마더케어팜',stage:0,urgent:false},
  {id:'c9',child:'서예린',partner:'리틀바이옴',stage:2,urgent:true,sla:'D-0'},
  {id:'c10',child:'문시우',partner:'그린바이오랩',stage:2,urgent:false},

  {id:'q3',child:'최하윤',partner:'리틀바이옴',birth:'자연분만',feed:'분유',submitted:'08.03 16:44'},
  {id:'q4',child:'정지호',partner:'그린바이오랩',birth:'자연분만',feed:'모유',submitted:'07.29 11:02'},

  {id:'r2',child:'한지안',tracking:'6688-4410-2231',status:'발송',partner:'리틀바이옴'},
  {id:'r3',child:'오은우',tracking:'6688-9910-0087',status:'도착',partner:'그린바이오랩'},
];

const QUEUE = [
  {id:'u1',name:'서예린 결과 데이터.csv',status:'완료',time:'3분 전'},
  {id:'u2',name:'배소율 결과 데이터.csv',status:'완료',time:'22분 전'},
  {id:'u3',name:'문시우 결과 데이터.csv',status:'실패',time:'1시간 전',reason:'필수 컬럼 3개 누락'},
];

const DONUT_DATA = [{name:'자연분만',value:58},{name:'제왕절개',value:42}];
const DONUT_COLORS = ['#3bf14a','#9a24ef'];

function IconBoot(){ return null; }
function Toast({text,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2400);return ()=>clearTimeout(t)},[]);
  return <div className="toast"><i className="ph ph-check-circle"></i>{text}</div>;
}

function StatusStrip(){
  const counts = STAGES.map(s=>({name:s,n:CASES.filter(c=>STAGES[c.stage]===s).length}));
  return (
    <div className="status-strip">
      <span className="strip-live"><span className="live-dot"></span>실시간 갱신 중</span>
      {counts.map(c=>(
        <span className="strip-metric" key={c.name}>
          <span className="dot" style={{background:STAGE_DOT[c.name]}}></span>
          <span className="num">{c.n}</span><span className="lbl">{c.name}</span>
        </span>
      ))}
      <span className="strip-spacer"></span>
      <span className="strip-metric"><span className="num">94.8%</span><span className="lbl">API 성공률</span></span>
    </div>
  );
}

function LiveSignalBanner(){
  return (
    <div style={{position:'relative',overflow:'hidden',borderRadius:10,marginBottom:16,padding:'14px 20px',background:'linear-gradient(120deg, rgba(59,241,74,0.12), rgba(154,36,239,0.07))',border:'1px solid var(--stone-border)',display:'flex',alignItems:'center',gap:18}}>

function QuestionnaireReturnAdmin({notify}){
  const [tab,setTab] = useState('문진표');

  const [returnFilter,setReturnFilter] = useState('전체');

    const order = ['접수','발송','도착'];
    setReturns(list=>list.map(r=>{
      if(r.id!==id) return r;
      const next = order[Math.min(order.indexOf(r.status)+1,order.length-1)];
      return {...r,status:next};
    }));
    notify('반송 처리 상태를 변경했습니다');

  return (
    <React.Fragment>
      <div className="page-head">

        </div>
      </div>
      <div className="subtab-row">
        <button className={"subtab"+(tab==='문진표'?' active':'')} onClick={()=>setTab('문진표')}>문진표</button>

        <React.Fragment>
          <div className="stat-row">
            <div className="stat-card"><div className="stat-label">누적 응답</div><div className="stat-value">248건</div></div>
            <div className="stat-card"><div className="stat-label">자연분만 비율</div><div className="stat-value">58%</div></div>
            <div className="stat-card"><div className="stat-label">모유 수유 비율</div><div className="stat-value">44%</div></div>
            <div className="stat-card"><div className="stat-label">이번 주 신규</div><div className="stat-value">12건</div></div>
          </div>
          <div className="table-card">
            <table className="flat-table">
              <thead><tr><th>자녀</th><th>협력사</th><th>출생 형태</th><th>수유 형태</th><th>제출일</th></tr></thead>
              <tbody>
                {QUESTIONNAIRES.map(q=>(
                  <tr key={q.id} className="clickable" onClick={()=>setSelectedQ(q)}>
                    <td style={{fontWeight:600}}>{q.child}</td>
                    <td>{q.partner}</td>
                    <td>{q.birth}</td>
                    <td>{q.feed}</td>
                    <td>{q.submitted}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </React.Fragment>
      )}

      {tab==='반송' && (
        <React.Fragment>
          <div className="filter-row">
            {['전체','접수','발송','도착'].map(f=>(
              <button key={f} className={"filter-chip"+(returnFilter===f?' active':'')} onClick={()=>setReturnFilter(f)}>{f}</button>
            ))}
          </div>
          <div className="table-card">
            <table className="flat-table">
              <thead><tr><th>자녀</th><th>협력사</th><th>운송장번호</th><th>배송상태</th><th>액션</th></tr></thead>
              <tbody>

                    <td>
                      {r.status!=='도착' ? (
                        <button className="btn-ghost" style={{padding:'6px 10px',fontSize:12}} onClick={(e)=>{e.stopPropagation();advanceStatus(r.id);}}><i className="ph ph-arrow-right"></i>다음 단계</button>

                  </tr>
                ))}
              </tbody>
            </table>
          </div>

              <div className="field"><div className="fl">배송상태</div><div className="fv">{selectedR.status}</div></div>
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={()=>setSelectedR(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function ResultUploadAdmin({notify}){
  const [uploading,setUploading] = useState(false);
  const [fileName,setFileName] = useState('');
  const [queue,setQueue] = useState(QUEUE);

  const simulateUpload = ()=>{
    const name = '서예린 결과 데이터.csv';
    setFileName(name); setUploading(true);
    setTimeout(()=>{
      setUploading(false);
      setQueue(q=>[{id:'u'+Date.now(),name,status:'완료',time:'방금 전'},...q]);
      notify('결과지 생성이 완료되었습니다');
    },1700);
  };

  const retry = (id)=>{
    setQueue(q=>q.map(item=>item.id===id?{...item,status:'완료',time:'방금 전'}:item));
    notify('재처리를 시작해 완료 처리했습니다');
  };

  return (
    <React.Fragment>
      <div className="page-head">
        <div>
          <div className="page-title">결과 업로드</div>
          <div className="page-sub">검사 결과 파일을 업로드하면 9페이지 결과지를 자동 생성하고, 실패 건은 재처리 큐에서 관리합니다.</div>
        </div>
      </div>

      <div className="dropzone" onClick={simulateUpload}>
        <i className="ph ph-upload-simple"></i>
        <div className="dropzone-title">결과 데이터 파일을 드래그하거나 클릭해 업로드</div>
        <div className="dropzone-sub">CSV · XLSX 형식 지원 · 업로드 즉시 형식 검증 후 결과지 생성이 시작됩니다</div>
      </div>

      {uploading && (
        <div className="upload-progress">
          <i className="ph ph-circle-notch spin"></i>
          <div className="upload-progress-main">
            <div className="upload-progress-name">{fileName} 업로드 중…</div>
            <div className="upload-progress-track"><div className="upload-progress-fill" style={{'--target':'100%'}}></div></div>
          </div>
        </div>
      )}

      <div className="table-card" style={{marginTop:16}}>
        <table className="flat-table">
          <thead><tr><th>파일명</th><th>상태</th><th>처리 시각</th><th>액션</th></tr></thead>
          <tbody>
            {queue.map(item=>(
              <tr key={item.id}>
                <td style={{fontWeight:600}}>{item.name}</td>
                <td>
                  <span className={"pill "+(item.status==='완료'?'active':'warn')}>{item.status}</span>
                  {item.reason && <div style={{fontSize:11,color:'var(--warm-gray)',marginTop:3}}>{item.reason}</div>}
                </td>
                <td>{item.time}</td>
                <td>
                  {item.status==='실패' ? (
                    <button className="btn-ghost" style={{padding:'6px 10px',fontSize:12}} onClick={()=>retry(item.id)}><i className="ph ph-arrow-clockwise"></i>재처리</button>
                  ) : <span style={{fontSize:12,color:'var(--warm-gray)'}}>완료됨</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </React.Fragment>
  );
}

            </div>
            <div className="field-grid">
              <div className="field"><div className="fl">현재 단계</div><div className="fv">{STAGES[openCase.stage]}</div></div>
              <div className="field"><div className="fl">우선순위</div><div className="fv">{openCase.urgent?('긴급 · '+openCase.sla):'일반'}</div></div>
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>{notify(openCase.child+' 건의 다음 단계 처리를 시작했습니다');setOpenCase(null);}}><i className="ph ph-arrow-right"></i>다음 단계로 이동</button>
              <button className="btn-primary" onClick={()=>setOpenCase(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      {toast && <Toast text={toast} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
