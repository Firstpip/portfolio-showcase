<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐스트로그 — 라이브커머스 방송 리포트 자동화 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --flame:#fa5d00; --bone:#c0bbb6; --mint:#1ef6da;
  --cream:#fff8f1; --paper:#ffffff; --ink:#1d1e1c; --stone:#615f5c;
  --line:#ece3d8; --line-soft:#f2ebe1;
  --pos:#1a9e6b; --neg:#e0472b; --amber:#c8860a;
  --fs-caption:13px; --fs-body:15px; --fs-subheading:17px;
  --fs-heading-sm:20px; --fs-heading:22px; --fs-heading-lg:28px; --fs-display:44px;
  --radius-card:20px; --radius-btn:14px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(29,30,28,.04), 0 10px 28px -14px rgba(250,93,0,.18);
  --shadow-pop:0 24px 60px -20px rgba(29,30,28,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream); color:var(--ink);
  font-size:var(--fs-body); line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bone);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(26,158,107,.5)}50%{box-shadow:0 0 0 6px rgba(26,158,107,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes drawerSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.app-header{
  position:sticky;top:0;z-index:40;height:64px;
  display:flex;align-items:center;gap:20px;padding:0 28px;
  background:rgba(255,248,241,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;flex:0 0 auto}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--flame),#ff8a3d);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -3px rgba(250,93,0,.5)}
.brand-mark i{color:#fff;width:17px;height:17px}
.project-switcher{position:relative;flex:0 0 auto}
.switcher-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-btn);background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.switcher-btn:hover{border-color:var(--bone)}
.switcher-btn i{width:14px;height:14px;color:var(--stone)}
.switcher-menu{position:absolute;top:calc(100% + 8px);left:0;width:220px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:6px;z-index:60;animation:fadeUp .16s ease}
.switcher-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:13px;font-weight:600}
.switcher-item:hover{background:var(--line-soft)}
.switcher-item.active{color:var(--flame)}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto}
.nav-link{padding:9px 13px;border-radius:var(--radius-btn);font-size:13px;font-weight:600;color:var(--stone);white-space:nowrap;transition:all .15s ease}
.nav-link:hover{background:var(--line-soft);color:var(--ink)}
.nav-link.active{background:var(--ink);color:#fff}
.header-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.icon-btn{position:relative;width:36px;height:36px;border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;color:var(--stone);transition:background .15s ease}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}
.icon-btn i{width:18px;height:18px}
.notif-badge{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--flame);border:2px solid var(--cream)}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5683da,#1ef6da);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}

.tab-bar{display:flex;align-items:center;gap:4px;padding:12px 28px 0;max-width:1280px;margin:0 auto;width:100%}
.tab{padding:9px 4px;margin-right:20px;font-size:13px;font-weight:700;color:var(--stone);border-bottom:2px solid transparent;transition:all .15s ease}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--flame);border-bottom-color:var(--flame)}

.content{max-width:1280px;margin:0 auto;padding:20px 28px 64px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.01em}
.page-sub{font-size:13px;color:var(--stone);margin-top:5px}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--radius-btn);background:var(--flame);color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 20px -8px rgba(250,93,0,.55);transition:transform .12s ease}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary i{width:15px;height:15px}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-btn);background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.btn-ghost:hover{border-color:var(--bone)}
.btn-ghost i{width:14px;height:14px}

/* ── bento-grid: 비대칭 타일(feature/metric/wide) ── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(132px,auto);gap:16px;margin-bottom:16px}
.tile{border-radius:var(--radius-card)}
.tile.feature{grid-column:span 2;grid-row:span 2}
.tile.metric{grid-column:span 1;grid-row:span 1}
.tile.wide{grid-column:span 2;grid-row:span 1}
.hero-viz-card{background:var(--paper);padding:22px 22px 8px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;animation:fadeUp .4s ease;display:flex;flex-direction:column}
.hero-viz-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2px}
.hero-viz-label{font-size:13px;font-weight:700;color:var(--stone)}
.hero-viz-value{font-size:44px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.delta-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:800}
.delta-badge.pos{background:rgba(26,158,107,.12);color:var(--pos)}
.delta-badge.neg{background:rgba(224,71,43,.12);color:var(--neg)}
.delta-badge i{width:12px;height:12px}
.stat-card{background:var(--paper);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;justify-content:center;gap:6px;animation:fadeUp .4s ease;transition:transform .15s ease,box-shadow .15s ease}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 20px 40px -20px rgba(29,30,28,.25)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:12.5px;font-weight:700;color:var(--stone)}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.01em}
.stat-spark{width:64px;height:26px}

.widget-card{background:var(--paper);padding:18px;box-shadow:var(--shadow-card);animation:fadeUp .45s ease}
.widget-title{font-size:13px;font-weight:700;color:var(--stone);margin-bottom:10px}
.widget-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.widget-bar-name{font-size:12px;width:66px;flex:0 0 auto;color:var(--stone)}
.widget-bar-track{flex:1;height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.widget-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--flame),#ff9a4d);transform-origin:left;animation:barGrow .7s cubic-bezier(.2,.8,.3,1) both}
.widget-bar-num{font-size:12px;font-weight:700;width:26px;text-align:right}
.timeline-list{display:flex;flex-direction:column;gap:11px}
.timeline-item{display:flex;gap:10px;align-items:flex-start}
.timeline-dot{width:8px;height:8px;border-radius:50%;background:var(--flame);margin-top:5px;flex:0 0 auto}
.timeline-item.done .timeline-dot{background:var(--pos)}
.timeline-text{font-size:12.5px}
.timeline-time{font-size:11px;color:var(--stone);margin-top:2px}

.quick-links{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.quick-link-card{flex:1;min-width:220px;display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;transition:all .15s ease;animation:fadeUp .5s ease}
.quick-link-card:hover{border-color:var(--flame);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.quick-link-icon{width:38px;height:38px;border-radius:11px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.quick-link-icon i{width:18px;height:18px;color:var(--flame)}
.quick-link-title{font-size:13.5px;font-weight:700}
.quick-link-sub{font-size:11.5px;color:var(--stone);margin-top:2px}

/* ── generic cards / lists ── */
.card-list{display:flex;flex-direction:column;gap:12px}
.store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.store-card{background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;animation:fadeUp .4s ease;text-align:left}
.store-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -18px rgba(29,30,28,.28)}
.store-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.store-name{font-size:14.5px;font-weight:800}
.status-dot-row{display:flex;align-items:center;gap:6px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--pos)}
.status-dot.live{animation:pulseDot 1.8s ease-in-out infinite}
.status-dot.warn{background:var(--amber)}
.status-dot.err{background:var(--neg)}
.status-text{font-size:11.5px;font-weight:700;color:var(--stone)}
.store-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--stone);margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:800}
.badge.pos{background:rgba(26,158,107,.12);color:var(--pos)}
.badge.amber{background:rgba(200,134,10,.14);color:var(--amber)}
.badge.neg{background:rgba(224,71,43,.12);color:var(--neg)}
.badge.gray{background:var(--line-soft);color:var(--stone)}

.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:7px 14px;border-radius:var(--radius-pill);background:var(--paper);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--stone);transition:all .15s ease}
.filter-chip:hover{border-color:var(--bone)}
.filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.report-row{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .12s ease;animation:fadeUp .35s ease}
.report-row:hover{transform:translateX(3px)}
.report-brand-avatar{width:38px;height:38px;border-radius:12px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--flame);flex:0 0 auto}
.report-main{flex:1;min-width:0}
.report-title{font-size:14px;font-weight:800}
.report-sub{font-size:12px;color:var(--stone);margin-top:2px}
.report-meta{text-align:right;flex:0 0 auto}
.report-meta .num{font-size:13px;font-weight:700}
.report-meta .lbl{font-size:11px;color:var(--stone)}
.row-actions{display:flex;gap:6px;flex:0 0 auto}

.alert-item{display:flex;gap:13px;background:var(--paper);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow-card);cursor:pointer;animation:fadeUp .35s ease;transition:transform .12s ease}
.alert-item:hover{transform:translateX(3px)}
.alert-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.alert-icon.err{background:rgba(224,71,43,.12);color:var(--neg)}
.alert-icon.warn{background:rgba(200,134,10,.14);color:var(--amber)}
.alert-body{flex:1;min-width:0}
.alert-msg{font-size:13.5px;font-weight:700}
.alert-time{font-size:11.5px;color:var(--stone);margin-top:3px}

/* ── modal / drawer ── */
.overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeUp .18s ease}
.overlay.drawer-overlay{justify-content:flex-end;align-items:stretch}
.modal{width:520px;max-width:92vw;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:22px;padding:26px;box-shadow:var(--shadow-pop)}
.drawer{width:440px;max-width:92vw;height:100%;background:var(--paper);padding:24px;overflow-y:auto;animation:drawerSlide .28s cubic-bezier(.2,.8,.3,1) both;box-shadow:-16px 0 40px rgba(29,30,28,.18)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:800}
.close-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--stone)}
.close-btn:hover{background:var(--line-soft)}
.close-btn i{width:16px;height:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.field{background:var(--line-soft);border-radius:12px;padding:11px 13px}
.field .fl{font-size:11px;color:var(--stone);font-weight:700;margin-bottom:3px}
.field .fv{font-size:13.5px;font-weight:700}
.mini-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.mini-table th{text-align:left;padding:8px 6px;color:var(--stone);font-weight:700;border-bottom:1px solid var(--line);font-size:11.5px}
.mini-table td{padding:9px 6px;border-bottom:1px solid var(--line-soft)}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:200;display:flex;align-items:center;gap:9px;animation:toastIn .25s cubic-bezier(.2,.8,.3,1) both;box-shadow:var(--shadow-pop)}
.toast i{width:16px;height:16px;color:var(--mint)}

.drawer-tabs{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid var(--line)}
.drawer-tab{padding:9px 3px;margin-right:16px;font-size:12.5px;font-weight:700;color:var(--stone);border-bottom:2px solid transparent}
.drawer-tab.active{color:var(--flame);border-bottom-color:var(--flame)}
.raw-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--line-soft);border-radius:12px;padding:11px 14px;margin-top:14px;font-size:12.5px;font-weight:700}

@media (max-width:980px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .tile.feature{grid-column:span 2}
  .tile.wide{grid-column:span 2}
  .store-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function Sparkline({data,color}){
  return (
    <svg className="stat-spark" viewBox="0 0 64 26">
      <polyline fill="none" stroke={color||'#fa5d00'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        points={data.map((v,i)=>`${(i/(data.length-1))*62+1},${26-(v*20)}`).join(' ')} />
    </svg>
  );
}

function Toast({text,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2400);return ()=>clearTimeout(t)},[]);
  return (
    <div className="toast"><i data-lucide="check-circle-2"></i>{text}</div>
  );
}

function IconMounter({children}){
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return children;
}

              <div className="field"><div className="fl">직전 회차 대비</div><div className="fv">{selectedReport.prevDelta}</div></div>
              <div className="field"><div className="fl">누적 시청자</div><div className="fv">{selectedReport.viewers}</div></div>
              <div className="field"><div className="fl">발송 수신자</div><div className="fv">{selectedReport.recipients}명</div></div>
            </div>
            <div className="field" style={{marginTop:12}}>
              <div className="fl">회차 소재 정보</div>
              <div className="fv" style={{fontWeight:600,marginTop:4}}>{selectedReport.material}</div>
            </div>
            {selectedReport.stage==='속보판' && (
              <div className="field" style={{marginTop:12,background:'rgba(200,134,10,.1)'}}>
                <div className="fl" style={{color:'#c8860a'}}>안내</div>
                <div className="fv" style={{fontWeight:600,marginTop:4,fontSize:12.5}}>구매 확정 반영 전 속보판 수치입니다. 확정판 발행 시 갱신됩니다.</div>
              </div>
            )}
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>notify('리포트 PDF 다운로드를 준비했습니다')}><i data-lucide="download"></i>다운로드</button>
              <button className="btn-primary" onClick={()=>{notify(selectedReport.brand+' 리포트를 재발송했습니다');setSelectedReport(null);}}><i data-lucide="send"></i>재발송</button>
            </div>
          </div>
        </div>
      )}

      {selectedAlert && (
        <div className="overlay" onClick={()=>setSelectedAlert(null)}>
          <div className="modal" onClick={(e)=>e.stopPropagation()} style={{width:460}}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{selectedAlert.store}</div>
                <div className="page-sub" style={{marginTop:4}}>{selectedAlert.time}</div>
              </div>
              <button className="close-btn" onClick={()=>setSelectedAlert(null)}><i data-lucide="x"></i></button>
            </div>
            <div className="field">
              <div className="fl">상세 사유</div>
              <div className="fv" style={{fontWeight:600,marginTop:5,lineHeight:1.6}}>{selectedAlert.reason}</div>
            </div>
            <div className="modal-actions">
              {selectedAlert.status==='미확인' ? (
                <button className="btn-primary" onClick={()=>{markAlertChecked(selectedAlert.id);setSelectedAlert(null);}}><i data-lucide="check"></i>확인 처리</button>
              ) : (
                <button className="btn-ghost" onClick={()=>setSelectedAlert(null)}>닫기</button>
              )}
            </div>
          </div>
        </div>
      )}

      {toast && <Toast text={toast} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
