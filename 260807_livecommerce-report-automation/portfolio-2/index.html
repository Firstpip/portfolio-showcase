<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐스트타워 — 멀티 스토어 라이브커머스 운영 관제 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --iris:#5683da; --ember:#ff8964; --frost:#d1d1d1; --linen:#e5e5e7;
  --bg:#ffffff; --card:#ffffff; --text:#090a0c; --text2:#95979e; --molasses:#5a250a;
  --pos:#19875a; --neg:#d1443a; --amber:#b8790f;
  --fs-caption:11px; --fs-body:14px; --fs-body-lg:16px; --fs-subheading:18px;
  --fs-heading-sm:22px; --fs-heading:24px; --fs-display-sm:32px; --fs-display:40px;
  --radius-card:12px; --radius-pill:9999px;
  --shadow-elev:0 14px 34px -16px rgba(9,10,12,.24), 0 2px 6px rgba(9,10,12,.06);
  --shadow-pop:0 30px 70px -22px rgba(9,10,12,.45);
  --sbw:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:var(--fs-body); line-height:1.5; letter-spacing:-.1px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--frost);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(25,135,90,.55)}50%{box-shadow:0 0 0 7px rgba(25,135,90,0)}}
@keyframes toastPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes beamDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes barRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.app-shell{display:flex;width:100%;min-height:100vh}

/* ── 시그니처: 사이드바 250px ── */
.sidebar{
  width:var(--sbw);flex:0 0 var(--sbw);background:var(--linen);
  border-right:1px solid var(--frost);display:flex;flex-direction:column;padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.brand-beam{width:34px;height:34px;border-radius:11px;position:relative;overflow:hidden;background:#090a0c;flex:0 0 auto}
.brand-beam::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--iris),var(--ember) 70%,#fff);opacity:.9;animation:beamDrift 3.6s ease-in-out infinite}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.02em}
.env-switcher{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--frost);border-radius:var(--radius-pill);padding:8px 12px;margin-bottom:18px;font-size:12.5px;font-weight:700}
.env-switcher i{color:var(--text2)}
.sidebar-section{margin-bottom:16px}
.sidebar-section-title{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:2px;width:100%;text-align:left;transition:background .15s ease}
.sidebar-link i{font-size:16px;color:var(--text2);flex:0 0 auto}
.sidebar-link:hover{background:rgba(9,10,12,.05)}
.sidebar-link.active{background:var(--text);color:#fff}
.sidebar-link.active i{color:#fff}
.sidebar-foot{margin-top:auto;padding:12px 10px;font-size:11.5px;color:var(--text2)}

.main-wrap{flex:1;min-width:0;width:calc(100% - var(--sbw));display:flex;flex-direction:column}
.main{padding:22px 30px 60px;max-width:1360px;width:100%;margin:0 auto}

.page-header{margin-bottom:18px;position:relative}
.aurora-glow{position:absolute;top:-40px;left:-30px;width:340px;height:200px;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 20% 30%,rgba(86,131,218,.22),transparent 60%),radial-gradient(circle at 60% 70%,rgba(255,137,100,.18),transparent 55%);
  filter:blur(6px);animation:beamDrift 5s ease-in-out infinite}
.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-actions{display:flex;gap:8px}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-pill);background:var(--card);border:1px solid var(--frost);font-size:12.5px;font-weight:700}
.btn-secondary:hover{border-color:var(--text2)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-pill);background:var(--iris);color:#fff;font-size:12.5px;font-weight:700;box-shadow:0 10px 22px -9px rgba(86,131,218,.6);transition:transform .12s ease}
.btn-primary:hover{transform:translateY(-1px)}
.page-meta{font-size:12px;color:var(--text2);margin-top:8px}

/* ── status-strip (compact stat-card row, slim height) ── */
.status-strip{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--linen);border-radius:var(--radius-card);padding:12px 16px;box-shadow:var(--shadow-elev);display:flex;align-items:center;justify-content:space-between;gap:10px;animation:fadeUp .4s ease;transition:transform .15s ease}
.stat-card:hover{transform:scale(1.015)}
.stat-card .sc-l{min-width:0}
.stat-label{font-size:11.5px;font-weight:700;color:var(--text2)}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat-delta{font-size:11.5px;font-weight:700;margin-top:2px}
.stat-delta.pos{color:var(--pos)}
.stat-delta.neg{color:var(--neg)}
.stat-spark{width:52px;height:30px;flex:0 0 auto}

/* ── primary-focus + priority-rail ── */
.tower-row{display:flex;gap:14px;margin-bottom:16px;align-items:stretch}
.primary-focus{flex:1.7;background:var(--card);border:1px solid var(--linen);border-radius:30px;padding:20px 22px;box-shadow:var(--shadow-elev)}
.pf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pf-title{font-size:18px;font-weight:800}
.pf-legend{display:flex;gap:12px;font-size:11px;color:var(--text2)}
.pf-legend span{display:inline-flex;align-items:center;gap:5px}
.pf-dot{width:7px;height:7px;border-radius:50%}
.timeline-wrap{overflow-x:auto}
.timeline-hours{display:flex;font-size:10.5px;color:var(--text2);padding-left:96px;margin-bottom:4px}
.timeline-hours span{width:64px;flex:0 0 auto}
.timeline-row{display:flex;align-items:center;gap:0;margin-bottom:8px}
.timeline-store-name{width:96px;flex:0 0 auto;font-size:12px;font-weight:700}
.timeline-track{position:relative;height:22px;flex:1;min-width:640px;background:repeating-linear-gradient(90deg,var(--linen) 0,var(--linen) 1px,transparent 1px,transparent 64px)}
.timeline-block{position:absolute;top:2px;height:18px;border-radius:6px;background:var(--iris);cursor:pointer;transition:transform .12s ease}
.timeline-block:hover{transform:translateY(-1px) scaleY(1.06)}
.timeline-block.live{animation:livePulse 1.8s ease-in-out infinite}
.timeline-block.done{background:var(--pos)}
.timeline-block.warn{background:var(--amber)}
.timeline-block.err{background:var(--neg)}

.priority-rail{flex:1;background:var(--card);border:1px solid var(--linen);border-radius:30px;padding:18px;box-shadow:var(--shadow-elev);display:flex;flex-direction:column;gap:10px}
.rail-title{font-size:13.5px;font-weight:800;margin-bottom:2px}
.rail-item{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border-radius:10px;background:rgba(9,10,12,.03);cursor:pointer;transition:background .15s ease;text-align:left;width:100%}
.rail-item:hover{background:rgba(9,10,12,.06)}
.rail-badge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px}
.rail-badge.err{background:rgba(209,68,58,.14);color:var(--neg)}
.rail-badge.warn{background:rgba(184,121,15,.15);color:var(--amber)}
.rail-body{min-width:0}
.rail-msg{font-size:12.5px;font-weight:700}
.rail-time{font-size:11px;color:var(--text2);margin-top:2px}

.secondary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.sec-card{background:var(--card);border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-elev);animation:fadeUp .45s ease}
.sec-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px}
.bar-mini-row{display:flex;align-items:flex-end;gap:6px;height:64px}
.bar-mini{flex:1;background:linear-gradient(180deg,var(--iris),var(--ember));border-radius:4px 4px 0 0;transform-origin:bottom;animation:barRise .6s cubic-bezier(.2,.8,.3,1) both}
.progress-ring-wrap{display:flex;align-items:center;gap:14px}
.progress-num-ring{width:104px;height:76px;border-radius:30px;background:linear-gradient(160deg,var(--iris),var(--ember));display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 10px 24px -10px rgba(86,131,218,.5)}
.progress-num{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
.progress-num.lg{font-size:40px}

/* ── tab-bar + table ── */
.data-section{background:var(--card);border:1px solid var(--linen);border-radius:var(--radius-card);box-shadow:var(--shadow-elev);overflow:hidden}
.tab-bar{display:flex;gap:4px;padding:14px 18px 0;border-bottom:1px solid var(--linen)}
.tab{padding:9px 4px;margin-right:20px;font-size:13px;font-weight:700;color:var(--text2);border-bottom:2px solid transparent}
.tab.active{color:var(--iris);border-bottom-color:var(--iris)}
.data-toolbar{display:flex;align-items:center;gap:8px;padding:14px 18px}
.search{flex:1;max-width:280px;padding:9px 14px;border-radius:var(--radius-pill);border:1px solid var(--frost);font-size:12.5px;background:var(--linen)}
.filter-chip{padding:7px 13px;border-radius:var(--radius-pill);background:var(--linen);border:1px solid transparent;font-size:12px;font-weight:700;color:var(--text2)}
.filter-chip.active{background:var(--text);color:#fff}
.export-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-pill);border:1px solid var(--frost);font-size:12.5px;font-weight:700}
.data-table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px}
.data-table th{text-align:left;padding:10px 18px;color:var(--text2);font-weight:700;font-size:11px;border-bottom:1px solid var(--linen);white-space:nowrap}
.data-table td{padding:12px 18px;border-bottom:1px solid var(--linen);white-space:nowrap}
.data-table tr:hover td{background:rgba(9,10,12,.025)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:800}
.badge.pos{background:rgba(25,135,90,.12);color:var(--pos)}
.badge.warn{background:rgba(184,121,15,.14);color:var(--amber)}
.badge.neg{background:rgba(209,68,58,.12);color:var(--neg)}

/* ── generic screens ── */
.card-list{display:flex;flex-direction:column;gap:11px}
.list-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--linen);border-radius:var(--radius-card);padding:14px 18px;box-shadow:var(--shadow-elev);cursor:pointer;transition:transform .12s ease;animation:fadeUp .35s ease}
.list-row:hover{transform:translateX(3px)}
.row-avatar{width:38px;height:38px;border-radius:10px;background:var(--linen);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--iris);flex:0 0 auto}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;font-weight:800}
.row-sub{font-size:11.5px;color:var(--text2);margin-top:2px}
.row-meta{text-align:right;flex:0 0 auto}
.row-meta .num{font-size:13px;font-weight:800}
.row-meta .lbl{font-size:11px;color:var(--text2)}
.pill-toggle-row{display:flex;gap:8px;margin-bottom:16px}
.pill-toggle{padding:8px 16px;border-radius:var(--radius-pill);background:var(--linen);font-size:12.5px;font-weight:700;color:var(--text2)}
.pill-toggle.active{background:var(--iris);color:#fff}

.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.q-card{background:var(--card);border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-elev);cursor:pointer;transition:transform .12s ease;animation:fadeUp .4s ease;text-align:left}
.q-card:hover{transform:translateY(-2px)}
.q-type{display:inline-block;padding:4px 10px;border-radius:var(--radius-pill);background:rgba(255,137,100,.15);color:var(--molasses);font-size:11px;font-weight:800;margin-bottom:8px}
.q-text{font-size:14px;font-weight:700}
.q-count{font-size:11.5px;color:var(--text2);margin-top:6px}

.rank-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.rank-table th{text-align:left;padding:9px 10px;color:var(--text2);font-size:11px;font-weight:700;border-bottom:1px solid var(--linen)}
.rank-table td{padding:10px 10px;border-bottom:1px solid var(--linen)}
.rank-num{width:22px;height:22px;border-radius:7px;background:var(--linen);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}

/* ── overlays ── */
.overlay{position:fixed;inset:0;background:rgba(9,10,12,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{width:520px;max-width:92vw;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:18px;padding:26px;box-shadow:var(--shadow-pop);animation:modalPop .18s cubic-bezier(.2,.8,.3,1) both}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:800}
.close-btn{width:30px;height:30px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;color:var(--text2);background:var(--linen)}
.close-btn:hover{color:var(--text)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.field{background:var(--linen);border-radius:12px;padding:11px 13px}
.field .fl{font-size:10.5px;color:var(--text2);font-weight:700;margin-bottom:3px}
.field .fv{font-size:13.5px;font-weight:700}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.qa-line{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--linen);font-size:12.5px}
.qa-role{font-weight:800;flex:0 0 44px}
.qa-role.q{color:var(--iris)}
.qa-role.a{color:var(--molasses)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:200;display:flex;align-items:center;gap:8px;animation:toastPop .22s cubic-bezier(.2,.8,.3,1) both;box-shadow:var(--shadow-pop)}
.toast i{color:var(--ember)}

@media (max-width:1040px){
  .tower-row{flex-direction:column}
  .secondary-row{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">

  {id:'w5',type:'월간',range:'2026년 6월',status:'발송 완료',gmv:'152,700,000원',stores:8},

const CHAT_Q = [

              <button className="close-btn" onClick={()=>setSelectedRail(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="field"><div className="fl">내용</div><div className="fv" style={{marginTop:5}}>{selectedRail.msg}</div></div>
            <div className="modal-actions">
              <button className="btn-secondary" onClick={()=>setSelectedRail(null)}>나중에</button>
              <button className="btn-primary" onClick={()=>{notify('처리 완료로 표시했습니다');setSelectedRail(null);}}><i className="ph ph-check"></i>처리 완료</button>
            </div>
          </div>
        </div>
      )}

      {selectedPeriodic && (
        <div className="overlay" onClick={()=>setSelectedPeriodic(null)}>
          <div className="modal" onClick={(e)=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{selectedPeriodic.range}</div>
                <div className="page-meta" style={{marginTop:4}}>{selectedPeriodic.type} 리포트 · {selectedPeriodic.status}</div>
              </div>
              <button className="close-btn" onClick={()=>setSelectedPeriodic(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="field-grid">
              <div className="field"><div className="fl">누적 거래액</div><div className="fv">{selectedPeriodic.gmv}</div></div>
              <div className="field"><div className="fl">참여 스토어</div><div className="fv">{selectedPeriodic.stores}곳</div></div>
            </div>
            <div className="modal-actions">
              <button className="btn-secondary" onClick={()=>notify('리포트를 다운로드했습니다')}><i className="ph ph-download-simple"></i>다운로드</button>
              <button className="btn-primary" onClick={()=>{notify(selectedPeriodic.range+' 리포트를 재발송했습니다');setSelectedPeriodic(null);}}><i className="ph ph-paper-plane-tilt"></i>재발송</button>
            </div>
          </div>
        </div>
      )}

      {selectedQ && (
        <div className="overlay" onClick={()=>setSelectedQ(null)}>
          <div className="modal" onClick={(e)=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{selectedQ.type} 유형 · {selectedQ.count}건</div>
              </div>
              <button className="close-btn" onClick={()=>setSelectedQ(null)}><i className="ph ph-x"></i></button>
            </div>
            {selectedQ.qa.map((line,i)=>(
              <div className="qa-line" key={i}><span className={"qa-role "+(line[0]==='Q'?'q':'a')}>{line[0]}</span><span>{line[1]}</span></div>
            ))}
            <div className="modal-actions">
              <button className="btn-primary" onClick={()=>setSelectedQ(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      {toast && <Toast text={toast} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
