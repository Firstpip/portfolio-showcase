<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이웃정보나눔터 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<style>
:root{
  --bg:#f8f9fb; --surface:#ffffff; --surface-2:#f0f3f8;
  --border:#d4e0ed; --border-soft:#e5edf5;
  --ink:#0b3558; --muted:#476788; --faint:#a6bbd1;
  --primary:#006bff; --primary-ink:#004eba; --accent:#e55cff; --cyan:#0099ff;
  --ok:#12946a; --ok-bg:#e3f7ee; --warn:#b57a12; --warn-bg:#fdf1de; --low:#6b7684; --low-bg:#eef1f4;
  --danger:#d43a5c; --danger-bg:#fde8ed;
  --radius-card:14px; --radius-btn:10px; --radius-pill:999px;
  --shadow-card:0 4px 10px rgba(11,53,88,.10), 0 22px 44px -16px rgba(11,53,88,.28);
  --shadow-pop:0 20px 48px -10px rgba(11,53,88,.32);
  --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(18,148,106,.45)}50%{box-shadow:0 0 0 6px rgba(18,148,106,0)}}
@keyframes shimmerSweep{0%{background-position:-360px 0}100%{background-position:360px 0}}
@keyframes ringGrow{from{stroke-dashoffset:326}to{stroke-dashoffset:var(--dash,120)}}
@keyframes toastRise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blobDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,-14px) scale(1.05)}}

.app-shell{display:flex;width:100%;min-height:100vh}

/* sidebar */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--border-soft);margin-bottom:16px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--cyan));display:flex;align-items:center;justify-content:center;flex:0 0 36px;box-shadow:0 6px 16px -6px rgba(0,107,255,.5)}
.brand-mark svg{width:19px;height:19px;color:#fff}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted)}
.hood-chip{display:flex;align-items:center;gap:6px;margin:14px 4px 18px;padding:8px 12px;border-radius:var(--radius-pill);background:var(--surface-2);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--ink)}
.hood-chip svg{width:14px;height:14px;color:var(--primary)}
.nav-title{font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;padding:0 10px 8px;font-weight:700}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-radius:11px;color:var(--muted);font-size:13.5px;font-weight:600;transition:all .15s ease;margin-bottom:2px}
.nav-link:hover{background:var(--surface-2);color:var(--ink)}
.nav-link.active{background:linear-gradient(135deg,#eaf3ff,#f5ecff);color:var(--primary-ink);box-shadow:inset 0 0 0 1px rgba(0,107,255,.18)}
.nav-link svg{width:17px;height:17px;flex:0 0 17px}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft)}
.nav-foot-row{display:flex;align-items:center;gap:9px;padding:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulseDot 2.4s infinite}
.nav-foot-text{font-size:11.5px;color:var(--muted)}

/* main */
.main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;width:calc(100% - var(--sidebar-w));display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 32px 0}
.page-title{font-size:42px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;line-height:1.1}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.topbar-right{display:flex;align-items:center;gap:10px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:9px 14px;width:220px}
.search-box svg{width:15px;height:15px;color:var(--faint)}
.search-box input{border:none;outline:none;background:none;width:100%;font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s ease}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}
.icon-btn svg{width:17px;height:17px;color:var(--muted)}
.icon-btn .ping{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.avatar-mini{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.avatar-mini img{width:100%;height:100%;object-fit:cover}

.content{padding:30px 38px 48px;flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-btn);font-size:13.5px;font-weight:700;transition:all .15s ease}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px -8px rgba(0,107,255,.55)}
.btn-primary:hover{background:var(--primary-ink);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:12px}

/* feed: master-detail */
.feed-layout{display:flex;gap:28px;align-items:flex-start}
.list-rail{width:360px;flex:0 0 360px;display:flex;flex-direction:column;gap:18px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.post-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:20px;box-shadow:var(--shadow-card);cursor:pointer;transition:all .15s ease;animation:fadeInUp .4s ease backwards}
.post-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.post-card.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,107,255,.18)}
.post-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.post-title{font-size:14.5px;font-weight:700;margin-bottom:5px;line-height:1.35}
.post-snip{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint)}
.trust-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.post-meta-sep{opacity:.5}

.detail-panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden;animation:fadeInUp .45s ease .1s backwards}
.detail-hero{position:relative;height:190px;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,53,88,.55));}
.detail-hero-tag{position:absolute;left:20px;top:16px;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink)}
.detail-body{padding:30px 34px 34px}
.detail-title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px}
.author-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border-soft)}
.author-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:0 0 36px}
.author-avatar img{width:100%;height:100%}
.author-name{font-size:13px;font-weight:700}
.author-time{font-size:11.5px;color:var(--faint)}
.trust-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-left:auto}
.trust-badge svg{width:12px;height:12px}
.detail-text{font-size:13.5px;line-height:1.75;color:#1c3f60;margin-bottom:20px}
.detail-actions{display:flex;gap:10px;margin-bottom:22px}
.comment-preview{background:var(--surface-2);border-radius:14px;padding:16px}
.comment-preview-head{display:flex;align-items:center;justify-content:between;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini-comment{display:flex;gap:9px;padding:8px 0}
.mini-comment .a{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 26px}
.mini-comment .a img{width:100%;height:100%}
.mini-comment .t{font-size:12.5px;font-weight:700}
.mini-comment .b{font-size:12px;color:var(--muted);margin-top:2px}

/* section header */
.section-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:34px;animation:fadeInUp .4s ease backwards}
.field-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:7px;display:block}
.field-input,.field-select,.field-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);outline:none;font-size:13.5px;transition:border-color .15s}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--primary)}
.field-textarea{resize:vertical;min-height:130px;line-height:1.6}
.field-group{margin-bottom:24px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dropzone{border:1.5px dashed var(--border);border-radius:14px;padding:26px;text-align:center;background:var(--surface-2);cursor:pointer}
.dropzone svg{width:26px;height:26px;color:var(--faint);margin-bottom:8px}
.dropzone-text{font-size:12.5px;color:var(--muted)}
.upload-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;margin-top:8px}
.upload-item svg{width:15px;height:15px;color:var(--primary);flex:0 0 15px}
.upload-bar{flex:1;height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.upload-bar-fill{height:100%;background:var(--primary);border-radius:999px}
.autosave-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:700}
.autosave-pill .d{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulseDot 2s infinite}

/* comments screen */
.comment-thread{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.comment-row{display:flex;gap:11px}
.comment-row .a{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 34px}
.comment-row .a img{width:100%;height:100%}
.comment-bubble{background:var(--surface-2);border-radius:14px;padding:12px 14px;flex:1}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-name{font-size:12.5px;font-weight:700}
.comment-time{font-size:11px;color:var(--faint)}
.comment-body{font-size:13px;line-height:1.6;color:#1c3f60}
.comment-mine{margin-left:auto;font-size:11px;color:var(--danger);font-weight:700}
.comment-input-row{display:flex;gap:10px;margin-top:18px;align-items:flex-end}
.comment-input-row textarea{flex:1;resize:none}
.sort-toggle{display:flex;gap:6px}

/* trust screen */
.trust-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.ring-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadeInUp .4s ease backwards}
.ring-wrap{position:relative;width:150px;height:150px;margin:6px 0 16px}
.ring-score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-score b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ring-score span{font-size:11px;color:var(--muted)}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700}
.status-pill.ok{background:var(--ok-bg);color:var(--ok)}
.status-pill.warn{background:var(--warn-bg);color:var(--warn)}
.breakdown-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.breakdown-row:last-child{border-bottom:none}
.breakdown-label{width:120px;font-size:12.5px;font-weight:700;flex:0 0 120px}
.breakdown-bar{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.breakdown-bar>div{height:100%;border-radius:999px}
.breakdown-val{width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border-soft)}
.user-row:last-child{border-bottom:none}
.user-row .a{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:0 0 32px}
.user-row .a img{width:100%;height:100%}
.shimmer{background:linear-gradient(90deg,var(--surface-2) 25%,#e7edf5 37%,var(--surface-2) 63%);background-size:400px 100%;animation:shimmerSweep 1.4s infinite linear;border-radius:8px}

/* profile */
.profile-hero{background:linear-gradient(135deg,#eaf3ff,#fbeeff);border-radius:var(--radius-card);padding:28px;display:flex;align-items:center;gap:18px;margin-bottom:20px;position:relative;overflow:hidden}
.profile-hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(229,92,255,.18),transparent 70%);right:-60px;top:-60px;animation:blobDrift 8s ease-in-out infinite}
.profile-avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow-pop);position:relative;z-index:1}
.profile-avatar img{width:100%;height:100%}
.profile-name{font-size:19px;font-weight:800;position:relative;z-index:1}
.profile-hood{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px;position:relative;z-index:1}
.tab-row{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-soft)}
.tab-btn{padding:11px 16px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.tab-btn.active{color:var(--primary-ink);border-color:var(--primary)}
.mypost-row{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;margin-bottom:10px}
.mypost-title{font-size:13.5px;font-weight:700;margin-bottom:3px}
.mypost-meta{font-size:11.5px;color:var(--faint)}
.mypost-actions{margin-left:auto;display:flex;gap:6px}
.mypost-actions button{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.mypost-actions svg{width:14px;height:14px;color:var(--muted)}

/* toast + modal */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-pop);z-index:200;animation:toastRise .28s ease}
.toast svg{width:16px;height:16px;color:#8fd6b4}
.modal-overlay{position:fixed;inset:0;background:rgba(11,53,88,.42);display:flex;align-items:center;justify-content:center;z-index:150;animation:toastRise .2s ease}
.modal-box{background:#fff;border-radius:18px;padding:26px;width:360px;box-shadow:var(--shadow-pop)}
.modal-title{font-size:15.5px;font-weight:800;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

.section-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.empty-note{font-size:12px;color:var(--faint);text-align:center;padding:20px}
@media(max-width:1080px){.trust-grid{grid-template-columns:1fr}.feed-layout{flex-direction:column}.list-rail{width:100%;flex:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const NEIGHBORHOODS = ["은행나무길 3동","샛별마을 1단지","무지개공원 앞","다솜1길","별빛로 12"];
const CATS = [
  {id:"all", label:"전체"},
  {id:"info", label:"생활정보", color:"#006bff", bg:"#e8f2ff"},
  {id:"share", label:"나눔", color:"#12946a", bg:"#e3f7ee"},
  {id:"safe", label:"안전", color:"#d43a5c", bg:"#fde8ed"},
  {id:"ask", label:"동네질문", color:"#b57a12", bg:"#fdf1de"},
];
const catInfo = id => CATS.find(c=>c.id===id) || CATS[1];

const TRUST = {
  high:{label:"신뢰도 상", color:"#12946a", bg:"#e3f7ee"},
  mid:{label:"신뢰도 중", color:"#b57a12", bg:"#fdf1de"},
  low:{label:"신뢰도 하", color:"#6b7684", bg:"#eef1f4"},
};

const avatar = seed => `https://source.boringavatars.com/beam/64/${encodeURIComponent(seed)}?colors=006bff,e55cff,0099ff,d4e0ed,0b3558`;
const pic = (seed,w,h) => `https://picsum.photos/seed/neighhub-${seed}/${w}/${h}`;

const POSTS = [
  {id:1, cat:"info", title:"이번 주 목요일 재활용품 수거 시간 변경 안내", snip:"관리사무소 공지에 따르면 이번 주만 오전 8시로 앞당겨진다고 합니다. 미리 배출 부탁드려요.", author:"김보라", trust:"high", time:"12분 전", comments:9, img:pic("recycle",640,360)},
  {id:2, cat:"share", title:"안 쓰는 아기 옷 나눔합니다 (0~6개월)", snip:"세탁 완료된 상태고 박스째로 드릴게요. 픽업은 은행나무길 정문에서 가능합니다.", author:"이수민", trust:"high", time:"38분 전", comments:14, img:pic("babyclothes",640,360)},

function Icon({name, className}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[]);
  return <i data-lucide={name} ref={ref} className={className}></i>;
}

function Toast({text, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone,2600); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><Icon name="check-circle-2"/>{text}</div>;
}

function ConfirmModal({title, body, onCancel, onConfirm, confirmLabel}){
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{title}</div>

          <button className="btn btn-danger btn-sm" onClick={onConfirm}>{confirmLabel || "삭제"}</button>

    </div>
  );
}

              </div>
              <div className="mypost-actions">
                <button onClick={()=>showToast("게시글 수정 화면으로 이동합니다")}><Icon name="pencil"/></button>
                <button onClick={()=>setConfirmDel(p.id)}><Icon name="trash-2"/></button>
              </div>
            </div>
          )) : <div className="empty-note">작성한 게시글이 없습니다</div>
        ) : (
          <div className="section-card">
            <div className="field-group"><label className="field-label">닉네임</label><input className="field-input" defaultValue="김보라"/></div>
            <div className="field-group"><label className="field-label">알림 수신</label><select className="field-select"><option>전체 수신</option><option>중요 알림만</option></select></div>
            <button className="btn btn-primary" onClick={()=>showToast("설정이 저장되었습니다")}><Icon name="check"/>저장</button>
          </div>
        )}
      </div>
      {confirmDel && (
        <ConfirmModal
          title="게시글을 삭제할까요?"
          body="삭제하면 댓글을 포함한 모든 내용이 함께 사라지며 복구할 수 없습니다."
          onCancel={()=>setConfirmDel(null)}
          onConfirm={()=>{ setMyPosts(myPosts.filter(p=>p.id!==confirmDel)); setConfirmDel(null); showToast("게시글이 삭제되었습니다"); }}
        />
      )}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState("feed");
  const [toast, setToast] = useState(null);
  const showToast = (t) => setToast(t);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (
    <div className="app-shell">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main-wrap">
        {screen==="feed" && <FeedScreen showToast={showToast}/>}
        {screen==="write" && <WriteScreen showToast={showToast} setScreen={setScreen}/>}
        {screen==="comments" && <CommentsScreen showToast={showToast}/>}
        {screen==="trust" && <TrustScreen showToast={showToast}/>}
        {screen==="profile" && <ProfileScreen showToast={showToast}/>}
      </div>
      {toast && <Toast text={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
