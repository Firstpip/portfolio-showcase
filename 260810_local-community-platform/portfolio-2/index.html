<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이웃신뢰 활동 허브 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<style>
:root{
  --bg:#edede8; --surface:#ffffff; --surface-2:#dbdbd2; --surface-3:#f4f3ee;
  --border:#000000; --border-soft:#dcdbd3;
  --ink:#141414; --body:#292929; --muted:#6f6f6e; --faint:#8f8f8e;
  --accent:#4cc02b; --accent-ink:#2f7f19; --accent-bg:#e6f6dd;
  --warn:#b5750f; --warn-bg:#faedd6; --danger:#c23b4e; --danger-bg:#f9e2e5; --info:#0b6bcb; --info-bg:#e2eefb;
  --radius-pill:200px; --radius-card:14px; --radius-sm:8px;
  --shadow-flat:0 1px 0 rgba(0,0,0,.05);
  --shadow-pop:0 16px 40px -10px rgba(20,20,20,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--body); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:999px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{transform:scale(.6);opacity:.65}100%{transform:scale(2.2);opacity:0}}
@keyframes radarSweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes shimmerSweep{0%{background-position:-360px 0}100%{background-position:360px 0}}
@keyframes toastRise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes barGrow{from{width:0}to{width:var(--w,50%)}}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* topnav */
.topbar{position:sticky;top:0;z-index:40;width:100%;background:var(--surface);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:22px;padding:0 32px;height:64px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.01em}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto}
.nav-link{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.nav-link:hover{background:var(--surface-3)}
.nav-link.active{background:var(--ink);color:#fff}
.nav-link i{font-size:15px}
.topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.search-pill{display:flex;align-items:center;gap:7px;background:var(--surface-3);border-radius:var(--radius-pill);padding:8px 14px;width:170px}
.search-pill input{border:none;background:none;outline:none;width:100%;font-size:12.5px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn i{font-size:16px;color:var(--muted)}
.icon-btn .ping{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.page-wrap{flex:1;width:100%;padding:26px 32px 50px}
.page-head{max-width:1200px;margin:0 auto 20px}
.page-title{font-size:41px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:11px;line-height:1.1}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;transition:all .15s ease}
.btn i{font-size:15px}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-pop)}
.btn-accent{background:var(--accent);color:#12310a}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:#cfcec5}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:7px 14px;font-size:12px}

/* feed-timeline archetype */
.feed-layout{display:flex;justify-content:center;gap:24px;max-width:1200px;margin:0 auto}
.feed-col{flex:1;max-width:620px;min-width:0}
.composer{position:sticky;top:78px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:16px 18px;display:flex;gap:12px;align-items:center;margin-bottom:18px;box-shadow:var(--shadow-flat);z-index:10}
.composer input{flex:1;border:none;background:var(--surface-3);border-radius:var(--radius-pill);padding:11px 16px;outline:none;font-size:13px}
.post{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:18px 20px;margin-bottom:14px;animation:fadeInUp .4s ease backwards}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-head .avatar{width:38px;height:38px}
.author{font-size:13.5px;font-weight:800}
.handle{font-size:11.5px;color:var(--faint)}
.post-tag{margin-left:auto;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:var(--radius-pill)}
.post-body{font-size:13.5px;line-height:1.7;color:var(--body);margin-bottom:12px}
.post-img{width:100%;border-radius:10px;margin-bottom:12px;display:block}
.post-actions{display:flex;align-items:center;gap:4px;border-top:1px solid var(--border-soft);padding-top:10px}
.post-actions button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;color:var(--muted)}
.post-actions button:hover{background:var(--surface-3)}
.post-actions button.on{color:var(--accent-ink);background:var(--accent-bg)}
.post-actions i{font-size:15px}

.right-rail{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:16px}
.rail-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:18px}
.rail-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:12px}
.rail-rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.rail-rank-row:last-child{border-bottom:none}
.rail-rank-num{width:20px;font-size:12px;font-weight:800;color:var(--faint)}
.rail-rank-row .avatar{width:26px;height:26px}
.rail-cta{background:linear-gradient(160deg,#141414,#2c2c2c);color:#fff;border-radius:var(--radius-card);padding:18px}
.rail-cta i{color:var(--accent);font-size:22px;margin-bottom:8px;display:block}

/* generic section card */
.section-card{max-width:1200px;margin:0 auto;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:26px;animation:fadeInUp .4s ease backwards}
.section-title{font-size:15.5px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* location verify */
.loc-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1200px;margin:0 auto}
.radar-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:24px;text-align:center}
.radar-wrap{position:relative;width:220px;height:220px;margin:10px auto 18px;border-radius:50%;background:radial-gradient(circle,var(--accent-bg) 0%,var(--surface-3) 70%,transparent 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.radar-ring{position:absolute;border:1.5px solid rgba(76,192,43,.35);border-radius:50%}
.radar-sweep{position:absolute;inset:0;background:conic-gradient(from 0deg, rgba(76,192,43,.35), transparent 35%);animation:radarSweep 3s linear infinite;border-radius:50%}
.radar-pin{position:relative;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:19px}
.radar-pulse{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--accent);animation:pulseRing 2s ease-out infinite;z-index:1}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:700}
.status-pill.ok{background:var(--accent-bg);color:var(--accent-ink)}
.status-pill.pending{background:var(--warn-bg);color:var(--warn)}
.adapter-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.adapter-row:last-child{border-bottom:none}
.badge-toggle{display:flex;background:var(--surface-3);border-radius:var(--radius-pill);padding:3px}
.badge-toggle button{padding:6px 13px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;color:var(--muted)}
.badge-toggle button.active{background:var(--ink);color:#fff}
.verify-list{display:flex;flex-direction:column;gap:10px}
.verify-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.verify-item:last-child{border-bottom:none}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 26px}

/* moderation */
.mod-table{width:100%;border-collapse:collapse}
.mod-table th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.03em}
.mod-table td{padding:13px 12px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle}
.mod-table tr:last-child td{border-bottom:none}
.state-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--radius-pill)}
.report-count{font-weight:800;color:var(--danger)}
.mod-actions{display:flex;gap:6px}
.mod-actions button{padding:6px 11px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700}
.log-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.log-item:last-child{border-bottom:none}
.log-item i{color:var(--accent-ink)}

/* ranking */
.rank-podium{display:flex;align-items:flex-end;gap:16px;justify-content:center;margin-bottom:26px}
.podium-item{text-align:center}
.podium-bar{width:96px;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-weight:800;color:#fff}
.rank-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.rank-row:last-child{border-bottom:none}
.rank-num{width:24px;font-weight:800;color:var(--faint);font-size:13px}
.rank-trend{font-size:11.5px;font-weight:700;width:44px}
.rank-bar-track{flex:1;height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.rank-bar-fill{height:100%;background:var(--accent);border-radius:999px;animation:barGrow 1s ease forwards}

/* notifications */
.notif-item{display:flex;gap:13px;padding:15px 4px;border-bottom:1px solid var(--border-soft)}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:var(--accent-bg);border-radius:10px;padding-left:14px}
.notif-icon{width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.notif-icon i{font-size:16px}
.notif-text{font-size:13px}
.notif-time{font-size:11.5px;color:var(--faint);margin-top:3px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-pop);z-index:200;animation:toastRise .28s ease}
.toast i{color:var(--accent);font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:center;justify-content:center;z-index:150;animation:toastRise .2s ease}
.modal-box{background:#fff;border-radius:16px;padding:26px;width:360px;box-shadow:var(--shadow-pop)}
.modal-title{font-size:15.5px;font-weight:800;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.shimmer{background:linear-gradient(90deg,var(--surface-3) 25%,#eceae0 37%,var(--surface-3) 63%);background-size:400px 100%;animation:shimmerSweep 1.4s infinite linear}
@media(max-width:1080px){.loc-grid{grid-template-columns:1fr}.feed-layout{flex-direction:column;align-items:center}.right-rail{width:100%;max-width:620px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const avatar = seed => `https://source.boringavatars.com/beam/64/${encodeURIComponent(seed)}?colors=141414,4cc02b,dbdbd2,edede8,292929`;
const pic = (seed,w,h) => `https://picsum.photos/seed/trusthub-${seed}/${w}/${h}`;

const FEED = [
  {author:"윤태호", handle:"은행나무길", time:"3분 전", tag:"인증 활동", tagColor:"#2f7f19", tagBg:"#e6f6dd",
   body:"오늘 아침 위치 인증을 마치고 첫 게시글을 남겨요! 앞으로 동네 소식 자주 올릴게요.", img:null, like:24, comment:5, share:2},
  {author:"관리자봇", handle:"운영 알림", time:"18분 전", tag:"모더레이션", tagColor:"#b5750f", tagBg:"#faedd6",
   body:"신고 누적 3건 이상 게시글 1건이 검토중 상태로 전환되었습니다.", img:null, like:3, comment:0, share:0},
  {author:"임서연", handle:"샛별마을 1단지", time:"41분 전", tag:"활동 랭킹", tagColor:"#0b6bcb", tagBg:"#e2eefb",
   body:"이번 주 우리 동네가 활동 랭킹 2위에 올랐어요! 다들 고생 많으셨습니다 🎉", img:pic("celebrate",600,320), like:58, comment:12, share:6},
  {author:"배준호", handle:"무지개공원 앞", time:"1시간 전", tag:"인증 활동", tagColor:"#2f7f19", tagBg:"#e6f6dd",
   body:"위치 인증 반경이 넓어져서 이제 공원 벤치에서도 인증이 됩니다. 확인해보세요.", img:null, like:19, comment:8, share:1},
  {author:"한지우", handle:"다솜1길", time:"2시간 전", tag:"신뢰 뱃지", tagColor:"#141414", tagBg:"#dbdbd2",
   body:"활동 점수가 쌓여서 드디어 신뢰 뱃지 '상' 등급이 됐어요. 꾸준한 참여의 힘이네요.", img:pic("badge",600,320), like:41, comment:9, share:3},
  {author:"강민재", handle:"별빛로 12", time:"3시간 전", tag:"모더레이션", tagColor:"#b5750f", tagBg:"#faedd6",
   body:"택배 도난 관련 게시글에 대한 조치 이력이 공개되어 안심이 됩니다.", img:null, like:12, comment:4, share:0},
];

const RANK = [
  {name:"샛별마을 1단지", score:942, trend:"+3", up:true},
  {name:"은행나무길 3동", score:918, trend:"+1", up:true},
  {name:"무지개공원 앞", score:874, trend:"-1", up:false},
  {name:"다솜1길", score:801, trend:"+2", up:true},
  {name:"별빛로 12", score:760, trend:"0", up:null},
];

const REPORTS = [
  {title:"택배 도난 CCTV 확인 요청 드려요", author:"강민재", reason:"과도한 개인정보 노출", count:5, status:"검토중"},
  {title:"놀이터 근처 소음 민원 심하네요...", author:"익명", reason:"욕설/비방", count:8, status:"접수"},
  {title:"헬스장 이용 관련 불만글", author:"오세훈", reason:"허위사실", count:3, status:"조치완료"},
  {title:"단지 내 흡연 목격담 공유", author:"정하은", reason:"부적절한 사진", count:2, status:"접수"},
];

const LOGS = [
  {icon:"ph-eye-slash", text:"관리자가 '놀이터 소음 민원' 게시글을 숨김 처리했습니다.", time:"12분 전"},
  {icon:"ph-warning-circle", text:"'헬스장 이용 관련' 게시글 작성자에게 경고가 발송되었습니다.", time:"1시간 전"},
  {icon:"ph-trash", text:"허위사실 유포 댓글 2건이 삭제되었습니다.", time:"어제"},
];

const NOTIFS = [
  {icon:"ph-chat-circle-dots", text:"윤태호님이 회원님의 게시글에 댓글을 남겼습니다.", time:"방금", unread:true},
  {icon:"ph-shield-check", text:"위치 인증이 완료되어 신뢰 뱃지가 갱신되었습니다.", time:"5분 전", unread:true},
  {icon:"ph-trophy", text:"이번 주 활동 랭킹 2위에 올랐습니다.", time:"1시간 전", unread:true},
  {icon:"ph-flag", text:"신고하신 게시글이 조치완료로 처리되었습니다.", time:"3시간 전", unread:false},
  {icon:"ph-heart", text:"배준호님 외 12명이 게시글에 공감했습니다.", time:"어제", unread:false},
];

function Icon({name, className}){ return <i className={"ph "+name+(className?" "+className:"")}></i>; }

function Toast({text, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone,2600); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><Icon name="ph-check-circle"/>{text}</div>;
}

function ConfirmModal({title, body, onCancel, onConfirm, confirmLabel}){
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div className="modal-body">{body}</div>
        <div className="modal-actions">
          <button className="btn btn-ghost btn-sm" onClick={onCancel}>취소</button>
          <button className="btn btn-danger btn-sm" onClick={onConfirm}>{confirmLabel||"확인"}</button>
        </div>
      </div>
    </div>
  );
}

function Topbar({screen, setScreen}){
  const items = [
    {id:"main", label:"활동 피드", icon:"ph-house"},
    {id:"location-verify", label:"위치 기반 동네 인증", icon:"ph-map-pin-line"},
    {id:"moderation", label:"관리자 모더레이션 및 신고 처리", icon:"ph-shield-warning"},
    {id:"ranking", label:"활동 랭킹 및 신뢰 뱃지", icon:"ph-trophy"},
    {id:"notifications", label:"알림 센터", icon:"ph-bell"},
  ];
  return (
    <header className="topbar">
      <div className="brand"><div className="brand-mark"><Icon name="ph-users-three"/></div><span className="brand-name">이웃신뢰 활동 허브</span></div>
      <nav className="nav-links">
        {items.map(it=>(
          <button key={it.id} className={"nav-link"+(screen===it.id?" active":"")} onClick={()=>setScreen(it.id)}>
            <Icon name={it.icon}/>{it.label}
          </button>
        ))}
      </nav>
      <div className="topbar-right">
        <div className="search-pill"><Icon name="ph-magnifying-glass"/><input placeholder="검색"/></div>
        <button className="icon-btn" onClick={()=>setScreen("notifications")}><Icon name="ph-bell"/><span className="ping"></span></button>
        <div className="avatar"><img src={avatar("윤태호")}/></div>
      </div>
    </header>
  );
}

function PageHead({title, sub, icon}){
  return (
    <div className="page-head">
      <div className="page-title"><Icon name={icon}/>{title}</div>
      <div className="page-sub">{sub}</div>
    </div>
  );
}

function FeedScreen({showToast}){
  const [liked, setLiked] = useState({});
  const toggleLike = i => setLiked({...liked, [i]: !liked[i]});
  return (
    <div className="page-wrap" data-archetype="feed-timeline">
      <PageHead title="동네 활동 피드" sub="이웃들의 게시·댓글·인증 활동을 실시간으로 모아봅니다" icon="ph-lightning"/>
      <div className="feed-layout">
        <div className="feed-col">
          <div className="composer">
            <div className="avatar"><img src={avatar("윤태호")}/></div>
            <input placeholder="무슨 소식이 있나요?" onFocus={()=>showToast("게시글 작성 화면(맞춤 데모 P1)으로 연결됩니다")}/>
            <button className="btn btn-accent btn-sm" onClick={()=>showToast("게시 기능은 P1 맞춤 구현 데모에서 확인할 수 있습니다")}>게시</button>
          </div>
          {FEED.map((p,i)=>(
            <article className="post" key={i} style={{animationDelay:(i*0.05)+"s"}}>
              <div className="post-head">
                <div className="avatar"><img src={avatar(p.author)}/></div>
                <div><div className="author">{p.author}</div><div className="handle">{p.handle} · <time>{p.time}</time></div></div>
                <span className="post-tag" style={{color:p.tagColor, background:p.tagBg}}>{p.tag}</span>
              </div>
              <div className="post-body">{p.body}</div>
              {p.img && <img className="post-img" src={p.img}/>}
              <div className="post-actions">
                <button className={liked[i]?"on":""} onClick={()=>toggleLike(i)}><Icon name={liked[i]?"ph-heart-fill":"ph-heart"}/>좋아요 {p.like+(liked[i]?1:0)}</button>
                <button onClick={()=>showToast("댓글 작성 및 조회 화면(P1)에서 확인할 수 있습니다")}><Icon name="ph-chat-circle"/>댓글 {p.comment}</button>
                <button onClick={()=>showToast("게시글 링크가 복사되었습니다")}><Icon name="ph-share-network"/>공유 {p.share}</button>
              </div>
            </article>
          ))}
        </div>
        <aside className="right-rail">
          <div className="rail-card">
            <div className="rail-title">이번 주 활동 랭킹</div>
            {RANK.slice(0,3).map((r,i)=>(
              <div className="rail-rank-row" key={i}>
                <span className="rail-rank-num">{i+1}</span>
                <div className="avatar"><img src={avatar(r.name)}/></div>
                <span style={{fontSize:12.5,fontWeight:700,flex:1}}>{r.name}</span>
                <span style={{fontSize:11.5,fontWeight:800,color:"var(--accent-ink)"}}>{r.trend}</span>
              </div>
            ))}
          </div>
          <div className="rail-cta">
            <Icon name="ph-map-pin-line"/>
            <div style={{fontWeight:800,fontSize:13.5,marginBottom:4}}>아직 위치 인증 전이신가요?</div>
            <div style={{fontSize:12,color:"#c8c8c8",marginBottom:12,lineHeight:1.5}}>동네 인증을 마치면 신뢰 뱃지와 활동 랭킹에 반영됩니다.</div>
            <button className="btn btn-accent btn-sm" style={{width:"100%",justifyContent:"center"}} onClick={()=>showToast("위치 기반 동네 인증 화면으로 이동합니다")}>지금 인증하기</button>
          </div>
        </aside>
      </div>
    </div>
  );
}

function LocationScreen({showToast}){
  const [status, setStatus] = useState("idle");
  const [provider, setProvider] = useState("A");
  const request = () => { setStatus("checking"); setTimeout(()=>{ setStatus("verified"); showToast("위치 인증이 완료되었습니다"); }, 1400); };
  return (
    <div className="page-wrap" data-archetype="feed-timeline">
      <PageHead title="위치 기반 동네 인증" sub="실거주 반경 내 위치를 확인해 인증 배지를 부여합니다" icon="ph-map-pin-line"/>
      <div className="loc-grid">
        <div className="radar-card">
          <div className="radar-wrap">
            <div className="radar-ring" style={{width:200,height:200}}></div>
            <div className="radar-ring" style={{width:140,height:140}}></div>
            <div className="radar-ring" style={{width:80,height:80}}></div>
            {status==="checking" && <div className="radar-sweep"></div>}
            {status==="verified" && <div className="radar-pulse"></div>}
            <div className="radar-pin"><Icon name="ph-user"/></div>
          </div>
          <span className={"status-pill "+(status==="verified"?"ok":"pending")}>
            <Icon name={status==="verified"?"ph-check-circle":"ph-clock"}/>
            {status==="idle" && "위치 인증 대기 중"}
            {status==="checking" && "좌표 수집 및 반경 확인 중..."}
            {status==="verified" && "은행나무길 3동 인증 완료"}
          </span>
          <div style={{marginTop:16}}>
            <button className="btn btn-primary" onClick={request} disabled={status==="checking"}>
              <Icon name="ph-crosshair"/>{status==="verified" ? "다시 인증하기" : "현재 위치로 인증 요청"}
            </button>
          </div>
        </div>
        <div className="section-card" style={{margin:0}}>
          <div className="section-title"><Icon name="ph-plugs-connected"/>외부 위치 인증 제공자 어댑터</div>
          <div className="adapter-row">
            <span style={{fontSize:13,fontWeight:700}}>연동 제공자</span>
            <div className="badge-toggle">
              <button className={provider==="A"?"active":""} onClick={()=>{setProvider("A"); showToast("브로커A 제공자로 전환되었습니다");}}>브로커 A</button>
              <button className={provider==="B"?"active":""} onClick={()=>{setProvider("B"); showToast("브로커B 제공자로 전환되었습니다");}}>브로커 B</button>
            </div>
          </div>
          <div className="adapter-row"><span style={{fontSize:13}}>반경 판정 방식</span><span style={{fontSize:12.5,color:"var(--muted)"}}>좌표 1차 검증 → 제공자 응답 위임</span></div>
          <div className="adapter-row"><span style={{fontSize:13}}>평균 응답 시간</span><span style={{fontSize:12.5,color:"var(--muted)"}}>약 900ms (시뮬레이션)</span></div>

          <div className="section-title" style={{marginTop:22}}><Icon name="ph-list-checks"/>인증 처리 단계</div>
          <div className="verify-list">
            {[
              {label:"브라우저 Geolocation 좌표 수집", done:status!=="idle"},
              {label:"서버 검증 엔드포인트 전달 및 반경 1차 계산", done:status==="verified"},
              {label:"어댑터 통해 외부 제공자 최종 판정 수신", done:status==="verified"},
              {label:"동네 인증 배지 프로필에 반영", done:status==="verified"},
            ].map((s,i)=>(
              <div className="verify-item" key={i}>
                <span className="step-dot" style={{background:s.done?"var(--accent-bg)":"var(--surface-3)", color:s.done?"var(--accent-ink)":"var(--faint)"}}>
                  {s.done ? <Icon name="ph-check"/> : i+1}
                </span>
                <span style={{fontSize:13}}>{s.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function ModerationScreen({showToast}){
  const [reports, setReports] = useState(REPORTS);
  const [confirmAction, setConfirmAction] = useState(null);
  const setState = (i, s) => { const r=[...reports]; r[i]={...r[i], status:s}; setReports(r); };
  const stateColor = s => s==="접수" ? {bg:"var(--warn-bg)",c:"var(--warn)"} : s==="검토중" ? {bg:"#e2eefb",c:"#0b6bcb"} : {bg:"var(--accent-bg)",c:"var(--accent-ink)"};
  return (
    <div className="page-wrap" data-archetype="feed-timeline">
      <PageHead title="관리자 모더레이션 및 신고 처리" sub="신고 내역을 검토해 숨김·삭제·경고 조치를 내립니다" icon="ph-shield-warning"/>
      <div className="section-card" style={{marginBottom:16}}>
        <div className="section-title"><Icon name="ph-list-bullets"/>신고 우선순위 큐 (신고 누적순)</div>
        <table className="mod-table">
          <thead><tr><th>게시글</th><th>신고 사유</th><th>신고 횟수</th><th>상태</th><th>조치</th></tr></thead>
          <tbody>
            {reports.sort((a,b)=>b.count-a.count).map((r,i)=>{
              const sc = stateColor(r.status);
              return (
                <tr key={i}>
                  <td><div style={{fontWeight:700}}>{r.title}</div><div style={{fontSize:11.5,color:"var(--faint)"}}>{r.author}</div></td>
                  <td style={{color:"var(--muted)"}}>{r.reason}</td>
                  <td className="report-count">{r.count}건</td>
                  <td><span className="state-badge" style={{background:sc.bg,color:sc.c}}>{r.status}</span></td>
                  <td>
                    <div className="mod-actions">
                      <button className="btn-ghost" onClick={()=>{setState(i,"검토중"); showToast("검토중 상태로 전환했습니다");}}>숨김</button>
                      <button className="btn-danger" onClick={()=>setConfirmAction(i)}>삭제</button>
                      <button className="btn-ghost" onClick={()=>{setState(i,"조치완료"); showToast("작성자에게 경고를 발송했습니다");}}>경고</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="section-card">
        <div className="section-title"><Icon name="ph-clock-counter-clockwise"/>조치 이력 로그</div>
        {LOGS.map((l,i)=>(
          <div className="log-item" key={i}><Icon name={l.icon}/><span style={{flex:1}}>{l.text}</span><span style={{color:"var(--faint)"}}>{l.time}</span></div>
        ))}
      </div>
      {confirmAction!==null && (
        <ConfirmModal
          title="게시글을 삭제할까요?"
          body="삭제 조치는 조치 이력 로그에 기록되며 작성자에게 알림이 발송됩니다."
          confirmLabel="삭제 처리"
          onCancel={()=>setConfirmAction(null)}
          onConfirm={()=>{ setState(confirmAction,"조치완료"); setConfirmAction(null); showToast("게시글이 삭제 조치되었습니다"); }}
        />
      )}
    </div>
  );
}

function RankingScreen(){
  const podium = [RANK[1], RANK[0], RANK[2]];
  const heights = [96, 128, 74];
  const colors = ["#8f8f8e", "#141414", "#c08a2b"];
  return (
    <div className="page-wrap" data-archetype="feed-timeline">
      <PageHead title="활동 랭킹 및 신뢰 뱃지" sub="Redis 실시간 집계와 주간 배치 재계산을 결합한 동네별 활동 랭킹" icon="ph-trophy"/>
      <div className="section-card" style={{marginBottom:16}}>
        <div className="rank-podium">
          {podium.map((r,i)=>(
            <div className="podium-item" key={i}>
              <div className="avatar" style={{width:44,height:44,margin:"0 auto 8px"}}><img src={avatar(r.name)}/></div>
              <div style={{fontSize:12,fontWeight:700,marginBottom:8,maxWidth:96}}>{r.name}</div>
              <div className="podium-bar" style={{height:heights[i], background:colors[i]}}>{i===1?"1":i===0?"2":"3"}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="section-card">
        <div className="section-title"><Icon name="ph-chart-bar"/>전체 순위 (이번 주 · 매주 월요일 자동 재계산)</div>
        {RANK.map((r,i)=>(
          <div className="rank-row" key={i}>
            <span className="rank-num">{i+1}</span>
            <div className="avatar"><img src={avatar(r.name)}/></div>
            <span style={{fontSize:13,fontWeight:700,width:130}}>{r.name}</span>
            <div className="rank-bar-track"><div className="rank-bar-fill" style={{"--w":(r.score/942*100)+"%"}}></div></div>
            <span style={{fontSize:12.5,fontWeight:800,width:44,textAlign:"right"}}>{r.score}</span>
            <span className="rank-trend" style={{color:r.up===true?"var(--accent-ink)":r.up===false?"var(--danger)":"var(--faint)"}}>
              {r.up===true && "▲"}{r.up===false && "▼"}{r.up===null && "—"} {r.trend}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function NotificationsScreen({showToast}){
  const [notifs, setNotifs] = useState(NOTIFS);
  return (
    <div className="page-wrap" data-archetype="feed-timeline">
      <PageHead title="알림 센터" sub="댓글·인증·랭킹 변동 등 실시간 알림을 모아봅니다" icon="ph-bell"/>
      <div className="section-card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div className="section-title" style={{marginBottom:0}}><Icon name="ph-bell-ringing"/>최근 알림 {notifs.filter(n=>n.unread).length}개 안읽음</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setNotifs(notifs.map(n=>({...n,unread:false}))); showToast("모든 알림을 읽음으로 표시했습니다");}}>모두 읽음 처리</button>
        </div>
        {notifs.map((n,i)=>(
          <div className={"notif-item"+(n.unread?" unread":"")} key={i} onClick={()=>{ const c=[...notifs]; c[i]={...c[i],unread:false}; setNotifs(c); }}>
            <div className="notif-icon"><Icon name={n.icon}/></div>
            <div style={{flex:1}}>
              <div className="notif-text">{n.text}</div>
              <div className="notif-time"><time>{n.time}</time></div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState("main");
  const [toast, setToast] = useState(null);
  const showToast = t => setToast(t);
  return (
    <div className="app-shell">
      <Topbar screen={screen} setScreen={setScreen}/>
      {screen==="main" && <FeedScreen showToast={showToast}/>}
      {screen==="location-verify" && <LocationScreen showToast={showToast}/>}
      {screen==="moderation" && <ModerationScreen showToast={showToast}/>}
      {screen==="ranking" && <RankingScreen/>}
      {screen==="notifications" && <NotificationsScreen showToast={showToast}/>}
      {toast && <Toast text={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
