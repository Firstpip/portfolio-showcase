<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모아 — 관심사 큐레이션 커뮤니티</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --color-primary:#006bff;
    --color-primary-dark:#0059d6;
    --color-secondary:#d4e0ed;
    --color-accent:#e55cff;
    --color-accent-2:#0099ff;
    --color-bg:#f8f9fb;
    --color-surface:#ffffff;
    --color-input:#f0f3f8;
    --color-text:#0b3558;
    --color-text-2:#476788;
    --color-text-3:#a6bbd1;
    --color-hairline:#d4e0ed;
    --shadow-card: rgba(71,103,136,0.04) 0px 4px 5px 0px, rgba(71,103,136,0.03) 0px 8px 15px 0px, rgba(71,103,136,0.08) 0px 30px 50px 0px;
    --shadow-btn: rgba(71,103,136,0.04) 0px 4px 5px 0px, rgba(71,103,136,0.03) 0px 8px 15px 0px, rgba(71,103,136,0.06) 0px 15px 30px 0px;
    --radius-card:24px;
    --radius-product:16px;
    --radius-btn:8px;
    --radius-badge:9999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:var(--color-bg);
    color:var(--color-text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes heartPop{0%{transform:scale(1);}35%{transform:scale(1.35);}60%{transform:scale(0.92);}100%{transform:scale(1);}}
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  @keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(12px,-10px) scale(1.05);}}

  .screen{animation:fadeIn .35s ease both;}

  /* ---- topnav ---- */
  .topnav{
    position:sticky;top:0;z-index:40;width:100%;
    background:rgba(248,249,251,0.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--color-hairline);
    height:64px;display:flex;align-items:center;
  }
  .topnav-inner{max-width:1200px;margin:0 auto;width:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--color-text);}
  .brand .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 4px var(--color-secondary);}
  .nav-tabs{display:flex;align-items:center;gap:4px;background:var(--color-input);padding:4px;border-radius:var(--radius-badge);}
  .nav-tab{border:none;background:transparent;padding:8px 18px;border-radius:var(--radius-badge);font-size:14px;font-weight:600;color:var(--color-text-2);transition:all .2s ease;}
  .nav-tab.active{background:var(--color-surface);color:var(--color-primary);box-shadow:var(--shadow-btn);}
  .nav-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--color-text);transition:background .2s ease;}
  .icon-btn:hover{background:var(--color-input);}
  .icon-btn.labeled{width:auto;padding:0 14px;gap:6px;font-size:14px;font-weight:600;border-radius:var(--radius-badge);}
  .badge-wrap{position:relative;}
  .badge-dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--color-accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .search-input-wrap{display:flex;align-items:center;gap:6px;background:var(--color-input);border-radius:var(--radius-badge);padding:6px 12px;width:220px;animation:slideUp .2s ease both;}
  .search-input-wrap input{border:none;background:transparent;outline:none;font-size:13px;color:var(--color-text);width:100%;}
  .avatar-btn{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--color-surface);box-shadow:var(--shadow-btn);padding:0;}
  .avatar-btn img{width:100%;height:100%;display:block;}

  /* ---- notif dropdown ---- */
  .notif-panel{
    position:absolute;top:56px;right:24px;width:340px;max-width:90vw;
    background:var(--color-surface);border-radius:16px;box-shadow:var(--shadow-card);
    border:1px solid var(--color-hairline);overflow:hidden;z-index:50;animation:slideUp .2s ease both;
  }
  .notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--color-hairline);}
  .notif-head h4{margin:0;font-size:15px;font-weight:700;}
  .notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f3f8;}
  .notif-item:last-child{border-bottom:none;}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--color-primary);margin-top:6px;flex-shrink:0;}
  .notif-item p{margin:0;font-size:13px;color:var(--color-text);line-height:1.5;}
  .notif-item span{font-size:11px;color:var(--color-text-3);}
  .notif-foot{padding:10px 16px;text-align:center;}
  .notif-foot button{background:none;border:none;color:var(--color-primary);font-size:13px;font-weight:600;}

  /* ---- layout / archetype ---- */
  .layout-wrap{display:flex;justify-content:center;gap:28px;max-width:1200px;margin:0 auto;padding:28px 24px 80px;width:100%;}
  .feed-main{max-width:600px;width:100%;flex:1;min-width:0;}
  .right-rail{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}
  @media (max-width:920px){
    .layout-wrap{flex-direction:column;align-items:center;padding:20px 16px 60px;}
    .right-rail{width:100%;max-width:600px;}
    .nav-tabs{display:none;}
    .search-input-wrap{width:150px;}
  }

  /* ---- hero ---- */
  .hero-card{
    position:relative;overflow:hidden;background:var(--color-surface);
    border-radius:var(--radius-card);padding:36px 32px;margin-bottom:16px;
    box-shadow:var(--shadow-card);
  }
  .hero-blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:floatBlob 7s ease-in-out infinite;}
  .hero-blob.b1{width:160px;height:160px;background:var(--color-accent);top:-60px;right:-40px;}
  .hero-blob.b2{width:120px;height:120px;background:var(--color-accent-2);bottom:-50px;right:80px;animation-delay:1.5s;}
  .hero-card h1{position:relative;z-index:1;font-size:40px;line-height:1.2;font-weight:700;margin:0 0 10px;color:var(--color-text);letter-spacing:-.5px;}
  .hero-card p{position:relative;z-index:1;font-size:16px;color:var(--color-text-2);margin:0;max-width:420px;}

  /* ---- composer (sticky) ---- */
  .composer{
    position:sticky;top:76px;z-index:20;background:var(--color-surface);
    border-radius:var(--radius-card);padding:14px 16px;margin-bottom:20px;
    box-shadow:var(--shadow-card);display:flex;align-items:center;gap:12px;
    border:1px solid var(--color-hairline);
  }
  .composer img.avatar-sm{width:40px;height:40px;border-radius:50%;flex-shrink:0;}
  .composer .composer-text{flex:1;font-size:14px;color:var(--color-text-3);}
  .btn-primary{
    background:var(--color-primary);color:#fff;border:none;font-weight:600;
    font-size:14px;padding:10px 18px;border-radius:var(--radius-btn);box-shadow:var(--shadow-btn);
    display:flex;align-items:center;gap:6px;transition:background .2s ease, transform .15s ease;
  }
  .btn-primary:hover{background:var(--color-primary-dark);transform:translateY(-1px);}
  .btn-primary:disabled{background:var(--color-text-3);cursor:not-allowed;transform:none;}
  .btn-dark{background:var(--color-text);color:#fff;border:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius-btn);}
  .btn-ghost{background:transparent;border:1px solid var(--color-hairline);color:var(--color-text);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius-btn);}
  .btn-outline-primary{background:#fff;border:1.5px solid var(--color-primary);color:var(--color-primary);font-weight:600;font-size:13px;padding:7px 14px;border-radius:var(--radius-badge);}
  .btn-outline-primary.following{background:var(--color-primary);color:#fff;}

  /* ---- filter tags row ---- */
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .filter-chip{border:1px solid var(--color-hairline);background:var(--color-surface);color:var(--color-text-2);font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--radius-badge);transition:all .2s ease;}
  .filter-chip.active{background:var(--color-text);color:#fff;border-color:var(--color-text);}

  /* ---- post card ---- */
  .post{
    background:var(--color-surface);border-radius:var(--radius-card);padding:20px;
    margin-bottom:16px;box-shadow:var(--shadow-card);border:1px solid transparent;
    transition:transform .2s ease, box-shadow .2s ease;animation:fadeIn .4s ease both;
  }
  .post:hover{transform:translateY(-3px);border-color:var(--color-hairline);}
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .post-head img.avatar{width:42px;height:42px;border-radius:50%;}
  .post-head .who{flex:1;min-width:0;}
  .post-head .author{font-size:14px;font-weight:700;color:var(--color-text);display:flex;align-items:center;gap:6px;}
  .post-head .author .src-badge{font-size:11px;font-weight:600;background:var(--color-input);color:var(--color-text-2);padding:2px 8px;border-radius:var(--radius-badge);}
  .post-head time{font-size:12px;color:var(--color-text-3);}
  .post-tag{font-size:11px;font-weight:700;color:var(--color-primary);background:#e6f0ff;padding:3px 10px;border-radius:var(--radius-badge);}
  .post-body h3{font-size:17px;margin:0 0 6px;color:var(--color-text);font-weight:700;}
  .post-body p{font-size:14px;line-height:1.65;color:var(--color-text-2);margin:0 0 10px;}
  .post-body img.post-img{width:100%;border-radius:var(--radius-product);display:block;margin-bottom:10px;}
  .src-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--color-primary);font-weight:600;margin-bottom:10px;}
  .post-actions{display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px solid #f0f3f8;}
  .post-actions button{background:transparent;border:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-text-2);padding:8px 12px;border-radius:var(--radius-btn);transition:background .2s ease;}
  .post-actions button:hover{background:var(--color-input);}
  .post-actions button.liked{color:var(--color-accent);}
  .post-actions button.liked .heart-icon{animation:heartPop .4s ease;}
  .post-actions .spacer{flex:1;}
  .detail-link-btn{background:transparent;border:none;font-size:13px;font-weight:700;color:var(--color-primary);padding:8px 10px;}

  /* ---- skeleton ---- */
  .skeleton-card{background:var(--color-surface);border-radius:var(--radius-card);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  .skel-line{height:14px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,#eef1f6 0px, #f8f9fb 40px, #eef1f6 80px);background-size:600px;animation:shimmer 1.4s infinite linear;}

  /* ---- right rail widgets ---- */
  .widget{background:var(--color-surface);border-radius:20px;padding:20px;box-shadow:var(--shadow-card);}
  .widget h4{margin:0 0 14px;font-size:14px;font-weight:700;color:var(--color-text);display:flex;align-items:center;gap:6px;}
  .tag-pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .creator-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .creator-row:last-child{margin-bottom:0;}
  .creator-row img{width:36px;height:36px;border-radius:50%;}
  .creator-row .info{flex:1;min-width:0;}
  .creator-row .info .name{font-size:13px;font-weight:700;color:var(--color-text);}
  .creator-row .info .meta{font-size:11px;color:var(--color-text-3);}
  .stat-row-mini{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;}
  .stat-num{font-size:28px;font-weight:700;color:var(--color-text);}
  .stat-sub{font-size:12px;color:var(--color-text-2);}

  /* ---- post-write screen ---- */
  .write-card{background:var(--color-surface);border-radius:var(--radius-card);padding:32px;box-shadow:var(--shadow-card);max-width:640px;margin:28px auto;}
  .write-card .back-row{display:flex;align-items:center;gap:6px;color:var(--color-text-2);font-size:13px;font-weight:600;margin-bottom:18px;background:none;border:none;padding:0;}
  .write-card h2{font-size:24px;margin:0 0 20px;font-weight:700;color:var(--color-text);}
  .field-label{font-size:13px;font-weight:700;color:var(--color-text);margin-bottom:6px;display:block;}
  .field-input{width:100%;border:1px solid var(--color-hairline);border-radius:var(--radius-btn);padding:12px 14px;font-size:15px;margin-bottom:18px;outline:none;background:var(--color-input);color:var(--color-text);}
  .field-input:focus{border-color:var(--color-primary);}
  textarea.field-input{min-height:140px;resize:vertical;line-height:1.6;}
  .dropzone{border:2px dashed var(--color-hairline);border-radius:var(--radius-product);padding:24px;text-align:center;margin-bottom:18px;color:var(--color-text-3);font-size:13px;transition:border-color .2s ease, background .2s ease;}
  .dropzone:hover{border-color:var(--color-primary);background:#f5f9ff;}
  .image-chip{display:inline-flex;align-items:center;gap:8px;background:var(--color-input);padding:8px 12px;border-radius:var(--radius-btn);font-size:13px;margin-bottom:18px;}
  .image-chip button{background:none;border:none;color:var(--color-text-2);display:flex;}
  .draft-note{font-size:12px;color:var(--color-text-3);margin-bottom:18px;display:flex;align-items:center;gap:6px;}
  .write-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* ---- post-detail screen ---- */
  .detail-wrap{max-width:640px;margin:28px auto;}
  .detail-card{background:var(--color-surface);border-radius:var(--radius-card);padding:28px;box-shadow:var(--shadow-card);margin-bottom:20px;}
  .comment-card{background:var(--color-surface);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-card);}
  .comment-card h4{font-size:15px;font-weight:700;margin:0 0 16px;}
  .comment-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f0f3f8;}
  .comment-item:last-child{border-bottom:none;}
  .comment-item img{width:32px;height:32px;border-radius:50%;flex-shrink:0;}
  .comment-item .c-body{flex:1;}
  .comment-item .c-author{font-size:13px;font-weight:700;color:var(--color-text);}
  .comment-item .c-time{font-size:11px;color:var(--color-text-3);margin-left:6px;font-weight:400;}
  .comment-item p{margin:4px 0 0;font-size:13px;color:var(--color-text-2);line-height:1.5;}
  .comment-input-row{display:flex;gap:8px;margin-top:16px;align-items:center;}
  .comment-input-row input{flex:1;border:1px solid var(--color-hairline);border-radius:var(--radius-badge);padding:10px 16px;font-size:13px;outline:none;background:var(--color-input);}

  /* ---- mypage screen ---- */
  .mypage-wrap{max-width:600px;margin:28px auto;}
  .login-card{background:var(--color-surface);border-radius:var(--radius-card);padding:36px;box-shadow:var(--shadow-card);text-align:center;}
  .login-card h2{font-size:24px;margin:0 0 6px;font-weight:700;}
  .login-card .sub{font-size:13px;color:var(--color-text-2);margin-bottom:24px;}
  .login-tabs{display:flex;background:var(--color-input);border-radius:var(--radius-badge);padding:4px;margin-bottom:22px;}
  .login-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:var(--radius-badge);font-size:13px;font-weight:700;color:var(--color-text-2);}
  .login-tabs button.active{background:var(--color-surface);color:var(--color-primary);box-shadow:var(--shadow-btn);}
  .profile-header{display:flex;align-items:center;gap:16px;background:var(--color-surface);border-radius:var(--radius-card);padding:24px;box-shadow:var(--shadow-card);margin-bottom:18px;}
  .profile-header img{width:64px;height:64px;border-radius:50%;}
  .profile-header .name{font-size:18px;font-weight:700;color:var(--color-text);}
  .profile-header .bio{font-size:13px;color:var(--color-text-2);}
  .profile-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .profile-tabs button{flex:1;background:var(--color-surface);border:1px solid var(--color-hairline);padding:12px;border-radius:var(--radius-btn);font-size:13px;font-weight:700;color:var(--color-text-2);}
  .profile-tabs button.active{background:var(--color-text);color:#fff;border-color:var(--color-text);}
  .mini-post-row{display:flex;gap:12px;background:var(--color-surface);border-radius:16px;padding:14px;box-shadow:var(--shadow-card);margin-bottom:10px;align-items:center;}
  .mini-post-row img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .mini-post-row .t{font-size:13px;font-weight:700;color:var(--color-text);margin-bottom:4px;}
  .mini-post-row .m{font-size:11px;color:var(--color-text-3);}

  /* ---- toast ---- */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--color-text);color:#fff;padding:14px 22px;border-radius:var(--radius-badge);font-size:13px;font-weight:600;box-shadow:var(--shadow-card);z-index:100;animation:slideUp .3s ease both;display:flex;align-items:center;gap:8px;}
</style>
</head>

function Toast({ message, onDone }) {
  useEffect(() => {

    return () => clearTimeout(t);
  }, []);

  return (
    <div className="toast">

  );
}

function App() {
  const [view, setView] = useState('feed');
  const [posts, setPosts] = useState(INITIAL_POSTS);
  const [loading, setLoading] = useState(true);
  const [activeTag, setActiveTag] = useState('전체');
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifItems, setNotifItems] = useState(NOTIFICATIONS);
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [selectedPost, setSelectedPost] = useState(null);
  const [toast, setToast] = useState('');
  const [loggedIn, setLoggedIn] = useState('김지은');
  const [following, setFollowing] = useState({});

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 600);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  const visiblePosts = query.trim()
    ? posts.filter((p) => (p.title + p.body + p.tag).toLowerCase().includes(query.toLowerCase()))
    : posts;

  const toggleLike = (id) => {
    setPosts((prev) => prev.map((p) => (p.id === id ? { ...p, liked: !p.liked, likes: p.liked ? p.likes - 1 : p.likes + 1 } : p)));
    setSelectedPost((prev) => (prev && prev.id === id ? { ...prev, liked: !prev.liked, likes: prev.liked ? prev.likes - 1 : prev.likes + 1 } : prev));
  };

  const openDetail = (post) => {
    const fresh = posts.find((p) => p.id === post.id) || post;
    setSelectedPost(fresh);
    setView('post-detail');
  };

  const addComment = (postId, text) => {
    const newComment = { id: Date.now(), author: '나', avatarSeed: '나', time: '방금 전', text };
    setPosts((prev) => prev.map((p) => (p.id === postId ? { ...p, comments: [...p.comments, newComment] } : p)));
    setSelectedPost((prev) => (prev ? { ...prev, comments: [...prev.comments, newComment] } : prev));
    setToast('댓글이 등록되었습니다');
  };

  const submitPost = (title, body, image) => {
    const newPost = {
      id: Date.now(), type: 'member', author: '나', avatarSeed: '나', time: '방금 전', tag: '라이프',
      title, body, img: image ? `https://picsum.photos/seed/new-${Date.now()}/600/360` : null,
      likes: 0, liked: false, comments: [],
    };
    setPosts((prev) => [newPost, ...prev]);
    setToast('게시글이 등록되었습니다');
    setView('feed');
  };

  const shareUrl = (post) => {
    setToast('링크가 복사되었습니다');
  };

  const toggleFollow = (name) => {
    setFollowing((prev) => ({ ...prev, [name]: !prev[name] }));
  };

  const markAllRead = () => {
    setNotifItems([]);
  };

  return (
    <div data-archetype="feed-timeline" style={{ width: '100%', minHeight: '100vh' }}>
      <TopNav
        view={view} setView={setView} unread={notifItems.length}
        notifOpen={notifOpen} setNotifOpen={setNotifOpen}
        searchOpen={searchOpen} setSearchOpen={setSearchOpen}
        query={query} setQuery={setQuery}
      />
      {notifOpen && <NotifPanel items={notifItems} onMarkAll={markAllRead} onClose={() => setNotifOpen(false)} />}

      {view === 'feed' && (
        <FeedScreen
          posts={visiblePosts} loading={loading} activeTag={activeTag} setActiveTag={setActiveTag}
          onCompose={() => setView('post-write')} onToggleLike={toggleLike} onOpenDetail={openDetail} onShare={shareUrl}
          following={following} onToggleFollow={toggleFollow}
        />
      )}
      {view === 'post-write' && <WriteScreen onCancel={() => setView('feed')} onSubmit={submitPost} />}
      {view === 'post-detail' && <DetailScreen post={selectedPost} onBack={() => setView('feed')} onToggleLike={toggleLike} onAddComment={addComment} />}
      {view === 'mypage' && <MyPageScreen loggedIn={loggedIn} onLogin={(name) => { setLoggedIn(name); setToast('로그인되었습니다'); }} onLogout={() => { setLoggedIn(false); setToast('로그아웃되었습니다'); }} posts={posts} following={following} />}

      <Toast message={toast} onDone={() => setToast('')} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
