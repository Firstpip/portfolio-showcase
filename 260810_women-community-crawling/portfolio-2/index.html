<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    --color-primary:#ffc7fa;
    --color-primary-text:#292827;
    --color-secondary:#e3e3e2;
    --color-accent:#79f61e;
    --color-danger:#d64545;
    --color-bg:#f2f0eb;
    --color-surface:#ffffff;
    --color-input:#eceae4;
    --color-text:#292827;
    --color-text-2:#666666;
    --color-text-3:#9a9793;
    --color-border:#e3e3e2;
    --shadow-card: 0 1px 2px rgba(41,40,39,.04), 0 8px 20px rgba(41,40,39,.08);
    --shadow-elevated: 0 4px 10px rgba(41,40,39,.06), 0 16px 32px rgba(41,40,39,.12);
    --radius-card:16px;
    --radius-btn:10px;
    --radius-badge:999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;background:var(--color-bg);color:var(--color-text);-webkit-font-smoothing:antialiased;font-size:13px;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  table{border-collapse:collapse;width:100%;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(121,246,30,.5);}50%{opacity:.7;box-shadow:0 0 0 5px rgba(121,246,30,0);}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}

  .screen{animation:fadeIn .3s ease both;}

  /* ---- sidebar-classic golden pattern ---- */
  .app-shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--color-surface);
    border-right:1px solid var(--color-border);display:flex;flex-direction:column;z-index:30;
  }
  .sidebar-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border-bottom:1px solid var(--color-border);}
  .sidebar-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);animation:pulseDot 2s infinite;}
  .env-select{margin:12px 16px;font-size:11px;font-weight:700;background:var(--color-input);border-radius:8px;padding:8px 10px;color:var(--color-text-2);display:flex;justify-content:space-between;align-items:center;}
  .sidebar-scroll{flex:1;overflow-y:auto;padding-bottom:16px;}
  .sidebar-section{padding:14px 12px 4px;}
  .sidebar-section-title{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--color-text-3);text-transform:uppercase;padding:0 8px 6px;}
  .sidebar-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--color-text-2);margin-bottom:2px;}
  .sidebar-link.active{background:var(--color-text);color:#fff;}
  .sidebar-link .n{margin-left:auto;font-size:10px;font-weight:700;background:var(--color-danger);color:#fff;padding:1px 6px;border-radius:99px;}
  .main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);min-height:100vh;}

  .page-header{padding:22px 28px 0;position:relative;}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .page-title{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;}
  .page-actions{display:flex;gap:8px;}
  .page-meta{font-size:11.5px;color:var(--color-text-3);margin-bottom:16px;}
  .btn{border:none;border-radius:var(--radius-btn);font-size:12.5px;font-weight:700;padding:9px 14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s ease, box-shadow .15s ease;}
  .btn-primary{background:var(--color-primary);color:var(--color-primary-text);box-shadow:var(--shadow-card);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated);}
  .btn-secondary{background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);}
  .btn-danger{background:#fdeaea;color:var(--color-danger);}
  .btn-ghost{background:transparent;color:var(--color-text-2);border:1px solid var(--color-border);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  /* ---- hero gradient banner (Superhuman gradient-band signature) ---- */
  .hero-banner{
    margin:16px 28px 20px;border-radius:20px;padding:26px 28px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 18% 30%, rgba(255,199,250,.85) 0%, transparent 55%),
      radial-gradient(circle at 82% 20%, rgba(121,246,30,.35) 0%, transparent 50%),
      radial-gradient(circle at 60% 90%, rgba(255,199,250,.5) 0%, transparent 55%),
      var(--color-text);
    box-shadow:var(--shadow-elevated);
  }
  .hero-banner h2{color:#fff;font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0 0 8px;position:relative;z-index:1;}
  .hero-banner p{color:rgba(255,255,255,.72);font-size:13px;margin:0;max-width:520px;position:relative;z-index:1;}
  .hero-banner .hb-pills{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;}
  .hero-banner .hb-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;backdrop-filter:blur(4px);}

  /* ---- stat row (command-tower status strip) ---- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 28px;margin-bottom:16px;}
  .stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-card);}
  .stat-label{font-size:11px;font-weight:700;color:var(--color-text-3);margin-bottom:6px;}
  .stat-value-row{display:flex;align-items:flex-end;justify-content:space-between;}
  .stat-value{font-size:32px;font-weight:700;letter-spacing:-.5px;}
  .radar-decor{position:absolute;top:14px;right:28px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at center, rgba(121,246,30,.14), transparent 70%);}
  .radar-sweep{animation:radarSpin 4s linear infinite;transform-origin:60px 60px;}
  .radar-blip{animation:pulseDot 1.6s infinite;}
  @keyframes radarSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .stat-delta{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .stat-delta.positive{color:#3d6b0f;background:#eaffce;}
  .stat-delta.negative{color:var(--color-danger);background:#fdeaea;}
  .stat-spark{margin-top:8px;}

  /* ---- primary-focus: execution timeline ---- */
  .section-block{padding:0 28px;margin-bottom:20px;}
  .panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:18px 20px;box-shadow:var(--shadow-card);}
  .panel h3{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .timeline-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .timeline-row:last-child{margin-bottom:0;}
  .timeline-label{width:150px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--color-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .timeline-bars{display:flex;gap:3px;align-items:flex-end;height:26px;flex:1;}
  .timeline-bar{width:9px;border-radius:2px;transform-origin:bottom;animation:barGrow .5s ease both;}
  .timeline-bar.ok{background:var(--color-accent);}
  .timeline-bar.fail{background:var(--color-danger);}
  .timeline-bar.pending{background:var(--color-border);}
  .timeline-meta{width:110px;text-align:right;font-size:11px;color:var(--color-text-3);flex-shrink:0;}

  /* two-col: primary-focus + priority-rail */
  .split-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;padding:0 28px;margin-bottom:20px;align-items:start;}
  .queue-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1efe9;}
  .queue-item:last-child{border-bottom:none;}
  .queue-badge{width:6px;height:28px;border-radius:3px;background:var(--color-danger);flex-shrink:0;}
  .queue-info{flex:1;min-width:0;}
  .queue-info .name{font-size:12.5px;font-weight:700;}
  .queue-info .reason{font-size:11px;color:var(--color-text-3);}
  .retry-btn{font-size:11px;font-weight:700;background:var(--color-input);border:none;border-radius:7px;padding:6px 10px;color:var(--color-text);flex-shrink:0;}

  .secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 28px;margin-bottom:20px;}
  .progress-item{margin-bottom:12px;}
  .progress-item:last-child{margin-bottom:0;}
  .progress-item .plabel{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--color-text-2);margin-bottom:5px;}
  .progress-track{height:6px;background:var(--color-input);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;background:var(--color-text);}

  /* ---- tab bar + table ---- */
  .data-section{padding:0 28px 40px;}
  .tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-bottom:14px;}
  .tab{background:none;border:none;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--color-text-3);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--color-text);border-bottom-color:var(--color-primary);}
  .data-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
  .data-toolbar input{flex:1;max-width:260px;border:1px solid var(--color-border);border-radius:8px;padding:8px 12px;font-size:12.5px;background:var(--color-surface);outline:none;}
  .filter-chip{border:1px solid var(--color-border);background:var(--color-surface);border-radius:99px;padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--color-text-2);}
  .filter-chip.active{background:var(--color-text);color:#fff;border-color:var(--color-text);}
  .export-btn{margin-left:auto;background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .data-table-wrap{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-card);}
  .data-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--color-text-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;background:#faf9f6;border-bottom:1px solid var(--color-border);}
  .data-table td{padding:10px 14px;font-size:12.5px;border-bottom:1px solid #f1efe9;color:var(--color-text);}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tbody tr{transition:background .15s ease;}
  .data-table tbody tr:hover{background:#faf9f6;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;}
  .badge.success{background:#eaffce;color:#3d6b0f;}
  .badge.fail{background:#fdeaea;color:var(--color-danger);}
  .badge.pending{background:#f0eee7;color:var(--color-text-2);}
  .badge.active{background:#eaffce;color:#3d6b0f;}
  .badge.paused{background:#fdf3d8;color:#946b0a;}
  .badge.blocked{background:#fdeaea;color:var(--color-danger);}

  /* ---- toggle switch ---- */
  .switch{width:36px;height:20px;border-radius:99px;background:var(--color-border);position:relative;border:none;flex-shrink:0;transition:background .2s ease;}
  .switch.on{background:var(--color-accent);}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on .knob{transform:translateX(16px);}

  /* ---- source card ---- */
  .source-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-card);margin-bottom:12px;}
  .source-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .source-card .sname{font-size:14px;font-weight:700;}
  .source-card .sdomain{font-size:11px;color:var(--color-text-3);margin-top:2px;}
  .source-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #f1efe9;}
  .source-meta-grid .m-label{font-size:10px;color:var(--color-text-3);font-weight:700;margin-bottom:3px;}
  .source-meta-grid .m-val{font-size:13px;font-weight:700;}

  /* ---- moderation ---- */
  .mod-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1efe9;}
  .mod-row:last-child{border-bottom:none;}
  .mod-row img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .mod-row .title{font-size:12.5px;font-weight:700;}
  .mod-row .meta{font-size:11px;color:var(--color-text-3);}
  .checkbox{width:16px;height:16px;accent-color:var(--color-text);flex-shrink:0;}

  /* ---- modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(41,40,39,.45);display:flex;align-items:center;justify-content:center;z-index:80;animation:fadeIn .2s ease both;}
  .modal-card{background:var(--color-surface);border-radius:18px;padding:26px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-elevated);animation:slideUp .25s ease both;}
  .modal-card h3{margin:0 0 16px;font-size:17px;font-weight:700;}
  .field-label{font-size:12px;font-weight:700;color:var(--color-text);margin-bottom:5px;display:block;}
  .field-input{width:100%;border:1px solid var(--color-border);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px;outline:none;background:var(--color-input);color:var(--color-text);}
  .field-input:focus{border-color:var(--color-text);}
  textarea.field-input{min-height:80px;resize:vertical;font-family:monospace;font-size:12px;}
  .field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  /* ---- toast ---- */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--color-text);color:#fff;padding:12px 20px;border-radius:99px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-elevated);z-index:100;animation:slideUp .3s ease both;display:flex;align-items:center;gap:8px;}

  @media (max-width:1080px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .split-grid, .secondary-grid{grid-template-columns:1fr;}
  }
</style>
</head>

function Toast({ message, onDone }) {
  useEffect(() => {
    if (!message) return;
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return <div className="toast"><Icon name="check-circle" size={15} />{message}</div>;
}

function Switch({ on, onToggle }) {
  return (
    <button className={"switch" + (on ? ' on' : '')} onClick={onToggle}>
      <span className="knob"></span>
    </button>
  );
}

function Sidebar({ view, setView, queueCount }) {

    <button className={"sidebar-link" + (view === id ? ' active' : '')} onClick={() => setView(id)}>
      <Icon name={icon} size={16} />
      {label}
      {badge > 0 && <span className="n">{badge}</span>}
    </button>
  );

function DashboardScreen({ sources, jobLog, queue, onRetry, periodDays, setPeriodDays }) {
  const [tab, setTab] = useState('all');
  const [search, setSearch] = useState('');
  const filteredLog = jobLog.filter((j) => (tab === 'all' ? true : j.status === tab) && j.source.includes(search));

  const timelineFor = (sourceName) => {
    const seedBase = sourceName.length;
    return Array.from({ length: 24 }, (_, i) => {
      const r = (seedBase * (i + 3)) % 10;
      if (r < 1) return 'fail';
      if (r < 2) return 'pending';
      return 'ok';
    });
  };

  return (
    <div className="screen">
      <PageHeader decor title="크롤링 관제 대시보드" meta={`마지막 갱신 · 방금 전 · Production 환경 · 소스 ${sources.length}개 운영 중`}>
        <button className="btn btn-secondary" onClick={() => setPeriodDays(periodDays === 7 ? 30 : 7)}>
          <Icon name="calendar-blank" size={14} />최근 {periodDays}일
        </button>
        <button className="btn btn-primary" onClick={() => alert('전체 소스에 대해 수동 수집을 시작합니다 (데모)')}>
          <Icon name="play" size={14} />수동 수집 실행
        </button>
      </PageHeader>

      <div className="hero-banner">
        <h2>오늘도 커뮤니티 콘텐츠 파이프라인이 안정적으로 순환하고 있어요</h2>
        <p>다중 소스 크롤링부터 게시물·댓글 반영, 신고 콘텐츠 검수까지 한 화면의 관제탑에서 흐름을 확인할 수 있습니다.</p>
        <div className="hb-pills">
          <span className="hb-pill">소스 {sources.length}개 연동</span>
          <span className="hb-pill">오늘 게시물 312건 반영</span>
          <span className="hb-pill">재시도 대기 {queue.length}건</span>
        </div>
      </div>

      <div className="stat-row">
        <div className="stat-card">
          <div className="stat-label">활성 소스</div>
          <div className="stat-value-row"><span className="stat-value">{sources.filter(s => s.status === 'active').length}</span><span className="stat-delta positive">+1</span></div>
          <svg className="stat-spark" width="100%" height="24" viewBox="0 0 120 24"><polyline points="0,18 20,14 40,16 60,8 80,10 100,4 120,6" fill="none" stroke="var(--color-accent)" strokeWidth="2" /></svg>
        </div>
        <div className="stat-card">
          <div className="stat-label">오늘 수집 건수</div>
          <div className="stat-value-row"><span className="stat-value">312</span><span className="stat-delta positive">+8%</span></div>
          <svg className="stat-spark" width="100%" height="24" viewBox="0 0 120 24"><polyline points="0,20 20,15 40,17 60,10 80,12 100,6 120,3" fill="none" stroke="var(--color-text)" strokeWidth="2" /></svg>
        </div>
        <div className="stat-card">
          <div className="stat-label">실패율</div>
          <div className="stat-value-row"><span className="stat-value">4.2%</span><span className="stat-delta negative">+0.8%</span></div>
          <svg className="stat-spark" width="100%" height="24" viewBox="0 0 120 24"><polyline points="0,6 20,10 40,8 60,12 80,10 100,16 120,18" fill="none" stroke="var(--color-danger)" strokeWidth="2" /></svg>
        </div>
        <div className="stat-card">
          <div className="stat-label">재시도 대기</div>
          <div className="stat-value-row"><span className="stat-value">{queue.length}</span><span className="stat-delta negative">대응 필요</span></div>
          <svg className="stat-spark" width="100%" height="24" viewBox="0 0 120 24"><polyline points="0,10 20,10 40,14 60,10 80,10 100,14 120,10" fill="none" stroke="var(--color-text-3)" strokeWidth="2" /></svg>
        </div>
      </div>

      <div className="split-grid">
        <div className="panel">
          <h3><Icon name="chart-bar" size={16} />소스별 24시간 실행 이력</h3>
          {sources.map((s) => (
            <div className="timeline-row" key={s.id}>
              <div className="timeline-label">{s.name}</div>
              <div className="timeline-bars">
                {timelineFor(s.name).map((st, i) => (
                  <div key={i} className={"timeline-bar " + st} style={{ height: st === 'ok' ? '100%' : st === 'fail' ? '60%' : '35%', animationDelay: (i * 0.02) + 's' }}></div>
                ))}
              </div>
              <div className="timeline-meta">성공률 {s.successRate}%</div>
            </div>
          ))}
        </div>
        <div className="panel">
          <h3><Icon name="warning" size={16} />우선 대응 큐</h3>
          {queue.length === 0 && <div style={{ fontSize: 12, color: 'var(--color-text-3)' }}>대응이 필요한 작업이 없습니다</div>}
          {queue.map((q) => (
            <div className="queue-item" key={q.id}>
              <div className="queue-badge"></div>
              <div className="queue-info">
                <div className="name">{q.name}</div>
                <div className="reason">{q.reason} · 재시도 {q.retries}회</div>
              </div>
              <button className="retry-btn" onClick={() => onRetry(q.id)}>재시도</button>
            </div>
          ))}
        </div>
      </div>

      <div className="secondary-grid">
        <div className="panel">
          <h3><Icon name="sliders" size={16} />소스별 딜레이 정책</h3>
          {sources.map((s) => (
            <div className="progress-item" key={s.id}>
              <div className="plabel"><span>{s.name}</span><span>{s.delay}ms</span></div>
              <div className="progress-track"><div className="progress-fill" style={{ width: Math.min(100, (s.delay / 2500) * 100) + '%' }}></div></div>
            </div>
          ))}
        </div>
        <div className="panel">
          <h3><Icon name="percent" size={16} />소스별 성공률 분포</h3>
          {sources.map((s) => (
            <div className="progress-item" key={s.id}>
              <div className="plabel"><span>{s.name}</span><span>{s.successRate}%</span></div>
              <div className="progress-track"><div className="progress-fill" style={{ width: s.successRate + '%', background: s.successRate > 90 ? 'var(--color-accent)' : 'var(--color-text)' }}></div></div>
            </div>
          ))}
        </div>
      </div>

      <div className="data-section">
        <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px 0' }}>
            <h3 style={{ marginBottom: 12 }}><Icon name="list-magnifying-glass" size={16} />최근 실행 로그</h3>
            <div className="tab-bar">
              <button className={"tab" + (tab === 'all' ? ' active' : '')} onClick={() => setTab('all')}>전체</button>
              <button className={"tab" + (tab === 'success' ? ' active' : '')} onClick={() => setTab('success')}>성공</button>
              <button className={"tab" + (tab === 'fail' ? ' active' : '')} onClick={() => setTab('fail')}>실패</button>
              <button className={"tab" + (tab === 'pending' ? ' active' : '')} onClick={() => setTab('pending')}>대기</button>
            </div>
            <div className="data-toolbar">
              <input placeholder="소스명 검색" value={search} onChange={(e) => setSearch(e.target.value)} />
              <button className="export-btn" onClick={() => alert('CSV 파일로 로그를 내보냅니다 (데모)')}><Icon name="download-simple" size={14} />내보내기</button>
            </div>
          </div>
          <div className="data-table-wrap" style={{ border: 'none', borderRadius: 0, boxShadow: 'none' }}>
            <table className="data-table">
              <thead><tr><th>시각</th><th>소스</th><th>상태</th><th>수집 건수</th><th>소요 시간</th></tr></thead>
              <tbody>
                {filteredLog.map((j) => (
                  <tr key={j.id}>
                    <td>{j.time}</td>
                    <td>{j.source}</td>
                    <td><span className={"badge " + j.status}>{j.status === 'success' ? '성공' : j.status === 'fail' ? '실패' : '대기'}</span></td>
                    <td>{j.items}</td>
                    <td>{j.duration}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function SourcesScreen({ sources, onAdd, onToggleStatus, onToggleDedupe }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [name, setName] = useState('');
  const [domain, setDomain] = useState('');
  const [selector, setSelector] = useState('{\n  "list": ".post-item",\n  "title": ".post-title"\n}');
  const [delay, setDelay] = useState(1500);
  const [concurrency, setConcurrency] = useState(1);

  const submit = () => {
    if (!name.trim() || !domain.trim()) return;
    onAdd({ id: Date.now(), name, domain, selectors: 3, delay: Number(delay), concurrency: Number(concurrency), dedupe: true, status: 'active', lastRun: '등록 대기', successRate: 0 });
    setModalOpen(false);
    setName(''); setDomain('');
  };

  return (
    <div className="screen">
      <PageHeader title="크롤러 소스 관리" meta={`등록된 소스 ${sources.length}개 · 신규 타겟 사이트를 코드 배포 없이 추가할 수 있습니다`}>
        <button className="btn btn-secondary" onClick={() => alert('설정을 CSV로 내보냅니다 (데모)')}><Icon name="export" size={14} />설정 내보내기</button>
        <button className="btn btn-primary" onClick={() => setModalOpen(true)}><Icon name="plus" size={14} />신규 소스 등록</button>
      </PageHeader>

      <div className="section-block">
        {sources.map((s) => (
          <div className="source-card" key={s.id}>
            <div className="source-card-top">
              <div>
                <div className="sname">{s.name}</div>
                <div className="sdomain">{s.domain}</div>
              </div>
              <span className={"badge " + s.status}>{s.status === 'active' ? '수집 중' : '일시중지'}</span>
            </div>
            <div className="source-meta-grid">
              <div><div className="m-label">셀렉터</div><div className="m-val">{s.selectors}개</div></div>
              <div><div className="m-label">딜레이</div><div className="m-val">{s.delay}ms</div></div>
              <div><div className="m-label">동시성</div><div className="m-val">{s.concurrency}</div></div>
              <div><div className="m-label">최근 실행</div><div className="m-val" style={{ fontSize: 12 }}>{s.lastRun}</div></div>
            </div>
            <div style={{ display: 'flex', gap: 20, marginTop: 14, paddingTop: 12, borderTop: '1px solid #f1efe9', alignItems: 'center' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <Switch on={s.dedupe} onToggle={() => onToggleDedupe(s.id)} />
                <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--color-text-2)' }}>중복 방지</span>
              </div>
              <button className="btn btn-ghost" style={{ marginLeft: 'auto', padding: '6px 12px' }} onClick={() => onToggleStatus(s.id)}>
                <Icon name={s.status === 'active' ? 'pause' : 'play'} size={13} />
                {s.status === 'active' ? '일시중지' : '재개'}
              </button>
            </div>
          </div>
        ))}
      </div>

      {modalOpen && (
        <div className="modal-overlay" onClick={() => setModalOpen(false)}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3>신규 소스 등록</h3>
            <label className="field-label">사이트명</label>
            <input className="field-input" placeholder="예: 홈리빙 매거진" value={name} onChange={(e) => setName(e.target.value)} />
            <label className="field-label">도메인</label>
            <input className="field-input" placeholder="예: homeliving-mag.example.com" value={domain} onChange={(e) => setDomain(e.target.value)} />
            <label className="field-label">CSS 셀렉터 (JSON)</label>
            <textarea className="field-input" value={selector} onChange={(e) => setSelector(e.target.value)} />
            <div className="field-row-2">
              <div>
                <label className="field-label">딜레이 (ms)</label>
                <input className="field-input" type="number" value={delay} onChange={(e) => setDelay(e.target.value)} />
              </div>
              <div>
                <label className="field-label">동시성</label>
                <input className="field-input" type="number" value={concurrency} onChange={(e) => setConcurrency(e.target.value)} />
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => setModalOpen(false)}>취소</button>
              <button className="btn btn-primary" onClick={submit}><Icon name="check" size={14} />등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ModerationScreen({ items, onToggleCheck, onAction, onBulkAction }) {
  const checkedCount = items.filter((i) => i.checked).length;
  const [confirmModal, setConfirmModal] = useState(null);

  return (
    <div className="screen">
      <PageHeader title="콘텐츠 관리" meta="신고 접수된 게시글이 우선순위 큐 상단에 노출됩니다">
        <button className="btn btn-secondary" onClick={() => alert('검수 완료된 항목을 CSV로 내보냅니다 (데모)')}><Icon name="export" size={14} />검수 이력 내보내기</button>
        <button className="btn btn-danger" disabled={checkedCount === 0} onClick={() => setConfirmModal('bulk')}>
          <Icon name="eye-slash" size={14} />선택 항목 일괄 숨김 ({checkedCount})
        </button>
      </PageHeader>

      <div className="section-block">
        <div className="panel" style={{ padding: 0 }}>
          {items.map((it) => (
            <div className="mod-row" key={it.id}>
              <input type="checkbox" className="checkbox" checked={it.checked} onChange={() => onToggleCheck(it.id)} />
              {it.img ? <img src={it.img} alt={it.title} /> : <div style={{ width: 36, height: 36, borderRadius: 8, background: 'var(--color-input)', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="file-text" size={16} style={{ color: 'var(--color-text-3)' }} /></div>}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="title">{it.title}</div>
                <div className="meta">{it.author} · 신고 {it.reportCount}건 · {it.reason}</div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '6px 10px' }} onClick={() => onAction(it.id, 'hide')}><Icon name="eye-slash" size={13} />숨김</button>
              <button className="btn btn-danger" style={{ padding: '6px 10px' }} onClick={() => onAction(it.id, 'delete')}><Icon name="trash" size={13} />삭제</button>
            </div>
          ))}
          {items.length === 0 && <div style={{ padding: 24, textAlign: 'center', color: 'var(--color-text-3)', fontSize: 12.5 }}>검수 대기 중인 신고 항목이 없습니다</div>}
        </div>
      </div>

      {confirmModal && (
        <div className="modal-overlay" onClick={() => setConfirmModal(null)}>
          <div className="modal-card" style={{ width: 380 }} onClick={(e) => e.stopPropagation()}>
            <h3>일괄 숨김 처리</h3>
            <p style={{ fontSize: 13, color: 'var(--color-text-2)', marginBottom: 20 }}>선택한 {checkedCount}건의 게시글을 숨김 처리하시겠습니까? 트랜잭션 처리로 부분 실패 없이 전체 반영됩니다.</p>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => setConfirmModal(null)}>취소</button>
              <button className="btn btn-danger" onClick={() => { onBulkAction('hide'); setConfirmModal(null); }}>일괄 숨김</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MembersScreen({ members, onToggleBlock }) {
  const [sortDesc, setSortDesc] = useState(true);
  const [search, setSearch] = useState('');

    .filter((m) => m.nickname.includes(search))
    .sort((a, b) => (sortDesc ? b.reportCount - a.reportCount : a.reportCount - b.reportCount));

  return (
    <div className="screen">
      <PageHeader title="회원 관리" meta={`전체 회원 ${members.length}명 · 신고 누적 기준 위험 회원을 우선 식별합니다`}>
        <button className="btn btn-secondary" onClick={() => setSortDesc(!sortDesc)}><Icon name="sort-descending" size={14} />신고순 정렬</button>
        <button className="btn btn-primary" onClick={() => alert('회원 목록을 CSV로 내보냅니다 (데모)')}><Icon name="download-simple" size={14} />명단 내보내기</button>
      </PageHeader>

      <div className="section-block">
        <div className="data-toolbar" style={{ marginBottom: 12 }}>
          <input placeholder="닉네임 검색" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>닉네임</th><th>이메일</th><th>가입일</th><th>누적 신고</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {sorted.map((m) => (
                <tr key={m.id}>
                  <td style={{ fontWeight: 700 }}>{m.nickname}</td>
                  <td>{m.email}</td>
                  <td>{m.joined}</td>
                  <td>{m.reportCount > 0 ? <span className="badge fail">{m.reportCount}건</span> : <span style={{ color: 'var(--color-text-3)' }}>0건</span>}</td>

                  <td>
                    <button className="btn btn-ghost" style={{ padding: '5px 10px' }} onClick={() => onToggleBlock(m.id)}>
                      {m.status === 'blocked' ? '차단 해제' : '차단'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

            ['weeklyDigest', '주간 운영 요약 리포트'],
          ].map(([key, label]) => (
            <div key={key} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid #f1efe9' }}>
              <span style={{ fontSize: 13, fontWeight: 600 }}>{label}</span>
              <Switch on={settings[key]} onToggle={() => onToggle(key)} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('dashboard');
  const [sources, setSources] = useState(SOURCES_INIT);
  const [jobLog] = useState(JOB_LOG_INIT);
  const [queue, setQueue] = useState(QUEUE_INIT);
  const [moderation, setModeration] = useState(MODERATION_INIT);
  const [members, setMembers] = useState(MEMBERS_INIT);
  const [toast, setToast] = useState('');
  const [periodDays, setPeriodDays] = useState(7);
  const [settings, setSettings] = useState({ defaultDelay: 1500, defaultConcurrency: 2, failAlert: true, reportAlert: true, weeklyDigest: false });

  const retryQueue = (id) => {
    setQueue((prev) => prev.filter((q) => q.id !== id));
    setToast('재시도 대기열에 등록되었습니다');
  };

  const addSource = (s) => {
    setSources((prev) => [s, ...prev]);
    setToast('신규 소스가 등록되었습니다. 다음 스케줄 주기부터 수집을 시작합니다');
  };

  const toggleSourceStatus = (id) => {
    setSources((prev) => prev.map((s) => (s.id === id ? { ...s, status: s.status === 'active' ? 'paused' : 'active' } : s)));
  };

  const toggleDedupe = (id) => {
    setSources((prev) => prev.map((s) => (s.id === id ? { ...s, dedupe: !s.dedupe } : s)));
  };

  const toggleCheck = (id) => {
    setModeration((prev) => prev.map((m) => (m.id === id ? { ...m, checked: !m.checked } : m)));
  };

  const moderationAction = (id, action) => {
    setModeration((prev) => prev.filter((m) => m.id !== id));
    setToast(action === 'hide' ? '게시글이 숨김 처리되었습니다' : '게시글이 삭제되었습니다');
  };

  const bulkModerationAction = () => {
    setModeration((prev) => prev.filter((m) => !m.checked));
    setToast('선택한 게시글이 일괄 숨김 처리되었습니다');
  };

  const toggleBlock = (id) => {
    setMembers((prev) => prev.map((m) => (m.id === id ? { ...m, status: m.status === 'blocked' ? 'active' : 'blocked' } : m)));
    setToast('회원 상태가 변경되었습니다');
  };

  const toggleSetting = (key) => setSettings((prev) => ({ ...prev, [key]: !prev[key] }));
  const changeDefault = (key, val) => setSettings((prev) => ({ ...prev, [key]: val }));

  return (
    <div data-archetype="stripe-multipane" className="app-shell">
      <Sidebar view={view} setView={setView} queueCount={queue.length} />
      <main className="main-wrap">
        {view === 'dashboard' && <DashboardScreen sources={sources} jobLog={jobLog} queue={queue} onRetry={retryQueue} periodDays={periodDays} setPeriodDays={setPeriodDays} />}
        {view === 'sources' && <SourcesScreen sources={sources} onAdd={addSource} onToggleStatus={toggleSourceStatus} onToggleDedupe={toggleDedupe} />}
        {view === 'moderation' && <ModerationScreen items={moderation} onToggleCheck={toggleCheck} onAction={moderationAction} onBulkAction={bulkModerationAction} />}
        {view === 'members' && <MembersScreen members={members} onToggleBlock={toggleBlock} />}
        {view === 'settings' && <SettingsScreen settings={settings} onToggle={toggleSetting} onChangeDefault={changeDefault} />}
      </main>
      <Toast message={toast} onDone={() => setToast('')} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
