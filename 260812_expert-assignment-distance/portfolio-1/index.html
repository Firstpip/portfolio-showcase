<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>

<style>
:root{
  --primary:#fa5d00; --primary-ink:#c94a00; --secondary:#c0bbb6; --accent:#1ef6da;
  --bg:#fff8f1; --surface:#ffffff; --surface-2:#fef1e6;
  --text:#1d1e1c; --text2:#615f5c; --border:#ecdfd3; --border-soft:#f4e9de;
  --ok:#0d8f6e; --ok-bg:#e2f6ee; --warn:#b8760f; --warn-bg:#fdf0dc; --idle:#8b8580; --idle-bg:#f0ece8;
  --danger:#c53d3d; --danger-bg:#fce7e7;
  --radius:16px; --radius-sm:10px; --radius-pill:999px;
  --shadow-card:0 2px 6px rgba(29,20,10,.06), 0 20px 44px -18px rgba(250,93,0,.28);
  --shadow-float:0 14px 36px -10px rgba(29,20,10,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

/* ── keyframes ── */
@keyframes pulseRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-220px 0}100%{background-position:220px 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes floatMarker{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.app-shell{display:flex;flex-direction:column;width:100%;min-height:100vh}

/* ── topbar / tabbar (map-canvas control chrome) ── */
.topbar{height:60px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#ff8a3d);display:flex;align-items:center;justify-content:center;color:#fff}
.topbar-right{display:flex;align-items:center;gap:10px}
.kpi-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-pill);background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--text2)}
.kpi-pill b{color:var(--primary);font-size:13.5px}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.tabbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;color:var(--text2);background:var(--surface-2);transition:all .15s}
.tab-btn:hover{color:var(--text);background:#f7e2ce}
.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px -4px rgba(250,93,0,.5)}
.tab-btn i{width:15px;height:15px}

.screen-container{flex:1;width:100%;position:relative;min-height:0}
.screen-fade{animation:fadeSlideUp .38s ease both}

/* ── main: map-canvas ── */
.map-view{position:absolute;inset:0;overflow:hidden}
.map{position:absolute;inset:0;background:
  radial-gradient(circle at 18% 22%, rgba(250,93,0,.10), transparent 40%),
  radial-gradient(circle at 78% 68%, rgba(30,246,218,.14), transparent 42%),
  linear-gradient(180deg,#fff8f1 0%,#fdeee0 100%);
}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(97,95,92,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(97,95,92,.07) 1px,transparent 1px);background-size:48px 48px}
.map-district{position:absolute;border-radius:22px;border:1.5px dashed rgba(97,95,92,.25);background:rgba(255,255,255,.35)}
.marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2;animation:floatMarker 3.4s ease-in-out infinite}
.marker-dot{width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.marker-pin{width:22px;height:22px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.26);display:flex;align-items:center;justify-content:center}
.marker-pin i{transform:rotate(45deg);width:11px;height:11px;color:#fff}
.marker-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--primary);animation:pulseRing 1.7s ease-out infinite}
.marker-label{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;color:var(--text);background:rgba(255,255,255,.92);padding:2px 7px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .15s}
.marker:hover .marker-label,.marker.selected .marker-label{opacity:1}

.drawer{position:absolute;left:16px;top:16px;width:296px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-float);overflow:hidden;z-index:5}
.drawer-head{padding:16px 16px 10px;border-bottom:1px solid var(--border-soft)}
.drawer-head h3{font-size:14.5px;font-weight:800;margin-bottom:10px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 12px}
.search-box input{flex:1;background:none;outline:none;font-size:13px}
.search-box i{width:15px;height:15px;color:var(--text2)}
.drawer-list{flex:1;overflow-y:auto;padding:8px}
.drawer-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:var(--radius-sm);transition:background .15s;animation:fadeSlideUp .3s ease both}
.drawer-item:hover{background:var(--surface-2)}
.drawer-item.selected{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--primary)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.drawer-item-name{font-size:12.5px;font-weight:700}
.drawer-item-sub{font-size:11px;color:var(--text2)}

.detail-card{position:absolute;right:16px;bottom:16px;width:308px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-float);padding:16px;z-index:5;animation:fadeSlideUp .3s ease both}
.detail-card h4{font-size:14px;font-weight:800;margin-bottom:2px}
.detail-card .sub{font-size:11.5px;color:var(--text2);margin-bottom:12px}
.detail-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border-soft)}
.detail-row:last-of-type{border-bottom:none}
.detail-row .k{color:var(--text2)}
.detail-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px -6px rgba(250,93,0,.6)}
.btn-primary:hover{box-shadow:0 8px 20px -6px rgba(250,93,0,.75)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:#f2e2ce}
.btn-outline{border:1.5px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:6px 11px;font-size:11.5px}
.btn-block{width:100%}

.map-control{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
.map-control button{width:34px;height:34px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center}
.map-control button:hover{background:var(--surface-2)}

.legend{position:absolute;left:16px;bottom:16px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-float);padding:10px 14px;display:flex;gap:14px;z-index:5;flex-wrap:wrap;max-width:280px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text2)}

/* ── generic content screens ── */
.content-pad{padding:24px 28px 40px;max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-eyebrow{display:block;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--primary);margin-bottom:6px}
.page-head h2{font-size:40px;font-weight:700;letter-spacing:-.01em}
.page-head p{font-size:12.5px;color:var(--text2);margin-top:6px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:18px}
.grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr}}

.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:800}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-idle{background:var(--idle-bg);color:var(--idle)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-accent{background:rgba(30,246,218,.18);color:#0b8f7c}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--text2);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--border)}
td{padding:11px 10px;font-size:12.5px;border-bottom:1px solid var(--border-soft)}
tr.row-click{cursor:pointer;transition:background .12s}
tr.row-click:hover{background:var(--surface-2)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);outline:none;background:var(--surface);font-size:13px}
.field input:focus,.field select:focus{border-color:var(--primary)}
.field-hint{font-size:11px;color:var(--text2);margin-top:5px}
.slider{width:100%;accent-color:var(--primary)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.switch{width:40px;height:22px;border-radius:999px;background:var(--secondary);position:relative;transition:background .18s;flex:0 0 auto}
.switch.on{background:var(--primary)}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .knob{left:20px}

.score-bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.score-bar>div{height:100%;border-radius:999px}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,#f7e6d3 37%,var(--surface-2) 63%);background-size:400px 100%;animation:shimmer 1.3s infinite linear;border-radius:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(29,20,10,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{width:420px;max-width:100%;background:var(--surface);border-radius:var(--radius);box-shadow:0 30px 70px -20px rgba(0,0,0,.4);padding:22px;animation:fadeSlideUp .25s ease both}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px}
.modal-close{position:absolute;top:16px;right:16px}
.modal-foot{display:flex;gap:8px;margin-top:18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#211a14;color:#fff;padding:12px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;box-shadow:0 12px 28px -8px rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease}
.toast i{width:16px;height:16px;color:var(--accent)}

.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spinSlow .7s linear infinite}
</style>
</head>

/* ───────────────────── shared ui bits ───────────────────── */
function Toast({msg}){
  if(!msg) return null;
  return <div className="toast"><i data-lucide="check-circle-2"></i>{msg}</div>;
}

function StatusBadge({status}){
  const map = {'대기':'badge-idle','묶음':'badge-accent','확정':'badge-warn','진행중':'badge-ok','완료':'badge-ok','실패':'badge-danger','보정대기':'badge-warn','회수':'badge-danger'};
  return <span className={"status-badge "+(map[status]||'badge-idle')}>{status}</span>;
}

/* ───────────────────── main: map view ───────────────────── */
function MainMapView({selected,setSelected,search,setSearch,clusters,showToast}){
  const filtered = MARKERS.filter(m=>!search || m.name.includes(search) || m.region.includes(search));
  const selMarker = MARKERS.find(m=>m.id===selected);
  const cluster = clusters.find(c=>c.companies.includes(selMarker && selMarker.name)) ||
                  (selMarker && selMarker.type==='expert' ? clusters.find(c=>c.expert===selMarker.name) : null);

  function confirm(){ showToast(selMarker.name+' 배정이 확정 처리되었습니다'); }
  function recall(){ showToast(selMarker.name+' 배정 건이 회수되어 재배정 대상으로 전환됩니다'); }

  return (
    <div className="map-view">
      <div className="map">
        <div className="map-grid"></div>
        <div className="map-district" style={{left:'8%',top:'12%',width:'26%',height:'42%'}}></div>
        <div className="map-district" style={{left:'34%',top:'34%',width:'30%',height:'44%'}}></div>
        {MARKERS.map(m=>(
          <div key={m.id} className={"marker"+(selected===m.id?' selected':'')}
               style={{left:m.x+'%',top:m.y+'%'}}
               onClick={()=>setSelected(m.id)}>
            {selected===m.id && <div className="marker-ring" style={{borderColor:m.type==='expert'?'var(--primary)':STATUS_COLOR[m.status]}}></div>}
            {m.type==='company'
              ? <div className="marker-dot" style={{background:STATUS_COLOR[m.status]}}></div>
              : <div className="marker-pin" style={{background:'var(--primary)'}}><i data-lucide="user-round"></i></div>}
            <div className="marker-label">{m.name}</div>
          </div>
        ))}
      </div>

      <aside className="drawer">
        <div className="drawer-head">
          <h3>기업·전문가 검색</h3>
          <div className="search-box">
            <i data-lucide="search"></i>
            <input placeholder="이름 또는 권역으로 검색" value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
        </div>
        <div className="drawer-list">
          {filtered.map((m,i)=>(
            <button key={m.id} className={"drawer-item"+(selected===m.id?' selected':'')} style={{animationDelay:(i*0.03)+'s'}} onClick={()=>setSelected(m.id)}>
              <span className="dot" style={{background:m.type==='expert'?'var(--primary)':STATUS_COLOR[m.status]}}></span>
              <span style={{flex:1,textAlign:'left'}}>
                <div className="drawer-item-name">{m.name}</div>
                <div className="drawer-item-sub">{m.region} · {m.type==='expert'?('진행 '+m.load):m.status}</div>
              </span>
            </button>
          ))}
          {filtered.length===0 && <div style={{padding:'20px',fontSize:'12.5px',color:'var(--text2)',textAlign:'center'}}>검색 결과가 없습니다</div>}
        </div>
      </aside>

      {selMarker && (
        <div className="detail-card" key={selMarker.id} style={{borderRadius:16,boxShadow:'0 14px 36px rgba(29,20,10,.30)'}}>
          <h4>{selMarker.name}</h4>
          <div className="sub">{selMarker.region}</div>
          {selMarker.type==='company' ? (
            <React.Fragment>
              <div className="detail-row"><span className="k">배정 상태</span><StatusBadge status={selMarker.status}/></div>
              <div className="detail-row"><span className="k">담당 전문가</span><b>{cluster && cluster.expert ? cluster.expert : '미배정'}</b></div>
              <div className="detail-row"><span className="k">묶음 거리</span><b>{cluster ? cluster.distance : '-'}</b></div>
              <div className="detail-row"><span className="k">판단 근거</span><b>{cluster && cluster.expert ? '거리 '+cluster.distScore+'점 · 균등배분 '+cluster.balanceScore+'점' : '반경 내 가용 전문가 없음'}</b></div>
              <div className="detail-actions">
                <button className="btn btn-primary" style={{flex:1}} onClick={confirm}>배정 확정</button>
                <button className="btn btn-ghost" style={{flex:1}} onClick={recall}>회수</button>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="detail-row"><span className="k">현재 진행 건수</span><b>{selMarker.load}</b></div>
              <div className="detail-row"><span className="k">담당 묶음</span><b>{clusters.filter(c=>c.expert===selMarker.name).length}건</b></div>
              <div className="detail-row"><span className="k">가용 여부</span><StatusBadge status="완료"/></div>
              <div className="detail-actions">
                <button className="btn btn-ghost btn-block" onClick={()=>showToast(selMarker.name+' 담당 배정 현황을 확인했습니다')}>배정 현황 보기</button>
              </div>
            </React.Fragment>
          )}
        </div>
      )}

      <div className="map-control">
        <button onClick={()=>showToast('지도를 확대했습니다')}><i data-lucide="plus" style={{width:16,height:16}}></i></button>
        <button onClick={()=>showToast('지도를 축소했습니다')}><i data-lucide="minus" style={{width:16,height:16}}></i></button>
        <button onClick={()=>showToast('현재 화면 기준으로 필터가 재설정되었습니다')}><i data-lucide="locate-fixed" style={{width:16,height:16}}></i></button>
      </div>

      <div className="legend">
        <span className="legend-item"><span className="dot" style={{background:'var(--idle)'}}></span>대기</span>
        <span className="legend-item"><span className="dot" style={{background:'var(--accent)'}}></span>묶음</span>
        <span className="legend-item"><span className="dot" style={{background:'var(--primary)'}}></span>확정 / 전문가</span>
        <span className="legend-item"><span className="dot" style={{background:'#0d8f6e'}}></span>진행중</span>
      </div>
    </div>
  );
}

/* ───────────────────── geocoding ───────────────────── */
function GeocodingView({items,setItems,showToast}){
  const [fixTarget,setFixTarget] = useState(null);
  const [fixLat,setFixLat] = useState('');
  const [fixLng,setFixLng] = useState('');
  const [testAddr,setTestAddr] = useState('');
  const [testing,setTesting] = useState(false);
  const [testResult,setTestResult] = useState(null);

  const failedOrPending = items.filter(i=>i.status==='실패'||i.status==='보정대기').length;

  function openFix(item){ setFixTarget(item); setFixLat(''); setFixLng(''); }
  function confirmFix(){
    setItems(items.map(i=>i.id===fixTarget.id?{...i,status:'완료',norm:i.raw.replace(/\s*\(.*?\)/,''),reason:null}:i));
    showToast(fixTarget.raw.slice(0,14)+'… 좌표가 수동 보정되어 저장되었습니다');
    setFixTarget(null);
  }
  function retryOne(id){
    setItems(items.map(i=>i.id===id?{...i,status:'완료',norm:i.raw.replace(/\s*\(.*?\)/,'')}:i));
    showToast('지오코딩 API 재호출 결과 좌표 변환에 성공했습니다');
  }
  function runTest(){
    if(!testAddr.trim()) return;
    setTesting(true); setTestResult(null);
    setTimeout(()=>{
      setTesting(false);
      setTestResult({norm:testAddr.replace(/\(.*?\)/,'').trim()+' (정제 완료)',lat:(37.2+Math.random()*0.4).toFixed(5),lng:(126.8+Math.random()*0.4).toFixed(5)});
    },1100);
  }

  return (
    <div className="content-pad screen-fade">
      <div className="page-head">
        <div><span className="page-eyebrow">데이터 파이프라인</span><h2>주소 정제 &amp; 지오코딩</h2><p>도로명·지번 혼재 주소를 정제하고 좌표로 변환해 재사용 캐시에 저장합니다.</p></div>
        <span className="status-badge badge-warn"><i data-lucide="alert-triangle" style={{width:12,height:12}}></i>보정 필요 {failedOrPending}건</span>
      </div>

      <div className="grid-2">
        <div className="card">
          <h3 style={{fontSize:14,fontWeight:800,marginBottom:12}}>주소 변환 큐</h3>
          <table>
            <thead><tr><th>원본 주소</th><th>정제 결과</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {items.map(it=>(
                <tr key={it.id}>
                  <td style={{maxWidth:220}}>{it.raw}</td>
                  <td>{it.norm || <span style={{color:'var(--text2)'}}>{it.reason}</span>}</td>
                  <td><StatusBadge status={it.status}/></td>
                  <td>
                    {it.status==='실패' && <button className="btn btn-outline btn-sm" onClick={()=>retryOne(it.id)}>재시도</button>}
                    {it.status==='보정대기' && <button className="btn btn-primary btn-sm" onClick={()=>openFix(it)}>수동 보정</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="card">
            <h3 style={{fontSize:14,fontWeight:800,marginBottom:12}}>주소 → 좌표 변환 테스트</h3>
            <div className="field">
              <label>주소 입력</label>
              <input type="text" placeholder="예: 안산시 단원구 원시로 12번길" value={testAddr} onChange={e=>setTestAddr(e.target.value)} />
            </div>
            <button className="btn btn-primary btn-block" onClick={runTest} disabled={testing}>
              {testing ? <span style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}><span className="spinner"></span>변환 중...</span> : '좌표 변환 실행'}
            </button>
            {testing && <div className="skeleton" style={{height:52,marginTop:12}}></div>}
            {testResult && !testing && (
              <div style={{marginTop:12,padding:12,background:'var(--surface-2)',borderRadius:10,fontSize:12.5}}>
                <div><b>정제 주소</b> · {testResult.norm}</div>
                <div style={{color:'var(--text2)',marginTop:4}}>좌표 {testResult.lat}, {testResult.lng} · 캐시 테이블에 저장됨</div>
              </div>
            )}
          </div>

          <div className="card">
            <h3 style={{fontSize:14,fontWeight:800,marginBottom:10}}>캐시 재사용 현황</h3>
            <div className="detail-row"><span className="k">캐시 적중률</span><b>72%</b></div>
            <div className="detail-row"><span className="k">누적 변환 완료</span><b>{items.filter(i=>i.status==='완료').length + 214}건</b></div>
            <div className="detail-row"><span className="k">API 재호출 절감</span><b>정제 규칙 선처리로 절감</b></div>
          </div>
        </div>
      </div>

      {fixTarget && (
        <div className="modal-overlay" onClick={()=>setFixTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>좌표 수동 보정</h3>
            <p style={{fontSize:12.5,color:'var(--text2)',marginBottom:14}}>{fixTarget.raw}</p>
            <div className="field"><label>위도</label><input type="text" placeholder="37.xxxxx" value={fixLat} onChange={e=>setFixLat(e.target.value)} /></div>
            <div className="field"><label>경도</label><input type="text" placeholder="126.xxxxx" value={fixLng} onChange={e=>setFixLng(e.target.value)} /></div>
            <div className="modal-foot">
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setFixTarget(null)}>취소</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={confirmFix}>보정 값 저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── clustering & balance ───────────────────── */
function ClusteringView({clusters,setClusters,showToast}){
  const [recalculating,setRecalculating] = useState(false);
  function recalc(){
    setRecalculating(true);
    setTimeout(()=>{
      setClusters(clusters.map(c=>({...c,distScore:Math.max(50,Math.min(99,c.distScore+(Math.round(Math.random()*10)-5))),balanceScore:Math.max(50,Math.min(99,c.balanceScore+(Math.round(Math.random()*10)-5)))})));
      setRecalculating(false);
      showToast('묶음·균등배분 스코어를 현재 파라미터 기준으로 재계산했습니다');
    },1000);
  }
  return (
    <div className="content-pad screen-fade">
      <div className="page-head">
        <div><span className="page-eyebrow">배정 엔진</span><h2>근접 묶음 &amp; 균등 배분</h2><p>반경 내 기업을 클러스터링하고 권역 균등 배분 스코어로 담당 전문가를 산출합니다.</p></div>
        <button className="btn btn-primary" onClick={recalc} disabled={recalculating}>
          {recalculating ? <span style={{display:'flex',alignItems:'center',gap:8}}><span className="spinner"></span>재계산 중...</span> : '스코어 재계산'}
        </button>
      </div>

      <div className="grid-3">
        {clusters.map(c=>(
          <div className="card" key={c.id}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div>
                <div style={{fontSize:11,color:'var(--text2)',fontWeight:700}}>{c.region}</div>
                <div style={{fontSize:14,fontWeight:800}}>{c.companies.length}개 기업 묶음</div>
              </div>
              <StatusBadge status={c.status}/>
            </div>
            <ul style={{fontSize:12,color:'var(--text2)',marginBottom:12,paddingLeft:16}}>
              {c.companies.map(name=><li key={name}>{name}</li>)}
            </ul>
            <div className="detail-row"><span className="k">담당 전문가</span><b>{c.expert || '미배정'}</b></div>
            <div className="detail-row"><span className="k">묶음 거리</span><b>{c.distance}</b></div>
            <div style={{marginTop:10}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4}}><span>거리 점수</span><b>{c.distScore}</b></div>
              <div className="score-bar"><div style={{width:c.distScore+'%',background:'var(--primary)',transition:'width .5s'}}></div></div>
            </div>
            <div style={{marginTop:10}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4}}><span>균등배분 점수</span><b>{c.balanceScore}</b></div>
              <div className="score-bar"><div style={{width:c.balanceScore+'%',background:'var(--accent)',transition:'width .5s'}}></div></div>
            </div>
            {!c.expert && <button className="btn btn-outline btn-block" style={{marginTop:12}} onClick={()=>showToast(c.region+' 묶음의 대기 사유를 확인했습니다: 반경 내 가용 전문가 없음')}>대기 사유 확인</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ───────────────────── assignment log / concurrency ───────────────────── */
function AssignmentLogView({log,setLog,showToast}){
  const [filter,setFilter] = useState('전체');
  const [detail,setDetail] = useState(null);
  const [simRunning,setSimRunning] = useState(false);
  const [simStep,setSimStep] = useState(0);
  const filters = ['전체','확정','진행중','대기','회수'];
  const filtered = filter==='전체' ? log : log.filter(l=>l.to===filter);

  function runSimulation(){
    setSimRunning(true); setSimStep(1);
    setTimeout(()=>setSimStep(2),700);
    setTimeout(()=>{
      setSimStep(0); setSimRunning(false);
      setLog([{id:'L-'+(2099+Math.floor(Math.random()*9)),company:'신규 접수 기업 2건',expert:'박정우 전문가',from:'신청접수',to:'확정',time:'방금 전',note:'동시 신청 2건 중 트랜잭션 락으로 1건 선점 처리, 1건 대기열 전환'},...log]);
      showToast('동시 신청 처리 완료 — 행 단위 잠금으로 중복 배정이 차단되었습니다');
    },1600);
  }

  return (
    <div className="content-pad screen-fade">
      <div className="page-head">
        <div><span className="page-eyebrow">감사 로그</span><h2>동시성 제어 &amp; 상태 전환</h2><p>신청 접수부터 확정·진행중까지 상태 전환 이력과 동시 처리 락 결과를 기록합니다.</p></div>
        <button className="btn btn-primary" onClick={runSimulation} disabled={simRunning}>
          {simRunning ? <span style={{display:'flex',alignItems:'center',gap:8}}><span className="spinner"></span>처리 중...</span> : '동시 요청 시뮬레이션 실행'}
        </button>
      </div>

      {simRunning && (
        <div className="grid-2" style={{marginBottom:18}}>
          <div className="card" style={{borderLeft: simStep>=1?'4px solid var(--primary)':'4px solid var(--border)'}}>
            <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>요청 A · 대성정밀 인천공장</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>{simStep===1 ? 'SELECT ... FOR UPDATE 락 획득 시도' : simStep===2 ? '락 선점 — 배정 확정 처리' : '대기'}</div>
          </div>
          <div className="card" style={{borderLeft: simStep>=1?'4px solid var(--warn)':'4px solid var(--border)'}}>
            <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>요청 B · 동일 전문가 대상 신청</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>{simStep===1 ? '락 대기열 진입' : simStep===2 ? '대기열 전환 — 다음 트랜잭션으로 재시도' : '대기'}</div>
          </div>
        </div>
      )}

      <div className="card">
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {filters.map(f=>(
            <button key={f} className="btn btn-sm" style={{background:filter===f?'var(--primary)':'var(--surface-2)',color:filter===f?'#fff':'var(--text)'}} onClick={()=>setFilter(f)}>{f}</button>
          ))}
        </div>
        <table>
          <thead><tr><th>ID</th><th>기업</th><th>담당 전문가</th><th>상태 전환</th><th>시각</th></tr></thead>
          <tbody>
            {filtered.map(l=>(
              <tr key={l.id} className="row-click" onClick={()=>setDetail(l)}>
                <td>{l.id}</td><td>{l.company}</td><td>{l.expert}</td>
                <td>{l.from} → <StatusBadge status={l.to}/></td>
                <td style={{color:'var(--text2)'}}>{l.time}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <div className="modal-overlay" onClick={()=>setDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{detail.id} 상세 이력</h3>
            <div className="detail-row"><span className="k">기업</span><b>{detail.company}</b></div>
            <div className="detail-row"><span className="k">담당 전문가</span><b>{detail.expert}</b></div>
            <div className="detail-row"><span className="k">상태 전환</span><b>{detail.from} → {detail.to}</b></div>
            <div className="detail-row"><span className="k">시각</span><b>{detail.time}</b></div>
            <div className="detail-row"><span className="k">판단 근거</span><b>{detail.note}</b></div>
            <div className="modal-foot"><button className="btn btn-primary btn-block" onClick={()=>setDetail(null)}>닫기</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── settings ───────────────────── */

  const [deviation,setDeviation] = useState(2);
  const [period,setPeriod] = useState('월 단위');

  const [dailyLimit,setDailyLimit] = useState(true);

  return (
    <div className="content-pad screen-fade">
      <div className="page-head"><div><span className="page-eyebrow">환경 설정</span><h2>배정 파라미터 설정</h2><p>착수 단계 협의 결과에 맞춰 배정 엔진의 핵심 판단 기준을 조정합니다.</p></div></div>
      <div className="grid-2">
        <div className="card">
          <h3 style={{fontSize:14,fontWeight:800,marginBottom:14}}>묶음 &amp; 균등 배분 기준</h3>
          <div className="field">
            <label>근접 묶음 반경 (km)</label>
            <input type="number" step="0.1" value={radius} onChange={e=>setRadius(e.target.value)} />
            <div className="field-hint">이 반경 안의 기업 2~3곳을 하나의 배정 단위로 묶습니다.</div>
          </div>
          <div className="field">
            <label>균등 배분 판정 주기</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)}>
              <option>월 단위</option><option>누적 기준</option>
            </select>
          </div>
          <div className="field">
            <label>허용 편차 (건)</label>
            <input type="number" value={deviation} onChange={e=>setDeviation(e.target.value)} />
            <div className="field-hint">같은 권역 전문가 간 배정 건수 차이의 허용 범위입니다.</div>
          </div>
          <div className="field">
            <label>거리 우선 ↔ 균등배분 우선 ({priority}%)</label>
            <input className="slider" type="range" min="0" max="100" value={priority} onChange={e=>setPriority(e.target.value)} />
          </div>
          <div className="toggle-row">
            <span style={{fontSize:13,fontWeight:600}}>전문가 1인당 일일 배정 한도 적용</span>
            <span className={"switch"+(dailyLimit?' on':'')} onClick={()=>setDailyLimit(!dailyLimit)}><span className="knob"></span></span>
          </div>
        </div>

        <div className="card">
          <h3 style={{fontSize:14,fontWeight:800,marginBottom:14}}>지오코딩 &amp; 연동</h3>
          <div className="field">
            <label>지오코딩 서비스</label>
            <select value={geocoder} onChange={e=>setGeocoder(e.target.value)}>
              <option>카카오 지오코딩 API</option><option>네이버 클라우드 Maps API</option><option>Google Geocoding API</option>
            </select>
          </div>
          <div className="field">
            <label>거리 산출 방식</label>
            <select><option>직선 거리 (Haversine)</option><option>실제 도로 이동 거리</option></select>
          </div>
          <div style={{marginTop:20}}>
            <h4 style={{fontSize:12.5,fontWeight:800,marginBottom:10,color:'var(--text2)'}}>권역별 진행 중 배정 현황</h4>
            <div style={{height:180}}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={REGION_STATS}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#ecdfd3" vertical={false} />
                  <XAxis dataKey="region" tick={{fontSize:11}} axisLine={false} tickLine={false} />
                  <YAxis tick={{fontSize:11}} axisLine={false} tickLine={false} width={26} />
                  <Tooltip />
                  <Bar dataKey="count" fill="#fa5d00" radius={[6,6,0,0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:18}} onClick={()=>showToast('배정 파라미터가 저장되어 다음 배정부터 적용됩니다')}>파라미터 저장</button>
        </div>
      </div>
    </div>
  );
}

/* ───────────────────── app shell ───────────────────── */
function App(){
  const [tab,setTab] = useState('main');
  const [selected,setSelected] = useState('c1');
  const [search,setSearch] = useState('');
  const [geocodeItems,setGeocodeItems] = useState(GEOCODE_INIT);
  const [clusters,setClusters] = useState(CLUSTERS_INIT);
  const [log,setLog] = useState(LOG_INIT);
  const [toast,setToast] = useState(null);

  function showToast(msg){ setToast(msg); setTimeout(()=>setToast(null),2600); }
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const pending = geocodeItems.filter(i=>i.status!=='완료').length;
  const confirmedToday = clusters.filter(c=>c.status==='확정'||c.status==='진행중').length;

  const tabs = [
    {id:'main',label:'거리 기반 배정 관제 지도',icon:'map'},
    {id:'geocoding',label:'주소 정제 & 지오코딩 파이프라인',icon:'map-pin'},
    {id:'clustering',label:'근접 묶음 & 균등 배분 엔진',icon:'shuffle'},
    {id:'assignment-log',label:'동시성 제어 & 배정 상태 전환',icon:'lock'},
    {id:'settings',label:'배정 파라미터 설정',icon:'settings-2'},
  ];

  return (
    <div className="app-shell" data-archetype="map-canvas">
      <header className="topbar">
        <div className="brand"><span className="brand-mark"><i data-lucide="route" style={{width:17,height:17}}></i></span>지오매치 배정 콘솔</div>
        <div className="topbar-right">
          <span className="kpi-pill">오늘 확정 <b>{confirmedToday}건</b></span>
          <span className="kpi-pill">보정 대기 <b>{pending}건</b></span>
          <button className="icon-btn" onClick={()=>setTab('settings')}><i data-lucide="settings" style={{width:17,height:17}}></i></button>
        </div>
      </header>
      <nav className="tabbar">
        {tabs.map(t=>(
          <button key={t.id} className={"tab-btn"+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
            <i data-lucide={t.icon}></i>{t.label}
          </button>
        ))}
      </nav>
      <div className="screen-container">
        {tab==='main' && <MainMapView selected={selected} setSelected={setSelected} search={search} setSearch={setSearch} clusters={clusters} showToast={showToast} />}
        {tab==='geocoding' && <GeocodingView items={geocodeItems} setItems={setGeocodeItems} showToast={showToast} />}
        {tab==='clustering' && <ClusteringView clusters={clusters} setClusters={setClusters} showToast={showToast} />}
        {tab==='assignment-log' && <AssignmentLogView log={log} setLog={setLog} showToast={showToast} />}
        {tab==='settings' && <SettingsView showToast={showToast} />}
      </div>
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
