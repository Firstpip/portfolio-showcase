<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전문가 배정 운영 허브 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --primary:#5683da; --primary-ink:#4066b8; --secondary:#d1d1d1; --accent:#ff8964;
  --bg:#ffffff; --surface:#e5e5e7; --surface-soft:#f2f2f3;
  --text:#090a0c; --text2:#95979e; --border:#e1e1e3;
  --ok:#1a8f5f; --ok-bg:#e5f5ee; --warn:#b6790f; --warn-bg:#fbf0dd; --idle:#8a8c92; --idle-bg:#eeeef0;
  --danger:#cf4747; --danger-bg:#fbe9e9;
  --radius:12px; --radius-sm:9px; --pill:9999px;
  --shadow-flat:0 1px 2px rgba(9,10,12,.05), 0 1px 0 rgba(9,10,12,.04);
  --shadow-pop:0 18px 44px -14px rgba(9,10,12,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardEnter{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes shimmer{0%{background-position:-220px 0}100%{background-position:220px 0}}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.app-shell{display:flex;flex-direction:column;width:100%;min-height:100vh}

/* ── top header (compact, flat-line) ── */
.top-header{height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.avatar-mini{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s}
.icon-btn:hover{background:var(--surface-soft);color:var(--text)}

/* ── board toolbar (screen switcher lives here, per kanban board-header pattern) ── */
.board-header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.nav-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--pill);font-size:12.5px;font-weight:700;color:var(--text2);border:1px solid transparent;transition:all .15s}
.nav-pill:hover{background:var(--surface-soft);color:var(--text)}
.nav-pill.active{background:var(--primary);color:#fff}
.nav-pill i{font-size:14px}
.board-header-spacer{flex:1}
.btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;transition:transform .12s,background .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-ink)}
.btn-ghost{background:var(--surface-soft);color:var(--text)}
.btn-ghost:hover{background:var(--surface)}
.btn-outline{border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:6px 11px;font-size:11.5px}
.btn-pill{border-radius:var(--pill)}
.btn-block{width:100%}

.main-area{flex:1;display:flex;width:100%;min-height:0}
.screen-fade{animation:fadeSlideUp .32s ease both}

/* ── kanban board (signature) ── */
.board-scroll{flex:1;min-width:0;overflow-x:auto;padding:16px 0 16px 20px}
.board{display:flex;gap:16px;overflow-x:auto;height:100%;padding-bottom:6px}
.column{flex:0 0 272px;width:272px;display:flex;flex-direction:column;background:var(--surface-soft);border-radius:var(--radius);padding:10px;max-height:100%}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 10px}
.col-header-title{font-size:12.5px;font-weight:800}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--pill);background:var(--surface);font-size:11px;font-weight:800;color:var(--text2)}
.col-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow-flat);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:cardEnter .3s ease both}
.card:hover{transform:scale(1.018);border-color:var(--primary)}
.card-title{font-size:12.5px;font-weight:800;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--pill);font-size:10.5px;font-weight:700;background:var(--surface-soft);color:var(--text2);border:1px solid var(--border)}
.priority-dot{width:7px;height:7px;border-radius:50%}
.priority-dot.high{background:var(--danger);animation:pulseDot 1.6s ease-in-out infinite}
.priority-dot.mid{background:var(--warn)}
.priority-dot.low{background:var(--idle)}
.assignee{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-left:auto}
.assignee.empty{background:var(--surface);border:1px dashed var(--secondary);color:var(--text2)}
.card-footer{margin-top:8px}
.card-days{font-size:10.5px;color:var(--text2)}
.badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:var(--pill);background:var(--danger);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.quick-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:var(--radius);background:var(--surface-soft);border:1px solid var(--border);margin-bottom:16px}
.quick-card-num{font-size:22px;font-weight:800;color:var(--primary)}
.quick-card-label{font-size:11px;color:var(--text2);font-weight:700}

/* ── matrix-side (right panel, main screen only) ── */
.matrix-side{width:280px;flex:0 0 auto;border-left:1px solid var(--border);padding:16px;overflow-y:auto;background:var(--bg)}
.matrix-side h3{font-size:12.5px;font-weight:800;margin-bottom:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{padding:6px 12px;border-radius:var(--pill);font-size:11.5px;font-weight:700;background:var(--surface-soft);color:var(--text2);border:1px solid var(--border)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.region-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.region-row .name{font-size:12px;font-weight:700}
.region-bar{flex:1;margin:0 10px;height:6px;border-radius:var(--pill);background:var(--surface-soft);overflow:hidden}
.region-bar>div{height:100%;background:var(--primary);border-radius:var(--pill)}

/* ── generic content screens ── */
.content-pad{padding:22px 24px 40px;max-width:1200px;margin:0 auto;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.page-eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--primary);margin-bottom:6px;text-transform:uppercase}
.page-head h2{font-size:42px;font-weight:800;letter-spacing:-.02em}
.page-head p{font-size:12px;color:var(--text2);margin-top:6px}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-flat)}
.grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr}}

.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--pill);font-size:10.5px;font-weight:800}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-idle{background:var(--idle-bg);color:var(--idle)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;color:var(--text2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px 10px;font-size:12px;border-bottom:1px solid var(--surface-soft)}
tr.row-click{cursor:pointer;transition:background .12s}
tr.row-click:hover{background:var(--surface-soft)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;background:var(--bg);font-size:12.5px}
.field input:focus,.field select:focus{border-color:var(--primary)}
.field-hint{font-size:10.5px;color:var(--text2);margin-top:5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--surface-soft)}
.switch{width:36px;height:20px;border-radius:var(--pill);background:var(--secondary);position:relative;transition:background .18s;flex:0 0 auto}
.switch.on{background:var(--primary)}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s}
.switch.on .knob{left:18px}

.avatar-list{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

.skeleton{background:linear-gradient(90deg,var(--surface-soft) 25%,var(--surface) 37%,var(--surface-soft) 63%);background-size:400px 100%;animation:shimmer 1.3s infinite linear;border-radius:8px}

.drawer-panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;background:var(--bg);box-shadow:var(--shadow-pop);z-index:60;padding:22px;overflow-y:auto;animation:fadeSlideUp .28s ease both}
.drawer-scrim{position:fixed;inset:0;background:rgba(9,10,12,.35);z-index:59}
.drawer-close{position:absolute;top:18px;right:18px}

.modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.4);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal{width:420px;max-width:100%;background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:22px;animation:fadeSlideUp .25s ease both}
.modal h3{font-size:15px;font-weight:800;margin-bottom:14px}
.modal-foot{display:flex;gap:8px;margin-top:18px}
.candidate-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.candidate-row:hover{border-color:var(--primary)}
.candidate-row.selected{border-color:var(--primary);background:var(--surface-soft)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141518;color:#fff;padding:11px 18px;border-radius:var(--pill);font-size:12.5px;font-weight:600;box-shadow:0 12px 28px -8px rgba(0,0,0,.4);z-index:90;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease}
.toast i{color:var(--accent);font-size:15px}

.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spinSlow .7s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const {BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, PieChart, Pie, Cell} = Recharts;

/* ───────────────────── mock data ───────────────────── */
const COLUMNS = ['신청접수','대상선별','전문가지정','확정·진행중','대기'];
const CARDS_INIT = [
  {id:'A-241',company:'대성정밀 인천공장',region:'서남부',expert:null,days:0,priority:'mid',col:'신청접수'},
  {id:'A-242',company:'한빛전자 안산지점',region:'서남부',expert:null,days:0,priority:'low',col:'신청접수'},
  {id:'A-238',company:'유성테크 시흥공장',region:'서남부',expert:null,days:1,priority:'mid',col:'대상선별'},
  {id:'A-236',company:'제일산업 광명지점',region:'서남부',expert:null,days:1,priority:'low',col:'대상선별'},
  {id:'A-235',company:'한성기계 부천공장',region:'서북부',expert:'최민교',days:1,priority:'high',col:'전문가지정'},
  {id:'A-215',company:'삼우기계 하남공장',region:'동남부',expert:'정하늘',days:2,priority:'mid',col:'전문가지정'},
  {id:'A-233',company:'예성물류 김포지점',region:'서북부',expert:null,days:2,priority:'high',col:'대기'},
  {id:'A-219',company:'광명전기 광명지점',region:'서남부',expert:null,days:3,priority:'high',col:'대기'},
  {id:'A-229',company:'동방메탈 수원지점',region:'남부',expert:'이수현',days:2,priority:'low',col:'확정·진행중'},
  {id:'A-228',company:'서진화학 화성공장',region:'남부',expert:'이수현',days:2,priority:'mid',col:'확정·진행중'},
  {id:'A-227',company:'미래바이오 오산지점',region:'남부',expert:'이수현',days:3,priority:'low',col:'확정·진행중'},
  {id:'A-224',company:'대일산업 평택지점',region:'남부',expert:'정하늘',days:3,priority:'mid',col:'확정·진행중'},
];
const REGION_STATS = [
  {region:'서남부',count:14,deviation:2},{region:'남부',count:19,deviation:1},{region:'서북부',count:9,deviation:3},{region:'동남부',count:11,deviation:1},{region:'북동부',count:6,deviation:2},
];
const PIE_COLORS = ['#5683da','#ff8964','#8ab4f8','#d1d1d1'];

const EXPERTS_INIT = [
  {id:'e1',name:'박정우',region:'경기 서남부',avail:true,limit:8,active:6},
  {id:'e2',name:'이수현',region:'경기 남부',avail:true,limit:8,active:5},
  {id:'e3',name:'최민교',region:'경기 서북부',avail:true,limit:6,active:6},
  {id:'e4',name:'정하늘',region:'경기 동남부',avail:true,limit:10,active:3},
  {id:'e5',name:'김도윤',region:'경기 북동부',avail:false,limit:6,active:1},
];

const WAITING_INIT = [
  {id:'A-233',company:'예성물류 김포지점',region:'서북부',reason:'거리초과',candidates:[{name:'최민교',score:74},{name:'김도윤',score:61}]},
  {id:'A-219',company:'광명전기 광명지점',region:'서남부',reason:'편차초과',candidates:[{name:'박정우',score:69},{name:'이수현',score:58}]},
  {id:'A-247',company:'세영바이오 시흥공장',region:'서남부',reason:'전문가부재',candidates:[{name:'박정우',score:82}]},
];

const NOTIF_INIT = [
  {id:1,channel:'알림톡',target:'박정우 전문가',content:'신규 배정 2건 확정 안내',status:'성공',time:'09:14'},
  {id:2,channel:'SMS',target:'이수현 전문가',content:'배정 확정 알림',status:'성공',time:'08:50'},
  {id:3,channel:'이메일',target:'담당자',content:'대기 건 3건 발생 알림',status:'실패',time:'08:32'},
  {id:4,channel:'알림톡',target:'최민교 전문가',content:'배정 회수 안내',status:'성공',time:'전일 17:02'},
];

function initial(name){ return name.slice(0,1); }

/* ───────────────────── shared ui ───────────────────── */
function Toast({msg}){
  if(!msg) return null;
  return <div className="toast"><i className="ph-fill ph-check-circle"></i>{msg}</div>;
}
function StatusBadge({status}){
  const map = {'성공':'badge-ok','실패':'badge-danger','재시도중':'badge-warn','대기':'badge-idle'};
  return <span className={"status-badge "+(map[status]||'badge-idle')}>{status}</span>;
}

/* ───────────────────── main: kanban board ───────────────────── */
function BoardScreen({cards,setCards,showToast}){
  const [detail,setDetail] = useState(null);
  const [regionFilter,setRegionFilter] = useState('전체');
  const [addOpen,setAddOpen] = useState(false);
  const [newCompany,setNewCompany] = useState('');
  const [newRegion,setNewRegion] = useState('서남부');

  const regions = ['전체','서남부','남부','서북부','동남부','북동부'];
  const visible = regionFilter==='전체' ? cards : cards.filter(c=>c.region===regionFilter);

  const regionSummary = ['서남부','남부','서북부','동남부','북동부'].map(r=>({
    region:r, count: cards.filter(c=>c.region===r).length,
  }));
  const maxCount = Math.max(1, ...regionSummary.map(r=>r.count));

  function addCard(){
    if(!newCompany.trim()) return;
    const id = 'A-'+(300+Math.floor(Math.random()*90));
    setCards([{id,company:newCompany,region:newRegion,expert:null,days:0,priority:'mid',col:'신청접수'},...cards]);
    setAddOpen(false); setNewCompany('');
    showToast(newCompany+' 신청 건이 접수되어 워크플로우 보드에 등록되었습니다');
  }

  function moveNext(card){
    const idx = COLUMNS.indexOf(card.col);
    const nextCol = card.col==='대기' ? '전문가지정' : (COLUMNS[Math.min(idx+1,COLUMNS.length-1)] === '대기' ? '확정·진행중' : COLUMNS[idx+1]);
    setCards(cards.map(c=>c.id===card.id?{...c,col:nextCol}:c));
    setDetail(null);
    showToast(card.company+' 배정 건이 '+nextCol+' 단계로 이동했습니다');
  }
  function recall(card){
    setCards(cards.map(c=>c.id===card.id?{...c,col:'대기'}:c));
    setDetail(null);
    showToast(card.company+' 배정 건이 회수되어 대기 상태로 전환되었습니다');
  }

  return (
    <div className="main-area">
      <div className="board-scroll">
        <div className="board">
          {COLUMNS.map(col=>{
            const list = visible.filter(c=>c.col===col);
            return (
              <section className="column" key={col}>
                <div className="col-header">
                  <span className="col-header-title">{col}</span>
                  <span className="count">{list.length}</span>
                </div>
                <div className="col-body">
                  {list.map((c,i)=>(
                    <div className="card" key={c.id} style={{animationDelay:(i*0.04)+'s',borderRadius:12}} onClick={()=>setDetail(c)}>
                      <div className="card-title">{c.company}</div>
                      <div className="card-meta">
                        <span className="tag">{c.region}</span>
                        <span className={"priority-dot "+c.priority}></span>
                        {c.expert
                          ? <span className="assignee" title={c.expert}>{initial(c.expert)}</span>
                          : <span className="assignee empty">?</span>}
                      </div>
                      <div className="card-footer">
                        <span className="card-days">경과 {c.days}일 · {c.id}</span>
                      </div>
                    </div>
                  ))}
                  {list.length===0 && <div style={{fontSize:11,color:'var(--text2)',padding:'10px 4px'}}>해당 조건의 건이 없습니다</div>}
                </div>
              </section>
            );
          })}
        </div>
      </div>

      <aside className="matrix-side">
        <div className="quick-card">
          <span className="quick-card-num">{cards.length}</span>
          <span className="quick-card-label">보드 내 배정 카드</span>
        </div>
        <h3>권역 필터</h3>
        <div className="chip-row">
          {regions.map(r=>(
            <button key={r} className={"chip"+(regionFilter===r?' active':'')} onClick={()=>setRegionFilter(r)}>{r}</button>
          ))}
        </div>
        <h3>권역별 배정 현황</h3>
        {regionSummary.map(r=>(
          <div className="region-row" key={r.region}>
            <span className="name">{r.region}</span>
            <span className="region-bar"><div style={{width:(r.count/maxCount*100)+'%'}}></div></span>
            <span style={{fontSize:11.5,fontWeight:800}}>{r.count}</span>
          </div>
        ))}
        <button className="btn btn-outline btn-block btn-pill" style={{marginTop:18}} onClick={()=>setAddOpen(true)}>
          <i className="ph ph-plus" style={{marginRight:6}}></i>새 신청 건 등록
        </button>
      </aside>

      {detail && (
        <React.Fragment>
          <div className="drawer-scrim" onClick={()=>setDetail(null)}></div>
          <div className="drawer-panel">
            <button className="icon-btn drawer-close" onClick={()=>setDetail(null)}><i className="ph ph-x"></i></button>
            <h3 style={{fontSize:16,fontWeight:800,marginBottom:4}}>{detail.company}</h3>
            <p style={{fontSize:12,color:'var(--text2)',marginBottom:16}}>{detail.id} · {detail.region}</p>
            <div className="toggle-row"><span>현재 단계</span><b>{detail.col}</b></div>
            <div className="toggle-row"><span>담당 전문가</span><b>{detail.expert || '미배정'}</b></div>
            <div className="toggle-row"><span>경과일</span><b>{detail.days}일</b></div>
            <div className="toggle-row"><span>우선순위</span><b>{detail.priority==='high'?'높음':detail.priority==='mid'?'보통':'낮음'}</b></div>
            <div style={{marginTop:16,padding:12,background:'var(--surface-soft)',borderRadius:10,fontSize:12}}>
              판단 근거 · 거리 스코어와 권역 균등배분 스코어를 함께 반영해 담당 전문가를 산출하며, 상태 전환 이력은 감사 로그에 기록됩니다.
            </div>
            <div style={{display:'flex',gap:8,marginTop:18}}>
              <button className="btn btn-primary btn-block" onClick={()=>moveNext(detail)}>다음 단계로 이동</button>
              <button className="btn btn-ghost btn-block" onClick={()=>recall(detail)}>회수</button>
            </div>
          </div>
        </React.Fragment>
      )}

      {addOpen && (
        <div className="modal-overlay" onClick={()=>setAddOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>신규 신청 건 등록</h3>
            <div className="field"><label>기업명</label><input type="text" placeholder="예: 대성정밀 인천공장" value={newCompany} onChange={e=>setNewCompany(e.target.value)} /></div>
            <div className="field">
              <label>권역</label>
              <select value={newRegion} onChange={e=>setNewRegion(e.target.value)}>
                <option>서남부</option><option>남부</option><option>서북부</option><option>동남부</option><option>북동부</option>
              </select>
            </div>
            <div className="modal-foot">
              <button className="btn btn-ghost btn-block" onClick={()=>setAddOpen(false)}>취소</button>
              <button className="btn btn-primary btn-block" onClick={addCard}>등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── expert management ───────────────────── */
function ExpertManagementScreen({experts,setExperts,showToast}){
  const [regionFilter,setRegionFilter] = useState('전체');
  const [query,setQuery] = useState('');
  const [detail,setDetail] = useState(null);
  const regions = ['전체','경기 서남부','경기 남부','경기 서북부','경기 동남부','경기 북동부'];
  const filtered = experts.filter(e=>(regionFilter==='전체'||e.region===regionFilter) && e.name.includes(query));

  function toggleAvail(id){
    setExperts(experts.map(e=>e.id===id?{...e,avail:!e.avail}:e));
    const e = experts.find(e=>e.id===id);
    showToast(e.name+' 전문가의 배정 가능 여부가 '+(e.avail?'중지':'재개')+'되었습니다');
  }

  return (
    <div className="content-pad screen-fade">
      <div className="page-head">
        <div><span className="page-eyebrow">Workforce</span><h2>전문가 관리</h2><p>전문가별 소속 권역·가용 여부·일일 배정 한도를 관리합니다.</p></div>
      </div>
      <div className="panel">
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
          <input type="text" placeholder="이름 검색" value={query} onChange={e=>setQuery(e.target.value)} style={{padding:'8px 12px',border:'1px solid var(--border)',borderRadius:'var(--pill)',fontSize:12.5,minWidth:160}} />
          {regions.map(r=>(
            <button key={r} className={"chip"+(regionFilter===r?' active':'')} onClick={()=>setRegionFilter(r)}>{r}</button>
          ))}
        </div>
        <table>
          <thead><tr><th>전문가</th><th>소속 권역</th><th>가용 여부</th><th>일일 한도</th><th>진행 중 배정</th><th></th></tr></thead>
          <tbody>
            {filtered.map(e=>(
              <tr key={e.id} className="row-click" onClick={()=>setDetail(e)}>
                <td><span style={{display:'flex',alignItems:'center',gap:8}}><span className="avatar-list">{initial(e.name)}</span>{e.name}</span></td>
                <td>{e.region}</td>
                <td onClick={ev=>ev.stopPropagation()}><span className={"switch"+(e.avail?' on':'')} onClick={()=>toggleAvail(e.id)}><span className="knob"></span></span></td>
                <td>{e.limit}건</td>
                <td>{e.active}건</td>
                <td>{e.active>=e.limit ? <StatusBadge status="실패"/> : e.avail ? <StatusBadge status="성공"/> : <StatusBadge status="대기"/>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <div className="modal-overlay" onClick={()=>setDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{detail.name} 전문가</h3>
            <div className="toggle-row"><span>소속 권역</span><b>{detail.region}</b></div>
            <div className="toggle-row"><span>일일 배정 한도</span><b>{detail.limit}건</b></div>
            <div className="toggle-row"><span>진행 중 배정</span><b>{detail.active}건</b></div>
            <div className="toggle-row"><span>가용 여부</span><b>{detail.avail?'가능':'중지'}</b></div>
            <div className="modal-foot"><button className="btn btn-primary btn-block" onClick={()=>setDetail(null)}>닫기</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── manual reassign ───────────────────── */
function ManualReassignScreen({waiting,setWaiting,showToast}){
  const [target,setTarget] = useState(null);
  const [picked,setPicked] = useState(null);

  function openReassign(w){ setTarget(w); setPicked(w.candidates[0].name); }
  function confirmReassign(){
    showToast(target.company+' 건이 '+picked+' 전문가에게 수동 재배정되어 이력에 기록되었습니다');
    setWaiting(waiting.filter(w=>w.id!==target.id));
    setTarget(null);
  }
  const reasonBadge = {'거리초과':'badge-warn','전문가부재':'badge-danger','편차초과':'badge-idle'};

  return (
    <div className="content-pad screen-fade">
      <div className="page-head">
        <div><span className="page-eyebrow">Exceptions</span><h2>수동 재배정</h2><p>자동 배정 규칙에서 걸러진 대기 건을 사유별로 확인하고 직접 전문가를 지정합니다.</p></div>
        <span className="status-badge badge-warn">대기 {waiting.length}건</span>
      </div>
      <div className="grid-3">
        {waiting.map(w=>(
          <div className="panel" key={w.id}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:800}}>{w.company}</div>
              <span className={"status-badge "+(reasonBadge[w.reason]||'badge-idle')}>{w.reason}</span>
            </div>
            <div style={{fontSize:11.5,color:'var(--text2)',marginBottom:12}}>{w.region} · {w.id}</div>
            <button className="btn btn-primary btn-block" onClick={()=>openReassign(w)}>재배정</button>
          </div>
        ))}
        {waiting.length===0 && <div style={{fontSize:12.5,color:'var(--text2)'}}>현재 수동 재배정이 필요한 건이 없습니다.</div>}
      </div>

      {target && (
        <div className="modal-overlay" onClick={()=>setTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{target.company} 재배정</h3>
            <p style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>균등 배분 스코어 순 추천 전문가</p>
            {target.candidates.map(c=>(
              <div key={c.name} className={"candidate-row"+(picked===c.name?' selected':'')} onClick={()=>setPicked(c.name)}>
                <span style={{display:'flex',alignItems:'center',gap:8}}><span className="avatar-list" style={{width:24,height:24,fontSize:10}}>{initial(c.name)}</span>{c.name}</span>
                <b style={{fontSize:12}}>{c.score}점</b>
              </div>
            ))}
            <div className="modal-foot">
              <button className="btn btn-ghost btn-block" onClick={()=>setTarget(null)}>취소</button>
              <button className="btn btn-primary btn-block" onClick={confirmReassign}>재배정 확정</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── stats & notify ───────────────────── */
function StatsNotifyScreen({notifs,setNotifs,showToast}){
  const [resendingId,setResendingId] = useState(null);
  function resend(id){
    setResendingId(id);
    setNotifs(notifs.map(n=>n.id===id?{...n,status:'재시도중'}:n));
    setTimeout(()=>{
      setNotifs(prev=>prev.map(n=>n.id===id?{...n,status:'성공',time:'방금 전'}:n));
      setResendingId(null);
      showToast('알림이 재발송되어 성공적으로 전달되었습니다');
    },1100);
  }
  const pieData = [{name:'서남부',value:14},{name:'남부',value:19},{name:'서북부',value:9},{name:'기타',value:17}];

  return (
    <div className="content-pad screen-fade">
      <div className="page-head"><div><span className="page-eyebrow">Insights</span><h2>통계 &amp; 알림</h2><p>권역별 배정 현황·균등 분산 지표와 알림 발송 이력을 확인합니다.</p></div></div>
      <div className="grid-2">
        <div className="panel">
          <h3 style={{fontSize:13,fontWeight:800,marginBottom:12}}>권역별 배정 건수</h3>
          <div style={{height:220}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={REGION_STATS}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e1e1e3" vertical={false} />
                <XAxis dataKey="region" tick={{fontSize:11}} axisLine={false} tickLine={false} />
                <YAxis tick={{fontSize:11}} axisLine={false} tickLine={false} width={24} />
                <Tooltip />
                <Bar dataKey="count" fill="#5683da" radius={[6,6,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
          <h3 style={{fontSize:13,fontWeight:800,margin:'18px 0 12px'}}>균등 분산 편차 (건)</h3>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {REGION_STATS.map(r=>(
              <div key={r.region} style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{width:56,fontSize:11.5,color:'var(--text2)'}}>{r.region}</span>
                <span className="region-bar" style={{flex:1}}><div style={{width:(r.deviation/3*100)+'%',background:r.deviation>=3?'var(--danger)':'var(--accent)'}}></div></span>
                <span style={{width:24,fontSize:11.5,fontWeight:800,textAlign:'right'}}>{r.deviation}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="panel">
            <h3 style={{fontSize:13,fontWeight:800,marginBottom:10}}>권역 비중</h3>
            <div style={{height:170}}>
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} dataKey="value" nameKey="name" innerRadius={38} outerRadius={62} paddingAngle={3}>
                    {pieData.map((e,i)=><Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip />
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>
          <div className="panel">
            <h3 style={{fontSize:13,fontWeight:800,marginBottom:10}}>알림 발송 이력</h3>
            <table>
              <thead><tr><th>채널</th><th>대상</th><th>상태</th><th></th></tr></thead>
              <tbody>
                {notifs.map(n=>(
                  <tr key={n.id}>
                    <td><span className="tag">{n.channel}</span></td>
                    <td>{n.target}<div style={{fontSize:10.5,color:'var(--text2)'}}>{n.content} · {n.time}</div></td>
                    <td>{n.status==='재시도중' ? <span style={{display:'flex',alignItems:'center',gap:6,fontSize:11}}><span className="spinner" style={{borderTopColor:'var(--primary)',borderColor:'rgba(86,131,218,.3)'}}></span>재시도중</span> : <StatusBadge status={n.status}/>}</td>
                    <td>{n.status==='실패' && <button className="btn btn-outline btn-sm" onClick={()=>resend(n.id)}>재발송</button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────────────────── settings ───────────────────── */
function SettingsScreen({showToast}){
  const [criterion,setCriterion] = useState('반경 거리 기준');
  const [radius,setRadius] = useState(1.5);
  const [period,setPeriod] = useState('월 단위');
  const [deviation,setDeviation] = useState(2);
  const [channels,setChannels] = useState({알림톡:true,SMS:true,이메일:false});

  function toggleChannel(k){ setChannels({...channels,[k]:!channels[k]}); }

  return (
    <div className="content-pad screen-fade">
      <div className="page-head"><div><span className="page-eyebrow">Configuration</span><h2>파라미터 조정</h2><p>묶음·균등배분 기준과 알림 발송 채널을 화면에서 직접 조정합니다.</p></div></div>
      <div className="grid-2">
        <div className="panel">
          <h3 style={{fontSize:13,fontWeight:800,marginBottom:14}}>묶음 &amp; 균등 배분 기준</h3>
          <div className="field">
            <label>근접 기업 묶음 기준</label>
            <select value={criterion} onChange={e=>setCriterion(e.target.value)}>
              <option>반경 거리 기준</option><option>동일 시·군 기준</option><option>이동 시간 기준</option>
            </select>
          </div>
          <div className="field">
            <label>묶음 반경 (km)</label>
            <input type="number" step="0.1" value={radius} onChange={e=>setRadius(e.target.value)} />
          </div>
          <div className="field">
            <label>균등 배분 판정 주기</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)}>
              <option>월 단위</option><option>누적 기준</option>
            </select>
          </div>
          <div className="field">
            <label>허용 편차 (건)</label>
            <input type="number" value={deviation} onChange={e=>setDeviation(e.target.value)} />
            <div className="field-hint">권역 내 전문가 간 배정 건수 차이의 허용 범위입니다.</div>
          </div>
        </div>
        <div className="panel">
          <h3 style={{fontSize:13,fontWeight:800,marginBottom:14}}>알림 발송 채널</h3>
          {Object.keys(channels).map(k=>(
            <div className="toggle-row" key={k}>
              <span style={{fontSize:12.5,fontWeight:600}}>{k} 발송</span>
              <span className={"switch"+(channels[k]?' on':'')} onClick={()=>toggleChannel(k)}><span className="knob"></span></span>
            </div>
          ))}
          <button className="btn btn-primary btn-block btn-pill" style={{marginTop:18}} onClick={()=>showToast('배정 기준 파라미터가 저장되어 다음 배정부터 적용됩니다')}>파라미터 저장</button>
        </div>
      </div>
    </div>
  );
}

/* ───────────────────── app shell ───────────────────── */
function App(){
  const [tab,setTab] = useState('main');
  const [cards,setCards] = useState(CARDS_INIT);
  const [experts,setExperts] = useState(EXPERTS_INIT);
  const [waiting,setWaiting] = useState(WAITING_INIT);
  const [notifs,setNotifs] = useState(NOTIF_INIT);
  const [toast,setToast] = useState(null);

  function showToast(msg){ setToast(msg); setTimeout(()=>setToast(null),2600); }

  const tabs = [
    {id:'main',label:'배정 워크플로우 칸반 보드',icon:'ph-kanban'},
    {id:'expert-management',label:'전문가 명단 & 배정 가능 지역 관리',icon:'ph-users-three'},
    {id:'manual-reassign',label:'자동 배정 실패 건 수동 재배정',icon:'ph-arrows-clockwise'},
    {id:'stats-notify',label:'배정 현황 통계 & 알림 발송 관리',icon:'ph-chart-bar'},
    {id:'settings',label:'배정 기준 파라미터 조정',icon:'ph-sliders'},
  ];

  return (
    <div className="app-shell" data-archetype="kanban-board">
      <header className="top-header">
        <div className="brand"><span className="brand-mark"><i className="ph-fill ph-flow-arrow" style={{fontSize:14}}></i></span>배정 운영 허브</div>
        <div className="header-right">
          <button className="icon-btn" style={{position:'relative'}} onClick={()=>showToast('알림 3건을 확인했습니다')}><i className="ph ph-bell"></i><span className="badge">3</span></button>
          <span className="avatar-mini">담</span>
        </div>
      </header>
      <div className="board-header">
        {tabs.map(t=>(
          <button key={t.id} className={"nav-pill"+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
            <i className={"ph "+t.icon}></i>{t.label}
          </button>
        ))}
        <div className="board-header-spacer"></div>
      </div>

      {tab==='main' && <BoardScreen cards={cards} setCards={setCards} showToast={showToast} />}
      {tab==='expert-management' && <ExpertManagementScreen experts={experts} setExperts={setExperts} showToast={showToast} />}
      {tab==='manual-reassign' && <ManualReassignScreen waiting={waiting} setWaiting={setWaiting} showToast={showToast} />}
      {tab==='stats-notify' && <StatsNotifyScreen notifs={notifs} setNotifs={setNotifs} showToast={showToast} />}
      {tab==='settings' && <SettingsScreen showToast={showToast} />}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
