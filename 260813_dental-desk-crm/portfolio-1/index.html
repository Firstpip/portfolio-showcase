<style>
:root{
  --ink:#101010;
  --graphite:#242424;
  --slate:#6b7280;
  --stone:#898989;
  --silver:#e5e7eb;
  --paper:#f4f4f4;
  --white:#ffffff;
  --action-blue:#0099ff;
  --accent:#3ad98a;
  --danger:#ef4444;
  --amber:#f5a623;
  --radius-card:12px;
  --radius-input:8px;
  --shadow-card:0 4px 8px rgba(36,36,36,.05);
  --shadow-hover:0 1px 5px -4px rgba(36,36,36,.7),0 4px 8px rgba(36,36,36,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--paper);color:var(--graphite);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
#root{width:100%;}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(58,217,138,.5)}50%{opacity:.5;box-shadow:0 0 0 5px rgba(58,217,138,0)}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.app-shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--white);border-right:1px solid var(--silver);display:flex;flex-direction:column;padding:20px 14px;z-index:40;}
.main-wrap{margin-left:230px;flex:1;min-width:0;width:calc(100% - 230px);display:flex;flex-direction:column;min-height:100vh;}

.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 26px;}
.brand .logo-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
.brand .logo-text{font-weight:700;font-size:18px;letter-spacing:-0.02em;color:var(--ink);}

.nav-group-label{font-size:11px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 6px;}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9999px;font-size:14px;font-weight:500;color:var(--graphite);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:background .15s,color .15s;margin-bottom:2px;}
.nav-link:hover{background:var(--paper);}
.nav-link.active{background:var(--ink);color:var(--white);}
.nav-link .n-badge{margin-left:auto;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9999px;}
.nav-link.active .n-badge{background:var(--white);}

.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--silver);}
.profile-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:background .15s;}
.profile-chip:hover{background:var(--paper);}
.avatar-circle{width:34px;height:34px;border-radius:9999px;background:linear-gradient(135deg,#101010,#4b4b4b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}

.topbar{height:60px;border-bottom:1px solid var(--silver);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--white);position:sticky;top:0;z-index:30;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:9999px;padding:8px 16px;width:280px;color:var(--stone);}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--graphite);}
.topbar-actions{display:flex;align-items:center;gap:14px;}
.icon-btn{width:36px;height:36px;border-radius:9999px;border:1px solid var(--silver);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--graphite);transition:background .15s,transform .12s;}
.icon-btn:hover{background:var(--paper);}
.icon-btn:active{transform:scale(.94);}
.live-dot{width:8px;height:8px;border-radius:9999px;background:var(--accent);display:inline-block;animation:pulseDot 1.8s ease-in-out infinite;}

.content{padding:28px;width:100%;animation:fadeInUp .35s ease;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.page-title{font-size:32px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);line-height:1.15;margin:0;}
.page-sub{font-size:14px;color:var(--slate);margin-top:6px;}

.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9999px;padding:10px 20px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,opacity .15s,background .15s;white-space:nowrap;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--ink);color:var(--white);}
.btn-primary:hover{opacity:.86;}
.btn-ghost{background:var(--white);border:1px solid var(--silver);color:var(--graphite);}
.btn-ghost:hover{background:var(--paper);}
.btn-sm{padding:7px 15px;font-size:13px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.86;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;}
.card.lift{transition:box-shadow .18s,transform .18s;}
.card.lift:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:700;}
.chip{padding:6px 14px;border-radius:9999px;font-size:13px;border:1px solid var(--silver);background:var(--white);cursor:pointer;font-family:inherit;color:var(--slate);font-weight:500;transition:all .15s;}
.chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
.chip:hover:not(.active){background:var(--paper);}

.table{width:100%;border-collapse:collapse;font-size:14px;}
.table th{text-align:left;color:var(--slate);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--silver);}
.table td{padding:13px 12px;border-bottom:1px solid var(--silver);color:var(--graphite);}
.table tr.clickable{cursor:pointer;transition:background .12s;}
.table tr.clickable:hover td{background:var(--paper);}
.table tr:last-child td{border-bottom:none;}

.form-field{margin-bottom:16px;}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--graphite);margin-bottom:6px;}
.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--silver);border-radius:var(--radius-input);padding:10px 12px;font-size:14px;outline:none;color:var(--graphite);background:var(--white);transition:border-color .15s;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--ink);}
.form-field .err{color:var(--danger);font-size:12px;margin-top:5px;}
.form-field input.invalid{border-color:var(--danger);}

.modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease;padding:20px;}
.modal{background:var(--white);border-radius:18px;padding:28px;width:480px;max-width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(16,16,16,.28);animation:modalPop .22s cubic-bezier(.2,.9,.3,1.2);}
.modal.wide{width:600px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h3{font-size:20px;font-weight:700;margin:0;color:var(--ink);}
.modal-close{width:32px;height:32px;border-radius:9999px;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--graphite);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink);color:var(--white);padding:12px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px rgba(16,16,16,.22);animation:toastIn .28s ease;font-weight:500;}
.toast.success svg{color:var(--accent);}

.cal-wrap{display:grid;grid-template-columns:70px repeat(4,1fr);border:1px solid var(--silver);border-radius:14px;overflow:hidden;background:var(--white);}
.cal-corner{background:var(--paper);border-bottom:1px solid var(--silver);}
.cal-head{padding:12px 8px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;border-bottom:1px solid var(--silver);border-left:1px solid var(--silver);background:var(--paper);line-height:1.4;}
.cal-head span{display:block;font-weight:500;color:var(--slate);font-size:11px;}
.cal-times{display:flex;flex-direction:column;}
.cal-time{font-size:10.5px;color:var(--stone);padding:2px 8px;height:34px;text-align:right;border-top:1px solid var(--silver);display:flex;align-items:flex-start;justify-content:flex-end;}
.cal-lane{position:relative;border-left:1px solid var(--silver);}
.cal-cell{height:34px;border-top:1px solid var(--silver);cursor:pointer;transition:background .1s;}
.cal-cell:hover{background:#eefcf5;}
.appt-block{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;color:var(--white);cursor:pointer;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s;z-index:2;}
.appt-block:hover{transform:scale(1.025);box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:6;}
.appt-block small{display:block;font-weight:500;opacity:.9;font-size:10.5px;margin-top:1px;}

.stat-big{font-size:36px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;line-height:1;}
.stat-row-mini{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--silver);font-size:13px;}
.stat-row-mini:last-child{border-bottom:none;}
.dot{width:8px;height:8px;border-radius:9999px;display:inline-block;margin-right:6px;}

.timeline-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--silver);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:10px;height:10px;border-radius:9999px;background:var(--accent);margin-top:5px;flex-shrink:0;}

.bar-col{transform-origin:bottom;animation:barGrow .5s ease;}

.main-content-row{display:flex;gap:22px;align-items:flex-start;}
.cal-col{flex:1;min-width:0;}
.cal-side{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}

@media (max-width:900px){
  .sidebar{width:72px;padding:16px 8px;}
  .brand .logo-text,.nav-link span.label,.nav-group-label,.profile-chip .p-text{display:none;}
  .main-wrap{margin-left:72px;width:calc(100% - 72px);}
  .search-box{width:160px;}
}
@media (max-width:820px){
  .main-content-row{flex-direction:column;}
  .cal-side{width:100%;}
}
</style>

  { id: 10, patient: '문가온', item: '충치치료', amount: 95000, paid: 95000, status: '완료', date: '2026.07.02' },
];

  { day: '월', amount: 32 }, { day: '화', amount: 41 }, { day: '수', amount: 28 },
  { day: '목', amount: 53 }, { day: '금', amount: 61 }, { day: '토', amount: 39 },
];

const NOTIFY_TEMPLATES = [
  { id: 'reminder', title: '예약 리마인드', channel: '문자(SMS)+알림톡', body: '[덴탈플로우] {환자명}님, {예약일시}에 예약이 있습니다. 변경/취소는 데스크로 연락 부탁드립니다.' },
  { id: 'recall', title: '정기검진 리콜', channel: '카카오 알림톡', body: '[덴탈플로우] {환자명}님, 마지막 내원 후 6개월이 지났습니다. 정기검진 예약을 안내드립니다.' },
];

const INITIAL_QUEUE = [
  { id: 1, patient: '이서준', channel: 'SMS', status: '대기중', scheduled: '2026.08.13 17:00', kind: '예약 리마인드' },
  { id: 2, patient: '한지민', channel: '알림톡', status: '발송완료', scheduled: '2026.08.13 09:30', kind: '예약 리마인드' },
  { id: 3, patient: '윤서아', channel: 'SMS', status: '실패', scheduled: '2026.08.12 18:00', kind: '정기검진 리콜' },
  { id: 4, patient: '신아린', channel: '알림톡', status: '대기중', scheduled: '2026.08.13 18:00', kind: '예약 리마인드' },
  { id: 5, patient: '정하윤', channel: 'SMS', status: '실패', scheduled: '2026.08.12 10:00', kind: '정기검진 리콜' },
  { id: 6, patient: '오은우', channel: '알림톡', status: '발송완료', scheduled: '2026.08.11 14:00', kind: '예약 리마인드' },
  { id: 7, patient: '문가온', channel: 'SMS', status: '대기중', scheduled: '2026.08.13 19:00', kind: '예약 리마인드' },
  { id: 8, patient: '조민재', channel: '알림톡', status: '발송완료', scheduled: '2026.08.10 11:00', kind: '정기검진 리콜' },
];

function Icon({ name, size = 16, style }) {
  const ref = useRef(null);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
  return <i data-lucide={name} style={{ width: size, height: size, ...style }} ref={ref}></i>;
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={"modal" + (wide ? " wide" : "")} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ToastStack({ toasts }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div className="toast success" key={t.id}>
          <Icon name="check-circle" size={16} />
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function Badge({ text, color, textColor }) {
  return <span className="badge" style={{ background: color + '22', color: textColor || color }}>{text}</span>;
}

function App() {
  const [screen, setScreen] = useState('main');
  const [appts, setAppts] = useState(INITIAL_APPTS);
  const [patients, setPatients] = useState(INITIAL_PATIENTS);
  const [payments, setPayments] = useState(INITIAL_PAYMENTS);
  const [queue, setQueue] = useState(INITIAL_QUEUE);

  const [toasts, setToasts] = useState([]);
  const pushToast = (msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };

  const [apptModal, setApptModal] = useState(null);
  const [newApptModal, setNewApptModal] = useState(null);
  const [patientDetail, setPatientDetail] = useState(null);
  const [newPatientModal, setNewPatientModal] = useState(false);
  const [paymentDetail, setPaymentDetail] = useState(null);
  const [newPaymentModal, setNewPaymentModal] = useState(false);
  const [bulkConfirm, setBulkConfirm] = useState(false);
  const [templateEdit, setTemplateEdit] = useState(null);
  const [sendingId, setSendingId] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const [patientQuery, setPatientQuery] = useState('');
  const [patientForm, setPatientForm] = useState({ name: '', phone: '', birth: '' });
  const [patientErr, setPatientErr] = useState({});
  const [paymentFilter, setPaymentFilter] = useState('전체');
  const [selectedPayments, setSelectedPayments] = useState([]);
  const [notifyFilter, setNotifyFilter] = useState('전체');

  const filteredPatients = useMemo(() => {
    const q = patientQuery.trim();
    if (!q) return patients;
    return patients.filter(p => p.name.includes(q) || p.phone.includes(q));
  }, [patients, patientQuery]);

  const filteredPayments = useMemo(() => {
    if (paymentFilter === '전체') return payments;
    return payments.filter(p => p.status === paymentFilter);
  }, [payments, paymentFilter]);

  const filteredQueue = useMemo(() => {
    if (notifyFilter === '전체') return queue;
    return queue.filter(q => q.kind === notifyFilter);
  }, [queue, notifyFilter]);

  const todayCounts = useMemo(() => {
    const c = { 확정: 0, 예약대기: 0, 내원완료: 0, 노쇼: 0, 취소: 0 };
    appts.forEach(a => { c[a.status] = (c[a.status] || 0) + 1; });
    return c;
  }, [appts]);

  const totalUnpaid = useMemo(() => payments.filter(p => p.status !== '완료').reduce((s, p) => s + (p.amount - p.paid), 0), [payments]);

  function setApptStatus(id, status) {
    setAppts(list => list.map(a => a.id === id ? { ...a, status } : a));
    setApptModal(m => m ? { ...m, status } : m);
    pushToast('예약 상태가 "' + status + '"(으)로 변경되었습니다');
  }

  function submitNewAppt(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const patient = fd.get('patient');
    if (!patient) return;
    const id = Math.max(...appts.map(a => a.id)) + 1;
    setAppts(list => [...list, {
      id, lane: Number(newApptModal.lane), start: Number(newApptModal.start), span: 1,
      patient, phone: fd.get('phone') || '010-0000-0000', treatment: fd.get('treatment') || '진료 상담', status: '예약대기', memo: '',
    }]);
    setNewApptModal(null);
    pushToast(patient + '님 예약이 등록되었습니다');
  }

  function submitNewPatient(e) {
    e.preventDefault();
    const errs = {};
    if (!patientForm.name.trim()) errs.name = '이름을 입력해주세요';
    if (!/^\d{2,3}-\d{3,4}-\d{4}$/.test(patientForm.phone)) errs.phone = '010-0000-0000 형식으로 입력해주세요';
    setPatientErr(errs);
    if (Object.keys(errs).length) return;
    const id = Math.max(...patients.map(p => p.id)) + 1;
    setPatients(list => [{ id, name: patientForm.name, phone: patientForm.phone, birth: patientForm.birth || '-', lastVisit: '-', status: '활성', history: [] }, ...list]);
    setNewPatientModal(false);
    setPatientForm({ name: '', phone: '', birth: '' });
    pushToast(patientForm.name + '님이 신규 등록되었습니다');
  }

  function submitNewPayment(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const amount = Number(fd.get('amount') || 0);
    const id = Math.max(...payments.map(p => p.id)) + 1;
    setPayments(list => [{ id, patient: fd.get('patient'), item: fd.get('item'), amount, paid: amount, status: '완료', date: '2026.08.13' }, ...list]);
    setNewPaymentModal(false);
    pushToast('수납 내역이 등록되었습니다');
  }

  function togglePaymentSelect(id) {
    setSelectedPayments(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  }

  function confirmBulkPayment() {
    setPayments(list => list.map(p => selectedPayments.includes(p.id) ? { ...p, paid: p.amount, status: '완료' } : p));
    pushToast(selectedPayments.length + '건이 일괄 수납 처리되었습니다');
    setSelectedPayments([]);
    setBulkConfirm(false);
  }

  function sendNow(id) {
    setSendingId(id);
    setTimeout(() => {
      setQueue(list => list.map(q => q.id === id ? { ...q, status: '발송완료' } : q));
      setSendingId(null);
      pushToast('발송이 완료되었습니다');
    }, 1200);
  }

  const NAV = [
    { key: 'main', label: '예약 스케줄러', icon: 'calendar-days' },
    { key: 'patient', label: '환자 통합 관리', icon: 'users' },
    { key: 'payment', label: '수납·미수금 관리', icon: 'wallet' },
    { key: 'notify', label: 'SMS·알림톡 자동 발송', icon: 'send' },
  ];

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="brand">
          <div className="logo-mark"><Icon name="stethoscope" size={17} /></div>
          <div className="logo-text">덴탈플로우</div>
        </div>
        <div className="nav-group-label">업무</div>
        {NAV.map(n => (
          <button key={n.key} className={"nav-link" + (screen === n.key ? ' active' : '')} onClick={() => setScreen(n.key)}>
            <Icon name={n.icon} size={17} />
            <span className="label">{n.label}</span>
            {n.key === 'notify' && queue.some(q => q.status === '실패') && <span className="n-badge">{queue.filter(q => q.status === '실패').length}</span>}
          </button>
        ))}
        <div className="sidebar-footer">
          <div className="profile-chip" onClick={() => setSettingsOpen(true)}>
            <div className="avatar-circle">데스</div>
            <div className="p-text">
              <div style={{ fontSize: 13, fontWeight: 700 }}>데스크 직원</div>
              <div style={{ fontSize: 11.5, color: 'var(--slate)' }}>환경설정</div>
            </div>
            <Icon name="settings" size={15} style={{ marginLeft: 'auto', color: 'var(--slate)' }} />
          </div>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="topbar">
          <div className="search-box">
            <Icon name="search" size={15} />
            <input placeholder="환자, 예약 검색..." />
          </div>
          <div className="topbar-actions">
            <span style={{ fontSize: 12.5, color: 'var(--slate)', display: 'flex', alignItems: 'center', gap: 6 }}>
              <span className="live-dot"></span>실시간 동기화 중
            </span>
            <button className="icon-btn" onClick={() => pushToast('새 알림이 없습니다')}><Icon name="bell" size={16} /></button>
            <button className="icon-btn" onClick={() => setSettingsOpen(true)}><Icon name="settings" size={16} /></button>
          </div>
        </header>

        {screen === 'main' && (
          <MainScreen appts={appts} todayCounts={todayCounts} setApptModal={setApptModal} setNewApptModal={setNewApptModal} />
        )}
        {screen === 'patient' && (
          <PatientScreen
            patients={filteredPatients} allCount={patients.length}
            query={patientQuery} setQuery={setPatientQuery}
            onOpenDetail={setPatientDetail} onNew={() => setNewPatientModal(true)}
          />
        )}
        {screen === 'payment' && (
          <PaymentScreen
            payments={filteredPayments} filter={paymentFilter} setFilter={setPaymentFilter}
            selected={selectedPayments} onToggle={togglePaymentSelect}
            onOpenDetail={setPaymentDetail} onNew={() => setNewPaymentModal(true)}
            onBulk={() => setBulkConfirm(true)} totalUnpaid={totalUnpaid}
          />
        )}
        {screen === 'notify' && (
          <NotifyScreen
            queue={filteredQueue} filter={notifyFilter} setFilter={setNotifyFilter}
            onEditTemplate={setTemplateEdit} onSend={sendNow} sendingId={sendingId}
          />
        )}
      </div>

      {apptModal && (
        <Modal title="예약 상세" onClose={() => setApptModal(null)}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 6 }}>
            <Row label="환자명" value={apptModal.patient} />
            <Row label="연락처" value={apptModal.phone} />
            <Row label="담당 체어" value={LANES[apptModal.lane].label + ' · ' + LANES[apptModal.lane].sub} />
            <Row label="예약 시각" value={TIMES[apptModal.start]} />
            <Row label="진료 항목" value={apptModal.treatment} />
            {apptModal.memo && <Row label="메모" value={apptModal.memo} />}
          </div>
          <div style={{ fontSize: 13, fontWeight: 700, margin: '16px 0 8px' }}>예약 상태 변경</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {Object.keys(STATUS_COLOR).map(s => (
              <button key={s} className="chip" style={apptModal.status === s ? { background: STATUS_COLOR[s], color: STATUS_TEXT[s], borderColor: STATUS_COLOR[s] } : {}}
                onClick={() => setApptStatus(apptModal.id, s)}>{s}</button>
            ))}
          </div>
        </Modal>
      )}

      {newApptModal && (
        <Modal title="신규 예약 등록" onClose={() => setNewApptModal(null)}>
          <form onSubmit={submitNewAppt}>
            <div className="form-field"><label>환자명</label><input name="patient" placeholder="환자 이름" required /></div>
            <div className="form-field"><label>연락처</label><input name="phone" placeholder="010-0000-0000" /></div>
            <div className="form-field"><label>진료 항목</label><input name="treatment" placeholder="예: 정기검진" /></div>
            <div className="form-field"><label>체어 · 시간</label>
              <input disabled value={LANES[newApptModal.lane].label + ' · ' + LANES[newApptModal.lane].sub + ' · ' + TIMES[newApptModal.start]} />
            </div>
            <div className="modal-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setNewApptModal(null)}>취소</button>
              <button type="submit" className="btn btn-primary"><Icon name="plus" size={14} />예약 등록</button>
            </div>
          </form>
        </Modal>
      )}

      {patientDetail && (
        <Modal title={patientDetail.name + ' 님'} onClose={() => setPatientDetail(null)} wide>
          <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', marginBottom: 18 }}>
            <Row label="연락처" value={patientDetail.phone} />
            <Row label="생년월일" value={patientDetail.birth} />
            <Row label="최근 내원일" value={patientDetail.lastVisit} />
            <Badge text={patientDetail.status} color={patientDetail.status === '활성' ? '#3ad98a' : '#9ca3af'} textColor={patientDetail.status === '활성' ? '#0b3b23' : '#4b5563'} />
          </div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>진료·상담 이력</div>
          {patientDetail.history.length === 0 && <div style={{ color: 'var(--slate)', fontSize: 13, padding: '10px 0' }}>등록된 이력이 없습니다</div>}
          {patientDetail.history.map((h, i) => (
            <div className="timeline-item" key={i}>
              <div className="timeline-dot"></div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 700 }}>{h.type} <span style={{ fontWeight: 400, color: 'var(--slate)', fontSize: 12 }}>· {h.date}</span></div>
                <div style={{ fontSize: 12.5, color: 'var(--slate)', marginTop: 2 }}>{h.doctor}</div>
                <div style={{ fontSize: 13, marginTop: 4 }}>{h.memo}</div>
              </div>
            </div>
          ))}
        </Modal>
      )}

      {newPatientModal && (
        <Modal title="신규 환자 등록" onClose={() => setNewPatientModal(false)}>
          <form onSubmit={submitNewPatient}>
            <div className="form-field">
              <label>이름</label>
              <input className={patientErr.name ? 'invalid' : ''} value={patientForm.name} onChange={e => setPatientForm(f => ({ ...f, name: e.target.value }))} placeholder="환자 이름" />
              {patientErr.name && <div className="err">{patientErr.name}</div>}
            </div>
            <div className="form-field">
              <label>연락처</label>
              <input className={patientErr.phone ? 'invalid' : ''} value={patientForm.phone} onChange={e => setPatientForm(f => ({ ...f, phone: e.target.value }))} placeholder="010-0000-0000" />
              {patientErr.phone && <div className="err">{patientErr.phone}</div>}
            </div>
            <div className="form-field">
              <label>생년월일</label>
              <input value={patientForm.birth} onChange={e => setPatientForm(f => ({ ...f, birth: e.target.value }))} placeholder="1990.01.01" />
            </div>
            <div className="modal-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setNewPatientModal(false)}>취소</button>
              <button type="submit" className="btn btn-primary"><Icon name="user-plus" size={14} />등록</button>
            </div>
          </form>
        </Modal>
      )}

      {paymentDetail && (
        <Modal title="수납 상세" onClose={() => setPaymentDetail(null)}>
          <Row label="환자명" value={paymentDetail.patient} />
          <Row label="진료 항목" value={paymentDetail.item} />
          <Row label="등록일" value={paymentDetail.date} />
          <Row label="청구 금액" value={paymentDetail.amount.toLocaleString() + '원'} />
          <Row label="수납 금액" value={paymentDetail.paid.toLocaleString() + '원'} />
          <Row label="미수금" value={(paymentDetail.amount - paymentDetail.paid).toLocaleString() + '원'} />
          <div style={{ marginTop: 12 }}>
            <Badge text={paymentDetail.status}
              color={paymentDetail.status === '완료' ? '#3ad98a' : paymentDetail.status === '부분수납' ? '#f5a623' : '#ef4444'}
              textColor={paymentDetail.status === '완료' ? '#0b3b23' : paymentDetail.status === '부분수납' ? '#7a5200' : '#ffffff'} />
          </div>
        </Modal>
      )}

      {newPaymentModal && (
        <Modal title="수납 등록" onClose={() => setNewPaymentModal(false)}>
          <form onSubmit={submitNewPayment}>
            <div className="form-field"><label>환자명</label><input name="patient" placeholder="환자 이름" required /></div>
            <div className="form-field"><label>진료 항목</label><input name="item" placeholder="예: 스케일링" required /></div>
            <div className="form-field"><label>금액</label><input name="amount" type="number" placeholder="80000" required /></div>
            <div className="modal-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setNewPaymentModal(false)}>취소</button>
              <button type="submit" className="btn btn-primary"><Icon name="wallet" size={14} />수납 등록</button>
            </div>
          </form>
        </Modal>
      )}

      {bulkConfirm && (
        <Modal title="일괄 수납 처리" onClose={() => setBulkConfirm(false)}>
          <p style={{ fontSize: 14, color: 'var(--graphite)', lineHeight: 1.6 }}>선택한 {selectedPayments.length}건을 전액 수납 완료 처리하시겠습니까? 트랜잭션 단위로 처리되어 일부만 반영되는 일이 없습니다.</p>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={() => setBulkConfirm(false)}>취소</button>
            <button className="btn btn-primary" onClick={confirmBulkPayment}><Icon name="check" size={14} />일괄 처리</button>
          </div>
        </Modal>
      )}

      {templateEdit && (
        <Modal title={templateEdit.title + ' 템플릿 편집'} onClose={() => setTemplateEdit(null)}>
          <div className="form-field"><label>발송 채널</label><input disabled value={templateEdit.channel} /></div>
          <div className="form-field"><label>메시지 본문</label><textarea rows={5} defaultValue={templateEdit.body}></textarea></div>
          <div style={{ fontSize: 12, color: 'var(--slate)' }}>변수: {'{환자명}'}, {'{예약일시}'}는 발송 시 자동 치환됩니다</div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={() => setTemplateEdit(null)}>취소</button>
            <button className="btn btn-primary" onClick={() => { setTemplateEdit(null); pushToast('템플릿이 저장되었습니다'); }}><Icon name="save" size={14} />저장</button>
          </div>
        </Modal>
      )}

      {settingsOpen && (
        <Modal title="환경설정" onClose={() => setSettingsOpen(false)}>
          <div className="form-field"><label>지점명</label><input defaultValue="본원" /></div>
          <div className="form-field"><label>진료 시간</label><input defaultValue="09:00 - 18:00" /></div>
          <div className="form-field"><label>예약 리마인드 발송 시점</label>
            <select defaultValue="24">
              <option value="12">예약 12시간 전</option>
              <option value="24">예약 24시간 전</option>
              <option value="48">예약 48시간 전</option>
            </select>
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={() => setSettingsOpen(false)}>취소</button>
            <button className="btn btn-primary" onClick={() => { setSettingsOpen(false); pushToast('설정이 저장되었습니다'); }}>저장</button>
          </div>
        </Modal>
      )}

      <ToastStack toasts={toasts} />
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ marginBottom: 10, minWidth: 140 }}>
      <div style={{ fontSize: 12, color: 'var(--slate)', marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 14, fontWeight: 600 }}>{value}</div>
    </div>
  );
}

function MainScreen({ appts, todayCounts, setApptModal, setNewApptModal }) {
  const rowH = 34;
  return (
    <div className="content">
      <div className="page-head">
        <div>
          <h1 className="page-title">오늘의 예약 스케줄</h1>
          <div className="page-sub">2026년 8월 13일 목요일 · 체어 4개 운영 중</div>
        </div>
        <button className="btn btn-primary" onClick={() => setNewApptModal({ lane: 0, start: 0 })}><Icon name="plus" size={15} />신규 예약 등록</button>
      </div>

      <div className="main-content-row">
        <div className="cal-col">
          <div className="cal-wrap">
            <div className="cal-corner"></div>
            {LANES.map(l => (
              <div className="cal-head" key={l.id}>{l.label}<span>{l.sub}</span></div>
            ))}
            <div className="cal-times">
              {TIMES.map(t => <div className="cal-time" key={t} style={{ height: rowH }}>{t}</div>)}
            </div>
            {LANES.map(lane => (
              <div className="cal-lane" key={lane.id} style={{ height: rowH * TIMES.length }}>
                {TIMES.map((t, ti) => (
                  <div key={ti} className="cal-cell" style={{ height: rowH }} onClick={() => setNewApptModal({ lane: lane.id, start: ti })}></div>
                ))}
                {appts.filter(a => a.lane === lane.id).map(a => (
                  <div key={a.id} className="appt-block"
                    style={{ top: a.start * rowH + 2, height: a.span * rowH - 4, background: STATUS_COLOR[a.status], color: STATUS_TEXT[a.status] }}
                    onClick={(e) => { e.stopPropagation(); setApptModal(a); }}>
                    {a.patient} · {a.treatment}
                    <small>{a.status}</small>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>

        <div className="cal-side">
          <div className="card lift">
            <div style={{ fontSize: 13, color: 'var(--slate)', fontWeight: 600, marginBottom: 6 }}>오늘 예약 현황</div>
            <div className="stat-big">{appts.length}<span style={{ fontSize: 15, fontWeight: 600, color: 'var(--slate)' }}> 건</span></div>
            <div style={{ marginTop: 12 }}>
              {Object.keys(STATUS_COLOR).map(s => (
                <div className="stat-row-mini" key={s}>
                  <span><span className="dot" style={{ background: STATUS_COLOR[s] }}></span>{s}</span>
                  <strong>{todayCounts[s] || 0}건</strong>
                </div>
              ))}
            </div>
          </div>

          <div className="card lift">
            <div style={{ fontSize: 13, color: 'var(--slate)', fontWeight: 600, marginBottom: 10 }}>예약대기 큐</div>
            {appts.filter(a => a.status === '예약대기').length === 0 && <div style={{ fontSize: 13, color: 'var(--slate)' }}>대기 중인 예약이 없습니다</div>}
            {appts.filter(a => a.status === '예약대기').map(a => (
              <div key={a.id} className="stat-row-mini" style={{ cursor: 'pointer' }} onClick={() => setApptModal(a)}>
                <span>{a.patient} <span style={{ color: 'var(--slate)' }}>· {TIMES[a.start]}</span></span>
                <Icon name="chevron-right" size={14} style={{ color: 'var(--slate)' }} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PatientScreen({ patients, allCount, query, setQuery, onOpenDetail, onNew }) {
  return (
    <div className="content">
      <div className="page-head">
        <div>
          <h1 className="page-title">환자 통합 관리</h1>
          <div className="page-sub">등록 환자 {allCount}명</div>
        </div>
        <button className="btn btn-primary" onClick={onNew}><Icon name="user-plus" size={15} />신규 환자 등록</button>
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div className="search-box" style={{ width: '100%', background: 'var(--paper)' }}>
          <Icon name="search" size={15} />
          <input placeholder="이름 또는 연락처로 검색" value={query} onChange={e => setQuery(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <table className="table">
          <thead>
            <tr><th>이름</th><th>연락처</th><th>생년월일</th><th>최근 내원일</th><th>상태</th></tr>
          </thead>
          <tbody>
            {patients.map(p => (
              <tr key={p.id} className="clickable" onClick={() => onOpenDetail(p)}>
                <td style={{ fontWeight: 700 }}>{p.name}</td>
                <td>{p.phone}</td>
                <td>{p.birth}</td>
                <td>{p.lastVisit}</td>
                <td><Badge text={p.status} color={p.status === '활성' ? '#3ad98a' : '#9ca3af'} textColor={p.status === '활성' ? '#0b3b23' : '#4b5563'} /></td>
              </tr>
            ))}
            {patients.length === 0 && <tr><td colSpan="5" style={{ textAlign: 'center', color: 'var(--slate)', padding: 24 }}>검색 결과가 없습니다</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PaymentScreen({ payments, filter, setFilter, selected, onToggle, onOpenDetail, onNew, onBulk, totalUnpaid }) {
  const chartData = WEEKLY_REVENUE;
  return (
    <div className="content">
      <div className="page-head">
        <div>
          <h1 className="page-title">수납·미수금 관리</h1>
          <div className="page-sub">진료 항목별 수납 내역 및 미수금 현황</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn btn-ghost" disabled={selected.length === 0} onClick={onBulk}><Icon name="layers" size={14} />일괄 수납 처리 ({selected.length})</button>
          <button className="btn btn-primary" onClick={onNew}><Icon name="plus" size={15} />수납 등록</button>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, marginBottom: 18 }}>
        <div className="card lift">
          <div style={{ fontSize: 13, color: 'var(--slate)', fontWeight: 600, marginBottom: 4 }}>이번 주 수납 현황(만원)</div>
          <div style={{ height: 160, position: 'relative' }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e5e7eb" />
                <XAxis dataKey="day" tick={{ fontSize: 12, fill: '#6b7280' }} axisLine={false} tickLine={false} />
                <YAxis hide />
                <Tooltip />
                <Bar dataKey="amount" fill="#3ad98a" radius={[6, 6, 0, 0]} className="bar-col" />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="card lift">
          <div style={{ fontSize: 13, color: 'var(--slate)', fontWeight: 600, marginBottom: 8 }}>미수금 총액</div>
          <div className="stat-big" style={{ color: '#ef4444' }}>{totalUnpaid.toLocaleString()}<span style={{ fontSize: 15, color: 'var(--slate)', fontWeight: 600 }}>원</span></div>
          <div style={{ marginTop: 16 }}>
            {['전체', '미수금', '부분수납', '완료'].map(f => (
              <button key={f} className={"chip" + (filter === f ? ' active' : '')} style={{ marginRight: 8, marginBottom: 8 }} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="card">
        <table className="table">
          <thead>
            <tr><th style={{ width: 30 }}></th><th>환자명</th><th>진료 항목</th><th>청구액</th><th>수납액</th><th>상태</th><th>등록일</th></tr>
          </thead>
          <tbody>
            {payments.map(p => (
              <tr key={p.id} className="clickable">
                <td onClick={e => e.stopPropagation()}>
                  {p.status !== '완료' && <input type="checkbox" checked={selected.includes(p.id)} onChange={() => onToggle(p.id)} />}
                </td>
                <td style={{ fontWeight: 700 }} onClick={() => onOpenDetail(p)}>{p.patient}</td>
                <td onClick={() => onOpenDetail(p)}>{p.item}</td>
                <td onClick={() => onOpenDetail(p)}>{p.amount.toLocaleString()}원</td>
                <td onClick={() => onOpenDetail(p)}>{p.paid.toLocaleString()}원</td>
                <td onClick={() => onOpenDetail(p)}>
                  <Badge text={p.status} color={p.status === '완료' ? '#3ad98a' : p.status === '부분수납' ? '#f5a623' : '#ef4444'}
                    textColor={p.status === '완료' ? '#0b3b23' : p.status === '부분수납' ? '#7a5200' : '#ffffff'} />
                </td>
                <td onClick={() => onOpenDetail(p)}>{p.date}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function NotifyScreen({ queue, filter, setFilter, onEditTemplate, onSend, sendingId }) {
  return (
    <div className="content">
      <div className="page-head">
        <div>
          <h1 className="page-title">SMS·알림톡 자동 발송</h1>
          <div className="page-sub">예약 리마인드와 정기검진 리콜 메시지를 채널별로 관리합니다</div>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 20 }}>
        {NOTIFY_TEMPLATES.map(t => (
          <div className="card lift" key={t.id}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{t.title}</div>
                <div style={{ fontSize: 12, color: 'var(--slate)', marginTop: 2 }}>{t.channel}</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => onEditTemplate(t)}><Icon name="pencil" size={13} />편집</button>
            </div>
            <div style={{ fontSize: 13, color: 'var(--graphite)', marginTop: 10, lineHeight: 1.5, background: 'var(--paper)', padding: 12, borderRadius: 10 }}>{t.body}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14, flexWrap: 'wrap', gap: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>발송 큐</div>
          <div>
            {['전체', '예약 리마인드', '정기검진 리콜'].map(f => (
              <button key={f} className={"chip" + (filter === f ? ' active' : '')} style={{ marginLeft: 8 }} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
        </div>
        <table className="table">
          <thead><tr><th>수신자</th><th>구분</th><th>채널</th><th>예정시각</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {queue.map(q => (
              <tr key={q.id}>
                <td style={{ fontWeight: 700 }}>{q.patient}</td>
                <td>{q.kind}</td>
                <td><Badge text={q.channel} color="#0099ff" /></td>
                <td>{q.scheduled}</td>
                <td>
                  <Badge text={sendingId === q.id ? '발송 중...' : q.status}
                    color={q.status === '발송완료' ? '#3ad98a' : q.status === '실패' ? '#ef4444' : '#f5a623'}
                    textColor={q.status === '발송완료' ? '#0b3b23' : q.status === '실패' ? '#ffffff' : '#7a5200'} />
                </td>
                <td>
                  {q.status !== '발송완료' && (
                    <button className="btn btn-ghost btn-sm" disabled={sendingId === q.id} onClick={() => onSend(q.id)}>
                      {q.status === '실패' ? '재시도' : '지금 발송'}
                    </button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
