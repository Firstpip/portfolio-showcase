<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덴탈플로우 BI — 멀티 지점 치과 CRM 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --canvas:#303236;
  --void:#090a0c;
  --card:#111111;
  --edge:#4a4b50;
  --iron:#6b6c6d;
  --smoke:#95979e;
  --ash:#a9a9aa;
  --iris:#5683da;
  --ember:#ff8964;
  --white:#ffffff;
  --danger:#ff6b6b;
  --amber:#ffc46b;
  --radius-card:20px;
  --radius-pill:9999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--canvas);color:var(--white);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
#root{width:100%;}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:8px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes auroraPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.app-header{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:22px;padding:0 28px;background:rgba(17,17,17,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge);}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-0.02em;flex-shrink:0;}
.brand .logo-mark{width:28px;height:28px;border-radius:9999px;background:linear-gradient(135deg,var(--iris),var(--ember));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.project-switcher{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--edge);border-radius:9999px;padding:7px 14px;font-size:13px;color:var(--white);cursor:pointer;flex-shrink:0;transition:border-color .15s;}
.project-switcher:hover{border-color:var(--iris);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{padding:8px 16px;border-radius:9999px;font-size:14px;font-weight:500;color:var(--smoke);background:transparent;border:none;cursor:pointer;transition:background .15s,color .15s;}
.nav-link:hover{color:var(--white);}
.nav-link.active{background:var(--iris);color:#fff;}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:9999px;border:1px solid var(--edge);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--white);transition:border-color .15s,transform .12s;}
.icon-btn:hover{border-color:var(--iris);}
.icon-btn:active{transform:scale(.94);}
.avatar-circle{width:32px;height:32px;border-radius:9999px;background:linear-gradient(135deg,var(--iris),var(--ember));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;}

.tab-bar{display:flex;align-items:center;gap:6px;padding:14px 28px;overflow-x:auto;border-bottom:1px solid var(--edge);}
.tab{padding:7px 16px;border-radius:9999px;font-size:13px;font-weight:600;color:var(--smoke);background:transparent;border:1px solid var(--edge);cursor:pointer;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--white);}
.tab.active{background:var(--white);color:var(--void);border-color:var(--white);}

.content{max-width:1280px;margin:0 auto;padding:28px;width:100%;animation:fadeInUp .35s ease;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.page-title{font-size:44px;font-weight:700;letter-spacing:-0.03em;margin:0;color:#fff;}
.page-sub{font-size:13.5px;color:var(--smoke);margin-top:6px;}

.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9999px;padding:10px 20px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,opacity .15s;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--iris);color:#fff;}
.btn-primary:hover{opacity:.88;}
.btn-ghost{background:transparent;border:1px solid var(--edge);color:#fff;}
.btn-ghost:hover{border-color:var(--iris);}
.btn-sm{padding:7px 15px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius-card);padding:22px;}
.card.lift{transition:border-color .18s,transform .18s;}
.card.lift:hover{border-color:var(--iris);transform:translateY(-2px);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:9999px;font-size:11.5px;font-weight:700;}

.stat-card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius-card);padding:18px 20px;}
.stat-label{font-size:12px;color:var(--smoke);font-weight:600;margin-bottom:8px;}
.stat-value{font-size:32px;font-weight:800;letter-spacing:-0.02em;color:#fff;line-height:1;}
.stat-delta{font-size:12px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px;}
.stat-delta.up{color:#7ce0a8;}
.stat-delta.down{color:var(--danger);}

.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{text-align:left;color:var(--smoke);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--edge);}
.table td{padding:13px 12px;border-bottom:1px solid var(--edge);color:#fff;}
.table tr.clickable{cursor:pointer;transition:background .12s;}
.table tr.clickable:hover td{background:rgba(86,131,218,.08);}
.table tr:last-child td{border-bottom:none;}

.form-field{margin-bottom:16px;}
.form-field label{display:block;font-size:13px;font-weight:600;color:#fff;margin-bottom:6px;}
.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;color:#fff;background:var(--void);transition:border-color .15s;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--iris);}

.modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.68);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease;padding:20px;}
.modal{background:var(--card);border:1px solid var(--edge);border-radius:22px;padding:28px;width:500px;max-width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:modalPop .22s cubic-bezier(.2,.9,.3,1.2);}
.modal.wide{width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h3{font-size:20px;font-weight:700;margin:0;color:#fff;}
.modal-close{width:32px;height:32px;border-radius:9999px;border:1px solid var(--edge);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--iris);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px rgba(0,0,0,.4);animation:toastIn .28s ease;font-weight:500;}

.chip{padding:6px 14px;border-radius:9999px;font-size:12.5px;border:1px solid var(--edge);background:transparent;cursor:pointer;font-family:inherit;color:var(--smoke);font-weight:500;transition:all .15s;}
.chip.active{background:var(--iris);color:#fff;border-color:var(--iris);}
.chip:hover:not(.active){border-color:var(--iris);color:#fff;}

.hero-viz{position:relative;overflow:hidden;border-radius:30px;border:1px solid var(--edge);background:var(--card);padding:28px;}
.aurora-beam{position:absolute;top:-90px;right:-40px;width:340px;height:440px;background:linear-gradient(180deg,rgba(86,131,218,.65) 0%,rgba(255,137,100,.5) 55%,transparent 100%);filter:blur(46px);animation:auroraPulse 4s ease-in-out infinite;pointer-events:none;}
.sunburst-glow{position:absolute;bottom:-60px;left:-40px;width:260px;height:260px;border-radius:9999px;background:radial-gradient(circle,rgba(255,170,129,.32),transparent 70%);pointer-events:none;}

.branch-card{position:relative;overflow:hidden;background:var(--void);border:1px solid var(--edge);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;}
.branch-card:hover{border-color:var(--iris);transform:translateY(-2px);}
.branch-card::after{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:9999px;background:radial-gradient(circle,var(--glow,rgba(86,131,218,.35)),transparent 70%);pointer-events:none;}

.bar-col{transform-origin:bottom;animation:barGrow .5s ease;}

.risk-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--edge);cursor:pointer;transition:background .12s;}
.risk-row:hover{background:rgba(86,131,218,.06);}
.risk-row:last-child{border-bottom:none;}

.matrix-table td, .matrix-table th{text-align:center;}
.matrix-check{width:18px;height:18px;accent-color:var(--iris);cursor:pointer;}

@media (max-width:960px){
  .global-nav{display:none;}
  .project-switcher span.ps-text{display:none;}
}
@media (max-width:480px){
  .app-header{padding:0 14px;gap:10px;}
  .brand span.brand-text{display:none;}
  .icon-btn:first-of-type{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { BarChart, Bar, AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, Legend } = Recharts;

function Icon({ name, size = 16, style, weight }) {
  return <i className={"ph" + (weight ? "-" + weight : "") + " ph-" + name} style={{ fontSize: size, ...style }}></i>;
}

const BRANCHES = [
  { id: 'gangnam', name: '강남점', revenue: 1820, appts: 142, noshow: 5.2, color: '#5683da' },
  { id: 'pangyo', name: '판교점', revenue: 1340, appts: 108, noshow: 7.8, color: '#ff8964' },
  { id: 'bundang', name: '분당점', revenue: 990, appts: 87, noshow: 4.1, color: '#7ce0a8' },
];

const TREND = [
  { month: '3월', 강남점: 1520, 판교점: 1120, 분당점: 820 },
  { month: '4월', 강남점: 1610, 판교점: 1180, 분당점: 860 },
  { month: '5월', 강남점: 1690, 판교점: 1240, 분당점: 900 },
  { month: '6월', 강남점: 1750, 판교점: 1290, 분당점: 940 },
  { month: '7월', 강남점: 1780, 판교점: 1310, 분당점: 970 },
  { month: '8월', 강남점: 1820, 판교점: 1340, 분당점: 990 },
];

const ITEM_REVENUE = [
  { item: '임플란트', amount: 2140 }, { item: '스케일링', amount: 890 },
  { item: '신경치료', amount: 1420 }, { item: '교정', amount: 1680 },
  { item: '충치치료', amount: 760 }, { item: '보철', amount: 1260 },
];

const RISK_PATIENTS = [
  { id: 1, name: '정하윤', branch: '강남점', noshowCount: 4, score: 82, lastNoshow: '2026.07.28' },
  { id: 2, name: '윤서아', branch: '판교점', noshowCount: 3, score: 71, lastNoshow: '2026.06.15' },
  { id: 3, name: '오세훈', branch: '강남점', noshowCount: 3, score: 66, lastNoshow: '2026.07.02' },
  { id: 4, name: '배지훈', branch: '분당점', noshowCount: 2, score: 54, lastNoshow: '2026.05.30' },
  { id: 5, name: '남궁민', branch: '판교점', noshowCount: 2, score: 49, lastNoshow: '2026.06.22' },
  { id: 6, name: '심유나', branch: '강남점', noshowCount: 2, score: 45, lastNoshow: '2026.04.11' },
];

const ROLES = ['본원 관리자', '지점 관리자', '데스크 직원'];
const RESOURCES = ['예약 스케줄러', '환자 정보', '수납/미수금', '통계·BI', '권한 설정'];
const DEFAULT_MATRIX = {
  '본원 관리자': [true, true, true, true, true],
  '지점 관리자': [true, true, true, true, false],
  '데스크 직원': [true, true, true, false, false],
};

function Icon2Row({ label, value }) {
  return (
    <div style={{ marginBottom: 10, minWidth: 130 }}>
      <div style={{ fontSize: 12, color: 'var(--smoke)', marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 14, fontWeight: 700 }}>{value}</div>
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={"modal" + (wide ? " wide" : "")} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ToastStack({ toasts }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => <div className="toast" key={t.id}><Icon name="check-circle" />{t.msg}</div>)}
    </div>
  );
}

function Badge({ text, color }) {
  return <span className="badge" style={{ background: color + '26', color }}>{text}</span>;
}

function App() {
  const [screen, setScreen] = useState('main');
  const [branchFilter, setBranchFilter] = useState('전체 지점');
  const [periodTab, setPeriodTab] = useState('월간');
  const [riskTab, setRiskTab] = useState('전체');
  const [settingsTab, setSettingsTab] = useState('권한 관리');

  const [toasts, setToasts] = useState([]);
  const pushToast = (msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };

  const [branchDetail, setBranchDetail] = useState(null);
  const [drillItem, setDrillItem] = useState(null);
  const [riskDetail, setRiskDetail] = useState(null);
  const [weightModal, setWeightModal] = useState(false);
  const [matrix, setMatrix] = useState(DEFAULT_MATRIX);
  const [branchSettingsSaved, setBranchSettingsSaved] = useState(false);

  const filteredBranches = branchFilter === '전체 지점' ? BRANCHES : BRANCHES.filter(b => b.name === branchFilter);
  const totalRevenue = filteredBranches.reduce((s, b) => s + b.revenue, 0);
  const totalAppts = filteredBranches.reduce((s, b) => s + b.appts, 0);
  const avgNoshow = (filteredBranches.reduce((s, b) => s + b.noshow, 0) / filteredBranches.length).toFixed(1);
  const totalUnpaid = 486;

  const riskFiltered = useMemo(() => {
    if (riskTab === '전체') return RISK_PATIENTS;
    if (riskTab === '고위험') return RISK_PATIENTS.filter(p => p.score >= 70);
    if (riskTab === '중위험') return RISK_PATIENTS.filter(p => p.score >= 50 && p.score < 70);
    return RISK_PATIENTS.filter(p => p.score < 50);
  }, [riskTab]);

  function toggleMatrix(role, idx) {
    setMatrix(m => {
      const next = { ...m, [role]: [...m[role]] };
      next[role][idx] = !next[role][idx];
      return next;
    });
    pushToast(role + '의 권한이 변경되었습니다');
  }

  function addToPriorityQueue(name) {
    pushToast(name + '님이 우선 리마인드 발송 큐에 추가되었습니다');
    setRiskDetail(null);
  }

  const GLOBAL_NAV = [
    { key: 'main', label: '다지점 통합 운영 대시보드' },
    { key: 'analytics', label: '매출·예약 심화 통계 및 BI' },
    { key: 'risk', label: '노쇼 리스크 스코어링' },
    { key: 'settings', label: '다지점 권한·환경설정 관리' },
  ];

  return (
    <div data-archetype="topbar-analytics">
      <header className="app-header">
        <div className="brand">
          <div className="logo-mark"><Icon name="chart-line-up" size={15} /></div>
          <span className="brand-text">덴탈플로우 BI</span>
        </div>
        <div className="project-switcher">
          <Icon name="buildings" size={14} />
          <span className="ps-text">본원 통합 관제</span>
          <Icon name="caret-down" size={12} />
        </div>
        <nav className="global-nav">
          {GLOBAL_NAV.map(n => (
            <button key={n.key} className={"nav-link" + (screen === n.key ? ' active' : '')} onClick={() => setScreen(n.key)}>{n.label}</button>
          ))}
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => pushToast('검색 기능은 데스크 전용 화면에서 제공됩니다')}><Icon name="magnifying-glass" /></button>
          <button className="icon-btn" onClick={() => pushToast('새 알림이 없습니다')}><Icon name="bell" /></button>
          <div className="avatar-circle" onClick={() => setScreen('settings')}>관리</div>
        </div>
      </header>

      {screen === 'main' && (
        <nav className="tab-bar">
          {['전체 지점', '강남점', '판교점', '분당점'].map(f => (
            <button key={f} className={"tab" + (branchFilter === f ? ' active' : '')} onClick={() => setBranchFilter(f)}>{f}</button>
          ))}
        </nav>
      )}
      {screen === 'analytics' && (
        <nav className="tab-bar">
          {['주간', '월간', '분기'].map(f => (
            <button key={f} className={"tab" + (periodTab === f ? ' active' : '')} onClick={() => setPeriodTab(f)}>{f}</button>
          ))}
        </nav>
      )}
      {screen === 'risk' && (
        <nav className="tab-bar">
          {['전체', '고위험', '중위험', '저위험'].map(f => (
            <button key={f} className={"tab" + (riskTab === f ? ' active' : '')} onClick={() => setRiskTab(f)}>{f}</button>
          ))}
        </nav>
      )}
      {screen === 'settings' && (
        <nav className="tab-bar">
          {['권한 관리', '지점 설정', 'SMS 템플릿'].map(f => (
            <button key={f} className={"tab" + (settingsTab === f ? ' active' : '')} onClick={() => setSettingsTab(f)}>{f}</button>
          ))}
        </nav>
      )}

      {screen === 'main' && (
        <MainScreen branches={filteredBranches} totalRevenue={totalRevenue} totalAppts={totalAppts} avgNoshow={avgNoshow} totalUnpaid={totalUnpaid} onOpenBranch={setBranchDetail} />
      )}
      {screen === 'analytics' && (
        <AnalyticsScreen period={periodTab} onDrill={setDrillItem} />
      )}
      {screen === 'risk' && (
        <RiskScreen patients={riskFiltered} onOpenDetail={setRiskDetail} onOpenWeights={() => setWeightModal(true)} />
      )}
      {screen === 'settings' && (
        <SettingsScreen tab={settingsTab} matrix={matrix} onToggle={toggleMatrix} onSaveBranch={() => { setBranchSettingsSaved(true); pushToast('지점 설정이 저장되었습니다'); }} onSaveTemplate={() => pushToast('SMS 템플릿이 저장되었습니다')} />
      )}

      {branchDetail && (
        <Modal title={branchDetail.name + ' 상세'} onClose={() => setBranchDetail(null)}>
          <Icon2Row label="이번 달 매출" value={branchDetail.revenue.toLocaleString() + '만원'} />
          <Icon2Row label="이번 달 예약 건수" value={branchDetail.appts + '건'} />
          <Icon2Row label="노쇼율" value={branchDetail.noshow + '%'} />
          <div style={{ marginTop: 8 }}>
            <button className="btn btn-primary" onClick={() => { setBranchFilter(branchDetail.name); setBranchDetail(null); }}>이 지점만 보기</button>
          </div>
        </Modal>
      )}

      {drillItem && (
        <Modal title={drillItem.item + ' 매출 상세'} onClose={() => setDrillItem(null)}>
          <Icon2Row label="진료 항목" value={drillItem.item} />

}

function RiskRing({ score }) {
  const r = 30, c = 2 * Math.PI * r;
  const offset = c - (c * score) / 100;
  const color = score >= 70 ? '#ff6b6b' : score >= 50 ? '#ffc46b' : '#7ce0a8';
  return (
    <svg width="76" height="76" viewBox="0 0 76 76" style={{ flexShrink: 0 }}>
      <circle cx="38" cy="38" r={r} fill="none" stroke="var(--edge)" strokeWidth="7" />
      <circle cx="38" cy="38" r={r} fill="none" stroke={color} strokeWidth="7" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 38 38)"
        style={{ transition: 'stroke-dashoffset .6s ease' }} />
    </svg>
  );
}
