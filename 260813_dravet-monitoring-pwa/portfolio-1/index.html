<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어로그 — 보호자 발작·복약 기록 앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<style>
  :root{
    --primary:#0061ef;
    --secondary:#e2ded9;
    --accent:#ffce00;
    --bg:#f9f4f2;
    --surface:#ffffff;
    --text:#2d2c2b;
    --text2:#44423f;
    --linen:#e2ded9;
    --ash:#d0d0d0;
    --dark:#2d2c2b;
    --violet:#3b197f;
    --danger:#d94f4f;
    --success:#1f9d55;
    --radius-card:20px;
    --radius-pill:800px;
    --shadow-sticker: rgba(65,61,69,0.2) 0px 2px 0px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    letter-spacing:-0.16px;
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--ash);border-radius:8px;}

  /* ── keyframes ── */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popScale{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
  @keyframes toastSlide{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}

  .page-fade{animation:fadeIn .35s ease both;}
  .stagger{animation:slideUp .45s ease both;}
  .stagger:nth-child(1){animation-delay:.02s;}
  .stagger:nth-child(2){animation-delay:.08s;}
  .stagger:nth-child(3){animation-delay:.14s;}
  .stagger:nth-child(4){animation-delay:.2s;}

  /* ── topbar ── */
  .topbar{
    width:100%;background:var(--surface);border-bottom:1px solid var(--linen);
    position:sticky;top:0;z-index:40;
  }
  .topbar-inner{
    max-width:1200px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-0.5px;}
  .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,206,0,.25);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:40px;height:40px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--linen);font-size:18px;color:var(--text);transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{background:var(--linen);transform:translateY(-1px);}
  .profile-btn{
    display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:var(--radius-pill);
    background:var(--bg);border:1px solid var(--linen);font-size:14px;font-weight:600;transition:transform .15s ease;
  }
  .profile-btn:hover{transform:translateY(-1px);}
  .avatar-mini{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--violet));}

  /* ── tab bar ── */
  .tabbar{
    width:100%;background:var(--surface);border-bottom:1px solid var(--linen);
    overflow-x:auto;
  }
  .tabbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:6px;}
  .tab-btn{
    padding:16px 18px;font-size:14px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;
    white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .15s ease;
  }
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
  .tab-btn:hover{color:var(--text);}

  main.app-main{max-width:1200px;margin:0 auto;padding:32px 24px 80px;width:100%;}

  /* ── hero banner ── */
  .hero-banner{
    background:linear-gradient(120deg,#fff7d6 0%, var(--accent) 55%, #ffdf66 100%);
    border-radius:28px;padding:36px 40px;margin-bottom:28px;position:relative;overflow:hidden;
  }
  .hero-banner::after{
    content:'';position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(59,25,127,.18), transparent 70%);
  }
  .hero-title{font-size:32px;font-weight:700;letter-spacing:-0.8px;line-height:1.3;color:var(--text);max-width:560px;position:relative;}
  .hero-sub{font-size:15px;color:var(--text2);margin-top:10px;max-width:520px;position:relative;line-height:1.55;}
  .hero-cta{
    margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:var(--dark);color:#fff;
    padding:13px 26px;border-radius:var(--radius-pill);font-weight:700;font-size:15px;box-shadow:var(--shadow-sticker);
    position:relative;transition:transform .15s ease;
  }
  .hero-cta:hover{transform:translateY(-2px);}

  /* ── composition: calendar + slot-side ── */
  .composition{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start;}
  @media(max-width:900px){.composition{grid-template-columns:1fr;}}

  .panel{
    background:var(--surface);border:1px solid var(--linen);border-radius:var(--radius-card);padding:28px;
  }
  .panel-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:20px;}
  .panel-title{font-size:18px;font-weight:700;letter-spacing:-0.4px;display:flex;align-items:center;gap:8px;}
  .panel-title i{color:var(--primary);}

  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .cal-nav button:hover{background:var(--linen);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--text2);font-weight:600;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:var(--text);background:var(--bg);position:relative;transition:transform .12s ease, background .12s ease;
    border:1px solid transparent;
  }
  .cal-cell:hover{transform:translateY(-2px);background:#fff;border-color:var(--linen);}
  .cal-cell.empty{background:transparent;}
  .cal-cell.today{border-color:var(--primary);}
  .cal-cell.selected{background:var(--primary);color:#fff;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px;}
  .cal-cell.selected .cal-dot{background:#fff;}

  .slot-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .slot-item{
    display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bg);
    border:1px solid var(--linen);transition:transform .15s ease;
  }
  .slot-item:hover{transform:translateX(2px);}
  .slot-date{
    width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--linen);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  }
  .slot-date b{font-size:15px;line-height:1;}
  .slot-date span{font-size:10px;color:var(--text2);}
  .slot-info b{font-size:14px;display:block;}
  .slot-info span{font-size:12px;color:var(--text2);}
  .badge{
    padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;
  }
  .badge.echo{background:#e6f0ff;color:var(--primary);}
  .badge.outpatient{background:#fff2cc;color:#8a6d00;}
  .badge.etc{background:var(--secondary);color:var(--text2);}

  .summary-card{
    background:var(--bg);border:1px solid var(--linen);border-radius:16px;padding:16px 18px;margin-top:12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .summary-card .label{font-size:12px;color:var(--text2);}
  .summary-card .value{font-size:20px;font-weight:700;margin-top:2px;}

  .btn-primary{
    background:var(--primary);color:#fff;padding:12px 24px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;
    display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,97,239,.28);}
  .btn-dark{
    background:var(--dark);color:#fff;padding:12px 22px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;
    box-shadow:var(--shadow-sticker);display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease;
  }
  .btn-dark:hover{transform:translateY(-2px);}
  .btn-ghost{
    background:#fff;border:1px solid var(--linen);color:var(--text);padding:11px 20px;border-radius:var(--radius-pill);
    font-weight:600;font-size:14px;transition:background .15s ease;
  }
  .btn-ghost:hover{background:var(--bg);}
  .btn-ghost.active{background:var(--dark);color:#fff;border-color:var(--dark);}

  .section-title{font-size:24px;font-weight:700;letter-spacing:-0.6px;margin-bottom:6px;}
  .section-desc{font-size:14px;color:var(--text2);margin-bottom:24px;}

  .card{background:var(--surface);border:1px solid var(--linen);border-radius:var(--radius-card);padding:26px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  /* score checklist */
  .score-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--linen);}
  .score-row:last-child{border-bottom:none;}
  .score-label{font-size:14px;font-weight:600;}
  .score-desc{font-size:12px;color:var(--text2);margin-top:2px;}
  .score-opts{display:flex;gap:6px;}
  .score-opt{
    width:36px;height:36px;border-radius:50%;border:1.5px solid var(--linen);background:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;color:var(--text2);
  }
  .score-opt.on{background:var(--primary);border-color:var(--primary);color:#fff;transform:scale(1.08);}
  .score-opt:hover{border-color:var(--primary);}

  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text2);}
  .form-field textarea, .form-field select, .form-field input{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ash);font-size:14px;background:#fff;color:var(--text);
  }
  .form-field textarea{min-height:88px;resize:vertical;font-family:inherit;}
  .form-field textarea:focus, .form-field select:focus, .form-field input:focus{outline:2px solid var(--primary);outline-offset:1px;}

  .timeline{display:flex;flex-direction:column;gap:0;margin-top:8px;}
  .tl-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--linen);}
  .tl-item:last-child{border-bottom:none;}
  .tl-dot-wrap{display:flex;flex-direction:column;align-items:center;}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:4px;}
  .tl-line{flex:1;width:1px;background:var(--linen);margin-top:4px;}
  .tl-body b{font-size:14px;}
  .tl-body p{font-size:13px;color:var(--text2);margin:4px 0 0;line-height:1.5;}
  .tl-meta{font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:8px;align-items:center;}

  .chip{
    padding:9px 16px;border-radius:var(--radius-pill);border:1px solid var(--linen);background:#fff;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .chip:hover{border-color:var(--primary);color:var(--primary);}
  .chip.fav i{color:var(--accent);}

  .med-item{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--bg);
    border:1px solid var(--linen);margin-bottom:10px;
  }
  .med-item .name{font-size:14px;font-weight:700;}
  .med-item .dose{font-size:12px;color:var(--text2);}
  .med-badge{padding:5px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .med-badge.taken{background:#e5f6ea;color:var(--success);}
  .med-badge.missed{background:#fdecec;color:var(--danger);}

  .chart-wrap{position:relative;height:220px;margin-top:6px;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(45,44,43,.45);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:24px;padding:32px;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;
    animation:popScale .22s ease both;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .modal-head h3{font-size:19px;font-weight:700;}
  .modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn-primary, .modal-actions .btn-ghost{flex:1;justify-content:center;}

  /* toast */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
    padding:14px 26px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:200;
    display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.25);
    animation:toastSlide .3s ease both;
  }
  .toast i{color:var(--accent);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text2);}
  .empty-state i{font-size:38px;color:var(--linen);}
  .empty-state p{font-size:13px;margin-top:10px;}

  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulseDot 1.8s ease infinite;display:inline-block;}

  .profile-card{display:flex;gap:16px;align-items:center;padding:20px;border-radius:18px;background:var(--bg);border:1px solid var(--linen);}
  .profile-card .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--violet));flex-shrink:0;}
  .profile-card b{font-size:16px;display:block;}
  .profile-card span{font-size:13px;color:var(--text2);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--linen);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--linen);position:relative;transition:background .2s ease;}
  .toggle.on{background:var(--primary);}
  .toggle-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .toggle.on .toggle-knob{transform:translateX(18px);}

  .consent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .consent-item{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--linen);font-size:13px;font-weight:600;}
  .consent-item i{color:var(--success);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect} = React;
const {LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

/* ── mock data ── */
const EF_ITEMS = [
  {id:'plan', label:'계획 세우기', desc:'다음 행동을 스스로 순서대로 계획할 수 있는지'},

  {week:'7/21', 계획:2,작업전환:2,충동조절:2,감정조절:2,지시따르기:2},
  {week:'7/28', 계획:2,작업전환:2,충동조절:1,감정조절:2,지시따르기:2},
  {week:'8/4', 계획:3,작업전환:2,충동조절:2,감정조절:2,지시따르기:3},
  {week:'8/11', 계획:3,작업전환:3,충동조절:2,감정조절:2,지시따르기:3},
];

const INIT_APPTS = [
  {id:1, day:16, type:'echo', label:'뇌파 검사(Echo)', time:'09:30', memo:'금식 4시간 필요'},
  {id:2, day:19, type:'outpatient', label:'신경과 외래', time:'14:00', memo:'복약 조정 상담'},
  {id:3, day:25, type:'etc', label:'재활치료 상담', time:'11:00', memo:''},
];

const INIT_SEIZURES = [
  {id:1, date:'2026.08.10', count:'1회', desc:'좌측 팔 경련, 약 40초 지속. 의식 유지됨.'},
  {id:2, date:'2026.08.06', count:'0회', desc:'특이 발작 없음. 컨디션 양호.'},
  {id:3, date:'2026.08.01', count:'2회', desc:'아침 기상 직후 짧은 경련 2회, 각 10초 내외.'},
];

const INIT_MEDS = [
  {id:1, date:'2026.08.13', name:'클로바잠', dose:'0.5mg · 아침', taken:true},
  {id:2, date:'2026.08.13', name:'발프로산', dose:'200mg · 저녁', taken:true},
  {id:3, date:'2026.08.12', name:'클로바잠', dose:'0.5mg · 아침', taken:false},
  {id:4, date:'2026.08.12', name:'발프로산', dose:'200mg · 저녁', taken:true},
];
const FAV_MEDS = ['클로바잠 0.5mg', '발프로산 200mg', '스티리펜톨 250mg'];

function Toast({msg, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2200); return ()=>clearTimeout(t); },[]);
  return (
    <div className="toast">
      <i className="ph-fill ph-check-circle"></i>{msg}
    </div>
  );
}

function Modal({title, onClose, children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function CalendarPanel({appts, onAdd}){
  const [monthLabel] = useState('2026년 8월');
  const [selectedDay, setSelectedDay] = useState(16);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({day:16, type:'echo', label:'', time:'', memo:''});

  const firstDow = 6; // 2026-08-01 is Saturday
  const daysInMonth = 31;
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  const apptDays = new Set(appts.map(a=>a.day));
  const dayAppts = appts.filter(a=>a.day===selectedDay);

  const submit = () => {
    if(!form.label.trim() || !form.time.trim()) return;
    onAdd({id:Date.now(), day:form.day, type:form.type, label:form.label, time:form.time, memo:form.memo});
    setShowAdd(false);
    setForm({day:selectedDay, type:'echo', label:'', time:'', memo:''});

  return (
    <div className="panel stagger">
      <div className="panel-head">
        <div className="panel-title"><i className="ph ph-calendar-blank"></i>{monthLabel}</div>
        <div className="cal-nav">
          <button onClick={()=>{}}><i className="ph ph-caret-left"></i></button>

          d===null
          ? <div key={i} className="cal-cell empty"></div>
          : <div key={i}
              className={`cal-cell ${d===16?'today':''} ${d===selectedDay?'selected':''}`}
              onClick={()=>setSelectedDay(d)}>
              {d}
              {apptDays.has(d) && <span className="cal-dot"></span>}
            </div>
        ))}
      </div>
      <div style={{marginTop:'20px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>

          <div key={a.id} className="slot-item">
            <div className="slot-date"><b>{a.day}</b><span>AUG</span></div>
            <div className="slot-info" style={{flex:1}}>
              <b>{a.label}</b>
              <span>{a.time}{a.memo?` · ${a.memo}`:''}</span>
            </div>
            <span className={`badge ${a.type}`}>{a.type==='echo'?'검사':a.type==='outpatient'?'외래':'기타'}</span>
          </div>
        ))}

      {showAdd && (
        <Modal title="병원 일정 등록" onClose={()=>setShowAdd(false)}>
          <div className="form-field">
            <label>일정 종류</label>
            <select value={form.type} onChange={e=>setForm({...form, type:e.target.value})}>
              <option value="echo">뇌파/Echo 검사</option>
              <option value="outpatient">외래 진료</option>
              <option value="etc">기타</option>
            </select>
          </div>
          <div className="form-field">
            <label>일정명</label>
            <input value={form.label} onChange={e=>setForm({...form, label:e.target.value})} placeholder="예: 신경과 외래" />
          </div>

          </div>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={()=>setShowAdd(false)}>취소</button>
            <button className="btn-primary" onClick={submit}>등록하기</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function MedicationScreen({meds, setMeds, onSave}){
  const [name, setName] = useState('');
  const [dose, setDose] = useState('');
  const [time, setTime] = useState('아침');

  const grouped = useMemo(()=>{
    const g = {};
    meds.forEach(m=>{ (g[m.date] ||= []).push(m); });
    return Object.entries(g);
  },[meds]);

  const quickAdd = (label) => {
    const [n, d] = label.split(' ');
    setName(n); setDose(d);
  };

  const submit = () => {
    if(!name.trim() || !dose.trim()) return;
    setMeds([{id:Date.now(), date:'2026.08.13', name, dose:`${dose} · ${time}`, taken:true}, ...meds]);
    setName(''); setDose('');
    onSave('복약 기록이 저장되었습니다');
  };

  const toggleTaken = (id) => {
    setMeds(meds.map(m=>m.id===id?{...m, taken:!m.taken}:m));
  };

  return (
    <div className="page-fade">
      <div className="section-title">복약 기록 관리</div>
      <div className="section-desc">복용 중인 약물 정보를 기록하고 복약 이력을 날짜별로 관리합니다.</div>

            {FAV_MEDS.map(f=>(
              <button key={f} className="chip fav" onClick={()=>quickAdd(f)}><i className="ph-fill ph-star"></i>{f}</button>
            ))}
          </div>
          <div className="form-field">
            <label>약물명</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="예: 클로바잠" />

          <div className="form-field">
            <label>용량</label>
            <input value={dose} onChange={e=>setDose(e.target.value)} placeholder="예: 0.5mg" />
          </div>
          <div className="form-field">
            <label>복용 시간대</label>
            <select value={time} onChange={e=>setTime(e.target.value)}>
              <option>아침</option><option>점심</option><option>저녁</option><option>취침 전</option>
            </select>

          <div className="panel-title" style={{marginBottom:'14px'}}><i className="ph ph-list-checks"></i>복약 이력</div>

            <div key={date} style={{marginBottom:'16px'}}>
              <div style={{fontSize:'12px', fontWeight:700, color:'var(--text2)', marginBottom:'8px'}}>{date}</div>
              {items.map(m=>(
                <div className="med-item" key={m.id}>
                  <div>
                    <div className="name">{m.name}</div>
                    <div className="dose">{m.dose}</div>
                  </div>
                  <button className={`med-badge ${m.taken?'taken':'missed'}`} onClick={()=>toggleTaken(m.id)}>

      )}
    </div>
  );
}

const TABS = [
  {id:'main', label:'병원 일정 관리', icon:'ph-calendar-heart'},
  {id:'executive-function', label:'실행기능 체크 기록', icon:'ph-brain'},
  {id:'seizure', label:'발작 기록 및 이력 관리', icon:'ph-activity'},
  {id:'medication', label:'복약 기록 관리', icon:'ph-pill'},
];

function App(){
  const [tab, setTab] = useState('main');
  const [showProfile, setShowProfile] = useState(false);
  const [appts, setAppts] = useState(INIT_APPTS);
  const [seizures, setSeizures] = useState(INIT_SEIZURES);
  const [meds, setMeds] = useState(INIT_MEDS);
  const [toast, setToast] = useState(null);

  const notify = (msg) => setToast(msg);

  const go = (id) => { setTab(id); setShowProfile(false); window.scrollTo({top:0, behavior:'smooth'}); };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand"><span className="brand-dot"></span>케어로그</div>
          <div className="topbar-actions">
            <div className="icon-btn"><span className="live-dot"></span></div>
            <button className="profile-btn" onClick={()=>go('profile')}>
              <span className="avatar-mini"></span>마이페이지
            </button>
          </div>
        </div>
      </header>
      <nav className="tabbar">
        <div className="tabbar-inner">
          {TABS.map(t=>(
            <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>go(t.id)}>
              <i className={`ph ${t.icon}`}></i>{t.label}
            </button>
          ))}
        </div>
      </nav>
      <main className="app-main" style={{flex:1, width:'100%'}}>
        {tab==='main' && <HomeScreen appts={appts} setAppts={setAppts} seizures={seizures} meds={meds} />}
        {tab==='executive-function' && <ExecutiveFunctionScreen onSave={notify} />}
        {tab==='seizure' && <SeizureScreen seizures={seizures} setSeizures={setSeizures} onSave={notify} />}
        {tab==='medication' && <MedicationScreen meds={meds} setMeds={setMeds} onSave={notify} />}
        {tab==='profile' && <ProfileScreen />}
      </main>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
