<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어로그 HCP 콘솔 — 통합 모니터링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<style>
  :root{
    --primary:#da56ce;
    --secondary:#d1d1d1;
    --accent:#97ff64;
    --bg:#ffffff;
    --surface:#e5e5e7;
    --text:#090a0c;
    --text2:#95979e;
    --border:#e2e2e5;
    --card:#ffffff;
    --danger:#e5484d;
    --warn:#d68f00;
    --success:#1a9e5c;
    --radius-card:12px;
    --radius-pill:9999px;
    --shadow-sm: rgba(0,0,0,0.08) 0px 1px 3px 0px;
    --shadow-md: rgba(9,10,12,0.14) 0px 4px 16px 0px;
    --shadow-xl: rgba(9,10,12,0.22) 0px 12px 32px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:#fafafb;
    color:var(--text);
    letter-spacing:-0.14px;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  #app-root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}
  table{border-collapse:collapse;width:100%;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes toastSlide{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes rowFade{from{opacity:0;}to{opacity:1;}}

  .page-fade{animation:fadeIn .3s ease both;}
  .stagger{animation:slideUp .4s ease both;}
  .stagger:nth-child(1){animation-delay:.01s;}
  .stagger:nth-child(2){animation-delay:.05s;}
  .stagger:nth-child(3){animation-delay:.09s;}
  .stagger:nth-child(4){animation-delay:.13s;}

  .app-shell{display:flex;width:100%;min-height:100vh;}

  /* ── sidebar (stripe-multipane signature) ── */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:240px;background:#111114;color:#fff;
    display:flex;flex-direction:column;padding:20px 0;z-index:50;
  }
  .sidebar-brand{padding:0 20px 18px;border-bottom:1px solid #2a2a2f;margin-bottom:14px;}
  .sidebar-brand-top{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;}
  .sidebar-dot{width:11px;height:11px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(218,86,206,.25);}
  .sidebar-env{margin-top:12px;display:flex;align-items:center;gap:7px;font-size:11px;color:#8a8a92;background:#1c1c20;border:1px solid #2a2a2f;border-radius:8px;padding:8px 10px;}
  .sidebar-env .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulseDot 1.8s ease infinite;}
  .sidebar-scroll{flex:1;overflow-y:auto;padding:0 12px;}
  .sidebar-section{margin-bottom:18px;}
  .sidebar-section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6f6f78;padding:0 10px 8px;font-weight:700;}
  .sidebar-link{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:8px;font-size:12.5px;
    color:#c7c7cf;text-align:left;line-height:1.35;transition:background .15s ease, color .15s ease;margin-bottom:2px;
  }
  .sidebar-link svg{flex-shrink:0;}
  .sidebar-link:hover{background:#1c1c20;color:#fff;}
  .sidebar-link.active{background:linear-gradient(90deg, rgba(218,86,206,.22), rgba(151,255,100,.06));color:#fff;box-shadow:inset 2px 0 0 var(--primary);}
  .sidebar-foot{padding:14px 20px 0;border-top:1px solid #2a2a2f;margin-top:10px;}
  .sidebar-user{display:flex;align-items:center;gap:10px;}
  .sidebar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#6b3fa0);flex-shrink:0;}
  .sidebar-user b{font-size:12.5px;display:block;color:#fff;}
  .sidebar-user span{font-size:11px;color:#8a8a92;}

  /* ── main ── */
  .main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:28px 32px 60px;}

  .page-header{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-0.44px;}
  .page-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .page-meta{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulseDot 1.8s ease infinite;display:inline-block;}

  .btn-primary{
    background:var(--primary);color:#fff;padding:10px 18px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(218,86,206,.28);}
  .btn-secondary{
    background:#fff;border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:var(--radius-pill);
    font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .15s ease;
  }
  .btn-secondary:hover{background:#f4f4f5;}
  .btn-danger{background:#fff;border:1px solid #f3c7c9;color:var(--danger);padding:9px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;}

  /* ── stat row (archetype signature) ── */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 20px 16px;
    box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease;
  }
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .stat-label{font-size:11.5px;color:var(--text2);font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .stat-value{font-size:42px;font-weight:700;letter-spacing:-1.6px;margin-top:8px;}
  .display-num{font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1;}
  .stat-delta{font-size:12px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
  .stat-delta.positive{color:var(--success);}
  .stat-delta.negative{color:var(--danger);}
  .stat-sparkline{position:absolute;right:14px;bottom:14px;width:70px;height:28px;}

  /* ── data section ── */
  .data-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-sm);}
  .tab-bar{display:flex;gap:4px;padding:6px 20px 0;border-bottom:1px solid var(--border);}
  .tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;transition:color .15s ease;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .data-toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap;}
  .search{flex:1;min-width:160px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:#fafafa;}
  .search:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .filter-chip{
    padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);}
  .export-btn{
    padding:9px 16px;border-radius:var(--radius-pill);border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;margin-left:auto;
  }
  .export-btn:hover{background:#f4f4f5;}

  .split{display:flex;width:100%;}
  @media(max-width:1000px){.split{flex-direction:column;}}
  .list-rail{flex:1.4;min-width:0;border-right:1px solid var(--border);}
  .detail-panel{flex:1;min-width:0;padding:20px;background:#fcfbfd;}

  .data-table-wrap{overflow-x:auto;}
  .data-table thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);font-weight:700;
    padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .data-table tbody td{padding:0 16px;height:50px;border-bottom:1px solid #f0f0f2;font-size:13px;}
  .data-table tbody tr{cursor:pointer;transition:background .12s ease;animation:rowFade .3s ease both;}
  .data-table tbody tr:hover{background:#faf5fa;}
  .data-table tbody tr.selected{background:#fdf1fc;}
  .pt-name{font-weight:700;display:flex;align-items:center;gap:9px;}
  .pt-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--primary),#6b3fa0);}
  .pt-sub{font-size:11.5px;color:var(--text2);font-weight:400;}

  .badge{padding:4px 11px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .badge.alert{background:#fdecec;color:var(--danger);}
  .badge.stable{background:#e9f8ee;color:var(--success);}
  .badge.watch{background:#fff5e0;color:var(--warn);}
  .badge.role-guardian{background:#eef0ff;color:#4c4fd1;}
  .badge.role-hcp{background:#fdeffb;color:var(--primary);}
  .badge.role-admin{background:#f1f1f3;color:#3a3a40;}

  .adherence-bar{width:70px;height:6px;border-radius:4px;background:#eee;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .adherence-fill{height:100%;background:var(--accent);}

  .dp-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .dp-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#6b3fa0);flex-shrink:0;}
  .dp-head b{font-size:15px;display:block;}
  .dp-head span{font-size:12px;color:var(--text2);}
  .chart-wrap{position:relative;height:170px;margin:14px 0;}
  .dp-mini-list{display:flex;flex-direction:column;gap:8px;}
  .dp-mini-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:12.5px;}
  .dp-mini-item b{font-weight:700;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-sm);}
  .section-title{font-size:20px;font-weight:700;letter-spacing:-0.4px;margin-bottom:4px;}
  .section-desc{font-size:13px;color:var(--text2);margin-bottom:20px;}

  .filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}

  .timeline{display:flex;flex-direction:column;}
  .tl-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f2;}
  .tl-item:last-child{border-bottom:none;}
  .tl-icon{width:32px;height:32px;border-radius:50%;background:#fdf1fc;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--primary);}
  .tl-body b{font-size:13px;}
  .tl-body p{font-size:12.5px;color:var(--text2);margin:3px 0 0;line-height:1.5;}
  .tl-meta{font-size:11px;color:var(--text2);margin-top:5px;}

  .form-field{margin-bottom:15px;}
  .form-field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text2);}
  .form-field input, .form-field select, .form-field textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--secondary);font-size:13px;background:#fff;color:var(--text);
  }
  .form-field textarea{min-height:70px;resize:vertical;font-family:inherit;}
  .form-field input:focus, .form-field select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;animation:popScale .2s ease both;box-shadow:var(--shadow-xl);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-size:16px;font-weight:700;}
  .modal-close{width:28px;height:28px;border-radius:50%;background:#f4f4f5;display:flex;align-items:center;justify-content:center;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn-primary, .modal-actions .btn-secondary{flex:1;justify-content:center;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;
    border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:200;display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 28px rgba(0,0,0,.28);animation:toastSlide .28s ease both;
  }
  .toast svg{color:var(--accent);}

  .threshold-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);gap:16px;}
  .threshold-row:last-of-type{border-bottom:none;}
  .threshold-row .num-input{width:80px;padding:8px 10px;border-radius:8px;border:1px solid var(--secondary);font-size:13px;text-align:center;}
  .toggle{width:40px;height:23px;border-radius:var(--radius-pill);background:var(--secondary);position:relative;transition:background .2s ease;flex-shrink:0;}
  .toggle.on{background:var(--primary);}
  .toggle-knob{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .toggle.on .toggle-knob{transform:translateX(17px);}

  .consent-table td, .consent-table th{padding:10px 14px;}
  .consent-pill{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
  .consent-pill.ok{background:#e9f8ee;color:var(--success);}
  .consent-pill.no{background:#f1f1f3;color:var(--text2);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect} = React;
const {ComposedChart, Line, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

const IconEdit = ({size=18, ...p})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M15 4l5 5-11 11H4v-5L15 4z"/></svg>);
const IconChevron = ({size=18, ...p})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 6l6 6-6 6"/></svg>);

function Sparkline({data, color}){
  const w=68, h=26;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/((max-min)||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

          <button className="btn-secondary" onClick={()=>onSave('감사 로그를 내보냈습니다')}><IconDownload size={14}/>내보내기</button>
        </div>
        <div className="page-meta">4개 카테고리 동의 현황과 3분리 스키마 접근 이력을 함께 검토합니다.</div>
      </div>

      <div className="card stagger" style={{marginBottom:'18px'}}>
        <div style={{fontSize:'14px', fontWeight:700, marginBottom:'12px'}}>환자별 동의 현황</div>
        <div className="data-table-wrap">
          <table className="data-table consent-table">
            <thead><tr><th>환자</th><th>개인정보</th><th>의료정보</th><th>이용약관</th><th>마케팅수신</th></tr></thead>
            <tbody>
              {CONSENT_PATIENTS.map((c,i)=>(
                <tr key={i}>
                  <td><div className="pt-name"><span className="pt-avatar"></span>{c.name}</div></td>
                  <td><span className={`consent-pill ${c.personal?'ok':'no'}`}><IconCheck size={13}/></span></td>
                  <td><span className={`consent-pill ${c.medical?'ok':'no'}`}><IconCheck size={13}/></span></td>
                  <td><span className={`consent-pill ${c.terms?'ok':'no'}`}><IconCheck size={13}/></span></td>
                  <td><span className={`consent-pill ${c.marketing?'ok':'no'}`}>{c.marketing?<IconCheck size={13}/>:<IconX size={13}/>}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card stagger">
        <div style={{fontSize:'14px', fontWeight:700, marginBottom:'12px'}}>민감정보 접근 감사 로그</div>
        <div className="filter-row">
          <select className="search" style={{maxWidth:'180px'}} value={actorFilter} onChange={e=>setActorFilter(e.target.value)}>
            {actors.map(a=><option key={a} value={a}>{a==='all'?'전체 접근자':a}</option>)}
          </select>
          <select className="search" style={{maxWidth:'180px'}} value={patientFilter} onChange={e=>setPatientFilter(e.target.value)}>
            {patients.map(p=><option key={p} value={p}>{p==='all'?'전체 환자':p}</option>)}
          </select>
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>접근자</th><th>대상 환자</th><th>스키마</th><th>접근 시각</th></tr></thead>
            <tbody>
              {filteredLog.map(l=>(
                <tr key={l.id}>
                  <td>{l.actor}</td><td>{l.patient}</td>
                  <td><span className="badge role-hcp">{l.schema}</span></td>
                  <td>{l.time}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function SettingsScreen({onSave}){
  const [seizureThreshold, setSeizureThreshold] = useState(3);
  const [medThreshold, setMedThreshold] = useState(2);
  const [emailOn, setEmailOn] = useState(true);
  const [inAppOn, setInAppOn] = useState(true);
  const [smsOn, setSmsOn] = useState(false);

  return (
    <div className="page-fade">
      <div className="page-header stagger">
        <h1 className="page-title">알림 및 임계값 설정</h1>
        <div className="page-meta">이상 신호 감지 기준과 알림 채널을 설정합니다.</div>
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'18px'}}>
        <div className="card stagger">
          <div style={{fontSize:'14px', fontWeight:700, marginBottom:'6px'}}>이상 신호 임계값</div>
          <div className="threshold-row">
            <div><b style={{fontSize:'13px'}}>발작 빈도 경고 기준</b><div style={{fontSize:'11.5px', color:'var(--text2)'}}>주당 발작 횟수가 이 값 이상이면 이상 신호로 표시</div></div>
            <input type="number" className="num-input" value={seizureThreshold} onChange={e=>setSeizureThreshold(e.target.value)} />
          </div>
          <div className="threshold-row">
            <div><b style={{fontSize:'13px'}}>복약 누락 경고 기준</b><div style={{fontSize:'11.5px', color:'var(--text2)'}}>연속 누락 횟수가 이 값 이상이면 알림 발송</div></div>
            <input type="number" className="num-input" value={medThreshold} onChange={e=>setMedThreshold(e.target.value)} />
          </div>
          <button className="btn-primary" style={{marginTop:'12px'}} onClick={()=>onSave('임계값 설정이 저장되었습니다')}><IconCheck size={14}/>저장</button>
        </div>
        <div className="card stagger">
          <div style={{fontSize:'14px', fontWeight:700, marginBottom:'6px'}}>알림 채널</div>
          <div className="threshold-row">
            <div><b style={{fontSize:'13px'}}>이메일 알림</b><div style={{fontSize:'11.5px', color:'var(--text2)'}}>이상 신호 발생 시 이메일로 발송</div></div>
            <div className={`toggle ${emailOn?'on':''}`} onClick={()=>setEmailOn(!emailOn)}><div className="toggle-knob"></div></div>
          </div>
          <div className="threshold-row">
            <div><b style={{fontSize:'13px'}}>인앱 알림</b><div style={{fontSize:'11.5px', color:'var(--text2)'}}>콘솔 내 알림 배지로 표시</div></div>
            <div className={`toggle ${inAppOn?'on':''}`} onClick={()=>setInAppOn(!inAppOn)}><div className="toggle-knob"></div></div>
          </div>
          <div className="threshold-row">
            <div><b style={{fontSize:'13px'}}>SMS 알림</b><div style={{fontSize:'11.5px', color:'var(--text2)'}}>긴급 이상 신호만 SMS로 발송</div></div>
            <div className={`toggle ${smsOn?'on':''}`} onClick={()=>setSmsOn(!smsOn)}><div className="toggle-knob"></div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

const NAV = [
  {group:'모니터링', items:[
    {id:'main', label:'환자 목록 및 시계열 모니터링 대시보드', icon:<IconGrid size={16}/>},
    {id:'detail', label:'환자별 기록 상세 조회', icon:<IconUser size={16}/>},
  ]},
  {group:'관리', items:[
    {id:'accounts', label:'역할 기반 계정 관리', icon:<IconShield size={16}/>},
    {id:'consent-audit', label:'동의서·민감정보 접근 감사', icon:<IconLock size={16}/>},
    {id:'settings', label:'알림 및 임계값 설정', icon:<IconSettings size={16}/>},
  ]},
];

function App(){
  const [screen, setScreen] = useState('main');
  const [selectedPatient, setSelectedPatient] = useState(PATIENTS[1]);
  const [toast, setToast] = useState(null);
  const notify = (msg) => setToast(msg);

  const go = (id) => { setScreen(id); window.scrollTo({top:0, behavior:'smooth'}); };
  const goDetail = (p) => { setSelectedPatient(p); go('detail'); };

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="sidebar-brand-top"><span className="sidebar-dot"></span>케어로그 콘솔</div>
          <div className="sidebar-env"><span className="dot"></span>서울신경센터 · Production</div>
        </div>
        <div className="sidebar-scroll">
          {NAV.map(g=>(
            <div className="sidebar-section" key={g.group}>
              <div className="sidebar-section-title">{g.group}</div>
              {g.items.map(it=>(
                <button key={it.id} className={`sidebar-link ${screen===it.id?'active':''}`} onClick={()=>go(it.id)}>
                  {it.icon}<span>{it.label}</span>
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          <div className="sidebar-user">
            <div className="sidebar-avatar"></div>
            <div><b>김재현 (Dr.)</b><span>소아신경과 · 의료진</span></div>
          </div>
        </div>
      </aside>
      <div className="main-wrap">
        {screen==='main' && <DashboardScreen onSave={notify} goDetail={goDetail} />}
        {screen==='detail' && <DetailScreen patient={selectedPatient} />}
        {screen==='accounts' && <AccountsScreen onSave={notify} />}
        {screen==='consent-audit' && <ConsentAuditScreen onSave={notify} />}
        {screen==='settings' && <SettingsScreen onSave={notify} />}
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
