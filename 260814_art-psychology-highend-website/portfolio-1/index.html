<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루미나르트 — 예술심리 브랜드 사이트·러닝 플랫폼 (구현 데모)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#17191c;
    --paper:#ffffff;
    --mist:#f2f2f3;
    --fog:#fafafb;
    --slate:#777b86;
    --ash:#979799;
    --smoke:#a3a6af;
    --peach:#fbe1d1;
    --sienna:#5d2a1a;
    --r-card:24px;
    --r-input:16px;
    --r-btn:9999px;
    --r-artifact:20px;
    --shadow-artifact: 0 0 0 1px rgba(4,23,43,.05), 0 20px 25px -5px rgba(0,0,0,.10), 0 8px 10px -6px rgba(0,0,0,.10);
    --shadow-modal: 0 0 0 1px rgba(0,0,0,.05), 0 8px 40px rgba(0,0,0,.12);
    --shadow-pop: 0 0 0 1px rgba(0,0,0,.05), 0 4px 24px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  h1,h2,h3,h4,p,ul{margin:0;padding:0;}
  ul{list-style:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}

  .container{max-width:1200px;margin:0 auto;padding:0 32px;}

  /* ── Navbar ───────────────────────────────── */
  .navbar{position:fixed;top:0;left:0;width:100%;z-index:100;padding:20px 0;transition:background .3s ease,box-shadow .3s ease,padding .3s ease;}
  .navbar.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:var(--shadow-pop);padding:14px 0;}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;}
  .nav-logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;letter-spacing:-.02em;}
  .nav-logo .mark{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ink) 0%,var(--sienna) 100%);display:flex;align-items:center;justify-content:center;}
  .nav-links{display:flex;align-items:center;gap:36px;}
  .nav-link{font-size:16px;color:var(--ink);padding:2px 0;position:relative;}
  .nav-link::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--ink);transition:width .25s ease;}
  .nav-link:hover::after,.nav-link.active::after{width:100%;}
  .nav-link.active{font-weight:500;}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .hamburger{display:none;width:40px;height:40px;align-items:center;justify-content:center;font-size:22px;}

  /* ── Buttons ─────────────────────────────── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:var(--r-btn);font-size:16px;font-weight:400;white-space:nowrap;position:relative;overflow:hidden;transition:transform .2s ease,opacity .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn-filled{background:var(--ink);color:var(--paper);}
  .btn-filled:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn-ghost:hover{background:var(--ink);color:var(--paper);}
  .btn-sm{height:40px;padding:0 18px;font-size:14px;}
  .btn-link{display:inline-flex;align-items:center;gap:6px;padding:20px 0;font-size:16px;color:var(--ink);}
  .btn-link i{transition:transform .2s ease;}
  .btn-link:hover i{transform:translateX(4px);}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none;}
  .btn-ghost .ripple{background:rgba(23,25,28,.15);}

  /* ── Hero ────────────────────────────────── */
  .hero{padding:172px 0 40px;position:relative;overflow:hidden;background:var(--paper);}
  .hero-inner{text-align:center;position:relative;z-index:2;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase;margin-bottom:24px;opacity:0;animation:fadeInUp .7s ease forwards;}
  .hero-title{font-size:clamp(38px,6.4vw,90px);font-weight:400;line-height:1.3;letter-spacing:-2.25px;color:var(--ink);opacity:0;animation:fadeInUp .8s ease .1s forwards;}
  .hero-title em{font-style:italic;color:var(--sienna);}
  .hero-sub{max-width:600px;margin:28px auto 0;font-size:20px;line-height:1.5;color:var(--slate);opacity:0;animation:fadeInUp .8s ease .22s forwards;}
  .hero-actions{display:flex;justify-content:center;gap:12px;margin-top:36px;opacity:0;animation:fadeInUp .8s ease .34s forwards;}

  .hero-artifacts{position:relative;height:380px;margin-top:56px;max-width:1040px;margin-left:auto;margin-right:auto;}
  .artifact-card{position:absolute;background:var(--paper);border-radius:var(--r-artifact);box-shadow:var(--shadow-artifact);padding:18px 20px 14px 14px;animation:floatY 5s ease-in-out infinite,fadeInUp .8s ease forwards;opacity:0;}
  .artifact-1{left:0;top:20px;width:250px;animation-delay:.46s,.46s;}
  .artifact-2{right:20px;top:0;width:210px;animation-delay:.9s,.58s;}
  .artifact-3{left:38%;bottom:0;width:270px;animation-delay:1.3s,.7s;}
  .artifact-label{font-size:13px;color:var(--ash);margin-bottom:8px;}
  .artifact-value{font-size:22px;font-weight:500;color:var(--ink);}
  .artifact-delta{font-size:13px;color:var(--sienna);margin-top:4px;display:flex;align-items:center;gap:4px;}
  .artifact-avatars{display:flex;gap:-8px;margin-top:10px;}
  .mini-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink);margin-left:-8px;border:2px solid var(--paper);}
  .mini-avatar:first-child{margin-left:0;}
  .spark{width:100%;height:36px;margin-top:8px;}

  @media (max-width:860px){
    .hero-artifacts{display:flex;flex-direction:column;gap:16px;height:auto;max-width:340px;}
    .artifact-card{position:static;width:100% !important;}
  }

  /* ── Sections ────────────────────────────── */
  .section{padding:96px 0;}
  .section.bg-fog{background:var(--fog);}
  .section-head{max-width:640px;margin:0 auto 56px;text-align:center;}
  .section-eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);margin-bottom:14px;display:block;}
  .section-title{font-size:clamp(30px,4.4vw,52px);font-weight:400;letter-spacing:-.96px;line-height:1.28;}
  .section-sub{font-size:18px;color:var(--slate);margin-top:16px;line-height:1.55;}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  .features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .feature-card{background:var(--mist);border-radius:var(--r-card);padding:36px 28px;transition:transform .3s ease,box-shadow .3s ease;}
  .feature-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-pop);}
  .feature-card.accent{background:var(--peach);color:var(--sienna);}
  .feature-icon{width:48px;height:48px;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px;}
  .feature-card.accent .feature-icon{background:rgba(255,255,255,.5);color:var(--sienna);}
  .cat-label{font-size:13px;color:var(--ash);margin-bottom:10px;display:block;}
  .feature-card.accent .cat-label{color:var(--sienna);opacity:.7;}
  .feature-card h3{font-size:21px;font-weight:500;margin-bottom:10px;}
  .feature-card p{font-size:16px;line-height:1.6;color:var(--ink);}
  .feature-card.accent p{color:var(--sienna);}

  @media (max-width:860px){.features-grid{grid-template-columns:1fr;}}

  .steps-row{display:flex;justify-content:space-between;gap:32px;position:relative;}
  .steps-row::before{content:'';position:absolute;top:20px;left:60px;right:60px;height:1px;background:var(--mist);}
  .step{flex:1;text-align:center;position:relative;z-index:1;}
  .step-num{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;margin:0 auto 20px;}
  .step h4{font-size:19px;font-weight:500;margin-bottom:8px;}
  .step p{font-size:15px;color:var(--slate);line-height:1.6;}
  @media (max-width:760px){.steps-row{flex-direction:column;gap:40px;}.steps-row::before{display:none;}}

  .experts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .expert-card{text-align:center;padding:28px 20px;border-radius:var(--r-card);border:1px solid var(--mist);transition:box-shadow .3s ease,transform .3s ease;}
  .expert-card:hover{box-shadow:var(--shadow-pop);transform:translateY(-4px);}
  .expert-avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 16px;overflow:hidden;}
  .expert-card h4{font-size:18px;font-weight:500;margin-bottom:4px;}
  .expert-role{font-size:14px;color:var(--slate);margin-bottom:14px;}
  .expert-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .tag{font-size:12px;color:var(--ash);border:1px solid var(--mist);border-radius:var(--r-btn);padding:4px 12px;}
  @media (max-width:860px){.experts-grid{grid-template-columns:1fr;}}

  .faq-list{max-width:760px;margin:0 auto;}
  .faq-item{border-bottom:1px solid var(--mist);}
  .faq-q{display:flex;align-items:center;justify-content:space-between;padding:22px 4px;font-size:17px;font-weight:500;width:100%;text-align:left;}
  .faq-q i{transition:transform .3s ease;font-size:18px;color:var(--slate);}
  .faq-q.open i{transform:rotate(180deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .faq-a.open{max-height:220px;}
  .faq-a-inner{padding:0 4px 22px;font-size:15px;color:var(--slate);line-height:1.7;}

  .cta-foot{background:var(--ink);color:var(--paper);border-radius:32px;margin:0 32px;padding:88px 32px;text-align:center;}
  .cta-foot h2{font-size:clamp(28px,4vw,46px);font-weight:400;letter-spacing:-.5px;}
  .cta-foot p{font-size:17px;color:var(--smoke);margin-top:16px;}
  .cta-foot .hero-actions{margin-top:32px;}
  .cta-foot .btn-ghost{border-color:rgba(255,255,255,.4);color:var(--paper);}
  .cta-foot .btn-ghost:hover{background:var(--paper);color:var(--ink);}
  .cta-foot .btn-filled{background:var(--paper);color:var(--ink);}

  footer{padding:56px 32px 32px;}
  .footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;border-top:1px solid var(--mist);padding-top:32px;}
  .footer-brand{font-size:16px;font-weight:500;margin-bottom:8px;}
  .footer-desc{font-size:13px;color:var(--ash);max-width:280px;line-height:1.6;}
  .footer-links{display:flex;gap:48px;flex-wrap:wrap;}
  .footer-col h5{font-size:13px;color:var(--ash);margin-bottom:12px;}
  .footer-col a,.footer-col button{display:block;font-size:14px;color:var(--slate);margin-bottom:8px;text-align:left;}
  .footer-col a:hover,.footer-col button:hover{color:var(--ink);}
  .copyright{font-size:12px;color:var(--smoke);margin-top:32px;}

  /* ── Page header (inner screens) ─────────── */
  .page-wrap{padding:132px 0 80px;min-height:100vh;}
  .page-header{margin-bottom:40px;}
  .page-header h1{font-size:clamp(30px,4vw,46px);font-weight:400;letter-spacing:-.6px;}
  .page-header p{font-size:16px;color:var(--slate);margin-top:10px;}

  /* ── Tabs ─────────────────────────────────── */
  .tab-bar{display:flex;gap:8px;border-bottom:1px solid var(--mist);margin-bottom:28px;}
  .tab{padding:12px 4px;margin-right:24px;font-size:16px;color:var(--slate);position:relative;font-weight:400;}
  .tab.active{color:var(--ink);font-weight:500;}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px;}

  .filter-row{display:flex;gap:10px;margin-bottom:32px;flex-wrap:wrap;}
  .chip{padding:9px 18px;border-radius:var(--r-btn);border:1px solid var(--mist);font-size:14px;color:var(--slate);transition:all .2s ease;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  @media (max-width:960px){.course-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.course-grid{grid-template-columns:1fr;}}
  .course-card{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--mist);transition:box-shadow .3s ease,transform .3s ease;background:var(--paper);}
  .course-card:hover{box-shadow:var(--shadow-pop);transform:translateY(-4px);}
  .course-thumb{width:100%;height:160px;object-fit:cover;filter:saturate(.82);}
  .course-body{padding:20px;}
  .course-badge{display:inline-block;font-size:11px;padding:4px 10px;border-radius:var(--r-btn);background:var(--mist);color:var(--slate);margin-bottom:12px;}
  .course-body h3{font-size:17px;font-weight:500;margin-bottom:8px;}
  .course-body p{font-size:14px;color:var(--slate);line-height:1.5;margin-bottom:16px;}
  .course-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ash);margin-bottom:16px;}
  .course-meta span{display:flex;align-items:center;gap:4px;}

  /* ── Drawer ───────────────────────────────── */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(23,25,28,.4);z-index:200;opacity:0;animation:fadeIn .25s ease forwards;}
  .drawer-panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);background:var(--paper);z-index:201;box-shadow:var(--shadow-modal);overflow-y:auto;transform:translateX(100%);animation:drawerIn .35s cubic-bezier(.2,.8,.3,1) forwards;}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--mist);position:sticky;top:0;background:var(--paper);z-index:1;}
  .drawer-close{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .drawer-close:hover{background:var(--mist);}
  .drawer-body{padding:24px;}
  .drawer-hero{width:100%;height:180px;object-fit:cover;border-radius:var(--r-card);margin-bottom:20px;}

  .curriculum-tree{margin:16px 0;}
  .module{border:1px solid var(--mist);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .module-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:15px;font-weight:500;width:100%;text-align:left;}
  .module-head i{transition:transform .25s ease;font-size:16px;color:var(--slate);}
  .module-head.open i{transform:rotate(180deg);}
  .module-lessons{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--fog);}
  .module-lessons.open{max-height:400px;}
  .lesson-row{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;color:var(--slate);}
  .lesson-row i{font-size:15px;color:var(--ash);}

  .instructor-block{display:flex;gap:14px;align-items:center;padding:16px;background:var(--fog);border-radius:16px;margin:20px 0;}
  .instructor-avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;overflow:hidden;}
  .instructor-block h5{font-size:15px;font-weight:500;}
  .instructor-block span{font-size:13px;color:var(--slate);}

  /* ── Modal ────────────────────────────────── */
  .modal-backdrop{position:fixed;inset:0;background:rgba(23,25,28,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;animation:fadeIn .2s ease forwards;}
  .modal-panel{background:var(--paper);border-radius:var(--r-card);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:fadeInScale .3s ease forwards;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 0;}
  .modal-head h3{font-size:20px;font-weight:500;}
  .modal-body{padding:20px 24px 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--slate);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:13px 16px;border:1px solid var(--mist);border-radius:var(--r-input);font-size:15px;color:var(--ink);background:var(--fog);}
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);}

  .cert-loading{display:flex;flex-direction:column;align-items:center;padding:40px 0;gap:16px;}
  .cert-loading i{font-size:32px;animation:spin 1s linear infinite;color:var(--sienna);}
  .cert-card{background:var(--peach);color:var(--sienna);border-radius:var(--r-card);padding:32px 24px;text-align:center;}
  .cert-card i{font-size:40px;margin-bottom:12px;}
  .cert-card h4{font-size:20px;margin-bottom:6px;}
  .cert-card p{font-size:13px;opacity:.85;}

  /* ── Toast ────────────────────────────────── */
  .toast-stack{position:fixed;bottom:28px;right:28px;z-index:400;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--ink);color:var(--paper);padding:14px 20px;border-radius:14px;font-size:14px;box-shadow:var(--shadow-modal);display:flex;align-items:center;gap:10px;animation:toastIn .35s ease forwards;}

  /* ── Classroom ────────────────────────────── */
  .classroom-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;}
  @media (max-width:960px){.classroom-layout{grid-template-columns:1fr;}}
  .player{background:var(--ink);border-radius:var(--r-card);aspect-ratio:16/9;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .player-play-btn{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;transition:background .2s ease;}
  .player-play-btn:hover{background:rgba(255,255,255,.24);}
  .player-badge{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:6px 12px;border-radius:var(--r-btn);}
  .player-progress-wrap{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);}
  .player-progress-bar{height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;}
  .player-progress-fill{height:100%;background:var(--peach);border-radius:4px;transition:width .3s linear;}
  .player-time{color:#fff;font-size:12px;margin-top:8px;display:flex;justify-content:space-between;}

  .progress-panel{margin-top:24px;padding:22px;background:var(--fog);border-radius:var(--r-card);}
  .progress-ring-row{display:flex;align-items:center;gap:18px;}
  .progress-ring{position:relative;width:76px;height:76px;flex-shrink:0;}
  .progress-ring svg{transform:rotate(-90deg);}
  .progress-ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}
  .cert-btn-row{margin-top:18px;}

  .lesson-sidebar{background:var(--fog);border-radius:var(--r-card);padding:18px;height:fit-content;}
  .lesson-sidebar h4{font-size:15px;font-weight:500;margin-bottom:14px;}
  .lesson-item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px;font-size:14px;transition:background .2s ease;width:100%;text-align:left;}
  .lesson-item:hover{background:var(--mist);}
  .lesson-item.done i{color:var(--sienna);}
  .lesson-item.active{background:var(--paper);box-shadow:0 0 0 1px var(--mist);}
  .lesson-item .lesson-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ash);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;}
  .lesson-item.done .lesson-check{background:var(--sienna);border-color:var(--sienna);color:#fff;}

  /* ── Mypage ───────────────────────────────── */
  .profile-header{display:flex;align-items:center;gap:20px;margin-bottom:40px;flex-wrap:wrap;}
  .profile-avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .profile-header h2{font-size:22px;font-weight:500;}
  .profile-header span{font-size:14px;color:var(--slate);}

function useReveal(){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); } });
    }, { threshold:.15 });
    obs.observe(el);
    return ()=>obs.disconnect();
  },[]);
  return ref;
}
function Reveal({ children, className='' }){
  const ref = useReveal();
  return <div ref={ref} className={`reveal ${className}`}>{children}</div>;
}
function Ripple({ color }){
  const [ripples, setRipples] = useState([]);
  const onClick = (e)=>{
    const rect = e.currentTarget.getBoundingClientRect();
    const id = Date.now();
    setRipples(r=>[...r,{ id, x:e.clientX-rect.left, y:e.clientY-rect.top }]);
    setTimeout(()=>setRipples(r=>r.filter(rp=>rp.id!==id)), 650);
  };
  return { ripples, onClick, render: ()=> ripples.map(r=>(
    <span key={r.id} className="ripple" style={{ left:r.x-2, top:r.y-2, width:4, height:4 }}></span>
  )) };
}

              <div className="instructor-block">

/* ───────────────────────── Classroom ───────────────────────── */
function Classroom(){
  const [lessons, setLessons] = useState(
    MODULES.flatMap(m=>m.lessons.map((l,i)=>({ id:`${m.id}-${i}`, module:m.title, title:l, done:i<2 && m.id==='m1' })))
  );
  const [activeLesson, setActiveLesson] = useState(lessons[2]?.id);
  const [playing, setPlaying] = useState(false);
  const [elapsed, setElapsed] = useState(522); // seconds, resume position
  const duration = 900;
  const [certState, setCertState] = useState('idle'); // idle | loading | done
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    if(!playing) return;
    const t = setInterval(()=> setElapsed(e => Math.min(e+5, duration)), 400);
    return ()=>clearInterval(t);
  },[playing]);

  const doneCount = lessons.filter(l=>l.done).length;
  const progress = Math.round((doneCount/lessons.length)*100);

  const toggleLesson = (id)=>{
    setLessons(ls=>ls.map(l=> l.id===id ? {...l, done:!l.done} : l));
  };

  const openCert = ()=>{
    setCertState('loading');
    setTimeout(()=>setCertState('done'), 1500);
  };

  const R = 32, C = 2*Math.PI*R;

  return (
    <div className="page-wrap">
      <div className="container">
        <div className="page-header">
          <h1>수강실</h1>
          <p>감정 드로잉 저널링 과정 · 현재 진행 중인 강의를 이어서 학습해 보세요.</p>
        </div>

        <div className="classroom-layout">
          <div>
            <div className="player">
              <span className="player-badge">이어보기 · {Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,'0')}부터</span>
              <button className="player-play-btn" onClick={()=>setPlaying(p=>!p)}>
                <i className={playing? 'ti ti-player-pause-filled':'ti ti-player-play-filled'}></i>
              </button>
              <div className="player-progress-wrap">
                <div className="player-progress-bar"><div className="player-progress-fill" style={{width:`${(elapsed/duration)*100}%`}}></div></div>
                <div className="player-time">
                  <span>{Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,'0')}</span>
                  <span>{Math.floor(duration/60)}:{String(duration%60).padStart(2,'0')}</span>
                </div>
              </div>
            </div>

            <div className="progress-panel">
              <div className="progress-ring-row">
                <div className="progress-ring">
                  <svg width="76" height="76">
                    <circle cx="38" cy="38" r={R} stroke="var(--mist)" strokeWidth="7" fill="none" />
                    <circle cx="38" cy="38" r={R} stroke="var(--sienna)" strokeWidth="7" fill="none"
                      strokeDasharray={C} strokeDashoffset={C - (progress/100)*C} strokeLinecap="round"
                      style={{transition:'stroke-dashoffset 1s ease'}} />
                  </svg>
                  <div className="progress-ring-value">{progress}%</div>
                </div>
                <div>
                  <div style={{fontWeight:500, fontSize:16}}>커리큘럼 진도율</div>
                  <div style={{fontSize:13, color:'var(--slate)'}}>{doneCount} / {lessons.length}강 완료</div>
                </div>
              </div>
              <div className="cert-btn-row">
                <button className="btn btn-filled btn-sm" disabled={progress<100} style={progress<100?{opacity:.4, cursor:'not-allowed'}:{}} onClick={openCert}>
                  <i className="ti ti-certificate"></i> 수료증 발급받기
                </button>
                {progress<100 && <span style={{fontSize:12, color:'var(--ash)', marginLeft:10}}>전체 강의를 완료하면 발급됩니다</span>}
              </div>
            </div>
          </div>

          <div className="lesson-sidebar">
            <h4>커리큘럼 목록</h4>
            {lessons.map(l=>(
              <button key={l.id} className={`lesson-item ${l.done?'done':''} ${activeLesson===l.id?'active':''}`}
                onClick={()=>{ setActiveLesson(l.id); toggleLesson(l.id); setToast(l.done? '진도율에서 제외되었습니다' : '레슨 진도율이 갱신되었습니다'); setTimeout(()=>setToast(null),2000); }}>
                <span className="lesson-check">{l.done && <i className="ti ti-check"></i>}</span>
                {l.title}
              </button>
            ))}
          </div>
        </div>
      </div>

      {certState!=='idle' && (
        <div className="modal-backdrop" onClick={()=> certState==='done' && setCertState('idle')}>
          <div className="modal-panel" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <h3>수료증 발급</h3>
              {certState==='done' && <button className="drawer-close" onClick={()=>setCertState('idle')}><i className="ti ti-x"></i></button>}
            </div>
            <div className="modal-body">
              {certState==='loading' ? (
                <div className="cert-loading">
                  <i className="ti ti-loader-2"></i>
                  <span style={{fontSize:14, color:'var(--slate)'}}>수료증을 생성하고 있습니다…</span>
                </div>
              ) : (
                <div className="cert-card">
                  <i className="ti ti-certificate"></i>
                  <h4>감정 드로잉 저널링 과정</h4>
                  <p>수료자: 김민서 · 발급일 2026.08.14</p>
                  <button className="btn btn-filled btn-sm" style={{marginTop:18}} onClick={()=>{ setToast('수료증 다운로드가 시작됩니다'); setTimeout(()=>setToast(null),2200); }}>
                    <i className="ti ti-download"></i> PDF 다운로드
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
      {toast && <ToastStack toasts={[{id:1, text:toast}]} />}
    </div>
  );
}

      {editOpen && (
        <div className="modal-backdrop" onClick={()=>setEditOpen(false)}>

/* ───────────────────────── App ───────────────────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [consultOpen, setConsultOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const go = (id)=>{
    if(id==='consult'){ setConsultOpen(true); return; }
    setScreen(id);
    window.scrollTo({ top:0, behavior:'smooth' });
  };

  const screens = {
    main: <MainScreen go={go} openConsult={()=>setConsultOpen(true)} />,
    'learning-center': <LearningCenter go={go} />,
    classroom: <Classroom />,
    mypage: <Mypage go={go} />,
  };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <Navbar active={screen} go={go} />
      <main style={{flex:1, width:'100%'}}>
        {screens[screen]}
      </main>
      {consultOpen && (
        <ConsultModal onClose={()=>setConsultOpen(false)} onSubmit={()=>{
          setConsultOpen(false);
          setToast('문의가 접수되었습니다');
          setTimeout(()=>setToast(null), 2600);
        }} />
      )}
      {toast && <ToastStack toasts={[{id:1, text:toast}]} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
