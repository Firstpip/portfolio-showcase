<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루미나르트 운영 관리 플랫폼 — 통합 운영 관리 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --obsidian:#000000;
    --paper:#ffffff;
    --inkstone:#181818;
    --felt:#6d6d6d;
    --slate-pill:#636363;
    --ash-mist:#9a9a9a;
    --pewter:#808080;
    --oxblood:#a02d25;
    --line:#000000;
    --line-soft:#e2e2e2;
    --bg-panel:#f7f7f7;
    --gradient-iri: linear-gradient(90deg, rgb(160,224,171), rgb(255,172,46) 50%, rgb(165,45,37));
    --success:#2f6b3a;
    --success-bg:#e8f3ea;
    --pending:#a02d25;
    --pending-bg:#f6e6e4;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper);
    color:var(--obsidian);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  h1,h2,h3,h4,p,ul{margin:0;padding:0;}
  ul{list-style:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}

  /* ── App shell ────────────────────────────── */
  .app-shell{display:flex;width:100%;min-height:100vh;}

  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;overflow-y:auto;}
  .sidebar-brand{padding:22px 20px 16px;border-bottom:1px solid var(--line-soft);}
  .brand-mark{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .brand-dot{width:9px;height:9px;background:var(--obsidian);flex-shrink:0;}
  .env-select{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--felt);border:1px solid var(--line-soft);padding:5px 10px;letter-spacing:.02em;}
  .env-select .dot{width:6px;height:6px;border-radius:50%;background:var(--success);}

  .sidebar-section{padding:18px 14px 4px;}
  .sidebar-section-title{font-size:11px;color:var(--ash-mist);letter-spacing:.08em;text-transform:uppercase;padding:0 10px 8px;}
  .sidebar-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;font-size:14px;color:var(--inkstone);border-left:2px solid transparent;transition:background .2s ease,border-color .2s ease;}
  .sidebar-link i{font-size:17px;flex-shrink:0;}
  .sidebar-link:hover{background:var(--bg-panel);}
  .sidebar-link.active{border-left-color:var(--obsidian);background:var(--bg-panel);font-weight:600;}

  .main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);display:flex;flex-direction:column;min-height:100vh;}
  .main-pad{padding:32px 40px 64px;}

  .page-header{margin-bottom:28px;}
  .page-title-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .page-title{font-size:clamp(26px,2.6vw,34px);font-weight:600;letter-spacing:-.01em;}
  .page-actions{display:flex;gap:10px;}
  .page-meta{font-size:12px;color:var(--felt);margin-top:8px;}
  .page-sub{font-size:14px;color:var(--felt);margin-top:8px;}

  /* ── Buttons ──────────────────────────────── */
  .btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 26px;border-radius:75px;font-size:14px;font-weight:400;white-space:nowrap;transition:opacity .8s cubic-bezier(.19,1,.22,1),background .3s ease,color .3s ease;}
  .btn-primary{background:var(--obsidian);color:var(--paper);border:1px solid var(--obsidian);}
  .btn-primary:hover{opacity:.82;}
  .btn-secondary{background:transparent;color:var(--obsidian);border:1px solid var(--obsidian);}
  .btn-secondary:hover{background:var(--obsidian);color:var(--paper);}
  .btn-sm{height:36px;padding:0 18px;font-size:13px;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  /* ── stat cards (hero-viz + kpi-side) ────── */
  .insight-row{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-bottom:28px;}
  @media (max-width:980px){.insight-row{grid-template-columns:1fr;}}

  .hero-viz-card{border:1px solid var(--line);padding:28px;background:var(--paper);}
  .hero-viz-label{font-size:12px;color:var(--felt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .hero-viz-number{font-size:clamp(34px,4vw,54px);font-weight:500;letter-spacing:-.01em;line-height:1.1;}
  .hero-viz-delta{font-size:13px;color:var(--oxblood);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .hero-chart-wrap{position:relative;height:220px;margin-top:20px;}

  .kpi-side{display:flex;flex-direction:column;gap:14px;}
  .stat-card{border:1px solid var(--line);padding:20px;background:var(--paper);position:relative;}
  .stat-label{font-size:12px;color:var(--felt);margin-bottom:10px;}
  .stat-value{font-size:30px;font-weight:600;letter-spacing:-.01em;}
  .stat-delta{font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
  .stat-delta.positive{color:var(--success);}
  .stat-delta.negative{color:var(--oxblood);}
  .stat-sparkline{position:absolute;right:18px;bottom:18px;width:72px;height:28px;}

  /* ── tab bar / toolbar / table ───────────── */
  .data-section{border-top:1px solid var(--line);padding-top:24px;}
  .tab-bar{display:flex;gap:26px;border-bottom:1px solid var(--line-soft);margin-bottom:18px;}
  .tab{padding:10px 2px;font-size:14px;color:var(--felt);position:relative;}
  .tab.active{color:var(--obsidian);font-weight:600;}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--obsidian);}
  .data-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search{flex:1;min-width:180px;height:40px;border:1px solid var(--line);padding:0 14px;font-size:13px;background:var(--paper);}
  .search:focus{outline:none;border-color:var(--obsidian);}
  .filter-chip{height:36px;padding:0 16px;border:1px solid var(--line-soft);font-size:12px;color:var(--felt);transition:all .3s cubic-bezier(.19,1,.22,1);}
  .filter-chip.active{background:var(--obsidian);color:var(--paper);border-color:var(--obsidian);}
  .export-btn{margin-left:auto;height:36px;padding:0 16px;border:1px solid var(--line);font-size:12px;display:inline-flex;align-items:center;gap:6px;}
  .export-btn:hover{background:var(--bg-panel);}

  .data-table-wrap{width:100%;overflow-x:auto;}
  .data-table{width:100%;border-collapse:collapse;font-size:13px;}
  .data-table thead th{text-align:left;padding:10px 12px;font-size:11px;color:var(--ash-mist);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);font-weight:400;}
  .data-table tbody td{padding:14px 12px;border-bottom:1px solid var(--line-soft);}
  .data-table tbody tr{transition:background .2s ease;}
  .data-table tbody tr:hover{background:var(--bg-panel);}
  .badge{font-size:11px;padding:4px 11px;border-radius:75px;display:inline-block;}
  .badge.success{background:var(--success-bg);color:var(--success);}
  .badge.pending{background:var(--pending-bg);color:var(--pending);}
  .badge.neutral{background:var(--bg-panel);color:var(--felt);}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-soft);}
  .icon-btn:hover{background:var(--bg-panel);}

  /* ── widget grid ──────────────────────────── */
  .widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
  @media (max-width:980px){.widget-grid{grid-template-columns:1fr;}}
  .widget-card{border:1px solid var(--line);padding:22px;}
  .widget-title{font-size:13px;color:var(--felt);margin-bottom:14px;}
  .widget-chart-wrap{position:relative;height:150px;}

  /* ── Modal ────────────────────────────────── */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;animation:fadeIn .3s ease forwards;}
  .modal-panel{background:var(--paper);border:1px solid var(--obsidian);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:fadeInScale .35s cubic-bezier(.19,1,.22,1) forwards;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line-soft);}
  .modal-head h3{font-size:17px;font-weight:600;}
  .modal-body{padding:20px 24px 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--felt);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-soft);font-size:14px;color:var(--obsidian);background:var(--bg-panel);}
  .field textarea{resize:vertical;min-height:76px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--obsidian);}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}

  /* ── Toast ────────────────────────────────── */
  .toast-stack{position:fixed;bottom:28px;right:28px;z-index:400;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--obsidian);color:var(--paper);padding:13px 20px;border-radius:75px;font-size:13px;display:flex;align-items:center;gap:10px;animation:toastIn .4s cubic-bezier(.19,1,.22,1) forwards;}

  /* ── LMS admin ────────────────────────────── */
  .lms-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;}
  @media (max-width:1000px){.lms-layout{grid-template-columns:1fr;}}
  .curriculum-row{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--line-soft);}
  .curriculum-row .order-controls{display:flex;flex-direction:column;gap:2px;}
  .order-btn{width:22px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-soft);font-size:11px;}
  .curriculum-row .title{flex:1;font-size:14px;}
  .curriculum-row .lessons-count{font-size:12px;color:var(--felt);}
  .student-progress-bar{width:80px;height:6px;background:var(--line-soft);position:relative;overflow:hidden;}
  .student-progress-fill{height:100%;background:var(--obsidian);transition:width .8s cubic-bezier(.19,1,.22,1);}

  /* ── Payments admin ──────────────────────── */
  .refund-chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .checkbox{width:17px;height:17px;border:1px solid var(--obsidian);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox.checked{background:var(--obsidian);color:var(--paper);}
  .bulk-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-panel);margin-bottom:14px;font-size:13px;animation:fadeInUp .3s ease;}

  /* ── Site settings ────────────────────────── */
  .settings-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;}
  @media (max-width:1000px){.settings-layout{grid-template-columns:1fr;}}
  .faq-admin-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line-soft);gap:12px;}
  .faq-admin-row .q{font-size:14px;flex:1;}
  .toggle{width:42px;height:24px;border:1px solid var(--obsidian);position:relative;flex-shrink:0;transition:background .3s ease;}
  .toggle.on{background:var(--obsidian);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--paper);transition:transform .3s cubic-bezier(.19,1,.22,1);}
  .toggle.on .toggle-knob{transform:translateX(18px);background:var(--paper);}

  .perm-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
  .perm-table th,.perm-table td{border:1px solid var(--line-soft);padding:10px;text-align:center;}
  .perm-table th{font-weight:600;background:var(--bg-panel);}
  .perm-table td:first-child,.perm-table th:first-child{text-align:left;font-weight:400;}

  .settings-card{border:1px solid var(--line);padding:22px;margin-bottom:20px;}
  .settings-card h4{font-size:14px;font-weight:600;margin-bottom:14px;}

  /* ── Animations ───────────────────────────── */
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
  .spin{animation:spin 1s linear infinite;}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}

  @media (max-width:860px){
    .sidebar{transform:translateX(-100%);transition:transform .3s ease;}
    .sidebar.open{transform:translateX(0);}
    .main-wrap{margin-left:0;width:100%;}
    .main-pad{padding:24px 18px 48px;}
    .mobile-toggle{display:flex !important;}
  }
  .mobile-toggle{display:none;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--line);margin-bottom:16px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ───────────────────────── Data ───────────────────────── */
const REVENUE_SERIES = [42,45,40,48,52,50,58,55,60,64,61,68,72,70,75,80,78,84,88,85,90,94,92,98,101,99,104,108,106,112];
const VISITOR_SERIES = [820,840,790,910,960,880,1020,980,1100,1150,1080,1220];

const COURSES_ADMIN = [
  { id:'k1', title:'첫 만남: 예술심리 워크숍 입문', lessons:12, students:86, order:1 },
  { id:'k2', title:'감정 드로잉 저널링 과정', lessons:10, students:54, order:2 },
  { id:'k3', title:'심층 미술치료 심화 세션', lessons:16, students:31, order:3 },
  { id:'k4', title:'조직 웰니스: 팀 아트테라피', lessons:8, students:22, order:4 },
];

const STUDENTS = [
  { id:'s1', name:'김민서', course:'첫 만남: 예술심리 워크숍 입문', progress:100 },
  { id:'s2', name:'오지훈', course:'감정 드로잉 저널링 과정', progress:38 },
  { id:'s3', name:'배수아', course:'심층 미술치료 심화 세션', progress:64 },
  { id:'s4', name:'정하은', course:'첫 만남: 예술심리 워크숍 입문', progress:12 },
  { id:'s5', name:'최윤재', course:'조직 웰니스: 팀 아트테라피', progress:0 },
];

const PAYMENT_ROWS = [
  { id:'o1', date:'2026.08.11', user:'김민서', program:'첫 만남: 예술심리 워크숍 입문', amount:320000, status:'success' },
  { id:'o2', date:'2026.08.10', user:'오지훈', program:'감정 드로잉 저널링 과정', amount:260000, status:'success' },
  { id:'o3', date:'2026.08.09', user:'배수아', program:'심층 미술치료 심화 세션', amount:480000, status:'pending' },
  { id:'o4', date:'2026.08.08', user:'정하은', program:'첫 만남: 예술심리 워크숍 입문', amount:320000, status:'refund' },
  { id:'o5', date:'2026.08.07', user:'최윤재', program:'조직 웰니스: 팀 아트테라피', amount:640000, status:'success' },
  { id:'o6', date:'2026.08.05', user:'한서준', program:'감정 드로잉 저널링 과정', amount:260000, status:'pending' },
];

const FAQ_ADMIN_INIT = [
  { id:'f1', q:'프로그램 환불 규정은 어떻게 되나요?', a:'첫 세션 시작 전 100% 환불이 가능하며, 이후에는 잔여 세션 기준으로 환불됩니다.' },
  { id:'f2', q:'기업 프로그램은 몇 명부터 신청 가능한가요?', a:'최소 5인 이상 팀 단위로 신청 가능하며, 인원에 따라 맞춤 견적을 제공합니다.' },
];

function sparklinePath(data, w, h){
  const max = Math.max(...data), min = Math.min(...data);
  const step = w/(data.length-1);
  return data.map((v,i)=>`${i===0?'M':'L'} ${i*step} ${h-((v-min)/(max-min||1))*h}`).join(' ');
}

/* ───────────────────────── Toast ───────────────────────── */
function ToastStack({ toasts }){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(<div key={t.id} className="toast"><i className="ph ph-check-circle"></i>{t.text}</div>))}
    </div>
  );
}

/* ───────────────────────── Chart components ────────────── */
function LineChart({ data, color, gradient }){
  const ref = useRef(null);
  useEffect(()=>{
    const ctx = ref.current.getContext('2d');
    let strokeStyle = color;
    if(gradient){
      const g = ctx.createLinearGradient(0,0,ref.current.width,0);
      g.addColorStop(0,'rgb(160,224,171)');
      g.addColorStop(.5,'rgb(255,172,46)');
      g.addColorStop(1,'rgb(165,45,37)');
      strokeStyle = g;
    }
    const chart = new Chart(ctx, {
      type:'line',
      data:{ labels:data.map((_,i)=>i+1), datasets:[{ data, borderColor:strokeStyle, borderWidth:2.5, pointRadius:0, tension:.35, fill:false }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{display:false}, y:{display:false} },
      }
    });
    return ()=>chart.destroy();
  },[]);
  return <div className="hero-chart-wrap"><canvas ref={ref}></canvas></div>;
}

function DonutChart({ data, labels, colors }){
  const ref = useRef(null);
  useEffect(()=>{
    const ctx = ref.current.getContext('2d');
    const chart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:8, font:{size:11} } } } }
    });
    return ()=>chart.destroy();
  },[]);
  return <div className="widget-chart-wrap"><canvas ref={ref}></canvas></div>;
}

function BarChart({ data, labels }){
  const ref = useRef(null);
  useEffect(()=>{
    const ctx = ref.current.getContext('2d');
    const chart = new Chart(ctx, {
      type:'bar',
      data:{ labels, datasets:[{ data, backgroundColor:'#000000', borderRadius:0, barThickness:16 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ grid:{display:false}, ticks:{font:{size:10}} }, y:{ display:false } } }
    });
    return ()=>chart.destroy();
  },[]);
  return <div className="widget-chart-wrap"><canvas ref={ref}></canvas></div>;
}

/* ───────────────────────── Sidebar ─────────────────────── */
function Sidebar({ active, go, mobileOpen }){
  const groups = [
    { title:'개요', items:[ { id:'main', label:'통합 운영 대시보드', icon:'ph-gauge' } ] },
    { title:'운영 관리', items:[
      { id:'lms-admin', label:'LMS 콘텐츠 & 수강생 관리', icon:'ph-graduation-cap' },
      { id:'payments-admin', label:'매출 · 결제 정산 관리', icon:'ph-currency-circle-dollar' },
    ]},
    { title:'설정', items:[ { id:'site-settings', label:'사이트 설정 & FAQ 관리', icon:'ph-gear-six' } ] },
  ];
  return (
    <aside className={`sidebar ${mobileOpen?'open':''}`}>
      <div className="sidebar-brand">
        <div className="brand-mark"><span className="brand-dot"></span>루미나르트 스튜디오</div>
        <div className="env-select"><span className="dot"></span>운영 환경 · Production</div>
      </div>
      {groups.map(g=>(
        <div className="sidebar-section" key={g.title}>
          <div className="sidebar-section-title">{g.title}</div>
          {g.items.map(it=>(

/* ───────────────────────── LMS admin ───────────────────── */
function LmsAdmin(){
  const [courses, setCourses] = useState(COURSES_ADMIN);
  const [onlyIncomplete, setOnlyIncomplete] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [newTitle, setNewTitle] = useState('');
  const [toast, setToast] = useState(null);
  const [editTarget, setEditTarget] = useState(null);
  const [editTitle, setEditTitle] = useState('');

  const move = (id, dir)=>{
    setCourses(cs=>{
      const idx = cs.findIndex(c=>c.id===id);
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=cs.length) return cs;
      const next = [...cs];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      return next.map((c,i)=>({...c, order:i+1}));
    });
    setToast('레슨 순서가 갱신되었습니다');
    setTimeout(()=>setToast(null), 2000);
  };

  const students = STUDENTS.filter(s=> !onlyIncomplete || s.progress<100);

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div>
            <h1 className="page-title">LMS 콘텐츠 & 수강생 관리</h1>
            <p className="page-sub">커리큘럼 순서를 조정하고 수강생 진도 현황을 관리합니다.</p>
          </div>
          <div className="page-actions">
            <button className="btn btn-primary btn-sm" onClick={()=>setAddOpen(true)}><i className="ph ph-plus"></i> 신규 강의 등록</button>

      </div>

          <h4 style={{fontSize:14, fontWeight:600, marginBottom:10}}>커리큘럼 순서</h4>

            {courses.map((c,i)=>(
              <div className="curriculum-row" key={c.id}>
                <div className="order-controls">
                  <button className="order-btn" onClick={()=>move(c.id,-1)}><i className="ph ph-caret-up"></i></button>
                  <button className="order-btn" onClick={()=>move(c.id,1)}><i className="ph ph-caret-down"></i></button>
                </div>
                <span className="title">{c.title}</span>
                <span className="lessons-count">{c.lessons}강 · 수강 {c.students}명</span>
                <button className="icon-btn" onClick={()=>{ setEditTarget(c); setEditTitle(c.title); }}><i className="ph ph-pencil-simple"></i></button>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10}}>
            <h4 style={{fontSize:14, fontWeight:600}}>수강생 진도 현황</h4>
            <label style={{display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--felt)', cursor:'pointer'}} onClick={()=>setOnlyIncomplete(v=>!v)}>
              <span className={`checkbox ${onlyIncomplete?'checked':''}`}>{onlyIncomplete && <i className="ph ph-check" style={{fontSize:11}}></i>}</span>
              미이수만 보기
            </label>
          </div>
          <table className="data-table">
            <thead><tr><th>수강생</th><th>과정</th><th>진도</th></tr></thead>
            <tbody>
              {students.map(s=>(
                <tr key={s.id}>
                  <td>{s.name}</td>
                  <td style={{fontSize:12, color:'var(--felt)'}}>{s.course}</td>
                  <td>
                    <div style={{display:'flex', alignItems:'center', gap:8}}>
                      <div className="student-progress-bar"><div className="student-progress-fill" style={{width:`${s.progress}%`}}></div></div>
                      <span style={{fontSize:11}}>{s.progress}%</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {addOpen && (
        <div className="modal-backdrop" onClick={()=>setAddOpen(false)}>
          <div className="modal-panel" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>신규 강의 등록</h3><button className="icon-btn" onClick={()=>setAddOpen(false)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <div className="field"><label>강의명</label><input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="강의 제목을 입력해 주세요" /></div>
              <div className="field"><label>트랙</label><select><option>개인 프로그램</option><option>기업 프로그램</option></select></div>
              <div className="field"><label>난이도</label><select><option>초급</option><option>중급</option><option>고급</option></select></div>
              <div className="modal-actions">
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setAddOpen(false)}>취소</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>{
                  if(newTitle.trim()) setCourses(cs=>[...cs, { id:'k'+Date.now(), title:newTitle, lessons:0, students:0, order:cs.length+1 }]);

                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setEditTarget(null)}>취소</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>{
                  setCourses(cs=>cs.map(c=> c.id===editTarget.id ? {...c, title:editTitle} : c));
                  setEditTarget(null); setToast('강의 정보가 수정되었습니다'); setTimeout(()=>setToast(null),2200);
                }}>저장하기</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {toast && <ToastStack toasts={[{id:1,text:toast}]} />}
    </div>
  );
}

      <div className="settings-layout">
        <div className="settings-card">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
            <h4>FAQ 관리</h4>
            <button className="btn btn-secondary btn-sm" onClick={()=>setAddOpen(true)}><i className="ph ph-plus"></i> FAQ 추가</button>
          </div>
          {faqs.map(f=>(
            <div className="faq-admin-row" key={f.id}>
              <span className="q">{f.q}</span>
              <div className="row-actions">
                <button className="icon-btn" onClick={()=>{ setEditTarget(f); setEditFaq({ q:f.q, a:f.a }); }}><i className="ph ph-pencil-simple"></i></button>
                <button className="icon-btn" onClick={()=>setDelTarget(f)}><i className="ph ph-trash"></i></button>
              </div>
            </div>
          ))}
          {faqs.length===0 && <p style={{fontSize:13, color:'var(--felt)', padding:'16px 4px'}}>등록된 FAQ가 없습니다.</p>}
        </div>

        <div>
          <div className="settings-card">
            <h4>메인 팝업 노출</h4>
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
              <span style={{fontSize:13, color:'var(--felt)'}}>여름 시즌 프로그램 안내 팝업</span>
              <div className={`toggle ${popupOn?'on':''}`} onClick={()=>{ setPopupOn(v=>!v); setToast(!popupOn? '팝업이 노출됩니다':'팝업 노출이 중단되었습니다'); setTimeout(()=>setToast(null),2000); }}>
                <div className="toggle-knob"></div>
              </div>
            </div>
            <div className="field"><label>노출 기간</label>
              <div style={{display:'flex', gap:8}}>
                <input type="date" defaultValue="2026-08-14" />
                <input type="date" defaultValue="2026-09-14" />
              </div>
            </div>
          </div>

          <div className="settings-card">
            <h4>역할별 접근 권한</h4>
            <table className="perm-table">
              <thead><tr><th>역할</th>{MENUS.map(m=><th key={m}>{m}</th>)}</tr></thead>
              <tbody>
                {ROLES.map(r=>(
                  <tr key={r}>
                    <td>{r}</td>
                    {MENUS.map((m,i)=>(
                      <td key={m}>
                        <span className={`checkbox ${perms[r][i]?'checked':''}`} style={{margin:'0 auto'}} onClick={()=>togglePerm(r,i)}>
                          {perms[r][i] && <i className="ph ph-check" style={{fontSize:11}}></i>}
                        </span>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      {addOpen && (
        <div className="modal-backdrop" onClick={()=>setAddOpen(false)}>
          <div className="modal-panel" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>FAQ 추가</h3><button className="icon-btn" onClick={()=>setAddOpen(false)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <div className="field"><label>질문</label><input value={newFaq.q} onChange={e=>setNewFaq({...newFaq, q:e.target.value})} placeholder="자주 묻는 질문을 입력해 주세요" /></div>
              <div className="field"><label>답변</label><textarea value={newFaq.a} onChange={e=>setNewFaq({...newFaq, a:e.target.value})} placeholder="답변 내용을 입력해 주세요"></textarea></div>
              <div className="modal-actions">
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setAddOpen(false)}>취소</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>{
                  if(newFaq.q.trim()) setFaqs(fs=>[...fs, { id:'f'+Date.now(), q:newFaq.q, a:newFaq.a }]);
                  setNewFaq({q:'',a:''}); setAddOpen(false); setToast('FAQ가 등록되었습니다'); setTimeout(()=>setToast(null),2200);
                }}>등록하기</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {editTarget && (
        <div className="modal-backdrop" onClick={()=>setEditTarget(null)}>
          <div className="modal-panel" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>FAQ 수정</h3><button className="icon-btn" onClick={()=>setEditTarget(null)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <div className="field"><label>질문</label><input value={editFaq.q} onChange={e=>setEditFaq({...editFaq, q:e.target.value})} /></div>
              <div className="field"><label>답변</label><textarea value={editFaq.a} onChange={e=>setEditFaq({...editFaq, a:e.target.value})}></textarea></div>
              <div className="modal-actions">
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setEditTarget(null)}>취소</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>{
                  setFaqs(fs=>fs.map(f=> f.id===editTarget.id ? {...f, q:editFaq.q, a:editFaq.a} : f));
                  setEditTarget(null); setToast('FAQ가 수정되었습니다'); setTimeout(()=>setToast(null),2200);
                }}>저장하기</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {delTarget && (
        <div className="modal-backdrop" onClick={()=>setDelTarget(null)}>
          <div className="modal-panel" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>FAQ 삭제</h3><button className="icon-btn" onClick={()=>setDelTarget(null)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <p style={{fontSize:14, color:'var(--felt)', marginBottom:20}}>정말 삭제하시겠습니까? "{delTarget.q}"</p>
              <div className="modal-actions">
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setDelTarget(null)}>취소</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>{ setFaqs(fs=>fs.filter(f=>f.id!==delTarget.id)); setDelTarget(null); setToast('FAQ가 삭제되었습니다'); setTimeout(()=>setToast(null),2000); }}>삭제하기</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {toast && <ToastStack toasts={[{id:1,text:toast}]} />}
    </div>
  );
}

/* ───────────────────────── App ─────────────────────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [mobileOpen, setMobileOpen] = useState(false);

  const go = (id)=>{ setScreen(id); setMobileOpen(false); window.scrollTo({top:0}); };

  const screens = {
    main: <Dashboard />,
    'lms-admin': <LmsAdmin />,
    'payments-admin': <PaymentsAdmin />,
    'site-settings': <SiteSettings />,
  };

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar active={screen} go={go} mobileOpen={mobileOpen} />
      <div className="main-wrap">
        <div className="main-pad">
          <button className="mobile-toggle" onClick={()=>setMobileOpen(v=>!v)}><i className={mobileOpen? 'ph ph-x':'ph ph-list'}></i></button>
          {screens[screen]}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
