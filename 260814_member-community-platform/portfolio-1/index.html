<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이너서클 — 회원제 커뮤니티 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root{
  --primary:#17191c;
  --secondary:#fafafb;
  --accent:#fbe1d1;
  --accent-ink:#5d2a1a;
  --bg:#ffffff;
  --surface:#f2f2f3;
  --text:#17191c;
  --text2:#777b86;
  --text3:#979799;
  --line:#ececec;
  --radius-card:24px;
  --radius-pill:9999px;
  --radius-input:16px;
  --shadow-float:0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  --shadow-pop:rgba(0,0,0,0.05) 0px 0px 0px 1px, rgba(0,0,0,0.1) 0px 8px 40px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#e2e2e3;border-radius:8px;}

.app{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* ---- Topbar ---- */
.topbar{width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);z-index:60;}
.logo{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;letter-spacing:-0.02em;color:var(--primary);}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);}
.topbar-search{flex:1;max-width:360px;margin:0 24px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--radius-pill);padding:8px 16px;color:var(--text2);}
.topbar-search input{border:none;background:transparent;outline:none;font-size:14px;width:100%;color:var(--text);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s,transform .15s;position:relative;}
.icon-btn:hover{background:var(--surface);transform:translateY(-1px);}
.badge-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent-ink);}
.avatar-btn{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--line);padding:0;background:#fff;}
.avatar-btn img{width:100%;height:100%;display:block;}

/* ---- Subnav (quick feature access) ---- */
.subnav{width:100%;border-bottom:1px solid var(--line);background:var(--secondary);}
.subnav-inner{max-width:1200px;margin:0 auto;display:flex;gap:8px;padding:10px 32px;overflow-x:auto;}
.subnav-chip{white-space:nowrap;padding:9px 18px;border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;color:var(--text2);font-size:14px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:6px;}
.subnav-chip:hover{background:#fff;color:var(--text);}
.subnav-chip.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-pop);}
.subnav-chip i{width:15px;height:15px;}

main{flex:1;width:100%;}

/* ---- Feed hero ---- */
.feed-hero{max-width:1200px;margin:0 auto;padding:56px 32px 24px;position:relative;overflow:hidden;}
.feed-hero::before{content:'';position:absolute;top:-120px;right:-60px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle at 40% 40%, #fbe1d1 0%, rgba(251,225,209,0.35) 45%, rgba(251,225,209,0) 72%);pointer-events:none;z-index:0;}
.feed-hero::after{content:'';position:absolute;bottom:-80px;left:280px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle, rgba(23,25,28,0.06) 0%, rgba(23,25,28,0) 70%);pointer-events:none;z-index:0;}
.feed-hero-inner{max-width:640px;position:relative;z-index:2;}
.feed-hero h1{font-size:48px;line-height:1.26;letter-spacing:-0.02em;font-weight:600;margin:0 0 14px;}
.feed-hero h1 em{font-style:italic;color:var(--accent-ink);font-weight:600;}
.feed-hero p{font-size:17px;color:var(--text2);line-height:1.55;margin:0 0 22px;max-width:460px;}
.pill{border-radius:var(--radius-pill);padding:0 22px;height:46px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;border:1px solid transparent;transition:transform .15s,box-shadow .15s;}
.pill:active{transform:scale(.97);}
.pill-filled{background:var(--primary);color:#fff;}
.pill-filled:hover{box-shadow:0 8px 20px rgba(23,25,28,.25);transform:translateY(-1px);}
.pill-ghost{background:transparent;color:var(--primary);border-color:var(--primary);}
.pill-ghost:hover{background:var(--primary);color:#fff;}
.hero-actions{display:flex;gap:12px;}

.float-card{position:absolute;background:#fff;border-radius:20px;box-shadow:var(--shadow-float);padding:14px 18px;animation:float 5s ease-in-out infinite;}
.float-card .fc-num{font-size:20px;font-weight:600;color:var(--primary);}
.float-card .fc-label{font-size:13px;color:var(--text2);margin-top:2px;}
.fc-1{top:8px;right:60px;animation-delay:0s;}
.fc-2{top:150px;right:-4px;animation-delay:1.2s;}
.fc-3{top:230px;right:220px;animation-delay:2.1s;}
@media (max-width:1080px){.float-card{display:none;}}

@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes heartBurst{0%{transform:scale(1);}35%{transform:scale(1.4);}100%{transform:scale(1);}}
@keyframes slideInRight{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes popScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}

/* ---- Feed layout ---- */
.feed-layout{max-width:1200px;margin:0 auto;display:flex;justify-content:center;gap:28px;padding:8px 32px 80px;align-items:flex-start;}
.feed{width:100%;max-width:600px;}
.composer{position:sticky;top:64px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-input);padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.03);margin-bottom:20px;}
.composer img{width:36px;height:36px;border-radius:50%;flex-shrink:0;}
.composer-input{flex:1;background:var(--surface);border-radius:var(--radius-pill);padding:11px 16px;color:var(--text3);font-size:14px;border:none;text-align:left;}
.composer button.post-btn{background:var(--primary);color:#fff;border-radius:var(--radius-pill);padding:0 18px;height:38px;font-size:14px;font-weight:500;border:none;}

.board-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-chip{padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--line);background:#fff;font-size:13px;color:var(--text2);font-weight:500;}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.post{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;margin-bottom:16px;animation:fadeInUp .5s ease both;transition:box-shadow .2s,transform .2s;position:relative;}
.post:hover{box-shadow:var(--shadow-float);transform:translateY(-2px);}
.post.locked{filter:saturate(.35);}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-head img{width:40px;height:40px;border-radius:50%;}
.post-head .author{font-size:14.5px;font-weight:600;color:var(--text);}
.post-head .meta{font-size:12.5px;color:var(--text3);display:flex;gap:6px;align-items:center;}
.board-tag{font-size:12px;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:var(--radius-pill);font-weight:500;}
.post-more{margin-left:auto;color:var(--text3);background:none;border:none;padding:6px;border-radius:50%;}
.post-more:hover{background:var(--surface);}
.post-title{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em;cursor:pointer;}
.post-body{font-size:14.5px;color:var(--text2);line-height:1.6;margin:0 0 14px;}
.post-actions{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:12px;}
.pa-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text2);font-size:13px;font-weight:500;padding:7px 10px;border-radius:var(--radius-pill);transition:background .15s,color .15s;}
.pa-btn:hover{background:var(--surface);color:var(--text);}
.pa-btn.liked{color:var(--accent-ink);}
.pa-btn.liked i{animation:heartBurst .4s ease;}
.pa-btn.bookmarked{color:var(--primary);}
.pa-spacer{flex:1;}
.lock-overlay{position:absolute;inset:0;border-radius:var(--radius-card);background:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text2);font-size:13px;font-weight:500;backdrop-filter:blur(1.5px);}

/* ---- Side rail ---- */
.side-rail{width:288px;flex-shrink:0;position:sticky;top:150px;display:flex;flex-direction:column;gap:16px;}
@media (max-width:960px){.side-rail{display:none;}}
.rail-card{background:var(--surface);border-radius:var(--radius-card);padding:18px;}
.rail-card h4{font-size:13px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px;font-weight:600;}
.grade-row{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.grade-row img{width:44px;height:44px;border-radius:50%;}
.grade-name{font-size:15px;font-weight:600;}
.grade-badge{display:inline-block;margin-top:3px;font-size:12px;background:var(--accent);color:var(--accent-ink);padding:2px 9px;border-radius:var(--radius-pill);font-weight:500;}
.rail-list-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;color:var(--text);border-top:1px solid rgba(0,0,0,.05);}
.rail-list-item:first-child{border-top:none;}
.rail-list-item .rank{color:var(--text3);width:16px;font-weight:600;}
.rail-accent{background:var(--accent);border-radius:var(--radius-card);padding:20px;}
.rail-accent h4{color:var(--accent-ink);opacity:.7;}
.rail-accent .rail-accent-title{font-size:15.5px;font-weight:600;color:var(--accent-ink);line-height:1.4;margin-bottom:4px;}
.rail-accent .rail-accent-sub{font-size:12.5px;color:var(--accent-ink);opacity:.75;}
.rail-btn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;margin-top:8px;}
.rail-btn:hover{background:var(--secondary);}
.rail-btn i{width:17px;height:17px;color:var(--text2);}

/* ---- Generic page (non-feed views) ---- */
.page{max-width:1180px;margin:0 auto;padding:40px 32px 80px;}
.page-head{margin-bottom:28px;}
.page-head h2{font-size:28px;font-weight:600;letter-spacing:-0.01em;margin:0 0 6px;}
.page-head p{font-size:14.5px;color:var(--text2);margin:0;}
.grid-2{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:flex-start;}
@media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);padding:22px;}
.card h3{font-size:16px;font-weight:600;margin:0 0 16px;}

.step-list{display:flex;flex-direction:column;gap:0;}
.step-item{display:flex;gap:14px;padding-bottom:22px;position:relative;}
.step-item:last-child{padding-bottom:0;}
.step-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--line);}
.step-dot{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:600;color:var(--text2);}
.step-dot.done{background:var(--primary);color:#fff;}
.step-dot.now{background:var(--accent);color:var(--accent-ink);}
.step-title{font-size:14.5px;font-weight:600;margin-bottom:3px;}
.step-desc{font-size:13px;color:var(--text2);line-height:1.5;}
.social-row{display:flex;gap:10px;margin-top:16px;}
.social-btn{flex:1;border-radius:14px;padding:11px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
.social-btn.kakao{background:#FEE500;border-color:#FEE500;color:#3c1e1e;}
.social-btn.naver{background:#03C75A;border-color:#03C75A;color:#fff;}
.status-line{margin-top:16px;padding:14px;background:var(--surface);border-radius:14px;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:10px;}
.status-badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);}
.status-badge.pending{background:#fff3d6;color:#8a6100;}
.status-badge.approved{background:#dff5e4;color:#1f7a3d;}
.status-badge.rejected{background:#fde2e2;color:#a12e2e;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:0 12px 12px;}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle;}
tr.row-fade{animation:fadeInUp .4s ease both;}
.row-user{display:flex;align-items:center;gap:10px;}
.row-user img{width:32px;height:32px;border-radius:50%;}
.row-user .rn{font-weight:600;font-size:13.5px;}
.row-user .rp{font-size:12px;color:var(--text3);}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;margin-right:6px;}
.mini-btn.approve{background:var(--primary);color:#fff;border-color:var(--primary);}
.mini-btn.reject{color:#a12e2e;}
.mini-btn:disabled{opacity:.45;cursor:default;}

.matrix-wrap{overflow-x:auto;}
.matrix-table td,.matrix-table th{text-align:center;}
.matrix-table td:first-child,.matrix-table th:first-child{text-align:left;}
.toggle-cell{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--line);position:relative;border:none;margin:0 auto;display:block;transition:background .2s;}
.toggle-cell::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
.toggle-cell.on{background:var(--primary);}
.toggle-cell.on::after{transform:translateX(18px);}
.code-card{background:var(--primary);border-radius:20px;padding:22px;box-shadow:var(--shadow-float);margin-top:24px;}
.code-card .cc-head{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:600;margin-bottom:12px;opacity:.75;}
.code-card pre{margin:0;color:#e9e9ea;font-size:12.5px;line-height:1.7;font-family:'SFMono-Regular',Consolas,monospace;white-space:pre-wrap;}
.code-card .kw{color:#f9c199;}
.code-card .str{color:#fbe1d1;}

.tab-row{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
.tab-btn{padding:12px 4px;margin-right:22px;background:none;border:none;font-size:14.5px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--text);border-color:var(--primary);font-weight:600;}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:820px){.media-grid{grid-template-columns:repeat(2,1fr);}}
.media-card{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fadeInUp .45s ease both;}
.media-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-float);}
.media-thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface);}
.media-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);}
.play-badge i{width:46px;height:46px;color:#fff;}
.dur-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;}
.media-info{padding:12px 14px;}
.media-info .mt{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.media-info .ms{font-size:12px;color:var(--text3);}
.gallery-thumb img{aspect-ratio:1/1;}

/* ---- Overlays ---- */
.overlay{position:fixed;inset:0;background:rgba(23,25,28,.45);z-index:100;display:flex;align-items:center;justify-content:center;animation:overlayIn .2s ease;}
.modal{background:#fff;border-radius:24px;width:440px;max-width:92vw;padding:26px;box-shadow:var(--shadow-pop);animation:popScale .22s ease;max-height:86vh;overflow-y:auto;}
.modal h3{font-size:17px;font-weight:600;margin:0 0 4px;}
.modal .msub{font-size:13px;color:var(--text2);margin:0 0 18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;background:#fff;}
.field textarea{resize:vertical;min-height:88px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.btn-flat{padding:10px 18px;border-radius:var(--radius-pill);border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;}
.btn-flat.danger{border-color:#f0c9c9;color:#a12e2e;}
.btn-flat.primary{background:var(--primary);color:#fff;border-color:var(--primary);}

.drawer-wrap{position:fixed;inset:0;background:rgba(23,25,28,.4);z-index:110;display:flex;justify-content:flex-end;animation:overlayIn .2s ease;}
.drawer{width:440px;max-width:94vw;height:100%;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);animation:slideInRight .28s ease;overflow-y:auto;padding:26px;}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.drawer-close{border:none;background:var(--surface);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.attach-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:500;margin-top:10px;}
.comment-item{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
.comment-item img{width:32px;height:32px;border-radius:50%;}
.comment-item .cn{font-size:13px;font-weight:600;}
.comment-item .ct{font-size:11.5px;color:var(--text3);margin-left:6px;font-weight:400;}
.comment-item .cb{font-size:13.5px;color:var(--text2);margin-top:3px;line-height:1.5;}
.comment-input-row{display:flex;gap:8px;margin-top:14px;}
.comment-input-row input{flex:1;border:1px solid var(--line);border-radius:var(--radius-pill);padding:10px 14px;font-size:13.5px;outline:none;}
.watermark-note{display:flex;gap:8px;align-items:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:16px;}
.watermark-note i{width:15px;height:15px;flex-shrink:0;margin-top:1px;}

.toast{position:fixed;bottom:28px;left:50%;background:var(--primary);color:#fff;padding:13px 22px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:200;animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;}

.gallery-lightbox-img{position:relative;border-radius:18px;overflow:hidden;}
.gallery-lightbox-img img{width:100%;display:block;}
.wm-tile{position:absolute;font-size:13px;font-weight:600;color:rgba(255,255,255,.55);transform:rotate(-24deg);letter-spacing:.05em;pointer-events:none;}

/* ---- 모바일 대응 (커뮤니티 피드는 모바일 비중이 높아 우선 대응) ---- */
@media (max-width:640px){
  .topbar{padding:0 14px;height:58px;gap:8px;}
  .topbar-search{display:none;}
  .logo{font-size:17px;}
  .topbar-right{gap:8px;flex-shrink:0;}
  .icon-btn{width:34px;height:34px;}
  .avatar-btn{width:34px;height:34px;}

              </table>
              <div className="code-card">
                <div className="cc-head"><Icon name="database" size={14}/>Supabase RLS 정책 미리보기</div>
                <pre><span className="kw">create policy</span> <span className="str">"board_select_by_grade"</span>
<span className="kw">on</span> posts <span className="kw">for select</span>
<span className="kw">using</span> (
  board_required_grade &lt;= (
    <span className="kw">select</span> grade <span className="kw">from</span> members <span className="kw">where</span> id = auth.uid()
  )
);</pre>
              </div>
            </div>
          </div>
        )}

        {view==='media-board' && (
          <div className="page">
            <div className="page-head"><h2>강의영상 & 갤러리 게시판</h2><p>유튜브 임베드 기반 강의영상과 이미지 중심 갤러리를 함께 제공합니다.</p></div>
            <div className="tab-row">
              <button className={"tab-btn"+(mediaTab==='lecture'?' active':'')} onClick={()=>setMediaTab('lecture')}>강의영상</button>
              <button className={"tab-btn"+(mediaTab==='gallery'?' active':'')} onClick={()=>setMediaTab('gallery')}>갤러리</button>
            </div>
            {mediaTab==='lecture' && (
              <div className="media-grid">
                {VIDEOS.map((v,idx) => (
                  <div className="media-card" key={v.id} style={{animationDelay:(idx*0.05)+'s'}} onClick={()=>{setVideoModal(v); showToast('열람 이력이 기록되었습니다');}}>
                    <div className="media-thumb">
                      <img src={PIC('lecture-'+v.id,400,250)} alt={v.title}/>
                      <div className="play-badge"><Icon name="play-circle" size={44}/></div>
                      <div className="dur-badge">{v.dur}</div>
                    </div>
                    <div className="media-info"><div className="mt">{v.title}</div><div className="ms">조회 {v.views}회</div></div>
                  </div>
                ))}
              </div>
            )}
            {mediaTab==='gallery' && (
              <div className="media-grid">
                {GALLERY.map((g,idx) => (
                  <div className="media-card" key={g.id} style={{animationDelay:(idx*0.05)+'s'}} onClick={()=>{setLightbox(g); showToast('열람 이력이 기록되었습니다');}}>
                    <div className="media-thumb gallery-thumb">
                      <img src={PIC('gallery-'+g.id,320,320)} alt={g.title}/>
                    </div>
                    <div className="media-info"><div className="mt">{g.title}</div></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>

      {composerOpen && (
        <div className="overlay" onClick={()=>setComposerOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>새 게시글 작성</h3>
            <p className="msub">게시판을 선택하고 내용을 입력해주세요</p>
            <div className="field"><label>게시판</label>
              <select value={newPostBoard} onChange={e=>setNewPostBoard(e.target.value)}>
                {BOARDS.filter(b=>b.id!=='exec').map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </div>
            <div className="field"><label>제목</label><input value={newPostTitle} onChange={e=>setNewPostTitle(e.target.value)} placeholder="제목을 입력하세요"/></div>
            <div className="field"><label>내용</label><textarea value={newPostBody} onChange={e=>setNewPostBody(e.target.value)} placeholder="내용을 입력하세요"></textarea></div>
            <div className="modal-actions">
              <button className="btn-flat" onClick={()=>setComposerOpen(false)}>취소</button>
              <button className="btn-flat primary" onClick={submitPost}>게시하기</button>
            </div>
          </div>
        </div>
      )}

      {reportTarget && (
        <div className="overlay" onClick={()=>setReportTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>게시글 신고</h3>
            <p className="msub">"{reportTarget.title}" 게시글을 신고하시겠습니까? 신고된 글은 검토 후 블라인드 처리될 수 있습니다.</p>
            <div className="modal-actions">
              <button className="btn-flat" onClick={()=>setReportTarget(null)}>취소</button>
              <button className="btn-flat danger" onClick={submitReport}>신고하기</button>
            </div>
          </div>
        </div>
      )}

      {rejectTarget && (
        <div className="overlay" onClick={()=>setRejectTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>가입 거부</h3>
            <p className="msub">{rejectTarget.name}님의 가입 신청을 거부합니다. 사유를 입력해주세요.</p>
            <div className="field"><textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="거부 사유를 입력하세요"></textarea></div>
            <div className="modal-actions">
              <button className="btn-flat" onClick={()=>setRejectTarget(null)}>취소</button>
              <button className="btn-flat danger" onClick={confirmReject}>거부 확정</button>
            </div>
          </div>
        </div>
      )}

      {videoModal && (
        <div className="overlay" onClick={()=>setVideoModal(null)}>
          <div className="modal" style={{width:600}} onClick={e=>e.stopPropagation()}>
            <h3>{videoModal.title}</h3>
            <p className="msub">조회 {videoModal.views}회 · 강의영상 게시판</p>
            <div style={{position:'relative',paddingTop:'56.25%',borderRadius:14,overflow:'hidden',background:'#000'}}>
              <iframe src="https://www.youtube.com/embed/M7lc1UVf-VE" title={videoModal.title} style={{position:'absolute',inset:0,width:'100%',height:'100%',border:'none'}} allowFullScreen></iframe>
            </div>
            <div className="modal-actions"><button className="btn-flat primary" onClick={()=>setVideoModal(null)}>닫기</button></div>
          </div>
        </div>
      )}

      {lightbox && (
        <div className="overlay" onClick={()=>setLightbox(null)}>
          <div className="modal" style={{width:520,padding:16}} onClick={e=>e.stopPropagation()}>
            <div className="gallery-lightbox-img">
              <img src={PIC('gallery-'+lightbox.id,700,700)} alt={lightbox.title}/>
              {Array.from({length:6}).map((_,i)=>(
                <span key={i} className="wm-tile" style={{top:(20+i*90)+'px', left:((i%2===0?20:170))+'px'}}>이너서클 열람전용</span>
              ))}
            </div>
            <div className="watermark-note"><Icon name="shield-check"/>워터마크가 자동 삽입되며, 이 열람 기록은 관리자 활동 로그에 저장됩니다.</div>
          </div>
        </div>
      )}

      {drawerPost && (
        <div className="drawer-wrap" onClick={()=>setDrawerPost(null)}>
          <div className="drawer" onClick={e=>e.stopPropagation()}>
            <div className="drawer-head">
              <span className="board-tag">{boardName(drawerPost.board)}</span>
              <button className="drawer-close" onClick={()=>setDrawerPost(null)}><Icon name="x" size={16}/></button>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
              <img src={AV(drawerPost.avatar)} style={{width:40,height:40,borderRadius:'50%'}} alt=""/>
              <div><div style={{fontWeight:600,fontSize:14.5}}>{drawerPost.author}</div><div style={{fontSize:12,color:'var(--text3)'}}>{drawerPost.time} · 조회 {drawerPost.views+1}</div></div>
            </div>
            <h2 style={{fontSize:20,fontWeight:600,margin:'0 0 10px'}}>{drawerPost.title}</h2>
            <p style={{fontSize:14.5,color:'var(--text2)',lineHeight:1.7}}>{drawerPost.body} 승인된 회원분들과 함께 자세한 내용을 계속 공유할 예정입니다. 궁금한 점은 댓글로 남겨주세요.</p>
            <div className="attach-chip"><Icon name="paperclip" size={14}/>첨부자료.pdf<Icon name="download" size={14} className="dl"/></div>
            <div className="watermark-note"><Icon name="shield-check"/>이 게시글 열람 시 워터마크가 자동 삽입되며 열람 이력이 기록됩니다.</div>
            <div style={{display:'flex',gap:6,marginTop:18,borderTop:'1px solid var(--line)',paddingTop:14}}>
              <button className={"pa-btn"+(drawerPost.liked?' liked':'')} onClick={()=>toggleLike(drawerPost.id)}><Icon name="heart" size={15}/>{drawerPost.liked?drawerPost.likes:drawerPost.likes}</button>
              <button className={"pa-btn"+(drawerPost.bookmarked?' bookmarked':'')} onClick={()=>toggleBookmark(drawerPost.id)}><Icon name="bookmark" size={15}/>북마크</button>
              <button className="pa-btn" onClick={()=>showToast('공유 링크가 복사되었습니다')}><Icon name="share-2" size={15}/>공유</button>
              <button className="pa-btn" onClick={()=>setReportTarget(drawerPost)}><Icon name="flag" size={15}/>신고</button>
            </div>
            <h4 style={{fontSize:13,color:'var(--text3)',marginTop:20,marginBottom:0,textTransform:'uppercase',letterSpacing:'.03em'}}>댓글 {comments.length}</h4>
            {comments.map((c,i) => (
              <div className="comment-item" key={i}>
                <img src={AV('c'+i)} alt=""/>
                <div><span className="cn">회원{i+1}</span><span className="ct">방금</span><div className="cb">{c}</div></div>
              </div>
            ))}
            <div className="comment-input-row">
              <input value={commentInput} onChange={e=>setCommentInput(e.target.value)} placeholder="댓글을 입력하세요" onKeyDown={e=>{if(e.key==='Enter') addComment();}}/>
              <button className="icon-btn" onClick={addComment}><Icon name="send" size={16}/></button>
            </div>
          </div>
        </div>
      )}

      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
