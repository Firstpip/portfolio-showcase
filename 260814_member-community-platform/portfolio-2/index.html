<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이너서클 통합 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root{
  --primary:#d4c7ff;
  --primary-ink:#292827;
  --secondary:#e3e3e2;
  --accent:#f6bc1e;
  --wine:#421d24;
  --lagoon:#0c4243;
  --bg:#f2f0eb;
  --surface:#ffffff;
  --text:#292827;
  --text2:#666666;
  --line:#e3e3e2;
  --radius:14px;
  --radius-sm:8px;
  --shadow-flat:0 1px 2px rgba(41,40,39,.06);
  --shadow-pop:rgba(0,0,0,.08) 0px 0px 0px 1px, rgba(0,0,0,.14) 0px 8px 32px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d8d5cd;border-radius:8px;}

.shell{display:flex;width:100%;min-height:100vh;}

/* ---- Tree sidebar ---- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:#fbfaf7;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;}
.sidebar-brand{padding:16px 14px 10px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--text);}
.sidebar-brand .sb-dot{width:22px;height:22px;border-radius:6px;background:var(--wine);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
.sidebar-brand i{margin-left:auto;font-size:14px;color:var(--text2);}
.sidebar-search{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;}
.sb-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);font-size:13px;text-align:left;width:100%;}
.sb-btn:hover{background:#eeece5;}
.tree-nav{flex:1;overflow-y:auto;padding:6px 8px;}
.tree-item{display:flex;align-items:center;gap:6px;border-radius:var(--radius-sm);padding:6px 8px;font-size:13.5px;color:var(--text);}
.tree-item:hover{background:#eeece5;}
.tree-item.active{background:var(--primary);}
.tree-toggle{width:16px;height:16px;background:none;border:none;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;font-size:10px;}
.tree-toggle.collapsed{transform:rotate(-90deg);}
.tree-toggle-placeholder{width:16px;flex-shrink:0;}
.tree-icon{font-size:14px;color:var(--text2);flex-shrink:0;width:16px;text-align:center;}
.tree-label{background:none;border:none;color:inherit;font:inherit;text-align:left;flex:1;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .12s;}
.tree-count{font-size:11px;color:var(--text2);background:#eceae3;border-radius:999px;padding:1px 7px;flex-shrink:0;}
.sidebar-footer{padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
.footer-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);border:none;background:none;font-size:12.5px;color:var(--text2);text-align:left;width:100%;}
.footer-link:hover{background:#eeece5;}

/* ---- main wrap ---- */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);}
.crumb b{color:var(--text);font-weight:600;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tb-icon{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.tb-icon:hover{background:#f4f3ef;}
.tb-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;border:none;padding:0;}
.tb-avatar img{width:100%;height:100%;display:block;}

.content-row{flex:1;display:flex;min-height:0;}

/* ---- page (block content) ---- */
.page{flex:1;min-width:0;overflow-y:auto;padding-bottom:60px;}
.page-cover{width:100%;height:120px;background:linear-gradient(120deg, var(--primary) 0%, var(--accent) 100%);position:relative;overflow:hidden;}
.page-cover::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.25);top:-90px;right:60px;}
.page-cover::before{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(66,29,36,.12);bottom:-70px;left:120px;}
.page-body{max-width:840px;margin:0 auto;padding:22px 32px 0;}
.page-icon-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:-26px;margin-bottom:8px;}
.page-icon-large{font-size:44px;line-height:1;background:var(--surface);border-radius:14px;width:76px;height:76px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-flat);border:1px solid var(--line);}
.page-meta{display:flex;gap:6px;}
.meta-action{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;}
.meta-action:hover{background:#f4f3ef;}
.page-title{font-size:34px;font-weight:700;letter-spacing:-0.01em;margin:6px 0 6px;color:var(--text);}
.page-sub{font-size:14px;color:var(--text2);margin:0 0 22px;line-height:1.6;max-width:640px;}

.block-list{display:flex;flex-direction:column;}
.block{position:relative;padding:4px 0 4px 4px;margin-bottom:2px;animation:fadeIn .4s ease both;}
.block-text p{font-size:15px;line-height:1.6;margin:0;color:var(--text);}
.block-heading h2{font-size:21px;font-weight:700;margin:22px 0 6px;color:var(--text);}
.block-divider hr{border:none;border-top:1px solid var(--line);margin:18px 0;}
.block-callout{display:flex;gap:10px;background:#faf6e8;border-radius:var(--radius-sm);padding:12px 14px;margin:10px 0;}
.block-callout i{font-size:16px;color:#a97b00;flex-shrink:0;margin-top:1px;}
.block-callout p{margin:0;font-size:13.5px;line-height:1.55;color:#5b4a1e;}
.block-toggle{margin:6px 0;}
.toggle-summary-row{display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 4px;font-size:14.5px;font-weight:600;color:var(--text);width:100%;text-align:left;}
.toggle-arrow{font-size:11px;color:var(--text2);transition:transform .15s;flex-shrink:0;}
.toggle-arrow.open{transform:rotate(90deg);}
.toggle-content{padding:8px 4px 4px 22px;font-size:13.5px;color:var(--text2);line-height:1.7;animation:slideDown .2s ease;overflow:hidden;}
.block-table{margin:10px 0;overflow-x:auto;}
.block-table table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;font-size:13px;}
.block-table th{background:#f6f5f1;text-align:left;padding:9px 12px;font-weight:600;color:var(--text2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);}
.block-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text);}
.block-table tr:last-child td{border-bottom:none;}
.block-table tr.clickable{cursor:pointer;transition:background .15s;animation:fadeIn .4s ease both;}
.block-table tr.clickable:hover{background:#faf9f6;}
.block-list-b{margin:8px 0;padding-left:20px;font-size:13.5px;color:var(--text);line-height:1.9;}
.block-checklist{margin:8px 0;display:flex;flex-direction:column;gap:6px;}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.chk-box{width:16px;height:16px;border:1.5px solid var(--secondary);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.chk-box.done{background:var(--wine);border-color:var(--wine);color:#fff;font-size:10px;}
.chk-row.done span{text-decoration:line-through;color:var(--text2);}

.status-pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-block;}
.status-pill.draft{background:#eceae3;color:#5c5a52;}
.status-pill.published{background:#e3f3e6;color:#1f7a3d;}
.status-pill.archived{background:#f0ddd0;color:#8a4a1e;}
.status-pill.pending{background:#fff2cf;color:#8a6100;}
.status-pill.done{background:#e3f3e6;color:#1f7a3d;}
.status-pill.blind{background:#fde2e2;color:#a12e2e;}
.status-pill.masked{background:#e7e2fb;color:#4a3894;}

.add-block-btn{display:flex;align-items:center;gap:8px;color:var(--text2);background:none;border:1px dashed var(--secondary);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-top:14px;width:100%;justify-content:center;}
.add-block-btn:hover{background:#f4f3ef;}
.slash-menu{position:relative;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:8px;animation:fadeIn .15s ease;}
.slash-group-title{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;}
.slash-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13.5px;border:none;background:none;width:100%;text-align:left;color:var(--text);}
.slash-item:hover{background:#f4f3ef;}
.slash-item i{width:16px;color:var(--text2);}

.form-row{display:flex;flex-direction:column;gap:4px;margin:10px 0;}
.form-row label{font-size:11.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;}
.form-row input, .form-row textarea, .form-row select{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;outline:none;background:#fff;}
.form-row textarea{min-height:80px;resize:vertical;}
.btn{border-radius:var(--radius-sm);padding:9px 16px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine);}
.btn.lilac{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
.btn.ghost{background:transparent;}
.btn-row{display:flex;gap:8px;margin-top:14px;}
.grade-select{border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 8px;font-size:12.5px;background:#fff;}

/* ---- right inspector panel ---- */
.right-panel{width:296px;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:20px 18px;}
.rp-title{font-size:11.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;}
.rp-card{background:#f9f8f5;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.rp-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);}
.rp-row:first-child{border-top:none;}
.rp-row span:first-child{color:var(--text2);}
.rp-empty{font-size:13px;color:var(--text2);text-align:center;padding:30px 10px;line-height:1.6;}
.rp-quick-btn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.rp-quick-btn:hover{background:#f4f3ef;transform:scale(1.02);}
.tree-label:hover{transform:scale(1.02);}
.meta-action:hover{transform:scale(1.03);}
.rp-quick-btn i{color:var(--text2);}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideDown{from{opacity:0;max-height:0;}to{opacity:1;max-height:200px;}}
@keyframes toastSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes popScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}

.overlay{position:fixed;inset:0;background:rgba(41,40,39,.4);z-index:100;display:flex;align-items:center;justify-content:center;animation:overlayIn .18s ease;}
.modal{background:#fff;border-radius:16px;width:420px;max-width:92vw;padding:22px;box-shadow:var(--shadow-pop);animation:popScale .2s ease;}
.modal h3{font-size:16px;font-weight:700;margin:0 0 6px;}
.modal p{font-size:13px;color:var(--text2);margin:0 0 16px;line-height:1.55;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:200;animation:toastSlide .25s ease;display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const AV = (seed) => `https://source.boringavatars.com/beam/64/${encodeURIComponent(seed)}?colors=421d24,714cb6,d4c7ff,f6bc1e,292827`;

function Icon({name, className=''}){
  return <i className={"ti ti-"+name+" "+className}></i>;
}
function Toast({msg}){
  if(!msg) return null;
  return <div className="toast"><Icon name="circle-check"/>{msg}</div>;
}

function Toggle({title, children, defaultOpen}){
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className="block block-toggle" data-block-type="toggle">
      <button className="toggle-summary-row" onClick={()=>setOpen(o=>!o)}>
        <Icon name="chevron-right" className={"toggle-arrow"+(open?' open':'')}/>{title}
      </button>
      {open && <div className="toggle-content">{children}</div>}
    </div>
  );
}

const TREE = [
  {id:'g-member', label:'회원관리', icon:'users', depth:0, page:'member-management', children:[
    {id:'member-list', label:'회원 목록', icon:'address-book', depth:1, page:'member-management'},
    {id:'member-grade', label:'등급 관리', icon:'stairs', depth:1, page:'member-management'},
  ]},
  {id:'g-content', label:'콘텐츠 관리', icon:'file-text', depth:0, page:'main', children:[
    {id:'notice-cms', label:'공지사항 CMS', icon:'speakerphone', depth:1, page:'notice-cms', children:[
      {id:'notice-history', label:'발행 이력', icon:'history', depth:2, page:'notice-cms'},
    ]},
    {id:'block-lib', label:'블록 라이브러리', icon:'stack-2', depth:1, page:'notice-cms'},
  ]},
  {id:'g-report', label:'신고 & 로그', icon:'flag', depth:0, page:'report-log', children:[
    {id:'report-log', label:'신고처리 & 활동로그', icon:'shield-exclamation', depth:1, page:'report-log'},
  ]},
  {id:'g-security', label:'보안 & 백업', icon:'lock', depth:0, page:'privacy-security', children:[
    {id:'privacy-security', label:'개인정보 마스킹 & 암호화 백업', icon:'shield-lock', depth:1, page:'privacy-security'},
  ]},
];

const NOTICES_INIT = [
  {id:1, title:'8월 정기 오프모임 신청 안내', status:'published', grade:'전체', updated:'2026.08.13'},
  {id:2, title:'서버 점검 예정 공지 (8/20 새벽)', status:'draft', grade:'전체', updated:'2026.08.13'},
  {id:3, title:'우수회원 대상 스터디 지원 프로그램', status:'published', grade:'우수회원', updated:'2026.08.10'},
  {id:4, title:'2026년 상반기 커뮤니티 회고록', status:'archived', grade:'전체', updated:'2026.07.02'},
];

const REPORTS_INIT = [
  {id:1, reporter:'김민수', target:'커뮤니티 첫 인사드려요', reason:'스팸/광고', date:'2026.08.13', status:'pending'},
  {id:2, reporter:'이지은', target:'등급업 조건이 궁금합니다', reason:'욕설/비방', date:'2026.08.12', status:'pending'},
  {id:3, reporter:'박서준', target:'주말 스터디 인원 모집합니다', reason:'중복 게시', date:'2026.08.11', status:'done'},
];
const ACTIVITY_LOG = [
  '운영진 — 신고 #102 블라인드 처리 (2026.08.12 14:02)',
  '운영진 — 회원 문지훈 승인 (2026.08.11 09:41)',
  '운영진 — 공지 "서버 점검" 임시저장 (2026.08.13 08:15)',
  '운영진 — 등급 변경: 김민수 → 우수회원 (2026.08.09 17:20)',
];

const BACKUP_LOG = [
  {id:1, date:'2026.08.13 03:00', status:'done', size:'482MB'},
  {id:2, date:'2026.08.12 03:00', status:'done', size:'471MB'},
  {id:3, date:'2026.08.11 03:00', status:'done', size:'468MB'},
];

const MEMBERS_INIT = [
  {id:1, name:'김민수', email:'min***@ins.kr', grade:'우수회원', joined:'2026.03.02', status:'approved'},
  {id:2, name:'이지은', email:'jie***@ins.kr', grade:'일반회원', joined:'2026.05.18', status:'approved'},
  {id:3, name:'윤도현', email:'doh***@ins.kr', grade:'일반회원', joined:'2026.08.13', status:'pending'},
  {id:4, name:'박서준', email:'seo***@ins.kr', grade:'우수회원', joined:'2026.02.11', status:'approved'},
  {id:5, name:'서지우', email:'jiw***@ins.kr', grade:'일반회원', joined:'2026.08.13', status:'pending'},
];

function App(){
  const [view, setView] = useState('main');
  const [expanded, setExpanded] = useState({'g-member':true,'g-content':true,'g-report':true,'g-security':true,'notice-cms':true});
  const [toast, setToast] = useState('');
  const [selected, setSelected] = useState(null);
  const [notices, setNotices] = useState(NOTICES_INIT);
  const [reports, setReports] = useState(REPORTS_INIT);
  const [members, setMembers] = useState(MEMBERS_INIT);
  const [backupCycle, setBackupCycle] = useState('매일');
  const [checklist, setChecklist] = useState([
    {t:'승인 대기 회원 검토', done:false},
    {t:'신고 접수 건 확인', done:false},
    {t:'서버 점검 공지 발행', done:true},
  ]);
  const [draftTitle, setDraftTitle] = useState('');
  const [draftBody, setDraftBody] = useState('');
  const [slashOpen, setSlashOpen] = useState(false);
  const [extraBlocks, setExtraBlocks] = useState([]);
  const [confirmBlind, setConfirmBlind] = useState(null);

  function showToast(msg){ setToast(msg); setTimeout(()=>setToast(''), 2200); }
  function toggleExpand(id){ setExpanded(e=>({...e,[id]:!e[id]})); }
  function selectItem(kind, item){ setSelected({kind, item}); }
  function toggleChecklist(i){ setChecklist(c=>c.map((x,idx)=>idx===i?{...x,done:!x.done}:x)); }

  function publishNotice(){
    if(!draftTitle.trim()){ showToast('제목을 입력해주세요'); return; }
    setNotices(n => [{id:Date.now(), title:draftTitle, status:'published', grade:'전체', updated:'방금'}, ...n]);
    setDraftTitle(''); setDraftBody('');
    showToast('공지가 발행되었습니다');
  }
  function saveDraft(){
    if(!draftTitle.trim()){ showToast('제목을 입력해주세요'); return; }
    setNotices(n => [{id:Date.now(), title:draftTitle, status:'draft', grade:'전체', updated:'방금'}, ...n]);
    showToast('임시저장되었습니다');
  }
  function cycleNoticeStatus(id){
    setNotices(n => n.map(x => x.id===id ? {...x, status: x.status==='draft'?'published':(x.status==='published'?'archived':'draft')} : x));
  }
  function resolveReport(id, action){
    if(action==='blind'){ setConfirmBlind(id); return; }
    setReports(r => r.map(x => x.id===id ? {...x, status:'done'} : x));
    showToast('신고를 반려 처리했습니다');
  }
  function confirmBlindAction(){
    setReports(r => r.map(x => x.id===confirmBlind ? {...x, status:'done'} : x));
    showToast('게시글을 블라인드 처리했습니다 (원본 보존)');
    setConfirmBlind(null);
  }
  function changeGrade(id, grade){
    setMembers(m => m.map(x => x.id===id ? {...x, grade} : x));
    showToast('회원 등급이 변경되었습니다');
  }
  function approveMember(id){
    setMembers(m => m.map(x => x.id===id ? {...x, status:'approved'} : x));
    showToast('회원 가입을 승인했습니다');
  }
  function insertBlock(type){
    setExtraBlocks(b => [...b, {id:Date.now(), type}]);
    setSlashOpen(false);
    showToast('블록이 추가되었습니다');
  }
  function runBackupNow(){
    showToast('암호화 백업을 시작합니다');
  }

  useEffect(()=>{ setExtraBlocks([]); setSelected(null); }, [view]);

  function renderTreeItem(node){
    const hasChildren = node.children && node.children.length>0;
    const isExpanded = expanded[node.id];
    const style = node.depth===1 ? {paddingLeft:'28px'} : node.depth===2 ? {paddingLeft:'56px'} : {};
    return (
      <React.Fragment key={node.id}>
        <div className={"tree-item"+(view===node.page?' active':'')} style={style}>
          {hasChildren ? (
            <button className={"tree-toggle"+(isExpanded?'':' collapsed')} onClick={()=>toggleExpand(node.id)}><Icon name="chevron-down"/></button>
          ) : <span className="tree-toggle-placeholder"></span>}
          <span className="tree-icon"><Icon name={node.icon}/></span>
          <button className="tree-label" onClick={()=>setView(node.page)}>{node.label}</button>
        </div>
        {hasChildren && isExpanded && node.children.map(c => renderTreeItem(c))}
      </React.Fragment>
    );
  }

  const crumbMap = {
    'main':['운영센터','대시보드'],
    'member-management':['운영센터','회원관리'],
    'notice-cms':['운영센터','콘텐츠 관리','공지사항 CMS'],
    'report-log':['운영센터','신고 & 로그','신고처리 & 활동로그'],
    'privacy-security':['운영센터','보안 & 백업','개인정보 마스킹 & 암호화 백업'],
  };
  const pageIcon = {'main':'📋','member-management':'👥','notice-cms':'📢','report-log':'🚩','privacy-security':'🔒'}[view];
  const pageTitle = {'main':'관리자 통합 운영 콘솔','member-management':'회원 관리','notice-cms':'공지사항 CMS','report-log':'신고처리 & 활동로그','privacy-security':'개인정보 마스킹 & 암호화 백업'}[view];

  return (
    <div className="shell" data-archetype="notion-blocks-tree">
      <aside className="sidebar tree-sidebar">
        <div className="sidebar-brand"><span className="sb-dot">이너</span>이너서클 운영센터<Icon name="chevron-down"/></div>
        <div className="sidebar-search">
          <button className="sb-btn" onClick={()=>showToast('검색창을 엽니다')}><Icon name="search"/>검색</button>
          <button className="sb-btn" onClick={()=>{setView('notice-cms'); showToast('새 페이지를 생성했습니다');}}><Icon name="plus"/>새 페이지</button>
        </div>
        <nav className="tree-nav">
          {TREE.map(n => renderTreeItem(n))}
        </nav>
        <div className="sidebar-footer">
          <button className="footer-link" onClick={()=>showToast('휴지통이 비어있습니다')}><Icon name="trash"/>휴지통</button>
          <button className="footer-link" onClick={()=>showToast('설정 화면으로 이동합니다')}><Icon name="settings"/>설정</button>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="topbar">
          <div className="crumb">
            {crumbMap[view].map((c,i)=>(
              <React.Fragment key={i}>
                {i>0 && <Icon name="chevron-right"/>}
                {i===crumbMap[view].length-1 ? <b>{c}</b> : <span>{c}</span>}
              </React.Fragment>
            ))}
          </div>
          <div className="topbar-right">
            <button className="tb-icon" onClick={()=>showToast('알림이 없습니다')}><Icon name="bell"/></button>
            <button className="tb-icon" onClick={()=>setView('main')}><Icon name="layout-dashboard"/></button>
            <button className="tb-avatar" onClick={()=>showToast('프로필 메뉴')}><img src={AV('admin')} alt="관리자" style={{borderRadius:999}}/></button>
          </div>
        </header>

        <div className="content-row">
          <main className="page">
            {view==='main' && <div className="page-cover"></div>}
            <div className="page-body">
              <div className="page-icon-row">
                <div className="page-icon-large">{pageIcon}</div>
                <div className="page-meta">
                  <button className="meta-action" onClick={()=>showToast('아이콘을 변경합니다')}><Icon name="mood-smile"/>아이콘</button>
                  <button className="meta-action" onClick={()=>showToast('댓글 패널을 엽니다')}><Icon name="message-circle"/>댓글</button>
                </div>
              </div>
              <h1 className="page-title">{pageTitle}</h1>

              {view==='main' && (
                <React.Fragment>
                  <p className="page-sub">회원관리·공지사항·신고처리·활동로그를 트리형 콘텐츠 구조로 통합 관리하는 백오피스 메인 화면입니다.</p>
                  <div className="block-list">
                    <div className="block block-text" data-block-type="text"><p>운영 현황을 한눈에 확인하고, 좌측 트리에서 세부 페이지로 이동할 수 있습니다.</p></div>
                    <div className="block block-heading" data-block-type="heading"><h2>이번 주 운영 현황</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table><thead><tr><th>지표</th><th>값</th></tr></thead><tbody>
                        <tr><td>승인 대기</td><td>{members.filter(m=>m.status==='pending').length}건</td></tr>
                        <tr><td>신고 접수</td><td>{reports.filter(r=>r.status==='pending').length}건</td></tr>
                        <tr><td>신규가입 (오늘)</td><td>12명</td></tr>
                        <tr><td>발행 대기 공지</td><td>{notices.filter(n=>n.status==='draft').length}건</td></tr>
                      </tbody></table>
                    </div>
                    <div className="block block-callout" data-block-type="callout"><Icon name="alert-triangle"/><p>초기 회원 70명 기준으로 구축하되, 향후 3,000~4,000명 규모까지 확장 가능한 인프라 체크리스트를 함께 준비합니다.</p></div>
                    <Toggle title="최근 처리 로그" defaultOpen={true}>
                      {ACTIVITY_LOG.slice(0,3).map((l,i)=><div key={i} style={{padding:'3px 0'}}>{l}</div>)}
                    </Toggle>
                    <div className="block block-divider" data-block-type="divider"><hr/></div>
                    <div className="block block-heading" data-block-type="heading"><h2>등급별 회원 분포</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table><thead><tr><th>등급</th><th>인원</th></tr></thead><tbody>
                        <tr><td>일반회원</td><td>132명</td></tr>
                        <tr><td>우수회원</td><td>41명</td></tr>
                        <tr><td>운영진</td><td>5명</td></tr>
                      </tbody></table>
                    </div>
                    <div className="block block-heading" data-block-type="heading"><h2>오늘의 운영 체크리스트</h2></div>
                    <div className="block block-checklist" data-block-type="checklist">
                      {checklist.map((c,i)=>(
                        <div className={"chk-row"+(c.done?' done':'')} key={i}>
                          <button className={"chk-box"+(c.done?' done':'')} onClick={()=>toggleChecklist(i)}>{c.done?'✓':''}</button>
                          <span>{c.t}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </React.Fragment>
              )}

              {view==='notice-cms' && (
                <React.Fragment>
                  <p className="page-sub">공지 콘텐츠를 블록 단위로 작성·발행하고, 등급별 노출 범위를 관리합니다.</p>
                  <div className="block-list">
                    <div className="block block-heading" data-block-type="heading"><h2>공지 작성</h2></div>
                    <div className="block block-text" data-block-type="text">
                      <div className="form-row"><label>제목</label><input value={draftTitle} onChange={e=>setDraftTitle(e.target.value)} placeholder="공지 제목을 입력하세요"/></div>
                      <div className="form-row"><label>본문</label><textarea value={draftBody} onChange={e=>setDraftBody(e.target.value)} placeholder="블록 콘텐츠를 입력하세요"></textarea></div>
                      <div className="btn-row">
                        <button className="btn" onClick={saveDraft}><Icon name="device-floppy"/>임시저장</button>
                        <button className="btn primary" onClick={publishNotice}><Icon name="send"/>발행</button>
                      </div>
                    </div>
                    <Toggle title="사용 가능한 블록 타입">
                      텍스트 · 제목 · 토글 · 콜아웃 · 표 · 구분선 · 체크리스트 (총 7종)
                    </Toggle>
                    <div className="block block-callout" data-block-type="callout"><Icon name="alert-triangle"/><p>발행 대상 등급을 설정하면 해당 등급 이하 회원에게는 노출되지 않습니다.</p></div>
                    <div className="block block-divider" data-block-type="divider"><hr/></div>
                    <div className="block block-heading" data-block-type="heading"><h2>발행 상태 관리</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table>
                        <thead><tr><th>제목</th><th>등급</th><th>상태</th><th>최종수정</th></tr></thead>
                        <tbody>
                          {notices.map((n,i)=>(
                            <tr className="clickable" key={n.id} style={{animationDelay:(i*0.04)+'s'}} onClick={()=>{selectItem('notice', n); cycleNoticeStatus(n.id);}}>
                              <td>{n.title}</td>
                              <td>{n.grade}</td>
                              <td><span className={"status-pill "+n.status}>{n.status==='draft'?'임시저장':n.status==='published'?'발행중':'보관'}</span></td>
                              <td>{n.updated}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {extraBlocks.map(b => (
                      <div className="block block-text" data-block-type="text" key={b.id}><p>새로 추가된 {b.type} 블록입니다. 내용을 자유롭게 입력할 수 있습니다.</p></div>
                    ))}
                    {slashOpen && (
                      <div className="slash-menu">
                        <div className="slash-group-title">블록 삽입</div>
                        <button className="slash-item" onClick={()=>insertBlock('텍스트')}><Icon name="align-left"/>텍스트</button>
                        <button className="slash-item" onClick={()=>insertBlock('콜아웃')}><Icon name="message-2"/>콜아웃</button>
                        <button className="slash-item" onClick={()=>insertBlock('표')}><Icon name="table"/>표</button>
                      </div>
                    )}
                    <button className="add-block-btn" onClick={()=>setSlashOpen(o=>!o)}><Icon name="plus"/>블록 추가 (/ 명령)</button>
                  </div>
                </React.Fragment>
              )}

              {view==='report-log' && (
                <React.Fragment>
                  <p className="page-sub">회원이 신고한 게시글·댓글을 심사하고 관리자 조치 이력을 추적합니다.</p>
                  <div className="block-list">
                    <div className="block block-heading" data-block-type="heading"><h2>신고 접수 큐</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table>
                        <thead><tr><th>신고자</th><th>대상 게시글</th><th>사유</th><th>접수일</th><th>상태</th><th>처리</th></tr></thead>
                        <tbody>
                          {reports.map((r,i)=>(
                            <tr key={r.id} style={{animationDelay:(i*0.05)+'s'}} className="clickable" onClick={()=>selectItem('report', r)}>
                              <td>{r.reporter}</td><td>{r.target}</td><td>{r.reason}</td><td>{r.date}</td>
                              <td><span className={"status-pill "+(r.status==='done'?'done':'pending')}>{r.status==='done'?'처리완료':'대기중'}</span></td>
                              <td onClick={e=>e.stopPropagation()}>
                                <button className="btn ghost" disabled={r.status==='done'} onClick={()=>resolveReport(r.id,'blind')} style={{marginRight:6,padding:'5px 10px',fontSize:12}}>블라인드</button>
                                <button className="btn ghost" disabled={r.status==='done'} onClick={()=>resolveReport(r.id,'reject')} style={{padding:'5px 10px',fontSize:12}}>반려</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div className="block block-callout" data-block-type="callout"><Icon name="alert-triangle"/><p>블라인드 처리 시 원본 콘텐츠는 데이터베이스에 보존되며, 피드 노출만 즉시 차단됩니다.</p></div>
                    <div className="block block-divider" data-block-type="divider"><hr/></div>
                    <div className="block block-heading" data-block-type="heading"><h2>활동 로그</h2></div>
                    <Toggle title="관리자 조치 이력" defaultOpen={true}>
                      {ACTIVITY_LOG.map((l,i)=><div key={i} style={{padding:'3px 0'}}>{l}</div>)}
                    </Toggle>
                    <ul className="block block-list-b" data-block-type="list">
                      <li>최근 조치: 신고 #{reports[0].id} 검토중</li>
                      <li>이번 주 총 조치 건수: {ACTIVITY_LOG.length}건</li>
                    </ul>
                  </div>
                </React.Fragment>
              )}

              {view==='privacy-security' && (
                <React.Fragment>
                  <p className="page-sub">회원 개인정보를 서버 측에서 마스킹 처리하고, 데이터를 주기적으로 암호화 백업합니다.</p>
                  <div className="block-list">
                    <div className="block block-heading" data-block-type="heading"><h2>필드별 마스킹 규칙</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table>
                        <thead><tr><th>필드</th><th>마스킹 패턴</th><th>표시 예시</th></tr></thead>
                        <tbody>
                          <tr><td>전화번호</td><td>가운데 4자리 마스킹</td><td><span className="status-pill masked">010-****-1234</span></td></tr>
                          <tr><td>이메일</td><td>아이디 일부 마스킹</td><td><span className="status-pill masked">min***@ins.kr</span></td></tr>
                          <tr><td>실명</td><td>가운데 글자 마스킹</td><td><span className="status-pill masked">김*수</span></td></tr>
                        </tbody>
                      </table>
                    </div>
                    <div className="block block-callout" data-block-type="callout"><Icon name="alert-triangle"/><p>최고 관리자 권한으로만 마스킹 해제 원본 조회가 가능하며, 조회 시 감사 로그에 자동 기록됩니다.</p></div>
                    <div className="block block-divider" data-block-type="divider"><hr/></div>
                    <div className="block block-heading" data-block-type="heading"><h2>암호화 백업</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table>
                        <thead><tr><th>일시</th><th>상태</th><th>크기</th></tr></thead>
                        <tbody>
                          {BACKUP_LOG.map((b,i)=>(
                            <tr key={b.id} className="clickable" style={{animationDelay:(i*0.05)+'s'}} onClick={()=>selectItem('backup', b)}>
                              <td>{b.date}</td><td><span className="status-pill done">완료</span></td><td>{b.size}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <Toggle title="백업 주기 설정">
                      <div className="form-row" style={{maxWidth:200}}>
                        <label>백업 주기</label>
                        <select value={backupCycle} onChange={e=>{setBackupCycle(e.target.value); showToast('백업 주기가 변경되었습니다');}}>
                          <option>매일</option><option>매주</option>
                        </select>
                      </div>
                      <button className="btn primary" style={{marginTop:8}} onClick={runBackupNow}><Icon name="database-export"/>지금 백업 실행</button>
                    </Toggle>
                    <ul className="block block-list-b" data-block-type="list">
                      <li>최근 백업: {BACKUP_LOG[0].date}</li>
                      <li>백업 보관 주기: 90일</li>
                    </ul>
                  </div>
                </React.Fragment>
              )}

              {view==='member-management' && (
                <React.Fragment>
                  <p className="page-sub">전체 회원 목록을 조회하고 등급 변경, 승인 처리를 관리합니다.</p>
                  <div className="block-list">
                    <div className="block block-heading" data-block-type="heading"><h2>회원 목록</h2></div>
                    <div className="block block-table" data-block-type="table">
                      <table>
                        <thead><tr><th>이름</th><th>이메일</th><th>등급</th><th>가입일</th><th>상태</th><th>처리</th></tr></thead>
                        <tbody>
                          {members.map((m,i)=>(
                            <tr key={m.id} style={{animationDelay:(i*0.05)+'s'}} className="clickable" onClick={()=>selectItem('member', m)}>
                              <td>{m.name}</td><td>{m.email}</td>
                              <td onClick={e=>e.stopPropagation()}>
                                <select className="grade-select" value={m.grade} onChange={e=>changeGrade(m.id, e.target.value)}>
                                  <option>일반회원</option><option>우수회원</option><option>운영진</option>
                                </select>
                              </td>
                              <td>{m.joined}</td>
                              <td><span className={"status-pill "+(m.status==='approved'?'done':'pending')}>{m.status==='approved'?'승인됨':'대기중'}</span></td>
                              <td onClick={e=>e.stopPropagation()}>
                                {m.status==='pending' && <button className="btn lilac" style={{padding:'5px 10px',fontSize:12}} onClick={()=>approveMember(m.id)}>승인</button>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div className="block block-callout" data-block-type="callout"><Icon name="alert-triangle"/><p>승인 대기 회원은 노란색 배지로 강조 표시되며, 목록 상단에 우선 노출됩니다.</p></div>
                    <Toggle title="등급 변경 이력">
                      <div>운영진 — 등급 변경: 김민수 → 우수회원 (2026.08.09)</div>
                      <div>운영진 — 등급 변경: 박서준 → 우수회원 (2026.07.22)</div>
                    </Toggle>
                  </div>
                </React.Fragment>
              )}
            </div>
          </main>

          <aside className="right-panel">
            <div className="rp-title">인스펙터</div>
            {!selected && (
              <div className="rp-card"><div className="rp-empty"><Icon name="pointer"/><br/>표에서 항목을 선택하면<br/>세부 정보가 표시됩니다</div></div>
            )}
            {selected && selected.kind==='notice' && (
              <div className="rp-card">
                <div className="rp-row"><span>제목</span><span>{selected.item.title}</span></div>
                <div className="rp-row"><span>상태</span><span className={"status-pill "+selected.item.status}>{selected.item.status}</span></div>
                <div className="rp-row"><span>대상 등급</span><span>{selected.item.grade}</span></div>
                <div className="rp-row"><span>수정일</span><span>{selected.item.updated}</span></div>
              </div>
            )}
            {selected && selected.kind==='report' && (
              <div className="rp-card">
                <div className="rp-row"><span>신고자</span><span>{selected.item.reporter}</span></div>
                <div className="rp-row"><span>대상</span><span>{selected.item.target}</span></div>
                <div className="rp-row"><span>사유</span><span>{selected.item.reason}</span></div>
                <div className="rp-row"><span>접수일</span><span>{selected.item.date}</span></div>
              </div>
            )}
            {selected && selected.kind==='member' && (
              <div className="rp-card">
                <div className="rp-row"><span>이름</span><span>{selected.item.name}</span></div>
                <div className="rp-row"><span>등급</span><span>{selected.item.grade}</span></div>
                <div className="rp-row"><span>가입일</span><span>{selected.item.joined}</span></div>
                <div className="rp-row"><span>상태</span><span>{selected.item.status}</span></div>
              </div>
            )}
            {selected && selected.kind==='backup' && (
              <div className="rp-card">
                <div className="rp-row"><span>일시</span><span>{selected.item.date}</span></div>
                <div className="rp-row"><span>크기</span><span>{selected.item.size}</span></div>
                <div className="rp-row"><span>암호화</span><span>AES-256</span></div>
              </div>
            )}
            <div className="rp-title" style={{marginTop:4}}>빠른 작업</div>
            <button className="rp-quick-btn" onClick={()=>setView('member-management')}><Icon name="user-check"/>승인 대기 {members.filter(m=>m.status==='pending').length}건 처리하기</button>
            <button className="rp-quick-btn" onClick={()=>setView('report-log')}><Icon name="shield-exclamation"/>신고 대기 {reports.filter(r=>r.status==='pending').length}건 검토하기</button>
            <button className="rp-quick-btn" onClick={runBackupNow}><Icon name="database-export"/>지금 백업 실행</button>
            <div className="rp-title" style={{marginTop:10}}>권한</div>
            <div className="rp-card">
              <div className="rp-row"><span>역할</span><span>최고 관리자</span></div>
              <div className="rp-row"><span>마지막 로그인</span><span>방금 전</span></div>
            </div>
          </aside>
        </div>
      </div>

      {confirmBlind && (
        <div className="overlay" onClick={()=>setConfirmBlind(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>블라인드 처리</h3>
            <p>선택한 게시글을 블라인드 처리합니다. 원본은 데이터베이스에 보존되며 관리자만 복원할 수 있습니다.</p>
            <div className="modal-actions">
              <button className="btn ghost" onClick={()=>setConfirmBlind(null)}>취소</button>
              <button className="btn primary" onClick={confirmBlindAction}>블라인드 확정</button>
            </div>
          </div>
        </div>
      )}

      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
