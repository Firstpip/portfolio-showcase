<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 자세 분석 트레이닝 대시보드 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --primary:#918df6; --secondary:#9580ff; --accent:#ff3e00;
  --bg:#fafafa; --surface:#ffffff; --linen:#f5f5f5;
  --text:#181925; --text-2:#666666; --ash:#999999; --fog:#e8e8e8;
  --mint:#33c758; --mint-wash:#def6e4; --amber:#ffa600; --sky:#2c78fc;
  --radius-card:16px; --radius-pill:9999px; --radius-input:8px;
  --shadow-subtle:0 1px 1px 1px rgba(0,0,0,.08), 0 0 0 0.5px rgba(0,0,0,.06);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text); width:100%; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--fog);border-radius:8px;}

/* ---------- keyframes ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,62,0,.5);}70%{box-shadow:0 0 0 9px rgba(255,62,0,0);}100%{box-shadow:0 0 0 0 rgba(255,62,0,0);}}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
@keyframes toastSlide{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes sweepArc{from{stroke-dashoffset:220;}to{stroke-dashoffset:40;}}
@keyframes ringPop{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}

.fade-up{animation:fadeInUp .5s ease both;}
.rec-dot{animation:pulseDot 1.6s infinite;}
.skeleton-shimmer{background:linear-gradient(90deg,#eee 0px,#f7f7f7 40px,#eee 80px);background-size:800px 100%;animation:shimmer 1.4s infinite linear;}
.toast-anim{animation:toastSlide .35s cubic-bezier(.2,.8,.3,1) both;}
.arc-sweep{animation:sweepArc 1.6s ease-out both;}
.ring-pop{animation:ringPop .4s ease both;}

/* ---------- app chrome ---------- */
.app-header{
  position:sticky; top:0; z-index:40; height:64px;
  background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--fog);
  display:flex; align-items:center; gap:20px; padding:0 28px;
  width:100%;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; letter-spacing:-.02em; flex-shrink:0;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;}
.project-switcher{
  display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-2);
  background:var(--linen); padding:6px 12px; border-radius:var(--radius-pill); border:none; flex-shrink:0;
}
.global-nav{display:flex; align-items:center; gap:4px; flex:1; min-width:0; overflow-x:auto;}
.nav-link{
  border:none; background:transparent; padding:8px 14px; border-radius:var(--radius-pill);
  font-size:13.5px; font-weight:500; color:var(--text-2); white-space:nowrap; transition:.15s;
}
.nav-link.active{background:var(--text); color:#fff;}
.nav-link:hover:not(.active){background:var(--linen); color:var(--text);}
.header-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--fog);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;
}
.icon-btn:hover{border-color:var(--primary); color:var(--primary);}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--secondary),var(--sky));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}

.page-wrap{width:100%; max-width:1280px; margin:0 auto; padding:28px 28px 80px;}

.tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--fog); margin-bottom:24px; overflow-x:auto;}
.tab{
  border:none; background:transparent; padding:12px 4px; margin-right:22px;
  font-size:14px; font-weight:500; color:var(--ash); border-bottom:2px solid transparent; white-space:nowrap;
}
.tab.active{color:var(--text); border-bottom-color:var(--primary);}
.tab:hover:not(.active){color:var(--text);}

h1.page-title{font-size:36px; font-weight:700; letter-spacing:-.03em; margin:0 0 4px;}
p.page-sub{font-size:14px; color:var(--text-2); margin:0;}
.page-head-row{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}

.btn{
  border:none; border-radius:var(--radius-pill); padding:10px 20px; font-size:13.5px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; transition:.15s;
}
.btn-primary{background:var(--primary); color:#fff; box-shadow:var(--shadow-subtle);}
.btn-primary:hover{background:#7d78f0;}
.btn-ghost{background:transparent; color:var(--text-2); border:1px solid var(--fog);}
.btn-ghost:hover{border-color:var(--text-2); color:var(--text);}
.btn-danger-ghost{background:transparent; color:#d6409f; border:1px solid #f3c9e4;}

/* ---------- dashboard grid (insight-board) ---------- */
.dash-grid{display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start;}
@media (max-width:960px){.dash-grid{grid-template-columns:1fr;}}

.hero-card{
  background:var(--surface); border:1px solid var(--fog); border-radius:24px; padding:28px;
  box-shadow:var(--shadow-subtle);
}
.hero-card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
.hero-card-title{font-size:18px; font-weight:700;}
.hero-card-desc{font-size:12.5px; color:var(--ash); margin-top:3px;}
.metric-pills{display:flex; gap:8px; flex-wrap:wrap;}
.metric-pill{background:var(--linen); border-radius:var(--radius-pill); padding:5px 12px; font-size:12px; font-weight:600; color:var(--text-2);}
.metric-pill b{color:var(--text); font-weight:700;}

.kpi-side{display:flex; flex-direction:column; gap:14px;}
.stat-card{
  background:var(--surface); border:1px solid var(--fog); border-radius:var(--radius-card); padding:16px 18px;
  box-shadow:var(--shadow-subtle);
}
.stat-label{font-size:12px; color:var(--ash); font-weight:600; margin-bottom:6px;}
.stat-value{font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1;}
.stat-value.small{font-size:24px;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:6px; display:inline-flex; align-items:center; gap:3px;}
.stat-delta.pos{color:var(--mint);}
.stat-delta.warn{color:var(--accent);}
.stat-row-inline{display:flex; justify-content:space-between; align-items:flex-end;}
.spark{width:64px;height:26px;}

.session-mini{border-top:1px solid var(--fog); margin-top:2px; padding-top:12px;}
.session-mini-title{font-size:11.5px; font-weight:700; color:var(--ash); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
.session-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-radius:10px; cursor:pointer;}
.session-row:hover{background:var(--linen);}
.session-thumb{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--sky));flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.session-row-info{flex:1; min-width:0;}
.session-row-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.session-row-meta{font-size:11px; color:var(--ash);}
.badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill);}
.badge.wait{background:#fdf1dd; color:var(--amber);}
.badge.progress{background:#e7edff; color:var(--sky);}
.badge.done{background:var(--mint-wash); color:#1c8a3c;}
.badge.fail{background:#fce4ec; color:#d6409f;}

.widget-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:22px;}
@media (max-width:960px){.widget-grid{grid-template-columns:1fr;}}
.widget-card{background:var(--surface); border:1px solid var(--fog); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-subtle);}
.widget-title{font-size:13px; font-weight:700; margin-bottom:12px;}

/* ---------- skeleton figure ---------- */
.skeleton-stage{
  position:relative; background:linear-gradient(180deg,#f4f3ff 0%, var(--linen) 100%);
  border-radius:18px; height:280px; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.angle-badge{
  position:absolute; bottom:14px; left:14px; background:rgba(24,25,37,.86); color:#fff;
  padding:8px 14px; border-radius:12px; font-size:12px; font-weight:600; display:flex; gap:14px;
}
.angle-badge span b{color:var(--secondary); font-size:14px;}

/* ---------- capture screen ---------- */
.two-col{display:grid; grid-template-columns:1fr 380px; gap:22px; align-items:start;}
@media (max-width:960px){.two-col{grid-template-columns:1fr;}}
.capture-card{background:var(--surface); border:1px solid var(--fog); border-radius:24px; padding:26px; box-shadow:var(--shadow-subtle);}
.record-stage{
  height:260px; border-radius:16px; background:#12131c; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; margin-bottom:18px;
}
.record-badge{position:absolute; top:14px; left:14px; display:flex; align-items:center; gap:7px; background:rgba(0,0,0,.5); color:#fff; padding:6px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:600;}
.rec-dot-mark{width:8px;height:8px;border-radius:50%; background:var(--accent);}
.record-timer{position:absolute; top:14px; right:14px; background:rgba(0,0,0,.5); color:#fff; padding:6px 12px; border-radius:var(--radius-pill); font-size:12px; font-variant-numeric:tabular-nums;}
.stage-idle-icon{color:#4a4a5c;}
.record-controls{display:flex; gap:10px;}

.dropzone{
  border:1.5px dashed var(--fog); border-radius:16px; padding:26px; text-align:center; margin-top:18px;
  transition:.15s; background:var(--linen);
}
.dropzone.drag{border-color:var(--primary); background:#f1efff;}
.dropzone p{margin:10px 0 4px; font-size:13.5px; font-weight:600;}
.dropzone span{font-size:11.5px; color:var(--ash);}

.upload-progress-wrap{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
.upload-item{background:var(--surface); border:1px solid var(--fog); border-radius:12px; padding:12px 14px;}
.upload-item-top{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:8px;}
.progress-track{height:6px; background:var(--fog); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--primary); border-radius:6px; transition:width .3s;}

.upload-list{display:flex; flex-direction:column; gap:10px;}
.upload-list-card{
  background:var(--surface); border:1px solid var(--fog); border-radius:16px; padding:14px; display:flex; gap:12px;
  align-items:center; cursor:pointer;
}
.upload-list-card:hover{border-color:var(--primary);}
.upload-thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,var(--secondary),var(--sky)); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff;}
.upload-meta-name{font-size:13px; font-weight:600;}
.upload-meta-sub{font-size:11.5px; color:var(--ash); margin-top:2px;}

/* ---------- analysis detail ---------- */
.analysis-grid{display:grid; grid-template-columns:1fr 360px; gap:22px; align-items:start;}
@media (max-width:960px){.analysis-grid{grid-template-columns:1fr;}}
.player-card{background:#12131c; border-radius:22px; padding:0; overflow:hidden; position:relative;}
.player-stage{height:360px; position:relative; display:flex; align-items:center; justify-content:center;}
.player-controls{display:flex; align-items:center; gap:14px; padding:14px 18px; background:#191a26;}
.scrub-track{flex:1; height:4px; background:#33344a; border-radius:4px; position:relative;}
.scrub-fill{position:absolute; left:0; top:0; height:100%; background:var(--secondary); border-radius:4px;}
.player-time{color:#c8c8d6; font-size:11.5px; font-variant-numeric:tabular-nums;}

.metric-panel{background:var(--surface); border:1px solid var(--fog); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-subtle);}
.metric-panel + .metric-panel{margin-top:16px;}
.metric-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
.metric-box{background:var(--linen); border-radius:12px; padding:12px 14px;}
.metric-box-label{font-size:11px; color:var(--ash); font-weight:600;}
.metric-box-val{font-size:20px; font-weight:700; margin-top:4px;}

.threshold-row{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding-top:14px; border-top:1px solid var(--fog);}
.threshold-row label{font-size:12.5px; font-weight:600; color:var(--text-2);}
input[type=range]{accent-color:var(--primary);}

.data-table-wrap{background:var(--surface); border:1px solid var(--fog); border-radius:20px; overflow:hidden; margin-top:22px; box-shadow:var(--shadow-subtle);}
table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table thead th{
  text-align:left; padding:12px 18px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ash); border-bottom:1px solid var(--fog); font-weight:700; background:var(--linen);
}
table.data-table tbody td{padding:11px 18px; border-bottom:1px solid var(--fog);}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr:hover{background:var(--linen);}
.table-toolbar{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--fog);}
.table-toolbar-title{font-size:14px; font-weight:700;}

/* ---------- history ---------- */
.history-grid{display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:start;}
@media (max-width:960px){.history-grid{grid-template-columns:1fr;}}
.filter-panel{background:var(--surface); border:1px solid var(--fog); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow-subtle);}
.filter-label{font-size:11.5px; font-weight:700; color:var(--ash); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 8px;}
.filter-label:first-child{margin-top:0;}
select, .select-like{width:100%; padding:9px 12px; border-radius:var(--radius-input); border:1px solid var(--fog); font-size:13px; font-family:inherit; background:#fff;}
.session-check-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-radius:8px; cursor:pointer; font-size:12.5px;}
.session-check-row:hover{background:var(--linen);}
.session-check-row input{accent-color:var(--primary);}

/* ---------- modal / drawer ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,30,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-box{
  background:#fff; border-radius:22px; padding:28px; max-width:480px; width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.25); animation:fadeInUp .3s ease both;
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h3{font-size:17px; margin:0;}
.close-x{border:none; background:var(--linen); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-2);}

.drawer-overlay{position:fixed; inset:0; background:rgba(20,20,30,.4); z-index:100; display:flex; justify-content:flex-end;}
.drawer{width:420px; max-width:92vw; height:100%; background:#fff; padding:26px; overflow-y:auto; box-shadow:-16px 0 40px rgba(0,0,0,.15); animation:fadeInUp .3s ease both;}
.drawer-tag{display:inline-block; padding:4px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; background:var(--mint-wash); color:#1c8a3c; margin-bottom:10px;}

.field-row{margin-bottom:14px;}
.field-row label{display:block; font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px;}
.field-row input, .field-row textarea{
  width:100%; padding:10px 12px; border-radius:var(--radius-input); border:1px solid var(--fog); font-size:13px; font-family:inherit;
}
.field-row textarea{resize:vertical; min-height:70px;}

.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--text); color:#fff;
  padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; z-index:200;
  display:flex; align-items:center; gap:8px; box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.toggle{width:40px; height:22px; border-radius:20px; background:var(--fog); position:relative; border:none; padding:0; flex-shrink:0;}
.toggle.on{background:var(--primary);}
.toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s;}
.toggle.on .knob{left:20px;}

.settings-card{background:var(--surface); border:1px solid var(--fog); border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow-subtle); margin-bottom:16px;}
.settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--fog);}
.settings-row:last-child{border-bottom:none;}
.settings-row-title{font-size:13.5px; font-weight:600;}
.settings-row-desc{font-size:11.5px; color:var(--ash); margin-top:2px;}

.chip{padding:6px 13px; border-radius:var(--radius-pill); background:var(--linen); border:1px solid transparent; font-size:12px; font-weight:600; color:var(--text-2);}
.chip.active{background:var(--primary); color:#fff;}

@media (max-width:900px){
  .global-nav{display:none;}
}
@media (max-width:720px){
  .page-wrap{padding:20px 16px 60px;}
  .project-switcher{display:none;}
  .app-header{gap:10px; padding:0 14px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;
const {ResponsiveContainer, AreaChart, Area, LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
       Tooltip, XAxis, YAxis, CartesianGrid} = Recharts;

const NAV = [
  {key:"main", label:"AI 자세 분석 대시보드", icon:"layout-dashboard"},
  {key:"capture", label:"영상 촬영·업로드", icon:"video"},
  {key:"analysis-detail", label:"Rule-based 동작 분석", icon:"activity"},
  {key:"history", label:"기록 추이 비교", icon:"line-chart"},
  {key:"settings", label:"동작 설정", icon:"sliders-horizontal"},
];

function genAngleSeries(seed, len){
  const arr = [];
  let base = 92;
  for(let i=0;i<len;i++){
    const t = i/len*Math.PI*4 + seed;
    base = 92 + Math.sin(t)*46 + Math.sin(t*2.3)*6;
    arr.push({frame:i, angle: Math.round(Math.max(38, Math.min(172, base)))});
  }
  return arr;
}
const REP_SERIES = genAngleSeries(1, 60);
const ACTIVE_TAB = {color:"var(--text)", borderBottomColor:"var(--primary)"};
const CARD_DNA = {borderRadius:16, boxShadow:'0 1px 1px rgba(24,25,37,0.08)'};
const SYMMETRY_DATA = [
  {part:"어깨", 좌:78, 우:81},
  {part:"팔꿈치", 좌:64, 우:59},
  {part:"골반", 좌:52, 우:55},
  {part:"무릎", 좌:96, 우:90},
];
const REP_BY_PART = [
  {part:"스쿼트", 횟수:24},
  {part:"런지", 횟수:16},
  {part:"플랭크", 횟수:9},
];
const QUEUE_DONUT = [
  {name:"완료", value:18, color:"#33c758"},
  {name:"분석중", value:3, color:"#2c78fc"},
  {name:"대기", value:2, color:"#ffa600"},
];

const SESSIONS = [
  {id:"S-0192", name:"스쿼트 세션 #192", date:"2026.08.18 09:12", status:"done", rom:118, reps:24, diff:4.2},

function Toast({msg, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2400); return ()=>clearTimeout(t); }, []);

}

function CaptureScreen({pushToast}){
  const [recording, setRecording] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const [dragOver, setDragOver] = useState(false);
  const [uploads, setUploads] = useState([
    {id:"u1", name:"squat_trial_04.mp4", progress:100, status:"done", failMsg:false},
    {id:"u2", name:"lunge_trial_02.mp4", progress:46, status:"progress", failMsg:false},
    {id:"u3", name:"plank_trial_01.mp4", progress:22, status:"fail", failMsg:true},
  ]);
  const timerRef = useRef(null);

  useEffect(()=>{
    if(recording){
      timerRef.current = setInterval(()=>setSeconds(s=>s+1), 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return ()=>clearInterval(timerRef.current);
  }, [recording]);

  useEffect(()=>{
    const inProgress = uploads.filter(u=>u.status==="progress");
    if(inProgress.length===0) return;
    const t = setInterval(()=>{
      setUploads(prev => prev.map(u=>{
        if(u.status!=="progress") return u;
        const next = Math.min(100, u.progress + Math.round(Math.random()*14)+6);
        return {...u, progress: next, status: next>=100 ? "done" : "progress"};
      }));
    }, 900);
    return ()=>clearInterval(t);
  }, [uploads]);

  function toggleRecord(){
    if(recording){
      setRecording(false);
      const name = "squat_live_" + String(Math.floor(Math.random()*90)+10) + ".mp4";
      setUploads(prev => [{id:"u"+Date.now(), name, progress:4, status:"progress", failMsg:false}, ...prev]);
      pushToast("촬영이 저장되었습니다 — 분석 대기열에 추가");
      setSeconds(0);
    } else {
      setRecording(true);
      pushToast("촬영을 시작합니다");
    }
  }

  function retryUpload(id){
    setUploads(prev => prev.map(u => u.id===id ? {...u, status:"progress", progress:8, failMsg:false} : u));
    pushToast("재시도 큐에 등록되었습니다");
  }

  function handleDrop(e){
    e.preventDefault(); setDragOver(false);
    const name = "upload_" + String(Math.floor(Math.random()*900)+100) + ".mp4";
    setUploads(prev => [{id:"u"+Date.now(), name, progress:2, status:"progress", failMsg:false}, ...prev]);
    pushToast("파일 업로드를 시작합니다");
  }

  function fmt(s){
    const m = String(Math.floor(s/60)).padStart(2,"0");
    const sec = String(s%60).padStart(2,"0");
    return m+":"+sec;
  }

  return (
    <div>
      <div className="page-head-row">
        <div>
          <h1 className="page-title">영상 촬영·업로드</h1>
          <p className="page-sub">모바일 브라우저에서 운동 영상을 촬영하거나 기존 영상을 업로드합니다</p>
        </div>
      </div>

      <div className="two-col">
        <div className="capture-card fade-up">
          <div className="record-stage">
            {recording ? (
              <div style={{color:"#fff", textAlign:"center"}}>
                <div className="rec-dot" style={{width:16,height:16,borderRadius:"50%",background:"var(--accent)",margin:"0 auto 10px"}}></div>
                <div style={{fontSize:13, color:"#c8c8d6"}}>카메라 스트리밍 중…</div>
              </div>
            ) : (
              <div className="stage-idle-icon" style={{textAlign:"center"}}>
                <Icon name="camera" size={40}/>
                <div style={{fontSize:12.5, marginTop:8}}>촬영을 시작하면 카메라 미리보기가 표시됩니다</div>
              </div>
            )}
            <div className="record-badge">
              <span className="rec-dot-mark" style={{animation: recording ? "pulseDot 1.6s infinite" : "none", opacity: recording?1:.4}}></span>
              {recording ? "REC" : "대기"}
            </div>
            <div className="record-timer">{fmt(seconds)}</div>
          </div>
          <div className="record-controls">
            <button className={"btn " + (recording ? "btn-danger-ghost" : "btn-primary")} onClick={toggleRecord}>
              <Icon name={recording ? "square" : "circle"} size={14}/> {recording ? "촬영 종료" : "촬영 시작"}
            </button>
            <button className="btn btn-ghost" onClick={()=>pushToast("타겟 동작을 스쿼트로 설정했습니다")}>
              <Icon name="target" size={14}/> 타겟 동작: 스쿼트
            </button>
          </div>

          <div
            className={"dropzone" + (dragOver ? " drag" : "")}
            onDragOver={(e)=>{e.preventDefault(); setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={handleDrop}
          >
            <Icon name="upload-cloud" size={26}/>
            <p>파일을 드래그하거나 클릭하여 업로드</p>
            <span>MP4, MOV · 최대 500MB</span>
            <div style={{marginTop:14}}>
              <button className="btn btn-ghost" onClick={()=>handleDrop({preventDefault(){}})}>
                <Icon name="folder-open" size={14}/> 파일 선택
              </button>
            </div>
          </div>
        </div>

        <div>
          <div className="hero-card-title" style={{marginBottom:12}}>업로드 목록</div>
          <div className="upload-list">
            {uploads.map(u=>(
              <div key={u.id}>
                {u.status==="progress" ? (
                  <div className="upload-item">
                    <div className="upload-item-top"><span>{u.name}</span><span>{u.progress}%</span></div>
                    <div className="progress-track"><div className="progress-fill" style={{width:u.progress+"%"}}></div></div>
                  </div>
                ) : (
                  <div className="upload-list-card">
                    <div className="upload-thumb">
                      <Icon name={u.status==="fail" ? "alert-triangle" : "film"} size={18}/>
                    </div>
                    <div style={{flex:1}}>
                      <div className="upload-meta-name">{u.name}</div>
                      <div className="upload-meta-sub">{u.status==="fail" ? "네트워크 오류 — 업로드 실패" : "처리 완료 · 분석 대기열 등록됨"}</div>
                    </div>
                    {u.status==="fail" ? (
                      <button className="btn btn-danger-ghost" onClick={(e)=>{e.stopPropagation(); retryUpload(u.id);}}>재시도</button>
                    ) : (
                      <span className="badge done">완료</span>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

          <input type="range" min="0" max="100" value={scrub} onChange={e=>setScrub(Number(e.target.value))} style={{width:"100%", marginTop:12}}/>

          <div className="data-table-wrap">
            <div className="table-toolbar">
              <span className="table-toolbar-title">프레임별 관절 좌표</span>
              <button className="btn btn-ghost" onClick={()=>pushToast("현재 화면의 프레임 데이터를 다운로드합니다")}>
                <Icon name="download" size={13}/> CSV
              </button>
            </div>
            <table className="data-table">
              <thead><tr><th>프레임</th><th>타임코드</th><th>관절각도</th><th>구간</th><th>좌우차이</th><th></th></tr></thead>
              <tbody>
                {FRAME_ROWS.map(r=>(
                  <tr key={r.frame}>
                    <td>{r.frame}</td><td>{r.t}</td><td>{r.angle}°</td>
                    <td>{r.rep!=="—" ? <span className="badge progress">{r.rep}</span> : "—"}</td>
                    <td>{r.diff}</td>
                    <td><button className="btn btn-ghost" style={{padding:"5px 12px"}} onClick={()=>pushToast(r.frame+" 좌표 JSON 다운로드")}><Icon name="download" size={12}/></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <div className="metric-panel">
            <div className="hero-card-title">핵심 지표</div>
            <div className="metric-grid-2">
              <div className="metric-box"><div className="metric-box-label">관절각도(현재)</div><div className="metric-box-val">118°</div></div>
              <div className="metric-box"><div className="metric-box-label">ROM</div><div className="metric-box-val">112°</div></div>
              <div className="metric-box"><div className="metric-box-label">반복 횟수</div><div className="metric-box-val">24회</div></div>
              <div className="metric-box">
                <div className="metric-box-label">좌우 차이</div>
                <div className="metric-box-val" style={{color: diffOver ? "var(--accent)" : "var(--text)"}}>4.2°</div>
              </div>
            </div>
            <div className="threshold-row">
              <label>좌우차이 임계값</label>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <input type="range" min="1" max="10" value={threshold} onChange={e=>setThreshold(Number(e.target.value))}/>
                <span style={{fontSize:12.5, fontWeight:700}}>{threshold}°</span>
              </div>
            </div>
            {diffOver && (
              <div style={{marginTop:10, fontSize:12, color:"var(--accent)", display:"flex", gap:6, alignItems:"center"}}>
                <Icon name="alert-triangle" size={13}/> 현재 좌우차이가 임계값을 초과했습니다
              </div>
            )}
          </div>

          <div className="metric-panel">
            <div className="hero-card-title">프레임 관절각도 추이</div>
            <div style={{height:140, marginTop:10}}>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={REP_SERIES}>
                  <Line type="monotone" dataKey="angle" stroke="#918df6" strokeWidth={2} dot={false}/>
                  <Tooltip formatter={(v)=>[v+"°","각도"]}/>
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function HistoryScreen({openDrawer, navTo, pushToast}){
  const [selected, setSelected] = useState(["S-0192","S-0191"]);
  const [period, setPeriod] = useState("30");
  const [motion, setMotion] = useState("all");

  function toggle(id){
    setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }

  const chartData = useMemo(()=>{
    return REP_SERIES.map((r,i)=>({
      frame:r.frame,
      "세션 #192": r.angle,
      "세션 #191": Math.max(30, r.angle - 8 + (i%7)),
    }));
  }, []);

  return (
    <div>
      <div className="page-head-row">
        <div>
          <h1 className="page-title">기록 추이 비교</h1>
          <p className="page-sub">여러 세션의 관절각도·ROM 변화를 하나의 그래프에서 비교합니다</p>
        </div>
      </div>

      <div className="history-grid">
        <div className="filter-panel fade-up">
          <div className="filter-label">기간</div>
          <select value={period} onChange={e=>setPeriod(e.target.value)}>
            <option value="7">최근 7일</option>
            <option value="30">최근 30일</option>
            <option value="90">최근 90일</option>
          </select>

          <div className="filter-label">동작 종류</div>
          <select value={motion} onChange={e=>setMotion(e.target.value)}>
            <option value="all">전체</option>
            <option value="squat">스쿼트</option>
            <option value="lunge">런지</option>
            <option value="plank">플랭크</option>
          </select>

          <div className="filter-label">세션 선택 (비교)</div>
          {SESSIONS.map(s=>(
            <label key={s.id} className="session-check-row">
              <input type="checkbox" checked={selected.includes(s.id)} onChange={()=>toggle(s.id)}/>
              {s.name}
            </label>
          ))}
        </div>

        <div>
          <div className="hero-card fade-up" style={{marginBottom:20}}>
            <div className="hero-card-title" style={{marginBottom:14}}>선택 세션 관절각도 비교 ({selected.length}건)</div>
            <div style={{height:260}}>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={chartData} onClick={(e)=>{
                  if(e && e.activeLabel!==undefined){
                    pushToast("세션 상세 분석 화면으로 이동합니다");
                    navTo("analysis-detail");
                  }
                }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#eee"/>
                  <XAxis dataKey="frame" tick={{fontSize:11}}/>
                  <YAxis domain={[0,180]} tick={{fontSize:11}}/>
                  <Tooltip/>
                  {selected.includes("S-0192") && <Line type="monotone" dataKey="세션 #192" stroke="#918df6" strokeWidth={2.4} dot={false}/>}
                  {selected.includes("S-0191") && <Line type="monotone" dataKey="세션 #191" stroke="#ff3e00" strokeWidth={2.4} dot={false}/>}
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div style={{fontSize:11.5, color:"var(--ash)", marginTop:8}}>그래프의 지점을 클릭하면 해당 세션의 Rule-based 동작 분석 화면으로 이동합니다</div>
          </div>

          <div className="data-table-wrap">
            <div className="table-toolbar"><span className="table-toolbar-title">기간 내 세션 목록</span></div>
            <table className="data-table">
              <thead><tr><th>세션</th><th>일시</th><th>ROM</th><th>반복</th><th>좌우차이</th><th>상태</th></tr></thead>
              <tbody>
                {SESSIONS.map(s=>(
                  <tr key={s.id} style={{cursor:"pointer"}} onClick={()=>openDrawer({type:"session", data:s})}>
                    <td>{s.name}</td><td>{s.date}</td>
                    <td>{s.rom || "—"}</td><td>{s.reps || "—"}</td>
                    <td>{s.diff ? s.diff+"°" : "—"}</td>
                    <td><span className={"badge " + s.status}>{s.status==="done"?"완료":s.status==="progress"?"분석중":"실패"}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsScreen({pushToast}){
  const [notif, setNotif] = useState(true);
  const [autoAnalyze, setAutoAnalyze] = useState(true);
  const [motions, setMotions] = useState([
    {name:"스쿼트", threshold:5, active:true},
    {name:"런지", threshold:6, active:true},
  ]);
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  function openEdit(m){ setEditing({...m}); setModalOpen(true); }
  function saveEdit(){
    setMotions(prev => prev.map(m => m.name===editing.name ? editing : m));
    setModalOpen(false);
    pushToast("동작 설정이 저장되었습니다");
  }

  return (
    <div>
      <div className="page-head-row">
        <div>
          <h1 className="page-title">동작 설정</h1>
          <p className="page-sub">타겟 운동 동작과 분석 임계값, 알림을 관리합니다</p>
        </div>
        <button className="btn btn-primary" onClick={()=>{ setEditing({name:"새 동작", threshold:5, active:true}); setModalOpen(true); }}>
          <Icon name="plus" size={14}/> 동작 추가
        </button>
      </div>

      <div className="settings-card">
        <div className="hero-card-title" style={{marginBottom:6}}>타겟 동작 관리</div>
        {motions.map(m=>(
          <div className="settings-row" key={m.name}>
            <div>
              <div className="settings-row-title">{m.name}</div>
              <div className="settings-row-desc">좌우차이 임계값 {m.threshold}° · {m.active ? "활성" : "비활성"}</div>
            </div>
            <div style={{display:"flex", gap:8}}>
              <button className="btn btn-ghost" onClick={()=>openEdit(m)}><Icon name="pencil" size={13}/> 편집</button>
            </div>
          </div>
        ))}
      </div>

      <div className="settings-card">
        <div className="hero-card-title" style={{marginBottom:6}}>알림 · 자동화</div>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">분석 완료 알림</div>
            <div className="settings-row-desc">세션 분석이 끝나면 알림을 받습니다</div>
          </div>
          <button className={"toggle" + (notif ? " on" : "")} onClick={()=>setNotif(!notif)}><span className="knob"></span></button>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">업로드 즉시 자동 분석</div>
            <div className="settings-row-desc">영상 업로드가 끝나면 대기 없이 바로 분석을 시작합니다</div>
          </div>
          <button className={"toggle" + (autoAnalyze ? " on" : "")} onClick={()=>setAutoAnalyze(!autoAnalyze)}><span className="knob"></span></button>
        </div>
      </div>

      <div className="settings-card">
        <div className="hero-card-title" style={{marginBottom:12}}>계정 정보</div>
        <div style={{display:"flex", gap:14, alignItems:"center"}}>
          <div className="avatar" style={{width:48,height:48,fontSize:15}}>김민</div>
          <div>
            <div style={{fontWeight:700, fontSize:14}}>김민수</div>
            <div style={{fontSize:12, color:"var(--ash)"}}>minsu.kim@example.com</div>
          </div>
        </div>
      </div>

      {modalOpen && (
        <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <h3>동작 설정 편집</h3>
              <button className="close-x" onClick={()=>setModalOpen(false)}><Icon name="x" size={15}/></button>
            </div>
            <div className="field-row">
              <label>동작 이름</label>
              <input value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})}/>
            </div>
            <div className="field-row">
              <label>좌우차이 임계값 (도)</label>
              <input type="number" value={editing.threshold} onChange={e=>setEditing({...editing, threshold:Number(e.target.value)})}/>
            </div>
            <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={saveEdit}>
              <Icon name="check" size={14}/> 저장
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function SessionDrawer({session, onClose}){
  const [comment, setComment] = useState("");
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16}}>
          <div>
            <span className="drawer-tag">{session.status==="done" ? "분석 완료" : session.status==="progress" ? "분석중" : "실패"}</span>
            <h3 style={{margin:0, fontSize:19}}>{session.name}</h3>
            <div style={{fontSize:12, color:"var(--ash)", marginTop:2}}>{session.date}</div>
          </div>
          <button className="close-x" onClick={onClose}><Icon name="x" size={15}/></button>
        </div>

        <div className="skeleton-stage" style={{height:160, marginBottom:16}}>
          <SkeletonFigure/>
        </div>

        <div className="metric-grid-2">
          <div className="metric-box"><div className="metric-box-label">ROM</div><div className="metric-box-val">{session.rom || "—"}°</div></div>
          <div className="metric-box"><div className="metric-box-label">반복 횟수</div><div className="metric-box-val">{session.reps || "—"}회</div></div>
          <div className="metric-box"><div className="metric-box-label">좌우 차이</div><div className="metric-box-val">{session.diff || "—"}°</div></div>
          <div className="metric-box"><div className="metric-box-label">세션 ID</div><div className="metric-box-val" style={{fontSize:15}}>{session.id}</div></div>
        </div>

        <div className="field-row" style={{marginTop:20}}>
          <label>메모</label>
          <textarea placeholder="세션에 대한 메모를 남겨보세요" value={comment} onChange={e=>setComment(e.target.value)}></textarea>
        </div>
        <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={onClose}>
          <Icon name="check" size={14}/> 닫기
        </button>
      </div>
    </div>
  );
}

function App(){
  const [active, setActive] = useState("main");
  const [drawer, setDrawer] = useState(null);
  const [toasts, setToasts] = useState([]);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, [active, drawer, toasts]);

  function navTo(key){
    if(key.startsWith("_")){ pushToast("데모 버전에서는 준비 중인 영역입니다"); return; }
    setActive(key);
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function pushToast(msg){
    const id = "t"+Date.now()+Math.random();
    setToasts(prev=>[...prev, {id, msg}]);
  }
  function removeToast(id){
    setToasts(prev=>prev.filter(t=>t.id!==id));
  }

  return (
    <div data-archetype="topbar-analytics" style={{width:"100%", minHeight:"100vh", display:"flex", flexDirection:"column"}}>
      <AppNav active={active} onNav={navTo}/>
      <main style={{flex:1, width:"100%"}}>
        <div className="page-wrap">
          {active==="main" && <DashboardMain openDrawer={setDrawer} pushToast={pushToast}/>}
          {active==="capture" && <CaptureScreen pushToast={pushToast}/>}
          {active==="analysis-detail" && <AnalysisDetail pushToast={pushToast}/>}
          {active==="history" && <HistoryScreen openDrawer={setDrawer} navTo={navTo} pushToast={pushToast}/>}
          {active==="settings" && <SettingsScreen pushToast={pushToast}/>}
        </div>
      </main>
      {drawer && drawer.type==="session" && <SessionDrawer session={drawer.data} onClose={()=>setDrawer(null)}/>}
      {toasts.map(t => <Toast key={t.id} msg={t.msg} onDone={()=>removeToast(t.id)}/>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
