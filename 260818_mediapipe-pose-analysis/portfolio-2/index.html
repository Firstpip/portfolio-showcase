<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 자세 분석 통합 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --primary:#00e37a; --secondary:#020101; --accent:#f61eee;
  --bg:#f2f2f4; --surface:#fdfdfd;
  --ink:#0f1012; --ink-2:#5e5e5e; --ash:#8f8f8f;
  --border:rgba(15,16,18,.10); --border-strong:rgba(15,16,18,.16);
  --radius-lg:28px; --radius-md:18px; --radius-sm:12px; --radius-pill:9999px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink); width:100%; min-height:100vh; font-weight:400;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}
#root{width:100%;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
@keyframes softPulse{0%{opacity:.35;}50%{opacity:.9;}100%{opacity:.35;}}
@keyframes shimmerBar{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
@keyframes toastRise{from{opacity:0;transform:translate(-50%,18px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes ringSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.fade-up{animation:fadeInUp .5s ease both;}
.soft-pulse{animation:softPulse 1.8s infinite;}
.shimmer{background:linear-gradient(90deg,#eceef0 0px,#f7f7f8 40px,#eceef0 80px);background-size:800px 100%;animation:shimmerBar 1.5s infinite linear;}
.toast-anim{animation:toastRise .35s cubic-bezier(.2,.8,.3,1) both;}
.bar-grow{animation:barGrow .5s ease both; transform-origin:bottom;}
.spin-ring{animation:ringSpin 1s linear infinite;}

/* ---------- shell: stripe-multipane ---------- */
.shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:248px; background:var(--surface);
  border-right:1px solid var(--border); padding:22px 16px; overflow-y:auto; z-index:30;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px;}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--primary);}
.brand-name{font-weight:600; font-size:15px; letter-spacing:-.01em;}
.env-select{
  width:100%; margin-bottom:20px; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg); font-size:12px; color:var(--ink-2); display:flex; align-items:center; justify-content:space-between;
}
.sidebar-section{margin-bottom:18px;}
.sidebar-section-title{font-size:10.5px; font-weight:600; color:var(--ash); text-transform:uppercase; letter-spacing:.06em; padding:0 10px 8px;}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--radius-sm); border:none; background:transparent;
  color:var(--ink-2); font-size:13px; width:100%; text-align:left; margin-bottom:2px;
}
.sidebar-link.active{background:var(--ink); color:#fff;}
.sidebar-link:hover:not(.active){background:var(--bg); color:var(--ink);}
.sidebar-link i{font-size:16px; flex-shrink:0;}

.main-wrap{margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px);}
.content-pad{max-width:1240px; margin:0 auto; padding:30px 34px 90px;}

.page-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:16px; flex-wrap:wrap;}
.page-title{font-size:33px; font-weight:500; letter-spacing:-.02em; margin:0;}
.page-meta{font-size:12.5px; color:var(--ash); margin-top:5px;}
.page-actions{display:flex; gap:10px;}

.btn{border:none; border-radius:var(--radius-pill); padding:10px 18px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:7px;}
.btn-primary{background:var(--ink); color:var(--primary);}
.btn-primary:hover{background:#222;}
.btn-outline{background:transparent; border:1px solid var(--border-strong); color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-ghost{background:transparent; color:var(--ink-2); border:none;}
.btn-danger{background:transparent; color:var(--accent); border:1px solid rgba(246,30,238,.35);}

/* ---------- hero strip ---------- */
.hero-strip{
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  background:linear-gradient(120deg,#f2fdf8 0%,#fdf2fc 100%); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:32px 36px; margin-top:24px; overflow:hidden;
}
.hero-strip-badge{
  display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; color:#0f8a4f;
  background:rgba(0,227,122,.14); padding:5px 12px; border-radius:var(--radius-pill); margin-bottom:14px;
}
.pulse-dot{width:6px;height:6px;border-radius:50%; background:#00e37a; animation:softPulse 1.6s infinite;}
.hero-strip-title{font-size:20px; font-weight:600; letter-spacing:-.01em;}
.hero-strip-sub{font-size:12.5px; color:var(--ink-2); margin-top:6px; max-width:360px;}
.hero-wave{width:220px; height:96px; flex-shrink:0;}
@media (max-width:760px){ .hero-strip{flex-direction:column; align-items:flex-start;} .hero-wave{width:100%;} }

/* ---------- stat row ---------- */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:26px 0;}
@media (max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; transition:transform .18s ease, border-color .18s ease;}
.stat-card:hover{transform:scale(1.02); border-color:var(--border-strong);}
.cohort-chip{transition:transform .15s ease;}
.cohort-chip:hover{transform:scale(1.03);}
.stat-label{font-size:11.5px; color:var(--ash); font-weight:600;}
.stat-value{font-size:30px; font-weight:600; letter-spacing:-.02em; margin-top:8px;}
.stat-delta{font-size:11px; font-weight:600; margin-top:8px; color:var(--ink-2);}
.stat-delta.up{color:#0f8a4f;}
.stat-delta.watch{color:var(--accent);}
.stat-spark{margin-top:10px; height:26px;}

/* ---------- tab-bar ---------- */
.tab-bar{display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:0;}
.tab{border:none; background:none; padding:12px 2px; font-size:13.5px; font-weight:500; color:var(--ash); border-bottom:2px solid transparent;}
.tab.active{color:var(--ink); border-bottom-color:var(--primary);}

.data-toolbar{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:16px 0; flex-wrap:wrap;}
.search-input{padding:9px 14px; border-radius:var(--radius-pill); border:1px solid var(--border-strong); font-size:12.5px; width:220px; background:var(--surface);}
.filter-chip{padding:7px 14px; border-radius:var(--radius-pill); border:1px solid var(--border-strong); background:var(--surface); font-size:12px; color:var(--ink-2); font-weight:500;}
.filter-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* ---------- master-detail data section ---------- */
.master-detail{display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start;}
@media (max-width:1000px){.master-detail{grid-template-columns:1fr;}}
.list-rail{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow-x:auto; overflow-y:hidden;}
table.data-table{width:100%; border-collapse:collapse; font-size:12.8px;}
table.data-table thead th{
  text-align:left; padding:12px 20px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ash); font-weight:600; border-bottom:1px solid var(--border);
}
table.data-table tbody td{padding:13px 20px; border-bottom:1px solid var(--border);}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr{cursor:pointer;}
table.data-table tbody tr:hover{background:var(--bg);}
table.data-table tbody tr.selected{background:#e9fdf3;}
.badge{font-size:10px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill); display:inline-block;}
.badge.wait{background:#fff3e0; color:#b8720a;}
.badge.progress{background:#e6f2ff; color:#0b6ad1;}
.badge.done{background:#e6fbf1; color:#0f8a4f;}
.badge.fail{background:#fde6fb; color:#b3129f;}
.row-avatar{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700; margin-right:10px; vertical-align:middle;}

.detail-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; position:sticky; top:24px;}
.detail-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.detail-avatar{width:44px;height:44px;border-radius:14px;background:var(--ink); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.detail-name{font-size:15px; font-weight:600;}
.detail-sub{font-size:11.5px; color:var(--ash); margin-top:2px;}
.detail-video{height:160px; border-radius:var(--radius-md); background:linear-gradient(135deg,#111,#222); display:flex; align-items:center; justify-content:center; color:#666; margin-bottom:16px; position:relative;}
.detail-metrics{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.dm-box{background:var(--bg); border-radius:var(--radius-sm); padding:12px 14px;}
.dm-label{font-size:10.5px; color:var(--ash); font-weight:600;}
.dm-val{font-size:18px; font-weight:600; margin-top:4px;}
.comment-item{border-top:1px solid var(--border); padding:10px 0; font-size:12px;}
.comment-item b{font-size:12px;}
.comment-item span{color:var(--ash); font-size:11px;}

/* ---------- cohort ---------- */
.chip-row{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 22px;}
.cohort-chip{padding:9px 16px; border-radius:var(--radius-pill); border:1px solid var(--border-strong); background:var(--surface); font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:8px;}
.cohort-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.cohort-dot{width:8px;height:8px;border-radius:50%;}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px; margin-bottom:20px;}
.panel-title{font-size:15px; font-weight:600; margin-bottom:4px;}
.panel-sub{font-size:12px; color:var(--ash); margin-bottom:16px;}

/* ---------- dataset export queue ---------- */
.queue-list{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
.queue-item{display:flex; align-items:center; gap:14px; padding:12px 16px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg);}
.queue-icon{width:34px;height:34px;border-radius:10px;background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
.queue-info{flex:1;}
.queue-name{font-size:12.5px; font-weight:600;}
.queue-sub{font-size:11px; color:var(--ash); margin-top:2px;}
.progress-track{height:5px; background:var(--border); border-radius:6px; overflow:hidden; margin-top:6px; width:160px;}
.progress-fill{height:100%; background:var(--primary); border-radius:6px; transition:width .3s;}

/* ---------- comment queue ---------- */
.queue-table-row{border-bottom:1px solid var(--border);}
.priority-dot{width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:8px;}
.comment-box{width:100%; min-height:56px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:9px 12px; font-size:12.5px; font-family:inherit; resize:vertical;}

/* ---------- modal/drawer ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,10,12,.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{background:#fff; border-radius:var(--radius-lg); padding:30px; max-width:460px; width:100%; animation:fadeInUp .3s ease both;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-head h3{font-size:16px; margin:0; font-weight:600;}
.close-x{border:none; background:var(--bg); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-2);}
.field-row{margin-bottom:14px;}
.field-row label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:6px;}
.field-row input, .field-row select, .field-row textarea{width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); font-size:13px; font-family:inherit;}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:500; z-index:200; display:flex; align-items:center; gap:9px;}

@media (max-width:900px){
  .sidebar{display:none;}
  .main-wrap{margin-left:0; width:100%;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;
const {ResponsiveContainer, LineChart, Line, BarChart, Bar, CartesianGrid, XAxis, YAxis, Tooltip, ComposedChart, Area} = Recharts;

const NAV_GROUPS = [
  {title:"모니터링", items:[
    {key:"main", label:"관리자 통합 운영 콘솔", icon:"ph-squares-four"},
    {key:"cohort", label:"코호트 비교 분석", icon:"ph-chart-bar"},
  ]},
  {title:"데이터", items:[
    {key:"dataset", label:"관절 좌표 데이터셋 브라우저", icon:"ph-database"},
  ]},
  {title:"검토", items:[
    {key:"comment-queue", label:"전문가 코멘트 큐", icon:"ph-chat-centered-text"},
  ]},
  {title:"사용자", items:[
    {key:"user-detail", label:"사용자 상세", icon:"ph-user-circle"},
  ]},
];

const USERS = [
  {id:"U-101", name:"김민수", sessions:14, last:"2026.08.18 09:12", status:"progress", rom:112, reps:24, diff:4.2, cohort:"성인 재활 A"},
  {id:"U-098", name:"이지은", sessions:9, last:"2026.08.17 19:44", status:"done", rom:96, reps:16, diff:7.8, cohort:"청소년 스포츠"},
  {id:"U-087", name:"박준호", sessions:22, last:"2026.08.17 08:03", status:"wait", rom:0, reps:0, diff:0, cohort:"성인 재활 A"},
  {id:"U-076", name:"최유나", sessions:6, last:"2026.08.16 20:21", status:"done", rom:112, reps:22, diff:3.1, cohort:"시니어 코호트"},
  {id:"U-065", name:"정도현", sessions:31, last:"2026.08.15 07:55", status:"fail", rom:0, reps:0, diff:0, cohort:"청소년 스포츠"},
  {id:"U-054", name:"한소영", sessions:11, last:"2026.08.14 21:10", status:"done", rom:120, reps:26, diff:2.4, cohort:"시니어 코호트"},
];

const COHORTS = [
  {id:"a", name:"성인 재활 A", color:"#00e37a"},
  {id:"b", name:"청소년 스포츠", color:"#f61eee"},
  {id:"c", name:"시니어 코호트", color:"#0b6ad1"},
];
const COHORT_DIST = [
  {bucket:"60-80°", 성인재활A:4, 청소년스포츠:2, 시니어코호트:7},
  {bucket:"80-100°", 성인재활A:9, 청소년스포츠:5, 시니어코호트:10},
  {bucket:"100-120°", 성인재활A:12, 청소년스포츠:14, 시니어코호트:6},
  {bucket:"120-140°", 성인재활A:6, 청소년스포츠:11, 시니어코호트:2},
];

const DATASET_ROWS = [
  {id:"D-8821", session:"세션 #192", user:"김민수", frames:210, size:"1.4MB"},
  {id:"D-8820", session:"세션 #191", user:"이지은", frames:184, size:"1.1MB"},
  {id:"D-8819", session:"세션 #190", user:"박준호", frames:0, size:"—"},
  {id:"D-8818", session:"세션 #189", user:"최유나", frames:196, size:"1.3MB"},
  {id:"D-8817", session:"세션 #188", user:"정도현", frames:0, size:"—"},
  {id:"D-8816", session:"세션 #187", user:"한소영", frames:230, size:"1.5MB"},
];

const COMMENT_ROWS = [
  {id:"C-1", user:"박준호", session:"세션 #190", priority:"high", waited:"2시간 전", status:"검토전"},
  {id:"C-2", user:"정도현", session:"세션 #188", priority:"high", waited:"5시간 전", status:"검토전"},
  {id:"C-3", user:"이지은", session:"세션 #191", priority:"mid", waited:"1일 전", status:"검토중"},
  {id:"C-4", user:"김민수", session:"세션 #192", priority:"low", waited:"1일 전", status:"검토전"},
];

function Icon({name, size=16, style={}}){
  return <i className={"ph " + name} style={{fontSize:size, ...style}}></i>;
}

function Toast({msg, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2400); return ()=>clearTimeout(t); }, []);
  return <div className="toast toast-anim"><Icon name="ph-check-circle"/> {msg}</div>;
}

function StatCard({label, value, unit, delta, tone, spark}){
  return (
    <div className="stat-card fade-up" style={{borderRadius:28}}>
      <div className="stat-label">{label}</div>
      <div className="stat-value">{value}<span style={{fontSize:14,fontWeight:500,color:"var(--ink-2)"}}>{unit}</span></div>
      <div className={"stat-delta " + (tone||"")}>{delta}</div>
      {spark && <div className="stat-spark">
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={spark}>
            <Area type="monotone" dataKey="v" stroke={tone==="watch" ? "#f61eee" : "#00e37a"} fill={tone==="watch" ? "#fde6fb" : "#e6fbf1"} strokeWidth={2}/>
          </ComposedChart>
        </ResponsiveContainer>
      </div>}
    </div>
  );
}

function badgeLabel(s){
  return s==="done" ? "완료" : s==="progress" ? "분석중" : s==="wait" ? "대기" : "실패";
}

function Sidebar({active, onNav}){
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="brand-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="2 14 7 14 9 8 13 20 16 14 22 14" />
          </svg>
        </div>
        <div className="brand-name">모션옵스 콘솔</div>
      </div>
      <button className="env-select" onClick={()=>onNav("_env")}>
        Production <Icon name="ph-caret-down" size={13}/>
      </button>
      {NAV_GROUPS.map(g=>(
        <div className="sidebar-section" key={g.title}>
          <div className="sidebar-section-title">{g.title}</div>
          {g.items.map(it=>(
            <button key={it.key} className={"sidebar-link" + (active===it.key?" active":"")} onClick={()=>onNav(it.key)}>
              <Icon name={it.icon}/> {it.label}
            </button>
          ))}
        </div>
      ))}
    </aside>
  );
}

function MainConsole({selected, setSelected, pushToast}){
  const [tab, setTab] = useState("overview");
  const [statusFilter, setStatusFilter] = useState("all");
  const [query, setQuery] = useState("");
  const tabs = [
    {key:"overview", label:"사용자 개요"},
    {key:"log", label:"세션 로그"},
    {key:"preset", label:"코호트 프리셋"},
  ];

  const rows = useMemo(()=>{
    return USERS.filter(u=>{
      if(statusFilter!=="all" && u.status!==statusFilter) return false;
      if(query && !u.name.includes(query)) return false;
      return true;
    });
  }, [statusFilter, query]);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">관리자 통합 운영 콘솔</h1>
          <div className="page-meta">사용자 · 업로드 영상 · 세션 기록을 하나의 콘솔에서 조회합니다</div>

function DatasetScreen({pushToast}){
  const [queue, setQueue] = useState([]);

  useEffect(()=>{
    const running = queue.filter(q=>q.status==="처리중");
    if(running.length===0) return;
    const t = setInterval(()=>{
      setQueue(prev => prev.map(q=>{
        if(q.status!=="처리중") return q;
        const next = Math.min(100, q.progress + Math.round(Math.random()*20)+10);
        return {...q, progress: next, status: next>=100 ? "완료" : "처리중"};
      }));
    }, 800);
    return ()=>clearInterval(t);
  }, [queue]);

  function requestExport(row){
    setQueue(prev => [{id:"q"+Date.now(), name:row.session+" · "+row.user, progress:5, status:"처리중"}, ...prev]);
    pushToast(row.session+" 내보내기가 큐에 등록되었습니다");
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">관절 좌표 데이터셋 브라우저</h1>
          <div className="page-meta">세션별 관절 좌표 원본 데이터를 조회하고 CSV/JSON으로 내보냅니다</div>
        </div>
      </div>

      <div className="data-toolbar">
        <input className="search-input" placeholder="세션 또는 사용자 검색" onChange={()=>{}}/>
        <div style={{display:"flex", gap:8}}>
          <button className="filter-chip active" onClick={()=>pushToast("전체 기간으로 필터링합니다")}>전체 기간</button>
          <button className="filter-chip" onClick={()=>pushToast("최근 7일로 필터링합니다")}>최근 7일</button>
        </div>
      </div>

      <div className="list-rail">
        <table className="data-table">
          <thead><tr><th>데이터셋</th><th>세션</th><th>사용자</th><th>프레임 수</th><th>용량</th><th></th></tr></thead>
          <tbody>
            {DATASET_ROWS.map(r=>(
              <tr key={r.id}>
                <td>{r.id}</td><td>{r.session}</td><td>{r.user}</td>
                <td>{r.frames || "—"}</td><td>{r.size}</td>
                <td>
                  <button className="btn btn-outline" style={{padding:"6px 14px"}} disabled={!r.frames} onClick={()=>requestExport(r)}>
                    <Icon name="ph-export" size={13}/> 내보내기
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {queue.length>0 && (
        <div className="panel" style={{marginTop:20}}>
          <div className="panel-title">내보내기 큐</div>
          <div className="panel-sub">대용량 내보내기는 Bull Queue 기반 비동기 작업으로 처리됩니다</div>
          <div className="queue-list">
            {queue.map(q=>(
              <div className="queue-item" key={q.id}>
                <div className="queue-icon">
                  {q.status==="완료" ? <Icon name="ph-check-circle" style={{color:"#0f8a4f"}}/> : <Icon name="ph-circle-notch spin-ring" className="spin-ring"/>}
                </div>
                <div className="queue-info">
                  <div className="queue-name">{q.name}</div>
                  <div className="queue-sub">{q.status} · {q.progress}%</div>
                  <div className="progress-track"><div className="progress-fill" style={{width:q.progress+"%"}}></div></div>
                </div>
                {q.status==="완료" && (
                  <button className="btn btn-outline" onClick={()=>pushToast("다운로드가 시작됩니다")}><Icon name="ph-download-simple" size={13}/> 다운로드</button>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function CommentQueueScreen({pushToast}){
  const [rows, setRows] = useState(COMMENT_ROWS);

  const sorted = useMemo(()=>{
    const rank = {high:0, mid:1, low:2};
    return [...rows].sort((a,b)=> rank[a.priority]-rank[b.priority]);
  }, [rows]);

  function submit(id){
    setRows(prev => prev.map(r => r.id===id ? {...r, status:"완료"} : r));
    setOpenId(null);
    pushToast("코멘트가 등록되고 사용자 알림이 갱신되었습니다");

  return (
    <div>

          <h1 className="page-title">전문가 코멘트 큐</h1>

      <div className="list-rail" style={{marginTop:20}}>
        <table className="data-table">

          <tbody>
            {sorted.map(r=>(
              <React.Fragment key={r.id}>
                <tr className="queue-table-row" onClick={()=>setOpenId(openId===r.id ? null : r.id)}>
                  <td>
                    <span className="priority-dot" style={{background: r.priority==="high" ? "#f61eee" : r.priority==="mid" ? "#f5a623" : "#8f8f8f"}}></span>
                    {r.priority==="high" ? "이상치" : r.priority==="mid" ? "일반" : "낮음"}

                  <td>{r.user}</td>
                  <td>{r.session}</td>
                  <td style={{color:"var(--ink-2)"}}>{r.waited}</td>
                  <td><span className={"badge " + (r.status==="완료"?"done":r.status==="검토중"?"progress":"wait")}>{r.status}</span></td>
                  <td><Icon name={openId===r.id ? "ph-caret-up" : "ph-caret-down"}/></td>
                </tr>
                {openId===r.id && (
                  <tr>
                    <td colSpan="6" style={{background:"var(--bg)"}}>
                      <div style={{padding:"14px 4px"}}>
                        <textarea
                          className="comment-box"
                          placeholder="검토 코멘트를 입력하세요"
                          value={drafts[r.id]||""}
                          onChange={e=>setDrafts({...drafts, [r.id]:e.target.value})}
                        ></textarea>
                        <div style={{display:"flex", gap:8, marginTop:10}}>
                          <button className="btn btn-primary" onClick={()=>submit(r.id)}><Icon name="ph-paper-plane-tilt" size={13}/> 코멘트 등록</button>
                          <button className="btn btn-ghost" onClick={()=>setOpenId(null)}>취소</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function UserDetailScreen({user, pushToast}){
  const [note, setNote] = useState("");
  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">사용자 상세</h1>
          <div className="page-meta">{user.name}님의 누적 세션과 분석 이력을 확인합니다</div>
        </div>
        <button className="btn btn-outline" onClick={()=>pushToast("사용자 계정 정보를 내보냅니다")}><Icon name="ph-export"/> 정보 내보내기</button>
      </div>

      <div className="master-detail">
        <div>
          <div className="panel">
            <div className="panel-title">세션 이력</div>
            <div className="panel-sub">{user.name} · {user.cohort} · 누적 {user.sessions}건</div>
            <table className="data-table">
              <thead><tr><th>세션</th><th>일시</th><th>ROM</th><th>반복</th><th>상태</th></tr></thead>
              <tbody>
                {[0,1,2].map(i=>(
                  <tr key={i} onClick={()=>pushToast("세션 상세로 이동합니다")}>
                    <td>세션 #{192-i}</td>
                    <td style={{color:"var(--ink-2)"}}>2026.08.{18-i}</td>
                    <td>{user.rom ? user.rom - i*3 : "—"}°</td>
                    <td>{user.reps ? user.reps - i : "—"}회</td>
                    <td><span className={"badge " + (i===0?user.status:"done")}>{badgeLabel(i===0?user.status:"done")}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="detail-panel" style={{position:"static"}}>
          <div className="detail-head">
            <div className="detail-avatar">{user.name[0]}</div>
            <div>
              <div className="detail-name">{user.name}</div>
              <div className="detail-sub">{user.id} · {user.cohort}</div>
            </div>
          </div>
          <div className="detail-metrics">
            <div className="dm-box"><div className="dm-label">평균 ROM</div><div className="dm-val">{user.rom || "—"}°</div></div>
            <div className="dm-box"><div className="dm-label">평균 반복</div><div className="dm-val">{user.reps || "—"}회</div></div>
          </div>
          <div className="field-row">
            <label>관리자 메모</label>
            <textarea rows="4" value={note} onChange={e=>setNote(e.target.value)} placeholder="이 사용자에 대한 메모를 남겨보세요"></textarea>
          </div>
          <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={()=>pushToast("메모가 저장되었습니다")}>
            <Icon name="ph-floppy-disk"/> 메모 저장
          </button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [active, setActive] = useState("main");
  const [selected, setSelected] = useState(USERS[0]);
  const [toasts, setToasts] = useState([]);

  function navTo(key){
    if(key.startsWith("_")){ pushToast("데모 버전에서는 준비 중인 영역입니다"); return; }
    setActive(key);
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function pushToast(msg){
    const id = "t"+Date.now()+Math.random();
    setToasts(prev=>[...prev, {id, msg}]);
  }
  function removeToast(id){
    setToasts(prev=>prev.filter(t=>t.id!==id));
  }

  return (
    <div data-archetype="stripe-multipane" className="shell">
      <Sidebar active={active} onNav={navTo}/>
      <div className="main-wrap">
        <div className="content-pad">
          {active==="main" && <MainConsole selected={selected} setSelected={setSelected} pushToast={pushToast}/>}
          {active==="cohort" && <CohortScreen pushToast={pushToast}/>}
          {active==="dataset" && <DatasetScreen pushToast={pushToast}/>}
          {active==="comment-queue" && <CommentQueueScreen pushToast={pushToast}/>}
          {active==="user-detail" && <UserDetailScreen user={selected} pushToast={pushToast}/>}
        </div>
      </div>
      {toasts.map(t => <Toast key={t.id} msg={t.msg} onDone={()=>removeToast(t.id)}/>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
