<style>
:root{
  --void:#040506; --ink:#07080a; --obsidian:#111214; --graphite:#1b1c1e;
  --border:#363739; --smoke:#6a6b6c; --ash:#9c9c9d; --mist:#e6e6e6; --iron:#454647;
  --white:#ffffff; --coral:#ff6363; --ember:#452324;
  --radius-card:16px; --radius-lg:20px; --radius-btn:8px; --radius-badge:6px;
  --ok:#59d499; --warn:#ffb84d; --err:#ff6363; --info:#56c2ff;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--void);color:var(--white);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--coral);color:#fff;}

@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeInUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
@keyframes scaleIn{ from{opacity:0;transform:scale(.94);} to{opacity:1;transform:scale(1);} }
@keyframes pulseDot{ 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(89,212,153,.5);} 50%{opacity:.6;box-shadow:0 0 0 4px rgba(89,212,153,0);} }
@keyframes barGrow{ from{width:0;} }
@keyframes slideInRight{ from{opacity:0;transform:translateX(24px);} to{opacity:1;transform:translateX(0);} }
@keyframes toastIn{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

.keycard{
  background:var(--ink); border-radius:var(--radius-card);
  box-shadow: inset 0 1px 0 0 rgba(255,255,255,.05), 0 0 0 1px rgba(255,255,255,.08), inset 0 -1px 0 0 rgba(0,0,0,.2);
  transition: transform .18s ease, box-shadow .18s ease;
}
.keycard.hoverable:hover{ transform:translateY(-2px); box-shadow: inset 0 1px 0 0 rgba(255,255,255,.08), 0 0 0 1px rgba(255,255,255,.16), inset 0 -1px 0 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35); }

.btn-primary{ background:var(--mist); color:var(--iron); border:none; border-radius:var(--radius-btn); padding:9px 16px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition: transform .12s ease, background .15s; }
.btn-primary:hover{ background:#fff; }
.btn-primary:active{ transform:scale(.96); }
.btn-ghost{ background:transparent; color:var(--ash); border:1px solid var(--border); border-radius:var(--radius-btn); padding:8px 14px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:.15s; }
.btn-ghost:hover{ color:var(--white); border-color:#54565a; background:rgba(255,255,255,.03); }
.btn-danger{ background:transparent; color:var(--coral); border:1px solid var(--ember); border-radius:var(--radius-btn); padding:8px 14px; font-size:13px; font-weight:500; }
.btn-danger:hover{ background:var(--ember); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:var(--radius-badge); font-size:11.5px; font-weight:600; letter-spacing:.01em; }
.badge-ok{ background:rgba(89,212,153,.12); color:var(--ok); }
.badge-warn{ background:rgba(255,184,77,.12); color:var(--warn); }
.badge-err{ background:rgba(255,99,99,.12); color:var(--err); }
.badge-info{ background:rgba(86,194,255,.12); color:var(--info); }
.badge-neutral{ background:var(--graphite); color:var(--ash); }

.sidebar-link{ display:flex; align-items:center; gap:10px; padding:9px 14px; margin:0 8px; border-radius:8px; color:var(--ash); font-size:13.5px; font-weight:500; border:none; background:transparent; width:calc(100% - 16px); text-align:left; transition:.15s; border-left:3px solid transparent; }
.sidebar-link:hover{ color:var(--white); background:rgba(255,255,255,.04); }
.sidebar-link.active{ color:var(--white); background:rgba(255,255,255,.06); border-left:3px solid var(--coral); }
.sidebar-link svg{ width:16px; height:16px; flex-shrink:0; }

.tab{ background:none; border:none; color:var(--ash); font-size:13px; font-weight:500; padding:8px 4px; border-bottom:2px solid transparent; }
.tab.active{ color:var(--white); border-bottom-color:var(--coral); }

.input-dark{ background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px; color:var(--white); padding:8px 12px; font-size:13.5px; }
.input-dark::placeholder{ color:var(--smoke); }
.input-dark:focus{ outline:none; border-color:var(--coral); }

.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeIn .18s ease; }
.modal-body{ background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-lg); width:560px; max-width:92vw; max-height:86vh; overflow-y:auto; animation:scaleIn .2s ease; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; animation:fadeIn .15s ease; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:400px; max-width:92vw; background:var(--ink); border-left:1px solid var(--border); z-index:201; animation:slideInRight .22s ease; overflow-y:auto; }

.toast{ position:fixed; bottom:24px; right:24px; background:var(--graphite); color:var(--white); padding:12px 18px; border-radius:10px; font-size:13.5px; display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:300; animation:toastIn .25s ease; border:1px solid var(--border); }

.status-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
.status-dot.live{ background:var(--ok); animation:pulseDot 2s infinite; }

.progress-track{ height:6px; background:var(--graphite); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; animation:barGrow 1s ease; }

.icon-circle{ width:34px; height:34px; border-radius:99999px; display:flex; align-items:center; justify-content:center; background:var(--graphite); flex-shrink:0; }
.icon-circle svg{ width:16px; height:16px; }

.stage-line{ display:flex; align-items:center; }
.stage-dot{ width:9px; height:9px; border-radius:50%; background:var(--graphite); border:2px solid var(--border); flex-shrink:0; }
.stage-dot.done{ background:var(--ok); border-color:var(--ok); }
.stage-dot.current{ background:var(--coral); border-color:var(--coral); }
.stage-seg{ flex:1; height:2px; background:var(--border); }
.stage-seg.done{ background:var(--ok); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--graphite); border-radius:8px; }
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">

function Icon({name, className, size=16}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[name]);
  return <i data-lucide={name} className={className} style={{width:size,height:size}} ref={ref}></i>;
}

function Toast({message, onClose}){
  useEffect(()=>{ const timer=setTimeout(onClose, 2400); return ()=>clearTimeout(timer); },[message]);
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle-2" size={15}/>{message}</div>;
}

function Modal({title, onClose, children, width}){
  return (
    <div className="modal-overlay" onClick={onClose}>

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:15,fontWeight:600}}>{title}</div>

        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}

  const decide = (id, decision)=>{
    setItems(prev=>prev.map(i=>i.id===id?{...i, status:decision}:i));
    toast(decision==='승인'?'매칭이 승인되었습니다':'매칭이 반려되었습니다');

      <Sidebar view={view} setView={setView}/>
      <main className="main-wrap" style={{marginLeft:260, flex:1, minWidth:0, width:'calc(100% - 260px)', minHeight:'100vh'}}>
        <Breadcrumb view={view} onCmdk={()=>setCmdkOpen(true)} onUpload={()=>toast('사진 배치 업로드 창이 열렸습니다')}/>
        <div style={{padding:24, animation:'fadeInUp .3s ease'}}>
          {view==='main' && <MainView setView={setView} onOpenBatch={setOpenBatch} onOpenCandidate={setOpenCandidate}/>}
          {view==='matching' && <MatchingView toast={toast}/>}
          {view==='workers' && <WorkersView onSelectWorker={setSelectedWorker}/>}
          {view==='infra' && <InfraView toast={toast}/>}
          {view==='settings' && <SettingsView toast={toast}/>}
        </div>
      </main>
      {cmdkOpen && <CmdK onClose={()=>setCmdkOpen(false)} onNavigate={setView}/>}
      {openBatch && <BatchModal batch={openBatch} onClose={()=>setOpenBatch(null)}/>}
      {openCandidate && <CandidateModal candidate={openCandidate} onClose={()=>setOpenCandidate(null)} toast={toast}/>}
      {selectedWorker && (
        <Drawer title={selectedWorker.id+' · 처리 로그'} onClose={()=>setSelectedWorker(null)}>
          <div style={{marginBottom:14,display:'flex',gap:8,flexWrap:'wrap'}}>
            <span className={'badge '+(selectedWorker.status==='busy'?'badge-info':selectedWorker.status==='error'?'badge-err':'badge-neutral')}>{selectedWorker.status==='busy'?'처리중':selectedWorker.status==='error'?'오류':'대기'}</span>
            <span className="badge badge-neutral">{selectedWorker.gpu}</span>
            <span className="badge badge-neutral">큐 {selectedWorker.queue}건</span>
          </div>
          <div style={{fontSize:12.5,color:'var(--ash)',marginBottom:16}}>{selectedWorker.job}</div>
          <div style={{fontSize:11,color:'var(--smoke)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>최근 처리 로그</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {(WORKER_LOGS[selectedWorker.id]||[]).map((l,i)=>(
              <div key={i} className="keycard" style={{padding:12}}>
                <div style={{fontSize:11,color:'var(--smoke)',marginBottom:3}}>{l.t}</div>
                <div style={{fontSize:12.5}}>{l.msg}</div>
              </div>
            ))}
          </div>
        </Drawer>
      )}
      <Toast message={toastMsg} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
