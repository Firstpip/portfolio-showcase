<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 사진 매칭 운영 분석 · GPU 비용 대시보드 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<style>
:root{
  --cream:#fff8f1; --white:#ffffff; --ink:#1d1e1c; --stone:#615f5c; --driftwood:#8e8b87;
  --bone:#c0bbb6; --mist:#d9d9d9; --orange:#fa5d00; --marigold:#fee3b5; --teal:#1ef6da;
  --radius-card:20px; --radius-btn:16px;
  --ok:#1f9d5c; --warn:#c17a00; --err:#d0402a; --info:#1e78c9;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select{font-family:inherit;}
::selection{background:var(--orange);color:#fff;}

@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeInUp{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
@keyframes scaleIn{ from{opacity:0;transform:scale(.95);} to{opacity:1;transform:scale(1);} }
@keyframes barGrow{ from{width:0;} }
@keyframes floatGlow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
@keyframes toastIn{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
@keyframes countPulse{ 0%{opacity:.4;} 100%{opacity:1;} }

.card{ background:var(--white); border-radius:var(--radius-card); box-shadow:0 1px 4px rgba(0,0,0,.06); transition:transform .2s ease, box-shadow .2s ease; }
.card.glow:hover{ transform:translateY(-3px); box-shadow:6px 4px 24px rgba(250,93,0,.16); }
.card.flat{ background:var(--cream); box-shadow:none; border:1px solid var(--mist); }

.btn-primary{ background:var(--orange); color:#fff; border:none; border-radius:var(--radius-btn); padding:11px 20px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; box-shadow:0 1px 4px rgba(0,0,0,.2); transition:.15s; }
.btn-primary:hover{ background:#e05300; }
.btn-primary:active{ transform:scale(.97); }
.btn-ghost{ background:transparent; color:var(--orange); border:1px solid var(--bone); border-radius:var(--radius-btn); padding:10px 18px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:7px; transition:.15s; }
.btn-ghost:hover{ background:var(--marigold); border-color:var(--orange); }
.btn-text{ background:none; border:none; color:var(--orange); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:5px; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; }
.badge-ok{ background:rgba(31,157,92,.12); color:var(--ok); }
.badge-warn{ background:rgba(193,122,0,.14); color:var(--warn); }
.badge-err{ background:rgba(208,64,42,.12); color:var(--err); }
.badge-info{ background:rgba(30,120,201,.12); color:var(--info); }
.badge-neutral{ background:var(--mist); color:var(--stone); }

.tab{ background:none; border:none; color:var(--stone); font-size:13.5px; font-weight:500; padding:10px 16px; border-radius:999px; }
.tab.active{ background:var(--ink); color:#fff; }

.navlink{ color:var(--stone); font-size:14px; font-weight:500; padding:8px 4px; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; }
.navlink.active{ color:var(--ink); border-bottom-color:var(--orange); font-weight:600; }

.input-light{ background:var(--white); border:1px solid var(--bone); border-radius:var(--radius-btn); padding:9px 14px; font-size:13.5px; color:var(--ink); }
.input-light:focus{ outline:none; border-color:var(--orange); }
.input-light::placeholder{ color:var(--driftwood); }

.modal-overlay{ position:fixed; inset:0; background:rgba(29,30,28,.45); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeIn .18s ease; }
.modal-body{ background:var(--white); border-radius:24px; width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; animation:scaleIn .2s ease; box-shadow:0 20px 60px rgba(0,0,0,.2); }

.toast{ position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 20px; border-radius:14px; font-size:13.5px; display:flex; align-items:center; gap:9px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:300; animation:toastIn .25s ease; }

.progress-track{ height:7px; background:var(--mist); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; animation:barGrow 1s ease; }

.checkbox{ width:18px; height:18px; border-radius:6px; border:2px solid var(--bone); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.checkbox.checked{ background:var(--orange); border-color:var(--orange); }
.brand-mark{ animation:floatGlow 3.4s ease-in-out infinite; }
.stat-value{ animation:countPulse .5s ease; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--bone); border-radius:8px; }
</style>
</head>
<body data-archetype="topbar-analytics">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {ComposedChart, Bar, Line, Area, XAxis, YAxis, CartesianGrid, PieChart, Pie, Cell, ResponsiveContainer, Tooltip, BarChart} = Recharts;

const OVERVIEW_SERIES = [
  {d:'08.13', volume:142000, success:91.2, rescue:9.8},
  {d:'08.14', volume:168000, success:92.4, rescue:10.6},
  {d:'08.15', volume:98000, success:93.1, rescue:11.2},
  {d:'08.16', volume:211000, success:93.8, rescue:12.0},
  {d:'08.17', volume:186320, success:94.5, rescue:12.4},
  {d:'08.18', volume:238460, success:94.2, rescue:12.1},
];

const EVENTS = [
  {id:'EV-0818', name:'2026 서울마라톤', date:'2026.08.18', photos:238460, success:94.2, cost:41600, duration:'2시간 14분'},
  {id:'EV-0817', name:'한강 나이트런 5K', date:'2026.08.17', photos:21460, success:96.5, cost:8900, duration:'48분'},
  {id:'EV-0806', name:'부산 바다마라톤', date:'2026.08.06', photos:164200, success:92.8, cost:35200, duration:'1시간 52분'},
  {id:'EV-0722', name:'춘천 호반 마라톤', date:'2026.07.22', photos:192800, success:93.6, cost:38700, duration:'2시간 05분'},
  {id:'EV-0701', name:'제주 국제 마라톤', date:'2026.07.01', photos:145900, success:91.4, cost:31900, duration:'1시간 47분'},
];

const INSTANCE_OPTIONS = [
  {id:'g5.xlarge', label:'g5.xlarge (A10G)', price:520},
  {id:'g4dn.xlarge', label:'g4dn.xlarge (T4)', price:210},
  {id:'g5.2xlarge', label:'g5.2xlarge (A10G x2)', price:940},
];
const MONTHLY_COST = [
  {m:'3월', v:820000},{m:'4월', v:910000},{m:'5월', v:760000},{m:'6월', v:1180000},{m:'7월', v:1340000},{m:'8월', v:1520000},
];

const PCT_SERIES = [
  {t:'09:00', p50:34, p95:78, p99:118},
  {t:'10:00', p50:31, p95:72, p99:104},
  {t:'11:00', p50:29, p95:69, p99:96},
  {t:'12:00', p50:38, p95:91, p99:142},
  {t:'13:00', p50:33, p95:81, p99:120},
];
const DELAY_CAUSE = [ {name:'DB 조회', value:58}, {name:'캐시 미스', value:31}, {name:'네트워크', value:11} ];
const PIE_COLORS = ['#fa5d00','#1ef6da','#c0bbb6'];

function Icon({name, size=17, weight='regular', style}){
  return <i className={'ph'+(weight==='fill'?'-fill':'')+' ph-'+name} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Toast({message,onClose}){
  useEffect(()=>{ if(!message) return; const t=setTimeout(onClose,2400); return ()=>clearTimeout(t); },[message]);
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle" weight="fill" size={16}/>{message}</div>;
}

function Modal({title, onClose, children, width}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-body" style={width?{width}:{}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'20px 24px',borderBottom:'1px solid var(--mist)'}}>
          <div style={{fontSize:16,fontWeight:700}}>{title}</div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'var(--stone)'}}><Icon name="x" size={19}/></button>
        </div>
        <div style={{padding:24}}>{children}</div>
      </div>
    </div>
  );
}

function StatCard({label, value, delta, positive, icon}){
  return (
    <div className="card stat-card" style={{padding:18}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
        <div style={{width:34,height:34,borderRadius:11,background:'var(--marigold)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <Icon name={icon} size={17} style={{color:'var(--orange)'}}/>
        </div>
        {delta && <span className={'badge '+(positive?'badge-ok':'badge-err')}><Icon name={positive?'trend-up':'trend-down'} size={12}/>{delta}</span>}
      </div>
      <div style={{fontSize:11.5,color:'var(--stone)',marginBottom:3}}>{label}</div>
      <div className="stat-value" style={{fontSize:28,fontWeight:700,letterSpacing:'-.01em'}}>{value}</div>
      <svg width="64" height="20" viewBox="0 0 64 20" style={{marginTop:6}}>
        <polyline points="0,15 9,11 18,13 27,7 36,9 45,4 54,6 63,2" fill="none" stroke={positive?'#1f9d5c':'#d0402a'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </div>
  );
}

function TopNav({view, setView, onExport}){
  const nav = [
    {id:'main', label:'통계 리포트'},
    {id:'performance', label:'조회 API 응답 성능 모니터링'},
    {id:'cost', label:'GPU 비용 최적화 대시보드'},
    {id:'compare', label:'대회 이력 · 다중 대회 비교 분석'},
  ];
  return (
    <header className="app-header" style={{position:'sticky',top:0,zIndex:10,background:'var(--cream)',borderBottom:'1px solid var(--mist)'}}>
      <div style={{maxWidth:1320,margin:'0 auto',display:'flex',alignItems:'center',gap:26,padding:'0 28px',height:64}}>
        <div style={{display:'flex',alignItems:'center',gap:8,fontWeight:700,fontSize:15}}>
          <div className="brand-mark" style={{width:28,height:28,borderRadius:9,background:'var(--orange)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Icon name="chart-line-up" weight="fill" size={15} style={{color:'#fff'}}/>
          </div>
          BibMatch Insight
        </div>
        <div className="project-switcher" style={{display:'flex',alignItems:'center',gap:5,fontSize:13,color:'var(--stone)',background:'var(--white)',border:'1px solid var(--mist)',borderRadius:999,padding:'6px 12px'}}>
          2026 서울마라톤 <Icon name="caret-down" size={13}/>
        </div>
        <nav className="global-nav" style={{display:'flex',gap:20,marginLeft:8}}>
          {nav.map(n=>(
            <button key={n.id} className={'navlink '+(view===n.id?'active':'')} onClick={()=>setView(n.id)}>{n.label}</button>
          ))}
        </nav>
        <div className="header-actions" style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:14}}>
          <Icon name="magnifying-glass" size={18} style={{color:'var(--stone)'}}/>
          <Icon name="bell" size={18} style={{color:'var(--stone)'}}/>
          <button className="btn-primary" onClick={onExport}><Icon name="export" size={15}/> 리포트 내보내기</button>
          <img src="https://source.boringavatars.com/beam/32/park-seo-yeon?colors=fa5d00,fee3b5,1d1e1c,ffffff" style={{borderRadius:99}}/>
        </div>
      </div>
    </header>
  );
}

function TabBar({period, setPeriod}){
  return (
    <nav className="tab-bar" style={{maxWidth:1320,margin:'14px auto 0',padding:'0 28px',display:'flex',gap:6}}>
      <button role="tab" className={'tab '+(period==='day'?'active':'')} onClick={()=>setPeriod('day')}>일간</button>
      <button role="tab" className={'tab '+(period==='week'?'active':'')} onClick={()=>setPeriod('week')}>주간</button>
      <button role="tab" className={'tab '+(period==='month'?'active':'')} onClick={()=>setPeriod('month')}>월간</button>
      <button role="tab" className={'tab '+(period==='quarter'?'active':'')} onClick={()=>setPeriod('quarter')}>분기</button>
    </nav>
  );
}

function MainView(){
  return (
    <React.Fragment>
    <div style={{fontSize:38,fontWeight:600,letterSpacing:'0.4px',marginBottom:18,color:'var(--ink)'}}>AI 사진 매칭 운영 리포트</div>
    <div style={{display:'grid',gridTemplateColumns:'2.3fr 1fr',gap:18,alignItems:'start'}}>
      <div className="card" style={{padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div>
            <div style={{fontSize:15,fontWeight:700}}>처리량 · 인식 성공률 · 2-Pass 구제율 추이</div>
            <div style={{fontSize:12,color:'var(--stone)',marginTop:2}}>최근 6일 · Materialized View 기준 집계</div>
          </div>
          <span className="badge badge-info"><Icon name="database" size={12}/> 사전 집계</span>
        </div>
        <div style={{height:300}}>
          <ResponsiveContainer width="100%" height="100%">
            <ComposedChart data={OVERVIEW_SERIES} margin={{left:-16}}>
              <CartesianGrid stroke="#eee2d3" vertical={false}/>
              <XAxis dataKey="d" tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
              <YAxis yAxisId="l" tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
              <YAxis yAxisId="r" orientation="right" tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false} domain={[80,100]}/>
              <Tooltip contentStyle={{borderRadius:12,border:'1px solid #d9d9d9',fontSize:12}}/>
              <Bar yAxisId="l" dataKey="volume" fill="#fee3b5" radius={[6,6,0,0]} barSize={26} name="처리 사진 수"/>
              <Line yAxisId="r" type="monotone" dataKey="success" stroke="#fa5d00" strokeWidth={2.5} dot={{r:3}} name="인식 성공률(%)"/>
              <Line yAxisId="r" type="monotone" dataKey="rescue" stroke="#1ef6da" strokeWidth={2} dot={{r:3}} strokeDasharray="4 3" name="2-Pass 구제율(%)"/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="stat-card"><StatCard label="누적 처리량 (전체 대회)" value="1,043,340장" delta="+8.4%" positive icon="images-square"/></div>
        <div className="stat-card"><StatCard label="GPU 비용 (당월 누계)" value="1,520,000원" delta="+13.4%" positive={false} icon="currency-circle-dollar"/></div>
        <div className="stat-card"><StatCard label="조회 API 평균 응답" value="34ms" delta="목표 이내" positive icon="gauge"/></div>
      </div>
      <div style={{gridColumn:'1 / -1'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginTop:2}}>
          <div className="card glow" style={{padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>대회별 인식 성공률</div>
            {EVENTS.slice(0,4).map(e=>(
              <div key={e.id} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,marginBottom:4}}><span>{e.name}</span><b>{e.success}%</b></div>
                <div className="progress-track"><div className="progress-fill" style={{width:e.success+'%',background:'var(--orange)'}}></div></div>
              </div>
            ))}
          </div>
          <div className="card glow" style={{padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>응답 지연 원인 비율</div>
            <div style={{height:130}}>
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={DELAY_CAUSE} dataKey="value" innerRadius={34} outerRadius={54} paddingAngle={3}>
                    {DELAY_CAUSE.map((e,i)=><Cell key={i} fill={PIE_COLORS[i]}/>)}
                  </Pie>
                  <Tooltip contentStyle={{borderRadius:10,fontSize:12}}/>
                </PieChart>
              </ResponsiveContainer>
            </div>
            <div style={{display:'flex',gap:10,fontSize:11,color:'var(--stone)',flexWrap:'wrap',marginTop:4}}>
              {DELAY_CAUSE.map((e,i)=>(<span key={i} style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:8,height:8,borderRadius:2,background:PIE_COLORS[i],display:'inline-block'}}></span>{e.name}</span>))}
            </div>
          </div>
          <div className="card glow" style={{padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>응답 시간 백분위 (최근 1시간)</div>
            <div style={{height:130}}>
              <ResponsiveContainer width="100%" height="100%">
                <ComposedChart data={PCT_SERIES}>
                  <XAxis dataKey="t" tick={{fontSize:10,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
                  <YAxis hide/>
                  <Tooltip contentStyle={{borderRadius:10,fontSize:12}}/>
                  <Line type="monotone" dataKey="p99" stroke="#c0bbb6" strokeWidth={1.5} dot={false}/>
                  <Line type="monotone" dataKey="p95" stroke="#1ef6da" strokeWidth={2} dot={false}/>
                  <Line type="monotone" dataKey="p50" stroke="#fa5d00" strokeWidth={2.5} dot={false}/>
                </ComposedChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      </div>
    </div>
    </React.Fragment>
  );
}

function PerformanceView(){
  const overThreshold = 6.4;
  return (
    <div>
      <div style={{fontSize:15,color:'var(--stone)',marginBottom:16,lineHeight:1.6}}>참가자가 배번호를 입력해 본인 사진을 조회·다운로드하는 API의 응답 속도를 추적합니다. 대회 당일 수천 명이 동시에 조회해도 100ms 목표를 지키는지 확인하는 화면입니다.</div>
      {overThreshold > 5 && (
        <div className="card" style={{padding:'14px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:10,background:'#fff1e8',boxShadow:'none',border:'1px solid #f5c99a'}}>
          <Icon name="warning" weight="fill" size={19} style={{color:'var(--warn)'}}/>
          <div style={{fontSize:13}}>최근 1시간 배번호 사진 조회 요청 중 100ms 초과 비율 <b>{overThreshold}%</b> — 임계치(5%)를 초과했습니다</div>
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:18}}>
        <div className="card" style={{padding:24}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>배번호 사진 조회 API 응답 시간 백분위</div>
          <div style={{fontSize:12,color:'var(--stone)',marginBottom:16}}>참가자 배번호 조회 → 매칭 사진 목록 반환 · p50 / p95 / p99 · 5분 단위 집계</div>
          <div style={{height:280}}>
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={PCT_SERIES}>
                <CartesianGrid stroke="#eee2d3" vertical={false}/>
                <XAxis dataKey="t" tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}}/>
                <Line type="monotone" dataKey="p99" stroke="#c0bbb6" strokeWidth={2} dot={{r:3}} name="p99 (ms)"/>
                <Line type="monotone" dataKey="p95" stroke="#1ef6da" strokeWidth={2.5} dot={{r:3}} name="p95 (ms)"/>
                <Line type="monotone" dataKey="p50" stroke="#fa5d00" strokeWidth={3} dot={{r:3}} name="p50 (ms)"/>
              </ComposedChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="stat-card"><StatCard label="사진 조회 p50" value="33ms" delta="목표 이내" positive icon="gauge"/></div>
          <div className="stat-card"><StatCard label="사진 조회 p95" value="78ms" delta="목표 이내" positive icon="chart-line"/></div>
          <div className="stat-card"><StatCard label="사진 조회 p99" value="118ms" delta="관찰 필요" positive={false} icon="warning-circle"/></div>
          <div className="card" style={{padding:18}}>
            <div style={{fontSize:12.5,fontWeight:700,marginBottom:10}}>참가자 조회 지연 원인 비율</div>
            <div style={{height:110}}>
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={DELAY_CAUSE} dataKey="value" innerRadius={30} outerRadius={48} paddingAngle={3}>
                    {DELAY_CAUSE.map((e,i)=><Cell key={i} fill={PIE_COLORS[i]}/>)}
                  </Pie>
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CostView({toast}){
  const [selected, setSelected] = useState('g5.xlarge');
  const [hours, setHours] = useState(3);
  const inst = INSTANCE_OPTIONS.find(i=>i.id===selected);
  const estimate = inst.price * hours;
  return (
    <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:18}}>
      <div>
        <div className="card" style={{padding:24,marginBottom:16}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>대회별 GPU 인스턴스 가동 · 예상 비용</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {EVENTS.map(e=>(
              <div key={e.id} className="card flat" style={{padding:14,display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:36,height:36,borderRadius:11,background:'var(--marigold)',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="cpu" size={17} style={{color:'var(--orange)'}}/></div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,fontWeight:600}}>{e.name}</div>
                  <div style={{fontSize:11.5,color:'var(--stone)'}}>{e.date} · 가동 {e.duration}</div>
                </div>
                <div style={{fontSize:14,fontWeight:700}}>{e.cost.toLocaleString()}원</div>
              </div>
            ))}
          </div>
        </div>
        <div className="card" style={{padding:24}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>월별 GPU 비용 추이</div>
          <div style={{height:220}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={MONTHLY_COST}>
                <CartesianGrid stroke="#eee2d3" vertical={false}/>
                <XAxis dataKey="m" tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fontSize:11,fill:'#8e8b87'}} axisLine={false} tickLine={false}/>
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}}/>
                <Bar dataKey="v" fill="#fa5d00" radius={[8,8,0,0]} barSize={30}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
      <div className="card" style={{padding:24,height:'fit-content'}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:16}}>비용 시뮬레이션</div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:11.5,color:'var(--stone)'}}>인스턴스 타입</label>
          <select className="input-light" style={{width:'100%',marginTop:5}} value={selected} onChange={e=>setSelected(e.target.value)}>
            {INSTANCE_OPTIONS.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
          </select>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11.5,color:'var(--stone)'}}>예상 가동 시간</label>
          <input type="number" className="input-light" style={{width:'100%',marginTop:5}} value={hours} onChange={e=>setHours(Number(e.target.value)||0)}/>
        </div>
        <div className="card flat" style={{padding:16,marginBottom:16,textAlign:'center'}}>
          <div style={{fontSize:11.5,color:'var(--stone)'}}>예상 비용</div>
          <div style={{fontSize:28,fontWeight:700,color:'var(--orange)',marginTop:4}}>{estimate.toLocaleString()}원</div>
        </div>
        <button className="btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={()=>toast('비용 시뮬레이션이 갱신되었습니다')}><Icon name="calculator" size={15}/> 시뮬레이션 갱신</button>
      </div>
    </div>
  );
}

function CompareView(){
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState(['EV-0818','EV-0817']);
  const filtered = EVENTS.filter(e=>e.name.toLowerCase().includes(query.toLowerCase()));
  const toggle = (id)=>{
    setSelected(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : (prev.length<4 ? [...prev,id] : prev));
  };
  const compareRows = EVENTS.filter(e=>selected.includes(e.id));
  return (
    <div>
      <div className="card" style={{padding:20,marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
        <Icon name="magnifying-glass" size={17} style={{color:'var(--stone)'}}/>
        <input className="input-light" style={{flex:1,border:'none',background:'transparent'}} placeholder="대회명으로 검색…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <span className="badge badge-info">최대 4개 선택 · {selected.length}/4</span>
      </div>
      <div className="card" style={{padding:0,marginBottom:20,overflow:'hidden'}}>
        {filtered.map((e,i)=>(
          <div key={e.id} onClick={()=>toggle(e.id)} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 20px',cursor:'pointer',borderBottom: i<filtered.length-1?'1px solid var(--mist)':'none'}}>
            <span className={'checkbox '+(selected.includes(e.id)?'checked':'')}>{selected.includes(e.id) && <Icon name="check" size={12} style={{color:'#fff'}}/>}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:13.5,fontWeight:600}}>{e.name}</div>
              <div style={{fontSize:11.5,color:'var(--stone)'}}>{e.date} · 사진 {e.photos.toLocaleString()}장</div>
            </div>
            <div style={{fontSize:12.5,color:'var(--stone)'}}>인식률 {e.success}%</div>
          </div>
        ))}
      </div>
      {compareRows.length>0 && (
        <div className="card" style={{padding:24}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:16}}>병렬 비교</div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr>
                  <th style={{textAlign:'left',padding:'8px 12px',color:'var(--stone)',fontWeight:500,fontSize:11.5}}>지표</th>
                  {compareRows.map(e=><th key={e.id} style={{textAlign:'left',padding:'8px 12px',fontWeight:700}}>{e.name}</th>)}
                </tr>
              </thead>
              <tbody>
                <tr style={{borderTop:'1px solid var(--mist)'}}><td style={{padding:'10px 12px',color:'var(--stone)'}}>처리 사진 수</td>{compareRows.map(e=><td key={e.id} style={{padding:'10px 12px'}}>{e.photos.toLocaleString()}장</td>)}</tr>
                <tr style={{borderTop:'1px solid var(--mist)'}}><td style={{padding:'10px 12px',color:'var(--stone)'}}>인식 성공률</td>{compareRows.map(e=><td key={e.id} style={{padding:'10px 12px'}}>{e.success}%</td>)}</tr>
                <tr style={{borderTop:'1px solid var(--mist)'}}><td style={{padding:'10px 12px',color:'var(--stone)'}}>GPU 비용</td>{compareRows.map(e=><td key={e.id} style={{padding:'10px 12px'}}>{e.cost.toLocaleString()}원</td>)}</tr>
                <tr style={{borderTop:'1px solid var(--mist)'}}><td style={{padding:'10px 12px',color:'var(--stone)'}}>가동 시간</td>{compareRows.map(e=><td key={e.id} style={{padding:'10px 12px'}}>{e.duration}</td>)}</tr>
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function ExportModal({onClose, toast}){
  const [format, setFormat] = useState('pdf');
  const [loading, setLoading] = useState(false);
  const run = ()=>{
    setLoading(true);
    setTimeout(()=>{ setLoading(false); onClose(); toast('리포트 내보내기가 완료되었습니다'); }, 1400);
  };
  return (
    <Modal title="리포트 내보내기" onClose={onClose} width={420}>
      <div style={{fontSize:12.5,color:'var(--stone)',marginBottom:14}}>내보낼 포맷을 선택하세요</div>
      <div style={{display:'flex',gap:10,marginBottom:20}}>
        {['pdf','csv'].map(f=>(
          <button key={f} onClick={()=>setFormat(f)} className="card flat" style={{flex:1,padding:16,textAlign:'center',border: format===f?'2px solid var(--orange)':'1px solid var(--mist)'}}>
            <Icon name={f==='pdf'?'file-pdf':'file-csv'} size={22} style={{color:'var(--orange)'}}/>
            <div style={{fontSize:12.5,fontWeight:600,marginTop:6,textTransform:'uppercase'}}>{f}</div>
          </button>
        ))}
      </div>
      <button className="btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={run} disabled={loading}>
        {loading ? <React.Fragment><Icon name="circle-notch" size={15}/> 생성 중…</React.Fragment> : <React.Fragment><Icon name="export" size={15}/> 내보내기</React.Fragment>}
      </button>
    </Modal>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [period, setPeriod] = useState('day');
  const [exportOpen, setExportOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const toast = (m)=>setToastMsg(m);

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <TopNav view={view} setView={setView} onExport={()=>setExportOpen(true)}/>
      <TabBar period={period} setPeriod={setPeriod}/>
      <main style={{flex:1,width:'100%',maxWidth:1320,margin:'20px auto 60px',padding:'0 28px',animation:'fadeInUp .3s ease'}}>
        {view==='main' && <MainView/>}
        {view==='performance' && <PerformanceView/>}
        {view==='cost' && <CostView toast={toast}/>}
        {view==='compare' && <CompareView/>}
      </main>
      {exportOpen && <ExportModal onClose={()=>setExportOpen(false)} toast={toast}/>}
      <Toast message={toastMsg} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
