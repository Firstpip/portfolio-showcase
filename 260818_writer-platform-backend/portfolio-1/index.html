<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글드림 작가 콘텐츠 마켓 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js" crossorigin></script>
<style>
  :root{
    --primary:#d4c7ff;
    --primary-strong:#6b46b3;
    --primary-deep:#4a2f7d;
    --secondary:#e3e3e2;
    --accent:#f6bc1e;
    --bg:#f2f0eb;
    --surface:#ffffff;
    --text:#292827;
    --text-2:#666666;
    --radius:16px;
    --shadow-subtle:0 1px 3px rgba(41,40,39,.06), 0 8px 24px rgba(41,40,39,.05);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  img{display:block;}
  a{text-decoration:none;color:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  @keyframes ripple{from{transform:scale(0);opacity:.45;}to{transform:scale(2.6);opacity:0;}}
  @keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(246,188,30,.5);}50%{box-shadow:0 0 0 6px rgba(246,188,30,0);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  .fade-up{animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) both;}
  .ripple-btn{position:relative;overflow:hidden;}
  .ripple-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:ripple .6s ease-out forwards;}

  /* ── search header (archetype signature) ── */
  .search-header{
    position:sticky; top:0; z-index:60;
    background:rgba(242,240,235,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(41,40,39,.08);
  }
  .header-row{
    display:flex; align-items:center; gap:24px;
    max-width:1360px; margin:0 auto;
    padding:18px 32px 14px;
  }
  .brand{font-size:21px; font-weight:700; letter-spacing:-.02em; color:var(--primary-deep); display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .brand i{font-size:22px;color:var(--accent);}
  .search-bar{
    display:flex; align-items:stretch;
    flex:1; max-width:640px;
    background:var(--surface);
    border-radius:999px;
    box-shadow:var(--shadow-subtle);
    padding:6px;
  }
  .search-segment{
    flex:1; text-align:left; padding:8px 18px; border-radius:999px;
    transition:background .18s;
  }
  .search-segment:hover, .search-segment.open{background:rgba(212,199,255,.35);}
  .segment-label{font-size:11px;font-weight:700;color:var(--text-2);}
  .segment-value{font-size:13px;color:var(--text);margin-top:2px;}
  .search-divider{width:1px;background:rgba(41,40,39,.1);margin:8px 0;}
  .search-submit{
    width:42px;height:42px;border-radius:50%;background:var(--primary-deep);
    color:#fff;display:flex;align-items:center;justify-content:center;margin:auto 0;flex-shrink:0;
    transition:transform .18s;
  }
  .search-submit:hover{transform:scale(1.06);}
  .search-dropdown{
    position:absolute; margin-top:8px; background:var(--surface); border-radius:12px;
    box-shadow:var(--shadow-subtle); padding:14px; width:260px; z-index:70;
    animation:fadeInUp .2s ease both;
  }
  .search-dropdown input{width:100%;padding:10px 12px;border:1px solid var(--secondary);border-radius:8px;font-size:13px;}
  .header-nav{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .header-nav a, .nav-btn{
    font-size:13.5px; font-weight:600; color:var(--text); padding:9px 14px; border-radius:999px;
    transition:background .18s;
  }
  .header-nav a:hover, .nav-btn:hover{background:rgba(41,40,39,.06);}
  .user-menu{
    width:40px;height:40px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-subtle);
    position:relative;
  }
  .notif-dot{position:absolute; top:6px; right:7px; width:7px;height:7px;border-radius:50%; background:var(--accent); animation:badgePulse 2s infinite;}

  .filter-chips{
    display:flex; gap:10px; overflow-x:auto; padding:6px 32px 18px;
    max-width:1360px; margin:0 auto;
    scrollbar-width:none;
  }
  .filter-chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--surface); color:var(--text-2); border:1px solid rgba(41,40,39,.08);
    transition:all .18s;
  }
  .chip:hover{transform:translateY(-1px); box-shadow:var(--shadow-subtle);}
  .chip.active{background:var(--primary-deep); color:#fff; border-color:var(--primary-deep);}
  .chip.filter-toggle{background:transparent; border-style:dashed;}

  /* quick access — feature entry points */
  .quick-access{
    max-width:1360px;margin:0 auto; padding:4px 32px 8px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
  }
  .quick-card{
    background:linear-gradient(155deg, #3d2461 0%, #6b2f52 100%);
    border:1px solid rgba(246,188,30,.25);
    border-radius:var(--radius); padding:18px 18px 16px; text-align:left;
    transition:transform .2s, box-shadow .2s;
  }
  .quick-card:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(61,36,97,.35);}
  .quick-card i{font-size:22px;color:var(--accent);}
  .quick-card .qc-title{display:block;font-size:13.5px;font-weight:700;margin-top:10px;line-height:1.35;color:#fdf8ee;}
  .quick-card .qc-desc{display:block;font-size:11.5px;color:#d8c3e8;margin-top:4px;}

  .main{max-width:1360px; margin:0 auto; padding:8px 32px 60px;}
  .section-title{font-size:20px; font-weight:700; margin:22px 0 16px; display:flex; align-items:center; gap:8px;}
  .section-title i{color:var(--accent);}

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:22px;
  }
  .listing-card{
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow-subtle);
    transition:transform .22s, box-shadow .22s;
    cursor:pointer;
  }
  .listing-card:hover{transform:translateY(-5px) scale(1.012); box-shadow:0 18px 34px rgba(41,40,39,.14);}
  .card-image-wrap{position:relative; aspect-ratio:4/3; overflow:hidden;}
  .card-image-wrap img{width:100%;height:100%;object-fit:cover; transition:transform .35s;}
  .listing-card:hover .card-image-wrap img{transform:scale(1.06);}
  .card-favorite{
    position:absolute; top:12px; right:12px; width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.85); display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);
  }
  .card-favorite.active i{color:#e8536b;}
  .card-badge{
    position:absolute; top:12px; left:12px; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; background:var(--accent); color:#3a2a05;
  }
  .card-body{padding:16px 16px 18px;}
  .card-row-1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:15.5px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-rating{font-size:13px; font-weight:700; color:#c9930f; display:flex; align-items:center; gap:3px; flex-shrink:0;}
  .card-meta{font-size:12.5px; color:var(--text-2); display:block; margin-top:5px;}
  .card-row-4{display:flex; align-items:baseline; gap:5px; margin-top:10px;}
  .card-price{font-size:17px; font-weight:800; color:var(--primary-deep);}
  .price-unit{font-size:11.5px; color:var(--text-2);}

  .footer{background:#eae6db; margin-top:40px; padding:44px 32px 28px;}
  .footer-cols{max-width:1360px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
  .footer-col h4{font-size:13px; margin:0 0 12px; color:var(--text-2);}
  .footer-col a, .footer-col button{display:block; font-size:13px; margin-bottom:8px; color:var(--text); text-align:left;}
  .footer-bottom{max-width:1360px; margin:28px auto 0; font-size:12px; color:var(--text-2); border-top:1px solid rgba(41,40,39,.08); padding-top:18px;}

  /* quick view drawer */
  .drawer-overlay{position:fixed; inset:0; background:rgba(41,40,39,.4); z-index:90; animation:fadeInUp .2s ease both;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw;
    background:var(--surface); z-index:91; box-shadow:-12px 0 40px rgba(41,40,39,.2);
    animation:drawerIn .32s cubic-bezier(.16,1,.3,1) both; overflow-y:auto;
    padding:26px 26px 30px;
  }
  .drawer-close{width:36px;height:36px;border-radius:50%;background:var(--bg); display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .drawer img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;}

  /* generic modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(41,40,39,.45); z-index:120; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeInUp .2s ease both;}
  .modal{background:var(--surface); border-radius:18px; width:100%; max-width:460px; padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.25); max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 6px; font-size:18px;}
  .modal .modal-sub{font-size:13px;color:var(--text-2);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--text-2);}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1px solid var(--secondary); border-radius:10px; font-size:13.5px;}
  .field textarea{min-height:80px; resize:vertical;}
  .btn{padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:700; transition:transform .15s, opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary-deep); color:#fff;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-accent{background:var(--accent); color:#3a2a05;}
  .btn-ghost{background:var(--bg); color:var(--text);}
  .btn-danger{background:#e8536b; color:#fff;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}

  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
    background:var(--primary-deep); color:#fff; padding:13px 22px; border-radius:999px;
    font-size:13.5px; font-weight:600; z-index:200; box-shadow:0 12px 30px rgba(0,0,0,.25);
    animation:toastIn .3s cubic-bezier(.16,1,.3,1) both; display:flex; align-items:center; gap:8px;
  }

  /* sub-screen shared chrome */
  .subscreen{max-width:1200px; margin:0 auto; padding:28px 32px 60px;}
  .breadcrumb{font-size:12.5px; color:var(--text-2); margin-bottom:14px; display:flex; align-items:center; gap:6px;}
  .breadcrumb button{color:var(--primary-deep); font-weight:700;}

  .detail-hero{border-radius:20px; overflow:hidden; aspect-ratio:21/8; position:relative; margin-bottom:22px;}
  .detail-hero img{width:100%;height:100%;object-fit:cover;}
  .detail-hero .overlay{position:absolute; inset:0; background:linear-gradient(0deg, rgba(41,40,39,.55), transparent 55%); display:flex; align-items:flex-end; padding:26px;}
  .detail-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:28px; align-items:start;}
  .status-badge{padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .status-badge.active{background:#e4f6ea; color:#1c7a3f;}
  .status-badge.expired{background:#f5e6e6; color:#a13232;}
  .status-badge.canceled{background:#efefef; color:#6b6b6b;}
  .status-badge.pending{background:#fff3d6; color:#a3720a;}
  .status-badge.approved{background:#e4f6ea; color:#1c7a3f;}
  .status-badge.rejected{background:#f5e6e6; color:#a13232;}
  .status-badge.processing{background:#e3edff; color:#2451c9;}
  .status-badge.done{background:#e4f6ea; color:#1c7a3f;}

  .tab-row{display:flex; gap:4px; border-bottom:1px solid rgba(41,40,39,.1); margin:18px 0;}
  .tab-row button{padding:10px 16px; font-size:13.5px; font-weight:700; color:var(--text-2); border-bottom:2px solid transparent;}
  .tab-row button.active{color:var(--primary-deep); border-color:var(--primary-deep);}

  .price-panel{background:var(--surface); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-subtle); position:sticky; top:100px;}
  .price-mode-row{display:flex; gap:8px; margin-bottom:16px;}
  .price-mode-row button{flex:1; padding:10px; border-radius:10px; font-size:12.5px; font-weight:700; background:var(--bg); border:1.5px solid transparent;}
  .price-mode-row button.active{background:rgba(212,199,255,.4); border-color:var(--primary-deep); color:var(--primary-deep);}
  .price-big{font-size:26px; font-weight:800; margin:10px 0 4px;}

  .editor-toolbar{display:flex; gap:4px; padding:8px; background:var(--bg); border-radius:10px 10px 0 0; border:1px solid var(--secondary); border-bottom:none;}
  .editor-toolbar button{width:32px;height:32px;border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .editor-toolbar button:hover{background:rgba(41,40,39,.08);}
  .editor-toolbar button.active{background:var(--primary-deep); color:#fff;}
  .editor-body{min-height:220px; border:1px solid var(--secondary); border-top:none; border-radius:0 0 10px 10px; padding:18px; font-size:14px; line-height:1.75; outline:none;}
  .editor-body:empty:before{content:attr(data-placeholder); color:#aaa;}
  .autosave-tag{font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:5px; margin-top:8px;}
  .autosave-tag.saving i{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .table-wrap{overflow-x:auto; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-subtle);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; padding:13px 16px; font-size:12px; color:var(--text-2); border-bottom:1px solid rgba(41,40,39,.08); white-space:nowrap;}
  tbody td{padding:13px 16px; border-bottom:1px solid rgba(41,40,39,.06);}
  tbody tr{transition:background .15s;}
  tbody tr:hover{background:rgba(212,199,255,.12);}

  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  .kpi-card{background:var(--surface); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-subtle);}
  .kpi-label{font-size:12px; color:var(--text-2); font-weight:600;}
  .kpi-value{font-size:27px; font-weight:800; margin:6px 0 4px;}
  .kpi-delta{font-size:12px; font-weight:700;}
  .kpi-delta.up{color:#1c7a3f;} .kpi-delta.down{color:#a13232;}

  .period-toggle{display:flex; gap:6px;}
  .period-toggle button{padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--bg); color:var(--text-2);}
  .period-toggle button.active{background:var(--primary-deep); color:#fff;}

  .chart-card{background:var(--surface); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-subtle);}
  .chart-box{height:260px; position:relative;}

  .my-work-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:12px; background:var(--surface); box-shadow:var(--shadow-subtle); margin-bottom:10px;}
  .my-work-row .wtitle{font-weight:700; font-size:14px;}
  .my-work-row .wmeta{font-size:12px; color:var(--text-2); margin-top:3px;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{width:32px;height:32px;border-radius:8px; display:flex;align-items:center;justify-content:center; background:var(--bg);}
  .icon-btn:hover{background:rgba(41,40,39,.1);}

  .noti-item{display:flex; gap:12px; padding:14px 16px; border-radius:12px; background:var(--surface); margin-bottom:8px; box-shadow:var(--shadow-subtle); cursor:pointer;}
  .noti-item.unread{border-left:3px solid var(--accent);}
  .noti-dot{width:8px;height:8px;border-radius:50%;background:var(--accent); flex-shrink:0; margin-top:6px;}
  .noti-item.read .noti-dot{background:transparent;}

  @media (max-width:960px){
    .quick-access{grid-template-columns:repeat(2,1fr);}
    .detail-grid{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:900px){
    .header-row{flex-wrap:wrap; padding:14px 20px 12px;}
    .search-bar{order:3; max-width:100%; width:100%; flex-basis:100%;}
    .header-nav{margin-left:auto;}
  }
  @media (max-width:600px){
    .header-row, .filter-chips, .quick-access, .main, .footer-cols, .hero-band-inner{padding-left:18px; padding-right:18px;}
    .quick-access{grid-template-columns:1fr; padding-left:18px; padding-right:18px;}
    .header-nav .nav-btn{display:none;}
    .kpi-row{grid-template-columns:1fr;}
  }

  /* ── hero visual band (procedural gradient + quill motif) ── */
  .hero-band{
    position:relative; overflow:hidden;
    background:linear-gradient(120deg, #3d2461 0%, #6b2f52 55%, #8a3a3f 100%);
    margin:0 0 4px;
  }
  .hero-band-inner{
    max-width:1360px; margin:0 auto; padding:34px 32px 30px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; z-index:2;
  }
  .hero-band-glow{
    position:absolute; top:-40%; right:-6%; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle, rgba(246,188,30,.35), transparent 70%);
    filter:blur(4px);
  }
  .hero-band-glow2{
    position:absolute; bottom:-50%; left:8%; width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(212,199,255,.28), transparent 72%);
  }
  .hero-band h2{color:#fdf8ee; font-size:24px; margin:0 0 6px; font-weight:460; letter-spacing:-.01em;}
  .hero-band p{color:#e6d9f5; font-size:13px; margin:0; max-width:420px; line-height:1.6;}
  .hero-quill{flex-shrink:0; opacity:.92;}
</style>
</head>
<body data-archetype="airbnb-search-grid">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;
const {AreaChart, Area, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

/* ───────────────── mock data ───────────────── */

const CATEGORIES = ['전체','웹소설','웹툰','에세이','시','판타지','로맨스','라이트노벨','미스터리','BL/GL'];

const AUTHORS = ['이서한','문가율','한소민','강도윤','오하늘','정유담','배지훈','신아리'];

function seedTitle(i){
  const titles = ['달빛 아래 은서점','붉은 실의 계약자','우리 동네 마법사','열두 시의 라디오',
    '해무 속 등대지기','비 오는 날의 편지','고백은 서툴게','겨울 항구의 노래',
    '카페 골목 탐정단','달의 이면에서','자정의 기록보관소','일곱 번째 계절',
    '유리병 속 편지','시간을 파는 상점','흐린 별의 지도','작은 마을의 큰 비밀'];
  return titles[i % titles.length];
}

const LISTINGS = Array.from({length:16}).map((_,i)=>({
  id:i+1,

function RippleButton({className, onClick, children, style, disabled}){
  const ref = useRef(null);
  function handle(e){
    if(disabled) return;
    const el = ref.current;
    if(el){
      const rect = el.getBoundingClientRect();
      const dot = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      dot.className='ripple-dot';
      dot.style.width = dot.style.height = size+'px';
      dot.style.left = (e.clientX-rect.left-size/2)+'px';
      dot.style.top = (e.clientY-rect.top-size/2)+'px';
      el.appendChild(dot);
      setTimeout(()=>dot.remove(), 650);
    }
    onClick && onClick(e);
  }
  return (
    <button ref={ref} className={'ripple-btn '+(className||'')} style={style} onClick={handle} disabled={disabled}>
      {children}
    </button>
  );
}

function Toast({message}){
  if(!message) return null;
  return <div className="toast" key={message}><i className="ph ph-check-circle"></i>{message}</div>;
}

          <p style={{fontSize:12, color:'var(--text-2)', marginBottom:16}}>
            {mode==='단건 구매' && '해당 화만 결제해 즉시 열람합니다.'}
            {mode==='정기 구독' && '매달 자동 결제되며 언제든 해지할 수 있습니다.'}
            {mode==='후원' && '작가에게 직접 전달되는 응원 결제입니다.'}
          </p>
          <RippleButton className="btn btn-primary" style={{width:'100%'}} onClick={()=>setPayOpen(true)}>결제하기</RippleButton>
        </div>
      </div>

      {payOpen && (
        <div className="modal-overlay" onClick={()=>!processing && setPayOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{mode} 결제</h3>
            <p className="modal-sub">{item.title} · {currency(priceMap[mode])}</p>
            {!processing ? (
              <div>
                {['토스페이먼츠 · 신용카드','카카오페이','네이버페이'].map(m=>(
                  <RippleButton key={m} className="btn btn-ghost" style={{width:'100%', marginBottom:8, textAlign:'left'}} onClick={()=>submitPay(m)}>
                    <i className="ph ph-credit-card" style={{marginRight:8}}></i>{m}
                  </RippleButton>
                ))}
                <div className="modal-actions"><RippleButton className="btn btn-ghost" onClick={()=>setPayOpen(false)}>취소</RippleButton></div>
              </div>
            ) : (
              <div style={{textAlign:'center', padding:'24px 0'}}>
                <i className="ph ph-circle-notch" style={{fontSize:32, animation:'spin 0.9s linear infinite', color:'var(--primary-deep)'}}></i>
                <p style={{fontSize:13, color:'var(--text-2)', marginTop:12}}>결제 승인을 확인하고 있습니다…</p>
              </div>
            )}
          </div>
        </div>
      )}

      {setModal && subStatus==='활성' && (
        <ConfirmDeleteInline show={false} />
      )}
    </div>
  );
}

function ConfirmDeleteInline(){ return null; }

/* ───────────────── writer studio ───────────────── */

function WriterStudio({pop, setModal}){
  const [status, setStatus] = useState('승인'); // 대기 | 승인 | 반려
  const [applyOpen, setApplyOpen] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [works, setWorks] = useState(MY_WORKS);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [content, setContent] = useState('');
  const [saveState, setSaveState] = useState('저장 완료');
  const saveTimer = useRef(null);
  const [format, setFormat] = useState({bold:true, italic:false, list:false, quote:false});

  function toggleFormat(key){
    setFormat(f=>({...f, [key]: !f[key]}));
  }

  function handleType(e){
    setContent(e.target.innerText);
    setSaveState('입력 중…');
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      setSaveState('자동저장 중…');
      setTimeout(()=>setSaveState('자동저장됨 · 방금 전'), 700);
    }, 1200);
  }

  function submitApply(){
    setApplyOpen(false);
    setStatus('대기');
    pop('작가 권한 신청이 접수되었습니다');
  }

  function confirmDelete(){
    setWorks(works.filter(w=>w.id!==deleteTarget.id));
    setDeleteTarget(null);
    pop('작품이 삭제되었습니다');
  }

  return (
    <div className="subscreen">
      <div className="breadcrumb"><span>작가 스튜디오</span></div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
        <h1 style={{fontSize:23, margin:0}}>작가 권한 및 콘텐츠 에디터</h1>
        <div className="period-toggle">
          <span style={{fontSize:12, color:'var(--text-2)', alignSelf:'center', marginRight:4}}>권한 상태 미리보기</span>
          {['대기','승인','반려'].map(s=>(
            <button key={s} className={status===s?'active':''} onClick={()=>setStatus(s)}>{s}</button>
          ))}
        </div>
      </div>

      {status==='승인' && (
        <React.Fragment>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
            <span className="status-badge approved">작가 권한 · 승인됨</span>
            <button className="nav-btn" style={{fontSize:12}} onClick={()=>setHistoryOpen(true)}>신청 내역 보기</button>
          </div>

          <div className="detail-grid" style={{gridTemplateColumns:'1.7fr 1fr'}}>
            <div>
              <div className="field">
                <label>작품 제목</label>
                <input placeholder="예: 달빛 아래 은서점 — 4화" />
              </div>
              <div className="field">
                <label>카테고리</label>
                <select>{CATEGORIES.slice(1).map(c=><option key={c}>{c}</option>)}</select>
              </div>
              <div className="editor-toolbar">
                <button className={format.bold?'active':''} title="굵게" onClick={()=>toggleFormat('bold')}><i className={format.bold?'ph-fill ph-text-b':'ph ph-text-b'}></i></button>
                <button className={format.italic?'active':''} title="기울임" onClick={()=>toggleFormat('italic')}><i className="ph ph-text-italic"></i></button>
                <button className={format.list?'active':''} title="목록" onClick={()=>toggleFormat('list')}><i className="ph ph-list-bullets"></i></button>
                <button className={format.quote?'active':''} title="인용" onClick={()=>toggleFormat('quote')}><i className="ph ph-quotes"></i></button>
              </div>
              <div className="editor-body" contentEditable suppressContentEditableWarning
                data-placeholder="본문을 입력하세요…" onInput={handleType}></div>
              <div className="autosave-tag" data-state={saveState}>
                <i className={saveState==='자동저장 중…' ? 'ph ph-circle-notch' : 'ph ph-cloud-check'}></i>
                {saveState}
              </div>
              <div style={{display:'flex', gap:8, marginTop:16}}>
                <RippleButton className="btn btn-ghost" onClick={()=>pop('임시저장되었습니다')}>임시저장</RippleButton>
                <RippleButton className="btn btn-primary" onClick={()=>pop('작품이 게시되었습니다')}>게시하기</RippleButton>
              </div>
            </div>

            <div>
              <h3 style={{fontSize:14, marginBottom:12}}>내 작품 목록</h3>
              {works.map(w=>(
                <div key={w.id} className="my-work-row">
                  <div>
                    <div className="wtitle">{w.title}</div>
                    <div className="wmeta">{w.status==='게시됨' ? <span className="status-badge active" style={{fontSize:10}}>게시됨</span> : <span className="status-badge pending" style={{fontSize:10}}>초안</span>} · {w.updatedAt}</div>
                  </div>
                  <div className="row-actions">
                    <button className="icon-btn" title="수정" onClick={()=>pop(`${w.title} 편집 화면을 엽니다`)}><i className="ph ph-pencil-simple"></i></button>
                    <button className="icon-btn" title="삭제" onClick={()=>setDeleteTarget(w)}><i className="ph ph-trash"></i></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}

      {status==='대기' && (
        <div style={{textAlign:'center', padding:'60px 20px', background:'var(--surface)', borderRadius:'var(--radius)', boxShadow:'var(--shadow-subtle)'}}>
          <i className="ph ph-hourglass-medium" style={{fontSize:36, color:'var(--accent)'}}></i>
          <h3 style={{marginTop:14}}>작가 권한 심사 대기 중입니다</h3>
          <p style={{fontSize:13, color:'var(--text-2)'}}>승인 전까지 콘텐츠 에디터에 접근할 수 없습니다. 영업일 기준 최대 3일이 소요됩니다.</p>
          <RippleButton className="btn btn-ghost" onClick={()=>setHistoryOpen(true)}>신청 내역 보기</RippleButton>
        </div>
      )}

      {status==='반려' && (
        <div style={{textAlign:'center', padding:'60px 20px', background:'var(--surface)', borderRadius:'var(--radius)', boxShadow:'var(--shadow-subtle)'}}>
          <i className="ph ph-x-circle" style={{fontSize:36, color:'#a13232'}}></i>
          <h3 style={{marginTop:14}}>작가 권한 신청이 반려되었습니다</h3>
          <p style={{fontSize:13, color:'var(--text-2)'}}>사유: 소개글에 필수 항목(연재 계획)이 누락되어 있습니다. 내용을 보완해 다시 신청해 주세요.</p>
          <RippleButton className="btn btn-primary" onClick={()=>setApplyOpen(true)}>다시 신청하기</RippleButton>
        </div>
      )}

      {applyOpen && (
        <div className="modal-overlay" onClick={()=>setApplyOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>작가 권한 신청</h3>
            <p className="modal-sub">신청 정보를 입력해 주세요</p>
            <div className="field"><label>작가명(필명)</label><input placeholder="예: 이서한" /></div>
            <div className="field"><label>소개 및 연재 계획</label><textarea placeholder="어떤 이야기를 연재하고 싶은지 소개해 주세요"></textarea></div>
            <div className="modal-actions">
              <RippleButton className="btn btn-ghost" onClick={()=>setApplyOpen(false)}>취소</RippleButton>
              <RippleButton className="btn btn-primary" onClick={submitApply}>신청 제출</RippleButton>
            </div>
          </div>
        </div>
      )}

      {historyOpen && (
        <div className="modal-overlay" onClick={()=>setHistoryOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>신청 내역</h3>
            <ul style={{fontSize:13, lineHeight:2.1, listStyle:'none', padding:0}}>
              <li><i className="ph ph-check-circle" style={{color:'#1c7a3f', marginRight:6}}></i>2026.08.01 — 신청 접수</li>
              <li><i className="ph ph-check-circle" style={{color:'#1c7a3f', marginRight:6}}></i>2026.08.02 — 검토 시작</li>
              <li><i className="ph ph-circle-notch" style={{color:'var(--primary-deep)', marginRight:6}}></i>2026.08.04 — 결과 안내 예정</li>
            </ul>
            <div className="modal-actions"><RippleButton className="btn btn-primary" onClick={()=>setHistoryOpen(false)}>확인</RippleButton></div>
          </div>
        </div>
      )}

      {deleteTarget && (
        <div className="modal-overlay" onClick={()=>setDeleteTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>작품 삭제</h3>
            <p className="modal-sub">'{deleteTarget.title}'을(를) 정말 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
            <div className="modal-actions">
              <RippleButton className="btn btn-ghost" onClick={()=>setDeleteTarget(null)}>취소</RippleButton>
              <RippleButton className="btn btn-danger" onClick={confirmDelete}>삭제</RippleButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────── writer stats ───────────────── */

function WriterStats({pop, setModal}){
  const [period, setPeriod] = useState('월');
  const [requestOpen, setRequestOpen] = useState(false);
  const [amount, setAmount] = useState('');
  const [history, setHistory] = useState(SETTLEMENT_HISTORY);
  const data = SALES_BY_PERIOD[period];

  const totalSales = data.reduce((a,d)=>a+d.sales,0);
  const totalViews = data.reduce((a,d)=>a+d.views,0);
  const available = 1250000;
  const minAmount = 100000;

  function submitRequest(){
    const val = Number(amount.replace(/[^0-9]/g,''));
    if(!val || val < minAmount) return;
    setHistory([{id:Date.now(), period:'2026-08', amount: val.toLocaleString('ko-KR')+'원', status:'대기', requestedAt:'2026.08.18'}, ...history]);
    setRequestOpen(false);
    setAmount('');
    pop('정산 신청이 접수되었습니다');
  }

  return (
    <div className="subscreen">
      <div className="breadcrumb"><span>작가 대시보드</span></div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, flexWrap:'wrap', gap:12}}>
        <h1 style={{fontSize:23, margin:0}}>작가 통계 및 정산</h1>
        <div className="period-toggle">
          {['주','월','전체'].map(p=>(
            <button key={p} className={period===p?'active':''} onClick={()=>setPeriod(p)}>{p}</button>
          ))}
        </div>
      </div>

      <div className="kpi-row">
        <div className="kpi-card"><div className="kpi-label">총 판매</div><div className="kpi-value">{totalSales.toLocaleString('ko-KR')}건</div><div className="kpi-delta up">▲ 전기간 대비 증가</div></div>
        <div className="kpi-card"><div className="kpi-label">총 조회수</div><div className="kpi-value">{totalViews.toLocaleString('ko-KR')}</div><div className="kpi-delta up">▲ 전기간 대비 증가</div></div>
        <div className="kpi-card"><div className="kpi-label">정산 가능 금액</div><div className="kpi-value">{available.toLocaleString('ko-KR')}원</div><div className="kpi-delta">최소 {minAmount.toLocaleString('ko-KR')}원 이상</div></div>
        <div className="kpi-card"><div className="kpi-label">정산 대기</div><div className="kpi-value">{history.filter(h=>h.status==='대기').length}건</div><div className="kpi-delta">처리까지 최대 5영업일</div></div>
      </div>

      <div className="chart-card" style={{marginBottom:22}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
          <h3 style={{fontSize:14.5, margin:0}}>판매·조회수 추이 ({period} 기준)</h3>
        </div>
        <div className="chart-box">
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={data} key={period}>
              <defs>
                <linearGradient id="salesGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor="#6b46b3" stopOpacity={0.35}/>
                  <stop offset="95%" stopColor="#6b46b3" stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(41,40,39,.08)" />
              <XAxis dataKey="label" tick={{fontSize:11}} />
              <YAxis tick={{fontSize:11}} />
              <Tooltip />
              <Area type="monotone" dataKey="sales" stroke="#6b46b3" fill="url(#salesGrad)" strokeWidth={2} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
        <h3 style={{fontSize:14.5, margin:0}}>월별 정산 내역</h3>
        <RippleButton className="btn btn-accent" onClick={()=>setRequestOpen(true)}>정산 신청</RippleButton>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>정산 월</th><th>금액</th><th>상태</th><th>신청일</th></tr></thead>
          <tbody>
            {history.map(h=>(
              <tr key={h.id}>
                <td>{h.period}</td>
                <td>{h.amount}</td>
                <td><span className={'status-badge '+(h.status==='완료'?'done':h.status==='처리중'?'processing':'pending')}>{h.status}</span></td>
                <td>{h.requestedAt}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {requestOpen && (
        <div className="modal-overlay" onClick={()=>setRequestOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>정산 신청</h3>
            <p className="modal-sub">정산 가능 금액 {available.toLocaleString('ko-KR')}원 (최소 {minAmount.toLocaleString('ko-KR')}원 이상 신청 가능)</p>
            <div className="field">
              <label>신청 금액</label>
              <input value={amount} onChange={e=>setAmount(e.target.value)} placeholder="예: 500000" />
            </div>
            {amount && Number(amount.replace(/[^0-9]/g,'')) < minAmount && (
              <p style={{fontSize:12, color:'#a13232', marginTop:-8}}>최소 정산 금액 {minAmount.toLocaleString('ko-KR')}원 이상 입력해 주세요.</p>
            )}
            <div className="modal-actions">
              <RippleButton className="btn btn-ghost" onClick={()=>setRequestOpen(false)}>취소</RippleButton>
              <RippleButton className="btn btn-primary" disabled={!amount || Number(amount.replace(/[^0-9]/g,'')) < minAmount} onClick={submitRequest}>신청하기</RippleButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────── my page ───────────────── */

function MyPage(){
  const [tab, setTab] = useState('결제 내역');
  const [notis, setNotis] = useState(MY_NOTIFICATIONS);

  function toggleRead(id){
    setNotis(notis.map(n=>n.id===id ? {...n, read:true} : n));
  }

  return (
    <div className="subscreen">
      <div className="breadcrumb"><span>마이페이지</span></div>
      <h1 style={{fontSize:23, marginTop:0}}>마이페이지</h1>
      <div className="tab-row">
        {['결제 내역','알림 내역'].map(t=>(
          <button key={t} className={tab===t?'active':''} onClick={()=>setTab(t)}>
            {t}{t==='알림 내역' && notis.some(n=>!n.read) && <span style={{marginLeft:6, background:'var(--accent)', color:'#3a2a05', borderRadius:999, fontSize:10, padding:'1px 6px'}}>{notis.filter(n=>!n.read).length}</span>}
          </button>
        ))}
      </div>

      {tab==='결제 내역' && (
        <div className="table-wrap">
          <table>
            <thead><tr><th>콘텐츠</th><th>결제일</th><th>금액</th><th>상태</th></tr></thead>
            <tbody>
              {MY_PAYMENTS.map(p=>(
                <tr key={p.id}>
                  <td>{p.title}</td><td>{p.date}</td><td>{p.amount}</td>
                  <td><span className={'status-badge '+(p.status==='완료'?'done':'canceled')}>{p.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab==='알림 내역' && (
        <div>
          {notis.map(n=>(
            <div key={n.id} className={'noti-item '+(n.read?'read':'unread')} onClick={()=>toggleRead(n.id)}>
              <span className="noti-dot"></span>
              <div>
                <p style={{margin:0, fontSize:13.5, fontWeight:n.read?400:700}}>{n.text}</p>
                <span style={{fontSize:11.5, color:'var(--text-2)'}}>{n.time}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
