<style>
  :root{
    --primary:#000000;
    --secondary:#d4d4d4;
    --accent:#2563eb;
    --accent-deep:#1e40af;
    --bg:#ffffff;
    --surface:#f5f5f5;
    --text:#000000;
    --text-2:#262626;
    --text-3:#737373;
    --border:#e5e5e5;
    --radius:12px;
    --sidebar-w:240px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:13.5px;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes countPulse{0%{opacity:.4;}100%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes rowFlash{0%{background:rgba(37,99,235,.12);}100%{background:transparent;}}
  .fade-up{animation:fadeInUp .4s cubic-bezier(.16,1,.3,1) both;}
  .bar-fill{transform-origin:left; animation:barGrow .8s cubic-bezier(.16,1,.3,1) both;}
  .row-flash{animation:rowFlash 1.1s ease both;}

  /* ── sidebar (stripe-multipane signature) ── */
  .app-shell{display:flex; width:100%; min-height:100vh;}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w);
    background:#0a0a0a; color:#e5e5e5; display:flex; flex-direction:column;
    z-index:50; overflow-y:auto;
  }
  .sidebar-brand{padding:20px 20px 16px; display:flex; align-items:center; gap:9px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-brand i{color:var(--accent);}
  .sidebar-brand span{font-weight:700; font-size:14.5px;}
  .env-select{margin:14px 16px; padding:8px 10px; background:rgba(255,255,255,.06); border-radius:8px; font-size:11.5px; display:flex; justify-content:space-between; align-items:center; color:#a3a3a3;}
  .sidebar-section{padding:8px 12px;}
  .sidebar-section-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#737373; padding:10px 10px 4px;}
  .sidebar-link{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border-radius:7px; font-size:13px; color:#d4d4d4; margin-bottom:1px;
  }
  .sidebar-link:hover{background:rgba(255,255,255,.06);}
  .sidebar-link.active{background:var(--accent); color:#fff;}
  .sidebar-link i{flex-shrink:0;}
  .sidebar-foot{margin-top:auto; padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:#737373;}

  .main-wrap{margin-left:var(--sidebar-w); flex:1; min-width:0; width:calc(100% - var(--sidebar-w)); background:var(--bg);}
  .content{max-width:1360px; margin:0 auto; padding:26px 32px 60px;}

  .page-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .page-title-row{display:flex; align-items:center; gap:10px;}
  .page-title{font-size:20px; font-weight:700; margin:0;}
  .page-meta{font-size:12px; color:var(--text-3); margin-top:4px;}
  .page-actions{display:flex; gap:8px;}

  .btn{padding:9px 15px; border-radius:8px; font-size:12.5px; font-weight:600; transition:transform .12s, background .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-secondary{background:var(--surface); border:1px solid var(--border); color:var(--text);}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-danger{background:#dc2626; color:#fff;}
  .btn-sm{padding:6px 11px; font-size:11.5px;}

  .role-switch{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-3);}
  .role-switch select{padding:6px 9px; border:1px solid var(--border); border-radius:7px; font-size:12px;}

  /* KPI / hero-viz / widget-grid (insight-board composition) */
  .insight-board{display:grid; grid-template-columns:1.8fr 1fr; gap:16px; margin-bottom:16px;}
  .hero-viz{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .hero-viz-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .hero-viz h3{font-size:13.5px; margin:0;}
  .hero-viz-total{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1;}
  .hero-viz-total-label{font-size:11.5px; color:var(--text-3); font-weight:600; margin-bottom:2px;}
  .chart-box{height:250px;}

  .kpi-side{display:flex; flex-direction:column; gap:12px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; flex:1; display:flex; flex-direction:column; justify-content:center;}
  .stat-label{font-size:11px; color:var(--text-3); font-weight:600;}
  .stat-row-inline{display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px;}
  .stat-value{font-size:26px; font-weight:800; line-height:1;}
  .stat-delta{font-size:11px; font-weight:700; margin-top:5px;}
  .stat-delta.positive{color:#16a34a;} .stat-delta.negative{color:#dc2626;}
  .stat-sparkline{flex-shrink:0;}

  .widget-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px;}
  .widget{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:17px;}
  .widget h4{font-size:12.5px; margin:0 0 12px; color:var(--text-2);}
  .donut-wrap{display:flex; align-items:center; gap:14px;}
  .donut-legend{font-size:11px; color:var(--text-3); display:flex; flex-direction:column; gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;}
  .bar-row{margin-bottom:10px;}
  .bar-row-head{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;}
  .bar-track{height:6px; background:var(--border); border-radius:4px; overflow:hidden;}
  .bar-fill-el{height:100%; background:var(--accent); border-radius:4px;}
  .timeline-item{display:flex; gap:8px; font-size:11.5px; padding:6px 0; border-bottom:1px solid var(--border);}
  .timeline-item:last-child{border:none;}
  .timeline-dot{width:6px;height:6px;border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}

  /* data section: tabs + toolbar + table */
  .data-section{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .tab-bar{display:flex; gap:2px; padding:4px 16px 0; border-bottom:1px solid var(--border); background:var(--bg);}
  .tab-bar button{padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--text-3); border-bottom:2px solid transparent;}
  .tab-bar button.active{color:var(--text); border-color:var(--accent);}

  .search{padding:8px 12px; border:1px solid var(--border); border-radius:7px; font-size:12.5px; min-width:200px;}
  .filter-chip{padding:7px 12px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--surface); border:1px solid var(--border);}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{text-align:left; padding:10px 16px; font-size:11px; color:var(--text-3); background:var(--bg); border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:11px 16px; border-bottom:1px solid var(--border); background:var(--bg);}
  tbody tr:hover td{background:#fafafa;}
  tbody tr:last-child td{border-bottom:none;}

  .badge{padding:3px 9px; border-radius:5px; font-size:10.5px; font-weight:700; display:inline-block;}
  .badge.success{background:#dcfce7; color:#15803d;}
  .badge.warn{background:#fef3c7; color:#92400e;}
  .badge.danger{background:#fee2e2; color:#b91c1c;}
  .badge.neutral{background:#e5e5e5; color:#404040;}
  .badge.info{background:#dbeafe; color:#1e40af;}

  .icon-btn{width:28px;height:28px;border-radius:6px; display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--border);}
  .icon-btn:disabled{opacity:.35; cursor:not-allowed;}

  .breadcrumb{font-size:12px; color:var(--text-3); margin-bottom:6px; display:flex; gap:6px; align-items:center;}
  .breadcrumb button{color:var(--accent); font-weight:600;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:120; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeInUp .18s ease both;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:460px; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.28); max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 6px; font-size:16.5px;}
  .modal-sub{font-size:12.5px; color:var(--text-3); margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; font-weight:700; margin-bottom:5px; color:var(--text-3);}
  .field input, .field textarea, .field select{width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:13px;}
  .field textarea{min-height:70px; resize:vertical;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:#171717; color:#fff; padding:11px 20px; border-radius:8px;
    font-size:12.5px; font-weight:600; z-index:200; box-shadow:0 12px 30px rgba(0,0,0,.28);
    animation:toastIn .28s cubic-bezier(.16,1,.3,1) both; display:flex; align-items:center; gap:8px;
  }

  .content-review-cols{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
  .review-col-head{font-size:12px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .review-card{background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:9px; font-size:12px;}
  .review-card .rtitle{font-weight:700; margin-bottom:4px;}
  .review-card .rmeta{color:var(--text-3); font-size:11px; margin-bottom:8px;}
  .review-actions{display:flex; gap:6px;}

  .settlement-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .settlement-tabs button{padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; background:var(--surface); border:1px solid var(--border);}
  .settlement-tabs button.active{background:var(--text); color:#fff; border-color:var(--text);}

  .rate-input{width:70px; padding:5px 7px; border:1px solid var(--accent); border-radius:6px; font-size:12px;}

  @media (max-width:1080px){
    .insight-board{grid-template-columns:1fr;}
    .widget-grid{grid-template-columns:1fr;}
    .content-review-cols{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:640px){
    .page-header{flex-direction:column; align-items:stretch;}
    .page-actions{flex-wrap:wrap; width:100%;}
    .role-switch{width:100%; justify-content:space-between;}
    .content{padding:20px 16px 48px;}
    .content-review-cols{grid-template-columns:1fr;}
  }

  /* ── hero accent (procedural gradient depth) ── */
  .hero-viz{position:relative; overflow:hidden;}
  .hero-viz::before{
    content:''; position:absolute; top:-60%; right:-14%; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, rgba(37,99,235,.16), transparent 72%);
    pointer-events:none;
  }
  .hero-viz-total{background:linear-gradient(135deg,#0a0a0a,#1e3a8a 130%); -webkit-background-clip:text; background-clip:text; color:transparent;}
</style>
</head>

function Sparkline({data, color}){
  const w=64,h=26;
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*w},${h - ((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg className="stat-sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Icon({name, size=16}){
  const ref = React.useRef(null);
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, []);
  return <i ref={ref} data-lucide={name} style={{width:size, height:size}}></i>;
}

function Toast({message}){
  if(!message) return null;
  return <div className="toast" key={message}><Icon name="check-circle" size={15} />{message}</div>;
}

function ContentReview({pop}){

  function submitReject(){
    if(!reason.trim()) return;
    setItems(items.map(it=>it.id===rejectTarget.id?{...it, status:'반려', reason}:it));
    pop('반려 사유가 작가에게 알림으로 전달되었습니다');

                    <button className="btn btn-ghost btn-sm" onClick={()=>openReject(it)}>반려</button>
                    <button className="icon-btn" title="담당자 배정" onClick={()=>assign(it.id)}><Icon name="user-plus" size={13} /></button>
                  </div>
                )}

          </div>
        ))}
      </div>

            <h3>콘텐츠 반려</h3>

  const [payOpen, setPayOpen] = useState(false);

  function startEdit(r){ setEditingId(r.id); setEditVal(String(r.rate)); }
  function saveRate(id){
    setRates(rates.map(r=>r.id===id?{...r, rate:Number(editVal)||r.rate}:r));

    pop('수수료율이 변경되어 다음 정산 주기부터 적용됩니다');

  function processPay(){
    setTargets(targets.map(t=> selected.has(t.id) ? {...t, status:'완료'} : t));
    pop(`선택한 ${selected.size}건 정산이 지급 처리되었습니다`);
    setSelected(new Set());
    setPayOpen(false);

    <div>
      <div className="page-header">
        <div><h1 className="page-title">작가별 수수료율 설정 및 정산 지급 처리</h1><div className="page-meta">수수료율 관리 및 정산 지급 콘솔</div></div>
      </div>
      <div className="settlement-tabs">
        {['수수료율 설정','지급 대상'].map(t=>(
          <button key={t} className={tab===t?'active':''} onClick={()=>setTab(t)}>{t}</button>
        ))}
      </div>

      {tab==='수수료율 설정' && (
        <div className="data-section">
          <div className="data-table-wrap">
            <table>
              <thead><tr><th>작가</th><th>수수료율</th><th>계약 유형</th><th>최근 변경일</th><th></th></tr></thead>
              <tbody>
                {rates.map(r=>(
                  <tr key={r.id}>
                    <td>{r.writer}</td>
                    <td>
                      {editingId===r.id ? (
                        <input className="rate-input" value={editVal} onChange={e=>setEditVal(e.target.value)} />
                      ) : `${r.rate}%`}
                    </td>
                    <td><span className="badge info">{r.contract}</span></td>
                    <td>{r.updatedAt}</td>
                    <td>
                      {editingId===r.id ? (
                        <button className="btn btn-primary btn-sm" onClick={()=>saveRate(r.id)}>저장</button>
                      ) : (
                        <button className="icon-btn" title="수수료율 수정" onClick={()=>startEdit(r)}><Icon name="pencil" size={13} /></button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='지급 대상' && (
        <div className="data-section">
          <div className="data-toolbar">
            <span style={{fontSize:12, color:'var(--text-3)'}}>{selected.size}건 선택됨</span>
            <button className="btn btn-primary export-btn" disabled={selected.size===0} onClick={()=>setPayOpen(true)}><Icon name="banknote" size={13} /> 일괄 지급 처리</button>
          </div>
          <div className="data-table-wrap">
            <table>
              <thead><tr><th style={{width:36}}></th><th>작가</th><th>정산 금액</th><th>상태</th></tr></thead>
              <tbody>
                {targets.map(t=>(
                  <tr key={t.id}>
                    <td><input type="checkbox" checked={selected.has(t.id)} disabled={t.status==='완료'} onChange={()=>toggleSelect(t.id)} /></td>
                    <td>{t.writer}</td>
                    <td>{t.amount}</td>
                    <td><span className={'badge '+(t.status==='완료'?'success':t.status==='처리중'?'info':'warn')}>{t.status}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {payOpen && (
        <div className="modal-overlay" onClick={()=>setPayOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>일괄 지급 처리</h3>
            <p className="modal-sub">선택한 {selected.size}건을 지급 처리하시겠습니까? 처리 후 정산 대기 목록에서 제거됩니다.</p>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={()=>setPayOpen(false)}>취소</button>
              <button className="btn btn-primary" onClick={processPay}>지급 처리</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────── settlement log ───────────────── */

function SettlementLog({pop}){
  const [writerFilter, setWriterFilter] = useState('전체');
  const [exporting, setExporting] = useState(false);
  const writers = ['전체', ...new Set(SETTLEMENT_LOG.map(l=>l.writer))];
  const filtered = writerFilter==='전체' ? SETTLEMENT_LOG : SETTLEMENT_LOG.filter(l=>l.writer===writerFilter);

  function exportCsv(){
    setExporting(true);
    setTimeout(()=>{ setExporting(false); pop('정산 처리 이력 CSV 파일이 생성되었습니다'); }, 1400);
  }

  return (
    <div>
      <div className="page-header">
        <div><h1 className="page-title">정산 처리 이력</h1><div className="page-meta">전체 작가 정산 지급 기록</div></div>
      </div>
      <div className="data-section">
        <div className="data-toolbar">
          <select className="filter-chip" value={writerFilter} onChange={e=>setWriterFilter(e.target.value)}>
            {writers.map(w=><option key={w}>{w}</option>)}
          </select>
          <button className="btn btn-secondary export-btn" onClick={exportCsv} disabled={exporting}>
            {exporting ? <React.Fragment><Icon name="loader-2" size={13} /> 생성 중…</React.Fragment> : <React.Fragment><Icon name="download" size={13} /> CSV 내보내기</React.Fragment>}
          </button>
        </div>
        <div className="data-table-wrap">
          <table>
            <thead><tr><th>작가</th><th>지급 금액</th><th>상태</th><th>처리일</th><th>처리자</th></tr></thead>
            <tbody>
              {filtered.map(l=>(
                <tr key={l.id}>
                  <td>{l.writer}</td><td>{l.amount}</td>
                  <td><span className="badge success">{l.status}</span></td>
                  <td>{l.processedAt}</td><td>{l.by}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
