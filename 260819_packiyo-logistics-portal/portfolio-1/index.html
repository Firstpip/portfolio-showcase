<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카고베이스 Portal — 물류 통합 관리 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#fa5d00;
    --secondary:#c0bbb6;
    --accent:#1ef6da;
    --bg:#fff8f1;
    --surface:#ffffff;
    --text:#1d1e1c;
    --text2:#615f5c;
    --border:#e3d6c5;
    --border-soft:#d9d9d9;
    --success:#1f7a4d;
    --success-bg:#e4f3ea;
    --warning:#b4600a;
    --warning-bg:#fdecd6;
    --danger:#c23b28;
    --danger-bg:#fbe4df;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.2);
    --shadow-lg: 6px 4px 24px rgba(250,166,0,0.25);
    --radius-card:20px;
    --radius-ctrl:16px;
    --radius-tag:999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  .t-caption{font-size:13px;line-height:1.35;letter-spacing:.2px;}
  .t-subheading{font-size:18px;line-height:1.4;letter-spacing:.27px;}
  .t-heading-sm{font-size:20px;line-height:1.3;letter-spacing:.3px;font-weight:600;}
  .t-heading{font-size:24px;line-height:1.26;letter-spacing:.36px;font-weight:600;}
  .t-heading-lg{font-size:28px;line-height:1.2;letter-spacing:.42px;font-weight:700;}
  .t-display{font-size:40px;line-height:1.15;letter-spacing:.6px;font-weight:700;}

  /* ---- App shell ---- */
  .app-shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:240px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:24px 16px;
    overflow-y:auto;
    z-index:20;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 24px;}
  .brand-mark{
    width:36px;height:36px;border-radius:12px;
    background:linear-gradient(135deg,var(--primary),#ff8a3d);
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .brand-name{font-weight:700;font-size:16px;color:var(--text);}
  .brand-sub{font-size:11px;color:var(--text2);letter-spacing:.3px;}
  .sidebar-section{margin-bottom:20px;}
  .sidebar-section-title{
    font-size:11px;font-weight:600;color:var(--text2);
    letter-spacing:.6px;text-transform:uppercase;
    padding:0 10px;margin-bottom:8px;
  }
  .sidebar-link{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:none;border:none;
    padding:10px 12px;border-radius:12px;
    font-size:14px;font-weight:500;color:var(--text2);
    margin-bottom:2px;transition:background .15s,color .15s;
  }
  .sidebar-link:hover{background:var(--bg);color:var(--text);}
  .sidebar-link.active{background:#fff1e6;color:var(--primary);font-weight:600;}
  .sidebar-link i{width:18px;height:18px;flex-shrink:0;}
  .sidebar-footer{
    margin-top:auto;padding:14px 12px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:10px;
  }
  .avatar-mini{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#1ef6da,#0fb99e);
    display:flex;align-items:center;justify-content:center;
    color:#0a3a33;font-weight:700;font-size:12px;flex-shrink:0;
  }

  .main-wrap{
    margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);
    min-height:100vh;padding:28px 36px 60px;
  }

  .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  .page-title-row{display:flex;flex-direction:column;gap:4px;}
  .page-meta{color:var(--text2);font-size:13px;}
  .page-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .btn-primary{
    background:var(--primary);color:#fff;border:none;
    padding:12px 24px;border-radius:var(--radius-ctrl);
    font-size:14px;font-weight:600;letter-spacing:.015em;
    box-shadow:var(--shadow-sm);
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s, transform .1s;
  }
  .btn-primary:hover{background:#e05300;}
  .btn-primary:active{transform:scale(.97);}
  .btn-secondary{
    background:var(--surface);color:var(--text);border:1px solid var(--secondary);
    padding:11px 20px;border-radius:var(--radius-ctrl);
    font-size:14px;font-weight:500;
    display:inline-flex;align-items:center;gap:8px;
    transition:border-color .15s, background .15s;
  }
  .btn-secondary:hover{border-color:var(--primary);background:#fff6ee;}
  .btn-ghost{
    background:none;border:none;color:var(--text2);
    padding:8px 10px;border-radius:10px;font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-ghost:hover{background:var(--bg);color:var(--text);}

  /* ---- stat row ---- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{
    background:var(--surface);border-radius:var(--radius-card);
    padding:22px 22px 18px;border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;
    animation:cardIn .5s ease both;
  }
  .stat-card:nth-child(1){animation-delay:.02s;}
  .stat-card:nth-child(2){animation-delay:.08s;}
  .stat-card:nth-child(3){animation-delay:.14s;}
  .stat-card:nth-child(4){animation-delay:.2s;}
  .stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);transition:transform .18s, box-shadow .18s;}
  .stat-label{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .stat-value{font-size:28px;font-weight:700;letter-spacing:.2px;color:var(--text);}
  .stat-value.stat-hero{font-size:40px;}
  .stat-delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
  .stat-delta.positive{color:var(--success);}
  .stat-delta.negative{color:var(--danger);}
  .stat-delta.neutral{color:var(--text2);}
  .stat-sparkline{position:absolute;right:16px;bottom:14px;opacity:.9;}
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:var(--success);
    display:inline-block;animation:pulseDot 1.6s ease-in-out infinite;
  }

  /* ---- tabs ---- */
  .tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{
    background:none;border:none;padding:10px 16px;font-size:14px;font-weight:500;
    color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

  /* ---- master detail ---- */
  .master-detail{display:flex;gap:20px;align-items:flex-start;}
  .list-rail{flex:0 0 46%;min-width:0;background:var(--surface);border-radius:var(--radius-card);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;}
  .list-toolbar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .search-input{
    flex:1;padding:9px 14px;border-radius:12px;border:1px solid var(--secondary);
    font-size:13px;background:var(--bg);color:var(--text);
  }
  .search-input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .filter-chip{
    border:1px solid var(--secondary);background:var(--surface);color:var(--text2);
    border-radius:var(--radius-tag);padding:8px 14px;font-size:12px;font-weight:500;
    white-space:nowrap;
  }
  .filter-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .data-table{width:100%;border-collapse:collapse;}
  .data-table thead th{
    text-align:left;font-size:11px;font-weight:600;color:var(--text2);
    text-transform:uppercase;letter-spacing:.4px;
    padding:10px 16px;border-bottom:1px solid var(--border);background:#fffaf5;
  }
  .data-table tbody tr{border-bottom:1px solid #f1e9de;cursor:pointer;transition:background .12s;}
  .data-table tbody tr:hover{background:#fff6ec;}
  .data-table tbody tr.row-selected{background:#fff1e2;}
  .data-table td{padding:12px 16px;font-size:13px;vertical-align:middle;}
  .cell-strong{font-weight:600;color:var(--text);}
  .cell-muted{color:var(--text2);}

  .badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;border-radius:var(--radius-tag);
    font-size:11px;font-weight:600;
  }
  .badge-new{background:#fff1e2;color:var(--primary);}
  .badge-progress{background:var(--warning-bg);color:var(--warning);}
  .badge-ready{background:#e6f6f4;color:#0f8a79;}
  .badge-done{background:var(--success-bg);color:var(--success);}
  .badge-warn{background:var(--danger-bg);color:var(--danger);}
  .badge-ok{background:var(--success-bg);color:var(--success);}
  .badge-info{background:#e5fbf8;color:#0f8a79;}

  .detail-panel{
    flex:1;min-width:0;background:var(--surface);border-radius:var(--radius-card);
    border:1px solid var(--border);box-shadow:var(--shadow-sm);
    padding:26px 28px;min-height:520px;
    animation:panelFade .25s ease both;
  }
  .detail-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:460px;color:var(--text2);gap:12px;text-align:center;
  }
  .detail-empty i{width:40px;height:40px;color:var(--secondary);}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;}
  .detail-section{margin-bottom:22px;}
  .detail-section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .kv-item{display:flex;flex-direction:column;gap:2px;}
  .kv-label{font-size:12px;color:var(--text2);}
  .kv-value{font-size:14px;font-weight:600;color:var(--text);}
  .line-items{border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .line-item-row{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;border-bottom:1px solid #f1e9de;}
  .line-item-row:last-child{border-bottom:none;}
  .timeline{display:flex;flex-direction:column;gap:0;}
  .timeline-item{display:flex;gap:12px;position:relative;padding-bottom:18px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:4px;flex-shrink:0;position:relative;z-index:1;}
  .timeline-item:not(:last-child)::before{
    content:'';position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--border);
  }
  .timeline-text{font-size:13px;font-weight:600;color:var(--text);}
  .timeline-time{font-size:11px;color:var(--text2);}

  .sync-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#e5fbf8;color:#0f8a79;padding:6px 12px;border-radius:var(--radius-tag);
    font-size:12px;font-weight:600;
  }

  /* ---- inventory ---- */
  .metric-strip{display:flex;gap:20px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;flex-wrap:wrap;}
  .metric-strip-item{display:flex;flex-direction:column;gap:2px;padding-right:20px;border-right:1px solid var(--border);}
  .metric-strip-item:last-child{border-right:none;}
  .metric-strip-label{font-size:12px;color:var(--text2);}
  .metric-strip-value{font-size:20px;font-weight:700;}

  .inv-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start;}
  .flash-update{animation:flashUpdate 1s ease;}
  .alert-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-sm);}
  .alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f1e9de;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row i{color:var(--danger);width:18px;height:18px;flex-shrink:0;margin-top:2px;}

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(29,30,28,.45);
    display:flex;align-items:center;justify-content:center;z-index:100;
    padding:20px;animation:fadeIn .2s ease;
  }
  .modal-box{
    background:var(--surface);border-radius:24px;max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(29,30,28,.25);
    animation:fadeInScale .22s ease;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--border);}
  .modal-body{padding:22px 26px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px;border-top:1px solid var(--border);}
  .form-group{margin-bottom:16px;}
  .form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .form-input,.form-select,.form-textarea{
    width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--secondary);
    font-size:14px;background:var(--bg);color:var(--text);
  }
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---- toggle ---- */
  .toggle{width:42px;height:24px;border-radius:999px;background:var(--secondary);position:relative;border:none;transition:background .2s;flex-shrink:0;}
  .toggle.on{background:var(--primary);}
  .toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .toggle-knob{left:21px;}

  .settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1e9de;gap:16px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row-label{font-size:14px;font-weight:600;}
  .settings-row-desc{font-size:12px;color:var(--text2);margin-top:2px;}
  .copy-field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--text2);}

  .user-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1e9de;}
  .user-row:last-child{border-bottom:none;}
  .user-name-cell{display:flex;align-items:center;gap:10px;}

  /* ---- toast ---- */
  .toast-stack{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
  .toast{
    background:var(--text);color:#fff;padding:14px 20px;border-radius:14px;
    font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;animation:toastIn .3s ease;min-width:260px;
  }
  .toast i{color:var(--accent);width:18px;height:18px;flex-shrink:0;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes panelFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(31,122,77,.5);}50%{box-shadow:0 0 0 5px rgba(31,122,77,0);}}
  @keyframes flashUpdate{0%{background:#fff1e2;}100%{background:transparent;}}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

  @media (max-width:1100px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .master-detail{flex-direction:column;}
    .list-rail{flex:1;width:100%;}
    .inv-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>

/* ---------------- small shared widgets ---------------- */
function Sparkline({points, color}){
  const w=64,h=26;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/((max-min)||1))*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={norm} fill="none" stroke={color||"var(--primary)"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(
        <div className="toast" key={t.id}><i data-lucide="check-circle-2"></i>{t.text}</div>

    </div>
  );
}

  );
}

  const [flashSku, setFlashSku] = useState(null);
  const [detail, setDetail] = useState(null);

  useEffect(()=>{
    const timer = setInterval(()=>{
      setInv(prev=>{
        const idx = Math.floor(Math.random()*prev.length);
        const next = [...prev];
        const delta = Math.random()>0.5 ? 1 : -1;
        const item = {...next[idx]};
        item.available = Math.max(0, item.available + delta*(2+Math.floor(Math.random()*5)));
        item.status = item.available < item.safety ? "부족" : "정상";
        next[idx] = item;
        setFlashSku(item.sku);
        return next;
      });
    }, 4000);
    return ()=>clearInterval(timer);
  }, []);

  useEffect(()=>{
    if(!flashSku) return;
    const t = setTimeout(()=>setFlashSku(null), 1000);
    return ()=>clearTimeout(t);
  }, [flashSku]);

  const shortages = inv.filter(i=>i.status==="부족");
  const totals = inv.reduce((acc,i)=>({available:acc.available+i.available, reserved:acc.reserved+i.reserved}), {available:0,reserved:0});

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div className="t-heading-lg">실시간 재고 관리</div>
          <div className="page-meta"><span className="live-dot" style={{marginRight:6}}></span>WebSocket 기반으로 재고 변동이 실시간 반영됩니다</div>
        </div>
        <div className="page-actions">
          <button className="btn-secondary" onClick={()=>pushToast("재고 리포트를 생성했습니다")}><i data-lucide="file-text"></i>리포트 생성</button>
        </div>
      </div>

      <div className="metric-strip">
        <div className="metric-strip-item"><span className="metric-strip-label">가용 재고 합계</span><span className="metric-strip-value">{totals.available.toLocaleString()}개</span></div>
        <div className="metric-strip-item"><span className="metric-strip-label">예약 재고 합계</span><span className="metric-strip-value">{totals.reserved.toLocaleString()}개</span></div>
        <div className="metric-strip-item"><span className="metric-strip-label">부족 SKU</span><span className="metric-strip-value" style={{color:"var(--danger)"}}>{shortages.length}건</span></div>
      </div>

      <div className="inv-grid">
        <div className="list-rail" style={{flex:"none"}}>
          <table className="data-table">
            <thead><tr><th>SKU</th><th>상품명</th><th>가용</th><th>예약</th><th>안전임계</th><th>상태</th></tr></thead>
            <tbody>
              {inv.map(i=>(
                <tr key={i.sku} className={flashSku===i.sku?"flash-update":""} onClick={()=>setDetail(i)}>
                  <td className="cell-strong">{i.sku}</td>
                  <td className="cell-muted">{i.name}</td>
                  <td className="cell-strong">{i.available}</td>
                  <td className="cell-muted">{i.reserved}</td>
                  <td className="cell-muted">{i.safety}</td>
                  <td>{i.status==="정상" ? <span className="badge badge-ok">정상</span> : <span className="badge badge-warn">부족</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="alert-card">
          <div className="detail-section-title">재고 부족 알림</div>
          {shortages.length===0 ? <div className="page-meta">부족 SKU가 없습니다</div> : shortages.map(s=>(
            <div className="alert-row" key={s.sku}>
              <i data-lucide="alert-triangle"></i>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{s.name}</div>
                <div style={{fontSize:12,color:"var(--text2)"}}>{s.sku} · 가용 {s.available}개 (임계 {s.safety}개)</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {detail && (
        <Modal title={`${detail.sku} 재고 변동 이력`} onClose={()=>setDetail(null)} footer={<button className="btn-secondary" onClick={()=>setDetail(null)}>닫기</button>}>
          <div className="kv-grid" style={{marginBottom:18}}>
            <div className="kv-item"><span className="kv-label">가용 재고</span><span className="kv-value">{detail.available}개</span></div>
            <div className="kv-item"><span className="kv-label">예약 재고</span><span className="kv-value">{detail.reserved}개</span></div>
          </div>
          <div className="detail-section-title">변동 이력</div>
          <div className="timeline">
            {INVENTORY_HISTORY.map((h,i)=>(
              <div className="timeline-item" key={i}><div className="timeline-dot"></div><div><div className="timeline-text">{h.t}</div><div className="timeline-time">{h.time}</div></div></div>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Shipping view ---------------- */
function ShippingView({pushToast}){
  const [filter, setFilter] = useState("전체");
  const [detail, setDetail] = useState(null);
  const filtered = SHIPMENTS.filter(s=> filter==="전체" || s.status===filter);

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div className="t-heading-lg">배송·Tracking 관리</div>
          <div className="page-meta">배송 상태와 운송장 번호를 조회하고 배송사 트래킹 페이지로 이동할 수 있습니다.</div>
        </div>
      </div>

      <nav className="tab-bar" data-tabs>
        {["전체","배송중","배송완료","지연"].map(s=>(
          <button key={s} className={"tab"+(filter===s?" active":"")} onClick={()=>setFilter(s)}>{s}</button>
        ))}
      </nav>

      <div className="list-rail" style={{flex:"none", width:"100%"}}>
        <table className="data-table">
          <thead><tr><th>주문번호</th><th>배송사</th><th>운송장번호</th><th>상태</th><th>예상도착일</th></tr></thead>
          <tbody>
            {filtered.map(s=>(
              <tr key={s.id} onClick={()=>setDetail(s)}>
                <td className="cell-strong">{s.order}</td>
                <td className="cell-muted">{s.carrier}</td>
                <td>
                  <button className="btn-ghost" style={{padding:"4px 8px"}} onClick={(e)=>{e.stopPropagation(); window.open("https://tracking.cargobase.demo/"+s.tracking, "_blank"); pushToast("배송사 트래킹 페이지를 새 탭에서 엽니다");}}>
                    {s.tracking}<i data-lucide="external-link" style={{width:13,height:13}}></i>

                <td>{badgeForShipStatus(s.status)}</td>
                <td className="cell-muted">{s.delayed ? <span style={{color:"var(--danger)",fontWeight:600}}>{s.eta} (지연)</span> : s.eta}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <Modal title={detail.order} onClose={()=>setDetail(null)} footer={<button className="btn-secondary" onClick={()=>setDetail(null)}>닫기</button>}>
          <div className="kv-grid">
            <div className="kv-item"><span className="kv-label">배송사</span><span className="kv-value">{detail.carrier}</span></div>
            <div className="kv-item"><span className="kv-label">운송장번호</span><span className="kv-value">{detail.tracking}</span></div>
            <div className="kv-item"><span className="kv-label">배송상태</span><span className="kv-value">{badgeForShipStatus(detail.status)}</span></div>
            <div className="kv-item"><span className="kv-label">예상도착일</span><span className="kv-value">{detail.eta}</span></div>
          </div>
          <div className="detail-section" style={{marginTop:18}}>
            <div className="detail-section-title">배송지</div>
            <div className="page-meta">서울특별시 강남구 테헤란로 (수령인 배송지 정보)</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [view, setView] = useState("main");
  const [toasts, setToasts] = useState([]);

  function pushToast(text){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar view={view} setView={setView} />
      <main className="main-wrap">
        {view==="main" && <OrdersView pushToast={pushToast} />}
        {view==="po" && <POView pushToast={pushToast} />}
        {view==="inventory" && <InventoryView pushToast={pushToast} />}
        {view==="shipping" && <ShippingView pushToast={pushToast} />}
        {view==="settings" && <SettingsView pushToast={pushToast} />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
