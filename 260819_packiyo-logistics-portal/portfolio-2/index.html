<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    --primary:#5683da;
    --secondary:#d1d1d1;
    --accent:#ff8964;
    --bg:#ffffff;
    --surface:#e5e5e7;
    --card:#ffffff;
    --text:#090a0c;
    --text2:#95979e;
    --border:#d1d1d1;
    --success:#1c8a5f;
    --success-bg:#e2f4ec;
    --warning:#b45f10;
    --warning-bg:#fdecd9;
    --danger:#c23b28;
    --danger-bg:#fbe4df;
    --shadow-sm:0 4px 6px rgba(9,10,12,.06);
    --shadow-md:0 4px 16px rgba(9,10,12,.10);
    --shadow-xl:0 6px 25px rgba(9,10,12,.16);
    --radius-card:12px;
    --radius-pill:9999px;
    --radius-input:4px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .t-caption{font-size:11px;line-height:1.38;letter-spacing:-.1px;}
  .t-body{font-size:14px;line-height:1.5;letter-spacing:-.14px;}
  .t-body-lg{font-size:16px;line-height:1.5;letter-spacing:-.16px;}
  .t-subheading{font-size:18px;line-height:1.5;letter-spacing:-.36px;}
  .t-heading-sm{font-size:22px;line-height:1.25;font-weight:600;}
  .t-heading{font-size:24px;line-height:1.25;letter-spacing:-.48px;font-weight:600;}
  .t-display-sm{font-size:32px;line-height:1;letter-spacing:-1.6px;font-weight:600;}
  .t-display{font-size:44px;line-height:.95;letter-spacing:-2px;font-weight:700;}

  .app-root{width:100%;min-height:100vh;display:flex;flex-direction:column;}

  /* ---- top header ---- */
  .app-header{
    position:sticky;top:0;z-index:30;height:60px;
    display:flex;align-items:center;gap:20px;padding:0 28px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);width:100%;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex-shrink:0;}
  .brand-mark{width:30px;height:30px;border-radius:9999px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;}
  .project-switcher{
    display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;
    background:var(--surface);font-size:13px;font-weight:500;border:1px solid var(--border);
    flex-shrink:0;
  }
  .global-nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;}
  .nav-link{
    background:none;border:none;padding:8px 14px;border-radius:9999px;
    font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .nav-link:hover{background:var(--surface);color:var(--text);}
  .nav-link.active{background:var(--primary);color:#fff;}
  .header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;border-radius:9999px;border:none;background:none;
    display:flex;align-items:center;justify-content:center;color:var(--text2);
    font-size:17px;position:relative;
  }
  .icon-btn:hover{background:var(--surface);color:var(--text);}
  .notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .avatar-chip{width:32px;height:32px;border-radius:9999px;background:linear-gradient(135deg,var(--primary),#8fa8e8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}

  /* ---- secondary tabs ---- */
  .tab-bar{display:flex;gap:6px;padding:12px 28px;border-bottom:1px solid var(--border);width:100%;}
  .tab{
    background:none;border:none;padding:7px 16px;border-radius:9999px;
    font-size:13px;font-weight:500;color:var(--text2);
  }
  .tab:hover{background:var(--surface);}
  .tab.active{background:var(--text);color:#fff;}

  .content{width:100%;flex:1;max-width:1320px;margin:0 auto;padding:26px 28px 70px;}

  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .page-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:9999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:filter .15s,transform .1s;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.97);}
  .btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:9999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;}
  .btn-secondary:hover{border-color:var(--primary);color:var(--primary);}
  .btn-ghost{background:none;border:none;color:var(--text2);padding:6px 10px;border-radius:9999px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
  .btn-ghost:hover{background:var(--surface);color:var(--text);}

  /* ---- status strip (command tower region 1) ---- */
  .status-strip{
    display:flex;align-items:stretch;gap:0;border:1px solid var(--border);border-radius:var(--radius-card);
    background:linear-gradient(90deg,#fbfcff,#ffffff);overflow:hidden;margin-bottom:22px;flex-wrap:wrap;
  }
  .stat-chip{flex:1;min-width:180px;padding:16px 22px;border-right:1px solid var(--border);position:relative;animation:cardIn .45s ease both;}
  .stat-chip:last-child{border-right:none;}
  .stat-chip:nth-child(1){animation-delay:.02s;}
  .stat-chip:nth-child(2){animation-delay:.07s;}
  .stat-chip:nth-child(3){animation-delay:.12s;}
  .stat-chip:nth-child(4){animation-delay:.17s;}
  .stat-chip-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .stat-value{font-weight:700;color:var(--text);}
  .stat-delta{font-size:11px;font-weight:600;margin-top:4px;}
  .stat-delta.positive{color:var(--success);}
  .stat-delta.negative{color:var(--danger);}
  .live-pulse{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;animation:pulseDot 1.6s ease-in-out infinite;}

  /* ---- command tower grid ---- */
  .tower-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px 24px;box-shadow:var(--shadow-sm);}
  .panel-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}

  .chart-area{width:100%;height:140px;margin-bottom:6px;}

  .timeline-feed{display:flex;flex-direction:column;gap:0;max-height:340px;overflow-y:auto;}
  .feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eef0f2;animation:feedIn .35s ease both;}
  .feed-item:last-child{border-bottom:none;}
  .feed-icon{width:28px;height:28px;border-radius:9999px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;font-size:14px;}
  .feed-text{font-size:13px;font-weight:500;color:var(--text);}
  .feed-time{font-size:11px;color:var(--text2);margin-top:2px;}

  .priority-rail{display:flex;flex-direction:column;gap:10px;}
  .priority-item{border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:cardIn .4s ease both;}
  .priority-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .priority-client{font-size:13px;font-weight:700;}
  .priority-desc{font-size:12px;color:var(--text2);}
  .sev-badge{padding:3px 10px;border-radius:9999px;font-size:10px;font-weight:700;}
  .sev-urgent{background:var(--danger-bg);color:var(--danger);}
  .sev-warn{background:var(--warning-bg);color:var(--warning);}

  .secondary-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px;}
  .mini-widget{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px 20px;}
  .mini-widget-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;}
  .donut-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .donut-legend-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .bar-list-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-list-track{flex:1;height:7px;background:var(--surface);border-radius:9999px;overflow:hidden;}
  .bar-list-fill{height:100%;background:var(--primary);border-radius:9999px;}
  .heat-strip{display:flex;gap:5px;align-items:flex-end;height:56px;}
  .heat-bar{flex:1;background:var(--primary);border-radius:4px 4px 0 0;opacity:.85;}

  /* ---- generic table ---- */
  .table-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-sm);}
  .table-toolbar{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .search-input{flex:1;min-width:180px;padding:8px 14px;border-radius:var(--radius-input);border:1px solid var(--border);font-size:13px;background:var(--surface);color:var(--text);}
  .search-input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .data-table{width:100%;border-collapse:collapse;}
  .data-table thead th{text-align:left;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:10px 18px;border-bottom:1px solid var(--border);background:#fbfbfc;}
  .data-table tbody tr{border-bottom:1px solid #f0f1f2;cursor:pointer;transition:background .12s;}
  .data-table tbody tr:hover{background:#f7f9fd;}
  .data-table td{padding:12px 18px;font-size:13px;}
  .cell-strong{font-weight:700;}
  .cell-muted{color:var(--text2);}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:9999px;font-size:11px;font-weight:700;}
  .badge-wait{background:var(--warning-bg);color:var(--warning);}
  .badge-done{background:var(--success-bg);color:var(--success);}
  .badge-overdue{background:var(--danger-bg);color:var(--danger);}
  .badge-admin{background:#e8edfb;color:var(--primary);}
  .badge-user{background:var(--surface);color:var(--text2);}

  /* ---- returns board ---- */
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .board-col{background:#f7f8f9;border-radius:var(--radius-card);padding:14px;}
  .board-col-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;justify-content:space-between;}
  .board-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);animation:cardIn .35s ease both;}
  .board-card-client{font-size:13px;font-weight:700;margin-bottom:2px;}
  .board-card-reason{font-size:12px;color:var(--text2);margin-bottom:8px;}

  /* ---- modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .2s ease;}
  .modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:fadeInScale .22s ease;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);}
  .modal-body{padding:20px 24px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);}
  .form-group{margin-bottom:14px;}
  .form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .form-input,.form-select{width:100%;padding:10px 13px;border-radius:var(--radius-input);border:1px solid var(--border);font-size:13px;background:#fff;}
  .form-input:focus,.form-select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .kv-item{display:flex;flex-direction:column;gap:2px;}
  .kv-label{font-size:11px;color:var(--text2);}
  .kv-value{font-size:13px;font-weight:700;}

  .lang-pills{display:flex;gap:6px;margin-bottom:14px;}
  .lang-pill{padding:6px 14px;border-radius:9999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text2);}
  .lang-pill.active{background:var(--text);color:#fff;border-color:var(--text);}
  .lang-preview{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:#fbfcff;}

  .toast-stack{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
  .toast{background:var(--text);color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-xl);display:flex;align-items:center;gap:10px;animation:toastIn .3s ease;min-width:250px;}
  .toast i{color:var(--accent);}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes feedIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(28,138,95,.5);}50%{box-shadow:0 0 0 5px rgba(28,138,95,0);}}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
  @keyframes dashDraw{from{stroke-dashoffset:300;}to{stroke-dashoffset:0;}}

  @media (max-width:1080px){
    .tower-grid{grid-template-columns:1fr;}
    .secondary-row{grid-template-columns:1fr;}
    .board{grid-template-columns:1fr;}
  }
</style>
</head>

function Modal({title, onClose, children, footer}){

    <div className="modal-overlay" onClick={onClose}>

        <div className="modal-head"><div className="t-heading-sm">{title}</div><button className="btn-ghost" onClick={onClose}><i className="ph ph-x"></i></button></div>

function AreaChart(){
  const points = [22,28,24,32,30,38,34,42,39,46,43,50];
  const w=520,h=120,max=Math.max(...points),min=Math.min(...points);
  const step = w/(points.length-1);
  const coords = points.map((p,i)=>[i*step, h-((p-min)/((max-min)||1))*h]);
  const linePath = coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const areaPath = linePath + ` L${w},${h} L0,${h} Z`;
  return (
    <svg className="chart-area" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#5683da" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#5683da" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaPath} fill="url(#areaFill)" />
      <path d={linePath} fill="none" stroke="#5683da" strokeWidth="2.5" strokeLinecap="round" style={{strokeDasharray:600, strokeDashoffset:0, animation:"dashDraw 1.1s ease"}} />
    </svg>
  );
}
function Donut({segments}){
  const total = segments.reduce((a,s)=>a+s.value,0);
  let offset = 0;
  const r=34, c=2*Math.PI*r;
  return (
    <svg width="88" height="88" viewBox="0 0 88 88">
      <circle cx="44" cy="44" r={r} fill="none" stroke="#eef0f2" strokeWidth="12" />
      {segments.map((s,i)=>{
        const frac = s.value/total;
        const dash = frac*c;
        const el = <circle key={i} cx="44" cy="44" r={r} fill="none" stroke={s.color} strokeWidth="12"
          strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-offset} transform="rotate(-90 44 44)" strokeLinecap="butt" />;
        offset += dash;
        return el;
      })}
    </svg>
  );
}

          <div className="t-subheading" style={{fontWeight:700, marginBottom:6}}>{LANG_DICT[lang].welcome}</div>
          <div className="t-body" style={{color:"var(--text2)", marginBottom:12}}>{LANG_DICT[lang].orders}</div>
          <button className="btn-secondary" style={{fontSize:12}} onClick={()=>pushToast("리포트 다운로드를 시작합니다")}>{LANG_DICT[lang].cta}</button>
        </div>
      </div>

      <div className="table-panel">
        <table className="data-table">
          <thead><tr><th>고객사 계정</th><th>접근 범위</th><th>권한</th><th>최근 로그인</th><th></th></tr></thead>
          <tbody>
            {accounts.map(a=>(
              <tr key={a.id}>
                <td className="cell-strong">{a.client}</td>
                <td className="cell-muted">{a.scope}</td>
                <td>{badgeRole(a.role)}</td>
                <td className="cell-muted">{a.login}</td>
                <td><button className="btn-ghost" onClick={()=>setConfirmUser(a)}>비밀번호 재설정</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {createOpen && (
        <Modal title="고객사 계정 발급" onClose={()=>setCreateOpen(false)} footer={<>
          <button className="btn-secondary" onClick={()=>setCreateOpen(false)}>취소</button>
          <button className="btn-primary" onClick={submitAccount}>발급</button>
        </>}>
          <div className="form-group"><label className="form-label">고객사명</label><input className="form-input" value={form.client} onChange={e=>setForm({...form, client:e.target.value})} /></div>
          <div className="form-group"><label className="form-label">데이터 접근 범위</label>
            <select className="form-select" value={form.scope} onChange={e=>setForm({...form, scope:e.target.value})}>
              <option>주문</option><option>주문·재고</option><option>주문·배송</option><option>전체</option>
            </select>
          </div>
          <div className="form-group"><label className="form-label">권한</label>
            <select className="form-select" value={form.role} onChange={e=>setForm({...form, role:e.target.value})}>
              <option>일반</option><option>관리자</option>
            </select>
          </div>
        </Modal>
      )}

      {confirmUser && (
        <Modal title="비밀번호 재설정" onClose={()=>setConfirmUser(null)} footer={<>
          <button className="btn-secondary" onClick={()=>setConfirmUser(null)}>취소</button>
          <button className="btn-primary" onClick={()=>{ pushToast(`${confirmUser.client} 계정으로 재설정 링크가 발송되었습니다`); setConfirmUser(null); }}>발송</button>
        </>}>
          <div className="t-body">{confirmUser.client} 계정으로 비밀번호 재설정 링크를 발송하시겠습니까?</div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [view, setView] = useState("main");
  const [toasts, setToasts] = useState([]);
  const [clientOpen, setClientOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);

  function pushToast(text){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }

  return (
    <div className="app-root" data-archetype="topbar-analytics" onClick={()=>{ setClientOpen(false); setNotifOpen(false); }}>
      <Header view={view} setView={setView} clientOpen={clientOpen} setClientOpen={setClientOpen} notifOpen={notifOpen} setNotifOpen={setNotifOpen} pushToast={pushToast} />
      <main className="content">
        {view==="main" && <DashboardView pushToast={pushToast} />}
        {view==="returns" && <ReturnsView pushToast={pushToast} />}
        {view==="billing" && <BillingView pushToast={pushToast} />}
        {view==="accounts" && <AccountsView pushToast={pushToast} />}
        {view==="analytics" && <AnalyticsView />}
      </main>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
