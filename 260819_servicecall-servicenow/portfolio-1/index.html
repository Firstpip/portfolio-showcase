<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장비 서비스콜 이메일 자동 접수 관제 시스템 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --cream:#fff8f1; --paper:#ffffff; --flame:#fa5d00; --flame-dark:#d94f00; --teal:#1ef6da; --teal-dark:#0a7a6c;
  --ink:#1d1e1c; --stone:#615f5c; --driftwood:#8e8b87; --bone:#c0bbb6; --mist:#d9d9d9; --marigold:#fee3b5;
  --ok:#15895f; --ok-bg:rgba(21,137,95,.12); --warn:#b3690a; --warn-bg:rgba(179,105,10,.12);
  --err:#c62c3b; --err-bg:rgba(198,44,59,.11); --info:#0a7a6c; --info-bg:rgba(30,246,218,.16);
  --r-card:20px; --r-btn:16px; --r-input:16px; --r-tag:999px;
  --shadow-sm: rgba(0,0,0,.14) 0px 1px 4px 0px; --shadow-lg: rgba(250,166,0,.22) 6px 4px 24px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--flame);color:#fff;}

@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeInUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
@keyframes scaleIn{ from{opacity:0;transform:scale(.94);} to{opacity:1;transform:scale(1);} }
@keyframes pulseDot{ 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(21,137,95,.45);} 50%{opacity:.55;box-shadow:0 0 0 5px rgba(21,137,95,0);} }
@keyframes barGrow{ from{width:0;} }
@keyframes slideInRight{ from{opacity:0;transform:translateX(24px);} to{opacity:1;transform:translateX(0);} }
@keyframes toastIn{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
@keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }

.card{ background:var(--paper); border-radius:var(--r-card); box-shadow:var(--shadow-sm); border:1px solid rgba(29,30,28,.05); transition:transform .18s ease, box-shadow .18s ease; }
.card.hoverable:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }

.btn-primary{ background:var(--flame); color:#fff; border:none; border-radius:var(--r-btn); padding:10px 20px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm); transition:.15s; letter-spacing:.01em; }
.btn-primary:hover{ background:var(--flame-dark); }
.btn-primary:active{ transform:scale(.97); }
.btn-primary:disabled{ background:var(--bone); cursor:not-allowed; box-shadow:none; }
.btn-ghost{ background:transparent; color:var(--stone); border:1px solid var(--bone); border-radius:var(--r-btn); padding:9px 16px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:.15s; }
.btn-ghost:hover{ color:var(--ink); border-color:var(--flame); background:rgba(250,93,0,.05); }
.btn-danger{ background:transparent; color:var(--err); border:1px solid rgba(198,44,59,.35); border-radius:var(--r-btn); padding:8px 14px; font-size:12.5px; font-weight:500; }
.btn-danger:hover{ background:var(--err-bg); }
.btn-icon{ background:transparent; border:none; color:var(--stone); padding:6px; border-radius:10px; display:inline-flex; }
.btn-icon:hover{ background:var(--marigold); color:var(--flame); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:var(--r-tag); font-size:11px; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
.badge-ok{ background:var(--ok-bg); color:var(--ok); }
.badge-warn{ background:var(--warn-bg); color:var(--warn); }
.badge-err{ background:var(--err-bg); color:var(--err); }
.badge-info{ background:var(--info-bg); color:var(--info); }
.badge-neutral{ background:var(--marigold); color:var(--flame-dark); }

.sidebar-link{ display:flex; align-items:center; gap:10px; padding:10px 14px; margin:0 10px; border-radius:12px; color:var(--stone); font-size:13px; font-weight:500; border:none; background:transparent; width:calc(100% - 20px); text-align:left; transition:.15s; border-left:3px solid transparent; line-height:1.35; }
.sidebar-link:hover{ color:var(--ink); background:rgba(250,93,0,.06); }
.sidebar-link.active{ color:var(--flame-dark); background:var(--marigold); border-left:3px solid var(--flame); font-weight:600; }
.sidebar-link svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; }

.input-light{ background:var(--paper); border:1px solid var(--bone); border-radius:var(--r-input); color:var(--ink); padding:9px 13px; font-size:13.5px; width:100%; transition:.15s; }
.input-light::placeholder{ color:var(--driftwood); }
.input-light:focus{ outline:none; border-color:var(--flame); box-shadow:0 0 0 3px rgba(250,93,0,.12); }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--stone); margin-bottom:6px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(29,30,28,.45); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeIn .18s ease; padding:20px; }
.modal-body{ background:var(--paper); border-radius:var(--r-card); width:560px; max-width:100%; max-height:86vh; overflow-y:auto; animation:scaleIn .2s ease; box-shadow:0 24px 60px rgba(29,30,28,.25); }

.toast{ position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 20px; border-radius:14px; font-size:13.5px; display:flex; align-items:center; gap:9px; box-shadow:0 12px 30px rgba(0,0,0,.25); z-index:300; animation:toastIn .25s ease; }

.status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.status-dot.live{ background:var(--ok); animation:pulseDot 2s infinite; }
.status-dot.err{ background:var(--err); }

.progress-track{ height:7px; background:var(--marigold); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; animation:barGrow .9s ease; background:var(--flame); }

.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; padding:10px 12px; font-size:11px; font-weight:700; color:var(--driftwood); text-transform:uppercase; letter-spacing:.04em; border-bottom:1.5px solid var(--mist); white-space:nowrap; }
.tbl td{ padding:12px; border-bottom:1px solid #f0e9de; color:var(--ink); }
.tbl tbody tr{ transition:.15s; }
.tbl tbody tr:hover{ background:var(--cream); }

.stage-line{ display:flex; align-items:center; }
.stage-dot{ width:10px; height:10px; border-radius:50%; background:var(--paper); border:2px solid var(--bone); flex-shrink:0; }
.stage-dot.done{ background:var(--ok); border-color:var(--ok); }
.stage-dot.current{ background:var(--flame); border-color:var(--flame); }
.stage-seg{ flex:1; height:2px; background:var(--bone); }
.stage-seg.done{ background:var(--ok); }

.checkbox{ width:16px; height:16px; accent-color:var(--flame); cursor:pointer; }
.toggle{ width:38px; height:22px; border-radius:99px; background:var(--bone); position:relative; cursor:pointer; transition:.2s; flex-shrink:0; border:none; }
.toggle.on{ background:var(--flame); }
.toggle-knob{ width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.toggle.on .toggle-knob{ left:19px; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--bone); border-radius:8px; }
.skeleton{ background:linear-gradient(90deg, var(--marigold) 25%, #fff2de 37%, var(--marigold) 63%); background-size:400px 100%; animation:shimmer 1.4s infinite linear; border-radius:8px; }
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

/* ───────────────────────── 목데이터 ───────────────────────── */
const EQUIPMENT_TYPES = ['복합기','POS 단말기','CCTV 시스템','출입통제 리더기','무인정산기','냉난방기(HVAC)'];
const SITES = ['강남 A타워 3층','인천 물류센터 B동','판교 R&D센터 1층','수원 지점 로비','대전 공장 2공정','부산 사무동 5층'];
const MANAGERS = ['김도윤 대리','박서연 과장','이하준 사원','최지우 대리','정민재 과장','한소율 주임'];

let CALL_SEQ = 200;
function genCall(status, offsetMin){
  CALL_SEQ += 1;
  const eq = EQUIPMENT_TYPES[CALL_SEQ % EQUIPMENT_TYPES.length];
  return {
    id: 'SC-2608-'+(140+CALL_SEQ),
    equipment: eq,
    serial: 'SN-'+(80000+CALL_SEQ*7)+'-'+String.fromCharCode(65+(CALL_SEQ%5)),
    site: SITES[CALL_SEQ % SITES.length],
    manager: MANAGERS[CALL_SEQ % MANAGERS.length],
    receivedAt: `08.19 ${String(9+ (CALL_SEQ%8)).padStart(2,'0')}:${String((CALL_SEQ*7)%60).padStart(2,'0')}`,
    status,
    confidence: status==='PARSE_FAILED' ? 38 + (CALL_SEQ%20) : 82 + (CALL_SEQ%17),
    snTicket: status==='SENT' ? 'INC00'+(41200+CALL_SEQ) : null,
    retries: status==='SEND_FAILED' ? 1 + (CALL_SEQ%4) : 0,
  };
}
const INITIAL_CALLS = [
  ...Array.from({length:5},()=>genCall('SENT')),
  ...Array.from({length:3},()=>genCall('PARSED')),
  ...Array.from({length:3},()=>genCall('RECEIVED')),
  ...Array.from({length:2},()=>genCall('PARSE_FAILED')),
  ...Array.from({length:2},()=>genCall('SEND_FAILED')),
];

const EMAILS = [
  { id:'MAIL-9231', from:'callcenter@site-ops.example.com', subject:'[콜접수] 복합기 용지걸림 — 강남 A타워 3층', receivedAt:'08.19 09:12',
    raw:'안녕하세요, 강남 A타워 3층 복합기(S/N SN-84213-A)에서 용지 걸림 발생. 담당자 김도윤 대리(02-000-1234). 접수 09:10, 현장 확인 요청.',
    extracted:{equipment:'복합기', serial:'SN-84213-A', manager:'김도윤 대리', receivedTime:'09:10', endedTime:'—'},
    confidence:94, status:'auto' },
  { id:'MAIL-9232', from:'facility@bldg-mgmt.example.net', subject:'설비 이상 — 인천 물류센터 B동 냉난방기', receivedAt:'08.19 09:40',
    raw:'인천 물류센터 B동 냉난방기 이상 신호. 시리얼 확인 어려움. 현장 박서연 과장. 접수 09:38.',
    extracted:{equipment:'냉난방기(HVAC)', serial:null, manager:'박서연 과장', receivedTime:'09:38', endedTime:'—'},
    confidence:41, status:'manual_needed' },
  { id:'MAIL-9233', from:'callcenter@site-ops.example.com', subject:'[콜접수] CCTV 화면 끊김 — 판교 R&D센터 1층', receivedAt:'08.19 10:05',
    raw:'판교 R&D센터 1층 CCTV(SN-80441-C) 화면 간헐 끊김. 담당 이하준 사원. 접수 10:02, 종료 10:04.',
    extracted:{equipment:'CCTV 시스템', serial:'SN-80441-C', manager:'이하준 사원', receivedTime:'10:02', endedTime:'10:04'},
    confidence:97, status:'auto' },
  { id:'MAIL-9234', from:'ops@retail-site.example.org', subject:'무인정산기 오류코드 표시', receivedAt:'08.19 10:31',
    raw:'수원 지점 로비 무인정산기 오류코드 E-42 표시. 시리얼/담당자 정보 본문 누락. 회신 요청.',
    extracted:{equipment:'무인정산기', serial:null, manager:null, receivedTime:'10:29', endedTime:'—'},
    confidence:35, status:'manual_needed' },
];

const SYNC_LOGS = [
  { id:'SYN-7701', callId:'SC-2608-241', equipment:'복합기', sentAt:'08.19 09:14', statusCode:201, snStatus:'완료', retries:0,
    payload:'{\n  "short_description": "복합기 용지걸림",\n  "cmdb_ci": "SN-84213-A",\n  "caller_id": "kim.doyun",\n  "urgency": "3"\n}',
    response:'{ "result": { "sys_id": "9a21f...", "number": "INC0041302" } }' },
  { id:'SYN-7702', callId:'SC-2608-238', equipment:'냉난방기(HVAC)', sentAt:'08.19 09:02', statusCode:424, snStatus:'실패', retries:2,
    payload:'{\n  "short_description": "HVAC 이상신호",\n  "cmdb_ci": null,\n  "caller_id": "park.seoyeon",\n  "urgency": "2"\n}',
    response:'{ "error": { "message": "Mandatory field cmdb_ci missing" } }' },
  { id:'SYN-7703', callId:'SC-2608-235', equipment:'CCTV 시스템', sentAt:'08.19 08:51', statusCode:201, snStatus:'완료', retries:0,
    payload:'{\n  "short_description": "CCTV 화면 끊김",\n  "cmdb_ci": "SN-80441-C",\n  "caller_id": "lee.hajun",\n  "urgency": "3"\n}',
    response:'{ "result": { "sys_id": "7cd10...", "number": "INC0041298" } }' },
  { id:'SYN-7704', callId:'SC-2608-229', equipment:'무인정산기', sentAt:'08.19 08:20', statusCode:500, snStatus:'실패', retries:4,
    payload:'{\n  "short_description": "무인정산기 오류 E-42",\n  "cmdb_ci": "SN-77120-B",\n  "caller_id": null,\n  "urgency": "2"\n}',
    response:'{ "error": { "message": "Internal Server Error — upstream timeout" } }' },
  { id:'SYN-7705', callId:'SC-2608-224', equipment:'출입통제 리더기', sentAt:'08.19 07:58', statusCode:201, snStatus:'완료', retries:0,
    payload:'{\n  "short_description": "출입 리더기 인식불량",\n  "cmdb_ci": "SN-91004-D",\n  "caller_id": "choi.jiwoo",\n  "urgency": "3"\n}',
    response:'{ "result": { "sys_id": "3fe88...", "number": "INC0041291" } }' },
];

const INITIAL_EQUIPMENT = [
  { id:'EQ-001', name:'복합기 MX-4100', type:'복합기', serial:'SN-84213-A', site:'강남 A타워 3층', contractEnd:'2027-03-31', status:'계약중' },
  { id:'EQ-002', name:'냉난방기 HVAC-Pro9', type:'냉난방기(HVAC)', serial:'SN-70311-B', site:'인천 물류센터 B동', contractEnd:'2026-09-30', status:'만료임박' },
  { id:'EQ-003', name:'CCTV NX-220', type:'CCTV 시스템', serial:'SN-80441-C', site:'판교 R&D센터 1층', contractEnd:'2027-11-30', status:'계약중' },
  { id:'EQ-004', name:'무인정산기 KIOSK-7', type:'무인정산기', serial:'SN-77120-B', site:'수원 지점 로비', contractEnd:'2026-08-25', status:'만료임박' },
  { id:'EQ-005', name:'출입통제 리더기 R-30', type:'출입통제 리더기', serial:'SN-91004-D', site:'대전 공장 2공정', contractEnd:'2025-12-31', status:'만료' },
  { id:'EQ-006', name:'POS 단말기 P-500', type:'POS 단말기', serial:'SN-63212-E', site:'부산 사무동 5층', contractEnd:'2027-05-31', status:'계약중' },
];

const STATUS_LABEL = { RECEIVED:'접수', PARSED:'파싱완료', SENT:'전송완료', PARSE_FAILED:'파싱실패', SEND_FAILED:'전송실패' };
const STAGES = ['접수','파싱완료','전송완료'];

/* ───────────────────────── 공용 컴포넌트 ───────────────────────── */
function Icon({name, size=16, color}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[name]);
  return <i data-lucide={name} style={{width:size,height:size,color}} ref={ref}></i>;
}
function Toast({message, onClose}){
  useEffect(()=>{ if(!message) return; const t=setTimeout(onClose,2500); return ()=>clearTimeout(t); },[message]);
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle-2" size={15} color="var(--teal)"/>{message}</div>;
}
function Modal({title, subtitle, onClose, children, width}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-body" style={width?{width}:{}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'20px 22px',borderBottom:'1px solid var(--mist)'}}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>{title}</div>
            {subtitle && <div style={{fontSize:12.5,color:'var(--stone)',marginTop:4}}>{subtitle}</div>}
          </div>
          <button className="btn-icon" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <div style={{padding:22}}>{children}</div>
      </div>
    </div>
  );
}
function Badge({status}){
  const map = {
    RECEIVED:['badge-info','접수'], PARSED:['badge-warn','파싱완료'], SENT:['badge-ok','전송완료'],
    PARSE_FAILED:['badge-err','파싱실패'], SEND_FAILED:['badge-err','전송실패'],
    '완료':['badge-ok','완료'], '실패':['badge-err','실패'], '계약중':['badge-ok','계약중'], '만료임박':['badge-warn','만료임박'], '만료':['badge-err','만료'],
  };
  const [cls,label] = map[status] || ['badge-neutral', status];
  return <span className={'badge '+cls}>{label}</span>;
}

/* ───────────────────────── CmdK ───────────────────────── */
function CmdK({onClose, onNavigate}){
  const [q,setQ] = useState('');
  const items = [
    {icon:'gauge', label:'실시간 콜 접수 관제 대시보드', view:'main'},
    {icon:'mail-search', label:'이메일 자동 파싱 및 장비 매핑', view:'email-parsing'},
    {icon:'refresh-cw', label:'ServiceNow 연동 상태 및 재전송 관리', view:'servicenow-sync'},
    {icon:'server-cog', label:'계약 장비 및 시리얼 검증 관리', view:'equipment'},
    {icon:'settings', label:'시스템 설정', view:'settings'},
  ].filter(i=>i.label.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-body" style={{width:480}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--mist)'}}>
          <input autoFocus className="input-light" placeholder="명령 또는 화면 검색…" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <div style={{padding:8}}>
          <div style={{fontSize:11,color:'var(--driftwood)',padding:'6px 10px',textTransform:'uppercase',letterSpacing:'.06em'}}>바로가기</div>
          {items.map(it=>(
            <div key={it.view} className="sidebar-link" style={{width:'100%',margin:0,cursor:'pointer'}} onClick={()=>{onNavigate(it.view); onClose();}}>
              <Icon name={it.icon} size={15}/> {it.label} <span style={{marginLeft:'auto',color:'var(--driftwood)'}}><Icon name="corner-down-left" size={13}/></span>
            </div>
          ))}
          {items.length===0 && <div style={{padding:'14px 10px',fontSize:13,color:'var(--driftwood)'}}>검색 결과가 없습니다</div>}
        </div>
      </div>
    </div>
  );
}

/* ───────────────────────── 사이드바 · 헤더 ───────────────────────── */
function Sidebar({view, setView}){
  return (

/* ───────────────────────── 대시보드(main) — command-tower 컴포지션 ───────────────────────── */
function StatusStrip({calls}){
  const received = calls.filter(c=>c.status==='RECEIVED').length;
  const parsed = calls.filter(c=>c.status==='PARSED'||c.status==='SENT').length;
  const parseFailed = calls.filter(c=>c.status==='PARSE_FAILED').length;
  const sendFailed = calls.filter(c=>c.status==='SEND_FAILED').length;
  return (
    <div className="card" style={{display:'flex',alignItems:'center',padding:'14px 22px',gap:30,flexWrap:'wrap',marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span className="status-dot live"></span>
        <span style={{fontSize:13,fontWeight:600}}>실시간 파싱·전송 처리 중</span>
      </div>
      <div style={{width:1,height:22,background:'var(--mist)'}}></div>
      <StripStat label="파싱 대기" value={received} />
      <StripStat label="처리 완료(오늘)" value={parsed} tone="ok"/>
      <StripStat label="파싱 실패" value={parseFailed} tone="err"/>
      <StripStat label="전송 실패" value={sendFailed} tone="err"/>
      <StripStat label="평균 처리 지연" value="42초"/>
    </div>
  );
}
function StripStat({label, value, tone}){
  return (
    <div>
      <div style={{fontSize:10.5,color:'var(--driftwood)',marginBottom:2}}>{label}</div>
      <div style={{fontSize:16,fontWeight:700,color: tone==='ok'?'var(--ok)':tone==='err'?'var(--err)':'var(--ink)'}}>{value}</div>
    </div>
  );
}

function CallBoard({calls, onOpen}){

        <span className="badge badge-neutral">{calls.length}건 진행 중</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {calls.map(c=>{
          const stage = c.status==='RECEIVED'?0 : c.status==='PARSED'?1 : 2;
          return (
          <div key={c.id} className="card hoverable" style={{padding:14,cursor:'pointer'}} onClick={()=>onOpen(c)}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div>
                <div style={{fontSize:13.5,fontWeight:700}}>{c.equipment} · {c.site}</div>
                <div style={{fontSize:11,color:'var(--driftwood)'}}>{c.id} · 접수 {c.receivedAt} · {c.manager}</div>
              </div>
              <Badge status={c.status}/>
            </div>
            <div className="stage-line">
              {STAGES.map((s,i)=>(
                <React.Fragment key={s}>
                  <div className={'stage-dot '+(i<stage?'done':i===stage?'current':'')}></div>
                  {i<STAGES.length-1 && <div className={'stage-seg '+(i<stage?'done':'')}></div>}

        </button>

  );

/* ───────────────────────── ServiceNow 연동 화면 ───────────────────────── */
function ServiceNowView({toast}){
  const [logs, setLogs] = useState(SYNC_LOGS);
  const [filter, setFilter] = useState('전체');
  const [selectedIds, setSelectedIds] = useState([]);
  const [detail, setDetail] = useState(null);
  const filtered = logs.filter(l=> filter==='전체' || l.snStatus===filter);
  const toggleSelect = (id)=> setSelectedIds(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev,id]);
  const retry = (id)=>{
    setLogs(prev=>prev.map(l=> l.id===id ? {...l, snStatus:'완료', statusCode:201, retries:l.retries+1} : l));
    toast('재전송 완료 — ServiceNow 응답 201 수신');
  };
  const bulkRetry = ()=>{
    setLogs(prev=>prev.map(l=> selectedIds.includes(l.id) ? {...l, snStatus:'완료', statusCode:201, retries:l.retries+1} : l));
    toast(selectedIds.length+'건 일괄 재전송을 완료했습니다');
    setSelectedIds([]);
  };
  return (
    <div style={{animation:'fadeInUp .3s ease'}}>
      <div className="card" style={{padding:22}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',gap:6}}>
            {['전체','완료','실패'].map(f=>(
              <button key={f} className="btn-ghost" style={{padding:'7px 14px',fontSize:12.5, ...(filter===f?{background:'var(--marigold)',borderColor:'var(--flame)',color:'var(--flame-dark)'}:{})}} onClick={()=>setFilter(f)}>{f}</button>
            ))}
          </div>
          <button className="btn-primary" disabled={selectedIds.length===0} onClick={bulkRetry}>
            <Icon name="refresh-cw" size={14}/> 선택 {selectedIds.length}건 일괄 재전송
          </button>
        </div>
        <table className="tbl">
          <thead><tr><th></th><th>연동 ID</th><th>장비</th><th>전송 시각</th><th>상태 코드</th><th>결과</th><th>재시도</th><th></th></tr></thead>
          <tbody>
            {filtered.map(l=>(
              <tr key={l.id}>
                <td><input type="checkbox" className="checkbox" checked={selectedIds.includes(l.id)} onChange={()=>toggleSelect(l.id)}/></td>
                <td style={{fontWeight:600}}>{l.id}</td>
                <td>{l.equipment}</td>
                <td>{l.sentAt}</td>
                <td>{l.statusCode}</td>
                <td><Badge status={l.snStatus}/></td>
                <td>{l.retries}회</td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn-icon" title="상세 보기" onClick={()=>setDetail(l)}><Icon name="eye" size={15}/></button>
                    {l.snStatus==='실패' && <button className="btn-icon" title="재전송" onClick={()=>retry(l.id)}><Icon name="refresh-cw" size={15}/></button>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {detail && (
        <Modal title={detail.id+' · 연동 상세'} subtitle={detail.equipment+' · '+detail.sentAt} onClose={()=>setDetail(null)} width={560}>
          <div style={{fontSize:11.5,fontWeight:700,color:'var(--driftwood)',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:8}}>요청 페이로드</div>
          <pre style={{background:'var(--ink)',color:'#fdf0e0',padding:14,borderRadius:20,fontSize:12,overflowX:'auto',marginBottom:16}}>{detail.payload}</pre>
          <div style={{fontSize:11.5,fontWeight:700,color:'var(--driftwood)',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:8}}>응답</div>
          <pre style={{background:'var(--cream)',padding:14,borderRadius:20,fontSize:12,overflowX:'auto',marginBottom:16}}>{detail.response}</pre>
          {detail.snStatus==='실패' && (
            <button className="btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={()=>{retry(detail.id); setDetail(null);}}>
              <Icon name="refresh-cw" size={14}/> 지금 재전송
            </button>
          )}
        </Modal>
      )}
    </div>
  );
}

/* ───────────────────────── 계약 장비 관리 화면 ───────────────────────── */
function EquipmentView({toast}){
  const [equipment, setEquipment] = useState(INITIAL_EQUIPMENT);
  const [q, setQ] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const filtered = equipment.filter(e=> (e.name+e.serial+e.site).toLowerCase().includes(q.toLowerCase()));
  const addEquipment = (item)=>{
    if(equipment.some(e=>e.serial===item.serial)){ toast('시리얼 넘버가 이미 등록되어 있습니다'); return false; }
    setEquipment(prev=>[{...item, id:'EQ-'+(prev.length+1).toString().padStart(3,'0'), status:'계약중'}, ...prev]);
    toast('신규 장비를 등록했습니다');
    setShowAdd(false);
    return true;
  };
  const remove = (id)=>{ setEquipment(prev=>prev.filter(e=>e.id!==id)); setConfirmDel(null); toast('장비 정보를 삭제했습니다'); };
  return (
    <div style={{animation:'fadeInUp .3s ease'}}>
      <div className="card" style={{padding:22}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,gap:10,flexWrap:'wrap'}}>
          <input className="input-light" style={{maxWidth:280}} placeholder="장비명 · 시리얼 · 현장 검색" value={q} onChange={e=>setQ(e.target.value)}/>
          <button className="btn-primary" onClick={()=>setShowAdd(true)}><Icon name="plus" size={14}/> 신규 장비 등록</button>
        </div>
        <table className="tbl">
          <thead><tr><th>장비명</th><th>유형</th><th>시리얼</th><th>설치 현장</th><th>계약 종료</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {filtered.map(e=>(
              <tr key={e.id}>
                <td style={{fontWeight:600}}>{e.name}</td>
                <td>{e.type}</td>
                <td style={{fontFamily:'monospace',fontSize:12}}>{e.serial}</td>
                <td>{e.site}</td>
                <td>{e.contractEnd}</td>
                <td><Badge status={e.status}/></td>
                <td>
                  {confirmDel===e.id ? (
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn-danger" onClick={()=>remove(e.id)}>삭제 확정</button>
                      <button className="btn-ghost" style={{padding:'6px 10px',fontSize:12}} onClick={()=>setConfirmDel(null)}>취소</button>
                    </div>
                  ) : (
                    <button className="btn-icon" title="삭제" onClick={()=>setConfirmDel(e.id)}><Icon name="trash-2" size={15}/></button>
                  )}
                </td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan="7" style={{textAlign:'center',color:'var(--driftwood)',padding:20}}>검색 결과가 없습니다</td></tr>}
          </tbody>
        </table>
      </div>
      {showAdd && <EquipmentAddModal onClose={()=>setShowAdd(false)} onSubmit={addEquipment}/>}
    </div>
  );
}
function EquipmentAddModal({onClose, onSubmit}){
  const [form, setForm] = useState({name:'', type:EQUIPMENT_TYPES[0], serial:'', site:'', contractEnd:''});
  const [errors, setErrors] = useState({});
  const set = (k,v)=>setForm(prev=>({...prev,[k]:v}));
  const submit = ()=>{
    const err = {};
    if(!form.name) err.name='필수 입력입니다';
    if(!form.serial) err.serial='필수 입력입니다';
    if(!form.site) err.site='필수 입력입니다';
    if(!form.contractEnd) err.contractEnd='필수 입력입니다';
    setErrors(err);
    if(Object.keys(err).length>0) return;
    onSubmit(form);
  };
  return (
    <Modal title="신규 장비 등록" onClose={onClose} width={480}>
      <div className="field"><label>장비명</label><input className="input-light" value={form.name} onChange={e=>set('name',e.target.value)}/>{errors.name && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.name}</div>}</div>
      <div className="field"><label>유형</label>
        <select className="input-light" value={form.type} onChange={e=>set('type',e.target.value)}>
          {EQUIPMENT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>
      <div className="field"><label>시리얼 넘버</label><input className="input-light" value={form.serial} onChange={e=>set('serial',e.target.value)}/>{errors.serial && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.serial}</div>}</div>
      <div className="field"><label>설치 현장</label><input className="input-light" value={form.site} onChange={e=>set('site',e.target.value)}/>{errors.site && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.site}</div>}</div>
      <div className="field"><label>계약 종료일</label><input type="date" className="input-light" value={form.contractEnd} onChange={e=>set('contractEnd',e.target.value)}/>{errors.contractEnd && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.contractEnd}</div>}</div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}>
        <button className="btn-ghost" onClick={onClose}>취소</button>
        <button className="btn-primary" onClick={submit}><Icon name="check" size={14}/> 등록</button>
      </div>
    </Modal>
  );
}

/* ───────────────────────── 설정 화면 ───────────────────────── */
function SettingsView({toast}){
  const [autoRetry, setAutoRetry] = useState(true);
  const [notifyEmail, setNotifyEmail] = useState(true);
  const [threshold, setThreshold] = useState(60);
  return (
    <div style={{animation:'fadeInUp .3s ease', display:'flex', flexDirection:'column', gap:16}}>
      <SettingCard icon="mail-check" title="이메일 수신 계정 연동" status="연결됨" onAction={()=>toast('이메일 계정 연결을 재확인했습니다')} actionLabel="재연결 테스트">
        callcenter-relay@ops-mailbox.example.com · IMAP 폴링 60초 간격
      </SettingCard>
      <SettingCard icon="plug-zap" title="ServiceNow API 연동" status="연결됨" onAction={()=>toast('ServiceNow 테스트 연결 성공 — 응답 124ms')} actionLabel="연결 테스트">
        Base URL: https://demo-instance.service-now.com · 토큰 ●●●●●●●●3f2a
      </SettingCard>
      <div className="card" style={{padding:20}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>재전송 정책</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <span style={{fontSize:13}}>전송 실패 시 자동 재시도</span>
          <button className={'toggle'+(autoRetry?' on':'')} onClick={()=>setAutoRetry(v=>!v)}><span className="toggle-knob"></span></button>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:13,marginBottom:8}}>파싱 신뢰도 임계값 — <b>{threshold}%</b> 미만 시 수동 검토 큐로 분기</div>
          <input type="range" min="30" max="90" value={threshold} onChange={e=>setThreshold(e.target.value)} style={{width:'100%',accentColor:'var(--flame)'}}/>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13}}>임계값 미달 시 이메일 알림</span>
          <button className={'toggle'+(notifyEmail?' on':'')} onClick={()=>setNotifyEmail(v=>!v)}><span className="toggle-knob"></span></button>
        </div>
        <button className="btn-primary" style={{marginTop:16}} onClick={()=>toast('설정을 저장했습니다')}><Icon name="save" size={14}/> 변경사항 저장</button>
      </div>
    </div>
  );
}
function SettingCard({icon, title, status, children, onAction, actionLabel}){
  return (
    <div className="card" style={{padding:20,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
      <div style={{display:'flex',gap:12}}>
        <div style={{width:38,height:38,borderRadius:20,background:'var(--marigold)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name={icon} size={17} color="var(--flame-dark)"/>
        </div>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:14,fontWeight:700}}>{title}</span>
            <span className="badge badge-ok">{status}</span>
          </div>
          <div style={{fontSize:12,color:'var(--stone)',marginTop:4}}>{children}</div>
        </div>
      </div>
      <button className="btn-ghost" onClick={onAction}>{actionLabel}</button>
    </div>
  );
}

/* ───────────────────────── App ───────────────────────── */
function App(){
  const [view, setView] = useState('main');
  const [calls, setCalls] = useState(INITIAL_CALLS);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [openCall, setOpenCall] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  const toast = (m)=>setToastMsg(m);

  useEffect(()=>{
    const onKey = (e)=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(true); } };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[]);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const handleManual = (call)=>{ setView('email-parsing'); toast(call.id+' 건은 이메일 파싱 화면에서 수동 입력할 수 있습니다'); };
  const handleRetry = (call)=>{
    setCalls(prev=>prev.map(c=> c.id===call.id ? {...c, status:'SENT', snTicket:'INC00'+(41300+Math.floor(Math.random()*900))} : c));
    toast(call.id+' 재전송 완료 — ServiceNow 티켓이 발급되었습니다');
  };

  return (
    <div style={{display:'flex',width:'100%',minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView}/>
      <main style={{marginLeft:260, flex:1, minWidth:0, width:'calc(100% - 260px)', minHeight:'100vh'}}>
        <Breadcrumb view={view} onCmdk={()=>setCmdkOpen(true)}/>
        <div style={{padding:26}}>
          {view==='main' && <MainView calls={calls} onOpen={setOpenCall} onManual={handleManual} onRetry={handleRetry}/>}
          {view==='email-parsing' && <EmailParsingView toast={toast}/>}
          {view==='servicenow-sync' && <ServiceNowView toast={toast}/>}
          {view==='equipment' && <EquipmentView toast={toast}/>}
          {view==='settings' && <SettingsView toast={toast}/>}
        </div>
      </main>
      {cmdkOpen && <CmdK onClose={()=>setCmdkOpen(false)} onNavigate={setView}/>}
      <CallModal call={openCall} onClose={()=>setOpenCall(null)}/>
      <Toast message={toastMsg} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
