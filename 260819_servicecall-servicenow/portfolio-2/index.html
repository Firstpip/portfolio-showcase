<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT 서비스 운영 통합 관제 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --iris:#5683da; --iris-dim:rgba(86,131,218,.12); --ember:#ff8964; --ember-dim:rgba(255,137,100,.14);
  --bg:#ffffff; --linen:#f6f6f6; --tint:#e5e5e7; --border:#d1d1d1;
  --ink:#090a0c; --smoke:#5b5d66; --ash:#95979e;
  --ok:#1a9c6b; --ok-bg:rgba(26,156,107,.12); --warn:#b3690a; --warn-bg:rgba(179,105,10,.12);
  --err:#d7263d; --err-bg:rgba(215,38,61,.1);
  --r-card:16px; --r-tile:16px; --r-pill:9999px;
  --shadow-card: 0 1px 3px rgba(9,10,12,.06); --shadow-lift: 0 10px 30px rgba(9,10,12,.1);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--iris);color:#fff;}

@keyframes tileRise{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes scalePop{ from{opacity:0;transform:scale(.92);} to{opacity:1;transform:scale(1);} }
@keyframes pulseLive{ 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(26,156,107,.4);} 50%{opacity:.55;box-shadow:0 0 0 5px rgba(26,156,107,0);} }
@keyframes barUp{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes toastPop{ from{opacity:0;transform:translate(-50%,14px);} to{opacity:1;transform:translate(-50%,0);} }
@keyframes ringDraw{ from{stroke-dashoffset:340;} }
@keyframes feedIn{ from{opacity:0;transform:translateX(-8px);} to{opacity:1;transform:translateX(0);} }

.tile{ background:#fff; border:1px solid var(--tint); border-radius:var(--r-tile); padding:20px; box-shadow:var(--shadow-card); animation:tileRise .4s cubic-bezier(.22,1,.36,1) both; transition:.18s; }
.tile:hover{ border-color:var(--iris); box-shadow:var(--shadow-lift); }
.tile.span2{ grid-column:span 2; }
.tile.tall{ grid-row:span 2; }
.tile.beam{ background:radial-gradient(120% 120% at 8% 0%, rgba(86,131,218,.10) 0%, transparent 55%), #fff; }
.tile.warm{ background:radial-gradient(120% 120% at 92% 0%, rgba(255,137,100,.12) 0%, transparent 58%), #fff; }
.tile-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.tile-title{ font-size:13px; font-weight:700; color:var(--smoke); letter-spacing:-.1px; }
.tile-num{ font-size:44px; line-height:.95; letter-spacing:-2px; font-weight:700; }
.tile-num.sm{ font-size:30px; letter-spacing:-1px; }
.tile-lbl{ font-size:11.5px; color:var(--ash); margin-top:6px; }

.pill-btn{ display:inline-flex; align-items:center; gap:7px; padding:10px 20px; border-radius:var(--r-pill); font-size:13px; font-weight:600; transition:.18s; border:none; }
.pill-primary{ background:var(--iris); color:#fff; }
.pill-primary:hover{ filter:brightness(1.08); box-shadow:0 0 0 4px var(--iris-dim); }
.pill-primary:disabled{ background:var(--border); color:#fff; cursor:not-allowed; box-shadow:none; }
.pill-ghost{ border:1px solid var(--border); color:var(--ink); background:transparent; }
.pill-ghost:hover{ border-color:var(--iris); color:var(--iris); }
.pill-sm{ padding:7px 14px; font-size:12px; }
.pill-danger{ border:1px solid rgba(215,38,61,.35); color:var(--err); background:transparent; }
.pill-danger:hover{ background:var(--err-bg); }
.icon-pill{ width:36px; height:36px; border-radius:99px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; background:#fff; position:relative; transition:.15s; }
.icon-pill:hover{ border-color:var(--iris); color:var(--iris); transform:scale(1.06); }
.tile:hover{ transform:scale(1.012); }
.notif-dot{ position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:99px; background:var(--ember); }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:var(--r-pill); font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid transparent; transition:.15s; }
.chip-iris{ background:var(--iris-dim); color:#3d67c0; }
.chip-ember{ background:var(--ember-dim); color:#c1502e; }
.chip-ash{ background:var(--tint); color:var(--smoke); }
.chip-ok{ background:var(--ok-bg); color:var(--ok); }
.chip-err{ background:var(--err-bg); color:var(--err); }
.chip.on{ box-shadow:0 0 0 2px currentColor inset; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:var(--smoke); margin-bottom:6px; }
.field input, .field select, .field textarea{ width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--ink); font-size:13px; outline:none; transition:.15s; }
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--iris); box-shadow:0 0 0 3px var(--iris-dim); }

.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
.tbl th{ text-align:left; padding:9px 10px; font-size:10.5px; font-weight:700; color:var(--ash); text-transform:uppercase; letter-spacing:.05em; border-bottom:1.5px solid var(--tint); white-space:nowrap; }
.tbl td{ padding:11px 10px; border-bottom:1px solid var(--linen); color:var(--ink); }
.tbl tbody tr{ transition:.15s; cursor:pointer; }
.tbl tbody tr:hover{ background:var(--linen); }

.modal-back{ position:fixed; inset:0; background:rgba(9,10,12,.45); backdrop-filter:blur(3px); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .18s ease; }
.modal{ background:#fff; border-radius:20px; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; animation:scalePop .2s ease; box-shadow:0 30px 70px rgba(9,10,12,.25); }
.modal-head{ padding:20px 24px 14px; border-bottom:1px solid var(--tint); display:flex; align-items:flex-start; justify-content:space-between; }
.modal-body{ padding:20px 24px; }
.modal-foot{ padding:14px 24px 22px; display:flex; gap:9px; justify-content:flex-end; }

.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:200; background:var(--ink); color:#fff; padding:12px 22px; border-radius:var(--r-pill); font-size:13px; font-weight:500; display:flex; align-items:center; gap:9px; box-shadow:0 14px 40px rgba(0,0,0,.3); animation:toastPop .28s cubic-bezier(.22,1,.36,1) both; }

.live-dot{ width:8px; height:8px; border-radius:99px; background:var(--ok); display:inline-block; animation:pulseLive 2s infinite; }
.qbar{ height:6px; border-radius:99px; background:var(--tint); overflow:hidden; }
.qfill{ height:100%; border-radius:99px; transform-origin:left; animation:barUp .8s cubic-bezier(.22,1,.36,1) both; }

.toggle{ width:40px; height:23px; border-radius:99px; background:var(--border); position:relative; cursor:pointer; transition:.2s; border:none; flex-shrink:0; }
.toggle.on{ background:var(--iris); }
.toggle-knob{ width:17px; height:17px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.toggle.on .toggle-knob{ left:20px; }
.checkbox{ width:16px; height:16px; accent-color:var(--iris); cursor:pointer; }

.feed-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--linen); animation:feedIn .3s ease both; }
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}

.aurora-hero{ position:relative; overflow:hidden; background:#090a0c; border-radius:24px; padding:52px 44px; margin-bottom:26px; color:#fff; }
.aurora-beam{ position:absolute; top:-10%; bottom:-10%; left:10%; width:22%; background:linear-gradient(180deg, var(--iris) 0%, var(--ember) 55%, rgba(255,255,255,0) 100%); filter:blur(46px); opacity:.6; animation:beamPulse 4s ease-in-out infinite; }
.aurora-sunburst{ position:absolute; bottom:-45%; left:18%; width:62%; height:80%; background:radial-gradient(circle, rgba(255,137,100,.32), transparent 62%); }
.aurora-grid{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size:32px 32px; -webkit-mask-image:radial-gradient(ellipse 80% 60% at 30% 40%, #000 40%, transparent 100%); }
@keyframes beamPulse{ 0%,100%{opacity:.5;} 50%{opacity:.75;} }
.preview-frame{ position:absolute; right:36px; bottom:-18px; width:280px; background:#111214; border:1px solid #2b2f3c; border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.5); padding:16px; animation:tileRise .6s cubic-bezier(.22,1,.36,1) both .1s; }
.preview-frame .pf-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid #23262f; font-size:11px; color:#a9a9aa; }
.preview-frame .pf-dot{ width:6px; height:6px; border-radius:99px; display:inline-block; margin-right:6px; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

/* ───────────────────────── 목데이터 ───────────────────────── */
const EQUIPMENT_TYPES = ['복합기','POS 단말기','CCTV 시스템','출입통제 리더기','무인정산기','냉난방기(HVAC)'];
const SITES = ['강남 A타워 3층','인천 물류센터 B동','판교 R&D센터 1층','수원 지점 로비','대전 공장 2공정','부산 사무동 5층'];

const PARSE_FEED = [
  { id:'F-501', text:'복합기 용지걸림 — 강남 A타워 3층', conf:96, t:'11:02:14' },
  { id:'F-502', text:'CCTV 화면 끊김 — 판교 R&D센터 1층', conf:91, t:'11:01:48' },
  { id:'F-503', text:'냉난방기 이상신호 — 인천 물류센터 B동', conf:44, t:'11:00:59' },
  { id:'F-504', text:'무인정산기 오류코드 E-42 — 수원 지점 로비', conf:37, t:'10:59:20' },
  { id:'F-505', text:'출입통제 리더기 인식불량 — 대전 공장 2공정', conf:93, t:'10:58:02' },
];
const SYNC_FEED = [
  { id:'S-901', ticket:'INC0041302', code:201, t:'11:02:20' },
  { id:'S-902', ticket:'INC0041301', code:201, t:'11:01:55' },
  { id:'S-903', ticket:'—', code:424, t:'11:00:10', fail:true },
  { id:'S-904', ticket:'—', code:500, t:'10:58:40', fail:true },
  { id:'S-905', ticket:'INC0041298', code:201, t:'10:57:12' },
];
const RECENT_CALLS = [
  { id:'SC-2608-244', equipment:'복합기', serial:'SN-84213-A', site:'강남 A타워 3층', status:'전송완료' },
  { id:'SC-2608-243', equipment:'CCTV 시스템', serial:'SN-80441-C', site:'판교 R&D센터 1층', status:'전송완료' },
  { id:'SC-2608-242', equipment:'냉난방기(HVAC)', serial:'SN-70311-B', site:'인천 물류센터 B동', status:'재처리 대기' },
  { id:'SC-2608-241', equipment:'무인정산기', serial:'SN-77120-B', site:'수원 지점 로비', status:'재처리 대기' },
  { id:'SC-2608-240', equipment:'출입통제 리더기', serial:'SN-91004-D', site:'대전 공장 2공정', status:'전송완료' },
  { id:'SC-2608-239', equipment:'POS 단말기', serial:'SN-63212-E', site:'부산 사무동 5층', status:'전송완료' },
];
const MANUAL_QUEUE = [
  { id:'MAIL-9232', subject:'설비 이상 — 인천 물류센터 B동 냉난방기', raw:'인천 물류센터 B동 냉난방기 이상 신호. 시리얼 확인 어려움. 현장 박서연 과장. 접수 09:38.', fields:{equipment:'냉난방기(HVAC)', serial:'', manager:'박서연 과장'}, done:false },
  { id:'MAIL-9234', subject:'무인정산기 오류코드 표시', raw:'수원 지점 로비 무인정산기 오류코드 E-42 표시. 시리얼/담당자 정보 본문 누락. 회신 요청.', fields:{equipment:'무인정산기', serial:'', manager:''}, done:false },
  { id:'MAIL-9236', subject:'출입통제 리더기 응답 없음', raw:'대전 공장 2공정 출입통제 리더기 응답 없음. 담당자 미기재. 원격 재부팅 시도 후에도 동일.', fields:{equipment:'출입통제 리더기', serial:'', manager:''}, done:false },
];
let SEED = 400;
function genHistory(serial){
  const out = [];
  const n = 3 + (serial.charCodeAt(serial.length-1) % 4);
  for(let i=0;i<n;i++){
    SEED++;
    out.push({ id:'SC-2608-'+(SEED), date:`08.${10+(SEED%9)}`, issue:['용지걸림','화면끊김','이상신호','오류코드','인식불량','전원불량'][SEED%6], status: SEED%5===0?'재처리 대기':'전송완료' });
  }
  return out.sort((a,b)=> b.id.localeCompare(a.id));
}
const DEVICES = [
  { serial:'SN-84213-A', equipment:'복합기', site:'강남 A타워 3층' },
  { serial:'SN-70311-B', equipment:'냉난방기(HVAC)', site:'인천 물류센터 B동' },
  { serial:'SN-80441-C', equipment:'CCTV 시스템', site:'판교 R&D센터 1층' },
  { serial:'SN-77120-B', equipment:'무인정산기', site:'수원 지점 로비' },
  { serial:'SN-91004-D', equipment:'출입통제 리더기', site:'대전 공장 2공정' },
];

const ERROR_LOGS = [
  { id:'ERR-3301', source:'파싱', sev:'High', msg:'필수 필드(시리얼) 추출 실패 — 신뢰도 37%', t:'10:59:20', count:3 },
  { id:'ERR-3302', source:'연동', sev:'High', msg:'ServiceNow 응답 500 — upstream timeout', t:'10:58:40', count:5 },
  { id:'ERR-3303', source:'연동', sev:'Medium', msg:'ServiceNow 응답 424 — cmdb_ci 필드 누락', t:'11:00:10', count:2 },
  { id:'ERR-3304', source:'시스템', sev:'Low', msg:'IMAP 폴링 지연 — 평소 대비 +8초', t:'10:55:02', count:1 },
  { id:'ERR-3305', source:'파싱', sev:'Medium', msg:'담당자 필드 미검출 — 패턴 불일치', t:'10:52:11', count:4 },
  { id:'ERR-3306', source:'시스템', sev:'Low', msg:'DB 커넥션 풀 일시 포화 (자동 복구됨)', t:'10:40:55', count:1 },
];

/* ───────────────────────── 공용 컴포넌트 ───────────────────────── */
function Icon({name, size=16, style, weight='regular'}){
  const cls = weight==='fill' ? 'ph-fill ph-'+name : 'ph ph-'+name;
  return <i className={cls} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}
function Toast({message, onClose}){
  useEffect(()=>{ if(!message) return; const t=setTimeout(onClose,2500); return ()=>clearTimeout(t); },[message]);
  if(!message) return null;
  return <div className="toast"><Icon name="check-circle" weight="fill" size={16} style={{color:'#5ee0b0'}}/>{message}</div>;
}
function Modal({title, subtitle, onClose, children, width, footer}){
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" style={width?{maxWidth:width}:{}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div style={{fontSize:16,fontWeight:700}}>{title}</div>
            {subtitle && <div style={{fontSize:12.5,color:'var(--ash)',marginTop:4}}>{subtitle}</div>}
          </div>
          <button className="icon-pill" style={{width:30,height:30}} onClick={onClose}><Icon name="x" size={15}/></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}
function SevChip({sev}){
  const map = {High:['chip-err','High'], Medium:['chip-ember','Medium'], Low:['chip-ash','Low']};
  const [c,l] = map[sev];
  return <span className={'chip '+c}>{l}</span>;
}
function Sparkline({points, color, w=180, h=40}){
  const max = Math.max(...points), min = Math.min(...points);
  const step = w/(points.length-1);
  const path = points.map((p,i)=>{
    const x = i*step;
    const y = h - ((p-min)/(max-min||1))*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return (
    <svg width={w} height={h} style={{display:'block'}}>
      <path d={path} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function Ring({pct, color, size=88}){
  const r = 40, c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx="50" cy="50" r={r} fill="none" stroke="var(--tint)" strokeWidth="10"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c-(c*pct/100)} transform="rotate(-90 50 50)"
        style={{animation:'ringDraw 1s ease both', transition:'stroke-dashoffset .6s ease'}}/>
      <text x="50" y="55" textAnchor="middle" fontSize="20" fontWeight="700" fill="var(--ink)">{pct}%</text>
    </svg>
  );
}

/* ───────────────────────── 헤더 ───────────────────────── */
const NAV = [
  {view:'main', label:'통합 운영 현황 허브', icon:'squares-four'},
  {view:'manual-entry', label:'파싱 실패 수동 입력 및 재전송 워크플로우', icon:'pencil-simple-line'},
  {view:'call-history', label:'시리얼 넘버 기반 콜 이력 검색', icon:'magnifying-glass'},
  {view:'error-log', label:'연동 에러 및 시스템 로그 모니터링', icon:'warning-circle'},
];
function Header({view, setView, onSettings}){
  return (
    <header style={{position:'sticky',top:0,zIndex:20,background:'rgba(255,255,255,.92)',backdropFilter:'blur(10px)',borderBottom:'1px solid var(--tint)'}}>
      <div style={{height:3,background:'linear-gradient(90deg, var(--iris), var(--ember), #ffffff)'}}></div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 26px',height:64,gap:20}}>
        <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <span style={{width:32,height:32,borderRadius:10,background:'linear-gradient(135deg, var(--iris), var(--ember))',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Icon name="hexagon" weight="fill" size={16} style={{color:'#fff'}}/>
          </span>
          <span style={{fontWeight:700,fontSize:14.5}}>콜 옵스 허브</span>
        </div>
        <nav style={{display:'flex',gap:6,flexWrap:'wrap',flex:1,justifyContent:'center'}}>
          {NAV.map(n=>(
            <button key={n.view} className={'pill-btn pill-sm '+(view===n.view?'pill-primary':'pill-ghost')} title={n.label} onClick={()=>setView(n.view)}>
              <Icon name={n.icon} size={14}/>
              <span style={{maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.label}</span>
            </button>
          ))}

/* ───────────────────────── 수동 입력 워크플로우 ───────────────────────── */
function ManualEntryView({toast}){
  const [queue, setQueue] = useState(MANUAL_QUEUE);
  const [selected, setSelected] = useState(queue[0]);
  const [form, setForm] = useState(queue[0].fields);
  const [errors, setErrors] = useState({});
  const select = (item)=>{ setSelected(item); setForm(item.fields); setErrors({}); };
  const set = (k,v)=>setForm(prev=>({...prev,[k]:v}));
  const submit = ()=>{
    const err = {};
    if(!form.equipment) err.equipment='필수 입력';
    if(!form.serial) err.serial='필수 입력';
    setErrors(err);
    if(Object.keys(err).length>0) return;
    setQueue(prev=>prev.map(q=> q.id===selected.id ? {...q, done:true} : q));
    toast(selected.id+' 콜 등록 완료 — ServiceNow 재전송 큐에 추가되었습니다');
    const next = queue.find(q=>q.id!==selected.id && !q.done);
    if(next){ setSelected(next); setForm(next.fields); }
  };
  const pending = queue.filter(q=>!q.done);
  return (
    <div style={{display:'grid',gridTemplateColumns:'280px 1fr',gap:20}}>
      <div className="tile" style={{padding:16,alignSelf:'start'}}>
        <div className="tile-title" style={{marginBottom:10}}>수동 검토 대기 ({pending.length})</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {queue.map(q=>(
            <button key={q.id} onClick={()=>select(q)} disabled={q.done}
              className={'pill-btn '+(selected.id===q.id?'pill-primary':'pill-ghost')}
              style={{justifyContent:'flex-start',opacity:q.done?.4:1,fontSize:12,padding:'9px 14px'}}>
              {q.done ? <Icon name="check-circle" weight="fill" size={14}/> : <Icon name="clock" size={14}/>}
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{q.subject}</span>
            </button>
          ))}
        </div>
      </div>
      {selected && (
        <div className="tile" style={{padding:22}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{selected.subject}</div>
          <div style={{fontSize:12,color:'var(--ash)',marginBottom:18}}>{selected.id} · 자동 파싱 실패 — 수동 검토 필요</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
            <div>
              <div className="tile-title" style={{marginBottom:8}}>원본 메일 본문</div>
              <div style={{background:'var(--linen)',borderRadius:12,padding:14,fontSize:12.5,color:'var(--smoke)',lineHeight:1.6,minHeight:140}}>{selected.raw}</div>
            </div>
            <div>
              <div className="tile-title" style={{marginBottom:8}}>콜 등록 입력 폼</div>
              <div className="field"><label>장비명</label><input value={form.equipment||''} onChange={e=>set('equipment',e.target.value)}/>{errors.equipment && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.equipment}</div>}</div>
              <div className="field"><label>시리얼 넘버</label><input value={form.serial||''} onChange={e=>set('serial',e.target.value)}/>{errors.serial && <div style={{color:'var(--err)',fontSize:11,marginTop:4}}>{errors.serial}</div>}</div>
              <div className="field"><label>담당자</label><input value={form.manager||''} onChange={e=>set('manager',e.target.value)}/></div>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:10,borderTop:'1px solid var(--tint)',paddingTop:16}}>
            <button className="pill-btn pill-ghost" onClick={()=>toast('원문 메일함으로 이동합니다')}>메일 원문 열기</button>
            <button className="pill-btn pill-primary" onClick={submit}><Icon name="paper-plane-tilt" size={14}/> 콜 생성 및 재전송</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ErrorLogView(){
  const [source, setSource] = useState('전체');

  const [detail, setDetail] = useState(null);
  let logs = ERROR_LOGS.filter(l=> (source==='전체'||l.source===source) && (sev==='전체'||l.sev===sev));

  return (
    <div className="tile" style={{padding:22}}>
      <div style={{display:'flex',gap:16,marginBottom:18,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:6}}>

          ))}

        <tbody>
          {logs.map(l=>(
            <tr key={l.id} onClick={()=>setDetail(l)}>
              <td><SevChip sev={l.sev}/></td>
              <td><span className="chip chip-ash">{l.source}</span></td>
              <td>{l.msg}</td>

}

/* ───────────────────────── 설정 ───────────────────────── */
const ROLES = ['운영 관리자','현장 담당자','조회 전용'];
const PERMS = ['콜 목록 조회','장비 등록/수정','재전송 실행','시스템 설정 변경'];
function SettingsView({toast}){
  const [perm, setPerm] = useState(ROLES.map((_,ri)=> PERMS.map((_,pi)=> ri===0 ? 1 : (pi<2?1:0))));
  const [chEmail, setChEmail] = useState(true);
  const [chSlack, setChSlack] = useState(false);
  const toggle = (ri,pi)=>{
    const next = perm.map(r=>r.slice());
    next[ri][pi] = next[ri][pi]?0:1;
    setPerm(next);
    toast(ROLES[ri]+' · '+PERMS[pi]+' 권한을 갱신했습니다');
  };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <div className="tile" style={{padding:22}}>
        <div style={{fontSize:14.5,fontWeight:700,marginBottom:16}}>역할별 기능 접근 권한</div>
        <table className="tbl">
          <thead><tr><th>권한</th>{ROLES.map(r=><th key={r} style={{textAlign:'center'}}>{r}</th>)}</tr></thead>
          <tbody>
            {PERMS.map((p,pi)=>(
              <tr key={p}>
                <td style={{fontWeight:600}}>{p}</td>
                {ROLES.map((r,ri)=>(
                  <td key={r} style={{textAlign:'center'}}>
                    <button className={'toggle'+(perm[ri][pi]?' on':'')} onClick={()=>toggle(ri,pi)}><span className="toggle-knob"></span></button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="tile" style={{padding:22}}>
        <div style={{fontSize:14.5,fontWeight:700,marginBottom:16}}>알림 채널</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--tint)'}}>
          <span style={{fontSize:13}}>이메일 알림 (임계치 초과 · 반복 장애)</span>
          <button className={'toggle'+(chEmail?' on':'')} onClick={()=>setChEmail(v=>!v)}><span className="toggle-knob"></span></button>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0'}}>
          <span style={{fontSize:13}}>Slack 웹훅 알림</span>
          <button className={'toggle'+(chSlack?' on':'')} onClick={()=>setChSlack(v=>!v)}><span className="toggle-knob"></span></button>
        </div>
        <button className="pill-btn pill-primary" style={{marginTop:16}} onClick={()=>toast('알림 설정을 저장했습니다')}><Icon name="floppy-disk" size={14}/> 저장</button>
      </div>
    </div>
  );
}

    'manual-entry':{e:'수동 처리', t:'파싱 실패 수동 입력 및 재전송 워크플로우', s:'자동 파싱에 실패한 접수 메일을 검토하고 콜 등록과 재전송을 이어서 처리합니다.'},
    'call-history':{e:'이력 검색', t:'시리얼 넘버 기반 콜 이력 검색', s:'장비 시리얼로 전체 콜 이력을 조회하고 반복 장애 패턴을 파악합니다.'},
    'error-log':{e:'모니터링', t:'연동 에러 및 시스템 로그 모니터링', s:'파싱 · 연동 · 시스템 3개 소스의 오류를 통합 로그로 확인합니다.'},
    'settings':{e:'설정', t:'권한 및 알림 설정', s:'역할별 기능 접근 범위를 제어하고 알림 채널을 관리합니다.'},
  }[view];

  return (
    <div className="shell" data-archetype="bento-grid">
      <Header view={view} setView={setView} onSettings={{notify:()=>toast('발송 대기 알림 2건이 있습니다')}}/>
      <div style={{maxWidth:1240,margin:'0 auto',padding:'26px 24px 60px'}}>
        {view==='main' ? (
          <AuroraHero toast={toast}/>
        ) : (
          <div style={{marginBottom:20}}>
            <div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:11,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--iris)',marginBottom:8}}>
              <Icon name="circle" weight="fill" size={7}/>{head.e}
            </div>
            <h1 style={{fontSize:32,letterSpacing:'-1.2px',fontWeight:700,margin:0}}>{head.t}</h1>
            <p style={{fontSize:14,color:'var(--ash)',marginTop:8,maxWidth:640}}>{head.s}</p>
          </div>
        )}
        {view==='main' && <MainView setView={setView} toast={toast}/>}
        {view==='manual-entry' && <ManualEntryView toast={toast}/>}
        {view==='call-history' && <CallHistoryView/>}
        {view==='error-log' && <ErrorLogView/>}
        {view==='settings' && <SettingsView toast={toast}/>}
      </div>
      <Toast message={toastMsg} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
