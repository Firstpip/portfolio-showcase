<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잉크서클 — 캐릭터·일러스트 작가와 팬을 잇는 커뮤니티</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --eggshell:#fdfcfc;
    --taupe:#f5f3f1;
    --stone:#ebe8e4;
    --ink:#000000;
    --graphite:#44403b;
    --smoke:#777169;
    --ash:#a59f97;
    --violet:#0447ff;
    --ember:#ff4704;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--eggshell);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app-root{width:100%;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--stone);border-radius:8px;}

  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes pulseLike{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    60%{transform:scale(0.92);}
    100%{transform:scale(1);}
  }
  @keyframes barGrow{
    from{width:0%;}
  }
  @keyframes toastSlide{
    from{opacity:0;transform:translate(-50%,16px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  @keyframes sphereDrift{
    0%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(8deg) scale(1.04);}
    100%{transform:rotate(0deg) scale(1);}
  }
  @keyframes modalIn{
    from{opacity:0;transform:scale(0.96);}
    to{opacity:1;transform:scale(1);}
  }

  .pill-btn{
    border-radius:9999px;
    font-size:14px;
    font-weight:500;
    padding:10px 20px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .pill-btn:active{transform:scale(0.97);}
  .pill-btn-filled{background:var(--ink);color:#fff;}
  .pill-btn-filled:hover{box-shadow:0 4px 14px rgba(0,0,0,0.18);}
  .pill-btn-outline{background:var(--eggshell);color:var(--ink);border:1px solid var(--stone) !important;}
  .pill-btn-outline:hover{background:var(--taupe);}
  .pill-btn-ghost{background:transparent;color:var(--ink);border:1px solid transparent;}
  .pill-btn-ghost:hover{border:1px solid var(--stone);}

  .whisper-shadow{
    box-shadow: rgba(0,0,0,0.4) 0px 0px 1px 0px, rgba(0,0,0,0.04) 0px 1px 1px 0px, rgba(0,0,0,0.04) 0px 2px 4px 0px;
  }

  .card-lift{transition:transform .2s ease, box-shadow .2s ease;}
  .card-lift:hover{transform:translateY(-3px);box-shadow:rgba(0,0,0,0.4) 0px 0px 1px 0px, rgba(0,0,0,0.08) 0px 8px 20px 0px;}

  .icon{width:18px;height:18px;stroke-width:1.6;}

  .composer-sticky{position:sticky;top:80px;z-index:40;}
  .post{display:block;}
  .author{font-weight:600;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/plain" id="src-jsx">

/* ---------- small components ---------- */

function Icon({name, className, style}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[]);
  return <i data-lucide={name} className={className||'icon'} style={style} ref={ref}></i>;
}

function Toast({message, onClose}){
  useEffect(()=>{
    const t = setTimeout(onClose, 2200);
    return ()=>clearTimeout(t);
  },[message]);
  if(!message) return null;
  return (
    <div style={{
      position:'fixed', left:'50%', bottom:28, transform:'translateX(-50%)',
      background:'var(--ink)', color:'#fff', padding:'12px 22px', borderRadius:9999,
      fontSize:14, fontWeight:500, zIndex:200, animation:'toastSlide .25s ease',
      display:'flex', alignItems:'center', gap:8, boxShadow:'0 10px 30px rgba(0,0,0,0.25)'
    }}>
      <Icon name="check-circle" style={{width:16,height:16}}/>
      {message}
    </div>
  );
}

function Modal({title, onClose, children, width}){
  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(20,18,16,0.45)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:150, padding:20
    }}>
      <div onClick={e=>e.stopPropagation()} className="whisper-shadow" style={{
        background:'var(--eggshell)', borderRadius:24, padding:28, width: width||440,
        maxWidth:'92vw', maxHeight:'86vh', overflowY:'auto', animation:'modalIn .18s ease'
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
          <h3 style={{fontSize:20, fontWeight:300, letterSpacing:'-0.3px', margin:0}}>{title}</h3>
          <button onClick={onClose} style={{padding:6, borderRadius:9999}}>
            <Icon name="x" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Avatar({seed, size}){
  const s = size||40;
  return <img src={`https://source.boringavatars.com/beam/${s*2}/${seed}?colors=0447ff,ff4704,f5f3f1,ebe8e4,000000`}
    style={{width:s, height:s, borderRadius:'50%', flexShrink:0, background:'var(--stone)'}} alt={seed}/>;
}

function CharacterVisual({seed, size, tone}){
  const s = size || 220;
  const grad = tone==='ember'
    ? 'radial-gradient(circle at 32% 30%, #ff4704 0%, #0447ff 45%, #f5f3f1 78%)'
    : 'radial-gradient(circle at 65% 35%, #0447ff 0%, #ff4704 42%, #fdfcfc 80%)';
  return (
    <div style={{
      width:s, height:s, borderRadius:'50%', background:grad,
      animation:'sphereDrift 9s ease-in-out infinite', boxShadow:'0 0 0 1px rgba(0,0,0,0.04)',
      position:'relative'
    }}>
      <div style={{
        position:'absolute', inset:'30%', borderRadius:'50%',
        background:'rgba(253,252,252,0.82)', display:'flex', alignItems:'center', justifyContent:'center'
      }}>
        <Icon name="sparkles" style={{width: s*0.16, height: s*0.16, color:'var(--ink)'}}/>
      </div>
    </div>
  );
}

/* ---------- screens ---------- */

function TopNav({view, setView, onStart}){
  const items = [
    {key:'feed', label:'홈 피드'},
    {key:'author', label:'작가 프로필'},
    {key:'ranking', label:'인기 랭킹'},
    {key:'vote', label:'굿즈화 투표'},
  ];
  return (
    <header style={{
      position:'sticky', top:0, zIndex:100, background:'rgba(253,252,252,0.92)',
      backdropFilter:'blur(8px)', borderBottom:'1px solid var(--stone)'
    }}>
      <div style={{
        maxWidth:1280, margin:'0 auto', height:64, display:'flex', alignItems:'center',
        justifyContent:'space-between', padding:'0 32px'
      }}>
        <div style={{display:'flex', alignItems:'center', gap:36}}>
          <div style={{fontSize:20, fontWeight:700, letterSpacing:'-0.5px'}}>잉크서클</div>
          <nav style={{display:'flex', gap:6}}>
            {items.map(it=>(
              <button key={it.key} onClick={()=>setView(it.key)} className="pill-btn"
                style={{
                  padding:'8px 16px', fontSize:14,
                  background: view===it.key ? 'var(--taupe)' : 'transparent',
                  color: view===it.key ? 'var(--ink)' : 'var(--smoke)',
                  borderBottom: view===it.key ? '2px solid var(--violet)' : '2px solid transparent',
                  borderRadius:9999
                }}>{it.label}</button>
            ))}
          </nav>
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="pill-btn pill-btn-outline" style={{border:'1px solid var(--stone)'}} onClick={()=>onStart('fan')}>로그인</button>
          <button className="pill-btn pill-btn-filled" onClick={()=>onStart('author')}>작가로 시작하기</button>
        </div>
      </div>
    </header>
  );
}

function FeedScreen({posts, setPosts, authors, setToast, goAuthor, goRanking}){
  const [filter, setFilter] = useState('new');
  const [composerText, setComposerText] = useState('');
  const [commentPost, setCommentPost] = useState(null);
  const [commentDraft, setCommentDraft] = useState('');

  const sorted = useMemo(()=>{
    const arr = [...posts];
    if(filter==='popular') arr.sort((a,b)=>b.likes-a.likes);
    return arr;
  },[posts, filter]);

  function toggleLike(id){
    setPosts(prev=>prev.map(p=> p.id===id ? {...p, liked:!p.liked, likes: p.liked? p.likes-1 : p.likes+1} : p));
  }
  function toggleVote(id){
    setPosts(prev=>prev.map(p=> p.id===id ? {...p, voted:!p.voted, votes: p.voted? p.votes-1 : p.votes+1} : p));
    setToast('굿즈화 투표 랭킹에 반영되었습니다');
  }
  function submitPost(){
    if(!composerText.trim()) return;
    setPosts(prev=>[{id:'p'+Date.now(), authorId:'a2', time:'방금', img:'brushtale-card-new', caption:composerText, likes:0, liked:false, votes:0, voted:false, comments:[]}, ...prev]);
    setComposerText('');
    setToast('새 게시물이 등록되었습니다');
  }
  function addComment(){
    if(!commentDraft.trim() || !commentPost) return;
    setPosts(prev=>prev.map(p=> p.id===commentPost.id ? {...p, comments:[...p.comments, {author:'나', text:commentDraft}]} : p));
    setCommentPost(prev=> prev ? {...prev, comments:[...prev.comments, {author:'나', text:commentDraft}]} : prev);
    setCommentDraft('');
  }
  function share(){
    setToast('링크가 복사되었습니다');
  }

  return (
    <div style={{display:'flex', justifyContent:'center', gap:28, maxWidth:1280, margin:'0 auto', padding:'32px 24px 80px'}}>
      <main style={{maxWidth:600, width:'100%'}}>
        <div className="whisper-shadow composer-sticky" style={{
          background:'var(--eggshell)',
          borderRadius:20, padding:16, marginBottom:20, border:'1px solid var(--stone)'
        }}>
          <div style={{display:'flex', gap:12, marginBottom:12}}>
            <Avatar seed="me-author" size={40}/>
            <textarea value={composerText} onChange={e=>setComposerText(e.target.value)}
              placeholder="오늘의 신작을 팬들에게 공유해보세요"
              style={{
                flex:1, resize:'none', border:'none', outline:'none', fontFamily:'inherit',
                fontSize:15, minHeight:44, background:'transparent'
              }}/>
          </div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style={{display:'flex', gap:6}}>
              <button onClick={()=>setFilter('new')} className="pill-btn"
                style={{
                  fontSize:13, padding:'6px 14px', border:'1px solid var(--stone)',
                  background: filter==='new' ? 'var(--ink)' : 'transparent',
                  color: filter==='new' ? '#fff' : 'var(--smoke)'
                }}>신규순</button>
              <button onClick={()=>setFilter('popular')} className="pill-btn"
                style={{
                  fontSize:13, padding:'6px 14px', border:'1px solid var(--stone)',
                  background: filter==='popular' ? 'var(--ink)' : 'transparent',
                  color: filter==='popular' ? '#fff' : 'var(--smoke)'
                }}>인기순</button>
            </div>
            <button onClick={submitPost} className="pill-btn pill-btn-filled" style={{fontSize:13, padding:'8px 18px'}}>게시</button>
          </div>
        </div>

        {sorted.map((post, idx)=>{
          const author = authors.find(a=>a.id===post.authorId);
          return (
            <article key={post.id} className="post whisper-shadow card-lift" style={{
              background:'#fff', border:'1px solid var(--stone)', borderRadius:20,
              padding:20, marginBottom:16, animation:`fadeInUp .4s ease ${idx*0.04}s both`
            }}>
              <header style={{display:'flex', alignItems:'center', gap:10, marginBottom:14, cursor:'pointer'}} onClick={()=>goAuthor(author.id)}>
                <Avatar seed={author.id} size={40}/>
                <div style={{flex:1}}>
                  <div className="author" style={{fontSize:14}}>{author.name}</div>
                  <div className="handle" style={{fontSize:12, color:'var(--ash)'}}>{author.handle}</div>
                </div>
                <time style={{fontSize:12, color:'var(--ash)'}}>{post.time}</time>
              </header>
              <div style={{
                borderRadius:16, overflow:'hidden', marginBottom:14, background:'var(--taupe)',
                display:'flex', alignItems:'center', justifyContent:'center'
              }}>
                <img src={`https://picsum.photos/seed/${post.img}/640/420`} style={{width:'100%', display:'block'}} alt="작품 이미지"/>
              </div>
              <p style={{fontSize:15, lineHeight:1.6, color:'var(--graphite)', margin:'0 0 14px'}}>{post.caption}</p>
              <footer style={{display:'flex', alignItems:'center', gap:18, borderTop:'1px solid var(--stone)', paddingTop:12}}>
                <button onClick={()=>toggleLike(post.id)} style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color: post.liked ? 'var(--ember)' : 'var(--smoke)'}}>
                  <Icon name="heart" className="icon" style={post.liked ? {animation:'pulseLike .4s ease', fill:'var(--ember)', color:'var(--ember)'} : {}}/>
                  좋아요 {post.likes}
                </button>
                <button onClick={()=>{setCommentPost(post);}} style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--smoke)'}}>
                  <Icon name="message-circle" className="icon"/>
                  댓글 {post.comments.length}
                </button>
                <button onClick={share} style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--smoke)'}}>
                  <Icon name="share-2" className="icon"/>
                  공유
                </button>
                <button onClick={()=>toggleVote(post.id)} style={{
                  marginLeft:'auto', display:'flex', alignItems:'center', gap:6, fontSize:13,
                  padding:'6px 14px', borderRadius:9999, border:'1px solid var(--violet)',
                  color: post.voted ? '#fff' : 'var(--violet)',
                  background: post.voted ? 'var(--violet)' : 'transparent'
                }}>
                  <Icon name="gift" className="icon" style={{width:14,height:14}}/>
                  {post.voted ? '투표완료' : '굿즈화 투표'} {post.votes}
                </button>
              </footer>
            </article>
          );
        })}
      </main>

      <aside style={{width:300, flexShrink:0}}>
        <div className="whisper-shadow" style={{background:'var(--taupe)', borderRadius:20, padding:24, marginBottom:20}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16}}>
            <h4 style={{fontSize:16, fontWeight:600, margin:0}}>이번 주 인기 랭킹</h4>
          </div>
          {rankingWeekly.slice(0,3).map(r=>(
            <div key={r.rank} style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              <span style={{
                width:22, height:22, borderRadius:'50%', background:'var(--ink)', color:'#fff',
                fontSize:11, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center'
              }}>{r.rank}</span>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{r.name}</div>
                <div style={{fontSize:11, color:'var(--ash)'}}>{r.author}</div>
              </div>
              <span style={{fontSize:11, color:'var(--smoke)'}}>♥{r.likes}</span>
            </div>
          ))}
          <button className="pill-btn pill-btn-outline" style={{width:'100%', fontSize:13, marginTop:6, border:'1px solid var(--stone)'}} onClick={goRanking}>전체 랭킹 보기</button>
        </div>

        <div className="whisper-shadow" style={{background:'#fff', border:'1px solid var(--stone)', borderRadius:20, padding:24}}>
          <h4 style={{fontSize:16, fontWeight:600, margin:'0 0 16px'}}>추천 작가</h4>
          {authors.slice(0,3).map(a=>(
            <div key={a.id} style={{display:'flex', alignItems:'center', gap:10, marginBottom:14}}>
              <Avatar seed={a.id} size={34}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:600}}>{a.name}</div>
                <div style={{fontSize:11, color:'var(--ash)'}}>팔로워 {a.followers.toLocaleString()}</div>
              </div>
              <FollowBtn author={a}/>
            </div>
          ))}
        </div>
      </aside>

      {commentPost && (
        <Modal title="댓글" onClose={()=>setCommentPost(null)}>
          <div style={{display:'flex', flexDirection:'column', gap:12, marginBottom:16, maxHeight:220, overflowY:'auto'}}>
            {commentPost.comments.length===0 && <div style={{fontSize:13, color:'var(--ash)'}}>아직 댓글이 없습니다. 첫 댓글을 남겨보세요.</div>}
            {commentPost.comments.map((c,i)=>(
              <div key={i} style={{display:'flex', gap:10}}>
                <Avatar seed={c.author} size={28}/>
                <div>
                  <div style={{fontSize:12, fontWeight:600}}>{c.author}</div>
                  <div style={{fontSize:13, color:'var(--graphite)'}}>{c.text}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:'flex', gap:8}}>
            <input value={commentDraft} onChange={e=>setCommentDraft(e.target.value)} placeholder="댓글을 입력하세요"
              style={{flex:1, border:'1px solid var(--stone)', borderRadius:9999, padding:'10px 16px', fontSize:13, outline:'none', fontFamily:'inherit'}}/>
            <button onClick={addComment} className="pill-btn pill-btn-filled" style={{fontSize:13}}>등록</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function FollowBtn({author}){
  const [following, setFollowing] = useState(author.following);
  return (
    <button onClick={()=>setFollowing(f=>!f)} className="pill-btn" style={{
      fontSize:12, padding:'6px 12px',
      background: following ? 'var(--taupe)' : 'var(--ink)',
      color: following ? 'var(--smoke)' : '#fff',
      border: following ? '1px solid var(--stone)' : 'none'
    }}>{following ? '팔로잉' : '팔로우'}</button>
  );
}

function AuthorScreen({authors, posts, setToast, focusAuthor}){
  const [current, setCurrent] = useState(focusAuthor || authors[0].id);
  const [editing, setEditing] = useState(false);
  const [worldText, setWorldText] = useState(authors[0].world);
  const [detail, setDetail] = useState(null);
  const author = authors.find(a=>a.id===current);
  const gallery = posts.filter(p=>p.authorId===current);

  useEffect(()=>{ setWorldText(author.world); },[current]);
  useEffect(()=>{ if(focusAuthor) setCurrent(focusAuthor); },[focusAuthor]);

  return (
    <div style={{maxWidth:1000, margin:'0 auto', padding:'32px 24px 80px'}}>
      <div style={{display:'flex', gap:8, marginBottom:24, flexWrap:'wrap'}}>
        {authors.map(a=>(
          <button key={a.id} onClick={()=>setCurrent(a.id)} className="pill-btn" style={{
            fontSize:13, padding:'8px 16px', border:'1px solid var(--stone)',
            background: current===a.id ? 'var(--ink)' : 'transparent',
            color: current===a.id ? '#fff' : 'var(--smoke)'
          }}>{a.name}</button>
        ))}
      </div>

      <div className="whisper-shadow" style={{
        borderRadius:24, overflow:'hidden', border:'1px solid var(--stone)', background:'#fff', marginBottom:28
      }}>
        <div style={{height:180, background:`url(https://picsum.photos/seed/${current}-cover/1200/300) center/cover`}}></div>
        <div style={{padding:'0 32px 32px', marginTop:-48}}>
          <div style={{display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:16}}>
            <div style={{display:'flex', alignItems:'flex-end', gap:16}}>
              <div style={{border:'4px solid #fff', borderRadius:'50%'}}>
                <Avatar seed={current} size={88}/>
              </div>
              <div style={{paddingBottom:6}}>
                <div style={{fontSize:22, fontWeight:300, letterSpacing:'-0.3px'}}>{author.name}</div>
                <div style={{fontSize:13, color:'var(--ash)'}}>{author.handle} · 팔로워 {author.followers.toLocaleString()}명</div>
              </div>
            </div>
            <div style={{display:'flex', gap:8, paddingBottom:6}}>
              <FollowBtn author={author}/>
              <button onClick={()=>setEditing(true)} className="pill-btn pill-btn-outline" style={{border:'1px solid var(--stone)', fontSize:13}}>프로필 편집</button>
            </div>
          </div>
          <div style={{background:'var(--taupe)', borderRadius:20, padding:'24px 32px'}}>
            <div style={{fontSize:12, color:'var(--ash)', marginBottom:6, letterSpacing:'0.04em', textTransform:'uppercase'}}>세계관 소개</div>
            <p style={{fontSize:16, lineHeight:1.6, color:'var(--graphite)', margin:0}}>{worldText}</p>
          </div>
        </div>
      </div>

      <h3 style={{fontSize:20, fontWeight:300, marginBottom:16}}>대표 캐릭터 갤러리</h3>
      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:16}}>
        {gallery.map(p=>(
          <div key={p.id} onClick={()=>setDetail(p)} className="card-lift" style={{
            borderRadius:16, overflow:'hidden', cursor:'pointer', background:'var(--taupe)', border:'1px solid var(--stone)'
          }}>
            <img src={`https://picsum.photos/seed/${p.img}/400/320`} style={{width:'100%', display:'block'}} alt="캐릭터"/>
            <div style={{padding:12}}>
              <div style={{fontSize:13, color:'var(--graphite)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{p.caption}</div>
              <div style={{fontSize:12, color:'var(--ash)', marginTop:4}}>♥ {p.likes}</div>
            </div>
          </div>
        ))}
        {gallery.length===0 && <div style={{fontSize:13, color:'var(--ash)'}}>아직 등록된 작품이 없습니다.</div>}
      </div>

      {editing && (
        <Modal title="프로필 편집" onClose={()=>setEditing(false)}>
          <label style={{fontSize:12, color:'var(--ash)', display:'block', marginBottom:6}}>세계관 소개</label>
          <textarea value={worldText} onChange={e=>setWorldText(e.target.value)} style={{
            width:'100%', minHeight:100, border:'1px solid var(--stone)', borderRadius:12, padding:14,
            fontSize:14, fontFamily:'inherit', outline:'none', resize:'vertical'
          }}/>
          <button onClick={()=>{setEditing(false); setToast('프로필이 저장되었습니다');}} className="pill-btn pill-btn-filled" style={{marginTop:16, width:'100%'}}>저장</button>
        </Modal>
      )}

      {detail && (
        <Modal title={detail.caption.slice(0,16)+'…'} onClose={()=>setDetail(null)} width={520}>
          <img src={`https://picsum.photos/seed/${detail.img}/520/360`} style={{width:'100%', borderRadius:16, marginBottom:14}} alt="상세"/>
          <p style={{fontSize:14, color:'var(--graphite)', lineHeight:1.6}}>{detail.caption}</p>
          <div style={{display:'flex', gap:16, fontSize:13, color:'var(--smoke)'}}>
            <span>♥ 좋아요 {detail.likes}</span>
            <span>굿즈화 투표 {detail.votes}</span>
          </div>
        </Modal>
      )}
    </div>
  );
}

function RankingScreen(){
  const [tab, setTab] = useState('weekly');
  const data = tab==='weekly' ? rankingWeekly : rankingMonthly;
  const max = Math.max(...data.map(d=>d.likes));

  return (
    <div style={{maxWidth:760, margin:'0 auto', padding:'32px 24px 80px'}}>
      <div style={{textAlign:'center', marginBottom:8}}>
        <div style={{fontSize:12, color:'var(--ash)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8}}>Weekly / Monthly</div>
        <h2 style={{fontSize:36, fontWeight:300, letterSpacing:'-0.72px', margin:'0 0 24px'}}>인기 캐릭터·일러스트 랭킹</h2>
      </div>
      <div style={{display:'flex', justifyContent:'center', gap:8, marginBottom:32}}>
        <button onClick={()=>setTab('weekly')} className="pill-btn" style={{
          fontSize:14, padding:'8px 20px', border:'1px solid var(--stone)',
          background: tab==='weekly' ? 'var(--ink)' : 'transparent', color: tab==='weekly' ? '#fff' : 'var(--smoke)'
        }}>주간 랭킹</button>
        <button onClick={()=>setTab('monthly')} className="pill-btn" style={{
          fontSize:14, padding:'8px 20px', border:'1px solid var(--stone)',
          background: tab==='monthly' ? 'var(--ink)' : 'transparent', color: tab==='monthly' ? '#fff' : 'var(--smoke)'
        }}>월간 랭킹</button>
      </div>

      <div className="whisper-shadow" style={{background:'#fff', border:'1px solid var(--stone)', borderRadius:20, padding:'8px 24px'}}>
        {data.map((r,i)=>(
          <div key={tab+r.rank} style={{
            display:'flex', alignItems:'center', gap:16, padding:'18px 0',
            borderBottom: i<data.length-1 ? '1px solid var(--stone)' : 'none'
          }}>
            <span style={{
              width:32, textAlign:'center', fontSize: r.rank<=3 ? 22 : 16, fontWeight: r.rank<=3 ? 700 : 500,
              color: r.rank===1 ? 'var(--violet)' : 'var(--ink)'
            }}>{r.rank}</span>
            <Avatar seed={r.author} size={40}/>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:14, fontWeight:600}}>{r.name}</div>
              <div style={{fontSize:12, color:'var(--ash)'}}>{r.author}</div>
              <div style={{height:6, background:'var(--stone)', borderRadius:9999, marginTop:8, overflow:'hidden'}}>
                <div style={{
                  height:'100%', borderRadius:9999, background:'var(--violet)',
                  width:`${(r.likes/max*100).toFixed(0)}%`, animation:'barGrow 1s ease'
                }}></div>
              </div>
            </div>
            <div style={{textAlign:'right', minWidth:70}}>
              <div style={{fontSize:14, fontWeight:600}}>♥ {r.likes}</div>
              <div style={{
                fontSize:11, display:'flex', alignItems:'center', justifyContent:'flex-end', gap:2,
                color: r.trend==='up' ? '#1a9e5c' : r.trend==='down' ? 'var(--ember)' : 'var(--ash)'
              }}>
                <Icon name={r.trend==='up' ? 'arrow-up' : r.trend==='down' ? 'arrow-down' : 'minus'} style={{width:11, height:11}}/>
                {r.trend==='same' ? '유지' : Math.abs(r.prev-r.rank)}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function VoteScreen({setToast}){
  const [items, setItems] = useState(voteItems);
  const [category, setCategory] = useState('전체');
  const cats = ['전체', ...Array.from(new Set(voteItems.map(v=>v.category)))];
  const filtered = category==='전체' ? items : items.filter(v=>v.category===category);
  const sorted = [...filtered].sort((a,b)=>b.votes-a.votes);

  function toggle(id){
    setItems(prev=>prev.map(v=> v.id===id ? {...v, voted:!v.voted, votes: v.voted? v.votes-1 : v.votes+1} : v));
    setToast('굿즈화 희망 투표가 반영되었습니다');
  }

  const top = sorted[0];

  return (
    <div style={{maxWidth:900, margin:'0 auto', padding:'32px 24px 80px'}}>
      <div style={{textAlign:'center', marginBottom:32}}>
        <div style={{fontSize:12, color:'var(--ash)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8}}>Goods Vote</div>
        <h2 style={{fontSize:36, fontWeight:300, letterSpacing:'-0.72px', margin:0}}>굿즈화 희망 투표</h2>
        <p style={{fontSize:14, color:'var(--smoke)', marginTop:10}}>가장 굿즈로 만나고 싶은 캐릭터·일러스트에 투표해보세요</p>
      </div>

      {top && (
        <div className="whisper-shadow" style={{
          display:'flex', alignItems:'center', gap:28, background:'var(--taupe)', borderRadius:24, padding:28, marginBottom:28
        }}>
          <CharacterVisual seed={top.id} size={120}/>
          <div style={{flex:1}}>
            <div style={{fontSize:12, color:'var(--violet)', fontWeight:600, marginBottom:6}}>현재 1위 · {top.category}</div>
            <div style={{fontSize:24, fontWeight:300}}>{top.name}</div>
            <div style={{fontSize:13, color:'var(--ash)', marginBottom:14}}>{top.author}</div>
            <button onClick={()=>toggle(top.id)} className="pill-btn" style={{
              fontSize:13, padding:'10px 20px',
              background: top.voted ? 'var(--stone)' : 'var(--ink)', color: top.voted ? 'var(--smoke)' : '#fff'
            }}>{top.voted ? '투표완료 · 취소하기' : `투표하기 · ${top.votes}표`}</button>
          </div>
        </div>
      )}

      <div style={{display:'flex', gap:8, marginBottom:20, flexWrap:'wrap'}}>
        {cats.map(c=>(
          <button key={c} onClick={()=>setCategory(c)} className="pill-btn" style={{
            fontSize:13, padding:'7px 16px', border:'1px solid var(--stone)',
            background: category===c ? 'var(--ink)' : 'transparent', color: category===c ? '#fff' : 'var(--smoke)'
          }}>{c}</button>
        ))}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:16}}>
        {sorted.map((v, i)=>(
          <div key={v.id} className="whisper-shadow card-lift" style={{
            display:'flex', gap:14, background:'#fff', border:'1px solid var(--stone)',
            borderRadius:18, padding:16, animation:`fadeInUp .4s ease ${i*0.05}s both`
          }}>
            <img src={`https://picsum.photos/seed/${v.img}/140/140`} style={{width:88, height:88, borderRadius:14, objectFit:'cover', flexShrink:0}} alt={v.name}/>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:11, color:'var(--ash)', marginBottom:2}}>{v.category}</div>
              <div style={{fontSize:14, fontWeight:600, marginBottom:2}}>{v.name}</div>
              <div style={{fontSize:12, color:'var(--ash)', marginBottom:10}}>{v.author}</div>
              <button onClick={()=>toggle(v.id)} className="pill-btn" style={{
                fontSize:12, padding:'6px 14px',
                background: v.voted ? 'var(--taupe)' : 'var(--ink)', color: v.voted ? 'var(--smoke)' : '#fff',
                border: v.voted ? '1px solid var(--stone)' : 'none'
              }}>{v.voted ? '투표완료' : `투표 ${v.votes}`}</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OnboardModal({role, onClose, setToast}){
  const [step, setStep] = useState('form');
  const [selRole, setSelRole] = useState(role||'fan');
  const [email, setEmail] = useState('');
  return (
    <Modal title={step==='form' ? '잉크서클 시작하기' : '가입 완료'} onClose={onClose}>
      {step==='form' ? (
        <div>
          <div style={{display:'flex', gap:8, marginBottom:18}}>
            <button onClick={()=>setSelRole('fan')} className="pill-btn" style={{
              flex:1, fontSize:13, padding:'10px 0', border:'1px solid var(--stone)',
              background: selRole==='fan' ? 'var(--ink)' : 'transparent', color: selRole==='fan' ? '#fff' : 'var(--smoke)'
            }}>팬으로 가입</button>
            <button onClick={()=>setSelRole('author')} className="pill-btn" style={{
              flex:1, fontSize:13, padding:'10px 0', border:'1px solid var(--stone)',
              background: selRole==='author' ? 'var(--ink)' : 'transparent', color: selRole==='author' ? '#fff' : 'var(--smoke)'
            }}>작가로 가입</button>
          </div>
          <label style={{fontSize:12, color:'var(--ash)', display:'block', marginBottom:6}}>이메일</label>
          <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com" style={{
            width:'100%', border:'1px solid var(--stone)', borderRadius:12, padding:'12px 14px',
            fontSize:14, outline:'none', marginBottom:18, fontFamily:'inherit'
          }}/>
          <button onClick={()=>setStep('done')} className="pill-btn pill-btn-filled" style={{width:'100%'}}>
            {selRole==='fan' ? '팬으로 가입하기' : '작가로 가입하기'}
          </button>
        </div>
      ) : (
        <div style={{textAlign:'center', padding:'12px 0'}}>
          <Icon name="party-popper" style={{width:36, height:36, color:'var(--violet)', margin:'0 auto 14px'}}/>
          <p style={{fontSize:14, color:'var(--graphite)', marginBottom:20}}>
            {selRole==='fan' ? '팬 계정으로' : '작가 계정으로'} 가입이 완료되었습니다.
          </p>
          <button onClick={()=>{onClose(); setToast('잉크서클에 오신 것을 환영합니다');}} className="pill-btn pill-btn-filled" style={{width:'100%'}}>홈 피드로 이동</button>
        </div>
      )}
    </Modal>
  );
}

function App(){
  const [view, setView] = useState('feed');
  const [posts, setPosts] = useState(initialPosts);
  const [authors] = useState(AUTHORS);
  const [toast, setToastMsg] = useState('');
  const [onboard, setOnboard] = useState(null);
  const [focusAuthor, setFocusAuthor] = useState(null);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[view, posts, onboard, toast]);

  function setToast(msg){ setToastMsg(msg); }
  function goAuthor(id){ setFocusAuthor(id); setView('author'); }
  function goRanking(){ setView('ranking'); }

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}} data-archetype="feed-timeline">
      <TopNav view={view} setView={setView} onStart={(r)=>setOnboard(r)}/>
      <div style={{flex:1, width:'100%'}}>
        {view==='feed' && <FeedScreen posts={posts} setPosts={setPosts} authors={authors} setToast={setToast} goAuthor={goAuthor} goRanking={goRanking}/>}
        {view==='author' && <AuthorScreen authors={authors} posts={posts} setToast={setToast} focusAuthor={focusAuthor}/>}
        {view==='ranking' && <RankingScreen/>}
        {view==='vote' && <VoteScreen setToast={setToast}/>}
      </div>
      <footer style={{borderTop:'1px solid var(--stone)', padding:'32px 24px', textAlign:'center'}}>
        <div style={{fontSize:13, color:'var(--ash)'}}>© 2025 잉크서클 — 자체 개발 프로젝트</div>
      </footer>
      {onboard && <OnboardModal role={onboard} onClose={()=>setOnboard(null)} setToast={setToast}/>}
      <Toast message={toast} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App/>);
</script>
