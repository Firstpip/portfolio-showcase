<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잉크서클 Ops — 캐릭터 팬 커뮤니티 운영 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --abyss:#012624;
    --deep:#011d1c;
    --kelp:#003734;
    --mist:#edfffe;
    --platinum:#ffffff;
    --silver:#bbc7c6;
    --slate:#707777;
    --lavender:#fde9ff;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--abyss);
    color:var(--platinum);
    -webkit-font-smoothing:antialiased;
  }
  #ops-root{width:100%;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--kelp);border-radius:8px;}

  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes countUp{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes orbPulse{
    0%,100%{opacity:0.55;transform:scale(1);}
    50%{opacity:0.9;transform:scale(1.06);}
  }
  @keyframes toastSlide{
    from{opacity:0;transform:translate(-50%,16px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  @keyframes modalIn{
    from{opacity:0;transform:scale(0.96);}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes drawIn{
    from{stroke-dashoffset:400;}
    to{stroke-dashoffset:0;}
  }

  .glow-btn{
    background:linear-gradient(90deg, rgb(203,255,252) 0%, rgb(237,255,254) 26.25%, rgb(255,253,250) 47.57%, rgb(250,209,255) 88.96%);
    color:#1a2523;
    border-radius:6px;
    padding:10px 20px;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.02em;
    transition:box-shadow .2s ease, transform .15s ease;
  }
  .glow-btn:hover{box-shadow:0 0 0 1px rgba(203,255,252,0.5), 0 8px 24px rgba(0,130,124,0.35);}
  .glow-btn:active{transform:scale(0.97);}

  .ghost-nav{
    background:transparent;font-size:12px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;
    padding:8px 2px;color:var(--silver);border-bottom:2px solid transparent;
  }
  .ghost-nav.active{color:var(--platinum);border-bottom:2px solid var(--lavender);}

  .tile{
    background:var(--kelp);
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.06);
    padding:24px;
    transition:box-shadow .25s ease, transform .2s ease;
  }
  .tile:hover{box-shadow:0 0 0 1px rgba(203,255,252,0.25), 0 12px 32px rgba(0,130,124,0.35);transform:translateY(-2px);}

  .kicker{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);margin-bottom:8px;}

  .status-badge{font-size:11px;padding:4px 10px;border-radius:9999px;font-weight:500;display:inline-flex;align-items:center;gap:4px;}
  .status-wait{background:rgba(253,233,255,0.14);color:var(--lavender);}
  .status-review{background:rgba(237,255,254,0.14);color:var(--mist);}
  .status-done{background:rgba(187,199,198,0.14);color:var(--silver);}

  .icon{font-size:16px;}

  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .tile-feature{grid-column:span 2;grid-row:span 2;}
  .tile-wide{grid-column:span 2;}
  .brand-orb{animation:orbPulse 2.6s ease-in-out infinite;}
</style>
</head>
<body>
<div id="ops-root"></div>
<script type="text/plain" id="src-jsx">

/* ---------- small components ---------- */

function Toast({message, onClose}){
  useEffect(()=>{ if(!message) return; const t=setTimeout(onClose,2200); return ()=>clearTimeout(t); },[message]);
  if(!message) return null;
  return (
    <div style={{
      position:'fixed', left:'50%', bottom:28, transform:'translateX(-50%)',
      background:'var(--kelp)', border:'1px solid rgba(203,255,252,0.3)', color:'var(--platinum)',
      padding:'12px 22px', borderRadius:9999, fontSize:13, fontWeight:500, zIndex:200,
      animation:'toastSlide .25s ease', display:'flex', alignItems:'center', gap:8
    }}>
      <i className="ph-fill ph-check-circle icon" style={{color:'var(--lavender)'}}></i>
      {message}
    </div>
  );
}

function Modal({title, onClose, children, width}){
  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(1,10,9,0.6)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:150, padding:20
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'var(--kelp)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:16, padding:28,
        width: width||460, maxWidth:'92vw', maxHeight:'86vh', overflowY:'auto', animation:'modalIn .18s ease'
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
          <h3 style={{fontSize:18, fontWeight:500, margin:0}}>{title}</h3>
          <button onClick={onClose} style={{padding:6, borderRadius:6}}>
            <i className="ph ph-x icon"></i>
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Sparkline({data, dataKey, color}){
  const max = Math.max(...data.map(d=>d[dataKey]));
  const min = Math.min(...data.map(d=>d[dataKey]));
  const pts = data.map((d,i)=>{
    const x = (i/(data.length-1))*100;
    const y = 32 - ((d[dataKey]-min)/((max-min)||1))*30;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg viewBox="0 0 100 32" style={{width:'100%', height:40}} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2"
        style={{strokeDasharray:400, strokeDashoffset:0, animation:'drawIn 1.1s ease'}}/>
    </svg>
  );
}

/* ---------- moderation ---------- */

function ModerationScreen({queue, setQueue, setToast}){
  const [reasonFilter, setReasonFilter] = useState('전체');
  const [selected, setSelected] = useState([]);
  const [detail, setDetail] = useState(null);
  const reasons = ['전체', ...Array.from(new Set(queue.map(q=>q.reason)))];
  const filtered = reasonFilter==='전체' ? queue : queue.filter(q=>q.reason===reasonFilter);

  function toggleSelect(id){
    setSelected(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }
  function bulkAction(newStatus){
    if(selected.length===0){ setToast('선택된 항목이 없습니다'); return; }
    setQueue(prev=>prev.map(q=> selected.includes(q.id) ? {...q, status:newStatus} : q));
    setToast(`${selected.length}건을 ${newStatus} 처리했습니다`);
    setSelected([]);
  }
  function setStatus(id, status){
    setQueue(prev=>prev.map(q=> q.id===id ? {...q, status} : q));
    setDetail(prev=> prev && prev.id===id ? {...prev, status} : prev);
  }

  return (
    <div style={{maxWidth:1440, margin:'0 auto', padding:'32px 32px 80px'}}>
      <div className="kicker">Report Queue</div>
      <h2 style={{fontSize:28, fontWeight:500, margin:'0 0 24px'}}>콘텐츠 모더레이션</h2>

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:12}}>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          {reasons.map(r=>(
            <button key={r} onClick={()=>setReasonFilter(r)} style={{
              fontSize:12, padding:'7px 14px', borderRadius:6,
              background: reasonFilter===r ? 'var(--kelp)' : 'transparent',
              border:'1px solid rgba(255,255,255,0.12)', color: reasonFilter===r ? 'var(--platinum)' : 'var(--silver)'
            }}>{r}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:8}}>
          <button onClick={()=>bulkAction('처리완료')} className="glow-btn">일괄 승인</button>
          <button onClick={()=>bulkAction('처리완료')} style={{
            fontSize:13, padding:'10px 20px', borderRadius:6, border:'1px solid rgba(255,100,100,0.4)', color:'#ff9d9d'
          }}>일괄 삭제</button>
        </div>
      </div>

      <div className="tile" style={{padding:0, overflow:'hidden'}}>
        {filtered.map((q,i)=>(
          <div key={q.id} style={{
            display:'flex', alignItems:'center', gap:14, padding:'16px 22px',
            borderTop: i>0 ? '1px solid rgba(255,255,255,0.06)' : 'none', animation:`fadeInUp .35s ease ${i*0.04}s both`
          }}>
            <input type="checkbox" checked={selected.includes(q.id)} onChange={()=>toggleSelect(q.id)}
              style={{width:16, height:16, accentColor:'#cbfffc'}}/>
            <div style={{flex:1, minWidth:0, cursor:'pointer'}} onClick={()=>setDetail(q)}>
              <div style={{fontSize:14, fontWeight:500}}>{q.target}</div>
              <div style={{fontSize:12, color:'var(--silver)'}}>{q.author} · {q.reason} · {q.reported}</div>
            </div>
            <span className={`status-badge ${q.status==='대기'?'status-wait':q.status==='검토중'?'status-review':'status-done'}`}>{q.status}</span>
            <button onClick={()=>setDetail(q)} style={{fontSize:12, color:'var(--silver)', padding:'6px 10px'}}>
              <i className="ph ph-caret-right icon"></i>
            </button>
          </div>
        ))}
      </div>

      {detail && (
        <Modal title="신고 상세" onClose={()=>setDetail(null)}>
          <div style={{fontSize:15, fontWeight:500, marginBottom:6}}>{detail.target}</div>
          <div style={{fontSize:13, color:'var(--silver)', marginBottom:18}}>{detail.author} · 신고 사유: {detail.reason} · {detail.reported}</div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={()=>setStatus(detail.id,'검토중')} style={{
              flex:1, fontSize:13, padding:'10px 0', borderRadius:6, border:'1px solid rgba(255,255,255,0.14)', color:'var(--platinum)'
            }}>검토중으로 표시</button>
            <button onClick={()=>{setStatus(detail.id,'처리완료'); setToast('처리 완료로 변경되었습니다');}} className="glow-btn" style={{flex:1}}>처리완료</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- analytics ---------- */

function AnalyticsScreen(){
  const authors = Object.keys(authorStats);
  const [author, setAuthor] = useState(authors[0]);
  const [range, setRange] = useState('month');
  const data = authorStats[author];
  const latest = data[data.length-1];

  return (
    <div style={{maxWidth:1440, margin:'0 auto', padding:'32px 32px 80px'}}>
      <div className="kicker">Author Insights</div>
      <h2 style={{fontSize:28, fontWeight:500, margin:'0 0 24px'}}>작가 활동 분석</h2>

      <div style={{display:'flex', justifyContent:'space-between', marginBottom:20, flexWrap:'wrap', gap:12}}>
        <div style={{display:'flex', gap:8}}>
          {authors.map(a=>(
            <button key={a} onClick={()=>setAuthor(a)} style={{
              fontSize:12, padding:'8px 16px', borderRadius:6,
              background: author===a ? 'var(--kelp)' : 'transparent',
              border:'1px solid rgba(255,255,255,0.12)', color: author===a ? 'var(--platinum)' : 'var(--silver)'
            }}>{a}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:8}}>
          <button onClick={()=>setRange('week')} style={{
            fontSize:12, padding:'8px 16px', borderRadius:6,
            background: range==='week' ? 'var(--kelp)' : 'transparent', border:'1px solid rgba(255,255,255,0.12)',
            color: range==='week' ? 'var(--platinum)' : 'var(--silver)'
          }}>주간</button>
          <button onClick={()=>setRange('month')} style={{
            fontSize:12, padding:'8px 16px', borderRadius:6,
            background: range==='month' ? 'var(--kelp)' : 'transparent', border:'1px solid rgba(255,255,255,0.12)',
            color: range==='month' ? 'var(--platinum)' : 'var(--silver)'
          }}>월간</button>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:18, marginBottom:18}}>
        <div className="tile">
          <div className="kicker">업로드</div>
          <div style={{fontSize:40, fontWeight:500, color:'var(--lavender)'}}>{latest.uploads}</div>
        </div>
        <div className="tile">
          <div className="kicker">좋아요</div>
          <div style={{fontSize:40, fontWeight:500, color:'var(--lavender)'}}>{latest.likes.toLocaleString()}</div>
        </div>
        <div className="tile">
          <div className="kicker">팔로워</div>
          <div style={{fontSize:40, fontWeight:500, color:'var(--lavender)'}}>{latest.followers.toLocaleString()}</div>
        </div>
      </div>

      <div className="tile">
        <div className="kicker">{author} · 월별 추이 ({range==='week' ? '최근 4주 환산' : '최근 3개월'})</div>
        <div style={{height:260, marginTop:12}}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={data} margin={{top:6,right:16,left:-16,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.07)" vertical={false}/>
              <XAxis dataKey="m" stroke="#bbc7c6" fontSize={12} tickLine={false} axisLine={false}/>
              <YAxis stroke="#bbc7c6" fontSize={11} tickLine={false} axisLine={false}/>
              <Tooltip contentStyle={{background:'#011d1c', border:'1px solid rgba(255,255,255,0.1)', borderRadius:8, fontSize:12}}/>
              <Line type="monotone" dataKey="likes" stroke="#fde9ff" strokeWidth={2} dot={{r:3}}/>
              <Line type="monotone" dataKey="followers" stroke="#cbfffc" strokeWidth={2} dot={{r:3}}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

/* ---------- goods ranking ---------- */

function GoodsRankingScreen({goods, setGoods, setToast}){
  const [period, setPeriod] = useState('week');
  const [category, setCategory] = useState('전체');
  const cats = ['전체', ...Array.from(new Set(goods.map(g=>g.category)))];
  const key = period==='week' ? 'period_week' : 'period_month';
  const filtered = category==='전체' ? goods : goods.filter(g=>g.category===category);
  const sorted = [...filtered].sort((a,b)=>b[key]-a[key]);

  function toggleReview(id){
    setGoods(prev=>prev.map(g=> g.id===id ? {...g, reviewed:!g.reviewed} : g));
    setToast('검수 상태가 변경되었습니다');
  }

  return (
    <div style={{maxWidth:1440, margin:'0 auto', padding:'32px 32px 80px'}}>
      <div className="kicker">Goods Ranking</div>
      <h2 style={{fontSize:28, fontWeight:500, margin:'0 0 24px'}}>굿즈화 랭킹 관리</h2>

      <div style={{display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:12}}>
        <div style={{display:'flex', gap:8}}>
          {['week','month','all'].map(p=>(
            <button key={p} onClick={()=>setPeriod(p)} style={{
              fontSize:12, padding:'8px 16px', borderRadius:6,
              background: period===p ? 'var(--kelp)' : 'transparent', border:'1px solid rgba(255,255,255,0.12)',
              color: period===p ? 'var(--platinum)' : 'var(--silver)'
            }}>{p==='week'?'주간':p==='month'?'월간':'전체'}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCategory(c)} style={{
              fontSize:12, padding:'8px 14px', borderRadius:6,
              background: category===c ? 'var(--kelp)' : 'transparent', border:'1px solid rgba(255,255,255,0.12)',
              color: category===c ? 'var(--platinum)' : 'var(--silver)'
            }}>{c}</button>
          ))}
        </div>
      </div>

      <div className="tile" style={{padding:0, overflow:'hidden'}}>
        {sorted.map((g,i)=>(
          <div key={g.id} style={{
            display:'flex', alignItems:'center', gap:16, padding:'18px 24px',
            borderTop: i>0 ? '1px solid rgba(255,255,255,0.06)' : 'none', animation:`fadeInUp .35s ease ${i*0.04}s both`
          }}>
            <span style={{width:26, fontSize: i<3?20:14, fontWeight:500, color: i===0?'var(--lavender)':'var(--platinum)'}}>{i+1}</span>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:14, fontWeight:500}}>{g.name}</div>
              <div style={{fontSize:12, color:'var(--silver)'}}>{g.author} · {g.category}</div>
              <div style={{height:5, background:'rgba(255,255,255,0.08)', borderRadius:9999, marginTop:8, maxWidth:280, overflow:'hidden'}}>
                <div style={{
                  height:'100%', borderRadius:9999,
                  background:'linear-gradient(90deg, rgb(0,130,124) 0%, rgb(203,255,252) 100%)',
                  width:`${Math.min(100,(g[key]/sorted[0][key])*100)}%`
                }}></div>
              </div>
            </div>
            <div style={{fontSize:15, fontWeight:500, minWidth:60, textAlign:'right'}}>{g[key]}표</div>
            <button onClick={()=>toggleReview(g.id)} style={{
              fontSize:11, padding:'6px 12px', borderRadius:6,
              background: g.reviewed ? 'rgba(203,255,252,0.14)' : 'transparent',
              border:'1px solid rgba(255,255,255,0.14)', color: g.reviewed ? 'var(--mist)' : 'var(--silver)'
            }}>{g.reviewed ? '검수완료' : '검수하기'}</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- app ---------- */

function App(){
  const [view, setView] = useState('main');
  const [queue, setQueue] = useState(moderationQueueInit);
  const [goods, setGoods] = useState(goodsRankingInit);
  const [toast, setToastMsg] = useState('');

  function setToast(msg){ setToastMsg(msg); }
  function goView(v){ setView(v); }
  function exportReport(){ setToast('리포트 생성이 시작되었습니다'); }

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}} data-archetype="bento-grid">
      <TopBar view={view} setView={setView} onExport={exportReport}/>
      <div style={{flex:1, width:'100%'}}>
        {view==='main' && <MainScreen queue={queue} goods={goods} setToast={setToast} goView={goView}/>}
        {view==='moderation' && <ModerationScreen queue={queue} setQueue={setQueue} setToast={setToast}/>}
        {view==='analytics' && <AnalyticsScreen/>}
        {view==='goods' && <GoodsRankingScreen goods={goods} setGoods={setGoods} setToast={setToast}/>}
      </div>
      <footer style={{borderTop:'1px solid rgba(255,255,255,0.07)', padding:'28px 32px', textAlign:'center'}}>
        <div style={{fontSize:12, color:'var(--silver)'}}>© 2025 잉크서클 Ops — 자체 개발 프로젝트</div>
      </footer>
      <Toast message={toast} onClose={()=>setToastMsg('')}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('ops-root'));
root.render(<App/>);
