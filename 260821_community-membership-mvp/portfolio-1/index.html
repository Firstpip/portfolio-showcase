<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모임터 — 회원제 커뮤니티 자격인증 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --ink-navy:#0b3558; --signal-blue:#006bff; --slate-gray:#476788; --mist-gray:#a6bbd1;
    --cloud:#f8f9fb; --paper:#ffffff; --pebble:#f0f3f8; --hairline:#d4e0ed;
    --coral:#e55cff; --cyan:#0099ff; --deep-cobalt:#004eba;
    --shadow-sm: rgba(71,103,136,0.04) 0px 4px 5px 0px, rgba(71,103,136,0.03) 0px 4px 10px 0px, rgba(71,103,136,0.05) 0px 10px 20px 0px;
    --shadow-lg: rgba(71,103,136,0.04) 0px 4px 5px 0px, rgba(71,103,136,0.03) 0px 8px 15px 0px, rgba(71,103,136,0.08) 0px 30px 50px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--cloud);color:var(--ink-navy);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:8px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popLike{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(0,107,255,.45);}70%{box-shadow:0 0 0 8px rgba(0,107,255,0);}100%{box-shadow:0 0 0 0 rgba(0,107,255,0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes progressGrow{from{width:0;}to{width:var(--w);}}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(248,249,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);}
  .navtabs{position:sticky;top:64px;z-index:40;background:var(--paper);border-bottom:1px solid var(--hairline);}
  .navtab{transition:color .15s ease,background .15s ease;}
  .navtab:hover{background:var(--pebble);}
  .navtab.active{color:var(--signal-blue);}
  .btn-primary{background:var(--signal-blue);color:#fff;border:none;border-radius:8px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
  .btn-primary:active{transform:translateY(0) scale(.97);}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--ink-navy);border-radius:8px;font-weight:600;transition:background .15s ease,border-color .15s ease;}
  .btn-ghost:hover{background:var(--pebble);border-color:var(--signal-blue);}
  .card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-sm);border:1px solid var(--hairline);animation:fadeInUp .4s ease both;}
  .post{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-sm);border:1px solid var(--hairline);animation:fadeInUp .45s ease both;transition:box-shadow .18s ease,transform .18s ease;}
  .post:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .like-btn.liked i{color:var(--coral);animation:popLike .35s ease;}
  .skeleton{background:linear-gradient(90deg,var(--pebble) 25%,#e5ecf5 37%,var(--pebble) 63%);background-size:400px 100%;animation:shimmer 1.4s ease infinite;}
  .modal-overlay{position:fixed;inset:0;background:rgba(11,53,88,.45);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s ease;padding:20px;}
  .modal-body{background:var(--paper);border-radius:20px;box-shadow:var(--shadow-lg);animation:fadeInUp .28s ease;max-height:88vh;overflow-y:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(11,53,88,.15);z-index:210;animation:slideInRight .28s ease;overflow-y:auto;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-navy);color:#fff;padding:14px 22px;border-radius:9999px;box-shadow:var(--shadow-lg);z-index:300;animation:fadeInUp .3s ease;font-size:14px;font-weight:500;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--signal-blue);animation:livePulse 2s infinite;}
  .chip{border-radius:9999px;border:1px solid var(--hairline);background:var(--paper);transition:all .15s ease;}
  .chip.active{background:var(--signal-blue);color:#fff;border-color:var(--signal-blue);}
  .chip:hover{border-color:var(--signal-blue);}
  .stepper-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .25s ease;}
  .cap-bar-fill{animation:progressGrow .8s ease both;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

const CATEGORIES = ['자유','정보공유','취미','고민상담','구인구직'];

function avatarUrl(seed){ return `https://source.boringavatars.com/beam/64/${encodeURIComponent(seed)}?colors=0b3558,006bff,e55cff,0099ff,d4e0ed`; }

const INITIAL_POSTS = [
  {id:1, author:'조용한숲', category:'정보공유', time:'12분 전', body:'자격인증 심사에서 재직증명서 스캔본은 어떤 해상도로 올리면 통과가 빠른가요? 200dpi로 올렸다가 반려됐던 경험 공유합니다.', likes:34, liked:false, comments:[{id:1,author:'파란하늘',body:'300dpi 이상 권장드려요, 저도 처음엔 반려됐어요.'}], reportCount:0, pinned:true},
  {id:2, author:'느린바람', category:'취미', time:'28분 전', body:'이번 주말 정모 참여하신 분들 사진 몇 장 남겨요. 다음 모임도 기대됩니다.', likes:51, liked:false, comments:[{id:1,author:'초록달',body:'저도 참여했는데 너무 즐거웠어요!'},{id:2,author:'하얀들판',body:'다음 모임 언제인가요?'},{id:3,author:'조용한숲',body:'다음 주 공지 올라올 예정이에요.'}], reportCount:0, pinned:true},
  {id:3, author:'하얀들판', category:'구인구직', time:'1시간 전', body:'프리랜서로 협업할 디자이너 분을 찾고 있습니다. 관심 있으신 분은 댓글 남겨주세요.', likes:12, liked:false, comments:[], reportCount:0},
  {id:4, author:'초록달', category:'고민상담', time:'2시간 전', body:'익명 게시판이라 편하게 여쭤봅니다. 자격증빙 재제출 후 평균 검토 기간이 어느 정도인가요?', likes:8, liked:false, comments:[{id:1,author:'느린바람',body:'저는 재제출 후 이틀 정도 걸렸어요.'}], reportCount:0},
  {id:5, author:'맑은강', category:'자유', time:'3시간 전', body:'폐쇄형 커뮤니티라 그런지 확실히 글 퀄리티가 다르네요. 다들 좋은 정보 감사합니다.', likes:19, liked:false, comments:[], reportCount:0},
  {id:6, author:'노란들녘', category:'정보공유', time:'5시간 전', body:'모임 개설 요청하고 승인까지 얼마나 걸리는지 아시는 분 계신가요?', likes:6, liked:false, comments:[{id:1,author:'맑은강',body:'저는 1~2일 내로 승인 안내 받았어요.'}], reportCount:1},
];

const MEETUPS = [
  {id:1, title:'주말 러닝 소모임', date:'2026.08.30 (일) 07:00', place:'한강공원 반포지구', capacity:20, applied:18, desc:'매주 주말 아침 5km 러닝 후 가벼운 티타임을 갖는 소모임입니다. 초보자도 환영합니다.', status:'open'},
  {id:2, title:'독서 토론 모임', date:'2026.09.03 (목) 19:30', place:'스터디룸 3층 세미나실', capacity:12, applied:12, desc:'이번 달 선정 도서를 함께 읽고 토론하는 모임입니다. 정원이 마감되어 대기 신청만 가능합니다.', status:'full'},
  {id:3, title:'사진 촬영 원데이', date:'2026.09.06 (일) 14:00', place:'남산 일대', capacity:15, applied:9, desc:'인물/풍경 촬영 기초를 함께 연습하는 원데이 모임입니다.', status:'open'},
  {id:4, title:'보드게임 나이트', date:'2026.09.10 (목) 19:00', place:'회원 커뮤니티 라운지', capacity:10, applied:4, desc:'가볍게 즐기는 보드게임 모임, 초심자도 부담 없이 참여 가능합니다.', status:'open'},
  {id:5, title:'요리 클래스', date:'2026.09.14 (월) 18:30', place:'공유주방 2호점', capacity:8, applied:8, desc:'제철 재료로 만드는 가정식 클래스, 정원이 가득 차 대기 신청으로 전환됩니다.', status:'full'},
];

function Toast({message, onClose}){
  useEffect(()=>{ const t = setTimeout(onClose, 2200); return ()=>clearTimeout(t); },[]);
  return <div className="toast">{message}</div>;
}

function Icon({name, size=18, style}){
  return <i className={`ph ph-${name}`} style={{fontSize:size, ...style}}></i>;
}

function TopBar({active, onNav, onOpenCompose}){
  const tabs = [
    {key:'main', label:'피드'},
    {key:'verification', label:'회원가입 및 자격인증 신청'},
    {key:'job-board', label:'구인구직 게시판 및 신고 처리'},
    {key:'meetup', label:'소모임 조회 및 참가 신청'},
    {key:'mypage', label:'마이페이지'},
  ];
  return (
    <div style={{width:'100%'}}>
      <header className="topbar" style={{height:64,width:'100%',display:'flex',alignItems:'center',padding:'0 24px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,fontWeight:700,fontSize:20,color:'var(--ink-navy)',cursor:'pointer'}} onClick={()=>onNav('main')}>
          <span style={{width:32,height:32,borderRadius:8,background:'var(--signal-blue)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Icon name="users-three" size={18} style={{color:'#fff'}} />
          </span>
          모임터
        </div>
        <div style={{flex:1,maxWidth:360,margin:'0 32px',position:'relative',display:'flex',alignItems:'center'}}>
          <Icon name="magnifying-glass" size={16} style={{position:'absolute',left:14,color:'var(--mist-gray)'}} />
          <input placeholder="게시글, 모임 검색" style={{width:'100%',padding:'9px 14px 9px 36px',borderRadius:9999,border:'1px solid var(--hairline)',background:'var(--pebble)',fontSize:14,outline:'none'}} />
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:14}}>
          <span className="live-dot"></span>
          <span style={{fontSize:12,color:'var(--slate-gray)'}}>실시간 접속 중</span>
          <button className="btn-primary" style={{padding:'9px 18px',fontSize:14}} onClick={onOpenCompose}>
            <Icon name="pencil-simple" size={14} style={{marginRight:6}} />새 글쓰기
          </button>
          <img src={avatarUrl('김서연')} alt="프로필" style={{width:36,height:36,borderRadius:'50%',border:'2px solid var(--hairline)',cursor:'pointer'}} onClick={()=>onNav('mypage')} />
        </div>
      </header>
      <nav className="navtabs" style={{width:'100%',display:'flex',padding:'0 24px',overflowX:'auto'}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>onNav(t.key)}
            className={`navtab ${active===t.key?'active':''}`}
            style={{padding:'14px 16px',background:'transparent',border:'none',borderBottom: active===t.key? '2px solid var(--signal-blue)':'2px solid transparent',fontSize:14,fontWeight:600,color: active===t.key?'var(--signal-blue)':'var(--slate-gray)',whiteSpace:'nowrap'}}>
            {t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

function ComposeModal({onClose, onSubmit}){
  const [body, setBody] = useState('');
  const [category, setCategory] = useState(CATEGORIES[0]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-body" style={{width:520,padding:28}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <h3 style={{margin:0,fontSize:20,fontWeight:700}}>새 게시글 작성</h3>
          <button onClick={onClose} style={{background:'none',border:'none'}}><Icon name="x" size={20} /></button>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {CATEGORIES.map(c=>(
            <button key={c} className={`chip ${category===c?'active':''}`} style={{padding:'6px 14px',fontSize:13,fontWeight:600,border:'none'}} onClick={()=>setCategory(c)}>{c}</button>
          ))}
        </div>
        <textarea value={body} onChange={e=>setBody(e.target.value)} placeholder="익명으로 게시됩니다. 나누고 싶은 이야기를 자유롭게 적어주세요."
          style={{width:'100%',minHeight:130,padding:14,borderRadius:12,border:'1px solid var(--hairline)',resize:'vertical',fontSize:14,outline:'none',background:'var(--pebble)'}} />
        <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:18}}>
          <button className="btn-ghost" style={{padding:'10px 18px',fontSize:14}} onClick={onClose}>취소</button>
          <button className="btn-primary" style={{padding:'10px 20px',fontSize:14}} disabled={!body.trim()} onClick={()=>{ if(body.trim()){ onSubmit(body, category); } }}>게시하기</button>
        </div>
      </div>
    </div>
  );
}

function ReportModal({onClose, onSubmit}){
  const reasons = ['스팸/광고','욕설/비방','음란물','허위 정보','기타'];
  const [reason, setReason] = useState(reasons[0]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-body" style={{width:420,padding:26}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:'0 0 6px',fontSize:18,fontWeight:700}}>신고 사유 선택</h3>
        <p style={{margin:'0 0 16px',fontSize:13,color:'var(--slate-gray)'}}>신고 접수 즉시 관리자 처리 큐에 반영됩니다.</p>
        {reasons.map(r=>(
          <label key={r} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 4px',fontSize:14,cursor:'pointer'}}>
            <input type="radio" name="reason" checked={reason===r} onChange={()=>setReason(r)} />
            {r}
          </label>
        ))}
        <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:16}}>
          <button className="btn-ghost" style={{padding:'9px 16px',fontSize:14}} onClick={onClose}>취소</button>
          <button className="btn-primary" style={{padding:'9px 18px',fontSize:14,background:'var(--coral)'}} onClick={()=>onSubmit(reason)}>신고 제출</button>
        </div>
      </div>
    </div>
  );
}

function CommentDrawer({post, onClose, onAddComment}){
  const [text, setText] = useState('');
  return (
    <div className="drawer" style={{padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h3 style={{margin:0,fontSize:18,fontWeight:700}}>댓글 {post.comments.length}개</h3>
        <button onClick={onClose} style={{background:'none',border:'none'}}><Icon name="x" size={20} /></button>
      </div>
      <div className="card" style={{padding:16,marginBottom:16}}>
        <div style={{display:'flex',gap:10}}>
          <img src={avatarUrl(post.author)} style={{width:32,height:32,borderRadius:'50%'}} />
          <div>
            <div style={{fontWeight:700,fontSize:13}} className="author">{post.author}</div>
            <div style={{fontSize:13,color:'var(--slate-gray)',marginTop:4}}>{post.body}</div>
          </div>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}>
        {post.comments.length===0 && <div style={{fontSize:13,color:'var(--mist-gray)'}}>아직 댓글이 없습니다. 첫 댓글을 남겨보세요.</div>}
        {post.comments.map(c=>(
          <div key={c.id} style={{display:'flex',gap:10}}>
            <img src={avatarUrl(c.author)} style={{width:28,height:28,borderRadius:'50%'}} />
            <div style={{background:'var(--pebble)',borderRadius:12,padding:'8px 12px',fontSize:13}}>
              <span className="author" style={{fontWeight:700,marginRight:6}}>{c.author}</span>{c.body}
            </div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:8,position:'sticky',bottom:0,background:'var(--paper)',paddingTop:10}}>
        <input value={text} onChange={e=>setText(e.target.value)} placeholder="댓글을 입력하세요"
          style={{flex:1,padding:'10px 14px',borderRadius:9999,border:'1px solid var(--hairline)',fontSize:13,outline:'none'}} />
        <button className="btn-primary" style={{padding:'10px 16px'}} onClick={()=>{ if(text.trim()){ onAddComment(text); setText(''); } }}>
          <Icon name="paper-plane-tilt" size={16} />
        </button>
      </div>
    </div>
  );
}

function PostCard({post, onLike, onOpenComments, onReport, idx}){
  return (
    <article className="post" style={{padding:20,marginBottom:16,animationDelay:`${idx*0.05}s`,boxShadow:'0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 30px 50px rgba(71,103,136,.08)'}}>
      {post.pinned && (
        <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'#e6f0ff',color:'var(--deep-cobalt)',fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:9999,marginBottom:10}}>
          <Icon name="fire" size={12} />인기글
        </div>
      )}
      <header className="post-head" style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <img src={avatarUrl(post.author)} className="avatar" style={{width:38,height:38,borderRadius:'50%'}} />
        <div>
          <div className="author" style={{fontWeight:700,fontSize:14}}>{post.author}</div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <time style={{fontSize:12,color:'var(--mist-gray)'}}>{post.time}</time>
            <span style={{fontSize:11,color:'var(--slate-gray)',background:'var(--pebble)',padding:'2px 8px',borderRadius:9999}}>{post.category}</span>
          </div>
        </div>
      </header>
      <div className="post-body" style={{fontSize:14,lineHeight:1.6,color:'var(--ink-navy)',marginBottom:14}}>{post.body}</div>
      <footer className="post-actions" style={{display:'flex',gap:18,borderTop:'1px solid var(--hairline)',paddingTop:12}}>
        <button className={`like-btn ${post.liked?'liked':''}`} style={{background:'none',border:'none',display:'flex',alignItems:'center',gap:6,fontSize:13,color:post.liked?'var(--coral)':'var(--slate-gray)',fontWeight:600}} onClick={()=>onLike(post.id)}>
          <Icon name={post.liked?'heart':'heart'} size={16} />좋아요 {post.likes}
        </button>
        <button className="comment" style={{background:'none',border:'none',display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--slate-gray)',fontWeight:600}} onClick={()=>onOpenComments(post)}>
          <Icon name="chat-circle" size={16} />댓글 {post.comments.length}
        </button>
        <button className="share" style={{background:'none',border:'none',display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--slate-gray)',fontWeight:600,marginLeft:'auto'}} onClick={()=>onReport(post.id)}>
          <Icon name="flag" size={16} />신고{post.reportCount>0?` (${post.reportCount})`:''}
        </button>
      </footer>

function FeedScreen({posts, setPosts, toast}){
  const [sort, setSort] = useState('latest');
  const [showCompose, setShowCompose] = useState(false);
  const [commentPost, setCommentPost] = useState(null);
  const [reportId, setReportId] = useState(null);

  const sorted = [...posts].sort((a,b)=>{
    if (sort==='popular') return (b.likes+b.comments.length*2) - (a.likes+a.comments.length*2);
    return b.id - a.id;
  });
  const pinnedPop = [...posts].sort((a,b)=>b.likes-a.likes)[0];
  const pinnedComment = [...posts].sort((a,b)=>b.comments.length-a.comments.length)[0];

  function toggleLike(id){
    setPosts(posts.map(p=> p.id===id ? {...p, liked:!p.liked, likes: p.liked? p.likes-1 : p.likes+1} : p));
  }
  function addComment(text){
    setPosts(posts.map(p=> p.id===commentPost.id ? {...p, comments:[...p.comments,{id:p.comments.length+1, author:'김서연', body:text}]} : p));
    setCommentPost(cp=> cp ? {...cp, comments:[...cp.comments,{id:cp.comments.length+1, author:'김서연', body:text}]} : cp);
  }
  function submitReport(reason){
    setPosts(posts.map(p=> p.id===reportId ? {...p, reportCount:p.reportCount+1} : p));
    setReportId(null);
    toast('신고가 접수되어 관리자 처리 큐에 반영되었습니다.');
  }

  return (
    <div style={{display:'flex',justifyContent:'center',gap:24,width:'100%',maxWidth:1180,margin:'0 auto',padding:'24px 24px 60px'}}>
      <main className="feed" style={{maxWidth:600,width:'100%'}}>
        <div className="composer card" style={{position:'sticky',top:130,padding:16,marginBottom:20,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={()=>setShowCompose(true)}>
          <img src={avatarUrl('김서연')} style={{width:38,height:38,borderRadius:'50%'}} />
          <div style={{flex:1,padding:'10px 16px',background:'var(--pebble)',borderRadius:9999,color:'var(--mist-gray)',fontSize:14}}>무슨 이야기를 나눠볼까요?</div>
          <button className="btn-primary" style={{padding:'9px 16px',fontSize:13}} onClick={(e)=>{e.stopPropagation();setShowCompose(true);}}>게시</button>
        </div>

        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <button className={`chip ${sort==='latest'?'active':''}`} style={{padding:'7px 16px',fontSize:13,fontWeight:600,border:'1px solid var(--hairline)'}} onClick={()=>setSort('latest')}>최신순</button>
          <button className={`chip ${sort==='popular'?'active':''}`} style={{padding:'7px 16px',fontSize:13,fontWeight:600,border:'1px solid var(--hairline)'}} onClick={()=>setSort('popular')}>인기순</button>
        </div>

        <div className="card" style={{padding:18,marginBottom:20,background:'linear-gradient(135deg, #e6f0ff 0%, #fdeeff 100%)',border:'1px solid var(--hairline)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--deep-cobalt)',marginBottom:10,display:'flex',alignItems:'center',gap:6}}><Icon name="trophy" size={14}/>오늘의 인기글 · 댓글 많은 글</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[pinnedPop, pinnedComment].map((p,i)=>(
              <div key={i} className="author" style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'var(--signal-blue)'}}></span>
                <span style={{fontWeight:700}}>{p.author}</span>
                <span style={{color:'var(--slate-gray)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.body}</span>
              </div>
            ))}
          </div>
        </div>

        {sorted.map((p, idx)=>(
          <PostCard key={p.id} post={p} idx={idx} onLike={toggleLike} onOpenComments={setCommentPost} onReport={setReportId} />
        ))}
      </main>

      <aside className="right-rail" style={{width:300,flexShrink:0}}>
        <div className="card" style={{padding:18,marginBottom:16,position:'sticky',top:130}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12,display:'flex',alignItems:'center',gap:6}}><Icon name="calendar-check" size={16}/>이달의 인기 모임</div>
          {MEETUPS.slice(0,3).map(m=>(
            <div key={m.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'8px 0',borderBottom:'1px solid var(--hairline)'}}>
              <span>{m.title}</span>
              <span style={{color:'var(--slate-gray)'}}>{m.applied}/{m.capacity}</span>
            </div>
          ))}
        </div>
        <div className="card" style={{padding:18}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:10,display:'flex',alignItems:'center',gap:6}}><Icon name="shield-check" size={16}/>커뮤니티 가이드</div>
          <p style={{fontSize:12,color:'var(--slate-gray)',lineHeight:1.6,margin:0}}>모든 회원은 자격인증 승인 절차를 통과한 인원입니다. 상호 존중을 부탁드립니다.</p>

        setPosts([{id: posts.length+10, author:'김서연', category, time:'방금', body, likes:0, liked:false, comments:[], reportCount:0}, ...posts]);

    </div>
  );
}

function VerificationScreen({toast}){
  const stages = ['제출','검토중','승인','반려'];
  const [stageIdx, setStageIdx] = useState(0);
  const [fileName, setFileName] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);

  function handleUpload(){
    setFileName('자격증빙_스캔본.pdf');
    setUploading(true);
    setProgress(0);
    let p = 0;
    const t = setInterval(()=>{
      p += 20;
      setProgress(p);
      if (p>=100){ clearInterval(t); setUploading(false); }
    }, 180);
  }
  function nextStage(){
    setStageIdx(i => i < 2 ? i+1 : i);
    if (stageIdx===1) toast('자격인증이 승인되었습니다.');
  }
  function rejectPath(){
    setStageIdx(3);
    toast('심사가 반려되었습니다. 사유를 확인해주세요.');
  }

  return (
    <div style={{maxWidth:760,margin:'0 auto',padding:'48px 24px 70px'}}>
      <h1 style={{fontSize:44,fontWeight:700,lineHeight:1.2,color:'var(--ink-navy)',margin:'0 0 12px'}}>자격인증을 완료하고<br/>커뮤니티에 참여하세요</h1>
      <p style={{fontSize:16,color:'var(--slate-gray)',margin:'0 0 36px',maxWidth:560}}>이메일 또는 휴대전화로 가입 후, 자격증빙 자료를 제출하면 관리자 심사를 거쳐 승인됩니다.</p>

      <div className="card" style={{padding:28,marginBottom:24}}>
        <h3 style={{fontSize:18,fontWeight:700,margin:'0 0 18px'}}>회원가입 정보</h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--slate-gray)'}}>이메일 또는 휴대전화</label>
            <input placeholder="example@email.com" style={{width:'100%',padding:'11px 14px',borderRadius:8,border:'1px solid var(--hairline)',marginTop:6,fontSize:14,outline:'none'}} />
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--slate-gray)'}}>닉네임</label>
            <input placeholder="커뮤니티에서 사용할 닉네임" style={{width:'100%',padding:'11px 14px',borderRadius:8,border:'1px solid var(--hairline)',marginTop:6,fontSize:14,outline:'none'}} />
          </div>
        </div>
        <div style={{marginBottom:8}}>
          <label style={{fontSize:12,fontWeight:600,color:'var(--slate-gray)'}}>회원 유형</label>
          <select style={{width:'100%',padding:'11px 14px',borderRadius:8,border:'1px solid var(--hairline)',marginTop:6,fontSize:14,outline:'none',background:'#fff'}}>
            <option>일반 회원</option>
            <option>전문가 회원</option>
            <option>모임 운영진 지원</option>
          </select>
        </div>
      </div>

      <div className="card" style={{padding:28,marginBottom:24}}>
        <h3 style={{fontSize:18,fontWeight:700,margin:'0 0 6px'}}>자격증빙 제출</h3>
        <p style={{fontSize:13,color:'var(--slate-gray)',margin:'0 0 16px'}}>이미지 또는 PDF 파일을 업로드해주세요.</p>
        <div onClick={handleUpload} style={{border:'2px dashed var(--hairline)',borderRadius:12,padding:'32px 20px',textAlign:'center',cursor:'pointer',background:'var(--pebble)'}}>
          <Icon name="upload-simple" size={26} style={{color:'var(--signal-blue)'}} />
          <div style={{fontSize:14,fontWeight:600,marginTop:10}}>{fileName || '클릭하여 파일 선택 (이미지/PDF)'}</div>
          {uploading && (
            <div style={{marginTop:12,height:6,background:'var(--hairline)',borderRadius:9999,overflow:'hidden'}}>
              <div style={{height:'100%',background:'var(--signal-blue)',width:`${progress}%`,transition:'width .18s ease'}}></div>
            </div>
          )}
          {!uploading && fileName && <div style={{fontSize:12,color:'var(--signal-blue)',marginTop:8}}><Icon name="check-circle" size={12}/> 업로드 완료</div>}
        </div>
      </div>

      <div className="card" style={{padding:28}}>
        <h3 style={{fontSize:18,fontWeight:700,margin:'0 0 20px'}}>심사 진행 상태</h3>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
          {stages.slice(0,3).map((s,i)=>(
            <React.Fragment key={s}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
                <div className="stepper-dot" style={{background: i<=stageIdx && stageIdx!==3 ? 'var(--signal-blue)':'var(--hairline)', color: i<=stageIdx && stageIdx!==3?'#fff':'var(--slate-gray)'}}>{i+1}</div>
                <span style={{fontSize:12,fontWeight:600,color: i<=stageIdx && stageIdx!==3?'var(--ink-navy)':'var(--mist-gray)'}}>{s}</span>

              {i<2 && <div style={{flex:1,height:2,background: i<stageIdx && stageIdx!==3 ?'var(--signal-blue)':'var(--hairline)'}}></div>}
            </React.Fragment>
          ))}
        </div>

        {stageIdx===3 ? (
          <div style={{background:'#fff5fb',border:'1px solid var(--coral)',borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:14,color:'var(--coral)',marginBottom:6}}><Icon name="x-circle" size={14}/> 반려됨 — 사유: 첨부 이미지 해상도 부족</div>
            <button className="btn-primary" style={{padding:'8px 16px',fontSize:13,marginTop:8}} onClick={()=>setStageIdx(0)}>재제출하기</button>
          </div>
        ) : stageIdx===2 ? (
          <div style={{background:'#e6f0ff',borderRadius:12,padding:16,fontSize:14,fontWeight:700,color:'var(--deep-cobalt)'}}><Icon name="seal-check" size={14}/> 인증 완료 — 주요 서비스 이용이 가능합니다.</div>
        ) : (
          <div style={{display:'flex',gap:10}}>
            <button className="btn-primary" style={{padding:'10px 18px',fontSize:13}} onClick={nextStage}>다음 단계 확인하기</button>
            <button className="btn-ghost" style={{padding:'10px 18px',fontSize:13}} onClick={rejectPath}>반려 시나리오 보기</button>
          </div>
        )}
      </div>
    </div>
  );
}

function MeetupScreen({toast}){
  const [meetups, setMeetups] = useState(MEETUPS);
  const [selected, setSelected] = useState(null);
  const [applied, setApplied] = useState({});
  const [showRequest, setShowRequest] = useState(false);

  function apply(m){
    if (applied[m.id]){
      setApplied(a=>({...a,[m.id]:false}));
      setMeetups(meetups.map(x=> x.id===m.id ? {...x, applied: x.applied-1, status: x.applied-1 < x.capacity ? 'open':'full'} : x));
      toast('신청이 취소되었습니다. 대기열 1순위가 자동 승격됩니다.');
    } else if (m.applied < m.capacity){
      setApplied(a=>({...a,[m.id]:true}));
      setMeetups(meetups.map(x=> x.id===m.id ? {...x, applied: x.applied+1, status: x.applied+1 >= x.capacity ? 'full':'open'} : x));
      toast('모임 참가 신청이 완료되었습니다.');
    } else {
      toast('정원이 마감되어 대기 신청으로 접수되었습니다.');
    }
  }

  return (
    <div style={{maxWidth:920,margin:'0 auto',padding:'40px 24px 70px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:22}}>
        <div>
          <h2 style={{fontSize:28,fontWeight:700,margin:'0 0 6px'}}>소모임 조회</h2>
          <p style={{fontSize:13,color:'var(--slate-gray)',margin:0}}>정원과 신청 인원을 확인하고 참가 신청을 진행하세요.</p>

        <button className="btn-ghost" style={{padding:'10px 18px',fontSize:13}} onClick={()=>setShowRequest(true)}><Icon name="plus-circle" size={14} style={{marginRight:6}}/>모임 개설 요청</button>

          const pct = Math.min(100, Math.round(m.applied/m.capacity*100));
          return (
            <div key={m.id} className="card" style={{padding:20,cursor:'pointer',animationDelay:`${idx*0.05}s`}} onClick={()=>setSelected(m)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <h4 style={{fontSize:15,fontWeight:700,margin:0}}>{m.title}</h4>
                {m.status==='full' && <span style={{fontSize:10,fontWeight:700,color:'var(--coral)',background:'#fff0fa',padding:'2px 8px',borderRadius:9999}}>마감</span>}
              </div>
              <div style={{fontSize:12,color:'var(--slate-gray)',marginBottom:4}}><Icon name="calendar" size={12}/> {m.date}</div>

                <div className="cap-bar-fill" style={{'--w':`${pct}%`,height:'100%',background: pct>=100?'var(--coral)':'var(--signal-blue)'}}></div>
              </div>
              <div style={{fontSize:12,color:'var(--slate-gray)'}}>{m.applied}/{m.capacity}명 신청</div>
            </div>

      {selected && (() => {

        return (

            <h3 style={{fontSize:20,fontWeight:700,margin:'0 0 8px'}}>{selected.title}</h3>

            <p style={{fontSize:14,lineHeight:1.6,color:'var(--ink-navy)',marginBottom:18}}>{selected.desc}</p>
            <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
              <button className="btn-ghost" style={{padding:'10px 16px',fontSize:13}} onClick={()=>setSelected(null)}>닫기</button>
              <button className="btn-primary" style={{padding:'10px 18px',fontSize:13, background: btnBg}} onClick={()=>apply(selected)}>
                {applied[selected.id] ? '신청 취소' : (isFull ? '대기 신청하기' : '참가 신청하기')}
              </button>
            </div>
          </div>
        </div>
        );
      })()}

      {showRequest && (
        <div className="modal-overlay" onClick={()=>setShowRequest(false)}>
          <div className="modal-body" style={{width:460,padding:26}} onClick={e=>e.stopPropagation()}>
            <h3 style={{margin:'0 0 16px',fontSize:18,fontWeight:700}}>모임 개설 요청</h3>
            <input placeholder="모임 이름" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid var(--hairline)',marginBottom:10,fontSize:13,outline:'none'}} />
            <textarea placeholder="모임 소개 및 일정 제안" style={{width:'100%',minHeight:90,padding:10,borderRadius:8,border:'1px solid var(--hairline)',fontSize:13,outline:'none'}} />
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:16}}>
              <button className="btn-ghost" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setShowRequest(false)}>취소</button>
              <button className="btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={()=>{setShowRequest(false); toast('모임 개설 요청이 관리자 검토 큐에 접수되었습니다.');}}>요청 제출</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MyPageScreen(){
  const [tab, setTab] = useState('activity');
  const [subTab, setSubTab] = useState('written');
  const [notif, setNotif] = useState(true);

  return (
    <div style={{maxWidth:760,margin:'0 auto',padding:'40px 24px 70px'}}>
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:28}}>
        <img src={avatarUrl('김서연')} style={{width:64,height:64,borderRadius:'50%',border:'3px solid var(--hairline)'}} />
        <div>
          <div style={{fontSize:20,fontWeight:700}}>김서연</div>
          <div style={{fontSize:12,color:'var(--signal-blue)',fontWeight:600,marginTop:4}}><Icon name="seal-check" size={13}/> 자격인증 완료</div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:20,borderBottom:'1px solid var(--hairline)'}}>
        {[{k:'activity',l:'활동 내역'},{k:'applications',l:'신청 내역'},{k:'settings',l:'계정 설정'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{padding:'10px 16px',background:'none',border:'none',borderBottom: tab===t.k?'2px solid var(--signal-blue)':'2px solid transparent',fontWeight:600,fontSize:14,color: tab===t.k?'var(--signal-blue)':'var(--slate-gray)'}}>{t.l}</button>
        ))}
      </div>

      {tab==='activity' && (
        <div>
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            {[{k:'written',l:'내가 쓴 글'},{k:'commented',l:'댓글 단 글'},{k:'liked',l:'좋아요한 글'}].map(s=>(
              <button key={s.k} className={`chip ${subTab===s.k?'active':''}`} style={{padding:'6px 14px',fontSize:12,fontWeight:600,border:'1px solid var(--hairline)'}} onClick={()=>setSubTab(s.k)}>{s.l}</button>
            ))}
          </div>
          {[1,2,3].map(i=>(
            <div key={i} className="card" style={{padding:16,marginBottom:10,fontSize:13}}>
              {subTab==='written' && `자격증빙 재제출 후 검토 기간에 대해 궁금합니다 (${i})`}
              {subTab==='commented' && `저도 재제출 후 이틀 정도 걸렸어요 (${i})`}
              {subTab==='liked' && `이번 주말 정모 참여하신 분들 사진 공유합니다 (${i})`}
            </div>
          ))}
        </div>
      )}

      {tab==='applications' && (
        <div>
          {MEETUPS.slice(0,3).map(m=>(
            <div key={m.id} className="card" style={{padding:16,marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{m.title}</div>
                <div style={{fontSize:12,color:'var(--slate-gray)'}}>{m.date}</div>
              </div>
              <span style={{fontSize:12,fontWeight:700,color:'var(--signal-blue)',background:'#e6f0ff',padding:'4px 10px',borderRadius:9999}}>신청완료</span>
            </div>
          ))}
        </div>
      )}

      {tab==='settings' && (
        <div className="card" style={{padding:24}}>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,fontWeight:600,color:'var(--slate-gray)'}}>닉네임</label>
            <input defaultValue="김서연" style={{width:'100%',padding:'10px 14px',borderRadius:8,border:'1px solid var(--hairline)',marginTop:6,fontSize:14,outline:'none'}} />
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderTop:'1px solid var(--hairline)'}}>
            <span style={{fontSize:14,fontWeight:600}}>새 댓글 알림 받기</span>
            <button onClick={()=>setNotif(!notif)} style={{width:44,height:24,borderRadius:9999,background:notif?'var(--signal-blue)':'var(--hairline)',border:'none',position:'relative',transition:'background .2s ease'}}>
              <span style={{position:'absolute',top:2,left:notif?22:2,width:20,height:20,borderRadius:'50%',background:'#fff',transition:'left .2s ease'}}></span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [posts, setPosts] = useState(INITIAL_POSTS);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg)=> setToastMsg(msg);

  return (
    <div data-archetype="feed-timeline" style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar active={screen} onNav={setScreen} onOpenCompose={()=>setScreen('main')} />
      <div style={{flex:1,width:'100%'}}>
        {screen==='main' && <FeedScreen posts={posts} setPosts={setPosts} toast={toast} />}
        {screen==='verification' && <VerificationScreen toast={toast} />}
        {screen==='job-board' && <JobBoardScreen toast={toast} />}
        {screen==='meetup' && <MeetupScreen toast={toast} />}
        {screen==='mypage' && <MyPageScreen />}
      </div>
      {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
