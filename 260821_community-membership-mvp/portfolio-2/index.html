<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 통합 운영 관리자 콘솔</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#ffc7fa; --secondary:#e3e3e2; --accent:#79f61e;
    --bg:#f2f0eb; --surface:#ffffff; --text:#292827; --text-sec:#666666;
    --border:#e3e3e2; --wine:#421d24; --violet:#714cb6; --lagoon:#0c4243;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  #app-root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  @keyframes fadeInRow{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes countUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(121,246,30,.5);}70%{box-shadow:0 0 0 6px rgba(121,246,30,0);}100%{box-shadow:0 0 0 0 rgba(121,246,30,0);}}
  @keyframes barGrow{from{width:0;}to{width:var(--w);}}

  .sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--wine);color:#fff;display:flex;flex-direction:column;z-index:60;}
  .main-wrap{margin-left:248px;min-height:100vh;flex:1;min-width:0;width:calc(100% - 248px);}
  .side-link{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.65);font-size:14px;font-weight:600;border-left:3px solid transparent;transition:all .15s ease;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
  .side-link.active{background:rgba(255,255,255,.09);color:#fff;border-left:3px solid var(--primary);}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;width:100%;}
  .btn-primary{background:var(--wine);color:#fff;border:none;border-radius:8px;font-weight:600;transition:transform .1s ease,opacity .15s ease;}
  .btn-primary:hover{opacity:.88;transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0) scale(.97);}
  .btn-outline{background:var(--primary);color:var(--text);border:1px solid var(--text);border-radius:8px;font-weight:600;transition:all .15s ease;}
  .btn-outline:hover{background:#f5deff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;font-weight:600;}
  .btn-ghost:hover{background:var(--bg);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;animation:slideUp .35s ease both;}
  .list-row{border-bottom:1px solid var(--border);padding:14px 16px;cursor:pointer;transition:background .12s ease;animation:fadeInRow .3s ease both;}
  .list-row:hover{background:var(--bg);}
  .list-row.selected{background:#fff5fd;border-left:3px solid var(--primary);}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;}
  .badge-pending{background:#fff4d9;color:#8a6400;}
  .badge-approved{background:#eafcdb;color:#3d7a05;}
  .badge-rejected{background:#ffe3ec;color:#a30037;}
  .modal-overlay{position:fixed;inset:0;background:rgba(41,40,39,.45);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s ease;padding:20px;}
  .modal-body{background:var(--surface);border-radius:8px;border:1px solid var(--border);animation:slideUp .25s ease;max-height:88vh;overflow-y:auto;}
  .toast{position:fixed;bottom:24px;right:28px;background:var(--wine);color:#fff;padding:14px 20px;border-radius:8px;z-index:300;animation:slideUp .25s ease;font-size:13px;font-weight:600;}
  .priority-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ringPulse 2s infinite;}
  .bar-fill{animation:barGrow .7s ease both;}
  .stat-num{animation:countUp .4s ease both;}
  .chip{border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;padding:6px 12px;transition:all .15s ease;}
  .chip.active{background:var(--primary);border-color:var(--text);}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-sec);padding:10px 14px;border-bottom:1px solid var(--border);}
  td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

function Icon({name, size=17, style}){ return <i className={`ti ti-${name}`} style={{fontSize:size, ...style}}></i>; }
function avatarUrl(seed){ return `https://source.boringavatars.com/marble/48/${encodeURIComponent(seed)}?colors=421d24,714cb6,d4c7ff,79f61e,292827`; }

const VERIFICATIONS = [
  {id:1, name:'이하늘', type:'전문가 회원', submitted:'2026.08.19', status:'pending', file:'재직증명서.pdf'},
  {id:2, name:'박도윤', type:'일반 회원', submitted:'2026.08.19', status:'pending', file:'자격증_스캔.jpg'},
  {id:3, name:'최서준', type:'일반 회원', submitted:'2026.08.18', status:'pending', file:'수료증.pdf'},
  {id:4, name:'정유진', type:'전문가 회원', submitted:'2026.08.17', status:'approved', file:'경력증명서.pdf'},
  {id:5, name:'한지호', type:'일반 회원', submitted:'2026.08.16', status:'rejected', file:'신분증.jpg'},
  {id:6, name:'오수아', type:'일반 회원', submitted:'2026.08.15', status:'approved', file:'재직증명서.pdf'},
];

const REPORTS = [
  {id:1, target:'게시글', title:'특정 회원 비방 목적 게시글', reporter:'익명', count:4, status:'대기', category:'비방'},
  {id:2, target:'댓글', title:'광고성 링크 반복 게시', reporter:'익명', count:6, status:'대기', category:'스팸'},
  {id:3, target:'게시글', title:'허위 정보 유포 의심 게시글', reporter:'익명', count:2, status:'처리중', category:'허위정보'},
  {id:4, target:'댓글', title:'욕설 포함 댓글', reporter:'익명', count:3, status:'완료', category:'욕설'},
];

const MEETUPS = [
  {id:1, title:'주말 러닝 소모임', date:'2026.08.30', capacity:20, applied:18},
  {id:2, title:'독서 토론 모임', date:'2026.09.03', capacity:12, applied:12},
  {id:3, title:'사진 촬영 원데이', date:'2026.09.06', capacity:15, applied:9},
];

const MEMBERS = [
  {id:1, name:'김서연', email:'seoyeon@example.com', grade:'전문가 회원', status:'인증완료', joined:'2026.06.02'},
  {id:2, name:'이하늘', email:'haneul@example.com', grade:'전문가 회원', status:'심사중', joined:'2026.08.19'},
  {id:3, name:'박도윤', email:'doyun@example.com', grade:'일반 회원', status:'심사중', joined:'2026.08.19'},
  {id:4, name:'한지호', email:'jiho@example.com', grade:'일반 회원', status:'반려', joined:'2026.08.16'},
  {id:5, name:'오수아', email:'sua@example.com', grade:'일반 회원', status:'인증완료', joined:'2026.08.15'},
];

function Toast({message, onClose}){
  useEffect(()=>{ const t=setTimeout(onClose,2200); return ()=>clearTimeout(t); },[]);
  return <div className="toast">{message}</div>;
}

function Sidebar({active, onNav}){
  const items = [
    {key:'main', label:'대시보드', icon:'layout-dashboard'},
    {key:'verification-review', label:'자격인증 심사 관리', icon:'shield-check'},
    {key:'content-moderation', label:'콘텐츠 및 신고 관리', icon:'flag'},
    {key:'meetup-management', label:'모임 및 신청자 관리', icon:'calendar-event'},
    {key:'member-management', label:'회원 관리', icon:'users'},
  ];
  return (
    <aside className="sidebar">
      <div style={{padding:'22px 20px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid rgba(255,255,255,.1)'}}>
        <span style={{width:30,height:30,borderRadius:8,background:'var(--primary)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <Icon name="settings" size={16} style={{color:'var(--text)'}} />
        </span>
        <span style={{fontWeight:700,fontSize:16}}>운영 콘솔</span>
      </div>
      <nav style={{flex:1,padding:'14px 0'}}>
        {items.map(it=>(
          <button key={it.key} className={`side-link ${active===it.key?'active':''}`} onClick={()=>onNav(it.key)}>
            <Icon name={it.icon} size={17} />{it.label}
          </button>
        ))}
      </nav>
      <div style={{padding:'16px 20px',borderTop:'1px solid rgba(255,255,255,.1)',display:'flex',alignItems:'center',gap:10}}>
        <img src={avatarUrl('관리자')} style={{width:32,height:32,borderRadius:'50%'}} />
        <div style={{fontSize:12}}>
          <div style={{fontWeight:700}}>운영 관리자</div>
          <div style={{color:'rgba(255,255,255,.5)'}}>최고 권한</div>
        </div>
      </div>
    </aside>
  );
}

function TopBar({title, onSearch, onOpenNotif}){
  return (
    <header className="topbar">
      <h2 style={{fontSize:18,fontWeight:700,margin:0}}>{title}</h2>
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:14}}>
        <div style={{position:'relative'}}>
          <Icon name="search" size={15} style={{position:'absolute',left:12,top:9,color:'var(--text-sec)'}} />
          <input placeholder="검색" onChange={onSearch} style={{padding:'8px 14px 8px 34px',borderRadius:8,border:'1px solid var(--border)',fontSize:13,outline:'none',width:200}} />
        </div>
        <button style={{background:'none',border:'none',position:'relative'}} onClick={onOpenNotif}>
          <Icon name="bell" size={19} style={{color:'var(--text)'}} />
          <span style={{position:'absolute',top:-2,right:-2,width:8,height:8,borderRadius:'50%',background:'var(--wine)'}}></span>
        </button>
      </div>
    </header>
  );
}

function DashboardScreen({onNav, toast}){
  const [selected, setSelected] = useState('pending-verify');
  const chartRef = useRef(null);
  useEffect(()=>{
    const ctx = chartRef.current.getContext('2d');
    const chart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels:['인증완료','심사중','반려'], datasets:[{ data:[62,28,10], backgroundColor:['#79f61e','#ffc7fa','#421d24'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}} }
    });
    return ()=>chart.destroy();
  },[]);

  const priorityItems = [
    {key:'pending-verify', label:'미승인 자격증빙', count:VERIFICATIONS.filter(v=>v.status==='pending').length, icon:'shield-exclamation', target:'verification-review'},
    {key:'pending-report', label:'미처리 신고', count:REPORTS.filter(r=>r.status!=='완료').length, icon:'flag', target:'content-moderation'},
    {key:'closing-meetup', label:'마감 임박 모임', count:MEETUPS.filter(m=>m.applied/m.capacity>0.85).length, icon:'clock-exclamation', target:'meetup-management'},
  ];
  const detail = priorityItems.find(p=>p.key===selected);

  return (
    <div style={{padding:'28px 28px 60px',width:'100%'}}>
      <div style={{
        position:'relative', overflow:'hidden', borderRadius:8, padding:'36px 32px', marginBottom:24,
        background:'radial-gradient(circle at 18% 30%, rgba(113,76,182,.35) 0%, transparent 55%), radial-gradient(circle at 85% 20%, rgba(255,199,250,.45) 0%, transparent 50%), radial-gradient(circle at 60% 90%, rgba(12,66,67,.25) 0%, transparent 55%), var(--wine)'
      }}>
        <svg viewBox="0 0 400 160" style={{position:'absolute',right:0,top:0,height:'100%',opacity:.5}}>
          <polygon points="260,0 400,0 400,160 200,160" fill="rgba(255,255,255,0.05)" />
          <rect x="230" y="20" width="90" height="90" rx="16" fill="rgba(255,255,255,0.06)" transform="rotate(18 275 65)" />
          <circle cx="340" cy="110" r="46" fill="rgba(121,246,30,0.10)" />
          <line x1="220" y1="10" x2="380" y2="150" stroke="rgba(255,255,255,0.08)" strokeWidth="2" />
        </svg>
        <div style={{position:'relative',maxWidth:520}}>
          <div style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.7)',marginBottom:8}}>운영 콘솔 개요</div>
          <h1 style={{fontSize:36,fontWeight:700,lineHeight:1.15,color:'#fff',margin:'0 0 10px'}}>오늘 처리할 커뮤니티 운영 현황을<br/>한눈에 확인하세요</h1>
          <p style={{fontSize:14,color:'rgba(255,255,255,.72)',margin:0,lineHeight:1.6}}>자격인증·신고·모임 신청 데이터를 마스터-디테일 구조로 통합 조회합니다.</p>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:24}}>
        {[
          {label:'전체 회원', value:'1,284명', icon:'users'},
          {label:'대기 중인 자격인증', value:`${VERIFICATIONS.filter(v=>v.status==='pending').length}건`, icon:'shield-exclamation'},
          {label:'이번 달 모임 신청', value:'186건', icon:'calendar-event'},
        ].map((s,i)=>(
          <div key={i} className="card stat-num" style={{padding:20, animationDelay:`${i*0.08}s`}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,color:'var(--text-sec)',fontSize:12,fontWeight:600}}><Icon name={s.icon} size={15}/>{s.label}</div>
            <div style={{fontSize:26,fontWeight:700}}>{s.value}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:16,alignItems:'stretch'}}>
        <div className="card list-rail" style={{width:340,flexShrink:0,padding:0,boxShadow:'none'}}>
          <div style={{padding:'16px 18px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:14,display:'flex',alignItems:'center',gap:8}}>
            <span className="priority-dot"></span>우선 처리 항목
          </div>
          {priorityItems.map(p=>(
            <div key={p.key} className={`list-row ${selected===p.key?'selected':''}`} onClick={()=>setSelected(p.key)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',alignItems:'center',gap:10,fontSize:13,fontWeight:600}}><Icon name={p.icon} size={16}/>{p.label}</div>
                <span className="badge badge-pending">{p.count}건</span>
              </div>
            </div>
          ))}
          <div style={{padding:'16px 18px',borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:10,color:'var(--text-sec)'}}>자격인증 처리 현황</div>
            <div style={{height:150,position:'relative'}}><canvas ref={chartRef}></canvas></div>
          </div>
        </div>

        <div className="card detail-panel" style={{flex:1,padding:24}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <h3 style={{fontSize:17,fontWeight:700,margin:0}}>{detail.label}</h3>
            <button className="btn-primary" style={{padding:'9px 16px',fontSize:13}} onClick={()=>onNav(detail.target)}>상세 관리로 이동</button>
          </div>
          {selected==='pending-verify' && (
            <div>
              {VERIFICATIONS.filter(v=>v.status==='pending').map(v=>(
                <div key={v.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <img src={avatarUrl(v.name)} style={{width:32,height:32,borderRadius:'50%'}} />
                    <div><div style={{fontWeight:700,fontSize:13}}>{v.name}</div><div style={{fontSize:12,color:'var(--text-sec)'}}>{v.type} · {v.submitted}</div></div>
                  </div>
                  <span className="badge badge-pending">대기중</span>
                </div>
              ))}
            </div>
          )}
          {selected==='pending-report' && (
            <div>
              {REPORTS.filter(r=>r.status!=='완료').map(r=>(
                <div key={r.id} style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
                  <div style={{fontWeight:700,fontSize:13}}>{r.title}</div>
                  <div style={{fontSize:12,color:'var(--text-sec)',marginTop:4}}>{r.target} · 누적 신고 {r.count}건 · {r.status}</div>
                </div>
              ))}
            </div>
          )}
          {selected==='closing-meetup' && (
            <div>
              {MEETUPS.filter(m=>m.applied/m.capacity>0.85).map(m=>{
                const pct = Math.round(m.applied/m.capacity*100);
                return (
                  <div key={m.id} style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700,marginBottom:6}}><span>{m.title}</span><span>{m.applied}/{m.capacity}</span></div>
                    <div style={{height:6,background:'var(--border)',borderRadius:8,overflow:'hidden'}}>
                      <div className="bar-fill" style={{'--w':`${pct}%`,height:'100%',background:'var(--wine)'}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function VerificationReviewScreen({toast}){
  const [items, setItems] = useState(VERIFICATIONS);
  const [selectedIds, setSelectedIds] = useState([]);
  const [active, setActive] = useState(items[0]);
  const [rejectReason, setRejectReason] = useState('');
  const [showReject, setShowReject] = useState(false);

  function toggleSelect(id){ setSelectedIds(s=> s.includes(id) ? s.filter(x=>x!==id) : [...s,id]); }
  function bulkApprove(){
    setItems(items.map(i=> selectedIds.includes(i.id) ? {...i, status:'approved'} : i));
    toast(`${selectedIds.length}건이 일괄 승인 처리되었습니다.`);
    setSelectedIds([]);
  }
  function approveOne(id){ setItems(items.map(i=> i.id===id?{...i,status:'approved'}:i)); toast('승인 처리되었습니다.'); }
  function rejectOne(){
    setItems(items.map(i=> i.id===active.id?{...i,status:'rejected'}:i));
    toast('반려 처리되어 사유가 회원에게 전달되었습니다.');
    setShowReject(false); setRejectReason('');
  }

  return (
    <div style={{padding:'28px',width:'100%',display:'flex',gap:16}}>
      <div className="card list-rail" style={{width:400,flexShrink:0,padding:0}}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontWeight:700,fontSize:14}}>자격증빙 신청 목록</span>
          <button className="btn-outline" style={{padding:'6px 12px',fontSize:12}} disabled={selectedIds.length===0} onClick={bulkApprove}>선택 일괄 승인 ({selectedIds.length})</button>
        </div>
        {items.map(v=>(
          <div key={v.id} className={`list-row ${active.id===v.id?'selected':''}`} onClick={()=>setActive(v)}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input type="checkbox" checked={selectedIds.includes(v.id)} onChange={(e)=>{e.stopPropagation();toggleSelect(v.id);}} onClick={e=>e.stopPropagation()} />
              <img src={avatarUrl(v.name)} style={{width:30,height:30,borderRadius:'50%'}} />
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13}}>{v.name}</div>
                <div style={{fontSize:11,color:'var(--text-sec)'}}>{v.type} · {v.submitted}</div>
              </div>
              <span className={`badge badge-${v.status==='pending'?'pending':v.status==='approved'?'approved':'rejected'}`}>
                {v.status==='pending'?'대기중':v.status==='approved'?'승인':'반려'}
              </span>
            </div>
          </div>
        ))}
      </div>

      <div className="card detail-panel" style={{flex:1,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
          <div style={{display:'flex',gap:14,alignItems:'center'}}>
            <img src={avatarUrl(active.name)} style={{width:48,height:48,borderRadius:'50%'}} />
            <div>
              <div style={{fontWeight:700,fontSize:16}}>{active.name}</div>
              <div style={{fontSize:12,color:'var(--text-sec)'}}>{active.type} · 제출일 {active.submitted}</div>
            </div>
          </div>
          <span className={`badge badge-${active.status==='pending'?'pending':active.status==='approved'?'approved':'rejected'}`}>
            {active.status==='pending'?'대기중':active.status==='approved'?'승인':'반려'}
          </span>
        </div>

        <div style={{border:'1px solid var(--border)',borderRadius:8,padding:20,marginBottom:20,background:'var(--bg)',display:'flex',alignItems:'center',gap:12}}>
          <Icon name="file-text" size={26} style={{color:'var(--text-sec)'}} />
          <div>
            <div style={{fontWeight:700,fontSize:13}}>{active.file}</div>
            <div style={{fontSize:11,color:'var(--text-sec)'}}>자격증빙 첨부 파일 미리보기</div>
          </div>
        </div>

        <div style={{marginBottom:20}}>
          <label style={{fontSize:12,fontWeight:700,color:'var(--text-sec)'}}>승인/반려 사유</label>
          <textarea placeholder="처리 사유를 입력하세요 (선택)" style={{width:'100%',minHeight:70,padding:10,borderRadius:8,border:'1px solid var(--border)',fontSize:13,marginTop:6,outline:'none'}} />
        </div>

        <div style={{display:'flex',gap:10}}>
          <button className="btn-primary" style={{padding:'10px 20px',fontSize:13}} onClick={()=>approveOne(active.id)}>승인 처리</button>
          <button className="btn-ghost" style={{padding:'10px 20px',fontSize:13}} onClick={()=>setShowReject(true)}>반려 처리</button>
        </div>

        <div style={{marginTop:24,paddingTop:16,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--text-sec)',marginBottom:10}}>처리 이력</div>
          <div style={{fontSize:12,color:'var(--text-sec)'}}>2026.08.19 14:02 — 제출됨</div>
        </div>
      </div>

      {showReject && (
        <div className="modal-overlay" onClick={()=>setShowReject(false)}>
          <div className="modal-body" style={{width:420,padding:24}} onClick={e=>e.stopPropagation()}>
            <h3 style={{fontSize:16,fontWeight:700,margin:'0 0 14px'}}>반려 사유 입력</h3>
            <textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="예: 첨부 이미지 해상도 부족" style={{width:'100%',minHeight:80,padding:10,borderRadius:8,border:'1px solid var(--border)',fontSize:13,outline:'none'}} />
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:16}}>
              <button className="btn-ghost" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setShowReject(false)}>취소</button>
              <button className="btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={rejectOne}>반려 확정</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ContentModerationScreen({toast}){
  const [reports, setReports] = useState(REPORTS);
  const [active, setActive] = useState(REPORTS[0]);
  const [filter, setFilter] = useState('전체');

  const filtered = filter==='전체' ? reports : reports.filter(r=>r.status===filter);
  const sorted = [...filtered].sort((a,b)=>b.count-a.count);

  function setStatus(id, status){
    setReports(reports.map(r=> r.id===id?{...r,status}:r));
    if (active.id===id) setActive({...active, status});
    toast(`처리 상태가 '${status}'(으)로 변경되었습니다.`);
  }
  function hideContent(){
    toast('해당 콘텐츠가 회원 화면에서 즉시 비노출 처리되었습니다.');
  }

  return (
    <div style={{padding:'28px',width:'100%',display:'flex',gap:16}}>
      <div className="card list-rail" style={{width:380,flexShrink:0,padding:0}}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',gap:6}}>
          {['전체','대기','처리중','완료'].map(f=>(
            <button key={f} className={`chip ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>
          ))}
        </div>
        {sorted.map(r=>(
          <div key={r.id} className={`list-row ${active.id===r.id?'selected':''}`} onClick={()=>setActive(r)}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:11,fontWeight:700,color:'var(--wine)'}}>누적 {r.count}건</span>
              <span className={`badge ${r.status==='완료'?'badge-approved':r.status==='처리중'?'badge-pending':'badge-rejected'}`}>{r.status}</span>
            </div>
            <div style={{fontSize:13,fontWeight:600}}>{r.title}</div>
            <div style={{fontSize:11,color:'var(--text-sec)',marginTop:2}}>{r.target} · {r.category}</div>
          </div>
        ))}
      </div>

      <div className="card detail-panel" style={{flex:1,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
          <div>
            <h3 style={{fontSize:17,fontWeight:700,margin:'0 0 6px'}}>{active.title}</h3>
            <div style={{fontSize:12,color:'var(--text-sec)'}}>{active.target} · 신고 사유: {active.category} · 신고자: {active.reporter}</div>
          </div>
          <span className={`badge ${active.status==='완료'?'badge-approved':active.status==='처리중'?'badge-pending':'badge-rejected'}`}>{active.status}</span>
        </div>

        <div style={{border:'1px solid var(--border)',borderRadius:8,padding:18,background:'var(--bg)',marginBottom:20,fontSize:13,color:'var(--text-sec)'}}>
          신고 누적 {active.count}건 — 자동 분류 사유: {active.category}
        </div>

        <div style={{display:'flex',gap:10,marginBottom:20}}>
          <button className="btn-ghost" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setStatus(active.id,'처리중')}>처리중으로 변경</button>
          <button className="btn-primary" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setStatus(active.id,'완료')}>처리 완료</button>
          <button className="btn-outline" style={{padding:'9px 16px',fontSize:13}} onClick={hideContent}>콘텐츠 숨김 처리</button>
        </div>

        <div style={{paddingTop:16,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--text-sec)',marginBottom:10}}>처리 이력 로그</div>
          <div style={{fontSize:12,color:'var(--text-sec)',marginBottom:6}}>신고 접수 — 자동 분류 완료</div>
          <div style={{fontSize:12,color:'var(--text-sec)'}}>현재 상태: {active.status}</div>
        </div>
      </div>
    </div>
  );
}

function MeetupManagementScreen({toast}){
  const [meetups, setMeetups] = useState(MEETUPS.map(m=>({...m, applicants:[
    {id:1,name:'김서연',status:'승인'},{id:2,name:'이하늘',status:'승인'},{id:3,name:'박도윤',status:'대기'},
  ]})));
  const [active, setActive] = useState(null);
  const [showAdd, setShowAdd] = useState(false);

  function approveApplicant(mid, aid){
    setMeetups(meetups.map(m=> m.id===mid ? {...m, applicants:m.applicants.map(a=>a.id===aid?{...a,status:'승인'}:a)} : m));
    toast('신청자가 승인 처리되었습니다.');
  }

  return (
    <div style={{padding:'28px',width:'100%'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <h3 style={{fontSize:18,fontWeight:700,margin:0}}>모임 및 일정 관리</h3>
        <button className="btn-primary" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setShowAdd(true)}><Icon name="plus" size={14} style={{marginRight:4}}/>일정 등록</button>
      </div>

      <table style={{width:'100%',borderCollapse:'collapse',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8}}>
        <thead><tr><th>모임명</th><th>일정</th><th>정원</th><th>신청 현황</th><th></th></tr></thead>
        <tbody>
          {meetups.map(m=>(
            <tr key={m.id} style={{cursor:'pointer'}} onClick={()=>setActive(m)}>
              <td style={{fontWeight:600}}>{m.title}</td>
              <td>{m.date}</td>
              <td>{m.capacity}명</td>
              <td>{m.applied}/{m.capacity}</td>
              <td><button className="btn-ghost" style={{padding:'6px 12px',fontSize:12}} onClick={(e)=>{e.stopPropagation();setActive(m);}}>신청자 보기</button></td>
            </tr>
          ))}
        </tbody>
      </table>

      {active && (
        <div className="modal-overlay" onClick={()=>setActive(null)}>
          <div className="modal-body" style={{width:520,padding:24}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <h3 style={{fontSize:17,fontWeight:700,margin:0}}>{active.title} — 신청자 관리</h3>
              <button onClick={()=>setActive(null)} style={{background:'none',border:'none'}}><Icon name="x" size={18}/></button>
            </div>
            {active.applicants.map(a=>(
              <div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <img src={avatarUrl(a.name)} style={{width:28,height:28,borderRadius:'50%'}} />
                  <span style={{fontSize:13,fontWeight:600}}>{a.name}</span>
                </div>
                {a.status==='대기' ? (
                  <button className="btn-outline" style={{padding:'6px 12px',fontSize:12}} onClick={()=>approveApplicant(active.id,a.id)}>승인</button>
                ) : (
                  <span className="badge badge-approved">승인됨</span>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={()=>setShowAdd(false)}>
          <div className="modal-body" style={{width:440,padding:24}} onClick={e=>e.stopPropagation()}>
            <h3 style={{fontSize:16,fontWeight:700,margin:'0 0 14px'}}>새 일정 등록</h3>
            <input placeholder="모임명" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid var(--border)',marginBottom:10,fontSize:13,outline:'none'}} />
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
              <input type="date" style={{padding:'10px 12px',borderRadius:8,border:'1px solid var(--border)',fontSize:13}} />
              <input type="number" placeholder="정원" style={{padding:'10px 12px',borderRadius:8,border:'1px solid var(--border)',fontSize:13}} />
            </div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
              <button className="btn-ghost" style={{padding:'9px 16px',fontSize:13}} onClick={()=>setShowAdd(false)}>취소</button>
              <button className="btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={()=>{setShowAdd(false); toast('새 일정이 등록되었습니다.');}}>등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MemberManagementScreen({toast}){
  const [members, setMembers] = useState(MEMBERS);
  const [q, setQ] = useState('');
  const filtered = members.filter(m=> m.name.includes(q) || m.email.includes(q));

  return (
    <div style={{padding:'28px',width:'100%'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <h3 style={{fontSize:18,fontWeight:700,margin:0}}>회원 관리</h3>
        <input placeholder="이름 또는 이메일 검색" value={q} onChange={e=>setQ(e.target.value)} style={{padding:'9px 14px',borderRadius:8,border:'1px solid var(--border)',fontSize:13,width:240,outline:'none'}} />
      </div>
      <table style={{width:'100%',borderCollapse:'collapse',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8}}>
        <thead><tr><th>이름</th><th>이메일</th><th>등급</th><th>상태</th><th>가입일</th><th></th></tr></thead>
        <tbody>
          {filtered.map(m=>(
            <tr key={m.id}>
              <td style={{fontWeight:600}}>{m.name}</td>
              <td style={{color:'var(--text-sec)'}}>{m.email}</td>
              <td>{m.grade}</td>
              <td><span className={`badge ${m.status==='인증완료'?'badge-approved':m.status==='심사중'?'badge-pending':'badge-rejected'}`}>{m.status}</span></td>
              <td>{m.joined}</td>
              <td><button className="btn-ghost" style={{padding:'6px 12px',fontSize:12}} onClick={()=>toast(`${m.name} 회원 정보를 확인합니다.`)}>상세</button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg)=> setToastMsg(msg);

  const titles = {
    'main':'대시보드', 'verification-review':'자격인증 심사 관리', 'content-moderation':'콘텐츠 및 신고 관리',
    'meetup-management':'모임 및 신청자 관리', 'member-management':'회원 관리'
  };

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex'}}>
      <Sidebar active={screen} onNav={setScreen} />
      <div className="main-wrap">
        <TopBar title={titles[screen]} onSearch={()=>{}} onOpenNotif={()=>toast('신규 알림 3건 — 미승인 자격증빙 3건이 대기 중입니다.')} />
        {screen==='main' && <DashboardScreen onNav={setScreen} toast={toast} />}
        {screen==='verification-review' && <VerificationReviewScreen toast={toast} />}
        {screen==='content-moderation' && <ContentModerationScreen toast={toast} />}
        {screen==='meetup-management' && <MeetupManagementScreen toast={toast} />}
        {screen==='member-management' && <MemberManagementScreen toast={toast} />}
      </div>
      {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
