<style>
:root{
  --bg:#fff8f1;
  --surface:#ffffff;
  --primary:#fa5d00;
  --primary-dark:#d84f00;
  --accent:#1ef6da;
  --text:#1d1e1c;
  --text-secondary:#615f5c;
  --text-tertiary:#8e8b87;
  --border:#c0bbb6;
  --divider:#e7ded4;
  --marigold:#fee3b5;
  --radius-card:20px;
  --radius-input:16px;
  --radius-tag:999px;
  --shadow-sm:0 1px 4px 0 rgba(0,0,0,.14);
  --shadow-lg:6px 4px 24px 0 rgba(250,109,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes sparkDraw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

.app{display:flex;min-height:100vh}

/* ---- sidebar ---- */
.sidebar{width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--divider);display:flex;flex-direction:column;padding:20px 14px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.sidebar-brand-mark{width:36px;height:36px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow-lg)}
.sidebar-brand-name{font-weight:700;font-size:16px;letter-spacing:-.2px}
.sidebar-brand-env{font-size:11px;color:var(--text-tertiary);font-weight:600;margin-top:1px}
.sidebar-section{margin-bottom:18px}
.sidebar-section-title{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--text-secondary);margin-bottom:2px;transition:background .15s,color .15s;text-align:left;width:100%}
.sidebar-link:hover{background:var(--marigold)}
.sidebar-link.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:var(--shadow-lg)}
.sidebar-link i{font-size:17px;width:18px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px 10px;border-top:1px solid var(--divider)}
.sidebar-user{display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:34px;height:34px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--primary-dark)}
.sidebar-user-name{font-size:13px;font-weight:600}
.sidebar-user-role{font-size:11px;color:var(--text-tertiary)}
.sidebar-logout{margin-left:auto;color:var(--text-tertiary);font-size:16px}

/* ---- main ---- */
.main{flex:1;min-width:0;padding:28px 36px 60px;animation:fadeSlideUp .35s ease}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.topbar-search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-input);padding:9px 14px}
.topbar-search input{border:none;outline:none;background:transparent;font-size:13px;width:100%;color:var(--text)}
.topbar-search i{color:var(--text-tertiary)}
.topbar-spacer{flex:1}
.topbar-icon-btn{position:relative;width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary)}
.topbar-icon-btn:hover{background:var(--marigold)}
.notif-dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulseDot 2s infinite}

.page-header{margin-bottom:20px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:0}
.page-header{position:relative}
.hero-wash{position:absolute;top:-40px;left:-40px;width:420px;height:220px;background:radial-gradient(ellipse at top left,rgba(250,93,0,.22),rgba(254,227,181,.35) 45%,rgba(255,248,241,0) 75%);filter:blur(2px);pointer-events:none;z-index:0}
.page-actions{display:flex;gap:10px}
.btn-secondary{padding:10px 16px;border-radius:var(--radius-input);background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.btn-secondary:hover{background:var(--marigold)}
.btn-primary{padding:10px 18px;border-radius:var(--radius-input);background:var(--primary);color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:6px}
.btn-primary:hover{background:var(--primary-dark)}
.page-meta{font-size:12px;color:var(--text-tertiary);margin-top:6px}

/* ---- KPI stat row ---- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius-card);padding:22px 22px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.spark-path{stroke-dasharray:160;stroke-dashoffset:160;animation:sparkDraw 1.1s ease forwards}
.stat-label{font-size:12px;font-weight:600;color:var(--text-tertiary);margin-bottom:10px}
.stat-value{font-size:32px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.stat-delta{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.stat-delta.positive{color:#1a9e6b}
.stat-delta.negative{color:#e0483f}
.stat-sparkline{position:absolute;right:16px;bottom:14px;width:72px;height:28px}

/* ---- tab bar ---- */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--divider);margin-bottom:14px}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.data-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.data-toolbar .search{flex:1;min-width:180px;max-width:280px;border:1px solid var(--border);border-radius:var(--radius-input);padding:8px 12px;font-size:13px;outline:none}
.filter-chip{padding:7px 13px;border-radius:var(--radius-tag);background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.export-btn{margin-left:auto;padding:8px 14px;border-radius:var(--radius-input);border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.export-btn:hover{background:var(--marigold)}

/* ---- master-detail split ---- */
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.data-table-wrap{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);overflow:hidden}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--divider)}
.data-table tbody tr{border-bottom:1px solid var(--divider);cursor:pointer;transition:background .12s}
.data-table tbody tr:last-child{border-bottom:none}
.data-table tbody tr:hover{background:var(--marigold)}
.data-table tbody tr.selected{background:#fdece0}
.data-table td{padding:12px 16px;color:var(--text)}
.cell-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
.badge.success{background:#e2f6ec;color:#1a9e6b}
.badge.warn{background:#fff2df;color:#c07800}
.badge.danger{background:#fde5e2;color:#e0483f}
.badge.neutral{background:#f1eee9;color:var(--text-secondary)}

.detail-panel{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:24px;min-height:360px;animation:fadeSlideUp .3s ease}
.detail-panel.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-tertiary);gap:10px;text-align:center;padding:60px 24px}
.detail-panel.empty i{font-size:32px}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.detail-avatar{width:44px;height:44px;border-radius:14px;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--primary-dark);flex-shrink:0}
.detail-title{font-size:17px;font-weight:700}
.detail-sub{font-size:12.5px;color:var(--text-tertiary);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--text-tertiary)}
.field input,.field select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-input);font-size:13px;background:#fffdfb;color:var(--text)}
.field input:disabled{background:#f6f1ea;color:var(--text-secondary)}
.detail-actions{display:flex;gap:10px;margin-top:20px}
.detail-section-title{font-size:12.5px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
.check-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);font-size:13px}
.check-row:last-child{border-bottom:none}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--divider);position:relative;flex-shrink:0}
.toggle.on{background:var(--primary)}
.toggle-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.toggle.on .toggle-dot{transform:translateX(16px)}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;border-bottom:1px dashed var(--divider)}
.history-row:last-child{border-bottom:none}

.upload-drop{border:1.5px dashed var(--border);border-radius:var(--radius-input);padding:16px;text-align:center;font-size:12.5px;color:var(--text-tertiary);margin-bottom:14px}
.upload-drop i{font-size:20px;display:block;margin-bottom:6px;color:var(--primary)}

.code-block{background:#211f1a;color:#f4ead9;border-radius:14px;padding:16px;font-family:'SFMono-Regular',Menlo,monospace;font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre}
.code-key{color:#ffb27a}
.code-str{color:#8fe3d0}

.list-rail-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--divider);cursor:pointer}
.list-rail-item:hover{background:var(--marigold)}
.list-rail-item.selected{background:#fdece0}
.list-rail-icon{width:38px;height:38px;border-radius:11px;background:var(--marigold);display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-size:16px;flex-shrink:0}
.list-rail-name{font-size:13.5px;font-weight:600}
.list-rail-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
.list-rail-tags{margin-left:auto;display:flex;gap:5px}
.tag-mini{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1eee9;color:var(--text-secondary)}

.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:var(--text);color:#fff8f1;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px}
.toast i{color:#4ade80}
</style>

const {useState,useEffect,useRef} = React;

function Sparkline({points,color}){
  const w=72,h=28;
  const max=Math.max(...points), min=Math.min(...points);
  const norm=points.map((p,i)=>{
    const x=(i/(points.length-1))*w;
    const y=h-((p-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <polyline className="spark-path" points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function useToast(){
  const [toasts,setToasts]=useState([]);
  const push=(msg)=>{
    const id=Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  };
  return {toasts,push};
}

              <div className="list-rail-icon"><i className="ti ti-building-store"></i></div>
              <div>
                <div className="list-rail-name">{f.name}</div>
                <div className="list-rail-sub">{f.van} · {f.catId}</div>
              </div>
              <div className="list-rail-tags"><span className={"badge "+f.statusBadge}>{f.status}</span></div>
            </div>
          ))}
        </div>
        <div className="detail-panel">
          <div className="detail-head">
            <div className="detail-avatar"><i className="ti ti-router"></i></div>
            <div>
              <div className="detail-title">{selected.name}</div>
              <div className="detail-sub">{selected.addr}</div>
            </div>
          </div>
          <div className="detail-section-title">가맹점 사업자정보</div>
          <div className="detail-grid">
            <div className="field"><label>사업자번호</label><input disabled value={selected.bizNo}/></div>
            <div className="field"><label>담당자</label><input disabled value={selected.manager}/></div>
            <div className="field"><label>연락처</label><input disabled value={selected.phone}/></div>
            <div className="field"><label>상태</label><input disabled value={selected.status}/></div>
          </div>
          <div className="detail-section-title">리더기(TL3800R) 통신설정</div>
          <div className="detail-grid">
            <div className="field"><label>VAN사</label>
              <select defaultValue={selected.van}><option>한국VAN</option><option>코밴시스템</option><option>이니밴</option></select>
            </div>
            <div className="field"><label>CAT ID</label><input defaultValue={selected.catId}/></div>
            <div className="field"><label>리더기 PORT/속도</label><input defaultValue={selected.port}/></div>
            <div className="field"><label>서명패드 PORT/속도</label><input defaultValue={selected.padPort}/></div>
          </div>
          <div className="detail-actions">
            <button className="btn-primary" onClick={()=>toast.push(multi?'선택된 가맹점 전체에 설정값을 일괄 배포합니다':`${selected.name}에 설정값을 배포합니다`)}><i className="ti ti-send"></i>{multi?'일괄 배포':'설정 배포'}</button>
            <button className="btn-secondary" onClick={()=>toast.push('통신설정 변경사항을 저장합니다')}><i className="ti ti-device-floppy"></i>저장</button>
          </div>
          <div className="detail-section-title">배포 이력</div>
          {DEPLOY_HISTORY.map(h=>(
            <div className="history-row" key={h.ts}>
              <span>{h.ts} · {h.target}</span>
              <span className={"badge "+h.badge}>{h.result}</span>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

function ApiScreen({toast}){
  const [selected,setSelected]=useState(APIS[0]);
  return (
    <React.Fragment>
      <div className="page-header">
        <div className="page-title-row">
          <h1 className="page-title">Pay Vcat 연동 Download API</h1>
          <div className="page-actions">
            <button className="btn-secondary" onClick={()=>toast.push('API 인증키를 재발급합니다')}><i className="ti ti-key"></i>인증키 재발급</button>
            <button className="btn-primary" onClick={()=>toast.push('프로토콜 문서를 다운로드합니다')}><i className="ti ti-download"></i>프로토콜 문서</button>
          </div>
        </div>
        <div className="page-meta">등록 엔드포인트 2종 · 최근 24시간 호출 1,204건</div>
      </div>
      <div className="split">
        <div className="data-table-wrap">
          {APIS.map(a=>(
            <div key={a.id} className={"list-rail-item"+(selected.id===a.id?" selected":"")} onClick={()=>setSelected(a)}>
              <div className="list-rail-icon"><i className="ti ti-api"></i></div>
              <div>
                <div className="list-rail-name">{a.name}</div>
                <div className="list-rail-sub">{a.method} {a.path}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="detail-panel">
          <div className="detail-head">
            <div className="detail-avatar"><i className="ti ti-plug-connected"></i></div>
            <div>
              <div className="detail-title">{selected.name}</div>
              <div className="detail-sub">{selected.desc}</div>
            </div>
          </div>
          <div className="detail-section-title">요청 스펙</div>
          <div className="code-block">{selected.method} {selected.path}
Authorization: <span className="code-key">Bearer</span> <span className="code-str">{"{ACCESS_TOKEN}"}</span>
{"{"}
  <span className="code-key">"serialNo"</span>: <span className="code-str">"TL38-2026-00981"</span>,
  <span className="code-key">"catId"</span>: <span className="code-str">"CAT-77281"</span>
{"}"}</div>
          <div className="detail-section-title">최근 호출 로그</div>
          {API_LOGS.map((l,i)=>(
            <div className="history-row" key={i}>
              <span>{l.ts} · {l.serial}</span>
              <span className={"badge "+(l.status===200?"success":l.status===401?"warn":"danger")}>{l.status}</span>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

function App(){
  const [screen,setScreen]=useState('main');
  const toast=useToast();
  return (
    <div className="app">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main" key={screen}>
        <Topbar toast={toast}/>
        {screen==='main' && <MainScreen toast={toast}/>}
        {screen==='product' && <ProductScreen toast={toast}/>}
        {screen==='franchise' && <FranchiseScreen toast={toast}/>}
        {screen==='api' && <ApiScreen toast={toast}/>}
      </div>
      <div className="toast-wrap">
        {toast.toasts.map(t=>(
          <div className="toast" key={t.id}><i className="ti ti-circle-check"></i>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
