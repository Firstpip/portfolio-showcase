<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드단말기 멀티 VAN 통합관제 허브 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/dist/index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#ffffff;
  --surface:#f4f4f6;
  --tile:#ffffff;
  --dark:#111214;
  --dark-2:#1c1e22;
  --primary:#5683da;
  --primary-dark:#3f68c0;
  --accent:#ff8964;
  --text:#090a0c;
  --text-secondary:#5b5d64;
  --text-tertiary:#95979e;
  --border:#e5e5e7;
  --radius-pill:9999px;
  --radius-tile:20px;
  --radius-tile-sm:16px;
  --shadow-tile:0 1px 2px rgba(9,10,12,.06),0 8px 20px rgba(9,10,12,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

@keyframes auroraDrift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes listItemIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(86,131,218,.45)}70%{box-shadow:0 0 0 8px rgba(86,131,218,0)}100%{box-shadow:0 0 0 0 rgba(86,131,218,0)}}

.shell{max-width:1360px;margin:0 auto;padding:0 32px 64px}

/* ---- topnav ---- */
.topbar{display:flex;align-items:center;gap:22px;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.2px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.nav-tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:var(--radius-pill)}
.nav-tab{padding:9px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;color:var(--text-secondary)}
.nav-tab.active{background:var(--dark);color:#fff}
.topbar-spacer{flex:1}
.live-pill{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-pill);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;animation:ringPulse 2s infinite}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

.page-lead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-eyebrow{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.page-title{font-size:32px;font-weight:700;letter-spacing:-.6px;margin:0}
.page-actions{display:flex;gap:10px}
.pill-btn{padding:10px 18px;border-radius:var(--radius-pill);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.pill-btn:hover{background:var(--border)}
.pill-btn.primary{background:var(--dark);color:#fff}
.pill-btn.primary:hover{background:#000}

/* ---- bento grid ---- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;animation:fadeSlideUp .35s ease}
.tile{border-radius:var(--radius-tile);box-shadow:var(--shadow-tile);overflow:hidden;position:relative}
.tile.feature{grid-column:span 2;grid-row:span 2;background:linear-gradient(120deg,#0c0d10,#171a2e 35%,#2a2450 60%,#3a2a3a 80%);background-size:220% 220%;animation:auroraDrift 12s ease infinite;color:#fff;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.tile.feature .tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile.feature h2{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-.2px}
.tile.feature p{font-size:12.5px;color:rgba(255,255,255,.62);margin:0}
.tile.feature .big-number{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:14px}
.tile.feature .chart-wrap{margin-top:auto}
.tile.metric{background:var(--tile);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;animation:popIn .3s ease backwards;transition:transform .18s ease,box-shadow .18s ease}
.tile.metric:hover{transform:scale(1.03);box-shadow:var(--shadow-tile)}
.tile.metric .num{font-size:32px;font-weight:700;letter-spacing:-.5px}
.tile.metric .lbl{font-size:12px;color:var(--text-tertiary);font-weight:600;margin-top:2px}
.tile.metric .metric-icon{width:34px;height:34px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary);margin-bottom:10px}
.tile.metric .metric-delta{font-size:11.5px;font-weight:700;margin-top:8px}
.tile.metric .metric-delta.up{color:#1f9d63}
.tile.metric .metric-delta.down{color:var(--accent)}
.tile.wide{grid-column:span 2;background:var(--tile);border:1px solid var(--border);padding:20px}
.tile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tile-head h3{font-size:14px;font-weight:700;margin:0}
.tile-head .see-all{font-size:12px;font-weight:600;color:var(--primary)}
.wide-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;animation:listItemIn .3s ease backwards}
.wide-row:last-child{border-bottom:none}
.wide-row .wr-icon{width:30px;height:30px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px;flex-shrink:0}
.wide-row .wr-main{flex:1;min-width:0}
.wide-row .wr-title{font-weight:600}
.wide-row .wr-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:1px}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill)}
.chip.success{background:#e5f6ec;color:#1f9d63}
.chip.warn{background:#fff1e6;color:#c26a2b}
.chip.danger{background:#fdece8;color:#d84b3b}
.chip.neutral{background:var(--surface);color:var(--text-secondary)}

.tile.list{background:var(--tile);border:1px solid var(--border);padding:20px}
.tile.form{background:var(--surface);border:1px solid var(--border);padding:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:var(--text-tertiary)}
.field input,.field select{padding:9px 12px;border:1px solid var(--border);border-radius:12px;font-size:13px;background:#fff}

.van-card{background:var(--tile);border:1px solid var(--border);border-radius:var(--radius-tile-sm);padding:16px}
.van-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.van-card-head strong{font-size:13.5px}
.van-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:8px}
.van-bar-fill{height:100%;border-radius:99px}

.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px}
.toast i{color:var(--accent)}
</style>
</head>
<body data-archetype="bento-grid">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

function useToast(){
  const [toasts,setToasts]=useState([]);
  const push=(msg)=>{
    const id=Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  };
  return {toasts,push};
}

function AuroraChart({points}){
  const w=520,h=140;
  const max=Math.max(...points),min=Math.min(...points);
  const norm=points.map((p,i)=>{
    const x=(i/(points.length-1))*w;
    const y=h-((p-min)/(max-min||1))*(h-20)-6;
    return [x,y];
  });
  const line="M"+norm.map(p=>p.join(',')).join(' L');
  const area=line+` L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="110" preserveAspectRatio="none">
      <defs>
        <linearGradient id="auroraFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#5683da" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#5683da" stopOpacity="0"/>
        </linearGradient>
        <linearGradient id="auroraStroke" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#5683da"/>
          <stop offset="100%" stopColor="#ff8964"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#auroraFill)"/>
      <path d={line} fill="none" stroke="url(#auroraStroke)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Tabs({items,active,onChange}){
  return (
    <div className="nav-tabs">
      {items.map(it=>(
        <button key={it.key} className={"nav-tab"+(active===it.key?" active":"")} onClick={()=>onChange(it.key)}>{it.label}</button>
      ))}
    </div>
  );
}

function MetricTile({icon,num,lbl,delta,up,i}){
  return (
    <div className="tile metric" style={{animationDelay:(i*0.05)+'s',borderRadius:'22px'}}>
      <div>
        <div className="metric-icon"><i className={"ph "+icon}></i></div>
        <div className="num">{num}</div>
        <div className="lbl">{lbl}</div>
      </div>
      {delta && <div className={"metric-delta "+(up?"up":"down")}>{delta}</div>}
    </div>
  );
}

function MainScreen({toast}){
  const rows=[
    {icon:"ph-map-pin",title:"서울/경기 권역",sub:"단말기 1,842대 · 정상 98.4%",chip:"정상",badge:"success"},
    {icon:"ph-map-pin",title:"영남 권역",sub:"단말기 1,120대 · 정상 96.1%",chip:"주의",badge:"warn"},
    {icon:"ph-map-pin",title:"호남 권역",sub:"단말기 640대 · 정상 99.0%",chip:"정상",badge:"success"},
    {icon:"ph-map-pin",title:"충청/강원 권역",sub:"단말기 410대 · 정상 97.7%",chip:"정상",badge:"success"},
  ];
  return (
    <div className="bento">
      <div className="tile feature">
        <div className="tile-top">
          <div>
            <h2>전국 단말기 통신 상태</h2>
            <p>VAN사 연동 성공률 실시간 추이</p>
          </div>
          <span className="chip success">정상 운영</span>
        </div>
        <div className="big-number">99.2%</div>
        <div className="chart-wrap"><AuroraChart points={[92,94,93,96,95,97,98,97,99,98,99,99.2]}/></div>
      </div>
      <MetricTile icon="ph-devices" num="4,012" lbl="온라인 단말기" delta="+38 오늘" up={true} i={0}/>
      <MetricTile icon="ph-warning-circle" num="14" lbl="연동 지연 단말기" delta="-6 전일 대비" up={true} i={1}/>
      <MetricTile icon="ph-timer" num="182ms" lbl="평균 응답 지연" delta="+9ms 전일 대비" up={false} i={2}/>
      <MetricTile icon="ph-bell-ringing" num="7" lbl="오늘 발생 알림" delta="+2 전일 대비" up={false} i={3}/>
      <div className="tile wide">
        <div className="tile-head"><h3>권역별 단말기 상태</h3><button className="see-all" onClick={()=>toast.push('권역별 상세 리포트를 엽니다')}>전체 보기</button></div>
        {rows.map((r,i)=>(
          <div className="wide-row" key={r.title} style={{animationDelay:(i*0.06)+'s'}}>
            <div className="wr-icon"><i className={"ph "+r.icon}></i></div>
            <div className="wr-main"><div className="wr-title">{r.title}</div><div className="wr-sub">{r.sub}</div></div>
            <span className={"chip "+r.badge}>{r.chip}</span>
          </div>
        ))}
      </div>
      <div className="tile list">
        <div className="tile-head"><h3>VAN사 요약</h3></div>
        {[["한국VAN","#5683da",92],["코밴시스템","#ff8964",78],["이니밴","#9b8cf2",65]].map(([name,color,pct])=>(
          <div key={name} style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,fontWeight:600}}><span>{name}</span><span>{pct}%</span></div>
            <div className="van-bar"><div className="van-bar-fill" style={{width:pct+'%',background:color}}></div></div>
          </div>
        ))}
        <button className="pill-btn primary" style={{width:'100%',justifyContent:'center',marginTop:6}} onClick={()=>toast.push('VAN사 요약 리포트를 내보냅니다')}><i className="ph ph-export"></i>리포트 내보내기</button>
      </div>
    </div>
  );
}

function VanScreen({toast}){
  const vans=[
    {name:"한국VAN",status:"정상",badge:"success",latency:"142ms",fail:"0.3%",share:92,color:"#5683da"},
    {name:"코밴시스템",status:"지연",badge:"warn",latency:"310ms",fail:"1.8%",share:78,color:"#ff8964"},
    {name:"이니밴",status:"정상",badge:"success",latency:"165ms",fail:"0.5%",share:65,color:"#9b8cf2"},
  ];
  return (
    <div className="bento">
      <div className="tile feature">
        <div className="tile-top">
          <div><h2>어댑터 헬스체크</h2><p>VAN사별 프로토콜 어댑터 응답 지연 추이</p></div>
          <span className="chip warn">1건 지연 감지</span>
        </div>
        <div className="big-node" style={{display:'flex',gap:22,marginTop:14}}>
          <div><div className="big-number" style={{fontSize:34}}>3</div><p>연동 VAN사</p></div>
          <div><div className="big-number" style={{fontSize:34}}>206ms</div><p>평균 응답 지연</p></div>
        </div>
        <div className="chart-wrap"><AuroraChart points={[150,160,142,180,310,240,206]}/></div>
      </div>
      <MetricTile icon="ph-plugs-connected" num="3" lbl="등록 어댑터" i={0}/>
      <MetricTile icon="ph-chart-line-up" num="99.1%" lbl="전체 연동 성공률" delta="+0.4%p" up={true} i={1}/>
      {vans.map((v,i)=>(
        <div className="van-card" key={v.name}>
          <div className="van-card-head"><strong>{v.name}</strong><span className={"chip "+v.badge}>{v.status}</span></div>
          <div style={{fontSize:12,color:'var(--text-tertiary)'}}>응답 지연 {v.latency} · 실패율 {v.fail}</div>
          <div className="van-bar"><div className="van-bar-fill" style={{width:v.share+'%',background:v.color}}></div></div>
          <button className="pill-btn" style={{marginTop:10,fontSize:11.5,padding:'6px 12px'}} onClick={()=>toast.push(`${v.name} 어댑터 상세 로그를 엽니다`)}>상세 로그</button>
        </div>
      ))}
      <div className="tile wide">
        <div className="tile-head"><h3>신규 VAN사 어댑터 등록</h3></div>
        <div className="field"><label>VAN사명</label><input placeholder="예: 스마일페이먼츠"/></div>
        <div className="field"><label>프로토콜 엔드포인트</label><input placeholder="https://van-adapter.example/api"/></div>
        <button className="pill-btn primary" onClick={()=>toast.push('신규 VAN사 어댑터 등록을 요청합니다')}><i className="ph ph-plug"></i>어댑터 등록 요청</button>
      </div>
    </div>
  );
}

function AuditScreen({toast}){
  const logs=[
    {icon:"ph-pencil-simple",title:"리더기 통신설정 변경",sub:"명동떡볶이 본점 · 김도현",badge:"neutral",chip:"변경"},
    {icon:"ph-user-plus",title:"신규 사용자 등록",sub:"인천남동 Agent · 정우성",badge:"success",chip:"생성"},
    {icon:"ph-trash",title:"가맹점 정보 삭제",sub:"하남산단 구내식당 · 이서연",badge:"danger",chip:"삭제"},
    {icon:"ph-shield-check",title:"PAGE 권한 변경",sub:"광주광산 대리점 · 한지민",badge:"neutral",chip:"변경"},
    {icon:"ph-key",title:"비밀번호 재발급",sub:"최민아 계정",badge:"warn",chip:"보안"},
  ];
  const [range,setRange]=useState('7d');
  return (
    <div className="bento">
      <div className="tile feature">
        <div className="tile-top">
          <div><h2>변경 이력 타임라인</h2><p>전 화면 CRUD 이벤트 발생 추이</p></div>
          <span className="chip neutral">최근 {range==='7d'?'7일':'30일'}</span>
        </div>
        <div className="big-number">318건</div>
        <div className="chart-wrap"><AuroraChart points={[20,28,24,32,30,40,38,44,41,48,45,52]}/></div>
      </div>
      <MetricTile icon="ph-clock-counter-clockwise" num="318" lbl="총 변경 이벤트" i={0}/>
      <MetricTile icon="ph-users-three" num="9" lbl="활동 관리자 수" i={1}/>
      <div className="tile wide">
        <div className="tile-head">
          <h3>최근 변경 로그</h3>
          <div style={{display:'flex',gap:6}}>
            <button className={"pill-btn"+(range==='7d'?" primary":"")} style={{fontSize:11.5,padding:'6px 12px'}} onClick={()=>{setRange('7d');toast.push('최근 7일 로그로 필터링합니다')}}>7일</button>
            <button className={"pill-btn"+(range==='30d'?" primary":"")} style={{fontSize:11.5,padding:'6px 12px'}} onClick={()=>{setRange('30d');toast.push('최근 30일 로그로 필터링합니다')}}>30일</button>
          </div>
        </div>
        {logs.map((l,i)=>(
          <div className="wide-row" key={l.title} style={{animationDelay:(i*0.06)+'s'}}>
            <div className="wr-icon"><i className={"ph "+l.icon}></i></div>
            <div className="wr-main"><div className="wr-title">{l.title}</div><div className="wr-sub">{l.sub}</div></div>
            <span className={"chip "+l.badge}>{l.chip}</span>
          </div>
        ))}
      </div>
      <div className="tile list">
        <div className="tile-head"><h3>조직별 변경 비중</h3></div>
        {[["본사","#5683da",38],["대리점","#ff8964",41],["Agent","#9b8cf2",21]].map(([name,color,pct])=>(
          <div key={name} style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,fontWeight:600}}><span>{name}</span><span>{pct}%</span></div>
            <div className="van-bar"><div className="van-bar-fill" style={{width:pct+'%',background:color}}></div></div>
          </div>
        ))}
        <button className="pill-btn" style={{width:'100%',justifyContent:'center',marginTop:6}} onClick={()=>toast.push('감사로그 전체를 CSV로 내보냅니다')}><i className="ph ph-download-simple"></i>CSV 내보내기</button>
      </div>
    </div>
  );
}

function AlertsScreen({toast}){
  const events=[
    {icon:"ph-siren",title:"연속 실패 3회 초과 — 성서마트24",sub:"규칙: 리더기 연동 실패 임계치",badge:"danger",chip:"발송완료"},
    {icon:"ph-timer",title:"응답 지연 300ms 초과 — 코밴시스템",sub:"규칙: VAN 어댑터 지연 임계치",badge:"warn",chip:"발송완료"},
    {icon:"ph-check-circle",title:"펌웨어 배포 성공 — TL3800R 84대",sub:"규칙: 배포 완료 알림",badge:"success",chip:"발송완료"},
  ];
  return (
    <div className="bento">
      <div className="tile feature">
        <div className="tile-top">
          <div><h2>활성 알림 규칙 요약</h2><p>임계치 기반 규칙 발동 추이</p></div>
          <span className="chip warn">규칙 6개 활성</span>
        </div>
        <div className="big-number">21건</div>
        <div className="chart-wrap"><AuroraChart points={[4,6,3,8,7,9,6,10,8,12,9,21]}/></div>
      </div>
      <MetricTile icon="ph-list-checks" num="6" lbl="활성 알림 규칙" i={0}/>
      <MetricTile icon="ph-paper-plane-tilt" num="98.6%" lbl="발송 성공률" delta="+0.2%p" up={true} i={1}/>
      <div className="tile wide">
        <div className="tile-head"><h3>최근 이벤트 로그</h3><button className="see-all" onClick={()=>toast.push('이벤트 로그 전체 화면을 엽니다')}>전체 보기</button></div>
        {events.map((e,i)=>(
          <div className="wide-row" key={e.title} style={{animationDelay:(i*0.06)+'s'}}>
            <div className="wr-icon"><i className={"ph "+e.icon}></i></div>
            <div className="wr-main"><div className="wr-title">{e.title}</div><div className="wr-sub">{e.sub}</div></div>
            <span className={"chip "+e.badge}>{e.chip}</span>
          </div>
        ))}
      </div>
      <div className="tile form">
        <div className="tile-head"><h3>알림 규칙 등록</h3></div>
        <div className="field"><label>규칙명</label><input placeholder="예: 연속 실패 5회 초과"/></div>
        <div className="field"><label>임계치 조건</label>
          <select><option>연속 실패 N회</option><option>응답 지연 N ms 초과</option><option>배포 실패율 N% 초과</option></select>
        </div>
        <div className="field"><label>발송 채널</label>
          <select><option>SMS + 이메일</option><option>이메일만</option><option>SMS만</option></select>
        </div>
        <button className="pill-btn primary" onClick={()=>toast.push('새 알림 규칙을 등록합니다')}><i className="ph ph-plus"></i>규칙 등록</button>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('main');
  const toast=useToast();
  const tabs=[
    {key:"main",label:"대시보드"},
    {key:"van",label:"다중 VAN사 연동 확장 관리"},
    {key:"audit",label:"변경이력·감사로그 추적"},
    {key:"alerts",label:"알림·이벤트 규칙 엔진"},
  ];
  const titleMap={
    main:["실시간 운영","전국 단말기·VAN 연동 통합관제 허브"],
    van:["연동 확장","다중 VAN사 연동 확장 관리"],
    audit:["운영 추적","변경이력·감사로그 추적"],
    alerts:["이벤트 대응","알림·이벤트 규칙 엔진"],
  };
  return (
    <div className="shell">
      <div className="topbar">
        <div className="brand"><div className="brand-mark"><i className="ph ph-broadcast"></i></div>카드넷 옵스허브</div>
        <Tabs items={tabs} active={screen} onChange={setScreen}/>
        <div className="topbar-spacer"></div>
        <div className="live-pill"><span className="live-dot"></span>실시간 연결됨</div>
        <div className="avatar">관</div>
      </div>

      <div className="page-lead" key={screen}>
        <div>
          <div className="page-eyebrow">{titleMap[screen][0]}</div>
          <h1 className="page-title">{titleMap[screen][1]}</h1>
        </div>
        <div className="page-actions">
          <button className="pill-btn" onClick={()=>toast.push('현재 화면 데이터를 새로고침합니다')}><i className="ph ph-arrow-clockwise"></i>새로고침</button>
          <button className="pill-btn primary" onClick={()=>toast.push('현재 화면을 리포트로 내보냅니다')}><i className="ph ph-export"></i>리포트 내보내기</button>
        </div>
      </div>

      {screen==='main' && <MainScreen toast={toast}/>}
      {screen==='van' && <VanScreen toast={toast}/>}
      {screen==='audit' && <AuditScreen toast={toast}/>}
      {screen==='alerts' && <AlertsScreen toast={toast}/>}

      <div className="toast-wrap">
        {toast.toasts.map(t=>(
          <div className="toast" key={t.id}><i className="ph ph-check-circle"></i>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
