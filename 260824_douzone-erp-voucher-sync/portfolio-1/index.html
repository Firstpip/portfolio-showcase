  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}

  @keyframes fillBar{from{width:0%;}to{width:var(--fill-to);}}

  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--surface);border-right:1px solid var(--divider);display:flex;flex-direction:column;z-index:20;}
  .sidebar-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--divider);}
  .sidebar-brand-mark{width:32px;height:32px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .sidebar-brand-text{font-weight:700;font-size:15px;line-height:1.2;}
  .sidebar-brand-sub{font-size:11px;color:var(--text3);margin-top:2px;}
  .env-pill{margin:14px 16px 4px;padding:8px 12px;background:var(--bg);border:1px solid var(--divider);border-radius:10px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;}
  .env-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulseDot 2s infinite;}
  .sidebar-section{padding:14px 12px 4px;}
  .sidebar-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px;}
  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .15s;}
  .sidebar-link:hover{background:var(--bg);}
  .sidebar-link.active{background:#fff1e8;color:var(--primary-dark);font-weight:600;}
  .sidebar-link.active svg{color:var(--primary);}
  .sidebar-link svg{width:16px;height:16px;flex-shrink:0;}
  .sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--divider);font-size:11px;color:var(--text3);}

  .main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);min-height:100vh;padding:28px 32px 60px;}
  .app-shell{display:flex;width:100%;min-height:100vh;}

  .page-header{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:26px;font-weight:700;letter-spacing:.36px;margin:0;}
  .page-actions{display:flex;gap:8px;}
  .page-meta{font-size:12.5px;color:var(--text3);display:flex;align-items:center;gap:8px;}

  .btn{border-radius:var(--radius-btn);padding:10px 18px;font-size:13.5px;font-weight:600;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .15s, transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);}
  .btn-secondary:hover{background:var(--bg);}
  .btn-ghost{background:transparent;color:var(--text2);border:none;padding:8px 10px;}
  .btn-ghost:hover{background:var(--bg);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border-radius:var(--radius-card);padding:20px 22px;box-shadow:var(--shadow-sm);border:1px solid var(--divider);opacity:0;animation:fadeInUp .5s ease forwards;position:relative;overflow:hidden;}

  .stat-card:nth-child(2){animation-delay:.08s;}
  .stat-card:nth-child(3){animation-delay:.14s;}
  .stat-card:nth-child(4){animation-delay:.2s;}
  .stat-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .stat-label{font-size:12.5px;color:var(--text2);font-weight:600;}
  .stat-icon{width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;}
  .stat-icon svg{width:15px;height:15px;}
  .stat-value{font-size:30px;font-weight:700;margin-top:10px;letter-spacing:.4px;}
  .stat-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .stat-delta{font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px;}
  .stat-delta.positive{color:var(--accent);}
  .stat-delta.negative{color:var(--danger);}
  .stat-sparkline{width:64px;height:26px;}

  .two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px;}
  .panel{background:var(--surface);border-radius:var(--radius-card);border:1px solid var(--divider);box-shadow:var(--shadow-sm);padding:22px 24px;opacity:0;animation:fadeInUp .5s ease forwards;animation-delay:.24s;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}

  .panel-sub{font-size:12px;color:var(--text3);margin-top:2px;}

  .hero-figure-label{font-size:12.5px;color:var(--text2);margin-bottom:4px;}

  .kpi-side-list{display:flex;flex-direction:column;gap:12px;}

  .kpi-side-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .kpi-side-label{font-size:12px;color:var(--text2);}

  .step-dot.done{background:var(--accent-bg);color:#0a7f71;}
  .step-dot.active{background:#fff1e8;color:var(--primary);animation:pulseDot 1.6s infinite;}
  .step-dot.pending{background:var(--bg);color:var(--text3);border:1px solid var(--divider);}
  .step-dot svg{width:15px;height:15px;}
  .step-body{flex:1;padding-top:4px;}
  .step-name{font-size:13.5px;font-weight:600;}
  .step-desc{font-size:12px;color:var(--text3);margin-top:2px;}

  .toggle{width:38px;height:22px;border-radius:999px;background:var(--divider);position:relative;cursor:pointer;flex-shrink:0;border:none;transition:background .2s;}
  .toggle.on{background:var(--primary);}
  .toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .toggle-knob{left:19px;}

  .mapping-row{display:grid;grid-template-columns:1fr 26px 1fr 70px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider);font-size:13px;}
  .mapping-row:last-child{border-bottom:none;}

  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .compare-card{background:var(--bg);border-radius:14px;padding:14px 16px;border:1px solid var(--divider);}
  .compare-card-title{font-size:11.5px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
  .compare-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--divider);}
  .compare-line:last-child{border-bottom:none;}

  .progress-bar-wrap{width:100%;height:6px;background:var(--divider);border-radius:999px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--primary);border-radius:999px;animation:fillBar 1.1s ease forwards;}

  .empty-illust{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 16px;color:var(--text3);text-align:center;}
  .empty-illust svg{margin-bottom:10px;color:var(--border);}

  @media (max-width:1100px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .widget-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

function Sparkline({points, color}) {
  const w=64,h=26;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function StatCard({label, value, delta, positive, icon, spark, color}) {
  return (
    <div className="stat-card">
      <div className="stat-top">
        <div className="stat-label">{label}</div>
        <div className="stat-icon"><Icon name={icon} /></div>
      </div>
      <div className="stat-value">{value}</div>
      <div className="stat-bottom">
        <div className={`stat-delta ${positive?'positive':'negative'}`}>
          <Icon name={positive?'arrow-up-right':'arrow-down-right'} />
          {delta}
        </div>
        <Sparkline points={spark} color={color} />
      </div>
    </div>
  );
}

function Badge({status}) {
  const map = {
    success:{cls:'badge-success', icon:'check-circle', label:'성공'},
    fail:{cls:'badge-fail', icon:'x-circle', label:'실패'},
    pending:{cls:'badge-pending', icon:'clock', label:'대기'},
  };
  const m = map[status] || map.pending;
  return <span className={`badge ${m.cls}`}><Icon name={m.icon} />{m.label}</span>;
}

function Toast({toasts}) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><Icon name="check-circle" />{t.text}</div>
      ))}
    </div>
  );
}

function Modal({title, onClose, children, wide, footer}) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal ${wide?'modal-lg':''}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">{title}</div>
          <button className="icon-btn" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

    setConfirmOpen(false);

          setRunning(false);

              <button className={`filter-chip ${previewTab==='이카운트'?'active':''}`} onClick={()=>setPreviewTab('이카운트')}>이카운트</button>
            </div>
          </div>
          <div className="compare-grid">
            <div className="compare-card">
              <div className="compare-card-title">원본 급여 데이터</div>
              <div className="compare-line"><span>사원번호</span><span>2024031</span></div>
              <div className="compare-line"><span>지급총액</span><span>3,820,000원</span></div>
              <div className="compare-line"><span>공제항목</span><span>국민연금 외 4건</span></div>
              <div className="compare-line"><span>부서코드</span><span>DEV-102</span></div>
            </div>
            <div className="compare-card">
              <div className="compare-card-title">{previewTab} 변환 결과</div>
              {previewTab==='SAP' ? (
                <React.Fragment>
                  <div className="compare-line"><span>GL_COST_CENTER</span><span className="mono">2024031</span></div>
                  <div className="compare-line"><span>AMOUNT_KRW</span><span className="mono">3,820,000</span></div>
                  <div className="compare-line"><span>DEDUCTION_CD</span><span className="mono">D-4102</span></div>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div className="compare-line"><span>department_id</span><span className="mono">DEV-102</span></div>
                  <div className="compare-line"><span>voucher_date</span><span className="mono">2026-08-25</span></div>
                  <div className="compare-line"><span>amount</span><span className="mono">3,820,000</span></div>
                </React.Fragment>
              )}
            </div>
          </div>
          <div style={{marginTop:14, display:'flex', alignItems:'center', justifyContent:'space-between'}}>
            <div style={{fontSize:12.5, color:'var(--text2)'}}>차변·대변 합계 검증</div>
            <span className="badge badge-success"><Icon name="check-circle" />일치 · 3,820,000원</span>
          </div>
        </div>
      </div>

      {ruleModalOpen && (
        <Modal title="매핑 규칙 추가" onClose={()=>setRuleModalOpen(false)} footer={
          <React.Fragment>
            <button className="btn btn-secondary btn-sm" onClick={()=>setRuleModalOpen(false)}>취소</button>
            <button className="btn btn-primary btn-sm" onClick={addRule}>저장</button>
          </React.Fragment>
        }>
          <div className="form-row">
            <div className="form-group"><label className="form-label">원본 컬럼</label><input className="form-input" placeholder="예: 실지급액" value={newSrc} onChange={e=>setNewSrc(e.target.value)} /></div>
            <div className="form-group"><label className="form-label">대상 컬럼</label><input className="form-input" placeholder="예: NET_PAY" value={newDst} onChange={e=>setNewDst(e.target.value)} /></div>
          </div>
          <div className="form-group">
            <label className="form-label">대상 시스템</label>
            <select className="form-select" value={newSystem} onChange={e=>setNewSystem(e.target.value)}>
              <option value="SAP">SAP</option><option value="이카운트">이카운트</option>
            </select>
          </div>
        </Modal>
      )}
    </React.Fragment>
  );
}

function ExceptionScreen({pushToast}) {
  const [items, setItems] = useState(exceptionQueue);
  const [filter, setFilter] = useState('전체');
  const [downloading, setDownloading] = useState(null);

  function downloadFile(id) {
    setDownloading(id);
    setTimeout(() => {
      setDownloading(null);
      pushToast(`${id} 예외 파일(Excel)을 다운로드했습니다`);
    }, 1200);
  }
  function requeue(id) {
    setItems(prev => prev.map(it => it.id===id ? {...it, status:'재처리중'} : it));
    pushToast(`${id}를 재처리 큐에 등록했습니다`);
  }

  const filtered = items.filter(it => filter==='전체' || it.status===filter);

  return (
    <React.Fragment>
      <div className="page-header">
        <div className="page-title-row">
          <h1 className="page-title">업로드 상태 추적 & 예외처리 파일 다운로드</h1>
        </div>
        <div className="page-meta">Strategy 패턴 업로드 어댑터 · 전송 실패 건 자동 파일 폴백</div>
      </div>

      <div className="stat-row" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <StatCard label="전송 대기" value="1건" delta="정상 범위" positive icon="clock" spark={[2,3,1,2,3,2,1]} color="#b8790a" />
        <StatCard label="재처리 중" value="1건" delta="자동 진행" positive icon="rotate-ccw" spark={[1,1,2,1,2,1,1]} color="#fa5d00" />
        <StatCard label="이번 주 해결" value="6건" delta="100% 해결" positive icon="check-circle" spark={[1,2,3,4,5,6,6]} color="#0fb5a3" />
      </div>

      <div className="data-section" style={{animationDelay:'.1s'}}>
        <div className="tab-bar">
          {['전체','대기','재처리중','해결됨'].map(t => <button key={t} className={`tab ${filter===t?'active':''}`} onClick={()=>setFilter(t)}>{t}</button>)}
        </div>
        <div className="data-table-wrap" style={{paddingTop:14}}>
          <table className="data-table">
            <thead><tr><th>예외 ID</th><th>사업장</th><th>사유</th><th>타겟</th><th>금액</th><th>상태</th><th>액션</th></tr></thead>
            <tbody>
              {filtered.map(it => (
                <tr key={it.id}>
                  <td className="mono">{it.id}</td>
                  <td>{it.biz}</td>
                  <td style={{color:'var(--text2)'}}>{it.reason}</td>
                  <td>{it.target}</td>
                  <td className="mono">{it.amount}</td>
                  <td>
                    <span className="badge" style={{
                      background: it.status==='해결됨'?'var(--accent-bg)': it.status==='재처리중'?'#fff1e8':'var(--danger-bg)',
                      color: it.status==='해결됨'?'#0a7f71': it.status==='재처리중'?'var(--primary-dark)':'var(--danger)'
                    }}>{it.status}</span>
                  </td>
                  <td>
                    <div style={{display:'flex', gap:6}}>
                      <button className="btn btn-secondary btn-sm" onClick={()=>downloadFile(it.id)} disabled={downloading===it.id}>
                        {downloading===it.id ? <Icon name="loader" className="spin" /> : <Icon name="download" />}
                        {downloading===it.id ? '내보내는 중' : '파일'}
                      </button>
                      {it.status!=='해결됨' && it.status!=='재처리중' && (
                        <button className="btn btn-secondary btn-sm" onClick={()=>requeue(it.id)}><Icon name="rotate-ccw" />재처리</button>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </React.Fragment>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const [syncDetail, setSyncDetail] = useState(null);

  function pushToast(text) {
    const id = Date.now()+Math.random();
    setToasts(prev => [...prev, {id, text}]);
    setTimeout(() => setToasts(prev => prev.filter(t=>t.id!==id)), 3200);
  }

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [screen, syncDetail]);

  const nav = [
    {group:'연동', items:[
      {key:'main', label:'더존 아마란스10 급여전표 연동 대시보드', icon:'layout-dashboard'},
    ]},
    {group:'처리', items:[
      {key:'batch', label:'급여 마감 자동 트리거 & 배치 처리', icon:'zap'},
      {key:'voucher', label:'SAP·이카운트 전표 자동 생성', icon:'file-check'},
    ]},
    {group:'예외', items:[
      {key:'exception', label:'업로드 상태 추적 & 예외처리 파일 다운로드', icon:'alert-triangle'},
    ]},
  ];

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="sidebar-brand-mark"><Icon name="link-2" /></div>
          <div>
            <div className="sidebar-brand-text">VoucherSync</div>
            <div className="sidebar-brand-sub">전표 연동 관제</div>
          </div>
        </div>
        <div className="env-pill"><span className="env-dot"></span>Production · 아마란스10 연결됨</div>
        {nav.map(g => (
          <div className="sidebar-section" key={g.group}>
            <div className="sidebar-section-title">{g.group}</div>
            {g.items.map(it => (
              <button key={it.key} className={`sidebar-link ${screen===it.key?'active':''}`} onClick={()=>setScreen(it.key)}>
                <Icon name={it.icon} />{it.label}
              </button>
            ))}
          </div>
        ))}
        <div className="sidebar-footer">© 2026 샘플기업 — 자체 개발 프로젝트</div>
      </aside>
      <main className="main-wrap">
        {screen==='main' && <DashboardScreen pushToast={pushToast} openSyncDetail={setSyncDetail} />}
        {screen==='batch' && <BatchScreen pushToast={pushToast} />}
        {screen==='voucher' && <VoucherScreen pushToast={pushToast} />}
        {screen==='exception' && <ExceptionScreen pushToast={pushToast} />}
      </main>
      <Toast toasts={toasts} />
      {syncDetail && (
        <Modal title={`${syncDetail.id} 연동 상세`} onClose={()=>setSyncDetail(null)} footer={<button className="btn btn-secondary btn-sm" onClick={()=>setSyncDetail(null)}>닫기</button>}>
          <div className="compare-line"><span>사업장</span><span>{syncDetail.biz}</span></div>
          <div className="compare-line"><span>요청 시각</span><span className="mono">{syncDetail.time}</span></div>
          <div className="compare-line"><span>응답 코드</span><span className="mono">{syncDetail.code}</span></div>
          <div className="compare-line"><span>처리 건수</span><span className="mono">{syncDetail.count}건</span></div>
          <div className="compare-line"><span>상태</span><Badge status={syncDetail.status} /></div>
        </Modal>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<style>
  .spin{animation:spin 1s linear infinite;}
</style>
</body>
</html>
