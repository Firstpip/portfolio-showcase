<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root{
    --bg:#ffffff; --surface:#f6f7fb; --surface-2:#e5e5e7; --primary:#5683da; --primary-dark:#3f68bd;
    --accent:#ff8964; --accent-bg:#fff1ea;
    --border:#d1d1d1; --divider:#e6e6ea; --text:#090a0c; --text2:#5b5d66; --text3:#95979e;
    --danger:#d1493f; --danger-bg:#fdecea; --success:#1f9d6f; --success-bg:#e8f8f1; --warn:#b8790a; --warn-bg:#fdf1de;
    --shadow-elev: 0 10px 28px rgba(9,10,12,.10), 0 2px 6px rgba(9,10,12,.06);
    --shadow-pop: 0 20px 48px rgba(9,10,12,.16);
    --radius-card:14px; --radius-pill:9999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);letter-spacing:-0.01em;}
  button,input,select,textarea{font-family:inherit;}
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,137,100,.5);}50%{box-shadow:0 0 0 5px rgba(255,137,100,0);}}
  @keyframes toastPop{from{opacity:0;transform:translateY(12px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes shimmerBg{0%{background-position:-200px 0;}100%{background-position:200px 0;}}

  .app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}
  .topnav{width:100%;height:64px;flex-shrink:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--divider);display:flex;align-items:center;padding:0 28px;gap:22px;position:sticky;top:0;z-index:30;}
  .topnav-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex-shrink:0;}
  .topnav-brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg, var(--primary), var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;}
  .topnav-links{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;}
  .topnav-link{border:none;background:none;padding:9px 14px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s, color .15s;}
  .topnav-link:hover{background:var(--surface);}
  .topnav-link.active{background:var(--primary);color:#fff;font-weight:600;}
  .topnav-link i{font-size:15px;}
  .topnav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .icon-pill{width:34px;height:34px;border-radius:50%;border:1px solid var(--divider);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);position:relative;}
  .icon-pill:hover{background:var(--surface);}
  .notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulseGlow 2s infinite;}
  .avatar-chip{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}

  .content{flex:1;width:100%;padding:26px 28px 40px;animation:fadeSlide .35s ease;}
  .content-inner{max-width:1280px;margin:0 auto;width:100%;}

  .page-head{position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;background:linear-gradient(160deg,#212228 0%,#303236 52%,#26272d 100%);border-radius:20px;padding:28px 30px;box-shadow:0 18px 40px rgba(9,10,12,.28);}
  .page-head::before{content:'';position:absolute;top:-45%;left:10%;width:16%;height:190%;background:linear-gradient(180deg,rgba(86,131,218,.6) 0%,rgba(255,137,100,.55) 55%,rgba(255,255,255,0) 92%);filter:blur(28px);transform:rotate(9deg);}
  .page-head::after{content:'';position:absolute;bottom:-70px;left:4%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,129,.32),transparent 70%);}
  .page-head > *{position:relative;z-index:2;}
  .page-title{font-size:25px;font-weight:700;margin:0;letter-spacing:-.03em;color:#fff;}
  .page-sub{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:5px;}
  .hero-stat{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1;color:#fff;}
  .hero-stat-label{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px;}

  .btn{border-radius:var(--radius-pill);padding:10px 18px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .12s, filter .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(86,131,218,.32);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-secondary{background:#fff;color:var(--text);border-color:var(--border);}
  .btn-secondary:hover{background:var(--surface);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;border:none;color:var(--text2);padding:8px 10px;}
  .btn-sm{padding:7px 14px;font-size:12px;}

  .master-detail{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}
  .list-rail{background:#fff;border-radius:var(--radius-card);border:1px solid var(--divider);box-shadow:var(--shadow-elev);overflow:hidden;}
  .list-rail-head{padding:16px 16px 10px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--radius-pill);padding:8px 14px;}
  .search-box input{border:none;background:none;outline:none;font-size:12.5px;width:100%;}
  .search-box i{color:var(--text3);}
  .rail-filters{display:flex;gap:6px;padding:10px 16px 4px;flex-wrap:wrap;}
  .rail-chip{padding:6px 12px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;border:1px solid var(--divider);background:#fff;color:var(--text2);cursor:pointer;}
  .rail-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .rail-list{padding:8px;max-height:560px;overflow-y:auto;}
  .rail-item{padding:12px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .13s;}
  .rail-item:hover{background:var(--surface);}
  .rail-item.selected{background:var(--accent-bg);}
  .rail-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .rail-item-text{flex:1;min-width:0;}
  .rail-item-name{font-size:13px;font-weight:600;}
  .rail-item-meta{font-size:11px;color:var(--text3);margin-top:1px;}
  .rail-item-badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:var(--radius-pill);flex-shrink:0;}

  .detail-panel{background:#fff;border-radius:var(--radius-card);border:1px solid var(--divider);box-shadow:var(--shadow-elev);padding:24px 26px;min-height:560px;}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .detail-title-row{display:flex;align-items:center;gap:10px;}
  .detail-title{font-size:19px;font-weight:700;}
  .detail-actions{display:flex;gap:8px;}

  .pill-tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:var(--radius-pill);width:fit-content;margin-bottom:18px;}
  .pill-tab{border:none;background:none;padding:8px 16px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;}
  .pill-tab.active{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(9,10,12,.1);}

  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border-radius:12px;padding:16px 18px;border:1px solid var(--divider);}
  .summary-label{font-size:11.5px;color:var(--text3);font-weight:600;margin-bottom:6px;}
  .summary-value{font-size:18px;font-weight:700;}

  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .mini-table th{text-align:left;font-size:11px;color:var(--text3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--divider);text-transform:uppercase;}
  .mini-table td{padding:10px;border-bottom:1px solid var(--divider);}
  .mini-table tr:last-child td{border-bottom:none;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;}
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-primary{background:var(--accent-bg);color:#c05a37;}

  .toggle{width:40px;height:23px;border-radius:var(--radius-pill);background:var(--divider);position:relative;cursor:pointer;flex-shrink:0;border:none;transition:background .2s;}
  .toggle.on{background:var(--primary);}
  .toggle-knob{width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .toggle-knob{left:20px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeSlide .16s ease;}
  .modal{background:#fff;border-radius:20px;width:520px;max-width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-pop);animation:scaleIn .2s ease;}
  .modal-lg{width:640px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--divider);}
  .modal-title{font-size:16.5px;font-weight:700;}
  .modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--divider);display:flex;justify-content:flex-end;gap:8px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-label{font-size:12px;font-weight:600;color:var(--text2);}
  .form-input,.form-select,.form-textarea{border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--text);outline:none;background:#fff;}
  .form-input:focus,.form-select:focus{border-color:var(--primary);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-hint{font-size:11px;color:var(--text3);}

  .toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
  .toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:var(--radius-pill);font-size:12.5px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-pop);animation:toastPop .25s ease;}
  .toast i{color:var(--accent);}

  .timeline{display:flex;flex-direction:column;}
  .timeline-item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--divider);cursor:pointer;}
  .timeline-item:hover{background:var(--surface);margin:0 -10px;padding:13px 10px;border-radius:10px;}
  .timeline-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .timeline-body{flex:1;min-width:0;}
  .timeline-title{font-size:13px;font-weight:600;}
  .timeline-meta{font-size:11.5px;color:var(--text3);margin-top:2px;}

  .rule-card{border:1px solid var(--divider);border-radius:14px;padding:16px 18px;margin-bottom:10px;}
  .rule-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .rule-cond{font-size:12.5px;color:var(--text2);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:ui-monospace,monospace;margin-bottom:8px;}

  .version-track{display:flex;flex-direction:column;gap:0;}
  .version-item{display:flex;gap:12px;padding:10px 0;position:relative;}
  .version-item:not(:last-child)::before{content:'';position:absolute;left:9px;top:28px;bottom:-2px;width:2px;background:var(--divider);}
  .version-dot{width:20px;height:20px;border-radius:50%;background:var(--primary);flex-shrink:0;display:flex;align-items:center;justify-content:center;z-index:1;}
  .version-dot.old{background:var(--divider);}

  .alert-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--divider);}
  .alert-row:last-child{border-bottom:none;}
  .threshold-input{width:70px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;font-size:12.5px;text-align:center;}

  .empty-illust{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 16px;color:var(--text3);text-align:center;gap:8px;}

  footer.app-footer{width:100%;padding:22px 28px;border-top:1px solid var(--divider);text-align:center;font-size:11.5px;color:var(--text3);}

  @media (max-width:980px){
    .master-detail{grid-template-columns:1fr;}
    .summary-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

function Toast({toasts}) {
  return <div className="toast-wrap">{toasts.map(t => <div className="toast" key={t.id}><Icon name="check-circle" />{t.text}</div>)}</div>;
}

function Modal({title, onClose, children, wide, footer}) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal ${wide?'modal-lg':''}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><div className="modal-title">{title}</div><button className="icon-pill" onClick={onClose}><Icon name="x" /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function StatusDot({status}) {
  const color = status==='success' ? 'var(--success)' : status==='warn' ? 'var(--warn)' : 'var(--danger)';
  return <span className="rail-status-dot" style={{background:color}}></span>;
}
function StatusBadge({status}) {
  const map = {success:{cls:'badge-success', label:'정상'}, warn:{cls:'badge-warn', label:'점검필요'}, fail:{cls:'badge-danger', label:'연동실패'}};
  const m = map[status] || map.success;
  return <span className={`badge ${m.cls}`}>{m.label}</span>;
}

            <div className="form-group"><label className="form-label">지표</label><select className="form-select"><option>연동 실패율</option><option>응답 지연</option><option>API 토큰 만료 임박</option></select></div>
          </div>
          <div className="form-group"><label className="form-label">임계치</label><input className="form-input" placeholder="예: 5%" /></div>
        </Modal>
      )}
      {testOpen && (
        <Modal title="테스트 알림 발송" onClose={()=>setTestOpen(false)} footer={<React.Fragment><button className="btn btn-secondary btn-sm" onClick={()=>setTestOpen(false)}>취소</button><button className="btn btn-primary btn-sm" onClick={()=>{setTestOpen(false); pushToast('테스트 알림을 웹·이메일로 발송했습니다');}}>발송</button></React.Fragment>}>
          <p style={{fontSize:13, color:'var(--text2)', margin:0}}>등록된 모든 채널로 샘플 알림을 즉시 발송하여 수신 여부를 확인합니다.</p>
        </Modal>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(text) {
    const id = Date.now()+Math.random();
    setToasts(prev => [...prev, {id, text}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)), 3200);
  }
  const navItems = [
    {key:'main', label:'다중 사업장/법인 연동 통합 관리', icon:'buildings'},
    {key:'rules', label:'전표 검증 룰 엔진 관리', icon:'list-checks'},
    {key:'audit', label:'연동 이력 & 감사로그 타임라인', icon:'clock-counter-clockwise'},
    {key:'alerts', label:'이상 감지 알림 센터', icon:'bell'},
  ];
  return (
    <div className="app-shell">
      <nav className="topnav">
        <div className="topnav-brand"><div className="topnav-brand-mark"><Icon name="stack" /></div>회계연동 플랫폼</div>
        <div className="topnav-links">
          {navItems.map(n => (
            <button key={n.key} className={`topnav-link ${screen===n.key?'active':''}`} onClick={()=>setScreen(n.key)}><Icon name={n.icon} />{n.label}</button>
          ))}
        </div>
        <div className="topnav-right">
          <button className="icon-pill" onClick={()=>pushToast('통합 검색을 실행했습니다')}><Icon name="magnifying-glass" /></button>
          <button className="icon-pill" onClick={()=>pushToast('읽지 않은 알림 3건이 있습니다')}><Icon name="bell" /><span className="notif-dot"></span></button>
          <div className="avatar-chip">관리</div>
        </div>
      </nav>
      <div className="content">
        {screen==='main' && <MainScreen pushToast={pushToast} />}
        {screen==='rules' && <RulesScreen pushToast={pushToast} />}
        {screen==='audit' && <AuditScreen />}
        {screen==='alerts' && <AlertsScreen pushToast={pushToast} />}
      </div>
      <footer className="app-footer">© 2026 샘플기업 — 자체 개발 프로젝트 · 전사 회계연동 통합 운영 플랫폼</footer>
      <Toast toasts={toasts} />
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<style>.mono{font-variant-numeric:tabular-nums;}</style>
</body>
</html>
