<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다국어 터치 설문 상담 키오스크 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#006bff;
    --secondary:#d4e0ed;
    --accent:#e55cff;
    --accent2:#0099ff;
    --bg:#f8f9fb;
    --surface:#ffffff;
    --text:#0b3558;
    --text2:#476788;
    --hairline:#d4e0ed;
    --pebble:#f0f3f8;
    --deep:#0b3558;
    --radius-card:24px;
    --radius-btn:8px;
    --shadow-card:0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 30px 50px rgba(71,103,136,.08);
    --shadow-btn:0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 15px 30px rgba(71,103,136,.06);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);}
  body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--primary);color:#fff;}

  @keyframes fadeSlide{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes blobFloat{0%{transform:translate(0,0) scale(1);}50%{transform:translate(14px,-18px) scale(1.05);}100%{transform:translate(0,0) scale(1);}}
  @keyframes checkPop{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.2);opacity:1;}100%{transform:scale(1);}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(0,107,255,.35);}70%{box-shadow:0 0 0 10px rgba(0,107,255,0);}100%{box-shadow:0 0 0 0 rgba(0,107,255,0);}}
  @keyframes ctaShine{0%{background-position:-120px 0;}100%{background-position:220px 0;}}

  .app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  /* ---- topnav ---- */
  .topnav{width:100%;height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(248,249,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--text);}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);}
  .nav-tabs{display:flex;gap:6px;background:var(--pebble);padding:5px;border-radius:999px;}
  .nav-tab{border:none;background:transparent;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .2s ease;}
  .nav-tab svg{width:15px;height:15px;}
  .nav-tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-btn);}
  .lang-switch-wrap{position:relative;}
  .lang-switch-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--hairline);background:var(--surface);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text);}
  .lang-switch-btn svg{width:16px;height:16px;color:var(--primary);}
  .lang-menu{position:absolute;right:0;top:52px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-card);padding:8px;width:190px;animation:fadeSlide .22s ease both;z-index:60;}
  .lang-menu button{width:100%;text-align:left;border:none;background:transparent;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between;}
  .lang-menu button:hover{background:var(--pebble);}
  .lang-menu button.on{color:var(--primary);font-weight:700;}

  main.stage{flex:1;width:100%;position:relative;overflow:hidden;}
  .screen-wrap{width:100%;min-height:calc(100vh - 76px);animation:fadeSlide .38s ease both;}

  /* ---- language screen ---- */
  .lang-screen{position:relative;width:100%;min-height:calc(100vh - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;overflow:hidden;}
  .blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:blobFloat 9s ease-in-out infinite;}
  .blob.b1{width:340px;height:340px;background:radial-gradient(circle at 32% 30%, var(--accent) 0%, rgba(229,92,255,0) 72%);top:-60px;left:-60px;}
  .blob.b2{width:280px;height:280px;background:radial-gradient(circle at 65% 65%, var(--accent2) 0%, rgba(0,153,255,0) 72%);bottom:-40px;right:-20px;animation-delay:2s;}
  .lang-inner{position:relative;z-index:2;max-width:760px;text-align:center;}
  .kicker{display:inline-flex;align-items:center;gap:6px;background:var(--pebble);color:#004eba;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:20px;}
  .lang-title{font-size:44px;line-height:1.22;font-weight:700;color:var(--text);margin:0 0 12px;}
  .lang-sub{font-size:17px;color:var(--text2);margin:0 0 40px;}
  .lang-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:18px;max-width:520px;margin:0 auto;}
  .lang-card{background:var(--surface);border:2px solid var(--hairline);border-radius:var(--radius-card);padding:26px 16px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-card);transition:transform .18s ease, border-color .18s ease;}
  .lang-card:hover{transform:translateY(-4px);}
  .lang-card.selected{border-color:var(--primary);}
  .lang-flag{font-size:26px;}
  .lang-name{font-weight:700;font-size:17px;color:var(--text);}
  .lang-native{font-size:12px;color:var(--text2);}
  .lang-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;animation:checkPop .3s ease both;}
  .lang-check svg{width:13px;height:13px;color:#fff;}
  .start-cta{margin-top:36px;background:var(--primary);color:#fff;border:none;padding:16px 40px;font-size:18px;font-weight:600;border-radius:var(--radius-btn);box-shadow:var(--shadow-btn);display:inline-flex;align-items:center;gap:10px;transition:transform .15s ease, opacity .2s ease;}
  .start-cta:disabled{opacity:.35;pointer-events:none;}
  .start-cta:hover{transform:translateY(-2px);}
  .start-cta svg{width:18px;height:18px;}

  /* ---- survey layout (wizard-flow composition) ---- */
  .survey-layout{display:flex;gap:32px;padding:44px 48px 60px;max-width:1200px;margin:0 auto;align-items:flex-start;flex-wrap:wrap;}
  .survey-main{flex:1 1 620px;min-width:0;}
  .stepper{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .step-dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--hairline);color:var(--text2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-dot.done{background:var(--primary);border-color:var(--primary);color:#fff;}
  .step-dot.active{border-color:var(--primary);color:var(--primary);animation:pulseRing 1.8s ease-in-out infinite;}
  .step-line{flex:1;height:2px;background:var(--hairline);position:relative;max-width:64px;}
  .step-line.done{background:var(--primary);}
  .step-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--primary);text-transform:uppercase;margin-bottom:8px;}
  .step-body{background:var(--surface);border-radius:var(--radius-card);padding:40px;box-shadow:var(--shadow-card);}
  .q-title{font-size:28px;font-weight:700;color:var(--text);margin:0 0 8px;}
  .q-sub{font-size:15px;color:var(--text2);margin:0 0 28px;}
  .option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .opt-card{position:relative;border:2px solid var(--hairline);border-radius:16px;overflow:hidden;background:var(--surface);text-align:left;transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;}
  .opt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
  .opt-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,107,255,.15);}
  .opt-img{width:100%;height:120px;object-fit:cover;display:block;filter:saturate(.92);}
  .opt-body{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .opt-label{font-size:15px;font-weight:600;color:var(--text);}
  .opt-checkmark{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;animation:checkPop .28s ease both;}
  .opt-checkmark svg{width:14px;height:14px;color:#fff;}
  .step-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--text);padding:12px 22px;border-radius:var(--radius-btn);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .btn-ghost svg{width:16px;height:16px;}
  .btn-ghost:disabled{opacity:.3;pointer-events:none;}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:12px 26px;border-radius:var(--radius-btn);font-size:15px;font-weight:600;box-shadow:var(--shadow-btn);display:flex;align-items:center;gap:8px;transition:transform .15s ease,opacity .2s ease;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.35;pointer-events:none;}
  .btn-primary svg{width:16px;height:16px;}

  .summary-side{width:280px;flex-shrink:0;background:var(--surface);border-radius:var(--radius-card);padding:26px;box-shadow:var(--shadow-card);position:sticky;top:96px;}
  .summary-title{font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 16px;}
  .summary-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--pebble);}
  .summary-item:last-of-type{border-bottom:none;}
  .summary-item svg{width:16px;height:16px;color:var(--primary);flex-shrink:0;margin-top:2px;}
  .summary-item-q{font-size:12px;color:var(--text2);margin:0 0 2px;}
  .summary-item-a{font-size:13px;font-weight:600;color:var(--text);}
  .summary-empty{font-size:13px;color:var(--text2);line-height:1.6;}
  .help-box{margin-top:18px;background:var(--pebble);border-radius:14px;padding:16px;font-size:12.5px;color:var(--text2);line-height:1.6;}

  /* ---- result screen ---- */
  .result-wrap{max-width:1160px;margin:0 auto;padding:44px 48px 72px;}
  .result-head{text-align:center;max-width:600px;margin:0 auto 36px;}
  .result-badge{display:inline-flex;align-items:center;gap:6px;background:var(--pebble);color:#004eba;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px;}
  .result-title{font-size:32px;font-weight:700;margin:0 0 10px;}
  .result-sub{font-size:15px;color:var(--text2);margin:0;}
  .cat-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;}
  .cat-tab{border:2px solid var(--hairline);background:var(--surface);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:8px;transition:all .18s ease;}
  .cat-tab svg{width:15px;height:15px;}
  .cat-tab.active{border-color:var(--primary);color:var(--primary);background:var(--pebble);}
  .cat-tab.reco::after{content:'추천';font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:999px;margin-left:2px;}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .menu-card{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-card);transition:transform .18s ease;}
  .menu-card:hover{transform:translateY(-4px);}
  .menu-img{width:100%;height:150px;object-fit:cover;display:block;}
  .menu-body{padding:18px;}
  .menu-name{font-size:16px;font-weight:700;margin:0 0 6px;}
  .menu-desc{font-size:13px;color:var(--text2);margin:0 0 14px;line-height:1.5;}
  .menu-meta{display:flex;justify-content:space-between;align-items:center;}
  .menu-price{font-size:17px;font-weight:700;color:var(--primary);}
  .menu-time{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;}
  .menu-time svg{width:13px;height:13px;}
  .restart-wrap{text-align:center;margin-top:44px;}
  .btn-outline{background:transparent;border:1px solid var(--hairline);color:var(--text);padding:13px 28px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;}
  .btn-outline svg{width:15px;height:15px;}

  footer.app-footer{width:100%;background:var(--bg);border-top:1px solid var(--hairline);padding:22px 40px;text-align:center;font-size:12px;color:var(--text2);}

  @media (max-width: 900px){
    .survey-layout{flex-direction:column;padding:28px 20px;}
    .summary-side{width:100%;position:static;}
    .option-grid{grid-template-columns:1fr;}
    .menu-grid{grid-template-columns:repeat(2,1fr);}
    .lang-title{font-size:32px;}
    .nav-tabs{display:none;}
  }
  @media (max-width: 560px){
    .menu-grid{grid-template-columns:1fr;}
    .topnav{padding:0 16px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const LANGS = [

const DICT = {

    result_badge:'설문 완료', result_title:'고객님께 맞는 메뉴를 추천드려요', result_sub:'응답 결과를 기반으로 아래 카테고리를 우선 추천합니다',

  },

const SLUG = 'touch-survey-kiosk-p1';
const img = (seed, w, h) => `https://picsum.photos/seed/${SLUG}-${seed}/${w}/${h}`;

function Icon({name, className}){
  return <i data-lucide={name} className={className}></i>;
}

function LangScreen({lang, setLang, onStart}){
  const t = DICT[lang];
  return (
    <div className="lang-screen">
      <div className="blob b1"></div>
      <div className="blob b2"></div>
      <div className="lang-inner">
        <span className="kicker">{t.kicker}</span>
        <h1 className="lang-title">{t.lang_title}</h1>
        <p className="lang-sub">{t.lang_sub}</p>
        <div className="lang-grid">
          {LANGS.map(l => (
            <button key={l.code} className={"lang-card" + (lang===l.code ? " selected" : "")}
              style={{position:'relative'}}
              onClick={() => setLang(l.code)}>
              {lang===l.code && <span className="lang-check"><Icon name="check"/></span>}
              <span className="lang-flag">{l.flag}</span>
              <span className="lang-name">{l.name}</span>
              <span className="lang-native">{l.native}</span>
            </button>
          ))}
        </div>
        <button className="start-cta" onClick={onStart}>
          <span>{t.start}</span>
          <Icon name="arrow-right"/>
        </button>
      </div>
    </div>
  );
}

function Stepper({current, total}){
  const dots = [];
  for(let i=1;i<=total;i++){
    dots.push(
      <div key={'d'+i} className={"step-dot" + (i<current?" done":"") + (i===current?" active":"")}>
        {i<current ? <Icon name="check" className="w-3 h-3"/> : i}
      </div>
    );
    if(i<total) dots.push(<div key={'l'+i} className={"step-line" + (i<current?" done":"")}></div>);
  }
  return <div className="stepper">{dots}</div>;
}

function SummarySide({lang, answers}){
  const t = DICT[lang];
  const entries = [];
  if(answers.q1) entries.push({q:t.q1_ans, a:answers.q1});
  if(answers.q2 && answers.q2.length) entries.push({q:t.q2_ans, a:answers.q2.join(', ')});
  return (
    <aside className="summary-side">
      <h3 className="summary-title">{t.summary_title}</h3>
      {entries.length===0 && <p className="summary-empty">{t.summary_empty}</p>}
      {entries.map((e,i) => (
        <div className="summary-item" key={i}>
          <Icon name="circle-check"/>
          <div>
            <p className="summary-item-q">{e.q}</p>
            <p className="summary-item-a">{e.a}</p>
          </div>
        </div>
      ))}
      <div className="help-box">{t.help}</div>
    </aside>
  );
}

function SurveyStep1({lang, answers, setAnswers, goNext}){
  const t = DICT[lang];
  const select = (opt) => setAnswers(a => ({...a, q1:opt}));
  return (
    <div className="survey-layout">
      <div className="survey-main">
        <p className="step-label">{t.step} 1 {t.of} 2</p>
        <Stepper current={1} total={2}/>
        <div className="step-body">
          <h2 className="q-title">{t.q1_title}</h2>
          <p className="q-sub">{t.q1_sub}</p>
          <div className="option-grid">
            {t.q1_opts.map((opt, i) => (
              <button key={opt} className={"opt-card" + (answers.q1===opt?" selected":"")} onClick={() => select(opt)}>
                <img className="opt-img" src={img('q1-'+i, 300, 220)} alt={opt}/>
                <div className="opt-body">
                  <span className="opt-label">{opt}</span>
                  {answers.q1===opt && <span className="opt-checkmark"><Icon name="check"/></span>}
                </div>
              </button>
            ))}
          </div>
          <div className="step-actions">
            <button className="btn-ghost" disabled><Icon name="arrow-left"/><span>{t.back}</span></button>
            <button className="btn-primary" disabled={!answers.q1} onClick={goNext}>
              <span>{t.next}</span><Icon name="arrow-right"/>
            </button>
          </div>
        </div>
      </div>
      <SummarySide lang={lang} answers={answers}/>
    </div>
  );
}

function SurveyStep2({lang, answers, setAnswers, goBack, goFinish}){
  const t = DICT[lang];
  const toggle = (opt) => setAnswers(a => {
    const cur = a.q2 || [];
    const next = cur.includes(opt) ? cur.filter(x=>x!==opt) : [...cur, opt];
    return {...a, q2: next};
  });
  const picked = answers.q2 || [];
  return (
    <div className="survey-layout">
      <div className="survey-main">
        <p className="step-label">{t.step} 2 {t.of} 2</p>
        <Stepper current={2} total={2}/>
        <div className="step-body">
          <h2 className="q-title">{t.q2_title}</h2>
          <p className="q-sub">{t.q2_sub}</p>
          <div className="option-grid">
            {t.q2_opts.map((opt, i) => (
              <button key={opt} className={"opt-card" + (picked.includes(opt)?" selected":"")} onClick={() => toggle(opt)}>
                <img className="opt-img" src={img('q2-'+i, 300, 220)} alt={opt}/>
                <div className="opt-body">
                  <span className="opt-label">{opt}</span>
                  {picked.includes(opt) && <span className="opt-checkmark"><Icon name="check"/></span>}
                </div>
              </button>
            ))}
          </div>
          <div className="step-actions">
            <button className="btn-ghost" onClick={goBack}><Icon name="arrow-left"/><span>{t.back}</span></button>
            <button className="btn-primary" disabled={picked.length===0} onClick={goFinish}>
              <span>{t.finish}</span><Icon name="arrow-right"/>
            </button>
          </div>
        </div>
      </div>
      <SummarySide lang={lang} answers={answers}/>
    </div>
  );
}

function scoreCategory(answers){
  const skin = answers.q1;
  const areas = answers.q2 || [];
  let idx = 0;
  if(skin==='지성' || skin==='Oily' || skin==='脂性肌' || skin==='油性') idx = 0;
  else if(areas.includes('두피')||areas.includes('Scalp')||areas.includes('頭皮')||areas.includes('头皮')) idx = 1;
  else if(areas.includes('손·발')||areas.includes('Hands & Feet')||areas.includes('ハンド・フット')||areas.includes('手足')) idx = 2;
  else idx = 3;
  return idx;
}

function ResultScreen({lang, answers, onRestart}){
  const t = DICT[lang];
  const recoIdx = scoreCategory(answers);
  const [activeCat, setActiveCat] = useState(recoIdx);
  const items = [0,1,2].map(i => ({
    name: `${t.cats[activeCat]} ${['A','B','C'][i]} 코스`,
    desc: lang==='ko' ? '전문 상담을 통해 맞춤 시술 계획을 안내합니다.' : t.q1_sub,
    price: (35000 + activeCat*8000 + i*12000).toLocaleString(lang==='ko'?'ko-KR':'en-US'),
    time: 30 + i*20,
    img: img('menu-'+activeCat+'-'+i, 400, 300),
  }));
  const catIcons = ['sparkles','scissors','gem','flower-2'];
  return (
    <div className="result-wrap">
      <div className="result-head">
        <span className="result-badge"><Icon name="check-circle-2"/> {t.result_badge}</span>
        <h2 className="result-title">{t.result_title}</h2>
        <p className="result-sub">{t.result_sub}</p>
      </div>
      <div className="cat-tabs">
        {t.cats.map((c, i) => (
          <button key={c} className={"cat-tab" + (activeCat===i?" active":"") + (recoIdx===i?" reco":"")} onClick={() => setActiveCat(i)}>
            <Icon name={catIcons[i]}/>
            <span>{c}</span>
          </button>
        ))}
      </div>
      <div className="menu-grid">
        {items.map((it, i) => (
          <div className="menu-card" key={i}>
            <img className="menu-img" src={it.img} alt={it.name}/>
            <div className="menu-body">
              <h3 className="menu-name">{it.name}</h3>
              <p className="menu-desc">{it.desc}</p>
              <div className="menu-meta">
                <span className="menu-price">{lang==='ko'||lang==='zh'||lang==='ja' ? it.price+'원' : '$'+Math.round(it.price/1300)}</span>
                <span className="menu-time"><Icon name="clock"/>{it.time}{t.menu_time}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="restart-wrap">
        <button className="btn-outline" onClick={onRestart}><Icon name="rotate-ccw"/><span>{t.restart}</span></button>
      </div>
    </div>
  );
}

function App(){
  const [lang, setLang] = useState('ko');
  const [screen, setScreen] = useState('main');
  const [answers, setAnswers] = useState({});
  const [langMenuOpen, setLangMenuOpen] = useState(false);
  const t = DICT[lang];

  useEffect(() => { if(window.lucide) window.lucide.createIcons(); });

  const tabs = [
    {key:'main', label:t.nav_lang, icon:'globe'},
    {key:'survey-step1', label:t.nav_s1, icon:'list-checks'},
    {key:'survey-step2', label:t.nav_s2, icon:'sliders-horizontal'},
    {key:'menu-result', label:t.nav_result, icon:'layout-grid'},
  ];

  const goRestart = () => { setAnswers({}); setScreen('main'); };

  return (
    <div className="app-shell">
      <header className="topnav">
        <div className="brand"><span className="dot"></span>{t.brand}</div>
        <nav className="nav-tabs">
          {tabs.map(tab => (
            <button key={tab.key} className={"nav-tab" + (screen===tab.key?" active":"")} onClick={() => setScreen(tab.key)}>
              <Icon name={tab.icon}/>
              <span>{tab.label}</span>
            </button>
          ))}
        </nav>
        <div className="lang-switch-wrap">
          <button className="lang-switch-btn" onClick={() => setLangMenuOpen(v => !v)}>
            <Icon name="languages"/>
            <span>{LANGS.find(l=>l.code===lang).flag} {LANGS.find(l=>l.code===lang).name}</span>
          </button>
          {langMenuOpen && (
            <div className="lang-menu">
              {LANGS.map(l => (
                <button key={l.code} className={lang===l.code?'on':''} onClick={() => { setLang(l.code); setLangMenuOpen(false); }}>
                  <span>{l.flag} {l.name}</span>
                  {lang===l.code && <Icon name="check" className="w-4 h-4"/>}
                </button>
              ))}
            </div>
          )}
        </div>
      </header>

      <main className="stage">
        <div className="screen-wrap" key={screen}>
          {screen==='main' && <LangScreen lang={lang} setLang={setLang} onStart={() => setScreen('survey-step1')}/>}
          {screen==='survey-step1' && <SurveyStep1 lang={lang} answers={answers} setAnswers={setAnswers} goNext={() => setScreen('survey-step2')}/>}
          {screen==='survey-step2' && <SurveyStep2 lang={lang} answers={answers} setAnswers={setAnswers} goBack={() => setScreen('survey-step1')} goFinish={() => setScreen('menu-result')}/>}
          {screen==='menu-result' && <ResultScreen lang={lang} answers={answers} onRestart={goRestart}/>}
        </div>
      </main>

      <footer className="app-footer">© 2026 다국어 터치 설문 상담 키오스크 — 자체 개발 데모</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
