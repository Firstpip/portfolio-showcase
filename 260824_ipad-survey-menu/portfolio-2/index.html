<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 콘텐츠 통합 관리 및 설문 분석 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --primary:#ffc7fa;
    --primary-ink:#5b2f7a;
    --secondary:#e3e3e2;
    --accent:#79f61e;
    --wine:#421d24;
    --violet:#714cb6;
    --bg:#f2f0eb;
    --surface:#ffffff;
    --text:#292827;
    --text2:#666666;
    --border:#e3e3e2;
    --radius-card:16px;
    --radius-btn:16px;
    --radius-sm:8px;
    --shadow-soft:0 1px 2px rgba(41,40,39,.05), 0 8px 20px rgba(41,40,39,.05);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);}
  body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--primary);color:var(--text);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes drawerSlideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes chipPop{0%{transform:scale(.9);}60%{transform:scale(1.04);}100%{transform:scale(1);}}
  @keyframes badgePulse{0%{box-shadow:0 0 0 0 rgba(121,246,30,.5);}70%{box-shadow:0 0 0 7px rgba(121,246,30,0);}100%{box-shadow:0 0 0 0 rgba(121,246,30,0);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}

  .app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  /* ---- persistent header (archetype signature: sticky search header) ---- */
  .search-header{position:sticky;top:0;z-index:50;width:100%;background:rgba(242,240,235,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;gap:20px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--text);flex-shrink:0;}
  .brand .brand-badge{width:30px;height:30px;border-radius:8px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .header-nav{display:flex;gap:4px;flex-wrap:wrap;}
  .header-nav button{border:none;background:transparent;padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .18s ease;}
  .header-nav button i{font-size:15px;}
  .header-nav button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-soft);}
  .header-user{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:none;flex-shrink:0;}

  .search-bar{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px;box-shadow:var(--shadow-soft);max-width:640px;margin:0 auto 16px;}
  .search-segment{flex:1;border:none;background:transparent;text-align:left;padding:8px 18px;border-radius:999px;transition:background .15s ease;}
  .search-segment:hover{background:var(--bg);}
  .segment-label{font-size:11px;color:var(--text2);font-weight:600;}
  .segment-value{font-size:13.5px;color:var(--text);font-weight:600;}
  .search-divider{width:1px;height:26px;background:var(--border);}
  .search-submit{width:38px;height:38px;border-radius:50%;background:var(--wine);border:none;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:2px;}

  .filter-chips{display:flex;gap:8px;overflow-x:auto;padding:0 36px 16px;}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2);transition:all .18s ease;}
  .chip i{font-size:15px;}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text);animation:chipPop .25s ease both;}

  main.stage{flex:1;width:100%;}
  .screen-wrap{width:100%;animation:fadeIn .34s ease both;}

  .page-head{padding:28px 36px 6px;max-width:1240px;margin:0 auto;}
  .page-title{font-size:38px;font-weight:460;letter-spacing:-.01em;margin:0 0 6px;color:var(--text);}
  .page-sub{font-size:14.5px;color:var(--text2);margin:0 0 20px;max-width:640px;}

  .gradient-banner{
    position:relative;overflow:hidden;border-radius:var(--radius-card);
    margin:0 36px 28px;padding:36px 40px;max-width:1240px;
    margin-left:auto;margin-right:auto;
    background:
      radial-gradient(circle at 68% 50%, rgba(113,76,182,.55) 0%, transparent 42%),
      radial-gradient(circle at 93% 50%, rgba(0,140,255,.4) 0%, transparent 40%),
      radial-gradient(circle at 50% 98%, rgba(255,120,190,.4) 0%, transparent 42%),
      radial-gradient(circle at 50% 75%, rgba(80,220,220,.35) 0%, transparent 45%),
      var(--surface);
    border:1px solid var(--border);
  }
  .gradient-banner-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .gradient-banner h2{font-size:26px;font-weight:460;margin:0 0 8px;color:var(--text);max-width:480px;}
  .gradient-banner p{font-size:13.5px;color:var(--text2);margin:0;max-width:440px;}

  /* ---- gallery grid ---- */
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 36px 60px;max-width:1240px;margin:0 auto;}
  .listing-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;text-align:left;transition:transform .18s ease, box-shadow .18s ease;position:relative;}
  .listing-card:hover{transform:scale(1.015);box-shadow:var(--shadow-soft);}
  .card-image-wrap{position:relative;aspect-ratio:4/3;}
  .card-image{width:100%;height:100%;object-fit:cover;display:block;}
  .card-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--wine);}
  .card-body{padding:16px;}
  .card-row-1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .card-title{font-size:15px;font-weight:700;margin:0;color:var(--text);}
  .card-rating{font-size:12.5px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .card-meta{font-size:12.5px;color:var(--text2);display:block;margin-bottom:2px;}
  .card-row-4{display:flex;align-items:baseline;gap:5px;margin-top:10px;}
  .card-price{font-size:16.5px;font-weight:700;color:var(--text);}
  .price-unit{font-size:11.5px;color:var(--text2);}

  /* ---- quick-view drawer ---- */
  .drawer-overlay{position:fixed;inset:0;background:rgba(41,40,39,.4);z-index:90;display:flex;justify-content:flex-end;}
  .drawer-panel{width:420px;max-width:92vw;height:100%;background:var(--surface);padding:28px;overflow-y:auto;animation:drawerSlideIn .28s ease both;box-shadow:-8px 0 30px rgba(41,40,39,.12);}
  .drawer-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .drawer-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius-card);margin-bottom:18px;}
  .drawer-title{font-size:22px;font-weight:700;margin:0 0 6px;}
  .drawer-meta-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .drawer-lang-preview{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;}
  .lang-pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--text2);}

  /* ---- buttons ---- */
  .btn-fill{background:var(--wine);color:#fff;border:none;padding:11px 22px;border-radius:var(--radius-btn);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;}
  .btn-fill i{font-size:16px;}
  .btn-lilac{background:var(--primary);color:var(--primary-ink);border:1px solid var(--primary-ink);padding:10px 20px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;}
  .btn-ghost2{background:transparent;color:var(--text);border:none;padding:10px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-danger{background:transparent;border:1px solid #e3b8c0;color:#a03350;padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

  /* ---- content manage ---- */
  .cm-wrap{max-width:1000px;margin:0 auto;padding:0 36px 60px;}
  .cm-toolbar{display:flex;justify-content:flex-end;margin-bottom:16px;}
  .cm-list{display:flex;flex-direction:column;gap:10px;}
  .cm-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;}
  .cm-row.dragging{opacity:.4;}
  .cm-drag{cursor:grab;color:var(--text2);font-size:18px;flex-shrink:0;}
  .cm-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .cm-info{flex:1;min-width:0;}
  .cm-name{font-size:14.5px;font-weight:700;margin:0 0 2px;}
  .cm-sub{font-size:12px;color:var(--text2);}
  .cm-price{font-size:14px;font-weight:700;flex-shrink:0;width:90px;text-align:right;}
  .cm-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text2);}
  .icon-btn:hover{background:var(--bg);}

  .modal-overlay{position:fixed;inset:0;background:rgba(41,40,39,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-panel{width:440px;max-width:100%;background:var(--surface);border-radius:var(--radius-card);padding:28px;animation:fadeIn .22s ease both;}
  .modal-title{font-size:19px;font-weight:700;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;color:var(--text);background:var(--bg);}
  .field-error{font-size:11.5px;color:#a03350;margin-top:5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  /* ---- analytics ---- */
  .an-wrap{max-width:1200px;margin:0 auto;padding:0 36px 60px;}
  .an-filters{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .an-filters select{border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;background:var(--surface);color:var(--text);}
  .an-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;}
  .kpi-label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;}
  .kpi-value{font-size:26px;font-weight:460;color:var(--text);}
  .kpi-sub{font-size:12px;color:var(--violet);margin-top:6px;}
  .chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;}
  .chart-card h3{font-size:15px;font-weight:700;margin:0 0 14px;}
  .chart-h{height:260px;position:relative;}

  /* ---- i18n manage ---- */
  .i18n-wrap{max-width:1000px;margin:0 auto;padding:0 36px 60px;}
  .lang-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px;width:fit-content;}
  .lang-tab{border:none;background:transparent;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text2);position:relative;}
  .lang-tab.active{background:var(--text);color:#fff;}
  .missing-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:badgePulse 1.8s ease-in-out infinite;}
  .i18n-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;}
  .i18n-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;margin-bottom:12px;}
  .i18n-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .i18n-item-head span{font-size:13.5px;font-weight:700;}
  .badge-missing{font-size:10.5px;font-weight:700;color:#7a5f00;background:#fff3c4;padding:3px 8px;border-radius:999px;}
  .i18n-preview{position:sticky;top:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;height:fit-content;}
  .i18n-preview h4{font-size:13px;color:var(--text2);margin:0 0 12px;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:200;animation:toastIn .25s ease both;display:flex;align-items:center;gap:8px;}

  footer.app-footer{width:100%;background:var(--bg);border-top:1px solid var(--border);padding:20px 36px;text-align:center;font-size:12px;color:var(--text2);}

  @media (max-width:960px){
    .card-grid{grid-template-columns:repeat(2,1fr);}
    .chart-grid{grid-template-columns:1fr;}
    .i18n-grid{grid-template-columns:1fr;}
    .i18n-preview{position:static;}
    .an-kpis{grid-template-columns:1fr;}
    .header-nav{display:none;}
  }
  @media (max-width:560px){
    .card-grid{grid-template-columns:1fr;padding:0 16px 40px;}
    .header-row{padding:12px 16px;}
    .page-head,.cm-wrap,.an-wrap,.i18n-wrap{padding-left:16px;padding-right:16px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;
const {BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid} = Recharts;

const SLUG = 'menu-admin-analytics-p2';
const img = (seed, w, h) => `https://picsum.photos/seed/${SLUG}-${seed}/${w}/${h}`;

const CATS = ['스킨케어','헤어스타일링','네일아트','바디케어'];
const CAT_ICONS = ['ph-sparkle','ph-scissors','ph-paint-brush','ph-flower-lotus'];
const LANGS = [
  {code:'ko', label:'한국어'},
  {code:'en', label:'English'},
  {code:'ja', label:'日本語'},
  {code:'zh', label:'中文'},
];

const INIT_ITEMS = CATS.flatMap((cat, ci) => [0,1,2].map((i) => ({
  id: `${ci}-${i}`,
  cat, catIdx: ci,
  name: `${cat} ${['베이직','프리미엄','스페셜'][i]} 코스`,
  desc: '전문 상담을 통해 맞춤 시술 계획을 안내하는 코스입니다.',
  price: 32000 + ci*7000 + i*15000,
  time: 30 + i*20,
  rating: (4.5 + (i*0.1)).toFixed(1),
  img: img(`gal-${ci}-${i}`, 400, 300),
  fav: i===0,
  translations: {
    ko: { name: `${cat} ${['베이직','프리미엄','스페셜'][i]} 코스`, desc: '전문 상담을 통해 맞춤 시술 계획을 안내하는 코스입니다.' },
    en: i===0 ? { name: `${cat} Basic Course`, desc: 'A course guided by expert consultation for a tailored plan.' } : { name:'', desc:'' },
    ja: {}, zh: {},
  },
})));

const SAMPLE_RESPONSES = (() => {
  const rows = [];
  const langWeights = [0.42, 0.24, 0.19, 0.15];
  CATS.forEach((cat, ci) => {
    LANGS.forEach((l, li) => {
      rows.push({ cat, lang: l.code, count: Math.round((18 + ci*9 + (3-ci)*4) * langWeights[li] * 10) });
    });
  });
  return rows;
})();

function Icon({name, className}){ return <i className={"ph " + name + (className? " "+className:"")}></i>; }

function Header({screen, setScreen, t}){
  const [userMenuOpen, setUserMenuOpen] = useState(false);
  const [keywordOpen, setKeywordOpen] = useState(false);
  const priceSteps = [50000, 100000, 150000];
  const tabs = [
    {key:'main', label:'카테고리 필터 메뉴 갤러리', icon:'ph-squares-four'},
    {key:'content-manage', label:'메뉴 콘텐츠 관리', icon:'ph-pencil-simple-line'},
    {key:'analytics', label:'설문 응답 분석 대시보드', icon:'ph-chart-bar'},
    {key:'i18n-manage', label:'다국어 콘텐츠 관리', icon:'ph-translate'},
  ];
  const cycleCategory = () => {
    const opts = ['all', ...CATS];
    const idx = opts.indexOf(t.catFilter);
    t.onFilter(opts[(idx + 1) % opts.length]);
  };
  const cyclePrice = () => {
    const idx = priceSteps.indexOf(t.priceMax);
    t.setPriceMax(priceSteps[(idx + 1) % priceSteps.length]);
  };
  return (
    <header className="search-header" data-search-header>
      <div className="header-row">
        <div className="brand"><span className="brand-badge">M</span>메뉴 어드민 스튜디오</div>
        <nav className="header-nav">
          {tabs.map(tab => (
            <button key={tab.key} className={screen===tab.key?'active':''} onClick={() => setScreen(tab.key)}>
              <Icon name={tab.icon}/><span>{tab.label}</span>
            </button>
          ))}
        </nav>
        <div style={{position:'relative'}}>
          <button className="header-user" onClick={() => setUserMenuOpen(v => !v)}>운영</button>
          {userMenuOpen && (
            <div className="lang-menu" style={{position:'absolute', right:0, top:44, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, boxShadow:'var(--shadow-soft)', padding:6, width:150, zIndex:60}}>
              <button style={{width:'100%', textAlign:'left', border:'none', background:'transparent', padding:'9px 10px', borderRadius:8, fontSize:13, fontWeight:600, color:'var(--text)'}} onClick={() => { t.notify('프로필 설정 화면 (데모)'); setUserMenuOpen(false); }}>프로필 설정</button>
              <button style={{width:'100%', textAlign:'left', border:'none', background:'transparent', padding:'9px 10px', borderRadius:8, fontSize:13, fontWeight:600, color:'var(--text)'}} onClick={() => { t.notify('로그아웃되었습니다 (데모)'); setUserMenuOpen(false); }}>로그아웃</button>
            </div>
          )}
        </div>
      </div>
      {screen==='main' && (
        <React.Fragment>
          <div className="search-bar" style={{position:'relative'}}>
            <button className="search-segment" onClick={cycleCategory}>
              <div className="segment-label">카테고리</div>
              <div className="segment-value">{t.catFilter==='all' ? '전체' : t.catFilter}</div>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={cyclePrice}>
              <div className="segment-label">가격대</div>
              <div className="segment-value">{t.priceLabel}</div>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={() => setKeywordOpen(v => !v)}>
              <div className="segment-label">키워드</div>
              <div className="segment-value">{t.keyword || '전체 메뉴 검색'}</div>
            </button>
            <button className="search-submit" onClick={() => t.notify('필터가 적용되었습니다.')}><Icon name="ph-magnifying-glass"/></button>
            {keywordOpen && (
              <div style={{position:'absolute', top:52, right:40, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, boxShadow:'var(--shadow-soft)', padding:12, width:220, zIndex:60}}>
                <input autoFocus value={t.keyword} onChange={(e) => t.setKeyword(e.target.value)} placeholder="메뉴 이름으로 검색" style={{width:'100%', border:'1px solid var(--border)', borderRadius:8, padding:'8px 10px', fontSize:13}}/>
              </div>
            )}
          </div>
          <div className="filter-chips">
            {['전체', ...CATS, '프로모션'].map((c, i) => (
              <button key={c} className={"chip" + (t.catFilter===(i===0?'all':c) ? " active":"")} onClick={() => t.onFilter(i===0?'all':c)}>

                <span>{c}</span>
              </button>
            ))}
          </div>
        </React.Fragment>
      )}
    </header>
  );
}

function ContentManageScreen({items, setItems, notify}){
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', data}
  const [confirmDel, setConfirmDel] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [form, setForm] = useState({name:'', cat:CATS[0], price:'', time:''});
  const [errors, setErrors] = useState({});

  const openAdd = () => { setForm({name:'', cat:CATS[0], price:'', time:''}); setErrors({}); setModal({mode:'add'}); };
  const openEdit = (it) => { setForm({name:it.name, cat:it.cat, price:String(it.price), time:String(it.time)}); setErrors({}); setModal({mode:'edit', id:it.id}); };

  const validate = () => {
    const e = {};
    if(!form.name.trim()) e.name = '메뉴 이름을 입력해주세요.';
    const priceNum = Number(form.price);
    if(form.price === '' || isNaN(priceNum) || priceNum < 0) e.price = '0 이상의 가격을 입력해주세요.';
    if(!form.time || Number(form.time) <= 0) e.time = '소요 시간을 입력해주세요.';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = () => {
    if(!validate()) return;
    if(modal.mode==='add'){
      const ci = CATS.indexOf(form.cat);
      const newItem = {
        id: 'new-'+Date.now(), cat: form.cat, catIdx: ci,
        name: form.name, desc: '전문 상담을 통해 맞춤 시술 계획을 안내하는 코스입니다.',
        price: Number(form.price), time: Number(form.time), rating:'4.5',
        img: img('new-'+form.name.length+'-'+ci, 400, 300), fav:false,
        translations: { ko:{name:form.name, desc:''}, en:{}, ja:{}, zh:{} },
      };
      setItems(list => [newItem, ...list]);
      notify('메뉴가 등록되어 갤러리에 즉시 반영되었습니다.');
    } else {
      setItems(list => list.map(it => it.id===modal.id ? {...it, name:form.name, cat:form.cat, price:Number(form.price), time:Number(form.time)} : it));
      notify('메뉴 정보가 수정되었습니다.');
    }
    setModal(null);
  };

  const remove = () => {
    setItems(list => list.filter(it => it.id !== confirmDel.id));
    notify('메뉴가 삭제되었습니다.');
    setConfirmDel(null);
  };

  const onDrop = (targetId) => {
    if(!dragId || dragId===targetId) return;
    setItems(list => {
      const arr = [...list];
      const from = arr.findIndex(i => i.id===dragId);
      const to = arr.findIndex(i => i.id===targetId);
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      return arr;
    });
    setDragId(null);
  };

  return (
    <div className="cm-wrap">
      <div className="page-head" style={{padding:'28px 0 6px'}}>
        <h1 className="page-title">메뉴 콘텐츠 관리</h1>
        <p className="page-sub">메뉴를 등록·수정·삭제하면 갤러리 화면에 바로 반영됩니다. 카드를 드래그해 노출 순서를 바꿀 수 있어요.</p>
      </div>
      <div className="cm-toolbar">
        <button className="btn-fill" onClick={openAdd}><Icon name="ph-plus"/><span>메뉴 추가</span></button>
      </div>
      <div className="cm-list">
        {items.map(it => (
          <div key={it.id}
            className={"cm-row" + (dragId===it.id ? " dragging":"")}
            draggable
            onDragStart={() => setDragId(it.id)}
            onDragOver={(e) => e.preventDefault()}
            onDrop={() => onDrop(it.id)}
          >
            <span className="cm-drag"><Icon name="ph-dots-six-vertical"/></span>
            <img className="cm-thumb" src={it.img} alt={it.name}/>
            <div className="cm-info">
              <p className="cm-name">{it.name}</p>
              <p className="cm-sub">{it.cat} · {it.time}분</p>
            </div>
            <div className="cm-price">{it.price.toLocaleString('ko-KR')}원</div>
            <div className="cm-actions">
              <button className="icon-btn" onClick={() => openEdit(it)}><Icon name="ph-pencil-simple"/></button>
              <button className="icon-btn" onClick={() => setConfirmDel(it)}><Icon name="ph-trash"/></button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">{modal.mode==='add' ? '메뉴 추가' : '메뉴 수정'}</h3>
            <div className="field">
              <label>메뉴 이름</label>
              <input value={form.name} onChange={(e) => setForm(f => ({...f, name:e.target.value}))} placeholder="예: 스킨케어 프리미엄 코스"/>
              {errors.name && <p className="field-error">{errors.name}</p>}
            </div>
            <div className="field">
              <label>카테고리</label>
              <select value={form.cat} onChange={(e) => setForm(f => ({...f, cat:e.target.value}))}>
                {CATS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="field">
              <label>가격 (원)</label>
              <input value={form.price} onChange={(e) => setForm(f => ({...f, price:e.target.value}))} placeholder="예: 45000"/>
              {errors.price && <p className="field-error">{errors.price}</p>}
            </div>
            <div className="field">
              <label>소요 시간 (분)</label>
              <input value={form.time} onChange={(e) => setForm(f => ({...f, time:e.target.value}))} placeholder="예: 50"/>
              {errors.time && <p className="field-error">{errors.time}</p>}
            </div>
            <div className="modal-actions">
              <button className="btn-ghost2" onClick={() => setModal(null)}>취소</button>
              <button className="btn-fill" onClick={submit}><Icon name="ph-check"/><span>저장</span></button>
            </div>
          </div>
        </div>
      )}

      {confirmDel && (
        <div className="modal-overlay" onClick={() => setConfirmDel(null)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()} style={{width:360}}>
            <h3 className="modal-title">정말 삭제하시겠습니까?</h3>
            <p style={{fontSize:13.5, color:'var(--text2)'}}>&quot;{confirmDel.name}&quot; 메뉴가 목록과 갤러리에서 삭제됩니다.</p>
            <div className="modal-actions">
              <button className="btn-ghost2" onClick={() => setConfirmDel(null)}>취소</button>
              <button className="btn-danger" onClick={remove}><Icon name="ph-trash"/><span>삭제</span></button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AnalyticsScreen(){
  const [range, setRange] = useState('30d');
  const [catFilter, setCatFilter] = useState('all');
  const [langFilter, setLangFilter] = useState('all');

  const scale = range==='7d' ? 0.35 : range==='90d' ? 2.4 : 1;

  const catData = useMemo(() => CATS.map((cat, i) => {
    const rows = SAMPLE_RESPONSES.filter(r => r.cat===cat && (langFilter==='all' || r.lang===langFilter));
    const total = rows.reduce((s,r) => s+r.count, 0);
    return { name: cat, value: Math.round(total * scale) };
  }), [langFilter, scale]);

  const langData = useMemo(() => {
    const rows = SAMPLE_RESPONSES.filter(r => catFilter==='all' || r.cat===catFilter);
    const byLang = LANGS.map(l => ({ name: l.label, value: rows.filter(r=>r.lang===l.code).reduce((s,r)=>s+r.count,0) }));
    const total = byLang.reduce((s,r)=>s+r.value,0) || 1;
    return byLang.map(r => ({...r, pct: Math.round(r.value/total*100)}));
  }, [catFilter]);

  const topCat = catData.slice().sort((a,b)=>b.value-a.value)[0];
  const totalResponses = catData.reduce((s,c)=>s+c.value,0);
  const PIE_COLORS = ['#421d24', '#714cb6', '#ffc7fa', '#79f61e'];

  return (
    <div className="an-wrap">
      <div className="page-head" style={{padding:'28px 0 6px'}}>
        <h1 className="page-title">설문 응답 분석</h1>
        <p className="page-sub">P1 설문 데이터를 카테고리·언어별로 집계한 샘플 대시보드입니다. 조건을 바꾸면 차트가 즉시 재계산됩니다.</p>
      </div>
      <div className="an-filters">
        <select value={range} onChange={(e) => setRange(e.target.value)}>
          <option value="7d">최근 7일</option>
          <option value="30d">최근 30일</option>
          <option value="90d">최근 90일</option>
        </select>
        <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)}>
          <option value="all">전체 카테고리</option>
          {CATS.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={langFilter} onChange={(e) => setLangFilter(e.target.value)}>
          <option value="all">전체 언어</option>
          {LANGS.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
        </select>
      </div>
      <div className="an-kpis">
        <div className="kpi-card">
          <div className="kpi-label">집계 응답 수 (샘플)</div>
          <div className="kpi-value">{totalResponses.toLocaleString('ko-KR')}건</div>
          <div className="kpi-sub">선택 조건 기준 클라이언트 집계</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">최다 응답 카테고리</div>
          <div className="kpi-value">{topCat ? topCat.name : '-'}</div>
          <div className="kpi-sub">응답 {topCat ? topCat.value.toLocaleString('ko-KR') : 0}건</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">이용 언어 수</div>
          <div className="kpi-value">{LANGS.length}개 언어</div>
          <div className="kpi-sub">한국어·영어·일본어·중국어</div>
        </div>
      </div>
      <div className="chart-grid">
        <div className="chart-card">
          <h3>카테고리별 응답 분포</h3>
          <div className="chart-h">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={catData}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e3e3e2"/>
                <XAxis dataKey="name" tick={{fontSize:12, fill:'#666666'}}/>
                <YAxis tick={{fontSize:12, fill:'#666666'}}/>
                <Tooltip/>
                <Bar dataKey="value" fill="#421d24" radius={[6,6,0,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="chart-card">
          <h3>언어별 이용 비중</h3>
          <div className="chart-h">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={langData} dataKey="value" nameKey="name" innerRadius={54} outerRadius={86} paddingAngle={2}>
                  {langData.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]}/>)}
                </Pie>
                <Tooltip/>
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div style={{display:'flex', gap:10, flexWrap:'wrap', marginTop:10}}>
            {langData.map((l,i) => (
              <span key={l.name} style={{fontSize:11.5, color:'var(--text2)', display:'flex', alignItems:'center', gap:5}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:PIE_COLORS[i%PIE_COLORS.length],display:'inline-block'}}></span>
                {l.name} {l.pct}%
              </span>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function I18nManageScreen({items, setItems, notify}){
  const [lang, setLang] = useState('en');
  const [activeId, setActiveId] = useState(items[0] ? items[0].id : null);
  const active = items.find(i => i.id===activeId) || items[0];

  const missingCount = (code) => items.filter(it => !(it.translations[code] && it.translations[code].name)).length;

  const updateField = (field, value) => {
    setItems(list => list.map(it => it.id===active.id ? {
      ...it,
      translations: { ...it.translations, [lang]: { ...(it.translations[lang]||{}), [field]: value } }
    } : it));
  };

  const save = () => notify('번역이 저장되어 갤러리 화면에 반영되었습니다.');

  const cur = (active && active.translations[lang]) || {};

  return (
    <div className="i18n-wrap">
      <div className="page-head" style={{padding:'28px 0 6px'}}>
        <h1 className="page-title">다국어 콘텐츠 관리</h1>
        <p className="page-sub">언어 탭을 전환하며 메뉴 설명을 대조 편집하고, 누락된 번역은 배지로 확인할 수 있습니다.</p>
      </div>
      <div className="lang-tabs">
        {LANGS.map(l => (
          <button key={l.code} className={"lang-tab" + (lang===l.code?' active':'')} onClick={() => setLang(l.code)}>
            {l.label}
            {l.code!=='ko' && missingCount(l.code) > 0 && <span className="missing-dot"></span>}
          </button>
        ))}
      </div>
      <div className="i18n-grid">
        <div>
          {items.map(it => (
            <div className="i18n-item" key={it.id} onClick={() => setActiveId(it.id)} style={{cursor:'pointer', borderColor: active && active.id===it.id ? 'var(--wine)' : 'var(--border)'}}>
              <div className="i18n-item-head">
                <span>{it.translations.ko.name}</span>
                {!(it.translations[lang] && it.translations[lang].name) && lang!=='ko' && <span className="badge-missing">번역 누락</span>}
              </div>
              {active && active.id===it.id && (
                <div>
                  <div className="field">
                    <label>{LANGS.find(l=>l.code===lang).label} 메뉴 이름</label>
                    <input value={cur.name || ''} onChange={(e) => updateField('name', e.target.value)} placeholder="번역된 메뉴 이름 입력"/>
                  </div>
                  <div className="field">
                    <label>{LANGS.find(l=>l.code===lang).label} 설명</label>
                    <textarea rows={3} value={cur.desc || ''} onChange={(e) => updateField('desc', e.target.value)} placeholder="번역된 설명 입력"></textarea>
                  </div>
                  <button className="btn-lilac" onClick={save}><Icon name="ph-floppy-disk"/><span>저장</span></button>
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="i18n-preview">
          <h4>실시간 미리보기 — {LANGS.find(l=>l.code===lang).label}</h4>
          {active && (
            <div className="listing-card" style={{border:'1px solid var(--border)'}}>
              <div className="card-image-wrap"><img className="card-image" src={active.img} alt=""/></div>
              <div className="card-body">
                <h3 className="card-title">{cur.name || active.translations.ko.name}</h3>
                <p style={{fontSize:12.5, color:'var(--text2)', marginTop:6}}>{cur.desc || '(번역 대기 중)'}</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [items, setItems] = useState(INIT_ITEMS);
  const [catFilter, setCatFilter] = useState('all');
  const [priceMax, setPriceMax] = useState(150000);
  const [keyword, setKeyword] = useState('');
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const c = params.get('cat');
    if(c) setCatFilter(c);
  }, []);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if(catFilter==='all') params.delete('cat'); else params.set('cat', catFilter);
    const q = params.toString();
    window.history.replaceState(null, '', q ? ('?'+q) : window.location.pathname);
  }, [catFilter]);

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };
  const toggleFav = (id) => setItems(list => list.map(it => it.id===id ? {...it, fav:!it.fav} : it));

  const headerT = { catFilter, onFilter: setCatFilter, priceMax, setPriceMax, priceLabel: priceMax>=150000 ? '전체' : `~${priceMax.toLocaleString('ko-KR')}원`, keyword, setKeyword, notify };

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <Header screen={screen} setScreen={setScreen} t={headerT}/>
      <main className="stage">
        <div className="screen-wrap" key={screen}>
          {screen==='main' && <GalleryScreen items={items} toggleFav={toggleFav} catFilter={catFilter} setCatFilter={setCatFilter} priceMax={priceMax} setPriceMax={setPriceMax} keyword={keyword} onGoI18n={() => setScreen('i18n-manage')}/>}
          {screen==='content-manage' && <ContentManageScreen items={items} setItems={setItems} notify={notify}/>}
          {screen==='analytics' && <AnalyticsScreen/>}
          {screen==='i18n-manage' && <I18nManageScreen items={items} setItems={setItems} notify={notify}/>}
        </div>
      </main>
      <footer className="app-footer">© 2026 메뉴 콘텐츠 통합 관리 플랫폼 — 자체 개발 데모</footer>
      {toast && <div className="toast"><Icon name="ph-check-circle"/>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
