<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 커뮤니티 앱 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#006bff;
    --secondary:#d4e0ed;
    --accent:#e55cff;
    --accent2:#0099ff;
    --bg:#f8f9fb;
    --surface:#ffffff;
    --text:#0b3558;
    --text2:#476788;
    --mist:#a6bbd1;
    --pebble:#f0f3f8;
    --hairline:#d4e0ed;
    --shadow-card: 0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 30px 50px rgba(71,103,136,.08);
    --shadow-btn: 0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 15px 30px rgba(71,103,136,.06);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:8px;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.45; transform:scale(1.25);} }
  @keyframes rippleGrow{ from{transform:scale(0); opacity:.55;} to{transform:scale(2.4); opacity:0;} }
  @keyframes shimmerMove{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes countUp{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

  .topbar{position:sticky;top:0;z-index:40;height:64px;width:100%;background:rgba(248,249,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;padding:0 32px;gap:24px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--text);white-space:nowrap;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:pulseDot 2.4s ease-in-out infinite;}
  .topbar-search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--pebble);border:1px solid var(--hairline);border-radius:9999px;padding:8px 16px;color:var(--text2);}
  .topbar-search input{border:none;background:transparent;outline:none;font-size:14px;color:var(--text);width:100%;font-family:inherit;}
  .topbar-actions{display:flex;align-items:center;gap:16px;margin-left:auto;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--hairline);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;transition:box-shadow .2s ease, transform .2s ease;}
  .icon-btn:hover{box-shadow:var(--shadow-btn);transform:translateY(-1px);}
  .avatar-ring{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--hairline);}
  .avatar-ring img{width:100%;height:100%;display:block;}

  .feature-nav{position:sticky;top:64px;z-index:35;width:100%;background:var(--bg);border-bottom:1px solid var(--hairline);display:flex;justify-content:center;padding:12px 24px;}
  .feature-nav-inner{display:flex;gap:8px;max-width:960px;width:100%;overflow-x:auto;}
  .feature-tab{flex-shrink:0;padding:10px 16px;border-radius:9999px;border:1px solid var(--hairline);background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .2s ease;}
  .feature-tab.active{background:var(--text);border-color:var(--text);color:#fff;box-shadow:var(--shadow-btn);}
  .feature-tab:hover:not(.active){border-color:var(--primary);color:var(--primary);}

  .page-wrap{width:100%;flex:1;display:flex;justify-content:center;gap:24px;padding:32px 24px 96px;}
  .feed-col{width:100%;max-width:620px;display:flex;flex-direction:column;gap:20px;}
  .rail-col{width:296px;flex-shrink:0;display:none;}
  @media(min-width:1180px){ .rail-col{display:flex;flex-direction:column;gap:20px;} }

  .hero-banner{background:var(--surface);border-radius:24px;padding:32px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;border:1px solid var(--hairline);}
  .hero-blob{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(50px);opacity:.35;top:-80px;right:-60px;background:radial-gradient(circle,var(--accent),var(--accent2));}
  .hero-title{font-size:40px;line-height:1.2;font-weight:700;color:var(--text);position:relative;max-width:420px;}
  .hero-sub{font-size:16px;color:var(--text2);margin-top:10px;max-width:420px;position:relative;}
  .hero-cta{margin-top:20px;display:flex;gap:12px;position:relative;}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;box-shadow:var(--shadow-btn);display:flex;align-items:center;gap:8px;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--hairline);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}

  .composer{position:sticky;top:120px;z-index:20;background:var(--surface);border:1px solid var(--hairline);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:14px;}
  .composer input{flex:1;border:none;background:var(--pebble);border-radius:9999px;padding:12px 18px;font-size:14px;color:var(--text2);outline:none;font-family:inherit;}
  .composer input::placeholder{color:var(--mist);}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:9999px;border:1px solid var(--hairline);background:var(--surface);font-size:13px;font-weight:600;color:var(--text2);}
  .chip.active{background:var(--pebble);color:var(--primary);border-color:var(--primary);}

  .post{background:var(--surface);border-radius:20px;border:1px solid var(--hairline);padding:20px;box-shadow:var(--shadow-card);animation:fadeInUp .5s ease both;}
  .post-head{display:flex;align-items:center;gap:12px;}
  .post-head .avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .post-head .avatar img{width:100%;height:100%;display:block;}
  .post-meta{display:flex;flex-direction:column;}
  .author{font-size:14px;font-weight:700;color:var(--text);}
  .post-meta time{font-size:12px;color:var(--mist);}
  .board-badge{margin-left:auto;background:#e6f0ff;color:#004eba;font-size:11px;font-weight:600;padding:4px 10px;border-radius:9999px;}
  .post-body{margin-top:14px;font-size:15px;line-height:1.6;color:var(--text);white-space:pre-line;}
  .post-img{margin-top:14px;width:100%;border-radius:16px;overflow:hidden;position:relative;}
  .post-img img{width:100%;display:block;height:280px;object-fit:cover;}
  .post-actions{margin-top:16px;display:flex;gap:8px;border-top:1px solid var(--hairline);padding-top:12px;}
  .act-btn{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--text2);}
  .act-btn:hover{background:var(--pebble);}
  .act-btn.liked{color:var(--accent);}
  .ripple{position:absolute;border-radius:50%;background:var(--primary);opacity:.4;pointer-events:none;animation:rippleGrow .55s ease-out forwards;}

  .rail-card{background:var(--surface);border:1px solid var(--hairline);border-radius:20px;padding:20px;box-shadow:var(--shadow-card);}
  .rail-card h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--text);}
  .rail-card p.desc{font-size:12px;color:var(--text2);margin:0 0 14px;}
  .rail-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--pebble);}
  .rail-item:last-child{border-bottom:none;}
  .rail-item img{width:32px;height:32px;border-radius:50%;}
  .rail-item .name{font-size:13px;font-weight:600;color:var(--text);}
  .rail-item .sub{font-size:11px;color:var(--mist);}
  .follow-btn{margin-left:auto;font-size:11px;font-weight:700;color:var(--primary);background:var(--pebble);border:none;border-radius:9999px;padding:6px 12px;}

  .load-more{align-self:center;background:var(--surface);border:1px solid var(--hairline);border-radius:9999px;padding:12px 28px;font-size:14px;font-weight:600;color:var(--text);box-shadow:var(--shadow-btn);}
  .load-more .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--hairline);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .panel{background:var(--surface);border:1px solid var(--hairline);border-radius:24px;padding:32px;box-shadow:var(--shadow-card);}
  .panel h2{font-size:28px;font-weight:700;margin:0 0 6px;color:var(--text);}
  .panel .sub{font-size:14px;color:var(--text2);margin:0 0 28px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;}
  .field select, .field input[type=text], .field textarea{width:100%;border:1px solid var(--hairline);background:var(--pebble);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;}
  .field textarea{min-height:120px;resize:vertical;}
  .board-pick{display:flex;gap:8px;flex-wrap:wrap;}
  .board-pick button{padding:8px 14px;border-radius:9999px;border:1px solid var(--hairline);background:var(--surface);font-size:13px;font-weight:600;color:var(--text2);}
  .board-pick button.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .dropzone{border:2px dashed var(--hairline);border-radius:16px;padding:28px;text-align:center;color:var(--text2);background:var(--pebble);}
  .dropzone:hover{border-color:var(--primary);}
  .upload-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .upload-item{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);}
  .progress-track{flex:1;height:6px;background:var(--hairline);border-radius:9999px;overflow:hidden;position:relative;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent2));border-radius:9999px;transition:width .3s ease;}
  .draft-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--primary);background:#e6f0ff;padding:4px 10px;border-radius:9999px;margin-bottom:16px;}

  .comment-tree{margin-top:24px;display:flex;flex-direction:column;gap:16px;}
  .comment{display:flex;gap:10px;}
  .comment img{width:32px;height:32px;border-radius:50%;flex-shrink:0;}
  .comment-body{flex:1;background:var(--pebble);border-radius:14px;padding:10px 14px;}
  .comment-body .cname{font-size:13px;font-weight:700;color:var(--text);}
  .comment-body .ctext{font-size:13px;color:var(--text);margin-top:2px;}
  .comment-body .ctime{font-size:11px;color:var(--mist);margin-top:4px;}
  .reply{margin-left:42px;margin-top:10px;}
  .comment-input{display:flex;gap:10px;margin-top:20px;align-items:center;}
  .comment-input input{flex:1;border:1px solid var(--hairline);background:var(--pebble);border-radius:9999px;padding:10px 16px;font-size:13px;outline:none;font-family:inherit;}

  .search-box{display:flex;align-items:center;gap:10px;background:var(--pebble);border:1px solid var(--hairline);border-radius:9999px;padding:12px 18px;margin-bottom:20px;}
  .search-box input{flex:1;border:none;background:transparent;outline:none;font-size:15px;color:var(--text);font-family:inherit;}
  .search-result{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--pebble);}
  .search-result .t{font-size:14px;font-weight:600;color:var(--text);}
  .search-result .t mark{background:#fde68a;color:var(--text);border-radius:3px;padding:0 2px;}
  .search-result .m{font-size:12px;color:var(--mist);}
  .profile-card{display:flex;align-items:center;gap:16px;padding:20px 0 24px;border-bottom:1px solid var(--hairline);margin-bottom:20px;}
  .profile-card img{width:64px;height:64px;border-radius:50%;}
  .profile-stats{display:flex;gap:24px;margin-top:8px;}
  .profile-stats div{font-size:12px;color:var(--text2);}
  .profile-stats b{display:block;font-size:16px;color:var(--text);}
  .mypage-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .mypage-tabs button{padding:8px 16px;border-radius:9999px;border:1px solid var(--hairline);background:var(--surface);font-size:13px;font-weight:600;color:var(--text2);}
  .mypage-tabs button.active{background:var(--text);color:#fff;border-color:var(--text);}
  .mypage-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--pebble);font-size:13px;color:var(--text);}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--text);color:#fff;padding:14px 22px;border-radius:9999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-card);z-index:100;animation:toastIn .35s ease both;display:flex;align-items:center;gap:8px;}

  .skeleton-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pebble) 25%,var(--hairline) 37%,var(--pebble) 63%);background-size:400px 100%;animation:shimmerMove 1.4s ease-in-out infinite;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const FEATURES = [
  {key:'main', name:'여행 커뮤니티 피드', icon:'layout-grid'},
  {key:'compose', name:'게시글 작성 & 사진 첨부', icon:'image-plus'},
  {key:'post-detail', name:'댓글 & 소셜 반응', icon:'message-circle'},
  {key:'search', name:'검색 & 마이페이지', icon:'search'}
];

const BOARD_LABELS = {notice:'공지', free:'자유', qna:'질문&답변', review:'여행후기'};
const BOARD_COLORS = {notice:'#e6f0ff', free:'#f0f3f8', qna:'#fdf2ff', review:'#e6fff4'};

const AVATAR = (seed) => `https://source.boringavatars.com/beam/64/${encodeURIComponent(seed)}?colors=006bff,e55cff,0099ff,d4e0ed,0b3558`;
const PIC = (seed, w, h) => `https://picsum.photos/seed/travel-community-feed-${seed}/${w}/${h}`;

const INITIAL_POSTS = [
  {id:1, board:'review', author:'김민수', time:'12분 전', body:'제주 서귀포 게스트하우스에서 3박 하고 왔어요. 방음은 아쉬웠지만 뷰가 진짜 좋았습니다. 다음엔 우도까지 묶어서 가려구요.', img: PIC('post-1',560,360), likes:24, liked:false, comments:8},
  {id:2, board:'free', author:'이지은', time:'38분 전', body:'다음 주 후쿠오카 3박4일 계획 중인데 렌트카 vs 대중교통 고민이에요. 다녀오신 분들 팁 부탁드려요!', img:null, likes:9, liked:false, comments:15},
  {id:3, board:'notice', author:'운영팀', time:'2시간 전', body:'[공지] 여행후기 게시판 사진 업로드 용량이 장당 20MB로 상향되었습니다. 고화질 사진도 편하게 올려주세요.', img:null, likes:41, liked:false, comments:3},
  {id:4, board:'qna', author:'박서준', time:'3시간 전', body:'유레일패스 4개국 티켓 구매했는데 좌석 예약도 따로 해야 하나요? 처음이라 감이 안 잡히네요.', img:null, likes:6, liked:false, comments:11},
  {id:5, board:'review', author:'최유나', time:'5시간 전', body:'다낭 미케비치 근처 숙소 후기입니다. 새벽 러닝 코스로도 완벽했어요. 사진 몇 장 남겨요.', img: PIC('post-5',560,360), likes:33, liked:false, comments:6},
  {id:6, board:'free', author:'정하늘', time:'어제', body:'여행 짐 쌀 때 다들 압축팩 쓰시나요? 캐리어 24인치로 일주일 버틸 수 있을지 걱정이에요.', img:null, likes:5, liked:false, comments:9}
];

const COMMENTS = [
  {id:1, name:'오세훈', text:'저도 우도 강추합니다! 자전거로 한 바퀴 돌면 반나절이면 충분해요.', time:'8분 전', replies:[
    {id:11, name:'김민수', text:'오 좋은 정보 감사해요 :) 자전거 대여소 위치도 알 수 있을까요?', time:'5분 전'}
  ]},
  {id:2, name:'한소희', text:'서귀포 게스트하우스 이름 여쭤봐도 될까요? 저도 다음 달에 가려구요.', time:'11분 전', replies:[]},
  {id:3, name:'윤도현', text:'뷰 진짜 부럽네요. 사진 몇 장 더 볼 수 있으면 좋겠어요.', time:'20분 전', replies:[]}
];

function useIcons(deps){
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, deps);
}

function Ripple({onDone}){
  return <span className="ripple" style={{left:'40%',top:'20%',width:60,height:60}} onAnimationEnd={onDone}></span>;
}

function Toast({text}){
  if(!text) return null;
  return <div className="toast"><i data-lucide="check-circle-2" style={{width:16,height:16}}></i>{text}</div>;
}

function TopBar({active, onNavigate, onToggleSearch}){
  return (
    <header className="topbar">
      <div className="brand"><span className="dot"></span>트래블루프</div>
      <div className="topbar-search" onClick={onToggleSearch} style={{cursor:'pointer'}}>
        <i data-lucide="search" style={{width:16,height:16}}></i>
        <input placeholder="여행지, 게시글 검색" readOnly />
      </div>
      <div className="topbar-actions">
        <button className="icon-btn" onClick={()=>onNavigate('main')} title="알림">
          <i data-lucide="bell" style={{width:18,height:18}}></i>
        </button>
        <button className="avatar-ring" onClick={()=>onNavigate('search')} style={{border:'none',padding:0}} title="마이페이지">
          <img src={AVATAR('나의여행')} alt="내 프로필" />
        </button>
      </div>
    </header>
  );
}

function FeatureNav({active, onNavigate}){
  return (
    <div className="feature-nav">
      <div className="feature-nav-inner">
        {FEATURES.map(f=>(
          <button key={f.key} className={"feature-tab"+(active===f.key?" active":"")} onClick={()=>onNavigate(f.key)}>
            <i data-lucide={f.icon} style={{width:14,height:14}}></i>{f.name}
          </button>
        ))}
      </div>
    </div>
  );
}

function PostCard({post, onLike, onOpenDetail}){
  const [ripple, setRipple] = useState(false);
  return (
    <article className="post" style={{animationDelay:(post.id*0.04)+'s'}}>
      <div className="post-head">
        <div className="avatar"><img src={AVATAR(post.author)} alt={post.author} /></div>
        <div className="post-meta">
          <span className="author">{post.author}</span>
          <time>{post.time}</time>
        </div>
        <span className="board-badge" style={{background:BOARD_COLORS[post.board]}}>{BOARD_LABELS[post.board]}</span>
      </div>
      <div className="post-body">{post.body}</div>
      {post.img && <div className="post-img"><img src={post.img} alt="게시글 이미지" /></div>}
      <div className="post-actions">
        <button className={"act-btn"+(post.liked?" liked":"")} onClick={(e)=>{ setRipple(true); onLike(post.id); }}>
          {ripple && <Ripple onDone={()=>setRipple(false)} />}
          <i data-lucide="heart" style={{width:15,height:15, fill: post.liked? 'var(--accent)':'none'}}></i>
          좋아요 {post.likes}
        </button>
        <button className="act-btn" onClick={()=>onOpenDetail(post)}>
          <i data-lucide="message-circle" style={{width:15,height:15}}></i>
          댓글 {post.comments}
        </button>
        <button className="act-btn" onClick={()=>onOpenDetail(post)}>
          <i data-lucide="share-2" style={{width:15,height:15}}></i>
          공유
        </button>
      </div>
    </article>
  );
}

function FeedView({posts, onLike, onOpenDetail, onGoCompose, loadingMore, onLoadMore}){
  const [boardFilter, setBoardFilter] = useState('all');
  const [sort, setSort] = useState('latest');
  const filtered = posts.filter(p=> boardFilter==='all' || p.board===boardFilter)
    .sort((a,b)=> sort==='popular' ? b.likes-a.likes : b.id-a.id);
  return (
    <div className="feed-col">
      <div className="hero-banner">
        <div className="hero-blob"></div>
        <div className="hero-title">여행 이야기를 나눠보세요</div>
        <div className="hero-sub">공지·자유·질문&답변·여행후기 게시판을 하나의 피드로 모아 확인하고, 사진과 함께 나만의 여행 기록을 남겨보세요.</div>
        <div className="hero-cta">
          <button className="btn-primary" onClick={onGoCompose}><i data-lucide="pen-line" style={{width:16,height:16}}></i>글쓰기</button>
          <button className="btn-ghost" onClick={()=>setBoardFilter('review')}><i data-lucide="compass" style={{width:16,height:16}}></i>여행후기 보기</button>
        </div>
      </div>

      <div className="composer" onClick={onGoCompose}>
        <div className="avatar" style={{width:36,height:36,borderRadius:'50%',overflow:'hidden',flexShrink:0}}><img src={AVATAR('나의여행')} style={{width:'100%',height:'100%'}} /></div>
        <input placeholder="무슨 여행 이야기가 있으신가요?" readOnly />
        <button className="btn-primary" style={{padding:'8px 16px', fontSize:14}} onClick={(e)=>{e.stopPropagation(); onGoCompose();}}>
          <i data-lucide="image-plus" style={{width:15,height:15}}></i>등록
        </button>
      </div>

      <div className="filter-row">
        <button className={"chip"+(boardFilter==='all'?" active":"")} onClick={()=>setBoardFilter('all')}>전체</button>
        {Object.keys(BOARD_LABELS).map(k=>(
          <button key={k} className={"chip"+(boardFilter===k?" active":"")} onClick={()=>setBoardFilter(k)}>{BOARD_LABELS[k]}</button>
        ))}
        <button className={"chip"+(sort==='latest'?" active":"")} style={{marginLeft:'auto'}} onClick={()=>setSort('latest')}>최신순</button>
        <button className={"chip"+(sort==='popular'?" active":"")} onClick={()=>setSort('popular')}>인기순</button>
      </div>

      {filtered.map(p=> <PostCard key={p.id} post={p} onLike={onLike} onOpenDetail={onOpenDetail} />)}

      {loadingMore ? (
        <div className="load-more"><span className="spin"></span>불러오는 중...</div>
      ) : (
        <button className="load-more" onClick={onLoadMore}>더 많은 게시글 보기</button>
      )}
    </div>
  );
}

function RailColumn(){
  const popular = [
    {name:'제주도', sub:'후기 128건'},
    {name:'후쿠오카', sub:'후기 96건'},
    {name:'다낭', sub:'후기 74건'},
    {name:'파리', sub:'후기 61건'}
  ];
  const suggest = [
    {name:'여행작가 노을', sub:'여행후기 42개'},
    {name:'백패커 준호', sub:'여행후기 31개'},
    {name:'캠퍼밴 다은', sub:'여행후기 27개'}
  ];
  const [follow, setFollow] = useState({});
  return (
    <div className="rail-col">
      <div className="rail-card">
        <h4>이번 주 인기 여행지</h4>
        <p className="desc">여행후기 게시판 기준 최다 언급 지역</p>
        {popular.map((p,i)=>(
          <div className="rail-item" key={i}>
            <span style={{width:24,textAlign:'center',fontWeight:700,color:'var(--primary)',fontSize:13}}>{i+1}</span>
            <div>
              <div className="name">{p.name}</div>
              <div className="sub">{p.sub}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="rail-card">
        <h4>팔로우 추천</h4>
        <p className="desc">활동이 많은 여행 크리에이터</p>
        {suggest.map((p,i)=>(
          <div className="rail-item" key={i}>
            <img src={AVATAR(p.name)} alt={p.name} />
            <div>
              <div className="name">{p.name}</div>
              <div className="sub">{p.sub}</div>
            </div>
            <button className="follow-btn" onClick={()=> setFollow(f=>({...f,[i]: !f[i]}))}>
              {follow[i] ? '팔로잉' : '팔로우'}
            </button>
          </div>
        ))}
      </div>

}

function ComposeView({onSubmit}){
  const [board, setBoard] = useState('review');
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [files, setFiles] = useState([]);
  const fileRef = useRef(null);

  const addFiles = () => {
    if(files.length>=10) return;
    const n = files.length+1;
    const item = {id:Date.now(), name:`travel-photo-${n}.jpg`, progress:0};
    setFiles(f=>[...f, item]);
    let p = 0;
    const timer = setInterval(()=>{
      p += Math.random()*35+10;
      setFiles(fs=> fs.map(x=> x.id===item.id ? {...x, progress: Math.min(100,p)} : x));
      if(p>=100) clearInterval(timer);
    }, 220);
  };

  return (
    <div className="panel" style={{maxWidth:640, margin:'0 auto'}}>
      <span className="draft-badge"><i data-lucide="save" style={{width:12,height:12}}></i>임시저장됨 · 방금 전</span>
      <h2>게시글 작성 & 사진 첨부</h2>
      <p className="sub">여행 사진과 이야기를 게시판에 등록합니다. 최대 10장까지 첨부할 수 있습니다.</p>

      <div className="field">
        <label>게시판 선택</label>
        <div className="board-pick">
          {Object.keys(BOARD_LABELS).map(k=>(
            <button key={k} className={board===k?"active":""} onClick={()=>setBoard(k)}>{BOARD_LABELS[k]}</button>
          ))}
        </div>
      </div>

      <div className="field">
        <label>제목</label>
        <input type="text" placeholder="제목을 입력하세요" value={title} onChange={e=>setTitle(e.target.value)} />
      </div>

      <div className="field">
        <label>본문</label>
        <textarea placeholder="여행 이야기를 자유롭게 남겨주세요" value={body} onChange={e=>setBody(e.target.value)}></textarea>
      </div>

      <div className="field">
        <label>사진 첨부 (최대 10장)</label>
        <div className="dropzone" onClick={addFiles}>
          <i data-lucide="upload-cloud" style={{width:24,height:24,color:'var(--mist)'}}></i>
          <div style={{marginTop:8,fontSize:13}}>클릭해서 사진 추가하기 ({files.length}/10)</div>
        </div>
        {files.length>0 && (
          <div className="upload-list">
            {files.map(f=>(
              <div className="upload-item" key={f.id}>
                <i data-lucide="image" style={{width:14,height:14}}></i>
                <span style={{width:120}}>{f.name}</span>
                <div className="progress-track"><div className="progress-fill" style={{width:f.progress+'%'}}></div></div>
                <span style={{width:36,textAlign:'right'}}>{Math.round(f.progress)}%</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <button className="btn-primary" disabled={!title || !board} style={{opacity: (!title||!board)?.45:1, width:'100%', justifyContent:'center'}}
        onClick={()=>{ if(!title||!board) return; onSubmit({board, title, body}); setTitle(''); setBody(''); setFiles([]); }}>
        <i data-lucide="send" style={{width:16,height:16}}></i>게시글 등록
      </button>
    </div>
  );
}

function CommentNode({c}){
  return (
    <div>
      <div className="comment">
        <img src={AVATAR(c.name)} alt={c.name} />
        <div className="comment-body">
          <div className="cname">{c.name}</div>
          <div className="ctext">{c.text}</div>
          <div className="ctime">{c.time}</div>
        </div>
      </div>
      {c.replies && c.replies.map(r=>(
        <div className="reply" key={r.id}>
          <div className="comment">
            <img src={AVATAR(r.name)} alt={r.name} />
            <div className="comment-body">
              <div className="cname">{r.name}</div>
              <div className="ctext">{r.text}</div>
              <div className="ctime">{r.time}</div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function PostDetailView({post, onLike, onAddComment}){
  const [commentText, setCommentText] = useState('');
  const [ripple, setRipple] = useState(false);
  const [comments, setComments] = useState(COMMENTS);
  if(!post) return null;
  return (
    <div className="panel" style={{maxWidth:640, margin:'0 auto'}}>
      <div className="post-head" style={{marginBottom:4}}>
        <div className="avatar"><img src={AVATAR(post.author)} alt={post.author} /></div>
        <div className="post-meta">
          <span className="author">{post.author}</span>
          <time>{post.time}</time>
        </div>
        <span className="board-badge" style={{background:BOARD_COLORS[post.board]}}>{BOARD_LABELS[post.board]}</span>
      </div>
      <h2 style={{fontSize:20,marginTop:16}}>댓글 & 소셜 반응</h2>
      <div className="post-body" style={{marginTop:4}}>{post.body}</div>
      {post.img && <div className="post-img"><img src={post.img} alt="게시글 이미지" /></div>}
      <div className="post-actions">
        <button className={"act-btn"+(post.liked?" liked":"")} onClick={()=>{ setRipple(true); onLike(post.id); }}>
          {ripple && <Ripple onDone={()=>setRipple(false)} />}
          <i data-lucide="heart" style={{width:15,height:15, fill: post.liked? 'var(--accent)':'none'}}></i>좋아요 {post.likes}
        </button>
        <button className="act-btn" onClick={()=>document.querySelector('.comment-input input')?.focus()}><i data-lucide="message-circle" style={{width:15,height:15}}></i>댓글 {comments.length}</button>
        <button className="act-btn" onClick={()=>{ navigator.clipboard && navigator.clipboard.writeText(window.location.href); }}><i data-lucide="share-2" style={{width:15,height:15}}></i>공유</button>
      </div>

      <div className="comment-tree">
        {comments.map(c=> <CommentNode key={c.id} c={c} />)}
      </div>

      <div className="comment-input">
        <img src={AVATAR('나의여행')} style={{width:32,height:32,borderRadius:'50%'}} />
        <input placeholder="댓글을 남겨보세요" value={commentText} onChange={e=>setCommentText(e.target.value)} />
        <button className="btn-primary" style={{padding:'8px 14px'}} onClick={()=>{
          if(!commentText.trim()) return;
          setComments(cs=>[...cs, {id:Date.now(), name:'나의여행', text:commentText, time:'방금 전', replies:[]}]);
          setCommentText('');
        }}><i data-lucide="send" style={{width:14,height:14}}></i></button>
      </div>
    </div>
  );
}

function SearchView({posts}){
  const [q, setQ] = useState('제주');
  const [tab, setTab] = useState('posts');
  const results = posts.filter(p=> p.body.includes(q));
  const highlight = (text) => {
    if(!q) return text;
    const idx = text.indexOf(q);
    if(idx<0) return text;
    return <>{text.slice(0,idx)}<mark>{q}</mark>{text.slice(idx+q.length)}</>;
  };
  return (
    <div className="panel" style={{maxWidth:640, margin:'0 auto'}}>
      <h2>검색 & 마이페이지</h2>
      <p className="sub">게시판 제목·본문 통합 검색과 내 활동을 확인합니다.</p>

      <div className="search-box">
        <i data-lucide="search" style={{width:16,height:16,color:'var(--text2)'}}></i>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="검색어를 입력하세요" />
      </div>
      {results.length>0 ? results.map(r=>(
        <div className="search-result" key={r.id}>
          <div>
            <div className="t">{highlight(r.body.slice(0,36))}...</div>
            <div className="m">{BOARD_LABELS[r.board]} · {r.author} · {r.time}</div>
          </div>
        </div>
      )) : <div style={{fontSize:13,color:'var(--mist)',padding:'12px 0'}}>검색 결과가 없습니다.</div>}

      <div className="profile-card">
        <img src={AVATAR('나의여행')} alt="내 프로필" />
        <div>
          <div style={{fontWeight:700,fontSize:16}}>나의여행</div>
          <div style={{fontSize:12,color:'var(--text2)'}}>여행을 기록하고 나누는 걸 좋아합니다.</div>
          <div className="profile-stats">
            <div><b style={{animation:'countUp .5s ease both'}}>12</b>작성글</div>
            <div><b style={{animation:'countUp .5s ease .1s both'}}>38</b>댓글</div>
            <div><b style={{animation:'countUp .5s ease .2s both'}}>204</b>받은 좋아요</div>
          </div>
        </div>
      </div>

      <div className="mypage-tabs">
        <button className={tab==='posts'?"active":""} onClick={()=>setTab('posts')}>내가 쓴 글</button>
        <button className={tab==='comments'?"active":""} onClick={()=>setTab('comments')}>내가 쓴 댓글</button>
      </div>
      {tab==='posts' ? (
        <>
          <div className="mypage-item"><span>제주 서귀포 게스트하우스 후기</span><span style={{color:'var(--mist)'}}>3일 전</span></div>
          <div className="mypage-item"><span>다낭 미케비치 근처 숙소 추천</span><span style={{color:'var(--mist)'}}>1주 전</span></div>
          <div className="mypage-item"><span>여행 짐 압축팩 사용 후기</span><span style={{color:'var(--mist)'}}>2주 전</span></div>
        </>
      ) : (
        <>
          <div className="mypage-item"><span>오 좋은 정보 감사해요 :) 자전거 대여소 위치도...</span><span style={{color:'var(--mist)'}}>5분 전</span></div>
          <div className="mypage-item"><span>저도 유레일패스 써봤는데 좌석 예약 꼭 하세요</span><span style={{color:'var(--mist)'}}>1일 전</span></div>
        </>
      )}
    </div>
  );
}

function App(){
  const [active, setActive] = useState('main');
  const [posts, setPosts] = useState(INITIAL_POSTS);
  const [selectedPost, setSelectedPost] = useState(INITIAL_POSTS[0]);
  const [toast, setToast] = useState('');
  const [loadingMore, setLoadingMore] = useState(false);

  useIcons([active, posts, selectedPost, toast]);

  const handleLike = (id) => {
    setPosts(ps => ps.map(p => p.id===id ? {...p, liked: !p.liked, likes: p.liked ? p.likes-1 : p.likes+1} : p));
    setSelectedPost(sp => sp && sp.id===id ? {...sp, liked: !sp.liked, likes: sp.liked ? sp.likes-1 : sp.likes+1} : sp);
  };

  const handleOpenDetail = (post) => { setSelectedPost(post); setActive('post-detail'); };

  const handleSubmitPost = (form) => {
    const np = {id:Date.now(), board:form.board, author:'나의여행', time:'방금 전', body: form.body || form.title, img:null, likes:0, liked:false, comments:0};
    setPosts(ps=>[np, ...ps]);
    setToast('게시글이 등록되었습니다');
    setTimeout(()=>setToast(''), 2400);
    setActive('main');
  };

  const handleLoadMore = () => {
    setLoadingMore(true);
    setTimeout(()=>{
      setPosts(ps=>[...ps, {id:Date.now(), board:'free', author:'강태오', time:'방금 전', body:'스페인 남부 안달루시아 지역 렌트카 여행 후기 공유합니다. 세비야부터 그라나다까지 루트 짜봤어요.', img:PIC('post-extra',560,360), likes:2, liked:false, comments:1}]);
      setLoadingMore(false);
    }, 900);
  };

  return (
    <div data-archetype="feed-timeline" style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar active={active} onNavigate={setActive} onToggleSearch={()=>setActive('search')} />
      <FeatureNav active={active} onNavigate={setActive} />
      <main style={{flex:1,width:'100%',display:'flex',justifyContent:'center'}}>
        <div className="page-wrap">
          {active==='main' && <FeedView posts={posts} onLike={handleLike} onOpenDetail={handleOpenDetail} onGoCompose={()=>setActive('compose')} loadingMore={loadingMore} onLoadMore={handleLoadMore} />}
          {active==='compose' && <ComposeView onSubmit={handleSubmitPost} />}
          {active==='post-detail' && <PostDetailView post={selectedPost} onLike={handleLike} />}
          {active==='search' && <SearchView posts={posts} />}
          {active==='main' && <RailColumn />}
        </div>
      </main>
      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
