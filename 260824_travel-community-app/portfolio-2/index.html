<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 커뮤니티 통합 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --primary:#ff2bee;
    --secondary:#1b1b1b;
    --accent:#90f745;
    --bg:#000000;
    --surface:#f5f5f5;
    --text:#ffffff;
    --text2:#9aa3ad;
    --ink:#1b1b1b;
    --ink2:#5b6472;
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(0,0,0,.08);
    --danger:#ff5c6c;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  @keyframes pulseAlert{ 0%,100%{box-shadow:0 0 0 0 rgba(255,92,108,.5);} 50%{box-shadow:0 0 0 6px rgba(255,92,108,0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes dashMove{ to{stroke-dashoffset:0;} }

  .shell{width:100%;min-height:100vh;display:flex;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:#0a0a0a;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px;font-weight:700;font-size:16px;}
  .sidebar-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);}
  .env-pill{margin-left:auto;font-size:10px;font-weight:700;color:var(--accent);border:1px solid rgba(144,247,69,.35);border-radius:9999px;padding:3px 8px;}
  .sidebar-section-title{font-size:11px;letter-spacing:.06em;color:var(--text2);text-transform:uppercase;padding:16px 8px 6px;}
  .sidebar-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--text2);font-size:13px;font-weight:600;padding:10px 10px;border-radius:8px;}
  .sidebar-link i{font-size:16px;}
  .sidebar-link:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .sidebar-link.active{background:var(--surface);color:var(--ink);}
  .sidebar-link.active i{color:var(--primary);}

  .main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:28px 32px 80px;}
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:32px;font-weight:700;margin:0;}
  .page-meta{font-size:12px;color:var(--text2);margin-top:6px;}
  .page-actions{display:flex;gap:10px;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .btn-secondary:hover{border-color:rgba(255,255,255,.3);}
  .btn-primary{background:var(--primary);border:none;color:#1b0016;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .btn-primary:hover{filter:brightness(1.08);}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;animation:fadeInUp .4s ease both;}
  .stat-label{font-size:12px;color:var(--ink2);font-weight:600;}
  .stat-value{font-size:32px;font-weight:700;color:var(--ink);}
  .stat-value.big{font-size:48px;}
  .stat-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .stat-delta.pos{color:#0a8f3c;}
  .stat-delta.neg{color:#d1354a;}
  .stat-spark{margin-top:2px;}
  .stat-card.alert{animation:fadeInUp .4s ease both, pulseAlert 2.2s ease-in-out infinite;}

  .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:22px;}
  @media(max-width:1080px){ .grid-2{grid-template-columns:1fr;} }

  .panel{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px 22px;}
  .panel h3{font-size:16px;margin:0 0 4px;color:var(--ink);}
  .panel .sub{font-size:12px;color:var(--ink2);margin:0 0 16px;}

  .area-chart-wrap{position:relative;height:220px;}
  .widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:900px){ .widget-grid{grid-template-columns:1fr;} }
  .widget-card{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;}
  .widget-card h4{font-size:13px;margin:0 0 12px;color:var(--ink);}
  .donut-row{display:flex;align-items:center;gap:16px;}
  .donut-legend{font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .timeline-item{display:flex;gap:8px;font-size:11px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .timeline-item:last-child{border-bottom:none;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .bar-row .lbl{width:64px;font-size:11px;color:var(--ink2);}
  .bar-track{flex:1;height:8px;background:var(--line-soft);border-radius:9999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:9999px;transform-origin:left;animation:barGrow .8s ease both;}
  .bar-row .val{width:32px;text-align:right;font-size:11px;color:var(--ink2);}

  .tab-bar{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line-soft);}
  .tab{background:transparent;border:none;color:var(--ink2);font-size:13px;font-weight:600;padding:10px 4px;margin-right:16px;border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-bottom-color:var(--primary);}
  .data-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .search-input{background:#fff;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink);min-width:200px;font-family:inherit;}
  .filter-chip{background:#fff;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink2);font-weight:600;}
  .filter-chip.active{background:var(--primary);color:#1b0016;border-color:var(--primary);}
  .export-btn{margin-left:auto;background:transparent;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .data-table th{text-align:left;font-size:11px;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-soft);}
  .data-table td{padding:11px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink);}
  .data-table tr.row-selectable:hover{background:rgba(0,0,0,.03);}
  .badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;}
  .badge.green{background:#e3f9d5;color:#2f7d19;}
  .badge.amber{background:#fff2cf;color:#8a6100;}
  .badge.red{background:#ffe1e5;color:#c22138;}
  .badge.blue{background:#e6f0ff;color:#0b3558;}
  .row-check{width:14px;height:14px;}

  .bulk-bar{display:flex;align-items:center;gap:12px;background:#1b0016;color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;}
  .bulk-bar button{background:var(--primary);color:#1b0016;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;margin-left:auto;}
  .bulk-bar button.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;margin-left:0;}

  .gauge-wrap{display:flex;align-items:center;gap:18px;}
  .gauge-value{font-size:28px;font-weight:700;}
  .gauge-value.warn{color:#d1354a;}
  .gauge-value.ok{color:#0a8f3c;}

  .cost-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .cost-row:last-child{border-bottom:none;font-weight:700;color:var(--ink);}

  .deploy-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:900px){ .deploy-cols{grid-template-columns:1fr;} }
  .deploy-track{background:var(--surface);border-radius:12px;padding:18px;color:var(--ink);}
  .deploy-track h4{font-size:14px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .stage-row{display:flex;gap:6px;margin:14px 0 18px;}
  .stage-pill{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:8px 4px;border-radius:6px;background:var(--line-soft);color:var(--ink2);}
  .stage-pill.done{background:#e3f9d5;color:#2f7d19;}
  .stage-pill.current{background:var(--primary);color:#1b0016;}
  .build-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12px;}
  .build-item:last-child{border-bottom:none;}
  .build-item .ver{font-weight:700;}
  .ci-log{margin-top:10px;background:#0d0d0d;color:#9df58d;font-family:ui-monospace,monospace;font-size:11px;border-radius:8px;padding:12px;line-height:1.6;display:none;}
  .ci-log.open{display:block;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:13px 20px;border-radius:9999px;font-size:13px;font-weight:700;z-index:100;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const NAV_GROUPS = [
  {title:'운영', items:[
    {key:'main', name:'통합 운영 대시보드', icon:'ph-squares-four'},
    {key:'moderation', name:'회원 & 게시물 관리 콘솔', icon:'ph-shield-check'}
  ]},
  {title:'인프라', items:[
    {key:'infra-monitor', name:'서버리스 인프라 모니터링', icon:'ph-cpu'},
    {key:'app-deploy', name:'앱 배포 파이프라인 관리', icon:'ph-rocket-launch'}
  ]}
];

function Sparkline({points, color}){
  const w=70,h=28;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=> [ (i/(points.length-1))*w, h - ((p-min)/(max-min||1))*h ]);
  const d = norm.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return (
    <svg width={w} height={h} className="stat-spark">
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function AreaChart(){
  const pts = [12,18,15,22,28,24,31,27,35,40,33,38,44,41];
  const w=560,h=200,pad=10;
  const max=Math.max(...pts), min=Math.min(...pts);
  const norm = pts.map((p,i)=> [ pad+(i/(pts.length-1))*(w-pad*2), h-pad - ((p-min)/(max-min||1))*(h-pad*2) ]);
  const line = norm.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${norm[norm.length-1][0]},${h} L${norm[0][0]},${h} Z`;
  return (
    <div className="area-chart-wrap">
      <svg width="100%" height="220" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#ff2bee" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#ff2bee" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={area} fill="url(#areaFill)" />
        <path d={line} fill="none" stroke="#ff2bee" strokeWidth="2.5" style={{strokeDasharray:900, strokeDashoffset:900, animation:'dashMove 1.4s ease forwards'}} />
        {norm.map((p,i)=> <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="#1b0016" stroke="#ff2bee" strokeWidth="1.5" />)}
      </svg>
    </div>
  );
}

function Toast({text}){
  if(!text) return null;
  return <div className="toast"><i className="ph ph-check-circle" style={{fontSize:16}}></i>{text}</div>;
}

function Sidebar({active, onNavigate}){
  return (
    <aside className="sidebar" data-sidebar>
      <div className="sidebar-brand"><span className="dot"></span>트래블루프 Ops<span className="env-pill">Production</span></div>
      {NAV_GROUPS.map(g=>(
        <div key={g.title}>
          <div className="sidebar-section-title">{g.title}</div>
          {g.items.map(it=>(
            <button key={it.key} className={"sidebar-link"+(active===it.key?" active":"")} onClick={()=>onNavigate(it.key)}>
              <i className={"ph "+it.icon}></i>{it.name}
            </button>
          ))}
        </div>
      ))}
    </aside>
  );
}

function PageHeader({title, meta, onRefresh, onPeriod, period}){
  return (
    <div className="page-header">
      <div>
        <h1 className="page-title">{title}</h1>
        <div className="page-meta">{meta}</div>
      </div>
      <div className="page-actions">
        <button className="btn-secondary" onClick={onPeriod}><i className="ph ph-calendar-blank"></i>{period}</button>
        <button className="btn-primary" onClick={onRefresh}><i className="ph ph-arrows-clockwise"></i>새로고침</button>
      </div>
    </div>
  );
}

function DashboardView({onGoModeration, setToast}){
  const [period, setPeriod] = useState('최근 7일');
  const periods = ['오늘','최근 7일','최근 30일'];
  const kpis = [
    {label:'전체 회원 수', value:'4,821', big:true, delta:'+3.2%', pos:true, spark:[10,12,11,14,16,15,18,20,19,22]},
    {label:'게시글 수', value:'1,203', delta:'+8.1%', pos:true, spark:[30,32,28,35,40,38,44,41,46,50]},
    {label:'누적 신고 건수', value:'27', delta:'+12건', pos:false, alert:true, spark:[2,3,2,5,4,6,7,6,9,10]},
    {label:'예상 월 서버비용', value:'₩186,000', delta:'-4.5%', pos:true, spark:[22,21,23,20,19,18,17,18,16,15]}
  ];
  const previewRows = [
    {name:'이하늘', kind:'회원', status:'정상', badge:'green', date:'2024.03.15'},
    {name:'여행짐 압축팩 후기 관련 신고', kind:'신고', status:'대기', badge:'amber', date:'2024.03.15'},
    {name:'게시판 사진 업로드 용량 안내', kind:'공지', status:'게시중', badge:'blue', date:'2024.03.14'},
    {name:'욕설 포함 댓글 신고', kind:'신고', status:'처리완료', badge:'green', date:'2024.03.13'},
    {name:'박도윤', kind:'회원', status:'정지', badge:'red', date:'2024.03.12'}
  ];
  return (
    <div>
      <PageHeader title="통합 운영 대시보드" meta={`마지막 업데이트: 방금 전 · ${period} 기준`} period={period}
        onPeriod={()=>{ const i=(periods.indexOf(period)+1)%periods.length; setPeriod(periods[i]); }}
        onRefresh={()=>{ setToast('지표를 새로고침했습니다'); }} />

      <div className="stat-row">
        {kpis.map((k,i)=>(
          <div className={"stat-card"+(k.alert?" alert":"")} key={i}>
            <div className="stat-label">{k.label}</div>
            <div className={"stat-value"+(k.big?" big":"")}>{k.value}</div>
            <div className={"stat-delta "+(k.pos?"pos":"neg")}><i className={"ph "+(k.pos?"ph-trend-up":"ph-trend-down")}></i>{k.delta}</div>
            <Sparkline points={k.spark} color={k.pos? '#0a8f3c':'#d1354a'} />
          </div>
        ))}
      </div>

      <div className="grid-2">
        <div className="panel">
          <h3>최근 14일 신규 게시글 추이</h3>
          <p className="sub">공지·자유·질문&답변·여행후기 4개 게시판 합산</p>
          <AreaChart />
        </div>
        <div className="panel">
          <h3>신고 처리 현황</h3>
          <p className="sub">사유별 우선순위 큐 요약</p>
          <div className="bar-row"><span className="lbl">스팸</span><div className="bar-track"><div className="bar-fill" style={{width:'70%',background:'#ff2bee'}}></div></div><span className="val">70%</span></div>
          <div className="bar-row"><span className="lbl">욕설</span><div className="bar-track"><div className="bar-fill" style={{width:'45%',background:'#90f745'}}></div></div><span className="val">45%</span></div>
          <div className="bar-row"><span className="lbl">허위정보</span><div className="bar-track"><div className="bar-fill" style={{width:'22%',background:'#5b8cff'}}></div></div><span className="val">22%</span></div>
          <div className="bar-row"><span className="lbl">기타</span><div className="bar-track"><div className="bar-fill" style={{width:'12%',background:'#c9c9c9'}}></div></div><span className="val">12%</span></div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="widget-card">
          <h4>게시판별 비중</h4>
          <div className="donut-row">
            <svg width="80" height="80" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="#eee" strokeWidth="4"/>
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="#ff2bee" strokeWidth="4" strokeDasharray="35 65" strokeDashoffset="25" strokeLinecap="round"/>
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="#90f745" strokeWidth="4" strokeDasharray="28 72" strokeDashoffset="-10" strokeLinecap="round"/>
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="#5b8cff" strokeWidth="4" strokeDasharray="20 80" strokeDashoffset="-38" strokeLinecap="round"/>
            </svg>
            <div className="donut-legend">
              <span><span className="legend-dot" style={{background:'#ff2bee'}}></span>여행후기 35%</span>
              <span><span className="legend-dot" style={{background:'#90f745'}}></span>자유게시판 28%</span>
              <span><span className="legend-dot" style={{background:'#5b8cff'}}></span>질문&답변 20%</span>
            </div>
          </div>
        </div>
        <div className="widget-card">
          <h4>최근 관리자 알림</h4>
          <div className="timeline-item"><i className="ph ph-warning-circle" style={{color:'#d1354a'}}></i>신고 임계치 초과 — 자유게시판</div>
          <div className="timeline-item"><i className="ph ph-user-plus"></i>신규 회원 42명 가입 (오늘)</div>
          <div className="timeline-item"><i className="ph ph-bell-ringing"></i>공지사항 1건 게시됨</div>
          <div className="timeline-item"><i className="ph ph-database"></i>캐시 히트율 91%로 회복</div>
        </div>
        <div className="widget-card">
          <h4>빠른 이동</h4>
          <button className="btn-secondary" style={{width:'100%',justifyContent:'center',marginBottom:8,color:'#1b1b1b',borderColor:'#1b1b1b22'}} onClick={onGoModeration}><i className="ph ph-shield-check"></i>신고 처리하러 가기</button>
          <button className="btn-secondary" style={{width:'100%',justifyContent:'center',color:'#1b1b1b',borderColor:'#1b1b1b22'}} onClick={()=>setToast('공지 작성 화면으로 이동합니다')}><i className="ph ph-megaphone"></i>공지 작성하기</button>
        </div>
      </div>

      <div className="panel">
        <h3>최근 처리 항목</h3>
        <p className="sub">회원·신고·공지 최근 활동 5건</p>
        <table className="data-table">

function DeployTrack({title, icon, stage, builds, onOpenLog, openLog}){
  const stages = ['빌드','제출','심사대기','승인'];
  const curIdx = stages.indexOf(stage);
  return (
    <div className="deploy-track">
      <h4><i className={"ph "+icon}></i>{title}</h4>
      <div style={{fontSize:11,color:'var(--ink2)'}}>현재 버전 {builds[0].ver}</div>
      <div className="stage-row">
        {stages.map((s,i)=>(
          <div key={s} className={"stage-pill"+(i<curIdx?" done":i===curIdx?" current":"")}>{s}</div>
        ))}
      </div>
      {builds.map((b,i)=>(
        <div key={i}>
          <div className="build-item">
            <span className="ver">v{b.ver}</span>
            <span><span className={"badge "+b.badge}>{b.status}</span></span>
            <span style={{color:'var(--ink2)'}}>{b.date}</span>
            <button className="filter-chip" onClick={()=>onOpenLog(title+b.ver)}>로그</button>
          </div>
          <div className={"ci-log"+(openLog===(title+b.ver)?" open":"")}>
            $ github-actions run #{482+i}<br/>
            ✓ install dependencies (12s)<br/>
            ✓ run test suite — 128 passed<br/>
            ✓ build release bundle<br/>
            ✓ upload to store — status: {b.status}
          </div>
        </div>
      ))}
    </div>
  );
}
