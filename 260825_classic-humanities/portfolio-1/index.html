<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루문장 — 고전 인문학 영상 구독 서비스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --ink:#17191c; --paper:#ffffff; --mist:#f2f2f3; --fog:#fafafb;
    --slate:#777b86; --ash:#979799; --smoke:#a3a6af; --peach:#fbe1d1; --sienna:#5d2a1a;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  .pill-filled{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:9999px;padding:14px 26px;font-size:16px;font-weight:500;transition:transform .25s cubic-bezier(.19,1,.22,1),opacity .25s;}
  .pill-filled:hover{transform:translateY(-2px);opacity:.88;}
  .pill-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:9999px;padding:14px 26px;font-size:16px;font-weight:500;transition:background .25s;}
  .pill-ghost:hover{background:var(--mist);}
  .link-arrow{font-size:16px;font-weight:500;color:var(--ink);padding:8px 0;border:none;background:none;display:inline-flex;align-items:center;gap:6px;}
  .link-arrow:hover{text-decoration:underline;}

  .card-neutral{background:var(--mist);border-radius:24px;padding:32px 28px;}
  .card-peach{background:var(--peach);color:var(--sienna);border-radius:24px;padding:40px;}
  .card-float{background:#fff;border-radius:20px;box-shadow:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @keyframes spinRing{to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

  .anim-fadeup{animation:fadeInUp .7s cubic-bezier(.19,1,.22,1) both;}
  .anim-float{animation:floatY 5s ease-in-out infinite;}
  .anim-spin{animation:spinRing .9s linear infinite;}
  .anim-shimmer{background:linear-gradient(90deg,#f2f2f3 0%,#fafafb 40%,#f2f2f3 80%);background-size:400px 100%;animation:shimmer 1.4s linear infinite;}
  .anim-pulse{animation:pulseDot 1.6s ease-in-out infinite;}

  .navlink{font-size:15px;color:var(--ink);padding:6px 0;background:none;border:none;position:relative;}
  .navlink.active::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--ink);}
  .step-num{width:36px;height:36px;border-radius:9999px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}

  .book-spine{border-radius:6px;padding:14px 8px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;writing-mode:vertical-rl;text-orientation:mixed;cursor:pointer;transition:transform .3s cubic-bezier(.19,1,.22,1),box-shadow .3s;box-shadow:2px 0 0 rgba(0,0,0,.06) inset;}
  .book-spine:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 14px 20px -8px rgba(0,0,0,.18);}

  .qcard{border-radius:12px;padding:14px 16px;border:1px solid #e9e9ea;background:#fff;cursor:pointer;transition:border-color .2s,background .2s;font-size:15px;line-height:1.5;}
  .qcard.selected{border-color:var(--ink);background:var(--fog);}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:88vw;background:#fff;box-shadow:-16px 0 40px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .4s cubic-bezier(.19,1,.22,1);z-index:60;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .scrim{position:fixed;inset:0;background:rgba(23,25,28,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s;}
  .scrim.show{opacity:1;pointer-events:auto;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:9999px;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.2);}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#ddd;border-radius:8px;}
  .hero-h1{font-size:64px;}
  @media (max-width:640px){ .hero-h1{font-size:38px;} }
</style>
</head>
<body>
<div id="app-root" style="width:100%;"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const QUOTES = [
  { id: 1, source: '논어 · 학이편', text: '배우고 때때로 익히면 또한 기쁘지 아니한가.' },
  { id: 2, source: '장자 · 소요유', text: '북쪽 바다에 물고기가 있으니 그 이름은 곤이다.' },
  { id: 3, source: '도덕경 · 1장', text: '도를 도라 할 수 있으면 늘 그러한 도가 아니다.' },
  { id: 4, source: '맹자 · 공손추', text: '사람은 모두 남에게 차마 하지 못하는 마음이 있다.' },
  { id: 5, source: '순자 · 권학편', text: '푸른빛은 쪽에서 나왔지만 쪽빛보다 더 푸르다.' },
];

const LIBRARY_ITEMS = [
  { id: 1, title: '논어, 배움의 기쁨', ep: '12화', date: '2026.08.24', tint: '#fbe1d1', quote: QUOTES[0] },
  { id: 2, title: '장자, 나비의 꿈', ep: '11화', date: '2026.08.23', tint: '#e9e4dc', quote: QUOTES[1] },
  { id: 3, title: '도덕경, 이름 없는 도', ep: '10화', date: '2026.08.22', tint: '#dfe3e6', quote: QUOTES[2] },
  { id: 4, title: '맹자, 측은지심', ep: '9화', date: '2026.08.21', tint: '#f2ded1', quote: QUOTES[3] },
  { id: 5, title: '순자, 청출어람', ep: '8화', date: '2026.08.20', tint: '#e6e6e8', quote: QUOTES[4] },
  { id: 6, title: '한비자, 법과 세', ep: '7화', date: '2026.08.19', tint: '#ece3da', quote: QUOTES[0] },
  { id: 7, title: '대학, 격물치지', ep: '6화', date: '2026.08.18', tint: '#e2e6e2', quote: QUOTES[2] },
  { id: 8, title: '중용, 치우침 없이', ep: '5화', date: '2026.08.17', tint: '#f0e6da', quote: QUOTES[3] },
];

function useIcons(deps) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, deps);
}

function Toast({ message }) {
  if (!message) return null;
  return <div className="toast anim-fadeup">{message}</div>;
}

function TopNav({ screen, setScreen, onStart }) {
  const items = [
    { id: 'home', label: '오늘의 인문학' },
    { id: 'weekly', label: '위클리 씽스' },
    { id: 'card', label: '문장 카드 공유' },
    { id: 'library', label: '나의 기' },
  ];
  return (
    <header style={{position:'sticky',top:0,zIndex:40,background:'rgba(255,255,255,.92)',backdropFilter:'blur(6px)',borderBottom:'1px solid #f0f0f1'}}>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'18px 32px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:44}}>
          <button onClick={() => setScreen('home')} style={{background:'none',border:'none',fontSize:19,fontWeight:600,letterSpacing:'-0.3px',padding:0}}>하루문장</button>
          <nav style={{display:'flex',gap:28}}>
            {items.map(it => (
              <button key={it.id} className={'navlink' + (screen===it.id?' active':'')} onClick={() => setScreen(it.id)}>{it.label}</button>
            ))}
          </nav>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <button className="link-arrow" onClick={onStart}>구독 안내 <i data-lucide="arrow-right" style={{width:14,height:14}}></i></button>
          <button className="pill-filled" style={{padding:'10px 22px',fontSize:14}} onClick={onStart}>오늘의 감상 시작</button>
        </div>
      </div>
    </header>
  );
}

function ReadingOverlay({ open, step, setStep, subscribed, setSubscribed, onClose }) {
  useIcons([open, step]);
  if (!open) return null;
  const intros = [
    { n: '01', title: '고요한 아침, 한 권의 책을 펼치듯', body: '하루문장은 매일 오전, 고전 한 편을 다섯 문장의 이야기로 열어 보입니다. 오늘은 「논어」 학이편의 한 대목입니다.' },
    { n: '02', title: '배우고 익히는 기쁨에 관하여', body: '2500년 전 공자가 제자들과 나눈 대화는 지금의 우리에게도 낯설지 않습니다. 오늘의 영상은 그 대화의 맥락을 5분 안에 짚어드립니다.' },
    { n: '03', title: '이제, 오늘의 영상으로', body: '준비가 되셨다면 다음 화면에서 5분 분량의 고전 인문학 영상이 이어집니다.' },
  ];
  return (
    <div style={{position:'fixed',inset:0,zIndex:70,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(23,25,28,.55)',padding:20}}>
      <div className="anim-fadeup" style={{width:'100%',maxWidth:640,maxHeight:'88vh',overflowY:'auto',background:'#fff',borderRadius:24,padding:'48px 44px',position:'relative'}}>
        <button onClick={onClose} style={{position:'absolute',top:20,right:20,background:'none',border:'none',color:'var(--slate)'}}>
          <i data-lucide="x" style={{width:20,height:20}}></i>
        </button>

        {step !== 'video' && (() => {
          const idx = step === 'intro1' ? 0 : step === 'intro2' ? 1 : 2;
          const s = intros[idx];
          return (
            <div key={step} className="anim-fadeup">
              <div style={{fontSize:13,color:'var(--ash)',marginBottom:18}}>{s.n} / 03</div>
              <h2 style={{fontSize:32,fontWeight:400,lineHeight:1.35,letterSpacing:'-0.5px',margin:'0 0 18px'}}>{s.title}</h2>
              <p style={{fontSize:17,lineHeight:1.7,color:'#3a3c40',margin:'0 0 40px'}}>{s.body}</p>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',gap:6}}>
                  {[0,1,2].map(i => <div key={i} style={{width:24,height:3,borderRadius:2,background:i<=idx?'var(--ink)':'#e6e6e7'}}></div>)}
                </div>
                <button className="pill-filled" onClick={() => setStep(idx===2?'video':`intro${idx+2}`)}>
                  {idx===2 ? '영상 보러가기' : '다음 페이지'}
                </button>
              </div>
            </div>
          );
        })()}

        {step === 'video' && (
          <div className="anim-fadeup">
            <div style={{fontSize:13,color:'var(--ash)',marginBottom:14}}>오늘의 영상 · 5:00</div>
            <div style={{position:'relative',borderRadius:16,overflow:'hidden',aspectRatio:'16/9',background:'#111'}}>
              <img src="https://picsum.photos/seed/classic-humanities-video/900/506" alt="오늘의 고전 인문학 영상" style={{width:'100%',height:'100%',objectFit:'cover',filter: subscribed ? 'none' : 'blur(10px) brightness(.55)'}} />
              {!subscribed && (
                <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#fff',gap:14,textAlign:'center',padding:24}}>
                  <i data-lucide="lock" style={{width:30,height:30}}></i>
                  <div style={{fontSize:16,fontWeight:500}}>구독하면 오늘의 영상을 이어볼 수 있습니다</div>
                  <button className="pill-filled" style={{background:'#fff',color:'var(--ink)',border:'1px solid #fff'}} onClick={() => setSubscribed(true)}>구독자로 미리보기</button>
                </div>
              )}
              {subscribed && (
                <div style={{position:'absolute',left:16,bottom:14,right:16,display:'flex',alignItems:'center',gap:12,color:'#fff'}}>
                  <i data-lucide="play-circle" style={{width:26,height:26}}></i>
                  <div style={{flex:1,height:3,background:'rgba(255,255,255,.35)',borderRadius:3}}><div style={{width:'38%',height:'100%',background:'#fbe1d1',borderRadius:3}}></div></div>
                  <span style={{fontSize:12}}>1:54 / 5:00</span>
                </div>
              )}
            </div>
            <div style={{marginTop:22,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:13,color:'var(--slate)'}}>{subscribed ? '구독 상태 · 이어보기 지원' : '미구독 상태 · 재생이 서버에서 차단됩니다'}</span>
              <button className="pill-ghost" onClick={onClose}>감상 마치기</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function HomeScreen({ onStart, setScreen }) {
  useIcons([]);
  return (
    <div>
      <section style={{maxWidth:1200,margin:'0 auto',padding:'88px 32px 60px',position:'relative'}}>
        <div className="anim-fadeup" style={{maxWidth:640}}>
          <div style={{fontSize:14,color:'var(--slate)',marginBottom:20,display:'flex',alignItems:'center',gap:8}}>
            <span className="anim-pulse" style={{width:7,height:7,borderRadius:9999,background:'#5d8a5d',display:'inline-block'}}></span>
            오늘, 2026년 8월 25일의 고전
          </div>
          <h1 className="hero-h1" style={{fontWeight:400,lineHeight:1.28,letterSpacing:'-0.9px',margin:'0 0 22px'}}>
            오늘의 고전,<br/>다섯 문장으로 시작합니다.
          </h1>
          <p style={{fontSize:18,color:'var(--slate)',lineHeight:1.6,margin:'0 0 34px'}}>
            하루문장은 매일 하나의 고전 인문학 영상을 서사형 인트로와 함께 전달합니다. 복잡한 커리큘럼 없이, 오늘 하루 다섯 분이면 충분합니다.
          </p>
          <div style={{display:'flex',gap:14}}>
            <button className="pill-filled" onClick={onStart}>오늘의 인문학 감상하기</button>
            <button className="pill-ghost" onClick={() => document.getElementById('subscribe-band').scrollIntoView({behavior:'smooth'})}>구독 플랜 보기</button>
          </div>
        </div>

        <div style={{position:'absolute',top:70,right:24,display:'flex',flexDirection:'column',gap:16,width:260}} className="anim-float">
          <div className="card-float" style={{padding:'16px 18px'}}>
            <div style={{fontSize:12,color:'var(--ash)',marginBottom:8}}>오늘의 콘텐츠</div>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <img src="https://picsum.photos/seed/classic-humanities-card-1/64/64" style={{width:44,height:44,borderRadius:10,objectFit:'cover'}} alt=""/>
              <div>
                <div style={{fontSize:14,fontWeight:500}}>논어, 배움의 기쁨</div>
                <div style={{fontSize:12,color:'var(--slate)'}}>5:00 · 12화</div>
              </div>
            </div>
          </div>
          <div className="card-float" style={{padding:'14px 18px',display:'flex',alignItems:'center',gap:10}}>
            <i data-lucide="flame" style={{width:18,height:18,color:'#c96a3d'}}></i>
            <div style={{fontSize:13}}>연속 감상 3일째</div>
          </div>
        </div>
      </section>

      <section style={{background:'var(--fog)',padding:'70px 32px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <h2 style={{fontSize:30,fontWeight:400,letterSpacing:'-0.4px',margin:'0 0 8px'}}>감상을 마친 뒤, 세 가지 방법으로</h2>
          <p style={{fontSize:16,color:'var(--slate)',margin:'0 0 40px'}}>오늘의 영상을 본 다음, 이렇게 이어갈 수 있습니다.</p>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(260px,1fr))',gap:20}}>
            <div className="card-neutral">
              <i data-lucide="sparkles" style={{width:22,height:22,marginBottom:16}}></i>
              <h3 style={{fontSize:20,fontWeight:600,margin:'0 0 10px'}}>위클리 씽스</h3>
              <p style={{fontSize:15,color:'#4a4d52',lineHeight:1.6,margin:'0 0 16px'}}>주 1회 짧은 설문에 답하면, 나의 생각을 정리해주는 AI 코멘트를 받아볼 수 있습니다.</p>
              <button className="link-arrow" onClick={() => setScreen('weekly')}>바로가기 <i data-lucide="arrow-right" style={{width:14,height:14}}></i></button>
            </div>
            <div className="card-neutral">
              <i data-lucide="image" style={{width:22,height:22,marginBottom:16}}></i>
              <h3 style={{fontSize:20,fontWeight:600,margin:'0 0 10px'}}>문장 카드 공유</h3>
              <p style={{fontSize:15,color:'#4a4d52',lineHeight:1.6,margin:'0 0 16px'}}>마음에 남은 문장을 골라 이미지 카드로 저장하고 SNS에 공유할 수 있습니다.</p>
              <button className="link-arrow" onClick={() => setScreen('card')}>바로가기 <i data-lucide="arrow-right" style={{width:14,height:14}}></i></button>
            </div>
            <div className="card-neutral">
              <i data-lucide="library" style={{width:22,height:22,marginBottom:16}}></i>
              <h3 style={{fontSize:20,fontWeight:600,margin:'0 0 10px'}}>나의 기</h3>
              <p style={{fontSize:15,color:'#4a4d52',lineHeight:1.6,margin:'0 0 16px'}}>지금까지 감상한 콘텐츠가 책장처럼 쌓여, 나만의 서재를 이룹니다.</p>
              <button className="link-arrow" onClick={() => setScreen('library')}>바로가기 <i data-lucide="arrow-right" style={{width:14,height:14}}></i></button>
            </div>
          </div>
        </div>
      </section>

      <section style={{maxWidth:1200,margin:'0 auto',padding:'80px 32px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1.1fr 0.9fr',gap:60,alignItems:'center'}}>
          <div>
            <h2 style={{fontSize:28,fontWeight:400,letterSpacing:'-0.3px',margin:'0 0 34px'}}>감상은 이렇게 이어집니다</h2>
            <div style={{display:'flex',flexDirection:'column',gap:26}}>
              {[
                {n:'1',t:'인트로 3페이지', d:'서사형 텍스트로 오늘 콘텐츠의 맥락을 짧게 열어드립니다.'},
                {n:'2',t:'5분 영상 감상', d:'구독 상태에 따라 잠금이 해제된 영상을 이어봅니다.'},
                {n:'3',t:'마무리 리추얼', d:'위클리 씽스 · 문장 카드 · 나의 기 중 원하는 방식으로 마무리합니다.'},
              ].map((s,i) => (
                <div key={i} style={{display:'flex',gap:16}}>
                  <div className="step-num">{s.n}</div>
                  <div>
                    <div style={{fontSize:16,fontWeight:600,marginBottom:4}}>{s.t}</div>
                    <div style={{fontSize:14,color:'var(--slate)',lineHeight:1.6}}>{s.d}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card-peach">
            <div style={{fontSize:13,marginBottom:14,opacity:.75}}>오늘의 문장</div>
            <p style={{fontSize:23,lineHeight:1.55,margin:'0 0 18px',fontWeight:500}}>“배우고 때때로 익히면 또한 기쁘지 아니한가.”</p>
            <div style={{fontSize:13,opacity:.75}}>논어 · 학이편</div>
          </div>
        </div>
      </section>

      <section style={{background:'var(--mist)',padding:'70px 32px'}}>

function WeeklyScreen() {

    }, 1200);
  }

  return (
    <div style={{maxWidth:880,margin:'0 auto',padding:'64px 32px'}}>
      <h1 className="anim-fadeup" style={{fontSize:32,fontWeight:400,letterSpacing:'-0.4px',margin:'0 0 8px'}}>위클리 씽스</h1>
      <p style={{fontSize:15,color:'var(--slate)',margin:'0 0 40px'}}>주 1회, 짧은 설문에 답하면 AI가 오늘의 생각을 정리해드립니다.</p>

      {!result && !loading && (
        <div className="anim-fadeup card-neutral" style={{padding:'36px'}}>
          {QUESTIONS.map(q => (
            <div key={q.id} style={{marginBottom:26}}>
              <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>{q.label}</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                {q.options.map(opt => (
                  <button key={opt}
                    onClick={() => setAnswers(a => ({...a,[q.id]:opt}))}
                    className="pill-ghost"
                    style={{padding:'10px 18px',fontSize:14,background: answers[q.id]===opt ? 'var(--ink)':'transparent',color: answers[q.id]===opt ? '#fff':'var(--ink)'}}>

          <div style={{marginBottom:26}}>
            <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>자유롭게 남기고 싶은 생각이 있다면</div>
            <textarea value={note} onChange={e=>setNote(e.target.value)} rows={3} placeholder="이번 주, 마음에 남은 생각을 적어주세요" style={{width:'100%',border:'1px solid #e3e3e4',borderRadius:16,padding:16,fontSize:14,resize:'vertical'}}></textarea>

      {loading && (
        <div className="card-neutral" style={{padding:'40px',display:'flex',flexDirection:'column',gap:14}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <i data-lucide="loader-2" className="anim-spin" style={{width:18,height:18}}></i>
            <span style={{fontSize:14,color:'var(--slate)'}}>AI가 이번 주 코멘트를 작성하고 있습니다…</span>
          </div>
          <div className="anim-shimmer" style={{height:16,borderRadius:8}}></div>
          <div className="anim-shimmer" style={{height:16,borderRadius:8,width:'80%'}}></div>
          <div className="anim-shimmer" style={{height:16,borderRadius:8,width:'60%'}}></div>
        </div>
      )}

      {result && !loading && (
        <div className="anim-fadeup card-peach">
          <div style={{fontSize:13,marginBottom:14,opacity:.75}}>2026년 34주차 · AI 코멘트</div>
          <p style={{fontSize:17,lineHeight:1.75,margin:0}}>{result}</p>
        </div>
      )}

      <div style={{marginTop:56}}>
        <h2 style={{fontSize:20,fontWeight:600,margin:'0 0 18px'}}>지난 기록</h2>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {history.map((h,i) => (
            <div key={i}>
              <button onClick={() => setOpenHistory(openHistory===i?null:i)} style={{width:'100%',textAlign:'left',background:'var(--fog)',border:'none',borderRadius:14,padding:'16px 18px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:14,fontWeight:500}}>{h.week}</span>
                <i data-lucide={openHistory===i?'chevron-up':'chevron-down'} style={{width:16,height:16}}></i>
              </button>
              {openHistory===i && (
                <div className="anim-fadeup" style={{padding:'14px 18px',fontSize:14,color:'#4a4d52',lineHeight:1.7}}>{h.comment}</div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function CardScreen({ setToast }) {
  const [selected, setSelected] = useState(QUOTES[0]);
  const [shareOpen, setShareOpen] = useState(false);
  const canvasRef = useRef(null);
  useIcons([selected, shareOpen]);

  function download() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 1000;
    ctx.fillStyle = '#fbe1d1'; ctx.fillRect(0,0,800,1000);
    ctx.fillStyle = '#5d2a1a';
    ctx.font = '400 15px sans-serif';
    ctx.fillText('오늘의 문장', 56, 90);
    ctx.font = '500 40px sans-serif';
    wrapText(ctx, `“${selected.text}”`, 56, 200, 680, 54);
    ctx.font = '400 16px sans-serif';
    ctx.fillText(selected.source, 56, 920);
    ctx.fillText('하루문장', 56, 950);
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = `하루문장-문장카드-${selected.id}.png`; a.click();
    setToast('이미지가 다운로드되었습니다');
    setTimeout(()=>setToast(null), 2200);
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split('');
    let line = '', cy = y;
    for (let i=0;i<words.length;i++){
      const test = line + words[i];
      if (ctx.measureText(test).width > maxWidth && line) { ctx.fillText(line, x, cy); line = words[i]; cy += lineHeight; }
      else line = test;
    }
    ctx.fillText(line, x, cy);
  }
  function shareVia(channel){
    setShareOpen(false);
    setToast(channel==='링크 복사' ? '공유 링크가 복사되었습니다' : `${channel} 공유 창이 열립니다`);
    setTimeout(()=>setToast(null), 2200);
  }

  return (
    <div style={{maxWidth:1000,margin:'0 auto',padding:'64px 32px'}}>
      <h1 className="anim-fadeup" style={{fontSize:32,fontWeight:400,letterSpacing:'-0.4px',margin:'0 0 8px'}}>문장 카드 공유</h1>
      <p style={{fontSize:15,color:'var(--slate)',margin:'0 0 40px'}}>오늘 감상한 콘텐츠에서 인상 깊은 문장을 골라 카드로 저장해보세요.</p>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:44}}>
        <div>
          <div style={{fontSize:13,color:'var(--ash)',marginBottom:12}}>오늘의 문장 후보</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {QUOTES.map(q => (
              <div key={q.id} className={'qcard' + (selected.id===q.id?' selected':'')} onClick={() => setSelected(q)}>
                <div style={{fontSize:12,color:'var(--ash)',marginBottom:6}}>{q.source}</div>
                {q.text}
              </div>
            ))}
          </div>
        </div>

        <div>
          <div style={{fontSize:13,color:'var(--ash)',marginBottom:12}}>카드 미리보기</div>
          <div key={selected.id} className="card-peach anim-fadeup" style={{aspectRatio:'4/5',display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
            <div style={{fontSize:13,opacity:.75}}>오늘의 문장</div>
            <p style={{fontSize:24,lineHeight:1.55,fontWeight:500,margin:0}}>“{selected.text}”</p>
            <div>
              <div style={{fontSize:13,opacity:.75,marginBottom:4}}>{selected.source}</div>
              <div style={{fontSize:13,opacity:.75}}>하루문장</div>
            </div>
          </div>
          <div style={{display:'flex',gap:12,marginTop:18,position:'relative'}}>
            <button className="pill-filled" onClick={download}><i data-lucide="download" style={{width:15,height:15,marginRight:6,verticalAlign:'-3px'}}></i>다운로드</button>
            <button className="pill-ghost" onClick={() => setShareOpen(s=>!s)}><i data-lucide="share-2" style={{width:15,height:15,marginRight:6,verticalAlign:'-3px'}}></i>공유하기</button>
            {shareOpen && (
              <div className="anim-fadeup card-float" style={{position:'absolute',top:'110%',left:150,padding:'10px',display:'flex',flexDirection:'column',gap:2,minWidth:170,zIndex:20}}>
                {['카카오톡','인스타그램','링크 복사'].map(c => (
                  <button key={c} onClick={() => shareVia(c)} style={{background:'none',border:'none',textAlign:'left',padding:'10px 12px',fontSize:14,borderRadius:10}}>{c}</button>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
      <canvas ref={canvasRef} style={{display:'none'}}></canvas>
    </div>
  );
}

function LibraryScreen({ setToast }) {
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('latest');
  const [selected, setSelected] = useState(null);
  useIcons([selected]);

  let items = LIBRARY_ITEMS.filter(it => it.title.includes(query));
  items = sort==='latest' ? items : [...items].sort((a,b)=>a.title.localeCompare(b.title));

  function saveShelf(){
    setToast('책장 이미지가 저장되었습니다');
    setTimeout(()=>setToast(null), 2200);
  }

  return (
    <div style={{maxWidth:1120,margin:'0 auto',padding:'64px 32px',position:'relative'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:30,flexWrap:'wrap',gap:16}}>
        <div>
          <h1 className="anim-fadeup" style={{fontSize:32,fontWeight:400,letterSpacing:'-0.4px',margin:'0 0 8px'}}>나의 기</h1>
          <p style={{fontSize:15,color:'var(--slate)',margin:0}}>지금까지 감상한 고전 인문학이 책장처럼 쌓입니다.</p>
        </div>
        <button className="pill-ghost" onClick={saveShelf}><i data-lucide="camera" style={{width:15,height:15,marginRight:6,verticalAlign:'-3px'}}></i>책장 이미지로 저장</button>
      </div>

      <div style={{display:'flex',gap:12,marginBottom:30}}>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:8,border:'1px solid #e3e3e4',borderRadius:9999,padding:'10px 16px'}}>
          <i data-lucide="search" style={{width:15,height:15,color:'var(--ash)'}}></i>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="콘텐츠 제목 검색" style={{border:'none',outline:'none',fontSize:14,flex:1}}/>
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{border:'1px solid #e3e3e4',borderRadius:9999,padding:'10px 18px',fontSize:14}}>
          <option value="latest">최신순</option>
          <option value="title">제목순</option>
        </select>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(84px,1fr))',gap:14}}>
        {items.map(it => (
          <div key={it.id} className="book-spine" style={{background:it.tint}} onClick={() => setSelected(it)}>
            <span style={{fontSize:13,fontWeight:600}}>{it.title}</span>
          </div>
        ))}
      </div>

      <div className={'scrim' + (selected?' show':'')} onClick={() => setSelected(null)}></div>
      <div className={'drawer' + (selected?' open':'')}>
        {selected && (
          <div style={{padding:'32px'}}>
            <button onClick={() => setSelected(null)} style={{background:'none',border:'none',marginBottom:20}}><i data-lucide="x" style={{width:18,height:18}}></i></button>
            <div style={{width:'100%',height:120,borderRadius:14,background:selected.tint,marginBottom:20}}></div>
            <h3 style={{fontSize:20,fontWeight:600,margin:'0 0 6px'}}>{selected.title}</h3>
            <div style={{fontSize:13,color:'var(--slate)',marginBottom:22}}>{selected.ep} · {selected.date} 감상</div>
            <div className="card-peach" style={{padding:22}}>
              <div style={{fontSize:12,marginBottom:8,opacity:.75}}>연결된 문장 카드</div>
              <p style={{fontSize:15,lineHeight:1.6,margin:0}}>“{selected.quote.text}”</p>
            </div>
            <button className="pill-ghost" style={{width:'100%',marginTop:20}} onClick={saveShelf}>감상 기록 카드 저장</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('home');
  const [readingOpen, setReadingOpen] = useState(false);
  const [readingStep, setReadingStep] = useState('intro1');
  const [subscribed, setSubscribed] = useState(false);
  const [toast, setToast] = useState(null);

  function startReading(){ setReadingStep('intro1'); setReadingOpen(true); }

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}} data-archetype="topnav-hero">
      <TopNav screen={screen} setScreen={setScreen} onStart={startReading} />
      <main style={{flex:1,width:'100%'}}>
        {screen==='home' && <HomeScreen onStart={startReading} setScreen={setScreen} />}
        {screen==='weekly' && <WeeklyScreen />}
        {screen==='card' && <CardScreen setToast={setToast} />}
        {screen==='library' && <LibraryScreen setToast={setToast} />}
      </main>
      <ReadingOverlay open={readingOpen} step={readingStep} setStep={setReadingStep} subscribed={subscribed} setSubscribed={setSubscribed} onClose={() => setReadingOpen(false)} />
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
