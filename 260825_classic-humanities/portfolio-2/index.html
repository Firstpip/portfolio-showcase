<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루문장 운영 콘솔 — 고전 인문학 콘텐츠 운영</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root{
    --paper:#f4f1ea; --obsidian:#000000; --oxblood:#a02d25;
    --bg:#0d0d0d; --surface:#181818; --surface2:#212121;
    --line:#2c2c2c; --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--paper);}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  table{border-collapse:collapse;width:100%;}

  .btn-pill{border-radius:75px;padding:10px 26px;font-size:14px;font-weight:500;border:1px solid var(--paper);background:transparent;color:var(--paper);transition:opacity .3s cubic-bezier(.19,1,.22,1);}
  .btn-pill:hover{opacity:.7;}
  .btn-pill.filled{background:var(--paper);color:#0d0d0d;}
  .btn-pill.danger{border-color:var(--oxblood);color:var(--oxblood);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:0;}
  .hairline{border:1px solid var(--line);}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseLive{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes spinLoader{to{transform:rotate(360deg);}}

  .anim-fade{animation:fadeIn .4s ease both;}
  .anim-slide{animation:slideIn .45s cubic-bezier(.19,1,.22,1) both;}
  .anim-pulse{animation:pulseLive 1.5s ease-in-out infinite;}
  .anim-spin{animation:spinLoader .9s linear infinite;}
  .bar{transform-origin:bottom;animation:barGrow .6s cubic-bezier(.19,1,.22,1) both;}

  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:14px;color:var(--muted);border-radius:0;border-left:2px solid transparent;transition:color .2s,border-color .2s;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;}
  .sidebar-link:hover{color:var(--paper);}
  .sidebar-link.active{color:var(--paper);border-left-color:var(--oxblood);background:rgba(160,45,37,.08);}
  .sidebar-title{font-size:11px;letter-spacing:.06em;color:#6d6d6d;text-transform:uppercase;padding:0 14px;margin:22px 0 8px;}

  .stat-card{background:var(--surface);border:1px solid var(--line);padding:22px 22px;display:flex;flex-direction:column;gap:10px;min-height:112px;}
  .stat-label{font-size:12px;color:var(--muted);}
  .stat-value{font-size:30px;font-weight:600;letter-spacing:-0.5px;}
  .stat-delta{font-size:12px;}
  .stat-delta.pos{color:#7fbf7f;}
  .stat-delta.neg{color:#d17a72;}

  .tab-bar{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{background:none;border:none;color:var(--muted);font-size:14px;padding:10px 2px;border-bottom:2px solid transparent;}
  .tab.active{color:var(--paper);border-bottom-color:var(--oxblood);}

  .badge{display:inline-block;padding:3px 10px;border-radius:75px;font-size:11px;border:1px solid;}
  .badge.ok{color:#7fbf7f;border-color:#3a5a3a;}
  .badge.warn{color:#d9a256;border-color:#5a4a2c;}
  .badge.fail{color:#d17a72;border-color:#5a2c2c;}

  .data-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;}
  .data-table td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .data-table tr:hover td{background:rgba(255,255,255,.02);}

  .cal-cell{border:1px solid var(--line);min-height:96px;padding:8px;position:relative;}
  .cal-block{background:var(--surface2);border-left:2px solid var(--oxblood);padding:6px 8px;font-size:11.5px;border-radius:0;cursor:grab;}
  .cal-block.published{border-left-color:#7fbf7f;}
  .cal-block.warn{border-left-color:#d9a256;}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:90vw;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .4s cubic-bezier(.19,1,.22,1);z-index:60;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s;}
  .scrim.show{opacity:1;pointer-events:auto;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--paper);color:#0d0d0d;padding:12px 24px;border-radius:75px;font-size:13px;z-index:80;}

  .hero-band{position:relative;overflow:hidden;border:1px solid var(--line);padding:52px 44px;margin-bottom:24px;background:linear-gradient(160deg,#141414,#0d0d0d);}
  .hero-gradient{position:absolute;inset:0;background:linear-gradient(115deg, rgba(160,224,171,.16), rgba(255,172,46,.14) 45%, rgba(165,45,37,.22));pointer-events:none;}
  .hero-quote{position:relative;z-index:1;font-size:56px;font-weight:300;line-height:1.14;margin:0;letter-spacing:-0.5px;}
  .hero-wave{position:absolute;right:0;bottom:0;width:52%;max-width:420px;height:110px;opacity:.85;}

  .editor-shell{display:grid;grid-template-columns:220px 1fr 320px;gap:20px;align-items:start;}
  .canvas-left-rail,.canvas-right-panel{background:var(--surface);border:1px solid var(--line);padding:20px 16px;}
  .rail-title{font-size:11px;letter-spacing:.06em;color:#6d6d6d;text-transform:uppercase;margin:0 0 10px;}
  .rail-item{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;border-left:2px solid transparent;color:var(--muted);font-size:13.5px;padding:8px 10px;text-align:left;border-radius:0;}
  .rail-item:hover{color:var(--paper);}
  .rail-item.active{color:var(--paper);border-left-color:var(--oxblood);background:rgba(160,45,37,.08);}
  .rail-count{font-size:11px;color:var(--muted);}
  .rail-metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 10px;}
  .rail-metric strong{color:var(--paper);font-weight:600;}
  .rail-metric.warn strong{color:#d17a72;}
  .cal-cell.dim{opacity:.32;}
  .cal-cell.selected{outline:1px solid var(--oxblood);outline-offset:-1px;}
  @media (max-width:900px){
    .editor-shell{grid-template-columns:1fr;}
    .hero-quote{font-size:38px;}
    .hero-wave{display:none;}
  }

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#333;}
</style>
</head>
<body>
<div id="app-root" style="width:100%;"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function Sparkline({ points, color }){
  const w=68,h=26; const max=Math.max(...points), min=Math.min(...points);
  const path = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/((max-min)||1))*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return <svg width={w} height={h}><path d={path} fill="none" stroke={color} strokeWidth="1.6"/></svg>;
}

function BarChart({ data, color }){
  const max = Math.max(...data.map(d=>d.v));
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:8,height:140,padding:'0 4px'}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <div className="bar" style={{width:'100%',height:(d.v/max*110)+'px',background:color,animationDelay:(i*0.05)+'s'}}></div>
          <span style={{fontSize:10,color:'var(--muted)'}}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

const CAL_DAYS = Array.from({length:30},(_,i)=>i+1);
const INITIAL_SLOTS = {
  3:{title:'논어, 배움의 기쁨', status:'published'}, 7:{title:'장자, 나비의 꿈', status:'published'},
  11:{title:'도덕경, 이름 없는 도', status:'published'}, 15:{title:'맹자, 측은지심', status:'scheduled'},
  19:{title:'순자, 청출어람', status:'scheduled'}, 23:{title:'한비자, 법과 세', status:'warn'},
  27:{title:'대학, 격물치지', status:'scheduled'},
};

const LOG_ROWS = [
  {date:'2026.08.24',title:'논어, 배움의 기쁨',status:'ok',views:1284},
  {date:'2026.08.23',title:'장자, 나비의 꿈',status:'ok',views:1140},
  {date:'2026.08.22',title:'도덕경, 이름 없는 도',status:'ok',views:1392},
  {date:'2026.08.21',title:'맹자, 측은지심',status:'ok',views:998},
  {date:'2026.08.20',title:'순자, 청출어람',status:'warn',views:0},
  {date:'2026.08.19',title:'한비자, 법과 세',status:'ok',views:1466},
  {date:'2026.08.18',title:'대학, 격물치지',status:'ok',views:1051},
];

const SUBS_TABLE = [
  {rank:1,title:'논어, 배움의 기쁨',viewers:1392,completion:'82%'},
  {rank:2,title:'한비자, 법과 세',viewers:1466,completion:'77%'},
  {rank:3,title:'도덕경, 이름 없는 도',viewers:1392,completion:'74%'},
  {rank:4,title:'장자, 나비의 꿈',viewers:1140,completion:'71%'},
  {rank:5,title:'대학, 격물치지',viewers:1051,completion:'68%'},
  {rank:6,title:'맹자, 측은지심',viewers:998,completion:'65%'},
];

const NOTI_ROWS = [
  {target:'전체 구독자 (4,210명)',channel:'이메일',content:'논어, 배움의 기쁨 발행 안내',status:'ok',sent:'08.24 07:00'},
  {target:'전체 구독자 (4,180명)',channel:'카카오 알림톡',content:'장자, 나비의 꿈 발행 안내',status:'ok',sent:'08.23 07:00'},
  {target:'미시청 구독자 (612명)',channel:'카카오 알림톡',content:'도덕경 콘텐츠 리마인드',status:'fail',sent:'08.22 19:00'},
  {target:'전체 구독자 (4,150명)',channel:'이메일',content:'맹자, 측은지심 발행 안내',status:'ok',sent:'08.21 07:00'},
  {target:'신규 구독자 (88명)',channel:'이메일',content:'구독 환영 메시지',status:'ok',sent:'08.21 09:20'},
  {target:'전체 구독자 (4,120명)',channel:'카카오 알림톡',content:'순자, 청출어람 발행 안내',status:'fail',sent:'08.20 07:00'},
];

const BILLING_ROWS = [
  {id:'PAY-8841',user:'김민수',amount:'9,900원',status:'ok',date:'2026.08.24'},
  {id:'PAY-8840',user:'이지은',amount:'9,900원',status:'ok',date:'2026.08.24'},
  {id:'PAY-8839',user:'박서준',amount:'9,900원',status:'fail',date:'2026.08.23'},
  {id:'PAY-8838',user:'최유나',amount:'9,900원',status:'refund',date:'2026.08.23'},
  {id:'PAY-8837',user:'정하늘',amount:'9,900원',status:'ok',date:'2026.08.22'},
  {id:'PAY-8836',user:'한도윤',amount:'9,900원',status:'ok',date:'2026.08.22'},
  {id:'PAY-8835',user:'오세훈',amount:'9,900원',status:'fail',date:'2026.08.21'},
];

function PulseWave(){
  return (
    <svg viewBox="0 0 400 90" className="hero-wave" preserveAspectRatio="none">
      <defs>
        <linearGradient id="iridescent" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="rgb(160,224,171)"/>
          <stop offset="50%" stopColor="rgb(255,172,46)"/>
          <stop offset="100%" stopColor="rgb(165,45,37)"/>
        </linearGradient>
      </defs>
      <path d="M0,50 C36,14 64,86 100,50 C136,14 164,86 200,50 C236,14 264,86 300,50 C328,26 352,64 400,44" fill="none" stroke="url(#iridescent)" strokeWidth="2"/>
    </svg>
  );
}

function Toast({ message }){
  if (!message) return null;
  return <div className="toast anim-slide">{message}</div>;
}

function Sidebar({ screen, setScreen }){
  const groups = [
    { title:'콘텐츠', items:[{id:'main',label:'발행 스케줄',icon:'ph-calendar-blank'}] },
    { title:'운영', items:[
      {id:'subscriber-analytics',label:'구독자 분석',icon:'ph-chart-line-up'},
      {id:'notification-console',label:'알림 발송 관리',icon:'ph-bell-ringing'},
      {id:'billing-admin',label:'정산 관리',icon:'ph-receipt'},
    ]},
  ];
  return (
    <aside className="sidebar" style={{width:240,minWidth:240,borderRight:'1px solid var(--line)',position:'fixed',top:0,left:0,bottom:0,overflowY:'auto',background:'var(--surface)'}}>
      <div style={{padding:'22px 18px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10}}>
        <span className="anim-pulse" style={{width:7,height:7,borderRadius:9999,background:'var(--oxblood)',display:'inline-block'}}></span>
        <div>
          <div style={{fontSize:14,fontWeight:600}}>하루문장 콘솔</div>
          <div style={{fontSize:11,color:'var(--muted)'}}>Production</div>
        </div>
      </div>
      {groups.map(g => (
        <div key={g.title}>
          <div className="sidebar-title">{g.title}</div>
          {g.items.map(it => (
            <button key={it.id} className={'sidebar-link' + (screen===it.id?' active':'')} onClick={() => setScreen(it.id)}>
              <i className={'ph ' + it.icon}></i>{it.label}
            </button>
          ))}
        </div>
      ))}
    </aside>
  );
}

function PageHeader({ title, actionLabel, onAction, meta, setToast }){
  const [range, setRange] = useState('이번 주');
  const ranges = ['오늘','이번 주','이번 달'];
  function cycleRange(){
    const next = ranges[(ranges.indexOf(range)+1) % ranges.length];
    setRange(next);
    if (setToast) { setToast(`${next} 기준으로 조회합니다`); setTimeout(()=>setToast(null),1600); }
  }
  return (
    <header style={{marginBottom:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <h1 style={{fontSize:24,fontWeight:600,margin:0,letterSpacing:'-0.3px'}}>{title}</h1>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-pill" onClick={cycleRange}>{range}</button>
          {actionLabel && <button className="btn-pill filled" onClick={onAction}>{actionLabel}</button>}
        </div>
      </div>
      <div style={{fontSize:12,color:'var(--muted)'}}>{meta}</div>
    </header>
  );
}

function ScheduleScreen({ setToast }){
  const [slots, setSlots] = useState(INITIAL_SLOTS);
  const [tab, setTab] = useState('cal');
  const [dragDay, setDragDay] = useState(null);
  const [statusFilter, setStatusFilter] = useState('all');
  const [selectedDay, setSelectedDay] = useState(3);

  function onDrop(day){
    if (dragDay==null || !slots[dragDay] || slots[day]) { setDragDay(null); return; }
    setSlots(s => { const n={...s}; n[day]=n[dragDay]; delete n[dragDay]; return n; });
    setToast('발행 예약이 갱신되었습니다');
    setTimeout(()=>setToast(null),2000);
    setDragDay(null);
  }

  const statusCounts = {
    published: Object.values(slots).filter(s=>s.status==='published').length,
    scheduled: Object.values(slots).filter(s=>s.status==='scheduled').length,
    warn: Object.values(slots).filter(s=>s.status==='warn').length,
  };
  const selected = slots[selectedDay] ? { day: selectedDay, ...slots[selectedDay] } : null;

  return (
    <div data-composition="editor-canvas">
      <div className="hero-band anim-fade">
        <div className="hero-gradient"></div>
        <div style={{position:'relative',zIndex:1}}>
          <div style={{fontSize:11,color:'rgba(255,255,255,.7)',marginBottom:14,textTransform:'uppercase',letterSpacing:'.08em'}}>오늘의 문장 · 구독자 발송 예정</div>
          <p className="hero-quote">배우고 때때로<br/>익히면.</p>
          <div style={{display:'flex',gap:10,marginTop:26}}>
            <button className="btn-pill filled" onClick={()=>{ setToast('콘텐츠 등록 폼이 열립니다'); setTimeout(()=>setToast(null),1800); }}>신규 콘텐츠 등록</button>
            <button className="btn-pill" onClick={()=>setTab(tab==='cal'?'log':'cal')}>{tab==='cal' ? '발행 로그 보기' : '캘린더 보기'}</button>
          </div>
        </div>
        <PulseWave />
      </div>

      <div className="editor-shell">
        <aside className="canvas-left-rail">
          <div className="rail-title">발행 상태</div>
          {[
            { key:'all', label:'전체', count: CAL_DAYS.filter(d=>slots[d]).length },
            { key:'published', label:'발행완료', count: statusCounts.published },
            { key:'scheduled', label:'예약', count: statusCounts.scheduled },
            { key:'warn', label:'점검 필요', count: statusCounts.warn },
          ].map(f => (
            <button key={f.key} className={'rail-item'+(statusFilter===f.key?' active':'')} onClick={()=>setStatusFilter(f.key)}>
              <span>{f.label}</span><span className="rail-count">{f.count}</span>
            </button>
          ))}
          <div className="rail-title" style={{marginTop:26}}>운영 지표</div>
          <div className="rail-metric"><span>활성 구독자</span><strong>4,210</strong></div>
          <div className="rail-metric"><span>발행 성공률</span><strong>96%</strong></div>
          <div className="rail-metric warn"><span>발행 누락</span><strong>1건</strong></div>
        </aside>

        <div className="canvas-center">
          <div className="tab-bar">
            <button className={'tab'+(tab==='cal'?' active':'')} onClick={()=>setTab('cal')}>월간 캘린더</button>
            <button className={'tab'+(tab==='log'?' active':'')} onClick={()=>setTab('log')}>발행 로그</button>
          </div>

          {tab==='cal' && (
            <div className="anim-fade">
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>콘텐츠를 드래그해 날짜를 재배정하거나 클릭해 상세를 확인합니다.</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7, 1fr)'}}>
                {CAL_DAYS.map(day => {
                  const slot = slots[day];
                  const dimmed = statusFilter!=='all' && (!slot || slot.status!==statusFilter);
                  const overdue = day < 25 && !slot;
                  return (
                    <div key={day} className={'cal-cell'+(dimmed?' dim':'')+(selectedDay===day?' selected':'')}
                      onDragOver={e=>e.preventDefault()}
                      onDrop={()=>onDrop(day)}
                      onClick={()=>setSelectedDay(day)}>
                      <div style={{fontSize:11,color:'var(--muted)',marginBottom:6}}>{day}일{overdue && <span style={{color:'#d9a256',marginLeft:4}}>· 미배정</span>}</div>
                      {slot && (
                        <div className={'cal-block '+slot.status} draggable onDragStart={()=>setDragDay(day)}>
                          {slot.title}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {tab==='log' && (
            <div className="anim-fade panel">
              <table className="data-table">
                <thead><tr><th>발행일</th><th>콘텐츠</th><th>상태</th><th>조회수</th><th></th></tr></thead>
                <tbody>
                  {LOG_ROWS.map((r,i)=>(
                    <tr key={i}>
                      <td>{r.date}</td><td>{r.title}</td>
                      <td><span className={'badge '+(r.status==='ok'?'ok':'warn')}>{r.status==='ok'?'발행완료':'발행 누락'}</span></td>
                      <td>{r.views.toLocaleString()}</td>
                      <td><button className="btn-pill" style={{padding:'4px 14px',fontSize:12}} onClick={()=>setToast(r.title+' 상세를 확인합니다')}>상세</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <aside className="canvas-right-panel">
          <div className="rail-title">선택한 콘텐츠</div>
          {selected ? (
            <div className="anim-fade">
              <h3 style={{fontSize:18,fontWeight:600,margin:'0 0 6px'}}>{selected.title}</h3>
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:20}}>{selected.day}일 발행 · {selected.status==='published'?'완료':selected.status==='warn'?'점검 필요':'예약'}</div>
              <div className="panel" style={{padding:18,marginBottom:16}}>
                <div style={{fontSize:12,color:'var(--muted)',marginBottom:6}}>상태</div>
                <span className={'badge '+(selected.status==='published'?'ok':selected.status==='warn'?'fail':'warn')}>
                  {selected.status==='published'?'발행완료':selected.status==='warn'?'점검 필요':'예약'}
                </span>
              </div>
              <div className="panel" style={{padding:18,marginBottom:16}}>
                <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>발행 채널</div>
                <div style={{display:'flex',flexDirection:'column',gap:8,fontSize:13}}>
                  <div style={{display:'flex',justifyContent:'space-between'}}><span>이메일</span><span className="badge ok">활성</span></div>
                  <div style={{display:'flex',justifyContent:'space-between'}}><span>카카오 알림톡</span><span className="badge ok">활성</span></div>
                </div>
              </div>
              <button className="btn-pill" style={{width:'100%'}} onClick={()=>{ setToast('발행 정보가 갱신되었습니다'); setTimeout(()=>setToast(null),1800); }}>발행 정보 수정</button>
            </div>
          ) : (
            <div style={{fontSize:13,color:'var(--muted)'}}>캘린더에서 콘텐츠를 선택하면 상세 정보가 표시됩니다.</div>
          )}
        </aside>
      </div>
    </div>
  );
}

function SubscriberAnalyticsScreen({ setToast }){
  const [period, setPeriod] = useState('주간');
  const trend = period==='주간' ? [{label:'월',v:3820},{label:'화',v:3910},{label:'수',v:3980},{label:'목',v:4040},{label:'금',v:4110},{label:'토',v:4170},{label:'일',v:4210}]
    : [{label:'1주',v:3600},{label:'2주',v:3820},{label:'3주',v:4010},{label:'4주',v:4210}];

  return (
    <div>
      <PageHeader title="구독자 분석" meta="신규·해지 구독자 추이와 콘텐츠별 시청 현황" setToast={setToast} />
      <section style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:14,marginBottom:28}}>
        <div className="stat-card">
          <div className="stat-label">신규 구독자</div>
          <div className="stat-value">128</div>
          <div className="stat-delta pos">이번 주</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">해지 구독자</div>
          <div className="stat-value">14</div>
          <div className="stat-delta neg">이번 주</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">활성 구독자</div>
          <div className="stat-value">4,210</div>
          <div className="stat-delta pos">+82 순증가</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">정기결제 활성 건수</div>
          <div className="stat-value">4,102</div>
          <div className="stat-delta pos">전체의 97.4%</div>
        </div>
      </section>

      <div className="tab-bar">
        {['주간','월간'].map(p => (
          <button key={p} className={'tab'+(period===p?' active':'')} onClick={()=>setPeriod(p)}>{p} 추이</button>
        ))}
      </div>

      <div className="panel anim-fade" style={{padding:'24px',marginBottom:24}}>
        <div style={{fontSize:13,color:'var(--muted)',marginBottom:14}}>활성 구독자 추이</div>
        <BarChart key={period} data={trend} color="#a02d25" />
      </div>

      <div className="panel">
        <div style={{padding:'16px 18px',fontSize:13,color:'var(--muted)',borderBottom:'1px solid var(--line)'}}>콘텐츠별 시청 순위</div>
        <table className="data-table">
          <thead><tr><th>순위</th><th>콘텐츠</th><th>조회수</th><th>완주율</th></tr></thead>
          <tbody>
            {SUBS_TABLE.map(r=>(
              <tr key={r.rank}><td>{r.rank}</td><td>{r.title}</td><td>{r.viewers.toLocaleString()}</td><td>{r.completion}</td></tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function NotificationConsoleScreen({ setToast }){
  const [channel, setChannel] = useState('전체');
  const [rows, setRows] = useState(NOTI_ROWS);
  const filtered = channel==='전체' ? rows : rows.filter(r=>r.channel===channel);

  function retry(idx){
    setRows(rs => rs.map((r,i)=> i===idx ? {...r, status:'ok'} : r));
    setToast('재전송 큐에 등록되었습니다');
    setTimeout(()=>setToast(null),2000);
  }

  return (
    <div>
      <PageHeader title="알림 발송 관리" meta="이메일·카카오 알림톡 발송 이력과 실패 재처리" setToast={setToast} />
      <section style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:14,marginBottom:28}}>
        <div className="stat-card"><div className="stat-label">대기</div><div className="stat-value">3</div></div>
        <div className="stat-card"><div className="stat-label">처리중</div><div className="stat-value">1</div></div>
        <div className="stat-card"><div className="stat-label">실패</div><div className="stat-value">{filtered.filter(r=>r.status==='fail').length}</div></div>
        <div className="stat-card"><div className="stat-label">채널별 성공률</div><div className="stat-value">94%</div></div>
      </section>

      <div className="tab-bar">
        {['전체','이메일','카카오 알림톡'].map(c=>(
          <button key={c} className={'tab'+(channel===c?' active':'')} onClick={()=>setChannel(c)}>{c}</button>
        ))}
      </div>

      <div className="panel anim-fade">
        <table className="data-table">
          <thead><tr><th>대상</th><th>채널</th><th>내용</th><th>상태</th><th>발송 시각</th><th></th></tr></thead>
          <tbody>
            {filtered.map((r,i)=>(
              <tr key={i}>
                <td>{r.target}</td><td>{r.channel}</td><td>{r.content}</td>
                <td><span className={'badge '+(r.status==='ok'?'ok':'fail')}>{r.status==='ok'?'성공':'실패'}</span></td>
                <td>{r.sent}</td>
                <td>{r.status==='fail' && <button className="btn-pill" style={{padding:'4px 14px',fontSize:12}} onClick={()=>retry(rows.indexOf(r))}>재시도</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function BillingAdminScreen({ setToast }){
  const [rows, setRows] = useState(BILLING_ROWS);
  const [filter, setFilter] = useState('전체');
  const filtered = filter==='전체' ? rows : filter==='실패' ? rows.filter(r=>r.status==='fail') : rows.filter(r=>r.status==='refund');

  function approveRefund(id){
    setRows(rs => rs.map(r => r.id===id ? {...r, status:'ok'} : r));
    setToast('환불이 승인되어 정산 상태가 갱신되었습니다');
    setTimeout(()=>setToast(null),2000);
  }
  function exportCsv(){
    setToast('월별 정산 요약을 CSV로 내보냈습니다');
    setTimeout(()=>setToast(null),2000);
  }

  return (
    <div>
      <PageHeader title="정산 관리" actionLabel="CSV 내보내기" onAction={exportCsv} meta="구독 결제·환불 내역과 정기결제 상태" setToast={setToast} />
      <section style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:14,marginBottom:28}}>
        <div className="stat-card"><div className="stat-label">이번 달 정산액</div><div className="stat-value">4,102만</div></div>
        <div className="stat-card"><div className="stat-label">결제 실패 건수</div><div className="stat-value">{rows.filter(r=>r.status==='fail').length}</div></div>
        <div className="stat-card"><div className="stat-label">환불 요청</div><div className="stat-value">{rows.filter(r=>r.status==='refund').length}</div></div>
        <div className="stat-card"><div className="stat-label">재시도 예정</div><div className="stat-value">2</div></div>
      </section>

      <div className="tab-bar">
        {['전체','실패','환불'].map(f=>(
          <button key={f} className={'tab'+(filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>
        ))}
      </div>

      <div className="panel anim-fade">
        <table className="data-table">
          <thead><tr><th>결제 ID</th><th>구독자</th><th>금액</th><th>상태</th><th>일자</th><th></th></tr></thead>
          <tbody>
            {filtered.map(r=>(
              <tr key={r.id}>
                <td>{r.id}</td><td>{r.user}</td><td>{r.amount}</td>
                <td><span className={'badge '+(r.status==='ok'?'ok':r.status==='fail'?'fail':'warn')}>{r.status==='ok'?'완료':r.status==='fail'?'실패':'환불요청'}</span></td>
                <td>{r.date}</td>
                <td>{r.status==='refund' && <button className="btn-pill" style={{padding:'4px 14px',fontSize:12}} onClick={()=>approveRefund(r.id)}>환불 승인</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toast, setToast] = useState(null);

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex'}} data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="main-wrap" style={{marginLeft:240,flex:1,minWidth:0,width:'calc(100% - 240px)',padding:'32px 36px',minHeight:'100vh'}}>
        {screen==='main' && <ScheduleScreen setToast={setToast} />}
        {screen==='subscriber-analytics' && <SubscriberAnalyticsScreen setToast={setToast} />}
        {screen==='notification-console' && <NotificationConsoleScreen setToast={setToast} />}
        {screen==='billing-admin' && <BillingAdminScreen setToast={setToast} />}
      </main>
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
