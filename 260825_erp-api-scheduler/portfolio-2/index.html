<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncOps Hub — 멀티 ERP 통합 운영 허브</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100vh; }
  body { font-family: 'Pretendard', -apple-system, sans-serif; background: #ffffff; color: #090a0c; -webkit-font-smoothing: antialiased; }
  #root { width: 100%; }

  :root {
    --primary: #5683da;
    --accent: #ff8964;
    --secondary: #d1d1d1;
    --bg: #ffffff;
    --tile: #f4f5f7;
    --tile-alt: #ffffff;
    --text: #090a0c;
    --text2: #6b6f78;
    --border: #e5e5e7;
    --radius: 18px;
    --radius-sm: 12px;
    --radius-pill: 9999px;
  }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes spinLoad { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes beamMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
  @keyframes auroraDrift { 0%, 100% { transform: translateX(-6%) rotate(8deg); opacity: 0.7; } 50% { transform: translateX(6%) rotate(11deg); opacity: 0.95; } }

  .aurora-hero {
    position: relative; overflow: hidden;
    background: #090a0c; border-radius: var(--radius);
    padding: 44px 36px; margin-bottom: 20px; color: #fff;
  }
  .aurora-beam {
    position: absolute; top: -30%; left: 18%; width: 140px; height: 180%;
    background: linear-gradient(180deg, rgba(86,131,218,0.95) 0%, rgba(255,137,100,0.85) 55%, rgba(255,255,255,0.5) 100%);
    filter: blur(42px); animation: auroraDrift 6s ease-in-out infinite;
  }
  .aurora-sunburst {
    position: absolute; bottom: -60px; right: 8%; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,170,129,0.55) 0%, rgba(255,218,159,0.2) 45%, transparent 70%);
  }
  .aurora-content { position: relative; z-index: 1; max-width: 640px; }
  .aurora-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
  .aurora-title { font-size: 42px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.08; }
  .aurora-sub { font-size: 14px; color: rgba(255,255,255,0.68); margin-top: 12px; }

  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 18px;
    height: 60px; padding: 0 28px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16.5px; white-space: nowrap; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--radius-pill);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center; color: #fff;
    background-size: 200% 100%; animation: beamMove 4s linear infinite;
  }
  .top-nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .top-nav::-webkit-scrollbar { display: none; }
  .nav-pill {
    padding: 8px 14px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 500;
    color: var(--text2); background: transparent; border: none; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .nav-pill:hover { background: var(--tile); color: var(--text); }
  .nav-pill.active { background: var(--primary); color: #fff; font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; cursor: pointer; padding: 9px 18px; transition: transform 0.1s, filter 0.15s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { background: var(--secondary); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-sm { padding: 6px 13px; font-size: 12px; }
  .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; position: relative; }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
  .live-dot { position: absolute; top: -1px; right: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: glowPulse 1.6s ease-in-out infinite; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

  .content { max-width: 1240px; margin: 0 auto; padding: 28px 28px 80px; }
  .page-head { margin-bottom: 20px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: var(--primary); text-transform: uppercase; margin-bottom: 5px; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .page-sub { font-size: 13.5px; color: var(--text2); margin-top: 5px; }

  .bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tile {
    background: var(--tile); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 20px; animation: fadeInUp 0.4s ease both; transition: transform 0.18s ease, border-color 0.18s ease;
    position: relative; overflow: hidden;
  }
  .tile:hover { transform: scale(1.015); border-color: var(--primary); }
  .tile.feature { grid-column: span 2; grid-row: span 2; background: var(--tile-alt); box-shadow: 0 4px 16px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
  .tile.wide { grid-column: span 2; }
  .tile.metric { display: flex; flex-direction: column; justify-content: space-between; min-height: 132px; }
  .tile.action { display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; background: var(--tile-alt); }
  .tile-label { font-size: 11.5px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; }
  .tile-num { font-size: 40px; font-weight: 700; margin-top: 8px; letter-spacing: -0.5px; }
  .tile-delta { font-size: 12px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 3px; }
  .tile-delta.up { color: #1c9a6c; }
  .tile-delta.warn { color: var(--accent); }

  .connector-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .connector-row:last-child { border-bottom: none; }
  .status-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; }
  .status-chip.ok { background: rgba(28,154,108,0.12); color: #1c9a6c; }
  .status-chip.warn { background: rgba(255,137,100,0.16); color: #c85a2e; }

  .timeline-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .timeline-dot.warn { background: var(--accent); }
  .timeline-dot.ok { background: var(--primary); }
  .timeline-text { font-size: 13px; }
  .timeline-time { font-size: 11.5px; color: var(--text2); margin-top: 2px; }

  .action-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: rgba(86,131,218,0.12); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 19px; }

  .card { background: var(--tile-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; animation: fadeInUp 0.35s ease both; }
  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

  .rule-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
  .rule-cond { font-size: 13.5px; font-weight: 500; }
  .rule-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }

  .toggle { width: 38px; height: 21px; border-radius: var(--radius-pill); background: var(--border); position: relative; cursor: pointer; border: none; transition: background 0.2s; flex-shrink: 0; }
  .toggle.on { background: var(--primary); }
  .toggle-knob { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .toggle.on .toggle-knob { left: 19px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--tile); }

  .field-select, .field-input { padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #fff; font-size: 13px; color: var(--text); font-family: inherit; }
  .field-select:focus, .field-input:focus { outline: none; border-color: var(--primary); }
  .field-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(9,10,12,0.45); z-index: 100; display: flex; align-items: center; justify-content: center; animation: overlayIn 0.2s ease; padding: 20px; }
  .modal { width: 460px; max-width: 100%; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: fadeInUp 0.25s ease; overflow: hidden; }
  .modal-header { padding: 22px 24px 6px; font-size: 17px; font-weight: 700; }
  .modal-body { padding: 14px 24px 22px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; }
  .badge.ok { background: rgba(28,154,108,0.12); color: #1c9a6c; }
  .badge.warn { background: rgba(255,137,100,0.16); color: #c85a2e; }
  .badge.muted { background: var(--tile); color: var(--text2); }

  .toast { position: fixed; bottom: 26px; left: 50%; background: var(--text); color: #fff; padding: 12px 20px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; z-index: 200; animation: toastIn 0.3s ease; }
  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spinLoad 0.7s linear infinite; display: inline-block; }
  .spinner-dark { width: 15px; height: 15px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spinLoad 0.7s linear infinite; display: inline-block; }

  .wizard-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 26px; }
  .wizard-num { width: 28px; height: 28px; border-radius: 50%; background: var(--tile); color: var(--text2); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .wizard-num.done { background: var(--primary); color: #fff; }
  .wizard-num.active { background: var(--text); color: #fff; }
  .wizard-line { width: 26px; height: 2px; background: var(--border); }

  .step-panel { max-width: 440px; }
  .connector-choice { display: flex; gap: 10px; margin-top: 6px; }
  .connector-opt { flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .connector-opt.selected { border-color: var(--primary); background: rgba(86,131,218,0.08); color: var(--primary); }

  .result-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-top: 14px; display: flex; align-items: center; gap: 12px; }

  @media (max-width: 960px) {
    .bento { grid-template-columns: repeat(2, 1fr); }
    .tile.feature { grid-column: span 2; }
    .top-nav { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const CONNECTORS = [
  { id: 1, name: '기간계 ERP 커넥터', status: 'ok', rate: '99.2%' },
  { id: 2, name: '물류 ERP 커넥터', status: 'warn', rate: '94.8%' },
  { id: 3, name: '인사 ERP 커넥터', status: 'ok', rate: '99.7%' },
];

const ALERT_FEED = [
  { id: 1, text: '물류 ERP 커넥터 실패율 5% 초과 감지', time: '10분 전', level: 'warn' },
  { id: 2, text: '잡 #12 중복실행 감지 후 자동 스킵', time: '38분 전', level: 'ok' },
  { id: 3, text: '기간계 ERP 세금계산서 항목 정상 동기화', time: '1시간 전', level: 'ok' },
  { id: 4, text: '인사 ERP 인증 토큰 만료 5일 전 알림', time: '2시간 전', level: 'warn' },
];

const RULES_SEED = [
  { id: 1, cond: '실패율 5% 초과 + 연속 3회 이상', target: '전체 커넥터', active: true },
  { id: 2, cond: '실패율 10% 초과', target: '물류 ERP 커넥터', active: true },
  { id: 3, cond: '연속 실패 5회 이상', target: '인사 ERP 커넥터', active: false },
];

const HISTORY_SEED = [
  { id: 1, connector: '물류 ERP', desc: '실패율 5.4% 초과 — 임계치 규칙 #2 트리거', read: false },
  { id: 2, connector: '기간계 ERP', desc: '잡 #7 중복실행 자동 스킵', read: true },
  { id: 3, connector: '인사 ERP', desc: '인증 토큰 갱신 완료', read: true },
];

const REPORT_ROWS = [
  { erp: '기간계 ERP', success: 18420, fail: 142, rate: '99.2%' },
  { erp: '물류 ERP', success: 9310, fail: 512, rate: '94.8%' },
  { erp: '인사 ERP', success: 5230, fail: 18, rate: '99.7%' },
];

function ConnectorChart() {
  const w = 560, h = 200, pad = 24;
  const series = [
    { name: '기간계 ERP', color: '#5683da', vals: [62, 68, 71, 75, 80, 84, 88] },
    { name: '물류 ERP', color: '#ff8964', vals: [40, 44, 38, 46, 42, 50, 47] },
  ];
  const max = 100;
  const toPath = (vals) => vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
    const y = h - pad - (v / max) * (h - pad * 2);
    return (i === 0 ? 'M' : 'L') + x + ',' + y;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="200" preserveAspectRatio="none">
      {series.map(s => (
        <path key={s.name} d={toPath(s.vals)} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      ))}
      {series.map(s => s.vals.map((v, i) => {
        const x = pad + (i / (s.vals.length - 1)) * (w - pad * 2);
        const y = h - pad - (v / max) * (h - pad * 2);
        return <circle key={s.name + i} cx={x} cy={y} r="3" fill="#fff" stroke={s.color} strokeWidth="2" />;
      }))}
    </svg>
  );
}

function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [message]);
  return <div className="toast"><i className="ph ph-check-circle"></i>{message}</div>;
}

function App() {
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);
  function notify(m) { setToast(m); }

  const [resendModalOpen, setResendModalOpen] = useState(false);
  const [resending, setResending] = useState(false);
  const [failedItems, setFailedItems] = useState([
    { id: 'F-901', label: '물류 ERP · /sync/inventory', done: false },
    { id: 'F-902', label: '물류 ERP · /sync/purchase-in', done: false },
    { id: 'F-903', label: '인사 ERP · /sync/attendance', done: false },
  ]);

  const [rules, setRules] = useState(RULES_SEED);
  const [history, setHistory] = useState(HISTORY_SEED);
  const [ruleModalOpen, setRuleModalOpen] = useState(false);
  const [ruleThreshold, setRuleThreshold] = useState(5);
  const [ruleStreak, setRuleStreak] = useState(3);

  const [erpFilter, setErpFilter] = useState('전체');
  const [periodFilter, setPeriodFilter] = useState('이번 달');
  const [exporting, setExporting] = useState(false);

  const [step, setStep] = useState(1);
  const [wizConnector, setWizConnector] = useState('기간계 ERP');
  const [wizApiKey, setWizApiKey] = useState('');
  const [wizSecret, setWizSecret] = useState('');
  const [wizHost, setWizHost] = useState('');
  const [wizTesting, setWizTesting] = useState(false);
  const [wizResult, setWizResult] = useState(null);

  function resendFailed() {
    setResending(true);
    setTimeout(() => {
      setFailedItems(items => items.map(i => ({ ...i, done: true })));
      setResending(false);
      notify('선택한 실패 건 재전송이 완료되었습니다');
      setTimeout(() => setResendModalOpen(false), 700);
    }, 1100);
  }

  function toggleRule(id) {
    setRules(rs => rs.map(r => r.id === id ? { ...r, active: !r.active } : r));
  }
  function createRule() {
    setRules(rs => [{ id: Date.now(), cond: `실패율 ${ruleThreshold}% 초과 + 연속 ${ruleStreak}회`, target: '전체 커넥터', active: true }, ...rs]);
    setRuleModalOpen(false);
    notify('새 알림 규칙이 생성되었습니다');
  }
  function markRead(id) {
    setHistory(hs => hs.map(h => h.id === id ? { ...h, read: true } : h));
  }

  function exportCsv() {
    setExporting(true);
    setTimeout(() => { setExporting(false); notify('CSV 파일이 생성되었습니다'); }, 1400);
  }

  function runTestConnection() {
    setWizTesting(true);
    setWizResult(null);
    setTimeout(() => { setWizTesting(false); setWizResult('success'); }, 1300);
  }
  function finishOnboarding() {
    notify(`${wizConnector} 커넥터 연동이 완료되었습니다`);
    setStep(1); setWizApiKey(''); setWizSecret(''); setWizHost(''); setWizResult(null);
    setView('main');
  }

  const navItems = [
    { key: 'main', label: '멀티 ERP 연동 현황 통합 허브', icon: 'ph-squares-four' },
    { key: 'alerts', label: '이상 징후 자동 알림 규칙', icon: 'ph-bell-ringing' },
    { key: 'analytics', label: '연동 이력 통합 분석 리포트', icon: 'ph-chart-line-up' },
    { key: 'onboarding', label: '신규 ERP 온보딩 마법사', icon: 'ph-plug' },
  ];

  const unreadCount = history.filter(h => !h.read).length;

  return (
    <div data-archetype="bento-grid" style={{ width: '100%', minHeight: '100vh' }}>
      <header className="topbar">
        <div className="brand"><span className="brand-mark"><i className="ph ph-hexagon" style={{ fontSize: 15 }}></i></span>SyncOps Hub</div>
        <nav className="top-nav">
          {navItems.map(n => (
            <button key={n.key} className={"nav-pill" + (view === n.key ? " active" : "")} onClick={() => setView(n.key)}>
              <i className={"ph " + n.icon} style={{ marginRight: 5 }}></i>{n.label}
            </button>
          ))}
        </nav>
        <div className="top-actions">
          <button className="icon-btn" onClick={() => notify(`읽지 않은 알림 ${unreadCount}건`)}>
            <i className="ph ph-bell"></i>
            {unreadCount > 0 && <span className="live-dot"></span>}
          </button>
          <button className="btn btn-primary btn-sm" onClick={() => setView('onboarding')}><i className="ph ph-plus"></i>신규 ERP 연동</button>
          <div className="avatar">관</div>
        </div>
      </header>

      <main className="content">
        {view === 'main' && (
          <React.Fragment>
            <div className="aurora-hero">
              <div className="aurora-beam"></div>
              <div className="aurora-sunburst"></div>
              <div className="aurora-content">
                <div className="aurora-eyebrow">실시간 통합 관제</div>
                <div className="aurora-title">멀티 ERP 연동 현황 통합 허브</div>
                <div className="aurora-sub">3개 ERP 커넥터의 연동 상태와 전송 통계를 한눈에 확인합니다</div>
              </div>
            </div>

            <div className="bento">
              <div className="tile feature" style={{ animationDelay: '0ms', borderRadius: 18, boxShadow: '0 4px 16px rgba(0,0,0,0.06)' }}>
                <div className="tile-label">커넥터별 전송 추이</div>
                <ConnectorChart />
                <div style={{ marginTop: 'auto' }}>
                  {CONNECTORS.map(c => (
                    <div key={c.id} className="connector-row">
                      <span>{c.name}</span>
                      <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <span style={{ color: 'var(--text2)', fontSize: 12 }}>{c.rate}</span>
                        <span className={"status-chip " + (c.status === 'ok' ? 'ok' : 'warn')}>
                          <i className={"ph " + (c.status === 'ok' ? 'ph-check-circle' : 'ph-warning-circle')}></i>
                          {c.status === 'ok' ? '정상' : '경고'}
                        </span>
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="tile metric" style={{ animationDelay: '60ms' }}>
                <div className="tile-label">연동 ERP 수</div>
                <div className="tile-num">3<span style={{ fontSize: 15, color: 'var(--text2)' }}>종</span></div>
                <div className="tile-delta up"><i className="ph ph-arrow-up-right"></i>신규 1건 대기</div>
              </div>
              <div className="tile metric" style={{ animationDelay: '90ms' }}>
                <div className="tile-label">오늘 전송 건수</div>
                <div className="tile-num">2,410</div>
                <div className="tile-delta up"><i className="ph ph-arrow-up-right"></i>전일 대비 증가</div>
              </div>
              <div className="tile metric" style={{ animationDelay: '120ms' }}>
                <div className="tile-label">실패율</div>
                <div className="tile-num">1.8%</div>
                <div className="tile-delta warn"><i className="ph ph-warning-circle"></i>물류 ERP 주의</div>
              </div>
              <div className="tile metric" style={{ animationDelay: '150ms' }}>
                <div className="tile-label">활성 스케줄 수</div>
                <div className="tile-num">38</div>
                <div className="tile-delta up"><i className="ph ph-timer"></i>정상 가동</div>
              </div>

              <div className="tile wide" style={{ animationDelay: '180ms' }}>
                <div className="card-row" style={{ marginBottom: 10 }}>
                  <div className="tile-label">최근 알림 타임라인</div>
                  <button className="btn btn-ghost btn-sm" onClick={() => setView('alerts')}>전체 알림 보기<i className="ph ph-arrow-right"></i></button>
                </div>
                {ALERT_FEED.map(a => (
                  <div key={a.id} className="timeline-item">
                    <span className={"timeline-dot " + a.level}></span>
                    <div>
                      <div className="timeline-text">{a.text}</div>
                      <div className="timeline-time">{a.time}</div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="tile action" style={{ animationDelay: '210ms' }} onClick={() => setResendModalOpen(true)}>
                <div className="action-icon"><i className="ph ph-arrows-clockwise"></i></div>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13.5 }}>빠른 수동 재전송</div>
                  <div style={{ fontSize: 12, color: 'var(--text2)', marginTop: 3 }}>실패 건 {failedItems.filter(i => !i.done).length}건 대기</div>
                </div>
              </div>
              <div className="tile action" style={{ animationDelay: '240ms' }} onClick={() => setView('onboarding')}>
                <div className="action-icon" style={{ background: 'rgba(255,137,100,0.14)', color: 'var(--accent)' }}><i className="ph ph-plug"></i></div>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13.5 }}>신규 ERP 연동 등록</div>
                  <div style={{ fontSize: 12, color: 'var(--text2)', marginTop: 3 }}>5단계 온보딩 마법사</div>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {view === 'alerts' && (
          <React.Fragment>
            <div className="page-head" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 12 }}>
              <div>
                <div className="eyebrow">이상탐지</div>
                <div className="page-title">이상 징후 자동 알림 규칙</div>
                <div className="page-sub">실패율·연속 실패 횟수 조합의 알림 규칙을 정의하고 이력을 확인합니다</div>
              </div>
              <button className="btn btn-primary" onClick={() => setRuleModalOpen(true)}><i className="ph ph-plus"></i>새 알림 규칙</button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 16 }}>
              <div>
                {rules.map((r, i) => (
                  <div key={r.id} className="card rule-card" style={{ marginBottom: 12, animationDelay: (i * 40) + 'ms' }}>
                    <div>
                      <div className="rule-cond">{r.cond}</div>
                      <div className="rule-meta">적용 대상: {r.target}</div>
                    </div>
                    <button className={"toggle" + (r.active ? " on" : "")} onClick={() => toggleRule(r.id)}><span className="toggle-knob"></span></button>
                  </div>
                ))}
              </div>
              <div className="card">
                <div className="tile-label" style={{ marginBottom: 12 }}>알림 이력</div>
                {history.map(h => (
                  <div key={h.id} onClick={() => markRead(h.id)} style={{ padding: '10px 0', borderBottom: '1px solid var(--border)', cursor: 'pointer', opacity: h.read ? 0.55 : 1 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, fontWeight: 600 }}>
                      <span>{h.connector}</span>
                      {!h.read && <span className="badge warn">NEW</span>}
                    </div>
                    <div style={{ fontSize: 12.5, color: 'var(--text2)', marginTop: 3 }}>{h.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </React.Fragment>
        )}

        {view === 'analytics' && (
          <React.Fragment>
            <div className="page-head">
              <div className="eyebrow">통합 리포트</div>
              <div className="page-title">연동 이력 통합 분석 리포트</div>
              <div className="page-sub">ERP별·기간별 전송 통계를 조회하고 CSV로 내보냅니다</div>
            </div>

            <div className="card" style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                <select className="field-select" value={erpFilter} onChange={e => setErpFilter(e.target.value)}>
                  <option>전체</option>
                  {CONNECTORS.map(c => <option key={c.id}>{c.name}</option>)}
                </select>
                <select className="field-select" value={periodFilter} onChange={e => setPeriodFilter(e.target.value)}>
                  <option>이번 주</option><option>이번 달</option><option>분기</option>
                </select>
                <button className="btn btn-ghost btn-sm" onClick={() => notify(`${erpFilter} · ${periodFilter} 리포트를 조회했습니다`)}><i className="ph ph-magnifying-glass"></i>조회</button>
                <div style={{ flex: 1 }}></div>
                <button className="btn btn-primary btn-sm" disabled={exporting} onClick={exportCsv}>
                  {exporting ? <span className="spinner"></span> : <i className="ph ph-download-simple"></i>}
                  CSV 내보내기
                </button>
              </div>
            </div>

            <div className="bento" style={{ marginBottom: 16 }}>
              <div className="tile metric"><div className="tile-label">전월 대비</div><div className="tile-num" style={{ fontSize: 26 }}>+12%</div><div className="tile-delta up"><i className="ph ph-trend-up"></i>전송량 증가</div></div>
              <div className="tile metric"><div className="tile-label">평균 성공률</div><div className="tile-num" style={{ fontSize: 26 }}>97.9%</div><div className="tile-delta up"><i className="ph ph-check-circle"></i>안정 구간</div></div>
              <div className="tile wide">
                <div className="tile-label" style={{ marginBottom: 10 }}>월별 전송량 추이</div>
                <ConnectorChart />
              </div>
            </div>

            <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
              <table>
                <thead><tr><th>ERP</th><th>성공</th><th>실패</th><th>성공률</th></tr></thead>
                <tbody>
                  {REPORT_ROWS.map(r => (
                    <tr key={r.erp}><td>{r.erp}</td><td>{r.success.toLocaleString()}</td><td>{r.fail.toLocaleString()}</td><td>{r.rate}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

        {view === 'onboarding' && (
          <React.Fragment>
            <div className="page-head">
              <div className="eyebrow">온보딩</div>
              <div className="page-title">신규 ERP 온보딩 마법사</div>
              <div className="page-sub">연동 정보를 단계별로 입력하고 테스트 연동까지 검증합니다</div>
            </div>

            <div className="wizard-steps">
              {[1, 2, 3, 4, 5].map(n => (
                <React.Fragment key={n}>
                  <div className={"wizard-num" + (n < step ? " done" : n === step ? " active" : "")}>{n < step ? <i className="ph ph-check"></i> : n}</div>
                  {n < 5 && <div className="wizard-line"></div>}
                </React.Fragment>
              ))}
            </div>

            <div className="card step-panel">
              {step === 1 && (
                <React.Fragment>
                  <div className="field-label">1단계 · ERP 종류 선택</div>
                  <div className="connector-choice">
                    {['기간계 ERP', '물류 ERP', '인사 ERP'].map(c => (
                      <div key={c} className={"connector-opt" + (wizConnector === c ? " selected" : "")} onClick={() => setWizConnector(c)}>{c}</div>
                    ))}
                  </div>
                </React.Fragment>
              )}
              {step === 2 && (
                <React.Fragment>
                  <div className="field-label">2단계 · 인증 정보 입력</div>
                  <input className="field-input" style={{ width: '100%', marginBottom: 10 }} placeholder="API Key" value={wizApiKey} onChange={e => setWizApiKey(e.target.value)} />
                  <input className="field-input" style={{ width: '100%' }} placeholder="API Secret" type="password" value={wizSecret} onChange={e => setWizSecret(e.target.value)} />
                </React.Fragment>
              )}
              {step === 3 && (
                <React.Fragment>
                  <div className="field-label">3단계 · DB 연결 정보</div>
                  <input className="field-input" style={{ width: '100%' }} placeholder="호스트:포트 / DB명" value={wizHost} onChange={e => setWizHost(e.target.value)} />
                </React.Fragment>
              )}
              {step === 4 && (
                <React.Fragment>
                  <div className="field-label">4단계 · 필드 매핑 초기 설정</div>
                  {['item_code', 'quantity', 'amount'].map(f => (
                    <div key={f} className="rule-card" style={{ padding: '10px 14px', border: '1px solid var(--border)', borderRadius: 10, marginBottom: 8 }}>
                      <span style={{ fontSize: 13 }}>{f}</span>
                      <span className="badge muted">자동 매핑됨</span>
                    </div>
                  ))}
                </React.Fragment>
              )}
              {step === 5 && (
                <React.Fragment>
                  <div className="field-label">5단계 · 테스트 연동</div>
                  <button className="btn btn-ghost" onClick={runTestConnection} disabled={wizTesting}>
                    {wizTesting ? <span className="spinner-dark"></span> : <i className="ph ph-plug"></i>}
                    {wizTesting ? '테스트 중...' : '테스트 연동 실행'}
                  </button>
                  {wizResult === 'success' && (
                    <div className="result-card">
                      <i className="ph ph-check-circle" style={{ fontSize: 22, color: '#1c9a6c' }}></i>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13.5 }}>{wizConnector} 연동 테스트 성공</div>
                        <div style={{ fontSize: 12, color: 'var(--text2)' }}>응답 지연 없이 인증 및 스키마 조회를 확인했습니다</div>
                      </div>
                    </div>
                  )}
                </React.Fragment>
              )}

              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 22 }}>
                <button className="btn btn-ghost btn-sm" disabled={step === 1} onClick={() => setStep(s => s - 1)}>이전</button>
                {step < 5 ? (
                  <button className="btn btn-primary btn-sm" disabled={step === 2 && (!wizApiKey || !wizSecret)} onClick={() => setStep(s => s + 1)}>다음</button>
                ) : (
                  <button className="btn btn-primary btn-sm" disabled={wizResult !== 'success'} onClick={finishOnboarding}>연동 완료</button>
                )}
              </div>
            </div>
          </React.Fragment>
        )}
      </main>

      {resendModalOpen && (
        <div className="modal-overlay" onClick={() => setResendModalOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">빠른 수동 재전송</div>
            <div className="modal-body">
              {failedItems.map(i => (
                <div key={i.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '9px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                  <span>{i.label}</span>
                  {i.done ? <span className="badge ok"><i className="ph ph-check"></i>완료</span> : <span className="badge warn">대기</span>}
                </div>
              ))}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setResendModalOpen(false)}>닫기</button>
              <button className="btn btn-primary" disabled={resending} onClick={resendFailed}>
                {resending ? <span className="spinner"></span> : <i className="ph ph-arrows-clockwise"></i>}
                전체 재전송
              </button>
            </div>
          </div>
        </div>
      )}

      {ruleModalOpen && (
        <div className="modal-overlay" onClick={() => setRuleModalOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">새 알림 규칙 만들기</div>
            <div className="modal-body">
              <label className="field-label">실패율 임계치 (%)</label>
              <input className="field-input" type="number" style={{ width: '100%', marginBottom: 14 }} value={ruleThreshold} onChange={e => setRuleThreshold(e.target.value)} />
              <label className="field-label">연속 실패 횟수</label>
              <input className="field-input" type="number" style={{ width: '100%' }} value={ruleStreak} onChange={e => setRuleStreak(e.target.value)} />
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setRuleModalOpen(false)}>취소</button>
              <button className="btn btn-primary" onClick={createRule}>생성</button>
            </div>
          </div>
        </div>
      )}

      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
