<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웨이캠프 — 아웃도어 캠핑장 예약 플랫폼</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#171721; --surface:#1e1e2a; --surface2:#272735;
    --primary:#5266eb; --primary-dim:#3f4fc4;
    --ivory:#ededf3; --ash:#c3c3cc; --mist:#e2e3ed;
    --border: rgba(226,227,237,0.12); --border-strong: rgba(226,227,237,0.28);
    --ok:#4fd1a5; --warn:#f0b155; --danger:#ef6a6a;
    --radius-card:12px; --radius-pill:32px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--bg);}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased;}
  #app-root{width:100%;min-height:100vh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{display:block;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:8px;}

  .app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  /* ── header / search ── */
  .search-header{position:sticky;top:0;z-index:40;width:100%;background:rgba(23,23,33,0.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
  .header-row{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 32px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:0.02em;color:var(--ivory);flex-shrink:0;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#8b9bff);display:flex;align-items:center;justify-content:center;}

  .search-bar{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-pill);overflow:hidden;flex:1;max-width:560px;}
  .search-segment{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 20px;text-align:left;transition:background .15s ease;}
  .search-segment:hover{background:var(--surface2);}
  .segment-label{font-size:11px;color:var(--ash);font-weight:600;}
  .segment-value{font-size:14px;color:var(--ivory);font-weight:500;white-space:nowrap;}
  .search-divider{width:1px;background:var(--border-strong);margin:10px 0;}
  .search-submit{width:44px;flex-shrink:0;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .search-submit:hover{background:var(--primary-dim);}

  .header-nav{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .btn-ghost{border:1px solid var(--ivory);color:var(--ivory);border-radius:var(--radius-pill);padding:9px 20px;font-size:14px;font-weight:500;transition:background .15s ease;display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:rgba(237,237,243,0.08);}
  .btn-primary{background:var(--primary);color:#fff;border-radius:var(--radius-pill);padding:10px 22px;font-size:14px;font-weight:600;transition:background .15s ease,transform .1s ease;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{background:var(--primary-dim);}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}

  .filter-chips{max-width:1240px;margin:0 auto;display:flex;gap:10px;padding:0 32px 14px;overflow-x:auto;}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--border-strong);font-size:13px;font-weight:500;color:var(--ash);transition:all .15s ease;white-space:nowrap;}
  .chip:hover{border-color:var(--mist);color:var(--ivory);}
  .chip.active{background:var(--ivory);color:var(--bg);border-color:var(--ivory);}

  .feature-tabs{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:0 32px 16px;overflow-x:auto;}
  .feature-tab{flex-shrink:0;padding:9px 16px;font-size:13.5px;font-weight:600;border-radius:9px;color:var(--ash);display:inline-flex;align-items:center;gap:7px;transition:all .15s ease;white-space:nowrap;}
  .feature-tab:hover{color:var(--ivory);}
  .feature-tab.active{background:var(--surface2);color:var(--ivory);}
  .feature-tab .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:0;transition:opacity .15s ease;}
  .feature-tab.active .tab-dot{opacity:1;}

  /* ── main / grid ── */
  .main{width:100%;flex:1;}
  .page-wrap{max-width:1240px;margin:0 auto;padding:32px;animation:fadeInUp .38s ease both;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .section-title{font-size:22px;font-weight:700;letter-spacing:0.01em;}
  .section-sub{font-size:13.5px;color:var(--ash);margin-top:4px;}

  .feed-hero{position:relative;width:100%;aspect-ratio:16/6.4;border-radius:var(--radius-card);overflow:hidden;margin-bottom:40px;}
  .feed-hero img{width:100%;height:100%;object-fit:cover;filter:saturate(0.9) brightness(0.85);}
  .feed-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,23,33,0.15) 0%,rgba(23,23,33,0.82) 100%);}
  .feed-hero-content{position:absolute;left:0;right:0;bottom:0;padding:36px;z-index:2;}
  .feed-hero-sub{font-size:15px;color:var(--ash);max-width:560px;line-height:1.5;margin-bottom:18px;}

  .collection-row{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;margin-bottom:40px;}
  .collection-row .listing-card{flex:0 0 268px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px;}

  .listing-card{background:var(--surface);border-radius:var(--radius-card);overflow:hidden;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease;animation:fadeInUp .5s ease both;position:relative;}
  .listing-card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 18px 40px -18px rgba(82,102,235,0.45);}
  .card-image-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--surface2);}
  .card-image-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
  .listing-card:hover .card-image-wrap img{transform:scale(1.06);}
  .card-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(23,23,33,0.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .card-favorite:hover{background:rgba(23,23,33,0.85);}
  .card-badge{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .card-badge.ok{background:rgba(79,209,165,0.16);color:var(--ok);}
  .card-badge.sold{background:rgba(112,112,125,0.35);color:var(--ash);}
  .card-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:badgePulse 1.6s ease infinite;}
  .card-body{padding:16px;}
  .card-row-1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-rating{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--ash);flex-shrink:0;}
  .card-meta{font-size:12.5px;color:var(--ash);display:flex;align-items:center;gap:5px;margin-top:6px;}
  .card-row-4{display:flex;align-items:baseline;gap:4px;margin-top:12px;}
  .card-price{font-size:17px;font-weight:800;color:var(--ivory);}
  .price-unit{font-size:12px;color:var(--ash);}
  .card-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
  .card-tag{font-size:10.5px;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--ash);}

  .skeleton-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px;margin-top:20px;}
  .skeleton-card{height:262px;border-radius:var(--radius-card);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s ease infinite;}

  .load-more-wrap{display:flex;justify-content:center;margin-top:32px;}

  /* ── detail ── */
  .detail-hero{width:100%;aspect-ratio:16/6;border-radius:var(--radius-card);overflow:hidden;position:relative;margin-bottom:24px;}
  .detail-hero img{width:100%;height:100%;object-fit:cover;}
  .detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(23,23,33,0.85) 100%);}
  .detail-hero-text{position:absolute;left:28px;bottom:22px;z-index:2;}
  .detail-hero-text h1{font-size:44px;font-weight:800;letter-spacing:-0.01em;margin:0 0 6px;line-height:1.1;}
  .feed-hero-title{font-size:42px;font-weight:800;letter-spacing:-0.01em;line-height:1.12;margin:0 0 10px;max-width:640px;}
  .detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;}
  .detail-panel{background:var(--surface);border-radius:var(--radius-card);padding:24px;}
  .amenity-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;}
  .amenity{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:8px;background:var(--surface2);color:var(--ash);}
  .price-box{position:sticky;top:200px;background:var(--surface);border-radius:var(--radius-card);padding:22px;border:1px solid var(--border-strong);}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--ash);display:block;margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ivory);font-family:inherit;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .price-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ash);padding:6px 0;}
  .price-total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;padding-top:10px;margin-top:6px;border-top:1px solid var(--border-strong);}

  /* ── booking ── */
  .booking-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start;}
  .step-block{background:var(--surface);border-radius:var(--radius-card);padding:24px;margin-bottom:18px;}
  .step-block h3{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hold-banner{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(240,177,85,0.14),rgba(240,177,85,0.04));border:1px solid rgba(240,177,85,0.35);border-radius:10px;padding:12px 16px;margin-bottom:18px;animation:fadeInUp .3s ease both;}
  .hold-banner .hold-time{font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums;}
  .card-pay-visual{background:linear-gradient(135deg,var(--primary),#2b3a9e);border-radius:14px;padding:18px 20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;}
  .card-pay-visual::after{content:'';position:absolute;width:180px;height:180px;background:rgba(255,255,255,0.08);border-radius:50%;top:-90px;right:-40px;}
  .card-pay-number{font-size:17px;letter-spacing:2px;font-variant-numeric:tabular-nums;margin-top:20px;}

  /* ── addon ── */
  .addon-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start;}
  .addon-item{display:flex;gap:14px;background:var(--surface);border-radius:var(--radius-card);padding:14px;margin-bottom:12px;align-items:center;transition:border-color .15s ease;border:1px solid transparent;}
  .addon-item.selected{border-color:var(--primary);}
  .addon-item.disabled{opacity:0.45;}
  .addon-thumb{width:64px;height:64px;border-radius:9px;overflow:hidden;flex-shrink:0;}
  .addon-thumb img{width:100%;height:100%;object-fit:cover;}
  .addon-info{flex:1;min-width:0;}
  .addon-info .name{font-size:14.5px;font-weight:700;}
  .addon-info .meta{font-size:12px;color:var(--ash);margin-top:3px;}
  .addon-toggle{width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;flex-shrink:0;transition:background .15s ease;}
  .addon-toggle.on{background:var(--primary);}
  .addon-toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s ease;}
  .addon-toggle.on .knob{transform:translateX(18px);}
  .summary-box{background:var(--surface);border-radius:var(--radius-card);padding:20px;position:sticky;top:200px;}
  .summary-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ash);padding:5px 0;}

  /* ── search view ── */
  .search-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .filter-panel{background:var(--surface);border-radius:var(--radius-card);padding:20px;margin-bottom:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;animation:fadeInUp .28s ease both;}
  .filter-panel .field{margin-bottom:0;}
  .amenity-check{display:flex;flex-wrap:wrap;gap:8px;}
  .amenity-check label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ash);background:var(--surface2);padding:6px 10px;border-radius:7px;cursor:pointer;}
  .amenity-check input{accent-color:var(--primary);}

  /* ── modal / toast ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,16,0.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
  .modal-box{background:var(--surface);border-radius:16px;padding:32px;width:100%;max-width:420px;animation:modalPop .28s cubic-bezier(.2,.9,.3,1.2) both;text-align:center;}
  .modal-icon{width:56px;height:56px;border-radius:50%;background:rgba(79,209,165,0.16);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .modal-box h3{font-size:19px;margin:0 0 8px;}
  .modal-box p{font-size:13.5px;color:var(--ash);margin:0 0 22px;line-height:1.5;}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:120;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--surface2);border:1px solid var(--border-strong);border-radius:10px;padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:13.5px;animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:0 12px 30px -12px rgba(0,0,0,0.5);}

  .footer{width:100%;border-top:1px solid var(--border);margin-top:40px;}
  .footer-cols{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;padding:40px 32px;}
  .footer-col h4{font-size:13px;color:var(--ash);margin:0 0 12px;font-weight:600;}
  .footer-col a{display:block;font-size:13px;color:var(--ash);margin-bottom:8px;}
  .footer-col a:hover{color:var(--ivory);}
  .footer-bottom{max-width:1240px;margin:0 auto;padding:0 32px 28px;font-size:12px;color:var(--ash);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  @keyframes badgePulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  @keyframes modalPop{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}

  @media (max-width:900px){
    .search-bar{display:none;}
    .detail-grid,.booking-grid,.addon-grid{grid-template-columns:1fr;}
    .filter-panel{grid-template-columns:1fr 1fr;}
    .footer-cols{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;

const COLLECTIONS = [
  {key:'all', label:'전체', icon:'layout-grid'},
  {key:'ocean', label:'오션뷰', icon:'waves'},
  {key:'glamp', label:'글램핑', icon:'tent'},
  {key:'pet', label:'반려동물 동반', icon:'dog'},
  {key:'mountain', label:'산속뷰', icon:'mountain'},
  {key:'caravan', label:'카라반', icon:'caravan'},
  {key:'private', label:'프라이빗 독채', icon:'home'},
];

const REGIONS = ['전체','강원','경기','충청','전라','경상','제주'];
const AMENITIES = ['전기사이트','온수 샤워장','반려동물 동반','카라반','글램핑 텐트','바베큐장','와이파이'];

function seedCamp(id, name, region, collection, tags, price, rating, available){
  return {id, name, region, collection, tags, price, rating, available,
    img:`https://picsum.photos/seed/camping-reservation-card-${id}/600/450`,
    desc: `${region} 지역의 ${name}은(는) ${tags.join(' · ')} 컨셉으로 큐레이션된 캠핑장입니다. 사이트별 데크와 전기 설비를 갖추고 있으며, 반경 3km 이내 맛집·편의시설과 연계해 예약과 동시에 부가 옵션까지 한 번에 선택할 수 있습니다.`};
}

const CAMPS = [
  seedCamp(1,'해무 오션뷰 캠프','강원','ocean',['오션뷰','전기사이트'],52000,4.9,true),
  seedCamp(2,'파도소리 비치캠프','강원','ocean',['오션뷰','반려동물 동반'],48000,4.7,true),
  seedCamp(3,'등대길 글램핑','전라','glamp',['글램핑','온수 샤워장'],89000,4.8,false),
  seedCamp(4,'숲속 프라이빗 글램핑','경기','glamp',['글램핑','프라이빗'],95000,4.9,true),
  seedCamp(5,'멍멍이와 캠핑','충청','pet',['반려동물 동반','전기사이트'],45000,4.6,true),
  seedCamp(6,'댕댕 힐링파크','경상','pet',['반려동물 동반','와이파이'],42000,4.5,true),
  seedCamp(7,'구름산 산속캠프','강원','mountain',['산속뷰','바베큐장'],38000,4.7,true),
  seedCamp(8,'솔향기 계곡캠프','충청','mountain',['산속뷰','전기사이트'],41000,4.4,false),
  seedCamp(9,'모던 카라반 파크','경기','caravan',['카라반','와이파이'],76000,4.8,true),
  seedCamp(10,'화이트 카라반빌리지','제주','caravan',['카라반','온수 샤워장'],82000,4.9,true),
  seedCamp(11,'독채 프라이빗 하우스','제주','private',['프라이빗','바베큐장'],120000,5.0,true),
  seedCamp(12,'그린 독채 스테이','전라','private',['프라이빗','반려동물 동반'],110000,4.8,true),
  seedCamp(13,'선셋포인트 오션캠프','경상','ocean',['오션뷰','바베큐장'],56000,4.6,true),
  seedCamp(14,'별빛 글램핑 리조트','강원','glamp',['글램핑','전기사이트'],98000,4.9,true),
];

const ADDONS = [
  {id:'a1', name:'숯불맛집 화로마을', type:'인근 음식점', price:18000, cap:'여석 6', full:false, img:'https://picsum.photos/seed/camping-reservation-addon-1/200/200'},
  {id:'a2', name:'바다뷰 브런치 카페', type:'인근 음식점', price:14000, cap:'여석 4', full:false, img:'https://picsum.photos/seed/camping-reservation-addon-2/200/200'},
  {id:'a3', name:'카누 체험 (1인)', type:'액티비티', price:25000, cap:'마감', full:true, img:'https://picsum.photos/seed/camping-reservation-addon-3/200/200'},
  {id:'a4', name:'바비큐 풀세트 대여', type:'액티비티', price:32000, cap:'여석 3', full:false, img:'https://picsum.photos/seed/camping-reservation-addon-4/200/200'},
];

function Icon({name, size=18, className='', style={}}){
  return <i data-lucide={name} style={{width:size,height:size, ...style}} className={className}></i>;
}

function StarRow({rating}){
  return <span className="card-rating"><Icon name="star" size={13}/> {rating.toFixed(1)}</span>;
}

function ListingCard({camp, onOpen, favorites, onFavorite}){
  const fav = favorites.has(camp.id);
  return (
    <article className="listing-card" onClick={()=>onOpen(camp)}>
      <div className="card-image-wrap">
        <img src={camp.img} alt={camp.name} loading="lazy"/>
        <span className={"card-badge " + (camp.available ? "ok":"sold")}>
          <span className="dot"></span>{camp.available ? '예약 가능' : '마감'}
        </span>
        <button className="card-favorite" onClick={(e)=>{e.stopPropagation(); onFavorite(camp.id);}} title="찜하기">
          <Icon name="heart" size={15} className={fav ? "text-fav" : ""} style={fav?{color:'#ef6a6a',fill:'#ef6a6a'}:{}}/>
        </button>
      </div>
      <div className="card-body">
        <div className="card-row-1">
          <h3 className="card-title">{camp.name}</h3>
          <StarRow rating={camp.rating}/>
        </div>
        <div className="card-meta"><Icon name="map-pin" size={12}/>{camp.region}</div>
        <div className="card-tags">{camp.tags.map(t=><span className="card-tag" key={t}>{t}</span>)}</div>
        <div className="card-row-4"><strong className="card-price">{camp.price.toLocaleString()}원</strong><span className="price-unit">/ 1박</span></div>
      </div>
    </article>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(
        <div className="toast" key={t.id}><Icon name={t.icon||'check-circle'} size={16} style={{color:'var(--ok)'}}/>{t.msg}</div>
      ))}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [selectedCamp, setSelectedCamp] = useState(CAMPS[0]);
  const [collectionFilter, setCollectionFilter] = useState('all');
  const [favorites, setFavorites] = useState(new Set());
  const [visibleCount, setVisibleCount] = useState(8);
  const [loadingMore, setLoadingMore] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [modal, setModal] = useState(null);

  const [searchRegion, setSearchRegion] = useState('전체');
  const [searchDate, setSearchDate] = useState('2026-09-12');
  const [searchAmenities, setSearchAmenities] = useState([]);
  const [filterPanelOpen, setFilterPanelOpen] = useState(true);

  const [bookingDate, setBookingDate] = useState('2026-09-12');
  const [guests, setGuests] = useState(2);
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [cardNum, setCardNum] = useState('');
  const [holdSeconds, setHoldSeconds] = useState(null);
  const [selectedAddons, setSelectedAddons] = useState(new Set());

  const holdRef = useRef(null);

  useEffect(()=>{ lucide.createIcons(); });

  useEffect(()=>{
    if(holdSeconds === null) return;
    if(holdSeconds <= 0){ clearInterval(holdRef.current); return; }
    holdRef.current = setInterval(()=> setHoldSeconds(s=> s>0? s-1 : 0), 1000);
    return ()=> clearInterval(holdRef.current);
  }, [holdSeconds !== null]);

  function pushToast(msg, icon){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, msg, icon}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3200);
  }

  function goto(v){ setView(v); window.scrollTo({top:0, behavior:'smooth'}); }
  function openDetail(camp){ setSelectedCamp(camp); goto('detail'); }
  function toggleFavorite(id){
    setFavorites(prev=>{
      const next = new Set(prev);
      if(next.has(id)){ next.delete(id); } else { next.add(id); pushToast('찜 목록에 추가되었습니다', 'heart'); }
      return next;
    });
  }

  function loadMore(){
    if(loadingMore) return;
    setLoadingMore(true);
    setTimeout(()=>{
      setVisibleCount(c=>Math.min(c+6, CAMPS.length));
      setLoadingMore(false);
    }, 650);
  }

  function toggleAmenity(a){
    setSearchAmenities(prev=> prev.includes(a) ? prev.filter(x=>x!==a) : [...prev, a]);
  }

  const filteredCamps = useMemo(()=>{
    return CAMPS.filter(c=>{
      if(searchRegion !== '전체' && c.region !== searchRegion) return false;
      if(searchAmenities.length && !searchAmenities.every(a=>c.tags.includes(a))) return false;
      return true;
    });
  }, [searchRegion, searchAmenities]);

  function startPayment(){
    if(!name || !phone || !cardNum){
      pushToast('예약자 정보와 카드 정보를 입력해주세요', 'alert-circle');
      return;
    }
    setModal({
      title:'결제가 완료되었습니다',
      desc:`${selectedCamp.name} · ${bookingDate} · ${guests}인 예약이 확정되었습니다. 담당자에게 예약 확정 알림이 즉시 전송됩니다.`,
    });
    setHoldSeconds(null);
    pushToast('담당자에게 예약 확정 알림이 전송되었습니다', 'bell');
  }

  function beginHold(){
    setHoldSeconds(600);
    pushToast('사이트가 10분간 임시 홀드됩니다', 'clock');
  }

  const addonTotal = ADDONS.filter(a=>selectedAddons.has(a.id)).reduce((s,a)=>s+a.price,0);
  const nights = 1;
  const baseTotal = selectedCamp.price * nights;
  const grandTotal = baseTotal + addonTotal;

  const featureTabs = [
    {key:'main', label:'매거진형 큐레이션 피드', icon:'layout-grid'},
    {key:'search', label:'캠핑장 검색·필터링', icon:'search'},
    {key:'booking', label:'예약 및 PG 카드결제', icon:'credit-card'},
    {key:'addon', label:'부가 예약 옵션', icon:'utensils'},
  ];

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <header className="search-header" data-search-header>
        <div className="header-row">
          <div className="brand"><span className="brand-mark"><Icon name="tent" size={18} style={{color:'#fff'}}/></span>웨이캠프</div>
          <div className="search-bar" data-search-bar>
            <button className="search-segment" onClick={()=>goto('search')}>
              <span className="segment-label">지역</span>
              <span className="segment-value">{searchRegion}</span>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>goto('search')}>
              <span className="segment-label">날짜</span>
              <span className="segment-value">{searchDate}</span>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>goto('search')}>
              <span className="segment-label">인원</span>
              <span className="segment-value">{guests}인</span>
            </button>
            <button className="search-submit" onClick={()=>goto('search')}><Icon name="search" size={16} style={{color:'#fff'}}/></button>
          </div>
          <nav className="header-nav">
            <button className="btn-ghost" onClick={()=>pushToast('로그인 화면으로 이동합니다', 'log-in')}><Icon name="user" size={14}/>로그인</button>
            <button className="btn-primary" onClick={()=>goto('booking')}><Icon name="calendar-plus" size={14}/>예약하기</button>
          </nav>
        </div>
        <div className="filter-chips" data-filter-chips>
          {COLLECTIONS.map(c=>(
            <button key={c.key} className={"chip " + (collectionFilter===c.key?"active":"")} onClick={()=>setCollectionFilter(c.key)}>
              <Icon name={c.icon} size={14}/>{c.label}
            </button>
          ))}
        </div>
        <div className="feature-tabs">
          {featureTabs.map(t=>(
            <button key={t.key} className={"feature-tab " + (view===t.key?"active":"")} onClick={()=>goto(t.key)}>
              <span className="tab-dot"></span><Icon name={t.icon} size={14}/>{t.label}
            </button>
          ))}
        </div>
      </header>

      <main className="main">
        {view === 'main' && (
          <div className="page-wrap">
            <div className="feed-hero">
              <img src="https://picsum.photos/seed/camping-reservation-hero/1400/560" alt="안개 낀 산속 캠핑장 전경"/>
              <div className="feed-hero-content">
                <h1 className="feed-hero-title">이번 주, 어디로 떠나볼까요</h1>
                <p className="feed-hero-sub">에디터가 큐레이션한 오션뷰·글램핑·반려동물 동반 캠핑장을 매거진처럼 스크롤하며 둘러보고, 마음에 드는 곳은 바로 예약까지 이어갈 수 있습니다.</p>
                <button className="btn-primary" onClick={()=>goto('search')}><Icon name="compass" size={15}/>지금 캠핑장 찾아보기</button>
              </div>
            </div>
            {['ocean','glamp','pet'].map(colKey=>{
              const col = COLLECTIONS.find(c=>c.key===colKey);
              const items = CAMPS.filter(c=> colKey==='all' || c.collection===colKey);
              return (
                <section key={colKey}>
                  <div className="section-head">
                    <div>
                      <div className="section-title">{col.label} 컬렉션</div>
                      <div className="section-sub">에디터가 직접 큐레이션한 {col.label} 캠핑장을 만나보세요</div>
                    </div>
                  </div>
                  <div className="collection-row">
                    {items.map(c=> <ListingCard key={c.id} camp={c} onOpen={openDetail} favorites={favorites} onFavorite={toggleFavorite}/>)}
                  </div>
                </section>
              );
            })}
            <section>
              <div className="section-head">
                <div>
                  <div className="section-title">전체 캠핑장 둘러보기</div>
                  <div className="section-sub">무한 스크롤로 더 많은 캠핑장을 불러옵니다</div>
                </div>
              </div>
              <div className="card-grid">
                {CAMPS.slice(0, visibleCount).map(c=> <ListingCard key={c.id} camp={c} onOpen={openDetail} favorites={favorites} onFavorite={toggleFavorite}/>)}
              </div>
              {loadingMore && (
                <div className="skeleton-row">
                  {[1,2,3].map(i=><div className="skeleton-card" key={i}></div>)}
                </div>
              )}
              {visibleCount < CAMPS.length && !loadingMore && (
                <div className="load-more-wrap">
                  <button className="btn-ghost" onClick={loadMore}><Icon name="chevrons-down" size={14}/>더 보기</button>
                </div>
              )}
            </section>
          </div>
        )}

        {view === 'detail' && selectedCamp && (
          <div className="page-wrap">
            <button className="btn-ghost" style={{marginBottom:18}} onClick={()=>goto('main')}><Icon name="arrow-left" size={14}/>목록으로</button>
            <div className="detail-hero">
              <img src={selectedCamp.img} alt={selectedCamp.name}/>
              <div className="detail-hero-text">
                <h1>{selectedCamp.name}</h1>
                <div className="card-meta" style={{color:'var(--ivory)'}}><Icon name="map-pin" size={13}/>{selectedCamp.region} · <Icon name="star" size={13}/>{selectedCamp.rating}</div>
              </div>
            </div>
            <div className="detail-grid">
              <div className="detail-panel">
                <h3 style={{margin:'0 0 10px'}}>캠핑장 소개</h3>
                <p style={{fontSize:14,lineHeight:1.7,color:'var(--ash)'}}>{selectedCamp.desc}</p>
                <div className="amenity-list">
                  {selectedCamp.tags.map(t=><span className="amenity" key={t}><Icon name="check" size={12}/>{t}</span>)}
                </div>
              </div>
              <div className="price-box">
                <div className="price-line"><span>{selectedCamp.price.toLocaleString()}원 × 1박</span><span>{selectedCamp.price.toLocaleString()}원</span></div>
                <div className="price-total"><span>합계</span><span>{selectedCamp.price.toLocaleString()}원</span></div>
                <button className="btn-primary" style={{width:'100%',justifyContent:'center',marginTop:16}} onClick={()=>goto('booking')}><Icon name="calendar-check" size={15}/>이 캠핑장 예약하기</button>
              </div>
            </div>
          </div>
        )}

        {view === 'search' && (
          <div className="page-wrap">
            <div className="search-toolbar">
              <div className="section-title">캠핑장 검색·필터링</div>
              <button className="btn-ghost" onClick={()=>setFilterPanelOpen(o=>!o)}><Icon name="sliders-horizontal" size={14}/>{filterPanelOpen?'필터 접기':'필터 펼치기'}</button>
            </div>
            {filterPanelOpen && (
              <div className="filter-panel">
                <div className="field">
                  <label>지역</label>
                  <select value={searchRegion} onChange={e=>setSearchRegion(e.target.value)}>
                    {REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label>체크인 날짜</label>
                  <input type="date" value={searchDate} onChange={e=>setSearchDate(e.target.value)}/>
                </div>
                <div className="field" style={{gridColumn:'span 2'}}>
                  <label>편의시설</label>
                  <div className="amenity-check">
                    {AMENITIES.map(a=>(
                      <label key={a}>
                        <input type="checkbox" checked={searchAmenities.includes(a)} onChange={()=>toggleAmenity(a)}/>{a}
                      </label>
                    ))}
                  </div>
                </div>
              </div>
            )}
            <div className="section-sub" style={{marginBottom:14}}>
              {searchDate} 기준 {filteredCamps.length}개 캠핑장 · <Icon name="zap" size={12}/> 실시간 예약 가능여부 반영
            </div>
            <div className="card-grid">
              {filteredCamps.map(c=> <ListingCard key={c.id} camp={c} onOpen={openDetail} favorites={favorites} onFavorite={toggleFavorite}/>)}
            </div>
            {filteredCamps.length === 0 && <div style={{color:'var(--ash)',padding:'40px 0',textAlign:'center'}}>조건에 맞는 캠핑장이 없습니다. 필터를 조정해보세요.</div>}
          </div>
        )}

        {view === 'booking' && (
          <div className="page-wrap">
            <div className="section-title" style={{marginBottom:18}}>예약 및 PG 카드결제</div>
            {holdSeconds !== null && (
              <div className="hold-banner">
                <span><Icon name="clock" size={14} style={{marginRight:6}}/>결제 미완료 시 재고가 자동 해제됩니다</span>
                <span className="hold-time">{String(Math.floor(holdSeconds/60)).padStart(2,'0')}:{String(holdSeconds%60).padStart(2,'0')}</span>
              </div>
            )}
            <div className="booking-grid">
              <div>
                <div className="step-block">
                  <h3><Icon name="tent" size={16}/>{selectedCamp.name}</h3>
                  <div className="form-row">
                    <div className="field"><label>체크인 날짜</label><input type="date" value={bookingDate} onChange={e=>{setBookingDate(e.target.value); beginHold();}}/></div>
                    <div className="field"><label>인원</label>
                      <select value={guests} onChange={e=>setGuests(Number(e.target.value))}>
                        {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n}인</option>)}
                      </select>
                    </div>
                  </div>
                </div>
                <div className="step-block">
                  <h3><Icon name="utensils" size={16}/>부가 예약 옵션</h3>
                  <p style={{fontSize:13,color:'var(--ash)',margin:'0 0 12px'}}>선택한 부가 옵션 {selectedAddons.size}개 · <a onClick={()=>goto('addon')} style={{color:'var(--primary)',cursor:'pointer'}}>옵션 더 보기</a></p>
                </div>
                <div className="step-block">
                  <h3><Icon name="user" size={16}/>예약자 정보</h3>
                  <div className="form-row">
                    <div className="field"><label>이름</label><input placeholder="김민수" value={name} onChange={e=>setName(e.target.value)}/></div>
                    <div className="field"><label>연락처</label><input placeholder="010-1234-5678" value={phone} onChange={e=>setPhone(e.target.value)}/></div>
                  </div>
                </div>
                <div className="step-block">
                  <h3><Icon name="credit-card" size={16}/>PG 카드결제</h3>
                  <div className="card-pay-visual">
                    <Icon name="wifi" size={20} style={{transform:'rotate(90deg)'}}/>
                    <div className="card-pay-number">{cardNum ? cardNum.replace(/\d{4}(?=.)/g,'$& ').padEnd(19,'•') : '•••• •••• •••• ••••'}</div>
                  </div>
                  <div className="form-row">
                    <div className="field" style={{gridColumn:'span 2'}}><label>카드 번호</label><input maxLength="16" placeholder="1234123412341234" value={cardNum} onChange={e=>setCardNum(e.target.value.replace(/\D/g,''))}/></div>
                  </div>
                  <div className="form-row">
                    <div className="field"><label>유효기간</label><input placeholder="MM/YY"/></div>
                    <div className="field"><label>CVC</label><input placeholder="123" maxLength="3"/></div>
                  </div>
                </div>
              </div>
              <div className="price-box" style={{top:200}}>
                <h3 style={{margin:'0 0 14px',fontSize:15}}>결제 금액</h3>
                <div className="price-line"><span>{selectedCamp.name} × {nights}박</span><span>{baseTotal.toLocaleString()}원</span></div>
                {addonTotal > 0 && <div className="price-line"><span>부가 옵션</span><span>{addonTotal.toLocaleString()}원</span></div>}
                <div className="price-total"><span>총 결제금액</span><span>{grandTotal.toLocaleString()}원</span></div>
                <button className="btn-primary" style={{width:'100%',justifyContent:'center',marginTop:16}} onClick={startPayment}><Icon name="lock" size={14}/>결제하기</button>
              </div>
            </div>
          </div>
        )}

        {view === 'addon' && (
          <div className="page-wrap">
            <div className="section-title" style={{marginBottom:18}}>부가 예약 옵션</div>
            <div className="addon-grid">
              <div>
                {ADDONS.map(a=>{
                  const sel = selectedAddons.has(a.id);
                  return (
                    <div key={a.id} className={"addon-item " + (sel?"selected":"") + (a.full?" disabled":"")}>
                      <div className="addon-thumb"><img src={a.img} alt={a.name}/></div>
                      <div className="addon-info">
                        <div className="name">{a.name}</div>
                        <div className="meta">{a.type} · {a.cap} · {a.price.toLocaleString()}원</div>
                      </div>
                      <button
                        className={"addon-toggle " + (sel?"on":"")}
                        disabled={a.full}
                        onClick={()=>{
                          setSelectedAddons(prev=>{
                            const next = new Set(prev);
                            if(next.has(a.id)) next.delete(a.id); else next.add(a.id);
                            return next;
                          });
                        }}
                      ><span className="knob"></span></button>
                    </div>
                  );
                })}
              </div>
              <div className="summary-box">
                <h3 style={{margin:'0 0 12px',fontSize:15}}>선택 옵션 합계</h3>
                {ADDONS.filter(a=>selectedAddons.has(a.id)).length === 0 && <div style={{fontSize:13,color:'var(--ash)'}}>아직 선택한 옵션이 없습니다</div>}
                {ADDONS.filter(a=>selectedAddons.has(a.id)).map(a=> <div className="summary-line" key={a.id}><span>{a.name}</span><span>{a.price.toLocaleString()}원</span></div>)}
                <div className="price-total"><span>합계</span><span>{addonTotal.toLocaleString()}원</span></div>
                <button className="btn-primary" style={{width:'100%',justifyContent:'center',marginTop:16}} onClick={()=>goto('booking')}><Icon name="arrow-left" size={14}/>예약으로 돌아가기</button>
              </div>
            </div>
          </div>
        )}
      </main>

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <div className="brand" style={{marginBottom:10}}><span className="brand-mark"><Icon name="tent" size={16} style={{color:'#fff'}}/></span>웨이캠프</div>
            <p style={{fontSize:12.5,color:'var(--ash)',lineHeight:1.6,maxWidth:260}}>매거진형 큐레이션과 실시간 예약을 결합한 아웃도어 캠핑 예약 플랫폼입니다.</p>
          </div>
          <div className="footer-col"><h4>서비스</h4><a onClick={()=>goto('main')}>캠핑장 둘러보기</a><a onClick={()=>goto('search')}>검색·필터링</a><a onClick={()=>goto('booking')}>예약 및 결제</a></div>
          <div className="footer-col"><h4>고객지원</h4><a onClick={()=>pushToast('이용약관 페이지로 이동합니다','file-text')}>이용약관</a><a onClick={()=>pushToast('개인정보처리방침 페이지로 이동합니다','file-text')}>개인정보처리방침</a><a onClick={()=>pushToast('고객센터로 이동합니다','headphones')}>고객센터</a></div>
          <div className="footer-col"><h4>파트너</h4><a onClick={()=>pushToast('캠핑장 등록 문의 폼으로 이동합니다','mail')}>캠핑장 등록 문의</a><a onClick={()=>pushToast('제휴 문의 폼으로 이동합니다','handshake')}>제휴 문의</a></div>
        </div>
        <div className="footer-bottom">© 2026 웨이캠프(데모) — 자체 개발 프로젝트</div>
      </footer>

      {modal && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-icon"><Icon name="check-circle-2" size={28}/></div>
            <h3>{modal.title}</h3>
            <p>{modal.desc}</p>
            <button className="btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={()=>{setModal(null); goto('main');}}>확인</button>
          </div>
        </div>
      )}

      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
