<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠프 관제 콘솔 — 캠핑장 통합 운영 관제 콘솔</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
  :root{
    --ink:#000000; --paper:#ffffff; --surface:#f7f7f7; --surface2:#efefef;
    --felt:#6d6d6d; --ash:#9a9a9a; --border:#e2e2e2; --border-strong:#cfcfcf;
    --accent:#a02d25; --accent-tint:#f7e9e8;
    --radius-pill:75px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--paper);}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  #app-root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);}

  .shell{display:flex;width:100%;min-height:100vh;}

  /* sidebar */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--paper);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;}
  .sidebar-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);}
  .brand-mark{width:28px;height:28px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;}
  .sidebar-cmdk-hint{margin:14px 20px;padding:9px 12px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--felt);cursor:pointer;}
  .kbd{font-size:11px;padding:2px 6px;border:1px solid var(--border-strong);color:var(--felt);}
  .sidebar-nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
  .sidebar-link{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;font-size:13px;color:var(--felt);border-left:3px solid transparent;line-height:1.4;text-align:left;}
  .sidebar-link i{margin-top:1px;flex-shrink:0;font-size:16px;}
  .sidebar-link:hover{background:var(--surface);color:var(--ink);}
  .sidebar-link.active{background:var(--surface);color:var(--ink);border-left-color:var(--accent);font-weight:600;}
  .sidebar-section{padding:16px 20px 6px;}
  .sidebar-section-title{font-size:10.5px;color:var(--ash);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .sidebar-user{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .avatar-mono{width:30px;height:30px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .user-meta{font-size:12px;line-height:1.4;}
  .user-meta .name{font-weight:700;}
  .user-meta .role{color:var(--ash);}

  /* main */
  .main-wrap{margin-left:260px;flex:1;min-width:0;width:calc(100% - 260px);display:flex;flex-direction:column;}
  .topbar{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--felt);}
  .breadcrumb a{color:var(--felt);}
  .breadcrumb .current{color:var(--ink);font-weight:600;}
  .breadcrumb .divider{color:var(--border-strong);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}

  .btn-cmdk{border:1px solid var(--border-strong);padding:7px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--felt);}
  .btn-cmdk:hover{color:var(--ink);border-color:var(--ink);}
  .btn-primary{background:var(--ink);color:var(--paper);border-radius:var(--radius-pill);padding:9px 20px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s ease;}
  .btn-primary:hover{opacity:0.78;}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-outline{border:1px solid var(--ink);color:var(--ink);border-radius:var(--radius-pill);padding:8px 18px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-outline:hover{background:var(--ink);color:var(--paper);}
  .btn-outline.danger{border-color:var(--accent);color:var(--accent);}
  .btn-outline.danger:hover{background:var(--accent);color:var(--paper);}
  .btn-outline:disabled{opacity:0.35;cursor:not-allowed;background:none;color:var(--ink);}
  .btn-ghost-sm{font-size:12px;color:var(--felt);padding:6px 10px;border:1px solid transparent;}
  .btn-ghost-sm:hover{color:var(--ink);border-color:var(--border-strong);}

  .content{padding:24px 28px 60px;flex:1;width:100%;animation:fadeInUp .32s ease both;}

  /* status strip (command-tower region 1) */
  .command-banner{position:relative;width:100%;padding:34px 32px;margin-bottom:20px;overflow:hidden;color:#ffffff;
    background:linear-gradient(115deg, rgb(160,224,171) 0%, rgb(255,172,46) 52%, rgb(165,45,37) 100%);}
  .command-banner .cb-label{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;margin-bottom:8px;}
  .command-banner .cb-number{font-size:52px;font-weight:700;line-height:1;letter-spacing:-0.01em;}
  .command-banner .cb-sub{font-size:13.5px;opacity:0.9;margin-top:10px;max-width:520px;line-height:1.5;}

  .status-strip{display:flex;align-items:center;gap:0;border:1px solid var(--border);padding:12px 18px;margin-bottom:22px;flex-wrap:wrap;}
  .status-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--felt);padding:0 18px;border-right:1px solid var(--border);}
  .status-item:last-child{border-right:none;}
  .status-item strong{color:var(--ink);font-size:15px;font-weight:800;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:livePulse 1.7s ease infinite;}

  .command-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;}

  .panel{border:1px solid var(--border);background:var(--paper);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
  .panel-head h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .panel-body{padding:16px 18px;}

  .timeline{display:flex;flex-direction:column;gap:0;}
  .tl-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);animation:fadeInUp .35s ease both;}
  .tl-item:last-child{border-bottom:none;}
  .tl-stage{width:64px;flex-shrink:0;}
  .stage-pill{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);color:var(--felt);white-space:nowrap;}
  .stage-pill.s1{border-color:var(--ash);color:var(--felt);}
  .stage-pill.s2{border-color:var(--ink);color:var(--ink);}
  .stage-pill.s3{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .stage-pill.s4{background:var(--accent);color:var(--paper);border-color:var(--accent);}
  .tl-body{flex:1;min-width:0;}
  .tl-body .tl-title{font-size:13.5px;font-weight:700;}
  .tl-body .tl-meta{font-size:12px;color:var(--felt);margin-top:3px;}
  .tl-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}

  .priority-rail .p-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .priority-rail .p-item:last-child{border-bottom:none;}
  .p-item .p-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .p-item .p-meta{font-size:11.5px;color:var(--felt);margin-top:3px;}
  .p-item .p-urgent{color:var(--accent);font-weight:700;}

  .mini-widget{margin-top:20px;}
  .sparkline-row{display:flex;align-items:flex-end;gap:16px;}
  .spark-block{flex:1;}
  .spark-num{font-size:19px;font-weight:800;}
  .spark-label{font-size:11px;color:var(--felt);margin-top:2px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(160,45,37,0.35);}50%{opacity:0.5;box-shadow:0 0 0 5px rgba(160,45,37,0);}}
  @keyframes modalPop{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes rowFlash{0%{background:var(--accent-tint);}100%{background:transparent;}}

  /* vendor table */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;}
  .search-input{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);padding:8px 14px;font-size:13px;width:280px;}
  .search-input input{border:none;outline:none;font-size:13px;width:100%;background:transparent;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:11px;color:var(--felt);text-transform:uppercase;letter-spacing:0.04em;padding:10px 14px;border-bottom:1px solid var(--border-strong);cursor:pointer;user-select:none;}
  thead th:hover{color:var(--ink);}
  tbody td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--border);}
  tbody tr{animation:fadeInUp .3s ease both;cursor:pointer;}
  tbody tr:hover{background:var(--surface);}
  .status-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);}
  .status-tag.active{border-color:var(--ink);}
  .status-tag.pending{border-color:var(--accent);color:var(--accent);}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);}
  .icon-btn:hover{border-color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--accent);color:var(--accent);}

  /* slide-over drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:90;display:flex;justify-content:flex-end;animation:fadeInUp .001s;}
  .drawer{width:100%;max-width:440px;height:100%;background:var(--paper);border-left:1px solid var(--border);animation:drawerIn .28s cubic-bezier(.2,.8,.3,1) both;overflow-y:auto;}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
  .drawer-body{padding:22px;}
  .field{margin-bottom:16px;}
  .field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border-strong);padding:10px 12px;font-size:13.5px;outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .field-check-row{display:flex;flex-wrap:wrap;gap:8px;}
  .field-check-row label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--border-strong);padding:6px 10px;font-weight:400;}
  .dropzone{border:1px dashed var(--border-strong);padding:22px;text-align:center;font-size:12.5px;color:var(--felt);}

  /* confirmation-flow kanban */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kanban-col{border:1px solid var(--border);min-height:200px;}
  .kanban-col-head{padding:12px 14px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;}
  .kanban-col-head .count{color:var(--felt);font-weight:400;}
  .kanban-card{margin:10px;padding:12px;border:1px solid var(--border-strong);font-size:12.5px;animation:fadeInUp .3s ease both;}
  .kanban-card .kc-title{font-weight:700;font-size:13px;}
  .kanban-card .kc-meta{color:var(--felt);margin-top:4px;font-size:11.5px;}
  .kanban-card .kc-assign{margin-top:8px;color:var(--felt);font-size:11px;}
  .kanban-card .kc-actions{display:flex;gap:6px;margin-top:10px;}

  /* analytics */
  .period-row{display:flex;gap:8px;margin-bottom:18px;}
  .period-btn{border:1px solid var(--border-strong);padding:7px 16px;font-size:12.5px;}
  .period-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .analytics-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px;}
  .chart-box{height:260px;position:relative;padding:16px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:120;padding:20px;}
  .modal-box{background:var(--paper);border:1px solid var(--ink);padding:28px;width:100%;max-width:400px;animation:modalPop .22s ease both;}
  .modal-box h3{margin:0 0 10px;font-size:16px;}
  .modal-box p{font-size:13px;color:var(--felt);line-height:1.6;margin:0 0 20px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  .toast-stack{position:fixed;bottom:22px;right:22px;z-index:130;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:var(--paper);padding:12px 18px;font-size:12.5px;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease both;}

  .cmdk-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:140;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;}
  .cmdk-modal{width:100%;max-width:520px;background:var(--paper);border:1px solid var(--ink);animation:modalPop .18s ease both;}
  .cmdk-input{width:100%;border:none;border-bottom:1px solid var(--border);padding:16px 18px;font-size:15px;outline:none;}
  .cmdk-results{max-height:280px;overflow-y:auto;}
  .cmdk-group-title{font-size:10.5px;color:var(--ash);text-transform:uppercase;padding:10px 18px 4px;}
  .cmdk-item{padding:11px 18px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .cmdk-item:hover{background:var(--surface);}

  @media (max-width:1000px){
    .command-grid,.analytics-grid{grid-template-columns:1fr;}
    .kanban{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;
const {LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

const VENDORS = [
  {id:1, name:'해무 오션뷰 캠프', region:'강원', sites:18, amenities:['전기사이트','반려동물 동반'], status:'active', reservations:6},
  {id:2, name:'등대길 글램핑', region:'전라', sites:10, amenities:['글램핑','온수 샤워장'], status:'active', reservations:0},
  {id:3, name:'구름산 산속캠프', region:'강원', sites:14, amenities:['바베큐장'], status:'pending', reservations:0},

  {id:5, name:'독채 프라이빗 하우스', region:'제주', sites:5, amenities:['프라이빗','바베큐장'], status:'active', reservations:0},

const TIMELINE_SEED = [
  {id:'r1', stage:2, camp:'해무 오션뷰 캠프', guest:'김민수', time:'09:12', assignee:null},

  {id:'r3', stage:3, camp:'모던 카라반 파크', guest:'박서준', time:'08:47', assignee:'김민수'},

const PRIORITY_QUEUE = [
  {id:'p1', camp:'해무 오션뷰 캠프', checkin:'오늘 15:00', label:'체크인 임박', urgent:true},
  {id:'p2', camp:'등대길 글램핑', checkin:'오늘 18:00', label:'미확정', urgent:true},
  {id:'p3', camp:'모던 카라반 파크', checkin:'내일 11:00', label:'확인중', urgent:false},
];

const KANBAN_SEED = {
  1: [{id:'k1', camp:'등대길 글램핑', guest:'이지은', time:'09:24', assignee:null}],
  2: [{id:'k2', camp:'해무 오션뷰 캠프', guest:'김민수', time:'09:12', assignee:null}],
  3: [{id:'k3', camp:'모던 카라반 파크', guest:'박서준', time:'08:47', assignee:'김민수'}],
  4: [{id:'k4', camp:'독채 프라이빗 하우스', guest:'최유나', time:'08:02', assignee:'이지은'}],
};

const STAGE_LABEL = {1:'접수', 2:'확인중', 3:'업체연락', 4:'확정'};
const STAGE_CLASS = {1:'s1', 2:'s2', 3:'s3', 4:'s4'};

const TREND_DATA = {
  '7일': [{d:'월',res:8,rev:41},{d:'화',res:11,rev:58},{d:'수',res:9,rev:47},{d:'목',res:14,rev:71},{d:'금',res:18,rev:92},{d:'토',res:24,rev:128},{d:'일',res:20,rev:104}],
  '30일': [{d:'1주',res:62,rev:320},{d:'2주',res:71,rev:365},{d:'3주',res:84,rev:412},{d:'4주',res:96,rev:481}],
  '90일': [{d:'1월',res:180,rev:920},{d:'2월',res:210,rev:1080},{d:'3월',res:264,rev:1340}],
};
const REVENUE_RANK = [
  {camp:'해무 오션뷰 캠프', revenue:5240000},
  {camp:'독채 프라이빗 하우스', revenue:4680000},
  {camp:'별빛 글램핑 리조트', revenue:3920000},
  {camp:'모던 카라반 파크', revenue:3110000},
  {camp:'구름산 산속캠프', revenue:1980000},
];

function Icon({name, size=16, style={}}){
  return <i className={"ph ph-" + name} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Toast({toasts}){
  return <div className="toast-stack">{toasts.map(t=><div className="toast" key={t.id}><Icon name="check-circle" size={14}/>{t.msg}</div>)}</div>;
}

function Sidebar({view, goto}){
  const items = [
    {key:'main', label:'예약 확정 알림 관제 대시보드', icon:'broadcast'},
    {key:'vendor-crud', label:'캠핑장 업체 정보 등록·관리', icon:'buildings'},
    {key:'confirmation-flow', label:'예약 확정 처리 흐름', icon:'flow-arrow'},
    {key:'analytics', label:'예약·매출 분석 대시보드', icon:'chart-line-up'},
  ];
  return (
    <aside className="sidebar" data-sidebar style={{width:'260px'}}>
      <div className="sidebar-brand">
        <div className="brand-mark">CC</div>
        <div className="brand-name">캠프 관제 콘솔</div>
      </div>
      <div className="sidebar-cmdk-hint" onClick={()=>goto('cmdk')}>
        <span>빠른 이동</span><span className="kbd">⌘K</span>
      </div>
      <nav className="sidebar-nav">
        {items.map(it=>(
          <button key={it.key} className={"sidebar-link " + (view===it.key ? "active":"")} onClick={()=>goto(it.key)}>
            <Icon name={it.icon} size={16}/>{it.label}
          </button>
        ))}
      </nav>
      <div className="sidebar-section">
        <div className="sidebar-section-title">운영</div>
      </div>
      <button className="sidebar-link" onClick={()=>goto('main')}><Icon name="gear" size={16}/>설정</button>
      <div className="sidebar-user">
        <div className="avatar-mono">김</div>
        <div className="user-meta"><div className="name">김민수</div><div className="role">운영 담당자</div></div>
      </div>
    </aside>
  );
}

function Topbar({title, view, onCmdk, onHome, actionLabel, onAction}){
  return (
    <header className="topbar">
      <nav className="breadcrumb" aria-label="breadcrumb">
        <a onClick={onHome}>관제 콘솔</a><span className="divider">/</span><span className="current">{title}</span>
      </nav>
      <div className="topbar-actions">
        <button className="btn-cmdk" data-cmdk-trigger onClick={onCmdk}><Icon name="magnifying-glass" size={13}/>⌘ K</button>
        {actionLabel && <button className="btn-primary" onClick={onAction}><Icon name="plus" size={14}/>{actionLabel}</button>}

function CmdkOverlay({onClose, goto}){
  const [q, setQ] = useState('');
  const items = [
    {label:'예약 확정 알림 관제 대시보드', view:'main'},
    {label:'캠핑장 업체 정보 등록·관리', view:'vendor-crud'},
    {label:'예약 확정 처리 흐름', view:'confirmation-flow'},
    {label:'예약·매출 분석 대시보드', view:'analytics'},
  ].filter(i=>i.label.includes(q));
  return (
    <div className="cmdk-overlay" data-cmdk onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()}>
        <input className="cmdk-input" autoFocus placeholder="명령 또는 화면 검색…" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="cmdk-results">
          <div className="cmdk-group-title">이동</div>
          {items.map(i=>(
            <div className="cmdk-item" key={i.view} onClick={()=>{goto(i.view); onClose();}}>
              <span>{i.label}</span><span className="kbd">⏎</span>
            </div>
          ))}
        </div>

function StatusStrip({counts}){
  return (
    <div className="status-strip">
      <div className="status-item"><span className="live-dot"></span>실시간 관제</div>
      <div className="status-item">신규 예약 <strong>{counts.new}</strong>건</div>
      <div className="status-item">처리 대기 <strong>{counts.pending}</strong>건</div>
      <div className="status-item">확정 완료 <strong>{counts.confirmed}</strong>건</div>
      <div className="status-item">임박 체크인 <strong>{counts.urgent}</strong>건</div>
    </div>
  );
}

function DashboardView({goto, pushToast}){
  const [timeline, setTimeline] = useState(TIMELINE_SEED);

  function advance(id){
    setTimeline(prev=>prev.map(t=> t.id===id ? {...t, stage: Math.min(4, t.stage+1), assignee: t.assignee || '김민수'} : t));
    pushToast('처리 상태가 갱신되었습니다');
  }

  function pullNew(){
    const seq = timeline.length + 1;
    setTimeline(prev=>[{id:'r'+Date.now(), stage:1, camp:'선셋포인트 오션캠프', guest:'정하늘', time:'방금 전', assignee:null}, ...prev]);
    pushToast('새 예약 알림이 도착했습니다');
  }

  const counts = useMemo(()=>({
    new: timeline.filter(t=>t.stage===1).length,
    pending: timeline.filter(t=>t.stage<4).length,
    confirmed: timeline.filter(t=>t.stage===4).length,
    urgent: PRIORITY_QUEUE.filter(p=>p.urgent).length,
  }), [timeline]);

  return (
    <div>
      <div className="command-banner">
        <div className="cb-label">오늘의 관제 현황</div>
        <div className="cb-number">{counts.pending}건</div>
        <div className="cb-sub">처리 대기 중인 예약 확정 알림입니다. 우선 대응 큐에서 임박 체크인 건부터 확인해주세요.</div>
      </div>
      <StatusStrip counts={counts}/>
      <div className="command-grid">
        <div className="panel">
          <div className="panel-head">
            <h3><Icon name="broadcast" size={16}/>예약 확정 알림 처리 타임라인</h3>
            <button className="btn-outline" onClick={pullNew}><Icon name="bell-ringing" size={13}/>새 예약 알림 받기</button>
          </div>
          <div className="panel-body">
            <div className="timeline">
              {timeline.map(t=>(
                <div className="tl-item" key={t.id}>
                  <div className="tl-stage"><span className={"stage-pill " + STAGE_CLASS[t.stage]}>{STAGE_LABEL[t.stage]}</span></div>
                  <div className="tl-body">
                    <div className="tl-title">{t.camp} · {t.guest}</div>
                    <div className="tl-meta">접수 {t.time}{t.assignee ? (' · 담당 ' + t.assignee) : ''}</div>
                  </div>
                  <div className="tl-actions">
                    {t.stage < 4 ? (
                      <button className="btn-outline" onClick={()=>advance(t.id)}>
                        {t.stage===1?'확인 처리':t.stage===2?'업체 연락 완료':'최종 확정'}
                      </button>
                    ) : <span className="tl-meta">처리 완료</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div>
          <div className="panel priority-rail">
            <div className="panel-head"><h3><Icon name="warning-circle" size={16}/>우선 대응 큐</h3></div>
            <div className="panel-body">
              {PRIORITY_QUEUE.map(p=>(
                <div className="p-item" key={p.id}>
                  <div className="p-top"><span>{p.camp}</span><span className={p.urgent?"p-urgent":""}>{p.checkin}</span></div>
                  <div className="p-meta">{p.label}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="panel mini-widget">
            <div className="panel-head"><h3><Icon name="chart-line-up" size={16}/>매출·예약 추이</h3>
              <button className="btn-ghost-sm" onClick={()=>goto('analytics')}>전체 보기</button>
            </div>
            <div className="panel-body">
              <div className="sparkline-row">
                <div className="spark-block"><div className="spark-num">104</div><div className="spark-label">이번 주 예약</div></div>
                <div className="spark-block"><div className="spark-num">541만원</div><div className="spark-label">이번 주 매출</div></div>
              </div>
              <div style={{height:70,marginTop:14}}>
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={TREND_DATA['7일']}>
                    <Line type="monotone" dataKey="rev" stroke="#000000" strokeWidth={2} dot={false}/>
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function VendorDrawer({vendor, onClose, onSave}){
  const [form, setForm] = useState(vendor || {name:'', region:'강원', sites:5, amenities:[]});
  const AMS = ['전기사이트','온수 샤워장','반려동물 동반','카라반','글램핑','바베큐장','와이파이'];
  function toggleAm(a){ setForm(f=>({...f, amenities: f.amenities.includes(a) ? f.amenities.filter(x=>x!==a) : [...f.amenities, a]})); }
  const invalid = !form.name || !form.sites;
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" onClick={e=>e.stopPropagation()}>
        <div className="drawer-head">
          <strong>{vendor ? '업체 정보 수정' : '신규 업체 등록'}</strong>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        <div className="drawer-body">
          <div className="field"><label>업체명 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="예: 해무 오션뷰 캠프"/></div>
          <div className="field"><label>지역</label>
            <select value={form.region} onChange={e=>setForm({...form,region:e.target.value})}>
              {['강원','경기','충청','전라','경상','제주'].map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          <div className="field"><label>사이트 수 *</label><input type="number" value={form.sites} onChange={e=>setForm({...form,sites:Number(e.target.value)})}/></div>
          <div className="field">
            <label>편의시설</label>
            <div className="field-check-row">
              {AMS.map(a=>(
                <label key={a} style={form.amenities.includes(a)?{borderColor:'var(--ink)'}:{}}>
                  <input type="checkbox" checked={form.amenities.includes(a)} onChange={()=>toggleAm(a)}/>{a}
                </label>
              ))}
            </div>
          </div>
          <div className="field">
            <label>대표 이미지</label>
            <div className="dropzone"><Icon name="upload-simple" size={20}/><div style={{marginTop:6}}>이미지를 드래그하거나 클릭해 업로드</div></div>
          </div>
          <button className="btn-primary" style={{width:'100%',justifyContent:'center'}} disabled={invalid} onClick={()=>onSave(form)}>
            <Icon name="check" size={14}/>{vendor ? '수정 저장' : '업체 등록'}
          </button>
        </div>
      </div>
    </div>
  );
}

function VendorView({pushToast}){
  const [vendors, setVendors] = useState(VENDORS);
  const [query, setQuery] = useState('');
  const [drawer, setDrawer] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [sortKey, setSortKey] = useState(null);

  const filtered = useMemo(()=>{
    let list = vendors.filter(v=> v.name.includes(query) || v.region.includes(query));
    if(sortKey){ list = [...list].sort((a,b)=> (a[sortKey] > b[sortKey] ? 1 : -1)); }
    return list;
  }, [vendors, query, sortKey]);

  function save(form){
    if(form.id){
      setVendors(vs=>vs.map(v=>v.id===form.id? {...v, ...form} : v));
      pushToast('업체 정보가 수정되었습니다');
    } else {
      setVendors(vs=>[{...form, id:Date.now(), status:'active', reservations:0}, ...vs]);
      pushToast('신규 업체가 등록되었습니다');
    }
    setDrawer(null);
  }

  function confirmDelete(){
    if(deleteTarget.reservations > 0){
      pushToast('연결된 예약이 있어 삭제할 수 없습니다');
      setDeleteTarget(null);
      return;
    }
    setVendors(vs=>vs.filter(v=>v.id!==deleteTarget.id));
    pushToast('업체가 삭제되었습니다');
    setDeleteTarget(null);
  }

  return (
    <div>
      <div className="toolbar">
        <div className="search-input"><Icon name="magnifying-glass" size={14}/><input placeholder="업체명 또는 지역 검색" value={query} onChange={e=>setQuery(e.target.value)}/></div>
      </div>
      <div className="panel">
        <table>
          <thead>
            <tr>
              <th onClick={()=>setSortKey('name')}>업체명</th>
              <th onClick={()=>setSortKey('region')}>지역</th>
              <th onClick={()=>setSortKey('sites')}>사이트 수</th>
              <th>편의시설</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(v=>(
              <tr key={v.id} onClick={()=>setDrawer(v)}>
                <td>{v.name}</td>
                <td>{v.region}</td>
                <td>{v.sites}개</td>
                <td>{v.amenities.slice(0,2).join(', ')}</td>
                <td><span className={"status-tag " + (v.status==='active'?'active':'pending')}>{v.status==='active'?'운영중':'승인대기'}</span></td>
                <td>
                  <div className="row-actions" onClick={e=>e.stopPropagation()}>
                    <button className="icon-btn" onClick={()=>setDrawer(v)}><Icon name="pencil-simple" size={13}/></button>
                    <button className="icon-btn danger" onClick={()=>setDeleteTarget(v)}><Icon name="trash" size={13}/></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {drawer !== null && <VendorDrawer vendor={drawer===true?null:drawer} onClose={()=>setDrawer(null)} onSave={save}/>}

      {deleteTarget && (
        <div className="modal-overlay" onClick={()=>setDeleteTarget(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>업체를 삭제하시겠습니까?</h3>
            <p>{deleteTarget.name}{deleteTarget.reservations>0 ? ` — 연결된 예약 ${deleteTarget.reservations}건이 있어 삭제가 차단됩니다.` : ' — 삭제 후 되돌릴 수 없습니다.'}</p>
            <div className="modal-actions">
              <button className="btn-outline" onClick={()=>setDeleteTarget(null)}>취소</button>
              <button className="btn-outline danger" onClick={confirmDelete}>삭제</button>
            </div>
          </div>
        </div>
      )}

      <div style={{marginTop:16}}>
        <button className="btn-primary" onClick={()=>setDrawer(true)}><Icon name="plus" size={14}/>신규 업체 등록</button>
      </div>
    </div>
  );
}

function ConfirmModal({item, onConfirm, onClose}){
  const [reason, setReason] = useState('');
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>보류 · 거절 사유</h3>
        <p>{item.camp} 예약 건의 보류/거절 처리를 위해 사유를 입력해주세요.</p>
        <div className="field"><textarea rows="3" placeholder="예: 해당 날짜 사이트 정비 예정" value={reason} onChange={e=>setReason(e.target.value)}></textarea></div>
        <div className="modal-actions">
          <button className="btn-outline" onClick={onClose}>취소</button>
          <button className="btn-outline danger" disabled={!reason} onClick={()=>onConfirm(reason)}>처리 확정</button>
        </div>
      </div>
    </div>
  );
}

function ConfirmationFlowView({pushToast}){
  const [board, setBoard] = useState(KANBAN_SEED);
  const [rejectItem, setRejectItem] = useState(null);
  const stages = [1,2,3,4];

  function assign(stage, id){
    setBoard(b=>({...b, [stage]: b[stage].map(c=> c.id===id ? {...c, assignee:'김민수'} : c)}));
    pushToast('담당자가 배정되었습니다');
  }
  function nextStage(stage, item){
    if(stage < 4 && !item.assignee){ pushToast('담당자 배정 후 진행할 수 있습니다'); return; }
    setBoard(b=>{
      const from = b[stage].filter(c=>c.id!==item.id);
      const to = [...b[stage+1], item];
      return {...b, [stage]: from, [stage+1]: to};
    });
    pushToast('다음 단계로 이동되었습니다');
  }
  function reject(reason){
    setBoard(b=>{
      const stage = Object.keys(b).find(s=>b[s].some(c=>c.id===rejectItem.id));
      return {...b, [stage]: b[stage].filter(c=>c.id!==rejectItem.id)};
    });
    pushToast('보류 처리되었습니다: ' + reason);
    setRejectItem(null);
  }

  return (
    <div>
      <div className="kanban">
        {stages.map(s=>(
          <div className="kanban-col" key={s}>
            <div className="kanban-col-head"><span>{STAGE_LABEL[s]}</span><span className="count">{board[s].length}건</span></div>
            {board[s].map(item=>(
              <div className="kanban-card" key={item.id}>
                <div className="kc-title">{item.camp}</div>
                <div className="kc-meta">{item.guest} · {item.time}</div>
                <div className="kc-assign">{item.assignee ? ('담당 ' + item.assignee) : '담당자 미배정'}</div>
                <div className="kc-actions">
                  {!item.assignee && s<4 && <button className="btn-outline" onClick={()=>assign(s, item.id)}>담당자 배정</button>}
                  {s<4 && <button className="btn-outline" onClick={()=>nextStage(s, item)}>다음 단계</button>}
                  {s<4 && <button className="icon-btn danger" onClick={()=>setRejectItem(item)}><Icon name="x" size={12}/></button>}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
      {rejectItem && <ConfirmModal item={rejectItem} onConfirm={reject} onClose={()=>setRejectItem(null)}/>}
    </div>
  );
}

function AnalyticsView(){
  const [period, setPeriod] = useState('7일');
  const [sortKey, setSortKey] = useState('revenue');
  const data = TREND_DATA[period];
  const ranked = useMemo(()=> [...REVENUE_RANK].sort((a,b)=> sortKey==='revenue' ? b.revenue-a.revenue : a.camp.localeCompare(b.camp)), [sortKey]);

  return (
    <div>
      <div className="period-row">
        {['7일','30일','90일'].map(p=>(
          <button key={p} className={"period-btn " + (period===p?"active":"")} onClick={()=>setPeriod(p)}>{p}</button>
        ))}
      </div>
      <div className="analytics-grid">
        <div className="panel">
          <div className="panel-head"><h3><Icon name="chart-line-up" size={16}/>기간별 예약·매출 추이</h3></div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={data}>
                <CartesianGrid stroke="#e2e2e2" vertical={false}/>
                <XAxis dataKey="d" tick={{fontSize:11, fill:'#6d6d6d'}} axisLine={{stroke:'#e2e2e2'}} tickLine={false}/>
                <YAxis tick={{fontSize:11, fill:'#6d6d6d'}} axisLine={false} tickLine={false}/>
                <Tooltip/>
                <Line type="monotone" dataKey="res" name="예약 건수" stroke="#a02d25" strokeWidth={2} dot={{r:3}}/>
                <Line type="monotone" dataKey="rev" name="매출(만원)" stroke="#000000" strokeWidth={2} dot={{r:3}}/>
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="panel">
          <div className="panel-head"><h3><Icon name="tent" size={16}/>캠핑장별 매출 순위</h3></div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={ranked} layout="vertical" margin={{left:20}}>
                <XAxis type="number" hide/>
                <YAxis type="category" dataKey="camp" width={110} tick={{fontSize:10.5, fill:'#6d6d6d'}} axisLine={false} tickLine={false}/>
                <Tooltip/>
                <Bar dataKey="revenue" fill="#000000" barSize={14}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
      <div className="panel">
        <div className="panel-head">
          <h3><Icon name="table" size={16}/>캠핑장별 매출 상세</h3>
          <button className="btn-ghost-sm" onClick={()=>setSortKey(k=> k==='revenue'?'camp':'revenue')}>정렬: {sortKey==='revenue'?'매출순':'이름순'}</button>
        </div>
        <table>
          <thead><tr><th onClick={()=>setSortKey('camp')}>캠핑장</th><th onClick={()=>setSortKey('revenue')}>매출</th></tr></thead>
          <tbody>
            {ranked.map(r=>(
              <tr key={r.camp}><td>{r.camp}</td><td>{r.revenue.toLocaleString()}원</td></tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [showCmdk, setShowCmdk] = useState(false);
  const [toasts, setToasts] = useState([]);

  function pushToast(msg){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3000);
  }
  function goto(v){
    if(v==='cmdk'){ setShowCmdk(true); return; }
    setView(v);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  useEffect(()=>{
    function onKey(e){
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setShowCmdk(s=>!s); }
    }
    window.addEventListener('keydown', onKey);
    return ()=> window.removeEventListener('keydown', onKey);
  }, []);

  const titles = {
    'main':'예약 확정 알림 관제 대시보드',
    'vendor-crud':'캠핑장 업체 정보 등록·관리',
    'confirmation-flow':'예약 확정 처리 흐름',
    'analytics':'예약·매출 분석 대시보드',
  };
  return (
    <div className="shell" data-archetype="linear-sidebar-cmdk">
      <Sidebar view={view} goto={goto}/>
      <div className="main-wrap">
        <Topbar title={titles[view]} view={view} onCmdk={()=>setShowCmdk(true)} onHome={()=>goto('main')}/>
        <div className="content">
          {view === 'main' && <DashboardView goto={goto} pushToast={pushToast}/>}
          {view === 'vendor-crud' && <VendorView pushToast={pushToast}/>}
          {view === 'confirmation-flow' && <ConfirmationFlowView pushToast={pushToast}/>}
          {view === 'analytics' && <AnalyticsView/>}
        </div>
      </div>
      {showCmdk && <CmdkOverlay onClose={()=>setShowCmdk(false)} goto={goto}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
