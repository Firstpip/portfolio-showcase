<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키즈아웃 — 아이 동반 나들이 코스 추천</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --ink-navy:#0b3558; --signal-blue:#006bff; --slate-gray:#476788; --mist-gray:#a6bbd1;
    --cloud:#f8f9fb; --paper:#ffffff; --pebble:#f0f3f8; --hairline:#d4e0ed;
    --coral:#e55cff; --sky-cyan:#0099ff; --deep-cobalt:#004eba;
    --shadow-card: 0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 30px 50px rgba(71,103,136,.08);
    --shadow-btn: 0 4px 5px rgba(71,103,136,.04), 0 8px 15px rgba(71,103,136,.03), 0 15px 30px rgba(71,103,136,.06);
    --radius-card:24px; --radius-btn:8px; --radius-input:8px; --radius-badge:9999px; --radius-productcard:16px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--cloud);color:var(--ink-navy);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:8px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes markerPulse{0%{box-shadow:0 0 0 0 rgba(0,107,255,.45);}70%{box-shadow:0 0 0 16px rgba(0,107,255,0);}100%{box-shadow:0 0 0 0 rgba(0,107,255,0);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes drawerRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .navbtn{transition:color .15s ease,background .15s ease;}
  .navbtn:hover{background:var(--pebble);}
  .card-hover{transition:transform .18s ease,box-shadow .18s ease;}
  .card-hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
  .btn-primary{background:var(--signal-blue);color:#fff;border:none;border-radius:var(--radius-btn);font-weight:600;font-size:15px;padding:10px 18px;box-shadow:var(--shadow-btn);transition:transform .12s ease,filter .12s ease;}
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0) scale(.98);}
  .btn-ghost{background:transparent;color:var(--ink-navy);border:1px solid var(--hairline);border-radius:var(--radius-btn);font-weight:600;font-size:14px;padding:9px 16px;transition:background .15s ease;}
  .btn-ghost:hover{background:var(--pebble);}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-badge);padding:4px 10px;font-size:12px;font-weight:600;}
  .drawer, .detail-card, .map-control, .legend { position: absolute; box-shadow: 0 8px 24px rgba(11,53,88,.16); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

/* ---------- mock data ---------- */
const PROGRAMS = [
  {id:'p1', name:'리틀상상 도자기 체험', place:'분당 정자동', lat:38, lng:46},
  {id:'p2', name:'미니셰프 쿠킹클래스', place:'분당 서현동', lat:55, lng:30},
  {id:'p3', name:'꼬마화가 미술놀이터', place:'분당 야탑동', lat:62, lng:58},
];

const PLACES = [
  {id:'r1', type:'restaurant', name:'맘스키친 분당점', left:42, top:50, dist:0.6, hours:'11:00 - 21:00', parking:true, babyChair:true, nursing:false, rating:4.6,
    reviews:[{name:'이지은', rating:5, text:'아기의자가 넉넉해서 편했어요. 이유식도 데워주셔서 감동!'}]},
  {id:'r2', type:'restaurant', name:'온가족 김밥&분식', left:33, top:44, dist:0.9, hours:'10:30 - 20:00', parking:false, babyChair:true, nursing:false, rating:4.3,
    reviews:[{name:'박서연', rating:4, text:'아이 먹기 좋은 메뉴가 많아요. 주차는 조금 불편해요.'}]},
  {id:'r3', type:'restaurant', name:'베이비프렌들리 파스타', left:47, top:38, dist:1.4, hours:'11:30 - 21:30', parking:true, babyChair:true, nursing:true, rating:4.8,
    reviews:[{name:'최민호', rating:5, text:'수유실이 따로 있어서 정말 편했어요. 파스타도 맛있어요.'}]},
  {id:'c1', type:'cafe', name:'카페 소소한숲', left:37, top:33, dist:0.5, hours:'09:00 - 22:00', parking:true, babyChair:false, nursing:false, rating:4.4,
    reviews:[{name:'김하늘', rating:4, text:'놀이 공간이 있어서 아이가 지루해하지 않았어요.'}]},
  {id:'c2', type:'cafe', name:'라떼그림카페', left:52, top:47, dist:1.1, hours:'10:00 - 20:00', parking:false, babyChair:true, nursing:false, rating:4.2,
    reviews:[{name:'정유진', rating:4, text:'아기의자 있고 조용해서 좋았습니다.'}]},
  {id:'c3', type:'cafe', name:'무민하우스 베이커리카페', left:44, top:60, dist:1.7, hours:'08:30 - 21:00', parking:true, babyChair:true, nursing:true, rating:4.7,
    reviews:[{name:'한소미', rating:5, text:'수유실, 기저귀교환대 다 있어서 최고였어요.'}]},
];

const seedReservations = [
  {id:'b1', program:'리틀상상 도자기 체험', date:'2026-09-05', people:3, status:'confirmed'},
  {id:'b2', program:'미니셰프 쿠킹클래스', date:'2026-09-12', people:2, status:'pending'},
  {id:'b3', program:'꼬마화가 미술놀이터', date:'2026-08-20', people:4, status:'cancelled', reason:'일정 변경'},
];

const seedCourse = [
  {id:'p1', name:'리틀상상 도자기 체험', type:'experience'},
  {id:'r1', name:'맘스키친 분당점', type:'restaurant'},
  {id:'c1', name:'카페 소소한숲', type:'cafe'},
];

const CANCEL_REASONS = ['일정 변경', '단순 변심', '중복 신청', '체험처 사정'];

function Icon({name, size=18, style}) {
  return <i className={`ti ti-${name}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Toast({message, onDone}) {
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return (
    <div style={{position:'fixed', right:24, bottom:24, background:'var(--ink-navy)', color:'#fff', padding:'14px 20px',
      borderRadius:12, boxShadow:'var(--shadow-card)', zIndex:900, display:'flex', alignItems:'center', gap:10,
      animation:'slideInRight .3s ease'}}>
      <Icon name="circle-check" style={{color:'var(--sky-cyan)'}} />
      <span style={{fontSize:14, fontWeight:500}}>{message}</span>
    </div>
  );
}

function ModalShell({title, onClose, children, width=440}) {
  return (
    <div onClick={onClose} style={{position:'fixed', inset:0, background:'rgba(11,53,88,.35)', display:'flex',
      alignItems:'center', justifyContent:'center', zIndex:800, backdropFilter:'blur(2px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{width, maxWidth:'92vw', maxHeight:'86vh', overflowY:'auto',
        background:'#fff', borderRadius:12, boxShadow:'var(--shadow-card)', padding:28,
        animation:'fadeInScale .22s ease'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
          <h3 style={{margin:0, fontSize:20, fontWeight:700, color:'var(--ink-navy)'}}>{title}</h3>
          <button onClick={onClose} style={{background:'var(--pebble)', border:'none', borderRadius:8, width:32, height:32,
            display:'flex', alignItems:'center', justifyContent:'center'}}><Icon name="x" size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function TopNav({view, setView}) {
  const items = [
    {key:'main', label:'지도 홈', icon:'map-2'},
    {key:'course', label:'코스 구성', icon:'route'},
    {key:'booking', label:'예약 관리', icon:'calendar-event'},
    {key:'mypage', label:'마이페이지', icon:'user-circle'},
  ];
  return (
    <header style={{height:64, width:'100%', background:'#fff', borderBottom:'1px solid var(--hairline)',
      display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 28px', position:'relative', zIndex:50}}>
      <div style={{display:'flex', alignItems:'center', gap:10}}>
        <div style={{width:34, height:34, borderRadius:10, background:'var(--signal-blue)', display:'flex', alignItems:'center',
          justifyContent:'center'}}>
          <Icon name="map-pin-heart" size={18} style={{color:'#fff'}} />
        </div>
        <span style={{fontWeight:800, fontSize:18, letterSpacing:'-0.02em'}}>키즈아웃</span>
      </div>
      <nav style={{display:'flex', gap:4}}>
        {items.map(it=>(
          <button key={it.key} className="navbtn" onClick={()=>setView(it.key)} style={{
            display:'flex', alignItems:'center', gap:6, padding:'9px 14px', borderRadius:8, border:'none',
            background: view===it.key ? 'var(--pebble)' : 'transparent',
            color: view===it.key ? 'var(--signal-blue)' : 'var(--slate-gray)', fontWeight:600, fontSize:14}}>
            <Icon name={it.icon} size={16} />{it.label}
          </button>
        ))}
      </nav>
      <div style={{width:34, height:34, borderRadius:'50%', background:'linear-gradient(135deg,#e55cff,#0099ff)'}}></div>
    </header>
  );
}

/* ---------- 지도 홈 ---------- */
function MapHome({course, setCourse, pushToast}) {
  const [programId, setProgramId] = useState('p1');
  const [radius, setRadius] = useState(1.2);
  const [selectedId, setSelectedId] = useState(null);
  const [reviewOpen, setReviewOpen] = useState(false);
  const [reviewsExtra, setReviewsExtra] = useState({});
  const [rateVal, setRateVal] = useState(5);
  const [reviewText, setReviewText] = useState('');
  const [zoom, setZoom] = useState(1);

  const program = PROGRAMS.find(p=>p.id===programId);
  const visible = PLACES.filter(p=>p.dist <= radius);
  const selected = PLACES.find(p=>p.id===selectedId);

  function addToCourse(place) {
    if (course.some(c=>c.id===place.id)) { pushToast(`${place.name}은(는) 이미 코스에 담겨 있어요`); return; }
    setCourse([...course, {id:place.id, name:place.name, type:place.type}]);
    pushToast(`${place.name}을(를) 코스에 담았습니다`);
  }

  function submitReview(place) {
    const list = reviewsExtra[place.id] || [];
    setReviewsExtra({...reviewsExtra, [place.id]: [...list, {name:'나', rating:rateVal, text:reviewText || '좋았어요!'}]});
    setReviewText(''); setRateVal(5); setReviewOpen(false);
    pushToast('리뷰가 등록되었습니다');
  }

  return (
    <div className="map" data-archetype-region="map" style={{position:'relative', width:'100%', height:'calc(100vh - 64px)', overflow:'hidden',
      background:'linear-gradient(135deg,#eef4fb 0%,#e3edf9 45%,#dce8f6 100%)'}}>
      {/* 절차적 배경 도로/블록 + 마커 레이어 (줌 스케일 적용) */}
      <div style={{position:'absolute', inset:0, transform:`scale(${zoom})`, transformOrigin:'center center', transition:'transform .25s ease'}}>
        <svg width="100%" height="100%" style={{position:'absolute', inset:0}} preserveAspectRatio="none">
          <path d="M0,120 C300,180 600,60 1600,140" stroke="#c7d8ec" strokeWidth="18" fill="none" />
          <path d="M0,420 C400,380 900,480 1600,400" stroke="#c7d8ec" strokeWidth="14" fill="none" />
          <path d="M220,0 C300,300 260,600 340,900" stroke="#c7d8ec" strokeWidth="12" fill="none" />
          <path d="M780,0 C700,260 820,560 760,900" stroke="#c7d8ec" strokeWidth="10" fill="none" />
          <circle cx="45%" cy="40%" r="140" fill="#dfeaf7" opacity="0.6" />
          <circle cx="60%" cy="65%" r="110" fill="#e6f0fb" opacity="0.6" />
        </svg>

        {/* 내 위치 마커 (고정 기준점) */}
        <div className="marker" style={{position:'absolute', left:'50%', top:'8%', transform:'translate(-50%,-50%)'}}>
          <div style={{width:14, height:14, borderRadius:'50%', background:'var(--ink-navy)', border:'3px solid #fff', boxShadow:'0 2px 6px rgba(11,53,88,.3)'}}></div>
        </div>

        {/* 체험처(선택된 프로그램) 마커 — 펄스 */}
        <div className="marker" style={{position:'absolute', left:`${program.lng}%`, top:`${program.lat}%`, transform:'translate(-50%,-50%)'}}>
          <div style={{width:22, height:22, borderRadius:'50%', background:'var(--signal-blue)', border:'3px solid #fff',
            animation:'markerPulse 2.2s infinite'}}></div>
        </div>

        {visible.map(p=>(
          <div key={p.id} className="marker" onClick={()=>setSelectedId(p.id)}
            style={{position:'absolute', left:`${p.left}%`, top:`${p.top}%`, transform:'translate(-50%,-100%)', cursor:'pointer',
              animation:'fadeInUp .3s ease'}}>
            <div style={{width:30, height:30, borderRadius:'50% 50% 50% 0', transform:'rotate(-45deg)',
              background: p.type==='restaurant' ? 'var(--coral)' : 'var(--sky-cyan)', boxShadow:'0 3px 8px rgba(11,53,88,.25)',
              display:'flex', alignItems:'center', justifyContent:'center'}}>
              <Icon name={p.type==='restaurant' ? 'tools-kitchen-2':'coffee'} size={13} style={{color:'#fff', transform:'rotate(45deg)'}} />
            </div>
          </div>
        ))}
      </div>

      {/* 플로팅 검색/필터 drawer */}
      <aside className="drawer" style={{position:'absolute', left:16, top:16, width:290, background:'#fff', borderRadius:12,
        boxShadow:'var(--shadow-card)', padding:20, animation:'drawerRise .3s ease', maxHeight:'calc(100% - 32px)', overflowY:'auto'}}>
        <label style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)', textTransform:'uppercase', letterSpacing:'.04em'}}>체험 프로그램</label>
        <select value={programId} onChange={e=>{setProgramId(e.target.value); setSelectedId(null);}} className="search"
          style={{width:'100%', marginTop:6, marginBottom:16, padding:'10px 12px', borderRadius:'var(--radius-input)',
            border:'1px solid var(--hairline)', fontSize:14, background:'var(--pebble)'}}>
          {PROGRAMS.map(p=><option key={p.id} value={p.id}>{p.name} · {p.place}</option>)}
        </select>

        <div style={{display:'flex', justifyContent:'space-between', fontSize:12, fontWeight:700, color:'var(--slate-gray)'}}>
          <span>반경 검색 범위</span><span style={{color:'var(--signal-blue)'}}>{radius.toFixed(1)}km</span>
        </div>
        <input type="range" min="1" max="2" step="0.1" value={radius} onChange={e=>setRadius(parseFloat(e.target.value))}
          style={{width:'100%', margin:'8px 0 16px', accentColor:'var(--signal-blue)'}} />

        <div style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)', marginBottom:8}}>주변 결과 {visible.length}곳</div>
        {visible.length===0 && (
          <div style={{padding:16, background:'var(--pebble)', borderRadius:12, fontSize:13, color:'var(--slate-gray)', textAlign:'center'}}>
            반경 내 결과가 없어요. 반경을 넓혀보세요.
            <div style={{marginTop:8}}><button className="btn-ghost" onClick={()=>setRadius(2)} style={{fontSize:12, padding:'6px 12px'}}>2km로 확장</button></div>
          </div>
        )}
        <ul className="result-list" style={{listStyle:'none', margin:0, padding:0, display:'flex', flexDirection:'column', gap:8}}>
          {visible.map(p=>(
            <li key={p.id} onClick={()=>setSelectedId(p.id)} className="card-hover" style={{padding:'10px 12px', borderRadius:12,
              border: selectedId===p.id ? '1.5px solid var(--signal-blue)' : '1px solid var(--hairline)', cursor:'pointer',
              display:'flex', alignItems:'center', gap:10}}>
              <Icon name={p.type==='restaurant' ? 'tools-kitchen-2':'coffee'} size={16} style={{color: p.type==='restaurant' ? 'var(--coral)':'var(--sky-cyan)'}} />
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13.5, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{p.name}</div>
                <div style={{fontSize:11.5, color:'var(--slate-gray)'}}>{p.dist}km · ★{p.rating}</div>
              </div>
            </li>
          ))}
        </ul>
      </aside>

      {/* 상세 카드 */}
      {selected && (
        <div className="detail-card" style={{position:'absolute', right:16, bottom:16, width:320, background:'#fff',
          borderRadius:12, boxShadow:'var(--shadow-card)', padding:20, animation:'drawerRise .28s ease',
          maxHeight:'calc(100% - 32px)', overflowY:'auto'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:16, fontWeight:700}}>{selected.name}</div>
              <div style={{fontSize:12, color:'var(--slate-gray)', marginTop:2}}>{selected.hours} · ★{selected.rating}</div>
            </div>
            <button onClick={()=>setSelectedId(null)} style={{background:'var(--pebble)', border:'none', borderRadius:8, width:28, height:28}}>
              <Icon name="x" size={14} />
            </button>
          </div>

          <div style={{display:'flex', gap:6, flexWrap:'wrap', margin:'14px 0'}}>
            <span className="badge" style={{background: selected.parking?'#e6f7ee':'#fbeaea', color: selected.parking?'#16794a':'#b23a3a'}}>
              <Icon name="parking" size={13} />주차 {selected.parking?'가능':'불가'}
            </span>
            <span className="badge" style={{background: selected.babyChair?'#e6f7ee':'#fbeaea', color: selected.babyChair?'#16794a':'#b23a3a'}}>
              <Icon name="baby-carriage" size={13} />아기의자 {selected.babyChair?'있음':'없음'}
            </span>
            <span className="badge" style={{background: selected.nursing?'#e6f7ee':'#fbeaea', color: selected.nursing?'#16794a':'#b23a3a'}}>
              <Icon name="bottle" size={13} />수유실 {selected.nursing?'있음':'없음'}
            </span>
          </div>

          <button className="btn-primary" style={{width:'100%', marginBottom:8}} onClick={()=>addToCourse(selected)}>
            <Icon name="route" size={15} style={{marginRight:6}} />코스에 추가
          </button>
          <button className="btn-ghost" style={{width:'100%'}} onClick={()=>setReviewOpen(true)}>
            <Icon name="pencil" size={14} style={{marginRight:6}} />리뷰 작성
          </button>

          <div style={{marginTop:16, borderTop:'1px solid var(--hairline)', paddingTop:12}}>
            <div style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)', marginBottom:8}}>방문자 리뷰</div>
            {[...selected.reviews, ...(reviewsExtra[selected.id]||[])].map((r,i)=>(
              <div key={i} style={{fontSize:12.5, marginBottom:8, animation:'fadeInUp .25s ease'}}>
                <b>{r.name}</b> · ★{r.rating}<br/><span style={{color:'var(--slate-gray)'}}>{r.text}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {reviewOpen && selected && (
        <ModalShell title="리뷰 작성" onClose={()=>setReviewOpen(false)} width={380}>
          <div style={{fontSize:13, color:'var(--slate-gray)', marginBottom:10}}>{selected.name}</div>
          <div style={{display:'flex', gap:6, marginBottom:12}}>
            {[1,2,3,4,5].map(n=>(
              <Icon key={n} name="star-filled" size={22} onClick={()=>setRateVal(n)}
                style={{color: n<=rateVal ? '#f5a623':'var(--hairline)', cursor:'pointer'}} />
            ))}
          </div>
          <textarea value={reviewText} onChange={e=>setReviewText(e.target.value)} placeholder="방문 후기를 남겨주세요"
            style={{width:'100%', minHeight:90, padding:12, borderRadius:12, border:'1px solid var(--hairline)', fontSize:14, resize:'vertical'}}></textarea>
          <button className="btn-primary" style={{width:'100%', marginTop:14}} onClick={()=>submitReview(selected)}>등록하기</button>
        </ModalShell>
      )}

      {/* 맵 컨트롤 & 범례 */}
      <div className="map-control" style={{position:'absolute', right:16, top:16, background:'#fff', borderRadius:12,
        boxShadow:'var(--shadow-card)', display:'flex', flexDirection:'column'}}>
        <button onClick={()=>setZoom(z=>Math.min(1.6, +(z+0.2).toFixed(1)))} style={{border:'none', background:'transparent', width:40, height:40, borderBottom:'1px solid var(--hairline)'}}><Icon name="plus" /></button>
        <button onClick={()=>setZoom(z=>Math.max(0.8, +(z-0.2).toFixed(1)))} style={{border:'none', background:'transparent', width:40, height:40}}><Icon name="minus" /></button>
      </div>
      <div className="legend" style={{position:'absolute', left:16, bottom: (selected? 'unset':16), display: selected? 'none':'flex',
        gap:14, background:'#fff', borderRadius:12, boxShadow:'var(--shadow-card)', padding:'10px 16px', fontSize:12}}>
        <span style={{display:'flex', alignItems:'center', gap:5}}><span style={{width:9,height:9,borderRadius:'50%',background:'var(--signal-blue)'}}></span>체험처</span>
        <span style={{display:'flex', alignItems:'center', gap:5}}><span style={{width:9,height:9,borderRadius:'50%',background:'var(--coral)'}}></span>식당</span>
        <span style={{display:'flex', alignItems:'center', gap:5}}><span style={{width:9,height:9,borderRadius:'50%',background:'var(--sky-cyan)'}}></span>카페</span>
      </div>
    </div>
  );
}

/* ---------- 코스 구성 ---------- */
function CoursePage({course, setCourse, pushToast, savedCourses, setSavedCourses}) {
  const [dragIdx, setDragIdx] = useState(null);
  const [shareOpen, setShareOpen] = useState(false);
  const [courseName, setCourseName] = useState('분당 주말 나들이');

  function onDrop(idx) {
    if (dragIdx===null || dragIdx===idx) return;
    const next = [...course];
    const [moved] = next.splice(dragIdx,1);
    next.splice(idx,0,moved);
    setCourse(next);
    setDragIdx(null);
  }
  function removeItem(id) { setCourse(course.filter(c=>c.id!==id)); }

  function saveCourse() {
    setSavedCourses([...savedCourses, {name:courseName, count:course.length, id:Date.now()}]);
    pushToast('마이페이지에 코스가 저장되었습니다');
  }

  return (
    <div style={{maxWidth:900, margin:'0 auto', padding:'40px 24px'}}>
      <h1 style={{fontSize:44, fontWeight:800, letterSpacing:'-0.02em', margin:'0 0 6px'}}>나만의 외출 코스 구성</h1>
      <p style={{color:'var(--slate-gray)', margin:'0 0 28px', fontSize:15}}>카드를 드래그해서 방문 순서를 자유롭게 바꿔보세요.</p>

      <div style={{background:'#fff', borderRadius:12, boxShadow:'var(--shadow-card)', padding:24, marginBottom:20}}>
        <input value={courseName} onChange={e=>setCourseName(e.target.value)} style={{fontSize:18, fontWeight:700, border:'none',
          outline:'none', width:'100%', marginBottom:16, color:'var(--ink-navy)'}} />
        {course.length===0 && <div style={{color:'var(--slate-gray)', fontSize:14, padding:'20px 0', textAlign:'center'}}>지도 홈에서 장소를 담아보세요.</div>}
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {course.map((c,idx)=>(
            <div key={c.id} draggable onDragStart={()=>setDragIdx(idx)} onDragOver={e=>e.preventDefault()} onDrop={()=>onDrop(idx)}
              className="card-hover" style={{display:'flex', alignItems:'center', gap:14, padding:'14px 16px', borderRadius:14,
                border:'1px solid var(--hairline)', background:'var(--cloud)', cursor:'grab', animation:'fadeInUp .25s ease'}}>
              <Icon name="grip-vertical" style={{color:'var(--mist-gray)'}} />
              <div style={{width:30, height:30, borderRadius:'50%', background:'var(--signal-blue)', color:'#fff', fontWeight:700,
                fontSize:13, display:'flex', alignItems:'center', justifyContent:'center'}}>{idx+1}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600, fontSize:14.5}}>{c.name}</div>
                <div style={{fontSize:12, color:'var(--slate-gray)'}}>{c.type==='experience'?'체험 프로그램': c.type==='restaurant' ? '식당':'카페'}</div>
              </div>
              <button onClick={()=>removeItem(c.id)} style={{background:'transparent', border:'none', color:'var(--slate-gray)'}}><Icon name="trash" size={16} /></button>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:'flex', gap:10}}>
        <button className="btn-primary" disabled={course.length===0} onClick={saveCourse} style={{opacity: course.length===0?.5:1}}>
          <Icon name="device-floppy" size={15} style={{marginRight:6}} />코스 저장
        </button>
        <button className="btn-ghost" disabled={course.length===0} onClick={()=>setShareOpen(true)} style={{opacity: course.length===0?.5:1}}>
          <Icon name="brand-kakotalk" size={15} style={{marginRight:6}} />카카오톡 공유
        </button>
      </div>

      {shareOpen && (
        <ModalShell title="카카오톡으로 공유" onClose={()=>setShareOpen(false)}>
          <div style={{border:'1px solid var(--hairline)', borderRadius:16, padding:18, background:'var(--cloud)', marginBottom:16}}>
            <div style={{width:'100%', height:110, borderRadius:12, background:'linear-gradient(135deg,#e55cff33,#0099ff33)',
              display:'flex', alignItems:'center', justifyContent:'center', marginBottom:12}}>
              <Icon name="route" size={30} style={{color:'var(--signal-blue)'}} />
            </div>
            <div style={{fontWeight:700, fontSize:15}}>{courseName}</div>
            <div style={{fontSize:13, color:'var(--slate-gray)'}}>{course.length}곳의 장소로 구성된 나들이 코스</div>
          </div>
          <button className="btn-primary" style={{width:'100%'}} onClick={()=>{setShareOpen(false); pushToast('카카오톡으로 코스를 공유했습니다');}}>
            <Icon name="send" size={14} style={{marginRight:6}} />전송하기
          </button>
        </ModalShell>
      )}
    </div>
  );
}

/* ---------- 예약 관리 ---------- */
function BookingPage({reservations, setReservations, pushToast}) {
  const [newOpen, setNewOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const [cancelOpen, setCancelOpen] = useState(false);
  const [reason, setReason] = useState(CANCEL_REASONS[0]);
  const [form, setForm] = useState({program:PROGRAMS[0].name, date:'2026-09-20', people:2});
  const [conflict, setConflict] = useState('');

  const statusMeta = {
    pending:{label:'신청 대기', bg:'#fff4e0', color:'#a15c00'},
    confirmed:{label:'예약 확정', bg:'#e6f7ee', color:'#16794a'},
    cancelled:{label:'취소됨', bg:'#f1f1f3', color:'#6b6f76'},
  };

  function submitNew() {
    const clash = reservations.some(r=>r.program===form.program && r.date===form.date && r.status!=='cancelled');
    if (clash) { setConflict('같은 날짜·프로그램에 이미 신청 내역이 있어요. 다른 날짜를 선택해주세요.'); return; }
    setReservations([{id:'b'+Date.now(), program:form.program, date:form.date, people:Number(form.people), status:'pending'}, ...reservations]);
    setNewOpen(false); setConflict('');
    pushToast('예약 신청이 접수되었습니다');
  }

  function confirmCancel() {
    setReservations(reservations.map(r=> r.id===detail.id ? {...r, status:'cancelled', reason} : r));
    setCancelOpen(false); setDetail(null);
    pushToast('예약이 취소되었습니다');
  }

  return (
    <div style={{maxWidth:900, margin:'0 auto', padding:'40px 24px'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24}}>
        <div>
          <h1 style={{fontSize:44, fontWeight:800, letterSpacing:'-0.02em', margin:'0 0 6px'}}>예약 관리</h1>
          <p style={{color:'var(--slate-gray)', margin:0, fontSize:15}}>체험 프로그램 신청 현황을 확인하고 관리하세요.</p>
        </div>
        <button className="btn-primary" onClick={()=>setNewOpen(true)}><Icon name="plus" size={15} style={{marginRight:6}} />새 예약 신청</button>
      </div>

      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        {reservations.map((r,i)=>{
          const meta = statusMeta[r.status];
          return (
            <div key={r.id} onClick={()=>setDetail(r)} className="card-hover" style={{background:'#fff', borderRadius:16,
              boxShadow:'var(--shadow-card)', padding:'18px 20px', display:'flex', alignItems:'center', gap:16, cursor:'pointer',
              animation:`fadeInUp .25s ease ${i*0.04}s both`}}>
              <div style={{width:44, height:44, borderRadius:12, background:'var(--pebble)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                <Icon name="calendar-event" style={{color:'var(--signal-blue)'}} />
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:15}}>{r.program}</div>
                <div style={{fontSize:13, color:'var(--slate-gray)'}}>{r.date} · {r.people}명</div>
              </div>
              <span className="badge" style={{background:meta.bg, color:meta.color}}>{meta.label}</span>
            </div>
          );
        })}
      </div>

      {newOpen && (
        <ModalShell title="새 예약 신청" onClose={()=>{setNewOpen(false); setConflict('');}}>
          <label style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)'}}>체험 프로그램</label>
          <select value={form.program} onChange={e=>setForm({...form, program:e.target.value})} style={{width:'100%', margin:'6px 0 14px',
            padding:'10px 12px', borderRadius:'var(--radius-input)', border:'1px solid var(--hairline)', fontSize:14}}>
            {PROGRAMS.map(p=><option key={p.id}>{p.name}</option>)}
          </select>
          <label style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)'}}>방문 날짜</label>
          <input type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})} style={{width:'100%', margin:'6px 0 14px',
            padding:'10px 12px', borderRadius:'var(--radius-input)', border:'1px solid var(--hairline)', fontSize:14}} />
          <label style={{fontSize:12, fontWeight:700, color:'var(--slate-gray)'}}>인원 수</label>
          <input type="number" min="1" max="10" value={form.people} onChange={e=>setForm({...form, people:e.target.value})} style={{width:'100%', margin:'6px 0 14px',
            padding:'10px 12px', borderRadius:'var(--radius-input)', border:'1px solid var(--hairline)', fontSize:14}} />
          {conflict && <div style={{background:'#fbeaea', color:'#b23a3a', padding:'10px 12px', borderRadius:10, fontSize:13, marginBottom:12}}>{conflict}</div>}
          <div style={{fontSize:12, color:'var(--slate-gray)', marginBottom:14}}>결제는 현장에서 진행됩니다. 신청 후 체험처 확인을 거쳐 확정됩니다.</div>
          <button className="btn-primary" style={{width:'100%'}} onClick={submitNew}>신청하기</button>
        </ModalShell>
      )}

      {detail && !cancelOpen && (
        <ModalShell title="예약 상세" onClose={()=>setDetail(null)}>
          <div style={{fontSize:16, fontWeight:700, marginBottom:6}}>{detail.program}</div>
          <div style={{fontSize:13, color:'var(--slate-gray)', marginBottom:14}}>{detail.date} · {detail.people}명</div>
          <span className="badge" style={{background:statusMeta[detail.status].bg, color:statusMeta[detail.status].color, marginBottom:16}}>
            {statusMeta[detail.status].label}
          </span>
          {detail.reason && <div style={{fontSize:13, color:'var(--slate-gray)', margin:'10px 0'}}>취소 사유: {detail.reason}</div>}
          {detail.status==='pending' && (
            <button className="btn-ghost" style={{width:'100%', marginTop:16, color:'#b23a3a', borderColor:'#f0c9c9'}} onClick={()=>setCancelOpen(true)}>
              예약 취소하기
            </button>
          )}
        </ModalShell>
      )}

      {cancelOpen && (
        <ModalShell title="예약 취소 사유" onClose={()=>setCancelOpen(false)} width={380}>
          <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:16}}>
            {CANCEL_REASONS.map(r=>(
              <label key={r} style={{display:'flex', alignItems:'center', gap:8, padding:'10px 12px', border:'1px solid var(--hairline)',
                borderRadius:10, cursor:'pointer', background: reason===r ? 'var(--pebble)':'#fff'}}>
                <input type="radio" checked={reason===r} onChange={()=>setReason(r)} />{r}
              </label>
            ))}
          </div>
          <button className="btn-primary" style={{width:'100%', background:'#b23a3a'}} onClick={confirmCancel}>취소 확정</button>
        </ModalShell>
      )}
    </div>
  );
}

/* ---------- 마이페이지 ---------- */
function MyPage({loggedIn, setLoggedIn, savedCourses, reservations, pushToast}) {
  const [tab, setTab] = useState('courses');
  if (!loggedIn) {
    return (
      <div style={{maxWidth:420, margin:'80px auto', textAlign:'center', animation:'fadeInUp .3s ease'}}>
        <div style={{width:64, height:64, borderRadius:20, background:'var(--pebble)', margin:'0 auto 20px',
          display:'flex', alignItems:'center', justifyContent:'center'}}>
          <Icon name="user-circle" size={30} style={{color:'var(--signal-blue)'}} />
        </div>
        <h2 style={{fontSize:24, fontWeight:800, margin:'0 0 8px'}}>간편하게 시작하기</h2>
        <p style={{color:'var(--slate-gray)', margin:'0 0 28px', fontSize:14}}>카카오 또는 네이버 계정으로 별도 가입 절차 없이 이용할 수 있어요.</p>
        <button onClick={()=>{setLoggedIn(true); pushToast('카카오 계정으로 로그인되었습니다');}} style={{width:'100%', padding:'13px 16px',
          background:'#FEE500', color:'#191600', border:'none', borderRadius:'var(--radius-btn)', fontWeight:700, fontSize:15, marginBottom:10,
          display:'flex', alignItems:'center', justifyContent:'center', gap:8}}>
          <Icon name="brand-kakotalk" size={18} />카카오로 시작하기
        </button>
        <button onClick={()=>{setLoggedIn(true); pushToast('네이버 계정으로 로그인되었습니다');}} style={{width:'100%', padding:'13px 16px',
          background:'#03C75A', color:'#fff', border:'none', borderRadius:'var(--radius-btn)', fontWeight:700, fontSize:15,
          display:'flex', alignItems:'center', justifyContent:'center', gap:8}}>
          <Icon name="brand-naver" size={18} />네이버로 시작하기
        </button>
      </div>
    );
  }
  return (
    <div style={{maxWidth:800, margin:'0 auto', padding:'40px 24px'}}>
      <div style={{display:'flex', alignItems:'center', gap:16, marginBottom:28}}>
        <div style={{width:60, height:60, borderRadius:'50%', background:'linear-gradient(135deg,#e55cff,#0099ff)'}}></div>
        <div>
          <div style={{fontSize:19, fontWeight:800}}>김민준 님</div>
          <div style={{fontSize:13, color:'var(--slate-gray)'}}>분당 · 5세 자녀와 함께</div>
        </div>
      </div>

      <div style={{display:'flex', gap:6, borderBottom:'1px solid var(--hairline)', marginBottom:22}}>
        {[{k:'courses', l:'저장한 코스'},{k:'reservations', l:'예약 내역'},{k:'reviews', l:'내 리뷰'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{background:'none', border:'none', padding:'10px 14px', fontSize:14,
            fontWeight:700, color: tab===t.k ? 'var(--signal-blue)':'var(--slate-gray)', borderBottom: tab===t.k ? '2px solid var(--signal-blue)':'2px solid transparent'}}>
            {t.l}
          </button>
        ))}
      </div>

      {tab==='courses' && (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {savedCourses.length===0 && <div style={{color:'var(--slate-gray)', fontSize:14}}>아직 저장한 코스가 없어요.</div>}
          {savedCourses.map(c=>(
            <div key={c.id} className="card-hover" style={{background:'#fff', borderRadius:14, boxShadow:'var(--shadow-card)', padding:16,
              display:'flex', justifyContent:'space-between', alignItems:'center', animation:'fadeInUp .25s ease'}}>
              <div style={{fontWeight:600}}>{c.name}</div>
              <span style={{fontSize:12, color:'var(--slate-gray)'}}>{c.count}곳</span>
            </div>
          ))}
        </div>
      )}
      {tab==='reservations' && (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {reservations.map(r=>(
            <div key={r.id} style={{background:'#fff', borderRadius:14, boxShadow:'var(--shadow-card)', padding:16, animation:'fadeInUp .25s ease'}}>
              <div style={{fontWeight:600}}>{r.program}</div>
              <div style={{fontSize:12, color:'var(--slate-gray)'}}>{r.date} · {r.people}명 · {r.status==='pending'?'신청 대기':r.status==='confirmed'?'예약 확정':'취소됨'}</div>
            </div>
          ))}
        </div>
      )}
      {tab==='reviews' && (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          <div style={{background:'#fff', borderRadius:14, boxShadow:'var(--shadow-card)', padding:16, animation:'fadeInUp .25s ease'}}>
            <div style={{fontWeight:600}}>맘스키친 분당점 · ★5</div>
            <div style={{fontSize:13, color:'var(--slate-gray)', marginTop:4}}>아기의자가 넉넉해서 편했어요.</div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [course, setCourse] = useState(seedCourse);
  const [savedCourses, setSavedCourses] = useState([{id:1, name:'첫 주말 나들이', count:3}]);
  const [reservations, setReservations] = useState(seedReservations);
  const [loggedIn, setLoggedIn] = useState(false);
  const [toast, setToast] = useState(null);
  function pushToast(msg){ setToast(msg); }

  return (
    <div data-archetype="map-canvas" style={{width:'100%', minHeight:'100vh'}}>
      <TopNav view={view} setView={setView} />
      {view==='main' && <MapHome course={course} setCourse={setCourse} pushToast={pushToast} />}
      {view==='course' && <CoursePage course={course} setCourse={setCourse} pushToast={pushToast} savedCourses={savedCourses} setSavedCourses={setSavedCourses} />}
      {view==='booking' && <BookingPage reservations={reservations} setReservations={setReservations} pushToast={pushToast} />}
      {view==='mypage' && <MyPage loggedIn={loggedIn} setLoggedIn={setLoggedIn} savedCourses={savedCourses} reservations={reservations} pushToast={pushToast} />}
      {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
