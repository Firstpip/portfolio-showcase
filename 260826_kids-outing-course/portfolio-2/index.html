<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키즈아웃 운영 콘솔 — 확장 관리 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --ink:#17191c; --paper:#ffffff; --mist:#f2f2f3; --fog:#fafafb; --slate:#777b86; --ash:#979799;
    --smoke:#a3a6af; --peach:#fbe1d1; --sienna:#5d2a1a; --border:#ececec;
    --shadow-artifact: 0 0 0 1px rgba(4,23,43,.05), 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
    --radius-card:24px; --radius-pill:9999px; --radius-input:16px; --radius-image:12px;
    --sidebar-w:252px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
  @keyframes barGrow{from{width:0;}to{width:var(--w);}}
  @keyframes progressFill{from{width:0%;}to{width:100%;}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

  .row-hover{transition:border-color .15s ease, background .15s ease, transform .15s ease;}
  .row-hover:hover{border-color:var(--ink) !important; background:var(--fog); transform:scale(1.015);}
  .navitem{transition:background .15s ease,color .15s ease;}
  .navitem:hover{background:rgba(255,255,255,.08);}
  .btn-fill{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--radius-pill);font-weight:500;font-size:15px;padding:10px 22px;transition:transform .12s ease,opacity .12s ease;}
  .btn-fill:hover{opacity:.88;transform:translateY(-1px);}
  .btn-fill:active{transform:translateY(0) scale(.98);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius-pill);font-weight:500;font-size:14px;padding:9px 20px;transition:background .15s ease;}
  .btn-ghost:hover{background:var(--mist);}
  .chip{border-radius:var(--radius-pill);padding:6px 14px;font-size:13px;font-weight:500;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all .15s ease;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-pill);padding:3px 10px;font-size:12px;font-weight:500;}
  .tab-btn{background:none;border:none;padding:12px 4px;font-size:15px;font-weight:500;color:var(--slate);border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--ink);border-bottom:2px solid var(--ink);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;

/* ---------- mock data ---------- */
const REGIONS = ['분당','성남','수원','용인'];

const seedPlaces = [
  {id:'pl1', name:'리틀상상 도자기 체험', type:'experience', region:'분당', hours:'10:00-18:00', status:'active', parking:true, babyChair:true, nursing:false, bookings:12},
  {id:'pl2', name:'미니셰프 쿠킹클래스', type:'experience', region:'분당', hours:'11:00-19:00', status:'active', parking:true, babyChair:true, nursing:true, bookings:9},
  {id:'pl3', name:'꼬마화가 미술놀이터', type:'experience', region:'분당', hours:'10:00-17:00', status:'inactive', parking:false, babyChair:true, nursing:false, bookings:3},
  {id:'pl4', name:'맘스키친 분당점', type:'restaurant', region:'분당', hours:'11:00-21:00', status:'active', parking:true, babyChair:true, nursing:false, bookings:0},
  {id:'pl5', name:'카페 소소한숲', type:'cafe', region:'분당', hours:'09:00-22:00', status:'active', parking:true, babyChair:false, nursing:false, bookings:0},
  {id:'pl6', name:'온가족 김밥&분식', type:'restaurant', region:'분당', hours:'10:30-20:00', status:'active', parking:false, babyChair:true, nursing:false, bookings:0},
];

const seedReservations = [
  {id:'rv1', program:'리틀상상 도자기 체험', region:'분당', date:'2026-09-05', people:3, status:'pending'},
  {id:'rv2', program:'미니셰프 쿠킹클래스', region:'분당', date:'2026-09-12', people:2, status:'pending'},
  {id:'rv3', program:'꼬마화가 미술놀이터', region:'분당', date:'2026-08-20', people:4, status:'confirmed'},
  {id:'rv4', program:'리틀상상 도자기 체험', region:'분당', date:'2026-09-18', people:2, status:'confirmed'},
  {id:'rv5', program:'미니셰프 쿠킹클래스', region:'성남', date:'2026-09-22', people:5, status:'pending'},
  {id:'rv6', program:'꼬마화가 미술놀이터', region:'분당', date:'2026-08-02', people:2, status:'cancelled'},
];

const seedMembers = [
  {id:'m1', name:'김민준', joined:'2026-07-02', reviews:[
    {id:'rv-1', place:'맘스키친 분당점', rating:5, text:'아기의자가 넉넉해서 편했어요.', reported:false},
  ]},
  {id:'m2', name:'이지은', joined:'2026-07-10', reviews:[
    {id:'rv-2', place:'온가족 김밥&분식', rating:2, text:'광고성 후기입니다 링크 참조', reported:true, reason:'스팸'},
  ]},
  {id:'m3', name:'박서연', joined:'2026-07-18', reviews:[
    {id:'rv-3', place:'카페 소소한숲', rating:4, text:'놀이 공간이 있어서 좋았어요.', reported:false},
    {id:'rv-4', place:'리틀상상 도자기 체험', rating:1, text:'욕설이 섞인 부적절한 내용', reported:true, reason:'욕설'},
  ]},
  {id:'m4', name:'최민호', joined:'2026-08-01', reviews:[]},
];

function Icon({name, size=18, weight, style}) {
  return <i className={`ph ph-${name}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Toast({message, onDone}) {
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return (
    <div style={{position:'fixed', right:24, bottom:24, background:'var(--ink)', color:'#fff', padding:'14px 20px',
      borderRadius:14, boxShadow:'var(--shadow-artifact)', zIndex:900, display:'flex', alignItems:'center', gap:10,
      animation:'slideInRight .3s ease'}}>
      <Icon name="check-circle" style={{color:'var(--peach)'}} />
      <span style={{fontSize:14, fontWeight:500}}>{message}</span>
    </div>
  );
}

function ModalShell({title, onClose, children, width=420}) {
  return (
    <div onClick={onClose} style={{position:'fixed', inset:0, background:'rgba(23,25,28,.4)', display:'flex',
      alignItems:'center', justifyContent:'center', zIndex:800}}>
      <div onClick={e=>e.stopPropagation()} style={{width, maxWidth:'92vw', maxHeight:'86vh', overflowY:'auto',
        background:'#fff', borderRadius:24, boxShadow:'var(--shadow-artifact)', padding:28,
        animation:'fadeInScale .22s ease'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
          <h3 style={{margin:0, fontSize:20, fontWeight:600, color:'var(--ink)'}}>{title}</h3>
          <button onClick={onClose} style={{background:'var(--mist)', border:'none', borderRadius:'50%', width:32, height:32,
            display:'flex', alignItems:'center', justifyContent:'center'}}><Icon name="x" size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Sidebar({view, setView}) {
  const items = [
    {key:'main', label:'장소·체험 관리', icon:'map-trifold'},
    {key:'reservation-admin', label:'예약 현황', icon:'calendar-check'},
    {key:'member-review', label:'회원·리뷰 관리', icon:'users-three'},
    {key:'analytics', label:'운영 통계', icon:'chart-bar'},
  ];
  return (
    <aside className="sidebar" style={{position:'fixed', left:0, top:0, bottom:0, width:'var(--sidebar-w)',
      background:'var(--ink)', color:'#fff', display:'flex', flexDirection:'column', padding:'26px 16px', zIndex:60}}>
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'0 8px 28px'}}>
        <div style={{width:32, height:32, borderRadius:10, background:'var(--peach)', display:'flex', alignItems:'center', justifyContent:'center'}}>
          <Icon name="tree-structure" size={16} style={{color:'var(--sienna)'}} />
        </div>
        <span style={{fontWeight:700, fontSize:16, letterSpacing:'-0.01em'}}>키즈아웃 콘솔</span>
      </div>
      <nav style={{display:'flex', flexDirection:'column', gap:2}}>
        {items.map(it=>(
          <button key={it.key} className="navitem" onClick={()=>setView(it.key)} style={{
            display:'flex', alignItems:'center', gap:10, padding:'11px 12px', borderRadius:12, border:'none', textAlign:'left',
            background: view===it.key ? 'rgba(251,225,209,.14)' : 'transparent',
            color: view===it.key ? 'var(--peach)' : 'rgba(255,255,255,.72)', fontWeight:500, fontSize:14.5}}>
            <Icon name={it.icon} size={17} />{it.label}
          </button>
        ))}
      </nav>
      <div style={{marginTop:'auto', padding:'14px 12px', borderRadius:14, background:'rgba(255,255,255,.06)'}}>
        <svg width="100%" height="52" viewBox="0 0 220 52" style={{display:'block', marginBottom:8}}>
          <line x1="26" y1="30" x2="70" y2="14" stroke="rgba(255,255,255,.22)" strokeWidth="1.5" />
          <line x1="70" y1="14" x2="118" y2="36" stroke="rgba(255,255,255,.22)" strokeWidth="1.5" />
          <line x1="118" y1="36" x2="166" y2="16" stroke="rgba(255,255,255,.22)" strokeWidth="1.5" />
          <line x1="166" y1="16" x2="200" y2="30" stroke="rgba(255,255,255,.15)" strokeDasharray="3 3" />
          <circle cx="26" cy="30" r="5" fill="var(--peach)" />
          <circle cx="70" cy="14" r="4" fill="rgba(255,255,255,.5)" />
          <circle cx="118" cy="36" r="5" fill="var(--peach)" />
          <circle cx="166" cy="16" r="4" fill="rgba(255,255,255,.5)" />
          <circle cx="200" cy="30" r="3.5" fill="rgba(255,255,255,.3)" />
        </svg>
        <div style={{fontSize:12, color:'rgba(255,255,255,.6)', marginBottom:4}}>운영 지역</div>
        <div style={{fontSize:13.5, fontWeight:600}}>분당 · 확장 대기 3곳</div>
      </div>
    </aside>
  );
}

/* ---------- 장소·체험 관리 (master-detail) ---------- */
function PlacesAdmin({places, setPlaces, pushToast}) {
  const [filter, setFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [selectedId, setSelectedId] = useState(places[0].id);
  const [regOpen, setRegOpen] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [regForm, setRegForm] = useState({name:'', type:'experience', region:'분당'});

  const filtered = places.filter(p=> (filter==='all'||p.type===filter) && p.name.includes(query));
  const selected = places.find(p=>p.id===selectedId) || filtered[0];

  function toggleAmenity(field) {
    setPlaces(places.map(p=> p.id===selected.id ? {...p, [field]: !p[field]} : p));
  }
  function saveDetail() { pushToast(`${selected.name} 정보가 저장되었습니다`); }
  function toggleStatus() {
    setPlaces(places.map(p=> p.id===selected.id ? {...p, status: p.status==='active'?'inactive':'active'} : p));
  }
  function startUpload() {
    setUploading(true);
    setTimeout(()=>{ setUploading(false); pushToast('사진이 업로드되었습니다'); }, 1400);
  }
  function submitRegister() {
    if (!regForm.name) return;
    const id = 'pl'+Date.now();
    setPlaces([{id, name:regForm.name, type:regForm.type, region:regForm.region, hours:'10:00-19:00', status:'active',
      parking:false, babyChair:false, nursing:false, bookings:0}, ...places]);
    setSelectedId(id);
    setRegOpen(false);
    setRegForm({name:'', type:'experience', region:'분당'});
    pushToast('신규 장소가 등록되었습니다');
  }

  const typeLabel = {experience:'체험 프로그램', restaurant:'식당', cafe:'카페'};

  return (
    <div style={{display:'flex', height:'calc(100vh - 84px)'}}>
      {/* list-rail */}
      <div className="list-rail" style={{width:340, borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column'}}>
        <div style={{padding:'20px 20px 14px'}}>
          <button className="btn-fill" style={{width:'100%', marginBottom:14}} onClick={()=>setRegOpen(true)}>
            <Icon name="plus" size={15} style={{marginRight:6}} />신규 등록
          </button>
          <div style={{position:'relative', marginBottom:12}}>
            <Icon name="magnifying-glass" size={15} style={{position:'absolute', left:14, top:12, color:'var(--smoke)'}} />
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="장소 검색"
              style={{width:'100%', padding:'10px 14px 10px 38px', borderRadius:'var(--radius-input)', border:'1px solid var(--border)', fontSize:14}} />
          </div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[{k:'all',l:'전체'},{k:'experience',l:'체험'},{k:'restaurant',l:'식당'},{k:'cafe',l:'카페'}].map(f=>(
              <button key={f.k} className={`chip ${filter===f.k?'active':''}`} onClick={()=>setFilter(f.k)}>{f.l}</button>
            ))}
          </div>
        </div>
        <div style={{flex:1, overflowY:'auto', padding:'0 12px 20px'}}>
          {filtered.map(p=>(
            <div key={p.id} onClick={()=>setSelectedId(p.id)} className="row-hover" style={{padding:'14px', borderRadius:16,
              border: selected && selected.id===p.id ? '1.5px solid var(--ink)' : '1px solid transparent', cursor:'pointer',
              marginBottom:4, animation:'fadeInUp .22s ease'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div style={{fontWeight:600, fontSize:14.5}}>{p.name}</div>
                <span className="badge" style={{background: p.status==='active'?'#e6f7ee':'var(--mist)', color:p.status==='active'?'#16794a':'var(--slate)'}}>
                  {p.status==='active'?'운영중':'운영중지'}
                </span>
              </div>
              <div style={{fontSize:12.5, color:'var(--slate)', marginTop:4}}>{typeLabel[p.type]} · {p.region}</div>
            </div>
          ))}
        </div>
      </div>

      {/* detail-panel */}
      {selected && (
        <div className="detail-panel" style={{flex:1, minWidth:0, overflowY:'auto', padding:'28px 36px'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20}}>
            <div>
              <div style={{fontSize:46, fontWeight:600, letterSpacing:'-0.01em'}}>{selected.name}</div>
              <div style={{fontSize:14, color:'var(--slate)', marginTop:4}}>{typeLabel[selected.type]} · {selected.region} · {selected.hours}</div>
            </div>
            <button className="btn-ghost" onClick={toggleStatus}>
              {selected.status==='active' ? '운영 중지' : '운영 재개'}
            </button>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:24}}>
            <div style={{background:'var(--mist)', borderRadius:24, padding:20}}>
              <div style={{fontSize:13, color:'var(--slate)', marginBottom:6}}>연결된 예약</div>
              <div style={{fontSize:28, fontWeight:600}}>{selected.bookings}건</div>
            </div>
            <div style={{background:'var(--peach)', borderRadius:24, padding:20, color:'var(--sienna)'}}>
              <div style={{fontSize:13, marginBottom:6}}>등록 지역</div>
              <div style={{fontSize:28, fontWeight:600}}>{selected.region}</div>
            </div>
          </div>

          <div style={{fontSize:15, fontWeight:600, marginBottom:10}}>유아 편의시설 체크리스트</div>
          <div style={{display:'flex', gap:20, marginBottom:24}}>
            {[['parking','주차 가능','car'],['babyChair','아기의자','baby'],['nursing','수유실','drop']].map(([f,l,ic])=>(
              <label key={f} style={{display:'flex', alignItems:'center', gap:8, padding:'10px 16px', borderRadius:'var(--radius-pill)',
                border:'1px solid var(--border)', cursor:'pointer', background: selected[f] ? 'var(--fog)':'#fff'}}>
                <input type="checkbox" checked={selected[f]} onChange={()=>toggleAmenity(f)} />
                <Icon name={ic} size={15} />{l}
              </label>
            ))}
          </div>

          <div style={{fontSize:15, fontWeight:600, marginBottom:10}}>사진 문서</div>
          <div onClick={startUpload} style={{border:'1.5px dashed var(--border)', borderRadius:24, padding:24,
            textAlign:'center', cursor:'pointer', marginBottom:24}}>
            <Icon name="upload-simple" size={22} style={{color:'var(--slate)'}} />
            <div style={{fontSize:13.5, color:'var(--slate)', marginTop:8}}>클릭하여 장소 사진 업로드</div>
            {uploading && (
              <div style={{height:6, background:'var(--mist)', borderRadius:6, marginTop:12, overflow:'hidden'}}>
                <div style={{height:'100%', background:'var(--ink)', animation:'progressFill 1.3s ease forwards'}}></div>
              </div>
            )}
          </div>

          <button className="btn-fill" onClick={saveDetail}>변경사항 저장</button>
        </div>
      )}

      {regOpen && (
        <ModalShell title="신규 장소 등록" onClose={()=>setRegOpen(false)}>
          <label style={{fontSize:12, fontWeight:600, color:'var(--slate)'}}>장소명</label>
          <input value={regForm.name} onChange={e=>setRegForm({...regForm, name:e.target.value})} placeholder="예: 꿈나무 놀이체험관"
            style={{width:'100%', margin:'6px 0 14px', padding:'10px 14px', borderRadius:'var(--radius-input)', border:'1px solid var(--border)', fontSize:14}} />
          <label style={{fontSize:12, fontWeight:600, color:'var(--slate)'}}>유형</label>
          <select value={regForm.type} onChange={e=>setRegForm({...regForm, type:e.target.value})}
            style={{width:'100%', margin:'6px 0 14px', padding:'10px 14px', borderRadius:'var(--radius-input)', border:'1px solid var(--border)', fontSize:14}}>
            <option value="experience">체험 프로그램</option>
            <option value="restaurant">식당</option>
            <option value="cafe">카페</option>
          </select>
          <label style={{fontSize:12, fontWeight:600, color:'var(--slate)'}}>지역</label>
          <select value={regForm.region} onChange={e=>setRegForm({...regForm, region:e.target.value})}
            style={{width:'100%', margin:'6px 0 18px', padding:'10px 14px', borderRadius:'var(--radius-input)', border:'1px solid var(--border)', fontSize:14}}>
            {REGIONS.map(r=><option key={r}>{r}</option>)}
          </select>
          <button className="btn-fill" style={{width:'100%'}} onClick={submitRegister}>등록하기</button>
        </ModalShell>
      )}
    </div>
  );
}

/* ---------- 예약 현황 ---------- */
function ReservationAdmin({reservations, setReservations, pushToast}) {
  const [checked, setChecked] = useState([]);
  const statusMeta = {
    pending:{label:'신청 대기', bg:'var(--peach)', color:'var(--sienna)'},
    confirmed:{label:'예약 확정', bg:'#e6f7ee', color:'#16794a'},
    cancelled:{label:'취소됨', bg:'var(--mist)', color:'var(--slate)'},
  };
  const byRegion = REGIONS.map(r=>({region:r, count: reservations.filter(v=>v.region===r).length}));
  const maxCount = Math.max(...byRegion.map(b=>b.count), 1);

  function toggleCheck(id){ setChecked(checked.includes(id) ? checked.filter(c=>c!==id) : [...checked, id]); }
  function bulkConfirm() {
    setReservations(reservations.map(r=> checked.includes(r.id) && r.status==='pending' ? {...r, status:'confirmed'} : r));
    pushToast(`${checked.length}건을 예약 확정 처리했습니다`);
    setChecked([]);
  }

  return (
    <div style={{padding:'32px 36px'}}>
      <div style={{fontSize:46, fontWeight:600, marginBottom:6}}>예약 현황</div>
      <div style={{fontSize:14, color:'var(--slate)', marginBottom:24}}>신청·확정·취소 예약을 관리하고 지역별 추이를 확인하세요.</div>

      <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:20, alignItems:'start'}}>
        <div>
          <div style={{display:'flex', justifyContent:'flex-end', marginBottom:10}}>
            <button className="btn-ghost" disabled={checked.length===0} style={{opacity:checked.length?1:.4}} onClick={bulkConfirm}>
              <Icon name="check" size={14} style={{marginRight:6}} />선택 항목 일괄 확정 ({checked.length})
            </button>
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {reservations.map((r,i)=>(
              <div key={r.id} className="row-hover" style={{display:'flex', alignItems:'center', gap:14, padding:'14px 16px',
                border:'1px solid var(--border)', borderRadius:16, animation:`fadeInUp .22s ease ${i*0.03}s both`}}>
                <input type="checkbox" checked={checked.includes(r.id)} onChange={()=>toggleCheck(r.id)} disabled={r.status!=='pending'} />
                <div style={{flex:1}}>
                  <div style={{fontWeight:600, fontSize:14.5}}>{r.program}</div>
                  <div style={{fontSize:12.5, color:'var(--slate)'}}>{r.region} · {r.date} · {r.people}명</div>
                </div>
                <span className="badge" style={{background:statusMeta[r.status].bg, color:statusMeta[r.status].color}}>{statusMeta[r.status].label}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{background:'var(--fog)', borderRadius:24, padding:22}}>
          <div style={{fontSize:14, fontWeight:600, marginBottom:14}}>지역별 예약 현황</div>
          {byRegion.map(b=>(
            <div key={b.region} style={{marginBottom:14}}>
              <div style={{display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:5}}>
                <span>{b.region}</span><span style={{color:'var(--slate)'}}>{b.count}건</span>
              </div>
              <div style={{height:8, background:'var(--mist)', borderRadius:8, overflow:'hidden'}}>
                <div style={{'--w':`${(b.count/maxCount)*100}%`, height:'100%', background: b.region==='분당' ? 'var(--ink)' : 'var(--ash)',
                  animation:'barGrow .6s ease forwards', width:0}}></div>
              </div>
            </div>
          ))}
          <div style={{fontSize:12, color:'var(--smoke)', marginTop:8}}>성남·수원·용인은 확장 대상 지역입니다.</div>
        </div>
      </div>
    </div>
  );
}

/* ---------- 회원·리뷰 관리 ---------- */
function MemberReview({members, setMembers, pushToast}) {
  const [selectedId, setSelectedId] = useState(members[0].id);
  const [reasonFilter, setReasonFilter] = useState('all');
  const selected = members.find(m=>m.id===selectedId);

  function softDelete(mid, rid) {
    setMembers(members.map(m=> m.id===mid ? {...m, reviews: m.reviews.map(r=> r.id===rid ? {...r, deleted:true} : r)} : m));
    pushToast('리뷰가 삭제 처리되었습니다 (복구 가능)');
  }
  function restore(mid, rid) {
    setMembers(members.map(m=> m.id===mid ? {...m, reviews: m.reviews.map(r=> r.id===rid ? {...r, deleted:false} : r)} : m));
    pushToast('리뷰가 복구되었습니다');
  }

  const reasons = ['all','스팸','욕설','기타'];
  const visibleReviews = (selected.reviews||[]).filter(r=> reasonFilter==='all' || r.reason===reasonFilter || (reasonFilter==='기타' && r.reported && !['스팸','욕설'].includes(r.reason)));

  return (
    <div style={{display:'flex', height:'calc(100vh - 84px)'}}>
      <div style={{width:300, borderRight:'1px solid var(--border)', padding:'24px 16px', overflowY:'auto'}}>
        <div style={{fontSize:12, fontWeight:600, color:'var(--slate)', marginBottom:10, padding:'0 8px'}}>가입 회원 {members.length}명</div>
        {members.map(m=>(
          <div key={m.id} onClick={()=>setSelectedId(m.id)} className="row-hover" style={{padding:'12px 14px', borderRadius:14,
            cursor:'pointer', border: selectedId===m.id ? '1.5px solid var(--ink)':'1px solid transparent', marginBottom:4}}>
            <div style={{fontWeight:600, fontSize:14}}>{m.name}</div>
            <div style={{fontSize:12, color:'var(--slate)'}}>가입 {m.joined} · 리뷰 {m.reviews.length}건</div>
          </div>
        ))}
      </div>
      <div style={{flex:1, padding:'28px 36px', overflowY:'auto'}}>
        <div style={{fontSize:24, fontWeight:600, marginBottom:4}}>{selected.name} 님의 리뷰</div>
        <div style={{fontSize:13.5, color:'var(--slate)', marginBottom:20}}>가입일 {selected.joined}</div>

        <div style={{display:'flex', gap:6, marginBottom:18}}>
          {reasons.map(r=>(
            <button key={r} className={`chip ${reasonFilter===r?'active':''}`} onClick={()=>setReasonFilter(r)}>{r==='all'?'전체':r}</button>
          ))}
        </div>

        {visibleReviews.length===0 && <div style={{color:'var(--slate)', fontSize:14}}>표시할 리뷰가 없습니다.</div>}
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {visibleReviews.map(r=>(
            <div key={r.id} style={{border:'1px solid var(--border)', borderRadius:16, padding:16, opacity:r.deleted?.5:1, animation:'fadeInUp .2s ease'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div>
                  <div style={{fontWeight:600, fontSize:14.5}}>{r.place} · ★{r.rating}</div>
                  <div style={{fontSize:13.5, color:'var(--slate)', marginTop:4}}>{r.text}</div>
                </div>
                {r.reported && <span className="badge" style={{background:'var(--peach)', color:'var(--sienna)'}}>{r.reason} 신고</span>}
              </div>
              <div style={{marginTop:10}}>
                {!r.deleted ? (
                  <button className="btn-ghost" style={{padding:'6px 14px', fontSize:13}} onClick={()=>softDelete(selected.id, r.id)}>삭제 처리</button>
                ) : (
                  <button className="btn-ghost" style={{padding:'6px 14px', fontSize:13}} onClick={()=>restore(selected.id, r.id)}>복구하기</button>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- 운영 통계 ---------- */
function Analytics({places, reservations}) {
  const [period, setPeriod] = useState('month');
  const periodMultiplier = {week:0.3, month:1, quarter:2.6}[period];

  const byProgram = places.filter(p=>p.type==='experience').map(p=>({name:p.name, count: Math.round(p.bookings * periodMultiplier)}));
  const maxProgram = Math.max(...byProgram.map(b=>b.count), 1);
  const topCourses = [
    {name:'분당 주말 나들이', count:Math.round(18*periodMultiplier)},
    {name:'도자기 + 카페 코스', count:Math.round(14*periodMultiplier)},
    {name:'미술놀이 + 파스타 코스', count:Math.round(11*periodMultiplier)},
    {name:'쿠킹클래스 + 베이커리 코스', count:Math.round(9*periodMultiplier)},
    {name:'놀이터 투어 코스', count:Math.round(6*periodMultiplier)},
  ].sort((a,b)=>b.count-a.count);

  const facilityByRegion = REGIONS.map((r,i)=>({region:r, count: r==='분당' ? places.length : i}));
  const total = facilityByRegion.reduce((s,f)=>s+f.count,0) || 1;
  let acc = 0;
  const segments = facilityByRegion.map(f=>{ const start=acc; acc += (f.count/total)*100; return {...f, start, end:acc}; });
  const colors = ['var(--ink)','var(--ash)','var(--smoke)','var(--peach)'];

  return (
    <div style={{padding:'32px 36px'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24}}>
        <div>
          <div style={{fontSize:46, fontWeight:600}}>운영 통계</div>
          <div style={{fontSize:14, color:'var(--slate)', marginTop:4}}>기간별 예약·코스·시설 지표를 한눈에 확인하세요.</div>
        </div>
        <div style={{display:'flex', gap:6}}>
          {[{k:'week',l:'주'},{k:'month',l:'월'},{k:'quarter',l:'분기'}].map(p=>(
            <button key={p.k} className={`chip ${period===p.k?'active':''}`} onClick={()=>setPeriod(p.k)}>{p.l}</button>
          ))}
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1.2fr 1fr', gap:20, marginBottom:20}}>
        <div style={{background:'#fff', border:'1px solid var(--border)', borderRadius:24, padding:22, boxShadow:'var(--shadow-artifact)'}}>
          <div style={{fontSize:14, fontWeight:600, marginBottom:16}}>체험처별 예약 신청 건수</div>
          {byProgram.map(b=>(
            <div key={b.name} style={{marginBottom:14}}>
              <div style={{display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:5}}>
                <span>{b.name}</span><span style={{color:'var(--slate)'}}>{b.count}건</span>
              </div>
              <div style={{height:8, background:'var(--mist)', borderRadius:8, overflow:'hidden'}}>
                <div style={{'--w':`${(b.count/maxProgram)*100}%`, height:'100%', background:'var(--ink)', animation:'barGrow .6s ease forwards', width:0}}></div>
              </div>
            </div>
          ))}
        </div>

        <div style={{background:'var(--peach)', borderRadius:24, padding:22, color:'var(--sienna)'}}>
          <div style={{fontSize:14, fontWeight:600, marginBottom:16}}>지역별 시설 등록 현황</div>
          <div style={{display:'flex', alignItems:'center', gap:20}}>
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(93,42,26,.15)" strokeWidth="16" />
              {segments.map((s,i)=>{
                const circumference = 2*Math.PI*45;
                const dash = (s.end-s.start)/100*circumference;
                const offset = circumference - (s.start/100*circumference);
                return <circle key={i} cx="60" cy="60" r="45" fill="none" stroke={colors[i]} strokeWidth="16"
                  strokeDasharray={`${dash} ${circumference-dash}`} strokeDashoffset={offset} transform="rotate(-90 60 60)" />;
              })}
            </svg>
            <div>
              {facilityByRegion.map((f,i)=>(
                <div key={f.region} style={{display:'flex', alignItems:'center', gap:6, fontSize:13, marginBottom:6}}>
                  <span style={{width:9,height:9,borderRadius:'50%',background:colors[i]}}></span>{f.region} {f.count}곳
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div style={{background:'#fff', border:'1px solid var(--border)', borderRadius:24, padding:22, boxShadow:'var(--shadow-artifact)'}}>
        <div style={{fontSize:14, fontWeight:600, marginBottom:16}}>인기 코스 Top 5</div>
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {topCourses.map((c,i)=>(
            <div key={c.name} style={{display:'flex', alignItems:'center', gap:14}}>
              <div style={{width:26, height:26, borderRadius:'50%', background: i===0?'var(--ink)':'var(--mist)',
                color: i===0?'#fff':'var(--ink)', fontSize:12, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center'}}>{i+1}</div>
              <div style={{flex:1, fontSize:14}}>{c.name}</div>
              <div style={{fontSize:13, color:'var(--slate)'}}>{c.count}회 이용</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [places, setPlaces] = useState(seedPlaces);
  const [reservations, setReservations] = useState(seedReservations);
  const [members, setMembers] = useState(seedMembers);
  const [toast, setToast] = useState(null);
  function pushToast(msg){ setToast(msg); }

  const titles = {main:'장소·체험 관리', 'reservation-admin':'예약 현황', 'member-review':'회원·리뷰 관리', analytics:'운영 통계'};

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView} />
      <main className="main-wrap" style={{marginLeft:'var(--sidebar-w)', flex:1, minWidth:0, width:'calc(100% - 252px)', background:'var(--paper)'}}>
        <header style={{height:64, borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', padding:'0 36px', justifyContent:'space-between'}}>
          <div style={{fontSize:15, fontWeight:600, color:'var(--slate)'}}>{titles[view]}</div>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <Icon name="bell" size={18} style={{color:'var(--slate)'}} />
            <div style={{width:32, height:32, borderRadius:'50%', background:'var(--mist)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700}}>운</div>
          </div>
        </header>
        {view==='main' && <PlacesAdmin places={places} setPlaces={setPlaces} pushToast={pushToast} />}
        {view==='reservation-admin' && <ReservationAdmin reservations={reservations} setReservations={setReservations} pushToast={pushToast} />}
        {view==='member-review' && <MemberReview members={members} setMembers={setMembers} pushToast={pushToast} />}
        {view==='analytics' && <Analytics places={places} reservations={reservations} />}
      </main>
      {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
