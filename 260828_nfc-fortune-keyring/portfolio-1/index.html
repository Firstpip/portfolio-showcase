<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탭사주 — NFC 키링 운세 웹 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --ink:#17191c;
    --paper:#ffffff;
    --mist:#f2f2f3;
    --fog:#fafafb;
    --slate:#777b86;
    --ash:#979799;
    --smoke:#a3a6af;
    --peach:#fbe1d1;
    --sienna:#5d2a1a;
    --shadow-artifact:0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
    --shadow-modal:rgba(0,0,0,0.05) 0px 0px 0px 1px, rgba(0,0,0,0.12) 0px 8px 40px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  h1,h2,h3,h4,p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--peach);color:var(--sienna);}

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes floatY{
    0%,100%{transform:translateY(0px) rotate(var(--tilt,0deg));}
    50%{transform:translateY(-10px) rotate(var(--tilt,0deg));}
  }
  @keyframes shimmer{
    0%{background-position:-400px 0;}
    100%{background-position:400px 0;}
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(93,175,110,0.55);}
    70%{box-shadow:0 0 0 9px rgba(93,175,110,0);}
    100%{box-shadow:0 0 0 0 rgba(93,175,110,0);}
  }
  @keyframes ringDraw{
    from{stroke-dashoffset:220;}
    to{stroke-dashoffset:var(--ring-final,60);}
  }
  @keyframes tickIn{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
  }

  .fade-up{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
  .float-card{animation:floatY 5.5s ease-in-out infinite;}
  .skeleton-line{
    background:linear-gradient(90deg, var(--mist) 25%, #e8e8ea 37%, var(--mist) 63%);
    background-size:400px 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    border-radius:8px;
  }
  .status-dot{
    width:9px;height:9px;border-radius:50%;background:#5daf6e;
    animation:pulseDot 2s infinite;
  }

  .pill-filled{
    background:var(--ink); color:#fff; border:1px solid var(--ink);
    border-radius:9999px; padding:13px 26px; font-size:16px; font-weight:500;
    display:inline-flex; align-items:center; gap:8px; transition:transform .18s ease, opacity .18s ease;
  }
  .pill-filled:hover{transform:translateY(-2px); opacity:.92;}
  .pill-ghost{
    background:transparent; color:var(--ink); border:1px solid var(--ink);
    border-radius:9999px; padding:13px 26px; font-size:16px; font-weight:500;
    display:inline-flex; align-items:center; gap:8px; transition:background .18s ease, transform .18s ease;
  }
  .pill-ghost:hover{background:var(--mist); transform:translateY(-2px);}
  .text-link{
    background:none;border:none;color:var(--ink);font-size:16px;font-weight:500;padding:8px 0;
    display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid transparent;transition:border-color .15s ease;
  }
  .text-link:hover{border-color:var(--ink);}

  .artifact-card{
    background:#fff; border-radius:20px; box-shadow:var(--shadow-artifact);
    padding:16px 20px 14px 14px;
  }
  .neutral-card{
    background:var(--mist); border-radius:24px; padding:28px 22px;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .neutral-card:hover{transform:translateY(-5px); box-shadow:0 14px 30px -14px rgba(23,25,28,.25);}
  .peach-card{ background:var(--peach); color:var(--sienna); border-radius:24px; padding:40px; }

  .topnav{
    width:100%; position:sticky; top:0; z-index:40; background:rgba(255,255,255,0.86);
    backdrop-filter:blur(10px); border-bottom:1px solid #ececec;
  }
  .topnav-inner{
    max-width:1200px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;
  }
  .nav-links{display:flex;gap:28px;align-items:center;}
  .nav-links button{background:none;border:none;color:var(--ink);font-size:16px;font-weight:500;padding:2px 0;}
  .nav-links button:hover{opacity:.6;}

  .hero{max-width:1200px;margin:0 auto;padding:34px 28px 8px;position:relative;}
  .hero-headline{
    font-size:clamp(34px,5.2vw,54px); line-height:1.16; letter-spacing:-0.02em; font-weight:600;
    max-width:760px;
  }
  .hero-headline em{font-style:italic; color:var(--sienna); font-weight:600;}
  .hero-sub{font-size:16px; line-height:1.5; color:var(--slate); max-width:560px; margin-top:12px;}

  .hero-artifacts{position:relative;height:230px;margin-top:40px;}
  .hero-artifacts .artifact-card{position:absolute;width:220px;}

  .wizard-section{max-width:1200px;margin:0 auto;padding:14px 28px 96px;}
  .wizard-grid{display:grid;grid-template-columns:2.15fr 1fr;gap:22px;margin-top:16px;}
  @media (max-width:920px){ .wizard-grid{grid-template-columns:1fr;} }

  .stepper{display:flex;gap:6px;background:var(--fog);border-radius:9999px;padding:6px;flex-wrap:wrap;margin-top:12px;}
  .step-tab{
    border:none;background:transparent;border-radius:9999px;padding:11px 18px;font-size:14px;font-weight:500;
    color:var(--slate); display:flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s ease;
  }
  .step-tab.active{background:var(--ink); color:#fff;}
  .step-tab .num{
    width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .step-tab.active .num{background:rgba(255,255,255,0.22);}

  .step-body{
    background:#fff; border:1px solid #ececec; border-radius:24px; padding:26px; margin-top:14px; min-height:340px;
  }
  .summary-side{
    background:var(--mist); border-radius:24px; padding:22px; height:fit-content; margin-top:14px;
  }
  .summary-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(0,0,0,0.06);font-size:15px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--ash);}
  .summary-row .v{font-weight:500;}

  .wheel-field{display:flex;flex-direction:column;gap:6px;}
  .wheel-field label{font-size:13px;color:var(--ash);font-weight:500;}
  .wheel-select{
    appearance:none; background:var(--fog); border:1px solid #ececec; border-radius:16px;
    padding:14px 16px; font-size:17px; font-weight:500; color:var(--ink); width:100%;
  }
  .toggle-row{display:flex;align-items:center;gap:10px;}
  .toggle{
    width:44px;height:26px;border-radius:9999px;background:#e2e2e4;position:relative;border:none;transition:background .2s ease;
  }
  .toggle.on{background:var(--ink);}
  .toggle .knob{
    position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .toggle.on .knob{transform:translateX(18px);}

  .fortune-card{border:1px solid #ececec;border-radius:20px;padding:22px;background:var(--fog);}
  .fortune-card h4{font-size:15px;color:var(--sienna);font-weight:600;margin-bottom:8px;}

  .lang-chip{
    border:1px solid #ececec;background:#fff;border-radius:16px;padding:16px;text-align:left;
    display:flex;flex-direction:column;gap:4px;transition:all .18s ease;
  }
  .lang-chip.active{border-color:var(--ink);background:var(--fog);}
  .lang-chip .code{font-size:12px;color:var(--ash);font-weight:600;letter-spacing:.04em;}
  .lang-chip .name{font-size:16px;font-weight:600;}

  .showcase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;}
  @media (max-width:900px){ .showcase-grid{grid-template-columns:1fr;} }

  .footer{max-width:1200px;margin:0 auto;padding:44px 28px 60px;display:flex;justify-content:space-between;align-items:center;color:var(--ash);font-size:14px;border-top:1px solid #ececec;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,25,28,0.42); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeInUp .22s ease both;
  }
  .modal-card{
    background:#fff;border-radius:24px;max-width:560px;width:100%;padding:34px;box-shadow:var(--shadow-modal);
    max-height:82vh;overflow-y:auto;
  }
  .modal-close{
    border:none;background:var(--mist);border-radius:9999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  }
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:14px 22px; border-radius:9999px; font-size:14px; font-weight:500; z-index:200;
    display:flex; align-items:center; gap:8px; animation:fadeInUp .3s ease both;
  }

  section{width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const FEATURES = [
  {
    key:'main', name:'NFC 태그 접속',
    desc:'스마트폰을 가방 키링에 태그하면 NDEF URL 레코드를 통해 앱 설치 없이 모바일 웹으로 자동 접속합니다.',
    bullets:[
      'NDEF URL 레코드 구조를 설계하여 태그 1회 인식으로 앱 설치 없이 모바일 웹 랜딩에 자동 진입하는 흐름을 구현합니다',
      'User-Agent 감지 기반 iOS/Android 브라우저별 NFC 리디렉션 동작 차이를 흡수하는 폴백 로직을 적용합니다',
      '랜딩 진입 시 세션 토큰을 발급해 입력·결과 화면 간 상태를 유지하는 경량 세션 구조를 설계합니다'
    ],
    highlight:'NDEF URL 기반 원터치 접속 구조를 구현하여 별도 앱 설치나 로그인 없이 태그 한 번으로 서비스 진입이 가능하도록 설계합니다.'
  },
  {
    key:'input', name:'생년월일시 입력',
    desc:'연·월·일·시를 단계별로 입력받는 심플한 폼으로 사주 계산에 필요한 정보를 빠르고 정확하게 수집합니다.',
    bullets:[
      'React Hook Form + Zod 스키마로 생년월일시 각 필드의 형식·범위 유효성을 실시간 검증합니다',
      '휠 피커 형태의 커스텀 입력 컴포넌트를 구현하여 모바일 환경에서 빠르게 입력하도록 설계합니다',
      '양력/음력 선택 토글과 시간 미상 옵션을 제공해 다양한 입력 조건을 흡수하는 폼 구조를 적용합니다'
    ],
    highlight:'모바일 터치 환경에 최적화된 휠 피커 입력 컴포넌트를 자체 구현하여 소수의 탭만으로 생년월일시 입력을 완료할 수 있는 구조를 설계합니다.'
  },
  {
    key:'result', name:'AI 운세 결과 확인',
    desc:'입력된 생년월일시를 기반으로 AI API가 생성한 사주·운세 콘텐츠를 카드 형태로 제공합니다.',
    bullets:[
      '생년월일시·음양력 정보를 포함한 프롬프트 템플릿을 설계해 AI API로부터 구조화된 사주 결과 JSON을 받는 파이프라인을 구현합니다',
      '동일 입력 응답을 PostgreSQL에 캐싱해 중복 API 호출 없이 즉시 재제공하는 구조를 적용합니다',
      '결과 텍스트를 총운·애정운·재물운 카테고리별 카드로 분할 렌더링하는 컴포넌트를 설계합니다'
    ],
    highlight:'AI API 응답을 카테고리별 구조화 데이터로 파싱해 시각적 카드 UI로 재구성하는 결과 렌더링 파이프라인을 구현합니다.'
  },
  {
    key:'language', name:'다국어 전환',
    desc:'한국어·영어·중국어·일본어 4개 언어로 운세 결과와 UI 전체를 전환할 수 있는 다국어 지원 기능입니다.',
    bullets:[
      'i18next로 UI 레이블·버튼 등 정적 텍스트의 4개 언어 리소스를 분리 관리하는 구조를 구현합니다',
      'AI 번역 API를 운세 결과 생성 파이프라인에 연결해 언어 전환 시 결과 콘텐츠까지 함께 재구성하는 로직을 적용합니다',
      '언어별 번역 결과를 캐싱해 같은 언어로 재전환 시 재번역 없이 즉시 표시되도록 설계합니다'
    ],
    highlight:'UI 정적 텍스트와 AI 생성 콘텐츠를 분리 처리하는 이중 다국어 파이프라인을 구현하여 4개 언어 전환에도 결과 일관성을 유지합니다.'
  }
];

const LANGS = [
  {code:'KO', name:'한국어', total:'총운 84', body:'오늘은 새로운 인연이 스며드는 날입니다. 오전보다 오후에 결정을 내리면 흐름이 유리하게 작용합니다.'},
  {code:'EN', name:'English', total:'Overall 84', body:'Today favors new connections. Decisions made in the afternoon carry a more favorable flow than the morning.'},
  {code:'中', name:'中文', total:'总运 84', body:'今天适合结识新缘分。比起上午，下午做的决定会更顺利。'},
  {code:'日', name:'日本語', total:'総運 84', body:'今日は新しいご縁が芽生える日です。午前より午後に決めると流れが良くなります。'}
];

function RadialRing({value=84}){
  const r=34, c=2*Math.PI*r, off=c*(1-value/100);
  return (
    <svg width="88" height="88" viewBox="0 0 88 88">
      <circle cx="44" cy="44" r={r} fill="none" stroke="#f2f2f3" strokeWidth="8"/>
      <circle cx="44" cy="44" r={r} fill="none" stroke="#5d2a1a" strokeWidth="8" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 44 44)"
        style={{'--ring-final':off, animation:'ringDraw 1.1s ease-out both'}}/>
      <text x="44" y="49" textAnchor="middle" fontSize="20" fontWeight="600" fill="#17191c">{value}</text>
    </svg>
  );
}

function TopNav({onNavigate}){
  return (
    <header className="topnav">
      <div className="topnav-inner">
        <div style={{display:'flex',alignItems:'center',gap:8,fontSize:19,fontWeight:700}}>
          <i className="ph-fill ph-moon-stars" style={{fontSize:22}}></i>
          탭사주
        </div>
        <nav className="nav-links">
          <button onClick={()=>onNavigate('showcase')}>서비스 소개</button>
          <button onClick={()=>onNavigate('wizard')}>이용 안내</button>
          <button className="text-link" onClick={()=>onNavigate('wizard')}>구현 상세 <i className="ph ph-arrow-right"></i></button>
          <button className="pill-filled" onClick={()=>onNavigate('wizard')}>데모 체험하기</button>
        </nav>
      </div>
    </header>
  );
}

function Hero({onStart}){
  return (
    <section className="hero">
      <h1 className="hero-headline fade-up">가방 키링을 태그하면, 당신의 <em>오늘</em>이 열립니다</h1>
      <p className="hero-sub fade-up" style={{animationDelay:'.08s'}}>
        NFC 칩 하나로 접속하는 모바일 웹, 생년월일시 입력, AI가 생성하는 사주·운세 결과까지 —
        가방 제조사의 고객 경험을 그대로 구현한 데모입니다.
      </p>
    </section>
  );
}

function HeroArtifacts(){
  return (
    <section className="hero" style={{paddingTop:0}}>
      <div className="hero-artifacts">
        <div className="artifact-card float-card" style={{left:0, top:10, '--tilt':'-2deg'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <span className="status-dot"></span>
            <span style={{fontSize:13,color:'#777b86',fontWeight:500}}>NFC 태그 인식됨</span>
          </div>
          <div style={{fontSize:15,fontWeight:600}}>키링 #A-1042</div>
          <div style={{fontSize:12,color:'#a3a6af',marginTop:2}}>0.3초만에 랜딩 진입</div>
        </div>

        <div className="artifact-card float-card" style={{left:'34%', top:0, animationDelay:'.6s', '--tilt':'1deg'}}>
          <div style={{fontSize:13,color:'#777b86',marginBottom:8,fontWeight:500}}>오늘의 총운</div>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <RadialRing value={84}/>
            <div>
              <div style={{fontSize:13,color:'#5daf6e',fontWeight:600}}>↑ 좋은 흐름</div>
              <div style={{fontSize:12,color:'#a3a6af'}}>애정운 · 재물운 포함</div>
            </div>
          </div>
        </div>

        <div className="artifact-card float-card" style={{left:'68%', top:16, animationDelay:'1.1s', '--tilt':'-1.5deg', width:200}}>
          <div style={{fontSize:13,color:'#777b86',marginBottom:10,fontWeight:500}}>지원 언어</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {['KO','EN','中','日'].map(l=>(
              <span key={l} style={{background:'#fbe1d1',color:'#5d2a1a',fontSize:12,fontWeight:600,padding:'4px 9px',borderRadius:9999}}>{l}</span>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function StepTabs({step, setStep}){
  return (
    <div className="stepper">
      {FEATURES.map((f,i)=>(
        <button key={f.key} className={'step-tab'+(step===f.key?' active':'')} onClick={()=>setStep(f.key)}>
          <span className="num">{i+1}</span>{f.name}
        </button>
      ))}
    </div>
  );
}

function MainStep({onNext}){
  return (
    <div className="fade-up" key="main-step">
      <h3 style={{fontSize:26,fontWeight:600,marginBottom:12}}>NFC 태그 접속 시뮬레이션</h3>
      <p style={{color:'#777b86',fontSize:16,lineHeight:1.6,maxWidth:520}}>
        실제 서비스에서는 사용자가 가방 키링의 NFC 칩에 스마트폰을 가져다 대는 순간, 별도의 앱 설치나
        로그인 없이 아래와 같은 랜딩 화면으로 자동 진입합니다.
      </p>
      <div style={{
        marginTop:26, background:'var(--fog)', border:'1px dashed #d8d8da', borderRadius:20,
        padding:'40px 24px', textAlign:'center'
      }}>
        <div style={{
          width:64,height:64,borderRadius:'50%',background:'#17191c',color:'#fff',
          display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px', animation:'floatY 3s ease-in-out infinite'
        }}>
          <i className="ph-fill ph-wifi-high" style={{fontSize:28}}></i>
        </div>
        <div style={{fontSize:15,fontWeight:600}}>키링 #A-1042 태그 감지</div>
        <div style={{fontSize:13,color:'#a3a6af',marginTop:4}}>세션 토큰 발급 완료 · tapsaju.app/t/a1042</div>
        <button className="pill-filled" style={{marginTop:20}} onClick={onNext}>
          <i className="ph ph-arrow-right"></i> 입력 화면으로 이동
        </button>
      </div>
    </div>
  );
}

function InputStep({form, setForm, onNext}){
  const years = Array.from({length:70},(_,i)=>2010-i);
  return (
    <div className="fade-up" key="input-step">
      <h3 style={{fontSize:26,fontWeight:600,marginBottom:6}}>생년월일시 입력</h3>
      <p style={{color:'#777b86',fontSize:15,marginBottom:24}}>정확한 사주 계산을 위해 태어난 연·월·일·시를 선택해 주세요.</p>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
        <div className="wheel-field">
          <label>년</label>
          <select className="wheel-select" value={form.year} onChange={e=>setForm({...form,year:e.target.value})}>
            {years.map(y=><option key={y}>{y}</option>)}
          </select>
        </div>
        <div className="wheel-field">
          <label>월</label>
          <select className="wheel-select" value={form.month} onChange={e=>setForm({...form,month:e.target.value})}>
            {Array.from({length:12},(_,i)=>i+1).map(m=><option key={m}>{m}</option>)}
          </select>
        </div>
        <div className="wheel-field">
          <label>일</label>
          <select className="wheel-select" value={form.day} onChange={e=>setForm({...form,day:e.target.value})}>
            {Array.from({length:31},(_,i)=>i+1).map(d=><option key={d}>{d}</option>)}
          </select>
        </div>
        <div className="wheel-field">
          <label>시</label>
          <select className="wheel-select" disabled={form.timeUnknown} value={form.hour} onChange={e=>setForm({...form,hour:e.target.value})}>
            {Array.from({length:24},(_,i)=>i).map(h=><option key={h}>{String(h).padStart(2,'0')}시</option>)}
          </select>
        </div>
      </div>

      <div style={{display:'flex',gap:28,marginTop:24,flexWrap:'wrap'}}>
        <div className="toggle-row">
          <button className={'toggle'+(form.lunar?' on':'')} onClick={()=>setForm({...form,lunar:!form.lunar})}><span className="knob"></span></button>
          <span style={{fontSize:14,fontWeight:500}}>음력 기준 입력{form.lunar?' (양력 자동 변환)':''}</span>
        </div>
        <div className="toggle-row">
          <button className={'toggle'+(form.timeUnknown?' on':'')} onClick={()=>setForm({...form,timeUnknown:!form.timeUnknown})}><span className="knob"></span></button>
          <span style={{fontSize:14,fontWeight:500}}>태어난 시간 모름</span>
        </div>
      </div>

      <button className="pill-filled" style={{marginTop:30}} onClick={onNext}>
        <i className="ph ph-sparkle"></i> AI 운세 결과 확인
      </button>
    </div>
  );
}

function ResultStep({loading, lang}){
  const cats=[
    {t:'총운', d:'오늘은 새로운 인연이 스며드는 날입니다. 오전보다 오후에 결정을 내리면 흐름이 유리하게 작용합니다.'},
    {t:'애정운', d:'가까운 사람과의 대화에서 뜻밖의 다정함을 느낄 수 있는 하루입니다.'},
    {t:'재물운', d:'작은 지출은 계획대로, 큰 지출은 다음 주로 미루는 편이 흐름에 맞습니다.'}
  ];
  return (
    <div className="fade-up" key="result-step">
      <h3 style={{fontSize:26,fontWeight:600,marginBottom:6}}>AI 운세 결과 확인</h3>
      <p style={{color:'#777b86',fontSize:15,marginBottom:22}}>입력하신 생년월일시를 기반으로 AI가 생성한 결과입니다. ({lang} 기준)</p>
      {loading ? (
        <div style={{display:'grid',gap:14}}>
          {[0,1,2].map(i=>(
            <div key={i} className="fortune-card">
              <div className="skeleton-line" style={{height:14,width:'30%',marginBottom:10}}></div>
              <div className="skeleton-line" style={{height:12,width:'92%',marginBottom:6}}></div>
              <div className="skeleton-line" style={{height:12,width:'70%'}}></div>
            </div>
          ))}
        </div>
      ) : (
        <div style={{display:'grid',gap:14}}>
          {cats.map(c=>(
            <div key={c.t} className="fortune-card" style={{animation:'fadeInUp .45s ease both'}}>
              <h4>{c.t}</h4>
              <p style={{fontSize:15,lineHeight:1.6,color:'#17191c'}}>{c.d}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LanguageStep({lang, setLang}){
  const current = LANGS.find(l=>l.code===lang);
  return (
    <div className="fade-up" key="lang-step">
      <h3 style={{fontSize:26,fontWeight:600,marginBottom:6}}>다국어 전환</h3>
      <p style={{color:'#777b86',fontSize:15,marginBottom:22}}>UI와 운세 결과 콘텐츠가 함께 전환됩니다.</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {LANGS.map(l=>(
          <button key={l.code} className={'lang-chip'+(lang===l.code?' active':'')} onClick={()=>setLang(l.code)}>
            <span className="code">{l.code}</span>
            <span className="name">{l.name}</span>
          </button>
        ))}
      </div>
      <div className="fortune-card" style={{marginTop:20}}>
        <h4>{current.total}</h4>
        <p style={{fontSize:15,lineHeight:1.6,color:'#17191c'}}>{current.body}</p>
      </div>
    </div>
  );
}

function SummarySide({form, lang}){
  return (
    <div className="summary-side">
      <h4 style={{fontSize:15,fontWeight:600,marginBottom:14,color:'#17191c'}}>입력 요약</h4>
      <div className="summary-row"><span className="k">생년월일</span><span className="v">{form.year}.{String(form.month).padStart(2,'0')}.{String(form.day).padStart(2,'0')}</span></div>
      <div className="summary-row"><span className="k">시간</span><span className="v">{form.timeUnknown?'모름':form.hour+'시'}</span></div>
      <div className="summary-row"><span className="k">달력 기준</span><span className="v">{form.lunar?'음력':'양력'}</span></div>
      <div className="summary-row"><span className="k">언어</span><span className="v">{lang}</span></div>
      <div className="peach-card" style={{marginTop:18, padding:20, borderRadius:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>도움말</div>
        <div style={{fontSize:13,lineHeight:1.6}}>NFC 미지원 환경에서도 URL 직접 접속으로 동일하게 이용할 수 있습니다.</div>
      </div>
    </div>
  );
}

function FeatureModal({feature, onClose}){
  if(!feature) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
          <h3 style={{fontSize:22,fontWeight:600}}>{feature.name}</h3>
          <button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        <p style={{fontSize:15,color:'#777b86',lineHeight:1.6,marginBottom:18}}>{feature.desc}</p>
        <div style={{fontSize:13,fontWeight:600,color:'#979799',marginBottom:8}}>구현 포인트</div>
        <ul style={{margin:0,paddingLeft:18,display:'grid',gap:8}}>
          {feature.bullets.map((b,i)=><li key={i} style={{fontSize:14,lineHeight:1.55,color:'#17191c'}}>{b}</li>)}
        </ul>
        <div className="fortune-card" style={{marginTop:18}}>
          <h4>핵심 구현</h4>
          <p style={{fontSize:14,lineHeight:1.6,color:'#17191c'}}>{feature.highlight}</p>
        </div>
      </div>
    </div>
  );
}

function FeatureShowcase({onOpen}){
  return (
    <section className="wizard-section" id="showcase">
      <h2 style={{fontSize:'clamp(30px,4vw,44px)',fontWeight:600,letterSpacing:'-0.01em'}}>구현 상세</h2>
      <p style={{color:'#777b86',fontSize:17,marginTop:10,maxWidth:560}}>각 기능의 기술적 구현 포인트를 확인할 수 있습니다.</p>
      <div className="showcase-grid">
        {FEATURES.map(f=>(
          <div key={f.key} className="neutral-card">
            <div style={{fontSize:13,color:'#979799',fontWeight:500,marginBottom:10}}>{f.key.toUpperCase()}</div>
            <h3 style={{fontSize:20,fontWeight:600,marginBottom:10}}>{f.name}</h3>
            <p style={{fontSize:15,color:'#17191c',lineHeight:1.55,marginBottom:16}}>{f.desc}</p>
            <button className="text-link" onClick={()=>onOpen(f)}>구현 포인트 보기 <i className="ph ph-arrow-right"></i></button>
          </div>
        ))}
      </div>

      <div className="peach-card" style={{marginTop:40}}>
        <div style={{fontSize:26,fontWeight:600,lineHeight:1.4,marginBottom:14}}>
          "태그 한 번으로 시작하는 개인화 경험을, 실제로 동작하는 화면으로 보여드립니다."
        </div>
        <div style={{fontSize:14,opacity:.85}}>맞춤 구현 데모 · 탭사주</div>
      </div>
    </section>
  );
}

function App(){
  const [step, setStep] = useState('main');
  const [form, setForm] = useState({year:1994, month:5, day:12, hour:'09', lunar:false, timeUnknown:false});
  const [lang, setLang] = useState('KO');
  const [loading, setLoading] = useState(false);
  const [modalFeature, setModalFeature] = useState(null);
  const [toast, setToast] = useState(null);
  const wizardRef = useRef(null);

  const goStep = (s) => {
    setStep(s);
    if(s==='result'){
      setLoading(true);
      setTimeout(()=>setLoading(false), 900);
    }
    if(s==='language'){
      setToast('언어를 선택하면 결과가 즉시 전환됩니다');
      setTimeout(()=>setToast(null), 2200);
    }
  };

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <TopNav onNavigate={scrollTo}/>
      <main style={{flex:1, width:'100%'}}>
        <Hero onStart={()=>scrollTo('wizard')}/>

        <section className="wizard-section" id="wizard" ref={wizardRef} style={{paddingTop:6}}>
          <h2 style={{fontSize:20,fontWeight:600,letterSpacing:'-0.01em',color:'#777b86'}}>서비스 흐름 체험 — 단계를 눌러 보세요</h2>

          <StepTabs step={step} setStep={goStep}/>

          <div className="wizard-grid">
            <div className="step-body">
              {step==='main' && <MainStep onNext={()=>goStep('input')}/>}
              {step==='input' && <InputStep form={form} setForm={setForm} onNext={()=>goStep('result')}/>}
              {step==='result' && <ResultStep loading={loading} lang={lang}/>}
              {step==='language' && <LanguageStep lang={lang} setLang={setLang}/>}
            </div>
            <SummarySide form={form} lang={lang}/>
          </div>
        </section>

        <HeroArtifacts/>

        <FeatureShowcase onOpen={setModalFeature}/>
      </main>

      <footer className="footer">
        <div>© 2026 탭사주 — 자체 개발 프로젝트</div>
        <div style={{display:'flex',gap:16}}>
          <i className="ph ph-envelope-simple"></i>
          <i className="ph ph-globe"></i>
        </div>
      </footer>

      <FeatureModal feature={modalFeature} onClose={()=>setModalFeature(null)}/>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
