<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탭사주 브랜드 운영 콘솔 — 구현 데모</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --void:#000000;
    --panel:#0c0c0e;
    --panel-2:#131316;
    --border:rgba(255,255,255,0.10);
    --border-soft:rgba(255,255,255,0.06);
    --haze:#f5f5f5;
    --ink:#1b1b1b;
    --white:#ffffff;
    --muted:#9aa3ad;
    --signal:#2b7fff;
    --twilight:#7d97b8;
    --accent:#f75745;
    --good:#4fd18b;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;
    background:var(--void); color:var(--white); -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  h1,h2,h3,h4,p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--signal);color:#fff;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes shimmerDark{ 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
  @keyframes pulseLive{
    0%{box-shadow:0 0 0 0 rgba(79,209,139,0.5);}
    70%{box-shadow:0 0 0 8px rgba(79,209,139,0);}
    100%{box-shadow:0 0 0 0 rgba(79,209,139,0);}
  }
  @keyframes glowPulse{
    0%,100%{opacity:1;} 50%{opacity:.45;}
  }
  @keyframes barGrow{
    from{transform:scaleY(0);} to{transform:scaleY(1);}
  }

  .fade-up{animation:fadeInUp .38s cubic-bezier(.2,.7,.3,1) both;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulseLive 2.1s infinite;}
  .new-badge{animation:glowPulse 1.8s ease-in-out infinite;}
  .skeleton{
    background:linear-gradient(90deg, #141416 25%, #1d1d20 37%, #141416 63%);
    background-size:400px 100%; animation:shimmerDark 1.3s ease-in-out infinite; border-radius:8px;
  }

  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:236px; background:var(--panel);
    border-right:1px solid var(--border-soft); padding:22px 16px; display:flex; flex-direction:column;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px; border-bottom:1px solid var(--border-soft); margin-bottom:18px;}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--white);color:#000;display:flex;align-items:center;justify-content:center;}
  .brand-title{font-size:15px;font-weight:700;}
  .brand-sub{font-size:11px;color:var(--muted);}

  .nav-item{
    width:100%; background:transparent; border:none; border-radius:8px; padding:11px 12px; display:flex; align-items:center; gap:11px;
    color:var(--muted); font-size:14px; font-weight:500; text-align:left; margin-bottom:3px; transition:all .15s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .nav-item.active{background:var(--haze); color:var(--ink);}
  .nav-item .badge-dot{margin-left:auto; width:7px;height:7px;border-radius:50%;background:var(--accent);}

  .main-wrap{
    margin-left:236px; flex:1; min-width:0; width:calc(100% - 236px); min-height:100vh; display:flex; flex-direction:column;
  }
  .topbar{
    height:64px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; position:sticky; top:0; background:rgba(0,0,0,0.86); backdrop-filter:blur(8px); z-index:20;
  }
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; width:280px; color:var(--muted); font-size:13px;
  }
  .ghost-btn{
    background:transparent; border:1px solid var(--white); color:var(--white); border-radius:8px; padding:9px 16px;
    font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:7px; transition:all .15s ease;
  }
  .ghost-btn:hover{background:rgba(255,255,255,0.08);}
  .ghost-btn.danger{border-color:var(--accent); color:var(--accent);}
  .ghost-btn.danger:hover{background:rgba(247,87,69,0.1);}
  .haze-btn{
    background:var(--haze); border:1px solid var(--haze); color:var(--ink); border-radius:8px; padding:9px 16px;
    font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:opacity .15s ease;
  }
  .haze-btn:hover{opacity:.85;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--twilight);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}

  .page{padding:26px 30px 60px; flex:1;}

  .glass-hero{
    position:relative; overflow:hidden; border-radius:12px; border:1px solid var(--border);
    padding:30px 32px; margin-bottom:24px;
    background:
      radial-gradient(60% 140% at 82% -10%, rgba(43,127,255,0.34) 0%, rgba(43,127,255,0) 60%),
      radial-gradient(50% 120% at 8% 120%, rgba(247,87,69,0.16) 0%, rgba(247,87,69,0) 55%),
      linear-gradient(180deg, #0a0d14 0%, #000000 100%);
  }
  .glass-blob{
    position:absolute; border-radius:50%; filter:blur(38px); opacity:.55; pointer-events:none;
    background:linear-gradient(135deg, rgba(43,127,255,.55), rgba(125,151,184,.15));
    animation:floatBlob 7s ease-in-out infinite;
  }
  @keyframes floatBlob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  .glass-hero .eyebrow{font-size:12px; letter-spacing:.06em; color:var(--twilight); font-weight:600; text-transform:uppercase;}
  .glass-hero h3{font-size:26px; font-weight:700; margin-top:8px; max-width:560px; line-height:1.35; position:relative;}
  .glass-hero .sub{font-size:13.5px; color:var(--muted); margin-top:8px; max-width:520px; position:relative;}
  .glass-stat-row{display:flex; gap:28px; margin-top:20px; position:relative; flex-wrap:wrap;}
  .glass-stat{}
  .glass-stat .n{font-size:32px; font-weight:800; letter-spacing:-0.01em;}
  .glass-stat .l{font-size:12px; color:var(--muted); margin-top:2px;}

  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;}
  .page-title{font-size:26px; font-weight:700; letter-spacing:-0.01em;}
  .page-sub{font-size:14px; color:var(--muted); margin-top:6px;}

  .master-detail{display:grid; grid-template-columns:340px 1fr; gap:20px;}
  @media (max-width:960px){ .master-detail{grid-template-columns:1fr;} }

  .list-rail{background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:16px; height:fit-content;}
  .filter-chip{
    background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:9999px; padding:6px 12px;
    font-size:12px; font-weight:500; margin-right:6px; margin-bottom:10px;
  }
  .filter-chip.active{background:var(--haze); color:var(--ink); border-color:var(--haze);}
  .chip-row{
    width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:8px; padding:12px;
    display:flex; flex-direction:column; gap:5px; margin-bottom:6px; transition:all .15s ease;
  }
  .chip-row:hover{background:var(--panel-2);}
  .chip-row.selected{background:var(--panel-2); border-color:var(--border);}
  .chip-row .row-top{display:flex; justify-content:space-between; align-items:center;}
  .chip-row .uid{font-size:13.5px; font-weight:600;}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:9999px; letter-spacing:.02em;}
  .status-pill.active{background:rgba(79,209,139,0.14); color:var(--good);}
  .status-pill.inactive{background:rgba(154,163,173,0.14); color:var(--muted);}
  .status-pill.draft{background:rgba(247,87,69,0.14); color:var(--accent);}
  .status-pill.review{background:rgba(43,127,255,0.16); color:var(--signal);}
  .row-meta{font-size:12px; color:var(--muted);}

  .detail-panel{background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:26px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;}
  .field-block{background:var(--panel-2); border:1px solid var(--border-soft); border-radius:8px; padding:14px;}
  .field-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .field-value{font-size:15px; font-weight:600;}

  .toggle{width:40px;height:23px;border-radius:9999px;background:#2a2a2e;position:relative;border:1px solid var(--border);transition:background .2s ease;}
  .toggle.on{background:var(--good);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s ease;}
  .toggle.on .knob{transform:translateX(17px);}

  .kpi-hero{display:flex; align-items:baseline; gap:14px; margin-bottom:22px;}
  .kpi-num{font-size:56px; font-weight:800; letter-spacing:-0.02em; line-height:1;}
  .kpi-label{font-size:13px; color:var(--muted);}

  .textarea-box{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:4px; color:#fff;
    padding:12px; font-size:14px; line-height:1.6; resize:vertical; font-family:inherit;
  }

  .cal-strip{display:flex; gap:8px; margin-top:14px;}
  .cal-day{
    flex:1; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:8px; padding:12px 8px; text-align:center;
  }
  .cal-day.active{border-color:var(--good); background:rgba(79,209,139,0.08);}
  .cal-day .d{font-size:11px; color:var(--muted); margin-bottom:6px;}
  .cal-day .n{font-size:15px; font-weight:700;}

  .chart-box{background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:22px; margin-bottom:20px;}
  .rank-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .rank-table th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border-soft);}
  .rank-table td{font-size:13.5px; padding:11px 10px; border-bottom:1px solid var(--border-soft);}
  .bar-track{width:100%; height:6px; background:var(--panel-2); border-radius:9999px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--signal); border-radius:9999px; transform-origin:left; animation:barGrow .6s ease both;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.66); z-index:100; display:flex; align-items:center; justify-content:center;
    padding:20px; animation:fadeInUp .2s ease both;
  }
  .modal-card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; max-width:520px; width:100%; padding:28px;
    max-height:82vh; overflow-y:auto;
  }
  .modal-close{background:var(--panel-2); border:1px solid var(--border-soft); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .dropzone{
    border:1px dashed var(--border); border-radius:8px; padding:32px; text-align:center; color:var(--muted); font-size:13px;
  }
  .progress-track{width:100%; height:6px; background:var(--panel-2); border-radius:9999px; overflow:hidden; margin-top:14px;}
  .progress-fill{height:100%; background:var(--good); border-radius:9999px; transition:width .3s ease;}

  .toast{
    position:fixed; bottom:24px; right:26px; background:var(--panel); border:1px solid var(--border); color:#fff;
    padding:13px 20px; border-radius:8px; font-size:13.5px; font-weight:500; z-index:200; display:flex; align-items:center; gap:9px;
    animation:fadeInUp .25s ease both;
  }
  .toast.danger{border-color:var(--accent); color:var(--accent);}

  .lucide-icon{width:17px;height:17px;}
  section{width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const {LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

const NAV = [
  {key:'main', name:'NFC 칩 다중 등록 관리', icon:'radio'},
  {key:'content', name:'다국어 콘텐츠 관리', icon:'languages'},
  {key:'schedule', name:'운세 콘텐츠 스케줄 관리', icon:'calendar-clock'},
  {key:'history', name:'운세 히스토리 분석', icon:'bar-chart-3'}
];

const CHIPS = [
  {uid:'A-1042', store:'강남 플래그십', line:'클래식 참', status:'active', last:'12분 전'},
  {uid:'A-1043', store:'강남 플래그십', line:'클래식 참', status:'active', last:'41분 전'},
  {uid:'B-2091', store:'성수 팝업', line:'리미티드 참', status:'active', last:'2시간 전'},
  {uid:'B-2092', store:'성수 팝업', line:'리미티드 참', status:'inactive', last:'3일 전'},
  {uid:'C-3310', store:'온라인 스토어', line:'클래식 참', status:'active', last:'8분 전'},
];

const LANG_ROWS = [
  {code:'한국어', status:'active', label:'승인 완료', ver:'v3'},
  {code:'English', status:'review', label:'검수중', ver:'v2'},
  {code:'中文', status:'draft', label:'초안', ver:'v1'},
  {code:'日本語', status:'draft', label:'초안', ver:'v1'},
];

const HISTORY_DATA = [
  {d:'8/22', tags:210},{d:'8/23', tags:248},{d:'8/24', tags:190},{d:'8/25', tags:301},
  {d:'8/26', tags:275},{d:'8/27', tags:333},{d:'8/28', tags:298},
];

const RANK_DATA = [
  {cat:'총운', pct:38}, {cat:'애정운', pct:29}, {cat:'재물운', pct:21}, {cat:'행운의 컬러', pct:12}
];

function useIcons(deps){
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
}

function Sidebar({screen, setScreen}){
  useIcons();
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="mark"><i data-lucide="moon-star" className="lucide-icon"></i></div>
        <div>
          <div className="brand-title">탭사주 콘솔</div>
          <div className="brand-sub">브랜드 운영</div>
        </div>
      </div>
      <nav>
        {NAV.map(n=>(
          <button key={n.key} className={'nav-item'+(screen===n.key?' active':'')} onClick={()=>setScreen(n.key)}>
            <i data-lucide={n.icon} className="lucide-icon"></i>
            {n.name}
            {n.key==='content' && <span className="badge-dot"></span>}
          </button>
        ))}
      </nav>
      <div style={{marginTop:'auto', paddingTop:16, borderTop:'1px solid var(--border-soft)'}}>
        <button className="nav-item" onClick={()=>setScreen('main')}>
          <i data-lucide="settings" className="lucide-icon"></i> 설정
        </button>
      </div>
    </aside>
  );
}

function Topbar({onCsv, onExport}){
  useIcons();
  return (
    <div className="topbar">
      <div className="search-box">
        <i data-lucide="search" className="lucide-icon"></i>
        <span>칩 UID, 매장명 검색…</span>
      </div>
      <div style={{display:'flex', gap:10, alignItems:'center'}}>
        <button className="ghost-btn" onClick={onCsv}><i data-lucide="upload" className="lucide-icon"></i> CSV 일괄 등록</button>
        <button className="haze-btn" onClick={onExport}><i data-lucide="download" className="lucide-icon"></i> 내보내기</button>
        <div className="avatar">운영</div>
      </div>
    </div>
  );
}

function GlassHero(){
  return (
    <div className="glass-hero">
      <div className="glass-blob" style={{width:180,height:180,right:-30,top:-50}}></div>
      <div className="glass-blob" style={{width:120,height:120,left:'22%',bottom:-60,animationDelay:'1.4s',background:'linear-gradient(135deg, rgba(247,87,69,.35), rgba(247,87,69,0))'}}></div>
      <div className="eyebrow">브랜드 운영 · 사주 · 타로 · 오늘의 운세</div>
      <h3>가방 키링에 담긴 운세·사주 콘텐츠를 매장 전역에 실시간으로 배포합니다</h3>
      <p className="sub">NFC 칩 태그부터 다국어 운세 번역 검수, 신년운세 노출 스케줄까지 하나의 콘솔에서 관제합니다.</p>
      <div className="glass-stat-row">
        <div className="glass-stat"><div className="n">1,284</div><div className="l">오늘 운세 태그 조회수</div></div>
        <div className="glass-stat"><div className="n">4</div><div className="l">서비스 중인 언어 (한/영/中/日)</div></div>
        <div className="glass-stat"><div className="n">3</div><div className="l">매장·팝업 라인 연동</div></div>
      </div>
    </div>
  );
}

function MainScreen({selected, setSelected, filter, setFilter, onDeactivate, onCsv}){
  useIcons();
  const filtered = CHIPS.filter(c=> filter==='전체' || c.store===filter);
  const chip = CHIPS.find(c=>c.uid===selected) || CHIPS[0];
  const activeCount = CHIPS.filter(c=>c.status==='active').length;

  return (
    <div className="fade-up" key="main-screen">
      <div className="kpi-hero">
        <div className="kpi-num">{activeCount}</div>
        <div className="kpi-label">활성 NFC 칩 · 전체 {CHIPS.length}개 매장/제품 라인 매핑</div>
      </div>

      <div className="master-detail">
        <div className="list-rail">
          <div style={{marginBottom:12}}>
            {['전체','강남 플래그십','성수 팝업','온라인 스토어'].map(f=>(
              <button key={f} className={'filter-chip'+(filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>
            ))}
          </div>
          {filtered.map(c=>(
            <button key={c.uid} className={'chip-row'+(selected===c.uid?' selected':'')} onClick={()=>setSelected(c.uid)}>
              <div className="row-top">
                <span className="uid">{c.uid}</span>
                <span className={'status-pill '+c.status}>{c.status==='active'?'ON':'OFF'}</span>
              </div>
              <div className="row-meta">{c.store} · {c.line}</div>
              <div className="row-meta"><span className="live-dot" style={{display:'inline-block',marginRight:6}}></span>{c.last} 태그</div>
            </button>
          ))}
        </div>

        <div className="detail-panel">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <h3 style={{fontSize:20,fontWeight:700}}>{chip.uid}</h3>
            <span className={'status-pill '+chip.status}>{chip.status==='active'?'서비스 중':'비활성화'}</span>
          </div>
          <div className="detail-grid">
            <div className="field-block"><div className="field-label">매장</div><div className="field-value">{chip.store}</div></div>
            <div className="field-block"><div className="field-label">제품 라인</div><div className="field-value">{chip.line}</div></div>
            <div className="field-block"><div className="field-label">랜딩 URL</div><div className="field-value" style={{fontSize:13,color:'var(--signal)'}}>tapsaju.app/t/{chip.uid.toLowerCase()}</div></div>
            <div className="field-block"><div className="field-label">최근 태그</div><div className="field-value">{chip.last}</div></div>
          </div>
          <div style={{display:'flex', gap:10, marginTop:8}}>
            <button className="ghost-btn" onClick={onCsv}><i data-lucide="upload" className="lucide-icon"></i> CSV 일괄 등록</button>
            <button className="ghost-btn danger" onClick={()=>onDeactivate(chip.uid)}>
              <i data-lucide="power" className="lucide-icon"></i> {chip.status==='active'?'비활성화':'다시 활성화'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ContentScreen({selectedLang, setSelectedLang, draft, setDraft, onApprove, onRevert}){
  useIcons();
  const row = LANG_ROWS.find(l=>l.code===selectedLang) || LANG_ROWS[0];
  return (
    <div className="fade-up" key="content-screen">
      <div className="master-detail">
        <div className="list-rail">
          {LANG_ROWS.map(l=>(
            <button key={l.code} className={'chip-row'+(selectedLang===l.code?' selected':'')} onClick={()=>setSelectedLang(l.code)}>
              <div className="row-top">
                <span className="uid">{l.code}</span>
                <span className={'status-pill '+l.status}>{l.label}</span>
              </div>
              <div className="row-meta">번역 버전 {l.ver}</div>
            </button>
          ))}
        </div>
        <div className="detail-panel">
          <h3 style={{fontSize:20,fontWeight:700,marginBottom:14}}>{row.code} 번역 검수</h3>
          <div className="field-label" style={{marginBottom:8}}>AI 번역 초안 (수정 가능)</div>
          <textarea className="textarea-box" rows={5} value={draft} onChange={e=>setDraft(e.target.value)}/>
          <div className="field-label" style={{margin:'18px 0 8px'}}>미리보기</div>
          <div className="field-block">
            <div className="field-value" style={{fontWeight:500, fontSize:14, lineHeight:1.6}}>{draft}</div>
          </div>
          <div style={{display:'flex', gap:10, marginTop:18}}>
            <button className="haze-btn" onClick={()=>onApprove(row.code)}><i data-lucide="check" className="lucide-icon"></i> 승인 처리</button>
            <button className="ghost-btn" onClick={onRevert}><i data-lucide="rotate-ccw" className="lucide-icon"></i> 초안으로 되돌리기</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ScheduleScreen({toggles, setToggles, countdown, onRefresh}){
  useIcons();
  const days=['월','화','수','목','금','토','일'];
  return (
    <div className="fade-up" key="schedule-screen">
      <div className="detail-panel" style={{marginBottom:20}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <div className="field-label">오늘의 운세 자동 갱신</div>
            <div style={{fontSize:15,fontWeight:600, marginTop:4}}>다음 갱신까지 {countdown}</div>
          </div>
          <button className="haze-btn" onClick={onRefresh}><i data-lucide="refresh-cw" className="lucide-icon"></i> 지금 갱신</button>
        </div>
        <div className="cal-strip">
          {days.map((d,i)=>(
            <div key={d} className={'cal-day'+(i<5?' active':'')}>
              <div className="d">{d}</div>
              <div className="n">{i<5?'ON':'—'}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="detail-panel" style={{marginBottom:20}}>
        <div className="field-label" style={{marginBottom:12}}>신년운세 노출 기간</div>
        <div style={{display:'flex', gap:12, alignItems:'center', flexWrap:'wrap'}}>
          <input type="date" defaultValue="2026-12-20" className="textarea-box" style={{width:170, padding:'9px 10px'}}/>
          <span style={{color:'var(--muted)'}}>~</span>
          <input type="date" defaultValue="2027-01-15" className="textarea-box" style={{width:170, padding:'9px 10px'}}/>
          <div style={{display:'flex', alignItems:'center', gap:8, marginLeft:'auto'}}>
            <span style={{fontSize:13,color:'var(--muted)'}}>노출 활성화</span>
            <button className={'toggle'+(toggles.newYear?' on':'')} onClick={()=>setToggles({...toggles,newYear:!toggles.newYear})}><span className="knob"></span></button>
          </div>
        </div>
      </div>

      <div className="detail-panel">
        <div className="field-label" style={{marginBottom:12}}>선택 콘텐츠 블록</div>
        {[{k:'luckyColor',n:'행운의 컬러'},{k:'quote',n:'철학 한마디'}].map(b=>(
          <div key={b.k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid var(--border-soft)'}}>
            <span style={{fontSize:14,fontWeight:500}}>{b.n}</span>
            <button className={'toggle'+(toggles[b.k]?' on':'')} onClick={()=>setToggles({...toggles,[b.k]:!toggles[b.k]})}><span className="knob"></span></button>
          </div>
        ))}
      </div>
    </div>
  );
}

function HistoryScreen({loading, onExport}){
  useIcons();
  return (
    <div className="fade-up" key="history-screen">
      <div style={{display:'flex', gap:10, marginBottom:18}}>
        <select className="textarea-box" style={{width:160, padding:'9px 10px'}} defaultValue="7d">
          <option value="7d">최근 7일</option>
          <option value="30d">최근 30일</option>
        </select>
        <select className="textarea-box" style={{width:180, padding:'9px 10px'}} defaultValue="전체">
          <option>전체 매장</option>
          <option>강남 플래그십</option>
          <option>성수 팝업</option>
        </select>
        <button className="ghost-btn" style={{marginLeft:'auto'}} onClick={onExport}><i data-lucide="file-down" className="lucide-icon"></i> CSV 내보내기</button>
      </div>

      <div className="chart-box">
        <div className="field-label" style={{marginBottom:14}}>일별 태그 횟수 추이</div>
        {loading ? (
          <div className="skeleton" style={{height:220}}></div>
        ) : (
          <div style={{width:'100%', height:220}}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={HISTORY_DATA}>
                <CartesianGrid stroke="rgba(255,255,255,0.06)" vertical={false}/>
                <XAxis dataKey="d" stroke="#9aa3ad" fontSize={12} tickLine={false} axisLine={false}/>
                <YAxis stroke="#9aa3ad" fontSize={12} tickLine={false} axisLine={false}/>
                <Tooltip contentStyle={{background:'#131316', border:'1px solid rgba(255,255,255,0.1)', borderRadius:8, color:'#fff'}}/>
                <Line type="monotone" dataKey="tags" stroke="#2b7fff" strokeWidth={2.5} dot={{r:3, fill:'#2b7fff'}}/>
              </LineChart>
            </ResponsiveContainer>
          </div>
        )}
      </div>

      <div className="chart-box">
        <div className="field-label" style={{marginBottom:6}}>인기 운세 카테고리</div>
        <table className="rank-table">
          <thead><tr><th>카테고리</th><th>조회 비중</th><th></th></tr></thead>
          <tbody>
            {RANK_DATA.map(r=>(
              <tr key={r.cat}>
                <td>{r.cat}</td>
                <td style={{width:220}}><div className="bar-track"><div className="bar-fill" style={{width:r.pct*2+'%'}}></div></div></td>
                <td style={{textAlign:'right', color:'var(--muted)'}}>{r.pct}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Modal({title, children, onClose}){
  useIcons();
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={{fontSize:18,fontWeight:700}}>{title}</h3>
          <button className="modal-close" onClick={onClose}><i data-lucide="x" className="lucide-icon"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [selected, setSelected] = useState('A-1042');
  const [filter, setFilter] = useState('전체');
  const [chips, setChips] = useState(CHIPS);
  const [selectedLang, setSelectedLang] = useState('English');
  const [draft, setDraft] = useState('Today favors new connections. Decisions made in the afternoon carry a more favorable flow than the morning.');
  const [toggles, setToggles] = useState({newYear:true, luckyColor:true, quote:false});
  const [countdown, setCountdown] = useState('03:12:44');
  const [historyLoading, setHistoryLoading] = useState(false);
  const [csvModal, setCsvModal] = useState(false);
  const [csvProgress, setCsvProgress] = useState(0);
  const [confirmDeactivate, setConfirmDeactivate] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg, danger) => { setToast({msg, danger}); setTimeout(()=>setToast(null), 2400); };

  const goScreen = (s) => {
    setScreen(s);
    if(s==='content'){
      const row = LANG_ROWS.find(l=>l.code===selectedLang);
      setDraft(row.code==='English'
        ? 'Today favors new connections. Decisions made in the afternoon carry a more favorable flow than the morning.'
        : '오늘은 새로운 인연이 스며드는 날입니다.');
    }
    if(s==='history'){
      setHistoryLoading(true);
      setTimeout(()=>setHistoryLoading(false), 850);
    }
  };

  const openCsv = () => { setCsvModal(true); setCsvProgress(0); };
  const runCsv = () => {
    setCsvProgress(10);
    let p=10;
    const iv = setInterval(()=>{
      p+=22;
      setCsvProgress(Math.min(p,100));
      if(p>=100){ clearInterval(iv); setTimeout(()=>{ setCsvModal(false); showToast('42건의 NFC 칩이 일괄 등록되었습니다'); },400); }
    }, 260);
  };

  const doDeactivate = () => {
    setChips(prev=>prev.map(c=>c.uid===confirmDeactivate ? {...c, status: c.status==='active'?'inactive':'active'} : c));
    showToast(`${confirmDeactivate} 상태가 변경되었습니다`);
    setConfirmDeactivate(null);
  };

  const doApprove = (code) => showToast(`${code} 번역이 승인 처리되었습니다`);
  const doRevert = () => {
    const row = LANG_ROWS.find(l=>l.code===selectedLang);
    setDraft(row.code==='English'
      ? 'Today favors new connections. Decisions made in the afternoon carry a more favorable flow than the morning.'
      : '오늘은 새로운 인연이 스며드는 날입니다. 오전보다 오후에 결정을 내리면 흐름이 유리하게 작용합니다.');
    showToast('AI 초안으로 되돌렸습니다');
  };
  const doExport = () => showToast('CSV 파일 생성이 완료되었습니다');
  const doRefreshCountdown = () => { setCountdown('00:00:05'); showToast('오늘의 운세 콘텐츠를 갱신합니다'); };

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <Sidebar screen={screen} setScreen={goScreen}/>
      <div className="main-wrap">
        <Topbar onCsv={openCsv} onExport={doExport}/>
        <div className="page">
          {screen==='main' && <GlassHero/>}
          <div className="page-head">
            <div>
              <h2 className="page-title">{NAV.find(n=>n.key===screen).name}</h2>
              <p className="page-sub">여러 매장·제품 라인의 NFC 칩과 다국어 운세 콘텐츠를 한 콘솔에서 관리합니다.</p>
            </div>
          </div>

          {screen==='main' && (
            <MainScreen
              selected={selected} setSelected={setSelected}
              filter={filter} setFilter={setFilter}
              onDeactivate={(uid)=>setConfirmDeactivate(uid)}
              onCsv={openCsv}
            />
          )}
          {screen==='content' && (
            <ContentScreen
              selectedLang={selectedLang} setSelectedLang={(c)=>{setSelectedLang(c); setDraft(c==='English'?'Today favors new connections.':'번역 초안 텍스트');}}
              draft={draft} setDraft={setDraft} onApprove={doApprove} onRevert={doRevert}
            />
          )}
          {screen==='schedule' && (
            <ScheduleScreen toggles={toggles} setToggles={setToggles} countdown={countdown} onRefresh={doRefreshCountdown}/>
          )}
          {screen==='history' && (
            <HistoryScreen loading={historyLoading} onExport={doExport}/>
          )}
        </div>
      </div>

      {csvModal && (
        <Modal title="CSV 일괄 등록" onClose={()=>setCsvModal(false)}>
          <div className="dropzone">
            <i data-lucide="file-spreadsheet" style={{width:26,height:26,marginBottom:8}}></i>
            <div>chip_batch_0828.csv</div>
            <div style={{marginTop:4, fontSize:12}}>42건의 NFC 칩 UID · 매장 · 제품 라인 매핑</div>
          </div>
          {csvProgress>0 && (
            <div className="progress-track"><div className="progress-fill" style={{width:csvProgress+'%'}}></div></div>
          )}
          <div style={{display:'flex', gap:10, marginTop:18}}>
            <button className="haze-btn" onClick={runCsv}><i data-lucide="upload" className="lucide-icon"></i> 업로드 시작</button>
            <button className="ghost-btn" onClick={()=>setCsvModal(false)}>취소</button>
          </div>
        </Modal>
      )}

      {confirmDeactivate && (
        <Modal title="상태 변경 확인" onClose={()=>setConfirmDeactivate(null)}>
          <p style={{fontSize:14, color:'var(--muted)', lineHeight:1.6}}>
            {confirmDeactivate} 칩의 상태를 변경하면 해당 칩 태그 시 안내 화면으로 즉시 전환됩니다. 계속하시겠습니까?
          </p>
          <div style={{display:'flex', gap:10, marginTop:20}}>
            <button className="ghost-btn danger" onClick={doDeactivate}><i data-lucide="power" className="lucide-icon"></i> 변경 확정</button>
            <button className="ghost-btn" onClick={()=>setConfirmDeactivate(null)}>취소</button>
          </div>
        </Modal>
      )}

      {toast && <div className={'toast'+(toast.danger?' danger':'')}><i data-lucide="check-circle" className="lucide-icon"></i>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
