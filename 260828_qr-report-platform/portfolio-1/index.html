<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임상시험 보고서 QR 연동 관리 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --ink:#101010; --graphite:#242424; --slate:#6b7280; --stone:#898989;
  --silver:#e5e7eb; --paper:#FAFAFA; --surface:#ffffff;
  --action-blue:#0099ff; --accent:#3ad98a; --accent-dim:#e4faf0;
  --danger:#e0433f; --warn:#c9820a; --warn-bg:#fdf3e2; --danger-bg:#fdeceb;
  --radius:4px; --radius-sm:3px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(58,217,138,.5);}70%{box-shadow:0 0 0 10px rgba(58,217,138,0);}100%{box-shadow:0 0 0 0 rgba(58,217,138,0);}}
@keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}

.tree-item{transition:background .12s ease;}
.tree-item:hover{background:var(--silver);}
.list-card{transition:border-color .12s ease,transform .12s ease;}
.list-card:hover{border-color:var(--ink);transform:translateY(-1px);}
.btn-primary{background:var(--ink);color:#fff;border:none;border-radius:var(--radius);font-weight:600;font-size:14px;padding:10px 18px;transition:opacity .12s ease;}
.btn-primary:hover{opacity:.85;}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:transparent;color:var(--graphite);border:1px solid var(--silver);border-radius:var(--radius);font-weight:600;font-size:13px;padding:8px 14px;transition:background .12s ease;}
.btn-ghost:hover{background:var(--paper);}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:2px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:ping 1.8s infinite;}
.skeleton{background:linear-gradient(90deg,var(--silver) 25%,#f3f4f6 37%,var(--silver) 63%);background-size:400px 100%;animation:shimmer 1.4s infinite linear;}
</style>
</head>
<body data-archetype="notion-blocks-tree">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;

/* ---------- mock data ---------- */
const CUSTOMERS = [
  {id:'c1', name:'뷰티코스메틱', contact:'정수아 대리', email:'js.jung@beautycos-demo.kr', lastLogin:'2024.11.10 09:24'},
  {id:'c2', name:'글로우랩', contact:'한도윤 팀장', email:'dy.han@glowlab-demo.kr', lastLogin:'2024.11.09 16:02'},
  {id:'c3', name:'더마빌', contact:'오세훈 매니저', email:'sh.oh@dermavill-demo.kr', lastLogin:'2024.11.07 11:40'},
  {id:'c4', name:'퓨어스킨', contact:'최유진 대리', email:'yj.choi@pureskin-demo.kr', lastLogin:'2024.11.08 14:15'},
];

const seedReports = [
  {id:'RPT-2024-0142', customerId:'c1', item:'피부자극시험 (인체적용시험)', registeredAt:'2024.11.02', registeredBy:'김민수', status:'issued', qrAt:'2024.11.03', qrBy:'김민수', downloads:3},
  {id:'RPT-2024-0143', customerId:'c2', item:'항염 효능평가', registeredAt:'2024.11.05', registeredBy:'이지은', status:'pending', qrAt:null, qrBy:null, downloads:0},
  {id:'RPT-2024-0138', customerId:'c3', item:'자외선차단지수(SPF) 측정', registeredAt:'2024.10.28', registeredBy:'박서준', status:'issued', qrAt:'2024.10.29', qrBy:'박서준', downloads:5},
  {id:'RPT-2024-0140', customerId:'c1', item:'첩포시험(첩布) 안전성 평가', registeredAt:'2024.10.30', registeredBy:'김민수', status:'expired', qrAt:'2024.10.31', qrBy:'김민수', downloads:1},
  {id:'RPT-2024-0145', customerId:'c4', item:'보습 효능평가', registeredAt:'2024.11.08', registeredBy:'이지은', status:'issued', qrAt:'2024.11.09', qrBy:'이지은', downloads:2},
  {id:'RPT-2024-0146', customerId:'c2', item:'저자극성 평가', registeredAt:'2024.11.09', registeredBy:'박서준', status:'pending', qrAt:null, qrBy:null, downloads:0},
  {id:'RPT-2024-0130', customerId:'c3', item:'주름개선 효능평가', registeredAt:'2024.10.15', registeredBy:'김민수', status:'issued', qrAt:'2024.10.16', qrBy:'김민수', downloads:7},
];

const STATUS_LABEL = {issued:'발급완료', pending:'QR 대기', expired:'만료'};
const STATUS_COLOR = {
  issued:{bg:'var(--accent-dim)', fg:'#0b7a4c'},
  pending:{bg:'var(--warn-bg)', fg:'var(--warn)'},
  expired:{bg:'var(--danger-bg)', fg:'var(--danger)'},
};

function Icon({name, size=17, style, className=''}) {
  return <i className={`ti ti-${name} ${className}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Badge({status}) {
  const c = STATUS_COLOR[status];
  return <span className="badge" style={{background:c.bg, color:c.fg}}>{STATUS_LABEL[status]}</span>;
}

function Toast({message, onDone}) {
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return (
    <div style={{position:'fixed', left:'50%', bottom:28, transform:'translateX(-50%)', background:'var(--ink)', color:'#fff', padding:'12px 20px', borderRadius:'6px', fontSize:14, fontWeight:600, zIndex:900, animation:'toastIn .25s ease', display:'flex', alignItems:'center', gap:8}}>
      <Icon name="circle-check" size={16} style={{color:'var(--accent)'}} />{message}
    </div>
  );
}

function Modal({onClose, width=520, children}) {
  return (
    <div onClick={onClose} style={{position:'fixed', inset:0, background:'rgba(16,16,16,.45)', zIndex:800, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#fff', borderRadius:8, width:'100%', maxWidth:width, maxHeight:'86vh', overflowY:'auto', animation:'fadeInScale .18s ease', border:'1px solid var(--silver)'}}>
        {children}
      </div>
    </div>
  );
}

function QRCanvas({value, size=176}) {
  const ref = useRef(null);
  useEffect(()=>{
    if (ref.current && window.QRCode) {
      QRCode.toCanvas(ref.current, value, {width:size, margin:1, color:{dark:'#101010', light:'#ffffff'}}, ()=>{});
    }
  },[value]);
  return <canvas ref={ref} style={{width:size, height:size, border:'1px solid var(--silver)', borderRadius:4}} />;
}

/* ---------- Slide-over: 보고서 등록/수정 ---------- */
function ReportForm({report, onClose, onSave}) {
  const isEdit = !!report;
  const [form, setForm] = useState(report ? {...report} : {customerId:'c1', item:'', registeredBy:'김민수'});
  const [file, setFile] = useState(null);
  const [drag, setDrag] = useState(false);

  return (
    <div style={{position:'fixed', inset:0, zIndex:850, display:'flex', justifyContent:'flex-end'}}>
      <div onClick={onClose} style={{position:'absolute', inset:0, background:'rgba(16,16,16,.4)'}}></div>
      <div style={{position:'relative', width:420, maxWidth:'92vw', height:'100%', background:'#fff', borderLeft:'1px solid var(--silver)', animation:'slideInRight .22s ease', padding:28, overflowY:'auto'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
          <h3 style={{fontSize:19, fontWeight:700, margin:0, letterSpacing:'-0.01em'}}>{isEdit ? '보고서 수정' : '보고서 등록'}</h3>
          <button onClick={onClose} style={{background:'none', border:'none', color:'var(--slate)'}}><Icon name="x" size={20} /></button>
        </div>

        <label style={{fontSize:12, fontWeight:700, color:'var(--slate)', display:'block', marginBottom:6}}>고객사</label>
        <select value={form.customerId} onChange={e=>setForm({...form, customerId:e.target.value})} style={{width:'100%', padding:'10px 12px', border:'1px solid var(--silver)', borderRadius:4, marginBottom:16, fontSize:14}}>
          {CUSTOMERS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>

        <label style={{fontSize:12, fontWeight:700, color:'var(--slate)', display:'block', marginBottom:6}}>시험 항목</label>
        <input value={form.item} onChange={e=>setForm({...form, item:e.target.value})} placeholder="예: 피부자극시험(인체적용시험)" style={{width:'100%', padding:'10px 12px', border:'1px solid var(--silver)', borderRadius:4, marginBottom:16, fontSize:14}} />

        <label style={{fontSize:12, fontWeight:700, color:'var(--slate)', display:'block', marginBottom:6}}>등록 담당자</label>
        <input value={form.registeredBy} onChange={e=>setForm({...form, registeredBy:e.target.value})} style={{width:'100%', padding:'10px 12px', border:'1px solid var(--silver)', borderRadius:4, marginBottom:16, fontSize:14}} />

        <label style={{fontSize:12, fontWeight:700, color:'var(--slate)', display:'block', marginBottom:6}}>보고서 원본 파일</label>
        <div
          onDragOver={e=>{e.preventDefault(); setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault(); setDrag(false); setFile(e.dataTransfer.files[0]?.name || '보고서_원본.pdf');}}
          onClick={()=>setFile('보고서_원본.pdf')}
          style={{border:`1.5px dashed ${drag ? 'var(--ink)' : 'var(--silver)'}`, borderRadius:6, padding:'22px 16px', textAlign:'center', cursor:'pointer', marginBottom:20, background: drag ? 'var(--paper)' : 'transparent'}}>
          <Icon name="upload" size={22} style={{color:'var(--slate)'}} />
          <div style={{fontSize:13, color:'var(--slate)', marginTop:8}}>{file ? `선택됨: ${file}` : '클릭 또는 파일을 끌어다 놓으세요 (PDF, 최대 20MB)'}</div>
        </div>

        <div style={{display:'flex', gap:10}}>
          <button className="btn-ghost" onClick={onClose} style={{flex:1}}>취소</button>
          <button className="btn-primary" style={{flex:1}} onClick={()=>{
            if(!form.item){ return; }
            onSave({...form, id: form.id || `RPT-2024-0${150+Math.floor(Math.random()*40)}`, registeredAt: form.registeredAt || '2024.11.12', status: form.status || 'pending', qrAt:form.qrAt||null, qrBy:form.qrBy||null, downloads:form.downloads||0});
          }}>{isEdit ? '저장' : '등록'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- QR 발급 모달 ---------- */
function QRIssueModal({report, onClose, onIssued}) {
  const [stage, setStage] = useState('confirm'); // confirm | generating | done
  const value = `https://qr-report-demo.example.kr/scan/${report.id}`;

  useEffect(()=>{
    if (stage === 'generating') {
      const t = setTimeout(()=>setStage('done'), 1100);
      return ()=>clearTimeout(t);
    }
  },[stage]);

  return (
    <Modal onClose={onClose} width={420}>
      <div style={{padding:28, textAlign:'center'}}>
        {stage === 'confirm' && <>
          <Icon name="qrcode" size={30} style={{color:'var(--ink)'}} />
          <h3 style={{fontSize:18, margin:'12px 0 6px'}}>QR을 발급할까요?</h3>
          <p style={{fontSize:13, color:'var(--slate)', margin:'0 0 20px'}}>{report.id} 보고서에 대한 고유 QR이 생성되고 이력에 기록됩니다.</p>
          <div style={{display:'flex', gap:10}}>
            <button className="btn-ghost" style={{flex:1}} onClick={onClose}>취소</button>
            <button className="btn-primary" style={{flex:1}} onClick={()=>setStage('generating')}>발급 진행</button>
          </div>
        </>}
        {stage === 'generating' && <>
          <div className="skeleton" style={{width:176, height:176, borderRadius:4, margin:'0 auto 16px'}}></div>
          <p style={{fontSize:13, color:'var(--slate)'}}>QR 코드 생성 중…</p>
        </>}
        {stage === 'done' && <>
          <div style={{display:'flex', justifyContent:'center', marginBottom:14}}><QRCanvas value={value} /></div>
          <p style={{fontSize:12, color:'var(--slate)', marginBottom:18, wordBreak:'break-all'}}>{value}</p>
          <div style={{display:'flex', gap:10}}>
            <button className="btn-ghost" style={{flex:1}} onClick={()=>{onIssued('png'); onClose();}}><Icon name="photo" size={15} /> PNG 다운로드</button>
            <button className="btn-primary" style={{flex:1}} onClick={()=>{onIssued('pdf'); onClose();}}><Icon name="printer" size={15} /> 인쇄용 PDF</button>
          </div>
        </>}
      </div>
    </Modal>
  );
}

/* ---------- screen: 보고서 관리 (main, master-detail) ---------- */
function ReportsScreen({reports, setReports, filterCustomer, setFilterCustomer, pushToast}) {
  const [selectedId, setSelectedId] = useState(reports[0]?.id);
  const [q, setQ] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showForm, setShowForm] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [showQR, setShowQR] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(true);
  const [commentsOpen, setCommentsOpen] = useState(false);

  const filtered = reports.filter(r=>{
    if (filterCustomer && r.customerId !== filterCustomer) return false;
    if (statusFilter !== 'all' && r.status !== statusFilter) return false;
    if (q && !(r.id.toLowerCase().includes(q.toLowerCase()) || r.item.includes(q))) return false;
    return true;
  });
  const selected = reports.find(r=>r.id===selectedId) || filtered[0];
  const customer = selected && CUSTOMERS.find(c=>c.id===selected.customerId);

  return (
    <div>
      <div className="page-icon-row" style={{display:'flex', alignItems:'center', gap:14, marginBottom:4}}>
        <span style={{fontSize:40}}><Icon name="file-text" size={40} /></span>
        <div style={{display:'flex', gap:8, marginLeft:'auto'}}>
          <button className="meta-action btn-ghost" onClick={()=>pushToast('아이콘이 변경되었습니다')}><Icon name="mood-smile" size={14} /> 아이콘</button>
          <button className="meta-action btn-ghost" onClick={()=>pushToast('커버 이미지가 적용되었습니다')}><Icon name="photo" size={14} /> 커버</button>
          <button className="meta-action btn-ghost" onClick={()=>setCommentsOpen(v=>!v)}><Icon name="message-circle" size={14} /> 댓글 3</button>
        </div>
      </div>
      <h1 className="page-title" style={{fontSize:32, fontWeight:800, letterSpacing:'-0.01em', margin:'6px 0 6px'}}>보고서 관리</h1>
      <p style={{fontSize:14, color:'var(--slate)', margin:'0 0 24px'}}>화장품 임상시험 완료 보고서를 등록하고 고객사·보고서 번호별로 조회·수정합니다.</p>

      {commentsOpen && (
        <div style={{border:'1px solid var(--silver)', borderRadius:6, padding:14, marginBottom:20, fontSize:13, color:'var(--slate)', animation:'fadeInUp .2s ease'}}>
          <div style={{fontWeight:700, color:'var(--ink)', marginBottom:8}}>댓글 (3)</div>
          <div style={{marginBottom:6}}>· 이지은 — 고객사 연락처 최신화 부탁드립니다</div>
          <div style={{marginBottom:6}}>· 박서준 — 확인했습니다, 반영 완료</div>
          <div>· 김민수 — 다음 배치 등록은 11/15 예정</div>
        </div>
      )}

      <div style={{display:'flex', gap:24, alignItems:'flex-start'}}>
        {/* list-rail */}
        <div className="list-rail" style={{width:326, flexShrink:0}}>
          <div style={{display:'flex', gap:8, marginBottom:10}}>
            <div style={{position:'relative', flex:1}}>
              <Icon name="search" size={15} style={{position:'absolute', left:10, top:11, color:'var(--stone)'}} />
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="보고서 번호 검색" style={{width:'100%', padding:'9px 10px 9px 32px', border:'1px solid var(--silver)', borderRadius:4, fontSize:13}} />
            </div>
            <button className="btn-primary" style={{padding:'0 14px'}} onClick={()=>{setEditTarget(null); setShowForm(true);}}><Icon name="plus" size={16} /></button>
          </div>
          <div style={{display:'flex', gap:6, marginBottom:12, flexWrap:'wrap'}}>
            {['all','issued','pending','expired'].map(s=>(
              <button key={s} onClick={()=>setStatusFilter(s)} className="btn-ghost" style={{padding:'5px 10px', fontSize:12, background: statusFilter===s ? 'var(--ink)' : 'transparent', color: statusFilter===s ? '#fff' : 'var(--graphite)', borderColor: statusFilter===s ? 'var(--ink)' : 'var(--silver)'}}>
                {s==='all'?'전체':STATUS_LABEL[s]}
              </button>
            ))}
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8, maxHeight:520, overflowY:'auto'}}>
            {filtered.map((r,i)=>(
              <div key={r.id} className="list-card" onClick={()=>setSelectedId(r.id)} style={{border:`1px solid ${selectedId===r.id?'var(--ink)':'var(--silver)'}`, borderRadius:4, padding:'12px 14px', cursor:'pointer', animation:'fadeInUp .25s ease', animationDelay:`${i*0.02}s`, animationFillMode:'backwards'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4}}>
                  <span style={{fontSize:13, fontWeight:700}}>{r.id}</span>
                  <Badge status={r.status} />
                </div>
                <div style={{fontSize:12.5, color:'var(--slate)'}}>{CUSTOMERS.find(c=>c.id===r.customerId)?.name} · {r.item}</div>
              </div>
            ))}
            {filtered.length===0 && <div style={{fontSize:13, color:'var(--stone)', padding:'20px 0', textAlign:'center'}}>조건에 맞는 보고서가 없습니다</div>}
          </div>
        </div>

        {/* detail-panel — notion blocks */}
        <div className="detail-panel" style={{flex:1, minWidth:0}}>
          {selected ? (
            <div className="block-list" key={selected.id} style={{animation:'fadeInUp .2s ease'}}>
              <div className="block block-callout" data-block-type="callout" style={{display:'flex', gap:10, alignItems:'flex-start', background: selected.status==='issued' ? 'var(--accent-dim)' : selected.status==='pending' ? 'var(--warn-bg)' : 'var(--danger-bg)', borderRadius:6, padding:14, marginBottom:18}}>
                <span className="callout-icon"><Icon name="info-circle" size={17} /></span>
                <p className="callout-text" style={{margin:0, fontSize:13.5}}>
                  {selected.status==='issued' && `이 보고서는 QR 발급 완료 상태입니다 (누적 다운로드 ${selected.downloads}회).`}
                  {selected.status==='pending' && '이 보고서는 아직 QR이 발급되지 않았습니다.'}
                  {selected.status==='expired' && '이 보고서의 QR은 재발급으로 만료 처리되었습니다.'}
                </p>
              </div>

              <div className="block block-heading" data-block-type="heading">
                <h2 style={{fontSize:21, fontWeight:700, letterSpacing:'-0.01em', margin:'0 0 12px'}}>보고서 개요</h2>
              </div>

              <div className="block block-table" data-block-type="table" style={{marginBottom:18}}>
                <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
                  <tbody>
                    {[['보고서 번호', selected.id], ['고객사', customer?.name], ['시험 항목', selected.item], ['등록일', selected.registeredAt], ['등록 담당자', selected.registeredBy]].map(([k,v])=>(
                      <tr key={k}><td style={{padding:'8px 0', color:'var(--slate)', width:120, borderBottom:'1px solid var(--silver)'}}>{k}</td><td style={{padding:'8px 0', fontWeight:600, borderBottom:'1px solid var(--silver)'}}>{v}</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="block block-toggle" data-block-type="toggle" style={{marginBottom:18, border:'1px solid var(--silver)', borderRadius:6, padding:'12px 14px'}}>
                <button onClick={()=>setHistoryOpen(v=>!v)} style={{background:'none', border:'none', display:'flex', alignItems:'center', gap:8, padding:0, fontSize:14, fontWeight:700, width:'100%', textAlign:'left'}}>
                  <span className="toggle-arrow">{historyOpen ? '▾' : '▸'}</span>
                  <span className="toggle-summary">등록 이력</span>
                </button>
                {historyOpen && (

                  <tbody>
                    {selected.qrAt ? (
                      <tr><td style={{padding:'6px 0', borderTop:'1px solid var(--silver)'}}>{selected.qrAt}</td><td style={{borderTop:'1px solid var(--silver)'}}>{selected.qrBy}</td><td style={{borderTop:'1px solid var(--silver)'}}>{selected.downloads}회</td></tr>

                      <tr><td colSpan="3" style={{padding:'10px 0', color:'var(--stone)', borderTop:'1px solid var(--silver)'}}>발급 이력 없음</td></tr>

              <div style={{display:'flex', gap:10}}>
                <button className="btn-primary" onClick={()=>setShowQR(true)}><Icon name="qrcode" size={15} /> QR 발급하기</button>
                <button className="btn-ghost" onClick={()=>{setEditTarget(selected); setShowForm(true);}}><Icon name="edit" size={15} /> 수정</button>
              </div>
            </div>
          ) : <div style={{color:'var(--stone)'}}>보고서를 선택하세요</div>}
        </div>
      </div>

      {showForm && <ReportForm report={editTarget} onClose={()=>setShowForm(false)} onSave={(r)=>{
        setReports(prev => editTarget ? prev.map(x=>x.id===r.id?r:x) : [r, ...prev]);

        pushToast(editTarget ? '보고서가 수정되었습니다' : '보고서가 등록되었습니다');

      {showQR && selected && <QRIssueModal report={selected} onClose={()=>setShowQR(false)} onIssued={(fmt)=>{
        setReports(prev=>prev.map(x=>x.id===selected.id ? {...x, status:'issued', qrAt:'2024.11.12', qrBy:'김민수'} : x));

      }} />}
    </div>
  );
}

      <div style={{display:'flex', gap:8, marginBottom:20}}>
        {[['valid','정상 QR'],['expired','만료 QR'],['invalid','위조 토큰']].map(([m,label])=>(
          <button key={m} className="btn-ghost" onClick={()=>setMode(m)} style={{background: mode===m?'var(--ink)':'transparent', color: mode===m?'#fff':'var(--graphite)', borderColor: mode===m?'var(--ink)':'var(--silver)', fontSize:12}}>{label}</button>

      <div style={{maxWidth:340, margin:'0 auto', border:'8px solid var(--ink)', borderRadius:28, padding:'20px 16px', background:'#fff', boxShadow:'0 12px 32px rgba(16,16,16,.18)'}}>

            <div style={{textAlign:'center', marginBottom:14}}>
              <Icon name="shield-check" size={30} style={{color:'var(--accent)'}} />
              <div style={{fontSize:13, fontWeight:700, marginTop:6}}>시험 자료 확인됨</div>
            </div>
            <div style={{border:'1px solid var(--silver)', borderRadius:6, padding:14, fontSize:13}}>
              <div style={{marginBottom:6}}><span style={{color:'var(--slate)'}}>보고서 번호</span><br/><b>{report.id}</b></div>
              <div style={{marginBottom:6}}><span style={{color:'var(--slate)'}}>고객사</span><br/><b>{customer?.name}</b></div>
              <div><span style={{color:'var(--slate)'}}>시험 항목</span><br/><b>{report.item}</b></div>
            </div>
            <button className="btn-primary" style={{width:'100%', marginTop:14}} onClick={()=>{}}><Icon name="file-description" size={14} /> 원본 자료 보기</button>
          </div>
        )}
        {mode === 'expired' && (
          <div style={{textAlign:'center', padding:'20px 0', animation:'fadeInUp .2s ease'}}>
            <Icon name="clock-x" size={30} style={{color:'var(--warn)'}} />
            <div style={{fontSize:14, fontWeight:700, marginTop:10}}>만료된 QR입니다</div>
            <div style={{fontSize:12.5, color:'var(--slate)', marginTop:6}}>재발급된 최신 QR을 요청해 주세요.</div>
          </div>
        )}
        {mode === 'invalid' && (
          <div style={{textAlign:'center', padding:'20px 0', animation:'fadeInUp .2s ease'}}>
            <Icon name="shield-x" size={30} style={{color:'var(--danger)'}} />
            <div style={{fontSize:14, fontWeight:700, marginTop:10}}>확인할 수 없는 QR입니다</div>
            <div style={{fontSize:12.5, color:'var(--slate)', marginTop:6}}>서명 검증에 실패하여 자료를 표시할 수 없습니다.</div>
          </div>
        )}
      </div>
    </div>
  );
}

            <span className="tree-label" style={{fontSize:13.5, fontWeight:600}}>QR 발급·이력</span>
          </div>

          <div className="tree-item" style={{display:'flex', alignItems:'center', gap:6, padding:'7px 8px', borderRadius:4, cursor:'pointer', background: screen==='customer-portal' ? 'var(--paper)' : 'transparent'}} onClick={()=>setScreen('customer-portal')}>
            <span className="tree-toggle-placeholder" style={{width:14}}></span>
            <span className="tree-icon"><Icon name="building" size={15} /></span>
            <span className="tree-label" style={{fontSize:13.5, fontWeight:600}}>고객사 포털</span>
          </div>

          <div className="tree-item" style={{display:'flex', alignItems:'center', gap:6, padding:'7px 8px', borderRadius:4, cursor:'pointer', background: screen==='scan-page' ? 'var(--paper)' : 'transparent'}} onClick={()=>setScreen('scan-page')}>
            <span className="tree-toggle-placeholder" style={{width:14}}></span>
            <span className="tree-icon"><Icon name="scan" size={15} /></span>
            <span className="tree-label" style={{fontSize:13.5, fontWeight:600}}>QR 스캔 조회</span>
          </div>
        </nav>

        <div className="sidebar-footer" style={{position:'absolute', bottom:16, left:12, right:12, borderTop:'1px solid var(--silver)', paddingTop:10, display:'flex', flexDirection:'column', gap:2}}>
          <button className="footer-link" onClick={()=>pushToast('휴지통을 확인합니다')} style={{display:'flex', alignItems:'center', gap:8, background:'none', border:'none', padding:'6px 8px', fontSize:12.5, color:'var(--slate)', textAlign:'left'}}><Icon name="trash" size={14} /> 휴지통</button>
          <button className="footer-link" onClick={()=>setSettingsOpen(true)} style={{display:'flex', alignItems:'center', gap:8, background:'none', border:'none', padding:'6px 8px', fontSize:12.5, color:'var(--slate)', textAlign:'left'}}><Icon name="settings" size={14} /> 설정</button>
        </div>
      </aside>

      <main className="main-wrap page" style={{marginLeft:240, flex:1, minWidth:0, width:'calc(100% - 240px)', minHeight:'100vh'}}>
        <header className="page-breadcrumb" style={{display:'flex', alignItems:'center', gap:6, padding:'16px 32px', borderBottom:'1px solid var(--silver)', fontSize:12.5, color:'var(--stone)'}}>
          {crumbs.map((c,i)=>(<React.Fragment key={c}>{i>0 && <span>›</span>}<a style={{color: i===crumbs.length-1 ? 'var(--ink)' : 'var(--stone)', fontWeight: i===crumbs.length-1 ? 700 : 400}}>{c}</a></React.Fragment>))}
          {filterCustomer && screen==='main' && <span style={{marginLeft:10, background:'var(--paper)', border:'1px solid var(--silver)', borderRadius:2, padding:'2px 8px', fontSize:11}}>필터: {CUSTOMERS.find(c=>c.id===filterCustomer)?.name} <span onClick={()=>setFilterCustomer(null)} style={{cursor:'pointer', marginLeft:4}}>✕</span></span>}
        </header>

        <div className="page-body" style={{maxWidth:880, margin:'0 auto', padding:32}}>
          {screen==='main' && <ReportsScreen reports={reports} setReports={setReports} filterCustomer={filterCustomer} setFilterCustomer={setFilterCustomer} pushToast={pushToast} />}
          {screen==='qr-issuance' && <QRHistoryScreen reports={reports} setReports={setReports} pushToast={pushToast} />}
          {screen==='customer-portal' && <CustomerPortalScreen reports={reports} pushToast={pushToast} />}
          {screen==='scan-page' && <ScanPreviewScreen reports={reports} />}
        </div>
      </main>

      {settingsOpen && (
        <Modal onClose={()=>setSettingsOpen(false)} width={380}>
          <div style={{padding:24}}>
            <h3 style={{fontSize:16, margin:'0 0 14px'}}>워크스페이스 설정</h3>
            <label style={{fontSize:12, color:'var(--slate)', fontWeight:700}}>워크스페이스 이름</label>
            <input defaultValue="임상보고서 스튜디오" style={{width:'100%', padding:'9px 10px', border:'1px solid var(--silver)', borderRadius:4, fontSize:13, margin:'6px 0 16px'}} />
            <button className="btn-primary" style={{width:'100%'}} onClick={()=>{setSettingsOpen(false); pushToast('설정이 저장되었습니다');}}>저장</button>
          </div>
        </Modal>
      )}

      {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
