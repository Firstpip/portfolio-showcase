<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인스타그램 멀티계정 자동 게시 관제 시스템 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --ink:#202020; --bone:#e8e8e8; --cloud:#d4d4d4; --mist:#f8f9fa; --plaster:#f2f3f5;
    --white:#ffffff; --slate:#646464; --ash:#8a8a8a; --blue:#0091ff; --violet:#6647f0;
    --green:#0bb07b; --amber:#e08a00; --red:#e5484d;
    --radius-pill:9999px; --radius-card:12px; --radius-input:9px;
    --shadow-subtle:0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
    --sidebar-w:264px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%; margin:0; padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--white); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--cloud); border-radius:8px;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeInScale{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
  @keyframes slideUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 0 rgba(11,176,123,.45);} 50%{box-shadow:0 0 0 6px rgba(11,176,123,0);} }
  @keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  @keyframes ringSpin{ from{stroke-dashoffset:245;} to{stroke-dashoffset:var(--ring-offset, 90);} }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
  @keyframes radarSweep{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes radarPing{ 0%{transform:scale(.6); opacity:.9;} 100%{transform:scale(1); opacity:0;} }

  .hero-signal{
    display:flex; align-items:center; gap:0; margin-bottom:20px; padding:24px 28px;
    border:1px solid var(--bone); border-radius:var(--radius-card); background:var(--white);
    box-shadow:var(--shadow-subtle); position:relative; overflow:hidden;
  }
  .hero-signal-divider{width:1px; align-self:stretch; background:var(--bone); margin:0 24px;}
  .hero-signal-radar{
    position:relative; width:64px; height:64px; margin-right:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .radar-ring{
    position:absolute; border-radius:50%; border:1.5px solid rgba(0,145,255,.35);
  }
  .radar-ring.r1{width:64px; height:64px;}
  .radar-ring.r2{width:44px; height:44px; animation:radarPing 2.4s ease-out infinite;}
  .radar-ring.r3{width:44px; height:44px; animation:radarPing 2.4s ease-out infinite 1.2s;}
  .radar-sweep{
    position:absolute; width:64px; height:64px; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(0,145,255,.55), transparent 32%, transparent 100%);
    animation:radarSweep 3.2s linear infinite;
  }
  .radar-core{
    position:relative; z-index:2; width:30px; height:30px; border-radius:50%; background:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 4px #fff;
  }

  .timeline-wrap{padding:16px 20px 4px;}
  .timeline-ruler{display:flex; margin-bottom:10px;}
  .timeline-ruler-track{flex:1; position:relative; height:14px;}
  .ruler-tick{position:absolute; font-size:10.5px; color:var(--ash); font-weight:600; transform:translateX(-50%);}
  .timeline-row{display:flex; align-items:center; margin-bottom:12px;}
  .timeline-row-label{width:100px; flex-shrink:0; font-size:12px; font-weight:700; color:var(--slate); padding-right:8px;}
  .timeline-row-track{
    flex:1; position:relative; height:22px; background:var(--mist); border-radius:6px;
  }
  .timeline-gridline{position:absolute; top:0; bottom:0; width:1px; background:var(--cloud);}
  .timeline-dot{
    position:absolute; top:50%; width:14px; height:14px; border-radius:50%; border:2px solid #fff;
    transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.25); transition:transform .15s ease;
  }
  .timeline-dot:hover{transform:translate(-50%,-50%) scale(1.35);}
  .timeline-legend{display:flex; gap:16px; padding:12px 20px 18px; font-size:11.5px; color:var(--slate); font-weight:600;}
  .timeline-legend-item{display:flex; align-items:center;}

  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w);
    background:var(--white); border-right:1px solid var(--bone);
    display:flex; flex-direction:column; z-index:20;
  }
  .sidebar-brand{
    height:64px; display:flex; align-items:center; gap:10px; padding:0 18px;
    border-bottom:1px solid var(--bone); flex-shrink:0;
  }
  .brand-mark{
    width:28px; height:28px; border-radius:8px; background:var(--ink);
    display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
  }
  .brand-name{font-weight:800; font-size:15px; letter-spacing:-0.02em;}
  .brand-sub{font-size:11px; color:var(--ash); font-weight:500;}
  .sidebar-cmdk-hint{
    margin:14px 16px 6px; padding:8px 10px; border-radius:var(--radius-input);
    background:var(--mist); border:1px solid var(--bone); display:flex; align-items:center;
    gap:8px; font-size:12.5px; color:var(--ash); justify-content:space-between;
  }
  .kbd{
    font-family:ui-monospace,monospace; font-size:11px; background:var(--white);
    border:1px solid var(--cloud); border-radius:5px; padding:1px 6px; color:var(--slate);
  }
  .sidebar-nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px;}
  .sidebar-link{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    font-size:13.5px; font-weight:600; color:var(--slate); border:none; background:none;
    text-align:left; width:100%; position:relative; transition:background .15s ease, color .15s ease;
    text-decoration:none; cursor:pointer;
  }
  .sidebar-link:hover{background:var(--mist); color:var(--ink);}
  .sidebar-link.active{background:var(--mist); color:var(--ink);}
  .sidebar-link.active::before{
    content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px;
    border-radius:3px; background:var(--blue);
  }
  .sidebar-link .icon-wrap{width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sidebar-section{padding:14px 12px 4px;}
  .sidebar-section-title{
    font-size:11px; font-weight:700; color:var(--ash); text-transform:uppercase;
    letter-spacing:.06em; padding:6px 10px;
  }
  .sidebar-user{
    margin-top:auto; border-top:1px solid var(--bone); padding:12px 16px; display:flex;
    align-items:center; gap:10px;
  }
  .avatar{
    width:30px; height:30px; border-radius:var(--radius-pill); background:linear-gradient(135deg,#0091ff,#6647f0);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0;
  }

  .main-wrap{
    margin-left:var(--sidebar-w); min-height:100vh; flex:1; min-width:0; width:calc(100% - var(--sidebar-w));
    display:flex; flex-direction:column;
  }
  .topbar{
    height:56px; border-bottom:1px solid var(--bone); display:flex; align-items:center;
    justify-content:space-between; padding:0 24px; background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px); position:sticky; top:0; z-index:10; flex-shrink:0;
  }
  .breadcrumb{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ash); font-weight:500;}
  .breadcrumb b{color:var(--ink); font-weight:700;}
  .breadcrumb .divider{color:var(--cloud);}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-pill);
    font-weight:700; font-size:13px; padding:9px 16px; border:1px solid transparent;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease; white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(32,32,32,.25);}
  .btn-ghost{background:transparent; border-color:var(--bone); color:var(--ink);}
  .btn-ghost:hover{background:var(--mist);}
  .btn-outline-blue{background:transparent; border-color:var(--blue); color:var(--blue);}
  .btn-sm{padding:6px 12px; font-size:12px;}
  .btn-cmdk{
    background:var(--mist); border:1px solid var(--bone); color:var(--slate); font-size:12px;
    padding:7px 12px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:6px; font-weight:600;
  }

  .content{padding:28px 32px 60px; animation:fadeIn .35s ease both;}

  /* status strip */
  .status-strip{
    display:flex; align-items:stretch; gap:0; border:1px solid var(--bone); border-radius:var(--radius-card);
    overflow:hidden; margin-bottom:20px; background:var(--white);
  }
  .status-cell{
    flex:1; padding:14px 20px; display:flex; align-items:center; gap:12px; border-right:1px solid var(--bone);
  }
  .status-cell:last-child{border-right:none;}
  .status-icon{
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .status-value{font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.1;}
  .status-label{font-size:11.5px; color:var(--ash); font-weight:600; margin-top:2px;}
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block;
    animation:pulseDot 1.8s infinite;
  }

  .command-grid{display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start;}
  .panel{
    border:1px solid var(--bone); border-radius:var(--radius-card); background:var(--white);
    box-shadow:var(--shadow-subtle);
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:1px solid var(--bone);
  }
  .panel-title{font-size:15px; font-weight:800; letter-spacing:-.01em;}
  .panel-sub{font-size:12px; color:var(--ash); margin-top:2px; font-weight:500;}

  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:18px 20px;}
  .board-col-head{font-size:12px; font-weight:700; color:var(--slate); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .board-col-count{
    background:var(--mist); border-radius:var(--radius-pill); font-size:11px; padding:1px 7px; color:var(--ash); font-weight:700;
  }
  .post-card{
    border:1px solid var(--bone); border-radius:10px; padding:11px 12px; margin-bottom:10px; background:var(--white);
    animation:slideUp .3s ease both; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .post-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(32,32,32,.08); border-color:var(--cloud);}
  .post-account{font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .post-caption{font-size:12px; color:var(--slate); line-height:1.5; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .post-meta{display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--ash);}
  .type-tag{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:var(--radius-pill); background:var(--mist); color:var(--slate);
  }

  .priority-rail{padding:14px 16px;}
  .priority-item{
    display:flex; align-items:flex-start; gap:10px; padding:11px 10px; border-radius:10px;
    border:1px solid var(--bone); margin-bottom:9px; transition:background .15s ease, border-color .15s ease;
  }
  .priority-item:hover{background:var(--mist); border-color:var(--cloud);}
  .priority-badge{
    width:26px; height:26px; border-radius:8px; background:#fdeceb; color:var(--red); display:flex;
    align-items:center; justify-content:center; flex-shrink:0;
  }
  .priority-title{font-size:12.5px; font-weight:700;}
  .priority-desc{font-size:11.5px; color:var(--ash); margin-top:2px; line-height:1.4;}

  .secondary-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-top:16px;}
  .widget{border:1px solid var(--bone); border-radius:var(--radius-card); padding:18px 20px; background:var(--white);}
  .widget-title{font-size:13px; font-weight:800; margin-bottom:14px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-label{font-size:11.5px; color:var(--slate); width:64px; flex-shrink:0; font-weight:600;}
  .bar-track{flex:1; height:8px; background:var(--mist); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px; transform-origin:left; animation:barGrow 1s cubic-bezier(.2,.7,.3,1) both;}
  .bar-num{font-size:11.5px; font-weight:700; width:32px; text-align:right;}

  .donut-wrap{display:flex; align-items:center; gap:18px;}
  .donut-legend{display:flex; flex-direction:column; gap:8px; font-size:12px;}
  .legend-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .acc-card{
    border:1px solid var(--bone); border-radius:var(--radius-card); padding:16px; background:var(--white);
    transition:box-shadow .15s ease, transform .15s ease; cursor:pointer;
  }
  .acc-card:hover{box-shadow:0 8px 22px rgba(32,32,32,.08); transform:translateY(-2px);}
  .acc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .acc-name{font-size:13.5px; font-weight:800;}
  .acc-handle{font-size:11px; color:var(--ash);}
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:var(--radius-pill);
  }
  .badge-green{background:#e6f8f1; color:var(--green);}
  .badge-amber{background:#fdf3e2; color:var(--amber);}
  .badge-red{background:#fdeceb; color:var(--red);}
  .badge-blue{background:#e6f4ff; color:var(--blue);}
  .badge-violet{background:#f1edfe; color:var(--violet);}
  .progress-mini{height:5px; border-radius:4px; background:var(--mist); overflow:hidden; margin-top:10px;}
  .progress-mini-fill{height:100%; border-radius:4px; animation:barGrow .9s ease both; transform-origin:left;}

  .form-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:22px;}
  .upload-zone{
    border:1.5px dashed var(--cloud); border-radius:var(--radius-card); padding:32px 20px; text-align:center;
    background:var(--mist); transition:border-color .15s ease, background .15s ease; cursor:pointer;
  }
  .upload-zone:hover{border-color:var(--blue); background:#eef7ff;}
  .field{margin-bottom:16px;}
  .field-label{font-size:12.5px; font-weight:700; margin-bottom:7px; display:block; color:var(--ink);}
  .field input[type=text], .field input[type=datetime-local], .field select, .field textarea{
    width:100%; border:1px solid var(--bone); border-radius:var(--radius-input); padding:10px 12px; font-size:13px;
    background:var(--white); color:var(--ink); outline:none; transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:7px 13px; border-radius:var(--radius-pill); border:1px solid var(--bone); font-size:12.5px;
    font-weight:600; background:var(--white); color:var(--slate); transition:all .15s ease;
  }
  .chip.selected{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toggle-group{display:flex; gap:0; border:1px solid var(--bone); border-radius:var(--radius-pill); overflow:hidden; width:fit-content;}
  .toggle-opt{padding:8px 18px; font-size:12.5px; font-weight:700; color:var(--slate); background:var(--white);}
  .toggle-opt.active{background:var(--ink); color:#fff;}

  .caption-preview{
    background:var(--mist); border:1px solid var(--bone); border-radius:var(--radius-card); padding:16px; font-size:12.5px;
    line-height:1.8; color:var(--slate); white-space:pre-wrap;
  }
  .policy-row{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--slate);}

  table.plain{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.plain th{
    text-align:left; padding:10px 14px; color:var(--ash); font-weight:700; font-size:11px;
    text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--bone);
  }
  table.plain td{padding:12px 14px; border-bottom:1px solid var(--plaster);}
  table.plain tr:hover td{background:var(--mist);}

  .rule-day{
    width:36px; height:36px; border-radius:var(--radius-pill); border:1px solid var(--bone); display:flex;
    align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--slate); background:var(--white);
  }
  .rule-day.selected{background:var(--blue); color:#fff; border-color:var(--blue);}
  .retry-dots{display:flex; gap:4px;}
  .retry-dot{width:6px; height:6px; border-radius:50%; background:var(--bone);}
  .retry-dot.used{background:var(--red);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(32,32,32,.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px; animation:fadeIn .18s ease both;
  }
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    box-shadow:0 30px 60px rgba(0,0,0,.25); animation:fadeInScale .22s cubic-bezier(.2,.8,.3,1) both;
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--bone);}
  .modal-body{padding:22px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 22px; border-top:1px solid var(--bone);}

  .cmdk-overlay{
    position:fixed; inset:0; background:rgba(32,32,32,.4); z-index:200; display:flex; align-items:flex-start;
    justify-content:center; padding-top:12vh; animation:fadeIn .15s ease both;
  }
  .cmdk-modal{
    width:100%; max-width:560px; background:#fff; border-radius:14px; box-shadow:0 30px 70px rgba(0,0,0,.3);
    overflow:hidden; animation:fadeInScale .18s ease both;
  }
  .cmdk-input{
    width:100%; border:none; outline:none; padding:18px 20px; font-size:15px; border-bottom:1px solid var(--bone);
  }
  .cmdk-group-title{font-size:11px; font-weight:700; color:var(--ash); padding:10px 16px 4px; text-transform:uppercase; letter-spacing:.05em;}
  .cmdk-item{
    display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .cmdk-item:hover{background:var(--mist);}
  .cmdk-results{max-height:340px; overflow-y:auto; padding-bottom:8px;}

  .toast-wrap{position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--ink); color:#fff; padding:13px 18px; border-radius:11px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:8px; box-shadow:0 12px 28px rgba(0,0,0,.28); animation:toastIn .25s ease both;
  }

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 20px; color:var(--ash);}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef} = React;

/* ───────── mock data ───────── */
const ACCOUNTS = [
  {id:'a1', name:'메인 공식 계정', handle:'@studio.main', region:'KR', followers:'32.4만', tokenState:'양호', tokenDays:41, usage:38, status:'connected'},
  {id:'a2', name:'저팬 공식 계정', handle:'@studio.jp', region:'JP', followers:'18.1만', tokenState:'양호', tokenDays:29, usage:52, status:'connected'},

/* ───────── shared bits ───────── */
function Icon({name, size=16, color, style}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, [name]);
  return <i ref={ref} data-lucide={name} style={{width:size, height:size, color, ...style}}></i>;
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, icon='check-circle-2') => {
    const id = Date.now()+Math.random();
    setToasts(t => [...t, {id, msg, icon}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 2800);
  };
  return {toasts, push};
}

function ToastStack({toasts}){
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><Icon name={t.icon} size={16} color="#6ee7b7" />{t.msg}</div>
      ))}
    </div>
  );
}

function Modal({title, onClose, children, footer, width}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={width?{maxWidth:width}:{}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div style={{fontWeight:800, fontSize:15}}>{title}</div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><Icon name="x" size={15}/></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function statusColor(status){
  if(status==='완료') return 'green';
  if(status==='진행중') return 'blue';
  if(status==='실패') return 'red';
  return 'amber';
}

        <div style={{fontSize:22, fontWeight:800, letterSpacing:'-0.02em'}}>콘텐츠 등록 및 예약</div>
        <div style={{fontSize:13, color:'#8a8a8a', marginTop:4}}>이미지·영상을 업로드하고 캡션·게시 계정·일시를 지정해 예약합니다.</div>
      </div>

      <div className="form-grid">
        <div className="panel" style={{padding:22}}>
          <div className="toggle-group" style={{marginBottom:18}}>
            <div className={"toggle-opt "+(type==='카드뉴스'?'active':'')} onClick={()=>setType('카드뉴스')} style={{cursor:'pointer'}}>카드뉴스(캐러셀)</div>
            <div className={"toggle-opt "+(type==='릴스'?'active':'')} onClick={()=>setType('릴스')} style={{cursor:'pointer'}}>릴스</div>
          </div>

          <div className="upload-zone" onClick={()=>{setFileName(type==='릴스'?'reel_autumn_promo.mp4':'card_autumn_01.png'); push('파일이 업로드되었습니다');}}>
            <Icon name={type==='릴스'?'film':'image-plus'} size={26} color="#0091ff" />
            <div style={{fontSize:13, fontWeight:700, marginTop:10}}>
              {fileName ? fileName : (type==='릴스' ? 'MP4 영상을 드래그하거나 클릭해 업로드' : 'PNG/JPG 이미지를 드래그하거나 클릭해 업로드')}
            </div>
            <div style={{fontSize:11.5, color:'#8a8a8a', marginTop:4}}>권장 비율 {ratio} · 최대 100MB</div>
          </div>

          <div className="policy-row">
            <Icon name="check-circle-2" size={14} color="#0bb07b"/> 이미지 비율 정책({ratio}) 사전 검증 통과
          </div>
          <div className="policy-row">
            <Icon name="check-circle-2" size={14} color="#0bb07b"/> 용량·포맷 오류 없음
          </div>

          <div className="field" style={{marginTop:18}}>
            <label className="field-label">캡션</label>
            <div style={{display:'flex', gap:8, marginBottom:8}}>
              <button className="btn btn-outline-blue btn-sm" onClick={templateFill}><Icon name="wand-2" size={13}/>브랜딩 템플릿 자동 적용</button>
            </div>
            <textarea rows={6} placeholder="캡션을 입력하거나 템플릿을 자동 적용하세요" value={caption} onChange={e=>setCaption(e.target.value)} style={{width:'100%', border:'1px solid var(--bone)', borderRadius:9, padding:12, fontSize:12.5, resize:'vertical'}} />
          </div>

          {caption && (
            <div className="caption-preview">{caption}</div>
          )}
        </div>

        <div>
          <div className="panel" style={{padding:20, marginBottom:16}}>
            <div className="panel-title" style={{fontSize:13.5, marginBottom:12}}>게시 계정 선택</div>
            <div className="chip-row">
              {ACCOUNTS.slice(0,6).map(a => (
                <div key={a.id} className={"chip "+(selectedAccs.includes(a.id)?'selected':'')} onClick={()=>toggleAcc(a.id)} style={{cursor:'pointer'}}>
                  {a.name}
                </div>
              ))}
            </div>
          </div>

          <div className="panel" style={{padding:20, marginBottom:16}}>
            <div className="panel-title" style={{fontSize:13.5, marginBottom:12}}>게시 일시</div>
            <div className="field" style={{marginBottom:0}}>
              <input type="datetime-local" defaultValue="2026-09-02T18:00" />
            </div>
            <div style={{fontSize:11.5, color:'#8a8a8a', marginTop:8}}>타임존 KST 기준으로 관리됩니다</div>
          </div>

          <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={addReservation}>
            <Icon name="calendar-plus" size={14}/>예약 등록
          </button>

          <div className="panel" style={{marginTop:20}}>
            <div className="panel-head"><div className="panel-title" style={{fontSize:13}}>예약 목록</div></div>
            <table className="plain">
              <thead><tr><th>계정</th><th>유형</th><th>일시</th></tr></thead>
              <tbody>
                {list.map(l => (
                  <tr key={l.id}><td>{l.account}</td><td><span className="type-tag">{l.type}</span></td><td>{l.time}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── accounts screen ───────── */
function AccountsScreen({push}){
  const [selected, setSelected] = useState(null);
  const [reconnecting, setReconnecting] = useState(null);

  const reconnect = (acc) => {
    setReconnecting(acc.id);
    push(acc.name + ' 계정 OAuth 재인증을 시작합니다');
    setTimeout(()=>{ setReconnecting(null); push(acc.name + ' 재인증이 완료되었습니다'); }, 1400);
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20}}>
        <div>
          <div style={{fontSize:22, fontWeight:800, letterSpacing:'-0.02em'}}>인스타그램 멀티계정 연동</div>
          <div style={{fontSize:13, color:'#8a8a8a', marginTop:4}}>10개 비즈니스 계정을 OAuth로 연결하고 토큰 상태를 관리합니다.</div>
        </div>
        <button className="btn btn-primary" onClick={()=>push('계정 추가 인증 흐름을 시작합니다')}><Icon name="plus" size={14}/>계정 추가</button>
      </div>

      <div className="card-grid">
        {ACCOUNTS.map(a => (
          <div className="acc-card" key={a.id} onClick={()=>setSelected(a)}>
            <div className="acc-head">
              <div className="avatar">{a.name[0]}</div>
              <div>
                <div className="acc-name">{a.name}</div>
                <div className="acc-handle">{a.handle} · {a.region}</div>
              </div>
            </div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              <span className={"badge "+(a.status==='connected'?'badge-green':a.status==='warning'?'badge-amber':'badge-red')}>
                <Icon name={a.status==='connected'?'shield-check':a.status==='warning'?'shield-alert':'shield-x'} size={11}/>{a.tokenState}
              </span>
              <span className="badge badge-blue">팔로워 {a.followers}</span>
            </div>
            <div style={{fontSize:11, color:'#8a8a8a', marginTop:10}}>API 호출 한도 사용률</div>
            <div className="progress-mini">
              <div className="progress-mini-fill" style={{width:a.usage+'%', background:a.usage>70?'#e5484d':'#0091ff'}}></div>
            </div>
            {a.status!=='connected' && (
              <button className="btn btn-ghost btn-sm" style={{width:'100%', justifyContent:'center', marginTop:12}}
                onClick={(e)=>{e.stopPropagation(); reconnect(a);}}>
                {reconnecting===a.id ? '재인증 진행 중…' : <React.Fragment><Icon name="refresh-ccw" size={13}/>재연결</React.Fragment>}
              </button>
            )}
          </div>
        ))}
      </div>

      {selected && (
        <Modal title={selected.name} onClose={()=>setSelected(null)} footer={
          <React.Fragment>
            <button className="btn btn-ghost btn-sm" onClick={()=>setSelected(null)}>닫기</button>
            <button className="btn btn-primary btn-sm" onClick={()=>{push('토큰을 갱신했습니다'); setSelected(null);}}><Icon name="key" size={13}/>토큰 갱신</button>
          </React.Fragment>
        }>
          <div style={{fontSize:13, lineHeight:2}}>
            <div><b>핸들</b> — {selected.handle}</div>
            <div><b>지역</b> — {selected.region}</div>
            <div><b>팔로워</b> — {selected.followers}</div>
            <div><b>토큰 상태</b> — {selected.tokenState} ({selected.tokenDays}일 남음)</div>
            <div><b>API 호출 한도 사용률</b> — {selected.usage}%</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── scheduler screen ───────── */
function SchedulerScreen({push}){
  const [openRule, setOpenRule] = useState(false);
  const [days, setDays] = useState(['월','수','금']);
  const [rules, setRules] = useState(RECURRING_RULES);

  const toggleDay = (d) => setDays(s => s.includes(d) ? s.filter(x=>x!==d) : [...s, d]);

  const saveRule = () => {
    setRules(r => [{id:'r'+Date.now(), name:'신규 반복 게시 규칙', days:[...days], time:'09:00', accounts:selectedCount, status:'활성', retries:0}, ...r]);
    setOpenRule(false);
    push('반복 게시 규칙이 저장되었습니다');
  };
  const selectedCount = 5;

  const toggleStatus = (id) => {
    setRules(rs => rs.map(r => r.id===id ? {...r, status: r.status==='활성'?'일시중지':'활성'} : r));
    push('규칙 상태를 변경했습니다');
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20}}>
        <div>
          <div style={{fontSize:22, fontWeight:800, letterSpacing:'-0.02em'}}>반복 게시 스케줄러</div>
          <div style={{fontSize:13, color:'#8a8a8a', marginTop:4}}>날짜·시간 지정 및 반복 규칙에 따라 10계정 동시 게시하고 실패 시 자동 재시도합니다.</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setOpenRule(true)}><Icon name="plus" size={14}/>반복 규칙 추가</button>
      </div>

      <div className="status-strip" style={{marginBottom:20}}>
        <div className="status-cell">
          <div className="status-icon" style={{background:'#e6f4ff'}}><Icon name="repeat" size={17} color="#0091ff"/></div>
          <div><div className="status-value">{rules.filter(r=>r.status==='활성').length}개</div><div className="status-label">활성 반복 규칙</div></div>
        </div>
        <div className="status-cell">
          <div className="status-icon" style={{background:'#f1edfe'}}><Icon name="users" size={17} color="#6647f0"/></div>
          <div><div className="status-value">10계정</div><div className="status-label">동시 게시 처리 대상</div></div>
        </div>
        <div className="status-cell">
          <div className="status-icon" style={{background:'#fdeceb'}}><Icon name="rotate-ccw" size={17} color="#e5484d"/></div>
          <div><div className="status-value">최대 3회</div><div className="status-label">자동 재시도 정책</div></div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><div className="panel-title" style={{fontSize:14}}>반복 게시 규칙 목록</div></div>
        <table className="plain">
          <thead><tr><th>규칙명</th><th>요일</th><th>시간(KST)</th><th>대상 계정</th><th>재시도</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {rules.map(r => (
              <tr key={r.id}>
                <td style={{fontWeight:700}}>{r.name}</td>
                <td>{r.days.join(', ')}</td>
                <td>{r.time}</td>
                <td>{r.accounts}개 계정</td>
                <td>
                  <div className="retry-dots">
                    {[0,1,2].map(i => <div key={i} className={"retry-dot "+(i<r.retries?'used':'')}></div>)}
                  </div>
                </td>
                <td><span className={"badge "+(r.status==='활성'?'badge-green':'badge-amber')}>{r.status}</span></td>
                <td>
                  <button className="btn btn-ghost btn-sm" onClick={()=>toggleStatus(r.id)}>
                    {r.status==='활성' ? '일시중지' : '재개'}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {openRule && (
        <Modal title="반복 게시 규칙 추가" onClose={()=>setOpenRule(false)} footer={
          <React.Fragment>
            <button className="btn btn-ghost btn-sm" onClick={()=>setOpenRule(false)}>취소</button>
            <button className="btn btn-primary btn-sm" onClick={saveRule}>규칙 저장</button>
          </React.Fragment>
        }>
          <div className="field">
            <label className="field-label">반복 요일</label>
            <div style={{display:'flex', gap:8}}>
              {DAYS.map(d => (
                <div key={d} className={"rule-day "+(days.includes(d)?'selected':'')} onClick={()=>toggleDay(d)} style={{cursor:'pointer'}}>{d}</div>
              ))}
            </div>
          </div>
          <div className="field">
            <label className="field-label">게시 시각 (KST)</label>
            <input type="text" defaultValue="09:00" />
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label className="field-label">대상 계정 수</label>
            <input type="text" defaultValue="5개 계정 선택됨" readOnly />
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── settings screen ───────── */
function SettingsScreen({push}){
  const [slackOn, setSlackOn] = useState(true);
  const [emailOn, setEmailOn] = useState(true);
  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:22, fontWeight:800, letterSpacing:'-0.02em'}}>알림 및 정책 설정</div>
        <div style={{fontSize:13, color:'#8a8a8a', marginTop:4}}>최종 실패 알림 채널과 게시 정책 기준을 관리합니다.</div>
      </div>
      <div className="panel" style={{padding:22, maxWidth:520}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 0', borderBottom:'1px solid var(--bone)'}}>
          <div><div style={{fontWeight:700, fontSize:13.5}}>슬랙 알림</div><div style={{fontSize:12, color:'#8a8a8a'}}>최종 실패 시 슬랙 채널로 알림 발송</div></div>
          <button className="btn btn-sm" style={{background: slackOn?'#0091ff':'#e8e8e8', color: slackOn?'#fff':'#646464'}} onClick={()=>{setSlackOn(!slackOn); push('슬랙 알림 설정을 변경했습니다');}}>{slackOn?'켜짐':'꺼짐'}</button>
        </div>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 0', borderBottom:'1px solid var(--bone)'}}>
          <div><div style={{fontWeight:700, fontSize:13.5}}>이메일 알림</div><div style={{fontSize:12, color:'#8a8a8a'}}>최종 실패 시 담당자 이메일로 알림 발송</div></div>
          <button className="btn btn-sm" style={{background: emailOn?'#0091ff':'#e8e8e8', color: emailOn?'#fff':'#646464'}} onClick={()=>{setEmailOn(!emailOn); push('이메일 알림 설정을 변경했습니다');}}>{emailOn?'켜짐':'꺼짐'}</button>
        </div>
        <div style={{padding:'14px 0 0'}}>
          <div style={{fontWeight:700, fontSize:13.5, marginBottom:8}}>이미지 비율 정책</div>
          <div className="chip-row">
            <div className="chip selected">4:5 세로형</div>
            <div className="chip selected">9:16 릴스형</div>
            <div className="chip">1:1 정방형</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── app shell ───────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const {toasts, push} = useToasts();

  useEffect(()=>{
    const handler = (e) => {
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
      if(e.key === 'Escape') setCmdkOpen(false);
    };
    window.addEventListener('keydown', handler);
    if(window.lucide) window.lucide.createIcons();
    return () => window.removeEventListener('keydown', handler);
  }, []);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const crumbLabel = [...NAV, ...NAV_SECONDARY].find(n=>n.id===screen)?.label || '대시보드';

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex'}}>
      <aside className="sidebar" data-sidebar style={{width:'264px'}}>
        <div className="sidebar-brand">
          <div className="brand-mark"><Icon name="instagram" size={15} color="#fff"/></div>
          <div>
            <div className="brand-name">오토포스트 스튜디오</div>
            <div className="brand-sub">운영 관제 워크스페이스</div>
          </div>
        </div>
        <div className="sidebar-cmdk-hint" onClick={()=>setCmdkOpen(true)} style={{cursor:'pointer'}}>
          <span style={{display:'flex', alignItems:'center', gap:6}}><Icon name="search" size={13}/>빠른 검색</span>
          <span className="kbd">⌘ K</span>
        </div>
        <nav className="sidebar-nav">
          <a href="#" className={"sidebar-link "+(screen==='main'?'active':'')} onClick={(e)=>{e.preventDefault(); setScreen('main');}}>
            <span className="icon-wrap"><Icon name="layout-dashboard" size={16}/></span>게시 현황 실시간 대시보드
          </a>
          <a href="#" className={"sidebar-link "+(screen==='content'?'active':'')} onClick={(e)=>{e.preventDefault(); setScreen('content');}}>
            <span className="icon-wrap"><Icon name="upload-cloud" size={16}/></span>콘텐츠 등록 및 예약
          </a>
          <a href="#" className={"sidebar-link "+(screen==='accounts'?'active':'')} onClick={(e)=>{e.preventDefault(); setScreen('accounts');}}>
            <span className="icon-wrap"><Icon name="link-2" size={16}/></span>인스타그램 멀티계정 연동
          </a>
          <a href="#" className={"sidebar-link "+(screen==='scheduler'?'active':'')} onClick={(e)=>{e.preventDefault(); setScreen('scheduler');}}>
            <span className="icon-wrap"><Icon name="calendar-clock" size={16}/></span>반복 게시 스케줄러
          </a>
        </nav>
        <div className="sidebar-section">
          <div className="sidebar-section-title">운영</div>
          <a href="#" className={"sidebar-link "+(screen==='settings'?'active':'')} onClick={(e)=>{e.preventDefault(); setScreen('settings');}}>
            <span className="icon-wrap"><Icon name="settings-2" size={16}/></span>알림 및 정책 설정
          </a>
        </div>
        <div className="sidebar-user">
          <div className="avatar">민</div>
          <div>
            <div style={{fontSize:12.5, fontWeight:700}}>김민서 운영자</div>
            <div style={{fontSize:11, color:'#8a8a8a'}}>콘텐츠 운영팀</div>
          </div>
        </div>
      </aside>

      <main className="main-wrap">
        <header className="topbar">
          <div className="breadcrumb">
            <span>워크스페이스</span><span className="divider">/</span><b>{crumbLabel}</b>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><Icon name="command" size={13}/>명령 팔레트<span className="kbd">⌘K</span></button>
            <button className="btn btn-primary btn-sm" onClick={()=>setScreen('content')}><Icon name="plus" size={13}/>새 콘텐츠</button>
          </div>
        </header>

        <div className="content">
          {screen==='main' && <Dashboard push={push} openDetail={setDetail} />}
          {screen==='content' && <ContentScreen push={push} />}
          {screen==='accounts' && <AccountsScreen push={push} />}
          {screen==='scheduler' && <SchedulerScreen push={push} />}
          {screen==='settings' && <SettingsScreen push={push} />}
        </div>
      </main>

      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNavigate={setScreen} push={push} />

      {detail && (
        <Modal title="게시 상세" onClose={()=>setDetail(null)} footer={
          <React.Fragment>
            <button className="btn btn-ghost btn-sm" onClick={()=>setDetail(null)}>닫기</button>
            {detail.status==='실패' && <button className="btn btn-primary btn-sm" onClick={()=>{push(detail.account+' 게시를 재시도했습니다'); setDetail(null);}}><Icon name="refresh-ccw" size={13}/>재시도</button>}
          </React.Fragment>
        }>
          <div style={{display:'flex', gap:8, marginBottom:14}}>
            <span className={"badge badge-"+statusColor(detail.status)}>{detail.status}</span>
            <span className="type-tag">{detail.type}</span>
          </div>
          <div style={{fontSize:13, lineHeight:1.9}}>
            <div><b>계정</b> — {detail.account}</div>
            <div><b>예정 시각</b> — {detail.time}</div>
            {detail.reason && <div><b>실패 사유</b> — {detail.reason}</div>}
          </div>
          <div className="caption-preview" style={{marginTop:14}}>{detail.caption}</div>
        </Modal>
      )}

      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
