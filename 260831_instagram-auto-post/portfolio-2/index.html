<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소셜 콘텐츠 운영 확장 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --void:#040506; --ink:#07080a; --recessed:#111214; --graphite:#1b1c1e;
    --smoke:#6a6b6c; --ash:#9c9c9d; --mist:#e6e6e6; --iron:#454647; --border:#363739;
    --white:#ffffff; --coral:#ff6363; --ember:#452324; --blue:#63a1ff; --green:#59d499;
    --radius-btn:8px; --radius-card:18px; --radius-pill:9999px;
    --key-shadow: rgba(255,255,255,.05) 0 1px 0 0 inset, rgba(255,255,255,.16) 0 0 0 1px, rgba(0,0,0,.3) 0 -1px 0 0 inset;
    --sidebar-w:0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%; margin:0; padding:0; background:var(--void);}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--white); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeInScale{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  @keyframes feedIn{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulseCoral{ 0%,100%{box-shadow:0 0 0 0 rgba(255,99,99,.5);} 50%{box-shadow:0 0 0 7px rgba(255,99,99,0);} }
  @keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  @keyframes glowPulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  .hero-atmosphere{
    position:absolute; inset:0; height:340px; overflow:hidden; pointer-events:none; z-index:0;
  }
  .hero-blob{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:.5;
  }
  .hero-blob.coral{ width:460px; height:460px; background:radial-gradient(circle at 35% 35%, rgba(255,99,99,.85), rgba(255,99,99,.15) 55%, transparent 72%); top:-190px; left:6%; animation:glowPulse 6s ease-in-out infinite; }
  .hero-blob.blue{ width:500px; height:500px; background:radial-gradient(circle at 65% 30%, rgba(99,161,255,.6), rgba(2,25,59,.2) 55%, transparent 70%); top:-230px; right:2%; animation:glowPulse 7s ease-in-out infinite 1s; }

  .topnav{
    position:sticky; top:0; z-index:40; display:flex; justify-content:center; padding:16px 24px 0;
  }
  .topnav-pill{
    width:100%; max-width:1180px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(7,8,10,.75); backdrop-filter:blur(20px); border:1px solid var(--border);
    border-radius:var(--radius-pill); padding:9px 10px 9px 18px;
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px;}
  .brand-mark{
    width:24px; height:24px; border-radius:7px; background:var(--coral); display:flex; align-items:center;
    justify-content:center; color:#fff; flex-shrink:0;
  }
  .topnav-links{display:flex; align-items:center; gap:4px;}
  .nav-link{
    background:none; border:none; color:var(--ash); font-size:13px; font-weight:500; padding:8px 14px;
    border-radius:var(--radius-pill); transition:background .15s ease, color .15s ease;
  }
  .nav-link:hover{color:var(--white);}
  .nav-link.active{background:var(--graphite); color:var(--white);}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-btn); font-weight:500;
    font-size:13px; padding:9px 15px; border:1px solid transparent; transition:transform .12s ease, opacity .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-fill{background:var(--mist); color:var(--iron); font-weight:600;}
  .btn-fill:hover{opacity:.9;}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--white);}
  .btn-ghost:hover{background:var(--graphite);}
  .btn-sm{padding:6px 12px; font-size:12px;}
  .btn-coral{background:var(--ember); color:var(--coral); border-color:rgba(255,99,99,.3);}

  .page{max-width:1180px; margin:0 auto; padding:28px 24px 70px; position:relative; z-index:1;}
  .page-head{margin-bottom:22px; animation:fadeIn .35s ease both;}
  .page-title{font-size:36px; font-weight:500; letter-spacing:0.01em; line-height:1.15;}
  .page-sub{font-size:13px; color:var(--ash); margin-top:5px;}

  /* feed-stream composition */
  .feed-layout{display:flex; justify-content:center; gap:24px; align-items:flex-start;}
  .feed-main{flex:1; max-width:600px; min-width:0;}
  .composer{
    position:sticky; top:78px; z-index:5; background:var(--ink); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:14px 16px; margin-bottom:18px; box-shadow:var(--key-shadow);
  }
  .composer-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .filter-chip{
    padding:6px 13px; border-radius:var(--radius-pill); border:1px solid var(--border); font-size:12px;
    font-weight:500; color:var(--ash); background:var(--recessed); transition:all .15s ease;
  }
  .filter-chip.active{background:var(--coral); color:#fff; border-color:var(--coral);}

  .feed-item{
    background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px;
    margin-bottom:14px; animation:feedIn .35s ease both; box-shadow:var(--key-shadow);
    transition:border-color .18s ease;
  }
  .feed-item:hover{border-color:#4a4c4e;}
  .feed-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .author-avatar{
    width:34px; height:34px; border-radius:99999px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; flex-shrink:0; color:#fff;
  }
  .author{font-size:13.5px; font-weight:600;}
  .feed-time{font-size:11.5px; color:var(--smoke);}
  .feed-event-icon{
    width:30px; height:30px; border-radius:99999px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .feed-body{font-size:13px; color:#d6d6d7; line-height:1.7; margin:10px 0;}
  .action-row{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}

  .side-stats{width:300px; flex-shrink:0; display:flex; flex-direction:column; gap:16px; position:sticky; top:78px;}
  .stat-card{
    background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px;
    box-shadow:var(--key-shadow);
  }
  .stat-card-title{font-size:12.5px; font-weight:600; color:var(--ash); margin-bottom:14px; text-transform:uppercase; letter-spacing:.04em;}
  .stat-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .stat-line:last-child{border-bottom:none;}
  .stat-num{font-weight:700; font-size:14px;}
  .bar-row{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .bar-label{font-size:11px; color:var(--ash); width:56px; flex-shrink:0;}
  .bar-track{flex:1; height:6px; background:var(--recessed); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px; transform-origin:left; animation:barGrow 1s ease both;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px;
    border-radius:var(--radius-pill);
  }
  .badge-green{background:rgba(89,212,153,.14); color:var(--green);}
  .badge-coral{background:var(--ember); color:var(--coral);}
  .badge-blue{background:rgba(99,161,255,.14); color:var(--blue);}
  .badge-gray{background:var(--graphite); color:var(--ash);}

  /* RBAC screen */
  .matrix{border:1px solid var(--border); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--key-shadow);}
  table.dark{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.dark th{
    text-align:left; padding:13px 16px; color:var(--ash); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.04em; background:var(--recessed); border-bottom:1px solid var(--border);
  }
  table.dark td{padding:13px 16px; border-bottom:1px solid var(--border);}
  table.dark tr:last-child td{border-bottom:none;}
  table.dark tr:hover td{background:rgba(255,255,255,.02);}
  .role-card-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .role-card{
    background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px;
    text-align:center; box-shadow:var(--key-shadow); transition:transform .15s ease;
  }
  .role-card:hover{transform:translateY(-2px);}
  .role-icon{
    width:40px; height:40px; border-radius:99999px; background:var(--recessed); display:flex; align-items:center;
    justify-content:center; margin:0 auto 10px; font-size:18px; color:var(--coral);
  }
  .toggle-switch{
    width:36px; height:20px; border-radius:99999px; position:relative; transition:background .18s ease; border:none;
  }
  .toggle-switch::after{
    content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; transition:transform .18s ease;
  }
  .toggle-switch.on{background:var(--coral);}
  .toggle-switch.on::after{transform:translateX(16px);}
  .toggle-switch.off{background:var(--graphite);}

  /* templates screen */
  .slot-editor{display:flex; flex-direction:column; gap:12px;}
  .slot-row{
    display:flex; align-items:center; gap:12px; background:var(--ink); border:1px solid var(--border);
    border-radius:14px; padding:12px 14px; box-shadow:var(--key-shadow);
  }
  .slot-num{
    width:26px; height:26px; border-radius:99999px; background:var(--recessed); color:var(--coral); font-size:11px;
    font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .slot-input{
    flex:1; background:var(--recessed); border:1px solid var(--border); border-radius:var(--radius-btn);
    padding:9px 12px; color:#fff; font-size:12.5px; outline:none;
  }
  .slot-input:focus{border-color:var(--coral);}
  .hashtag-chip{
    padding:6px 12px; border-radius:var(--radius-pill); background:var(--recessed); border:1px solid var(--border);
    font-size:12px; color:var(--ash); display:inline-flex; align-items:center; gap:6px;
  }
  .policy-card{
    background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; box-shadow:var(--key-shadow);
  }

  /* channels screen */
  .channel-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .channel-card{
    background:var(--ink); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px;
    box-shadow:var(--key-shadow);
  }
  .channel-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .channel-icon{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:18px; margin-bottom:10px;
  }

  .field-label{font-size:12px; font-weight:600; color:var(--ash); margin-bottom:7px; display:block;}
  input[type=text].dark-input, textarea.dark-input{
    width:100%; background:var(--recessed); border:1px solid var(--border); border-radius:var(--radius-btn);
    padding:10px 12px; color:#fff; font-size:12.5px; outline:none;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px; animation:fadeIn .18s ease both;
  }
  .modal{
    background:var(--ink); border:1px solid var(--border); border-radius:20px; width:100%; max-width:520px;
    max-height:85vh; overflow-y:auto; box-shadow:0 30px 70px rgba(0,0,0,.5); animation:fadeInScale .2s ease both;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--border);}
  .modal-body{padding:22px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 22px; border-top:1px solid var(--border);}

  .toast-wrap{position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--recessed); border:1px solid var(--border); color:#fff; padding:13px 18px; border-radius:12px;
    font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; box-shadow:0 16px 32px rgba(0,0,0,.4);
    animation:toastIn .25s ease both;
  }
</style>
</head>
<body data-archetype="feed-timeline">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

/* ───────── mock data ───────── */
const EVENTS = [
  {id:'e1', kind:'complete', account:'메인 공식 계정', avatarBg:'#0091ff', time:'3분 전', body:'카드뉴스 게시가 완료되었습니다. "가을 신상 컬렉션을 미리 만나보세요" — 4개 슬라이드, 예정 시각 준수.'},
  {id:'e2', kind:'fail', account:'스타일노트 JP', avatarBg:'#ff6363', time:'12분 전', body:'토큰 만료로 릴스 게시가 실패했습니다. 3회 재시도 후 실패 큐로 이관되었습니다.'},
  {id:'e3', kind:'notify', account:'시스템 알림', avatarBg:'#6a6b6c', time:'28분 전', body:'API 호출 한도가 70%를 초과한 계정이 2개 감지되었습니다. 슬랙 채널로 알림을 발송했습니다.'},
  {id:'e4', kind:'complete', account:'트렌드리포트', avatarBg:'#0091ff', time:'41분 전', body:'릴스 게시가 완료되었습니다. "이번 주 인기 콘텐츠 TOP 5" — 캡션 템플릿 자동 적용됨.'},
  {id:'e5', kind:'fail', account:'커뮤니티라운지', avatarBg:'#ff6363', time:'52분 전', body:'이미지 비율 정책(4:5) 위반으로 게시가 보류되었습니다. 담당자 확인이 필요합니다.'},
  {id:'e6', kind:'notify', account:'시스템 알림', avatarBg:'#6a6b6c', time:'1시간 전', body:'브런치스토리 계정의 액세스 토큰이 3일 후 만료됩니다. 재인증을 권장합니다.'},
  {id:'e7', kind:'complete', account:'굿모닝콘텐츠', avatarBg:'#0091ff', time:'2시간 전', body:'반복 게시 규칙 "평일 아침 카드뉴스"에 따라 6개 계정에 동시 게시가 완료되었습니다.'},
];

const ROLES = ['콘텐츠 담당자','채널 관리자','내부 팀원','시스템 관리자'];
const ROLE_ICONS = {'콘텐츠 담당자':'ph-pencil-simple-line','채널 관리자':'ph-broadcast','내부 팀원':'ph-eye','시스템 관리자':'ph-shield-star'};
const PERMISSIONS = [
  {name:'콘텐츠 등록 및 예약', grants:[true,true,false,true]},
  {name:'게시 스케줄러 설정', grants:[false,true,false,true]},
  {name:'계정 연동 및 토큰 관리', grants:[false,true,false,true]},
  {name:'캡션 템플릿·정책 편집', grants:[true,true,false,true]},
  {name:'사용자 권한 관리', grants:[false,false,false,true]},
  {name:'오류 로그 열람', grants:[false,true,true,true]},
];

const HASHTAGS = ['#가을신상','#신상컬렉션','#한정수량','#오늘의추천','#일상기록','#브랜드스토리'];
const POLICIES = [
  {name:'이미지 비율 검증 (4:5 / 9:16)', desc:'업로드 즉시 비율을 확인하고 정책 위반 시 경고', on:true},
  {name:'용량·포맷 사전 경고', desc:'100MB 초과 또는 미지원 포맷 업로드 시 차단', on:true},
  {name:'API 호출 한도 관리', desc:'계정별 호출량이 80%를 초과하면 게시를 대기열로 전환', on:true},
];

const CHANNELS = [
  {id:'c1', name:'공식 홈페이지 (아임웹)', icon:'ph-globe', color:'#63a1ff', on:true, mapped:12, desc:'게시 완료 건을 카테고리별로 자동 업로드'},
  {id:'c2', name:'파트너 매거진 연동', icon:'ph-newspaper', color:'#59d499', on:false, mapped:0, desc:'외부 매거진 채널로 콘텐츠 확장 발행'},
  {id:'c3', name:'사내 아카이브 시스템', icon:'ph-archive', color:'#ff6363', on:true, mapped:34, desc:'모든 게시물을 사내 보관용 저장소에 백업'},
];

function Icon({name, size=15, color, className}){
  return <i className={"ph "+name+(className?(' '+className):'')} style={{fontSize:size, color, lineHeight:1}}></i>;
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, icon='ph-check-circle') => {
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2800);
  };
  return {toasts, push};
}
function ToastStack({toasts}){
  return <div className="toast-wrap">{toasts.map(t=>(
    <div className="toast" key={t.id}><Icon name={t.icon} size={16} color="#59d499"/>{t.msg}</div>
  ))}</div>;
}

function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div style={{fontWeight:600, fontSize:15}}>{title}</div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><Icon name="ph-x" size={14}/></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function eventVisual(kind){
  if(kind==='complete') return {bg:'rgba(89,212,153,.14)', color:'#59d499', icon:'ph-check-bold'};
  if(kind==='fail') return {bg:'var(--ember)', color:'#ff6363', icon:'ph-warning-bold'};
  return {bg:'rgba(99,161,255,.14)', color:'#63a1ff', icon:'ph-bell-simple-ringing'};
}

/* ───────── main feed screen ───────── */
function FeedScreen({push, openDetail}){
  const [filter, setFilter] = useState('전체');
  const filters = ['전체','게시 완료','실패','알림'];
  const kindMap = {'게시 완료':'complete','실패':'fail','알림':'notify'};
  const shown = filter==='전체' ? EVENTS : EVENTS.filter(e=>e.kind===kindMap[filter]);

  return (
    <div className="page-head">
      <div className="page-title">통합 운영 피드 및 알림 센터</div>
      <div className="page-sub">게시 완료·실패·알림 이벤트를 시간순 피드로 모아보고, 필터로 계정·채널별 활동을 좁혀볼 수 있습니다.</div>

      <div className="feed-layout" style={{marginTop:22}}>
        <div className="feed-main">
          <div className="composer">
            <div className="composer-row">
              <Icon name="ph-funnel" size={14} color="#9c9c9d"/>
              {filters.map(f => (
                <button key={f} className={"filter-chip "+(filter===f?'active':'')} onClick={()=>setFilter(f)}>{f}</button>
              ))}
              <div style={{flex:1}}></div>
              <button className="btn btn-ghost btn-sm" onClick={()=>push('피드를 새로고침했습니다')}><Icon name="ph-arrows-clockwise" size={13}/>새로고침</button>
            </div>
          </div>

          {shown.map(ev => {
            const v = eventVisual(ev.kind);
            return (
              <article className="feed-item post" key={ev.id}>
                <header className="feed-head">
                  <div className="author-avatar" style={{background:ev.avatarBg}}>{ev.account[0]}</div>
                  <div style={{flex:1}}>
                    <div className="author">{ev.account}</div>
                    <time className="feed-time">{ev.time}</time>
                  </div>
                  <div className="feed-event-icon" style={{background:v.bg}}><Icon name={v.icon} size={14} color={v.color}/></div>
                </header>
                <div className="feed-body post-body">{ev.body}</div>
                <footer className="post-actions action-row">
                  <button className="btn btn-ghost btn-sm" onClick={()=>openDetail(ev)}><Icon name="ph-magnifying-glass" size={13}/>상세보기</button>
                  {ev.kind==='fail' && <button className="btn btn-coral btn-sm" onClick={()=>push(ev.account+' 게시를 재시도 큐에 등록했습니다')}><Icon name="ph-arrow-clockwise" size={13}/>재시도</button>}
                  {ev.kind==='notify' && <button className="btn btn-ghost btn-sm" onClick={()=>push('알림을 확인 처리했습니다')}><Icon name="ph-check" size={13}/>확인</button>}
                </footer>
              </article>
            );
          })}
        </div>

        <aside className="side-stats">
          <div className="stat-card">
            <div className="stat-card-title">채널별 요약</div>
            <div className="stat-line"><span>게시 완료</span><span className="stat-num" style={{color:'#59d499'}}>42건</span></div>
            <div className="stat-line"><span>실패</span><span className="stat-num" style={{color:'#ff6363'}}>2건</span></div>
            <div className="stat-line"><span>대기 알림</span><span className="stat-num" style={{color:'#63a1ff'}}>3건</span></div>
          </div>
          <div className="stat-card">
            <div className="stat-card-title">계정별 API 사용량</div>
            <div className="bar-row"><div className="bar-label">메인</div><div className="bar-track"><div className="bar-fill" style={{width:'38%', background:'#63a1ff'}}></div></div></div>
            <div className="bar-row"><div className="bar-label">저팬</div><div className="bar-track"><div className="bar-fill" style={{width:'52%', background:'#63a1ff'}}></div></div></div>
            <div className="bar-row"><div className="bar-label">브런치</div><div className="bar-track"><div className="bar-fill" style={{width:'81%', background:'#ff6363'}}></div></div></div>
          </div>
          <div className="stat-card">
            <div className="stat-card-title">알림 채널</div>
            <div style={{display:'flex', gap:8}}>
              <span className="badge badge-green"><Icon name="ph-slack-logo" size={12}/>슬랙 연결됨</span>
              <span className="badge badge-blue"><Icon name="ph-envelope-simple" size={12}/>이메일 연결됨</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ───────── RBAC screen ───────── */
function RolesScreen({push}){
  const [grid, setGrid] = useState(PERMISSIONS);
  const toggle = (pIdx, rIdx) => {
    setGrid(g => g.map((row,i) => i===pIdx ? {...row, grants: row.grants.map((v,j)=> j===rIdx ? !v : v)} : row));
    push('권한 설정을 변경했습니다');
  };

  return (
    <div className="page-head">
      <div className="page-title">역할 기반 접근 제어(RBAC)</div>
      <div className="page-sub">콘텐츠 담당자·채널 관리자·내부 팀원·시스템 관리자 4단계 권한을 화면·API 단위로 분리합니다.</div>

      <div className="role-card-grid" style={{marginTop:22}}>
        {ROLES.map(r => (
          <div className="role-card" key={r}>
            <div className="role-icon"><Icon name={ROLE_ICONS[r]} size={18}/></div>
            <div style={{fontSize:13, fontWeight:600}}>{r}</div>
            <div style={{fontSize:11, color:'var(--ash)', marginTop:4}}>{r==='시스템 관리자' ? '전체 권한' : '지정 권한만'}</div>
          </div>
        ))}
      </div>

      <div className="matrix">
        <table className="dark">
          <thead>
            <tr>
              <th>권한 항목</th>
              {ROLES.map(r => <th key={r} style={{textAlign:'center'}}>{r}</th>)}
            </tr>
          </thead>
          <tbody>
            {grid.map((row, pIdx) => (
              <tr key={row.name}>
                <td style={{fontWeight:500}}>{row.name}</td>
                {row.grants.map((g, rIdx) => (
                  <td key={rIdx} style={{textAlign:'center'}}>
                    <button className={"toggle-switch "+(g?'on':'off')} onClick={()=>toggle(pIdx, rIdx)}></button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11.5, color:'var(--smoke)', marginTop:12}}>
        라우트·API·UI 요소 3중 권한 검증으로 역할별 접근 범위를 제한합니다. 권한 없는 URL 직접 접근 시 접근 거부 화면으로 안내됩니다.
      </div>
    </div>
  );
}

/* ───────── templates + policy screen ───────── */
function TemplatesScreen({push}){
  const [slots, setSlots] = useState({
    hook: '가을 신상, 지금 바로 확인하세요',
    body: '이번 시즌 새롭게 준비한 컬렉션을 소개합니다.',
    ask: '어떤 스타일이 가장 마음에 드시나요?',
    source: 'ⓒ 스튜디오 콘텐츠팀',
  });
  const [tags, setTags] = useState(HASHTAGS);
  const [policies, setPolicies] = useState(POLICIES);
  const [newTag, setNewTag] = useState('');

  const updateSlot = (k, v) => setSlots(s => ({...s, [k]: v}));
  const removeTag = (t) => setTags(ts => ts.filter(x=>x!==t));
  const addTag = () => {
    if(!newTag.trim()) return;
    setTags(ts => [...ts, newTag.startsWith('#')?newTag:'#'+newTag]);
    setNewTag('');
    push('해시태그를 세트에 추가했습니다');
  };
  const togglePolicy = (i) => {
    setPolicies(ps => ps.map((p,idx)=> idx===i ? {...p, on:!p.on} : p));
    push('정책 설정을 변경했습니다');
  };

  return (
    <div className="page-head">
      <div className="page-title">캡션 템플릿 및 정책 검증 엔진</div>
      <div className="page-sub">훅-본문-되묻기-출처-해시태그 구조의 브랜딩 캡션 템플릿을 자동 적용하고 게시 정책을 검증합니다.</div>

      <div style={{display:'grid', gridTemplateColumns:'1.1fr .9fr', gap:22, marginTop:22}}>
        <div>
          <div className="stat-card-title" style={{marginBottom:12}}>캡션 슬롯 편집기</div>
          <div className="slot-editor">
            <div className="slot-row"><div className="slot-num">1</div><input className="slot-input" value={slots.hook} onChange={e=>updateSlot('hook', e.target.value)} placeholder="훅" /></div>
            <div className="slot-row"><div className="slot-num">2</div><input className="slot-input" value={slots.body} onChange={e=>updateSlot('body', e.target.value)} placeholder="본문" /></div>
            <div className="slot-row"><div className="slot-num">3</div><input className="slot-input" value={slots.ask} onChange={e=>updateSlot('ask', e.target.value)} placeholder="되묻기" /></div>
            <div className="slot-row"><div className="slot-num">4</div><input className="slot-input" value={slots.source} onChange={e=>updateSlot('source', e.target.value)} placeholder="출처" /></div>
            <div className="slot-row"><div className="slot-num">5</div><div className="slot-input" style={{display:'flex', flexWrap:'wrap', gap:6}}>{tags.map(t=><span key={t} style={{color:'var(--coral)'}}>{t}</span>)}</div></div>
          </div>
          <button className="btn btn-fill" style={{marginTop:14}} onClick={()=>push('캡션 템플릿을 저장했습니다')}><Icon name="ph-floppy-disk" size={14}/>템플릿 저장</button>
        </div>

        <div>
          <div className="stat-card-title" style={{marginBottom:12}}>해시태그 세트</div>
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:12}}>
            {tags.map(t => (
              <span className="hashtag-chip" key={t}>{t}<span onClick={()=>removeTag(t)} style={{cursor:'pointer', color:'var(--smoke)'}}>✕</span></span>
            ))}
          </div>
          <div style={{display:'flex', gap:8, marginBottom:24}}>
            <input className="dark-input" placeholder="새 해시태그 추가" value={newTag} onChange={e=>setNewTag(e.target.value)} />
            <button className="btn btn-ghost btn-sm" onClick={addTag}><Icon name="ph-plus" size={13}/>추가</button>
          </div>

          <div className="stat-card-title" style={{marginBottom:12}}>정책 검증 규칙</div>
          {policies.map((p, i) => (
            <div className="policy-card" key={p.name}>
              <div>
                <div style={{fontSize:12.5, fontWeight:600}}>{p.name}</div>
                <div style={{fontSize:11, color:'var(--ash)', marginTop:3}}>{p.desc}</div>
              </div>
              <button className={"toggle-switch "+(p.on?'on':'off')} onClick={()=>togglePolicy(i)}></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ───────── channels screen ───────── */
function ChannelsScreen({push}){
  const [channels, setChannels] = useState(CHANNELS);
  const [mapModal, setMapModal] = useState(null);

  const toggleChannel = (id) => {
    setChannels(cs => cs.map(c => c.id===id ? {...c, on:!c.on} : c));
    push('채널 연동 상태를 변경했습니다');
  };

  return (
    <div className="page-head">
      <div className="page-title">외부 채널 발행 확장 연동</div>
      <div className="page-sub">게시 완료 콘텐츠를 외부 홈페이지·CMS 채널로 확장 발행할 수 있는 연동 어댑터 설정 화면입니다.</div>

      <div className="channel-grid" style={{marginTop:22}}>
        {channels.map(c => (
          <div className="channel-card" key={c.id}>
            <div className="channel-head">
              <div className="channel-icon" style={{background:'rgba(255,255,255,.06)'}}><Icon name={c.icon} size={19} color={c.color}/></div>
              <button className={"toggle-switch "+(c.on?'on':'off')} onClick={()=>toggleChannel(c.id)}></button>
            </div>
            <div style={{fontSize:13.5, fontWeight:600, marginBottom:6}}>{c.name}</div>
            <div style={{fontSize:11.5, color:'var(--ash)', lineHeight:1.6, marginBottom:12}}>{c.desc}</div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <span className="badge badge-gray">카테고리 매핑 {c.mapped}건</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>setMapModal(c)}><Icon name="ph-flow-arrow" size={13}/>매핑 설정</button>
            </div>
          </div>
        ))}
      </div>

      <div style={{marginTop:24}}>
        <div className="stat-card-title" style={{marginBottom:12}}>발행 재시도 큐</div>
        <div className="policy-card">
          <div>
            <div style={{fontSize:12.5, fontWeight:600}}>파트너 매거진 연동 — 응답 지연</div>
            <div style={{fontSize:11, color:'var(--ash)', marginTop:3}}>외부 API 응답 실패로 재시도 큐에 등록되었습니다 · 8분 전</div>
          </div>
          <button className="btn btn-coral btn-sm" onClick={()=>push('외부 채널 발행을 재시도했습니다')}><Icon name="ph-arrow-clockwise" size={13}/>재시도</button>
        </div>
      </div>

      {mapModal && (
        <Modal title={mapModal.name + ' 카테고리 매핑'} onClose={()=>setMapModal(null)} footer={
          <React.Fragment>
            <button className="btn btn-ghost btn-sm" onClick={()=>setMapModal(null)}>닫기</button>
            <button className="btn btn-fill btn-sm" onClick={()=>{push('카테고리 매핑을 저장했습니다'); setMapModal(null);}}>저장</button>
          </React.Fragment>
        }>
          <div style={{fontSize:12.5, color:'var(--ash)', marginBottom:14}}>인스타그램 게시 카테고리를 외부 채널 분류 체계에 매핑합니다.</div>
          <div className="field-label">카드뉴스 → 매핑 카테고리</div>
          <input className="dark-input" defaultValue="라이프스타일" style={{marginBottom:14}} />
          <div className="field-label">릴스 → 매핑 카테고리</div>
          <input className="dark-input" defaultValue="숏폼 콘텐츠" />
        </Modal>
      )}
    </div>
  );
}

/* ───────── app shell ───────── */
const NAV = [
  {id:'main', label:'통합 운영 피드 및 알림 센터', icon:'ph-broadcast'},
  {id:'roles', label:'역할 기반 접근 제어(RBAC)', icon:'ph-shield-checkered'},
  {id:'templates', label:'캡션 템플릿 및 정책 검증 엔진', icon:'ph-text-aa'},
  {id:'channels', label:'외부 채널 발행 확장 연동', icon:'ph-flow-arrow'},
];

function App(){
  const [screen, setScreen] = useState('main');
  const [detail, setDetail] = useState(null);
  const {toasts, push} = useToasts();

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column', position:'relative'}} data-archetype="feed-timeline">
      <div className="hero-atmosphere">
        <div className="hero-blob coral"></div>
        <div className="hero-blob blue"></div>
      </div>

      <div className="topnav">
        <div className="topnav-pill">
          <div className="brand"><div className="brand-mark"><Icon name="ph-instagram-logo" size={13} color="#fff"/></div>오토포스트 확장 플랫폼</div>
          <div className="topnav-links">
            {NAV.map(n => (
              <button key={n.id} className={"nav-link "+(screen===n.id?'active':'')} onClick={()=>setScreen(n.id)}>{n.label}</button>
            ))}
          </div>
          <button className="btn btn-fill btn-sm" onClick={()=>push('운영자 계정으로 로그인되어 있습니다')}><Icon name="ph-user-circle" size={14}/>운영자</button>
        </div>
      </div>

      <div className="page">
        {screen==='main' && <FeedScreen push={push} openDetail={setDetail} />}
        {screen==='roles' && <RolesScreen push={push} />}
        {screen==='templates' && <TemplatesScreen push={push} />}
        {screen==='channels' && <ChannelsScreen push={push} />}
      </div>

      {detail && (
        <Modal title="이벤트 상세" onClose={()=>setDetail(null)} footer={
          <button className="btn btn-ghost btn-sm" onClick={()=>setDetail(null)}>닫기</button>
        }>
          <div style={{display:'flex', gap:8, marginBottom:14}}>
            <span className={"badge "+(detail.kind==='complete'?'badge-green':detail.kind==='fail'?'badge-coral':'badge-blue')}>
              {detail.kind==='complete'?'게시 완료':detail.kind==='fail'?'게시 실패':'시스템 알림'}
            </span>
          </div>
          <div style={{fontSize:13, lineHeight:1.9}}>
            <div><b>계정</b> — {detail.account}</div>
            <div><b>발생 시각</b> — {detail.time}</div>
          </div>
          <div style={{fontSize:12.5, color:'var(--ash)', lineHeight:1.7, marginTop:12, background:'var(--recessed)', border:'1px solid var(--border)', borderRadius:12, padding:14}}>{detail.body}</div>
        </Modal>
      )}

      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
