<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노바브릿지 CMS — 기업 브랜드 관리 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#000000; --ink-2:#181818; --muted:#6d6d6d; --ash:#9a9a9a; --pewter:#808080;
    --accent:#a02d25; --slate-pill:#636363; --border:#000000; --border-soft:#e2e2e2; --panel:#fbfbfb;
    --r-pill:75px;
    --fs-display: clamp(30px, 3.4vw, 46px);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif; color:var(--ink); background:var(--bg); width:100%; overflow-x:hidden;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  @keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  @keyframes gradientFlow{0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(160,45,37,0.35);} 70%{box-shadow:0 0 0 10px rgba(160,45,37,0);} 100%{box-shadow:0 0 0 0 rgba(160,45,37,0);}}
  @keyframes barGrow{from{transform:scaleX(0);} to{transform:scaleX(1);}}
  @keyframes toastIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

  .app-shell{display:flex; width:100%; min-height:100vh;}

  /* ---- sidebar ---- */
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:260px; background:var(--ink); color:#fff; display:flex; flex-direction:column; z-index:50; transition:transform .25s;}
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:26px 24px 20px; border-bottom:1px solid #262626;}
  .brand-gradbar{width:30px; height:30px; border-radius:0; background:linear-gradient(120deg, #a0e0ab, #ffac2e 50%, #a02d25); background-size:200% 200%; animation:gradientFlow 6s ease infinite;}
  .sidebar-brand h1{font-size:15px; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .sidebar-brand span{display:block; font-size:11px; color:#9a9a9a; margin-top:2px;}
  .sidebar-nav{flex:1; padding:20px 14px; display:flex; flex-direction:column; gap:4px;}
  .nav-item{display:flex; align-items:center; gap:12px; padding:13px 14px; border:none; background:transparent; color:#b5b5b5; font-size:14px; text-align:left; border-left:2px solid transparent; transition:all .15s;}
  .nav-item i{font-size:17px;}
  .nav-item:hover{color:#fff; background:#141414;}
  .nav-item.active{color:#fff; background:#161616; border-left-color:var(--accent);}
  .nav-item .badge-count{margin-left:auto; background:var(--accent); color:#fff; font-size:11px; padding:1px 7px; border-radius:var(--r-pill);}
  .sidebar-foot{padding:18px 24px; border-top:1px solid #262626; display:flex; align-items:center; gap:10px;}
  .avatar-mini{width:30px; height:30px; border-radius:50%; background:#2a2a2a; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; flex-shrink:0;}
  .sidebar-foot .who{font-size:12px; color:#c9c9c9; line-height:1.4;}
  .sidebar-foot .who b{display:block; color:#fff; font-size:13px;}

  /* ---- main ---- */
  .main-wrap{margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px); min-height:100vh; display:flex; flex-direction:column;}
  .topbar{height:66px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 32px; background:#fff; position:sticky; top:0; z-index:40;}
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .menu-toggle{display:none; background:none; border:none; font-size:20px;}
  .topbar-search{display:flex; align-items:center; gap:8px; border:1px solid var(--border-soft); padding:9px 14px; width:280px; max-width:40vw;}
  .topbar-search input{border:none; outline:none; font-family:inherit; font-size:13px; width:100%;}
  .topbar-right{display:flex; align-items:center; gap:18px;}
  .icon-btn{background:none; border:none; position:relative; font-size:19px; color:var(--ink);}
  .icon-btn .dot{position:absolute; top:-2px; right:-2px; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulseRing 2s infinite;}

  .view{padding:36px 40px; flex:1; animation:fadeInUp .45s ease;}
  .view-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;}
  .view-head h2{font-size:26px; margin:0 0 6px; letter-spacing:-0.01em;}
  .view-head p{margin:0; font-size:13px; color:var(--muted);}

  .btn{border:1px solid var(--ink); background:#fff; color:var(--ink); padding:10px 24px; border-radius:var(--r-pill); font-size:13px; display:inline-flex; align-items:center; gap:8px; transition:all .15s;}
  .btn:hover{background:var(--ink); color:#fff;}
  .btn-fill{background:var(--ink); color:#fff;}
  .btn-fill:hover{background:#2a2a2a;}
  .btn-accent{border-color:var(--accent); color:var(--accent);}
  .btn-accent:hover{background:var(--accent); color:#fff;}
  .btn-sm{padding:7px 16px; font-size:12px;}

  /* ---- master-detail ---- */
  .md-layout{display:grid; grid-template-columns:340px 1fr; gap:0; border:1px solid var(--border); min-height:520px;}
  .list-rail{border-right:1px solid var(--border); display:flex; flex-direction:column; max-height:640px; overflow-y:auto;}
  .list-rail .rail-search{padding:16px; border-bottom:1px solid var(--border-soft); display:flex; gap:8px;}
  .list-rail .rail-search input{border:1px solid var(--border-soft); outline:none; font-family:inherit; font-size:13px; padding:8px 10px; width:100%;}
  .rail-item{padding:16px; border-bottom:1px solid var(--border-soft); cursor:pointer; display:flex; flex-direction:column; gap:6px;}
  .rail-item:hover{background:var(--panel);}
  .rail-item.active{background:#f2f2f2; border-left:3px solid var(--accent); padding-left:13px;}
  .rail-item-top{display:flex; justify-content:space-between; align-items:center;}
  .rail-item-top strong{font-size:13.5px;}
  .rail-item p{margin:0; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .status-pill{font-size:10.5px; padding:3px 9px; border-radius:var(--r-pill); border:1px solid var(--border-soft); color:var(--muted);}
  .status-pill.wait{border-color:var(--accent); color:var(--accent);}
  .status-pill.check{border-color:var(--ink); color:var(--ink);}
  .status-pill.done{background:var(--ink); color:#fff; border-color:var(--ink);}

  .detail-panel{padding:32px; display:flex; flex-direction:column; gap:22px; overflow-y:auto; max-height:640px;}
  .detail-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--ash); gap:10px; font-size:13px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--border-soft); padding-bottom:18px;}
  .detail-head h3{margin:0 0 6px; font-size:19px;}
  .detail-head .meta{font-size:12px; color:var(--muted);}
  .field-block label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:6px;}
  .field-block .val{font-size:13.5px; line-height:1.7;}
  .status-row{display:flex; gap:8px; margin-top:6px;}
  .status-choice{border:1px solid var(--border-soft); padding:7px 14px; border-radius:var(--r-pill); font-size:12px; background:#fff;}
  .status-choice.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .reply-box{border:1px solid var(--border-soft); padding:14px; font-size:13px;}
  .timeline-note{display:flex; gap:10px; font-size:12px; color:var(--muted); align-items:flex-start;}
  .timeline-note .dot2{width:6px; height:6px; border-radius:50%; background:var(--ash); margin-top:5px; flex-shrink:0;}

  /* ---- dashboard ---- */
  .hello-line{font-size:clamp(30px, 3.4vw, 46px); font-weight:600; letter-spacing:-0.015em; margin:0 0 6px;}
  .dash-hero{position:relative; overflow:hidden; margin:-36px -40px 32px; padding:56px 40px 64px;
    background:linear-gradient(120deg, #a0e0ab, #ffac2e 45%, #a02d25); background-size:220% 220%; animation:gradientFlow 12s ease infinite; color:#fff;}
  .dash-hero::before{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.42));}
  .dash-hero .hello-line{color:#fff; position:relative;}
  .dash-hero .hello-sub{position:relative; color:rgba(255,255,255,0.82); font-size:13.5px; max-width:460px; line-height:1.6;}
  .dash-hero-wave{position:absolute; left:0; right:0; bottom:-1px; height:56px;}
  .channel-card:hover, .tree-node:hover, .rail-item:hover, .nav-item:hover{transform:scale(1.015); transition:transform .15s ease;}
  .stat-strip{display:flex; border:1px solid var(--border); margin-bottom:28px;}
  .stat-strip{position:relative;}
  .stat-strip::after{content:''; position:absolute; left:0; bottom:-1px; height:2px; width:100%; background:var(--accent); transform-origin:left; animation:barGrow .9s cubic-bezier(.2,.7,.3,1) both;}
  .stat-strip > div{flex:1; padding:18px 22px; border-right:1px solid var(--border-soft);}
  .stat-strip > div:last-child{border-right:none;}
  .stat-strip .num{font-size:26px; font-weight:600;}
  .stat-strip .lbl{font-size:12px; color:var(--muted); margin-top:4px;}
  .dash-grid{display:grid; grid-template-columns:340px 1fr; gap:0; border:1px solid var(--border);}
  .queue-item{padding:16px; border-bottom:1px solid var(--border-soft); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .queue-item:hover{background:var(--panel);}
  .queue-item.active{background:#f2f2f2; border-left:3px solid var(--accent); padding-left:13px;}
  .queue-item .qtitle{font-size:13px;}
  .queue-item .qtag{font-size:10.5px; color:var(--muted);}
  .chart-box{height:210px; position:relative; margin-top:6px;}

  /* ---- content editor ---- */
  .page-list{border-right:1px solid var(--border); width:100%;}
  .editor-toolbar{display:flex; gap:6px; padding:14px 0; border-bottom:1px solid var(--border-soft); margin-bottom:16px;}
  .editor-toolbar button{width:32px; height:32px; border:1px solid var(--border-soft); background:#fff; font-size:13px;}
  .editor-toolbar button:hover{background:var(--panel);}
  .editor-body{border:1px solid var(--border-soft); min-height:220px; padding:18px; font-size:14px; line-height:1.8; color:var(--ink-2);}
  .editor-body[contenteditable]:focus{outline:none; border-color:var(--ink);}
  .version-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); padding:10px 0; border-bottom:1px solid var(--border-soft);}

  /* ---- brand ---- */
  .brand-tree{padding:16px;}
  .tree-node{display:flex; align-items:center; justify-content:space-between; padding:10px 8px; font-size:13.5px; border-bottom:1px solid var(--border-soft); cursor:pointer;}
  .tree-node:hover{background:var(--panel);}
  .tree-node.active{color:var(--accent); font-weight:600;}
  .tree-sub{padding-left:24px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .channel-card{border:1px solid var(--border-soft); padding:18px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .channel-card .cname{display:flex; align-items:center; gap:12px; font-size:14px;}
  .channel-card .cic{width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;}
  .toggle{width:40px; height:22px; border-radius:var(--r-pill); background:#dcdcdc; position:relative; border:none; transition:background .2s;}
  .toggle.on{background:var(--ink);}
  .toggle .knob{width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:left .2s;}
  .toggle.on .knob{left:21px;}
  .queue-table{width:100%; border-collapse:collapse; margin-top:18px; font-size:12.5px;}
  .queue-table th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border);}
  .queue-table td{padding:10px; border-bottom:1px solid var(--border-soft);}

  /* ---- settings ---- */
  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-bottom:1px solid var(--border-soft); max-width:560px;}
  .settings-row .stitle{font-size:13.5px;}
  .settings-row .sdesc{font-size:12px; color:var(--muted); margin-top:3px;}

  .toast{position:fixed; bottom:28px; right:32px; background:var(--ink); color:#fff; padding:13px 22px; font-size:13px; display:flex; align-items:center; gap:10px; z-index:200; animation:toastIn .3s ease;}

  @media (max-width:960px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main-wrap{margin-left:0; width:100%;}
    .menu-toggle{display:block;}
    .md-layout, .dash-grid{grid-template-columns:1fr;}
    .list-rail, .page-list{max-height:260px;}
    .topbar-search{width:160px;}
  }
  @media (max-width:600px){
    .view{padding:24px 18px;}
    .stat-strip{flex-direction:column;}
    .stat-strip > div{border-right:none; border-bottom:1px solid var(--border-soft);}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const NAV = [
  {key:'main', label:'대시보드', icon:'ph-squares-four'},
  {key:'content', label:'콘텐츠 관리', icon:'ph-note-pencil'},
  {key:'inquiries', label:'문의 이력 관리', icon:'ph-chat-circle-text', badge:3},
  {key:'brand', label:'브랜드 & SNS 연동 관리', icon:'ph-share-network'},
  {key:'settings', label:'설정', icon:'ph-gear-six'},
];

const INQUIRIES = [
  {id:1, name:'김도윤', phone:'010-2231-9902', status:'wait', title:'브랜드 계약 관련 문의드립니다', body:'브랜드 서브메뉴 확장과 관련하여 계약 조건을 문의드립니다. 담당자 연결 부탁드립니다.', date:'2026.08.30'},
  {id:2, name:'이서연', phone:'010-4471-2210', status:'check', title:'광고 캠페인 협업 제안', body:'광고 모델 소개 페이지를 보고 협업을 제안드리고 싶습니다. 회신 부탁드립니다.', date:'2026.08.29'},
  {id:3, name:'박지훈', phone:'010-9902-3345', status:'done', title:'채용 관련 문의', body:'채용 공고 관련하여 문의드립니다. 답변 감사합니다.', date:'2026.08.27'},
  {id:4, name:'최유나', phone:'010-1188-7723', status:'wait', title:'언론 인터뷰 요청', body:'브랜드 스토리 관련 인터뷰를 요청드립니다.', date:'2026.08.25'},
  {id:5, name:'정민재', phone:'010-6623-0091', status:'wait', title:'입점 문의', body:'리빙 라인 브랜드 입점을 문의드립니다.', date:'2026.08.22'},
  {id:6, name:'한소율', phone:'010-3345-8812', status:'check', title:'행사 협찬 문의', body:'브랜드 리뉴얼 기념 이벤트 협찬을 문의드립니다.', date:'2026.08.19'},
];

const STATUS_LABEL = {wait:'대기', check:'확인', done:'답변완료'};

function StatusPill({status}){
  return <span className={"status-pill " + status}>{STATUS_LABEL[status]}</span>;
}

function Sidebar({view, setView, mobileOpen, setMobileOpen}){
  return (
    <aside className={"sidebar" + (mobileOpen ? " open" : "")}>
      <div className="sidebar-brand">
        <div className="brand-gradbar"></div>
        <div>
          <h1>노바브릿지 CMS</h1>
          <span>기업 브랜드 관리 플랫폼</span>
        </div>
      </div>
      <nav className="sidebar-nav">
        {NAV.map(n => (
          <button key={n.key} className={"nav-item" + (view===n.key ? " active" : "")}
            onClick={()=>{ setView(n.key); setMobileOpen(false); }}>
            <i className={"ph " + n.icon}></i>
            <span>{n.label}</span>
            {n.badge ? <span className="badge-count">{n.badge}</span> : null}
          </button>
        ))}
      </nav>
      <div className="sidebar-foot">
        <div className="avatar-mini">관</div>
        <div className="who"><b>관리자</b>admin@novabridge-demo.co.kr</div>
      </div>
    </aside>
  );
}

function Topbar({setMobileOpen, title}){
  const [notifOpen, setNotifOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  return (
    <header className="topbar" style={{position:'relative'}}>
      <div className="topbar-left">
        <button className="menu-toggle" onClick={()=>setMobileOpen(v=>!v)}><i className="ph ph-list"></i></button>
        <div className="topbar-search">
          <i className="ph ph-magnifying-glass"></i>
          <input placeholder="문의, 게시글, 브랜드 검색" />
        </div>
      </div>
      <div className="topbar-right">
        <button className="icon-btn" onClick={()=>{ setNotifOpen(v=>!v); setHelpOpen(false); }}><i className="ph ph-bell"></i><span className="dot"></span></button>
        <button className="icon-btn" onClick={()=>{ setHelpOpen(v=>!v); setNotifOpen(false); }}><i className="ph ph-question"></i></button>
        <div className="avatar-mini" style={{background:'#000'}}>관</div>
      </div>
      {notifOpen && (
        <div style={{position:'absolute', top:56, right:96, width:260, background:'#fff', border:'1px solid #000', padding:14, fontSize:12, zIndex:60}}>
          <strong style={{display:'block', marginBottom:8}}>최근 알림</strong>
          <div style={{marginBottom:8, color:'var(--muted)'}}>새 문의 3건이 접수되었습니다.</div>
          <div style={{color:'var(--muted)'}}>SNS 발송 1건이 재시도 대기 중입니다.</div>
        </div>
      )}
      {helpOpen && (
        <div style={{position:'absolute', top:56, right:52, width:220, background:'#fff', border:'1px solid #000', padding:14, fontSize:12, zIndex:60, color:'var(--muted)'}}>
          문의·콘텐츠·브랜드 메뉴 사용법은 유지보수 매뉴얼을 참고해 주세요.
        </div>
      )}
    </header>
  );
}

function DashboardView({goTo}){
  const chartRef = useRef(null);
  const [selected, setSelected] = useState(0);
  const queue = [
    {tag:'문의', title:'김도윤님 — 브랜드 계약 문의', desc:'접수 2026.08.30 · 대기중', link:'inquiries'},
    {tag:'공지', title:'2026년 하반기 개편 안내 초안', desc:'검토 필요 · 발행 대기', link:'content'},
    {tag:'SNS', title:'인스타그램 발송 재시도 필요', desc:'실패 1건 · 재처리 대기', link:'brand'},
  ];

  useEffect(()=>{
    const ctx = chartRef.current.getContext('2d');
    const chart = new Chart(ctx, {
      type:'line',
      data:{
        labels:['08.24','08.25','08.26','08.27','08.28','08.29','08.30'],
        datasets:[{
          data:[4,6,3,8,5,9,7],
          borderColor:'#000000',
          backgroundColor:'rgba(160,45,37,0.08)',
          borderWidth:2, tension:.35, fill:true, pointRadius:0,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{ x:{grid:{display:false}, ticks:{font:{size:10}}}, y:{grid:{color:'#f0f0f0'}, ticks:{font:{size:10}}} }
      }
    });
    return ()=>chart.destroy();
  },[]);

  return (
    <div className="view">
      <div className="dash-hero">
        <div className="hello-line">안녕하세요, 관리자님</div>
        <div className="hello-sub">오늘 처리가 필요한 항목을 우선순위로 정리했습니다. 문의·공지·SNS 발송 현황을 한 화면에서 확인할 수 있습니다.</div>
        <svg className="dash-hero-wave" viewBox="0 0 400 56" preserveAspectRatio="none">
          <path d="M0,28 C60,50 140,4 200,26 C260,48 340,6 400,26 L400,56 L0,56 Z" fill="#ffffff" opacity="0.9"></path>
        </svg>
      </div>

      <div className="stat-strip">
        <div><div className="num">3</div><div className="lbl">미처리 문의</div></div>
        <div><div className="num">1</div><div className="lbl">발행 대기 공지</div></div>
        <div><div className="num">1</div><div className="lbl">SNS 재시도 대기</div></div>
        <div><div className="num">2</div><div className="lbl">브랜드 하위메뉴</div></div>
      </div>

      <div className="dash-grid">
        <div className="list-rail" style={{maxHeight:'none'}}>
          {queue.map((q,i)=>(
            <div key={i} className={"queue-item" + (selected===i ? " active" : "")} onClick={()=>setSelected(i)}>
              <div>
                <div className="qtag">{q.tag}</div>
                <div className="qtitle">{q.title}</div>
              </div>
              <i className="ph ph-caret-right" style={{color:'var(--ash)'}}></i>
            </div>
          ))}
        </div>
        <div className="detail-panel" style={{maxHeight:'none'}}>
          <div className="detail-head">
            <div>
              <h3>{queue[selected].title}</h3>
              <div className="meta">{queue[selected].desc}</div>
            </div>
            <button className="btn btn-fill btn-sm" onClick={()=>goTo(queue[selected].link)}>바로가기</button>
          </div>
          <div className="field-block">
            <label>최근 7일 문의 접수 추이</label>
            <div className="chart-box"><canvas ref={chartRef}></canvas></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function InquiriesView(){
  const [list, setList] = useState(INQUIRIES);
  const [selectedId, setSelectedId] = useState(INQUIRIES[0].id);
  const [q, setQ] = useState('');
  const [toast, setToast] = useState('');

  const filtered = list.filter(i => i.name.includes(q) || i.title.includes(q));
  const sel = list.find(i => i.id === selectedId);

  function changeStatus(status){
    setList(list.map(i => i.id === selectedId ? {...i, status} : i));
    setToast('처리상태가 "' + STATUS_LABEL[status] + '"(으)로 변경되었습니다.');
    setTimeout(()=>setToast(''), 2400);
  }

  return (
    <div className="view">
      <div className="view-head">
        <div>
          <h2>문의 이력 관리</h2>
          <p>좌측 목록에서 문의를 선택하면 우측에 상세 내용과 처리 상태 변경 화면이 나타납니다.</p>
        </div>
      </div>
      <div className="md-layout">
        <div className="list-rail">
          <div className="rail-search">
            <input placeholder="이름 또는 제목 검색" value={q} onChange={e=>setQ(e.target.value)} />
          </div>
          {filtered.map(item=>(
            <div key={item.id} className={"rail-item" + (selectedId===item.id ? " active" : "")} onClick={()=>setSelectedId(item.id)}>
              <div className="rail-item-top"><strong>{item.name}</strong><StatusPill status={item.status} /></div>
              <p>{item.title}</p>
            </div>
          ))}
          {filtered.length===0 && <div style={{padding:20, fontSize:12, color:'var(--ash)'}}>검색 결과가 없습니다.</div>}
        </div>
        <div className="detail-panel">
          {sel ? (
            <React.Fragment>
              <div className="detail-head">
                <div>
                  <h3>{sel.title}</h3>
                  <div className="meta">{sel.name} · {sel.phone} · {sel.date}</div>
                </div>
                <StatusPill status={sel.status} />
              </div>
              <div className="field-block">
                <label>문의 내용</label>
                <div className="val">{sel.body}</div>
              </div>
              <div className="field-block">
                <label>처리상태 변경</label>
                <div className="status-row">
                  {Object.keys(STATUS_LABEL).map(s=>(
                    <button key={s} className={"status-choice" + (sel.status===s ? " active" : "")} onClick={()=>changeStatus(s)}>{STATUS_LABEL[s]}</button>
                  ))}
                </div>
              </div>
              <div className="field-block">
                <label>답변 작성</label>
                <div className="reply-box" contentEditable suppressContentEditableWarning>답변 내용을 입력해 주세요.</div>
                <div style={{marginTop:10}}><button className="btn btn-fill btn-sm" onClick={()=>{ setToast('답변이 등록되었습니다.'); setTimeout(()=>setToast(''),2400); }}>답변 등록</button></div>
              </div>
              <div className="field-block">
                <label>처리 이력</label>
                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                  <div className="timeline-note"><span className="dot2"></span>문의가 접수되어 관리자 이메일로 자동 발송되었습니다.</div>
                  <div className="timeline-note"><span className="dot2"></span>담당자가 목록을 확인하였습니다.</div>
                </div>
              </div>
            </React.Fragment>
          ) : <div className="detail-empty"><i className="ph ph-tray" style={{fontSize:28}}></i>좌측 목록에서 문의를 선택해 주세요.</div>}
        </div>
      </div>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

const PAGES = [
  {id:'home', title:'회사소개 페이지', updated:'2026.08.29'},
  {id:'location', title:'오시는 길 페이지', updated:'2026.08.20'},
  {id:'contact', title:'문의하기 페이지', updated:'2026.08.11'},
  {id:'news', title:'뉴스·공지 목록 페이지', updated:'2026.08.05'},
];

function ContentView(){
  const [pageId, setPageId] = useState('home');
  const [body, setBody] = useState('노바브릿지는 심플하고 신뢰감 있는 브랜드 경험을 만듭니다. 이 영역은 관리자가 직접 수정할 수 있는 본문 영역입니다.');
  const [toast, setToast] = useState('');
  const [versions, setVersions] = useState([
    {v:'v3', time:'2026.08.29 14:02', current:true},
    {v:'v2', time:'2026.08.24 10:18', current:false},
    {v:'v1', time:'2026.08.10 09:40', current:false},
  ]);

  function saveDraft(){
    setVersions([{v:'v'+(versions.length+1), time:'방금 전', current:true}, ...versions.map(v=>({...v, current:false}))]);
    setToast('임시저장되었습니다. 공개 페이지에는 아직 반영되지 않았습니다.');
    setTimeout(()=>setToast(''), 2600);
  }
  function publish(){
    setToast('저장되었습니다. 공개 페이지에 즉시 반영됩니다.');
    setTimeout(()=>setToast(''), 2600);
  }
  function insertImage(){
    setBody(b => b + '\n\n[이미지: novabridge-content-' + pageId + '.jpg — S3 업로드 및 CDN URL 자동 삽입]');
  }

  const page = PAGES.find(p=>p.id===pageId);

  return (
    <div className="view">
      <div className="view-head">
        <div>
          <h2>콘텐츠 관리</h2>
          <p>비개발자도 코드 수정 없이 텍스트·이미지를 직접 편집할 수 있는 에디터입니다.</p>
        </div>
      </div>
      <div className="md-layout" style={{gridTemplateColumns:'260px 1fr'}}>
        <div className="page-list">
          {PAGES.map(p=>(
            <div key={p.id} className={"rail-item" + (pageId===p.id ? " active" : "")} onClick={()=>setPageId(p.id)}>
              <div className="rail-item-top"><strong>{p.title}</strong></div>
              <p>최종 수정 {p.updated}</p>
            </div>
          ))}
        </div>
        <div className="detail-panel">
          <div className="detail-head">
            <div><h3>{page.title}</h3><div className="meta">최종 수정 {page.updated}</div></div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn-sm" onClick={saveDraft}>임시저장</button>
              <button className="btn btn-fill btn-sm" onClick={publish}>저장 후 반영</button>
            </div>
          </div>
          <div className="editor-toolbar">
            <button onClick={()=>setBody(b=>b+' **강조**')}><i className="ph ph-text-b"></i></button>
            <button onClick={()=>setBody(b=>b+' _기울임_')}><i className="ph ph-text-italic"></i></button>
            <button onClick={()=>setBody(b=>b+'\n- 목록 항목')}><i className="ph ph-list-bullets"></i></button>
            <button onClick={insertImage}><i className="ph ph-image"></i></button>
            <button onClick={()=>setBody(b=>b+'\n[링크 삽입]')}><i className="ph ph-link"></i></button>
          </div>
          <div className="editor-body" contentEditable suppressContentEditableWarning onInput={e=>setBody(e.currentTarget.textContent)}>{body}</div>
          <div className="field-block" style={{marginTop:22}}>
            <label>버전 기록 (되돌리기 가능)</label>
            {versions.map((v,i)=>(
              <div className="version-row" key={i}>
                <span>{v.v} · {v.time}{v.current ? ' (현재)' : ''}</span>
                {!v.current && <button className="btn btn-sm" onClick={()=>{ setToast(v.v + ' 버전으로 되돌렸습니다.'); setTimeout(()=>setToast(''),2400); }}>되돌리기</button>}
              </div>
            ))}
          </div>
        </div>
      </div>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

const BRAND_TREE = {
  main: {label:'본사', sub:['브랜드 스토리','사업 개요','연혁']},
  line: {label:'리빙 라인', sub:['제품 카탈로그','입점 안내']},
  studio: {label:'스튜디오', sub:['포트폴리오','협업 문의']},
};

function BrandView(){
  const [branchId, setBranchId] = useState('main');
  const [channels, setChannels] = useState([
    {name:'인스타그램', icon:'ph-instagram-logo', on:true},
    {name:'페이스북', icon:'ph-facebook-logo', on:true},
    {name:'네이버 블로그', icon:'ph-notebook', on:false},
  ]);
  const [toast, setToast] = useState('');
  const queue = [
    {title:'2026년 하반기 개편 안내', channel:'인스타그램', status:'완료', time:'08.28 10:02'},
    {title:'브랜드 리뉴얼 이벤트', channel:'페이스북', status:'재시도 대기', time:'08.27 18:40'},
    {title:'고객센터 운영시간 변경', channel:'인스타그램', status:'완료', time:'08.20 09:15'},
  ];

  function toggleChannel(i){
    setChannels(channels.map((c,idx)=> idx===i ? {...c, on:!c.on} : c));
  }
  function retryQueue(){
    setToast('SNS 발송 재시도 요청이 큐에 등록되었습니다.');
    setTimeout(()=>setToast(''), 2600);
  }
  function addBranch(){
    setToast('새 브랜드 하위 메뉴가 생성되어 네비게이션에 반영됩니다.');
    setTimeout(()=>setToast(''), 2600);
  }

  const branch = BRAND_TREE[branchId];

  return (
    <div className="view">
      <div className="view-head">
        <div>
          <h2>브랜드 & SNS 연동 관리</h2>
          <p>브랜드 하위 메뉴 구조와 SNS 채널 게시 API 연동 상태를 함께 관리합니다.</p>
        </div>
        <button className="btn btn-accent btn-sm" onClick={addBranch}><i className="ph ph-plus"></i>브랜드 추가</button>
      </div>
      <div className="md-layout" style={{gridTemplateColumns:'260px 1fr'}}>
        <div className="brand-tree">
          {Object.keys(BRAND_TREE).map(key=>(
            <div key={key} className={"tree-node" + (branchId===key ? " active" : "")} onClick={()=>setBranchId(key)}>
              <span>{BRAND_TREE[key].label}</span>
              <i className="ph ph-caret-right"></i>
            </div>
          ))}
        </div>
        <div className="detail-panel">
          <div className="field-block">
            <label>{branch.label} — 하위 메뉴</label>
            <div className="tree-sub">
              {branch.sub.map((s,i)=><div key={i}><i className="ph ph-arrow-bend-down-right" style={{marginRight:6}}></i>{s}</div>)}
            </div>
          </div>

          <div className="field-block">
            <label>SNS 채널 연동 상태</label>
            {channels.map((c,i)=>(
              <div className="channel-card" key={i}>
                <div className="cname"><span className="cic"><i className={"ph " + c.icon}></i></span>{c.name}</div>
                <button className={"toggle" + (c.on ? " on" : "")} onClick={()=>toggleChannel(i)}><span className="knob"></span></button>
              </div>
            ))}
          </div>

          <div className="field-block">
            <label>공지 발행 요청 큐</label>
            <table className="queue-table">
              <thead><tr><th>제목</th><th>채널</th><th>상태</th><th>시각</th><th></th></tr></thead>
              <tbody>
                {queue.map((q,i)=>(
                  <tr key={i}>
                    <td>{q.title}</td><td>{q.channel}</td>
                    <td>{q.status==='완료' ? <StatusPill status="done" /> : <StatusPill status="wait" />}</td>
                    <td>{q.time}</td>
                    <td>{q.status!=='완료' && <button className="btn btn-sm" onClick={retryQueue}>재시도</button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

function SettingsView(){
  const [notify, setNotify] = useState(true);
  const [twofa, setTwofa] = useState(false);
  const [digest, setDigest] = useState(true);
  const [toast, setToast] = useState('');
  function save(){ setToast('설정이 저장되었습니다.'); setTimeout(()=>setToast(''),2400); }
  return (
    <div className="view">
      <div className="view-head"><div><h2>설정</h2><p>관리자 계정과 알림 정책을 관리합니다.</p></div></div>
      <div style={{maxWidth:600}}>
        <div className="settings-row">
          <div><div className="stitle">문의 접수 즉시 알림</div><div className="sdesc">새 문의가 접수되면 관리자 이메일로 즉시 발송합니다.</div></div>
          <button className={"toggle" + (notify ? " on" : "")} onClick={()=>setNotify(v=>!v)}><span className="knob"></span></button>
        </div>
        <div className="settings-row">
          <div><div className="stitle">관리자 2단계 인증</div><div className="sdesc">로그인 시 보안 코드 확인 절차를 추가합니다.</div></div>
          <button className={"toggle" + (twofa ? " on" : "")} onClick={()=>setTwofa(v=>!v)}><span className="knob"></span></button>
        </div>
        <div className="settings-row">
          <div><div className="stitle">주간 운영 요약 다이제스트</div><div className="sdesc">매주 월요일 문의·공지 처리 현황을 요약해 전송합니다.</div></div>
          <button className={"toggle" + (digest ? " on" : "")} onClick={()=>setDigest(v=>!v)}><span className="knob"></span></button>
        </div>
        <div style={{marginTop:24}}><button className="btn btn-fill" onClick={save}>변경사항 저장</button></div>
      </div>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [mobileOpen, setMobileOpen] = useState(false);

  return (
    <div className="app-shell" style={{width:'100%'}}>
      <Sidebar view={view} setView={setView} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="main-wrap">
        <Topbar setMobileOpen={setMobileOpen} />
        {view==='main' && <DashboardView goTo={setView} />}
        {view==='content' && <ContentView />}
        {view==='inquiries' && <InquiriesView />}
        {view==='brand' && <BrandView />}
        {view==='settings' && <SettingsView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
