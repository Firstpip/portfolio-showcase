<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>본인인증 기반 소개팅 매칭 서비스 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#d4c7ff;
    --secondary:#e3e3e2;
    --accent:#f6bc1e;
    --bg:#f2f0eb;
    --surface:#ffffff;
    --text:#292827;
    --text2:#666666;
    --wine:#421d24;
    --violet:#714cb6;
    --radius-card:16px;
    --radius-btn:16px;
    --radius-pill:999px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body,#root{width:100%;min-height:100vh;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:99px;}

  /* ===== keyframes ===== */
  @keyframes cardIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes heartPop{ 0%{transform:scale(1);} 35%{transform:scale(1.35);} 60%{transform:scale(0.92);} 100%{transform:scale(1);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes matchPop{ 0%{opacity:0; transform:scale(0.7);} 60%{opacity:1; transform:scale(1.05);} 100%{opacity:1; transform:scale(1);} }
  @keyframes dotPulse{ 0%,80%,100%{opacity:.25; transform:scale(0.8);} 40%{opacity:1; transform:scale(1);} }
  @keyframes drawerIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
  @keyframes spinRing{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ===== search header ===== */
  .search-header{position:sticky; top:0; z-index:40; background:rgba(242,240,235,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--secondary);}
  .header-row{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:20px; padding:14px 32px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; letter-spacing:-0.3px; color:var(--text); flex-shrink:0;}
  .brand-mark{width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--primary)); display:flex; align-items:center; justify-content:center; color:#fff;}
  .search-bar{flex:1; display:flex; align-items:center; background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-pill); padding:6px 8px; gap:2px; min-width:0;}
  .search-segment{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; padding:6px 16px; border-radius:var(--radius-pill); background:transparent; transition:background .15s ease;}
  .search-segment:hover{background:var(--bg);}
  .search-segment select{border:none; background:transparent; font-size:14px; font-weight:600; color:var(--text); width:100%; padding:0; appearance:none;}
  .segment-label{font-size:11px; color:var(--text2); font-weight:600; margin-bottom:2px;}
  .search-divider{width:1px; height:24px; background:var(--secondary); flex-shrink:0;}
  .search-submit{width:40px; height:40px; border-radius:50%; background:var(--wine); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .header-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .nav-tab{display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:var(--radius-pill); font-size:14px; font-weight:600; color:var(--text2); white-space:nowrap; transition:all .15s ease;}
  .nav-tab:hover{color:var(--text); background:var(--bg);}
  .nav-tab.active{background:var(--text); color:#fff;}
  .icon-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); position:relative; flex-shrink:0;}
  .icon-btn:hover{background:var(--bg);}
  .badge-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--wine); border:2px solid var(--bg);}
  .cta-signup{background:var(--accent); color:var(--text); font-weight:700; font-size:13px; padding:9px 18px; border-radius:var(--radius-btn); flex-shrink:0;}
  .cta-signup:hover{filter:brightness(0.95);}

  .filter-chips{max-width:1280px; margin:0 auto; display:flex; gap:8px; padding:0 32px 14px; overflow-x:auto;}
  .chip{display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius-pill); border:1px solid var(--secondary); background:var(--surface); font-size:13px; font-weight:600; color:var(--text2); white-space:nowrap; flex-shrink:0; transition:all .15s ease;}
  .chip:hover{border-color:var(--text);}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  .page{max-width:1280px; margin:0 auto; padding:28px 32px 80px;}

  /* intro banner */
  .intro-banner{margin-bottom:28px;}
  .discover-hero{position:relative; border-radius:24px; overflow:hidden; padding:56px 48px; margin-bottom:8px; background:linear-gradient(135deg, #421d24 0%, #6b3350 45%, var(--violet) 78%, var(--primary) 100%); isolation:isolate;}
  .hero-blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:.55; z-index:0;}
  .hero-content{position:relative; z-index:2; max-width:640px;}
  .intro-title{font-size:56px; font-weight:600; letter-spacing:-1.8px; line-height:0.98; color:#fff; margin:0 0 14px;}
  .intro-sub{font-size:16px; color:rgba(255,255,255,0.86); margin:0; max-width:460px; line-height:1.6;}
  .hero-float-card{position:absolute; top:44px; right:56px; width:220px; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.4); border-radius:16px; padding:16px; z-index:2; transform:rotate(4deg); box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .hero-float-card .hf-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .hero-float-card .hf-avatar{width:32px; height:32px; border-radius:50%; overflow:hidden;}
  .hero-float-card .hf-avatar img{width:100%; height:100%;}
  .hero-float-card .hf-title{font-size:12.5px; font-weight:700; color:var(--wine);}
  .hero-float-card .hf-sub{font-size:11px; color:var(--text2);}
  @media (max-width:860px){.hero-float-card{display:none;} .intro-title{font-size:38px;} .discover-hero{padding:36px 28px;}}

  /* card grid */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:22px;}
  .listing-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); overflow:hidden; animation:cardIn .45s ease both; transition:transform .2s ease, border-color .2s ease;}
  .listing-card:hover{transform:translateY(-6px); border-color:var(--accent);}
  .card-image-wrap{position:relative; aspect-ratio:1/1; background:var(--secondary); cursor:pointer;}
  .card-image-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-favorite{position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center; color:var(--wine); box-shadow:0 1px 4px rgba(0,0,0,.1);}
  .card-favorite.liked svg{animation:heartPop .4s ease;}
  .card-online{position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:5px; background:rgba(0,0,0,0.55); color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:var(--radius-pill);}
  .dot-live{width:6px; height:6px; border-radius:50%; background:#4ade80;}
  .card-body{padding:16px; cursor:pointer;}
  .card-row-1{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .card-title{font-size:17px; font-weight:700; margin:0;}
  .card-compat{font-size:13px; font-weight:700; color:var(--violet);}
  .card-meta{display:flex; align-items:center; gap:5px; font-size:13px; color:var(--text2); margin-bottom:4px;}
  .card-tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .tag{font-size:11.5px; font-weight:600; color:var(--violet); background:var(--primary); padding:3px 10px; border-radius:var(--radius-pill);}
  .card-row-4{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--text); margin-top:10px; padding-top:10px; border-top:1px solid var(--bg);}

  .empty-state{text-align:center; padding:80px 20px; color:var(--text2);}

  /* footer */
  .footer{border-top:1px solid var(--secondary); background:var(--surface); margin-top:40px;}
  .footer-cols{max-width:1280px; margin:0 auto; padding:40px 32px; display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
  .footer-col h4{font-size:13px; margin:0 0 12px; color:var(--text);}
  .footer-col a{display:block; font-size:13px; color:var(--text2); margin-bottom:8px; text-decoration:none;}
  .footer-col a:hover{color:var(--text);}

  /* section card generic */
  .section-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:24px;}

  /* camera feed screen */
  .capture-panel{display:grid; grid-template-columns:1.1fr 0.9fr; gap:20px; margin-bottom:28px;}
  @media (max-width:860px){.capture-panel{grid-template-columns:1fr;}}
  .cam-preview{position:relative; aspect-ratio:4/3; border-radius:var(--radius-card); background:linear-gradient(135deg,#2b2a29,#4a3f55); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; overflow:hidden;}
  .cam-ring{width:64px; height:64px; border-radius:50%; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff; margin-bottom:14px;}
  .cam-scanline{position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.03) 3px 4px);}
  .cam-shutter{margin-top:16px; width:64px; height:64px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text); border:4px solid rgba(255,255,255,0.35);}
  .gallery-lock{display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius-card); background:var(--bg); border:1px dashed var(--secondary); margin-top:14px;}
  .gallery-lock-icon{width:40px; height:40px; border-radius:50%; background:var(--secondary); display:flex; align-items:center; justify-content:center; color:var(--text2); flex-shrink:0;}
  .policy-list{display:flex; flex-direction:column; gap:12px; justify-content:center;}
  .policy-item{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--text2);}
  .policy-item svg{color:var(--violet); flex-shrink:0; margin-top:2px;}

  .feed-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}
  .feed-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); overflow:hidden; animation:cardIn .4s ease both;}
  .feed-head{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .feed-avatar{width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0;}
  .feed-avatar img{width:100%; height:100%; object-fit:cover;}
  .feed-name{font-size:13.5px; font-weight:700;}
  .feed-time{font-size:12px; color:var(--text2);}
  .feed-photo{width:100%; aspect-ratio:4/5; object-fit:cover; cursor:pointer;}
  .feed-body{padding:14px;}
  .feed-actions{display:flex; align-items:center; gap:16px; margin-bottom:8px;}
  .feed-like-btn{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text2);}
  .feed-like-btn.liked{color:var(--wine);}
  .feed-like-btn.liked svg{animation:heartPop .4s ease;}
  .feed-caption{font-size:13.5px; color:var(--text); line-height:1.5;}

  /* onboarding */
  .onboard-wrap{max-width:560px; margin:0 auto;}
  .onboard-steps{display:flex; align-items:center; gap:8px; margin-bottom:32px; justify-content:center;}
  .step-dot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--secondary); color:var(--text2); border:2px solid transparent;}
  .step-dot.active{background:var(--wine); color:#fff;}
  .step-dot.done{background:var(--primary); color:var(--violet);}
  .step-line{width:36px; height:2px; background:var(--secondary);}
  .onboard-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:36px;}
  .onboard-title{font-size:24px; font-weight:700; margin:0 0 6px; letter-spacing:-0.4px;}
  .onboard-sub{font-size:14px; color:var(--text2); margin:0 0 28px;}
  .field-group{margin-bottom:18px;}
  .field-label{display:block; font-size:13px; font-weight:700; margin-bottom:8px;}
  .field-row{display:flex; gap:8px;}
  .field-input{width:100%; padding:13px 16px; border:1px solid var(--secondary); border-radius:var(--radius-sm); font-size:14px; background:var(--bg);}
  .field-input:focus{outline:2px solid var(--violet); outline-offset:1px;}
  .btn-inline{padding:13px 18px; border-radius:var(--radius-sm); background:var(--text); color:#fff; font-size:13.5px; font-weight:700; white-space:nowrap;}
  .btn-inline:disabled{opacity:0.4; cursor:not-allowed;}
  .verify-ok{display:flex; align-items:center; gap:8px; color:#1a7f4b; font-size:13.5px; font-weight:700; padding:12px; background:#eafaf1; border-radius:var(--radius-sm); margin-top:10px;}
  .terms-row{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--bg);}
  .terms-row:last-child{border-bottom:none;}
  .checkbox{width:22px; height:22px; border-radius:6px; border:2px solid var(--secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; transition:all .15s ease;}
  .checkbox.checked{background:var(--wine); border-color:var(--wine);}
  .terms-label{flex:1; font-size:14px;}
  .terms-required{font-size:11px; color:var(--wine); font-weight:700; margin-left:6px;}
  .interest-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .interest-chip{padding:9px 16px; border-radius:var(--radius-pill); border:1px solid var(--secondary); font-size:13px; font-weight:600; color:var(--text2);}
  .interest-chip.selected{background:var(--primary); border-color:var(--violet); color:var(--violet);}
  .onboard-actions{display:flex; gap:10px; margin-top:28px;}
  .btn-secondary-ob{flex:1; padding:14px; border-radius:var(--radius-btn); border:1px solid var(--secondary); font-size:14px; font-weight:700; color:var(--text);}
  .btn-primary-ob{flex:2; padding:14px; border-radius:var(--radius-btn); background:var(--wine); color:#fff; font-size:14px; font-weight:700;}
  .btn-primary-ob:disabled{opacity:0.35; cursor:not-allowed;}
  .success-icon{width:76px; height:76px; border-radius:50%; background:var(--primary); color:var(--violet); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; animation:matchPop .5s ease;}

  /* chat */
  .chat-wrap{display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 168px); min-height:520px; border:1px solid var(--secondary); border-radius:var(--radius-card); overflow:hidden; background:var(--surface);}
  @media (max-width:800px){.chat-wrap{grid-template-columns:1fr;}}
  .conv-list{border-right:1px solid var(--secondary); overflow-y:auto;}
  .conv-item{display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--bg); align-items:center; position:relative;}
  .conv-item:hover{background:var(--bg);}
  .conv-item.active{background:var(--primary);}
  .conv-item.blocked{opacity:.5;}
  .conv-avatar{width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0;}
  .conv-avatar img{width:100%; height:100%;}
  .conv-info{flex:1; min-width:0;}
  .conv-name{font-size:14px; font-weight:700; margin-bottom:2px;}
  .conv-last{font-size:12.5px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv-meta{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .conv-time{font-size:11px; color:var(--text2);}
  .unread-badge{min-width:18px; height:18px; border-radius:50%; background:var(--wine); color:#fff; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px;}
  .chat-window{display:flex; flex-direction:column; min-width:0;}
  .chat-header{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--secondary);}
  .chat-header-avatar{width:38px; height:38px; border-radius:50%; overflow:hidden;}
  .chat-header-avatar img{width:100%; height:100%;}
  .chat-header-name{font-size:14.5px; font-weight:700;}
  .chat-header-status{font-size:12px; color:#1a7f4b; display:flex; align-items:center; gap:5px;}
  .chat-menu-wrap{margin-left:auto; position:relative;}
  .chat-dropdown{position:absolute; top:44px; right:0; background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(0,0,0,.1); overflow:hidden; z-index:10; min-width:150px;}
  .chat-dropdown button{display:flex; align-items:center; gap:8px; width:100%; padding:12px 14px; font-size:13.5px; text-align:left;}
  .chat-dropdown button:hover{background:var(--bg);}
  .chat-dropdown button.danger{color:#c02929;}
  .messages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;}
  .msg-row{display:flex;}
  .msg-row.mine{justify-content:flex-end;}
  .bubble{max-width:68%; padding:11px 15px; border-radius:16px; font-size:14px; line-height:1.5;}
  .bubble.mine{background:var(--wine); color:#fff; border-bottom-right-radius:4px;}
  .bubble.theirs{background:var(--bg); border:1px solid var(--secondary); border-bottom-left-radius:4px;}
  .typing-row{display:flex; gap:4px; padding:8px 14px; background:var(--bg); border-radius:16px; width:fit-content; border:1px solid var(--secondary);}
  .typing-dot{width:6px; height:6px; border-radius:50%; background:var(--text2); animation:dotPulse 1.2s infinite ease;}
  .typing-dot:nth-child(2){animation-delay:.15s;}
  .typing-dot:nth-child(3){animation-delay:.3s;}
  .chat-input-row{display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--secondary);}
  .chat-input{flex:1; padding:12px 16px; border-radius:var(--radius-pill); border:1px solid var(--secondary); font-size:14px; background:var(--bg);}
  .chat-send{width:44px; height:44px; border-radius:50%; background:var(--wine); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .chat-send:disabled{opacity:.35;}
  .blocked-overlay{display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; background:#fdf1f1; color:#a02929; font-size:13px; font-weight:600; border-top:1px solid var(--secondary);}
  .chat-empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:14px;}

  /* modal / drawer / toast */
  .overlay{position:fixed; inset:0; background:rgba(41,40,39,0.45); z-index:100; display:flex; align-items:center; justify-content:center;}
  .overlay.drawer-overlay{justify-content:flex-end;}
  .modal-box{background:var(--surface); border-radius:20px; padding:32px; width:420px; max-width:90vw; max-height:86vh; overflow-y:auto; animation:matchPop .28s ease;}
  .modal-box.wide{width:480px;}
  .drawer-box{background:var(--surface); width:420px; max-width:92vw; height:100%; overflow-y:auto; animation:drawerIn .32s ease;}
  .drawer-hero{position:relative; aspect-ratio:1/1;}
  .drawer-hero img{width:100%; height:100%; object-fit:cover;}
  .drawer-close{position:absolute; top:16px; left:16px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center;}
  .drawer-body{padding:24px;}
  .drawer-name{font-size:24px; font-weight:700; margin:0 0 4px;}
  .drawer-meta-row{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text2); margin-bottom:4px;}
  .drawer-bio{font-size:14px; line-height:1.7; color:var(--text); margin:18px 0;}
  .drawer-like-btn{width:100%; padding:15px; border-radius:var(--radius-btn); background:var(--wine); color:#fff; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px;}
  .drawer-like-btn.liked{background:var(--secondary); color:var(--text2);}

  .match-modal{text-align:center; padding:12px;}
  .match-avatars{display:flex; align-items:center; justify-content:center; gap:-10px; margin-bottom:20px; position:relative; height:96px;}
  .match-avatars img{width:88px; height:88px; border-radius:50%; border:4px solid #fff; object-fit:cover;}
  .match-avatars img:first-child{margin-right:-24px; z-index:1;}
  .match-avatars img:last-child{margin-left:-24px;}
  .match-title{font-size:24px; font-weight:800; margin:6px 0 8px; color:var(--wine);}
  .match-sub{font-size:14px; color:var(--text2); margin-bottom:24px;}

                {k:'marketing', label:'마케팅 정보 수신', req:false},

                <div className="terms-row" key={item.k}>

              <div className="field-group"><label className="field-label">닉네임</label><input className="field-input" placeholder="닉네임 입력" value={nickname} onChange={e=>setNickname(e.target.value)}/></div>

              <h2 className="onboard-title">가입이 완료되었습니다</h2>
              <p className="onboard-sub">{nickname||'회원'}님, 지금 바로 상대를 탐색해보세요.</p>
              <button className="match-cta" onClick={onFinish}>탐색 시작하기</button>
            </div>
          )}

      </div>
    </div>

function ChatScreen({ conversations, activeId, setActiveId, onSend, onReport, onBlock }){
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [reportOpen, setReportOpen] = useState(false);
  const [confirmBlock, setConfirmBlock] = useState(false);
  const [reason, setReason] = useState(null);
  const scrollRef = useRef(null);
  const active = conversations.find(c=>c.id===activeId);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [active && active.messages.length, typing]);

  const send = () => {
    if(!input.trim() || !active || active.blocked) return;
    onSend(active.id, input.trim());
    setInput('');
    setTyping(true);
    setTimeout(()=>{ setTyping(false); onSend(active.id, REPLY_POOL[Math.floor(Math.random()*REPLY_POOL.length)], true); }, 1100);
  };

  return (
    <div className="page">
      <div className="chat-wrap">
        <div className="conv-list">
          {conversations.map(c=>(
            <div key={c.id} className={`conv-item ${c.id===activeId?'active':''} ${c.blocked?'blocked':''}`} onClick={()=>{setActiveId(c.id); setMenuOpen(false);}}>
              <div className="conv-avatar"><img src={chatAvatarUrl(c.name)} alt={c.name}/></div>
              <div className="conv-info">
                <div className="conv-name">{c.name}</div>
                <div className="conv-last">{c.blocked? '차단된 대화입니다' : (c.messages[c.messages.length-1]?.text || '')}</div>
              </div>
              <div className="conv-meta">
                <div className="conv-time">{c.time}</div>
                {c.unread>0 && <div className="unread-badge">{c.unread}</div>}
              </div>
            </div>
          ))}
        </div>
        <div className="chat-window">
          {!active ? <div className="chat-empty">대화를 선택해주세요</div> : (
            <React.Fragment>
              <div className="chat-header">
                <div className="chat-header-avatar"><img src={chatAvatarUrl(active.name)} alt={active.name}/></div>
                <div>
                  <div className="chat-header-name">{active.name}</div>
                  <div className="chat-header-status">{ICON('circle',{width:8,height:8, fill:'#1a7f4b', color:'#1a7f4b'})}온라인</div>
                </div>
                <div className="chat-menu-wrap">
                  <button className="icon-btn" onClick={()=>setMenuOpen(v=>!v)}>{ICON('more-vertical',{width:18,height:18})}</button>
                  {menuOpen && (
                    <div className="chat-dropdown">
                      <button onClick={()=>{setMenuOpen(false); setReportOpen(true);}}>{ICON('flag',{width:15,height:15})}신고하기</button>
                      <button className="danger" onClick={()=>{setMenuOpen(false); setConfirmBlock(true);}}>{ICON('shield-x',{width:15,height:15})}차단하기</button>
                    </div>
                  )}
                </div>
              </div>
              <div className="messages" ref={scrollRef}>
                {active.messages.map((m,i)=>(
                  <div className={`msg-row ${m.from==='me'?'mine':''}`} key={i}>
                    <div className={`bubble ${m.from==='me'?'mine':'theirs'}`}>{m.text}</div>
                  </div>
                ))}
                {typing && (
                  <div className="msg-row"><div className="typing-row"><div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div></div></div>
                )}
              </div>
              {active.blocked ? (
                <div className="blocked-overlay">{ICON('lock',{width:15,height:15})}차단된 사용자입니다. 더 이상 메시지를 주고받을 수 없어요.</div>
              ) : (
                <div className="chat-input-row">
                  <input className="chat-input" placeholder="메시지를 입력하세요" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && send()} />
                  <button className="chat-send" disabled={!input.trim()} onClick={send}>{ICON('send',{width:18,height:18})}</button>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>

      {reportOpen && (
        <div className="overlay" onClick={()=>setReportOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <button className="close-x" onClick={()=>setReportOpen(false)}>{ICON('x',{width:18,height:18})}</button>
            <h3 className="modal-title">신고하기</h3>
            {REPORT_REASONS.map(r=>(
              <div className="radio-row" key={r} onClick={()=>setReason(r)}>
                <div className={`radio-dot ${reason===r?'picked':''}`}></div>{r}
              </div>
            ))}
            <textarea className="report-textarea" placeholder="상세 내용을 입력해주세요 (선택)"></textarea>
            <button className="modal-submit" disabled={!reason} onClick={()=>{onReport(active.id); setReportOpen(false); setReason(null);}}>신고 제출</button>
          </div>
        </div>
      )}

      {confirmBlock && (
        <div className="overlay" onClick={()=>setConfirmBlock(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()} style={{width:360, textAlign:'center'}}>
            <h3 className="modal-title">정말 차단하시겠습니까?</h3>
            <p style={{fontSize:13.5, color:'var(--text2)', marginBottom:20}}>차단하면 서로의 메시지를 주고받을 수 없어요.</p>
            <button className="modal-submit" onClick={()=>{onBlock(active.id); setConfirmBlock(false);}}>차단하기</button>
            <button className="match-later" onClick={()=>setConfirmBlock(false)}>취소</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [filters, setFilters] = useState({age:'전체', region:'전체', interest:'전체'});
  const [chip, setChip] = useState('전체');
  const [likedIds, setLikedIds] = useState([]);
  const [drawerProfile, setDrawerProfile] = useState(null);
  const [matchTarget, setMatchTarget] = useState(null);
  const [toast, setToast] = useState('');
  const [feed, setFeed] = useState(INITIAL_FEED);
  const [composerOpen, setComposerOpen] = useState(false);
  const [postModal, setPostModal] = useState(null);
  const [conversations, setConversations] = useState(INITIAL_CONVERSATIONS);
  const [activeChatId, setActiveChatId] = useState(INITIAL_CONVERSATIONS[0].id);

  useEffect(()=>{ window.lucide && window.lucide.createIcons(); });
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(''), 2400); return ()=>clearTimeout(t);} }, [toast]);

  const filteredProfiles = PROFILES.filter(p=>{
    if(filters.age!=='전체'){
      const dec = Math.floor(p.age/10)*10;
      if(`${dec}대` !== filters.age) return false;
    }
    if(filters.region!=='전체' && p.region!==filters.region) return false;
    if(filters.interest!=='전체' && !p.interests.includes(filters.interest)) return false;
    if(chip==='근처 3km' && p.dist>3) return false;
    if(chip==='인기 프로필' && p.compat<80) return false;
    if(chip==='새로 가입' && !(p.joined.includes('오늘')||p.joined.includes('일 전'))) return false;
    if(chip==='관심사 겹침' && filters.interest==='전체' && p.interests.length<2) return false;
    if(chip==='오늘 접속' && !p.online) return false;
    return true;
  });

  const toggleLike = (profile) => {
    if(likedIds.includes(profile.id)) return;
    setLikedIds(ids=>[...ids, profile.id]);
    if(profile.hasLikedMe){
      setMatchTarget(profile);
      setDrawerProfile(null);
    } else {
      setToast('호감을 보냈습니다');
    }
  };

  const goChatWithMatch = () => {
    if(!matchTarget) return;
    setConversations(list=>{
      if(list.find(c=>c.name===matchTarget.name)) return list;
      return [{id: Date.now(), name: matchTarget.name, unread:0, blocked:false, time:'방금', messages:[{from:'them', text:`안녕하세요! 매칭돼서 반가워요 :)`}]}, ...list];
    });
    setActiveChatId(prev => conversations.find(c=>c.name===matchTarget.name)?.id ?? Date.now());
    setMatchTarget(null);
    setScreen('chat');
  };

  const addPost = (caption, photo) => {
    setFeed(f=>[{id:Date.now(), author:'나', time:'방금', photo, caption, likes:0, liked:false, comments:[]}, ...f]);
    setComposerOpen(false);
    setToast('게시물이 등록되었습니다');
  };

  const toggleFeedLike = (id) => {
    setFeed(f=>f.map(p=> p.id===id ? {...p, liked:!p.liked, likes: p.liked?p.likes-1:p.likes+1} : p));
  };

  const sendMessage = (convId, text, fromThem=false) => {
    setConversations(list=>list.map(c=> c.id===convId ? {...c, messages:[...c.messages, {from: fromThem?'them':'me', text}], time:'방금', unread: fromThem && c.id!==activeChatId ? c.unread+1 : c.unread} : c));
  };

  const reportConv = (convId) => {
    setConversations(list=>list.map(c=> c.id===convId ? {...c, blocked:true} : c));
    setToast('신고가 접수되었습니다. 해당 사용자가 차단되었습니다');
  };
  const blockConv = (convId) => {
    setConversations(list=>list.map(c=> c.id===convId ? {...c, blocked:true} : c));
    setToast('사용자를 차단했습니다');
  };

  return (
    <div data-archetype="airbnb-search-grid" style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <Header active={screen} onNav={setScreen} filters={filters} setFilters={setFilters} chip={chip} setChip={setChip} onSignup={()=>setScreen('onboarding')} onSearch={()=>setToast('검색 조건이 적용되었습니다')} onBell={()=>setToast('새로운 알림이 없습니다')} />
      <main style={{flex:1, width:'100%'}}>
        {screen==='main' && <DiscoverScreen profiles={filteredProfiles} likedIds={likedIds} onToggleLike={toggleLike} onOpenProfile={setDrawerProfile} />}
        {screen==='camera-feed' && <CameraFeedScreen feed={feed} onOpenComposer={()=>setComposerOpen(true)} onToggleFeedLike={toggleFeedLike} onOpenPost={setPostModal} />}
        {screen==='onboarding' && <OnboardingScreen onFinish={()=>setScreen('main')} />}
        {screen==='chat' && <ChatScreen conversations={conversations} activeId={activeChatId} setActiveId={setActiveChatId} onSend={sendMessage} onReport={reportConv} onBlock={blockConv} />}
      </main>

      <ProfileDrawer profile={drawerProfile} liked={drawerProfile ? likedIds.includes(drawerProfile.id) : false} onClose={()=>setDrawerProfile(null)} onToggleLike={toggleLike} />
      <MatchModal match={matchTarget} onClose={()=>setMatchTarget(null)} onGoChat={goChatWithMatch} />
      <ComposerModal open={composerOpen} onClose={()=>setComposerOpen(false)} onSubmit={addPost} />
      <PostModal post={postModal} onClose={()=>setPostModal(null)} />
      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
