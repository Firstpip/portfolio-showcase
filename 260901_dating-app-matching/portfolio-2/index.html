<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 운영 데이팅 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --primary:#3ba6f1;
    --secondary:#e8e6e5;
    --accent:#ef2436;
    --bg:#fafaf9;
    --surface:#ffffff;
    --text:#0c0a09;
    --text2:#78716c;
    --muted:#d6d3d1;
    --soot:#1c1917;
    --green:#1a7f4b;
    --radius-card:10px;
    --radius-pill:9999px;
    --shadow-card:0 4px 16px rgba(0,0,0,.05);
    --shadow-elevated:0 12px 45px rgba(17,12,46,.12);
  }
  *{box-sizing:border-box;}
  html,body,#root{width:100%;min-height:100vh;margin:0;padding:0;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  table{border-collapse:collapse;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes countUp{ from{opacity:0;} to{opacity:1;} }
  @keyframes rowFlash{ 0%{background:rgba(59,166,241,0.12);} 100%{background:transparent;} }
  @keyframes modalIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }

  /* sidebar */
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:240px; background:var(--surface); border-right:1px solid var(--secondary); overflow-y:auto; z-index:30;}
  .sidebar-brand{display:flex; align-items:center; gap:8px; padding:18px 16px; border-bottom:1px solid var(--secondary);}
  .brand-glyph{width:26px; height:26px; border-radius:6px; background:var(--text); color:#fff; display:flex; align-items:center; justify-content:center;}
  .brand-name{font-weight:600; font-size:14px;}
  .env-pill{margin-left:auto; font-size:10.5px; font-weight:600; color:var(--green); background:#eafaf1; padding:3px 8px; border-radius:var(--radius-pill);}
  .sidebar-section{padding:14px 12px;}
  .sidebar-section-title{font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.04em; padding:0 8px 6px;}
  .sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; color:var(--text2); font-weight:500; margin-bottom:2px;}
  .sidebar-link:hover{background:var(--bg); color:var(--text);}
  .sidebar-link.active{background:var(--bg); color:var(--primary); font-weight:700;}
  .sidebar-link i{font-size:16px;}

  .main-wrap{margin-left:240px; flex:1; min-width:0; width:calc(100% - 240px); min-height:100vh;}
  .content{max-width:1240px; margin:0 auto; padding:28px 32px 60px;}

  .page-header{margin-bottom:20px;}
  .page-title-row{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .page-title{font-size:32px; font-weight:600; letter-spacing:-0.8px; margin:0;}
  .page-actions{display:flex; gap:8px; flex-shrink:0;}
  .btn-secondary{padding:8px 16px; border-radius:var(--radius-pill); border:1px solid var(--secondary); background:var(--surface); font-size:13px; font-weight:500; color:var(--text); display:flex; align-items:center; gap:6px;}
  .btn-primary{padding:8px 16px; border-radius:var(--radius-pill); background:var(--primary); border:1px solid #3398e1; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .btn-primary:hover{filter:brightness(0.95);}
  .page-meta{font-size:12.5px; color:var(--text2); margin-top:8px;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  @media (max-width:1000px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-card); animation:fadeUp .4s ease both;}
  .stat-label{font-size:12.5px; color:var(--text2); font-weight:500; margin-bottom:8px;}
  .stat-value{font-size:32px; font-weight:600; letter-spacing:-0.8px; margin-bottom:6px; animation:countUp .5s ease both;}
  .stat-delta{font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px;}
  .stat-delta.positive{color:var(--green);}
  .stat-delta.negative{color:var(--accent);}
  .stat-spark{width:100%; height:28px; margin-top:10px;}

  .data-section{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--radius-card); box-shadow:var(--shadow-card); overflow:hidden;}
  .tab-bar{display:flex; gap:4px; padding:6px 16px 0; border-bottom:1px solid var(--secondary);}
  .tab{padding:11px 6px; margin-right:18px; font-size:13.5px; font-weight:500; color:var(--text2); border-bottom:2px solid transparent;}
  .tab.active{color:var(--text); border-bottom-color:var(--primary); font-weight:700;}
  .data-toolbar{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--secondary); flex-wrap:wrap;}
  .search-input{flex:1; min-width:160px; padding:8px 12px; border:1px solid var(--secondary); border-radius:6px; font-size:13px; background:var(--bg);}
  .filter-chip{padding:7px 13px; border-radius:var(--radius-pill); border:1px solid var(--secondary); font-size:12.5px; color:var(--text); background:var(--surface); display:flex; align-items:center; gap:5px;}
  .filter-chip.active{background:var(--soot); color:#fff; border-color:var(--soot);}
  .export-btn{margin-left:auto; padding:7px 13px; border-radius:var(--radius-pill); border:1px solid var(--secondary); font-size:12.5px; color:var(--text); display:flex; align-items:center; gap:6px;}
  .data-table-wrap{overflow-x:auto;}
  .data-table{width:100%; font-size:13px;}
  .data-table th{text-align:left; padding:10px 16px; font-size:11.5px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--secondary); white-space:nowrap;}
  .data-table td{padding:12px 16px; border-bottom:1px solid var(--bg); white-space:nowrap;}
  .data-table tbody tr{cursor:pointer; transition:background .12s ease;}
  .data-table tbody tr:hover{background:var(--bg);}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:6px;}
  .badge.success{background:#eafaf1; color:var(--green);}
  .badge.warn{background:#fff4e5; color:#a3610a;}
  .badge.danger{background:#fdecec; color:var(--accent);}
  .row-actions-btn{width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
  .row-actions-btn:hover{background:var(--secondary);}

  /* master-detail (members page) */
  .md-wrap{display:flex; border:1px solid var(--secondary); border-radius:var(--radius-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; min-height:600px;}
  .list-rail{width:320px; flex-shrink:0; border-right:1px solid var(--secondary); overflow-y:auto;}
  .list-rail-head{padding:14px 16px; border-bottom:1px solid var(--secondary);}
  .list-rail-search{width:100%; padding:8px 12px; border:1px solid var(--secondary); border-radius:6px; font-size:13px; background:var(--bg);}
  .list-rail-tabs{display:flex; gap:6px; padding:10px 14px 0;}
  .rail-tab{padding:6px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:600; color:var(--text2); border:1px solid var(--secondary);}
  .rail-tab.active{background:var(--soot); color:#fff; border-color:var(--soot);}
  .rail-item{display:flex; gap:10px; padding:13px 16px; border-bottom:1px solid var(--bg); align-items:center;}
  .rail-item:hover{background:var(--bg);}
  .rail-item.active{background:#eaf5ff;}
  .rail-avatar{width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0;}
  .rail-avatar img{width:100%; height:100%;}
  .rail-info{flex:1; min-width:0;}
  .rail-name{font-size:13.5px; font-weight:600;}
  .rail-sub{font-size:12px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .detail-panel{flex:1; min-width:0; overflow-y:auto; padding:26px 30px;}
  .detail-head{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
  .detail-avatar{width:56px; height:56px; border-radius:50%; overflow:hidden;}
  .detail-avatar img{width:100%; height:100%;}
  .detail-name{font-size:19px; font-weight:700;}
  .detail-sub{font-size:13px; color:var(--text2);}
  .detail-actions{margin-left:auto; display:flex; gap:8px;}
  .summary-card{background:var(--bg); border:1px solid var(--secondary); border-radius:var(--radius-card); padding:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px;}
  .summary-item .label{font-size:11.5px; color:var(--text2); margin-bottom:4px;}
  .summary-item .value{font-size:15px; font-weight:700;}
  .detail-section{margin-bottom:22px;}
  .detail-section h4{font-size:13px; font-weight:700; margin:0 0 10px; color:var(--text2); text-transform:uppercase; letter-spacing:.03em;}
  .timeline-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--bg); font-size:13px;}
  .timeline-dot{width:8px; height:8px; border-radius:50%; background:var(--primary); margin-top:5px; flex-shrink:0;}
  .doc-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--secondary); border-radius:8px; font-size:13px; margin-bottom:8px;}
  .doc-row i{color:var(--text2);}
  .bulk-bar{display:flex; align-items:center; gap:10px; padding:10px 16px; background:#eaf5ff; border-bottom:1px solid var(--secondary); font-size:13px;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(12,10,9,0.4); z-index:100; display:flex; align-items:center; justify-content:center;}
  .modal-box{background:var(--surface); border-radius:16px; padding:28px; width:440px; max-width:90vw; max-height:86vh; overflow-y:auto; animation:modalIn .2s ease; box-shadow:var(--shadow-elevated);}
  .modal-title{font-size:18px; font-weight:700; margin:0 0 18px;}
  .close-x{position:absolute; top:18px; right:18px; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text2);}
  .close-x:hover{background:var(--bg);}
  .field-label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--text2);}
  .field-input{width:100%; padding:10px 12px; border:1px solid var(--secondary); border-radius:6px; font-size:13.5px; margin-bottom:14px; background:var(--bg);}
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .checkbox-row{display:flex; align-items:center; gap:10px; padding:9px 0; font-size:13.5px;}
  .checkbox{width:19px; height:19px; border-radius:5px; border:2px solid var(--secondary); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
  .checkbox.checked{background:var(--primary); border-color:var(--primary);}
  .radio-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--bg); font-size:13.5px;}
  .radio-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .radio-dot.picked{border-color:var(--primary);}
  .radio-dot.picked::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--primary);}

  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--soot); color:#fff; padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:500; z-index:200; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease;}

  .bars{display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:14px;}
  .bar{flex:1; background:linear-gradient(180deg,var(--primary),#8fd0ff); border-radius:4px 4px 0 0; transform-origin:bottom; animation:barGrow .6s ease both;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const memberAvatar = (name, size=80) => `https://source.boringavatars.com/beam/${size}/${encodeURIComponent(name)}?colors=0c0a09,3ba6f1,ef2436,e8e6e5,fafaf9`;

const DAILY = [12,15,11,18,22,19,25];
const SIGNUP_SPARK = [4,6,5,8,7,9,11];
const MATCH_SPARK = [30,34,28,40,44,38,52];
const PAYMENT_SPARK = [8,10,9,14,12,17,20];
const CHATROOM_SPARK = [60,58,64,70,66,74,80];

function Sparkline({ data, color }){
  const w=100, h=28, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*w},${h - ((v-min)/((max-min)||1))*h}`).join(' ');
  return (
    <svg className="stat-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Bars({ data }){
  const max = Math.max(...data);
  return (
    <div className="bars">
      {data.map((v,i)=>(<div className="bar" key={i} style={{height:`${(v/max)*100}%`, animationDelay:`${i*0.05}s`}}></div>))}
    </div>
  );
}

function Toast({ text }){
  if(!text) return null;
  return <div className="toast"><i className="ph ph-check-circle"></i>{text}</div>;
}

const REPORTS = [
  { id:'RP-2381', target:'최다인 (member)', reason:'부적절한 사진', status:'대기', date:'2026.08.30 14:02' },
  { id:'RP-2380', target:'강태오 (member)', reason:'욕설 및 혐오 표현', status:'조치완료', date:'2026.08.30 11:20' },
  { id:'RP-2379', target:'오수민 (member)', reason:'스팸/광고성 메시지', status:'대기', date:'2026.08.29 22:45' },
  { id:'RP-2378', target:'배지훈 (member)', reason:'사기 의심', status:'조치완료', date:'2026.08.29 19:03' },
  { id:'RP-2377', target:'남지원 (member)', reason:'부적절한 사진', status:'반려', date:'2026.08.28 09:12' },
];
const PAYMENTS_RECENT = [
  { id:'PY-99231', user:'이서연', item:'프리미엄 이용권 1개월', amount:'29,000원', status:'성공', date:'2026.08.30 15:10' },
  { id:'PY-99230', user:'박지훈', item:'하트 30개', amount:'9,900원', status:'성공', date:'2026.08.30 14:52' },
  { id:'PY-99229', user:'김하은', item:'프리미엄 이용권 3개월', amount:'69,000원', status:'환불', date:'2026.08.30 12:03' },
  { id:'PY-99228', user:'최민준', item:'하트 10개', amount:'3,900원', status:'실패', date:'2026.08.30 10:44' },
];
const SIGNUPS_RECENT = [
  { id:'US-8821', name:'정유나', region:'연남', channel:'앱스토어', date:'2026.08.30 16:01' },
  { id:'US-8820', name:'한도윤', region:'강남', channel:'구글플레이', date:'2026.08.30 15:44' },
  { id:'US-8819', name:'윤서아', region:'성수', channel:'앱스토어', date:'2026.08.30 13:20' },
];

function DashboardScreen(){
  const [tab, setTab] = useState('신고');
  const [range, setRange] = useState('7일');
  const [rangeOpen, setRangeOpen] = useState(false);
  const [todayOnly, setTodayOnly] = useState(false);
  const [statusFilterOn, setStatusFilterOn] = useState(false);
  const [toast, setToast] = useState('');
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(''),2200); return ()=>clearTimeout(t);} },[toast]);

  const TABS = ['신고','결제','가입'];
  return (
    <div className="content">
      <header className="page-header">
        <div className="page-title-row">
          <h1 className="page-title">실시간 통계 대시보드</h1>
          <div className="page-actions">
            <div style={{position:'relative'}}>
              <button className="btn-secondary" onClick={()=>setRangeOpen(v=>!v)}><i className="ph ph-calendar-blank"></i>{range}<i className="ph ph-caret-down"></i></button>
              {rangeOpen && (
                <div style={{position:'absolute', top:38, right:0, background:'var(--surface)', border:'1px solid var(--secondary)', borderRadius:8, boxShadow:'var(--shadow-card)', zIndex:5, minWidth:100}}>
                  {['오늘','7일','30일'].map(r=>(<button key={r} style={{display:'block', width:'100%', padding:'9px 14px', fontSize:13, textAlign:'left'}} onClick={()=>{setRange(r); setRangeOpen(false);}}>{r}</button>))}
                </div>
              )}
            </div>
            <button className="btn-primary" onClick={()=>setToast('리포트가 내보내기 되었습니다')}><i className="ph ph-download-simple"></i>리포트 내보내기</button>
          </div>
        </div>
        <div className="page-meta">마지막 업데이트: 방금 전 · Production 환경 · 기간: {range}</div>
      </header>

      <section className="stat-row" data-stat-row>
        <div className="stat-card">
          <div className="stat-label">누적 가입자</div>
          <div className="stat-value">48,201</div>
          <div className="stat-delta positive"><i className="ph ph-trend-up"></i>+4.2%</div>
          <Sparkline data={SIGNUP_SPARK} color="#3ba6f1" />
        </div>
        <div className="stat-card" style={{animationDelay:'.05s'}}>
          <div className="stat-label">오늘 매칭 건수</div>
          <div className="stat-value">312</div>
          <div className="stat-delta positive"><i className="ph ph-trend-up"></i>+11.8%</div>
          <Sparkline data={MATCH_SPARK} color="#1a7f4b" />
        </div>
        <div className="stat-card" style={{animationDelay:'.1s'}}>
          <div className="stat-label">오늘 결제 금액</div>
          <div className="stat-value">2,184,000원</div>
          <div className="stat-delta negative"><i className="ph ph-trend-down"></i>-2.1%</div>
          <Sparkline data={PAYMENT_SPARK} color="#ef2436" />
        </div>
        <div className="stat-card" style={{animationDelay:'.15s'}}>
          <div className="stat-label">활성 채팅방 수</div>
          <div className="stat-value">1,027</div>
          <div className="stat-delta positive"><i className="ph ph-trend-up"></i>+6.0%</div>
          <Sparkline data={CHATROOM_SPARK} color="#3ba6f1" />
        </div>
      </section>

      <div className="stat-card" style={{marginBottom:24}}>
        <div className="stat-label">일별 가입자 추이 (최근 7일)</div>
        <Bars data={DAILY} />
      </div>

      <section className="data-section">
        <nav className="tab-bar" data-tabs>
          {TABS.map(t=>(<button key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>최근 {t}</button>))}
        </nav>
        <div className="data-toolbar">
          <input className="search-input" placeholder="검색…" />
          <button className={`filter-chip ${todayOnly?'active':''}`} onClick={()=>setTodayOnly(v=>!v)}>오늘</button>
          <button className={`filter-chip ${statusFilterOn?'active':''}`} onClick={()=>setStatusFilterOn(v=>!v)}>전체 상태</button>
          <button className="export-btn" onClick={()=>setToast('CSV 파일이 다운로드되었습니다')}><i className="ph ph-export"></i>내보내기</button>
        </div>
        <div className="data-table-wrap">
          {tab==='신고' && (
            <table className="data-table">
              <thead><tr><th>신고번호</th><th>대상</th><th>사유</th><th>상태</th><th>접수일시</th><th></th></tr></thead>
              <tbody>
                <tr onClick={()=>setToast(`${REPORTS[0].id} 상세는 회원 & 신고 처리 화면에서 확인할 수 있어요`)}>
                  <td>{REPORTS[0].id}</td><td>{REPORTS[0].target}</td><td>{REPORTS[0].reason}</td>
                  <td><span className="badge warn">{REPORTS[0].status}</span></td>
                  <td>{REPORTS[0].date}</td><td><button className="row-actions-btn" onClick={e=>e.stopPropagation()}><i className="ph ph-dots-three"></i></button></td>

  const toggleSeg = (k) => setSegments(s=>({...s, [k]: !s[k]}));
  const send = () => {
    setHistory(h=>[{ id:Date.now(), title: title||'제목 없는 발송', segment: segments.all?'전체 회원':'조건별 세그먼트', sentAt: scheduleAt || '방금', success:0, fail:0, status:'대기' }, ...h]);
    setConfirmOpen(false);
    setTitle('');
    setToast('발송이 예약되었습니다');
  };

  return (
    <div className="content">
      <header className="page-header">
        <div className="page-title-row"><h1 className="page-title">푸시 발송 & 공지</h1></div>
        <div className="page-meta">조건별 대상에게 푸시 알림과 공지사항을 발송하고 이력을 관리합니다.</div>
      </header>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1.3fr', gap:20, marginBottom:24}}>
        <div className="stat-card">
          <div className="stat-label" style={{marginBottom:14}}>발송 대상 세그먼트</div>
          {[
            {k:'all', label:'전체 회원'},
            {k:'recent', label:'최근 7일 가입'},
            {k:'region', label:'지역: 성수·강남·홍대'},
            {k:'active', label:'활성 상태 회원만'},
          ].map(s=>(
            <div className="checkbox-row" key={s.k} onClick={()=>toggleSeg(s.k)}>
              <div className={`checkbox ${segments[s.k]?'checked':''}`}><i className="ph ph-check" style={{fontSize:12}}></i></div>{s.label}
            </div>
          ))}
        </div>
        <div className="stat-card">
          <div className="stat-label" style={{marginBottom:14}}>발송 내용</div>
          <label className="field-label">제목</label>
          <input className="field-input" placeholder="예: 가을 프로모션 안내" value={title} onChange={e=>setTitle(e.target.value)} />
          <label className="field-label">예약 발송 시각 (비우면 즉시 발송)</label>
          <input type="datetime-local" className="field-input" value={scheduleAt} onChange={e=>setScheduleAt(e.target.value)} />
          <button className="btn-primary" disabled={!title} onClick={()=>setConfirmOpen(true)}><i className="ph ph-paper-plane-tilt"></i>발송하기</button>
        </div>
      </div>

      <section className="data-section">
        <div className="data-toolbar"><div style={{fontWeight:700, fontSize:13.5}}>발송 이력</div></div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>제목</th><th>대상</th><th>발송 시각</th><th>성공</th><th>실패</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {history.map(h=>(
                <tr key={h.id}>
                  <td>{h.title}</td><td>{h.segment}</td><td>{h.sentAt}</td>
                  <td>{h.success.toLocaleString()}</td><td>{h.fail.toLocaleString()}</td>
                  <td><span className={`badge ${h.status==='완료'?'success':'warn'}`}>{h.status}</span></td>
                  <td>{h.fail>0 && <button className="btn-secondary" style={{padding:'4px 10px', fontSize:11.5}} onClick={()=>setToast(`실패 ${h.fail}건 재발송이 큐에 등록되었습니다`)}>실패건 재발송</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {confirmOpen && (
        <div className="overlay" onClick={()=>setConfirmOpen(false)}>
          <div className="modal-box" style={{width:380, textAlign:'center'}} onClick={e=>e.stopPropagation()}>
            <h3 className="modal-title">발송하시겠습니까?</h3>
            <p style={{fontSize:13, color:'var(--text2)', marginBottom:20}}>"{title}" 알림이 선택한 세그먼트 전체에 발송됩니다.</p>
            <div className="modal-actions">
              <button className="btn-secondary" style={{flex:1, justifyContent:'center'}} onClick={()=>setConfirmOpen(false)}>취소</button>
              <button className="btn-primary" style={{flex:1, justifyContent:'center'}} onClick={send}>발송 확정</button>
            </div>
          </div>
        </div>
      )}
      <Toast text={toast} />
    </div>
  );
}

function App(){
  const [nav, setNav] = useState('실시간 통계 대시보드');
  const NAV_GROUPS = [
    { title:'운영', items:[
      {label:'실시간 통계 대시보드', icon:'ph-gauge'},
      {label:'회원 & 신고 처리', icon:'ph-users-three'},
    ]},
    { title:'정산', items:[{label:'인앱결제 & 재화 관리', icon:'ph-credit-card'}] },
    { title:'커뮤니케이션', items:[{label:'푸시 발송 & 공지', icon:'ph-megaphone'}] },
  ];
  return (
    <div data-archetype="stripe-multipane" style={{width:'100%', minHeight:'100vh', display:'flex'}}>
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="brand-glyph"><i className="ph ph-heart" style={{fontSize:14}}></i></div>
          <div className="brand-name">봄날의만남 어드민</div>
          <div className="env-pill">Production</div>
        </div>
        {NAV_GROUPS.map(g=>(
          <div className="sidebar-section" key={g.title}>
            <div className="sidebar-section-title">{g.title}</div>
            {g.items.map(item=>(
              <a key={item.label} className={`sidebar-link ${nav===item.label?'active':''}`} onClick={()=>setNav(item.label)}>
                <i className={`ph ${item.icon}`}></i>{item.label}
              </a>
            ))}
          </div>
        ))}
      </aside>
      <main className="main-wrap">
        {nav==='실시간 통계 대시보드' && <DashboardScreen />}
        {nav==='회원 & 신고 처리' && <MembersScreen />}
        {nav==='인앱결제 & 재화 관리' && <PaymentsScreen />}
        {nav==='푸시 발송 & 공지' && <PushScreen />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
