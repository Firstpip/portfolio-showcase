<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정산허브 — 게임 로열티 정산 자동화 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#fa5d00;
    --secondary:#c0bbb6;
    --accent:#1ef6da;
    --bg:#fff8f1;
    --surface:#ffffff;
    --text:#1d1e1c;
    --text2:#615f5c;
    --border:#e3d6c5;
    --shadow-sm:rgba(0,0,0,0.2) 0px 1px 4px 0px;
    --shadow-lg:rgba(250,166,0,0.25) 6px 4px 24px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    letter-spacing:0.015em;
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;letter-spacing:0.015em;cursor:pointer;border:none;background:none;}
  ::selection{background:var(--primary);color:#fff;}

  @keyframes fadeInUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes slideDown{ from{opacity:0;transform:translateY(-12px) scale(0.98);} to{opacity:1;transform:translateY(0) scale(1);} }
  @keyframes toastIn{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  @keyframes flashRing{ 0%,100%{box-shadow:0 0 0 0 rgba(250,93,0,0);} 40%{box-shadow:0 0 0 4px rgba(250,93,0,0.35);} }
  @keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }

  .app-shell{display:flex;width:100%;min-height:100vh;}

  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:264px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    z-index:20;
  }
  .sidebar-brand{
    height:64px;display:flex;align-items:center;gap:10px;
    padding:0 20px;border-bottom:1px solid var(--border);
  }
  .brand-mark{
    width:32px;height:32px;border-radius:10px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .brand-name{font-weight:700;font-size:17px;}
  .sidebar-cmdk-hint{
    margin:14px 16px 6px;padding:10px 12px;border-radius:12px;
    background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:var(--text2);
  }
  .kbd{
    font-size:11px;padding:2px 6px;border-radius:6px;
    background:var(--surface);border:1px solid var(--secondary);color:var(--text2);
  }
  .sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .sidebar-section-title{
    font-size:12px;color:var(--text2);font-weight:600;
    padding:16px 12px 6px;letter-spacing:0.3px;
  }
  .sidebar-link{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;
    color:var(--text2);position:relative;transition:background 150ms ease-out,color 150ms ease-out;
  }
  .sidebar-link:hover{background:var(--bg);color:var(--text);}
  .sidebar-link.active{background:var(--bg);color:var(--text);font-weight:600;}
  .sidebar-link.active::before{
    content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;
    border-radius:0 4px 4px 0;background:var(--primary);
  }
  .sidebar-user{
    margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-user img{width:32px;height:32px;border-radius:50%;}
  .sidebar-user-name{font-size:13px;font-weight:600;}
  .sidebar-user-role{font-size:12px;color:var(--text2);}

  .main-wrap{margin-left:264px;flex:1;min-width:0;width:calc(100% - 264px);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;border-bottom:1px solid var(--border);background:var(--bg);
    position:sticky;top:0;z-index:10;
  }
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);}
  .breadcrumb .divider{color:var(--secondary);}
  .breadcrumb .current{color:var(--text);font-weight:600;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}

  .btn-cmdk{
    display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:16px;
    background:var(--surface);border:1px solid var(--secondary);color:var(--text2);font-size:13px;font-weight:500;
    box-shadow:var(--shadow-sm);transition:transform 120ms ease-out;
  }
  .btn-cmdk:hover{transform:translateY(-1px);}

  .btn-primary{
    display:flex;align-items:center;gap:8px;padding:12px 24px;border-radius:16px;
    background:var(--primary);color:#fff;font-size:14px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:transform 120ms ease-out,filter 120ms ease-out;
  }
  .btn-primary:hover{filter:brightness(0.92);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}

  .btn-ghost{
    display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:16px;
    background:transparent;border:1px solid var(--secondary);color:var(--text);font-size:13px;font-weight:500;
    transition:background 120ms ease-out;
  }
  .btn-ghost:hover{background:var(--bg);}

  .btn-icon{
    width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:var(--text2);transition:background 120ms ease-out,color 120ms ease-out;
  }
  .btn-icon:hover{background:var(--bg);color:var(--text);}

  .content{padding:28px 32px 60px;width:100%;}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:16px;}
  .page-title{font-size:26px;font-weight:700;letter-spacing:0.36px;}
  .page-sub{font-size:14px;color:var(--text2);margin-top:6px;}

  .board-layout{display:flex;gap:24px;align-items:flex-start;width:100%;}
  .board-region{flex:1;min-width:0;display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
  .side-region{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:88px;}

  .kanban-col{
    width:270px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);
    border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:420px;
    transition:background 150ms ease-out;
  }
  .kanban-col.drag-over{background:#fdeee0;}
  .kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 2px;}
  .kanban-col-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#1a9d6c;display:inline-block;animation:pulseDot 1.6s ease-in-out infinite;margin-right:6px;}
  .kanban-count{font-size:12px;color:var(--text2);background:var(--surface);border-radius:999px;padding:2px 8px;}

  .kcard{
    background:var(--surface);border-radius:16px;padding:16px;border:1px solid var(--border);
    box-shadow:var(--shadow-sm);cursor:grab;animation:fadeInUp 320ms ease-out both;
  }
  .kcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
  .kcard.flash{animation:flashRing 900ms ease-out 2;}
  .kcard-title{font-size:14px;font-weight:700;margin-bottom:6px;}
  .kcard-meta{font-size:12px;color:var(--text2);display:flex;flex-direction:column;gap:4px;}
  .kcard-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--text2);}
  .tag.deadline-soon{background:#fdeee0;color:var(--primary);border-color:var(--primary);}

  .stat-card{
    background:var(--surface);border-radius:20px;padding:24px;border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
  }
  .stat-label{font-size:13px;color:var(--text2);font-weight:600;}
  .stat-value{font-size:40px;font-weight:700;line-height:1.15;letter-spacing:0.72px;margin-top:6px;}
  .stat-foot{font-size:12px;color:var(--text2);margin-top:6px;}

  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring-label{font-size:12px;color:var(--text2);}
  .ring-value{font-size:20px;font-weight:700;}

  .priority-list{display:flex;flex-direction:column;gap:8px;}
  .priority-item{
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    border-radius:14px;border:1px solid var(--border);background:var(--surface);
    font-size:13px;transition:background 120ms ease-out;
  }
  .priority-item:hover{background:var(--bg);}
  .segmented{display:flex;background:var(--bg);border-radius:999px;padding:3px;border:1px solid var(--border);}
  .segmented button{flex:1;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text2);}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}

  .card{background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}

  .tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--border);width:fit-content;margin-bottom:20px;}
  .tabs button{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2);}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}

  .dropzone{
    border:2px dashed var(--secondary);border-radius:20px;background:var(--surface);
    padding:48px 24px;text-align:center;transition:border-color 150ms ease-out,background 150ms ease-out;
  }
  .dropzone.active{border-color:var(--primary);background:#fff3e8;}
  .dropzone-icon{width:52px;height:52px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--primary);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12px;color:var(--text2);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);}
  td{padding:14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-hover:hover{background:var(--bg);}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;}
  .badge.ok{background:#e4f9f0;color:#1a9d6c;}
  .badge.warn{background:#fdeee0;color:var(--primary);}
  .badge.fail{background:#fbe6e6;color:#c73434;}
  .badge.pending{background:#eef1f3;color:#5b6470;}

  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--secondary);border-top-color:var(--primary);animation:spin 700ms linear infinite;display:inline-block;}

  .skeleton{background:linear-gradient(90deg,var(--bg) 25%,#f2e8db 37%,var(--bg) 63%);background-size:400px 100%;animation:shimmer 1.4s ease infinite;border-radius:10px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(29,30,28,0.45);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .modal{
    background:var(--surface);border-radius:20px;max-width:560px;width:100%;
    max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideDown 220ms ease-out;
  }
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:18px;font-weight:700;}
  .modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
  .modal-foot{padding:18px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--text);}
  .field input,.field select,.field textarea{
    padding:12px 14px;border-radius:16px;border:1px solid var(--secondary);font-size:14px;
    background:var(--surface);color:var(--text);font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--primary);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}

  .history-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;}
  .history-text{font-size:13px;}
  .history-time{font-size:11px;color:var(--text2);margin-top:2px;}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:var(--text);color:#fff;padding:14px 18px;border-radius:14px;font-size:13px;
    box-shadow:var(--shadow-lg);animation:toastIn 220ms ease-out;display:flex;align-items:center;gap:10px;min-width:220px;
  }
  .toast.warn{background:#c73434;}

  .cmdk-overlay{
    position:fixed;inset:0;background:rgba(29,30,28,0.5);z-index:150;
    display:flex;align-items:flex-start;justify-content:center;padding-top:120px;
  }
  .cmdk-modal{
    width:100%;max-width:560px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);
    overflow:hidden;animation:slideDown 200ms ease-out;
  }
  .cmdk-input{width:100%;border:none;padding:20px 22px;font-size:16px;font-family:inherit;outline:none;border-bottom:1px solid var(--border);color:var(--text);}
  .cmdk-results{padding:10px;max-height:320px;overflow-y:auto;}
  .cmdk-group-title{font-size:11px;color:var(--text2);font-weight:700;padding:10px 12px 4px;text-transform:uppercase;letter-spacing:0.5px;}
  .cmdk-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:12px;font-size:14px;}
  .cmdk-item:hover{background:var(--bg);}

  .empty-illustration{display:flex;flex-direction:column;align-items:center;padding:50px 20px;color:var(--text2);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}

  @media (max-width:1100px){
    .board-layout{flex-direction:column;}
    .side-region{width:100%;position:static;}
  }
</style>
</head>

function Icon({name, size=16, style}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[name]);
  return <i data-lucide={name} style={{width:size,height:size,...style}} ref={ref}></i>;
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (message, tone='ok') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, {id, message, tone}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 3200);
  };
  return {toasts, push};
}

  );
}

function ProgressRing({pct, size=64}){
  const r = (size-8)/2;
  const c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} stroke="var(--border)" strokeWidth="6" fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke="var(--primary)" strokeWidth="6" fill="none"
        strokeDasharray={c} strokeDashoffset={c - (c*pct/100)} strokeLinecap="round"
        style={{transition:'stroke-dashoffset 600ms ease-out'}}/>
    </svg>
  );
}

function MainBoard({cards, setCards, toast}){
  const [dragId, setDragId] = useState(null);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [sortMode, setSortMode] = useState('deadline');
  const [highlight, setHighlight] = useState(null);
  const [detail, setDetail] = useState(null);
  const [newModal, setNewModal] = useState(false);

  const gameById = (id) => GAMES.find(g=>g.id===id);

  const move = (cardId, toStatus) => {
    const card = cards.find(c=>c.id===cardId);
    if(!card) return;
    const fromIdx = STATUSES.indexOf(card.status);
    const toIdx = STATUSES.indexOf(toStatus);
    if(toIdx - fromIdx !== 1){
      toast(`허용되지 않은 상태 전이입니다 (${card.status} → ${toStatus} 직행 불가)`, 'warn');
      return;
    }
    setCards(cs => cs.map(c => c.id===cardId ? {
      ...c, status:toStatus,
      history:[...c.history, {ts:fmt(now()), label:`${card.status} → ${toStatus}으로 상태가 전환되었습니다 (담당: 박서준)`}]
    } : c));
    toast(`${gameById(card.gameId).name} 정산이 [${toStatus}] 단계로 이동했습니다`);
  };

  const pendingCount = cards.filter(c=>c.status!=='확정').length;
  const confirmedPct = Math.round((cards.filter(c=>c.status==='확정').length / cards.length) * 100);

  const priorityItems = useMemo(()=>{
    const arr = [...cards];
    if(sortMode==='deadline') arr.sort((a,b)=> a.deadline.localeCompare(b.deadline));
    else arr.sort((a,b)=> (a.status==='확정') - (b.status==='확정'));
    return arr.filter(c=>c.status!=='확정').slice(0,5);
  },[cards, sortMode]);

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">분기 정산 워크플로우 보드</div>
          <div className="page-sub">2025년 4분기 · 산출완료부터 확정까지 카드를 드래그해 상태를 전환합니다</div>
        </div>
        <button className="btn-primary" onClick={()=>setNewModal(true)}>
          <Icon name="plus" size={16}/> 신규 정산 시작
        </button>
      </div>

      <div className="board-layout">
        <div className="board-region">
          {STATUSES.map(status => {
            const list = cards.filter(c=>c.status===status);
            return (
              <div key={status}
                className={"kanban-col" + (dragOverCol===status ? ' drag-over':'')}
                onDragOver={(e)=>{e.preventDefault(); setDragOverCol(status);}}
                onDragLeave={()=> setDragOverCol(null)}
                onDrop={(e)=>{ e.preventDefault(); setDragOverCol(null); if(dragId) move(dragId, status); setDragId(null); }}>
                <div className="kanban-col-head">
                  <div className="kanban-col-title">
                    <span className="status-dot" style={{background:STATUS_COLOR[status]}}></span>
                    {status}
                  </div>
                  <span className="kanban-count">{list.length}</span>
                </div>
                {list.map(c => {
                  const g = gameById(c.gameId);
                  return (
                    <div key={c.id} id={"card-"+c.id} draggable
                      className={"kcard" + (highlight===c.id ? ' flash':'')}
                      style={{borderRadius:20}}
                      onDragStart={()=>setDragId(c.id)}
                      onClick={()=>setDetail(c)}>
                      <div className="kcard-title">{g.name}</div>
                      <div className="kcard-meta">
                        <span>대상: {g.partner}</span>
                        <span>정산예정액: {c.amountKRW}</span>
                      </div>
                      <div className="kcard-tags">
                        <span className={"tag" + (c.deadline<='09/28' && status!=='확정' ? ' deadline-soon':'')}>마감 {c.deadline}</span>
                        <span className="tag">{g.channels.length}개 채널</span>
                      </div>
                    </div>

                })}
                {list.length===0 && (
                  <div style={{fontSize:12,color:'var(--text2)',textAlign:'center',padding:'20px 6px'}}>카드를 여기로 드래그하세요</div>
                )}
              </div>
            );
          })}
        </div>

        <div className="side-region">
          <div className="stat-card" style={{borderRadius:20}}>
            <div className="stat-label">이번 분기 미확정</div>
            <div className="stat-value">{pendingCount}건</div>
            <div className="stat-foot">전체 {cards.length}건 중 확정 {cards.length-pendingCount}건</div>

            <div className="segmented" style={{marginBottom:12}}>
              <button className={sortMode==='deadline'?'active':''} onClick={()=>setSortMode('deadline')}>마감 임박순</button>

            </div>
          </div>
        </div>
      </div>

      {detail && (
        <div className="modal-overlay" onMouseDown={()=>setDetail(null)}>
          <div className="modal wide" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{gameById(detail.gameId).name} 정산 상세</div>
              <button className="btn-icon" onClick={()=>setDetail(null)}><Icon name="x" size={18}/></button>
            </div>
            <div className="modal-body">
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <span className="badge pending"><span className="status-dot" style={{background:STATUS_COLOR[detail.status]}}></span>{detail.status}</span>
                <span className="tag">대상: {gameById(detail.gameId).partner}</span>
                <span className="tag">통화: {gameById(detail.gameId).currency}</span>
                <span className="tag">마감 {detail.deadline}</span>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>채널별 매출</div>
                <table>
                  <thead><tr><th>채널</th><th>정산 예정액</th></tr></thead>
                  <tbody>
                    {gameById(detail.gameId).channels.map((ch,i)=>(
                      <tr key={i}><td>{ch}</td><td>{(Number(detail.amountKRW.replace(/[^0-9]/g,''))/gameById(detail.gameId).channels.length).toLocaleString('ko-KR')}원</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>변경 이력 (감사 로그)</div>
                {detail.history.map((h,i)=>(
                  <div className="history-item" key={i}>
                    <span className="history-dot"></span>
                    <div>
                      <div className="history-text">{h.label}</div>
                      <div className="history-time">{h.ts}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn-ghost" onClick={()=>setDetail(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      {newModal && (
        <NewSettlementModal
          onClose={()=>setNewModal(false)}
          onCreate={(gameIds)=>{
            setCards(cs => [
              ...cs,
              ...gameIds.map(gid => ({
                id:'c'+Math.random().toString(36).slice(2,7),
                gameId:gid, status:'산출완료', deadline:'12/05',
                amountKRW: (Math.floor(Math.random()*15+2)*1000000+340000).toLocaleString('ko-KR')+'원',
                history:[{ts:fmt(now()), label:'분기 정산 워크플로우가 생성되었습니다'}]
              }))
            ]);
            toast('신규 정산 워크플로우가 생성되었습니다');
            setNewModal(false);
          }}
        />
      )}
    </div>
  );
}

          </table>
        </div>
      )}
    </div>
  );
}

function MappingScreen({toast}){
  const [rules, setRules] = useState([
    {id:1, channel:'Steam', column:'Net Units Sold', field:'판매수량', version:'v3', updated:'08/22'},
    {id:2, channel:'Steam', column:'Net Revenue (USD)', field:'매출액', version:'v3', updated:'08/22'},
    {id:3, channel:'PlayStation Store', column:'Sales Qty', field:'판매수량', version:'v2', updated:'08/12'},
    {id:4, channel:'Nintendo eShop', column:'販売数', field:'판매수량', version:'v1', updated:'07/30'},
  ]);
  const [unmapped, setUnmapped] = useState(['Xbox Store: Units Refunded', 'Epic Games Store: Net Sales (EUR)']);
  const [modal, setModal] = useState(null);
  const [history, setHistory] = useState(null);

  const submitRule = (data) => {
    if(modal && modal.prefill){
      setUnmapped(u => u.filter(x=>x!==modal.prefill));
    }
    setRules(r => [{id:Date.now(), channel:data.channel, column:data.column, field:data.field, version:'v1', updated:'09/01'}, ...r]);
    toast('매핑 규칙이 등록되었습니다');
    setModal(null);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">채널별 양식 매핑 설정</div>
          <div className="page-sub">원본 컬럼을 표준 항목으로 변환하는 규칙을 관리합니다</div>
        </div>
        <button className="btn-primary" onClick={()=>setModal({})}><Icon name="plus" size={16}/> 새 매핑 규칙 추가</button>
      </div>

      {unmapped.length>0 && (
        <div className="card" style={{padding:16,marginBottom:18,display:'flex',alignItems:'center',justifyContent:'space-between',borderColor:'var(--primary)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,fontSize:13}}>
            <Icon name="alert-triangle" size={17} style={{color:'var(--primary)'}}/>
            미매핑 컬럼 {unmapped.length}건이 있습니다: {unmapped.join(' · ')}
          </div>
          <button className="btn-ghost" onClick={()=> setModal({prefill: unmapped[0]})}>매핑</button>
        </div>
      )}

      <div className="card" style={{overflow:'hidden'}}>
        <table>
          <thead><tr><th>채널</th><th>원본 컬럼</th><th>표준 항목</th><th>버전</th><th>최종 수정</th><th></th></tr></thead>
          <tbody>
            {rules.map(r => (
              <tr className="row-hover" key={r.id}>
                <td>{r.channel}</td>
                <td>{r.column}</td>
                <td><span className="tag">{r.field}</span></td>
                <td>{r.version}</td>
                <td>{r.updated}</td>
                <td><button className="btn-ghost" style={{padding:'6px 12px'}} onClick={()=>setHistory(r)}>이력보기</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal && (
        <div className="modal-overlay" onMouseDown={()=>setModal(null)}>
          <div className="modal" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">매핑 규칙 추가</div>
              <button className="btn-icon" onClick={()=>setModal(null)}><Icon name="x" size={18}/></button>
            </div>
            <MappingForm prefill={modal.prefill} onSubmit={submitRule}/>
          </div>
        </div>
      )}

      {history && (
        <div className="modal-overlay" onMouseDown={()=>setHistory(null)}>
          <div className="modal" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{history.channel} · {history.column} 이력</div>
              <button className="btn-icon" onClick={()=>setHistory(null)}><Icon name="x" size={18}/></button>
            </div>
            <div className="modal-body">
              {['v3 (현재)','v2','v1'].map((v,i)=>(
                <div className="history-item" key={i}>
                  <span className="history-dot" style={{background: i===0 ? 'var(--primary)':'var(--secondary)'}}></span>
                  <div style={{flex:1}}>
                    <div className="history-text">{v} · 표준 항목 "{history.field}"로 매핑</div>
                    <div className="history-time">2025/08/{22-i*10}</div>
                  </div>
                  {i>0 && <button className="btn-ghost" style={{padding:'6px 12px',height:'fit-content'}} onClick={()=>{ toast(`${v}으로 롤백되었습니다`); setHistory(null); }}>이 버전으로 되돌리기</button>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MappingForm({prefill, onSubmit}){
  const [channel, setChannel] = useState(prefill ? prefill.split(':')[0] : 'Steam');
  const [column, setColumn] = useState(prefill ? prefill.split(':')[1].trim() : '');
  const [field, setField] = useState('판매수량');
  return (
    <>
      <div className="modal-body">
        <div className="field">
          <label>판매 채널</label>
          <select value={channel} onChange={e=>setChannel(e.target.value)}>
            {['Steam','PlayStation Store','Nintendo eShop','Xbox Store','Epic Games Store'].map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div className="field">
          <label>원본 컬럼명</label>
          <input value={column} onChange={e=>setColumn(e.target.value)} placeholder="예: Net Units Sold"/>
        </div>
        <div className="field">
          <label>표준 항목</label>
          <select value={field} onChange={e=>setField(e.target.value)}>
            {['게임명','판매수량','매출액','통화','정산기간'].map(f=><option key={f}>{f}</option>)}
          </select>
        </div>
      </div>
      <div className="modal-foot">
        <button className="btn-primary" onClick={()=> column && onSubmit({channel, column, field})}>
          <Icon name="check" size={16}/> 규칙 저장
        </button>
      </div>
    </>
  );
}

function ReportScreen({cards, toast}){
  const [genModal, setGenModal] = useState(null);
  const [loading, setLoading] = useState(false);
  const [history, setHistory] = useState([
    {id:1, game:'아이언타이드', target:'해외 개발사 F (미국)', version:'v2', date:'08/23'},
    {id:2, game:'문라이트카트', target:'국내 개발사 G', version:'v1', date:'08/22'},
  ]);
  const confirmedGames = cards.filter(c=>c.status==='확정').map(c => ({...c, game: GAMES.find(g=>g.id===c.gameId)}));

  const generate = (form) => {
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      setHistory(h => [{id:Date.now(), game:genModal.game.name, target:genModal.game.partner, version:'v'+(h.filter(x=>x.game===genModal.game.name).length+1), date:'09/01'}, ...h]);
      toast(`${genModal.game.name} 로열티 보고서가 생성되었습니다 (${form.formats.join(', ')})`);
      setGenModal(null);
    }, 1500);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">로열티 보고서 자동 생성</div>
          <div className="page-sub">확정된 정산 건을 대상별 맞춤 양식으로 즉시 출력합니다</div>
        </div>
      </div>

      <div className="card" style={{overflow:'hidden', marginBottom:24}}>
        <table>
          <thead><tr><th>게임</th><th>정산 대상</th><th>최근 생성 버전</th><th></th></tr></thead>
          <tbody>
            {confirmedGames.map(c => (
              <tr className="row-hover" key={c.id}>
                <td>{c.game.name}</td>
                <td>{c.game.partner}</td>
                <td>{history.find(h=>h.game===c.game.name)?.version || '없음'}</td>
                <td><button className="btn-primary" style={{padding:'8px 16px'}} onClick={()=>setGenModal({game:c.game})}><Icon name="sparkles" size={14}/> 보고서 생성</button></td>
              </tr>
            ))}
            {confirmedGames.length===0 && <tr><td colSpan="4"><div className="empty-illustration"><Icon name="inbox" size={28}/><div style={{marginTop:8}}>확정된 정산 건이 아직 없습니다</div></div></td></tr>}
          </tbody>
        </table>
      </div>

      <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>생성 이력</div>
      <div className="card" style={{overflow:'hidden'}}>
        <table>
          <thead><tr><th>게임</th><th>정산 대상</th><th>버전</th><th>생성일</th><th></th></tr></thead>
          <tbody>
            {history.map(h => (
              <tr className="row-hover" key={h.id}>
                <td>{h.game}</td><td>{h.target}</td><td>{h.version}</td><td>{h.date}</td>
                <td style={{display:'flex',gap:8}}>
                  <button className="btn-ghost" style={{padding:'6px 12px'}} onClick={(e)=>{ e.preventDefault(); toast('엑셀 다운로드가 시작됩니다'); }}><Icon name="file-spreadsheet" size={14}/> 엑셀</button>
                  <button className="btn-ghost" style={{padding:'6px 12px'}} onClick={(e)=>{ e.preventDefault(); toast('PDF 다운로드가 시작됩니다'); }}><Icon name="file-text" size={14}/> PDF</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {genModal && (
        <div className="modal-overlay" onMouseDown={()=> !loading && setGenModal(null)}>
          <div className="modal" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{genModal.game.name} 보고서 생성</div>
              {!loading && <button className="btn-icon" onClick={()=>setGenModal(null)}><Icon name="x" size={18}/></button>}
            </div>
            {loading ? (
              <div className="modal-body" style={{alignItems:'center',padding:'40px 24px'}}>
                <div className="spinner" style={{width:28,height:28,borderWidth:3}}></div>
                <div style={{marginTop:14,fontSize:13,color:'var(--text2)'}}>보고서를 생성하는 중입니다…</div>
              </div>
            ) : (
              <GenerateForm onSubmit={generate}/>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function GenerateForm({onSubmit}){
  const [template, setTemplate] = useState('국내형');
  const [formats, setFormats] = useState(['엑셀']);
  const toggle = (f) => setFormats(fs => fs.includes(f) ? fs.filter(x=>x!==f) : [...fs, f]);
  return (
    <>
      <div className="modal-body">
        <div className="field">
          <label>보고 양식</label>
          <select value={template} onChange={e=>setTemplate(e.target.value)}>
            <option>국내형</option><option>해외형 (영문)</option><option>파트너 커스텀 양식</option>
          </select>
        </div>
        <div className="field">
          <label>내보내기 형식</label>
          <div style={{display:'flex',gap:16}}>
            <label className="checkbox-row"><input type="checkbox" checked={formats.includes('엑셀')} onChange={()=>toggle('엑셀')}/> 엑셀</label>
            <label className="checkbox-row"><input type="checkbox" checked={formats.includes('PDF')} onChange={()=>toggle('PDF')}/> PDF</label>
          </div>
        </div>
      </div>
      <div className="modal-foot">
        <button className="btn-primary" disabled={formats.length===0} style={{opacity:formats.length===0?0.5:1}} onClick={()=>formats.length>0 && onSubmit({template, formats})}>
          <Icon name="sparkles" size={16}/> 생성하기
        </button>
      </div>
    </>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [cards, setCards] = useState(INITIAL_CARDS);
  const {toasts, push} = useToasts();

  useEffect(()=>{
    const handler = (e) => {
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
      if(e.key==='Escape') setCmdkOpen(false);
    };
    window.addEventListener('keydown', handler);
    return ()=> window.removeEventListener('keydown', handler);
  },[]);

  const crumbs = {
    main:'분기 정산 워크플로우 보드', upload:'판매 데이터 업로드', mapping:'채널 양식 매핑', report:'로열티 보고서'
  };

  return (
    <div style={{width:'100%'}} data-archetype="linear-sidebar-cmdk">
      <div className="app-shell">
        <Sidebar screen={screen} setScreen={setScreen} toast={push}/>
        <div className="main-wrap">
          <header className="topbar">
            <nav className="breadcrumb">
              <a onClick={()=>setScreen('main')}>정산 관리</a>
              <span className="divider">/</span>
              <span className="current"><span className="live-dot"></span>{crumbs[screen]}</span>
            </nav>
            <div className="topbar-actions">
              <button className="btn-cmdk" data-cmdk-trigger onClick={()=>setCmdkOpen(true)}><Icon name="search" size={14}/> 검색 <span className="kbd">⌘ K</span></button>
              <button className="btn-icon" onClick={()=>push('새 알림이 없습니다')}><Icon name="bell" size={18}/></button>
            </div>
          </header>
          <div className="content">
            {screen==='main' && <MainBoard cards={cards} setCards={setCards} toast={push}/>}
            {screen==='upload' && <UploadScreen toast={push}/>}
            {screen==='mapping' && <MappingScreen toast={push}/>}
            {screen==='report' && <ReportScreen cards={cards} toast={push}/>}
          </div>
        </div>
      </div>
      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNavigate={setScreen}/>
      <ToastStack toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
