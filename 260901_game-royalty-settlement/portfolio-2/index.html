<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 사업 통합 관리 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --primary:#5683da;
    --secondary:#d1d1d1;
    --accent:#ff8964;
    --bg:#ffffff;
    --surface:#f6f6f6;
    --tint:#e5e5e7;
    --text:#090a0c;
    --text2:#95979e;
    --border:#e5e5e7;
    --shadow-sm:rgba(0,0,0,0.08) 0px 2px 6px 0px;
    --shadow-md:rgba(0,0,0,0.10) 0px 6px 20px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  ::selection{background:var(--primary);color:#fff;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.3;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes drawIn{from{stroke-dashoffset:1000;}to{stroke-dashoffset:0;}}

  .shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

  .app-header{
    position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:20px;
    padding:0 28px;background:#fff;border-bottom:1px solid var(--border);width:100%;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;flex-shrink:0;}
  .brand-mark{width:30px;height:30px;border-radius:9999px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;}
  .project-switcher{
    display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;background:var(--surface);
    font-size:13px;font-weight:500;position:relative;
  }
  .switcher-menu{
    position:absolute;top:44px;left:0;background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow-md);width:230px;padding:6px;z-index:30;animation:slideDown 160ms ease-out;
  }
  .switcher-item{padding:10px 12px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between;}
  .switcher-item:hover{background:var(--surface);}
  .header-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .icon-btn{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background 120ms ease-out;}
  .icon-btn:hover{background:var(--surface);color:var(--text);}
  .avatar{width:32px;height:32px;border-radius:50%;}

  .tab-bar{
    display:flex;gap:6px;padding:12px 28px;border-bottom:1px solid var(--border);background:#fff;
    position:sticky;top:64px;z-index:19;overflow-x:auto;width:100%;
  }
  .tab{
    padding:9px 18px;border-radius:9999px;font-size:13px;font-weight:600;color:var(--text2);
    display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background 120ms ease-out,color 120ms ease-out;
  }
  .tab.active{background:var(--primary);color:#fff;}
  .tab:not(.active):hover{background:var(--surface);color:var(--text);}

  .content{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:28px 28px 70px;}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .page-title{font-size:24px;font-weight:700;letter-spacing:-0.48px;}
  .page-sub{font-size:13px;color:var(--text2);margin-top:6px;}

  .filters-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  select,input,textarea{font-family:inherit;font-size:13px;color:var(--text);}
  .pill-select{padding:9px 14px;border-radius:9999px;border:1px solid var(--secondary);background:#fff;}

  .btn-primary{display:flex;align-items:center;gap:7px;padding:11px 22px;border-radius:9999px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;transition:filter 120ms,transform 120ms;}
  .btn-primary:hover{filter:brightness(0.93);transform:translateY(-1px);}
  .btn-ghost{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9999px;border:1px solid var(--secondary);color:var(--text);font-size:13px;font-weight:500;transition:background 120ms;}
  .btn-ghost:hover{background:var(--surface);}
  .btn-sm{padding:7px 14px;font-size:12px;}

  .insight-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-bottom:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);}
  .hero-viz{padding:26px;}
  .hero-viz-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
  .hero-viz-title{font-size:15px;font-weight:700;}
  .hero-viz-sub{font-size:12px;color:var(--text2);margin-top:4px;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--text2);}
  .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}

  .kpi-side{display:flex;flex-direction:column;gap:14px;}
  .kpi-card{padding:18px;animation:fadeInUp 340ms ease-out both;transition:transform 160ms ease-out;}
  .kpi-card:hover{transform:scale(1.02);}
  .kpi-label{font-size:12px;color:var(--text2);font-weight:600;}
  .kpi-value{font-size:42px;font-weight:700;letter-spacing:-1.6px;margin-top:6px;}
  .kpi-trend{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:4px;}
  .kpi-trend.up{color:#1a9d6c;}
  .kpi-trend.down{color:#e0523c;}

  .widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .widget{padding:20px;}
  .widget-title{font-size:13px;font-weight:700;margin-bottom:16px;}

  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12px;}
  .donut-legend-item{display:flex;align-items:center;gap:7px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-label{font-size:12px;width:84px;flex-shrink:0;color:var(--text2);}
  .bar-track{flex:1;height:10px;border-radius:9999px;background:var(--surface);overflow:hidden;}
  .bar-fill{height:100%;border-radius:9999px;background:var(--primary);transform-origin:left;animation:barGrow 700ms ease-out both;}
  .bar-value{font-size:12px;font-weight:600;width:60px;text-align:right;}

  .progress-item{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;}
  .progress-track{flex:1;height:8px;border-radius:9999px;background:var(--surface);overflow:hidden;}
  .progress-fill{height:100%;border-radius:9999px;transform-origin:left;animation:barGrow 700ms ease-out both;}

  .sub-tabs{display:inline-flex;background:var(--surface);border-radius:9999px;padding:4px;margin-bottom:20px;}
  .sub-tabs button{padding:8px 16px;border-radius:9999px;font-size:12px;font-weight:600;color:var(--text2);}
  .sub-tabs button.active{background:#fff;color:var(--text);box-shadow:var(--shadow-sm);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;padding:12px 16px;border-bottom:1px solid var(--border);}
  td{padding:15px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-hover:hover{background:var(--surface);cursor:pointer;}
  .table-card{overflow:hidden;}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 12px;border-radius:9999px;background:var(--surface);color:var(--text2);font-weight:500;}
  .chip.on{background:rgba(86,131,218,0.12);color:var(--primary);}
  .chip.warn{background:rgba(255,137,100,0.16);color:#c65a2f;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:9999px;}
  .badge.ok{background:rgba(26,157,108,0.12);color:#1a9d6c;}
  .badge.warn{background:rgba(255,137,100,0.16);color:#c65a2f;}
  .badge.off{background:var(--surface);color:var(--text2);}

  .expand-row{background:var(--surface);}
  .expand-panel{padding:18px 22px;display:flex;gap:24px;flex-wrap:wrap;}
  .expand-block{min-width:200px;}
  .expand-block-title{font-size:11px;color:var(--text2);font-weight:700;margin-bottom:8px;text-transform:uppercase;}

  .toggle{width:38px;height:22px;border-radius:9999px;background:var(--secondary);position:relative;transition:background 150ms;flex-shrink:0;}
  .toggle.on{background:var(--primary);}
  .toggle-dot{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform 150ms;}
  .toggle.on .toggle-dot{transform:translateX(16px);}

  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,0.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-md);animation:slideDown 200ms ease-out;}
  .modal.wide{max-width:700px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:17px;font-weight:700;}
  .modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
  .modal-foot{padding:18px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:700;color:var(--text);}
  .field input,.field select,.field textarea{padding:11px 14px;border-radius:4px;border:1px solid var(--secondary);background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}

  .diff-row{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .diff-before{color:#c65a2f;text-decoration:line-through;}
  .diff-after{color:#1a9d6c;font-weight:600;}

  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--secondary);border-top-color:var(--primary);animation:spin 700ms linear infinite;display:inline-block;}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--text);color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-md);animation:toastIn 220ms ease-out;display:flex;align-items:center;gap:9px;min-width:220px;}
  .toast.warn{background:#c65a2f;}

  .preview-strip{display:flex;gap:6px;padding:10px;background:var(--text);border-radius:9999px;margin-top:10px;}
  .preview-tab{padding:7px 14px;border-radius:9999px;font-size:11px;font-weight:600;color:#fff;}
  .preview-tab.hidden{opacity:0.25;text-decoration:line-through;}

  .live-dot{width:7px;height:7px;border-radius:50%;background:#1a9d6c;display:inline-block;animation:pulseDot 1.6s ease-in-out infinite;margin-right:6px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}

  @media (max-width:980px){
    .insight-grid{grid-template-columns:1fr;}
    .widget-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const GAMES = [
  {id:'g1', name:'네온드라이브', channels:['Steam','PlayStation Store'], currency:'USD', basis:'순매출 기준'},
  {id:'g2', name:'미스틱가든', channels:['Nintendo eShop'], currency:'JPY', basis:'총매출 기준'},
  {id:'g3', name:'스카이포트리스', channels:['Steam','Xbox Store','Epic Games Store'], currency:'USD', basis:'순매출 기준'},
  {id:'g4', name:'라스트베슬', channels:['PlayStation Store'], currency:'EUR', basis:'순매출 기준'},
  {id:'g5', name:'크림슨오더', channels:['Steam','Nintendo eShop'], currency:'USD', basis:'총매출 기준'},
  {id:'g6', name:'아이언타이드', channels:['Xbox Store'], currency:'USD', basis:'순매출 기준'},
];

const CHANNELS = [
  {id:'ch1', name:'Steam', account:'partner-steam@ops.internal', rate:1382.4},
  {id:'ch2', name:'PlayStation Store', account:'psn-biz@ops.internal', rate:1382.4},
  {id:'ch3', name:'Nintendo eShop', account:'eshop-jp@ops.internal', rate:9.21},
  {id:'ch4', name:'Xbox Store', account:'xbox-partner@ops.internal', rate:1382.4},
  {id:'ch5', name:'Epic Games Store', account:'epic-dev@ops.internal', rate:1498.7},
];

const MONTHLY = [
  {m:'4월', v:38}, {m:'5월', v:44}, {m:'6월', v:41}, {m:'7월', v:52}, {m:'8월', v:49}, {m:'9월', v:61},
];

function Icon({name, size=16, weight='regular', style}){
  return <i className={`ph${weight==='fill'?'-fill':''} ph-${name}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (message, tone='ok') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, {id, message, tone}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 3200);
  };
  return {toasts, push};
}
function ToastStack({toasts}){
  return <div className="toast-stack">{toasts.map(t=>(
    <div key={t.id} className={"toast"+(t.tone==='warn'?' warn':'')}>
      <Icon name={t.tone==='warn'?'warning':'check-circle'} size={16} weight="fill"/>{t.message}
    </div>
  ))}</div>;
}

function LineChart({data, color, height=220}){
  const w = 640, h = height, pad = 30;
  const max = Math.max(...data.map(d=>d.v)) * 1.15;
  const pts = data.map((d,i)=> [ pad + i*((w-pad*2)/(data.length-1)), h - pad - (d.v/max)*(h-pad*2) ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  const area = line + ` L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:height}}>
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0.25,0.5,0.75].map((f,i)=>(
        <line key={i} x1={pad} x2={w-pad} y1={h-pad-(h-pad*2)*f} y2={h-pad-(h-pad*2)*f} stroke="#eee" strokeWidth="1"/>
      ))}
      <path d={area} fill="url(#areaFill)"/>
      <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeDasharray="1000" style={{animation:'drawIn 900ms ease-out forwards'}}/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p[0]} cy={p[1]} r="4" fill="#fff" stroke={color} strokeWidth="2.5">
          <title>{data[i].m}: 매출지수 {data[i].v}</title>
        </circle>
      ))}
      {data.map((d,i)=>(
        <text key={i} x={pts[i][0]} y={h-8} fontSize="11" fill="#95979e" textAnchor="middle">{d.m}</text>
      ))}
    </svg>
  );
}

function Sparkline({data, color}){
  const w=100,h=32;
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=> [i*(w/(data.length-1)), h - ((v-min)/(max-min||1))*h]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  return <svg width={w} height={h}><path d={line} fill="none" stroke={color} strokeWidth="2"/></svg>;
}

function Donut({segments, size=110}){
  const total = segments.reduce((s,x)=>s+x.value,0);
  let acc = 0;
  const r = size/2 - 12;
  const c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      {segments.map((s,i)=>{
        const frac = s.value/total;
        const dash = frac*c;
        const el = <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color} strokeWidth="14"
          strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-acc}/>;
        acc += dash;
        return el;
      })}
    </svg>
  );
}

function Header({project, setProject, cmdOpen, setCmdOpen, toast}){
  const [open, setOpen] = useState(false);
  const projects = ['게임사업부 정산센터','굿즈사업부 운영센터 (준비중)'];
  return (
    <header className="app-header" data-header>
      <div className="brand"><div className="brand-mark"><Icon name="coin" size={16} weight="fill"/></div>비즈니스 콘솔</div>
      <div style={{position:'relative'}}>
        <button className="project-switcher" onClick={()=>setOpen(o=>!o)}>
          {project} <Icon name="caret-down" size={13}/>
        </button>
        {open && (
          <div className="switcher-menu" onMouseLeave={()=>setOpen(false)}>
            {projects.map(p => (
              <div key={p} className="switcher-item" style={{cursor:'pointer'}} onClick={()=>{setProject(p); setOpen(false);}}>
                {p}{p===project && <Icon name="check" size={14}/>}
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="header-actions">
        <button className="icon-btn" onClick={()=>setCmdOpen(true)}><Icon name="magnifying-glass" size={18}/></button>
        <button className="icon-btn" onClick={()=>toast('새 알림이 없습니다')}><Icon name="bell" size={18}/></button>
        <img className="avatar" src="https://source.boringavatars.com/beam/32/이하은?colors=5683da,ff8964,090a0c,d1d1d1" alt="관리자"/>
      </div>
    </header>
  );
}

function InsightMain({toast}){
  const [gameFilter, setGameFilter] = useState('전체');
  const [periodFilter, setPeriodFilter] = useState('2025년 4분기');
  const [downloading, setDownloading] = useState(false);

  const channelDonut = [
    {label:'Steam', value:41, color:'#5683da'},
    {label:'PlayStation Store', value:27, color:'#ff8964'},
    {label:'Nintendo eShop', value:18, color:'#a9a9aa'},
    {label:'기타', value:14, color:'#d1d1d1'},
  ];
  const topGames = [
    {name:'스카이포트리스', pct:92}, {name:'네온드라이브', pct:78}, {name:'크림슨오더', pct:61}, {name:'라스트베슬', pct:44}, {name:'아이언타이드', pct:29},
  ];
  const collection = [
    {ch:'Steam', pct:100, color:'#1a9d6c'}, {ch:'PlayStation Store', pct:100, color:'#1a9d6c'},
    {ch:'Nintendo eShop', pct:70, color:'#ff8964'}, {ch:'Xbox Store', pct:40, color:'#e0523c'}, {ch:'Epic Games Store', pct:0, color:'#d1d1d1'},
  ];

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">매출 통합 대시보드</div>
          <div className="page-sub"><span className="live-dot"></span>게임·채널·기간을 조합해 매출과 수집 현황을 확인합니다</div>
        </div>
        <button className="btn-ghost" onClick={()=>{
          setDownloading(true);
          setTimeout(()=>{ setDownloading(false); toast('조회 결과 엑셀 파일 다운로드가 시작됩니다'); }, 1000);
        }}>
          {downloading ? <span className="spinner"></span> : <Icon name="file-xls" size={16}/>} 엑셀 다운로드
        </button>
      </div>

      <div className="filters-row">
        <select className="pill-select" value={gameFilter} onChange={e=>setGameFilter(e.target.value)}>
          <option>전체</option>
          {GAMES.map(g=><option key={g.id}>{g.name}</option>)}

                <td>{l.ts}</td>
                <td style={{color:'var(--text2)'}}>{l.reason}</td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan="5" style={{textAlign:'center',color:'var(--text2)',padding:'30px'}}>조건에 맞는 조정 이력이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>

      {detail && (
        <div className="modal-overlay" onMouseDown={()=>setDetail(null)}>
          <div className="modal" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">{detail.game} · {detail.type}</div><button className="icon-btn" onClick={()=>setDetail(null)}><Icon name="x" size={18}/></button></div>
            <div className="modal-body">
              <div style={{fontSize:12,color:'var(--text2)'}}>처리자 {detail.by} · {detail.ts}</div>
              <div className="diff-row"><span>변경 전</span><span className="diff-before">{detail.before}</span><Icon name="arrow-right" size={14}/><span className="diff-after">{detail.after}</span></div>
              <div><div style={{fontSize:12,fontWeight:700,marginBottom:4}}>조정 사유</div><div style={{fontSize:13}}>{detail.reason}</div></div>
            </div>
          </div>
        </div>
      )}

      {newModal && (
        <div className="modal-overlay" onMouseDown={()=>setNewModal(false)}>
          <div className="modal" onMouseDown={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">새 조정 등록</div><button className="icon-btn" onClick={()=>setNewModal(false)}><Icon name="x" size={18}/></button></div>
            <NewAdjustmentForm games={GAMES} toast={toast} onSubmit={(data)=>{
              setLogs(l=>[{id:Date.now(), ...data, by:'박서준', ts:'09/01 09:30'}, ...l]);
              toast('예외 조정이 등록되었습니다');
              setNewModal(false);
            }}/>
          </div>
        </div>
      )}
    </div>
  );
}

function NewAdjustmentForm({games, toast, onSubmit}){
  const [game, setGame] = useState(games[0].name);
  const [type, setType] = useState('환율 수기 조정');
  const [before, setBefore] = useState('');
  const [after, setAfter] = useState('');
  const [reason, setReason] = useState('');
  return (
    <>
      <div className="modal-body">
        <div className="field"><label>대상 게임</label><select value={game} onChange={e=>setGame(e.target.value)}>{games.map(g=><option key={g.id}>{g.name}</option>)}</select></div>
        <div className="field"><label>조정 유형</label><select value={type} onChange={e=>setType(e.target.value)}><option>환율 수기 조정</option><option>매출 누락분 반영</option><option>통화 환산 재계산</option></select></div>
        <div style={{display:'flex',gap:12}}>
          <div className="field" style={{flex:1}}><label>변경 전 금액</label><input value={before} onChange={e=>setBefore(e.target.value)} placeholder="예: 15,840,000원"/></div>
          <div className="field" style={{flex:1}}><label>변경 후 금액</label><input value={after} onChange={e=>setAfter(e.target.value)} placeholder="예: 15,220,000원"/></div>
        </div>
        <div className="field"><label>조정 사유 (필수)</label><textarea rows="2" value={reason} onChange={e=>setReason(e.target.value)} placeholder="조정 사유를 입력하세요"/></div>
      </div>
      <div className="modal-foot">
        <button className="btn-primary" onClick={()=>{
          if(!reason.trim()){ toast('조정 사유를 입력해야 저장할 수 있습니다','warn'); return; }
          if(!before || !after){ toast('변경 전/후 금액을 입력해주세요','warn'); return; }
          onSubmit({game, type, before, after, reason});
        }}><Icon name="check" size={15}/> 등록</button>
      </div>
    </>
  );
}

function CmdSearch({open, onClose, onNavigate}){
  const [q, setQ] = useState('');
  if(!open) return null;
  const items = [
    {label:'매출 통합 대시보드', screen:'main'}, {label:'게임·채널 마스터 & 정산 조건 관리', screen:'master'},
    {label:'역할 기반 계정·권한 관리(RBAC)', screen:'accounts'}, {label:'예외 조정 이력 및 감사 추적', screen:'audit'},
  ].filter(i=>i.label.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal" style={{maxWidth:520}} onMouseDown={e=>e.stopPropagation()}>
        <input autoFocus style={{width:'100%',border:'none',padding:'20px 22px',fontSize:15,outline:'none',borderBottom:'1px solid var(--border)'}}
          placeholder="화면 검색…" value={q} onChange={e=>setQ(e.target.value)}/>
        <div style={{padding:10}}>
          {items.map(it=>(
            <div key={it.screen} className="switcher-item" style={{cursor:'pointer',padding:'12px'}} onClick={()=>{onNavigate(it.screen); onClose();}}>{it.label}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [project, setProject] = useState('게임사업부 정산센터');
  const [cmdOpen, setCmdOpen] = useState(false);
  const {toasts, push} = useToasts();

  return (
    <div className="shell" data-archetype="topbar-analytics">
      <Header project={project} setProject={setProject} setCmdOpen={setCmdOpen} toast={push}/>
      <nav className="tab-bar">
        <button role="tab" title="매출 통합 대시보드" className={"tab"+(screen==='main'?' active':'')} onClick={()=>setScreen('main')}>
          <Icon name="chart-line-up" size={15}/>매출 대시보드
        </button>
        <button role="tab" title="게임·채널 마스터 & 정산 조건 관리" className={"tab"+(screen==='master'?' active':'')} onClick={()=>setScreen('master')}>
          <Icon name="grid-four" size={15}/>게임·채널 마스터
        </button>
        <button role="tab" title="역할 기반 계정·권한 관리(RBAC)" className={"tab"+(screen==='accounts'?' active':'')} onClick={()=>setScreen('accounts')}>
          <Icon name="shield-check" size={15}/>계정·권한 관리
        </button>
        <button role="tab" title="예외 조정 이력 및 감사 추적" className={"tab"+(screen==='audit'?' active':'')} onClick={()=>setScreen('audit')}>
          <Icon name="clipboard-text" size={15}/>감사 추적
        </button>
      </nav>
      <main className="content">
        {screen==='main' && <InsightMain toast={push}/>}
        {screen==='master' && <MasterScreen toast={push}/>}
        {screen==='accounts' && <AccountsScreen toast={push}/>}
        {screen==='audit' && <AuditScreen toast={push}/>}
      </main>
      <CmdSearch open={cmdOpen} onClose={()=>setCmdOpen(false)} onNavigate={setScreen}/>
      <ToastStack toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
