<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보야지OS — 패키지 투어 예약·정산 ERP</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#101010; --graphite:#242424; --slate:#6b7280; --stone:#898989; --silver:#e5e7eb;
  --paper:#f4f4f4; --white:#ffffff; --blue:#0099ff; --green:#3ad98a;
  --info-bg:#eff6fe; --danger:#e0433d; --amber:#c98a1f;
  --radius-card:12px; --radius-input:8px; --radius-pill:9999px;
  --shadow-sm:0 1px 5px -4px rgba(36,36,36,.7), 0 4px 8px 0 rgba(36,36,36,.05);
  --shadow-md:0 1px 5px -4px rgba(19,19,22,.7), 0 0 0 1px rgba(34,42,53,.08), 0 4px 8px 0 rgba(34,42,53,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--paper);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
#app-root{width:100%;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px;}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(58,217,138,.5);}50%{box-shadow:0 0 0 6px rgba(58,217,138,0);}}
@keyframes rippleFx{from{transform:scale(0);opacity:.5;}to{transform:scale(2.4);opacity:0;}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}

/* ── header ── */
.app-header{position:sticky;top:0;z-index:50;background:rgba(244,244,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--silver);}
.header-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 32px;height:60px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex-shrink:0;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;}
.switcher{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--graphite);background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-pill);padding:6px 12px 6px 10px;flex-shrink:0;transition:background .15s;}
.switcher:hover{background:var(--paper);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{font-size:13.5px;font-weight:600;color:var(--slate);padding:7px 12px;border-radius:var(--radius-input);transition:all .15s;}
.nav-link:hover{color:var(--ink);background:var(--white);}
.nav-link.active{color:var(--ink);background:var(--white);box-shadow:var(--shadow-sm);}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-input);display:flex;align-items:center;justify-content:center;color:var(--slate);transition:background .15s;position:relative;}
.icon-btn:hover{background:var(--white);color:var(--ink);}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--paper);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--ink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}

/* ── tab bar ── */
.tab-bar{max-width:1320px;margin:0 auto;display:flex;gap:4px;padding:10px 32px 0;overflow-x:auto;}
.tab{flex-shrink:0;font-size:13.5px;font-weight:600;color:var(--slate);padding:9px 4px 12px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
.tab:hover{color:var(--ink);}
.tab[data-active="true"]{color:var(--ink);border-bottom-color:var(--ink);}

/* ── layout ── */
.content{max-width:1320px;margin:0 auto;padding:28px 32px 80px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;animation:fadeSlideUp .4s ease both;}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;}
.page-sub{font-size:13.5px;color:var(--slate);margin:0;}
.period-group{display:flex;background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-pill);padding:3px;gap:2px;}
.period-btn{font-size:12.5px;font-weight:600;color:var(--slate);padding:6px 14px;border-radius:var(--radius-pill);transition:all .15s;}
.period-btn.active{background:var(--ink);color:#fff;}

/* ── hero-viz + stat-side (insight-board) ── */
.insight-row{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;}
.hero-card{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-card);padding:24px;box-shadow:var(--shadow-sm);animation:fadeSlideUp .45s ease both;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.hero-label{font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;}
.hero-number{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 2px;}
.hero-delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--green);background:rgba(58,217,138,.12);padding:3px 9px;border-radius:var(--radius-pill);}
.hero-chart-wrap{margin-top:14px;height:220px;}
.stat-side{display:flex;flex-direction:column;gap:12px;}
.stat-card{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-sm);animation:fadeSlideUp .45s ease both;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-top{display:flex;justify-content:space-between;align-items:center;}
.stat-label{font-size:12px;font-weight:600;color:var(--slate);}
.stat-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--blue);}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-.01em;}
.stat-spark{height:28px;}
.badge-pending{font-size:11px;font-weight:700;color:var(--amber);background:rgba(201,138,31,.12);padding:2px 8px;border-radius:var(--radius-pill);align-self:flex-start;}

/* ── widget-grid ── */
.widget-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;}
.widget{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-card);padding:18px 20px;box-shadow:var(--shadow-sm);animation:fadeSlideUp .5s ease both;}
.widget-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.widget-title{font-size:14px;font-weight:700;}
.widget-more{font-size:12px;font-weight:600;color:var(--blue);}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f1f1;}
.rank-row:last-child{border-bottom:none;}
.rank-num{width:20px;height:20px;border-radius:6px;background:var(--paper);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--slate);flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-meta{font-size:11px;color:var(--stone);}
.rank-val{font-size:13px;font-weight:700;flex-shrink:0;}
.sync-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f1f1;}
.sync-item:last-child{border-bottom:none;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:5px;flex-shrink:0;animation:pulseDot 2s infinite;}
.sync-dot.warn{background:var(--amber);animation:none;}
.sync-body{flex:1;}
.sync-text{font-size:12.5px;font-weight:600;color:var(--graphite);}
.sync-time{font-size:11px;color:var(--stone);}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-input);background:#fff8f0;margin-bottom:8px;}
.alert-item svg{flex-shrink:0;color:var(--amber);}
.alert-text{font-size:12.5px;font-weight:600;}

/* ── generic buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:9px 16px;border-radius:var(--radius-pill);transition:transform .1s,background .15s;position:relative;overflow:hidden;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#000;}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:var(--white);border:1px solid var(--silver);color:var(--graphite);}
.btn-ghost:hover{background:var(--paper);}
.btn-sm{padding:6px 12px;font-size:12px;}
.ripple-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;animation:rippleFx .5s ease-out forwards;}

/* ── sync screen ── */
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.card{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);animation:fadeSlideUp .45s ease both;}
.card-pad{padding:20px 22px;}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #f1f1f1;}
.card-title{font-size:15px;font-weight:700;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--radius-pill);}
.status-live{background:rgba(58,217,138,.14);color:#178a54;}
.log-table{width:100%;border-collapse:collapse;}
.log-table th{text-align:left;font-size:11px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.03em;padding:10px 22px;border-bottom:1px solid var(--silver);}
.log-table td{padding:12px 22px;font-size:13px;border-bottom:1px solid #f5f5f5;}
.log-table tr:hover td{background:#fafafa;}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);}
.tag-ok{background:rgba(58,217,138,.14);color:#178a54;}
.tag-fail{background:rgba(224,67,61,.12);color:var(--danger);}
.tag-retry{background:var(--info-bg);color:var(--blue);}
.endpoint-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f1f1;}
.endpoint-row:last-child{border-bottom:none;}
.endpoint-name{font-size:13px;font-weight:600;}
.endpoint-meta{font-size:11.5px;color:var(--stone);}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--silver);position:relative;flex-shrink:0;transition:background .15s;}
.toggle.on{background:var(--green);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{left:18px;}

/* ── settlement screen ── */
.settle-table{width:100%;border-collapse:collapse;}
.settle-table th{text-align:left;font-size:11px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.03em;padding:10px 22px;border-bottom:1px solid var(--silver);}
.settle-table td{padding:13px 22px;font-size:13px;border-bottom:1px solid #f5f5f5;}
.settle-table tr{cursor:pointer;}
.settle-table tr:hover td{background:#fafafa;}
.profit-pos{color:#178a54;font-weight:700;}
.settle-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);}
.badge-closed{background:#eef1f4;color:var(--slate);}
.badge-open{background:rgba(0,153,255,.12);color:var(--blue);}
.modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeSlideUp .2s ease both;}
.modal-box{width:460px;max-width:92vw;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:85vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:800;margin:0 0 4px;}
.modal-sub{font-size:12.5px;color:var(--slate);margin:0 0 18px;}
.expense-row{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-bottom:10px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--slate);margin-bottom:4px;display:block;}
.field-input{width:100%;padding:9px 11px;border:1px solid var(--silver);border-radius:var(--radius-input);font-size:13px;font-family:inherit;}
.field-input:focus{outline:2px solid var(--blue);outline-offset:1px;}
.summary-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
.summary-line.total{font-weight:800;font-size:15px;border-top:1px solid var(--silver);padding-top:10px;margin-top:6px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}

/* ── calendar screen ── */
.cal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-nav{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;font-weight:700;color:var(--stone);text-align:center;padding:4px 0;}
.cal-cell{background:var(--white);border:1px solid var(--silver);border-radius:10px;min-height:78px;padding:7px;font-size:11.5px;position:relative;transition:box-shadow .12s;}
.cal-cell.has-event{cursor:pointer;}
.cal-cell.has-event:hover{box-shadow:var(--shadow-md);}
.cal-cell.empty{background:transparent;border:none;}
.cal-date{font-size:12px;font-weight:700;color:var(--graphite);margin-bottom:4px;}
.cal-chip{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-bottom:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-recruit{background:rgba(0,153,255,.14);color:var(--blue);}
.chip-confirmed{background:rgba(58,217,138,.16);color:#178a54;}
.chip-full{background:#f1f1f1;color:var(--stone);}
.seat-bar-wrap{margin-top:16px;}
.seat-legend{display:flex;gap:14px;font-size:11.5px;color:var(--slate);margin-bottom:10px;}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.detail-panel{position:fixed;top:0;right:0;height:100vh;width:380px;max-width:90vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:90;padding:24px;overflow-y:auto;animation:toastIn .25s ease both;}
.detail-close{position:absolute;top:18px;right:18px;}
.seat-track{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:6px;}
.seat-fill{height:100%;border-radius:99px;background:var(--blue);transform-origin:left;animation:barGrow .6s ease both;}

/* toast */
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s ease both;}

@media (max-width:980px){
  .insight-row,.two-col,.widget-grid{grid-template-columns:1fr;}
  .global-nav{display:none;}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo} = React;

/* ── mock data ── */
const TOURS = [
  {id:'t1',name:'발칸 5개국 완전정복 9일',region:'유럽'},
  {id:'t2',name:'다낭·나트랑 골든브릿지 4일',region:'동남아'},
  {id:'t3',name:'스위스 인터라켄 트레킹 7일',region:'유럽'},
  {id:'t4',name:'몰디브 프라이빗 풀빌라 5일',region:'몰디브'},
  {id:'t5',name:'홋카이도 눈꽃열차 4일',region:'일본'},
];
const EVENTS = [
  {id:'e1',tour:'t1',date:'09-08',status:'recruit',cap:32,booked:19,revenue:87400000,expense:61200000},
  {id:'e2',tour:'t2',date:'09-10',status:'confirmed',cap:28,booked:28,revenue:52800000,expense:33500000},
  {id:'e3',tour:'t3',date:'09-13',status:'recruit',cap:20,booked:8,revenue:31200000,expense:19800000},
  {id:'e4',tour:'t4',date:'09-15',status:'full',cap:16,booked:16,revenue:96000000,expense:58900000},
  {id:'e5',tour:'t5',date:'09-19',status:'confirmed',cap:36,booked:30,revenue:64500000,expense:41200000},
  {id:'e6',tour:'t1',date:'09-22',status:'recruit',cap:32,booked:11,revenue:0,expense:0},
  {id:'e7',tour:'t2',date:'09-24',status:'recruit',cap:28,booked:6,revenue:0,expense:0},
  {id:'e8',tour:'t4',date:'09-27',status:'confirmed',cap:16,booked:14,revenue:84000000,expense:52000000},
];
const tourName = id => TOURS.find(t=>t.id===id)?.name || id;
const won = n => '₩' + n.toLocaleString('ko-KR');

const SYNC_LOG = [
  {ok:true,text:'다낭·나트랑 골든브릿지 4일 — 결제완료 웹훅 수신',time:'2분 전'},
  {ok:true,text:'몰디브 프라이빗 풀빌라 5일 — 잔여좌석 2건 동기화',time:'8분 전'},
  {ok:false,text:'홋카이도 눈꽃열차 4일 — 웹훅 서명 검증 실패, 재시도 큐 적재',time:'21분 전'},
  {ok:true,text:'발칸 5개국 완전정복 9일 — 상품 정보 업데이트 반영',time:'34분 전'},
  {ok:true,text:'스위스 인터라켄 트레킹 7일 — 예약 취소 웹훅 처리',time:'51분 전'},
];

function useCountUp(target, dur=900){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    let raf; const start=performance.now();
    const tick=(now)=>{
      const p=Math.min(1,(now-start)/dur);
      setVal(Math.floor(target*(1-Math.pow(1-p,3))));
      if(p<1) raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return val;
}

function Icon({name,size=18,...rest}){
  const ref=useRef(null);
  useEffect(()=>{ if(window.lucide && ref.current){ ref.current.innerHTML=''; const el=document.createElement('i'); el.setAttribute('data-lucide',name); ref.current.appendChild(el); window.lucide.createIcons({nodes:[ref.current]}); } },[name]);
  return <span ref={ref} style={{display:'inline-flex',width:size,height:size}} {...rest}></span>;
}

function Ripple(e){
  const btn=e.currentTarget; const r=btn.getBoundingClientRect();
  const dot=document.createElement('span');
  dot.className='ripple-dot';
  const size=Math.max(r.width,r.height);
  dot.style.width=dot.style.height=size+'px';
  dot.style.left=(e.clientX-r.left-size/2)+'px';
  dot.style.top=(e.clientY-r.top-size/2)+'px';
  btn.appendChild(dot);
  setTimeout(()=>dot.remove(),500);
}

function Sparkline({data,color}){
  const w=100,h=28; const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((d,i)=>`${(i/(data.length-1))*w},${h-((d-min)/(max-min||1))*h}`).join(' ');
  return <svg className="stat-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

function Toasts({items}){
  return <div className="toast-stack">{items.map(t=>(
    <div className="toast" key={t.id}><Icon name="check-circle" size={16}/>{t.text}</div>
  ))}</div>;
}

/* ── main dashboard ── */
function DashboardView({pushToast}){
  const [period,setPeriod]=useState('month');
  const chartRef=useRef(null); const chartInst=useRef(null);
  const totalRevenue=useCountUp(415900000);
  const totalExpense=useCountUp(266600000);
  const netProfit=useCountUp(149300000);

  useEffect(()=>{
    if(!chartRef.current) return;
    const labels = period==='month' ? ['1주','2주','3주','4주'] : period==='quarter' ? ['7월','8월','9월'] : ['1분기','2분기','3분기'];
    const data = period==='month' ? [78,102,131,105] : period==='quarter' ? [265,318,296] : [612,745,689];
    if(chartInst.current) chartInst.current.destroy();
    chartInst.current = new Chart(chartRef.current, {
      type:'line',
      data:{ labels, datasets:[
        {label:'매출',data:data.map(v=>v*1.55),borderColor:'#101010',backgroundColor:'rgba(16,16,16,.05)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#101010'},
        {label:'순수익',data:data,borderColor:'#0099ff',backgroundColor:'rgba(0,153,255,.08)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#0099ff'},
      ]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top',align:'end',labels:{boxWidth:8,boxHeight:8,usePointStyle:true,font:{family:'Pretendard',size:11.5}}}},
        scales:{ y:{ticks:{callback:v=>v+'백만',font:{size:11}},grid:{color:'#f1f1f1'}}, x:{grid:{display:false},ticks:{font:{size:11}}} }
      }
    });
  },[period]);

  const ranking = [...EVENTS].filter(e=>e.revenue>0).map(e=>({...e,profit:e.revenue-e.expense})).sort((a,b)=>b.profit-a.profit).slice(0,5);
  const [expanded,setExpanded]=useState(null);

  return (
    <div className="content">
      <div className="page-head">
        <div>
          <h1 className="page-title">매출·순수익 통계 대시보드</h1>
          <p className="page-sub">행사별·기간별 매출과 순수익을 실시간 집계 데이터로 확인합니다</p>
        </div>
        <div className="period-group">
          {[['month','이번달'],['quarter','분기'],['year','연간']].map(([k,l])=>(
            <button key={k} className={"period-btn"+(period===k?' active':'')} onClick={(e)=>{setPeriod(k);}}>{l}</button>
          ))}
        </div>
      </div>

      <div className="insight-row">
        <div className="hero-card" style={{borderRadius:12, boxShadow:'0 4px 8px rgba(36,36,36,0.05)', padding:24}}>
          <div className="hero-top">
            <div>
              <div className="hero-label">누적 순수익</div>
              <div className="hero-number">{won(netProfit)}</div>
              <span className="hero-delta"><Icon name="trending-up" size={13}/> 매출 대비 35.9%</span>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={(e)=>{Ripple(e); pushToast('리포트가 엑셀로 내보내기 준비됩니다');}}><Icon name="download" size={14}/>내보내기</button>
          </div>
          <div className="hero-chart-wrap"><canvas ref={chartRef}></canvas></div>
        </div>
        <div className="stat-side">
          <div className="stat-card" onClick={()=>pushToast('총매출 상세 내역으로 이동합니다')}>
            <div className="stat-top"><span className="stat-label">총매출</span><span className="stat-icon"><Icon name="wallet" size={14}/></span></div>
            <div className="stat-value">{won(totalRevenue)}</div>
            <Sparkline data={[62,70,66,81,78,92,88]} color="#0099ff"/>
          </div>
          <div className="stat-card" onClick={()=>pushToast('총지출 상세 내역으로 이동합니다')}>
            <div className="stat-top"><span className="stat-label">총지출</span><span className="stat-icon"><Icon name="receipt" size={14}/></span></div>
            <div className="stat-value">{won(totalExpense)}</div>
            <Sparkline data={[40,44,41,52,49,58,55]} color="#898989"/>
          </div>
          <div className="stat-card" onClick={()=>pushToast('정산 마감 대기 3건을 확인합니다')}>
            <div className="stat-top"><span className="stat-label">정산 마감률</span><span className="stat-icon"><Icon name="check-square" size={14}/></span></div>
            <div className="stat-value">62.5%</div>
            <span className="badge-pending">마감 대기 3건</span>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="widget">
          <div className="widget-head"><span className="widget-title">행사별 순수익 랭킹</span><span className="widget-more">전체보기</span></div>
          {ranking.map((r,i)=>(
            <div className="rank-row" key={r.id}>
              <span className="rank-num">{i+1}</span>
              <div className="rank-info"><div className="rank-name">{tourName(r.tour)}</div><div className="rank-meta">출발 {r.date} · 예약 {r.booked}/{r.cap}</div></div>
              <span className="rank-val profit-pos">{won(r.profit)}</span>
            </div>
          ))}
        </div>
        <div className="widget">
          <div className="widget-head"><span className="widget-title">아임웹 동기화 로그</span><span className="widget-more">전체보기</span></div>
          {SYNC_LOG.slice(0,4).map((s,i)=>(
            <div className="sync-item" key={i}>
              <span className={"sync-dot"+(s.ok?'':' warn')}></span>
              <div className="sync-body"><div className="sync-text">{s.text}</div><div className="sync-time">{s.time}</div></div>
            </div>
          ))}
        </div>
        <div className="widget">
          <div className="widget-head"><span className="widget-title">주의 필요 항목</span></div>
          <div className="alert-item"><Icon name="alert-triangle" size={16}/><span className="alert-text">몰디브 5일 — 잔여좌석 0석 도달</span></div>
          <div className="alert-item"><Icon name="alert-triangle" size={16}/><span className="alert-text">홋카이도 4일 — 웹훅 재시도 대기중</span></div>
          <div className="alert-item"><Icon name="alert-triangle" size={16}/><span className="alert-text">발칸 9일 — 정산 마감 기한 D-2</span></div>
        </div>
      </div>
    </div>
  );
}

/* ── sync view ── */
function SyncView({pushToast}){
  const [endpoints,setEndpoints]=useState([
    {name:'주문·결제 웹훅',desc:'POST /webhooks/imweb/order','on':true},
    {name:'예약 취소 웹훅',desc:'POST /webhooks/imweb/cancel','on':true},
    {name:'상품·좌석 동기화 배치',desc:'OpenAPI GET /products · 5분 주기','on':true},
    {name:'잔여좌석 반영 배치',desc:'OpenAPI PATCH /products/stock · 5분 주기','on':false},
  ]);
  const toggle=(i)=>{ setEndpoints(prev=>prev.map((e,idx)=>idx===i?{...e,on:!e.on}:e)); pushToast((endpoints[i].on?'중지':'재개')+'되었습니다 — '+endpoints[i].name); };

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">아임웹 웹훅 실시간 예약 동기화</h1><p className="page-sub">아임웹에서 발생한 주문·결제 이벤트를 실시간으로 수신해 ERP 예약자 데이터에 반영합니다</p></div>
        <span className="status-pill status-live"><span className="sync-dot" style={{margin:0}}></span>실시간 연결됨</span>
      </div>
      <div className="two-col">
        <div className="card">
          <div className="card-head"><span className="card-title">최근 웹훅 수신 이력</span><button className="btn btn-ghost btn-sm" onClick={(e)=>{Ripple(e);pushToast('로그가 새로고침됩니다');}}><Icon name="refresh-cw" size={13}/>새로고침</button></div>
          <table className="log-table">
            <thead><tr><th>이벤트</th><th>상품</th><th>상태</th><th>수신 시각</th></tr></thead>
            <tbody>
              {[
                {ev:'order.paid',t:'다낭·나트랑 골든브릿지 4일',s:'ok',time:'14:32:08'},
                {ev:'order.paid',t:'몰디브 프라이빗 풀빌라 5일',s:'ok',time:'14:19:44'},
                {ev:'order.cancelled',t:'스위스 인터라켄 트레킹 7일',s:'ok',time:'13:58:12'},
                {ev:'order.paid',t:'홋카이도 눈꽃열차 4일',s:'fail',time:'13:11:05'},
                {ev:'stock.sync',t:'발칸 5개국 완전정복 9일',s:'retry',time:'12:47:39'},
              ].map((r,i)=>(
                <tr key={i}>
                  <td>{r.ev}</td><td>{r.t}</td>
                  <td>{r.s==='ok' && <span className="tag tag-ok"><Icon name="check" size={11}/>성공</span>}
                      {r.s==='fail' && <span className="tag tag-fail"><Icon name="x" size={11}/>실패</span>}
                      {r.s==='retry' && <span className="tag tag-retry"><Icon name="rotate-cw" size={11}/>재시도 대기</span>}</td>
                  <td>{r.time}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card card-pad">
          <span className="card-title">연동 엔드포인트</span>
          <div style={{marginTop:12}}>
            {endpoints.map((e,i)=>(
              <div className="endpoint-row" key={i}>
                <div><div className="endpoint-name">{e.name}</div><div className="endpoint-meta">{e.desc}</div></div>
                <div className={"toggle"+(e.on?' on':'')} onClick={()=>toggle(i)}><div className="toggle-knob"></div></div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── settlement view ── */
function SettlementView({pushToast}){
  const [modalEvent,setModalEvent]=useState(null);
  const [expenses,setExpenses]=useState([{cat:'호텔',amt:''},{cat:'가이드',amt:''}]);
  const closedIds = useMemo(()=>new Set(['e2','e4']),[]);

  const addExpense=()=>setExpenses(prev=>[...prev,{cat:'',amt:''}]);
  const updateExpense=(i,field,val)=>setExpenses(prev=>prev.map((e,idx)=>idx===i?{...e,[field]:val}:e));
  const sumExpense=expenses.reduce((s,e)=>s+(Number(e.amt)||0),0);

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">행사별 정산 자동 계산 및 마감 처리</h1><p className="page-sub">지출 내역을 등록하면 매출과 자동으로 상계해 순수익을 계산합니다</p></div>
      </div>
      <div className="card">
        <table className="settle-table">
          <thead><tr><th>행사</th><th>출발일</th><th>매출</th><th>지출</th><th>순수익</th><th>상태</th></tr></thead>
          <tbody>
            {EVENTS.filter(e=>e.revenue>0).map(e=>{
              const profit=e.revenue-e.expense; const closed=closedIds.has(e.id);
              return (
                <tr key={e.id} onClick={()=>setModalEvent(e)}>
                  <td>{tourName(e.tour)}</td><td>{e.date}</td><td>{won(e.revenue)}</td><td>{won(e.expense)}</td>
                  <td className="profit-pos">{won(profit)}</td>
                  <td><span className={"settle-badge "+(closed?'badge-closed':'badge-open')}>{closed?'마감 완료':'마감 대기'}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modalEvent && (
        <div className="modal-overlay" onClick={()=>setModalEvent(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3 className="modal-title">지출 내역 등록</h3>
            <p className="modal-sub">{tourName(modalEvent.tour)} · 출발 {modalEvent.date}</p>
            {expenses.map((e,i)=>(
              <div className="expense-row" key={i}>
                <div><span className="field-label">항목</span><input className="field-input" value={e.cat} onChange={ev=>updateExpense(i,'cat',ev.target.value)} placeholder="예: 차량비"/></div>
                <div><span className="field-label">금액(원)</span><input className="field-input" value={e.amt} onChange={ev=>updateExpense(i,'amt',ev.target.value)} placeholder="0" inputMode="numeric"/></div>
              </div>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={addExpense}><Icon name="plus" size={13}/>항목 추가</button>
            <div style={{marginTop:14}}>
              <div className="summary-line"><span>행사 매출</span><span>{won(modalEvent.revenue)}</span></div>
              <div className="summary-line"><span>신규 등록 지출</span><span>{won(sumExpense)}</span></div>
              <div className="summary-line total"><span>예상 순수익</span><span>{won(modalEvent.revenue - modalEvent.expense - sumExpense)}</span></div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setModalEvent(null)}>닫기</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={(e)=>{Ripple(e); setModalEvent(null); pushToast('정산 지출 내역이 저장되었습니다');}}>저장 후 마감 처리</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── calendar view ── */
function CalendarView({pushToast}){
  const [selected,setSelected]=useState(null);
  const days = Array.from({length:30},(_,i)=>i+1);
  const startOffset = 2; // 09/01 = 화요일 가정
  const eventsByDate = useMemo(()=>{
    const m={}; EVENTS.forEach(e=>{ const d=parseInt(e.date.split('-')[1],10); (m[d]=m[d]||[]).push(e); }); return m;
  },[]);

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">출발일별 예약 캘린더 & OpenAPI 좌석 동기화</h1><p className="page-sub">행사의 출발일별 예약 현황과 잔여좌석을 확인하고 아임웹과 동기화합니다</p></div>
        <div className="cal-nav"><button className="icon-btn" onClick={()=>pushToast('8월로 이동합니다')}><Icon name="chevron-left" size={16}/></button>2026년 9월<button className="icon-btn" onClick={()=>pushToast('10월로 이동합니다')}><Icon name="chevron-right" size={16}/></button></div>
      </div>
      <div className="card card-pad">
        <div className="seat-legend">
          <span><span className="legend-dot" style={{background:'#0099ff'}}></span>모객중</span>
          <span><span className="legend-dot" style={{background:'#3ad98a'}}></span>출발확정</span>
          <span><span className="legend-dot" style={{background:'#898989'}}></span>마감</span>
        </div>
        <div className="cal-grid">
          {['일','월','화','수','목','금','토'].map(d=><div className="cal-dow" key={d}>{d}</div>)}
          {Array.from({length:startOffset}).map((_,i)=><div className="cal-cell empty" key={'e'+i}></div>)}
          {days.map(d=>{
            const evs=eventsByDate[d]||[];
            return (
              <div key={d} className={"cal-cell"+(evs.length?' has-event':'')} onClick={()=>evs.length && setSelected(evs[0])}>
                <div className="cal-date">{d}</div>
                {evs.map(e=>(
                  <span key={e.id} className={"cal-chip "+(e.status==='recruit'?'chip-recruit':e.status==='confirmed'?'chip-confirmed':'chip-full')}>{tourName(e.tour).slice(0,8)}</span>
                ))}
              </div>
            );
          })}
        </div>
      </div>

      {selected && (
        <div className="detail-panel">
          <button className="icon-btn detail-close" onClick={()=>setSelected(null)}><Icon name="x" size={18}/></button>
          <h3 style={{fontSize:18,fontWeight:800,marginTop:6}}>{tourName(selected.tour)}</h3>
          <p style={{fontSize:12.5,color:'#6b7280',margin:'2px 0 18px'}}>출발일 2026-{selected.date}</p>
          <div className="seat-bar-wrap">
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,fontWeight:700}}><span>잔여좌석</span><span>{selected.cap-selected.booked} / {selected.cap}</span></div>
            <div className="seat-track"><div className="seat-fill" style={{width:(selected.booked/selected.cap*100)+'%'}}></div></div>
          </div>
          <div style={{marginTop:20,display:'flex',flexDirection:'column',gap:10}}>
            <button className="btn btn-primary" onClick={(e)=>{Ripple(e);pushToast('아임웹 상품 페이지와 즉시 동기화됩니다');}}><Icon name="refresh-cw" size={14}/>지금 아임웹과 동기화</button>
            <button className="btn btn-ghost" onClick={(e)=>{Ripple(e);pushToast('예약자 명단으로 이동합니다');}}><Icon name="users" size={14}/>예약자 명단 보기</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [view,setView]=useState('main');
  const [toasts,setToasts]=useState([]);
  const [menuOpen,setMenuOpen]=useState(false);
  const pushToast=(text)=>{ const id=Date.now()+Math.random(); setToasts(t=>[...t,{id,text}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600); };

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[view]);

  const NAV = [
    {k:'main',l:'대시보드'},
    {k:'sync',l:'아임웹 연동'},
    {k:'settlement',l:'정산'},
    {k:'calendar',l:'캘린더'},
  ];
  return (
    <div data-archetype="topbar-analytics">
      <header className="app-header">
        <div className="header-row">
          <div className="brand"><span className="brand-mark"><Icon name="compass" size={16}/></span>보야지OS</div>
          <div className="switcher" onClick={()=>{setMenuOpen(m=>!m); pushToast(menuOpen?'사업부 목록을 닫습니다':'패키지 투어 사업부가 선택되어 있습니다');}}>패키지 투어 사업부<Icon name="chevron-down" size={13}/></div>
          <nav className="global-nav">
            {NAV.map(n=>(
              <a key={n.k} className={"nav-link"+(view===n.k?' active':'')} onClick={()=>setView(n.k)}>{n.l}</a>
            ))}
            <a className="nav-link" onClick={()=>pushToast('설정 화면은 관리자 계정으로 접근합니다')}>설정</a>
          </nav>
          <div className="header-actions">
            <button className="icon-btn" onClick={()=>pushToast('검색어를 입력해 상품·예약자를 조회합니다')}><Icon name="search" size={17}/></button>
            <button className="icon-btn" onClick={()=>pushToast('읽지 않은 알림 3건이 있습니다')}><Icon name="bell" size={17}/><span className="notif-dot"></span></button>
            <div className="avatar">전</div>
          </div>
        </div>
        <nav className="tab-bar" role="tablist">
          <button role="tab" className="tab" data-active={view==='main'?'true':'false'} onClick={()=>setView('main')}>매출·순수익 통계 대시보드</button>
          <button role="tab" className="tab" data-active={view==='sync'?'true':'false'} onClick={()=>setView('sync')}>아임웹 웹훅 실시간 예약 동기화</button>
          <button role="tab" className="tab" data-active={view==='settlement'?'true':'false'} onClick={()=>setView('settlement')}>행사별 정산 자동 계산 및 마감 처리</button>
          <button role="tab" className="tab" data-active={view==='calendar'?'true':'false'} onClick={()=>setView('calendar')}>출발일별 예약 캘린더 & OpenAPI 좌석 동기화</button>
        </nav>
      </header>

      {view==='main' && <DashboardView pushToast={pushToast}/>}
      {view==='sync' && <SyncView pushToast={pushToast}/>}
      {view==='settlement' && <SettlementView pushToast={pushToast}/>}
      {view==='calendar' && <CalendarView pushToast={pushToast}/>}

      <Toasts items={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
