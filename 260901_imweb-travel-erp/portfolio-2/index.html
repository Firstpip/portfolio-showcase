<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보야지OS Ops — 여행 상품 통합 운영 플랫폼</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/dist/index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --flame:#fa5d00; --bone:#c0bbb6; --teal:#1ef6da;
  --cream:#fff8f1; --white:#ffffff; --ink:#1d1e1c; --stone:#615f5c;
  --driftwood:#8e8b87; --mist:#d9d9d9; --marigold:#fee3b5; --parchment:#e3d6c5;
  --radius-card:20px; --radius-input:16px; --radius-pill:999px;
  --shadow-sm:0 1px 4px 0 rgba(0,0,0,.08);
  --shadow-lg:6px 4px 24px 0 rgba(250,94,0,.16);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--cream);}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
#app-root{width:100%;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--parchment);border-radius:8px;}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes warmPulse{0%,100%{box-shadow:0 0 0 0 rgba(250,94,0,.35);}50%{box-shadow:0 0 0 7px rgba(250,94,0,0);}}
@keyframes rippleFx{from{transform:scale(0);opacity:.5;}to{transform:scale(2.4);opacity:0;}}
@keyframes queueBar{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}

.shell{display:flex;min-height:100vh;}

/* ── sidebar ── */
.sidebar{width:264px;flex-shrink:0;background:var(--white);border-right:1px solid var(--mist);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px;font-weight:800;font-size:16px;}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--flame);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cmdk-hint{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border:1px solid var(--mist);border-radius:var(--radius-input);padding:9px 12px;margin-bottom:16px;font-size:12.5px;color:var(--stone);cursor:pointer;transition:border-color .15s;}
.cmdk-hint:hover{border-color:var(--flame);}
.kbd{font-size:10.5px;font-weight:700;background:var(--white);border:1px solid var(--mist);border-radius:5px;padding:2px 6px;color:var(--stone);}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-input);font-size:13.5px;font-weight:600;color:var(--stone);position:relative;transition:background .15s,color .15s;}
.sidebar-link:hover{background:var(--cream);color:var(--ink);}
.sidebar-link[data-active="true"]{background:#fff3e8;color:var(--flame);}
.sidebar-link[data-active="true"]::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--flame);}
.sidebar-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--marigold);color:#8a4a00;padding:1px 7px;border-radius:var(--radius-pill);}
.sidebar-section-title{font-size:10.5px;font-weight:700;color:var(--driftwood);text-transform:uppercase;letter-spacing:.05em;padding:16px 12px 6px;}
.sidebar-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--mist);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--flame),#ffb066);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.user-name{font-size:12.5px;font-weight:700;}
.user-role{font-size:11px;color:var(--driftwood);}

/* ── main ── */
.main{flex:1;min-width:0;}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--mist);background:rgba(255,248,241,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--driftwood);}
.breadcrumb a{color:var(--driftwood);font-weight:600;}
.breadcrumb .current{color:var(--ink);font-weight:700;}
.breadcrumb .divider{color:var(--mist);}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.btn-cmdk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--stone);background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-pill);padding:7px 12px;}
.content{padding:26px 28px 80px;}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:10px 18px;border-radius:var(--radius-input);transition:transform .1s,background .15s,box-shadow .15s;position:relative;overflow:hidden;}
.btn-primary{background:var(--flame);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:#e05300;box-shadow:var(--shadow-lg);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:var(--white);border:1px solid var(--mist);color:var(--ink);}
.btn-ghost:hover{background:var(--cream);}
.btn-sm{padding:7px 13px;font-size:12px;}
.ripple-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:rippleFx .5s ease-out forwards;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;animation:fadeSlideUp .4s ease both;}
.page-title{font-size:40px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;}
.live-pulse{width:8px;height:8px;border-radius:50%;background:var(--flame);display:inline-block;animation:warmPulse 2s infinite;}
.page-sub{font-size:13.5px;color:var(--stone);margin:0;max-width:640px;}

.card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);animation:fadeSlideUp .45s ease both;}
.card-pad{padding:22px 24px;}

/* ── master-detail (pipeline) ── */
.md-layout{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start;}
.status-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.status-tab{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:var(--radius-pill);background:var(--white);border:1px solid var(--mist);color:var(--stone);}
.status-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.list-rail{display:flex;flex-direction:column;gap:10px;}
.event-card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-card);padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.event-card:hover{box-shadow:var(--shadow-sm);}
.event-card.selected{border-color:var(--flame);box-shadow:var(--shadow-lg);}
.event-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.event-name{font-size:14px;font-weight:700;}
.event-meta{font-size:11.5px;color:var(--driftwood);margin-top:2px;}
.state-badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);flex-shrink:0;}
.state-recruit{background:#e8f2ff;color:#0d6fc9;}
.state-confirmed{background:#e5f9f0;color:#0f9d58;}
.state-full{background:#f1efec;color:var(--driftwood);}
.state-cancel{background:#fdeaea;color:#c23b3b;}
.seat-mini-track{height:6px;border-radius:99px;background:var(--cream);overflow:hidden;margin-top:8px;}
.seat-mini-fill{height:100%;border-radius:99px;background:var(--flame);transform-origin:left;animation:queueBar .6s ease both;}

.detail-panel{position:sticky;top:76px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.detail-name{font-size:19px;font-weight:800;}
.detail-meta{font-size:12.5px;color:var(--stone);margin-top:3px;}
.stat-mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.stat-mini{background:var(--cream);border-radius:var(--radius-input);padding:12px 14px;}
.stat-mini-label{font-size:11px;color:var(--driftwood);font-weight:600;}
.stat-mini-val{font-size:16px;font-weight:800;margin-top:2px;}
.transition-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.transition-btn{font-size:12px;font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--mist);background:var(--white);}
.transition-btn:hover{border-color:var(--flame);color:var(--flame);}
.transition-btn:disabled{opacity:.4;cursor:not-allowed;}
.empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--driftwood);text-align:center;}

/* ── reservations ── */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:700;padding:7px 13px;border-radius:var(--radius-pill);border:1px solid var(--mist);background:var(--white);color:var(--stone);}
.chip.active{background:#fff3e8;border-color:var(--flame);color:var(--flame);}
.toolbar-actions{display:flex;gap:8px;}
.res-table{width:100%;border-collapse:collapse;}
.res-table th{text-align:left;font-size:11px;font-weight:700;color:var(--driftwood);text-transform:uppercase;letter-spacing:.03em;padding:10px 22px;border-bottom:1px solid var(--mist);}
.res-table td{padding:13px 22px;font-size:13px;border-bottom:1px solid #f4f0eb;}
.res-table tr:hover td{background:#fffaf5;}
.source-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-pill);}
.source-online{background:#e8f2ff;color:#0d6fc9;}
.source-offline{background:var(--marigold);color:#8a4a00;}
.status-select{font-size:12px;font-weight:700;border:1px solid var(--mist);border-radius:var(--radius-pill);padding:5px 10px;background:var(--white);}
.modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeSlideUp .2s ease both;}
.modal-box{width:460px;max-width:92vw;background:#fff;border-radius:22px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:85vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:800;margin:0 0 4px;}
.modal-sub{font-size:12.5px;color:var(--stone);margin:0 0 18px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--stone);margin-bottom:4px;display:block;}
.field-input,.field-select{width:100%;padding:10px 13px;border:1px solid var(--mist);border-radius:var(--radius-input);font-size:13px;font-family:inherit;margin-bottom:12px;}
.field-input:focus,.field-select:focus{outline:2px solid var(--flame);outline-offset:1px;}
.modal-actions{display:flex;gap:8px;margin-top:6px;}

/* ── bulk-create ── */
.bc-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.dow-row{display:flex;gap:8px;margin:10px 0 16px;}
.dow-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--mist);background:var(--white);font-size:12.5px;font-weight:700;color:var(--stone);}
.dow-btn.active{background:var(--flame);color:#fff;border-color:var(--flame);}
.range-row{display:flex;gap:10px;align-items:center;}
.preview-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.preview-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--cream);border-radius:var(--radius-input);font-size:12.5px;font-weight:600;}
.preview-item .dow-label{color:var(--driftwood);font-weight:500;margin-left:6px;}
.clone-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f4f0eb;}
.clone-row:last-child{border-bottom:none;}

/* ── notifications ── */
.notif-table{width:100%;border-collapse:collapse;}
.notif-table th{text-align:left;font-size:11px;font-weight:700;color:var(--driftwood);text-transform:uppercase;letter-spacing:.03em;padding:10px 22px;border-bottom:1px solid var(--mist);}
.notif-table td{padding:13px 22px;font-size:13px;border-bottom:1px solid #f4f0eb;}
.channel-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);}
.channel-kakao{background:#fff3d0;color:#8a6d00;}
.channel-sms{background:#e8f2ff;color:#0d6fc9;}
.channel-email{background:#eee7fb;color:#6a3fc9;}
.status-sent{color:#0f9d58;font-weight:700;}
.status-queued{color:var(--flame);font-weight:700;}
.status-failed{color:#c23b3b;font-weight:700;}
.retry-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f4f0eb;}
.retry-row:last-child{border-bottom:none;}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--mist);position:relative;flex-shrink:0;transition:background .15s;}
.toggle.on{background:var(--flame);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{left:18px;}

/* ── cmdk overlay ── */
.cmdk-overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:200;}
.cmdk-modal{width:520px;max-width:90vw;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden;animation:cmdkIn .18s ease both;}
.cmdk-input{width:100%;border:none;border-bottom:1px solid var(--mist);padding:16px 20px;font-size:15px;font-family:inherit;outline:none;}
.cmdk-results{padding:8px;max-height:300px;overflow-y:auto;}
.cmdk-group-title{font-size:10.5px;font-weight:700;color:var(--driftwood);text-transform:uppercase;padding:8px 10px 4px;}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;}
.cmdk-item:hover{background:var(--cream);}
.cmdk-item .kbd{margin-left:auto;}

/* toast */
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:250;}
.toast{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s ease both;}

@media (max-width:980px){
  .md-layout,.bc-layout{grid-template-columns:1fr;}
  .sidebar{width:76px;}
  .sidebar-link span.label{display:none;}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

function Icon({name,size=17,style}){
  return <i className={"ph ph-"+name} style={{fontSize:size,lineHeight:1,...style}}></i>;
}
function Ripple(e){
  const btn=e.currentTarget; const r=btn.getBoundingClientRect();
  const dot=document.createElement('span'); dot.className='ripple-dot';
  const size=Math.max(r.width,r.height);
  dot.style.width=dot.style.height=size+'px';
  dot.style.left=(e.clientX-r.left-size/2)+'px'; dot.style.top=(e.clientY-r.top-size/2)+'px';
  btn.appendChild(dot); setTimeout(()=>dot.remove(),500);
}
const won = n => '₩'+n.toLocaleString('ko-KR');

const TOURS=[
  {id:'t1',name:'발칸 5개국 완전정복 9일'},
  {id:'t2',name:'다낭·나트랑 골든브릿지 4일'},
  {id:'t3',name:'스위스 인터라켄 트레킹 7일'},
  {id:'t4',name:'몰디브 프라이빗 풀빌라 5일'},
  {id:'t5',name:'홋카이도 눈꽃열차 4일'},
];
const tourName=id=>TOURS.find(t=>t.id===id)?.name||id;

const INITIAL_EVENTS=[
  {id:'e1',tour:'t1',date:'2026-09-08',status:'recruit',cap:32,booked:19,revenue:87400000,expense:61200000},
  {id:'e2',tour:'t2',date:'2026-09-10',status:'confirmed',cap:28,booked:28,revenue:52800000,expense:33500000},
  {id:'e3',tour:'t3',date:'2026-09-13',status:'recruit',cap:20,booked:8,revenue:31200000,expense:19800000},
  {id:'e4',tour:'t4',date:'2026-09-15',status:'full',cap:16,booked:16,revenue:96000000,expense:58900000},
  {id:'e5',tour:'t5',date:'2026-09-19',status:'confirmed',cap:36,booked:30,revenue:64500000,expense:41200000},
  {id:'e6',tour:'t1',date:'2026-09-22',status:'cancel',cap:32,booked:4,revenue:5200000,expense:1800000},
];
const STATUS_LABEL={recruit:'모객중',confirmed:'출발확정',full:'마감',cancel:'취소'};
const STATUS_CLASS={recruit:'state-recruit',confirmed:'state-confirmed',full:'state-full',cancel:'state-cancel'};
const NEXT_STATE={recruit:['confirmed','cancel'],confirmed:['full','cancel'],full:[],cancel:[]};

function Toasts({items}){
  return <div className="toast-stack">{items.map(t=>(<div className="toast" key={t.id}><Icon name="check-circle" size={16}/>{t.text}</div>))}</div>;
}

function CmdK({open,onClose,onNav}){
  const [q,setQ]=useState('');
  const items=[
    {icon:'kanban',label:'행사 진행 상태 파이프라인 관리',go:'main'},
    {icon:'users-three',label:'예약자 통합 관리 & 오프라인 예약 등록',go:'reservations'},
    {icon:'copy',label:'다중 출발일 행사 일괄 생성',go:'bulk-create'},
    {icon:'bell-ringing',label:'알림톡·SMS·이메일 자동 발송 큐',go:'notifications'},
  ].filter(i=>i.label.includes(q));
  if(!open) return null;
  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()}>
        <input autoFocus className="cmdk-input" placeholder="명령 또는 화면 검색…" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="cmdk-results">
          <div className="cmdk-group-title">이동</div>
          {items.map(i=>(
            <div className="cmdk-item" key={i.go} onClick={()=>{onNav(i.go); onClose();}}>
              <Icon name={i.icon} size={16}/>{i.label}<span className="kbd">⏎</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── main: pipeline ── */
function PipelineView({events,setEvents,pushToast}){
  const [filter,setFilter]=useState('all');
  const [selectedId,setSelectedId]=useState('e1');
  const filtered = filter==='all'?events:events.filter(e=>e.status===filter);
  const selected = events.find(e=>e.id===selectedId);
  const counts = { all:events.length, recruit:events.filter(e=>e.status==='recruit').length, confirmed:events.filter(e=>e.status==='confirmed').length, full:events.filter(e=>e.status==='full').length, cancel:events.filter(e=>e.status==='cancel').length };

  const transition=(id,to)=>{
    setEvents(prev=>prev.map(e=>e.id===id?{...e,status:to}:e));
    pushToast(tourName(events.find(e=>e.id===id).tour)+' — '+STATUS_LABEL[to]+' 상태로 변경되었습니다');
  };

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">행사 진행 상태 파이프라인 관리</h1><p className="page-sub">행사를 모객중·출발확정·마감·취소 상태로 관리하고 상세 정보를 즉시 확인합니다</p></div>
        <button className="btn btn-primary" onClick={(e)=>{Ripple(e);pushToast('신규 행사 등록 폼이 열립니다');}}><Icon name="plus" size={14}/>행사 등록</button>
      </div>
      <div className="status-tabs">
        {[['all','전체'],['recruit','모객중'],['confirmed','출발확정'],['full','마감'],['cancel','취소']].map(([k,l])=>(
          <button key={k} className={"status-tab"+(filter===k?' active':'')} onClick={()=>setFilter(k)}>{l} {counts[k]}</button>
        ))}
      </div>
      <div className="md-layout">
        <div className="list-rail">
          {filtered.map(e=>(
            <div key={e.id} className={"event-card"+(selectedId===e.id?' selected':'')} onClick={()=>setSelectedId(e.id)}>
              <div className="event-top">
                <div><div className="event-name">{tourName(e.tour)}</div><div className="event-meta">출발 {e.date} · 예약 {e.booked}/{e.cap}명</div></div>
                <span className={"state-badge "+STATUS_CLASS[e.status]}>{STATUS_LABEL[e.status]}</span>
              </div>
              <div className="seat-mini-track"><div className="seat-mini-fill" style={{width:(e.booked/e.cap*100)+'%'}}></div></div>
            </div>
          ))}
        </div>
        <div className="detail-panel">
          <div className="card card-pad" style={{borderRadius:20, boxShadow:'6px 4px 24px rgba(250,94,0,0.16)', padding:24}}>
            {selected ? (
              <React.Fragment>
                <div className="detail-head">
                  <div><div className="detail-name">{tourName(selected.tour)}</div><div className="detail-meta">출발일 {selected.date}</div></div>
                  <span className={"state-badge "+STATUS_CLASS[selected.status]}>{STATUS_LABEL[selected.status]}</span>
                </div>
                <div className="stat-mini-row">
                  <div className="stat-mini"><div className="stat-mini-label">예약 인원</div><div className="stat-mini-val">{selected.booked}/{selected.cap}</div></div>
                  <div className="stat-mini"><div className="stat-mini-label">매출</div><div className="stat-mini-val">{won(selected.revenue)}</div></div>
                  <div className="stat-mini"><div className="stat-mini-label">순수익</div><div className="stat-mini-val">{won(selected.revenue-selected.expense)}</div></div>
                </div>
                <span className="field-label" style={{marginTop:4}}>상태 전이</span>
                <div className="transition-row">
                  {['recruit','confirmed','full','cancel'].map(s=>(
                    <button key={s} className="transition-btn" disabled={!NEXT_STATE[selected.status].includes(s)} onClick={()=>transition(selected.id,s)}>{STATUS_LABEL[s]}로 변경</button>
                  ))}
                </div>
                <button className="btn btn-ghost" style={{marginTop:16,width:'100%'}} onClick={(e)=>{Ripple(e);pushToast('예약자 명단으로 이동합니다');}}><Icon name="users-three" size={14}/>예약자 명단 보기</button>
              </React.Fragment>
            ) : (
              <div className="empty-detail"><Icon name="cursor-click" size={28}/><p>좌측에서 행사를 선택하면 상세 정보가 표시됩니다</p></div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── reservations ── */
const RESERVATIONS=[
  {id:'r1',name:'김도윤',tour:'t2',phone:'010-22**-99**',status:'예약확정',source:'online'},
  {id:'r2',name:'박서연',tour:'t4',phone:'010-33**-11**',status:'예약확정',source:'online'},
  {id:'r3',name:'이하준',tour:'t1',phone:'010-44**-88**',status:'대기',source:'offline'},
  {id:'r4',name:'최지우',tour:'t5',phone:'010-55**-22**',status:'예약확정',source:'online'},
  {id:'r5',name:'정민서',tour:'t3',phone:'010-66**-77**',status:'취소',source:'online'},
  {id:'r6',name:'한소율',tour:'t2',phone:'010-77**-33**',status:'대기',source:'offline'},
];
function ReservationsView({pushToast}){
  const [rows,setRows]=useState(RESERVATIONS);
  const [filter,setFilter]=useState('all');
  const [showModal,setShowModal]=useState(false);
  const filtered = filter==='all'?rows:rows.filter(r=>r.source===filter);
  const updateStatus=(id,status)=>{ setRows(prev=>prev.map(r=>r.id===id?{...r,status}:r)); pushToast('예약 상태가 '+status+'(으)로 변경되었습니다'); };

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">예약자 통합 관리 & 오프라인 예약 등록</h1><p className="page-sub">온라인·오프라인 예약을 하나의 목록에서 관리하고 엑셀로 내보냅니다</p></div>
      </div>
      <div className="toolbar">
        <div className="filter-chips">
          <button className={"chip"+(filter==='all'?' active':'')} onClick={()=>setFilter('all')}>전체 {rows.length}</button>
          <button className={"chip"+(filter==='online'?' active':'')} onClick={()=>setFilter('online')}>온라인</button>
          <button className={"chip"+(filter==='offline'?' active':'')} onClick={()=>setFilter('offline')}>오프라인</button>
        </div>
        <div className="toolbar-actions">
          <button className="btn btn-ghost btn-sm" onClick={(e)=>{Ripple(e);pushToast('예약자 명단이 엑셀 파일로 다운로드됩니다');}}><Icon name="download-simple" size={14}/>엑셀 다운로드</button>
          <button className="btn btn-ghost btn-sm" onClick={(e)=>{Ripple(e);pushToast('엑셀 파일 업로드 창이 열립니다');}}><Icon name="upload-simple" size={14}/>엑셀 업로드</button>
          <button className="btn btn-primary btn-sm" onClick={(e)=>{Ripple(e);setShowModal(true);}}><Icon name="plus" size={14}/>오프라인 예약 등록</button>
        </div>
      </div>
      <div className="card">
        <table className="res-table">
          <thead><tr><th>예약자</th><th>연락처</th><th>행사</th><th>출처</th><th>상태</th></tr></thead>
          <tbody>
            {filtered.map(r=>(
              <tr key={r.id}>
                <td>{r.name}</td><td>{r.phone}</td><td>{tourName(r.tour)}</td>
                <td><span className={"source-badge "+(r.source==='online'?'source-online':'source-offline')}>{r.source==='online'?'온라인':'오프라인'}</span></td>
                <td>
                  <select className="status-select" value={r.status} onChange={ev=>updateStatus(r.id,ev.target.value)}>
                    <option>예약확정</option><option>대기</option><option>취소</option>
                  </select>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {showModal && (
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3 className="modal-title">오프라인 예약 등록</h3>
            <p className="modal-sub">전화·카운터로 접수된 예약을 수동으로 등록합니다</p>
            <span className="field-label">예약자명</span><input className="field-input" placeholder="예: 홍길동"/>
            <span className="field-label">연락처</span><input className="field-input" placeholder="010-0000-0000"/>
            <span className="field-label">행사 선택</span>
            <select className="field-select">{TOURS.map(t=>(<option key={t.id}>{t.name}</option>))}</select>
            <span className="field-label">결제 상태</span>
            <select className="field-select"><option>예약확정</option><option>대기</option></select>
            <div className="modal-actions">
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowModal(false)}>취소</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={(e)=>{Ripple(e);setShowModal(false);pushToast('오프라인 예약이 등록되었습니다');}}>등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── bulk-create ── */
function BulkCreateView({pushToast}){
  const [selectedDow,setSelectedDow]=useState(new Set([2,5]));
  const [tour,setTour]=useState(TOURS[0].id);
  const dows=['일','월','화','수','목','금','토'];
  const toggleDow=(i)=>setSelectedDow(prev=>{ const s=new Set(prev); s.has(i)?s.delete(i):s.add(i); return s; });

  const preview = useMemo(()=>{
    const list=[]; const base=new Date(2026,9,1);
    for(let i=0;i<42 && list.length<10;i++){
      const d=new Date(base); d.setDate(base.getDate()+i);
      if(selectedDow.has(d.getDay())) list.push(d);
    }
    return list;
  },[selectedDow]);

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">다중 출발일 행사 일괄 생성</h1><p className="page-sub">반복 패턴으로 여러 출발일 행사를 한 번에 생성하고 기존 상품을 복제합니다</p></div>
      </div>
      <div className="bc-layout">
        <div className="card card-pad">
          <span className="field-label">기준 상품</span>
          <select className="field-select" value={tour} onChange={e=>setTour(e.target.value)}>{TOURS.map(t=>(<option key={t.id} value={t.id}>{t.name}</option>))}</select>
          <span className="field-label">반복 요일</span>
          <div className="dow-row">
            {dows.map((d,i)=>(<button key={i} className={"dow-btn"+(selectedDow.has(i)?' active':'')} onClick={()=>toggleDow(i)}>{d}</button>))}
          </div>
          <span className="field-label">생성 기간</span>
          <div className="range-row">
            <input className="field-input" type="date" defaultValue="2026-10-01"/>
            <span style={{color:'var(--driftwood)'}}>~</span>
            <input className="field-input" type="date" defaultValue="2026-11-15"/>
          </div>
          <button className="btn btn-primary" style={{width:'100%',marginTop:6}} onClick={(e)=>{Ripple(e);pushToast(preview.length+'건의 행사가 일괄 생성되었습니다');}}><Icon name="stack-plus" size={15}/>{preview.length}건 일괄 생성</button>

          <div style={{marginTop:22,paddingTop:18,borderTop:'1px solid var(--mist)'}}>
            <span className="field-label" style={{marginBottom:8}}>기존 상품 데이터 복제</span>
            {TOURS.slice(0,3).map(t=>(
              <div className="clone-row" key={t.id}>
                <span style={{fontSize:12.5,fontWeight:600}}>{t.name}</span>
                <button className="btn btn-ghost btn-sm" onClick={(e)=>{Ripple(e);pushToast(t.name+' 상품이 복제되어 신규 초안이 생성되었습니다');}}><Icon name="copy" size={13}/>복제</button>
              </div>
            ))}
          </div>
        </div>
        <div className="card card-pad">
          <span className="field-label" style={{marginBottom:10}}>생성 미리보기 — {tourName(tour)}</span>
          <div className="preview-list">
            {preview.map((d,i)=>(
              <div className="preview-item" key={i}>
                <span><Icon name="calendar-check" size={14} style={{marginRight:6,color:'var(--flame)'}}/>{d.getFullYear()}-{String(d.getMonth()+1).padStart(2,'0')}-{String(d.getDate()).padStart(2,'0')}<span className="dow-label">({dows[d.getDay()]})</span></span>
                <span style={{fontSize:11.5,color:'var(--driftwood)'}}>정원 30명</span>
              </div>
            ))}
            {preview.length===0 && <p style={{fontSize:12.5,color:'var(--driftwood)'}}>반복 요일을 선택하면 생성될 출발일이 표시됩니다</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── notifications ── */
const NOTIF_QUEUE=[
  {id:'n1',channel:'kakao',text:'예약 확정 안내',to:'김도윤',status:'sent'},
  {id:'n2',channel:'sms',text:'출발 D-3 안내',to:'박서연',status:'sent'},
  {id:'n3',channel:'email',text:'정산 완료 안내서 발송',to:'최지우',status:'queued'},
  {id:'n4',channel:'kakao',text:'예약 확정 안내',to:'한소율',status:'failed'},
  {id:'n5',channel:'sms',text:'출발 D-1 안내',to:'이하준',status:'queued'},
];
const CH_LABEL={kakao:'카카오 알림톡',sms:'SMS',email:'이메일'};
const CH_CLASS={kakao:'channel-kakao',sms:'channel-sms',email:'channel-email'};
function NotificationsView({pushToast}){
  const [rows,setRows]=useState(NOTIF_QUEUE);
  const [policies,setPolicies]=useState({kakao:true,sms:true,email:false});
  const retryFailed=(id)=>{ setRows(prev=>prev.map(r=>r.id===id?{...r,status:'queued'}:r)); pushToast('재발송 큐에 다시 적재되었습니다'); };
  const togglePolicy=(k)=>{ setPolicies(p=>({...p,[k]:!p[k]})); pushToast(CH_LABEL[k]+' 자동 재시도가 '+(policies[k]?'중지':'활성화')+'되었습니다'); };

  return (
    <div className="content">
      <div className="page-head">
        <div><h1 className="page-title">알림톡·SMS·이메일 자동 발송 큐</h1><p className="page-sub">예약 확정, 출발 안내, 정산 완료 이벤트에 따라 채널별 알림을 자동 발송합니다</p></div>
      </div>
      <div className="bc-layout">
        <div className="card">
          <table className="notif-table">
            <thead><tr><th>채널</th><th>내용</th><th>수신자</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {rows.map(r=>(
                <tr key={r.id}>
                  <td><span className={"channel-tag "+CH_CLASS[r.channel]}>{CH_LABEL[r.channel]}</span></td>
                  <td>{r.text}</td><td>{r.to}</td>
                  <td>
                    {r.status==='sent' && <span className="status-sent"><Icon name="check-circle" size={13}/> 발송완료</span>}
                    {r.status==='queued' && <span className="status-queued"><Icon name="clock" size={13}/> 대기중</span>}
                    {r.status==='failed' && <span className="status-failed"><Icon name="x-circle" size={13}/> 실패</span>}
                  </td>
                  <td>{r.status==='failed' && <button className="btn btn-ghost btn-sm" onClick={()=>retryFailed(r.id)}>재발송</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card card-pad">
          <span className="card-title" style={{fontSize:14,fontWeight:700}}>채널별 자동 재시도 정책</span>
          <div style={{marginTop:10}}>
            {Object.keys(policies).map(k=>(
              <div className="retry-row" key={k}>
                <div><div style={{fontSize:13,fontWeight:600}}>{CH_LABEL[k]}</div><div style={{fontSize:11.5,color:'var(--driftwood)'}}>실패 시 최대 3회, 간격 10분</div></div>
                <div className={"toggle"+(policies[k]?' on':'')} onClick={()=>togglePolicy(k)}><div className="toggle-knob"></div></div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState('main');
  const [events,setEvents]=useState(INITIAL_EVENTS);
  const [toasts,setToasts]=useState([]);
  const [cmdkOpen,setCmdkOpen]=useState(false);
  const pushToast=(text)=>{ const id=Date.now()+Math.random(); setToasts(t=>[...t,{id,text}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600); };

  const TITLES={main:'행사 진행 상태 파이프라인 관리',reservations:'예약자 통합 관리 & 오프라인 예약 등록',
    'bulk-create':'다중 출발일 행사 일괄 생성',notifications:'알림톡·SMS·이메일 자동 발송 큐',settings:'공통 및 시스템 설정'};

  return (
    <div className="shell" data-archetype="linear-sidebar-cmdk">
      <aside className="sidebar">
        <div className="sidebar-brand"><span className="brand-mark"><Icon name="airplane-tilt" size={16}/></span>보야지OS Ops</div>
        <div className="cmdk-hint" onClick={()=>setCmdkOpen(true)}>빠른 이동<span className="kbd">⌘K</span></div>
        <nav className="sidebar-nav">
          <a className="sidebar-link" data-active={view==='main'?'true':'false'} onClick={()=>setView('main')}>
            <Icon name="kanban" size={16}/><span className="label">파이프라인</span>
          </a>
          <a className="sidebar-link" data-active={view==='reservations'?'true':'false'} onClick={()=>setView('reservations')}>
            <Icon name="users-three" size={16}/><span className="label">예약자 관리</span><span className="sidebar-count">6</span>
          </a>
          <a className="sidebar-link" data-active={view==='bulk-create'?'true':'false'} onClick={()=>setView('bulk-create')}>
            <Icon name="copy" size={16}/><span className="label">일괄 생성</span>
          </a>
          <a className="sidebar-link" data-active={view==='notifications'?'true':'false'} onClick={()=>setView('notifications')}>
            <Icon name="bell-ringing" size={16}/><span className="label">알림 발송</span><span className="sidebar-count">2</span>
          </a>
        </nav>
        <div className="sidebar-section-title">시스템</div>
        <nav className="sidebar-nav">
          <a className="sidebar-link" data-active={view==='settings'?'true':'false'} onClick={()=>setView('settings')}><Icon name="gear-six" size={16}/><span className="label">공통·시스템 설정</span></a>
        </nav>
        <div className="sidebar-user">
          <div className="avatar">전</div>
          <div><div className="user-name">전예린</div><div className="user-role">운영 관리자</div></div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <nav className="breadcrumb">
            <a>보야지OS Ops</a><span className="divider">/</span><span className="current">{TITLES[view]}</span>
          </nav>
          <div className="topbar-actions">
            <span style={{display:'flex',alignItems:'center',gap:6,fontSize:11.5,fontWeight:700,color:'var(--stone)'}}><span className="live-pulse"></span>아임웹 연동 정상</span>
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><Icon name="magnifying-glass" size={13}/>검색<span className="kbd">⌘K</span></button>
            <div className="avatar" style={{width:30,height:30,fontSize:11}}>전</div>
          </div>
        </div>

        {view==='main' && <PipelineView events={events} setEvents={setEvents} pushToast={pushToast}/>}
        {view==='reservations' && <ReservationsView pushToast={pushToast}/>}
        {view==='bulk-create' && <BulkCreateView pushToast={pushToast}/>}
        {view==='notifications' && <NotificationsView pushToast={pushToast}/>}
        {view==='settings' && (
          <div className="content">
            <div className="page-head"><div><h1 className="page-title">공통 및 시스템 설정</h1><p className="page-sub">관리자 계정 권한과 지역·가이드·차량 등 기초 코드를 관리합니다</p></div></div>
            <div className="card card-pad"><p style={{fontSize:13,color:'var(--stone)'}}>관리자 계정 생성, 권한 세분화, 기초 코드(지역·가이드·차량·거래처) 관리 화면을 이 영역에 구성합니다.</p></div>
          </div>
        )}
      </main>

      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNav={setView}/>
      <Toasts items={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
