<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>필드세이프 ERP — 산업안전 현장점검 관리 시스템</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#101010; --blue:#0099ff; --mint:#3ad98a;
    --paper:#f4f4f4; --white:#ffffff; --graphite:#242424;
    --slate:#6b7280; --stone:#898989; --silver:#e5e7eb;
    --danger:#e5484d; --warn:#f5a524;
    --radius-card:12px; --radius-input:8px; --radius-pill:9999px;
    --shadow-sm: 0 1px 5px -4px rgba(36,36,36,0.7), 0 4px 8px rgba(36,36,36,0.05);
    --shadow-md: 0 4px 8px rgba(34,42,53,0.08), 0 0 0 1px rgba(34,42,53,0.05);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--paper);}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--graphite);-webkit-font-smoothing:antialiased;}
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  /* ===== keyframes ===== */
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,153,255,0.45);}70%{box-shadow:0 0 0 10px rgba(0,153,255,0);}100%{box-shadow:0 0 0 0 rgba(0,153,255,0);}}
  @keyframes cardPop{from{opacity:0;transform:scale(0.97);}to{opacity:1;transform:scale(1);}}
  @keyframes ripple{from{transform:scale(0);opacity:0.5;}to{transform:scale(2.4);opacity:0;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes underlineMove{from{transform:scaleX(0.6);opacity:0.4;}to{transform:scaleX(1);opacity:1;}}

  /* ===== layout shell ===== */
  .shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--white);border-right:1px solid var(--silver);
    display:flex;flex-direction:column;z-index:20;}
  .sidebar-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--silver);flex-shrink:0;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:15px;letter-spacing:-0.2px;color:var(--ink);}
  .brand-sub{font-size:11px;color:var(--stone);}
  .sidebar-cmdk-hint{margin:14px 16px 4px;}
  .cmdk-trigger{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--silver);
    border-radius:var(--radius-input);color:var(--slate);font-size:13px;background:var(--paper);transition:border-color .15s ease;}
  .cmdk-trigger:hover{border-color:var(--stone);}
  .cmdk-trigger .kbd-hint{margin-left:auto;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--white);border:1px solid var(--silver);color:var(--stone);}
  .sidebar-nav{flex:1;overflow-y:auto;padding:10px 12px;}
  .sidebar-section-title{font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:0.04em;padding:14px 10px 6px;}
  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--graphite);
    position:relative;margin-bottom:2px;transition:background .12s ease,color .12s ease;}
  .sidebar-link svg{width:17px;height:17px;stroke-width:1.6;flex-shrink:0;color:var(--slate);}
  .sidebar-link:hover{background:var(--paper);}
  .sidebar-link.active{background:var(--ink);color:#fff;}
  .sidebar-link.active svg{color:#fff;}
  .sidebar-link.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--blue);}
  .sidebar-user{padding:14px 16px;border-top:1px solid var(--silver);display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .avatar-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ink),var(--slate));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
  .user-meta .u-name{font-size:12.5px;font-weight:600;}
  .user-meta .u-role{font-size:11px;color:var(--stone);}

  .main-wrap{margin-left:260px;flex:1;min-width:0;width:calc(100% - 260px);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
    border-bottom:1px solid var(--silver);background:var(--white);position:sticky;top:0;z-index:10;}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--stone);}
  .breadcrumb .crumb-current{color:var(--ink);font-weight:600;}
  .breadcrumb .divider{color:var(--silver);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .btn-cmdk{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-input);border:1px solid var(--silver);
    font-size:12.5px;color:var(--slate);background:var(--paper);}
  .btn-primary{background:var(--ink);color:#fff;padding:9px 18px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden;transition:transform .12s ease,opacity .12s;}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-ghost{background:transparent;border:1px solid var(--silver);color:var(--graphite);padding:9px 16px;border-radius:var(--radius-pill);
    font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:var(--paper);}
  .btn-tag{background:var(--paper);color:var(--graphite);padding:5px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;}
  .btn-tag.active{background:var(--ink);color:#fff;}
  .btn-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--slate);}
  .btn-icon:hover{background:var(--paper);}
  .btn-danger-ghost{background:transparent;border:1px solid rgba(229,72,77,0.35);color:var(--danger);padding:9px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;}
  .btn-danger-ghost:hover{background:rgba(229,72,77,0.06);}

  .content{padding:24px 28px;flex:1;width:100%;}
  .page-head{margin-bottom:18px;}
  .page-title{font-size:36px;font-weight:700;letter-spacing:0.2px;line-height:1.15;color:var(--ink);margin:0 0 6px;}
  .page-desc{font-size:13px;color:var(--slate);margin:0;}

  .ripple-btn{position:relative;overflow:hidden;}
  .ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.5);pointer-events:none;animation:ripple .55s ease-out;}

  /* card */
  .card{background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:18px;animation:cardPop .25s ease both;}
  .card-flat{background:var(--white);border-radius:var(--radius-card);border:1px solid var(--silver);padding:18px;}

  /* ===== calendar-schedule composition ===== */
  .calendar-layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
  .week-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .week-label{font-size:14.5px;font-weight:700;color:var(--ink);}
  .week-nav{display:flex;gap:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .cal-day-col{background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);min-height:340px;
    padding:10px 8px;transition:box-shadow .15s ease,background .15s ease;}
  .cal-day-col.drop-hover{background:#eefaf3;box-shadow:0 0 0 2px var(--mint) inset;}
  .cal-day-col.is-today .cal-day-num{background:var(--ink);color:#fff;}
  .cal-day-head{text-align:center;margin-bottom:8px;}
  .cal-day-name{font-size:11px;color:var(--stone);font-weight:600;}
  .cal-day-num{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;
    font-size:13px;font-weight:700;color:var(--graphite);margin-top:2px;}
  .visit-card{background:var(--paper);border-radius:9px;padding:8px 9px;margin-bottom:7px;cursor:grab;font-size:11.5px;
    border-left:3px solid var(--blue);transition:transform .12s ease,box-shadow .12s ease;animation:slideUp .25s ease both;}
  .visit-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(16,16,16,0.08);}
  .visit-card.dragging{opacity:0.4;}
  .visit-card .v-time{font-weight:700;color:var(--ink);}
  .visit-card .v-site{color:var(--graphite);margin-top:2px;font-weight:600;}
  .visit-card .v-emp{color:var(--slate);margin-top:1px;}
  .gps-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:var(--radius-pill);margin-top:4px;font-weight:600;}
  .gps-badge.ok{background:rgba(58,217,138,0.15);color:#15803d;}
  .gps-badge.warn{background:rgba(229,72,77,0.12);color:var(--danger);}
  .gps-badge.pending{background:var(--silver);color:var(--slate);}

  .slot-panel{position:sticky;top:80px;}
  .slot-title{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .day-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--silver);font-size:12.5px;}
  .day-summary-row:last-child{border-bottom:none;}
  .checkin-box{margin-top:14px;padding:14px;border-radius:10px;background:var(--paper);}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulseDot 1.4s infinite;flex-shrink:0;}
  .gps-result{margin-top:10px;padding:10px;border-radius:9px;font-size:11.5px;line-height:1.6;animation:slideUp .3s ease both;}
  .gps-result.ok{background:rgba(58,217,138,0.12);color:#15803d;}
  .gps-result.warn{background:rgba(229,72,77,0.1);color:var(--danger);}
  .queue-item{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;color:var(--slate);border-bottom:1px dashed var(--silver);}

  /* ===== forms ===== */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:600;color:var(--graphite);}
  .field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--silver);border-radius:var(--radius-input);
    font-size:13px;background:var(--white);color:var(--graphite);outline:none;transition:border-color .12s ease;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .field input.autofilled{background:#f7fbff;border-color:#bfe4ff;color:var(--slate);}
  .field.invalid input,.field.invalid textarea{border-color:var(--danger);}
  .field-error{font-size:11px;color:var(--danger);}
  .checklist-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--silver);
    border-radius:10px;margin-bottom:8px;}
  .toggle-pair{display:flex;gap:6px;}
  .toggle-pair button{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;border:1px solid var(--silver);color:var(--slate);}
  .toggle-pair button.on-pass.selected{background:rgba(58,217,138,0.15);color:#15803d;border-color:transparent;}
  .toggle-pair button.on-fail.selected{background:rgba(229,72,77,0.12);color:var(--danger);border-color:transparent;}

  .upload-zone{border:1.5px dashed var(--silver);border-radius:12px;padding:22px;text-align:center;color:var(--slate);font-size:12.5px;
    position:relative;cursor:pointer;transition:border-color .15s ease,background .15s ease;}
  .upload-zone:hover{border-color:var(--stone);background:var(--paper);}
  .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .photo-thumb{width:78px;height:78px;border-radius:9px;overflow:hidden;position:relative;background:var(--paper);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb .resize-badge{position:absolute;bottom:0;left:0;right:0;font-size:8.5px;background:rgba(16,16,16,0.72);color:#fff;text-align:center;padding:2px 0;}

  .sign-pad-wrap{border:1px solid var(--silver);border-radius:12px;overflow:hidden;background:#fff;}
  .sign-pad-wrap canvas{display:block;width:100%;height:140px;touch-action:none;cursor:crosshair;}
  .sign-toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--paper);border-top:1px solid var(--silver);}
  .sign-status{font-size:11px;color:var(--stone);}
  .sign-status.done{color:#15803d;font-weight:600;}

  .autosave-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--stone);}
  .autosave-pill .dot-tiny{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:pulseDot 1.6s infinite;}

  /* ===== approval / table ===== */
  .filter-tabs{display:flex;gap:4px;margin-bottom:16px;position:relative;border-bottom:1px solid var(--silver);}
  .filter-tab{padding:10px 4px;margin-right:22px;font-size:13px;color:var(--slate);position:relative;font-weight:600;}
  .filter-tab.active{color:var(--ink);}
  .filter-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);animation:underlineMove .2s ease;}
  .report-table{width:100%;border-collapse:collapse;}
  .report-table th{text-align:left;font-size:11.5px;color:var(--stone);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--silver);}
  .report-table td{padding:12px;font-size:13px;border-bottom:1px solid var(--silver);}
  .report-row{transition:background .12s ease;}
  .report-row:hover{background:var(--paper);}
  .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);}
  .status-badge.submitted{background:#eef2ff;color:#4338ca;}
  .status-badge.reviewing{background:#eff6fe;color:var(--blue);}
  .status-badge.rejected{background:rgba(229,72,77,0.12);color:var(--danger);}
  .status-badge.approved{background:rgba(58,217,138,0.15);color:#15803d;}

  /* ===== master data tabs ===== */
  .tab-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .master-list{display:grid;gap:10px;}
  .master-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--white);
    border-radius:11px;box-shadow:var(--shadow-sm);}
  .master-row .m-name{font-weight:700;font-size:13.5px;}
  .master-row .m-meta{font-size:12px;color:var(--slate);margin-top:2px;}
  .role-select{padding:5px 10px;font-size:12px;border:1px solid var(--silver);border-radius:8px;}

  /* ===== attendance ===== */
  .att-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--white);
    border-radius:11px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
  .att-type{display:inline-flex;padding:3px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;background:var(--paper);}

  /* ===== modal / drawer ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,0.45);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fadeIn .18s ease;padding:20px;}
  .modal-box{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;animation:slideUp .22s ease;
    box-shadow:0 24px 60px rgba(16,16,16,0.25);}
  .modal-box.wide{max-width:660px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--silver);}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:20px 22px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--silver);}

  .drawer-overlay{position:fixed;inset:0;background:rgba(16,16,16,0.4);z-index:100;animation:fadeIn .18s ease;}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:-16px 0 40px rgba(16,16,16,0.18);
    animation:slideInRight .22s ease;z-index:101;overflow-y:auto;}

  /* ===== toast ===== */
  .toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 28px rgba(16,16,16,0.3);animation:slideInRight .25s ease;}
  .toast svg{width:16px;height:16px;color:var(--mint);}

  /* ===== cmdk ===== */
  .cmdk-overlay{position:fixed;inset:0;background:rgba(16,16,16,0.4);z-index:150;display:flex;align-items:flex-start;
    justify-content:center;padding-top:12vh;animation:fadeIn .15s ease;}
  .cmdk-modal{width:100%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(16,16,16,0.3);overflow:hidden;animation:slideUp .18s ease;}
  .cmdk-input{width:100%;padding:16px 20px;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--silver);}
  .cmdk-results{max-height:320px;overflow-y:auto;padding:8px;}
  .cmdk-group-title{font-size:11px;color:var(--stone);padding:8px 12px 4px;}
  .cmdk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;}
  .cmdk-item:hover,.cmdk-item.hi{background:var(--paper);}
  .cmdk-item svg{width:16px;height:16px;color:var(--slate);}
  .cmdk-item .kbd{margin-left:auto;font-size:10.5px;color:var(--stone);border:1px solid var(--silver);border-radius:5px;padding:1px 6px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px;}

  @media (max-width:1100px){
    .calendar-layout{grid-template-columns:1fr;}
    .slot-panel{position:static;}
  }
</style>
</head>
<body>
<div id="root" data-archetype="linear-sidebar-cmdk"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ---------------- mock data ---------------- */
function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function getWeekDates(offset){
  const today = new Date();
  today.setDate(today.getDate()+offset*7);
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}
const DOW = ['월','화','수','목','금','토','일'];
const WEEK0 = getWeekDates(0);
const TODAY_STR = fmtDate(new Date());

const SITES = [
  {id:'s1',name:'한빛중공업 제1공장',address:'경기 화성시 산업단지로 45',customer:'(주)한빛중공업',manager:'조상현 부장'},
  {id:'s2',name:'대성화학 저장동',address:'경기 안산시 반월공단 12길 8',customer:'대성화학(주)',manager:'윤미래 과장'},
  {id:'s3',name:'태양물류 A동',address:'경기 평택시 포승읍 물류로 21',customer:'태양물류',manager:'서동균 팀장'},
  {id:'s4',name:'청림조선 3야드',address:'경기 시흥시 정왕대로 90',customer:'청림조선',manager:'남궁혜 대리'},
  {id:'s5',name:'대일전자 반도체동',address:'경기 화성시 향남읍 제조로 3',customer:'대일전자',manager:'이도현 부장'},

/* ---------------- shared bits ---------------- */
function Icon({name,...rest}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[name]);
  return <i data-lucide={name} ref={ref} {...rest}></i>;
}
function RippleButton({className,onClick,children,...rest}){
  const handle = (e)=>{
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const el = document.createElement('span');
    el.className='ripple-el';
    const size = Math.max(rect.width,rect.height);
    el.style.width = el.style.height = size+'px';
    el.style.left = (e.clientX-rect.left-size/2)+'px';
    el.style.top = (e.clientY-rect.top-size/2)+'px';
    btn.appendChild(el);
    setTimeout(()=>el.remove(),550);
    onClick && onClick(e);
  };
  return <button className={'ripple-btn '+(className||'')} onClick={handle} {...rest}>{children}</button>;
}
function Toast({toasts}){
  return <div className="toast-stack">
    {toasts.map(t=>(
      <div className="toast" key={t.id}><Icon name="check-circle-2"/><span>{t.text}</span></div>
    ))}
  </div>;
}
function Modal({title,onClose,children,footer,wide}){

/* ---------------- signature pad ---------------- */
function SignaturePad({label,onDone}){
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasDrawn = useRef(false);
  const [done,setDone] = useState(false);

  const getCtx = ()=>canvasRef.current.getContext('2d');
  const setupCanvas = ()=>{
    const c = canvasRef.current;
    const ratio = window.devicePixelRatio || 1;
    c.width = c.clientWidth*ratio; c.height = c.clientHeight*ratio;
    const ctx = getCtx(); ctx.scale(ratio,ratio);
    ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#101010';
  };
  useEffect(()=>{ setupCanvas(); },[]);

  const pos = (e)=>{
    const rect = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-rect.left,y:p.clientY-rect.top};
  };
  const start = (e)=>{ drawing.current=true; const {x,y}=pos(e); const ctx=getCtx(); ctx.beginPath(); ctx.moveTo(x,y); };
  const move = (e)=>{
    if(!drawing.current) return;
    e.preventDefault();
    const {x,y}=pos(e); const ctx=getCtx(); ctx.lineTo(x,y); ctx.stroke();
    hasDrawn.current = true;
  };
  const end = ()=>{
    if(drawing.current && hasDrawn.current && !done){ setDone(true); onDone(true); }
    drawing.current=false;
  };
  const clear = ()=>{
    const c=canvasRef.current; const ctx=getCtx();
    ctx.clearRect(0,0,c.width,c.height); hasDrawn.current=false; setDone(false); onDone(false);
  };

  return <div className="sign-pad-wrap">
    <canvas ref={canvasRef}
      onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
      onTouchStart={start} onTouchMove={move} onTouchEnd={end}></canvas>
    <div className="sign-toolbar">
      <span className={'sign-status'+(done?' done':'')}>
        {done ? <><Icon name="check" style={{width:12,height:12,verticalAlign:'-1px'}}/> {label} 서명 완료</> : label+' 서명란 — 마우스로 서명해 주세요'}
      </span>
      <button className="btn-tag" onClick={clear}><Icon name="eraser" style={{width:13,height:13}}/>지우기</button>
    </div>
  </div>;
}

function CmdK({open,onClose,onNavigate}){
  const [q,setQ] = useState('');
  const inputRef = useRef(null);
  useEffect(()=>{ if(open){ setQ(''); setTimeout(()=>inputRef.current && inputRef.current.focus(),30);} },[open]);
  if(!open) return null;
  const items = NAV_ITEMS.filter(n=>n.label.includes(q) || q==='');
  return <div className="cmdk-overlay" onMouseDown={(e)=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="cmdk-modal">
      <input ref={inputRef} className="cmdk-input" placeholder="이동할 화면 검색 (예: 승인, 근태, 보고서)"
        value={q} onChange={e=>setQ(e.target.value)}
        onKeyDown={(e)=>{ if(e.key==='Escape') onClose(); if(e.key==='Enter' && items[0]){ onNavigate(items[0].key); onClose(); } }} />
      <div className="cmdk-results">
        <div className="cmdk-group-title">화면 이동</div>
        {items.map(it=>(
          <div className="cmdk-item" key={it.key} onClick={()=>{onNavigate(it.key);onClose();}}>
            <Icon name={it.icon}/><span>{it.label}</span><span className="kbd">⏎</span>
          </div>
        ))}
        {items.length===0 && <div className="cmdk-item" style={{color:'#898989'}}>검색 결과가 없습니다</div>}
      </div>
    </div>
  </div>;
}

function MainView({visits,setVisits,pushToast,openConflict}){
  const [weekOffset,setWeekOffset] = useState(0);
  const [selectedDate,setSelectedDate] = useState(TODAY_STR);
  const [dragId,setDragId] = useState(null);
  const [dragOverDate,setDragOverDate] = useState(null);
  const [checkinVisit,setCheckinVisit] = useState(null);
  const [checking,setChecking] = useState(false);

  const weekDates = getWeekDates(weekOffset);
  const weekLabel = weekDates[0].getMonth()+1+'월 '+weekDates[0].getDate()+'일 — '+(weekDates[6].getMonth()+1)+'월 '+weekDates[6].getDate()+'일';

  const dayVisits = (dateStr)=>visits.filter(v=>v.date===dateStr).sort((a,b)=>a.start-b.start);
  const selectedVisits = dayVisits(selectedDate);
  const unassignedCount = visits.filter(v=>!v.gps.checked).length;

  const onDragStart = (id)=>setDragId(id);
  const onDropDay = (dateStr)=>{
    setDragOverDate(null);
    if(dragId==null) return;
    const moving = visits.find(v=>v.id===dragId);
    if(!moving) return;
    const conflict = visits.find(v=>v.id!==dragId && v.employee===moving.employee && v.date===dateStr && v.start===moving.start);
    if(conflict){
      openConflict({a:moving,b:conflict});
      setDragId(null);
      return;
    }
    setVisits(prev=>prev.map(v=>v.id===dragId?{...v,date:dateStr}:v));
    pushToast(empName(moving.employee)+'님 일정을 '+dateStr+'로 재배정했습니다');
    setDragId(null);
  };

  const runCheckin = (visit)=>{
    setCheckinVisit(visit);
    setChecking(true);
    setTimeout(()=>{
      const verified = visit.id % 3 !== 0;
      const distance = verified ? 40+Math.floor(Math.random()*180) : 380+Math.floor(Math.random()*260);
      setVisits(prev=>prev.map(v=>v.id===visit.id?{...v,gps:{checked:true,verified,distance}}:v));
      setChecking(false);
    },1200);
  };

  return <div>
    <div className="page-head">
      <h1 className="page-title">현장 방문 일정 배정</h1>
      <p className="page-desc">사업장별 방문 일정을 캘린더에서 배정하고, GPS 기반 방문 검증 현황을 함께 확인합니다.</p>
    </div>
    <div className="calendar-layout">
      <div>
        <div className="week-toolbar">
          <span className="week-label">{weekLabel}</span>
          <div className="week-nav">
            <button className="btn-icon" onClick={()=>setWeekOffset(w=>w-1)}><Icon name="chevron-left" style={{width:16,height:16}}/></button>
            <button className="btn-tag" onClick={()=>setWeekOffset(0)}>이번 주</button>
            <button className="btn-icon" onClick={()=>setWeekOffset(w=>w+1)}><Icon name="chevron-right" style={{width:16,height:16}}/></button>
          </div>
        </div>
        <div className="cal-grid">
          {weekDates.map((d,i)=>{
            const dateStr = fmtDate(d);
            const isToday = dateStr===TODAY_STR;
            const isSelected = dateStr===selectedDate;
            return <div key={dateStr}
              className={'cal-day-col'+(isToday?' is-today':'')+(dragOverDate===dateStr?' drop-hover':'')}
              style={isSelected?{boxShadow:'0 0 0 2px #101010 inset'}:{}}
              onClick={()=>setSelectedDate(dateStr)}
              onDragOver={(e)=>{e.preventDefault();setDragOverDate(dateStr);}}
              onDragLeave={()=>setDragOverDate(null)}
              onDrop={()=>onDropDay(dateStr)}>
              <div className="cal-day-head">
                <div className="cal-day-name">{DOW[i]}</div>
                <div className="cal-day-num">{d.getDate()}</div>
              </div>
              {dayVisits(dateStr).map(v=>(
                <div key={v.id} className="visit-card" draggable
                  onDragStart={()=>onDragStart(v.id)}
                  onClick={(e)=>{e.stopPropagation();setSelectedDate(dateStr);}}>
                  <div className="v-time">{pad(v.start)}:00 · {v.type}</div>
                  <div className="v-site">{siteName(v.site)}</div>

                      <Icon name={v.gps.verified?'map-pin-check':'map-pin-x'} style={{width:10,height:10}}/>
                      {v.gps.verified?'GPS 확인':'반경 이탈'}
                    </span>
                  ) : <span className="gps-badge pending"><Icon name="map-pin" style={{width:10,height:10}}/>미체크인</span>}

              ))}
              {dayVisits(dateStr).length===0 && <div style={{fontSize:11,color:'#c4c4c4',textAlign:'center',marginTop:20}}>일정 없음</div>}
            </div>;
          })}
        </div>
      </div>

      <div className="slot-panel">
        <div className="card">
          <div className="slot-title"><Icon name="list-checks" style={{width:16,height:16}}/>{selectedDate} 방문 요약</div>
          {selectedVisits.length===0 && <div style={{fontSize:12,color:'#898989'}}>선택한 날짜에 배정된 방문이 없습니다.</div>}
          {selectedVisits.map(v=>(
            <div className="day-summary-row" key={v.id}>

                  {latest ? '사업장 반경 300m 이내로 확인되었습니다.' : '사업장 반경을 벗어나 배정 담당자에게 경고가 표시됩니다.'}

          </div>

          <div style={{marginTop:14}}>
            <div className="slot-title" style={{fontSize:12.5}}><Icon name="hourglass" style={{width:14,height:14}}/>대기열 — 체크인 미완료 {unassignedCount}건</div>
            {visits.filter(v=>!v.gps.checked).slice(0,4).map(v=>(
              <div className="queue-item" key={v.id}><span>{siteName(v.site)}</span><span>{v.date}</span></div>
            ))}
          </div>
        </div>
      </div>
    </div>
  </div>;
}

    const t = setInterval(()=>setLastSaved(new Date()),8000);
    return ()=>clearInterval(t);
  },[siteId]);

  const site = SITES.find(s=>s.id===siteId);

  const onPhoto = (e)=>{
    const files = Array.from(e.target.files||[]);
    const mapped = files.map((f,i)=>({url:URL.createObjectURL(f),size:(60+Math.random()*40).toFixed(0)}));
    setPhotos(p=>[...p,...mapped]);
    pushToast(files.length+'장 업로드 · 자동 리사이징 완료');
  };
  const setPass = (k,val)=>setChecklist(c=>({...c,[k]:val}));
  const saveDraft = ()=>{ setLastSaved(new Date()); pushToast('임시저장 완료'); };

  const isValid = siteId && Object.values(checklist).some(v=>v!==null) && workerSigned && customerSigned;

  const submit = ()=>{
    setAttempted(true);
    if(!isValid) return;
    addReport({site:siteId,type:reportType,photos:photos.length});
    pushToast('보고서를 제출했습니다 — 승인 대기 목록에 추가되었습니다');
    setSiteId(''); setPhotos([]); setWorkerSigned(false); setCustomerSigned(false); setAttempted(false);
    setChecklist({'1. 소화설비 정상 여부':null,'2. 비상구 확보 여부':null,'3. 개인보호구 비치':null,'4. 위험물 표지판 부착':null,'5. 전기설비 절연 상태':null});
  };

  return <div>
    <div className="page-head" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
      <div>
        <h1 className="page-title">현장 보고서 작성 및 전자서명</h1>
        <p className="page-desc">고정 템플릿 기반 점검 보고서에 사진·전자서명을 통합해 작성합니다.</p>
      </div>
      <span className="autosave-pill"><span className="dot-tiny"></span>{lastSaved ? '마지막 저장 '+pad(lastSaved.getHours())+':'+pad(lastSaved.getMinutes()) : '자동 저장 대기'}</span>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="form-grid">
        <div className={'field'+(attempted && !siteId?' invalid':'')}>
          <label>사업장 선택</label>
          <select value={siteId} onChange={e=>setSiteId(e.target.value)}>
            <option value="">사업장을 선택하세요</option>
            {SITES.map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
          </select>
          {attempted && !siteId && <span className="field-error">사업장을 선택해 주세요</span>}
        </div>
        <div className="field">
          <label>보고서 유형</label>
          <select value={reportType} onChange={e=>setReportType(e.target.value)}>
            <option>정기진단</option><option>위험성평가</option>
          </select>
        </div>
        <div className="field">
          <label>사업장 주소 (자동완성)</label>
          <input className="autofilled" readOnly value={site?site.address:''} placeholder="사업장 선택 시 자동 입력"/>
        </div>
        <div className="field">
          <label>담당자 (자동완성)</label>
          <input className="autofilled" readOnly value={site?site.manager:''} placeholder="사업장 선택 시 자동 입력"/>
        </div>
      </div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="slot-title"><Icon name="clipboard-list" style={{width:16,height:16}}/>점검 항목 체크리스트</div>
      {Object.keys(checklist).map(k=>(
        <div className="checklist-item" key={k}>
          <span style={{fontSize:12.5}}>{k}</span>
          <div className="toggle-pair">
            <button className={'on-pass'+(checklist[k]==='pass'?' selected':'')} onClick={()=>setPass(k,'pass')}>양호</button>
            <button className={'on-fail'+(checklist[k]==='fail'?' selected':'')} onClick={()=>setPass(k,'fail')}>미흡</button>
          </div>
        </div>
      ))}
      {attempted && !Object.values(checklist).some(v=>v!==null) && <span className="field-error">최소 1개 항목을 점검해 주세요</span>}
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="slot-title"><Icon name="camera" style={{width:16,height:16}}/>현장 사진 업로드</div>
      <label className="upload-zone">
        <Icon name="upload" style={{width:20,height:20}}/>
        <div style={{marginTop:6}}>클릭 또는 드래그하여 모바일 카메라 촬영본 업로드</div>
        <input type="file" accept="image/*" multiple onChange={onPhoto}/>
      </label>
      <div className="photo-grid">
        {photos.map((p,i)=>(
          <div className="photo-thumb" key={i}><img src={p.url}/><div className="resize-badge">{p.size}% 리사이징</div></div>
        ))}
      </div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="slot-title"><Icon name="pen-line" style={{width:16,height:16}}/>터치 전자서명</div>
      <div className="form-grid">
        <SignaturePad label="현장 직원" onDone={setWorkerSigned}/>
        <SignaturePad label="고객사 담당자" onDone={setCustomerSigned}/>
      </div>
      {attempted && !(workerSigned && customerSigned) && <div className="field-error" style={{marginTop:10}}>양쪽 서명을 모두 받아야 제출할 수 있습니다</div>}
    </div>

    <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
      <RippleButton className="btn-ghost" onClick={saveDraft}><Icon name="save" style={{width:14,height:14}}/>임시저장</RippleButton>
      <RippleButton className="btn-primary" onClick={submit}><Icon name="send" style={{width:14,height:14}}/>제출하기</RippleButton>
    </div>
  </div>;
}

/* ---------------- Approval ---------------- */
const STATUS_LABEL = {submitted:'제출',reviewing:'검토중',rejected:'반려',approved:'승인완료'};
function ApprovalView({reports,setReports,pushToast}){
  const [filter,setFilter] = useState('all');
  const [selected,setSelected] = useState(null);
  const [rejecting,setRejecting] = useState(false);
  const [rejectText,setRejectText] = useState('');
  const [pdfBusy,setPdfBusy] = useState(false);
  const [pdfUrl,setPdfUrl] = useState(null);

  const filtered = reports.filter(r=>filter==='all'||r.status===filter);

  const openRow = (r)=>{ setSelected(r); setRejecting(false); setRejectText(''); setPdfUrl(null); };

  const approve = ()=>{
    setPdfBusy(true);
    setTimeout(()=>{
      let url = null;
      try{
        const {jsPDF} = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16); doc.text('산업안전 점검 보고서', 20, 20);
        doc.setFontSize(11);
        doc.text('보고서 번호: '+selected.id, 20, 36);
        doc.text('사업장: '+siteName(selected.site), 20, 44);
        doc.text('작성자: '+empName(selected.employee), 20, 52);
        doc.text('점검 유형: '+selected.type, 20, 60);
        doc.text('승인 상태: 승인완료', 20, 68);
        doc.text('현장 사진 '+selected.photos+'건, 전자서명(현장직원/고객사) 포함', 20, 78);
        url = doc.output('bloburl');
      }catch(e){ url = null; }
      setReports(prev=>prev.map(r=>r.id===selected.id?{...r,status:'approved'}:r));
      setSelected(s=>({...s,status:'approved'}));
      setPdfUrl(url);
      setPdfBusy(false);
      pushToast(selected.id+' 승인 완료 — PDF가 생성되었습니다');
    },1400);
  };
  const confirmReject = ()=>{
    if(rejectText.trim().length===0) return;
    setReports(prev=>prev.map(r=>r.id===selected.id?{...r,status:'rejected',rejectReason:rejectText}:r));
    setSelected(null);
    pushToast(selected.id+' 반려 처리 — 작성자에게 재작성 알림을 전송했습니다');
  };

  return <div>
    <div className="page-head">
      <h1 className="page-title">보고서 승인 워크플로우 및 PDF 발급</h1>
      <p className="page-desc">제출된 보고서를 확인·반려·승인하고, 승인 시 서명·사진이 포함된 PDF를 자동 발급합니다.</p>
    </div>
    <div className="filter-tabs">
      {[['all','전체'],['submitted','제출'],['reviewing','검토중'],['rejected','반려'],['approved','승인완료']].map(([k,l])=>(
        <div key={k} className={'filter-tab'+(filter===k?' active':'')} onClick={()=>setFilter(k)}>{l}</div>
      ))}
    </div>
    <div className="card" style={{padding:0}}>
      <table className="report-table">
        <thead><tr><th>보고서 번호</th><th>사업장</th><th>작성자</th><th>유형</th><th>제출일시</th><th>상태</th></tr></thead>
        <tbody>
          {filtered.map(r=>(
            <tr className="report-row" key={r.id} onClick={()=>openRow(r)} style={{cursor:'pointer'}}>
              <td style={{fontWeight:700}}>{r.id}</td>
              <td>{siteName(r.site)}</td>
              <td>{empName(r.employee)}</td>
              <td>{r.type}</td>
              <td>{r.submittedAt}</td>
              <td><span className={'status-badge '+r.status}>{STATUS_LABEL[r.status]}</span></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>

    {selected && (
      <Modal title={selected.id+' 보고서 상세'} onClose={()=>setSelected(null)} wide
        footer={
          rejecting ? (
            <>
              <button className="btn-ghost" onClick={()=>setRejecting(false)}>취소</button>
              <RippleButton className="btn-danger-ghost" onClick={confirmReject} disabled={rejectText.trim().length===0}
                style={rejectText.trim().length===0?{opacity:0.4,cursor:'not-allowed'}:{}}>반려 확정</RippleButton>
            </>
          ) : selected.status==='rejected' || selected.status==='approved' ? (
            <button className="btn-ghost" onClick={()=>setSelected(null)}>닫기</button>
          ) : (
            <>
              <button className="btn-danger-ghost" onClick={()=>setRejecting(true)}>반려</button>
              <RippleButton className="btn-primary" onClick={approve}>{pdfBusy? 'PDF 생성 중…' : '승인'}</RippleButton>
            </>
          )
        }>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
          <span className={'status-badge '+selected.status}>{STATUS_LABEL[selected.status]}</span>
          <span style={{fontSize:12,color:'#6b7280'}}>{selected.submittedAt} 제출</span>
        </div>
        <div className="form-grid" style={{marginBottom:14}}>
          <div className="field"><label>사업장</label><input readOnly value={siteName(selected.site)}/></div>
          <div className="field"><label>작성자</label><input readOnly value={empName(selected.employee)}/></div>
          <div className="field"><label>유형</label><input readOnly value={selected.type}/></div>
          <div className="field"><label>첨부 사진</label><input readOnly value={selected.photos+'장'}/></div>
        </div>
        <div style={{fontSize:12,fontWeight:700,marginBottom:6}}>전자서명</div>
        <div style={{display:'flex',gap:10,marginBottom:14}}>
          <div style={{flex:1,height:56,background:'#f4f4f4',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#898989'}}>현장직원 서명 이미지</div>
          <div style={{flex:1,height:56,background:'#f4f4f4',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#898989'}}>고객사 담당자 서명 이미지</div>
        </div>
        {selected.status==='rejected' && <div className="field-error" style={{marginBottom:10}}>반려 사유: {selected.rejectReason}</div>}
        {rejecting && (
          <div className="field">
            <label>반려 사유 (필수)</label>
            <textarea rows="3" value={rejectText} onChange={e=>setRejectText(e.target.value)} placeholder="반려 사유를 입력하세요"></textarea>
          </div>
        )}
        {pdfUrl && (
          <a href={pdfUrl} target="_blank" className="btn-ghost" style={{marginTop:10,display:'inline-flex'}}>
            <Icon name="download" style={{width:14,height:14}}/>승인 PDF 다운로드
          </a>
        )}
      </Modal>
    )}
  </div>;
}

}

/* ---------------- App ---------------- */
function App(){
  const [view,setView] = useState('main');
  const [cmdkOpen,setCmdkOpen] = useState(false);
  const [toasts,setToasts] = useState([]);
  const [visits,setVisits] = useState(initialVisits);
  const [reports,setReports] = useState(initialReports);
  const [employees,setEmployees] = useState(EMPLOYEES);
  const [attendance,setAttendance] = useState(initialAttendance);
  const [conflict,setConflict] = useState(null);
  const [quickAdd,setQuickAdd] = useState(false);
  const [quickForm,setQuickForm] = useState({site:SITES[0].id,employee:EMPLOYEES[0].id,date:TODAY_STR,start:'9'});

  const pushToast = useCallback((text)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  },[]);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[view,toasts,cmdkOpen,conflict,quickAdd]);

  useEffect(()=>{
    const onKey = (e)=>{
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
      if(e.key==='Escape'){ setCmdkOpen(false); }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);

  const addReport = ({site,type,photos})=>{
    const id = 'R-'+(2402+reports.length);
    setReports(prev=>[{id,site,employee:'e1',type,status:'submitted',submittedAt:'방금 전',photos,rejectReason:''},...prev]);
  };

  const submitQuickAdd = ()=>{
    VISIT_SEQ+=1;
    setVisits(prev=>[...prev,{id:VISIT_SEQ,site:quickForm.site,employee:quickForm.employee,date:quickForm.date,start:Number(quickForm.start),duration:1,type:'정기진단',gps:{checked:false}}]);
    setQuickAdd(false);
    pushToast('새 일정이 배정되었습니다');
  };

  return <div className="shell">
    <Sidebar view={view} setView={setView} onLogout={()=>pushToast('로그아웃되었습니다')}/>
    <div className="main-wrap">
      <Topbar view={view} onCmdk={()=>setCmdkOpen(true)} onQuickAdd={()=>setQuickAdd(true)}/>
      <div className="content">
        {view==='main' && <MainView visits={visits} setVisits={setVisits} pushToast={pushToast} openConflict={setConflict}/>}
        {view==='report-form' && <ReportFormView pushToast={pushToast} addReport={addReport}/>}
        {view==='approval' && <ApprovalView reports={reports} setReports={setReports} pushToast={pushToast}/>}
        {view==='admin-master' && <AdminMasterView employees={employees} setEmployees={setEmployees} pushToast={pushToast}/>}
        {view==='attendance' && <AttendanceView attendance={attendance} setAttendance={setAttendance} pushToast={pushToast}/>}
      </div>
    </div>

    <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNavigate={setView}/>

    {conflict && (
      <Modal title="일정 충돌 감지" onClose={()=>setConflict(null)}
        footer={<button className="btn-primary" onClick={()=>setConflict(null)}>확인</button>}>
        <p style={{fontSize:13,lineHeight:1.6}}>
          <strong>{empName(conflict.a.employee)}</strong>님은 같은 시간에 이미 <strong>{siteName(conflict.b.site)}</strong> 방문이 배정되어 있어
          해당 일정으로 이동할 수 없습니다. 다른 날짜를 선택하거나 담당자를 변경해 주세요.
        </p>
      </Modal>
    )}

    {quickAdd && (
      <Modal title="새 방문 일정 배정" onClose={()=>setQuickAdd(false)}
        footer={<><button className="btn-ghost" onClick={()=>setQuickAdd(false)}>취소</button>
          <RippleButton className="btn-primary" onClick={submitQuickAdd}>배정</RippleButton></>}>
        <div className="form-grid">
          <div className="field"><label>사업장</label>
            <select value={quickForm.site} onChange={e=>setQuickForm({...quickForm,site:e.target.value})}>
              {SITES.map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
            </select>
          </div>
          <div className="field"><label>담당 직원</label>
            <select value={quickForm.employee} onChange={e=>setQuickForm({...quickForm,employee:e.target.value})}>
              {EMPLOYEES.filter(e=>e.role==='현장직원').map(e=>(<option key={e.id} value={e.id}>{e.name}</option>))}
            </select>
          </div>
          <div className="field"><label>방문일</label>
            <input type="date" value={quickForm.date} onChange={e=>setQuickForm({...quickForm,date:e.target.value})}/>
          </div>
          <div className="field"><label>시작 시각</label>
            <select value={quickForm.start} onChange={e=>setQuickForm({...quickForm,start:e.target.value})}>
              {[9,10,11,13,14,15,16,17].map(h=>(<option key={h} value={h}>{h}:00</option>))}
            </select>
          </div>
        </div>
      </Modal>
    )}

    <Toast toasts={toasts}/>
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
