<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

<style>
  :root{
    --canvas:#303236; --void:#090a0c; --card:#111111; --edge:#4a4b50;
    --iron:#6b6c6d; --smoke:#95979e; --ash:#a9a9aa; --frost:#d1d1d1;
    --iris:#5683da; --ember:#ff8964; --white:#ffffff;
    --danger:#ff6b6b; --ok:#3ad98a; --warn:#f5c04a;
    --radius:16px; --radius-pill:9999px;
    --shadow-float: 0 20px 45px rgba(0,0,0,0.45);
    --shadow-soft: 0 10px 24px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;background:var(--canvas);}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;}
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes floatUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes auroraShift{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,137,100,0.5);}70%{box-shadow:0 0 0 12px rgba(255,137,100,0);}100%{box-shadow:0 0 0 0 rgba(255,137,100,0);}}
  @keyframes cardLift{from{transform:translateY(0);}to{transform:translateY(-4px);}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  .topnav{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:rgba(17,17,17,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge);}
  .aurora-strip{position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--iris),var(--ember),transparent,var(--iris));
    background-size:200% 100%;animation:auroraShift 6s linear infinite;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--iris),var(--ember));
    display:flex;align-items:center;justify-content:center;}
  .brand-name{font-weight:700;font-size:15px;letter-spacing:-0.3px;}
  .brand-sub{font-size:10.5px;color:var(--smoke);}
  .nav-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .nav-tab{padding:9px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--smoke);
    display:flex;align-items:center;gap:7px;transition:background .15s ease,color .15s ease;}
  .nav-tab:hover{color:var(--white);}
  .nav-tab.active{background:var(--iris);color:#fff;}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .avatar-ring{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--iris),var(--ember));
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

  .content{padding:28px 32px;max-width:1400px;margin:0 auto;width:100%;}
  .page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:46px;font-weight:700;letter-spacing:-1.6px;line-height:1.05;margin:0 0 8px;}
  .page-desc{font-size:13px;color:var(--smoke);margin:0;max-width:640px;}

  .btn-primary{background:var(--iris);color:#fff;padding:10px 20px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:filter .15s ease,transform .12s ease;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-primary:active{transform:scale(0.97);}
  .btn-ghost{background:transparent;border:1px solid var(--edge);color:var(--white);padding:10px 18px;border-radius:var(--radius-pill);
    font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;}
  .btn-ghost:hover{background:rgba(255,255,255,0.06);}
  .btn-danger{background:transparent;border:1px solid rgba(255,107,107,0.4);color:var(--danger);padding:9px 16px;
    border-radius:var(--radius-pill);font-size:13px;font-weight:600;}
  .btn-danger:hover{background:rgba(255,107,107,0.08);}
  .btn-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--smoke);}
  .btn-icon:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .chip-filter{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;border:1px solid var(--edge);color:var(--smoke);}
  .chip-filter.active{background:var(--ember);border-color:transparent;color:#1a0f08;}

  .surface{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);}
  .surface-float{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow-float);}

  /* ===== kanban-board archetype ===== */
  .board-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
    background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);margin-bottom:16px;}
  .board-header h2{margin:0;font-size:15px;font-weight:700;}
  .kanban-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start;}
  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
  .column{flex:0 0 272px;background:rgba(255,255,255,0.02);border:1px solid var(--edge);border-radius:var(--radius);
    padding:12px;min-height:420px;transition:background .15s ease,box-shadow .15s ease;}
  .column.drop-hover{background:rgba(86,131,218,0.08);box-shadow:0 0 0 2px var(--iris) inset;}
  .col-header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px;font-size:12.5px;font-weight:700;
    color:var(--frost);border-bottom:1px solid var(--edge);margin-bottom:10px;}
  .count{font-size:11px;background:rgba(255,255,255,0.08);color:var(--smoke);padding:1px 9px;border-radius:var(--radius-pill);font-weight:600;}
  .card-item{background:#161616;border:1px solid var(--edge);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;
    animation:floatUp .25s ease both;transition:transform .15s ease,border-color .15s ease;}
  .card-item:hover{border-color:var(--iris);animation:cardLift .18s ease forwards;}
  .card-item.dragging{opacity:0.35;}
  .card-title{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.4;}
  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);background:rgba(86,131,218,0.16);color:#a9c2f0;}
  .tag.ember{background:rgba(255,137,100,0.16);color:#ffb493;}
  .avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--iris),var(--ember));
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-left:auto;}
  .priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .priority-dot.high{background:var(--danger);}
  .priority-dot.mid{background:var(--warn);}
  .priority-dot.low{background:var(--ok);}
  .card-due{font-size:10px;color:var(--smoke);margin-top:6px;display:flex;align-items:center;gap:4px;}

  .matrix-side{position:sticky;top:90px;}
  .matrix-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
  .matrix-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:150px;margin-bottom:16px;}
  .matrix-cell{border-radius:10px;border:1px solid var(--edge);padding:8px;font-size:9.5px;color:var(--smoke);position:relative;}
  .matrix-cell.hot{background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.4);}
  .matrix-cell .cell-label{font-weight:700;color:var(--frost);}
  .matrix-cell .cell-count{position:absolute;bottom:8px;right:10px;font-size:18px;font-weight:800;color:#fff;}
  .urgent-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--edge);font-size:11.5px;}
  .urgent-item:last-child{border-bottom:none;}

  /* ===== customer portal ===== */
  .customer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .customer-card{padding:18px;position:relative;overflow:hidden;}
  .customer-card .renew-badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:3px 10px;
    border-radius:var(--radius-pill);background:rgba(245,192,74,0.16);color:var(--warn);animation:pulseRing 2s infinite;}
  .cust-name{font-size:15px;font-weight:700;margin-bottom:4px;}
  .cust-meta{font-size:12px;color:var(--smoke);margin-bottom:14px;}
  .cust-stat-row{display:flex;justify-content:space-between;font-size:11.5px;padding:8px 0;border-top:1px solid var(--edge);}

  /* ===== notify queue ===== */
  .queue-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:#161616;
    border:1px solid var(--edge);margin-bottom:10px;}
  .channel-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .channel-icon.email{background:rgba(86,131,218,0.16);color:#a9c2f0;}
  .channel-icon.kakao{background:rgba(255,137,100,0.16);color:#ffb493;}
  .queue-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);}
  .queue-status.success{background:rgba(58,217,138,0.15);color:var(--ok);}
  .queue-status.failed{background:rgba(255,107,107,0.15);color:var(--danger);}
  .queue-status.pending{background:rgba(255,255,255,0.08);color:var(--smoke);}

  /* ===== analytics ===== */
  .analytics-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  .chart-card{padding:20px;}
  .chart-title{font-size:13.5px;font-weight:700;margin-bottom:14px;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease;}
  .legend-row:hover,.legend-row.sel{background:rgba(255,255,255,0.06);}
  .legend-dot{width:9px;height:9px;border-radius:3px;}
  .reason-list{margin-top:14px;padding-top:14px;border-top:1px solid var(--edge);animation:slideDown .2s ease;}
  .reason-list-item{font-size:12px;color:var(--smoke);padding:5px 0;}

  /* ===== audit ===== */
  .audit-table{width:100%;border-collapse:collapse;}
  .audit-table th{text-align:left;font-size:11px;color:var(--smoke);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--edge);}
  .audit-table td{padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--edge);color:var(--frost);}

  /* ===== modal ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,0.6);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fadeIn .18s ease;padding:20px;}
  .modal-box{background:#161616;border:1px solid var(--edge);border-radius:18px;width:100%;max-width:520px;max-height:86vh;
    overflow-y:auto;animation:floatUp .2s ease;box-shadow:var(--shadow-float);}
  .modal-box.wide{max-width:660px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--edge);}
  .modal-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .modal-body{padding:20px 22px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--edge);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12px;font-weight:600;color:var(--frost);}
  .field input,.field select,.field textarea{padding:10px 12px;background:#0e0e0e;border:1px solid var(--edge);
    border-radius:10px;font-size:13px;color:#fff;outline:none;}
  .field input:focus,.field textarea:focus{border-color:var(--iris);}

  .toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{background:#161616;border:1px solid var(--edge);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;
    display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-float);animation:floatUp .25s ease;}
  .toast .ph{color:var(--ok);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:8px;}

  @media (max-width:1100px){ .kanban-wrap{grid-template-columns:1fr;} .analytics-grid{grid-template-columns:1fr;} }
</style>
</head>

  {key:'notify-queue',label:'다채널 알림 발송 큐',icon:'ph-bell-ringing'},
  {key:'safety-analytics',label:'안전 점검 이행률 분석 대시보드',icon:'ph-chart-line-up'},
  {key:'audit-log',label:'감사 로그',icon:'ph-clipboard-text'},
];

/* ---------------- shared ---------------- */
function RippleBtn({className,onClick,children,...rest}){
  return <button className={className} onClick={onClick} {...rest}>{children}</button>;
}
function Toast({toasts}){
  return <div className="toast-stack">
    {toasts.map(t=>(<div className="toast" key={t.id}><i className="ph ph-check-circle"></i><span>{t.text}</span></div>))}
  </div>;
}
function Modal({title,onClose,children,footer,wide}){
  return <div className="modal-overlay" onMouseDown={(e)=>{if(e.target===e.currentTarget)onClose();}}>
    <div className={'modal-box'+(wide?' wide':'')}>
      <div className="modal-head"><h3>{title}</h3><button className="btn-icon" onClick={onClose}><i className="ph ph-x"></i></button></div>
      <div className="modal-body">{children}</div>
      {footer && <div className="modal-foot">{footer}</div>}
    </div>
  </div>;
}

/* ---------------- Kanban main ---------------- */
function KanbanView({cards,setCards,pushToast}){
  const [dragId,setDragId] = useState(null);
  const [overCol,setOverCol] = useState(null);
  const [detail,setDetail] = useState(null);
  const [addOpen,setAddOpen] = useState(false);
  const [newCard,setNewCard] = useState({site:'s1',employee:'e1',type:'정기진단'});
  const [siteFilter,setSiteFilter] = useState('all');

  const SITE_KEYS = Object.keys(SITE_NAMES);
  const cycleSiteFilter = ()=>{
    setSiteFilter(prev=>{
      if(prev==='all') return SITE_KEYS[0];
      const idx = SITE_KEYS.indexOf(prev);
      return idx===SITE_KEYS.length-1 ? 'all' : SITE_KEYS[idx+1];
    });
  };

  const colCards = (k)=>cards.filter(c=>c.status===k && (siteFilter==='all' || c.site===siteFilter));
  const onDrop = (colKey)=>{
    setOverCol(null);
    if(dragId==null) return;
    setCards(prev=>prev.map(c=>c.id===dragId?{...c,status:colKey}:c));
    pushToast(dragId+' 카드를 "'+COLUMNS.find(c=>c.key===colKey).label+'"으로 이동했습니다');
    setDragId(null);
  };

  const urgent = cards.filter(c=>c.status==='reviewing' && daysAway(c.due)<=3);
  const repeated = cards.filter(c=>c.rejectedBefore>=1 && c.status!=='approved');

  function daysAway(mmdd){
    const [m,d]=mmdd.split('-').map(Number);
    const target = new Date(2026,m-1,d);
    const now = new Date(2026,8,1);
    return Math.round((target-now)/86400000);
  }

  const addCard = ()=>{
    CARD_SEQ+=1;
    setCards(prev=>[{id:'R-'+CARD_SEQ,site:newCard.site,employee:newCard.employee,type:newCard.type,status:'submitted',priority:'mid',due:'09-15',rejectedBefore:0},...prev]);
    setAddOpen(false);
    pushToast('새 심사 카드가 등록되었습니다');
  };

  return <div>
    <div className="page-head">
      <div>
        <h1 className="page-title">보고서 심사 현황 보드</h1>
        <p className="page-desc">제출된 보고서를 단계별 칸반 컬럼으로 시각화해 조직 전체 심사 병목을 즉시 파악합니다.</p>
      </div>
    </div>
    <div className="board-header">
      <h2>산업안전 점검 보고서 · 전체 사업장</h2>
      <div style={{display:'flex',gap:8}}>
        <button className="chip-filter active" onClick={cycleSiteFilter}><i className="ph ph-funnel"></i> {siteFilter==='all' ? '전체 사업장' : SITE_NAMES[siteFilter]}</button>
        <RippleBtn className="btn-primary" onClick={()=>setAddOpen(true)}><i className="ph ph-plus"></i>새 항목</RippleBtn>
      </div>
    </div>

    <div className="kanban-wrap">
      <div className="board" data-archetype="kanban-board">
        {COLUMNS.map(col=>(
          <section key={col.key} className={'column'+(overCol===col.key?' drop-hover':'')}
            onDragOver={(e)=>{e.preventDefault();setOverCol(col.key);}}
            onDragLeave={()=>setOverCol(null)}
            onDrop={()=>onDrop(col.key)}>
            <div className="col-header"><span>{col.label}</span><span className="count">{colCards(col.key).length}</span></div>
            {colCards(col.key).map(c=>(
              <div key={c.id} className="card-item" draggable
                onDragStart={()=>setDragId(c.id)}
                onClick={()=>setDetail(c)}>
                <div className="card-title">{c.id} · {SITE_NAMES[c.site]}</div>
                <div className="card-meta">
                  <span className={'priority-dot '+c.priority}></span>
                  <span className="tag">{c.type}</span>
                  {c.rejectedBefore>0 && <span className="tag ember">반려 {c.rejectedBefore}회</span>}
                  <span className="avatar">{empName(c.employee).slice(0,1)}</span>
                </div>
                <div className="card-due"><i className="ph ph-clock"></i>마감 {c.due}</div>
              </div>
            ))}
            {colCards(col.key).length===0 && <div style={{fontSize:11,color:'#6b6c6d',textAlign:'center',marginTop:16}}>카드 없음</div>}
          </section>
        ))}
      </div>

      <div className="matrix-side">
        <div className="surface-float" style={{padding:16}}>
          <div className="matrix-title"><i className="ph ph-squares-four"></i>우선순위 매트릭스</div>
          <div className="matrix-grid">
            <div className={'matrix-cell'+(urgent.length>0?' hot':'')}>
              <div className="cell-label">마감임박 × 검토중</div>
              <div className="cell-count">{urgent.length}</div>
            </div>
            <div className="matrix-cell">
              <div className="cell-label">여유 × 검토중</div>
              <div className="cell-count">{colCards('reviewing').length-urgent.length}</div>
            </div>
            <div className={'matrix-cell'+(repeated.length>0?' hot':'')}>
              <div className="cell-label">반려 반복</div>
              <div className="cell-count">{repeated.length}</div>
            </div>
            <div className="matrix-cell">
              <div className="cell-label">승인완료 누적</div>
              <div className="cell-count">{colCards('approved').length}</div>
            </div>
          </div>
          <div className="matrix-title" style={{fontSize:12}}><i className="ph ph-warning-circle"></i>우선 대응 필요</div>
          {[...urgent,...repeated].slice(0,5).map(c=>(
            <div className="urgent-item" key={c.id} onClick={()=>setDetail(c)} style={{cursor:'pointer'}}>
              <span>{c.id} · {SITE_NAMES[c.site]}</span><span style={{color:'#95979e'}}>{c.due}</span>
            </div>
          ))}
          {urgent.length===0 && repeated.length===0 && <div style={{fontSize:11.5,color:'#6b6c6d'}}>현재 우선 대응 대상이 없습니다.</div>}
        </div>
      </div>
    </div>

    {detail && (
      <Modal title={detail.id+' 상세'} onClose={()=>setDetail(null)}
        footer={<button className="btn-ghost" onClick={()=>setDetail(null)}>닫기</button>}>
        <div className="field"><label>사업장</label><input readOnly value={SITE_NAMES[detail.site]}/></div>
        <div className="field"><label>담당자</label><input readOnly value={empName(detail.employee)}/></div>
        <div className="field"><label>유형 / 상태</label><input readOnly value={detail.type+' · '+COLUMNS.find(c=>c.key===detail.status).label}/></div>
        <div className="field"><label>과거 반려 이력</label><input readOnly value={detail.rejectedBefore+'회'}/></div>
      </Modal>
    )}
    {addOpen && (
      <Modal title="새 심사 카드 등록" onClose={()=>setAddOpen(false)}
        footer={<><button className="btn-ghost" onClick={()=>setAddOpen(false)}>취소</button>
          <RippleBtn className="btn-primary" onClick={addCard}>등록</RippleBtn></>}>
        <div className="field"><label>사업장</label>
          <select value={newCard.site} onChange={e=>setNewCard({...newCard,site:e.target.value})}>
            {Object.keys(SITE_NAMES).map(k=>(<option key={k} value={k}>{SITE_NAMES[k]}</option>))}
          </select>
        </div>
        <div className="field"><label>담당자</label>
          <select value={newCard.employee} onChange={e=>setNewCard({...newCard,employee:e.target.value})}>
            {EMP.map(e=>(<option key={e.id} value={e.id}>{e.name}</option>))}
          </select>
        </div>
        <div className="field"><label>유형</label>
          <select value={newCard.type} onChange={e=>setNewCard({...newCard,type:e.target.value})}>
            <option>정기진단</option><option>위험성평가</option>
          </select>
        </div>
      </Modal>
    )}
  </div>;
}

/* ---------------- Customer Portal ---------------- */
function CustomerPortalView({pushToast}){
  const [selected,setSelected] = useState(null);
  return <div>
    <div className="page-head">
      <div>
        <h1 className="page-title">고객사 포털 및 실적 리포트</h1>
        <p className="page-desc">고객사 담당자가 자사 사업장의 승인 완료 보고서 이력을 직접 조회·다운로드합니다.</p>
      </div>
    </div>
    <div className="customer-grid">
      {CUSTOMERS.map(c=>{
        const remain = daysUntil(c.renew);
        const soon = remain<=30;
        return <div className="surface customer-card" key={c.id} onClick={()=>setSelected(c)} style={{cursor:'pointer'}}>
          {soon && <span className="renew-badge">계약 갱신 {remain}일 전</span>}
          <div className="cust-name">{c.name}</div>
          <div className="cust-meta">{SITE_NAMES[c.site]} · 담당 {c.contact}</div>
          <div className="cust-stat-row"><span>승인 완료 보고서</span><span style={{fontWeight:700}}>{c.reports}건</span></div>
          <div className="cust-stat-row"><span>계약 갱신일</span><span>{c.renew}</span></div>
        </div>;
      })}
    </div>
    {selected && (
      <Modal title={selected.name+' — 실적 리포트'} onClose={()=>setSelected(null)}
        footer={<RippleBtn className="btn-primary" onClick={()=>{pushToast('PDF 다운로드 이력이 기록되었습니다');}}><i className="ph ph-download-simple"></i>전체 이력 PDF</RippleBtn>}>
        <p style={{fontSize:13,color:'#a9a9aa',marginBottom:14}}>검토중인 보고서는 표시되지 않으며, 승인 완료된 항목만 조회됩니다.</p>
        {[1,2,3].map(i=>(
          <div key={i} className="cust-stat-row" style={{borderTop:'1px solid #4a4b50'}}>
            <span>{selected.site.toUpperCase()}-R-33{i}0 정기진단</span>
            <button className="btn-ghost" style={{padding:'4px 12px',fontSize:11}} onClick={()=>pushToast('다운로드 이력 기록됨')}>다운로드</button>
          </div>
        ))}
      </Modal>
    )}
  </div>;
}

/* ---------------- Notify Queue ---------------- */
function NotifyQueueView({queue,setQueue,pushToast}){
  const [filter,setFilter] = useState('all');
  const filtered = queue.filter(q=>filter==='all'||q.status===filter);
  const retry = (id)=>{
    setQueue(prev=>prev.map(q=>q.id===id?{...q,status:'success',channel:'email',retries:q.retries+1}:q));
    pushToast('이메일 채널로 재시도하여 발송에 성공했습니다');
  };
  return <div>
    <div className="page-head">
      <div>
        <h1 className="page-title">다채널 알림 발송 큐</h1>
        <p className="page-desc">알림톡 발송 실패 시 이메일로 자동 이중화되는 알림 인프라 현황입니다.</p>
      </div>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      {[['all','전체'],['success','성공'],['failed','실패'],['pending','대기']].map(([k,l])=>(
        <button key={k} className={'chip-filter'+(filter===k?' active':'')} onClick={()=>setFilter(k)}>{l}</button>
      ))}
    </div>
    {filtered.map(q=>(
      <div className="queue-row" key={q.id}>
        <div className={'channel-icon '+q.channel}><i className={'ph '+(q.channel==='email'?'ph-envelope-simple':'ph-chat-circle-text')}></i></div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13}}>{q.target} · {q.channel==='email'?'이메일':'알림톡'}</div>
          <div style={{fontSize:12,color:'#95979e'}}>{q.msg}</div>
        </div>
        <span style={{fontSize:11,color:'#95979e'}}>재시도 {q.retries}회</span>
        <span className={'queue-status '+q.status}>{q.status==='success'?'성공':q.status==='failed'?'실패':'대기'}</span>
        {q.status==='failed' && <button className="btn-ghost" style={{padding:'6px 14px',fontSize:12}} onClick={()=>retry(q.id)}><i className="ph ph-arrow-clockwise"></i>재시도</button>}
      </div>
    ))}
  </div>;
}

/* ---------------- Safety Analytics ---------------- */
function SafetyAnalyticsView(){
  const [selReason,setSelReason] = useState(null);
  return <div>
    <div className="page-head">
      <div>
        <h1 className="page-title">안전 점검 이행률 분석 대시보드</h1>
        <p className="page-desc">사업장별·기간별 점검 이행률과 반려 사유 분포를 집계해 반복 이슈를 조기에 식별합니다.</p>
      </div>
    </div>
    <div className="analytics-grid">
      <div className="surface chart-card">
        <div className="chart-title">월별 점검 이행률 추이</div>
        <ResponsiveContainer width="100%" height={260}>
          <LineChart data={TREND}>
            <CartesianGrid stroke="#4a4b50" strokeDasharray="3 3"/>
            <XAxis dataKey="month" stroke="#95979e" fontSize={12}/>
            <YAxis stroke="#95979e" fontSize={12} domain={[60,100]}/>
            <Tooltip contentStyle={{background:'#161616',border:'1px solid #4a4b50',borderRadius:10,color:'#fff'}}/>
            <Line type="monotone" dataKey="rate" stroke="#5683da" strokeWidth={3} dot={{r:4,fill:'#ff8964'}}/>
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="surface chart-card">
        <div className="chart-title">반려 사유 분포</div>
        <ResponsiveContainer width="100%" height={200}>
          <PieChart>
            <Pie data={REASONS} dataKey="value" nameKey="label" innerRadius={50} outerRadius={78} paddingAngle={3}
              onClick={(d)=>setSelReason(d.key===selReason?null:d.key)}>
              {REASONS.map((r,i)=>(<Cell key={i} fill={r.color} style={{cursor:'pointer',opacity:selReason && selReason!==r.key?0.35:1}}/>))}
            </Pie>
            <Tooltip contentStyle={{background:'#161616',border:'1px solid #4a4b50',borderRadius:10,color:'#fff'}}/>
          </PieChart>
        </ResponsiveContainer>
        <div className="donut-legend">
          {REASONS.map(r=>(
            <div key={r.key} className={'legend-row'+(selReason===r.key?' sel':'')} onClick={()=>setSelReason(selReason===r.key?null:r.key)}>
              <span className="legend-dot" style={{background:r.color}}></span><span>{r.label}</span>
              <span style={{marginLeft:'auto',color:'#95979e'}}>{r.value}%</span>
            </div>
          ))}
        </div>
        {selReason && (
          <div className="reason-list">
            <div style={{fontSize:12,fontWeight:700,marginBottom:6}}>{REASONS.find(r=>r.key===selReason).label} 관련 보고서</div>
            {REASON_REPORTS[selReason].map((r,i)=>(<div className="reason-list-item" key={i}>{r}</div>))}
          </div>
        )}
      </div>
    </div>
  </div>;
}

/* ---------------- Audit Log ---------------- */
function AuditLogView(){
  return <div>
    <div className="page-head">
      <div>
        <h1 className="page-title">감사 로그</h1>
        <p className="page-desc">조직 전체 사용자의 주요 액션과 접속 이력을 기록합니다.</p>
      </div>
    </div>
    <div className="surface" style={{overflow:'hidden'}}>
      <table className="audit-table">
        <thead><tr><th>사용자</th><th>액션</th><th>IP</th><th>시각</th></tr></thead>
        <tbody>{AUDIT_ROWS.map(r=>(<tr key={r.id}><td>{r.user}</td><td>{r.action}</td><td>{r.ip}</td><td>{r.time}</td></tr>))}</tbody>
      </table>
    </div>
  </div>;
}

/* ---------------- App ---------------- */
function QuickSearch({onClose,onNavigate}){
  const [q,setQ] = useState('');
  const items = NAV_ITEMS.filter(n=>n.label.includes(q) || q==='');
  return <Modal title="빠른 검색" onClose={onClose}>
    <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="화면 이름으로 검색 (예: 알림, 분석, 로그)"
      style={{width:'100%',padding:'10px 12px',background:'#0e0e0e',border:'1px solid #4a4b50',borderRadius:10,color:'#fff',fontSize:13,marginBottom:12}}/>
    {items.map(it=>(
      <div key={it.key} onClick={()=>{onNavigate(it.key);onClose();}}
        style={{display:'flex',alignItems:'center',gap:10,padding:'10px 8px',borderRadius:9,cursor:'pointer',fontSize:13}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        <i className={'ph '+it.icon}></i><span>{it.label}</span>
      </div>
    ))}
    {items.length===0 && <div style={{fontSize:12,color:'#6b6c6d'}}>검색 결과가 없습니다</div>}
  </Modal>;
}

function App(){
  const [view,setView] = useState('main');
  const [cards,setCards] = useState(initialCards);
  const [queue,setQueue] = useState(initialQueue);
  const [toasts,setToasts] = useState([]);
  const [searchOpen,setSearchOpen] = useState(false);

  const pushToast = useCallback((text)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  },[]);

  return <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <header className="topnav" style={{position:'relative'}}>
      <div className="aurora-strip"></div>
      <div className="brand">
        <div className="brand-mark"><i className="ph ph-shield-checkered" style={{color:'#fff'}}></i></div>
        <div><div className="brand-name">필드세이프 통합관제</div><div className="brand-sub">산업안전 운영 플랫폼</div></div>
      </div>
      <nav className="nav-tabs">
        {NAV_ITEMS.map(n=>(
          <a key={n.key} className={'nav-tab'+(view===n.key?' active':'')} onClick={()=>setView(n.key)}>
            <i className={'ph '+n.icon}></i>{n.label}
          </a>
        ))}
      </nav>
      <div className="nav-actions">
        <button className="btn-icon" onClick={()=>setSearchOpen(true)}><i className="ph ph-magnifying-glass"></i></button>
        <div className="avatar-ring">정</div>
      </div>
    </header>

    <main style={{flex:1,width:'100%'}}>
      <div className="content">
        {view==='main' && <KanbanView cards={cards} setCards={setCards} pushToast={pushToast}/>}
        {view==='customer-portal' && <CustomerPortalView pushToast={pushToast}/>}
        {view==='notify-queue' && <NotifyQueueView queue={queue} setQueue={setQueue} pushToast={pushToast}/>}
        {view==='safety-analytics' && <SafetyAnalyticsView/>}
        {view==='audit-log' && <AuditLogView/>}
      </div>
    </main>
    {searchOpen && <QuickSearch onClose={()=>setSearchOpen(false)} onNavigate={setView}/>}
    <Toast toasts={toasts}/>
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
