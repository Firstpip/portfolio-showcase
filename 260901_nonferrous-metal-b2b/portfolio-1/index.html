<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메탈로그 — 비철금속 스크랩 거래마켓</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root{
  --flame:#fa5d00; --flame-dark:#d94f00; --bone:#c0bbb6; --teal:#1ef6da;
  --cream:#fff8f1; --paper:#ffffff; --ink:#1d1e1c; --stone:#615f5c;
  --driftwood:#8e8b87; --mist:#d9d9d9; --marigold:#fee3b5;
  --shadow-sm: 0 1px 4px rgba(0,0,0,.2);
  --shadow-lg: 6px 4px 24px rgba(250,166,0,.25);
  --radius: 10px; --radius-lg: 18px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
#app-root{width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
h1,h2,h3,h4,p{margin:0;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--mist);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastPop{0%{opacity:0;transform:translateY(16px) scale(.96);}60%{opacity:1;transform:translateY(-2px) scale(1.01);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(250,93,0,.45);}70%{box-shadow:0 0 0 10px rgba(250,93,0,0);}100%{box-shadow:0 0 0 0 rgba(250,93,0,0);}}

.search-header{position:sticky;top:0;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.chip{transition:background .15s ease,border-color .15s ease,color .15s ease;}
.chip:hover{border-color:var(--flame);}
.card-hover{transition:transform .18s ease,box-shadow .18s ease;}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.btn-primary{background:var(--flame);color:#fff;border:none;border-radius:16px;font-weight:600;font-size:15px;padding:12px 24px;box-shadow:var(--shadow-sm);letter-spacing:.015em;transition:filter .15s ease,transform .12s ease;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--bone);color:var(--ink);border-radius:16px;font-weight:500;font-size:14px;padding:10px 20px;transition:border-color .15s ease,background .15s ease;}
.btn-ghost:hover{border-color:var(--flame);background:rgba(250,93,0,.05);}
.link-ghost{background:none;border:none;color:var(--flame);font-weight:500;font-size:14px;padding:0;}
.link-ghost:hover{text-decoration:underline;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;}
.badge-sale{background:rgba(30,246,218,.16);color:#0d7d6d;}
.badge-trading{background:rgba(250,93,0,.12);color:var(--flame-dark);}
.badge-done{background:rgba(97,95,92,.12);color:var(--stone);}
.badge-wait{background:rgba(97,95,92,.1);color:var(--stone);}
.badge-accept{background:rgba(30,246,218,.16);color:#0d7d6d;}
.badge-reject{background:rgba(217,79,0,.1);color:var(--flame-dark);}
</style>
</head>

function Toast({toast}){
  if(!toast) return null;
  return (
    <div style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',background:'#1d1e1c',color:'#fff',padding:'12px 22px',borderRadius:12,fontSize:14,fontWeight:500,boxShadow:'0 8px 24px rgba(0,0,0,.25)',zIndex:900,animation:'toastPop .35s ease-out',display:'flex',alignItems:'center',gap:8}}>

}

function StatStrip({count}){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let raf, start;
    const target = count;
    const step = ts => { if(!start) start=ts; const p=Math.min((ts-start)/700,1); setN(Math.floor(p*target)); if(p<1) raf=requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[count]);
  return (
    <div style={{display:'flex',alignItems:'center',gap:28,maxWidth:1280,margin:'0 auto',padding:'18px 40px 0'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--stone)'}}>
        <span style={{width:8,height:8,borderRadius:'50%',background:'var(--flame)',display:'inline-block',animation:'pulseDot 1.8s infinite'}}></span>
        실시간 등록 물량 <strong style={{color:'var(--ink)',fontSize:15}}>{n}건</strong>
      </div>
      <div style={{fontSize:13,color:'var(--stone)'}}>이번 주 거래 확정 <strong style={{color:'var(--ink)',fontSize:15}}>34건</strong></div>
      <div style={{fontSize:13,color:'var(--stone)'}}>참여 지역 <strong style={{color:'var(--ink)',fontSize:15}}>12곳</strong></div>
    </div>
  );
}

function ListingCard({l, i, onOpen, saved, onToggleSave}){

        <img className="card-image" src={l.img} alt={l.item} style={{width:'100%',aspectRatio:'4/3',objectFit:'cover',display:'block'}}/>
        <button className="card-favorite" onClick={e=>{e.stopPropagation();onToggleSave(l.id);}} style={{position:'absolute',top:10,right:10,width:34,height:34,borderRadius:'50%',border:'none',background:'rgba(255,255,255,.92)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-sm)'}}>
          <i className={`ti ${saved?'ti-bookmark-filled':'ti-bookmark'}`} style={{color:saved?'var(--flame)':'var(--stone)'}}></i>

        <span className={`badge ${badgeClass}`} style={{position:'absolute',bottom:10,left:10}}>{l.status}</span>
      </div>
      <div className="card-body" style={{padding:'16px 18px'}}>
        <div className="card-row-1" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
          <h3 className="card-title" style={{fontSize:16,fontWeight:600,lineHeight:1.3}}>{l.item}</h3>
          <span style={{fontSize:12,fontWeight:600,color:'var(--stone)',flexShrink:0}}>{l.grade}</span>
        </div>
        <div className="card-row-2" style={{marginTop:6}}>
          <span className="card-meta" style={{fontSize:13,color:'var(--stone)',display:'flex',alignItems:'center',gap:4}}><i className="ti ti-map-pin" style={{fontSize:14}}></i>{l.region}</span>
        </div>
        <div className="card-row-3" style={{marginTop:2}}>
          <span className="card-meta" style={{fontSize:13,color:'var(--stone)',display:'flex',alignItems:'center',gap:4}}><i className="ti ti-calendar-event" style={{fontSize:14}}></i>출고가능 {l.availableDate}</span>
        </div>

function QuickView({listing, onClose, onPropose}){
  if(!listing) return null;
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(29,30,28,.35)',zIndex:200,display:'flex',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:420,maxWidth:'92vw',height:'100%',background:'#fff',boxShadow:'-12px 0 32px rgba(0,0,0,.15)',animation:'slideInRight .3s ease-out',overflowY:'auto',padding:28}}>

        <img src={listing.img} alt={listing.item} style={{width:'100%',aspectRatio:'4/3',objectFit:'cover',borderRadius:16}}/>
        <h2 style={{fontSize:22,fontWeight:700,marginTop:18}}>{listing.item}</h2>
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <span className={`badge ${listing.status==='판매중'?'badge-sale':listing.status==='거래중'?'badge-trading':'badge-done'}`}>{listing.status}</span>

        </div>
        <div style={{marginTop:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,fontSize:14}}>
          <div><div style={{color:'var(--stone)',fontSize:12}}>중량</div><strong>{won(listing.weight)}kg</strong></div>
          <div><div style={{color:'var(--stone)',fontSize:12}}>희망가격</div><strong>{won(listing.price)}원/kg</strong></div>
          <div><div style={{color:'var(--stone)',fontSize:12}}>지역</div><strong>{listing.region}</strong></div>
          <div><div style={{color:'var(--stone)',fontSize:12}}>출고 가능일</div><strong>{listing.availableDate}</strong></div>

          <button className="btn-ghost" onClick={onClose}>닫기</button>

function MainScreen({listings, cat, setCat, region, setRegion, weight, setWeight, onOpen, saved, onToggleSave, onSearch, go}){
  const filtered = useMemo(()=>{
    return listings.filter(l=>{
      if(cat!=='전체' && l.category!==cat) return false;
      if(region!=='전체 지역' && !l.region.startsWith(region)) return false;
      if(weight==='5,000kg 이하' && l.weight>5000) return false;
      if(weight==='5,000~10,000kg' && (l.weight<5000||l.weight>10000)) return false;
      if(weight==='10,000kg 이상' && l.weight<10000) return false;
      return true;
    });
  },[listings,cat,region,weight]);

  return (
    <React.Fragment>
      <StatStrip count={128}/>
      <main className="main" data-layout="grid-or-split" style={{maxWidth:1280,margin:'0 auto',padding:'24px 40px 60px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <h2 style={{fontSize:20,fontWeight:700}}>거래시장 <span style={{color:'var(--stone)',fontWeight:500,fontSize:14}}>· {filtered.length}건</span></h2>
          <button className="btn-primary" onClick={()=>go('listing')}><i className="ti ti-plus" style={{marginRight:6}}></i>물량 등록</button>
        </div>
        <section className="card-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:20}}>
          {filtered.map((l,i)=><ListingCard key={l.id} l={l} i={i} onOpen={onOpen} saved={saved.includes(l.id)} onToggleSave={onToggleSave}/>)}
          {filtered.length===0 && (
            <div style={{gridColumn:'1/-1',textAlign:'center',padding:'60px 0',color:'var(--stone)'}}>
              <i className="ti ti-mood-empty" style={{fontSize:40}}></i>
              <p style={{marginTop:10}}>조건에 맞는 물량이 없습니다. 필터를 조정해 보세요.</p>
            </div>
          )}
        </section>
      </main>
    </React.Fragment>
  );
}

function ListingForm({onSubmit}){

    const files = Array.from(e.target.files||[]).slice(0, 5-photos.length);

    onSubmit({item,category,grade,weight:Number(weight),region,price:Number(price),date,photos:photos.length});

        </label>
        <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,fontWeight:600,color:'var(--stone)'}}>품목 카테고리 *
          <select value={category} onChange={e=>setCategory(e.target.value)} style={{padding:'12px 14px',border:'1px solid var(--bone)',borderRadius:'var(--radius)',fontSize:14}}>
            {CATEGORIES.filter(c=>c!=='전체').map(c=><option key={c}>{c}</option>)}
          </select>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,fontWeight:600,color:'var(--stone)'}}>등급 *

function ProposalScreen({proposals, listings, onAccept, onReject, onNewProposal}){
  const [modalOpen,setModalOpen]=useState(false);
  const [confirmData,setConfirmData]=useState(null);
  const [draft,setDraft]=useState({listingId:listings[0]?.id||'', quantity:'', price:'', condition:''});

  const submitDraft = () => {
    if(!draft.listingId||!draft.quantity||!draft.price) return;
    onNewProposal(draft);
    setModalOpen(false);
    setDraft({listingId:listings[0]?.id||'', quantity:'', price:'', condition:''});
  };

  const accept = p => {
    const listing = listings.find(l=>l.id===p.listingId);
    if(listing && listing.status==='거래중'){
      setConfirmData({blocked:true});
      return;
    }
    const tradeNo = 'TR-'+Math.floor(80000+Math.random()*9999);
    onAccept(p, tradeNo);
    setConfirmData({blocked:false, tradeNo, p});
  };

  return (
    <div style={{maxWidth:900,margin:'0 auto',padding:'40px 40px 80px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:22}}>
        <div>

          <p style={{fontSize:14,color:'var(--stone)',marginTop:4}}>제안을 수락하면 거래번호가 자동 생성되고 거래가 확정됩니다.</p>
        </div>
        <button className="btn-primary" onClick={()=>setModalOpen(true)}><i className="ti ti-send" style={{marginRight:6}}></i>새 제안 보내기</button>

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {proposals.map(p=>(
          <div key={p.id} style={{background:'#fff',border:'1px solid var(--mist)',borderRadius:'var(--radius-lg)',padding:20,display:'flex',justifyContent:'space-between',alignItems:'center',gap:16}}>

              <div style={{fontWeight:600,fontSize:15}}>{p.item}</div>
              <div style={{fontSize:13,color:'var(--stone)',marginTop:4}}>{p.buyer} · {won(p.quantity)}kg · {won(p.price)}원/kg · {p.condition}</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span className={`badge ${p.status==='대기'?'badge-wait':p.status==='수락'?'badge-accept':'badge-reject'}`}>{p.status}</span>
              {p.status==='대기' && (
                <React.Fragment>
                  <button className="btn-primary" style={{padding:'8px 16px',fontSize:13}} onClick={()=>accept(p)}>수락</button>
                  <button className="btn-ghost" style={{padding:'8px 16px',fontSize:13}} onClick={()=>onReject(p)}>거절</button>
                </React.Fragment>
              )}
            </div>
          </div>
        ))}
      </div>

      {modalOpen && (
        <div style={{position:'fixed',inset:0,background:'rgba(29,30,28,.4)',zIndex:250,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setModalOpen(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'var(--radius-lg)',padding:28,width:420,maxWidth:'92vw',animation:'fadeInUp .25s ease-out'}}>
            <h3 style={{fontSize:18,fontWeight:700,marginBottom:16}}>새 제안 보내기</h3>
            <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,fontWeight:600,color:'var(--stone)',marginBottom:12}}>대상 물량
              <select value={draft.listingId} onChange={e=>setDraft({...draft,listingId:e.target.value})} style={{padding:'10px 12px',border:'1px solid var(--bone)',borderRadius:'var(--radius)'}}>
                {listings.map(l=><option key={l.id} value={l.id}>{l.item}</option>)}

            </label>
            <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,fontWeight:600,color:'var(--stone)',marginBottom:12}}>제안단가(원/kg)
              <input type="number" value={draft.price} onChange={e=>setDraft({...draft,price:e.target.value})} style={{padding:'10px 12px',border:'1px solid var(--bone)',borderRadius:'var(--radius)'}}/>
            </label>
            <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,fontWeight:600,color:'var(--stone)',marginBottom:20}}>거래조건
              <input value={draft.condition} onChange={e=>setDraft({...draft,condition:e.target.value})} placeholder="예: 현장 계근 후 결제" style={{padding:'10px 12px',border:'1px solid var(--bone)',borderRadius:'var(--radius)'}}/>

              </React.Fragment>
            ) : (
              <React.Fragment>
                <i className="ti ti-circle-check" style={{fontSize:36,color:'var(--teal)'}}></i>
                <h3 style={{fontSize:17,fontWeight:700,marginTop:12}}>거래가 확정되었습니다</h3>
                <div style={{marginTop:14,background:'var(--cream)',borderRadius:'var(--radius)',padding:16,textAlign:'left',fontSize:13}}>
                  <div>거래번호 <strong>{confirmData.tradeNo}</strong></div>
                  <div style={{marginTop:4}}>품목 <strong>{confirmData.p.item}</strong></div>
                  <div style={{marginTop:4}}>거래처 <strong>{confirmData.p.buyer}</strong></div>
                </div>
              </React.Fragment>
            )}
            <button className="btn-primary" style={{marginTop:20,width:'100%'}} onClick={()=>setConfirmData(null)}>확인</button>
          </div>
        </div>
      )}
    </div>
  );

function App(){

  const [proposals,setProposals]=useState(INITIAL_PROPOSALS);
  const [cat,setCat]=useState('전체');
  const [region,setRegion]=useState('전체 지역');
  const [weight,setWeight]=useState('전체 수량');
  const [selected,setSelected]=useState(null);
  const [saved,setSaved]=useState([]);
  const [toast,setToast]=useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null),2200); };
  const go = s => { setScreen(s); setSelected(null); window.scrollTo(0,0); };

  const toggleSave = id => {
    setSaved(s=> s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);
    showToast(saved.includes(id) ? '관심 물량에서 제거되었습니다' : '관심 물량에 추가되었습니다');
  };

  const submitListing = data => {
    const newListing = {
      id:'L-'+Math.floor(1050+Math.random()*900), item:data.item, category:data.category, grade:data.grade,
      region:data.region, weight:data.weight, price:data.price, availableDate:data.date.replaceAll('-','.'),
      status:'판매중', seller:'김도현', img:pic('card-new'+Date.now(),480,360)
    };
    setListings(l=>[newListing,...l]);
    showToast('물량이 거래시장에 등록되었습니다');
    setTimeout(()=>go('main'),900);
  };

  const acceptProposal = (p, tradeNo) => {
    setProposals(ps=>ps.map(x=>x.id===p.id?{...x,status:'수락'}:x));
    setListings(ls=>ls.map(l=>l.id===p.listingId?{...l,status:'거래중'}:l));
  };
  const rejectProposal = p => {
    setProposals(ps=>ps.map(x=>x.id===p.id?{...x,status:'거절'}:x));
    showToast('제안을 거절했습니다');
  };
  const newProposal = draft => {
    const listing = listings.find(l=>l.id===draft.listingId);
    setProposals(ps=>[{id:'P-'+Math.floor(500+Math.random()*90), listingId:draft.listingId, item:listing?listing.item:'', buyer:'김도현', quantity:Number(draft.quantity), price:Number(draft.price), condition:draft.condition||'협의', status:'대기'}, ...ps]);
    showToast('구매 제안을 전송했습니다');
  };

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <TopHeader screen={screen} go={go} showSearch={screen==='main'} cat={cat} setCat={setCat} region={region} setRegion={setRegion} weight={weight} setWeight={setWeight} onSearch={()=>showToast('검색 조건이 적용되었습니다')}/>
      <div style={{flex:1,width:'100%'}}>
        {screen==='main' && <MainScreen listings={listings} cat={cat} setCat={setCat} region={region} setRegion={setRegion} weight={weight} setWeight={setWeight} onOpen={setSelected} saved={saved} onToggleSave={toggleSave} go={go}/>}
        {screen==='listing' && <ListingForm onSubmit={submitListing}/>}
        {screen==='proposal' && <ProposalScreen proposals={proposals} listings={listings} onAccept={acceptProposal} onReject={rejectProposal} onNewProposal={newProposal}/>}
        {screen==='mypage' && <MypageScreen/>}
      </div>
      <Footer/>
      <QuickView listing={selected} onClose={()=>setSelected(null)} onPropose={()=>{go('proposal'); setSelected(null);}}/>
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
