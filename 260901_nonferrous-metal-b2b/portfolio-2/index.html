<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메탈로그 옵스 — 비철금속 B2B 거래 운영 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --iris:#5683da; --iris-dark:#3f68bd; --ember:#ff8964; --frost:#d1d1d1; --linen:#e5e5e7;
  --canvas:#ffffff; --ink:#090a0c; --smoke:#95979e; --ash:#a9a9aa;
  --shadow-card: 0 10px 30px rgba(9,10,12,.09);
  --shadow-elev: 0 16px 40px rgba(86,131,218,.16);
  --radius: 14px; --radius-sm: 8px; --radius-pill: 9999px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--linen);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
#app-root{width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
h1,h2,h3,h4,p{margin:0;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--frost);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastPop{0%{opacity:0;transform:translateY(16px) scale(.96);}60%{opacity:1;transform:translateY(-2px) scale(1.01);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,137,100,.5);}70%{box-shadow:0 0 0 9px rgba(255,137,100,0);}100%{box-shadow:0 0 0 0 rgba(255,137,100,0);}}

.sidebar-link{transition:background .15s ease,color .15s ease;}
.sidebar-link:hover{background:rgba(86,131,218,.08);}
.card-hover{transition:transform .16s ease,box-shadow .16s ease;}
.card-hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-elev);}
.btn-primary{background:var(--iris);color:#fff;border:none;border-radius:var(--radius-pill);font-weight:600;font-size:14px;padding:11px 22px;box-shadow:var(--shadow-card);transition:filter .15s ease,transform .12s ease;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--frost);color:var(--ink);border-radius:var(--radius-pill);font-weight:500;font-size:13px;padding:9px 18px;transition:border-color .15s ease,background .15s ease;}
.btn-ghost:hover{border-color:var(--iris);background:rgba(86,131,218,.06);}
.kbd{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--frost);border-radius:5px;padding:2px 6px;color:var(--smoke);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;}
.badge-wait{background:rgba(149,151,158,.16);color:var(--smoke);}
.badge-progress{background:rgba(86,131,218,.14);color:var(--iris-dark);}
.badge-done{background:rgba(255,137,100,.16);color:#c65526;}
.stage-card{background:#fff;border:1px solid var(--linen);border-radius:var(--radius-sm);padding:12px;box-shadow:0 3px 10px rgba(9,10,12,.05);}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="app-root"></div>
<script type="text/babel">
const {useState, useMemo, useRef, useEffect} = React;
const {PieChart, Pie, Cell, ResponsiveContainer, Tooltip} = Recharts;
const SLUG = 'nonferrous-b2b-ops-platform';
const won = n => n.toLocaleString('ko-KR');

const STAGES = ['거래확정','배차대기','배차완료','상차완료','운송중','도착','계근완료','검수완료','최종금액확정','구매자입금확인','판매자지급완료','거래완료'];

const NAV = [
  {key:'main', label:'운영자 통합 현황판', icon:'ph-squares-four'},
  {key:'workflow', label:'12단계 거래 상태 관리', icon:'ph-kanban'},
  {key:'logistics', label:'물류·계근·검수 관리', icon:'ph-truck'},
  {key:'settlement', label:'정산 관리 및 자동 계산', icon:'ph-calculator'},
];

const INITIAL_TX = [
  {id:'TR-88401', item:'구리 스크랩 (1호선)', buyer:'대성비철(주)', seller:'김도현', stage:0, weightConfirmed:null, finalPrice:null, weightBooked:12000, urgency:'긴급', waitHours:2},
  {id:'TR-88397', item:'알루미늄 캔 압축(P1000)', buyer:'한강메탈', seller:'이수민', stage:2, weightConfirmed:null, finalPrice:null, weightBooked:8500, urgency:'보통', waitHours:6},
  {id:'TR-88390', item:'스테인리스 304 절단roll', buyer:'우진자원', seller:'박정우', stage:4, weightConfirmed:null, finalPrice:null, weightBooked:6200, urgency:'긴급', waitHours:1},
  {id:'TR-88382', item:'황동 스크랩', buyer:'대성비철(주)', seller:'최윤아', stage:6, weightConfirmed:4280, finalPrice:9550, weightBooked:4300, urgency:'보통', waitHours:9},
  {id:'TR-88375', item:'전선 스크랩(피복동선)', buyer:'한강메탈', seller:'정하늘', stage:7, weightConfirmed:3980, finalPrice:9750, weightBooked:4000, urgency:'긴급', waitHours:3},
  {id:'TR-88361', item:'니켈합금 스크랩', buyer:'서라벌금속', seller:'한지훈', stage:9, weightConfirmed:1790, finalPrice:24700, weightBooked:1800, urgency:'보통', waitHours:14},
  {id:'TR-88350', item:'아연 다이캐스팅 스크랩', buyer:'우진자원', seller:'오세영', stage:10, weightConfirmed:5280, finalPrice:3820, weightBooked:5300, urgency:'낮음', waitHours:22},
  {id:'TR-88340', item:'동파이프 스크랩', buyer:'대성비철(주)', seller:'서지민', stage:11, weightConfirmed:3080, finalPrice:10850, weightBooked:3100, urgency:'낮음', waitHours:40},
];

const FUNNEL = [
  {label:'신규문의', count:14}, {label:'승인대기', count:6}, {label:'판매중 물량', count:31}, {label:'구매제안', count:9}
];
const PIE_DATA = [
  {name:'대기/신규', value:20, color:'#a9a9aa'},
  {name:'거래·배차', value:16, color:'#5683da'},
  {name:'운송·검수', value:22, color:'#7fa0e6'},
  {name:'정산', value:18, color:'#ff8964'},
  {name:'완료', value:24, color:'#c65526'},
];

function stageGroup(stage){
  if(stage===0) return '거래확정';
  if(stage>=1 && stage<=4) return '운송중';
  if(stage>=5 && stage<=7) return '검수대기';
  if(stage>=8 && stage<=10) return '정산대기';
  return '거래완료';
}

function Toast({toast}){
  if(!toast) return null;
  return (
    <div style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',background:'var(--ink)',color:'#fff',padding:'12px 22px',borderRadius:12,fontSize:13,fontWeight:500,boxShadow:'0 10px 30px rgba(0,0,0,.3)',zIndex:900,animation:'toastPop .35s ease-out',display:'flex',alignItems:'center',gap:8}}>
      <i className="ph-bold ph-check-circle" style={{color:'var(--ember)'}}></i>{toast}
    </div>
  );
}

function CmdK({open, onClose, go}){
  const [q,setQ]=useState('');
  if(!open) return null;
  const items = NAV.filter(n=>n.label.includes(q));
  return (
    <div className="cmdk-overlay" data-cmdk style={{position:'fixed',inset:0,background:'rgba(9,10,12,.45)',zIndex:400,display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:120}} onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()} style={{width:520,maxWidth:'90vw',background:'#fff',borderRadius:16,boxShadow:'0 30px 60px rgba(0,0,0,.35)',animation:'cmdkIn .18s ease-out',overflow:'hidden'}}>
        <input className="cmdk-input" autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="명령 또는 검색…" style={{width:'100%',border:'none',borderBottom:'1px solid var(--linen)',padding:'18px 20px',fontSize:15,outline:'none'}}/>
        <div className="cmdk-results" style={{padding:8}}>
          <div className="cmdk-group">
            <div className="cmdk-group-title" style={{fontSize:11,fontWeight:600,color:'var(--smoke)',padding:'8px 12px'}}>이동</div>
            {items.map(n=>(
              <div key={n.key} className="cmdk-item" onClick={()=>{go(n.key);onClose();}} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,fontSize:14,cursor:'pointer'}}>
                <span className="kbd">⏎</span><i className={`ph ${n.icon}`}></i>{n.label}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function Sidebar({screen, go}){
  return (
    <aside className="sidebar" data-sidebar style={{width:264,minWidth:264,position:'fixed',left:0,top:0,bottom:0,background:'#fff',borderRight:'1px solid var(--linen)',display:'flex',flexDirection:'column',zIndex:50}}>
      <div className="sidebar-brand" style={{height:64,display:'flex',alignItems:'center',gap:10,padding:'0 20px',borderBottom:'1px solid var(--linen)'}}>
        <div style={{width:30,height:30,borderRadius:9,background:'var(--iris)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <i className="ph-bold ph-recycle" style={{color:'#fff',fontSize:16}}></i>
        </div>
        <span style={{fontWeight:700,fontSize:15}}>메탈로그 옵스</span>
      </div>
      <div className="sidebar-cmdk-hint" style={{margin:'14px 20px',padding:'9px 12px',background:'var(--linen)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:12,color:'var(--smoke)',cursor:'pointer'}} onClick={()=>window.dispatchEvent(new Event('open-cmdk'))}>
        빠른 검색 <span className="kbd">⌘ K</span>
      </div>
      <nav className="sidebar-nav" style={{padding:'4px 12px',display:'flex',flexDirection:'column',gap:2}}>
        {NAV.map(n=>(
          <a key={n.key} className="sidebar-link" onClick={()=>go(n.key)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,fontSize:13.5,fontWeight:600,cursor:'pointer',color:screen===n.key?'var(--iris-dark)':'var(--ink)',background:screen===n.key?'rgba(86,131,218,.10)':'transparent',borderLeft:screen===n.key?'3px solid var(--iris)':'3px solid transparent'}}>
            <span className="icon"><i className={`ph ${n.icon}`} style={{fontSize:17}}></i></span>{n.label}
          </a>
        ))}
      </nav>
      <div className="sidebar-section" style={{padding:'16px 12px 4px'}}>
        <div className="sidebar-section-title" style={{fontSize:11,fontWeight:600,color:'var(--smoke)',padding:'0 12px 8px'}}>운영 도구</div>
        <a className="sidebar-link" style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,fontSize:13.5,color:'var(--ink)',cursor:'pointer'}}><i className="ph ph-clipboard-text" style={{fontSize:17}}></i>대행 입력</a>
        <a className="sidebar-link" style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,fontSize:13.5,color:'var(--ink)',cursor:'pointer'}}><i className="ph ph-user-check" style={{fontSize:17}}></i>회원 승인</a>
        <a className="sidebar-link" style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,fontSize:13.5,color:'var(--ink)',cursor:'pointer'}}><i className="ph ph-chart-line-up" style={{fontSize:17}}></i>운영지표 리포트</a>
      </div>
      <div className="sidebar-user" style={{marginTop:'auto',padding:16,borderTop:'1px solid var(--linen)',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--ember)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>운</div>
        <div>
          <div style={{fontSize:12.5,fontWeight:600}}>운영자 이하람</div>
          <div style={{fontSize:11,color:'var(--smoke)'}}>ops@metallog.local</div>
        </div>
      </div>
    </aside>
  );
}

function Topbar({crumbs}){
  const [notifOpen, setNotifOpen] = useState(false);
  const notifications = [
    {title:'TR-88401 거래확정', desc:'대성비철(주)이 구매 제안을 수락했습니다', time:'12분 전'},
    {title:'TR-88382 계근완료', desc:'황동 스크랩 계근표가 등록되었습니다', time:'41분 전'},
    {title:'TR-88375 검수완료', desc:'전선 스크랩 검수자료가 확인되었습니다', time:'1시간 전'},
  ];
  return (
    <header className="topbar" style={{height:56,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 28px',borderBottom:'1px solid var(--linen)',background:'#fff',position:'sticky',top:0,zIndex:40}}>
      <nav className="breadcrumb" style={{fontSize:13,color:'var(--smoke)',display:'flex',alignItems:'center',gap:6}}>
        {crumbs.map((c,i)=>(
          <React.Fragment key={c}>
            {i>0 && <span className="divider">/</span>}
            <span style={{color:i===crumbs.length-1?'var(--ink)':'var(--smoke)',fontWeight:i===crumbs.length-1?600:400}}>{c}</span>
          </React.Fragment>
        ))}
      </nav>
      <div className="topbar-actions" style={{display:'flex',gap:10,alignItems:'center',position:'relative'}}>
        <button className="btn-cmdk" data-cmdk-trigger onClick={()=>window.dispatchEvent(new Event('open-cmdk'))} style={{border:'1px solid var(--frost)',background:'#fff',borderRadius:8,padding:'7px 12px',fontSize:12,color:'var(--smoke)',display:'flex',alignItems:'center',gap:6}}>
          <i className="ph ph-magnifying-glass"></i>⌘K
        </button>
        <button className="btn-primary" onClick={()=>setNotifOpen(o=>!o)} style={{padding:'8px 16px',fontSize:13}}><i className="ph-bold ph-bell" style={{marginRight:6}}></i>알림 3</button>
        {notifOpen && (
          <div style={{position:'absolute',top:44,right:0,width:300,background:'#fff',border:'1px solid var(--linen)',borderRadius:12,boxShadow:'0 16px 40px rgba(9,10,12,.18)',padding:8,zIndex:60,animation:'fadeInUp .2s ease-out'}}>
            {notifications.map((n,i)=>(
              <div key={i} style={{padding:'10px 12px',borderRadius:8}}>
                <div style={{fontSize:12.5,fontWeight:700}}>{n.title}</div>
                <div style={{fontSize:11.5,color:'var(--smoke)',marginTop:2}}>{n.desc}</div>
                <div style={{fontSize:10.5,color:'var(--ash)',marginTop:3}}>{n.time}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </header>
  );
}

function MainScreen({tx, go, showToast}){
  const groupCounts = useMemo(()=>{
    const g = {'거래확정':0,'운송중':0,'검수대기':0,'정산대기':0,'거래완료':0};
    tx.forEach(t=> g[stageGroup(t.stage)]++ );
    return g;
  },[tx]);
  const funnelPlusTx = [...FUNNEL,
    {label:'거래확정', count:groupCounts['거래확정']}, {label:'운송중', count:groupCounts['운송중']},
    {label:'검수대기', count:groupCounts['검수대기']}, {label:'정산대기', count:groupCounts['정산대기']}
  ];
  const priorityQueue = [...tx].sort((a,b)=> (a.urgency==='긴급'?0:1) - (b.urgency==='긴급'?0:1) || b.waitHours-a.waitHours).slice(0,5);
  const targetScreen = t => t.stage<=4 ? 'workflow' : (t.stage<=7 ? 'logistics' : 'settlement');

  return (
    <div style={{padding:'28px 32px 60px'}}>
      <div style={{marginBottom:22}}>
        <div style={{height:5,width:130,borderRadius:4,background:'linear-gradient(90deg, var(--iris), var(--ember))',marginBottom:16}}></div>
        <h2 style={{fontSize:40,fontWeight:700,letterSpacing:'-0.02em'}}>운영자 통합 현황판</h2>
        <p style={{fontSize:13,color:'var(--smoke)',marginTop:8}}>신규문의부터 정산대기까지 전체 거래 현황과 다음 조치사항을 한 화면에서 확인합니다.</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'2.4fr 1fr',gap:20,alignItems:'flex-start'}}>
        <section className="board" style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:14}}>
          {funnelPlusTx.map((f,i)=>(
            <div key={f.label} className="stage-card card-hover" style={{animation:`fadeInUp .4s ease ${i*0.04}s both`}}>
              <div style={{fontSize:12,color:'var(--smoke)',fontWeight:600}}>{f.label}</div>
              <div style={{fontSize:26,fontWeight:700,marginTop:6}}>{f.count}</div>
              <div style={{marginTop:10,height:4,background:'var(--linen)',borderRadius:4,overflow:'hidden'}}>
                <div style={{width:`${Math.min(100,f.count*3)}%`,height:'100%',background:'var(--iris)',transformOrigin:'bottom',animation:'barGrow .5s ease-out'}}></div>
              </div>
            </div>
          ))}
        </section>

        <aside className="matrix-side" style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="stage-card" style={{padding:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>단계별 거래 분포</div>
            <div style={{height:180,position:'relative'}}>
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={PIE_DATA} dataKey="value" nameKey="name" innerRadius={45} outerRadius={70} paddingAngle={2}>
                    {PIE_DATA.map((d,i)=><Cell key={i} fill={d.color}/>)}
                  </Pie>
                  <Tooltip/>
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>
          <div className="stage-card" style={{padding:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:'var(--ember)',display:'inline-block',animation:'pulseDot 1.8s infinite'}}></span>
              우선 조치 큐
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {priorityQueue.map(t=>(
                <div key={t.id} onClick={()=>{go(targetScreen(t)); showToast(`${t.id} 상세로 이동합니다`);}} style={{border:'1px solid var(--linen)',borderRadius:10,padding:'10px 12px',cursor:'pointer'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontSize:12.5,fontWeight:600}}>{t.item}</span>
                    <span className={`badge ${t.urgency==='긴급'?'badge-done':'badge-wait'}`}>{t.urgency}</span>
                  </div>
                  <div style={{fontSize:11,color:'var(--smoke)',marginTop:4}}>{t.id} · 대기 {t.waitHours}시간 · {STAGES[t.stage]}</div>
                </div>
              ))}
            </div>
          </div>
        </aside>
      </div>
    </div>
  );
}

function WorkflowScreen({tx, setTx, showToast}){
  const move = (id, dir) => {
    setTx(list=>list.map(t=>{
      if(t.id!==id) return t;
      const next = t.stage + dir;
      if(next<0 || next>11) return t;
      if(dir<0){ showToast('이전 단계로 되돌릴 수 없습니다'); return t; }
      return {...t, stage:next};
    }));
  };
  const onDrop = (e, colIdx) => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    setTx(list=>list.map(t=>{
      if(t.id!==id) return t;
      if(colIdx !== t.stage+1){ showToast('순차 전이만 허용됩니다 — 다음 단계로만 이동할 수 있습니다'); return t; }
      return {...t, stage:colIdx};
    }));
  };

  return (
    <div style={{padding:'28px 32px 60px'}}>
      <div style={{marginBottom:18}}>
        <h2 style={{fontSize:22,fontWeight:700}}>12단계 거래 상태 관리</h2>
        <p style={{fontSize:13,color:'var(--smoke)',marginTop:4}}>거래확정부터 거래완료까지 순차 전이만 허용하는 상태 머신으로 처리합니다. 카드를 드래그하거나 화살표 버튼으로 다음 단계로 전환하세요.</p>
      </div>
      <div style={{display:'flex',gap:12,overflowX:'auto',paddingBottom:10}}>
        {STAGES.map((s,colIdx)=>(
          <div key={s} onDragOver={e=>e.preventDefault()} onDrop={e=>onDrop(e,colIdx)} style={{minWidth:190,background:'#fff',border:'1px solid var(--linen)',borderRadius:12,padding:10,flexShrink:0}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--iris-dark)',padding:'4px 6px',display:'flex',justifyContent:'space-between'}}>
              <span>{s}</span><span style={{color:'var(--smoke)'}}>{tx.filter(t=>t.stage===colIdx).length}</span>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:6,minHeight:40}}>
              {tx.filter(t=>t.stage===colIdx).map(t=>(
                <div key={t.id} draggable onDragStart={e=>e.dataTransfer.setData('text/plain', t.id)} className="card-hover" style={{background:'var(--linen)',borderRadius:9,padding:10,cursor:'grab'}}>
                  <div style={{fontSize:12,fontWeight:600}}>{t.item}</div>
                  <div style={{fontSize:10.5,color:'var(--smoke)',marginTop:3}}>{t.id}</div>
                  <div style={{display:'flex',justifyContent:'flex-end',gap:4,marginTop:6}}>
                    <button onClick={()=>move(t.id,-1)} title="이전 단계" style={{border:'none',background:'#fff',borderRadius:6,width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ph ph-arrow-left" style={{fontSize:11}}></i></button>
                    <button onClick={()=>move(t.id,1)} title="다음 단계" style={{border:'none',background:'var(--iris)',color:'#fff',borderRadius:6,width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ph ph-arrow-right" style={{fontSize:11}}></i></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function UploadDrop({label, files, onAdd}){
  const ref = useRef();
  return (
    <div style={{flex:1}}>
      <div style={{fontSize:12,fontWeight:600,color:'var(--smoke)',marginBottom:6}}>{label}</div>
      <div onClick={()=>ref.current.click()} style={{border:'1.5px dashed var(--frost)',borderRadius:10,padding:16,textAlign:'center',cursor:'pointer',background:files.length?'rgba(86,131,218,.05)':'#fff'}}>
        <i className={`ph ${files.length? 'ph-check-circle':'ph-upload-simple'}`} style={{fontSize:20,color:files.length?'var(--iris)':'var(--smoke)'}}></i>
        <div style={{fontSize:12,color:'var(--smoke)',marginTop:4}}>{files.length? `${files.length}개 첨부됨` : '클릭하여 사진 첨부'}</div>
      </div>
      <input ref={ref} type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>onAdd(Array.from(e.target.files||[]))}/>
    </div>
  );
}

function LogisticsScreen({tx, setTx, showToast}){
  const eligible = tx.filter(t=>t.stage>=1 && t.stage<=7);
  const [selectedId, setSelectedId] = useState(eligible[0]?.id);
  const selected = tx.find(t=>t.id===selectedId) || eligible[0];
  const [weighFiles, setWeighFiles] = useState([]);
  const [inspectFiles, setInspectFiles] = useState([]);
  const [weightInput, setWeightInput] = useState('');

  if(!selected) return <div style={{padding:32}}>처리할 물류 건이 없습니다.</div>;

  const completeWeighing = () => {
    if(!weighFiles.length || !weightInput) { showToast('계근표 사진과 계근중량을 입력해야 합니다'); return; }
    setTx(list=>list.map(t=>t.id===selected.id?{...t, stage:6, weightConfirmed:Number(weightInput)}:t));
    showToast('계근완료로 상태가 전환되었습니다');
  };
  const completeInspection = () => {
    if(!inspectFiles.length){ showToast('검수자료 사진을 첨부해야 합니다'); return; }
    setTx(list=>list.map(t=>t.id===selected.id?{...t, stage:7, finalPrice: t.finalPrice || 9800}:t));
    showToast('검수완료로 상태가 전환되었습니다');
  };

  return (
    <div style={{padding:'28px 32px 60px',display:'grid',gridTemplateColumns:'320px 1fr',gap:20}}>
      <div>
        <h2 style={{fontSize:20,fontWeight:700,marginBottom:14}}>물류·계근·검수 관리</h2>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {eligible.map(t=>(
            <div key={t.id} onClick={()=>{setSelectedId(t.id);setWeighFiles([]);setInspectFiles([]);setWeightInput('');}} style={{border:`1px solid ${selectedId===t.id?'var(--iris)':'var(--linen)'}`,background:selectedId===t.id?'rgba(86,131,218,.06)':'#fff',borderRadius:10,padding:12,cursor:'pointer'}}>
              <div style={{fontSize:12.5,fontWeight:600}}>{t.item}</div>
              <div style={{fontSize:11,color:'var(--smoke)',marginTop:3}}>{t.id} · {STAGES[t.stage]}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="stage-card" style={{padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div>
            <div style={{fontSize:17,fontWeight:700}}>{selected.item}</div>
            <div style={{fontSize:12,color:'var(--smoke)',marginTop:2}}>{selected.id} · 배차중량 {won(selected.weightBooked)}kg · 현재 {STAGES[selected.stage]}</div>
          </div>
          <span className="badge badge-progress">{STAGES[selected.stage]}</span>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12,marginBottom:20}}>
          <div><div style={{fontSize:11,color:'var(--smoke)'}}>배차</div><div style={{fontSize:13,fontWeight:600,marginTop:2}}>1톤 카고 · 기사 강민석</div></div>
          <div><div style={{fontSize:11,color:'var(--smoke)'}}>상차</div><div style={{fontSize:13,fontWeight:600,marginTop:2}}>완료 · 2025.03.19 09:20</div></div>
          <div><div style={{fontSize:11,color:'var(--smoke)'}}>운송</div><div style={{fontSize:13,fontWeight:600,marginTop:2}}>진행중 · 예상 도착 14:00</div></div>
          <div><div style={{fontSize:11,color:'var(--smoke)'}}>계근중량</div><div style={{fontSize:13,fontWeight:600,marginTop:2}}>{selected.weightConfirmed? `${won(selected.weightConfirmed)}kg` : '미입력'}</div></div>
        </div>

        <div style={{borderTop:'1px solid var(--linen)',paddingTop:18}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>계근 처리</div>
          <div style={{display:'flex',gap:16,alignItems:'flex-end'}}>
            <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:12,fontWeight:600,color:'var(--smoke)'}}>계근중량(kg)
              <input type="number" value={weightInput} onChange={e=>setWeightInput(e.target.value)} style={{padding:'9px 12px',border:'1px solid var(--frost)',borderRadius:8,width:160}}/>
            </label>
            <UploadDrop label="계근표 사진" files={weighFiles} onAdd={f=>setWeighFiles(fl=>[...fl,...f])}/>
            <button className="btn-primary" onClick={completeWeighing}>계근완료 처리</button>
          </div>
        </div>

        <div style={{borderTop:'1px solid var(--linen)',paddingTop:18,marginTop:18}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>검수 처리</div>
          <div style={{display:'flex',gap:16,alignItems:'flex-end'}}>
            <UploadDrop label="검수자료 사진" files={inspectFiles} onAdd={f=>setInspectFiles(fl=>[...fl,...f])}/>
            <button className="btn-primary" onClick={completeInspection}>검수완료 처리</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettlementScreen({tx, setTx, showToast}){
  const settleable = tx.filter(t=>t.stage>=6 && t.weightConfirmed);
  const [flags, setFlags] = useState({});
  const toggle = (id, key) => setFlags(f=>({...f,[id]:{...f[id],[key]:!f[id]?.[key]}}));
  const exportPdf = t => showToast(`${t.id} 정산내역서를 생성했습니다`);

  return (
    <div style={{padding:'28px 32px 60px'}}>
      <h2 style={{fontSize:22,fontWeight:700,marginBottom:6}}>정산 관리 및 자동 계산</h2>
      <p style={{fontSize:13,color:'var(--smoke)',marginBottom:20}}>계근중량 × 확정단가를 서버 단일 소스로 계산하고, 입금·지급 상태를 분리 관리합니다.</p>

      <div style={{background:'#fff',border:'1px solid var(--linen)',borderRadius:14,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'1.4fr .8fr .8fr .8fr 1fr 1fr',padding:'12px 18px',fontSize:11,fontWeight:700,color:'var(--smoke)',borderBottom:'1px solid var(--linen)'}}>
          <div>거래</div><div>계근중량</div><div>확정단가</div><div>최종금액</div><div>입금/지급</div><div>내역서</div>
        </div>
        {settleable.map(t=>{
          const amount = t.weightConfirmed * (t.finalPrice||0);
          const f = flags[t.id]||{};
          return (
            <div key={t.id} style={{display:'grid',gridTemplateColumns:'1.4fr .8fr .8fr .8fr 1fr 1fr',padding:'14px 18px',fontSize:13,alignItems:'center',borderBottom:'1px solid var(--linen)'}}>
              <div>
                <div style={{fontWeight:600}}>{t.item}</div>
                <div style={{fontSize:11,color:'var(--smoke)'}}>{t.id}</div>
              </div>
              <div>{won(t.weightConfirmed)}kg</div>
              <div>{won(t.finalPrice)}원</div>
              <div style={{fontWeight:700,color:'var(--iris-dark)'}}>{won(amount)}원</div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>toggle(t.id,'paid')} className="badge" style={{border:'none',cursor:'pointer',background:f.paid?'rgba(255,137,100,.18)':'var(--linen)',color:f.paid?'#c65526':'var(--smoke)'}}>{f.paid?'입금완료':'입금확인'}</button>
                <button onClick={()=>toggle(t.id,'settled')} className="badge" style={{border:'none',cursor:'pointer',background:f.settled?'rgba(86,131,218,.18)':'var(--linen)',color:f.settled?'var(--iris-dark)':'var(--smoke)'}}>{f.settled?'지급완료':'지급대기'}</button>
              </div>
              <div>
                <button className="btn-ghost" style={{padding:'6px 12px',fontSize:11}} onClick={()=>exportPdf(t)}><i className="ph ph-file-pdf" style={{marginRight:4}}></i>PDF</button>
              </div>
            </div>
          );
        })}
        {settleable.length===0 && <div style={{padding:40,textAlign:'center',color:'var(--smoke)',fontSize:13}}>정산 대상 거래가 없습니다.</div>}
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('main');
  const [tx,setTx]=useState(INITIAL_TX);
  const [cmdkOpen,setCmdkOpen]=useState(false);
  const [toast,setToast]=useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null),2200); };
  const go = s => { setScreen(s); window.scrollTo(0,0); };

  useEffect(()=>{
    const openHandler = ()=>setCmdkOpen(true);
    window.addEventListener('open-cmdk', openHandler);
    const keyHandler = e => { if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); setCmdkOpen(true); } if(e.key==='Escape') setCmdkOpen(false); };
    window.addEventListener('keydown', keyHandler);
    return ()=>{ window.removeEventListener('open-cmdk', openHandler); window.removeEventListener('keydown', keyHandler); };
  },[]);

  const crumbLabel = NAV.find(n=>n.key===screen)?.label || '';

  return (
    <div style={{display:'flex',width:'100%',minHeight:'100vh'}}>
      <Sidebar screen={screen} go={go}/>
      <main className="main" style={{marginLeft:264,flex:1,minWidth:0,width:'calc(100% - 264px)'}}>
        <Topbar crumbs={['운영', crumbLabel]}/>
        <div className="content">
          {screen==='main' && <MainScreen tx={tx} go={go} showToast={showToast}/>}
          {screen==='workflow' && <WorkflowScreen tx={tx} setTx={setTx} showToast={showToast}/>}
          {screen==='logistics' && <LogisticsScreen tx={tx} setTx={setTx} showToast={showToast}/>}
          {screen==='settlement' && <SettlementScreen tx={tx} setTx={setTx} showToast={showToast}/>}
        </div>
      </main>
      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} go={go}/>
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
