<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>늘봄복지 통합관리 허브 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --primary:#202020; --secondary:#e8e8e8; --accent:#0091ff;
  --bg:#ffffff; --surface:#f8f9fa; --band:#e9ebf0;
  --text:#202020; --text2:#646464; --text3:#b3b3b3;
  --border:#e8e8e8; --border-strong:#d4d4d4;
  --violet:#6647f0; --mint:#6ee7b7; --green:#00c07a; --teal:#16c0a4; --red:#e5484d; --amber:#ff9f2d;
  --radius:9px; --radius-sm:7px; --radius-pill:9999px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em; font-size:14px;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200px 0} 100%{background-position:200px 0}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,145,255,.45)} 70%{box-shadow:0 0 0 8px rgba(0,145,255,0)} 100%{box-shadow:0 0 0 0 rgba(0,145,255,0)}}
@keyframes toastIn{from{transform:translateY(14px); opacity:0} to{transform:translateY(0); opacity:1}}
@keyframes ringGrow{from{stroke-dashoffset:283} to{stroke-dashoffset:var(--ring-final,60)}}
@keyframes drawerSlide{from{transform:translateX(24px); opacity:0} to{transform:translateX(0); opacity:1}}

/* ── sidebar ── */
.sidebar{position:fixed; left:0; top:0; bottom:0; width:264px; background:var(--primary); color:#fff;
  display:flex; flex-direction:column; z-index:40;}
.sb-brand{height:60px; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid rgba(255,255,255,.1);}
.sb-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0091ff,#6647f0);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.sb-brand b{font-size:14.5px;font-weight:700;}
.sb-brand span{display:block;font-size:10.5px;color:#b3b3b3;font-weight:400;}
.sb-nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.sb-section-title{font-size:10.5px; color:#8a8a8a; text-transform:uppercase; letter-spacing:.06em; padding:14px 12px 6px;}
.sb-link{display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:8px;
  font-size:12.5px; line-height:1.35; color:#b3b3b3; background:transparent; border:none; text-align:left; width:100%;
  border-left:3px solid transparent; transition:background .12s, color .12s;}
.sb-link i{font-size:16px; margin-top:1px; flex-shrink:0;}
.sb-link:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-link.active{background:rgba(255,255,255,.09); color:#fff; font-weight:600; border-left-color:var(--accent);}
.sb-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.1); padding:12px 14px; display:flex; align-items:center; gap:10px;}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0091ff,#6ee7b7);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#111;}
.sb-foot b{font-size:12.5px;display:block;}
.sb-foot span{font-size:10.5px;color:#8a8a8a;}

/* ── main ── */
.main-wrap{margin-left:264px; min-height:100vh; flex:1; min-width:0; width:calc(100% - 264px);
  display:flex; flex-direction:column;}
.topbar{height:58px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; position:sticky; top:0; background:rgba(255,255,255,.94); backdrop-filter:blur(6px); z-index:20;}
.breadcrumb{font-size:12.5px; color:var(--text3); display:flex; align-items:center; gap:8px;}
.breadcrumb b{color:var(--text); font-weight:600;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.scope-switch{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-pill); padding:4px; font-size:12px;}
.scope-switch button{border:none; background:transparent; padding:6px 12px; border-radius:var(--radius-pill); color:var(--text2); font-weight:600;}
.scope-switch button.active{background:var(--primary); color:#fff;}
.content{padding:26px 30px 60px; max-width:1440px;}

.page-hero{padding:22px 0 26px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.page-hero h1{font-size:40px; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px; line-height:1.08;}
.page-hero p{font-size:14px; color:var(--text2); margin:0; max-width:520px;}
.btn{border:none; border-radius:var(--radius-pill); font-weight:700; display:inline-flex; align-items:center; gap:7px; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff; padding:11px 20px; font-size:13.5px;}
.btn-primary:hover{background:#000;}
.btn-outline{background:#fff; border:1px solid var(--border); color:var(--text); padding:10px 18px; font-size:13px;}
.btn-outline:hover{border-color:var(--accent); color:var(--accent);}
.btn-ghost{background:transparent; color:var(--text2); padding:8px 12px; font-size:13px; border-radius:8px;}
.btn-ghost:hover{background:var(--surface); color:var(--text);}
.btn-sm{padding:6px 13px; font-size:12px;}
.btn-danger-outline{background:#fff; border:1px solid #f3c9ca; color:var(--red); padding:8px 14px; font-size:12.5px; border-radius:var(--radius-pill);}

.master-detail{display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start;}
.list-rail{background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.list-rail-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px;}
.search-box{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:8px 12px;}
.search-box input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--text);}
.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--border); background:#fff; border-radius:var(--radius-pill); padding:5px 12px; font-size:11.5px; color:var(--text2); font-weight:600;}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.rail-list{max-height:560px; overflow-y:auto;}
.rail-item{width:100%; text-align:left; border:none; background:transparent; padding:13px 16px; display:flex; flex-direction:column; gap:4px;
  border-bottom:1px solid var(--border); border-left:3px solid transparent; animation:fadeInUp .28s ease-out backwards;}
.rail-item:hover{background:var(--surface);}
.rail-item.active{background:#eef6ff; border-left-color:var(--accent);}
.rail-item-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.rail-item-top b{font-size:13.5px; font-weight:700;}
.rail-item-sub{font-size:11.5px; color:var(--text3);}
.dot{width:7px;height:7px;border-radius:50%; display:inline-block; flex-shrink:0;}
.dot.green{background:var(--green); animation:pulseDot 2s infinite;}
.dot.amber{background:var(--amber);}

.detail-panel{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:24px; animation:drawerSlide .25s ease-out;}
.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border);}
.detail-head h2{font-size:22px; margin:0 0 6px; font-weight:800; letter-spacing:-0.01em;}
.detail-head .meta{font-size:12.5px; color:var(--text3);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 11px; border-radius:var(--radius-pill);}
.badge.blue{background:#e6f4ff; color:#0072cc;}
.badge.green{background:#e2f8ee; color:#00834f;}
.badge.amber{background:#fff3e0; color:#b5690a;}
.badge.violet{background:#efe9fd; color:var(--violet);}
.badge.red{background:#fde9e9; color:#c22a2e;}
.badge.gray{background:var(--surface); color:var(--text2); border:1px solid var(--border);}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:20px;}
.stat-card{border:1px solid var(--border); border-radius:var(--radius); padding:16px; background:#fff;}
.stat-card .num{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
.stat-card .lbl{font-size:11.5px; color:var(--text3); margin-top:3px;}

.matrix{width:100%; border-collapse:collapse; font-size:12.5px;}
.matrix th{text-align:left; font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
.matrix td{padding:10px; border-bottom:1px solid var(--border);}
.toggle{width:38px; height:22px; border-radius:var(--radius-pill); border:none; background:var(--border-strong); position:relative; transition:background .15s; flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .knob{transform:translateX(16px);}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table thead th{text-align:left; font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em;
  padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface);}
.data-table tbody td{padding:12px 14px; border-bottom:1px solid var(--border);}
.data-table tbody tr{cursor:pointer; transition:background .1s;}
.data-table tbody tr:hover{background:var(--surface);}
.card{border:1px solid var(--border); border-radius:var(--radius); background:#fff; padding:20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.card-head h3{font-size:15px; font-weight:700; margin:0;}
.chart-wrap{position:relative; height:220px;}

.filter-row{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
select.filter-select{border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px; font-size:12.5px; color:var(--text); background:#fff;}

.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,.42); display:flex; align-items:center; justify-content:center;
  z-index:100; animation:fadeInUp .18s ease-out;}
.modal{background:#fff; border-radius:16px; width:480px; max-width:92vw; max-height:86vh; overflow-y:auto;
  animation:fadeInScale .2s cubic-bezier(.2,.8,.2,1); box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{margin:0; font-size:16px; font-weight:800;}
.modal-close{border:none; background:var(--surface); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px;}
.field input, .field select{width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; outline:none;}
.field input:focus, .field select:focus{border-color:var(--accent);}

.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{display:flex; gap:12px; padding-bottom:16px; position:relative;}
.tl-item:not(:last-child)::before{content:''; position:absolute; left:5px; top:16px; bottom:0; width:1px; background:var(--border);}
.tl-dot{width:11px; height:11px; border-radius:50%; background:var(--accent); margin-top:3px; flex-shrink:0; z-index:1;}
.tl-body b{font-size:13px;}
.tl-body span{display:block; font-size:11.5px; color:var(--text3); margin-top:2px;}

.toast{position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--primary); color:#fff;
  padding:12px 22px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; z-index:200;
  animation:toastIn .25s ease-out; display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.2);}

.ring-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.ring-legend{display:flex; flex-direction:column; gap:8px; font-size:12.5px;}
.ring-legend .row{display:flex; align-items:center; gap:8px;}

.skel{height:12px; border-radius:6px; background:linear-gradient(90deg,var(--surface) 25%,#eef0f2 37%,var(--surface) 63%);
  background-size:400px 100%; animation:shimmer 1.4s infinite linear;}
.spin{display:inline-block; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function Icon({ name, className }) {
  return <i className={`ph ph-${name} ${className||''}`}></i>;
}

function Badge({ tone, children }) {
  return <span className={`badge ${tone}`}>{children}</span>;
}

function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return <div className="toast"><Icon name="check-circle" />{msg}</div>;
}

function Modal({ title, onClose, children, footer }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function ComplianceChart() {
  const ref = useRef(null);
  useEffect(() => {
    const strict = BIZ_UNITS.filter(b => b.policy === '엄격').length;
    const standard = BIZ_UNITS.length - strict;
    const chart = new Chart(ref.current, {
      type: 'doughnut',
      data: {
        labels: ['엄격 정책 적용', '표준 정책 적용'],
        datasets: [{ data: [strict, standard], backgroundColor: ['#202020', '#0091ff'], borderWidth: 0, borderRadius: 6, spacing: 3 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '68%' }
    });
    return () => chart.destroy();
  }, []);
  return <canvas ref={ref}></canvas>;
}

function ProgressRing({ pct }) {
  const r = 46, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return (
    <svg width="120" height="120" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#0091ff" />
          <stop offset="100%" stopColor="#6647f0" />
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r={r} fill="none" stroke="#e8e8e8" strokeWidth="10" />
      <circle cx="60" cy="60" r={r} fill="none" stroke="url(#ringGrad)" strokeWidth="10" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 60 60)"
        style={{ transition: 'stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)' }} />
      <text x="60" y="56" textAnchor="middle" fontSize="22" fontWeight="800" fill="#202020">{pct}%</text>
      <text x="60" y="74" textAnchor="middle" fontSize="10" fill="#b3b3b3">이관 완료율</text>
    </svg>
  );
}

          <div className="rail-list">
            {BIZ_UNITS.map((b,i) => (
              <button key={b.id} className={`rail-item ${selected===b.id?'active':''}`} style={{animationDelay:`${i*0.02}s`}} onClick={()=>{setSelected(b.id); setActive(b.status==='active');}}>
                <div className="rail-item-top"><b>{b.name}</b></div>
                <span className="rail-item-sub">{b.region}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="detail-panel">
          <div className="detail-head"><div><h2>{biz.name} 설정</h2><div className="meta">사업장 코드 {biz.id.toUpperCase()}</div></div></div>
          <div className="field"><label>사업장명</label><input defaultValue={biz.name} /></div>
          <div className="field"><label>담당자</label><input defaultValue={biz.manager} /></div>
          <div className="field"><label>지역</label><input defaultValue={biz.region} /></div>
          <div className="field" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <label style={{margin:0}}>운영 상태 (활성화)</label>
            <button className={`toggle ${active?'on':''}`} onClick={()=>setActive(!active)}><span className="knob"></span></button>
          </div>
          <button className="btn btn-primary" onClick={()=>toast('사업장 설정이 저장되었습니다')}><Icon name="floppy-disk" />저장</button>
        </div>
      </div>
    </div>
  );
}

const NAV = [
  { key:'main', label:'사업장별 권한 및 접근범위 관리', icon:'buildings' },
  { key:'member', label:'회원·회비 통합 관리', icon:'users-three' },
  { key:'privacy', label:'개인정보 접근이력 관리', icon:'shield-check' },
  { key:'migration', label:'레거시 데이터 이관 및 정합성 검증', icon:'database' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [settingsOn, setSettingsOn] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [superAdmin, setSuperAdmin] = useState(false);
  const toast = (m) => setToastMsg(m);

  const active = settingsOn ? 'settings' : screen;
  const go = (k) => { setSettingsOn(k==='settings'); if (k!=='settings') setScreen(k); };

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <aside className="sidebar">
        <div className="sb-brand">
          <div className="sb-mark">늘</div>
          <div><b>늘봄복지 허브</b><span>사내 업무관리시스템</span></div>
        </div>
        <nav className="sb-nav">
          {NAV.map(n => (
            <button key={n.key} className={`sb-link ${active===n.key?'active':''}`} onClick={()=>go(n.key)}>
              <Icon name={n.icon} /><span>{n.label}</span>
            </button>
          ))}
          <div className="sb-section-title">공용 메뉴</div>
          {MENUS.map(m => (
            <button key={m} className="sb-link" onClick={()=>toast(`${m} 화면으로 이동합니다`)}>
              <Icon name="dot-outline" /><span>{m}</span>
            </button>
          ))}
          <div className="sb-section-title">시스템</div>
          <button className={`sb-link ${active==='settings'?'active':''}`} onClick={()=>go('settings')}>
            <Icon name="gear-six" /><span>사업장 설정</span>
          </button>
        </nav>
        <div className="sb-foot">
          <div className="sb-avatar">전산</div>
          <div><b>전산 담당자</b><span>최고 관리자</span></div>
        </div>
      </aside>

      <div className="main-wrap">
        <div className="topbar">
          <div className="breadcrumb">늘봄복지 허브 <Icon name="caret-right" /> <b>{NAV.find(n=>n.key===screen)?.label.split(' ')[0] || '설정'}</b></div>
          <div className="topbar-actions">
            <div className="scope-switch">
              <button className={!superAdmin?'active':''} onClick={()=>setSuperAdmin(false)}>사업장 관리자</button>
              <button className={superAdmin?'active':''} onClick={()=>setSuperAdmin(true)}>상위 관리자</button>
            </div>
          </div>
        </div>
        <div className="content">
          {active==='main' && <MainScreen toast={toast} isSuperAdmin={superAdmin} />}
          {active==='member' && <MemberScreen toast={toast} />}
          {active==='privacy' && <PrivacyScreen toast={toast} />}
          {active==='migration' && <MigrationScreen toast={toast} />}
          {active==='settings' && <SettingsScreen toast={toast} />}
        </div>
      </div>
      {toastMsg && <Toast msg={toastMsg} onDone={()=>setToastMsg(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
