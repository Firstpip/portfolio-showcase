<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전사 운영 관제 및 결재 통합 플랫폼 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#fa5d00; --secondary:#c0bbb6; --accent:#1ef6da;
  --bg:#fff8f1; --surface:#ffffff; --glow:#fee3b5;
  --text:#1d1e1c; --text2:#615f5c; --text3:#8e8b87;
  --border:#e7dccc; --border-strong:#c0bbb6;
  --green:#1f9d63; --red:#d8483a; --amber:#c9820a; --blue:#2467d1;
  --radius:18px; --radius-sm:12px; --radius-pill:9999px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; letter-spacing:0.005em; font-size:14.5px;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

@keyframes floatIn{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}
@keyframes glowPulse{0%{opacity:.55} 50%{opacity:1} 100%{opacity:.55}}
@keyframes liveDot{0%{box-shadow:0 0 0 0 rgba(31,157,99,.5)} 70%{box-shadow:0 0 0 9px rgba(31,157,99,0)} 100%{box-shadow:0 0 0 0 rgba(31,157,99,0)}}
@keyframes toastRise{from{transform:translateY(16px); opacity:0} to{transform:translateY(0); opacity:1}}
@keyframes barGrow{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes railFade{from{opacity:0; transform:translateX(10px)} to{opacity:1; transform:translateX(0)}}

.topnav{width:100%; height:64px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 32px; position:sticky; top:0; z-index:30;}
.tn-brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;}
.tn-mark{width:32px;height:32px;border-radius:10px;background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.tn-tabs{display:flex; align-items:center; gap:4px;}
.tn-tab{border:none; background:transparent; padding:9px 16px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600; color:var(--text2);}
.tn-tab:hover{background:var(--glow); color:var(--text);}
.tn-tab.active{background:var(--primary); color:#fff;}
.tn-actions{display:flex; align-items:center; gap:10px;}
.tn-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ffb347); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800;}

.main-area{flex:1; width:100%; display:flex; flex-direction:column;}

.hero{position:relative; overflow:hidden; padding:40px 32px 32px; background:
  radial-gradient(60% 120% at 15% 0%, rgba(250,93,0,.16), transparent 60%),
  radial-gradient(50% 90% at 90% 10%, rgba(30,246,218,.18), transparent 55%), var(--bg);}
.hero-inner{position:relative; z-index:1;}
.hero h1{font-size:44px; font-weight:800; letter-spacing:0.01em; margin:0 0 10px; line-height:1.12;}
.hero p{font-size:15px; color:var(--text2); margin:0 0 4px; max-width:620px;}

.status-strip{display:flex; align-items:center; gap:0; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-pill); padding:6px 6px 6px 20px; margin-top:22px; flex-wrap:wrap; box-shadow:0 6px 20px rgba(250,93,0,.06);}
.status-item{display:flex; align-items:center; gap:9px; padding:8px 20px; border-right:1px solid var(--border); font-size:13px;}
.status-item:last-child{border-right:none;}
.status-item b{font-size:17px; font-weight:800;}
.live-dot{width:8px;height:8px;border-radius:50%; background:var(--green); animation:liveDot 2s infinite;}

.content{padding:28px 32px 64px; max-width:1480px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.section-title h2{font-size:17px; font-weight:800; margin:0;}
.pill{font-size:11px; font-weight:700; padding:4px 11px; border-radius:var(--radius-pill); background:var(--glow); color:#a54800;}

.tower-grid{display:grid; grid-template-columns:1.7fr 1fr; gap:22px; margin-bottom:24px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px;
  box-shadow:0 10px 28px rgba(60,40,10,.05);}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.card-head h3{font-size:15px; font-weight:700; margin:0;}

.tl-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.tl-label{width:64px; font-size:11.5px; color:var(--text3); flex-shrink:0;}
.tl-track{flex:1; height:30px; background:#fbf1e4; border-radius:8px; position:relative; overflow:hidden;}
.tl-block{position:absolute; top:3px; bottom:3px; border-radius:6px; display:flex; align-items:center; padding:0 10px;
  font-size:11px; font-weight:700; color:#fff; transform-origin:left; animation:barGrow .5s ease-out backwards;}

.rail-list{display:flex; flex-direction:column; gap:10px;}
.rail-card{border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 14px; display:flex; flex-direction:column; gap:6px;
  animation:railFade .3s ease-out backwards; background:#fffdfa;}
.rail-card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.rail-card b{font-size:13px;}
.rail-card .due{font-size:11px; font-weight:700; color:var(--red);}
.rail-card .meta{font-size:11.5px; color:var(--text3);}
.rail-actions{display:flex; gap:6px; margin-top:4px;}

.btn{border:none; border-radius:var(--radius-pill); font-weight:700; display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:13px;}
.btn-primary{background:var(--primary); color:#fff; padding:11px 20px;}
.btn-primary:hover{background:#d94f00;}
.btn-outline{background:#fff; border:1px solid var(--border-strong); color:var(--text); padding:9px 16px;}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--text2); padding:6px 10px; font-size:12px; border-radius:10px;}
.btn-sm{padding:6px 12px; font-size:11.5px;}
.btn-approve{background:#e7f6ee; color:var(--green); padding:6px 12px; font-size:11.5px; border-radius:var(--radius-pill);}
.btn-reject{background:#fbe9e6; color:var(--red); padding:6px 12px; font-size:11.5px; border-radius:var(--radius-pill);}

.widget-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
.chart-wrap{position:relative; height:200px;}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table thead th{text-align:left; font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em;
  padding:10px 12px; border-bottom:1px solid var(--border);}
.data-table tbody td{padding:12px; border-bottom:1px solid var(--border);}
.data-table tbody tr:hover{background:#fffaf3;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 11px; border-radius:var(--radius-pill);}
.badge.green{background:#e7f6ee; color:var(--green);}
.badge.red{background:#fbe9e6; color:var(--red);}
.badge.amber{background:#fdf1de; color:var(--amber);}
.badge.blue{background:#e8f0fd; color:var(--blue);}
.badge.mint{background:#e3fdf8; color:#0d8a78;}

.stepper{display:flex; align-items:center; gap:0; margin-bottom:18px;}
.step{display:flex; align-items:center; gap:8px; flex:1;}
.step-dot{width:26px;height:26px;border-radius:50%; background:var(--border); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
.step.done .step-dot{background:var(--green);}
.step.now .step-dot{background:var(--primary);}
.step-line{flex:1; height:2px; background:var(--border);}
.step.done + .step .step-line, .step.done .step-line{background:var(--green);}
.step-label{font-size:11.5px; color:var(--text2); white-space:nowrap;}

.filter-row{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
select.filter-select{border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px; font-size:12.5px; color:var(--text); background:#fff;}

.modal-overlay{position:fixed; inset:0; background:rgba(30,20,10,.4); display:flex; align-items:center; justify-content:center; z-index:100;}
.modal{background:#fff; border-radius:20px; width:500px; max-width:92vw; max-height:86vh; overflow-y:auto;
  animation:fadeInScale .22s cubic-bezier(.2,.8,.2,1); box-shadow:0 24px 64px rgba(60,30,0,.2);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border);}
.modal-head h3{margin:0; font-size:17px; font-weight:800;}
.modal-close{border:none; background:var(--glow); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center;}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid var(--border);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:6px;}
.field input, .field select{width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px; outline:none;}
.field input:focus, .field select:focus{border-color:var(--primary);}

.toast{position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff;
  padding:12px 22px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; z-index:200; animation:toastRise .25s ease-out;
  display:flex; align-items:center; gap:8px; box-shadow:0 12px 32px rgba(0,0,0,.25);}

.vehicle-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.vcard{border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; background:#fffdfa; transition:transform .15s ease-out;}
.vcard:hover{transform:scale(1.02);}
.rail-card:hover{transform:scale(1.015); transition:transform .15s ease-out;}
.vcard-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.vcard b{font-size:13.5px;}

.adapter-row{display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:#fffdfa;}
.adapter-icon{width:38px;height:38px;border-radius:12px;background:var(--glow); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Icon({ name, size, className }) {
  return <i data-lucide={name} style={{width:size||16,height:size||16}} className={className||''}></i>;
}
function useLucide(deps){ useEffect(() => { window.lucide && window.lucide.createIcons(); }, deps); }

const APPROVALS = [
  { id:'ap01', name:'김도윤', biz:'서울중앙지원센터', type:'출장', stage:2, deadline:'오늘 18:00', urgent:true },
  { id:'ap02', name:'이수아', biz:'인천서부복지관', type:'근태 정정', stage:1, deadline:'오늘 15:00', urgent:true },
  { id:'ap03', name:'박지훈', biz:'부산해운대케어센터', type:'출장', stage:3, deadline:'내일 10:00', urgent:false },
  { id:'ap04', name:'최서연', biz:'대구달서지원센터', type:'근태 정정', stage:0, deadline:'내일 12:00', urgent:false },
  { id:'ap05', name:'오세훈', biz:'대전유성지원센터', type:'출장', stage:2, deadline:'오늘 17:00', urgent:true },
];
const STAGES = ['기안','검토','승인'];

const VEHICLES = [
  { id:'v1', name:'스타렉스 12인승', plate:'서울12가3456', today:[{s:9,e:11,label:'서울중앙',c:'#fa5d00'},{s:14,e:16,label:'인천서부',c:'#2467d1'}] },
  { id:'v2', name:'카니발 9인승', plate:'서울34나7890', today:[{s:9,e:12,label:'부산출장',c:'#1f9d63'}] },
  { id:'v3', name:'포터 화물', plate:'경기56다1122', today:[{s:8,e:10,label:'의약품배송',c:'#c9820a'},{s:10,e:12,label:'물품배송',c:'#c9820a'}] },
  { id:'v4', name:'승용차 A', plate:'서울78라3344', today:[] },
  { id:'v5', name:'승용차 B', plate:'인천90마5566', today:[{s:13,e:15,label:'대전출장',c:'#1ef6da'}] },
];

const INTEGRATIONS = [
  { id:'i1', name:'계정 동기화', status:'성공', last:'2026.08.31 09:00', retries:0 },
  { id:'i2', name:'결재 완료 알림 전달', status:'성공', last:'2026.08.31 14:20', retries:0 },
  { id:'i3', name:'결재 반려 알림 전달', status:'실패', last:'2026.08.31 13:58', retries:2 },
  { id:'i4', name:'조직 변경 웹훅 수신', status:'성공', last:'2026.08.30 18:04', retries:0 },
  { id:'i5', name:'휴가 신청 이벤트 전달', status:'대기', last:'2026.08.31 15:10', retries:0 },
];

const INVENTORY = [
  { name:'해열진통제', stock:120, min:60, status:'정상' },
  { name:'혈압강하제', stock:34, min:50, status:'부족' },
  { name:'소독용 거즈', stock:8, min:40, status:'위험' },
  { name:'일회용 장갑(박스)', stock:75, min:30, status:'정상' },
  { name:'인슐린 주사제', stock:12, min:25, status:'위험' },
];

function Badge({ tone, children }) { return <span className={`badge ${tone}`}>{children}</span>; }
function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return <div className="toast"><Icon name="check-circle" />{msg}</div>;
}
function Modal({ title, onClose, children, footer }) {
  useLucide([]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><Icon name="x" size={14} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function OpsChart() {
  const ref = useRef(null);
  useEffect(() => {
    const chart = new Chart(ref.current, {
      type: 'bar',
      data: {
        labels: ['서울','인천','부산','대구','광주','대전'],
        datasets: [{ data: [92,88,95,76,84,90], backgroundColor: '#fa5d00', borderRadius: 8, barThickness: 18 }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ y:{ display:false, max:100 }, x:{ grid:{display:false}, ticks:{ font:{ size:10 }, color:'#8e8b87' } } } }
    });
    return () => chart.destroy();
  }, []);
  return <canvas ref={ref}></canvas>;
}

function MainScreen({ toast }) {
  const urgent = APPROVALS.filter(a => a.urgent);
  return (
    <div>
      <div className="section-title"><h2>실시간 관제 타임라인</h2><span className="pill">오늘 · 2026.08.31</span></div>
      <div className="tower-grid">
        <div className="card">
          <div className="card-head"><h3>사업장별 결재 · 배차 타임라인</h3><Badge tone="mint">라이브</Badge></div>
          <svg viewBox="0 0 600 190" width="100%" height="190" style={{overflow:'visible'}}>
            <line x1="60" y1="10" x2="60" y2="180" stroke="#e7dccc" strokeWidth="1" />
            {[0,1,2,3,4,5].map(h => <text key={h} x={60+h*90} y="12" fontSize="9" fill="#8e8b87">{9+h*2}시</text>)}
            {VEHICLES.filter(v=>v.today.length).map((v,ri) => (
              <g key={v.id}>
                <text x="0" y={40+ri*34} fontSize="10" fill="#615f5c">{v.name.split(' ')[0]}</text>
                {v.today.map((b,bi) => (
                  <rect key={bi} x={60+(b.s-9)*45} y={28+ri*34} width={(b.e-b.s)*45} height="18" rx="5" fill={b.c} opacity="0.88" />
                ))}
              </g>
            ))}
            <line x1="60" y1="10" x2="60" y2="180" stroke="#e7dccc" strokeWidth="1" />
            <circle cx="60" cy="10" r="3" fill="#fa5d00" />
          </svg>
          <div style={{display:'flex',gap:14,marginTop:10,fontSize:11,color:'var(--text3)'}}>
            <span><span style={{color:'#fa5d00'}}>●</span> 출장·배차</span>
            <span><span style={{color:'#c9820a'}}>●</span> 물품 배송</span>
            <span><span style={{color:'#1ef6da'}}>●</span> 원거리 출장</span>
          </div>
        </div>
        <div className="card">
          <div className="card-head"><h3>우선 대응 큐</h3><Badge tone="red">{urgent.length}건 임박</Badge></div>
          <div className="rail-list">
            {APPROVALS.slice(0,4).map((a,i) => (
              <div className="rail-card" key={a.id} style={{animationDelay:`${i*0.05}s`}}>
                <div className="rail-card-top"><b>{a.name} · {a.type}</b><span className="due">{a.deadline}</span></div>
                <div className="meta">{a.biz} · {STAGES[a.stage] || '완료'} 단계</div>
                <div className="rail-actions">
                  <button className="btn-approve" onClick={()=>toast(`${a.name}님의 ${a.type} 건을 승인했습니다`)}><Icon name="check" size={12} />승인</button>
                  <button className="btn-reject" onClick={()=>toast(`${a.name}님의 ${a.type} 건을 반려했습니다`)}><Icon name="x" size={12} />반려</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="section-title"><h2>보조 지표</h2></div>
      <div className="widget-grid">
        <div className="card">
          <div className="card-head"><h3>사업장별 결재 처리율</h3></div>
          <div className="chart-wrap"><OpsChart /></div>
        </div>
        <div className="card">
          <div className="card-head"><h3>재고 경고</h3><Badge tone="amber">2건</Badge></div>
          {INVENTORY.filter(v=>v.status!=='정상').map(v => (
            <div key={v.name} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:12.5}}>
              <span>{v.name}</span><Badge tone={v.status==='위험'?'red':'amber'}>{v.status}</Badge>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-head"><h3>그룹웨어 연동 상태</h3></div>
          {INTEGRATIONS.slice(0,3).map(v => (
            <div key={v.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:12.5}}>
              <span>{v.name}</span><Badge tone={v.status==='성공'?'green':v.status==='대기'?'amber':'red'}>{v.status}</Badge>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ApprovalScreen({ toast }) {
  const [items, setItems] = useState(APPROVALS);
  const [detail, setDetail] = useState(null);

  const advance = (id) => {
    setItems(items.map(a => a.id===id ? {...a, stage: Math.min(a.stage+1, 3)} : a));
    toast('다음 결재자에게 알림이 발송되었습니다');
  };
  const reject = (id) => {
    setItems(items.map(a => a.id===id ? {...a, stage:-1} : a));
    toast('반려 사유와 함께 기안자에게 알림이 발송되었습니다');
    setDetail(null);
  };

  return (
    <div>
      <div className="section-title"><h2>근태·출장 결재 워크플로우</h2><span className="pill">전체 {items.length}건</span></div>
      <div className="rail-list" style={{gap:14}}>
        {items.map(a => (
          <div className="card" key={a.id} onClick={()=>setDetail(a)} style={{cursor:'pointer'}}>
            <div className="card-head"><h3>{a.name} · {a.biz} · {a.type}</h3>
              {a.stage===-1 ? <Badge tone="red">반려</Badge> : a.stage>=3 ? <Badge tone="green">승인 완료</Badge> : <Badge tone="amber">{STAGES[a.stage]} 진행 중</Badge>}
            </div>
            <div className="stepper">
              {STAGES.map((s,i) => (
                <React.Fragment key={s}>
                  <div className={`step ${a.stage>i?'done':a.stage===i?'now':''}`}>
                    <div className="step-dot">{a.stage>i ? <Icon name="check" size={12} /> : i+1}</div>
                    <span className="step-label">{s}</span>
                  </div>
                  {i<STAGES.length-1 && <div className="step-line"></div>}
                </React.Fragment>
              ))}
            </div>
            {a.stage>=0 && a.stage<3 && (
              <div className="rail-actions">
                <button className="btn-approve" onClick={(e)=>{e.stopPropagation(); advance(a.id);}}><Icon name="check" size={12} />다음 단계로</button>
                <button className="btn-reject" onClick={(e)=>{e.stopPropagation(); reject(a.id);}}><Icon name="x" size={12} />반려</button>
              </div>
            )}
          </div>
        ))}
      </div>

      {detail && (
        <Modal title="결재 상세" onClose={()=>setDetail(null)} footer={<button className="btn btn-outline" onClick={()=>setDetail(null)}>닫기</button>}>
          <div className="field"><label>기안자</label><div>{detail.name} ({detail.biz})</div></div>
          <div className="field"><label>유형</label><div>{detail.type}</div></div>
          <div className="field"><label>마감</label><div>{detail.deadline}</div></div>
          <div className="field"><label>현재 단계</label><div>{detail.stage===-1?'반려':detail.stage>=3?'승인 완료':STAGES[detail.stage]}</div></div>
        </Modal>
      )}
    </div>
  );
}

function DispatchScreen({ toast }) {
  const [conflict, setConflict] = useState(false);
  const [assignOpen, setAssignOpen] = useState(false);

  const requestAssign = () => {
    setConflict(true);
    toast('선택한 시간대에 배차 가능한 유휴 차량을 자동으로 조회했습니다');
  };

  return (
    <div>
      <div className="section-title"><h2>차량 배차 및 운행 관리</h2>
        <button className="btn btn-primary" onClick={()=>setAssignOpen(true)}><Icon name="calendar-plus" size={14} />배차 신청</button>
      </div>
      <div className="vehicle-grid">
        {VEHICLES.map(v => (
          <div className="vcard" key={v.id}>
            <div className="vcard-top"><b>{v.name}</b><Badge tone={v.today.length?'amber':'green'}>{v.today.length?'배차중':'유휴'}</Badge></div>
            <div style={{fontSize:11.5,color:'var(--text3)',marginBottom:8}}>{v.plate}</div>
            {v.today.length ? v.today.map((b,i)=>(
              <div key={i} style={{fontSize:12,padding:'6px 0',borderTop:i?'1px solid var(--border)':'none'}}>{b.s}:00–{b.e}:00 · {b.label}</div>
            )) : <div style={{fontSize:12,color:'var(--green)'}}>오늘 배차 없음 — 즉시 배정 가능</div>}
          </div>
        ))}
      </div>

      {conflict && (
        <div className="card" style={{marginTop:20, borderColor:'var(--accent)'}}>
          <div className="card-head"><h3>배차 충돌 감지 — 대안 차량 추천</h3><Badge tone="mint">자동 추천</Badge></div>
          <p style={{fontSize:13,color:'var(--text2)',margin:'0 0 10px'}}>선택하신 09:00–11:00 시간대에 스타렉스 12인승은 이미 배정되어 있습니다. 같은 시간대 유휴 차량을 추천합니다.</p>
          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-outline btn-sm" onClick={()=>toast('승용차 A 차량으로 배차가 확정되었습니다')}>승용차 A 배정</button>
            <button className="btn-ghost" onClick={()=>setConflict(false)}>닫기</button>
          </div>
        </div>
      )}

      {assignOpen && (
        <Modal title="배차 신청" onClose={()=>setAssignOpen(false)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setAssignOpen(false)}>취소</button>
            <button className="btn btn-primary" onClick={()=>{setAssignOpen(false); requestAssign();}}>신청</button>
          </>}>
          <div className="field"><label>차량</label><select><option>스타렉스 12인승</option><option>카니발 9인승</option></select></div>
          <div className="field"><label>시간대</label><input placeholder="예: 09:00–11:00" /></div>
          <div className="field"><label>목적</label><input placeholder="예: 서울중앙지원센터 방문" /></div>
        </Modal>
      )}
    </div>
  );
}

function IntegrationScreen({ toast }) {
  const [rows, setRows] = useState(INTEGRATIONS);
  const retry = (id) => {
    setRows(rows.map(r => r.id===id ? {...r, status:'대기', retries:r.retries+1} : r));
    toast('재시도 큐에 등록되었습니다');
  };
  return (
    <div>
      <div className="section-title"><h2>외부 그룹웨어 연동 인터페이스</h2><span className="pill">어댑터 5종</span></div>
      {rows.map(r => (
        <div className="adapter-row" key={r.id}>
          <div className="adapter-icon"><Icon name="webhook" size={18} /></div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13.5}}>{r.name}</div>
            <div style={{fontSize:11.5,color:'var(--text3)'}}>최근 처리 {r.last} · 재시도 {r.retries}회</div>
          </div>
          <Badge tone={r.status==='성공'?'green':r.status==='대기'?'amber':'red'}>{r.status}</Badge>
          {r.status==='실패' && <button className="btn-outline btn-sm" onClick={()=>retry(r.id)}>재시도</button>}
        </div>
      ))}
    </div>
  );
}

function InventoryScreen({ toast }) {
  const [filter, setFilter] = useState('전체');
  const list = INVENTORY.filter(v => filter==='전체' || v.status===filter);
  return (
    <div>
      <div className="section-title"><h2>의약품 재고 현황</h2>
        <button className="btn btn-outline" onClick={()=>toast('재고 조정 요청이 등록되었습니다')}><Icon name="package-plus" size={14} />재고 조정 요청</button>
      </div>
      <div className="filter-row">
        <select className="filter-select" value={filter} onChange={e=>setFilter(e.target.value)}>
          <option>전체</option><option>정상</option><option>부족</option><option>위험</option>
        </select>
      </div>
      <div className="card">
        <table className="data-table">
          <thead><tr><th>품목</th><th>현재 재고</th><th>기준 재고</th><th>상태</th></tr></thead>
          <tbody>
            {list.map(v => (
              <tr key={v.name}>
                <td>{v.name}</td><td>{v.stock}</td><td>{v.min}</td>
                <td><Badge tone={v.status==='정상'?'green':v.status==='부족'?'amber':'red'}>{v.status}</Badge></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const TABS = [
  { key:'main', label:'전사 운영 관제 대시보드' },
  { key:'approval', label:'근태·출장 결재 워크플로우' },
  { key:'dispatch', label:'차량 배차 및 운행 관리' },
  { key:'integration', label:'외부 그룹웨어 연동 인터페이스' },
  { key:'inventory', label:'의약품 재고 현황' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (m) => setToastMsg(m);
  useLucide([screen, toastMsg]);

  const label = TABS.find(t=>t.key===screen)?.label || '';

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <header className="topnav">
        <div className="tn-brand"><div className="tn-mark">늘</div>늘봄 운영 관제</div>
        <nav className="tn-tabs">
          {TABS.map(t => (
            <button key={t.key} className={`tn-tab ${screen===t.key?'active':''}`} onClick={()=>setScreen(t.key)}>{t.label}</button>
          ))}
        </nav>
        <div className="tn-actions"><div className="tn-avatar">전산</div></div>
      </header>

      <div className="main-area">
        <div className="hero">
          <div className="hero-inner">
            <h1>{screen==='main' ? '13개 사업장 운영 현황을 한 화면에서' : label}</h1>
            <p>{screen==='main' ? '결재·배차·재고·그룹웨어 연동 상태를 실시간으로 통합 관제합니다.' : '전사 운영 관제 콘솔에서 상세 업무를 처리합니다.'}</p>
            {screen==='main' && (
              <div className="status-strip">
                <div className="status-item"><span className="live-dot"></span><div><b>{APPROVALS.length}</b> 결재 대기</div></div>
                <div className="status-item"><Icon name="truck" size={16} /><div><b>{VEHICLES.filter(v=>v.today.length).length}</b> 배차 진행중</div></div>
                <div className="status-item"><Icon name="triangle-alert" size={16} /><div><b>{INVENTORY.filter(v=>v.status!=='정상').length}</b> 재고 경고</div></div>
                <div className="status-item"><Icon name="plug-zap" size={16} /><div><b>{INTEGRATIONS.filter(v=>v.status==='실패').length}</b> 연동 실패</div></div>
              </div>
            )}
          </div>
        </div>
        <div className="content">
          {screen==='main' && <MainScreen toast={toast} />}
          {screen==='approval' && <ApprovalScreen toast={toast} />}
          {screen==='dispatch' && <DispatchScreen toast={toast} />}
          {screen==='integration' && <IntegrationScreen toast={toast} />}
          {screen==='inventory' && <InventoryScreen toast={toast} />}
        </div>
      </div>
      {toastMsg && <Toast msg={toastMsg} onDone={()=>setToastMsg(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
