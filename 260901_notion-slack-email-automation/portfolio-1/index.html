<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노션 이벤트 자동화 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --primary:#202020; --secondary:#e8e8e8; --accent:#0091ff;
  --bg:#ffffff; --surface:#f8f9fa; --band:#e9ebf0;
  --text-1:#202020; --text-2:#646464; --text-3:#8f8f8f;
  --border:#e8e8e8; --border-soft:#eeeeee;
  --green:#00c07a; --green-bg:#e3faf1;
  --amber:#c98a12; --amber-bg:#fff3dd;
  --red:#e5484d; --red-bg:#fdecec;
  --violet:#6647f0;
  --radius-card:12px; --radius-lg:20px; --radius-pill:9999px; --radius-input:9px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;
  background:var(--bg); color:var(--text-1);
  -webkit-font-smoothing:antialiased;
  width:100%;
}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#d4d4d4; border-radius:4px;}

/* ---------- keyframes ---------- */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
@keyframes riseStagger{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,192,122,.45);}70%{box-shadow:0 0 0 8px rgba(0,192,122,0);}100%{box-shadow:0 0 0 0 rgba(0,192,122,0);}}
@keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);}to{opacity:1; transform:translate(-50%,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes countUpFade{from{opacity:.3;}to{opacity:1;}}

/* ---------- layout shell ---------- */
.shell{display:flex; width:100%; min-height:100vh; background:var(--bg);}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:#fbfbfc; border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:40;
}
.sidebar-brand{
  height:64px; display:flex; align-items:center; gap:10px; padding:0 18px;
  border-bottom:1px solid var(--border-soft);
}
.brand-mark{
  width:28px; height:28px; border-radius:8px; background:var(--primary);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; flex-shrink:0;
}
.brand-name{font-weight:800; font-size:15px; letter-spacing:-0.02em;}
.sidebar-cmdk-hint{
  margin:14px 16px 6px; padding:9px 12px; border:1px solid var(--border);
  border-radius:var(--radius-input); display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; color:var(--text-2); background:#fff;
}
.kbd{
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--text-2);
  background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:1px 6px;
}
.sidebar-nav{padding:6px 10px; display:flex; flex-direction:column; gap:2px; margin-top:4px;}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  color:var(--text-2); font-size:13.5px; font-weight:600; text-decoration:none;
  border:none; background:transparent; width:100%; text-align:left; position:relative;
  transition:background .12s ease, color .12s ease;
}
.sidebar-link i{font-size:17px;}
.sidebar-link:hover{background:var(--surface); color:var(--text-1);}
.sidebar-link.active{background:#eef6ff; color:var(--accent);}
.sidebar-link.active::before{
  content:''; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:3px; background:var(--accent);
}
.sidebar-section{margin-top:16px; padding:0 10px;}
.sidebar-section-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-3);
  font-weight:700; padding:6px 10px;
}
.sidebar-footer{
  margin-top:auto; padding:14px 16px; border-top:1px solid var(--border-soft);
  display:flex; align-items:center; gap:10px;
}
.avatar-sm{
  width:28px; height:28px; border-radius:var(--radius-pill); background:linear-gradient(135deg,#0091ff,#6647f0);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; flex-shrink:0;
}
.sidebar-footer-text{font-size:12.5px; line-height:1.3;}
.sidebar-footer-text b{display:block; font-size:13px;}
.sidebar-footer-text span{color:var(--text-3); font-size:11.5px;}

.main-wrap{
  margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px);
  min-height:100vh; display:flex; flex-direction:column; background:var(--bg);
}
.topbar{
  height:56px; border-bottom:1px solid var(--border); display:flex; align-items:center;
  justify-content:space-between; padding:0 24px; width:100%; background:#fff; position:sticky; top:0; z-index:20;
}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-3); font-weight:500;}
.breadcrumb b{color:var(--text-1); font-weight:700;}
.breadcrumb .divider{color:#d4d4d4;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.btn-cmdk{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:var(--radius-pill);
  border:1px solid var(--border); background:#fff; font-size:12.5px; color:var(--text-2); font-weight:600;
}
.btn-cmdk:hover{border-color:#c9c9c9;}
.btn-icon{
  width:34px; height:34px; border-radius:var(--radius-pill); border:1px solid var(--border); background:#fff;
  display:flex; align-items:center; justify-content:center; color:var(--text-2); position:relative;
}
.btn-icon:hover{background:var(--surface);}
.notif-dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--red);}
.btn-primary{
  padding:9px 16px; border-radius:var(--radius-pill); background:var(--primary); color:#fff; border:none;
  font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;
}
.btn-primary:hover{background:#000;}
.btn-ghost{
  padding:8px 14px; border-radius:var(--radius-pill); background:transparent; color:var(--text-1); border:1px solid var(--border);
  font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;
}
.btn-ghost:hover{border-color:#0091ff; color:#0091ff;}
.btn-ghost.danger:hover{border-color:var(--red); color:var(--red);}
.btn-blue{
  padding:8px 14px; border-radius:var(--radius-pill); background:var(--accent); color:#fff; border:none;
  font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;
}

.content{padding:24px 28px 48px; width:100%; animation:fadeIn .35s ease;}
.hero-title{font-size:40px; font-weight:800; letter-spacing:-0.03em; line-height:1.15; color:var(--text-1); margin:0 0 6px;}
.hero-sub{font-size:13.5px; color:var(--text-2); margin:0 0 20px; max-width:640px; line-height:1.6;}

/* ---------- status strip ---------- */
.status-strip{
  display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:var(--radius-lg);
  background:linear-gradient(180deg,#ffffff, #fbfcfe); padding:4px; margin-bottom:20px; overflow:hidden;
}
.status-item{
  flex:1; padding:14px 20px; display:flex; align-items:center; gap:12px; border-right:1px solid var(--border-soft);
}
.status-item:last-child{border-right:none;}
.status-icon{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.status-num{font-size:22px; font-weight:800; letter-spacing:-0.02em; line-height:1.1;}
.status-label{font-size:12px; color:var(--text-3); font-weight:600; margin-top:2px;}
.live-dot{width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulseDot 2s infinite;}

/* ---------- grid ---------- */
.main-grid{display:flex; gap:20px; align-items:flex-start; width:100%;}
.panel{
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;
}
.panel-head{
  padding:16px 20px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between;
}
.panel-title{font-size:15px; font-weight:800; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px;}
.panel-sub{font-size:12px; color:var(--text-3); font-weight:500; margin-top:2px;}
.tabs{display:flex; gap:4px; padding:10px 14px 0;}
.tab{
  padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--text-2); border-radius:8px 8px 0 0;
  border:none; background:transparent; border-bottom:2px solid transparent;
}
.tab.active{color:var(--accent); border-bottom-color:var(--accent); background:#f4f9ff;}

.event-row{
  display:flex; align-items:center; gap:12px; padding:13px 20px; border-bottom:1px solid var(--border-soft);
  cursor:pointer; transition:background .12s ease; animation:riseStagger .35s ease both;
}
.event-row:hover{background:var(--surface);}
.event-row:last-child{border-bottom:none;}
.event-type-badge{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.event-body{flex:1; min-width:0;}
.event-title{font-size:13.5px; font-weight:700; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.event-meta{font-size:11.5px; color:var(--text-3); margin-top:2px; display:flex; gap:6px; align-items:center;}
.pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--radius-pill);
  font-size:11px; font-weight:700; white-space:nowrap;
}
.pill-green{background:var(--green-bg); color:#00875a;}
.pill-amber{background:var(--amber-bg); color:#9a6700;}
.pill-red{background:var(--red-bg); color:#c9312d;}
.pill-blue{background:#e8f3ff; color:#0072d6;}
.pill-gray{background:var(--surface); color:var(--text-2); border:1px solid var(--border);}
.chev{color:var(--text-3); font-size:16px; flex-shrink:0;}

.rail-item{padding:14px 18px; border-bottom:1px solid var(--border-soft); animation:riseStagger .4s ease both;}
.rail-item:last-child{border-bottom:none;}
.rail-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.rail-title{font-size:13px; font-weight:700;}
.rail-reason{font-size:11.5px; color:var(--text-3); margin-bottom:8px;}
.rail-actions{display:flex; gap:6px;}
.btn-mini{
  padding:5px 10px; border-radius:7px; font-size:11px; font-weight:700; border:1px solid var(--border); background:#fff; color:var(--text-1);
  display:flex; align-items:center; gap:4px;
}
.btn-mini:hover{border-color:var(--accent); color:var(--accent);}
.btn-mini.spinning i{animation:spin 1s linear infinite; display:inline-block;}

.secondary-card{
  margin-top:20px; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;
}
.routing-row{
  display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--border-soft); cursor:pointer;
}
.routing-row:hover{background:var(--surface);}
.routing-row:last-child{border-bottom:none;}
.channel-chip{
  display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--radius-pill); background:var(--surface);
  font-size:12px; font-weight:700; color:var(--text-1); border:1px solid var(--border);
}
.mini-bar-track{flex:1; height:6px; border-radius:4px; background:var(--border-soft); overflow:hidden;}
.mini-bar-fill{height:100%; border-radius:4px; background:var(--green);}

/* ---------- generic table screens ---------- */
.toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.search-box{
  display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:var(--radius-input);
  padding:8px 12px; background:#fff; min-width:240px; font-size:13px; color:var(--text-2);
}
.search-box input{border:none; outline:none; font-size:13px; width:100%; font-family:inherit;}
.filter-chip{
  padding:7px 13px; border-radius:var(--radius-pill); border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600;
}
.filter-chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.table{width:100%; border-collapse:collapse;}
.table th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:700;
  padding:10px 16px; border-bottom:1px solid var(--border);
}
.table td{padding:13px 16px; border-bottom:1px solid var(--border-soft); font-size:13px;}
.table tr.clickable{cursor:pointer;}
.table tr.clickable:hover td{background:var(--surface);}

.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.stat-card{
  border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; background:#fff;
}
.stat-num{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
.stat-label{font-size:12px; color:var(--text-3); font-weight:600; margin-top:4px;}

.toggle{
  width:38px; height:22px; border-radius:var(--radius-pill); background:var(--border); position:relative; border:none; flex-shrink:0;
  transition:background .15s ease;
}
.toggle.on{background:var(--accent);}
.toggle-knob{
  position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff;
  transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.toggle.on .toggle-knob{transform:translateX(16px);}

.builder-row{
  display:flex; align-items:center; gap:10px; padding:14px 18px; border:1px solid var(--border); border-radius:var(--radius-card);
  margin-bottom:10px; background:#fff;
}
.step-num{
  width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.select-like{
  border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; background:var(--surface);
}

.tmpl-layout{display:flex; gap:20px; width:100%;}
.tmpl-list{width:280px; flex-shrink:0; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
.tmpl-item{
  padding:14px 16px; border-bottom:1px solid var(--border-soft); cursor:pointer;
}
.tmpl-item:hover{background:var(--surface);}
.tmpl-item.active{background:#eef6ff; border-left:3px solid var(--accent); padding-left:13px;}
.tmpl-item-name{font-size:13.5px; font-weight:700;}
.tmpl-item-meta{font-size:11.5px; color:var(--text-3); margin-top:3px;}
.tmpl-editor{flex:1; min-width:0; border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px;}
.field-label{font-size:12px; font-weight:700; color:var(--text-2); margin:14px 0 6px;}
.field-input{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-input); padding:10px 12px; font-size:13px;
  font-family:inherit; color:var(--text-1);
}
textarea.field-input{resize:vertical; min-height:110px; line-height:1.6;}
.var-badge{
  display:inline-flex; padding:3px 9px; border-radius:6px; background:#f2edff; color:var(--violet); font-size:11.5px; font-weight:700; margin:0 3px 3px 0;
}
.preview-box{
  border:1px dashed var(--border); border-radius:10px; padding:16px; background:var(--surface); font-size:13px; line-height:1.7; margin-top:8px;
}

/* ---------- cmd-k overlay ---------- */
.cmdk-overlay{
  position:fixed; inset:0; background:rgba(20,20,22,.45); z-index:200; display:flex; align-items:flex-start; justify-content:center;
  padding-top:12vh; animation:fadeIn .15s ease;
}
.cmdk-modal{
  width:560px; max-width:92vw; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.28);
  overflow:hidden; animation:fadeInUp .18s ease;
}
.cmdk-input{
  width:100%; border:none; outline:none; padding:18px 20px; font-size:15px; font-family:inherit; border-bottom:1px solid var(--border-soft);
}
.cmdk-results{max-height:360px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); font-weight:700; padding:8px 12px 4px;}
.cmdk-item{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:600;
  cursor:pointer;
}
.cmdk-item:hover{background:var(--surface);}
.cmdk-item-left{display:flex; align-items:center; gap:10px;}

/* ---------- modal / drawer ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,22,.4); z-index:300; display:flex; align-items:center; justify-content:center;
  animation:fadeIn .15s ease; padding:20px;
}
.modal-box{
  width:520px; max-width:100%; max-height:86vh; overflow-y:auto; background:#fff; border-radius:18px; padding:26px;
  box-shadow:0 30px 70px rgba(0,0,0,.25); animation:fadeInUp .2s ease;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-title{font-size:18px; font-weight:800; letter-spacing:-0.01em;}
.close-x{width:30px; height:30px; border-radius:50%; border:none; background:var(--surface); display:flex; align-items:center; justify-content:center;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0;}
.detail-field{border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px;}
.detail-field .k{font-size:11px; color:var(--text-3); font-weight:700; margin-bottom:3px;}
.detail-field .v{font-size:13.5px; font-weight:700;}
.modal-footer{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

/* ---------- toast ---------- */
.toast-wrap{position:fixed; bottom:26px; left:50%; z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--primary); color:#fff; padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
  display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toastIn .25s ease;
  transform:translate(-50%,0); position:relative; left:0;
}

/* skeleton loading */
.skeleton{
  background:linear-gradient(90deg, var(--border-soft) 25%, #f3f4f6 37%, var(--border-soft) 63%);
  background-size:400px 100%; animation:shimmer 1.4s infinite; border-radius:8px;
}

@media (max-width:1080px){
  .main-grid{flex-direction:column;}
}
@media (max-width:900px){
  .status-strip{flex-wrap:wrap;}
  .status-item{flex:1 1 45%; border-right:none; border-bottom:1px solid var(--border-soft);}
}
@media (max-width:600px){
  .sidebar{width:220px;}
  .main-wrap{margin-left:220px; width:calc(100% - 220px);}
  .topbar{padding:0 12px;}
  .btn-cmdk{display:none;}
  .topbar-actions{gap:4px;}
  .breadcrumb{font-size:11.5px; gap:4px;}
}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="app-root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

/* ---------------- mock data ---------------- */
const EVENTS = [
  {id:'ev1', type:'status', icon:'ph-arrows-clockwise', label:'상태 변경', title:'3분기 캠페인 기획안 — 검토중 → 승인 완료', page:'콘텐츠 기획 DB', channel:'#콘텐츠기획', time:'2분 전', status:'발송완료', retry:0},
  {id:'ev2', type:'deadline', icon:'ph-hourglass', label:'마감 D-3', title:'일본 계정 09월 콘텐츠 캘린더 확정', page:'채널 운영 DB', channel:'#일본계정운영', time:'6분 전', status:'발송완료', retry:0},

function typeStyle(type){
  if(type==='status') return {bg:'#e8f3ff', color:'#0072d6'};
  if(type==='deadline') return {bg:'#fff3dd', color:'#9a6700'};
  return {bg:'#e3faf1', color:'#00875a'};
}
function statusPill(status){
  if(status==='발송완료') return <span className="pill pill-green"><i className="ph-fill ph-check-circle"></i>발송완료</span>;
  if(status==='재시도 대기') return <span className="pill pill-amber"><i className="ph ph-clock-clockwise"></i>재시도 대기</span>;
  return <span className="pill pill-red"><i className="ph ph-warning-circle"></i>실패</span>;
}

/* ---------------- shared bits ---------------- */
function Toast({toasts}){
  return (
    <div className="toast-wrap">

        <div className="toast" key={t.id}><i className="ph-fill ph-check-circle"></i>{t.text}</div>

  );
}

function CmdK({open, onClose, onNavigate}){
  const inputRef = useRef(null);
  useEffect(()=>{ if(open && inputRef.current) inputRef.current.focus(); },[open]);
  if(!open) return null;
  const actions = [
    {label:'이벤트 감지 콘솔로 이동', screen:'main', icon:'ph-broadcast'},
    {label:'슬랙 채널 라우팅 알림 열기', screen:'slack-routing', icon:'ph-slack-logo'},
    {label:'외부 이메일 자동 발송 자동화 열기', screen:'email-automation', icon:'ph-envelope-simple'},
    {label:'이메일 템플릿 관리 열기', screen:'template-manager', icon:'ph-note-pencil'},
    {label:'이벤트 로그 & 재시도 이력 열기', screen:'event-log', icon:'ph-clock-counter-clockwise'},
  ];
  return (
    <div className="cmdk-overlay" data-cmdk onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()}>
        <input ref={inputRef} className="cmdk-input" placeholder="명령 또는 화면 검색…" />
        <div className="cmdk-results">
          <div className="cmdk-group-title">이동</div>
          {actions.map(a=>(
            <div className="cmdk-item" key={a.screen} onClick={()=>{onNavigate(a.screen); onClose();}}>
              <div className="cmdk-item-left"><i className={"ph "+a.icon}></i>{a.label}</div>
              <span className="kbd">⏎</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">{title}</div>
          <button className="close-x" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        {children}
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

function EmailAutomationScreen({pushToast}){
  const [stages, setStages] = useState(EMAIL_STAGES);
  const [testing, setTesting] = useState(false);
  const toggleStage = (id)=> setStages(s=>s.map(x=>x.id===id?{...x, active:!x.active}:x));
  const runTest = ()=>{
    setTesting(true);
    setTimeout(()=>{ setTesting(false); pushToast('테스트 이메일이 발송되었습니다'); }, 1400);
  };
  return (
    <div className="content">
      <div className="toolbar">
        <div>
          <div style={{fontSize:20, fontWeight:800, letterSpacing:'-0.01em'}}>외부 이메일 자동 발송 자동화</div>
          <div style={{fontSize:13, color:'var(--text-2)', marginTop:4}}>섭외·계약·정산 단계별 트리거 조건과 템플릿 변수 치환 파이프라인을 관리합니다.</div>
        </div>
        <button className="btn-primary" onClick={runTest}><i className={testing?"ph ph-spinner":"ph ph-flask"}></i>{testing?'테스트 발송 중…':'테스트 발송'}</button>
      </div>

      <div className="card-grid" style={{marginBottom:20}}>
        {stages.map(s=>(
          <div className="stat-card" key={s.id}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div className="stat-label" style={{fontWeight:800, color:'var(--text-1)', fontSize:13}}>{s.label} 단계</div>
              <button className={"toggle"+(s.active?' on':'')} onClick={()=>{toggleStage(s.id); pushToast(s.label+' 단계 자동 발송 상태가 변경되었습니다');}}>
                <span className="toggle-knob"></span>
              </button>
            </div>
            <div className="stat-num" style={{marginTop:10}}>{s.sentToday}건</div>
            <div className="stat-label">금일 발송</div>
          </div>
        ))}
      </div>

      <div className="panel" style={{marginBottom:20}}>
        <div className="panel-head"><div className="panel-title"><i className="ph ph-flow-arrow"></i>트리거 조건 빌더</div></div>
        <div style={{padding:'16px 20px'}}>
          {stages.map((s,i)=>(
            <div className="builder-row" key={s.id}>
              <div className="step-num">{i+1}</div>
              <span className="select-like">{s.label}</span>
              <i className="ph ph-arrow-right" style={{color:'var(--text-3)'}}></i>
              <span className="select-like">{s.condition}</span>
              <i className="ph ph-arrow-right" style={{color:'var(--text-3)'}}></i>
              <span className="pill pill-green">템플릿 자동 치환 발송 (5분 이내)</span>
            </div>
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><div className="panel-title"><i className="ph ph-clipboard-text"></i>발송 로그</div></div>
        <table className="table">
          <thead><tr><th>수신자</th><th>제목</th><th>단계</th><th>발송 시각</th><th>상태</th></tr></thead>
          <tbody>
            {EMAIL_LOGS.map((l,i)=>(
              <tr key={i}><td>{l.to}</td><td>{l.subject}</td><td><span className="pill pill-gray">{l.stage}</span></td><td>{l.time}</td>
                <td>{l.status==='발송완료'? <span className="pill pill-green">발송완료</span> : <span className="pill pill-red">{l.status}</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Template Manager screen ---------------- */
function TemplateManagerScreen({pushToast}){
  const [templates, setTemplates] = useState(TEMPLATES);
  const [activeId, setActiveId] = useState(TEMPLATES[0].id);
  const [draft, setDraft] = useState(TEMPLATES[0]);
  const [showAdd, setShowAdd] = useState(false);
  const [showDelete, setShowDelete] = useState(null);
  const [preview, setPreview] = useState(false);

  const select = (t)=>{ setActiveId(t.id); setDraft(t); setPreview(false); };
  const save = ()=>{
    setTemplates(ts=>ts.map(t=>t.id===draft.id?{...draft, version:'v'+(parseInt(draft.version.slice(1))+1), updated:'방금 전'}:t));
    pushToast('템플릿이 저장되고 새 버전이 기록되었습니다');
  };
  const remove = ()=>{
    setTemplates(ts=>ts.filter(t=>t.id!==showDelete.id));
    if(activeId===showDelete.id && templates.length>1){ const rest=templates.filter(t=>t.id!==showDelete.id); select(rest[0]); }
    setShowDelete(null); pushToast('템플릿이 삭제되었습니다');
  };
  const renderPreview = (text)=> text.replace('{{작가명}}','이수아').replace('{{일정}}','2026-09-20').replace('{{금액}}','480,000원');

  return (
    <div className="content">
      <div className="toolbar">
        <div>
          <div style={{fontSize:20, fontWeight:800, letterSpacing:'-0.01em'}}>이메일 템플릿 관리</div>
          <div style={{fontSize:13, color:'var(--text-2)', marginTop:4}}>템플릿 CRUD와 트리거 조건, 버전 이력을 관리합니다.</div>
        </div>
        <button className="btn-primary" onClick={()=>setShowAdd(true)}><i className="ph ph-plus"></i>새 템플릿</button>
      </div>

      <div className="tmpl-layout">
        <div className="tmpl-list">
          {templates.map(t=>(
            <div key={t.id} className={"tmpl-item"+(activeId===t.id?' active':'')} onClick={()=>select(t)}>
              <div className="tmpl-item-name">{t.name}</div>
              <div className="tmpl-item-meta">{t.version} · {t.updated}</div>
            </div>
          ))}
        </div>
        <div className="tmpl-editor">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style={{fontSize:16, fontWeight:800}}>{draft.name}</div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn-ghost" onClick={()=>setPreview(p=>!p)}><i className="ph ph-eye"></i>{preview?'편집으로':'미리보기'}</button>
              <button className="btn-ghost danger" onClick={()=>setShowDelete(draft)}><i className="ph ph-trash"></i>삭제</button>
              <button className="btn-primary" onClick={save}><i className="ph ph-floppy-disk"></i>저장</button>
            </div>
          </div>

          {!preview ? (
            <React.Fragment>
              <div className="field-label">제목</div>
              <input className="field-input" value={draft.subject} onChange={e=>setDraft({...draft, subject:e.target.value})} />
              <div className="field-label">본문</div>
              <textarea className="field-input" value={draft.body} onChange={e=>setDraft({...draft, body:e.target.value})} />
              <div className="field-label">사용 가능 변수</div>
              <span className="var-badge">{'{{작가명}}'}</span><span className="var-badge">{'{{일정}}'}</span><span className="var-badge">{'{{금액}}'}</span>
              <div className="field-label">트리거 조건</div>
              <div className="builder-row" style={{margin:0}}>
                <span className="select-like">노션 속성</span><i className="ph ph-equals"></i><span className="select-like">상태값 매핑</span>
              </div>
            </React.Fragment>
          ) : (
            <div className="preview-box">
              <b style={{display:'block', marginBottom:8}}>{renderPreview(draft.subject)}</b>
              {renderPreview(draft.body).split('\n').map((line,i)=><div key={i}>{line}</div>)}
            </div>
          )}
        </div>
      </div>

      {showAdd && (
        <Modal title="새 템플릿 등록" onClose={()=>setShowAdd(false)} footer={<>
          <button className="btn-ghost" onClick={()=>setShowAdd(false)}>취소</button>
          <button className="btn-primary" onClick={()=>{
            const nt = {id:'t'+Date.now(), name:'새 템플릿', subject:'제목을 입력하세요', body:'본문을 입력하세요', version:'v1', updated:'방금 전'};
            setTemplates(ts=>[nt, ...ts]); select(nt); setShowAdd(false); pushToast('새 템플릿이 등록되었습니다');
          }}>등록</button>
        </>}>
          <div className="field-label">템플릿 이름</div>
          <input className="field-input" placeholder="예: 회신 지연 리마인드" />
          <div className="field-label">발송 트리거 조건</div>
          <input className="field-input" placeholder="예: 노션 상태 = 회신 대기 3일 경과" />
        </Modal>
      )}
      {showDelete && (
        <Modal title="템플릿을 삭제하시겠습니까?" onClose={()=>setShowDelete(null)} footer={<>
          <button className="btn-ghost" onClick={()=>setShowDelete(null)}>취소</button>
          <button className="btn-primary" style={{background:'var(--red)'}} onClick={remove}>삭제</button>
        </>}>
          <div style={{fontSize:13.5, color:'var(--text-2)'}}>"{showDelete.name}" 템플릿과 연결된 트리거가 함께 비활성화됩니다.</div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Event Log full screen ---------------- */
function EventLogScreen({openEventDetail}){
  const [filter, setFilter] = useState('전체');
  const list = EVENTS.filter(e=> filter==='전체' || e.status===filter);
  return (
    <div className="content">
      <div className="toolbar">
        <div>
          <div style={{fontSize:20, fontWeight:800, letterSpacing:'-0.01em'}}>이벤트 로그 & 재시도 이력</div>
          <div style={{fontSize:13, color:'var(--text-2)', marginTop:4}}>전체 이벤트와 재시도 처리 기록을 조회합니다.</div>
        </div>
        <div className="search-box"><i className="ph ph-magnifying-glass"></i><input placeholder="이벤트 제목으로 검색" /></div>
      </div>
      <div style={{display:'flex', gap:8, marginBottom:16}}>
        {['전체','발송완료','재시도 대기','실패'].map(f=>(
          <button key={f} className={"filter-chip"+(filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="panel">
        <table className="table">
          <thead><tr><th>유형</th><th>이벤트</th><th>노션 DB</th><th>슬랙 채널</th><th>발생 시각</th><th>재시도</th><th>상태</th></tr></thead>
          <tbody>
            {list.map(e=>(
              <tr key={e.id} className="clickable" onClick={()=>openEventDetail(e)}>
                <td><span className="pill pill-gray">{e.label}</span></td>
                <td style={{maxWidth:280}}>{e.title}</td>
                <td>{e.page}</td>
                <td>{e.channel}</td>
                <td>{e.time}</td>
                <td>{e.retry}/3</td>
                <td>{statusPill(e.status)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [detail, setDetail] = useState(null);
  const [retrying, setRetrying] = useState(null);

  const pushToast = (text)=>{
    const id = Date.now();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };
  const retryOne = (id, title)=>{
    setRetrying(id);
    setTimeout(()=>{ setRetrying(null); pushToast('"'+(title.length>18?title.slice(0,18)+'…':title)+'" 재발송에 성공했습니다'); }, 1300);
  };

  useEffect(()=>{
    const onKey = (e)=>{
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
      if(e.key==='Escape'){ setCmdkOpen(false); setDetail(null); }
    };
    window.addEventListener('keydown', onKey);
    return ()=> window.removeEventListener('keydown', onKey);
  },[]);

  return (
    <div className="shell">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="brand-mark"><i className="ph-fill ph-lightning"></i></div>
          <div className="brand-name">AutoFlow Console</div>
        </div>
        <button className="sidebar-cmdk-hint" onClick={()=>setCmdkOpen(true)} data-cmdk-trigger>
          <span>빠른 이동 검색</span><span className="kbd">⌘ K</span>
        </button>
        <nav className="sidebar-nav">
          {NAV.map(n=>(
            <button key={n.key} className={"sidebar-link"+(screen===n.key?' active':'')} onClick={()=>setScreen(n.key)}>
              <i className={"ph "+n.icon}></i>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-section">
          <div className="sidebar-section-title">운영 기록</div>
          <button className="sidebar-link" onClick={()=>setScreen('event-log')} style={{width:'100%'}}>
            <i className="ph ph-clock-counter-clockwise"></i>이벤트 로그 & 재시도 이력
          </button>
        </div>
        <div className="sidebar-footer">
          <div className="avatar-sm">김</div>
          <div className="sidebar-footer-text"><b>김도현</b><span>콘텐츠 기획 담당자</span></div>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="topbar">
          <div className="breadcrumb"><a style={{color:'inherit', textDecoration:'none'}}>AutoFlow</a><span className="divider">/</span><b>{BREADCRUMB_LABEL[screen]}</b></div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><i className="ph ph-magnifying-glass"></i>검색<span className="kbd">⌘K</span></button>
            <button className="btn-icon" onClick={()=>pushToast('재시도 대기 2건이 있습니다')}><i className="ph ph-bell"></i><span className="notif-dot"></span></button>
          </div>
        </header>

        {screen==='main' && <MainScreen openEventDetail={setDetail} pushToast={pushToast} retrying={retrying} retryOne={retryOne} />}
        {screen==='slack-routing' && <SlackRoutingScreen pushToast={pushToast} />}
        {screen==='email-automation' && <EmailAutomationScreen pushToast={pushToast} />}
        {screen==='template-manager' && <TemplateManagerScreen pushToast={pushToast} />}
        {screen==='event-log' && <EventLogScreen openEventDetail={setDetail} />}
      </div>

      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNavigate={setScreen} />

      {detail && (
        <Modal title="이벤트 상세" onClose={()=>setDetail(null)} footer={<>
          <button className="btn-ghost" onClick={()=>setDetail(null)}>닫기</button>
          <button className="btn-primary" onClick={()=>{setDetail(null); pushToast('노션 페이지로 이동합니다');}}><i className="ph ph-arrow-square-out"></i>노션에서 열기</button>
        </>}>
          <div style={{fontSize:15, fontWeight:700}}>{detail.title}</div>
          <div className="detail-grid">
            <div className="detail-field"><div className="k">이벤트 유형</div><div className="v">{detail.label}</div></div>
            <div className="detail-field"><div className="k">노션 DB</div><div className="v">{detail.page}</div></div>
            <div className="detail-field"><div className="k">슬랙 채널</div><div className="v">{detail.channel}</div></div>
            <div className="detail-field"><div className="k">발생 시각</div><div className="v">{detail.time}</div></div>
            <div className="detail-field"><div className="k">재시도 횟수</div><div className="v">{detail.retry} / 3</div></div>
            <div className="detail-field"><div className="k">처리 상태</div><div className="v">{detail.status}</div></div>
          </div>
          <div className="field-label">중복 방지 해시</div>
          <div className="preview-box" style={{fontFamily:'ui-monospace, monospace', fontSize:12}}>sha256:8f2a...c91e (페이지 last_edited_time 기준 대조)</div>
        </Modal>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
