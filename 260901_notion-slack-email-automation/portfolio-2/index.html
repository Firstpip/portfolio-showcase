<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>협업 자동화 통합 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --void:#040506; --ink:#07080a; --recessed:#111214; --border:#363739; --border-soft:#232426;
  --text-1:#ffffff; --text-2:#9c9c9d; --text-3:#6a6b6c;
  --mist:#e6e6e6; --iron:#454647;
  --coral:#ff6363; --coral-tint:#452324;
  --green:#59d499; --blue:#56c2ff;
  --radius-tile:20px; --radius-pill:9999px; --radius-btn:8px; --radius-input:8px;
}
*{box-sizing:border-box;}
html,body{width:100%; margin:0; padding:0;}
body{
  font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;
  background:var(--void); color:var(--text-1); width:100%;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#3a3b3d; border-radius:4px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:translateY(0);}}
@keyframes tileIn{from{opacity:0; transform:translateY(16px) scale(.98);}to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,99,99,.5);}70%{box-shadow:0 0 0 10px rgba(255,99,99,0);}100%{box-shadow:0 0 0 0 rgba(255,99,99,0);}}
@keyframes drawLine{from{stroke-dashoffset:400;}to{stroke-dashoffset:0;}}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,14px);}to{opacity:1; transform:translate(-50%,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}

.shell{width:100%; min-height:100vh; display:flex; flex-direction:column; background:var(--void); position:relative; overflow-x:hidden;}
.bg-atmos{
  position:fixed; top:-220px; left:0; width:100%; height:640px; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 60% 70% at 50% 20%, rgba(255,99,99,.16) 0%, rgba(6,18,37,0) 62%),
             radial-gradient(ellipse 40% 50% at 78% 8%, rgba(86,194,255,.12) 0%, rgba(6,18,37,0) 60%);
  filter:blur(30px);
}
.hero-atmos-tile{
  position:absolute; inset:0; border-radius:var(--radius-tile); overflow:hidden; z-index:0; pointer-events:none;
}
.hero-atmos-tile svg{position:absolute; top:-10%; left:-10%; width:120%; height:130%; opacity:.9;}
.page-title.display-hero{font-size:44px; font-weight:500; letter-spacing:0.2px; line-height:1.12;}

.navbar{
  position:sticky; top:0; z-index:50; width:100%; display:flex; justify-content:center; padding:16px 20px 0;
}
.navbar-inner{
  width:100%; max-width:1240px; display:flex; align-items:center; justify-content:space-between;
  padding:8px 10px 8px 16px; border-radius:var(--radius-pill); border:1px solid var(--border);
  background:rgba(7,8,10,.72); backdrop-filter:blur(20px);
}
.nav-brand{display:flex; align-items:center; gap:9px;}
.brand-diamond{
  width:22px; height:22px; background:var(--coral); transform:rotate(45deg); border-radius:5px; flex-shrink:0;
  animation:pulseRing 3s infinite;
}
.brand-word{font-weight:600; font-size:14px; letter-spacing:-0.01em;}
.nav-links{display:flex; align-items:center; gap:4px;}
.nav-link{
  padding:8px 14px; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--text-2);
  font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; transition:color .12s ease, background .12s ease;
}
.nav-link:hover{color:var(--text-1);}
.nav-link.active{background:var(--recessed); color:var(--text-1);}
.nav-right{display:flex; align-items:center; gap:8px;}
.btn-mist{
  padding:8px 14px; border-radius:var(--radius-btn); background:var(--mist); color:var(--iron); border:none;
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;
}
.btn-mist:hover{background:#f2f2f2;}
.btn-ghost-dark{
  padding:8px 13px; border-radius:var(--radius-btn); background:transparent; color:var(--text-2); border:1px solid var(--border);
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;
}
.btn-ghost-dark:hover{color:var(--text-1); border-color:#54565a;}
.icon-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-2);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.icon-btn:hover{color:var(--text-1); background:var(--recessed);}
.notif-dot{position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--coral);}

.page{width:100%; max-width:1240px; margin:0 auto; padding:28px 20px 64px; position:relative; z-index:1; animation:fadeIn .35s ease;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
.page-title{font-size:32px; font-weight:600; letter-spacing:0.1px; line-height:1.15;}
.page-sub{font-size:14px; color:var(--text-2); margin-top:6px; max-width:520px; line-height:1.6;}

/* ---------- bento grid ---------- */
.bento{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; width:100%;}
.tile{
  border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--ink); padding:22px;
  position:relative; cursor:pointer; animation:tileIn .4s ease both;
  box-shadow: rgba(255,255,255,0.04) 0px 1px 0px 0px inset, rgba(0,0,0,0.35) 0px 8px 20px 0px;
  transition:transform .15s ease, border-color .15s ease;
}
.tile:hover{transform:translateY(-3px); border-color:#4c4e52;}
.tile.feature{grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column; overflow:hidden;}
.tile.feature > *{position:relative; z-index:1;}
.tile.wide{grid-column:span 2;}
.tile-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-3); font-weight:500; display:flex; align-items:center; gap:6px;}
.tile-title{font-size:16px; font-weight:600; margin-top:6px; color:var(--text-1);}
.tile-num{font-size:34px; font-weight:600; letter-spacing:-0.01em; margin-top:10px; color:var(--text-1);}
.tile-num.coral{color:var(--coral);}
.tile-num.green{color:var(--green);}
.tile-caption{font-size:12.5px; color:var(--text-2); margin-top:4px;}
.tile-arrow{position:absolute; top:20px; right:20px; color:var(--text-3); font-size:15px;}

.funnel-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
.funnel-label{width:76px; font-size:12px; color:var(--text-2); flex-shrink:0;}
.funnel-track{flex:1; height:10px; border-radius:5px; background:var(--recessed); overflow:hidden;}
.funnel-fill{height:100%; border-radius:5px;}
.funnel-val{width:44px; text-align:right; font-size:12.5px; font-weight:600; color:var(--text-1);}

.list-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-left{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-1); font-weight:500;}
.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

.badge{
  display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600;
}
.badge-green{background:rgba(89,212,153,.14); color:var(--green);}
.badge-coral{background:var(--coral-tint); color:var(--coral);}
.badge-blue{background:rgba(86,194,255,.14); color:var(--blue);}
.badge-gray{background:var(--recessed); color:var(--text-2); border:1px solid var(--border-soft);}

/* ---------- generic content panels ---------- */
.panel{border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--ink); overflow:hidden;
  box-shadow: rgba(255,255,255,0.04) 0px 1px 0px 0px inset;}
.panel-head{padding:18px 22px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between;}
.panel-title{font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px;}
.panel-sub{font-size:12px; color:var(--text-3); margin-top:3px;}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}

.row-item{display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .12s ease;}
.row-item:hover{background:rgba(255,255,255,.02);}
.row-item:last-child{border-bottom:none;}
.avatar-circle{
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
  background:var(--recessed); color:var(--text-1); flex-shrink:0; border:1px solid var(--border-soft);
}
.row-title{font-size:13.5px; font-weight:600; color:var(--text-1);}
.row-meta{font-size:12px; color:var(--text-3); margin-top:2px;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.search-box{
  display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:var(--radius-input);
  padding:9px 12px; background:var(--recessed); min-width:230px; color:var(--text-2); font-size:13px;
}
.search-box input{border:none; outline:none; background:transparent; color:var(--text-1); font-size:13px; width:100%; font-family:inherit;}
.tab-pill{display:flex; gap:4px; background:var(--recessed); border-radius:var(--radius-pill); padding:4px; border:1px solid var(--border-soft);}
.tab-pill button{padding:7px 14px; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--text-2); font-size:12.5px; font-weight:600;}
.tab-pill button.active{background:var(--mist); color:var(--iron);}

.table{width:100%; border-collapse:collapse;}
.table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:600; padding:11px 22px; border-bottom:1px solid var(--border-soft);}
.table td{padding:13px 22px; border-bottom:1px solid var(--border-soft); font-size:13px; color:var(--text-1);}
.table tr.clickable{cursor:pointer;}
.table tr.clickable:hover td{background:rgba(255,255,255,.025);}

.perm-matrix{width:100%; border-collapse:collapse;}
.perm-matrix th, .perm-matrix td{padding:13px 18px; border-bottom:1px solid var(--border-soft); font-size:13px;}
.perm-matrix th{color:var(--text-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; text-align:center;}
.perm-matrix th:first-child{text-align:left;}
.perm-check{
  width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:transparent; margin:0 auto; display:flex;
  align-items:center; justify-content:center; color:var(--text-3);
}
.perm-check.on{background:var(--coral-tint); border-color:var(--coral); color:var(--coral);}

.usage-bar-row{display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--border-soft);}
.usage-bar-row:last-child{border-bottom:none;}
.usage-name{width:150px; font-size:13px; font-weight:500; flex-shrink:0;}
.usage-track{flex:1; height:8px; border-radius:4px; background:var(--recessed); overflow:hidden;}
.usage-fill{height:100%; border-radius:4px; background:linear-gradient(90deg, var(--coral), #ff8f8f);}
.usage-val{width:50px; text-align:right; font-size:12.5px; color:var(--text-2);}

/* ---------- modal / drawer ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .15s ease;}
.modal-box{
  width:520px; max-width:100%; max-height:86vh; overflow-y:auto; background:var(--ink); border:1px solid var(--border);
  border-radius:20px; padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.5); animation:fadeInUp .2s ease;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-title{font-size:17px; font-weight:600;}
.close-x{width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-2); display:flex; align-items:center; justify-content:center;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0;}
.detail-field{border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px; background:var(--recessed);}
.detail-field .k{font-size:11px; color:var(--text-3); font-weight:600; margin-bottom:3px;}
.detail-field .v{font-size:13.5px; font-weight:600; color:var(--text-1);}
.modal-footer{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
.field-label{font-size:12px; color:var(--text-2); font-weight:600; margin:12px 0 6px;}
.field-input{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-input); padding:10px 12px; font-size:13px;
  font-family:inherit; background:var(--recessed); color:var(--text-1);
}
textarea.field-input{resize:vertical; min-height:100px; line-height:1.6;}
.select-pill{background:var(--recessed); border:1px solid var(--border-soft); border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; color:var(--text-1);}

.toast-wrap{position:fixed; bottom:26px; left:50%; z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--mist); color:var(--iron); padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:toastIn .25s ease; transform:translate(-50%,0); position:relative; left:0;
}

.oauth-card{display:flex; align-items:center; gap:14px; padding:18px 22px;}
.oauth-glow{width:44px; height:44px; border-radius:12px; background:var(--coral-tint); display:flex; align-items:center; justify-content:center; color:var(--coral); animation:glow 2.4s infinite;}

@media (max-width:960px){
  .bento{grid-template-columns:repeat(2,1fr);}
  .tile.feature{grid-column:span 2;}
  .grid-2{grid-template-columns:1fr;}
  .navbar-inner{flex-wrap:wrap; gap:10px; border-radius:20px;}
}
</style>
</head>
<body data-archetype="bento-grid">
<div id="app-root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

/* ---------------- mock data ---------------- */
const NAV = [
  {key:'main', label:'개요', icon:'layout-grid'},

const PAGE_META = {

  permissions:{title:'3단계 권한 분리 시스템 설정', sub:'팀원 · 담당자 · 시스템 관리자 권한을 화면·기능 단위로 세분화합니다.'},

const CHANNEL_ROWS = [

  {name:'정하람 작가', stage:'정산 확인 대기', days:'6일째'},

const WEEKLY_HISTORY = [

  {from:'박도윤 작가', subject:'Re: 계약서 발송 — 서명본 첨부드립니다', matched:'박도윤 작가 페이지', status:'매칭완료', time:'40분 전'},
  {from:'unknown@partner-mail.com', subject:'협업 문의드립니다', matched:'—', status:'미매칭', time:'1시간 전'},

  {who:'이하은 (담당자)', action:'이메일 템플릿 "섭외 확정 안내" v4 저장', time:'오늘 08:40'},
  {who:'김도현 (관리자)', action:'사용자 박서준 권한을 담당자로 변경', time:'어제 17:02'},
  {who:'이하은 (담당자)', action:'발송 빈도 제한 5분 → 3분으로 변경', time:'어제 11:20'},
];

const TEMPLATE_USAGE = [
  {name:'섭외 확정 안내', pct:82},
  {name:'계약서 발송', pct:64},
  {name:'정산 완료 안내', pct:47},

function Icon({name, size=18}){
  return <i data-lucide={name} style={{width:size, height:size}}></i>;
}

/* ---------------- shared ---------------- */
function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t=>(<div className="toast" key={t.id}><Icon name="check-circle-2" size={16}/>{t.text}</div>))}</div>;
}
function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><div className="modal-title">{title}</div><button className="close-x" onClick={onClose}><Icon name="x" size={16}/></button></div>
        {children}
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

/* ---------------- Main bento screen ---------------- */
function MainScreen({navigate}){

        <div style={{marginTop:10}}>

        <div style={{marginTop:10}}>
          {TEMPLATE_USAGE.slice(0,3).map((t,i)=>(

/* ---------------- Weekly report ---------------- */
function WeeklyReportScreen(){
  const [weekIdx, setWeekIdx] = useState(1);
  const w = WEEKLY_HISTORY[weekIdx];
  return (
    <React.Fragment>
      <div className="toolbar">
        <div className="tab-pill">
          {WEEKLY_HISTORY.map((h,i)=>(
            <button key={i} className={weekIdx===i?'active':''} onClick={()=>setWeekIdx(i)}>{h.week}</button>
          ))}
        </div>
      </div>
      <div className="bento" style={{gridTemplateColumns:'repeat(4,1fr)', marginBottom:16}}>
        <div className="tile" style={{cursor:'default'}}><div className="tile-eyebrow"><Icon name="users" size={13}/>진행 중 협업</div><div className="tile-num">{w.collab}건</div></div>
        <div className="tile" style={{cursor:'default'}}><div className="tile-eyebrow"><Icon name="alarm-clock" size={13}/>마감 임박 항목</div><div className="tile-num coral">{w.deadline}건</div></div>
        <div className="tile" style={{cursor:'default'}}><div className="tile-eyebrow"><Icon name="mail-question" size={13}/>미응답 건</div><div className="tile-num">{w.noresp}건</div></div>
        <div className="tile" style={{cursor:'default'}}><div className="tile-eyebrow"><Icon name="calendar-check" size={13}/>다음 발송</div><div className="tile-num" style={{fontSize:22}}>월 09:00</div></div>
      </div>
      <div className="grid-2">
        <div className="panel">
          <div className="panel-head"><div className="panel-title"><Icon name="alarm-clock" size={16}/>마감 임박 항목</div></div>
          {NON_RESPONSE.map((n,i)=>(
            <div className="row-item" key={i}>
              <div className="avatar-circle">{n.name[0]}</div>
              <div><div className="row-title">{n.name}</div><div className="row-meta">{n.stage} · {n.days}</div></div>
            </div>
          ))}
        </div>
        <div className="panel">
          <div className="panel-head"><div className="panel-title"><Icon name="trending-up" size={16}/>주차별 비교</div></div>
          <div style={{padding:'18px 22px'}}>
            {WEEKLY_HISTORY.map((h,i)=>(
              <div className="funnel-row" key={i}>
                <div className="funnel-label" style={{width:100, fontSize:11}}>{h.week.slice(5,10)}</div>
                <div className="funnel-track"><div className="funnel-fill" style={{width:(h.collab*6)+'px', minWidth:'20%', background: i===weekIdx?'#ff6363':'#56c2ff'}}></div></div>
                <div className="funnel-val">{h.collab}건</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------- Inbox Sync ---------------- */
function InboxSyncScreen({pushToast, openDetail}){
  const [reconnecting, setReconnecting] = useState(false);
  const reconnect = ()=>{ setReconnecting(true); setTimeout(()=>{setReconnecting(false); pushToast('OAuth 토큰이 갱신되었습니다');},1300); };
  return (
    <React.Fragment>
      <div className="panel" style={{marginBottom:16}}>
        <div className="oauth-card">
          <div className="oauth-glow"><Icon name="plug-zap" size={20}/></div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600, fontSize:14}}>Gmail API OAuth 연동 정상</div>
            <div style={{fontSize:12.5, color:'var(--text-2)', marginTop:2}}>토큰 만료까지 22일 · 자동 갱신 활성화됨</div>
          </div>
          <button className="btn-ghost-dark" onClick={reconnect}><Icon name={reconnecting?'loader-2':'refresh-cw'} size={14}/>{reconnecting?'갱신 중…':'지금 재연동'}</button>
        </div>
      </div>
      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><Icon name="inbox" size={16}/>수신 메일 파싱 로그</div>
          <div className="panel-sub" style={{marginTop:0}}>발신자 기준 노션 작가 페이지 자동 매칭</div>
        </div>
        <table className="table">
          <thead><tr><th>발신자</th><th>제목</th><th>매칭 페이지</th><th>수신 시각</th><th>상태</th></tr></thead>
          <tbody>
            {INBOX_MAILS.map((m,i)=>(
              <tr key={i} className="clickable" onClick={()=>openDetail(m)}>
                <td>{m.from}</td><td>{m.subject}</td><td>{m.matched}</td><td>{m.time}</td>
                <td>{m.status==='매칭완료'? <span className="badge badge-green">매칭완료</span> : <span className="badge badge-coral">미매칭</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </React.Fragment>
  );
}

/* ---------------- Permissions ---------------- */
function PermissionsScreen({pushToast}){
  const [matrix, setMatrix] = useState(PERMS);
  const [showAddRole, setShowAddRole] = useState(false);
  const toggle = (ri, ci)=>{
    setMatrix(m=>m.map((row,i)=> i===ri ? {...row, grants: row.grants.map((g,j)=> j===ci? !g : g)} : row));
  };
  return (
    <React.Fragment>
      <div className="toolbar">
        <div style={{fontSize:13, color:'var(--text-2)'}}>역할별 접근 권한을 화면 클릭으로 즉시 전환합니다.</div>
        <button className="btn-mist" onClick={()=>setShowAddRole(true)}><Icon name="user-plus" size={14}/>역할 세부 추가</button>
      </div>
      <div className="panel" style={{marginBottom:16}}>
        <table className="perm-matrix">
          <thead><tr><th>기능</th>{ROLES.map(r=><th key={r}>{r}</th>)}</tr></thead>
          <tbody>
            {matrix.map((row,ri)=>(
              <tr key={ri}>
                <td>{row.name}</td>
                {row.grants.map((g,ci)=>(
                  <td key={ci} style={{textAlign:'center'}}>
                    <button className={"perm-check"+(g?' on':'')} onClick={()=>{toggle(ri,ci); pushToast(ROLES[ci]+' 권한이 '+(g?'해제':'부여')+'되었습니다');}}>
                      {g && <Icon name="check" size={13}/>}
                    </button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <div className="panel-head"><div className="panel-title"><Icon name="scroll-text" size={16}/>설정 변경 감사 로그</div></div>
        {AUDIT_LOG.map((a,i)=>(
          <div className="row-item" key={i} style={{cursor:'default'}}>
            <div className="avatar-circle"><Icon name="user" size={15}/></div>
            <div><div className="row-title">{a.action}</div><div className="row-meta">{a.who} · {a.time}</div></div>
          </div>
        ))}
      </div>
      {showAddRole && (
        <Modal title="세부 권한 항목 추가" onClose={()=>setShowAddRole(false)} footer={<>
          <button className="btn-ghost-dark" onClick={()=>setShowAddRole(false)}>취소</button>
          <button className="btn-mist" onClick={()=>{setShowAddRole(false); pushToast('세부 권한 항목이 추가되었습니다');}}>추가</button>
        </>}>
          <div className="field-label">기능명</div>
          <input className="field-input" placeholder="예: 발신 도메인 SPF/DKIM 설정" />
          <div className="field-label">기본 허용 역할</div>
          <span className="select-pill">시스템 관리자만</span>
        </Modal>
      )}
    </React.Fragment>
  );
}

/* ---------------- Template Audit ---------------- */
function TemplateAuditScreen(){
  const [filter, setFilter] = useState('전체');
  const filtered = filter==='전체' ? AUDIT_LOG : AUDIT_LOG.filter(a=>a.who.includes(filter));
  return (
    <React.Fragment>
      <div className="panel" style={{marginBottom:16}}>
        <div className="panel-head"><div className="panel-title"><Icon name="pie-chart" size={16}/>템플릿별 사용 비중</div></div>
        {TEMPLATE_USAGE.map((t,i)=>(
          <div className="usage-bar-row" key={i}>
            <div className="usage-name">{t.name}</div>
            <div className="usage-track"><div className="usage-fill" style={{width:t.pct+'%'}}></div></div>
            <div className="usage-val">{t.pct}%</div>
          </div>
        ))}
      </div>
      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><Icon name="scroll-text" size={16}/>전체 감사 로그</div>
          <div className="tab-pill">
            {['전체','관리자','담당자'].map(f=>(<button key={f} className={filter===f?'active':''} onClick={()=>setFilter(f)}>{f}</button>))}
          </div>
        </div>
        {filtered.map((a,i)=>(
          <div className="row-item" key={i} style={{cursor:'default'}}>
            <div className="avatar-circle"><Icon name="history" size={15}/></div>
            <div><div className="row-title">{a.action}</div><div className="row-meta">{a.who} · {a.time}</div></div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const [mailDetail, setMailDetail] = useState(null);
  const [exporting, setExporting] = useState(false);

  const pushToast = (text)=>{
    const id = Date.now();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const meta = PAGE_META[screen];
  return (
    <div className="shell">
      <div className="bg-atmos"></div>
      <nav className="navbar">
        <div className="navbar-inner">
          <div className="nav-brand"><div className="brand-diamond"></div><span className="brand-word">AutoFlow Hub</span></div>
          <div className="nav-links">
            {NAV.map(n=>(
              <button key={n.key} className={"nav-link"+(screen===n.key?' active':'')} onClick={()=>setScreen(n.key)}>
                <Icon name={n.icon} size={14}/>{n.label}
              </button>
            ))}
          </div>
          <div className="nav-right">
            <button className="icon-btn" onClick={()=>pushToast('미응답 작가 3명이 있습니다')}><Icon name="bell" size={16}/><span className="notif-dot"></span></button>
            <button className="btn-mist" onClick={()=>{
              setExporting(true);
              setTimeout(()=>{ setExporting(false); pushToast('운영 리포트가 내보내졌습니다'); }, 1300);
            }}><Icon name={exporting?'loader-2':'download'} size={14}/>{exporting?'내보내는 중…':'운영 리포트 내보내기'}</button>
          </div>
        </div>
      </nav>

      <div className="page">
        <div className="page-head">
          <div><div className={"page-title"+(screen==='main'?' display-hero':'')}>{meta.title}</div><div className="page-sub">{meta.sub}</div></div>
        </div>
        {screen==='main' && <MainScreen navigate={setScreen} />}
        {screen==='weekly-report' && <WeeklyReportScreen />}
        {screen==='inbox-sync' && <InboxSyncScreen pushToast={pushToast} openDetail={setMailDetail} />}
        {screen==='permissions' && <PermissionsScreen pushToast={pushToast} />}
        {screen==='template-audit' && <TemplateAuditScreen />}
      </div>

      {mailDetail && (
        <Modal title="수신 메일 상세" onClose={()=>setMailDetail(null)} footer={<>
          <button className="btn-ghost-dark" onClick={()=>setMailDetail(null)}>닫기</button>
          <button className="btn-mist" onClick={()=>{setMailDetail(null); pushToast('노션 페이지로 코멘트가 기록되었습니다');}}><Icon name="notebook-pen" size={14}/>노션에 기록</button>
        </>}>
          <div style={{fontSize:15, fontWeight:600}}>{mailDetail.subject}</div>
          <div className="detail-grid">
            <div className="detail-field"><div className="k">발신자</div><div className="v">{mailDetail.from}</div></div>
            <div className="detail-field"><div className="k">매칭 페이지</div><div className="v">{mailDetail.matched}</div></div>
            <div className="detail-field"><div className="k">수신 시각</div><div className="v">{mailDetail.time}</div></div>
            <div className="detail-field"><div className="k">상태</div><div className="v">{mailDetail.status}</div></div>
          </div>
          <div className="field-label">본문 요약</div>
          <div className="field-input" style={{background:'var(--recessed)'}}>일정 확인 완료했으며 제안된 조건대로 진행 부탁드립니다. 계좌번호는 별도로 전달드리겠습니다.</div>
        </Modal>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
