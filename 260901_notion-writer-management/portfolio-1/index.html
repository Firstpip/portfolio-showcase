<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이터베이스 — AI 작가 섭외 매니저</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --harvest:#fa5d00;
  --harvest-dark:#e05300;
  --marigold:#fee3b5;
  --parchment:#e3d6c5;
  --ink:#1d1e1c;
  --paper:#ffffff;
  --cream:#fff8f1;
  --mist:#d9d9d9;
  --stone:#615f5c;
  --driftwood:#8e8b87;
  --bone:#c0bbb6;
  --accent:#1ef6da;
  --shadow-sm: rgba(0,0,0,0.2) 0px 1px 4px 0px;
  --shadow-lg: rgba(250,166,0,0.25) 6px 4px 24px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--cream);
  color:var(--ink);
  letter-spacing:0.015em;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;letter-spacing:0.015em;}
input,select,textarea{font-family:inherit;letter-spacing:0.015em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--bone);border-radius:8px;}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes drawerSlide{
  from{transform:translateX(100%);}
  to{transform:translateX(0);}
}
@keyframes shimmer{
  0%{background-position:-400px 0;}
  100%{background-position:400px 0;}
}
@keyframes pulseDot{
  0%,100%{opacity:1;}
  50%{opacity:0.35;}
}
@keyframes floatCard{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(16px) scale(0.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
/* header */
.topnav{
  position:sticky;top:0;z-index:40;
  width:100%;height:72px;
  background:var(--cream);
  border-bottom:1px solid var(--mist);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--ink);}
.brand .mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg, var(--harvest), #ff8a3d);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
  box-shadow:var(--shadow-sm);
  animation:floatCard 3.2s ease-in-out infinite;
}
.nav-tabs{display:flex;gap:4px;background:transparent;}
.nav-tab{
  padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;color:var(--stone);
  display:flex;align-items:center;gap:7px;transition:all .18s ease;
}
.nav-tab:hover{background:var(--marigold);color:var(--ink);}
.nav-tab.active{background:var(--harvest);color:#fff;box-shadow:var(--shadow-sm);}
.nav-right{display:flex;align-items:center;gap:14px;}
.pending-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--bone);border-radius:999px;
  padding:7px 14px;font-size:13px;color:var(--stone);font-weight:500;
}
.pending-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--harvest);animation:pulseDot 1.8s infinite;}
.avatar-btn img{width:38px;height:38px;border-radius:50%;border:2px solid var(--paper);box-shadow:var(--shadow-sm);}

/* hero strip on main */
.hero-strip{
  width:100%;
  padding:36px 40px 28px;
  background:linear-gradient(120deg, var(--cream) 0%, var(--marigold) 130%);
  border-bottom:1px solid var(--mist);
}
.hero-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.hero-title{font-size:32px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:0.02em;}
.hero-sub{font-size:15px;color:var(--stone);margin:0;max-width:520px;line-height:1.5;}
.hero-stats{display:flex;gap:28px;}
.hstat{text-align:right;}
.hstat b{display:block;font-size:26px;font-weight:700;color:var(--harvest);}
.hstat span{font-size:12px;color:var(--driftwood);}

/* main layout */
.page{width:100%;max-width:1440px;margin:0 auto;padding:28px 40px 64px;display:flex;gap:28px;align-items:flex-start;}
.filter-rail{
  width:250px;flex-shrink:0;
  background:var(--paper);border:1px solid var(--mist);border-radius:20px;
  padding:24px;position:sticky;top:96px;
}
.filter-rail h3{font-size:14px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 14px;}
.filter-group{margin-bottom:24px;}
.filter-group label{display:block;font-size:13px;color:var(--driftwood);margin-bottom:8px;font-weight:600;}
.search-box{
  width:100%;padding:11px 14px;border-radius:16px;border:1px solid var(--bone);
  background:var(--cream);font-size:14px;color:var(--ink);margin-bottom:18px;
}
.search-box:focus{outline:none;border-color:var(--harvest);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--bone);background:var(--paper);
  font-size:12.5px;color:var(--stone);font-weight:500;transition:all .15s;
}
.chip.on{background:var(--harvest);border-color:var(--harvest);color:#fff;}
.status-select{
  width:100%;padding:10px 12px;border-radius:16px;border:1px solid var(--bone);
  background:var(--cream);font-size:13.5px;color:var(--ink);
}

.gallery-col{flex:1;min-width:0;}
.gallery-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.gallery-topbar h2{font-size:18px;font-weight:700;margin:0;}
.gallery-count{font-size:13px;color:var(--driftwood);font-weight:500;}
.btn-row{display:flex;gap:10px;}
.btn{
  padding:11px 22px;border-radius:16px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:all .16s ease;
}
.btn-primary{background:var(--harvest);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--harvest-dark);transform:translateY(-1px);}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--bone);}
.btn-ghost:hover{border-color:var(--harvest);color:var(--harvest);}
.btn-text{color:var(--harvest);font-weight:500;padding:6px 4px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

.gallery-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;
}
.writer-card{
  background:var(--paper);border-radius:20px;padding:22px;
  box-shadow:var(--shadow-sm);cursor:pointer;
  animation:fadeInUp .45s ease both;
  transition:transform .2s ease, box-shadow .2s ease;
  border:1px solid transparent;
}
.writer-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--marigold);}
.wc-top{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.wc-top img{width:52px;height:52px;border-radius:14px;flex-shrink:0;}
.wc-name{font-size:16px;font-weight:700;color:var(--ink);}
.wc-genre{font-size:12.5px;color:var(--harvest);font-weight:600;}
.wc-bio{font-size:13px;color:var(--stone);line-height:1.5;margin:0 0 14px;min-height:38px;}
.wc-foot{display:flex;justify-content:space-between;align-items:center;}
.status-badge{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.status-가능{background:#e6f9f2;color:#0e8f6a;}
.status-중{background:#fff1e0;color:var(--harvest);}
.status-완료{background:#eef0ff;color:#5457d6;}
.status-휴면{background:#f0efed;color:var(--driftwood);}
.wc-rating{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--driftwood);font-weight:600;}

/* drawer */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(29,30,28,0.35);z-index:60;
  display:flex;justify-content:flex-end;
}
.drawer{
  width:420px;max-width:92vw;height:100%;background:var(--paper);
  box-shadow:-8px 0 32px rgba(0,0,0,0.16);
  animation:drawerSlide .28s cubic-bezier(.2,.9,.3,1) both;
  overflow-y:auto;padding:30px;
}
.drawer-close{position:absolute;top:24px;right:24px;width:34px;height:34px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;}
.drawer-head{display:flex;gap:16px;align-items:center;margin-bottom:22px;}
.drawer-head img{width:64px;height:64px;border-radius:16px;}
.drawer h2{font-size:22px;margin:0 0 4px;}
.drawer-section{margin-bottom:22px;}
.drawer-section h4{font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--driftwood);margin:0 0 10px;font-weight:700;}
.drawer-section p{font-size:14px;line-height:1.6;color:var(--stone);margin:0;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.history-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream);font-size:13.5px;}
.drawer-actions{display:flex;gap:10px;margin-top:26px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(29,30,28,0.4);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  width:520px;max-width:100%;background:var(--paper);border-radius:20px;
  padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.25);
  animation:fadeInUp .3s ease both;max-height:88vh;overflow-y:auto;
}
.modal-box h3{font-size:20px;margin:0 0 6px;}
.modal-box .modal-desc{font-size:13.5px;color:var(--stone);margin:0 0 22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--bone);
  background:var(--cream);font-size:14px;color:var(--ink);
}
.field textarea{min-height:88px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--harvest);outline-offset:1px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.upload-zone{
  border:2px dashed var(--bone);border-radius:16px;padding:30px;text-align:center;
  color:var(--driftwood);font-size:13.5px;margin-bottom:16px;transition:all .15s;
}
.upload-zone.drag{border-color:var(--harvest);background:var(--marigold);color:var(--harvest);}
.dup-row{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;}

/* toast */
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:90;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-size:13.5px;
  display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,0.25);
  animation:toastIn .3s ease both;
}
.toast i{color:var(--accent);font-size:18px;}

/* recommend screen */
.recommend-wrap{max-width:1100px;margin:0 auto;padding:40px;}
.rec-form{
  background:var(--paper);border-radius:20px;padding:32px;box-shadow:var(--shadow-sm);
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:32px;
}
.rec-form .field{margin-bottom:0;}
.rec-form-foot{grid-column:1/-1;display:flex;justify-content:flex-end;}
.loading-block{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--stone);}
.skeleton-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;width:100%;}
.skeleton-card{height:200px;border-radius:20px;background:linear-gradient(90deg, var(--marigold) 0px, #fff 40px, var(--marigold) 80px);background-size:400px 100%;animation:shimmer 1.4s infinite linear;}
.result-notice{
  background:var(--marigold);border-radius:14px;padding:12px 18px;font-size:13px;color:var(--ink);
  margin-bottom:18px;display:flex;align-items:center;gap:8px;
}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
.result-card{background:var(--paper);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);position:relative;animation:fadeInUp .4s ease both;}
.result-rank{position:absolute;top:-10px;left:16px;background:var(--harvest);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
.score-badges{display:flex;flex-direction:column;gap:6px;margin:14px 0;}
.score-badge{display:flex;justify-content:space-between;font-size:12px;color:var(--stone);}
.score-bar{height:5px;background:var(--cream);border-radius:4px;overflow:hidden;margin-top:2px;}
.score-fill{height:100%;background:var(--harvest);border-radius:4px;}
.approve-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--cream);}

/* mailing screen */
.mailing-wrap{max-width:1240px;margin:0 auto;padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.panel{background:var(--paper);border-radius:20px;padding:26px;box-shadow:var(--shadow-sm);}
.panel h3{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.panel .panel-sub{font-size:12.5px;color:var(--driftwood);margin:0 0 18px;}
.tpl-row,.queue-row,.reply-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--cream);
}
.tpl-row:last-child,.queue-row:last-child,.reply-row:last-child{border-bottom:none;}
.tpl-name{font-size:14px;font-weight:600;}
.tpl-meta{font-size:12px;color:var(--driftwood);}
.reply-info{flex:1;min-width:0;}
.reply-name{font-size:14px;font-weight:600;}
.reply-snip{font-size:12.5px;color:var(--stone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}
.classify-badge{padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.cb-수락{background:#e6f9f2;color:#0e8f6a;}
.cb-거절{background:#fdeaea;color:#c94141;}
.cb-협의중{background:#fff1e0;color:var(--harvest);}
.cb-검토{background:#eef0ff;color:#5457d6;}
.correction-select{border:1px solid var(--bone);border-radius:10px;padding:5px 9px;font-size:12px;background:var(--cream);margin-left:8px;}
.mailing-full{grid-column:1/-1;}

/* dashboard */
.dash-wrap{max-width:1240px;margin:0 auto;padding:40px;}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px;}
.chart-card{background:var(--paper);border-radius:20px;padding:26px;box-shadow:var(--shadow-sm);}
.chart-card h3{font-size:15px;margin:0 0 18px;}
.chart-frame{position:relative;height:260px;width:100%;}
.reminder-list{background:var(--paper);border-radius:20px;padding:26px;box-shadow:var(--shadow-sm);}
.reminder-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--cream);}
.reminder-row:last-child{border-bottom:none;}
.reminder-days{font-size:12px;color:var(--harvest);font-weight:700;background:var(--marigold);padding:4px 10px;border-radius:999px;}

.empty-block{text-align:center;padding:70px 20px;color:var(--driftwood);}
.empty-block i{font-size:44px;margin-bottom:12px;display:block;}

@media (max-width:960px){
  .page{flex-direction:column;}
  .filter-rail{width:100%;position:static;}
  .rec-form{grid-template-columns:1fr;}
  .mailing-wrap{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
}
</style>
</head>

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (msg) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  };
  return { toasts, push };
}

function Toasts({ toasts }){
  if(!toasts.length) return null;
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><i className="ph-fill ph-check-circle"></i>{t.msg}</div>
      ))}
    </div>
  );
}

          </div>
        ))}
        <button className="btn btn-ghost" style={{width:'100%', justifyContent:'center', marginTop:'12px'}} onClick={() => setShowTplModal(true)}>
          <i className="ph ph-plus"></i> 새 템플릿 만들기
        </button>
      </div>

      <div className="panel">
        <h3><i className="ph ph-clock-countdown"></i> 발송 승인 대기</h3>
        <p className="panel-sub">AI 추천에서 승인된 작가에게 자동 생성 메일을 발송합니다.</p>
        {sentQueue.length === 0 ? (
          <div className="empty-block" style={{padding:'32px 0'}}><i className="ph ph-check-circle"></i>대기 중인 발송 건이 없습니다.</div>
        ) : sentQueue.map(s => (
          <div className="queue-row" key={s.id}>
            <div>
              <div className="tpl-name">{s.name}</div>
              <div className="tpl-meta">{s.genre} · {s.template}</div>
            </div>
            <button className="btn btn-primary" style={{padding:'8px 16px', fontSize:'13px'}} onClick={() => sendNow(s.id)}>지금 발송</button>
          </div>
        ))}
      </div>

      <div className="panel mailing-full">
        <h3><i className="ph ph-chat-circle-text"></i> 회신 관리 큐</h3>
        <p className="panel-sub">회신은 LLM으로 1차 분류되며, 신뢰도가 낮은 건은 담당자가 직접 보정합니다.</p>
        {replies.map(r => (
          <div className="reply-row" key={r.id}>
            <div className="reply-info">
              <div className="reply-name">{r.name}</div>
              <div className="reply-snip">{r.snippet}</div>
            </div>
            <span className={"classify-badge cb-" + r.classify}>{r.classify} {r.confidence < 0.6 ? "· 신뢰도 낮음" : ""}</span>
            <select className="correction-select" value={r.classify} onChange={e => reclassify(r.id, e.target.value)}>
              <option value="수락">수락</option>
              <option value="거절">거절</option>
              <option value="협의중">협의중</option>
              <option value="검토">검토 필요</option>
            </select>
          </div>
        ))}
      </div>

      {showTplModal && (
        <div className="modal-overlay" onClick={() => setShowTplModal(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3>템플릿 편집</h3>
            <p className="modal-desc">변수는 {"{{작가명}}"}, {"{{장르}}"}, {"{{마감일}}"} 형식으로 삽입합니다.</p>
            <div className="field">
              <label>템플릿 제목</label>
              <input defaultValue="기본 섭외 템플릿" />
            </div>
            <div className="field">
              <label>본문</label>
              <textarea defaultValue={"안녕하세요 {{작가명}} 작가님,\\n{{장르}} 분야 신규 프로젝트 섭외를 제안드립니다."} />
            </div>
            <div className="modal-foot">
              <button className="btn btn-ghost" onClick={() => setShowTplModal(false)}>취소</button>
              <button className="btn btn-primary" onClick={() => { setShowTplModal(false); toast("템플릿이 저장되었습니다."); }}><i className="ph ph-check"></i> 저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DashboardScreen({ toast }){
  return (
    <div className="dash-wrap">
      <h1 className="hero-title" style={{marginBottom:'6px'}}>협업 대시보드</h1>
      <p className="hero-sub" style={{marginBottom:'26px'}}>월별 섭외 성공률, 장르별 협업 분포, 미응답 리마인더를 한 화면에서 확인합니다.</p>
      <div className="dash-grid">
        <div className="chart-card">
          <h3>월별 섭외 성공률 추이</h3>
          <div className="chart-frame">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={MONTHLY_SUCCESS}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e3d6c5" />
                <XAxis dataKey="month" stroke="#8e8b87" fontSize={12} />
                <YAxis stroke="#8e8b87" fontSize={12} unit="%" />
                <Tooltip />
                <Line type="monotone" dataKey="rate" stroke="#fa5d00" strokeWidth={3} dot={{ r:4, fill:'#fa5d00' }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="chart-card">
          <h3>장르별 협업 분포</h3>
          <div className="chart-frame">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={GENRE_DIST} dataKey="value" nameKey="name" innerRadius={55} outerRadius={90} paddingAngle={2}>
                  {GENRE_DIST.map((e, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Legend layout="vertical" align="right" verticalAlign="middle" wrapperStyle={{fontSize:'12px'}} />
                <Tooltip />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
      <div className="reminder-list">
        <h3 style={{fontSize:'15px', margin:'0 0 14px'}}><i className="ph ph-bell-ringing"></i> 미응답 리마인더</h3>
        {REMINDERS.map(r => (
          <div className="reminder-row" key={r.id}>
            <div>
              <div className="tpl-name">{r.name}</div>
              <div className="tpl-meta">최근 발송 후 응답 대기 중</div>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
              <span className="reminder-days">{r.days}일 경과</span>
              <button className="btn btn-ghost" style={{padding:'8px 14px', fontSize:'12.5px'}} onClick={() => toast(`${r.name} 작가에게 리마인드 메일을 발송했습니다.`)}>
                <i className="ph ph-bell"></i> 리마인드 발송
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState("main");
  const { toasts, push } = useToasts();

  const TABS = [
    { id:"main", label:"작가 데이터베이스", icon:"ph-database" },
    { id:"recommend", label:"AI 추천", icon:"ph-sparkle" },
    { id:"mailing", label:"메일링 & 회신관리", icon:"ph-envelope-simple-open" },
    { id:"dashboard", label:"협업 대시보드", icon:"ph-chart-bar" },
  ];

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <header className="topnav">
        <div className="brand"><span className="mark"><i className="ph-fill ph-feather"></i></span>라이터베이스</div>
        <nav className="nav-tabs">
          {TABS.map(t => (
            <button key={t.id} className={"nav-tab" + (screen === t.id ? " active" : "")} onClick={() => setScreen(t.id)}>
              <i className={"ph " + t.icon}></i>{t.label}
            </button>
          ))}
        </nav>
        <div className="nav-right">
          <div className="pending-pill"><span className="dot"></span>회신 대기 4건</div>
          <button className="avatar-btn" onClick={() => push("정유진 담당자 계정으로 로그인되어 있습니다.")}><img src="https://source.boringavatars.com/beam/38/기획담당자?colors=fa5d00,ff8a3d,1ef6da,fff8f1,1d1e1c" alt="담당자" /></button>
        </div>
      </header>
      <main style={{flex:1, width:'100%'}}>
        {screen === "main" && <MainScreen toast={push} />}
        {screen === "recommend" && <RecommendScreen toast={push} />}
        {screen === "mailing" && <MailingScreen toast={push} />}
        {screen === "dashboard" && <DashboardScreen toast={push} />}
      </main>
      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
