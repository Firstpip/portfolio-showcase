<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오픈마켓 통합 연동 관제 콘솔 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
:root{
  --bg:#fff8f1;
  --surface:#ffffff;
  --primary:#fa5d00;
  --primary-dark:#d84f00;
  --accent:#1ef6da;
  --text:#1d1e1c;
  --text-secondary:#615f5c;
  --text-tertiary:#8e8b87;
  --border:#c0bbb6;
  --divider:#e7ded4;
  --marigold:#fee3b5;
  --success:#1f9d6f;
  --warn:#c98a1a;
  --danger:#d64545;
  --radius-card:20px;
  --radius-input:16px;
  --radius-tag:999px;
  --shadow-sm:0 1px 4px 0 rgba(0,0,0,.14);
  --shadow-lg:6px 4px 24px 0 rgba(250,109,0,.16);
  --sidebar-w:246px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  width:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
#root{width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(31,157,111,.45)}70%{box-shadow:0 0 0 8px rgba(31,157,111,0)}100%{box-shadow:0 0 0 0 rgba(31,157,111,0)}}
@keyframes toastSlide{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes spinRing{to{transform:rotate(360deg)}}

.app-shell{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--divider);padding:22px 16px;display:flex;flex-direction:column;gap:22px;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#ff8a3d);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.36px}
.brand-env{font-size:11px;color:var(--text-tertiary);background:var(--bg);border:1px solid var(--divider);border-radius:999px;padding:3px 9px;margin-left:auto}
.sidebar-section{display:flex;flex-direction:column;gap:2px}
.sidebar-section-title{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.6px;padding:6px 10px}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--text-secondary);transition:background .15s,color .15s}
.sidebar-link i{font-size:18px}
.sidebar-link:hover{background:var(--bg)}
.sidebar-link.active{background:var(--marigold);color:var(--primary-dark);font-weight:600}
.sidebar-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--divider);font-size:12px;color:var(--text-tertiary)}

.main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;width:calc(100% - var(--sidebar-w));min-height:100vh;padding:28px 36px 60px}
.page-header{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:38px;font-weight:700;letter-spacing:.2px}
.page-meta{font-size:13px;color:var(--text-tertiary)}
.page-actions{display:flex;gap:10px;align-items:center}
.select-pill{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-input);padding:9px 14px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff;padding:10px 20px;border-radius:var(--radius-input);font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;transition:background .15s,transform .1s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:var(--radius-input);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{color:var(--primary);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}

/* status-strip: slim inline metric bar (command-tower — replaces big KPI card row) */
.status-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;height:104px;justify-content:space-between;cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeInUp .5s ease both}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-market{font-size:13px;font-weight:600;color:var(--text)}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.ok{background:var(--success);animation:pulseDot 2s infinite}
.status-dot.delay{background:var(--warn)}
.status-dot.fail{background:var(--danger)}
.stat-value{font-size:22px;font-weight:700}
.stat-sub{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-tertiary)}
.stat-sparkline{width:56px;height:24px}

.grid-2col{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius-card);padding:22px 24px}
.panel-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-title i{color:var(--primary);font-size:18px}

/* primary-focus: sync timeline swimlanes */
.timeline-row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--divider)}
.timeline-row:last-child{border-bottom:none}
.timeline-market{font-size:13px;font-weight:600;color:var(--text-secondary)}
.timeline-track{display:flex;gap:3px}
.timeline-cell{flex:1;height:22px;border-radius:5px;background:#f1ece4}
.timeline-cell.ok{background:var(--success)}
.timeline-cell.delay{background:var(--warn)}
.timeline-cell.fail{background:var(--danger)}
.timeline-legend{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--text-tertiary)}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* priority-rail */
.priority-item{border:1px solid var(--divider);border-radius:14px;padding:13px 14px;margin-bottom:10px;animation:fadeInUp .4s ease both}
.priority-item:last-child{margin-bottom:0}
.priority-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.priority-market{font-size:12px;font-weight:700;color:var(--primary)}
.priority-score{font-size:11px;background:var(--marigold);color:var(--primary-dark);padding:2px 8px;border-radius:999px;font-weight:700}
.priority-desc{font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.4}
.priority-actions{display:flex;gap:8px}
.mini-btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:10px;border:1px solid var(--border)}
.mini-btn.retry{background:var(--primary);color:#fff;border-color:var(--primary)}
.mini-btn.retrying{background:var(--marigold);color:var(--primary-dark);border-color:var(--marigold)}
.mini-btn.done{background:#e6f5ee;color:var(--success);border-color:#c7e9d8}

.secondary-widgets{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-box{height:170px}

/* tab bar (used on mapping/orders screens) */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--divider);margin-bottom:16px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-tertiary);border-bottom:2px solid transparent;position:relative;top:1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:180px;border:1px solid var(--border);border-radius:var(--radius-input);padding:10px 14px;font-size:13px;background:var(--surface)}
.filter-chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-secondary)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.data-table-wrap{overflow-x:auto;border:1px solid var(--divider);border-radius:16px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{text-align:left;background:var(--bg);color:var(--text-tertiary);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;border-bottom:1px solid var(--divider)}
.data-table tbody td{padding:13px 14px;border-bottom:1px solid var(--divider);color:var(--text)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.ok{background:#e6f5ee;color:var(--success)}
.badge.warn{background:#fdf1e0;color:var(--warn)}
.badge.fail{background:#fbe7e7;color:var(--danger)}
.badge.info{background:var(--marigold);color:var(--primary-dark)}
.row-action{color:var(--primary);font-weight:600;font-size:12px}
.checkbox{width:16px;height:16px;accent-color:var(--primary)}

.bulk-bar{display:flex;align-items:center;justify-content:space-between;background:var(--marigold);border-radius:14px;padding:12px 18px;margin-bottom:14px;animation:fadeInUp .25s ease both}
.bulk-bar span{font-size:13px;font-weight:600;color:var(--primary-dark)}

.policy-strip{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.policy-step{background:var(--bg);border:1px solid var(--divider);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.policy-arrow{color:var(--text-tertiary)}

/* modal / drawer / toast */
.overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp .2s ease both}
.modal{background:var(--surface);border-radius:var(--radius-card);width:min(520px,92vw);max-height:86vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-input);padding:10px 13px;font-size:13px;background:var(--bg)}
.field textarea{resize:vertical;min-height:70px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.drawer-overlay{position:fixed;inset:0;background:rgba(29,30,28,.4);z-index:100}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:101;padding:26px;overflow-y:auto;animation:drawerIn .28s cubic-bezier(.2,.8,.3,1) both}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.24);z-index:200;animation:toastSlide .28s ease both;display:flex;align-items:center;gap:8px}

.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-tertiary)}
.detail-value{font-weight:600}

.stepper{display:flex;align-items:center;margin:16px 0}
.step-dot{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-tertiary)}
.step-dot.done{background:var(--success);color:#fff;border-color:var(--success)}
.step-line{flex:1;height:2px;background:var(--divider)}
.step-line.done{background:var(--success)}
.step-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);margin-top:6px}

.loading-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spinRing .7s linear infinite;display:inline-block}
.legend-swatch{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:2px}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

function sparkPath(seed){
  const pts = Array.from({length:10},(_,i)=> 6 + Math.abs(Math.sin(seed*3.1+i*1.7))*16 );
  return pts.map((v,i)=> `${i===0?'M':'L'} ${i*6},${24-v}`).join(' ');
}
function Sparkline({ seed, color }){
  return (
    <svg className="stat-sparkline" viewBox="0 0 54 24">
      <path d={sparkPath(seed)} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function timelineData(seed){
  const states = ['ok','ok','ok','delay','ok','ok','fail','ok'];
  return Array.from({length:24},(_,i)=> states[(i+seed)%states.length]);
}

];

function StatusDot({ s }){ return <span className={`status-dot ${s}`} />; }
function StatusBadge({ s }){
  const map = { ok:['ok','정상'], delay:['warn','지연'], fail:['fail','실패'] };
  const [cls,label] = map[s] || ['ok','정상'];
  return <span className={`badge ${cls}`}><StatusDot s={s}/> {label}</span>;
}

function MappingDrawer({ open, initial, onClose, onSave }){
  const [form, setForm] = useState(initial || { category:'', market:MARKETS[0], code:'', option:'' });
  useEffect(()=>{ setForm(initial || { category:'', market:MARKETS[0], code:'', option:'' }); }, [initial, open]);

  const set = (k,v)=> setForm(f=>({...f, [k]:v}));
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>

          <div className="modal-title">{initial ? '매핑 규칙 수정' : '신규 매핑 추가'}</div>

        <div className="field"><label>자사 카테고리</label><input value={form.category} onChange={e=>set('category',e.target.value)} placeholder="예: 여성 아우터 / 자켓" /></div>
        <div className="field"><label>연동 마켓</label>
          <select value={form.market} onChange={e=>set('market',e.target.value)}>

function OrderDetailModal({ order, onClose }){
  if(!order) return null;
  const steps = ['수집','매핑 변환','반영 완료'];
  const idx = order.status==='신규'?0: order.status==='처리중'?1: order.status==='실패'?1:2;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">주문 상세 — {order.no}</div>
          <button className="modal-close" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="stepper">
          {steps.map((s,i)=>(
            <React.Fragment key={s}>
              <div className={`step-dot ${i<=idx?'done':''}`}>{i+1}</div>
              {i<steps.length-1 && <div className={`step-line ${i<idx?'done':''}`}></div>}
            </React.Fragment>
          ))}
        </div>
        <div className="step-labels">{steps.map(s=> <span key={s}>{s}</span>)}</div>
        <div style={{marginTop:16}}>
          <div className="detail-row"><span className="detail-label">마켓</span><span className="detail-value">{order.market}</span></div>
          <div className="detail-row"><span className="detail-label">상품명</span><span className="detail-value">{order.item}</span></div>
          <div className="detail-row"><span className="detail-label">결제 금액</span><span className="detail-value">{order.amount}</span></div>
          <div className="detail-row"><span className="detail-label">수집 시각</span><span className="detail-value">{order.at}</span></div>
          <div className="detail-row"><span className="detail-label">중복 수집 감지</span><span className="detail-value">{order.dup ? '병합됨 (멱등키 일치)' : '없음'}</span></div>
        </div>
        <div className="modal-foot">
          <button className="btn-secondary" onClick={onClose}>닫기</button>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ open, title, desc, onCancel, onConfirm, loading }){
  if(!open) return null;
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="modal" style={{width:'min(400px,92vw)'}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title" style={{marginBottom:10}}>{title}</div>
        <div style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.5,marginBottom:18}}>{desc}</div>
        <div className="modal-foot">
          <button className="btn-secondary" onClick={onCancel}>취소</button>
          <button className="btn-primary" onClick={onConfirm}>{loading ? <span className="loading-spin"></span> : '확인'}</button>
        </div>
      </div>

                <div>
                  <div className="page-title">주문 동기화 모니터</div>
                  <div className="page-meta">마켓별 신규 주문을 자사 주문 형식으로 변환하고 처리 상태를 추적합니다</div>
                </div>
                <button className="btn-primary" onClick={fetchNewOrders} disabled={fetchingOrders}>
                  {fetchingOrders ? <React.Fragment><span className="loading-spin"></span>수집 중…</React.Fragment> : <React.Fragment><i className="ti ti-download"></i>지금 동기화</React.Fragment>}
                </button>
              </div>
            </div>
            <div className="tab-bar" data-tabs>
              {['전체','신규','처리중','완료','실패'].map(t=>(
                <button key={t} className={`tab ${orderTab===t?'active':''}`} onClick={()=>setOrderTab(t)}>{t}</button>
              ))}
            </div>
            <div className="toolbar">
              <input className="search-input" placeholder="주문번호 또는 상품명 검색" value={orderSearch} onChange={e=>setOrderSearch(e.target.value)} />
            </div>
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th>주문번호</th><th>마켓</th><th>상품명</th><th>금액</th><th>상태</th><th>수집 시각</th><th></th></tr></thead>
                <tbody>
                  {filteredOrders.map(o=>(
                    <tr key={o.id}>
                      <td>{o.no}{o.dup && <span className="badge info" style={{marginLeft:6}}>중복 병합</span>}</td>
                      <td>{o.market}</td>
                      <td>{o.item}</td>
                      <td>{o.amount}</td>
                      <td>
                        {o.status==='완료' && <span className="badge ok">완료</span>}
                        {o.status==='처리중' && <span className="badge warn">처리중</span>}
                        {o.status==='신규' && <span className="badge info">신규</span>}
                        {o.status==='실패' && <span className="badge fail">실패</span>}
                      </td>
                      <td>{o.at}</td>
                      <td><button className="row-action" onClick={()=>setOrderDetail(o)}>상세보기</button></td>
                    </tr>
                  ))}
                  {filteredOrders.length===0 && <tr><td colSpan="7" style={{textAlign:'center',color:'var(--text-tertiary)',padding:'28px 0'}}>해당 조건의 주문이 없습니다</td></tr>}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

        {screen==='retry' && (
          <React.Fragment>
            <div className="page-header">
              <div className="page-title-row">
                <div>
                  <div className="page-title">오류 처리 및 재시도</div>
                  <div className="page-meta">연동 실패 건을 자동 재시도하고, 최종 실패 건은 수동으로 일괄 재처리합니다</div>
                </div>
              </div>
            </div>
            <div className="toolbar">
              {reasonCats.map(c=>(
                <button key={c} className={`filter-chip ${retryFilter===c?'active':''}`} onClick={()=>setRetryFilter(c)}>{c}</button>
              ))}
            </div>
            {selectedRetry.length>0 && (
              <div className="bulk-bar">
                <span>{selectedRetry.length}건 선택됨</span>
                <button className="btn-primary" onClick={()=>setBulkConfirm(true)}><i className="ti ti-refresh-alert"></i>일괄 재처리</button>
              </div>
            )}
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th></th><th>마켓</th><th>대상</th><th>실패 사유</th><th>재시도</th><th>다음 재시도</th><th>상태</th><th></th></tr></thead>
                <tbody>
                  {filteredRetry.map(r=>(
                    <tr key={r.id}>
                      <td><input type="checkbox" className="checkbox" checked={selectedRetry.includes(r.id)} onChange={()=>toggleRetrySelect(r.id)} /></td>
                      <td>{r.market}</td>
                      <td>{r.target}</td>
                      <td>{r.reason}</td>
                      <td>{r.count} / {r.max}회</td>
                      <td>{r.next}</td>
                      <td>
                        {r.status==='pending' && <span className="badge fail">대기</span>}
                        {r.status==='retrying' && <span className="badge warn"><span className="loading-spin" style={{borderTopColor:'var(--warn)',borderColor:'rgba(201,138,26,.3)'}}></span> 재시도중</span>}
                        {r.status==='success' && <span className="badge ok">완료</span>}
                      </td>
                      <td>{r.status==='pending' && <button className="row-action" onClick={()=>retryOne(r.id)}>지금 재시도</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="panel" style={{marginTop:18}}>
              <div className="panel-title"><i className="ti ti-clock-bolt"></i>자동 재시도 정책 (지수 백오프)</div>
              <div className="policy-strip">
                <div className="policy-step">1차: 1분 후</div><span className="policy-arrow">→</span>
                <div className="policy-step">2차: 5분 후</div><span className="policy-arrow">→</span>
                <div className="policy-step">3차: 30분 후</div><span className="policy-arrow">→</span>
                <div className="policy-step">4차: 2시간 후</div><span className="policy-arrow">→</span>
                <div className="policy-step">최대 5회 — 초과 시 수동 재처리 큐로 이동</div>
              </div>
            </div>
          </React.Fragment>
        )}
      </main>

      <MarketDetailModal market={marketModal} onClose={()=>setMarketModal(null)} />
      <OrderDetailModal order={orderDetail} onClose={()=>setOrderDetail(null)} />
      <MappingDrawer open={drawerOpen} initial={editingMapping} onClose={()=>{ setDrawerOpen(false); setEditingMapping(null); }} onSave={saveMapping} />
      <ConfirmModal open={bulkConfirm} loading={bulkLoading} title="일괄 재처리" desc={`선택한 ${selectedRetry.length}건을 지금 재처리하시겠습니까?`} onCancel={()=>setBulkConfirm(false)} onConfirm={runBulkRetry} />

      {syncModal && (
        <div className="overlay" onClick={()=>!syncLoading && setSyncModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">지금 동기화 실행</div><button className="modal-close" onClick={()=>setSyncModal(false)}><i className="ti ti-x"></i></button></div>
            <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>동기화할 마켓을 선택합니다</div>
            {MARKETS.map(m=>(
              <label key={m} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',fontSize:13}}>
                <input type="checkbox" className="checkbox" checked={syncPick.includes(m)} onChange={()=> setSyncPick(p=> p.includes(m) ? p.filter(x=>x!==m) : [...p,m])} />
                {m}
              </label>
            ))}
            <div className="modal-foot">
              <button className="btn-secondary" onClick={()=>setSyncModal(false)}>취소</button>
              <button className="btn-primary" onClick={runSync} disabled={syncLoading}>{syncLoading ? <span className="loading-spin"></span> : '동기화 실행'}</button>
            </div>
          </div>
        </div>
      )}

      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
