<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멀티마켓 확장 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#ffffff;
  --surface:#e5e5e7;
  --card:#ffffff;
  --primary:#5683da;
  --primary-dark:#3f68bd;
  --accent:#ff8964;
  --text:#090a0c;
  --text-secondary:#95979e;
  --text-tertiary:#a9a9aa;
  --border:#d1d1d1;
  --divider:#e5e5e7;
  --linen:#f6f6f6;
  --success:#1f9d6f;
  --warn:#c98a1a;
  --danger:#d64545;
  --radius-card:12px;
  --radius-pill:9999px;
  --radius-input:4px;
  --shadow-sm:0 4px 6px 0 rgba(0,0,0,.06);
  --shadow-md:0 4px 16px 0 rgba(0,0,0,.10);
  --topbar-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  width:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
#root{width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(86,131,218,.35)}70%{box-shadow:0 0 0 7px rgba(86,131,218,0)}100%{box-shadow:0 0 0 0 rgba(86,131,218,0)}}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spinRing{to{transform:rotate(360deg)}}
@keyframes beamFlow{0%{background-position:0 0}100%{background-position:0 240px}}

.page{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* top nav */
.topnav{width:100%;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--divider);background:#fff;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.topnav-actions{display:flex;align-items:center;gap:10px}
.pill-btn{border-radius:var(--radius-pill);padding:9px 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill-btn.ghost{border:1px solid var(--text);color:var(--text)}
.pill-btn.ghost:hover{background:var(--linen)}
.pill-btn.solid{background:var(--primary);color:#fff}
.pill-btn.solid:hover{background:var(--primary-dark);transform:scale(1.04)}

/* hero band */
.hero-band{width:100%;padding:26px 32px;background:linear-gradient(180deg,var(--linen) 0%,#fff 100%);border-bottom:1px solid var(--divider)}
.hero-inner{max-width:1240px;margin:0 auto}
.hero-title{font-size:42px;font-weight:700;letter-spacing:-1.4px;margin-bottom:6px}
.hero-sub{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-chip{background:#fff;border:1px solid var(--border);border-radius:var(--radius-pill);padding:9px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;animation:fadeInUp .4s ease both}
.hero-chip b{font-size:15px;color:var(--primary)}

/* sub nav (feature tabs) */
.subnav{width:100%;background:#fff;border-bottom:1px solid var(--divider);padding:0 32px;display:flex;gap:4px;overflow-x:auto}
.subnav-tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap}
.subnav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.content{flex:1;width:100%;padding:26px 32px 60px}
.content-inner{max-width:1240px;margin:0 auto}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.section-title{font-size:19px;font-weight:700}
.section-desc{font-size:13px;color:var(--text-secondary);margin-top:3px}

/* kanban board */
.board-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.column{flex:0 0 272px;background:var(--linen);border-radius:var(--radius-card);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px;font-size:13px;font-weight:700}
.count{background:#fff;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:11px;font-weight:700;padding:2px 9px;color:var(--text-secondary)}
.card{background:#fff;border:1px solid var(--divider);border-radius:var(--radius-card);padding:13px 14px;cursor:grab;transition:transform .15s,box-shadow .15s;animation:fadeInUp .35s ease both}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card.dragging{opacity:.45}
.card-title{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.4}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:10px;font-weight:700;border-radius:var(--radius-pill);padding:3px 9px}
.tag.iris{background:rgba(86,131,218,.12);color:var(--primary)}
.tag.ember{background:rgba(255,137,100,.15);color:#c8582f}
.tag.ash{background:var(--linen);color:var(--text-secondary);border:1px solid var(--border)}
.avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700}
.card-foot{display:flex;align-items:center;justify-content:space-between}
.priority-dot{width:7px;height:7px;border-radius:50%}
.priority-dot.high{background:var(--danger)}
.priority-dot.mid{background:var(--warn)}
.priority-dot.low{background:var(--success)}
.card-advance{font-size:11px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:3px}

/* matrix-side */
.matrix-panel{background:#fff;border:1px solid var(--divider);border-radius:var(--radius-card);padding:16px}
.matrix-panel h3{font-size:14px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:7px}
.matrix-panel .hint{font-size:11px;color:var(--text-secondary);margin-bottom:12px}
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:150px;margin-bottom:10px}
.matrix-cell{border-radius:8px;background:var(--linen);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;position:relative}
.matrix-cell b{font-size:20px}
.matrix-cell span{font-size:10px;color:var(--text-secondary)}
.matrix-cell.hot{background:rgba(255,137,100,.16)}
.matrix-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--text-tertiary);margin-bottom:14px}
.matrix-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--divider);font-size:12px}
.matrix-list-item:last-child{border-bottom:none}

/* generic table / list */
.data-table-wrap{overflow-x:auto;border:1px solid var(--divider);border-radius:var(--radius-card)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{text-align:left;background:var(--linen);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;border-bottom:1px solid var(--divider)}
.data-table tbody td{padding:13px 14px;border-bottom:1px solid var(--divider)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--linen)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-pill)}
.badge.ok{background:rgba(31,157,111,.12);color:var(--success)}
.badge.warn{background:rgba(201,138,26,.14);color:var(--warn)}
.badge.fail{background:rgba(214,69,69,.12);color:var(--danger)}
.badge.info{background:rgba(86,131,218,.12);color:var(--primary)}
.row-action{color:var(--primary);font-weight:700;font-size:12px}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:var(--radius-input);padding:10px 13px;font-size:13px}
.filter-chip{border:1px solid var(--border);border-radius:var(--radius-pill);padding:7px 15px;font-size:12px;font-weight:600;color:var(--text-secondary)}
.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text)}

/* wizard */
.wizard-steps{display:flex;align-items:center;margin-bottom:26px}
.wizard-dot{width:30px;height:30px;border-radius:50%;background:var(--linen);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)}
.wizard-dot.done{background:var(--success);color:#fff;border-color:var(--success)}
.wizard-dot.active{background:var(--primary);color:#fff;border-color:var(--primary);animation:pulseGlow 1.8s infinite}
.wizard-line{flex:1;height:2px;background:var(--divider)}
.wizard-line.done{background:var(--success)}
.wizard-card{background:#fff;border:1px solid var(--divider);border-radius:var(--radius-card);padding:26px;max-width:560px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:var(--radius-input);padding:10px 12px;font-size:13px}
.wizard-foot{display:flex;justify-content:space-between;margin-top:20px}
.test-result{margin-top:14px;padding:12px 14px;border-radius:8px;background:rgba(31,157,111,.08);border:1px solid rgba(31,157,111,.3);font-size:12px;color:var(--success);display:flex;align-items:center;gap:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(9,10,12,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp .18s ease both}
.modal{background:#fff;border-radius:var(--radius-card);width:min(520px,92vw);max-height:86vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-md)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--linen)}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-secondary)}
.detail-value{font-weight:600}
.code-block{background:#0e0e10;color:#d1d1d1;font-family:ui-monospace,monospace;font-size:11px;border-radius:8px;padding:12px;line-height:1.6;overflow-x:auto;margin-top:10px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn-primary{background:var(--primary);color:#fff;padding:10px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:700}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:700}
.btn-secondary:hover{background:var(--linen)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.24);z-index:200;animation:toastPop .26s ease both;display:flex;align-items:center;gap:8px}
.loading-spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spinRing .7s linear infinite;display:inline-block}
.beam{height:3px;width:100%;background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary));background-size:200% 100%;animation:beamFlow 3.5s linear infinite;border-radius:3px;margin-bottom:18px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const MARKETS = ['지그재그', '에이블리', '무신사 스토어', 'W컨셉', '브랜디'];

const INITIAL_BOARD = {
  '대기': [
    { id:'k1', title:'브랜디 — 상품 등록 인증 오류 3건', market:'브랜디', priority:'high', assignee:'김민수' },
    { id:'k2', title:'무신사 스토어 — 재고 반영 지연', market:'무신사 스토어', priority:'mid', assignee:'이지은' },
    { id:'k3', title:'W컨셉 — 주문 상태 매핑 오류', market:'W컨셉', priority:'mid', assignee:'박서준' },
  ],
  '재시도중': [
    { id:'k4', title:'에이블리 — 배송 정보 전송 실패', market:'에이블리', priority:'high', assignee:'김민수' },
    { id:'k5', title:'지그재그 — 옵션 매핑 불일치', market:'지그재그', priority:'low', assignee:'이지은' },
  ],
  '완료': [
    { id:'k6', title:'에이블리 — 토큰 만료 재발급', market:'에이블리', priority:'low', assignee:'박서준' },
    { id:'k7', title:'지그재그 — 카테고리 코드 갱신', market:'지그재그', priority:'low', assignee:'김민수' },
    { id:'k8', title:'무신사 스토어 — 정산 항목 동기화', market:'무신사 스토어', priority:'low', assignee:'이지은' },
  ],
  '보류': [
    { id:'k9', title:'브랜디 — API 스펙 변경 대응 필요', market:'브랜디', priority:'mid', assignee:'박서준' },
  ],
};
const STAGE_ORDER = ['대기','재시도중','완료','보류'];

const INITIAL_ACCOUNTS = [
  { id:'a1', market:'지그재그', type:'API Key', status:'ok', last:'09.01 09:10' },
  { id:'a2', market:'에이블리', type:'OAuth 2.0', status:'ok', last:'09.01 08:52' },
  { id:'a3', market:'무신사 스토어', type:'API Key', status:'warn', last:'08.29 21:04' },
  { id:'a4', market:'W컨셉', type:'OAuth 2.0', status:'ok', last:'08.31 17:40' },
  { id:'a5', market:'브랜디', type:'API Key', status:'fail', last:'08.27 11:02' },
];

const AUDIT_LOGS = [
  { id:'g1', market:'지그재그', endpoint:'/v2/products', code:200, ms:214, at:'09.01 11:42' },
  { id:'g2', market:'에이블리', endpoint:'/orders/collect', code:200, ms:340, at:'09.01 11:38' },
  { id:'g3', market:'브랜디', endpoint:'/products/register', code:401, ms:180, at:'09.01 11:20' },
  { id:'g4', market:'무신사 스토어', endpoint:'/inventory/sync', code:504, ms:5002, at:'09.01 10:58' },
  { id:'g5', market:'W컨셉', endpoint:'/orders/status', code:200, ms:266, at:'09.01 10:41' },
  { id:'g6', market:'지그재그', endpoint:'/shipping/update', code:200, ms:198, at:'09.01 10:12' },
  { id:'g7', market:'에이블리', endpoint:'/products/update', code:200, ms:301, at:'09.01 09:55' },
  { id:'g8', market:'브랜디', endpoint:'/products/register', code:401, ms:172, at:'09.01 09:40' },
];

function Toast({ text }){ if(!text) return null; return <div className="toast"><i className="ph ph-check-circle"></i>{text}</div>; }

function KanbanCard({ card, onDragStart, onAdvance }){
  const nextStage = STAGE_ORDER[STAGE_ORDER.indexOf(card.stage)+1];
  return (
    <div className="card" draggable onDragStart={(e)=>onDragStart(e, card)}>
      <div className="card-title">{card.title}</div>
      <div className="card-meta">
        <span className="tag iris">{card.market}</span>
        <span className="tag ember">{card.assignee}</span>
      </div>
      <div className="card-foot">
        <span style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--text-secondary)'}}>
          <span className={`priority-dot ${card.priority}`}></span>
          {card.priority==='high'?'긴급':card.priority==='mid'?'보통':'낮음'}
        </span>
        {nextStage && card.stage!=='완료' && (
          <button className="card-advance" onClick={()=>onAdvance(card, nextStage)}>{nextStage}로<i className="ph ph-arrow-right"></i></button>
        )}
      </div>
    </div>
  );
}

function AccountDetailModal({ account, onClose, onReissue, loadingId }){
  if(!account) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><div className="modal-title">{account.market} 인증 정보</div><button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button></div>
        <div className="detail-row"><span className="detail-label">인증 방식</span><span className="detail-value">{account.type}</span></div>
        <div className="detail-row"><span className="detail-label">키 (마스킹)</span><span className="detail-value">••••-••••-{account.id.toUpperCase()}9F2</span></div>
        <div className="detail-row"><span className="detail-label">Redis 캐시</span><span className="detail-value">적용 중 (TTL 55분)</span></div>
        <div className="detail-row"><span className="detail-label">최근 갱신</span><span className="detail-value">{account.last}</span></div>
        <div className="modal-foot">
          <button className="btn-secondary" onClick={onClose}>닫기</button>
          <button className="btn-primary" onClick={()=>onReissue(account.id)}>{loadingId===account.id ? <span className="loading-spin"></span> : '토큰 재발급'}</button>
        </div>
      </div>
    </div>
  );
}

function AuditDetailModal({ log, onClose }){
  if(!log) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><div className="modal-title">요청 상세</div><button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button></div>
        <div className="detail-row"><span className="detail-label">마켓</span><span className="detail-value">{log.market}</span></div>
        <div className="detail-row"><span className="detail-label">엔드포인트</span><span className="detail-value">{log.endpoint}</span></div>
        <div className="detail-row"><span className="detail-label">응답 코드</span><span className="detail-value">{log.code}</span></div>
        <div className="detail-row"><span className="detail-label">소요 시간</span><span className="detail-value">{log.ms}ms</span></div>
        <div className="detail-row"><span className="detail-label">요청 시각</span><span className="detail-value">{log.at}</span></div>
        <div className="code-block">{`POST ${log.endpoint} HTTP/1.1\nAuthorization: Bearer ••••••\nContent-Type: application/json\n\n→ ${log.code} ${log.code===200?'OK':log.code===401?'Unauthorized':'Gateway Timeout'} (${log.ms}ms)`}</div>
        <div className="modal-foot"><button className="btn-secondary" onClick={onClose}>닫기</button></div>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toast, setToast] = useState('');
  const showToast = (t)=>{ setToast(t); setTimeout(()=>setToast(''), 2600); };

  // board state
  const [board, setBoard] = useState(()=>{
    const b = {};
    STAGE_ORDER.forEach(s=> b[s] = INITIAL_BOARD[s].map(c=>({...c, stage:s})));
    return b;
  });
  const [dragCard, setDragCard] = useState(null);

  const moveCard = (card, toStage)=>{
    setBoard(b=>{
      const from = b[card.stage].filter(c=>c.id!==card.id);
      const to = [...b[toStage], {...card, stage:toStage}];
      return {...b, [card.stage]:from, [toStage]:to};
    });
    showToast(`${card.market} 항목이 ‘${toStage}’로 이동했습니다`);
  };

  // accounts state
  const [accounts, setAccounts] = useState(INITIAL_ACCOUNTS);
  const [accountModal, setAccountModal] = useState(null);
  const [reissueLoading, setReissueLoading] = useState(null);
  const reissueToken = (id)=>{
    setReissueLoading(id);
    setTimeout(()=>{
      setAccounts(as=> as.map(a=> a.id===id ? {...a, status:'ok', last:'방금'} : a));
      setReissueLoading(null);
      setAccountModal(null);
      showToast('토큰이 재발급됐습니다');
    }, 1100);
  };

  // wizard state
  const [wizStep, setWizStep] = useState(0);
  const [wizForm, setWizForm] = useState({ market:'', endpoint:'', auth:'API Key', template:'' });
  const [wizTesting, setWizTesting] = useState(false);
  const [wizTested, setWizTested] = useState(false);
  const WIZ_STEPS = ['마켓 선택','인증 정보','매핑 템플릿','테스트 호출'];
  const runWizTest = ()=>{
    setWizTesting(true);
    setTimeout(()=>{ setWizTesting(false); setWizTested(true); }, 1300);
  };

  // audit state
  const [auditMarket, setAuditMarket] = useState('전체');
  const [auditSearch, setAuditSearch] = useState('');
  const [auditDetail, setAuditDetail] = useState(null);
  const filteredLogs = useMemo(()=> AUDIT_LOGS.filter(l=>
    (auditMarket==='전체' || l.market===auditMarket) &&
    (l.endpoint.toLowerCase().includes(auditSearch.toLowerCase()) || l.market.includes(auditSearch))
  ), [auditMarket, auditSearch]);

  const NAV = [
    { key:'main', label:'실패 건 재처리 워크플로우 보드' },
    { key:'accounts', label:'마켓 계정 및 인증 토큰 관리' },
    { key:'onboarding', label:'신규 마켓 확장 마법사' },
    { key:'audit', label:'연동 감사 로그 및 이력 조회' },
  ];

  const totalCards = STAGE_ORDER.reduce((s,k)=> s+board[k].length, 0);

  return (
    <div className="page" data-archetype="kanban-board">
      <header className="topnav">
        <div className="logo"><div className="logo-mark">SH</div>SyncHub 확장 콘솔</div>
        <div className="topnav-actions">
          <button className="pill-btn ghost" onClick={()=>showToast('운영 가이드 문서를 열람합니다')}><i className="ph ph-book-open"></i>가이드</button>
          <button className="pill-btn solid" onClick={()=>setScreen('onboarding')}><i className="ph ph-plus"></i>마켓 추가</button>
        </div>
      </header>

      <div className="hero-band">
        <div className="hero-inner">
          <div className="hero-title">멀티마켓 확장 운영 플랫폼</div>
          <div className="hero-sub">신규 마켓이 추가돼도 기존 연동 로직 수정 없이 설정만으로 확장할 수 있는 통합 운영 콘솔입니다</div>
          <div className="hero-stats">
            <div className="hero-chip" style={{animationDelay:'0s'}}><b>{totalCards}</b>재처리 대상 항목</div>
            <div className="hero-chip" style={{animationDelay:'.06s'}}><b>5</b>연동 마켓</div>
            <div className="hero-chip" style={{animationDelay:'.12s'}}><b>12</b>감사 로그 필드</div>
            <div className="hero-chip" style={{animationDelay:'.18s'}}><b>4~6</b>마켓 확장 단계</div>
          </div>
        </div>
      </div>

      <nav className="subnav">
        {NAV.map(n=>(
          <button key={n.key} className={`subnav-tab ${screen===n.key?'active':''}`} onClick={()=>setScreen(n.key)}>{n.label}</button>
        ))}
      </nav>

      <main className="content"><div className="content-inner">

        {screen==='main' && (
          <React.Fragment>
            <div className="section-head">
              <div><div className="section-title">실패 건 재처리 워크플로우 보드</div><div className="section-desc">카드를 드래그하거나 ‘다음 단계로’ 버튼을 눌러 상태를 전환합니다</div></div>
            </div>
            <div className="board-layout">
              <div className="board" onDragOver={e=>e.preventDefault()}>
                {STAGE_ORDER.map(stage=>(
                  <section key={stage} className="column"
                    onDragOver={e=>e.preventDefault()}
                    onDrop={()=>{ if(dragCard && dragCard.stage!==stage){ moveCard(dragCard, stage); } setDragCard(null); }}>
                    <div className="col-header">{stage} <span className="count">{board[stage].length}</span></div>
                    {board[stage].map(card=>(
                      <KanbanCard key={card.id} card={card} onDragStart={(e,c)=>setDragCard(c)} onAdvance={moveCard} />
                    ))}
                    {board[stage].length===0 && <div style={{fontSize:11,color:'var(--text-tertiary)',padding:'10px 6px'}}>항목 없음</div>}
                  </section>
                ))}
              </div>
              <div className="matrix-panel" style={{borderRadius:'12px'}}>
                <h3><i className="ph ph-squares-four"></i>우선순위 매트릭스</h3>
                <div className="hint">재고 임박도 × 주문 금액 기준 대응 순서</div>
                <div className="matrix-grid">
                  <div className="matrix-cell hot"><b>2</b><span>고임박·고액</span></div>
                  <div className="matrix-cell"><b>3</b><span>저임박·고액</span></div>
                  <div className="matrix-cell"><b>1</b><span>고임박·저액</span></div>
                  <div className="matrix-cell"><b>3</b><span>저임박·저액</span></div>
                </div>
                <div className="matrix-axis"><span>← 저액</span><span>주문 금액</span><span>고액 →</span></div>
                <div className="matrix-list-item"><span>브랜디 · 인증 오류</span><span className="tag ember">고임박·고액</span></div>
                <div className="matrix-list-item"><span>에이블리 · 배송 실패</span><span className="tag ash">저임박·고액</span></div>
                <div className="matrix-list-item"><span>지그재그 · 매핑 오류</span><span className="tag ash">고임박·저액</span></div>
              </div>
            </div>
          </React.Fragment>
        )}

        {screen==='accounts' && (
          <React.Fragment>
            <div className="section-head">
              <div><div className="section-title">마켓 계정 및 인증 토큰 관리</div><div className="section-desc">마켓별 API 키·OAuth 토큰을 안전하게 저장하고 만료 전 자동 갱신합니다</div></div>
            </div>
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th>마켓</th><th>인증 방식</th><th>상태</th><th>최근 갱신</th><th></th></tr></thead>
                <tbody>
                  {accounts.map(a=>(
                    <tr key={a.id}>
                      <td>{a.market}</td>
                      <td>{a.type}</td>
                      <td>
                        {a.status==='ok' && <span className="badge ok">정상</span>}
                        {a.status==='warn' && <span className="badge warn">만료임박</span>}
                        {a.status==='fail' && <span className="badge fail">만료</span>}
                      </td>
                      <td>{a.last}</td>
                      <td><button className="row-action" onClick={()=>setAccountModal(a)}>상세보기</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

        {screen==='onboarding' && (
          <React.Fragment>
            <div className="section-head">
              <div><div className="section-title">신규 마켓 확장 마법사</div><div className="section-desc">기존 코드 변경 없이 설정만으로 새로운 오픈마켓을 추가합니다</div></div>
            </div>
            <div className="wizard-steps">
              {WIZ_STEPS.map((s,i)=>(
                <React.Fragment key={s}>
                  <div className={`wizard-dot ${i<wizStep?'done':i===wizStep?'active':''}`}>{i<wizStep? <i className="ph ph-check"></i> : i+1}</div>
                  {i<WIZ_STEPS.length-1 && <div className={`wizard-line ${i<wizStep?'done':''}`}></div>}
                </React.Fragment>
              ))}
            </div>
            <div className="wizard-card">
              {wizStep===0 && (
                <React.Fragment>
                  <div className="field"><label>추가할 마켓</label>
                    <select value={wizForm.market} onChange={e=>setWizForm(f=>({...f,market:e.target.value}))}>
                      <option value="">선택하세요</option>
                      <option>퀸잇</option><option>지그재그 여성전문관</option><option>29CM</option>
                    </select>
                  </div>
                  <div className="field"><label>API 엔드포인트</label><input value={wizForm.endpoint} onChange={e=>setWizForm(f=>({...f,endpoint:e.target.value}))} placeholder="https://openapi.example-market.com" /></div>
                </React.Fragment>
              )}
              {wizStep===1 && (
                <React.Fragment>
                  <div className="field"><label>인증 방식</label>
                    <select value={wizForm.auth} onChange={e=>setWizForm(f=>({...f,auth:e.target.value}))}>
                      <option>API Key</option><option>OAuth 2.0</option><option>서명 방식 (HMAC)</option>
                    </select>
                  </div>
                  <div className="field"><label>발급받은 키</label><input placeholder="키를 입력합니다 (암호화 저장)" /></div>
                </React.Fragment>
              )}
              {wizStep===2 && (
                <React.Fragment>
                  <div className="field"><label>매핑 템플릿</label>
                    <select value={wizForm.template} onChange={e=>setWizForm(f=>({...f,template:e.target.value}))}>
                      <option value="">선택하세요</option>
                      <option>패션 전문몰 표준 템플릿</option><option>신규 템플릿 직접 구성</option>
                    </select>
                  </div>
                  <div style={{fontSize:12,color:'var(--text-secondary)'}}>공통 어댑터 인터페이스(인증/상품/주문/배송)를 기준으로 매핑 초안이 자동 생성됩니다</div>
                </React.Fragment>
              )}
              {wizStep===3 && (
                <React.Fragment>
                  <div style={{fontSize:13,marginBottom:10}}>등록 전 연동 가능 여부를 테스트 호출로 확인합니다</div>
                  {wizTesting && <div className="beam"></div>}
                  <button className="btn-secondary" onClick={runWizTest} disabled={wizTesting}>{wizTesting? <React.Fragment><span className="loading-spin"></span> 호출 중…</React.Fragment> : '테스트 호출 실행'}</button>
                  {wizTested && <div className="test-result"><i className="ph ph-check-circle"></i>테스트 호출 성공 — 인증/상품 조회 정상 응답 확인</div>}
                </React.Fragment>
              )}
              <div className="wizard-foot">
                <button className="btn-secondary" onClick={()=> setWizStep(s=>Math.max(0,s-1))} disabled={wizStep===0}>이전</button>
                {wizStep<3 ? (
                  <button className="btn-primary" onClick={()=>setWizStep(s=>s+1)}>다음</button>
                ) : (
                  <button className="btn-primary" disabled={!wizTested} onClick={()=>{ showToast('신규 마켓이 등록됐습니다'); setWizStep(0); setWizTested(false); setWizForm({market:'',endpoint:'',auth:'API Key',template:''}); }}>등록 완료</button>
                )}
              </div>
            </div>
          </React.Fragment>
        )}

        {screen==='audit' && (
          <React.Fragment>
            <div className="section-head">
              <div><div className="section-title">연동 감사 로그 및 이력 조회</div><div className="section-desc">API 요청/응답 이력을 마켓·기간·상태별로 조회합니다</div></div>
            </div>
            <div className="toolbar">
              <input className="search-input" placeholder="엔드포인트 또는 마켓 검색" value={auditSearch} onChange={e=>setAuditSearch(e.target.value)} />
              {['전체', ...MARKETS].map(m=>(
                <button key={m} className={`filter-chip ${auditMarket===m?'active':''}`} onClick={()=>setAuditMarket(m)}>{m}</button>
              ))}
            </div>
            <div className="data-table-wrap">
              <table className="data-table">
                <thead><tr><th>마켓</th><th>엔드포인트</th><th>응답 코드</th><th>소요 시간</th><th>요청 시각</th><th></th></tr></thead>
                <tbody>
                  {filteredLogs.map(l=>(
                    <tr key={l.id}>
                      <td>{l.market}</td>
                      <td>{l.endpoint}</td>
                      <td>{l.code===200 ? <span className="badge ok">200</span> : l.code===401 ? <span className="badge fail">401</span> : <span className="badge warn">{l.code}</span>}</td>
                      <td>{l.ms}ms</td>
                      <td>{l.at}</td>
                      <td><button className="row-action" onClick={()=>setAuditDetail(l)}>원문 보기</button></td>
                    </tr>
                  ))}
                  {filteredLogs.length===0 && <tr><td colSpan="6" style={{textAlign:'center',color:'var(--text-tertiary)',padding:'26px 0'}}>조건에 맞는 로그가 없습니다</td></tr>}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

      </div></main>

      <AccountDetailModal account={accountModal} onClose={()=>setAccountModal(null)} onReissue={reissueToken} loadingId={reissueLoading} />
      <AuditDetailModal log={auditDetail} onClose={()=>setAuditDetail(null)} />
      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
