<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 영상 자동 생성 스튜디오 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --parchment:#f6f3f1; --ink:#242424; --ash:#cecac8; --lake:#2b59d1;
  --periwinkle:#cfdaf5; --graphite:#4e4d4d; --smoke:#797776;
  --coral:#ff9473; --sky:#a0b5eb; --mint:#a7fccd; --gold:#ecda98;
  --r-card:22px; --r-lg:40px; --r-pill:100px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;background:var(--parchment);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--ash);border-radius:8px;}
a{color:inherit;text-decoration:none;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(43,89,209,.45);}70%{box-shadow:0 0 0 9px rgba(43,89,209,0);}100%{box-shadow:0 0 0 0 rgba(43,89,209,0);}}
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
@keyframes progressFill{from{width:0%;}to{width:var(--pw);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(12px,-10px) scale(1.04);}}

.card-hover{transition:transform .16s ease,border-color .16s ease;}
.card-hover:hover{transform:translateY(-3px);border-color:var(--ink);}
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
.column{min-width:270px;width:270px;flex-shrink:0;background:#efece9;border-radius:20px;padding:14px 12px;}
.col-header{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;}
.col-body{display:flex;flex-direction:column;gap:10px;}
.count{font-size:12px;font-weight:700;background:var(--parchment);border:1px solid var(--ash);border-radius:100px;padding:2px 9px;}
.badge{font-size:11px;font-weight:700;color:#9c3b2e;display:inline-flex;align-items:center;gap:4px;}
.card-meta{display:flex;justify-content:space-between;align-items:center;}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.tab-btn{transition:background .14s ease,color .14s ease;}
.pill-btn{transition:opacity .14s ease,transform .1s ease;}
.pill-btn:active{transform:scale(.97);}
.pill-btn:hover{opacity:.86;}
.skeleton-bar{background:linear-gradient(90deg,var(--ash) 25%,#e4e1de 37%,var(--ash) 63%);background-size:300px 100%;animation:shimmer 1.5s infinite linear;}
.node-line{stroke:var(--ash);stroke-width:1.5;fill:none;}
</style>
</head>
<body data-archetype="kanban-board">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

/* ---------- mock data ---------- */
const STAGES = [
  {id:'parsing', label:'파싱', color:'#797776'},
  {id:'analysis', label:'AI 분석', color:'#2b59d1'},
  {id:'script', label:'대본·스토리보드', color:'#2b59d1'},
  {id:'assets', label:'에셋 생성', color:'#ff9473'},
  {id:'render', label:'렌더링', color:'#a0b5eb'},
  {id:'done', label:'완료', color:'#3d9a5c'},
];

const INITIAL_JOBS = [
  {id:'j1', title:'2026년 3분기 산업안전 보고서.pdf', level:'General', len:'30초', stage:'done', progress:100, owner:'JK', updated:'3분 전', fail:false},
  {id:'j2', title:'신규 설비 도입 제안서.pdf', level:'Expert', len:'60초', stage:'render', progress:82, owner:'MH', updated:'방금', fail:false},
  {id:'j3', title:'품질관리 프로세스 개정안.pdf', level:'General', len:'20초', stage:'render', progress:44, owner:'SY', updated:'1분 전', fail:false},
  {id:'j4', title:'분기별 매출 실적 브리핑.pdf', level:'Expert', len:'30초', stage:'assets', progress:61, owner:'JK', updated:'2분 전', fail:false},
  {id:'j5', title:'ESG 지속가능경영 보고서.pdf', level:'General', len:'30초', stage:'assets', progress:28, owner:'DW', updated:'5분 전', fail:true, failReason:'Kling API 응답 지연(타임아웃)', retries:2},
  {id:'j6', title:'신제품 기술 백서.pdf', level:'Expert', len:'60초', stage:'script', progress:52, owner:'MH', updated:'6분 전', fail:false},
  {id:'j7', title:'조직 개편 안내 자료.pdf', level:'General', len:'20초', stage:'analysis', progress:35, owner:'SY', updated:'8분 전', fail:false},
  {id:'j8', title:'해외법인 감사 보고서.pdf', level:'Expert', len:'30초', stage:'parsing', progress:12, owner:'DW', updated:'방금', fail:false},
  {id:'j9', title:'채용 프로세스 가이드.pdf', level:'General', len:'20초', stage:'parsing', progress:5, owner:'JK', updated:'1분 전', fail:false},
];

const PROMPT_TEMPLATES = [
  {id:'p1', name:'대본 생성 — General', lang:'ko', version:'v4', updated:'2026-08-29', variables:['{{doc_title}}','{{key_points}}','{{tone}}']},
  {id:'p2', name:'대본 생성 — Expert', lang:'ko', version:'v3', updated:'2026-08-24', variables:['{{doc_title}}','{{technical_terms}}','{{depth}}']},
  {id:'p3', name:'스토리보드 씬 분할 규칙', lang:'ko', version:'v6', updated:'2026-08-30', variables:['{{scene_count}}','{{duration_sec}}']},
  {id:'p4', name:'이미지 프롬프트 — 도식형', lang:'ko', version:'v2', updated:'2026-08-20', variables:['{{concept}}','{{style_ref}}']},
];

const PROMPT_HISTORY = [
  {v:'v4', date:'2026-08-29', author:'JK', note:'문단 요약 지침 강화'},
  {v:'v3', date:'2026-08-22', author:'MH', note:'전문 용어 유지 규칙 추가'},
  {v:'v2', date:'2026-08-10', author:'JK', note:'초기 톤 가이드 작성'},
];

const SCENES = [
  {id:'s1', title:'씬 1 — 도입', img:'#a0b5eb', gen:'Veo', status:'완료', dur:'4.2초'},
  {id:'s2', title:'씬 2 — 핵심 지표', img:'#ff9473', gen:'Kling', status:'완료', dur:'5.8초'},
  {id:'s3', title:'씬 3 — 프로세스 흐름', img:'#a7fccd', gen:'Runway', status:'재생성 중', dur:'6.1초'},
  {id:'s4', title:'씬 4 — 결론 요약', img:'#ecda98', gen:'Veo', status:'대기', dur:'3.9초'},
];

/* ---------- shared bits ---------- */
function Toast({msg, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2600); return ()=>clearTimeout(t); },[]);
  return (
    <div style={{position:'fixed',bottom:28,left:'50%',background:'var(--ink)',color:'#fff',padding:'12px 22px',
      borderRadius:'var(--r-pill)',fontSize:14,fontWeight:500,zIndex:200,animation:'toastIn .25s ease',boxShadow:'0 8px 24px rgba(0,0,0,.18)'}}>
      {msg}
    </div>
  );
}

function TopNav({screen, setScreen, onNewJob}){
  const tabs = [
    {id:'main', label:'생성 파이프라인 진행 보드'},
    {id:'upload', label:'PDF 업로드 및 생성 옵션 설정'},
    {id:'prompt-editor', label:'프롬프트·생성 규칙 관리 에디터'},
    {id:'preview', label:'AI 에셋 생성 및 미디어 합성 미리보기'},
  ];
  return (
    <header style={{position:'sticky',top:0,zIndex:50,background:'var(--parchment)',borderBottom:'1px solid var(--ash)'}}>
      <div style={{maxWidth:1432,margin:'0 auto',padding:'18px 32px 0',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:34,height:34,borderRadius:10,background:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <i data-lucide="film" style={{width:18,height:18,color:'#fff'}}></i>
          </div>
          <div style={{fontSize:18,fontWeight:600,letterSpacing:'-0.02em'}}>Docu<span style={{color:'var(--lake)'}}>Motion</span> Studio</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--smoke)',fontWeight:500}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:'var(--lake)',animation:'pulseDot 1.8s infinite'}}></span>
            실시간 파이프라인 연결됨
          </span>
          <button className="pill-btn" onClick={onNewJob} style={{background:'var(--lake)',color:'#fff',border:'none',
            borderRadius:'var(--r-pill)',padding:'10px 20px',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
            <i data-lucide="plus" style={{width:15,height:15}}></i> 새 생성 요청
          </button>
        </div>
      </div>
      <nav style={{maxWidth:1432,margin:'0 auto',padding:'16px 32px 0',display:'flex',gap:6,overflowX:'auto'}}>
        {tabs.map(t=>(
          <button key={t.id} className="tab-btn" onClick={()=>setScreen(t.id)}
            style={{background: screen===t.id? 'var(--ink)':'transparent', color: screen===t.id?'#fff':'var(--graphite)',
              border:'1px solid ' + (screen===t.id?'var(--ink)':'var(--ash)'), borderRadius:'var(--r-pill)',
              padding:'9px 18px', fontSize:13, fontWeight:500, whiteSpace:'nowrap', marginBottom:14}}>
            {t.label}
          </button>
        ))}
      </nav>
    </header>
  );
}

function PipelineDiagram(){
  return (
    <svg viewBox="0 0 640 90" style={{width:'100%',maxWidth:640,display:'block'}}>
      <path className="node-line" d="M40,45 C120,45 120,20 200,20" />
      <path className="node-line" d="M40,45 C120,45 120,70 200,70" />
      <path className="node-line" d="M200,20 C280,20 280,45 360,45" />
      <path className="node-line" d="M200,70 C280,70 280,45 360,45" />
      <path className="node-line" d="M360,45 C440,45 440,20 520,20" />
      <path className="node-line" d="M360,45 C440,45 440,70 520,70" />
      <circle cx="40" cy="45" r="22" fill="var(--parchment)" stroke="var(--ash)" />
      <circle cx="360" cy="45" r="26" fill="var(--periwinkle)" stroke="var(--ash)" />
      <circle cx="520" cy="20" r="18" fill="var(--parchment)" stroke="var(--ash)" />
      <circle cx="520" cy="70" r="18" fill="var(--parchment)" stroke="var(--ash)" />
      <circle cx="200" cy="20" r="18" fill="var(--parchment)" stroke="var(--ash)" />
      <circle cx="200" cy="70" r="18" fill="var(--parchment)" stroke="var(--ash)" />
    </svg>
  );
}

/* ---------- main kanban board ---------- */
function JobDrawer({job, onClose, onRetry}){
  if(!job) return null;
  const logs = [
    {t:'00:00', e:'작업 생성 · 문서 업로드 완료'},
    {t:'00:04', e:'PDF 텍스트 파싱 · 페이지 ' + (8 + (job.title.length%6)) + '개 추출'},
    {t:'00:12', e:'LLM 분석 시작 · GPT-4.1 + Claude 교차 검증'},
    job.fail? {t:'00:41', e:'⚠ ' + job.failReason} : {t:'00:38', e:'대본·스토리보드 생성 완료'},
  ];
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(36,36,36,.28)',zIndex:100,display:'flex',justifyContent:'flex-end',animation:'fadeIn .18s ease'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:400,maxWidth:'92vw',height:'100%',background:'var(--parchment)',borderLeft:'1px solid var(--ash)',
        padding:'28px 26px',overflowY:'auto',animation:'slideInRight .22s ease'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
          <div>
            <div style={{fontSize:12,color:'var(--smoke)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>
              {STAGES.find(s=>s.id===job.stage)?.label}
            </div>
            <div style={{fontSize:20,fontWeight:600,lineHeight:1.3}}>{job.title}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none'}}><i data-lucide="x" style={{width:20,height:20}}></i></button>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:22,flexWrap:'wrap'}}>
          <span style={{fontSize:12,fontWeight:600,background:'var(--periwinkle)',padding:'6px 12px',borderRadius:'var(--r-pill)'}}>{job.level}</span>
          <span style={{fontSize:12,fontWeight:600,border:'1px solid var(--ash)',padding:'6px 12px',borderRadius:'var(--r-pill)'}}>{job.len}</span>
          <span style={{fontSize:12,fontWeight:600,border:'1px solid var(--ash)',padding:'6px 12px',borderRadius:'var(--r-pill)'}}>담당 {job.owner}</span>
        </div>
        <div style={{marginBottom:22}}>
          <div style={{height:8,background:'var(--ash)',borderRadius:6,overflow:'hidden'}}>
            <div style={{'--pw':job.progress+'%', width:job.progress+'%',height:'100%',background: job.fail? '#c4453c':'var(--lake)',animation:'progressFill .6s ease'}}></div>
          </div>
          <div style={{fontSize:12,color:'var(--smoke)',marginTop:6}}>전체 진행률 {job.progress}% · 다음 단계 예상 소요 약 {2+(job.progress%4)}분</div>
        </div>
        {job.fail && (
          <div className="card-alert" style={{background:'#fbe9e7',border:'1px solid #e8b3ab',borderRadius:14,padding:'14px 16px',marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:700,color:'#9c3b2e',marginBottom:4}}>단계 실패 — 재시도 {job.retries}회</div>
            <div style={{fontSize:13,color:'#7a3128',marginBottom:10}}>{job.failReason}</div>
            <button className="pill-btn" onClick={()=>onRetry(job.id)} style={{background:'#9c3b2e',color:'#fff',border:'none',
              borderRadius:'var(--r-pill)',padding:'8px 16px',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
              <i data-lucide="rotate-cw" style={{width:14,height:14}}></i> 이 단계 재시도
            </button>
          </div>
        )}
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--smoke)',marginBottom:10}}>처리 로그</div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {logs.map((l,i)=>(
            <div key={i} style={{display:'flex',gap:12,fontSize:13}}>
              <span style={{color:'var(--smoke)',fontVariantNumeric:'tabular-nums',minWidth:44}}>{l.t}</span>
              <span style={{color:'var(--graphite)'}}>{l.e}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function BoardScreen({jobs, setJobs, openJob, setOpenJob, filter, setFilter}){
  const filtered = filter==='all'? jobs : jobs.filter(j=>j.level===filter);
  return (
    <div style={{maxWidth:1432,margin:'0 auto',padding:'28px 32px 60px',animation:'fadeInUp .28s ease'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:22,flexWrap:'wrap',gap:16}}>
        <div>
          <h1 style={{fontSize:48,fontWeight:600,letterSpacing:'-0.02em',margin:'0 0 8px'}}>생성 파이프라인 진행 보드</h1>
          <p style={{fontSize:15,color:'var(--graphite)',margin:0,maxWidth:560,lineHeight:1.5}}>
            업로드된 PDF 한 건이 파싱부터 렌더링까지 6단계를 거치는 과정을 실시간으로 확인합니다. 카드를 클릭하면 처리 로그와 예상 소요 시간을 볼 수 있습니다.
          </p>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <i data-lucide="filter" style={{width:15,height:15,color:'var(--smoke)'}}></i>
          {['all','General','Expert'].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} className="tab-btn" style={{
              background: filter===f? 'var(--ink)':'transparent', color: filter===f?'#fff':'var(--graphite)',
              border:'1px solid '+(filter===f?'var(--ink)':'var(--ash)'), borderRadius:'var(--r-pill)', padding:'7px 14px', fontSize:12,fontWeight:600}}>
              {f==='all'?'전체':f}
            </button>
          ))}
        </div>
      </div>

      <div className="card-hero" style={{background:'var(--periwinkle)',borderRadius:'var(--r-lg)',padding:'26px 32px',marginBottom:28,display:'flex',
        alignItems:'center',gap:28,flexWrap:'wrap'}}>
        <PipelineDiagram/>
        <div style={{flex:1,minWidth:220}}>
          <div style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--graphite)',marginBottom:6}}>파이프라인 구조</div>
          <div style={{fontSize:14,color:'var(--graphite)',lineHeight:1.6}}>파싱 → LLM 분석·환각 검증 → 대본/스토리보드 → 이미지·영상·TTS 생성 → FFmpeg/Remotion 합성 → MP4 출력. 각 단계는 독립 Job으로 관리되어 실패 시 해당 단계만 재시도합니다.</div>
          <div className="col-count" style={{marginTop:12,display:'inline-flex',fontSize:12,fontWeight:700,background:'var(--parchment)',
            border:'1px solid var(--ash)',borderRadius:100,padding:'4px 12px'}}>보드 전체 {jobs.length}건 진행 중</div>
        </div>
      </div>

      <div className="board">
        {STAGES.map(stage=>{
          const cards = filtered.filter(j=>j.stage===stage.id);
          return (
            <section key={stage.id} className="column">
              <div className="col-header">
                <span style={{fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
                  <span style={{width:8,height:8,borderRadius:'50%',background:stage.color}}></span>
                  {stage.label}
                </span>
                <span className="count">{cards.length}</span>
              </div>
              <div className="col-body">
                {cards.map(job=>(
                  <div key={job.id} className="card card-hover" onClick={()=>setOpenJob(job)} style={{background:'var(--parchment)',
                    border:'1px solid '+(job.fail?'#e8b3ab':'var(--ash)'),borderRadius:'var(--r-card)',padding:'14px 14px',cursor:'pointer'}}>
                    <div className="card-title" style={{fontSize:13,fontWeight:600,lineHeight:1.4,marginBottom:10,
                      overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{job.title}</div>
                    <div style={{height:5,background:'var(--ash)',borderRadius:4,overflow:'hidden',marginBottom:10}}>
                      <div style={{'--pw':job.progress+'%',width:job.progress+'%',height:'100%',background:job.fail?'#c4453c':stage.color,animation:'progressFill .6s ease'}}></div>
                    </div>
                    <div className="card-meta">
                      <div style={{display:'flex',gap:5}}>
                        <span className="tag" style={{fontSize:10,fontWeight:700,background:'var(--periwinkle)',padding:'3px 8px',borderRadius:'var(--r-pill)'}}>{job.level}</span>
                        <span className="tag" style={{fontSize:10,fontWeight:700,border:'1px solid var(--ash)',padding:'3px 8px',borderRadius:'var(--r-pill)'}}>{job.len}</span>
                      </div>
                      <span className="avatar">{job.owner}</span>
                    </div>
                    {job.fail && <div className="badge" style={{marginTop:8}}>
                      <i data-lucide="alert-triangle" style={{width:12,height:12}}></i> 재시도 {job.retries}회 필요
                    </div>}
                  </div>
                ))}
                {cards.length===0 && <div style={{fontSize:12,color:'var(--smoke)',padding:'18px 8px',textAlign:'center'}}>대기 중인 항목 없음</div>}
              </div>
            </section>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- upload screen ---------- */
function UploadScreen({onCreate}){
  const [level, setLevel] = useState('General');
  const [len, setLen] = useState('30초');
  const [dragOver, setDragOver] = useState(false);
  const [fileName, setFileName] = useState(null);
  const [pages, setPages] = useState(null);

  function simulateDrop(){
    setFileName('2026년_4분기_설비투자_계획.pdf');
    setPages(14);
  }

  return (
    <div style={{maxWidth:920,margin:'0 auto',padding:'40px 32px 80px',animation:'fadeInUp .28s ease'}}>
      <h1 style={{fontSize:44,fontWeight:600,letterSpacing:'-0.02em',margin:'0 0 10px'}}>PDF 업로드 및 생성 옵션 설정</h1>
      <p style={{fontSize:15,color:'var(--graphite)',margin:'0 0 28px',lineHeight:1.6}}>전문 PDF 문서 한 건을 업로드하고 시청 대상 수준과 영상 길이를 선택하면, 문서 유효성을 사전 검증한 뒤 파이프라인 Job이 생성됩니다.</p>

      <div onClick={simulateDrop}
        onDragOver={e=>{e.preventDefault(); setDragOver(true);}}
        onDragLeave={()=>setDragOver(false)}
        onDrop={e=>{e.preventDefault(); setDragOver(false); simulateDrop();}}
        style={{border:'2px dashed '+(dragOver?'var(--lake)':'var(--ash)'), borderRadius:'var(--r-lg)', padding:'52px 28px',
        textAlign:'center', background: dragOver? 'var(--periwinkle)':'transparent', cursor:'pointer', transition:'all .16s ease', marginBottom:26}}>
        <i data-lucide="upload-cloud" style={{width:36,height:36,color:'var(--lake)',marginBottom:14}}></i>
        {!fileName ? (
          <>
            <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>PDF 파일을 이곳에 드래그하거나 클릭해 업로드</div>
            <div style={{fontSize:13,color:'var(--smoke)'}}>단일 문서 1건 · 최대 50MB · 텍스트 추출 가능한 PDF만 지원</div>
          </>
        ) : (
          <>
            <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>{fileName}</div>
            <div style={{fontSize:13,color:'var(--smoke)'}}>페이지 {pages}개 감지 · 텍스트 추출 가능 확인됨</div>
          </>
        )}
      </div>

      {fileName && <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'#2f7d4f',fontWeight:600,marginBottom:30}}>
        <i data-lucide="check-circle-2" style={{width:16,height:16}}></i> 업로드 진행률 100% · 유효성 검증 통과
      </div>}

      <div style={{marginBottom:26}}>
        <div style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--graphite)',marginBottom:12}}>시청자 이해 수준</div>
        <div style={{display:'flex',gap:12}}>
          {['General','Expert'].map(l=>(
            <button key={l} onClick={()=>setLevel(l)} style={{flex:1,textAlign:'left',padding:'16px 18px',borderRadius:20,cursor:'pointer',
              border:'1px solid '+(level===l?'var(--ink)':'var(--ash)'), background: level===l?'var(--ink)':'transparent', color: level===l?'#fff':'var(--ink)'}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{l} {l==='General'?'(비전문가용)':'(전문가용)'}</div>
              <div style={{fontSize:12,opacity:.75}}>{l==='General'?'쉬운 용어와 비유 중심의 설명 톤':'기술 용어를 유지한 심화 설명 톤'}</div>
            </button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:34}}>
        <div style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--graphite)',marginBottom:12}}>영상 길이</div>
        <div style={{display:'flex',gap:10}}>
          {['20초','30초','60초'].map(l=>(
            <button key={l} onClick={()=>setLen(l)} style={{padding:'10px 22px',borderRadius:'var(--r-pill)',fontSize:13,fontWeight:600,cursor:'pointer',
              border:'1px solid '+(len===l?'var(--ink)':'var(--ash)'), background: len===l?'var(--ink)':'transparent', color: len===l?'#fff':'var(--ink)'}}>{l}</button>
          ))}
        </div>
      </div>

      <button className="pill-btn" disabled={!fileName} onClick={()=>onCreate({level, len, fileName})}
        style={{background: fileName?'var(--lake)':'var(--ash)', color:'#fff', border:'none', borderRadius:'var(--r-pill)',
        padding:'14px 30px', fontSize:14, fontWeight:700, cursor: fileName?'pointer':'not-allowed', display:'flex',alignItems:'center',gap:8}}>
        <i data-lucide="play" style={{width:16,height:16}}></i> 생성 시작
      </button>
    </div>
  );
}

/* ---------- prompt editor screen ---------- */
function PromptEditorScreen(){
  const [selected, setSelected] = useState(PROMPT_TEMPLATES[0]);
  const [body, setBody] = useState(
`당신은 {{doc_title}} 문서를 기반으로 {{tone}} 톤의 영상 대본을 작성하는 어시스턴트입니다.
핵심 내용: {{key_points}}

- 도입부는 15초 내 시청자의 주의를 끄는 한 문장으로 시작합니다.
- 원문 근거 없는 주장은 포함하지 않습니다.`);
  const [toast, setToast] = useState(null);
  const [showHistory, setShowHistory] = useState(false);

  return (
    <div style={{maxWidth:1200,margin:'0 auto',padding:'32px 32px 80px',display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap',animation:'fadeInUp .28s ease'}}>
      <div style={{width:260,flexShrink:0}}>
        <div style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--graphite)',marginBottom:12}}>템플릿 목록</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {PROMPT_TEMPLATES.map(t=>(
            <div key={t.id} onClick={()=>setSelected(t)} style={{padding:'12px 14px',borderRadius:16,cursor:'pointer',
              border:'1px solid '+(selected.id===t.id?'var(--ink)':'var(--ash)'), background:selected.id===t.id?'var(--periwinkle)':'transparent'}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:3}}>{t.name}</div>
              <div style={{fontSize:11,color:'var(--smoke)'}}>{t.version} · {t.updated}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{flex:1,minWidth:380}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:10}}>
          <div>
            <h1 style={{fontSize:28,fontWeight:600,letterSpacing:'-0.02em',margin:'0 0 6px'}}>프롬프트·생성 규칙 관리 에디터</h1>
            <p style={{fontSize:14,color:'var(--graphite)',margin:0}}>코드 배포 없이 템플릿을 수정하면 다음 생성 요청부터 즉시 반영됩니다.</p>
          </div>
          <button onClick={()=>setShowHistory(v=>!v)} style={{border:'1px solid var(--ash)',background:'transparent',borderRadius:'var(--r-pill)',
            padding:'9px 16px',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
            <i data-lucide="history" style={{width:14,height:14}}></i> 버전 이력
          </button>
        </div>

        <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
          {selected.variables.map(v=>(
            <span key={v} style={{fontSize:11,fontWeight:700,fontFamily:'monospace',background:'var(--periwinkle)',padding:'4px 9px',borderRadius:8}}>{v}</span>
          ))}
        </div>

        <textarea value={body} onChange={e=>setBody(e.target.value)} rows={9} style={{width:'100%',border:'1px solid var(--ash)',
          borderRadius:20,padding:'18px 20px',fontSize:14,lineHeight:1.7,resize:'vertical',background:'#fff',color:'var(--ink)'}}></textarea>

        <div style={{display:'flex',gap:10,marginTop:16}}>
          <button className="pill-btn" onClick={()=>setToast('템플릿이 저장되어 다음 생성부터 즉시 반영됩니다')} style={{background:'var(--lake)',
            color:'#fff',border:'none',borderRadius:'var(--r-pill)',padding:'12px 24px',fontSize:13,fontWeight:700}}>변경사항 저장</button>
          <button className="pill-btn" onClick={()=>setToast('직전 버전(v3)으로 롤백되었습니다')} style={{background:'transparent',
            color:'var(--ink)',border:'1px solid var(--ash)',borderRadius:'var(--r-pill)',padding:'12px 24px',fontSize:13,fontWeight:700}}>이전 버전으로 롤백</button>
        </div>

        {showHistory && (
          <div style={{marginTop:24,border:'1px solid var(--ash)',borderRadius:20,padding:'18px 20px',animation:'fadeIn .18s ease'}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--smoke)',marginBottom:12}}>변경 이력</div>
            {PROMPT_HISTORY.map((h,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderTop: i>0?'1px solid var(--ash)':'none',fontSize:13}}>
                <span style={{fontWeight:600}}>{h.v} · {h.note}</span>
                <span style={{color:'var(--smoke)'}}>{h.author} · {h.date}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

/* ---------- preview screen ---------- */
function PreviewScreen(){
  const [scenes, setScenes] = useState(SCENES);
  const [activeGen, setActiveGen] = useState('Veo');
  const [toast, setToast] = useState(null);

  function regenScene(id){
    setScenes(prev=>prev.map(s=>s.id===id?{...s,status:'재생성 중'}:s));
    setToast('씬 재생성 요청이 큐에 등록되었습니다 (다른 씬은 유지)');
    setTimeout(()=>{
      setScenes(prev=>prev.map(s=>s.id===id?{...s,status:'완료'}:s));
    }, 2200);
  }

  return (
    <div style={{maxWidth:1100,margin:'0 auto',padding:'32px 32px 80px',animation:'fadeInUp .28s ease'}}>
      <h1 style={{fontSize:44,fontWeight:600,letterSpacing:'-0.02em',margin:'0 0 10px'}}>AI 에셋 생성 및 미디어 합성 미리보기</h1>
      <p style={{fontSize:15,color:'var(--graphite)',margin:'0 0 26px',lineHeight:1.6}}>씬별로 생성된 이미지·영상·TTS·자막을 확인하고, 특정 씬만 선택해 재생성하거나 최종 MP4를 다운로드합니다.</p>

      <div style={{display:'flex',gap:8,marginBottom:20}}>
        {['Veo','Kling','Runway'].map(g=>(
          <button key={g} onClick={()=>setActiveGen(g)} className="tab-btn" style={{
            background: activeGen===g?'var(--ink)':'transparent', color: activeGen===g?'#fff':'var(--graphite)',
            border:'1px solid '+(activeGen===g?'var(--ink)':'var(--ash)'), borderRadius:'var(--r-pill)', padding:'8px 18px', fontSize:12,fontWeight:700}}>
            {g} 소스
          </button>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:16,marginBottom:30}}>
        {scenes.map(s=>(
          <div key={s.id} className="card-hover" style={{border:'1px solid var(--ash)',borderRadius:'var(--r-card)',overflow:'hidden',background:'#fff'}}>
            <div style={{height:120,background:s.img,position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <i data-lucide="play-circle" style={{width:30,height:30,color:'#fff',opacity:.9}}></i>
              <span style={{position:'absolute',bottom:8,right:10,fontSize:11,fontWeight:700,color:'#fff',background:'rgba(36,36,36,.55)',
                padding:'2px 8px',borderRadius:'var(--r-pill)'}}>{s.dur}</span>
            </div>
            <div style={{padding:'14px 14px 16px'}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>{s.title}</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <span style={{fontSize:11,fontWeight:600,color:'var(--smoke)'}}>{s.gen} 생성</span>
                <span style={{fontSize:11,fontWeight:700,color: s.status==='재생성 중'?'#b5790f':(s.status==='완료'?'#2f7d4f':'var(--smoke)')}}>{s.status}</span>
              </div>
              <button onClick={()=>regenScene(s.id)} disabled={s.status==='재생성 중'} style={{width:'100%',border:'1px solid var(--ash)',
                background:'transparent',borderRadius:14,padding:'8px',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:6,
                cursor:s.status==='재생성 중'?'not-allowed':'pointer',opacity:s.status==='재생성 중'?.5:1}}>
                <i data-lucide="refresh-cw" style={{width:13,height:13}}></i> 이 씬만 재생성
              </button>
            </div>
          </div>
        ))}
      </div>

      <div style={{background:'var(--periwinkle)',borderRadius:'var(--r-lg)',padding:'26px 30px',display:'flex',
        justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:16}}>
        <div>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>최종 합성 완료 · 총 4개 씬 동기화</div>
          <div style={{fontSize:13,color:'var(--graphite)'}}>FFmpeg 기반 씬 합성 · TTS 음성 및 자막 동기화 적용됨 · 예상 길이 20.0초</div>
        </div>
        <button className="pill-btn" onClick={()=>setToast('MP4 다운로드가 시작되었습니다')} style={{background:'var(--ink)',color:'#fff',
          border:'none',borderRadius:'var(--r-pill)',padding:'13px 24px',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
          <i data-lucide="download" style={{width:15,height:15}}></i> MP4 다운로드
        </button>
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

/* ---------- app ---------- */
function App(){
  const [screen, setScreen] = useState('main');
  const [jobs, setJobs] = useState(INITIAL_JOBS);
  const [openJob, setOpenJob] = useState(null);
  const [filter, setFilter] = useState('all');
  const [toast, setToast] = useState(null);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  function handleRetry(id){
    setJobs(prev=>prev.map(j=>j.id===id?{...j,fail:false,stage:'render',progress:60}:j));
    setOpenJob(null);
    setToast('단계가 재시도되어 렌더링 단계로 이동했습니다');
  }

  function handleNewJob(payload){
    const id = 'j'+(jobs.length+1);
    const title = payload && payload.fileName ? payload.fileName : '새 업로드 문서.pdf';
    const level = payload && payload.level ? payload.level : 'General';
    const len = payload && payload.len ? payload.len : '30초';
    setJobs(prev=>[{id,title,level,len,stage:'parsing',progress:3,owner:'ME',updated:'방금',fail:false}, ...prev]);
    setScreen('main');
    setToast('새 생성 요청이 파이프라인 보드에 등록되었습니다');
  }

  return (
    <div>
      <TopNav screen={screen} setScreen={setScreen} onNewJob={()=>setScreen('upload')}/>
      {screen==='main' && <BoardScreen jobs={jobs} setJobs={setJobs} openJob={openJob} setOpenJob={setOpenJob} filter={filter} setFilter={setFilter}/>}
      {screen==='upload' && <UploadScreen onCreate={handleNewJob}/>}
      {screen==='prompt-editor' && <PromptEditorScreen/>}
      {screen==='preview' && <PreviewScreen/>}
      {openJob && <JobDrawer job={openJob} onClose={()=>setOpenJob(null)} onRetry={handleRetry}/>}
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
