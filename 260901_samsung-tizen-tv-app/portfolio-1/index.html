<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>루미나 TV — AI 크리에이티브 스튜디오 TV 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#2b7fff; --secondary:#1b1b1b; --accent:#f75745;
    --bg:#000000; --haze:#f5f5f5; --ink:#1b1b1b;
    --text:#ffffff; --text-dim:#9aa3ad; --twilight:#426188;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseGlow{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(247,87,69,.5);}50%{opacity:.7;box-shadow:0 0 0 6px rgba(247,87,69,0);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
  @keyframes slideInRight{from{transform:translateX(100%);opacity:.4;}to{transform:translateX(0);opacity:1;}}
  @keyframes ringPop{0%{transform:scale(1);}45%{transform:scale(1.08);}100%{transform:scale(1);}}

  .topnav{width:100%;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:40;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--twilight));display:flex;align-items:center;justify-content:center;}
  .nav-links{display:flex;gap:6px;}
  .nav-link{background:transparent;border:none;color:var(--text-dim);font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;transition:.15s;}
  .nav-link.active,.nav-link:hover{color:#fff;background:rgba(255,255,255,.06);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .btn-ghost{background:transparent;border:1px solid #fff;color:#fff;font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-haze{background:var(--haze);color:var(--ink);border:1px solid var(--ink);font-size:14px;font-weight:500;padding:8px 16px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;}
  .pill{border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--text-dim);transition:.15s;}
  .pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .pill:hover:not(.active){border-color:rgba(255,255,255,.4);color:#fff;}

  .hero{padding:56px 48px 32px;position:relative;overflow:hidden;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--primary);font-weight:600;margin-bottom:14px;}
  .hero h1{font-size:clamp(34px,4.6vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 14px;max-width:820px;}
  .hero h1 em{font-style:italic;color:var(--twilight);font-weight:600;}
  .hero p{font-size:16px;color:var(--text-dim);max-width:560px;line-height:1.5;margin:0 0 24px;}

  .filter-bar{display:flex;gap:8px;padding:0 48px 28px;flex-wrap:wrap;}

  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 48px 20px;}
  .tile{background:var(--secondary);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;position:relative;overflow:hidden;animation:fadeInUp .5s ease both;}
  .tile.feature{grid-column:span 2;grid-row:span 2;padding:0;cursor:pointer;}
  .tile.wide{grid-column:span 2;}
  .tile:hover{border-color:rgba(255,255,255,.22);}
  .tile.clickable{cursor:pointer;}
  .tile-label{font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .tile-num{font-size:32px;font-weight:800;letter-spacing:-.02em;}

  .feature-media{position:relative;width:100%;height:100%;min-height:340px;}
  .feature-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .feature-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.85) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;}
  .badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:9999px;width:fit-content;animation:pulseGlow 2.2s ease-in-out infinite;}

  .list-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:.12s;}
  .list-row:hover{background:rgba(255,255,255,.05);}
  .list-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;}

  .avatar-row{display:flex;gap:-8px;}
  .avatar-row img{width:36px;height:36px;border-radius:50%;border:2px solid var(--secondary);margin-left:-10px;}
  .avatar-row img:first-child{margin-left:0;}

  .demo-section{padding:8px 48px 64px;}
  .demo-section h2{font-size:24px;font-weight:700;margin:0 0 6px;}
  .demo-section .sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;}
  .demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .demo-card{background:var(--haze);color:var(--ink);border-radius:12px;padding:20px;text-align:left;border:none;display:flex;flex-direction:column;gap:14px;transition:.15s transform;}
  .demo-card:hover{transform:translateY(-4px);}
  .demo-card .ic{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;}
  .demo-card strong{font-size:15px;font-weight:700;line-height:1.35;}
  .demo-card span{font-size:13px;color:#525252;line-height:1.4;}
  .demo-card .go{margin-top:auto;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);}

  .screen{padding:40px 48px 72px;min-height:70vh;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--text-dim);font-size:14px;margin-bottom:24px;padding:8px 0;}
  .back-btn:hover{color:#fff;}
  .screen h2{font-size:32px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em;}
  .screen .desc{color:var(--text-dim);font-size:15px;max-width:640px;line-height:1.55;margin:0 0 32px;}

  .remote-wrap{display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap;}
  .remote{background:var(--secondary);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px;width:180px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,52px);gap:8px;place-items:center;flex-shrink:0;}
  .remote button{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;}
  .remote button:hover{background:rgba(255,255,255,.14);}
  .remote .ok{background:var(--primary);border-color:var(--primary);}
  .remote .u{grid-column:2;grid-row:1;} .remote .l{grid-column:1;grid-row:2;} .remote .ok-btn{grid-column:2;grid-row:2;} .remote .r{grid-column:3;grid-row:2;} .remote .d{grid-column:2;grid-row:3;}

  .focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:560px;}
  .focus-tile{aspect-ratio:4/3;border-radius:12px;background:var(--secondary);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-dim);font-weight:600;position:relative;overflow:hidden;transition:.15s;}
  .focus-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;}
  .focus-tile span{position:relative;z-index:1;}
  .focus-tile.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(43,127,255,.35);animation:ringPop .3s ease;transform:scale(1.05);z-index:2;}

  .kbd-hint{font-size:13px;color:var(--text-dim);margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;}

  .detail-layout{display:flex;gap:40px;flex-wrap:wrap;}
  .detail-hero{flex:1 1 480px;position:relative;border-radius:14px;overflow:hidden;min-height:400px;}
  .detail-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .safe-margin-overlay{position:absolute;inset:32px;border:2px dashed var(--accent);border-radius:6px;pointer-events:none;}
  .safe-margin-overlay::before{content:'안전 여백(overscan)';position:absolute;top:-24px;left:0;font-size:11px;color:var(--accent);font-weight:700;}
  .detail-info{flex:1 1 320px;}
  .detail-info .title{font-size:clamp(32px,3.4vw,46px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;}
  .detail-info .meta{color:var(--text-dim);font-size:15px;margin:0 0 24px;}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
  .action-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;transition:.15s;}
  .action-btn:hover,.action-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;background:rgba(255,255,255,.12);}
  .toggle-btn{background:var(--haze);color:var(--ink);border:1px solid var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;}

  .tv-frame{background:#050505;border:6px solid #1c1c1c;border-radius:16px;padding:24px;position:relative;width:100%;max-width:640px;min-height:340px;overflow:hidden;}
  .tv-frame .fake-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;filter:blur(0);transition:filter .35s, opacity .35s;}
  .tv-frame.suspended .fake-grid{filter:blur(6px);opacity:.35;}
  .fake-tile{aspect-ratio:16/10;background:var(--secondary);border-radius:8px;}
  .suspend-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .3s;}
  .tv-frame.suspended .suspend-overlay{opacity:1;pointer-events:auto;}
  .skeleton{background:linear-gradient(90deg,#1c1c1c 0px,#2a2a2a 40px,#1c1c1c 80px);background-size:200px 100%;animation:shimmer 1s linear infinite;border-radius:8px;height:14px;width:70%;}
  .snapshot-box{background:var(--secondary);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;color:#9ae6b4;margin-top:24px;max-width:640px;}
  .snapshot-box .k{color:var(--text-dim);}

  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;justify-content:flex-end;}
  .drawer{width:380px;max-width:90vw;height:100%;background:#0c0c0c;border-left:1px solid rgba(255,255,255,.1);padding:28px;overflow-y:auto;animation:slideInRight .28s ease;}
  .drawer img{width:100%;border-radius:12px;margin-bottom:18px;}
  .drawer-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.08);border:none;color:#fff;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:fadeInUp .25s ease;}

  footer{padding:32px 48px;border-top:1px solid rgba(255,255,255,.08);color:var(--text-dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}

  @media (max-width:900px){
    .bento{grid-template-columns:repeat(2,1fr);}
    .tile.feature{grid-column:span 2;}
    .demo-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FEATURES = [
  { id:'main', label:'AI 창작 콘텐츠 갤러리 홈', desc:'기존 웹 서비스의 AI 생성 콘텐츠를 TV 큰 화면 비대칭 타일로 노출합니다', icon:'layout-grid' },
  { id:'focus-demo', label:'D-pad 리모컨 포커스 내비게이션', desc:'상하좌우 방향키만으로 화면의 모든 요소를 탐색하는 Spatial Navigation 엔진', icon:'move' },
  { id:'detail', label:'콘텐츠 상세 및 TV 해상도 레이아웃', desc:'1920x1080 해상도·시청거리 기준 10-foot UI 타이포/여백 스케일', icon:'tv-minimal' },
  { id:'session', label:'Suspend/Resume 세션 상태 관리', desc:'백그라운드 전환·절전 복귀 시 화면과 포커스를 그대로 복원', icon:'rotate-ccw' },
];

const CONTENTS = [
  { id:1, title:'네온 오로라 초상화', type:'image', creator:'김도윤', seed:'lumina-c1', views:12400, likes:892, tag:'HOT' },
  { id:2, title:'몽환의 숲 애니메이션', type:'video', creator:'이서연', seed:'lumina-c2', views:8300, likes:611, tag:'NEW', duration:'00:42' },
  { id:3, title:'딥블루 사운드스케이프', type:'music', creator:'박지훈', seed:'lumina-c3', views:5210, likes:340, tag:null, duration:'02:15' },
  { id:4, title:'유리 조형 오브제', type:'3d', creator:'최민아', seed:'lumina-c4', views:4020, likes:255, tag:null },
  { id:5, title:'사이버펑크 스카이라인', type:'image', creator:'정우진', seed:'lumina-c5', views:15800, likes:1204, tag:'HOT' },
  { id:6, title:'파도 위의 빛', type:'video', creator:'한소희', seed:'lumina-c6', views:6700, likes:410, tag:null, duration:'01:08' },
  { id:7, title:'미니멀 제너레이티브 패턴', type:'image', creator:'윤태양', seed:'lumina-c7', views:3100, likes:198, tag:'NEW' },
  { id:8, title:'앰비언트 나이트 루프', type:'music', creator:'서지민', seed:'lumina-c8', views:2900, likes:167, tag:null, duration:'03:40' },
  { id:9, title:'플로팅 아일랜드 3D씬', type:'3d', creator:'노하은', seed:'lumina-c9', views:7400, likes:520, tag:'HOT' },
];

const TYPE_ICON = { image:'image', video:'film', music:'music-2', '3d':'box' };
const CATEGORIES = [ { id:'all', label:'전체' }, { id:'image', label:'이미지' }, { id:'video', label:'영상' }, { id:'music', label:'음악' }, { id:'3d', label:'3D' } ];

function useIcons(deps){
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, deps);
}

function TopNav({ view, setView }){
  return (
    <header className="topnav">
      <div className="logo">
        <span className="mark"><i data-lucide="tv-minimal" style={{width:16,height:16,color:'#fff'}}></i></span>
        루미나 TV
      </div>
      <nav className="nav-links">
        <button className={"nav-link" + (view==='main' ? ' active' : '')} onClick={() => setView('main')}>홈</button>
        <button className="nav-link" onClick={() => setView('focus-demo')}><span className="sr-only">D-pad 리모컨 포커스 내비게이션</span>포커스 데모</button>
        <button className="nav-link" onClick={() => setView('detail')}><span className="sr-only">콘텐츠 상세 및 TV 해상도 레이아웃</span>상세 데모</button>
        <button className="nav-link" onClick={() => setView('session')}><span className="sr-only">Suspend/Resume 세션 상태 관리</span>세션 데모</button>
      </nav>
      <button className="btn-ghost" onClick={() => setView('main')}>
        <i data-lucide="cast" style={{width:15,height:15}}></i> 리모컨 연결됨
      </button>
    </header>
  );
}

function CountUp({ target, duration=800 }){
  const [n, setN] = useState(0);
  useEffect(() => {
    let start = null;
    let raf;
    function step(ts){
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / duration);
      setN(Math.round(target * p));
      if (p < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return <span>{n.toLocaleString()}</span>;
}

function QuickViewDrawer({ item, onClose, showToast }){
  if (!item) return null;
  return (
    <div className="drawer-backdrop" onClick={onClose}>
      <div className="drawer" style={{position:'relative'}} onClick={e => e.stopPropagation()}>
        <button className="drawer-close" onClick={onClose}><i data-lucide="x" style={{width:16,height:16}}></i></button>
        <img src={`https://picsum.photos/seed/${item.seed}/560/360`} alt={item.title} />
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <i data-lucide={TYPE_ICON[item.type]} style={{width:15,height:15,color:'#9aa3ad'}}></i>
          <span style={{fontSize:13,color:'#9aa3ad'}}>{item.creator}</span>
        </div>
        <h3 style={{fontSize:20,fontWeight:700,margin:'0 0 10px'}}>{item.title}</h3>
        <p style={{fontSize:14,color:'#9aa3ad',lineHeight:1.6,margin:'0 0 20px'}}>
          AI 생성 파이프라인을 거쳐 만들어진 크리에이티브 콘텐츠입니다. 리모컨 OK 버튼으로 바로 재생하거나 좋아요를 남길 수 있습니다.
        </p>
        <div style={{display:'flex',gap:8,fontSize:13,color:'#9aa3ad',marginBottom:24}}>
          <span><i data-lucide="eye" style={{width:13,height:13,verticalAlign:'-2px'}}></i> {item.views.toLocaleString()}</span>
          <span><i data-lucide="heart" style={{width:13,height:13,verticalAlign:'-2px'}}></i> {item.likes.toLocaleString()}</span>
          {item.duration && <span><i data-lucide="clock" style={{width:13,height:13,verticalAlign:'-2px'}}></i> {item.duration}</span>}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="action-btn" onClick={() => showToast('재생 데모: 실제 서비스에서는 콘텐츠 재생이 시작됩니다')}>
            <i data-lucide="play" style={{width:15,height:15}}></i> 재생
          </button>
          <button className="action-btn" onClick={() => showToast('좋아요를 남겼습니다')}>
            <i data-lucide="heart" style={{width:15,height:15}}></i> 좋아요
          </button>
        </div>
      </div>
    </div>
  );
}

function MainScreen({ setView, setQuickView, showToast }){
  const [cat, setCat] = useState('all');
  const filtered = cat === 'all' ? CONTENTS : CONTENTS.filter(c => c.type === cat);
  const featureItem = CONTENTS[4];
  const listItems = CONTENTS.slice(0, 3);

  return (
    <React.Fragment>
      <section className="hero">
        <div className="hero-eyebrow"><i data-lucide="sparkle" style={{width:14,height:14}}></i> 삼성 스마트TV 전용 확장</div>
        <h1>거실 큰 화면에서 만나는 <em>AI 크리에이티브</em></h1>
        <p>운영 중인 AI 창작 웹 서비스를 Tizen Web Application으로 포팅한 맞춤 구현 데모입니다. 리모컨 D-pad만으로 모든 콘텐츠를 탐색할 수 있습니다.</p>
      </section>

      <div className="filter-bar">
        {CATEGORIES.map(c => (

function FocusDemoScreen({ back, showToast }){
  const cols = 3;
  const [idx, setIdx] = useState(4);
  const tiles = CONTENTS;

  function move(dir){
    setIdx(prev => {
      let next = prev;
      if (dir === 'up' && prev - cols >= 0) next = prev - cols;
      if (dir === 'down' && prev + cols < tiles.length) next = prev + cols;
      if (dir === 'left' && prev % cols !== 0) next = prev - 1;
      if (dir === 'right' && (prev + 1) % cols !== 0 && prev + 1 < tiles.length) next = prev + 1;
      return next;
    });
  }

  useEffect(() => {
    function onKey(e){
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'Enter') showToast(`선택됨: ${tiles[idx].title}`);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx]);

  return (
    <div className="screen">
      <button className="back-btn" onClick={back}><i data-lucide="chevron-left" style={{width:16,height:16}}></i> 홈으로</button>
      <h2>D-pad 리모컨 포커스 내비게이션</h2>
      <p className="desc">격자 좌표를 인덱싱해 방향키 입력마다 최근접 후보를 계산하는 Spatial Navigation 알고리즘 데모입니다. 아래 리모컨을 클릭하거나 키보드 방향키를 사용해보세요.</p>
      <div className="remote-wrap">
        <div className="remote">
          <button className="u" onClick={() => move('up')}><i data-lucide="chevron-up" style={{width:18,height:18}}></i></button>
          <button className="l" onClick={() => move('left')}><i data-lucide="chevron-left" style={{width:18,height:18}}></i></button>
          <button className="ok-btn ok" onClick={() => showToast(`선택됨: ${tiles[idx].title}`)}><i data-lucide="corner-down-left" style={{width:18,height:18}}></i></button>
          <button className="r" onClick={() => move('right')}><i data-lucide="chevron-right" style={{width:18,height:18}}></i></button>
          <button className="d" onClick={() => move('down')}><i data-lucide="chevron-down" style={{width:18,height:18}}></i></button>
        </div>
        <div>
          <div className="focus-grid">
            {tiles.map((t, i) => (
              <div key={t.id} className={"focus-tile" + (i===idx ? ' active' : '')}>
                <img src={`https://picsum.photos/seed/${t.seed}/200/150`} alt={t.title} />
                <span>{t.title}</span>
              </div>
            ))}
          </div>
          <div className="kbd-hint">
            <span className="kbd">↑</span><span className="kbd">↓</span><span className="kbd">←</span><span className="kbd">→</span> 키보드 방향키 또는 리모컨 클릭 · <span className="kbd">Enter</span> 선택
          </div>
        </div>
      </div>
    </div>
  );
}

function SessionScreen({ back }){
  const [suspended, setSuspended] = useState(false);
  const [resuming, setResuming] = useState(false);
  const [cycles, setCycles] = useState(0);
  const [snapshot, setSnapshot] = useState({ screen:'main', focusIndex:4, scrollY:0, ts:'--:--:--' });

  function suspend(){
    const now = new Date();
    setSnapshot({ screen:'main', focusIndex:4, scrollY:812, ts: now.toLocaleTimeString('ko-KR') });
    setSuspended(true);
  }
  function resume(){
    setResuming(true);
    setTimeout(() => {
      setSuspended(false);
      setResuming(false);
      setCycles(c => c + 1);
    }, 1100);
  }

  return (
    <div className="screen">
      <button className="back-btn" onClick={back}><i data-lucide="chevron-left" style={{width:16,height:16}}></i> 홈으로</button>
      <h2>Suspend/Resume 세션 상태 관리</h2>
      <p className="desc">Tizen visibilitychange 이벤트를 구독해 백그라운드 전환 시 화면 상태를 스냅샷 저장하고, 복귀 시 그대로 복원하는 경량 세션 관리 데모입니다.</p>
      <div style={{display:'flex',gap:12,marginBottom:24}}>
        <button className="action-btn" onClick={suspend} disabled={suspended}><i data-lucide="pause" style={{width:15,height:15}}></i> Suspend (백그라운드 전환)</button>
        <button className="action-btn" onClick={resume} disabled={!suspended}><i data-lucide="rotate-ccw" style={{width:15,height:15}}></i> Resume (복귀)</button>
      </div>
      <div className={"tv-frame" + (suspended ? ' suspended' : '')}>
        <div className="fake-grid">
          {Array.from({length:9}).map((_, i) => <div key={i} className="fake-tile"></div>)}
        </div>
        <div className="suspend-overlay">
          {resuming ? (
            <React.Fragment>
              <div className="skeleton" style={{width:120}}></div>
              <span style={{fontSize:13,color:'#9aa3ad'}}>세션 복원 중...</span>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <i data-lucide="moon" style={{width:28,height:28,color:'#9aa3ad'}}></i>
              <span style={{fontSize:13,color:'#9aa3ad'}}>일시 중단됨 — 화면·포커스 상태 저장 완료</span>
            </React.Fragment>
          )}
        </div>
      </div>
      <div className="snapshot-box">
        <div><span className="k">// 세션 스냅샷 (복원 {cycles}회)</span></div>
        <div>{'{'}</div>
        <div>&nbsp;&nbsp;<span className="k">screen:</span> "{snapshot.screen}",</div>
        <div>&nbsp;&nbsp;<span className="k">focusIndex:</span> {snapshot.focusIndex},</div>
        <div>&nbsp;&nbsp;<span className="k">scrollY:</span> {snapshot.scrollY},</div>
        <div>&nbsp;&nbsp;<span className="k">savedAt:</span> "{snapshot.ts}"</div>
        <div>{'}'}</div>
      </div>
    </div>
  );
}

function Toast({ message }){
  return <div className="toast">{message}</div>;
}

function App(){
  const [view, setView] = useState('main');
  const [quickView, setQuickView] = useState(null);
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);

  function showToast(msg){
    setToast(msg);
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(null), 2200);
  }

  useIcons([view, quickView, toast]);

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}} data-archetype="bento-grid">
      <TopNav view={view} setView={setView} />
      <main style={{flex:1,width:'100%'}}>
        {view === 'main' && <MainScreen setView={setView} setQuickView={setQuickView} showToast={showToast} />}
        {view === 'focus-demo' && <FocusDemoScreen back={() => setView('main')} showToast={showToast} />}
        {view === 'detail' && <DetailScreen back={() => setView('main')} showToast={showToast} />}
        {view === 'session' && <SessionScreen back={() => setView('main')} />}
      </main>
      <footer>
        <span>© 루미나 TV — 자체 개발 프로젝트</span>
        <span>Tizen Web Application · 삼성 스마트TV 대응</span>
      </footer>
      {quickView && <QuickViewDrawer item={quickView} onClose={() => setQuickView(null)} showToast={showToast} />}
      {toast && <Toast message={toast} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
