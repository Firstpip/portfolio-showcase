<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>루미나 릴리스 콘솔 — AI 크리에이티브 TV 배포 관제 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<style>
  :root{
    --primary:#000000; --secondary:#d4d4d4; --accent:#2563eb;
    --bg:#ffffff; --paper:#f5f5f5; --border:#e5e5e5;
    --ink:#171717; --dim:#737373; --good:#16a34a; --warn:#ea580c; --bad:#dc2626;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  table{border-collapse:collapse;width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:8px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}

  .shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:258px;background:var(--paper);border-right:1px solid var(--border);padding:20px 14px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from -81deg,#ff0000,#eab308 99deg,#5cff80 162deg,#00fff9 216deg,#3a8bfd 288deg,#855afc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
  .page-header{position:relative;}
  .page-header::before{content:'';position:absolute;top:-16px;right:-8px;width:220px;height:120px;background:radial-gradient(circle,rgba(37,99,235,.10) 0%,rgba(37,99,235,0) 72%);pointer-events:none;z-index:-1;}
  .brand strong{font-size:14px;font-weight:700;}
  .env-pill{margin-left:auto;background:#dcfce7;color:#16a34a;font-size:10px;font-weight:700;padding:3px 8px;border-radius:9999px;}
  .side-group-title{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;padding:14px 10px 6px;}
  .side-link{display:flex;align-items:flex-start;gap:10px;width:100%;background:transparent;border:none;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;line-height:1.35;font-weight:500;color:var(--ink);margin-bottom:2px;}
  .side-link i{margin-top:1px;flex-shrink:0;}
  .side-link:hover{background:#e9edf5;}
  .side-link.active{background:#dbeaff;color:#1e40af;font-weight:600;}

  .main-wrap{margin-left:258px;flex:1;min-width:0;width:calc(100% - 258px);}
  .page{padding:28px 32px 64px;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;}
  .page-meta{font-size:13px;color:var(--dim);}
  .page-actions{display:flex;gap:8px;}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--ink);font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;}
  .btn-outline:hover{background:var(--paper);}
  .btn-primary{background:var(--primary);border:1px solid var(--primary);color:#fff;font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-danger{background:#fff;border:1px solid #fecaca;color:#dc2626;font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px 18px;animation:fadeInUp .4s ease both;transition:.15s;}
  .stat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-2px);}
  .stat-label{font-size:12px;color:var(--dim);margin-bottom:8px;}
  .stat-value{font-size:30px;font-weight:700;letter-spacing:-.01em;}
  .stat-delta{font-size:12px;font-weight:600;margin-top:4px;}
  .stat-delta.positive{color:var(--good);}
  .stat-delta.negative{color:var(--bad);}
  .sparkline{margin-top:6px;}

  .pane-split{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:22px;align-items:start;}
  .panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}
  .panel h3{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}

  .build-row{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .build-row:last-child{margin-bottom:0;}
  .build-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .build-ver{font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .build-date{font-size:12px;color:var(--dim);}
  .stage-track{display:flex;gap:4px;height:8px;}
  .stage-seg{flex:1;background:var(--border);border-radius:4px;transform-origin:left;animation:barGrow .5s ease both;}
  .stage-seg.done{background:var(--good);}
  .stage-seg.active{background:var(--accent);}
  .stage-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim);}

  .queue-item{border-bottom:1px solid var(--border);padding:12px 0;}
  .queue-item:last-child{border-bottom:none;}
  .queue-item .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:#fee2e2;color:#dc2626;margin-bottom:6px;}
  .queue-item .name{font-size:13px;font-weight:600;margin-bottom:2px;}
  .queue-item .sub{font-size:12px;color:var(--dim);}
  .queue-item button{margin-top:8px;font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;}
  .queue-item.resolved{opacity:.5;}
  .queue-item.resolved .name{text-decoration:line-through;}

  .secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chart-wrap{position:relative;height:220px;}

  .tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{background:transparent;border:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);}

  .checklist{display:flex;flex-direction:column;gap:2px;margin-bottom:20px;}
  .check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .check-item.done{background:#f0fdf4;border-color:#bbf7d0;}
  .checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox.checked{background:var(--good);border-color:var(--good);color:#fff;}
  .progress-bar{height:8px;background:var(--border);border-radius:9999px;overflow:hidden;margin:14px 0 22px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:9999px;transition:width .3s;}

  .reject-card{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}

  .data-table th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border);}
  .data-table td{padding:13px 12px;font-size:13px;border-bottom:1px solid var(--border);}
  .data-table tr{cursor:pointer;}
  .data-table tbody tr:hover{background:var(--paper);}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px;}
  .badge.live{background:#dcfce7;color:#16a34a;}
  .badge.canary{background:#fef3c7;color:#b45309;}
  .badge.draft{background:#f1f5f9;color:#475569;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:12px;padding:26px;width:480px;max-width:100%;max-height:86vh;overflow-y:auto;animation:fadeInScale .2s ease;}
  .modal h3{font-size:17px;font-weight:700;margin:0 0 4px;}
  .modal .close{position:absolute;}
  .field-label{font-size:12px;font-weight:600;color:var(--dim);margin:16px 0 6px;}
  textarea, input[type=range]{width:100%;}
  textarea{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;resize:vertical;min-height:80px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:13px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;animation:slideDown .2s ease;box-shadow:0 10px 26px rgba(0,0,0,.2);}

  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;animation:pulseDot 1.6s ease-in-out infinite;margin-right:6px;}

  @media (max-width:1000px){
    .pane-split{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .secondary-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

const FEATURES = [
  { id:'main', group:'배포 관제', label:'배포·심사 파이프라인 관제', icon:'ph-radar' },
  { id:'pipeline', group:'배포 관제', label:'심사 제출 체크리스트 자동화', icon:'ph-list-checks' },
  { id:'analytics', group:'분석', label:'TV 앱 사용 현황 및 성능 분석', icon:'ph-chart-line-up' },
  { id:'content', group:'콘텐츠', label:'다중 콘텐츠 업데이트 및 릴리스 관리', icon:'ph-package' },
];

const BUILDS = [
  { ver:'v1.5.1', date:'2026.08.29 제출', stage:2 },
  { ver:'v1.5.0', date:'2026.08.20 배포완료', stage:4 },
  { ver:'v1.4.2', date:'2026.08.05 배포완료', stage:4 },
];
const STAGES = ['빌드','제출','심사','배포'];

const INITIAL_QUEUE = [
  { id:1, tag:'스크린샷 불일치', name:'v1.5.1 — 스크린샷 해상도 1920x1080 미준수', sub:'마감 D-2 · 재발 2회', resolved:false },
  { id:2, tag:'정책 위반', name:'v1.4.9 — 개인정보 처리방침 URL 누락', sub:'마감 D-5 · 재발 1회', resolved:false },
  { id:3, tag:'메타데이터', name:'v1.4.7 — 앱 카테고리 분류 오류', sub:'해결됨', resolved:true },
];

const CHECKLIST = [
  '앱 아이콘 (512x512, 투명배경 금지)',
  '스크린샷 4장 (1920x1080)',
  '개인정보 처리방침 URL',
  '연령 등급 정보',
  '지원 언어 목록',
  '릴리스 노트 (한국어)',
  '최소 지원 Tizen 버전',
  '카테고리 분류',
];

const REJECT_HISTORY = [
  { reason:'스크린샷 해상도 불일치', freq:3, deadline:'D-2' },
  { reason:'개인정보처리방침 누락', freq:1, deadline:'D-5' },
  { reason:'앱 설명 문구 정책 위반', freq:2, deadline:'D-9' },
];

const USAGE_DATA = Array.from({length:14}).map((_, i) => ({
  day: `${i+1}일`,
  진입: Math.round(1200 + Math.sin(i/2)*220 + i*18),
}));
const SUSPEND_DATA = [
  { name:'정상 Resume', value:82 },
  { name:'지연 Resume(>1s)', value:12 },
  { name:'세션 만료', value:6 },
];
const PIE_COLORS = ['#2563eb', '#f59e0b', '#dc2626'];

const BUILD_HISTORY = [
  { ver:'v1.5.1', submitted:'2026.08.29', reviewDays:'-', status:'심사중' },
  { ver:'v1.5.0', submitted:'2026.08.18', reviewDays:'2일', status:'배포완료' },
  { ver:'v1.4.9', submitted:'2026.08.09', reviewDays:'4일', status:'리젝' },
  { ver:'v1.4.8', submitted:'2026.08.01', reviewDays:'3일', status:'배포완료' },
  { ver:'v1.4.7', submitted:'2026.07.22', reviewDays:'6일', status:'리젝' },
  { ver:'v1.4.6', submitted:'2026.07.10', reviewDays:'3일', status:'배포완료' },
  { ver:'v1.4.5', submitted:'2026.06.28', reviewDays:'5일', status:'리젝' },
  { ver:'v1.4.4', submitted:'2026.06.15', reviewDays:'2일', status:'배포완료' },
];
const HISTORY_TABS = ['전체', '배포완료', '심사중', '리젝'];

const RELEASES = [
  { id:1, ver:'v1.5.1', group:'이미지·영상 콘텐츠 묶음', canary:15, status:'canary' },
  { id:2, ver:'v1.5.0', group:'음악·3D 오브제 묶음', canary:100, status:'live' },
  { id:3, ver:'v1.5.2', group:'신규 카테고리 콘텐츠', canary:0, status:'draft' },
  { id:4, ver:'v1.4.9', group:'긴급 버그 패치', canary:100, status:'live' },
];

function useIcons(){}

function Sidebar({ view, setView }){
  const groups = ['배포 관제', '분석', '콘텐츠'];
  return (
    <aside className="sidebar">
      <div className="brand">
        <span className="mark"><i className="ph ph-broadcast"></i></span>
        <strong>루미나 릴리스 콘솔</strong>
        <span className="env-pill">Production</span>
      </div>
      {groups.map(g => (
        <div key={g}>
          <div className="side-group-title">{g}</div>
          {FEATURES.filter(f => f.group === g).map(f => (
            <button key={f.id} className={"side-link" + (view === f.id ? ' active' : '')} onClick={() => setView(f.id)}>
              <i className={"ph " + f.icon}></i>
              {f.label}
            </button>
          ))}
        </div>
      ))}
    </aside>
  );
}

function Sparkline({ data, color }){
  const w = 90, h = 28;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="sparkline" width={w} height={h}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function StatRow(){
  const stats = [
    { label:'진행 중 빌드', value:'3', delta:'+1 이번 주', positive:true, data:[4,3,5,4,6,5,3], color:'#2563eb' },
    { label:'심사 대기', value:'1', delta:'평균 5.2일 소요', positive:false, data:[2,1,3,2,1,2,1], color:'#ea580c' },
    { label:'이번 달 리젝', value:'6', delta:'-2 전월 대비', positive:true, data:[9,8,7,8,6,6,6], color:'#dc2626' },
    { label:'배포 성공률', value:'94%', delta:'+3%p 전월 대비', positive:true, data:[88,90,91,90,93,94,94], color:'#16a34a' },
  ];
  return (
    <section className="stat-row">
      {stats.map((s, i) => (
        <div key={s.label} className="stat-card" style={{animationDelay:(i*0.05)+'s'}}>
          <div className="stat-label">{s.label}</div>
          <div className="stat-value">{s.value}</div>
          <div className={"stat-delta " + (s.positive ? 'positive' : 'negative')}>{s.delta}</div>
          <Sparkline data={s.data} color={s.color} />
        </div>
      ))}
    </section>
  );
}

function MainScreen({ showToast }){
  const [queue, setQueue] = useState(INITIAL_QUEUE);
  const [historyTab, setHistoryTab] = useState('전체');
  function toggleQueue(id){
    setQueue(q => q.map(item => item.id === id ? { ...item, resolved: !item.resolved } : item));
    showToast('대응 상태가 변경되었습니다');
  }
  const filteredHistory = historyTab === '전체' ? BUILD_HISTORY : BUILD_HISTORY.filter(b => b.status === historyTab);
  return (
    <React.Fragment>
      <header className="page-header">
        <div>
          <h1 className="page-title">배포·심사 파이프라인 관제</h1>
          <div className="page-meta"><span className="live-dot"></span>실시간 연동 · 마지막 업데이트 방금 전</div>
        </div>
        <div className="page-actions">
          <button className="btn-outline" onClick={() => showToast('기간을 최근 30일로 변경했습니다')}><i className="ph ph-calendar-blank"></i> 최근 30일</button>
          <button className="btn-primary" onClick={() => showToast('상태를 새로고침했습니다')}><i className="ph ph-arrows-clockwise"></i> 새로고침</button>
        </div>
      </header>

      <StatRow />

      <div className="pane-split">
        <div className="panel">
          <h3>빌드 버전별 파이프라인 진행 상태</h3>
          {BUILDS.map((b, bi) => (
            <div key={b.ver} className="build-row">
              <div className="build-top">
                <span className="build-ver">{b.ver}</span>
                <span className="build-date">{b.date}</span>
              </div>
              <div className="stage-track">
                {STAGES.map((s, i) => (
                  <div key={s} className={"stage-seg" + (i < b.stage - 1 ? ' done' : i === b.stage - 1 ? ' active' : '')} style={{animationDelay:(bi*0.1+i*0.05)+'s'}}></div>
                ))}
              </div>
              <div className="stage-labels">{STAGES.map(s => <span key={s}>{s}</span>)}</div>
            </div>
          ))}
        </div>

        <aside className="panel priority-rail">
          <h3>우선 대응 큐</h3>
          {queue.map(q => (
            <div key={q.id} className={"queue-item" + (q.resolved ? ' resolved' : '')}>
              <span className="tag">{q.tag}</span>
              <div className="name">{q.name}</div>
              <div className="sub">{q.sub}</div>
              <button onClick={() => toggleQueue(q.id)}>{q.resolved ? '다시 열기' : '대응 완료 처리'}</button>
            </div>
          ))}
        </aside>
      </div>

      <section className="secondary-row">
        <div className="panel">
          <h3>월별 제출 성공률</h3>
          <div className="chart-wrap">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={USAGE_DATA.slice(0,7)}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e5e5" />
                <XAxis dataKey="day" tick={{fontSize:11}} stroke="#a3a3a3" />
                <YAxis tick={{fontSize:11}} stroke="#a3a3a3" />
                <Tooltip />
                <Line type="monotone" dataKey="진입" stroke="#2563eb" strokeWidth={2} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="panel">
          <h3>리젝 사유 분포</h3>
          <div className="chart-wrap">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={SUSPEND_DATA} dataKey="value" nameKey="name" innerRadius={50} outerRadius={80} paddingAngle={3}>
                  {SUSPEND_DATA.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      </section>

      <section className="panel" style={{marginTop:16}}>
        <h3>전체 빌드 심사 이력</h3>
        <nav className="tab-bar" data-tabs>
          {HISTORY_TABS.map(t => (
            <button key={t} className={"tab" + (historyTab === t ? ' active' : '')} onClick={() => setHistoryTab(t)}>{t}</button>
          ))}
        </nav>
        <table className="data-table">
          <thead>
            <tr><th>버전</th><th>제출일</th><th>심사 소요</th><th>상태</th></tr>
          </thead>
          <tbody>
            {filteredHistory.map(b => (
              <tr key={b.ver} onClick={() => showToast(`${b.ver} 상세 이력을 확인합니다`)}>
                <td style={{fontFamily:'ui-monospace,Menlo,monospace',fontWeight:600}}>{b.ver}</td>
                <td>{b.submitted}</td>
                <td>{b.reviewDays}</td>
                <td>
                  <span className={"badge " + (b.status === '배포완료' ? 'live' : b.status === '심사중' ? 'canary' : 'draft')}>{b.status}</span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>
    </React.Fragment>
  );
}

function PipelineScreen({ showToast }){
  const [checked, setChecked] = useState(new Array(CHECKLIST.length).fill(false));
  const [sortMode, setSortMode] = useState('deadline');
  const doneCount = checked.filter(Boolean).length;
  const pct = Math.round((doneCount / CHECKLIST.length) * 100);

  const sorted = useMemo(() => {
    const arr = [...REJECT_HISTORY];
    if (sortMode === 'deadline') arr.sort((a,b) => parseInt(a.deadline.replace('D-','')) - parseInt(b.deadline.replace('D-','')));
    else arr.sort((a,b) => b.freq - a.freq);
    return arr;
  }, [sortMode]);

  function toggle(i){
    setChecked(c => c.map((v, idx) => idx === i ? !v : v));
  }

  return (
    <React.Fragment>
      <header className="page-header">
        <div>
          <h1 className="page-title">심사 제출 체크리스트 자동화</h1>
          <div className="page-meta">Seller Office 제출 필수 항목 자동 검증</div>
        </div>
        <button className="btn-primary" disabled={pct < 100} onClick={() => showToast('제출 요청이 접수되었습니다')}>
          <i className="ph ph-paper-plane-tilt"></i> 제출하기
        </button>
      </header>

      <div className="panel" style={{marginBottom:22}}>
        <h3>제출 준비 상태 <span style={{color:'var(--dim)',fontWeight:500}}>{doneCount}/{CHECKLIST.length}</span></h3>
        <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}></div></div>
        <div className="checklist">
          {CHECKLIST.map((c, i) => (
            <div key={c} className={"check-item" + (checked[i] ? ' done' : '')} onClick={() => toggle(i)}>
              <span className={"checkbox" + (checked[i] ? ' checked' : '')}>{checked[i] && <i className="ph ph-check" style={{fontSize:13}}></i>}</span>
              <span style={{fontSize:13,fontWeight:500}}>{c}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="panel">
        <h3>
          리젝 이력 우선순위 큐
          <span style={{display:'flex',gap:6}}>
            <button className="btn-outline" style={{padding:'5px 10px',fontSize:12}} onClick={() => setSortMode('deadline')}>마감임박순</button>
            <button className="btn-outline" style={{padding:'5px 10px',fontSize:12}} onClick={() => setSortMode('freq')}>재발빈도순</button>
          </span>
        </h3>
        {sorted.map(r => (
          <div key={r.reason} className="reject-card">
            <div>
              <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{r.reason}</div>
              <div style={{fontSize:12,color:'var(--dim)'}}>재발 {r.freq}회</div>
            </div>
            <span className="badge canary">{r.deadline}</span>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

  return (
    <React.Fragment>
      <header className="page-header">
        <div>
          <h1 className="page-title">TV 앱 사용 현황 및 성능 분석</h1>
          <div className="page-meta">화면 진입 빈도 · Suspend/Resume 발생 추이 · 렌더링 성능</div>
        </div>
      </header>

      <div className="panel" style={{marginBottom:16}}>
        <h3>일별 화면 진입 빈도 (최근 14일)</h3>
        <div className="chart-wrap" style={{height:260}}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={USAGE_DATA}>
              <CartesianGrid strokeDasharray="3 3" stroke="#e5e5e5" />
              <XAxis dataKey="day" tick={{fontSize:11}} stroke="#a3a3a3" />
              <YAxis tick={{fontSize:11}} stroke="#a3a3a3" />
              <Tooltip />
              <Line type="monotone" dataKey="진입" stroke="#2563eb" strokeWidth={2} dot={{r:3}} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="secondary-row">
        <div className="panel">
          <h3>Suspend/Resume 처리 분포</h3>
          <div className="chart-wrap">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={SUSPEND_DATA} dataKey="value" nameKey="name" outerRadius={80} label={{fontSize:11}}>
                  {SUSPEND_DATA.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="panel">
          <h3>성능 이상 감지 구간</h3>

              사전 집계된 Materialized View를 조회해 렌더링 프레임 저하 구간을 표시합니다.
            </div>
            {[{t:'08.24 21:10', d:'프레임 저하 감지 (12fps, 4초 지속)'}, {t:'08.26 20:40', d:'메모리 회수 지연 (GC 700ms)'}, {t:'08.28 22:05', d:'정상 범위 복귀'}].map((e,i) => (
              <div key={i} style={{display:'flex',gap:10,fontSize:12,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{color:'var(--dim)',flexShrink:0,fontFamily:'ui-monospace,Menlo,monospace'}}>{e.t}</span>
                <span>{e.d}</span>

          </div>
        </div>
      </div>

function ContentScreen({ showToast }){
  const [releases, setReleases] = useState(RELEASES);
  const [selected, setSelected] = useState(null);
  const [canaryVal, setCanaryVal] = useState(0);
  const [confirmRollback, setConfirmRollback] = useState(false);

  function openRelease(r){
    setSelected(r);
    setCanaryVal(r.canary);
  }
  function applyCanary(){
    setReleases(rs => rs.map(r => r.id === selected.id ? { ...r, canary: canaryVal, status: canaryVal >= 100 ? 'live' : (canaryVal > 0 ? 'canary' : 'draft') } : r));
    showToast(`${selected.ver} 배포 비율을 ${canaryVal}%로 조정했습니다`);
    setSelected(null);
  }
  function rollback(){
    setReleases(rs => rs.map(r => r.id === selected.id ? { ...r, canary:0, status:'draft' } : r));
    showToast(`${selected.ver} 릴리스가 이전 버전으로 롤백되었습니다`);
    setConfirmRollback(false);
    setSelected(null);
  }

  return (
    <React.Fragment>
      <header className="page-header">
        <div>
          <h1 className="page-title">다중 콘텐츠 업데이트 및 릴리스 관리</h1>
          <div className="page-meta">릴리스 단위 버전 관리 · 단계적 배포(카나리) 제어</div>
        </div>
        <button className="btn-primary" onClick={() => showToast('신규 릴리스 초안이 생성되었습니다')}><i className="ph ph-plus"></i> 신규 릴리스</button>
      </header>

      <div className="panel">
        <table className="data-table">
          <thead>
            <tr><th>버전</th><th>콘텐츠 그룹</th><th>배포 비율</th><th>상태</th><th></th></tr>
          </thead>
          <tbody>
            {releases.map(r => (
              <tr key={r.id} onClick={() => openRelease(r)}>
                <td style={{fontFamily:'ui-monospace,Menlo,monospace',fontWeight:600}}>{r.ver}</td>
                <td>{r.group}</td>
                <td>{r.canary}%</td>
                <td><span className={"badge " + r.status}>{r.status === 'live' ? '전체 배포' : r.status === 'canary' ? '단계적 배포' : '초안'}</span></td>
                <td style={{textAlign:'right',color:'var(--dim)'}}><i className="ph ph-caret-right"></i></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {selected && !confirmRollback && (
        <div className="modal-backdrop" onClick={() => setSelected(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{selected.ver} 릴리스 관리</h3>
            <div style={{fontSize:13,color:'var(--dim)'}}>{selected.group}</div>
            <div className="field-label">릴리스 노트</div>
            <textarea defaultValue={`${selected.ver} — 콘텐츠 렌더링 안정성 개선 및 신규 카테고리 추가`}></textarea>
            <div className="field-label">단계적 배포(카나리) 비율 — {canaryVal}%</div>
            <input type="range" min="0" max="100" step="5" value={canaryVal} onChange={e => setCanaryVal(Number(e.target.value))} />
            <div className="modal-actions">
              <button className="btn-danger" onClick={() => setConfirmRollback(true)}><i className="ph ph-arrow-counter-clockwise"></i> 롤백</button>
              <button className="btn-outline" onClick={() => setSelected(null)}>취소</button>
              <button className="btn-primary" onClick={applyCanary}>배포 비율 적용</button>
            </div>
          </div>
        </div>
      )}

      {confirmRollback && (
        <div className="modal-backdrop" onClick={() => setConfirmRollback(false)}>
          <div className="modal" style={{width:380}} onClick={e => e.stopPropagation()}>
            <h3>정말 롤백하시겠습니까?</h3>
            <p style={{fontSize:13,color:'var(--dim)',lineHeight:1.6}}>{selected.ver}이(가) 이전 콘텐츠 버전으로 즉시 전환됩니다. 배포 비율은 0%로 초기화됩니다.</p>
            <div className="modal-actions">
              <button className="btn-outline" onClick={() => setConfirmRollback(false)}>취소</button>
              <button className="btn-danger" onClick={rollback}>롤백 확정</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function Toast({ message }){
  return <div className="toast">{message}</div>;
}

function App(){
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);

  function showToast(msg){
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  return (
    <div className="shell" data-archetype="stripe-multipane">
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        <div className="page">
          {view === 'main' && <MainScreen showToast={showToast} />}
          {view === 'pipeline' && <PipelineScreen showToast={showToast} />}
          {view === 'analytics' && <AnalyticsScreen />}
          {view === 'content' && <ContentScreen showToast={showToast} />}
        </div>
      </div>
      {toast && <Toast message={toast} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
