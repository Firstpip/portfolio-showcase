<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그로우마켓 셀러센터 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
  :root{
    --primary:#202020; --secondary:#e8e8e8; --accent:#0091ff;
    --bg:#ffffff; --surface:#f8f9fa; --text:#202020; --text2:#8a8a8a; --text3:#b3b3b3;
    --border:#e8e8e8; --border-strong:#d4d4d4; --radius:12px; --radius-sm:6px;
    --green:#00c07a; --amber:#ff9f2d; --red:#e5484d; --violet:#6647f0;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    letter-spacing:-0.01em;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes fadeInScale{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:scale(1)}}
  @keyframes slideInRight{from{transform:translateX(28px); opacity:0} to{transform:translateX(0); opacity:1}}
  @keyframes cardIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,145,255,.45)} 70%{box-shadow:0 0 0 9px rgba(0,145,255,0)} 100%{box-shadow:0 0 0 0 rgba(0,145,255,0)}}
  @keyframes toastIn{from{transform:translateY(12px); opacity:0} to{transform:translateY(0); opacity:1}}

  /* ── sidebar ── */
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:260px;
    background:var(--bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:40;
  }
  .sidebar-brand{
    height:64px; display:flex; align-items:center; gap:10px; padding:0 16px;
    border-bottom:1px solid var(--border); position:relative;
  }
  .brand-mark-ring{width:34px;height:34px;border-radius:11px;flex-shrink:0;padding:2px;
    background:conic-gradient(from 90deg,#6647f0,#0091ff,#6ee7b7,#0091ff,#6647f0);
    animation:conicSpin 3.2s linear infinite;}
  .brand-mark{width:100%;height:100%;border-radius:9px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;}
  @keyframes conicSpin{to{transform:rotate(360deg);}}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-size:14px;font-weight:700;}
  .brand-text span{font-size:11px;color:var(--text2);}
  .brand-switch{margin-left:auto;background:transparent;border:none;color:var(--text3);padding:4px;border-radius:6px;}
  .brand-switch:hover{background:var(--surface);}
  .store-menu{position:absolute; top:60px; left:16px; right:16px; background:#fff; border:1px solid var(--border);
    border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.08); padding:6px; z-index:50; animation:fadeInScale .12s ease-out;}
  .store-menu-item{padding:8px 10px; border-radius:6px; font-size:13px; display:flex; align-items:center; gap:8px;}
  .store-menu-item:hover{background:var(--surface);}
  .cmdk-hint{
    margin:12px 16px 4px; padding:8px 10px; border:1px solid var(--border); border-radius:9px;
    background:var(--surface); display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--text2); border-width:1px;
  }
  .cmdk-hint kbd{background:#fff; border:1px solid var(--border-strong); border-radius:5px; padding:1px 6px; font-size:11px; color:var(--text);}
  .sidebar-nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px;}
  .sidebar-link{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
    font-size:13.5px; color:var(--text2); background:transparent; border:none; text-align:left; width:100%;
    border-left:3px solid transparent; transition:background .12s, color .12s;
  }
  .sidebar-link i{font-size:17px; width:18px;}
  .sidebar-link:hover{background:var(--surface); color:var(--text);}
  .sidebar-link.active{background:var(--surface); color:var(--primary); font-weight:600; border-left-color:var(--accent);}
  .sidebar-section{margin-top:14px; padding:0 12px;}
  .sidebar-section-title{font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; padding:4px 12px 6px;}
  .sidebar-user{
    margin-top:auto; border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; gap:10px;
    position:relative;
  }
  .avatar-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0091ff,#6647f0);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
  .user-meta{display:flex; flex-direction:column; line-height:1.2; overflow:hidden;}
  .user-meta b{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-meta span{font-size:11px; color:var(--text3);}
  .user-menu-btn{margin-left:auto; background:transparent; border:none; color:var(--text3); padding:4px;}
  .user-menu{position:absolute; bottom:56px; left:14px; right:14px; background:#fff; border:1px solid var(--border);
    border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.1); padding:6px; animation:fadeInScale .12s ease-out; z-index:50;}

  /* ── main / topbar ── */
  .main-wrap{margin-left:260px; min-height:100vh; flex:1; min-width:0; width:calc(100% - 260px); display:flex; flex-direction:column;}
  .topbar{
    height:56px; border-bottom:1px solid var(--border); display:flex; align-items:center;
    justify-content:space-between; padding:0 24px; position:sticky; top:0; background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px); z-index:20;
  }
  .breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text3);}
  .breadcrumb .current{color:var(--text); font-weight:600;}
  .breadcrumb .divider{color:var(--border-strong);}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .btn-cmdk{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--text2); display:flex; align-items:center; gap:6px;}
  .btn-primary{background:var(--primary); color:#fff; border:none; border-radius:9999px; padding:9px 18px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .btn-primary:hover{background:#000;}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--text); border-radius:9999px; padding:8px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .btn-outline:hover{border-color:var(--accent); color:var(--accent);}
  .btn-ghost{background:transparent; border:none; color:var(--text2); font-size:13px; padding:6px 10px; border-radius:8px;}
  .btn-ghost:hover{background:var(--surface); color:var(--text);}
  .content{padding:24px; max-width:1440px;}

  /* ── status strip ── */
  .status-strip{display:flex; align-items:center; gap:24px; padding:18px 22px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--surface); margin-bottom:20px; flex-wrap:wrap;}
  .stat-big{display:flex; flex-direction:column; gap:2px;}
  .stat-big .num{font-size:30px; font-weight:800; letter-spacing:-0.02em; line-height:1.05;}
  .stat-big.hero .num{font-size:46px; letter-spacing:-0.035em;}
  .stat-big .lbl{font-size:12px; color:var(--text2);}
  .mint-tag{display:inline-flex; align-items:center; gap:4px; background:#e9fbf3; color:#0a9463; font-size:11px; font-weight:700; padding:2px 9px; border-radius:9999px; margin-left:8px; vertical-align:middle;}
  .plan-badge{font-size:10.5px; font-weight:700; color:var(--violet); background:#f1edfe; padding:2px 8px; border-radius:9999px; margin-left:6px;}
  .divider-v{width:1px; height:34px; background:var(--border-strong);}

  /* ── board / matrix-side (kanban-flow composition) ── */
  .board-layout{display:flex; gap:20px; align-items:flex-start;}
  .board-col-title{font-size:16px; font-weight:700; margin:0 0 14px;}
  .board{flex:1; min-width:0; display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .kcol{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-height:280px;}
  .kcol-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .kcol-head b{font-size:12.5px;}
  .kcol-count{background:#fff; border:1px solid var(--border); border-radius:9999px; font-size:11px; padding:1px 8px; color:var(--text2);}
  .kcard{background:#fff; border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
    animation:cardIn .3s ease-out both; transition:transform .12s, box-shadow .12s;}
  .kcard:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.06); border-color:var(--border-strong);}
  .kcard .oid{font-size:10.5px; color:var(--text3); font-weight:600;}
  .kcard .otitle{font-size:12.5px; font-weight:600; margin:3px 0; line-height:1.35;}
  .kcard .ometa{font-size:11px; color:var(--text2); display:flex; justify-content:space-between;}

  .matrix-side{width:320px; flex-shrink:0; border:1px solid var(--border); border-radius:var(--radius); padding:16px; background:#fff;}
  .priority-item{border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;}
  .priority-item .ptag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9999px; display:inline-block; margin-bottom:6px;}
  .ptag.warn{background:#fff3e0; color:#b5690a;}
  .ptag.danger{background:#fdeceb; color:var(--red);}
  .ptag.info{background:#e8f4ff; color:var(--accent);}
  .priority-item p{margin:0 0 8px; font-size:12.5px; line-height:1.45;}
  .priority-item .pbtn{width:100%; border:1px solid var(--border-strong); background:#fff; border-radius:8px; padding:7px; font-size:12px; font-weight:600;}
  .priority-item .pbtn:hover{border-color:var(--primary);}

  .sync-badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--green); font-weight:600;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulseDot 1.8s infinite;}

  /* ── section shells ── */
  .panel{border:1px solid var(--border); border-radius:var(--radius); background:#fff; padding:20px; margin-bottom:18px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .panel-head h2{font-size:17px; margin:0; font-weight:700;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:9px; padding:7px 12px; min-width:220px;}
  .search-box input{border:none; outline:none; font-size:13px; width:100%;}
  .chip{border:1px solid var(--border); background:#fff; border-radius:9999px; padding:6px 14px; font-size:12.5px; color:var(--text2);}
  .chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11.5px; color:var(--text2); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.02em;}
  td{padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr.rowclick{cursor:pointer; transition:background .12s;}
  tr.rowclick:hover{background:var(--surface);}
  .thumb{width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0;}
  .prod-cell{display:flex; align-items:center; gap:10px;}
  .badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:9999px; display:inline-block;}
  .badge.on{background:#e6f9f1; color:var(--green);}
  .badge.review{background:#fff3e0; color:#b5690a;}
  .badge.reject{background:#fdeceb; color:var(--red);}
  .badge.soldout{background:var(--secondary); color:var(--text2);}
  .badge.wait{background:#eef1ff; color:var(--violet);}

  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .tab{padding:10px 4px; margin-right:22px; font-size:13.5px; color:var(--text2); border-bottom:2px solid transparent; font-weight:600;}
  .tab.active{color:var(--primary); border-bottom-color:var(--primary);}

  /* ── modal / drawer ── */
  .overlay{position:fixed; inset:0; background:rgba(20,20,20,.42); display:flex; align-items:center; justify-content:center;
    z-index:100; animation:fadeIn .15s ease-out;}
  .modal{background:#fff; border-radius:16px; width:560px; max-width:92vw; max-height:86vh; overflow:auto;
    animation:fadeInScale .18s ease-out; box-shadow:0 24px 64px rgba(0,0,0,.18);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff;}
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-close{background:var(--surface); border:none; border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; position:sticky; bottom:0; background:#fff;}
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--text2); display:block; margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:13.5px; outline:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .step-dots{display:flex; gap:6px; margin-bottom:16px;}
  .step-dot{width:28px; height:4px; border-radius:9999px; background:var(--border);}
  .step-dot.active{background:var(--primary);}
  .ai-box{border:1px dashed var(--border-strong); border-radius:10px; padding:14px; background:var(--surface);}
  .ai-loading{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--accent);}
  .spinner{width:14px; height:14px; border:2px solid #cfe8ff; border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .drawer-overlay{position:fixed; inset:0; background:rgba(20,20,20,.35); z-index:100; animation:fadeIn .15s ease-out;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:#fff; z-index:101;
    box-shadow:-16px 0 40px rgba(0,0,0,.12); animation:slideInRight .2s ease-out; overflow:auto;}
  .timeline{margin:16px 0;}
  .tl-step{display:flex; gap:10px; padding-bottom:18px; position:relative;}
  .tl-step::before{content:''; position:absolute; left:8px; top:20px; bottom:0; width:1.5px; background:var(--border);}
  .tl-step:last-child::before{display:none;}
  .tl-dot{width:17px; height:17px; border-radius:50%; background:var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; z-index:1;}
  .tl-dot.done{background:var(--green);}
  .tl-dot.now{background:var(--accent); animation:pulseDot 1.8s infinite;}
  .tl-dot i{color:#fff; font-size:10px;}
  .tl-text b{font-size:13px; display:block;}
  .tl-text span{font-size:11.5px; color:var(--text2);}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--primary); color:#fff; padding:13px 20px;
    border-radius:11px; font-size:13.5px; z-index:200; animation:toastIn .25s ease-out; display:flex; align-items:center; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,.2);}

  .cmdk-overlay{position:fixed; inset:0; background:rgba(20,20,20,.5); z-index:150; display:flex; justify-content:center;
    padding-top:12vh; animation:fadeIn .12s ease-out;}
  .cmdk-modal{width:560px; max-width:90vw; background:#fff; border-radius:14px; box-shadow:0 24px 64px rgba(0,0,0,.25); height:fit-content;
    animation:fadeInScale .15s ease-out; overflow:hidden;}
  .cmdk-input{width:100%; border:none; border-bottom:1px solid var(--border); padding:16px 18px; font-size:15px; outline:none;}
  .cmdk-results{max-height:340px; overflow:auto; padding:8px;}
  .cmdk-group-title{font-size:11px; color:var(--text3); text-transform:uppercase; padding:8px 10px 4px; letter-spacing:.04em;}
  .cmdk-item{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; font-size:13.5px; width:100%; background:transparent; border:none; text-align:left;}
  .cmdk-item:hover{background:var(--surface);}
  .cmdk-item .kbd{margin-left:auto; font-size:11px; color:var(--text3); border:1px solid var(--border); border-radius:5px; padding:1px 6px;}

  .chart-wrap{position:relative; height:220px; width:100%;}
  .exp-row{background:var(--surface);}
  .exp-row td{font-size:12px; color:var(--text2);}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="root"></div>
<script type="text/babel">

function won(n){ return n.toLocaleString('ko-KR') + '원'; }

/* ── small building blocks ── */
function Badge({status}){
  const map = { '판매중':'on','심사중':'review','반려':'reject','품절':'soldout','정산예정':'wait','지급완료':'on' };
  return <span className={`badge ${map[status]||'on'}`}>{status}</span>;
}

function Toast({msg, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><i className="ti ti-circle-check" style={{color:'#6ee7b7'}}></i>{msg}</div>;
}

function Modal({title, onClose, children, footer, width}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={width?{width}:null} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function Drawer({title, onClose, children}){
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="modal-head"><h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </React.Fragment>
  );
}

function ProductWizard({onClose, onSubmit}){
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({ name:'', cat:'주방용품', price:'', options:[{name:'기본', stock:''}], desc:'' });
  const [aiLoading, setAiLoading] = useState(false);
  const addOption = ()=> setForm(f=>({...f, options:[...f.options, {name:'', stock:''}]}));
  const updOption = (i,k,v)=> setForm(f=>{ const o=[...f.options]; o[i]={...o[i],[k]:v}; return {...f, options:o}; });
  const genAI = ()=>{
    setAiLoading(true);
    setTimeout(()=>{
      setForm(f=>({...f, desc:`${f.name || '해당 상품'}은(는) ${f.cat} 카테고리의 인기 조합으로, 내구성과 사용 편의성을 함께 고려한 구성입니다. 도메인 지식DB를 참고해 소재·용도·세척 방법 등 핵심 정보를 자동으로 정리한 초안입니다.`}));
      setAiLoading(false);
    }, 1400);
  };
  return (
    <Modal title="상품 등록" onClose={onClose} width="640px"
      footer={<React.Fragment>
        {step>0 && <button className="btn-outline" onClick={()=>setStep(s=>s-1)}>이전</button>}
        {step<2 && <button className="btn-primary" onClick={()=>setStep(s=>s+1)}>다음</button>}
        {step===2 && <button className="btn-primary" onClick={()=>onSubmit(form)}>심사 요청</button>}
      </React.Fragment>}>
      <div className="step-dots">
        {[0,1,2].map(i=><div key={i} className={`step-dot ${i<=step?'active':''}`}></div>)}
      </div>
      {step===0 && (
        <React.Fragment>
          <div className="field"><label>상품명</label><input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="예: 스테인리스 다용도 볼 5종 세트" /></div>
          <div className="field-row">
            <div className="field"><label>카테고리</label>
              <select value={form.cat} onChange={e=>setForm({...form, cat:e.target.value})}>
                <option>주방용품</option><option>조리도구</option><option>수납정리</option>
              </select>
            </div>
            <div className="field"><label>판매가</label><input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} placeholder="19900" /></div>
          </div>
        </React.Fragment>
      )}
      {step===1 && (
        <React.Fragment>
          <label style={{fontSize:12.5,fontWeight:600,color:'var(--text2)'}}>옵션 · 재고</label>
          {form.options.map((o,i)=>(
            <div className="field-row" key={i} style={{marginTop:8}}>
              <div className="field"><input placeholder="옵션명 (예: 화이트)" value={o.name} onChange={e=>updOption(i,'name',e.target.value)} /></div>
              <div className="field" style={{maxWidth:120}}><input type="number" placeholder="재고" value={o.stock} onChange={e=>updOption(i,'stock',e.target.value)} /></div>
            </div>
          ))}
          <button className="btn-ghost" onClick={addOption}><i className="ti ti-plus" style={{marginRight:4}}></i>옵션 추가</button>
        </React.Fragment>
      )}
      {step===2 && (
        <React.Fragment>
          <div className="field"><label>상세 설명</label>
            <textarea rows="5" value={form.desc} onChange={e=>setForm({...form, desc:e.target.value})} placeholder="상품 설명을 입력하거나 AI 입력 보조를 사용하세요"></textarea>
          </div>
          <div className="ai-box">
            {!aiLoading ? (
              <button className="btn-outline" onClick={genAI}><i className="ti ti-sparkles" style={{marginRight:6}}></i>AI로 설명 초안 생성</button>
            ) : (
              <div className="ai-loading"><span className="spinner"></span>도메인 지식DB 기반 설명 초안을 생성하는 중…</div>
            )}
          </div>
        </React.Fragment>
      )}
    </Modal>
  );
}

    <div className="panel">
      <div className="panel-head"><h2>주문·배송 처리 및 상태 동기화</h2>
        <span className="sync-badge"><span className="sync-dot"></span>실시간 동기화</span>
      </div>
      <div className="tabs">
        {tabs.map(t=>(<div key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)} style={{cursor:'pointer'}}>{t}</div>))}
      </div>
      {tab!=='취소·반품·교환' ? (
        <table>
          <thead><tr><th>주문번호</th><th>구매자</th><th>상품</th><th>금액</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {orders.filter(o=>tab==='전체'||o.stage===tab).map(o=>(
              <tr key={o.id} className="rowclick" onClick={()=>openModal('orderDetail', o)}>
                <td>{o.id}</td><td>{o.buyer}</td><td>{o.item}</td><td>{won(o.amount)}</td>
                <td><span className="badge wait">{o.stage}</span></td>
                <td onClick={e=>e.stopPropagation()}>
                  {o.stage==='신규접수' && <button className="btn-outline" onClick={()=>setInvoiceOrder(o)}>송장 등록</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      ) : (
        <table>
          <thead><tr><th>케이스</th><th>구매자</th><th>상품</th><th>유형</th><th>사유</th><th>상태</th></tr></thead>
          <tbody>
            {CLAIMS.map(c=>(
              <tr key={c.id} className="rowclick" onClick={()=>showToast(`${c.id} 케이스 상세는 준비 중입니다`)}>
                <td>{c.id}</td><td>{c.buyer}</td><td>{c.item}</td><td>{c.type}</td><td>{c.reason}</td><td><span className="badge review">{c.status}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      {invoiceOrder && <InvoiceModal order={invoiceOrder} onClose={()=>setInvoiceOrder(null)} onSubmit={(inv)=>applyInvoice(invoiceOrder.id, inv)} />}
    </div>
  );
}

/* ── Settlement view ── */
function SettlementDetail({row, onClose}){
  const [open, setOpen] = useState(false);
  return (
    <Modal title={row.id} onClose={onClose} width="520px">
      <div className="field"><label>정산 기간</label><div>{row.period}</div></div>
      <div className="field-row">
        <div className="field"><label>매출 합계</label><div>{won(row.gross)}</div></div>
        <div className="field"><label>수수료 공제</label><div>-{won(row.fee)}</div></div>
      </div>
      <div className="field"><label>지급 예정액</label><div style={{fontSize:20,fontWeight:800}}>{won(row.net)}</div></div>
      <button className="btn-ghost" onClick={()=>setOpen(v=>!v)}><i className={`ti ${open?'ti-chevron-up':'ti-chevron-down'}`} style={{marginRight:4}}></i>수수료 계산 근거 펼쳐보기</button>
      {open && (
        <table style={{marginTop:8}}>
          <tbody>
            <tr className="exp-row"><td>판매 수수료 (12%)</td><td style={{textAlign:'right'}}>{won(Math.round(row.gross*0.12))}</td></tr>
            <tr className="exp-row"><td>PG 결제 수수료 (2.9%)</td><td style={{textAlign:'right'}}>{won(Math.round(row.gross*0.029))}</td></tr>
            <tr className="exp-row"><td>배송비 정산 공제</td><td style={{textAlign:'right'}}>{won(row.fee - Math.round(row.gross*0.149))}</td></tr>
          </tbody>
        </table>
      )}
    </Modal>
  );
}

function SettlementView({openModal, showToast}){
  const [downloading, setDownloading] = useState(false);
  const doDownload = ()=>{
    setDownloading(true);
    setTimeout(()=>{ setDownloading(false); showToast('정산 내역 엑셀 다운로드가 완료되었습니다'); }, 1200);
  };
  return (
    <div>
      <div className="panel">
        <div className="panel-head"><h2>정산 조회 및 지급 내역 관리</h2>
          <button className="btn-outline" onClick={doDownload} disabled={downloading}>
            {downloading ? <React.Fragment><span className="spinner"></span>생성 중…</React.Fragment> : <React.Fragment><i className="ti ti-download"></i>엑셀 다운로드</React.Fragment>}
          </button>
        </div>
        <div className="chart-wrap">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={SETTLE_TREND} margin={{top:10,right:10,left:-10,bottom:0}}>
              <CartesianGrid stroke="#f0f0f0" vertical={false}/>
              <XAxis dataKey="m" tick={{fontSize:12, fill:'#8a8a8a'}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fontSize:11, fill:'#b3b3b3'}} axisLine={false} tickLine={false} width={40} tickFormatter={v=>v+'만'} />
              <Tooltip formatter={v=>won(v*10000)} labelStyle={{fontSize:12}} contentStyle={{fontSize:12, borderRadius:8, border:'1px solid #e8e8e8'}}/>
              <Line type="monotone" dataKey="v" stroke="#0091ff" strokeWidth={2.5} dot={{r:3}} activeDot={{r:5}} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="panel">
        <h2 style={{margin:'0 0 14px', fontSize:17}}>정산 내역</h2>
        <table>
          <thead><tr><th>정산번호</th><th>기간</th><th>매출</th><th>수수료</th><th>지급액</th><th>상태</th></tr></thead>
          <tbody>
            {SETTLE_ROWS.map(r=>(
              <tr key={r.id} className="rowclick" onClick={()=>openModal('settlementDetail', r)}>
                <td>{r.id}</td><td>{r.period}</td><td>{won(r.gross)}</td><td>-{won(r.fee)}</td><td style={{fontWeight:700}}>{won(r.net)}</td>
                <td><Badge status={r.status} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <h2 style={{margin:'0 0 14px', fontSize:17}}>전자세금계산서 발급 신청</h2>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <p style={{fontSize:13, color:'var(--text2)', margin:0}}>발급 신청 상태까지 화면에서 확인하고, 실제 발행은 표준 연동 인터페이스로 분리해 확장 시 연동만 추가하면 되는 구조로 설계합니다.</p>
          <button className="btn-outline" onClick={()=>openModal('taxInvoice')}>발급 신청</button>
        </div>
      </div>
    </div>
  );
}

/* ── App root ── */
function App(){
  const [view, setView] = useState('main');
  const [modal, setModal] = useState(null);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const openModal = (type, payload)=> {
    if(type==='cmdk'){ setCmdkOpen(true); return; }
    setModal({type, payload});
  };
  const closeModal = ()=> setModal(null);
  const showToast = (msg)=> setToast(msg);

  useEffect(()=>{
    const onKey = e => { if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(true); } };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[]);

  const labels = { main:'대시보드', product:'상품 관리', order:'주문·배송', settlement:'정산' };

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView} openModal={openModal} />
      <div className="main-wrap">
        <div className="topbar">
          <div className="breadcrumb"><span>홈</span><span className="divider">/</span><span className="current">{labels[view]}</span></div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><i className="ti ti-command"></i>⌘ K</button>
            <button className="btn-primary" onClick={()=>openModal('productWizard')}><i className="ti ti-plus"></i>빠른 상품 등록</button>
          </div>
        </div>
        <div className="content">
          {view==='main' && <Dashboard openModal={openModal} setView={setView} showToast={showToast} />}
          {view==='product' && <ProductView openModal={openModal} showToast={showToast} />}
          {view==='order' && <OrderView openModal={openModal} showToast={showToast} />}
          {view==='settlement' && <SettlementView openModal={openModal} showToast={showToast} />}
        </div>
      </div>

      {cmdkOpen && <CmdkOverlay onClose={()=>setCmdkOpen(false)} onNavigate={(go)=>{
        setCmdkOpen(false);
        if(go==='product-add'){ setView('product'); setTimeout(()=>openModal('productWizard'), 50); }
        else setView(go);
      }} />}

      {modal && modal.type==='productWizard' && <ProductWizard onClose={closeModal} onSubmit={()=>{ closeModal(); showToast('상품이 심사 요청 상태로 등록되었습니다'); }} />}
      {modal && modal.type==='productDetail' && <ProductDetail product={modal.payload} onClose={closeModal} />}
      {modal && modal.type==='orderDetail' && <OrderDetail order={modal.payload} onClose={closeModal} />}
      {modal && modal.type==='settlementDetail' && <SettlementDetail row={modal.payload} onClose={closeModal} />}
      {modal && modal.type==='sellerProfile' && (
        <Modal title="판매자 정보" onClose={closeModal} footer={<button className="btn-primary" onClick={()=>{ closeModal(); showToast('판매자 정보가 저장되었습니다'); }}>저장</button>}>
          <div className="field-row">
            <div className="field"><label>사업자등록번호</label><input defaultValue="412-81-20394" /></div>
            <div className="field"><label>대표자명</label><input defaultValue="박서연" /></div>
          </div>
          <div className="field"><label>정산 계좌</label><input defaultValue="신한은행 110-482-039281" /></div>
          <div className="field"><label>사업자등록증 첨부</label>
            <div className="ai-box" style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5,color:'var(--text2)'}}><i className="ti ti-file-check" style={{color:'var(--green)'}}></i>사업자등록증_라이프키친.pdf 업로드됨</div>
          </div>
        </Modal>
      )}
      {modal && modal.type==='support' && (
        <Modal title="고객 응대" onClose={closeModal}>
          <p style={{fontSize:13, color:'var(--text2)', marginTop:0}}>상품 Q&amp;A, 주문문의, 리뷰를 한 화면에서 확인하고 답변합니다.</p>
          <div className="priority-item"><span className="ptag info">상품문의</span><p>"도마 사이즈가 다른 상품과 비교해 큰 편인가요?"</p></div>
          <div className="priority-item"><span className="ptag warn">미답변</span><p>"배송이 언제쯤 출발하나요?" (ORD-20260828-002)</p></div>
        </Modal>
      )}
      {modal && modal.type==='taxInvoice' && (
        <Modal title="전자세금계산서 발급 신청" onClose={closeModal} footer={<button className="btn-primary" onClick={()=>{ closeModal(); showToast('발급 신청이 접수되어 대기 상태로 등록되었습니다'); }}>신청하기</button>}>
          <div className="field"><label>대상 정산 건</label><select><option>STL-2608-01 ({won(740960)})</option><option>STL-2608-00 ({won(1068320)})</option></select></div>
          <p style={{fontSize:12.5, color:'var(--text2)'}}>신청 후 발급 상태는 대기 → 발급완료로 표시되며, 실제 발행은 외부 전자세금계산서 API 연동 지점으로 분리해 처리합니다.</p>
        </Modal>
      )}
      {modal && modal.type==='addStore' && (
        <Modal title="스토어 추가 신청" onClose={closeModal} footer={<button className="btn-primary" onClick={()=>{ closeModal(); showToast('스토어 추가 신청이 접수되었습니다'); }}>신청하기</button>}>
          <div className="field"><label>스토어명</label><input placeholder="예: 라이프키친 리빙관" /></div>
        </Modal>
      )}
      {modal && modal.type==='logout' && (
        <Modal title="로그아웃" onClose={closeModal} footer={<button className="btn-primary" onClick={closeModal}>확인</button>}>
          <p style={{fontSize:13.5}}>정말 로그아웃 하시겠습니까?</p>
        </Modal>
      )}

      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
