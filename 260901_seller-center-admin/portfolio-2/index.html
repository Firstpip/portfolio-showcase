<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커머스 통합 운영 어드민 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
  :root{
    --primary:#fa5d00; --primary-dark:#d94f00; --secondary:#c0bbb6; --accent:#1ef6da;
    --bg:#fff8f1; --surface:#ffffff; --glow:#fee3b5;
    --text:#1d1e1c; --text2:#615f5c; --text3:#8e8b87;
    --border:#e3d6c5; --border-strong:#c0bbb6;
    --green:#1ec98a; --amber:#d97a06; --red:#e0473f;
    --radius-card:20px; --radius-btn:16px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; letter-spacing:0.015em;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes riseIn{from{opacity:0; transform:translateY(14px) scale(.99)} to{opacity:1; transform:translateY(0) scale(1)}}
  @keyframes dropIn{from{transform:translateY(-16px); opacity:0} to{transform:translateY(0); opacity:1}}
  @keyframes glowPulse{0%{box-shadow:0 0 0 0 rgba(250,93,0,.28)} 70%{box-shadow:0 0 0 10px rgba(250,93,0,0)} 100%{box-shadow:0 0 0 0 rgba(250,93,0,0)}}
  @keyframes barGrow{from{transform:scaleX(0)} to{transform:scaleX(1)}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── topnav (no sidebar — bento-grid archetype) ── */
  .topnav{
    position:sticky; top:0; z-index:30; width:100%; background:rgba(255,248,241,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); height:72px; display:flex; align-items:center; padding:0 32px; gap:28px;
  }
  .tn-logo{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .tn-mark{width:34px;height:34px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .tn-brand{display:flex; flex-direction:column; line-height:1.1;}
  .tn-brand b{font-size:15px; font-weight:700;}
  .tn-brand span{font-size:11px; color:var(--text3);}
  .tn-tabs{display:flex; gap:6px; flex:1;}
  .tn-tab{padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--text2); border:none; background:transparent;}
  .tn-tab:hover{background:#ffffffa0;}
  .tn-tab.active{background:var(--text); color:#fff;}
  .tn-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text2); position:relative;}
  .icon-btn:hover{border-color:var(--primary); color:var(--primary);}
  .icon-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--red); border:1.5px solid var(--bg);}
  .admin-chip{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border-radius:999px; background:var(--surface); border:1px solid var(--border);}
  .admin-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fa5d00,#ffb35c); color:#fff; display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .admin-chip span{font-size:13px; font-weight:600;}

  .page-wrap{max-width:1440px; margin:0 auto; padding:32px;}
  .page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
  .page-head h1{font-size:28px; font-weight:700; margin:0; letter-spacing:0.42px;}
  .page-head p{margin:4px 0 0; font-size:14px; color:var(--text2);}
  .eyebrow{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--primary); margin:0 0 4px;}

  /* ── bento grid (main dashboard) ── */
  .bento{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  .tile{background:var(--surface); border-radius:var(--radius-card); padding:28px; box-shadow:6px 4px 24px rgba(250,166,0,.12);
    animation:riseIn .35s ease-out both; transition:transform .18s, box-shadow .18s;}
  .tile:hover{transform:scale(1.015); box-shadow:6px 6px 30px rgba(250,166,0,.22);}
  .tile-feature{grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column;}
  .tile-wide{grid-column:span 2;}
  .tile h3{font-size:15px; font-weight:600; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .tile .sub{font-size:12.5px; color:var(--text3); margin:0 0 16px;}
  .tile-num{font-size:44px; font-weight:700; letter-spacing:0.72px; line-height:1.05; margin:6px 0 2px;}
  .tile-delta{font-size:12.5px; display:flex; align-items:center; gap:4px; font-weight:600;}
  .tile-delta.up{color:var(--green);}
  .tile-delta.warn{color:var(--amber);}
  .period-chips{display:flex; gap:6px; margin-bottom:14px;}
  .pchip{border:1px solid var(--border); background:transparent; border-radius:999px; padding:5px 12px; font-size:12px; color:var(--text2);}
  .pchip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .chart-wrap{position:relative; flex:1; min-height:180px; width:100%;}
  .mini-chart{position:relative; height:120px; width:100%;}
  .mini-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .mini-list-row{display:flex; align-items:center; justify-content:space-between; font-size:13px;}
  .mini-bar-track{flex:1; height:8px; background:var(--bg); border-radius:999px; margin:0 10px; overflow:hidden;}
  .mini-bar-fill{height:100%; border-radius:999px; background:var(--primary); transform-origin:left; animation:barGrow .6s ease-out both;}
  .avatar-row{display:flex; margin-top:10px;}
  .avatar-row .av{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface); margin-left:-8px; display:flex;align-items:center;justify-content:center; color:#fff; font-size:10px; font-weight:700;}

  .btn-primary{background:var(--primary); color:#fff; border:none; border-radius:var(--radius-btn); padding:11px 22px; font-size:14px; font-weight:600; letter-spacing:0.015em; box-shadow:0 1px 4px rgba(0,0,0,.2); display:inline-flex; align-items:center; gap:8px;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-outline{background:var(--surface); border:1px solid var(--border-strong); color:var(--text); border-radius:var(--radius-btn); padding:9px 18px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn-outline:hover{border-color:var(--primary); color:var(--primary);}
  .btn-ghost{background:transparent; border:none; color:var(--text2); font-size:13px; padding:6px 10px; border-radius:10px;}
  .btn-ghost:hover{background:#ffffffa0;}
  .btn-danger-outline{background:#fff; border:1px solid #f3c6c1; color:var(--red); border-radius:var(--radius-btn); padding:9px 18px; font-size:13.5px; font-weight:600;}

  /* ── panel / table shells ── */
  .panel{background:var(--surface); border-radius:var(--radius-card); padding:28px; margin-bottom:22px; box-shadow:6px 4px 24px rgba(250,166,0,.1);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .panel-head h2{font-size:20px; margin:0; font-weight:600;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:var(--radius-btn); padding:9px 14px; min-width:240px; background:var(--bg);}
  .search-box input{border:none; outline:none; font-size:13.5px; width:100%; background:transparent;}
  .chip{border:1px solid var(--border-strong); background:var(--surface); border-radius:999px; padding:7px 16px; font-size:13px; color:var(--text2);}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:12px; color:var(--text3); font-weight:600; padding:0 12px 12px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.04em;}
  td{padding:14px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr.rowclick{cursor:pointer; transition:background .15s;}
  tr.rowclick:hover{background:var(--bg);}
  tr.mismatch{background:#fdf1ef;}
  .badge{font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px; display:inline-block;}
  .badge.pending{background:#fff1d6; color:var(--amber);}
  .badge.approved{background:#e3faf1; color:var(--green);}
  .badge.rejected{background:#fdeceb; color:var(--red);}
  .badge.review{background:#eef7f5; color:#0c9c85;}
  .badge.mismatch{background:#fdeceb; color:var(--red);}

  .checkbox{width:18px; height:18px; border-radius:6px; border:1.5px solid var(--border-strong); display:inline-flex; align-items:center; justify-content:center; background:var(--surface);}
  .checkbox.on{background:var(--primary); border-color:var(--primary); color:#fff;}

  .tabs{display:flex; gap:4px; margin-bottom:18px; background:var(--bg); padding:5px; border-radius:14px; width:fit-content;}
  .tab{padding:9px 18px; font-size:13.5px; color:var(--text2); border-radius:10px; font-weight:600; border:none; background:transparent;}
  .tab.active{background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .queue-item{border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:12px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:box-shadow .15s;}
  .queue-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .queue-item .qtype{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--bg); color:var(--primary); flex-shrink:0;}
  .queue-item .qmain{flex:1; min-width:0;}
  .queue-item .qmain b{font-size:14px; display:block;}
  .queue-item .qmain span{font-size:12px; color:var(--text3);}
  .queue-item .qdeadline{font-size:12px; font-weight:700; color:var(--red); flex-shrink:0;}

  .case-card{border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:10px; cursor:pointer;}
  .case-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}

  /* ── modal / drawer ── */
  .overlay{position:fixed; inset:0; background:rgba(29,30,28,.4); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .15s ease-out;}
  .modal{background:var(--surface); border-radius:22px; width:580px; max-width:92vw; max-height:86vh; overflow:auto; animation:riseIn .2s ease-out; box-shadow:0 30px 70px rgba(29,20,10,.22);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:22px 26px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);}
  .modal-head h3{margin:0; font-size:18px; font-weight:700;}
  .modal-close{background:var(--bg); border:none; border-radius:10px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
  .modal-body{padding:24px 26px;}
  .modal-foot{padding:18px 26px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--surface);}
  .field{margin-bottom:16px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--text2); display:block; margin-bottom:7px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--border-strong); border-radius:var(--radius-btn); padding:11px 14px; font-size:14px; outline:none; background:var(--bg);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary); outline:2px solid rgba(250,93,0,.15);}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}

  .drawer-overlay{position:fixed; inset:0; background:rgba(29,30,28,.35); z-index:100; animation:fadeIn .15s ease-out;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:var(--surface); z-index:101;
    box-shadow:-18px 0 44px rgba(29,20,10,.18); animation:dropIn .16s ease-out; overflow:auto;}
  .timeline{margin:14px 0;}
  .tl-step{display:flex; gap:12px; padding-bottom:18px; position:relative;}
  .tl-step::before{content:''; position:absolute; left:9px; top:22px; bottom:0; width:1.5px; background:var(--border);}
  .tl-step:last-child::before{display:none;}
  .tl-dot{width:19px; height:19px; border-radius:50%; background:var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; z-index:1;}
  .tl-dot.done{background:var(--green);}
  .tl-dot.now{background:var(--primary); animation:glowPulse 1.8s infinite;}
  .tl-dot i{color:#fff; font-size:11px;}
  .tl-text b{font-size:13.5px; display:block;}
  .tl-text span{font-size:12px; color:var(--text3);}
  .evidence-row{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:8px; font-size:12.5px;}

  .toast{position:fixed; top:24px; right:24px; background:var(--text); color:#fff; padding:14px 22px;
    border-radius:14px; font-size:13.5px; z-index:200; animation:dropIn .25s ease-out; display:flex; align-items:center; gap:10px; box-shadow:0 16px 36px rgba(0,0,0,.22);}

  .notif-panel{position:fixed; top:80px; right:32px; width:340px; background:var(--surface); border-radius:18px; box-shadow:0 20px 50px rgba(29,20,10,.2); z-index:60; padding:8px; animation:dropIn .16s ease-out;}
  .notif-item{padding:12px 14px; border-radius:12px; font-size:13px; display:flex; gap:10px;}
  .notif-item:hover{background:var(--bg);}
  .spinner{width:14px; height:14px; border:2px solid #ffe0c2; border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
</style>
</head>
<body data-archetype="bento-grid">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { ResponsiveContainer, AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, CartesianGrid } = Recharts;

function won(n){ return n.toLocaleString('ko-KR') + '원'; }

/* ── mock data ── */
const REVENUE_TREND = [
  { d:'8/22', v:412 }, { d:'8/23', v:388 }, { d:'8/24', v:501 }, { d:'8/25', v:467 },
  { d:'8/26', v:562 }, { d:'8/27', v:530 }, { d:'8/28', v:614 }, { d:'8/29', v:598 },
];
const CATEGORY_SALES = [
  { c:'주방용품', v:82 }, { c:'생활가전', v:64 }, { c:'수납정리', v:41 }, { c:'침구/패브릭', v:29 },
];
const CHANNEL_PIE = [
  { name:'검색 유입', value:44, color:'#fa5d00' }, { name:'앱 홈 노출', value:31, color:'#1ec98a' },
  { name:'프로모션', value:17, color:'#1ef6da' }, { name:'기타', value:8, color:'#c0bbb6' },
];

const REVIEW_QUEUE = [
  { id:'REV-3301', type:'입점심사', target:'홈리빙스토어', detail:'사업자 정보 · 증빙서류 3건', deadline:'D-1' },
  { id:'REV-3298', type:'상품심사', target:'스테인리스 다용도 볼 5종 세트 (라이프키친)', detail:'신규 등록', deadline:'D-1' },
  { id:'REV-3295', type:'상품심사', target:'원목 원형 트레이 (모던홈)', detail:'재심사 · 이미지 보완', deadline:'D-2' },
  { id:'REV-3288', type:'입점심사', target:'베이크스토리', detail:'사업자 정보 · 증빙서류 2건', deadline:'D-3' },
  { id:'REV-3280', type:'상품심사', target:'진공 보관용기 4종 세트 (라이프키친)', detail:'옵션 추가', deadline:'D-4' },
];

const CASES = [
  { id:'CASE-8821', order:'ORD-20260827-014', buyer:'박지훈', type:'반품', stage:'중재', evidence:2 },
  { id:'CASE-8815', order:'ORD-20260826-018', buyer:'오지안', type:'교환', stage:'처리중', evidence:1 },
  { id:'CASE-8802', order:'ORD-20260824-005', buyer:'한소율', type:'분쟁', stage:'접수', evidence:3 },
  { id:'CASE-8790', order:'ORD-20260822-011', buyer:'정민서', type:'반품', stage:'종결', evidence:1 },
];

const PAYOUT_BATCHES = [
  { id:'PB-2608-03', seller:'라이프키친', amount:1068320, status:'승인대기' },
  { id:'PB-2608-02', seller:'모던홈', amount:842300, status:'검토중' },
  { id:'PB-2608-01', seller:'베이크스토리', amount:2140500, status:'승인완료' },
];
const PAYOUT_FAIL = [
  { id:'PF-119', seller:'홈리빙스토레', amount:412000, reason:'계좌정보 오류' },
  { id:'PF-114', seller:'그린가든샵', amount:298000, reason:'한도 초과' },
];
const RECON_ROWS = [
  { id:'RC-551', pg:1214000, system:1214000, match:true },
  { id:'RC-550', pg:842300, system:838300, match:false },
  { id:'RC-549', pg:1560000, system:1560000, match:true },
];

/* ── shared UI ── */
function Toast({msg, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><i className="ph-fill ph-check-circle" style={{color:'#8be6c8', fontSize:18}}></i>{msg}</div>;
}
function Modal({title, onClose, children, footer, width}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={width?{width}:null} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}
function Drawer({title, onClose, children}){
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button></div>
        <div className="modal-body">{children}</div>
      </div>
    </React.Fragment>
  );
}

/* ── Top nav ── */
function TopNav({view, setView, notifOpen, setNotifOpen, adminMenu, setAdminMenu, showToast}){
  const tabs = [
    { id:'main', label:'운영 성과·통계' },
    { id:'review', label:'심사 관리', exact:'판매자·상품 통합 심사 관리' },
    { id:'claims', label:'클레임·분쟁', exact:'주문·클레임 및 분쟁 관리' },
    { id:'payout', label:'정산 승인', exact:'정산·지급 승인 및 대사 관리' },
  ];
  return (
    <div className="topnav">
      <div className="tn-logo">
        <div className="tn-mark">GM</div>
        <div className="tn-brand"><b>그로우마켓</b><span>운영 어드민</span></div>
      </div>
      <div className="tn-tabs">
        {tabs.map(t=>(
          <button key={t.id} className={`tn-tab ${view===t.id?'active':''}`} onClick={()=>setView(t.id)}>
            {t.label}{t.exact && <span style={{display:'none'}}>{t.exact}</span>}
          </button>
        ))}
      </div>
      <div className="tn-actions">
        <button className="icon-btn" onClick={()=>showToast('통합 검색은 상단 각 화면의 검색창을 이용해 주세요')}><i className="ph ph-magnifying-glass"></i></button>
        <button className="icon-btn" onClick={()=>setNotifOpen(v=>!v)}><i className="ph ph-bell"></i><span className="icon-dot"></span></button>

function ReviewView({showToast}){
  const [filter, setFilter] = useState('전체');
  const [queue, setQueue] = useState(REVIEW_QUEUE);
  const [selected, setSelected] = useState([]);
  const [detail, setDetail] = useState(null);
  const [attrModal, setAttrModal] = useState(false);
  const list = queue.filter(q=>filter==='전체'||q.type===filter);
  const toggleSel = (id)=> setSelected(s=> s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const decide = (id, result, reason)=>{
    setQueue(q => q.filter(x=>x.id!==id));
    setDetail(null);
    showToast(`${id} 건이 ${result} 처리되어 큐에서 제거되었습니다`);
  };
  const bulkApprove = ()=>{
    setQueue(q => q.filter(x=>!selected.includes(x.id)));
    showToast(`${selected.length}건이 일괄 승인 처리되었습니다`);
    setSelected([]);
  };
  return (
    <div>
      <div className="page-head">
        <div><p className="eyebrow">REVIEW QUEUE</p><h1>판매자·상품 통합 심사 관리</h1><p>입점 신청과 상품 등록·재심사 요청을 마감 임박순으로 처리합니다.</p></div>
        {selected.length>0 && <button className="btn-primary" onClick={bulkApprove}><i className="ph ph-checks"></i>{selected.length}건 일괄 승인</button>}
      </div>
      <div className="panel">
        <div className="toolbar" style={{marginBottom:16}}>
          {['전체','입점심사','상품심사'].map(f=><button key={f} className={`chip ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>)}
        </div>
        {list.map(item=>(
          <div className="queue-item" key={item.id}>
            <div className={`checkbox ${selected.includes(item.id)?'on':''}`} onClick={(e)=>{e.stopPropagation(); toggleSel(item.id);}}>
              {selected.includes(item.id) && <i className="ph ph-check" style={{fontSize:12}}></i>}
            </div>
            <span className="qtype">{item.type}</span>
            <div className="qmain" onClick={()=>setDetail(item)}><b>{item.target}</b><span>{item.detail}</span></div>
            <span className="qdeadline">{item.deadline}</span>
          </div>
        ))}
        {list.length===0 && <p style={{fontSize:13, color:'var(--text3)'}}>처리할 심사 건이 없습니다.</p>}
      </div>
      <div className="panel">
        <div className="panel-head"><h2>카테고리·속성 기준정보</h2><button className="btn-outline" onClick={()=>setAttrModal(true)}><i className="ph ph-pencil-simple"></i>편집</button></div>
        <table>
          <thead><tr><th>카테고리</th><th>필수 속성</th><th>최근 수정</th></tr></thead>
          <tbody>
            <tr><td>주방용품</td><td>소재, 용량, KC인증여부</td><td>2026.08.12</td></tr>
            <tr><td>생활가전</td><td>정격전압, 소비전력, 인증번호</td><td>2026.08.02</td></tr>
          </tbody>
        </table>
      </div>
      {detail && <ReviewDetail item={detail} onClose={()=>setDetail(null)} onDecide={decide} />}
      {attrModal && (
        <Modal title="기준정보 편집" onClose={()=>setAttrModal(false)} footer={<button className="btn-primary" onClick={()=>{setAttrModal(false); showToast('기준정보가 저장되었습니다');}}>저장</button>}>
          <div className="field"><label>카테고리명</label><input defaultValue="주방용품" /></div>
          <div className="field"><label>필수 속성 (쉼표로 구분)</label><input defaultValue="소재, 용량, KC인증여부" /></div>
        </Modal>
      )}
    </div>
  );
}

/* ── Payout (정산 승인) ── */
function PayoutView({showToast}){
  const [batches, setBatches] = useState(PAYOUT_BATCHES);
  const [reconModal, setReconModal] = useState(null);
  const approve = (id)=>{
    setBatches(b => b.map(x => x.id===id ? {...x, status: x.status==='검토중' ? '승인대기' : '승인완료'} : x));
    showToast('정산 승인 단계가 진행되었습니다');
  };
  const [failQ, setFailQ] = useState(PAYOUT_FAIL);
  const retry = (id)=>{ setFailQ(f=>f.filter(x=>x.id!==id)); showToast('재처리 큐에 등록되었습니다'); };
  return (
    <div>
      <div className="page-head"><div><p className="eyebrow">PAYOUT APPROVAL</p><h1>정산·지급 승인 및 대사 관리</h1><p>정산 대상을 검증하고 지급을 사전 승인하며, 처리 결과를 대사합니다.</p></div></div>
      <div className="panel">
        <div className="panel-head"><h2>지급 승인 대기</h2></div>
        <table>
          <thead><tr><th>배치번호</th><th>판매자</th><th>지급액</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {batches.map(b=>(
              <tr key={b.id}>
                <td>{b.id}</td><td>{b.seller}</td><td style={{fontWeight:700}}>{won(b.amount)}</td>
                <td><span className={`badge ${b.status==='승인완료'?'approved':'pending'}`}>{b.status}</span></td>
                <td>{b.status!=='승인완료' && <button className="btn-outline" onClick={()=>approve(b.id)}>{b.status==='검토중' ? '1차 검토 완료' : '지급 승인'}</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <div className="panel-head"><h2>지급 실패 재처리 큐</h2></div>
        {failQ.length===0 ? <p style={{fontSize:13, color:'var(--text3)'}}>재처리 대상이 없습니다.</p> : failQ.map(f=>(
          <div className="queue-item" key={f.id}>
            <span className="qtype" style={{background:'#fdeceb', color:'var(--red)'}}>{f.reason}</span>
            <div className="qmain"><b>{f.seller}</b><span>{won(f.amount)}</span></div>
            <button className="btn-outline" onClick={()=>retry(f.id)}>재처리 큐 등록</button>
          </div>
        ))}
      </div>
      <div className="panel">
        <div className="panel-head"><h2>PG·펌뱅킹 처리 결과 대사</h2></div>
        <table>
          <thead><tr><th>대사번호</th><th>PG 결과</th><th>시스템 기록</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {RECON_ROWS.map(r=>(
              <tr key={r.id} className={r.match?'':'mismatch'}>
                <td>{r.id}</td><td>{won(r.pg)}</td><td>{won(r.system)}</td>
                <td><span className={`badge ${r.match?'approved':'mismatch'}`}>{r.match?'일치':'불일치'}</span></td>
                <td>{!r.match && <button className="btn-outline" onClick={()=>setReconModal(r)}>대사 확인</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {reconModal && (
        <Modal title={`${reconModal.id} 대사 확인`} onClose={()=>setReconModal(null)} footer={<button className="btn-primary" onClick={()=>{setReconModal(null); showToast('대사 불일치 건이 조정 요청으로 등록되었습니다');}}>조정 요청 등록</button>}>
          <div className="field-row">
            <div className="field"><label>PG 결과</label><div style={{fontWeight:700}}>{won(reconModal.pg)}</div></div>
            <div className="field"><label>시스템 기록</label><div style={{fontWeight:700}}>{won(reconModal.system)}</div></div>
          </div>
          <div className="field"><label>차액</label><div style={{color:'var(--red)', fontWeight:700}}>{won(reconModal.pg - reconModal.system)}</div></div>
          <p style={{fontSize:12.5, color:'var(--text2)'}}>실제 대사 처리는 펌뱅킹·PG 대사 API 연동 지점으로 분리해 조정 요청 이후 자동 반영되도록 설계합니다.</p>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);
  const [notifOpen, setNotifOpen] = useState(false);
  const [adminMenu, setAdminMenu] = useState(false);
  const showToast = (msg)=> setToast(msg);
  const closePanels = ()=>{ setNotifOpen(false); setAdminMenu(false); };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}} onClick={closePanels}>
      <div onClick={e=>e.stopPropagation()}>
        <TopNav view={view} setView={setView} notifOpen={notifOpen} setNotifOpen={setNotifOpen} adminMenu={adminMenu} setAdminMenu={setAdminMenu} showToast={showToast} />
      </div>
      <div style={{flex:1, width:'100%'}}>
        <div className="page-wrap">
          {view==='main' && <Dashboard setView={setView} />}
          {view==='review' && <ReviewView showToast={showToast} />}
          {view==='claims' && <ClaimsView showToast={showToast} />}
          {view==='payout' && <PayoutView showToast={showToast} />}
        </div>
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
