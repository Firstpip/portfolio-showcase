<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어스텝 어드민 — 신청 현황 CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --primary:#006bff;
    --primary-dark:#0058d6;
    --ink:#0b3558;
    --slate:#476788;
    --mist:#a6bbd1;
    --bg:#f8f9fb;
    --surface:#ffffff;
    --pebble:#f0f3f8;
    --hairline:#d4e0ed;
    --accent:#e55cff;
    --cobalt:#004eba;
    --success:#1a9c6a;
    --danger:#e0435c;
    --warn:#c98a1a;
    --shadow-sm: rgba(71,103,136,0.06) 0px 2px 4px 0px, rgba(71,103,136,0.05) 0px 1px 2px 0px;
    --shadow-md: rgba(71,103,136,0.08) 0px 8px 16px 0px, rgba(71,103,136,0.04) 0px 2px 6px 0px;
    --shadow-lg: rgba(71,103,136,0.10) 0px 20px 40px 0px, rgba(71,103,136,0.06) 0px 6px 16px 0px;
    --radius: 16px;
    --radius-sm: 8px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  ::selection{background:var(--primary);color:#fff;}

  /* ---------- layout ---------- */
  .app-shell{display:flex;width:100%;min-height:100vh;}

  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:240px;
    background:var(--surface);border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;padding:20px 0;z-index:30;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--hairline);margin-bottom:16px;}
  .sidebar-brand .logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;}
  .sidebar-brand .logo-text{font-weight:700;font-size:16px;letter-spacing:-0.2px;}
  .sidebar-brand .logo-sub{font-size:11px;color:var(--mist);font-weight:500;}
  .env-select{margin:0 16px 16px;padding:8px 10px;border:1px solid var(--hairline);border-radius:var(--radius-sm);font-size:12px;color:var(--slate);display:flex;align-items:center;justify-content:space-between;background:var(--pebble);}
  .sidebar-section{padding:0 12px;margin-bottom:18px;}
  .sidebar-section-title{font-size:11px;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:0.5px;padding:0 8px;margin-bottom:8px;}
  .sidebar-link{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
    color:var(--slate);font-size:13.5px;font-weight:500;text-decoration:none;border:none;background:none;width:100%;text-align:left;
    transition:background .15s,color .15s;margin-bottom:2px;
  }
  .sidebar-link i{font-size:17px;width:18px;text-align:center;flex-shrink:0;}
  .sidebar-link:hover{background:var(--pebble);color:var(--ink);}
  .sidebar-link.active{background:#e8f2ff;color:var(--primary);font-weight:600;}
  .sidebar-link .badge-count{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 4px;border-top:1px solid var(--hairline);}
  .sidebar-user{display:flex;align-items:center;gap:9px;}
  .sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .sidebar-user .name{font-size:12.5px;font-weight:600;}
  .sidebar-user .role{font-size:10.5px;color:var(--mist);}

  .main-wrap{
    margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);
    min-height:100vh;display:flex;flex-direction:column;
  }

  .topbar{
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    padding:14px 32px;border-bottom:1px solid var(--hairline);background:var(--surface);
    position:sticky;top:0;z-index:20;
  }
  .icon-btn{
    width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:17px;position:relative;
  }
  .icon-btn:hover{background:var(--pebble);color:var(--ink);}
  .notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.8s infinite;}
  .topbar-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  .content{padding:28px 32px 60px;flex:1;width:100%;position:relative;}

  .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .page-title-row h1{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-0.3px;}
  .page-meta{font-size:12.5px;color:var(--mist);}
  .page-actions{display:flex;gap:8px;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);
    font-size:13.5px;font-weight:600;border:1px solid transparent;transition:all .15s;white-space:nowrap;
  }
  .btn i{font-size:15px;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:#082a49;}
  .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--hairline);}
  .btn-secondary:hover{background:var(--pebble);}
  .btn-ghost{background:transparent;color:var(--slate);border-color:transparent;}
  .btn-ghost:hover{background:var(--pebble);color:var(--ink);}
  .btn-danger{background:#fdecef;color:var(--danger);border-color:#f6c7cf;}
  .btn-danger:hover{background:#fbdde3;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;}

  /* ---------- stat row ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-sm);
    padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
    animation:fadeInUp .5s ease both;
  }
  .stat-card:nth-child(1){animation-delay:.02s;}
  .stat-card:nth-child(2){animation-delay:.08s;}
  .stat-card:nth-child(3){animation-delay:.14s;}
  .stat-card:nth-child(4){animation-delay:.2s;}
  .stat-label{font-size:12px;color:var(--slate);font-weight:500;margin-bottom:8px;}
  .stat-value-row{display:flex;align-items:flex-end;justify-content:space-between;}
  .stat-value{font-size:30px;font-weight:700;letter-spacing:-0.5px;color:var(--ink);}
  .stat-sparkline{flex-shrink:0;}
  .stat-delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:3px;}
  .stat-delta.positive{color:var(--success);}
  .stat-delta.negative{color:var(--danger);}

  /* ---------- tab bar ---------- */
  .tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:14px;}
  .tab{padding:10px 4px;margin-right:22px;background:none;border:none;font-size:14px;font-weight:600;color:var(--mist);position:relative;}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px;}
  .tab .count{margin-left:5px;font-weight:500;color:var(--mist);}
  .tab.active .count{color:var(--primary);}

  .data-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-input{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;min-width:220px;color:var(--slate);
  }
  .search-input input{border:none;outline:none;background:none;font-size:13px;width:100%;color:var(--ink);}
  .filter-chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);
    font-size:12.5px;font-weight:500;color:var(--slate);display:flex;align-items:center;gap:6px;
  }
  .filter-chip.active{background:#e8f2ff;border-color:var(--primary);color:var(--primary);}
  .export-btn{margin-left:auto;}

  .data-table-wrap{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm);}
  table.data-table{width:100%;border-collapse:collapse;}
  .data-table thead th{
    text-align:left;font-size:11.5px;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:.4px;
    padding:11px 16px;background:var(--pebble);border-bottom:1px solid var(--hairline);
  }
  .data-table tbody tr{border-bottom:1px solid var(--hairline);cursor:pointer;transition:background .12s;}
  .data-table tbody tr:last-child{border-bottom:none;}
  .data-table tbody tr:hover{background:#f5f9ff;}
  .data-table td{padding:12px 16px;font-size:13px;color:var(--ink);vertical-align:middle;}
  .cell-name{font-weight:600;}
  .cell-sub{font-size:11.5px;color:var(--mist);margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge-blue{background:#e8f2ff;color:var(--primary);}
  .badge-amber{background:#fdf3e0;color:var(--warn);}
  .badge-green{background:#e5f6ee;color:var(--success);}
  .badge-gray{background:var(--pebble);color:var(--slate);}
  .row-menu-btn{width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--mist);display:flex;align-items:center;justify-content:center;}
  .row-menu-btn:hover{background:var(--pebble);color:var(--ink);}

  /* ---------- detail drawer (master-detail composition) ---------- */
  .detail-overlay{position:fixed;inset:0;background:rgba(11,53,88,.28);z-index:60;animation:fadeIn .2s ease;}
  .detail-panel{
    position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);
    z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideInRight .28s cubic-bezier(.2,.8,.3,1);
  }
  .detail-header{padding:20px 22px;border-bottom:1px solid var(--hairline);display:flex;align-items:flex-start;justify-content:space-between;}
  .detail-header h3{margin:0 0 3px;font-size:18px;font-weight:700;}
  .detail-header .sub{font-size:12px;color:var(--mist);}
  .detail-body{padding:20px 22px;overflow-y:auto;flex:1;}
  .detail-section{margin-bottom:20px;}
  .detail-section-title{font-size:11.5px;font-weight:700;color:var(--mist);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .detail-field{background:var(--pebble);border-radius:10px;padding:10px 12px;}
  .detail-field .k{font-size:11px;color:var(--slate);margin-bottom:3px;}
  .detail-field .v{font-size:13px;font-weight:600;}
  .status-select{width:100%;padding:9px 10px;border:1px solid var(--hairline);border-radius:var(--radius-sm);font-size:13px;color:var(--ink);background:var(--surface);}
  .memo-box{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--hairline);border-radius:var(--radius-sm);font-size:13px;resize:vertical;color:var(--ink);}
  .timeline-item{display:flex;gap:10px;font-size:12.5px;color:var(--slate);margin-bottom:9px;}
  .timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}
  .detail-footer{padding:16px 22px;border-top:1px solid var(--hairline);display:flex;gap:8px;}

  /* ---------- generic modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(11,53,88,.32);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
  .modal-box{background:var(--surface);border-radius:20px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);animation:fadeInScale .22s cubic-bezier(.2,.8,.3,1);overflow:hidden;}
  .modal-head{padding:20px 22px 6px;display:flex;align-items:flex-start;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:17px;font-weight:700;}
  .modal-close{width:28px;height:28px;border:none;background:var(--pebble);border-radius:8px;color:var(--slate);}
  .modal-body{padding:14px 22px 4px;font-size:13.5px;color:var(--slate);line-height:1.6;}
  .modal-body label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:12px 0 6px;}
  .modal-body input, .modal-body select, .modal-body textarea{width:100%;padding:9px 11px;border:1px solid var(--hairline);border-radius:var(--radius-sm);font-size:13px;color:var(--ink);}
  .modal-foot{padding:18px 22px 22px;display:flex;gap:8px;justify-content:flex-end;}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:90;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:fadeInUp .25s ease;}
  .toast i{color:#7fd9a8;}

  /* ---------- intake / landing (customer preview embedded) ---------- */
  .preview-frame{background:var(--surface);border:1px solid var(--hairline);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);}
  .landing-hero{
    position:relative;padding:56px 44px 70px;text-align:center;overflow:hidden;
    background:radial-gradient(circle at 18% 20%, #e8f2ff 0%, var(--bg) 55%);
  }
  .hero-blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.5;}
  .blob-1{width:260px;height:260px;background:var(--accent);top:-70px;right:-50px;}
  .blob-2{width:200px;height:200px;background:#0099ff;bottom:-60px;left:-40px;}
  .landing-hero .kicker{display:inline-flex;align-items:center;gap:6px;background:#e6f0ff;color:var(--cobalt);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:18px;position:relative;}
  .landing-hero h2{font-size:44px;font-weight:700;line-height:1.2;letter-spacing:-0.8px;margin:0 0 14px;position:relative;}
  .landing-hero p{font-size:15.5px;color:var(--slate);max-width:480px;margin:0 auto 26px;position:relative;}
  .variant-tabs{display:inline-flex;gap:6px;background:var(--pebble);padding:4px;border-radius:999px;position:relative;margin-bottom:8px;}
  .variant-tab{padding:7px 16px;border-radius:999px;border:none;background:none;font-size:12.5px;font-weight:600;color:var(--slate);}
  .variant-tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

  .stepper{display:flex;align-items:center;justify-content:center;gap:0;padding:28px 44px 0;max-width:520px;margin:0 auto;}
  .step-node{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
  .step-circle{width:30px;height:30px;border-radius:50%;background:var(--pebble);color:var(--mist);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid var(--pebble);transition:all .2s;}
  .step-node.done .step-circle{background:var(--primary);color:#fff;border-color:var(--primary);}
  .step-node.current .step-circle{background:var(--surface);color:var(--primary);border-color:var(--primary);}
  .step-node .step-label{font-size:11.5px;color:var(--mist);font-weight:600;}
  .step-node.current .step-label, .step-node.done .step-label{color:var(--ink);}
  .step-line{position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--pebble);z-index:0;}
  .step-node.done .step-line{background:var(--primary);}
  .step-node:last-child .step-line{display:none;}

  .form-panel{padding:34px 60px 44px;max-width:560px;margin:0 auto;}
  .form-panel h4{font-size:19px;font-weight:700;margin:0 0 6px;}
  .form-panel .desc{font-size:13px;color:var(--slate);margin-bottom:22px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip-option{padding:9px 15px;border-radius:999px;border:1.5px solid var(--hairline);background:var(--surface);font-size:13px;font-weight:500;color:var(--slate);}
  .chip-option.selected{border-color:var(--primary);background:#e8f2ff;color:var(--primary);font-weight:700;}
  .field-error{color:var(--danger);font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;}
  .form-row{margin-bottom:20px;}
  .form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:9px;}
  .form-row input, .form-row select{width:100%;padding:11px 13px;border:1px solid var(--hairline);border-radius:var(--radius-sm);font-size:14px;}
  .radio-row{display:flex;gap:10px;}
  .radio-pill{flex:1;text-align:center;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--hairline);font-size:13px;font-weight:600;color:var(--slate);}
  .radio-pill.selected{border-color:var(--primary);background:#e8f2ff;color:var(--primary);}
  .form-nav{display:flex;justify-content:space-between;margin-top:28px;}

  .result-panel{padding:52px 44px;text-align:center;}
  .result-icon{width:64px;height:64px;border-radius:50%;background:#e5f6ee;color:var(--success);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;animation:fadeInScale .4s ease;}
  .result-panel h3{font-size:22px;font-weight:700;margin:0 0 8px;}
  .result-panel p{font-size:14px;color:var(--slate);max-width:400px;margin:0 auto 22px;}
  .funnel-strip{display:flex;justify-content:center;gap:26px;padding:18px 20px;background:var(--pebble);border-top:1px solid var(--hairline);font-size:12.5px;color:var(--slate);}
  .funnel-strip b{color:var(--ink);}

  /* ---------- payment screen ---------- */
  .payment-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start;}
  .product-card{background:var(--surface);border:1px solid var(--hairline);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);}
  .product-media{height:180px;background:linear-gradient(135deg,#e8f2ff,#fbe8ff);position:relative;display:flex;align-items:center;justify-content:center;}
  .product-media svg{width:100%;height:100%;}
  .product-body{padding:26px 28px;}
  .product-tag{display:inline-block;background:#e6f0ff;color:var(--cobalt);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
  .product-body h2{font-size:24px;font-weight:700;margin:0 0 8px;}
  .product-body .price{font-size:15px;color:var(--slate);margin-bottom:18px;}
  .product-body .price b{font-size:26px;color:var(--ink);margin-right:4px;}
  .feature-list{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:10px;}
  .feature-list li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--slate);}
  .feature-list i{color:var(--primary);font-size:16px;}
  .faq-item{border-top:1px solid var(--hairline);padding:13px 0;}
  .faq-q{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;cursor:pointer;}
  .faq-a{font-size:12.5px;color:var(--slate);margin-top:8px;line-height:1.6;display:none;}
  .faq-item.open .faq-a{display:block;}
  .faq-item.open .faq-q i{transform:rotate(180deg);}

  .checkout-card{background:var(--surface);border:1px solid var(--hairline);border-radius:20px;padding:24px 26px;box-shadow:var(--shadow-md);position:sticky;top:88px;}
  .checkout-card h4{font-size:15px;font-weight:700;margin:0 0 16px;}
  .checkout-row{display:flex;justify-content:space-between;font-size:13px;color:var(--slate);margin-bottom:10px;}
  .checkout-row b{color:var(--ink);}
  .checkout-total{display:flex;justify-content:space-between;padding-top:14px;margin-top:6px;border-top:1px solid var(--hairline);font-size:15px;font-weight:700;}
  .pg-methods{display:flex;gap:8px;margin:18px 0;}
  .pg-method{flex:1;padding:11px;border:1.5px solid var(--hairline);border-radius:var(--radius-sm);text-align:center;font-size:12.5px;font-weight:600;color:var(--slate);}

function Sparkline({data, color}){
  const w=64,h=26;
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/((max-min)||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function CountUp({to, prefix='', suffix=''}){
  const [v,setV] = useState(0);
  useEffect(()=>{
    let start=null; const dur=700;
    function step(ts){
      if(!start) start=ts;
      const p=Math.min((ts-start)/dur,1);
      setV(Math.floor(p*to));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  },[to]);
  return <span>{prefix}{v.toLocaleString()}{suffix}</span>;
}

/* ---------------- INTAKE (랜딩+신청폼) ---------------- */
function Intake({pushToast}){
  const [variant, setVariant] = useState('A');
  const [step, setStep] = useState(0);
  const [purpose, setPurpose] = useState(null);
  const [region, setRegion] = useState('');
  const [mobility, setMobility] = useState(null);
  const [phone, setPhone] = useState('');
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);

  const purposes = ['뇌졸중 후 보행재활','무릎·고관절 인공관절 재활','허리디스크 운동재활','낙상 후 균형훈련','파킨슨 초기 운동재활'];
  const steps = ['재활 목적','거주지역·거동','연락처 확인'];

  function next(){
    setError('');
    if(step===0 && !purpose){ setError('재활 목적을 선택해주세요.'); return; }
    if(step===1 && (!region || !mobility)){ setError('거주지역과 거동 가능 여부를 모두 입력해주세요.'); return; }
    if(step===2){
      if(!phone){ setError('연락처를 입력해주세요.'); return; }
      setDone(true);
      pushToast('상태확인 신청이 접수되었습니다.');
      return;
    }
    setStep(s=>s+1);
  }

  const heroCopy = variant==='A'
    ? {kicker:'부모님 방문재활 무료 상태확인', title:<React.Fragment>부모님 상태에 딱 맞는<br/>전문가를 집으로</React.Fragment>, desc:'질환·거동 상태를 입력하면 케어스텝이 지역 전문가를 직접 배정해드립니다.'}
    : {kicker:'12주 방문재활 프로그램', title:<React.Fragment>낙상·수술 이후,<br/>집에서 시작하는 재활</React.Fragment>, desc:'물리치료사·운동처방사가 정해진 요일에 직접 방문해 12주 프로그램을 진행합니다.'};

  if(done){
    return (
      <div className="preview-frame">
        <div className="result-panel">
          <div className="result-icon"><i className="ti ti-check"></i></div>
          <h3>상태확인 신청이 접수되었습니다</h3>
          <p>담당자가 확인 후 24시간 이내 SMS로 안내드립니다. 배정 가능한 전문가가 확정되면 계약금 결제 안내가 이어집니다.</p>
          <button className="btn btn-primary" onClick={()=>{setDone(false); setStep(0); setPurpose(null); setRegion(''); setMobility(null); setPhone('');}}>새 신청 다시 보기</button>
        </div>
        <div className="funnel-strip">
          <span>랜딩 유입 <b>{variant==='A'?'246':'184'}</b></span>
          <span>신청 전환 <b>{variant==='A'?'42%':'35%'}</b></span>
          <span>소재 UTM <b>utm_creative={variant}</b></span>
        </div>
      </div>
    );
  }

  return (
    <div className="preview-frame">
      <div className="landing-hero">
        <div className="hero-blob blob-1"></div>
        <div className="hero-blob blob-2"></div>
        <div className="variant-tabs">
          <button className={"variant-tab"+(variant==='A'?' active':'')} onClick={()=>setVariant('A')}>소재 A</button>
          <button className={"variant-tab"+(variant==='B'?' active':'')} onClick={()=>setVariant('B')}>소재 B</button>
        </div>
        <br/>
        <span className="kicker"><i className="ti ti-heart-handshake"></i>{heroCopy.kicker}</span>
        <h2>{heroCopy.title}</h2>
        <p>{heroCopy.desc}</p>
      </div>

      <div className="stepper">
        {steps.map((s,i)=>(
          <div key={s} className={"step-node"+(i<step?' done':i===step?' current':'')}>
            <div className="step-line"></div>
            <div className="step-circle">{i<step ? <i className="ti ti-check"></i> : i+1}</div>
            <div className="step-label">{s}</div>
          </div>
        ))}
      </div>

      <div className="form-panel">
        {step===0 && (
          <React.Fragment>
            <h4>부모님의 재활 목적을 선택해주세요</h4>
            <div className="desc">가장 가까운 항목을 선택하면 전문가 매칭 정확도가 올라갑니다.</div>
            <div className="chip-grid">
              {purposes.map(p=>(
                <button key={p} className={"chip-option"+(purpose===p?' selected':'')} onClick={()=>{setPurpose(p); setError('');}}>{p}</button>
              ))}
            </div>
          </React.Fragment>
        )}
        {step===1 && (
          <React.Fragment>
            <h4>거주 지역과 거동 가능 여부</h4>
            <div className="desc">방문 가능한 지역인지, 이동 시 도움이 얼마나 필요한지 확인합니다.</div>
            <div className="form-row">
              <label>거주 지역</label>
              <select value={region} onChange={e=>{setRegion(e.target.value); setError('');}}>
                <option value="">지역을 선택하세요</option>
                <option>서울 강남구</option><option>서울 송파구</option><option>서울 마포구</option>
                <option>경기 성남시</option><option>경기 고양시</option><option>인천 연수구</option>
              </select>
            </div>
            <div className="form-row">
              <label>거동 가능 여부</label>
              <div className="radio-row">
                {['독립보행 가능','부축 필요','휠체어'].map(m=>(
                  <button key={m} className={"radio-pill"+(mobility===m?' selected':'')} onClick={()=>{setMobility(m); setError('');}}>{m}</button>
                ))}
              </div>
            </div>
          </React.Fragment>
        )}
        {step===2 && (
          <React.Fragment>
            <h4>결과 안내를 받을 연락처</h4>
            <div className="desc">확인 문자와 전문가 배정 안내를 이 번호로 발송합니다.</div>
            <div className="form-row">
              <label>보호자 휴대폰 번호</label>
              <input placeholder="010-0000-0000" value={phone} onChange={e=>{setPhone(e.target.value); setError('');}}/>
            </div>
          </React.Fragment>
        )}
        {error && <div className="field-error"><i className="ti ti-alert-circle"></i>{error}</div>}
        <div className="form-nav">
          {step>0 ? <button className="btn btn-secondary" onClick={()=>setStep(s=>s-1)}>이전</button> : <span></span>}
          <button className="btn btn-primary" onClick={next}>{step===2 ? '신청 완료하기' : '다음'}<i className="ti ti-arrow-right"></i></button>
        </div>
      </div>
      <div className="funnel-strip">
        <span>랜딩 유입 <b>{variant==='A'?'246':'184'}</b></span>
        <span>신청 전환 <b>{variant==='A'?'42%':'35%'}</b></span>
        <span>소재 UTM <b>utm_creative={variant}</b></span>
      </div>
    </div>
  );
}

    if(!target && pendingQueue.length>0) setTarget(pendingQueue[0]);
  },[]);

  let teachers = TEACHERS;
  if(regionFilter!=='전체') teachers = teachers.filter(t=>t.region.includes(regionFilter));
  if(slotFilter!=='전체') teachers = teachers.filter(t=>t.slots===slotFilter);

  function confirmAssign(){
    setTeacherCaps(prev=>({...prev,[confirmTeacher.id]:prev[confirmTeacher.id]+1}));
    if(target){
      setApplicants(prev=>prev.map(a=> a.id===target.id ? {...a, status:'assigned', teacher:confirmTeacher.name} : a));
    }
    pushToast(`${confirmTeacher.name} 선생님이 배정되었습니다.`);
    setConfirmTeacher(null);
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <h1>선생님 배정 · 미확인 알림</h1>
          <div className="page-meta">자동 매칭 없이 조건 확인 후 관리자가 직접 배정합니다</div>
        </div>
      </div>

      {unconfirmed.length>0 && (
        <div className="notif-strip">
          {unconfirmed.map(a=>(
            <div className="notif-card" key={a.id}>
              <div className="top"><span className="live-dot"></span>미확인 · {a.date} 접수</div>
              <div className="name">{a.guardian}님 ({a.parent})</div>
              <div className="meta">{a.region} · {a.purpose}</div>
            </div>
          ))}
        </div>
      )}

      <div className="assign-context">
        <div>
          <div className="label">배정 대상 신청 건</div>
          <div className="value">{target ? `${target.guardian}님 — ${target.region} · ${target.purpose}` : '배정 대기 중인 신청 건이 없습니다'}</div>
        </div>
        {pendingQueue.length>0 && (
          <select value={target ? target.id : ''} onChange={e=>setTarget(pendingQueue.find(a=>a.id===Number(e.target.value)))} style={{padding:'8px 12px',borderRadius:8,border:'1px solid #bcdaff',fontSize:12.5}}>
            {pendingQueue.map(a=><option key={a.id} value={a.id}>{a.guardian}님 · {a.region}</option>)}
          </select>
        )}
      </div>

      <div className="assign-filters">
        <select value={regionFilter} onChange={e=>setRegionFilter(e.target.value)}>
          <option>전체</option><option>서울</option><option>경기</option><option>인천</option>
        </select>
        <select value={slotFilter} onChange={e=>setSlotFilter(e.target.value)}>
          <option>전체</option><option>평일 오전</option><option>평일 오후</option><option>주중 전일</option><option>주말 가능</option>
        </select>
      </div>

      <div className="teacher-grid">
        {teachers.map(t=>{
          const cap = teacherCaps[t.id];
          const full = cap>=t.max;
          return (
            <div className="teacher-card" key={t.id}>
              <div className="teacher-top">
                <div className="teacher-avatar" style={{background:t.color}}>{t.name[0]}</div>
                <div>
                  <div className="teacher-name">{t.name} 선생님</div>
                  <div className="teacher-region">{t.region}</div>
                </div>
              </div>
              <div className="teacher-meta-row"><span>가능 시간</span><b style={{color:'var(--ink)'}}>{t.slots}</b></div>
              <div className="teacher-meta-row"><span>담당 고객</span><b style={{color:'var(--ink)'}}>{cap} / {t.max}명</b></div>
              <div className="capacity-bar"><div className={"capacity-fill"+(full?' full':'')} style={{width:(cap/t.max*100)+'%'}}></div></div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} disabled={full || !target} onClick={()=>setConfirmTeacher(t)}>
                {full ? '정원 마감' : '배정하기'}
              </button>
            </div>
          );
        })}
      </div>

      {confirmTeacher && (
        <div className="modal-overlay" onClick={()=>setConfirmTeacher(null)}>
          <div className="modal-box" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>배정 확정</h3><button className="modal-close" onClick={()=>setConfirmTeacher(null)}><i className="ti ti-x"></i></button></div>
            <div className="modal-body">
              <b style={{color:'var(--ink)'}}>{confirmTeacher.name}</b> 선생님을 <b style={{color:'var(--ink)'}}>{target ? target.guardian+'님' : ''}</b> 신청 건에 배정하시겠습니까? 배정 후 담당 고객 수가 즉시 갱신되며, 동일 선생님에게 중복 배정이 방지됩니다.
            </div>
            <div className="modal-foot">
              <button className="btn btn-secondary" onClick={()=>setConfirmTeacher(null)}>취소</button>
              <button className="btn btn-primary" onClick={confirmAssign}>배정 확정</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [screen, setScreen] = useState('main');
  const [applicants, setApplicants] = useState(APPLICANTS);
  const [detail, setDetail] = useState(null);
  const [toasts, setToasts] = useState([]);

  function pushToast(text){
    const id = Date.now();
    setToasts(t=>[...t, {id, text}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }

  function saveDetail(id, status){
    setApplicants(prev=>prev.map(a=> a.id===id ? {...a, status} : a));
    setDetail(null);
    pushToast('신청 상태가 저장되었습니다.');
  }

  const unconfirmedCount = applicants.filter(a=>a.status==='pending').length;

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen} unconfirmedCount={unconfirmedCount} pushToast={pushToast}/>
      <div className="main-wrap">
        <div className="topbar">
          <button className="icon-btn" onClick={()=>pushToast('빠른 검색은 준비 중입니다.')}><i className="ti ti-search"></i></button>
          <button className="icon-btn" onClick={()=>{setScreen('main'); pushToast('신청 현황의 미확인 알림을 확인해주세요.');}}><i className="ti ti-bell"></i><span className="notif-dot"></span></button>
          <div className="topbar-avatar">관</div>
        </div>
        <div className="content">
          {screen==='main' && <MainCRM applicants={applicants} setApplicants={setApplicants} openDetail={setDetail} pushToast={pushToast} goAssign={(a)=>{setScreen('assignment');}} />}
          {screen==='intake' && <Intake pushToast={pushToast}/>}
          {screen==='payment' && <Payment pushToast={pushToast}/>}
          {screen==='assignment' && <Assignment applicants={applicants} setApplicants={setApplicants} pushToast={pushToast}/>}
        </div>
      </div>
      {detail && <DetailPanel applicant={detail} onClose={()=>setDetail(null)} onSave={saveDetail}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
