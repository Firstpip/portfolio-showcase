<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어스텝 패밀리 케어허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --lavender:#f68dee;
    --iris:#ff80e5;
    --accent-lime:#b6ff00;
    --carbon:#181925;
    --graphite:#666666;
    --ash:#999999;
    --fog:#e8e8e8;
    --linen:#fafafa;
    --mist:#f5f5f5;
    --mint:#33c758;
    --mintwash:#def6e4;
    --amber:#ffa600;
    --sky:#2c78fc;
    --magenta:#d6409f;
    --ember:#ff3e00;
    --surface:#ffffff;
    --shadow-flat: rgba(0,0,0,0.06) 0px 1px 3px 0px;
    --shadow-card: rgba(0,0,0,0.06) 0px 1px 3px 0px, rgba(0,0,0,0.05) 0px 8px 16px 0px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;background:var(--surface);color:var(--carbon);-webkit-font-smoothing:antialiased;letter-spacing:-0.2px;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--lavender);color:#fff;}

  .app-shell{display:flex;width:100%;height:100vh;overflow:hidden;}

  /* ---------- workspace strip ---------- */
  .workspace-strip{
    width:64px;flex-shrink:0;background:var(--carbon);display:flex;flex-direction:column;align-items:center;
    padding:16px 0;gap:10px;
  }
  .ws-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--lavender),var(--sky));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-bottom:8px;}
  .ws-item{
    width:42px;height:42px;border-radius:13px;background:transparent;border:none;color:#8b8ba3;
    display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;transition:all .15s;
  }
  .ws-item:hover{background:#2a2a3d;color:#fff;}
  .ws-item.active{background:var(--lavender);color:#fff;}
  .ws-item .ws-badge{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--ember);border:2px solid var(--carbon);animation:pulse 1.8s infinite;}
  .ws-divider{width:26px;height:1px;background:#33334a;margin:6px 0;}
  .ws-add{width:42px;height:42px;border-radius:13px;border:1.5px dashed #45455e;background:none;color:#6f6f88;display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* ---------- channel list ---------- */
  .channel-list{
    width:264px;flex-shrink:0;background:var(--linen);border-right:1px solid var(--fog);
    display:flex;flex-direction:column;height:100vh;
  }
  .channel-header{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
  .channel-header .fam{display:flex;align-items:center;gap:9px;}
  .fam-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--lavender),var(--magenta));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .ws-name{margin:0;font-size:15px;font-weight:600;}
  .fam-sub{font-size:11px;color:var(--ash);}
  .icon-btn{width:30px;height:30px;border-radius:9999px;border:1px solid var(--fog);background:var(--surface);color:var(--graphite);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .icon-btn:hover{background:var(--mist);}
  .channel-search{padding:0 14px 14px;}
  .channel-search-box{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--fog);border-radius:9999px;padding:7px 13px;font-size:12.5px;color:var(--ash);}
  .channel-search-box input{border:none;outline:none;background:none;width:100%;font-size:12.5px;color:var(--carbon);}
  .channel-section{padding:0 10px;margin-bottom:6px;}
  .section-toggle{display:flex;align-items:center;gap:5px;width:100%;background:none;border:none;padding:8px 8px;font-size:11px;font-weight:700;color:var(--ash);text-transform:uppercase;letter-spacing:.4px;}
  .channel-item, .dm-item{
    display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;border:none;background:none;
    font-size:13.5px;color:var(--graphite);text-align:left;margin-bottom:1px;
  }
  .channel-item:hover, .dm-item:hover{background:var(--mist);}
  .channel-item.active, .dm-item.active{background:var(--surface);color:var(--carbon);font-weight:700;box-shadow:var(--shadow-flat);}
  .channel-prefix{color:var(--ash);font-weight:600;}
  .channel-item.active .channel-prefix{color:var(--lavender);}
  .channel-name{flex:1;}
  .channel-unread, .dm-unread{background:var(--lavender);color:#fff;font-size:10.5px;font-weight:700;border-radius:9999px;padding:1px 6px;min-width:16px;text-align:center;}
  .dm-avatar{width:26px;height:26px;border-radius:50%;background:var(--iris);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .presence{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--linen);}
  .presence.online{background:var(--mint);}
  .presence.away{background:var(--amber);}

  /* ---------- main (conv) ---------- */
  .conv-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;background:var(--surface);}
  .conv-header{padding:16px 24px;border-bottom:1px solid var(--fog);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .conv-title-row{display:flex;align-items:center;gap:8px;}
  .conv-title-row h2{margin:0;font-size:17px;font-weight:700;}
  .member-count{font-size:12px;color:var(--ash);}
  .conv-actions{display:flex;gap:6px;}
  .conv-action{width:32px;height:32px;border-radius:9999px;border:1px solid var(--fog);background:var(--surface);color:var(--graphite);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .conv-action:hover, .conv-action.active{background:var(--mist);color:var(--carbon);}

  .conv-body{flex:1;overflow-y:auto;padding:20px 24px 24px;}

  .hero-band{
    border-radius:16px;padding:16px 20px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#2c78fc 0%,#918df6 100%);display:flex;align-items:center;justify-content:space-between;
  }
  .hero-band::after{content:'';position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);}
  .hero-band .t1{font-size:11.5px;opacity:.85;margin-bottom:4px;}
  .hero-band .t2{font-size:16px;font-weight:700;}
  .hero-band button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;padding:8px 16px;border-radius:9999px;font-size:12.5px;font-weight:600;}

  .compose-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .compose-chip{padding:7px 14px;border-radius:9999px;border:1px solid var(--fog);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--graphite);}
  .compose-chip.active{background:var(--carbon);color:#fff;border-color:var(--carbon);}

  .feed-item{
    background:var(--surface);border:1px solid var(--fog);border-radius:16px;padding:16px 18px;margin-bottom:12px;
    animation:fadeInUp .4s ease both;
  }
  .feed-item .fi-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .fi-avatar{width:34px;height:34px;border-radius:50%;background:var(--lavender);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
  .fi-name{font-size:13.5px;font-weight:700;}
  .fi-time{font-size:11.5px;color:var(--ash);}
  .fi-round{margin-left:auto;background:var(--mintwash);color:#1e8a45;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;}
  .fi-content{font-size:13.5px;color:var(--graphite);line-height:1.6;margin-bottom:10px;}
  .fi-photo{width:100%;max-width:220px;border-radius:10px;display:block;margin-bottom:10px;}
  .fi-actions{display:flex;gap:8px;align-items:center;}
  .fi-check-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;border:1px solid var(--fog);background:var(--surface);font-size:12px;font-weight:600;color:var(--graphite);}
  .fi-check-btn.done{background:var(--mintwash);border-color:#b8ecc7;color:#1e8a45;}
  .fi-reply-toggle{font-size:12px;color:var(--lavender);font-weight:600;background:none;border:none;}
  .fi-reply-box{margin-top:10px;display:flex;gap:8px;}
  .fi-reply-box input{flex:1;padding:8px 12px;border:1px solid var(--fog);border-radius:9999px;font-size:12.5px;}
  .fi-reply-list{margin-top:10px;padding-top:10px;border-top:1px dashed var(--fog);}
  .fi-reply{font-size:12.5px;color:var(--graphite);margin-bottom:6px;}
  .fi-reply b{color:var(--carbon);}

  /* ---------- chat ---------- */
  .thread-pills{display:flex;gap:8px;margin-bottom:16px;}
  .thread-pill{padding:8px 16px;border-radius:9999px;border:1px solid var(--fog);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--graphite);}
  .thread-pill.active{background:var(--lavender);border-color:var(--lavender);color:#fff;}
  .msg-group{display:flex;gap:10px;margin-bottom:16px;}
  .msg-group.me{flex-direction:row-reverse;}
  .msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--iris);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .msg-group.me .msg-avatar{background:var(--carbon);}
  .msg-col{max-width:62%;}
  .msg-group.me .msg-col{align-items:flex-end;display:flex;flex-direction:column;}
  .msg-meta{display:flex;gap:7px;align-items:baseline;margin-bottom:4px;}
  .msg-group.me .msg-meta{flex-direction:row-reverse;}
  .msg-name{font-size:12.5px;font-weight:700;}
  .msg-time{font-size:10.5px;color:var(--ash);}
  .msg-content{background:var(--mist);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:13.5px;color:var(--carbon);line-height:1.5;}
  .msg-group.me .msg-content{background:var(--lavender);color:#fff;border-radius:16px 16px 4px 16px;}
  .msg-attach{margin-top:6px;border-radius:10px;overflow:hidden;border:1px solid var(--fog);max-width:200px;}
  .msg-attach img{width:100%;display:block;}
  .msg-read{font-size:10px;color:var(--ash);margin-top:4px;}

  .conv-input{
    flex-shrink:0;border-top:1px solid var(--fog);padding:14px 24px;display:flex;align-items:center;gap:10px;
    position:sticky;bottom:0;background:var(--surface);
  }
  .msg-input{flex:1;padding:11px 16px;border:1px solid var(--fog);border-radius:9999px;font-size:13.5px;outline:none;}
  .input-actions{display:flex;gap:4px;}
  .input-actions button{width:34px;height:34px;border-radius:9999px;border:none;background:var(--mist);color:var(--graphite);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .send-btn{width:38px;height:38px;border-radius:9999px;background:var(--lavender);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .send-btn:disabled{opacity:.4;}

  /* ---------- settlement ---------- */
  .settle-summary{display:flex;gap:12px;margin-bottom:18px;}
  .settle-summary-card{flex:1;background:var(--surface);border:1px solid var(--fog);border-radius:16px;padding:14px 16px;}
  .settle-summary-card .label{font-size:11.5px;color:var(--ash);margin-bottom:6px;}
  .settle-summary-card .val{font-size:20px;font-weight:700;}
  .settle-item{background:var(--surface);border:1px solid var(--fog);border-radius:16px;padding:14px 18px;margin-bottom:10px;}
  .settle-row{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .settle-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .settle-icon.pay{background:var(--mintwash);color:#1e8a45;}
  .settle-icon.refund{background:#ffece0;color:var(--ember);}
  .settle-title{font-size:13.5px;font-weight:700;}
  .settle-sub{font-size:11.5px;color:var(--ash);}
  .settle-amount{margin-left:auto;font-size:14.5px;font-weight:700;}
  .settle-amount.neg{color:var(--ember);}
  .settle-amount.pos{color:#1e8a45;}
  .settle-receipt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--fog);font-size:12.5px;color:var(--graphite);display:flex;flex-direction:column;gap:5px;}

  /* ---------- profile ---------- */
  .profile-row{background:var(--surface);border:1px solid var(--fog);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .profile-row-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;}
  .profile-row-head b{font-size:13.5px;}
  .profile-row-body{padding:0 18px 16px;display:none;}
  .profile-row.open .profile-row-body{display:block;animation:fadeIn .2s ease;}
  .profile-row.open .chevron{transform:rotate(180deg);}
  .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pf-field{background:var(--mist);border-radius:10px;padding:9px 12px;}
  .pf-field .k{font-size:10.5px;color:var(--ash);margin-bottom:3px;}
  .pf-field .v{font-size:12.5px;font-weight:600;}
  .pf-timeline-item{display:flex;gap:9px;font-size:12.5px;color:var(--graphite);margin-bottom:9px;}
  .pf-dot{width:7px;height:7px;border-radius:50%;background:var(--lavender);margin-top:5px;flex-shrink:0;}
  .care-search{display:flex;align-items:center;gap:7px;background:var(--mist);border-radius:9999px;padding:8px 14px;margin-bottom:10px;}
  .care-search input{border:none;background:none;outline:none;font-size:12.5px;width:100%;}
  .care-log{font-size:12.5px;color:var(--graphite);padding:8px 0;border-bottom:1px solid var(--fog);}
  .care-log b{color:var(--carbon);}

  /* ---------- info panel ---------- */
  .info-panel{width:312px;flex-shrink:0;background:var(--linen);border-left:1px solid var(--fog);height:100vh;overflow-y:auto;animation:slideInFromRight .22s ease;}
  .info-panel.closed{display:none;}
  .info-header{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--fog);}
  .info-header h3{margin:0;font-size:14.5px;font-weight:700;}
  .close-info{width:26px;height:26px;border-radius:9999px;border:none;background:var(--surface);color:var(--graphite);}
  .info-section{padding:16px 18px;border-bottom:1px solid var(--fog);}
  .info-label{font-size:10.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:10px;}
  .info-value{font-size:13px;color:var(--carbon);}
  .info-profile-card{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .progress-bar{height:7px;background:var(--fog);border-radius:9999px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#f68dee,#b6ff00);border-radius:9999px;}
  .member-item{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .member-avatar{width:28px;height:28px;border-radius:50%;background:var(--iris);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .member-name{font-size:12.5px;font-weight:600;}
  .member-role{font-size:10.5px;color:var(--ash);margin-left:auto;}
  .pinned-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--graphite);padding:8px 0;text-decoration:none;}
  .info-edit-btn{width:100%;justify-content:center;margin-top:6px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9999px;font-size:13px;font-weight:600;border:1px solid transparent;}
  .btn-primary{background:var(--lavender);color:#fff;}
  .btn-primary:hover{background:#7c76f2;}
  .btn-secondary{background:var(--surface);color:var(--carbon);border-color:var(--fog);}
  .btn-secondary:hover{background:var(--mist);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .modal-overlay{position:fixed;inset:0;background:rgba(24,25,37,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
  .modal-box{background:var(--surface);border-radius:20px;max-width:420px;width:100%;box-shadow:var(--shadow-card);animation:fadeInScale .2s ease;overflow:hidden;}
  .modal-head{padding:20px 22px 6px;display:flex;justify-content:space-between;align-items:flex-start;}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:12px 22px 4px;font-size:13px;color:var(--graphite);}
  .modal-body label{display:block;font-size:12px;font-weight:700;color:var(--carbon);margin:12px 0 6px;}
  .modal-body input{width:100%;padding:9px 12px;border:1px solid var(--fog);border-radius:9999px;font-size:13px;}
  .modal-foot{padding:16px 22px 22px;display:flex;gap:8px;justify-content:flex-end;}

  .toast-stack{position:fixed;bottom:22px;right:22px;z-index:95;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--carbon);color:#fff;padding:11px 18px;border-radius:9999px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:8px;animation:fadeInUp .22s ease;}
  .toast i{color:var(--mint);}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes slideInFromRight{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.35);}}

  @media (max-width:1150px){
    .info-panel{display:none;}
    .settle-summary{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function Toast({toasts}){
  return <div className="toast-stack">{toasts.map(t=><div className="toast" key={t.id}><i className="ph ph-check-circle"></i>{t.text}</div>)}</div>;
}

/* ---------------- WORKSPACE STRIP ---------------- */
function WorkspaceStrip({screen, setScreen, unread, pushToast}){
  const items = [
    {key:'main', icon:'ph-house', label:'케어현황'},
    {key:'chat', icon:'ph-chat-circle-dots', label:'실시간 채팅', badge:unread>0},
    {key:'settlement', icon:'ph-receipt', label:'정산 스트림'},
    {key:'profile', icon:'ph-user-circle', label:'부모님 프로필'},
  ];
  return (
    <nav className="workspace-strip" data-workspace-strip>
      <div className="ws-logo">CS</div>
      {items.map(it=>(
        <button key={it.key} className={"ws-item"+(screen===it.key?' active':'')} title={it.label} onClick={()=>setScreen(it.key)}>
          <i className={"ph "+it.icon}></i>
          {it.badge && <span className="ws-badge"></span>}
        </button>
      ))}
      <div className="ws-divider"></div>
      <button className="ws-add" title="새 프로그램 시작" onClick={()=>pushToast('새 프로그램 등록은 준비 중입니다.')}><i className="ph ph-plus"></i></button>
    </nav>
  );
}

/* ---------------- CHANNEL LIST ---------------- */
function ChannelList({screen, setScreen, unread, onOpenFamilyEdit}){
  const [q, setQ] = useState('');
  const [chOpen, setChOpen] = useState(true);
  const [dmOpen, setDmOpen] = useState(true);
  const channels = [
    {key:'main', name:'케어현황'},
    {key:'chat', name:'실시간 채팅'},
    {key:'settlement', name:'정산 스트림'},
    {key:'profile', name:'부모님 프로필'},
  ].filter(c=> c.name.includes(q));
  const dms = [
    {key:'teacher', name:'박지훈 선생님', presence:'online', unread: unread},
    {key:'support', name:'케어스텝 고객센터', presence:'away', unread: 0},
  ].filter(d=> d.name.includes(q));

  return (
    <aside className="channel-list" data-channel-list>
      <div className="channel-header">
        <div className="fam">
          <div className="fam-avatar">이</div>
          <div>
            <h2 className="ws-name">이OO 가족</h2>
            <div className="fam-sub">보호자: 김서연</div>
          </div>
        </div>
        <button className="icon-btn" onClick={onOpenFamilyEdit}><i className="ph ph-pencil-simple"></i></button>
      </div>
      <div className="channel-search">

function Chat({pushToast}){
  const [thread, setThread] = useState('teacher');
  const [msgs, setMsgs] = useState({
    teacher: [
      {me:false, text:'안녕하세요, 내일 오전 10시 방문 예정입니다.', time:'09:02'},
      {me:true, text:'네 감사합니다! 아버지께 미리 말씀드릴게요.', time:'09:05'},
      {me:false, text:'혹시 최근에 어지러움 호소하신 적 있으실까요?', time:'09:06'},
      {me:true, text:'어제 잠깐 그러셨다고 하셨어요. 사진 첨부드려요.', time:'09:11', attach:true},
      {me:false, text:'확인했습니다. 방문해서 혈압도 함께 체크해보겠습니다.', time:'09:12'},
    ],
    support: [
      {me:false, text:'안녕하세요 케어스텝 고객센터입니다. 무엇을 도와드릴까요?', time:'어제'},
      {me:true, text:'정산 내역 영수증을 다시 받고 싶어요.', time:'어제'},
      {me:false, text:'정산 화면에서 해당 항목의 영수증 보기를 눌러주시면 확인 가능합니다.', time:'어제'},
    ],
  });
  const [draft, setDraft] = useState('');
  const lastRef = useRef(null);

  useEffect(()=>{ if(lastRef.current) lastRef.current.scrollIntoView({block:'nearest'}); },[msgs, thread]);

  function send(){
    if(!draft.trim()) return;
    const text = draft.trim();
    setMsgs(prev=>({...prev, [thread]:[...prev[thread], {me:true, text, time:'방금'}]}));
    setDraft('');
    setTimeout(()=>{
      setMsgs(prev=>({...prev, [thread]:[...prev[thread], {me:false, text: thread==='teacher' ? '네, 확인했습니다. 방문 시 자세히 살펴보겠습니다.' : '네, 추가로 도와드릴 부분 있으면 말씀해주세요.', time:'방금'}]}));
    }, 1000);
  }

  const names = {teacher:'박지훈 선생님', support:'케어스텝 고객센터'};

  return (
    <div>
      <div className="thread-pills">
        <button className={"thread-pill"+(thread==='teacher'?' active':'')} onClick={()=>setThread('teacher')}>박지훈 선생님</button>
        <button className={"thread-pill"+(thread==='support'?' active':'')} onClick={()=>setThread('support')}>케어스텝 고객센터</button>
      </div>
      <div>
        {msgs[thread].map((m,i)=>(
          <div className={"msg-group"+(m.me?' me':'')} key={i} ref={i===msgs[thread].length-1 ? lastRef : null}>
            <div className="msg-avatar">{m.me?'김':names[thread][0]}</div>
            <div className="msg-col">
              <div className="msg-meta"><span className="msg-name">{m.me?'김서연':names[thread]}</span><span className="msg-time">{m.time}</span></div>
              <div className="msg-content">{m.text}</div>
              {m.attach && <div className="msg-attach"><img src="https://picsum.photos/seed/carestep-chat-1/240/160" alt="첨부 이미지"/></div>}
              {m.me && i===msgs[thread].length-1 && <div className="msg-read">읽음</div>}
            </div>
          </div>
        ))}
      </div>
      <footer className="conv-input">
        <div className="input-actions">
          <button title="첨부" onClick={()=>pushToast('파일 첨부는 준비 중입니다.')}><i className="ph ph-paperclip"></i></button>
          <button title="이모지" onClick={()=>pushToast('이모지 선택은 준비 중입니다.')}><i className="ph ph-smiley"></i></button>
        </div>
        <input className="msg-input" placeholder="메시지를 입력하세요…" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter') send();}}/>
        <button className="send-btn" disabled={!draft.trim()} onClick={send}><i className="ph ph-paper-plane-tilt"></i></button>
      </footer>
    </div>
  );
}

            <span className="channel-prefix">#</span>
            <h2>{meta.title}</h2>
            <span className="member-count">{meta.sub}</span>
          </div>
          <div className="conv-actions">
            <button className="conv-action" onClick={()=>pushToast('상단에 고정되었습니다.')}><i className="ph ph-push-pin"></i></button>
            <button className="conv-action" onClick={()=>pushToast('검색 기능은 준비 중입니다.')}><i className="ph ph-magnifying-glass"></i></button>
            <button className={"conv-action"+(infoOpen?' active':'')} onClick={()=>setInfoOpen(v=>!v)}><i className="ph ph-info"></i></button>
          </div>
        </header>
        <div className="conv-body">
          {screen==='main' && <MainFeed pushToast={pushToast}/>}
          {screen==='chat' && <Chat pushToast={pushToast}/>}
          {screen==='settlement' && <Settlement/>}
          {screen==='profile' && <ProfilePage onEdit={()=>setProfEditOpen(true)}/>}
        </div>
      </main>
      <InfoPanel open={infoOpen} onClose={()=>setInfoOpen(false)} screen={screen} pushToast={pushToast}/>

      {famEditOpen && (
        <div className="modal-overlay" onClick={()=>setFamEditOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>가족 정보 수정</h3><button className="icon-btn" onClick={()=>setFamEditOpen(false)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <label>가족 워크스페이스 이름</label>
              <input defaultValue="이OO 가족"/>
              <label>보호자 이름</label>
              <input defaultValue="김서연"/>
            </div>
            <div className="modal-foot">
              <button className="btn btn-secondary" onClick={()=>setFamEditOpen(false)}>취소</button>
              <button className="btn btn-primary" onClick={()=>{setFamEditOpen(false); pushToast('가족 정보가 저장되었습니다.');}}>저장</button>
            </div>
          </div>
        </div>
      )}
      {profEditOpen && (
        <div className="modal-overlay" onClick={()=>setProfEditOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>부모님 정보 수정</h3><button className="icon-btn" onClick={()=>setProfEditOpen(false)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <label>거주 지역</label>
              <input defaultValue="서울 강남구"/>
              <label>거동 가능 여부</label>
              <input defaultValue="부축 필요"/>
            </div>
            <div className="modal-foot">
              <button className="btn btn-secondary" onClick={()=>setProfEditOpen(false)}>취소</button>
              <button className="btn btn-primary" onClick={()=>{setProfEditOpen(false); pushToast('프로필 정보가 저장되었습니다.');}}>저장</button>
            </div>
          </div>
        </div>
      )}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
