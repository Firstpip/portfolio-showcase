<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다온몰 — SSO 통합 쇼핑몰 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --primary:#fa5d00;
    --secondary:#c0bbb6;
    --accent:#1ef6da;
    --bg:#fff8f1;
    --surface:#ffffff;
    --text:#1d1e1c;
    --text2:#615f5c;
    --radius-card:20px;
    --radius-btn:16px;
    --shadow-card:0 10px 28px rgba(250,93,0,0.12);
    --shadow-btn:0 6px 16px rgba(250,93,0,0.22);
    --shadow-soft:0 2px 8px rgba(29,30,28,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;min-height:100vh;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    letter-spacing:0.015em;
  }
  #root{width:100%;min-height:100vh;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(30,246,218,0.55);}70%{box-shadow:0 0 0 8px rgba(30,246,218,0);}100%{box-shadow:0 0 0 0 rgba(30,246,218,0);}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}

  .view-fade{animation:fadeIn 0.38s ease both;}

  /* ── search header (airbnb-search-grid signature) ── */
  .search-header{
    position:sticky; top:0; z-index:50;
    background:var(--surface);
    border-bottom:1px solid #f0e6da;
  }
  .header-row{
    max-width:1280px; margin:0 auto;
    display:flex; align-items:center; gap:24px;
    padding:16px 32px;
  }
  .brand{font-size:22px; font-weight:800; color:var(--primary); flex-shrink:0; letter-spacing:0.2px;}
  .search-bar{
    flex:1; display:flex; align-items:center;
    background:var(--bg); border:1px solid #f0e2d0;
    border-radius:999px; box-shadow:var(--shadow-soft);
    padding:6px 10px; max-width:640px;
  }
  .search-segment{
    flex:1; text-align:left; padding:6px 16px; border-radius:999px;
    transition:background .15s;
  }
  .search-segment:hover{background:#fff2e4;}
  .segment-label{font-size:11px; color:var(--text2); font-weight:600;}
  .segment-value{font-size:13.5px; color:var(--text); margin-top:1px;}
  .search-divider{width:1px; height:26px; background:#e8dccb;}
  .search-submit{
    width:38px; height:38px; border-radius:50%; background:var(--primary);
    color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:var(--shadow-btn);
  }
  .header-nav{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .nav-icon-btn{
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--text); position:relative; transition:background .15s;
  }
  .nav-icon-btn:hover{background:#fff2e4;}
  .cart-badge{
    position:absolute; top:2px; right:2px; background:var(--primary); color:#fff;
    font-size:10px; font-weight:700; border-radius:999px; min-width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  .filter-chips{
    max-width:1280px; margin:0 auto; padding:0 32px 16px;
    display:flex; gap:10px; overflow-x:auto;
  }
  .chip{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    padding:9px 18px; border-radius:999px; border:1px solid #ede0cf;
    background:var(--surface); font-size:13.5px; font-weight:600; color:var(--text2);
    transition:all .15s;
  }
  .chip:hover{border-color:var(--primary); color:var(--primary);}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  .main{max-width:1280px; margin:0 auto; padding:32px; width:100%;}

  .hero{
    position:relative; border-radius:28px; overflow:hidden; padding:56px 48px;
    background:linear-gradient(120deg,#fff1de 0%,#ffe0c2 55%,#ffd2ac 100%);
    display:flex; align-items:center; justify-content:space-between; margin-bottom:40px;
  }
  .hero-eyebrow{font-size:13px; font-weight:700; color:var(--primary); letter-spacing:1px; text-transform:uppercase;}
  .hero-title{font-size:44px; font-weight:800; line-height:1.2; margin:12px 0 16px; max-width:520px;}
  .hero-desc{font-size:15px; color:var(--text2); max-width:460px; margin-bottom:24px; line-height:1.6;}
  .hero-cta{
    padding:14px 28px; background:var(--primary); color:#fff; border-radius:var(--radius-btn);
    font-size:15px; font-weight:700; box-shadow:var(--shadow-btn); transition:transform .15s;
  }
  .hero-cta:hover{transform:translateY(-2px);}
  .hero-visual{
    width:220px; height:220px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, #ffb37a 45%, #fa5d00 100%);
    box-shadow:0 20px 40px rgba(250,93,0,0.28); position:relative;
  }
  .hero-dots{display:flex; gap:6px; position:absolute; bottom:24px; left:48px;}
  .hero-dots span{width:7px; height:7px; border-radius:50%; background:#e8c9a6;}
  .hero-dots span.active{background:var(--primary); width:20px; border-radius:4px;}

  .quick-tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:44px;}
  .quick-tile{
    background:var(--surface); border-radius:18px; padding:20px 12px; text-align:center;
    box-shadow:var(--shadow-soft); transition:transform .15s, box-shadow .15s;
  }
  .quick-tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-card);}
  .quick-tile-icon{
    width:44px; height:44px; border-radius:14px; background:#fff1de; color:var(--primary);
    display:flex; align-items:center; justify-content:center; margin:0 auto 10px;
  }
  .quick-tile-label{font-size:12.5px; font-weight:600; color:var(--text);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .section-title{font-size:22px; font-weight:800;}
  .section-sub{font-size:13px; color:var(--text2); margin-top:4px;}

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px;
  }
  .listing-card{
    background:var(--surface); border-radius:var(--radius-card); overflow:hidden;
    box-shadow:var(--shadow-soft); transition:transform .18s, box-shadow .18s; animation:fadeIn .4s ease both;
  }
  .listing-card:hover{transform:translateY(-4px) scale(1.01); box-shadow:var(--shadow-card);}
  .card-image-wrap{
    position:relative; width:100%; aspect-ratio:4/3;
  }
  .card-favorite{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center;
    color:var(--text2); box-shadow:var(--shadow-soft);
  }
  .card-favorite.active{color:var(--primary);}
  .card-badge{
    position:absolute; top:12px; left:12px; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; color:#fff; background:var(--text);
  }
  .card-badge.best{background:var(--primary);}
  .card-badge.sale{background:#e0432a;}
  .card-body{padding:16px 16px 18px;}
  .card-row-1{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .card-title{font-size:15.5px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-rating{font-size:12.5px; color:var(--text2); flex-shrink:0; display:flex; align-items:center; gap:2px;}
  .card-meta{font-size:12.5px; color:var(--text2); margin-top:4px; display:block;}
  .card-row-4{display:flex; align-items:baseline; gap:6px; margin-top:10px;}
  .card-price{font-size:17px; font-weight:800;}
  .price-unit{font-size:11.5px; color:var(--text2);}

  .footer{
    background:var(--text); color:#d8d3ce; margin-top:56px; padding:44px 32px 28px;
  }
  .footer-cols{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:32px; padding-bottom:28px; border-bottom:1px solid #37342f;}
  .footer-col h4{font-size:13px; margin-bottom:14px; color:#fff;}
  .footer-col a{display:block; font-size:12.5px; color:#a8a29a; margin-bottom:8px;}
  .footer-bottom{max-width:1280px; margin:16px auto 0; font-size:11.5px; color:#7a756e;}

  /* ── generic page (mypage/product/cart/checkout) ── */
  .page-head{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  .back-btn{width:38px; height:38px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow-soft); display:flex; align-items:center; justify-content:center;}
  .page-title{font-size:24px; font-weight:800;}

  .sso-banner{
    display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:18px;
    padding:18px 22px; box-shadow:var(--shadow-soft); margin-bottom:24px;
  }
  .sso-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); animation:pulseDot 2s infinite;}
  .sso-text b{color:var(--primary);}

  .tab-row{display:flex; gap:6px; margin-bottom:24px; background:var(--surface); padding:6px; border-radius:14px; width:fit-content; box-shadow:var(--shadow-soft);}
  .tab-btn{padding:10px 20px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--text2);}
  .tab-btn.active{background:var(--primary); color:#fff;}

  .panel{background:var(--surface); border-radius:var(--radius-card); padding:26px; box-shadow:var(--shadow-soft); margin-bottom:20px;}
  .order-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #f2e9dc;}
  .order-row:last-child{border-bottom:none;}
  .status-badge{padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700;}
  .status-badge.done{background:#e5f7ef; color:#159a5c;}
  .status-badge.ing{background:#fff1de; color:var(--primary);}

  .track-steps{display:flex; align-items:center; margin:14px 0 4px;}
  .track-step{flex:1; text-align:center; position:relative;}
  .track-step .dot{width:26px; height:26px; border-radius:50%; background:#f0e6da; color:var(--text2); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:12px; font-weight:700;}
  .track-step.done .dot{background:var(--primary); color:#fff;}
  .track-step .line{position:absolute; top:13px; left:-50%; width:100%; height:2px; background:#f0e6da; z-index:-1;}
  .track-step.done .line{background:var(--primary);}
  .track-step:first-child .line{display:none;}
  .track-label{font-size:11.5px; color:var(--text2);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field label{font-size:12.5px; font-weight:600; color:var(--text2);}
  .form-field input{padding:12px 14px; border:1px solid #ede0cf; border-radius:12px; font-size:14px; background:var(--bg);}
  .danger-btn{padding:11px 18px; border-radius:var(--radius-btn); font-size:13px; font-weight:700; border:1px solid #e0432a; color:#e0432a; background:#fff;}

  /* product view */
  .product-layout{display:grid; grid-template-columns:1fr 1fr; gap:44px;}
  .gallery-main{width:100%; aspect-ratio:1/1; border-radius:24px; background:linear-gradient(135deg,#ffe6cc,#ffb37a 60%,#fa5d00); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-card); margin-bottom:14px;}
  .gallery-thumbs{display:flex; gap:10px;}
  .gallery-thumb{width:64px; height:64px; border-radius:12px; background:linear-gradient(135deg,#ffe6cc,#ffb37a); opacity:.55; border:2px solid transparent;}
  .gallery-thumb.active{opacity:1; border-color:var(--primary);}
  .opt-group{margin-bottom:20px;}
  .opt-label{font-size:13px; font-weight:700; margin-bottom:10px;}
  .opt-swatch-row{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:38px; height:38px; border-radius:50%; border:2px solid #ede0cf;}
  .swatch.active{border-color:var(--primary); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--primary);}
  .size-chip{padding:9px 16px; border-radius:12px; border:1px solid #ede0cf; font-size:13.5px; font-weight:600; background:var(--surface);}
  .size-chip.active{background:var(--text); color:#fff; border-color:var(--text);}
  .size-chip.soldout{opacity:.35; text-decoration:line-through;}
  .price-box{background:var(--bg); border-radius:16px; padding:18px 20px; margin:20px 0;}
  .price-final{font-size:30px; font-weight:800; animation:fadeIn .3s ease;}
  .add-cart-btn{width:100%; padding:16px; background:var(--primary); color:#fff; border-radius:var(--radius-btn); font-size:15.5px; font-weight:800; box-shadow:var(--shadow-btn);}
  .review-row{padding:16px 0; border-bottom:1px solid #f2e9dc;}

  /* cart / checkout */
  .cart-layout{display:grid; grid-template-columns:1.6fr 1fr; gap:32px; align-items:start;}
  .cart-item{display:flex; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid #f2e9dc;}
  .cart-thumb{width:72px; height:72px; border-radius:14px; background:linear-gradient(135deg,#ffe6cc,#ffb37a); flex-shrink:0;}
  .qty-stepper{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:10px; padding:4px 8px;}
  .qty-stepper button{width:24px; height:24px; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center;}
  .pay-methods{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;}
  .pay-method{padding:14px 8px; border-radius:14px; border:1.5px solid #ede0cf; text-align:center; font-size:12.5px; font-weight:700; color:var(--text2);}
  .pay-method.active{border-color:var(--primary); color:var(--primary); background:#fff5ea;}
  .summary-row{display:flex; justify-content:space-between; font-size:13.5px; color:var(--text2); margin-bottom:10px;}
  .summary-total{display:flex; justify-content:space-between; font-size:19px; font-weight:800; margin-top:14px; padding-top:14px; border-top:1px solid #f2e9dc;}

  .modal-overlay{position:fixed; inset:0; background:rgba(29,30,28,0.45); display:flex; align-items:center; justify-content:center; z-index:100;}
  .modal-box{background:#fff; border-radius:22px; padding:28px; width:400px; max-width:90vw; animation:scaleIn .22s ease both; box-shadow:0 24px 60px rgba(0,0,0,0.25);}
  .addr-result{padding:12px; border-radius:12px; margin-bottom:8px; background:var(--bg);}
  .addr-result:hover{background:#ffe9d2;}

  .toast-wrap{position:fixed; bottom:28px; right:28px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{background:var(--text); color:#fff; padding:14px 20px; border-radius:14px; font-size:13.5px; box-shadow:0 10px 24px rgba(0,0,0,0.25); animation:slideInRight .3s ease both; display:flex; align-items:center; gap:10px;}

  @media (max-width:900px){
    .quick-tiles{grid-template-columns:repeat(3,1fr);}
    .product-layout, .cart-layout{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .search-bar{display:none;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const CATEGORIES = ['전체','산업기계','공구·장비','안전용품','소모품','사무·생활','기업전용관','신상품','특가'];

const PRODUCTS = [
  {id:1, name:'중량형 산업용 캐스터 4P 세트', cat:'산업기계', brand:'다온파츠', price:128000, rating:4.8, reviews:212, badge:'BEST'},
  {id:2, name:'디지털 토크렌치 프로 세트', cat:'공구·장비', brand:'그린툴즈', price:342000, rating:4.9, reviews:154, badge:null},
  {id:3, name:'안전화 방한 방수 A등급', cat:'안전용품', brand:'세이프웨어', price:79000, rating:4.6, reviews:341, badge:'SALE'},
  {id:4, name:'컨베이어 벨트 롤러 유닛', cat:'산업기계', brand:'다온파츠', price:512000, rating:4.7, reviews:88, badge:null},
  {id:5, name:'절연 안전장갑 6종 세트', cat:'안전용품', brand:'세이프웨어', price:36000, rating:4.5, reviews:498, badge:null},
  {id:6, name:'에어 컴프레서 25L', cat:'산업기계', brand:'파워코어', price:289000, rating:4.7, reviews:167, badge:'신상품'},
  {id:7, name:'윤활유 산업용 20L', cat:'소모품', brand:'루브텍', price:64000, rating:4.4, reviews:233, badge:null},
  {id:8, name:'사무용 인체공학 의자', cat:'사무·생활', brand:'오피스랩', price:198000, rating:4.8, reviews:412, badge:'BEST'},
  {id:9, name:'스테인리스 작업대 1500', cat:'산업기계', brand:'다온파츠', price:224000, rating:4.6, reviews:76, badge:null},
  {id:10, name:'기업 전용 대량 소모품 패키지', cat:'기업전용관', brand:'다온비즈', price:890000, rating:4.9, reviews:41, badge:'특가'},
  {id:11, name:'방진 마스크 20매입', cat:'안전용품', brand:'세이프웨어', price:18000, rating:4.3, reviews:602, badge:'SALE'},
  {id:12, name:'전동 드라이버 세트 12V', cat:'공구·장비', brand:'그린툴즈', price:96000, rating:4.7, reviews:289, badge:null},
  {id:13, name:'창고용 팔레트 랙 3단', cat:'산업기계', brand:'파워코어', price:410000, rating:4.5, reviews:59, badge:'신상품'},
  {id:14, name:'사무용 라벨프린터', cat:'사무·생활', brand:'오피스랩', price:142000, rating:4.6, reviews:190, badge:null},
];

const COLORS = [
  {id:'gray', hex:'#8a8a8a'}, {id:'orange', hex:'#fa5d00'}, {id:'navy', hex:'#2c3550'}
];
const SIZES = [
  {id:'S', delta:0, soldout:false}, {id:'M', delta:8000, soldout:false},
  {id:'L', delta:15000, soldout:false}, {id:'XL', delta:22000, soldout:true},
];

function Icon({name, size=18, style}){
  return <i data-lucide={name} style={{width:size, height:size, ...style}}></i>;
}

function Header({view, setView, cartCount, activeCat, setActiveCat}){
  return (
    <div className="search-header">
      <div className="header-row">
        <a className="brand" onClick={()=>setView('main')} style={{cursor:'pointer'}}>다온몰</a>
        <div className="search-bar">
          <button className="search-segment" onClick={()=>setActiveCat('전체')}>
            <div className="segment-label">카테고리</div>
            <div className="segment-value">{activeCat}</div>
          </button>
          <div className="search-divider"></div>
          <button className="search-segment" onClick={()=>alert('브랜드 필터 — 그린툴즈, 세이프웨어, 다온파츠 등')}>
            <div className="segment-label">브랜드</div>
            <div className="segment-value">전체 브랜드</div>
          </button>
          <div className="search-divider"></div>
          <button className="search-segment" onClick={()=>alert('가격대 필터 — 1만원 ~ 100만원')}>
            <div className="segment-label">가격대</div>
            <div className="segment-value">전체 가격</div>
          </button>
          <button className="search-submit" onClick={()=>setView('main')}><Icon name="search" size={16}/></button>
        </div>
        <nav className="header-nav">
          <button className="nav-icon-btn" title="마이페이지" onClick={()=>setView('mypage')}><Icon name="user-round" size={20}/></button>

function App(){
  const [view, setView] = useState('main');
  const [activeCat, setActiveCat] = useState('전체');
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [cart, setCart] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [toasts, setToasts] = useState([]);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const addToast = (msg)=>{
    const id = Date.now();
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };
  const openProduct = (p)=>{ setSelectedProduct(p); setView('product'); };
  const toggleFav = (id)=> setFavorites(f=> f.includes(id) ? f.filter(x=>x!==id) : [...f, id]);
  const addToCart = (product, color, size, price)=>{
    setCart(c=>[...c, {name:product.name, price, qty:1, size:size.id, color:color.id}]);
  };
  const handleAdd = (product, color, size, price)=>{
    addToCart(product, color, size, price);
    addToast(product.name+' 장바구니에 담았습니다');
    setView('cart');
  };
  const updateQty = (i, delta)=>{
    setCart(c=> c.map((item,idx)=> idx===i ? {...item, qty: Math.max(1, item.qty+delta)} : item));
  };
  const removeItem = (i)=> setCart(c=> c.filter((_,idx)=>idx!==i));

  return (
    <div data-archetype="airbnb-search-grid">
      <Header view={view} setView={setView} cartCount={cart.length} activeCat={activeCat} setActiveCat={setActiveCat}/>
      {view==='main' && <MainView setView={setView} addToast={addToast} activeCat={activeCat} setActiveCat={setActiveCat} openProduct={openProduct} favorites={favorites} toggleFav={toggleFav}/>}
      {view==='mypage' && <MyPageView setView={setView}/>}
      {view==='product' && <ProductView product={selectedProduct} setView={setView} onAdd={handleAdd}/>}
      {view==='cart' && <CartView cart={cart} setView={setView} updateQty={updateQty} removeItem={removeItem} addToast={addToast}/>}
      {view==='checkout' && <CheckoutView cart={cart} setView={setView} addToast={addToast}/>}
      <Footer/>
      <div className="toast-wrap">
        {toasts.map(t=>(
          <div className="toast" key={t.id}><Icon name="check-circle" size={15}/>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
