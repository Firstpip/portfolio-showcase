<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다온 어드민 — 쇼핑몰 통합 관리자 백오피스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/dist/index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --primary:#e6e6e6;
    --secondary:#363739;
    --accent:#ff6363;
    --bg:#040506;
    --surface:#07080a;
    --surface-glass:rgba(255,255,255,0.035);
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --text2:#9c9c9d;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;min-height:100vh;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;min-height:100vh;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select{font-family:inherit; color:var(--text);}
  table{border-collapse:collapse; width:100%;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,99,99,0.5);}70%{box-shadow:0 0 0 7px rgba(255,99,99,0);}100%{box-shadow:0 0 0 0 rgba(255,99,99,0);}}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes shimmer{0%{opacity:.4;}50%{opacity:.9;}100%{opacity:.4;}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}

  .view-fade{animation:fadeIn .35s ease both;}

  .app-shell{display:flex; width:100%; min-height:100vh;}

  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:248px;
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; overflow-y:auto;
  }
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:8px 10px 20px;}
  .sidebar-brand-mark{width:30px; height:30px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff;}
  .sidebar-brand-name{font-weight:800; font-size:15px;}
  .env-tag{margin-left:auto; font-size:10.5px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,0.06); color:var(--text2);}
  .sidebar-section{margin-bottom:18px;}
  .sidebar-section-title{font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; padding:6px 12px;}
  .sidebar-link{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    font-size:13.5px; color:var(--text2); margin-bottom:2px; width:100%; text-align:left;
  }
  .sidebar-link:hover{background:rgba(255,255,255,0.05); color:var(--text);}
  .sidebar-link.active{background:rgba(255,99,99,0.12); color:var(--text);}
  .sidebar-link.active i{color:var(--accent);}

  .main-wrap{margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px); padding:28px 34px 60px;}

  .page-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px;}
  .page-title{font-size:22px; font-weight:800;}
  .page-meta{font-size:12px; color:var(--text2); margin-top:6px;}
  .page-actions{display:flex; gap:10px;}
  .btn-secondary{padding:9px 16px; border-radius:10px; border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--text);}
  .btn-secondary:hover{background:rgba(255,255,255,0.05);}
  .btn-primary{padding:9px 18px; border-radius:10px; background:var(--primary); color:#0c0c0d; font-size:13px; font-weight:700;}
  .btn-accent{padding:9px 18px; border-radius:10px; background:var(--accent); color:#fff; font-size:13px; font-weight:700;}

  .dash-hero{
    position:relative; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius);
    padding:28px 30px; margin-bottom:20px;
    background:radial-gradient(circle at 15% 20%, rgba(255,99,99,0.16), transparent 55%), var(--surface-glass);
  }
  .dash-hero-glow{
    position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,99,99,0.35), transparent 70%); filter:blur(4px);
    animation:shimmer 3.5s ease-in-out infinite;
  }
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px; animation:pulseDot 2s infinite;}
  .dash-hero-label{font-size:12px; color:var(--text2); letter-spacing:.4px;}
  .dash-hero-value{
    font-size:52px; font-weight:800; letter-spacing:-1px; margin-top:6px;
    background:linear-gradient(90deg, #ffffff 0%, #ff9d9d 65%, #ff6363 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block;
  }
  .dash-hero-sub{font-size:12.5px; color:var(--text2); margin-top:8px; max-width:520px; line-height:1.6;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  .stat-card{
    background:var(--surface-glass); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 20px 16px; backdrop-filter:blur(6px); animation:fadeIn .4s ease both;
  }
  .stat-label{font-size:12px; color:var(--text2); margin-bottom:10px;}
  .stat-value{font-size:32px; font-weight:700; letter-spacing:-0.5px;}
  .stat-delta{font-size:12px; margin-top:6px; display:inline-block;}
  .stat-delta.positive{color:#4ade80;}
  .stat-delta.negative{color:var(--accent);}
  .stat-sparkline{margin-top:10px; display:block;}

  .tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .tab{padding:10px 4px; margin-right:22px; font-size:13.5px; color:var(--text2); border-bottom:2px solid transparent; position:relative; top:1px;}
  .tab.active{color:var(--text); border-bottom-color:var(--accent);}

  .data-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .search-input{flex:1; max-width:280px; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13px;}
  .filter-chip{padding:8px 14px; border-radius:10px; border:1px solid var(--border); font-size:12.5px; color:var(--text2);}
  .export-btn{margin-left:auto; padding:9px 16px; border-radius:10px; border:1px solid var(--border); font-size:12.5px; color:var(--text2);}

  .panel{background:var(--surface-glass); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .data-table th{text-align:left; font-size:11.5px; color:var(--text2); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border);}
  .data-table td{font-size:13px; padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.05);}
  .data-table tr:hover td{background:rgba(255,255,255,0.03);}
  .badge{padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; display:inline-block;}
  .badge.success{background:rgba(74,222,128,0.14); color:#4ade80;}
  .badge.warn{background:rgba(255,183,77,0.14); color:#ffb74d;}
  .badge.fail{background:rgba(255,99,99,0.14); color:var(--accent);}

  .bar-chart{display:flex; align-items:flex-end; gap:10px; height:120px; padding:10px 4px;}
  .bar{flex:1; background:linear-gradient(180deg,var(--accent),rgba(255,99,99,0.25)); border-radius:6px 6px 0 0; transform-origin:bottom; animation:barGrow .5s ease both;}

  /* bulk-product upload */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:var(--radius); padding:36px; text-align:center;
    margin-bottom:22px; transition:border-color .15s;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone i{font-size:30px; color:var(--text2); margin-bottom:10px; display:block;}

  /* order master-detail */
  .md-layout{display:grid; grid-template-columns:340px 1fr; gap:0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .list-rail{background:var(--surface); border-right:1px solid var(--border); max-height:640px; overflow-y:auto;}
  .list-rail-head{padding:14px 16px; border-bottom:1px solid var(--border);}
  .list-item{padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.05); width:100%; text-align:left;}
  .list-item:hover{background:rgba(255,255,255,0.03);}
  .list-item.active{background:rgba(255,99,99,0.08); border-left:2px solid var(--accent);}
  .li-id{font-size:12.5px; font-weight:700;}
  .li-name{font-size:12px; color:var(--text2); margin-top:3px;}
  .detail-panel{padding:24px; background:var(--surface-glass);}
  .fsm-row{display:flex; align-items:center; gap:0; margin:18px 0 22px;}
  .fsm-step{flex:1; text-align:center; position:relative;}
  .fsm-step .dot{width:24px; height:24px; border-radius:50%; background:var(--secondary); display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:11px;}
  .fsm-step.done .dot{background:var(--accent); color:#fff;}
  .fsm-step .line{position:absolute; top:11px; left:-50%; width:100%; height:2px; background:var(--secondary); z-index:-1;}
  .fsm-step:first-child .line{display:none;}
  .fsm-step.done .line{background:var(--accent);}
  .fsm-label{font-size:10.5px; color:var(--text2);}
  .kv-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;}
  .kv-row span:first-child{color:var(--text2);}

  /* permissions matrix */
  .perm-table td, .perm-table th{text-align:center;}
  .perm-table td:first-child, .perm-table th:first-child{text-align:left;}
  .perm-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border); display:inline-flex; align-items:center; justify-content:center;}
  .perm-check.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100;}
  .modal-box{background:#0c0d0f; border:1px solid var(--border); border-radius:18px; padding:26px; width:380px; animation:scaleIn .2s ease both;}

  .toast-wrap{position:fixed; bottom:26px; right:26px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{background:#151517; border:1px solid var(--border); color:#fff; padding:13px 18px; border-radius:12px; font-size:13px; animation:slideInRight .3s ease both; display:flex; align-items:center; gap:8px;}

  @media (max-width:900px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .md-layout{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

function Icon({name, size=16, style}){
  return <i className={"ph ph-"+name} style={{fontSize:size, ...style}}></i>;
}

const NAV = [
  {group:'개요', items:[{id:'main', icon:'gauge', label:'대시보드'}]},
  {group:'쇼핑몰 관리', items:[
    {id:'bulk-product', icon:'file-xls', label:'엑셀 대량 등록'},
    {id:'order', icon:'package', label:'주문 관리'},
    {id:'migration', icon:'database', label:'회원 마이그레이션'},
  ]},
  {group:'설정', items:[{id:'permissions', icon:'lock-key', label:'권한 관리'}]},
];

function Sparkline({color='#ff6363'}){
  const pts = [8,14,10,18,15,22,19,26,24,30];
  const max = Math.max(...pts);
  const path = pts.map((p,i)=> `${i*8},${32-(p/max)*28}`).join(' ');
  return (
    <svg className="stat-sparkline" width="80" height="32" viewBox="0 0 80 32">
      <polyline points={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Sidebar({view, setView}){
  return (
    <aside className="sidebar" data-sidebar>
      <div className="sidebar-brand">
        <div className="sidebar-brand-mark">다</div>
        <div className="sidebar-brand-name">다온 어드민</div>
        <span className="env-tag">Production</span>
      </div>
      {NAV.map(g=>(
        <div className="sidebar-section" key={g.group}>
          <div className="sidebar-section-title">{g.group}</div>
          {g.items.map(it=>(
            <button key={it.id} className={"sidebar-link"+(view===it.id?' active':'')} onClick={()=>setView(it.id)}>
              <Icon name={it.icon} size={16}/>{it.label}
            </button>
          ))}
        </div>
      ))}
    </aside>
  );
}

function DashboardView({addToast}){
  const [tab, setTab] = useState('일간');
  const STATS = [
    {label:'오늘 매출', value:'8,240,000원', delta:'+6.2%', dir:'positive'},
    {label:'이번달 주문 건수', value:'1,284건', delta:'+3.1%', dir:'positive'},
    {label:'활성 상품 수', value:'642개', delta:'+12개', dir:'positive'},
    {label:'재고 부족 알림', value:'9건', delta:'주의 필요', dir:'negative'},
  ];
  const BARS = [40,65,50,80,58,72,90,66,84,60,76,54];
  const ORDERS = [
    {id:'DM-88231', name:'디지털 토크렌치 프로 세트', amount:'342,000원', status:'배송중'},
    {id:'DM-88230', name:'중량형 산업용 캐스터 4P', amount:'128,000원', status:'결제완료'},
    {id:'DM-88229', name:'안전화 방한 방수 A등급', amount:'79,000원', status:'구매확정'},
    {id:'DM-88228', name:'에어 컴프레서 25L', amount:'289,000원', status:'배송준비'},
    {id:'DM-88227', name:'기업 전용 대량 소모품 패키지', amount:'890,000원', status:'구매확정'},
    {id:'DM-88226', name:'전동 드라이버 세트 12V', amount:'96,000원', status:'취소'},
  ];
  const badgeCls = s => s==='구매확정' ? 'success' : s==='취소' ? 'fail' : 'warn';
  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">통합 관리자 대시보드 &amp; 매출 통계</div>
          <div className="page-meta"><span className="live-dot"></span>기계장터·쇼핑몰 통합 데이터 · 마지막 갱신 방금 전</div>
        </div>
        <div className="page-actions">
          <button className="btn-secondary" onClick={()=>addToast('기간을 최근 30일로 설정했습니다')}><Icon name="calendar-blank" size={14}/> 최근 30일</button>
          <button className="btn-primary" onClick={()=>addToast('통계 리포트를 내보냈습니다')}>리포트 내보내기</button>
        </div>
      </div>

      <div className="dash-hero">
        <div className="dash-hero-glow"></div>
        <div className="dash-hero-label">이번 달 누적 통합 매출 (기계장터 + 쇼핑몰)</div>
        <div className="dash-hero-value">128,460,000원</div>
        <div className="dash-hero-sub">두 플랫폼의 주문·결제 데이터를 단일 집계 파이프라인으로 통합해, 카페24 이전 데이터를 포함한 흐름을 하나의 대시보드에서 확인할 수 있도록 설계합니다.</div>
      </div>

      <section className="stat-row" data-stat-row>
        {STATS.map(s=>(
          <div className="stat-card" key={s.label}>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value">{s.value}</div>
            <span className={"stat-delta "+s.dir}>{s.delta}</span>
            <Sparkline color={s.dir==='positive'?'#4ade80':'#ff6363'}/>
          </div>
        ))}
      </section>

      <div className="panel">
        <nav className="tab-bar" data-tabs>
          {['일간','주간','월간'].map(t=>(
            <button key={t} className={"tab"+(tab===t?' active':'')} onClick={()=>setTab(t)}>{t}</button>
          ))}
        </nav>
        <div className="bar-chart">
          {BARS.map((h,i)=>(<div className="bar" key={i} style={{height:h+'%'}}></div>))}
        </div>

        <div className="data-toolbar" style={{marginTop:20}}>
          <input className="search-input" placeholder="주문번호 검색…" />
          <button className="filter-chip" onClick={()=>addToast('상태 필터를 적용했습니다')}>상태: 전체</button>
          <button className="export-btn" onClick={()=>addToast('CSV로 내보냈습니다')}><Icon name="download-simple" size={13}/> CSV</button>
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>주문번호</th><th>상품명</th><th>금액</th><th>상태</th><th></th></tr></thead>
            <tbody>
              <tr>
                <td>{ORDERS[0].id}</td><td>{ORDERS[0].name}</td><td>{ORDERS[0].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[0].status)}>{ORDERS[0].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[0].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
              <tr>
                <td>{ORDERS[1].id}</td><td>{ORDERS[1].name}</td><td>{ORDERS[1].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[1].status)}>{ORDERS[1].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[1].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
              <tr>
                <td>{ORDERS[2].id}</td><td>{ORDERS[2].name}</td><td>{ORDERS[2].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[2].status)}>{ORDERS[2].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[2].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
              <tr>
                <td>{ORDERS[3].id}</td><td>{ORDERS[3].name}</td><td>{ORDERS[3].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[3].status)}>{ORDERS[3].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[3].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
              <tr>
                <td>{ORDERS[4].id}</td><td>{ORDERS[4].name}</td><td>{ORDERS[4].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[4].status)}>{ORDERS[4].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[4].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
              <tr>
                <td>{ORDERS[5].id}</td><td>{ORDERS[5].name}</td><td>{ORDERS[5].amount}</td>
                <td><span className={"badge "+badgeCls(ORDERS[5].status)}>{ORDERS[5].status}</span></td>
                <td><button className="btn-secondary" style={{padding:'4px 10px'}} onClick={()=>addToast(ORDERS[5].id+' 상세를 확인합니다')}>⋯</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function BulkProductView({addToast}){
  const [uploaded, setUploaded] = useState(true);
  const ROWS = [
    {row:2, name:'산업용 롤러체인 10M', status:'성공'}, {row:3, name:'절연장갑 6종 세트', status:'성공'},
    {row:4, name:'', status:'실패', reason:'상품명 누락'}, {row:5, name:'컨베이어 벨트 A타입', status:'성공'},
    {row:6, name:'방진마스크 20매입', status:'성공'}, {row:7, name:'가격 999999999원', status:'실패', reason:'가격 형식 오류'},
    {row:8, name:'전동 드라이버 12V', status:'성공'}, {row:9, name:'작업대 1500', status:'성공'},
  ];
  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">엑셀 대량 상품 등록/수정</div>
          <div className="page-meta">엑셀 · CSV 업로드로 최대 5,000건까지 일괄 처리합니다</div>
        </div>
        <div className="page-actions">
          <button className="btn-secondary" onClick={()=>addToast('양식을 다운로드했습니다')}><Icon name="download-simple" size={14}/> 등록 양식</button>
          <button className="btn-accent" onClick={()=>{setUploaded(!uploaded); addToast(uploaded ? '새 파일을 업로드합니다' : '엑셀 파일 검증이 완료되었습니다');}}>{uploaded ? '새 파일 업로드' : '엑셀 업로드'}</button>
        </div>
      </div>

      {!uploaded &&
        <div className="dropzone" onClick={()=>{setUploaded(true); addToast('엑셀 파일 검증이 완료되었습니다');}}>
          <Icon name="upload-simple" size={28}/>
          <div style={{fontWeight:700, marginBottom:6}}>여기를 클릭해 엑셀/CSV 파일을 업로드합니다</div>
          <div style={{fontSize:12, color:'var(--text2)'}}>필수값·형식 검증 규칙 20여개가 행 단위로 자동 적용됩니다</div>
        </div>
      }

      {uploaded &&
        <div className="panel">
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:14}}>
            <div style={{fontWeight:700}}>검증 결과 — 총 8행 (성공 6 · 실패 2)</div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn-secondary" onClick={()=>addToast('실패 행 재처리를 큐에 등록했습니다')}>실패 행 재처리</button>
              <button className="btn-secondary" onClick={()=>addToast('결과 리포트를 다운로드했습니다')}>결과 다운로드</button>
            </div>
          </div>
          <table className="data-table">
            <thead><tr><th>행</th><th>상품명</th><th>상태</th><th>사유</th></tr></thead>
            <tbody>
              {ROWS.map(r=>(
                <tr key={r.row}>
                  <td>{r.row}</td><td>{r.name || '—'}</td>
                  <td><span className={"badge "+(r.status==='성공'?'success':'fail')}>{r.status}</span></td>
                  <td style={{color:'var(--text2)'}}>{r.reason || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      }
    </div>
  );
}

    {id:'DM-88230', name:'중량형 산업용 캐스터 4P', status:'결제완료', amount:'128,000원', addr:'경기 성남시 분당구 판교로 45', payment:'카카오페이'},
    {id:'DM-88229', name:'안전화 방한 방수 A등급', status:'구매확정', amount:'79,000원', addr:'부산 해운대구 센텀로 8', payment:'계좌이체'},
    {id:'DM-88228', name:'에어 컴프레서 25L', status:'배송준비', amount:'289,000원', addr:'대전 유성구 대학로 20', payment:'네이버페이'},
    {id:'DM-88227', name:'기업 전용 대량 소모품 패키지', status:'구매확정', amount:'890,000원', addr:'인천 남동구 논현로 3', payment:'신용카드'},
  ];

        <div>
          <div className="page-title">주문 라이프사이클 관리</div>
          <div className="page-meta">결제대기부터 구매확정까지 8단계 상태 머신으로 관리합니다</div>
        </div>
        <button className="btn-secondary" onClick={()=>addToast('주문 목록을 CSV로 내보냈습니다')}><Icon name="export" size={14}/> 내보내기</button>
      </div>
      <div className="md-layout">
        <div className="list-rail">
          <div className="list-rail-head"><input className="search-input" style={{width:'100%', maxWidth:'none'}} placeholder="주문번호·상품명 검색…"/></div>
          {ORDERS.map(o=>(

              <div style={{fontWeight:800, fontSize:16}}>{selected.id}</div>

          <div className="kv-row"><span>결제수단</span><span>{selected.payment}</span></div>

          <div style={{display:'flex', gap:10, marginTop:20}}>
            <button className="btn-accent" disabled={stepIdx>=STEPS.length-1} onClick={()=>addToast('다음 상태로 변경되었습니다')}>다음 상태로 변경</button>

        </div>

  const BATCHES = [

    {id:'BATCH-002', total:1000, success:1000, fail:0, status:'완료'},

  const [selected, setSelected] = useState(BATCHES[2]);

          {BATCHES.map(b=>(
            <button key={b.id} className={"list-item"+(selected.id===b.id?' active':'')} onClick={()=>setSelected(b)}>
              <div className="li-id">{b.id}</div>
              <div className="li-name">{b.status} · 실패 {b.fail}건</div>
            </button>
          ))}
        </div>
        <div className="detail-panel">
          <div style={{fontWeight:700, marginBottom:12}}>실패 건 사유별 분류 ({selected.fail}건)</div>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function PermissionsView({addToast}){
  const ROLES = ['최고관리자','상품 관리자','주문 관리자','조회 전용'];
  const MODULES = ['상품','주문','회원','통계'];
  const initial = {
    '최고관리자':[1,1,1,1], '상품 관리자':[1,1,0,0], '주문 관리자':[0,1,1,0], '조회 전용':[0,0,0,1],
  };
  const [grid, setGrid] = useState(initial);
  const toggle = (role, idx)=>{
    setGrid(g=>{
      const row = [...g[role]]; row[idx] = row[idx]?0:1;
      return {...g, [role]:row};
    });
  };
  return (
    <div className="view-fade">
      <div className="page-header">
        <div>
          <div className="page-title">권한 관리</div>
          <div className="page-meta">기존 관리자 권한 계층에 쇼핑몰 관리 역할을 확장 적용합니다</div>
        </div>
        <button className="btn-accent" onClick={()=>addToast('권한 변경 사항을 저장했습니다')}>변경사항 저장</button>
      </div>
      <div className="panel">
        <table className="data-table perm-table">
          <thead><tr><th>역할</th>{MODULES.map(m=><th key={m}>{m}</th>)}</tr></thead>
          <tbody>
            {ROLES.map(role=>(
              <tr key={role}>
                <td style={{fontWeight:700}}>{role}</td>
                {MODULES.map((m,i)=>(
                  <td key={m}>
                    <button className={"perm-check"+(grid[role][i]?' on':'')} onClick={()=>toggle(role,i)}>
                      {grid[role][i] ? <Icon name="check" size={12}/> : null}
                    </button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toasts, setToasts] = useState([]);
  const addToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };
  return (
    <div data-archetype="stripe-multipane">
      <div className="app-shell">
        <Sidebar view={view} setView={setView}/>
        <main className="main-wrap">
          {view==='main' && <DashboardView addToast={addToast}/>}
          {view==='bulk-product' && <BulkProductView addToast={addToast}/>}
          {view==='order' && <OrderView addToast={addToast}/>}
          {view==='migration' && <MigrationView addToast={addToast}/>}
          {view==='permissions' && <PermissionsView addToast={addToast}/>}
        </main>
      </div>
      <div className="toast-wrap">
        {toasts.map(t=>(<div className="toast" key={t.id}><Icon name="check-circle" size={15}/>{t.msg}</div>))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
