<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>루미나 어워즈 — 공모전 접수 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --ink:#17191c; --paper:#ffffff; --mist:#f2f2f3; --fog:#fafafb;
    --slate:#777b86; --ash:#979799; --smoke:#a3a6af; --peach:#fbe1d1; --sienna:#5d2a1a;
    --radius-card:24px; --radius-img:12px; --radius-input:16px; --radius-btn:9999px; --radius-elev:20px;
    --shadow-elev: 0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--smoke);border-radius:99px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.25);}}
  @keyframes drawerIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes ripple{from{transform:scale(0);opacity:.45;}to{transform:scale(2.4);opacity:0;}}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}

  .fade-up{animation:fadeInUp .5s ease both;}
  .skeleton{background:linear-gradient(90deg,#f2f2f3 25%,#fafafb 37%,#f2f2f3 63%);background-size:400px 100%;animation:shimmer 1.4s ease infinite;}

  .search-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #ececec;}
  .header-row{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:16px 24px;}
  .brand{font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.02em;white-space:nowrap;}
  .brand span{color:var(--sienna);}
  .search-bar{display:flex;align-items:center;flex:1;max-width:560px;background:#fff;border:1px solid #ececec;border-radius:var(--radius-btn);box-shadow:var(--shadow-elev);padding:4px;}
  .search-segment{flex:1;min-width:0;background:none;border:none;text-align:left;padding:8px 18px;border-radius:var(--radius-btn);transition:background .15s;}
  .search-segment:hover{background:var(--fog);}
  .search-segment.active{background:var(--mist);}
  .segment-label{font-size:12px;font-weight:600;color:var(--ink);}
  .segment-value{font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-divider{width:1px;height:24px;background:#ececec;}
  .search-submit{width:36px;height:36px;border-radius:50%;background:var(--ink);border:none;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .header-nav{display:flex;align-items:center;gap:4px;}
  .nav-btn{background:none;border:none;padding:9px 14px;border-radius:var(--radius-btn);font-size:14px;color:var(--slate);font-weight:500;white-space:nowrap;transition:.15s;}
  .nav-btn:hover{background:var(--fog);color:var(--ink);}
  .nav-btn.active{background:var(--ink);color:#fff;}
  .user-avatar{width:36px;height:36px;border-radius:50%;background:var(--peach);color:var(--sienna);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:none;flex-shrink:0;}

  .filter-chips{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:0 24px 16px;overflow-x:auto;}
  .chip{display:flex;align-items:center;gap:6px;flex-shrink:0;background:#fff;border:1px solid #ececec;border-radius:var(--radius-btn);padding:8px 16px;font-size:13px;color:var(--slate);font-weight:500;transition:.15s;}
  .chip:hover{border-color:var(--ink);color:var(--ink);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip svg{width:14px;height:14px;}

  .page-wrap{max-width:1240px;margin:0 auto;padding:32px 24px 96px;}
  .page-title{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
  .hero-title{font-size:48px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15;}
  @media (max-width:600px){ .hero-title{font-size:34px;} }
  .page-sub{font-size:15px;color:var(--slate);margin:0 0 28px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
  .listing-card{background:#fff;border-radius:var(--radius-card);overflow:hidden;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;border:1px solid #f0f0f0;}
  .listing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-elev);}
  .card-image-wrap{position:relative;aspect-ratio:4/3;border-radius:var(--radius-img);margin:8px;overflow:hidden;}
  .card-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;}
  .card-favorite svg{width:16px;height:16px;color:var(--ink);}
  .card-favorite.liked svg{color:#e0355b;fill:#e0355b;}
  .card-badge{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--radius-btn);display:flex;align-items:center;gap:4px;}
  .card-badge .dot{width:6px;height:6px;border-radius:50%;background:#ff6b57;animation:pulseDot 1.4s ease infinite;}
  .card-body{padding:6px 14px 18px;}
  .card-row-1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .card-title{font-size:16px;font-weight:600;margin:0;line-height:1.35;}
  .card-genre{font-size:11px;font-weight:700;color:var(--sienna);background:var(--peach);padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .card-meta{font-size:13px;color:var(--slate);display:block;margin-top:2px;}
  .card-row-4{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;}
  .card-price{font-size:16px;font-weight:700;}
  .price-unit{font-size:12px;color:var(--ash);margin-left:2px;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(23,25,28,.35);z-index:60;display:flex;justify-content:flex-end;}
  .drawer{width:420px;max-width:92vw;height:100%;background:#fff;padding:28px;overflow-y:auto;animation:drawerIn .25s ease both;}
  .drawer-close{width:36px;height:36px;border-radius:50%;border:1px solid #ececec;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .drawer-image{width:100%;aspect-ratio:16/9;border-radius:var(--radius-img);margin-bottom:20px;}
  .drawer-title{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .drawer-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px;}
  .drawer-row .k{color:var(--slate);}
  .drawer-row .v{font-weight:600;}
  .btn-primary{background:var(--ink);color:#fff;border:none;border-radius:var(--radius-btn);padding:14px 24px;font-size:15px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius-btn);padding:13px 24px;font-size:15px;font-weight:600;width:100%;}
  .ripple-span{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);animation:ripple .6s ease-out;}

  .footer{border-top:1px solid #ececec;background:var(--fog);}
  .footer-cols{max-width:1240px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;}
  .footer-col h4{font-size:13px;color:var(--ash);margin:0 0 12px;font-weight:600;}
  .footer-col a{display:block;font-size:14px;color:var(--slate);text-decoration:none;margin-bottom:8px;}
  .footer-copy{font-size:12px;color:var(--smoke);border-top:1px solid #ececec;padding:16px 24px;text-align:center;}

  /* apply wizard */
  .wizard-shell{max-width:760px;margin:0 auto;padding:40px 24px 96px;}
  .resume-banner{display:flex;align-items:center;gap:10px;background:var(--peach);color:var(--sienna);border-radius:var(--radius-elev);padding:14px 18px;font-size:13px;font-weight:500;margin-bottom:28px;}
  .steps-track{display:flex;align-items:center;margin-bottom:36px;}
  .step-dot{width:32px;height:32px;border-radius:50%;background:var(--mist);color:var(--slate);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:.2s;}
  .step-dot.done{background:var(--ink);color:#fff;}
  .step-dot.current{background:var(--sienna);color:#fff;}
  .step-line{flex:1;height:2px;background:var(--mist);}
  .step-line.done{background:var(--ink);}
  .step-label{font-size:11px;color:var(--slate);text-align:center;margin-top:6px;width:64px;}
  .step-col{display:flex;flex-direction:column;align-items:center;}
  .form-card{background:var(--fog);border-radius:var(--radius-card);padding:32px;}
  .form-title{font-size:22px;font-weight:700;margin:0 0 6px;}
  .form-sub{font-size:14px;color:var(--slate);margin:0 0 24px;}
  .field-row{margin-bottom:18px;}
  .field-row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field-row input,.field-row select,.field-row textarea{width:100%;border:1px solid #e2e2e4;border-radius:var(--radius-input);padding:12px 14px;font-size:14px;background:#fff;}
  .field-row textarea{resize:vertical;min-height:88px;}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--slate);background:#fff;border-radius:14px;padding:14px;border:1px solid #e2e2e4;}
  .upload-drop{border:2px dashed #d8d8da;border-radius:var(--radius-elev);padding:36px 20px;text-align:center;background:#fff;}
  .file-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e2e4;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:13px;}
  .file-chip .grow{flex:1;}
  .summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e6e6e6;font-size:14px;}
  .wizard-actions{display:flex;gap:12px;margin-top:28px;}
  .success-icon{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}

  /* payment */
  .pay-card{background:var(--fog);border-radius:var(--radius-card);padding:28px;margin-bottom:20px;}
  .pay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .status-pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;}
  .status-pending{background:var(--mist);color:var(--slate);}
  .status-done{background:#dff4e6;color:#1c7a3f;}
  .status-fail{background:#fde2e2;color:#c62828;}
  .method-toggle{display:flex;gap:8px;margin:14px 0;}
  .method-btn{flex:1;padding:12px;border-radius:14px;border:1px solid #e2e2e4;background:#fff;font-size:13px;font-weight:600;}
  .method-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .fail-box{background:#fff5f5;border:1px solid #f5c2c2;border-radius:14px;padding:14px;font-size:13px;color:#c62828;margin-top:12px;}

  /* mypage */
  .tab-row{display:flex;gap:4px;border-bottom:1px solid #ececec;margin-bottom:28px;overflow-x:auto;}
  .tab-btn{background:none;border:none;padding:12px 18px;font-size:14px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap;}
  .tab-btn.active{color:var(--ink);border-color:var(--ink);}
  .mp-row{display:flex;justify-content:space-between;align-items:center;background:var(--fog);border-radius:16px;padding:16px 18px;margin-bottom:10px;}
  .badge-award{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;}
  .badge-grand{background:#fbe1d1;color:#5d2a1a;}
  .badge-gold{background:#fef3c7;color:#92400e;}
  .badge-review{background:var(--mist);color:var(--slate);}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;animation:toastIn .25s ease both;display:flex;align-items:center;gap:8px;}

  @media (max-width:820px){
    .header-row{flex-wrap:wrap;}
    .search-bar{order:3;max-width:100%;}
    .footer-cols{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

const CONTESTS = [
  {id:1, title:"2026 루미나 문학 공모전 — 서울 지역예선", genre:"문학", country:"대한민국", city:"서울", price:"3만원", urgent:true, colors:["#fbe1d1","#f2c9a8"]},
  {id:2, title:"루미나 비주얼아트 어워드 — 도쿄 지역예선", genre:"미술", country:"일본", city:"도쿄", price:"$28", urgent:false, colors:["#dbe7ff","#b9cdfd"]},
  {id:3, title:"루미나 뮤직 콜라보레이션 — 런던 지역예선", genre:"음악", country:"영국", city:"런던", price:"£22", urgent:true, colors:["#e5d9ff","#c9b3fb"]},
  {id:4, title:"루미나 필름메이커스 — 파리 지역예선", genre:"영상", country:"프랑스", city:"파리", price:"€25", urgent:false, colors:["#d7f3e3","#a9e3c1"]},
  {id:5, title:"루미나 포토그래피 오픈콜 — 뉴욕 지역예선", genre:"사진", country:"미국", city:"뉴욕", price:"$30", urgent:false, colors:["#fde2e2","#f7b3b3"]},
  {id:6, title:"루미나 디자인 챌린지 — 싱가포르 지역예선", genre:"디자인", country:"싱가포르", city:"싱가포르", price:"$35", urgent:true, colors:["#fff3d6","#ffdf9e"]},
  {id:7, title:"루미나 문학 공모전 — 부산 지역예선", genre:"문학", country:"대한민국", city:"부산", price:"3만원", urgent:false, colors:["#fbe1d1","#f2c9a8"]},
  {id:8, title:"루미나 비주얼아트 어워드 — 시드니 지역예선", genre:"미술", country:"호주", city:"시드니", price:"AU$32", urgent:false, colors:["#dbe7ff","#b9cdfd"]},
  {id:9, title:"루미나 뮤직 콜라보레이션 — 서울 지역예선", genre:"음악", country:"대한민국", city:"서울", price:"3만원", urgent:true, colors:["#e5d9ff","#c9b3fb"]},
  {id:10, title:"루미나 필름메이커스 — 베를린 지역예선", genre:"영상", country:"독일", city:"베를린", price:"€27", urgent:false, colors:["#d7f3e3","#a9e3c1"]},
  {id:11, title:"루미나 포토그래피 오픈콜 — 상하이 지역예선", genre:"사진", country:"중국", city:"상하이", price:"¥180", urgent:false, colors:["#fde2e2","#f7b3b3"]},
  {id:12, title:"루미나 디자인 챌린지 — 서울 본선 직행전", genre:"디자인", country:"대한민국", city:"서울", price:"3만원", urgent:false, colors:["#fff3d6","#ffdf9e"]},
];

const CHIPS = [
  {key:"all", label:"전체", icon:"layout-grid"},
  {key:"문학", label:"문학", icon:"book-open"},
  {key:"미술", label:"미술", icon:"palette"},
  {key:"음악", label:"음악", icon:"music"},
  {key:"영상", label:"영상", icon:"clapperboard"},
  {key:"사진", label:"사진", icon:"camera"},
  {key:"디자인", label:"디자인", icon:"pen-tool"},
  {key:"urgent", label:"마감임박", icon:"alarm-clock"},
];

function CardImage({colors}){
  return (
    <svg viewBox="0 0 300 225" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id={"g"+colors[0].slice(1)} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={colors[0]} />
          <stop offset="100%" stopColor={colors[1]} />
        </linearGradient>
      </defs>
      <rect width="300" height="225" fill={"url(#g"+colors[0].slice(1)+")"} />
      <circle cx="230" cy="60" r="46" fill="rgba(255,255,255,.35)" />
      <circle cx="70" cy="170" r="70" fill="rgba(255,255,255,.22)" />
      <path d="M0 190 Q 90 150 170 185 T 300 175 V225 H0 Z" fill="rgba(255,255,255,.25)" />
    </svg>
  );
}

function useIcons(deps){
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, deps);
}

function Header({screen, setScreen, activeChip, setActiveChip}){
  const [openSeg, setOpenSeg] = useState(null);
  const [country, setCountry] = useState("전체 국가");
  const [genre, setGenre] = useState("전체 분야");
  const [status, setStatus] = useState("전체 상태");
  useIcons([screen, openSeg, activeChip]);

  const segOptions = {
    country: ["전체 국가","대한민국","일본","영국","프랑스","미국","싱가포르"],
    genre: ["전체 분야","문학","미술","음악","영상","사진","디자인"],
    status: ["전체 상태","접수중","마감임박","마감"],
  };

  function pick(seg, val){
    if (seg === "country") setCountry(val);
    if (seg === "genre") setGenre(val);
    if (seg === "status") setStatus(val);
    setOpenSeg(null);
  }

  return (
    <header className="search-header" data-search-header>
      <div className="header-row">
        <a className="brand" onClick={() => setScreen("main")}>루미<span>나</span> 어워즈</a>
        <div className="search-bar">
          <button className={"search-segment" + (openSeg==="country" ? " active" : "")} onClick={() => setOpenSeg(openSeg==="country"?null:"country")}>
            <div className="segment-label">국가</div>
            <div className="segment-value">{country}</div>
          </button>
          <div className="search-divider"></div>
          <button className={"search-segment" + (openSeg==="genre" ? " active" : "")} onClick={() => setOpenSeg(openSeg==="genre"?null:"genre")}>
            <div className="segment-label">분야</div>
            <div className="segment-value">{genre}</div>
          </button>
          <div className="search-divider"></div>
          <button className={"search-segment" + (openSeg==="status" ? " active" : "")} onClick={() => setOpenSeg(openSeg==="status"?null:"status")}>
            <div className="segment-label">상태</div>
            <div className="segment-value">{status}</div>
          </button>
          <button className="search-submit" style={{borderRadius:9999}} onClick={() => setOpenSeg(null)} title="검색"><i data-lucide="search" style={{width:16,height:16}}></i></button>
        </div>
        <nav className="header-nav">
          <button className={"nav-btn" + (screen==="main"?" active":"")} onClick={() => setScreen("main")}>공모전 탐색</button>
          <button className={"nav-btn" + (screen==="apply"?" active":"")} onClick={() => setScreen("apply")}>작품 접수</button>
          <button className={"nav-btn" + (screen==="payment"?" active":"")} onClick={() => setScreen("payment")}>결제·해외본선</button>
          <button className={"nav-btn" + (screen==="mypage"?" active":"")} onClick={() => setScreen("mypage")}>마이페이지</button>

const STEP_LABELS = ["참가자정보","작품정보","파일업로드","확인/결제","접수완료"];

function ApplyScreen({setScreen}){
  const [step, setStep] = useState(1);
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [guardianOk, setGuardianOk] = useState(false);
  const [workTitle, setWorkTitle] = useState("");
  const [genre, setGenre] = useState("문학");
  const [desc, setDesc] = useState("");
  const [files, setFiles] = useState([]);
  const [method, setMethod] = useState("card");
  useIcons([step, files.length]);

  function addFile(kind){
    setFiles(prev => [...prev, {id:Date.now(), name: kind==="image" ? "poster_final.jpg" : kind==="pdf" ? "작품설명서.pdf" : "demo_clip.mp4", kind}]);
  }
  function removeFile(id){ setFiles(prev => prev.filter(f => f.id !== id)); }

  const canNext =
    (step === 1 && name.trim() && email.trim() && guardianOk) ||
    (step === 2 && workTitle.trim() && desc.trim()) ||
    (step === 3 && files.length > 0) ||
    step === 4;

  function next(){
    if (step < 5) setStep(step + 1);
  }
  function prev(){ if (step > 1) setStep(step - 1); }

  return (
    <main className="wizard-shell">
      <div className="resume-banner">
        <i data-lucide="save" style={{width:16,height:16}}></i>
        마지막 저장: 오늘 14:32 · 이어작성 중입니다
      </div>

      <div className="steps-track">
        {STEP_LABELS.map((label, idx) => {
          const n = idx + 1;
          const done = n < step, current = n === step;
          return (
            <React.Fragment key={label}>
              <div className="step-col">
                <div className={"step-dot" + (done?" done":"") + (current?" current":"")}>
                  {done ? <i data-lucide="check" style={{width:14,height:14}}></i> : n}
                </div>
                <div className="step-label">{label}</div>
              </div>
              {idx < STEP_LABELS.length - 1 && <div className={"step-line" + (done?" done":"")}></div>}
            </React.Fragment>
          );
        })}
      </div>

      {step === 1 && (
        <div className="form-card">
          <h2 className="form-title">01. 참가자 정보</h2>
          <p className="form-sub">참가자 본인 정보를 입력해 주세요. 미성년자는 보호자 동의가 필요합니다.</p>
          <div className="field-row"><label>이름</label><input value={name} onChange={e => setName(e.target.value)} placeholder="예: 김지훈" /></div>
          <div className="field-row"><label>생년월일</label><input type="date" /></div>
          <div className="field-row"><label>이메일</label><input value={email} onChange={e => setEmail(e.target.value)} placeholder="example@email.com" /></div>
          <label className="checkbox-row">
            <input type="checkbox" checked={guardianOk} onChange={e => setGuardianOk(e.target.checked)} style={{width:16,height:16,marginTop:2}} />
            <span>만 14세 미만 참가자이며, 보호자가 개인정보 수집·이용 및 작품 제출에 동의합니다.</span>
          </label>
        </div>
      )}

      {step === 2 && (
        <div className="form-card">
          <h2 className="form-title">02. 작품 정보</h2>
          <p className="form-sub">공모 분야에 맞는 작품 정보를 입력해 주세요.</p>
          <div className="field-row">
            <label>공모 분야</label>
            <select value={genre} onChange={e => setGenre(e.target.value)}>
              <option>문학</option><option>미술</option><option>음악</option><option>영상</option><option>사진</option><option>디자인</option>
            </select>
          </div>
          <div className="field-row"><label>작품명</label><input value={workTitle} onChange={e => setWorkTitle(e.target.value)} placeholder="작품 제목을 입력하세요" /></div>
          <div className="field-row"><label>작품 설명</label><textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="작품에 대한 소개를 500자 이내로 작성해 주세요" /></div>
        </div>
      )}

      {step === 3 && (
        <div className="form-card">
          <h2 className="form-title">03. 파일 업로드</h2>
          <p className="form-sub">작품 파일과 참고 자료를 업로드해 주세요. (이미지·PDF·영상·음원 지원)</p>
          <div className="upload-drop">
            <i data-lucide="upload-cloud" style={{width:32,height:32,color:"var(--ash)"}}></i>
            <p style={{margin:"10px 0", fontSize:13, color:"var(--slate)"}}>파일을 드래그하거나 아래 버튼으로 추가하세요</p>
            <div style={{display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap"}}>
              <button className="btn-ghost" style={{width:"auto", padding:"9px 16px", fontSize:13}} onClick={() => addFile("image")}>이미지 추가</button>
              <button className="btn-ghost" style={{width:"auto", padding:"9px 16px", fontSize:13}} onClick={() => addFile("pdf")}>PDF 추가</button>
              <button className="btn-ghost" style={{width:"auto", padding:"9px 16px", fontSize:13}} onClick={() => addFile("video")}>영상 추가</button>
            </div>
          </div>
          {files.map(f => (
            <div key={f.id} className="file-chip">
              <i data-lucide={f.kind==="image"?"image":f.kind==="pdf"?"file-text":"film"} style={{width:16,height:16}}></i>
              <span className="grow">{f.name}</span>
              <button onClick={() => removeFile(f.id)} style={{background:"none", border:"none"}}><i data-lucide="x" style={{width:14,height:14}}></i></button>
            </div>
          ))}
        </div>
      )}

      {step === 4 && (
        <div className="form-card">
          <h2 className="form-title">04. 확인 및 결제</h2>
          <p className="form-sub">입력하신 접수 정보를 확인하고 참가비를 결제해 주세요.</p>
          <div className="summary-row"><span>참가자</span><strong>{name || "김지훈"}</strong></div>
          <div className="summary-row"><span>공모 분야</span><strong>{genre}</strong></div>
          <div className="summary-row"><span>작품명</span><strong>{workTitle || "무제"}</strong></div>
          <div className="summary-row"><span>첨부 파일</span><strong>{files.length}개</strong></div>
          <div className="summary-row"><span>참가비</span><strong>30,000원</strong></div>
          <div className="method-toggle">
            <button className={"method-btn" + (method==="card"?" active":"")} onClick={() => setMethod("card")}>신용/체크카드</button>
            <button className={"method-btn" + (method==="transfer"?" active":"")} onClick={() => setMethod("transfer")}>계좌이체</button>
          </div>
        </div>
      )}

      {step === 5 && (
        <div className="form-card" style={{textAlign:"center"}}>
          <div className="success-icon"><i data-lucide="check" style={{width:32,height:32}}></i></div>
          <h2 className="form-title">접수가 완료되었습니다</h2>
          <p className="form-sub">접수번호 LCA-2026-{Math.floor(1000+Math.random()*8999)}</p>
          <div style={{display:"flex", gap:12, marginTop:20}}>
            <button className="btn-ghost" onClick={() => window.alert("접수증 PDF 다운로드를 시작합니다")}>접수증(PDF) 다운로드</button>
            <button className="btn-primary" onClick={() => setScreen("mypage")}>마이페이지로 이동</button>
          </div>
        </div>
      )}

      {step < 5 && (
        <div className="wizard-actions">
          {step > 1 && <button className="btn-ghost" onClick={prev}>이전</button>}
          <button className="btn-primary" disabled={!canNext} style={{opacity: canNext ? 1 : .45}} onClick={next}>
            {step === 4 ? "결제하고 접수 완료" : "다음"}
          </button>
        </div>
      )}
    </main>
  );
}

function PaymentScreen(){
  const [domesticStatus, setDomesticStatus] = useState("pending");
  const [finalsStatus, setFinalsStatus] = useState("fail");
  const [domMethod, setDomMethod] = useState("card");
  const [agree, setAgree] = useState(false);
  const [toast, setToast] = useState(null);
  useIcons([domesticStatus, finalsStatus, toast]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  function payDomestic(){
    if (!agree) { setToast("환불 규정에 동의해 주세요"); return; }
    setDomesticStatus("done");
    setToast("참가비 결제가 완료되었습니다");
  }
  function retryFinals(){
    setFinalsStatus("pending");
    setTimeout(() => { setFinalsStatus("done"); setToast("해외 본선 참가비 결제가 완료되었습니다"); }, 900);
  }

  return (
    <main className="page-wrap" style={{maxWidth:760}}>
      <h1 className="page-title">결제 및 해외 본선 참가비</h1>
      <p className="page-sub">국내 참가비와 해외 본선 참가비는 서로 다른 결제 트랜잭션으로 분리 처리됩니다</p>

      <div className="pay-card">
        <div className="pay-head">
          <div>
            <h3 style={{margin:"0 0 4px", fontSize:17, fontWeight:700}}>국내 참가비 결제</h3>
            <span style={{fontSize:13, color:"var(--slate)"}}>루미나 문학 공모전 — 서울 지역예선</span>
          </div>
          <span className={"status-pill status-" + domesticStatus}>{domesticStatus==="done" ? "결제완료" : "결제대기"}</span>
        </div>
        <div className="summary-row"><span>참가비</span><strong>30,000원</strong></div>
        <div className="method-toggle">
          <button className={"method-btn" + (domMethod==="card"?" active":"")} onClick={() => setDomMethod("card")}>신용/체크카드</button>
          <button className={"method-btn" + (domMethod==="transfer"?" active":"")} onClick={() => setDomMethod("transfer")}>계좌이체</button>
        </div>
        <label className="checkbox-row" style={{marginTop:10}}>
          <input type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} style={{width:16,height:16,marginTop:2}} />
          <span>환불 규정(접수 마감 7일 전까지 100% 환불)에 동의합니다</span>
        </label>
        {domesticStatus !== "done" && (
          <button className="btn-primary" style={{marginTop:14}} onClick={payDomestic}>
            <i data-lucide="credit-card" style={{width:16,height:16}}></i>30,000원 결제하기
          </button>
        )}
        {domesticStatus === "done" && <button className="btn-ghost" style={{marginTop:14}} onClick={() => window.alert("결제 영수증을 표시합니다")}>영수증 보기</button>}
      </div>

      <div className="pay-card">
        <div className="pay-head">
          <div>
            <h3 style={{margin:"0 0 4px", fontSize:17, fontWeight:700}}>해외 본선 참가비 결제</h3>
            <span style={{fontSize:13, color:"var(--slate)"}}>본선 진출 확정자 대상 별도 결제</span>
          </div>
          <span className={"status-pill status-" + finalsStatus}>{finalsStatus==="done" ? "결제완료" : finalsStatus==="fail" ? "결제실패" : "처리중"}</span>
        </div>
        <div className="summary-row"><span>본선 참가비</span><strong>$120 (약 165,000원)</strong></div>
        {finalsStatus === "fail" && (
          <div className="fail-box">
            <strong>결제 실패 — 카드 한도초과</strong>
            <p style={{margin:"4px 0 0"}}>다른 결제수단을 이용하시거나 카드사에 문의 후 다시 시도해 주세요.</p>
          </div>
        )}
        <div style={{display:"flex", gap:10, marginTop:14}}>
          {finalsStatus === "fail" && <button className="btn-primary" onClick={retryFinals}><i data-lucide="rotate-cw" style={{width:16,height:16}}></i>재시도</button>}
          {finalsStatus === "fail" && <button className="btn-ghost" onClick={() => window.alert("고객센터 문의 채널로 이동합니다")}>문의하기</button>}
          {finalsStatus === "pending" && <span style={{fontSize:13, color:"var(--slate)"}}>결제를 처리하고 있습니다…</span>}
        </div>
      </div>

      {toast && <div className="toast"><i data-lucide="check-circle" style={{width:16,height:16}}></i>{toast}</div>}
    </main>
  );
}

          {finalsApplied
            ? <span className="badge-award badge-grand">신청완료</span>
            : <button className="btn-primary" style={{width:"auto", padding:"10px 18px"}} onClick={() => { setFinalsApplied(true); setToast("해외 본선 신청이 접수되었습니다"); }}>해외본선 신청하기</button>}
        </div>
      )}

      {toast && <div className="toast"><i data-lucide="check-circle" style={{width:16,height:16}}></i>{toast}</div>}
    </main>
  );
}

function Footer(){
  return (
    <footer className="footer">
      <div className="footer-cols">
        <div className="footer-col">
          <h4>루미나 어워즈</h4>
          <p style={{fontSize:13, color:"var(--slate)", lineHeight:1.6}}>전 세계 청소년 창작자를 위한<br/>국제 창작 공모전 플랫폼</p>
        </div>
        <div className="footer-col"><h4>프로그램</h4><a>공모전</a><a>전시·공연</a><a>수상작</a></div>
        <div className="footer-col"><h4>안내</h4><a>공지사항</a><a>자주 묻는 질문</a></div>
        <div className="footer-col"><h4>참가</h4><a>작품접수</a><a>로그인</a></div>
      </div>
      <div className="footer-copy">© 2026 루미나 어워즈 — 자체 개발 데모 프로젝트</div>
    </footer>
  );
}

function App(){
  const [screen, setScreen] = useState("main");
  const [activeChip, setActiveChip] = useState("all");
  useEffect(() => { window.scrollTo(0,0); }, [screen]);

  return (
    <div data-archetype="airbnb-search-grid">
      <Header screen={screen} setScreen={setScreen} activeChip={activeChip} setActiveChip={setActiveChip} />
      {screen === "main" && <MainScreen setScreen={setScreen} activeChip={activeChip} />}
      {screen === "apply" && <ApplyScreen setScreen={setScreen} />}
      {screen === "payment" && <PaymentScreen />}
      {screen === "mypage" && <MyPage />}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
