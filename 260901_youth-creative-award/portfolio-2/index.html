<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>루미나 어워즈 — 심사·운영 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#f4f4f5; --ink-dim:#a1a1aa; --bg:#09090b; --surface:#18181b; --surface2:#232428;
    --line:rgba(255,255,255,.09); --accent:#6d5ef5; --accent-soft:rgba(109,94,245,.16);
    --good:#3ddc97; --warn:#f5b155; --bad:#f26d6d; --urgent:#ff5a00;
    --radius-card:28px; --radius-pill:9999px; --radius-input:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;}
  body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:99px;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(109,94,245,.5);}50%{box-shadow:0 0 0 6px rgba(109,94,245,0);}}
  @keyframes progressFill{from{width:0%;}to{width:100%;}}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes sweepLine{0%{transform:translateX(-40%);}100%{transform:translateX(140%);}}

  .fade-in{animation:fadeIn .4s ease both;}

  .topbar{position:sticky;top:0;z-index:40;background:rgba(11,11,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow:hidden;}
  .topbar-scan{position:absolute;top:0;left:0;width:30%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweepLine 3.2s linear infinite;}
  .topbar-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 24px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;}
  .brand .dot-live{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:glowPulse 1.8s ease infinite;}
  .top-nav{display:flex;gap:4px;flex:1;}
  .top-nav button{background:none;border:1px solid transparent;color:var(--ink-dim);font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--radius-pill);white-space:nowrap;}
  .top-nav button:hover{color:var(--ink);border-color:var(--line);}
  .top-nav button.active{background:var(--surface2);color:var(--ink);border-color:var(--line);}
  .avatar-pill{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

  .shell{max-width:1320px;margin:0 auto;padding:24px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:34px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .page-sub{font-size:13px;color:var(--ink-dim);margin:0;}

  .btn{border-radius:var(--radius-pill);border:1px solid var(--line);padding:10px 18px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-solid{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-ghost{background:var(--surface);color:var(--ink);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* kanban main */
  .board-layout{display:flex;gap:20px;align-items:flex-start;}
  .board{flex:1;display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;min-width:0;}
  .column{flex:0 0 272px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;}
  .col-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:700;}
  .count{background:var(--surface2);color:var(--ink-dim);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;}
  .card{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:grab;transition:border-color .15s, transform .15s;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .card.dragging{opacity:.4;}
  .card-title{font-size:13px;font-weight:600;margin:0 0 8px;line-height:1.4;}
  .card-meta{display:flex;justify-content:space-between;align-items:center;}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(109,94,245,.14);color:#b3a7ff;}
  .priority-dot{width:7px;height:7px;border-radius:50%;background:var(--urgent);}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}
  .col-drop{outline:2px dashed var(--accent);outline-offset:-6px;}

  .matrix-side{width:280px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;}
  .matrix-title{font-size:13px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:6px;}
  .matrix-row{margin-bottom:12px;}
  .matrix-row .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-bottom:5px;}
  .matrix-bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;}
  .matrix-bar-fill{height:100%;background:var(--accent);border-radius:99px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;}
  .switch{width:38px;height:22px;border-radius:99px;background:var(--surface2);position:relative;border:1px solid var(--line);}
  .switch.on{background:var(--accent);}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on .knob{left:18px;}

  /* judge review */
  .review-shell{max-width:680px;margin:0 auto;}
  .anon-banner{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:12px;color:var(--ink-dim);margin-bottom:18px;}
  .review-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:28px;}
  .anon-id{font-size:12px;color:var(--ink-dim);margin-bottom:4px;}
  .review-title{font-size:20px;font-weight:700;margin:0 0 18px;}
  .score-row{margin-bottom:16px;}
  .score-row .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
  .score-row .lbl span.v{color:var(--accent);font-weight:700;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .review-textarea{width:100%;min-height:96px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-input);padding:12px 14px;color:var(--ink);font-size:13px;resize:vertical;}
  .review-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .queue-pos{font-size:12px;color:var(--ink-dim);}

  /* admin console */
  .admin-layout{display:flex;gap:20px;align-items:flex-start;}
  .admin-menu{width:230px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;}
  .admin-menu button{width:100%;text-align:left;background:none;border:none;color:var(--ink-dim);font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .admin-menu button.active{background:var(--accent-soft);color:var(--accent);}
  .admin-content{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;}
  .stat-chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .stat-chip{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px;}
  .stat-chip .n{font-size:20px;font-weight:700;}
  .stat-chip .l{font-size:11px;color:var(--ink-dim);}
  .toolbar-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar-row input{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-input);padding:9px 14px;font-size:13px;color:var(--ink);flex:1;min-width:160px;}
  .table-list{width:100%;border-collapse:collapse;}
  .table-list th{text-align:left;font-size:11px;color:var(--ink-dim);padding:8px 10px;border-bottom:1px solid var(--line);}
  .table-list td{font-size:13px;padding:10px;border-bottom:1px solid var(--line);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;}

  /* certificate */
  .cert-shell{max-width:900px;margin:0 auto;}
  .cert-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:8px;}
  .cert-row .grow{flex:1;}
  .progress-track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:14px 0;}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;animation:progressFill 2.2s ease forwards;}
  .log-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .log-ok{background:rgba(61,220,151,.15);color:var(--good);}
  .log-retry{background:rgba(245,177,85,.15);color:var(--warn);}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;animation:toastIn .25s ease both;display:flex;align-items:center;gap:8px;}

  @media (max-width:900px){
    .board-layout{flex-direction:column;}
    .matrix-side{width:100%;}
    .admin-layout{flex-direction:column;}
    .admin-menu{width:100%;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

function Toast({msg}){
  if (!msg) return null;
  return <div className="toast"><i className="ph ph-check-circle"></i>{msg}</div>;
}
function useToast(){
  const [toast, setToast] = useState(null);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2200); return () => clearTimeout(t); }, [toast]);
  return [toast, setToast];
}

function TopBar({screen, setScreen}){
  return (
    <header className="topbar">
      <div className="topbar-scan"></div>
      <div className="topbar-row">
        <div className="brand"><span className="dot-live"></span>루미나 심사 콘솔</div>
        <nav className="top-nav">
          <button className={screen==="main"?"active":""} onClick={() => setScreen("main")}>심사 배정 보드</button>
          <button className={screen==="judge-review"?"active":""} onClick={() => setScreen("judge-review")}>심사 평가</button>
          <button className={screen==="admin-console"?"active":""} onClick={() => setScreen("admin-console")}>관리자 콘솔</button>
          <button className={screen==="certificate"?"active":""} onClick={() => setScreen("certificate")}>인증서 발급</button>
        </nav>
        <div style={{position:"relative"}}>
          <div className="avatar-pill" onClick={() => setScreen("admin-console")} title="관리자">운영</div>
          <span className="badge" style={{position:"absolute",top:-2,right:-2,background:"var(--accent)",color:"#fff",fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:99}}>3</span>
        </div>
      </div>
    </header>
  );
}

const INITIAL_CARDS = [
  {id:1, title:"서울의 밤 — 문학", tag:"문학", judge:"J1", urgent:true, col:"unassigned"},
  {id:2, title:"Fragments of Light — 사진", tag:"사진", judge:null, urgent:false, col:"unassigned"},
  {id:3, title:"Neon Reverb — 음악", tag:"음악", judge:null, urgent:true, col:"unassigned"},
  {id:4, title:"도시의 결 — 미술", tag:"미술", judge:"J2", urgent:false, col:"assigned"},
  {id:5, title:"Echo Chamber — 음악", tag:"음악", judge:"J3", urgent:false, col:"assigned"},
  {id:6, title:"Wanderline — 영상", tag:"영상", judge:"J1", urgent:true, col:"assigned"},
  {id:7, title:"Paper Cities — 디자인", tag:"디자인", judge:"J2", urgent:false, col:"reviewing"},
  {id:8, title:"소리의 결", tag:"음악", judge:"J3", urgent:false, col:"reviewing"},
  {id:9, title:"Glasswing — 사진", tag:"사진", judge:"J1", urgent:false, col:"done"},
  {id:10, title:"기억의 온도 — 문학", tag:"문학", judge:"J2", urgent:false, col:"done"},
];
const COLUMNS = [
  {key:"unassigned", label:"미배정"},
  {key:"assigned", label:"배정됨"},
  {key:"reviewing", label:"심사중"},
  {key:"done", label:"완료"},
];
const JUDGES = [
  {id:"J1", name:"김서준", load:8},
  {id:"J2", name:"이하은", load:5},
  {id:"J3", name:"박도윤", load:3},
];

function KanbanBoard(){
  const [cards, setCards] = useState(INITIAL_CARDS);
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const [urgentOnly, setUrgentOnly] = useState(false);
  const [toast, setToast] = useToast();

  const visible = urgentOnly ? cards.filter(c => c.urgent) : cards;

  function onDrop(colKey){
    if (dragId == null) return;
    setCards(prev => prev.map(c => c.id === dragId ? {...c, col: colKey, judge: c.judge || JUDGES[0].id} : c));
    setDragId(null); setOverCol(null);
    setToast("카드가 " + (COLUMNS.find(c=>c.key===colKey)||{}).label + " 컬럼으로 이동되었습니다");
  }
  function autoAssign(){
    setCards(prev => {
      let idx = 0;
      return prev.map(c => {
        if (c.col === "unassigned") { idx = (idx+1) % JUDGES.length; return {...c, col:"assigned", judge: JUDGES[idx].id}; }
        return c;
      });
    });
    setToast("미배정 작품이 심사위원별로 자동 배정되었습니다");
  }

  const maxLoad = Math.max(...JUDGES.map(j => j.load));

  return (
    <main className="shell">
      <div className="page-head">
        <div>
          <h1 className="page-title">심사 배정 보드</h1>
          <p className="page-sub">작품을 드래그하여 심사위원에게 배정하거나 자동 배정을 실행하세요</p>
        </div>
        <button className="btn btn-solid" onClick={autoAssign}><i className="ph ph-magic-wand"></i>자동 배정 실행</button>
      </div>

      <div className="board-layout">
        <div className="board">
          {COLUMNS.map(col => {
            const colCards = visible.filter(c => c.col === col.key);
            return (
              <section key={col.key}
                className="column"
                style={overCol===col.key ? {outline:"2px dashed var(--accent)", outlineOffset:"-6px"} : {}}
                onDragOver={(e) => { e.preventDefault(); setOverCol(col.key); }}
                onDragLeave={() => setOverCol(null)}
                onDrop={() => onDrop(col.key)}>
                <div className="col-header"><span>{col.label}</span><span className="count col-count">{colCards.length}</span></div>
                <div className="col-body">
                {colCards.map(c => (
                  <div key={c.id} className="card task fade-in" draggable
                    onDragStart={() => setDragId(c.id)}
                    onDragEnd={() => setDragId(null)}>
                    <div className="card-body">
                      <p className="card-title">{c.title}</p>
                      <div className="card-meta">
                        <span className="tag card-tag">{c.tag}</span>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          {c.urgent && <span className="priority-dot" title="마감임박"></span>}
                          <span className="avatar card-avatar" title={c.judge ? "심사위원 "+c.judge : "미배정"}>{c.judge || "—"}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
                {colCards.length === 0 && <p style={{fontSize:12,color:"var(--ink-dim)",textAlign:"center",padding:"12px 0"}}>카드 없음</p>}
                </div>
              </section>
            );
          })}
        </div>

        <aside className="matrix-side">
          <h3 className="matrix-title"><i className="ph ph-gauge"></i>심사위원 부하 매트릭스</h3>
          {JUDGES.map(j => (
            <div className="matrix-row" key={j.id}>
              <div className="lbl"><span>{j.name} ({j.id})</span><span className="count-badge">{cards.filter(c=>c.judge===j.id).length}건</span></div>
              <div className="matrix-bar"><div className="matrix-bar-fill" style={{width:(cards.filter(c=>c.judge===j.id).length/Math.max(1,maxLoad+2)*100)+"%"}}></div></div>
            </div>
          ))}
          <div className="toggle-row">
            <span>마감 임박만 보기</span>
            <div className={"switch" + (urgentOnly?" on":"")} onClick={() => setUrgentOnly(!urgentOnly)}><div className="knob"></div></div>
          </div>
        </aside>
      </div>
      <Toast msg={toast} />
    </main>
  );
}

const QUEUE = [
  {id:1, code:"SUB-2291", title:"서울의 밤", genre:"문학"},
  {id:2, code:"SUB-2304", title:"Neon Reverb", genre:"음악"},
  {id:3, code:"SUB-2318", title:"Wanderline", genre:"영상"},
];
const CRITERIA = ["창의성","주제이해","표현력","완성도","발전가능성"];

function JudgeReview(){
  const [idx, setIdx] = useState(0);
  const [scores, setScores] = useState(() => Object.fromEntries(CRITERIA.map(c => [c, 7])));
  const [comment, setComment] = useState("");
  const [done, setDone] = useState({});
  const [toast, setToast] = useToast();

  const work = QUEUE[idx];

  function setScore(c, v){ setScores(prev => ({...prev, [c]: Number(v)})); }
  function move(delta){
    setToast("입력하신 심사 내용이 자동 저장되었습니다");
    setIdx(i => Math.max(0, Math.min(QUEUE.length - 1, i + delta)));
    setComment("");
    setScores(Object.fromEntries(CRITERIA.map(c => [c, 7])));
  }
  function complete(){
    setDone(prev => ({...prev, [work.id]: true}));
    setToast(work.code + " 심사가 완료 처리되었습니다");
  }

  return (
    <main className="shell review-shell">
      <div className="page-head"><div><h1 className="page-title">심사 평가</h1><p className="page-sub">참가자 식별정보는 노출되지 않는 익명 심사 화면입니다</p></div></div>
      <div className="anon-banner"><i className="ph ph-eye-slash"></i>이름·연락처 등 개인정보는 표시되지 않습니다</div>

      <div className="review-card">
        <div className="anon-id">익명 코드 · {work.code}</div>
        <h2 className="review-title">{work.title} <span className="tag" style={{marginLeft:8}}>{work.genre}</span></h2>

        {CRITERIA.map(c => (
          <div className="score-row" key={c}>
            <div className="lbl"><span>{c}</span><span className="v">{scores[c]}</span></div>
            <input type="range" min="0" max="10" value={scores[c]} onChange={e => setScore(c, e.target.value)} disabled={!!done[work.id]} />
          </div>
        ))}

        <div className="score-row">
          <div className="lbl"><span>심사평</span></div>
          <textarea className="review-textarea" value={comment} onChange={e => setComment(e.target.value)} placeholder="심사평을 입력해 주세요" disabled={!!done[work.id]} />
        </div>

        <div className="review-nav">
          <button className="btn btn-ghost" disabled={idx===0} onClick={() => move(-1)}><i className="ph ph-arrow-left"></i>이전 작품</button>
          <span className="queue-pos">{idx+1} / {QUEUE.length}</span>
          {done[work.id]
            ? <button className="btn btn-ghost" disabled><i className="ph ph-check"></i>심사완료됨</button>
            : <button className="btn btn-solid" onClick={complete}><i className="ph ph-check"></i>심사완료</button>}
          <button className="btn btn-ghost" disabled={idx===QUEUE.length-1} onClick={() => move(1)}>다음 작품<i className="ph ph-arrow-right"></i></button>
        </div>
      </div>
      <Toast msg={toast} />
    </main>
  );
}

const ADMIN_MENUS = [
  {key:"contest", label:"공모전관리", icon:"ph-trophy"},
  {key:"applicant", label:"접수자관리", icon:"ph-users-three"},
  {key:"work", label:"작품관리", icon:"ph-images-square"},
  {key:"judge", label:"심사위원관리", icon:"ph-gavel"},
  {key:"assign", label:"심사배정", icon:"ph-flow-arrow"},
  {key:"pay", label:"결제관리", icon:"ph-credit-card"},
  {key:"result", label:"결과발표", icon:"ph-megaphone"},
  {key:"cert", label:"인증서발급", icon:"ph-seal-check"},
  {key:"finals", label:"해외본선관리", icon:"ph-globe-hemisphere-east"},
  {key:"notice", label:"공지/문의관리", icon:"ph-chat-circle-text"},
];
const APPLICANT_ROWS = [
  {id:"A-1042", name:"김지훈", genre:"문학", status:"접수완료", updated:"2026-08-30 09:14"},
  {id:"A-1043", name:"이서연", genre:"사진", status:"심사중", updated:"2026-08-29 17:02"},
  {id:"A-1044", name:"박민준", genre:"음악", status:"수상", updated:"2026-08-28 11:40"},
];

function AdminConsole(){
  const [menu, setMenu] = useState("applicant");
  const [q, setQ] = useState("");
  const [onlyReview, setOnlyReview] = useState(false);
  const [historyId, setHistoryId] = useState(null);
  const [toast, setToast] = useToast();

  const current = ADMIN_MENUS.find(m => m.key === menu);
  const filteredRows = APPLICANT_ROWS
    .filter(r => r.name.includes(q) || r.id.includes(q))
    .filter(r => !onlyReview || r.status === "심사중");

  const summaryByMenu = {
    contest: [["24","진행중 공모전"],["6","국가"],["148","도시 지역예선"]],
    applicant: [["1,204","전체 접수자"],["312","심사중"],["96","수상"]],
    work: [["1,204","제출 작품"],["6","분야"],["18GB","저장 용량"]],
    judge: [["18","활동 심사위원"],["5.3건","평균 배정량"],["92%","평가 완료율"]],
    assign: [["132","배정 대기"],["8","자동배정 규칙"]],
    pay: [["₩38.4M","국내 참가비 합계"],["$9.6K","해외본선 합계"]],
    result: [["3","예약된 발표"],["2026-11-02","다음 발표일"]],
    cert: [["96","발급 대상"],["2","언어 템플릿"]],
    finals: [["24","본선 진출자"],["4","해외 개최 도시"]],
    notice: [["12","미답변 문의"],["4.2h","평균 응답시간"]],
  };

  return (
    <main className="shell">
      <div className="page-head"><div><h1 className="page-title">관리자 콘솔</h1><p className="page-sub">공모전 운영에 필요한 10개 메뉴를 한 화면에서 관리합니다</p></div></div>
      <div className="admin-layout">
        <nav className="admin-menu">
          {ADMIN_MENUS.map(m => (
            <button key={m.key} className={menu===m.key?"active":""} onClick={() => setMenu(m.key)}>
              <i className={"ph " + m.icon}></i>{m.label}
            </button>
          ))}
        </nav>
        <section className="admin-content">
          <h2 style={{margin:"0 0 14px", fontSize:18, fontWeight:700}}>{current.label}</h2>
          <div className="stat-chip-row">
            {summaryByMenu[menu].map(([n,l]) => (
              <div className="stat-chip" key={l}><div className="n">{n}</div><div className="l">{l}</div></div>
            ))}
          </div>

          {menu === "applicant" && (
            <React.Fragment>
              <div className="toolbar-row">
                <input placeholder="이름 또는 접수번호로 검색" value={q} onChange={e => setQ(e.target.value)} />
                <button className={"btn " + (onlyReview ? "btn-solid" : "btn-ghost")} onClick={() => setOnlyReview(!onlyReview)}><i className="ph ph-funnel"></i>심사중만</button>
                <button className="btn btn-solid" onClick={() => setToast("엑셀 다운로드를 준비하고 있습니다")}><i className="ph ph-file-xls"></i>엑셀 다운로드</button>
              </div>
              <table className="table-list">
                <thead><tr><th>접수번호</th><th>이름</th><th>분야</th><th>상태</th><th>최근 수정</th><th></th></tr></thead>
                <tbody>
                  {filteredRows.map(r => (
                    <tr key={r.id}>
                      <td>{r.id}</td><td>{r.name}</td><td>{r.genre}</td><td>{r.status}</td><td>{r.updated}</td>
                      <td><button className="link-btn" onClick={() => setHistoryId(r.id)}>수정이력</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {historyId && (
                <div style={{marginTop:14, background:"var(--surface2)", border:"1px solid var(--line)", borderRadius:14, padding:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <strong style={{fontSize:13}}>{historyId} 수정이력</strong>
                    <button className="link-btn" onClick={() => setHistoryId(null)}>닫기</button>
                  </div>
                  <p style={{fontSize:12,color:"var(--ink-dim)",margin:"4px 0"}}>2026-08-30 09:14 — 상태: 심사중 → 접수완료</p>
                  <p style={{fontSize:12,color:"var(--ink-dim)",margin:"4px 0"}}>2026-08-27 13:02 — 파일 재업로드 (poster_v2.jpg)</p>
                </div>
              )}
            </React.Fragment>
          )}

          {menu === "contest" && (
            <table className="table-list">
              <thead><tr><th>공모전명</th><th>국가</th><th>접수기간</th><th>상태</th></tr></thead>
              <tbody>
                <tr><td>루미나 문학 공모전 서울</td><td>대한민국</td><td>09.01 ~ 10.30</td><td>접수중</td></tr>
                <tr><td>루미나 비주얼아트 도쿄</td><td>일본</td><td>09.10 ~ 11.05</td><td>접수중</td></tr>
                <tr><td>루미나 필름메이커스 파리</td><td>프랑스</td><td>08.01 ~ 09.20</td><td>마감임박</td></tr>
              </tbody>
            </table>
          )}

          {!["applicant","contest"].includes(menu) && (
            <div style={{background:"var(--surface2)", border:"1px solid var(--line)", borderRadius:14, padding:18, fontSize:13, color:"var(--ink-dim)"}}>
              {current.label} 화면에서는 관련 데이터를 목록·필터·상세 패널로 관리합니다.
              <div style={{marginTop:12}}>
                <button className="btn btn-ghost" onClick={() => setToast(current.label + " 화면의 상세 항목을 불러옵니다")}>상세 목록 열기</button>
              </div>
            </div>
          )}
        </section>
      </div>
      <Toast msg={toast} />
    </main>
  );
}

const WINNERS = [
  {id:1, name:"김서준", title:"Echo Chamber", award:"대상"},
  {id:2, name:"박민준", title:"서울의 밤", award:"금상"},
  {id:3, name:"이하은", title:"도시의 결", award:"금상"},
];
const SEND_LOG = [
  {id:1, ch:"이메일", to:"winner01@mail.com", status:"success"},
  {id:2, ch:"SMS", to:"010-****-1234", status:"success"},
  {id:3, ch:"이메일", to:"winner03@mail.com", status:"retry"},
];

function Certificate(){
  const [selected, setSelected] = useState(WINNERS.map(w => w.id));
  const [generating, setGenerating] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [releaseAt, setReleaseAt] = useState("2026-11-02T10:00");
  const [toast, setToast] = useToast();

  function toggle(id){ setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]); }
  function generate(){
    setGenerating(true); setGenerated(false);
    setTimeout(() => { setGenerating(false); setGenerated(true); setToast("영/국문 인증서 " + selected.length*2 + "건이 생성되었습니다"); }, 2200);
  }

  return (
    <main className="shell cert-shell">
      <div className="page-head"><div><h1 className="page-title">인증서 발급</h1><p className="page-sub">수상 확정자의 영/국문 인증서를 일괄 생성하고 발송합니다</p></div></div>

      {WINNERS.map(w => (
        <div className="cert-row" key={w.id}>
          <input type="checkbox" checked={selected.includes(w.id)} onChange={() => toggle(w.id)} style={{width:16,height:16}} />
          <div className="grow"><strong style={{fontSize:14}}>{w.title}</strong><span style={{fontSize:12,color:"var(--ink-dim)",marginLeft:8}}>{w.name}</span></div>
          <span className="tag">{w.award}</span>
          {generated && (
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-ghost" style={{padding:"6px 12px",fontSize:11}} onClick={() => setToast("영문 인증서를 다운로드합니다")}>EN</button>
              <button className="btn btn-ghost" style={{padding:"6px 12px",fontSize:11}} onClick={() => setToast("국문 인증서를 다운로드합니다")}>KR</button>
            </div>
          )}
        </div>
      ))}

      <button className="btn btn-solid" disabled={selected.length===0 || generating} onClick={generate}>
        <i className="ph ph-stack"></i>{generating ? "생성 중…" : "선택 항목 인증서 일괄 생성"}
      </button>
      {generating && <div className="progress-track"><div className="progress-fill"></div></div>}

      <div style={{marginTop:28, background:"var(--surface)", border:"1px solid var(--line)", borderRadius:20, padding:20}}>
        <h3 style={{margin:"0 0 12px", fontSize:15, fontWeight:700}}>결과 공개 예약 및 발송</h3>
        <div className="toolbar-row">
          <input type="datetime-local" value={releaseAt} onChange={e => setReleaseAt(e.target.value)} />
          <button className="btn btn-solid" onClick={() => setToast(releaseAt.replace("T"," ") + " 이후 자동 발송이 예약되었습니다")}><i className="ph ph-paper-plane-tilt"></i>발송 예약</button>
        </div>
        <table className="table-list">
          <thead><tr><th>채널</th><th>수신처</th><th>상태</th></tr></thead>
          <tbody>
            {SEND_LOG.map(l => (
              <tr key={l.id}>
                <td>{l.ch}</td><td>{l.to}</td>
                <td><span className={"log-status " + (l.status==="success"?"log-ok":"log-retry")}>{l.status==="success" ? "발송성공" : "재시도 대기"}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Toast msg={toast} />
    </main>
  );
}

function App(){
  const [screen, setScreen] = useState("main");
  useEffect(() => { window.scrollTo(0,0); }, [screen]);
  return (
    <div data-archetype="kanban-board">
      <TopBar screen={screen} setScreen={setScreen} />
      {screen === "main" && <KanbanBoard />}
      {screen === "judge-review" && <JudgeReview />}
      {screen === "admin-console" && <AdminConsole />}
      {screen === "certificate" && <Certificate />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
