<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루나로그 — AI 대화형 사주 상담</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --primary:#d4c7ff; --primary-ink:#714cb6; --wine:#421d24;
    --secondary:#e3e3e2; --accent:#f6bc1e;
    --bg:#f2f0eb; --surface:#ffffff; --lagoon:#0c4243;
    --text:#292827; --text2:#666666;
    --r-card:16px; --r-btn:16px; --r-sm:8px; --r-pill:999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%;}
  body{
    font-family:'PretendardVariable','Pretendard',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); width:100%; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app-root{width:100%;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
  input, textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#d8d5cd; border-radius:8px;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes typingBounce{ 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-5px); opacity:1;} }
  @keyframes pulseGlow{ 0%,100%{box-shadow:0 0 0 0 rgba(246,188,30,.5);} 50%{box-shadow:0 0 0 6px rgba(246,188,30,0);} }
  @keyframes toastSlide{ from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
  @keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
  @keyframes ringGrow{ from{stroke-dashoffset:283;} to{stroke-dashoffset:var(--dash, 100);} }

  .app-shell{display:flex; width:100%; min-height:100vh;}

  /* 워크스페이스 strip */
  .workspace-strip{
    width:64px; flex:0 0 64px; background:var(--wine); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:10px;
  }
  .ws-item{
    width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:#fff; background:rgba(255,255,255,.12);
    transition:all .18s ease; position:relative;
  }
  .ws-item:hover{background:rgba(255,255,255,.22); transform:scale(1.06);}
  .ws-item.active{background:var(--primary); color:var(--wine); border-radius:12px;}
  .ws-item.active::before{content:''; position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:4px; height:22px; background:#fff; border-radius:0 4px 4px 0;}
  .ws-divider{width:28px; height:1px; background:rgba(255,255,255,.2); margin:4px 0;}
  .ws-add{border:1.5px dashed rgba(255,255,255,.4); color:#fff;}

  /* 채널 리스트 */
  .channel-list{
    width:272px; flex:0 0 272px; background:var(--surface); border-right:1px solid var(--secondary);
    min-height:100vh; display:flex; flex-direction:column; overflow-y:auto;
  }
  .channel-header{padding:20px 18px 12px; display:flex; align-items:center; justify-content:space-between;}
  .ws-name{font-size:19px; font-weight:700; letter-spacing:-.2px;}
  .new-conv{width:30px; height:30px; border-radius:var(--r-sm); background:var(--bg); display:flex; align-items:center; justify-content:center; transition:background .15s;}
  .new-conv:hover{background:var(--secondary);}
  .channel-search{padding:0 18px 14px;}
  .channel-search input{
    width:100%; padding:9px 12px; border-radius:var(--r-pill); border:1px solid var(--secondary);
    background:var(--bg); font-size:13px; color:var(--text); outline:none;
  }
  .channel-search input:focus{border-color:var(--primary-ink);}
  .channel-section{padding:0 10px; margin-bottom:6px;}
  .section-toggle{
    width:100%; text-align:left; padding:8px 8px; font-size:12px; font-weight:700; color:var(--text2);
    text-transform:uppercase; letter-spacing:.4px; display:flex; align-items:center; gap:4px;
  }
  .channel-item, .dm-item{
    width:100%; display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px;
    font-size:14px; color:var(--text); text-align:left; transition:background .14s;
  }
  .channel-item:hover, .dm-item:hover{background:var(--bg);}
  .channel-item.active, .dm-item.active{background:var(--primary); color:var(--wine); font-weight:700;}
  .channel-prefix{color:var(--text2); font-weight:600;}
  .channel-item.active .channel-prefix{color:var(--wine);}
  .channel-unread, .dm-unread{
    margin-left:auto; background:var(--accent); color:#3a2900; font-size:11px; font-weight:800;
    padding:1px 7px; border-radius:var(--r-pill); animation:pulseGlow 2.4s ease-in-out infinite;
  }
  .dm-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dm-sub{font-size:11px; color:var(--text2); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .presence{width:9px; height:9px; border-radius:50%; flex:0 0 9px;}
  .presence.online{background:#3ea36b;}
  .presence.away{background:#c9a227;}
  .quick-feature{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
    font-size:13.5px; font-weight:600; color:var(--text); text-align:left; margin-bottom:5px;
    border:1px solid var(--secondary); background:var(--bg); transition:all .15s;
  }
  .quick-feature i{font-size:17px; color:var(--primary-ink);}
  .quick-feature:hover{border-color:var(--primary-ink); background:#fff; transform:translateX(2px);}

  /* 메인 */
  .conv-main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; background:var(--bg);}
  .conv-header{
    height:64px; flex:0 0 64px; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; border-bottom:1px solid var(--secondary); background:rgba(242,240,235,.85); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:5;
  }
  .conv-title-row{display:flex; align-items:center; gap:10px;}
  .conv-prefix{color:var(--text2); font-size:17px; font-weight:600;}
  .conv-title{font-size:17px; font-weight:700;}
  .member-count{font-size:12.5px; color:var(--text2); background:var(--secondary); padding:2px 9px; border-radius:var(--r-pill);}
  .conv-actions{display:flex; gap:6px;}
  .conv-action{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    color:var(--text2); font-size:17px; transition:background .15s;
  }
  .conv-action:hover, .conv-action.on{background:var(--secondary); color:var(--text);}
  .conv-body{flex:1; overflow-y:auto; padding:24px 28px;}

  .msg-group{display:flex; gap:12px; margin-bottom:20px; animation:fadeInUp .35s ease both;}
  .msg-avatar{
    width:38px; height:38px; border-radius:12px; flex:0 0 38px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; color:#fff;
  }
  .msg-content{flex:1; min-width:0;}
  .msg-name{font-weight:700; font-size:14.5px; margin-right:8px;}
  .msg-time{font-size:12px; color:var(--text2);}
  .msg-bubble{
    margin-top:5px; background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-card);
    padding:14px 16px; font-size:14.5px; line-height:1.6; max-width:560px;
  }
  .msg-bubble.me{background:var(--primary); border-color:var(--primary); color:var(--wine); font-weight:500;}

  .home-hero{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--surface) 0%, #fff 60%); border:1px solid var(--secondary);
    border-radius:20px; padding:32px; margin-bottom:22px;
    box-shadow:0 1px 2px rgba(41,40,39,.05), 0 14px 34px rgba(66,29,36,.07);
    display:grid; grid-template-columns:1.15fr .85fr; gap:20px; align-items:center;
  }
  .home-hero::before{
    content:''; position:absolute; inset:-40% -10% auto auto; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(246,188,30,.28), rgba(212,199,255,.32) 45%, transparent 72%);
    filter:blur(2px); pointer-events:none;
  }
  .home-hero-text, .home-hero-art{position:relative; z-index:1;}
  .home-hero-art{display:flex; align-items:center; justify-content:center;}
  .radar-ring{fill:none; stroke:var(--secondary); stroke-width:1;}
  .radar-shape{fill:rgba(113,76,182,.16); stroke:var(--primary-ink); stroke-width:2; stroke-dasharray:283; stroke-dashoffset:283; --dash:18; animation:ringGrow 1.4s ease forwards .2s;}
  .radar-axis{stroke:var(--secondary); stroke-width:1;}
  .radar-label{font-size:10.5px; fill:var(--text2); font-weight:700;}
  .radar-dot{animation:pulseGlow 2.2s ease-in-out infinite;}
  .home-hero-eyebrow{font-size:13px; font-weight:700; color:var(--primary-ink); letter-spacing:.3px;}
  .home-hero-title{font-size:34px; font-weight:460; letter-spacing:-.8px; line-height:1.2; margin:8px 0 6px; color:var(--wine);}
  .home-hero-sub{font-size:14.5px; color:var(--text2); max-width:520px; line-height:1.55;}
  .profile-tabs{display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;}
  .profile-tab{
    display:flex; align-items:center; gap:8px; padding:8px 14px 8px 8px; border-radius:var(--r-pill);
    border:1px solid var(--secondary); background:#fff; font-size:13.5px; font-weight:600; transition:all .15s;
  }
  .profile-tab .pt-avatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;}
  .profile-tab.active{border-color:var(--primary-ink); background:var(--primary); color:var(--wine);}
  .profile-tab.locked{opacity:.55;}

  .fortune-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:16px; margin-top:20px;}
  .fortune-card{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-card); padding:20px; box-shadow:0 1px 2px rgba(41,40,39,.05), 0 8px 22px rgba(41,40,39,.06); transition:transform .18s ease, box-shadow .18s ease;}
  .fortune-card:hover{transform:translateY(-3px); box-shadow:0 4px 8px rgba(41,40,39,.06), 0 16px 30px rgba(41,40,39,.10);}
  .fortune-card-label{font-size:12.5px; color:var(--text2); font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .fortune-score{font-size:30px; font-weight:700; color:var(--wine);}
  .fortune-bar-track{width:100%; height:6px; background:var(--bg); border-radius:99px; margin-top:10px; overflow:hidden;}
  .fortune-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--primary-ink), var(--primary));}
  .oheang-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .oheang-chip{font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:var(--r-pill); color:#fff;}

  .section-label{font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; margin:26px 0 12px;}

  .consultant-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  .consultant-card{
    background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-card); padding:18px;
    text-align:left; transition:all .18s ease; box-shadow:0 1px 2px rgba(41,40,39,.04);
  }
  .consultant-card:hover{border-color:var(--primary-ink); transform:translateY(-2px);}
  .consultant-icon{width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; margin-bottom:10px;}
  .consultant-name{font-weight:700; font-size:15px; margin-bottom:3px;}
  .consultant-desc{font-size:12.5px; color:var(--text2); line-height:1.5;}

  .conv-input{
    flex:0 0 auto; padding:14px 24px 22px; display:flex; align-items:center; gap:10px;
    border-top:1px solid var(--secondary); background:var(--bg); position:sticky; bottom:0;
  }
  .msg-input-wrap{flex:1; display:flex; align-items:center; background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-pill); padding:6px 6px 6px 18px;}
  .msg-input-wrap input{flex:1; border:none; outline:none; font-size:14px; padding:8px 0; background:transparent; color:var(--text);}
  .send-btn{width:38px; height:38px; border-radius:50%; background:var(--wine); color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 38px; transition:transform .15s;}
  .send-btn:hover{transform:scale(1.07);}
  .input-actions{display:flex; gap:4px; color:var(--text2);}
  .input-actions button{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .input-actions button:hover{background:var(--secondary);}

  .typing-row{display:flex; gap:5px; padding:12px 16px; background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-card); width:fit-content;}
  .typing-dot{width:6px; height:6px; border-radius:50%; background:var(--primary-ink); animation:typingBounce 1.2s infinite;}
  .typing-dot:nth-child(2){animation-delay:.15s;} .typing-dot:nth-child(3){animation-delay:.3s;}

  .limit-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff7e6;
    border:1px solid #f2dca0; border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:13px;
  }
  .limit-banner button{background:var(--wine); color:#fff; padding:7px 14px; border-radius:var(--r-sm); font-size:12.5px; font-weight:700;}

  .memory-list{display:flex; flex-direction:column; gap:10px;}
  .memory-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--secondary);
    border-radius:var(--r-card); padding:16px 18px; cursor:pointer; transition:all .16s;
  }
  .memory-card:hover, .memory-card.active{border-color:var(--primary-ink); box-shadow:0 6px 18px rgba(66,29,36,.06);}
  .memory-cat{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; flex:0 0 34px;}
  .memory-title{font-weight:700; font-size:14px; margin-bottom:2px;}
  .memory-snippet{font-size:12.5px; color:var(--text2); line-height:1.5;}
  .memory-del{margin-left:auto; color:var(--text2); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .memory-del:hover{background:#fde3e0; color:#c0392b;}
  .cat-filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .cat-chip{padding:7px 14px; border-radius:var(--r-pill); font-size:12.5px; font-weight:700; border:1px solid var(--secondary); background:#fff;}
  .cat-chip.active{background:var(--wine); color:#fff; border-color:var(--wine);}

  .compat-form{background:var(--surface); border:1px solid var(--secondary); border-radius:var(--r-card); padding:24px;}
  .compat-form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--text2);}
  .field input, .field select{padding:10px 12px; border:1px solid var(--secondary); border-radius:10px; font-size:13.5px; background:var(--bg);}
  .compat-cta{width:100%; padding:13px; background:var(--wine); color:#fff; border-radius:var(--r-btn); font-weight:700; font-size:14.5px; margin-top:6px;}

  .compat-result{margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .compat-score-card{background:linear-gradient(135deg,var(--primary),#efe8ff); border-radius:18px; padding:22px; text-align:center;}
  .compat-score-num{font-size:44px; font-weight:460; color:var(--wine); letter-spacing:-1px;}
  .lock-panel{position:relative; background:var(--surface); border:1px dashed var(--secondary); border-radius:var(--r-card); padding:20px; overflow:hidden;}
  .lock-panel::after{content:''; position:absolute; inset:0; backdrop-filter:blur(3px); background:rgba(242,240,235,.55);}
  .lock-cta{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; z-index:2;}
  .lock-cta button{background:var(--wine); color:#fff; padding:9px 18px; border-radius:var(--r-sm); font-weight:700; font-size:13px;}

  .plan-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
  .plan-card{border:1.5px solid var(--secondary); border-radius:var(--r-card); padding:20px; cursor:pointer; transition:all .16s;}
  .plan-card:hover{border-color:var(--primary-ink);}
  .plan-card.selected{border-color:var(--wine); background:#fff8ef;}
  .plan-price{font-size:26px; font-weight:700; margin:6px 0;}

  /* info panel */
  .info-panel{width:320px; flex:0 0 320px; background:var(--surface); border-left:1px solid var(--secondary); min-height:100vh; padding:0; overflow-y:auto; transition:margin-right .2s ease;}
  .info-panel.closed{margin-right:-320px;}
  .info-header{display:flex; align-items:center; justify-content:space-between; padding:20px 18px 12px; border-bottom:1px solid var(--secondary);}
  .info-header h3{font-size:15.5px; font-weight:700;}
  .close-info{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
  .close-info:hover{background:var(--bg);}
  .info-section{padding:16px 18px; border-bottom:1px solid var(--bg);}
  .info-label{font-size:11.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.3px; margin-bottom:8px;}
  .info-value{font-size:13.5px; line-height:1.7;}
  .member-list{display:flex; flex-direction:column; gap:10px;}
  .member-item{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; transition:background .14s;}
  .member-item:hover{background:var(--bg);}
  .member-avatar{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; flex:0 0 32px;}
  .member-name{font-size:13.5px; font-weight:600; flex:1;}
  .member-role{font-size:11px; color:var(--text2); background:var(--bg); padding:2px 8px; border-radius:var(--r-pill);}
  .pinned-item{display:block; font-size:13px; padding:9px 10px; border-radius:8px; background:var(--bg); margin-top:6px;}

  .toast-wrap{position:fixed; bottom:26px; right:26px; z-index:100; display:flex; flex-direction:column; gap:10px;}
  .toast{background:var(--wine); color:#fff; padding:13px 18px; border-radius:12px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; animation:toastSlide .3s ease both; box-shadow:0 10px 24px rgba(66,29,36,.25);}

  .modal-overlay{position:fixed; inset:0; background:rgba(41,40,39,.45); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeInUp .2s ease both; backdrop-filter:blur(2px);}
  .modal-box{width:440px; max-width:90vw; background:var(--surface); border-radius:20px; padding:26px; max-height:86vh; overflow-y:auto;}
  .modal-box h3{font-size:19px; font-weight:700; margin-bottom:16px;}
  .modal-close-row{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .btn-ghost{padding:10px 16px; border-radius:var(--r-sm); font-size:13.5px; font-weight:700; color:var(--text2);}
  .btn-primary{padding:10px 18px; border-radius:var(--r-sm); font-size:13.5px; font-weight:700; background:var(--wine); color:#fff;}

  @media (max-width: 1100px){
    .info-panel{display:none;}
    .fortune-grid{grid-template-columns:1fr;}
    .consultant-grid{grid-template-columns:1fr;}
    .compat-result{grid-template-columns:1fr;}
    .channel-list{width:230px; flex-basis:230px;}
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

const FAMILY = [
  {id:'me', name:'김민준', init:'민', color:'#714cb6', role:'본인'},
  {id:'spouse', name:'이서연', init:'서', color:'#c88b3a', role:'배우자'},
  {id:'kid', name:'김하윤', init:'하', color:'#3ea36b', role:'자녀'},
];

const CONSULTANTS = [
  {id:'classic', name:'정통 명리', desc:'사주 원리에 충실한 근본 해석', icon:'ph-scroll', color:'#714cb6'},
  {id:'wealth', name:'재물·사업·커리어', desc:'돈의 흐름과 커리어 타이밍', icon:'ph-trend-up', color:'#c8862f'},
  {id:'love', name:'연애·결혼·관계', desc:'인연과 관계의 결을 짚어드려요', icon:'ph-heart', color:'#c05a7a'},
];

const MEMORY_ITEMS = [

function Toasts({toasts}){
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><i className="ph-fill ph-check-circle"></i>{t.text}</div>
      ))}
    </div>
  );
}

function OheangRadar(){
  const axes = [
    {label:'목', value:34, color:'#3ea36b'},
    {label:'화', value:21, color:'#c0392b'},
    {label:'토', value:18, color:'#c8862f'},
    {label:'금', value:15, color:'#6b7280'},
    {label:'수', value:12, color:'#3b6ea5'},
  ];
  const cx=100, cy=100, maxR=72;
  const pt = (i, r) => {
    const ang = (-90 + i * (360/axes.length)) * Math.PI/180;
    return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
  };
  const shapePts = axes.map((a,i) => pt(i, (a.value/34)*maxR)).map(p=>p.join(',')).join(' ');
  return (
    <svg width="220" height="220" viewBox="0 0 200 200">
      {[0.33,0.66,1].map((f,i) => {
        const ringPts = axes.map((a,idx) => pt(idx, maxR*f)).map(p=>p.join(',')).join(' ');
        return <polygon key={i} className="radar-ring" points={ringPts} />;
      })}
      {axes.map((a,i) => {
        const [x,y] = pt(i, maxR);
        return <line key={i} className="radar-axis" x1={cx} y1={cy} x2={x} y2={y} />;
      })}
      <polygon className="radar-shape" points={shapePts} />
      {axes.map((a,i) => {
        const [x,y] = pt(i, (a.value/34)*maxR);
        const [lx,ly] = pt(i, maxR+14);
        return (
          <React.Fragment key={i}>
            <circle className="radar-dot" cx={x} cy={y} r="4" fill={a.color} />
            <text className="radar-label" x={lx} y={ly} textAnchor="middle" dominantBaseline="middle">{a.label} {a.value}%</text>
          </React.Fragment>
        );
      })}
    </svg>
  );
}

                      <div style={{filter:'blur(1px)'}}>
                        <div className="fortune-card-label">상세 궁합 리포트</div>
                        <p style={{fontSize:12.5, color:'var(--text2)'}}>십성 교차 분석, 재물·자녀운 궁합, AI 추가 질문 3회 무료 제공</p>
                      </div>
                      <div className="lock-cta">
                        <i className="ph ph-lock-simple" style={{fontSize:22}}></i>
                        <span style={{fontSize:12.5, fontWeight:700}}>Premium 전용 상세 분석</span>
                        <button onClick={() => setPlanOpen(true)}>Premium으로 보기</button>
                      </div>
                    </div>
                  ) : (
                    <div className="fortune-card">
                      <div className="fortune-card-label"><i className="ph ph-sparkle"></i>상세 궁합 리포트</div>
                      <p style={{fontSize:13, lineHeight:1.6}}>두 분의 일간이 상생 관계라 대화가 잘 통하는 궁합이에요. 재물운은 협업 시 시너지가 크고, 연말 즈음 관계가 한 단계 깊어질 흐름이 보여요.</p>
                    </div>
                  )}
                </div>
              )}

              <div className="section-label">회원 등급</div>
              <div className="plan-grid">
                <div className={"plan-card" + (!isPremium ? " selected":"")}>
                  <div style={{fontSize:13, fontWeight:700, color:'var(--text2)'}}>무료</div>
                  <div className="plan-price">0원</div>
                  <div style={{fontSize:12.5, color:'var(--text2)', lineHeight:1.6}}>오늘의 운세 · 상담 일 3회 · 궁합 요약</div>
                </div>
                <div className={"plan-card" + (isPremium ? " selected":"")}>
                  <div style={{fontSize:13, fontWeight:700, color:'var(--primary-ink)'}}>Premium</div>
                  <div className="plan-price">9,900원<span style={{fontSize:13, fontWeight:500}}>/월</span></div>
                  <div style={{fontSize:12.5, color:'var(--text2)', lineHeight:1.6, marginBottom:10}}>다중 프로필 · 무제한 상담 · 월간·연간 운세 · 궁합 상세</div>
                  <button className="compat-cta" style={{marginTop:0}} onClick={() => setPlanOpen(true)}>{isPremium ? '구독 관리' : 'Premium 구독하기'}</button>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}
      </main>

      {/* 정보 패널 */}
      <aside className="info-panel" style={infoOpen ? {} : {marginRight:-320, opacity:0, pointerEvents:'none'}}>
        <header className="info-header">
          <h3>{activeFamily.name}님 프로필</h3>
          <button className="close-info" onClick={() => setInfoOpen(false)}><i className="ph ph-x"></i></button>
        </header>
        <div className="info-section">
          <div className="info-label">사주 정보</div>
          <div className="info-value">
            1990-03-14 (양력) · 오전 07:20<br/>
            일간: 갑목(甲木) · 서울 출생<br/>
            회원 등급: {isPremium ? 'Premium':'무료'}
          </div>
        </div>
        <div className="info-section">
          <div className="info-label">가족 프로필 ({FAMILY.length})</div>
          <div className="member-list">
            {FAMILY.map(f => (
              <div className="member-item" key={f.id} onClick={() => setActiveProfile(f.id)}>
                <span className="member-avatar" style={{background:f.color}}>{f.init}</span>
                <span className="member-name">{f.name}</span>
                <span className="member-role">{f.role}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="info-section">
          <div className="info-label">최근 저장된 Memory</div>
          {memoryItems.slice(0,2).map(m => (
            <a key={m.id} className="pinned-item" onClick={() => setView('memory')}>{m.title}</a>
          ))}
        </div>
      </aside>

      {planOpen && (
        <div className="modal-overlay" onClick={() => setPlanOpen(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3>Premium 구독</h3>
            <div className="plan-grid" style={{gridTemplateColumns:'1fr'}}>
              <div className={"plan-card" + (selectedPlan==='monthly' ? " selected":"")} onClick={() => setSelectedPlan('monthly')}>
                <div style={{fontSize:13, fontWeight:700}}>월간 구독</div>
                <div className="plan-price">9,900원<span style={{fontSize:13, fontWeight:500}}>/월</span></div>
              </div>
              <div className={"plan-card" + (selectedPlan==='premium' ? " selected":"")} onClick={() => setSelectedPlan('premium')}>
                <div style={{fontSize:13, fontWeight:700, color:'var(--primary-ink)'}}>연간 구독 (2개월 무료)</div>
                <div className="plan-price">99,000원<span style={{fontSize:13, fontWeight:500}}>/년</span></div>
              </div>
            </div>
            <div className="modal-close-row">
              <button className="btn-ghost" onClick={() => setPlanOpen(false)}>취소</button>
              <button className="btn-primary" onClick={confirmSubscribe}>인앱 결제로 구독하기</button>
            </div>
          </div>
        </div>
      )}

      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
