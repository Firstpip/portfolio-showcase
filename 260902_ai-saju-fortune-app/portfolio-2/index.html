<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루나로그 오퍼레이션 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#2bffc6; --secondary:#1b1b1b; --accent:#f75745;
    --bg:#000000; --haze:#f5f5f5; --ink:#1b1b1b;
    --text:#ffffff; --text2:#9aa3ad; --twilight:#426188;
    --r-card:12px; --r-btn:8px; --r-input:4px; --r-pill:9999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%;}
  body{
    font-family:'PretendardVariable','Pretendard',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); width:100%; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app-root{width:100%;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#2a2a2a; border-radius:8px;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }
  @keyframes pulseAlert{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes dashDraw{ from{stroke-dashoffset:440;} to{stroke-dashoffset:var(--dash,120);} }
  @keyframes livePing{ 0%{box-shadow:0 0 0 0 rgba(43,255,198,.5);} 70%{box-shadow:0 0 0 8px rgba(43,255,198,0);} 100%{box-shadow:0 0 0 0 rgba(43,255,198,0);} }

  .shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}

  .app-header{
    position:sticky; top:0; z-index:20; height:60px; display:flex; align-items:center; gap:20px;
    padding:0 24px; border-bottom:1px solid #1e1e1e; background:rgba(0,0,0,.9); backdrop-filter:blur(10px);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:-.2px;}
  .brand-badge{width:26px; height:26px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#000;}
  .project-switcher{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2); padding:6px 10px; border-radius:var(--r-btn); border:1px solid #262626; cursor:pointer;}
  .project-switcher:hover{border-color:#3a3a3a;}
  .global-nav{display:flex; gap:4px; margin-left:8px;}
  .nav-link{padding:8px 12px; font-size:13.5px; color:var(--text2); border-radius:var(--r-btn);}
  .nav-link:hover{color:var(--text); background:#141414;}
  .header-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
  .icon-btn{width:34px; height:34px; border-radius:var(--r-btn); display:flex; align-items:center; justify-content:center; color:var(--text2); position:relative; transition:all .15s;}
  .icon-btn:hover{background:#141414; color:var(--text);}
  .notif-dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulseAlert 2s infinite;}
  .avatar-chip{width:32px; height:32px; border-radius:50%; background:var(--haze); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--primary); animation:livePing 1.8s infinite; margin-right:6px; display:inline-block;}

  .tab-bar{display:flex; gap:4px; padding:0 24px; border-bottom:1px solid #1a1a1a; overflow-x:auto;}
  .tab{padding:13px 6px; margin-right:22px; font-size:13.5px; font-weight:500; color:var(--text2); border-bottom:2px solid transparent; white-space:nowrap; transition:color .15s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text); border-color:var(--primary); font-weight:700;}

  .content{max-width:1280px; margin:0 auto; padding:26px 24px 60px; width:100%;}

  .section-title{font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; margin-bottom:14px;}
  .range-select{display:flex; gap:4px; background:#111; border:1px solid #232323; border-radius:var(--r-pill); padding:3px;}
  .range-btn{padding:6px 13px; border-radius:var(--r-pill); font-size:12.5px; color:var(--text2);}
  .range-btn.active{background:var(--haze); color:var(--ink); font-weight:700;}

  .overview-top{display:grid; grid-template-columns:1.65fr 1fr; gap:16px; margin-bottom:16px;}
  .hero-card{background:var(--haze); color:var(--ink); border-radius:16px; padding:22px; animation:fadeInUp .3s ease both;}
  .hero-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .hero-metric-label{font-size:12.5px; color:#5c6570; font-weight:600;}
  .hero-metric-value{font-size:48px; font-weight:800; letter-spacing:-1.5px; margin:2px 0 14px;}
  .hero-metric-value span{font-size:14px; font-weight:700; color:#1a8f6e; margin-left:8px;}
  .chart-svg-wrap{width:100%; height:220px; position:relative;}

  .stat-side{display:flex; flex-direction:column; gap:12px;}
  .stat-card{background:var(--haze); color:var(--ink); border-radius:var(--r-card); padding:16px 18px; display:flex; flex-direction:column; gap:6px; animation:fadeInUp .3s ease both;}
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-label{font-size:12px; font-weight:700; color:#5c6570;}
  .stat-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .stat-value{font-size:24px; font-weight:800; letter-spacing:-.5px;}
  .stat-spark{width:100%; height:28px;}
  .stat-delta{font-size:11.5px; font-weight:700; color:#1a8f6e;}

  .widget-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  .widget-card{background:var(--haze); color:var(--ink); border-radius:var(--r-card); padding:18px; animation:fadeInUp .3s ease both;}
  .widget-title{font-size:12.5px; font-weight:700; color:#5c6570; margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .donut-wrap{display:flex; align-items:center; gap:14px;}
  .donut-legend{font-size:11.5px; color:#4a5259; display:flex; flex-direction:column; gap:6px;}
  .legend-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .bar-row{display:flex; align-items:flex-end; gap:12px; height:120px; padding:0 4px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .bar-fill{width:100%; border-radius:6px 6px 0 0; transform-origin:bottom; animation:barGrow .6s ease both;}
  .bar-num{font-size:11px; font-weight:700; color:#4a5259;}
  .bar-name{font-size:10.5px; color:#7a828a; text-align:center;}
  .timeline-list{display:flex; flex-direction:column; gap:10px;}
  .timeline-item{display:flex; gap:10px; align-items:flex-start; font-size:12px;}
  .timeline-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex:0 0 7px;}
  .timeline-text{color:#3a4046;}
  .timeline-time{color:#8a929a; font-size:10.5px;}

  /* 회원 관리 */
  .subtab-row{display:flex; gap:6px; margin-bottom:16px;}
  .pill-toggle{padding:8px 16px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600; background:#111; border:1px solid #262626; color:var(--text2);}
  .pill-toggle.active{background:var(--haze); color:var(--ink); border-color:var(--haze);}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .search-input{flex:1; max-width:320px; background:#111; border:1px solid #262626; border-radius:var(--r-input); padding:9px 12px; font-size:13px; color:var(--text); outline:none;}
  .search-input:focus{border-color:var(--primary);}
  .ghost-btn{padding:9px 14px; border-radius:var(--r-btn); font-size:12.5px; font-weight:600; border:1px solid #ffffff; color:#fff; background:transparent; display:flex; align-items:center; gap:6px;}
  .ghost-btn:hover{background:#141414;}
  .bulk-bar{display:flex; align-items:center; gap:10px; background:#111; border:1px solid #2a2a2a; border-radius:var(--r-card); padding:10px 16px; margin-bottom:12px; font-size:12.5px; animation:fadeInUp .2s ease both;}
  .bulk-bar select{background:#000; color:#fff; border:1px solid #333; border-radius:var(--r-input); padding:6px 10px; font-size:12px;}

  .data-table{width:100%; border-collapse:collapse; background:var(--haze); border-radius:var(--r-card); overflow:hidden; color:var(--ink);}
  .data-table th{text-align:left; font-size:11px; font-weight:700; color:#6b737b; text-transform:uppercase; letter-spacing:.3px; padding:12px 14px; background:#eeeeee; border-bottom:1px solid #e2e2e2;}
  .data-table td{padding:12px 14px; font-size:13px; border-bottom:1px solid #e8e8e8;}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tbody tr{cursor:pointer; transition:background .12s;}
  .data-table tbody tr:hover{background:#ececec;}
  .badge{padding:3px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:700; display:inline-block;}
  .badge.free{background:#e5e7eb; color:#4b5563;}
  .badge.premium{background:#d8f9ee; color:#0e7f5f;}
  .badge.suspended{background:#fde2e0; color:#b23c2f;}
  .row-check{width:16px; height:16px;}

  .drawer-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; animation:fadeInUp .18s ease both;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:400px; max-width:90vw; background:#0c0c0c; border-left:1px solid #262626; z-index:201; padding:22px; overflow-y:auto; animation:fadeInUp .22s ease both;}
  .drawer h3{font-size:17px; font-weight:700; margin-bottom:4px;}
  .drawer-sub{font-size:12.5px; color:var(--text2); margin-bottom:18px;}
  .drawer-field{padding:11px 0; border-bottom:1px solid #1e1e1e; display:flex; justify-content:space-between; font-size:13px;}
  .drawer-field span:first-child{color:var(--text2);}
  .drawer-close-row{display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}

  .anomaly-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #ececec; font-size:12.5px;}
  .anomaly-row:last-child{border-bottom:none;}
  .anomaly-badge{width:22px; height:22px; border-radius:6px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 22px; animation:pulseAlert 2.4s infinite;}

  .toast-wrap{position:fixed; bottom:26px; right:26px; z-index:300; display:flex; flex-direction:column; gap:10px;}
  .toast{background:var(--haze); color:var(--ink); padding:12px 16px; border-radius:var(--r-card); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; animation:fadeInUp .25s ease both;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:250; animation:fadeInUp .18s ease both;}
  .modal-box{width:420px; max-width:90vw; background:#0c0c0c; border:1px solid #262626; border-radius:16px; padding:24px;}
  .modal-box h3{font-size:16.5px; font-weight:700; margin-bottom:14px;}
  .modal-row{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .btn-solid{padding:10px 16px; border-radius:var(--r-btn); font-size:13px; font-weight:700; background:var(--primary); color:#001a13;}

  .spinner{width:14px; height:14px; border:2px solid #33403b; border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}

  @media (max-width:1000px){
    .overview-top{grid-template-columns:1fr;}
    .widget-grid{grid-template-columns:1fr;}
    .global-nav{display:none;}
  }
</style>
</head>
<body>

<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;

const TABS = [

function Sparkline({data, color}){
  const w=100, h=28;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h - ((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg className="stat-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function TrendArea(){
  const w=560, h=200;
  const max = Math.max(...TREND), min = Math.min(...TREND);
  const pts = TREND.map((v,i) => [ (i/(TREND.length-1))*w, h - ((v-min)/(max-min))*(h-20) - 10 ]);
  const line = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="chart-svg-wrap" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#0e7f5f" stopOpacity="0.35"/>
          <stop offset="100%" stopColor="#0e7f5f" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#areaFill)"/>
      <path d={line} fill="none" stroke="#0e7f5f" strokeWidth="2.5"/>
      {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?4:0} fill="#0e7f5f"/>)}
    </svg>
  );
}

function Donut({data, size=110}){
  const total = data.reduce((a,b)=>a+b.value,0);
  let acc = 0;
  const r = size/2 - 10;
  const c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`translate(${size/2},${size/2}) rotate(-90)`}>
        {data.map((d,i) => {
          const frac = d.value/total;
          const dash = frac*c;
          const dasharray = `${dash} ${c-dash}`;
          const offset = -acc*c;
          acc += frac;
          return <circle key={i} r={r} fill="none" stroke={d.color} strokeWidth="16"
            strokeDasharray={dasharray} strokeDashoffset={offset} style={{transition:'stroke-dasharray .6s ease'}}/>;
        })}
      </g>
      <text x="50%" y="50%" textAnchor="middle" dy="5" fontSize="15" fontWeight="800" fill="#1b1b1b">{total}%</text>
    </svg>
  );
}

function Toasts({toasts}){
  return <div className="toast-wrap">{toasts.map(t => <div className="toast" key={t.id}><i data-lucide="check-circle-2" style={{width:15,height:15}}></i>{t.text}</div>)}</div>;
}

      <main className="content">
        {tab === 'overview' && (

            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16}}>
              <div className="section-title" style={{marginBottom:0}}>서비스 운영 개요</div>

            </div>

            <div className="overview-top">
              <div className="hero-card">
                <div className="hero-card-head">
                  <div>
                    <div className="hero-metric-label">이번 {range} 상담 세션</div>
                    <div className="hero-metric-value">3,344{loadingRange ? <span className="spinner" style={{marginLeft:10}}></span> : <span>▲ 12.4%</span>}</div>
                  </div>
                  <button className="ghost-btn" style={{color:'#1b1b1b', borderColor:'#1b1b1b'}} onClick={() => pushToast('상세 세션 로그로 이동합니다')}>상세 보기<i data-lucide="arrow-up-right" style={{width:13,height:13}}></i></button>
                </div>
                <TrendArea/>
              </div>
              <div className="stat-side">
                <div className="stat-card">
                  <div className="stat-top"><span className="stat-label">전체 회원 수</span><span className="stat-icon" style={{background:'#2bffc6'}}><i data-lucide="users" style={{width:14,height:14,color:'#001a13'}}></i></span></div>
                  <div className="stat-value">12,480명</div>
                  <Sparkline data={[20,24,22,30,34,32,40]} color="#0e7f5f"/>
                  <div className="stat-delta">▲ 전주 대비 320명</div>
                </div>
                <div className="stat-card">
                  <div className="stat-top"><span className="stat-label">Premium 구독자</span><span className="stat-icon" style={{background:'#f75745'}}><i data-lucide="crown" style={{width:14,height:14,color:'#fff'}}></i></span></div>
                  <div className="stat-value">3,102명</div>
                  <Sparkline data={[10,12,11,15,14,18,20]} color="#c0392b"/>
                  <div className="stat-delta">▲ 전환율 24.8%</div>
                </div>
                <div className="stat-card">
                  <div className="stat-top"><span className="stat-label">오늘 신규 Memory</span><span className="stat-icon" style={{background:'#426188'}}><i data-lucide="brain-circuit" style={{width:14,height:14,color:'#fff'}}></i></span></div>
                  <div className="stat-value">418건</div>
                  <Sparkline data={[5,8,6,9,12,10,14]} color="#426188"/>
                  <div className="stat-delta">▲ 카테고리 4종 고른 분포</div>
                </div>
              </div>
            </div>

            <div className="widget-grid">
              <div className="widget-card">
                <div className="widget-title"><i data-lucide="pie-chart" style={{width:14,height:14}}></i>구독 등급 분포</div>
                <div className="donut-wrap">
                  <Donut data={[{value:75,color:'#0e7f5f'},{value:25,color:'#e5e7eb'}]}/>
                  <div className="donut-legend">
                    <span><span className="legend-dot" style={{background:'#0e7f5f'}}></span>Premium 25%</span>
                    <span><span className="legend-dot" style={{background:'#e5e7eb'}}></span>무료 75%</span>
                  </div>
                </div>
              </div>
              <div className="widget-card">
                <div className="widget-title"><i data-lucide="bar-chart-3" style={{width:14,height:14}}></i>상담 유형별 세션</div>
                <div className="bar-row">
                  {CONSULT_STATS.map((c,i) => (
                    <div className="bar-col" key={i}>
                      <span className="bar-num">{c.sessions}</span>
                      <div className="bar-fill" style={{height: (c.sessions/1284*100)+'%', background:c.color}}></div>
                      <span className="bar-name">{c.name}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="widget-card">
                <div className="widget-title"><i data-lucide="activity" style={{width:14,height:14}}></i>최근 활동</div>
                <div className="timeline-list">
                  <div className="timeline-item"><span className="timeline-dot" style={{background:'#0e7f5f'}}></span><div><div className="timeline-text">정지호님 Premium 구독 시작</div><div className="timeline-time">3분 전</div></div></div>
                  <div className="timeline-item"><span className="timeline-dot" style={{background:'#c0392b'}}></span><div><div className="timeline-text">최하은님 결제 실패 감지</div><div className="timeline-time">18분 전</div></div></div>
                  <div className="timeline-item"><span className="timeline-dot" style={{background:'#426188'}}></span><div><div className="timeline-text">신규 Memory 32건 저장</div><div className="timeline-time">1시간 전</div></div></div>
                  <div className="timeline-item"><span className="timeline-dot" style={{background:'#0e7f5f'}}></span><div><div className="timeline-text">가족 프로필 14건 신규 등록</div><div className="timeline-time">2시간 전</div></div></div>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {tab === 'users' && (
          <React.Fragment>
            <div className="section-title">회원 & 다중 프로필 관리 콘솔</div>
            <div className="subtab-row">
              {['회원','프로필','구독등급'].map(s => (
                <button key={s} className={"pill-toggle"+(userSubtab===s?" active":"")} onClick={() => setUserSubtab(s)}>{s}</button>
              ))}
            </div>
            <div className="toolbar">
              <input className="search-input" placeholder="이름 또는 이메일 검색…" value={query} onChange={e=>setQuery(e.target.value)}/>
              <button className="ghost-btn" onClick={() => pushToast('회원 목록을 CSV로 내보냅니다')}><i data-lucide="download" style={{width:14,height:14}}></i>내보내기</button>
            </div>
            {selected.length > 0 && (
              <div className="bulk-bar">
                <span>{selected.length}명 선택됨</span>
                <select value={bulkTarget} onChange={e=>setBulkTarget(e.target.value)}>
                  <option value="premium">Premium으로 변경</option>
                  <option value="free">무료로 변경</option>
                  <option value="suspend">계정 정지</option>
                </select>
                <button className="ghost-btn" onClick={() => setBulkOpen(true)}>일괄 적용</button>
                <button className="ghost-btn" onClick={() => setSelected([])}>선택 해제</button>
              </div>
            )}
            <table className="data-table">
              <thead>
                <tr>
                  <th></th><th>이름</th><th>이메일</th><th>등록 프로필</th><th>등급</th><th>최근 상담일</th><th>상태</th>
                </tr>
              </thead>
              <tbody>
                {filteredUsers.map(u => (
                  <tr key={u.id} onClick={() => setDrawerUser(u)}>
                    <td onClick={e=>e.stopPropagation()}><input type="checkbox" className="row-check" checked={selected.includes(u.id)} onChange={()=>toggleSelect(u.id)}/></td>
                    <td style={{fontWeight:700}}>{u.name}</td>
                    <td style={{color:'#6b737b'}}>{u.email}</td>
                    <td>{u.profiles}개</td>
                    <td><span className={"badge "+u.plan}>{u.plan==='premium'?'Premium':'무료'}</span></td>
                    <td>{u.lastConsult}</td>
                    <td><span className={"badge "+(u.status==='정지'?'suspended':'free')}>{u.status}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </React.Fragment>
        )}

        {tab === 'stats' && (
          <React.Fragment>
            <div className="section-title">상담 통계 & Memory 모니터링</div>
            <div className="widget-grid" style={{marginBottom:16}}>
              <div className="widget-card" style={{gridColumn:'span 2'}}>
                <div className="widget-title"><i data-lucide="bar-chart-3" style={{width:14,height:14}}></i>상담가별 세션 수 · 평균 대화 길이</div>
                <div className="bar-row" style={{height:150}}>
                  {CONSULT_STATS.map((c,i) => (
                    <div className="bar-col" key={i} onClick={() => pushToast(c.name + ' 상세 세션 로그로 이동합니다')} style={{cursor:'pointer'}}>
                      <span className="bar-num">{c.sessions} · {c.avg}</span>
                      <div className="bar-fill" style={{height:(c.sessions/1284*100)+'%', background:c.color}}></div>
                      <span className="bar-name">{c.name}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="widget-card">
                <div className="widget-title"><i data-lucide="pie-chart" style={{width:14,height:14}}></i>Memory 카테고리 분포</div>
                <div className="donut-wrap">
                  <Donut data={MEMORY_CATS.map(c=>({value:c.value,color:c.color}))}/>
                  <div className="donut-legend">
                    {MEMORY_CATS.map((c,i)=><span key={i}><span className="legend-dot" style={{background:c.color}}></span>{c.name} {c.value}%</span>)}
                  </div>
                </div>
              </div>
            </div>
            <div className="widget-card">
              <div className="widget-title"><i data-lucide="alert-triangle" style={{width:14,height:14}}></i>이상 급증 감지</div>
              <div className="anomaly-row"><span className="anomaly-badge"><i data-lucide="trending-up" style={{width:12,height:12}}></i></span><span>연애·결혼 상담 세션이 전일 대비 <b>+38%</b> 급증했습니다 — 09.02 09:00 기준</span></div>
              <div className="anomaly-row"><span className="anomaly-badge" style={{background:'#426188'}}><i data-lucide="database" style={{width:12,height:12}}></i></span><span>가족 카테고리 Memory 저장량이 3일 연속 상승세입니다</span></div>
            </div>
          </React.Fragment>
        )}

        {tab === 'sub' && (
          <React.Fragment>
            <div className="section-title">구독 & 결제 현황 관리</div>
            <div className="widget-grid" style={{marginBottom:16}}>
              <div className="widget-card">
                <div className="widget-title"><i data-lucide="pie-chart" style={{width:14,height:14}}></i>구독 등급별 회원 분포</div>
                <div className="donut-wrap">
                  <Donut data={[{value:75,color:'#0e7f5f'},{value:25,color:'#e5e7eb'}]}/>
                  <div className="donut-legend">
                    <span><span className="legend-dot" style={{background:'#0e7f5f'}}></span>Premium 25%</span>
                    <span><span className="legend-dot" style={{background:'#e5e7eb'}}></span>무료 75%</span>
                  </div>
                </div>
              </div>
              <div className="widget-card" style={{gridColumn:'span 2'}}>
                <div className="widget-title"><i data-lucide="calendar-clock" style={{width:14,height:14}}></i>구독 갱신 예정 (7일 이내)</div>
                <div className="timeline-list">
                  {RENEWALS.map((r,i)=>(
                    <div className="timeline-item" key={i}><span className="timeline-dot" style={{background:'#0e7f5f'}}></span><div><div className="timeline-text">{r.name}님 — {r.plan} 구독 갱신</div><div className="timeline-time">{r.date} 예정</div></div></div>
                  ))}
                </div>
              </div>
            </div>
            <div className="subtab-row">
              {['실패','환불'].map(p => <button key={p} className={"pill-toggle"+(payTab===p?" active":"")} onClick={()=>setPayTab(p)}>결제 {p}</button>)}
            </div>
            <table className="data-table">
              <thead><tr><th>회원</th><th>사유</th><th>금액</th><th>일자</th><th></th></tr></thead>
              <tbody>
                {PAY_FAILS.map(p => (
                  <tr key={p.id} onClick={() => pushToast(p.user+'님 결제 상세 로그를 확인합니다')}>
                    <td style={{fontWeight:700}}>{p.user}</td>
                    <td style={{color:'#6b737b'}}>{p.reason}</td>
                    <td>{p.amount}</td>
                    <td>{p.date}</td>
                    <td><span className="badge suspended">{payTab}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </React.Fragment>
        )}
      </main>

      {drawerUser && (
        <React.Fragment>
          <div className="drawer-overlay" onClick={() => setDrawerUser(null)}></div>
          <div className="drawer">
            <h3>{drawerUser.name}</h3>
            <div className="drawer-sub">{drawerUser.email}</div>
            <div className="drawer-field"><span>등록 프로필</span><span>{drawerUser.profiles}개</span></div>
            <div className="drawer-field"><span>회원 등급</span><span className={"badge "+drawerUser.plan}>{drawerUser.plan==='premium'?'Premium':'무료'}</span></div>
            <div className="drawer-field"><span>최근 상담일</span><span>{drawerUser.lastConsult}</span></div>
            <div className="drawer-field"><span>계정 상태</span><span>{drawerUser.status}</span></div>
            <div className="drawer-field"><span>가입일</span><span>2026.02.14</span></div>
            <div className="drawer-close-row">
              <button className="ghost-btn" onClick={() => { pushToast(drawerUser.status==='정지' ? '계정 정지가 해제되었습니다':'계정을 정지 처리했습니다'); setDrawerUser(null); }}>{drawerUser.status==='정지'?'정지 해제':'계정 정지'}</button>
              <button className="btn-solid" onClick={() => setDrawerUser(null)}>닫기</button>
            </div>
          </div>
        </React.Fragment>
      )}

      {bulkOpen && (
        <div className="modal-overlay" onClick={() => setBulkOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>일괄 등급 변경</h3>
            <p style={{fontSize:13, color:'var(--text2)', lineHeight:1.6}}>선택한 {selected.length}명의 회원 등급을 <b style={{color:'#fff'}}>{bulkTarget==='premium'?'Premium':bulkTarget==='free'?'무료':'정지'}</b>(으)로 일괄 변경합니다. 이 작업은 감사 로그에 기록됩니다.</p>
            <div className="modal-row">
              <button className="ghost-btn" onClick={() => setBulkOpen(false)}>취소</button>
              <button className="btn-solid" onClick={applyBulk}>변경 적용</button>
            </div>
          </div>
        </div>
      )}

      <Toasts toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
