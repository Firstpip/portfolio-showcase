<style>
  :root{
    --primary:#000000; --secondary:#d4d4d4; --accent:#2563eb; --deep-sapphire:#1e40af;
    --bg:#ffffff; --surface:#f5f5f5; --text-primary:#000000; --text-secondary:#262626;
    --ash:#e5e5e5; --fog:#737373; --mint:#dcfce7; --mint-text:#16a34a;
    --amber-bg:#fef3c7; --amber-text:#b45309; --rose-bg:#fee2e2; --rose-text:#dc2626;
    --lavender:#7c3aed; --tangerine:#ea580c;
    --radius-card:12px; --radius-btn:8px; --radius-pill:9999px; --radius-input:6px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);}
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:99px;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35);}50%{box-shadow:0 0 0 5px rgba(37,99,235,0);}}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}

  .screen-fade{animation:fadeIn .35s ease;}
  .stat-card{animation:cardIn .4s ease backwards;}
  .stat-card:nth-child(1){animation-delay:.02s;} .stat-card:nth-child(2){animation-delay:.08s;}
  .stat-card:nth-child(3){animation-delay:.14s;} .stat-card:nth-child(4){animation-delay:.2s;}

  .sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;background:var(--bg);border-right:1px solid var(--ash);
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;z-index:20;}
  .sidebar-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 20px;}
  .sidebar-brand .mark{width:26px;height:26px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .sidebar-brand .name{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .env-select{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fog);background:var(--surface);
    border:1px solid var(--ash);border-radius:var(--radius-btn);padding:6px 10px;margin:0 8px 18px;cursor:default;}
  .env-dot{width:6px;height:6px;border-radius:99px;background:var(--mint-text);animation:pulseDot 2s infinite;}
  .sidebar-section{margin-bottom:18px;}
  .sidebar-section-title{font-size:11px;color:var(--fog);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 10px 8px;}
  .nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-btn);
    font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:2px;border:1px solid transparent;
    line-height:1.35;transition:background .15s;}
  .nav-link:hover{background:var(--surface);}
  .nav-link.active{background:#dbeaff;color:var(--deep-sapphire);font-weight:600;}
  .nav-link svg{flex-shrink:0;width:16px;height:16px;}

  .main-wrap{margin-left:246px;flex:1;min-width:0;width:calc(100% - 246px);min-height:100vh;background:var(--bg);}
  .page-inner{max-width:1240px;margin:0 auto;padding:28px 36px 64px;}

  .page-header{margin-bottom:22px;}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:32px;font-weight:600;letter-spacing:-0.015em;margin:0;line-height:1.15;}
  .page-meta{font-size:12px;color:var(--fog);margin-top:6px;}
  .page-actions{display:flex;gap:8px;}

  .btn{font-family:inherit;font-size:13px;font-weight:500;border-radius:var(--radius-btn);padding:9px 15px;
    cursor:pointer;border:1px solid var(--ash);background:#fff;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
  .btn:hover{border-color:var(--secondary);background:var(--surface);}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-primary:hover{background:#171717;}
  .btn-sm{padding:6px 11px;font-size:12px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:16px;}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-label{font-size:12px;color:var(--fog);font-weight:500;}
  .stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .stat-value{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1;margin-bottom:8px;}
  .stat-bottom{display:flex;align-items:center;justify-content:space-between;}
  .stat-delta{font-size:12px;font-weight:600;padding:2px 7px;border-radius:var(--radius-pill);}
  .stat-delta.positive{background:var(--mint);color:var(--mint-text);}
  .stat-delta.warn{background:var(--amber-bg);color:var(--amber-text);}

  .hero-panel{background:#fff;border:1px solid var(--ash);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;}
  .hero-panel-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;position:relative;z-index:1;}
  .hero-title{font-size:32px;font-weight:600;letter-spacing:-0.015em;}
  .hero-sub{font-size:12px;color:var(--fog);margin-top:3px;}
  .hero-legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);}
  .legend-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:5px;}
  .network-art{position:absolute;top:-10px;right:-30px;width:260px;height:180px;opacity:.55;pointer-events:none;}
  .hero-flex{display:grid;grid-template-columns:1fr 258px;gap:14px;margin-bottom:20px;align-items:stretch;}
  .kpi-side{display:flex;flex-direction:column;gap:10px;}

  .widget-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
  .widget-card{background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);padding:16px;}

  .pipeline-dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
  .pipeline-label{font-size:12px;color:var(--text-secondary);flex:1;}
  .pipeline-count{font-size:13px;font-weight:700;}

  .data-section{background:#fff;border:1px solid var(--ash);border-radius:16px;overflow:hidden;}
  .tab-bar{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--ash);}
  .tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--fog);cursor:pointer;border:none;background:none;
    border-bottom:2px solid transparent;font-family:inherit;}
  .tab.active{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600;}
  .data-toolbar{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--ash);flex-wrap:wrap;}
  .search-input{border:1px solid var(--primary);border-radius:var(--radius-input);padding:8px 12px;font-size:13px;

  .filter-chip{border:1px solid var(--ash);background:#fff;border-radius:var(--radius-pill);padding:6px 13px;

  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .spacer{flex:1;}
  .data-table-wrap{overflow-x:auto;}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.data-table thead th{text-align:left;font-size:11px;color:var(--fog);font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;padding:10px 16px;border-bottom:1px solid var(--ash);white-space:nowrap;}

  .cell-strong{color:var(--text-primary);font-weight:600;}

  .badge.on{background:var(--mint);color:var(--mint-text);}
  .badge.pending{background:var(--amber-bg);color:var(--amber-text);}
  .badge.done{background:#e5e5e5;color:var(--text-secondary);}

  .row-more{color:var(--fog);cursor:pointer;background:none;border:none;padding:4px;border-radius:6px;}

  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--ash);background:#fff;border-radius:var(--radius-pill);padding:6px 13px;font-size:12px;

  .review-list{display:flex;flex-direction:column;gap:10px;}
  .review-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ash);border-radius:var(--radius-card);

  .check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--ash);}
  .check-row:last-child{border-bottom:none;}
  .check-ok{color:var(--mint-text);} .check-no{color:var(--rose-text);}

  /* modal / drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fadeIn .18s ease;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:520px;max-width:100%;max-height:86vh;overflow-y:auto;
    animation:slideUp .25s ease;border:1px solid var(--ash);}
  .modal-wide{width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--ash);

  .modal-head h3{font-size:16px;font-weight:600;margin:0;}
  .modal-close{border:none;background:var(--surface);border-radius:99px;width:28px;height:28px;display:flex;

  .modal-body{padding:20px 22px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--ash);}
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}
  .form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--ash);border-radius:var(--radius-input);
    padding:9px 11px;font-size:13px;font-family:inherit;outline:none;}
  .form-field textarea{resize:vertical;min-height:70px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .detail-item{background:var(--surface);border-radius:10px;padding:12px;}
  .detail-item .k{font-size:11px;color:var(--fog);margin-bottom:4px;}
  .detail-item .v{font-size:14px;font-weight:700;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--primary);color:#fff;padding:12px 18px;border-radius:var(--radius-btn);font-size:13px;
    display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.18);}

  .bulk-bar{display:flex;align-items:center;gap:10px;background:#171717;color:#fff;padding:10px 16px;border-radius:10px;
    margin-bottom:12px;animation:slideUp .2s ease;font-size:13px;}
  .checkbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

  @media (max-width:1080px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .widget-grid{grid-template-columns:1fr;}
    .search-layout{grid-template-columns:1fr;}
    .result-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

function Sparkline({data,color}){
  const w=64,h=26,max=Math.max(...data),min=Math.min(...data);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Icon({name,size=16,style}){
  return <i data-lucide={name} style={{width:size,height:size,...style}}></i>;
}

function Toast({items}){
  return (
    <div className="toast-wrap">
      {items.map(t => (
        <div key={t.id} className="toast"><Icon name="check-circle" size={15} />{t.msg}</div>
      ))}
    </div>
  );
}

function Modal({title,onClose,children,wide}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className={'modal'+(wide?' modal-wide':'')} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>

        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function StatusBadge({status}){

  return <span className={'badge '+(map[status]||'pending')}>{status}</span>;
}

          </form>
        </Modal>
      )}
    </div>
  );
}

function CampaignDetailModal({campaign,onClose}){
  if(!campaign) return null;
  const infs = INFLUENCERS.slice(0,campaign.influencers>4?4:campaign.influencers||3);
  return (
    <Modal title={campaign.name} onClose={onClose} wide>
      <div className="detail-grid">
        <div className="detail-item"><div className="k">광고주</div><div className="v">{campaign.advertiser}</div></div>
        <div className="detail-item"><div className="k">상태</div><StatusBadge status={campaign.status} /></div>
        <div className="detail-item"><div className="k">총 예산</div><div className="v">{won(campaign.budget)}</div></div>
        <div className="detail-item"><div className="k">집행 금액</div><div className="v">{won(campaign.used)}</div></div>
      </div>
      <div className="widget-title">참여 인플루언서</div>
      <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
        {infs.map(inf=>(
          <div key={inf.id} className="saved-item">
            <div className="inf-avatar" style={{width:28,height:28}}>
              <img src={`https://source.boringavatars.com/marble/56/${inf.seed}`} alt={inf.name} />
            </div>
            <span>{inf.name}</span>
            <span style={{color:'#737373',marginLeft:'auto'}}>{inf.plat}</span>
          </div>
        ))}
      </div>
    </Modal>
  );
}

/* ---------- Influencer search screen ---------- */
function InfluencerSearch({pushToast}){
  const [cat,setCat] = useState('전체');
  const [region,setRegion] = useState('전체');
  const [minFollowers,setMinFollowers] = useState('전체');
  const [saved,setSaved] = useState(new Set());
  const [compareOpen,setCompareOpen] = useState(false);
  const [detail,setDetail] = useState(null);
  const [checked,setChecked] = useState(new Set());

  const results = useMemo(()=>INFLUENCERS.filter(i=>{
    if(cat!=='전체' && i.cat!==cat) return false;
    if(region!=='전체' && i.region!==region) return false;
    if(minFollowers!=='전체'){
      const min = Number(minFollowers);
      if(i.followers < min) return false;
    }
    return true;
  }),[cat,region,minFollowers]);

  const toggleSave = (id)=>{
    setSaved(prev=>{
      const next = new Set(prev);
      if(next.has(id)){next.delete(id);} else {next.add(id); pushToast('추천 리스트에 저장되었습니다');}
      return next;
    });
  };
  const toggleCheck = (id)=>{
    setChecked(prev=>{const next=new Set(prev); next.has(id)?next.delete(id):next.add(id); return next;});
  };
  const savedList = INFLUENCERS.filter(i=>saved.has(i.id));

  return (
    <div className="screen-fade">
      <div className="page-header">
        <h1 className="page-title">인플루언서 조건 검색 및 추천</h1>
        <div className="page-meta">외부 인플루언서 데이터 API 연동(read-only 조회·가공) 결과를 조건 필터링합니다</div>
      </div>
      <div className="filter-panel">
        <div className="filter-row">
          <div className="field"><label>분야</label>
            <select value={cat} onChange={e=>setCat(e.target.value)}>
              {['전체','뷰티','패션','푸드','라이프스타일'].map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field"><label>지역</label>
            <select value={region} onChange={e=>setRegion(e.target.value)}>
              {['전체','상하이','베이징','광저우','선전','청두','항저우'].map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div className="field"><label>최소 팔로워</label>
            <select value={minFollowers} onChange={e=>setMinFollowers(e.target.value)}>
              {[['전체','전체'],['300000','30만+'],['800000','80만+'],['1500000','150만+']].map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          <button className="btn" onClick={()=>{setCat('전체');setRegion('전체');setMinFollowers('전체');pushToast('필터를 초기화했습니다');}}>초기화</button>
          <button className="btn btn-primary" onClick={()=>pushToast(results.length+'명의 후보를 조회했습니다')}>
            <Icon name="search" size={13} />검색
          </button>
        </div>
        <div className="chip-group">
          {['메가','매크로','마이크로'].map(t=><span key={t} className="tag-pill">{t} 티어</span>)}
        </div>
      </div>
      <div className="search-layout">
        <div className="result-grid">
          {results.map(inf=>(
            <div key={inf.id} className="inf-card" onClick={()=>setDetail(inf)}>
              <div className="inf-top">
                <div className="inf-avatar"><img src={`https://source.boringavatars.com/marble/80/${inf.seed}`} alt={inf.name} /></div>
                <div>
                  <div className="inf-name">{inf.name}</div>
                  <div className="inf-plat">{inf.plat} · {inf.tier}</div>
                </div>
              </div>
              <div className="inf-stats">
                <div className="inf-stat"><b>{(inf.followers/10000).toFixed(0)}만</b><span>팔로워</span></div>
                <div className="inf-stat"><b>{inf.er}%</b><span>참여율</span></div>
                <div className="inf-stat"><b>{inf.prev}</b><span>이전 캠페인</span></div>
              </div>
              <div className="inf-tags">
                <span className="tag-pill">{inf.cat}</span><span className="tag-pill">{inf.region}</span>
              </div>
              <button className={'save-btn'+(saved.has(inf.id)?' saved':'')} onClick={e=>{e.stopPropagation();toggleSave(inf.id);}}>
                <Icon name={saved.has(inf.id)?'bookmark-check':'bookmark'} size={13} />
                {saved.has(inf.id)?'리스트에 저장됨':'리스트에 저장'}
              </button>
            </div>
          ))}
        </div>
        <div className="saved-panel">
          <div className="widget-title">추천 리스트 ({savedList.length})</div>
          {savedList.length===0 ? (
            <div style={{fontSize:'12px',color:'#737373'}}>카드에서 저장 버튼을 눌러 리스트에 추가하세요.</div>
          ) : (
            <div>
              {savedList.map(inf=>(
                <label key={inf.id} className="saved-item">
                  <input type="checkbox" className="checkbox" checked={checked.has(inf.id)} onChange={()=>toggleCheck(inf.id)} />
                  <span>{inf.name}</span>
                  <span style={{marginLeft:'auto',color:'#737373'}}>{inf.plat}</span>
                </label>
              ))}
              <button className="btn btn-primary btn-sm" style={{width:'100%',marginTop:'10px',justifyContent:'center'}}
                disabled={checked.size<2} onClick={()=>setCompareOpen(true)}>
                선택 비교하기 ({checked.size})
              </button>
            </div>
          )}
        </div>
      </div>
      {detail && (
        <Modal title={detail.name} onClose={()=>setDetail(null)}>
          <div className="detail-grid">
            <div className="detail-item"><div className="k">플랫폼</div><div className="v">{detail.plat}</div></div>
            <div className="detail-item"><div className="k">팔로워</div><div className="v">{(detail.followers/10000).toFixed(0)}만</div></div>
            <div className="detail-item"><div className="k">참여율</div><div className="v">{detail.er}%</div></div>
            <div className="detail-item"><div className="k">이전 캠페인</div><div className="v">{detail.prev}건</div></div>
          </div>
          <div className="widget-title">이전 캠페인 참여율 추이</div>
          <ResponsiveContainer width="100%" height={120}>
            <AreaChart data={[3.1,3.8,4.2,3.9,detail.er].map((v,i)=>({x:i+1,v}))} margin={{left:-20}}>
              <XAxis dataKey="x" hide /><YAxis hide />
              <Tooltip />
              <Area type="monotone" dataKey="v" stroke="#2563eb" fill="#dbeaff" />
            </AreaChart>
          </ResponsiveContainer>
        </Modal>
      )}
      {compareOpen && (
        <Modal title="인플루언서 비교" onClose={()=>setCompareOpen(false)} wide>
          <table className="data-table">
            <thead>
              <tr><th>이름</th><th>플랫폼</th><th>팔로워</th><th>참여율</th><th>이전 캠페인</th></tr>
            </thead>
            <tbody>
              {INFLUENCERS.filter(i=>checked.has(i.id)).map(i=>(
                <tr key={i.id}>
                  <td className="cell-strong">{i.name}</td><td>{i.plat}</td>
                  <td>{(i.followers/10000).toFixed(0)}만</td><td>{i.er}%</td><td>{i.prev}건</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Content review screen ---------- */
function ContentReview({pushToast}){
  const [tab,setTab] = useState('전체');
  const [items,setItems] = useState(CONTENTS);
  const [open,setOpen] = useState(null);
  const [feedback,setFeedback] = useState('');

  const filtered = tab==='전체' ? items : items.filter(i=>i.status===tab);

  const requestEdit = ()=>{
    if(!feedback.trim()){pushToast('피드백을 입력해 주세요');return;}
    setItems(prev=>prev.map(i=>i.id===open.id?{...i,status:'수정요청'}:i));
    setOpen(null); setFeedback('');
    pushToast('수정 요청을 전달했습니다');
  };
  const approve = ()=>{
    setItems(prev=>prev.map(i=>i.id===open.id?{...i,status:'최종승인'}:i));
    setOpen(null); setFeedback('');
    pushToast('콘텐츠를 최종 승인했습니다');
  };
  const canApprove = open && open.mention && open.hashtag && open.phrase;

  return (
    <div className="screen-fade">
      <div className="page-header">
        <h1 className="page-title">콘텐츠 검수 워크플로우</h1>
        <div className="page-meta">초안등록 → 수정요청 → 최종승인 상태를 상태머신으로 관리합니다</div>
      </div>
      <div className="data-section">
        <div className="tab-bar">
          {['전체','초안등록','검수중','수정요청','최종승인'].map(t=>(
            <button key={t} className={'tab'+(tab===t?' active':'')} onClick={()=>setTab(t)} data-tab={t}>{t}</button>
          ))}
        </div>
        <div style={{padding:'16px'}}>
          <div className="review-list">
            {filtered.map(c=>(
              <div key={c.id} className="review-row" onClick={()=>setOpen(c)}>
                <div className="review-thumb"><img src={`https://picsum.photos/seed/china-influencer-saas-${c.seed}/120/120`} alt={c.type} /></div>
                <div className="review-main">
                  <div className="review-title">{c.inf} · {c.type}</div>
                  <div className="review-sub">{c.camp} · {c.date} 제출</div>
                </div>
                <StatusBadge status={c.status} />
                <Icon name="chevron-right" size={16} style={{color:'#a3a3a3'}} />
              </div>
            ))}
          </div>
        </div>
      </div>
      {open && (
        <Modal title={open.inf+' 콘텐츠 검수'} onClose={()=>setOpen(null)}>
          <img src={`https://picsum.photos/seed/china-influencer-saas-${open.seed}/480/240`}
            style={{width:'100%',borderRadius:'10px',marginBottom:'14px'}} alt={open.type} />
          <div style={{marginBottom:'14px'}}>
            <div className="check-row">
              <Icon name={open.mention?'check-circle':'x-circle'} size={15} className={open.mention?'check-ok':'check-no'} />
              <span>필수 멘션 포함</span>
            </div>
            <div className="check-row">
              <Icon name={open.hashtag?'check-circle':'x-circle'} size={15} className={open.hashtag?'check-ok':'check-no'} />
              <span>필수 해시태그 포함</span>
            </div>
            <div className="check-row">
              <Icon name={open.phrase?'check-circle':'x-circle'} size={15} className={open.phrase?'check-ok':'check-no'} />
              <span>필수 문구 포함</span>
            </div>
          </div>
          <div className="form-field">
            <label>피드백 메모</label>
            <textarea value={feedback} onChange={e=>setFeedback(e.target.value)} placeholder="수정이 필요한 부분을 남겨주세요"></textarea>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
            <button className="btn" onClick={requestEdit}>수정 요청</button>
            <button className="btn btn-primary" disabled={!canApprove} onClick={approve}>최종 승인</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Settlement screen ---------- */
function Settlement({pushToast}){
  const [rows,setRows] = useState(SETTLE);
  const [selected,setSelected] = useState(new Set());

  const totalBudget = CAMPAIGNS.reduce((s,c)=>s+c.budget,0);
  const totalUsed = CAMPAIGNS.reduce((s,c)=>s+c.used,0);
  const pendingCount = rows.filter(r=>r.status==='정산예정').length;
  const doneCount = rows.filter(r=>r.status==='정산완료').length;

  const toggle = (id)=>{
    setSelected(prev=>{const next=new Set(prev); next.has(id)?next.delete(id):next.add(id); return next;});
  };
  const bulkComplete = ()=>{
    setRows(prev=>prev.map(r=>selected.has(r.id)?{...r,status:'정산완료',progress:r.unit}:r));
    pushToast(selected.size+'건을 정산완료로 일괄 처리했습니다');
    setSelected(new Set());
  };

  return (
    <div className="screen-fade">
      <div className="page-header">
        <h1 className="page-title">캠페인 예산 및 정산 관리</h1>
        <div className="page-meta">단가 설정·예산 차감·정산 기록을 트랜잭션으로 묶어 정합성을 보장합니다</div>
      </div>
      <div className="stat-row">
        <div className="stat-card"><div className="stat-label">총 예산</div><div className="stat-value">{Math.round(totalBudget/10000)}만</div></div>
        <div className="stat-card"><div className="stat-label">집행액</div><div className="stat-value">{Math.round(totalUsed/10000)}만</div></div>
        <div className="stat-card"><div className="stat-label">정산 예정</div><div className="stat-value">{pendingCount}건</div></div>
        <div className="stat-card"><div className="stat-label">정산 완료</div><div className="stat-value">{doneCount}건</div></div>
      </div>
      {selected.size>0 && (
        <div className="bulk-bar">
          <Icon name="check-square" size={15} />
          <span>{selected.size}건 선택됨</span>
          <button className="btn btn-sm" style={{marginLeft:'auto',background:'#fff'}} onClick={bulkComplete}>선택 정산완료 처리</button>
        </div>
      )}
      <div className="data-section">
        <div className="data-table-wrap">
          <table className="data-table">
            <thead>
              <tr>
                <th></th><th>인플루언서</th><th>캠페인</th>
                <th>단가</th><th>진행 금액</th>
                <th>정산 상태</th><th>정산 예정일</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r=>(
                <tr key={r.id} onClick={()=>toggle(r.id)}>
                  <td><input type="checkbox" className="checkbox" checked={selected.has(r.id)}
                    onChange={()=>toggle(r.id)} onClick={e=>e.stopPropagation()} /></td>
                  <td className="cell-strong">{r.inf}</td>
                  <td>{r.camp}</td>
                  <td>{won(r.unit)}</td>
                  <td>{won(r.progress)}</td>
                  <td><StatusBadge status={r.status} /></td>
                  <td>{r.date}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App(){
  const [screen,setScreen] = useState('main');
  const [campaign,setCampaign] = useState(null);
  const [toasts,setToasts] = useState([]);

  const pushToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  };

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  const screens = {
    main: <Dashboard onOpenCampaign={setCampaign} pushToast={pushToast} />,
    'influencer-search': <InfluencerSearch pushToast={pushToast} />,
    'content-review': <ContentReview pushToast={pushToast} />,
    settlement: <Settlement pushToast={pushToast} />,
  };

  return (
    <div data-archetype="stripe-multipane" style={{display:'flex',width:'100%',minHeight:'100vh'}}>
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="main-wrap">
        <div className="page-inner">{screens[screen]}</div>
      </main>
      {campaign && <CampaignDetailModal campaign={campaign} onClose={()=>setCampaign(null)} />}
      <Toast items={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
