<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

<style>
  :root{
    --primary:#d4c7ff; --secondary:#e3e3e2; --accent:#f6bc1e; --violet:#714cb6;
    --bg:#f2f0eb; --surface:#ffffff; --text-primary:#292827; --text-secondary:#666666;
    --lagoon:#0c4243; --mint:#dcfce7; --mint-text:#0f7a4a; --rose-bg:#fde3e3; --rose-text:#b3261e;
    --radius-card:16px; --radius-btn:16px; --radius-sm-btn:8px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);}
  #root{width:100%;}
  ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:99px;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes floatCard{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes glowPulse{0%,100%{opacity:.55;}50%{opacity:1;}}

  .screen-fade{animation:fadeIn .35s ease;}
  .kcard{animation:cardPop .35s ease backwards;}

  .topnav{width:100%;background:rgba(242,240,235,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--secondary);
    position:sticky;top:0;z-index:30;}
  .topnav-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:26px;padding:0 32px;height:64px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-0.01em;flex-shrink:0;}
  .brand .mark{width:28px;height:28px;border-radius:9px;background:var(--lagoon);display:flex;align-items:center;justify-content:center;color:#fff;}
  .tabs{display:flex;gap:6px;flex:1;}
  .tabbtn{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:var(--text-primary);
    padding:9px 14px;border-radius:var(--radius-sm-btn);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .tabbtn:hover{background:rgba(0,0,0,.045);}
  .tabbtn.active{background:var(--primary);color:#3a2a63;font-weight:700;}
  .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

  .btn{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:var(--radius-sm-btn);padding:9px 15px;
    cursor:pointer;border:1px solid var(--text-primary);background:var(--primary);color:#3a2a63;display:inline-flex;
    align-items:center;gap:6px;transition:transform .12s;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--accent);border-color:var(--accent);color:#3a2a08;}
  .btn-ghost{background:transparent;border-color:var(--secondary);color:var(--text-primary);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}

  .page-inner{max-width:1320px;margin:0 auto;padding:0 32px 64px;}

  .hero-band{width:100%;position:relative;overflow:hidden;padding:34px 0 26px;
    background:
      radial-gradient(circle at 18% 30%, rgba(212,199,255,.55) 0%, transparent 55%),
      radial-gradient(circle at 82% 20%, rgba(246,188,30,.35) 0%, transparent 50%),
      radial-gradient(circle at 55% 90%, rgba(12,66,67,.18) 0%, transparent 55%);
  }
  .hero-band::before{content:'';position:absolute;inset:0;opacity:.55;animation:glowPulse 6s ease-in-out infinite;
    background:radial-gradient(circle at 70% 60%, rgba(113,76,182,.15), transparent 60%);}
  .hero-band-inner{position:relative;max-width:1320px;margin:0 auto;padding:0 32px;display:flex;
    align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .hero-title{font-size:34px;font-weight:600;letter-spacing:-0.015em;margin:0 0 6px;line-height:1.15;}
  .hero-sub{font-size:14px;color:var(--text-secondary);max-width:520px;}
  .hero-stats{display:flex;gap:14px;}
  .hero-stat{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.5);border-radius:var(--radius-card);
    padding:14px 18px;min-width:110px;animation:floatCard 5s ease-in-out infinite;}
  .hero-stat:nth-child(2){animation-delay:.6s;} .hero-stat:nth-child(3){animation-delay:1.2s;}
  .hero-stat b{display:block;font-size:24px;font-weight:700;}
  .hero-stat span{font-size:11px;color:var(--text-secondary);}

  .section-title{font-size:19px;font-weight:700;margin:28px 0 14px;}
  .section-sub{font-size:12.5px;color:var(--text-secondary);margin-top:-10px;margin-bottom:16px;}

  .board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-input{border:1px solid var(--secondary);border-radius:var(--radius-sm-btn);padding:9px 13px;font-size:13px;
    font-family:inherit;width:230px;background:var(--surface);outline:none;}
  .filter-chip{border:1px solid var(--secondary);background:var(--surface);border-radius:var(--radius-pill);
    padding:7px 14px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
  .filter-chip.active{background:var(--primary);border-color:var(--primary);color:#3a2a63;font-weight:600;}

  .board-layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:flex-start;}
  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
  .column{flex:0 0 268px;background:rgba(255,255,255,.55);border:1px solid var(--secondary);border-radius:var(--radius-card);padding:12px;}
  .col-header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px;font-size:13.5px;font-weight:700;}
  .count{background:var(--surface);border:1px solid var(--secondary);border-radius:var(--radius-pill);
    font-size:11px;font-weight:700;padding:2px 9px;color:var(--text-secondary);}
  .card{background:var(--surface);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;
    border:1px solid rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s;}
  .card:hover{box-shadow:0 10px 24px rgba(41,40,39,.1);transform:translateY(-2px);}
  .card-title{font-size:13px;font-weight:700;margin-bottom:4px;}
  .card-sub{font-size:11.5px;color:var(--text-secondary);margin-bottom:9px;}
  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);}
  .tag.beauty{background:#fde3ee;color:#b3266e;} .tag.food{background:#fef0d8;color:#9a6300;}
  .tag.fashion{background:#e6e0ff;color:#5b3fae;} .tag.life{background:#dff3ea;color:#0f7a4a;}
  .avatar{width:22px;height:22px;border-radius:99px;overflow:hidden;margin-left:auto;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .priority{width:7px;height:7px;border-radius:99px;flex-shrink:0;}
  .priority.high{background:#e2534a;} .priority.mid{background:var(--accent);} .priority.low{background:#8fb996;}

  .matrix-panel{background:var(--surface);border:1px solid var(--secondary);border-radius:var(--radius-card);
    padding:18px;position:sticky;top:82px;}
  .matrix-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .matrix-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--secondary);font-size:12.5px;}
  .matrix-row:last-child{border-bottom:none;}
  .matrix-label{flex:1;color:var(--text-secondary);}
  .matrix-count{font-weight:700;}
  .filter-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}

  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .panel{background:var(--surface);border:1px solid var(--secondary);border-radius:var(--radius-card);padding:18px;}
  .panel-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .kpi-card{background:var(--surface);border:1px solid var(--secondary);border-radius:var(--radius-card);padding:16px;}
  .kpi-label{font-size:12px;color:var(--text-secondary);margin-bottom:8px;}
  .kpi-value{font-size:28px;font-weight:700;letter-spacing:-0.01em;}
  .kpi-delta{font-size:11.5px;font-weight:600;color:var(--mint-text);margin-top:6px;}

  .cmp-list{display:flex;flex-direction:column;gap:10px;}
  .cmp-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--secondary);}
  .cmp-row:last-child{border-bottom:none;}
  .cmp-name{flex:1;font-size:13px;font-weight:600;}
  .cmp-num{font-size:13px;color:var(--text-secondary);width:70px;text-align:right;}

  .settle-list{display:flex;flex-direction:column;gap:10px;}
  .settle-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--secondary);

  .settle-name{font-size:13.5px;font-weight:700;}
  .settle-sub{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
  .settle-amt{font-size:14px;font-weight:700;margin-left:auto;}
  .status-badge{font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-pill);}

  .status-badge.fail{background:var(--rose-bg);color:var(--rose-text);}
  .checkbox{width:16px;height:16px;accent-color:var(--violet);cursor:pointer;}
  .bulk-bar{display:flex;align-items:center;gap:10px;background:var(--lagoon);color:#fff;padding:12px 18px;
    border-radius:var(--radius-card);margin-bottom:14px;font-size:13px;animation:slideUp .2s ease;}
  .progress-track{width:100%;height:8px;background:var(--secondary);border-radius:99px;overflow:hidden;margin:14px 0;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--accent));border-radius:99px;transition:width .8s ease;}
  .invoice-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--secondary);
    border-radius:14px;padding:13px 15px;margin-bottom:8px;animation:cardPop .3s ease backwards;}

  .admin-table{width:100%;border-collapse:collapse;font-size:13px;}
  .admin-table thead th{text-align:left;font-size:11px;color:var(--text-secondary);font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;padding:11px 14px;border-bottom:1px solid var(--secondary);}
  .admin-table tbody td{padding:13px 14px;border-bottom:1px solid var(--secondary);}
  .admin-table tbody tr:last-child td{border-bottom:none;}
  .role-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);background:var(--primary);color:#3a2a63;}
  .kv-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--secondary);}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{font-size:13px;font-weight:600;}
  .kv-desc{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
  .toggle{width:40px;height:22px;border-radius:99px;background:var(--secondary);position:relative;cursor:pointer;
    border:none;flex-shrink:0;}
  .toggle.on{background:var(--violet);}
  .toggle span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;
    transition:transform .18s ease;}
  .toggle.on span{transform:translateX(18px);}

  .overlay{position:fixed;inset:0;background:rgba(41,40,39,.45);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fadeIn .18s ease;padding:20px;}
  .modal{background:var(--surface);border-radius:20px;width:540px;max-width:100%;max-height:86vh;overflow-y:auto;
    animation:slideUp .25s ease;border:1px solid var(--secondary);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--secondary);
    position:sticky;top:0;background:var(--surface);}
  .modal-head h3{font-size:17px;font-weight:700;margin:0;}
  .modal-close{border:none;background:var(--bg);border-radius:99px;width:30px;height:30px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;color:var(--text-secondary);}
  .modal-body{padding:22px 24px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .detail-item{background:var(--bg);border-radius:12px;padding:12px;}
  .detail-item .k{font-size:11px;color:var(--text-secondary);margin-bottom:4px;}
  .detail-item .v{font-size:15px;font-weight:700;}
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:5px;}
  .form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--secondary);
    border-radius:var(--radius-sm-btn);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
  .form-field textarea{resize:vertical;min-height:70px;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--lagoon);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;
    display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.2);}

  @media (max-width:1100px){
    .board-layout{grid-template-columns:1fr;}
    .rgrid{grid-template-columns:1fr;}
    .kpi-strip{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

  {id:'st2',label:'정산 완료 알림',desc:'정산 배치 처리 완료 시 담당자에게 알림 발송',on:true},
  {id:'st3',label:'API 응답 지연 경고',desc:'외부 인플루언서 데이터 API 응답이 3초를 초과하면 경고 표시',on:false},
];

function Toast({items}){

    <div className="toast-wrap">
      {items.map(t=>(

}
function Modal({title,onClose,children,wide}){

    <div className="overlay" onClick={onClose}>

/* ---------- Main: Pipeline board ---------- */
function PipelineBoard({pushToast}){
  const [items,setItems] = useState(PIPELINE);
  const [catFilter,setCatFilter] = useState('전체');
  const [q,setQ] = useState('');
  const [open,setOpen] = useState(null);

  const visible = useMemo(()=>items.filter(i=>{
    if(catFilter!=='전체' && i.catL!==catFilter) return false;
    if(q && !i.title.includes(q) && !i.inf.includes(q)) return false;
    return true;
  }),[items,catFilter,q]);

  const advance = (item)=>{
    const idx = COLUMNS.indexOf(item.col);
    if(idx>=COLUMNS.length-1){ pushToast('이미 마지막 단계입니다'); return; }
    setItems(prev=>prev.map(i=>i.id===item.id?{...i,col:COLUMNS[idx+1]}:i));
    pushToast(item.inf+' 카드가 '+COLUMNS[idx+1]+'(으)로 이동했습니다');
    setOpen(null);
  };

  const highCount = items.filter(i=>i.pri==='high').length;
  const midCount = items.filter(i=>i.pri==='mid').length;
  const lowCount = items.filter(i=>i.pri==='low').length;

  return (
    <div className="screen-fade page-inner">
      <div className="section-title">전체 캠페인 인플루언서 파이프라인</div>
      <div className="section-sub">다중 캠페인의 인플루언서를 단일 보드로 통합해 클릭으로 단계 전환합니다</div>
      <div className="board-toolbar">
        <input className="search-input" placeholder="인플루언서 또는 캠페인 검색…" value={q} onChange={e=>setQ(e.target.value)} />
        {['전체','뷰티','패션','푸드','라이프'].map(c=>(
          <button key={c} className={'filter-chip'+(catFilter===c?' active':'')} onClick={()=>setCatFilter(c)}>{c}</button>
        ))}
        <button className="btn btn-gold btn-sm" style={{marginLeft:'auto'}} onClick={()=>pushToast('신규 파이프라인 항목을 등록했습니다')}>
          <Icon name="plus" size={14} />새 항목
        </button>
      </div>
      <div className="board-layout">
        <div className="board">
          {COLUMNS.map(col=>{
            const colItems = visible.filter(i=>i.col===col);
            return (
              <section className="column" key={col}>
                <div className="col-header">
                  <span>{col}</span>
                  <span className="count">{colItems.length}</span>
                </div>
                {colItems.map((it,idx)=>(
                  <div className="card kcard" key={it.id} style={{animationDelay:(idx*0.03)+'s'}} onClick={()=>setOpen(it)}>
                    <div className="card-title">{it.title}</div>
                    <div className="card-sub">{it.inf} · {it.due}</div>
                    <div className="card-meta">
                      <span className={'priority '+it.pri}></span>
                      <span className={'tag '+it.cat}>{it.catL}</span>
                      <div className="avatar"><img src={`https://source.boringavatars.com/marble/44/${it.seed}`} alt={it.inf} /></div>
                    </div>
                  </div>
                ))}
              </section>
            );
          })}
        </div>
        <div className="matrix-panel">
          <div className="matrix-title">우선순위 매트릭스</div>
          <div className="matrix-row"><span className="priority high"></span>
            <span className="matrix-label">긴급 · 마감 임박</span><span className="matrix-count">{highCount}</span></div>
          <div className="matrix-row"><span className="priority mid"></span>
            <span className="matrix-label">중요 · 일반 진행</span><span className="matrix-count">{midCount}</span></div>
          <div className="matrix-row"><span className="priority low"></span>
            <span className="matrix-label">여유 · 게시 완료</span><span className="matrix-count">{lowCount}</span></div>
          <div className="matrix-title" style={{marginTop:'18px'}}>캠페인별 필터</div>
          <div className="filter-list">
            {['루미네뷰티','스텔라푸드','옐로우문','테라핏'].map(c=>(
              <div key={c} className="matrix-row">
                <span className="matrix-label">{c}</span>
                <span className="matrix-count">{items.filter(i=>i.camp===c).length}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      {open && (
        <Modal title={open.title} onClose={()=>setOpen(null)}>
          <div className="detail-grid">
            <div className="detail-item"><div className="k">담당 인플루언서</div><div className="v">{open.inf}</div></div>
            <div className="detail-item"><div className="k">캠페인</div><div className="v">{open.camp}</div></div>
            <div className="detail-item"><div className="k">현재 단계</div><div className="v">{open.col}</div></div>
            <div className="detail-item"><div className="k">마감</div><div className="v">{open.due}</div></div>
          </div>
          <button className="btn btn-gold" style={{width:'100%',justifyContent:'center'}} onClick={()=>advance(open)}>
            <Icon name="arrow-right" size={14} />다음 단계로 이동
          </button>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Settlement automation ---------- */
function SettlementAutomation({pushToast}){
  const [items,setItems] = useState(INVOICES);
  const [selected,setSelected] = useState(new Set());
  const [running,setRunning] = useState(false);
  const [progress,setProgress] = useState(0);
  const [done,setDone] = useState([]);

  const toggle = id => setSelected(prev=>{const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;});

  const runBatch = ()=>{
    if(selected.size===0){pushToast('정산 대상을 먼저 선택하세요');return;}
    setRunning(true); setProgress(0);
    const targets = items.filter(i=>selected.has(i.id) && i.status==='대기');
    let p=0;
    const timer = setInterval(()=>{
      p += 20;
      setProgress(Math.min(100,p));
      if(p>=100){
        clearInterval(timer);
        setItems(prev=>prev.map(i=>selected.has(i.id) && i.status==='대기'?{...i,status:'완료'}:i));
        setDone(targets);
        setRunning(false);
        pushToast(targets.length+'건의 인보이스가 자동 생성되었습니다');
        setSelected(new Set());
      }
    },260);
  };

  return (
    <div className="screen-fade page-inner">
      <div className="section-title">정산 자동화 및 인보이스 관리</div>
      <div className="section-sub">Bull Queue 기반 배치 정산과 jsPDF 인보이스 자동 생성을 시뮬레이션합니다</div>
      {selected.size>0 && (
        <div className="bulk-bar">
          <Icon name="check-square-offset" size={16} />
          <span>{selected.size}건 선택됨</span>
          <button className="btn btn-gold btn-sm" style={{marginLeft:'auto'}} onClick={runBatch} disabled={running}>
            {running?'처리 중…':'일괄 배치 정산 실행'}
          </button>
        </div>
      )}
      {running && (
        <div className="panel" style={{marginBottom:'16px'}}>
          <div className="panel-title">배치 정산 진행 중</div>
          <div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}></div></div>
          <div style={{fontSize:'12px',color:'var(--text-secondary)'}}>{progress}% 완료 · 실패 건은 자동으로 재처리 큐에 표시됩니다</div>
        </div>
      )}
      <div className="settle-list">
        {items.map(i=>(
          <div className="settle-row" key={i.id}>
            {i.status==='대기' ? (
              <input type="checkbox" className="checkbox" checked={selected.has(i.id)} onChange={()=>toggle(i.id)} />
            ) : (
              <Icon name={i.status==='완료'?'check-circle':'warning-circle'} size={18}
                style={{color:i.status==='완료'?'#0f7a4a':'#b3261e'}} />
            )}
            <div>
              <div className="settle-name">{i.inf}</div>
              <div className="settle-sub">{i.camp}</div>
            </div>
            <span className="settle-amt">{won(i.amount)}</span>
            <span className={'status-badge '+(i.status==='완료'?'done':i.status==='실패'?'fail':'wait')}>{i.status}</span>
          </div>
        ))}
      </div>
      {done.length>0 && (
        <div className="panel" style={{marginTop:'20px'}}>
          <div className="panel-title">생성된 인보이스</div>
          {done.map(d=>(
            <div className="invoice-card" key={d.id}>
              <Icon name="file-pdf" size={22} style={{color:'#b3261e'}} />
              <div style={{flex:1}}>
                <div className="settle-name">{d.inf} 인보이스</div>
                <div className="settle-sub">{won(d.amount)} · {d.camp}</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={()=>pushToast('인보이스 PDF를 다운로드합니다')}>
                <Icon name="download-simple" size={13} />다운로드
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

        <div className="kpi-card"><div className="kpi-label">이번 달 정산액</div><div className="kpi-value">682만</div></div>

      <div className="rgrid">
        <div className="panel">
          <div className="panel-title">사용자 및 권한</div>
          <table className="admin-table">
            <thead><tr><th>이름</th><th>권한</th><th>최근 접속</th></tr></thead>
            <tbody>
              {ADMINS.map(a=>(

              <button className={'toggle'+(s.on?' on':'')} onClick={()=>toggle(s.id)}><span></span></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App(){
  const [screen,setScreen] = useState('main');
  const [toasts,setToasts] = useState([]);
  const pushToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);
  };

  const screens = {
    main: <PipelineBoard pushToast={pushToast} />,
    'performance-report': <PerformanceReport pushToast={pushToast} />,
    'settlement-automation': <SettlementAutomation pushToast={pushToast} />,
    'admin-console': <AdminConsole pushToast={pushToast} />,
  };

  return (
    <div data-archetype="kanban-board" style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <TopNav screen={screen} setScreen={setScreen} />
      {screen==='main' && (
        <div className="hero-band">
          <div className="hero-band-inner">
            <div>
              <h1 className="hero-title">크리에이터 캠페인 통합 매니지먼트</h1>
              <p className="hero-sub">MVP 이후 전체 캠페인의 인플루언서 진행상태를 하나의 파이프라인 보드로 운영하고, 성과·정산·관리자 기능까지 확장합니다.</p>
            </div>
            <div className="hero-stats">
              <div className="hero-stat"><b>13</b><span>진행 중 항목</span></div>
              <div className="hero-stat"><b>4</b><span>파이프라인 단계</span></div>
              <div className="hero-stat"><b>96.4만</b><span>누적 도달</span></div>
            </div>
          </div>
        </div>
      )}
      <main style={{flex:1,width:'100%'}}>{screens[screen]}</main>
      <Toast items={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
