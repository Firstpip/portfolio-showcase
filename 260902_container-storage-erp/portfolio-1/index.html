<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웨어박스 ERP — 컨테이너 보관 통합 운영 시스템</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#fa5d00; --primary-dark:#d94f00; --secondary:#c0bbb6; --accent:#1ef6da;
    --bg:#fff8f1; --surface:#ffffff; --text:#1d1e1c; --text-2:#615f5c;
    --border:#e5ddd3; --marigold:#fee3b5; --shadow-card: rgba(250,166,0,0.16) 6px 4px 24px 0px;
    --shadow-btn: rgba(0,0,0,0.18) 0px 1px 4px 0px;
    --r-card:20px; --r-btn:16px; --r-input:16px; --r-tag:999px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    letter-spacing:0.1px;
  }
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}
  button{font-family:inherit;cursor:pointer;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  input,select,textarea{font-family:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes cardStagger{from{opacity:0;transform:translateY(14px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toastSlide{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(250,93,0,0.35);}50%{box-shadow:0 0 0 6px rgba(250,93,0,0);}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}

  .app-shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--surface);
    border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;
  }
  .sidebar-brand{padding:22px 22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .sidebar-brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#ff8b4d);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .sidebar-brand .name{font-weight:700;font-size:16px;letter-spacing:0.36px;}
  .sidebar-brand .sub{font-size:11px;color:var(--text-2);}
  .nav-group{padding:16px 12px;flex:1;overflow-y:auto;}
  .nav-label{font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;padding:10px 12px 6px;}
  .nav-item{
    width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:none;
    background:transparent;color:var(--text-2);font-size:14.5px;font-weight:500;margin-bottom:3px;text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{background:var(--marigold);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-btn);}
  .nav-item .badge-count{margin-left:auto;background:rgba(0,0,0,0.08);color:inherit;font-size:11px;padding:1px 7px;border-radius:999px;}
  .nav-item.active .badge-count{background:rgba(255,255,255,0.25);}
  .sidebar-footer{padding:16px;border-top:1px solid var(--border);}
  .user-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .user-chip .u-name{font-size:13px;font-weight:600;}
  .user-chip .u-role{font-size:11px;color:var(--text-2);}

  .main-wrap{margin-left:248px;flex:1;min-width:0;width:calc(100% - 248px);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 32px;
    background:rgba(255,248,241,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  }
  .search-box{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--secondary);border-radius:var(--r-input);padding:9px 14px;color:var(--text-2);}
  .search-box input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--text);}
  .topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;}
  .icon-btn:hover{background:var(--marigold);color:var(--text);}
  .dot-alert{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulseDot 1.8s infinite;}
  .btn-primary{
    display:flex;align-items:center;gap:7px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-btn);
    padding:11px 18px;font-size:13.5px;font-weight:600;letter-spacing:0.015em;box-shadow:var(--shadow-btn);transition:filter .15s, transform .12s;
  }
  .btn-primary:hover{filter:brightness(0.92);transform:translateY(-1px);}
  .btn-ghost{background:transparent;border:1px solid var(--secondary);color:var(--text);border-radius:var(--r-btn);padding:10px 16px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:var(--marigold);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}

  .content{padding:28px 32px 60px;width:100%;animation:fadeInUp .35s ease;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .page-head h1{font-size:38px;font-weight:700;letter-spacing:0.42px;margin:0 0 6px;}
  .page-head p{margin:0;color:var(--text-2);font-size:14px;max-width:560px;line-height:1.5;}
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}

  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .quick-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;
    text-align:left;box-shadow:var(--shadow-card);animation:cardStagger .4s ease both;transition:transform .18s, box-shadow .18s;
  }
  .quick-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(250,93,0,0.18);}
  .quick-card .qc-icon{width:38px;height:38px;border-radius:11px;background:var(--marigold);display:flex;align-items:center;justify-content:center;color:var(--primary);margin-bottom:12px;}
  .quick-card h3{font-size:14.5px;font-weight:700;margin:0 0 6px;line-height:1.4;}
  .quick-card p{font-size:12.5px;color:var(--text-2);margin:0;line-height:1.45;}

  .split{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:flex-start;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden;}
  .panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:16px;margin:0 0 10px;font-weight:700;}
  .tab-row{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;}
  .tab-chip{flex:1;padding:7px 0;text-align:center;border-radius:9px;border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--text-2);}
  .tab-chip.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .list-rail-body{max-height:640px;overflow-y:auto;}
  .list-row{width:100%;text-align:left;padding:14px 20px;border:none;border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;}
  .list-row:hover{background:var(--marigold);}
  .list-row.active{background:#fff2e2;border-left:3px solid var(--primary);}
  .list-row-top{display:flex;justify-content:space-between;align-items:center;}
  .list-row-top .lr-name{font-size:14px;font-weight:700;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:0.2px;}
  .badge.type-corp{background:#e3ecff;color:#2451c9;}
  .badge.type-personal{background:#fdeee0;color:var(--primary-dark);}
  .badge.type-court{background:#f1e6ff;color:#7a2fd6;}
  .badge.status-normal{background:#e3f7ea;color:#1f8a4c;}
  .badge.status-overdue{background:#fde3e3;color:#c92a2a;}
  .badge.status-ending{background:#f0f0ef;color:var(--text-2);}
  .lr-meta{font-size:11.5px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;}

  .detail-panel{padding:24px 28px;}
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .detail-title{display:flex;align-items:center;gap:12px;}
  .detail-title .dt-avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#ffb98a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;}
  .detail-title h2{font-size:19px;margin:0 0 4px;}
  .detail-title .dt-sub{font-size:12.5px;color:var(--text-2);}
  .detail-actions{display:flex;gap:8px;}

  .stepper{display:flex;align-items:center;gap:6px;margin:18px 0 24px;}
  .step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg);color:var(--text-2);border:2px solid var(--border);}
  .step-dot.done{background:var(--primary);color:#fff;border-color:var(--primary);}
  .step-dot.current{border-color:var(--primary);color:var(--primary);}
  .step-line{flex:1;height:2px;background:var(--border);}
  .step-line.done{background:var(--primary);}

  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  .info-cell{background:var(--bg);border-radius:14px;padding:14px 16px;}
  .info-cell .ic-label{font-size:11px;color:var(--text-2);margin-bottom:4px;}
  .info-cell .ic-value{font-size:15px;font-weight:700;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{background:var(--surface);border:1px solid var(--secondary);border-radius:999px;padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:6px;}
  .chip button{background:none;border:none;color:var(--text-2);display:flex;}

  .section-block{margin-bottom:22px;}
  .section-block h3{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:12px;margin-bottom:8px;font-size:13px;}
  .doc-row .doc-name{flex:1;font-weight:600;}
  .doc-row .doc-size{color:var(--text-2);font-size:11.5px;}
  .timeline{border-left:2px solid var(--border);padding-left:16px;}
  .timeline-item{position:relative;padding-bottom:16px;}
  .timeline-item::before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .timeline-item .ti-date{font-size:11px;color:var(--text-2);}
  .timeline-item .ti-text{font-size:13px;margin-top:2px;}

  .table-wrap{width:100%;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:12px 16px;color:var(--text-2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--border);background:var(--bg);}
  td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr.clickable-row:hover td{background:var(--marigold);}

  .dropzone{border:2px dashed var(--secondary);border-radius:var(--r-card);padding:34px;text-align:center;background:var(--surface);transition:border-color .2s, background .2s;}
  .dropzone.drag{border-color:var(--primary);background:var(--marigold);}
  .dropzone .dz-icon{width:52px;height:52px;border-radius:16px;background:var(--marigold);display:flex;align-items:center;justify-content:center;color:var(--primary);margin:0 auto 14px;}
  .progress-track{width:100%;height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#ff9955);border-radius:999px;transform-origin:left;animation:barGrow 1.1s ease both;}

  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;}
  .match-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
  .match-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .match-name{font-weight:700;font-size:13.5px;}
  .match-amt{font-weight:700;color:var(--primary);}
  .match-meta{font-size:11.5px;color:var(--text-2);}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--text);color:#fff;padding:13px 18px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,0.25);animation:toastSlide .3s ease;}
  .toast .t-ic{color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,0.5);display:flex;align-items:center;justify-content:center;z-index:150;animation:fadeInUp .2s ease;}
  .modal-box{background:var(--surface);border-radius:22px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,0.3);}
  .modal-box.wide{width:600px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h3{margin:0;font-size:17px;font-weight:700;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--secondary);border-radius:var(--r-input);padding:10px 13px;font-size:13.5px;color:var(--text);background:var(--bg);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(250,93,0,0.12);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(29,30,28,0.4);z-index:150;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);z-index:151;box-shadow:-16px 0 40px rgba(0,0,0,0.2);animation:drawerIn .28s ease;padding:26px;overflow-y:auto;}

  .toggle{width:42px;height:24px;border-radius:999px;background:var(--secondary);position:relative;border:none;flex-shrink:0;transition:background .2s;}
  .toggle.on{background:var(--primary);}
  .toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
  .toggle.on .knob{transform:translateX(18px);}

  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);}
  .settings-row .sr-title{font-size:14px;font-weight:700;margin-bottom:3px;}
  .settings-row .sr-sub{font-size:12px;color:var(--text-2);}

  .empty-illust{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-2);}
  .empty-illust svg{margin-bottom:14px;}

  @media (max-width:1100px){
    .quick-grid{grid-template-columns:repeat(2,1fr);}
    .split{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

function Toast({items}) {
  return (
    <div className="toast-stack">
      {items.map(t => (
        <div className="toast" key={t.id}>
          <Icon name="check-circle-2" size={16} className="t-ic" />
          <span>{t.text}</span>
        </div>
      ))}
    </div>
  );
}

function Stepper({stage, total, labels}) {
  return (
    <div className="stepper">
      {labels.map((label, i) => (
        <React.Fragment key={label}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
            <div className={`step-dot ${i < stage ? 'done' : i === stage ? 'current' : ''}`}>
              {i < stage ? <Icon name="check" size={13} /> : i+1}
            </div>
            <span style={{fontSize:10.5, color:'var(--text-2)', whiteSpace:'nowrap'}}>{label}</span>
          </div>
          {i < labels.length - 1 && <div className={`step-line ${i < stage ? 'done' : ''}`}></div>}
        </React.Fragment>
      ))}
    </div>
  );
}

                  <div className="panel" style={{padding:'18px 20px'}}>
                    <h3 style={{margin:'0 0 4px', fontSize:14.5}}><Icon name="alert-triangle" size={15} style={{color:'var(--primary)', verticalAlign:-2}} /> 미매칭 / 동명이인 후보 ({PAYMENT_UNMATCHED.length}건)</h3>
                    <p style={{fontSize:12, color:'var(--text-2)', margin:'0 0 12px'}}>입금자명이 등록 정보와 다른 건입니다. 후보를 확인해 수동 연결하세요.</p>
                    {PAYMENT_UNMATCHED.map((p,i) => (
                      <div className="match-card" key={i} style={{borderColor:'#f3c88a'}}>
                        <div className="match-card-top"><span className="match-name">{p.name}</span><span className="match-amt">{p.amount}</span></div>
                        <div className="match-meta">{p.date} · {p.note}</div>
                        <button className="btn-ghost btn-sm" style={{marginTop:8}} onClick={() => setCandidateOpen(true)}>
                          <Icon name="users" size={13} /> 동명이인 후보 확인
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </React.Fragment>
            )}

            {screen === 'settlement' && (
              <React.Fragment>
                <div className="page-head">
                  <div>
                    <div className="eyebrow">연체·정산</div>
                    <h1>연체 판정 및 정산 관리</h1>
                    <p>연체 판정 기준일이 지난 계약을 자동 스캔해 연체료·초과 정산액을 계산하고, 조정 사유를 이력에 남깁니다.</p>
                  </div>
                  <button className="btn-primary" onClick={() => pushToast('연체 판정 배치를 재실행했습니다. 3건이 갱신되었습니다.')}>
                    <Icon name="refresh-cw" size={15} /> 연체 판정 재실행
                  </button>
                </div>

                <div className="panel">
                  <div className="table-wrap">
                    <table>
                      <thead>
                        <tr><th>계약자</th><th>연체일수</th><th>기본 이용료</th><th>연체료</th><th>초과 정산</th><th>비고</th><th></th></tr>
                      </thead>
                      <tbody>
                        {overdueList.map(o => (
                          <tr key={o.id} className="clickable-row" onClick={() => setDrawerItem(o)}>
                            <td style={{fontWeight:700}}>{o.name}</td>
                            <td><span className="badge status-overdue">{o.days}일</span></td>
                            <td>{o.base.toLocaleString()}원</td>
                            <td style={{color:'var(--primary)', fontWeight:700}}>{o.penalty.toLocaleString()}원</td>
                            <td>{o.excess ? `${o.excess.toLocaleString()}원 (${o.excessDays}일)` : '-'}</td>
                            <td style={{fontSize:12, color:'var(--text-2)'}}>{o.note || '-'}</td>
                            <td>
                              <button className="btn-ghost btn-sm" onClick={(e)=>{e.stopPropagation(); setAdjustTarget(o);}}>
                                <Icon name="settings-2" size={13} /> 조정
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </React.Fragment>
            )}

            {screen === 'notice' && (
              <React.Fragment>
                <div className="page-head">
                  <div>
                    <div className="eyebrow">안내문 · 발송</div>
                    <h1>계약 안내문 자동 생성 및 알림톡 발송</h1>
                    <p>창고·고객유형 조합의 양식을 계약 정보로 자동 채우고, 카카오 알림톡으로 발송합니다. 실패 시 문자로 자동 대체됩니다.</p>
                  </div>
                </div>

                <div className="split" style={{gridTemplateColumns:'1fr 380px'}}>
                  <div className="panel" style={{padding:'20px 22px'}}>
                    <h3 style={{margin:'0 0 12px', fontSize:14.5}}>양식 선택 (창고 × 고객유형)</h3>
                    <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:20}}>
                      {NOTICE_TEMPLATES.map(t => (
                        <button key={t.id} className="quick-card" style={{padding:14, textAlign:'left', border: selectedTemplate===t.id ? '2px solid var(--primary)' : '1px solid var(--border)'}} onClick={() => setSelectedTemplate(t.id)}>
                          <h3 style={{fontSize:13}}>{t.title}</h3>
                          <p style={{fontSize:11.5}}>{t.desc}</p>
                        </button>
                      ))}
                    </div>
                    <div style={{background:'var(--bg)', borderRadius:16, padding:18, fontSize:13, lineHeight:1.7}}>
                      <div style={{fontWeight:700, marginBottom:8}}>미리보기 — {NOTICE_TEMPLATES.find(t=>t.id===selectedTemplate).title}</div>
                      <div>안녕하세요, {selected.name} 고객님.</div>
                      <div>{selected.warehouse} 보관 계약({selected.contractNo})의 이용 만료일이 다가와 안내드립니다.</div>
                      <div>· 청구 금액: {selected.fee}</div>
                      <div>· 대상 기간: 2026.09.01 ~ 2026.09.30</div>
                      <div>· 입금 계좌: 웨어박스뱅크 123-456-7890</div>
                    </div>
                    <div style={{display:'flex', gap:10, marginTop:16}}>
                      <div className="tab-row" style={{flex:1}}>
                        {['알림톡','문자'].map(ch => (
                          <button key={ch} className={`tab-chip ${sendChannel===ch?'active':''}`} onClick={()=>setSendChannel(ch)}>{ch}</button>
                        ))}
                      </div>
                      <button className="btn-primary" onClick={() => pushToast(`${sendChannel}으로 발송을 시작합니다. 실패 시 자동으로 대체 채널로 전환됩니다.`)}>
                        <Icon name="send" size={15} /> 발송하기
                      </button>
                    </div>
                  </div>

                  <div className="panel" style={{padding:'20px 22px'}}>
                    <h3 style={{margin:'0 0 12px', fontSize:14.5}}>발송 이력</h3>
                    {NOTICE_HISTORY.map((h,i) => (
                      <div className="doc-row" key={i} style={{alignItems:'flex-start', flexDirection:'column', gap:4}}>
                        <div style={{display:'flex', width:'100%', justifyContent:'space-between'}}>
                          <span className="doc-name">{h.name}</span>
                          <span className="badge status-normal">{h.status}</span>
                        </div>
                        <span className="doc-size">{h.channel} · {h.sent}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </React.Fragment>
            )}

            {screen === 'settings' && (
              <React.Fragment>
                <div className="page-head">
                  <div>
                    <div className="eyebrow">환경 설정</div>
                    <h1>환경 설정</h1>
                    <p>발송 시점·연체료 규칙·로그인 보안 등 시스템 전반의 운영 규칙을 관리합니다.</p>
                  </div>
                </div>
                <div className="panel" style={{padding:'6px 22px'}}>
                  <div className="settings-row">
                    <div><div className="sr-title">로그인 실패 자동 잠금</div><div className="sr-sub">5회 실패 시 계정을 10분간 잠급니다.</div></div>
                    <button className={`toggle ${settings.dupBlock?'on':''}`} onClick={()=>setSettings(s=>({...s,dupBlock:!s.dupBlock}))}><span className="knob"></span></button>
                  </div>
                  <div className="settings-row">
                    <div><div className="sr-title">일정 시간 미사용 시 자동 로그아웃</div><div className="sr-sub">30분 미사용 시 세션을 종료합니다.</div></div>
                    <button className={`toggle ${settings.autoLogout?'on':''}`} onClick={()=>setSettings(s=>({...s,autoLogout:!s.autoLogout}))}><span className="knob"></span></button>
                  </div>
                  <div className="settings-row">
                    <div><div className="sr-title">알림톡 실패 시 문자 자동 대체</div><div className="sr-sub">발송 실패 감지 후 5분 이내 문자로 재발송합니다.</div></div>
                    <button className={`toggle ${settings.kakaoFallback?'on':''}`} onClick={()=>setSettings(s=>({...s,kakaoFallback:!s.kakaoFallback}))}><span className="knob"></span></button>
                  </div>
                  <div className="settings-row">
                    <div><div className="sr-title">주말 발송 허용</div><div className="sr-sub">토·일요일에도 자동 발송을 실행합니다.</div></div>
                    <button className={`toggle ${settings.weekendSend?'on':''}`} onClick={()=>setSettings(s=>({...s,weekendSend:!s.weekendSend}))}><span className="knob"></span></button>
                  </div>
                  <div className="settings-row">
                    <div><div className="sr-title">연체 판정 유예일</div><div className="sr-sub">만료일 이후 며칠까지 유예할지 설정합니다.</div></div>
                    <select value={settings.overdueGrace} onChange={(e)=>setSettings(s=>({...s,overdueGrace:e.target.value}))} style={{border:'1px solid var(--secondary)', borderRadius:10, padding:'8px 12px'}}>
                      <option value={1}>1일</option><option value={3}>3일</option><option value={5}>5일</option>
                    </select>
                  </div>
                  <div className="settings-row" style={{borderBottom:'none'}}>
                    <div><div className="sr-title">일 연체료율</div><div className="sr-sub">기본 이용료 대비 일 연체료 비율입니다.</div></div>
                    <select value={settings.penaltyRate} onChange={(e)=>setSettings(s=>({...s,penaltyRate:e.target.value}))} style={{border:'1px solid var(--secondary)', borderRadius:10, padding:'8px 12px'}}>
                      <option value={2}>2%</option><option value={3}>3%</option><option value={5}>5%</option>
                    </select>
                  </div>
                </div>
                <div style={{marginTop:16}}>
                  <button className="btn-primary" onClick={() => pushToast('환경 설정이 저장되었습니다.')}><Icon name="save" size={15} /> 설정 저장</button>
                </div>
              </React.Fragment>
            )}
          </main>
        </div>
      </div>

      {modal === 'newContract' && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>신규 계약 등록</h3><button className="icon-btn" onClick={()=>setModal(null)}><Icon name="x" size={16} /></button></div>
            <div className="field"><label>고객 구분</label><select><option>개인</option><option>법인</option><option>법원</option></select></div>
            <div className="field"><label>고객명 / 상호</label><input placeholder="예: 김도윤 또는 (주)한강물류" /></div>
            <div className="field"><label>창고 선택</label><select><option>1창고(파주)</option><option>2창고(김포)</option><option>3창고(인천)</option></select></div>
            <div className="field"><label>이용 기간(개월)</label><input type="number" defaultValue={12} /></div>
            <div className="field"><label>월 이용료</label><input placeholder="320,000원" /></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setModal(null);pushToast('신규 계약이 등록되었고 만료일이 자동 계산되었습니다.');}}>계약 등록</button>
            </div>
          </div>
        </div>
      )}

      {modal === 'editContract' && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>{selected.name} 계약 수정</h3><button className="icon-btn" onClick={()=>setModal(null)}><Icon name="x" size={16} /></button></div>
            <div className="field"><label>월 이용료</label><input defaultValue={selected.fee} /></div>
            <div className="field"><label>할인 적용</label><input defaultValue={selected.discount} /></div>
            <div className="field"><label>결제 구분</label><select defaultValue={selected.paymentType}><option>카드 자동결제</option><option>계좌이체</option><option>세금계산서 발행</option></select></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setModal(null);pushToast('계약 정보가 수정되었습니다.');}}>저장</button>
            </div>
          </div>
        </div>
      )}

      {modal === 'addDepositor' && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>입금자명 추가</h3><button className="icon-btn" onClick={()=>setModal(null)}><Icon name="x" size={16} /></button></div>
            <div className="field"><label>추가할 입금자명</label><input placeholder="예: 박지훈 배우자 김서영" /></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setModal(null);pushToast('입금자명이 추가되었습니다.');}}>추가</button>
            </div>
          </div>
        </div>
      )}

      {modal === 'addNote' && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>상담 메모 추가</h3><button className="icon-btn" onClick={()=>setModal(null)}><Icon name="x" size={16} /></button></div>
            <div className="field"><label>상담 내용</label><textarea rows={4} placeholder="고객 문의 및 처리 내용을 입력하세요"></textarea></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setModal(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setModal(null);pushToast('상담 메모가 저장되었습니다.');}}>저장</button>
            </div>
          </div>
        </div>
      )}

      {candidateOpen && (
        <div className="modal-overlay" onClick={()=>setCandidateOpen(false)}>
          <div className="modal-box wide" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>동명이인 후보 확인 — 김민수 (305,000원)</h3><button className="icon-btn" onClick={()=>setCandidateOpen(false)}><Icon name="x" size={16} /></button></div>
            {PAYMENT_CANDIDATES.map((c,i) => (
              <div key={i} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 14px', background:'var(--bg)', borderRadius:14, marginBottom:10}}>
                <div>
                  <div style={{fontWeight:700, fontSize:13.5}}>{c.match}</div>
                  <div style={{fontSize:11.5, color:'var(--text-2)'}}>유사도 스코어 {c.score}점</div>
                </div>
                <button className="btn-primary btn-sm" onClick={()=>{setCandidateOpen(false);pushToast('입금이 수동 연결되었고 입금자명이 학습 저장되었습니다.');}}>이 계약으로 확정</button>
              </div>
            ))}
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setCandidateOpen(false)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      {adjustTarget && (
        <div className="modal-overlay" onClick={()=>setAdjustTarget(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>{adjustTarget.name} 청구 금액 조정</h3><button className="icon-btn" onClick={()=>setAdjustTarget(null)}><Icon name="x" size={16} /></button></div>
            <div className="field"><label>조정 후 청구 금액</label><input defaultValue={(adjustTarget.base + adjustTarget.penalty).toLocaleString() + '원'} /></div>
            <div className="field"><label>변경 사유 (필수)</label><textarea rows={3} placeholder="예: 초과 일수 정산 협의로 연체료 일부 감면"></textarea></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setAdjustTarget(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setAdjustTarget(null);pushToast('청구 금액이 조정되었고 변경 이력에 기록되었습니다.');}}>조정 반영</button>
            </div>
          </div>
        </div>
      )}

      {drawerItem && (
        <React.Fragment>
          <div className="drawer-overlay" onClick={()=>setDrawerItem(null)}></div>
          <div className="drawer">
            <div className="modal-head"><h3>{drawerItem.name} 연체 상세</h3><button className="icon-btn" onClick={()=>setDrawerItem(null)}><Icon name="x" size={16} /></button></div>
            <div className="info-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
              <div className="info-cell"><div className="ic-label">연체 일수</div><div className="ic-value">{drawerItem.days}일</div></div>
              <div className="info-cell"><div className="ic-label">기본 이용료</div><div className="ic-value">{drawerItem.base.toLocaleString()}원</div></div>
              <div className="info-cell"><div className="ic-label">일 연체료율</div><div className="ic-value">{(drawerItem.penaltyRate*100).toFixed(0)}%</div></div>
              <div className="info-cell"><div className="ic-label">연체료 합계</div><div className="ic-value">{drawerItem.penalty.toLocaleString()}원</div></div>
            </div>
            <div className="section-block">
              <h3><Icon name="history" size={14} /> 조정 이력</h3>
              <div className="timeline">
                <div className="timeline-item"><div className="ti-date">2026.08.27</div><div className="ti-text">연체 판정 배치 자동 실행 — 상태 갱신</div></div>
                <div className="timeline-item"><div className="ti-date">2026.08.24</div><div className="ti-text">담당자 1차 안내 발송</div></div>
              </div>
            </div>
            <button className="btn-primary" style={{width:'100%'}} onClick={()=>{setDrawerItem(null);pushToast('청구서를 재발송했습니다.');}}>청구서 재발송</button>
          </div>
        </React.Fragment>
      )}

      <Toast items={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
