<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웨어박스 컨트롤타워 — 다중 창고 통합 관제 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --primary:#5683da; --secondary:#4a4b50; --accent:#ff8964;
    --bg:#303236; --void:#090a0c; --surface:#111111; --surface-2:#1a1b1e;
    --text:#f5f6f7; --text-2:#95979e; --border:#3a3b40;
    --r-card:12px; --r-btn:9999px; --r-input:8px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:8px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes cardStagger{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(86,131,218,0.5);}50%{opacity:0.7;box-shadow:0 0 0 5px rgba(86,131,218,0);}}
  @keyframes emberPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,137,100,0.45);}50%{box-shadow:0 0 0 5px rgba(255,137,100,0);}}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes sweep{0%{transform:translateX(-100%);}100%{transform:translateX(220%);}}
  @keyframes toastSlide{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  [data-archetype="topbar-analytics"]{width:100%;min-height:100vh;display:flex;flex-direction:column;}

  .app-header{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:0 28px;height:60px;
    background:rgba(17,17,17,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-0.3px;}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .project-switcher{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;border:1px solid var(--border);font-size:12.5px;color:var(--text-2);background:var(--surface-2);}
  .global-nav{display:flex;align-items:center;gap:4px;margin-left:8px;}
  .nav-link{padding:8px 14px;border-radius:9999px;font-size:13px;font-weight:500;color:var(--text-2);border:none;background:transparent;}
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--text);background:var(--surface-2);}
  .header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .icon-btn{width:34px;height:34px;border-radius:9999px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;}
  .icon-btn:hover{color:var(--text);border-color:var(--text-2);}
  .dot-alert{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:emberPulse 1.8s infinite;}
  .avatar-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}

  .tab-bar{display:flex;gap:4px;padding:0 28px;height:46px;align-items:center;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto;}
  .tab{padding:9px 4px;border:none;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-right:22px;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--primary);}

  .content{max-width:1280px;margin:0 auto;width:100%;padding:26px 28px 70px;animation:fadeInUp .3s ease;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .eyebrow{font-size:11.5px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
  .page-head h1{font-size:42px;font-weight:700;letter-spacing:-1.6px;margin:0 0 8px;}
  .page-head p{margin:0;color:var(--text-2);font-size:13.5px;max-width:580px;line-height:1.55;}

  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:var(--r-btn);padding:10px 20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;transition:filter .15s, transform .12s;}
  .btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:var(--r-btn);padding:9px 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .btn-ghost:hover{border-color:var(--text-2);}
  .btn-sm{padding:6px 13px;font-size:12px;}

  /* status-strip — 슬림 라이브 상태바 (큰 KPI 카드 행 대체) */
  .status-strip{
    display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-card);padding:0;margin-bottom:18px;overflow-x:auto;
  }
  .status-item{display:flex;align-items:center;gap:10px;padding:14px 20px;border-right:1px solid var(--border);flex:1;min-width:150px;}
  .status-item:last-child{border-right:none;}
  .status-item .si-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;animation:livePulse 2s infinite;}
  .status-item.warn .si-dot{background:var(--accent);animation:emberPulse 2s infinite;}
  .status-item .si-label{font-size:11px;color:var(--text-2);}
  .status-item .si-value{font-size:17px;font-weight:700;letter-spacing:-0.4px;}
  .status-strip .si-time{margin-left:auto;padding:0 20px;font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap;}

  .aurora-wrap{position:relative;overflow:hidden;}
  .aurora-beam{position:absolute;top:-60px;left:6%;width:260px;height:320px;background:linear-gradient(180deg, rgba(86,131,218,0.55) 0%, rgba(255,137,100,0.4) 55%, transparent 85%);filter:blur(44px);opacity:0.6;pointer-events:none;z-index:0;}
  .aurora-wrap > *{position:relative;z-index:1;}

  .tower-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:flex-start;}
  .panel{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;animation:cardStagger .35s ease both;}
  .panel.glow::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle, rgba(255,170,129,0.22), transparent 70%);pointer-events:none;z-index:0;}
  .panel.glow .panel-head, .panel.glow .panel-body{position:relative;z-index:1;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h2{font-size:14.5px;font-weight:700;margin:0;}
  .panel-body{padding:18px;}

  /* primary-focus — 타임라인/보드 */
  .flow-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .flow-col{background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--border);}
  .flow-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .flow-col-head .fc-title{font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.4px;}
  .flow-col-head .fc-count{font-size:11px;background:var(--border);padding:1px 7px;border-radius:9999px;}
  .flow-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:8px;font-size:12px;}
  .flow-card .fc-name{font-weight:700;margin-bottom:4px;}
  .flow-card .fc-meta{color:var(--text-2);font-size:10.5px;display:flex;justify-content:space-between;}
  .wh-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
  .wh-a{background:#5683da;} .wh-b{background:#ff8964;} .wh-c{background:#7dd3c0;}

  .spark-row{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:14px;}
  .spark-bar{flex:1;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:3px 3px 0 0;opacity:0.85;}

  /* priority-rail — 우선 대응 큐 */
  .queue-item{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:9px;cursor:pointer;transition:border-color .15s, transform .12s;}
  .queue-item:hover{border-color:var(--primary);transform:translateX(-2px);}
  .queue-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .queue-name{font-weight:700;font-size:13px;}
  .score-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9999px;}
  .score-high{background:rgba(255,137,100,0.16);color:var(--accent);}
  .score-mid{background:rgba(86,131,218,0.16);color:var(--primary);}
  .queue-meta{font-size:11px;color:var(--text-2);}

  /* secondary widgets */
  .secondary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;}
  .quick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;text-align:left;transition:border-color .15s, transform .15s;animation:cardStagger .4s ease both;}
  .quick-card:hover{border-color:var(--primary);transform:translateY(-3px);}
  .quick-card .qc-icon{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--primary);margin-bottom:10px;font-size:16px;}
  .quick-card h3{font-size:12.5px;font-weight:700;margin:0 0 5px;line-height:1.4;}
  .quick-card p{font-size:11px;color:var(--text-2);margin:0;line-height:1.4;}

  .integ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .integ-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;}
  .integ-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .integ-name{font-weight:700;font-size:13.5px;}
  .integ-status{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:9999px;}
  .st-ok{background:rgba(86,131,218,0.16);color:var(--primary);}
  .st-warn{background:rgba(255,137,100,0.18);color:var(--accent);}
  .integ-rate{font-size:30px;font-weight:700;letter-spacing:-0.5px;}
  .integ-sub{font-size:11px;color:var(--text-2);margin-top:3px;}

  .table-wrap{width:100%;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;padding:11px 16px;color:var(--text-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
  td{padding:12px 16px;border-bottom:1px solid var(--border);}
  tr.clickable-row{cursor:pointer;}
  tr.clickable-row:hover td{background:var(--surface-2);}

  .badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:9999px;}
  .badge-fail{background:rgba(255,137,100,0.18);color:var(--accent);}
  .badge-ok{background:rgba(125,211,192,0.16);color:#7dd3c0;}
  .badge-pending{background:rgba(255,255,255,0.08);color:var(--text-2);}

  .perm-grid{display:grid;grid-template-columns:220px 1fr;gap:18px;}
  .role-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:6px;}
  .role-item{padding:12px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);border:none;background:transparent;width:100%;text-align:left;}
  .role-item.active{background:var(--surface-2);color:var(--text);}
  .perm-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border);}
  .perm-row .pr-title{font-size:13px;font-weight:600;}
  .perm-row .pr-sub{font-size:11px;color:var(--text-2);}
  .toggle{width:38px;height:22px;border-radius:9999px;background:var(--border);position:relative;border:none;flex-shrink:0;transition:background .2s;}
  .toggle.on{background:var(--primary);}
  .toggle .knob{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .2s;}
  .toggle.on .knob{transform:translateX(16px);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;}
  .cal-cell{aspect-ratio:1;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px;font-size:11px;color:var(--text-2);gap:3px;}
  .cal-cell.selected{border-color:var(--primary);background:rgba(86,131,218,0.1);color:var(--text);}
  .cal-dots{display:flex;gap:2px;}
  .cal-dots span{width:5px;height:5px;border-radius:50%;}

  .migrate-ring{width:120px;height:120px;position:relative;}
  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:12px;font-size:12.5px;display:flex;align-items:center;gap:9px;box-shadow:0 14px 32px rgba(0,0,0,0.4);animation:toastSlide .3s ease;}
  .toast i{color:var(--primary);}

  .modal-overlay{position:fixed;inset:0;background:rgba(9,10,12,0.65);display:flex;align-items:center;justify-content:center;z-index:150;animation:fadeInUp .2s ease;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:440px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:24px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-input);padding:9px 12px;font-size:13px;color:var(--text);background:var(--surface-2);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(9,10,12,0.55);z-index:150;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);z-index:151;animation:drawerIn .28s ease;padding:24px;overflow-y:auto;}

  .sweep-track{width:100%;height:6px;background:var(--surface-2);border-radius:9999px;overflow:hidden;margin-top:10px;position:relative;}
  .sweep-bar{position:absolute;top:0;left:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--primary),transparent);animation:sweep 1.6s linear infinite;}

  @media (max-width:1100px){
    .tower-grid{grid-template-columns:1fr;}
    .secondary-grid, .integ-grid{grid-template-columns:repeat(2,1fr);}
    .perm-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const WAREHOUSES = [
  {id:'wh1', name:'1창고(파주)', inbound:8, outbound:2, overdue:1, cls:'wh-a'},
  {id:'wh2', name:'2창고(김포)', inbound:5, outbound:1, overdue:2, cls:'wh-b'},
  {id:'wh3', name:'3창고(인천)', inbound:6, outbound:0, overdue:0, cls:'wh-c'},
];

const FLOW_STAGES = [
  {key:'접수', items:[{name:'박지훈', wh:'wh-b'},{name:'김서영', wh:'wh-a'}]},
  {key:'서류검수', items:[{name:'(주)한강물류', wh:'wh-b'},{name:'정하늘', wh:'wh-c'}]},
  {key:'컨테이너 배정', items:[{name:'법원 경매관리 3부', wh:'wh-c'}]},
  {key:'출고 검수', items:[{name:'이서준', wh:'wh-a'},{name:'대성전자유통', wh:'wh-c'}]},
];

const QUEUE = [
  {id:'q1', name:'유민재', type:'연체 11일', score:92, meta:'1창고 · 정산 미확정 · 2차 안내 완료'},
  {id:'q2', name:'박지훈', type:'연체 6일', score:78, meta:'2창고 · 미매칭 입금 1건 연결 대기'},
  {id:'q3', name:'(주)한강물류', type:'연체 3일', score:64, meta:'2창고 · 세금계산서 발행 보류'},
  {id:'q4', name:'김민수 입금건', type:'미매칭', score:58, meta:'동명이인 후보 2건 · 확정 대기'},
];

const INTEGRATIONS = [
  {id:'pay', name:'결제선생', icon:'ph-credit-card', rate:'99.2%', status:'ok', sub:'3창고 보관료 카드결제 · 최근 1시간 512건 처리'},
  {id:'send', name:'센드빌', icon:'ph-receipt', rate:'100%', status:'ok', sub:'창고별 보관료 세금계산서 발행 대기 0건'},
  {id:'kakao', name:'카카오 알림톡', icon:'ph-chat-circle-dots', rate:'94.1%', status:'warn', sub:'입출고·만료 안내 실패 3건 → 문자 대체 완료'},
  {id:'bot', name:'연계 챗봇', icon:'ph-robot', rate:'100%', status:'ok', sub:'컨테이너 출고 신청 webhook 정상'},
];

const INTEG_LOGS = [
  {time:'09:41', service:'카카오 알림톡', target:'박지훈 (2창고)', result:'fail', note:'보관료 만료 안내 수신 거부 — 문자로 자동 대체'},
  {time:'09:38', service:'결제선생', target:'(주)한강물류 (2창고)', result:'ok', note:'컨테이너 보관료 카드 결제 요청 승인'},
  {time:'09:12', service:'센드빌', target:'대성전자유통 (3창고)', result:'ok', note:'창고 보관료 세금계산서 발행 완료'},
  {time:'08:57', service:'연계 챗봇', target:'김서영 (1창고)', result:'ok', note:'컨테이너 출고 신청 접수 webhook 수신'},
  {time:'08:20', service:'카카오 알림톡', target:'유민재 (1창고)', result:'fail', note:'입출고 안내 발송 서버 응답 지연(5s) — 재시도 큐 등록'},
];

const ROLES = ['최고관리자','관리자 (정산)','관리자 (안내발송)'];
const PERMISSIONS = [

            </div>
            <div className="tower-grid" style={{gridTemplateColumns:'260px 1fr'}}>
              <div className="panel">
                <div className="panel-body" style={{display:'flex', flexDirection:'column', alignItems:'center', gap:14}}>
                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-2)" strokeWidth="12" />
                    <circle cx="60" cy="60" r="52" fill="none" stroke="var(--primary)" strokeWidth="12" strokeDasharray="326.7" strokeDashoffset="35" strokeLinecap="round" transform="rotate(-90 60 60)" />
                  </svg>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:30, fontWeight:700}}>89%</div>
                    <div style={{fontSize:11.5, color:'var(--text-2)'}}>1,328 / 1,500명 이관 완료</div>
                  </div>
                </div>
              </div>
              <div className="panel">
                <div className="panel-head"><h2>배치별 이관 현황</h2></div>
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>배치</th><th>진행률</th><th>상태</th><th></th></tr></thead>
                    <tbody>
                      {MIGRATE_BATCHES.map(b => (
                        <tr key={b.id}>
                          <td style={{fontWeight:600}}>{b.label}</td>
                          <td style={{width:220}}>
                            <div className="sweep-track" style={{position:'relative'}}>
                              <div style={{position:'absolute', inset:0, background:'var(--primary)', width:`${(b.done/b.total*100).toFixed(0)}%`, borderRadius:9999}}></div>
                            </div>
                            <div style={{fontSize:10.5, color:'var(--text-2)', marginTop:4}}>{b.done} / {b.total}명</div>
                          </td>
                          <td><span className={`badge ${b.status === '완료' ? 'badge-ok' : 'badge-pending'}`}>{b.status}</span></td>
                          <td><button className="btn-ghost btn-sm" onClick={() => pushToast(`${b.label} 상세 검증 로그를 열람합니다.`)}>상세</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}
      </main>

      {retryModal && (
        <div className="modal-overlay" onClick={()=>setRetryModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>재시도 큐 등록</h3><button className="icon-btn" onClick={()=>setRetryModal(null)}><Icon name="ph-x" size={15} /></button></div>
            <div className="field"><label>대상</label><input readOnly defaultValue={`${retryModal.service} · ${retryModal.target}`} /></div>
            <div className="field"><label>재시도 정책</label><select><option>즉시 1회 재시도</option><option>지수 백오프(1분→5분→15분)</option></select></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setRetryModal(null)}>취소</button>
              <button className="btn-primary" onClick={()=>{setRetryModal(null);pushToast('재시도 큐에 등록했습니다.');}}>등록</button>
            </div>
          </div>
        </div>
      )}

      {migrateModal && (
        <div className="modal-overlay" onClick={()=>setMigrateModal(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>검증 배치 실행</h3><button className="icon-btn" onClick={()=>setMigrateModal(false)}><Icon name="ph-x" size={15} /></button></div>
            <div className="field"><label>대상 배치</label><select><option>3창고 고객 데이터 (검증 중)</option></select></div>
            <div style={{fontSize:12, color:'var(--text-2)', marginBottom:8}}>중복 계약번호·필수 필드 누락 여부를 검사합니다.</div>
            <div className="sweep-track"><div className="sweep-bar"></div></div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setMigrateModal(false)}>닫기</button>
              <button className="btn-primary" onClick={()=>{setMigrateModal(false);pushToast('검증 배치를 시작했습니다. 완료 시 알림으로 안내합니다.');}}>실행</button>
            </div>
          </div>
        </div>
      )}

      {drawerItem && (
        <React.Fragment>
          <div className="drawer-overlay" onClick={()=>setDrawerItem(null)}></div>
          <div className="drawer">
            <div className="modal-head"><h3>{drawerItem.name}</h3><button className="icon-btn" onClick={()=>setDrawerItem(null)}><Icon name="ph-x" size={15} /></button></div>
            <div className="perm-row"><div><div className="pr-title">현재 단계</div><div className="pr-sub">{drawerItem.stage}</div></div></div>
            {drawerItem.meta && <div className="perm-row"><div><div className="pr-title">비고</div><div className="pr-sub">{drawerItem.meta}</div></div></div>}
            <button className="btn-primary" style={{width:'100%', justifyContent:'center', marginTop:16}} onClick={()=>{setDrawerItem(null);pushToast('담당자에게 처리 요청을 전달했습니다.');}}>담당자에게 처리 요청</button>
          </div>
        </React.Fragment>
      )}

      <Toast items={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
