<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>펫밸런스 지사몰 스토어 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --shadow-card: 0 4px 5px rgba(83,86,90,.04), 0 8px 15px rgba(83,86,90,.03), 0 30px 50px rgba(83,86,90,.06);
  --shadow-btn: 0 4px 5px rgba(83,86,90,.04), 0 8px 15px rgba(83,86,90,.05);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select{font-family:inherit;}
a{text-decoration:none; color:inherit;}
img{display:block; max-width:100%;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

/* ── keyframes ── */
@keyframes fadeInUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
@keyframes shimmer{ 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
@keyframes slideInRight{ from{transform:translateX(100%);} to{transform:translateX(0);} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes pulseHeart{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }
@keyframes progressFill{ from{width:0%;} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes modalPop{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);} }

/* ── layout shell ── */
.app{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* search-header (archetype signature 1) */
.search-header{position:sticky; top:0; z-index:40; background:var(--n1); border-bottom:1px solid var(--n3);}
.header-row{max-width:1240px; margin:0 auto; display:flex; align-items:center; gap:24px; padding:16px 32px;}
.brand{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; color:var(--n9); flex-shrink:0;}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff;}
.search-bar{flex:1; display:flex; align-items:center; background:var(--n1); border:1px solid var(--n3); border-radius:9999px; box-shadow:var(--shadow-btn); max-width:640px; position:relative;}
.search-segment{flex:1; text-align:left; padding:10px 20px; border-radius:9999px; position:relative;}
.search-segment:hover{background:var(--n2);}
.search-segment.is-open{background:var(--n2);}
.segment-label{font-size:11px; font-weight:600; color:var(--n7);}
.segment-value{font-size:13px; font-weight:600; color:var(--n9); display:flex; align-items:center; gap:4px; margin-top:2px;}
.search-divider{width:1px; height:24px; background:var(--n3);}
.search-submit{width:40px; height:40px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; margin-right:4px; flex-shrink:0;}
.segment-panel{position:absolute; top:calc(100% + 10px); left:0; min-width:200px; background:var(--n1); border:1px solid var(--n3); border-radius:14px; box-shadow:var(--shadow-card); padding:8px; z-index:50; animation:fadeInUp .16s ease;}
.segment-option{width:100%; text-align:left; padding:10px 12px; border-radius:8px; font-size:14px; color:var(--n8); display:flex; justify-content:space-between; align-items:center;}
.segment-option:hover{background:var(--n2);}
.segment-option.active{background:var(--m50); color:var(--m700); font-weight:600;}
.header-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.nav-link{padding:10px 14px; border-radius:9999px; font-size:14px; font-weight:500; color:var(--n8); display:flex; align-items:center; gap:6px;}
.nav-link:hover{background:var(--n2);}
.nav-link.active{background:var(--m50); color:var(--m700); font-weight:700;}
.cart-btn{position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n8);}
.cart-btn:hover{background:var(--n2);}
.cart-badge{position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:9999px; background:var(--m600); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;}

/* filter chips (archetype signature 2) */
.filter-chips{max-width:1240px; margin:0 auto; display:flex; gap:8px; padding:14px 32px 16px; overflow-x:auto;}
.chip{flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9999px; border:1px solid var(--n3); background:var(--n1); font-size:13px; font-weight:600; color:var(--n8); transition:all .15s ease;}
.chip:hover{border-color:var(--n5);}
.chip.active{background:var(--m600); border-color:var(--m600); color:#fff;}

/* hero strip */
.hero-strip{max-width:1240px; margin:0 auto; width:100%; padding:8px 32px 28px;}
.hero-card{background:linear-gradient(135deg, var(--m700), var(--m600)); border-radius:24px; padding:36px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px; overflow:hidden; position:relative;}
.hero-card::after{content:''; position:absolute; right:-40px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.08);}
.hero-text h1{color:#fff; font-size:26px; font-weight:700; line-height:1.35; max-width:460px;}
@media (min-width:640px){ .hero-text h1{font-size:44px; line-height:1.15; max-width:560px;} }
.hero-text p{color:rgba(255,255,255,.82); font-size:14px; margin-top:8px; max-width:420px;}
.hero-cta{margin-top:18px; background:#fff; color:var(--m700); font-weight:700; font-size:14px; padding:12px 22px; border-radius:9999px; display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow-btn);}
.hero-badges{display:flex; gap:10px; position:relative; z-index:1;}
.hero-badge{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:16px; padding:14px 18px; color:#fff; min-width:110px;}
.hero-badge .num{font-size:20px; font-weight:700;}
.hero-badge .lbl{font-size:11px; opacity:.85; margin-top:2px;}

/* main / card-grid */
.main{flex:1; width:100%;}
.content-wrap{max-width:1240px; margin:0 auto; padding:0 32px 64px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.section-title h2{font-size:19px; font-weight:700; color:var(--n9);}
.section-title span{font-size:13px; color:var(--n7);}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:20px;}
.listing-card{background:var(--n1); border:1px solid var(--n3); border-radius:20px; overflow:hidden; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; opacity:0; animation:fadeInUp .5s ease forwards;}
.listing-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-card);}
.card-image-wrap{position:relative; aspect-ratio:4/3; background:var(--n2); overflow:hidden;}
.card-image-wrap img{width:100%; height:100%; object-fit:cover;}
.card-favorite{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--n7);}
.card-favorite.liked{color:var(--m600);}
.card-favorite.liked svg{fill:var(--m600);}
.card-tag{position:absolute; top:10px; left:10px; background:var(--n1); color:var(--n7); font-size:11px; font-weight:700; padding:4px 10px; border-radius:9999px; border:1px solid var(--n3);}
.card-body{padding:14px 16px 16px;}
.card-row-1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-title{font-size:15px; font-weight:700; color:var(--n9); line-height:1.35;}
.card-rating{font-size:12px; color:var(--n8); font-weight:600; display:flex; align-items:center; gap:3px; flex-shrink:0;}
.card-meta{font-size:12px; color:var(--n7); margin-top:4px; display:block;}
.card-row-4{display:flex; align-items:baseline; gap:4px; margin-top:10px;}
.card-price{font-size:17px; font-weight:800; color:var(--n9);}
.price-unit{font-size:12px; color:var(--n7);}

.skeleton{background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:800px 100%; animation:shimmer 1.3s linear infinite; border-radius:20px; aspect-ratio:3/4;}

/* drawer */
.overlay{position:fixed; inset:0; background:rgba(30,30,32,.42); z-index:80; display:flex; justify-content:flex-end; animation:fadeIn .18s ease;}
.drawer{width:420px; max-width:92vw; height:100%; background:var(--n1); box-shadow:-8px 0 30px rgba(0,0,0,.12); animation:slideInRight .24s cubic-bezier(.16,1,.3,1); display:flex; flex-direction:column;}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--n3);}
.drawer-head h3{font-size:16px; font-weight:700;}
.icon-btn{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.icon-btn:hover{background:var(--n2);}
.drawer-body{flex:1; overflow-y:auto; padding:20px;}
.drawer-img{width:100%; aspect-ratio:4/3; border-radius:16px; overflow:hidden; background:var(--n2); margin-bottom:16px;}
.drawer-img img{width:100%; height:100%; object-fit:cover;}
.opt-label{font-size:13px; font-weight:700; color:var(--n8); margin:16px 0 8px;}
.opt-row{display:flex; gap:8px; flex-wrap:wrap;}
.opt-chip{padding:9px 14px; border:1px solid var(--n3); border-radius:9999px; font-size:13px; font-weight:600; color:var(--n8);}
.opt-chip.active{background:var(--m600); border-color:var(--m600); color:#fff;}
.qty-row{display:flex; align-items:center; gap:14px; margin-top:16px;}
.qty-btn{width:32px; height:32px; border-radius:8px; background:var(--n2); display:flex; align-items:center; justify-content:center;}
.drawer-foot{padding:16px 20px; border-top:1px solid var(--n3); display:flex; gap:10px;}
.btn-primary{background:var(--m600); color:#fff; font-weight:700; font-size:14px; padding:13px 20px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:6px; flex:1; transition:background .15s;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:active{transform:scale(.98);}
.btn-outline{background:var(--n1); color:var(--n9); font-weight:700; font-size:14px; padding:13px 20px; border-radius:12px; border:1px solid var(--n4); flex:1; text-align:center;}
.btn-outline:hover{background:var(--n2);}

/* footer */
.footer{background:var(--n1); border-top:1px solid var(--n3); padding:40px 32px;}
.footer-cols{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:32px;}
.footer-col h4{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--n7); margin-bottom:12px; letter-spacing:.03em;}
.footer-col a{display:block; font-size:13px; color:var(--n8); padding:5px 0;}
.footer-brand p{font-size:12px; color:var(--n6); margin-top:10px; line-height:1.6;}

/* generic page shell for sub-views */
.page{max-width:920px; margin:0 auto; padding:36px 32px 64px; width:100%;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:23px; font-weight:800; color:var(--n9);}
.page-head p{font-size:14px; color:var(--n7); margin-top:6px;}

/* balance kit wizard */
.wiz-progress{height:6px; background:var(--n3); border-radius:9999px; overflow:hidden; margin-bottom:28px;}
.wiz-progress-fill{height:100%; background:var(--m600); border-radius:9999px; animation:progressFill .4s ease;}
.wiz-card{background:var(--n1); border:1px solid var(--n3); border-radius:20px; padding:32px; box-shadow:var(--shadow-card);}
.wiz-step-label{font-size:12px; font-weight:700; color:var(--m700); background:var(--m50); display:inline-block; padding:4px 10px; border-radius:9999px; margin-bottom:14px;}
.wiz-q{font-size:20px; font-weight:700; color:var(--n9); margin-bottom:20px;}
.wiz-options{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.wiz-opt{padding:16px; border:1.5px solid var(--n3); border-radius:14px; font-size:14px; font-weight:600; color:var(--n8); text-align:left; transition:all .15s;}
.wiz-opt:hover{border-color:var(--n5);}
.wiz-opt.selected{border-color:var(--m600); background:var(--m50); color:var(--m700);}
.wiz-nav{display:flex; justify-content:space-between; margin-top:26px; gap:10px;}
.wiz-slider-row{display:flex; align-items:center; gap:14px; margin-top:6px;}
.wiz-slider-row input[type=range]{flex:1; accent-color:var(--m600);}
.wiz-slider-val{font-size:18px; font-weight:800; color:var(--m700); min-width:70px; text-align:right;}

.result-hero{text-align:center; padding:8px 0 24px;}
.result-hero .ring{width:88px; height:88px; border-radius:50%; background:var(--m50); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:var(--m600);}
.result-hero h2{font-size:22px; font-weight:800;}
.result-hero p{font-size:13px; color:var(--n7); margin-top:6px;}
.result-products{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:22px 0;}
.result-product{border:1px solid var(--n3); border-radius:16px; padding:14px; display:flex; gap:12px; align-items:center;}
.result-product img{width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0;}
.result-product .rp-name{font-size:13px; font-weight:700;}
.result-product .rp-price{font-size:12px; color:var(--n7); margin-top:3px;}
.price-summary{background:var(--n2); border-radius:16px; padding:18px 20px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.price-summary .ps-label{font-size:13px; color:var(--n7);}
.price-summary .ps-value{font-size:24px; font-weight:800; color:var(--n9);}

/* subscription / mypage */
.card-block{background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:22px; margin-bottom:16px;}
.sub-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
.sub-title{font-size:15px; font-weight:700;}
.sub-meta{font-size:13px; color:var(--n7); margin-top:6px; line-height:1.7;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:9999px;}
.badge-s1{background:var(--s1-bg); color:var(--s1-text);}
.badge-s2{background:var(--s2-bg); color:var(--s2-text);}
.badge-s3{background:var(--s3-bg); color:var(--s3-text);}
.badge-n{background:var(--n2); color:var(--n7);}
.action-row{display:flex; gap:8px; margin-top:14px;}
.btn-ghost{padding:8px 14px; border:1px solid var(--n3); border-radius:9999px; font-size:12.5px; font-weight:600; color:var(--n8);}
.btn-ghost:hover{background:var(--n2);}
.table{width:100%; border-collapse:collapse;}
.table th{text-align:left; font-size:11.5px; font-weight:700; color:var(--n6); text-transform:uppercase; padding:10px 8px; border-bottom:1px solid var(--n3);}
.table td{font-size:13.5px; color:var(--n8); padding:12px 8px; border-bottom:1px solid var(--n2);}
.table tr:hover td{background:var(--n0);}

.profile-head{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.avatar{width:56px; height:56px; border-radius:50%; background:var(--m100); color:var(--m700); font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center;}
.pet-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.pet-card{border:1px solid var(--n3); border-radius:14px; padding:14px; text-align:center;}
.pet-card .pet-avatar{width:44px; height:44px; border-radius:50%; margin:0 auto 8px; background:var(--n2);}
.pet-card .pet-name{font-size:13px; font-weight:700;}
.pet-card .pet-sub{font-size:11.5px; color:var(--n7); margin-top:2px;}

.login-box{background:var(--n1); border:1px solid var(--n3); border-radius:20px; padding:48px 32px; text-align:center;}
.login-box .icon-circle{width:64px; height:64px; border-radius:50%; background:var(--m50); color:var(--m600); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.tab-row{display:flex; gap:6px; background:var(--n2); border-radius:12px; padding:4px; margin-bottom:20px; width:fit-content;}
.tab-item{padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; color:var(--n7);}
.tab-item.active{background:var(--n1); color:var(--n9); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.guest-lookup{display:flex; gap:8px; margin-top:12px;}
.guest-lookup input{flex:1; border:1px solid var(--n3); border-radius:10px; padding:11px 14px; font-size:13.5px;}
.guest-lookup input:focus{outline:2px solid var(--m300);}

/* cart page */
.cart-item{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--n2); align-items:center;}
.cart-item img{width:72px; height:72px; border-radius:12px; object-fit:cover;}
.cart-item .ci-name{font-size:14px; font-weight:700;}
.cart-item .ci-opt{font-size:12px; color:var(--n7); margin-top:3px;}
.cart-summary{background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:22px;}
.cart-summary-row{display:flex; justify-content:space-between; font-size:13.5px; color:var(--n7); padding:6px 0;}
.cart-summary-row.total{font-size:17px; font-weight:800; color:var(--n9); border-top:1px solid var(--n3); margin-top:8px; padding-top:14px;}
.empty-state{text-align:center; padding:60px 20px; color:var(--n7);}
.empty-state svg{color:var(--n5); margin-bottom:12px;}

/* toast */
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--n10); color:#fff; font-size:13.5px; font-weight:600; padding:13px 22px; border-radius:12px; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .25s ease; box-shadow:0 10px 30px rgba(0,0,0,.25);}
.toast .dot{width:8px; height:8px; border-radius:50%; background:var(--s1);}

/* confirm modal */
.modal-overlay{position:fixed; inset:0; background:rgba(30,30,32,.42); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeIn .16s ease;}
.modal-box{width:360px; max-width:90vw; background:var(--n1); border-radius:20px; padding:26px; animation:modalPop .2s cubic-bezier(.16,1,.3,1);}
.modal-box h3{font-size:16px; font-weight:800; margin-bottom:8px;}
.modal-box p{font-size:13.5px; color:var(--n7); line-height:1.6; margin-bottom:20px;}
.modal-actions{display:flex; gap:10px;}

@media (max-width:900px){
  .header-row{flex-wrap:wrap;}
  .search-bar{order:3; max-width:none; width:100%;}
  .hero-card{flex-direction:column; align-items:flex-start;}
  .footer-cols{grid-template-columns:1fr 1fr;}
  .result-products, .wiz-options{grid-template-columns:1fr;}
  .pet-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body data-archetype="airbnb-search-grid">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

/* ── mock data ── */

const img = (seed,w,h) => `https://picsum.photos/seed/${seed}/${w}/${h}`;

function Icon({name, size=18, className=''}){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current){ ref.current.innerHTML=''; }
  });
  return <i data-lucide={name} style={{width:size, height:size}} className={className}></i>;
}

function Toast({toast}){
  if(!toast) return null;
  return <div className="toast"><span className="dot"></span>{toast}</div>;
}

function ConfirmModal({data, onClose}){
  if(!data) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>{data.title}</h3>
        <p>{data.desc}</p>
        <div className="modal-actions">
          <button className="btn-outline" onClick={onClose}>취소</button>
          <button className="btn-primary" onClick={()=>{data.onConfirm(); onClose();}}>{data.confirmLabel || '확인'}</button>
        </div>
      </div>
    </div>
  );
}

function Header({view, setView, filters, setFilters, cartCount, openSegment, setOpenSegment}){
  const segDefs = [
    {key:'pet', label:'반려동물', options:[['all','전체'],['강아지','강아지'],['고양이','고양이']]},
    {key:'cat', label:'카테고리', options:[['all','전체'],['사료','사료'],['간식','간식'],['영양제','영양제'],['용품','용품']]},
    {key:'price', label:'가격대', options:[['all','전체'],['low','2만원 이하'],['mid','2~4만원'],['high','4만원 이상']]},
  ];
  const valueLabel = (key) => {
    const def = segDefs.find(s=>s.key===key);
    const opt = def.options.find(o=>o[0]===filters[key]);
    return opt ? opt[1] : '전체';
  };
  return (
    <header className="search-header">
      <div className="header-row">
        <a className="brand" onClick={()=>setView('main')}>
          <span className="brand-mark"><Icon name="paw-print" size={18}/></span>
          펫밸런스
        </a>
        <div className="search-bar">
          {segDefs.map((seg,i)=>(
            <React.Fragment key={seg.key}>
              {i>0 && <div className="search-divider"></div>}
              <button className={"search-segment" + (openSegment===seg.key ? ' is-open':'')}
                onClick={()=>setOpenSegment(openSegment===seg.key?null:seg.key)}>
                <div className="segment-label">{seg.label}</div>
                <div className="segment-value">{valueLabel(seg.key)} <Icon name="chevron-down" size={13}/></div>
                {openSegment===seg.key &&
                  <div className="segment-panel" onClick={e=>e.stopPropagation()}>
                    {seg.options.map(([val,label])=>(
                      <div key={val} className={"segment-option" + (filters[seg.key]===val?' active':'')}
                        onClick={()=>{setFilters({...filters,[seg.key]:val}); setOpenSegment(null);}}>
                        {label}{filters[seg.key]===val && <Icon name="check" size={14}/>}
                      </div>
                    ))}
                  </div>
                }
              </button>
            </React.Fragment>
          ))}
          <button className="search-submit" onClick={()=>setOpenSegment(null)}><Icon name="search" size={16}/></button>
        </div>
        <nav className="header-nav">
          <a className={"nav-link"+(view==='balance-kit'?' active':'')} onClick={()=>setView('balance-kit')}><Icon name="sparkles" size={15}/>밸런스키트 문진</a>
          <a className={"nav-link"+(view==='subscription'?' active':'')} onClick={()=>setView('subscription')}><Icon name="refresh-cw" size={15}/>정기구독 관리</a>
          <a className={"nav-link"+(view==='mypage'?' active':'')} onClick={()=>setView('mypage')}><Icon name="user" size={15}/>마이페이지</a>

  );

function FilterChips({filters, setFilters}){
  const chips = [
    {label:'전체', test:()=>true, apply:()=>({pet:'all',cat:'all',price:'all'})},
    {label:'강아지', test:f=>f.pet==='강아지', apply:f=>({...f,pet:f.pet==='강아지'?'all':'강아지'})},
    {label:'고양이', test:f=>f.pet==='고양이', apply:f=>({...f,pet:f.pet==='고양이'?'all':'고양이'})},
    {label:'사료', test:f=>f.cat==='사료', apply:f=>({...f,cat:f.cat==='사료'?'all':'사료'})},
    {label:'간식', test:f=>f.cat==='간식', apply:f=>({...f,cat:f.cat==='간식'?'all':'간식'})},
    {label:'영양제', test:f=>f.cat==='영양제', apply:f=>({...f,cat:f.cat==='영양제'?'all':'영양제'})},
    {label:'용품', test:f=>f.cat==='용품', apply:f=>({...f,cat:f.cat==='용품'?'all':'용품'})},
    {label:'구독가능만', test:f=>f.subOnly, apply:f=>({...f,subOnly:!f.subOnly})},
  ];
  const c0=chips[0],c1=chips[1],c2=chips[2],c3=chips[3],c4=chips[4],c5=chips[5],c6=chips[6],c7=chips[7];
  return (
    <div className="filter-chips">
      {c0.test(filters) ? <button className="chip active" onClick={()=>setFilters(c0.apply(filters))}>{c0.label}</button> : <button className="chip" onClick={()=>setFilters(c0.apply(filters))}>{c0.label}</button>}
      {c1.test(filters) ? <button className="chip active" onClick={()=>setFilters(c1.apply(filters))}>{c1.label}</button> : <button className="chip" onClick={()=>setFilters(c1.apply(filters))}>{c1.label}</button>}
      {c2.test(filters) ? <button className="chip active" onClick={()=>setFilters(c2.apply(filters))}>{c2.label}</button> : <button className="chip" onClick={()=>setFilters(c2.apply(filters))}>{c2.label}</button>}
      {c3.test(filters) ? <button className="chip active" onClick={()=>setFilters(c3.apply(filters))}>{c3.label}</button> : <button className="chip" onClick={()=>setFilters(c3.apply(filters))}>{c3.label}</button>}
      {c4.test(filters) ? <button className="chip active" onClick={()=>setFilters(c4.apply(filters))}>{c4.label}</button> : <button className="chip" onClick={()=>setFilters(c4.apply(filters))}>{c4.label}</button>}
      {c5.test(filters) ? <button className="chip active" onClick={()=>setFilters(c5.apply(filters))}>{c5.label}</button> : <button className="chip" onClick={()=>setFilters(c5.apply(filters))}>{c5.label}</button>}
      {c6.test(filters) ? <button className="chip active" onClick={()=>setFilters(c6.apply(filters))}>{c6.label}</button> : <button className="chip" onClick={()=>setFilters(c6.apply(filters))}>{c6.label}</button>}
      {c7.test(filters) ? <button className="chip active" onClick={()=>setFilters(c7.apply(filters))}>{c7.label}</button> : <button className="chip" onClick={()=>setFilters(c7.apply(filters))}>{c7.label}</button>}
    </div>
  );
}

      <div className="card-body">
        <div className="card-row-1">

function MainView({filters, setFilters, openSegment, setOpenSegment, likes, toggleLike, onOpenProduct, setView}){
  const [loading, setLoading] = useState(true);
  useEffect(()=>{ const t = setTimeout(()=>setLoading(false), 500); return ()=>clearTimeout(t); },[]);
  const list = PRODUCTS.filter(p=>{
    if(filters.pet!=='all' && p.pet!=='공통' && p.pet!==filters.pet) return false;
    if(filters.cat!=='all' && p.cat!==filters.cat) return false;
    if(filters.subOnly && p.badge!=='구독가능') return false;
    if(filters.price==='low' && p.price>20000) return false;
    if(filters.price==='mid' && (p.price<20000||p.price>40000)) return false;
    if(filters.price==='high' && p.price<40000) return false;
    return true;
  });
  return (
    <React.Fragment>
      <FilterChips filters={filters} setFilters={setFilters}/>
      <div className="hero-strip">
        <div className="hero-card">
          <div className="hero-text">
            <h1>8문항 밸런스키트로<br/>우리 아이 맞춤 사료를 찾아보세요</h1>
            <p>연령·몸무게·알러지를 입력하면 114종 상품 중 딱 맞는 조합과 월 구독가를 바로 확인할 수 있어요.</p>
            <button className="hero-cta" onClick={()=>setView('balance-kit')}>밸런스키트 시작하기 <Icon name="arrow-right" size={15}/></button>
          </div>
          <div className="hero-badges">
            <div className="hero-badge"><div className="num">114종</div><div className="lbl">추천 매핑 상품</div></div>
            <div className="hero-badge"><div className="num">100+</div><div className="lbl">참여 지사몰</div></div>
          </div>
        </div>
      </div>
      <div className="content-wrap">
        <div className="section-title">
          <h2>지금 인기있는 상품</h2>
          <span>{list.length}개 상품</span>
        </div>
        <div className="card-grid">
          {loading
            ? Array.from({length:8}).map((_,i)=><div className="skeleton" key={i}></div>)
            : list.map((p,i)=><ProductCard key={p.id} p={p} i={i} liked={!!likes[p.id]} toggleLike={toggleLike} onOpen={onOpenProduct}/>)
          }
        </div>
        {!loading && list.length===0 &&
          <div className="empty-state"><Icon name="package-search" size={40}/><p>조건에 맞는 상품이 없어요. 필터를 조정해보세요.</p></div>
        }
      </div>
    </React.Fragment>
  );
}

function BalanceKitView({setView, addSubscription, showToast}){
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const cur = WIZ_STEPS[step];
  const pct = done ? 100 : Math.round((step/WIZ_STEPS.length)*100);

  const select = (val) => setAnswers({...answers, [cur.key]:val});
  const next = () => { if(step<WIZ_STEPS.length-1) setStep(step+1); else setDone(true); };
  const prev = () => { if(step>0) setStep(step-1); };

  const petType = answers.pet || '강아지';
  const recs = PRODUCTS.filter(p=>p.pet===petType || p.pet==='공통').slice(0,2);
  const monthly = recs.reduce((s,p)=>s+p.price,0);

  if(done){
    return (
      <div className="page">
        <div className="wiz-card">
          <div className="result-hero">
            <div className="ring"><Icon name="sparkles" size={30}/></div>
            <h2>문진이 완료됐어요</h2>
            <p>{petType} 맞춤 추천 상품과 예상 월 구독가를 확인해보세요</p>
          </div>
          <div className="result-products">
            {recs.map(p=>(
              <div className="result-product" key={p.id}>
                <img src={img(p.img,120,120)} alt={p.name}/>
                <div><div className="rp-name">{p.name}</div><div className="rp-price">{fmt(p.price)}{p.unit}</div></div>
              </div>
            ))}
          </div>
          <div className="price-summary">
            <span className="ps-label">예상 월 구독가</span>
            <span className="ps-value">{fmt(monthly)}</span>
          </div>
          <div className="wiz-nav">
            <button className="btn-outline" onClick={()=>{setDone(false); setStep(0); setAnswers({});}}>다시 진단하기</button>
            <button className="btn-primary" onClick={()=>{addSubscription(recs, monthly); showToast('정기구독이 등록되었어요'); setView('subscription');}}>
              구독 등록하기 <Icon name="arrow-right" size={15}/>
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <div className="page-head">
        <h1>밸런스키트 문진</h1>
        <p>8개 문항에 답하면 맞춤 상품과 구독가를 바로 알려드려요</p>
      </div>
      <div className="wiz-progress"><div className="wiz-progress-fill" style={{width:pct+'%'}}></div></div>
      <div className="wiz-card">
        <span className="wiz-step-label">{step+1} / {WIZ_STEPS.length}</span>
        <h2 className="wiz-q">{cur.q}</h2>
        {cur.type==='choice' &&
          <div className="wiz-options">
            {cur.options.map(o=>(
              <button key={o} className={"wiz-opt"+(answers[cur.key]===o?' selected':'')} onClick={()=>select(o)}>{o}</button>
            ))}
          </div>
        }
        {cur.type==='slider' &&
          <div className="wiz-slider-row">
            <input type="range" min={cur.min} max={cur.max} value={answers[cur.key]||10} onChange={e=>select(Number(e.target.value))}/>
            <span className="wiz-slider-val">{answers[cur.key]||10}kg</span>
          </div>
        }
        <div className="wiz-nav">
          <button className="btn-outline" onClick={prev} disabled={step===0} style={{opacity:step===0?.4:1}}>이전</button>
          <button className="btn-primary" onClick={next} disabled={!answers[cur.key] && cur.type==='choice'} style={{opacity:(!answers[cur.key] && cur.type==='choice')?.5:1}}>
            {step===WIZ_STEPS.length-1?'결과 보기':'다음'} <Icon name="chevron-right" size={15}/>
          </button>
        </div>
      </div>
    </div>
  );
}

function SubscriptionView({subs, updateSub, setView, showToast}){
  const [confirm, setConfirm] = useState(null);
  const retryQueue = subs.filter(s=>s.status==='결제실패');
  return (
    <div className="page">
      <div className="page-head">
        <h1>정기구독 관리</h1>
        <p>다음 결제일과 결제 수단을 확인하고 구독을 해지·변경할 수 있어요</p>
      </div>
      {subs.length===0
        ? <div className="empty-state"><Icon name="refresh-cw" size={36}/><p>아직 등록된 구독이 없어요</p><div style={{marginTop:14}}><button className="btn-primary" style={{display:'inline-flex'}} onClick={()=>setView('balance-kit')}>밸런스키트로 시작하기</button></div></div>
        : subs.map(s=>(
          <div className="card-block" key={s.id}>
            <div className="sub-row">
              <div>
                <div className="sub-title">{s.products.map(p=>p.name).join(' + ')}</div>
                <div className="sub-meta">
                  다음 결제일 {s.nextDate} · {fmt(s.amount)} / 월<br/>
                  결제수단 신용카드(빌링키 등록)
                </div>
              </div>
              <span className={"badge "+(s.status==='활성'?'badge-s1':s.status==='결제실패'?'badge-s2':'badge-n')}>
                {s.status==='활성' && <Icon name="check" size={12}/>}
                {s.status}
              </span>
            </div>
            <div className="action-row">
              <button className="btn-ghost" onClick={()=>updateSub(s.id,{status:s.status==='일시정지'?'활성':'일시정지'})}>
                <Icon name="pause" size={13}/> {s.status==='일시정지'?'재개':'일시정지'}
              </button>
              <button className="btn-ghost" onClick={()=>showToast('변경 옵션을 준비 중이에요')}><Icon name="settings" size={13}/> 구독 변경</button>
              <button className="btn-ghost" onClick={()=>setConfirm({
                title:'구독을 해지할까요?',
                desc:'해지하면 다음 결제부터 청구되지 않아요. 언제든 다시 등록할 수 있어요.',
                confirmLabel:'해지하기',
                onConfirm:()=>{updateSub(s.id,{status:'해지'}); showToast('구독이 해지되었어요');}
              })}><Icon name="trash-2" size={13}/> 해지</button>
            </div>
          </div>
        ))
      }
      {retryQueue.length>0 &&
        <div className="card-block">
          <div className="sub-title" style={{marginBottom:12}}>결제 재처리 대기</div>
          <table className="table">
            <thead><tr><th>구독 상품</th><th>실패 사유</th><th>재시도</th></tr></thead>
            <tbody>
              {retryQueue.map(s=>(
                <tr key={s.id}>
                  <td>{s.products.map(p=>p.name).join(' + ')}</td>
                  <td><span className="badge badge-s2">카드 한도 초과</span></td>
                  <td><button className="btn-ghost" onClick={()=>{updateSub(s.id,{status:'활성'}); showToast('결제가 재처리되었어요');}}><Icon name="refresh-cw" size={12}/> 재시도</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      }
    </div>
  );
}

function MyPageView({loggedIn, setLoggedIn, showToast}){
  const [tab, setTab] = useState('orders');
  const [guestNo, setGuestNo] = useState('');
  const [guestResult, setGuestResult] = useState(null);
  const orders = [
    {id:'ORD-58213', date:'2026.08.28', item:'그레인프리 연어 사료 외 1건', amount:47000, status:'배송완료'},
    {id:'ORD-58190', date:'2026.08.15', item:'관절 강화 영양제', amount:32000, status:'배송중'},
    {id:'ORD-58072', date:'2026.07.30', item:'캣타워 3단 스크래처', amount:58000, status:'결제대기'},
  ];
  const pets = [{name:'초코', info:'말티즈 · 3세'},{name:'나비', info:'코리안숏헤어 · 2세'}];

  if(!loggedIn){
    return (
      <div className="page">
        <div className="login-box">
          <div className="icon-circle"><Icon name="log-in" size={28}/></div>
          <h2 style={{fontSize:19, fontWeight:800}}>3초만에 시작하기</h2>
          <p style={{fontSize:13.5, color:'var(--n7)', marginTop:8}}>카카오 계정으로 간편하게 가입하고<br/>주문·구독 내역을 한 번에 관리하세요</p>
          <div style={{marginTop:20, display:'flex', justifyContent:'center'}}>
            <button className="btn-primary" style={{flex:'none', padding:'13px 28px'}} onClick={()=>{setLoggedIn(true); showToast('카카오 로그인이 완료되었어요');}}>
              <Icon name="message-circle" size={16}/> 카카오 로그인
            </button>
          </div>
          <div style={{marginTop:28, borderTop:'1px solid var(--n3)', paddingTop:22}}>
            <div style={{fontSize:13, fontWeight:700, color:'var(--n8)', marginBottom:10}}>비회원 주문조회</div>
            <div className="guest-lookup">
              <input placeholder="주문번호 + 연락처 뒷 4자리" value={guestNo} onChange={e=>setGuestNo(e.target.value)}/>
              <button className="btn-outline" style={{flex:'none', padding:'11px 18px'}} onClick={()=>setGuestResult(orders[0])}>조회하기</button>
            </div>
            {guestResult &&
              <div className="card-block" style={{marginTop:14, textAlign:'left'}}>
                <div className="sub-title">{guestResult.item}</div>
                <div className="sub-meta">{guestResult.date} · {fmt(guestResult.amount)}</div>
                <span className="badge badge-s1" style={{marginTop:8}}>{guestResult.status}</span>
              </div>
            }
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <div className="profile-head">
        <div className="avatar">민</div>
        <div>
          <div style={{fontSize:17, fontWeight:800}}>김민지 님</div>
          <div style={{fontSize:12.5, color:'var(--n7)'}}>카카오 계정으로 로그인됨</div>
        </div>
      </div>
      <div className="tab-row">
        <button className={"tab-item"+(tab==='orders'?' active':'')} onClick={()=>setTab('orders')}>주문 내역</button>
        <button className={"tab-item"+(tab==='pets'?' active':'')} onClick={()=>setTab('pets')}>반려동물 프로필</button>
        <button className={"tab-item"+(tab==='sub'?' active':'')} onClick={()=>setTab('sub')}>구독 현황</button>
      </div>
      {tab==='orders' &&
        <div className="card-block">
          <table className="table">
            <thead><tr><th>주문번호</th><th>일자</th><th>상품</th><th>금액</th><th>상태</th></tr></thead>
            <tbody>
              {orders.map(o=>(
                <tr key={o.id}>
                  <td>{o.id}</td><td>{o.date}</td><td>{o.item}</td><td>{fmt(o.amount)}</td>
                  <td><span className={"badge "+(o.status==='결제대기'?'badge-n':'badge-s1')}>{o.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      }
      {tab==='pets' &&
        <div>
          <div className="pet-grid">
            {pets.map(p=>(
              <div className="pet-card" key={p.name}>
                <div className="pet-avatar"></div>
                <div className="pet-name">{p.name}</div>
                <div className="pet-sub">{p.info}</div>
              </div>
            ))}
            <div className="pet-card" style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', borderStyle:'dashed', cursor:'pointer', color:'var(--n7)'}} onClick={()=>showToast('반려동물 등록 폼을 준비 중이에요')}>
              <Icon name="plus" size={18}/>
              <div className="pet-sub" style={{marginTop:6}}>반려동물 등록</div>
            </div>
          </div>
        </div>
      }
      {tab==='sub' &&
        <div className="card-block">
          <div className="sub-title">진행 중인 정기구독</div>
          <div className="sub-meta" style={{marginTop:8}}>정기구독 관리 메뉴에서 다음 결제일과 해지 여부를 확인할 수 있어요.</div>
        </div>
      }
    </div>
  );
}

function CartView({cart, updateQty, removeItem, setView, showToast}){
  const [confirmOrder, setConfirmOrder] = useState(false);
  const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const delivery = subtotal>0 && subtotal<30000 ? 3000 : 0;
  const total = subtotal + delivery;
  return (
    <div className="page">
      <div className="page-head"><h1>장바구니</h1></div>
      {cart.length===0
        ? <div className="empty-state"><Icon name="shopping-cart" size={36}/><p>장바구니가 비어있어요</p><div style={{marginTop:14}}><button className="btn-primary" style={{display:'inline-flex'}} onClick={()=>setView('main')}>상품 둘러보기</button></div></div>
        : <React.Fragment>
          <div className="card-block">
            {cart.map((c,idx)=>(
              <div className="cart-item" key={idx}>
                <img src={img(c.img,120,120)} alt={c.name}/>
                <div style={{flex:1}}>
                  <div className="ci-name">{c.name}</div>
                  <div className="ci-opt">{c.opt}</div>
                </div>
                <div className="qty-row" style={{marginTop:0}}>
                  <button className="qty-btn" onClick={()=>updateQty(idx,-1)}><Icon name="minus" size={13}/></button>
                  <span style={{fontWeight:700, fontSize:14}}>{c.qty}</span>
                  <button className="qty-btn" onClick={()=>updateQty(idx,1)}><Icon name="plus" size={13}/></button>
                </div>
                <strong style={{width:90, textAlign:'right'}}>{fmt(c.price*c.qty)}</strong>
                <button className="icon-btn" onClick={()=>removeItem(idx)}><Icon name="x" size={16}/></button>
              </div>
            ))}
          </div>
          <div className="cart-summary">
            <div className="cart-summary-row"><span>상품 금액</span><span>{fmt(subtotal)}</span></div>
            <div className="cart-summary-row"><span>배송비</span><span>{delivery===0?'무료':fmt(delivery)}</span></div>
            <div className="cart-summary-row total"><span>총 결제금액</span><span>{fmt(total)}</span></div>
            <button className="btn-primary" style={{width:'100%', marginTop:16}} onClick={()=>setConfirmOrder(true)}>주문하기</button>
          </div>
        </React.Fragment>
      }
      {confirmOrder &&
        <ConfirmModal data={{
          title:'주문을 진행할까요?',
          desc:`총 ${fmt(total)}을 결제하고 주문을 완료합니다.`,
          confirmLabel:'결제하고 주문',
          onConfirm:()=>{showToast('주문이 완료되었어요'); setView('main');}
        }} onClose={()=>setConfirmOrder(false)}/>
      }
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [filters, setFilters] = useState({pet:'all', cat:'all', price:'all', subOnly:false});
  const [openSegment, setOpenSegment] = useState(null);
  const [likes, setLikes] = useState({});
  const [quickProduct, setQuickProduct] = useState(null);
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState(null);
  const [loggedIn, setLoggedIn] = useState(false);
  const [subs, setSubs] = useState([
    {id:1, products:[PRODUCTS[7]], amount:32000, nextDate:'2026.09.20', status:'활성'},
    {id:2, products:[PRODUCTS[8]], amount:26000, nextDate:'2026.09.05', status:'결제실패'},
  ]);

  useEffect(()=>{ lucide.createIcons(); });
  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2400);
    return ()=>clearTimeout(t);
  },[toast]);

  const toggleLike = (id) => setLikes({...likes, [id]:!likes[id]});
  const addToCart = (p, opt, qty) => {
    setCart(prev=>{
      const idx = prev.findIndex(c=>c.id===p.id && c.opt===opt);
      if(idx>=0){ const next=[...prev]; next[idx]={...next[idx], qty:next[idx].qty+qty}; return next; }
      return [...prev, {id:p.id, name:p.name, price:p.price, img:p.img, opt, qty}];
    });
    setToast('장바구니에 담았어요');
  };
  const updateQty = (idx, d) => setCart(prev=>{
    const next=[...prev]; next[idx]={...next[idx], qty:Math.max(1,next[idx].qty+d)}; return next;
  });
  const removeItem = (idx) => setCart(prev=>prev.filter((_,i)=>i!==idx));
  const addSubscription = (products, amount) => {
    setSubs(prev=>[...prev, {id:Date.now(), products, amount, nextDate:'2026.10.03', status:'활성'}]);
  };
  const updateSub = (id, patch) => setSubs(prev=>prev.map(s=>s.id===id?{...s,...patch}:s));

  const cartCount = cart.reduce((s,c)=>s+c.qty,0);

  return (
    <div className="app" onClick={()=>openSegment && setOpenSegment(null)}>
      <Header view={view} setView={setView} filters={filters} setFilters={setFilters} cartCount={cartCount} openSegment={openSegment} setOpenSegment={setOpenSegment}/>
      <main className="main">
        {view==='main' &&
          <MainView filters={filters} setFilters={setFilters} openSegment={openSegment} setOpenSegment={setOpenSegment}
            likes={likes} toggleLike={toggleLike} onOpenProduct={setQuickProduct} setView={setView}/>
        }
        {view==='balance-kit' && <BalanceKitView setView={setView} addSubscription={addSubscription} showToast={setToast}/>}
        {view==='subscription' && <SubscriptionView subs={subs} updateSub={updateSub} setView={setView} showToast={setToast}/>}
        {view==='mypage' && <MyPageView loggedIn={loggedIn} setLoggedIn={setLoggedIn} showToast={setToast}/>}
        {view==='cart' && <CartView cart={cart} updateQty={updateQty} removeItem={removeItem} setView={setView} showToast={setToast}/>}
      </main>
      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col footer-brand">
            <div className="brand"><span className="brand-mark"><Icon name="paw-print" size={16}/></span>펫밸런스</div>
            <p>© 2026 펫밸런스 — 자체 개발 프로젝트<br/>본 사이트는 데모 목적의 샘플 프로젝트입니다.</p>
          </div>
          <div className="footer-col"><h4>쇼핑</h4><a>전체 상품</a><a>밸런스키트</a><a>정기구독</a></div>
          <div className="footer-col"><h4>고객지원</h4><a>자주 묻는 질문</a><a>카카오톡 문의</a><a>배송 안내</a></div>
          <div className="footer-col"><h4>지사몰 안내</h4><a>지사몰 소개</a><a>입점 문의</a><a>이용약관</a></div>
        </div>
      </footer>
      {quickProduct && <QuickView product={quickProduct} onClose={()=>setQuickProduct(null)} addToCart={addToCart}/>}
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
