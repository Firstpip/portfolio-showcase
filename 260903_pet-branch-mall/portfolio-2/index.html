<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>펫밸런스 지사몰 통합관리자 — 구현 데모</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 295°, light) ── */
:root{
  --m50:#f8eff9; --m100:#f2dff4; --m200:#e5bfe9; --m300:#d599db; --m400:#c36ecc;
  --m500:#b345bd; --m600:#a21caf; --m700:#851790; --m800:#681270; --m900:#490d4f;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#f0eff0; --n3:#e6e5e6; --n4:#d7d5d7;
  --n5:#bab5ba; --n6:#979098; --n7:#79717a; --n8:#262626; --n9:#3a363a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif; background:var(--n1); color:var(--n8); font-size:14px; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select{font-family:inherit;}
a{text-decoration:none; color:inherit;}
table{border-collapse:collapse; width:100%;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes rowIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
@keyframes modalPop{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ── shell ── */
.shell{display:flex; width:100%; min-height:100vh;}
.sidebar{position:fixed; left:0; top:0; bottom:0; width:240px; background:var(--n0); border-right:1px solid var(--n3); display:flex; flex-direction:column; overflow-y:auto; z-index:30;}
.sidebar-brand{padding:18px 18px 14px; border-bottom:1px solid var(--n3); background-image:radial-gradient(var(--n3) 1px, transparent 1px); background-size:14px 14px;}
.sb-logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--n9);}
.sb-logo .mark{width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg, var(--m500), var(--m800)); color:#fff; display:flex; align-items:center; justify-content:center;}
.env-pill{margin-top:10px; display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--n7); background:var(--n2); padding:6px 10px; border-radius:8px;}
.env-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--s1); animation:pulseDot 2s infinite;}
.sidebar-section{padding:14px 12px 4px;}
.sidebar-section-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--n6); padding:6px 10px;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--n8); margin-bottom:2px;}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50); color:var(--m700);}
.sidebar-link i{font-size:16px; flex-shrink:0;}
.sidebar-foot{margin-top:auto; padding:14px; border-top:1px solid var(--n3); font-size:11.5px; color:var(--n6);}

.main-wrap{flex:1; min-width:0; width:calc(100% - 240px); margin-left:240px; display:flex; flex-direction:column;}
.page-header{background:var(--n0); border-bottom:1px solid var(--n3); padding:18px 28px;}
.page-title-row{display:flex; justify-content:space-between; align-items:center;}
.page-title{font-size:19px; font-weight:800; color:var(--n9);}
.page-actions{display:flex; gap:8px;}
.page-meta{font-size:12px; color:var(--n6); margin-top:6px;}
.btn-secondary{display:flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--n4); border-radius:8px; font-size:12.5px; font-weight:600; background:var(--n0); color:var(--n8);}
.btn-secondary:hover{background:var(--n2);}
.btn-primary{display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:700; background:var(--m600); color:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05);}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{opacity:.4; cursor:default;}

.content{padding:22px 28px 48px;}

/* stat row */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat-card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:16px 18px; animation:fadeInUp .35s ease both;}
.stat-label{font-size:11.5px; font-weight:600; color:var(--n6);}
.stat-value{font-size:26px; font-weight:800; color:var(--n9); margin-top:6px;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--s1);}
.stat-delta.negative{color:var(--s2);}
.stat-delta.neutral{color:var(--n6);}
.stat-sparkline{margin-top:8px; display:block;}

/* master-detail split */
.split{display:flex; gap:16px; align-items:flex-start;}
.list-rail{width:320px; flex-shrink:0; background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.list-rail-head{padding:12px; border-bottom:1px solid var(--n3);}
.search-input{display:flex; align-items:center; gap:8px; background:var(--n1); border:1px solid var(--n3); border-radius:8px; padding:8px 10px;}
.search-input input{border:none; background:none; outline:none; font-size:12.5px; flex:1; color:var(--n8);}
.list-rail-count{font-size:11px; color:var(--n6); padding:8px 12px 0;}
.list-rail-body{max-height:560px; overflow-y:auto;}
.mall-row{display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--n2); animation:rowIn .3s ease both;}
.mall-row:hover{background:var(--n1);}
.mall-row.selected{background:var(--m50); border-left:3px solid var(--m600); padding-left:9px;}
.mall-avatar{width:32px; height:32px; border-radius:8px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.mall-row-body{flex:1; min-width:0;}
.mall-row-name{font-size:12.5px; font-weight:700; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mall-row-meta{font-size:11px; color:var(--n6); margin-top:2px;}
.load-more{width:100%; padding:11px; font-size:12px; font-weight:600; color:var(--n7); border-top:1px solid var(--n3);}
.load-more:hover{background:var(--n1);}

.detail-panel{flex:1; min-width:0; background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:18px;}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.detail-head h3{font-size:16px; font-weight:800; color:var(--n9);}
.detail-head .sub{font-size:12px; color:var(--n6); margin-top:3px;}

.tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--n3); margin-bottom:14px;}
.tab{padding:9px 4px; margin-right:18px; font-size:13px; font-weight:600; color:var(--n6); border-bottom:2px solid transparent; position:relative; top:1px;}
.tab.active{color:var(--m700); border-bottom-color:var(--m600);}

.data-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.filter-chip{display:flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--n3); border-radius:8px; font-size:12px; font-weight:600; color:var(--n7); background:var(--n0);}
.filter-chip.active{background:var(--m50); border-color:var(--m300); color:var(--m700);}
.export-btn{margin-left:auto; display:flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--n3); border-radius:8px; font-size:12px; font-weight:600; color:var(--n7);}

.data-table-wrap{overflow-x:auto;}
.data-table th{text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--n6); padding:9px 10px; border-bottom:1px solid var(--n3); white-space:nowrap;}
.data-table td{font-size:12.5px; color:var(--n8); padding:11px 10px; border-bottom:1px solid var(--n2); white-space:nowrap;}
.data-table tr{cursor:pointer;}
.data-table tbody tr:hover td{background:var(--n1);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:9999px;}
.badge-s1{background:var(--s1-bg); color:var(--s1-text);}
.badge-s2{background:var(--s2-bg); color:var(--s2-text);}
.badge-s3{background:var(--s3-bg); color:var(--s3-text);}
.badge-n{background:var(--n2); color:var(--n7);}

.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{border:1px solid var(--n3); border-radius:8px; padding:10px 12px;}
.field .fl{font-size:10.5px; font-weight:700; text-transform:uppercase; color:var(--n6); letter-spacing:.03em;}
.field .fv{font-size:13.5px; font-weight:600; color:var(--n9); margin-top:4px;}

/* generic content card */
.card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:18px; margin-bottom:14px;}
.card-title-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.card-title-row h3{font-size:14.5px; font-weight:800; color:var(--n9);}

/* mall-clone form */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.form-field{display:flex; flex-direction:column; gap:6px;}
.form-field label{font-size:12px; font-weight:700; color:var(--n7);}
.form-field input, .form-field select{border:1px solid var(--n4); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--n9); background:var(--n0);}
.form-field input:focus, .form-field select:focus{outline:2px solid var(--m300); border-color:var(--m600);}
.dropzone{border:1.5px dashed var(--n4); border-radius:10px; padding:22px; text-align:center; color:var(--n6); font-size:12.5px;}
.dropzone i{font-size:26px; color:var(--n5); display:block; margin-bottom:8px;}
.template-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px;}
.template-card{border:1.5px solid var(--n3); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.template-card:hover{transform:scale(1.02); border-color:var(--n5);}
.template-card.selected{border-color:var(--m600); box-shadow:0 0 0 3px var(--m50);}
.promo-card{transition:transform .15s ease;}
.promo-card:hover{transform:scale(1.015);}
.template-thumb{aspect-ratio:4/3; background:var(--n2);}
.template-thumb img{width:100%; height:100%; object-fit:cover;}
.template-name{padding:9px 10px; font-size:12px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}

/* promotion */
.promo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.promo-card{border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.promo-cover{aspect-ratio:16/9; background:var(--n2); position:relative;}
.promo-cover img{width:100%; height:100%; object-fit:cover;}
.promo-body{padding:12px;}
.promo-name{font-size:13px; font-weight:700;}
.promo-meta{font-size:11.5px; color:var(--n6); margin-top:4px;}
.chip-select{padding:8px 13px; border:1px solid var(--n3); border-radius:9999px; font-size:12px; font-weight:600; color:var(--n7);}
.chip-select.active{background:var(--m600); color:#fff; border-color:var(--m600);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(20,18,20,.42); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeIn .15s ease;}
.modal-box{width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--n0); border-radius:14px; padding:24px; animation:modalPop .2s cubic-bezier(.16,1,.3,1);}
.modal-box.sm{width:380px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-close{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.modal-close:hover{background:var(--n2);}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.btn-outline{flex:1; padding:10px; border:1px solid var(--n4); border-radius:8px; font-size:13px; font-weight:700; color:var(--n8); text-align:center;}
.btn-outline:hover{background:var(--n2);}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--n9); color:#fff; font-size:13px; font-weight:600; padding:12px 20px; border-radius:10px; z-index:200; animation:toastIn .22s ease; display:flex; align-items:center; gap:8px;}
.toast .dt{width:7px; height:7px; border-radius:50%; background:var(--s1);}

.empty{text-align:center; padding:50px 20px; color:var(--n6);}
.empty i{font-size:32px; color:var(--n4); display:block; margin-bottom:10px;}

@media (max-width:1100px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .split{flex-direction:column;}
  .list-rail{width:100%;}
  .form-grid, .settings-grid, .template-grid, .promo-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body data-archetype="stripe-multipane">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

/* ── mock data ── */
const REGIONS = ['강남','홍대','수원','대전','부산 해운대','대구','인천 송도','광주','제주','분당','일산','판교','수지','천안','청주','원주'];
const buildMalls = () => REGIONS.map((r,i)=>{
  const seedBase = (i+1)*37;
  const rev = 2400000 + (seedBase*4211)%9800000;
  const pending = Math.round(rev*0.18);
  const orders = 40 + (seedBase*7)%180;
  const lowStock = (seedBase*3)%9;
  const pg = ['완료','완료','완료','대기','실패'][i%5];
  const spark = Array.from({length:10},(_,k)=>30+((seedBase+k*17)%60));
  return {id:i+1, name:`펫밸런스 ${r}점`, region:r, revenue:rev, pending, orders, lowStock, pg,
    owner:['김도윤','이서준','박하은','최지우','정민재'][i%5], spark};
});
const MALLS_POOL = buildMalls();

const ORDERS = Array.from({length:9},(_,i)=>({
  id:`ORD-${72000+i}`, mall:MALLS_POOL[i%MALLS_POOL.length].name, date:`2026.09.0${(i%9)+1}`,
  amount:18000+i*3200, status:['배송중','배송완료','결제대기','배송완료','환불완료'][i%5]
}));
const SETTLE_ROWS = Array.from({length:8},(_,i)=>({
  mall:MALLS_POOL[i].name, depositor:`입금자${i+1}`, amount:120000+i*45000,
  matched:i%4!==3, date:`2026.09.0${(i%9)+1}`
}));
const PG_ROWS = MALLS_POOL.slice(0,10);

const fmt = n => n.toLocaleString('ko-KR') + '원';
const img = (seed,w,h) => `https://picsum.photos/seed/${seed}/${w}/${h}`;

function Sparkline({data, positive}){
  const w=90,h=28;
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg className="stat-sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={positive? 'var(--s1)':'var(--m500)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Toast({msg}){
  if(!msg) return null;
  return <div className="toast"><span className="dt"></span>{msg}</div>;
}

function ConfirmModal({data, onClose}){
  if(!data) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box sm" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{data.title}</h3></div>
        <p style={{fontSize:13, color:'var(--n7)', lineHeight:1.6}}>{data.desc}</p>
        <div className="modal-actions">
          <button className="btn-outline" onClick={onClose}>취소</button>
          <button className="btn-primary" style={{flex:1, justifyContent:'center'}} onClick={()=>{data.onConfirm(); onClose();}}>{data.confirmLabel||'확인'}</button>
        </div>
      </div>
    </div>
  );
}

function Sidebar({view, setView}){
  const items1 = [
    {key:'main', label:'지사몰 관리 콘솔', icon:'ph-squares-four'},
    {key:'mall-clone', label:'몰 생성 & 템플릿', icon:'ph-storefront'},
    {key:'promotion', label:'프로모션 & 주문 조회', icon:'ph-megaphone'},
  ];
  const items2 = [{key:'settlement', label:'정산 관리', icon:'ph-wallet'}];
  const items3 = [{key:'merchant', label:'점주 대시보드', icon:'ph-user-circle'}];
  const Item = (it) => (
    <a key={it.key} className={"sidebar-link"+(view===it.key?' active':'')} onClick={()=>setView(it.key)}>
      <i className={"ph "+it.icon}></i>{it.label}
    </a>
  );
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="sb-logo"><span className="mark"><i className="ph ph-paw-print"></i></span>펫밸런스 HQ</div>
        <div className="env-pill"><span className="dot"></span>운영 환경 · 16개 지사몰 연동</div>
      </div>
      <div className="sidebar-section">
        <div className="sidebar-section-title">본사 운영</div>
        {items1.map(Item)}
      </div>
      <div className="sidebar-section">
        <div className="sidebar-section-title">정산</div>
        {items2.map(Item)}
      </div>
      <div className="sidebar-section">
        <div className="sidebar-section-title">점주 뷰</div>
        {items3.map(Item)}
      </div>
      <div className="sidebar-foot">최근 동기화 09:41 · 자동 5분 주기</div>
    </aside>
  );
}

function PageHeader({title, meta, actions}){
  return (
    <header className="page-header">
      <div className="page-title-row">
        <h1 className="page-title">{title}</h1>
        <div className="page-actions">{actions}</div>
      </div>
      {meta && <div className="page-meta">{meta}</div>}
    </header>
  );
}

/* ── main: 지사몰 관리 콘솔 (master-detail) ── */
function MainConsole({malls, setMalls, showToast}){
  const [q, setQ] = useState('');
  const [selectedId, setSelectedId] = useState(malls[0].id);
  const [tab, setTab] = useState('orders');
  const [visibleCount, setVisibleCount] = useState(10);
  const selected = malls.find(m=>m.id===selectedId) || malls[0];

  const filtered = malls.filter(m=>m.name.includes(q) || m.region.includes(q));
  const totalRevenue = malls.reduce((s,m)=>s+m.revenue,0);
  const totalPending = malls.reduce((s,m)=>s+m.pending,0);
  const totalLowStock = malls.reduce((s,m)=>s+m.lowStock,0);

  const ordersMatched = ORDERS.filter(o=>o.mall===selected.name);
  const orders = ordersMatched.length >= 6 ? ordersMatched : ORDERS.slice(0,6);
  const settle = SETTLE_ROWS.filter(s=>s.mall===selected.name).length ? SETTLE_ROWS.filter(s=>s.mall===selected.name) : SETTLE_ROWS.slice(0,5);

  return (
    <React.Fragment>
      <PageHeader title="지사몰 관리 콘솔" meta={`마지막 업데이트 방금 전 · 총 ${malls.length}개 지사몰 표시 중`}
        actions={<React.Fragment>

/* ── mall-clone ── */
function MallCloneView({addMall, showToast}){
  const [form, setForm] = useState({name:'', biz:'', region:'', domain:''});
  const [template, setTemplate] = useState(0);
  const templates = [
    {name:'스탠다드 화이트', seed:'tpl-white'},
    {name:'내추럴 베이지', seed:'tpl-beige'},
    {name:'다크 프리미엄', seed:'tpl-dark'},
  ];
  const submit = () => {
    if(!form.name){ showToast('몰 이름을 입력해주세요'); return; }
    addMall(form.name);
    showToast(`${form.name} 지사몰이 생성되었어요`);
    setForm({name:'', biz:'', region:'', domain:''});
  };
  return (
    <React.Fragment>
      <PageHeader title="몰 생성 & 템플릿" meta="마스터몰 설정을 복제해 신규 지사몰을 만듭니다"/>
      <div className="content">
        <div className="card">
          <div className="card-title-row"><h3>기본 정보</h3></div>
          <div className="form-grid">
            <div className="form-field"><label>몰 이름</label><input placeholder="예) 펫밸런스 성수점" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
            <div className="form-field"><label>사업자 등록번호</label><input placeholder="000-00-00000" value={form.biz} onChange={e=>setForm({...form,biz:e.target.value})}/></div>
            <div className="form-field"><label>담당 지역</label><input placeholder="예) 서울 성수" value={form.region} onChange={e=>setForm({...form,region:e.target.value})}/></div>
            <div className="form-field"><label>개별 도메인</label><input placeholder="seongsu.pet-balance.co.kr" value={form.domain} onChange={e=>setForm({...form,domain:e.target.value})}/></div>
          </div>
          <div style={{marginTop:16}}>
            <label style={{fontSize:12, fontWeight:700, color:'var(--n7)'}}>로고 업로드</label>
            <div className="dropzone" style={{marginTop:8}}><i className="ph ph-upload-simple"></i>로고 이미지를 드래그하거나 클릭해 업로드하세요</div>
          </div>
        </div>

        <div className="card">
          <div className="card-title-row"><h3>디자인 템플릿 선택</h3><span style={{fontSize:12, color:'var(--n6)'}}>2~3종 중 선택</span></div>
          <div className="template-grid">
            {templates.map((t,i)=>(
              <div key={t.name} className={"template-card"+(template===i?' selected':'')} onClick={()=>setTemplate(i)}>
                <div className="template-thumb"><img src={img(t.seed,300,220)} alt={t.name}/></div>
                <div className="template-name">{t.name}{template===i && <i className="ph ph-check-circle" style={{color:'var(--m600)'}}></i>}</div>
              </div>
            ))}
          </div>
        </div>

        <button className="btn-primary" style={{padding:'12px 22px'}} onClick={submit}><i className="ph ph-plus-circle"></i> 몰 생성하기</button>
      </div>
    </React.Fragment>
  );
}

        <section className="stat-row" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
          <div className="stat-card"><div className="stat-label">이번달 매출</div><div className="stat-value">{fmt(MALLS_POOL[0].revenue)}</div><Sparkline data={MALLS_POOL[0].spark} positive/></div>
          <div className="stat-card"><div className="stat-label">이번달 주문건수</div><div className="stat-value">{MALLS_POOL[0].orders}</div><Sparkline data={MALLS_POOL[0].spark.slice().reverse()} positive/></div>
          <div className="stat-card"><div className="stat-label">예치 잔액</div><div className="stat-value">{fmt(1280000)}</div><Sparkline data={[50,48,44,40,38,35,32]}/></div>
        </section>
        <div className="card">
          <div className="card-title-row"><h3>최근 주문</h3></div>
          <div className="data-table-wrap">
            <table className="data-table">
              <thead><tr><th>주문번호</th><th>일자</th><th>금액</th><th>상태</th></tr></thead>
              <tbody>
                {ORDERS.slice(0,6).map(o=>(
                  <tr key={o.id}><td>{o.id}</td><td>{o.date}</td><td>{fmt(o.amount)}</td>
                  <td><span className={"badge "+(o.status==='환불완료'?'badge-s2':'badge-n')}>{o.status}</span></td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [malls, setMalls] = useState(MALLS_POOL);
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2400);
    return ()=>clearTimeout(t);
  },[toast]);

  const addMall = (name) => {
    setMalls(prev=>{
      const id = prev.length+1;
      const seedBase=(id+1)*37;
      const spark = Array.from({length:10},(_,k)=>30+((seedBase+k*17)%60));
      return [{id, name, region:'신규', revenue:0, pending:0, orders:0, lowStock:0, pg:'대기', owner:'미배정', spark}, ...prev];
    });
  };

  return (
    <div className="shell">
      <Sidebar view={view} setView={setView}/>
      <div className="main-wrap">
        {view==='main' && <MainConsole malls={malls} setMalls={setMalls} showToast={setToast}/>}
        {view==='mall-clone' && <MallCloneView addMall={addMall} showToast={setToast}/>}
        {view==='settlement' && <SettlementView malls={malls} showToast={setToast}/>}
        {view==='promotion' && <PromotionView malls={malls} showToast={setToast}/>}
        {view==='merchant' && <MerchantView/>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
