<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 파이프라인 진단 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#fafaf9; --surface:#ffffff; --border:#e8e6e5; --border-muted:#d6d3d1;
    --text:#0c0a09; --text-secondary:#78716c; --text-muted:#a8a29e;
    --primary:#3ba6f1; --primary-edge:#3398e1; --accent:#ef2436; --highlight-bg:#c1e1f7; --soot:#1c1917;
    --r-card:10px; --r-pill:9999px; --r-input:6px; --r-icon:4px; --r-feature:16px;
    --shadow-card:0 4px 16px rgba(0,0,0,.05); --shadow-float:0 12px 45px rgba(17,12,46,.12); --shadow-subtle:0 1px 2px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,sans-serif; background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-muted);border-radius:8px;}

  /* ── App shell ── */
  .app-shell{display:flex;width:100%;min-height:100vh;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--surface);
    border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--border);}
  .sidebar-brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;}
  .sidebar-brand .word{font-size:15px;font-weight:600;letter-spacing:-0.2px;}
  .sidebar-env{margin:12px 16px 4px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r-pill);font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg);}
  .sidebar-env .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulseDot 2s infinite;}
  .sidebar-scroll{flex:1;overflow-y:auto;padding:8px 12px 16px;}
  .sidebar-section{margin-top:18px;}
  .sidebar-section-title{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);padding:0 10px;margin-bottom:6px;font-weight:600;}
  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;}
  .sidebar-link:hover{background:var(--bg);color:var(--text);}
  .sidebar-link.active{background:var(--highlight-bg);color:var(--primary-edge);font-weight:600;}
  .sidebar-link svg{width:16px;height:16px;flex-shrink:0;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);}

  .main-wrap{margin-left:248px;flex:1;min-width:0;width:calc(100% - 248px);min-height:100vh;display:flex;flex-direction:column;}

  .page-header{padding:24px 32px 0;}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:32px;font-weight:600;letter-spacing:-0.8px;margin:0;}
  .page-sub{font-size:13px;color:var(--text-secondary);margin-top:4px;}
  .page-actions{display:flex;gap:8px;}
  .btn{border-radius:var(--r-pill);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:transform .12s,box-shadow .12s,background .15s;}
  .btn:active{transform:scale(.97);}
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--primary);border-color:var(--primary-edge);color:#fff;}
  .btn-primary:hover{box-shadow:0 4px 12px rgba(59,166,241,.35);}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--surface);border-color:var(--border-muted);}
  .btn-danger{background:transparent;border-color:var(--accent);color:var(--accent);}
  .page-meta{font-size:12px;color:var(--text-muted);margin-top:10px;padding-bottom:16px;border-bottom:1px solid var(--border);}

  .content{padding:24px 32px 60px;}

  /* insight-board composition */
  .insight-board{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
  .hero-viz{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:24px;box-shadow:var(--shadow-card);}
  .hero-viz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .hero-viz-head h2{font-size:16px;font-weight:600;margin:0;}
  .hero-viz-head .hint{font-size:12px;color:var(--text-muted);}
  .funnel-row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:8px;cursor:pointer;transition:background .15s;}
  .funnel-row:hover{background:var(--bg);}
  .funnel-row.selected{background:var(--highlight-bg);}
  .funnel-label{width:78px;flex-shrink:0;font-size:12.5px;color:var(--text-secondary);font-weight:500;}
  .funnel-track{flex:1;height:26px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--border);}
  .funnel-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--primary-edge));display:flex;align-items:center;padding-left:10px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
  .funnel-row.fail-heavy .funnel-fill{background:linear-gradient(90deg,var(--accent),#ff6b57);}
  .funnel-meta{width:120px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--text-muted);}
  .funnel-meta b{color:var(--text);font-weight:600;}

  .stage-detail{margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);animation:fadeIn .25s ease both;}
  .stage-detail-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .stage-timeline{display:flex;gap:8px;flex-wrap:wrap;}
  .stage-chip{border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 12px;font-size:11.5px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg);}
  .stage-chip b{color:var(--text);}

  .kpi-side{display:flex;flex-direction:column;gap:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px;box-shadow:var(--shadow-card);transition:transform .2s ease,box-shadow .2s ease;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(12,10,9,.1);}
  .stat-label{font-size:11.5px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;}
  .stat-value{font-size:28px;font-weight:600;letter-spacing:-0.7px;}
  .stat-delta{font-size:11.5px;font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
  .stat-delta.positive{color:#1a9f6c;}
  .stat-delta.negative{color:var(--accent);}
  .stat-sparkline{margin-top:10px;width:100%;height:28px;display:block;}

  .widget-grid{grid-column:1 / -1;display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:20px;}
  .widget{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow-card);}
  .widget h3{font-size:14px;font-weight:600;margin:0 0 14px;}

  .donut-wrap{display:flex;align-items:center;gap:16px;}
  .donut-legend{flex:1;font-size:12px;}
  .donut-legend-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;cursor:pointer;border-radius:6px;transition:background .12s;}
  .donut-legend-row:hover{background:var(--bg);}
  .donut-legend-row.dim{opacity:.35;}
  .legend-swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;}

  .weight-summary-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border);}
  .weight-summary-row:last-of-type{border-bottom:none;}
  .weight-bar-mini{width:90px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden;}
  .weight-bar-mini > div{height:100%;background:var(--primary);}

  .tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .tab{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--text-secondary);padding:8px 4px;cursor:pointer;position:relative;font-weight:500;}
  .tab.active{color:var(--text);}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data-table th{text-align:left;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  table.data-table td{padding:11px 10px;border-bottom:1px solid var(--border);}
  table.data-table tbody tr{cursor:pointer;transition:background .12s;}
  table.data-table tbody tr:hover{background:var(--bg);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;}
  .badge.ok{background:#e5f7ee;color:#1a9f6c;}
  .badge.search-fail{background:#fdecea;color:var(--accent);}
  .badge.evidence-low{background:#fff4e0;color:#b8720a;}
  .badge.chunk-err{background:#eef1fc;color:#4a5bd4;}

  /* generic screen head */
  .screen-head{margin-bottom:20px;}
  .screen-head h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-0.3px;}
  .screen-head p{font-size:13px;color:var(--text-secondary);margin:0;max-width:640px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow-card);}
  .panel + .panel{margin-top:18px;}

  /* hybrid retrieval */
  .weight-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .weight-item label{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px;}
  .weight-item input[type=range]{width:100%;accent-color:var(--primary);}
  .weight-item .desc{font-size:11px;color:var(--text-muted);margin-top:4px;}
  .filter-chip{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:6px 13px;font-size:12px;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
  .filter-chip.active{background:var(--soot);border-color:var(--soot);color:#fff;}
  .url-state{margin-top:14px;display:flex;align-items:center;gap:8px;}
  .url-state input{flex:1;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text-secondary);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-input);padding:8px 10px;}
  .result-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .result-row:last-child{border-bottom:none;}
  .rank-badge{width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .result-title{font-size:13px;font-weight:600;}
  .result-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .result-score{width:110px;text-align:right;font-size:12px;font-weight:600;color:var(--primary-edge);}
  .rank-move{font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px;margin-left:6px;}
  .rank-move.up{color:#1a9f6c;}
  .rank-move.down{color:var(--accent);}

  /* reranker compare */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .compare-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .compare-col-head h4{font-size:13px;font-weight:600;margin:0;}
  .doc-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;background:var(--bg);position:relative;transition:transform .3s ease;}
  .doc-card .doc-title{font-weight:600;}
  .doc-card .doc-score{font-size:11px;color:var(--text-muted);margin-top:3px;}

  /* answer quality */
  .query-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .query-chip{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:8px 14px;font-size:12px;cursor:pointer;color:var(--text-secondary);font-family:inherit;max-width:280px;text-align:left;}
  .query-chip.active{border-color:var(--primary);color:var(--primary-edge);background:var(--highlight-bg);font-weight:600;}
  .confidence-bar{width:100%;height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:6px 0 16px;}
  .confidence-bar > div{height:100%;border-radius:8px;transition:width .5s ease;}
  .answer-text{font-size:14.5px;line-height:1.75;}
  .cite{color:var(--primary-edge);font-weight:700;cursor:pointer;padding:0 1px;}
  .source-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .source-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;cursor:pointer;background:var(--bg);}
  .source-item:hover{border-color:var(--primary);}
  .fallback-box{border:1px dashed var(--accent);background:#fdecea;border-radius:var(--r-card);padding:20px;}
  .fallback-box h4{margin:0 0 8px;color:var(--accent);font-size:14px;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(12,10,9,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease;}
  .modal-box{background:var(--surface);border-radius:var(--r-feature);max-width:560px;width:92%;max-height:82vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow-float);animation:fadeInScale .22s cubic-bezier(.2,.9,.3,1);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal-head h3{font-size:17px;font-weight:600;margin:0;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;}
  .modal-chunk{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.7;color:var(--text-secondary);margin-top:10px;}

  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--soot);color:#fff;padding:12px 22px;border-radius:var(--r-pill);font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;animation:toastIn .3s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow-float);}

  .highlight{color:var(--primary-edge);background:var(--highlight-bg);padding:1px 8px;border-radius:4px;font-weight:500;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes barGrow{from{width:0;}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes spinIcon{to{transform:rotate(360deg);}}
  .spin{animation:spinIcon 1s linear infinite;}
  @keyframes rowStagger{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .stagger-row{animation:rowStagger .35s ease both;}

  @media (max-width:1180px){
    .insight-board{grid-template-columns:1fr;}
    .widget-grid{grid-template-columns:1fr;}
    .compare-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo, useEffect, useRef} = React;

/* ───────────────── mock data ───────────────── */
const STAGES = [
  {id:'ingest',   name:'문서 수집', ms:420, throughput:1240, failRate:1.2},

  {id:'generate', name:'답변 생성', ms:620, throughput:1011, failRate:5.9},
];
const maxThroughput = Math.max(...STAGES.map(s=>s.throughput));

const LOGS = [
  {id:1, text:'유학생 아르바이트 시간 제한이 어떻게 되나요', lang:'KO', type:null, stage:'-', time:'10:42', latency:'1.1s'},
  {id:2, text:'특정활동 비자에서 거주 비자로 변경 절차', lang:'KO', type:'근거부족', stage:'생성', time:'10:38', latency:'2.4s'},
  {id:3, text:'체류자격외활동 허가 신청 서류 목록', lang:'KO', type:'검색실패', stage:'검색', time:'10:31', latency:'2.0s'},
  {id:4, text:'F-4 동포비자 소지자의 취업 제한 범위', lang:'KO', type:null, stage:'-', time:'10:25', latency:'0.9s'},
  {id:5, text:'단기방문(C-3) 비자 연장이 가능한가요', lang:'KO', type:'청킹오류', stage:'청킹', time:'10:19', latency:'1.6s'},
  {id:6, text:'결혼이민(F-6) 비자 국적 취득 요건', lang:'KO', type:null, stage:'-', time:'10:11', latency:'1.0s'},
  {id:7, text:'고용허가제(E-9) 사업장 변경 사유', lang:'KO', type:'검색실패', stage:'검색', time:'10:04', latency:'2.2s'},
  {id:8, text:'영주권(F-5) 신청 시 소득 기준', lang:'KO', type:'근거부족', stage:'생성', time:'09:58', latency:'2.6s'},
];

const FAILURE_DIST = [
  {key:'검색실패', pct:45, color:'#ef2436'},
  {key:'근거부족', pct:35, color:'#f0a93a'},
  {key:'청킹오류', pct:20, color:'#4a5bd4'},
];

const DOCS = [
  {id:'d1', title:'출입국관리법 시행규칙 제25조', type:'법령', date:'2025.03', vector:0.91, keyword:0.62, meta:0.9},
  {id:'d2', title:'체류자격외활동허가 안내(법무부)', type:'안내서', date:'2024.11', vector:0.84, keyword:0.88, meta:0.7},
  {id:'d3', title:'외국인 근로자 사업장 변경 지침', type:'지침', date:'2023.08', vector:0.62, keyword:0.7, meta:0.4},
  {id:'d4', title:'거주(F-2) 자격 변경 요건 해설', type:'해설자료', date:'2026.01', vector:0.77, keyword:0.55, meta:0.95},
  {id:'d5', title:'결혼이민자 국적 취득 절차 안내', type:'안내서', date:'2022.05', vector:0.58, keyword:0.66, meta:0.3},
  {id:'d6', title:'단기방문 체류기간 연장 고시', type:'고시', date:'2025.09', vector:0.7, keyword:0.4, meta:0.85},
];

const RERANK_QUERIES = [
  {id:'q1', text:'체류자격외활동 허가 신청 서류 목록', extraMs:142,
    before:['안내서 v2.1 — 체류자격외활동 개요','법무부 공지 2023-114','시행규칙 제25조 발췌','관련 판례 요약','FAQ 모음집'],

/* ───────────────── small components ───────────────── */
function Icon({name, className, style}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[]);
  return <i data-lucide={name} className={className} style={style} ref={ref}></i>;
}

function Sparkline({points, color}){
  const w=100,h=28;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Toast({message, onClose}){
  useEffect(()=>{ const t=setTimeout(onClose,2600); return ()=>clearTimeout(t); },[message]);
  return <div className="toast"><Icon name="check-circle" style={{width:16,height:16}}/> {message}</div>;
}

function Modal({title, onClose, children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" style={{width:18,height:18}}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ───────────────── Hybrid retrieval screen ───────────────── */
function HybridRetrievalScreen(){
  const [weights, setWeights] = useState({vector:50, keyword:30, metadata:20});
  const [typeFilter, setTypeFilter] = useState([]);
  const [recentSort, setRecentSort] = useState(false);
  const [confirmedOnly, setConfirmedOnly] = useState(false);
  const [prevOrder, setPrevOrder] = useState(DOCS.map(d=>d.id));

  const allTypes = [...new Set(DOCS.map(d=>d.type))];

  const scored = useMemo(()=>{
    const v=weights.vector/100, k=weights.keyword/100, m=weights.metadata/100;
    let list = DOCS.map(d=>({...d, score: d.vector*v + d.keyword*k + d.meta*m}));
    if(typeFilter.length) list = list.filter(d=>typeFilter.includes(d.type));
    if(confirmedOnly) list = list.filter(d=>parseInt(d.date)>=2024);
    list.sort((a,b)=> recentSort ? (b.date.localeCompare(a.date)) : (b.score-a.score));
    return list;
  },[weights, typeFilter, recentSort, confirmedOnly]);

  useEffect(()=>{
    const t = setTimeout(()=> setPrevOrder(scored.map(d=>d.id)), 500);
    return ()=>clearTimeout(t);
  },[scored]);

  const setWeight = (key, val) => {
    val = Number(val);
    const rest = Object.keys(weights).filter(k=>k!==key);
    const remain = 100 - val;
    const restSum = rest.reduce((s,k)=>s+weights[k],0) || 1;
    const next = {...weights, [key]:val};
    rest.forEach(k=>{ next[k] = Math.round((weights[k]/restSum)*remain); });
    const diff = 100 - (next.vector+next.keyword+next.metadata);
    next[rest[0]] += diff;
    setWeights(next);
  };

  const toggleType = (t) => setTypeFilter(f=> f.includes(t) ? f.filter(x=>x!==t) : [...f, t]);

  const urlState = `?vector=${weights.vector}&keyword=${weights.keyword}&metadata=${weights.metadata}${typeFilter.length?'&type='+typeFilter.join(','):''}${recentSort?'&sort=recent':''}${confirmedOnly?'&confirmed=1':''}`;

  return (
    <div>
      <div className="screen-head">
        <h2>하이브리드 검색 설정</h2>
        <p>벡터 유사도, 키워드 매칭, 메타데이터 필터의 가중치를 조정하면 결과 순위가 즉시 재계산됩니다</p>
      </div>

      <div className="panel">
        <div className="weight-controls">
          {[['vector','벡터 유사도','pgvector 코사인 유사도'],['keyword','키워드 매칭','Postgres tsvector 전문 검색'],['metadata','메타데이터 필터','문서유형·시행일 가중']].map(([key,label,desc])=>(
            <div className="weight-item" key={key}>
              <label><span>{label}</span><span>{weights[key]}%</span></label>
              <input type="range" min="0" max="100" value={weights[key]} onChange={e=>setWeight(key, e.target.value)}/>
              <div className="desc">{desc}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:20}}>
          {allTypes.map(t=>(
            <button key={t} className={"filter-chip"+(typeFilter.includes(t)?' active':'')} onClick={()=>toggleType(t)}>{t}</button>
          ))}
          <button className={"filter-chip"+(recentSort?' active':'')} onClick={()=>setRecentSort(v=>!v)}>시행일 최근순</button>
          <button className={"filter-chip"+(confirmedOnly?' active':'')} onClick={()=>setConfirmedOnly(v=>!v)}>2024년 이후 확인 문서만</button>
        </div>
        <div className="url-state">
          <Icon name="link" style={{width:14,height:14,color:'var(--text-muted)'}}/>
          <input readOnly value={urlState}/>
        </div>
      </div>

      <div className="panel">
        <h3 style={{fontSize:14,fontWeight:600,margin:'0 0 4px'}}>검색 결과 ({scored.length}건)</h3>
        <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:6}}>가중치 조합에 따라 순위가 재정렬됩니다 — 이동 방향이 함께 표시됩니다</div>
        {scored.map((d, idx)=>{
          const prevIdx = prevOrder.indexOf(d.id);
          const moved = prevIdx - idx;
          return (
            <div className="result-row" key={d.id}>
              <div className="rank-badge">{idx+1}</div>
              <div style={{flex:1}}>
                <div className="result-title">{d.title}
                  {moved>0 && <span className="rank-move up"><Icon name="arrow-up" style={{width:10,height:10}}/>{moved}</span>}
                  {moved<0 && <span className="rank-move down"><Icon name="arrow-down" style={{width:10,height:10}}/>{Math.abs(moved)}</span>}
                </div>
                <div className="result-sub">{d.type} · {d.date}</div>
              </div>
              <div className="result-score">{(d.score*100).toFixed(1)}점</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ───────────────── Reranker compare screen ───────────────── */
function RerankerCompareScreen(){
  const [qid, setQid] = useState(RERANK_QUERIES[0].id);
  const [spinKey, setSpinKey] = useState(0);
  const [running, setRunning] = useState(false);
  const q = RERANK_QUERIES.find(r=>r.id===qid);

  const rerun = () => {
    setRunning(true);
    setTimeout(()=>{ setRunning(false); setSpinKey(k=>k+1); }, 650);
  };

  const moveInfo = (title, list) => {
    const before = q.before.indexOf(title);
    const after = list.indexOf(title);
    return before - after;
  };

  return (
    <div>
      <div className="screen-head">
        <h2>리랭커 A/B 비교</h2>
        <p>동일 질의를 리랭커 적용/미적용 두 경로로 실행해 순위 변화와 처리 지연을 대조합니다</p>
      </div>

      <div className="panel">
        <div className="query-picker">
          {RERANK_QUERIES.map(r=>(
            <button key={r.id} className={"query-chip"+(qid===r.id?' active':'')} onClick={()=>setQid(r.id)}>{r.text}</button>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={{fontSize:12.5,color:'var(--text-secondary)'}}>리랭커 적용 시 추가 처리시간 <b style={{color:'var(--text)'}}>+{q.extraMs}ms</b></div>
          <button className="btn btn-ghost" onClick={rerun}><Icon name="refresh-cw" className={running?'spin':''} style={{width:14,height:14}}/> 다시 실행</button>
        </div>
        <div className="compare-grid" key={spinKey}>
          <div>
            <div className="compare-col-head"><h4>리랭커 미적용</h4><span style={{fontSize:11,color:'var(--text-muted)'}}>기본 벡터 순위</span></div>
            {q.before.map((t,i)=>(
              <div className="doc-card stagger-row" style={{animationDelay:(i*0.04)+'s'}} key={t}>
                <div className="doc-title">{i+1}. {t}</div>
                <div className="doc-score">순위 변동 없음</div>
              </div>
            ))}
          </div>
          <div>
            <div className="compare-col-head"><h4>리랭커 적용</h4><span style={{fontSize:11,color:'var(--primary-edge)',fontWeight:600}}>재정렬 완료</span></div>
            {q.after.map((t,i)=>{
              const mv = moveInfo(t, q.after);
              return (
                <div className="doc-card stagger-row" style={{animationDelay:(i*0.04+0.15)+'s', borderColor: mv!==0 ? 'var(--primary)' : 'var(--border)'}} key={t}>
                  <div className="doc-title">{i+1}. {t}
                    {mv>0 && <span className="rank-move up"><Icon name="arrow-up" style={{width:10,height:10}}/>{mv}</span>}
                    {mv<0 && <span className="rank-move down"><Icon name="arrow-down" style={{width:10,height:10}}/>{Math.abs(mv)}</span>}
                  </div>
                  <div className="doc-score">{mv===0?'순위 변동 없음':'리랭킹 스코어 재계산 반영'}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────────────── Answer quality screen ───────────────── */
function AnswerQualityScreen({openModal}){
  const [qid, setQid] = useState(AQ_QUERIES[0].id);
  const q = AQ_QUERIES.find(a=>a.id===qid);
  const barColor = q.confidence>=60 ? 'var(--primary)' : 'var(--accent)';

  return (
    <div>
      <div className="screen-head">
        <h2>답변 품질 검증</h2>
        <p>근거 문서 기반으로 생성된 답변과 출처를 함께 검증하고, 근거가 부족한 질의는 보류 처리합니다</p>
      </div>

      <div className="panel">
        <div className="query-picker">
          {AQ_QUERIES.map(a=>(
            <button key={a.id} className={"query-chip"+(qid===a.id?' active':'')} onClick={()=>setQid(a.id)}>{a.text}</button>
          ))}
        </div>

        <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:4}}>검색 신뢰도 (임계값 60%)</div>
        <div className="confidence-bar"><div style={{width:q.confidence+'%', background:barColor}}></div></div>

        {q.low ? (
          <div className="fallback-box">
            <h4><Icon name="alert-triangle" style={{width:15,height:15,verticalAlign:'-2px'}}/> 근거 부족 — 답변 보류</h4>
            <p style={{fontSize:13,color:'var(--text-secondary)',margin:'0 0 14px'}}>검색된 공식 문서가 질문의 핵심 요건을 충분히 뒷받침하지 못해, 단정적인 답변 대신 보류 안내로 전환합니다.</p>
            <button className="btn btn-primary" onClick={()=>document.dispatchEvent(new CustomEvent('toast',{detail:'상담 연결 요청이 접수되었습니다'}))}><Icon name="user-round"/> 전문가 상담 연결</button>
          </div>
        ) : (
          <div>
            <div className="answer-text">
              {q.answer.map((part,i)=> typeof part==='number'
                ? <sup className="cite" key={i} onClick={()=>openModal({fromAnswer:true, source:q.sources[part-1]})}>[{part}]</sup>
                : <span key={i}>{part}</span>
              )}
            </div>
            <div className="source-list">
              {q.sources.map(s=>(
                <div className="source-item" key={s.id} onClick={()=>openModal({fromAnswer:true, source:s})}>
                  <span><Icon name="file-text" style={{width:13,height:13,verticalAlign:'-2px',marginRight:6}}/>{s.name} · {s.date}</span>
                  <span style={{color:'var(--text-muted)'}}>{s.confirmed}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ───────────────── App ───────────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [modalData, setModalData] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);

  const toast = (msg) => setToastMsg(msg);

  useEffect(()=>{
    const gotoH = (e)=> setScreen(e.detail);
    const toastH = (e)=> setToastMsg(e.detail);
    document.addEventListener('goto', gotoH);
    document.addEventListener('toast', toastH);
    return ()=>{ document.removeEventListener('goto', gotoH); document.removeEventListener('toast', toastH); };
  },[]);

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main-wrap">
        {screen==='main' && <div className="page-header"><MainScreen openModal={setModalData} toast={toast}/></div>}
        {screen!=='main' && (
          <div className="page-header" style={{paddingBottom:0}}>
            <div className="content" style={{padding:'24px 0 0'}}>
              {screen==='hybrid-retrieval' && <HybridRetrievalScreen/>}
              {screen==='reranker-compare' && <RerankerCompareScreen/>}
              {screen==='answer-quality' && <AnswerQualityScreen openModal={setModalData}/>}
            </div>
          </div>
        )}
      </div>

      {modalData && !modalData.fromAnswer && (
        <Modal title="진단 로그 상세" onClose={()=>setModalData(null)}>
          <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>{modalData.text}</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            <div className="stage-chip">단계 <b>{modalData.stage}</b></div>
            <div className="stage-chip">지연 <b>{modalData.latency}</b></div>
            <div className="stage-chip">시각 <b>{modalData.time}</b></div>
            <div className="stage-chip">언어 <b>{modalData.lang}</b></div>
          </div>
          <div className="modal-chunk">
            {modalData.type==='검색실패' && '해당 질의와 코사인 유사도 0.4 이상인 문서가 검색되지 않아 상위 결과가 비어 있습니다. 하이브리드 검색 가중치 조정 또는 질의 재작성이 필요합니다.'}
            {modalData.type==='근거부족' && '검색된 문서가 존재하나 질문의 핵심 요건(요건·절차·기한)을 직접 언급하지 않아 근거 신뢰도가 임계값 미만으로 산출되었습니다.'}
            {modalData.type==='청킹오류' && '조문 경계가 청크 분할 지점과 어긋나 인용 대상 chunk가 문맥의 앞부분만 포함하고 있습니다. 청킹 규칙 재조정이 필요합니다.'}
            {!modalData.type && '해당 질의는 근거 확보율과 검색 신뢰도 모두 임계값을 충족하여 정상적으로 답변이 생성되었습니다.'}
          </div>
        </Modal>
      )}

      {modalData && modalData.fromAnswer && (
        <Modal title={modalData.source.name} onClose={()=>setModalData(null)}>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>{modalData.source.date} · {modalData.source.confirmed}</div>
          <div className="modal-chunk">{modalData.source.chunk}</div>
        </Modal>
      )}

      {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
