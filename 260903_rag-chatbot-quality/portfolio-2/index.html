<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다국어 RAG 품질 평가 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --bg:#f6f3f1; --card:#f6f3f1; --elevated:#cfdaf5; --ash:#cecac8;
    --ink:#242424; --graphite:#4e4d4d; --smoke:#797776; --off-black:#242424;
    --lake:#2b59d1; --mint:#a7fccd; --coral:#ff9473; --gold:#ecda98; --sky:#a0b5eb;
    --r-card:24px; --r-pill:100px;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #root{width:100%;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--ash);border-radius:8px;}

  .shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

  /* ── top navigation header ── */
  .app-header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ash);display:flex;align-items:center;gap:22px;padding:0 32px;height:64px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-0.3px;flex-shrink:0;}
  .brand .dot-mark{width:26px;height:26px;border-radius:50%;background:var(--lake);display:flex;align-items:center;justify-content:center;color:#fff;}
  .project-switcher{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--graphite);border:1px solid var(--ash);border-radius:var(--r-pill);padding:6px 14px;cursor:pointer;background:transparent;font-family:inherit;flex-shrink:0;}
  .global-nav{display:flex;gap:4px;flex:1;}
  .nav-link{background:none;border:none;font-family:inherit;font-size:13.5px;color:var(--graphite);padding:10px 14px;cursor:pointer;border-radius:var(--r-pill);font-weight:500;transition:background .15s,color .15s;}
  .nav-link:hover{background:var(--elevated);}
  .nav-link.active{background:var(--ink);color:#fff;}
  .header-actions{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--graphite);cursor:pointer;position:relative;padding:6px;border-radius:50%;font-size:19px;display:flex;}
  .icon-btn:hover{background:var(--elevated);}
  .icon-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--coral);}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--sky));flex-shrink:0;}

  .content{max-width:1320px;margin:0 auto;width:100%;padding:28px 32px 70px;flex:1;}

  .hero-band{position:relative;overflow:hidden;}
  .atmo-wash{position:absolute;top:-140px;right:-120px;width:560px;height:440px;background:linear-gradient(135deg,rgba(255,148,115,.5),rgba(160,181,235,.5) 55%,rgba(167,252,205,.4));filter:blur(72px);border-radius:50%;pointer-events:none;z-index:0;}
  .pipeline-strip{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin:2px 0 26px;flex-wrap:wrap;}
  .pipe-node{border:1px solid var(--ash);background:var(--bg);border-radius:9999px;padding:8px 16px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-transform:uppercase;letter-spacing:.02em;}
  .pipe-line{width:26px;height:1px;background:var(--ash);position:relative;flex-shrink:0;}
  .pipe-line::after{content:'';position:absolute;right:0;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ash);}
  .page-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .page-head h1{font-size:40px;font-weight:600;letter-spacing:-0.9px;margin:0;line-height:1.15;}
  .page-head p{font-size:13.5px;color:var(--graphite);margin:6px 0 0;max-width:560px;}
  .btn{border-radius:var(--r-pill);padding:12px 24px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;font-family:inherit;transition:transform .12s,opacity .15s;text-transform:uppercase;letter-spacing:.02em;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--lake);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink);}
  .btn-ghost:hover{background:var(--elevated);border-color:var(--elevated);}
  .btn-black{background:var(--off-black);color:#fff;}

  /* stat row */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{background:transparent;border:1px solid var(--ash);border-radius:var(--r-card);padding:22px 24px;transition:transform .15s ease,border-color .15s ease;}
  .stat-card:hover{transform:scale(1.02);border-color:var(--lake);}
  .stat-label{font-size:11.5px;color:var(--smoke);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .stat-value{font-size:34px;font-weight:600;letter-spacing:-0.7px;}
  .stat-delta{font-size:11.5px;font-weight:600;margin-top:6px;}
  .stat-delta.positive{color:#1a8f5a;} .stat-delta.negative{color:var(--coral);}
  .sparkline{margin-top:10px;width:100%;height:26px;display:block;}
  .draw-line{stroke-dasharray:300;stroke-dashoffset:300;animation:drawLine 1.1s ease forwards;}

  /* tab bar */
  .tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{border:1px solid var(--ash);background:transparent;border-radius:var(--r-pill);padding:8px 16px;font-size:12.5px;color:var(--graphite);cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s,color .15s,border-color .15s;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* master-detail composition */
  .master-detail{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start;}
  .list-rail{border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;background:transparent;}
  .list-rail-head{padding:16px 20px;border-bottom:1px solid var(--ash);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--smoke);}
  .list-rail-scroll{max-height:640px;overflow-y:auto;}
  .list-item{padding:14px 20px;border-bottom:1px solid var(--ash);cursor:pointer;transition:background .15s;}
  .list-item:last-child{border-bottom:none;}
  .list-item{transition:transform .12s ease,background .15s ease;}
  .list-item:hover{background:var(--elevated);transform:scale(1.015);}
  .list-item.selected{background:var(--elevated);}
  .list-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .lang-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--ash);color:var(--ink);}
  .list-item-q{font-size:13px;font-weight:500;line-height:1.4;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .status-dot.correct{background:#1a8f5a;} .status-dot.wrong{background:var(--coral);} .status-dot.hold{background:var(--gold);}

  .detail-panel{border:1px solid var(--ash);border-radius:var(--r-card);padding:32px;min-height:400px;}
  .detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--smoke);font-size:13px;gap:10px;}
  .detail-title{font-size:24px;font-weight:600;letter-spacing:-0.5px;margin:0 0 14px;line-height:1.35;}
  .detail-meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .pill-tag{border:1px solid var(--ash);border-radius:var(--r-pill);padding:6px 14px;font-size:11.5px;color:var(--graphite);}
  .compare-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
  .compare-block{border:1px solid var(--ash);border-radius:18px;padding:18px;}
  .compare-block h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--smoke);}
  .compare-block.baseline{background:transparent;}
  .compare-block.improved{background:var(--elevated);border-color:var(--elevated);}
  .compare-block p{font-size:13px;line-height:1.7;margin:0;}
  .diff-badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);}
  .diff-badge.same{background:var(--ash);color:var(--ink);}
  .diff-badge.changed{background:var(--lake);color:#fff;}

  .panel{border:1px solid var(--ash);border-radius:var(--r-card);padding:26px;margin-top:20px;}
  .panel h3{font-size:20px;font-weight:600;margin:0 0 14px;letter-spacing:-0.3px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data-table th{text-align:left;font-size:10.5px;color:var(--smoke);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--ash);}
  table.data-table td{padding:13px 12px;border-bottom:1px solid var(--ash);}
  table.data-table tbody tr{cursor:pointer;transition:background .15s;}
  table.data-table tbody tr:hover{background:var(--elevated);}
  .cause-badge{padding:3px 10px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;}
  .cause-badge.search{background:#fbe3de;color:#b23a1f;}
  .cause-badge.evidence{background:#fbeecb;color:#8a6416;}
  .cause-badge.lang{background:var(--elevated);color:var(--lake);}
  .new-flag{font-size:10px;font-weight:700;color:#b23a1f;margin-left:6px;}

  .run-box{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ash);border-radius:var(--r-card);padding:24px 28px;margin-bottom:20px;}
  .run-status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--graphite);}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--lake);animation:pulseDot 1.6s infinite;}
  .spin-icon{animation:spinIcon 1s linear infinite;display:inline-flex;}

  .chart-panel{border:1px solid var(--ash);border-radius:var(--r-card);padding:26px;}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--graphite);}
  .chart-legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  .accordion-item{border-bottom:1px solid var(--ash);padding:18px 0;}
  .accordion-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .accordion-head h4{font-size:16px;font-weight:600;margin:0;}
  .accordion-body{font-size:13px;color:var(--graphite);line-height:1.7;margin-top:10px;max-width:640px;}

  .failure-log-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--ash);}
  .failure-log-item:last-child{border-bottom:none;}
  .failure-log-dot{width:10px;height:10px;border-radius:50%;background:var(--coral);margin-top:5px;flex-shrink:0;}
  .failure-log-item.recent .failure-log-dot{box-shadow:0 0 0 4px rgba(255,148,115,.25);}

  .modal-overlay{position:fixed;inset:0;background:rgba(36,36,36,.5);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease;}
  .modal-box{background:var(--bg);border-radius:28px;max-width:600px;width:92%;max-height:82vh;overflow-y:auto;padding:34px;box-shadow:0 0 40px rgba(0,0,0,.12);animation:fadeInScale .22s cubic-bezier(.2,.9,.3,1);border:1px solid var(--ash);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-head h3{font-size:22px;font-weight:600;margin:0;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--smoke);font-size:22px;}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:11.5px;color:var(--smoke);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--ash);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--ink);}
  .upload-drop{border:1.5px dashed var(--ash);border-radius:18px;padding:28px;text-align:center;color:var(--smoke);font-size:12.5px;cursor:pointer;transition:border-color .15s;}
  .upload-drop:hover{border-color:var(--lake);}
  .progress-bar{width:100%;height:6px;background:var(--ash);border-radius:6px;overflow:hidden;margin-top:14px;}
  .progress-bar > div{height:100%;background:var(--lake);transition:width .3s ease;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 24px;border-radius:var(--r-pill);font-size:13px;display:flex;align-items:center;gap:9px;z-index:200;animation:toastIn .3s cubic-bezier(.2,.9,.3,1);}

  .highlight-word{color:var(--lake);font-weight:600;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes spinIcon{to{transform:rotate(360deg);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes drawLine{to{stroke-dashoffset:0;}}
  @keyframes rowStagger{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  .stagger-row{animation:rowStagger .32s ease both;}
  @keyframes cardIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .card-in{animation:cardIn .3s ease both;}

  @media (max-width:1100px){
    .master-detail{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .compare-2col{grid-template-columns:1fr;}
    .global-nav{overflow-x:auto;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

/* ───────────────── mock data ───────────────── */
const LANGS = ['전체','한국어','영어','중국어','베트남어'];
const LANG_CODE = {'한국어':'KO','영어':'EN','중국어':'ZH','베트남어':'VI'};

const EVAL_ITEMS = [
  {id:1, lang:'한국어', cat:'체류자격 변경', q:'특정활동 비자에서 거주 비자로 변경할 때 필요한 절차가 무엇인가요', tuning:true, status:'보류',
    baseline:'관련 규정을 찾을 수 없어 답변이 어렵습니다.', improved:'거주(F-2) 자격 변경은 체류자격 변경허가 신청서와 소득·거주 요건 서류를 제출하며, 심사는 약 4~6주가 소요됩니다.', changed:true},
  {id:2, lang:'한국어', cat:'서류 안내', q:'체류자격외활동 허가 신청 서류 목록을 알려주세요', tuning:true, status:'정답',
    baseline:'체류자격외활동허가 신청서와 여권 사본이 필요합니다.', improved:'체류자격외활동허가 신청서, 여권·외국인등록증 사본, 활동계획서가 필요하며 근무처 변경 시 사업자등록증 사본도 함께 제출합니다.', changed:true},
  {id:3, lang:'영어', cat:'Employment', q:'What are the working hour limits for international students?', tuning:false, status:'정답',

  {id:4, lang:'영어', cat:'Naturalization', q:'What are the income requirements for F-6 marriage visa naturalization?', tuning:false, status:'오답',

  {id:6, lang:'중국어', cat:'永居申请', q:'申请F-5永久居留签证的收入标准是什么？', tuning:false, status:'정답',
    baseline:'需满足最低收入标准。', improved:'F-5永久居留资格审查依据最新收入公告标准，并结合居住年限与家庭情况综合评估。', changed:true},
  {id:7, lang:'베트남어', cat:'Giấy phép lao động', q:'Lý do thay đổi nơi làm việc theo chế độ cấp phép lao động (E-9) là gì?', tuning:true, status:'정답',
    baseline:'Cần tham khảo quy định liên quan.', improved:'Người lao động E-9 có thể thay đổi nơi làm việc trong các trường hợp như đóng cửa doanh nghiệp, vi phạm hợp đồng hoặc lý do bất khả kháng khác.', changed:true},

  {id:9, lang:'한국어', cat:'취업 제한', q:'F-4 동포비자 소지자의 취업 제한 범위가 어떻게 되나요', tuning:false, status:'정답',
    baseline:'단순노무 등 일부 업종은 제한됩니다.', improved:'단순노무행위 등 대통령령으로 정하는 업종을 제외하고 원칙적으로 취업활동이 허용됩니다.', changed:false},

  {id:1, q:'F-6 비자 국적 취득 소득 기준', lang:'영어', cause:'evidence', time:'09:14', isNew:true},
  {id:2, q:'F-6 결혼이민 국적 취득 요건', lang:'베트남어', cause:'evidence', time:'09:02', isNew:true},
  {id:3, q:'단기방문 연장 사유', lang:'중국어', cause:'lang', time:'08:47', isNew:false},
  {id:4, q:'체류자격외활동 근무처 변경', lang:'한국어', cause:'search', time:'08:30', isNew:false},
  {id:5, q:'영주권 소득 산정 방식', lang:'한국어', cause:'evidence', time:'08:12', isNew:false},
  {id:6, q:'고용허가제 재고용 절차', lang:'영어', cause:'search', time:'07:58', isNew:false},

const LANG_TREND = {
  '한국어':[88,89,90,91,92,93], '영어':[80,82,83,85,87,89],
  '중국어':[74,76,78,80,83,85], '베트남어':[70,73,76,79,81,84],
};
const TREND_COLORS = {'한국어':'#2b59d1','영어':'#ff9473','중국어':'#1a8f5a','베트남어':'#ecda98'};

const RUN_HISTORY = [
  {ver:'v3', date:'09.02', KO:93, EN:89, ZH:85, VI:84, failCount:3},
  {ver:'v2', date:'08.26', KO:90, EN:85, ZH:80, VI:79, failCount:9},
  {ver:'v1', date:'08.19', KO:86, EN:81, ZH:75, VI:73, failCount:16},
];

/* ───────────────── shared components ───────────────── */
function Toast({message,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2600);return ()=>clearTimeout(t);},[message]);
  return <div className="toast"><i className="ph ph-check-circle" style={{fontSize:16}}></i>{message}</div>;
}
function Modal({title,onClose,children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button></div>
        {children}
      </div>
    </div>
  );
}
function AnimatedNumber({value, suffix=''}){
  const [n,setN] = useState(0);
  useEffect(()=>{
    let raf, start;
    const dur=900;
    const step=(ts)=>{ if(!start) start=ts; const p=Math.min(1,(ts-start)/dur); setN(Math.round(value*p)); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[value]);
  return <span>{n}{suffix}</span>;
}
function Sparkline({points,color}){
  const w=100,h=26,max=Math.max(...points),min=Math.min(...points);
  const path = points.map((p,i)=>`${i===0?'M':'L'} ${(i/(points.length-1))*w} ${h-((p-min)/(max-min||1))*h}`).join(' ');
  return <svg className="sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" className="draw-line"/></svg>;
}

/* ───────────────── monitoring screen ───────────────── */
function MonitoringScreen(){

  const paths = Object.keys(LANG_TREND).map(l=>{
    const pts = LANG_TREND[l];
    const max=100,min=60;
    const d = pts.map((p,i)=>`${i===0?'M':'L'} ${(i/(pts.length-1))*w} ${h-((p-min)/(max-min))*h}`).join(' ');
    return {l,d,color:TREND_COLORS[l]};
  });

  const guides = [
    {q:'환경설정 가이드', a:'Supabase 연결 문자열과 OpenAI API 키는 환경변수로 관리하며, pgvector 확장은 배포 전 1회 활성화가 필요합니다.'},
    {q:'데이터 갱신 가이드', a:'공식 문서 갱신 시 chunking·임베딩 파이프라인을 재실행하고, 평가셋 회귀 테스트로 검색 품질 저하 여부를 확인합니다.'},
    {q:'운영 점검 가이드', a:'주 1회 회귀 테스트 실행 이력을 확인하고, 신규 실패 케이스가 누적되면 하이브리드 검색 가중치 재조정을 검토합니다.'},
  ];

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>다국어 품질 모니터링</h1>
          <p>언어별 정답률과 출처 정합성 추이를 모니터링하고, 실패 사례와 운영 가이드를 함께 확인합니다</p>
        </div>
      </div>

      <div className="chart-panel">
        <h3 style={{fontSize:16,fontWeight:600,margin:'0 0 4px'}}>언어별 정답률 추이</h3>
        <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{marginTop:10}}>
          {[0,1,2,3,4].map(i=><line key={i} x1="0" y1={h*i/4} x2={w} y2={h*i/4} stroke="var(--ash)" strokeWidth="1"/>)}
          {paths.map(p=>(<path key={p.l} d={p.d} fill="none" stroke={p.color} strokeWidth="2.5" strokeLinecap="round" className="draw-line" style={{strokeDasharray:700}}/>))}
        </svg>
        <div className="chart-legend">
          {paths.map(p=>(<span key={p.l}><span className="legend-dot" style={{background:p.color}}></span>{p.l}</span>))}
        </div>
      </div>

      <div className="panel">
        <h3>최근 실패 사례</h3>
        {FAILURE_QUEUE.map(f=>(
          <div key={f.id} className={"failure-log-item"+(f.isNew?' recent':'')}>
            <div className="failure-log-dot"></div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:500}}>{f.q} {f.isNew && <span className="new-flag">최근 7일 내 발생</span>}</div>
              <div style={{fontSize:11.5,color:'var(--smoke)',marginTop:3}}>{f.lang} · {f.time} · 원인 코드 {f.cause}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="panel">
        <h3>운영 가이드</h3>
        {guides.map((g,i)=>(
          <div className="accordion-item" key={i}>
            <div className="accordion-head" onClick={()=>setOpenAcc(openAcc===i?-1:i)}>
              <h4>{g.q}</h4>

            </div>
            {openAcc===i && <div className="accordion-body">{g.a}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ───────────────── App ───────────────── */
function App(){
  const [screen,setScreen] = useState('main');
  const [modal,setModal] = useState(null);
  const [toastMsg,setToastMsg] = useState(null);
  const [uploadProgress,setUploadProgress] = useState(0);
  const toast = (m)=>setToastMsg(m);

  const startUpload = ()=>{
    setUploadProgress(1);
    let p=0;
    const iv = setInterval(()=>{
      p+=20; setUploadProgress(p);
      if(p>=100){ clearInterval(iv); setTimeout(()=>{ setModal(null); toast('평가 문항 CSV 업로드가 완료되었습니다'); setUploadProgress(0); },400); }
    },220);
  };

  return (
    <div className="shell" data-archetype="topbar-analytics">
      <Header screen={screen} setScreen={setScreen} toast={toast}/>
      <div className="content">
        {screen==='main' && <MainScreen openModal={setModal} toast={toast}/>}
        {screen==='auto-eval' && <AutoEvalScreen toast={toast}/>}
        {screen==='comparison' && <ComparisonScreen/>}
        {screen==='monitoring' && <MonitoringScreen/>}
      </div>

      {modal && modal.type==='upload' && (
        <Modal title="평가 문항 CSV 업로드" onClose={()=>setModal(null)}>
          <div className="upload-drop" onClick={startUpload}>
            <i className="ph ph-file-csv" style={{fontSize:26}}></i>
            <div style={{marginTop:8}}>{uploadProgress>0 ? `eval-batch-09.csv 업로드 중 (${uploadProgress}%)` : 'eval-batch-09.csv 파일을 선택하거나 끌어다 놓으세요'}</div>
          </div>
          {uploadProgress>0 && <div className="progress-bar"><div style={{width:uploadProgress+'%'}}></div></div>}
        </Modal>
      )}

      {modal && modal.type==='new' && (
        <Modal title="평가 문항 추가" onClose={()=>setModal(null)}>
          <div className="form-row"><label>언어</label>
            <select><option>한국어</option><option>영어</option><option>중국어</option><option>베트남어</option></select>
          </div>
          <div className="form-row"><label>카테고리</label><input placeholder="예: 체류자격 변경"/></div>
          <div className="form-row"><label>질문</label><textarea rows="3" placeholder="평가 문항 질문을 입력하세요"></textarea></div>
          <div className="form-row"><label>기대 출처 문서</label><input placeholder="예: 출입국관리법 시행규칙 제25조"/></div>
          <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={()=>{ setModal(null); toast('평가 문항이 검수셋에 추가되었습니다'); }}><i className="ph ph-check"></i> 문항 저장</button>
        </Modal>
      )}

      {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
