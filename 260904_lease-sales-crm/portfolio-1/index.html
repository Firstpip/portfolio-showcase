<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 0°, light) ── */
:root{
  --m50:#efefef; --m100:#efefef; --m200:#efefef; --m300:#e0e0e0; --m400:#c1c1c1;
  --m500:#9b9b9b; --m600:#707070; --m700:#484848; --m800:#202020; --m900:#1a1a1a;
  --n0:#ffffff; --n1:#f8f9fa; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d5d5;
  --n5:#b3b3b3; --n6:#989090; --n7:#7a7171; --n8:#5a5353; --n9:#3a3636; --n10:#202020;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n1); color:var(--n10);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; border:none; background:none; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(31,137,75,.35);} 50%{box-shadow:0 0 0 6px rgba(31,137,75,0);}}
@keyframes barGrow{from{width:0;}}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);}}

#root{width:100%;}
.app-shell{display:flex; width:100%; min-height:100vh;}

/* ── sidebar (stripe-multipane 시그니처) ── */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:246px; background:var(--n0);
  border-right:1px solid var(--n3); display:flex; flex-direction:column; z-index:30;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:20px 20px 14px; border-bottom:1px solid var(--n3);}
.sidebar-brand .mark{width:30px; height:30px; border-radius:8px; background:var(--m800); display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px;}
.sidebar-brand .word{font-size:14.5px; font-weight:700; letter-spacing:-0.2px;}
.sidebar-env{margin:12px 16px 4px; padding:7px 10px; border:1px solid var(--n3); border-radius:999px; font-size:11px; color:var(--n7); display:flex; align-items:center; gap:7px; background:var(--n1);}
.sidebar-env .dot{width:6px; height:6px; border-radius:50%; background:var(--s1); animation:pulseDot 2s infinite;}
.sidebar-scroll{flex:1; overflow-y:auto; padding:10px 12px 16px;}
.sidebar-section{margin-top:18px;}
.sidebar-section-title{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--n6); padding:0 10px; margin-bottom:6px; font-weight:700;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; color:var(--n8); cursor:pointer; margin-bottom:2px; transition:background .15s,color .15s;}
.sidebar-link:hover{background:var(--n1);}
.sidebar-link.active{background:var(--m50); color:var(--m800); font-weight:700;}
.sidebar-link i{font-size:16px; width:16px; flex-shrink:0;}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--n3); font-size:11px; color:var(--n6);}

.main-wrap{margin-left:246px; flex:1; min-width:0; width:calc(100% - 246px); min-height:100vh; display:flex; flex-direction:column;}

.page-header{padding:24px 32px 0;}
.page-title-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
.page-title{font-size:42px; font-weight:800; letter-spacing:-1.2px;}
.page-sub{font-size:13px; color:var(--n7); margin-top:4px;}
.page-actions{display:flex; gap:8px;}
.btn{border-radius:8px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; transition:transform .12s,box-shadow .12s,background .15s;}
.btn:active{transform:scale(.97);}
.btn i{font-size:15px;}
.btn-primary{background:var(--m800); border-color:var(--m800); color:#fff;}
.btn-primary:hover{box-shadow:0 4px 14px rgba(32,32,32,.28);}
.btn-ghost{background:var(--n0); border-color:var(--n3); color:var(--n9);}
.btn-ghost:hover{background:var(--n1); border-color:var(--n4);}
.page-meta{font-size:12px; color:var(--n6); margin-top:10px; padding-bottom:16px; border-bottom:1px solid var(--n3);}

.content{padding:22px 32px 60px;}

/* insight-board composition */
.insight-board{display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start;}
.hero-viz{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.05); grid-column:1/2; position:relative; overflow:hidden;}
.hero-viz::before{content:''; position:absolute; top:-60px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(32,32,32,.07), transparent 72%); pointer-events:none;}
.sidebar-brand .mark{background:linear-gradient(135deg, var(--m700), var(--m900));}
.hero-viz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.hero-viz-head h2{font-size:15.5px; font-weight:700;}
.legend-toggle{display:flex; gap:6px; flex-wrap:wrap;}
.legend-chip{display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; border:1px solid var(--n3); font-size:11.5px; color:var(--n7); cursor:pointer; background:var(--n0);}
.legend-chip.off{opacity:.4;}
.legend-chip .sw{width:9px; height:9px; border-radius:2px;}
.chart-wrap{width:100%; height:260px;}

.kpi-side{display:flex; flex-direction:column; gap:14px;}
.stat-card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:17px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); animation:cardStagger .4s ease both; transition:transform .18s ease, box-shadow .18s ease;}
.stat-card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(12,10,9,.08);}
.stat-label{font-size:11.5px; color:var(--n7); margin-bottom:6px; font-weight:600;}
.stat-value{font-size:29px; font-weight:700; letter-spacing:-.7px;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:4px; display:inline-flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--s1);}
.stat-delta.negative{color:var(--n8);}
.stat-sparkline{margin-top:10px; width:100%; height:26px; display:block;}

.widget-grid{grid-column:1/-1; display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:20px;}
.widget{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.widget h3{font-size:14px; font-weight:700; margin-bottom:14px;}

.donut-wrap{display:flex; align-items:center; gap:16px;}
.donut-legend{flex:1; font-size:12px;}
.donut-legend-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; cursor:pointer; border-radius:6px; transition:background .12s;}
.donut-legend-row:hover{background:var(--n1);}
.donut-legend-row.dim{opacity:.35;}
.legend-swatch{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:7px;}

.tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--n3); margin-bottom:14px;}
.tab{font-size:12.5px; color:var(--n7); padding:8px 4px; cursor:pointer; position:relative; font-weight:600;}
.tab.active{color:var(--n10);}
.tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--m800); border-radius:2px;}

table.data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.data-table th{text-align:left; font-size:10.5px; color:var(--n6); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--n3);}
table.data-table td{padding:11px 10px; border-bottom:1px solid var(--n3);}
table.data-table tbody tr{cursor:pointer; transition:background .12s;}
table.data-table tbody tr:hover{background:var(--n1);}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700;}
.badge.n{background:var(--n2); color:var(--n8);}
.badge.s1{background:var(--s1-bg); color:var(--s1-text);}
.badge.s3{background:var(--s3-bg); color:var(--s3-text);}

.screen-head{margin-bottom:20px; animation:fadeInUp .35s ease both;}
.screen-head h2{font-size:20px; font-weight:700; margin-bottom:4px; letter-spacing:-.3px;}
.screen-head p{font-size:13px; color:var(--n7); max-width:660px;}

.panel{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.panel + .panel{margin-top:18px;}
.panel-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.panel-title-row h3{font-size:14px; font-weight:700;}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.search-input{flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--n3); border-radius:8px; font-size:12.5px; background:var(--n1);}
.filter-chip{border:1px solid var(--n3); background:var(--n0); border-radius:999px; padding:6px 13px; font-size:12px; color:var(--n7); cursor:pointer;}
.filter-chip.active{background:var(--m800); border-color:var(--m800); color:#fff;}

/* quota / assignment */
.quota-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--n3);}
.quota-row:last-child{border-bottom:none;}
.quota-name{width:110px; font-size:12.5px; font-weight:600; flex-shrink:0;}
.quota-track{flex:1; height:10px; background:var(--n2); border-radius:6px; overflow:hidden;}
.quota-fill{height:100%; border-radius:6px; background:var(--m600); animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.quota-fill.full{background:var(--s3);}
.quota-meta{width:70px; text-align:right; font-size:11.5px; color:var(--n7); flex-shrink:0;}
.switch{position:relative; width:42px; height:24px; border-radius:999px; background:var(--n3); cursor:pointer; transition:background .2s; flex-shrink:0;}
.switch.on{background:var(--m800);}
.switch::after{content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s;}
.switch.on::after{transform:translateX(18px);}
.switch-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}

.funnel-row{display:flex; align-items:center; gap:14px; padding:10px 8px; border-radius:8px;}
.funnel-label{width:88px; flex-shrink:0; font-size:12.5px; color:var(--n7); font-weight:600;}
.funnel-track{flex:1; height:26px; background:var(--n2); border-radius:6px; overflow:hidden; border:1px solid var(--n3);}
.funnel-fill{height:100%; border-radius:6px; background:var(--m700); display:flex; align-items:center; padding-left:10px; color:#fff; font-size:11px; font-weight:700; white-space:nowrap; animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.funnel-meta{width:100px; flex-shrink:0; text-align:right; font-size:11.5px; color:var(--n6);}

/* timeline */
.timeline{display:flex; flex-direction:column; gap:0; margin-top:6px;}
.tl-item{display:flex; gap:12px; padding:12px 0; border-left:2px solid var(--n3); margin-left:9px; padding-left:20px; position:relative;}
.tl-item:last-child{border-left-color:transparent;}
.tl-dot{position:absolute; left:-7px; top:12px; width:12px; height:12px; border-radius:50%; background:var(--n4); border:2px solid var(--n0);}
.tl-dot.assign{background:var(--m700);}
.tl-dot.contact{background:var(--n6);}
.tl-dot.open{background:var(--s3);}
.tl-dot.contract{background:var(--s1);}
.tl-title{font-size:13px; font-weight:700;}
.tl-meta{font-size:11.5px; color:var(--n6); margin-top:2px;}

.avatar{width:28px; height:28px; border-radius:50%; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}

/* modal / toast */
.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .18s ease; padding:20px;}
.modal-box{background:var(--n0); border-radius:16px; max-width:600px; width:100%; max-height:84vh; overflow-y:auto; padding:26px; box-shadow:0 20px 60px rgba(12,10,9,.2); animation:fadeInScale .22s cubic-bezier(.2,.9,.3,1);}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
.modal-head h3{font-size:17px; font-weight:700;}
.modal-close{color:var(--n6); padding:4px; cursor:pointer;}
.modal-close i{font-size:18px;}
.field-row{margin-bottom:14px;}
.field-row label{display:block; font-size:11.5px; font-weight:700; color:var(--n7); margin-bottom:6px;}
.field-row select, .field-row textarea, .field-row input{width:100%; padding:9px 12px; border:1px solid var(--n3); border-radius:8px; font-size:13px; background:var(--n1);}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--n10); color:#fff; padding:12px 22px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .3s cubic-bezier(.2,.9,.3,1); box-shadow:0 12px 40px rgba(0,0,0,.25);}

@media (max-width:1180px){
  .insight-board{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ───────── shared bits ───────── */
function Sparkline({points, color}){
  const w=100,h=26; const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{const x=(i/(points.length-1))*w; const y=h-((p-min)/((max-min)||1))*h; return `${x},${y}`;}).join(' ');
  return <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}
function Toast({message, onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2600); return ()=>clearTimeout(t);},[message]);
  return <div className="toast"><i className="ti ti-circle-check"></i>{message}</div>;
}
function Modal({title, onClose, children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><span className="modal-close" onClick={onClose}><i className="ti ti-x"></i></span></div>
        {children}
      </div>
    </div>
  );
}
function Badge({type, children}){ return <span className={"badge "+type}>{children}</span>; }
function tlDot(type){ return type; }

  };

  const FUNNEL = [
    {label:'상담', value:1240, max:1240}, {label:'견적발송', value:842, max:1240},
    {label:'계약', value:189, max:1240}, {label:'출고', value:151, max:1240},
  ];

  return (
    <div>
      <div className="screen-head"><h2>상담·계약 관리</h2><p>상담 통화 결과부터 계약·출고까지 전 구간의 상태 전환을 추적합니다</p></div>

      <div className="panel">
        {FUNNEL.map(f=>(
          <div className="funnel-row" key={f.label}>
            <div className="funnel-label">{f.label}</div>
            <div className="funnel-track"><div className="funnel-fill" style={{width:(f.value/f.max*100)+'%'}}>{f.value.toLocaleString()}건</div></div>
            <div className="funnel-meta">{(f.value/f.max*100).toFixed(1)}%</div>
          </div>
        ))}
      </div>

      <div className="panel">
        <div className="tab-bar">
          {[['counsel','상담로그'],['contract','계약관리'],['ship','출고관리']].map(([k,l])=>(
            <div key={k} className={"tab"+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</div>
          ))}
        </div>

        {tab==='counsel' && (
          <table className="data-table">
            <thead><tr><th>고객</th><th>문의차량</th><th>담당자</th><th>결과</th><th>시각</th></tr></thead>
            <tbody>
              {CONSULT_LOGS.map(l=>(
                <tr key={l.id} style={{cursor:'default'}}>
                  <td>{l.name}</td><td>{l.car}</td><td>{l.staff}</td>
                  <td>{l.result==='통화성공'?<Badge type="s1">통화성공</Badge>:l.result.includes('부재')?<Badge type="n">{l.result}</Badge>:<Badge type="s3">{l.result}</Badge>}</td>
                  <td>{l.time}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {tab==='contract' && (
          <table className="data-table">
            <thead><tr><th>계약번호</th><th>고객</th><th>차량</th><th>담당자</th><th>월 렌탈료</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {contracts.map(c=>(
                <tr key={c.id} style={{cursor:'default'}}>
                  <td>{c.id}</td><td>{c.name}</td><td>{c.car}</td><td>{c.staff}</td><td>{c.amount}</td>
                  <td>{c.status==='출고완료'||c.status==='진행중'?<Badge type="s1">{c.status}</Badge>:c.status==='취소'?<Badge type="n">취소</Badge>:<Badge type="s3">{c.status}</Badge>}</td>
                  <td>{c.status!=='취소' && <button className="btn btn-ghost" style={{padding:'6px 12px', fontSize:11.5}} onClick={()=>setCancelTarget(c)}>취소</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {tab==='ship' && (
          <table className="data-table">
            <thead><tr><th>계약번호</th><th>고객</th><th>차량</th><th>출고상태</th></tr></thead>
            <tbody>
              {contracts.filter(c=>c.status!=='취소').map(c=>(
                <tr key={c.id} style={{cursor:'default'}}>
                  <td>{c.id}</td><td>{c.name}</td><td>{c.car}</td>
                  <td>{c.status==='출고완료'?<Badge type="s1">출고완료</Badge>:<Badge type="s3">출고대기</Badge>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {cancelTarget && (
        <Modal title="계약 취소" onClose={()=>{setCancelTarget(null); setReason('');}}>
          <div className="field-row"><label>대상 계약</label><input readOnly value={`${cancelTarget.id} · ${cancelTarget.name}`}/></div>
          <div className="field-row"><label>취소 사유 (필수)</label><textarea rows="3" placeholder="취소 사유를 입력해 주세요" value={reason} onChange={e=>setReason(e.target.value)}></textarea></div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>{setCancelTarget(null); setReason('');}}>닫기</button>
            <button className="btn btn-primary" onClick={confirmCancel}>취소 처리</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── App ───────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = m => setToastMsg(m);

  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main-wrap">
        <div className="page-header" style={{paddingBottom: screen==='main'?0:0}}>
          {screen==='main' && <MainScreen toast={toast} openModal={setModal}/>}
          {screen!=='main' && (
            <div className="content" style={{padding:'24px 0 0'}}>
              {screen==='customer-history' && <CustomerHistoryScreen openModal={setModal}/>}
              {screen==='db-assignment' && <DbAssignmentScreen toast={toast}/>}
              {screen==='open-db-stats' && <OpenDbStatsScreen/>}
              {screen==='workflow-tracking' && <WorkflowTrackingScreen toast={toast}/>}
            </div>
          )}
        </div>
      </div>

      {modal && modal.kind==='log' && (
        <Modal title="상담 로그 상세" onClose={()=>setModal(null)}>
          <div style={{fontSize:13.5, fontWeight:700, marginBottom:10}}>{modal.data.name} · {modal.data.car}</div>
          <div className="timeline">
            <div className="tl-item"><span className={"tl-dot assign"}></span><div><div className="tl-title">담당자 배정 — {modal.data.staff}</div><div className="tl-meta">2026.08.20</div></div></div>
            <div className="tl-item"><span className={"tl-dot contact"}></span><div><div className="tl-title">상담 결과 — {modal.data.result}</div><div className="tl-meta">{modal.data.time} 접수</div></div></div>
          </div>
        </Modal>
      )}

      {modal && modal.kind==='customer' && (
        <Modal title={`${modal.data.name} — 고객 이력`} onClose={()=>setModal(null)}>
          <div style={{fontSize:12.5, color:'var(--n7)', marginBottom:14}}>{modal.data.car} · 최초유입 {modal.data.channel} · 최초담당자 {modal.data.first}</div>
          <div className="timeline">
            {modal.data.timeline.map((t,i)=>(
              <div className="tl-item" key={i}><span className={"tl-dot "+t.type}></span><div><div className="tl-title">{t.title}</div><div className="tl-meta">{t.meta}</div></div></div>
            ))}
          </div>
        </Modal>
      )}

      {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
