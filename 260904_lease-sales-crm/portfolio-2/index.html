<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, light) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#273b62;
  --n0:#ffffff; --n1:#e5e5e7; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#95979e; --n7:#71747a; --n8:#53565a; --n9:#36373a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:linear-gradient(180deg, var(--n2) 0%, var(--n0) 340px); color:var(--n10);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; border:none; background:none; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes floatIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(86,131,218,.28);} 50%{box-shadow:0 0 0 8px rgba(86,131,218,0);}}
@keyframes barGrow{from{width:0;}}
@keyframes progressFill{from{width:0;}}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);}}
@keyframes spinIcon{to{transform:rotate(360deg);}}
.spin{animation:spinIcon 1s linear infinite; display:inline-block;}
@keyframes drawWave{to{stroke-dashoffset:0;}}

#root{width:100%;}
#app{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* ── topbar-analytics 시그니처: 상단 글로벌 내비 (사이드바 없음) ── */
.app-header{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:26px;
  height:64px; padding:0 30px; background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--n3); width:100%;
}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; flex-shrink:0;}
.brand .mark{width:30px; height:30px; border-radius:12px; background:linear-gradient(135deg, var(--m600), var(--m800)); display:flex; align-items:center; justify-content:center; color:#fff;}
.project-switcher{display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; background:var(--n1); font-size:12.5px; font-weight:600; color:var(--n8); cursor:pointer; flex-shrink:0;}
.global-nav{display:flex; gap:4px; flex:1;}
.nav-link{padding:9px 15px; border-radius:999px; font-size:13px; font-weight:600; color:var(--n7); cursor:pointer; transition:background .15s,color .15s; white-space:nowrap;}
.nav-link:hover{background:var(--n1);}
.nav-link.active{background:var(--m800); color:#fff;}
.header-actions{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.header-actions i{width:19px; height:19px; color:var(--n7); cursor:pointer;}
.avatar-chip{width:32px; height:32px; border-radius:50%; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}

/* ── 보조 탭 행 ── */
.tab-bar{display:flex; gap:6px; padding:16px 30px 0; max-width:1280px; margin:0 auto; width:100%;}
.tab-bar .tab{padding:9px 4px; font-size:13px; color:var(--n7); font-weight:600; cursor:pointer; position:relative; margin-right:22px;}
.tab-bar .tab.active{color:var(--n10);}
.tab-bar .tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--m600); border-radius:2px;}

.content{max-width:1280px; margin:0 auto; width:100%; padding:22px 30px 70px;}

.hero-pulse{position:relative; border-radius:28px; padding:30px 34px; margin-bottom:22px; background:linear-gradient(135deg, var(--m700), var(--m900)); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:24px; overflow:hidden; box-shadow:0 18px 44px rgba(39,59,98,.24); flex-wrap:wrap;}
.hero-pulse-text{position:relative; z-index:1; min-width:240px;}
.hero-pulse-label{font-size:12px; opacity:.72; font-weight:700; letter-spacing:.03em; text-transform:uppercase;}
.hero-pulse-value{font-size:28px; font-weight:800; letter-spacing:-.6px; margin-top:6px;}
.hero-pulse-sub{font-size:12.5px; opacity:.78; margin-top:8px; max-width:340px;}
.hero-pulse-wave{width:min(52%, 380px); height:96px; flex-shrink:0;}
.wave-path{stroke-dasharray:900; stroke-dashoffset:900; animation:drawWave 1.6s cubic-bezier(.2,.8,.2,1) forwards;}
.wave-path-2{animation-delay:.15s;}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:22px;}
.stat-card{background:rgba(255,255,255,.7); backdrop-filter:blur(10px); border:1px solid var(--n3); border-radius:20px; padding:20px 22px; box-shadow:0 8px 28px rgba(39,59,98,.08); animation:cardStagger .4s ease both; transition:transform .2s ease, box-shadow .2s ease;}
.stat-card:hover{transform:scale(1.03); box-shadow:0 16px 40px rgba(39,59,98,.14);}
.stat-label{font-size:11.5px; color:var(--n7); margin-bottom:7px; font-weight:600;}
.stat-value{font-size:30px; font-weight:800; letter-spacing:-.7px;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:5px; display:inline-flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--s1);}
.stat-delta.negative{color:var(--n8);}
.sparkline{margin-top:10px; width:100%; height:26px; display:block;}

/* master-detail composition */
.master-detail{display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
.list-rail{background:rgba(255,255,255,.7); backdrop-filter:blur(10px); border:1px solid var(--n3); border-radius:20px; padding:8px; box-shadow:0 8px 28px rgba(39,59,98,.06);}
.rail-search{padding:11px 14px; border-radius:14px; background:var(--n1); font-size:12.5px; border:1px solid transparent; width:100%; margin-bottom:6px;}
.rail-item{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:16px; cursor:pointer; transition:background .15s;}
.rail-item:hover{background:var(--n1);}
.rail-item.selected{background:var(--m50); animation:pulseGlow 2.4s ease infinite;}
.rail-icon{width:34px; height:34px; border-radius:12px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rail-item.selected .rail-icon{background:var(--m600); color:#fff;}
.rail-name{font-size:13px; font-weight:700;}
.rail-sub{font-size:11px; color:var(--n6); margin-top:1px;}
.rail-badge{margin-left:auto; font-size:10px; padding:3px 8px; border-radius:999px; background:var(--n2); color:var(--n7); font-weight:700;}

.detail-panel{background:rgba(255,255,255,.75); backdrop-filter:blur(10px); border:1px solid var(--n3); border-radius:24px; padding:26px; box-shadow:0 12px 36px rgba(39,59,98,.1); animation:floatIn .35s ease both;}
.detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.detail-head h2{font-size:40px; font-weight:800; letter-spacing:-1.2px;}
.detail-sub{font-size:12.5px; color:var(--n7); margin-top:3px;}
.btn{border-radius:999px; padding:10px 18px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; transition:transform .12s,box-shadow .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{box-shadow:0 6px 18px rgba(71,107,179,.35);}
.btn-ghost{background:var(--n1); color:var(--n9);}
.btn-ghost:hover{background:var(--n2);}

.funnel-mini{display:flex; flex-direction:column; gap:10px; margin:18px 0;}
.funnel-mini-row{display:flex; align-items:center; gap:12px;}
.funnel-mini-label{width:96px; font-size:12px; color:var(--n7); font-weight:600; flex-shrink:0;}
.funnel-mini-track{flex:1; height:22px; background:var(--n2); border-radius:8px; overflow:hidden;}
.funnel-mini-fill{height:100%; border-radius:8px; background:var(--m600); animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.funnel-mini-meta{width:60px; text-align:right; font-size:11.5px; color:var(--n7); flex-shrink:0;}

.metric-grid-mini{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px;}
.metric-mini{background:var(--n1); border-radius:16px; padding:14px 16px;}
.metric-mini .l{font-size:10.5px; color:var(--n7); font-weight:600;}
.metric-mini .v{font-size:19px; font-weight:800; margin-top:4px;}

table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:16px;}
table.data-table th{text-align:left; font-size:10.5px; color:var(--n6); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--n3);}
table.data-table td{padding:12px 10px; border-bottom:1px solid var(--n3);}
table.data-table tbody tr{transition:background .12s;}
table.data-table tbody tr:hover{background:var(--n1);}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:10.5px; font-weight:700;}
.badge.n{background:var(--n2); color:var(--n8);}
.badge.s1{background:var(--s1-bg); color:var(--s1-text);}
.badge.s2{background:var(--s2-bg); color:var(--s2-text);}
.badge.s3{background:var(--s3-bg); color:var(--s3-text);}

.screen-head{margin-bottom:22px;}
.screen-head h2{font-size:22px; font-weight:800; letter-spacing:-.4px;}
.screen-head p{font-size:13px; color:var(--n7); margin-top:5px; max-width:680px;}

.panel{background:rgba(255,255,255,.75); backdrop-filter:blur(10px); border:1px solid var(--n3); border-radius:22px; padding:24px; box-shadow:0 10px 32px rgba(39,59,98,.08);}
.panel + .panel{margin-top:18px;}
.panel-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
.panel-title-row h3{font-size:14.5px; font-weight:800;}

.rank-row{display:flex; align-items:center; gap:14px; padding:13px 4px; border-bottom:1px solid var(--n3);}
.rank-row:last-child{border-bottom:none;}
.rank-badge{width:28px; height:28px; border-radius:10px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
.rank-badge.top{background:var(--m600); color:#fff;}
.rank-name{font-size:13px; font-weight:700; width:80px; flex-shrink:0;}
.rank-track{flex:1; height:10px; background:var(--n2); border-radius:8px; overflow:hidden;}
.rank-fill{height:100%; border-radius:8px; background:var(--m500); animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.rank-value{width:60px; text-align:right; font-size:12.5px; font-weight:700; flex-shrink:0;}

.role-toggle{display:flex; gap:8px; margin-bottom:18px;}
.role-chip{padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--n3); background:var(--n0); color:var(--n7);}
.role-chip.active{background:var(--m800); border-color:var(--m800); color:#fff;}
.guard-msg{display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:16px; background:var(--s2-bg); color:var(--s2-text); font-size:12.5px; font-weight:600; margin-bottom:16px;}

.migrate-progress{height:14px; background:var(--n2); border-radius:999px; overflow:hidden; margin:16px 0;}
.migrate-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--m500), var(--m700)); animation:progressFill 1.8s cubic-bezier(.2,.8,.2,1) both;}

.modal-overlay{position:fixed; inset:0; background:rgba(30,30,32,.45); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .18s ease; padding:20px;}
.modal-box{background:var(--n0); border-radius:26px; max-width:560px; width:100%; max-height:84vh; overflow-y:auto; padding:28px; box-shadow:0 24px 70px rgba(30,30,40,.24); animation:fadeInScale .22s cubic-bezier(.2,.9,.3,1);}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
.modal-head h3{font-size:17px; font-weight:800;}
.modal-close{color:var(--n6); cursor:pointer;}
.field-row{margin-bottom:14px;}
.field-row label{display:block; font-size:11.5px; font-weight:700; color:var(--n7); margin-bottom:6px;}
.field-row select, .field-row textarea, .field-row input{width:100%; padding:10px 14px; border:1px solid var(--n3); border-radius:14px; font-size:13px; background:var(--n1);}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--n10); color:#fff; padding:13px 24px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .3s cubic-bezier(.2,.9,.3,1); box-shadow:0 14px 44px rgba(0,0,0,.28);}

@media (max-width:1080px){
  .master-detail{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .metric-grid-mini{grid-template-columns:1fr 1fr;}
}
</style>
</head>

function Toast({message, onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2600); return ()=>clearTimeout(t);},[message]);
  return <div className="toast"><Icon name="check-circle" size={16}/>{message}</div>;
}
function Modal({title, onClose, children}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><span className="modal-close" onClick={onClose}><Icon name="x" size={18}/></span></div>
        {children}
      </div>
    </div>
  );
}
function Badge({type, children}){ return <span className={"badge "+type}>{children}</span>; }
function Sparkline({points, color}){
  const w=100,h=26; const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{const x=(i/(points.length-1))*w; const y=h-((p-min)/((max-min)||1))*h; return `${x},${y}`;}).join(' ');
  return <svg className="sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

/* ───────── Data migration ───────── */
function DataMigrationScreen({toast}){
  const [running, setRunning] = useState(false);
  const [steps, setSteps] = useState(MIGRATION_STEPS);

  const runMigration = () => {
    setRunning(true);
    setTimeout(()=>{
      setSteps(s=>s.map(x=>x.status==='대기'?{...x, done:x.total, status:'완료'}:x));
      setRunning(false);
      toast('담당자 변경 이력 이관이 완료되었습니다');
    }, 1600);
  };

  const totalPct = Math.round(steps.reduce((a,s)=>a+s.done,0) / steps.reduce((a,s)=>a+s.total,0) * 100);

  return (
    <div>
      <div className="screen-head"><h2>데이터 마이그레이션</h2><p>기존 운영 CRM의 고객 DB를 신규 이력 구조로 이관하고, 이관 전후 레코드 정합성을 검증합니다</p></div>

      <div className="panel">
        <div className="panel-title-row"><h3>전체 이관 진행률</h3><span style={{fontSize:12.5, fontWeight:700}}>{totalPct}%</span></div>
        <div className="migrate-progress"><div className="migrate-fill" style={{width:totalPct+'%'}}></div></div>
        <div style={{display:'flex', gap:10}}>
          <button className="btn btn-primary" onClick={runMigration} disabled={running}>{running ? <Icon name="loader" className="spin" size={14}/> : <Icon name="play" size={14}/>}{running ? '이관 진행중' : '남은 단계 이관 실행'}</button>
          <button className="btn btn-ghost" onClick={()=>toast('이관 검증 리포트가 다운로드되었습니다')}><Icon name="file-check-2" size={14}/>검증 리포트 다운로드</button>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title-row"><h3>테이블별 이관 현황</h3></div>
        <table className="data-table">
          <thead><tr><th>테이블</th><th>대상 레코드</th><th>이관 완료</th><th>상태</th></tr></thead>
          <tbody>
            {steps.map(s=>(
              <tr key={s.label}>
                <td>{s.label}</td><td>{s.total.toLocaleString()}건</td><td>{s.done.toLocaleString()}건</td>
                <td>{s.status==='완료'?<Badge type="s1">완료</Badge>:s.status==='검증중'?<Badge type="s3">검증중</Badge>:<Badge type="n">대기</Badge>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ───────── App ───────── */

  return (
    <div id="app" data-archetype="topbar-analytics">
      <Header screen={screen} setScreen={setScreen}/>
      <div className="tab-bar">
        {NAV.map(n=>(
          <div key={n.key} className={"tab"+(screen===n.key?' active':'')} onClick={()=>setScreen(n.key)}>{n.label}</div>
        ))}
      </div>
      <main className="content">
        {screen==='main' && <MainScreen toast={toast}/>}
        {screen==='staff-ranking' && <StaffRankingScreen/>}

}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
