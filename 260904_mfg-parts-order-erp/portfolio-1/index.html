<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오더타워 — 소모품 발주·거래처 통합관제 시스템</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n10);
  -webkit-font-smoothing:antialiased;
  letter-spacing:0.01em;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; letter-spacing:inherit;}
input,select,textarea{font-family:inherit; letter-spacing:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

/* ── keyframes ── */
@keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(207,63,63,.35);} 50%{box-shadow:0 0 0 6px rgba(207,63,63,0);}}
@keyframes ripple{from{transform:scale(0); opacity:.55;} to{transform:scale(2.6); opacity:0;}}
@keyframes shimmer{0%{background-position:-300px 0;} 100%{background-position:300px 0;}}
@keyframes slideInRight{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastIn{from{transform:translateY(12px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* ── layout root ── */
#app{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* ── header (top-nav, no sidebar) ── */
.app-header{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:28px;
  height:64px; padding:0 28px;
  background:rgba(255,248,241,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--n3);
  width:100%;
}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; color:var(--n10); white-space:nowrap;}
.brand .brand-mark{
  width:30px; height:30px; border-radius:9px; background:var(--m600);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px;
}
.project-switcher{
  display:flex; align-items:center; gap:6px; font-size:13px; color:var(--n7);
  padding:6px 10px; border-radius:8px; border:1px solid var(--n3); background:var(--n1); cursor:pointer;
  white-space:nowrap;
}
.project-switcher:hover{border-color:var(--n5);}
.global-nav{display:flex; align-items:center; gap:4px; flex:1; overflow-x:auto;}
.nav-link{
  padding:9px 14px; border-radius:9px; font-size:14px; font-weight:500; color:var(--n7);
  display:flex; align-items:center; gap:7px; white-space:nowrap; transition:background .15s,color .15s;
}
.nav-link:hover{background:var(--n2); color:var(--n10);}
.nav-link.active{background:var(--m50); color:var(--m700); font-weight:600;}
.header-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--n7); position:relative; transition:background .15s;
}
.icon-btn:hover{background:var(--n2); color:var(--n10);}
.notif-dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:99px; background:var(--s2); animation:pulseDot 2s infinite;}
.avatar{
  width:34px; height:34px; border-radius:10px; background:var(--n9); color:var(--n1);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}

/* ── tab-bar (보조 탭 행) ── */
.tab-bar{
  display:flex; align-items:center; gap:4px; height:46px; padding:0 28px;
  border-bottom:1px solid var(--n3); background:var(--n0); width:100%; overflow-x:auto;
}
.tab{
  padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:500; color:var(--n7);
  border-bottom:2px solid transparent; white-space:nowrap; transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--n10);}
.tab.active, .tab[aria-selected="true"]{color:var(--m700); border-bottom-color:var(--m600); font-weight:600;}

/* ── content ── */
.content{flex:1; width:100%; max-width:1280px; margin:0 auto; padding:26px 28px 64px;}
.screen{animation:fadeInUp .38s ease both;}

/* ── stat-strip (인라인 지표, 카드 아님) ── */
.stat-strip{
  display:flex; align-items:stretch; gap:0; background:var(--n1); border:1px solid var(--n3);
  border-radius:16px; padding:6px 4px; margin-bottom:20px; overflow-x:auto;
}
.stat-item{
  display:flex; align-items:center; gap:11px; padding:12px 22px; flex:1; min-width:180px;
  border-right:1px solid var(--n3);
}
.stat-item:last-child{border-right:none;}
.stat-icon{
  width:38px; height:38px; border-radius:11px; background:var(--n2); color:var(--n8);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.stat-icon.warn{background:var(--s2-bg); color:var(--s2-text);}
.stat-text{display:flex; flex-direction:column; gap:1px;}
.stat-label{font-size:12px; color:var(--n7); font-weight:500;}
.stat-value{font-size:22px; font-weight:700; color:var(--n10); letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.stat-value.warn{color:var(--s2-text);}
.stat-spark{margin-left:auto; flex-shrink:0; opacity:.85;}

/* ── primary layout grid: board + priority-rail ── */
.tower-grid{display:grid; grid-template-columns:1fr 300px; gap:18px; margin-bottom:20px; align-items:start;}
@media (max-width:960px){.tower-grid{grid-template-columns:1fr;}}

.panel{
  background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:20px;
  box-shadow:var(--card-shadow, 0 6px 24px rgba(250,166,0,.10));
}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-title{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px;}
.panel-sub{font-size:12.5px; color:var(--n7); margin-top:2px;}

/* ── board (kanban) ── */
.board{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media (max-width:700px){.board{grid-template-columns:1fr 1fr;}}
.board-col{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:12px; min-height:120px;}
.board-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
.board-col-title{font-size:12.5px; font-weight:700; color:var(--n8);}
.board-col-count{font-size:11px; color:var(--n6); background:var(--n2); border-radius:99px; padding:1px 7px;}
.order-card{
  background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:11px 12px; margin-bottom:8px;
  cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s;
  animation:cardStagger .32s ease both;
}
.order-card:hover{transform:translateY(-3px); box-shadow:0 10px 20px rgba(29,30,28,.08); border-color:var(--n5);}
.order-card-id{font-size:11px; color:var(--n6); font-weight:600; margin-bottom:4px;}
.order-card-partner{font-size:13.5px; font-weight:600; color:var(--n10); margin-bottom:6px;}
.order-card-meta{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--n7);}
.order-card-badge{padding:2px 7px; border-radius:99px; font-size:10.5px; font-weight:600;}
.order-card-badge.danger{background:var(--s2-bg); color:var(--s2-text);}
.order-card-badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.order-card-badge.neutral{background:var(--n2); color:var(--n7);}

/* ── priority rail ── */
.rail-list{display:flex; flex-direction:column; gap:9px;}
.rail-item{
  display:flex; align-items:flex-start; gap:10px; padding:11px; border:1px solid var(--n3);
  border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s;
}
.rail-item:hover{border-color:var(--n5); background:var(--n0);}
.rail-dot{width:8px; height:8px; border-radius:99px; margin-top:5px; flex-shrink:0;}
.rail-dot.danger{background:var(--s2); animation:pulseDot 2s infinite;}
.rail-dot.warn{background:var(--n6);}
.rail-text{flex:1;}
.rail-title{font-size:13px; font-weight:600; color:var(--n10);}
.rail-desc{font-size:11.5px; color:var(--n7); margin-top:2px;}
.rail-action{font-size:11.5px; font-weight:600; color:var(--m700); white-space:nowrap;}

/* ── secondary widgets ── */
.secondary-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media (max-width:900px){.secondary-grid{grid-template-columns:1fr;}}
.stat-chart-wrap{position:relative; height:220px; width:100%;}

/* ── generic card grid ── */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:900px){.grid-2{grid-template-columns:1fr;}}

/* ── page header ── */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
.page-title{font-size:26px; font-weight:800; letter-spacing:-.01em; color:var(--n10);}
.hero-title{font-size:40px; font-weight:800; letter-spacing:-.02em; color:var(--n10); line-height:1.12;}
.page-desc{font-size:13.5px; color:var(--n7); margin-top:5px; max-width:520px;}

/* ── buttons ── */
.btn{
  position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:7px;
  padding:10px 18px; border-radius:16px; font-size:13.5px; font-weight:600; transition:transform .12s, box-shadow .15s, background .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600); color:#fff; box-shadow:0 3px 10px rgba(250,93,0,.28);}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{background:var(--n1); color:var(--n9); border:1px solid var(--n3);}
.btn-ghost:hover{border-color:var(--n5); background:var(--n2);}
.btn-outline{background:transparent; color:var(--m700); border:1px solid var(--m300);}
.btn-outline:hover{background:var(--m50);}
.btn-danger{background:var(--s2); color:#fff;}
.btn-danger:hover{background:var(--s2-text);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:12px;}
.ripple-el{position:absolute; border-radius:50%; background:rgba(255,255,255,.55); animation:ripple .5s ease-out; pointer-events:none;}

/* ── table ── */
.tbl{width:100%; border-collapse:collapse;}
.tbl th{
  text-align:left; font-size:11.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em;
  padding:10px 14px; border-bottom:1px solid var(--n3);
}
.tbl td{padding:13px 14px; font-size:13.5px; border-bottom:1px solid var(--n3); color:var(--n9);}
.tbl tr.row-clickable{cursor:pointer; transition:background .12s;}
.tbl tr.row-clickable:hover{background:var(--n0);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
.badge.neutral{background:var(--n2); color:var(--n8);}
.badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.badge.danger{background:var(--s2-bg); color:var(--s2-text);}
.badge.brand{background:var(--m50); color:var(--m700);}

/* ── stepper ── */
.stepper{display:flex; align-items:center; gap:0;}
.step{display:flex; align-items:center; gap:6px;}
.step-dot{width:20px; height:20px; border-radius:99px; background:var(--n3); color:var(--n6); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.step-dot.done{background:var(--m600); color:#fff;}
.step-dot.current{background:var(--m100); color:var(--m700); border:2px solid var(--m600);}
.step-label{font-size:11.5px; color:var(--n7); margin-right:10px;}
.step-label.done, .step-label.current{color:var(--n10); font-weight:600;}
.step-line{width:24px; height:2px; background:var(--n3); margin-right:10px;}
.step-line.done{background:var(--m500);}

/* ── search / filter chips ── */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--n1); border:1px solid var(--n3);
  border-radius:12px; padding:9px 14px; flex:1; min-width:200px; max-width:320px; color:var(--n6);
}
.search-box input{border:none; outline:none; background:none; font-size:13.5px; color:var(--n10); width:100%;}
.chip{padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:600; background:var(--n2); color:var(--n7); border:1px solid transparent; transition:all .15s;}
.chip.active{background:var(--m50); color:var(--m700); border-color:var(--m200);}
.chip:hover{background:var(--n3);}

/* ── list / catalog card ── */
.item-list{display:flex; flex-direction:column; gap:8px;}
.item-row{
  display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--n1); border:1px solid var(--n3);
  border-radius:13px; cursor:pointer; transition:border-color .15s, transform .12s;
}
.item-row:hover{border-color:var(--n5); transform:translateX(2px);}
.item-avatar{width:38px; height:38px; border-radius:11px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.item-main{flex:1; min-width:0;}
.item-title{font-size:13.5px; font-weight:600; color:var(--n10);}
.item-meta{font-size:11.5px; color:var(--n7); margin-top:2px;}

/* ── modal ── */
.overlay{position:fixed; inset:0; background:rgba(29,30,28,.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeInUp .2s ease;}
.modal{background:var(--n1); border-radius:20px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(29,30,28,.25); animation:cardStagger .25s ease;}
.modal-lg{max-width:680px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--n3);}
.modal-title{font-size:16.5px; font-weight:700;}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid var(--n3);}
.close-btn{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.close-btn:hover{background:var(--n2);}

.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 13px; border:1px solid var(--n3); border-radius:12px; font-size:13.5px; color:var(--n10); background:var(--n0);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--m500); box-shadow:0 0 0 3px var(--m50);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.radio-group{display:flex; gap:10px;}
.radio-opt{flex:1; padding:10px; border:1px solid var(--n3); border-radius:12px; text-align:center; font-size:13px; font-weight:600; color:var(--n7); cursor:pointer;}
.radio-opt.selected{border-color:var(--m500); background:var(--m50); color:var(--m700);}

/* ── drawer ── */
.drawer-overlay{position:fixed; inset:0; background:rgba(29,30,28,.35); z-index:100; display:flex; justify-content:flex-end;}
.drawer{width:440px; max-width:92vw; height:100%; background:var(--n1); box-shadow:-16px 0 40px rgba(29,30,28,.18); overflow-y:auto; animation:slideInRight .28s ease;}
.drawer-head{padding:22px 24px; border-bottom:1px solid var(--n3); display:flex; align-items:flex-start; justify-content:space-between;}
.drawer-body{padding:22px 24px;}
.drawer-tabs{display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--n3);}
.drawer-tab{padding:10px 4px; margin-right:20px; font-size:13px; font-weight:600; color:var(--n7); border-bottom:2px solid transparent;}
.drawer-tab.active{color:var(--m700); border-color:var(--m600);}
.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
.info-item .info-label{font-size:11.5px; color:var(--n6); margin-bottom:3px;}
.info-item .info-value{font-size:13.5px; font-weight:600; color:var(--n10);}

/* ── toast ── */
.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  display:flex; align-items:center; gap:10px; background:var(--n10); color:var(--n0);
  padding:13px 18px; border-radius:13px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:toastIn .25s ease;
}
.toast .ph{color:var(--s1);}

/* ── doc preview ── */
.doc-preview{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:22px; font-size:12.5px;}
.doc-preview-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid var(--n9);}
.doc-preview table{width:100%; border-collapse:collapse; margin-top:10px;}
.doc-preview th{text-align:left; font-size:11px; color:var(--n6); padding:6px 4px; border-bottom:1px solid var(--n4);}
.doc-preview td{padding:7px 4px; font-size:12px; border-bottom:1px solid var(--n3);}
.skeleton{background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:400px 100%; animation:shimmer 1.3s infinite linear; border-radius:8px;}

.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 20px; color:var(--n6); text-align:center;}
.empty-state svg{margin-bottom:14px;}

/* icon utility */
.icon-orange{color:var(--m600);}
.icon-muted{color:var(--n7);}
</style>
</head>

function inQuickRange(dateStr, range){
  if(range === '전체' || !dateStr) return true;
  if(range === '오늘') return dateStr === TODAY;

}

function Icon({name, size=17, weight='regular', className=''}){
  return <i className={`ph${weight==='fill'?'-fill':''} ph-${name} ${className}`} style={{fontSize:size}}></i>;
}

function useRipple(){
  return (e) => {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const el = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    el.className = 'ripple-el';
    el.style.width = el.style.height = size + 'px';
    el.style.left = (e.clientX - rect.left - size/2) + 'px';
    el.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(el);
    setTimeout(() => el.remove(), 500);
  };
}

function Btn({children, variant='ghost', sm, onClick, ...rest}){
  const ripple = useRipple();
  return (
    <button
      className={`btn btn-${variant} ${sm?'btn-sm':''}`}
      onClick={(e)=>{ripple(e); onClick && onClick(e);}}
      {...rest}
    >{children}</button>
  );
}

function CountUp({value, warn}){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let start = null; const dur = 700;
    function step(ts){
      if(!start) start = ts;
      const p = Math.min((ts-start)/dur, 1);
      setN(Math.round(value * (1 - Math.pow(1-p, 3))));
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }, [value]);
  return <span className={`stat-value ${warn?'warn':''}`}>{n}</span>;
}

  );
}

  const lowStock = items.filter(i=>i.stock < i.min).length;

  );

function PartnersScreen({partners, setPartners, pushToast}){
  const [q, setQ] = useState('');
  const [grade, setGrade] = useState('전체');
  const [selected, setSelected] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [catFilter, setCatFilter] = useState('전체');

  const filtered = partners.filter(p =>
    (grade==='전체' || p.grade===grade) &&
    (p.name.includes(q) || p.manager.includes(q))
  );
  const cats = ['전체', ...new Set(ITEMS.map(i=>i.cat))];
  const filteredItems = ITEMS.filter(i => catFilter==='전체' || i.cat===catFilter);

  return (
    <div className="screen">
      <div className="page-head">
        <div>
          <div className="page-title">거래처·품목 단가 관리</div>
          <div className="page-desc">거래처 정보를 관리하고 품목별 단가를 이력으로 추적합니다.</div>
        </div>
        <Btn variant="primary" onClick={()=>setShowForm(true)}><Icon name="plus" size={15}/>거래처 등록</Btn>
      </div>

      <div className="toolbar">
        <div className="search-box"><Icon name="magnifying-glass" size={15}/><input placeholder="거래처명·담당자 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
        {['전체','우수','일반','휴면'].map(g=>(
          <button key={g} className={`chip ${grade===g?'active':''}`} onClick={()=>setGrade(g)}>{g}</button>
        ))}
      </div>

      <div className="panel" style={{marginBottom:20}}>
        <div className="item-list">
          {filtered.map(p=>(
            <div className="item-row" key={p.id} onClick={()=>setSelected(p)}>
              <div className="item-avatar">{p.name[0]}</div>
              <div className="item-main">
                <div className="item-title">{p.name}</div>
                <div className="item-meta">{p.manager} · 주문 {p.orders}건 · 거래시작 {p.since}</div>
              </div>
              <Badge tone={p.grade==='우수'?'brand':p.grade==='휴면'?'neutral':'neutral'}>{p.grade}</Badge>
            </div>
          ))}
          {filtered.length===0 && <div className="empty-state"><Icon name="magnifying-glass" size={32}/>검색 결과가 없습니다</div>}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><Icon name="package" size={18} className="icon-orange"/>품목 카탈로그</div>
        </div>
        <div className="toolbar" style={{marginBottom:12}}>
          {cats.map(c=>(<button key={c} className={`chip ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>))}
        </div>
        <table className="tbl">
          <thead><tr><th>품목명</th><th>분류</th><th>단가</th><th>재고</th></tr></thead>
          <tbody>
            {filteredItems.map(it=>(
              <tr key={it.id}>
                <td>{it.name}</td>
                <td><Badge tone="neutral">{it.cat}</Badge></td>
                <td>{it.price.toLocaleString()}원</td>
                <td>{it.stock < it.min ? <Badge tone="danger">{it.stock}개 부족</Badge> : `${it.stock}개`}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {selected && <PartnerDrawer partner={selected} onClose={()=>setSelected(null)}/>}
      {showForm && <PartnerFormModal onClose={()=>setShowForm(false)} onSubmit={(f)=>{
        setPartners([{id:'P-'+Math.floor(1000+Math.random()*9000), name:f.name||'신규거래처', biz:f.biz||'-', manager:f.manager||'-', phone:f.phone||'-', email:'-', grade:'일반', orders:0, since:'2026.09'}, ...partners]);
        pushToast('거래처가 등록되었습니다', 'check-circle');
      }}/>}
    </div>
  );
}

/* ───────────── orders screen ───────────── */
function OrderFormModal({onClose, onSubmit, partners}){
  const [partner, setPartner] = useState(partners[0]?.name || '');
  const [item, setItem] = useState(ITEMS[0].name);
  const [qty, setQty] = useState(1);
  const [channel, setChannel] = useState('전화');
  return (
    <Modal title="주문 접수" onClose={onClose}
      footer={<>
        <Btn variant="ghost" onClick={onClose}>취소</Btn>
        <Btn variant="primary" onClick={()=>{onSubmit({partner,item,qty,channel}); onClose();}}>접수 저장</Btn>
      </>}>
      <div className="field">
        <label>접수 경로</label>
        <div className="radio-group">
          <div className={`radio-opt ${channel==='전화'?'selected':''}`} onClick={()=>setChannel('전화')}><Icon name="phone" size={14}/> 전화</div>
          <div className={`radio-opt ${channel==='문자'?'selected':''}`} onClick={()=>setChannel('문자')}><Icon name="chat-text" size={14}/> 문자</div>
        </div>
      </div>
      <div className="field">
        <label>거래처</label>
        <select value={partner} onChange={e=>setPartner(e.target.value)}>
          {partners.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
        </select>
      </div>
      <div className="field-row">
        <div className="field">
          <label>품목</label>
          <select value={item} onChange={e=>setItem(e.target.value)}>
            {ITEMS.map(i=><option key={i.id} value={i.name}>{i.name}</option>)}
          </select>
        </div>
        <div className="field"><label>수량</label><input type="number" min="1" value={qty} onChange={e=>setQty(Number(e.target.value))}/></div>
      </div>
      <div className="field"><label>메모 (선택)</label><textarea rows="2" placeholder="특이사항을 입력하세요"></textarea></div>
    </Modal>
  );
}

function OrderDrawer({order, onClose, onAdvance, pushToast}){
  const [blocked, setBlocked] = useState(false);
  if(!order) return null;
  const idx = STAGES.indexOf(order.status);
  const handleShip = () => {
    if(!order.stockOk){ setBlocked(true); return; }
    onAdvance(order.id);
    pushToast('출고 처리가 완료되었습니다', 'truck');
    onClose();
  };
  return (
    <Drawer onClose={onClose}>
      <div className="drawer-head">
        <div>
          <div style={{fontSize:17, fontWeight:700}}>{order.id}</div>
          <div style={{fontSize:12, color:'var(--n7)', marginTop:3}}>{order.partner}</div>
        </div>
        <button className="close-btn" onClick={onClose}><Icon name="x" size={18}/></button>
      </div>
      <div className="drawer-body">
        <div className="stepper" style={{marginBottom:22, flexWrap:'wrap'}}>
          {STAGES.map((s,i)=>(
            <React.Fragment key={s}>
              <div className="step">
                <span className={`step-dot ${i<idx?'done':i===idx?'current':''}`}>{i<idx?<Icon name="check" size={11}/>:i+1}</span>
                <span className={`step-label ${i<=idx?'done':''}`}>{s}</span>
              </div>
              {i<STAGES.length-1 && <span className={`step-line ${i<idx?'done':''}`}></span>}
            </React.Fragment>
          ))}
        </div>
        <div className="info-grid">
          <div className="info-item"><div className="info-label">품목</div><div className="info-value">{order.item}</div></div>
          <div className="info-item"><div className="info-label">수량</div><div className="info-value">{order.qty}개</div></div>
          <div className="info-item"><div className="info-label">접수경로</div><div className="info-value">{order.channel}</div></div>
          <div className="info-item"><div className="info-label">발송 마감</div><div className="info-value">{order.due}</div></div>
        </div>
        {!order.stockOk && (
          <div style={{background:'var(--s2-bg)', color:'var(--s2-text)', padding:'11px 14px', borderRadius:12, fontSize:12.5, marginBottom:18, display:'flex', gap:8, alignItems:'center'}}>
            <Icon name="warning" size={16}/> 해당 품목의 재고가 부족합니다. 보충 후 출고 처리하세요.
          </div>
        )}
        {order.status !== '발송완료' && <Btn variant="primary" onClick={handleShip}><Icon name="truck" size={15}/>출고 처리</Btn>}
        {blocked && (
          <div style={{marginTop:12, fontSize:12, color:'var(--s2-text)'}}>
            <Icon name="x-circle" size={13}/> 재고 수량이 부족하여 출고를 진행할 수 없습니다.
          </div>
        )}
      </div>
    </Drawer>
  );
}

function OrdersScreen({orders, setOrders, partners, pushToast, quickRange}){
  const [status, setStatus] = useState('전체');
  const [showForm, setShowForm] = useState(false);
  const [selected, setSelected] = useState(null);

  const filtered = orders.filter(o => (status==='전체' || o.status===status) && inQuickRange(o.due, quickRange));

  const advance = (id) => {
    setOrders(orders.map(o => {
      if(o.id !== id) return o;
      const idx = STAGES.indexOf(o.status);
      return {...o, status: STAGES[Math.min(idx+1, STAGES.length-1)]};
    }));
  };

  return (
    <div className="screen">
      <div className="page-head">
        <div>
          <div className="page-title">주문 접수 및 발송·출고 관리</div>
          <div className="page-desc">전화·문자로 접수한 주문을 기록하고 출고까지의 진행 상태를 추적합니다.</div>
        </div>
        <Btn variant="primary" onClick={()=>setShowForm(true)}><Icon name="plus" size={15}/>새 주문 접수</Btn>
      </div>
      <div className="toolbar">
        {['전체', ...STAGES].map(s=>(<button key={s} className={`chip ${status===s?'active':''}`} onClick={()=>setStatus(s)}>{s}</button>))}
      </div>
      <div className="panel">
        <table className="tbl">
          <thead><tr><th>주문번호</th><th>거래처</th><th>품목</th><th>수량</th><th>경로</th><th>상태</th><th>마감</th></tr></thead>
          <tbody>
            {filtered.map(o=>(
              <tr key={o.id} className="row-clickable" onClick={()=>setSelected(o)}>
                <td>{o.id}</td>
                <td>{o.partner}</td>
                <td>{o.item}</td>
                <td>{o.qty}개</td>
                <td>{o.channel}</td>
                <td>
                  <Badge tone={o.status==='발송완료'?'ok':(!o.stockOk?'danger':'neutral')}>{o.status}</Badge>
                </td>
                <td>{o.due}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {showForm && <OrderFormModal partners={partners} onClose={()=>setShowForm(false)} onSubmit={(f)=>{
        const stockItem = ITEMS.find(i=>i.name===f.item);
        setOrders([{id:'ORD-'+Math.floor(4900+Math.random()*90), partner:f.partner, item:f.item, qty:f.qty, status:'접수', channel:f.channel, due:'2026.09.10', stockOk: stockItem ? stockItem.stock >= f.qty : true}, ...orders]);
        pushToast('주문이 접수되었습니다', 'clipboard-text');
      }}/>}
      {selected && <OrderDrawer order={selected} onClose={()=>setSelected(null)} onAdvance={advance} pushToast={pushToast}/>}
    </div>
  );
}

/* ───────────── documents screen ───────────── */
function DocIssueModal({onClose, onIssue, orders}){
  const [step, setStep] = useState(1);
  const [orderId, setOrderId] = useState(orders[0]?.id || '');
  const [docType, setDocType] = useState('견적서');
  const [generating, setGenerating] = useState(false);
  const order = orders.find(o=>o.id===orderId);
  const amount = order ? (ITEMS.find(i=>i.name===order.item)?.price || 30000) * order.qty : 0;

  const generate = () => {
    setGenerating(true);
    setTimeout(()=>{ setGenerating(false); setStep(2); }, 900);
  };

  return (
    <Modal title="문서 발행" lg onClose={onClose}
      footer={step===1
        ? <><Btn variant="ghost" onClick={onClose}>취소</Btn><Btn variant="primary" onClick={generate}>미리보기 생성</Btn></>
        : <><Btn variant="ghost" onClick={()=>setStep(1)}>이전</Btn><Btn variant="primary" onClick={()=>{onIssue({orderId, docType, amount}); onClose();}}><Icon name="paper-plane-tilt" size={14}/>발행 및 발송</Btn></>
      }>
      {step===1 && (
        <>
          <div className="field">
            <label>문서 유형</label>
            <div className="radio-group">
              <div className={`radio-opt ${docType==='견적서'?'selected':''}`} onClick={()=>setDocType('견적서')}>견적서</div>
              <div className={`radio-opt ${docType==='거래명세서'?'selected':''}`} onClick={()=>setDocType('거래명세서')}>거래명세서</div>
            </div>
          </div>
          <div className="field">
            <label>대상 주문</label>
            <select value={orderId} onChange={e=>setOrderId(e.target.value)}>
              {orders.map(o=><option key={o.id} value={o.id}>{o.id} · {o.partner} · {o.item}</option>)}
            </select>
          </div>
          {generating && <div className="skeleton" style={{height:120}}></div>}
        </>
      )}
      {step===2 && order && (
        <div className="doc-preview">
          <div className="doc-preview-head">
            <div>
              <div style={{fontWeight:800, fontSize:15}}>{docType}</div>
              <div style={{fontSize:11, color:'var(--n7)', marginTop:2}}>발행일 2026.09.04</div>
            </div>
            <div style={{textAlign:'right', fontSize:11, color:'var(--n7)'}}>
              <div style={{fontWeight:700, color:'var(--n10)'}}>(주)샘플기계제조</div>
              <div>서울시 강서구 소모품로 12</div>
            </div>
          </div>
          <div style={{fontSize:12, marginBottom:4}}><b>수신:</b> {order.partner}</div>
          <table>
            <thead><tr><th>품목</th><th>수량</th><th>단가</th><th>금액</th></tr></thead>
            <tbody>
              <tr>
                <td>{order.item}</td><td>{order.qty}</td>
                <td>{(amount/order.qty).toLocaleString()}원</td>
                <td>{amount.toLocaleString()}원</td>
              </tr>
            </tbody>
          </table>
          <div style={{textAlign:'right', marginTop:12, fontSize:13.5, fontWeight:700}}>합계 {amount.toLocaleString()}원</div>
        </div>
      )}
    </Modal>
  );
}

function DocumentsScreen({docs, setDocs, orders, pushToast, quickRange}){
  const [filter, setFilter] = useState('전체');
  const [showModal, setShowModal] = useState(false);
  const filtered = docs.filter(d => (filter==='전체' || d.sendStatus===filter) && inQuickRange(d.date, quickRange));

  const resend = (id) => {
    setDocs(docs.map(d => d.id===id ? {...d, sendStatus:'성공', channel:'문자'} : d));
    pushToast('문자로 재발송되었습니다', 'paper-plane-tilt');
  };

  return (
    <div className="screen">
      <div className="page-head">
        <div>
          <div className="page-title">견적서·거래명세서 발행 및 자동 발송</div>
          <div className="page-desc">주문 데이터를 기반으로 문서를 발행하고 이메일·문자로 자동 발송합니다.</div>
        </div>
        <Btn variant="primary" onClick={()=>setShowModal(true)}><Icon name="file-plus" size={15}/>새 문서 발행</Btn>
      </div>
      <div className="toolbar">
        {['전체','성공','대기','실패'].map(s=>(<button key={s} className={`chip ${filter===s?'active':''}`} onClick={()=>setFilter(s)}>{s}</button>))}
      </div>
      <div className="panel">
        <table className="tbl">
          <thead><tr><th>문서번호</th><th>유형</th><th>거래처</th><th>금액</th><th>발행일</th><th>발송채널</th><th>발송상태</th><th></th></tr></thead>
          <tbody>
            {filtered.map(d=>(
              <tr key={d.id}>
                <td>{d.id}</td>
                <td><Badge tone="neutral">{d.type}</Badge></td>
                <td>{d.partner}</td>
                <td>{d.amount.toLocaleString()}원</td>
                <td>{d.date}</td>
                <td>{d.channel}</td>
                <td><Badge tone={d.sendStatus==='성공'?'ok':d.sendStatus==='실패'?'danger':'neutral'}>{d.sendStatus}</Badge></td>
                <td>{d.sendStatus!=='성공' && <Btn variant="outline" sm onClick={()=>resend(d.id)}>재발송</Btn>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {showModal && <DocIssueModal orders={orders} onClose={()=>setShowModal(false)} onIssue={(f)=>{
        const order = orders.find(o=>o.id===f.orderId);
        setDocs([{id:'DOC-'+Math.floor(3400+Math.random()*90), type:f.docType, partner:order?.partner||'-', amount:f.amount, date:'2026.09.04', sendStatus:'성공', channel:'이메일'}, ...docs]);
        pushToast('견적서가 이메일로 발송되었습니다', 'paper-plane-tilt');
      }}/>}
    </div>
  );
}

/* ───────────── global search ───────────── */
function GlobalSearchModal({onClose, partners, orders, docs, goTo}){
  const [q, setQ] = useState('');
  const results = q.trim() ? [
    ...partners.filter(p=>p.name.includes(q)).slice(0,3).map(p=>({kind:'거래처', label:p.name, sub:p.manager, screen:'partners'})),
    ...orders.filter(o=>o.id.includes(q)||o.partner.includes(q)||o.item.includes(q)).slice(0,3).map(o=>({kind:'주문', label:o.id+' · '+o.partner, sub:o.item, screen:'orders'})),
    ...docs.filter(d=>d.id.includes(q)||d.partner.includes(q)).slice(0,3).map(d=>({kind:'문서', label:d.id+' · '+d.partner, sub:d.type, screen:'documents'})),
  ] : [];
  return (
    <Modal title="통합 검색" onClose={onClose}>
      <div className="search-box" style={{maxWidth:'none', marginBottom:14}}>
        <Icon name="magnifying-glass" size={15}/>
        <input autoFocus placeholder="거래처, 주문번호, 문서번호로 검색" value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="item-list">
        {results.map((r,i)=>(
          <div className="item-row" key={i} onClick={()=>{goTo(r.screen); onClose();}}>
            <div className="item-avatar"><Icon name="arrow-right" size={15}/></div>
            <div className="item-main">
              <div className="item-title">{r.label}</div>
              <div className="item-meta">{r.kind} · {r.sub}</div>
            </div>
          </div>
        ))}
        {q.trim() && results.length===0 && <div className="empty-state"><Icon name="magnifying-glass" size={28}/>검색 결과가 없습니다</div>}
      </div>
    </Modal>
  );
}

/* ───────────── app ───────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [partners, setPartners] = useState(PARTNERS);
  const [orders, setOrders] = useState(ORDER_SEED);
  const [docs, setDocs] = useState(DOC_SEED);
  const [toasts, setToasts] = useState([]);
  const [selectedOrderMain, setSelectedOrderMain] = useState(null);
  const [quickRange, setQuickRange] = useState('전체');
  const [searchOpen, setSearchOpen] = useState(false);

  const pushToast = (msg, icon) => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, icon}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 2600);
  };

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <Header screen={screen} setScreen={setScreen}
        onSearch={()=>setSearchOpen(true)}
        onBell={()=>pushToast('재고 부족 2건, 발송 마감 임박 2건이 대기 중입니다', 'bell')}/>
      <QuickRangeBar range={quickRange} onChange={setQuickRange}/>
      <main style={{flex:1, width:'100%'}}>
        <div className="content">
          {screen==='main' && <MainScreen orders={orders} items={ITEMS} openOrder={setSelectedOrderMain} quickRange={quickRange}/>}
          {screen==='partners' && <PartnersScreen partners={partners} setPartners={setPartners} pushToast={pushToast}/>}
          {screen==='orders' && <OrdersScreen orders={orders} setOrders={setOrders} partners={partners} pushToast={pushToast} quickRange={quickRange}/>}
          {screen==='documents' && <DocumentsScreen docs={docs} setDocs={setDocs} orders={orders} pushToast={pushToast} quickRange={quickRange}/>}
        </div>
      </main>
      {searchOpen && <GlobalSearchModal onClose={()=>setSearchOpen(false)} partners={partners} orders={orders} docs={docs} goTo={setScreen}/>}
      {selectedOrderMain && <OrderDrawer order={selectedOrderMain} onClose={()=>setSelectedOrderMain(null)} onAdvance={(id)=>{
        setOrders(orders.map(o=>{
          if(o.id!==id) return o;
          const idx = STAGES.indexOf(o.status);
          return {...o, status: STAGES[Math.min(idx+1, STAGES.length-1)]};
        }));
      }} pushToast={pushToast}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
