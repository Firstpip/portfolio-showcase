<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레코드허브 — 제조 소모품 통합 레코드 관리 플랫폼</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, light) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#273b62;
  --n0:#ffffff; --n1:#e5e5e7; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#95979e; --n7:#71747a; --n8:#53565a; --n9:#36373a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n10);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; letter-spacing:inherit;}
input,select,textarea{font-family:inherit; letter-spacing:inherit;}
a{color:inherit; text-decoration:none; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

/* ── keyframes ── */
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes slideDown{from{transform:translateY(-8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes shimmer2{0%{background-position:-320px 0;} 100%{background-position:320px 0;}}
@keyframes rowIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes cmdkIn{from{opacity:0; transform:translateY(-10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes spin2{to{transform:rotate(360deg);}}

/* ── root layout: linear-sidebar-cmdk ── */
.app-shell{display:flex; width:100%; min-height:100vh;}

/* ── sidebar (signature 240-280px) ── */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:var(--n0); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; z-index:30;
}
.sidebar-brand{
  height:64px; display:flex; align-items:center; gap:9px; padding:0 18px;
  border-bottom:1px solid var(--n3); font-weight:700; font-size:15px; flex-shrink:0;
}
.sidebar-brand .mark{width:26px; height:26px; border-radius:8px; background:var(--m500); color:#fff; display:flex; align-items:center; justify-content:center;}
.sidebar-cmdk-hint{
  margin:12px 14px; padding:9px 12px; border:1px solid var(--n3); border-radius:9999px;
  display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--n7); flex-shrink:0;
}
.kbd{
  font-size:10.5px; font-weight:600; background:var(--n2); border:1px solid var(--n4);
  border-radius:4px; padding:1px 6px; color:var(--n8);
}
.sidebar-nav{padding:6px 10px; display:flex; flex-direction:column; gap:2px;}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9999px;
  font-size:13.5px; font-weight:500; color:var(--n7); border-left:3px solid transparent;
  transition:background .13s, color .13s;
}
.sidebar-link:hover{background:var(--n2); color:var(--n10);}
.sidebar-link.active{background:var(--m50); color:var(--m700); font-weight:600; border-left-color:var(--m500);}
.sidebar-section{padding:14px 10px 4px;}
.sidebar-section-title{font-size:10.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.04em; padding:4px 11px 6px;}
.sidebar-user{
  margin-top:auto; padding:12px 14px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.sidebar-user .avatar2{width:30px; height:30px; border-radius:9999px; background:var(--n9); color:var(--n0); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;}

/* ── main ── */
.main{margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px); display:flex; flex-direction:column; min-height:100vh;}
.topbar{
  height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 26px;
  border-bottom:1px solid var(--n3); position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); z-index:20; width:100%;
}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--n6);}
.breadcrumb a{color:var(--n6); transition:color .13s;}
.breadcrumb a:hover{color:var(--m600);}
.breadcrumb .current{color:var(--n10); font-weight:600;}
.breadcrumb .divider{color:var(--n4);}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.btn-cmdk{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--n3); border-radius:9999px;
  font-size:12px; color:var(--n7); background:var(--n0);
}
.btn-cmdk:hover{border-color:var(--n5);}

.content{flex:1; width:100%; padding:24px 26px 56px;}
.screen{animation:fadeIn .3s ease both;}

/* ── page head ── */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-title{font-size:24px; font-weight:800; letter-spacing:-.02em;}
.hero-title{font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:1.08;}
.page-desc{font-size:13px; color:var(--n7); margin-top:4px; max-width:520px;}

/* ── buttons (pill, flat) ── */
.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 18px; border-radius:9999px; font-size:13px; font-weight:600; transition:transform .1s, background .15s, border-color .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m500); color:#fff;}
.btn-primary:hover{background:var(--m600);}
.btn-ghost{background:var(--n0); color:var(--n9); border:1px solid var(--n3);}
.btn-ghost:hover{border-color:var(--n6);}
.btn-outline{background:transparent; color:var(--m600); border:1px solid var(--m300);}
.btn-outline:hover{background:var(--m50);}
.btn-danger{background:var(--s2); color:#fff;}
.btn-sm{padding:6px 12px; font-size:11.5px;}

/* ── master-detail ── */
.md-grid{display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start;}
@media (max-width:920px){.md-grid{grid-template-columns:1fr;}}
.list-rail{background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.rail-tabs{display:flex; border-bottom:1px solid var(--n3);}
.rail-tab{flex:1; padding:11px 4px; text-align:center; font-size:12.5px; font-weight:600; color:var(--n7); border-bottom:2px solid transparent;}
.rail-tab[aria-selected="true"]{color:var(--m700); border-bottom-color:var(--m500); background:var(--m50);}
.rail-search{padding:10px 12px; border-bottom:1px solid var(--n3);}
.rail-search input{width:100%; border:1px solid var(--n3); border-radius:9999px; padding:8px 14px; font-size:12.5px; background:var(--n2);}
.rail-search input:focus{outline:none; border-color:var(--m400);}
.rail-items{max-height:520px; overflow-y:auto;}
.rail-row{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--n2);
  cursor:pointer; transition:background .12s, border-left-color .12s; border-left:3px solid transparent;
  animation:rowIn .25s ease both;
}
.rail-row:hover{background:var(--n2); transform:scale(1.015);}
.rail-row.selected{background:var(--m50); border-left-color:var(--m500);}
.rail-avatar{width:30px; height:30px; border-radius:9999px; background:var(--n2); color:var(--n8); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rail-row.selected .rail-avatar{background:var(--m100); color:var(--m700);}
.rail-main{flex:1; min-width:0;}
.rail-title{font-size:13px; font-weight:600; color:var(--n10); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rail-sub{font-size:11px; color:var(--n7); margin-top:1px;}

.detail-panel{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:22px; min-height:520px;}
.detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--n3);}
.detail-name{font-size:18px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:10px;}
.detail-tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--n3);}
.detail-tab{padding:9px 4px; margin-right:18px; font-size:12.5px; font-weight:600; color:var(--n7); border-bottom:2px solid transparent;}
.detail-tab[aria-selected="true"]{color:var(--m700); border-bottom-color:var(--m500);}
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
.summary-item .s-label{font-size:11px; color:var(--n6); margin-bottom:3px;}
.summary-item .s-value{font-size:13.5px; font-weight:600;}
.linked-list{display:flex; flex-direction:column; gap:8px;}
.linked-row{display:flex; align-items:center; justify-content:space-between; padding:10px 13px; border:1px solid var(--n3); border-radius:9px; font-size:12.5px;}
.check-item{display:flex; align-items:center; gap:9px; padding:9px 4px; font-size:13px;}
.check-box{width:17px; height:17px; border-radius:5px; border:1.5px solid var(--n4); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s, border-color .12s;}
.check-box.done{background:var(--m500); border-color:var(--m500); color:#fff;}

/* ── card / panel ── */
.panel{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-title{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:920px){.grid-2{grid-template-columns:1fr;}}
.chart-wrap2{position:relative; height:230px; width:100%;}

/* ── table ── */
.tbl{width:100%; border-collapse:collapse;}
.tbl th{text-align:left; font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; padding:9px 12px; border-bottom:1px solid var(--n3);}
.tbl td{padding:12px; font-size:13px; border-bottom:1px solid var(--n2); color:var(--n9);}
.tbl tr.row-clickable{cursor:pointer;}
.tbl tr.row-clickable:hover{background:var(--n2);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;}
.badge.neutral{background:var(--n2); color:var(--n8);}
.badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.badge.danger{background:var(--s2-bg); color:var(--s2-text);}
.badge.warn{background:var(--s3-bg); color:var(--s3-text);}
.badge.brand{background:var(--m50); color:var(--m700);}

/* ── toolbar / filter ── */
.toolbar{display:flex; align-items:center; gap:9px; margin-bottom:16px; flex-wrap:wrap;}
.select-field{padding:8px 12px; border:1px solid var(--n3); border-radius:9999px; font-size:12.5px; background:var(--n0); color:var(--n9);}
.pill-filter{padding:7px 14px; border-radius:9999px; font-size:12px; font-weight:600; background:var(--n2); color:var(--n7); border:1px solid transparent;}
.pill-filter[aria-selected="true"]{background:var(--m50); color:var(--m700); border-color:var(--m200);}

/* ── modal ── */
.overlay{position:fixed; inset:0; background:rgba(30,30,32,.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--n0); border-radius:16px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(20,20,24,.28); animation:slideDown .22s ease;}
.modal-lg{max-width:700px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--n3);}
.modal-title{font-size:15.5px; font-weight:700;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:15px 22px; border-top:1px solid var(--n3);}
.close-btn{width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.close-btn:hover{background:var(--n2);}
.field{margin-bottom:15px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.field input, .field select{width:100%; padding:9px 13px; border:1px solid var(--n3); border-radius:4px; font-size:13px; background:var(--n0);}
.field input:focus, .field select:focus{outline:none; border-color:var(--m400);}

/* ── cmd-k overlay ── */
.cmdk-overlay{position:fixed; inset:0; background:rgba(30,30,32,.32); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;}
.cmdk-modal{width:100%; max-width:520px; background:var(--n0); border-radius:14px; box-shadow:0 24px 64px rgba(20,20,24,.35); overflow:hidden; animation:cmdkIn .18s ease;}
.cmdk-input{width:100%; border:none; border-bottom:1px solid var(--n3); padding:16px 18px; font-size:14.5px; outline:none;}
.cmdk-results{max-height:320px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:10.5px; font-weight:700; color:var(--n6); text-transform:uppercase; padding:8px 10px 4px;}
.cmdk-item{display:flex; align-items:center; justify-content:space-between; padding:9px 11px; border-radius:8px; font-size:13px; cursor:pointer;}
.cmdk-item:hover{background:var(--n2);}

/* ── migration ── */
.dropzone{border:1.5px dashed var(--n4); border-radius:14px; padding:34px 20px; text-align:center; color:var(--n7); transition:border-color .15s, background .15s; cursor:pointer;}
.dropzone:hover{border-color:var(--m400); background:var(--m50);}
.map-row{display:grid; grid-template-columns:1fr 24px 1fr; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--n2); font-size:12.5px;}
.progress-track{height:7px; background:var(--n2); border-radius:9999px; overflow:hidden; margin:12px 0;}
.progress-fill{height:100%; background:var(--m500); border-radius:9999px; transition:width .4s ease;}
.skeleton2{background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:320px 100%; animation:shimmer2 1.2s infinite linear; border-radius:8px;}

/* ── admin matrix ── */
.perm-matrix{width:100%; border-collapse:collapse;}
.perm-matrix th, .perm-matrix td{padding:10px 12px; text-align:center; font-size:12px; border-bottom:1px solid var(--n2);}
.perm-matrix th:first-child, .perm-matrix td:first-child{text-align:left;}
.perm-toggle{width:32px; height:19px; border-radius:9999px; background:var(--n3); position:relative; display:inline-block; transition:background .15s;}
.perm-toggle.on{background:var(--m500);}
.perm-toggle::after{content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:9999px; background:#fff; transition:transform .15s;}
.perm-toggle.on::after{transform:translateX(13px);}

/* ── toast ── */
.toast-wrap{position:fixed; bottom:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:9px;}
.toast{display:flex; align-items:center; gap:9px; background:var(--n10); color:#fff; padding:12px 16px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:0 10px 28px rgba(0,0,0,.25); animation:slideDown .22s ease;}

.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:44px 18px; color:var(--n6); text-align:center; gap:10px;}
.spin-icon{animation:spin2 .9s linear infinite;}
</style>
</head>

<div id="root" data-archetype="linear-sidebar-cmdk"></div>

  {key:'admin', label:'역할 기반 권한 관리 및 일괄 내보내기', icon:'shield-check'},
];
const BREADCRUMB_LABEL = {main:'레코드 관리', analytics:'거래처별·품목별 통합 분석', migration:'레거시 데이터 가져오기', admin:'역할 기반 권한 관리 및 일괄 내보내기'};

/* ───────────── shared ui ───────────── */
function Icon({name, size=16, className=''}){
  const ref = React.useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons({ nameAttr:'data-lucide' }); });
  return <i ref={ref} data-lucide={name} className={className} style={{width:size, height:size, display:'inline-block'}}></i>;
}

function Btn({children, variant='ghost', sm, onClick, ...rest}){
  return <button className={`btn btn-${variant} ${sm?'btn-sm':''}`} onClick={onClick} {...rest}>{children}</button>;
}

function Badge({tone='neutral', children}){ return <span className={`badge ${tone}`}>{children}</span>; }

function Modal({title, onClose, children, footer, lg}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className={`modal ${lg?'modal-lg':''}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><div className="modal-title">{title}</div>
          <button className="close-btn" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t=>(
    <div className="toast" key={t.id}><Icon name={t.icon||'check-circle'} size={15}/><span>{t.msg}</span></div>
  ))}</div>;
}

/* ───────────── sidebar / topbar ───────────── */

          <Icon name="bar-chart-3" size={16}/>거래처별·품목별 통합 분석

        <a href="#" className={`sidebar-link ${screen==='migration'?'active':''}`} onClick={e=>{e.preventDefault(); setScreen('migration');}}>
          <Icon name="upload-cloud" size={16}/>레거시 데이터 가져오기
        </a>
        <a href="#" className={`sidebar-link ${screen==='admin'?'active':''}`} onClick={e=>{e.preventDefault(); setScreen('admin');}}>

function Topbar({screen, onCmdk, actionLabel, onAction}){

function CmdkOverlay({onClose, goTo}){
  const [q, setQ] = useState('');

/* ───────────── main (master-detail) ───────────── */
function DetailPanel({record, pushToast}){
  const [tab, setTab] = useState('요약');
  if(!record) return (
    <div className="detail-panel">
      <div className="empty-state"><Icon name="mouse-pointer-click" size={30}/>왼쪽 리스트에서 레코드를 선택하면 상세 정보가 표시됩니다</div>
    </div>
  );
  const linked = record.type==='거래처' ? ORDERS2.filter(o=>o.name.includes(record.name)) : [];
  const [checks, setChecks] = useState([
    {label:'기본 정보 확인', done:true},
    {label:'재고/단가 정합성 확인', done: record.type!=='품목' || record.stock >= record.min},
    {label:'담당자 배정', done:true},

  const toggleCheck = (i) => setChecks(checks.map((c,ix)=> ix===i ? {...c, done:!c.done} : c));

  return (
    <div className="detail-panel" style={{boxShadow:'0 1px 3px rgba(20,20,24,0.06)'}}>
      <div className="detail-head">
        <div className="detail-name"><Icon name={record.type==='거래처'?'building-2':record.type==='품목'?'package':'file-text'} size={19}/>{record.name}</div>
        <Badge tone="neutral">{record.type}</Badge>
      </div>
      <div className="detail-tabs">
        <div className="detail-tab" aria-selected={tab==='요약'} style={{cursor:'pointer'}} onClick={()=>setTab('요약')}>요약</div>
        <div className="detail-tab" aria-selected={tab==='연결항목'} style={{cursor:'pointer'}} onClick={()=>setTab('연결항목')}>연결 항목</div>
        <div className="detail-tab" aria-selected={tab==='체크리스트'} style={{cursor:'pointer'}} onClick={()=>setTab('체크리스트')}>체크리스트</div>
        <div className="detail-tab" aria-selected={tab==='문서'} style={{cursor:'pointer'}} onClick={()=>setTab('문서')}>문서</div>
      </div>
      {tab==='요약' && (
        <div className="summary-grid">
          {record.manager && <div className="summary-item"><div className="s-label">담당자</div><div className="s-value">{record.manager}</div></div>}
          {record.phone && <div className="summary-item"><div className="s-label">연락처</div><div className="s-value">{record.phone}</div></div>}
          {record.grade && <div className="summary-item"><div className="s-label">등급</div><div className="s-value">{record.grade}</div></div>}
          {record.orders !== undefined && <div className="summary-item"><div className="s-label">누적 주문</div><div className="s-value">{record.orders}건</div></div>}
          {record.cat && <div className="summary-item"><div className="s-label">분류</div><div className="s-value">{record.cat}</div></div>}
          {record.price !== undefined && <div className="summary-item"><div className="s-label">단가</div><div className="s-value">{record.price.toLocaleString()}원</div></div>}
          {record.stock !== undefined && <div className="summary-item"><div className="s-label">재고</div><div className="s-value">{record.stock < record.min ? <Badge tone="danger">{record.stock}개 부족</Badge> : `${record.stock}개`}</div></div>}
          {record.status && <div className="summary-item"><div className="s-label">진행 상태</div><div className="s-value"><Badge tone={record.status==='발송완료'?'ok':'neutral'}>{record.status}</Badge></div></div>}
          {record.due && <div className="summary-item"><div className="s-label">발송 마감</div><div className="s-value">{record.due}</div></div>}
        </div>
      )}
      {tab==='연결항목' && (
        <div className="linked-list">
          {linked.length>0 ? linked.map(l=>(
            <div className="linked-row" key={l.id}><span>{l.name}</span><Badge tone="neutral">{l.status}</Badge></div>
          )) : <div className="empty-state" style={{padding:'24px 8px'}}><Icon name="link-2" size={22}/>연결된 주문이 없습니다</div>}

      )}
      {tab==='체크리스트' && (
        <div>
          {checks.map((c,i)=>(
            <div className="check-item" key={i} style={{cursor:'pointer'}} onClick={()=>toggleCheck(i)}>
              <span className={`check-box ${c.done?'done':''}`}>{c.done && <Icon name="check" size={11}/>}</span>
              <span style={{color: c.done?'var(--n6)':'var(--n10)', textDecoration: c.done?'line-through':'none'}}>{c.label}</span>
            </div>
          ))}
        </div>
      )}
      {tab==='문서' && (
        <div className="empty-state" style={{padding:'24px 8px'}}>
          <Icon name="file-text" size={24}/>관련 문서 이력이 여기에 표시됩니다
          <Btn variant="outline" sm onClick={()=>pushToast('문서함으로 이동하려면 좌측 사이드바를 이용하세요','info')}>문서함 바로가기</Btn>
        </div>
      )}
    </div>
  );
}

/* ───────────── migration ───────────── */
function MigrationScreen({pushToast}){
  const [fileName, setFileName] = useState(null);
  const [mapping, setMapping] = useState({});
  const [step, setStep] = useState(1);
  const [progress, setProgress] = useState(0);
  const [report, setReport] = useState(null);

  const pickFile = () => {
    setFileName('얼마예요_품목단가_export_202608.csv');
    const init = {}; CSV_COLUMNS.forEach((c,i)=> init[c] = TARGET_FIELDS[i] || '');
    setMapping(init);
    setStep(2);
  };

  const runImport = () => {
    setStep(3); setProgress(0);
    const timer = setInterval(()=>{
      setProgress(p=>{
        if(p>=100){ clearInterval(timer); setReport({success:284, warn:12, fail:4}); return 100; }
        return p+14;
      });
    }, 180);
  };

  return (
    <div className="screen">
      <div className="page-head">
        <div>
          <div className="page-title">레거시 데이터 가져오기</div>
          <div className="page-desc">기존 관리 프로그램에서 내보낸 CSV 파일을 업로드하고 컬럼을 매핑해 검증 후 일괄 반영합니다.</div>
        </div>
      </div>

      {step===1 && (
        <div className="panel">
          <div className="dropzone" onClick={pickFile}>
            <Icon name="upload-cloud" size={30}/>
            <div style={{marginTop:10, fontWeight:600, fontSize:13.5}}>클릭하여 CSV 파일 선택</div>
            <div style={{fontSize:11.5, marginTop:4}}>품목·단가·견적서·거래명세서 내보내기 파일 지원</div>
          </div>
        </div>
      )}

      {step===2 && (
        <div className="panel">
          <div className="panel-head">
            <div className="panel-title"><Icon name="file-spreadsheet" size={15}/>{fileName}</div>
            <Btn variant="ghost" sm onClick={()=>setStep(1)}>파일 변경</Btn>
          </div>
          <div style={{fontSize:11.5, color:'var(--n7)', marginBottom:10}}>감지된 컬럼을 대상 필드에 매핑하세요</div>
          {CSV_COLUMNS.map(c=>(
            <div className="map-row" key={c}>
              <span style={{fontWeight:600}}>{c}</span>
              <Icon name="arrow-right" size={13}/>
              <select className="select-field" style={{width:'100%'}} value={mapping[c]||''} onChange={e=>setMapping({...mapping,[c]:e.target.value})}>
                <option value="">매핑 안 함</option>
                {TARGET_FIELDS.map(f=><option key={f} value={f}>{f}</option>)}
              </select>
            </div>
          ))}
          <div style={{marginTop:16, display:'flex', justifyContent:'flex-end'}}>
            <Btn variant="primary" disabled={!mapping['품목코드']} onClick={runImport}><Icon name="check" size={14}/>가져오기 실행</Btn>
          </div>
        </div>
      )}

      {step===3 && (
        <div className="panel">
          <div className="panel-title" style={{marginBottom:12}}><Icon name="loader-2" size={15} className={progress<100?'spin-icon':''}/>{progress<100?'가져오는 중…':'가져오기 완료'}</div>
          <div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}></div></div>
          {progress<100 && <div className="skeleton2" style={{height:60}}></div>}
          {report && (
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginTop:16}}>
              <div className="panel" style={{padding:14}}><div className="s-label" style={{fontSize:11, color:'var(--n6)'}}>성공</div><div style={{fontSize:20, fontWeight:800, color:'var(--s1-text)'}}>{report.success}건</div></div>
              <div className="panel" style={{padding:14}}><div className="s-label" style={{fontSize:11, color:'var(--n6)'}}>경고</div><div style={{fontSize:20, fontWeight:800, color:'var(--s3-text)'}}>{report.warn}건</div></div>
              <div className="panel" style={{padding:14}}><div className="s-label" style={{fontSize:11, color:'var(--n6)'}}>실패</div><div style={{fontSize:20, fontWeight:800, color:'var(--s2-text)'}}>{report.fail}건</div></div>
            </div>
          )}
          {report && (
            <div style={{marginTop:16, display:'flex', gap:9}}>
              <Btn variant="outline" onClick={()=>pushToast('실패 행 4건을 다시 내려받았습니다', 'download')}><Icon name="download" size={13}/>실패 행 다시 받기</Btn>
              <Btn variant="ghost" onClick={()=>{setStep(1); setReport(null); setFileName(null);}}>새 파일로 다시 시작</Btn>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ───────────── admin ───────────── */
function AdminScreen({pushToast}){
  const [matrix, setMatrix] = useState(()=>{
    const m = {};
    ROLES.forEach(r => { m[r] = {}; MENUS.forEach(menu => { m[r][menu] = (r==='관리자') || (r==='업무담당자' && menu!=='권한 설정'); }); });
    return m;
  });
  const [exporting, setExporting] = useState(false);

  const toggle = (role, menu) => setMatrix({...matrix, [role]: {...matrix[role], [menu]: !matrix[role][menu]}});

  const bulkExport = () => {
    setExporting(true);
    setTimeout(()=>{ setExporting(false); pushToast('현재 사용자 목록이 엑셀로 내보내졌습니다', 'download'); }, 900);
  };

  return (
    <div className="screen">
      <div className="page-head">
        <div>
          <div className="page-title">역할 기반 권한 관리 및 일괄 내보내기</div>
          <div className="page-desc">역할별 메뉴 접근 권한을 관리하고, 현재 목록 조건 그대로 엑셀로 내보냅니다.</div>
        </div>
        <Btn variant="primary" onClick={bulkExport}>{exporting ? <Icon name="loader-2" size={14} className="spin-icon"/> : <Icon name="download" size={14}/>}일괄 내보내기</Btn>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="panel-head"><div className="panel-title"><Icon name="shield-check" size={15}/>역할 · 메뉴 권한 매트릭스</div></div>
        <table className="perm-matrix">
          <thead><tr><th>역할</th>{MENUS.map(m=><th key={m}>{m}</th>)}</tr></thead>
          <tbody>
            {ROLES.map(role=>(
              <tr key={role}>
                <td style={{fontWeight:600}}>{role}</td>
                {MENUS.map(menu=>(
                  <td key={menu}>
                    <span className={`perm-toggle ${matrix[role][menu]?'on':''}`} style={{cursor:'pointer'}} onClick={()=>toggle(role,menu)}></span>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="panel">
        <div className="panel-head"><div className="panel-title"><Icon name="users" size={15}/>사용자 목록</div></div>
        <table className="tbl">
          <thead><tr><th>이름</th><th>부서</th><th>역할</th><th></th></tr></thead>
          <tbody>
            {USERS.map(u=>(
              <tr key={u.name}>
                <td>{u.name}</td><td>{u.dept}</td>
                <td>
                  <select className="select-field" defaultValue={u.role} onChange={()=>pushToast(u.name+'님의 역할이 변경되었습니다','check-circle')}>
                    {ROLES.map(r=><option key={r}>{r}</option>)}
                  </select>
                </td>
                <td><Btn variant="ghost" sm onClick={()=>pushToast(u.name+'님에게 권한 변경 알림을 전송했습니다','send')}>알림</Btn></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ───────────── app ───────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  const pushToast = (msg, icon) => {
    const id = Date.now();
    setToasts(t=>[...t, {id, msg, icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  };

  useEffect(()=>{
    const onKey = (e) => { if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(true); } };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, []);

  const actionLabel = screen==='main' ? null : null;

  return (
    <div className="app-shell">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main">
        <Topbar screen={screen} onCmdk={()=>setCmdkOpen(true)}/>
        <div className="content">
          {screen==='main' && <MainScreen pushToast={pushToast}/>}
          {screen==='analytics' && <AnalyticsScreen pushToast={pushToast}/>}
          {screen==='migration' && <MigrationScreen pushToast={pushToast}/>}
          {screen==='admin' && <AdminScreen pushToast={pushToast}/>}
        </div>
      </div>
      {cmdkOpen && <CmdkOverlay onClose={()=>setCmdkOpen(false)} goTo={setScreen}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
