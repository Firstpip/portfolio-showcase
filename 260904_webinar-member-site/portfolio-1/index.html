<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메디브릿지 포털 — 웨비나·자료 아카이브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 210°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbebfb; --m200:#b8d7f7; --m300:#8cbff2; --m400:#5ca4ed;
  --m500:#2e8be8; --m600:#0071e3; --m700:#005dba; --m800:#004891; --m900:#003366;
  --n0:#f2f2f4; --n1:#fdfdfd; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#8f8f8f; --n7:#71757a; --n8:#53575a; --n9:#36383a; --n10:#1e1f20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
#root{width:100%;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(0,113,227,0.28);}70%{box-shadow:0 0 0 10px rgba(0,113,227,0);}100%{box-shadow:0 0 0 0 rgba(0,113,227,0);}}
@keyframes spinLoad{to{transform:rotate(360deg);}}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* ── 트리 사이드바 ── */
.tree-sidebar{position:fixed;left:0;top:0;bottom:0;width:264px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;z-index:20;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;}
.brand-text{font-size:15px;font-weight:600;color:var(--n9);letter-spacing:-0.02em;}
.brand-sub{font-size:11px;color:var(--n6);margin-top:1px;}
.sidebar-search{display:flex;gap:8px;margin-bottom:16px;}
.search-btn,.quick-add-btn{flex:1;display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;border:1px solid var(--n3);background:var(--n0);color:var(--n7);font-size:12.5px;}
.search-btn:hover,.quick-add-btn:hover{background:var(--n2);}
.tree-nav{flex:1;display:flex;flex-direction:column;gap:2px;}
.tree-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--n8);font-size:13.5px;text-align:left;transition:background .15s;}
.tree-item:hover{background:var(--n2);}
.tree-item.active{background:var(--m50);color:var(--m700);font-weight:600;}
.tree-item.active svg{color:var(--m700);}
.tree-item svg{width:16px;height:16px;color:var(--n6);flex-shrink:0;}
.tree-group-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:transparent;color:var(--n7);font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-top:10px;}
.tree-group-toggle svg{width:13px;height:13px;}
.tree-item.child{font-size:13.5px;}
.sidebar-footer{border-top:1px solid var(--n3);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.footer-cta{display:flex;align-items:center;gap:8px;width:100%;padding:11px 11px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:12.5px;font-weight:700;}
.footer-cta:hover{background:var(--m700);}
.footer-link{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--n6);font-size:12.5px;}
.footer-link:hover{background:var(--n2);}
.footer-link svg,.footer-cta svg{width:14px;height:14px;}

/* ── main ── */
.main-wrap{margin-left:264px;flex:1;min-width:0;width:calc(100% - 264px);display:flex;flex-direction:column;min-height:100vh;}
.page-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;margin:20px 32px 0;border-radius:9999px;border:1px solid var(--n3);background:var(--n1);position:sticky;top:16px;z-index:10;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--n6);}
.breadcrumb b{color:var(--n9);font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--n7);}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:13.5px;font-weight:600;animation:ringPulse 2.4s infinite;}
.btn-primary:hover{background:var(--m700);}
.btn-primary svg{width:15px;height:15px;}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9999px;border:1px solid var(--n4);background:transparent;color:var(--n8);font-size:13px;font-weight:500;}
.btn-ghost:hover{background:var(--n2);}

.page-body{max-width:860px;margin:0 auto;padding:64px 32px 120px;width:100%;}
.page-header-block{margin-bottom:56px;animation:fadeInUp .5s ease both;}
.update-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 16px 6px 8px;border-radius:9999px;border:1px solid var(--m300);background:var(--n1);margin-bottom:22px;}
.update-pill .up-badge{background:var(--m600);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:9999px;letter-spacing:.03em;}
.update-pill span.up-text{font-size:12px;color:var(--n7);font-weight:500;}
.page-eyebrow{font-size:11.5px;color:var(--n6);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
.page-title{font-size:34px;font-weight:700;letter-spacing:-0.02em;color:var(--n9);margin:0 0 10px;}
.page-desc{font-size:14.5px;color:var(--n7);line-height:1.65;max-width:640px;}

.block{margin-bottom:20px;animation:fadeInUp .5s ease both;}
.block-callout{display:flex;gap:14px;padding:26px 30px;border-radius:28px;background:var(--m50);border:1px solid var(--m200);}
.block-callout svg{width:20px;height:20px;color:var(--m700);flex-shrink:0;margin-top:1px;}
.block-callout p{margin:0;font-size:13.5px;color:var(--n8);line-height:1.55;}
.block-heading{font-size:19px;font-weight:700;color:var(--n9);margin:48px 0 18px;letter-spacing:-0.01em;}
.block-divider hr{border:none;border-top:1px solid var(--n3);margin:26px 0;}
.block-toggle{border:1px solid var(--n3);border-radius:12px;overflow:hidden;}
.toggle-head{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;border:none;background:var(--n1);font-size:13.5px;font-weight:600;color:var(--n9);text-align:left;}
.toggle-head svg{width:14px;height:14px;color:var(--n6);transition:transform .2s;}
.toggle-body{padding:6px 16px 16px;background:var(--n1);}
.toggle-body ul{margin:0;padding-left:18px;font-size:13px;color:var(--n7);line-height:1.9;}
.block-table{border:1px solid var(--n3);border-radius:12px;overflow:hidden;}
.block-table table{width:100%;border-collapse:collapse;font-size:13px;}
.block-table th{text-align:left;padding:11px 16px;background:var(--n2);color:var(--n7);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.block-table td{padding:12px 16px;border-top:1px solid var(--n3);color:var(--n8);}
.block-table tr.row-click{cursor:pointer;transition:background .15s;}
.block-table tr.row-click:hover{background:var(--n0);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:600;background:var(--n2);color:var(--n7);}
.badge.new{background:var(--m600);color:#fff;}
.block-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.list-card{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--n3);border-radius:14px;background:var(--n1);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;}
.list-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,16,18,0.06);}
.list-card .lc-date{font-size:11px;color:var(--m700);font-weight:700;}
.list-card .lc-title{font-size:13.5px;font-weight:600;color:var(--n9);}
.list-card .lc-sub{font-size:12px;color:var(--n6);}

.hero-viz{width:100%;height:170px;margin-top:12px;margin-bottom:28px;}

/* ── 화면별 카드/그리드 ── */
.section-title-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.chip{padding:7px 14px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);color:var(--n7);font-size:12.5px;font-weight:500;}
.chip.active{background:var(--m600);border-color:var(--m600);color:#fff;}
.search-input-wrap{position:relative;flex:1;min-width:200px;max-width:280px;}
.search-input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--n6);}
.search-input{width:100%;padding:9px 12px 9px 34px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);font-size:12.5px;color:var(--n9);}
.search-input:focus{outline:2px solid var(--m300);}

.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.video-card{border:1px solid var(--n3);border-radius:16px;overflow:hidden;background:var(--n1);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;padding:0;}
.video-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,16,18,0.08);}
.video-thumb{width:100%;height:96px;background:linear-gradient(135deg,var(--m700),var(--m900));position:relative;display:flex;align-items:center;justify-content:center;}
.video-thumb svg{width:26px;height:26px;color:#fff;}
.video-thumb .dur{position:absolute;bottom:6px;right:8px;background:rgba(15,16,18,0.65);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;}
.video-info{padding:12px 14px 15px;}
.video-info .vi-cat{font-size:10.5px;color:var(--m700);font-weight:700;text-transform:uppercase;}
.video-info .vi-title{font-size:13px;font-weight:600;color:var(--n9);margin:4px 0 3px;line-height:1.4;}
.video-info .vi-date{font-size:11.5px;color:var(--n6);}
.load-more-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:12px;border:1px dashed var(--n4);background:transparent;color:var(--n7);font-size:13px;margin-top:16px;}
.load-more-btn:hover{background:var(--n2);}

.resource-group{margin-bottom:26px;}
.resource-group h3{font-size:14px;font-weight:700;color:var(--n8);margin:0 0 10px;}
.resource-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--n3);border-radius:12px;background:var(--n1);margin-bottom:8px;cursor:pointer;}
.resource-row:hover{background:var(--n0);}
.resource-icon{width:38px;height:38px;border-radius:10px;background:var(--n2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.resource-icon svg{width:18px;height:18px;color:var(--n7);}
.resource-meta{flex:1;min-width:0;}
.resource-meta .rm-title{font-size:13.5px;font-weight:600;color:var(--n9);}
.resource-meta .rm-sub{font-size:11.5px;color:var(--n6);margin-top:2px;}
.dl-toggle{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--n7);flex-shrink:0;}
.switch{position:relative;width:36px;height:20px;border-radius:9999px;background:var(--n4);border:none;flex-shrink:0;transition:background .2s;}
.switch.on{background:var(--m600);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;}
.switch.on::after{transform:translateX(16px);}

.notice-row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--n3);cursor:pointer;}
.notice-row:hover{background:var(--n0);}
.notice-row .nr-title{flex:1;font-size:13.5px;color:var(--n9);font-weight:500;}
.notice-row .nr-date{font-size:11.5px;color:var(--n6);}

.schedule-card{display:flex;gap:16px;padding:18px;border:1px solid var(--n3);border-radius:14px;background:var(--n1);margin-bottom:12px;}
.schedule-date{width:56px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--n2);padding:8px 0;}
.schedule-date .sd-day{font-size:19px;font-weight:800;color:var(--n9);}
.schedule-date .sd-mon{font-size:10.5px;color:var(--n6);font-weight:600;}
.schedule-info{flex:1;}
.schedule-info h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--n9);}
.schedule-info p{margin:0 0 10px;font-size:12.5px;color:var(--n7);}

.signup-wrap{max-width:460px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--n8);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--n4);font-size:13.5px;color:var(--n9);background:var(--n1);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:2px solid var(--m300);}
.method-toggle{display:flex;gap:8px;margin-bottom:16px;}
.method-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--n4);background:var(--n1);color:var(--n7);font-size:12.5px;font-weight:600;}
.method-btn.active{border-color:var(--m600);background:var(--m50);color:var(--m700);}
.signup-submit{width:100%;padding:13px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
.signup-submit:hover{background:var(--m700);}
.signup-submit:disabled{opacity:.6;}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spinLoad .7s linear infinite;}
.signup-result{margin-top:18px;padding:16px;border-radius:12px;display:flex;gap:10px;animation:fadeInUp .4s ease both;}
.signup-result.ok{background:var(--s1-bg);color:var(--s1-text);}
.signup-result.manual{background:var(--s3-bg);color:var(--s3-text);}
.signup-result svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}

/* ── modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,16,18,0.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s ease both;padding:20px;}
.modal-card{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--n1);border-radius:20px;padding:28px;animation:fadeInUp .22s ease both;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;font-weight:700;color:var(--n9);}
.modal-close{border:none;background:var(--n2);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close svg{width:15px;height:15px;color:var(--n7);}
.modal-body p{font-size:13.5px;color:var(--n7);line-height:1.7;}
.modal-video-frame{width:100%;height:200px;border-radius:14px;background:linear-gradient(135deg,var(--m700),var(--m900));display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.modal-video-frame svg{width:34px;height:34px;color:#fff;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}

/* ── toast ── */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n9);color:#fff;padding:12px 22px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;animation:toastSlide .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.toast svg{width:15px;height:15px;color:var(--m300);}

@media (max-width:900px){
  .video-grid{grid-template-columns:repeat(2,1fr);}
  .block-list{grid-template-columns:1fr;}
}
@media (max-width:768px){
  .tree-sidebar{display:none;}
  .main-wrap{margin-left:0;width:100%;}
  .page-topbar{margin:12px 12px 0;padding:10px 16px;}
  .video-grid{grid-template-columns:1fr;}
}
@media (max-width:480px){
  .breadcrumb{font-size:11.5px;}
  .page-body{padding:40px 18px 90px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

];

const NOTICES = [
  { id:1, title:'9월 정기 세미나 사전 등록 안내', pinned:true, date:'2026.09.01', body:'9월 정기 세미나 사전 등록이 시작되었습니다. 좌측 세미나 일정 메뉴에서 외부 등록 페이지로 이동하실 수 있습니다.' },
  { id:2, title:'자료실 열람 정책 업데이트 안내', pinned:false, date:'2026.08.22', body:'일부 자료의 다운로드 허용 범위가 조정되었습니다. 자료실에서 개별 파일의 열람/다운로드 여부를 확인해 주세요.' },
  { id:3, title:'회원 인증 절차 안내', pinned:false, date:'2026.08.10', body:'사업자등록번호 또는 면허번호 인증 후 회원가입이 완료됩니다. 자동 인증이 어려운 경우 관리자 심사로 자동 전환됩니다.' },
  { id:4, title:'8월 웨비나 다시보기 업로드 완료', pinned:false, date:'2026.08.01', body:'8월 진행된 웨비나 영상이 모두 업로드되었습니다. 영상 다시보기 아카이브에서 확인하실 수 있습니다.' },
];

const SCHEDULES = [
  { day:'18', mon:'9월', title:'가을 정기 세미나 — 신규 장비 라이브 데모', desc:'서울 강남 세미나룸 · 오후 2시' },
  { day:'27', mon:'9월', title:'온라인 웨비나 — 리프팅 시술 최신 트렌드', desc:'온라인 실시간 진행 · 오후 7시' },
  { day:'05', mon:'10월', title:'거래처 대상 신제품 설명회', desc:'부산 지역 세미나룸 · 오후 3시' },
];

function Icon({ name, ...rest }) {
  return <i data-lucide={name} {...rest}></i>;
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="toast"><Icon name="check-circle" /><span>{msg}</span></div>;
}

function App() {
  const [screen, setScreen] = useState('main');
  const [expanded, setExpanded] = useState({ library: true, comms: true });
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [dashToggle, setDashToggle] = useState(false);
  const [videoCategory, setVideoCategory] = useState('전체');
  const [videoQuery, setVideoQuery] = useState('');
  const [visibleCount, setVisibleCount] = useState(6);
  const [resources, setResources] = useState(RESOURCES);
  const [notices, setNotices] = useState(NOTICES);
  const [noticeModalOpen, setNoticeModalOpen] = useState(false);
  const [noticeDraft, setNoticeDraft] = useState({ title: '', body: '' });
  const [method, setMethod] = useState('biz');
  const [idNumber, setIdNumber] = useState('');
  const [signupStatus, setSignupStatus] = useState('idle');

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }

  function toggleDownload(group, id) {
    setResources(prev => {
      const next = { ...prev };
      next[group] = next[group].map(r => r.id === id ? { ...r, allowDownload: !r.allowDownload } : r);
      return next;
    });
    showToast('다운로드 허용 여부가 변경되어 회원 화면에 즉시 반영됩니다.');
  }

  function submitNotice(e) {
    e.preventDefault();
    if (!noticeDraft.title.trim()) return;
    setNotices(prev => [{ id: Date.now(), title: noticeDraft.title, pinned: false, date: '2026.09.04', body: noticeDraft.body || '내용이 등록되었습니다.' }, ...prev]);
    setNoticeDraft({ title: '', body: '' });
    setNoticeModalOpen(false);
    showToast('공지사항이 등록되었습니다.');
  }

  function submitSignup(e) {
    e.preventDefault();
    setSignupStatus('checking');
    setTimeout(() => {
      const ok = idNumber.replace(/[^0-9]/g, '').length >= 8;
      setSignupStatus(ok ? 'ok' : 'manual');
    }, 1400);
  }

  const filteredVideos = VIDEOS.filter(v =>
    (videoCategory === '전체' || v.category === videoCategory) &&
    (videoQuery.trim() === '' || v.title.includes(videoQuery))
  );

  const navItem = (id, label, icon, extraStyle) => (
    <button
      className={'tree-item' + (screen === id ? ' active' : '')}
      style={extraStyle}
      onClick={() => setScreen(id)}
    >
      <Icon name={icon} />
      <span>{label}</span>
    </button>
  );

  return (
    <div className="app-shell" data-archetype="notion-blocks-tree">
      <aside className="tree-sidebar" data-tree-sidebar>
        <div className="sidebar-brand">
          <div className="brand-mark">M</div>
          <div>
            <div className="brand-text">메디브릿지 포털</div>
            <div className="brand-sub">거래처 의료진 전용</div>
          </div>
        </div>
        <div className="sidebar-search">
          <button className="search-btn" onClick={() => showToast('검색어를 입력하면 전체 콘텐츠에서 찾아드립니다.')}>
            <Icon name="search" /> 통합 검색
          </button>
          <button className="quick-add-btn" onClick={() => showToast('관리자 권한으로 로그인하면 콘텐츠를 등록할 수 있습니다.')}>
            <Icon name="plus" />
          </button>
        </div>
        <nav className="tree-nav">
          {navItem('main', '홈', 'home')}

          <button className="tree-group-toggle" onClick={() => setExpanded(e => ({ ...e, library: !e.library }))}>
            <Icon name={expanded.library ? 'chevron-down' : 'chevron-right'} />
            콘텐츠 라이브러리
          </button>
          {expanded.library && <>
            {navItem('video-archive', '영상 다시보기 아카이브', 'play-circle', { paddingLeft: 28 })}
            {navItem('resources', '자료실', 'folder', { paddingLeft: 28 })}
          </>}

          <button className="tree-group-toggle" onClick={() => setExpanded(e => ({ ...e, comms: !e.comms }))}>
            <Icon name={expanded.comms ? 'chevron-down' : 'chevron-right'} />
            세미나·공지
          </button>
          {expanded.comms && <>
            {navItem('schedule', '세미나 일정', 'calendar', { paddingLeft: 28 })}
            {navItem('notices', '공지사항', 'megaphone', { paddingLeft: 28 })}
          </>}
        </nav>
        <div className="sidebar-footer">
          <button className="footer-cta" onClick={() => setScreen('signup')}>
            <Icon name="user-plus" /> 의료진 인증 회원가입
          </button>
          <button className="footer-link" onClick={() => showToast('마이페이지 기능은 데모 범위 밖입니다.')}>
            <Icon name="settings" /> 계정 설정
          </button>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="page-topbar">
          <div className="breadcrumb">
            <span>메디브릿지 포털</span><span>›</span>
            <b>
              {screen === 'main' && '홈'}
              {screen === 'video-archive' && '영상 다시보기 아카이브'}
              {screen === 'resources' && '자료실'}
              {screen === 'schedule' && '세미나 일정'}
              {screen === 'notices' && '공지사항'}
              {screen === 'signup' && '의료진 인증 회원가입'}
            </b>
          </div>
          <div className="topbar-actions">
            <button className="btn-ghost" onClick={() => showToast('알림 3건이 있습니다.')}><Icon name="bell" /></button>
            <div className="avatar-chip">김원</div>
          </div>
        </header>

        <main className="page-body">

          {screen === 'main' && (
            <div>
              <div className="page-header-block">
                <div className="update-pill">
                  <span className="up-badge">NEW</span>
                  <span className="up-text">9월 세미나 자료가 새로 등록되었습니다</span>
                </div>
                <div className="page-eyebrow">Dashboard</div>
                <h1 className="page-title">안녕하세요, 김민준 원장님</h1>
                <p className="page-desc">거래처 전용 웨비나·세미나 자료를 한 곳에서 열람하실 수 있습니다. 최근 등록된 콘텐츠와 다가오는 일정을 확인해 보세요.</p>
              </div>

              <svg className="hero-viz" viewBox="0 0 600 170" fill="none">
                <defs>
                  <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" style={{ stopColor: 'var(--m300)' }} />
                    <stop offset="100%" style={{ stopColor: 'var(--m700)' }} />
                  </linearGradient>
                </defs>
                <path d="M0 110 L80 90 L160 100 L240 60 L320 75 L400 40 L480 55 L560 20 L600 30" stroke="url(#lineGrad)" strokeWidth="3" strokeLinecap="round" fill="none" />
                <circle cx="80" cy="90" r="4" style={{ fill: 'var(--m600)' }} />
                <circle cx="240" cy="60" r="4" style={{ fill: 'var(--m600)' }} />
                <circle cx="400" cy="40" r="4" style={{ fill: 'var(--m600)' }} />
                <circle cx="560" cy="20" r="5" style={{ fill: 'var(--m700)' }} />
                <line x1="0" y1="130" x2="600" y2="130" style={{ stroke: 'var(--n3)' }} strokeWidth="1" />
                <rect x="0" y="128" width="600" height="1" style={{ fill: 'var(--n3)' }} />
              </svg>

              <div className="block block-callout" data-block-type="callout">
                <Icon name="sparkles" />
                <p>이번 달 신규 세미나 자료 3건과 웨비나 다시보기 2건이 새로 등록되었습니다.</p>
              </div>

              <h2 className="block-heading">최근 업데이트</h2>
              <div className="block block-table" data-block-type="table">
                <table>
                  <thead><tr><th>구분</th><th>제목</th><th>등록일</th></tr></thead>
                  <tbody>
                    <tr className="row-click" onClick={() => { setScreen('video-archive'); }}>
                      <td><span className="badge new">웨비나</span></td>
                      <td>프리미엄 리프팅 기기 임상 웨비나</td><td>2026.08.28</td>
                    </tr>
                    <tr className="row-click" onClick={() => { setScreen('resources'); }}>
                      <td><span className="badge">자료</span></td>
                      <td>2026년 하반기 카탈로그.pdf</td><td>2026.08.25</td>
                    </tr>
                    <tr className="row-click" onClick={() => { setScreen('notices'); }}>
                      <td><span className="badge">공지</span></td>
                      <td>9월 정기 세미나 사전 등록 안내</td><td>2026.09.01</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div className="block-divider block"><hr /></div>

              <div className="block block-toggle" data-block-type="toggle">
                <button className="toggle-head" onClick={() => setDashToggle(v => !v)}>
                  <Icon name={dashToggle ? 'chevron-down' : 'chevron-right'} />
                  이번 달 등록된 세미나 (3건)
                </button>
                {dashToggle && (
                  <div className="toggle-body">
                    <ul>
                      <li>가을 정기 세미나 — 신규 장비 라이브 데모 (9.18)</li>
                      <li>온라인 웨비나 — 리프팅 시술 최신 트렌드 (9.27)</li>
                      <li>거래처 대상 신제품 설명회 (10.5)</li>
                    </ul>
                  </div>
                )}
              </div>

              <h2 className="block-heading">다가오는 세미나 일정</h2>
              <div className="block block-list" data-block-type="list">
                {SCHEDULES.slice(0, 2).map((s, i) => (
                  <button className="list-card" key={i} onClick={() => setScreen('schedule')}>
                    <span className="lc-date">{s.mon} {s.day}일</span>
                    <span className="lc-title">{s.title}</span>
                    <span className="lc-sub">{s.desc}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {screen === 'video-archive' && (
            <div>
              <div className="section-title-row">
                <div>
                  <div className="page-eyebrow">Video Archive</div>
                  <h1 className="page-title">영상 다시보기 아카이브</h1>
                </div>
              </div>
              <div className="filter-row">
                {['전체', '웨비나', '사내강의', '세미나'].map(c => (
                  <button key={c} className={'chip' + (videoCategory === c ? ' active' : '')} onClick={() => { setVideoCategory(c); setVisibleCount(6); }}>{c}</button>
                ))}
                <div className="search-input-wrap">
                  <Icon name="search" />
                  <input className="search-input" placeholder="영상 제목 검색" value={videoQuery} onChange={e => setVideoQuery(e.target.value)} />
                </div>
              </div>
              <div className="video-grid">
                {filteredVideos.slice(0, visibleCount).map(v => (
                  <button className="video-card" key={v.id} onClick={() => setModal({ type: 'video', data: v })}>
                    <div className="video-thumb"><Icon name="play" /><span className="dur">{v.duration}</span></div>
                    <div className="video-info">
                      <div className="vi-cat">{v.category}</div>
                      <div className="vi-title">{v.title}</div>
                      <div className="vi-date">{v.date}</div>
                    </div>
                  </button>
                ))}
              </div>
              {visibleCount < filteredVideos.length && (
                <button className="load-more-btn" onClick={() => setVisibleCount(c => c + 3)}>
                  <Icon name="chevron-down" /> 더 불러오기 ({filteredVideos.length - visibleCount}건 더 있음)
                </button>
              )}
              {filteredVideos.length === 0 && <p style={{ color: 'var(--n6)', fontSize: 13 }}>검색 결과가 없습니다.</p>}
            </div>
          )}

          {screen === 'resources' && (
            <div>
              <div className="page-eyebrow">Resources</div>
              <h1 className="page-title">자료실</h1>
              <p className="page-desc" style={{ marginBottom: 26 }}>제품 리플렛과 시술 전후 자료는 회원 인증을 거친 의료진만 열람할 수 있습니다. 다운로드 허용 여부는 관리자가 파일 단위로 설정합니다.</p>
              {Object.keys(resources).map(group => (
                <div className="resource-group" key={group}>
                  <h3>{group}</h3>
                  {resources[group].map(r => (
                    <div className="resource-row" key={r.id} onClick={() => setModal({ type: 'resource', data: r })}>
                      <div className="resource-icon"><Icon name="file-text" /></div>
                      <div className="resource-meta">
                        <div className="rm-title">{r.name}</div>
                        <div className="rm-sub">{r.size} · {r.allowDownload ? '다운로드 가능' : '열람 전용'}</div>
                      </div>
                      <div className="dl-toggle" onClick={e => e.stopPropagation()}>
                        다운로드
                        <button className={'switch' + (r.allowDownload ? ' on' : '')} onClick={() => toggleDownload(group, r.id)}></button>
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}

          {screen === 'schedule' && (
            <div>
              <div className="page-eyebrow">Schedule</div>
              <h1 className="page-title">세미나 일정</h1>
              <p className="page-desc" style={{ marginBottom: 22 }}>현장 촬영과 사전 등록은 외부 채널에서 진행됩니다. 아래 일정에서 등록 페이지로 안내받으실 수 있습니다.</p>
              {SCHEDULES.map((s, i) => (
                <div className="schedule-card" key={i}>
                  <div className="schedule-date"><div className="sd-day">{s.day}</div><div className="sd-mon">{s.mon}</div></div>
                  <div className="schedule-info">
                    <h4>{s.title}</h4>
                    <p>{s.desc}</p>
                    <button className="btn-ghost" onClick={() => showToast('외부 사전 등록 페이지로 안내됩니다.')}>
                      <Icon name="external-link" /> 사전 등록 페이지로 이동
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {screen === 'notices' && (
            <div>
              <div className="section-title-row">
                <div>
                  <div className="page-eyebrow">Notice</div>
                  <h1 className="page-title">공지사항</h1>
                </div>
                <button className="btn-primary" onClick={() => setNoticeModalOpen(true)}><Icon name="plus" /> 새 공지 작성</button>
              </div>
              <div style={{ border: '1px solid var(--n3)', borderRadius: 14, overflow: 'hidden', background: 'var(--n1)' }}>
                {notices.map(n => (
                  <div className="notice-row" key={n.id} onClick={() => setModal({ type: 'notice', data: n })}>
                    {n.pinned && <Icon name="pin" style={{ width: 14, height: 14, color: 'var(--m700)' }} />}
                    <span className="nr-title">{n.title}</span>
                    <span className="nr-date">{n.date}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {screen === 'signup' && (
            <div className="signup-wrap">
              <div className="page-eyebrow">Verification</div>
              <h1 className="page-title">의료진 인증 회원가입</h1>
              <p className="page-desc" style={{ marginBottom: 24 }}>사업자등록번호 또는 면허번호 중 하나로 의료진 여부를 인증합니다. 자동 인증이 어려운 경우 관리자 심사 큐로 자동 전환됩니다.</p>
              <form onSubmit={submitSignup}>
                <div className="form-group">
                  <label>병원명</label>
                  <input type="text" placeholder="예: 서울리프트피부과" required />
                </div>
                <label style={{ display: 'block', fontSize: 12.5, fontWeight: 600, color: 'var(--n8)', marginBottom: 8 }}>인증 방식</label>
                <div className="method-toggle">
                  <button type="button" className={'method-btn' + (method === 'biz' ? ' active' : '')} onClick={() => setMethod('biz')}>사업자등록번호</button>
                  <button type="button" className={'method-btn' + (method === 'lic' ? ' active' : '')} onClick={() => setMethod('lic')}>면허번호</button>
                </div>
                <div className="form-group">
                  <label>{method === 'biz' ? '사업자등록번호' : '의사 면허번호'}</label>
                  <input type="text" placeholder={method === 'biz' ? '000-00-00000' : '제 00000호'} value={idNumber} onChange={e => setIdNumber(e.target.value)} required />
                </div>
                <button type="submit" className="signup-submit" disabled={signupStatus === 'checking'}>
                  {signupStatus === 'checking' ? <><span className="spin"></span> 인증 확인 중...</> : <>인증 신청하기</>}
                </button>
              </form>
              {signupStatus === 'ok' && (
                <div className="signup-result ok">
                  <Icon name="check-circle" />
                  <div>인증이 완료되었습니다. <button className="btn-ghost" style={{ marginLeft: 8 }} onClick={() => setScreen('main')}>포털 둘러보기</button></div>
                </div>
              )}
              {signupStatus === 'manual' && (
                <div className="signup-result manual">
                  <Icon name="alert-triangle" />
                  <div>자동 인증에 실패해 관리자 심사 큐로 전환되었습니다. 확인 후 안내드리겠습니다.</div>
                </div>
              )}
            </div>
          )}

        </main>
      </div>

      {modal && modal.type === 'video' && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>{modal.data.title}</h3>
              <button className="modal-close" onClick={() => setModal(null)}><Icon name="x" /></button>
            </div>
            <div className="modal-video-frame"><Icon name="play" /></div>
            <div className="modal-body">
              <p><b>카테고리</b> · {modal.data.category}<br /><b>등록일</b> · {modal.data.date} · <b>재생시간</b> {modal.data.duration}</p>
              <p>회원 인증을 거친 의료진만 열람 가능한 영상입니다. 외부 스트리밍 서비스 연동을 통해 다운로드 제한과 시청 기간 제한을 함께 적용할 수 있습니다.</p>
            </div>
          </div>
        </div>
      )}

      {modal && modal.type === 'resource' && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>{modal.data.name}</h3>
              <button className="modal-close" onClick={() => setModal(null)}><Icon name="x" /></button>
            </div>
            <div className="modal-body">
              <p><b>파일 크기</b> · {modal.data.size}<br /><b>다운로드</b> · {modal.data.allowDownload ? '허용됨' : '열람 전용 (다운로드 비활성화)'}</p>
              <p>인앱 뷰어로 문서를 확인하실 수 있습니다. 다운로드가 허용되지 않은 자료는 열람만 가능합니다.</p>
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={() => setModal(null)}>닫기</button>
              <button className="btn-primary" disabled={!modal.data.allowDownload} style={{ opacity: modal.data.allowDownload ? 1 : 0.4, animation: 'none' }} onClick={() => showToast('다운로드가 시작되었습니다.')}>
                <Icon name="download" /> 다운로드
              </button>
            </div>
          </div>
        </div>
      )}

      {modal && modal.type === 'notice' && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>{modal.data.title}</h3>
              <button className="modal-close" onClick={() => setModal(null)}><Icon name="x" /></button>
            </div>
            <div className="modal-body">
              <p style={{ color: 'var(--n6)', fontSize: 12 }}>{modal.data.date}</p>
              <p>{modal.data.body}</p>
            </div>
          </div>
        </div>
      )}

      {noticeModalOpen && (
        <div className="modal-overlay" onClick={() => setNoticeModalOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>새 공지 작성</h3>
              <button className="modal-close" onClick={() => setNoticeModalOpen(false)}><Icon name="x" /></button>
            </div>
            <form onSubmit={submitNotice}>
              <div className="form-group">
                <label>제목</label>
                <input type="text" value={noticeDraft.title} onChange={e => setNoticeDraft(d => ({ ...d, title: e.target.value }))} required />
              </div>
              <div className="form-group">
                <label>내용</label>
                <textarea rows="4" value={noticeDraft.body} onChange={e => setNoticeDraft(d => ({ ...d, body: e.target.value }))}></textarea>
              </div>
              <div className="modal-actions">
                <button type="button" className="btn-ghost" onClick={() => setNoticeModalOpen(false)}>취소</button>
                <button type="submit" className="btn-primary" style={{ animation: 'none' }}>등록</button>
              </div>
            </form>
          </div>
        </div>
      )}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
