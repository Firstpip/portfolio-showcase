<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메디브릿지 관리자 콘솔 — 콘텐츠 통합 허브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 18°, light) ── */
:root{
  --m50:#fbf3f0; --m100:#f6e8e2; --m200:#eed1c4; --m300:#e3b4a1; --m400:#d79579;
  --m500:#cc7754; --m600:#c1592e; --m700:#9e4926; --m800:#7c391d; --m900:#572815;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab6b5; --n6:#989290; --n7:#797776; --n8:#5a5553; --n9:#3a3736; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
#root{width:100%;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes countUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastPop{from{opacity:0;transform:translateY(20px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes glowPulse{0%,100%{opacity:.55;}50%{opacity:1;}}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}
[data-archetype="bento-grid"]{width:100%;}

/* ── topnav ── */
.topnav{width:100%;background:var(--n9);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:66px;position:sticky;top:0;z-index:30;}
.topnav-left{display:flex;align-items:center;gap:28px;}
.topnav-brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.brand-text{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:-0.01em;}
.topnav-tabs{display:flex;gap:4px;}
.tab-btn{padding:10px 16px;border-radius:9999px;border:none;background:transparent;color:var(--n5);font-size:13.5px;font-weight:600;}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,0.08);}
.tab-btn.active{background:var(--m600);color:#fff;}
.topnav-right{display:flex;align-items:center;gap:12px;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}
.icon-btn:hover{background:rgba(255,255,255,0.16);}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:var(--m200);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--m800);}

.page-shell{max-width:1320px;margin:0 auto;width:100%;padding:32px;flex:1;}

/* ── bento grid ── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.tile{background:var(--n1);border-radius:22px;padding:26px;box-shadow:0 10px 26px rgba(36,34,32,0.08);animation:riseIn .45s ease both;}
.tile-feature{grid-column:span 2;grid-row:span 2;background:var(--n2);display:flex;flex-direction:column;}
.tile-wide{grid-column:span 2;}
.tile h3{margin:0 0 4px;font-size:13px;color:var(--n7);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.tile .big-num{font-size:40px;font-weight:800;color:var(--n9);letter-spacing:-0.02em;animation:countUp .5s ease both;}
.tile .delta{font-size:12.5px;font-weight:700;color:var(--s1-text);display:inline-flex;align-items:center;gap:3px;margin-top:4px;}
.tile .sub{font-size:12px;color:var(--n7);margin-top:6px;}
.feature-chart-wrap{flex:1;position:relative;margin-top:14px;min-height:120px;}
.quick-tile{grid-column:span 4;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.quick-action{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border-radius:16px;border:1px solid var(--n4);background:var(--n0);text-align:left;}
.quick-action:hover{border-color:var(--m400);background:var(--m50);}
.quick-action i{font-size:22px;color:var(--m700);}
.quick-action .qa-title{font-size:13.5px;font-weight:700;color:var(--n9);}
.quick-action .qa-sub{font-size:11.5px;color:var(--n7);}

.activity-list{display:flex;flex-direction:column;gap:2px;}
.activity-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--n3);}
.activity-row:last-child{border-bottom:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--n5);flex-shrink:0;}
.activity-dot.pending{background:var(--s3);}
.activity-row .ar-text{flex:1;font-size:13px;color:var(--n8);}
.activity-row .ar-time{font-size:11.5px;color:var(--n6);}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.section-eyebrow{font-size:12px;color:var(--m700);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.section-title{font-size:40px;font-weight:700;letter-spacing:-0.02em;color:var(--n9);margin:0;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 8px 20px rgba(193,89,46,0.28);}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{opacity:.4;box-shadow:none;}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:9999px;border:1.5px solid var(--n5);background:transparent;color:var(--n8);font-size:13px;font-weight:600;}
.btn-ghost:hover{background:var(--n2);}

.filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-chip{padding:8px 16px;border-radius:9999px;border:1.5px solid var(--n4);background:var(--n1);color:var(--n7);font-size:12.5px;font-weight:600;}
.filter-chip.active{background:var(--n9);border-color:var(--n9);color:#fff;}

.data-card{background:var(--n1);border-radius:22px;padding:6px;box-shadow:0 10px 26px rgba(36,34,32,0.06);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;padding:14px 18px;font-size:11.5px;color:var(--n7);font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--n3);}
.data-table td{padding:14px 18px;font-size:13.5px;color:var(--n8);border-bottom:1px solid var(--n3);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr.clickable{cursor:pointer;}
.data-table tr.clickable:hover{background:var(--n2);}
.status-pill{padding:4px 11px;border-radius:9999px;font-size:11.5px;font-weight:700;background:var(--n2);color:var(--n7);}
.status-pill.pending{background:var(--s3-bg);color:var(--s3-text);}
.status-pill.approved{background:var(--s1-bg);color:var(--s1-text);}
.row-check{width:16px;height:16px;}

.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.content-item{background:var(--n1);border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(36,34,32,0.06);}
.content-item .ci-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.content-item .ci-type{font-size:11px;font-weight:700;color:var(--m700);text-transform:uppercase;}
.content-item .ci-title{font-size:14px;font-weight:700;color:var(--n9);margin:6px 0 4px;}
.content-item .ci-meta{font-size:11.5px;color:var(--n7);}
.content-item .ci-actions{display:flex;gap:8px;margin-top:14px;}
.icon-action{width:30px;height:30px;border-radius:9px;border:1px solid var(--n4);background:var(--n0);display:flex;align-items:center;justify-content:center;color:var(--n7);}
.icon-action:hover{background:var(--n2);}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.kpi-card{background:var(--n1);border-radius:18px;padding:18px 20px;box-shadow:0 6px 16px rgba(36,34,32,0.06);}
.kpi-card .kc-label{font-size:11.5px;color:var(--n7);font-weight:600;}
.kpi-card .kc-num{font-size:24px;font-weight:800;color:var(--n9);margin-top:4px;}
.chart-card{background:var(--n1);border-radius:22px;padding:24px;box-shadow:0 10px 26px rgba(36,34,32,0.06);}
.chart-canvas-wrap{position:relative;height:260px;width:100%;}

.schedule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.schedule-item{background:var(--n1);border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(36,34,32,0.06);display:flex;gap:16px;}
.sch-date-badge{width:54px;height:54px;border-radius:14px;background:var(--m600);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.sch-date-badge .sd-d{font-size:18px;font-weight:800;}
.sch-date-badge .sd-m{font-size:9.5px;font-weight:600;}
.sch-info{flex:1;}
.sch-info h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--n9);}
.sch-info p{margin:0 0 10px;font-size:12px;color:var(--n7);}
.sch-actions{display:flex;gap:8px;}

.upload-drop{border:2px dashed var(--n5);border-radius:16px;padding:32px;text-align:center;color:var(--n7);margin-bottom:16px;}
.upload-drop i{font-size:30px;color:var(--m600);}
.progress-bar-wrap{width:100%;height:8px;border-radius:9999px;background:var(--n3);overflow:hidden;margin-top:12px;}
.progress-bar-fill{height:100%;background:var(--m600);border-radius:9999px;transition:width .3s;}

.hero-diagram{width:100%;height:110px;}

/* ── modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(36,34,32,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .18s ease both;}
.modal-card{width:100%;max-width:540px;max-height:84vh;overflow-y:auto;background:var(--n0);border-radius:24px;padding:30px;animation:riseIn .25s ease both;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.modal-head h3{margin:0;font-size:19px;font-weight:700;color:var(--n9);}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--n2);display:flex;align-items:center;justify-content:center;}
.modal-body p{font-size:13.5px;color:var(--n7);line-height:1.7;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--n8);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--n4);font-size:13.5px;background:var(--n1);color:var(--n9);}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n9);color:#fff;padding:13px 24px;border-radius:9999px;font-size:13px;display:flex;align-items:center;gap:9px;z-index:200;animation:toastPop .28s ease both;}
.toast i{color:var(--m300);font-size:17px;}

@media (max-width:1100px){
  .bento{grid-template-columns:repeat(2,1fr);}
  .tile-feature{grid-column:span 2;}
  .quick-tile{grid-template-columns:repeat(2,1fr);}
  .content-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .schedule-grid{grid-template-columns:1fr;}
}
@media (max-width:768px){
  .topnav{padding:0 14px;}
  .topnav-tabs{gap:2px;overflow-x:auto;max-width:100%;}
  .tab-btn{padding:9px 11px;font-size:12.5px;white-space:nowrap;}
  .brand-text{display:none;}
  .page-shell{padding:20px 16px;}
  .bento{grid-template-columns:1fr;}
  .quick-tile{grid-template-columns:1fr;}
  .content-grid{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:480px){
  .topnav-left{gap:10px;min-width:0;overflow:hidden;}
  .kpi-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const MEMBERS = [
  { id: 1, name: '김민준', hospital: '서울리프트피부과', method: '사업자등록번호', status: 'pending', date: '2026.09.03' },
  { id: 2, name: '이서연', hospital: '강남클리어스킨의원', method: '면허번호', status: 'approved', date: '2026.09.01' },
  { id: 3, name: '박도윤', hospital: '분당더마클리닉', method: '사업자등록번호', status: 'approved', date: '2026.08.28' },
  { id: 4, name: '최지우', hospital: '부산스킨아트의원', method: '면허번호', status: 'pending', date: '2026.08.26' },
  { id: 5, name: '정하은', hospital: '대전휴먼피부과', method: '사업자등록번호', status: 'suspended', date: '2026.08.20' },
];

const CONTENTS = [
  { id: 1, type: '영상', title: '프리미엄 리프팅 기기 임상 웨비나', date: '2026.08.28' },
  { id: 2, type: '자료', title: '2026 하반기 카탈로그.pdf', date: '2026.08.25' },
  { id: 3, type: '공지', title: '9월 정기 세미나 사전 등록 안내', date: '2026.09.01' },
  { id: 4, type: '세미나', title: '가을 정기 세미나 — 신규 장비 데모', date: '2026.09.18' },
  { id: 5, type: '영상', title: '초음파 리프팅 파라미터 가이드', date: '2026.08.05' },
  { id: 6, type: '자료', title: '케이스 A — 시술 전후 비교.pdf', date: '2026.07.30' },
];

const SCHEDULES = [
  { d: '18', m: '9월', title: '가을 정기 세미나 — 신규 장비 라이브 데모', desc: '서울 강남 세미나룸 · 오후 2시' },
  { d: '27', m: '9월', title: '온라인 웨비나 — 리프팅 시술 최신 트렌드', desc: '온라인 실시간 진행 · 오후 7시' },
  { d: '05', m: '10월', title: '거래처 대상 신제품 설명회', desc: '부산 지역 세미나룸 · 오후 3시' },
  { d: '14', m: '10월', title: '11월 정기 세미나 사전 협의 미팅', desc: '내부 미팅 · 오전 10시' },
];

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="toast"><i className="ph ph-check-circle"></i><span>{msg}</span></div>;
}

function MiniLineChart() {
  const ref = useRef(null);
  useEffect(() => {
    const ctx = ref.current.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const m600 = css.getPropertyValue('--m600').trim();
    const m200 = css.getPropertyValue('--m200').trim();
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['5주전', '4주전', '3주전', '2주전', '지난주', '이번주'],
        datasets: [{
          data: [420, 512, 488, 610, 705, 812],
          borderColor: m600,
          backgroundColor: m200,
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: m600,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { grid: { color: '#00000010' } }, x: { grid: { display: false } } },
      },
    });
    return () => chart.destroy();
  }, []);
  return <div className="feature-chart-wrap"><canvas ref={ref}></canvas></div>;
}

function AnalyticsChart({ range }) {
  const ref = useRef(null);
  useEffect(() => {
    const ctx = ref.current.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const m600 = css.getPropertyValue('--m600').trim();
    const n5 = css.getPropertyValue('--n5').trim();
    const labels = range === '7d' ? ['월', '화', '수', '목', '금', '토', '일'] : ['1주', '2주', '3주', '4주'];
    const views = range === '7d' ? [120, 190, 160, 220, 280, 140, 95] : [980, 1120, 1340, 1560];
    const downloads = range === '7d' ? [40, 55, 48, 62, 70, 30, 20] : [320, 380, 410, 460];
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: '조회수', data: views, backgroundColor: m600, borderRadius: 6 },
          { label: '다운로드', data: downloads, backgroundColor: n5, borderRadius: 6 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#3a3736', font: { family: 'Pretendard' } } } },
        scales: { y: { grid: { color: '#00000010' } }, x: { grid: { display: false } } },
      },
    });
    return () => chart.destroy();
  }, [range]);
  return <div className="chart-canvas-wrap"><canvas ref={ref}></canvas></div>;
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [members, setMembers] = useState(MEMBERS);
  const [selected, setSelected] = useState([]);
  const [memberFilter, setMemberFilter] = useState('전체');
  const [contentFilter, setContentFilter] = useState('전체');
  const [range, setRange] = useState('7d');
  const [uploadOpen, setUploadOpen] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [uploadFile, setUploadFile] = useState(null);
  const [scheduleModalOpen, setScheduleModalOpen] = useState(false);
  const [scheduleDraft, setScheduleDraft] = useState({ title: '', desc: '' });

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }

  function toggleSelect(id) {
    setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function bulkApprove() {
    setMembers(prev => prev.map(m => selected.includes(m.id) ? { ...m, status: 'approved' } : m));
    showToast(`${selected.length}건이 일괄 승인 처리되었습니다.`);
    setSelected([]);
  }

  function setMemberStatus(id, status) {
    setMembers(prev => prev.map(m => m.id === id ? { ...m, status } : m));
    setModal(null);
    showToast('회원 상태가 변경되고 감사 이력에 기록되었습니다.');
  }

  function simulateUpload() {
    setUploadFile('세미나_자료_2026_09.pdf');
    setUploadProgress(0);
    const timer = setInterval(() => {
      setUploadProgress(p => {
        if (p >= 100) { clearInterval(timer); return 100; }
        return p + 20;
      });
    }, 220);
  }

  function submitSchedule(e) {
    e.preventDefault();
    setScheduleModalOpen(false);
    setScheduleDraft({ title: '', desc: '' });
    showToast('세미나 일정이 등록되었습니다.');
  }

  const filteredMembers = members.filter(m => memberFilter === '전체' ||
    (memberFilter === '대기' && m.status === 'pending') ||
    (memberFilter === '승인' && m.status === 'approved') ||
    (memberFilter === '정지' && m.status === 'suspended'));

  const filteredContents = CONTENTS.filter(c => contentFilter === '전체' || c.type === contentFilter);

  const statusLabel = { pending: '대기', approved: '승인', suspended: '정지' };

  return (
    <div className="app-shell" data-archetype="bento-grid">
      <nav className="topnav">
        <div className="topnav-left">
          <div className="topnav-brand">
            <div className="brand-mark">M</div>
            <span className="brand-text">메디브릿지 관리자 콘솔</span>
          </div>
          <div className="topnav-tabs">
            <button className={'tab-btn' + (screen === 'main' ? ' active' : '')} onClick={() => setScreen('main')}>홈</button>
            <button className={'tab-btn' + (screen === 'member-management' ? ' active' : '')} onClick={() => setScreen('member-management')}>회원 관리</button>
            <button className={'tab-btn' + (screen === 'content-management' ? ' active' : '')} onClick={() => setScreen('content-management')}>콘텐츠 관리</button>
            <button className={'tab-btn' + (screen === 'analytics' ? ' active' : '')} onClick={() => setScreen('analytics')}>콘텐츠 통계</button>
            <button className={'tab-btn' + (screen === 'schedule' ? ' active' : '')} onClick={() => setScreen('schedule')}>세미나 일정 관리</button>
          </div>
        </div>
        <div className="topnav-right">
          <button className="icon-btn" onClick={() => showToast('신규 알림 4건이 있습니다.')}><i className="ph ph-bell"></i></button>
          <div className="avatar-chip">관리</div>
        </div>
      </nav>

      <div className="page-shell">

        {screen === 'main' && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-eyebrow">Overview</div>
                <h1 className="section-title">관리자 홈</h1>
              </div>
            </div>

            <svg className="hero-diagram" viewBox="0 0 700 110" fill="none">
              <defs>
                <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" style={{ stopColor: 'var(--m400)', stopOpacity: 0.5 }} />
                  <stop offset="100%" style={{ stopColor: 'var(--m400)', stopOpacity: 0 }} />
                </radialGradient>
              </defs>
              <circle cx="350" cy="55" r="70" fill="url(#glow)" style={{ animation: 'glowPulse 3.4s ease-in-out infinite' }} />
              <circle cx="60" cy="55" r="5" style={{ fill: 'var(--n6)' }} />
              <circle cx="200" cy="30" r="5" style={{ fill: 'var(--n6)' }} />
              <circle cx="200" cy="80" r="5" style={{ fill: 'var(--n6)' }} />
              <circle cx="350" cy="55" r="7" style={{ fill: 'var(--m600)' }} />
              <circle cx="500" cy="30" r="5" style={{ fill: 'var(--n6)' }} />
              <circle cx="500" cy="80" r="5" style={{ fill: 'var(--n6)' }} />
              <circle cx="640" cy="55" r="5" style={{ fill: 'var(--n6)' }} />
              <path d="M60 55 C120 55 150 30 200 30" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M60 55 C120 55 150 80 200 80" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M200 30 C270 30 290 55 350 55" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M200 80 C270 80 290 55 350 55" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M350 55 C410 55 430 30 500 30" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M350 55 C410 55 430 80 500 80" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M500 30 C560 30 580 55 640 55" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
              <path d="M500 80 C560 80 580 55 640 55" style={{ stroke: 'var(--n4)' }} strokeWidth="1.5" fill="none" />
            </svg>

            <div className="bento" style={{ marginTop: 18 }}>
              <div className="tile tile-feature" style={{ boxShadow: '0 10px 26px rgba(36,34,32,0.08)', borderRadius: 22 }}>
                <h3>이번 달 콘텐츠 조회 추이</h3>
                <div className="big-num">8,120회</div>
                <span className="delta"><i className="ph ph-trend-up"></i> 전월 대비 15%</span>
                <MiniLineChart />
              </div>

              <div className="tile">
                <h3>등록 회원 수</h3>
                <div className="big-num">248</div>
                <div className="sub">거래처 의료진 계정</div>
              </div>
              <div className="tile">
                <h3>승인 대기</h3>
                <div className="big-num">{members.filter(m => m.status === 'pending').length}</div>
                <div className="sub">신규 인증 신청</div>
              </div>
              <div className="tile tile-wide activity-tile">
                <h3>최근 활동</h3>
                <div className="activity-list">
                  <div className="activity-row"><span className="activity-dot pending"></span><span className="ar-text">김민준 원장 — 사업자등록번호 인증 신청</span><span className="ar-time">10분 전</span></div>
                  <div className="activity-row"><span className="activity-dot"></span><span className="ar-text">9월 웨비나 영상 업로드 완료</span><span className="ar-time">2시간 전</span></div>
                  <div className="activity-row"><span className="activity-dot"></span><span className="ar-text">이서연 원장 — 자료실 열람</span><span className="ar-time">5시간 전</span></div>
                </div>
              </div>

              <div className="tile">
                <h3>등록 콘텐츠 수</h3>
                <div className="big-num">{CONTENTS.length}</div>
                <div className="sub">영상·자료·공지·세미나</div>
              </div>

              <div className="tile quick-tile">
                <button className="quick-action" onClick={() => { setScreen('member-management'); }}>
                  <i className="ph ph-user-check"></i>
                  <span className="qa-title">회원 승인 처리</span>
                  <span className="qa-sub">대기 중인 인증 확인</span>
                </button>
                <button className="quick-action" onClick={() => { setScreen('content-management'); setUploadOpen(false); }}>
                  <i className="ph ph-upload-simple"></i>
                  <span className="qa-title">콘텐츠 업로드</span>
                  <span className="qa-sub">영상·자료·공지 등록</span>
                </button>
                <button className="quick-action" onClick={() => setScreen('analytics')}>
                  <i className="ph ph-chart-line-up"></i>
                  <span className="qa-title">통계 보기</span>
                  <span className="qa-sub">조회·다운로드 추이</span>
                </button>
                <button className="quick-action" onClick={() => setScreen('schedule')}>
                  <i className="ph ph-calendar-plus"></i>
                  <span className="qa-title">세미나 일정 관리</span>
                  <span className="qa-sub">신규 일정 등록</span>
                </button>
              </div>
            </div>
          </div>
        )}

        {screen === 'member-management' && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-eyebrow">Members</div>
                <h1 className="section-title">회원 관리</h1>
              </div>
              <button className="btn-primary" disabled={selected.length === 0} onClick={bulkApprove}>
                <i className="ph ph-check-square"></i> 선택 항목 일괄 승인 ({selected.length})
              </button>
            </div>
            <div className="filter-tabs">
              {['전체', '대기', '승인', '정지'].map(f => (
                <button key={f} className={'filter-chip' + (memberFilter === f ? ' active' : '')} onClick={() => setMemberFilter(f)}>{f}</button>
              ))}
            </div>
            <div className="data-card">
              <table className="data-table">
                <thead><tr><th></th><th>이름</th><th>병원</th><th>인증 방식</th><th>상태</th><th>등록일</th></tr></thead>
                <tbody>
                  {filteredMembers.map(m => (
                    <tr key={m.id} className="clickable" onClick={() => setModal({ type: 'member', data: m })}>
                      <td onClick={e => e.stopPropagation()}>
                        <input type="checkbox" className="row-check" checked={selected.includes(m.id)} onChange={() => toggleSelect(m.id)} />
                      </td>
                      <td>{m.name}</td>
                      <td>{m.hospital}</td>
                      <td>{m.method}</td>
                      <td><span className={'status-pill ' + m.status}>{statusLabel[m.status]}</span></td>
                      <td>{m.date}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {screen === 'content-management' && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-eyebrow">Content</div>
                <h1 className="section-title">콘텐츠 관리</h1>
              </div>
              <button className="btn-primary" onClick={() => { setUploadOpen(true); setUploadFile(null); setUploadProgress(0); }}>
                <i className="ph ph-plus"></i> 콘텐츠 등록
              </button>
            </div>
            <div className="filter-tabs">
              {['전체', '영상', '자료', '공지', '세미나'].map(f => (
                <button key={f} className={'filter-chip' + (contentFilter === f ? ' active' : '')} onClick={() => setContentFilter(f)}>{f}</button>
              ))}
            </div>
            <div className="content-grid">
              {filteredContents.map(c => (
                <div className="content-item" key={c.id}>
                  <div className="ci-top">
                    <span className="ci-type">{c.type}</span>
                    <i className="ph ph-dots-three-vertical" style={{ color: 'var(--n6)' }}></i>
                  </div>
                  <div className="ci-title">{c.title}</div>
                  <div className="ci-meta">{c.date}</div>
                  <div className="ci-actions">
                    <button className="icon-action" onClick={() => showToast('수정 화면으로 이동합니다.')}><i className="ph ph-pencil-simple"></i></button>
                    <button className="icon-action" onClick={() => showToast(c.title + ' 항목이 삭제되었습니다.')}><i className="ph ph-trash"></i></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {screen === 'analytics' && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-eyebrow">Analytics</div>
                <h1 className="section-title">콘텐츠 통계</h1>
              </div>
              <div className="filter-tabs" style={{ marginBottom: 0 }}>
                <button className={'filter-chip' + (range === '7d' ? ' active' : '')} onClick={() => setRange('7d')}>최근 7일</button>
                <button className={'filter-chip' + (range === '4w' ? ' active' : '')} onClick={() => setRange('4w')}>최근 4주</button>
              </div>
            </div>
            <div className="kpi-row">
              <div className="kpi-card"><div className="kc-label">웨비나·자료 조회수</div><div className="kc-num">8,120</div></div>
              <div className="kpi-card"><div className="kc-label">자료실 다운로드 수</div><div className="kc-num">1,204</div></div>
              <div className="kpi-card"><div className="kc-label">활성 의료진 회원</div><div className="kc-num">193</div></div>
              <div className="kpi-card"><div className="kc-label">세미나 다시보기 평균 시청 시간</div><div className="kc-num">6분 40초</div></div>
            </div>
            <div className="chart-card">
              <h3 style={{ marginTop: 0 }}>웨비나·자료실 조회 및 다운로드 추이</h3>
              <AnalyticsChart range={range} />
            </div>
          </div>
        )}

        {screen === 'schedule' && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-eyebrow">Schedule</div>
                <h1 className="section-title">세미나 일정 관리</h1>
              </div>
              <button className="btn-primary" onClick={() => setScheduleModalOpen(true)}><i className="ph ph-calendar-plus"></i> 일정 등록</button>
            </div>
            <div className="schedule-grid">
              {SCHEDULES.map((s, i) => (
                <div className="schedule-item" key={i}>
                  <div className="sch-date-badge"><span className="sd-d">{s.d}</span><span className="sd-m">{s.m}</span></div>
                  <div className="sch-info">
                    <h4>{s.title}</h4>
                    <p>{s.desc}</p>
                    <div className="sch-actions">
                      <button className="btn-ghost" onClick={() => showToast('일정이 수정 화면으로 열립니다.')}><i className="ph ph-pencil-simple"></i> 수정</button>
                      <button className="btn-ghost" onClick={() => showToast('일정이 삭제되었습니다.')}><i className="ph ph-trash"></i> 삭제</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>

      {modal && modal.type === 'member' && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>{modal.data.name} 원장</h3>
              <button className="modal-close" onClick={() => setModal(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="modal-body">
              <p><b>병원</b> · {modal.data.hospital}<br /><b>인증 방식</b> · {modal.data.method}<br /><b>등록일</b> · {modal.data.date}<br /><b>현재 상태</b> · {statusLabel[modal.data.status]}</p>
              <p>상태 변경 시 변경 이력이 감사 로그에 자동 기록됩니다.</p>
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={() => setMemberStatus(modal.data.id, 'suspended')}>정지</button>
              <button className="btn-ghost" onClick={() => setMemberStatus(modal.data.id, 'pending')}>재심사</button>
              <button className="btn-primary" onClick={() => setMemberStatus(modal.data.id, 'approved')}><i className="ph ph-check"></i> 승인</button>
            </div>
          </div>
        </div>
      )}

      {uploadOpen && (
        <div className="modal-overlay" onClick={() => setUploadOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>콘텐츠 등록</h3>
              <button className="modal-close" onClick={() => setUploadOpen(false)}><i className="ph ph-x"></i></button>
            </div>
            <div className="form-group">
              <label>콘텐츠 유형</label>
              <select><option>영상</option><option>자료</option><option>공지</option><option>세미나</option></select>
            </div>
            <div className="form-group"><label>제목</label><input type="text" placeholder="콘텐츠 제목을 입력하세요" /></div>
            <div className="upload-drop">
              <i className="ph ph-cloud-arrow-up"></i>
              <p style={{ margin: '10px 0 4px', fontWeight: 700, color: 'var(--n8)' }}>{uploadFile || '파일을 드래그하거나 클릭하여 업로드'}</p>
              <button className="btn-ghost" onClick={simulateUpload}>파일 선택</button>
              {uploadFile && (
                <div className="progress-bar-wrap"><div className="progress-bar-fill" style={{ width: uploadProgress + '%' }}></div></div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={() => setUploadOpen(false)}>취소</button>
              <button className="btn-primary" disabled={uploadProgress < 100} onClick={() => { setUploadOpen(false); showToast('콘텐츠가 등록되었습니다.'); }}>등록 완료</button>
            </div>
          </div>
        </div>
      )}

      {scheduleModalOpen && (
        <div className="modal-overlay" onClick={() => setScheduleModalOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>세미나 일정 등록</h3>
              <button className="modal-close" onClick={() => setScheduleModalOpen(false)}><i className="ph ph-x"></i></button>
            </div>
            <form onSubmit={submitSchedule}>
              <div className="form-group"><label>일정 제목</label><input type="text" value={scheduleDraft.title} onChange={e => setScheduleDraft(d => ({ ...d, title: e.target.value }))} required /></div>
              <div className="form-group"><label>일시 및 장소</label><input type="text" value={scheduleDraft.desc} onChange={e => setScheduleDraft(d => ({ ...d, desc: e.target.value }))} placeholder="예: 서울 강남 세미나룸 · 오후 2시" /></div>
              <div className="modal-actions">
                <button type="button" className="btn-ghost" onClick={() => setScheduleModalOpen(false)}>취소</button>
                <button type="submit" className="btn-primary">등록</button>
              </div>
            </form>
          </div>
        </div>
      )}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
