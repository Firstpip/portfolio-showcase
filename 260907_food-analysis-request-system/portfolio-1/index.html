<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식품 시료 분석 의뢰관리 시스템 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 205°, light, Seline 시드 원본 hex) ── */
:root{
  --m50:#e4f3fd; --m100:#c8e6fb; --m200:#a7d7f9; --m300:#82c6f6; --m400:#5eb6f4;
  --m500:#3ba6f1; --m600:#3088c6; --m700:#266a9a; --m800:#1b4b6c; --m900:#1b4b6c;
  --n0:#fafaf9; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909598; --n7:#78716c; --n8:#53575a; --n9:#36383a; --n10:#1e1f20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  background:var(--n0);
  color:var(--n9);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
#app{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input, select, textarea{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:4px;}

/* ── keyframes ── */
@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInPanel{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);}}
@keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:0.35;}}
@keyframes toastIn{from{opacity:0; transform:translateY(8px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes cmdkIn{from{opacity:0; transform:scale(0.97) translateY(-6px);} to{opacity:1; transform:scale(1) translateY(0);}}

/* ── layout shell ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; z-index:20;
}
.sidebar-brand{
  height:64px; display:flex; align-items:center; gap:10px; padding:0 20px;
  border-bottom:1px solid var(--n3);
}
.brand-mark{
  width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg, var(--m500), var(--m800));
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; flex-shrink:0;
}
.brand-name{font-size:14px; font-weight:600; color:var(--n9); letter-spacing:-0.01em;}
.brand-sub{font-size:11px; color:var(--n6);}
.sidebar-cmdk-hint{
  margin:14px 16px 6px; padding:9px 12px; border:1px solid var(--n3); border-radius:8px;
  display:flex; align-items:center; justify-content:space-between; background:var(--n0);
  transition:border-color .15s ease, background .15s ease;
}
.sidebar-cmdk-hint:hover{border-color:var(--n5); background:var(--n2);}
.sidebar-cmdk-hint span{font-size:12px; color:var(--n6);}
.kbd{
  font-size:11px; font-family:ui-monospace, monospace; color:var(--n7); background:var(--n2);
  border:1px solid var(--n4); border-radius:4px; padding:1px 6px;
}
.sidebar-nav{padding:10px 12px; display:flex; flex-direction:column; gap:2px;}
.sidebar-section-title{
  font-size:11px; font-weight:600; color:var(--n6); text-transform:uppercase; letter-spacing:.04em;
  padding:14px 8px 6px;
}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px;
  font-size:13.5px; color:var(--n8); border-left:3px solid transparent; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.sidebar-link i{font-size:16px; color:var(--n6); width:18px; text-align:center;}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50); color:var(--m700); border-left-color:var(--m600); font-weight:600;}
.sidebar-link.active i{color:var(--m600);}
.sidebar-badge{
  margin-left:auto; font-size:11px; background:var(--n2); color:var(--n7);
  border-radius:9999px; padding:1px 7px; font-weight:600;
}
.sidebar-link.active .sidebar-badge{background:var(--m100); color:var(--m700);}
.sidebar-user{
  margin-top:auto; padding:14px 16px; border-top:1px solid var(--n3);
  display:flex; align-items:center; gap:10px;
}
.avatar-circle{
  width:30px; height:30px; border-radius:50%; background:var(--n2); color:var(--n8);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.user-meta{display:flex; flex-direction:column; line-height:1.3;}
.user-name{font-size:12.5px; font-weight:600; color:var(--n9);}
.user-role{font-size:11px; color:var(--n6);}

.main-wrap{
  margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px);
  min-height:100vh; display:flex; flex-direction:column;
}
.topbar{
  height:56px; border-bottom:1px solid var(--n3); background:var(--n1);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  position:sticky; top:0; z-index:10;
}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n6);}
.breadcrumb a{color:var(--n6);}
.breadcrumb .current{color:var(--n9); font-weight:600;}
.breadcrumb .divider{color:var(--n4);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.btn-cmdk{
  display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--n7);
  border:1px solid var(--n3); border-radius:7px; padding:6px 10px; background:var(--n0);
  transition:border-color .15s ease;
}
.btn-cmdk:hover{border-color:var(--n5);}
.btn-primary{
  background:var(--m600); color:#fff; font-size:13px; font-weight:600;
  border-radius:7px; padding:8px 16px; display:flex; align-items:center; gap:6px;
  transition:background .15s ease, transform .08s ease;
}
.btn-primary:hover{background:var(--m700);}
.btn-primary:active{transform:scale(0.97);}
.btn-ghost{
  border:1px solid var(--n3); color:var(--n8); font-size:13px; font-weight:500;
  border-radius:7px; padding:8px 14px; background:var(--n1); transition:background .12s ease;
}
.btn-ghost:hover{background:var(--n2);}
.btn-ghost.danger{color:var(--s2-text); border-color:var(--s2-bg);}
.btn-ghost.danger:hover{background:var(--s2-bg);}

.content{padding:28px 32px; width:100%; flex:1; animation:fadeInUp .35s ease;}

/* ── master-detail composition (main) ── */
.master-detail{display:flex; gap:0; width:100%; min-height:640px; border:1px solid var(--n3); border-radius:10px; overflow:hidden; background:var(--n1);}
.list-rail{width:360px; flex-shrink:0; border-right:1px solid var(--n3); display:flex; flex-direction:column; background:var(--n0);}
.list-rail-head{padding:16px 16px 12px; border-bottom:1px solid var(--n3);}
.list-rail-title{font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
.list-rail-count{font-size:12px; color:var(--n6); font-weight:500;}
.search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--n3); border-radius:7px; padding:7px 10px; background:var(--n1); margin-bottom:8px;}
.search-box input{border:none; outline:none; flex:1; font-size:13px; background:transparent; color:var(--n9);}
.search-box i{color:var(--n5); font-size:15px;}
.filter-chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  font-size:11.5px; padding:4px 10px; border-radius:9999px; border:1px solid var(--n3);
  color:var(--n7); background:var(--n1); font-weight:500; transition:all .12s ease;
}
.chip.active{background:var(--n9); color:#fff; border-color:var(--n9);}
.list-rail-items{overflow-y:auto; flex:1;}
.list-item{
  padding:13px 16px; border-bottom:1px solid var(--n3); cursor:pointer; display:flex; flex-direction:column; gap:5px;
  transition:background .12s ease;
}
.list-item:hover{background:var(--n2);}
.list-item.selected{background:var(--m50); border-left:3px solid var(--m600); padding-left:13px;}
.list-item-top{display:flex; align-items:center; justify-content:space-between;}
.list-item-code{font-size:11.5px; color:var(--n6); font-family:ui-monospace,monospace;}
.list-item-name{font-size:13.5px; font-weight:600; color:var(--n9);}
.list-item-meta{font-size:12px; color:var(--n7); display:flex; align-items:center; gap:6px;}
.status-pill{
  font-size:11px; font-weight:600; padding:2.5px 9px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px;
}
.status-dot{width:6px; height:6px; border-radius:50%;}
.status-pill.neutral{background:var(--n2); color:var(--n7);}
.status-pill.neutral .status-dot{background:var(--n6);}
.status-pill.progress{background:var(--m50); color:var(--m700);}
.status-pill.progress .status-dot{background:var(--m600); animation:pulseDot 1.6s ease-in-out infinite;}
.status-pill.warn{background:var(--s3-bg); color:var(--s3-text);}
.status-pill.warn .status-dot{background:var(--s3);}
.status-pill.done{background:var(--s1-bg); color:var(--s1-text);}
.status-pill.done .status-dot{background:var(--s1);}

.detail-panel{flex:1; min-width:0; display:flex; flex-direction:column; animation:slideInPanel .25s ease;}
.detail-panel-empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--n6); font-size:13px; flex-direction:column; gap:10px;}
.detail-head{padding:20px 24px; border-bottom:1px solid var(--n3); display:flex; align-items:flex-start; justify-content:space-between;}
.detail-head h2{font-size:17px; font-weight:700; color:var(--n9); margin-bottom:4px;}
.detail-head-sub{font-size:12.5px; color:var(--n6); display:flex; gap:10px; align-items:center;}
.detail-body{padding:20px 24px; overflow-y:auto; flex:1;}
.detail-section{margin-bottom:24px;}
.detail-section-title{font-size:12.5px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;}
.info-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 20px;}
.info-item label{display:block; font-size:11.5px; color:var(--n6); margin-bottom:3px;}
.info-item div{font-size:13.5px; color:var(--n9); font-weight:500;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:12px; padding:4px 10px; border-radius:6px; background:var(--n2); color:var(--n8); border:1px solid var(--n3);}
.file-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--n3); border-radius:7px; margin-bottom:6px; background:var(--n0);}
.file-row i{color:var(--n6); font-size:16px;}
.file-row span{font-size:12.5px; color:var(--n8); flex:1;}
.file-row button{font-size:11.5px; color:var(--m700); font-weight:600;}
.timeline{position:relative; padding-left:20px;}
.timeline::before{content:''; position:absolute; left:5px; top:4px; bottom:4px; width:1.5px; background:var(--n3);}
.timeline-item{position:relative; padding-bottom:16px;}
.timeline-item::before{content:''; position:absolute; left:-20px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--n5); border:2px solid var(--n1);}
.timeline-item.done::before{background:var(--s1);}
.timeline-item.current::before{background:var(--m600); animation:pulseDot 1.6s ease-in-out infinite;}
.timeline-item-title{font-size:13px; font-weight:600; color:var(--n9);}
.timeline-item-time{font-size:11.5px; color:var(--n6); margin-top:2px;}
.state-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px;}
.state-btn{
  font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; border:1px solid var(--n3);
  color:var(--n7); background:var(--n1); transition:all .12s ease;
}
.state-btn:hover:not(:disabled){border-color:var(--m600); color:var(--m700); background:var(--m50);}
.state-btn:disabled{opacity:.35; cursor:not-allowed;}
.detail-foot{padding:14px 24px; border-top:1px solid var(--n3); display:flex; gap:10px; justify-content:flex-end;}

/* ── page header ── */
.page-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px;}
.page-title{font-size:32px; font-weight:700; letter-spacing:-0.02em; color:var(--n9); margin-bottom:6px;}
.page-desc{font-size:13.5px; color:var(--n7); max-width:560px; line-height:1.55;}

/* ── forms ── */
.form-card{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:26px; max-width:760px;}
.form-section{margin-bottom:26px;}
.form-section-title{font-size:14px; font-weight:700; color:var(--n9); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.form-section-title i{color:var(--m600); font-size:16px;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{margin-bottom:14px;}
.field.full{grid-column:1/-1;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.field .req{color:var(--s2);}
.field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=number], .field select, .field textarea{
  width:100%; border:1px solid var(--n3); border-radius:7px; padding:9px 12px; font-size:13.5px; color:var(--n9);
  background:var(--n1); outline:none; transition:border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--m600); box-shadow:0 0 0 3px var(--m100);}
.field textarea{resize:vertical; min-height:70px;}
.checkbox-row{display:flex; gap:16px; flex-wrap:wrap;}
.checkbox-item{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--n8);}
.dropzone{
  border:1.5px dashed var(--n4); border-radius:9px; padding:22px; text-align:center; color:var(--n6);
  font-size:12.5px; background:var(--n0); transition:border-color .15s ease, background .15s ease;
}
.dropzone:hover{border-color:var(--m500); background:var(--m50);}
.dropzone i{font-size:22px; color:var(--n5); margin-bottom:6px; display:block;}
.uploaded-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.hint-box{
  display:flex; gap:9px; align-items:flex-start; background:var(--n0); border:1px solid var(--n3);
  border-radius:8px; padding:11px 13px; font-size:12px; color:var(--n7); line-height:1.5; margin-top:6px;
}
.hint-box i{color:var(--m600); font-size:15px; margin-top:1px; flex-shrink:0;}

/* ── confirmation card ── */
.confirm-card{
  background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:36px; max-width:520px;
  text-align:center; animation:fadeInUp .3s ease;
}
.confirm-icon{
  width:52px; height:52px; border-radius:50%; background:var(--s1-bg); color:var(--s1);
  display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px;
}
.receipt-code{
  font-family:ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--m700);
  background:var(--m50); border:1px solid var(--m200); border-radius:8px; padding:12px 20px; margin:16px 0;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.receipt-code button{font-size:12px; color:var(--m700); font-weight:600; display:flex; align-items:center; gap:4px;}

/* ── tracking screen ── */
.tracking-wrap{max-width:520px; margin:0 auto;}
.tracking-card{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:28px;}
.otp-boxes{display:flex; gap:8px; justify-content:center; margin:14px 0;}
.otp-boxes input{width:42px; height:48px; text-align:center; font-size:18px; font-weight:700; border:1px solid var(--n3); border-radius:8px;}
.otp-boxes input:focus{border-color:var(--m600); outline:none; box-shadow:0 0 0 3px var(--m100);}
.result-panel{margin-top:22px; animation:fadeInUp .3s ease;}
.channel-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--n3); font-size:13px;}
.channel-row:last-child{border-bottom:none;}
.channel-row i{color:var(--n6); font-size:16px; width:18px;}
.channel-row .label{color:var(--n7); width:110px; flex-shrink:0;}
.channel-row .val{color:var(--n9); font-weight:500;}

/* ── certificate screen ── */
.cert-table{width:100%; border-collapse:collapse; background:var(--n1); border:1px solid var(--n3); border-radius:10px; overflow:hidden;}
.cert-table th{
  text-align:left; font-size:11.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em;
  padding:11px 16px; background:var(--n0); border-bottom:1px solid var(--n3);
}
.cert-table td{padding:13px 16px; font-size:13px; color:var(--n8); border-bottom:1px solid var(--n3);}
.cert-table tr:last-child td{border-bottom:none;}
.cert-table tr:hover td{background:var(--n0);}
.section-block{margin-bottom:30px;}
.section-block-title{font-size:14px; font-weight:700; color:var(--n9); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.section-block-title .cnt{font-size:12px; color:var(--n6); font-weight:500;}

/* ── toast ── */
.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:100; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--n9); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px;
  display:flex; align-items:center; gap:10px; animation:toastIn .25s ease; box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.toast i{color:var(--s1); font-size:16px;}

/* ── modal ── */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,20,.4); z-index:200;
  display:flex; align-items:center; justify-content:center; animation:fadeInUp .18s ease; padding:20px;
}
.modal-box{
  background:var(--n1); border-radius:12px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  animation:cmdkIn .2s ease; box-shadow:0 24px 60px rgba(0,0,0,.2);
}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--n3); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:15px; font-weight:700; color:var(--n9);}
.modal-close{color:var(--n6); font-size:18px; padding:4px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--n3); display:flex; justify-content:flex-end; gap:10px;}

/* ── cmdk overlay ── */
.cmdk-overlay{
  position:fixed; inset:0; background:rgba(20,20,20,.35); z-index:300;
  display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;
}
.cmdk-modal{
  width:100%; max-width:520px; background:var(--n1); border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,.25);
  animation:cmdkIn .18s ease; overflow:hidden;
}
.cmdk-input{
  width:100%; border:none; border-bottom:1px solid var(--n3); padding:16px 18px; font-size:15px; outline:none; color:var(--n9);
}
.cmdk-results{max-height:320px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:11px; color:var(--n6); padding:8px 10px 4px; font-weight:600;}
.cmdk-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; font-size:13.5px; color:var(--n8);
  transition:background .1s ease;
}
.cmdk-item:hover{background:var(--n2);}
.cmdk-item i{color:var(--n6); font-size:15px; width:18px;}
.cmdk-item .kbd{margin-left:auto;}

@media (max-width: 980px){
  .master-detail{flex-direction:column;}
  .list-rail{width:100%; border-right:none; border-bottom:1px solid var(--n3); max-height:320px;}
  .field-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<div id="app"></div>
<script type="text/babel">

function MainScreen({selected, setSelected, notify, setDetailModal}){
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('전체');
  const [statuses, setStatuses] = useState(()=>Object.fromEntries(REQUESTS.map(r=>[r.id, r.status])));

  const filtered = useMemo(()=>{
    return REQUESTS.filter(r => {
      const st = statuses[r.id];
      const matchQ = !q || r.org.includes(q) || r.requester.includes(q) || r.sample.includes(q) || r.id.includes(q);
      const matchF = filter==='전체' || st===filter;
      return matchQ && matchF;
    });
  }, [q, filter, statuses]);

  const item = REQUESTS.find(r=>r.id===selected);
  const curStatus = item ? statuses[item.id] : null;

  function changeState(next){
    setStatuses(s => ({...s, [selected]: next}));
    notify(`${selected} 상태가 "${next}"(으)로 변경되었습니다`);
  }

    <div className="content">
      <div className="page-header">
        <div>
          <div className="page-title">의뢰 접수·상세 관리</div>

              ))}
            </div>
          </div>
          <div className="list-rail-items">
            {filtered.map(r => (
              <div key={r.id} className={"list-item"+(selected===r.id?' selected':'')} onClick={()=>setSelected(r.id)}>
                <div className="list-item-top">
                  <span className="list-item-code">{r.id}</span>
                  <span className={"status-pill "+statusClass(statuses[r.id])}><span className="status-dot"></span>{statuses[r.id]}</span>

          </div>
        </div>

        <div className="detail-panel">

            <div className="detail-panel-empty">
              <svg width="96" height="96" viewBox="0 0 96 96" fill="none">

                <path d="M31 58h34l6 10a6 6 0 0 1-5.3 8.8H29.3A6 6 0 0 1 24 68l7-10z" fill="var(--m50)" stroke="var(--m300)" strokeWidth="1.5"/>

              </svg>
              <div>좌측 목록에서 의뢰를 선택하세요</div>

            <React.Fragment key={item.id}>
              <div className="detail-head">
                <div>
                  <h2>{item.org} · {item.sample}</h2>

                    <span>{item.id}</span><span>·</span><span>{item.requester} 의뢰자</span><span>·</span><span>{item.received} 접수</span>

                <div className="detail-section">

                  <div className="state-flow">
                    {STATE_NEXT[curStatus].length===0 && <span style={{fontSize:12.5, color:'var(--n6)'}}>최종 상태입니다 — 더 이상 전이할 수 없습니다</span>}

                      <button key={s} className="state-btn" onClick={()=>changeState(s)}><i className="ti ti-arrow-right" style={{fontSize:12, marginRight:4}}></i>{s}(으)로 전환</button>

              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );

function RequestForm({notify}){
  const [spec, setSpec] = useState('');
  const [selectedTests, setSelectedTests] = useState([]);
  const [files, setFiles] = useState([]);
  const [submitted, setSubmitted] = useState(null);
  const [tc, setTc] = useState('발행 안 함');
  const [receiveMethods, setReceiveMethods] = useState(['이메일']);

  function toggleReceive(m){
    setReceiveMethods(r => r.includes(m) ? r.filter(x=>x!==m) : [...r, m]);
  }
  function toggleTest(t){
    setSelectedTests(s => s.includes(t) ? s.filter(x=>x!==t) : [...s, t]);
  }
  function addFile(){
    if(files.length>=5){ notify('첨부파일은 최대 5개까지 업로드할 수 있습니다'); return; }
    setFiles(f => [...f, `첨부파일_${f.length+1}.pdf`]);
  }
  function submit(e){
    e.preventDefault();
    const code = 'FA-'+(260907+Math.floor(Math.random()*90))+'-'+String(1000+Math.floor(Math.random()*8999));
    setSubmitted(code);
  }

  if(submitted){
    return (
      <div className="content">
        <div className="confirm-card">
          <div className="confirm-icon"><i className="ti ti-check"></i></div>
          <h2 style={{fontSize:17, fontWeight:700, marginBottom:6}}>의뢰서가 정상 접수되었습니다</h2>
          <p style={{fontSize:13, color:'var(--n7)'}}>아래 접수번호로 진행상태를 조회할 수 있습니다</p>
          <div className="receipt-code">
            {submitted}
            <button onClick={()=>notify('접수번호가 복사되었습니다')}><i className="ti ti-copy"></i>복사</button>
          </div>
          <button className="btn-primary" style={{margin:'0 auto'}} onClick={()=>{setSubmitted(null); setSpec(''); setSelectedTests([]); setFiles([]);}}>새 의뢰서 작성</button>
        </div>
      </div>
    );
  }

  return (
    <div className="content">
      <div className="page-header">
        <div>
          <div className="page-title">온라인 분석의뢰서 작성</div>
          <div className="page-desc">의뢰기관 정보와 시료 정보를 입력하고, 식품규격에 따라 자동으로 연결되는 시험항목을 선택해 제출합니다.</div>
        </div>
      </div>
      <form className="form-card" onSubmit={submit}>
        <div className="form-section">
          <div className="form-section-title"><i className="ti ti-building"></i>의뢰기관·의뢰자 정보</div>
          <div className="field-grid">
            <div className="field"><label>의뢰기관명 <span className="req">*</span></label><input type="text" required placeholder="예: 대한푸드시스템" /></div>
            <div className="field"><label>의뢰자명 <span className="req">*</span></label><input type="text" required placeholder="담당자 성함" /></div>
            <div className="field"><label>연락처 <span className="req">*</span></label><input type="tel" required placeholder="010-0000-0000" /></div>
            <div className="field"><label>이메일 <span className="req">*</span></label><input type="email" required placeholder="example@company.co.kr" /></div>
          </div>
        </div>
        <div className="form-section">
          <div className="form-section-title"><i className="ti ti-test-pipe"></i>시료 정보 및 검사 항목</div>
          <div className="field-grid">
            <div className="field"><label>시료명 <span className="req">*</span></label><input type="text" required placeholder="예: 즉석섭취식품(김밥)" /></div>
            <div className="field"><label>시료 수량 <span className="req">*</span></label><input type="number" required placeholder="1" min="1" /></div>
            <div className="field full"><label>검사 업무구분 <span className="req">*</span></label>
              <select required defaultValue=""><option value="" disabled>선택하세요</option><option>자가품질검사</option><option>일반 이화학 분석</option></select>
            </div>
            <div className="field full">
              <label>적용 식품규격 <span className="req">*</span></label>
              <select required value={spec} onChange={e=>{setSpec(e.target.value); setSelectedTests([]);}}>
                <option value="" disabled>식품규격을 선택하세요</option>
                {Object.keys(FOOD_SPECS).map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            {spec && (
              <div className="field full">
                <label>시험항목 (규격 선택 시 자동 연결)</label>
                <div className="tag-row">
                  {FOOD_SPECS[spec].map(t => (
                    <button type="button" key={t} className={"chip"+(selectedTests.includes(t)?' active':'')} onClick={()=>toggleTest(t)}>{t}</button>
                  ))}
                </div>
                <div className="hint-box"><i className="ti ti-info-circle"></i>선택한 규격·시험항목은 제출 시점 기준으로 스냅샷 저장되어, 이후 마스터 데이터가 변경되어도 이 의뢰의 값은 유지됩니다.</div>
              </div>
            )}
          </div>
        </div>
        <div className="form-section">
          <div className="form-section-title"><i className="ti ti-certificate"></i>성적서 발급 옵션</div>
          <div className="field-grid">
            <div className="field"><label>발급 언어</label><select defaultValue="국문"><option>국문</option><option>영문</option><option>국영문</option></select></div>
            <div className="field"><label>발급 부수</label><input type="number" defaultValue="1" min="1" /></div>
            <div className="field full">
              <label>수령방법 (복수 선택 가능)</label>
              <div className="checkbox-row">
                {['이메일','우편','방문'].map(m => (
                  <label className="checkbox-item" key={m}><input type="checkbox" checked={receiveMethods.includes(m)} onChange={()=>toggleReceive(m)} />{m}</label>
                ))}
              </div>
            </div>
            {receiveMethods.includes('우편') && (
              <div className="field full"><label>우편 수령 주소</label><input type="text" placeholder="수령인 / 연락처 / 우편번호 / 주소" /></div>
            )}
          </div>
        </div>
        <div className="form-section">
          <div className="form-section-title"><i className="ti ti-receipt"></i>세금계산서 발행요청</div>
          <div className="field-grid">
            <div className="field full"><label>발행 여부</label>
              <select value={tc} onChange={e=>setTc(e.target.value)}><option>발행 안 함</option><option>발행 요청</option></select>
            </div>
            {tc==='발행 요청' && <div className="field full"><label>사업자등록번호</label><input type="text" placeholder="000-00-00000" /></div>}
          </div>
        </div>
        <div className="form-section">
          <div className="form-section-title"><i className="ti ti-upload"></i>첨부파일 (최대 20MB · 5개)</div>
          <div className="dropzone" onClick={addFile}><i className="ti ti-cloud-upload"></i>클릭하여 파일 추가 (jpg, png, pdf, hwp)</div>
          <div className="uploaded-list">
            {files.map((f,i) => (
              <div className="file-row" key={i}><i className="ti ti-file"></i><span>{f}</span><button type="button" onClick={()=>setFiles(fs=>fs.filter((_,idx)=>idx!==i))}>삭제</button></div>
            ))}
          </div>
        </div>
        <div className="field full"><label>기타 요청사항</label><textarea placeholder="추가로 전달하실 내용을 입력하세요"></textarea></div>
        <button type="submit" className="btn-primary" style={{width:'100%', justifyContent:'center', padding:'12px', fontSize:14}}>의뢰서 제출</button>
      </form>
    </div>
  );
}

function TrackingScreen({notify}){
  const [step, setStep] = useState('input');
  const [code, setCode] = useState('');
  const [email, setEmail] = useState('');
  const [otp, setOtp] = useState(['','','','','','']);
  const otpRefs = useRef([]);
  const found = REQUESTS.find(r => r.id===code);

  function sendOtp(e){
    e.preventDefault();
    if(!code || !email){ notify('접수번호와 이메일을 모두 입력해 주세요'); return; }
    setStep('otp');
    notify('인증번호가 이메일로 발송되었습니다');
  }
  function verifyOtp(e){
    e.preventDefault();
    setStep('result');
  }
  function updateOtp(i, v){
    if(v.length>1) v = v.slice(-1);
    const next = [...otp]; next[i]=v; setOtp(next);
    if(v && otpRefs.current[i+1]) otpRefs.current[i+1].focus();
  }

  return (
    <div className="content">
      <div className="page-header">
        <div>
          <div className="page-title">비회원 진행상태 조회</div>
          <div className="page-desc">접수번호와 이메일로 본인확인 후, 분석·정산·전달 상태를 실시간으로 조회합니다.</div>
        </div>
      </div>
      <div className="tracking-wrap">
        <div className="tracking-card">
          {step==='input' && (
            <form onSubmit={sendOtp}>
              <div className="field"><label>접수번호 <span className="req">*</span></label><input type="text" placeholder="FA-260907-0182" value={code} onChange={e=>setCode(e.target.value)} required /></div>
              <div className="field"><label>이메일 <span className="req">*</span></label><input type="email" placeholder="접수 시 입력한 이메일" value={email} onChange={e=>setEmail(e.target.value)} required /></div>
              <button className="btn-primary" style={{width:'100%', justifyContent:'center', padding:'11px'}} type="submit">인증번호 발송</button>
            </form>
          )}
          {step==='otp' && (
            <form onSubmit={verifyOtp}>
              <p style={{fontSize:13, color:'var(--n7)', textAlign:'center', marginBottom:6}}>이메일로 전송된 6자리 인증번호를 입력하세요</p>
              <div className="otp-boxes">
                {otp.map((v,i) => (
                  <input key={i} ref={el=>otpRefs.current[i]=el} value={v} maxLength="1" onChange={e=>updateOtp(i, e.target.value)} />
                ))}
              </div>
              <button className="btn-primary" style={{width:'100%', justifyContent:'center', padding:'11px', marginTop:10}} type="submit">확인</button>
              <p style={{fontSize:11.5, color:'var(--n6)', textAlign:'center', marginTop:10}}>인증번호는 발급 후 5분간 유효합니다</p>
            </form>
          )}
          {step==='result' && (
            <div className="result-panel">
              {found ? (
                <React.Fragment>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
                    <div style={{fontSize:15, fontWeight:700}}>{found.org} · {found.sample}</div>
                    <span className={"status-pill "+statusClass(found.status)}><span className="status-dot"></span>{found.status}</span>
                  </div>
                  <div className="timeline">
                    <div className="timeline-item done"><div className="timeline-item-title">접수 완료</div><div className="timeline-item-time">{found.received}</div></div>
                    <div className="timeline-item done"><div className="timeline-item-title">검토 완료</div><div className="timeline-item-time">담당자: {found.manager}</div></div>
                    <div className={"timeline-item "+(found.status==='분석중'?'current':'done')}><div className="timeline-item-title">분석 진행</div><div className="timeline-item-time">시험항목 {found.tests.length}건</div></div>
                    <div className={"timeline-item "+(found.status==='분석완료'?'done':'')}><div className="timeline-item-title">성적서 전달</div><div className="timeline-item-time">{found.status==='분석완료' ? '전달 준비 완료' : '분석 완료 후 진행'}</div></div>
                  </div>
                  <div style={{marginTop:18, paddingTop:16, borderTop:'1px solid var(--n3)'}}>
                    <div className="channel-row"><i className="ti ti-mail"></i><span className="label">이메일 발송</span><span className="val">2026.09.06 14:20 발송완료</span></div>
                    <div className="channel-row"><i className="ti ti-truck"></i><span className="label">우편 등기번호</span><span className="val">미발송</span></div>
                    <div className="channel-row"><i className="ti ti-map-pin"></i><span className="label">방문수령</span><span className="val">가능일 안내 예정</span></div>
                  </div>
                  {found.status==='보완요청' && (
                    <button className="btn-primary" style={{width:'100%', justifyContent:'center', padding:'11px', marginTop:16}} onClick={()=>notify('보완자료 제출 화면으로 이동합니다')}>
                      <i className="ti ti-file-upload" style={{marginRight:6}}></i>보완자료 제출하기
                    </button>
                  )}
                </React.Fragment>
              ) : (
                <div style={{textAlign:'center', padding:'20px 0', color:'var(--n6)', fontSize:13}}>
                  <i className="ti ti-search-off" style={{fontSize:24, display:'block', marginBottom:8}}></i>
                  일치하는 의뢰 정보가 없습니다. 접수번호를 다시 확인해 주세요.<br/>(데모 조회 예: FA-260907-0181, FA-260907-0179)
                </div>
              )}
              <button className="btn-ghost" style={{width:'100%', marginTop:12}} onClick={()=>{setStep('input'); setCode(''); setOtp(['','','','','','']);}}>다른 의뢰 조회하기</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function CertificateScreen({notify}){
  const ready = REQUESTS.filter(r => r.status==='분석완료');
  const [sent, setSent] = useState({});
  const [confirmItem, setConfirmItem] = useState(null);
  const history = [
    {id:'FA-260907-0170', addr:'j***@daehan-food.co.kr', time:'2026.09.06 11:02', result:'발송 성공'},
    {id:'FA-260907-0165', addr:'kim***@blueocean.kr', time:'2026.09.06 09:47', result:'발송 성공'},
    {id:'FA-260907-0161', addr:'lee***@invalid-domain', time:'2026.09.05 17:12', result:'반송'},
    {id:'FA-260907-0158', addr:'park***@sanya-nh.co.kr', time:'2026.09.05 15:30', result:'발송 성공'},
  ];
  const [historyState, setHistoryState] = useState(history);

  function execSend(item){
    setSent(s => ({...s, [item.id]:true}));
    notify(`${item.id} 성적서가 이메일로 발송되고 이력이 기록되었습니다`);
    setConfirmItem(null);
  }
  function resend(id){
    setHistoryState(h => h.map(x => x.id===id ? {...x, result:'재발송 처리중'} : x));
    notify(`${id} 재발송 큐에 등록되었습니다`);
  }

  return (
    <div className="content">
      <div className="page-header">
        <div>
          <div className="page-title">성적서 등록·발송 관리</div>
          <div className="page-desc">확정 성적서를 업로드하고 확인 후 발송을 실행합니다. 업로드만으로는 자동 발송되지 않습니다.</div>
        </div>
      </div>

      <div className="section-block">
        <div className="section-block-title">발송 대기 <span className="cnt">분석완료 {ready.length}건</span></div>
        <table className="cert-table">
          <thead><tr><th>접수번호</th><th>기관명</th><th>수령방법</th><th>성적서 파일</th><th>처리</th></tr></thead>
          <tbody>
            {ready.map(r => (
              <tr key={r.id}>
                <td style={{fontFamily:'ui-monospace,monospace', fontSize:12}}>{r.id}</td>
                <td>{r.org}</td>
                <td>{r.channel}</td>
                <td>{sent[r.id] ? <span className="status-pill done"><span className="status-dot"></span>발송완료</span> : <button className="btn-ghost" style={{padding:'5px 10px', fontSize:12}} onClick={()=>notify(`${r.id} 성적서 PDF가 업로드되었습니다`)}><i className="ti ti-upload" style={{marginRight:4}}></i>PDF 업로드</button>}</td>
                <td>{!sent[r.id] && <button className="btn-primary" style={{padding:'6px 12px', fontSize:12}} onClick={()=>setConfirmItem(r)}>발송 실행</button>}</td>
              </tr>
            ))}
            {ready.length===0 && <tr><td colSpan="5" style={{textAlign:'center', color:'var(--n6)', padding:'20px'}}>발송 대기 중인 성적서가 없습니다</td></tr>}
          </tbody>
        </table>
      </div>

      <div className="section-block">
        <div className="section-block-title">발송 이력 및 재발송 큐 <span className="cnt">최근 {historyState.length}건</span></div>
        <table className="cert-table">
          <thead><tr><th>접수번호</th><th>수신주소</th><th>발송일시</th><th>결과</th><th></th></tr></thead>
          <tbody>
            {historyState.map(h => (
              <tr key={h.id}>
                <td style={{fontFamily:'ui-monospace,monospace', fontSize:12}}>{h.id}</td>
                <td>{h.addr}</td>
                <td>{h.time}</td>
                <td>
                  {h.result==='발송 성공' && <span className="status-pill done"><span className="status-dot"></span>발송 성공</span>}
                  {h.result==='반송' && <span className="status-pill" style={{background:'var(--s2-bg)', color:'var(--s2-text)'}}><span className="status-dot" style={{background:'var(--s2)'}}></span>반송</span>}
                  {h.result==='재발송 처리중' && <span className="status-pill progress"><span className="status-dot"></span>재발송 처리중</span>}
                </td>
                <td>{h.result==='반송' && <button className="btn-ghost" style={{padding:'5px 10px', fontSize:12}} onClick={()=>resend(h.id)}>재발송</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {confirmItem && (
        <Modal title="성적서 발송 확인" onClose={()=>setConfirmItem(null)} footer={
          <React.Fragment>
            <button className="btn-ghost" onClick={()=>setConfirmItem(null)}>취소</button>
            <button className="btn-primary" onClick={()=>execSend(confirmItem)}>발송 확정</button>
          </React.Fragment>
        }>
          <p style={{fontSize:13.5, color:'var(--n8)', lineHeight:1.6}}>
            <b>{confirmItem.org}</b> ({confirmItem.id})의 성적서를 <b>{confirmItem.channel}</b>(으)로 발송합니다.<br/>
            발송 즉시 발송 이력에 기록되며 취소할 수 없습니다.
          </p>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [selected, setSelected] = useState(REQUESTS[0].id);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [detailModal, setDetailModal] = useState(null);
  const [memo, setMemo] = useState('');

  function notify(msg){
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(()=>setToasts(t => t.filter(x=>x.id!==id)), 2800);
  }

  useEffect(()=>{
    function onKey(e){
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
    }
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="app-shell">
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        <Topbar view={view} setCmdkOpen={setCmdkOpen} notify={notify} />
        {view==='main' && <MainScreen selected={selected} setSelected={setSelected} notify={notify} setDetailModal={setDetailModal} />}
        {view==='request-form' && <RequestForm notify={notify} />}
        {view==='tracking' && <TrackingScreen notify={notify} />}
        {view==='certificate' && <CertificateScreen notify={notify} />}
      </div>
      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} onNavigate={setView} />
      <Toast toasts={toasts} />
      {detailModal && (
        <Modal title="내부메모 작성" onClose={()=>setDetailModal(null)} footer={
          <React.Fragment>
            <button className="btn-ghost" onClick={()=>setDetailModal(null)}>취소</button>
            <button className="btn-primary" onClick={()=>{notify('내부메모가 저장되었습니다'); setDetailModal(null); setMemo('');}}>저장</button>
          </React.Fragment>
        }>
          <div className="field full">
            <label>{detailModal.org} ({detailModal.id}) — 고객 비공개 메모</label>
            <textarea placeholder="관리자 내부메모를 입력하세요 (고객에게 노출되지 않습니다)" value={memo} onChange={e=>setMemo(e.target.value)} style={{minHeight:110}}></textarea>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
