<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식품 분석 통합 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2(s2 무채색 대체) · 나머지 무채색 (gen-color-tokens.js 산출, hue 14°, light) ── */
:root{
  --m50:#f9f2f0; --m100:#f3e6e1; --m200:#e7ccc4; --m300:#d8ada0; --m400:#c78b77;
  --m500:#b86a51; --m600:#a8492b; --m700:#8a3c23; --m800:#6c2f1c; --m900:#4c2113;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab6b5; --n6:#989290; --n7:#797776; --n8:#5a5553; --n9:#3a3736; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  /* s2(오류/반송/실패) — 메인 hue 14°와 겹쳐 제거됨 → n9/n10 무채색 필로 표현 */
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased; letter-spacing:-0.005em;
}
#app{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input, select, textarea{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:4px;}

/* ── keyframes ── */
@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastSlide{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);}}
@keyframes gentlePulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}
@keyframes barGrow{from{width:0;} to{width:var(--w);}}
@keyframes modalPop{from{opacity:0; transform:scale(0.96);} to{opacity:1; transform:scale(1);}}

/* ── top nav (topnav-hero chrome) ── */
.shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}
.topnav{
  width:100%; height:76px; flex-shrink:0; background:var(--n0);
  border-bottom:1px solid var(--n1); display:flex; align-items:center; padding:0 32px; gap:28px;
}
.tn-brand{display:flex; align-items:center; gap:10px; margin-right:8px;}
.tn-mark{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--m400), var(--m800)); display:flex; align-items:center; justify-content:center; color:#fff;}
.tn-brand-text{font-family:'Noto Serif KR', serif; font-size:17px; font-weight:500; letter-spacing:-0.02em; color:var(--n10);}
.tn-brand-sub{font-size:10.5px; color:var(--n7); letter-spacing:.06em; text-transform:uppercase;}
.tn-tabs{display:flex; align-items:center; gap:4px; flex:1;}
.tn-tab{
  padding:9px 16px; border-radius:100px; font-size:13.5px; color:var(--n7); font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.tn-tab:hover{background:var(--n2); color:var(--n9);}
.tn-tab.active{background:var(--n10); color:var(--n0);}
.tn-actions{display:flex; align-items:center; gap:10px;}
.pill-btn{
  border-radius:100px; padding:10px 22px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px;
  transition:transform .1s ease, opacity .15s ease;
}
.pill-btn:active{transform:scale(0.96);}
.pill-btn.blue{background:var(--m600); color:#fff;}
.pill-btn.blue:hover{opacity:.92;}
.pill-btn.black{background:var(--n10); color:var(--n0);}
.pill-btn.black:hover{opacity:.88;}
.pill-btn.ghost{background:transparent; border:1px solid var(--n1); color:var(--n9);}
.pill-btn.ghost:hover{background:var(--n2);}
.pill-btn.sm{padding:6px 14px; font-size:12px;}

.page{width:100%; flex:1; padding:30px 32px 50px; animation:fadeInUp .3s ease; position:relative;}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; position:relative;}
.page-title{font-family:'Noto Serif KR', serif; font-size:44px; font-weight:400; letter-spacing:-0.02em; color:var(--n10); margin-bottom:6px;}
.page-desc{font-size:13.5px; color:var(--n7); max-width:600px; line-height:1.6;}

/* ── 편집적 무드 — 히어로 대기 그라데이션 웜(무채색+메인 톤만, 색 절제 규칙 준수) ── */
.hero-wash{
  position:absolute; top:-60px; right:-40px; width:520px; height:280px; pointer-events:none; z-index:-1;
  background:radial-gradient(circle at 70% 30%, var(--m100) 0%, var(--m50) 38%, transparent 70%);
  filter:blur(38px); opacity:.85;
}

/* ── kanban board archetype ── */
.board-wrap{display:flex; gap:22px; width:100%;}
.board-header{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
}
.board-header-left{display:flex; align-items:center; gap:14px;}
.board-title{font-size:14px; font-weight:600; color:var(--n9);}
.board-filter{display:flex; gap:6px;}
.chip{
  font-size:11.5px; padding:5px 12px; border-radius:100px; border:1px solid var(--n1); color:var(--n7);
  background:var(--n2); font-weight:500; transition:all .12s ease;
}
.chip.active{background:var(--n10); color:var(--n0); border-color:var(--n10);}
.board{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; flex:1; min-width:0;}
.column{
  width:272px; flex-shrink:0; background:var(--n2); border-radius:24px; padding:14px; display:flex; flex-direction:column; gap:10px;
}
.col-header{display:flex; align-items:center; justify-content:space-between; padding:4px 6px 2px;}
.col-header-label{font-size:12.5px; font-weight:700; color:var(--n8); display:flex; align-items:center; gap:6px;}
.col-dot{width:7px; height:7px; border-radius:50%;}
.count{
  font-size:11px; font-weight:700; background:var(--n1); color:var(--n7); border-radius:100px; padding:2px 9px;
}
.card{
  background:#fff; border:1px solid var(--n1); border-radius:18px; padding:14px 16px; cursor:pointer;
  animation:cardStagger .3s ease; transition:transform .12s ease, box-shadow .12s ease;
}
.card:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(36,32,30,.08);}
.card-title{font-size:13px; font-weight:600; color:var(--n10); margin-bottom:8px; line-height:1.4;}
.card-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:3px 9px; border-radius:100px; background:var(--n2); color:var(--n7); border:1px solid var(--n1); font-weight:500;}
.tag.urgent{background:var(--n10); color:var(--n0); border-color:var(--n10);}
.avatar{
  width:22px; height:22px; border-radius:50%; background:var(--n1); color:var(--n8); font-size:9.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; margin-left:auto;
}
.priority-dot{width:6px; height:6px; border-radius:50%; background:var(--n5); flex-shrink:0;}
.priority-dot.high{background:var(--n10); animation:gentlePulse 1.6s ease-in-out infinite;}
.card-due{font-size:10.5px; color:var(--n6); margin-top:7px; display:flex; align-items:center; gap:4px;}

/* ── matrix-side region ── */
.matrix-side{width:280px; flex-shrink:0; display:flex; flex-direction:column; gap:16px;}
.matrix-panel{background:#fff; border:1px solid var(--n1); border-radius:28px; padding:20px;}
.matrix-panel-title{font-size:12.5px; font-weight:700; color:var(--n8); margin-bottom:12px; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:.03em;}
.matrix-item{
  display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--n2); font-size:12.5px;
}
.matrix-item:last-child{border-bottom:none;}
.matrix-item .org{font-weight:600; color:var(--n9); flex:1;}
.matrix-item .days{font-size:11px; color:var(--n7); font-weight:600;}
.status-strip{
  display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--n1); border-radius:100px;
  padding:9px 18px; margin-bottom:16px; width:fit-content;
}
.status-strip .live-dot{width:7px; height:7px; border-radius:50%; background:var(--s1); animation:gentlePulse 1.6s ease-in-out infinite;}
.status-strip span{font-size:12px; color:var(--n7);}
.status-strip b{color:var(--n10); font-weight:700;}

/* ── generic content card ── */
.pane{background:#fff; border:1px solid var(--n1); border-radius:32px; padding:30px; margin-bottom:20px;}
.pane-title{font-size:15px; font-weight:600; color:var(--n9); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.pane-sub{font-size:12.5px; color:var(--n7); margin-bottom:16px;}

/* ── master screen: tree table ── */
.spec-group{border:1px solid var(--n1); border-radius:14px; margin-bottom:10px; overflow:hidden;}
.spec-group-head{
  display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--n2); cursor:pointer;
}
.spec-group-head-left{display:flex; align-items:center; gap:10px;}
.spec-group-head-left i{transition:transform .18s ease; color:var(--n7);}
.spec-group-head-left i.open{transform:rotate(90deg);}
.spec-group-title{font-size:13.5px; font-weight:600; color:var(--n9);}
.spec-group-count{font-size:11.5px; color:var(--n7);}
.spec-items{padding:6px 18px 14px;}
.spec-row{
  display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--n2); font-size:12.5px;
}
.spec-row:last-child{border-bottom:none;}
.spec-row .code{font-family:ui-monospace,monospace; color:var(--n6); width:70px; flex-shrink:0;}
.spec-row .name{flex:1; color:var(--n9); font-weight:500;}
.badge-mandatory{font-size:10.5px; padding:2px 8px; border-radius:100px; background:var(--n10); color:var(--n0); font-weight:600;}
.badge-optional{font-size:10.5px; padding:2px 8px; border-radius:100px; background:var(--n2); color:var(--n7); border:1px solid var(--n1);}
.upload-progress{
  height:6px; border-radius:100px; background:var(--n2); overflow:hidden; margin-top:10px;
}
.upload-progress-bar{height:100%; background:var(--m600); border-radius:100px; animation:barGrow 1.4s ease forwards;}

/* ── billing table ── */
.data-table{width:100%; border-collapse:collapse;}
.data-table th{
  text-align:left; font-size:10.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.04em;
  padding:10px 14px; border-bottom:1px solid var(--n1);
}
.data-table td{padding:13px 14px; font-size:12.5px; color:var(--n8); border-bottom:1px solid var(--n2);}
.data-table tr:hover td{background:var(--n2);}
.badge{font-size:11px; padding:3px 10px; border-radius:100px; font-weight:600; display:inline-flex; align-items:center; gap:5px;}
.badge.done{background:var(--s1-bg); color:var(--s1-text);}
.badge.pending{background:var(--n2); color:var(--n7);}
.badge.progress{background:var(--m50); color:var(--m700);}
.badge.warn{background:var(--s3-bg); color:var(--s3-text);}
.badge.blocked{background:var(--n10); color:var(--n0);}

/* ── audit ── */
.role-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;}
.role-card{border:1px solid var(--n1); border-radius:16px; padding:18px;}
.role-card-name{font-size:13.5px; font-weight:700; color:var(--n9); margin-bottom:3px;}
.role-card-desc{font-size:11.5px; color:var(--n7); margin-bottom:12px; line-height:1.5;}
.acct-row{display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--n2); font-size:12px;}
.acct-row:first-of-type{border-top:none;}
.acct-row .name{flex:1; color:var(--n9); font-weight:500;}
.toggle{
  width:34px; height:19px; border-radius:100px; background:var(--n3); position:relative; transition:background .15s ease; flex-shrink:0;
}
.toggle.on{background:var(--m600);}
.toggle::after{
  content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff;
  transition:transform .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after{transform:translateX(15px);}

/* ── toast / modal ── */
.toast-wrap{position:fixed; bottom:26px; right:26px; z-index:100; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--n10); color:var(--n0); padding:12px 18px; border-radius:100px; font-size:12.5px;
  display:flex; align-items:center; gap:9px; animation:toastSlide .25s ease; box-shadow:0 10px 26px rgba(0,0,0,.22);
}
.modal-overlay{position:fixed; inset:0; background:rgba(36,32,30,.42); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{
  background:#fff; border-radius:24px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
  animation:modalPop .18s ease; padding:26px;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:16px; font-weight:600; color:var(--n10);}
.modal-close{color:var(--n7); font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--n1); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--n9); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--m600);}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

@media (max-width: 1100px){
  .board-wrap{flex-direction:column;}
  .matrix-side{width:100%; flex-direction:row; overflow-x:auto;}
  .role-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const STATE_ORDER = ['접수','검토중','보완요청','분석중','분석완료'];
const STATE_COLOR = {'접수':'#989290','검토중':'#a8492b','보완요청':'#242424','분석중':'#a8492b','분석완료':'#1f894b'};

const CARDS = [
  {id:'FA-260907-0182', org:'대한푸드시스템', sample:'즉석섭취식품(김밥)', status:'분석중', manager:'김도윤', due:'D-2', urgent:true, tags:['자가품질검사']},
  {id:'FA-260907-0176', org:'경인제과', sample:'초코쿠키 반제품', status:'분석중', manager:'오세훈', due:'D-4', urgent:false, tags:['자가품질검사']},
  {id:'FA-260907-0181', org:'청담베이커리', sample:'생크림 케이크', status:'보완요청', manager:'정민재', due:'D-1', urgent:true, tags:['보완지연 2일']},
  {id:'FA-260907-0180', org:'산야농산영농조합', sample:'건조 표고버섯', status:'검토중', manager:'김도윤', due:'D-5', urgent:false, tags:['이화학분석']},
  {id:'FA-260907-0178', org:'푸른들유업', sample:'저지방 요구르트', status:'접수', manager:'미배정', due:'D-7', urgent:false, tags:['담당자 미배정']},
  {id:'FA-260907-0174', org:'한들축산', sample:'냉장 수제소시지', status:'접수', manager:'미배정', due:'D-6', urgent:false, tags:['담당자 미배정']},
  {id:'FA-260907-0179', org:'미소식품', sample:'즉석 어묵탕 밀키트', status:'분석완료', manager:'오세훈', due:'완료', urgent:false, tags:['성적서 대기']},
  {id:'FA-260907-0177', org:'해담수산', sample:'냉동 손질 고등어', status:'분석완료', manager:'정민재', due:'완료', urgent:false, tags:['성적서 대기']},
  {id:'FA-260907-0175', org:'담다식품', sample:'양념 갈비 소스', status:'분석완료', manager:'김도윤', due:'완료', urgent:false, tags:['성적서 대기']},
];

const URGENT_LIST = CARDS.filter(c => c.urgent || c.status==='보완요청');

function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t => <div className="toast" key={t.id}><i data-lucide="check-circle" style={{width:15,height:15}}></i>{t.msg}</div>)}</div>;
}

function Modal({title, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><i data-lucide="x" style={{width:18,height:18}}></i></button></div>
        {children}
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

const NAV_ITEMS = [
  {key:'board', label:'분석 진행 워크플로우 보드'},
  {key:'master', label:'식품규격·시험항목 마스터 관리'},
  {key:'billing', label:'정산 및 세금계산서 상태관리'},
  {key:'audit', label:'권한 관리 및 감사이력'},
];

function TopNav({view, setView, notify}){
  return (
    <header className="topnav">
      <div className="tn-brand">
        <div className="tn-mark"><i data-lucide="flask-conical" style={{width:18,height:18}}></i></div>
        <div>
          <div className="tn-brand-text">푸드세이프 옵스</div>
          <div className="tn-brand-sub">Operations Platform</div>
        </div>
      </div>
      <nav className="tn-tabs">
        {NAV_ITEMS.map(n => (
          <button key={n.key} className={"tn-tab"+(view===n.key?' active':'')} onClick={()=>setView(n.key)}>{n.label}</button>
        ))}
      </nav>
      <div className="tn-actions">
        <button className="pill-btn ghost sm" onClick={()=>notify('새로운 알림이 없습니다')}><i data-lucide="bell" style={{width:14,height:14}}></i></button>
        <button className="pill-btn black sm" onClick={()=>notify('경영지원 · 이수진 계정으로 접속 중입니다')}>경영지원 · 이수진</button>
      </div>
    </header>
  );
}

function BoardScreen({notify}){
  const [filter, setFilter] = useState('전체');
  const [cards, setCards] = useState(CARDS);
  const [dragId, setDragId] = useState(null);

  function moveCard(id, to){
    setCards(cs => cs.map(c => c.id===id ? {...c, status:to} : c));
    notify(`${id} 카드가 "${to}" 컬럼으로 이동되었습니다`);
  }

  const columns = STATE_ORDER.map(st => ({st, items: cards.filter(c => c.status===st && (filter==='전체'||c.tags.includes(filter)||(filter==='마감임박'&&c.urgent)))}));

  return (
    <div className="page">
      <div className="hero-wash"></div>
      <div className="page-head">
        <div>
          <div className="page-title">분석 진행 워크플로우 보드</div>
          <div className="page-desc">의뢰 건을 상태별 컬럼에서 관리하고, 카드를 드래그해 상태를 전환합니다. 우측 패널에서 마감 임박·보완 지연 건을 우선 확인합니다.</div>
        </div>
        <button className="pill-btn blue" onClick={()=>notify('신규 의뢰 카드가 접수 컬럼에 추가되었습니다')}><i data-lucide="plus" style={{width:14,height:14}}></i>새 의뢰 카드</button>
      </div>

      <div className="status-strip"><span className="live-dot"></span><span>실시간 처리 현황 · 오늘 접수 <b>6건</b> · 진행중 <b>{cards.filter(c=>c.status==='분석중'||c.status==='검토중').length}건</b> · 마감임박 <b>{URGENT_LIST.length}건</b></span></div>

      <div className="board-header">
        <div className="board-header-left">
          <span className="board-title">전체 보드</span>
          <div className="board-filter">
            {['전체','마감임박'].map(f => <button key={f} className={"chip"+(filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>)}
          </div>
        </div>
      </div>

      <div data-archetype="kanban-board" className="board-wrap">
        <div className="board">
          {columns.map(col => (
            <section className="column" key={col.st}>
              <div className="col-header">
                <div className="col-header-label"><span className="col-dot" style={{background:STATE_COLOR[col.st]}}></span>{col.st}</div>
                <span className="count">{col.items.length}</span>
              </div>
              {col.items.map(c => (
                <div className="card" key={c.id} draggable onDragStart={()=>setDragId(c.id)} onDragOver={e=>e.preventDefault()}
                     onDrop={()=>{ const nextIdx = STATE_ORDER.indexOf(col.st); if(nextIdx < STATE_ORDER.length-1 && dragId) moveCard(dragId, STATE_ORDER[nextIdx]); }}
                     onClick={()=>{ const nextIdx = STATE_ORDER.indexOf(c.status); if(nextIdx < STATE_ORDER.length-1) moveCard(c.id, STATE_ORDER[nextIdx+1]); }}>
                  <div className="card-title">{c.org}<br/><span style={{fontWeight:400, color:'var(--n7)', fontSize:11.5}}>{c.sample}</span></div>
                  <div className="card-meta">
                    {c.tags.map(t => <span className={"tag"+(t.includes('지연')?' urgent':'')} key={t}>{t}</span>)}
                    <div className="avatar">{c.manager==='미배정' ? '–' : c.manager[0]}</div>
                  </div>
                  <div className="card-due"><span className={"priority-dot"+(c.urgent?' high':'')}></span>{c.due} · {c.manager}</div>
                </div>
              ))}
              {col.items.length===0 && <div style={{fontSize:11.5, color:'var(--n6)', textAlign:'center', padding:'14px 0'}}>카드 없음</div>}
            </section>
          ))}
        </div>

        <aside className="matrix-side">
          <div className="matrix-panel">
            <div className="matrix-panel-title"><i data-lucide="git-branch" style={{width:14,height:14}}></i>처리 파이프라인</div>
            <svg width="100%" height="72" viewBox="0 0 240 72" fill="none">
              <path d="M28 36 C 60 36, 60 16, 92 16" stroke="var(--n4)" strokeWidth="1.5" fill="none"/>
              <path d="M28 36 C 60 36, 60 56, 92 56" stroke="var(--n4)" strokeWidth="1.5" fill="none"/>
              <path d="M92 16 C 120 16, 120 36, 148 36" stroke="var(--n4)" strokeWidth="1.5" fill="none"/>
              <path d="M92 56 C 120 56, 120 36, 148 36" stroke="var(--n4)" strokeWidth="1.5" fill="none"/>
              <path d="M148 36 L 208 36" stroke="var(--n4)" strokeWidth="1.5" fill="none"/>
              <circle cx="28" cy="36" r="9" fill="var(--n1)" stroke="var(--n5)" strokeWidth="1.5"/>
              <circle cx="92" cy="16" r="7" fill="var(--n1)" stroke="var(--n5)" strokeWidth="1.5"/>
              <circle cx="92" cy="56" r="7" fill="var(--n1)" stroke="var(--m600)" strokeWidth="1.5"/>
              <circle cx="148" cy="36" r="8" fill="var(--m50)" stroke="var(--m600)" strokeWidth="1.5"/>
              <circle cx="212" cy="36" r="9" fill="var(--n10)" stroke="var(--n10)" strokeWidth="1.5"/>
            </svg>
          </div>
          <div className="matrix-panel">
            <div className="matrix-panel-title"><i data-lucide="alert-triangle" style={{width:14,height:14}}></i>우선 대응 큐</div>
            {URGENT_LIST.map(u => (
              <div className="matrix-item" key={u.id}>
                <span className="priority-dot high"></span>
                <span className="org">{u.org}</span>
                <span className="days">{u.due}</span>
              </div>
            ))}
          </div>
          <div className="matrix-panel">
            <div className="matrix-panel-title"><i data-lucide="users" style={{width:14,height:14}}></i>담당자별 처리 현황</div>
            {['김도윤','오세훈','정민재'].map(m => {
              const cnt = cards.filter(c=>c.manager===m && c.status!=='분석완료').length;
              return (
                <div className="matrix-item" key={m}>
                  <div className="avatar" style={{marginLeft:0}}>{m[0]}</div>
                  <span className="org">{m} 연구원</span>
                  <span className="days">{cnt}건</span>
                </div>
              );
            })}
          </div>
        </aside>
      </div>
    </div>
  );
}

const SPEC_MASTER = [
  {group:'즉석섭취식품', items:[
    {code:'T-101', name:'대장균군', mandatory:true},
    {code:'T-102', name:'세균수', mandatory:true},
    {code:'T-103', name:'타르색소', mandatory:false},
  ]},
  {group:'빵류·과자류', items:[
    {code:'T-201', name:'세균수', mandatory:true},
    {code:'T-202', name:'대장균', mandatory:true},
    {code:'T-203', name:'보존료', mandatory:false},
  ]},
  {group:'발효유류', items:[
    {code:'T-301', name:'대장균군', mandatory:true},
    {code:'T-302', name:'유산균수', mandatory:false},
  ]},
];

function MasterScreen({notify}){
  const [open, setOpen] = useState({'즉석섭취식품':true});
  const [uploading, setUploading] = useState(false);
  const [items, setItems] = useState(SPEC_MASTER);

  function toggleMandatory(group, code){
    const target = items.find(g=>g.group===group).items.find(i=>i.code===code);
    if(target.mandatory){ notify('의무 시험항목은 삭제할 수 없습니다 — 선택항목으로 전환 후 처리하세요'); return; }
    setItems(list => list.map(g => g.group===group ? {...g, items: g.items.filter(i=>i.code!==code)} : g));
    notify(`${code} 시험항목이 사용중지 처리되었습니다`);
  }
  function uploadExcel(){
    setUploading(true);
    setTimeout(()=>{ setUploading(false); notify('Excel 일괄등록이 완료되었습니다 (검증 오류 0건)'); }, 1500);
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-title">식품규격·시험항목 마스터 관리</div>
          <div className="page-desc">식품군·식품유형별 규격과 연결된 시험항목을 관리합니다. 의무 항목은 삭제가 차단되며, 접수된 의뢰의 스냅샷에는 영향을 주지 않습니다.</div>
        </div>
        <button className="pill-btn blue" onClick={uploadExcel}><i data-lucide="upload" style={{width:14,height:14}}></i>Excel 일괄등록</button>
      </div>

      {uploading && (
        <div className="pane">
          <div className="pane-title"><i data-lucide="loader" style={{width:15,height:15}}></i>업로드 처리 중…</div>
          <div className="upload-progress"><div className="upload-progress-bar" style={{'--w':'100%'}}></div></div>
        </div>
      )}

      <div className="pane">
        <div className="pane-title">규격 · 시험항목 매핑</div>
        <div className="pane-sub">규격을 펼쳐 연결된 시험항목과 의무/선택 여부를 확인합니다</div>
        {items.map(g => (
          <div className="spec-group" key={g.group}>
            <div className="spec-group-head" onClick={()=>setOpen(o=>({...o, [g.group]:!o[g.group]}))}>
              <div className="spec-group-head-left">
                <i data-lucide="chevron-right" className={open[g.group]?'open':''} style={{width:15,height:15}}></i>
                <span className="spec-group-title">{g.group}</span>
              </div>
              <span className="spec-group-count">{g.items.length}개 시험항목</span>
            </div>
            {open[g.group] && (
              <div className="spec-items">
                {g.items.map(i => (
                  <div className="spec-row" key={i.code}>
                    <span className="code">{i.code}</span>
                    <span className="name">{i.name}</span>
                    {i.mandatory ? <span className="badge-mandatory">의무</span> : <span className="badge-optional">선택</span>}
                    <button className="pill-btn ghost sm" onClick={()=>toggleMandatory(g.group, i.code)}>사용중지</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

const BILLING_ROWS = [
  {id:'FA-260907-0179', org:'미소식품', pay:'입금확인', tax:'발행완료', exception:false, releasable:true},
  {id:'FA-260907-0177', org:'해담수산', pay:'미입금', tax:'발행요청', exception:false, releasable:false},
  {id:'FA-260907-0175', org:'담다식품', pay:'미입금', tax:'처리중', exception:true, releasable:true},
  {id:'FA-260907-0170', org:'경인제과', pay:'입금확인', tax:'발행완료', exception:false, releasable:true},
];

function BillingScreen({notify}){
  const [rows, setRows] = useState(BILLING_ROWS);
  const [approveTarget, setApproveTarget] = useState(null);
  const [approver, setApprover] = useState('이수진');
  const [reason, setReason] = useState('');

  function approve(){
    setRows(rs => rs.map(r => r.id===approveTarget.id ? {...r, exception:true, releasable:true} : r));
    notify(`${approveTarget.org} 예외승인 처리 — 승인자·사유가 감사 이력에 기록되었습니다`);
    setApproveTarget(null); setReason('');
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-title">정산 및 세금계산서 상태관리</div>
          <div className="page-desc">입금확인과 세금계산서 상태를 관리하고, 사전 승인 거래처는 예외승인으로 성적서 전달을 허용합니다.</div>
        </div>
      </div>
      <div className="pane">
        <table className="data-table">
          <thead><tr><th>접수번호</th><th>기관명</th><th>입금상태</th><th>세금계산서</th><th>성적서 전달</th><th></th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id}>
                <td style={{fontFamily:'ui-monospace,monospace', fontSize:11.5}}>{r.id}</td>
                <td>{r.org}</td>
                <td>{r.pay==='입금확인' ? <span className="badge done">입금확인</span> : <span className="badge pending">미입금</span>}</td>
                <td>
                  {r.tax==='발행완료' && <span className="badge done">발행완료</span>}
                  {r.tax==='처리중' && <span className="badge progress">처리중</span>}
                  {r.tax==='발행요청' && <span className="badge pending">발행요청</span>}
                </td>
                <td>{r.releasable ? <span className="badge done">전달 가능</span> : <span className="badge blocked">전달 차단</span>}
                  {r.exception && <span className="badge warn" style={{marginLeft:6}}>예외승인</span>}
                </td>
                <td>{!r.releasable && <button className="pill-btn ghost sm" onClick={()=>setApproveTarget(r)}>예외승인</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {approveTarget && (
        <Modal title="관리자 예외승인" onClose={()=>setApproveTarget(null)} footer={
          <React.Fragment>
            <button className="pill-btn ghost" onClick={()=>setApproveTarget(null)}>취소</button>
            <button className="pill-btn blue" onClick={approve}>승인 처리</button>
          </React.Fragment>
        }>
          <p style={{fontSize:12.5, color:'var(--n7)', marginBottom:16}}>{approveTarget.org} ({approveTarget.id}) — 입금확인 없이 성적서 전달을 승인합니다.</p>
          <div className="field"><label>승인자</label><input value={approver} onChange={e=>setApprover(e.target.value)} /></div>
          <div className="field"><label>승인 사유</label><textarea placeholder="사전 승인 거래처 계약 조건에 따른 승인" value={reason} onChange={e=>setReason(e.target.value)} style={{minHeight:70}}></textarea></div>
        </Modal>
      )}
    </div>
  );
}

const ACCOUNTS = {
  '전체관리자':[{name:'이수진', active:true},{name:'박준혁', active:true}],
  '분석담당자':[{name:'김도윤', active:true},{name:'오세훈', active:true},{name:'정민재', active:false}],
  '경영지원':[{name:'최유리', active:true}],
};
const AUDIT_LOG = [
  {who:'이수진', action:'예외승인 처리', target:'담다식품 (FA-260907-0175)', before:'전달차단', after:'전달가능', time:'2026.09.07 11:20'},
  {who:'김도윤', action:'상태 변경', target:'FA-260907-0182', before:'검토중', after:'분석중', time:'2026.09.07 10:05'},
  {who:'정민재', action:'시험항목 조정', target:'T-203 보존료', before:'사용', after:'사용중지', time:'2026.09.06 16:44'},
  {who:'system', action:'계정 정지', target:'정민재 (분석담당자)', before:'활성', after:'정지 요청', time:'2026.09.06 09:12'},
];

function AuditScreen({notify}){
  const [accounts, setAccounts] = useState(ACCOUNTS);
  function toggle(role, name){
    setAccounts(a => ({...a, [role]: a[role].map(m => m.name===name ? {...m, active:!m.active} : m)}));
    notify(`${name} 계정이 ${accounts[role].find(m=>m.name===name).active ? '정지' : '활성화'} 처리되었습니다`);
  }
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-title">권한 관리 및 감사이력</div>
          <div className="page-desc">역할별 개인 계정을 관리하고, 로그인·상태변경·권한변경 등 중요 이력을 변경 전후값과 함께 확인합니다.</div>
        </div>
      </div>
      <div className="role-grid">
        {Object.entries(accounts).map(([role, members]) => (
          <div className="role-card" key={role} style={{borderRadius:'24px'}}>
            <div className="role-card-name">{role}</div>
            <div className="role-card-desc">{role==='전체관리자' ? '전 메뉴 접근 및 계정 관리 권한' : role==='분석담당자' ? '의뢰·분석 처리, 성적서 등록 권한' : '정산 조회 및 승인 권한 (분석 상태 변경 불가)'}</div>
            {members.map(m => (
              <div className="acct-row" key={m.name}>
                <div className="avatar" style={{marginLeft:0}}>{m.name[0]}</div>
                <span className="name">{m.name}</span>
                <div className={"toggle"+(m.active?' on':'')} onClick={()=>toggle(role, m.name)}></div>
              </div>
            ))}
          </div>
        ))}
      </div>

      <div className="pane">
        <div className="pane-title"><i data-lucide="history" style={{width:15,height:15}}></i>중요 이력 감사 로그</div>
        <table className="data-table">
          <thead><tr><th>수행자</th><th>액션</th><th>대상</th><th>변경 전</th><th>변경 후</th><th>일시</th></tr></thead>
          <tbody>
            {AUDIT_LOG.map((l,i) => (
              <tr key={i}>
                <td>{l.who}</td><td>{l.action}</td><td>{l.target}</td>
                <td style={{color:'var(--n6)'}}>{l.before}</td>
                <td style={{fontWeight:600, color:'var(--n9)'}}>{l.after}</td>
                <td style={{color:'var(--n6)', fontSize:11.5}}>{l.time}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('board');
  const [toasts, setToasts] = useState([]);

  function notify(msg){
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(()=>setToasts(t => t.filter(x=>x.id!==id)), 2800);
  }

  useEffect(()=>{ lucide.createIcons(); });

  return (
    <div className="shell">
      <TopNav view={view} setView={setView} notify={notify} />
      {view==='board' && <BoardScreen notify={notify} />}
      {view==='master' && <MasterScreen notify={notify} />}
      {view==='billing' && <BillingScreen notify={notify} />}
      {view==='audit' && <AuditScreen notify={notify} />}
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
