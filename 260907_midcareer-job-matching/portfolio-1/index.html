<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>허브잡 — 중장년 통합 구인구직 매칭 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
#root{width:100%;}
a{text-decoration:none;color:inherit;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes drawerSlideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes spinLoad{to{transform:rotate(360deg);}}
@keyframes chipPop{0%{transform:scale(1);}45%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ── 레이아웃 골격 ── */
.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* ── 검색 헤더 (airbnb-search-grid 시그니처 1) ── */
.search-header{position:sticky;top:0;z-index:30;width:100%;background:var(--n1);border-bottom:1px solid var(--n3);}
.header-row{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:16px 32px;}
.brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;color:var(--n9);letter-spacing:-0.02em;flex-shrink:0;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;}
.search-bar{flex:1;display:flex;align-items:center;background:var(--n0);border:1px solid var(--n3);border-radius:9999px;padding:6px 8px;max-width:640px;box-shadow:0 4px 10px rgba(11,53,88,0.04);}
.search-segment{flex:1;display:flex;flex-direction:column;padding:6px 18px;border:none;background:transparent;border-radius:9999px;text-align:left;transition:background .15s;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:11px;font-weight:700;color:var(--n9);}
.segment-value{font-size:12.5px;color:var(--n7);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-divider{width:1px;height:26px;background:var(--n4);flex-shrink:0;}
.search-submit{width:40px;height:40px;border-radius:50%;background:var(--m600);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px;transition:background .15s;}
.search-submit:hover{background:var(--m700);}
.header-nav{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.nav-link{padding:9px 14px;border-radius:9999px;border:none;background:transparent;color:var(--n7);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s;}
.nav-link:hover{background:var(--n2);color:var(--n9);}
.nav-link.active{background:var(--m50);color:var(--m700);}
.user-menu{width:38px;height:38px;border-radius:50%;background:var(--n2);border:1px solid var(--n3);display:flex;align-items:center;justify-content:center;color:var(--n7);margin-left:4px;flex-shrink:0;}

/* ── 필터 칩 (시그니처 2) ── */
.filter-chips{max-width:1280px;margin:0 auto;display:flex;gap:8px;padding:12px 32px 16px;overflow-x:auto;}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);color:var(--n8);font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s;}
.chip:hover{border-color:var(--n6);}
.chip.active{background:var(--m600);border-color:var(--m600);color:#fff;animation:chipPop .3s ease;}

/* ── 히어로 밴드 ── */
.hero-band{max-width:1280px;margin:0 auto;width:100%;padding:28px 32px 4px;position:relative;}
.hero-band h1{font-size:44px;line-height:1.22;font-weight:700;color:var(--n9);margin:0 0 8px;letter-spacing:-0.015em;max-width:680px;}
.hero-band p{font-size:15px;color:var(--n7);margin:0;max-width:560px;line-height:1.6;}
.hero-glow{position:absolute;top:-40px;right:32px;width:280px;height:180px;border-radius:50%;background:radial-gradient(closest-side, color-mix(in srgb, var(--m600) 16%, transparent), transparent);pointer-events:none;z-index:0;}

/* ── 카드 그리드 (시그니처 2) ── */
.main{width:100%;flex:1;}
.grid-wrap{max-width:1280px;margin:0 auto;padding:8px 32px 64px;}
.result-count{font-size:13px;color:var(--n7);margin:8px 0 16px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.listing-card{background:var(--n1);border:1px solid var(--n3);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fadeInUp .4s ease both;}
.listing-card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(11,53,88,0.10);}
.card-image-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--n2);}
.card-image{width:100%;height:100%;object-fit:cover;display:block;}
.card-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;}
.badge-neutral{padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;background:var(--n1);color:var(--n8);border:1px solid var(--n4);}
.badge-neutral.filled{background:var(--n9);color:var(--n1);border-color:var(--n9);}
.card-fav{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.92);border:none;display:flex;align-items:center;justify-content:center;color:var(--n8);font-size:14px;}
.card-body{padding:16px 18px 18px;}
.card-row-1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-size:16px;font-weight:700;color:var(--n9);margin:0;line-height:1.35;}
.card-meta{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--n7);margin-top:6px;}
.card-price{font-size:17px;font-weight:700;color:var(--n9);margin-top:10px;}
.card-price span{font-size:12px;font-weight:500;color:var(--n6);margin-left:3px;}
.card-cta{width:100%;margin-top:12px;padding:9px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);color:var(--n8);font-size:12.5px;font-weight:700;}
.card-cta:hover{background:var(--n2);}

/* ── 퀵뷰 드로어 (시그니처 3) ── */
.overlay{position:fixed;inset:0;background:rgba(20,25,30,0.42);z-index:60;display:flex;justify-content:flex-end;animation:fadeIn .2s ease;}
.quick-view{width:440px;max-width:92vw;height:100%;background:var(--n1);box-shadow:-16px 0 40px rgba(11,53,88,0.16);animation:drawerSlideIn .28s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;}
.qv-header{padding:20px 22px;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:flex-start;}
.qv-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--n2);color:var(--n8);flex-shrink:0;}
.qv-body{padding:20px 22px;overflow-y:auto;flex:1;}
.qv-image{width:100%;aspect-ratio:16/9;border-radius:16px;object-fit:cover;margin-bottom:16px;}
.qv-title{font-size:21px;font-weight:700;color:var(--n9);margin:0 0 6px;}
.qv-org{font-size:13.5px;color:var(--n7);margin-bottom:14px;}
.qv-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:var(--n0);border-radius:14px;margin-bottom:16px;}
.qv-fact-label{font-size:11px;color:var(--n6);font-weight:600;}
.qv-fact-value{font-size:14px;color:var(--n9);font-weight:700;margin-top:2px;}
.qv-section-title{font-size:13px;font-weight:700;color:var(--n9);margin:18px 0 8px;}
.qv-desc{font-size:13.5px;color:var(--n8);line-height:1.7;}
.qv-footer{padding:18px 22px;border-top:1px solid var(--n3);}
.btn-primary{width:100%;padding:14px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:15px;font-weight:700;transition:background .15s;}
.btn-primary:hover{background:var(--m700);}
.btn-outline{padding:10px 16px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);color:var(--n8);font-size:13px;font-weight:700;}
.btn-outline:hover{background:var(--n2);}

/* ── 공용 섹션 헤더 ── */
.section-wrap{max-width:1000px;margin:0 auto;padding:36px 32px 64px;}
.section-title{font-size:26px;font-weight:700;color:var(--n9);margin:0 0 6px;}
.section-sub{font-size:14px;color:var(--n7);margin:0 0 28px;}

/* ── AI 이력서 (resume) ── */
.step-track{display:flex;gap:8px;margin-bottom:28px;}
.step-dot{flex:1;height:6px;border-radius:9999px;background:var(--n3);}
.step-dot.done,.step-dot.current{background:var(--m600);}
.resume-card{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:28px;}
.field-label{font-size:13.5px;font-weight:700;color:var(--n9);margin-bottom:8px;display:block;}
.field-input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--n4);font-size:15px;font-family:inherit;color:var(--n9);margin-bottom:18px;}
.field-input:focus{outline:2px solid var(--m300);border-color:var(--m600);}
textarea.field-input{resize:vertical;min-height:110px;line-height:1.6;}
.ai-assist-box{background:var(--n0);border:1px dashed var(--n4);border-radius:14px;padding:16px;margin-bottom:18px;}
.ai-assist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ai-assist-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9999px;border:1px solid var(--m600);background:var(--m50);color:var(--m700);font-size:13px;font-weight:700;}
.ai-assist-btn:hover{background:var(--m100);}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--n7);font-size:13px;}
.ai-suggestion{margin-top:12px;padding:12px 14px;background:var(--n1);border:1px solid var(--n3);border-radius:10px;font-size:13.5px;color:var(--n8);line-height:1.6;}
.step-actions{display:flex;justify-content:space-between;margin-top:24px;}

/* ── 고용주 지원자 관리 (employer) ── */
.applicant-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.applicant-col-head{font-size:12.5px;font-weight:700;color:var(--n7);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.applicant-col-count{background:var(--n2);color:var(--n8);border-radius:9999px;padding:1px 8px;font-size:11px;}
.applicant-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s;}
.applicant-card:hover{box-shadow:0 8px 18px rgba(11,53,88,0.08);}
.applicant-card.selected{border-color:var(--m600);background:var(--m50);}
.app-name-row{display:flex;justify-content:space-between;align-items:center;}
.app-name{font-size:14.5px;font-weight:700;color:var(--n9);}
.app-avatar{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.app-meta{font-size:12px;color:var(--n7);margin-top:6px;}
.app-actions{display:flex;gap:6px;margin-top:12px;}
.app-btn{flex:1;padding:7px;border-radius:8px;font-size:11.5px;font-weight:700;border:1px solid var(--n4);background:var(--n1);color:var(--n8);}
.app-btn.confirm{background:var(--s1-bg);border-color:var(--s1);color:var(--s1-text);}
.compare-panel{margin-top:20px;background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px;}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:12px;}
.compare-cell{background:var(--n0);border-radius:12px;padding:12px;}

/* ── 상호 평가 (review) ── */
.review-tabs{display:flex;gap:8px;margin-bottom:20px;}
.review-tab{padding:9px 16px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);color:var(--n8);font-size:13px;font-weight:700;}
.review-tab.active{background:var(--n9);color:var(--n1);border-color:var(--n9);}
.review-item{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
.review-stars{color:var(--m600);font-size:14px;letter-spacing:2px;}
.review-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.review-tag{padding:4px 10px;border-radius:9999px;background:var(--n2);color:var(--n7);font-size:11.5px;font-weight:600;}
.write-review-btn{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:9999px;border:none;background:var(--m600);color:#fff;font-size:13.5px;font-weight:700;}
.write-review-btn:hover{background:var(--m700);}
.star-picker{display:flex;gap:6px;margin:8px 0 16px;}
.star-btn{font-size:26px;background:none;border:none;color:var(--n4);padding:0;}
.star-btn.filled{color:var(--m600);}

/* ── 모달 (리뷰 작성) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,30,0.42);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
.modal-box{width:460px;max-width:100%;background:var(--n1);border-radius:20px;padding:26px;animation:fadeInUp .25s ease;}
.modal-title{font-size:18px;font-weight:700;color:var(--n9);margin:0 0 16px;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--n9);color:var(--n1);padding:13px 22px;border-radius:9999px;font-size:13.5px;font-weight:600;z-index:90;display:flex;align-items:center;gap:8px;animation:toastSlide .25s ease;}

.footer{width:100%;background:var(--n1);border-top:1px solid var(--n3);padding:32px;}
.footer-cols{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.footer-col h4{font-size:12px;color:var(--n7);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
.footer-col a{display:block;font-size:13px;color:var(--n8);margin-bottom:8px;}
.footer-bottom{max-width:1280px;margin:20px auto 0;padding-top:16px;border-top:1px solid var(--n3);font-size:12px;color:var(--n6);}

@media (max-width:860px){
  .header-row{flex-wrap:wrap;}
  .search-bar{order:3;max-width:100%;}
  .header-nav{display:none;}
  .applicant-cols{grid-template-columns:1fr;}
}
</style>
</head>

<div id="root"></div>

];

const REVIEWS = [
  { id:1, from:'샘물시장상인회', rating:5, comment:'약속 시간을 정확히 지키고 고객 응대가 매끄러웠습니다.', tags:['시간 엄수','친절해요'] },
  { id:2, from:'행복구립도서관', rating:4, comment:'업무 습득이 빠르고 성실하게 임해주셨습니다.', tags:['재고용 의사 있음'] },
];

function Icon({ name, className }) {
  return <i className={`ti ti-${name} ${className||''}`}></i>;
}

function Header({ view, setView, filter, setFilter, onSearch }) {
  const navItems = [
    { key:'main', label:'일자리 통합 탐색' },
    { key:'resume', label:'AI 이력서 작성' },
    { key:'employer', label:'지원자 관리' },
    { key:'review', label:'상호 평가' },
  ];
  return (
    <div className="search-header">
      <div className="header-row">
        <div className="brand"><span className="brand-mark">허</span>허브잡</div>
        <div className="search-bar">
          <button className="search-segment" onClick={() => onSearch('직종')}>
            <span className="segment-label">직종</span>
            <span className="segment-value">전체 직종</span>
          </button>
          <div className="search-divider"></div>
          <button className="search-segment" onClick={() => onSearch('지역')}>
            <span className="segment-label">지역</span>
            <span className="segment-value">서울·경기·인천</span>
          </button>
          <div className="search-divider"></div>
          <button className="search-segment" onClick={() => onSearch('근무형태')}>
            <span className="segment-label">근무형태</span>
            <span className="segment-value">정규직 · 단기 근무</span>
          </button>
          <button className="search-submit" onClick={() => onSearch('검색')} title="검색"><Icon name="search" /></button>
        </div>
        <nav className="header-nav">
          {navItems.map(n => (
            <button key={n.key} className={`nav-link ${view===n.key?'active':''}`} onClick={() => setView(n.key)}>{n.label}</button>
          ))}
          <button className="user-menu" onClick={() => setView('employer')} title="내 정보"><Icon name="user" /></button>
        </nav>
      </div>
      <div className="filter-chips">
        <button className="chip" style={filter==='all' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('all'); setView('main'); }}>전체</button>
        <button className="chip" style={filter==='regular' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('regular'); setView('main'); }}>정규직</button>
        <button className="chip" style={filter==='shortterm' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('shortterm'); setView('main'); }}>단기직</button>
        <button className="chip" style={filter==='regular-public' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('regular-public'); setView('main'); }}>공공직</button>
        <button className="chip" style={filter==='regular-private' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('regular-private'); setView('main'); }}>일반직</button>
        <button className="chip" style={filter==='shortterm-ultra' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('shortterm-ultra'); setView('main'); }}>초단기</button>
        <button className="chip" style={filter==='shortterm-mid' ? {background:'var(--m600)',borderColor:'var(--m600)',color:'#fff',animation:'chipPop .3s ease'} : {}} onClick={() => { setFilter('shortterm-mid'); setView('main'); }}>중장기</button>
      </div>
    </div>
  );
}

function matchesFilter(job, filter) {
  if (filter === 'all') return true;
  if (filter === 'regular') return job.category.startsWith('regular');
  if (filter === 'shortterm') return job.category.startsWith('shortterm');
  return job.category === filter;
}

function MainView({ filter, onOpenJob }) {
  const list = JOBS.filter(j => matchesFilter(j, filter));
  return (
    <div className="main">
      <div className="hero-band">
        <div className="hero-glow"></div>
        <h1>당신에게 맞는 정규직과 단기 일자리를<br/>한 곳에서 찾아보세요</h1>
        <p>공공직·일반직 정규 채용부터 초단기·중장기 알바까지, 나이 제한 없이 지원할 수 있는 일자리를 통합 조회합니다.</p>
      </div>
      <div className="grid-wrap">
        <div className="result-count">총 {list.length}건의 일자리</div>
        <div className="card-grid">
          {list.map((job, idx) => (
            <article key={job.id} className="listing-card" style={{animationDelay:`${idx*0.04}s`}} onClick={() => onOpenJob(job)}>
              <div className="card-image-wrap">
                <img className="card-image" src={`https://picsum.photos/seed/midcareer-${job.img}/480/360`} alt={job.title} />
                <div className="card-badges">
                  <span className={`badge-neutral ${job.category.startsWith('regular')?'filled':''}`}>{job.badge}</span>
                </div>
                <button className="card-fav" onClick={(e) => { e.stopPropagation(); }} title="관심 등록"><Icon name="heart" /></button>
              </div>
              <div className="card-body">
                <div className="card-row-1">
                  <h3 className="card-title">{job.title}</h3>
                </div>
                <div className="card-meta"><Icon name="building" />{job.org}</div>
                <div className="card-meta"><Icon name="map-pin" />{job.location} · {job.deadline}</div>
                <div className="card-price">{job.salary}<span>{job.unit}</span></div>
                <button className="card-cta" onClick={(e) => { e.stopPropagation(); onOpenJob(job); }}>자세히 보기</button>
              </div>
            </article>
          ))}
        </div>
      </div>
    </div>
  );
}

function QuickView({ job, onClose, onApply }) {
  if (!job) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="quick-view" onClick={(e) => e.stopPropagation()}>
        <div className="qv-header">
          <div>
            <div className="qv-title">{job.title}</div>
            <div className="qv-org">{job.org}</div>
          </div>
          <button className="qv-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="qv-body">
          <img className="qv-image" src={`https://picsum.photos/seed/midcareer-${job.img}-wide/640/360`} alt="" />
          <div className="qv-facts">
            <div><div className="qv-fact-label">근무 형태</div><div className="qv-fact-value">{job.badge}</div></div>
            <div><div className="qv-fact-label">근무 지역</div><div className="qv-fact-value">{job.location}</div></div>
            <div><div className="qv-fact-label">급여</div><div className="qv-fact-value">{job.salary}{job.unit}</div></div>
            <div><div className="qv-fact-label">마감</div><div className="qv-fact-value">{job.deadline}</div></div>
          </div>
          <div className="qv-section-title">주요 업무</div>
          <div className="qv-desc">현장 안내 및 이용자 응대, 기본 서류 확인, 시설 순회 점검 등 체력 부담이 적은 업무 위주로 구성되어 있습니다. 첫 출근일 현장 오리엔테이션이 제공됩니다.</div>
          <div className="qv-section-title">우대 사항</div>
          <div className="qv-desc">유사 업무 경험자 우대, 인근 거주자 우대. 연령 제한 없음.</div>
        </div>
        <div className="qv-footer">
          <button className="btn-primary" onClick={() => onApply(job)}>이력서로 바로 지원하기</button>
        </div>
      </div>
    </div>
  );
}

function ResumeView({ showToast }) {
  const [step, setStep] = useState(1);
  const [loadingAI, setLoadingAI] = useState(false);
  const [suggestion, setSuggestion] = useState('');
  const runAI = () => {
    setLoadingAI(true);
    setSuggestion('');
    setTimeout(() => {
      setLoadingAI(false);
      setSuggestion('유통 매장에서 12년간 고객 응대와 재고 관리를 담당하며 반복 업무의 정확도를 높여왔습니다. 새로운 환경에도 빠르게 적응하며, 성실함을 바탕으로 맡은 역할을 끝까지 책임집니다.');
    }, 1400);
  };
  return (
    <div className="section-wrap">
      <div className="section-title">AI 이력서 작성</div>
      <div className="section-sub">3단계 스텝 폼으로 필수 정보만 입력하면, AI가 경력 문장을 함께 다듬어 드립니다.</div>
      <div className="step-track">
        <div className={`step-dot ${step>=1?'done':''}`}></div>
        <div className={`step-dot ${step>=2?'done':''} ${step===2?'current':''}`}></div>
        <div className={`step-dot ${step>=3?'current':''}`}></div>
      </div>
      <div className="resume-card">
        {step === 1 && (
          <div>
            <label className="field-label">이름</label>
            <input className="field-input" defaultValue="김명자" />
            <label className="field-label">연락처</label>
            <input className="field-input" defaultValue="010-1234-5678" />
            <label className="field-label">희망 근무 형태</label>
            <input className="field-input" defaultValue="정규직 (일반직)" />
          </div>
        )}
        {step === 2 && (
          <div>
            <label className="field-label">경력 요약</label>
            <textarea className="field-input" placeholder="예: 유통업, 고객응대, 12년"></textarea>
            <div className="ai-assist-box">
              <div className="ai-assist-row">
                <div style={{fontSize:'13px',color:'var(--n7)'}}>키워드만 입력해도 AI가 문장으로 완성해 드립니다.</div>
                {!loadingAI ? (
                  <button className="ai-assist-btn" onClick={runAI}><Icon name="sparkles" />AI로 문장 제안받기</button>
                ) : (
                  <div className="ai-loading"><Icon name="loader-2" className="ai-spin" />AI가 문장을 작성 중입니다...</div>
                )}
              </div>
              {suggestion && <div className="ai-suggestion">{suggestion}</div>}
            </div>
          </div>
        )}
        {step === 3 && (
          <div>
            <label className="field-label">자기소개</label>
            <textarea className="field-input" placeholder="간단한 자기소개를 입력해 주세요"></textarea>
            <label className="field-label">희망 근무 지역</label>
            <input className="field-input" defaultValue="서울 전역" />
          </div>
        )}
        <div className="step-actions">
          <button className="btn-outline" onClick={() => setStep(s => Math.max(1, s-1))} style={{visibility: step===1?'hidden':'visible'}}>이전</button>
          {step < 3 ? (
            <button className="btn-primary" style={{width:'auto',padding:'12px 28px'}} onClick={() => setStep(s => s+1)}>다음 단계</button>
          ) : (
            <button className="btn-primary" style={{width:'auto',padding:'12px 28px'}} onClick={() => showToast('이력서가 저장되었습니다')}>제출하기</button>
          )}
        </div>
      </div>
    </div>
  );
}

function EmployerView({ showToast }) {
  const [applicants, setApplicants] = useState(APPLICANTS);
  const [selected, setSelected] = useState([]);
  const cols = [
    { key:'new', label:'신규' },
    { key:'review', label:'검토중' },
    { key:'confirmed', label:'확정' },
  ];
  const toggleSelect = (id) => {
    setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  };
  const moveStatus = (id, status) => {
    setApplicants(list => list.map(a => a.id === id ? { ...a, status } : a));
    showToast(status === 'confirmed' ? '근로자가 확정되어 공고가 마감 처리되었습니다' : '검토중 상태로 이동했습니다');
  };
  const compareList = applicants.filter(a => selected.includes(a.id));
  return (
    <div className="section-wrap" style={{maxWidth:'1100px'}}>
      <div className="section-title">지원자 관리</div>
      <div className="section-sub">지원자 상태를 신규 → 검토중 → 확정 순서로 관리하고, 최대 4명까지 이력서를 나란히 비교할 수 있습니다.</div>
      <div className="applicant-cols">
        {cols.map(col => (
          <div key={col.key}>
            <div className="applicant-col-head">{col.label}<span className="applicant-col-count">{applicants.filter(a=>a.status===col.key).length}</span></div>
            {applicants.filter(a => a.status === col.key).map(a => (
              <div key={a.id} className={`applicant-card ${selected.includes(a.id)?'selected':''}`} onClick={() => toggleSelect(a.id)}>
                <div className="app-name-row">
                  <div className="app-avatar">{a.name[0]}</div>
                  <div style={{flex:1,marginLeft:'10px'}}>
                    <div className="app-name">{a.name} ({a.age})</div>
                  </div>
                </div>
                <div className="app-meta">{a.exp}</div>
                <div className="app-actions">
                  {col.key === 'new' && <button className="app-btn" onClick={(e) => { e.stopPropagation(); moveStatus(a.id,'review'); }}>검토중으로 이동</button>}
                  {col.key === 'review' && <button className="app-btn confirm" onClick={(e) => { e.stopPropagation(); moveStatus(a.id,'confirmed'); }}>확정</button>}
                  {col.key === 'confirmed' && <span className="app-meta" style={{color:'var(--s1-text)',fontWeight:700}}><Icon name="check" /> 근로 확정</span>}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
      {compareList.length >= 2 && (
        <div className="compare-panel">
          <div style={{fontWeight:700,fontSize:14}}>이력서 비교 ({compareList.length}명 선택됨)</div>
          <div className="compare-grid">
            {compareList.map(a => (
              <div key={a.id} className="compare-cell">
                <div style={{fontWeight:700,fontSize:13.5}}>{a.name}</div>
                <div style={{fontSize:12,color:'var(--n7)',marginTop:4}}>{a.exp}</div>
                <div style={{fontSize:12,color:'var(--n7)',marginTop:2}}>{a.age}세</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function ReviewView() {
  const [tab, setTab] = useState('received');
  const [showModal, setShowModal] = useState(false);
  const [rating, setRating] = useState(0);
  return (
    <div className="section-wrap">
      <div className="section-title">상호 평가</div>
      <div className="section-sub">근무가 종료된 건에 한해 구직자와 고용주가 서로를 평가하고, 누적 평가는 프로필 평판에 반영됩니다.</div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="review-tabs">
          <button className={`review-tab ${tab==='received'?'active':''}`} onClick={() => setTab('received')}>받은 평가</button>
          <button className={`review-tab ${tab==='given'?'active':''}`} onClick={() => setTab('given')}>내가 남긴 평가</button>
        </div>
        <button className="write-review-btn" onClick={() => setShowModal(true)}><Icon name="edit" />리뷰 작성</button>
      </div>
      {REVIEWS.map(r => (
        <div key={r.id} className="review-item">
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <div style={{fontWeight:700,fontSize:14}}>{r.from}</div>
            <div className="review-stars">{'★'.repeat(r.rating)}{'☆'.repeat(5-r.rating)}</div>
          </div>
          <div style={{fontSize:13.5,color:'var(--n8)',marginTop:8}}>{r.comment}</div>
          <div className="review-tags">{r.tags.map(t => <span key={t} className="review-tag">{t}</span>)}</div>
        </div>
      ))}
      {showModal && (
        <div className="modal-overlay" onClick={() => setShowModal(false)}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-title">근로자 평가 작성</div>
            <div className="star-picker">
              {[1,2,3,4,5].map(n => (
                <button key={n} className={`star-btn ${n<=rating?'filled':''}`} onClick={() => setRating(n)}>★</button>
              ))}
            </div>
            <textarea className="field-input" placeholder="평가 코멘트를 남겨주세요"></textarea>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn-outline" onClick={() => setShowModal(false)}>취소</button>
              <button className="btn-primary" style={{width:'auto',padding:'11px 24px'}} onClick={() => setShowModal(false)}>제출</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [filter, setFilter] = useState('all');
  const [job, setJob] = useState(null);
  const [toast, setToast] = useState('');

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2200);
  };
  const onSearch = () => showToast('검색 조건이 적용되었습니다');
  const onApply = () => {
    setJob(null);
    showToast('지원이 접수되었습니다. 고용주에게 이력서가 전달됩니다');
  };

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <Header view={view} setView={setView} filter={filter} setFilter={setFilter} onSearch={onSearch} />
      {view === 'main' && <MainView filter={filter} onOpenJob={setJob} />}
      {view === 'resume' && <ResumeView showToast={showToast} />}
      {view === 'employer' && <EmployerView showToast={showToast} />}
      {view === 'review' && <ReviewView />}
      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col"><h4>허브잡</h4><a href="#">서비스 소개</a><a href="#">이용약관</a></div>
          <div className="footer-col"><h4>구직자</h4><a href="#">정규직 탐색</a><a href="#">단기직 탐색</a></div>
          <div className="footer-col"><h4>고용주</h4><a href="#">공고 등록</a><a href="#">지원자 관리</a></div>
          <div className="footer-col"><h4>고객센터</h4><a href="#">자주 묻는 질문</a><a href="#">문의하기</a></div>
        </div>
        <div className="footer-bottom">© 2026 허브잡 — 자체 개발 프로젝트</div>
      </footer>
      <QuickView job={job} onClose={() => setJob(null)} onApply={onApply} />
      {toast && <div className="toast"><Icon name="circle-check" />{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<style>
.ai-spin{display:inline-block;animation:spinLoad 0.8s linear infinite;}
</style>
</body>
</html>
