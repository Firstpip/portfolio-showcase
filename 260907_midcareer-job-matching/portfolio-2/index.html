<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>허브잡 운영 관제 & 정산 콘솔</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 21°, light) ── */
:root{
  --m50:#fff3ed; --m100:#ffe8db; --m200:#ffd1b8; --m300:#ffb58c; --m400:#ff955c;
  --m500:#ff782e; --m600:#ff5a00; --m700:#d14a00; --m800:#a33a00; --m900:#732800;
  --n0:#f4f4f5; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#18181b; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n8);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
#root{width:100%;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes drawLine{from{stroke-dashoffset:600;}to{stroke-dashoffset:0;}}
@keyframes countUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}

.app{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* ── 상단 글로벌 내비 (시그니처 1) ── */
.app-header{position:sticky;top:0;z-index:30;width:100%;background:var(--n1);border-bottom:1px solid var(--n3);height:60px;display:flex;align-items:center;padding:0 28px;gap:20px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--n8);flex-shrink:0;}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--n8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--n3);background:var(--n0);font-size:12.5px;font-weight:600;color:var(--n7);flex-shrink:0;}
.global-nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;}
.nav-link{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:var(--n7);font-size:13px;font-weight:600;white-space:nowrap;}
.nav-link:hover{background:var(--n2);color:var(--n8);}
.nav-link.active{color:var(--m700);background:var(--m50);}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--n3);background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--n2);}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:var(--n8);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* ── 보조 탭 (시그니처 2) ── */
.tab-bar{width:100%;background:var(--n1);border-bottom:1px solid var(--n3);display:flex;gap:4px;padding:0 28px;}
.tab{padding:12px 16px;border:none;background:transparent;color:var(--n7);font-size:13px;font-weight:600;border-bottom:2px solid transparent;}
.tab:hover{color:var(--n8);}
.tab.active{color:var(--m700);border-bottom-color:var(--m600);}

/* ── 콘텐츠 (시그니처 3) ── */
.content{width:100%;flex:1;max-width:1280px;margin:0 auto;padding:28px;}
.page-head{margin-bottom:22px;}
.page-title{font-size:32px;font-weight:800;color:var(--n8);margin:0 0 6px;letter-spacing:-0.01em;}
.page-sub{font-size:13.5px;color:var(--n7);margin:0;}

/* ── KPI 스탯 로우 ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px;animation:countUp .4s ease both;}
.stat-label{font-size:12px;color:var(--n7);font-weight:600;}
.stat-value{font-size:30px;font-weight:800;color:var(--n8);margin-top:6px;line-height:1.1;}
.stat-delta{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:6px;}
.stat-delta.up{color:var(--s1-text);}
.stat-delta.down{color:var(--s2-text);}
.stat-spark{width:100%;height:28px;margin-top:8px;}

/* ── 히어로 차트 패널 ── */
.chart-panel{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:22px;margin-bottom:20px;}
.chart-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.chart-panel-title{font-size:14.5px;font-weight:700;color:var(--n8);}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--n7);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

/* ── 위젯 그리드 ── */
.widget-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;}
.widget-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px;}
.widget-title{font-size:13.5px;font-weight:700;color:var(--n8);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.age-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.age-bar-label{width:54px;font-size:12px;color:var(--n7);flex-shrink:0;}
.age-bar-track{flex:1;height:10px;background:var(--n2);border-radius:9999px;overflow:hidden;}
.age-bar-fill{height:100%;background:var(--m600);border-radius:9999px;transform-origin:left;animation:barGrow .5s ease both;}
.age-bar-value{width:44px;text-align:right;font-size:12px;color:var(--n8);font-weight:700;flex-shrink:0;}
.api-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--n3);font-size:12.5px;}
.api-row:last-child{border-bottom:none;}
.api-status-dot{width:7px;height:7px;border-radius:50%;margin-right:6px;display:inline-block;}
.log-row{padding:9px 0;border-bottom:1px solid var(--n3);font-size:12px;color:var(--n7);}
.log-row:last-child{border-bottom:none;}
.log-row b{color:var(--n8);font-weight:600;}

/* ── 정산 관리 (settlement) ── */
.policy-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n3);border-radius:16px;overflow:hidden;}
.policy-table th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:12px 16px;background:var(--n0);border-bottom:1px solid var(--n3);}
.policy-table td{padding:12px 16px;font-size:13px;color:var(--n8);border-bottom:1px solid var(--n3);}
.policy-table tr:last-child td{border-bottom:none;}
.policy-input{width:70px;padding:6px 8px;border:1px solid var(--n4);border-radius:8px;font-size:12.5px;text-align:center;font-family:inherit;}
.section-block{margin-top:22px;}
.section-block-title{font-size:14px;font-weight:700;color:var(--n8);margin-bottom:10px;}
.batch-row{display:flex;justify-content:space-between;align-items:center;background:var(--n1);border:1px solid var(--n3);border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:12.5px;}
.badge-pill{padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;background:var(--n2);color:var(--n7);}
.badge-pill.fail{background:var(--s2-bg);color:var(--s2-text);}
.badge-pill.ok{background:var(--s1-bg);color:var(--s1-text);}
.btn-primary{padding:10px 20px;border-radius:10px;border:none;background:var(--m600);color:#fff;font-size:13px;font-weight:700;}
.btn-primary:hover{background:var(--m700);}
.btn-outline{padding:8px 14px;border-radius:10px;border:1px solid var(--n4);background:var(--n1);color:var(--n8);font-size:12px;font-weight:700;}
.btn-outline:hover{background:var(--n2);}
.btn-outline.retry{border-color:var(--s2);color:var(--s2-text);background:var(--s2-bg);}

/* ── AI 매칭 (ai-match) ── */
.match-layout{display:grid;grid-template-columns:1fr 320px;gap:18px;}
.match-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:16px;margin-bottom:12px;}
.match-score-bar{height:8px;border-radius:9999px;background:var(--n2);overflow:hidden;margin-top:8px;}
.match-score-fill{height:100%;background:var(--m600);border-radius:9999px;}
.match-keywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.kw-chip{padding:3px 9px;border-radius:9999px;background:var(--n2);color:var(--n7);font-size:11px;font-weight:600;}
.weight-panel{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px;height:fit-content;}
.weight-row{margin-bottom:16px;}
.weight-row label{font-size:12.5px;font-weight:700;color:var(--n8);display:flex;justify-content:space-between;margin-bottom:6px;}
.weight-row input[type=range]{width:100%;accent-color:var(--m600);}

/* ── 관리자 (admin-manage) ── */
.admin-tabs{display:flex;gap:8px;margin-bottom:16px;}
.admin-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n3);border-radius:16px;overflow:hidden;}
.admin-table th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:11px 16px;background:var(--n0);border-bottom:1px solid var(--n3);}
.admin-table td{padding:11px 16px;font-size:12.5px;color:var(--n8);border-bottom:1px solid var(--n3);}
.role-chip{padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;background:var(--n9);color:var(--n1);}
.role-chip.op{background:var(--n2);color:var(--n7);}
.row-action{border:none;background:transparent;color:var(--n7);font-size:12px;font-weight:700;}
.row-action:hover{color:var(--n8);}
.row-action.danger{color:var(--s2-text);}

/* ── 모달 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,0.42);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
.modal-box{width:440px;max-width:100%;background:var(--n1);border-radius:16px;padding:24px;animation:fadeInUp .22s ease;}
.modal-title{font-size:17px;font-weight:800;color:var(--n8);margin:0 0 14px;}
.field-input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--n4);font-size:13.5px;font-family:inherit;color:var(--n8);margin-bottom:14px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n8);color:var(--n1);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:90;display:flex;align-items:center;gap:8px;animation:fadeInUp .2s ease;}

@media (max-width:960px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .widget-grid{grid-template-columns:1fr;}
  .match-layout{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function Sparkline({ points, color }) {
  const w = 100, h = 28;
  const max = Math.max(...points), min = Math.min(...points);
  const norm = points.map((p,i) => {
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function TrendChart() {
  return (
    <svg viewBox="0 0 640 200" style={{width:'100%',height:220}} preserveAspectRatio="none">
      <line x1="0" y1="50" x2="640" y2="50" stroke="var(--n3)" strokeWidth="1" />
      <line x1="0" y1="100" x2="640" y2="100" stroke="var(--n3)" strokeWidth="1" />
      <line x1="0" y1="150" x2="640" y2="150" stroke="var(--n3)" strokeWidth="1" />
      <polygon points="0,170 40,150 80,155 120,120 160,130 200,95 240,105 280,80 320,90 360,60 400,70 440,45 480,55 520,35 560,42 600,25 640,30 640,200 0,200" fill="var(--m100)" opacity="0.5" />
      <polyline
        points="0,170 40,150 80,155 120,120 160,130 200,95 240,105 280,80 320,90 360,60 400,70 440,45 480,55 520,35 560,42 600,25 640,30"
        fill="none" stroke="var(--m600)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"
        strokeDasharray="600" style={{animation:'drawLine 1.1s ease forwards'}} />
    </svg>
  );
}

const AGE_STATS = [
  { label:'50대', value:38 },

const API_STATUS = [

  { id:'B-1041', target:'9월 2주차 정산', status:'fail', amount:'1,180,000원' },

const MATCH_RESULTS = [
  { name:'김명자', job:'구청 생활안전지원센터 안전점검 도우미', score:92, keywords:['고객응대','12년 경력','서울 중구'] },
  { name:'박정수', job:'아파트 단지 경비 지원', score:81, keywords:['경비 경험','자격증 보유'] },
  { name:'이순희', job:'중소기업 총무 사무 보조', score:74, keywords:['사무 경력','인근 거주'] },
];
const USERS = [

  { name:'한지훈', role:'운영자', email:'jh.han@example.com', status:'정상' },

];

function Icon({ name }) { return <i className={`ph ph-${name}`}></i>; }

function Header({ view, setView }) {
  const navItems = [
    { key:'main', label:'운영 관제 대시보드' },
    { key:'settlement', label:'연령 기반 수수료 정산 관리' },

function TabBar({ subTab, onTab }) {
  return (
    <div className="tab-bar">
      <button className="tab" style={subTab==='개요' ? {color:'var(--m700)',borderBottomColor:'var(--m600)'} : {}} onClick={() => onTab('개요')}>개요</button>
      <button className="tab" style={subTab==='매칭 추이' ? {color:'var(--m700)',borderBottomColor:'var(--m600)'} : {}} onClick={() => onTab('매칭 추이')}>매칭 추이</button>

      <button className="tab" style={subTab==='연동 현황' ? {color:'var(--m700)',borderBottomColor:'var(--m600)'} : {}} onClick={() => onTab('연동 현황')}>연동 현황</button>

}

function MainView({ subTab }) {

      <div className="stat-row">

        </div>
        <div className="stat-card">
          <div className="stat-label">정산 대기 금액</div>
          <div className="stat-value">6,480,000원</div>
          <div className="stat-delta down"><Icon name="trend-down" />-8%</div>
          <Sparkline points={[40,38,36,30,28,24,22]} color="var(--n6)" />
        </div>
        <div className="stat-card">
          <div className="stat-label">활성 공고 수</div>
          <div className="stat-value">342건</div>
          <div className="stat-delta up"><Icon name="trend-up" />+21건</div>
          <Sparkline points={[10,14,18,17,22,26,30]} color="var(--n6)" />
        </div>
        <div className="stat-card">
          <div className="stat-label">AI 보조 사용률</div>
          <div className="stat-value">67%</div>
          <div className="stat-delta up"><Icon name="trend-up" />+5%p</div>
          <Sparkline points={[50,52,55,58,60,63,67]} color="var(--n6)" />
        </div>
      </div>
      <div className="chart-panel">
        <div className="chart-panel-head">
          <div className="chart-panel-title">최근 30일 매칭 성사 추이 — {subTab}</div>
          <div className="chart-legend"><span><span className="legend-dot" style={{background:'var(--m600)'}}></span>매칭 성사</span></div>
        </div>

      </div>
      <div className="widget-grid">
        <div className="widget-card">
          <div className="widget-title"><Icon name="users-three" />연령대별 수수료 감면 통계</div>
          {AGE_STATS.map(a => (
            <div className="age-bar-row" key={a.label}>
              <div className="age-bar-label">{a.label}</div>
              <div className="age-bar-track"><div className="age-bar-fill" style={{width:`${a.value}%`}}></div></div>
              <div className="age-bar-value">{a.value}%</div>
            </div>
          ))}
          <div className="widget-title" style={{marginTop:18}}><Icon name="clock-counter-clockwise" />최근 관리 활동</div>
          {ACTIVITY_LOG.map((l,i) => (
            <div className="log-row" key={i} dangerouslySetInnerHTML={{__html:l}}></div>
          ))}
        </div>
        <div className="widget-card">
          <div className="widget-title"><Icon name="plug" />Open API 연동 현황</div>
          {API_STATUS.map(a => (
            <div className="api-row" key={a.name}>
              <div><span className="api-status-dot" style={{background:a.status==='ok'?'var(--s1)':'var(--s2)'}}></span>{a.name}</div>
              <div style={{color:'var(--n7)'}}>{a.detail} {a.status==='fail' && <span className="badge-pill fail">실패</span>}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function SettlementView({ showToast }) {
  const [policies, setPolicies] = useState(POLICIES);
  const updateRate = (idx, val) => {
    setPolicies(list => list.map((p,i) => i===idx ? {...p, rate: val} : p));
  };
  return (
    <div className="content">
      <div className="page-head">
        <h1 className="page-title">연령 기반 수수료 정산 관리</h1>
        <p className="page-sub">연령 구간별 수수료율을 정책 테이블로 관리하고, 배치 정산 작업을 모니터링합니다.</p>
      </div>
      <table className="policy-table">
        <thead><tr><th>연령 구간</th><th>수수료율</th><th>비고</th><th></th></tr></thead>
        <tbody>
          {policies.map((p,idx) => (
            <tr key={p.range}>
              <td>{p.range}</td>
              <td><input className="policy-input" value={p.rate} onChange={(e) => updateRate(idx, e.target.value)} />%</td>
              <td>{p.note}</td>
              <td><button className="row-action" onClick={() => showToast(`${p.range} 요율이 ${p.rate}%로 저장되었습니다`)}>저장</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="section-block">
        <div className="section-block-title">정산 배치 작업</div>
        {BATCH_JOBS.map(b => (
          <div className="batch-row" key={b.id}>
            <div>{b.id} · {b.target}</div>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <span>{b.amount}</span>
              <span className={`badge-pill ${b.status}`}>{b.status==='ok'?'완료':'실패'}</span>
              {b.status==='fail' && <button className="btn-outline retry" onClick={() => showToast(`${b.id} 재처리 대기열에 등록되었습니다`)}>재처리</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AiMatchView({ showToast }) {
  const [weights, setWeights] = useState({ embedding: 65, rule: 35 });
  return (
    <div className="content">
      <div className="page-head">
        <h1 className="page-title">AI 매칭 추천 고도화</h1>
        <p className="page-sub">임베딩 유사도 검색과 Claude API 스코어링을 결합해 이력서-공고 적합도를 산출합니다.</p>
      </div>
      <div className="match-layout">
        <div>
          {MATCH_RESULTS.map(m => (
            <div className="match-card" key={m.name}>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <div style={{fontWeight:700,fontSize:14}}>{m.name} → {m.job}</div>
                <div style={{fontWeight:800,color:'var(--m700)'}}>{m.score}점</div>
              </div>
              <div className="match-score-bar"><div className="match-score-fill" style={{width:`${m.score}%`}}></div></div>
              <div className="match-keywords">{m.keywords.map(k => <span key={k} className="kw-chip">{k}</span>)}</div>
            </div>
          ))}
        </div>
        <div className="weight-panel">
          <div style={{fontWeight:700,fontSize:13.5,marginBottom:14}}>추천 가중치 조정</div>
          <div className="weight-row">
            <label><span>임베딩 유사도</span><span>{weights.embedding}%</span></label>
            <input type="range" min="0" max="100" value={weights.embedding} onChange={(e) => setWeights(w => ({embedding:+e.target.value, rule:100-e.target.value}))} />
          </div>
          <div className="weight-row">
            <label><span>규칙 기반 필터</span><span>{weights.rule}%</span></label>
            <input type="range" min="0" max="100" value={weights.rule} onChange={(e) => setWeights(w => ({rule:+e.target.value, embedding:100-e.target.value}))} />
          </div>
          <button className="btn-primary" style={{width:'100%'}} onClick={() => showToast('추천 가중치가 적용되었습니다')}>가중치 적용</button>
        </div>
      </div>
    </div>
  );
}

function AdminManageView({ showToast }) {
  const [users, setUsers] = useState(USERS);
  const [tab, setTab] = useState('users');
  const toggleStatus = (idx) => {
    setUsers(list => list.map((u,i) => i===idx ? {...u, status: u.status==='정상' ? '정지' : '정상'} : u));
    showToast('회원 상태가 변경되어 감사 로그에 기록되었습니다');
  };
  return (
    <div className="content">
      <div className="page-head">
        <h1 className="page-title">관리자 사용자·공고 관리</h1>
        <p className="page-sub">역할 기반 접근 제어와 감사 로그로 회원·공고 운영을 통제합니다.</p>
      </div>
      <div className="admin-tabs">
        <button className={`btn-outline ${tab==='users'?'':''}`} style={tab==='users'?{background:'var(--n8)',color:'#fff',borderColor:'var(--n8)'}:{}} onClick={() => setTab('users')}>운영자 계정</button>
        <button className="btn-outline" style={tab==='reports'?{background:'var(--n8)',color:'#fff',borderColor:'var(--n8)'}:{}} onClick={() => setTab('reports')}>신고 처리</button>
      </div>
      {tab === 'users' && (
        <table className="admin-table">
          <thead><tr><th>이름</th><th>권한</th><th>이메일</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {users.map((u,idx) => (
              <tr key={u.name}>
                <td>{u.name}</td>
                <td><span className={`role-chip ${u.role==='운영자'?'op':''}`}>{u.role}</span></td>
                <td>{u.email}</td>
                <td>{u.status}</td>
                <td>
                  <button className={`row-action ${u.role==='마스터'?'':'danger'}`} disabled={u.role==='마스터'} onClick={() => toggleStatus(idx)}>
                    {u.role==='마스터' ? '마스터 전용' : (u.status==='정상' ? '정지' : '복구')}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      {tab === 'reports' && (
        <table className="admin-table">
          <thead><tr><th>공고</th><th>신고 사유</th><th>상태</th><th></th></tr></thead>
          <tbody>
            <tr>
              <td>물류센터 오전 검수 보조</td>
              <td>과장 광고 의심</td>
              <td><span className="badge-pill fail">검토 대기</span></td>
              <td><button className="row-action" onClick={() => showToast('공고가 블라인드 처리되었습니다')}>블라인드 처리</button></td>
            </tr>
          </tbody>
        </table>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [subTab, setSubTab] = useState('개요');
  const [toast, setToast] = useState('');
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };
  const onTab = (t) => { setSubTab(t); setView('main'); };

  return (
    <div className="app" data-archetype="topbar-analytics">
      <Header view={view} setView={setView} />
      <TabBar subTab={subTab} onTab={onTab} />
      {view === 'main' && <MainView subTab={subTab} />}
      {view === 'settlement' && <SettlementView showToast={showToast} />}
      {view === 'ai-match' && <AiMatchView showToast={showToast} />}
      {view === 'admin-manage' && <AdminManageView showToast={showToast} />}
      {toast && <div className="toast"><Icon name="check-circle" />{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
