<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 학업 분석 컨설팅 플랫폼 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (hue 205°, light) ── */
:root{
  --m50:#e4f3fd; --m100:#c8e6fb; --m200:#a7d7f9; --m300:#82c6f6; --m400:#5eb6f4;
  --m500:#3ba6f1; --m600:#3088c6; --m700:#266a9a; --m800:#1b4b6c; --m900:#1b4b6c;
  --n0:#fafaf9; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909598; --n7:#78716c; --n8:#53575a; --n9:#36383a; --n10:#1e1f20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;

  /* Seline design-ref 파생 토큰 — 타이포/여백/radius/shadow */
  --text-caption:10px; --text-body:14px; --text-body-lg:16px; --text-subheading:20px;
  --text-heading-sm:32px; --text-display:44px;
  --radius-tag:9999px; --radius-btn:9999px; --radius-card:10px; --radius-icon:8px; --radius-input:8px;
  --shadow-subtle:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.05);
  --shadow-xl:0 12px 45px rgba(0,0,0,.14);
  --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-24:24px; --sp-32:32px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--n0); color:var(--n9);
  -webkit-font-smoothing:antialiased;
}
#app-root{width:100%;}
button{font-family:inherit; cursor:pointer;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── keyframes ── */
@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes pulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(1.15);} }
@keyframes slideInRight{ from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);} }
@keyframes spinSoft{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes toastIn{ from{opacity:0; transform:translateY(12px) translateX(-50%);} to{opacity:1; transform:translateY(0) translateX(-50%);} }
@keyframes countRise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ── workspace strip ── */
.workspace-strip{
  width:64px; min-width:64px; background:var(--n10); height:100vh; position:sticky; top:0;
  display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:6px; flex-shrink:0;
}
.ws-brand{
  width:36px; height:36px; border-radius:var(--radius-icon); background:var(--m500);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
  margin-bottom:14px;
}
.ws-item{
  width:44px; height:44px; border-radius:var(--radius-icon); background:transparent; border:none;
  display:flex; align-items:center; justify-content:center; color:var(--n5);
  transition:background .15s ease, color .15s ease; position:relative;
}
.ws-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
.ws-item.active{ background:var(--m600); color:#fff; }
.ws-item .ws-unread{
  position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%;
  background:var(--m400); animation:pulseDot 1.8s ease-in-out infinite;
}
.ws-divider{ width:28px; height:1px; background:rgba(255,255,255,.12); margin:6px 0; }

/* ── channel list ── */
.channel-list{
  width:272px; min-width:272px; background:var(--n1); border-right:1px solid var(--n3);
  height:100vh; overflow-y:auto; flex-shrink:0;
}
.channel-header{ padding:20px 16px 12px; border-bottom:1px solid var(--n3); position:sticky; top:0; background:var(--n1); z-index:2;}
.channel-header h2{ font-size:var(--text-subheading); font-weight:600; letter-spacing:-0.1px; margin:0 0 12px; color:var(--n10);}
.channel-search{
  display:flex; align-items:center; gap:8px; background:var(--n2); border:1px solid var(--n3);
  border-radius:var(--radius-input); padding:8px 12px;
}
.channel-search input{ border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--n9);}
.channel-search input::placeholder{ color:var(--n6); }
.channel-section-title{ padding:14px 16px 6px; font-size:11px; font-weight:600; color:var(--n6); text-transform:uppercase; letter-spacing:.04em;}
.channel-item{
  display:flex; align-items:center; gap:10px; padding:10px 16px; border:none; background:transparent; width:100%;
  text-align:left; border-left:3px solid transparent; transition:background .15s ease;
}
.channel-item:hover{ background:var(--n2); }
.channel-item.active{ background:var(--m50); border-left-color:var(--m600); }
.channel-avatar{
  width:34px; height:34px; border-radius:var(--radius-icon); background:var(--n2); color:var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.channel-item.active .channel-avatar{ background:var(--m100); color:var(--m700); }
.channel-meta{ flex:1; min-width:0; }
.channel-title{ font-size:13.5px; font-weight:600; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.channel-sub{ font-size:12px; color:var(--n6); margin-top:2px; display:flex; align-items:center; gap:6px;}
.status-pill{
  display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--radius-tag);
  font-size:11px; font-weight:600; background:var(--n2); color:var(--n7); white-space:nowrap;
}
.status-pill.done{ background:var(--s1-bg); color:var(--s1-text); }
.status-pill.fail{ background:var(--s2-bg); color:var(--s2-text); }
.channel-unread{
  width:8px; height:8px; border-radius:50%; background:var(--m500); flex-shrink:0; animation:pulseDot 1.8s ease-in-out infinite;
}

/* ── main ── */
.conv-main{ flex:1; min-width:0; height:100vh; display:flex; flex-direction:column; background:var(--n0); }
.conv-header{
  display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--n3);
  background:var(--n1);
}
.conv-title-row{ display:flex; align-items:center; gap:10px; min-width:0;}
.conv-title-row h2{ font-size:18px; font-weight:600; color:var(--n10); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px;}
.conv-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:36px; height:36px; border-radius:var(--radius-icon); border:1px solid var(--n3); background:var(--n1);
  color:var(--n7); display:flex; align-items:center; justify-content:center; transition:all .15s ease;
}
.icon-btn:hover{ border-color:var(--n5); color:var(--n9); }
.icon-btn.toggled{ background:var(--m50); border-color:var(--m300); color:var(--m700); }
.conv-body{ flex:1; overflow-y:auto; padding:24px 32px; }
.msg-group{ display:flex; gap:12px; max-width:720px; margin-bottom:20px; animation:fadeInUp .35s ease both; }
.msg-avatar{
  width:36px; height:36px; border-radius:var(--radius-icon); background:var(--n2); color:var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.msg-group.system .msg-avatar{ background:var(--m50); color:var(--m700); }
.msg-group.me{ margin-left:auto; flex-direction:row-reverse; }
.msg-content-wrap{ min-width:0; }
.msg-meta{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.msg-group.me .msg-meta{ flex-direction:row-reverse; }
.msg-name{ font-size:13px; font-weight:600; color:var(--n9); }
.msg-time{ font-size:11px; color:var(--n6); }
.msg-bubble{
  background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:12px 16px;
  font-size:14px; line-height:1.64; color:var(--n9);
}
.msg-group.system .msg-bubble{ background:var(--n2); border-color:var(--n3); color:var(--n8); font-size:13px; }
.msg-group.me .msg-bubble{ background:var(--m600); border-color:var(--m600); color:#fff; }
.msg-docs{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.msg-doc-chip{
  display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--n1); border:1px solid var(--n3);
  border-radius:var(--radius-tag); font-size:12px; color:var(--n7);
}

.conv-input-wrap{
  position:sticky; bottom:0; padding:16px 32px 24px; background:var(--n0); border-top:1px solid var(--n3);
}
.conv-input{
  display:flex; align-items:center; gap:10px; background:var(--n1); border:1px solid var(--n3);
  border-radius:var(--radius-btn); padding:6px 6px 6px 18px; max-width:720px;
}
.conv-input input{ flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--n9); padding:8px 0;}
.conv-input input::placeholder{ color:var(--n6); }
.send-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--m600); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease;
}
.send-btn:hover{ background:var(--m700); }

/* ── info panel ── */
.info-panel{
  width:320px; min-width:320px; height:100vh; overflow-y:auto; background:var(--n1); border-left:1px solid var(--n3);
  padding:20px; animation:slideInRight .25s ease both; flex-shrink:0;
}
.info-panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.info-panel-header h3{ font-size:15px; font-weight:700; margin:0; color:var(--n10); }
.info-section{ margin-bottom:22px; }
.info-label{ font-size:11px; font-weight:600; color:var(--n6); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
.info-value{ font-size:14px; color:var(--n9); line-height:1.5; }
.info-doc-row{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--n3); border-radius:var(--radius-input);
  margin-bottom:8px; font-size:12.5px; color:var(--n8); background:var(--n0);
}
.info-doc-row svg{ color:var(--n6); flex-shrink:0; }
.consultant-card{
  display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--n3); border-radius:var(--radius-card); background:var(--n0);
}
.consultant-avatar{
  width:44px; height:44px; border-radius:50%; background:var(--m100); color:var(--m700);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
}
.quick-actions{ display:flex; flex-direction:column; gap:8px; }
.quick-action-btn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--n3); border-radius:var(--radius-input);
  background:var(--n1); font-size:13px; color:var(--n8); font-weight:500; transition:all .15s ease;
}
.quick-action-btn:hover{ border-color:var(--m400); color:var(--m700); background:var(--m50); }

/* ── buttons ── */
.btn-primary{
  background:var(--m600); color:#fff; border:none; border-radius:var(--radius-btn); padding:10px 20px;
  font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; transition:background .15s ease;
}
.btn-primary:hover{ background:var(--m700); }
.btn-ghost{
  background:transparent; color:var(--n8); border:1px solid var(--n4); border-radius:var(--radius-btn); padding:10px 20px;
  font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:8px; transition:all .15s ease;
}
.btn-ghost:hover{ border-color:var(--n6); color:var(--n10); }

/* ── payment view ── */
.view-wrap{ flex:1; min-width:0; overflow-y:auto; padding:32px; }
.view-header{ margin-bottom:24px; position:relative; }
.view-header-art{ position:absolute; top:-6px; right:0; opacity:.55; pointer-events:none; }
.view-header h1{ font-size:var(--text-heading-sm); font-weight:600; letter-spacing:-0.6px; color:var(--n10); margin:0 0 6px;}
.view-header p{ font-size:14px; color:var(--n7); margin:0; }
.pay-grid{ display:grid; grid-template-columns:1.1fr .9fr; gap:24px; max-width:980px; }
.card{ background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:24px; box-shadow:var(--shadow-md); }
.card h3{ font-size:15px; font-weight:700; margin:0 0 16px; color:var(--n10); }
.form-row{ margin-bottom:14px; }
.form-row label{ display:block; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:6px; }
.form-row input{
  width:100%; padding:10px 12px; border:1px solid var(--n3); border-radius:var(--radius-input); font-size:14px; color:var(--n9);
  outline:none; transition:border-color .15s ease; background:var(--n1);
}
.form-row input:focus{ border-color:var(--m500); box-shadow:0 0 0 3px var(--m100); }
.form-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.summary-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--n7); padding:8px 0; border-bottom:1px dashed var(--n3); }
.summary-row.total{ font-weight:700; color:var(--n10); font-size:15px; border-bottom:none; padding-top:12px; }
table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
table.data-table th{ text-align:left; padding:10px 8px; color:var(--n6); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--n3); }
table.data-table td{ padding:12px 8px; border-bottom:1px solid var(--n2); color:var(--n9); }
table.data-table tr:hover td{ background:var(--n0); }

/* ── report view ── */
.report-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:980px; margin-bottom:24px;}
.score-card{ background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-subtle);}
.score-card .score-label{ font-size:12.5px; color:var(--n6); font-weight:600; margin-bottom:8px;}
.score-card .score-value{ font-size:32px; font-weight:700; color:var(--n10); letter-spacing:-0.8px; animation:countRise .5s ease both;}
.score-card .score-bar-track{ width:100%; height:6px; background:var(--n2); border-radius:99px; margin-top:12px; overflow:hidden;}
.score-card .score-bar-fill{ height:100%; background:var(--m600); border-radius:99px; transition:width 1s ease;}

/* ── modal ── */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,18,17,.45); display:flex; align-items:center; justify-content:center;
  z-index:100; animation:fadeInUp .2s ease both;
}
.modal-box{
  background:var(--n1); border-radius:16px; padding:28px; width:400px; max-width:90vw; box-shadow:var(--shadow-xl);
  animation:fadeInUp .25s ease both;
}
.modal-box h3{ font-size:17px; font-weight:700; margin:0 0 10px; color:var(--n10);}
.modal-box p{ font-size:13.5px; color:var(--n7); line-height:1.6; margin:0 0 22px;}
.modal-actions{ display:flex; gap:10px; justify-content:flex-end;}

/* ── toast ── */
.toast{
  position:fixed; bottom:28px; left:50%; background:var(--n10); color:#fff; padding:12px 20px; border-radius:var(--radius-btn);
  font-size:13.5px; font-weight:500; z-index:200; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow-xl);
  animation:toastIn .25s ease both;
}
.toast svg{ color:var(--s1); }

/* spinner */
.spinner{ animation:spinSoft 1s linear infinite; display:inline-flex;}

.empty-panel{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--n6); gap:12px; padding:60px 20px; text-align:center;}
</style>
</head>
<body>
<div id="app-root"></div>

function Icon({ name, size = 18 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      ref.current.appendChild(el);
      window.lucide.createIcons({ nodes: [el] });
    }
  }, [name, size]);
  return <span ref={ref} style={{display:'inline-flex', alignItems:'center'}}></span>;
}

function Toast({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="toast">
      <Icon name="check-circle" size={16} />
      {message}
    </div>
  );
}

function ChatView({ request }) {
  const [msgs, setMsgs] = useState([
    { from: 'consultant', text: '안녕하세요! 리포트에서 궁금한 점이 있으시면 여기서 편하게 물어보세요.', time: '10:44' },
  ]);
  const [draft, setDraft] = useState('');
  const [typing, setTyping] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [msgs, typing]);

  const send = () => {
    if (!draft.trim()) return;
    const text = draft.trim();
    setMsgs((m) => [...m, { from: 'me', text, time: '지금' }]);
    setDraft('');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMsgs((m) => [...m, { from: 'consultant', text: '확인했습니다. 학업역량 점수는 성적표 외 추가 활동 증빙을 첨부하시면 재산정이 가능합니다. 파일 업로드 도와드릴까요?', time: '지금' }]);
    }, 1100);
  };

  return (
    <main className="conv-main">
      <header className="conv-header">
        <div className="conv-title-row">
          <Icon name="message-circle" size={16} />
          <h2>실시간 상담 채팅 — {request.title}</h2>
        </div>
        <div className="conv-actions">
          <span className="status-pill done"><Icon name="circle" size={8} /> 상담사 온라인</span>
        </div>
      </header>
      <div className="conv-body" ref={bodyRef}>
        {msgs.map((m, i) => (
          <div className={'msg-group ' + (m.from === 'me' ? 'me' : 'system')} key={i}>
            <div className="msg-avatar">{m.from === 'me' ? '나' : <Icon name="headset" size={16} />}</div>
            <div className="msg-content-wrap">
              <div className="msg-meta">
                <span className="msg-name">{m.from === 'me' ? '나' : '이수민 컨설턴트'}</span>
                <span className="msg-time">{m.time}</span>
              </div>
              <div className="msg-bubble">{m.text}</div>
            </div>
          </div>
        ))}
        {typing && (
          <div className="msg-group system">
            <div className="msg-avatar"><Icon name="headset" size={16} /></div>
            <div className="msg-content-wrap">
              <div className="msg-bubble"><Icon name="loader" size={14} /> 입력 중…</div>
            </div>
          </div>
        )}
      </div>
      <div className="conv-input-wrap">
        <div className="conv-input">
          <input
            placeholder="메시지를 입력하세요…"
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') send(); }}
          />
          <button className="send-btn" onClick={send}><Icon name="send" size={16} /></button>
        </div>
      </div>
    </main>
  );
}

function App() {
  const [activeView, setActiveView] = useState('main');
  const [selectedId, setSelectedId] = useState('r1');
  const [infoPanelOpen, setInfoPanelOpen] = useState(true);
  const [search, setSearch] = useState('');
  const [requests, setRequests] = useState(REQUESTS);
  const [toast, setToast] = useState(null);

  const request = requests.find((r) => r.id === selectedId) || requests[0];

  const selectRequest = (id) => {
    setSelectedId(id);
    setRequests((rs) => rs.map((r) => (r.id === id ? { ...r, unread: false } : r)));
  };

  const handlePay = () => {
    setRequests((rs) => rs.map((r) => (r.id === selectedId ? { ...r, status: '결제완료' } : r)));
    setToast('결제가 완료되었습니다. 분석 대기열에 등록됩니다.');
  };

  const handleDownload = () => {
    setToast('리포트 PDF 다운로드가 시작되었습니다.');
  };

  return (
    <div style={{ display: 'flex', width: '100%', minHeight: '100vh' }} data-archetype="slack-3pane">
      <WorkspaceStrip active={activeView} onSelect={setActiveView} />
      <ChannelList
        requests={requests}
        selectedId={selectedId}
        onSelect={(id) => { selectRequest(id); setActiveView('main'); }}
        search={search}
        onSearch={setSearch}
      />
      {activeView === 'main' && (
        <ConversationMain
          request={request}
          infoPanelOpen={infoPanelOpen}
          onToggleInfo={() => setInfoPanelOpen((v) => !v)}
          onSendChatIntent={() => setActiveView('chat')}
        />
      )}
      {activeView === 'payment' && <PaymentView request={request} onPay={handlePay} />}
      {activeView === 'report' && <ReportView request={request} onDownload={handleDownload} />}
      {activeView === 'chat' && <ChatView request={request} />}
      {infoPanelOpen && activeView === 'main' && <InfoPanel request={request} onOpenView={setActiveView} />}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}
