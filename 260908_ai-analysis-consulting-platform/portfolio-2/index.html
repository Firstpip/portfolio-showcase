<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인(무채색 앵커) · 서브 2(성공/경고, s2 제거) · 나머지 무채색 (gen-color-tokens.js 산출) ── */
:root{
  --m50:#f0f0f0; --m100:#f0f0f0; --m200:#f0f0f0; --m300:#e0e0e0; --m400:#c2c2c2;
  --m500:#9c9c9c; --m600:#737373; --m700:#4b4b4b; --m800:#242424; --m900:#1e1e1e;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d5d5;
  --n5:#bab5b5; --n6:#989090; --n7:#797776; --n8:#5a5353; --n9:#3a3636; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  /* 실패/오류는 s2가 제거되어(메인 hue 0°와 충돌 판정) 무채색 필로 표현 */
  --fail-bg:#3a3636; --fail-text:#f6f3f1;

  /* Monad design-ref 파생 토큰 — 타이포/여백/radius */
  --text-caption:12px; --text-body:14px; --text-body-lg:16px; --text-label:15px;
  --text-subheading:22px; --text-heading:32px; --text-display:40px;
  --radius-pill:100px; --radius-card:24px; --radius-feature:40px; --radius-tag:9999px; --radius-input:14px;
  --shadow-ambient:0 0 10px rgba(0,0,0,.08);
  --sp-8:8px; --sp-16:16px; --sp-24:24px; --sp-32:32px; --sp-40:40px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--n0); color:var(--n10);
  -webkit-font-smoothing:antialiased;
}
#app-root{width:100%;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── keyframes ── */
@keyframes fadeUp{ from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);} }
@keyframes livePulse{ 0%,100%{box-shadow:0 0 0 0 rgba(31,137,75,.35);} 50%{box-shadow:0 0 0 6px rgba(31,137,75,0);} }
@keyframes barGrow{ from{width:0;} to{width:var(--target-w);} }
@keyframes spinRing{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes toastRise{ from{opacity:0; transform:translateX(-50%) scale(.94);} to{opacity:1; transform:translateX(-50%) scale(1);} }
@keyframes drawerIn{ from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:translateX(0);} }

/* ── sidebar ── */
.sidebar{
  width:240px; min-width:240px; background:var(--n0); border-right:1px solid var(--n3);
  height:100vh; position:sticky; top:0; overflow-y:auto; flex-shrink:0; padding:20px 0;
}
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:0 20px 20px; border-bottom:1px solid var(--n3); margin-bottom:16px;}
.brand-mark{ width:34px; height:34px; border-radius:10px; background:var(--n10); color:var(--n0); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;}
.brand-name{ font-size:14.5px; font-weight:600; letter-spacing:-0.2px; }
.env-pill{
  margin-left:auto; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:var(--radius-tag);
  background:var(--s1-bg); color:var(--s1-text); display:flex; align-items:center; gap:4px;
}
.env-dot{ width:6px; height:6px; border-radius:50%; background:var(--s1); animation:livePulse 2s ease-in-out infinite; }
.sidebar-section{ padding:0 12px; margin-bottom:18px; }
.sidebar-section-title{ font-size:11px; font-weight:600; color:var(--n6); letter-spacing:.05em; padding:0 10px 8px; }
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:12px; border:none; background:transparent;
  width:100%; text-align:left; font-size:13.5px; color:var(--n8); font-weight:500; margin-bottom:2px; transition:background .15s ease, color .15s ease;
}
.sidebar-link i{ font-size:17px; color:var(--n6); }
.sidebar-link:hover{ background:var(--n2); color:var(--n10); }
.sidebar-link.active{ background:var(--n10); color:var(--n0); }
.sidebar-link.active i{ color:var(--n0); }
.sidebar-badge{ margin-left:auto; font-size:10.5px; font-weight:700; background:var(--fail-bg); color:var(--fail-text); border-radius:var(--radius-tag); padding:1px 7px;}

/* ── main ── */
.main{ flex:1; min-width:0; height:100vh; overflow-y:auto; }
.page-header{ padding:24px 32px 0; position:relative; }
.page-header-art{ position:absolute; top:14px; right:32px; opacity:.4; pointer-events:none; }
.page-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.page-title{ font-size:40px; font-weight:400; letter-spacing:-0.7px; margin:0; }
.page-actions{ display:flex; gap:10px; }
.page-meta{ font-size:12.5px; color:var(--n6); margin-bottom:20px; }

.btn-pill-primary{
  background:var(--n10); color:var(--n0); border:none; border-radius:var(--radius-pill); padding:10px 22px;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px; letter-spacing:.02em; transition:opacity .15s ease;
}
.btn-pill-primary:hover{ opacity:.82; }
.btn-pill-ghost{
  background:transparent; color:var(--n9); border:1px solid var(--n4); border-radius:var(--radius-pill); padding:10px 22px;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px; letter-spacing:.02em; transition:all .15s ease;
}
.btn-pill-ghost:hover{ background:var(--n2); border-color:var(--n6); }

/* ── 파이프라인 히어로 밴드 (dark ink surface — Monad "Announcement Bar/Ink" 레벨 4) ── */
.pipeline-hero{
  margin:20px 32px 24px; background:var(--n10); border-radius:var(--radius-feature); padding:28px 32px;
  position:relative; overflow:hidden; color:var(--n0);
}
.pipeline-hero-art{ position:absolute; top:50%; right:28px; transform:translateY(-50%); opacity:.55; }
.pipeline-hero-eyebrow{ font-size:12px; font-weight:600; letter-spacing:.08em; color:var(--n5); margin-bottom:8px; text-transform:uppercase; }
.pipeline-hero h2{ font-size:26px; font-weight:400; letter-spacing:-0.4px; margin:0 0 8px; color:var(--n0); max-width:520px; }
.pipeline-hero p{ font-size:13.5px; color:var(--n5); margin:0; max-width:480px; line-height:1.6; }

/* status-strip (KPI 카드 = 슬림 라이브 상태바, 가로 1줄 스트립) */
.stat-row{
  display:flex; align-items:stretch; gap:0; padding:0 32px; margin-bottom:24px;
  background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-card); overflow:hidden; margin-left:32px; margin-right:32px; padding:0;
}
.stat-card{
  flex:1; padding:14px 20px; display:flex; align-items:center; gap:12px;
  animation:fadeUp .35s ease both; transition:background .18s ease; border-right:1px solid var(--n3);
}
.stat-card:last-child{ border-right:none; }
.stat-card:hover{ background:var(--n1); }
.stat-card-main{ flex:1; min-width:0; }
.stat-card .stat-label{ font-size:11px; font-weight:600; color:var(--n7); letter-spacing:.02em; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.stat-card .stat-value{ font-size:28px; font-weight:400; letter-spacing:-0.6px; color:var(--n10); line-height:1; }
.stat-card .stat-value.fail{ color:var(--fail-bg); }
.stat-card .stat-delta{ font-size:11px; font-weight:600; margin-top:3px; }
.stat-card .stat-delta.up{ color:var(--s1-text); }
.stat-card .stat-delta.down{ color:var(--n7); }
.stat-sparkline{ width:64px; height:24px; display:block; flex-shrink:0; }

/* tab bar */
.data-section{ padding:0 32px 32px; }
.tab-bar{ display:flex; gap:4px; border-bottom:1px solid var(--n3); margin-bottom:16px;}
.tab{
  padding:10px 16px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--n6);
  border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s ease;
}
.tab.active{ color:var(--n10); border-bottom-color:var(--n10); }
.tab:hover{ color:var(--n9); }

.data-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.search-input{
  display:flex; align-items:center; gap:8px; background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-input);
  padding:8px 14px; min-width:220px;
}
.search-input input{ border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--n9);}
.filter-chip{
  padding:7px 14px; border-radius:var(--radius-tag); border:1px solid var(--n4); background:transparent; font-size:12.5px;
  font-weight:600; color:var(--n7); transition:all .15s ease;
}
.filter-chip.active{ background:var(--n10); color:var(--n0); border-color:var(--n10); }
.filter-chip:hover:not(.active){ border-color:var(--n7); color:var(--n9); }
.export-btn{ margin-left:auto; }

.split-layout{ display:grid; grid-template-columns:1fr 320px; gap:20px; }

.data-table-wrap{ background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-card); overflow:hidden; }
table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
table.data-table th{ text-align:left; padding:12px 16px; color:var(--n6); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--n3); background:var(--n0);}
table.data-table td{ padding:13px 16px; border-bottom:1px solid var(--n3); color:var(--n9); }
table.data-table tbody tr{ cursor:pointer; transition:background .12s ease; }
table.data-table tbody tr:last-child td{ border-bottom:none; }
table.data-table tbody tr:hover td{ background:var(--n1); }
.progress-track{ width:100px; height:6px; background:var(--n3); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.progress-fill{ height:100%; background:var(--n9); border-radius:99px; animation:barGrow 1s ease both; }

.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--radius-tag); font-size:11.5px; font-weight:600; background:var(--n3); color:var(--n8);}
.badge.done{ background:var(--s1-bg); color:var(--s1-text); }
.badge.warn{ background:var(--s3-bg); color:var(--s3-text); }
.badge.fail{ background:var(--fail-bg); color:var(--fail-text); }

/* priority rail */
.priority-rail{ background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:18px; align-self:start; }
.priority-rail h3{ font-size:14.5px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
.priority-rail .rail-sub{ font-size:12px; color:var(--n7); margin-bottom:14px; }
.priority-item{
  display:flex; gap:10px; padding:12px; border-radius:var(--radius-input); background:var(--n0); border:1px solid var(--n3);
  margin-bottom:10px; cursor:pointer; transition:border-color .15s ease, transform .15s ease;
}
.priority-item:hover{ border-color:var(--n7); transform:scale(1.015); }
.priority-item .p-icon{ width:30px; height:30px; border-radius:9px; background:var(--fail-bg); color:var(--fail-text); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
.priority-item .p-title{ font-size:12.5px; font-weight:600; color:var(--n9); }
.priority-item .p-sub{ font-size:11px; color:var(--n6); margin-top:2px; }

/* secondary widgets */
.secondary-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
.widget-card{ background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-card); padding:20px; }
.widget-card h4{ font-size:13px; font-weight:700; margin:0 0 14px; color:var(--n9);}

/* highlight card (Periwinkle-style emphasis surface — n1) */
.highlight-card{ background:var(--n1); border:1px solid var(--n4); border-radius:var(--radius-feature); padding:var(--sp-32); }

/* members */
.country-strip{ display:flex; gap:14px; padding:0 32px; margin-bottom:22px; }
.country-pill{ flex:1; background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-card); padding:16px 18px; }
.country-pill .c-name{ font-size:12px; color:var(--n7); font-weight:600; margin-bottom:6px; }
.country-pill .c-value{ font-size:24px; font-weight:400; color:var(--n10); }
.country-pill .c-bar{ height:5px; background:var(--n3); border-radius:99px; margin-top:10px; overflow:hidden;}
.country-pill .c-bar-fill{ height:100%; background:var(--n9); border-radius:99px; }

/* drawer */
.drawer-overlay{ position:fixed; inset:0; background:rgba(36,32,32,.35); z-index:90; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:400px; background:var(--n0); border-left:1px solid var(--n3);
  z-index:91; padding:24px; overflow-y:auto; animation:drawerIn .22s ease both;
}
.drawer-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.drawer-header h3{ font-size:18px; font-weight:600; margin:0;}
.drawer-close{ width:32px; height:32px; border-radius:50%; border:1px solid var(--n3); background:var(--n1); display:flex; align-items:center; justify-content:center; color:var(--n7);}
.drawer-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--n3); margin-bottom:16px; }
.drawer-field{ margin-bottom:14px; }
.drawer-field .df-label{ font-size:11px; color:var(--n6); font-weight:600; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
.drawer-field .df-value{ font-size:14px; color:var(--n9); }

/* role table */
.role-table-wrap{ background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-card); padding:4px; margin-bottom:24px; overflow-x:auto;}
table.role-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
table.role-table th, table.role-table td{ padding:12px 16px; text-align:center; border-bottom:1px solid var(--n3); }
table.role-table th:first-child, table.role-table td:first-child{ text-align:left; }
table.role-table th{ font-size:11px; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
table.role-table tbody tr:last-child td{ border-bottom:none; }

/* modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(36,32,32,.4); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-box{ background:var(--n0); border:1px solid var(--n3); border-radius:var(--radius-feature); padding:32px; width:400px; max-width:90vw; }
.modal-box h3{ font-size:18px; font-weight:600; margin:0 0 10px;}
.modal-box p{ font-size:13.5px; color:var(--n7); line-height:1.6; margin:0 0 22px;}
.modal-actions{ display:flex; gap:10px; justify-content:flex-end;}

.toast{
  position:fixed; bottom:28px; left:50%; background:var(--n10); color:var(--n0); padding:12px 20px; border-radius:var(--radius-pill);
  font-size:13.5px; font-weight:500; z-index:200; display:flex; align-items:center; gap:8px; animation:toastRise .25s ease both;
}
.spin-icon{ animation:spinRing 1s linear infinite; display:inline-flex; }
</style>
</head>

function sparkPath(seed) {
  const pts = [3,5,4,7,6,9,8,11,9,13];
  const shifted = pts.map((v, i) => (v + (seed % (i + 2))) % 14 + 2);
  const w = 100, h = 26;
  return shifted.map((v, i) => `${(i / (shifted.length - 1)) * w},${h - v}`).join(' ');
}

function StatCard({ label, value, fail, delta, seed, icon }) {
  return (
    <div className="stat-card">
      <svg className="stat-sparkline" viewBox="0 0 100 26" preserveAspectRatio="none">
        <polyline points={sparkPath(seed)} fill="none" stroke={fail ? 'var(--fail-bg)' : 'var(--n8)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
      <div className="stat-card-main">
        <div className="stat-label"><i className={'ph ph-' + icon}></i>{label}</div>
        <div className={'stat-value' + (fail ? ' fail' : '')}>{value}</div>
        <div className={'stat-delta ' + (delta >= 0 ? 'up' : 'down')}>{delta >= 0 ? '+' : ''}{delta}% 최근 1시간</div>
      </div>
    </div>
  );
}

function Toast({ message, onDone }) {

}

        <div className="drawer-field"><div className="df-label">모델</div><div className="df-value">{job.model}</div></div>
        <div className="drawer-field"><div className="df-label">신청 항목</div><div className="df-value">{job.req}</div></div>
        <div className="drawer-field"><div className="df-label">상태</div><span className={'badge ' + (job.status === '완료' ? 'done' : job.status === '실패' ? 'fail' : job.status === '처리중' ? 'warn' : '')}>{job.status}</span></div>
        <div className="drawer-field"><div className="df-label">시작 시각</div><div className="df-value">{job.started}</div></div>
        <div className="drawer-field"><div className="df-label">재시도 횟수</div><div className="df-value">{job.retries}회</div></div>
        <div className="drawer-field">
          <div className="df-label">실행 로그</div>
          <div style={{ fontSize:'12.5px', color:'var(--n7)', lineHeight:1.7, background:'var(--n2)', border:'1px solid var(--n3)', borderRadius:'12px', padding:'12px' }}>
            [{job.started}] 대기열에서 작업 수신<br />
            [{job.started}] 클라우드 샌드박스 모델 호출 시작<br />
            {job.status === '실패' ? `[오류] 응답 시간 초과로 ${job.retries}회 재시도 처리됨` : `[진행] 현재 ${job.progress}% 처리됨`}
          </div>
        </div>
        {job.status === '실패' && (
          <button className="btn-pill-primary" style={{ width:'100%', justifyContent:'center' }} onClick={() => { onRetry(job.id); onClose(); }}>
            <i className="ph ph-arrow-clockwise"></i>지금 재실행
          </button>
        )}
      </div>
    </React.Fragment>
  );
}

function MemberDrawer({ member, onClose }) {
  const [tab, setTab] = useState('신청 이력');
  if (!member) return null;
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="drawer-header">
          <h3>{member.name}</h3>
          <button className="drawer-close" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        <div className="drawer-field"><div className="df-label">국가</div><div className="df-value">{member.country}</div></div>
        <div className="drawer-field"><div className="df-label">가입일</div><div className="df-value">{member.joined}</div></div>
        <div className="drawer-tabs">
          {['신청 이력', '결제 이력', '상담 이력'].map((t) => (
            <button key={t} className={'tab' + (tab === t ? ' active' : '')} onClick={() => setTab(t)}>{t}</button>
          ))}
        </div>
        {tab === '신청 이력' && <div className="df-value" style={{ fontSize:'13px', lineHeight:1.9 }}>총 {member.requests}건의 분석 신청 기록이 있습니다.</div>}
        {tab === '결제 이력' && <div className="df-value" style={{ fontSize:'13px', lineHeight:1.9 }}>누적 결제액 {member.spend}, 최근 결제는 2026.09.05입니다.</div>}
        {tab === '상담 이력' && <div className="df-value" style={{ fontSize:'13px', lineHeight:1.9 }}>최근 상담 채팅 3건, 평균 응답 20시간 이내로 종료되었습니다.</div>}
      </div>
    </React.Fragment>
  );
}

function App() {
  const [nav, setNav] = useState('main');
  const [jobs, setJobs] = useState(JOBS);
  const [payments, setPayments] = useState(PAYMENTS);
  const [openJob, setOpenJob] = useState(null);
  const [openMember, setOpenMember] = useState(null);
  const [refundTarget, setRefundTarget] = useState(null);
  const [toast, setToast] = useState(null);

  const failCount = jobs.filter((j) => j.status === '실패').length;

  const handleRetry = (id) => {
    if (id === 'bulk') {
      setJobs((js) => js.map((j) => (j.status === '실패' ? { ...j, status:'대기중', retries:0, progress:0 } : j)));
      setToast('실패 작업 전체를 재실행 대기열에 등록했습니다.');
      return;
    }
    setJobs((js) => js.map((j) => (j.id === id ? { ...j, status:'대기중', retries:0, progress:0 } : j)));
    setToast('작업이 재실행 대기열에 등록되었습니다.');
  };

  const handleRefund = () => {
    setPayments((ps) => ps.map((p) => (p.id === refundTarget.id ? { ...p, status:'환불' } : p)));
    setRefundTarget(null);
    setToast('환불이 처리되어 신청 건 상태가 갱신되었습니다.');
  };

  const handleExport = () => setToast('목록 내보내기가 시작되었습니다.');
  const handleResync = () => setToast('웹훅 로그와 내부 결제 기록 재동기화를 시작했습니다.');

  return (
    <div style={{ display:'flex', width:'100%', minHeight:'100vh' }} data-archetype="stripe-multipane">
      <Sidebar active={nav} onSelect={setNav} failCount={failCount} />
      <main className="main">
        {nav === 'main' && <MainConsole jobs={jobs} onRetry={handleRetry} onOpenJob={setOpenJob} onExport={handleExport} />}
        {nav === 'members' && <MembersView members={MEMBERS} onOpenMember={setOpenMember} onExport={handleExport} />}
        {nav === 'payments' && <PaymentsView payments={payments} onRefund={setRefundTarget} onResync={handleResync} />}
        {nav === 'security' && <SecurityView log={AUDIT_LOG} />}
      </main>
      <JobDrawer job={openJob} onClose={() => setOpenJob(null)} onRetry={handleRetry} />
      <MemberDrawer member={openMember} onClose={() => setOpenMember(null)} />
      {refundTarget && (
        <ConfirmModal
          title="환불을 처리할까요?"
          desc={`${refundTarget.member}님의 "${refundTarget.item}" 결제 ${refundTarget.amount}를 환불 처리하며, 신청 건 상태가 함께 갱신됩니다.`}
          onCancel={() => setRefundTarget(null)}
          onConfirm={handleRefund}
        />
      )}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
