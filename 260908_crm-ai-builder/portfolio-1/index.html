<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업종 맞춤 AI CRM 빌더 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (hue 205°, light, Seline 시드) ── */
:root{
  --m50:#e4f3fd; --m100:#c8e6fb; --m200:#a7d7f9; --m300:#82c6f6; --m400:#5eb6f4;
  --m500:#3ba6f1; --m600:#3088c6; --m700:#266a9a; --m800:#1b4b6c; --m900:#1b4b6c;
  --n0:#fafaf9; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909598; --n7:#78716c; --n8:#53575a; --n9:#36383a; --n10:#1e1f20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  background:var(--n0);
  color:var(--n9);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
#app{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input, select, textarea{font-family:inherit; font-size:14px;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:4px;}

/* ── keyframes (실사용 4종) ── */
@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.85);}}
@keyframes toastIn{from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}
@keyframes modalIn{from{opacity:0; transform:scale(0.96);} to{opacity:1; transform:scale(1);}}

/* ── layout shell (sidebar-classic 골격) ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:236px;
  background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; z-index:20;
}
.sidebar-brand{height:60px; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid var(--n3);}
.brand-mark{width:26px; height:26px; border-radius:8px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; flex-shrink:0;}
.brand-name{font-size:14px; font-weight:700; color:var(--n9);}
.tenant-pill{margin:14px 16px 6px; padding:9px 12px; border:1px solid var(--n3); border-radius:9999px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--n7); background:var(--n0);}
.tenant-pill .live-dot{width:6px; height:6px; border-radius:50%; background:var(--s1); animation:pulseDot 1.8s ease-in-out infinite; flex-shrink:0;}
.nav-group{padding:10px 10px; flex:1; overflow-y:auto;}
.nav-label{font-size:11px; font-weight:600; color:var(--n6); padding:12px 10px 6px; text-transform:uppercase; letter-spacing:0.04em;}
.nav-item{width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; color:var(--n7); font-weight:500; margin-bottom:2px; text-align:left;}
.nav-item i{font-size:17px; color:var(--n6); width:18px; text-align:center;}
.nav-item:hover{background:var(--n2); color:var(--n9);}
.nav-item.active{background:var(--m50); color:var(--m700); font-weight:700;}
.nav-item.active i{color:var(--m600);}
.sidebar-foot{padding:12px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:9px;}
.avatar-uniform{width:30px; height:30px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.foot-name{font-size:12.5px; font-weight:600; color:var(--n9);}
.foot-role{font-size:11px; color:var(--n6);}

.main-wrap{margin-left:236px; flex:1; min-width:0; width:calc(100% - 236px); min-height:100vh; display:flex; flex-direction:column;}
.topbar{height:60px; border-bottom:1px solid var(--n3); display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:var(--n1); flex-shrink:0;}
.topbar-title{font-size:16px; font-weight:700;}
.topbar-sub{font-size:12px; color:var(--n6); margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.icon-btn{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n7); border:1px solid var(--n3); background:var(--n1);}
.icon-btn:hover{background:var(--n2);}
.view-body{flex:1; padding:24px 28px; width:100%; animation:fadeInUp 0.35s ease both;}

.btn{border-radius:9999px; padding:9px 18px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:all .15s ease;}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{background:var(--n1); color:var(--n8); border:1px solid var(--n3);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:6px 13px; font-size:12.5px;}
.btn-danger-ghost{background:var(--n1); color:var(--s2-text); border:1px solid var(--n3);}
.btn-danger-ghost:hover{background:var(--s2-bg); border-color:var(--s2);}

.chip{padding:6px 13px; border-radius:9999px; font-size:12.5px; font-weight:600; color:var(--n7); background:var(--n1); border:1px solid var(--n3); display:inline-flex; align-items:center; gap:6px;}
.chip.active{background:var(--m50); color:var(--m700); border-color:var(--m300);}
.tag-neutral{padding:3px 9px; border-radius:9999px; font-size:11px; font-weight:600; background:var(--n2); color:var(--n7);}
.badge{padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px;}
.badge-s1{background:var(--s1-bg); color:var(--s1-text);}
.badge-s2{background:var(--s2-bg); color:var(--s2-text);}
.badge-s3{background:var(--s3-bg); color:var(--s3-text);}
.badge-n{background:var(--n2); color:var(--n7);}

/* ── kanban board ── */
.board-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
.filter-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; width:100%;}
.column{flex:0 0 272px; background:var(--n2); border-radius:12px; padding:12px; display:flex; flex-direction:column; max-height:calc(100vh - 230px); transition:background .15s ease;}
.column.drag-over{background:var(--m50);}
.col-header{display:flex; align-items:center; justify-content:space-between; padding:4px 6px 10px;}
.col-title{font-size:13px; font-weight:700; color:var(--n8);}
.col-count{background:var(--n1); color:var(--n7); font-size:11px; font-weight:700; padding:2px 8px; border-radius:9999px; border:1px solid var(--n3);}
.col-body{display:flex; flex-direction:column; gap:9px; overflow-y:auto;}
.card{background:var(--n1); border:1px solid var(--n3); border-radius:10px; padding:13px; cursor:grab; transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease; animation:fadeInUp .3s ease both;}
.card:hover{box-shadow:0 4px 16px 0 rgba(0,0,0,0.07); transform:translateY(-1px); border-color:var(--n4);}
.card.dragging{opacity:0.4;}
.card-title{font-size:13.5px; font-weight:700; color:var(--n9); margin-bottom:6px; line-height:1.35;}
.card-meta-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.card-amount{font-size:13px; font-weight:700; color:var(--n9);}
.card-avatar{width:22px; height:22px; border-radius:50%; background:var(--n2); color:var(--n7); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;}

/* ── AI 빌더 콘솔 ── */
.ai-wrap{display:flex; gap:20px; height:calc(100vh - 156px);}
.ai-chat{flex:0 0 40%; background:var(--n1); border:1px solid var(--n3); border-radius:14px; display:flex; flex-direction:column; overflow:hidden;}
.ai-chat-log{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px;}
.msg-row{display:flex; gap:9px; max-width:92%;}
.msg-row.user{align-self:flex-end; flex-direction:row-reverse;}
.msg-bubble{padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.55;}
.msg-row.assistant .msg-bubble{background:var(--n2); color:var(--n9); border-bottom-left-radius:4px;}
.msg-row.user .msg-bubble{background:var(--m600); color:#fff; border-bottom-right-radius:4px;}
.msg-avatar{width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px;}
.msg-row.assistant .msg-avatar{background:var(--m50); color:var(--m600);}
.msg-row.user .msg-avatar{background:var(--n2); color:var(--n7);}
.ai-suggest-row{display:flex; gap:7px; padding:0 18px 12px; flex-wrap:wrap;}
.ai-input-row{border-top:1px solid var(--n3); padding:12px 14px; display:flex; gap:8px;}
.ai-input-row input{flex:1; border:1px solid var(--n3); border-radius:9999px; padding:10px 16px; font-size:13px; background:var(--n0);}
.ai-input-row input:focus{outline:none; border-color:var(--m400);}
.ai-send{width:38px; height:38px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.ai-send:hover{background:var(--m700);}
.thinking-row{display:flex; align-items:center; gap:6px; padding:4px 0;}
.think-dot{width:6px; height:6px; border-radius:50%; background:var(--n6); animation:pulseDot 1s ease-in-out infinite;}
.think-dot:nth-child(2){animation-delay:.15s;} .think-dot:nth-child(3){animation-delay:.3s;}

.ai-diff{flex:1; background:var(--n1); border:1px solid var(--n3); border-radius:14px; padding:22px; overflow-y:auto;}
.diff-empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--n6); text-align:center; gap:10px;}
.diff-empty i{font-size:34px; color:var(--n5);}
.diff-card{border:1px solid var(--n3); border-radius:12px; padding:16px; margin-bottom:14px; animation:fadeInUp .3s ease both;}
.diff-card.blocked{border-color:var(--s2); background:var(--s2-bg);}
.diff-line{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 0; font-family:'SF Mono', monospace;}
.diff-add{color:var(--s1-text);}
.diff-remove{color:var(--s2-text);}
.diff-actions{display:flex; gap:8px; margin-top:14px;}
.applied-log{margin-top:6px;}
.applied-item{display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--n2); font-size:12.5px; color:var(--n7);}
.applied-item:last-child{border-bottom:none;}

.skeleton-line{height:12px; border-radius:4px; background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:400px 100%; animation:shimmer 1.4s ease infinite; margin-bottom:8px;}

/* ── tenant / team ── */
.card-panel{background:var(--n1); border:1px solid var(--n3); border-radius:14px; padding:20px; margin-bottom:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-title{font-size:14.5px; font-weight:700;}
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11.5px; font-weight:700; color:var(--n6); padding:8px 12px; border-bottom:1px solid var(--n3); text-transform:uppercase; letter-spacing:.03em;}
td{padding:12px; border-bottom:1px solid var(--n2); font-size:13px; vertical-align:middle;}
tr.row-hover:hover{background:var(--n2); cursor:pointer;}
.perm-grid{display:grid; grid-template-columns:1.4fr repeat(3, 1fr); gap:0; border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.perm-cell{padding:11px 14px; font-size:12.5px; border-bottom:1px solid var(--n2); border-right:1px solid var(--n2); display:flex; align-items:center;}
.perm-grid > .perm-cell:nth-child(4n+1){font-weight:600; color:var(--n8);}
.perm-head{background:var(--n2); font-weight:700; color:var(--n7); font-size:11.5px;}

/* ── deploy / preset ── */
.preset-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:22px;}
.preset-card{border:1.5px solid var(--n3); border-radius:12px; padding:16px 12px; text-align:center; background:var(--n1); transition:all .15s ease;}
.preset-card:hover{border-color:var(--n5);}
.preset-card.selected{border-color:var(--m500); background:var(--m50);}
.preset-card i{font-size:24px; color:var(--n6); margin-bottom:8px; display:block;}
.preset-card.selected i{color:var(--m600);}
.preset-card .p-name{font-size:12.5px; font-weight:700; color:var(--n8);}
.preset-card.selected .p-name{color:var(--m700);}

.deploy-steps{display:flex; align-items:center; gap:0; margin:20px 0;}
.dstep{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
.dstep-circle{width:34px; height:34px; border-radius:50%; background:var(--n2); color:var(--n6); display:flex; align-items:center; justify-content:center; font-size:15px; border:2px solid var(--n3); z-index:1; transition:all .2s ease;}
.dstep.done .dstep-circle{background:var(--s1); border-color:var(--s1); color:#fff;}
.dstep.active .dstep-circle{background:var(--m600); border-color:var(--m600); color:#fff; animation:pulseDot 1s ease-in-out infinite;}
.dstep-label{font-size:11.5px; color:var(--n7); margin-top:8px; text-align:center;}
.dstep-line{position:absolute; top:17px; left:50%; width:100%; height:2px; background:var(--n3); z-index:0;}
.dstep.done .dstep-line{background:var(--s1);}

.domain-preview{display:flex; align-items:center; gap:10px; background:var(--n2); border-radius:10px; padding:14px 16px; font-size:13.5px; font-weight:600; color:var(--n9); font-family:'SF Mono', monospace;}

/* ── modal / drawer / toast ── */
.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,0.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--n1); border-radius:16px; width:100%; max-width:520px; max-height:86vh; overflow-y:auto; padding:24px; animation:modalIn .18s ease both;}
.modal-box.wide{max-width:640px;}
.modal-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-title{font-size:16px; font-weight:700;}
.close-x{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.close-x:hover{background:var(--n2);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; border:1px solid var(--n3); border-radius:8px; padding:9px 12px; background:var(--n0);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--m400);}
.modal-footer{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
.detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.detail-row span:first-child{color:var(--n6);}
.detail-row span:last-child{font-weight:600; color:var(--n9);}
.timeline-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--n2); font-size:12.5px;}
.timeline-item i{color:var(--n6); font-size:15px; margin-top:1px;}
.timeline-item:last-child{border-bottom:none;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--n9); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .2s ease both;}
.toast i{color:var(--s1);}

@media (max-width:1100px){.preset-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

const NAV = [
  {id:'main', label:'거래 파이프라인 보드', icon:'ti-layout-kanban'},
  {id:'ai-builder', label:'AI 자연어 빌더 콘솔', icon:'ti-wand'},
  {id:'customers', label:'고객 관리', icon:'ti-users'},
  {id:'tenant', label:'멀티테넌트 & 팀 권한 관리', icon:'ti-shield-lock'},
  {id:'deploy', label:'업종 프리셋 배포 자동화', icon:'ti-rocket'},
];

const STAGES = ['리드유입','상담중','제안발송','협상중','계약완료'];
const OWNERS = ['김민수','이서연','박준호'];
const initial = (id)=>({id});

const INIT_DEALS = [
  {id:1, title:'해담공인중개 — 매물관리 CRM', industry:'부동산', amount:8200000, owner:'김민수', stage:'리드유입'},
  {id:2, title:'하나라이프보험 — 설계사 CRM', industry:'보험', amount:15400000, owner:'이서연', stage:'리드유입'},
  {id:3, title:'모던퍼니처 — 자사몰 연동', industry:'이커머스', amount:6300000, owner:'박준호', stage:'리드유입'},
  {id:4, title:'그로스랩 — 세일즈 파이프라인', industry:'B2B영업', amount:11200000, owner:'김민수', stage:'상담중'},
  {id:5, title:'클래스원 어학원 — 상담관리', industry:'학원·교육', amount:4800000, owner:'이서연', stage:'상담중'},
  {id:6, title:'제일부동산 — 임대매물 CRM', industry:'부동산', amount:5600000, owner:'박준호', stage:'상담중'},
  {id:7, title:'베스트카 손해사정 — 청구관리', industry:'보험', amount:9900000, owner:'김민수', stage:'제안발송'},
  {id:8, title:'퍼플스토어 — 리텐션 CRM', industry:'이커머스', amount:7100000, owner:'이서연', stage:'제안발송'},
  {id:9, title:'브릿지세일즈 — 파트너 관리', industry:'B2B영업', amount:13500000, owner:'박준호', stage:'협상중'},
  {id:10, title:'하이레벨 코딩academy — 원생관리', industry:'학원·교육', amount:5200000, owner:'김민수', stage:'협상중'},
  {id:11, title:'신영공인중개법인 — 매물CRM', industry:'부동산', amount:9400000, owner:'이서연', stage:'협상중'},
  {id:12, title:'투게더보험대리점 — 계약관리', industry:'보험', amount:12800000, owner:'박준호', stage:'계약완료'},
  {id:13, title:'올댓뷰티 — 재구매 CRM', industry:'이커머스', amount:6700000, owner:'김민수', stage:'계약완료'},
];

const PRESETS = [
  {id:'realestate', name:'부동산', icon:'ti-building-community'},
  {id:'insurance', name:'보험', icon:'ti-shield-check'},
  {id:'b2b', name:'B2B 영업', icon:'ti-briefcase'},
  {id:'ecommerce', name:'이커머스', icon:'ti-shopping-cart'},
  {id:'education', name:'학원·교육', icon:'ti-school'},

function initials(name){ return name.slice(0,1); }

function useToast(){
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const show = (msg)=>{
    setToast(msg);
    if(timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(()=>setToast(null), 2600);
  };
  return [toast, show];
}

function Toast({msg}){
  if(!msg) return null;
  return (
    <div className="toast"><i className="ti ti-circle-check"></i>{msg}</div>
  );
}

function BoardView({deals, setDeals, notify}){
  const [filter, setFilter] = useState('전체');
  const [dragId, setDragId] = useState(null);
  const [overStage, setOverStage] = useState(null);
  const [detail, setDetail] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [form, setForm] = useState({title:'', industry:'부동산', amount:'', owner:'김민수', stage:'리드유입'});

  const visible = deals.filter(d=>{
    if(filter==='전체') return true;
    if(filter==='이번달') return d.stage!=='계약완료';
    if(filter==='내 담당') return d.owner==='김민수';
    return true;
  });

  const onDrop = (stage)=>{
    if(dragId==null) return;
    setDeals(prev=>prev.map(d=> d.id===dragId ? {...d, stage} : d));
    setDragId(null); setOverStage(null);
    notify('거래 단계가 "' + stage + '"(으)로 이동되었습니다');
  };

  const submitCreate = ()=>{
    if(!form.title.trim()){ notify('거래명을 입력해주세요'); return; }
    const nid = Math.max(...deals.map(d=>d.id)) + 1;
    setDeals(prev=>[...prev, {id:nid, title:form.title, industry:form.industry, amount:Number(form.amount)||1000000, owner:form.owner, stage:form.stage}]);
    setShowCreate(false);
    setForm({title:'', industry:'부동산', amount:'', owner:'김민수', stage:'리드유입'});
    notify('새 거래가 추가되었습니다');
  };

  const changeStage = (id, stage)=>{
    setDeals(prev=>prev.map(d=> d.id===id ? {...d, stage} : d));
    setDetail(prev=> prev ? {...prev, stage} : prev);
    notify('거래 단계가 변경되었습니다');
  };

  const removeDeal = (id)=>{
    setDeals(prev=>prev.filter(d=>d.id!==id));
    setDetail(null);
    notify('거래가 삭제되었습니다');
  };

  return (
    <div>
      <div className="board-header">
        <div>
          <div className="topbar-title">영업 파이프라인</div>
          <div className="topbar-sub">거래 {deals.length}건 · 총 예상액 {won(deals.reduce((s,d)=>s+d.amount,0))}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowCreate(true)}><i className="ti ti-plus"></i>새 거래</button>
      </div>
      <div className="filter-row">
        {['전체','이번달','내 담당'].map(f=>(
          <button key={f} className={'chip' + (filter===f ? ' active' : '')} onClick={()=>setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="board">
        {STAGES.map(stage=>{
          const items = visible.filter(d=>d.stage===stage);
          return (
            <section key={stage}
              className={'column' + (overStage===stage ? ' drag-over' : '')}
              onDragOver={e=>{e.preventDefault(); setOverStage(stage);}}
              onDragLeave={()=>setOverStage(prev=> prev===stage ? null : prev)}
              onDrop={()=>onDrop(stage)}>
              <div className="col-header">
                <span className="col-title">{stage}</span>
                <span className="col-count">{items.length}</span>
              </div>
              <div className="col-body">
                {items.map(d=>(
                  <div key={d.id} draggable
                    className={'card' + (dragId===d.id ? ' dragging' : '')}
                    style={{borderRadius:10, boxShadow:'0 1px 2px rgba(0,0,0,0.05)'}}
                    onDragStart={()=>setDragId(d.id)}
                    onDragEnd={()=>{setDragId(null); setOverStage(null);}}
                    onClick={()=>setDetail(d)}>
                    <div className="card-title">{d.title}</div>
                    <span className="tag-neutral">{d.industry}</span>
                    <div className="card-meta-row">
                      <span className="card-amount">{won(d.amount)}</span>
                      <span className="card-avatar">{initials(d.owner)}</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          );
        })}
      </div>

      {showCreate && (
        <Modal title="새 거래 추가" onClose={()=>setShowCreate(false)}
          footer={<React.Fragment><button className="btn btn-ghost" onClick={()=>setShowCreate(false)}>취소</button><button className="btn btn-primary" onClick={submitCreate}>추가</button></React.Fragment>}>
          <div className="field"><label>거래명</label><input value={form.title} onChange={e=>setForm({...form, title:e.target.value})} placeholder="예: 해담공인중개 — 매물관리 CRM" /></div>
          <div className="field"><label>업종</label>
            <select value={form.industry} onChange={e=>setForm({...form, industry:e.target.value})}>
              {PRESETS.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}

          </div>

          <div className="field"><label>담당자</label>

          </div>

            <select value={form.stage} onChange={e=>setForm({...form, stage:e.target.value})}>

            </select>
          </div>
        </Modal>
      )}

      {detail && (
        <Modal title={detail.title} onClose={()=>setDetail(null)}
          footer={<button className="btn btn-danger-ghost" onClick={()=>removeDeal(detail.id)}><i className="ti ti-trash"></i>거래 삭제</button>}>

          <div className="detail-row"><span>예상 금액</span><span>{won(detail.amount)}</span></div>
          <div className="detail-row"><span>담당자</span><span>{detail.owner}</span></div>
          <div className="field" style={{marginTop:16}}>
            <label>거래 단계</label>
            <select value={detail.stage} onChange={e=>changeStage(detail.id, e.target.value)}>
              {STAGES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="field">
            <label>활동 로그</label>
            <div className="timeline-item"><i className="ti ti-message-circle"></i>담당자가 초기 상담 메모를 등록했습니다</div>
            <div className="timeline-item"><i className="ti ti-mail"></i>제안서 초안이 발송되었습니다</div>
            <div className="timeline-item"><i className="ti ti-arrows-exchange"></i>단계가 "{detail.stage}"(으)로 갱신되었습니다</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

const CORE_FIELDS = ['고객명','거래명','활동','이메일','회사명','예상금액','담당자'];

function AiBuilderView({notify}){
  const [messages, setMessages] = useState([
    {role:'assistant', text:'안녕하세요! 스키마를 바꾸고 싶은 내용을 문장으로 말씀해주세요. 예: "계약 단계에 서명일 필드 추가해줘"'},
    {role:'user', text:'계약 단계에 계약서 서명일 필드 추가해줘'},
    {role:'assistant', text:'요청을 확인했습니다. 오른쪽에서 변경안을 검토하고 승인해주세요.'},
  ]);
  const [thinking, setThinking] = useState(false);
  const [diff, setDiff] = useState({
    type:'add', title:'계약완료 단계 필드 추가', field:'계약서_서명일', dtype:'date',
    lines:[{op:'add', text:'+ deals.계약서_서명일 (date, nullable)'}, {op:'add', text:'+ 계약완료 단계 카드에 서명일 배지 표시'}]
  });
  const [applied, setApplied] = useState(['거래 테이블에 "우선순위" 필드 추가 · 3일 전']);
  const [input, setInput] = useState('');
  const logRef = useRef(null);

  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [messages, thinking]);

  const suggestions = ['고객 등급 필드 추가', '담당자 자동배정 규칙 변경', '고객명 필드 삭제'];

  const runRequest = (text)=>{
    if(!text.trim()) return;
    setMessages(prev=>[...prev, {role:'user', text}]);
    setInput('');
    setThinking(true);
    const isDangerous = text.includes('삭제') && CORE_FIELDS.some(f=>text.includes(f));
    setTimeout(()=>{
      setThinking(false);
      if(isDangerous){
        setMessages(prev=>[...prev, {role:'assistant', text:'요청을 분석했지만 고정 코어 필드는 보호 대상이라 삭제할 수 없습니다. 대신 숨김 처리를 제안합니다.'}]);
        setDiff({type:'blocked', title:'코어 스키마 보호 — 요청 거부', lines:[{op:'remove', text:'요청됨: 코어 필드 삭제'}, {op:'block', text:'화이트리스트 검증 실패 — 고정 테이블 컬럼은 삭제 불가'}]});
      } else {
        setMessages(prev=>[...prev, {role:'assistant', text:'요청을 반영한 변경안을 만들었습니다. 오른쪽 미리보기에서 확인해주세요.'}]);
        setDiff({type:'add', title:'테넌트 스키마 변경안', field:text, lines:[{op:'add', text:'+ ' + text.slice(0,24) + ' 관련 필드 추가'}, {op:'add', text:'+ 해당 화면에 입력 컨트롤 자동 배치'}]});
      }
    }, 1200);
  };

  const approve = ()=>{
    setApplied(prev=>[diff.title + ' · 방금 전', ...prev]);
    setDiff(null);
    notify('변경사항이 테넌트 스키마에 적용되었습니다');
  };
  const reject = ()=>{ setDiff(null); notify('변경안을 취소했습니다'); };

  return (
    <div>
      <div className="board-header">
        <div>
          <div className="topbar-title">AI 자연어 빌더 콘솔</div>
          <div className="topbar-sub">자연어 요청 → 변경 diff 미리보기 → 승인 시에만 스키마 반영</div>
        </div>
      </div>
      <div className="ai-wrap">
        <div className="ai-chat">
          <div className="ai-chat-log" ref={logRef}>
            {messages.map((m,i)=>(
              <div key={i} className={'msg-row ' + m.role}>
                <div className="msg-avatar"><i className={'ti ' + (m.role==='assistant' ? 'ti-sparkles' : 'ti-user')}></i></div>
                <div className="msg-bubble">{m.text}</div>
              </div>
            ))}
            {thinking && (
              <div className="msg-row assistant">
                <div className="msg-avatar"><i className="ti ti-sparkles"></i></div>
                <div className="msg-bubble thinking-row"><span className="think-dot"></span><span className="think-dot"></span><span className="think-dot"></span></div>
              </div>
            )}
          </div>
          <div className="ai-suggest-row">
            {suggestions.map(s=>(<button key={s} className="chip" onClick={()=>runRequest(s)}>{s}</button>))}
          </div>
          <div className="ai-input-row">
            <input value={input} onChange={e=>setInput(e.target.value)} placeholder="예: 담당자 필드에 부서 정보 추가해줘"
              onKeyDown={e=>{ if(e.key==='Enter') runRequest(input); }} />
            <button className="ai-send" onClick={()=>runRequest(input)}><i className="ti ti-send"></i></button>
          </div>
        </div>

        <div className="ai-diff">
          {thinking && !diff && (
            <div>
              <div className="skeleton-line" style={{width:'70%'}}></div>
              <div className="skeleton-line" style={{width:'92%'}}></div>
              <div className="skeleton-line" style={{width:'55%'}}></div>
            </div>
          )}
          {!thinking && diff && (
            <div className={'diff-card' + (diff.type==='blocked' ? ' blocked' : '')}>
              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10}}>
                {diff.type==='blocked' ? <span className="badge badge-s2"><i className="ti ti-shield-x"></i>보호됨</span> : <span className="badge badge-s1"><i className="ti ti-sparkles"></i>변경안</span>}
                <span style={{fontSize:13.5, fontWeight:700}}>{diff.title}</span>
              </div>
              {diff.lines.map((l,i)=>(
                <div key={i} className={'diff-line ' + (l.op==='add' ? 'diff-add' : 'diff-remove')}>
                  <i className={'ti ' + (l.op==='add' ? 'ti-plus' : 'ti-ban')}></i>{l.text}
                </div>
              ))}
              {diff.type!=='blocked' && (
                <div className="diff-actions">
                  <button className="btn btn-ghost btn-sm" onClick={reject}>취소</button>
                  <button className="btn btn-primary btn-sm" onClick={approve}><i className="ti ti-check"></i>승인 및 적용</button>
                </div>
              )}
              {diff.type==='blocked' && (
                <div className="diff-actions"><button className="btn btn-ghost btn-sm" onClick={reject}>확인</button></div>
              )}
            </div>
          )}
          {!thinking && !diff && (
            <div className="diff-empty"><i className="ti ti-message-2-code"></i>왼쪽에서 요청을 보내면<br/>변경안이 여기에 표시됩니다</div>
          )}
          <div className="applied-log">
            <div style={{fontSize:12, fontWeight:700, color:'var(--n6)', margin:'18px 0 8px'}}>적용된 변경 이력</div>
            {applied.map((a,i)=>(
              <div key={i} className="applied-item"><i className="ti ti-check" style={{color:'var(--s1)'}}></i>{a}</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

          <div className="perm-cell">거래 편집·이동</div><div className="perm-cell"><i className="ti ti-check" style={{color:'var(--s1)'}}></i></div><div className="perm-cell"><i className="ti ti-check" style={{color:'var(--s1)'}}></i></div><div className="perm-cell"><i className="ti ti-x" style={{color:'var(--n5)'}}></i></div>
          <div className="perm-cell">AI 스키마 변경 승인</div><div className="perm-cell"><i className="ti ti-check" style={{color:'var(--s1)'}}></i></div><div className="perm-cell"><i className="ti ti-x" style={{color:'var(--n5)'}}></i></div><div className="perm-cell"><i className="ti ti-x" style={{color:'var(--n5)'}}></i></div>
          <div className="perm-cell">팀원 초대·제거</div><div className="perm-cell"><i className="ti ti-check" style={{color:'var(--s1)'}}></i></div><div className="perm-cell"><i className="ti ti-x" style={{color:'var(--n5)'}}></i></div><div className="perm-cell"><i className="ti ti-x" style={{color:'var(--n5)'}}></i></div>
        </div>
      </div>

      {showInvite && (
        <Modal title="팀원 초대" onClose={()=>setShowInvite(false)}
          footer={<React.Fragment><button className="btn btn-ghost" onClick={()=>setShowInvite(false)}>취소</button><button className="btn btn-primary" onClick={invite}>초대 보내기</button></React.Fragment>}>
          <div className="field"><label>이메일</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="teammate@company.com" /></div>
          <div className="field"><label>권한</label>
            <select value={role} onChange={e=>setRole(e.target.value)}>
              <option>Owner</option><option>Editor</option><option>Viewer</option>
            </select>
          </div>
        </Modal>
      )}
    </div>
  );
}

function DeployView({notify}){
  const [selected, setSelected] = useState('realestate');
  const [subdomain, setSubdomain] = useState('sinyoung');
  const [stepIdx, setStepIdx] = useState(-1);
  const [showCustom, setShowCustom] = useState(false);
  const steps = ['프리셋 적용','서브도메인 발급','SSL 발급','배포 완료'];

  const publish = ()=>{
    if(stepIdx>=0 && stepIdx<steps.length) return;
    setStepIdx(0);
    let i=0;
    const tick = ()=>{
      i++;
      if(i<steps.length){ setStepIdx(i); setTimeout(tick, 650); }
      else { setStepIdx(steps.length); notify('배포가 완료되었습니다'); }
    };
    setTimeout(tick, 650);
  };

  return (
    <div>
      <div className="board-header">
        <div>
          <div className="topbar-title">업종 프리셋 배포 자동화</div>
          <div className="topbar-sub">업종 프리셋 선택 → Publish → 서브도메인 + SSL 자동 발급</div>
        </div>
      </div>

      <div className="card-panel">
        <div className="panel-head"><div className="panel-title">업종 프리셋 선택</div></div>
        <div className="preset-grid">
          {PRESETS.map(p=>(
            <button key={p.id} className={'preset-card' + (selected===p.id ? ' selected' : '')} onClick={()=>setSelected(p.id)}>
              <i className={'ti ' + p.icon}></i><div className="p-name">{p.name}</div>
            </button>
          ))}
        </div>
      </div>

      <div className="card-panel">
        <div className="panel-head"><div className="panel-title">서브도메인 발급 및 배포</div></div>
        <div className="field" style={{maxWidth:360}}>
          <label>서브도메인</label>
          <div style={{display:'flex', alignItems:'center', gap:6}}>
            <input value={subdomain} onChange={e=>setSubdomain(e.target.value)} />
            <span style={{fontSize:13, color:'var(--n6)'}}>.flowix-demo.io</span>
          </div>
        </div>
        <button className="btn btn-primary" onClick={publish} style={{marginTop:6}}><i className="ti ti-rocket"></i>Publish</button>

        {stepIdx>=0 && (
          <div className="deploy-steps">
            {steps.map((s,i)=>(
              <div key={s} className={'dstep' + (i<stepIdx ? ' done' : i===stepIdx ? ' active' : '')}>
                {i<steps.length-1 && <div className="dstep-line"></div>}
                <div className="dstep-circle"><i className={'ti ' + (i<stepIdx ? 'ti-check' : 'ti-loader-2')}></i></div>
                <div className="dstep-label">{s}</div>
              </div>
            ))}
          </div>
        )}

        {stepIdx>=steps.length && (
          <div className="domain-preview" style={{marginTop:10}}>
            <i className="ti ti-world" style={{color:'var(--s1)'}}></i>
            https://{subdomain}.flowix-demo.io
            <span className="badge badge-s1" style={{marginLeft:'auto'}}><i className="ti ti-lock"></i>SSL 적용됨</span>
          </div>
        )}
      </div>

      <div className="card-panel">
        <div className="panel-head"><div className="panel-title">커스텀 도메인</div><button className="btn btn-ghost btn-sm" onClick={()=>setShowCustom(true)}>연결하기</button></div>
        <div style={{fontSize:12.5, color:'var(--n6)'}}>자체 도메인을 연결하면 DNS 검증 후 SSL이 자동으로 재발급됩니다.</div>
      </div>

      {showCustom && (
        <Modal title="커스텀 도메인 연결" onClose={()=>setShowCustom(false)}
          footer={<React.Fragment><button className="btn btn-ghost" onClick={()=>setShowCustom(false)}>닫기</button><button className="btn btn-primary" onClick={()=>{setShowCustom(false); notify('DNS 검증 대기 중입니다');}}>검증 시작</button></React.Fragment>}>
          <div className="field"><label>도메인</label><input placeholder="crm.내회사도메인.com" /></div>
          <div style={{fontSize:12.5, color:'var(--n6)', lineHeight:1.6}}>
            아래 CNAME 레코드를 DNS에 추가해주세요.<br/>
            <span style={{fontFamily:'SF Mono, monospace'}}>crm → proxy.flowix-demo.io</span>
          </div>
        </Modal>
      )}
    </div>
  );
}

function CustomersView({notify}){
  const [q, setQ] = useState('');
  const [detail, setDetail] = useState(null);
  const filtered = CUSTOMERS.filter(c=>c.name.includes(q) || c.contact.includes(q));

  const statusBadge = (s)=>{
    if(s==='계약완료') return <span className="badge badge-s1">{s}</span>;
    if(s==='휴면') return <span className="badge badge-s3">{s}</span>;
    return <span className="badge badge-n">{s}</span>;
  };

  return (
    <div>
      <div className="board-header">
        <div>
          <div className="topbar-title">고객 관리</div>
          <div className="topbar-sub">거래처 {CUSTOMERS.length}곳 · CRM 코어 데이터</div>
        </div>
      </div>
      <div className="field" style={{maxWidth:320, marginBottom:16}}>
        <input placeholder="고객사·담당자 검색" value={q} onChange={e=>setQ(e.target.value)} />
      </div>
      <div className="card-panel" style={{padding:0}}>
        <table>
          <thead><tr><th>고객사</th><th>담당자</th><th>연락처</th><th>최근 활동</th><th>관련 거래</th><th>상태</th></tr></thead>
          <tbody>
            {filtered.map(c=>(
              <tr key={c.id} className="row-hover" onClick={()=>setDetail(c)}>
                <td style={{fontWeight:600}}>{c.name}</td>
                <td>{c.contact}</td>
                <td style={{color:'var(--n6)'}}>{c.phone}</td>
                <td style={{color:'var(--n6)'}}>{c.last}</td>
                <td>{c.deals}건</td>
                <td>{statusBadge(c.status)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <Modal title={detail.name} onClose={()=>setDetail(null)}>
          <div className="detail-row"><span>담당자</span><span>{detail.contact}</span></div>
          <div className="detail-row"><span>연락처</span><span>{detail.phone}</span></div>
          <div className="detail-row"><span>관련 거래</span><span>{detail.deals}건</span></div>
          <div className="detail-row"><span>상태</span><span>{detail.status}</span></div>
          <div className="field" style={{marginTop:16}}>
            <label>최근 활동</label>
            <div className="timeline-item"><i className="ti ti-phone"></i>{detail.last}</div>
            <div className="timeline-item"><i className="ti ti-note"></i>담당자 메모: 다음 미팅 일정 조율 필요</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [deals, setDeals] = useState(INIT_DEALS);
  const [toast, notify] = useToast();

  const titles = {
    'main':['거래 파이프라인 보드','단계별 칸반 보드로 영업 진행 상황을 관리합니다'],
    'ai-builder':['AI 자연어 빌더 콘솔','자연어로 CRM 스키마를 수정합니다'],
    'customers':['고객 관리','CRM 코어 데이터 — 고객·거래처 정보'],
    'tenant':['멀티테넌트 & 팀 권한 관리','테넌트 격리와 팀원 권한을 관리합니다'],
    'deploy':['업종 프리셋 배포 자동화','업종 프리셋 선택부터 배포까지'],
  };

  return (
    <div className="app-shell" data-archetype="kanban-board">
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="topbar-title">{titles[view][0]}</div>
            <div className="topbar-sub">{titles[view][1]}</div>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" onClick={()=>notify('새 알림이 없습니다')}><i className="ti ti-bell"></i></button>
            <button className="icon-btn" onClick={()=>notify('워크스페이스 설정은 준비 중입니다')}><i className="ti ti-settings"></i></button>
          </div>
        </div>
        <div className="view-body" key={view}>
          {view==='main' && <BoardView deals={deals} setDeals={setDeals} notify={notify} />}
          {view==='ai-builder' && <AiBuilderView notify={notify} />}
          {view==='customers' && <CustomersView notify={notify} />}
          {view==='tenant' && <TenantView notify={notify} />}
          {view==='deploy' && <DeployView notify={notify} />}
        </div>
      </div>
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
