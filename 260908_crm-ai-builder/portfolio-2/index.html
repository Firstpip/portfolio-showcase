<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CRM 빌더 개발자 스킬 마켓 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (hue 271°, light, Dub accent 승격) ── */
:root{
  --m50:#f7f1fe; --m100:#f0e2fc; --m200:#e1c6f9; --m300:#cea3f6; --m400:#ba7cf2;
  --m500:#a658ee; --m600:#9333ea; --m700:#792ac0; --m800:#5e2196; --m900:#421769;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#f0eff0; --n3:#e6e5e6; --n4:#d6d5d7;
  --n5:#b8b5ba; --n6:#949098; --n7:#76717a; --n8:#262626; --n9:#38363a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{font-family:'Pretendard', -apple-system, sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;}
#app{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input, select, textarea{font-family:inherit; font-size:14px;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:4px;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@keyframes heartPop{0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);}}
@keyframes toastIn{from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes shimmer{0%{background-position:-220px 0;} 100%{background-position:220px 0;}}
@keyframes modalIn{from{opacity:0; transform:scale(0.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes barGrow{from{transform:scaleY(0);} to{transform:scaleY(1);}}

/* ── spa-modern 골격 ── */
.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}
.gnav{width:100%; height:64px; border-bottom:1px solid var(--n3); display:flex; align-items:center; justify-content:space-between; padding:0 32px; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); position:sticky; top:0; z-index:50;}
.gnav-left{display:flex; align-items:center; gap:34px;}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px;}
.brand-mark{width:26px; height:26px; border-radius:8px; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;}
.gnav-links{display:flex; align-items:center; gap:4px;}
.gnav-link{padding:8px 14px; border-radius:9999px; font-size:13.5px; font-weight:600; color:var(--n7);}
.gnav-link:hover{background:var(--n2); color:var(--n9);}
.gnav-link.active{background:var(--m50); color:var(--m700);}
.gnav-right{display:flex; align-items:center; gap:10px;}
.avatar-uniform{width:32px; height:32px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0;}
.icon-btn{width:36px; height:36px; border-radius:9999px; display:flex; align-items:center; justify-content:center; color:var(--n7); border:1px solid var(--n3);}
.icon-btn:hover{background:var(--n2);}

.main-area{flex:1; width:100%;}
.view-body{width:100%; max-width:1240px; margin:0 auto; padding:28px 32px 60px; animation:fadeInUp .35s ease both;}
.page-head{margin-bottom:22px;}
.page-title{font-size:36px; font-weight:800; letter-spacing:-0.02em; line-height:1.1;}
.page-sub{font-size:13px; color:var(--n6); margin-top:4px;}

.btn{border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px; transition:all .15s ease;}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{background:var(--n4); color:var(--n6); cursor:not-allowed;}
.btn-ghost{background:var(--n0); color:var(--n8); border:1px solid var(--n3);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.btn-danger{background:var(--n0); color:var(--s2-text); border:1px solid var(--n3);}
.btn-danger:hover{background:var(--s2-bg); border-color:var(--s2);}

/* ── airbnb-search-grid archetype ── */
.market-hero{position:relative; overflow:hidden; border-radius:24px; background:linear-gradient(135deg, var(--m600), var(--m900)); padding:44px 40px; margin-bottom:8px; animation:fadeInUp .4s ease both;}
.hero-wave{position:absolute; inset:0; width:100%; height:100%;}
.market-hero-inner{position:relative; z-index:1; max-width:560px;}
.market-hero-title{color:#fff; font-size:34px; font-weight:800; line-height:1.18; letter-spacing:-0.02em;}
.market-hero-sub{color:rgba(255,255,255,0.82); font-size:13.5px; margin-top:12px; line-height:1.6;}
.market-hero-stats{display:flex; gap:28px; margin-top:26px;}
.hstat-num{color:#fff; font-size:24px; font-weight:800;}
.hstat-label{color:rgba(255,255,255,0.7); font-size:11.5px; margin-top:2px;}
.search-header{position:sticky; top:64px; z-index:40; background:var(--n0); padding:18px 0 14px; border-bottom:1px solid var(--n3);}
.header-row{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px;}
.search-bar{display:flex; align-items:center; border:1px solid var(--n3); border-radius:9999px; box-shadow:0 1px 2px rgba(0,0,0,0.04); overflow:hidden; flex:1; max-width:640px;}
.search-segment{flex:1; border:none; background:none; padding:9px 18px; text-align:left; cursor:pointer;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:10.5px; font-weight:700; color:var(--n8);}
.segment-value{font-size:12px; color:var(--n6); margin-top:1px;}
.search-divider{width:1px; height:26px; background:var(--n3);}
.search-submit{width:38px; height:38px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; margin:5px 6px 5px 0; flex-shrink:0;}
.search-submit:hover{background:var(--m700);}
.filter-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
.chip{flex-shrink:0; padding:7px 15px; border-radius:9999px; font-size:12.5px; font-weight:600; color:var(--n7); background:var(--n0); border:1px solid var(--n3); display:inline-flex; align-items:center; gap:6px;}
.chip.active{background:var(--m50); color:var(--m700); border-color:var(--m300);}

.card-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-top:22px;}
.listing-card{border-radius:16px; overflow:hidden; background:var(--n0); border:1px solid var(--n3); cursor:pointer; transition:box-shadow .18s ease, transform .18s ease; animation:fadeInUp .35s ease both;}
.listing-card:hover{box-shadow:0 10px 28px rgba(0,0,0,0.09); transform:translateY(-2px);}
.card-image-wrap{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--n2);}
.card-image{width:100%; height:100%; object-fit:cover; filter:saturate(0.9);}
.card-favorite{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center; color:var(--n8); box-shadow:0 1px 4px rgba(0,0,0,0.15);}
.card-favorite.on{color:var(--s2);}
.card-favorite.pop i{animation:heartPop .35s ease;}
.card-body{padding:14px 15px 16px;}
.card-row-1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-title{font-size:14.5px; font-weight:700; line-height:1.3;}
.card-rating{font-size:12.5px; font-weight:700; color:var(--n8); display:flex; align-items:center; gap:3px; flex-shrink:0;}
.card-row-2{font-size:12px; color:var(--n6); margin-top:5px;}
.card-row-3{font-size:12px; color:var(--n6); margin-top:2px;}
.card-row-4{display:flex; align-items:baseline; gap:5px; margin-top:9px;}
.card-price{font-size:15px; font-weight:800;}
.price-unit{font-size:11.5px; color:var(--n6);}

/* ── panels / tables ── */
.card-panel{background:var(--n0); border:1px solid var(--n3); border-radius:16px; padding:20px; margin-bottom:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-title{font-size:14.5px; font-weight:800;}
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11px; font-weight:700; color:var(--n6); padding:9px 12px; border-bottom:1px solid var(--n3); text-transform:uppercase; letter-spacing:.03em;}
td{padding:13px 12px; border-bottom:1px solid var(--n2); font-size:13px; vertical-align:middle;}
tr.row-hover:hover{background:var(--n2); cursor:pointer;}
.tag-neutral{padding:3px 9px; border-radius:9999px; font-size:11px; font-weight:600; background:var(--n2); color:var(--n7);}
.badge{padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px;}
.badge-s1{background:var(--s1-bg); color:var(--s1-text);}
.badge-s2{background:var(--s2-bg); color:var(--s2-text);}
.badge-s3{background:var(--s3-bg); color:var(--s3-text);}
.badge-n{background:var(--n2); color:var(--n7);}

/* ── request chat ── */
.req-layout{display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start;}
.req-list{display:flex; flex-direction:column; gap:8px;}
.req-item{border:1px solid var(--n3); border-radius:12px; padding:13px; background:var(--n0);}
.req-item.active{border-color:var(--m400); background:var(--m50);}
.req-item-title{font-size:13px; font-weight:700; margin-bottom:6px;}
.chat-panel{border:1px solid var(--n3); border-radius:16px; background:var(--n0); display:flex; flex-direction:column; height:560px;}
.chat-log{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px;}
.msg-row{display:flex; gap:9px; max-width:80%;}
.msg-row.me{align-self:flex-end; flex-direction:row-reverse;}
.msg-bubble{padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.55;}
.msg-row.dev .msg-bubble{background:var(--n2); border-bottom-left-radius:4px;}
.msg-row.me .msg-bubble{background:var(--m600); color:#fff; border-bottom-right-radius:4px;}
.msg-avatar{width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; background:var(--n2); color:var(--n7);}
.quote-card{border:1px solid var(--m300); background:var(--m50); border-radius:12px; padding:14px; align-self:flex-start; max-width:80%;}
.quote-amount{font-size:16px; font-weight:800; color:var(--m700);}
.chat-input-row{border-top:1px solid var(--n3); padding:12px 14px; display:flex; gap:8px;}
.chat-input-row input{flex:1; border:1px solid var(--n3); border-radius:9999px; padding:10px 16px;}
.chat-input-row input:focus{outline:none; border-color:var(--m400);}

/* ── settlement chart ── */
.bar-chart{display:flex; align-items:flex-end; gap:14px; height:140px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar{width:100%; max-width:34px; border-radius:6px 6px 0 0; background:var(--n3); transform-origin:bottom; animation:barGrow .5s ease both;}
.bar.current{background:var(--m600);}
.bar-label{font-size:10.5px; color:var(--n6); margin-top:7px;}

/* ── review queue ── */
.review-tabs{display:flex; gap:8px; margin-bottom:16px;}
.checklist-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.checklist-row:last-child{border-bottom:none;}
.check-box{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--n4); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.check-box.done{background:var(--m600); border-color:var(--m600); color:#fff;}

/* modal / toast */
.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,0.44); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--n0); border-radius:18px; width:100%; max-width:540px; max-height:86vh; overflow-y:auto; padding:24px; animation:modalIn .18s ease both;}
.modal-box.wide{max-width:680px;}
.modal-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-title{font-size:16px; font-weight:800;}
.close-x{width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.close-x:hover{background:var(--n2);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--n7); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; border:1px solid var(--n3); border-radius:10px; padding:9px 12px; background:var(--n0);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--m400);}
.modal-footer{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
.detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.detail-row span:first-child{color:var(--n6);}
.detail-row span:last-child{font-weight:700;}
.wizard-steps{display:flex; gap:6px; margin-bottom:18px;}
.wizard-step{flex:1; height:4px; border-radius:9999px; background:var(--n3);}
.wizard-step.done{background:var(--m600);}
.perm-item{display:flex; align-items:center; gap:9px; padding:8px 0; font-size:13px;}

.skeleton-line{height:12px; border-radius:4px; background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:400px 100%; animation:shimmer 1.4s ease infinite; margin-bottom:8px;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--n9); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .2s ease both;}
.toast i{color:var(--s1);}

.footer{width:100%; border-top:1px solid var(--n3); background:var(--n1); margin-top:auto;}
.footer-cols{max-width:1240px; margin:0 auto; padding:36px 32px; display:grid; grid-template-columns:1.4fr repeat(3, 1fr); gap:24px;}
.footer-col h4{font-size:12px; font-weight:700; color:var(--n7); margin-bottom:10px;}
.footer-col a{display:block; font-size:12.5px; color:var(--n6); padding:4px 0;}
.footer-bottom{text-align:center; font-size:11.5px; color:var(--n6); padding:14px; border-top:1px solid var(--n3);}

@media (max-width:980px){.card-grid{grid-template-columns:repeat(2,1fr);} .req-layout{grid-template-columns:1fr;}}
@media (max-width:600px){
  .gnav{padding:0 14px;}
  .gnav-left{gap:10px;}
  .gnav-links{display:none;}
  .view-body{padding:20px 14px 40px;}
  .card-grid{grid-template-columns:1fr;}
  .header-row{flex-direction:column; align-items:stretch;}
  .search-bar{max-width:100%;}
  .market-hero{padding:28px 20px;}
  .market-hero-title{font-size:26px;}
  .market-hero-stats{gap:18px; flex-wrap:wrap;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

const NAV = [
  {id:'main', label:'스킬 마켓', icon:'ph-storefront'},
  {id:'request', label:'의뢰 관리', icon:'ph-chats-circle'},

const CATEGORIES = ['전체','알림·메시징','결제·정산','데이터 가져오기','AI 자동화','문서 자동화','캘린더·일정'];

  {id:7, name:'카카오페이 결제 연동', cat:'결제·정산', dev:'페이브릿지', price:'39,000원/월', rating:4.4, installs:275, seed:'skill-7', desc:'견적서에 카카오페이 결제 링크를 자동 삽입합니다.'},

  {id:9, name:'고객만족도 설문봇', dev:'보이스루프', cat:'AI 자동화', price:'25,000원/월', rating:4.6, installs:410, seed:'skill-9', desc:'계약완료 3일 후 만족도 설문을 자동 발송합니다.'},

const REQUESTS = [
  {id:1, title:'카카오 채널 상담 연동 커스텀', buyer:'신영공인중개법인', status:'진행중'},

  {id:3, title:'B2B 리드 자동 배정 규칙', buyer:'그로스랩', status:'대기'},

function useToast(){
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const show = (msg)=>{ setToast(msg); if(timerRef.current) clearTimeout(timerRef.current); timerRef.current = setTimeout(()=>setToast(null), 2600); };
  return [toast, show];
}
function Toast({msg}){ if(!msg) return null; return <div className="toast"><i className="ph-fill ph-check-circle"></i>{msg}</div>; }

function Modal({title, wide, onClose, children, footer}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={'modal-box' + (wide ? ' wide' : '')} onClick={e=>e.stopPropagation()}>
        <div className="modal-title-row"><div className="modal-title">{title}</div><button className="close-x" onClick={onClose}><i className="ph ph-x"></i></button></div>
        {children}
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

function RequestView({notify}){
  const [activeId, setActiveId] = useState(1);
  const [messages, setMessages] = useState({
    1:[{role:'buyer', text:'카카오 채널 상담 내용을 CRM 활동 로그에 자동 기록하고 싶어요.'}, {role:'dev', text:'가능합니다. 견적을 제시했습니다.'}],
    2:[{role:'buyer', text:'보험 약관 조회 챗봇을 저희 CRM 안에 붙이고 싶습니다.'}],
    3:[{role:'buyer', text:'리드 자동 배정 규칙을 팀 규모에 맞게 커스텀하고 싶어요.'}],
  });
  const [quotes, setQuotes] = useState({1:{amount:1200000, agreed:true}, 2:{amount:850000, agreed:false}, 3:null});
  const [input, setInput] = useState('');
  const active = REQUESTS.find(r=>r.id===activeId);
  const logRef = useRef(null);
  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [messages, activeId]);

  const send = ()=>{
    if(!input.trim()) return;
    setMessages(prev=>({...prev, [activeId]: [...prev[activeId], {role:'buyer', text:input}]}));
    setInput('');
  };

  const proposeQuote = ()=>{
    const amount = 900000 + activeId*150000;
    setQuotes(prev=>({...prev, [activeId]:{amount, agreed:false}}));
    setMessages(prev=>({...prev, [activeId]: [...prev[activeId], {role:'dev', text:'견적을 제시했습니다. 확인 후 승인해주세요.'}]}));
    notify('견적을 제시했습니다');
  };

  const approveQuote = ()=>{
    setQuotes(prev=>({...prev, [activeId]: {...prev[activeId], agreed:true}}));
    setMessages(prev=>({...prev, [activeId]: [...prev[activeId], {role:'buyer', text:'견적에 동의하고 결제했습니다. 작업을 시작해주세요.'}]}));
    notify('결제가 완료되어 작업이 시작되었습니다');
  };

  const statusBadge = (s)=>{
    if(s==='진행중') return <span className="badge badge-s1">{s}</span>;
    if(s==='견적 제시') return <span className="badge badge-s3">{s}</span>;
    return <span className="badge badge-n">{s}</span>;
  };

  return (
    <div>
      <div className="page-head"><div className="page-title">커스텀 개발 의뢰 & 견적</div><div className="page-sub">구매자 의뢰 → 채팅 협의 → 견적 → 결제 후 작업 시작</div></div>
      <div className="req-layout">
        <div className="req-list">
          {REQUESTS.map(r=>(
            <div key={r.id} className={'req-item' + (activeId===r.id ? ' active' : '')} onClick={()=>setActiveId(r.id)} style={{cursor:'pointer'}}>
              <div className="req-item-title">{r.title}</div>
              <div style={{fontSize:12, color:'var(--n6)', marginBottom:8}}>{r.buyer}</div>
              {statusBadge(r.status)}
            </div>
          ))}
        </div>
        <div className="chat-panel">
          <div className="chat-log" ref={logRef}>
            {messages[activeId].map((m,i)=>(
              <div key={i} className={'msg-row ' + (m.role==='buyer' ? 'me' : 'dev')}>
                <div className="msg-avatar"><i className={'ph ' + (m.role==='buyer' ? 'ph-user' : 'ph-code')}></i></div>
                <div className="msg-bubble">{m.text}</div>
              </div>
            ))}
            {quotes[activeId] && (
              <div className="quote-card">
                <div style={{fontSize:12, color:'var(--n7)', marginBottom:4}}>제시 견적</div>
                <div className="quote-amount">₩{won(quotes[activeId].amount)}</div>
                {!quotes[activeId].agreed ? (
                  <button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={approveQuote}><i className="ph ph-credit-card"></i>결제 및 승인</button>
                ) : (
                  <div style={{marginTop:10}}><span className="badge badge-s1"><i className="ph ph-check"></i>결제 완료 · 작업중</span></div>
                )}
              </div>
            )}
          </div>
          <div style={{padding:'0 14px 10px', display:'flex', gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={proposeQuote} disabled={!!quotes[activeId]}><i className="ph ph-receipt"></i>견적 제시</button>
          </div>
          <div className="chat-input-row">
            <input value={input} onChange={e=>setInput(e.target.value)} placeholder="메시지를 입력하세요" onKeyDown={e=>{ if(e.key==='Enter') send(); }} />
            <button className="btn btn-primary btn-sm" onClick={send}><i className="ph ph-paper-plane-tilt"></i></button>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [checks, setChecks] = useState({perm:false, compat:false, security:false});

          <div style={{fontSize:12.5, color:'var(--n6)', marginBottom:10}}>개발사: {detail.dev}</div>
          <div className="checklist-row"><button className={'check-box' + (checks.perm ? ' done' : '')} onClick={()=>setChecks({...checks, perm:!checks.perm})}>{checks.perm && <i className="ph ph-check" style={{fontSize:12}}></i>}</button>권한 범위가 매니페스트와 일치함</div>
          <div className="checklist-row"><button className={'check-box' + (checks.compat ? ' done' : '')} onClick={()=>setChecks({...checks, compat:!checks.compat})}>{checks.compat && <i className="ph ph-check" style={{fontSize:12}}></i>}</button>호환 버전 범위가 명시됨</div>
          <div className="checklist-row"><button className={'check-box' + (checks.security ? ' done' : '')} onClick={()=>setChecks({...checks, security:!checks.security})}>{checks.security && <i className="ph ph-check" style={{fontSize:12}}></i>}</button>보안 스캔 결과 이상 없음</div>
          {showReject && (
            <div className="field" style={{marginTop:14}}>
              <label>거절 사유 (필수)</label>
              <textarea rows="3" value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="거절 사유를 입력하세요"></textarea>
              <div style={{display:'flex', gap:8, marginTop:10, justifyContent:'flex-end'}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>setShowReject(false)}>취소</button>
                <button className="btn btn-danger btn-sm" disabled={!rejectReason.trim()} onClick={()=>{ setDetail(null); setShowReject(false); notify('거절 사유가 개발자 콘솔에 전달되었습니다'); }}>거절 확정</button>
              </div>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

function DeveloperConsoleView({notify}){
  const [showUpload, setShowUpload] = useState(false);
  const myskills = SKILLS.slice(0,3).map((s,i)=>({...s, status:['승인됨','검토중','승인됨'][i], sold: [22,4,58][i]*10000}));
  return (
    <div>
      <div className="page-head"><div className="page-title">개발자 콘솔</div><div className="page-sub">등록한 스킬 현황과 판매 수익을 관리합니다</div></div>
      <div className="card-panel">
        <div className="panel-head"><div className="panel-title">내 스킬</div><button className="btn btn-primary btn-sm" onClick={()=>setShowUpload(true)}><i className="ph ph-upload-simple"></i>새 스킬 등록</button></div>
        <table>
          <thead><tr><th>스킬명</th><th>상태</th><th>누적 판매액</th></tr></thead>
          <tbody>
            {myskills.map(s=>(
              <tr key={s.id}>
                <td style={{fontWeight:600}}>{s.name}</td>
                <td>{s.status==='승인됨' ? <span className="badge badge-s1">승인됨</span> : <span className="badge badge-s3">검토중</span>}</td>
                <td>₩{won(s.sold)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {showUpload && (
        <Modal title="새 스킬 등록" onClose={()=>setShowUpload(false)}
          footer={<React.Fragment><button className="btn btn-ghost" onClick={()=>setShowUpload(false)}>취소</button><button className="btn btn-primary" onClick={()=>{setShowUpload(false); notify('스킬이 심사 큐에 등록되었습니다');}}>심사 요청</button></React.Fragment>}>
          <div className="field"><label>스킬명</label><input placeholder="예: 우편번호 자동완성" /></div>
          <div className="field"><label>카테고리</label>
            <select>{CATEGORIES.filter(c=>c!=='전체').map(c=><option key={c}>{c}</option>)}</select>
          </div>
          <div style={{border:'1.5px dashed var(--n4)', borderRadius:12, padding:24, textAlign:'center', color:'var(--n6)', fontSize:12.5}}>
            <i className="ph ph-cloud-arrow-up" style={{fontSize:28, display:'block', marginBottom:8}}></i>
            매니페스트 파일(.json)을 드래그하거나 클릭해 업로드
          </div>
        </Modal>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toast, notify] = useToast();
  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <GlobalNav view={view} setView={setView} notify={notify} />
      <div className="main-area">
        <div className="view-body" key={view}>
          {view==='main' && <MarketView notify={notify} />}
          {view==='request' && <RequestView notify={notify} />}
          {view==='settlement' && <SettlementView notify={notify} />}
          {view==='review' && <ReviewView notify={notify} />}
          {view==='developer-console' && <DeveloperConsoleView notify={notify} />}
        </div>
      </div>
      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col"><div className="brand" style={{marginBottom:8}}><div className="brand-mark">S</div>스킬허브</div><div style={{fontSize:12, color:'var(--n6)'}}>AI CRM 빌더 개발자 스킬 마켓</div></div>
          <div className="footer-col"><h4>마켓</h4><a>스킬 마켓</a><a>인기 스킬</a><a>신규 등록</a></div>
          <div className="footer-col"><h4>개발자</h4><a>개발자 콘솔</a><a>정산 안내</a><a>등록 가이드</a></div>
          <div className="footer-col"><h4>지원</h4><a>고객센터</a><a>이용약관</a><a>개인정보처리방침</a></div>
        </div>
        <div className="footer-bottom">© 2026 스킬허브 — 자체 개발 프로젝트</div>
      </footer>
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
