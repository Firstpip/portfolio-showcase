<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매스뱅크 문제은행 콘텐츠 관리 시스템 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 208°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbecfa; --m200:#b8d8f6; --m300:#8cc1f0; --m400:#5ca7ea;
  --m500:#2e8ee4; --m600:#0075de; --m700:#0060b6; --m800:#004b8e; --m900:#003564;
  --n0:#f6f5f4; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909498; --n7:#757575; --n8:#53575a; --n9:#36383a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:10px; --radius-btn:8px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
#root{width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(31,137,75,.45);}70%{box-shadow:0 0 0 8px rgba(31,137,75,0);}100%{box-shadow:0 0 0 0 rgba(31,137,75,0);}}
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
@keyframes drawLine{from{stroke-dashoffset:500;}to{stroke-dashoffset:0;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ── layout shell ── */
.shell{display:flex;width:100%;min-height:100vh;}

/* ── 시그니처 1: 트리 사이드바 ── */
.tree-sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;background:var(--n1);border-right:1px solid var(--n3);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:8px 8px 12px;font-weight:800;font-size:14px;color:var(--n10);}
.sidebar-brand .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.sidebar-search{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;}
.tree-flat-btn{display:flex;align-items:center;gap:8px;background:none;border:none;padding:7px 8px;border-radius:var(--radius-btn);font-size:13px;color:var(--n8);text-align:left;width:100%;}
.tree-flat-btn:hover{background:var(--n2);}
.tree-nav{flex:1;}
.tree-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--n8);}
.tree-item:hover{background:var(--n2);}
.tree-item.active{background:var(--m50);color:var(--m700);font-weight:700;}
.tree-toggle{background:none;border:none;width:14px;flex-shrink:0;font-size:10px;color:var(--n6);padding:0;}
.lvl0{font-weight:700;font-size:13.5px;}
.lvl1{padding-left:28px;}
.lvl2{padding-left:56px;}
.lvl3{padding-left:84px;font-size:13px;}
.tree-section-label{font-size:10.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.05em;padding:14px 8px 6px;}
.sidebar-footer{border-top:1px solid var(--n3);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:2px;}

/* ── 시그니처 2: canvas (block editor) ── */
.main-wrap{margin-left:246px;flex:1;min-width:0;width:calc(100% - 246px);display:flex;}
.canvas-col{flex:1;min-width:0;}
.page-breadcrumb{display:flex;align-items:center;gap:6px;padding:14px 30px;border-bottom:1px solid var(--n3);font-size:12.5px;color:var(--n6);flex-wrap:wrap;}
.page-breadcrumb .crumb-current{color:var(--n10);font-weight:700;}
.page-body{max-width:820px;margin:0 auto;padding:36px 32px 64px;}

/* ── 시그니처 절차적 비주얼: 워크스페이스 히어로 배너 (단일 hue 그라데이션) ── */
.notebook-hero{display:flex;align-items:center;gap:16px;padding:22px 26px;border-radius:18px;margin-bottom:26px;background:linear-gradient(135deg,var(--m50) 0%,var(--n0) 58%,var(--m100) 100%);border:1px solid var(--m100);position:relative;overflow:hidden;animation:fadeInUp .3s ease both;}
.notebook-hero::after{content:'';position:absolute;right:-36px;top:-42px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--m200) 0%,transparent 70%);opacity:.55;pointer-events:none;}
.notebook-hero::before{content:'';position:absolute;left:40%;bottom:-60px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--m300) 0%,transparent 72%);opacity:.28;pointer-events:none;}
.notebook-hero-glyph{width:46px;height:46px;border-radius:13px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
.notebook-hero-text{position:relative;z-index:1;}
.notebook-hero-label{font-size:11px;font-weight:800;color:var(--m700);text-transform:uppercase;letter-spacing:.07em;}
.notebook-hero-sub{font-size:16px;font-weight:700;color:var(--n10);margin-top:3px;}
.notebook-hero-count{margin-left:auto;font-size:30px;font-weight:800;color:var(--m700);display:flex;flex-direction:column;align-items:flex-end;line-height:1;position:relative;z-index:1;}
.notebook-hero-count span{font-size:10.5px;font-weight:700;color:var(--n6);margin-top:5px;letter-spacing:.02em;}
.problem-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.problem-tab{padding:6px 12px;border-radius:9999px;border:1px solid var(--n3);background:var(--n1);font-size:12.5px;color:var(--n7);font-weight:600;}
.problem-tab.active{border-color:var(--m600);background:var(--m50);color:var(--m700);}
.problem-tab.inactive-flag{opacity:.55;}
.page-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.page-icon-large{width:44px;height:44px;border-radius:10px;background:var(--m50);color:var(--m700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.page-meta{display:flex;gap:6px;margin-left:auto;}
.meta-action{display:flex;align-items:center;gap:5px;background:none;border:none;padding:6px 10px;border-radius:var(--radius-btn);font-size:12px;color:var(--n7);font-weight:600;}
.meta-action:hover{background:var(--n2);}
.page-title-input{font-size:26px;font-weight:800;letter-spacing:-.01em;border:none;outline:none;width:100%;padding:2px 0;margin:6px 0 18px;background:transparent;color:var(--n10);}

.block{margin-bottom:16px;position:relative;}
.block-callout{display:flex;gap:10px;align-items:flex-start;background:var(--m50);border-radius:var(--radius-card);padding:14px;}
.block-callout.warn{background:var(--s3-bg);}
.block-callout p{margin:0;font-size:13.5px;color:var(--n9);line-height:1.55;}
.block-heading h2{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.005em;}
.block-text p{font-size:14.5px;line-height:1.7;color:var(--n9);margin:0;outline:none;border-radius:6px;padding:4px 6px;margin:0 -6px;}
.block-text p:focus{background:var(--n2);}
.block-code{background:var(--n9);color:var(--n1);border-radius:8px;padding:12px 14px;font-family:'SFMono-Regular',Menlo,monospace;font-size:12.5px;overflow-x:auto;}
.block-table table{width:100%;border-collapse:collapse;font-size:13.5px;}
.block-table td{padding:8px 0;border-bottom:1px solid var(--n3);}
.block-table td:first-child{color:var(--n6);width:130px;}
.block-table td:last-child{font-weight:700;color:var(--n10);}
.block-toggle{border:1px solid var(--n3);border-radius:var(--radius-card);padding:12px 14px;}
.toggle-head{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;font-size:14px;font-weight:700;width:100%;text-align:left;color:var(--n10);}
.toggle-content{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.choice-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--n3);font-size:13.5px;}
.choice-row.correct{border-color:var(--s1);background:var(--s1-bg);}
.choice-letter{width:22px;height:22px;border-radius:50%;background:var(--n2);color:var(--n7);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.choice-row.correct .choice-letter{background:var(--s1);color:#fff;}
.block-divider hr{border:none;border-top:1px solid var(--n3);margin:20px 0;}
.block-list .tag-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;background:var(--n2);color:var(--n7);font-size:12px;font-weight:600;margin:0 6px 6px 0;}
.block-list .tag-chip button{background:none;border:none;color:var(--n6);padding:0;display:flex;}
.tag-add-input{border:1px dashed var(--n4);border-radius:9999px;padding:4px 10px;font-size:12px;width:96px;}

.canvas-toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}

/* ── 시그니처 3: 우측 인스펙터 ── */
.inspector{width:296px;flex-shrink:0;border-left:1px solid var(--n3);background:var(--n1);padding:22px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.inspector h3{font-size:12.5px;font-weight:800;color:var(--n7);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;}
.inspector-section{margin-bottom:24px;}
.status-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--n3);border-radius:8px;}
.switch{width:38px;height:22px;border-radius:9999px;background:var(--n3);position:relative;border:none;padding:0;flex-shrink:0;}
.switch.on{background:var(--s1);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s ease;}
.switch.on .knob{transform:translateX(16px);}
.preview-box{border:1px solid var(--n3);border-radius:8px;padding:14px;background:var(--n0);}
.difficulty-select,.mini-select{width:100%;padding:8px 10px;border:1px solid var(--n3);border-radius:8px;font-size:13px;background:var(--n1);color:var(--n10);}
.autosave-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--n6);margin-top:16px;}
.autosave-dot{width:7px;height:7px;border-radius:50%;background:var(--s1);animation:pulseDot 1.8s infinite;}

/* ── buttons ── */
.btn{border-radius:var(--radius-btn);font-size:13px;font-weight:700;padding:8px 14px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:opacity .12s ease,background .12s ease;}
.btn-primary{background:var(--m600);color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{background:var(--n1);border-color:var(--n3);color:var(--n9);}
.btn-ghost:hover{background:var(--n2);}
.btn-danger{background:var(--s2-bg);color:var(--s2-text);}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ── screens: 수식·도형 에디터 ── */
.screen-body{max-width:1000px;margin:0 auto;padding:30px 36px 60px;}
.screen-head{margin-bottom:22px;}
.screen-title{font-size:46px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;line-height:1.04;}
.screen-sub{font-size:13.5px;color:var(--n7);margin:0;}
.editor-panel{background:var(--n1);border:1px solid var(--n3);border-radius:14px;padding:22px;margin-bottom:18px;}
.symbol-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.symbol-btn{width:46px;height:44px;border-radius:8px;border:1px solid var(--n3);background:var(--n0);font-size:16px;font-weight:700;color:var(--n9);}
.symbol-btn:hover{background:var(--m50);border-color:var(--m300);color:var(--m700);}
.formula-input{width:100%;padding:12px 14px;border:1px solid var(--n3);border-radius:8px;font-family:'SFMono-Regular',Menlo,monospace;font-size:13.5px;margin-bottom:14px;}
.formula-preview{background:var(--n0);border:1px dashed var(--n4);border-radius:8px;padding:20px;text-align:center;font-size:22px;min-height:70px;display:flex;align-items:center;justify-content:center;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:16px;}
.frac .num{padding:0 4px 2px;border-bottom:1.5px solid var(--n10);}
.frac .den{padding:2px 4px 0;}
.grid-wrap{display:flex;gap:18px;flex-wrap:wrap;}
.grid-panel{flex:1;min-width:320px;}
.mode-tabs{display:flex;gap:6px;margin-bottom:12px;}
.mode-tab{padding:6px 14px;border-radius:9999px;border:1px solid var(--n3);background:var(--n1);font-size:12.5px;font-weight:700;color:var(--n7);}
.mode-tab.active{background:var(--m600);color:#fff;border-color:var(--m600);}
.coord-svg{width:100%;border:1px solid var(--n3);border-radius:10px;background:var(--n1);cursor:crosshair;}

/* ── 표시형식 설정 ── */
.settings-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;}
.settings-panel{background:var(--n1);border:1px solid var(--n3);border-radius:14px;padding:22px;}
.field-row{margin-bottom:18px;}
.field-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--n9);margin-bottom:8px;}
.field-row input[type=range]{width:100%;accent-color:var(--m600);}
.field-row select{width:100%;padding:9px 10px;border:1px solid var(--n3);border-radius:8px;font-size:13px;}
.preset-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--n3);border-radius:8px;margin-bottom:8px;font-size:12.5px;}
.preview-pane{background:var(--n1);border:1px solid var(--n3);border-radius:14px;padding:22px;position:sticky;top:20px;height:fit-content;}
.progress-track{width:100%;height:8px;border-radius:9999px;background:var(--n2);overflow:hidden;margin:14px 0;}
.progress-fill{height:100%;background:var(--m600);border-radius:9999px;transition:width .25s ease;}

/* ── 검색 화면 ── */
.search-bar{position:relative;margin-bottom:14px;}
.search-bar input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--n3);border-radius:10px;font-size:14px;}
.search-bar .search-icon{position:absolute;left:12px;top:12px;color:var(--n6);}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-chip{padding:6px 13px;border-radius:9999px;border:1px solid var(--n3);background:var(--n1);font-size:12.5px;font-weight:600;color:var(--n7);}
.filter-chip.active{background:var(--n9);color:#fff;border-color:var(--n9);}
.result-card{display:flex;justify-content:space-between;align-items:flex-start;background:var(--n1);border:1px solid var(--n3);border-radius:12px;padding:16px 18px;margin-bottom:10px;animation:fadeInUp .25s ease both;}
.result-skel{height:74px;border-radius:12px;background:linear-gradient(90deg,var(--n2) 25%,var(--n1) 37%,var(--n2) 63%);background-size:400px 100%;animation:shimmer 1.3s infinite linear;margin-bottom:10px;}
.status-badge{padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:700;}
.status-badge.active{background:var(--s1-bg);color:var(--s1-text);}
.status-badge.inactive{background:var(--n2);color:var(--n7);}
.tab-row{display:flex;gap:6px;margin-bottom:16px;}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.image-tile{border:1px solid var(--n3);border-radius:10px;overflow:hidden;background:var(--n1);}
.image-thumb{height:80px;display:flex;align-items:center;justify-content:center;color:var(--n5);}
.image-meta{padding:8px 10px;font-size:11px;color:var(--n7);}
.reuse-badge{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:9999px;background:var(--m50);color:var(--m700);font-size:10.5px;font-weight:700;}

/* ── 변경 이력 ── */
.history-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n3);border-radius:12px;overflow:hidden;}
.history-table th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:11px 14px;background:var(--n0);border-bottom:1px solid var(--n3);}
.history-table td{padding:11px 14px;font-size:12.5px;border-bottom:1px solid var(--n3);color:var(--n9);}
.action-badge{padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700;}
.action-badge.create{background:var(--s1-bg);color:var(--s1-text);}
.action-badge.update{background:var(--m50);color:var(--m700);}
.action-badge.delete{background:var(--s2-bg);color:var(--s2-text);}
.action-badge.toggle{background:var(--s3-bg);color:var(--s3-text);}
.diff-box{flex:1;border-radius:8px;padding:12px;font-size:13px;line-height:1.6;}
.diff-before{background:var(--s2-bg);color:var(--s2-text);text-decoration:line-through;}
.diff-after{background:var(--s1-bg);color:var(--s1-text);}

/* ── modal / toast ── */
.modal-overlay{position:fixed;inset:0;background:rgba(16,16,16,.45);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:440px;padding:26px;animation:fadeInScale .18s ease;}
.modal-box.wide{max-width:640px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--n10);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:900;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;}

@media (max-width:1080px){
  .settings-grid{grid-template-columns:1fr;}
  .inspector{display:none;}
}
</style>
</head>
<body data-archetype="notion-blocks-tree">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const Icon = ({ name, size=15, ...rest }) => <i data-lucide={name} style={{width:size,height:size}} {...rest}></i>;

/* ── 트리 데이터 (과목 > 대분류 > 중분류 > 소분류) ── */
const TREE = {
  id:'math', label:'수학', children:[
    { id:'number-op', label:'수와 연산', children:[
      { id:'fraction', label:'분수의 덧셈과 뺄셈', children:[
        { id:'diff-denom', label:'분모가 다른 진분수 덧셈' },
        { id:'mixed-num', label:'대분수의 뺄셈' },
      ]},
      { id:'decimal', label:'소수의 곱셈과 나눗셈', children:[
        { id:'decimal-mul', label:'소수 두 자리 곱셈' },
      ]},
    ]},
    { id:'shape-measure', label:'도형과 측정', children:[
      { id:'plane-figure', label:'평면도형의 넓이', children:[
        { id:'triangle-area', label:'삼각형 넓이 구하기' },
      ]},
      { id:'coordinate', label:'좌표평면과 그래프', children:[
        { id:'linear-graph', label:'일차함수 그래프 해석' },
      ]},
    ]},
    { id:'pattern', label:'규칙성과 자료', children:[
      { id:'ratio', label:'비와 비례식', children:[
        { id:'ratio-basic', label:'비례식의 성질' },
      ]},
    ]},

};

const LARGE_CATS = ['수와 연산','도형과 측정','규칙성과 자료'];

function collectLeafIds(node) {
  if (!node.children) return [node.id];
  return node.children.flatMap(collectLeafIds);
}
function findPath(node, id, trail=[]) {
  const next = [...trail, node];
  if (node.id === id) return next;
  if (!node.children) return null;
  for (const c of node.children) {
    const found = findPath(c, id, next);
    if (found) return found;
  }
  return null;
}

function FormulaPreview({ latex }) {
  const fracMatch = latex.match(/\\frac\{([^}]*)\}\{([^}]*)\}/);
  if (fracMatch) {
    return <span><span className="frac"><span className="num">{fracMatch[1]}</span><span className="den">{fracMatch[2]}</span></span>{latex.replace(fracMatch[0],'').replace(/\\times/g,'×')}</span>;
  }
  return <span>{latex.replace(/\\times/g,'×').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'$1/$2')}</span>;
}

const SYMBOLS = [
  { label:'½', insert:'\\frac{a}{b}' },
  { label:'√', insert:'\\sqrt{a}' },
  { label:'xⁿ', insert:'x^{n}' },
  { label:'f(x)', insert:'f(x)=' },
  { label:'∫', insert:'\\int_{a}^{b}' },
];
const GRAPH_PRESETS = {
  'y=2x-3': x => 2*x-3,
  'y=-0.5x²+3': x => -0.5*x*x+3,
  'y=x²/4-2': x => (x*x)/4-2,
};
function EditorScreen({ problems, pushToast }) {
  const [targetId, setTargetId] = useState(problems[0]?.id);
  const [formula, setFormula] = useState('\\frac{1}{3}+\\frac{1}{4}');
  const [history, setHistory] = useState([]);
  const [mode, setMode] = useState('points');
  const [points, setPoints] = useState([{x:-3,y:-1},{x:0,y:2},{x:3,y:1}]);
  const [preset, setPreset] = useState('y=2x-3');
  const svgRef = useRef(null);

  const insertSymbol = (snippet) => {
    setHistory(h => [...h, formula]);
    setFormula(f => f + snippet);
  };
  const undo = () => {
    if (!history.length) return;
    setFormula(history[history.length-1]);
    setHistory(h => h.slice(0,-1));
  };

  const toSvg = (x,y) => ({ sx: 150 + x*20, sy: 150 - y*20 });
  const handleGridClick = (e) => {
    if (mode !== 'points') return;
    const rect = svgRef.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * 300;
    const py = (e.clientY - rect.top) / rect.height * 300;
    const x = Math.round((px-150)/20);
    const y = Math.round((150-py)/20);
    setPoints(p => [...p, {x,y}]);
  };
  const fn = GRAPH_PRESETS[preset];
  const funcPoints = [];
  for (let x=-7; x<=7; x+=0.5) funcPoints.push(toSvg(x, Math.max(-7,Math.min(7,fn(x)))));

  return (
    <div className="screen-body">

            <div className="grid-panel">
              <div style={{display:'flex',gap:8,marginBottom:10}}>
                {Object.keys(GRAPH_PRESETS).map(k => <button key={k} className={`mode-tab ${preset===k?'active':''}`} onClick={()=>setPreset(k)}>{k}</button>)}
              </div>
              <svg className="coord-svg" viewBox="0 0 300 300">
                {Array.from({length:15}).map((_,i)=><line key={'v'+i} x1={i*20} y1="0" x2={i*20} y2="300" stroke="var(--n2)" strokeWidth="1"/>)}
                {Array.from({length:15}).map((_,i)=><line key={'h'+i} x1="0" y1={i*20} x2="300" y2={i*20} stroke="var(--n2)" strokeWidth="1"/>)}
                <line x1="0" y1="150" x2="300" y2="150" stroke="var(--n5)" strokeWidth="1.5"/>

            </div>

      </div>
    </div>
  );
}

/* ── 표시형식 분리 설정 & 일괄 반영 ── */
function DisplaySettingsScreen({ display, setDisplay, pushToast, pushHistory }) {
  const [presets, setPresets] = useState([
    { name:'기본 프리셋', font:'sans', size:16, lineHeight:1.6, layout:'1단' },
    { name:'저학년용 확대', font:'sans', size:19, lineHeight:1.8, layout:'1단' },
  ]);
  const [applyScope, setApplyScope] = useState('전체');
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [applying, setApplying] = useState(0);

  const runBulkApply = () => {
    setConfirmOpen(false);
    setApplying(1);
    const t = setInterval(() => {
      setApplying(v => {
        if (v >= 100) { clearInterval(t); pushHistory('update','표시형식 · '+applyScope, applyScope+' 범위 문항에 표시형식이 일괄 반영되었습니다.'); pushToast('표시형식이 128개 문항에 일괄 반영되었습니다'); return 0; }

    }, 140);
  };

  return (
    <div className="screen-body">
      <div className="screen-head">
        <h1 className="screen-title">표시형식 분리 설정 & 일괄 반영</h1>
        <p className="screen-sub">문항 내용은 그대로 두고 글꼴·크기·줄간격·배치만 별도로 바꿔 대상 분류 전체에 한 번에 반영합니다.</p>
      </div>

      <div className="settings-grid">
        <div className="settings-panel">
          <div className="field-row">
            <label><span>글꼴</span></label>
            <select value={display.font} onChange={e=>setDisplay(d=>({...d, font:e.target.value}))}>
              <option value="sans">Pretendard (기본)</option>
              <option value="serif">Noto Serif KR (세리프)</option>
            </select>
          </div>
          <div className="field-row">
            <label><span>글자 크기</span><span>{display.size}px</span></label>
            <input type="range" min="13" max="22" value={display.size} onChange={e=>setDisplay(d=>({...d, size:+e.target.value}))} />
          </div>
          <div className="field-row">
            <label><span>줄 간격</span><span>{display.lineHeight}</span></label>
            <input type="range" min="1.2" max="2.2" step="0.1" value={display.lineHeight} onChange={e=>setDisplay(d=>({...d, lineHeight:+e.target.value}))} />
          </div>
          <div className="field-row">
            <label><span>문항 배치</span></label>
            <select value={display.layout} onChange={e=>setDisplay(d=>({...d, layout:e.target.value}))}>
              <option value="1단">1단 배치</option>
              <option value="2단">2단 배치</option>
            </select>
          </div>
          <div className="field-row">
            <label><span>적용 대상 분류</span></label>
            <select value={applyScope} onChange={e=>setApplyScope(e.target.value)}>
              <option value="전체">전체 분류</option>
              {LARGE_CATS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          {applying > 0 && (
            <div className="progress-track"><div className="progress-fill" style={{width:applying+'%'}}></div></div>
          )}

          <div style={{marginTop:24}}>
            <div style={{fontSize:12.5,fontWeight:700,color:'var(--n6)',marginBottom:8}}>표시형식 프리셋</div>
            {presets.map((p,i) => (
              <div key={i} className="preset-row">
                <span>{p.name} · {p.size}px / {p.lineHeight}</span>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setDisplay({font:p.font,size:p.size,lineHeight:p.lineHeight,layout:p.layout}); pushToast(p.name+' 프리셋이 적용되었습니다');}}>불러오기</button>
              </div>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={()=>{setPresets(pr=>[...pr,{name:'프리셋 '+(pr.length+1), font:display.font, size:display.size, lineHeight:display.lineHeight, layout:display.layout}]); pushToast('현재 설정이 프리셋으로 저장되었습니다');}}>
            <Icon name="plus" size={12}/> 현재 설정 저장</button>
          </div>
        </div>

        <div className="preview-pane">
          <div style={{fontSize:12.5,fontWeight:700,color:'var(--n6)',marginBottom:10}}>미리보기</div>
          <div className="preview-box" style={{fontFamily: display.font==='serif' ? "'Noto Serif KR',serif" : "'Pretendard',sans-serif", fontSize:display.size, lineHeight:display.lineHeight}}>
            분모가 다른 두 진분수 1/3과 1/4을 더하면 얼마인가?
            <div style={{marginTop:10,display:'flex',flexDirection: display.layout==='2단' ? 'row':'column',gap:8,flexWrap:'wrap'}}>
              {['① 7/12','② 5/7','③ 4/7','④ 2/7'].map(c=><div key={c} style={{flex: display.layout==='2단' ? '1 1 45%':'auto'}}>{c}</div>)}

        </div>
      </div>

      {confirmOpen && (
        <Modal onClose={()=>setConfirmOpen(false)}>
          <h3 style={{margin:'0 0 8px',fontSize:16,fontWeight:800}}>일괄 반영하시겠습니까?</h3>
          <p style={{fontSize:13,color:'var(--n7)',margin:'0 0 18px'}}>{applyScope} 범위의 모든 문항(약 128개)에 새 표시형식이 트랜잭션으로 적용됩니다. 일부 실패 시 전체가 롤백됩니다.</p>
          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setConfirmOpen(false)}>취소</button>
            <button className="btn btn-primary" style={{flex:1}} onClick={runBulkApply}>적용</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function SearchScreen({ problems, setProblems, pushToast, pushHistory }) {
  const [tab, setTab] = useState('problems');
  const [q, setQ] = useState('');
  const [debouncedQ, setDebouncedQ] = useState('');
  const [loading, setLoading] = useState(false);
  const [catFilter, setCatFilter] = useState('전체');
  const [statusFilter, setStatusFilter] = useState('전체');
  const [uploadOpen, setUploadOpen] = useState(false);

  useEffect(() => {
    setLoading(true);
    const t = setTimeout(() => { setDebouncedQ(q); setLoading(false); }, 320);
    return () => clearTimeout(t);
  }, [q]);

  const filtered = problems.filter(p => {
    if (debouncedQ && !(p.stem.includes(debouncedQ) || p.tags.some(t=>t.includes(debouncedQ)))) return false;
    if (statusFilter !== '전체' && (statusFilter==='활성') !== p.active) return false;
    return true;
  });

  return (
    <div className="screen-body">
      <div className="screen-head">
        <h1 className="screen-title">통합 검색·필터 & 이미지 재사용</h1>
        <p className="screen-sub">분류·태그·본문으로 통합 검색하고, 이미지 라이브러리에서 기존 자산을 재사용합니다.</p>
      </div>

      <div className="tab-row">
        <button className={`filter-chip ${tab==='problems'?'active':''}`} onClick={()=>setTab('problems')}><Icon name="list" size={12}/> 문항 검색</button>
        <button className={`filter-chip ${tab==='images'?'active':''}`} onClick={()=>setTab('images')}><Icon name="image" size={12}/> 이미지 라이브러리</button>
      </div>

      {tab === 'problems' && (
        <>
          <div className="search-bar">
            <span className="search-icon"><Icon name="search" size={16}/></span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="분류·태그·문항 본문으로 검색" />
          </div>
          <div className="filter-chips">
            {['전체', ...LARGE_CATS].map(c => <button key={c} className={`filter-chip ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
            <span style={{width:1,background:'var(--n3)',margin:'0 4px'}}></span>
            {['전체','활성','비활성'].map(s => <button key={s} className={`filter-chip ${statusFilter===s?'active':''}`} onClick={()=>setStatusFilter(s)}>{s}</button>)}
          </div>

          {loading ? (
            <>{[1,2,3].map(i=><div key={i} className="result-skel"></div>)}</>
          ) : (
            <>
              {filtered.map(p => (
                <div key={p.id} className="result-card">
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>{p.stem}</div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
                      {p.tags.map(t=><span key={t} className="tag-chip" style={{margin:0}}>{t}</span>)}
                    </div>
                    <span className={`status-badge ${p.active?'active':'inactive'}`}>{p.active?'활성':'비활성'}</span>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{
                      setProblems(prev=>[{...p, id:'p'+Date.now(), updatedAt:'2026.09.08'}, ...prev]);
                      pushHistory('create', p.id+' 사본', '문항이 복사되었습니다.');
                      pushToast('문항이 복사되었습니다');
                    }}><Icon name="copy" size={12}/> 복사</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{
                      setProblems(prev=>prev.map(x=>x.id===p.id?{...x,active:!x.active}:x));
                      pushHistory('toggle', p.id+' · '+p.stem.slice(0,16), p.active?'문항이 비활성화되었습니다.':'문항이 활성화되었습니다.');
                      pushToast(p.active?'비활성화되었습니다':'활성화되었습니다');
                    }}><Icon name={p.active?'eye-off':'eye'} size={12}/> {p.active?'비활성화':'활성화'}</button>
                  </div>
                </div>
              ))}
              {filtered.length===0 && <div style={{textAlign:'center',color:'var(--n6)',padding:'30px 0',fontSize:13}}>조건에 맞는 문항이 없습니다</div>}
            </>

      )}

      {tab === 'images' && (
        <>
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>

          </div>

        <Modal onClose={()=>setUploadOpen(false)}>
          <h3 style={{margin:'0 0 8px',fontSize:16,fontWeight:800}}>이미지 업로드</h3>

          </div>
        </Modal>
      )}
    </div>
  );
}

/* ── 변경 이력 ── */
function HistoryScreen({ history }) {
  const [userFilter, setUserFilter] = useState('전체');
  const [actionFilter, setActionFilter] = useState('전체');
  const [diffTarget, setDiffTarget] = useState(null);
  const users = ['전체', ...Array.from(new Set(history.map(h=>h.user)))];

  const filtered = history.filter(h => (userFilter==='전체'||h.user===userFilter) && (actionFilter==='전체'||h.action===actionFilter));

  const exportCsv = () => {
    const rows = [['일시','사용자','작업유형','대상','설명'], ...filtered.map(h=>[h.at,h.user,ACTION_LABEL[h.action],h.target,h.desc])];
    const csv = rows.map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '변경이력.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="screen-body">
      <div className="screen-head">
        <h1 className="screen-title">변경 이력</h1>
        <p className="screen-sub">사용자·작업유형별로 콘텐츠 변경 이력을 확인하고 변경 전/후를 비교합니다.</p>
      </div>

      <div className="filter-chips">
        {users.map(u => <button key={u} className={`filter-chip ${userFilter===u?'active':''}`} onClick={()=>setUserFilter(u)}>{u}</button>)}
        <span style={{width:1,background:'var(--n3)',margin:'0 4px'}}></span>
        {['전체','create','update','delete','toggle'].map(a => <button key={a} className={`filter-chip ${actionFilter===a?'active':''}`} onClick={()=>setActionFilter(a)}>{a==='전체'?'전체':ACTION_LABEL[a]}</button>)}
        <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={exportCsv}><Icon name="download" size={12}/> CSV로 내보내기</button>
      </div>

      <table className="history-table">
        <thead><tr><th>일시</th><th>사용자</th><th>작업유형</th><th>대상</th><th></th></tr></thead>
        <tbody>
          {filtered.map(h => (
            <tr key={h.id}>
              <td>{h.at}</td>
              <td>{h.user}</td>
              <td><span className={`action-badge ${h.action}`}>{ACTION_LABEL[h.action]}</span></td>
              <td>{h.target}</td>
              <td>{h.before ? <button className="btn btn-ghost btn-sm" onClick={()=>setDiffTarget(h)}>비교보기</button> : <span style={{color:'var(--n5)',fontSize:11.5}}>{h.desc}</span>}</td>
            </tr>
          ))}
          {filtered.length===0 && <tr><td colSpan="5" style={{textAlign:'center',color:'var(--n6)',padding:'20px 0'}}>조건에 맞는 이력이 없습니다</td></tr>}
        </tbody>
      </table>

      {diffTarget && (
        <Modal wide onClose={()=>setDiffTarget(null)}>
          <h3 style={{margin:'0 0 4px',fontSize:16,fontWeight:800}}>{diffTarget.target}</h3>
          <p style={{fontSize:12,color:'var(--n6)',margin:'0 0 16px'}}>{diffTarget.at} · {diffTarget.user}</p>
          <div style={{display:'flex',gap:12}}>
            <div className="diff-box diff-before">{diffTarget.before}</div>
            <div className="diff-box diff-after">{diffTarget.after}</div>
          </div>
          <div style={{marginTop:18,textAlign:'right'}}>
            <button className="btn btn-ghost" onClick={()=>setDiffTarget(null)}>닫기</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ── App ── */
function App() {
  const [screen, setScreen] = useState('main');
  const [problems, setProblems] = useState(SEED_PROBLEMS);
  const [history, setHistory] = useState(SEED_HISTORY);
  const [display, setDisplay] = useState({ font:'sans', size:16, lineHeight:1.6, layout:'1단' });
  const [selectedNodeId, setSelectedNodeId] = useState('diff-denom');
  const [expanded, setExpanded] = useState({ 'number-op':true, 'fraction':true, 'shape-measure':true, 'pattern':true });
  const [toast, setToast] = useState(null);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const pushToast = (m) => setToast(m);
  const pushHistory = (action, target, desc) => setHistory(h => [{ id:'h'+Date.now(), at:'2026.09.08 '+new Date().toTimeString().slice(0,5), user:'나', action, target, desc }, ...h]);

  const toggleExpand = (id) => setExpanded(e => ({...e, [id]: !e[id]}));

  const renderTree = () => {
    const rows = [];
    TREE.children.forEach(large => {
      rows.push(
        <div key={large.id} className={`tree-item lvl1 ${selectedNodeId===large.id?'active':''}`} onClick={()=>{setSelectedNodeId(large.id); setScreen('main');}}>
          <button className="tree-toggle" onClick={(e)=>{e.stopPropagation(); toggleExpand(large.id);}}>{expanded[large.id]?'▾':'▸'}</button>
          <Icon name="folder" size={14}/> {large.label}
        </div>
      );
      if (expanded[large.id]) large.children.forEach(mid => {
        rows.push(
          <div key={mid.id} className={`tree-item lvl2 ${selectedNodeId===mid.id?'active':''}`} onClick={()=>{setSelectedNodeId(mid.id); setScreen('main');}}>
            <button className="tree-toggle" onClick={(e)=>{e.stopPropagation(); toggleExpand(mid.id);}}>{expanded[mid.id]?'▾':'▸'}</button>
            <Icon name="folder-open" size={13}/> {mid.label}
          </div>
        );
        if (expanded[mid.id]) mid.children.forEach(small => {
          rows.push(
            <div key={small.id} className={`tree-item lvl3 ${selectedNodeId===small.id?'active':''}`} onClick={()=>{setSelectedNodeId(small.id); setScreen('main');}}>
              <span style={{width:12,display:'inline-block'}}></span>
              <Icon name="file-text" size={12}/> {small.label}
            </div>
          );
        });
      });
    });
    return rows;
  };

  return (
    <div className="shell">
      <aside className="tree-sidebar">
        <div className="sidebar-brand"><span className="brand-mark">M</span>매스뱅크 워크스페이스</div>
        <div className="sidebar-search">
          <button className="tree-flat-btn" onClick={()=>setScreen('search')}><Icon name="search" size={14}/> 검색</button>
          <button className="tree-flat-btn" onClick={()=>{setScreen('main'); pushToast('새 문항 등록을 시작합니다');}}><Icon name="plus" size={14}/> 새 페이지</button>
        </div>
        <nav className="tree-nav">
          <div className={`tree-item lvl0 ${selectedNodeId==='math'&&screen==='main'?'active':''}`} onClick={()=>{setSelectedNodeId('number-op'); setScreen('main');}}>
            <Icon name="sigma" size={15}/> 수학
          </div>
          {renderTree()}

          <div className="tree-section-label">기능</div>
          <div className={`tree-item lvl0 ${screen==='editor'?'active':''}`} onClick={()=>setScreen('editor')}>
            <Icon name="type" size={14}/> 수식·도형 작도 에디터
          </div>
          <div className={`tree-item lvl0 ${screen==='display-settings'?'active':''}`} onClick={()=>setScreen('display-settings')}>
            <Icon name="palette" size={14}/> 표시형식 분리 설정 & 일괄 반영
          </div>
          <div className={`tree-item lvl0 ${screen==='search'?'active':''}`} onClick={()=>setScreen('search')}>
            <Icon name="filter" size={14}/> 통합 검색·필터 & 이미지 재사용
          </div>
          <div className={`tree-item lvl0 ${screen==='history'?'active':''}`} onClick={()=>setScreen('history')}>
            <Icon name="history" size={14}/> 변경 이력
          </div>
        </nav>
        <div className="sidebar-footer">
          <button className="tree-flat-btn" onClick={()=>pushToast('휴지통을 확인합니다')}><Icon name="trash-2" size={13}/> 휴지통</button>
          <button className="tree-flat-btn" onClick={()=>pushToast('워크스페이스 설정을 열었습니다')}><Icon name="settings" size={13}/> 설정</button>
        </div>
      </aside>

      <div className="main-wrap">
        <div className="canvas-col">
          {screen === 'main' && (
            <>
              <div className="page-breadcrumb">
                {(findPath(TREE, selectedNodeId)||[TREE]).map((n,i,arr)=>(
                  <React.Fragment key={n.id}>{i>0 && <span>›</span>}<span className={i===arr.length-1?'crumb-current':''}>{n.label}</span></React.Fragment>
                ))}
              </div>
              <MainScreen problems={problems} setProblems={setProblems} selectedNodeId={selectedNodeId} setSelectedNodeId={setSelectedNodeId} display={display} pushToast={pushToast} pushHistory={pushHistory} />
            </>
          )}
          {screen === 'editor' && <EditorScreen problems={problems} pushToast={pushToast} />}
          {screen === 'display-settings' && <DisplaySettingsScreen display={display} setDisplay={setDisplay} pushToast={pushToast} pushHistory={pushHistory} />}
          {screen === 'search' && <SearchScreen problems={problems} setProblems={setProblems} pushToast={pushToast} pushHistory={pushHistory} />}
          {screen === 'history' && <HistoryScreen history={history} />}
        </div>
        {screen === 'main' && <Inspector display={display} />}
      </div>

      {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
