<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매스뱅크 콘텐츠 운영 인사이트 대시보드 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 299°, dark) ── */
:root{
  --m50:#f1eef1; --m100:#f1eef1; --m200:#f1eef1; --m300:#e3dde3; --m400:#c8bac8;
  --m500:#a690a6; --m600:#806281; --m700:#5d355d; --m800:#39093a; --m900:#2f0730;
  --n0:#1f1e20; --n1:#3a363a; --n2:#5a535a; --n3:#7a717a; --n4:#989098;
  --n5:#a8a6b7; --n6:#d7d5d7; --n7:#e6e5e6; --n8:#f0eff0; --n9:#f4f0ff; --n10:#fdfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
  --radius-card:16px; --radius-btn:10px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
#root{width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n2);border-radius:8px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes drawLine{from{stroke-dashoffset:900;}to{stroke-dashoffset:0;}}
@keyframes countUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes ringDraw{from{stroke-dashoffset:220;}to{stroke-dashoffset:var(--target,0);}}
@keyframes glowPulse{0%{box-shadow:0 0 0 0 rgba(200,186,200,.25);}70%{box-shadow:0 0 0 9px rgba(200,186,200,0);}100%{box-shadow:0 0 0 0 rgba(200,186,200,0);}}

.app{width:100%;min-height:100vh;display:flex;flex-direction:column;}

/* ── 시그니처 1: 상단 글로벌 내비 ── */
.app-header{position:sticky;top:0;z-index:30;width:100%;background:var(--n1);border-bottom:1px solid var(--n2);height:60px;display:flex;align-items:center;padding:0 28px;gap:18px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--n9);flex-shrink:0;}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--m400);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-btn);border:1px solid var(--n2);background:var(--n0);font-size:12.5px;font-weight:600;color:var(--n5);flex-shrink:0;}
.global-nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;}
.nav-link{padding:8px 14px;border-radius:var(--radius-btn);border:none;background:transparent;color:var(--n5);font-size:13px;font-weight:600;white-space:nowrap;}
.nav-link:hover{background:var(--n2);color:var(--n8);}
.nav-link.active{color:var(--m300);background:var(--m900);}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-btn);border:1px solid var(--n2);background:var(--n0);color:var(--n5);display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--n2);}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:var(--m400);color:var(--n0);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* ── 시그니처 2: 보조 탭 ── */
.tab-bar{width:100%;background:var(--n1);border-bottom:1px solid var(--n2);display:flex;gap:4px;padding:0 28px;overflow-x:auto;}
.tab{padding:12px 16px;border:none;background:transparent;color:var(--n5);font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--n8);}
.tab.active{color:var(--m300);border-bottom-color:var(--m400);}

/* ── 시그니처 3: 콘텐츠 ── */
.content{width:100%;flex:1;max-width:1280px;margin:0 auto;padding:28px;}
.page-head{margin-bottom:22px;}
.page-title{font-size:38px;font-weight:800;color:var(--n9);margin:0 0 8px;letter-spacing:-.015em;line-height:1.1;}
.page-sub{font-size:13.5px;color:var(--n5);margin:0;}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:18px;animation:countUp .4s ease both;}
.stat-label{font-size:12px;color:var(--n5);font-weight:600;}
.stat-value{font-size:30px;font-weight:800;color:var(--n9);margin-top:6px;line-height:1.1;}
.stat-delta{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:6px;}
.stat-delta.up{color:var(--s1-text);}
.stat-delta.down{color:var(--s2-text);}
.stat-spark{width:100%;height:26px;margin-top:8px;}

.chart-panel{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:22px;margin-bottom:20px;}
.chart-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.chart-panel-title{font-size:14.5px;font-weight:700;color:var(--n9);}
.period-tabs{display:flex;gap:6px;}
.period-tab{padding:5px 12px;border-radius:9999px;border:1px solid var(--n2);background:var(--n0);color:var(--n5);font-size:12px;font-weight:700;}
.period-tab.active{background:var(--m900);color:var(--m300);border-color:var(--m700);}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--n5);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.hover-tip{position:absolute;background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--n8);pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;}

.widget-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
.widget-card{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:18px;position:relative;}
.widget-title{font-size:13.5px;font-weight:700;color:var(--n9);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;}
.bar-label{width:100px;font-size:12px;color:var(--n5);flex-shrink:0;}
.bar-track{flex:1;height:10px;background:var(--n2);border-radius:9999px;overflow:hidden;}
.bar-fill{height:100%;background:var(--m400);border-radius:9999px;transform-origin:left;animation:barGrow .5s ease both;}
.bar-value{width:36px;text-align:right;font-size:12px;color:var(--n8);font-weight:700;flex-shrink:0;}
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n6);margin-bottom:6px;cursor:pointer;}
.timeline-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--n2);font-size:12px;color:var(--n5);}
.timeline-row:last-child{border-bottom:none;}
.timeline-row b{color:var(--n9);font-weight:600;}
.drilldown-list{margin-top:14px;border-top:1px dashed var(--n2);padding-top:12px;animation:fadeInUp .2s ease;}
.drilldown-item{display:flex;justify-content:space-between;font-size:12px;color:var(--n6);padding:5px 0;}

/* ── 프리셋 관리 ── */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:22px;}
.preset-card{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:16px;cursor:pointer;}
.preset-card.selected{border-color:var(--m400);box-shadow:0 0 0 1px var(--m400);}
.preset-card-title{font-size:14px;font-weight:700;color:var(--n9);margin-bottom:6px;}
.preset-card-meta{font-size:11.5px;color:var(--n5);}
.preset-actions{display:flex;gap:6px;margin-top:10px;}
.apply-history-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);overflow:hidden;}
.apply-history-table th{text-align:left;font-size:11.5px;color:var(--n5);font-weight:700;padding:11px 14px;background:var(--n0);border-bottom:1px solid var(--n2);}
.apply-history-table td{padding:11px 14px;font-size:12.5px;color:var(--n8);border-bottom:1px solid var(--n2);}

/* ── 감사로그 ── */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.pill-select{padding:6px 12px;border-radius:9999px;border:1px solid var(--n2);background:var(--n1);color:var(--n6);font-size:12.5px;font-weight:600;}
.pill-select.active{background:var(--m900);color:var(--m300);border-color:var(--m700);}
.audit-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);overflow:hidden;}
.audit-table th{text-align:left;font-size:11.5px;color:var(--n5);font-weight:700;padding:11px 14px;background:var(--n0);border-bottom:1px solid var(--n2);}
.audit-table td{padding:11px 14px;font-size:12.5px;color:var(--n8);border-bottom:1px solid var(--n2);}
.action-badge{padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700;}
.action-badge.create{background:var(--s1-bg);color:var(--s1-text);}
.action-badge.update{background:var(--m900);color:var(--m300);}
.action-badge.delete{background:var(--s2-bg);color:var(--s2-text);}
.action-badge.toggle{background:var(--s3-bg);color:var(--s3-text);}
.diff-box{flex:1;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;}
.diff-before{background:var(--s2-bg);color:var(--s2-text);text-decoration:line-through;}
.diff-after{background:var(--s1-bg);color:var(--s1-text);}

/* ── API 카탈로그 ── */
.endpoint-table{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);overflow:hidden;margin-bottom:22px;}
.endpoint-table th{text-align:left;font-size:11.5px;color:var(--n5);font-weight:700;padding:11px 14px;background:var(--n0);border-bottom:1px solid var(--n2);}
.endpoint-table td{padding:11px 14px;font-size:12.5px;color:var(--n8);border-bottom:1px solid var(--n2);cursor:pointer;}
.endpoint-table tr:hover td{background:var(--n0);}
.method-badge{padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:800;font-family:monospace;}
.method-badge.GET{background:var(--m900);color:var(--m300);}
.method-badge.POST{background:var(--s1-bg);color:var(--s1-text);}
.method-badge.PATCH{background:var(--s3-bg);color:var(--s3-text);}
.method-badge.DELETE{background:var(--s2-bg);color:var(--s2-text);}
.schema-panel{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:18px;margin-bottom:22px;}
.schema-json{background:var(--n0);border-radius:10px;padding:14px;font-family:'SFMono-Regular',Menlo,monospace;font-size:12px;color:var(--n7);overflow-x:auto;white-space:pre;}
.schema-flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.schema-node{border:1px solid var(--n2);border-radius:12px;padding:14px 16px;background:var(--n1);font-size:13px;font-weight:700;color:var(--n9);text-align:center;min-width:110px;}
.schema-node.future{border-style:dashed;border-color:var(--n3);color:var(--n5);position:relative;}
.stage-badge{position:absolute;top:-10px;right:8px;background:var(--s3-bg);color:var(--s3-text);font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;}

.btn-primary{padding:10px 20px;border-radius:var(--radius-btn);border:none;background:var(--m400);color:var(--n0);font-size:13px;font-weight:700;}
.btn-primary:hover{background:var(--m300);}
.btn-outline{padding:8px 14px;border-radius:var(--radius-btn);border:1px solid var(--n3);background:var(--n1);color:var(--n8);font-size:12px;font-weight:700;}
.btn-outline:hover{background:var(--n2);}
.btn-outline.danger{border-color:var(--s2);color:var(--s2-text);background:var(--s2-bg);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
.modal-box{width:460px;max-width:100%;background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:24px;animation:fadeInUp .22s ease;}
.modal-box.wide{width:640px;}
.modal-title{font-size:17px;font-weight:800;color:var(--n9);margin:0 0 14px;}
.field-input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--n3);font-size:13.5px;font-family:inherit;color:var(--n9);background:var(--n0);margin-bottom:14px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n8);color:var(--n0);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:90;display:flex;align-items:center;gap:8px;animation:fadeInUp .2s ease;}
.autosave-dot{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;animation:glowPulse 1.8s infinite;}

@media (max-width:960px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .widget-grid{grid-template-columns:1fr;}
}
</style>
</head>

function Sparkline({ points, color }) {
  const w=100,h=26;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=>{const x=(i/(points.length-1))*w; const y=h-((p-min)/(max-min||1))*h; return `${x},${y}`;}).join(' ');
  return <svg className="stat-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

function TrendChart({ data }) {
  const [hover, setHover] = useState(null);
  const w=640,h=200;
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=>({ x:(i/(data.length-1))*w, y: h-30-((v-min)/(max-min||1))*(h-50) }));
  const line = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const area = `0,${h-10} ` + line + ` ${w},${h-10}`;
  return (
    <div style={{position:'relative'}}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:220}} preserveAspectRatio="none">
        <line x1="0" y1={h-60} x2={w} y2={h-60} stroke="var(--n2)" strokeWidth="1"/>
        <line x1="0" y1={h-110} x2={w} y2={h-110} stroke="var(--n2)" strokeWidth="1"/>
        <polygon points={area} fill="var(--m900)" opacity="0.5"/>
        <polyline points={line} fill="none" stroke="var(--m400)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="900" style={{animation:'drawLine 1.1s ease forwards'}}/>
        {pts.map((p,i)=>(
          <circle key={i} cx={p.x} cy={p.y} r="8" fill="transparent" onMouseEnter={()=>setHover({...p,v:data[i]})} onMouseLeave={()=>setHover(null)} style={{cursor:'pointer'}}/>
        ))}
        {pts.map((p,i)=><circle key={'d'+i} cx={p.x} cy={p.y} r="3" fill="var(--m300)"/>)}
      </svg>
      {hover && <div className="hover-tip" style={{left:(hover.x/w*100)+'%', top:(hover.y/h*100)+'%'}}>{hover.v}건</div>}
    </div>
  );
}

function Donut({ data }) {
  const total = data.reduce((s,d)=>s+d.count,0);
  let acc = 0;
  const r=42, c=2*Math.PI*r;
  return (
    <svg width="110" height="110" viewBox="0 0 110 110">
      <circle cx="55" cy="55" r={r} fill="none" stroke="var(--n2)" strokeWidth="14"/>
      {data.map((d,i)=>{
        const frac = d.count/total;
        const dash = frac*c;
        const el = <circle key={i} cx="55" cy="55" r={r} fill="none" stroke={d.color} strokeWidth="14"
          strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-acc} transform="rotate(-90 55 55)" strokeLinecap="butt"/>;
        acc += dash;
        return el;
      })}
    </svg>
  );
}

    { key:'main', label:'운영 현황 인사이트 대시보드' },
    { key:'presets', label:'표시형식 프리셋 관리' },
    { key:'audit-log', label:'변경 이력 감사로그' },
    { key:'api-catalog', label:'확장 스키마 & API 카탈로그' },
  ];
  return (
    <div className="app-header">
      <div className="brand"><span className="brand-mark">M</span>매스뱅크 콘솔</div>
      <div className="project-switcher"><Icon name="stack"/>운영 환경 ▾</div>
      <nav className="global-nav">
        {navItems.map(n => <button key={n.key} className={`nav-link ${view===n.key?'active':''}`} onClick={()=>setView(n.key)}>{n.label}</button>)}
      </nav>
      <div className="header-actions">
        <button className="icon-btn" onClick={()=>{}} title="검색"><Icon name="magnifying-glass"/></button>
        <button className="icon-btn" onClick={()=>{}} title="알림"><Icon name="bell"/></button>
        <div className="avatar-chip">관</div>
      </div>
    </div>
  );
}
function TabBar({ subTab, onTab }) {
  const on = (t) => subTab===t ? {color:'var(--m300)',borderBottomColor:'var(--m400)'} : {};
  return (
    <div className="tab-bar">
      <button className="tab" style={on('개요')} onClick={()=>onTab('개요')}>개요</button>
      <button className="tab" style={on('태그 분석')} onClick={()=>onTab('태그 분석')}>태그 분석</button>
      <button className="tab" style={on('정산 흐름')} onClick={()=>onTab('정산 흐름')}>정산 흐름</button>
      <button className="tab" style={on('연동 현황')} onClick={()=>onTab('연동 현황')}>연동 현황</button>
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [subTab, setSubTab] = useState('개요');
  const [toast, setToast] = useState('');
  const pushToast = (m) => { setToast(m); };
  useEffect(() => { if(!toast) return; const t=setTimeout(()=>setToast(''),2400); return ()=>clearTimeout(t); }, [toast]);

  return (
    <div className="app" data-archetype="topbar-analytics">
      <Header view={view} setView={setView} />
      <TabBar subTab={subTab} onTab={(t)=>{setSubTab(t); setView('main');}} />
      {view === 'main' && <MainView pushToast={pushToast} />}
      {view === 'presets' && <PresetsView pushToast={pushToast} />}
      {view === 'audit-log' && <AuditLogView />}
      {view === 'api-catalog' && <ApiCatalogView />}
      {toast && <div className="toast"><Icon name="check-circle"/>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
