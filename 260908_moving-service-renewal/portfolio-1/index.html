<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무브세이프 — 이사 서비스 웹사이트 리뉴얼 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 232°, light) ── */
:root{
  --m50:#e7eafc; --m100:#cfd4f9; --m200:#b1baf6; --m300:#909df2; --m400:#7182ef;
  --m500:#5266eb; --m600:#4354c1; --m700:#344196; --m800:#252e6a; --m900:#252e6a;
  --n0:#f7f8fb; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d5d5d7;
  --n5:#b5b5ba; --n6:#909198; --n7:#71727a; --n8:#53545a; --n9:#36363a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n9);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
#root { width: 100%; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ── keyframes ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(82,102,235,0.35); }
  50% { box-shadow: 0 0 0 6px rgba(82,102,235,0); }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
@keyframes slideFade {
  from { opacity: 0; transform: translateX(14px); }
  to { opacity: 1; transform: translateX(0); }
}

.fade-up { animation: fadeInUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
.spin-icon { animation: spin 0.9s linear infinite; }
.pulse-dot { animation: pulseDot 2s ease-out infinite; }
.shimmer-bar {
  background: linear-gradient(90deg, var(--n2) 0%, var(--n3) 40%, var(--n2) 80%);
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
}
.slide-fade { animation: slideFade 0.35s ease both; }

/* ── top nav ── */
.topnav {
  position: sticky; top: 0; z-index: 100;
  width: 100%; height: 72px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--n3);
  display: flex; align-items: center; justify-content: center;
}
.topnav-inner {
  width: 100%; max-width: 1240px; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 19px; color: var(--n10); }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--m600); color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.nav-tabs { display: flex; align-items: center; gap: 4px; }
.nav-tab {
  padding: 9px 16px; border-radius: 999px; font-size: 14.5px; font-weight: 500;
  color: var(--n7); transition: background .15s, color .15s;
}
.nav-tab:hover { background: var(--n2); color: var(--n9); }
.nav-tab.active { background: var(--m50); color: var(--m700); font-weight: 600; }
.nav-cta {
  padding: 10px 20px; border-radius: 999px; background: var(--m600); color: #fff;
  font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  transition: background .15s, transform .15s;
}
.nav-cta:hover { background: var(--m700); transform: translateY(-1px); }
.nav-burger { display: none; }

@media (max-width: 860px) {
  .nav-tabs { display: none; }
  .nav-burger { display: flex; }
}

/* ── generic layout helpers ── */
.section { width: 100%; display: flex; justify-content: center; }
.section-inner { width: 100%; max-width: 1240px; padding: 88px 32px; }
.section-inner.tight { padding: 64px 32px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: var(--n7);
  background: var(--n2); padding: 6px 14px; border-radius: 999px; margin-bottom: 18px;
}
h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; color: var(--n10); }

/* ── hero ── */
.hero {
  position: relative; width: 100%; min-height: 640px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; filter: saturate(0.55) brightness(0.62);
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(120deg, rgba(15,16,20,0.88) 0%, rgba(30,32,38,0.66) 52%, rgba(30,32,38,0.22) 100%);
}
.hero-content {
  position: relative; z-index: 2; width: 100%; max-width: 1240px;
  padding: 0 32px; color: #fff;
}
.hero-content h1 { color: #fff; font-size: 52px; line-height: 1.22; max-width: 640px; }
.hero-content p.sub { color: rgba(255,255,255,0.86); font-size: 18px; margin-top: 20px; max-width: 520px; line-height: 1.6; }
.hero-actions { display: flex; align-items: center; gap: 14px; margin-top: 34px; }
.btn-primary {
  padding: 15px 28px; border-radius: 999px; background: var(--m500); color: #fff;
  font-size: 15.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
  transition: background .15s, transform .15s; box-shadow: 0 8px 22px rgba(82,102,235,0.35);
}
.btn-primary:hover { background: var(--m600); transform: translateY(-2px); }
.btn-ghost-light {
  padding: 14px 26px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.55);
  color: #fff; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.btn-ghost-light:hover { background: rgba(255,255,255,0.12); }
.hero-badge {
  margin-top: 28px; display: inline-flex; align-items: center; gap: 10px;
  font-size: 13.5px; color: rgba(255,255,255,0.85);
}
.hero-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s1); }

/* ── trust stats ── */
.trust-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
}
.trust-card {
  background: var(--n1); border: 1px solid var(--n3); border-radius: 16px; padding: 26px 22px;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.trust-card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(30,32,60,0.08); border-color: var(--n4); }
.trust-icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--n2);
  display: flex; align-items: center; justify-content: center; color: var(--n7); margin-bottom: 16px;
}
.trust-num { font-size: 28px; font-weight: 800; color: var(--n10); letter-spacing: -0.02em; }
.trust-label { font-size: 14px; color: var(--n7); margin-top: 6px; }

/* ── services preview grid ── */
.svc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 36px; }
.svc-card {
  background: var(--n1); border: 1px solid var(--n3); border-radius: 18px; padding: 28px 24px;
  display: flex; flex-direction: column; gap: 14px; text-align: left;
  transition: transform .2s, box-shadow .2s, border-color .2s; width: 100%;
}
.svc-card:hover { transform: translateY(-5px); box-shadow: 0 16px 32px rgba(30,32,60,0.1); border-color: var(--m300); }
.svc-icon { width: 48px; height: 48px; border-radius: 13px; background: var(--n2); display: flex; align-items: center; justify-content: center; color: var(--n8); }
.svc-card h3 { font-size: 17px; }
.svc-card p { font-size: 13.5px; color: var(--n7); line-height: 1.55; }
.svc-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--m600); margin-top: auto; }

/* ── how / steps ── */
.steps-row { display: flex; align-items: flex-start; gap: 0; margin-top: 44px; }
.step-item { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 0 12px; }
.step-connector { position: absolute; top: 26px; left: -50%; width: 100%; height: 2px; background: var(--n3); z-index: 0; }
.step-item:first-child .step-connector { display: none; }
.step-circle {
  width: 52px; height: 52px; border-radius: 50%; background: var(--n1); border: 2px solid var(--n3);
  display: flex; align-items: center; justify-content: center; color: var(--n8); position: relative; z-index: 1;
  font-weight: 700; font-size: 15px;
}
.step-item.done .step-circle { border-color: var(--m500); color: var(--m600); background: var(--m50); }
.step-title { font-size: 15px; font-weight: 700; margin-top: 14px; color: var(--n9); }
.step-desc { font-size: 13px; color: var(--n7); margin-top: 6px; line-height: 1.5; max-width: 180px; }

/* ── faq accordion ── */
.faq-item { border-bottom: 1px solid var(--n3); }
.faq-q {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 20px 4px; font-size: 15.5px; font-weight: 600; color: var(--n9); text-align: left;
}
.faq-q .chev { color: var(--n6); transition: transform .2s; flex-shrink: 0; margin-left: 12px; }
.faq-item.open .faq-q .chev { transform: rotate(180deg); color: var(--m600); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
.faq-item.open .faq-a { max-height: 240px; }
.faq-a-inner { padding: 0 4px 20px; font-size: 14.5px; color: var(--n7); line-height: 1.7; }
.faq-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.faq-chip { padding: 8px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--n2); color: var(--n7); }
.faq-chip.active { background: var(--m600); color: #fff; }

/* ── cta foot ── */
.cta-foot {
  width: 100%; background: linear-gradient(135deg, var(--m700), var(--m900));
  display: flex; justify-content: center; text-align: center;
}
.cta-foot-inner { width: 100%; max-width: 720px; padding: 76px 32px; }
.cta-foot h2 { color: #fff; font-size: 32px; }
.cta-foot p { color: rgba(255,255,255,0.78); margin-top: 14px; font-size: 15.5px; }
.cta-foot .btn-primary { margin-top: 30px; background: #fff; color: var(--m700); box-shadow: none; }
.cta-foot .btn-primary:hover { background: var(--n1); color: var(--m800); }

/* ── footer ── */
.site-footer { width: 100%; background: var(--n10); display: flex; justify-content: center; }
.site-footer-inner { width: 100%; max-width: 1240px; padding: 48px 32px 36px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 32px; }
.footer-brand { color: var(--n1); font-weight: 700; font-size: 17px; }
.footer-cols { display: flex; gap: 64px; flex-wrap: wrap; }
.footer-col h4 { font-size: 13px; color: var(--n6); font-weight: 600; margin-bottom: 12px; }
.footer-col a { display: block; font-size: 13.5px; color: var(--n5); padding: 5px 0; }
.footer-bottom { color: var(--n6); font-size: 12.5px; margin-top: 8px; }

/* ── services view ── */
.page-head { padding: 56px 32px 0; width: 100%; max-width: 1240px; }
.page-head h1 { font-size: 34px; }
.page-head p { color: var(--n7); margin-top: 10px; font-size: 15px; }
.type-tabs { display: flex; gap: 8px; margin-top: 32px; flex-wrap: wrap; }
.type-tab {
  padding: 12px 20px; border-radius: 12px; border: 1.5px solid var(--n3); background: var(--n1);
  font-size: 14.5px; font-weight: 600; color: var(--n7); display: flex; align-items: center; gap: 8px;
  transition: all .15s;
}
.type-tab.active { border-color: var(--m500); background: var(--m50); color: var(--m700); }
.svc-detail { display: grid; grid-template-columns: 1.3fr 1fr; gap: 36px; margin-top: 32px; align-items: start; }
.svc-detail-card { background: var(--n1); border: 1px solid var(--n3); border-radius: 18px; padding: 32px; }
.svc-detail-card h3 { font-size: 20px; margin-bottom: 8px; }
.svc-detail-card > p { color: var(--n7); font-size: 14.5px; line-height: 1.7; margin-bottom: 22px; }
.scope-list { display: flex; flex-direction: column; gap: 12px; }
.scope-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--n8); }
.scope-item i { color: var(--s1); flex-shrink: 0; margin-top: 2px; }
.price-card { background: var(--n1); border: 1px solid var(--n3); border-radius: 18px; padding: 28px; }
.price-card .price-tag { font-size: 26px; font-weight: 800; color: var(--n10); margin: 10px 0 4px; }
.price-note { font-size: 12.5px; color: var(--n6); }
.vtimeline { margin-top: 22px; display: flex; flex-direction: column; gap: 0; }
.vt-item { display: flex; gap: 14px; padding-bottom: 20px; position: relative; }
.vt-item:last-child { padding-bottom: 0; }
.vt-line { position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--n3); }
.vt-item:last-child .vt-line { display: none; }
.vt-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--m50); border: 2px solid var(--m500); color: var(--m700); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 1; flex-shrink: 0; }
.vt-text { font-size: 14px; color: var(--n8); padding-top: 2px; }

/* ── quote view ── */
.quote-wrap { width: 100%; max-width: 620px; margin: 0 auto; padding: 56px 32px 100px; }
.progress-row { display: flex; align-items: center; margin-bottom: 40px; }
.progress-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
.progress-bar-bg { position: absolute; top: 17px; left: -50%; width: 100%; height: 3px; background: var(--n3); z-index: 0; border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--m500); width: 0%; transition: width .3s; }
.progress-step:first-child .progress-bar-bg { display: none; }
.progress-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--n2); color: var(--n7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; z-index: 1; border: 2px solid var(--n2); }
.progress-step.active .progress-circle, .progress-step.complete .progress-circle { background: var(--m500); color: #fff; border-color: var(--m500); }
.progress-label { font-size: 12.5px; color: var(--n7); margin-top: 8px; font-weight: 600; }
.form-card { background: var(--n1); border: 1px solid var(--n3); border-radius: 20px; padding: 36px; }
.form-card h2 { font-size: 21px; margin-bottom: 24px; }
.field-group { margin-bottom: 20px; }
.field-label { font-size: 13.5px; font-weight: 600; color: var(--n8); margin-bottom: 8px; display: block; }
.field-input {
  width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--n3);
  font-size: 14.5px; color: var(--n9); background: var(--n0); transition: border-color .15s;
}
.field-input:focus { outline: none; border-color: var(--m500); background: var(--n1); }
.field-input.error { border-color: var(--s2); }
.field-error { font-size: 12.5px; color: var(--s2-text); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.type-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.type-select-btn {
  padding: 14px; border-radius: 12px; border: 1.5px solid var(--n3); background: var(--n0);
  font-size: 14px; font-weight: 600; color: var(--n8); display: flex; align-items: center; gap: 8px;
}
.type-select-btn.selected { border-color: var(--m500); background: var(--m50); color: var(--m700); }
.form-actions { display: flex; gap: 10px; margin-top: 28px; }
.btn-outline {
  flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--n3); background: var(--n1);
  font-size: 14.5px; font-weight: 700; color: var(--n8); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-outline:hover { background: var(--n2); }
.btn-fill { flex: 2; padding: 14px; border-radius: 12px; border: none; background: var(--m500); color: #fff; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-fill:hover { background: var(--m600); }
.btn-fill:disabled { background: var(--n4); cursor: not-allowed; }
.complete-box { text-align: center; padding: 56px 30px; }
.complete-icon { width: 74px; height: 74px; border-radius: 50%; background: var(--s1-bg); color: var(--s1); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
.complete-summary { text-align: left; background: var(--n0); border: 1px solid var(--n3); border-radius: 14px; padding: 22px; margin-top: 26px; }
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--n3); }
.summary-row:last-child { border-bottom: none; }
.summary-row span:first-child { color: var(--n6); }
.summary-row span:last-child { font-weight: 600; color: var(--n9); }

/* ── faq view reviews ── */
.review-wrap { margin-top: 60px; }
.review-track { display: flex; gap: 18px; overflow: hidden; }
.review-card { background: var(--n1); border: 1px solid var(--n3); border-radius: 16px; padding: 24px; flex: 0 0 calc(33.333% - 12px); }
.review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar-circle { width: 38px; height: 38px; border-radius: 50%; background: var(--n2); color: var(--n8); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.review-name { font-size: 14px; font-weight: 700; color: var(--n9); }
.review-meta { font-size: 12px; color: var(--n6); }
.review-stars { color: var(--m600); display: flex; gap: 2px; margin-bottom: 8px; }
.review-text { font-size: 13.5px; color: var(--n8); line-height: 1.65; }
.review-dots { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
.review-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--n4); }
.review-dot.active { background: var(--m500); width: 18px; border-radius: 4px; }

@media (max-width: 980px) {
  .trust-grid, .svc-grid { grid-template-columns: repeat(2, 1fr); }
  .svc-detail { grid-template-columns: 1fr; }
  .review-card { flex: 0 0 100%; }
  .hero-content h1 { font-size: 38px; }
  .type-select-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SERVICE_TYPES = [
  {
    id: "local", name: "근거리이사", icon: "map-pin",
    tagline: "동일 생활권 내 빠르고 합리적인 이사",
    desc: "동일 시/구 내 이동에 최적화된 반나절 이사 상품입니다. 포장부터 배치까지 하루 안에 완료합니다.",
    scope: ["기본 포장재 무상 제공", "가전·가구 이동 설치", "1톤~5톤 차량 선택 가능", "당일 폐기물 정리"],
    price: "18만원~", note: "1톤 기준, 층수·엘리베이터 유무에 따라 변동",
    steps: ["상담 접수", "당일 방문 견적", "이사 진행"],
  },
  {
    id: "long", name: "장거리이사", icon: "truck",
    tagline: "타 지역 이동도 안전하게, 화물보험 포함",

function TrustSection() {
  const ref = useRef(null);
  const [animated, setAnimated] = useState(false);
  const stats = [
    { icon: "truck", target: 12400, suffix: "건", label: "누적 이사 완료 건수" },
    { icon: "star", target: 49, suffix: "", label: "고객 만족도 평점 (5점 만점 4.9)", isRating: true },
    { icon: "shield-check", target: 100, suffix: "%", label: "전 구간 화물보험 가입률" },
    { icon: "users", target: 320, suffix: "명", label: "전담 매니저 보유 인원" },
  ];
  const [nums, setNums] = useState(stats.map(() => 0));

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !animated) {
          setAnimated(true);
          const start = performance.now();
          const dur = 1100;
          function tick(now) {
            const p = Math.min(1, (now - start) / dur);
            setNums(stats.map(s => Math.round(s.target * p)));
            if (p < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [animated]);

  return (
    <div className="section" ref={ref}>
      <div className="section-inner tight">
        <span className="eyebrow"><i data-lucide="shield-check" style={{width:13,height:13}}></i>신뢰할 수 있는 이사 파트너</span>
        <h2 style={{fontSize:30, maxWidth:520}}>숫자로 증명하는 무브세이프의 신뢰</h2>
        <div className="trust-grid" style={{marginTop:32}}>
          {stats.map((s, i) => (
            <div className="trust-card fade-up" style={{animationDelay: (i*0.08)+"s"}} key={s.label}>
              <div className="trust-icon"><i data-lucide={s.icon} style={{width:20,height:20}}></i></div>
              <div className="trust-num">
                {s.isRating ? (nums[i]/10).toFixed(1) : nums[i].toLocaleString()}{s.suffix}
              </div>
              <div className="trust-label">{s.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function QuoteView({ presetType }) {
  const [step, setStep] = useState(1);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [errors, setErrors] = useState({});
  const [form, setForm] = useState({
    type: presetType || "", date: "", from: "", to: "", size: "10평 이하",
    name: "", phone: "", email: "",
  });

  useEffect(() => { if (presetType) setForm(f => ({ ...f, type: presetType })); }, [presetType]);

  function update(key, val) { setForm(f => ({ ...f, [key]: val })); setErrors(er => ({ ...er, [key]: null })); }

  function next() {
    if (step === 1) {
      const e = {};
      if (!form.type) e.type = "이사 유형을 선택해주세요";
      if (!form.date) e.date = "이사 예정일을 선택해주세요";
      if (Object.keys(e).length) { setErrors(e); return; }
    }
    if (step === 2) {
      const e = {};
      if (!form.from) e.from = "출발지 주소를 입력해주세요";
      if (!form.to) e.to = "도착지 주소를 입력해주세요";
      if (Object.keys(e).length) { setErrors(e); return; }
    }
    setStep(s => Math.min(3, s + 1));
  }
  function prev() { setStep(s => Math.max(1, s - 1)); }

  function submit() {
    const e = {};
    if (!form.name) e.name = "이름을 입력해주세요";
    if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test(form.phone)) e.phone = "휴대전화 형식이 올바르지 않습니다 (예: 010-1234-5678)";
    if (Object.keys(e).length) { setErrors(e); return; }
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); setSubmitted(true); }, 900);
  }

  const typeName = SERVICE_TYPES.find(s => s.id === form.type)?.name || "-";
  const stepLabels = ["이사 정보", "이동 경로", "연락처"];

  if (submitted) {
    return (
      <div className="fade-up quote-wrap">
        <div className="form-card complete-box">
          <div className="complete-icon"><i data-lucide="check" style={{width:34,height:34}}></i></div>
          <h2 style={{fontSize:23}}>견적 신청이 접수되었습니다</h2>
          <p style={{color:"var(--n7)", marginTop:10, fontSize:14.5}}>담당 매니저가 영업일 기준 1일 이내 연락드립니다. 확인 문자가 곧 발송됩니다.</p>
          <div className="complete-summary">
            <div className="summary-row"><span>이사 유형</span><span>{typeName}</span></div>
            <div className="summary-row"><span>이사 예정일</span><span>{form.date}</span></div>
            <div className="summary-row"><span>출발지 → 도착지</span><span>{form.from} → {form.to}</span></div>
            <div className="summary-row"><span>연락처</span><span>{form.phone}</span></div>
          </div>
          <button className="btn-fill" style={{width:"100%", marginTop:26}} onClick={() => { window.__moveSafeSetView && window.__moveSafeSetView("main"); }}>
            홈으로 돌아가기
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="fade-up quote-wrap">
      <div className="progress-row">
        {stepLabels.map((lb, i) => (
          <div key={lb} className={"progress-step" + (step === i+1 ? " active" : step > i+1 ? " complete" : "")}>
            <div className="progress-bar-bg"><div className="progress-bar-fill" style={{width: step > i+1 ? "100%" : "0%"}}></div></div>
            <div className="progress-circle">{step > i+1 ? <i data-lucide="check" style={{width:16,height:16}}></i> : i+1}</div>
            <div className="progress-label">{lb}</div>
          </div>
        ))}
      </div>

      <div className="form-card slide-fade" key={step}>
        {step === 1 && (
          <React.Fragment>
            <h2>어떤 이사를 도와드릴까요?</h2>
            <div className="field-group">
              <label className="field-label">이사 유형</label>
              <div className="type-select-grid">
                {SERVICE_TYPES.map(s => (
                  <button key={s.id} className={"type-select-btn" + (form.type === s.id ? " selected" : "")} onClick={() => update("type", s.id)}>
                    <i data-lucide={s.icon} style={{width:16,height:16}}></i>{s.name}
                  </button>
                ))}
              </div>
              {errors.type && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.type}</div>}
            </div>
            <div className="field-group">
              <label className="field-label">이사 예정일</label>
              <input type="date" className={"field-input" + (errors.date ? " error" : "")} value={form.date} onChange={e => update("date", e.target.value)} />
              {errors.date && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.date}</div>}
            </div>
            <div className="form-actions">
              <button className="btn-fill" style={{flex:1}} onClick={next}>다음 <i data-lucide="arrow-right" style={{width:15,height:15}}></i></button>
            </div>
          </React.Fragment>
        )}
        {step === 2 && (
          <React.Fragment>
            <h2>이동 경로를 알려주세요</h2>
            <div className="field-group">
              <label className="field-label">출발지 주소</label>
              <input className={"field-input" + (errors.from ? " error" : "")} placeholder="예: 서울시 강남구 테헤란로 123" value={form.from} onChange={e => update("from", e.target.value)} />
              {errors.from && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.from}</div>}
            </div>
            <div className="field-group">
              <label className="field-label">도착지 주소</label>
              <input className={"field-input" + (errors.to ? " error" : "")} placeholder="예: 경기도 성남시 분당구 정자로 45" value={form.to} onChange={e => update("to", e.target.value)} />
              {errors.to && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.to}</div>}
            </div>
            <div className="field-group">
              <label className="field-label">평수</label>
              <select className="field-input" value={form.size} onChange={e => update("size", e.target.value)}>
                <option>10평 이하</option><option>10~20평</option><option>20~30평</option><option>30평 이상</option>
              </select>
            </div>
            <div className="form-actions">
              <button className="btn-outline" onClick={prev}><i data-lucide="arrow-left" style={{width:15,height:15}}></i>이전</button>
              <button className="btn-fill" onClick={next}>다음 <i data-lucide="arrow-right" style={{width:15,height:15}}></i></button>
            </div>
          </React.Fragment>
        )}
        {step === 3 && (
          <React.Fragment>
            <h2>연락처를 입력해주세요</h2>
            <div className="field-group">
              <label className="field-label">이름</label>
              <input className={"field-input" + (errors.name ? " error" : "")} placeholder="홍길동" value={form.name} onChange={e => update("name", e.target.value)} />
              {errors.name && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.name}</div>}
            </div>
            <div className="field-group">
              <label className="field-label">휴대전화</label>
              <input className={"field-input" + (errors.phone ? " error" : "")} placeholder="010-1234-5678" value={form.phone} onChange={e => update("phone", e.target.value)} />
              {errors.phone && <div className="field-error"><i data-lucide="alert-circle" style={{width:13,height:13}}></i>{errors.phone}</div>}
            </div>
            <div className="field-group">
              <label className="field-label">이메일 (선택)</label>
              <input className="field-input" placeholder="example@email.com" value={form.email} onChange={e => update("email", e.target.value)} />
            </div>
            <div className="form-actions">
              <button className="btn-outline" onClick={prev}><i data-lucide="arrow-left" style={{width:15,height:15}}></i>이전</button>
              <button className="btn-fill" disabled={submitting} onClick={submit}>
                {submitting ? <i data-lucide="loader-2" className="spin-icon" style={{width:15,height:15}}></i> : <i data-lucide="check" style={{width:15,height:15}}></i>}
                {submitting ? "접수 처리 중" : "신청 완료"}
              </button>
            </div>
            {submitting && <div className="shimmer-bar" style={{height:6, borderRadius:3, marginTop:14}}></div>}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function FaqView() {
  const [cat, setCat] = useState("전체");
  const [open, setOpen] = useState({});
  const [rIdx, setRIdx] = useState(0);
  const timerRef = useRef(null);

  const filtered = cat === "전체" ? FAQ_ITEMS : FAQ_ITEMS.filter(f => f.cat === cat);
  const pageSize = 3;
  const pageCount = Math.ceil(REVIEWS.length / pageSize);

  useEffect(() => {
    timerRef.current = setInterval(() => setRIdx(i => (i + 1) % pageCount), 5000);
    return () => clearInterval(timerRef.current);
  }, [pageCount]);

  function pause() { clearInterval(timerRef.current); }
  function resume() { timerRef.current = setInterval(() => setRIdx(i => (i + 1) % pageCount), 5000); }

  const visibleReviews = REVIEWS.slice(rIdx * pageSize, rIdx * pageSize + pageSize);

  return (
    <div className="fade-up" style={{paddingBottom:100}}>
      <div className="section"><div className="page-head">
        <h1>자주 묻는 질문</h1>
        <p>이용 전 궁금하신 점을 카테고리별로 확인해보세요.</p>
      </div></div>
      <div className="section"><div className="section-inner tight" style={{paddingTop:8, maxWidth:820}}>
        <div className="faq-chip-row">
          {FAQ_CATEGORIES.map(c => (
            <button key={c} className={"faq-chip" + (cat === c ? " active" : "")} onClick={() => setCat(c)}>{c}</button>
          ))}
        </div>
        <div>
          {filtered.map((it, i) => (
            <div className={"faq-item" + (open[it.q] ? " open" : "")} key={it.q}>
              <button className="faq-q" onClick={() => setOpen(o => ({ ...o, [it.q]: !o[it.q] }))}>
                {it.q}
                <i data-lucide="chevron-down" className="chev" style={{width:18,height:18}}></i>
              </button>
              <div className="faq-a"><div className="faq-a-inner">{it.a}</div></div>
            </div>
          ))}
        </div>

        <div className="review-wrap" onMouseEnter={pause} onMouseLeave={resume}>
          <span className="eyebrow"><i data-lucide="message-square-text" style={{width:13,height:13}}></i>이용 후기</span>
          <h2 style={{fontSize:24, marginTop:4}}>먼저 이용해본 고객들의 이야기</h2>
          <div className="review-track" style={{marginTop:22}}>
            {visibleReviews.map(r => (
              <div className="review-card slide-fade" key={r.name + r.date}>
                <div className="review-head">
                  <div className="avatar-circle">{r.name[0]}</div>
                  <div>
                    <div className="review-name">{r.name}</div>
                    <div className="review-meta">{r.type} · {r.date}</div>
                  </div>
                </div>
                <div className="review-stars">
                  {Array.from({length:5}).map((_, i) => (
                    <i key={i} data-lucide="star" style={{width:13,height:13, fill: i < r.rating ? "var(--m600)" : "none"}}></i>
                  ))}
                </div>
                <p className="review-text">{r.text}</p>
              </div>
            ))}
          </div>
          <div className="review-dots">
            {Array.from({length:pageCount}).map((_, i) => (
              <span key={i} className={"review-dot" + (i === rIdx ? " active" : "")} onClick={() => setRIdx(i)} style={{cursor:"pointer"}}></span>
            ))}
          </div>
        </div>
      </div></div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("main");
  const [presetType, setPresetType] = useState("");

  useEffect(() => {
    window.__moveSafeSetView = (v, type) => {
      if (type) setPresetType(type);
      setView(v);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    return () => { delete window.__moveSafeSetView; };
  }, []);

  function go(v, type) {
    if (type) setPresetType(type);
    setView(v);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  return (
    <div style={{width:"100%", minHeight:"100vh", display:"flex", flexDirection:"column"}}>
      <TopNav view={view} setView={(v) => go(v)} />
      <main style={{flex:1, width:"100%"}}>
        {view === "main" && <HomeView setView={(v) => go(v)} setPresetType={setPresetType} />}
        {view === "services" && <ServicesView presetType={presetType} />}
        {view === "quote" && <QuoteView presetType={presetType} />}
        {view === "faq" && <FaqView />}
      </main>
      {view !== "main" && <Footer />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
