<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무브마켓 — 생활 서비스 통합 카탈로그 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 31°, dark) ── */
:root{
  --m50:#fbf7f2; --m100:#f8efe5; --m200:#f0decb; --m300:#e8caab; --m400:#deb488;
  --m500:#d49f66; --m600:#cb8a45; --m700:#a67139; --m800:#82582c; --m900:#5b3e1f;
  --n0:#201f1e; --n1:#3a3836; --n2:#5a5753; --n3:#7a7571; --n4:#989490;
  --n5:#bab8b5; --n6:#d7d6d5; --n7:#e6e6e5; --n8:#f0f0ef; --n9:#f8f7f7; --n10:#fdfcfc;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0); color: var(--n8);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
#root { width: 100%; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: var(--n3); border-radius: 4px; }

/* ── keyframes ── */
@keyframes fadeInUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
@keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
@keyframes cardPop { from { opacity:0; transform: scale(0.96); } to { opacity:1; transform: scale(1); } }

.fade-up { animation: fadeInUp .5s cubic-bezier(.2,.8,.2,1) both; }
.card-pop { animation: cardPop .4s cubic-bezier(.2,.8,.2,1) both; }
.spin-icon { animation: spin .9s linear infinite; }
.shimmer-bar { background: linear-gradient(90deg, var(--n1) 0%, var(--n2) 40%, var(--n1) 80%); background-size: 800px 100%; animation: shimmer 1.4s linear infinite; }

/* ── uppercase micro-label (design-ref: uppercase weight 500 signature) ── */
.upl { text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }

/* ── search header (archetype signature) ── */
.search-header {
  position: sticky; top: 0; z-index: 200; width: 100%;
  background: rgba(32,31,30,0.92); backdrop-filter: blur(14px);
  border-bottom: 1px dashed var(--n2);
}
.header-row {
  width: 100%; max-width: 1320px; margin: 0 auto; padding: 18px 28px 14px;
  display: flex; align-items: center; gap: 24px; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; color: var(--n9); flex-shrink: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--m600); color: var(--n0); display: flex; align-items: center; justify-content: center; }

.search-bar {
  flex: 1; max-width: 620px; display: flex; align-items: stretch;
  background: var(--n1); border: 1px solid var(--n2); border-radius: 999px;
  padding: 4px; box-shadow: 0 10px 26px rgba(0,0,0,0.28);
}
.search-segment { flex: 1; padding: 10px 18px; border-radius: 999px; text-align: left; position: relative; transition: background .15s; }
.search-segment:hover, .search-segment.open { background: var(--n2); }
.segment-label { font-size: 10.5px; color: var(--n4); }
.segment-value { font-size: 13.5px; font-weight: 600; color: var(--n8); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-divider { width: 1px; background: var(--n2); margin: 8px 0; }
.search-submit {
  /* design-ref(ORYZO) 시드 primary #382416 — "elevated surface / filled CTA button" 역할 그대로 적용 */
  width: 42px; height: 42px; border-radius: 50%; background: #382416; color: var(--n8);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 2px;
  transition: background .15s;
}
.search-submit:hover { background: var(--m600); color: var(--n0); }
.segment-dropdown {
  position: absolute; top: calc(100% + 10px); left: 0; min-width: 180px;
  background: var(--n1); border: 1px solid var(--n2); border-radius: 12px;
  box-shadow: 0 16px 34px rgba(0,0,0,0.4); padding: 8px; z-index: 50;
}
.segment-opt { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; color: var(--n7); }
.segment-opt:hover { background: var(--n2); color: var(--n9); }
.segment-opt.selected { color: var(--m500); font-weight: 700; }
.dropdown-backdrop { position: fixed; inset: 0; z-index: 40; }

.header-nav { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
.header-nav a.navlink { font-size: 13px; color: var(--n5); padding: 6px 2px; border-bottom: 1px solid transparent; }
.header-nav a.navlink.active { color: var(--n9); border-color: var(--m500); }
.user-menu { width: 38px; height: 38px; border-radius: 50%; background: var(--n1); border: 1px solid var(--n2); display: flex; align-items: center; justify-content: center; color: var(--n7); position: relative; }
.profile-menu {
  position: absolute; top: calc(100% + 10px); right: 0; min-width: 200px;
  background: var(--n1); border: 1px solid var(--n2); border-radius: 12px; box-shadow: 0 16px 34px rgba(0,0,0,0.4);
  padding: 8px; z-index: 60; text-align: left;
}
.profile-menu-row { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--n7); display: flex; align-items: center; gap: 8px; }
.profile-menu-row:hover { background: var(--n2); color: var(--n9); }
.header-nav a.navlink, .header-nav button.user-menu { cursor: pointer; }

/* ── toast ── */
.toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 400;
  background: var(--n1); border: 1px solid var(--n2); color: var(--n9); padding: 14px 22px;
  border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: 0 16px 34px rgba(0,0,0,0.45);
  display: flex; align-items: center; gap: 10px;
}
.toast i { color: var(--s1); }

.filter-chips {
  width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 28px 16px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin;
}
.chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 9px 16px;
  border-radius: 999px; background: var(--n1); border: 1px solid var(--n2); color: var(--n6); font-size: 13px; font-weight: 600;
  transition: all .15s;
}
.chip.active { background: var(--m600); border-color: var(--m600); color: var(--n0); }
.chip-icon { display: flex; align-items: center; }

/* ── main / card grid ── */
.main-wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 28px 28px 100px; }
.result-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.result-count { font-size: 14.5px; color: var(--n5); }
.result-count strong { color: var(--n9); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
.listing-card {
  background: var(--n1); border: 1px solid var(--n2); border-radius: 8px; overflow: hidden;
  box-shadow: 0 14px 30px rgba(0,0,0,0.26);
  transition: transform .22s, box-shadow .22s, border-color .22s;
}
.listing-card:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 24px 44px rgba(0,0,0,0.4); border-color: var(--n3); }
.card-image-wrap { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; }
.card-image { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.65) sepia(0.15) brightness(0.85); }
.card-favorite {
  position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(32,31,30,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
  color: var(--n8); transition: color .15s;
}
.card-favorite.active { color: var(--m500); }
.card-group-tag {
  position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px;
  background: rgba(32,31,30,0.7); backdrop-filter: blur(4px); font-size: 10.5px; color: var(--n7);
}
.card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.card-row-1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { font-size: 15.5px; font-weight: 700; color: var(--n9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-rating { font-size: 13px; color: var(--n7); display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.card-rating i { color: var(--m500); }
.card-meta { font-size: 12.5px; color: var(--n5); display: flex; align-items: center; gap: 5px; }
.card-row-4 { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; }
.card-price { font-size: 17px; font-weight: 800; color: var(--n9); }
.price-unit { font-size: 12px; color: var(--n5); }
.card-detail-btn {
  margin-top: 10px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--n3);
  font-size: 13px; font-weight: 700; color: var(--n7); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.card-detail-btn:hover { border-color: var(--m500); color: var(--m400); }

.load-more-sentinel { width: 100%; display: flex; justify-content: center; padding: 30px 0; color: var(--n5); font-size: 13px; }

/* ── drawer ── */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; animation: overlayIn .2s ease;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); z-index: 301;
  background: var(--n1); border-left: 1px solid var(--n2); animation: drawerIn .3s cubic-bezier(.16,.9,.3,1);
  display: flex; flex-direction: column;
}
.drawer-head { padding: 22px 24px; border-bottom: 1px dashed var(--n2); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.drawer-close { width: 34px; height: 34px; border-radius: 50%; background: var(--n2); display: flex; align-items: center; justify-content: center; color: var(--n7); flex-shrink: 0; }
.drawer-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
.drawer-img { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.drawer-img img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.65) sepia(0.15) brightness(0.85); }
.drawer-section-title { font-size: 11px; color: var(--n5); margin: 22px 0 10px; }
.drawer-scope { display: flex; flex-direction: column; gap: 10px; }
.drawer-scope-item { display: flex; gap: 8px; font-size: 13.5px; color: var(--n7); align-items: flex-start; }
.drawer-scope-item i { color: var(--s1); margin-top: 2px; flex-shrink: 0; }
.drawer-cta { padding: 20px 24px; border-top: 1px dashed var(--n2); }

/* ── pill buttons (design-ref: pill filled / outlined) ── */
.btn-pill-fill {
  padding: 14px 26px; border-radius: 36px; background: var(--m600); color: var(--n0);
  font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, transform .15s; width: 100%;
}
.btn-pill-fill:hover { background: var(--m500); transform: translateY(-1px); }
.btn-pill-outline {
  padding: 12px 24px; border-radius: 22.5px; border: 1px solid var(--n8); color: var(--n8);
  font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.btn-pill-outline:hover { background: rgba(255,255,255,0.06); }

/* ── page head (extended / reviews) ── */
.page-head { padding: 40px 0 8px; }
.page-head h1 { font-size: 28px; color: var(--n9); font-weight: 700; }
.page-head p { color: var(--n5); margin-top: 8px; font-size: 14px; }
.dash-divider { border: none; border-top: 1px dashed var(--n2); margin: 24px 0; }

/* ── reviews view ── */
.review-toolbar { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 20px; flex-wrap: wrap; gap: 14px; }
.sort-group { display: flex; gap: 8px; }
.sort-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--n2); background: var(--n1); font-size: 12.5px; font-weight: 600; color: var(--n6); }
.sort-btn.active { background: var(--m600); border-color: var(--m600); color: var(--n0); }
.rating-dist { display: flex; align-items: center; gap: 10px; }
.rating-bar-bg { width: 120px; height: 6px; border-radius: 3px; background: var(--n2); overflow: hidden; }
.rating-bar-fill { height: 100%; background: var(--m600); }
.review-list { display: flex; flex-direction: column; gap: 0; }
.review-row { display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px dashed var(--n2); }
.review-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--n2); color: var(--n7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.review-row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.review-row-name { font-size: 14px; font-weight: 700; color: var(--n9); }
.review-row-meta { font-size: 12px; color: var(--n5); }
.review-row-stars { display: flex; gap: 2px; }
.review-row-stars i { color: var(--n4); }
.review-row-stars i.on { color: var(--m500); }
.review-row-text { font-size: 13.5px; color: var(--n6); line-height: 1.65; }

@media (max-width: 900px) {
  .header-row { flex-wrap: wrap; }
  .search-bar { order: 3; max-width: 100%; }
  .header-nav { order: 2; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
}
</style>

  { name:"배지훈", cat:"보관이사", date:"2026.07.05", rating:4, text:"단기 보관이 필요했는데 창고 상태도 깨끗하고 안심됐습니다." },
  { name:"조은서", cat:"원룸이사", date:"2026.06.29", rating:5, text:"반나절 만에 끝나서 다음날 바로 출근할 수 있었습니다." },
  { name:"한지민", cat:"인터넷가입", date:"2026.06.20", rating:4, text:"이사와 동시에 인터넷 설치까지 한번에 처리돼서 편했어요." },
  { name:"문승우", cat:"렌탈", date:"2026.06.11", rating:5, text:"가전 렌탈 상담이 친절했고 설치도 빠르게 진행됐습니다." },
];

function useIcons() {}

function Chip({ c, active, onClick }) {
  return (
    <button className={"chip" + (active ? " active" : "")} onClick={onClick}>
      <span className="chip-icon"><i className={"ph " + c.icon} style={{fontSize:14}}></i></span>
      <span className="chip-label">{c.label}</span>
    </button>
  );
}

function SearchSegment({ label, value, options, open, onToggle, onSelect }) {
  return (
    <div className={"search-segment" + (open ? " open" : "")} onClick={(e) => { e.stopPropagation(); onToggle(); }}>
      <div className="segment-label">{label}</div>
      <div className="segment-value">{value}</div>
      {open && (
        <div className="segment-dropdown" onClick={(e) => e.stopPropagation()}>
          {options.map(o => (
            <button key={o} className={"segment-opt" + (o === value ? " selected" : "")} onClick={() => onSelect(o)}>{o}</button>
          ))}
        </div>
      )}
    </div>
  );
}

function Header({ navView, setNavView, category, setCategory, region, setRegion, size, setSize, openSegment, setOpenSegment, favCount, showToast }) {
  const cats = navView === "life" ? LIFE_CATS : navView === "moving" ? MOVING_CATS : ALL_CATS;
  const [profileOpen, setProfileOpen] = useState(false);
  return (
    <header className="search-header">
      {openSegment && <div className="dropdown-backdrop" onClick={() => setOpenSegment(null)}></div>}
      {profileOpen && <div className="dropdown-backdrop" onClick={() => setProfileOpen(false)}></div>}
      <div className="header-row">
        <div className="brand">
          <span className="brand-mark"><i className="ph ph-truck" style={{fontSize:16}}></i></span>
          무브마켓
        </div>
        <div className="search-bar">
          <SearchSegment label="지역" value={region} options={REGIONS}
            open={openSegment === "region"} onToggle={() => setOpenSegment(openSegment === "region" ? null : "region")}
            onSelect={(v) => { setRegion(v); setOpenSegment(null); }} />
          <div className="search-divider"></div>
          <SearchSegment label="이사유형" value={catInfo(category).label === "전체" ? "전체" : catInfo(category).label} options={["전체", ...ALL_CATS.map(c=>c.label)]}
            open={openSegment === "cat"} onToggle={() => setOpenSegment(openSegment === "cat" ? null : "cat")}
            onSelect={(v) => { const found = ALL_CATS.find(c => c.label === v); setCategory(found ? found.id : "all"); setOpenSegment(null); }} />
          <div className="search-divider"></div>
          <SearchSegment label="평수" value={size} options={SIZES}
            open={openSegment === "size"} onToggle={() => setOpenSegment(openSegment === "size" ? null : "size")}
            onSelect={(v) => { setSize(v); setOpenSegment(null); }} />
          <button className="search-submit" onClick={() => setOpenSegment(null)}>
            <i className="ph ph-magnifying-glass" style={{fontSize:16}}></i>
          </button>
        </div>
        <nav className="header-nav">
          <a className={"navlink" + (navView === "moving" || navView === "all" ? " active" : "")} onClick={() => { setNavView("moving"); setCategory("all"); }}>이사 서비스</a>
          <a className={"navlink" + (navView === "life" ? " active" : "")} onClick={() => { setNavView("life"); setCategory("all"); }}>생활 서비스 확장</a>
          <a className={"navlink" + (navView === "reviews" ? " active" : "")} onClick={() => setNavView("reviews")}>이용 후기</a>
          <button className="user-menu" onClick={(e) => { e.stopPropagation(); setProfileOpen(o => !o); }}>
            <i className="ph ph-user-circle" style={{fontSize:19}}></i>
            {profileOpen && (
              <div className="profile-menu" onClick={(e) => e.stopPropagation()}>
                <div className="profile-menu-row"><i className="ph ph-heart" style={{fontSize:14}}></i>찜한 서비스 {favCount}건</div>
                <button className="profile-menu-row" onClick={() => { setProfileOpen(false); showToast("로그아웃 되었습니다"); }}>
                  <i className="ph ph-sign-out" style={{fontSize:14}}></i>로그아웃
                </button>
              </div>
            )}
          </button>
        </nav>
      </div>
      {navView !== "reviews" && (
        <div className="filter-chips">
          <Chip c={{ id:"all", label:"전체", icon:"ph-squares-four" }} active={category === "all"} onClick={() => setCategory("all")} />
          {cats.map(c => <Chip key={c.id} c={c} active={category === c.id} onClick={() => setCategory(c.id)} />)}
        </div>
      )}
    </header>
  );
}

function ListingCard({ item, fav, onFav, onOpen, idx }) {
  const info = catInfo(item.cat);
  return (
    <article className="listing-card card-pop" style={{animationDelay: (Math.min(idx,10)*0.04)+"s"}}>
      <div className="card-image-wrap">
        <img className="card-image" src={"https://picsum.photos/seed/260908-mkt-" + item.seed + "/480/360"} alt={item.title} />
        <span className="card-group-tag">{info.label}</span>
        <button className={"card-favorite" + (fav ? " active" : "")} onClick={() => onFav(item.id)}>
          <i className={fav ? "ph-fill ph-heart" : "ph ph-heart"} style={{fontSize:16}}></i>
        </button>
      </div>
      <div className="card-body">
        <div className="card-row-1">
          <h3 className="card-title">{item.title}</h3>
          <div className="card-rating"><i className="ph-fill ph-star" style={{fontSize:12}}></i>{item.rating}</div>
        </div>
        <div className="card-meta"><i className="ph ph-map-pin" style={{fontSize:12}}></i>{item.region}</div>
        <div className="card-meta"><i className="ph ph-calendar-blank" style={{fontSize:12}}></i>{item.date}</div>
        <div className="card-row-4">
          {item.isFree ? (
            <strong className="card-price">무료 상담</strong>
          ) : (
            <React.Fragment><strong className="card-price">{item.price}만원~</strong><span className="price-unit">기본 상품 기준</span></React.Fragment>
          )}
        </div>
        <button className="card-detail-btn" onClick={() => onOpen(item)}>
          서비스 상세보기 <i className="ph ph-arrow-right" style={{fontSize:13}}></i>
        </button>
      </div>
    </article>
  );
}

function DetailDrawer({ item, onClose, showToast }) {
  const closeRef = useRef(null);
  useEffect(() => {
    closeRef.current && closeRef.current.focus();
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  if (!item) return null;
  const info = catInfo(item.cat);
  const scope = [
    "전문 인력 방문 실측 및 견적 안내",
    "이동 전 상태 사진 기록으로 분쟁 예방",
    "이사 완료 후 정리 및 최종 점검",
    item.group === "life" ? "이사 일정과 연동한 원데이 처리" : "전 구간 화물보험 가입 옵션 제공",
  ];
  return (
    <React.Fragment>
      <div className="drawer-backdrop" onClick={onClose}></div>
      <div className="drawer" role="dialog" aria-modal="true">
        <div className="drawer-head">
          <div>
            <span className="upl" style={{fontSize:11, color:"var(--n5)"}}>{info.label}</span>
            <h2 style={{fontSize:19, color:"var(--n9)", marginTop:6}}>{item.title}</h2>
          </div>
          <button className="drawer-close" ref={closeRef} onClick={onClose}><i className="ph ph-x" style={{fontSize:16}}></i></button>
        </div>
        <div className="drawer-body">
          <div className="drawer-img"><img src={"https://picsum.photos/seed/260908-mkt-" + item.seed + "-wide/700/400"} alt={item.title} /></div>
          <div style={{display:"flex", gap:18, alignItems:"center"}}>
            <div className="card-rating" style={{fontSize:14}}><i className="ph-fill ph-star" style={{fontSize:14}}></i>{item.rating} 평점</div>
            <div className="card-meta"><i className="ph ph-map-pin" style={{fontSize:13}}></i>{item.region}</div>
          </div>
          <div className="drawer-section-title upl">가격 범위</div>
          <div style={{fontSize:22, fontWeight:800, color:"var(--n9)"}}>{item.isFree ? "무료 상담" : item.price + "만원 ~"}</div>
          <div className="drawer-section-title upl">포함 범위</div>
          <div className="drawer-scope">
            {scope.map(s => <div className="drawer-scope-item" key={s}><i className="ph ph-check-circle" style={{fontSize:15}}></i>{s}</div>)}
          </div>
          <div className="drawer-section-title upl">후기 요약</div>
          <p style={{fontSize:13.5, color:"var(--n6)", lineHeight:1.7}}>최근 이용 고객들은 포장 꼼꼼함과 일정 준수를 가장 만족스러운 점으로 꼽았습니다.</p>
        </div>
        <div className="drawer-cta">
          <button className="btn-pill-fill" onClick={() => { onClose(); showToast("상담 신청이 접수되었습니다. 담당 매니저가 곧 연락드립니다."); }}>
            <i className="ph ph-file-text" style={{fontSize:15}}></i>이 조건으로 상담 신청
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function CatalogView({ navView, category, favs, setFavs, openItem, setOpenItem }) {
  const filtered = useMemo(() => {
    let base = LISTINGS;
    if (navView === "moving") base = base.filter(l => l.group === "moving");
    if (navView === "life") base = base.filter(l => l.group === "life");
    if (category !== "all") base = base.filter(l => l.cat === category);
    return base;
  }, [navView, category]);

  function toggleFav(id) { setFavs(f => ({ ...f, [id]: !f[id] })); }

  return (
    <div className="main-wrap fade-up" key={navView + category}>
      <div className="page-head">
        <h1>{navView === "life" ? "생활 서비스 확장 카탈로그" : "이사 서비스 카탈로그"}</h1>
        <p>{navView === "life" ? "이사와 함께 준비하면 좋은 인터넷·렌탈·청소 서비스를 같은 방식으로 탐색해보세요." : "지역·유형·평수를 조합해 원하는 이사 서비스를 비교해보세요."}</p>
      </div>
      <div className="result-bar">
        <div className="result-count">총 <strong>{filtered.length}</strong>건의 서비스</div>
      </div>
      <div className="card-grid">
        {filtered.map((item, i) => (
          <ListingCard key={item.id} item={item} idx={i} fav={!!favs[item.id]} onFav={toggleFav} onOpen={setOpenItem} />
        ))}
      </div>
    </div>
  );
}

function ReviewsView() {
  const [sort, setSort] = useState("latest");
  const [catFilter, setCatFilter] = useState("전체");
  const [visible, setVisible] = useState(4);
  const sentinelRef = useRef(null);

  const cats = ["전체", ...Array.from(new Set(REVIEWS.map(r => r.cat)))];
  const sorted = useMemo(() => {
    let list = catFilter === "전체" ? REVIEWS : REVIEWS.filter(r => r.cat === catFilter);
    list = [...list];
    if (sort === "rating") list.sort((a,b) => b.rating - a.rating);
    else list.sort((a,b) => new Date(b.date) - new Date(a.date));
    return list;
  }, [sort, catFilter]);

  useEffect(() => { setVisible(4); }, [sort, catFilter]);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) setVisible(v => Math.min(sorted.length, v + 3));
      });
    }, { threshold: 0.4 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [sorted.length]);

  const avg = (REVIEWS.reduce((s,r) => s+r.rating, 0) / REVIEWS.length).toFixed(1);
  const dist = [5,4,3,2,1].map(star => ({ star, pct: Math.round(100 * REVIEWS.filter(r=>r.rating===star).length / REVIEWS.length) }));

  return (
    <div className="main-wrap fade-up" style={{maxWidth:820}}>
      <div className="page-head">
        <h1>이용 후기</h1>
        <p>실제 이용 고객들의 평가를 정렬·필터링해서 확인할 수 있습니다.</p>
      </div>
      <div style={{display:"flex", alignItems:"center", gap:14, marginTop:20}}>
        <div style={{fontSize:32, fontWeight:800, color:"var(--n9)"}}>{avg}</div>
        <div style={{display:"flex", flexDirection:"column", gap:4}}>
          {dist.map(d => (
            <div className="rating-dist" key={d.star}>
              <span style={{fontSize:11.5, color:"var(--n5)", width:14}}>{d.star}</span>
              <div className="rating-bar-bg"><div className="rating-bar-fill" style={{width:d.pct+"%"}}></div></div>
            </div>
          ))}
        </div>
      </div>
      <hr className="dash-divider" />
      <div className="review-toolbar">
        <div className="sort-group">
          <button className={"sort-btn" + (sort==="latest"?" active":"")} onClick={() => setSort("latest")}>최신순</button>
          <button className={"sort-btn" + (sort==="rating"?" active":"")} onClick={() => setSort("rating")}>평점순</button>
        </div>
        <div className="sort-group" style={{flexWrap:"wrap"}}>
          {cats.map(c => (
            <button key={c} className={"sort-btn" + (catFilter===c?" active":"")} onClick={() => setCatFilter(c)}>{c}</button>
          ))}
        </div>
      </div>
      <div className="review-list">
        {sorted.slice(0, visible).map(r => (
          <div className="review-row" key={r.name + r.date}>
            <div className="review-avatar">{r.name[0]}</div>
            <div style={{flex:1}}>
              <div className="review-row-head">
                <span className="review-row-name">{r.name}</span>
                <span className="review-row-meta">{r.cat} · {r.date}</span>
                <div className="review-row-stars">
                  {Array.from({length:5}).map((_,i) => <i key={i} className={"ph-fill ph-star" + (i < r.rating ? " on" : "")} style={{fontSize:11}}></i>)}
                </div>
              </div>
              <p className="review-row-text">{r.text}</p>
            </div>
          </div>
        ))}
      </div>
      <div className="load-more-sentinel" ref={sentinelRef}>
        {visible < sorted.length ? (
          <span style={{display:"flex", alignItems:"center", gap:8}}><i className="ph ph-circle-notch spin-icon" style={{fontSize:14}}></i>다음 후기를 불러오는 중</span>
        ) : "모든 후기를 확인했습니다"}
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer style={{width:"100%", borderTop:"1px dashed var(--n2)", padding:"36px 28px", display:"flex", justifyContent:"center"}}>
      <div style={{width:"100%", maxWidth:1320, display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:18, fontSize:12.5, color:"var(--n5)"}}>
        <div>© 2026 무브마켓 — 자체 개발 프로젝트</div>
        <div style={{display:"flex", gap:20}}>
          <span className="upl">이용약관</span>
          <span className="upl">개인정보처리방침</span>
          <span className="upl">고객센터</span>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const [navView, setNavView] = useState("all");
  const [category, setCategory] = useState("all");
  const [region, setRegion] = useState("전체");
  const [size, setSize] = useState("전체");
  const [openSegment, setOpenSegment] = useState(null);
  const [favs, setFavs] = useState({});
  const [openItem, setOpenItem] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  const favCount = Object.values(favs).filter(Boolean).length;

  return (
    <div style={{width:"100%", minHeight:"100vh", display:"flex", flexDirection:"column"}} data-archetype="airbnb-search-grid" data-view={navView}>
      <Header navView={navView} setNavView={setNavView} category={category} setCategory={setCategory}
        region={region} setRegion={setRegion} size={size} setSize={setSize}
        openSegment={openSegment} setOpenSegment={setOpenSegment} favCount={favCount} showToast={showToast} />
      <main style={{flex:1, width:"100%"}}>
        {navView === "reviews" ? (
          <ReviewsView />
        ) : (
          <CatalogView navView={navView} category={category} favs={favs} setFavs={setFavs} openItem={openItem} setOpenItem={setOpenItem} />
        )}
      </main>
      <Footer />
      {openItem && <DetailDrawer item={openItem} onClose={() => setOpenItem(null)} showToast={showToast} />}
      {toast && <div className="toast fade-up"><i className="ph-fill ph-check-circle" style={{fontSize:16}}></i>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
