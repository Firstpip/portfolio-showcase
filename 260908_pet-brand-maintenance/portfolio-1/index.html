<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이처발란스 — 반려동물 영양식 브랜드 홈페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 25°, dark) ── */
:root{
  --m50:#f1f0ef; --m100:#f1f0ef; --m200:#f1f0ef; --m300:#e3e0de; --m400:#c7c2be;
  --m500:#a59c96; --m600:#80736a; --m700:#5c4b40; --m800:#382416; --m900:#2e1e12;
  --n0:#201e1e; --n1:#3a3836; --n2:#5a5653; --n3:#7a7471; --n4:#989390;
  --n5:#bab7b5; --n6:#d7d6d5; --n7:#e6e5e5; --n8:#f0f0ef; --n9:#f8f7f7; --n10:#fdfcfc;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --radius-card:12px; --radius-pill:36px; --radius-outline:22.5px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  background:var(--n0); color:var(--n9);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
img{display:block; max-width:100%;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--m500); color:var(--n0);}

/* ── keyframes ── */
@keyframes fadeInUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
@keyframes drawerIn{from{transform:translateX(100%);} to{transform:translateX(0);}}
@keyframes modalIn{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
@keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.35;}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── shell ── */
.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}
.topnav{
  width:100%; position:sticky; top:0; z-index:40;
  background:rgba(32,30,30,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--n1);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; height:64px;
}
.brand{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--n9);}
.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--m400);}
.navtabs{display:flex; align-items:center; gap:28px;}
.navtab{font-size:13px; font-weight:500; letter-spacing:.02em; color:var(--n5); padding:8px 2px; position:relative; transition:color .18s;}
.navtab:hover{color:var(--n8);}
.navtab.active{color:var(--n10);}
.navtab.active::after{content:''; position:absolute; left:0; right:0; bottom:-2px; height:1px; border-bottom:1px dashed var(--m400);}
.navside{display:flex; align-items:center; gap:14px;}
.langtoggle{display:flex; border:1px solid var(--n2); border-radius:var(--radius-pill); overflow:hidden;}
.langbtn{padding:6px 14px; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--n5);}
.langbtn.active{background:var(--m500); color:var(--n0);}

main{flex:1; width:100%;}
footer{width:100%; padding:40px 32px; border-top:1px solid var(--n1); display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--n4);}

/* ── hero ── */
.hero{
  width:100%; padding:96px 32px 64px; text-align:left;
  background:
    radial-gradient(ellipse 900px 500px at 85% -10%, color-mix(in srgb, var(--m600) 22%, transparent), transparent 60%),
    var(--n0);
  border-bottom:1px solid var(--n1);
}
.hero-inner{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:center;}
.hero-tag{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--m400); margin-bottom:18px; animation:fadeInUp .6s ease both;}
.hero h1{font-size:48px; font-weight:600; letter-spacing:-.01em; line-height:1.12; color:var(--n10); margin-bottom:20px; animation:fadeInUp .6s ease .05s both;}
.hero p{font-size:16px; line-height:1.7; color:var(--n6); max-width:480px; margin-bottom:32px; animation:fadeInUp .6s ease .1s both;}
.hero-actions{display:flex; gap:12px; animation:fadeInUp .6s ease .15s both;}
.btn-primary{background:var(--m500); color:var(--n0); padding:13px 28px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; letter-spacing:.02em; transition:background .18s, transform .18s;}
.btn-primary:hover{background:var(--m400); transform:translateY(-1px);}
.btn-ghost{border:1px solid var(--n3); color:var(--n8); padding:12px 26px; border-radius:var(--radius-outline); font-size:13px; font-weight:600; transition:border-color .18s, color .18s;}
.btn-ghost:hover{border-color:var(--n6); color:var(--n10);}
.hero-visual{position:relative; height:340px; border-radius:16px; overflow:hidden; border:1px solid var(--n1); animation:fadeInUp .7s ease .1s both;}
.hero-visual img{width:100%; height:100%; object-fit:cover; filter:saturate(.7) brightness(.72);}
.hero-visual::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, color-mix(in srgb, var(--n0) 85%, transparent) 100%);}
.hero-card{position:absolute; left:20px; bottom:20px; right:20px; background:color-mix(in srgb, var(--n0) 55%, transparent); backdrop-filter:blur(6px); border:1px solid var(--n2); border-radius:10px; padding:14px 16px;}
.hero-card-title{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--n7); margin-bottom:4px;}
.hero-card-sub{font-size:13px; color:var(--n8); line-height:1.5;}

/* ── catalog (gallery-filter composition) ── */
.catalog{width:100%; max-width:1180px; margin:0 auto; padding:64px 32px 96px; display:grid; grid-template-columns:220px 1fr; gap:40px;}
.section-eyebrow{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--m400); margin-bottom:10px;}
.section-title{font-size:26px; font-weight:600; color:var(--n10); margin-bottom:28px; grid-column:1/-1;}
.filter-rail{display:flex; flex-direction:column; gap:4px; align-self:start; position:sticky; top:88px;}
.filter-item{text-align:left; padding:10px 14px; border-radius:8px; font-size:13px; color:var(--n6); transition:background .15s, color .15s;}
.filter-item:hover{background:var(--n1); color:var(--n9);}
.filter-item.active{background:var(--n1); color:var(--m400); font-weight:600;}
.filter-count{float:right; color:var(--n4); font-size:11px;}
.gallery-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;}
.p-card{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-card); overflow:hidden; cursor:pointer; transition:transform .2s, border-color .2s, box-shadow .2s; animation:fadeInUp .5s ease both;}
.p-card:hover{transform:translateY(-4px); border-color:var(--n4); box-shadow:0 16px 32px -18px rgba(0,0,0,.55);}
.p-card-img{width:100%; height:150px; overflow:hidden;}
.p-card-img img{width:100%; height:100%; object-fit:cover; filter:saturate(.75) brightness(.82);}
.p-card-body{padding:16px;}
.p-card-tag{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--n5); background:var(--n2); padding:3px 8px; border-radius:5px; margin-bottom:8px;}
.p-card-name{font-size:14px; font-weight:600; color:var(--n9); margin-bottom:6px; line-height:1.4;}
.p-card-desc{font-size:12px; color:var(--n5); line-height:1.5;}

/* ── quick-view drawer ── */
.overlay{position:fixed; inset:0; background:rgba(10,8,6,.6); z-index:60; animation:fadeInUp .2s ease both;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--n1); border-left:1px solid var(--n2); z-index:61; overflow-y:auto; animation:drawerIn .32s cubic-bezier(.2,.8,.2,1) both;}
.drawer-head{display:flex; justify-content:space-between; align-items:flex-start; padding:24px; border-bottom:1px solid var(--n2);}
.drawer-close{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--n2); color:var(--n7); transition:background .15s;}
.drawer-close:hover{background:var(--n3);}
.drawer-img{width:100%; height:200px;}
.drawer-img img{width:100%; height:100%; object-fit:cover; filter:saturate(.75) brightness(.8);}
.drawer-body{padding:24px;}
.drawer-body h3{font-size:20px; font-weight:600; color:var(--n10); margin-bottom:8px;}
.drawer-body .lead{font-size:13px; color:var(--n6); line-height:1.6; margin-bottom:20px;}
.spec-table{width:100%; border-collapse:collapse; margin-bottom:20px;}
.spec-table tr{border-bottom:1px solid var(--n2);}
.spec-table td{padding:9px 0; font-size:12.5px; color:var(--n7);}
.spec-table td:first-child{color:var(--n5); width:110px;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px;}
.badge-ok{background:var(--s1-bg); color:var(--s1-text);}

/* ── product screen (langtab editable) ── */
.page-wrap{max-width:1180px; margin:0 auto; padding:56px 32px 96px;}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px; gap:24px; flex-wrap:wrap;}
.page-head h2{font-size:28px; font-weight:600; color:var(--n10);}
.page-head p{font-size:13.5px; color:var(--n5); margin-top:8px; max-width:520px; line-height:1.6;}
.pill-tabs{display:flex; gap:6px; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-pill); padding:4px;}
.pill-tab{padding:7px 18px; font-size:12px; font-weight:600; border-radius:var(--radius-pill); color:var(--n6);}
.pill-tab.active{background:var(--m500); color:var(--n0);}
.edit-toggle{display:flex; align-items:center; gap:8px; border:1px solid var(--n3); border-radius:var(--radius-outline); padding:9px 18px; font-size:12.5px; font-weight:600; color:var(--n8);}
.edit-toggle.on{border-color:var(--m400); color:var(--m400);}
.product-detail{display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:start;}
.pd-gallery{border-radius:16px; overflow:hidden; border:1px solid var(--n1); height:360px;}
.pd-gallery img{width:100%; height:100%; object-fit:cover; filter:saturate(.75) brightness(.82);}
.editable{outline:1px dashed transparent; border-radius:6px; padding:2px 4px; margin:-2px -4px; transition:outline-color .15s, background .15s;}
.editing .editable{outline-color:var(--m400); background:color-mix(in srgb, var(--m500) 10%, transparent);}
.block-title{font-size:22px; font-weight:600; color:var(--n10); margin-bottom:14px;}
.block-body{font-size:13.5px; color:var(--n6); line-height:1.7; margin-bottom:24px;}
.guide-table{width:100%; border-collapse:collapse;}
.guide-table th, .guide-table td{text-align:left; padding:10px 12px; font-size:12.5px; border-bottom:1px solid var(--n2);}
.guide-table th{color:var(--n5); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
.guide-table td{color:var(--n8);}

/* ── events screen ── */
.toolbar-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.event-list{display:flex; flex-direction:column; gap:10px;}
.event-row{display:flex; align-items:center; gap:16px; background:var(--n1); border:1px solid var(--n2); border-radius:10px; padding:16px 18px; transition:border-color .15s;}
.event-row:hover{border-color:var(--n4);}
.event-thumb{width:52px; height:52px; border-radius:8px; overflow:hidden; flex-shrink:0;}
.event-thumb img{width:100%; height:100%; object-fit:cover; filter:saturate(.7) brightness(.8);}
.event-info{flex:1; min-width:0;}
.event-title{font-size:13.5px; font-weight:600; color:var(--n9); margin-bottom:3px;}
.event-range{font-size:11.5px; color:var(--n5);}
.status-pill{font-size:11px; font-weight:600; padding:4px 11px; border-radius:20px; display:flex; align-items:center; gap:5px; flex-shrink:0;}
.status-live{background:var(--s1-bg); color:var(--s1-text);}
.status-scheduled{background:var(--n2); color:var(--n7);}
.status-ended{background:var(--n2); color:var(--n5);}
.status-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.status-live .status-dot{animation:pulseDot 1.6s ease-in-out infinite;}
.event-actions{display:flex; gap:6px;}
.icon-btn{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n5); transition:background .15s, color .15s;}
.icon-btn:hover{background:var(--n2); color:var(--n8);}

/* ── modal ── */
.modal-overlay{position:fixed; inset:0; background:rgba(10,8,6,.65); z-index:70; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeInUp .18s ease both;}
.modal{width:480px; max-width:100%; background:var(--n1); border:1px solid var(--n2); border-radius:16px; padding:28px; animation:modalIn .22s cubic-bezier(.2,.8,.2,1) both;}
.modal h3{font-size:17px; font-weight:600; color:var(--n10); margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--n5); margin-bottom:7px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select{width:100%; background:transparent; border:none; border-bottom:1px solid var(--n3); color:var(--n9); font-size:13.5px; padding:8px 2px; font-family:inherit;}
.field input:focus, .field select:focus{outline:none; border-color:var(--m400);}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}

/* ── seo screen ── */
.seo-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:28px;}
.seo-card{background:var(--n1); border:1px solid var(--n2); border-radius:14px; padding:22px;}
.seo-card h4{font-size:13px; font-weight:600; color:var(--n8); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.code-block{background:var(--n0); border:1px solid var(--n2); border-radius:10px; padding:16px; font-family:'SFMono-Regular', Menlo, monospace; font-size:11px; line-height:1.75; color:var(--n6); overflow-x:auto; white-space:pre;}
.code-block .k{color:var(--m400);}
.audit-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--n2); font-size:12.5px;}
.audit-row:last-child{border-bottom:none;}
.audit-page{color:var(--n8);}
.audit-meta{color:var(--n5); font-size:11px;}
.recheck-btn{display:inline-flex; align-items:center; gap:8px; margin-top:16px; border:1px solid var(--n3); border-radius:var(--radius-outline); padding:10px 20px; font-size:12.5px; font-weight:600; color:var(--n8);}
.recheck-btn:hover{border-color:var(--n5);}
.spin-icon{animation:spin .9s linear infinite;}
.skeleton{height:14px; border-radius:4px; background:linear-gradient(90deg, var(--n2) 0%, var(--n3) 50%, var(--n2) 100%); background-size:400px 100%; animation:shimmer 1.3s linear infinite;}

/* ── toast ── */
.toast{position:fixed; bottom:28px; right:28px; background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:14px 20px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--n9); z-index:80; animation:fadeInUp .3s ease both; box-shadow:0 20px 40px -20px rgba(0,0,0,.6);}

@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;}
  .catalog{grid-template-columns:1fr;}
  .filter-rail{flex-direction:row; overflow-x:auto; position:static;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);}
  .product-detail{grid-template-columns:1fr;}
  .seo-grid{grid-template-columns:1fr;}
  .navtabs{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const CATEGORIES = ['전체','처방식','영양제','간식'];
const PRODUCTS = [

  {id:5, name:'퍼피그로스 성장기영양', category:'영양제', desc:'성장기 강아지의 활동량에 맞춘 고칼로리 액상 보충식입니다.',

  {id:6, name:'덴탈케어 츄잉스틱', category:'간식', desc:'치석 관리를 돕는 저칼로리 간식으로 매일 급여에 부담이 적습니다.',

const BANNERS = [
  {id:1, title:'가을맞이 관절케어 세트 프로모션', start:'2025.09.10', end:'2025.09.24', priority:1, status:'live', img:'events-1'},
  {id:2, title:'노령견 건강검진 캠페인 배너', start:'2025.09.20', end:'2025.10.05', priority:2, status:'scheduled', img:'events-2'},
  {id:3, title:'수의사 상담 이벤트 팝업', start:'2025.08.01', end:'2025.08.31', priority:1, status:'ended', img:'events-3'},
  {id:4, title:'신제품 퍼피그로스 런칭 배너', start:'2025.09.15', end:'2025.10.15', priority:1, status:'live', img:'events-4'},

const AUDIT_ROWS = [
  {page:'/ko/products/senior-joint', jsonld:'ok', meta:'ok'},
  {page:'/en/products/senior-joint', jsonld:'ok', meta:'ok'},
  {page:'/ko/products/kidney-care', jsonld:'ok', meta:'ok'},
  {page:'/en/products/kidney-care', jsonld:'issue', meta:'ok'},

const I = ({name, size=16, className=''}) => <i data-lucide={name} style={{width:size, height:size}} className={className}></i>;

function Toast({message, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2600); return ()=>clearTimeout(t); }, []);
  return <div className="toast"><I name="check-circle-2" className="ic-toast"/><span>{message}</span></div>;
}

function Topnav({tab, setTab, lang, setLang}){
  const tabs = [
    {key:'main', label:'홈'},
    {key:'product', label:'브랜드 스토리·제품 상세 콘텐츠'},
    {key:'events', label:'이벤트 배너·팝업 노출 관리'},
    {key:'seo', label:'기술 SEO·구조화 데이터 마크업'},
  ];
  return (
    <header className="topnav">
      <div className="brand"><span className="dot"></span>네이처발란스</div>
      <nav className="navtabs">
        {tabs.map(t=>(
          <button key={t.key} className={"navtab" + (tab===t.key ? ' active' : '')} onClick={()=>setTab(t.key)}>{t.label}</button>
        ))}
      </nav>
      <div className="navside">
        <div className="langtoggle">
          <button className={"langbtn" + (lang==='ko' ? ' active' : '')} onClick={()=>setLang('ko')}>KO</button>
          <button className={"langbtn" + (lang==='en' ? ' active' : '')} onClick={()=>setLang('en')}>EN</button>
        </div>
      </div>
    </header>
  );
}

function QuickView({product, onClose}){
  if(!product) return null;
  return (
    <React.Fragment>
      <div className="overlay" onClick={onClose}></div>
      <aside className="drawer">
        <div className="drawer-head">
          <span className="badge badge-ok"><I name="check" size={12}/>급여가이드 등록됨</span>
          <button className="drawer-close" onClick={onClose}><I name="x" size={16}/></button>
        </div>
        <div className="drawer-img"><img src={product.img} alt={product.name}/></div>
        <div className="drawer-body">
          <h3>{product.name}</h3>
          <p className="lead">{product.desc}</p>
          <table className="spec-table">
            <tbody>
              <tr><td>카테고리</td><td>{product.category}</td></tr>
              <tr><td>주요 성분</td><td>{product.ingredients}</td></tr>
            </tbody>
          </table>
          <table className="guide-table">
            <thead><tr><th>체중 구간</th><th>1일 급여량</th></tr></thead>
            <tbody>
              {product.guide.map((g,i)=>(<tr key={i}><td>{g[0]}</td><td>{g[1]}</td></tr>))}
            </tbody>
          </table>
        </div>
      </aside>
    </React.Fragment>
  );
}

function MainScreen({lang, onSelect, setTab}){
  const [filter, setFilter] = useState('전체');
  const filtered = useMemo(()=> filter==='전체' ? PRODUCTS : PRODUCTS.filter(p=>p.category===filter), [filter]);
  const counts = useMemo(()=>{
    const m = {'전체':PRODUCTS.length};
    CATEGORIES.slice(1).forEach(c=> m[c] = PRODUCTS.filter(p=>p.category===c).length);
    return m;
  }, []);
  const T = lang==='ko'
    ? {tag:'PET NUTRITION BRAND', h1:'수의사가 설계한 액상 영양식, 네이처발란스', p:'처방식부터 회복기 영양제까지 — 반려동물의 생애주기에 맞춘 액상 영양 솔루션을 제공합니다. 국문·영문 페이지가 동일한 콘텐츠 구조로 함께 관리됩니다.', cta1:'제품 살펴보기', cta2:'브랜드 스토리 보기', cardTitle:'DESIGNED BY VETERINARIAN', cardSub:'전 제품 수의사 자문을 거쳐 급여량·성분 배합을 설계합니다.'}
    : {tag:'PET NUTRITION BRAND', h1:'Vet-formulated liquid nutrition, NatureBalance', p:'From prescription diets to recovery supplements — liquid nutrition designed for every life stage. Korean and English pages share a single content structure.', cta1:'View Products', cta2:'Our Brand Story', cardTitle:'DESIGNED BY VETERINARIAN', cardSub:'Every formula is reviewed by veterinary advisors for dosage and ingredient balance.'};
  return (
    <React.Fragment>
      <section className="hero">
        <div className="hero-inner">
          <div>
            <div className="hero-tag">{T.tag}</div>
            <h1>{T.h1}</h1>
            <p>{T.p}</p>
            <div className="hero-actions">
              <button className="btn-primary" onClick={()=>setTab('main-scroll')}>{T.cta1}</button>
              <button className="btn-ghost" onClick={()=>setTab('product')}>{T.cta2}</button>
            </div>
          </div>
          <div className="hero-visual">
            <img src="https://picsum.photos/seed/pet-brand-homepage-hero/900/700" alt="브랜드 비주얼"/>
            <div className="hero-card">
              <div className="hero-card-title">{T.cardTitle}</div>
              <div className="hero-card-sub">{T.cardSub}</div>
            </div>
          </div>
        </div>
      </section>
      <section className="catalog" id="catalog-section">
        <h2 className="section-title">제품 라인업</h2>
        <aside className="filter-rail">
          {CATEGORIES.map(c=>(
            <button key={c} className={"filter-item"+(filter===c?' active':'')} onClick={()=>setFilter(c)}>
              {c}<span className="filter-count">{counts[c] ?? PRODUCTS.filter(p=>p.category===c).length}</span>
            </button>
          ))}
        </aside>
        <div className="gallery-grid">
          {filtered.map((p,i)=>(
            <div className="p-card" key={p.id} style={{animationDelay:(i*0.05)+'s'}} onClick={()=>onSelect(p)}>
              <div className="p-card-img"><img src={p.img} alt={p.name}/></div>
              <div className="p-card-body">
                <span className="p-card-tag">{p.category}</span>
                <div className="p-card-name">{p.name}</div>
                <div className="p-card-desc">{p.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </section>
    </React.Fragment>
  );
}

function ProductScreen(){
  const [lang, setLang] = useState('ko');
  const [editing, setEditing] = useState(false);
  const featured = PRODUCTS[0];
  const KO = {
    title:'브랜드 스토리', body:'네이처발란스는 수의사가 직접 반려동물 임상 현장에서 마주한 급여 불편을 해결하기 위해 시작한 액상 영양식 브랜드입니다. 정제 대신 액상 제형을 택한 이유는 노령견·회복기 반려동물의 섭취 부담을 낮추기 위함입니다.',
    ptitle:featured.name, pdesc:featured.desc,
  };
  const EN = {
    title:'Brand Story', body:'NatureBalance began when veterinarians on the clinical floor set out to solve a real feeding problem. We chose liquid formulation over tablets to reduce intake burden for senior and recovering pets.',
    ptitle:'PureSenior Joint Care', pdesc:'A low-fat liquid prescription diet that eases joint strain for less active senior dogs.',
  };

        <div>
          <h2>브랜드 스토리·제품 상세 콘텐츠</h2>
          <p>배너 원본과 수정 요청 문서를 그대로 반영할 수 있도록, 콘텐츠 블록 단위로 국문·영문을 함께 관리하는 구조를 구현합니다.</p>
        </div>
        <div style={{display:'flex', gap:10}}>
          <div className="pill-tabs">
            <button className={"pill-tab"+(lang==='ko'?' active':'')} onClick={()=>setLang('ko')}>국문</button>
            <button className={"pill-tab"+(lang==='en'?' active':'')} onClick={()=>setLang('en')}>영문</button>

      <div className="product-detail">

        <div>
          <div className="block-title editable">{T.title}</div>
          <div className="block-body editable">{T.body}</div>

          <table className="guide-table">
            <thead><tr><th>체중 구간</th><th>1일 급여량</th></tr></thead>
            <tbody>
              {featured.guide.map((g,i)=>(<tr key={i}><td className="editable">{g[0]}</td><td className="editable">{g[1]}</td></tr>))}
            </tbody>
          </table>
        </div>
      </div>
    </div>

}

function EventsScreen({toast}){
  const [banners, setBanners] = useState(BANNERS);
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState({title:'', start:'', end:'', priority:'1'});

  const statusMeta = {
    live:{cls:'status-live', label:'진행중'},
    scheduled:{cls:'status-scheduled', label:'노출예정'},
    ended:{cls:'status-ended', label:'종료'},
  };

  const submit = (e) => {
    e.preventDefault();
    if(!form.title || !form.start || !form.end) return;
    setBanners(prev => [{id:Date.now(), title:form.title, start:form.start, end:form.end, priority:Number(form.priority), status:'scheduled', img:'events-new'}, ...prev]);
    setModalOpen(false);
    setForm({title:'', start:'', end:'', priority:'1'});
    toast('배너가 노출 예정 목록에 등록되었습니다');
  };

  return (
    <div className="page-wrap">
      <div className="toolbar-row">
        <div>
          <h2>이벤트 배너·팝업 노출 관리</h2>
          <p style={{fontSize:13.5, color:'var(--n5)', marginTop:8, maxWidth:520, lineHeight:1.6}}>노출 시작·종료 일시를 설정하면 상태가 자동으로 예정 → 진행중 → 종료로 전환되는 구조를 구현합니다.</p>
        </div>
        <button className="btn-primary" onClick={()=>setModalOpen(true)}><I name="plus" size={14}/> 새 배너 등록</button>
      </div>
      <div className="event-list">
        {banners.map(b=>(
          <div className="event-row" key={b.id}>
            <div className="event-thumb"><img src={"https://picsum.photos/seed/pet-brand-homepage-"+b.img+"/120/120"} alt=""/></div>
            <div className="event-info">
              <div className="event-title">{b.title}</div>
              <div className="event-range">{b.start} ~ {b.end} · 우선순위 {b.priority}</div>
            </div>
            <span className={"status-pill "+statusMeta[b.status].cls}><span className="status-dot"></span>{statusMeta[b.status].label}</span>
            <div className="event-actions">
              <button className="icon-btn" onClick={()=>toast(b.title+' 노출 정보를 확인했습니다')}><I name="eye" size={15}/></button>
              <button className="icon-btn" onClick={()=>setBanners(prev=>prev.filter(x=>x.id!==b.id))}><I name="trash-2" size={15}/></button>
            </div>
          </div>
        ))}
      </div>
      {modalOpen && (
        <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>새 배너 등록</h3>
            <form onSubmit={submit}>
              <div className="field"><label>배너 제목</label><input value={form.title} onChange={e=>setForm({...form, title:e.target.value})} placeholder="예: 겨울철 관절케어 프로모션"/></div>
              <div className="field"><label>노출 시작일</label><input type="date" value={form.start} onChange={e=>setForm({...form, start:e.target.value})}/></div>
              <div className="field"><label>노출 종료일</label><input type="date" value={form.end} onChange={e=>setForm({...form, end:e.target.value})}/></div>
              <div className="field"><label>우선순위</label>
                <select value={form.priority} onChange={e=>setForm({...form, priority:e.target.value})}>
                  <option value="1">1 (최우선)</option><option value="2">2</option><option value="3">3</option>
                </select>
              </div>
              <div className="modal-actions">
                <button type="button" className="btn-ghost" onClick={()=>setModalOpen(false)}>취소</button>
                <button type="submit" className="btn-primary">등록</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function SeoScreen({toast}){
  const [checking, setChecking] = useState(false);
  const runCheck = () => {
    setChecking(true);
    setTimeout(()=>{ setChecking(false); toast('구조화 데이터 재검사가 완료되었습니다'); }, 1500);
  };
  return (
    <div className="page-wrap">
      <div className="page-head">
        <div>
          <h2>기술 SEO·구조화 데이터 마크업</h2>
          <p>제품·조직·탐색 경로에 대한 Schema.org 구조화 데이터를 언어별로 생성하고, 메타태그·hreflang 상태를 점검하는 구조를 구현합니다.</p>
        </div>
      </div>
      <div className="seo-grid">
        <div className="seo-card">
          <h4><I name="file-code" size={15}/> Product JSON-LD 미리보기</h4>
          <div className="code-block">{'{\n  '}<span className="k">"@context"</span>{': "https://schema.org",\n  '}<span className="k">"@type"</span>{': "Product",\n  '}<span className="k">"name"</span>{': "퓨어시니어 관절케어",\n  '}<span className="k">"inLanguage"</span>{': "ko",\n  '}<span className="k">"brand"</span>{': "네이처발란스",\n  '}<span className="k">"category"</span>{': "처방식"\n}'}</div>
          <button className="recheck-btn" onClick={runCheck} disabled={checking}>
            {checking ? <I name="loader-2" className="spin-icon" size={14}/> : <I name="refresh-cw" size={14}/>}
            {checking ? '재검사 중…' : '지금 재검사'}
          </button>
        </div>
        <div className="seo-card">
          <h4><I name="languages" size={15}/> hreflang · 구조화 데이터 점검</h4>
          {checking ? (
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              {[1,2,3,4].map(i=><div className="skeleton" key={i}></div>)}
            </div>
          ) : (
            AUDIT_ROWS.map((r,i)=>(
              <div className="audit-row" key={i}>
                <span className="audit-page">{r.page}</span>
                <span className="audit-meta">
                  {r.jsonld==='ok' ? <span className="badge badge-ok"><I name="check" size={11}/>정상</span> : <span className="badge" style={{background:'var(--s2-bg)', color:'var(--s2-text)'}}><I name="alert-triangle" size={11}/>확인필요</span>}
                </span>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('main');
  const [lang, setLang] = useState('ko');
  const [quickView, setQuickView] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg) => setToastMsg(msg);

  const handleTab = (key) => {
    if(key==='main-scroll'){ setTab('main'); setTimeout(()=>{ document.getElementById('catalog-section')?.scrollIntoView({behavior:'smooth'}); }, 50); return; }
    setTab(key); setQuickView(null);
  };

  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });

  return (
    <div className="app-shell" data-archetype="none">
      <Topnav tab={tab} setTab={handleTab} lang={lang} setLang={setLang}/>
      <main>
        {tab==='main' && <MainScreen lang={lang} onSelect={setQuickView} setTab={handleTab}/>}
        {tab==='product' && <ProductScreen/>}
        {tab==='events' && <EventsScreen toast={toast}/>}
        {tab==='seo' && <SeoScreen toast={toast}/>}
      </main>
      <footer>
        <span>© 2025 샘플기업 네이처발란스 — 자체 개발 프로젝트</span>
        <span>KO / EN · Multilingual Content System</span>
      </footer>
      <QuickView product={quickView} onClose={()=>setQuickView(null)}/>
      {toastMsg && <Toast message={toastMsg} onDone={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
