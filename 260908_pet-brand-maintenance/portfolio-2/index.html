<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이처발란스 콘텐츠·SEO 운영 관제 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 223°, light) ── */
:root{
  --m50:#f1f2f4; --m100:#f1f2f4; --m200:#e3e5e9; --m300:#c8cbd2; --m400:#a6abb7;
  --m500:#818899; --m600:#5d667d; --m700:#3a4560; --m800:#30394f; --m900:#252c3d;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b6ba; --n6:#909298; --n7:#777b86; --n8:#53555a; --n9:#36373a; --n10:#17191c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:24px; --radius-pill:9999px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{font-family:'Pretendard', -apple-system, sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
img{display:block; max-width:100%;}
table{border-collapse:collapse;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@keyframes modalIn{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes countUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ── shell ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{position:fixed; left:0; top:0; bottom:0; width:248px; background:var(--n1); border-right:1px solid var(--n3); display:flex; flex-direction:column; padding:20px 14px; overflow-y:auto;}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:8px 10px 20px; font-size:15px; font-weight:600; color:var(--n10);}
.sidebar-brand .mark{width:26px; height:26px; border-radius:8px; background:var(--m700); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
.env-pill{margin:0 10px 18px; font-size:11px; font-weight:600; color:var(--n7); background:var(--n1); padding:6px 10px; border-radius:8px; display:flex; align-items:center; gap:6px;}
.sidebar-section{margin-bottom:18px;}
.sidebar-section-title{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--n6); padding:0 10px 8px;}
.sidebar-link{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border-radius:9px; font-size:13.5px; color:var(--n8); margin-bottom:2px; transition:background .15s, color .15s;}
.sidebar-link:hover{background:var(--n2); color:var(--n10);}
.sidebar-link.active{background:var(--m50); color:var(--n10); font-weight:600;}
.sidebar-foot{margin-top:auto; padding:12px 10px; font-size:11px; color:var(--n6); border-top:1px solid var(--n3);}

.main-wrap{margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px); display:flex; flex-direction:column;}
.page-header{padding:28px 36px 0;}
.page-title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
.page-title{font-size:24px; font-weight:700; color:var(--n10);}
.page-meta{font-size:12px; color:var(--n6); margin-top:6px;}
.page-actions{display:flex; gap:10px;}
.btn-secondary{border:1px solid var(--n4); border-radius:var(--radius-pill); padding:9px 16px; font-size:12.5px; font-weight:600; color:var(--n8); display:flex; align-items:center; gap:6px; transition:border-color .15s;}
.btn-secondary:hover{border-color:var(--n6);}
.btn-primary{background:var(--m700); color:#fff; border-radius:var(--radius-pill); padding:10px 18px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; transition:background .15s;}
.btn-primary:hover{background:var(--m800);}

/* ── stat row (KPI + sparkline) ── */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:22px 36px 0;}
.stat-card{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:20px 22px; box-shadow:0 1px 3px rgba(0,0,0,.04); animation:countUp .4s ease both;}
.stat-label{font-size:12px; color:var(--n7); margin-bottom:10px; font-weight:600;}
.stat-value{font-size:46px; font-weight:700; color:var(--n10); line-height:1; letter-spacing:-0.02em;}
.stat-delta{font-size:12px; font-weight:600; margin-top:8px; display:inline-flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--n7);}
.stat-delta.negative{color:var(--n7);}
.stat-delta.neutral{color:var(--n6);}
.stat-sparkline{margin-top:10px; width:100%; height:28px; display:block;}

/* ── insight-board: hero-viz + kpi-side + widget-grid ── */
.insight-board{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; padding:20px 36px 0;}
.hero-viz{background:var(--n0); border:1px solid var(--n3); border-radius:18px; padding:22px 24px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
.hero-viz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.hero-viz-title{font-size:14px; font-weight:700; color:var(--n10);}
.hero-viz-sub{font-size:11.5px; color:var(--n6); margin-top:3px;}
.kpi-side{display:flex; flex-direction:column; gap:12px;}
.kpi-mini{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:16px 18px; flex:1;}
.kpi-mini-label{font-size:11.5px; color:var(--n7); font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.kpi-mini-value{font-size:20px; font-weight:700; color:var(--n10);}
.widget-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:16px 36px 0;}
.widget{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
.widget-title{font-size:12.5px; font-weight:700; color:var(--n9); margin-bottom:12px; display:flex; align-items:center; gap:7px;}
.mini-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--n2); font-size:12px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .label{color:var(--n8);}

/* ── data section: tabs + table ── */
.data-section{padding:22px 36px 40px;}
.tab-bar{display:flex; gap:22px; border-bottom:1px solid var(--n3); margin-bottom:16px;}
.tab{padding:10px 2px; font-size:13px; font-weight:600; color:var(--n6); border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{color:var(--m700); border-bottom-color:var(--m700);}
.data-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.search{border:1px solid var(--n4); border-radius:10px; padding:9px 14px; font-size:12.5px; width:240px; color:var(--n9);}
.search::placeholder{color:var(--n6);}
.filter-chip{border:1px solid var(--n4); border-radius:var(--radius-pill); padding:7px 14px; font-size:12px; color:var(--n7); display:flex; align-items:center; gap:5px;}
.filter-chip.active{background:var(--m50); border-color:var(--m300); color:var(--m700); font-weight:600;}
.export-btn{margin-left:auto; border:1px solid var(--n4); border-radius:var(--radius-pill); padding:8px 16px; font-size:12.5px; font-weight:600; color:var(--n8); display:flex; align-items:center; gap:6px;}
.data-table-wrap{border:1px solid var(--n3); border-radius:16px; overflow:hidden;}
.data-table{width:100%;}
.data-table th{text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--n6); background:var(--n1); padding:11px 16px;}
.data-table td{padding:13px 16px; font-size:12.5px; color:var(--n8); border-top:1px solid var(--n2);}
.data-table tr:hover td{background:var(--n1);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px;}
.badge-wait{background:var(--n2); color:var(--n7);}
.badge-progress{background:var(--s3-bg); color:var(--s3-text);}
.badge-done{background:var(--s1-bg); color:var(--s1-text);}
.badge-issue{background:var(--s2-bg); color:var(--s2-text);}
.row-action{color:var(--m700); font-weight:600; font-size:12px;}

/* ── modal ── */
.modal-overlay{position:fixed; inset:0; background:rgba(30,30,32,.4); z-index:70; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeInUp .16s ease both;}
.modal{width:460px; max-width:100%; background:var(--n0); border-radius:var(--radius-card); padding:28px; animation:modalIn .2s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 20px 50px rgba(0,0,0,.18);}
.modal h3{font-size:17px; font-weight:700; color:var(--n10); margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--n6); margin-bottom:7px; text-transform:uppercase; letter-spacing:.03em;}
.field input, .field select, .field textarea{width:100%; background:var(--n1); border:1px solid var(--n3); border-radius:10px; color:var(--n9); font-size:13.5px; padding:9px 12px; font-family:inherit;}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--m500);}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}

/* ── other screens (sync/health/reports) ── */
.section-card{background:var(--n0); border:1px solid var(--n3); border-radius:18px; padding:24px; margin:0 36px 20px;}
.section-card h4{font-size:14px; font-weight:700; color:var(--n10); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.diff-row{display:grid; grid-template-columns:1.4fr 1fr 1fr .8fr; gap:12px; padding:12px 0; border-bottom:1px solid var(--n2); font-size:12.5px; align-items:center;}
.diff-row:last-child{border-bottom:none;}
.diff-head{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--n6); border-bottom:1px solid var(--n3); padding-bottom:10px;}
.chip-btn{border:1px solid var(--n4); border-radius:8px; padding:6px 12px; font-size:11.5px; font-weight:600; color:var(--n8);}
.skeleton{height:14px; border-radius:5px; background:linear-gradient(90deg, var(--n2) 0%, var(--n3) 50%, var(--n2) 100%); background-size:400px 100%; animation:shimmer 1.3s linear infinite;}
.spin-icon{display:inline-flex; animation:spin .9s linear infinite;}
.month-select{display:flex; gap:8px; margin-bottom:18px;}
.month-chip{border:1px solid var(--n4); border-radius:var(--radius-pill); padding:7px 16px; font-size:12.5px; font-weight:600; color:var(--n7);}
.month-chip.active{background:var(--m700); color:#fff; border-color:var(--m700);}

.toast{position:fixed; bottom:28px; right:28px; background:var(--n10); color:var(--n0); border-radius:12px; padding:13px 20px; display:flex; align-items:center; gap:10px; font-size:13px; z-index:80; animation:fadeInUp .3s ease both; box-shadow:0 20px 40px rgba(0,0,0,.2);}

@media (max-width:1000px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .insight-board{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
  .diff-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;
const {AreaChart, Area, ResponsiveContainer, XAxis, YAxis, Tooltip, CartesianGrid, LineChart, Line, BarChart, Bar} = Recharts;

const I = ({name, size=15}) => <i className={"ph ph-"+name} style={{fontSize:size}}></i>;

const REQUESTS = [
  {id:'REQ-241', title:'제품 상세 8화면 국·영문 이미지 교체', type:'콘텐츠', assignee:'김민수', status:'progress', updated:'2025.09.08'},
  {id:'REQ-240', title:'메인 배너 신규 2종 등록', type:'배너', assignee:'이지은', status:'wait', updated:'2025.09.07'},
  {id:'REQ-239', title:'브랜드 스토리 제품명 텍스트 수정', type:'콘텐츠', assignee:'김민수', status:'done', updated:'2025.09.05'},
  {id:'REQ-238', title:'영문 페이지 canonical 태그 오류 수정', type:'SEO', assignee:'박서준', status:'issue', updated:'2025.09.04'},
  {id:'REQ-237', title:'가을 프로모션 팝업 노출기간 설정', type:'배너', assignee:'이지은', status:'done', updated:'2025.09.02'},
  {id:'REQ-236', title:'7차 잔여 요청 — 급여가이드 표 갱신', type:'콘텐츠', assignee:'김민수', status:'progress', updated:'2025.09.01'},
  {id:'REQ-235', title:'구조화 데이터 Organization 스키마 추가', type:'SEO', assignee:'박서준', status:'wait', updated:'2025.08.29'},
];
const STATUS_META = {
  wait:{cls:'badge-wait', label:'대기'},
  progress:{cls:'badge-progress', label:'진행중'},
  done:{cls:'badge-done', label:'완료'},
  issue:{cls:'badge-issue', label:'지연'},
};
const SYNC_ROWS = [
  {page:'/products/senior-joint', ko:'2025.09.06', en:'2025.09.02', status:'mismatch'},
  {page:'/products/kidney-care', ko:'2025.09.05', en:'2025.09.05', status:'synced'},
  {page:'/brand-story', ko:'2025.09.04', en:'2025.08.20', status:'mismatch'},
  {page:'/events/autumn-promo', ko:'2025.09.03', en:'2025.09.03', status:'synced'},
  {page:'/notice/2025-09', ko:'2025.09.01', en:'2025.09.01', status:'synced'},

const HEALTH_ROWS = [
  {page:'/products/senior-joint', jsonld:'ok', meta:'ok'},
  {page:'/products/kidney-care', jsonld:'ok', meta:'ok'},
  {page:'/en/products/kidney-care', jsonld:'issue', meta:'ok'},

function Toast({message, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2600); return ()=>clearTimeout(t); }, []);
  return <div className="toast"><i className="ph ph-check-circle" style={{fontSize:16}}></i><span>{message}</span></div>;

function Sidebar({screen, setScreen}){
  const nav1 = [
    {key:'main', label:'수정요청 접수·처리 현황 트래킹', icon:'list-checks'},

function Sparkline({data, dataKey, color}){
  const w = 120, h = 28;
  const vals = data.map(d => d[dataKey]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const points = vals.map((v,i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return (
    <svg viewBox={"0 0 "+w+" "+h} width="100%" height={h} preserveAspectRatio="none">
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function MainScreen({toast}){
  const [tab, setTab] = useState('전체');
  const [modalOpen, setModalOpen] = useState(false);
  const [rows, setRows] = useState(REQUESTS);
  const tabs = ['전체','대기','진행중','완료','지연'];
  const filtered = useMemo(()=>{
    if(tab==='전체') return rows;
    const map = {대기:'wait', 진행중:'progress', 완료:'done', 지연:'issue'};
    return rows.filter(r=>r.status===map[tab]);
  }, [tab, rows]);

  const [form, setForm] = useState({title:'', type:'콘텐츠', assignee:'김민수'});
  const PERIODS = ['최근 7일','최근 30일','최근 90일'];
  const [period, setPeriod] = useState('최근 30일');
  const cyclePeriod = () => setPeriod(p => PERIODS[(PERIODS.indexOf(p)+1) % PERIODS.length]);
  const ASSIGNEES = ['담당자: 전체','김민수','이지은','박서준'];
  const [assigneeFilter, setAssigneeFilter] = useState('담당자: 전체');
  const cycleAssignee = () => setAssigneeFilter(a => ASSIGNEES[(ASSIGNEES.indexOf(a)+1) % ASSIGNEES.length]);
  const TYPES = ['유형: 전체','콘텐츠','배너','SEO'];
  const [typeFilter, setTypeFilter] = useState('유형: 전체');
  const cycleType = () => setTypeFilter(t => TYPES[(TYPES.indexOf(t)+1) % TYPES.length]);
  const submit = (e) => {
    e.preventDefault();
    if(!form.title) return;
    setRows(prev=>[{id:'REQ-'+(242+prev.length), title:form.title, type:form.type, assignee:form.assignee, status:'wait', updated:'2025.09.08'}, ...prev]);
    setModalOpen(false);
    setForm({title:'', type:'콘텐츠', assignee:'김민수'});
    toast('새 요청이 대기 큐에 접수되었습니다');
  };

  return (
    <React.Fragment>
      <div className="page-header">
        <div className="page-title-row">
          <div>
            <div className="page-title">수정요청 접수·처리 현황</div>
            <div className="page-meta">마지막 업데이트 2025.09.08 09:40 · Production</div>
          </div>
          <div className="page-actions">
            <button className="btn-secondary" onClick={cyclePeriod}><I name="calendar-blank" size={14}/>{period}</button>
            <button className="btn-primary" onClick={()=>setModalOpen(true)}><I name="plus" size={14}/>새 요청 등록</button>
          </div>
        </div>
      </div>

      <section className="stat-row">
        <div className="stat-card">
          <div className="stat-label">처리 대기</div>
          <div className="stat-value">6건</div>
          <div className="stat-delta neutral">전일 대비 +2</div>
          <div className="stat-sparkline"><Sparkline data={[{v:3},{v:4},{v:3},{v:5},{v:4},{v:6}]} dataKey="v" color="#a6abb7"/></div>
        </div>
        <div className="stat-card">
          <div className="stat-label">처리 지연</div>
          <div className="stat-value">1건</div>
          <div className="stat-delta negative">SLA 초과 1건</div>
          <div className="stat-sparkline"><Sparkline data={[{v:0},{v:1},{v:0},{v:1},{v:1},{v:1}]} dataKey="v" color="#a6abb7"/></div>
        </div>
        <div className="stat-card">
          <div className="stat-label">이번달 완료</div>
          <div className="stat-value">18건</div>
          <div className="stat-delta positive">전월比 +4</div>
          <div className="stat-sparkline"><Sparkline data={[{v:10},{v:12},{v:11},{v:15},{v:16},{v:18}]} dataKey="v" color="#a6abb7"/></div>
        </div>
        <div className="stat-card">
          <div className="stat-label">SEO 헬스 스코어</div>
          <div className="stat-value">92</div>
          <div className="stat-delta positive">지난주比 +3</div>
          <div className="stat-sparkline"><Sparkline data={[{v:85},{v:87},{v:88},{v:90},{v:91},{v:92}]} dataKey="v" color="#a6abb7"/></div>
        </div>
      </section>

      <section className="insight-board">
        <div className="hero-viz">
          <div className="hero-viz-head">
            <div>
              <div className="hero-viz-title">월별 요청 처리 추이</div>
              <div className="hero-viz-sub">4월~9월 · 접수 건수 기준</div>
            </div>
          </div>
          <div style={{width:'100%', height:220}}>
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={TREND} margin={{top:6,right:10,left:-16,bottom:0}}>
                <defs>
                  <linearGradient id="gReq" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#3a4560" stopOpacity={0.28}/>
                    <stop offset="100%" stopColor="#3a4560" stopOpacity={0.02}/>
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="#e5e5e6" vertical={false}/>
                <XAxis dataKey="m" tick={{fontSize:11, fill:'#909298'}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fontSize:11, fill:'#909298'}} axisLine={false} tickLine={false}/>
                <Tooltip contentStyle={{fontSize:12, borderRadius:10, border:'1px solid #e5e5e6'}}/>
                <Area type="monotone" dataKey="requests" stroke="#3a4560" strokeWidth={2} fill="url(#gReq)"/>
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="kpi-side">
          <div className="kpi-mini">
            <div className="kpi-mini-label"><I name="translate" size={14}/>동기화 불일치</div>
            <div className="kpi-mini-value">2 페이지</div>
          </div>
          <div className="kpi-mini">
            <div className="kpi-mini-label"><I name="shield-warning" size={14}/>SEO 이슈</div>
            <div className="kpi-mini-value">2 건</div>
          </div>
          <div className="kpi-mini">
            <div className="kpi-mini-label"><I name="clock-countdown" size={14}/>평균 처리 소요</div>
            <div className="kpi-mini-value">1.8일</div>
          </div>
        </div>
      </section>

      <section className="widget-grid">
        <div className="widget">
          <div className="widget-title"><I name="translate" size={14}/>언어별 동기화 상태</div>
          {SYNC_ROWS.slice(0,3).map((r,i)=>(
            <div className="mini-row" key={i}><span className="label">{r.page}</span>
              {r.status==='synced' ? <span className="badge badge-done">동기화</span> : <span className="badge badge-issue">불일치</span>}
            </div>
          ))}
        </div>
        <div className="widget">
          <div className="widget-title"><I name="magnifying-glass" size={14}/>검색 유입 추이</div>
          <div style={{width:'100%', height:70}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={TREND}>
                <Bar dataKey="traffic" fill="#c8cbd2" radius={[3,3,0,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="widget">
          <div className="widget-title"><I name="warning-circle" size={14}/>SEO 이슈 상위</div>
          {HEALTH_ROWS.filter(r=>r.jsonld==='issue'||r.meta==='issue').map((r,i)=>(
            <div className="mini-row" key={i}><span className="label">{r.page}</span><span className="badge badge-issue">확인필요</span></div>
          ))}
        </div>
      </section>

      <section className="data-section">
        <nav className="tab-bar">
          {tabs.map(t=>(<button key={t} className={"tab"+(tab===t?' active':'')} onClick={()=>setTab(t)}>{t}</button>))}
        </nav>
        <div className="data-toolbar">
          <input className="search" placeholder="요청 제목 검색…"/>
          <button className={"filter-chip"+(assigneeFilter!=='담당자: 전체'?' active':'')} onClick={cycleAssignee}>{assigneeFilter}</button>
          <button className={"filter-chip"+(typeFilter!=='유형: 전체'?' active':'')} onClick={cycleType}>{typeFilter}</button>
          <button className="export-btn" onClick={()=>toast('요청 목록을 CSV로 내보냈습니다')}><I name="download-simple" size={14}/>내보내기</button>
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>요청 ID</th><th>제목</th><th>유형</th><th>담당자</th><th>최종 업데이트</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td>{r.id}</td><td>{r.title}</td><td>{r.type}</td><td>{r.assignee}</td><td>{r.updated}</td>
                  <td><span className={"badge "+STATUS_META[r.status].cls}>{STATUS_META[r.status].label}</span></td>
                  <td><button className="row-action" onClick={()=>toast(r.id+' 상세를 확인했습니다')}>상세</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {modalOpen && (
        <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>새 수정요청 등록</h3>
            <form onSubmit={submit}>
              <div className="field"><label>요청 제목</label><input value={form.title} onChange={e=>setForm({...form, title:e.target.value})} placeholder="예: 제품 상세 이미지 교체"/></div>
              <div className="field"><label>유형</label>
                <select value={form.type} onChange={e=>setForm({...form, type:e.target.value})}>
                  <option>콘텐츠</option><option>배너</option><option>SEO</option>
                </select>
              </div>
              <div className="field"><label>담당자</label>
                <select value={form.assignee} onChange={e=>setForm({...form, assignee:e.target.value})}>
                  <option>김민수</option><option>이지은</option><option>박서준</option>
                </select>
              </div>
              <div className="modal-actions">
                <button type="button" className="btn-secondary" onClick={()=>setModalOpen(false)}>취소</button>
                <button type="submit" className="btn-primary">접수</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function SyncScreen(){
  const [rows, setRows] = useState(SYNC_ROWS);
  const resolve = (page) => setRows(prev=>prev.map(r=> r.page===page ? {...r, status:'synced', en:r.ko} : r));
  return (
    <div style={{padding:'28px 0'}}>
      <div className="page-header" style={{padding:'0 36px'}}>
        <div className="page-title">다국어 콘텐츠 동기화 상태 모니터링</div>
        <div className="page-meta">국문 페이지 수정 후 영문 페이지가 갱신되지 않으면 불일치로 표시됩니다.</div>
      </div>
      <div className="section-card">
        <h4><I name="translate" size={15}/>페이지별 최종 수정 시각 비교</h4>
        <div className="diff-row diff-head"><span>페이지</span><span>국문 최종수정</span><span>영문 최종수정</span><span>상태</span></div>
        {rows.map((r,i)=>(
          <div className="diff-row" key={i}>
            <span>{r.page}</span><span>{r.ko}</span><span>{r.en}</span>
            <span>
              {r.status==='synced'
                ? <span className="badge badge-done">동기화됨</span>
                : <button className="chip-btn" onClick={()=>resolve(r.page)}>동기화 완료 처리</button>}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function HealthScreen({toast}){
  const [checking, setChecking] = useState(false);
  const runCheck = () => { setChecking(true); setTimeout(()=>{ setChecking(false); toast('전체 페이지 SEO 헬스체크가 완료되었습니다'); }, 1500); };
  return (
    <div style={{padding:'28px 0'}}>
      <div className="page-header" style={{padding:'0 36px'}}>
        <div className="page-title-row">
          <div>
            <div className="page-title">SEO·구조화 데이터 헬스체크</div>
            <div className="page-meta">메타태그·JSON-LD 필수 항목의 유효성을 매일 1회 자동 점검합니다.</div>
          </div>
          <button className="btn-primary" onClick={runCheck} disabled={checking}>
            {checking ? <span className="spin-icon"><I name="circle-notch" size={14}/></span> : <I name="arrow-clockwise" size={14}/>}
            {checking ? '점검 중…' : '지금 즉시 점검'}
          </button>
        </div>
      </div>
      <div className="section-card">
        <h4><I name="shield-check" size={15}/>페이지별 점검 결과</h4>
        {checking ? (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>{[1,2,3,4,5].map(i=><div className="skeleton" key={i}></div>)}</div>
        ) : (
          <React.Fragment>
            <div className="diff-row diff-head"><span>페이지</span><span>JSON-LD</span><span>메타태그</span><span></span></div>
            {HEALTH_ROWS.map((r,i)=>(
              <div className="diff-row" key={i}>
                <span>{r.page}</span>
                <span>{r.jsonld==='ok' ? <span className="badge badge-done">정상</span> : <span className="badge badge-issue">필드 누락</span>}</span>
                <span>{r.meta==='ok' ? <span className="badge badge-done">정상</span> : <span className="badge badge-issue">확인필요</span>}</span>
                <span></span>
              </div>
            ))}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function ReportsScreen({toast}){
  const [month, setMonth] = useState('9월');
  const months = ['6월','7월','8월','9월'];
  return (
    <div style={{padding:'28px 0'}}>
      <div className="page-header" style={{padding:'0 36px'}}>
        <div className="page-title-row">
          <div>
            <div className="page-title">월간 작업 내역·검색 유입 리포트</div>
            <div className="page-meta">선택한 월의 처리 건수와 검색 유입 추이를 통합해 제공합니다.</div>
          </div>
          <button className="btn-secondary" onClick={()=>toast(month+' 리포트를 PDF로 생성했습니다')}><I name="file-pdf" size={14}/>PDF 내보내기</button>
        </div>
      </div>
      <div style={{padding:'0 36px'}} className="month-select">
        {months.map(m=>(<button key={m} className={"month-chip"+(month===m?' active':'')} onClick={()=>setMonth(m)}>{m}</button>))}
      </div>
      <div className="section-card">
        <h4><I name="chart-line-up" size={15}/>{month} 검색 유입·작업 처리 추이</h4>
        <div style={{width:'100%', height:200}}>
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={TREND} margin={{top:6,right:10,left:-16,bottom:0}}>
              <defs>
                <linearGradient id="gTraffic" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#3a4560" stopOpacity={0.22}/>
                  <stop offset="100%" stopColor="#3a4560" stopOpacity={0.02}/>
                </linearGradient>
              </defs>
              <CartesianGrid stroke="#e5e5e6" vertical={false}/>
              <XAxis dataKey="m" tick={{fontSize:11, fill:'#909298'}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fontSize:11, fill:'#909298'}} axisLine={false} tickLine={false}/>
              <Tooltip contentStyle={{fontSize:12, borderRadius:10, border:'1px solid #e5e5e6'}}/>
              <Area type="monotone" dataKey="traffic" stroke="#3a4560" strokeWidth={2} fill="url(#gTraffic)"/>
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="section-card">
        <h4><I name="list-checks" size={15}/>{month} 처리 내역 요약</h4>
        <div className="diff-row diff-head"><span>유형</span><span>접수</span><span>완료</span><span>전월 대비</span></div>
        <div className="diff-row"><span>콘텐츠 교체</span><span>9건</span><span>8건</span><span className="badge badge-done">+2</span></div>
        <div className="diff-row"><span>배너/이벤트</span><span>4건</span><span>4건</span><span className="badge badge-wait">동일</span></div>
        <div className="diff-row"><span>SEO·구조화 데이터</span><span>3건</span><span>3건</span><span className="badge badge-done">+1</span></div>
      </div>
    </div>
  );
}

function SettingsScreen(){
  return (
    <div style={{padding:'28px 36px'}}>
      <div className="page-title" style={{marginBottom:16}}>알림·계정 설정</div>
      <div className="section-card" style={{margin:0}}>
        <h4><I name="bell-simple" size={15}/>지연 알림 기준</h4>
        <div className="diff-row"><span>처리 지연 SLA</span><span>접수 후 3영업일</span><span></span><span></span></div>
        <div className="diff-row"><span>알림 채널</span><span>이메일 · 알림톡</span><span></span><span></span></div>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg) => setToastMsg(msg);
  return (
    <div className="app-shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="main-wrap">
        {screen==='main' && <MainScreen toast={toast}/>}
        {screen==='sync' && <SyncScreen/>}
        {screen==='health' && <HealthScreen toast={toast}/>}
        {screen==='reports' && <ReportsScreen toast={toast}/>}
        {screen==='settings' && <SettingsScreen/>}
      </div>
      {toastMsg && <Toast message={toastMsg} onDone={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
