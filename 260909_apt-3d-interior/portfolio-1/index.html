<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 아파트 인테리어 편집 스튜디오 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 216°, light) ── */
:root{
  --m50:#efefef; --m100:#efefef; --m200:#efefef; --m300:#dfdfdf; --m400:#bebfbf;
  --m500:#979899; --m600:#6b6c6e; --m700:#414245; --m800:#17191c; --m900:#131517;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#777b86; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:24px; --radius-input:16px; --radius-pill:9999px; --radius-sm:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--m800); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:13px;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

/* ── keyframes ── */
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastPop{from{opacity:0; transform:translateY(-10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes pulseDot{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.45; transform:scale(1.25);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

.fade-in{animation:fadeIn .45s ease both;}
.stagger{animation:cardStagger .4s ease both;}

/* ── shell layout ── */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--n0); border-right:1px solid var(--n2);
  display:flex; flex-direction:column; padding:28px 18px;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 28px 8px;}
.brand-mark{
  width:36px; height:36px; border-radius:11px; background:var(--m800); color:var(--n0);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.brand-name{font-size:17px; font-weight:700; letter-spacing:-0.02em;}
.brand-sub{font-size:11px; color:var(--n7); margin-top:1px;}
.nav-list{display:flex; flex-direction:column; gap:4px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px;
  font-size:14px; font-weight:500; color:var(--n8); text-align:left; width:100%;
  transition:background .15s, color .15s;
}
.nav-item:hover{background:var(--n1);}
.nav-item.active{background:var(--m800); color:var(--n0);}
.nav-item i{font-size:18px;}
.sidebar-foot{padding:14px 8px 4px; border-top:1px solid var(--n2); margin-top:12px;}
.sidebar-foot-title{font-size:12px; color:var(--n7); margin-bottom:6px;}
.progress-track{height:6px; border-radius:99px; background:var(--n2); overflow:hidden;}
.progress-fill{height:100%; background:var(--m800); border-radius:99px; width:62%;}
.sidebar-foot-note{font-size:11px; color:var(--n6); margin-top:8px;}

.main-area{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; border-bottom:1px solid var(--n2); background:var(--n0);
}
.topbar-title{font-size:15px; font-weight:700;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.avatar-chip{
  width:34px; height:34px; border-radius:99px; background:var(--n1); color:var(--m800);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  border:1px solid var(--n3);
}
.icon-btn{
  width:34px; height:34px; border-radius:99px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--n3); color:var(--n8); transition:background .15s;
}
.icon-btn:hover{background:var(--n1);}

.content{flex:1; overflow:auto; padding:28px 32px 48px;}

/* ── buttons ── */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:var(--radius-pill);
  font-size:14px; font-weight:600; transition:opacity .15s, transform .1s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m800); color:var(--n0);}
.btn-primary:hover{opacity:.88;}
.btn-ghost{background:transparent; color:var(--m800); border:1px solid var(--m800);}
.btn-ghost:hover{background:var(--n1);}
.btn-soft{background:var(--n1); color:var(--m800);}
.btn-soft:hover{background:var(--n2);}
.btn-sm{padding:8px 14px; font-size:12.5px;}

/* ── editor screen (composition: editor-canvas) ── */
.editor-grid{display:grid; grid-template-columns:250px 1fr 268px; gap:20px; align-items:start;}
.panel{
  background:var(--n0); border:1px solid var(--n2); border-radius:var(--radius-card); padding:18px;
}
.panel-title{font-size:12.5px; font-weight:700; color:var(--n8); text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px;}
.tab-row{display:flex; gap:6px; background:var(--n1); border-radius:99px; padding:4px; margin-bottom:16px;}
.tab-btn{flex:1; padding:8px 0; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--n7); text-align:center;}
.tab-btn.active{background:var(--n0); color:var(--m800); box-shadow:0 1px 3px rgba(0,0,0,.08);}

.swatch-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.swatch{
  aspect-ratio:1; border-radius:10px; border:2px solid transparent; cursor:pointer; position:relative;
  transition:transform .12s;
}
.swatch:hover{transform:scale(1.06);}
.swatch.selected{border-color:var(--m800); box-shadow:0 0 0 2px var(--n0), 0 0 0 3px var(--m800);}
.swatch-label{font-size:10.5px; color:var(--n7); text-align:center; margin-top:4px;}
.swatch-wrap{display:flex; flex-direction:column;}

.furniture-list{display:flex; flex-direction:column; gap:6px;}
.furniture-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; border:1px solid var(--n2);
  font-size:12.5px; font-weight:500; transition:background .15s, border-color .15s;
}
.furniture-item:hover{background:var(--n1); border-color:var(--n3);}
.furniture-item i{font-size:17px; width:28px; height:28px; border-radius:9px; background:var(--n1); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.viewport-wrap{display:flex; flex-direction:column; gap:12px;}
.viewport-toolbar{display:flex; align-items:center; justify-content:space-between;}
.cam-toggle{display:flex; gap:6px; background:var(--n1); border-radius:99px; padding:4px;}
.cam-btn{padding:7px 14px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--n7); display:flex; align-items:center; gap:6px;}
.cam-btn.active{background:var(--n0); color:var(--m800); box-shadow:0 1px 3px rgba(0,0,0,.08);}

.stage{
  height:440px; border-radius:var(--radius-card); background:linear-gradient(180deg, var(--n1) 0%, var(--n2) 100%);
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  border:1px solid var(--n2); perspective:1500px;
}
.room{
  width:340px; height:340px; position:relative; transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.7,.3,1);
}
.room.persp{ transform:rotateX(52deg) rotateZ(-38deg); }
.room.top{ transform:rotateX(78deg) rotateZ(0deg) scale(1.05); }
.room-floor{
  position:absolute; inset:0; border-radius:6px; box-shadow:0 30px 60px rgba(0,0,0,.18);
  transition:background .3s;
}
.room-wall{
  position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:top; opacity:.92;
  transition:background .3s;
}
.wall-back{transform:rotateX(90deg) translateY(0); height:130px; top:-130px;}
.wall-left{transform-origin:left; transform:rotateY(90deg); width:130px; left:-130px;}
.furn-chip{
  position:absolute; width:44px; height:44px; border-radius:10px; background:var(--n0);
  border:1.5px solid var(--n3); display:flex; align-items:center; justify-content:center;
  font-size:19px; color:var(--m800); cursor:grab; box-shadow:0 4px 10px rgba(0,0,0,.12);
  transform:translateZ(3px); transition:box-shadow .15s, border-color .15s;
}
.furn-chip:hover{box-shadow:0 6px 16px rgba(0,0,0,.18);}
.furn-chip.selected{border-color:var(--m800); box-shadow:0 0 0 2px var(--n0), 0 0 0 4px var(--m800);}
.stage-hint{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:11.5px; color:var(--n7); background:var(--n0); padding:6px 12px; border-radius:99px; border:1px solid var(--n2);}

.save-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.save-status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--n7);}
.save-dot{width:7px; height:7px; border-radius:99px; background:var(--s1);}
.save-dot.saving{background:var(--m800); animation:pulseDot 1s ease-in-out infinite;}

.inspector-empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:32px 8px; color:var(--n6);}
.inspector-empty i{font-size:30px;}
.inspector-empty p{font-size:12.5px; line-height:1.5;}
.inspector-field{margin-bottom:18px;}
.inspector-label{display:flex; justify-content:space-between; font-size:12px; color:var(--n7); margin-bottom:8px;}
.inspector-label b{color:var(--m800); font-weight:700;}
input[type=range]{width:100%; accent-color:var(--m800);}
.inspector-head{display:flex; align-items:center; gap:10px; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--n2);}
.inspector-head i{font-size:20px; width:36px; height:36px; border-radius:10px; background:var(--n1); display:flex; align-items:center; justify-content:center;}
.inspector-head b{font-size:14px;}
.inspector-head span{display:block; font-size:11.5px; color:var(--n7);}
.remove-btn{width:100%; padding:10px; border-radius:12px; background:var(--s2-bg); color:var(--s2-text); font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;}

/* ── onboarding ── */
.type-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px; max-width:820px;}
.type-card{
  border:1px solid var(--n2); border-radius:var(--radius-card); overflow:hidden; background:var(--n0);
  transition:box-shadow .2s, transform .2s;
}
.type-card:hover{box-shadow:0 14px 30px rgba(0,0,0,.08); transform:translateY(-2px);}
.type-preview{height:180px; background:linear-gradient(135deg, var(--n2), var(--n1)); position:relative; display:flex; align-items:center; justify-content:center;}
.type-preview .plan-icon{font-size:64px; color:var(--n5);}
.type-body{padding:20px;}
.type-name{font-size:16px; font-weight:700; margin-bottom:4px;}
.type-meta{font-size:12.5px; color:var(--n7); margin-bottom:16px;}
.type-tags{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.tag{font-size:11px; padding:4px 9px; border-radius:99px; background:var(--n1); color:var(--n8);}

/* ── mypage ── */
.space-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px;}
.space-card{border:1px solid var(--n2); border-radius:var(--radius-card); overflow:hidden; background:var(--n0); transition:box-shadow .2s;}
.space-card:hover{box-shadow:0 12px 26px rgba(0,0,0,.08);}
.space-thumb{height:130px; background:linear-gradient(135deg, var(--n1), var(--n2)); display:flex; align-items:center; justify-content:center; color:var(--n5); font-size:38px;}
.space-body{padding:16px;}
.space-name{font-size:14.5px; font-weight:700; margin-bottom:3px;}
.space-time{font-size:11.5px; color:var(--n7); margin-bottom:14px;}

/* ── profile ── */
.profile-wrap{max-width:520px;}
.avatar-edit{display:flex; align-items:center; gap:18px; margin-bottom:28px;}
.avatar-big{width:76px; height:76px; border-radius:99px; background:var(--n1); border:1px solid var(--n3); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:var(--m800); flex-shrink:0;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--n8); margin-bottom:7px;}
.field input, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius-input); border:1px solid var(--n3); background:var(--n0);
  outline:none; transition:border-color .15s;
}
.field input:focus, .field textarea:focus{border-color:var(--m800);}
.field-hint{font-size:11.5px; color:var(--n6); margin-top:6px;}

.section-head{margin-bottom:20px;}
.section-head h1{font-size:20px; font-weight:800; letter-spacing:-0.01em; margin-bottom:5px;}
.section-head p{font-size:13px; color:var(--n7);}

/* ── toast ── */
.toast-wrap{position:fixed; top:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:999;}
.toast{
  background:var(--m800); color:var(--n0); padding:12px 18px; border-radius:14px; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:8px; box-shadow:0 10px 24px rgba(0,0,0,.2); animation:toastPop .3s ease both;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function I({name, size=16}){ return <i className={"ph "+name} style={{fontSize:size, lineHeight:1}}></i>; }

const NAV = [
  {id:'main', label:'3D 인테리어 편집', icon:'ph-cube-focus'},
  {id:'onboarding', label:'아파트 타입 선택', icon:'ph-house-line'},
  {id:'mypage', label:'마이 공간 관리', icon:'ph-bookmark-simple'},
  {id:'profile', label:'회원 인증 및 프로필', icon:'ph-user-circle'},
];

const WALLPAPERS = [
  {id:'w1', name:'웜 베이지', color:'#e7dbc9'},
  {id:'w2', name:'클라우드 그레이', color:'#dfe1e3'},
  {id:'w3', name:'세이지 그린', color:'#c8d3c0'},
  {id:'w4', name:'소프트 옐로우', color:'#ecdfb8'},
  {id:'w5', name:'딥 네이비', color:'#41506b'},
  {id:'w6', name:'테라코타', color:'#c98b6d'},
  {id:'w7', name:'라벤더 그레이', color:'#c9c3d6'},
  {id:'w8', name:'차콜', color:'#3c3c3f'},
];
const FLOORS = [
  {id:'f1', name:'화이트 오크', color:'#d9c3a0'},
  {id:'f2', name:'월넛 브라운', color:'#7a5638'},
  {id:'f3', name:'라이트 그레이', color:'#c7c9cb'},
  {id:'f4', name:'헤링본 메이플', color:'#e0bd8e'},
  {id:'f5', name:'다크 헤링본', color:'#523c2a'},
  {id:'f6', name:'콘크리트', color:'#a9acae'},
  {id:'f7', name:'클래식 타일', color:'#e8e3da'},
  {id:'f8', name:'블랙 라미네이트', color:'#2b2b2c'},
];
const FURNITURE_CATALOG = [
  {id:'ft1', name:'2인용 패브릭 소파', icon:'ph-armchair'},
  {id:'ft2', name:'원목 다이닝 테이블', icon:'ph-table'},
  {id:'ft3', name:'퀸사이즈 침대', icon:'ph-bed'},
  {id:'ft4', name:'플로어 스탠드 조명', icon:'ph-lamp'},
  {id:'ft5', name:'6단 책장', icon:'ph-books'},
  {id:'ft6', name:'라운드 사이드 테이블', icon:'ph-circle-dashed'},
  {id:'ft7', name:'대형 러그', icon:'ph-square'},
  {id:'ft8', name:'몬스테라 화분', icon:'ph-plant'},
];

let toastSeq = 0;

function Toast({toasts}){
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><I name="ph-check-circle" size={16}/>{t.text}</div>
      ))}
    </div>
  );
}

function EditorScreen({pushToast}){
  const [catTab, setCatTab] = useState('wallpaper');
  const [wallColor, setWallColor] = useState(WALLPAPERS[0].color);
  const [wallSel, setWallSel] = useState('w1');
  const [floorColor, setFloorColor] = useState(FLOORS[0].color);
  const [floorSel, setFloorSel] = useState('f1');
  const [camMode, setCamMode] = useState('persp');
  const [furniture, setFurniture] = useState([
    {uid:'u1', name:'2인용 패브릭 소파', icon:'ph-armchair', x:26, y:60, rot:0},
    {uid:'u2', name:'원목 다이닝 테이블', icon:'ph-table', x:62, y:34, rot:12},
    {uid:'u3', name:'6단 책장', icon:'ph-books', x:74, y:70, rot:0},
  ]);
  const [selectedUid, setSelectedUid] = useState('u1');
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState('오후 3:24');
  const uidRef = useRef(3);

  const selected = furniture.find(f => f.uid === selectedUid) || null;

  function addFurniture(item){
    uidRef.current += 1;
    const uid = 'u' + uidRef.current;
    setFurniture(list => [...list, {uid, name:item.name, icon:item.icon, x:30+Math.random()*40, y:30+Math.random()*40, rot:0}]);
    setSelectedUid(uid);
    pushToast(item.name + " 가(이) 공간에 추가되었습니다");
  }
  function updateSelected(patch){
    setFurniture(list => list.map(f => f.uid === selectedUid ? {...f, ...patch} : f));
  }
  function removeSelected(){
    if(!selected) return;
    setFurniture(list => list.filter(f => f.uid !== selectedUid));
    setSelectedUid(null);
    pushToast('가구가 삭제되었습니다');
  }
  function handleSave(){
    setSaving(true);
    pushToast('편집 상태를 저장하고 있습니다');
    setTimeout(() => {
      setSaving(false);
      const now = new Date();
      setSavedAt('오후 ' + now.getHours() % 12 + ':' + String(now.getMinutes()).padStart(2,'0'));
      pushToast('저장이 완료되었습니다');
    }, 900);
  }

  return (
    <div className="fade-in">
      <div className="section-head">
        <h1>3D 인테리어 편집</h1>
        <p>시점을 전환하며 벽지·바닥재·가구를 자유롭게 꾸미고, 편집 상태를 저장·복원합니다.</p>
      </div>
      <div className="editor-grid">
        <div className="panel">
          <div className="panel-title">카탈로그</div>
          <div className="tab-row">
            <button className={"tab-btn"+(catTab==='wallpaper'?' active':'')} onClick={()=>setCatTab('wallpaper')}><I name="ph-paint-roller" size={13}/> 벽지</button>
            <button className={"tab-btn"+(catTab==='floor'?' active':'')} onClick={()=>setCatTab('floor')}><I name="ph-square-half" size={13}/> 바닥재</button>
            <button className={"tab-btn"+(catTab==='furniture'?' active':'')} onClick={()=>setCatTab('furniture')}><I name="ph-armchair" size={13}/> 가구</button>
          </div>

          {catTab==='wallpaper' && (
            <div className="swatch-grid">
              {WALLPAPERS.map(w => (
                <div className="swatch-wrap" key={w.id}>
                  <div className={"swatch"+(wallSel===w.id?' selected':'')} style={{background:w.color}}
                    onClick={()=>{setWallSel(w.id); setWallColor(w.color); pushToast(w.name+' 벽지가 적용되었습니다');}}></div>
                  <div className="swatch-label">{w.name}</div>
                </div>
              ))}
            </div>
          )}
          {catTab==='floor' && (
            <div className="swatch-grid">
              {FLOORS.map(f => (
                <div className="swatch-wrap" key={f.id}>
                  <div className={"swatch"+(floorSel===f.id?' selected':'')} style={{background:f.color}}
                    onClick={()=>{setFloorSel(f.id); setFloorColor(f.color); pushToast(f.name+' 바닥재가 적용되었습니다');}}></div>
                  <div className="swatch-label">{f.name}</div>
                </div>
              ))}
            </div>
          )}
          {catTab==='furniture' && (
            <div className="furniture-list">
              {FURNITURE_CATALOG.map(item => (
                <button className="furniture-item" key={item.id} onClick={()=>addFurniture(item)}>
                  <I name={item.icon} size={16}/>
                  {item.name}
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="viewport-wrap">
          <div className="panel" style={{padding:16}}>
            <div className="viewport-toolbar">
              <div className="cam-toggle">
                <button className={"cam-btn"+(camMode==='persp'?' active':'')} onClick={()=>setCamMode('persp')}><I name="ph-eye" size={14}/> 1인칭 시점</button>
                <button className={"cam-btn"+(camMode==='top'?' active':'')} onClick={()=>setCamMode('top')}><I name="ph-frame-corners" size={14}/> 상단 시점</button>
              </div>
              <div className="save-row">
                <div className="save-status"><span className={"save-dot"+(saving?' saving':'')}></span>{saving ? '저장 중…' : ('마지막 저장 ' + savedAt)}</div>
                <button className="btn btn-primary btn-sm" onClick={handleSave}>
                  {saving ? <i className="ph ph-spinner" style={{fontSize:14, lineHeight:1, animation:'spin .7s linear infinite'}}></i> : <I name="ph-floppy-disk" size={14}/>} 저장
                </button>
              </div>
            </div>
          </div>

          <div className="stage" style={{borderRadius:24, boxShadow:'0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10)'}}>
            <div className={"room "+camMode}>
              <div className="room-floor" style={{background:floorColor}}>
                {furniture.map(f => (
                  <div key={f.uid}
                    className={"furn-chip"+(selectedUid===f.uid?' selected':'')}
                    style={{left:f.x+'%', top:f.y+'%', transform:'translateZ(3px) rotate('+f.rot+'deg)'}}
                    onClick={()=>setSelectedUid(f.uid)}>
                    <I name={f.icon} size={18}/>
                  </div>
                ))}
              </div>
              <div className="room-wall wall-back" style={{background:wallColor}}></div>
              <div className="room-wall wall-left" style={{background:wallColor}}></div>
            </div>
            <div className="stage-hint">가구를 클릭하면 우측 인스펙터에서 위치·회전을 조정할 수 있습니다</div>
          </div>
        </div>

        <div className="panel">
          <div className="panel-title">속성 인스펙터</div>
          {!selected && (
            <div className="inspector-empty">
              <I name="ph-cursor-click"/>
              <p>3D 뷰포트에서 가구를 선택하면<br/>위치·회전·재질을 조정할 수 있습니다.</p>
            </div>
          )}
          {selected && (
            <div className="fade-in">
              <div className="inspector-head">
                <I name={selected.icon} size={18}/>
                <div>
                  <b>{selected.name}</b>
                  <span>선택된 오브젝트</span>
                </div>
              </div>
              <div className="inspector-field">
                <div className="inspector-label">가로 위치 <b>{Math.round(selected.x)}%</b></div>
                <input type="range" min="5" max="90" value={selected.x} onChange={e=>updateSelected({x:Number(e.target.value)})}/>
              </div>
              <div className="inspector-field">
                <div className="inspector-label">세로 위치 <b>{Math.round(selected.y)}%</b></div>
                <input type="range" min="5" max="90" value={selected.y} onChange={e=>updateSelected({y:Number(e.target.value)})}/>
              </div>
              <div className="inspector-field">
                <div className="inspector-label">회전 <b>{selected.rot}°</b></div>
                <input type="range" min="0" max="359" value={selected.rot} onChange={e=>updateSelected({rot:Number(e.target.value)})}/>
              </div>
              <button className="remove-btn" onClick={removeSelected}><I name="ph-trash" size={14}/> 공간에서 제거</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function OnboardingScreen({onEnter, pushToast}){
  const types = [
    {id:'t1', name:'34평형 아파트', meta:'전용 84㎡ · 방 3개 · 욕실 2개', tags:['거실 확장형','팬트리']},
    {id:'t2', name:'24평형 아파트', meta:'전용 59㎡ · 방 2개 · 욕실 1개', tags:['신혼형','알파룸']},
  ];
  return (
    <div className="fade-in">
      <div className="section-head">
        <h1>아파트 타입 선택</h1>
        <p>실제 아파트 2개 타입 중 하나를 선택하면 해당 평면 기준으로 나만의 3D 공간이 생성됩니다.</p>
      </div>
      <div className="type-grid">
        {types.map((t,i) => (
          <div className="type-card stagger" key={t.id} style={{animationDelay:(i*0.06)+'s'}}>
            <div className="type-preview"><I name="ph-house-simple" size={64}/></div>
            <div className="type-body">
              <div className="type-name">{t.name}</div>
              <div className="type-meta">{t.meta}</div>
              <div className="type-tags">{t.tags.map(tag => <span className="tag" key={tag}>{tag}</span>)}</div>
              <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}}
                onClick={()=>{ pushToast(t.name+' 공간이 생성되었습니다'); onEnter(); }}>
                이 타입으로 시작하기
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function MypageScreen({onEnter, pushToast}){
  const spaces = [
    {id:'s1', name:'34평형 · 나만의 거실', time:'오늘 오후 3:24 편집'},
    {id:'s2', name:'24평형 · 스터디룸 실험', time:'어제 오후 9:02 편집'},
    {id:'s3', name:'34평형 · 우드톤 시안', time:'3일 전 편집'},
  ];
  return (
    <div className="fade-in">
      <div className="section-head">
        <h1>마이 공간 관리</h1>
        <p>저장된 공간 목록에서 마지막 편집 상태 그대로 이어서 꾸밀 수 있습니다.</p>
      </div>
      <div className="space-grid">
        {spaces.map((s,i) => (
          <div className="space-card stagger" key={s.id} style={{animationDelay:(i*0.06)+'s'}}>
            <div className="space-thumb"><I name="ph-cube" size={34}/></div>
            <div className="space-body">
              <div className="space-name">{s.name}</div>
              <div className="space-time">{s.time}</div>
              <button className="btn btn-soft" style={{width:'100%', justifyContent:'center'}}
                onClick={()=>{ pushToast(s.name+' 공간을 불러옵니다'); onEnter(); }}>
                <I name="ph-arrow-square-out" size={14}/> 이어서 편집하기
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProfileScreen({pushToast}){
  const [nickname, setNickname] = useState('민지');
  const [bio, setBio] = useState('34평형 거실을 우드톤으로 꾸미는 중이에요');
  const [avatarSeed, setAvatarSeed] = useState(0);
  const initials = nickname ? nickname.slice(0,1) : '?';
  return (
    <div className="fade-in profile-wrap">
      <div className="section-head">
        <h1>회원 인증 및 프로필</h1>
        <p>닉네임과 프로필 이미지를 등록·수정합니다.</p>
      </div>
      <div className="panel">
        <div className="avatar-edit">
          <div className="avatar-big" style={{background:['#f2f2f3','#e7dbc9','#c8d3c0','#c9c3d6'][avatarSeed%4]}}>{initials}</div>
          <div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setAvatarSeed(s=>s+1); pushToast('프로필 이미지가 변경되었습니다');}}>
              <I name="ph-image-square" size={14}/> 이미지 변경
            </button>
            <div className="field-hint">1:1 비율의 이미지를 권장합니다</div>
          </div>
        </div>
        <div className="field">
          <label>닉네임</label>
          <input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="닉네임을 입력하세요"/>
        </div>
        <div className="field">
          <label>소개</label>
          <textarea rows="3" value={bio} onChange={e=>setBio(e.target.value)} placeholder="자기소개를 입력하세요"></textarea>
        </div>
        <button className="btn btn-primary" onClick={()=>pushToast('프로필이 저장되었습니다')}>
          <I name="ph-check" size={14}/> 변경사항 저장
        </button>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);

  function pushToast(text){
    const id = ++toastSeq;
    setToasts(list => [...list, {id, text}]);
    setTimeout(() => setToasts(list => list.filter(t => t.id !== id)), 2600);
  }

  const activeLabel = (NAV.find(n=>n.id===screen) || {}).label || '';

  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><I name="ph-cube" size={18}/></div>
          <div>
            <div className="brand-name">코지스페이스</div>
            <div className="brand-sub">3D 인테리어 스튜디오</div>
          </div>
        </div>
        <nav className="nav-list">
          {NAV.map(n => (
            <button key={n.id} className={"nav-item"+(screen===n.id?' active':'')} onClick={()=>setScreen(n.id)}>
              <I name={n.icon} size={18}/>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <div className="sidebar-foot-title">시연 준비도</div>
          <div className="progress-track"><div className="progress-fill"></div></div>
          <div className="sidebar-foot-note">핵심 플로우 4단계 중 구현 데모 진행 중</div>
        </div>
      </aside>
      <div className="main-area">
        <header className="topbar">
          <div className="topbar-title">{activeLabel}</div>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={()=>pushToast('새로운 알림이 없습니다')}><I name="ph-bell" size={16}/></button>
            <div className="avatar-chip">민</div>
          </div>
        </header>
        <div className="content">
          {screen==='main' && <EditorScreen pushToast={pushToast}/>}
          {screen==='onboarding' && <OnboardingScreen pushToast={pushToast} onEnter={()=>setScreen('main')}/>}
          {screen==='mypage' && <MypageScreen pushToast={pushToast} onEnter={()=>setScreen('main')}/>}
          {screen==='profile' && <ProfileScreen pushToast={pushToast}/>}
        </div>
      </div>
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
