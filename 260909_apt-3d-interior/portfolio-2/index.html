<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 아파트 공간 커뮤니티 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 254°, light) ── */
:root{
  --m50:#f3efff; --m100:#ece6ff; --m200:#e3dbff; --m300:#dcd1ff; --m400:#d4c7ff;
  --m500:#aea3d1; --m600:#887fa3; --m700:#5f5a73; --m800:#5f5a73; --m900:#5f5a73;
  --n0:#f2f0eb; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d6d5d7;
  --n5:#b6b5ba; --n6:#929098; --n7:#666666; --n8:#55535a; --n9:#37363a; --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:16px; --radius-input:12px; --radius-pill:9999px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n10); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:13px;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastPop{from{opacity:0; transform:translateY(-10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes heartPop{0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);}}
@keyframes modalIn{from{opacity:0; transform:translateY(18px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes overlayIn{from{opacity:0;} to{opacity:1;}}

.fade-in{animation:fadeIn .45s ease both;}
.stagger{animation:cardStagger .42s ease both;}

/* ── top nav ── */
.topnav{
  height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 32px;
  background:rgba(255,255,255,.82); backdrop-filter:blur(10px); border-bottom:1px solid var(--n3);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:36px; height:36px; border-radius:11px; background:var(--m400); color:var(--n10); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.brand-text b{display:block; font-size:15.5px; font-weight:800;}
.brand-text span{display:block; font-size:11px; color:var(--n7);}
.topnav-tabs{display:flex; gap:4px; background:var(--n2); padding:4px; border-radius:99px;}
.topnav-tab{padding:9px 16px; border-radius:99px; font-size:13px; font-weight:600; color:var(--n8); display:flex; align-items:center; gap:7px; transition:background .15s, color .15s;}
.topnav-tab:hover{color:var(--n10);}
.topnav-tab.active{background:var(--n1); color:var(--n10); box-shadow:0 2px 8px rgba(0,0,0,.06);}
.topnav-right{display:flex; align-items:center; gap:10px;}
.icon-btn{width:36px; height:36px; border-radius:99px; display:flex; align-items:center; justify-content:center; border:1px solid var(--n3); background:var(--n1); transition:background .15s;}
.icon-btn:hover{background:var(--n2);}
.profile-chip{width:36px; height:36px; border-radius:99px; background:var(--m400); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--n10);}

.page{max-width:1180px; margin:0 auto; padding:32px 28px 64px;}

.hero{
  border-radius:24px; padding:44px 40px; margin-bottom:28px; position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--n1) 0%, var(--n2) 100%); border:1px solid var(--n3);
}
.hero h1{font-size:36px; font-weight:800; letter-spacing:-0.02em; line-height:1.18; margin-bottom:14px; max-width:520px;}
.hero p{font-size:14px; color:var(--n7); max-width:460px; margin-bottom:22px;}
.hero-stats{display:flex; gap:28px;}
.hero-stat b{display:block; font-size:20px; font-weight:800;}
.hero-stat span{font-size:11.5px; color:var(--n7);}

.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.section-head h2{font-size:19px; font-weight:800;}
.section-head p{font-size:12.5px; color:var(--n7); margin-top:3px;}

/* ── buttons ── */
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:700; transition:opacity .15s, transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m400); color:var(--n10); box-shadow:0 4px 14px rgba(212,199,255,.55);}
.btn-primary:hover{opacity:.88;}
.btn-ghost{background:var(--n1); color:var(--n10); border:1px solid var(--n3);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:8px 14px; font-size:12px;}

/* ── filter rail ── */
.filter-rail{display:flex; align-items:center; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.filter-chip{padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:700; background:var(--n1); border:1px solid var(--n3); color:var(--n8); display:flex; align-items:center; gap:6px;}
.filter-chip.active{background:var(--m400); color:var(--n10); border-color:var(--m400);}
.filter-spacer{flex:1;}
.view-toggle{display:flex; gap:4px; background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:3px;}
.view-btn{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.view-btn.active{background:var(--n2); color:var(--n10);}

/* ── gallery ── */
.gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:20px; margin-bottom:36px;}
.gcard{background:var(--n1); border-radius:var(--radius-card); overflow:hidden; box-shadow:0 8px 22px rgba(41,40,39,.07); transition:transform .18s, box-shadow .18s; cursor:pointer;}
.gcard:hover{transform:translateY(-4px); box-shadow:0 16px 32px rgba(41,40,39,.12);}
.gcard-thumb{height:150px; background:linear-gradient(135deg, var(--n2), var(--n3)); display:flex; align-items:center; justify-content:center; color:var(--n5); position:relative;}
.gcard-badge{position:absolute; top:10px; left:10px; background:rgba(255,255,255,.9); padding:4px 10px; border-radius:99px; font-size:10.5px; font-weight:700; color:var(--n8);}
.gcard-body{padding:16px;}
.gcard-name{font-size:14px; font-weight:700; margin-bottom:2px;}
.gcard-owner{font-size:11.5px; color:var(--n7); margin-bottom:12px; display:flex; align-items:center; gap:6px;}
.gcard-owner .oa{width:18px; height:18px; border-radius:99px; background:var(--m300); display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:800;}
.gcard-foot{display:flex; align-items:center; justify-content:space-between;}
.gcard-like{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--n7);}
.gcard-like.liked{color:#c0316b;}
.gcard-like i, .gcard-like svg{width:15px; height:15px;}

/* ── quick view modal ── */
.overlay{position:fixed; inset:0; background:rgba(41,40,39,.5); display:flex; align-items:center; justify-content:center; z-index:200; animation:overlayIn .2s ease both;}
.modal{width:520px; max-width:92vw; background:var(--n1); border-radius:22px; padding:22px; animation:modalIn .28s cubic-bezier(.2,.8,.3,1) both; box-shadow:0 30px 60px rgba(0,0,0,.25);}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
.modal-title{font-size:16px; font-weight:800;}
.modal-owner{font-size:12px; color:var(--n7); margin-top:2px;}
.modal-close{width:30px; height:30px; border-radius:99px; background:var(--n2); display:flex; align-items:center; justify-content:center;}
.modal-stage{height:220px; border-radius:16px; background:linear-gradient(180deg, var(--n2), var(--n3)); display:flex; align-items:center; justify-content:center; margin-bottom:16px; perspective:1200px;}
.mini-room{width:150px; height:150px; transform-style:preserve-3d; transform:rotateX(55deg) rotateZ(-32deg); position:relative;}
.mini-floor{position:absolute; inset:0; border-radius:6px; box-shadow:0 20px 40px rgba(0,0,0,.15);}
.mini-chip{position:absolute; width:22px; height:22px; border-radius:6px; background:var(--n1); border:1px solid var(--n4); transform:translateZ(2px);}
.modal-actions{display:flex; gap:10px;}

/* ── visit screen ── */
.visit-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
.visit-owner{display:flex; align-items:center; gap:12px;}
.visit-avatar{width:44px; height:44px; border-radius:99px; background:var(--m300); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;}
.visit-owner b{font-size:15px; display:block;}
.visit-owner span{font-size:11.5px; color:var(--n7);}
.visit-actions{display:flex; gap:8px;}
.visit-stage{height:440px; border-radius:24px; background:linear-gradient(180deg, var(--n1), var(--n2)); border:1px solid var(--n3); display:flex; align-items:center; justify-content:center; position:relative; perspective:1500px;}
.big-room{width:340px; height:340px; position:relative; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.7,.3,1);}
.big-room.persp{transform:rotateX(52deg) rotateZ(-38deg);}
.big-room.top{transform:rotateX(78deg) rotateZ(0deg);}
.big-floor{position:absolute; inset:0; border-radius:6px; box-shadow:0 30px 60px rgba(0,0,0,.18);}
.big-wall{position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:top; opacity:.9;}
.bw-back{transform:rotateX(90deg); height:130px; top:-130px;}
.bw-left{transform-origin:left; transform:rotateY(90deg); width:130px; left:-130px;}
.bf-chip{position:absolute; width:40px; height:40px; border-radius:10px; background:var(--n1); border:1px solid var(--n4); display:flex; align-items:center; justify-content:center; transform:translateZ(3px); box-shadow:0 4px 10px rgba(0,0,0,.1);}
.visit-cam{position:absolute; top:14px; left:14px; display:flex; gap:6px; background:var(--n1); padding:4px; border-radius:99px; border:1px solid var(--n3);}
.visit-cam button{padding:7px 13px; border-radius:99px; font-size:12px; font-weight:700; color:var(--n7); display:flex; align-items:center; gap:5px;}
.visit-cam button.active{background:var(--n2); color:var(--n10);}
.visit-count{position:absolute; bottom:14px; right:14px; background:var(--n1); border:1px solid var(--n3); padding:7px 13px; border-radius:99px; font-size:11.5px; color:var(--n7); display:flex; align-items:center; gap:6px;}

/* ── guestbook ── */
.gb-compose{background:var(--n1); border-radius:var(--radius-card); padding:18px; margin-bottom:22px; box-shadow:0 6px 18px rgba(41,40,39,.06);}
.gb-compose textarea{width:100%; border:1px solid var(--n3); border-radius:var(--radius-input); padding:12px 14px; resize:vertical; outline:none; margin-bottom:10px;}
.gb-compose textarea:focus{border-color:var(--m400);}
.gb-list{display:flex; flex-direction:column; gap:14px;}
.gb-item{background:var(--n1); border-radius:var(--radius-card); padding:16px; box-shadow:0 6px 16px rgba(41,40,39,.05);}
.gb-item-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.gb-avatar{width:32px; height:32px; border-radius:99px; background:var(--m300); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
.gb-name{font-size:13px; font-weight:700;}
.gb-time{font-size:11px; color:var(--n7);}
.gb-text{font-size:13.5px; color:var(--n9); margin-bottom:10px; line-height:1.5;}
.gb-actions{display:flex; gap:14px;}
.gb-action{font-size:11.5px; color:var(--n7); display:flex; align-items:center; gap:4px;}
.gb-comments{margin-top:10px; padding-top:10px; border-top:1px dashed var(--n3); display:flex; flex-direction:column; gap:8px;}
.gb-comment{font-size:12.5px; color:var(--n8);}
.gb-comment b{font-weight:700; margin-right:6px;}

/* ── catalog admin ── */
.admin-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.admin-table{width:100%; border-collapse:collapse; background:var(--n1); border-radius:var(--radius-card); overflow:hidden; box-shadow:0 6px 18px rgba(41,40,39,.06);}
.admin-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--n7); padding:12px 16px; border-bottom:1px solid var(--n3); background:var(--n2);}
.admin-table td{padding:13px 16px; border-bottom:1px solid var(--n2); font-size:13px; vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.swatch-dot{width:22px; height:22px; border-radius:7px; display:inline-block; border:1px solid rgba(0,0,0,.08);}
.cat-tag{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:99px; display:inline-block;}
.row-actions{display:flex; gap:6px;}
.row-icon-btn{width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--n2); color:var(--n8);}
.row-icon-btn:hover{background:var(--n3);}
.toggle{width:38px; height:22px; border-radius:99px; background:var(--n3); position:relative; transition:background .15s; flex-shrink:0;}
.toggle.on{background:var(--m400);}
.toggle-dot{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:99px; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-dot{transform:translateX(16px);}
.admin-form{background:var(--n1); border-radius:var(--radius-card); padding:18px; margin-bottom:18px; display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; box-shadow:0 6px 18px rgba(41,40,39,.06);}
.admin-form label{display:block; font-size:11px; color:var(--n7); margin-bottom:5px;}
.admin-form input, .admin-form select{width:100%; padding:10px 12px; border:1px solid var(--n3); border-radius:var(--radius-input); outline:none;}

/* ── toast ── */
.toast-wrap{position:fixed; top:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:999;}
.toast{background:var(--n10); color:var(--n1); padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; box-shadow:0 10px 24px rgba(0,0,0,.22); animation:toastPop .3s ease both;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function I({name, size=16}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return <i ref={ref} data-lucide={name} style={{width:size, height:size, display:'inline-block'}}></i>;
}

const NAV = [
  {id:'main', label:'공개 공간 갤러리', icon:'layout-grid'},
  {id:'visit', label:'다른 사용자 공간 방문', icon:'door-open'},
  {id:'guestbook', label:'방명록', icon:'message-square'},
  {id:'catalog-admin', label:'가구 카탈로그 관리', icon:'settings-2'},
];

let toastSeq = 0;
function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t => <div className="toast" key={t.id}><I name="check-circle" size={16}/>{t.text}</div>)}</div>;
}

const SPACES = [
  {id:'sp1', name:'우드톤 34평 거실', owner:'하늘', likes:128, visits:412, badge:'인기', color1:'#e7dbc9', color2:'#c98b6d', mine:false},
  {id:'sp2', name:'모던 그레이 스터디룸', owner:'재인', likes:96, visits:301, badge:'친구', color1:'#dfe1e3', color2:'#41506b', mine:true},
  {id:'sp3', name:'세이지 그린 홈오피스', owner:'도윤', likes:74, visits:210, badge:null, color1:'#c8d3c0', color2:'#7a5638', mine:false},
  {id:'sp4', name:'미니멀 화이트 침실', owner:'서연', likes:61, visits:188, badge:null, color1:'#efeff0', color2:'#2b2b2c', mine:false},
  {id:'sp5', name:'테라코타 다이닝룸', owner:'지호', likes:143, visits:530, badge:'인기', color1:'#c98b6d', color2:'#e0bd8e', mine:false},
  {id:'sp6', name:'라벤더 그레이 침실', owner:'유나', likes:52, visits:140, badge:'친구', color1:'#c9c3d6', color2:'#523c2a', mine:true},
];

function GalleryScreen({onVisit, pushToast}){
  const [filter, setFilter] = useState('popular');
  const [view, setView] = useState('grid');
  const [likes, setLikes] = useState(()=>Object.fromEntries(SPACES.map(s=>[s.id,false])));
  const [quick, setQuick] = useState(null);

  let list = [...SPACES];
  if(filter==='popular') list.sort((a,b)=>b.likes-a.likes);
  if(filter==='recent') list.sort((a,b)=>b.visits-a.visits);
  if(filter==='friends') list = list.filter(s=>s.mine);

  function toggleLike(e, id){
    e.stopPropagation();
    setLikes(m => ({...m, [id]: !m[id]}));
  }

  return (
    <div className="fade-in">
      <div className="hero">
        <h1>다른 사람들의 아파트를 3D로 둘러보세요</h1>
        <p>공개된 인테리어 공간을 탐색하고, 마음에 드는 공간에 방문해 방명록을 남길 수 있습니다.</p>
        <div className="hero-stats">
          <div className="hero-stat"><b>{SPACES.length}</b><span>공개된 공간</span></div>
          <div className="hero-stat"><b>{SPACES.reduce((a,s)=>a+s.visits,0)}</b><span>누적 방문</span></div>
          <div className="hero-stat"><b>2</b><span>아파트 타입</span></div>
        </div>
      </div>

      <div className="section-head">
        <div>
          <h2>공개 공간 갤러리</h2>
          <p>정렬 기준을 바꾸면 카드 목록이 즉시 재정렬됩니다.</p>
        </div>
      </div>
      <div className="filter-rail">
        <button className={"filter-chip"+(filter==='popular'?' active':'')} onClick={()=>setFilter('popular')}><I name="flame" size={13}/> 인기</button>
        <button className={"filter-chip"+(filter==='recent'?' active':'')} onClick={()=>setFilter('recent')}><I name="clock" size={13}/> 최신</button>
        <button className={"filter-chip"+(filter==='friends'?' active':'')} onClick={()=>setFilter('friends')}><I name="users" size={13}/> 친구</button>
        <div className="filter-spacer"></div>
        <div className="view-toggle">
          <button className={"view-btn"+(view==='grid'?' active':'')} onClick={()=>setView('grid')}><I name="grid-3x3" size={15}/></button>
          <button className={"view-btn"+(view==='list'?' active':'')} onClick={()=>setView('list')}><I name="list" size={15}/></button>
        </div>
      </div>

      <div className="gallery">
        {list.map((s,i) => (
          <div className="gcard stagger" key={s.id} style={{animationDelay:(i*0.05)+'s', borderRadius:16, boxShadow:'0 8px 22px rgba(41,40,39,0.07)'}} onClick={()=>setQuick(s)}>
            <div className="gcard-thumb" style={{background:'linear-gradient(135deg,'+s.color1+','+s.color2+')'}}>
              <I name="cube" size={30}/>
              {s.badge && <span className="gcard-badge">{s.badge}</span>}
            </div>
            <div className="gcard-body">
              <div className="gcard-name">{s.name}</div>
              <div className="gcard-owner"><span className="oa">{s.owner[0]}</span>{s.owner} 님의 공간</div>
              <div className="gcard-foot">
                <button className={"gcard-like"+(likes[s.id]?' liked':'')} onClick={(e)=>toggleLike(e, s.id)} style={likes[s.id]?{animation:'heartPop .3s ease'}:{}}>
                  <I name={likes[s.id]?'heart':'heart'} size={14}/>{s.likes + (likes[s.id]?1:0)}
                </button>
                <span className="gcard-owner"><I name="footprints" size={13}/> {s.visits}</span>
              </div>
            </div>
          </div>
        ))}
      </div>

      {quick && (
        <div className="overlay" onClick={()=>setQuick(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{quick.name}</div>
                <div className="modal-owner">{quick.owner} 님의 공간 · 방문 {quick.visits}회</div>
              </div>
              <button className="modal-close" onClick={()=>setQuick(null)}><I name="x" size={15}/></button>
            </div>
            <div className="modal-stage">
              <div className="mini-room">
                <div className="mini-floor" style={{background:quick.color1}}>
                  <div className="mini-chip" style={{left:'20%', top:'55%'}}></div>
                  <div className="mini-chip" style={{left:'55%', top:'30%'}}></div>
                  <div className="mini-chip" style={{left:'65%', top:'65%'}}></div>
                </div>
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-primary" style={{flex:1, justifyContent:'center'}} onClick={()=>{setQuick(null); onVisit(quick);}}>
                <I name="door-open" size={15}/> 전체 3D 뷰어로 방문하기
              </button>
              <button className="btn btn-ghost" onClick={()=>{pushToast(quick.name+' 링크가 복사되었습니다'); }}><I name="share-2" size={15}/></button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

            <b>{s.name}</b>

          </div>
        </div>
        <div className="visit-actions">
          <button className="btn btn-ghost btn-sm" onClick={onBack}><I name="arrow-left" size={14}/> 목록으로 돌아가기</button>

      </div>

        <div className="visit-cam">

          <button className={cam==='top'?'active':''} onClick={()=>setCam('top')}><I name="scan" size={13}/> 상단 시점</button>
        </div>
        <div className={"big-room "+cam}>
          <div className="big-floor" style={{background:s.color1}}>
            <div className="bf-chip" style={{left:'22%', top:'58%'}}><I name="sofa" size={16}/></div>
            <div className="bf-chip" style={{left:'58%', top:'32%'}}><I name="lamp" size={16}/></div>
            <div className="bf-chip" style={{left:'70%', top:'68%'}}><I name="bookmark" size={16}/></div>
          </div>
          <div className="big-wall bw-back" style={{background:s.color2}}></div>
          <div className="big-wall bw-left" style={{background:s.color2}}></div>
        </div>
        <div className="visit-count"><I name="footprints" size={13}/> 누적 방문 {s.visits}회 · 편집 컨트롤은 소유자만 사용할 수 있습니다</div>
      </div>
    </div>
  );
}

function GuestbookScreen({pushToast}){
  const [entries, setEntries] = useState([
    {id:'g1', name:'하늘', time:'2시간 전', text:'거실 톤이 정말 편안해요! 소파 배치 참고할게요.', comments:[{name:'재인', text:'저도 동감이에요 :)'}], mine:false},
    {id:'g2', name:'민지', time:'어제', text:'책장 위치 아이디어 감사합니다. 저희 공간에도 적용해봤어요.', comments:[], mine:true},
    {id:'g3', name:'도윤', time:'3일 전', text:'테라코타 톤 조합이 인상 깊네요, 다음에 놀러갈게요!', comments:[{name:'하늘', text:'환영입니다 :)'},{name:'서연', text:'저도 궁금했어요'}], mine:false},
  ]);
  const [draft, setDraft] = useState('');

  function submit(){
    if(!draft.trim()){ pushToast('방명록 내용을 입력해주세요'); return; }
    setEntries(list => [{id:'g'+Date.now(), name:'민지', time:'방금', text:draft, comments:[], mine:true}, ...list]);
    setDraft('');
    pushToast('방명록이 등록되었습니다');
  }
  function remove(id){
    setEntries(list => list.filter(e => e.id !== id));
    pushToast('방명록이 삭제되었습니다');
  }

  return (
    <div className="fade-in">
      <div className="section-head">
        <div><h2>방명록</h2><p>방문한 공간에 글을 남기고, 다른 방문자의 방명록과 댓글을 함께 확인합니다.</p></div>
      </div>
      <div className="gb-compose">
        <textarea rows="3" placeholder="이 공간에 방명록을 남겨보세요" value={draft} onChange={e=>setDraft(e.target.value)}></textarea>
        <button className="btn btn-primary btn-sm" onClick={submit}><I name="send" size={13}/> 방명록 남기기</button>
      </div>
      <div className="gb-list">
        {entries.map((en,i) => (
          <div className="gb-item stagger" key={en.id} style={{animationDelay:(i*0.05)+'s'}}>
            <div className="gb-item-head">
              <div className="gb-avatar">{en.name[0]}</div>
              <div>
                <div className="gb-name">{en.name}</div>
                <div className="gb-time">{en.time}</div>
              </div>
            </div>
            <div className="gb-text">{en.text}</div>
            <div className="gb-actions">
              <span className="gb-action"><I name="message-circle" size={13}/> 댓글 {en.comments.length}</span>
              <button className="gb-action" onClick={()=>pushToast('신고가 접수되었습니다')}><I name="flag" size={13}/> 신고</button>
              {en.mine && <button className="gb-action" onClick={()=>remove(en.id)}><I name="trash-2" size={13}/> 삭제</button>}
            </div>
            {en.comments.length > 0 && (
              <div className="gb-comments">
                {en.comments.map((c,ci) => <div className="gb-comment" key={ci}><b>{c.name}</b>{c.text}</div>)}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

const CATEGORY_COLORS = {'소파':'#c9a7d6','테이블':'#a7c9d6','조명':'#e0c27a','수납':'#a7d6b0','패브릭':'#d6a7a7'};

function CatalogAdminScreen({pushToast}){
  const [items, setItems] = useState([
    {id:'c1', name:'2인용 패브릭 소파', cat:'소파', swatch:'#c9a7d6', on:true, order:1},
    {id:'c2', name:'원목 다이닝 테이블', cat:'테이블', swatch:'#a7c9d6', on:true, order:2},
    {id:'c3', name:'플로어 스탠드 조명', cat:'조명', swatch:'#e0c27a', on:true, order:3},
    {id:'c4', name:'6단 원목 책장', cat:'수납', swatch:'#a7d6b0', on:false, order:4},
    {id:'c5', name:'라운드 러그', cat:'패브릭', swatch:'#d6a7a7', on:true, order:5},
  ]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({name:'', cat:'소파'});

  function toggle(id){
    setItems(list => list.map(it => it.id===id ? {...it, on:!it.on} : it));
    pushToast('노출 설정이 변경되었습니다');
  }
  function move(id, dir){
    setItems(list => {
      const idx = list.findIndex(it=>it.id===id);
      const swapIdx = idx + dir;
      if(swapIdx < 0 || swapIdx >= list.length) return list;
      const copy = [...list];
      [copy[idx], copy[swapIdx]] = [copy[swapIdx], copy[idx]];
      return copy.map((it,i)=>({...it, order:i+1}));
    });
  }
  function remove(id){
    setItems(list => list.filter(it => it.id !== id));
    pushToast('카탈로그 항목이 삭제되었습니다');
  }
  function addItem(){
    if(!form.name.trim()){ pushToast('항목 이름을 입력해주세요'); return; }
    const id = 'c'+Date.now();
    setItems(list => [...list, {id, name:form.name, cat:form.cat, swatch:CATEGORY_COLORS[form.cat], on:true, order:list.length+1}]);
    setForm({name:'', cat:'소파'});
    setShowForm(false);
    pushToast('새 카탈로그 항목이 등록되었습니다');
  }

  return (
    <div className="fade-in">
      <div className="admin-toolbar">
        <div><h2 style={{fontSize:19, fontWeight:800}}>가구 카탈로그 관리</h2><p style={{fontSize:12.5, color:'var(--n7)', marginTop:3}}>운영자가 가구·마감재 카탈로그를 등록·수정하고 노출 여부를 관리합니다.</p></div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(v=>!v)}><I name="plus" size={14}/> 새 항목 등록</button>
      </div>

      {showForm && (
        <div className="admin-form fade-in">
          <div>
            <label>항목 이름</label>
            <input value={form.name} onChange={e=>setForm(f=>({...f, name:e.target.value}))} placeholder="예: 스칸디 원목 스툴"/>
          </div>
          <div>
            <label>카테고리</label>
            <select value={form.cat} onChange={e=>setForm(f=>({...f, cat:e.target.value}))}>
              {Object.keys(CATEGORY_COLORS).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>미리보기</label>
            <span className="swatch-dot" style={{background:CATEGORY_COLORS[form.cat]}}></span>
          </div>
          <button className="btn btn-primary" onClick={addItem}><I name="check" size={14}/> 등록</button>
        </div>
      )}

      <table className="admin-table">
        <thead>
          <tr><th>미리보기</th><th>이름</th><th>카테고리</th><th>노출</th><th>정렬</th><th>관리</th></tr>
        </thead>
        <tbody>
          {items.sort((a,b)=>a.order-b.order).map(it => (
            <tr key={it.id}>
              <td><span className="swatch-dot" style={{background:it.swatch}}></span></td>
              <td>{it.name}</td>
              <td><span className="cat-tag" style={{background:it.swatch+'33', color:'var(--n9)'}}>{it.cat}</span></td>
              <td><div className={"toggle"+(it.on?' on':'')} onClick={()=>toggle(it.id)}><div className="toggle-dot"></div></div></td>
              <td>
                <div className="row-actions">
                  <button className="row-icon-btn" onClick={()=>move(it.id,-1)}><I name="chevron-up" size={14}/></button>
                  <button className="row-icon-btn" onClick={()=>move(it.id,1)}><I name="chevron-down" size={14}/></button>
                </div>
              </td>
              <td>
                <div className="row-actions">
                  <button className="row-icon-btn" onClick={()=>pushToast(it.name+' 편집 화면으로 이동합니다')}><I name="pencil" size={14}/></button>
                  <button className="row-icon-btn" onClick={()=>remove(it.id)}><I name="trash-2" size={14}/></button>
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [visitSpace, setVisitSpace] = useState(SPACES[0]);
  const [toasts, setToasts] = useState([]);

  function pushToast(text){
    const id = ++toastSeq;
    setToasts(list => [...list, {id, text}]);
    setTimeout(() => setToasts(list => list.filter(t => t.id !== id)), 2600);
  }

  return (
    <div>
      <header className="topnav">
        <div className="brand">
          <div className="brand-mark"><I name="box" size={18}/></div>
          <div className="brand-text"><b>코지스페이스</b><span>커뮤니티</span></div>
        </div>
        <nav className="topnav-tabs">
          {NAV.map(n => (
            <button key={n.id} className={"topnav-tab"+(screen===n.id?' active':'')} onClick={()=>setScreen(n.id)}>
              <I name={n.icon} size={14}/>{n.label}
            </button>
          ))}
        </nav>
        <div className="topnav-right">
          <button className="icon-btn" onClick={()=>pushToast('새로운 알림이 없습니다')}><I name="bell" size={16}/></button>
          <div className="profile-chip">민</div>
        </div>
      </header>
      <div className="page">
        {screen==='main' && <GalleryScreen pushToast={pushToast} onVisit={(s)=>{setVisitSpace(s); setScreen('visit');}}/>}
        {screen==='visit' && <VisitScreen space={visitSpace} pushToast={pushToast} onBack={()=>setScreen('main')}/>}
        {screen==='guestbook' && <GuestbookScreen pushToast={pushToast}/>}
        {screen==='catalog-admin' && <CatalogAdminScreen pushToast={pushToast}/>}
      </div>
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
