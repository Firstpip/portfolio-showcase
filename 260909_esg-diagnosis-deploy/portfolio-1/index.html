<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG·사회적가치 진단 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fbf4f0; --m100:#f6e9e2; --m200:#eed4c4; --m300:#e3baa1; --m400:#d79c79;
  --m500:#cc8154; --m600:#c1652e; --m700:#9e5326; --m800:#7c411d; --m900:#572d15;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#777b86; --n8:#5a5653; --n9:#3a3836; --n10:#17191c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n9);
  -webkit-font-smoothing: antialiased;
}
#app { width: 100%; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--n4); border-radius: 8px; }

/* ── keyframes ── */
@keyframes fadeInUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
@keyframes cardStagger { from { opacity:0; transform: translateY(18px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes ripple { from { transform: scale(0); opacity: .45; } to { transform: scale(2.6); opacity: 0; } }
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(31,137,75,.35); } 50% { box-shadow: 0 0 0 6px rgba(31,137,75,0); } }
@keyframes drawIn { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }

/* ── layout shell ── */
.shell { display:flex; width:100%; min-height:100vh; }
.sidebar {
  position: fixed; left:0; top:0; bottom:0; width:240px;
  background: var(--n0); border-right: 1px solid var(--n3);
  display:flex; flex-direction:column; padding: 24px 16px; gap: 28px; z-index: 40;
}
.sidebar-brand { display:flex; align-items:center; gap:10px; padding: 0 8px; }
.brand-mark {
  width:32px; height:32px; border-radius:10px; background: var(--m600);
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
}
.brand-name { font-size:15px; font-weight:700; color:var(--n10); letter-spacing:-.2px; }
.brand-sub { font-size:11px; color:var(--n6); margin-top:1px; }
.sidebar-section { display:flex; flex-direction:column; gap:2px; }
.sidebar-section-title {
  font-size:11px; font-weight:600; color:var(--n6); text-transform:uppercase;
  letter-spacing:.06em; padding: 0 10px; margin-bottom:6px;
}
.sidebar-link {
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
  font-size:14px; color:var(--n8); font-weight:500; text-align:left; width:100%;
  transition: background .15s, color .15s;
}
.sidebar-link:hover { background: var(--n1); color: var(--n10); }
.sidebar-link.active { background: var(--m50); color: var(--m700); font-weight:600; }
.sidebar-link .icon-16 { width:16px; height:16px; flex-shrink:0; }
.sidebar-footer { margin-top:auto; padding: 12px 10px; border-top:1px solid var(--n3); }
.sidebar-org { display:flex; align-items:center; gap:10px; }
.org-avatar {
  width:32px; height:32px; border-radius:50%; background: var(--n2); color: var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.org-name { font-size:13px; font-weight:600; color:var(--n9); }
.org-role { font-size:11px; color:var(--n6); }

.main-wrap {
  margin-left: 240px; min-height:100vh; flex:1; min-width:0; width:calc(100% - 240px);
  padding: 28px 36px 60px; animation: fadeInUp .4s ease both;
}

/* ── page header ── */
.page-header { margin-bottom:24px; }
.page-title-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.page-title { font-size:24px; font-weight:700; color:var(--n10); letter-spacing:-.3px; margin:0; }
.page-meta { font-size:12.5px; color:var(--n6); margin-top:6px; }
.page-actions { display:flex; gap:8px; align-items:center; }

.btn { display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:10px; position:relative; overflow:hidden; transition: transform .12s, box-shadow .15s; white-space:nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--m600); color:#fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn-primary:hover { background: var(--m700); }
.btn-secondary { background: var(--n0); color:var(--n8); border:1px solid var(--n4); }
.btn-secondary:hover { background: var(--n1); }
.btn-ghost { background:transparent; color:var(--n7); }
.btn-ghost:hover { color:var(--n9); background:var(--n1); }
.btn .icon-16 { width:15px; height:15px; }
.btn-sm { padding:6px 12px; font-size:12.5px; }

.ripple-el { position:absolute; border-radius:50%; background:#fff; pointer-events:none; animation: ripple .55s ease-out; }

/* ── stat row (archetype signature) ── */
.stat-row { display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom:24px; }
.stat-card {
  background: var(--n0); border:1px solid var(--n3); border-radius:20px; padding:20px 22px;
  min-height:112px; display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03); animation: cardStagger .45s ease both;
  transition: transform .18s ease, box-shadow .18s ease;
}
.stat-card:hover, .panel:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(32,30,30,.09); }
.stat-card:nth-child(2){animation-delay:.05s} .stat-card:nth-child(3){animation-delay:.1s} .stat-card:nth-child(4){animation-delay:.15s}
.stat-top { display:flex; align-items:center; justify-content:space-between; }
.stat-icon-box { width:32px; height:32px; border-radius:9px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; }
.stat-icon-box .icon-16 { width:16px; height:16px; }
.stat-label { font-size:12.5px; color:var(--n7); font-weight:500; }
.stat-body { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.stat-value { font-size:30px; font-weight:700; color:var(--n10); letter-spacing:-.5px; line-height:1; }
.stat-delta { font-size:12px; font-weight:600; display:flex; align-items:center; gap:2px; color: var(--n6); }
.stat-delta.up { color: var(--s1-text); }
.stat-delta.down { color: var(--s2-text); }
.stat-sparkline { width:64px; height:28px; flex-shrink:0; }

/* ── insight board: hero-viz + kpi-side ── */
.insight-grid { display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:16px; }
.panel { background:var(--n0); border:1px solid var(--n3); border-radius:20px; padding:22px; }
.panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.panel-title { font-size:15px; font-weight:700; color:var(--n10); }
.panel-sub { font-size:12px; color:var(--n6); margin-top:2px; }
.chart-wrap { position:relative; width:100%; height:260px; }
.chart-wrap.sm { height:150px; }
.kpi-side { display:flex; flex-direction:column; gap:14px; }
.kpi-side .panel { flex:1; display:flex; flex-direction:column; }
.status-row { display:flex; align-items:center; gap:10px; padding:12px; background:var(--n1); border-radius:14px; margin-bottom:10px; }
.live-dot { width:9px; height:9px; border-radius:50%; background:var(--s1); flex-shrink:0; animation: pulseDot 2s infinite; }
.status-text { font-size:13px; font-weight:600; color:var(--n9); }
.status-sub { font-size:11.5px; color:var(--n6); }
.mini-info-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--n3); font-size:13px; }
.mini-info-row:last-of-type { border-bottom:none; }
.mini-info-label { color:var(--n7); }
.mini-info-value { font-weight:600; color:var(--n9); }

/* ── widget grid ── */
.widget-grid { display:grid; grid-template-columns: 1.1fr 1.3fr 1fr; gap:16px; margin-bottom:24px; }
.timeline { display:flex; flex-direction:column; gap:0; }
.timeline-item { display:flex; gap:10px; padding:9px 0; position:relative; }
.timeline-dot { width:8px; height:8px; border-radius:50%; background:var(--n5); margin-top:5px; flex-shrink:0; }
.timeline-dot.ok { background: var(--s1); }
.timeline-text { font-size:12.5px; color:var(--n8); line-height:1.5; }
.timeline-time { font-size:11px; color:var(--n5); }
.quickstart-card { display:flex; flex-direction:column; align-items:flex-start; gap:10px; height:100%; justify-content:center; }
.quickstart-icon { width:44px; height:44px; border-radius:12px; background:var(--m50); color:var(--m600); display:flex; align-items:center; justify-content:center; }

/* ── donut legend ── */
.legend-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--n8); }
.legend-swatch { width:9px; height:9px; border-radius:2px; flex-shrink:0; }

/* ── data section: tabs + table (archetype signature) ── */
.data-section { background:var(--n0); border:1px solid var(--n3); border-radius:20px; overflow:hidden; }
.tab-bar { display:flex; gap:4px; padding: 14px 22px 0; border-bottom:1px solid var(--n3); }
.tab { padding:10px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--n6); border-bottom:2px solid transparent; }
.tab.active { color: var(--m700); border-bottom-color: var(--m600); }
.data-toolbar { display:flex; align-items:center; gap:10px; padding:14px 22px; flex-wrap:wrap; }
.search-input { flex:1; min-width:180px; padding:9px 14px; border:1px solid var(--n4); border-radius:10px; font-size:13px; background:var(--n1); color:var(--n9); }
.search-input:focus { outline:2px solid var(--m300); background:var(--n0); }
.filter-chip { padding:7px 13px; border-radius:999px; border:1px solid var(--n4); font-size:12.5px; color:var(--n7); background:var(--n0); }
.filter-chip.active { border-color:var(--m600); color:var(--m700); background:var(--m50); }
.export-btn { padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; color:var(--n7); border:1px solid var(--n4); display:flex; align-items:center; gap:6px; }
.export-btn:hover { color:var(--n9); background:var(--n1); }
.data-table-wrap { overflow-x:auto; }
table.data-table { width:100%; border-collapse:collapse; }
table.data-table th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--n6); padding:10px 22px; border-bottom:1px solid var(--n3); font-weight:600; }
table.data-table td { padding:13px 22px; font-size:13.5px; color:var(--n8); border-bottom:1px solid var(--n2); }
table.data-table tbody tr { transition: background .12s; cursor:pointer; }
table.data-table tbody tr:hover { background: var(--n1); }
table.data-table td.strong { color:var(--n10); font-weight:600; }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; }
.badge.neutral { background:var(--n2); color:var(--n7); }
.badge.success { background:var(--s1-bg); color:var(--s1-text); }
.badge.danger { background:var(--s2-bg); color:var(--s2-text); }
.row-more { color:var(--n5); font-size:16px; padding:4px 8px; border-radius:6px; }
.row-more:hover { background:var(--n2); color:var(--n8); }

/* ── auth screen ── */
.auth-wrap { max-width:460px; margin: 20px auto 0; }
.auth-card { background:var(--n0); border:1px solid var(--n3); border-radius:20px; padding:32px; animation: cardStagger .4s ease both; }
.auth-tabs { display:flex; background:var(--n1); border-radius:12px; padding:4px; margin-bottom:22px; }
.auth-tab { flex:1; text-align:center; padding:9px 0; font-size:13.5px; font-weight:600; color:var(--n7); border-radius:9px; }
.auth-tab.active { background:var(--n0); color:var(--n10); box-shadow:0 1px 2px rgba(0,0,0,.06); }
.field { margin-bottom:16px; }
.field-label { display:block; font-size:12.5px; font-weight:600; color:var(--n8); margin-bottom:6px; }
.field-label .req { color: var(--s2); margin-left:2px; }
.field-input { width:100%; padding:11px 14px; border:1px solid var(--n4); border-radius:12px; font-size:13.5px; background:var(--n0); color:var(--n9); }
.field-input:focus { outline:none; border-color:var(--m500); box-shadow:0 0 0 3px var(--m50); }
.field-error { font-size:11.5px; color:var(--s2-text); margin-top:5px; }
.field-hint { font-size:11.5px; color:var(--n6); margin-top:5px; }
.divider-line { height:1px; background:var(--n3); margin:20px 0; }
.verify-box { display:flex; gap:12px; padding:16px; background:var(--m50); border-radius:14px; align-items:flex-start; }
.verify-box .icon-16 { width:18px; height:18px; color:var(--m700); flex-shrink:0; margin-top:1px; }
.demo-controls { margin-top:22px; padding-top:18px; border-top:1px dashed var(--n3); }
.demo-controls-title { font-size:11.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.demo-row { display:flex; gap:8px; flex-wrap:wrap; }
.error-banner { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:14px; background:var(--s2-bg); margin-bottom:16px; }
.error-banner .icon-16 { width:17px; height:17px; color:var(--s2-text); flex-shrink:0; margin-top:1px; }
.error-banner-text { font-size:13px; color:var(--s2-text); font-weight:500; line-height:1.5; }
.success-banner { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:14px; background:var(--s1-bg); margin-bottom:16px; }
.success-banner .icon-16 { width:17px; height:17px; color:var(--s1-text); flex-shrink:0; margin-top:1px; }
.success-banner-text { font-size:13px; color:var(--s1-text); font-weight:500; }

/* ── diagnosis screen ── */
.diag-layout { display:grid; grid-template-columns: 1fr 300px; gap:20px; align-items:flex-start; }
.diag-group { background:var(--n0); border:1px solid var(--n3); border-radius:20px; padding:24px; margin-bottom:16px; }
.diag-group-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.diag-group-badge { width:30px; height:30px; border-radius:9px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
.diag-group-title { font-size:14.5px; font-weight:700; color:var(--n10); }
.diag-item { padding:14px 0; border-bottom:1px solid var(--n2); }
.diag-item:last-child { border-bottom:none; }
.diag-item-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.diag-item-name { font-size:13.5px; font-weight:600; color:var(--n9); }
.diag-item-name .req { color:var(--s2); margin-left:3px; }
.diag-item-score { font-size:13px; font-weight:700; color:var(--n9); min-width:34px; text-align:right; }
.slider { width:100%; -webkit-appearance:none; height:6px; border-radius:4px; background:var(--n3); outline:none; }
.slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--m600); cursor:pointer; border:3px solid #fff; box-shadow:0 0 0 1px var(--n4); }
.diag-sub-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
.diag-select { padding:7px 10px; border:1px solid var(--n4); border-radius:8px; font-size:12px; color:var(--n8); background:var(--n0); }
.field-error.attn { animation: none; }
.diag-item.invalid { background: var(--s2-bg); margin:0 -12px; padding:14px 12px; border-radius:12px; border-bottom-color:transparent; }
.sticky-panel { position:sticky; top:24px; }
.progress-track { width:100%; height:8px; border-radius:8px; background:var(--n3); overflow:hidden; margin:12px 0; }
.progress-fill { height:100%; background:var(--m600); border-radius:8px; transition: width .3s ease; }
.report-score-ring-wrap { display:flex; justify-content:center; margin:12px 0; }

/* ── loading / shimmer ── */
.skeleton-block { height:16px; border-radius:6px; background: linear-gradient(90deg, var(--n2) 0px, var(--n3) 40px, var(--n2) 80px); background-size: 200px 100%; animation: shimmer 1.3s infinite linear; }
.loading-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 0; }
.spinner { width:34px; height:34px; border-radius:50%; border:3px solid var(--n3); border-top-color: var(--m600); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size:13.5px; color:var(--n7); font-weight:500; }

/* ── history screen ── */
.rls-banner { display:flex; align-items:center; gap:10px; padding:13px 18px; background:var(--n1); border-radius:14px; margin-bottom:18px; }
.rls-banner .icon-16 { width:16px; height:16px; color:var(--n7); }
.rls-banner-text { font-size:12.5px; color:var(--n7); }
.hist-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.compare-diff-panel { background:var(--n0); border:1px solid var(--m300); border-radius:20px; padding:22px; margin-bottom:18px; animation: cardStagger .3s ease both; }
.diff-row { display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; align-items:center; padding:10px 0; border-bottom:1px solid var(--n2); font-size:13px; }
.diff-row:last-child { border-bottom:none; }
.diff-row.head { font-size:11px; text-transform:uppercase; color:var(--n6); font-weight:700; }
.diff-change { font-weight:700; display:flex; align-items:center; gap:3px; }
.diff-change.up { color: var(--s1-text); }
.diff-change.down { color: var(--s2-text); }
.diff-change.flat { color: var(--n6); }

/* ── modal / drawer / toast ── */
.overlay { position:fixed; inset:0; background:rgba(32,30,30,.42); display:flex; align-items:center; justify-content:center; z-index:100; animation: fadeInUp .18s ease both; }
.modal-card { width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--n0); border-radius:20px; padding:28px; animation: cardStagger .22s ease both; }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.modal-title { font-size:17px; font-weight:700; color:var(--n10); }
.modal-close { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--n6); }
.modal-close:hover { background:var(--n1); color:var(--n9); }
.modal-field-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--n3); font-size:13px; }
.modal-field-row .k { color:var(--n6); } .modal-field-row .v { font-weight:600; color:var(--n9); }
.modal-actions { display:flex; gap:8px; margin-top:20px; }

.drawer-overlay { position:fixed; inset:0; background:rgba(32,30,30,.35); z-index:90; }
.drawer-panel { position:fixed; right:0; top:0; bottom:0; width:380px; max-width:90vw; background:var(--n0); box-shadow:-8px 0 30px rgba(0,0,0,.1); padding:26px; z-index:91; overflow-y:auto; animation: slideInRight .25s ease both; }
@keyframes slideInRight { from { transform: translateX(100%);} to { transform: translateX(0);} }

.toast-wrap { position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; }
.toast { display:flex; align-items:center; gap:10px; background:var(--n10); color:#fff; padding:13px 18px; border-radius:12px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.18); animation: cardStagger .25s ease both; }

/* ───────── small utils ───────── */
function sparkPath(values, w, h) {
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  return values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
}

function Sparkline({ values, color = "var(--n5)" }) {
  const w = 64, h = 28;
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`}>
      <path d={sparkPath(values, w, h)} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" style={{ strokeDasharray: 200, strokeDashoffset: 0, animation: "drawIn 1s ease both" }} />
    </svg>
  );
}

function useChart(ref, buildConfig, deps) {
  useEffect(() => {
    if (!ref.current) return;
    const chart = new Chart(ref.current.getContext("2d"), buildConfig());
    return () => chart.destroy();
    // eslint-disable-next-line
  }, deps);
}

function IconBtn({ icon, label, onClick, className = "" }) {
  return (
    <button className={"btn btn-secondary btn-sm " + className} onClick={onClick} title={label}>
      <i data-lucide={icon} className="icon-16"></i>{label}
    </button>
  );
}

function RippleButton({ className, onClick, children, style }) {
  const fire = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const span = document.createElement("span");
    span.className = "ripple-el";
    span.style.left = (e.clientX - rect.left - 8) + "px";
    span.style.top = (e.clientY - rect.top - 8) + "px";
    span.style.width = span.style.height = "16px";
    e.currentTarget.appendChild(span);
    setTimeout(() => span.remove(), 550);
    if (onClick) onClick(e);
  };
  return <button className={className} style={style} onClick={fire}>{children}</button>;
}

/* ───────── toast ───────── */
function useToast() {
  const [toasts, setToasts] = useState([]);
  const push = (msg, type = "success") => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  };
  const view = (
    <div className="toast-wrap">
      {toasts.map((t) => (
        <div key={t.id} className={"toast " + (t.type === "error" ? "error" : "")}>
          <i data-lucide={t.type === "error" ? "alert-circle" : "check-circle-2"} className="icon-16"></i>
          {t.msg}
        </div>
      ))}
    </div>
  );
  return { push, view };
}

            <React.Fragment>
              <div className="field"><label className="field-label">기관명<span className="req">*</span></label><input className="field-input" placeholder="예: 샘플기업 사회적협동조합" value={form.org} onChange={(e) => setForm({ ...form, org: e.target.value })} /></div>
              <div className="field"><label className="field-label">담당자명<span className="req">*</span></label><input className="field-input" placeholder="예: 김민수" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></div>
              <div className="field"><label className="field-label">이메일<span className="req">*</span></label><input className="field-input" placeholder="name@organization.kr" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></div>
              <div className="field"><label className="field-label">비밀번호<span className="req">*</span></label><input type="password" className="field-input" placeholder="8자 이상" value={form.pw} onChange={(e) => setForm({ ...form, pw: e.target.value })} /><div className="field-hint">영문, 숫자를 포함해 8자 이상 입력해주세요</div></div>
              {!sent ? (
                <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center", marginTop:6}} onClick={handleSignup}>가입하고 인증 메일 받기</RippleButton>
              ) : (
                <div className="verify-box">
                  <i data-lucide="mail-check" className="icon-16"></i>
                  <div>
                    <div style={{fontSize:13, fontWeight:600, color:"var(--n10)"}}>인증 메일을 확인해주세요</div>
                    <div style={{fontSize:12, color:"var(--n7)", margin:"4px 0 10px"}}>{form.email || "name@organization.kr"} 주소로 링크를 보냈습니다</div>
                    {!verified && <button className="btn btn-secondary btn-sm" onClick={confirmVerify}>인증 확인 (데모)</button>}
                  </div>
                </div>
              )}
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="field"><label className="field-label">이메일</label><input className="field-input" placeholder="name@organization.kr" /></div>
              <div className="field"><label className="field-label">비밀번호</label><input type="password" className="field-input" placeholder="비밀번호" /></div>
              <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={() => toast.push("로그인 되었습니다")}>로그인</RippleButton>
            </React.Fragment>
          )}

          <div className="demo-controls">
            <div className="demo-controls-title">예외 처리 시나리오 데모</div>
            <div className="demo-row">
              <button className="btn btn-secondary btn-sm" onClick={() => setErrType("expired")}>만료된 링크</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setErrType("duplicate")}>중복 가입</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setErrType("session")}>세션 만료</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── diagnosis screen ───────── */
function DiagnosisScreen({ toast, setScreen }) {
  const [scores, setScores] = useState(() => {
    const s = {};
    DIAG_GROUPS.forEach((g) => g.items.forEach((it) => (s[it.key] = 50)));
    return s;
  });
  const [evidence, setEvidence] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);
  const [attemptedSubmit, setAttemptedSubmit] = useState(false);
  const resultDonutRef = useRef(null);
  const resultBarRef = useRef(null);

  const requiredItems = DIAG_GROUPS.flatMap((g) => g.items.filter((i) => i.req));
  const missing = requiredItems.filter((i) => !evidence[i.key]);
  const filledCount = requiredItems.length - missing.length;
  const canSubmit = missing.length === 0;

  const totalScore = Math.round(Object.values(scores).reduce((a, b) => a + b, 0) / Object.values(scores).length);

  const handleSubmit = () => {
    setAttemptedSubmit(true);
    if (!canSubmit) { toast.push("필수 진단 항목의 근거 여부를 모두 선택해주세요", "error"); return; }
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      setResult({ total: totalScore });
      toast.push("진단이 완료되어 결과 리포트가 생성되었습니다");
    }, 1500);
  };

  useChart(resultDonutRef, () => ({
    type: "doughnut",
    data: { labels: ["환경(E)","사회(S)","거버넌스(G)"], datasets: [{ data: [32,38,30], backgroundColor: ["#9e5326","#c1652e","#e3baa1"], borderWidth: 0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:"66%", plugins:{legend:{display:false}} },
  }), [result]);

  useChart(resultBarRef, () => ({
    type: "bar",
    data: {
      labels: DIAG_GROUPS.flatMap((g) => g.items.map((i) => i.name.slice(0,6))),
      datasets: [{ data: DIAG_GROUPS.flatMap((g) => g.items.map((i) => scores[i.key])), backgroundColor: "#c1652e", borderRadius: 6, maxBarThickness: 22 }],
    },
    options: {
      indexAxis: "y", responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{ min:0, max:100, grid:{color:"#f0f0ef"}, ticks:{color:"#989390",font:{size:10}} }, y:{ grid:{display:false}, ticks:{color:"#5a5653",font:{size:11}} } },
    },
  }), [result]);

  const genPdf = () => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(18); doc.text("ESG·사회적가치 진단 리포트", 20, 24);
      doc.setFontSize(11); doc.text(ORG_NAME + " · 2026.09.09", 20, 34);
      doc.setFontSize(40); doc.text(String(result.total) + "점", 20, 60);
      doc.setFontSize(11);
      let y = 78;
      DIAG_GROUPS.flatMap((g) => g.items).forEach((it) => { doc.text(it.name + " : " + scores[it.key] + "점", 20, y); y += 8; });
      doc.save("esg-diagnosis-report.pdf");
      toast.push("PDF 리포트를 저장했습니다");
    } catch (e) { toast.push("PDF 생성 중 문제가 발생했습니다", "error"); }
  };

  if (result) {
    return (
      <div>
        <div className="page-header">
          <h1 className="page-title">진단 결과 리포트</h1>
          <div className="page-meta">{ORG_NAME} · 2026.09.09 생성</div>
        </div>
        <div className="insight-grid">
          <div className="panel">
            <div className="panel-title" style={{marginBottom:12}}>항목별 점수</div>
            <div className="chart-wrap"><canvas ref={resultBarRef}></canvas></div>
          </div>
          <div className="panel" style={{textAlign:"center"}}>
            <div className="panel-title">총점</div>
            <div style={{fontSize:48, fontWeight:800, color:"var(--n10)", margin:"8px 0"}}>{result.total}<span style={{fontSize:18,color:"var(--n6)"}}>/100</span></div>
            <div className="chart-wrap sm"><canvas ref={resultDonutRef}></canvas></div>
            <div className="page-actions" style={{justifyContent:"center", marginTop:16}}>
              <button className="btn btn-secondary" onClick={() => window.print()}><i data-lucide="printer" className="icon-16"></i>인쇄</button>
              <RippleButton className="btn btn-primary" onClick={genPdf}><i data-lucide="file-down" className="icon-16"></i>PDF 저장</RippleButton>
            </div>
          </div>
        </div>
        <button className="btn btn-secondary" onClick={() => setScreen("history")}><i data-lucide="history" className="icon-16"></i>진단 이력으로 이동</button>
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div>
            <h1 className="page-title">진단 항목 입력·리포트 생성</h1>
            <div className="page-meta">필수 항목 {requiredItems.length}개 중 {filledCount}개 근거 확인 완료</div>
          </div>
        </div>
        <div className="progress-track"><div className="progress-fill" style={{ width: (filledCount / requiredItems.length * 100) + "%" }}></div></div>
      </div>

      {submitting ? (
        <div className="loading-wrap"><div className="spinner"></div><div className="loading-text">진단 항목을 채점하고 있습니다…</div></div>
      ) : (
        <div className="diag-layout">
          <div>
            {DIAG_GROUPS.map((g) => (
              <div className="diag-group" key={g.key}>
                <div className="diag-group-head"><div className="diag-group-badge">{g.key}</div><div className="diag-group-title">{g.title}</div></div>
                {g.items.map((it) => {
                  const invalid = attemptedSubmit && it.req && !evidence[it.key];
                  return (
                    <div className={"diag-item " + (invalid ? "invalid" : "")} key={it.key}>
                      <div className="diag-item-top">
                        <span className="diag-item-name">{it.name}{it.req && <span className="req">*</span>}</span>
                        <span className="diag-item-score">{scores[it.key]}</span>
                      </div>
                      <input type="range" min="0" max="100" className="slider" value={scores[it.key]} onChange={(e) => setScores({ ...scores, [it.key]: Number(e.target.value) })} />
                      <div className="diag-sub-row">
                        <select className="diag-select" value={evidence[it.key] || ""} onChange={(e) => setEvidence({ ...evidence, [it.key]: e.target.value })}>
                          <option value="">문서 근거 여부 선택</option>
                          <option value="있음">근거 있음</option>
                          <option value="없음">근거 없음</option>
                          <option value="해당없음">해당 없음</option>
                        </select>
                        {invalid && <span className="field-error">필수 항목입니다</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="sticky-panel">
            <div className="panel">
              <div className="panel-title" style={{marginBottom:10}}>현재 예상 점수</div>
              <div style={{fontSize:36, fontWeight:800, color:"var(--n10)"}}>{totalScore}<span style={{fontSize:15,color:"var(--n6)"}}>/100</span></div>
              <div className="mini-info-row"><span className="mini-info-label">필수 항목 완료</span><span className="mini-info-value">{filledCount}/{requiredItems.length}</span></div>
              <div className="mini-info-row"><span className="mini-info-label">예상 소요 시간</span><span className="mini-info-value">약 5초</span></div>
              <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center", marginTop:14, opacity: canSubmit ? 1 : .5}} onClick={handleSubmit}>
                <i data-lucide="send" className="icon-16"></i>제출하고 리포트 생성
              </RippleButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────── history screen ───────── */
function HistoryScreen({ toast }) {
  const [selected, setSelected] = useState([]);
  const toggle = (id) => {
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length >= 2 ? [s[1], id] : [...s, id]));
  };
  const compareItems = HISTORY.filter((h) => selected.includes(h.id));
  const diffMetrics = [
    { name: "총점", a: 65, b: 78 },
    { name: "환경(E)", a: 60, b: 70 },
    { name: "사회(S)", a: 66, b: 80 },
    { name: "거버넌스(G)", a: 70, b: 72 },
  ];

  const genPdf = (row) => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16); doc.text("ESG 진단 리포트 — " + row.date, 20, 24);
      doc.setFontSize(30); doc.text(row.score + "점", 20, 50);
      doc.save("esg-report-" + row.date.replace(/\./g,"") + ".pdf");
      toast.push(row.date + " 리포트를 PDF로 저장했습니다");
    } catch (e) { toast.push("PDF 생성 중 문제가 발생했습니다", "error"); }
  };

  return (
    <div>
      <div className="page-header">
        <h1 className="page-title">진단 이력 비교·PDF 출력</h1>
        <div className="page-meta">과거 진단 결과를 비교하고 PDF로 저장할 수 있습니다</div>
      </div>

      <div className="rls-banner"><i data-lucide="lock" className="icon-16"></i><span className="rls-banner-text">Row Level Security 정책에 따라 {ORG_NAME}의 진단 이력만 조회됩니다</span></div>

      <div className="hist-toolbar">
        <div style={{fontSize:12.5, color:"var(--n6)"}}>비교할 이력 2개를 선택하세요 ({selected.length}/2)</div>
        <button className="btn btn-primary" style={{opacity: selected.length===2 ? 1 : .5}} onClick={() => selected.length===2 ? null : toast.push("비교할 이력 2개를 선택해주세요","error")}>
          <i data-lucide="git-compare" className="icon-16"></i>선택 항목 비교
        </button>
      </div>

      {compareItems.length === 2 && (
        <div className="compare-diff-panel">
          <div className="panel-title" style={{marginBottom:14}}>{compareItems[1].date} → {compareItems[0].date} 변동 비교</div>
          <div className="diff-row head"><span>항목</span><span>이전</span><span>현재</span><span>변동</span></div>
          {diffMetrics.map((m) => {
            const diff = m.b - m.a;
            return (
              <div className="diff-row" key={m.name}>
                <span>{m.name}</span><span>{m.a}점</span><span>{m.b}점</span>
                <span className={"diff-change " + (diff > 0 ? "up" : diff < 0 ? "down" : "flat")}>
                  {diff > 0 ? <i data-lucide="arrow-up" className="icon-16"></i> : diff < 0 ? <i data-lucide="arrow-down" className="icon-16"></i> : <i data-lucide="minus" className="icon-16"></i>}
                  {diff === 0 ? "변동없음" : Math.abs(diff) + "점"}
                </span>
              </div>
            );
          })}
        </div>
      )}

      <div className="data-section">
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th></th><th>진단일</th><th>점수</th><th>상태</th><th>인증</th><th>PDF</th></tr></thead>
            <tbody>
              {HISTORY.map((h) => (
                <tr key={h.id}>
                  <td onClick={() => toggle(h.id)}><input type="checkbox" checked={selected.includes(h.id)} onChange={() => toggle(h.id)} /></td>
                  <td className="strong" onClick={() => toggle(h.id)}>{h.date}</td>
                  <td onClick={() => toggle(h.id)}>{h.score}점</td>
                  <td onClick={() => toggle(h.id)}><span className={"badge " + (h.status === "완료" ? "success" : "neutral")}>{h.status}</span></td>
                  <td onClick={() => toggle(h.id)}><span className={"badge " + (h.auth === "인증완료" ? "success" : "danger")}>{h.auth}</span></td>
                  <td><button className="btn btn-secondary btn-sm" onClick={() => genPdf(h)}><i data-lucide="file-down" className="icon-16"></i>PDF</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ───────── detail modal ───────── */
function DetailModal({ item, onClose }) {
  if (!item) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div><div className="modal-title">진단 리포트 상세</div><div className="page-meta">{item.date}</div></div>
          <button className="modal-close" onClick={onClose}><i data-lucide="x" className="icon-16"></i></button>
        </div>
        <div className="modal-field-row"><span className="k">진단 점수</span><span className="v">{item.score}점</span></div>
        <div className="modal-field-row"><span className="k">상태</span><span className="v"><span className={"badge " + (item.status === "완료" ? "success" : "neutral")}>{item.status}</span></span></div>
        <div className="modal-field-row"><span className="k">인증 여부</span><span className="v"><span className={"badge " + (item.auth === "인증완료" ? "success" : "danger")}>{item.auth}</span></span></div>
        <div className="modal-field-row"><span className="k">담당자</span><span className="v">김민수</span></div>
        <div className="modal-field-row"><span className="k">메모</span><span className="v" style={{fontWeight:400, color:"var(--n7)"}}>정기 진단 — 특이사항 없음</span></div>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>닫기</button>
          <button className="btn btn-primary" onClick={onClose}><i data-lucide="file-down" className="icon-16"></i>PDF 다운로드</button>
        </div>
      </div>
    </div>
  );
}

/* ───────── app ───────── */
function App() {
  const [screen, setScreen] = useState("main");
  const [detail, setDetail] = useState(null);
  const toast = useToast();

  useEffect(() => { lucide.createIcons(); }, [screen, detail, toast.view]);

  return (
    <div className="shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="main-wrap" key={screen}>
        {screen === "main" && <MainScreen setScreen={setScreen} openDetail={setDetail} toast={toast} />}
        {screen === "auth" && <AuthScreen toast={toast} />}
        {screen === "diagnosis" && <DiagnosisScreen toast={toast} setScreen={setScreen} />}
        {screen === "history" && <HistoryScreen toast={toast} />}
      </main>
      <DetailModal item={detail} onClose={() => setDetail(null)} />
      {toast.view}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
