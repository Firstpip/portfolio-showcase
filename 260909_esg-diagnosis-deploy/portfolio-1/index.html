/* ───────── main dashboard ───────── */
const PERIODS = ["최근 5회", "최근 1년", "전체 기간"];

function periodRows(history, period) {
  const asc = [...history].sort((a, b) => a.id - b.id);
  if (period === "최근 5회") return asc.slice(-5);
  if (period === "최근 1년") { const last = asc[asc.length - 1].date; return asc.filter((h) => daysBetween(h.date, last) <= 365); }
  return asc;
}

function addMonths(dateStr, n) {
  const d = parseDate(dateStr);
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + "." + pad2(d.getMonth() + 1) + "." + pad2(d.getDate());
}

function AreaBars({ row, prev }) {
  return (
    <div className="area-bars">
      {AREAS.map((a) => {
        const d = prev ? row[a.key] - prev[a.key] : null;
        return (
          <div className="area-bar-row" key={a.key}>
            <span className="area-bar-name">{a.name}</span>
            <span className="area-bar-track"><span className="area-bar-fill" style={{ width: row[a.key] + "%" }}></span></span>
            <span className="area-bar-score">{row[a.key]}점</span>
            {d !== null && <span className={"area-bar-delta " + (d > 0 ? "up" : d < 0 ? "down" : "")}>{formatDelta(d)}</span>}
          </div>
        );
      })}
    </div>
  );
}

function MainScreen({ history, setScreen, openDetail, toast }) {
  const heroRef = useRef(null);
  const [period, setPeriod] = useState("최근 5회");
  const [periodOpen, setPeriodOpen] = useState(false);
  const [tab, setTab] = useState("all");
  const [query, setQuery] = useState("");
  const [certOnly, setCertOnly] = useState(false);
  const [over70, setOver70] = useState(false);

  const latest = history[0];
  const prev = history[1] || null;
  const trendRows = periodRows(history, period);
  const quarter = (s) => s.slice(0, 4) + "Q" + Math.ceil(Number(s.slice(5, 7)) / 3);
  const reports = history;
  const reportsThisQuarter = reports.filter((h) => quarter(h.date) === quarter(latest.date)).length;
  const newCount = history.filter((h) => h.isNew).length;
  const sinceLatest = Math.max(0, daysBetween(latest.date, todayStr()));

  useChart(heroRef, () => ({
    type: "line",
    data: {
      labels: trendRows.map((h) => h.date.slice(2, 7)),
      datasets: [{
        label: "진단 점수",
        data: trendRows.map((h) => h.score),
        borderColor: "#c1652e",
        backgroundColor: "rgba(193,101,46,0.08)",
        fill: true,
        tension: 0.35,
        pointRadius: 4,
        pointBackgroundColor: "#c1652e",
        borderWidth: 2.5,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 40, max: 100, grid: { color: "#f0f0ef" }, ticks: { color: "#989390", font:{size:11} } },
        x: { grid: { display: false }, ticks: { color: "#989390", font:{size:11} } },
      },
    },
  }), [period, history.length]);

  const filtered = history.filter((h) => {
    if (tab === "recent" && daysBetween(h.date, latest.date) > 183) return false;
    if (tab === "pending" && h.status !== "보류") return false;
    if (certOnly && h.auth !== "인증완료") return false;
    if (over70 && h.score < 70) return false;
    if (query && !h.date.includes(query.trim())) return false;
    return true;
  });

  const exportCsv = () => {
    if (!filtered.length) { toast.push("내보낼 진단 이력이 없습니다", "error"); return; }
    downloadCsv("esg-history-" + compactDate(todayStr()) + ".csv", [
      ["진단일", "총점", "환경", "사회", "거버넌스", "상태", "인증"],
      ...filtered.map((h) => [h.date, h.score, h.e, h.s, h.g, h.status, h.auth]),
    ]);
    toast.push("진단 이력 " + filtered.length + "건을 CSV로 내보냈습니다");
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div>
            <h1 className="page-title">ESG 진단 대시보드</h1>
            <div className="page-meta">{ORG_NAME} · 마지막 진단 {latest.date} · 예시 데이터</div>
          </div>
          <div className="page-actions">
            <div style={{position:"relative"}}>
              <button className="btn btn-secondary" onClick={() => setPeriodOpen(!periodOpen)} aria-expanded={periodOpen}>
                <Icon name="calendar" />{period}<Icon name="chevron-down" />
              </button>
              {periodOpen && (
                <div className="panel period-menu">
                  {PERIODS.map((p) => (
                    <button key={p} className={"sidebar-link " + (p === period ? "active" : "")} style={{width:"100%"}} onClick={() => { setPeriod(p); setPeriodOpen(false); }}>{p}</button>
                  ))}
                </div>
              )}
            </div>
            <RippleButton className="btn btn-primary" onClick={() => setScreen("diagnosis")}>
              <Icon name="plus" />새 진단 시작
            </RippleButton>
          </div>
        </div>
      </div>

      <div className="stat-row">
        <div className="stat-card">
          <div className="stat-top"><span className="stat-label">최근 진단 점수</span><div className="stat-icon-box"><Icon name="gauge" /></div></div>
          <div className="stat-body"><span className="stat-value">{latest.score}<span className="stat-unit">점</span></span><Sparkline values={[...history].sort((a, b) => a.id - b.id).slice(-8).map((h) => h.score)} /></div>
          {prev && <div className={"stat-delta " + (latest.score > prev.score ? "up" : latest.score < prev.score ? "down" : "")}><Icon name={latest.score >= prev.score ? "arrow-up-right" : "arrow-down-right"} />{formatDelta(latest.score - prev.score)} 전회 대비</div>}
        </div>
        <div className="stat-card">
          <div className="stat-top"><span className="stat-label">인증 상태</span><div className="stat-icon-box"><Icon name="shield-check" /></div></div>
          <div className="stat-body"><span className="stat-value stat-value-text">인증완료</span><Sparkline values={SPARK_B} /></div>
          <div className="stat-delta"><Icon name="check" />이메일 인증 완료</div>
        </div>
        <div className="stat-card">
          <div className="stat-top"><span className="stat-label">발급 리포트 수</span><div className="stat-icon-box"><Icon name="file-text" /></div></div>
          <div className="stat-body"><span className="stat-value">{reports.length}</span><Sparkline values={SPARK_C} /></div>
          <div className="stat-delta"><Icon name="arrow-up-right" />+{reportsThisQuarter}건 이번 분기</div>
        </div>
        <div className="stat-card">
          <div className="stat-top"><span className="stat-label">누적 진단 이력</span><div className="stat-icon-box"><Icon name="layers" /></div></div>
          <div className="stat-body"><span className="stat-value">{history.length}<span className="stat-unit">회</span></span><Sparkline values={[...history].sort((a, b) => a.id - b.id).map((h) => h.e + h.s + h.g)} /></div>
          <div className={"stat-delta " + (newCount ? "up" : "")}><Icon name={newCount ? "plus" : "minus"} />{newCount ? "+" + newCount + "회 방금 추가" : "변동 없음"}</div>
        </div>
      </div>

      <div className="insight-grid">
        <div className="panel">
          <div className="panel-head">
            <div><div className="panel-title">진단 점수 추이</div><div className="panel-sub">진단 {trendRows.length}회 · 100점 만점</div></div>
            <Icon name="trending-up" style={{color:"var(--m600)"}} />
          </div>
          <div className="chart-wrap"><canvas ref={heroRef} aria-label="진단 점수 추이 그래프"></canvas></div>
        </div>
        <div className="kpi-side">
          <div className="panel">
            <div className="panel-title" style={{marginBottom:12}}>계정 요약</div>
            <div className="status-row">
              <span className="live-dot"></span>
              <div>
                <div className="status-text">RLS 정책 적용 중</div>
                <div className="status-sub">본인 조직 데이터만 조회 가능</div>
              </div>
            </div>
            <div className="mini-info-row"><span className="mini-info-label">다음 정기 진단 예정일</span><span className="mini-info-value">{addMonths(latest.date, 3)}</span></div>
            <div className="mini-info-row"><span className="mini-info-label">담당자</span><span className="mini-info-value">{MANAGER}</span></div>
            <div className="mini-info-row"><span className="mini-info-label">가입일</span><span className="mini-info-value">2025.06.02</span></div>
            <RippleButton className="btn btn-primary" style={{marginTop:14, width:"100%", justifyContent:"center"}} onClick={() => setScreen("diagnosis")}>
              <Icon name="zap" />빠른 진단 시작
            </RippleButton>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="panel">
          <div className="panel-title" style={{marginBottom:4}}>영역별 점수</div>
          <div className="panel-sub" style={{marginBottom:14}}>최근 진단 {latest.date} · 전회 대비 변동</div>
          <AreaBars row={latest} prev={prev} />
        </div>
        <div className="panel">
          <div className="panel-title" style={{marginBottom:12}}>최근 활동 타임라인</div>
          <div className="timeline">
            {latest.isNew && <div className="timeline-item"><span className="timeline-dot ok"></span><div><div className="timeline-text">진단 리포트 #{history.length} 생성 완료 ({latest.score}점)</div><div className="timeline-time">방금 전 · 화면 데모에서 입력</div></div></div>}
            <div className="timeline-item"><span className="timeline-dot ok"></span><div><div className="timeline-text">진단 리포트 #6 생성 완료</div><div className="timeline-time">2026.08.28 · 14:20</div></div></div>
            <div className="timeline-item"><span className="timeline-dot"></span><div><div className="timeline-text">담당자 이메일 재인증</div><div className="timeline-time">2026.08.20 · 09:41</div></div></div>
            <div className="timeline-item"><span className="timeline-dot ok"></span><div><div className="timeline-text">PDF 리포트 다운로드</div><div className="timeline-time">2026.06.14 · 17:02</div></div></div>
          </div>
        </div>
        <div className="panel">
          <div className="quickstart-card">
            <div className="quickstart-icon"><Icon name="rocket" /></div>
            <div style={{fontSize:14, fontWeight:700, color:"var(--n10)"}}>재진단이 필요하신가요?</div>
            <div style={{fontSize:12.5, color:"var(--n6)", lineHeight:1.5}}>마지막 진단 뒤 {sinceLatest}일이 지났습니다. 90일이 지나면 재진단을 권장합니다.</div>
            <RippleButton className="btn btn-secondary" onClick={() => setScreen("diagnosis")}>진단 시작하기<Icon name="arrow-right" /></RippleButton>
          </div>
        </div>
      </div>

      <div className="data-section">
        <div className="tab-bar" data-tabs>
          <button className={"tab " + (tab === "all" ? "active" : "")} onClick={() => setTab("all")}>전체</button>
          <button className={"tab " + (tab === "recent" ? "active" : "")} onClick={() => setTab("recent")}>최근 6개월</button>
          <button className={"tab " + (tab === "pending" ? "active" : "")} onClick={() => setTab("pending")}>보류</button>
        </div>
        <div className="data-toolbar">
          <input className="search-input" placeholder="진단일자로 검색…" aria-label="진단일자로 검색" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button className={"filter-chip " + (certOnly ? "active" : "")} aria-pressed={certOnly} onClick={() => setCertOnly(!certOnly)}>인증완료</button>
          <button className={"filter-chip " + (over70 ? "active" : "")} aria-pressed={over70} onClick={() => setOver70(!over70)}>70점 이상</button>
          <button className="export-btn" onClick={exportCsv}><Icon name="download" />내보내기</button>
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>진단일</th><th>점수</th><th>환경·사회·거버넌스</th><th>상태</th><th>인증</th><th></th></tr></thead>
            <tbody>
              {filtered.map((h) => (
                <tr key={h.id} onClick={() => openDetail(h)}>
                  <td className="strong">{h.date}{h.isNew && <span className="badge new">새 진단</span>}</td>
                  <td>{h.score}점</td>
                  <td className="area-mini">{h.e} · {h.s} · {h.g}</td>
                  <td><span className={"badge " + (h.status === "완료" ? "success" : "neutral")}>{h.status}</span></td>
                  <td><span className={"badge " + (h.auth === "인증완료" ? "success" : "danger")}>{h.auth}</span></td>
                  <td><button className="row-more" aria-label={h.date + " 상세 보기"} onClick={(e) => { e.stopPropagation(); openDetail(h); }}>⋯</button></td>
                </tr>
              ))}
              {!filtered.length && <tr className="empty-row"><td colSpan="6">조건에 맞는 진단 이력이 없습니다</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
/* ───────── auth screen ───────── */
const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
const pwOk = (v) => v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v);

// 예외 처리 시나리오: 공고의 인증 실패, 세션 만료 안내를 화면에서 그대로 보여준다
const AUTH_BANNERS = {
  expired:    { icon: "triangle-alert", text: "인증 링크가 만료되었습니다. 인증 메일을 다시 받아 주세요.", action: "인증 메일 다시 받기" },
  duplicate:  { icon: "triangle-alert", text: "이미 가입된 이메일입니다. 로그인해 주세요.", action: "로그인으로 이동" },
  session:    { icon: "clock", text: "세션이 만료되었습니다. 보안을 위해 다시 로그인해 주세요. 작성 중이던 진단 입력은 이 브라우저에 임시 저장되어 있습니다.", action: "다시 로그인" },
  loginFail:  { icon: "circle-alert", text: "이메일 또는 비밀번호가 올바르지 않습니다. 다시 확인해 주세요.", action: null },
  unverified: { icon: "mail", text: "이메일 인증을 마친 뒤 로그인할 수 있습니다. 받은 메일의 인증 링크를 눌러 주세요.", action: "인증 메일 다시 받기" },
};

function Field({ id, label, req, error, hint, ...input }) {
  return (
    <div className="field">
      <label className="field-label" htmlFor={id}>{label}{req && <span className="req">*</span>}</label>
      <input id={id} className={"field-input " + (error ? "has-error" : "")} aria-invalid={!!error} {...input} />
      {error ? <div className="field-error">{error}</div> : hint ? <div className="field-hint">{hint}</div> : null}
    </div>
  );
}

function AuthScreen({ toast, setScreen }) {
  const [mode, setMode] = useState("signup");
  const [form, setForm] = useState({ org:"", name:"", email:"", pw:"" });
  const [errors, setErrors] = useState({});
  const [login, setLogin] = useState({ email:"", pw:"" });
  const [loginErrors, setLoginErrors] = useState({});
  const [sent, setSent] = useState(false);
  const [verified, setVerified] = useState(false);
  const [cooldown, setCooldown] = useState(0);
  const [errType, setErrType] = useState(null);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown((c) => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  const switchMode = (m) => { setMode(m); setErrType(null); };

  const handleSignup = () => {
    const errs = {};
    if (!form.org.trim()) errs.org = "기관명을 입력해 주세요";
    if (!form.name.trim()) errs.name = "담당자명을 입력해 주세요";
    if (!emailOk(form.email)) errs.email = form.email ? "이메일 형식이 올바르지 않습니다" : "이메일을 입력해 주세요";
    if (!pwOk(form.pw)) errs.pw = "영문과 숫자를 섞어 8자 이상 입력해 주세요";
    setErrors(errs);
    if (Object.keys(errs).length) { toast.push("입력 내용을 확인해 주세요", "error"); return; }
    setSent(true);
    setErrType(null);
    setCooldown(60);
    toast.push(form.email.trim() + " 주소로 인증 메일을 발송했습니다");
  };

  const resend = () => {
    if (cooldown > 0) return;
    setSent(true);
    setErrType(null);
    setCooldown(60);
    toast.push("인증 메일을 다시 보냈습니다. 60초 뒤에 다시 요청할 수 있습니다");
  };

  const confirmVerify = () => {
    setVerified(true);
    setErrType(null);
    toast.push("이메일 인증이 완료되었습니다");
  };

  const handleLogin = () => {
    const errs = {};
    if (!emailOk(login.email)) errs.email = login.email ? "이메일 형식이 올바르지 않습니다" : "이메일을 입력해 주세요";
    if (!login.pw) errs.pw = "비밀번호를 입력해 주세요";
    setLoginErrors(errs);
    if (Object.keys(errs).length) return;
    setErrType(null);
    toast.push("로그인 되었습니다");
    setScreen("main");
  };

  const bannerAction = () => {
    if (errType === "duplicate" || errType === "session") { setLogin({ ...login, email: login.email || form.email }); switchMode("login"); return; }
    resend();
  };

  const banner = errType && AUTH_BANNERS[errType];

  return (
    <div>
      <div className="page-header">
        <h1 className="page-title">회원가입·이메일 인증</h1>
        <div className="page-meta">이메일 인증을 완료해야 진단 기능을 이용할 수 있습니다</div>
      </div>
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-tabs">
            <button className={"auth-tab " + (mode === "signup" ? "active" : "")} onClick={() => switchMode("signup")}>회원가입</button>
            <button className={"auth-tab " + (mode === "login" ? "active" : "")} onClick={() => switchMode("login")}>로그인</button>
          </div>

          {banner && (
            <div className="error-banner" role="alert" key={errType}>
              <Icon name={banner.icon} />
              <div className="error-banner-text">
                {banner.text}
                {banner.action && <button className="banner-action" onClick={bannerAction}>{banner.action}</button>}
              </div>
            </div>
          )}
          {verified && !banner && (
            <div className="success-banner" role="status">
              <Icon name="circle-check-big" />
              <div className="success-banner-text">
                이메일 인증을 완료했습니다. 이제 진단 기능을 이용할 수 있습니다.
                <button className="banner-action" onClick={() => setScreen("diagnosis")}>진단 시작</button>
              </div>
            </div>
          )}

          {mode === "signup" ? (
            <React.Fragment>
              <Field id="su-org" label="기관명" req error={errors.org} placeholder="예: 샘플기업 사회적협동조합" value={form.org} onChange={(e) => setForm({ ...form, org: e.target.value })} />
              <Field id="su-name" label="담당자명" req error={errors.name} placeholder="예: 김민수" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
              <Field id="su-email" label="이메일" req error={errors.email} type="email" autoComplete="email" placeholder="name@organization.kr" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
              <Field id="su-pw" label="비밀번호" req error={errors.pw} hint="영문, 숫자를 포함해 8자 이상 입력해주세요" type="password" autoComplete="new-password" placeholder="8자 이상" value={form.pw} onChange={(e) => setForm({ ...form, pw: e.target.value })} />
              {!sent ? (
                <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center", marginTop:6}} onClick={handleSignup}>가입하고 인증 메일 받기</RippleButton>
              ) : (
                <div className="verify-box">
                  <Icon name="mail-check" />
                  <div>
                    <div style={{fontSize:13, fontWeight:600, color:"var(--n10)"}}>{verified ? "이메일 인증 완료" : "인증 메일을 확인해주세요"}</div>
                    <div style={{fontSize:12, color:"var(--n7)", margin:"4px 0 10px", lineHeight:1.5}}>{form.email.trim() || "name@organization.kr"} 주소로 링크를 보냈습니다. 메일이 보이지 않으면 스팸함을 확인해 주세요.</div>
                    <div className="demo-row">
                      {!verified && <button className="btn btn-secondary btn-sm" onClick={confirmVerify}>인증 확인 (데모)</button>}
                      {!verified && <button className="btn btn-ghost btn-sm" disabled={cooldown > 0} onClick={resend}><Icon name="rotate-ccw" />{cooldown > 0 ? "다시 보내기 " + cooldown + "초" : "인증 메일 다시 보내기"}</button>}
                    </div>
                  </div>
                </div>
              )}
            </React.Fragment>
          ) : (
            <React.Fragment>
              <Field id="li-email" label="이메일" error={loginErrors.email} type="email" autoComplete="email" placeholder="name@organization.kr" value={login.email} onChange={(e) => setLogin({ ...login, email: e.target.value })} />
              <Field id="li-pw" label="비밀번호" error={loginErrors.pw} type="password" autoComplete="current-password" placeholder="비밀번호" value={login.pw} onChange={(e) => setLogin({ ...login, pw: e.target.value })} />
              <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={handleLogin}>로그인</RippleButton>
            </React.Fragment>
          )}

          <div className="demo-controls">
            <div className="demo-controls-title">예외 처리 시나리오 데모</div>
            <div className="demo-row">
              <button className="btn btn-secondary btn-sm" onClick={() => { switchMode("signup"); setErrType("expired"); }}>만료된 링크</button>
              <button className="btn btn-secondary btn-sm" onClick={() => { switchMode("signup"); setErrType("duplicate"); }}>중복 가입</button>
              <button className="btn btn-secondary btn-sm" onClick={() => { switchMode("login"); setErrType("loginFail"); }}>로그인 실패</button>
              <button className="btn btn-secondary btn-sm" onClick={() => { switchMode("login"); setErrType("unverified"); }}>미인증 계정</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setErrType("session")}>세션 만료</button>
            </div>
            <div className="demo-controls-note">저장 오류는 진단 항목 입력 화면의 저장 오류 시연으로 확인할 수 있습니다.</div>
          </div>
        </div>
      </div>
    </div>
  );
}
/* ───────── diagnosis screen ───────── */
const DRAFT_KEY = "greengauge-demo-diagnosis-draft";
const defaultScores = () => { const s = {}; DIAG_GROUPS.forEach((g) => g.items.forEach((it) => (s[it.key] = 50))); return s; };
const requiredItems = DIAG_GROUPS.flatMap((g) => g.items.filter((i) => i.req));
function readDraft() {
  try { const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); return d && d.scores ? d : null; } catch (e) { return null; }
}
function gapsOf(scores, evidence) {
  return DIAG_GROUPS.flatMap((g) => g.items)
    .filter((it) => evidence[it.key] === "없음" || scores[it.key] < 50)
    .sort((a, b) => scores[a.key] - scores[b.key])
    .map((it) => ({ key: it.key, name: it.name, score: scores[it.key],
      reason: [evidence[it.key] === "없음" ? "근거 문서 없음" : null, scores[it.key] < 50 ? "50점 미만" : null].filter(Boolean).join(", ") }));
}

function ResultView({ result, toast, setScreen, onNew }) {
  const barRef = useRef(null);
  const { row, prev, areas, scores, evidence } = result;
  const gaps = gapsOf(scores, evidence);
  const items = DIAG_GROUPS.flatMap((g) => g.items);

  useChart(barRef, () => ({
    type: "bar",
    data: {
      labels: items.map((i) => i.short),
      datasets: [{ data: items.map((i) => scores[i.key]), backgroundColor: items.map((i) => (evidence[i.key] === "해당없음" ? "#bab7b5" : "#c1652e")), borderRadius: 6, maxBarThickness: 22 }],
    },
    options: {
      indexAxis: "y", responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{ min:0, max:100, grid:{color:"#f0f0ef"}, ticks:{color:"#989390",font:{size:10}} }, y:{ grid:{display:false}, ticks:{color:"#5a5653",font:{size:11}} } },
    },
  }), [result]);

  const genPdf = () => {
    try {
      const doc = window.EsgPdf.report({
        org: ORG_NAME, date: row.date, total: row.score,
        requiredDone: requiredItems.filter((i) => evidence[i.key]).length, requiredTotal: requiredItems.length,
        prev: prev ? { date: prev.date, score: prev.score } : null,
        areas: areas.map((a) => ({ name: a.name, score: a.score })),
        groups: DIAG_GROUPS.map((g) => ({ title: g.title, items: g.items.map((it) => ({ name: it.name, score: scores[it.key], evidence: evidence[it.key] })) })),
        gaps: gaps.map((g) => ({ name: g.name, reason: g.reason })),
      });
      doc.save("esg-diagnosis-report-" + compactDate(row.date) + ".pdf");
      toast.push("PDF 리포트를 저장했습니다");
    } catch (e) { toast.push("PDF 생성 중 문제가 발생했습니다", "error"); }
  };

  return (
    <div className="result-view">
      <div className="print-only print-head">GreenGauge ESG·사회적가치 진단 리포트 · {ORG_NAME} · {row.date} 진단</div>
      <div className="page-header">
        <h1 className="page-title">진단 결과 리포트</h1>
        <div className="page-meta">{ORG_NAME} · {row.date} 진단 · 이력에 저장됨</div>
      </div>
      <div className="insight-grid">
        <div className="panel">
          <div className="panel-head">
            <div><div className="panel-title">항목별 점수</div><div className="panel-sub">회색 막대는 해당 없음으로 표시한 항목</div></div>
          </div>
          <div className="chart-wrap"><canvas ref={barRef} aria-label="항목별 점수 그래프"></canvas></div>
        </div>
        <div className="panel result-total">
          <div className="panel-title">총점</div>
          <div className="result-score">{row.score}<span>/100</span></div>
          {prev && <div className={"result-delta " + (row.score > prev.score ? "up" : row.score < prev.score ? "down" : "")}>직전 진단 {prev.date} {prev.score}점 대비 {formatDelta(row.score - prev.score)}</div>}
          <AreaBars row={row} prev={prev} />
          <div className="page-actions" style={{justifyContent:"center", marginTop:18}}>
            <button className="btn btn-secondary" onClick={() => window.print()}><Icon name="printer" />인쇄</button>
            <RippleButton className="btn btn-primary" onClick={genPdf}><Icon name="file-down" />PDF 저장</RippleButton>
          </div>
        </div>
      </div>
      <div className="panel gap-panel">
        <div className="panel-title" style={{marginBottom:4}}>보완을 권장하는 항목</div>
        <div className="panel-sub" style={{marginBottom:12}}>근거 없음으로 표시했거나 50점 미만인 항목입니다. 다음 진단 전에 근거 문서를 준비하면 됩니다.</div>
        {gaps.length ? gaps.map((g) => (
          <div className="gap-row" key={g.key}><span className="gap-name">{g.name}</span><span className="gap-score">{g.score}점</span><span className="badge danger">{g.reason}</span></div>
        )) : <div className="gap-empty">보완을 권장하는 항목이 없습니다.</div>}
      </div>
      <div className="result-actions">
        <button className="btn btn-secondary" onClick={() => setScreen("history")}><Icon name="history" />진단 이력으로 이동</button>
        <button className="btn btn-ghost" onClick={onNew}><Icon name="plus" />새 진단 입력</button>
      </div>
      <div className="print-only print-foot">데모 데이터로 만든 예시 화면입니다.</div>
    </div>
  );
}

function DiagnosisScreen({ toast, setScreen, history, addHistory }) {
  const draft = useRef(readDraft());
  const [scores, setScores] = useState(() => ({ ...defaultScores(), ...(draft.current ? draft.current.scores : {}) }));
  const [evidence, setEvidence] = useState(() => (draft.current ? draft.current.evidence || {} : {}));
  const [restored, setRestored] = useState(!!draft.current);
  const [savedAt, setSavedAt] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [attemptedSubmit, setAttemptedSubmit] = useState(false);
  const [failNext, setFailNext] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [result, setResult] = useState(null);
  const skipSave = useRef(true);

  const missing = requiredItems.filter((i) => !evidence[i.key]);
  const filledCount = requiredItems.length - missing.length;
  const canSubmit = missing.length === 0;
  const totalScore = avg(Object.values(scores));

  // 입력 중 임시 저장: 세션이 끊기거나 새로고침해도 입력이 남는다(데모는 이 브라우저 탭에만 보관)
  useEffect(() => {
    if (skipSave.current) { skipSave.current = false; return; }
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ scores, evidence })); } catch (e) {}
    const d = new Date();
    setSavedAt(pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()));
  }, [scores, evidence]);

  const resetInput = () => {
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    skipSave.current = true;
    setScores(defaultScores()); setEvidence({}); setAttemptedSubmit(false); setRestored(false); setSavedAt(null); setSaveError(false);
    toast.push("입력 내용을 초기화했습니다");
  };

  const handleSubmit = () => {
    setAttemptedSubmit(true);
    if (!canSubmit) {
      toast.push("필수 진단 항목의 근거 여부를 모두 선택해주세요", "error");
      setTimeout(() => { const el = document.getElementById("diag-" + missing[0].key); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
      return;
    }
    setSaveError(false);
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      if (failNext) {
        setFailNext(false);
        setSaveError(true);
        toast.push("저장하지 못했습니다. 입력 내용은 임시 저장되어 있습니다", "error");
        return;
      }
      const areas = DIAG_GROUPS.map((g) => ({ key: g.area, name: g.name, score: avg(g.items.map((i) => scores[i.key])) }));
      const row = { id: Math.max(...history.map((h) => h.id)) + 1, date: todayStr(), score: totalScore, e: areas[0].score, s: areas[1].score, g: areas[2].score,
        status: "완료", auth: "인증완료", memo: "화면 데모에서 입력한 진단", isNew: true };
      const prev = history[0] || null;
      addHistory(row);
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      setResult({ row, prev, areas, scores: { ...scores }, evidence: { ...evidence } });
      toast.push("진단이 완료되어 결과 리포트가 생성되었습니다");
    }, 1500);
  };

  const startNew = () => {
    skipSave.current = true;
    setResult(null); setScores(defaultScores()); setEvidence({}); setAttemptedSubmit(false); setRestored(false); setSavedAt(null);
  };

  if (result) return <ResultView result={result} toast={toast} setScreen={setScreen} onNew={startNew} />;

  return (
    <div>
      <div className="page-header">
        <div className="page-title-row">
          <div>
            <h1 className="page-title">진단 항목 입력·리포트 생성</h1>
            <div className="page-meta">필수 항목 {requiredItems.length}개 중 {filledCount}개 근거 확인 완료</div>
          </div>
        </div>
        <div className="progress-track"><div className="progress-fill" style={{ width: (filledCount / requiredItems.length * 100) + "%" }}></div></div>
      </div>

      {restored && !saveError && (
        <div className="info-banner" role="status">
          <Icon name="save" />
          <div className="info-banner-text">이전에 입력하던 내용을 임시 저장본에서 불러왔습니다.<button className="banner-action" onClick={resetInput}>처음부터 입력</button></div>
        </div>
      )}
      {saveError && (
        <div className="error-banner" role="alert">
          <Icon name="wifi-off" />
          <div className="error-banner-text">
            진단 결과를 저장하지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도해 주세요. 입력한 내용은 이 브라우저에 임시 저장되어 있어 사라지지 않습니다.
            <button className="banner-action" onClick={handleSubmit}>다시 시도</button>
          </div>
        </div>
      )}

      {submitting ? (
        <div className="loading-wrap"><div className="spinner"></div><div className="loading-text">진단 항목을 채점하고 저장하는 중입니다…</div></div>
      ) : (
        <div className="diag-layout">
          <div>
            {DIAG_GROUPS.map((g) => (
              <div className="diag-group" key={g.key}>
                <div className="diag-group-head"><div className="diag-group-badge">{g.key}</div><div className="diag-group-title">{g.title}</div></div>
                {g.items.map((it) => {
                  const invalid = attemptedSubmit && it.req && !evidence[it.key];
                  return (
                    <div className={"diag-item " + (invalid ? "invalid" : "")} key={it.key} id={"diag-" + it.key}>
                      <div className="diag-item-top">
                        <span className="diag-item-name">{it.name}{it.req && <span className="req">*</span>}</span>
                        <span className="diag-item-score">{scores[it.key]}</span>
                      </div>
                      <input type="range" min="0" max="100" className="slider" aria-label={it.name + " 점수"} value={scores[it.key]} onChange={(e) => setScores({ ...scores, [it.key]: Number(e.target.value) })} />
                      <div className="diag-sub-row">
                        <select className="diag-select" aria-label={it.name + " 문서 근거 여부"} value={evidence[it.key] || ""} onChange={(e) => setEvidence({ ...evidence, [it.key]: e.target.value })}>
                          <option value="">문서 근거 여부 선택</option>
                          <option value="있음">근거 있음</option>
                          <option value="없음">근거 없음</option>
                          <option value="해당없음">해당 없음</option>
                        </select>
                        {invalid && <span className="field-error">필수 항목입니다</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="sticky-panel">
            <div className="panel">
              <div className="panel-title" style={{marginBottom:10}}>현재 예상 점수</div>
              <div style={{fontSize:36, fontWeight:800, color:"var(--n10)"}}>{totalScore}<span style={{fontSize:15,color:"var(--n6)"}}>/100</span></div>
              <div className="mini-info-row"><span className="mini-info-label">필수 항목 완료</span><span className="mini-info-value">{filledCount}/{requiredItems.length}</span></div>
              <div className="mini-info-row"><span className="mini-info-label">임시 저장</span><span className="mini-info-value">{savedAt ? savedAt + " 저장됨" : "입력하면 자동 저장"}</span></div>
              <RippleButton className="btn btn-primary" style={{width:"100%", justifyContent:"center", marginTop:14, opacity: canSubmit ? 1 : .5}} onClick={handleSubmit}>
                <Icon name="send" />제출하고 리포트 생성
              </RippleButton>
              <button className="btn btn-ghost btn-sm" style={{width:"100%", justifyContent:"center", marginTop:8}} onClick={resetInput}><Icon name="eraser" />입력 초기화</button>
              <div className="demo-controls">
                <div className="demo-controls-title">예외 처리 시나리오 데모</div>
                <label className="demo-toggle"><input type="checkbox" checked={failNext} onChange={(e) => setFailNext(e.target.checked)} />저장 오류 시연</label>
                <div className="demo-controls-note">켜고 제출하면 저장 실패 안내와 다시 시도 흐름이 나옵니다.</div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
/* ───────── history screen ───────── */
const AREA_LABEL = { e: "환경(E)", s: "사회(S)", g: "거버넌스(G)" };

function HistoryScreen({ toast, history }) {
  // 방금 진단을 마치고 왔다면 새 진단과 직전 진단을 바로 비교해 보여준다
  const [selected, setSelected] = useState(() => (history[0] && history[0].isNew && history[1] ? [history[1].id, history[0].id] : []));
  const panelRef = useRef(null);
  const toggle = (id) => {
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length >= 2 ? [s[1], id] : [...s, id]));
  };
  const pair = history.filter((h) => selected.includes(h.id)).sort((a, b) => a.id - b.id);
  const metrics = pair.length === 2
    ? [{ name: "총점", a: pair[0].score, b: pair[1].score }, ...AREAS.map((ar) => ({ name: AREA_LABEL[ar.key], a: pair[0][ar.key], b: pair[1][ar.key] }))]
    : [];

  const compare = () => {
    if (pair.length !== 2) { toast.push("비교할 이력 2개를 선택해주세요", "error"); return; }
    if (panelRef.current) panelRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  return (
    <div>
      <div className="page-header">
        <h1 className="page-title">진단 이력 비교·PDF 출력</h1>
        <div className="page-meta">과거 진단 결과를 비교하고 PDF로 저장할 수 있습니다</div>
      </div>

      <div className="rls-banner"><Icon name="lock" /><span className="rls-banner-text">Row Level Security 정책에 따라 {ORG_NAME}의 진단 이력만 조회됩니다</span></div>

      <div className="hist-toolbar">
        <div style={{fontSize:12.5, color:"var(--n6)"}}>비교할 이력 2개를 선택하세요 ({selected.length}/2)</div>
        <button className="btn btn-primary" style={{opacity: pair.length === 2 ? 1 : .5}} onClick={compare}>
          <Icon name="git-compare" />선택 항목 비교
        </button>
      </div>

      {pair.length === 2 && (
        <div className="compare-diff-panel" ref={panelRef} key={pair[0].id + "-" + pair[1].id}>
          <div className="panel-title" style={{marginBottom:4}}>{pair[0].date} 대비 {pair[1].date} 변동 비교</div>
          <div className="panel-sub" style={{marginBottom:12}}>두 진단 사이 {daysBetween(pair[0].date, pair[1].date)}일{pair[1].isNew ? " · 방금 입력한 진단 포함" : ""}</div>
          <div className="diff-row head"><span>항목</span><span>이전</span><span>현재</span><span>변동</span></div>
          {metrics.map((m) => {
            const diff = m.b - m.a;
            return (
              <div className="diff-row" key={m.name}>
                <span>{m.name}</span><span>{m.a}점</span><span>{m.b}점</span>
                <span className={"diff-change " + (diff > 0 ? "up" : diff < 0 ? "down" : "flat")}>
                  <Icon name={diff > 0 ? "arrow-up" : diff < 0 ? "arrow-down" : "minus"} />
                  {diff === 0 ? "변동없음" : Math.abs(diff) + "점"}
                </span>
              </div>
            );
          })}
        </div>
      )}

      <div className="data-section">
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th><span className="sr-only">선택</span></th><th>진단일</th><th>점수</th><th>환경·사회·거버넌스</th><th>상태</th><th>인증</th><th>PDF</th></tr></thead>
            <tbody>
              {history.map((h) => {
                const on = selected.includes(h.id);
                return (
                  <tr key={h.id} className={on ? "selected" : ""}>
                    <td onClick={() => toggle(h.id)}><input type="checkbox" aria-label={h.date + " 비교 선택"} checked={on} onClick={(e) => e.stopPropagation()} onChange={() => toggle(h.id)} /></td>
                    <td className="strong" onClick={() => toggle(h.id)}>{h.date}{h.isNew && <span className="badge new">새 진단</span>}</td>
                    <td onClick={() => toggle(h.id)}>{h.score}점</td>
                    <td className="area-mini" onClick={() => toggle(h.id)}>{h.e} · {h.s} · {h.g}</td>
                    <td onClick={() => toggle(h.id)}><span className={"badge " + (h.status === "완료" ? "success" : "neutral")}>{h.status}</span></td>
                    <td onClick={() => toggle(h.id)}><span className={"badge " + (h.auth === "인증완료" ? "success" : "danger")}>{h.auth}</span></td>
                    <td><button className="btn btn-secondary btn-sm" onClick={() => saveHistoryPdf(history, h, toast)}><Icon name="file-down" />PDF</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ───────── detail modal ───────── */
function DetailModal({ item, history, onClose, toast }) {
  useEffect(() => {
    if (!item) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [item]);
  if (!item) return null;
  const prev = previousOf(history, item);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal-card" role="dialog" aria-modal="true" aria-labelledby="detail-title" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div><div className="modal-title" id="detail-title">진단 리포트 상세</div><div className="page-meta">{item.date}</div></div>
          <button className="modal-close" aria-label="닫기" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="modal-field-row"><span className="k">진단 점수</span><span className="v">{item.score}점{prev && <span className={"modal-delta " + (item.score > prev.score ? "up" : item.score < prev.score ? "down" : "")}>{formatDelta(item.score - prev.score)}</span>}</span></div>
        {AREAS.map((a) => (
          <div className="modal-field-row" key={a.key}><span className="k">{AREA_LABEL[a.key]}</span><span className="v">{item[a.key]}점{prev && <span className={"modal-delta " + (item[a.key] > prev[a.key] ? "up" : item[a.key] < prev[a.key] ? "down" : "")}>{formatDelta(item[a.key] - prev[a.key])}</span>}</span></div>
        ))}
        <div className="modal-field-row"><span className="k">상태</span><span className="v"><span className={"badge " + (item.status === "완료" ? "success" : "neutral")}>{item.status}</span></span></div>
        <div className="modal-field-row"><span className="k">인증 여부</span><span className="v"><span className={"badge " + (item.auth === "인증완료" ? "success" : "danger")}>{item.auth}</span></span></div>
        <div className="modal-field-row"><span className="k">담당자</span><span className="v">{MANAGER}</span></div>
        <div className="modal-field-row"><span className="k">메모</span><span className="v" style={{fontWeight:400, color:"var(--n7)"}}>{item.memo}</span></div>
        {prev && <div className="modal-note">변동은 직전 진단 {prev.date} 대비입니다.</div>}
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>닫기</button>
          <button className="btn btn-primary" onClick={() => { saveHistoryPdf(history, item, toast); onClose(); }}><Icon name="file-down" />PDF 다운로드</button>
        </div>
      </div>
    </div>
  );
}

/* ───────── app ───────── */
function App() {
  const [screen, setScreen] = useState("main");
  const [detail, setDetail] = useState(null);
  const [history, setHistory] = useState(HISTORY_SEED);
  const toast = useToast();
  const addHistory = (row) => setHistory((h) => [row, ...h]);

  useEffect(() => { window.scrollTo(0, 0); }, [screen]);

  return (
    <div className="shell" data-archetype="stripe-multipane">
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="main-wrap" key={screen}>
        {screen === "main" && <MainScreen history={history} setScreen={setScreen} openDetail={setDetail} toast={toast} />}
        {screen === "auth" && <AuthScreen toast={toast} setScreen={setScreen} />}
        {screen === "diagnosis" && <DiagnosisScreen toast={toast} setScreen={setScreen} history={history} addHistory={addHistory} />}
        {screen === "history" && <HistoryScreen toast={toast} history={history} />}
      </main>
      <DetailModal item={detail} history={history} onClose={() => setDetail(null)} toast={toast} />
      {toast.view}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
