<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중기관 ESG 비교·분석 플랫폼 화면 데모</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232b59d1'/%3E%3Cpath d='M8 21l6-6 4 4 7-8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@8.0.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 223°, light) ── */
:root{
  --m50:#f0f3fc; --m100:#e1e8f9; --m200:#c4d1f2; --m300:#a0b4ea; --m400:#7795e2;
  --m500:#5177d9; --m600:#2b59d1; --m700:#2349ab; --m800:#1c3986; --m900:#13285e;
  --n0:#f6f3f1; --n1:#f7f7f8; --n2:#efeff0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b6ba; --n6:#909298; --n7:#797776; --n8:#53555a; --n9:#36373a; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n9);
  -webkit-font-smoothing: antialiased;
}
#app { width: 100%; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--n4); border-radius: 8px; }

/* ── keyframes ── */
@keyframes fadeInUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
@keyframes tileStagger { from { opacity:0; transform: scale(.96); } to { opacity:1; transform: scale(1); } }
@keyframes shimmerFlat { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
@keyframes pulseLive { 0%,100% { opacity:1; } 50% { opacity:.35; } }
@keyframes dashGrow { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
@keyframes spin2 { to { transform: rotate(360deg); } }

/* ── shell (topnav-hero) ── */
.shell2 { width:100%; min-height:100vh; display:flex; flex-direction:column; }
.topnav {
  width:100%; height:72px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; border-bottom:1px solid var(--n3); background:var(--n1); position:sticky; top:0; z-index:50;
}
.topnav-left { display:flex; align-items:center; gap:12px; }
.brand2-mark { width:36px; height:36px; border-radius:12px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff; }
.brand2-name { font-size:15px; font-weight:700; color:var(--n10); }
.brand2-sub { font-size:11px; color:var(--n7); }
.topnav-nav { display:flex; align-items:center; gap:4px; }
.nav-link2 { padding:9px 16px; border-radius:100px; font-size:13.5px; font-weight:600; color:var(--n7); white-space:nowrap; }
.nav-link2:hover { color:var(--n10); background:var(--n2); }
.nav-link2.active { color:#fff; background:var(--m600); }
.topnav-right { display:flex; align-items:center; gap:10px; }
.avatar2 { width:34px; height:34px; border-radius:50%; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:1px solid var(--n4); }

.main2 { flex:1; width:100%; padding: 30px 40px 70px; max-width:1432px; margin:0 auto; animation: fadeInUp .4s ease both; }

.btn2 { display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; padding:11px 20px; border-radius:100px; transition: background .15s, border-color .15s, transform .1s; white-space:nowrap; }
.btn2:active { transform: scale(.97); }
.btn2-primary { background: var(--m600); color:#fff; }
.btn2-primary:hover { background: var(--m700); }
.btn2-secondary { background:transparent; color:var(--n9); border:1px solid var(--n8); }
.btn2-secondary:hover { background: var(--n2); }
.btn2-ghost { background:transparent; color:var(--n7); border:1px solid transparent; }
.btn2-ghost:hover { color:var(--n9); border-color:var(--n4); }
.btn2-sm { padding:7px 14px; font-size:12.5px; }

.page-head2 { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
.page-title2 { font-size:40px; font-weight:700; color:var(--n10); letter-spacing:-.8px; margin:0; }
.page-sub2 { font-size:12.5px; color:var(--n7); margin-top:6px; }

/* ── bento grid (archetype signature) ── */
.bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(172px, auto); gap:18px; margin-bottom:24px; }
.tile { background:var(--n1); border:1px solid var(--n4); border-radius:24px; padding:26px; transition: border-color .15s, transform .15s; animation: tileStagger .4s ease both; position:relative; overflow:hidden; }
.tile:hover { border-color:var(--m400); transform: scale(1.015); }
.tile.feature { grid-column:span 2; grid-row:span 2; min-height:380px; display:flex; flex-direction:column; }
.tile-glow { position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, var(--m200) 0%, transparent 72%); opacity:.55; pointer-events:none; }
.tile.metric { display:flex; flex-direction:column; justify-content:space-between; min-height:140px; }
.tile.wide { grid-column:span 2; }
.tile:nth-child(2){animation-delay:.05s} .tile:nth-child(3){animation-delay:.1s} .tile:nth-child(4){animation-delay:.15s} .tile:nth-child(5){animation-delay:.2s}
.tile-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.tile-title { font-size:14px; font-weight:700; color:var(--n10); }
.tile-icon { width:34px; height:34px; border-radius:10px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-size:17px; }
.tile .num { font-size:34px; font-weight:800; color:var(--n10); letter-spacing:-.5px; }
.tile .lbl { font-size:12.5px; color:var(--n7); margin-top:4px; }
.tile-delta { font-size:12px; font-weight:600; margin-top:8px; display:flex; align-items:center; gap:3px; }
.tile-delta.up { color:var(--s1-text); } .tile-delta.down { color:var(--s2-text); }
.chart-box { position:relative; width:100%; height:100%; min-height:180px; flex:1; }
.chart-box.sm { min-height:120px; }

.rank-list { display:flex; flex-direction:column; gap:0; }
.rank-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--n3); }
.rank-item:last-child { border-bottom:none; }
.rank-num { width:22px; height:22px; border-radius:50%; background:var(--n2); color:var(--n8); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rank-name { font-size:13px; font-weight:600; color:var(--n9); flex:1; }
.rank-score { font-size:13px; font-weight:700; color:var(--n9); }

.timeline2 { display:flex; flex-direction:column; }
.timeline2-item { display:flex; gap:10px; padding:8px 0; }
.timeline2-dot { width:7px; height:7px; border-radius:50%; background:var(--n5); margin-top:6px; flex-shrink:0; }
.timeline2-dot.warn { background:var(--s3); }
.timeline2-dot.live { background:var(--s1); animation: pulseLive 1.6s infinite; }
.timeline2-text { font-size:12.5px; color:var(--n8); }
.timeline2-time { font-size:11px; color:var(--n6); }

/* ── filter rail (gallery composition) ── */
.filter-rail { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:16px 22px; background:var(--n1); border:1px solid var(--n4); border-radius:100px; margin-bottom:22px; }
.filter-group-label { font-size:11.5px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.04em; margin-right:2px; }
.filter-chip2 { padding:8px 15px; border-radius:100px; font-size:12.5px; font-weight:600; color:var(--n7); border:1px solid var(--n4); background:var(--n0); }
.filter-chip2.active { background:var(--m600); border-color:var(--m600); color:#fff; }
.filter-reset { margin-left:auto; font-size:12px; color:var(--n7); font-weight:600; padding:8px 14px; }
.filter-reset:hover { color:var(--n10); }

/* ── gallery ── */
.org-gallery { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(172px, auto); gap:18px; }
.org-tile { cursor:pointer; }
.org-tile.big { grid-column:span 2; grid-row:span 2; }
.org-badge-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.org-avatar2 { width:40px; height:40px; border-radius:12px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
.score-pill { font-size:12px; font-weight:700; padding:5px 11px; border-radius:100px; }
.score-pill.high { background:var(--s1-bg); color:var(--s1-text); }
.score-pill.mid { background:var(--s3-bg); color:var(--s3-text); }
.score-pill.low { background:var(--n2); color:var(--n7); }
.org-name2 { font-size:15px; font-weight:700; color:var(--n10); margin-bottom:3px; }
.org-type2 { font-size:12px; color:var(--n7); }

/* ── admin ── */
.admin-table-wrap { background:var(--n1); border:1px solid var(--n4); border-radius:24px; overflow:hidden; }
table.admin-table { width:100%; border-collapse:collapse; }
table.admin-table th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--n7); padding:14px 24px; border-bottom:1px solid var(--n4); font-weight:700; }
table.admin-table td { padding:16px 24px; font-size:13.5px; color:var(--n8); border-bottom:1px solid var(--n3); }
table.admin-table tr:last-child td { border-bottom:none; }
.role-pill { font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:100px; background:var(--n2); color:var(--n8); }
.status-pill { font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:100px; }
.status-pill.wait { background:var(--n2); color:var(--n7); }
.status-pill.ok { background:var(--s1-bg); color:var(--s1-text); }
.status-pill.no { background:var(--s2-bg); color:var(--s2-text); }
.admin-actions { display:flex; gap:6px; }

/* ── analytics ── */
.agg-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
.select2 { padding:10px 16px; border-radius:100px; border:1px solid var(--n4); background:var(--n1); font-size:13px; color:var(--n9); font-weight:600; }
.cache-badge { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--s1-text); background:var(--s1-bg); padding:6px 12px; border-radius:100px; font-weight:600; }
.archive-list { display:flex; flex-direction:column; gap:0; }
.archive-item { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--n3); }
.archive-item:last-child { border-bottom:none; }
.archive-icon { width:38px; height:38px; border-radius:10px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; }
.archive-name { font-size:13px; font-weight:600; color:var(--n9); }
.archive-meta { font-size:11.5px; color:var(--n6); }

/* ── forms / feature card ── */
.feature-card2 { background:var(--n1); border:1px solid var(--n4); border-radius:40px; padding:36px; }
.field2 { margin-bottom:16px; }
.field2-label { display:block; font-size:12.5px; font-weight:700; color:var(--n8); margin-bottom:7px; text-transform:uppercase; letter-spacing:.03em; }
.field2-input { width:100%; padding:12px 16px; border:1px solid var(--n4); border-radius:16px; font-size:13.5px; background:var(--n0); color:var(--n9); }
.field2-input:focus { outline:none; border-color:var(--m500); box-shadow:0 0 0 3px var(--m100); }

/* ── modal / drawer / toast ── */
.overlay2 { position:fixed; inset:0; background:rgba(36,36,36,.4); display:flex; align-items:center; justify-content:center; z-index:100; animation: fadeInUp .18s ease both; }
.modal2-card { width:460px; max-width:92vw; background:var(--n0); border:1px solid var(--n4); border-radius:32px; padding:30px; animation: tileStagger .22s ease both; }
.modal2-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.modal2-title { font-size:17px; font-weight:700; color:var(--n10); }
.modal2-close { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n7); border:1px solid var(--n4); }
.modal2-close:hover { background:var(--n2); }

.drawer2-overlay { position:fixed; inset:0; background:rgba(36,36,36,.32); z-index:90; }
.drawer2-panel { position:fixed; right:0; top:0; bottom:0; width:420px; max-width:90vw; background:var(--n0); border-left:1px solid var(--n4); padding:30px; z-index:91; overflow-y:auto; animation: slideInRight2 .25s ease both; }
@keyframes slideInRight2 { from { transform: translateX(100%);} to { transform: translateX(0);} }
.drawer2-close { position:absolute; top:24px; right:24px; width:32px; height:32px; border-radius:50%; border:1px solid var(--n4); display:flex; align-items:center; justify-content:center; color:var(--n7); }

.toast2-wrap { position:fixed; bottom:26px; right:26px; z-index:200; display:flex; flex-direction:column; gap:10px; }
.toast2 { display:flex; align-items:center; gap:10px; background:var(--n10); color:#fff; padding:14px 20px; border-radius:100px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.16); animation: tileStagger .25s ease both; }
.toast2.error i { color:var(--s2); }
.toast2 i { color:var(--s1); }

.skeleton2 { height:16px; border-radius:8px; background: linear-gradient(90deg, var(--n3) 0px, var(--n4) 40px, var(--n3) 80px); background-size: 200px 100%; animation: shimmerFlat 1.3s infinite linear; }
.spinner2 { width:32px; height:32px; border-radius:50%; border:3px solid var(--n4); border-top-color: var(--m600); animation: spin2 .8s linear infinite; }

@media (max-width: 980px) {
  .bento, .org-gallery { grid-template-columns: repeat(2,1fr); }
  .tile.feature, .tile.wide, .org-tile.big { grid-column: span 2; }
  .topnav-nav { display:none; }
}

/* ── 2026-09-17 점검 보완: 비교 리스트, 초대 검증, 반응형 ── */
.brand2-name, .brand2-sub { white-space:nowrap; }
.field2-input.has-error { border-color:var(--s2); }
.field2-error { font-size:11.5px; color:var(--s2-text); margin-top:5px; }
.admin-table-wrap { overflow-x:auto; }
table.admin-table { min-width:640px; }
.rank-type { font-size:11.5px; color:var(--n7); margin-right:6px; }
.archive-item.fresh .archive-name { color:var(--m700); }
.org-tile.in-compare { border-color:var(--m600); box-shadow:inset 0 0 0 1px var(--m600); }

.compare-tray { background:var(--n1); border:1px solid var(--m300); border-radius:24px; padding:20px 22px; margin-bottom:18px; animation:tileStagger .3s ease both; }
.compare-tray-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.compare-tray-head .filter-reset { margin-left:0; }
.compare-row { display:grid; grid-template-columns:1.6fr 1fr .9fr .9fr 32px; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--n3); font-size:13px; color:var(--n8); }
.compare-row:last-child { border-bottom:none; }
.compare-row.head { font-size:11px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.04em; }
.compare-name { font-weight:700; color:var(--n10); }
.compare-delta { font-weight:700; font-variant-numeric:tabular-nums; }
.compare-delta.up { color:var(--s1-text); }
.compare-delta.down { color:var(--s2-text); }
.compare-remove { width:28px; height:28px; border-radius:50%; border:1px solid var(--n4); color:var(--n7); display:flex; align-items:center; justify-content:center; }
.compare-remove:hover { background:var(--n2); color:var(--n10); }

/* 메뉴가 길어 1200px 아래에서는 두 줄로 나눈다. 원본은 980px 아래에서 메뉴를 숨겨 화면 이동이 막혔다 */
@media (max-width: 1200px) {
  .topnav { height:auto; flex-wrap:wrap; padding:12px 24px; row-gap:10px; }
  .topnav-nav { display:flex; order:3; width:100%; overflow-x:auto; scrollbar-width:none; }
  .topnav-nav::-webkit-scrollbar { display:none; }
}

@media (max-width: 760px) {
  .topnav { padding:10px 16px; }
  .brand2-sub { display:none; }
  .main2 { padding:20px 16px 56px; }
  .page-title2 { font-size:26px; letter-spacing:-.4px; }
  .bento, .org-gallery { grid-template-columns:1fr; gap:12px; }
  .tile.feature, .tile.wide, .org-tile.big { grid-column:auto; grid-row:auto; }
  .tile.feature { min-height:300px; }
  .tile { padding:20px; border-radius:20px; }
  .filter-rail { border-radius:20px; padding:14px 16px; }
  .filter-reset { margin-left:0; }
  .agg-toolbar { flex-wrap:wrap; }
  .compare-tray { padding:16px; border-radius:20px; }
  .compare-row { grid-template-columns:1.5fr .8fr .8fr 28px; }
  .compare-row > :nth-child(2) { display:none; }
  .drawer2-panel { width:100%; max-width:100%; }
  .toast2-wrap { left:16px; right:16px; bottom:16px; }
  .toast2 { border-radius:16px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>

window.EsgPdf = (function () {
  var C = {"main": [43, 89, 209], "soft": [196, 209, 242], "ink": [36, 36, 36], "muted": [121, 119, 118], "line": [229, 229, 230], "good": [20, 113, 59], "bad": [173, 31, 31]};

  function txt(doc, s, x, y, o) {

    var c = o.color || C.ink;
    doc.setTextColor(c[0], c[1], c[2]);

    if (o.maxWidth) opt.maxWidth = o.maxWidth;
    doc.text(String(s), x, y, opt);

  function rule(doc, y, x1, x2) {

  }
  function header(doc, brand, title, sub) {
    doc.setFillColor(C.main[0], C.main[1], C.main[2]);
    doc.rect(M, 16, 12, 1.4, "F");

  }
  function footer(doc) {

      rule(doc, 283);
      txt(doc, "데모 데이터로 만든 예시 리포트입니다.", M, 289, { size: 8, color: C.muted });

  function bar(doc, x, y, w, value, color) {

  function deltaText(d) {

    // 차트 캔버스는 배경이 투명이라 흰 바탕에 옮겨 JPEG로 넣는다(PNG 무압축보다 훨씬 작다)

      doc.setFillColor(C.main[0], C.main[1], C.main[2]);
      doc.circle(px(i), py(p.value), last ? 1.3 : 0.9, "F");
      txt(doc, p.value, px(i), py(p.value) - 2.6, { size: 7.5, bold: last, align: "center" });
      txt(doc, p.label, px(i), bottom + 5, { size: 7, color: C.muted, align: "center" });
    });
    return bottom + 13;
  }

  var BRAND = "ESG Insight Hub · 다중기관 분석 플랫폼";

  // o: { industry, date, chart, total: { count, avg }, rows: [{ name, count, score }], orgs: [{ name, type, score }] }
  function industry(o) {
    var doc = create();
    var all = o.industry === "전체 업종";
    var y = header(doc, BRAND, "업종별 ESG 종합 분석 리포트", "기준: " + o.industry + " · " + o.date + " 집계");

    var picked = all ? null : o.rows.filter(function (r) { return r.name === o.industry; })[0];
    var kpis = [["집계 기관", o.total.count + "개"], ["전체 기관 평균", o.total.avg + "점"]];
    if (picked) kpis.push([picked.name + " 업종 평균", picked.score + "점"]);
    kpis.forEach(function (k, i) {
      var x = M + i * 50;
      txt(doc, k[0], x, y, { size: 9.5, color: C.muted });
      txt(doc, k[1], x, y + 9, { bold: true, size: 16, color: i === 2 ? C.main : C.ink });
    });
    y += 20;

    y = image(doc, o.chart, y, 68);
    y = section(doc, "업종별 평균 점수", y, "기관 점수의 단순 평균");
    o.rows.forEach(function (r) {
      y = ensure(doc, y, 9);
      var on = !all && r.name === o.industry;
      txt(doc, r.name, M + 4, y, { size: 10, bold: on, color: on ? C.main : C.ink });
      txt(doc, "기관 " + r.count + "개", 70, y, { size: 9, color: C.muted });
      bar(doc, 100, y, 60, r.score, !all && !on ? C.soft : null);
      txt(doc, r.score + "점", RIGHT, y, { bold: true, size: 10, align: "right" });
      y += 3;
      rule(doc, y);
      y += 6;
    });

    y = section(doc, all ? "기관별 점수" : o.industry + " 업종 기관", y + 4, "최근 진단 점수 높은 순");
    o.orgs.forEach(function (g) {
      y = ensure(doc, y, 9);
      txt(doc, g.name, M + 4, y, { size: 10 });
      txt(doc, g.type, 80, y, { size: 9, color: C.muted });
      bar(doc, 130, y, 36, g.score);
      txt(doc, g.score + "점", RIGHT, y, { bold: true, size: 10, align: "right" });
      y += 3;
      rule(doc, y);
      y += 6;
    });
    footer(doc);
    return doc;
  }

  return { industry: industry };
})();
</script>

function scoreTier(s) { return s >= 75 ? "high" : s >= 55 ? "mid" : "low"; }

function useChart2(ref, buildConfig, deps) {
  useEffect(() => {
    if (!ref.current) return;
    const chart = new Chart(ref.current.getContext("2d"), buildConfig());
    return () => chart.destroy();
    // eslint-disable-next-line
  }, deps);
}

function useToast2() {
  const [toasts, setToasts] = useState([]);
  const push = (msg, type = "success") => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  };
  const view = (
    <div className="toast2-wrap" role="status" aria-live="polite">
      {toasts.map((t) => (
        <div key={t.id} className={"toast2 " + (t.type === "error" ? "error" : "")}>

  const [inviteOpen, setInviteOpen] = useState(false);
  const [invite, setInvite] = useState({ org: "", email: "", role: "기관담당자" });
  const [errors, setErrors] = useState({});

  // 상단 기관 초대 버튼으로 들어오면 초대 창을 바로 연다
  useEffect(() => { if (pendingInvite) { setInviteOpen(true); clearInvite(); } }, [pendingInvite]);
  useEffect(() => {
    if (!inviteOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setInviteOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [inviteOpen]);

  const setStatus = (id, status) => setAccounts((a) => a.map((x) => (x.id === id ? { ...x, status } : x)));
  const closeInvite = () => { setInviteOpen(false); setErrors({}); };

  const sendInvite = () => {
    const errs = {};
    if (!invite.org.trim()) errs.org = "기관명을 입력해 주세요";
    if (!emailOk2(invite.email)) errs.email = invite.email ? "이메일 형식이 올바르지 않습니다" : "담당자 이메일을 입력해 주세요";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    const email = invite.email.trim();
    setAccounts((a) => [...a, { id: Math.max(...a.map((x) => x.id)) + 1, name: email.split("@")[0], org: invite.org.trim(), role: invite.role, status: "sent" }]);
    toast.push(email + " 주소로 초대장을 발송했습니다");
    setInvite({ org: "", email: "", role: "기관담당자" });
    closeInvite();
  };

  return (
    <div>
      <div className="page-head2">
        <div><h1 className="page-title2">관리자 권한·다중 계정 관리</h1><div className="page-sub2">기관 담당자 계정을 초대하고 승인 상태를 관리합니다</div></div>
        <button className="btn2 btn2-primary" onClick={() => setInviteOpen(true)}><i className="ph ph-user-plus" aria-hidden="true"></i>계정 초대</button>
      </div>

      <div className="admin-table-wrap">
        <table className="admin-table">
          <thead><tr><th>담당자</th><th>소속 기관</th><th>권한</th><th>승인 상태</th><th>작업</th></tr></thead>
          <tbody>
            {accounts.map((a) => (
              <tr key={a.id}>
                <td style={{fontWeight:600,color:"var(--n9)"}}>{a.name}</td>
                <td>{a.org}</td>
                <td><span className="role-pill">{a.role}</span></td>
                <td><span className={"status-pill " + STATUS_CLASS[a.status]}>{STATUS_LABEL[a.status]}</span></td>
                <td>
                  <div className="admin-actions">
                    {a.status === "wait" && (
                      <React.Fragment>
                        <button className="btn2 btn2-secondary btn2-sm" onClick={() => { setStatus(a.id,"ok"); toast.push(a.name + " 계정을 승인했습니다"); }}>승인</button>
                        <button className="btn2 btn2-ghost btn2-sm" onClick={() => { setStatus(a.id,"no"); toast.push(a.name + " 계정을 거절했습니다","error"); }}>거절</button>
                      </React.Fragment>
                    )}
                    {a.status === "sent" && (
                      <React.Fragment>
                        <button className="btn2 btn2-secondary btn2-sm" onClick={() => toast.push(a.org + " 담당자에게 초대장을 다시 보냈습니다")}>다시 보내기</button>
                        <button className="btn2 btn2-ghost btn2-sm" onClick={() => { setAccounts((list) => list.filter((x) => x.id !== a.id)); toast.push("초대를 취소했습니다"); }}>초대 취소</button>
                      </React.Fragment>
                    )}
                    {(a.status === "ok" || a.status === "no") && (
                      <button className="btn2 btn2-ghost btn2-sm" onClick={() => { setStatus(a.id,"wait"); toast.push(a.name + " 계정 상태를 재검토로 변경했습니다"); }}>재검토</button>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {inviteOpen && (
        <div className="overlay2" onClick={closeInvite}>
          <div className="modal2-card" role="dialog" aria-modal="true" aria-labelledby="invite-title" onClick={(e) => e.stopPropagation()}>
            <div className="modal2-head">
              <div className="modal2-title" id="invite-title">기관 담당자 초대</div>
              <button className="modal2-close" aria-label="닫기" onClick={closeInvite}><i className="ph ph-x" aria-hidden="true"></i></button>
            </div>
            <div className="field2"><label className="field2-label" htmlFor="inv-org">기관명</label><input id="inv-org" className={"field2-input " + (errors.org ? "has-error" : "")} placeholder="예: 나눔사회적기업" value={invite.org} onChange={(e) => setInvite({ ...invite, org: e.target.value })} />{errors.org && <div className="field2-error">{errors.org}</div>}</div>
            <div className="field2"><label className="field2-label" htmlFor="inv-email">담당자 이메일</label><input id="inv-email" type="email" className={"field2-input " + (errors.email ? "has-error" : "")} placeholder="name@organization.kr" value={invite.email} onChange={(e) => setInvite({ ...invite, email: e.target.value })} />{errors.email && <div className="field2-error">{errors.email}</div>}</div>
            <div className="field2"><label className="field2-label" htmlFor="inv-role">권한</label><select id="inv-role" className="field2-input" value={invite.role} onChange={(e) => setInvite({ ...invite, role: e.target.value })}><option>기관담당자</option><option>운영관리자</option></select></div>
            <button className="btn2 btn2-primary" style={{width:"100%",justifyContent:"center",marginTop:8}} onClick={sendInvite}>초대장 발송</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────── analytics ───────── */
function AnalyticsScreen({ toast }) {
  const chartRef = useRef(null);
  const [industry, setIndustry] = useState("전체 업종");
  const [loading, setLoading] = useState(false);
  const [archive, setArchive] = useState([
    { name: "2026년 3분기 업종별 종합 리포트.pdf", meta: "2026.09.01 아카이빙 · 보관함 저장" },
    { name: "2026년 2분기 업종별 종합 리포트.pdf", meta: "2026.06.02 아카이빙 · 보관함 저장" },
    { name: "2026년 1분기 업종별 종합 리포트.pdf", meta: "2026.03.03 아카이빙 · 보관함 저장" },
  ]);
  const all = industry === "전체 업종";
  const orgs = ORGS.filter((o) => all || o.industry === industry).sort((a, b) => b.score - a.score);

  useChart2(chartRef, () => ({
    type: "bar",
    data: {
      labels: INDUSTRY_STATS.map((s) => s.name),
      datasets: [{ data: INDUSTRY_STATS.map((s) => s.score), backgroundColor: INDUSTRY_STATS.map((s) => (all || s.name === industry ? "#2b59d1" : "#c4d1f2")), borderRadius:10, maxBarThickness:46 }],
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ y:{min:0,max:100,grid:{color:"#e5e5e6"},ticks:{color:"#909298",font:{size:11}}}, x:{grid:{display:false},ticks:{color:"#797776",font:{size:12,weight:600}}} } },
  }), [industry, loading]);

  const reload = (v) => {
    setIndustry(v); setLoading(true);
    setTimeout(() => setLoading(false), 900);
  };

  const genPdf = () => {
    try {
      const chart = !loading && chartRef.current ? chartRef.current : null;
      const doc = window.EsgPdf.industry({
        industry, date: REPORT_DATE, chart,
        total: { count: ORGS.length, avg: OVERALL_AVG },
        rows: INDUSTRY_STATS.map((s) => ({ name: s.name, count: s.count, score: s.score })),
        orgs: orgs.map((o) => ({ name: o.name, type: o.type, score: o.score })),
      });
      doc.save("esg-industry-report.pdf");
      setArchive((list) => [{ name: "2026년 3분기 " + (all ? "업종별" : industry + " 업종") + " 종합 리포트.pdf", meta: "방금 아카이빙 · 보관함 저장", fresh: true }, ...list]);
      toast.push("종합 리포트를 PDF로 아카이빙했습니다");
    } catch (e) { toast.push("PDF 생성 중 문제가 발생했습니다","error"); }
  };

  return (
    <div>
      <div className="page-head2">
        <div><h1 className="page-title2">종합 분석 리포트·정책 대시보드</h1><div className="page-sub2">업종별·기간별 집계 데이터를 기반으로 정책 참고 자료를 생성합니다</div></div>
        <button className="btn2 btn2-primary" onClick={genPdf}><i className="ph ph-archive" aria-hidden="true"></i>PDF 아카이빙</button>
      </div>

      <div className="agg-toolbar">
        <select className="select2" aria-label="업종 선택" value={industry} onChange={(e) => reload(e.target.value)}>
          {["전체 업종", ...INDUSTRIES].map((v) => <option key={v}>{v}</option>)}
        </select>
        <span className="cache-badge"><i className="ph ph-lightning" aria-hidden="true"></i>{loading ? "집계 중" : "미리 집계한 결과 · 즉시 조회"}</span>
      </div>

      <div className="bento">
        <section className="tile feature">
          <div className="tile-glow"></div>
          <div className="tile-head"><span className="tile-title">업종별 평균 점수 · 등록 기관 {ORGS.length}개 기준</span><div className="tile-icon"><i className="ph ph-chart-bar" aria-hidden="true"></i></div></div>
          {loading ? (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:180,gap:12}}>
              <div className="spinner2"></div><span className="lbl">업종별 점수를 집계하는 중…</span>
            </div>
          ) : (
            <div className="chart-box"><canvas ref={chartRef} aria-label="업종별 평균 점수 그래프"></canvas></div>
          )}
        </section>
        <section className="tile wide">
          <div className="tile-head"><span className="tile-title">{all ? "기관별 점수" : industry + " 업종 기관"}</span><div className="tile-icon"><i className="ph ph-buildings" aria-hidden="true"></i></div></div>
          <div className="rank-list">
            {orgs.map((o, i) => (
              <div className="rank-item" key={o.id}><span className="rank-num">{i + 1}</span><span className="rank-name">{o.name}</span><span className="rank-type">{o.industry}</span><span className="rank-score">{o.score}점</span></div>
            ))}
          </div>
        </section>
        <section className="tile wide">
          <div className="tile-head"><span className="tile-title">리포트 아카이브</span><div className="tile-icon"><i className="ph ph-archive-box" aria-hidden="true"></i></div></div>
          <div className="archive-list">
            {archive.slice(0, 4).map((a, i) => (
              <div className={"archive-item " + (a.fresh ? "fresh" : "")} key={a.name + i}><div className="archive-icon"><i className="ph ph-file-pdf" aria-hidden="true"></i></div><div><div className="archive-name">{a.name}</div><div className="archive-meta">{a.meta}</div></div></div>
            ))}
          </div>
        </section>
      </div>
    </div>
  );
}

/* ───────── app ───────── */
function App() {
  const [screen, setScreen] = useState("main");
  const [accounts, setAccounts] = useState(ACCOUNTS);
  const [compare, setCompare] = useState([]);
  const [pendingInvite, setPendingInvite] = useState(false);
  const toast = useToast2();

  useEffect(() => { window.scrollTo(0, 0); }, [screen]);
  const openInvite = () => { setScreen("admin"); setPendingInvite(true); };

  return (
    <div className="shell2" data-archetype="bento-grid">
      <TopNav screen={screen} setScreen={setScreen} onInvite={openInvite} />
      <main className="main2" key={screen}>
        {screen === "main" && <MainBento setScreen={setScreen} accounts={accounts} />}
        {screen === "gallery" && <GalleryScreen toast={toast} compare={compare} setCompare={setCompare} />}
        {screen === "admin" && <AdminScreen toast={toast} accounts={accounts} setAccounts={setAccounts} pendingInvite={pendingInvite} clearInvite={() => setPendingInvite(false)} />}
        {screen === "analytics" && <AnalyticsScreen toast={toast} />}
      </main>
      {toast.view}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
