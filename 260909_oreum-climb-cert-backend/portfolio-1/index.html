<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오름 등반 인증 관리자 콘솔 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 206°, light) ── */
:root{
  --m50:#edf7ff; --m100:#dbf0ff; --m200:#b8e0ff; --m300:#8cceff; --m400:#5cb9ff;
  --m500:#2ea5ff; --m600:#0091ff; --m700:#0077d1; --m800:#005da3; --m900:#004173;
  --n0:#ffffff; --n1:#f8f9fa; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b3b3b3; --n6:#909498; --n7:#71767a; --n8:#53575a; --n9:#36383a; --n10:#202020;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n1); color:var(--n9); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:13px;}
a{color:inherit; text-decoration:none;}

/* ── keyframes ── */
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes staggerIn{from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(0,145,255,0.45);} 50%{box-shadow:0 0 0 5px rgba(0,145,255,0);}}
@keyframes toastSlide{from{opacity:0; transform:translateY(-10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes modalPop{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
@keyframes ringGrow{from{stroke-dashoffset:var(--ring-full);} to{stroke-dashoffset:var(--ring-offset);}}

/* ── layout ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:var(--n0); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; z-index:20;
}
.sidebar-brand{height:64px; display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid var(--n3);}
.brand-mark{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg, var(--m600), var(--m800)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.content-header-accent{height:3px; width:56px; border-radius:3px; background:linear-gradient(90deg, var(--m600), var(--m300)); margin-top:12px;}
.brand-text{font-weight:700; font-size:14px; color:var(--n10);}
.brand-sub{font-size:11px; color:var(--n6);}
.sidebar-cmdk-hint{
  margin:14px 16px 6px; padding:8px 10px; border-radius:8px; background:var(--n1); border:1px solid var(--n3);
  display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--n7); cursor:pointer;
  transition:border-color .15s ease;
}
.sidebar-cmdk-hint:hover{border-color:var(--n5);}
.kbd{font-family:inherit; font-size:11px; padding:2px 6px; border-radius:5px; background:var(--n0); border:1px solid var(--n4); color:var(--n7);}
.sidebar-nav{padding:10px 12px; display:flex; flex-direction:column; gap:2px;}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  font-size:13.5px; color:var(--n7); font-weight:500; position:relative;
  transition:background .12s ease, color .12s ease;
}
.sidebar-link:hover{background:var(--n1); color:var(--n9);}
.sidebar-link.active{background:var(--m50); color:var(--m700); font-weight:600;}
.sidebar-link.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--m600);}
.sidebar-link i{width:17px; height:17px; stroke-width:1.6;}
.sidebar-section-title{font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--n5); padding:14px 10px 4px; text-transform:uppercase;}
.sidebar-live{margin:auto 16px 16px; padding:11px 12px; border-radius:10px; background:var(--n1); border:1px solid var(--n3);}
.live-row{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--n7); margin-bottom:6px;}
.live-dot{width:7px; height:7px; border-radius:50%; background:var(--m600); animation:pulseDot 2s infinite;}
.sidebar-user{border-top:1px solid var(--n3); padding:12px 16px; display:flex; align-items:center; gap:9px;}
.avatar-sq{width:28px; height:28px; border-radius:7px; background:var(--n2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--n7); flex-shrink:0;}
.user-meta{font-size:12px; line-height:1.3;}
.user-meta .name{font-weight:600; color:var(--n9);}
.user-meta .role{color:var(--n6); font-size:11px;}

.main-wrap{margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px); display:flex; flex-direction:column; min-height:100vh;}
.topbar{
  height:56px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; border-bottom:1px solid var(--n3); background:var(--n0); position:sticky; top:0; z-index:10;
}
.breadcrumb{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--n7);}
.breadcrumb .current{color:var(--n9); font-weight:600;}
.breadcrumb .divider{color:var(--n5);}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.btn-cmdk{display:flex; align-items:center; gap:6px; padding:7px 11px; border-radius:8px; border:1px solid var(--n3); font-size:12.5px; color:var(--n7); background:var(--n0);}
.btn-cmdk:hover{border-color:var(--n5);}
.btn-primary{
  display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; background:var(--m600); color:#fff;
  font-size:13px; font-weight:600; transition:background .12s ease, transform .12s ease;
}
.btn-primary:hover{background:var(--m700); transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{padding:8px 13px; border-radius:8px; border:1px solid var(--n3); font-size:13px; color:var(--n8); background:var(--n0); font-weight:500; transition:border-color .12s ease;}
.btn-ghost:hover{border-color:var(--n5); background:var(--n1);}
.btn-danger-outline{padding:8px 13px; border-radius:8px; border:1px solid var(--s2); color:var(--s2); font-size:13px; font-weight:600; background:var(--n0);}
.btn-danger-outline:hover{background:var(--s2-bg);}

.content{padding:24px; flex:1; width:100%; animation:fadeIn .3s ease;}
.content-header{margin-bottom:18px;}
.content-title{font-size:19px; font-weight:700; color:var(--n10); margin-bottom:4px;}
.content-desc{font-size:13px; color:var(--n7);}

/* ── master-detail ── */
.master-detail{display:flex; gap:16px; height:calc(100vh - 56px - 48px); min-height:560px;}
.list-rail{width:340px; flex-shrink:0; background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
.list-rail-head{padding:14px 16px; border-bottom:1px solid var(--n3);}
.rail-search{width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--n3); font-size:12.5px; background:var(--n1);}
.rail-tabs{display:flex; gap:6px; margin-top:10px;}
.rail-tab{padding:5px 10px; border-radius:7px; font-size:11.5px; font-weight:600; color:var(--n7); background:var(--n1); border:1px solid var(--n3);}
.rail-tab.active{background:var(--m600); color:#fff; border-color:var(--m600);}
.rail-list{overflow-y:auto; flex:1;}
.rail-item{
  display:flex; align-items:flex-start; gap:10px; padding:12px 16px; border-bottom:1px solid var(--n2);
  cursor:pointer; opacity:0; animation:staggerIn .3s ease forwards; transition:background .12s ease;
}
.rail-item:hover{background:var(--n1);}
.rail-item.selected{background:var(--m50); border-left:3px solid var(--m600); padding-left:13px;}
.rail-avatar{width:32px; height:32px; border-radius:8px; background:var(--n2); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--n7); flex-shrink:0;}
.rail-item-body{flex:1; min-width:0;}
.rail-item-top{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.rail-item-name{font-size:13px; font-weight:600; color:var(--n9);}
.rail-item-time{font-size:11px; color:var(--n5); flex-shrink:0;}
.rail-item-sub{font-size:12px; color:var(--n7); margin-top:2px;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; margin-top:6px;}
.badge-match{background:var(--s1-bg); color:var(--s1-text);}
.badge-mismatch{background:var(--s2-bg); color:var(--s2-text);}
.badge-unknown{background:var(--s3-bg); color:var(--s3-text);}
.badge-neutral{background:var(--n2); color:var(--n7);}

.detail-panel{flex:1; min-width:0; background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow-y:auto; padding:24px;}
.detail-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--n2);}
.detail-title{font-size:17px; font-weight:700; color:var(--n10);}
.detail-sub{font-size:12.5px; color:var(--n7); margin-top:3px;}
.photo-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin:14px 0 20px;}
.photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--n3);}
.ocr-panel{background:var(--n1); border:1px solid var(--n3); border-radius:10px; padding:16px; margin-bottom:20px;}
.ocr-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; border-bottom:1px solid var(--n2);}
.ocr-row:last-child{border-bottom:none;}
.ocr-label{color:var(--n7);}
.ocr-value{font-weight:600; color:var(--n9);}
.detail-actions{display:flex; gap:10px; margin-top:8px;}
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--n6); gap:10px;}

/* ── tables ── */
.filter-bar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.filter-bar select, .filter-bar input{padding:8px 11px; border-radius:8px; border:1px solid var(--n3); background:var(--n0); font-size:12.5px; color:var(--n8);}
.data-table{width:100%; border-collapse:collapse; background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.data-table th{text-align:left; padding:11px 16px; font-size:11.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; background:var(--n1); border-bottom:1px solid var(--n3);}
.data-table td{padding:12px 16px; font-size:13px; color:var(--n8); border-bottom:1px solid var(--n2);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr{cursor:pointer; transition:background .1s ease; opacity:0; animation:staggerIn .3s ease forwards;}
.data-table tbody tr:hover{background:var(--n1);}
.chip{display:inline-flex; padding:2px 9px; border-radius:6px; background:var(--n2); color:var(--n7); font-size:11.5px; font-weight:600;}

/* ── badges screen ── */
.badge-card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-bottom:24px;}
.badge-card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:16px; cursor:pointer; transition:border-color .12s ease, transform .12s ease;}
.badge-card:hover{border-color:var(--n5); transform:translateY(-2px);}
.badge-icon-box{width:36px; height:36px; border-radius:9px; background:var(--n2); display:flex; align-items:center; justify-content:center; margin-bottom:10px; color:var(--n8);}
.badge-icon-box.hi{background:var(--m50); color:var(--m700);}
.badge-card-title{font-size:13.5px; font-weight:700; color:var(--n9); margin-bottom:3px;}
.badge-card-desc{font-size:11.5px; color:var(--n6); line-height:1.4;}
.progress-ring-wrap{display:flex; align-items:center; gap:10px;}
.ring-text{font-size:11.5px; font-weight:700; color:var(--n8);}

/* ── modal / drawer / toast ── */
.overlay{position:fixed; inset:0; background:rgba(20,22,24,.42); display:flex; align-items:center; justify-content:center; z-index:100;}
.overlay.drawer-overlay{justify-content:flex-end; align-items:stretch;}
.modal{width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--n0); border-radius:14px; padding:24px; animation:modalPop .18s ease;}
.drawer{width:400px; max-width:92vw; background:var(--n0); height:100%; padding:24px; overflow-y:auto; box-shadow:-8px 0 24px rgba(0,0,0,.08);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-title{font-size:16px; font-weight:700; color:var(--n10);}
.modal-close{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.modal-close:hover{background:var(--n1);}
.form-row{margin-bottom:14px;}
.form-label{display:block; font-size:12.5px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.form-input, .form-select, .form-textarea{width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--n3); font-size:13px; color:var(--n9); background:var(--n0);}
.form-input:focus, .form-select:focus, .form-textarea:focus{outline:none; border-color:var(--m600); box-shadow:0 0 0 3px var(--m50);}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-footer{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

.toast-stack{position:fixed; top:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--n10); color:var(--n0); padding:11px 16px; border-radius:10px; font-size:13px; display:flex; align-items:center; gap:8px; animation:toastSlide .22s ease; box-shadow:0 8px 24px rgba(0,0,0,.18);}
.toast i{width:16px; height:16px; color:var(--m400); flex-shrink:0;}

/* ── cmdk ── */
.cmdk-modal{width:560px; max-width:90vw; background:var(--n0); border-radius:14px; padding:0; animation:modalPop .16s ease; overflow:hidden;}
.cmdk-input{width:100%; border:none; border-bottom:1px solid var(--n3); padding:16px 20px; font-size:15px; outline:none;}
.cmdk-results{max-height:340px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:11px; font-weight:700; color:var(--n5); padding:8px 12px 4px; text-transform:uppercase;}
.cmdk-item{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-radius:8px; font-size:13.5px; color:var(--n9);}
.cmdk-item:hover{background:var(--n1);}

@media (max-width:900px){
  .master-detail{flex-direction:column; height:auto;}
  .list-rail{width:100%;}
  .photo-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>

function Icon({name, size=17}){
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, [name]);
  return <i ref={ref} data-lucide={name} style={{width:size, height:size}}></i>;
}

function ProgressRing({value, max, size=46}){
  const r = (size-8)/2, c = 2*Math.PI*r;
  const pct = Math.min(1, value/max);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--n3)" strokeWidth="5"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--m600)" strokeWidth="5"
        strokeLinecap="round" strokeDasharray={c}
        style={{'--ring-full':c, '--ring-offset':c*(1-pct), animation:'ringGrow 1s ease forwards', transform:'rotate(-90deg)', transformOrigin:'center'}}/>
    </svg>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(
        <div className="toast" key={t.id}><Icon name="check-circle" size={16}/>{t.text}</div>
      ))}
    </div>
  );
}

function OcrBadge({ocr}){
  if(ocr==='match') return <span className="badge badge-match"><Icon name="check" size={11}/>일치</span>;
  if(ocr==='mismatch') return <span className="badge badge-mismatch"><Icon name="x" size={11}/>불일치</span>;
  return <span className="badge badge-unknown"><Icon name="help-circle" size={11}/>미인식</span>;
}

function ReviewScreen({queue, setQueue, pushToast}){
  const [selectedId, setSelectedId] = useState(queue[0]?.id ?? null);
  const [rejectOpen, setRejectOpen] = useState(false);
  const [reason, setReason] = useState('');
  const [railFilter, setRailFilter] = useState('전체');
  const selected = queue.find(q=>q.id===selectedId);
  const visibleQueue = railFilter==='전체' ? queue : queue.filter(q=> (railFilter==='불일치' && q.ocr==='mismatch') || (railFilter==='미인식' && q.ocr==='unknown'));

  function approve(id){
    setQueue(prev=>prev.filter(q=>q.id!==id));
    pushToast('인증 승인 완료 — 배지·진행률이 자동 반영됩니다');
    const remain = queue.filter(q=>q.id!==id);
    setSelectedId(remain[0]?.id ?? null);
  }
  function reject(){
    setQueue(prev=>prev.filter(q=>q.id!==selectedId));
    pushToast('반려 처리 완료 — 지급된 배지·진행률이 회수됩니다');
    setRejectOpen(false); setReason('');
    const remain = queue.filter(q=>q.id!==selectedId);
    setSelectedId(remain[0]?.id ?? null);
  }

  return (
    <div className="content">
      <div className="content-header">
        <div style={{display:'flex', alignItems:'baseline', gap:14, marginBottom:4}}>
          <span style={{fontSize:44, fontWeight:800, color:'var(--n10)', lineHeight:1}}>{queue.length}</span>
          <span className="content-title" style={{marginBottom:0}}>건, 검수 대기 중</span>
        </div>
        <div className="content-desc">OCR 자동검수 결과를 확인하고 애매한 건만 재심사합니다</div>
        <div className="content-header-accent"></div>
      </div>
      <div className="master-detail">
        <div className="list-rail">
          <div className="list-rail-head">
            <input className="rail-search" placeholder="이용자명 또는 오름명 검색"/>
            <div className="rail-tabs">
              <button className={"rail-tab"+(railFilter==='전체'?' active':'')} onClick={()=>setRailFilter('전체')}>전체 {queue.length}</button>
              <button className={"rail-tab"+(railFilter==='불일치'?' active':'')} onClick={()=>setRailFilter('불일치')}>불일치 {queue.filter(q=>q.ocr==='mismatch').length}</button>
              <button className={"rail-tab"+(railFilter==='미인식'?' active':'')} onClick={()=>setRailFilter('미인식')}>미인식 {queue.filter(q=>q.ocr==='unknown').length}</button>
            </div>
          </div>
          <div className="rail-list">
            {visibleQueue.map((q,i)=>(
              <div key={q.id} className={"rail-item" + (q.id===selectedId ? ' selected':'')}
                style={{animationDelay:(i*35)+'ms'}}
                onClick={()=>setSelectedId(q.id)}>
                <div className="rail-avatar">{q.user.slice(0,1)}</div>
                <div className="rail-item-body">
                  <div className="rail-item-top">
                    <span className="rail-item-name">{q.user}</span>
                    <span className="rail-item-time">{q.time}</span>
                  </div>
                  <div className="rail-item-sub">{q.climb} · 사진 {q.photos}장</div>
                  <OcrBadge ocr={q.ocr}/>
                </div>
              </div>
            ))}
            {visibleQueue.length===0 && (
              <div style={{padding:'40px 20px', textAlign:'center', color:'var(--n5)', fontSize:13}}>해당 조건의 검수 건이 없습니다</div>
            )}
          </div>
        </div>

        <div className="detail-panel" style={{borderRadius:'12', boxShadow:'0 1px 2px rgba(32,34,36,0.05)'}}>
          {selected ? (
            <React.Fragment>
              <div className="detail-head">
                <div>
                  <div className="detail-title">{selected.user}님의 {selected.climb} 인증</div>
                  <div className="detail-sub">{selected.time} 제출 · 사진 {selected.photos}장</div>
                </div>
                <OcrBadge ocr={selected.ocr}/>
              </div>
              <div className="photo-grid">
                {Array.from({length:selected.photos}).map((_,i)=>(
                  <img key={i} src={`https://picsum.photos/seed/oreum-${selected.id}-${i}/200/200`} alt="인증 사진"/>
                ))}
              </div>
              <div className="ocr-panel">
                <div className="ocr-row"><span className="ocr-label">OCR 판독 텍스트</span><span className="ocr-value">{selected.ocrText}</span></div>
                <div className="ocr-row"><span className="ocr-label">오름 정보 대조</span><span className="ocr-value">{selected.confidence}</span></div>
                <div className="ocr-row"><span className="ocr-label">중복·부적합 필터</span><span className="ocr-value">{selected.ocr==='mismatch' ? '재확인 필요' : '이상 없음'}</span></div>
              </div>
              <div className="detail-actions">
                <button className="btn-primary" onClick={()=>approve(selected.id)}><Icon name="check" size={15}/>승인</button>

            </div>
            <div style={{fontSize:12, color:'var(--n6)'}}>반려 처리 시 지급된 배지와 진행률이 자동으로 회수됩니다.</div>
            <div className="modal-footer">
              <button className="btn-ghost" onClick={()=>setRejectOpen(false)}>취소</button>
              <button className="btn-danger-outline" onClick={reject}>반려 확정</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

        <div className="sidebar-live">
          <div className="live-row"><span className="live-dot"></span>검수 대기 {queue.length}건</div>
          <div className="live-row" style={{marginBottom:0}}><Icon name="server" size={13}/>API 34개 연동</div>
        </div>
        <div className="sidebar-user">
          <div className="avatar-sq">관</div>
          <div className="user-meta"><div className="name">운영자 계정</div><div className="role">슈퍼 관리자</div></div>
        </div>
      </aside>

      <main className="main-wrap">
        <header className="topbar">
          <div className="breadcrumb">
            <span>오름 관리자 콘솔</span><span className="divider">/</span><span className="current">{titles[screen]}</span>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><Icon name="search" size={14}/>검색<span className="kbd">⌘K</span></button>
          </div>
        </header>
        {screen==='main' && <ReviewScreen key="main" queue={queue} setQueue={setQueue} pushToast={pushToast}/>}
        {screen==='climbs' && <ClimbsScreen key="climbs" pushToast={pushToast}/>}
        {screen==='members' && <MembersScreen key="members"/>}
        {screen==='badges' && <BadgesScreen key="badges"/>}
      </main>

      <CmdK open={cmdkOpen} setOpen={setCmdkOpen}/>
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
