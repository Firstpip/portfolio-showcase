<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오름 챌린지 커뮤니티·랭킹 플랫폼 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 48°, light) ── */
:root{
  --m50:#fffced; --m100:#fff8db; --m200:#fff1b8; --m300:#ffe98c; --m400:#ffe05c;
  --m500:#ffd72e; --m600:#ffce00; --m700:#d1a900; --m800:#a38400; --m900:#735d00;
  --n0:#f9f4f2; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e6e5; --n4:#d7d7d5;
  --n5:#bab9b5; --n6:#989790; --n7:#7a7871; --n8:#44423f; --n9:#2d2c2b; --n10:#201f1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n9); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:13px;}
a{color:inherit; text-decoration:none;}

/* ── keyframes ── */
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes softPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
@keyframes toastPop{from{opacity:0; transform:translateY(-8px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes modalRise{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}

/* ── shell ── */
.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}
.topnav{
  width:100%; height:68px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; background:var(--n1); border-bottom:1px solid var(--n3); position:sticky; top:0; z-index:30;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:12px; background:linear-gradient(135deg, var(--m600), var(--m800)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.brand-text{font-weight:800; font-size:15px; color:var(--n10);}
.brand-sub{font-size:11px; color:var(--n6); font-weight:500;}
.topnav-tabs{display:flex; align-items:center; gap:4px;}
.topnav-tab{
  display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:12px; font-size:13.5px; font-weight:600;
  color:var(--n7); transition:background .14s ease, color .14s ease;
}
.topnav-tab:hover{background:var(--n2);}
.topnav-tab.active{background:var(--m50); color:var(--m800);}
.topnav-right{display:flex; align-items:center; gap:10px;}
.btn-primary{
  display:flex; align-items:center; gap:6px; padding:10px 18px; border-radius:999px; background:var(--m600); color:var(--n10);
  font-size:13.5px; font-weight:700; transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 6px 16px rgba(255,206,0,.28);
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(255,206,0,.36);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{padding:10px 16px; border-radius:999px; border:1px solid var(--n3); font-size:13.5px; color:var(--n8); font-weight:600; background:var(--n1);}
.btn-ghost:hover{background:var(--n2);}
.btn-danger-outline{padding:9px 15px; border-radius:999px; border:1px solid var(--s2); color:var(--s2); font-size:13px; font-weight:700; background:var(--n1);}
.btn-danger-outline:hover{background:var(--s2-bg);}
.profile-chip{width:36px; height:36px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--n7); font-size:12px;}

.page{flex:1; width:100%; padding:32px 28px 60px; animation:fadeIn .32s ease;}
.page-inner{max-width:1180px; margin:0 auto; width:100%;}
.page-header{margin-bottom:22px;}
.page-title{font-size:22px; font-weight:800; color:var(--n10); margin-bottom:5px;}
.page-desc{font-size:13.5px; color:var(--n7);}

/* ── feed layout ── */
.feed-layout{display:flex; justify-content:center; gap:24px; align-items:flex-start;}
.feed-main{max-width:600px; width:100%;}
.composer{
  position:sticky; top:84px; z-index:5; background:var(--n1); border:1px solid var(--n3); border-radius:20px;
  padding:16px 18px; margin-bottom:18px; box-shadow:0 10px 24px rgba(45,44,43,.06);
}
.composer-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.filter-chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip-btn{padding:6px 13px; border-radius:999px; font-size:12px; font-weight:700; background:var(--n2); color:var(--n7); border:1px solid transparent;}
.chip-btn.active{background:var(--m600); color:var(--n10);}

.post{
  background:var(--n1); border:1px solid var(--n3); border-radius:20px; padding:18px 20px; margin-bottom:14px;
  box-shadow:0 8px 22px rgba(45,44,43,.05); opacity:0; animation:cardStagger .38s ease forwards;
  transition:box-shadow .15s ease, transform .15s ease;
}
.post:hover{box-shadow:0 14px 30px rgba(45,44,43,.09); transform:scale(1.012);}
.post-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--n7); font-size:13px; flex-shrink:0;}
.author{font-weight:700; font-size:13.5px; color:var(--n9);}
.post-head time{font-size:11.5px; color:var(--n6); margin-left:auto;}
.post-body{font-size:13.5px; color:var(--n8); margin-bottom:12px; line-height:1.55;}
.post-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px;}
.post-photos img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px;}
.post-tags{display:flex; gap:6px; margin-bottom:12px;}
.tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--n2); color:var(--n7);}
.post-actions{display:flex; align-items:center; gap:6px; border-top:1px solid var(--n2); padding-top:10px;}
.post-action-btn{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:10px; font-size:12.5px; font-weight:600; color:var(--n7);}
.post-action-btn:hover{background:var(--n2);}
.post-action-btn.liked{color:var(--m800);}
.post-action-btn.liked i{animation:softPulse .3s ease;}
.badge-earn{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--m800); background:var(--m50); padding:4px 10px; border-radius:999px;}

.right-rail{width:290px; flex-shrink:0; display:flex; flex-direction:column; gap:16px; position:sticky; top:84px;}
.rail-card{background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:18px; box-shadow:0 8px 20px rgba(45,44,43,.05);}
.rail-card-title{font-size:13px; font-weight:800; color:var(--n9); margin-bottom:12px; display:flex; align-items:center; gap:7px;}
.rank-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--n2);}
.rank-row:last-child{border-bottom:none;}
.rank-num{width:20px; font-size:12px; font-weight:800; color:var(--n5); flex-shrink:0;}
.rank-num.top{color:var(--m800);}
.rank-name{flex:1; font-size:12.5px; font-weight:600; color:var(--n8);}
.rank-count{font-size:11.5px; color:var(--n6); font-weight:700;}
.mini-stat-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; color:var(--n7);}
.mini-stat-row b{color:var(--n9); font-weight:800;}

/* ── tables (challenge-codes / certificates / curation) ── */
.filter-bar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.filter-bar select, .filter-bar input{padding:9px 13px; border-radius:12px; border:1px solid var(--n3); background:var(--n1); font-size:12.5px; color:var(--n8);}
.card-panel{background:var(--n1); border:1px solid var(--n3); border-radius:20px; overflow:hidden; box-shadow:0 8px 22px rgba(45,44,43,.05);}
.data-table{width:100%; border-collapse:collapse;}
.data-table th{text-align:left; padding:13px 20px; font-size:11.5px; font-weight:800; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; background:var(--n2); border-bottom:1px solid var(--n3);}
.data-table td{padding:14px 20px; font-size:13px; color:var(--n8); border-bottom:1px solid var(--n2);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr{cursor:pointer; transition:background .12s ease; opacity:0; animation:cardStagger .3s ease forwards;}
.data-table tbody tr:hover{background:var(--n2);}
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge-ok{background:var(--s1-bg); color:var(--s1-text);}
.badge-warn{background:var(--n2); color:var(--n7);}
.badge-danger{background:var(--s2-bg); color:var(--s2-text);}
.badge-main{background:var(--m50); color:var(--m800);}
.row-check{width:16px; height:16px; accent-color:var(--m600);}

.curation-list{padding:8px;}
.curation-item{
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; margin:6px;
  background:var(--n1); border:1px solid var(--n3); cursor:grab; transition:box-shadow .15s ease, border-color .15s ease;
}
.curation-item.dragging{opacity:.5;}
.curation-item:hover{border-color:var(--n5); box-shadow:0 6px 16px rgba(45,44,43,.06); transform:scale(1.008);}
.drag-handle{color:var(--n5); flex-shrink:0;}
.curation-thumb{width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0;}
.curation-meta{flex:1; min-width:0;}
.curation-name{font-size:13.5px; font-weight:700; color:var(--n9); margin-bottom:3px;}
.curation-sub{font-size:11.5px; color:var(--n6);}
.priority-dot{width:26px; height:26px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--n7); flex-shrink:0;}

/* ── modal / drawer / toast ── */
.overlay{position:fixed; inset:0; background:rgba(32,31,30,.4); display:flex; align-items:center; justify-content:center; z-index:100;}
.modal{width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--n1); border-radius:24px; padding:26px; animation:modalRise .2s ease; box-shadow:0 24px 60px rgba(0,0,0,.16);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-title{font-size:16.5px; font-weight:800; color:var(--n10);}
.modal-close{width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.modal-close:hover{background:var(--n2);}
.form-row{margin-bottom:14px;}
.form-label{display:block; font-size:12.5px; font-weight:700; color:var(--n8); margin-bottom:6px;}
.form-input, .form-select, .form-textarea{width:100%; padding:11px 13px; border-radius:14px; border:1px solid var(--n3); font-size:13px; color:var(--n9); background:var(--n0);}
.form-input:focus, .form-select:focus, .form-textarea:focus{outline:none; border-color:var(--m600); box-shadow:0 0 0 4px var(--m50);}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-footer{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

.toast-stack{position:fixed; top:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--n10); color:var(--n0); padding:12px 18px; border-radius:16px; font-size:13px; display:flex; align-items:center; gap:9px; animation:toastPop .22s ease; box-shadow:0 12px 28px rgba(0,0,0,.2);}
.toast i{color:var(--m400); flex-shrink:0;}

.loading-line{display:inline-block; width:110px; height:10px; border-radius:6px; background:linear-gradient(90deg, var(--n2) 0%, var(--n3) 50%, var(--n2) 100%); background-size:200px 100%; animation:shimmer 1.1s infinite;}

@media (max-width:980px){
  .feed-layout{flex-direction:column; align-items:stretch;}
  .right-rail{width:100%; position:static;}
  .post-photos{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body data-archetype="feed-timeline">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const NAV = [
  {id:'main', label:'인증 활동 피드', icon:'ph-pulse'},
  {id:'challenge-codes', label:'챌린지 참가 코드 관리', icon:'ph-ticket'},
  {id:'certificates', label:'완주 인증서 발급 관리', icon:'ph-certificate'},
  {id:'curation', label:'큐레이션·배너 관리', icon:'ph-squares-four'},
];

const FEED = [
  {id:1, user:'최유리', climb:'사라오름', time:'3분 전', badge:'30곳 클리어', likes:8, liked:false, tags:['화구호','상급']},
  {id:2, user:'이지은', climb:'물영아리오름', time:'19분 전', badge:null, likes:4, liked:false, tags:['습지']},
  {id:3, user:'오세훈', climb:'안돌오름', time:'44분 전', badge:null, likes:11, liked:true, tags:['삼나무']},
  {id:4, user:'김민수', climb:'아부오름', time:'1시간 전', badge:'첫 등반', likes:15, liked:false, tags:['분화구']},
  {id:5, user:'박서준', climb:'새별오름', time:'2시간 전', badge:null, likes:6, liked:false, tags:['억새']},
  {id:6, user:'정하늘', climb:'백약이오름', time:'3시간 전', badge:null, likes:3, liked:false, tags:['전망']},
];

const RANKING = [
  {name:'최유리', count:52}, {name:'이지은', count:31}, {name:'오세훈', count:19},
  {name:'김민수', count:14}, {name:'박서준', count:9},
];

const CODES = [
  {id:'JJ-2W91K', status:'미사용', issued:'2026.09.01', user:'-'},
  {id:'JJ-7QX3M', status:'사용', issued:'2026.08.28', user:'최유리'},
  {id:'JJ-4TL08', status:'사용', issued:'2026.08.20', user:'이지은'},
  {id:'JJ-9B2CP', status:'만료', issued:'2026.06.02', user:'-'},
  {id:'JJ-1RZ55', status:'미사용', issued:'2026.09.05', user:'-'},
];

const CERTS = [
  {id:1, user:'최유리', milestone:100, status:'발급대기', requested:'2026.09.08'},
  {id:2, user:'이지은', milestone:30, status:'승인완료', requested:'2026.08.30'},
  {id:3, user:'오세훈', milestone:30, status:'발급완료', requested:'2026.08.11'},
];

const CURATION = [
  {id:1, name:'가을 억새 코스 추천', period:'09.01~09.30', seed:'curation-a'},
  {id:2, name:'초보자를 위한 오름 5선', period:'상시', seed:'curation-b'},
  {id:3, name:'화구호 트레킹 특집', period:'09.10~10.10', seed:'curation-c'},
];

function I({name, size=16}){ return <i className={"ph "+name} style={{fontSize:size, lineHeight:1}}></i>; }

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t=>(<div className="toast" key={t.id}><I name="ph-check-circle"/>{t.text}</div>))}
    </div>
  );
}

function FeedScreen({pushToast}){
  const [posts, setPosts] = useState(FEED);
  const [filter, setFilter] = useState('전체');
  const filtered = filter==='전체' ? posts : posts.filter(p=>p.badge);

  function toggleLike(id){
    setPosts(prev=>prev.map(p=> p.id===id ? {...p, liked:!p.liked, likes: p.liked? p.likes-1 : p.likes+1} : p));
  }

  return (
    <div className="page">
      <div className="page-inner">
        <div className="page-header">
          <div style={{display:'flex', alignItems:'baseline', gap:12, marginBottom:6}}>
            <span style={{fontSize:38, fontWeight:800, color:'var(--n10)', lineHeight:1}}>18</span>
            <span className="page-title" style={{marginBottom:0}}>건, 오늘 새로 인증되었습니다</span>
          </div>
          <div className="page-desc">전체 사용자의 등반 인증 활동을 실시간으로 모니터링합니다</div>
        </div>
        <div className="feed-layout">
          <div className="feed-main">
            <div className="composer" style={{borderRadius:'20', boxShadow:'0 14px 30px rgba(45,44,43,0.10)'}}>
              <div className="composer-row">
                <I name="ph-funnel"/>
                <span style={{fontSize:12.5, fontWeight:700, color:'var(--n7)'}}>피드 필터</span>
              </div>
              <div className="filter-chips">
                <button className={"chip-btn"+(filter==='전체'?' active':'')} onClick={()=>setFilter('전체')}>전체</button>
                <button className={"chip-btn"+(filter==='배지'?' active':'')} onClick={()=>setFilter('배지')}>배지 획득만</button>
              </div>
            </div>
            {filtered.map((p,i)=>(
              <article className="post" key={p.id} style={{animationDelay:(i*45)+'ms'}}>
                <div className="post-head">
                  <div className="avatar">{p.user.slice(0,1)}</div>
                  <span className="author">{p.user}</span>
                  <time>{p.time}</time>
                </div>
                <div className="post-body">{p.user}님이 <b>{p.climb}</b> 등반 인증을 완료했습니다.</div>
                <div className="post-photos">
                  <img src={`https://picsum.photos/seed/oreum2-${p.id}-1/300/300`} alt="인증 사진"/>
                  <img src={`https://picsum.photos/seed/oreum2-${p.id}-2/300/300`} alt="인증 사진"/>
                  <img src={`https://picsum.photos/seed/oreum2-${p.id}-3/300/300`} alt="인증 사진"/>
                </div>
                <div className="post-tags">
                  {p.tags.map(t=><span className="tag" key={t}>{t}</span>)}
                </div>
                <div className="post-actions">
                  <button className={"post-action-btn like"+(p.liked?' liked':'')} onClick={()=>toggleLike(p.id)}>
                    <I name={p.liked ? 'ph-heart-fill' : 'ph-heart'}/>공감 {p.likes}
                  </button>
                  <button className="post-action-btn comment" onClick={()=>pushToast('메모가 저장되었습니다')}><I name="ph-note-pencil"/>메모</button>
                  <button className="post-action-btn share" onClick={()=>pushToast('활동 링크가 복사되었습니다')}><I name="ph-share-network"/>공유</button>
                  {p.badge && <span className="badge-earn"><I name="ph-medal" size={13}/>{p.badge}</span>}
                </div>
              </article>
            ))}
          </div>
          <aside className="right-rail">
            <div className="rail-card">
              <div className="rail-card-title"><I name="ph-trophy"/>이번 달 랭킹</div>
              {RANKING.map((r,i)=>(
                <div className="rank-row" key={r.name}>
                  <span className={"rank-num"+(i===0?' top':'')}>{i+1}</span>
                  <span className="rank-name">{r.name}</span>
                  <span className="rank-count">{r.count}곳</span>
                </div>
              ))}
            </div>
            <div className="rail-card">
              <div className="rail-card-title"><I name="ph-chart-line-up"/>오늘 요약</div>
              <div className="mini-stat-row">신규 인증<b>18건</b></div>
              <div className="mini-stat-row">배지 발급<b>5건</b></div>
              <div className="mini-stat-row">참여 오름<b>12곳</b></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  );
}

function ChallengeCodesScreen({pushToast}){
  const [codes, setCodes] = useState(CODES);
  const [status, setStatus] = useState('전체');
  const [modalOpen, setModalOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const [qty, setQty] = useState(50);

  const statuses = ['전체','미사용','사용','만료'];
  const filtered = codes.filter(c=> status==='전체' || c.status===status);

  function badgeOf(s){
    if(s==='사용') return <span className="badge badge-ok"><I name="ph-check" size={12}/>사용</span>;
    if(s==='만료') return <span className="badge badge-danger"><I name="ph-x" size={12}/>만료</span>;
    return <span className="badge badge-warn">미사용</span>;
  }

  function issue(){
    const created = Array.from({length: Math.min(qty,5)}).map((_,i)=>({
      id:'JJ-'+Math.random().toString(36).slice(2,7).toUpperCase(), status:'미사용', issued:'2026.09.09', user:'-'
    }));
    setCodes(prev=>[...created, ...prev]);
    pushToast(`참가 코드 ${qty}개가 발급되었습니다`);
    setModalOpen(false);
  }

  return (
    <div className="page">
      <div className="page-inner">
        <div className="page-header">
          <div className="page-title">챌린지 참가 코드 관리</div>
          <div className="page-desc">네이버 스토어 판매 코드의 발급·검증·사용 이력을 관리합니다 · 전체 {codes.length}개</div>
        </div>
        <div className="filter-bar">
          {statuses.map(s=>(<button key={s} className={"chip-btn"+(status===s?' active':'')} onClick={()=>setStatus(s)}>{s}</button>))}
          <div style={{flex:1}}/>
          <button className="btn-primary" onClick={()=>setModalOpen(true)}><I name="ph-plus"/>코드 일괄 발급</button>
        </div>
        <div className="card-panel">
          <table className="data-table">
            <thead><tr><th>코드</th><th>상태</th><th>발급일</th><th>사용자</th></tr></thead>
            <tbody>
              {filtered.map((c,i)=>(
                <tr key={c.id} style={{animationDelay:(i*30)+'ms'}} onClick={()=>setDetail(c)}>
                  <td style={{fontWeight:700, color:'var(--n9)', fontFamily:'monospace'}}>{c.id}</td>
                  <td>{badgeOf(c.status)}</td>
                  <td>{c.issued}</td>
                  <td>{c.user}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {modalOpen && (
        <div className="overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">참가 코드 일괄 발급</div>
              <button className="modal-close" onClick={()=>setModalOpen(false)}><I name="ph-x"/></button></div>
            <div className="form-grid2">
              <div className="form-row"><label className="form-label">발급 수량</label>
                <input className="form-input" type="number" value={qty} onChange={e=>setQty(Number(e.target.value))}/></div>
              <div className="form-row"><label className="form-label">유효기간</label>
                <input className="form-input" type="date" defaultValue="2026-12-31"/></div>
            </div>
            <div className="modal-footer">
              <button className="btn-ghost" onClick={()=>setModalOpen(false)}>취소</button>
              <button className="btn-primary" onClick={issue}>발급</button>
            </div>
          </div>
        </div>
      )}

      {detail && (
        <div className="overlay" onClick={()=>setDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">코드 상세</div>
              <button className="modal-close" onClick={()=>setDetail(null)}><I name="ph-x"/></button></div>
            <div className="form-row"><label className="form-label">코드</label><div style={{fontFamily:'monospace', fontWeight:700}}>{detail.id}</div></div>
            <div className="form-row"><label className="form-label">상태</label>{badgeOf(detail.status)}</div>
            <div className="form-row"><label className="form-label">발급일</label>{detail.issued}</div>
            <div className="form-row"><label className="form-label">사용자</label>{detail.user}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function CertificatesScreen({pushToast}){
  const [certs, setCerts] = useState(CERTS);
  const [selected, setSelected] = useState([]);
  const [issuingId, setIssuingId] = useState(null);

  function toggle(id){ setSelected(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]); }

  function approveOne(id){
    setIssuingId(id);
    setTimeout(()=>{
      setCerts(prev=>prev.map(c=> c.id===id ? {...c, status:'발급완료'} : c));
      setIssuingId(null);
      pushToast('고유번호가 포함된 인증서가 생성되었습니다');
    }, 1400);
  }
  function bulkApprove(){
    const targets = certs.filter(c=>selected.includes(c.id) && c.status==='발급대기');
    setCerts(prev=>prev.map(c=> targets.find(t=>t.id===c.id) ? {...c, status:'승인완료'} : c));
    pushToast(`${targets.length}건 일괄 승인 완료`);
    setSelected([]);
  }

  function badgeOf(s){
    if(s==='발급완료') return <span className="badge badge-ok"><I name="ph-check-circle" size={12}/>발급완료</span>;
    if(s==='승인완료') return <span className="badge badge-main">승인완료</span>;
    return <span className="badge badge-warn">발급대기</span>;
  }

  return (
    <div className="page">
      <div className="page-inner">
        <div className="page-header">
          <div className="page-title">완주 인증서 발급 관리</div>
          <div className="page-desc">30곳·100곳 완주 조건을 충족한 이용자의 인증서 발급을 승인합니다</div>
        </div>
        <div className="filter-bar">
          <span style={{fontSize:12.5, color:'var(--n7)'}}>{selected.length}건 선택됨</span>
          <div style={{flex:1}}/>
          <button className="btn-primary" onClick={bulkApprove} disabled={selected.length===0} style={{opacity:selected.length? 1:.45}}>
            <I name="ph-checks"/>선택 건 일괄 승인
          </button>
        </div>
        <div className="card-panel">
          <table className="data-table">
            <thead><tr><th style={{width:36}}></th><th>이용자</th><th>완주 마일스톤</th><th>신청일</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {certs.map((c,i)=>(
                <tr key={c.id} style={{animationDelay:(i*30)+'ms'}}>
                  <td onClick={e=>e.stopPropagation()}><input className="row-check" type="checkbox" checked={selected.includes(c.id)} onChange={()=>toggle(c.id)}/></td>
                  <td style={{fontWeight:700, color:'var(--n9)'}}>{c.user}</td>
                  <td><span className="badge badge-main">{c.milestone}곳 완주</span></td>
                  <td>{c.requested}</td>
                  <td>{issuingId===c.id ? <span className="loading-line"></span> : badgeOf(c.status)}</td>
                  <td>{c.status==='발급대기' && issuingId!==c.id && (
                    <button className="btn-ghost" style={{padding:'6px 12px', fontSize:12}} onClick={()=>approveOne(c.id)}>승인</button>
                  )}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function CurationScreen({pushToast}){
  const [items, setItems] = useState(CURATION);
  const [dragId, setDragId] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState({name:'', period:''});

  function onDrop(targetId){
    if(dragId===null || dragId===targetId) return;
    setItems(prev=>{
      const arr = [...prev];
      const from = arr.findIndex(x=>x.id===dragId);
      const to = arr.findIndex(x=>x.id===targetId);
      const [moved] = arr.splice(from,1);
      arr.splice(to,0,moved);
      return arr;
    });
    pushToast('노출 순서가 변경되었습니다');
    setDragId(null);
  }

  function addItem(){
    setItems(prev=>[{id:Date.now(), name:form.name, period:form.period||'상시', seed:'curation-'+Date.now()}, ...prev]);
    pushToast('큐레이션 항목이 등록되었습니다');
    setModalOpen(false); setForm({name:'', period:''});
  }

  return (
    <div className="page">
      <div className="page-inner">
        <div className="page-header">
          <div className="page-title">큐레이션·배너 관리</div>
          <div className="page-desc">홈 화면에 노출할 추천 오름 큐레이션과 배너 순서를 드래그로 관리합니다</div>
        </div>
        <div className="filter-bar">
          <span style={{fontSize:12.5, color:'var(--n7)'}}><I name="ph-arrows-down-up" size={13}/> 항목을 드래그해 순서를 바꿉니다</span>
          <div style={{flex:1}}/>
          <button className="btn-primary" onClick={()=>setModalOpen(true)}><I name="ph-plus"/>큐레이션 등록</button>
        </div>
        <div className="card-panel curation-list">
          {items.map((it,i)=>(
            <div key={it.id} className={"curation-item"+(dragId===it.id?' dragging':'')}
              draggable
              onDragStart={()=>setDragId(it.id)}
              onDragOver={e=>e.preventDefault()}
              onDrop={()=>onDrop(it.id)}>
              <I name="ph-dots-six-vertical" size={18}/>
              <div className="priority-dot">{i+1}</div>
              <img className="curation-thumb" src={`https://picsum.photos/seed/${it.seed}/120/120`} alt="배너 썸네일"/>
              <div className="curation-meta">
                <div className="curation-name">{it.name}</div>
                <div className="curation-sub">노출 기간 · {it.period}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {modalOpen && (
        <div className="overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><div className="modal-title">큐레이션 등록</div>
              <button className="modal-close" onClick={()=>setModalOpen(false)}><I name="ph-x"/></button></div>
            <div className="form-row"><label className="form-label">제목</label>
              <input className="form-input" value={form.name} onChange={e=>setForm({...form, name:e.target.value})}/></div>
            <div className="form-row"><label className="form-label">노출 기간</label>
              <input className="form-input" placeholder="예: 09.10~10.10 또는 상시" value={form.period} onChange={e=>setForm({...form, period:e.target.value})}/></div>
            <div className="modal-footer">
              <button className="btn-ghost" onClick={()=>setModalOpen(false)}>취소</button>
              <button className="btn-primary" onClick={addItem}>등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(text){
    const id = Date.now();
    setToasts(prev=>[...prev, {id, text}]);
    setTimeout(()=> setToasts(prev=>prev.filter(t=>t.id!==id)), 2600);
  }

  return (
    <div className="app-shell">
      <header className="topnav">
        <div className="brand">
          <div className="brand-mark"><I name="ph-mountains" size={19}/></div>
          <div>
            <div className="brand-text">오름 챌린지 플랫폼</div>
            <div className="brand-sub">커뮤니티·랭킹 확장 콘솔</div>
          </div>
        </div>
        <nav className="topnav-tabs">
          {NAV.map(n=>(
            <button key={n.id} className={"topnav-tab"+(screen===n.id?' active':'')} onClick={()=>setScreen(n.id)}>
              <I name={n.icon} size={15}/>{n.label}
            </button>
          ))}
        </nav>
        <div className="topnav-right">
          <button className="btn-ghost" onClick={()=>pushToast('새 알림이 없습니다')}><I name="ph-bell"/></button>
          <div className="profile-chip">관</div>
        </div>
      </header>

      {screen==='main' && <FeedScreen key="main" pushToast={pushToast}/>}
      {screen==='challenge-codes' && <ChallengeCodesScreen key="challenge-codes" pushToast={pushToast}/>}
      {screen==='certificates' && <CertificatesScreen key="certificates" pushToast={pushToast}/>}
      {screen==='curation' && <CurationScreen key="curation" pushToast={pushToast}/>}

      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
