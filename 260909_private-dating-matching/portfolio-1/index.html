<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리베오 — 프리미엄 프라이빗 매칭 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 210°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbebfb; --m200:#b8d7f7; --m300:#8cbff2; --m400:#5ca4ed;
  --m500:#2e8be8; --m600:#0071e3; --m700:#005dba; --m800:#004891; --m900:#003366;
  --n0:#f2f2f4; --n1:#fdfdfd; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#8f8f8f; --n7:#71757a; --n8:#53575a; --n9:#36383a; --n10:#1e1f20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body,#root{width:100%; min-height:100vh;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--n0); color:var(--n9); font-weight:350; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
a{text-decoration:none; color:inherit;}
img{display:block;}
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes drawerSlideIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
@keyframes pulseDot{ 0%{box-shadow:0 0 0 0 rgba(31,137,75,.45);} 70%{box-shadow:0 0 0 6px rgba(31,137,75,0);} 100%{box-shadow:0 0 0 0 rgba(31,137,75,0);} }
@keyframes toastSlide{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes scaleIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }

.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* ── header / search ── */
.search-header{position:sticky; top:0; z-index:40; background:rgba(253,253,253,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--n3);}
.header-row{max-width:1360px; margin:0 auto; display:flex; align-items:center; gap:28px; padding:18px 32px;}
.brand{display:flex; align-items:center; gap:8px; font-size:20px; font-weight:460; letter-spacing:-.02em; color:var(--n9); flex-shrink:0;}
.brand .brand-mark{width:30px; height:30px; border-radius:9px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff;}
.search-bar{flex:1; display:flex; align-items:center; background:var(--n1); border:1px solid var(--n3); border-radius:999px; padding:4px; box-shadow:0 1px 2px rgba(0,0,0,.03); max-width:560px; position:relative;}
.search-segment{flex:1; text-align:left; padding:9px 20px; border-radius:999px; transition:background .15s;}
.search-segment:hover{background:var(--n2);}
.search-segment.active{background:var(--n2);}
.segment-label{font-size:11px; color:var(--n7); font-weight:500;}
.segment-value{font-size:13px; color:var(--n9); font-weight:500; margin-top:2px;}
.search-divider{width:1px; height:24px; background:var(--n3);}
.search-submit{width:38px; height:38px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.segment-panel{position:absolute; top:52px; background:var(--n1); border:1px solid var(--n3); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.1); padding:10px; z-index:50; min-width:180px; animation:scaleIn .15s ease-out;}
.segment-option{padding:9px 12px; border-radius:8px; font-size:13px; color:var(--n8); text-align:left; width:100%;}
.segment-option:hover{background:var(--n2);}
.segment-option.selected{background:var(--m50); color:var(--m700); font-weight:500;}
.header-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.nav-link{padding:9px 16px; border-radius:10px; font-size:14px; font-weight:500; color:var(--n7); display:flex; align-items:center; gap:6px; transition:background .15s,color .15s;}
.nav-link:hover{background:var(--n2); color:var(--n9);}
.nav-link.active{background:var(--m50); color:var(--m700);}
.user-menu{width:38px; height:38px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n7); margin-left:4px;}

.filter-chips{max-width:1360px; margin:0 auto; display:flex; gap:8px; padding:0 32px 16px; overflow-x:auto;}
.chip{display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:999px; border:1px solid var(--n3); background:var(--n1); font-size:13px; font-weight:500; color:var(--n7); flex-shrink:0; transition:.15s;}
.chip:hover{border-color:var(--n5);}
.chip[data-active="true"]{background:var(--n9); border-color:var(--n9); color:#fff;}

/* ── exposure banner ── */
.exposure-banner{max-width:1360px; margin:20px auto 0; padding:0 32px; display:flex; align-items:center; justify-content:space-between;}
.exposure-left{display:flex; align-items:center; gap:12px;}
.exposure-title{font-size:15px; font-weight:460; color:var(--n9);}
.exposure-sub{font-size:12.5px; color:var(--n7); margin-top:2px;}
.exposure-track{width:160px; height:6px; border-radius:99px; background:var(--n3); overflow:hidden;}
.exposure-fill{height:100%; background:var(--m600); border-radius:99px; transition:width .4s ease;}

/* ── grid ── */
.main{max-width:1360px; margin:0 auto; width:100%; padding:20px 32px 64px; flex:1;}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:22px; margin-top:18px;}
.listing-card{background:var(--n1); border:1px solid var(--n3); border-radius:18px; overflow:hidden; animation:fadeInUp .45s ease backwards; transition:transform .2s ease, box-shadow .2s ease; cursor:pointer;}
.listing-card:hover{transform:translateY(-4px); box-shadow:0 16px 32px rgba(0,0,0,.08);}
.card-image-wrap{position:relative; width:100%; aspect-ratio:3/4; background:var(--n2); overflow:hidden;}
.card-image-wrap img{width:100%; height:100%; object-fit:cover;}
.card-verified-badge{position:absolute; top:12px; left:12px; background:rgba(253,253,253,.92); backdrop-filter:blur(4px); border-radius:999px; padding:5px 10px 5px 8px; display:flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; color:var(--s1-text);}
.card-online-dot{position:absolute; top:14px; right:14px; width:11px; height:11px; border-radius:50%; background:var(--s1); animation:pulseDot 2s infinite;}
.card-favorite{position:absolute; bottom:12px; right:12px; width:36px; height:36px; border-radius:50%; background:rgba(253,253,253,.92); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; color:var(--n8); transition:.15s;}
.card-favorite:hover{background:#fff; color:var(--m600);}
.card-favorite.sent{color:var(--m600);}
.card-body{padding:16px 16px 18px;}
.card-row-1{display:flex; align-items:baseline; justify-content:space-between;}
.card-title{font-size:16px; font-weight:600; color:var(--n9);}
.card-meta{font-size:12.5px; color:var(--n7); margin-top:5px; display:block;}
.card-tag{display:inline-block; margin-top:10px; font-size:11.5px; font-weight:500; color:var(--n7); background:var(--n2); padding:4px 10px; border-radius:999px;}

/* ── drawer ── */
.drawer-overlay{position:fixed; inset:0; background:rgba(20,22,24,.4); z-index:80; display:flex; justify-content:flex-end;}
.drawer{width:min(420px,92vw); height:100%; background:var(--n1); overflow-y:auto; animation:drawerSlideIn .3s cubic-bezier(.16,1,.3,1);}
.drawer-close{position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n8); z-index:2;}
.drawer-hero{position:relative; width:100%; aspect-ratio:1/1; background:var(--n2);}
.drawer-hero img{width:100%; height:100%; object-fit:cover;}
.drawer-body{padding:22px 24px 32px;}
.drawer-name{font-size:22px; font-weight:600; color:var(--n9);}
.drawer-sub{font-size:13.5px; color:var(--n7); margin-top:4px;}
.badge-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.verify-badge{display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:6px 11px; border-radius:999px; background:var(--s1-bg); color:var(--s1-text);}
.verify-badge.muted{background:var(--n2); color:var(--n7);}
.drawer-bio{font-size:14px; line-height:1.65; color:var(--n8); margin-top:18px;}
.meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; padding-top:20px; border-top:1px solid var(--n3);}
.meta-item-label{font-size:11.5px; color:var(--n7);}
.meta-item-value{font-size:13.5px; font-weight:500; color:var(--n9); margin-top:3px;}
.drawer-cta{margin-top:26px; width:100%; padding:15px; border-radius:14px; background:var(--m600); color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
.drawer-cta:hover{background:var(--m700);}
.drawer-cta:disabled{background:var(--n4); cursor:not-allowed;}
.drawer-cta.sent{background:var(--n2); color:var(--n7);}

/* ── toast ── */
.toast{position:fixed; bottom:32px; left:50%; background:var(--n9); color:#fff; padding:13px 22px; border-radius:12px; font-size:13.5px; font-weight:500; z-index:100; display:flex; align-items:center; gap:8px; animation:toastSlide .25s ease-out; box-shadow:0 12px 28px rgba(0,0,0,.22);}

/* ── sub screens shared ── */
.screen-wrap{max-width:1120px; margin:0 auto; width:100%; padding:36px 32px 72px;}
.screen-head{margin-bottom:28px;}
.screen-title{font-size:26px; font-weight:600; letter-spacing:-.02em; color:var(--n9);}
.screen-desc{font-size:14px; color:var(--n7); margin-top:8px; line-height:1.6;}
.panel{background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:26px;}
.section-gap{margin-top:22px;}

/* verification */
.stepper{display:flex; align-items:center; gap:0; margin-bottom:28px;}
.step-node{display:flex; align-items:center; gap:10px;}
.step-dot{width:30px; height:30px; border-radius:50%; background:var(--n3); color:var(--n7); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.step-dot.done{background:var(--s1); color:#fff;}
.step-dot.current{background:var(--m600); color:#fff;}
.step-dot.rejected{background:var(--s2); color:#fff;}
.step-label{font-size:13px; font-weight:500; color:var(--n7); white-space:nowrap;}
.step-label.active{color:var(--n9); font-weight:600;}
.step-line{flex:1; height:2px; background:var(--n3); margin:0 12px; min-width:24px;}
.doc-row{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--n3);}
.doc-row:last-child{border-bottom:none;}
.doc-left{display:flex; align-items:center; gap:14px;}
.doc-icon{width:42px; height:42px; border-radius:12px; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n7); flex-shrink:0;}
.doc-name{font-size:14.5px; font-weight:500; color:var(--n9);}
.doc-file{font-size:12px; color:var(--n7); margin-top:2px;}
.status-pill{font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px;}
.status-pill.wait{background:var(--n2); color:var(--n7);}
.status-pill.ok{background:var(--s1-bg); color:var(--s1-text);}
.lock-banner{display:flex; gap:14px; align-items:flex-start; background:var(--s3-bg); border:1px solid var(--s3); border-radius:14px; padding:18px; margin-top:24px;}
.lock-banner .lb-icon{color:var(--s3-text); flex-shrink:0; margin-top:2px;}
.lock-banner-title{font-size:14px; font-weight:600; color:var(--s3-text);}
.lock-banner-desc{font-size:12.5px; color:var(--n8); margin-top:4px; line-height:1.55;}
.sim-row{display:flex; gap:8px; margin-top:18px;}
.sim-btn{padding:9px 16px; border-radius:10px; font-size:13px; font-weight:500; border:1px solid var(--n3); color:var(--n7); background:var(--n1);}
.sim-btn.active{background:var(--n9); border-color:var(--n9); color:#fff;}
.reject-box{margin-top:18px; padding:16px; background:var(--s2-bg); border-radius:12px; font-size:13px; color:var(--s2-text); line-height:1.6;}
.reject-box button{margin-top:10px; background:var(--n9); color:#fff; padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:500;}

/* match */
.tab-row{display:flex; gap:4px; background:var(--n2); padding:4px; border-radius:12px; width:fit-content; margin-bottom:20px;}
.tab-btn{padding:9px 18px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--n7);}
.tab-btn.active{background:var(--n1); color:var(--n9); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.match-row{display:flex; align-items:center; gap:14px; padding:15px 6px; border-bottom:1px solid var(--n3);}
.match-row:last-child{border-bottom:none;}
.match-avatar{width:52px; height:52px; border-radius:14px; object-fit:cover; flex-shrink:0;}
.match-info{flex:1; min-width:0;}
.match-name{font-size:14.5px; font-weight:600; color:var(--n9);}
.match-meta{font-size:12px; color:var(--n7); margin-top:2px;}
.match-actions{display:flex; gap:8px; flex-shrink:0;}
.btn-ghost{padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:500; border:1px solid var(--n3); color:var(--n7);}
.btn-primary-sm{padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:600; background:var(--m600); color:#fff;}
.btn-primary-sm:hover{background:var(--m700);}
.status-tag{font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; flex-shrink:0;}
.status-tag.pending{background:var(--n2); color:var(--n7);}
.status-tag.matched{background:var(--s1-bg); color:var(--s1-text);}

/* chat */
.chat-overlay{position:fixed; inset:0; background:rgba(20,22,24,.4); z-index:90; display:flex; align-items:center; justify-content:center;}
.chat-modal{width:min(420px,92vw); height:min(600px,86vh); background:var(--n1); border-radius:20px; display:flex; flex-direction:column; overflow:hidden; animation:scaleIn .2s ease-out;}
.chat-head{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--n3);}
.chat-head img{width:38px; height:38px; border-radius:10px; object-fit:cover;}
.chat-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:75%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.5;}
.msg.me{align-self:flex-end; background:var(--m600); color:#fff; border-bottom-right-radius:4px;}
.msg.them{align-self:flex-start; background:var(--n2); color:var(--n9); border-bottom-left-radius:4px;}
.chat-input-row{display:flex; gap:8px; padding:14px; border-top:1px solid var(--n3);}
.chat-input-row input{flex:1; border:1px solid var(--n3); border-radius:999px; padding:10px 16px; font-size:13.5px; font-family:inherit;}
.chat-send{width:40px; height:40px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* payment */
.balance-card{background:linear-gradient(135deg,var(--m800),var(--m600)); border-radius:20px; padding:28px 30px; color:#fff;}
.balance-label{font-size:13px; opacity:.8;}
.balance-value{font-size:36px; font-weight:600; margin-top:8px; letter-spacing:-.02em;}
.charge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-top:22px;}
.charge-card{border:1px solid var(--n3); border-radius:16px; padding:18px; text-align:center; background:var(--n1); transition:.15s;}
.charge-card:hover{border-color:var(--m400); transform:translateY(-2px);}
.charge-points{font-size:19px; font-weight:700; color:var(--n9);}
.charge-price{font-size:12.5px; color:var(--n7); margin-top:4px;}
.charge-btn{margin-top:12px; width:100%; padding:9px; border-radius:9px; background:var(--n9); color:#fff; font-size:12.5px; font-weight:600;}
.history-tabs{display:flex; gap:4px; background:var(--n2); padding:4px; border-radius:10px; width:fit-content; margin:26px 0 4px;}
.history-row{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--n3); font-size:13.5px;}
.history-row:last-child{border-bottom:none;}
.history-left{display:flex; align-items:center; gap:12px;}
.history-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.history-icon.plus{background:var(--s1-bg); color:var(--s1-text);}
.history-icon.minus{background:var(--n2); color:var(--n7);}
.history-amount.plus{color:var(--s1-text); font-weight:600;}
.history-amount.minus{color:var(--n8); font-weight:600;}

.confirm-overlay{position:fixed; inset:0; background:rgba(20,22,24,.4); z-index:95; display:flex; align-items:center; justify-content:center;}
.confirm-box{width:min(340px,88vw); background:var(--n1); border-radius:18px; padding:26px; text-align:center; animation:scaleIn .2s ease-out;}
.confirm-title{font-size:16px; font-weight:600; color:var(--n9);}
.confirm-desc{font-size:13px; color:var(--n7); margin-top:8px; line-height:1.55;}
.confirm-actions{display:flex; gap:8px; margin-top:20px;}
.confirm-actions button{flex:1; padding:11px; border-radius:10px; font-size:13.5px; font-weight:600;}
.confirm-cancel{background:var(--n2); color:var(--n8);}
.confirm-ok{background:var(--m600); color:#fff;}

.footer{border-top:1px solid var(--n3); padding:36px 32px; background:var(--n1);}
.footer-cols{max-width:1360px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:24px;}
.footer-col h4{font-size:12.5px; font-weight:600; color:var(--n9); margin-bottom:10px;}
.footer-col a{display:block; font-size:12.5px; color:var(--n7); margin-bottom:7px;}

@media (max-width:920px){
  .search-bar{display:none;}
  .header-row{gap:8px; padding:14px 16px;}
  .nav-link span.label{display:none;}
  .nav-link{padding:9px 10px;}
  .header-nav{gap:0;}
  .exposure-banner, .main, .filter-chips{padding-left:16px; padding-right:16px;}
}
@media (max-width:420px){
  .brand{font-size:0;}
  .brand .brand-mark{font-size:14px;}
  .exposure-track{width:96px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const PROFILES = [
  {id:1, name:'서연', age:29, job:'변호사', cat:'전문직', region:'서울 강남', verified:true, online:true, isNew:false, premium:true, bio:'국내 로펌 변호사로 근무 중이며, 조용한 취미 생활과 미술 전시 관람을 즐깁니다. 진지한 만남을 우선으로 생각합니다.'},

function avatarUrl(name, size){
  return `https://source.boringavatars.com/marble/${size}/${encodeURIComponent(name)}?colors=003366,0071e3,5ca4ed,b8d7f7,eff0f0`;
}

function Icon({name, size=18}){
  return <i data-lucide={name} style={{width:size, height:size}}></i>;
}

function useLucide(deps){
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
}

function Header({screen, setScreen, exposureUsed, exposureTotal, filters, setFilters}){
  const [openSeg, setOpenSeg] = useState(null);
  useLucide();
  const options = {region:REGIONS, age:AGES, job:JOBS};
  const values = {region:filters.region, age:filters.age, job:filters.job};
  const labels = {region:'지역', age:'연령대', job:'직업군'};

  function pick(seg, val){
    setFilters(f=>({...f, [seg]:val}));
    setOpenSeg(null);
  }

  return (
    <header className="search-header">
      <div className="header-row">
        <button className="brand" onClick={()=>setScreen('main')}>
          <span className="brand-mark"><Icon name="gem" size={16}/></span>
          프리베오
        </button>
        {screen==='main' &&
        <div className="search-bar">
          {['region','age','job'].map((seg,i)=>(
            <React.Fragment key={seg}>
              {i>0 && <div className="search-divider"/>}
              <button className={`search-segment ${openSeg===seg?'active':''}`} onClick={()=>setOpenSeg(openSeg===seg?null:seg)}>
                <div className="segment-label">{labels[seg]}</div>
                <div className="segment-value">{values[seg]}</div>
              </button>
              {openSeg===seg &&
              <div className="segment-panel" style={{left: seg==='region'?0:seg==='age'?'34%':'68%'}}>
                {options[seg].map(opt=>(
                  <button key={opt} className={`segment-option ${values[seg]===opt?'selected':''}`} onClick={()=>pick(seg,opt)}>{opt}</button>
                ))}
              </div>}
            </React.Fragment>
          ))}
          <button className="search-submit" onClick={()=>setOpenSeg(null)}><Icon name="search" size={16}/></button>
        </div>}
        <nav className="header-nav">
          <button className={`nav-link ${screen==='main'?'active':''}`} onClick={()=>setScreen('main')}><Icon name="layout-grid" size={15}/><span className="label">매칭 홈</span></button>
          <button className={`nav-link ${screen==='verification'?'active':''}`} onClick={()=>setScreen('verification')}><Icon name="badge-check" size={15}/><span className="label">본인 인증</span></button>
          <button className={`nav-link ${screen==='match'?'active':''}`} onClick={()=>setScreen('match')}><Icon name="heart" size={15}/><span className="label">호감 & 매칭</span></button>
          <button className={`nav-link ${screen==='payment'?'active':''}`} onClick={()=>setScreen('payment')}><Icon name="coins" size={15}/><span className="label">포인트 충전</span></button>
          <button className="user-menu" onClick={()=>setScreen('verification')}><Icon name="user" size={16}/></button>
        </nav>
      </div>
      {screen==='main' &&
      <div className="exposure-banner">
        <div className="exposure-left">
          <div>
            <div className="exposure-title">오늘의 매칭 카드</div>
            <div className="exposure-sub">{exposureUsed} / {exposureTotal} 열람 · 자정에 초기화됩니다</div>
          </div>
        </div>
        <div className="exposure-track"><div className="exposure-fill" style={{width:`${(exposureUsed/exposureTotal)*100}%`}}/></div>
      </div>}
    </header>
  );
}

            <div><div className="meta-item-label">직업</div><div className="meta-item-value">{profile.job}</div></div>
            <div><div className="meta-item-label">분류</div><div className="meta-item-value">{profile.cat}</div></div>

function MainScreen({filters, chip, setChip, onOpen, sentIds, onSend, exposureUsed, exposureTotal}){
  const filtered = useMemo(()=>{
    return PROFILES.filter(p=>{
      if(chip==='verified') return p.verified;
      if(chip==='online') return p.online;
      if(chip==='new') return p.isNew;
      if(chip==='premium') return p.premium;
      if(chip!=='all') return p.cat===chip;
      return true;
    });
  },[chip]);

  return (
    <div className="main">
      <FilterChipsSection chip={chip} setChip={setChip}/>
      <div className="card-grid">
        {filtered.map((p,i)=>(
          <div key={p.id} style={{animationDelay:`${i*0.03}s`}}>
            <ProfileCard p={p} onOpen={onOpen} sent={sentIds.includes(p.id)} onSend={onSend}/>
          </div>
        ))}
      </div>
    </div>
  );
}

function MatchScreen(){
  const [tab, setTab] = useState('matched');
  const [received, setReceived] = useState(RECEIVED_LIST);
  const [chatWith, setChatWith] = useState(null);
  useLucide();

  function respond(id, accept){
    setReceived(list=>list.map(r=>r.id===id?{...r, status:accept?'매칭성사':'거절됨'}:r));
  }

  return (
    <div className="screen-wrap">
      <div className="screen-head">
        <div className="screen-title">호감 & 매칭</div>
        <div className="screen-desc">호감 전송·수락/거절 처리·매칭 성사 후 채팅방 자동 개설까지의 상호작용 흐름을 구현합니다.</div>
      </div>
      <div className="panel">
        <div className="tab-row">
          <button className={`tab-btn ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>보낸 호감</button>
          <button className={`tab-btn ${tab==='received'?'active':''}`} onClick={()=>setTab('received')}>받은 호감</button>
          <button className={`tab-btn ${tab==='matched'?'active':''}`} onClick={()=>setTab('matched')}>매칭됨</button>
        </div>

        {tab==='sent' && SENT_LIST.map(r=>(
          <div className="match-row" key={r.id}>
            <img className="match-avatar" src={avatarUrl(r.name+r.id,120)} alt=""/>
            <div className="match-info"><div className="match-name">{r.name}</div><div className="match-meta">{r.job}</div></div>
            <span className="status-tag pending">{r.status}</span>
          </div>
        ))}

        {tab==='received' && received.map(r=>(
          <div className="match-row" key={r.id}>
            <img className="match-avatar" src={avatarUrl(r.name+r.id,120)} alt=""/>
            <div className="match-info"><div className="match-name">{r.name}</div><div className="match-meta">{r.job}</div></div>
            {r.status==='대기중' ?
            <div className="match-actions">
              <button className="btn-ghost" onClick={()=>respond(r.id,false)}>거절</button>
              <button className="btn-primary-sm" onClick={()=>respond(r.id,true)}>수락</button>
            </div> :
            <span className={`status-tag ${r.status==='매칭성사'?'matched':'pending'}`}>{r.status}</span>}
          </div>
        ))}

        {tab==='matched' && MATCHED_LIST.map(r=>(
          <div className="match-row" key={r.id}>
            <img className="match-avatar" src={avatarUrl(r.name+r.id,120)} alt=""/>
            <div className="match-info"><div className="match-name">{r.name}</div><div className="match-meta">{r.job} · 매칭 확정</div></div>
            <button className="btn-primary-sm" onClick={()=>setChatWith(r)}><Icon name="message-circle" size={13}/> 채팅</button>
          </div>
        ))}
      </div>

      {chatWith && <ChatModal person={chatWith} onClose={()=>setChatWith(null)}/>}
    </div>
  );
}

function ChatModal({person, onClose}){
  const [messages, setMessages] = useState([
    {from:'them', text:`안녕하세요 ${person.name}입니다. 매칭되어 반갑습니다!`},
  ]);
  const [text, setText] = useState('');
  useLucide();

  function send(){
    if(!text.trim()) return;
    setMessages(m=>[...m, {from:'me', text}]);
    setText('');
    setTimeout(()=>{
      setMessages(m=>[...m, {from:'them', text:'네 좋아요, 이번 주말 시간 괜찮으실까요?'}]);
    }, 1000);
  }

  return (
    <div className="chat-overlay" onClick={onClose}>
      <div className="chat-modal" onClick={e=>e.stopPropagation()}>
        <div className="chat-head">
          <img src={avatarUrl(person.name+person.id,80)} alt=""/>
          <div style={{fontWeight:600, fontSize:14}}>{person.name}</div>
          <button style={{marginLeft:'auto'}} onClick={onClose}><Icon name="x" size={17}/></button>
        </div>
        <div className="chat-body">
          {messages.map((m,i)=>(<div key={i} className={`msg ${m.from==='me'?'me':'them'}`}>{m.text}</div>))}
        </div>
        <div className="chat-input-row">
          <input value={text} onChange={e=>setText(e.target.value)} placeholder="메시지를 입력하세요" onKeyDown={e=>e.key==='Enter' && send()}/>
          <button className="chat-send" onClick={send}><Icon name="send" size={16}/></button>
        </div>
      </div>
    </div>
  );
}

const PACKAGES = [
  {p:100, price:'10,000원'},
  {p:330, price:'30,000원'},
  {p:580, price:'50,000원'},
  {p:1200, price:'100,000원'},
  {p:2500, price:'200,000원'},
];

function PaymentScreen({points, setPoints, history, setHistory}){
  const [tab, setTab] = useState('all');
  const [confirmPkg, setConfirmPkg] = useState(null);
  useLucide();

  function confirmCharge(){
    setPoints(p=>p+confirmPkg.p);
    setHistory(h=>[{id:Date.now(), type:'plus', label:'포인트 충전', amount:confirmPkg.p, date:'2026.09.09'}, ...h]);
    setConfirmPkg(null);
  }

  const filtered = tab==='all' ? history : history.filter(h=>h.type===tab);

  return (
    <div className="screen-wrap">
      <div className="screen-head">
        <div className="screen-title">포인트 충전</div>
        <div className="screen-desc">App Store / Google Play 인앱결제 연동 인터페이스와 포인트 원장 기반 잔액·거래내역 관리를 구현합니다.</div>
      </div>
      <div className="balance-card">
        <div className="balance-label">보유 포인트</div>
        <div className="balance-value">{points.toLocaleString()}P</div>
      </div>
      <div className="charge-grid">
        {PACKAGES.map(pk=>(
          <div className="charge-card" key={pk.p}>
            <div className="charge-points">{pk.p}P</div>
            <div className="charge-price">{pk.price}</div>
            <button className="charge-btn" onClick={()=>setConfirmPkg(pk)}>충전하기</button>
          </div>
        ))}
      </div>

      <div className="history-tabs">
        <button className={`tab-btn ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>전체</button>
        <button className={`tab-btn ${tab==='plus'?'active':''}`} onClick={()=>setTab('plus')}>충전</button>
        <button className={`tab-btn ${tab==='minus'?'active':''}`} onClick={()=>setTab('minus')}>사용</button>
      </div>
      <div className="panel" style={{padding:'8px 22px'}}>
        {filtered.map(h=>(
          <div className="history-row" key={h.id}>
            <div className="history-left">
              <div className={`history-icon ${h.type}`}><Icon name={h.type==='plus'?'plus':'heart'} size={15}/></div>
              <div>
                <div style={{fontWeight:500, color:'var(--n9)'}}>{h.label}</div>
                <div style={{fontSize:12, color:'var(--n7)'}}>{h.date}</div>
              </div>
            </div>
            <div className={`history-amount ${h.type}`}>{h.type==='plus'?'+':'-'}{h.amount}P</div>
          </div>
        ))}
      </div>

      {confirmPkg &&
      <div className="confirm-overlay" onClick={()=>setConfirmPkg(null)}>
        <div className="confirm-box" onClick={e=>e.stopPropagation()}>
          <div className="confirm-title">인앱결제로 이동합니다</div>
          <div className="confirm-desc">{confirmPkg.p}P를 {confirmPkg.price}에 충전합니다. App Store/Google Play 영수증 검증 후 즉시 반영됩니다.</div>
          <div className="confirm-actions">
            <button className="confirm-cancel" onClick={()=>setConfirmPkg(null)}>취소</button>
            <button className="confirm-ok" onClick={confirmCharge}>결제 진행</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [chip, setChip] = useState('all');
  const [filters, setFilters] = useState({region:'전체 지역', age:'전체 연령', job:'전체 직업군'});
  const [openProfile, setOpenProfile] = useState(null);
  const [sentIds, setSentIds] = useState([]);
  const [points, setPoints] = useState(340);
  const [toast, setToast] = useState(null);
  const [history, setHistory] = useState([
    {id:1, type:'plus', label:'포인트 충전', amount:580, date:'2026.09.05'},
    {id:2, type:'minus', label:'호감 보내기', amount:20, date:'2026.09.06'},
    {id:3, type:'minus', label:'호감 보내기', amount:20, date:'2026.09.07'},
  ]);
  const exposureUsed = 4, exposureTotal = 12;

  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(null), 2200);
  }

  function handleSend(p){
    if(points < 20){ showToast('포인트가 부족합니다'); return; }
    if(sentIds.includes(p.id)) return;
    setPoints(pt=>pt-20);
    setSentIds(s=>[...s, p.id]);
    setHistory(h=>[{id:Date.now(), type:'minus', label:'호감 보내기', amount:20, date:'2026.09.09'}, ...h]);
    showToast(`${p.name}님에게 호감을 보냈습니다`);
  }

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <Header screen={screen} setScreen={setScreen} exposureUsed={exposureUsed} exposureTotal={exposureTotal} filters={filters} setFilters={setFilters}/>

      {screen==='main' &&
      <MainScreen filters={filters} chip={chip} setChip={setChip} onOpen={setOpenProfile} sentIds={sentIds} onSend={handleSend} exposureUsed={exposureUsed} exposureTotal={exposureTotal}/>}
      {screen==='verification' && <VerificationScreen/>}
      {screen==='match' && <MatchScreen/>}
      {screen==='payment' && <PaymentScreen points={points} setPoints={setPoints} history={history} setHistory={setHistory}/>}

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <h4>프리베오</h4>
            <a>서비스 소개</a>
            <a>인증 절차 안내</a>
          </div>
          <div className="footer-col">
            <h4>이용 안내</h4>
            <a>이용약관</a>
            <a>개인정보처리방침</a>
          </div>
          <div className="footer-col">
            <h4>고객지원</h4>
            <a>자주 묻는 질문</a>
            <a>1:1 문의</a>
          </div>
        </div>
      </footer>

      {openProfile &&
      <QuickView profile={openProfile} onClose={()=>setOpenProfile(null)} sent={sentIds.includes(openProfile.id)} points={points}
        onSend={(p)=>{handleSend(p);}} goPayment={()=>{setOpenProfile(null); setScreen('payment');}}/>}

      {toast && <div className="toast"><Icon name="check-circle" size={16}/>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
