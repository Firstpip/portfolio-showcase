<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리베오 어드민 — 매칭 서비스 통합 운영 백오피스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 300°, light) ── */
:root{
  --m50:#ffefff; --m100:#ffe6ff; --m200:#ffdbff; --m300:#ffd1ff; --m400:#ffc7ff;
  --m500:#d1a3d1; --m600:#a37fa3; --m700:#735a73; --m800:#735a73; --m900:#735a73;
  --n0:#f2f0eb; --n1:#ffffff; --n2:#f0eff0; --n3:#e6e5e6; --n4:#d7d5d7;
  --n5:#bab5ba; --n6:#989098; --n7:#666666; --n8:#5a535a; --n9:#3a363a; --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body,#root{width:100%; min-height:100vh;}
body{font-family:'Pretendard',-apple-system,sans-serif; background:var(--n0); color:var(--n9); font-weight:400; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes scaleIn{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
@keyframes toastSlide{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes pulseDot{ 0%{box-shadow:0 0 0 0 rgba(207,63,63,.4);} 70%{box-shadow:0 0 0 6px rgba(207,63,63,0);} 100%{box-shadow:0 0 0 0 rgba(207,63,63,0);} }

.app-shell{width:100%; min-height:100vh; display:flex;}

/* ── sidebar (linear-sidebar-cmdk) ── */
.sidebar{position:fixed; left:0; top:0; bottom:0; width:264px; background:var(--n1); border-right:1px solid var(--n3); display:flex; flex-direction:column; z-index:30;}
.sidebar-brand{height:64px; display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid var(--n3); flex-shrink:0; background:linear-gradient(135deg, var(--m100), var(--n1) 70%);}
.brand-mark{width:28px; height:28px; border-radius:8px; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px;}
.brand-name{font-size:14.5px; font-weight:600; color:var(--n9);}
.sidebar-cmdk-hint{margin:14px 20px 6px; padding:9px 12px; border:1px solid var(--n3); border-radius:10px; background:var(--n2); display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--n7);}
.kbd{font-size:11px; font-weight:600; padding:2px 6px; border-radius:5px; background:var(--n1); border:1px solid var(--n4); color:var(--n7);}
.sidebar-nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px;}
.sidebar-section-title{font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--n6); text-transform:uppercase; padding:16px 12px 6px;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13.5px; font-weight:500; color:var(--n7); position:relative; text-align:left;}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50); color:var(--m700); font-weight:600;}
.sidebar-link.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0; background:var(--m600);}
.sidebar-badge{margin-left:auto; font-size:11px; font-weight:700; background:var(--n3); color:var(--n7); border-radius:999px; padding:1px 7px;}
.sidebar-badge.warn{background:var(--s2-bg); color:var(--s2-text);}
.sidebar-user{margin-top:auto; padding:14px 20px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:10px;}
.sidebar-avatar{width:32px; height:32px; border-radius:9px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
.sidebar-user-name{font-size:12.5px; font-weight:600; color:var(--n9);}
.sidebar-user-role{font-size:11px; color:var(--n7);}

/* ── main ── */
.main-wrap{margin-left:264px; flex:1; min-width:0; width:calc(100% - 264px); display:flex; flex-direction:column; min-height:100vh;}
.topbar{height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--n3); background:var(--n1); flex-shrink:0;}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n6);}
.breadcrumb .current{color:var(--n9); font-weight:600;}
.breadcrumb .divider{color:var(--n5);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.btn-cmdk{display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--n3); border-radius:9px; font-size:12.5px; color:var(--n7); background:var(--n1);}
.btn-primary{padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700);}
.content{padding:28px; flex:1;}
.editorial-hero{position:relative; overflow:hidden; border-radius:20px; padding:26px 30px; margin-bottom:24px; background:linear-gradient(120deg, var(--m100) 0%, var(--n1) 55%, var(--n1) 100%);}
.editorial-hero-title{font-size:26px; font-weight:600; letter-spacing:-.01em; color:var(--n9); position:relative; z-index:1;}
.editorial-hero-sub{font-size:13px; color:var(--n7); margin-top:6px; max-width:520px; position:relative; z-index:1;}
.editorial-hero svg{position:absolute; right:-30px; top:-30px; width:320px; height:220px; opacity:.55;}

/* cmdk overlay */
.cmdk-overlay{position:fixed; inset:0; background:rgba(41,40,39,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;}
.cmdk-modal{width:min(560px,90vw); background:var(--n1); border-radius:16px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.25); animation:scaleIn .16s ease-out;}
.cmdk-input{width:100%; padding:18px 20px; font-size:15px; border:none; border-bottom:1px solid var(--n3); outline:none;}
.cmdk-results{max-height:340px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:11px; font-weight:600; color:var(--n6); padding:10px 12px 4px; text-transform:uppercase; letter-spacing:.05em;}
.cmdk-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; font-size:13.5px; color:var(--n8); width:100%; text-align:left;}
.cmdk-item:hover{background:var(--n2);}

/* master-detail */
.md-layout{display:flex; gap:20px; height:calc(100vh - 300px); min-height:480px;}
.list-rail{width:340px; flex-shrink:0; background:var(--n1); border:1px solid var(--n3); border-radius:16px; display:flex; flex-direction:column; overflow:hidden;}
.list-rail-head{padding:16px 18px; border-bottom:1px solid var(--n3);}
.list-rail-title{font-size:14px; font-weight:600; color:var(--n9);}
.status-filter{display:flex; gap:6px; margin-top:10px;}
.status-filter button{flex:1; padding:7px; border-radius:8px; font-size:12px; font-weight:500; border:1px solid var(--n3); color:var(--n7); background:var(--n1);}
.status-filter button.active{background:var(--n9); color:#fff; border-color:var(--n9);}
.list-rail-body{overflow-y:auto; flex:1;}
.queue-item{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--n3); position:relative; animation:fadeInUp .3s ease backwards;}
.queue-item:hover{background:var(--n2);}
.queue-item.selected{background:var(--m50);}
.queue-item.selected::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--m600);}
.queue-avatar{width:38px; height:38px; border-radius:10px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;}
.queue-name{font-size:13.5px; font-weight:600; color:var(--n9);}
.queue-meta{font-size:11.5px; color:var(--n7); margin-top:2px;}
.detail-panel{flex:1; min-width:0; background:var(--n1); border:1px solid var(--n3); border-radius:16px; overflow-y:auto; padding:26px;}
.detail-head{display:flex; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--n3); margin-bottom:22px;}
.detail-avatar{width:56px; height:56px; border-radius:14px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;}
.detail-name{font-size:18px; font-weight:600; color:var(--n9);}
.detail-sub{font-size:12.5px; color:var(--n7); margin-top:3px;}
.doc-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.doc-tile{border:1px solid var(--n3); border-radius:14px; padding:16px; display:flex; gap:12px; align-items:flex-start;}
.doc-tile-icon{width:38px; height:38px; border-radius:10px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.doc-tile-name{font-size:13px; font-weight:600; color:var(--n9);}
.doc-tile-file{font-size:11.5px; color:var(--n7); margin-top:3px;}
.decision-row{display:flex; gap:10px; margin-top:26px;}
.decision-row button{flex:1; padding:12px; border-radius:11px; font-size:13.5px; font-weight:600;}
.btn-reject{background:var(--n2); color:var(--n8); border:1px solid var(--n3);}
.btn-approve{background:var(--m600); color:#fff;}
.btn-approve:hover{background:var(--m700);}
.reason-box{margin-top:14px; width:100%; padding:12px; border:1px solid var(--n3); border-radius:10px; font-size:13px; font-family:inherit; resize:vertical; min-height:60px;}
.empty-detail{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--n6); gap:10px; font-size:13.5px;}

/* generic sections */
.page-head{margin-bottom:22px;}
.page-title{font-size:20px; font-weight:600; color:var(--n9);}
.page-desc{font-size:13px; color:var(--n7); margin-top:6px;}
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px;}
.kpi-card{background:var(--n1); border:1px solid var(--n3); border-radius:14px; padding:18px; transition:transform .18s ease, box-shadow .18s ease;}
.kpi-card:hover{transform:scale(1.02); box-shadow:0 8px 22px rgba(0,0,0,.07);}
.kpi-label{font-size:12px; color:var(--n7);}
.kpi-value{font-size:22px; font-weight:700; color:var(--n9); margin-top:8px;}
.kpi-delta{font-size:11.5px; margin-top:6px; font-weight:600;}
.kpi-delta.up{color:var(--s1-text);}
.kpi-delta.down{color:var(--s2-text);}
.panel{background:var(--n1); border:1px solid var(--n3); border-radius:16px; padding:22px;}
.panel-title{font-size:14px; font-weight:600; color:var(--n9); margin-bottom:14px;}
.two-col{display:grid; grid-template-columns:1.6fr 1fr; gap:18px;}
.chart-box{height:260px;}

table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11.5px; color:var(--n7); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--n3);}
td{padding:12px 12px; font-size:13px; color:var(--n8); border-bottom:1px solid var(--n3);}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:var(--n2); cursor:pointer;}
.badge{font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; display:inline-block;}
.badge.neutral{background:var(--n2); color:var(--n7);}
.badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.badge.err{background:var(--s2-bg); color:var(--s2-text);}
.priority-dot{width:8px; height:8px; border-radius:50%; background:var(--s2); display:inline-block; margin-right:8px; animation:pulseDot 2s infinite;}
.rate-input{width:64px; padding:6px 8px; border:1px solid var(--n3); border-radius:7px; font-size:12.5px; text-align:right;}

.modal-overlay{position:fixed; inset:0; background:rgba(41,40,39,.42); z-index:90; display:flex; align-items:center; justify-content:center;}
.modal-box{width:min(440px,90vw); background:var(--n1); border-radius:18px; padding:24px; animation:scaleIn .18s ease-out; max-height:80vh; overflow-y:auto;}
.modal-title{font-size:16px; font-weight:600; color:var(--n9);}
.modal-actions{display:flex; gap:8px; margin-top:20px; justify-content:flex-end;}
.modal-actions button{padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600;}
.modal-cancel{background:var(--n2); color:var(--n8);}
.timeline-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--n3); font-size:12.5px;}
.timeline-item:last-child{border-bottom:none;}

.toast{position:fixed; bottom:30px; left:calc(264px + (100% - 264px)/2); transform:translateX(-50%); background:var(--n9); color:#fff; padding:12px 20px; border-radius:11px; font-size:13px; font-weight:500; z-index:120; animation:toastSlide .22s ease-out; box-shadow:0 12px 26px rgba(0,0,0,.25);}

@media (max-width:1100px){
  .md-layout{flex-direction:column; height:auto;}
  .list-rail{width:100%; max-height:280px;}
  .detail-panel{width:100%;}
  .doc-grid{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .btn-label{display:none;}
  .btn-cmdk .kbd{display:none;}
  .topbar-actions{gap:6px;}
  .topbar{padding:0 14px;}
  .content{padding:16px;}
  .editorial-hero svg{width:180px; height:140px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;
const {ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, PieChart, Pie, Cell, BarChart, Bar} = Recharts;

const NAV = [
  {key:'main', label:'가입 심사 관리', icon:'ph-clipboard-text'},
  {key:'member-cs', label:'회원 및 CS 관리', icon:'ph-shield-warning'},
  {key:'revenue', label:'매출·정산 대시보드', icon:'ph-chart-line-up'},
  {key:'partners', label:'파트너스 정산 관리', icon:'ph-users-three'},
];

function initials(name){ return name.slice(0,1); }

function Toast({msg}){ return msg ? <div className="toast">{msg}</div> : null; }

function CmdK({open, onClose, go}){
  const [q, setQ] = useState('');
  if(!open) return null;
  const items = NAV.filter(n=>n.label.includes(q));
  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()}>
        <input autoFocus className="cmdk-input" placeholder="명령 또는 화면 검색…" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="cmdk-results">
          <div className="cmdk-group-title">이동</div>
          {items.map(it=>(
            <button key={it.key} className="cmdk-item" onClick={()=>{go(it.key); onClose();}}>
              <i className={`ph ${it.icon}`}></i>{it.label}
            </button>
          ))}
          {items.length===0 && <div className="cmdk-item">검색 결과가 없습니다</div>}
        </div>
      </div>
    </div>
  );
}

function Sidebar({screen, setScreen, pendingCount, reportCount}){
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="brand-mark"><i className="ph ph-gem"></i></div>
        <div className="brand-name">프리베오 어드민</div>
      </div>
      <div className="sidebar-cmdk-hint">
        <span>빠른 이동</span><span className="kbd">⌘K</span>
      </div>
      <nav className="sidebar-nav">
        <div className="sidebar-section-title">운영 콘솔</div>
        {NAV.map(n=>(
          <a key={n.key} className={`sidebar-link ${screen===n.key?'active':''}`} onClick={(e)=>{e.preventDefault(); setScreen(n.key);}} href="#" role="button">
            <i className={`ph ${n.icon}`}></i>{n.label}
            {n.key==='main' && pendingCount>0 && <span className="sidebar-badge">{pendingCount}</span>}
            {n.key==='member-cs' && reportCount>0 && <span className="sidebar-badge warn">{reportCount}</span>}
          </a>
        ))}
      </nav>
      <div className="sidebar-user">
        <div className="sidebar-avatar">운</div>
        <div>
          <div className="sidebar-user-name">운영자 계정</div>
          <div className="sidebar-user-role">슈퍼 관리자</div>
        </div>
      </div>
    </aside>
  );
}

const PENDING = [
  {id:1, name:'박서준', submitted:'2026.09.09', docs:[
    {name:'프로필 사진', file:'photo_01.jpg'},
    {name:'재직증명서', file:'employ_cert.pdf'},
    {name:'졸업증명서', file:'diploma.pdf'},
    {name:'자산 증빙', file:'asset_stmt.pdf'},
  ]},
  {id:2, name:'김하윤', submitted:'2026.09.09', docs:[
    {name:'프로필 사진', file:'photo_02.jpg'},
    {name:'재직증명서', file:'employ_cert.pdf'},
    {name:'졸업증명서', file:'diploma.pdf'},
    {name:'자산 증빙', file:'asset_stmt.pdf'},
  ]},
  {id:3, name:'이도현', submitted:'2026.09.08', docs:[
    {name:'프로필 사진', file:'photo_03.jpg'},
    {name:'재직증명서', file:'employ_cert.pdf'},
    {name:'졸업증명서', file:'diploma.pdf'},
    {name:'자산 증빙', file:'asset_stmt.pdf'},
  ]},
  {id:4, name:'최지안', submitted:'2026.09.08', docs:[
    {name:'프로필 사진', file:'photo_04.jpg'},
    {name:'재직증명서', file:'employ_cert.pdf'},
    {name:'졸업증명서', file:'diploma.pdf'},
    {name:'자산 증빙', file:'asset_stmt.pdf'},
  ]},
  {id:5, name:'정유나', submitted:'2026.09.07', docs:[
    {name:'프로필 사진', file:'photo_05.jpg'},
    {name:'재직증명서', file:'employ_cert.pdf'},
    {name:'졸업증명서', file:'diploma.pdf'},
    {name:'자산 증빙', file:'asset_stmt.pdf'},
  ]},
];

function ReviewScreen({queue, setQueue, showToast}){
  const [selectedId, setSelectedId] = useState(queue[0] ? queue[0].id : null);
  const [filter, setFilter] = useState('wait');
  const [reason, setReason] = useState('');
  const selected = queue.find(q=>q.id===selectedId);

  function decide(accept){
    if(!selected) return;
    setQueue(q=>q.filter(item=>item.id!==selected.id));
    setSelectedId(null);
    setReason('');
    showToast(accept ? `${selected.name}님이 승인 처리되었습니다` : `${selected.name}님이 반려 처리되었습니다`);
  }

  return (
    <div>
      <div className="page-head">
        <div className="page-desc">서류/사진을 검토해 승인 또는 반려를 처리하는 심사 콘솔입니다. 처리된 항목은 큐에서 즉시 제외되어 중복 처리를 방지합니다.</div>
      </div>
      <div className="md-layout">
        <div className="list-rail">
          <div className="list-rail-head">
            <div className="list-rail-title">심사 대기 ({queue.length})</div>
            <div className="status-filter">
              <button className={filter==='wait'?'active':''} onClick={()=>setFilter('wait')}>대기</button>
              <button className={filter==='ok'?'active':''} onClick={()=>setFilter('ok')}>승인</button>
              <button className={filter==='no'?'active':''} onClick={()=>setFilter('no')}>반려</button>
            </div>
          </div>
          <div className="list-rail-body">
            {filter!=='wait' && <div style={{padding:'20px 18px', fontSize:12.5, color:'var(--n7)'}}>데모 데이터 범위 밖입니다.</div>}
            {filter==='wait' && queue.map((item,i)=>(
              <div key={item.id} className={`queue-item ${selectedId===item.id?'selected':''}`} style={{animationDelay:`${i*0.03}s`}} onClick={()=>setSelectedId(item.id)}>
                <div className="queue-avatar">{initials(item.name)}</div>
                <div>
                  <div className="queue-name">{item.name}</div>
                  <div className="queue-meta">제출일 {item.submitted}</div>
                </div>
              </div>
            ))}
            {filter==='wait' && queue.length===0 && <div style={{padding:'20px 18px', fontSize:12.5, color:'var(--n7)'}}>대기 중인 심사 건이 없습니다.</div>}
          </div>
        </div>
        <div className="detail-panel" style={{borderRadius:16, boxShadow:'0 4px 20px rgba(0,0,0,0.05)'}}>
          {!selected && <div className="empty-detail"><i className="ph ph-file-magnifying-glass" style={{fontSize:32}}></i>좌측에서 심사할 항목을 선택하세요</div>}
          {selected &&
          <div>
            <div className="detail-head">
              <div className="detail-avatar">{initials(selected.name)}</div>
              <div>
                <div className="detail-name">{selected.name}</div>
                <div className="detail-sub">제출일 {selected.submitted} · 심사 대기</div>
              </div>
            </div>
            <div className="doc-grid">
              {selected.docs.map(d=>(
                <div className="doc-tile" key={d.name}>
                  <div className="doc-tile-icon"><i className="ph ph-file-text"></i></div>
                  <div><div className="doc-tile-name">{d.name}</div><div className="doc-tile-file">{d.file}</div></div>
                </div>
              ))}
            </div>
            <textarea className="reason-box" placeholder="반려 시 사유를 입력하세요 (승인 시 비워둡니다)" value={reason} onChange={e=>setReason(e.target.value)}/>
            <div className="decision-row">
              <button className="btn-reject" onClick={()=>decide(false)}>반려 처리</button>
              <button className="btn-approve" onClick={()=>decide(true)}>승인 처리</button>
            </div>
          </div>}
        </div>
      </div>
    </div>
  );
}

const REPORTS = [
  {id:1, name:'한지우', count:5, reason:'허위 프로필 의심'},
  {id:2, name:'오세훈', count:3, reason:'부적절한 메시지'},
  {id:3, name:'배수진', count:2, reason:'연락처 외부 유도'},
  {id:4, name:'문가영', count:1, reason:'불쾌한 언행'},
];
const MEMBERS = [
  {id:1, name:'한지우', status:'정상'},
  {id:2, name:'오세훈', status:'정지'},
  {id:3, name:'노유진', status:'탈퇴'},
  {id:4, name:'배수진', status:'정상'},
];

function CsScreen({showToast}){
  const [reports, setReports] = useState(REPORTS.slice().sort((a,b)=>b.count-a.count));
  const [detail, setDetail] = useState(null);
  const [action, setAction] = useState('경고');

  function process(){
    setReports(r=>r.filter(x=>x.id!==detail.id));
    showToast(`${detail.name} 신고 건이 '${action}' 처리되었습니다`);
    setDetail(null);
  }

  return (
    <div>
      <div className="page-head">
        <div className="page-desc">신고 누적 횟수 기준 우선순위 큐와 회원 상태(정상/정지/탈퇴) 관리를 통합한 CS 콘솔입니다.</div>
      </div>
      <div className="two-col">
        <div className="panel">
          <div className="panel-title">신고 처리 큐 (누적 횟수 순)</div>
          <table>
            <thead><tr><th>회원</th><th>신고 누적</th><th>사유</th><th></th></tr></thead>
            <tbody>
              {reports.map(r=>(
                <tr key={r.id} className="clickable" onClick={()=>setDetail(r)}>
                  <td>{r.count>=3 && <span className="priority-dot"></span>}{r.name}</td>
                  <td>{r.count}회</td>
                  <td>{r.reason}</td>
                  <td><i className="ph ph-caret-right" style={{color:'var(--n6)'}}></i></td>
                </tr>
              ))}
              {reports.length===0 && <tr><td colSpan="4" style={{color:'var(--n7)'}}>처리할 신고 건이 없습니다.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="panel">
          <div className="panel-title">회원 상태</div>
          <table>
            <thead><tr><th>회원</th><th>상태</th></tr></thead>
            <tbody>
              {MEMBERS.map(m=>(
                <tr key={m.id}>
                  <td>{m.name}</td>
                  <td><span className={`badge ${m.status==='정상'?'neutral':m.status==='정지'?'err':'neutral'}`}>{m.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {detail &&
      <div className="modal-overlay" onClick={()=>setDetail(null)}>
        <div className="modal-box" onClick={e=>e.stopPropagation()}>
          <div className="modal-title">{detail.name} 신고 처리</div>
          <div className="timeline-item"><i className="ph ph-warning" style={{color:'var(--n7)'}}></i>{detail.reason} · 누적 {detail.count}회</div>
          <div className="timeline-item"><i className="ph ph-clock" style={{color:'var(--n7)'}}></i>최근 신고 2026.09.08 접수</div>
          <div style={{marginTop:16, fontSize:12.5, color:'var(--n7)'}}>조치 선택</div>
          <div className="status-filter" style={{marginTop:8}}>
            <button className={action==='경고'?'active':''} onClick={()=>setAction('경고')}>경고</button>
            <button className={action==='정지'?'active':''} onClick={()=>setAction('정지')}>정지</button>
            <button className={action==='탈퇴'?'active':''} onClick={()=>setAction('탈퇴')}>탈퇴</button>
          </div>
          <div className="modal-actions">
            <button className="modal-cancel" onClick={()=>setDetail(null)}>취소</button>
            <button className="btn-approve" onClick={process}>처리 완료</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

];

function PartnersScreen({showToast}){
  const [partners, setPartners] = useState(PARTNERS);
  function updateRate(id, val){
    setPartners(p=>p.map(x=>x.id===id?{...x, rate: val}:x));
  }
  function saveRate(id){
    showToast('배분율이 변경되어 이후 결제부터 적용됩니다');
  }
  return (
    <div>
      <div className="page-head">
        <div className="page-desc">추천 코드 발급 현황, 회원 매핑, 배분율 설정과 파트너별 누적 수익을 관리합니다.</div>
      </div>
      <div className="panel">
        <div className="panel-title">파트너 목록</div>

}

function App(){
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [queue, setQueue] = useState(PENDING);
  const [toast, setToast] = useState(null);

  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(null), 2400);
  }

  const current = NAV.find(n=>n.key===screen);

  return (
    <div className="app-shell" data-archetype="linear-sidebar-cmdk">
      <Sidebar screen={screen} setScreen={setScreen} pendingCount={queue.length} reportCount={REPORTS.length}/>
      <div className="main-wrap">
        <header className="topbar">
          <div className="breadcrumb">
            <span>프리베오 어드민</span><span className="divider">/</span><span className="current">{current.label}</span>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><i className="ph ph-magnifying-glass"></i><span className="btn-label">빠른 이동</span> <span className="kbd">⌘K</span></button>
            <button className="btn-primary" onClick={()=>showToast('운영 리포트를 생성했습니다')}><i className="ph ph-download-simple"></i><span className="btn-label"> 리포트 내보내기</span></button>
          </div>
        </header>
        <div className="content">
          <EditorialHero screen={screen}/>
          {screen==='main' && <ReviewScreen queue={queue} setQueue={setQueue} showToast={showToast}/>}
          {screen==='member-cs' && <CsScreen showToast={showToast}/>}
          {screen==='revenue' && <RevenueScreen showToast={showToast}/>}
          {screen==='partners' && <PartnersScreen showToast={showToast}/>}
        </div>
      </div>
      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} go={setScreen}/>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
