<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캔버스온 — 미술품 큐레이션 마켓플레이스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 210°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbebfb; --m200:#b8d7f7; --m300:#8cbff2; --m400:#5ca4ed;
  --m500:#2e8be8; --m600:#0071e3; --m700:#005dba; --m800:#004891; --m900:#003366;
  --n0:#ffffff; --n1:#f5f5f7; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909498; --n7:#707070; --n8:#53575a; --n9:#36383a; --n10:#1d1d1f;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
#root{width:100%;}
a{text-decoration:none;color:inherit;}

@keyframes cardIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes heartPop{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes spinRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--n0);}

/* ── header / search ── */
.search-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);width:100%;}
.header-row{display:flex;align-items:center;gap:20px;max-width:1320px;margin:0 auto;padding:14px 32px;}
.brand{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:0;}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--m500),var(--m800));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--n10);}
.search-bar{flex:1;display:flex;align-items:center;background:var(--n1);border-radius:999px;padding:5px 6px;gap:2px;max-width:620px;}
.search-input-wrap{display:flex;align-items:center;gap:8px;padding:8px 16px;flex:1.2;min-width:0;}
.search-input-wrap input{border:none;background:none;outline:none;font-size:13.5px;color:var(--n9);width:100%;}
.search-input-wrap input::placeholder{color:var(--n6);}
.search-divider{width:1px;height:22px;background:var(--n4);flex-shrink:0;}
.search-segment{position:relative;background:none;border:none;padding:8px 14px;text-align:left;cursor:pointer;border-radius:999px;transition:background .2s;flex:1;min-width:0;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:10.5px;color:var(--n7);font-weight:700;display:block;}
.segment-value{font-size:12.5px;color:var(--n9);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.search-submit{width:38px;height:38px;border-radius:50%;background:var(--m600);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;flex-shrink:0;}
.search-submit:hover{background:var(--m700);}
.segment-panel{position:absolute;top:calc(100% + 10px);left:0;background:var(--n0);border:1px solid var(--n3);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,0.12);padding:10px;min-width:200px;z-index:70;animation:fadeInUp .18s ease both;}
.segment-panel button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;border:none;background:none;font-size:13px;color:var(--n8);cursor:pointer;text-align:left;}
.segment-panel button:hover{background:var(--n2);}
.segment-panel button.picked{background:var(--m50);color:var(--m700);font-weight:700;}
.header-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-link{background:none;border:none;padding:10px 15px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--n8);cursor:pointer;transition:all .2s;white-space:nowrap;}
.nav-link:hover{background:var(--n2);color:var(--n10);}
.nav-link.active{background:var(--m50);color:var(--m700);}
.nav-link.spotlight{color:var(--n7);font-weight:600;}
.user-menu{width:40px;height:40px;border-radius:50%;background:var(--n2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);flex-shrink:0;}
.user-menu:hover{background:var(--n3);}

.filter-chips{display:flex;gap:10px;overflow-x:auto;padding:14px 32px 16px;max-width:1320px;margin:0 auto;scrollbar-width:none;width:100%;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;border:1px solid var(--n3);background:var(--n0);font-size:13px;font-weight:700;color:var(--n7);cursor:pointer;transition:all .18s;white-space:nowrap;}
.chip:hover{border-color:var(--n5);color:var(--n9);}
.chip.active{background:var(--m600);border-color:var(--m600);color:#fff;}

/* ── hero band ── */
.hero-band{max-width:1320px;margin:0 auto;padding:30px 32px 6px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:40px;}
.hero-copy{max-width:600px;animation:fadeInUp .6s ease both;}
.hero-eyebrow{font-size:13px;font-weight:700;color:var(--m600);letter-spacing:0.02em;margin-bottom:10px;}
.hero-title{font-size:46px;font-weight:800;letter-spacing:-0.03em;line-height:1.18;color:var(--n10);margin:0 0 12px;}
.hero-sub{font-size:15.5px;color:var(--n7);line-height:1.6;max-width:480px;}
.hero-visual{width:220px;height:160px;flex-shrink:0;}

/* ── card grid ── */
.section-label-row{max-width:1320px;margin:0 auto;padding:8px 32px 4px;display:flex;align-items:baseline;justify-content:space-between;width:100%;}
.section-label{font-size:19px;font-weight:800;color:var(--n10);}
.section-count{font-size:13px;color:var(--n6);font-weight:600;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:22px;max-width:1320px;margin:0 auto;padding:14px 32px 40px;width:100%;}
.listing-card{background:var(--n0);border:1px solid var(--n3);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;animation:cardIn .5s both;}
.listing-card:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(0,0,0,0.09);border-color:var(--n2);}
.card-image-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--n2);}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block;}
.listing-card:hover .card-image{transform:scale(1.07);}
.card-favorite{position:absolute;top:11px;right:11px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n7);}
.card-favorite.active{color:var(--m600);}
.card-favorite.pop{animation:heartPop .35s ease;}
.card-limited-tag{position:absolute;top:11px;left:11px;background:var(--n9);color:var(--n0);padding:4px 10px;border-radius:999px;font-weight:700;font-size:10.5px;}
.card-body{padding:15px 17px 17px;}
.card-artist-row{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.card-avatar{width:22px;height:22px;border-radius:50%;overflow:hidden;background:var(--n2);flex-shrink:0;}
.card-avatar img{width:100%;height:100%;object-fit:cover;}
.card-artist-name{font-size:12px;color:var(--n7);font-weight:700;}
.artist-link-btn{margin-left:auto;background:none;border:none;font-size:10.5px;color:var(--n6);cursor:pointer;display:flex;align-items:center;gap:2px;padding:3px 7px;border-radius:999px;font-weight:600;}
.artist-link-btn:hover{background:var(--n2);color:var(--n9);}
.card-title{font-size:15px;font-weight:800;color:var(--n10);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n6);margin-bottom:11px;flex-wrap:wrap;}
.card-tag{background:var(--n2);color:var(--n7);padding:3px 9px;border-radius:999px;font-weight:700;font-size:10.5px;}
.card-like{display:flex;align-items:center;gap:3px;color:var(--n6);}
.card-footer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-price{font-size:16.5px;font-weight:800;color:var(--n10);}
.buy-btn{background:var(--m600);color:#fff;border:none;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:5px;}
.buy-btn:hover{background:var(--m700);}
.load-more-wrap{display:flex;justify-content:center;padding:8px 32px 60px;}
.load-more-btn{background:var(--n1);border:1px solid var(--n3);color:var(--n8);font-weight:700;font-size:13.5px;padding:12px 28px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;}
.load-more-btn:hover{background:var(--n2);border-color:var(--n5);}
.spin-icon{animation:spinRotate 1s linear infinite;}

/* ── quickview drawer ── */
.quickview-overlay{position:fixed;inset:0;background:rgba(20,20,22,0.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;}
.quickview-overlay.open{opacity:1;pointer-events:auto;}
.quickview-drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--n0);z-index:101;transform:translateX(100%);transition:transform .4s cubic-bezier(.19,1,.22,1);overflow-y:auto;box-shadow:-10px 0 36px rgba(0,0,0,0.14);}
.quickview-drawer.open{transform:translateX(0);}
.qv-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--n1);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);z-index:2;}
.qv-image{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--n2);}
.qv-body{padding:22px 24px 30px;}
.qv-artist-row{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.qv-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--n2);}
.qv-avatar img{width:100%;height:100%;object-fit:cover;}
.qv-artist-name{font-weight:800;font-size:14px;color:var(--n10);}
.qv-artist-tier{font-size:11.5px;color:var(--n6);}
.qv-title{font-size:24px;font-weight:800;color:var(--n10);margin-bottom:10px;line-height:1.3;}
.qv-desc{font-size:13.5px;color:var(--n7);line-height:1.7;margin-bottom:18px;}
.qv-spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--n2);font-size:13px;}
.qv-spec-row span:first-child{color:var(--n6);}
.qv-spec-row span:last-child{color:var(--n9);font-weight:600;}
.qv-price-row{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0;}
.qv-price{font-size:26px;font-weight:800;color:var(--n10);}
.qv-actions{display:flex;gap:10px;}
.qv-buy-btn{flex:1;background:var(--m600);color:#fff;border:none;padding:15px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:background .2s;}
.qv-buy-btn:hover{background:var(--m700);}
.qv-fav-btn{width:52px;border:1px solid var(--n3);background:var(--n0);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n7);}
.qv-fav-btn.active{color:var(--m600);border-color:var(--m300);background:var(--m50);}

/* ── generic screen shell ── */
.screen{max-width:1320px;margin:0 auto;padding:32px 32px 70px;width:100%;animation:fadeInUp .4s ease both;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--n6);margin-bottom:22px;}
.breadcrumb button{background:none;border:none;font-size:13px;color:var(--n6);cursor:pointer;font-weight:600;padding:0;}
.breadcrumb button:hover{color:var(--m600);}
.breadcrumb .current{color:var(--n9);font-weight:700;}
.page-title{font-size:26px;font-weight:800;color:var(--n10);margin-bottom:24px;}

/* ── checkout ── */
.checkout-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;}
@media(max-width:900px){.checkout-grid{grid-template-columns:1fr;}}
.co-preview-card{background:var(--n1);border-radius:22px;padding:24px;position:sticky;top:96px;height:fit-content;}
.co-preview-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin-bottom:18px;background:var(--n2);}
.co-preview-title{font-size:20px;font-weight:800;color:var(--n10);margin-bottom:6px;}
.co-preview-artist{font-size:13px;color:var(--n7);margin-bottom:16px;}
.co-spec{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--n3);font-size:13px;}
.co-spec span:first-child{color:var(--n6);}
.co-spec span:last-child{font-weight:700;color:var(--n9);}
.pay-card{background:var(--n0);border:1px solid var(--n3);border-radius:22px;padding:26px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--n8);margin-bottom:7px;}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--n3);font-size:14px;color:var(--n9);outline:none;background:var(--n0);}
.form-input:focus{border-color:var(--m400);}
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px;}
.pay-method{border:1.5px solid var(--n3);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--n0);transition:all .18s;}
.pay-method svg,.pay-method i{color:var(--n7);margin-bottom:6px;}
.pay-method span{display:block;font-size:12px;font-weight:700;color:var(--n8);}
.pay-method.picked{border-color:var(--m600);background:var(--m50);}
.pay-method.picked span{color:var(--m700);}
.pay-method.picked svg,.pay-method.picked i{color:var(--m600);}
.pay-summary-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;color:var(--n7);}
.pay-summary-total{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:17px;font-weight:800;color:var(--n10);border-top:1px solid var(--n3);margin-top:6px;}
.pay-submit-btn{width:100%;background:var(--m600);color:#fff;border:none;padding:16px;border-radius:14px;font-size:15.5px;font-weight:800;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;}
.pay-submit-btn:hover{background:var(--m700);}
.pay-processing-card,.pay-success-card,.pay-failed-card{text-align:center;padding:40px 20px;}
.pay-status-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.pay-status-icon.success{background:var(--s1-bg);color:var(--s1);}
.pay-status-icon.failed{background:var(--n2);color:var(--n8);}
.pay-status-icon.processing{background:var(--m50);color:var(--m600);}
.pay-status-title{font-size:19px;font-weight:800;color:var(--n10);margin-bottom:8px;}
.pay-status-desc{font-size:13.5px;color:var(--n7);margin-bottom:20px;line-height:1.6;}
.order-status-stepper{display:flex;align-items:center;justify-content:center;gap:6px;margin:22px 0;}
.step-dot{width:9px;height:9px;border-radius:50%;background:var(--n3);}
.step-dot.done{background:var(--m600);}
.step-line{width:32px;height:2px;background:var(--n3);}
.step-line.done{background:var(--m600);}
.step-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--n6);margin-top:8px;max-width:260px;margin-left:auto;margin-right:auto;font-weight:600;}
.ghost-link-btn{background:none;border:none;color:var(--n7);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.retry-btn{background:var(--n9);color:var(--n0);border:none;padding:12px 26px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:6px;}

/* ── artist registration ── */
.stepper-row{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:34px;}
.step-circle{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;flex-shrink:0;}
.step-circle.active{background:var(--m600);color:#fff;}
.step-circle.complete{background:var(--m100);color:var(--m700);}
.step-label-txt{font-size:12.5px;font-weight:700;color:var(--n7);margin:0 22px 0 8px;}
.step-connector{width:60px;height:2px;background:var(--n3);}
.step-connector.done{background:var(--m400);}
.artist-form-card{max-width:600px;margin:0 auto;background:var(--n0);border:1px solid var(--n3);border-radius:22px;padding:34px;}
.dropzone{border:2px dashed var(--n4);border-radius:16px;padding:32px;text-align:center;cursor:pointer;color:var(--n6);transition:all .2s;}
.dropzone:hover{border-color:var(--m400);background:var(--m50);color:var(--m700);}
.dropzone.filled{border-style:solid;border-color:var(--m400);background:var(--m50);color:var(--m700);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.step-nav-row{display:flex;justify-content:space-between;margin-top:26px;}
.btn-secondary{background:var(--n1);color:var(--n8);border:1px solid var(--n3);padding:12px 22px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn-primary{background:var(--m600);color:#fff;border:none;padding:12px 26px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn-primary:hover{background:var(--m700);}
.check-row{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:13.5px;color:var(--n8);cursor:pointer;}
.check-row input{width:18px;height:18px;accent-color:var(--m600);}
.app-list{margin-top:44px;max-width:600px;margin-left:auto;margin-right:auto;}
.app-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--n2);}
.app-row-title{font-size:13.5px;font-weight:700;color:var(--n9);}
.app-row-date{font-size:11.5px;color:var(--n6);}
.status-chip{padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:700;}
.status-chip.wait{background:var(--n2);color:var(--n7);}
.status-chip.review{background:var(--n2);color:var(--n8);}
.status-chip.approved{background:var(--s1-bg);color:var(--s1-text);}
.status-chip.rejected{background:var(--n9);color:var(--n0);}
.reject-card{margin-top:20px;background:var(--n1);border-radius:16px;padding:20px;border-left:3px solid var(--n8);}
.reject-card p{font-size:13px;color:var(--n8);line-height:1.6;margin:6px 0 14px;}

/* ── mypage ── */
.mypage-header{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
.mypage-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--n2);}
.mypage-avatar img{width:100%;height:100%;object-fit:cover;}
.mypage-name{font-size:18px;font-weight:800;color:var(--n10);}
.mypage-email{font-size:12.5px;color:var(--n6);}
.tab-row{display:flex;gap:6px;border-bottom:1px solid var(--n3);margin-bottom:24px;}

.tab-btn.active{color:var(--n10);}
.tab-btn.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--m600);}
.status-filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.order-row{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--n3);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
.order-row:hover{border-color:var(--n5);}
.order-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--n2);flex-shrink:0;}
.order-info{flex:1;min-width:0;}
.order-title{font-size:14px;font-weight:700;color:var(--n9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-sub{font-size:12px;color:var(--n6);margin-top:3px;}
.order-price{font-size:14.5px;font-weight:800;color:var(--n10);margin-right:8px;}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.profile-form{max-width:480px;}
.save-highlight{animation:fadeInUp .5s ease;}

/* ── artist profile ── */
.ap-hero{position:relative;border-radius:24px;overflow:hidden;height:220px;margin-bottom:-56px;}
.ap-hero img{width:100%;height:100%;object-fit:cover;}
.ap-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%, var(--m900) 145%);opacity:.55;}
.ap-info-card{position:relative;background:var(--n0);border:1px solid var(--n3);border-radius:22px;padding:26px 30px;margin:0 24px;display:flex;align-items:flex-end;gap:20px;box-shadow:0 8px 24px rgba(0,0,0,0.06);}
.ap-avatar{width:88px;height:88px;border-radius:50%;overflow:hidden;border:4px solid var(--n0);flex-shrink:0;margin-top:-52px;background:var(--n2);}

.ap-name-row{flex:1;}
.ap-name{font-size:22px;font-weight:800;color:var(--n10);}
.ap-tier{font-size:12px;color:var(--n6);font-weight:600;margin-top:2px;}
.follow-btn{background:var(--m600);color:#fff;border:none;padding:11px 24px;border-radius:999px;font-weight:800;font-size:13.5px;cursor:pointer;}
.follow-btn.following{background:var(--n2);color:var(--n8);}
.ap-stats-row{display:flex;gap:36px;padding:28px 30px 8px;}
.ap-stat-num{font-size:20px;font-weight:800;color:var(--n10);}
.ap-stat-label{font-size:12px;color:var(--n6);margin-top:2px;}
.ap-bio{padding:6px 30px 24px;font-size:13.5px;color:var(--n7);line-height:1.7;max-width:640px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--n7);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:18px;}
.back-btn:hover{color:var(--n10);}

/* ── toast ── */
.toast{position:fixed;bottom:28px;left:50%;background:var(--n9);color:var(--n0);padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;}

/* ── modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,22,0.42);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--n0);border-radius:22px;max-width:420px;width:100%;padding:26px;animation:fadeInUp .25s ease;}
.modal-box h3{font-size:17px;font-weight:800;color:var(--n10);margin:0 0 14px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.footer{background:var(--n1);border-top:1px solid var(--n3);width:100%;margin-top:auto;}
.footer-inner{max-width:1320px;margin:0 auto;padding:44px 32px 26px;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px;}
.footer-col h4{font-size:13px;font-weight:800;color:var(--n9);margin:0 0 14px;}
.footer-col a{display:block;font-size:12.5px;color:var(--n7);margin-bottom:9px;cursor:pointer;}
.footer-col a:hover{color:var(--n10);}
.footer-brand-desc{font-size:12.5px;color:var(--n6);line-height:1.7;max-width:260px;}
.footer-bottom{border-top:1px solid var(--n3);padding:16px 32px;text-align:center;font-size:11.5px;color:var(--n6);}

@media(max-width:720px){
  .search-bar{display:none;}
  .header-nav .nav-link.spotlight{display:none;}
  .hero-band{flex-direction:column;align-items:flex-start;}
  .hero-visual{display:none;}
  .footer-inner{grid-template-columns:1fr 1fr;}
}

</head>

];

const EXTRA_ARTWORKS = [
  {id:15, title:'여름의 잔상', artistId:'a4', category:'사진', price:720000, size:'60×80cm', year:'2026', likes:99, limited:false},
  {id:16, title:'선의 리듬', artistId:'a2', category:'일러스트', price:260000, size:'A3', year:'2026', likes:37, limited:false},
  {id:17, title:'침묵하는 정원', artistId:'a5', category:'드로잉', price:310000, size:'A4', year:'2025', likes:52, limited:false},
  {id:18, title:'유리의 온도', artistId:'a3', category:'조각·입체', price:1900000, size:'30×30×55cm', year:'2026', likes:64, limited:false},

/* ───────────────── shared bits ───────────────── */
function Toast({msg}){
  if(!msg) return null;
  return (<div className="toast"><i data-lucide="check-circle" style={{width:16,height:16}}></i>{msg}</div>);
}

function ArtworkCard({art, favorites, onToggleFav, onOpenQuickview, onBuy, onArtistProfile, style}){
  const artist = artistOf(art.artistId);
  const isFav = favorites.has(art.id);
  return (
    <article className="listing-card" style={{...style, borderRadius: 22}} onClick={() => onOpenQuickview(art)}>
      <div className="card-image-wrap">
        <img className="card-image" src={`https://picsum.photos/seed/${SLUG}-card-${art.id}/600/450`} alt={art.title} loading="lazy" />
        {art.limited && <span className="card-limited-tag">한정판</span>}
        <button className={`card-favorite ${isFav ? 'active pop' : ''}`} onClick={(e)=>{e.stopPropagation(); onToggleFav(art.id);}} aria-label="찜하기">
          <i data-lucide="heart" style={{width:17,height:17, fill: isFav ? 'currentColor' : 'none'}}></i>
        </button>
      </div>
      <div className="card-body">
        <div className="card-artist-row">
          <span className="card-avatar"><img src={avatarUrl(artist.name)} alt={artist.name}/></span>
          <span className="card-artist-name">{artist.name}</span>
          <button className="artist-link-btn" onClick={(e)=>{e.stopPropagation(); onArtistProfile(art.artistId);}}>

          </button>
        </div>
      </div>
    </article>
  );
}

/* ───────────────── main gallery view ───────────────── */
function GalleryView(props){
  const {artworks, category, setCategory, search, setSearch, priceFilter, setPriceFilter, artistFilter, setArtistFilter,
         favorites, onToggleFav, onOpenQuickview, onBuy, onArtistProfile, onLoadMore, loadedExtra, loadingMore,
         openPanel, setOpenPanel} = props;
  const priceOptions = [{k:'all',label:'전체 가격'},{k:'under50',label:'50만원 이하'},{k:'50to150',label:'50~150만원'},{k:'over150',label:'150만원 이상'}];

  let list = artworks.filter(a => category === '전체' || a.category === category);
  if(search.trim()){
    const q = search.trim();
    list = list.filter(a => a.title.includes(q) || artistOf(a.artistId).name.includes(q));
  }
  if(priceFilter !== 'all'){
    list = list.filter(a => priceFilter === 'under50' ? a.price <= 500000 : priceFilter === '50to150' ? (a.price>500000 && a.price<=1500000) : a.price>1500000);
  }
  if(artistFilter !== 'all'){
    list = list.filter(a => a.artistId === artistFilter);
  }

  return (
    <React.Fragment>
      <div className="hero-band">
        <div className="hero-copy">
          <div className="hero-eyebrow">CANVASON CURATION</div>
          <h1 className="hero-title">이 계절, 당신의 벽을<br/>채울 작품을 만나보세요</h1>
          <p className="hero-sub">엄선된 작가들의 회화·조각·사진·공예 작품을 온라인에서 큐레이션 받고, 안전한 전자결제로 바로 구매할 수 있습니다.</p>
        </div>
        <svg className="hero-visual" viewBox="0 0 220 160" fill="none">
          <defs>
            <linearGradient id="heroGrad1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="var(--m300)"/>
              <stop offset="100%" stopColor="var(--m700)"/>
            </linearGradient>
          </defs>
          <rect x="14" y="30" width="120" height="90" rx="14" fill="url(#heroGrad1)" opacity="0.9"/>
          <rect x="70" y="10" width="120" height="90" rx="14" fill="var(--n2)" stroke="var(--n4)" strokeWidth="1.5"/>
          <circle cx="150" cy="40" r="14" fill="var(--m100)"/>
          <path d="M84 78 L104 52 L120 68 L140 42" stroke="var(--m600)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
          <circle cx="30" cy="112" r="6" fill="var(--n0)" stroke="var(--m600)" strokeWidth="2"/>
        </svg>
      </div>

      <div className="filter-chips">
        {CATEGORIES.map(c => (
          <button key={c} className={`chip ${category===c ? 'active':''}`} onClick={() => setCategory(c)}>{c}</button>
        ))}
      </div>

      <div className="section-label-row">
        <span className="section-label">작품 둘러보기</span>
        <span className="section-count">{list.length}개의 작품</span>
      </div>

      <div className="card-grid">
        {list.map((art,i) => (
          <ArtworkCard key={art.id} art={art} favorites={favorites} onToggleFav={onToggleFav}
            onOpenQuickview={onOpenQuickview} onBuy={onBuy} onArtistProfile={onArtistProfile}
            style={{animationDelay:`${Math.min(i,10)*0.04}s`}} />
        ))}
      </div>

      {!loadedExtra && (
        <div className="load-more-wrap">
          <button className="load-more-btn" onClick={onLoadMore} disabled={loadingMore}>
            {loadingMore
              ? (<React.Fragment><i data-lucide="loader-2" className="spin-icon" style={{width:16,height:16}}></i>불러오는 중...</React.Fragment>)
              : (<React.Fragment><i data-lucide="chevron-down" style={{width:16,height:16}}></i>작품 더 보기</React.Fragment>)}
          </button>
        </div>
      )}

      {/* search dropdown panels rendered here so segment buttons stay simple */}
      {openPanel === 'price' && (
        <div className="modal-overlay" onClick={()=>setOpenPanel(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>가격대 선택</h3>
            {priceOptions.map(o => (
              <button key={o.k} className="nav-link" style={{display:'block',width:'100%',textAlign:'left',marginBottom:6, background: priceFilter===o.k?'var(--m50)':'var(--n1)', color: priceFilter===o.k?'var(--m700)':'var(--n8)'}}
                onClick={()=>{setPriceFilter(o.k); setOpenPanel(null);}}>{o.label}</button>
            ))}
          </div>
        </div>
      )}
      {openPanel === 'artist' && (
        <div className="modal-overlay" onClick={()=>setOpenPanel(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>작가 선택</h3>
            <button className="nav-link" style={{display:'block',width:'100%',textAlign:'left',marginBottom:6, background: artistFilter==='all'?'var(--m50)':'var(--n1)', color: artistFilter==='all'?'var(--m700)':'var(--n8)'}}
              onClick={()=>{setArtistFilter('all'); setOpenPanel(null);}}>전체 작가</button>
            {ARTISTS.map(a => (
              <button key={a.id} className="nav-link" style={{display:'block',width:'100%',textAlign:'left',marginBottom:6, background: artistFilter===a.id?'var(--m50)':'var(--n1)', color: artistFilter===a.id?'var(--m700)':'var(--n8)'}}
                onClick={()=>{setArtistFilter(a.id); setOpenPanel(null);}}>{a.name}</button>
            ))}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ───────────────── checkout view ───────────────── */
function CheckoutView({artwork, onHome, showToast}){
  const [method, setMethod] = useState('card');
  const [status, setStatus] = useState('form'); // form | processing | success | failed
  const artist = artistOf(artwork.artistId);
  const fee = Math.round(artwork.price * 0.03);
  const total = artwork.price + fee;

  const submit = () => {
    setStatus('processing');
    setTimeout(() => setStatus('success'), 1400);
  };
  const simulateFail = () => setStatus('failed');
  const retry = () => setStatus('form');

  return (
    <div className="screen">
      <div className="breadcrumb">

      <div className="checkout-grid">

          <div className="co-preview-artist">{artist.name} · {artwork.category}</div>
          <div className="co-spec"><span>작품 크기</span><span>{artwork.size}</span></div>
          <div className="co-spec"><span>제작 연도</span><span>{artwork.year}</span></div>
          <div className="co-spec"><span>배송</span><span>실물 액자 포장 배송</span></div>
        </div>

        <div className="pay-card">
          {status === 'form' && (
            <React.Fragment>
              <h2 style={{fontSize:'18px',fontWeight:800,margin:'0 0 18px',color:'var(--n10)'}}>구매자 정보</h2>
              <div className="form-row-2">
                <div className="form-group"><label className="form-label">받는 사람</label><input className="form-input" defaultValue="이하은" /></div>
                <div className="form-group"><label className="form-label">연락처</label><input className="form-input" defaultValue="010-2456-7781" /></div>
              </div>
              <div className="form-group"><label className="form-label">배송지 주소</label><input className="form-input" defaultValue="서울시 마포구 어울마당로 12" /></div>

              <h2 style={{fontSize:'18px',fontWeight:800,margin:'22px 0 4px',color:'var(--n10)'}}>결제 수단</h2>
              <div className="pay-methods">
                <button className={`pay-method ${method==='card'?'picked':''}`} onClick={()=>setMethod('card')}>
                  <i data-lucide="credit-card" style={{width:20,height:20}}></i><span>신용카드</span>
                </button>
                <button className={`pay-method ${method==='kakao'?'picked':''}`} onClick={()=>setMethod('kakao')}>
                  <i data-lucide="message-circle" style={{width:20,height:20}}></i><span>카카오페이</span>
                </button>
                <button className={`pay-method ${method==='bank'?'picked':''}`} onClick={()=>setMethod('bank')}>
                  <i data-lucide="landmark" style={{width:20,height:20}}></i><span>계좌이체</span>
                </button>
              </div>

              <div className="pay-summary-row"><span>작품 금액</span><span>{money(artwork.price)}</span></div>
              <div className="pay-summary-row"><span>결제 대행 수수료</span><span>{money(fee)}</span></div>
              <div className="pay-summary-total"><span>총 결제금액</span><span>{money(total)}</span></div>

              <button className="pay-submit-btn" onClick={submit}>
                <i data-lucide="lock" style={{width:15,height:15}}></i>{money(total)} 결제 진행하기

            </React.Fragment>
          )}

          {status === 'processing' && (
            <div className="pay-processing-card">
              <div className="pay-status-icon processing"><i data-lucide="loader-2" className="spin-icon" style={{width:30,height:30}}></i></div>
              <div className="pay-status-title">결제 승인 확인 중입니다</div>
              <div className="pay-status-desc">PG사로부터 결제 결과를 확인하고 있어요. 잠시만 기다려주세요.</div>
            </div>
          )}

          {status === 'success' && (
            <div className="pay-success-card">
              <div className="pay-status-icon success"><i data-lucide="check" style={{width:32,height:32}}></i></div>
              <div className="pay-status-title">결제가 완료되었습니다</div>
              <div className="pay-status-desc">주문번호 CO-2026-{String(artwork.id).padStart(4,'0')} — {artist.name} 작가의 «{artwork.title}»</div>
              <div className="order-status-stepper">
                <span className="step-dot done"></span><span className="step-line done"></span>
                <span className="step-dot"></span><span className="step-line"></span>
                <span className="step-dot"></span><span className="step-line"></span>
                <span className="step-dot"></span>
              </div>
              <div className="step-labels"><span>결제완료</span><span>배송준비</span><span>배송중</span><span>완료</span></div>
              <div style={{marginTop:22}}><button className="ghost-link-btn" onClick={simulateFail}>결제 실패 상황 미리보기</button></div>

          {status === 'failed' && (
            <div className="pay-failed-card">
              <div className="pay-status-icon failed"><i data-lucide="x" style={{width:30,height:30}}></i></div>

}

/* ───────────────── artist registration view ───────────────── */
const STEP_LABELS = ['기본 정보','작품 등록','약관 동의'];
function ArtistView({showToast}){
  const [step, setStep] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [fileName, setFileName] = useState('');
  const [showRejectDemo, setShowRejectDemo] = useState(false);
  const fileRef = useRef(null);

  const next = () => setStep(s => Math.min(s+1, 2));
  const prev = () => setStep(s => Math.max(s-1, 0));
  const submit = () => { setSubmitted(true); showToast('작가 등록 신청이 접수되었습니다'); };
  const pickFile = () => fileRef.current && fileRef.current.click();

  return (
    <div className="screen">
      <div className="page-title">작가 등록</div>

      {!submitted && (
        <React.Fragment>
          <div className="stepper-row">
            {STEP_LABELS.map((label,i)=>(
              <React.Fragment key={label}>
                <div style={{display:'flex',alignItems:'center'}}>
                  <div className={`step-circle ${i===step?'active':i<step?'complete':''}`}>{i<step? <i data-lucide="check" style={{width:15,height:15}}></i> : i+1}</div>
                  <span className="step-label-txt">{label}</span>
                </div>
                {i<2 && <div className={`step-connector ${i<step?'done':''}`}></div>}
              </React.Fragment>
            ))}
          </div>

          <div className="artist-form-card">
            {step === 0 && (
              <React.Fragment>
                <div className="form-row-2">
                  <div className="form-group"><label className="form-label">작가명</label><input className="form-input" placeholder="예: 김도윤" /></div>
                  <div className="form-group"><label className="form-label">연락처</label><input className="form-input" placeholder="010-0000-0000" /></div>
                </div>
                <div className="form-group"><label className="form-label">이메일</label><input className="form-input" placeholder="artist@example.com" /></div>
                <div className="form-group"><label className="form-label">한 줄 소개</label><textarea className="form-input" rows="3" placeholder="작업 세계를 짧게 소개해주세요"></textarea></div>
              </React.Fragment>
            )}
            {step === 1 && (
              <React.Fragment>
                <div className="form-group">
                  <label className="form-label">대표 작품 이미지</label>
                  <div className={`dropzone ${fileName ? 'filled':''}`} onClick={pickFile}>
                    <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={(e)=> setFileName(e.target.files[0] ? e.target.files[0].name : '')} />
                    <i data-lucide={fileName ? 'image':'upload-cloud'} style={{width:26,height:26,marginBottom:8}}></i>
                    <div>{fileName || '클릭하여 이미지 업로드 (JPG, PNG)'}</div>
                  </div>
                </div>
                <div className="form-group"><label className="form-label">작품명</label><input className="form-input" placeholder="예: 도시의 파장" /></div>
                <div className="form-row-2">
                  <div className="form-group"><label className="form-label">희망 판매가</label><input className="form-input" placeholder="1,280,000원" /></div>
                  <div className="form-group"><label className="form-label">카테고리</label>
                    <select className="form-input"><option>회화</option><option>조각·입체</option><option>사진</option><option>공예</option></select>
                  </div>
                </div>
              </React.Fragment>
            )}
            {step === 2 && (
              <React.Fragment>
                <label className="check-row"><input type="checkbox" defaultChecked/>캔버스온 이용약관에 동의합니다</label>
                <label className="check-row"><input type="checkbox" defaultChecked/>작가 심사 및 수수료 정책에 동의합니다</label>
                <label className="check-row"><input type="checkbox"/>마케팅 정보 수신에 동의합니다 (선택)</label>
              </React.Fragment>
            )}

            <div className="step-nav-row">
              {step>0 ? <button className="btn-secondary" onClick={prev}>이전</button> : <span></span>}
              {step<2
                ? <button className="btn-primary" onClick={next}>다음</button>
                : <button className="btn-primary" onClick={submit}>제출하기</button>}
            </div>
          </div>
        </React.Fragment>
      )}

      {submitted && (
        <div className="artist-form-card" style={{textAlign:'center'}}>
          <div className="pay-status-icon success" style={{margin:'0 auto 16px'}}><i data-lucide="check" style={{width:28,height:28}}></i></div>
          <div className="pay-status-title">신청이 접수되었습니다</div>
          <div className="pay-status-desc">관리자 심사 후 작가 승인 여부를 안내드립니다. 보통 1~2영업일이 소요됩니다.</div>
        </div>
      )}

      <div className="app-list">
        <h3 style={{fontSize:'15px',fontWeight:800,color:'var(--n9)',marginBottom:10}}>내 신청 현황</h3>
        <div className="app-row">
          <div><div className="app-row-title">도시의 파장 (작품 등록)</div><div className="app-row-date">2026.09.08 접수</div></div>
          <span className="status-chip review">검토중</span>
        </div>
        <div className="app-row">
          <div><div className="app-row-title">작가 가입 신청</div><div className="app-row-date">2026.08.20 접수</div></div>
          <span className="status-chip approved">승인</span>
        </div>
        <div className="app-row">
          <div>
            <div className="app-row-title">여름 소품집 (작품 등록)</div>
            <div className="app-row-date">2026.08.02 접수</div>
          </div>
          <span className="status-chip rejected">반려</span>
        </div>
        <div style={{textAlign:'right',marginTop:8}}>
          <button className="ghost-link-btn" onClick={()=>setShowRejectDemo(v=>!v)}>반려 사례 자세히 보기</button>
        </div>
        {showRejectDemo && (
          <div className="reject-card">
            <strong style={{fontSize:'13px',color:'var(--n9)'}}>반려 사유</strong>
            <p>제출된 이미지 해상도가 등록 기준(최소 2000px)에 미달합니다. 원본 이미지를 다시 촬영하여 재등록해 주세요.</p>
            <button className="btn-secondary" onClick={()=>{setSubmitted(false); setStep(1);}}><i data-lucide="rotate-ccw" style={{width:13,height:13,marginRight:5,verticalAlign:'-2px'}}></i>재등록하기</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ───────────────── App root ───────────────── */
function App(){
  const [view, setView] = useState('main');
  const [category, setCategory] = useState('전체');
  const [search, setSearch] = useState('');
  const [priceFilter, setPriceFilter] = useState('all');
  const [artistFilter, setArtistFilter] = useState('all');
  const [favorites, setFavorites] = useState(new Set([3,9]));
  const [allArtworks, setAllArtworks] = useState(ARTWORKS);
  const [loadedExtra, setLoadedExtra] = useState(false);
  const [loadingMore, setLoadingMore] = useState(false);
  const [quickview, setQuickview] = useState(null);
  const [selectedArtwork, setSelectedArtwork] = useState(ARTWORKS[0]);
  const [selectedArtistId, setSelectedArtistId] = useState('a1');
  const [toast, setToast] = useState('');
  const [openPanel, setOpenPanel] = useState(null);

  useEffect(() => { lucide.createIcons(); });

  useEffect(() => {
    const onScroll = () => {
      if(loadedExtra || loadingMore || view !== 'main') return;
      if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 260){
        setLoadingMore(true);
        setTimeout(() => { setAllArtworks(prev => [...prev, ...EXTRA_ARTWORKS]); setLoadedExtra(true); setLoadingMore(false); }, 700);
      }
    };
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, [loadedExtra, loadingMore, view]);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(''), 2400); };
  const toggleFav = (id) => setFavorites(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const openQuickview = (art) => setQuickview(art);
  const goBuy = (art) => { setSelectedArtwork(art); setQuickview(null); setView('checkout'); window.scrollTo(0,0); };
  const goArtistProfile = (id) => { setSelectedArtistId(id); setQuickview(null); setView('artist-profile'); window.scrollTo(0,0); };
  const goHome = () => { setView('main'); window.scrollTo(0,0); };
  const goLoadMore = () => {
    if(loadedExtra || loadingMore) return;
    setLoadingMore(true);
    setTimeout(() => { setAllArtworks(prev => [...prev, ...EXTRA_ARTWORKS]); setLoadedExtra(true); setLoadingMore(false); }, 700);
  };

  const qvArtist = quickview ? artistOf(quickview.artistId) : null;
  const qvFav = quickview ? favorites.has(quickview.id) : false;

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <header className="search-header" data-search-header>
        <div className="header-row">
          <button className="brand" onClick={goHome}>
            <span className="brand-mark"><i data-lucide="palette" style={{width:17,height:17}}></i></span>
            <span className="brand-name">캔버스온</span>
          </button>
          <div className="search-bar">
            <div className="search-input-wrap">
              <i data-lucide="search" style={{width:15,height:15,color:'var(--n6)',flexShrink:0}}></i>
              <input type="search" placeholder="작품명, 작가 이름으로 검색" value={search} onChange={e=>{setSearch(e.target.value); if(view!=='main') goHome();}} />
            </div>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=> { goHome(); setOpenPanel(p => p==='price'?null:'price'); }}>
              <span className="segment-label">가격대</span>
              <span className="segment-value">{priceFilter==='all' ? '전체' : priceFilter==='under50' ? '~50만원' : priceFilter==='50to150' ? '50~150만원' : '150만원~'}</span>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=> { goHome(); setOpenPanel(p => p==='artist'?null:'artist'); }}>
              <span className="segment-label">작가</span>
              <span className="segment-value">{artistFilter==='all' ? '전체 작가' : artistOf(artistFilter).name}</span>
            </button>
            <button className="search-submit" onClick={goHome}><i data-lucide="search" style={{width:15,height:15}}></i></button>
          </div>
          <nav className="header-nav">
            <button className={`nav-link ${view==='artist'?'active':''}`} onClick={()=>{setView('artist'); window.scrollTo(0,0);}}>작가 등록</button>
            <button className={`nav-link ${view==='mypage'?'active':''}`} onClick={()=>{setView('mypage'); window.scrollTo(0,0);}}>마이페이지</button>
            <button className="nav-link spotlight" onClick={()=>goArtistProfile('a4')}>이달의 작가 프로필</button>
            <button className="user-menu" onClick={()=>{setView('mypage'); window.scrollTo(0,0);}}><i data-lucide="user" style={{width:18,height:18}}></i></button>
          </nav>
        </div>
      </header>

      {view === 'main' && (
        <GalleryView
          artworks={allArtworks} category={category} setCategory={setCategory}
          search={search} setSearch={setSearch} priceFilter={priceFilter} setPriceFilter={setPriceFilter}
          artistFilter={artistFilter} setArtistFilter={setArtistFilter}
          favorites={favorites} onToggleFav={toggleFav} onOpenQuickview={openQuickview}
          onBuy={goBuy} onArtistProfile={goArtistProfile}
          onLoadMore={goLoadMore} loadedExtra={loadedExtra} loadingMore={loadingMore}
          openPanel={openPanel} setOpenPanel={setOpenPanel}
        />
      )}
      {view === 'checkout' && <CheckoutView artwork={selectedArtwork} onHome={goHome} showToast={showToast} />}
      {view === 'artist' && <ArtistView showToast={showToast} />}
      {view === 'mypage' && (
        <MypageView artworks={allArtworks} favorites={favorites} onToggleFav={toggleFav}
          onOpenQuickview={openQuickview} onBuy={goBuy} onArtistProfile={goArtistProfile} showToast={showToast} />
      )}
      {view === 'artist-profile' && (
        <ArtistProfileView artistId={selectedArtistId} artworks={allArtworks} favorites={favorites}
          onToggleFav={toggleFav} onOpenQuickview={openQuickview} onBuy={goBuy} onArtistProfile={goArtistProfile} onBack={goHome} />
      )}

      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-col">
            <h4 style={{display:'flex',alignItems:'center',gap:7}}><i data-lucide="palette" style={{width:15,height:15}}></i>캔버스온</h4>
            <p className="footer-brand-desc">신진 작가와 컬렉터를 잇는 미술품 큐레이션 마켓플레이스입니다. 모든 거래는 안전결제로 보호됩니다.</p>
          </div>
          <div className="footer-col">
            <h4>구매자 안내</h4>
            <a onClick={goHome}>작품 둘러보기</a>
            <a onClick={()=>setView('mypage')}>주문 조회</a>
            <a>배송·반품 안내</a>
          </div>
          <div className="footer-col">
            <h4>작가 지원</h4>
            <a onClick={()=>setView('artist')}>작가 등록하기</a>
            <a>정산 정책</a>
            <a>작가 가이드</a>
          </div>
          <div className="footer-col">
            <h4>고객센터</h4>
            <a>자주 묻는 질문</a>
            <a>1:1 문의</a>
            <a>이용약관</a>
          </div>
        </div>
        <div className="footer-bottom">© 2026 캔버스온 · 포트폴리오 데모 프로젝트</div>
      </footer>

      <div className={`quickview-overlay ${quickview?'open':''}`} onClick={()=>setQuickview(null)}></div>
      <div className={`quickview-drawer ${quickview?'open':''}`}>
        {quickview && (
          <React.Fragment>
            <button className="qv-close" onClick={()=>setQuickview(null)}><i data-lucide="x" style={{width:17,height:17}}></i></button>
            <img className="qv-image" src={`https://picsum.photos/seed/${SLUG}-card-${quickview.id}/700/700`} alt={quickview.title}/>
            <div className="qv-body">
              <div className="qv-artist-row">
                <span className="qv-avatar"><img src={avatarUrl(qvArtist.name)} alt={qvArtist.name}/></span>
                <div>
                  <div className="qv-artist-name">{qvArtist.name}</div>
                  <div className="qv-artist-tier">{qvArtist.tier}</div>
                </div>
              </div>
              <div className="qv-title">{quickview.title}</div>
              <p className="qv-desc">{qvArtist.name} 작가가 {quickview.year}년 제작한 {quickview.category} 작품입니다. 원본 실물을 그대로 배송하며, 진품 인증서가 함께 제공됩니다.</p>
              <div className="qv-spec-row"><span>카테고리</span><span>{quickview.category}</span></div>
              <div className="qv-spec-row"><span>크기</span><span>{quickview.size}</span></div>
              <div className="qv-spec-row"><span>제작 연도</span><span>{quickview.year}</span></div>
              <div className="qv-price-row"><span style={{color:'var(--n6)',fontSize:13}}>판매가</span><span className="qv-price">{money(quickview.price)}</span></div>
              <div className="qv-actions">
                <button className={`qv-fav-btn ${qvFav?'active':''}`} onClick={()=>toggleFav(quickview.id)}><i data-lucide="heart" style={{width:18,height:18, fill: qvFav?'currentColor':'none'}}></i></button>
                <button className="qv-buy-btn" onClick={()=>goBuy(quickview)}>결제 페이지로 이동</button>
              </div>
            </div>
          </React.Fragment>
        )}
      </div>

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
