<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캔버스온 관리자 콘솔 — 미술품 마켓플레이스 운영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 4°, light) ── */
:root{
  --m50:#f8f0f0; --m100:#f2e2e0; --m200:#e4c4c2; --m300:#d4a19d; --m400:#c27973;
  --m500:#b1534c; --m600:#a02d25; --m700:#83251e; --m800:#661d18; --m900:#481411;
  --n0:#ffffff; --n1:#9a9a9a; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d5d5;
  --n5:#bab5b5; --n6:#989090; --n7:#6d6d6d; --n8:#5a5453; --n9:#3a3636; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 4°와 겹쳐 제거됨. 해당 상태는 무채색(n9/n10) 필로 표현 */

*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
#root{width:100%;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes spinRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes progressGrow{from{width:0;}to{width:var(--pw);}}
@keyframes dragLift{from{transform:scale(1);}to{transform:scale(1.03);}}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--n0);}

/* ── top app header (no sidebar — editorial topnav per kanban-board archetype) ── */
.app-header{width:100%;border-bottom:1px solid var(--n3);background:var(--n0);}
.app-header-row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:20px 36px 0;}
.app-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.app-brand-mark{width:34px;height:34px;background:var(--n10);color:var(--n0);display:flex;align-items:center;justify-content:center;font-weight:400;font-size:14px;}
.app-brand-name{font-size:19px;font-weight:400;letter-spacing:-0.01em;color:var(--n10);}
.app-brand-sub{font-size:11px;color:var(--n6);font-weight:400;letter-spacing:0.04em;}
.tab-strip{display:flex;gap:2px;margin-left:20px;}
.top-tab{background:none;border:none;padding:10px 20px;font-size:14px;font-weight:400;color:var(--n7);cursor:pointer;position:relative;letter-spacing:-0.01em;}
.top-tab.active{color:var(--n10);}
.top-tab.active::after{content:'';position:absolute;left:20px;right:20px;bottom:-1px;height:2px;background:var(--m600);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px;padding-bottom:14px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border:1px solid var(--n3);background:var(--n0);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n7);}
.icon-btn:hover{border-color:var(--n5);}
.admin-avatar{width:32px;height:32px;overflow:hidden;background:var(--n2);flex-shrink:0;}
.admin-avatar img{width:100%;height:100%;object-fit:cover;}
.tab-strip-wrap{padding-bottom:0;display:flex;align-items:flex-end;}

.screen{max-width:1440px;margin:0 auto;padding:32px 36px 70px;width:100%;animation:fadeInUp .4s ease both;}
.page-head-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px;}
.page-title{font-size:48px;font-weight:400;color:var(--n10);letter-spacing:-0.015em;line-height:1.08;}
.page-sub{font-size:13px;color:var(--n7);margin-top:6px;}
.page-actions{display:flex;gap:10px;}
.pill-btn{background:none;border:1px solid var(--n9);color:var(--n9);padding:11px 26px;border-radius:75px;font-weight:400;font-size:13.5px;cursor:pointer;transition:all .25s cubic-bezier(.19,1,.22,1);}
.pill-btn:hover{background:var(--n9);color:var(--n0);}
.pill-btn-fill{background:var(--m600);border:1px solid var(--m600);color:#fff;padding:11px 26px;border-radius:75px;font-weight:400;font-size:13.5px;cursor:pointer;transition:background .25s;}
.pill-btn-fill:hover{background:var(--m700);}
.search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--n3);padding:9px 16px;min-width:220px;}
.search-box input{border:none;outline:none;font-size:13px;background:none;width:100%;color:var(--n9);}

/* ── kanban board ── */
.board-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.board-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start;}
@media(max-width:1100px){.board-layout{grid-template-columns:1fr;}}
.board{display:flex;gap:18px;overflow-x:auto;padding-bottom:14px;}
.column{flex:0 0 288px;background:var(--n2);min-height:200px;}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:13.5px;font-weight:700;color:var(--n8);border-bottom:1px solid var(--n3);}
.col-count{background:var(--n0);color:var(--n7);padding:2px 10px;font-size:11.5px;font-weight:700;border:1px solid var(--n3);}
.col-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px;}
.col-body.drag-over{background:var(--m50);outline:1.5px dashed var(--m400);outline-offset:-4px;}
.kanban-card{background:var(--n0);border:1px solid var(--n3);padding:14px;cursor:grab;animation:cardIn .3s ease both;transition:box-shadow .2s,border-color .2s;}
.kanban-card:hover{border-color:var(--n6);}
.kanban-card.dragging{opacity:0.4;}
.kc-type-row{display:flex;align-items:center;justify-content:between;gap:6px;margin-bottom:8px;}
.kc-type-tag{background:var(--n1);color:var(--n0);padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:0.02em;}
.kc-type-tag.artwork{background:var(--n8);}
.priority-dot{width:7px;height:7px;border-radius:50%;margin-left:auto;}
.priority-dot.high{background:var(--m600);}
.priority-dot.mid{background:var(--n5);}
.priority-dot.low{background:var(--n3);}
.kc-title{font-size:13.5px;font-weight:700;color:var(--n9);margin-bottom:8px;line-height:1.4;}
.kc-meta-row{display:flex;align-items:center;gap:8px;}
.avatar{width:22px;height:22px;overflow:hidden;background:var(--n3);flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.kc-applicant{font-size:11.5px;color:var(--n7);}
.kc-date{margin-left:auto;font-size:10.5px;color:var(--n6);}
.kc-tag-row{display:flex;gap:6px;margin-top:9px;}
.tag{background:var(--n2);color:var(--n7);font-size:10px;padding:3px 8px;font-weight:600;}

/* matrix side */
.matrix-card{background:var(--n0);border:1px solid var(--n3);padding:20px;}
.matrix-card h3{font-size:14px;font-weight:700;margin:0 0 4px;color:var(--n9);}
.matrix-card p{font-size:11.5px;color:var(--n7);margin:0 0 16px;}
.matrix-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:1px;background:var(--n3);}
.matrix-cell{background:var(--n0);padding:10px 6px;text-align:center;font-size:11px;cursor:pointer;color:var(--n8);}
.matrix-cell.header{background:var(--n2);font-weight:700;color:var(--n7);cursor:default;}
.matrix-cell.rowhead{background:var(--n2);font-weight:700;text-align:left;padding-left:10px;color:var(--n7);cursor:default;}
.matrix-cell.active{background:var(--m600);color:#fff;font-weight:700;}
.matrix-cell:not(.header):not(.rowhead):hover{background:var(--m50);}
.matrix-reset{width:100%;margin-top:14px;background:none;border:1px solid var(--n3);color:var(--n7);padding:9px;font-size:12px;font-weight:600;cursor:pointer;}
.matrix-reset:hover{border-color:var(--n6);}

/* ── orders ── */
.tabs-row{display:flex;gap:0;border-bottom:1px solid var(--n3);margin-bottom:18px;}
.subtab{background:none;border:none;padding:11px 0;margin-right:26px;font-size:13.5px;font-weight:600;color:var(--n6);cursor:pointer;position:relative;}
.subtab.active{color:var(--n10);}
.subtab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--m600);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:11.5px;font-weight:700;color:var(--n6);padding:10px 12px;border-bottom:1px solid var(--n3);text-transform:uppercase;letter-spacing:0.03em;}
.data-table td{padding:14px 12px;border-bottom:1px solid var(--n2);font-size:13px;color:var(--n8);}
.data-table tr.row-click{cursor:pointer;}
.data-table tr.row-click:hover td{background:var(--n1);}
.status-pill{padding:4px 11px;font-size:11px;font-weight:700;display:inline-block;}
.status-pill.paid{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.prep{background:var(--n2);color:var(--n7);}
.status-pill.refund{background:var(--n9);color:var(--n0);}
.bulk-bar{display:flex;align-items:center;gap:14px;background:var(--n9);color:var(--n0);padding:12px 18px;margin-bottom:14px;font-size:13px;}
.bulk-bar button{background:var(--n0);color:var(--n9);border:none;padding:7px 16px;font-weight:700;font-size:12px;cursor:pointer;}

/* ── settlement ── */
.settle-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;}
@media(max-width:1000px){.settle-grid{grid-template-columns:1fr;}}
.rule-row{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--n2);}
.rule-name{font-weight:700;font-size:13.5px;color:var(--n9);flex:1;}
.rule-tier{font-size:11px;color:var(--n6);width:90px;}
.rule-rate{font-size:13px;color:var(--n8);width:60px;}
.rule-cycle{font-size:12px;color:var(--n7);width:80px;}
.edit-link{background:none;border:none;color:var(--n7);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;}
.preview-card{background:var(--n2);padding:22px;}
.preview-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--n3);font-size:12.5px;color:var(--n7);}
.preview-total{display:flex;justify-content:space-between;padding:14px 0 2px;font-size:16px;font-weight:800;color:var(--n10);}
.batch-stepper{display:flex;align-items:center;gap:0;margin:20px 0 8px;}
.batch-step{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--n5);position:relative;padding-bottom:14px;}
.batch-step.active,.batch-step.done{color:var(--n9);}
.batch-track{height:3px;background:var(--n3);position:relative;margin-bottom:6px;}
.batch-fill{height:100%;background:var(--m600);animation:progressGrow .6s ease both;}

/* ── analytics ── */
.analytics-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;}
@media(max-width:1000px){.analytics-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--n0);border:1px solid var(--n3);padding:22px;}
.chart-card h3{font-size:14.5px;font-weight:700;margin:0 0 4px;color:var(--n9);}
.chart-card .chart-sub{font-size:11.5px;color:var(--n7);margin-bottom:14px;}
.period-row{display:flex;gap:6px;margin-bottom:20px;}
.period-btn{background:none;border:1px solid var(--n3);padding:7px 16px;font-size:12px;font-weight:700;color:var(--n7);cursor:pointer;}
.period-btn.active{background:var(--n9);color:var(--n0);border-color:var(--n9);}
.rank-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--n2);cursor:pointer;}
.rank-row:hover{background:var(--n1);}
.rank-row.selected{background:var(--m50);}
.rank-num{width:20px;font-size:12px;font-weight:800;color:var(--n6);}
.rank-name{flex:1;font-size:13px;font-weight:700;color:var(--n9);}
.rank-val{font-size:12.5px;color:var(--n7);}

/* ── artists mgmt ── */
.artist-grid-table{width:100%;}
.status-toggle{width:40px;height:22px;background:var(--n3);position:relative;border:none;cursor:pointer;}
.status-toggle.on{background:var(--m600);}
.status-toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;transition:left .2s;}
.status-toggle.on::after{left:20px;}

/* ── modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--n0);max-width:440px;width:100%;padding:30px;animation:fadeInUp .25s ease;border:1px solid var(--n3);}
.modal-box h3{font-size:18px;font-weight:400;color:var(--n10);margin:0 0 18px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11.5px;font-weight:700;color:var(--n7);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.03em;}
.form-input{width:100%;padding:11px 13px;border:1px solid var(--n3);font-size:13.5px;color:var(--n9);outline:none;background:var(--n0);}
.form-input:focus{border-color:var(--m500);}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.toast{position:fixed;bottom:28px;left:50%;background:var(--n9);color:var(--n0);padding:13px 22px;font-size:13.5px;font-weight:600;z-index:200;animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;}
.spin-icon{animation:spinRotate 1s linear infinite;}
</style>
</head>

/* ───────────────── board (main) ───────────────── */
function BoardView({cards, setCards, showToast}){
  const [dragId, setDragId] = useState(null);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [filterTier, setFilterTier] = useState(null);
  const [filterCat, setFilterCat] = useState(null);
  const [showAddModal, setShowAddModal] = useState(false);

  const TIERS = ['신진','일반','프리미엄'];
  const CATS = ['회화','조각·입체','사진'];

  const visibleCards = cards.filter(c =>
    (!filterTier || c.tier === filterTier) && (!filterCat || c.category === filterCat)
  );

  const onDrop = (colKey) => {
    setDragOverCol(null);
    const card = cards.find(c => c.id === dragId);
    if(!card) return;
    if(card.status === colKey){ setDragId(null); return; }
    const allowed = ORDER_ALLOWED[card.status] || [];
    if(!allowed.includes(colKey)){
      showToast('허용되지 않는 상태 전환입니다');
      setDragId(null);
      return;
    }
    setCards(prev => prev.map(c => c.id === dragId ? {...c, status: colKey} : c));
    setDragId(null);
  };

  const matrixCount = (tier, cat) => cards.filter(c => c.tier===tier && c.category===cat && c.status!=='approved' && c.status!=='rejected').length;

  return (
    <div className="screen">
      <div className="page-head-row">
        <div style={{display:'flex',alignItems:'center',gap:22}}>
          <svg width="150" height="56" viewBox="0 0 150 56" fill="none" style={{flexShrink:0}}>
            <line x1="8" y1="28" x2="142" y2="28" stroke="var(--n3)" strokeWidth="1.5"/>
            <path d="M18 28 Q40 8 62 28" stroke="var(--n4)" strokeWidth="1.2" fill="none"/>
            <path d="M62 28 Q84 48 106 28" stroke="var(--n4)" strokeWidth="1.2" fill="none"/>
            <path d="M106 28 Q120 12 134 28" stroke="var(--n4)" strokeWidth="1.2" fill="none"/>
            <circle cx="18" cy="28" r="7" fill="var(--n9)"/>
            <circle cx="62" cy="28" r="7" fill="var(--n7)"/>
            <circle cx="106" cy="28" r="7" fill="var(--m600)"/>
            <circle cx="134" cy="28" r="7" fill="var(--n0)" stroke="var(--n5)" strokeWidth="1.5"/>
          </svg>
          <div>
            <div className="page-title">작가·작품 승인 워크플로우</div>
            <div className="page-sub">신규 작가 가입과 작품 등록 신청을 검토하고 승인 상태를 관리합니다</div>
          </div>
        </div>
        <div className="page-actions">
          <div className="search-box"><i className="ph ph-magnifying-glass"></i><input placeholder="신청자, 작품명 검색" /></div>
          <button className="pill-btn-fill" onClick={()=>setShowAddModal(true)}><i className="ph ph-plus" style={{marginRight:6,verticalAlign:'-2px'}}></i>새 항목</button>
        </div>
      </div>

      <div className="board-layout">
        <div>
          <div className="board-toolbar">
            {(filterTier || filterCat) && <span style={{fontSize:12.5,color:'var(--n7)'}}>필터: {filterTier||'전체 등급'} · {filterCat||'전체 카테고리'}</span>}
          </div>
          <div className="board">
            <section className="column">
              <div className="col-header">대기 <span className="col-count">{visibleCards.filter(c=>c.status==='wait').length}</span></div>
              <div className={`col-body ${dragOverCol==='wait'?'drag-over':''}`}
                   onDragOver={(e)=>{e.preventDefault(); setDragOverCol('wait');}}
                   onDragLeave={()=>setDragOverCol(null)}
                   onDrop={()=>onDrop('wait')}>
                {visibleCards.filter(c=>c.status==='wait').map(c => (
                  <KanbanCard key={c.id} card={c} dragging={dragId===c.id} onDragStart={()=>setDragId(c.id)} onDragEnd={()=>setDragId(null)} />
                ))}
              </div>
            </section>
            <section className="column">
              <div className="col-header">검토중 <span className="col-count">{visibleCards.filter(c=>c.status==='review').length}</span></div>
              <div className={`col-body ${dragOverCol==='review'?'drag-over':''}`}
                   onDragOver={(e)=>{e.preventDefault(); setDragOverCol('review');}}
                   onDragLeave={()=>setDragOverCol(null)}
                   onDrop={()=>onDrop('review')}>
                {visibleCards.filter(c=>c.status==='review').map(c => (
                  <KanbanCard key={c.id} card={c} dragging={dragId===c.id} onDragStart={()=>setDragId(c.id)} onDragEnd={()=>setDragId(null)} />
                ))}
              </div>
            </section>
            <section className="column">
              <div className="col-header">승인 <span className="col-count">{visibleCards.filter(c=>c.status==='approved').length}</span></div>
              <div className={`col-body ${dragOverCol==='approved'?'drag-over':''}`}
                   onDragOver={(e)=>{e.preventDefault(); setDragOverCol('approved');}}
                   onDragLeave={()=>setDragOverCol(null)}
                   onDrop={()=>onDrop('approved')}>
                {visibleCards.filter(c=>c.status==='approved').map(c => (
                  <KanbanCard key={c.id} card={c} dragging={dragId===c.id} onDragStart={()=>setDragId(c.id)} onDragEnd={()=>setDragId(null)} />
                ))}
              </div>
            </section>
            <section className="column">
              <div className="col-header">반려 <span className="col-count">{visibleCards.filter(c=>c.status==='rejected').length}</span></div>
              <div className={`col-body ${dragOverCol==='rejected'?'drag-over':''}`}
                   onDragOver={(e)=>{e.preventDefault(); setDragOverCol('rejected');}}
                   onDragLeave={()=>setDragOverCol(null)}
                   onDrop={()=>onDrop('rejected')}>
                {visibleCards.filter(c=>c.status==='rejected').map(c => (
                  <KanbanCard key={c.id} card={c} dragging={dragId===c.id} onDragStart={()=>setDragId(c.id)} onDragEnd={()=>setDragId(null)} />
                ))}
              </div>
            </section>
          </div>
        </div>

        <div className="matrix-card">
          <h3>우선순위 매트릭스</h3>
          <p>작가 등급 × 카테고리로 대기·검토 건을 필터링합니다</p>
          <div className="matrix-grid">
            <div className="matrix-cell header"></div>
            {CATS.map(cat => <div key={cat} className="matrix-cell header">{cat}</div>)}
            {TIERS.map(tier => (
              <React.Fragment key={tier}>
                <div className="matrix-cell rowhead">{tier}</div>
                {CATS.map(cat => (
                  <div key={cat} className={`matrix-cell ${filterTier===tier && filterCat===cat ? 'active':''}`}
                    onClick={()=>{setFilterTier(tier); setFilterCat(cat);}}>
                    {matrixCount(tier,cat)}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
          <button className="matrix-reset" onClick={()=>{setFilterTier(null); setFilterCat(null);}}>전체 보기</button>
        </div>
      </div>

      {showAddModal && (
        <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>새 항목 추가</h3>
            <div className="form-group"><label className="form-label">신청 유형</label>
              <select className="form-input"><option>작가가입</option><option>작품등록</option></select>
            </div>
            <div className="form-group"><label className="form-label">신청자명</label><input className="form-input" placeholder="예: 김도윤"/></div>
            <div className="form-group"><label className="form-label">카테고리</label>
              <select className="form-input"><option>회화</option><option>조각·입체</option><option>사진</option><option>공예</option></select>
            </div>
            <div className="modal-close-row">
              <button className="pill-btn" onClick={()=>setShowAddModal(false)}>취소</button>
              <button className="pill-btn-fill" onClick={()=>{
                setCards(prev => [{id: Date.now(), type:'작가가입', title:'신규 접수 항목', applicant:'신규 신청자', tier:'신진', category:'회화', date:'09.10', priority:'mid', status:'wait'}, ...prev]);
                setShowAddModal(false); showToast('새 항목이 대기 열에 추가되었습니다');
              }}>추가하기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function KanbanCard({card, dragging, onDragStart, onDragEnd}){
  return (
    <div className={`kanban-card ${dragging?'dragging':''}`} style={{borderRadius: 0}} draggable onDragStart={onDragStart} onDragEnd={onDragEnd}>
      <div className="kc-type-row">
        <span className={`kc-type-tag ${card.type==='작품등록'?'artwork':''}`}>{card.type}</span>
        <span className={`priority-dot ${card.priority}`}></span>
      </div>
      <div className="kc-title">{card.title}</div>
      <div className="kc-meta-row">
        <span className="avatar"><img src={avatarUrl(card.applicant)} alt={card.applicant}/></span>
        <span className="kc-applicant">{card.applicant}</span>
        <span className="kc-date">{card.date}</span>
      </div>
      <div className="kc-tag-row"><span className="tag">{card.category}</span><span className="tag">{card.tier}</span></div>
    </div>
  );
}

  const [detail, setDetail] = useState(null);
  const list = filter==='전체' ? ORDERS : ORDERS.filter(o=>o.status===filter);

  const toggleSel = (id) => setSelected(prev => { const n = new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });

  return (
    <div className="screen">
      <div className="page-head-row">
        <div><div className="page-title">주문·매출 통합 관리</div><div className="page-sub">전체 주문과 결제 현황을 조회하고 예외 건을 처리합니다</div></div>
      </div>
      <div className="tabs-row">
        {['전체','결제완료','배송준비','완료','환불'].map(s => (
          <button key={s} className={`subtab ${filter===s?'active':''}`} onClick={()=>setFilter(s)}>{s}</button>
        ))}
      </div>
      {selected.size>0 && (
        <div className="bulk-bar">
          <span>{selected.size}건 선택됨</span>
          <button onClick={()=>{showToast(`${selected.size}건이 일괄 처리되었습니다`); setSelected(new Set());}}>일괄 상태 변경</button>
        </div>
      )}
      <table className="data-table">
        <thead><tr>
          <th style={{width:30}}></th><th>주문번호</th><th>구매자</th><th>작품명</th><th>금액</th><th>결제상태</th><th>처리일</th>
        </tr></thead>
        <tbody>
          {list.map(o => (
            <tr key={o.id} className="row-click" onClick={()=>setDetail(o)}>

              <td>{o.id}</td>
              <td>{o.buyer}</td>
              <td>{o.art}</td>
              <td>{money(o.amount)}</td>
              <td><span className={`status-pill ${o.status==='결제완료'?'paid':o.status==='환불'?'refund':'prep'}`}>{o.status}</span></td>
              <td>{o.date}</td>
            </tr>
          ))}
        </tbody>
      </table>

      {detail && (
        <div className="modal-overlay" onClick={()=>setDetail(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>주문 상세 — {detail.id}</h3>
            <div className="preview-row"><span>구매자</span><span>{detail.buyer}</span></div>
            <div className="preview-row"><span>작품</span><span>{detail.art}</span></div>
            <div className="preview-row"><span>금액</span><span>{money(detail.amount)}</span></div>
            <div className="preview-row"><span>트랜잭션 로그</span><span>PG 승인 #{detail.id.slice(-4)}</span></div>
            <div className="modal-close-row">
              <button className="pill-btn" onClick={()=>setDetail(null)}>닫기</button>
              <button className="pill-btn-fill" onClick={()=>{showToast('환불 요청이 접수되었습니다'); setDetail(null);}}><i className="ph ph-arrow-u-up-left" style={{marginRight:6,verticalAlign:'-2px'}}></i>환불 처리</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────── settlement ───────────────── */
function SettlementView({showToast}){
  const [editRule, setEditRule] = useState(null);
  const [batchStep, setBatchStep] = useState(0);
  const steps = ['준비','확정','완료'];
  const totalPreview = RULES.reduce((s,r)=> s + Math.round(1000000 * (1 - r.rate/100)), 0);

  return (
    <div className="screen">
      <div className="page-head-row">
        <div><div className="page-title">정산 규칙 엔진</div><div className="page-sub">작가별 수수료율과 정산 주기를 관리하고 정산 예정 금액을 미리 확인합니다</div></div>
      </div>
      <div className="settle-grid">
        <div>
          <div className="rule-row" style={{fontWeight:700,color:'var(--n6)',fontSize:11.5,textTransform:'uppercase'}}>
            <span className="rule-name">작가</span><span className="rule-tier">등급</span><span className="rule-rate">수수료</span><span className="rule-cycle">정산주기</span><span style={{width:60}}></span>
          </div>
          {RULES.map(r => (
            <div key={r.id} className="rule-row">
              <span className="rule-name">{r.name}</span>
              <span className="rule-tier">{r.tier}</span>
              <span className="rule-rate">{r.rate}%</span>
              <span className="rule-cycle">{r.cycle}</span>
              <button className="edit-link" onClick={()=>setEditRule(r)}>규칙 수정</button>
            </div>
          ))}
        </div>

        <div className="preview-card">
          <h3 style={{fontSize:14.5,fontWeight:700,margin:'0 0 14px',color:'var(--n9)'}}>이번 정산 배치 미리보기</h3>
          {RULES.slice(0,4).map(r => (
            <div key={r.id} className="preview-row"><span>{r.name}</span><span>{money(Math.round(1000000 * (1 - r.rate/100)))}</span></div>
          ))}
          <div className="preview-total"><span>정산 예정 총액</span><span>{money(totalPreview)}</span></div>

          <div className="batch-stepper">
            {steps.map((s,i)=>(<div key={s} className={`batch-step ${i===batchStep?'active':i<batchStep?'done':''}`}>{s}</div>))}
          </div>
          <div className="batch-track"><div className="batch-fill" style={{'--pw': `${((batchStep+1)/steps.length)*100}%`, width:`${((batchStep+1)/steps.length)*100}%`}}></div></div>
          <button className="pill-btn-fill" style={{width:'100%',marginTop:14}}
            onClick={()=>{
              if(batchStep < steps.length-1){ setBatchStep(s=>s+1); showToast(`정산 배치가 '${steps[Math.min(batchStep+1,2)]}' 상태로 전환되었습니다`); }
              else { showToast('이미 완료된 배치입니다'); }
            }}>{batchStep<steps.length-1 ? '다음 단계로 진행' : '배치 완료됨'}</button>
        </div>
      </div>

      {editRule && (
        <div className="modal-overlay" onClick={()=>setEditRule(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>{editRule.name} 정산 규칙 수정</h3>
            <div className="form-group"><label className="form-label">수수료율</label><input className="form-input" type="number" defaultValue={editRule.rate}/></div>
            <div className="form-group"><label className="form-label">정산 주기</label>
              <select className="form-input" defaultValue={editRule.cycle}><option>주 정산</option><option>월 정산</option></select>
            </div>
            <div className="modal-close-row">
              <button className="pill-btn" onClick={()=>setEditRule(null)}>취소</button>
              <button className="pill-btn-fill" onClick={()=>{showToast('정산 규칙이 저장되었습니다'); setEditRule(null);}}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          {ARTIST_RANK.map((a,i) => (
            <div key={a.name} className={`rank-row ${selectedArtist.name===a.name?'selected':''}`} onClick={()=>setSelectedArtist(a)}>
              <span className="rank-num">{i+1}</span>
              <span className="avatar"><img src={avatarUrl(a.name)} alt={a.name}/></span>
              <span className="rank-name">{a.name}</span>
              <span className="rank-val">{money(a.sales)}</span>
            </div>
          ))}
          <h3 style={{marginTop:22}}>{selectedArtist.name} 상세 매출 추이</h3>
          <div style={{height:150}}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={selectedArtist.trend}>
                <XAxis dataKey="k" tick={{fontSize:10, fill:'#6d6d6d'}} axisLine={false} tickLine={false} />
                <YAxis hide />
                <Tooltip />
                <Line type="monotone" dataKey="v" stroke="#83251e" strokeWidth={2} dot={{r:2.5, fill:'#83251e'}} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────────────── artists mgmt ───────────────── */
function ArtistsView({showToast}){
  const [artists, setArtists] = useState(ARTIST_DIRECTORY);
  const [detail, setDetail] = useState(null);
  const toggle = (id) => setArtists(prev => prev.map(a => a.id===id ? {...a, active: !a.active} : a));

  return (
    <div className="screen">
      <div className="page-head-row">
        <div><div className="page-title">작가 관리</div><div className="page-sub">승인된 작가 목록과 활동 상태를 관리합니다</div></div>
        <div className="search-box"><i className="ph ph-magnifying-glass"></i><input placeholder="작가명 검색" /></div>
      </div>
      <table className="data-table artist-grid-table">
        <thead><tr><th>작가</th><th>등급</th><th>등록 작품</th><th>누적 판매액</th><th>상태</th><th></th></tr></thead>
        <tbody>
          {artists.map(a => (
            <tr key={a.id} className="row-click" onClick={()=>setDetail(a)}>
              <td style={{display:'flex',alignItems:'center',gap:10}}><span className="avatar"><img src={avatarUrl(a.name)} alt={a.name}/></span>{a.name}</td>
              <td>{a.tier}</td>
              <td>{a.works}개</td>
              <td>{money(a.sales)}</td>
              <td><span className={`status-pill ${a.active?'paid':'refund'}`}>{a.active?'활성':'정지'}</span></td>
              <td onClick={e=>e.stopPropagation()}>
                <button className={`status-toggle ${a.active?'on':''}`} onClick={()=>{toggle(a.id); showToast(`${a.name} 작가가 ${a.active?'정지':'활성화'}되었습니다`);}}></button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>

      {detail && (
        <div className="modal-overlay" onClick={()=>setDetail(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>{detail.name} 작가 정보</h3>
            <div className="preview-row"><span>등급</span><span>{detail.tier}</span></div>
            <div className="preview-row"><span>등록 작품</span><span>{detail.works}개</span></div>
            <div className="preview-row"><span>누적 판매액</span><span>{money(detail.sales)}</span></div>
            <div className="preview-row"><span>현재 상태</span><span>{detail.active?'활성':'정지'}</span></div>
            <div className="modal-close-row"><button className="pill-btn" onClick={()=>setDetail(null)}>닫기</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────── App root ───────────────── */
function App(){
  const [tab, setTab] = useState('board');
  const [cards, setCards] = useState(INITIAL_CARDS);
  const [toast, setToast] = useState('');
  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(''), 2400); };

  return (
    <div className="app-shell" data-archetype="kanban-board">
      <header className="app-header">
        <div className="app-header-row">
          <div className="app-brand">
            <span className="app-brand-mark">C</span>
            <div>
              <div className="app-brand-name">캔버스온</div>
              <div className="app-brand-sub">ADMIN CONSOLE</div>
            </div>
          </div>
          <div className="tab-strip-wrap">
            <div className="tab-strip">
              <button className={`top-tab ${tab==='board'?'active':''}`} onClick={()=>setTab('board')}>승인 관리</button>
              <button className={`top-tab ${tab==='artists'?'active':''}`} onClick={()=>setTab('artists')}>작가 관리</button>
              <button className={`top-tab ${tab==='orders'?'active':''}`} onClick={()=>setTab('orders')}>주문 관리</button>
              <button className={`top-tab ${tab==='settlement'?'active':''}`} onClick={()=>setTab('settlement')}>정산 관리</button>
              <button className={`top-tab ${tab==='analytics'?'active':''}`} onClick={()=>setTab('analytics')}>분석</button>
            </div>
          </div>
          <div className="header-right">
            <button className="icon-btn" onClick={()=>showToast('새 알림 3건이 있습니다')}><i className="ph ph-bell"></i></button>
            <button className="icon-btn" onClick={()=>showToast('설정 메뉴는 준비 중입니다')}><i className="ph ph-gear"></i></button>
            <span className="admin-avatar"><img src={avatarUrl('관리자')} alt="관리자"/></span>
          </div>
        </div>
      </header>

      {tab==='board' && <BoardView cards={cards} setCards={setCards} showToast={showToast} />}
      {tab==='orders' && <OrdersView showToast={showToast} />}
      {tab==='settlement' && <SettlementView showToast={showToast} />}
      {tab==='analytics' && <AnalyticsView />}
      {tab==='artists' && <ArtistsView showToast={showToast} />}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
