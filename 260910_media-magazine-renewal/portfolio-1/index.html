<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여백 — 라이프스타일 매거진 콘텐츠 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 232°, dark) ── */
:root{
  --m50:#e7eafc;
  --m100:#cfd4f9;
  --m200:#b1baf6;
  --m300:#909df2;
  --m400:#7182ef;
  --m500:#5266eb;
  --m600:#4354c1;
  --m700:#344196;
  --m800:#252e6a;
  --m900:#252e6a;
  --n0:#1e1e20;
  --n1:#36363a;
  --n2:#53545a;
  --n3:#71727a;
  --n4:#909198;
  --n5:#b5b5ba;
  --n6:#c3c3cc;
  --n7:#e5e5e6;
  --n8:#efeff0;
  --n9:#ededf3;
  --n10:#fcfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
}

*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
#root{width:100%;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;margin:0;padding:0;}
h1,h2,h3,h4,p{margin:0;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes shimmer{0%{background-position:-320px 0;}100%{background-position:320px 0;}}
@keyframes ripple{from{transform:scale(0);opacity:.45;}to{transform:scale(2.6);opacity:0;}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes modalIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}

.app-shell{width:100%;min-height:100vh;background:var(--n0);display:flex;flex-direction:column;}

/* ── Topbar (feed-timeline signature: 로고 / 검색 / 프로필) ── */
.topbar{position:sticky;top:0;z-index:50;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(30,30,32,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--n1);}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--n9);cursor:pointer;background:none;border:none;padding:0;}
.brand .mark{width:30px;height:30px;border-radius:32px;background:var(--m500);display:flex;align-items:center;justify-content:center;color:var(--n10);font-size:15px;font-weight:700;}
.top-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:40px;border:1px solid var(--n2);background:transparent;color:var(--n7);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,color .2s;position:relative;overflow:hidden;}
.icon-btn:hover{border-color:var(--n4);color:var(--n9);}
.btn{position:relative;overflow:hidden;cursor:pointer;font-weight:500;transition:transform .18s,opacity .18s;}
.btn:active{transform:scale(.97);}
.ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);animation:ripple .6s ease-out;pointer-events:none;}
.btn-primary{background:var(--m500);color:var(--n10);border:none;border-radius:32px;padding:11px 24px;font-size:15px;}
.btn-ghost{background:transparent;color:var(--n9);border:1px solid var(--n9);border-radius:40px;padding:10px 22px;font-size:15px;}
.btn-ghost:hover{background:var(--n1);}

/* ── Hero ── */
.hero{position:relative;width:100%;min-height:74vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.7) brightness(.62);}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,30,32,.35) 0%,rgba(30,30,32,.92) 92%);}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,30,32,.35) 0%,rgba(30,30,32,.92) 92%);}
.hero-content{position:relative;z-index:2;max-width:680px;text-align:center;padding:0 24px;animation:fadeInUp .8s ease both;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:40px;border:1px solid var(--n4);color:var(--n8);font-size:13px;margin-bottom:24px;}
.hero-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--m400);animation:pulseDot 1.8s ease-in-out infinite;}
.hero-title{font-size:clamp(34px,5vw,58px);line-height:1.18;font-weight:700;letter-spacing:-.01em;color:var(--n10);margin-bottom:18px;}
.hero-sub{font-size:18px;line-height:1.5;color:var(--n7);margin-bottom:32px;font-weight:400;}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ── Layout / Composer / Feed / Rail ── */
.layout{width:100%;max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:40px;align-items:flex-start;}
.feed-col{flex:1;min-width:0;max-width:640px;margin:0 auto;padding:40px 0 80px;}
.composer{position:sticky;top:113px;z-index:20;background:rgba(30,30,32,.94);backdrop-filter:blur(10px);padding:16px 0;margin-bottom:8px;border-bottom:1px solid var(--n1);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip{border:1px solid var(--n2);background:transparent;color:var(--n7);border-radius:40px;padding:8px 16px;font-size:14px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.chip:hover{border-color:var(--n5);color:var(--n9);}
.chip.active{background:var(--m50);color:var(--m700);border-color:var(--m500);}
.chip-search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--n2);border-radius:40px;padding:6px 14px;color:var(--n6);}
.chip-search input{background:none;border:none;outline:none;color:var(--n9);font-size:14px;width:130px;}
.chip-search input::placeholder{color:var(--n5);}

.demo-strip{position:sticky;top:64px;z-index:45;width:100%;background:rgba(30,30,32,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--n1);display:flex;align-items:center;gap:10px;padding:10px 32px;overflow-x:auto;}
.demo-strip-label{font-size:11.5px;color:var(--n4);white-space:nowrap;flex-shrink:0;}
.demo-strip-btn{white-space:nowrap;background:transparent;border:1px solid var(--n2);color:var(--n7);border-radius:40px;padding:7px 15px;font-size:12.5px;cursor:pointer;transition:border-color .2s,color .2s;flex-shrink:0;}
.demo-strip-btn:hover{border-color:var(--m400);color:var(--n9);}

.post{background:var(--n0);border-radius:12px;padding:0 0 20px;margin-bottom:8px;border-bottom:1px solid var(--n1);animation:cardIn .5s ease both;cursor:pointer;}
.post-head{display:flex;align-items:center;gap:10px;padding:20px 0 12px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.author{font-size:14px;font-weight:600;color:var(--n9);}
.post-meta{font-size:13px;color:var(--n5);}
.post-cat{font-size:12px;color:var(--m400);font-weight:600;letter-spacing:.02em;margin-bottom:8px;}
.post-body{display:flex;gap:20px;align-items:flex-start;}
.post-thumb{width:132px;height:96px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--n1);}
.post-title{font-size:19px;font-weight:700;line-height:1.35;color:var(--n10);margin-bottom:8px;}
.post-excerpt{font-size:14px;line-height:1.55;color:var(--n6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-actions{display:flex;align-items:center;gap:20px;margin-top:16px;}
.post-action{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--n5);font-size:13px;cursor:pointer;padding:4px 0;transition:color .2s;}
.post-action:hover{color:var(--n8);}
.post-action.active{color:var(--m400);}

.right-rail{width:296px;flex-shrink:0;padding:40px 0 80px;position:sticky;top:150px;display:flex;flex-direction:column;gap:20px;}
.rail-card{background:var(--n1);border-radius:12px;padding:24px;}
.rail-title{font-size:15px;font-weight:700;color:var(--n9);margin-bottom:16px;}
.quick-nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--n0);border:1px solid var(--n2);border-radius:10px;padding:13px 16px;color:var(--n8);font-size:13px;line-height:1.4;cursor:pointer;margin-bottom:10px;transition:border-color .2s;}
.quick-nav-btn:last-child{margin-bottom:0;}
.quick-nav-btn:hover{border-color:var(--m400);}
.quick-nav-btn i{color:var(--n5);flex-shrink:0;}
.popular-item{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--n2);cursor:pointer;}
.popular-item:last-child{border-bottom:none;}
.popular-rank{font-size:16px;font-weight:700;color:var(--n4);width:16px;flex-shrink:0;}
.popular-title{font-size:13.5px;line-height:1.4;color:var(--n8);}
.author-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.author-row .author{font-size:13.5px;}
.author-row .role{font-size:12px;color:var(--n5);}
.follow-btn{margin-left:auto;font-size:12px;border:1px solid var(--n3);background:none;color:var(--n7);border-radius:40px;padding:5px 12px;cursor:pointer;}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.tag-chip{font-size:12.5px;color:var(--n7);background:var(--n0);border:1px solid var(--n2);border-radius:40px;padding:6px 12px;cursor:pointer;}

/* ── Article view ── */
.article-wrap{max-width:760px;margin:0 auto;padding:48px 24px 100px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--n6);font-size:14px;cursor:pointer;margin-bottom:28px;}
.breadcrumb{font-size:13px;color:var(--n5);margin-bottom:16px;}
.article-title{font-size:clamp(28px,3.6vw,42px);line-height:1.25;font-weight:700;color:var(--n10);margin-bottom:20px;}
.byline{display:flex;align-items:center;gap:12px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--n1);}
.byline-info{font-size:14px;color:var(--n7);}
.byline-info .name{font-weight:700;color:var(--n9);}
.article-hero-img{width:100%;height:380px;object-fit:cover;border-radius:12px;margin-bottom:32px;}
.article-body p{font-size:17px;line-height:1.85;color:var(--n7);margin-bottom:22px;}
.pull-quote{border-left:3px solid var(--m500);padding:4px 0 4px 22px;font-size:20px;line-height:1.5;color:var(--n9);font-weight:600;margin:32px 0;}
.article-tags{display:flex;gap:8px;flex-wrap:wrap;margin:32px 0;}
.seo-panel{background:var(--n1);border-radius:12px;padding:24px;margin:40px 0;}
.seo-panel-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.seo-panel-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--n9);}
.seo-pre{margin-top:16px;background:var(--n0);border-radius:8px;padding:16px;font-size:12.5px;line-height:1.7;color:var(--n7);overflow-x:auto;font-family:ui-monospace,'SF Mono',Menlo,monospace;white-space:pre;}
.redirect-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12.5px;}
.redirect-table th{text-align:left;color:var(--n5);font-weight:500;padding:8px 0;border-bottom:1px solid var(--n2);}
.redirect-table td{padding:9px 0;border-bottom:1px solid var(--n2);color:var(--n7);}
.redirect-table td.new-url{color:var(--m400);}

/* ── Search view ── */
.search-wrap{max-width:1000px;margin:0 auto;padding:48px 24px 100px;}
.search-tabs{display:flex;gap:8px;margin-bottom:32px;border-bottom:1px solid var(--n1);}
.search-tab{background:none;border:none;padding:12px 4px;margin-right:24px;font-size:15px;font-weight:600;color:var(--n5);cursor:pointer;position:relative;}
.search-tab.active{color:var(--n10);}
.search-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--m500);}
.search-input-lg{width:100%;background:var(--n1);border:1px solid var(--n2);border-radius:40px;padding:16px 22px;color:var(--n9);font-size:15px;outline:none;margin-bottom:28px;}
.search-input-lg::placeholder{color:var(--n5);}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.cat-card{background:var(--n1);border-radius:12px;padding:24px;text-align:center;border:1px solid var(--n1);cursor:pointer;transition:border-color .2s;}
.cat-card:hover{border-color:var(--m500);}
.cat-card i{font-size:26px;color:var(--m400);margin-bottom:10px;display:block;}
.cat-card .cnt{font-size:12px;color:var(--n5);margin-top:4px;}
.results-skeleton{height:96px;border-radius:12px;background:linear-gradient(90deg,var(--n1) 25%,var(--n2) 37%,var(--n1) 63%);background-size:400px 100%;animation:shimmer 1.3s linear infinite;margin-bottom:12px;}
.result-row{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--n1);cursor:pointer;animation:cardIn .4s ease both;}
.result-row img{width:88px;height:64px;object-fit:cover;border-radius:8px;}
.result-title{font-size:15.5px;font-weight:600;color:var(--n9);margin-bottom:4px;}
.result-meta{font-size:12.5px;color:var(--n5);}
.author-profile-card{display:flex;gap:20px;align-items:center;background:var(--n1);border-radius:12px;padding:28px;margin-bottom:14px;}
.author-avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;}
.author-bio{font-size:13.5px;color:var(--n6);line-height:1.6;margin-top:6px;}
.author-stats{margin-left:auto;text-align:right;font-size:12.5px;color:var(--n5);flex-shrink:0;}
.author-stats .num{font-size:20px;font-weight:700;color:var(--n9);}

@media (max-width:860px){
  .layout{flex-direction:column;}
  .right-rail{width:100%;position:static;padding-top:0;}
  .post-body{flex-direction:column;}
  .post-thumb{width:100%;height:180px;}
  .cat-grid{grid-template-columns:1fr;}
}

/* ── Partnership view ── */
.partner-wrap{max-width:920px;margin:0 auto;padding:48px 24px 100px;}
.partner-tabs{display:flex;gap:12px;margin-bottom:32px;}
.partner-tab{background:var(--n1);border:1px solid var(--n2);border-radius:40px;padding:10px 20px;font-size:14px;color:var(--n7);cursor:pointer;}
.partner-tab.active{background:var(--m50);color:var(--m700);border-color:var(--m500);}
.partner-intro{background:var(--n1);border-radius:12px;padding:36px;margin-bottom:36px;}
.partner-intro h2{font-size:26px;font-weight:700;color:var(--n10);margin-bottom:14px;}
.partner-intro p{font-size:15.5px;line-height:1.75;color:var(--n7);margin-bottom:20px;}
.stat-row{display:flex;gap:32px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--n2);}
.stat-item .num{font-size:24px;font-weight:700;color:var(--n9);}
.stat-item .label{font-size:12.5px;color:var(--n5);margin-top:4px;}
.editor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:36px;}
.editor-card{background:var(--n1);border-radius:12px;padding:22px;display:flex;gap:14px;align-items:flex-start;}
.form-card{background:var(--n1);border-radius:12px;padding:32px;}
.form-card h3{font-size:18px;font-weight:700;color:var(--n9);margin-bottom:24px;}
.form-row{margin-bottom:20px;}
.form-row label{display:block;font-size:13.5px;color:var(--n7);margin-bottom:8px;font-weight:600;}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:12px 14px;color:var(--n9);font-size:14.5px;outline:none;transition:border-color .2s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--m500);}
.form-row.error input,.form-row.error textarea{border-color:var(--s2);}
.error-msg{font-size:12.5px;color:var(--s2-text);margin-top:6px;}
.form-row textarea{resize:vertical;min-height:110px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:640px){.editor-grid,.form-grid-2{grid-template-columns:1fr;}}

/* ── Modal / Toast ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--n1);border-radius:16px;padding:32px;max-width:420px;width:100%;animation:modalIn .25s cubic-bezier(.2,.9,.3,1) both;}
.modal-box h3{font-size:19px;font-weight:700;color:var(--n10);margin-bottom:10px;}
.modal-box p{font-size:14px;color:var(--n6);line-height:1.6;margin-bottom:22px;}
.modal-close{position:absolute;top:16px;right:16px;}
.share-links{display:flex;gap:10px;margin-top:8px;}
.share-link-btn{flex:1;background:var(--n0);border:1px solid var(--n2);border-radius:10px;padding:12px;text-align:center;color:var(--n7);font-size:13px;cursor:pointer;}
.share-link-btn i{display:block;font-size:20px;margin-bottom:6px;color:var(--n7);}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--n8);color:var(--n0);padding:14px 24px;border-radius:40px;font-size:14px;font-weight:600;z-index:300;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;}

footer.site-footer{width:100%;background:var(--n1);padding:40px 24px;text-align:center;color:var(--n5);font-size:13px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const CATEGORIES = ['전체','여행','라이프스타일','푸드','컬처'];

const ARTICLES = [
  {id:1, category:'여행', title:'제주 오름을 걷는 법: 계절이 다른 다섯 갈래 길', excerpt:'봄에는 유채꽃, 가을엔 억새 물결. 오름마다 다른 얼굴을 보여주는 사계절 산책 코스를 소개합니다.', author:'한소연', role:'여행 에디터', date:'2026-09-08', read:'6분', img:11},

function Ripple({className, onClick, children, ...rest}){
  function handle(e){
    const btn = e.currentTarget;
    const circle = document.createElement('span');
    const d = Math.max(btn.clientWidth, btn.clientHeight);
    circle.style.width = circle.style.height = d+'px';
    circle.style.left = (e.nativeEvent.offsetX - d/2)+'px';
    circle.style.top = (e.nativeEvent.offsetY - d/2)+'px';
    circle.className = 'ripple-el';
    btn.appendChild(circle);
    setTimeout(()=>circle.remove(),600);
    onClick && onClick(e);
  }
  return <button className={className} onClick={handle} {...rest}>{children}</button>;
}

function CountUpStat({label, target}){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let cur = 0;
    const step = Math.max(1, Math.ceil(target/16));
    const timer = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(timer); }
      setN(cur);
    }, 35);
    return ()=>clearInterval(timer);
  },[target]);
  return <span style={{fontWeight:700,color:'var(--n9)'}}>{n}</span>;
}

        <h3>제휴 문의하기</h3>
        <div className="form-grid-2">
          <div className={"form-row"+(errors.name?" error":"")}>
            <label>담당자명</label>
            <input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="이름을 입력해 주세요" />
            {errors.name && <div className="error-msg">{errors.name}</div>}
          </div>
          <div className="form-row">
            <label>회사 / 브랜드명</label>
            <input value={form.company} onChange={e=>set('company',e.target.value)} placeholder="선택 입력" />
          </div>
        </div>
        <div className="form-grid-2">
          <div className={"form-row"+(errors.email?" error":"")}>
            <label>이메일</label>
            <input value={form.email} onChange={e=>set('email',e.target.value)} placeholder="답변 받을 이메일" />
            {errors.email && <div className="error-msg">{errors.email}</div>}
          </div>
          <div className="form-row">
            <label>문의 유형</label>
            <select value={form.type} onChange={e=>set('type',e.target.value)}>
              <option>광고 제휴</option>
              <option>콘텐츠 협업</option>
              <option>객원 필자 지원</option>
              <option>기타 문의</option>
            </select>
          </div>
        </div>
        <div className={"form-row"+(errors.message?" error":"")}>
          <label>문의 내용</label>
          <textarea value={form.message} onChange={e=>set('message',e.target.value)} placeholder="문의하실 내용을 자유롭게 남겨 주세요" />
          {errors.message && <div className="error-msg">{errors.message}</div>}
        </div>
        <Ripple className="btn btn-primary" onClick={submit}>문의 보내기</Ripple>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('home');
  const [selected, setSelected] = useState(null);
  const [category, setCategory] = useState('전체');
  const [query, setQuery] = useState('');
  const [bookmarks, setBookmarks] = useState([]);
  const [shareTarget, setShareTarget] = useState(null);
  const [subscribeOpen, setSubscribeOpen] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(()=>{
    if(toast){ const t = setTimeout(()=>setToast(''),2400); return ()=>clearTimeout(t); }
  },[toast]);

  function openArticle(a){ setSelected(a); setView('article'); window.scrollTo(0,0); }
  function goHome(){ setView('home'); window.scrollTo(0,0); }
  function goSearch(){ setView('search'); window.scrollTo(0,0); }
  function goPartnership(){ setView('partnership'); window.scrollTo(0,0); }
  function toggleBookmark(id){
    setBookmarks(b=> b.includes(id) ? b.filter(x=>x!==id) : [...b,id]);
    setToast('스크랩 목록이 업데이트되었습니다');
  }
  function openShare(a){ setShareTarget(a); }

  return (
    <div className="app-shell" data-archetype="feed-timeline">
      <TopBar onHome={goHome} onSearch={goSearch} onPartnership={goPartnership} />
      <DemoStrip onArticle={()=>openArticle(ARTICLES[0])} onSearchView={goSearch} onPartnership={goPartnership} />
      {view==='home' && (
        <HomeView onOpen={openArticle} onSearchView={goSearch} onPartnership={goPartnership}
          bookmarks={bookmarks} onBookmark={toggleBookmark} onShare={openShare}
          category={category} setCategory={setCategory} query={query} setQuery={setQuery} />
      )}
      {view==='article' && (
        <ArticleView article={selected} onBack={goHome} onShare={openShare}
          bookmarked={selected?bookmarks.includes(selected.id):false} onBookmark={toggleBookmark} />
      )}
      {view==='search' && <SearchView onOpen={openArticle} />}
      {view==='partnership' && <PartnershipView onSubmitted={()=>setToast('문의가 접수되었습니다')} />}

      <footer className="site-footer">© 2026 여백매거진 — 자체 개발 프로젝트 데모</footer>

      {shareTarget && (
        <div className="modal-overlay" onClick={()=>setShareTarget(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>공유하기</h3>
            <p>"{shareTarget.title}"</p>
            <div className="share-links">
              <button className="share-link-btn" onClick={()=>{setShareTarget(null);setToast('링크가 복사되었습니다');}}><i className="ph ph-link"></i>링크 복사</button>
              <button className="share-link-btn" onClick={()=>{setShareTarget(null);setToast('공유되었습니다');}}><i className="ph ph-chat-circle-dots"></i>메시지</button>
              <button className="share-link-btn" onClick={()=>{setShareTarget(null);setToast('공유되었습니다');}}><i className="ph ph-envelope-simple"></i>이메일</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast"><i className="ph-fill ph-check-circle"></i>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
