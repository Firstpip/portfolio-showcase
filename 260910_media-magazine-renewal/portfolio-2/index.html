<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여백 스튜디오 — 매거진 콘텐츠 관리 확장 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 4°, light) ── */
:root{
  --m50:#f8f0f0;
  --m100:#f2e2e0;
  --m200:#e4c4c2;
  --m300:#d4a19d;
  --m400:#c27973;
  --m500:#b1534c;
  --m600:#a02d25;
  --m700:#83251e;
  --m800:#661d18;
  --m900:#481411;
  --n0:#ffffff;
  --n1:#f4f4f4;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d5d5;
  --n5:#bab5b5;
  --n6:#989090;
  --n7:#6d6d6d;
  --n8:#5a5453;
  --n9:#3a3636;
  --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
#root{width:100%;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;margin:0;padding:0;}
h1,h2,h3,h4,p{margin:0;}
table{border-collapse:collapse;width:100%;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes blockIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes shimmer{0%{background-position:-320px 0;}100%{background-position:320px 0;}}
@keyframes ripple{from{transform:scale(0);opacity:.35;}to{transform:scale(2.6);opacity:0;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes modalIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes countUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.app-shell{width:100%;min-height:100vh;display:flex;background:var(--n0);}

/* ── 트리 사이드바 ── */
.tree-sidebar{width:240px;flex-shrink:0;height:100vh;position:fixed;left:0;top:0;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:20px 0;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 18px;border-bottom:1px solid var(--n3);margin-bottom:14px;}
.brand-mark{width:26px;height:26px;background:var(--n10);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.brand-name{font-size:14.5px;font-weight:700;color:var(--n9);}
.sidebar-search{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;}
.search-btn,.quick-add{display:flex;align-items:center;gap:8px;background:var(--n0);border:1px solid var(--n4);padding:9px 12px;font-size:13px;color:var(--n8);cursor:pointer;text-align:left;}
.tree-nav{flex:1;overflow-y:auto;padding:0 10px;}
.tree-group{margin-bottom:6px;}
.tree-item{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:13.5px;color:var(--n9);cursor:pointer;border:1px solid transparent;}
.tree-item:hover{background:var(--n2);}
.tree-item.active{background:var(--n0);border-color:var(--n4);font-weight:700;}
.tree-item.active .tree-label{color:var(--m600);}
.tree-toggle{width:14px;color:var(--n6);flex-shrink:0;display:flex;}
.tree-icon{width:16px;color:var(--n7);flex-shrink:0;display:flex;}
.tree-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.sidebar-footer{padding:14px 20px 0;border-top:1px solid var(--n3);margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.footer-link{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--n7);font-size:12.5px;padding:7px 0;cursor:pointer;text-align:left;}

/* ── main-wrap ── */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);min-height:100vh;}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--n3);}
.page-breadcrumb{font-size:13px;color:var(--n6);display:flex;align-items:center;gap:6px;}
.page-breadcrumb b{color:var(--n9);font-weight:600;}
.topbar-actions{display:flex;gap:10px;align-items:center;}

.btn{position:relative;overflow:hidden;cursor:pointer;font-weight:500;transition:opacity .18s,transform .18s;font-size:14px;}
.btn:active{transform:scale(.97);}
.ripple-el{position:absolute;border-radius:50%;background:rgba(0,0,0,.12);animation:ripple .6s ease-out;pointer-events:none;}
.btn-primary{background:var(--m600);color:var(--n0);border:none;border-radius:75px;padding:10px 22px;}
.btn-outline{background:transparent;color:var(--n9);border:1px solid var(--n9);border-radius:75px;padding:9px 20px;}
.btn-outline:hover{background:var(--n1);}
.btn-sm{padding:6px 14px;font-size:12.5px;border-radius:75px;}
.icon-btn{width:34px;height:34px;border:1px solid var(--n4);background:var(--n0);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n7);}

.page-cover{width:100%;height:140px;background:linear-gradient(120deg,var(--m600) 0%,var(--m800) 100%);}
.page-body{max-width:840px;margin:0 auto;padding:28px 32px 100px;}
.page-icon-row{display:flex;align-items:center;justify-content:space-between;margin-top:-30px;margin-bottom:18px;}
.page-icon-large{width:64px;height:64px;background:var(--n0);border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;color:var(--m600);font-size:26px;}
.page-meta{display:flex;gap:8px;}
.meta-action{background:var(--n0);border:1px solid var(--n4);font-size:12px;color:var(--n7);padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.page-title{font-size:48px;font-weight:700;line-height:1.12;letter-spacing:-.01em;color:var(--n9);margin-bottom:28px;}

.block{display:flex;gap:10px;padding:10px 4px;margin-bottom:2px;animation:blockIn .35s ease both;border-left:2px solid transparent;}
.block:hover{border-left-color:var(--n4);}
.block-handle{width:16px;color:var(--n5);font-size:13px;flex-shrink:0;padding-top:2px;}
.block-content{flex:1;min-width:0;}
.block-text p{font-size:15.5px;line-height:1.7;color:var(--n8);}
.block-heading h2{font-size:22px;font-weight:700;color:var(--n9);}
.block-callout{background:var(--n1);border:1px solid var(--n3);border-left:3px solid var(--m600);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;}
.block-callout p{font-size:13.5px;color:var(--n8);line-height:1.6;}
.block-divider hr{border:none;border-top:1px solid var(--n3);margin:6px 0;}
.block-list ul{padding-left:20px;list-style:disc;}
.block-list li{font-size:14.5px;color:var(--n8);line-height:1.8;}
.block-toggle-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--n9);}
.block-toggle-content{padding:10px 0 0 22px;font-size:13.5px;color:var(--n7);line-height:1.7;}
.block-table table th{text-align:left;font-size:12px;color:var(--n6);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--n3);}
.block-table table td{font-size:13px;color:var(--n8);padding:9px 10px;border-bottom:1px solid var(--n2);}
.block-banner-card{border:1px solid var(--n4);padding:16px;display:flex;gap:16px;align-items:center;}
.block-banner-card img{width:140px;height:78px;object-fit:cover;flex-shrink:0;}
.block-banner-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
.block-banner-fields input{border:1px solid var(--n4);padding:8px 10px;font-size:13px;color:var(--n9);}
.add-block-hint{margin-top:14px;padding:12px 14px;border:1px dashed var(--n4);color:var(--n5);font-size:12.5px;display:flex;align-items:center;gap:8px;cursor:pointer;}

/* ── Tables / lists (inquiries, seo, audit) ── */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.search-field{flex:1;min-width:180px;border:1px solid var(--n4);padding:9px 14px;font-size:13.5px;color:var(--n9);background:var(--n0);}
.filter-chip{border:1px solid var(--n4);background:var(--n0);color:var(--n7);border-radius:75px;padding:7px 16px;font-size:12.5px;cursor:pointer;}
.filter-chip.active{background:var(--n9);color:var(--n0);border-color:var(--n9);}
.data-table{width:100%;}
.data-table th{text-align:left;font-size:12px;color:var(--n6);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--n3);}
.data-table td{font-size:13.5px;color:var(--n8);padding:13px 12px;border-bottom:1px solid var(--n2);vertical-align:middle;}
.data-table tr{cursor:pointer;transition:background .15s;}
.data-table tbody tr:hover{background:var(--n1);}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:75px;background:var(--n2);color:var(--n7);}
.status-badge.done{background:var(--s1-bg);color:var(--s1-text);}
.status-badge.warn{background:var(--s3-bg);color:var(--s3-text);}
.avatar-sq{width:26px;height:26px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

.section-title{font-size:19px;font-weight:700;color:var(--n9);margin:36px 0 16px;}
.section-title:first-child{margin-top:0;}

/* ── Role matrix ── */
.role-matrix{width:100%;border:1px solid var(--n3);}
.role-matrix th,.role-matrix td{border:1px solid var(--n3);padding:12px;font-size:13px;text-align:center;}
.role-matrix th{background:var(--n1);font-size:12px;color:var(--n7);}
.role-matrix td:first-child,.role-matrix th:first-child{text-align:left;font-weight:600;color:var(--n9);}
.perm-toggle{width:38px;height:20px;background:var(--n3);position:relative;cursor:pointer;display:inline-block;border:none;padding:0;}
.perm-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--n0);transition:transform .2s;}
.perm-toggle.on{background:var(--m600);}
.perm-toggle.on::after{transform:translateX(18px);}

.diff-old{color:var(--n6);text-decoration:line-through;font-size:12.5px;}
.diff-new{color:var(--n9);font-weight:600;font-size:12.5px;}

/* ── Modal / Drawer / Toast ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--n0);border:1px solid var(--n4);padding:30px;max-width:440px;width:100%;animation:modalIn .22s ease both;}
.modal-box h3{font-size:18px;font-weight:700;color:var(--n9);margin-bottom:18px;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:12.5px;color:var(--n7);margin-bottom:6px;font-weight:600;}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--n4);padding:10px 12px;font-size:13.5px;color:var(--n9);background:var(--n0);}
.form-row textarea{resize:vertical;min-height:90px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;}
.inline-note{font-size:12px;color:var(--n6);margin-top:6px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:190;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--n0);border-left:1px solid var(--n4);z-index:200;padding:28px;overflow-y:auto;animation:fadeInUp .25s ease both;}
.drawer h3{font-size:19px;font-weight:700;color:var(--n9);margin-bottom:6px;}
.drawer .sub{font-size:12.5px;color:var(--n6);margin-bottom:20px;}
.drawer-field{margin-bottom:16px;}
.drawer-field label{display:block;font-size:11.5px;color:var(--n6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.drawer-field .val{font-size:14px;color:var(--n9);}
.history-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--n2);font-size:12px;color:var(--n7);}
.results-skeleton{height:44px;background:linear-gradient(90deg,var(--n1) 25%,var(--n2) 37%,var(--n1) 63%);background-size:400px 100%;animation:shimmer 1.3s linear infinite;margin-bottom:8px;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n9);color:var(--n0);padding:13px 22px;border-radius:75px;font-size:13.5px;font-weight:600;z-index:300;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;}

@media (max-width:900px){
  .tree-sidebar{position:static;width:100%;height:auto;}
  .main-wrap{margin-left:0;width:100%;}
  .role-matrix{font-size:11px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

function Icon({name, size=16}){
  const ref = React.useRef(null);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[]);
  return <i ref={ref} data-lucide={name} style={{width:size,height:size}}></i>;
}

function Ripple({className, onClick, children, ...rest}){
  function handle(e){
    const btn = e.currentTarget;
    const circle = document.createElement('span');
    const d = Math.max(btn.clientWidth, btn.clientHeight);
    circle.style.width = circle.style.height = d+'px';
    circle.style.left = (e.nativeEvent.offsetX - d/2)+'px';
    circle.style.top = (e.nativeEvent.offsetY - d/2)+'px';
    circle.className = 'ripple-el';
    btn.appendChild(circle);
    setTimeout(()=>circle.remove(),600);
    onClick && onClick(e);
  }
  return <button className={className} onClick={handle} {...rest}>{children}</button>;
}

function TreeSidebar({view, setView, onToast}){
  const [expanded, setExpanded] = useState({'배너 세트 보관함':true});
  return (
    <aside className="tree-sidebar" data-tree-sidebar>
      <div className="sidebar-brand">
        <span className="brand-mark">여</span>
        <span className="brand-name">콘텐츠 운영 스튜디오</span>
      </div>
      <div className="sidebar-search">
        <button className="search-btn" onClick={()=>onToast('검색은 데모 화면에서 준비 중입니다')}><Icon name="search" size={14}/> 검색</button>
        <button className="quick-add" onClick={()=>onToast('새 페이지가 추가되었습니다')}><Icon name="plus" size={14}/> 새 페이지</button>
      </div>
      <nav className="tree-nav">
        {TREE.map(g=>(
          <div className="tree-group" key={g.group}>
            <div className="tree-item" onClick={()=>setExpanded(e=>({...e,[g.group]:!e[g.group]}))}>
              <span className="tree-toggle"><Icon name={expanded[g.group]===false?'chevron-right':'chevron-down'} size={13}/></span>
              <span className="tree-icon"><Icon name="folder" size={14}/></span>
              <span className="tree-label">{g.group}</span>
            </div>
            {expanded[g.group]!==false && g.items.map((it,i)=>(
              <React.Fragment key={g.group+i}>
                <div className={"tree-item"+(view===it.id?" active":"")} style={{paddingLeft:(10+it.depth*28)+'px'}} onClick={()=>setView(it.id)}>
                  <span className="tree-toggle">{it.children?<Icon name="chevron-down" size={12}/>:null}</span>
                  <span className="tree-icon"><Icon name={it.icon} size={14}/></span>
                  <span className="tree-label">{it.label}</span>
                </div>
                {it.children && it.children.map((c,j)=>(

function CountUpStat({label, target}){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let cur = 0;
    const step = Math.max(1, Math.ceil(target/20));
    const timer = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(timer); }
      setN(cur);
    }, 30);
    return ()=>clearInterval(timer);
  },[target]);
  return (
    <div style={{animation:'countUp .4s ease both'}}>
      <div style={{fontSize:22,fontWeight:700,color:'var(--n9)'}}>{n}건</div>
      <div style={{fontSize:11.5,color:'var(--n6)'}}>{label}</div>
    </div>
  );
}

function SeoAdminView({onToast}){
  const [modalOpen, setModalOpen] = useState(false);
  const [oldUrl, setOldUrl] = useState('');
  const [newUrl, setNewUrl] = useState('');
  const [error, setError] = useState('');
  const [rules, setRules] = useState(REDIRECTS);
  const [validating, setValidating] = useState(false);
  const [validationDone, setValidationDone] = useState(false);

  function submitRule(){
    if(!oldUrl || !newUrl){ setError('기존 URL과 신규 URL을 모두 입력해 주세요'); return; }
    if(rules.some(r=>r.next===oldUrl)){ setError('순환 참조가 감지되었습니다 — 이미 신규 URL로 등록된 경로입니다'); return; }
    setRules(rs=>[{old:oldUrl,next:newUrl,date:'2026-09-10',status:'정상'}, ...rs]);
    setModalOpen(false); setOldUrl(''); setNewUrl(''); setError('');
    onToast('리다이렉트 규칙이 등록되었습니다');
  }

  function runValidation(){
    setValidating(true); setValidationDone(false);
    setTimeout(()=>{ setValidating(false); setValidationDone(true); },1200);
  }

  return (
    <div className="page-body" style={{paddingTop:32}}>
      <h1 className="page-title" style={{fontSize:26,marginBottom:8}}>SEO 리다이렉트 & 구조화 데이터 관리</h1>

          {rules.map((r,i)=>(
            <tr key={i} onClick={()=>onToast(r.old+' 규칙 상세를 확인합니다')}>
              <td>{r.old}</td><td>{r.next}</td><td>{r.date}</td>
              <td><span className={"status-badge"+(r.status==='정상'?' done':'')}>{r.status==='정상'?<Icon name="check" size={11}/>:<Icon name="alert-triangle" size={11}/>}{r.status}</span></td>
            </tr>
          ))}
        </tbody>
      </table>

      <div className="section-title">SEO 메타 & OG 이미지</div>
      {SEO_PAGES.map((p,i)=>(
        <div key={i} className="block-banner-card" style={{marginBottom:10}} onClick={()=>onToast(p.title+' 메타 정보를 수정합니다')}>
          <div className="block-banner-fields" style={{gap:6}}>
            <div style={{fontWeight:700,fontSize:14}}>{p.title}</div>
            <div style={{fontSize:12.5,color:'var(--n6)'}}>{p.desc}</div>
          </div>
          <span className={"status-badge"+(p.og==='등록됨'?' done':'')}>{p.og}</span>
        </div>
      ))}

      <div className="section-title">구조화 데이터 미리보기 검증</div>
      <Ripple className="btn btn-outline" onClick={runValidation}>{validating?'검증 중...':'JSON-LD 유효성 검증 실행'}</Ripple>
      {validating && <div className="results-skeleton" style={{marginTop:14}}></div>}
      {validationDone && (
        <div style={{marginTop:14,border:'1px solid var(--n3)',padding:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:8,color:'var(--s1-text)'}}><Icon name="check-circle" size={15}/> Article 타입 필드 3개 — 유효</div>

        </div>

      {modalOpen && (
        <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>새 리다이렉트 규칙</h3>
            <div className="form-row"><label>기존 URL</label><input value={oldUrl} onChange={e=>setOldUrl(e.target.value)} placeholder="/post/1042" /></div>

  );
}

  const [author, setAuthor] = useState('전체');
  const filtered = author==='전체' ? AUDIT_LOG : AUDIT_LOG.filter(a=>a.who===author);

  return (

              <td>{s}</td>

                <td key={r}>
                  <button className={"perm-toggle"+(perms[r+'-'+s]?" on":"")} onClick={()=>{ setPerms(p=>({...p,[r+'-'+s]:!p[r+'-'+s]})); onToast(r+'의 '+s+' 권한이 변경되었습니다'); }}></button>

            </tr>
          ))}

      </table>

      <div className="section-title">변경 이력 감사로그</div>
      <div className="toolbar">
        <select className="search-field" style={{flex:'0 0 180px'}} value={author} onChange={e=>setAuthor(e.target.value)}>
          <option>전체</option>
          {[...new Set(AUDIT_LOG.map(a=>a.who))].map(w=><option key={w}>{w}</option>)}
        </select>
        <input className="search-field" type="date" defaultValue="2026-09-01" />
        <input className="search-field" type="date" defaultValue="2026-09-10" />
      </div>
      <table className="data-table">

        <tbody>
          {filtered.map((a,i)=>(

              <td>{a.when}</td>
              <td>{a.action}</td>
              <td><span className="diff-old">{a.before}</span> → <span className="diff-new">{a.after}</span></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
