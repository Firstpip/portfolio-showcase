<!DOCTYPE html>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 21°, light) ── */
:root{
  --m50:#fdf3ee; --m100:#fbe8de; --m200:#f7d1bd; --m300:#f2b594; --m400:#ed9567;
  --m500:#e8783d; --m600:#e35a12; --m700:#ba4a0f; --m800:#913a0c; --m900:#662808;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3736; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body,#root{width:100%; min-height:100%;}
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  background:var(--n0); color:var(--n10);
  font-size:14px; line-height:1.5; letter-spacing:0.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInRight{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(227,90,18,0.4);} 50%{box-shadow:0 0 0 6px rgba(227,90,18,0);}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}
@keyframes rippleFx{from{transform:scale(0); opacity:0.5;} to{transform:scale(3); opacity:0;}}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);}}

/* ── layout: linear-sidebar-cmdk ── */
.app{display:flex; width:100%; min-height:100vh;}
.sidebar{
  width:264px; min-width:264px; background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; padding:20px 0;
}
.sidebar-brand{
  display:flex; align-items:center; gap:10px; padding:0 20px 20px; height:44px;
  border-bottom:1px solid var(--n3); margin-bottom:16px;
}
.brand-mark{
  width:32px; height:32px; border-radius:9px; background:var(--m600);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0;
}
.brand-name{font-size:16px; font-weight:700; color:var(--n10); letter-spacing:-0.01em;}
.brand-sub{font-size:11px; color:var(--n7); font-weight:500;}
.sidebar-cmdk-hint{
  margin:0 20px 20px; padding:9px 12px; background:var(--n2); border:1px solid var(--n3);
  border-radius:10px; display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; color:var(--n7); cursor:pointer; transition:all .15s;
}
.sidebar-cmdk-hint:hover{background:var(--n3);}
.kbd{
  font-size:11px; padding:2px 6px; background:var(--n1); border:1px solid var(--n4);
  border-radius:5px; color:var(--n8); font-weight:600;
}
.sidebar-nav{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.sidebar-section-title{
  font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase;
  letter-spacing:0.06em; padding:16px 8px 6px;
}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px;
  font-size:13.5px; font-weight:500; color:var(--n8); text-align:left; width:100%;
  transition:all .12s;
}
.sidebar-link i{font-size:17px; color:var(--n6); width:18px; text-align:center;}
.sidebar-link:hover{background:var(--n2); color:var(--n10);}
.sidebar-link.active{background:var(--m50); color:var(--m700); font-weight:600; box-shadow:inset 3px 0 0 var(--m600);}
.sidebar-link.active i{color:var(--m600);}
.sidebar-user{
  margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--n3); display:flex;
  align-items:center; gap:10px;
}
.avatar-sm{
  width:30px; height:30px; border-radius:8px; background:var(--n2); color:var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.user-name{font-size:13px; font-weight:600; color:var(--n10);}
.user-role{font-size:11px; color:var(--n6);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:60px; min-height:60px; border-bottom:1px solid var(--n3); background:var(--n0);
  display:flex; align-items:center; justify-content:space-between; padding:0 28px;
}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n6);}
.breadcrumb .current{color:var(--n10); font-weight:600;}
.breadcrumb .divider{color:var(--n5);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.btn-cmdk{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px;
  background:var(--n1); border:1px solid var(--n3); font-size:12.5px; color:var(--n7); font-weight:600;
}
.btn-cmdk:hover{border-color:var(--n5);}
.btn-primary{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:7px;
  padding:9px 18px; border-radius:11px; background:var(--m600); color:#fff;
  font-size:13.5px; font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,0.2); transition:background .15s;
}
.btn-primary:hover{background:var(--m700);}
.btn-secondary{
  display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:11px;
  background:var(--n1); border:1px solid var(--n4); color:var(--n9); font-size:13.5px; font-weight:600;
}
.btn-secondary:hover{background:var(--n2);}
.btn-ghost{padding:7px 12px; border-radius:9px; color:var(--n7); font-size:13px; font-weight:500;}
.btn-ghost:hover{background:var(--n2); color:var(--n10);}
.btn-danger-ghost{padding:7px 12px; border-radius:9px; color:var(--s2); font-size:13px; font-weight:600;}
.btn-danger-ghost:hover{background:var(--s2-bg);}
.ripple-span{position:absolute; border-radius:50%; background:rgba(255,255,255,0.6); animation:rippleFx .5s ease-out; pointer-events:none;}

.content{flex:1; overflow-y:auto; padding:28px; animation:fadeInUp .35s ease-out;}
.page-head{margin-bottom:20px;}
.page-title{font-size:22px; font-weight:700; color:var(--n10); letter-spacing:-0.01em; margin-bottom:4px;}
.page-desc{font-size:13.5px; color:var(--n7);}

/* master-detail composition */
.master-detail{display:grid; grid-template-columns:380px 1fr; gap:20px; height:calc(100vh - 168px);}
.list-rail{
  background:var(--n1); border:1px solid var(--n3); border-radius:16px; display:flex;
  flex-direction:column; overflow:hidden;
}
.rail-search{padding:14px; border-bottom:1px solid var(--n3);}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--n2); border-radius:10px; padding:9px 12px;
}
.search-box input{flex:1; background:none; border:none; outline:none; font-size:13px; color:var(--n10);}
.search-box i{color:var(--n6); font-size:15px;}
.rail-tabs{display:flex; gap:4px; padding:10px 14px 0;}
.rail-tab{
  padding:7px 13px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--n7);
}
.rail-tab.active{background:var(--m50); color:var(--m700);}
.rail-list{flex:1; overflow-y:auto; padding:8px;}
.rail-item{
  padding:12px 12px; border-radius:12px; margin-bottom:4px; text-align:left; width:100%;
  border:1px solid transparent; animation:fadeInUp .3s ease-out both;
}
.rail-item:hover{background:var(--n2);}
.rail-item.selected{background:var(--m50); border-color:var(--m200);}
.rail-item-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
.rail-item-id{font-size:12px; color:var(--n6); font-weight:600;}
.rail-item-client{font-size:13.5px; font-weight:700; color:var(--n10); margin-bottom:3px;}
.rail-item-meta{font-size:12px; color:var(--n7); display:flex; gap:6px; align-items:center;}

.badge{
  display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:700;
}
.badge-new{background:var(--n2); color:var(--n8);}
.badge-new .dot{width:6px; height:6px; border-radius:50%; background:var(--m600); animation:pulseDot 1.6s infinite;}
.badge-progress{background:var(--n2); color:var(--n8);}
.badge-ready{background:var(--n2); color:var(--n8);}
.badge-done{background:var(--s1-bg); color:var(--s1-text);}
.badge-stop{background:var(--s2-bg); color:var(--s2-text);}
.badge-active{background:var(--s1-bg); color:var(--s1-text);}

.detail-panel{
  background:var(--n1); border:1px solid var(--n3); border-radius:16px; overflow-y:auto;
  padding:28px; animation:slideInRight .3s ease-out;
}
.detail-empty{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--n6); gap:10px;
}
.detail-empty i{font-size:40px; color:var(--n4);}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--n3);}
.detail-order-id{font-size:12px; color:var(--n6); font-weight:600; margin-bottom:4px;}
.detail-client{font-size:19px; font-weight:700; color:var(--n10);}
.stepper{display:flex; align-items:center; gap:0; margin:22px 0;}
.step{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
.step-dot{
  width:26px; height:26px; border-radius:50%; background:var(--n3); color:var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; z-index:1;
}
.step.active .step-dot{background:var(--m600); color:#fff;}
.step.done .step-dot{background:var(--m600); color:#fff;}
.step-label{font-size:11.5px; color:var(--n7); margin-top:6px; font-weight:600; text-align:center;}
.step.active .step-label, .step.done .step-label{color:var(--n10);}
.step-line{position:absolute; top:13px; left:50%; width:100%; height:2px; background:var(--n3); z-index:0;}
.step.done .step-line{background:var(--m600);}
.step:last-child .step-line{display:none;}

.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0;}
.spec-box{background:var(--n2); border-radius:12px; padding:14px;}
.spec-box-title{font-size:12px; font-weight:700; color:var(--n7); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.spec-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--n8);}
.spec-row b{color:var(--n10); font-weight:600;}

.info-list{display:flex; flex-direction:column; gap:0; margin:16px 0;}
.info-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.info-row .label{color:var(--n7);}

.card{background:var(--n1); border:1px solid var(--n3); border-radius:16px; padding:20px; transition:all .18s;}

.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
.stat-label{font-size:12px; color:var(--n7); font-weight:600; margin-bottom:8px;}

table{width:100%; border-collapse:collapse;}

.modal{

.toast-wrap{position:fixed; top:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{

.toast.err i{color:var(--s2);}

.cmdk-modal{width:100%; max-width:560px; background:var(--n1); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.25); overflow:hidden;}
.cmdk-input{width:100%; padding:16px 20px; border:none; outline:none; font-size:15px; border-bottom:1px solid var(--n3); color:var(--n10);}
.cmdk-results{max-height:340px; overflow-y:auto; padding:8px;}
.cmdk-group-title{font-size:11px; font-weight:700; color:var(--n6); padding:10px 12px 4px; text-transform:uppercase;}
.cmdk-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; width:100%;
  font-size:13.5px; color:var(--n9); text-align:left;
}
.cmdk-item:hover{background:var(--n2);}
.cmdk-item i{color:var(--n6); font-size:16px;}
.cmdk-item .kbd{margin-left:auto;}

.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--n6); gap:10px; text-align:center;}

.skeleton{background:linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size:400px 100%; animation:shimmer 1.4s infinite; border-radius:8px;}
</style>
</head>

function useToast(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, type="ok") => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };
  return {toasts, push};
}

function Ripple({onClick, children, className, disabled}){
  const ref = useRef(null);
  const handle = (e) => {
    if (disabled) return;
    const btn = ref.current;
    if (btn) {
      const rect = btn.getBoundingClientRect();
      const span = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      span.className = 'ripple-span';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size/2) + 'px';
      span.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(span);
      setTimeout(() => span.remove(), 500);
    }
    onClick && onClick(e);
  };
  return <button ref={ref} className={className} onClick={handle} disabled={disabled}>{children}</button>;
}

function Badge({status}){
  const map = {
    "접수": {cls:"badge-new", label:"접수", icon:true},
    "확인중": {cls:"badge-progress", label:"확인중"},
    "출고준비": {cls:"badge-ready", label:"출고준비"},
    "출고완료": {cls:"badge-done", label:"출고완료"},
    "정상": {cls:"badge-active", label:"정상"},
    "거래중지": {cls:"badge-stop", label:"거래중지"},
  };
  const m = map[status] || {cls:"badge-new", label:status};
  return <span className={"badge " + m.cls}>{m.icon && <span className="dot"></span>}{m.label}</span>;
}

const STEPS = ["접수","확인중","출고준비","출고완료"];
function Stepper({status}){
  const idx = STEPS.indexOf(status);
  return (
    <div className="stepper">
      {STEPS.map((s,i) => (
        <div key={s} className={"step " + (i < idx ? "done" : i === idx ? "active" : "")}>
          <div className="step-line"></div>
          <div className="step-dot">{i < idx ? <i className="ti ti-check"></i> : i+1}</div>
          <div className="step-label">{s}</div>
        </div>
      ))}
    </div>
  );
}

                    <div className="spec-row"><span>POWER</span><b>{selected.left.power}</b></div>
                    <div className="spec-row"><span>DIA</span><b>{selected.left.dia}</b></div>
                    <div className="spec-row"><span>COLOR</span><b>{selected.left.color}</b></div>
                    <div className="spec-row"><span>각인</span><b>{selected.left.engrave}</b></div>
                  </div>
                  <div className="spec-box">
                    <div className="spec-box-title"><i className="ti ti-circle-dot"></i> Right</div>
                    <div className="spec-row"><span>BC</span><b>{selected.right.bc}</b></div>
                    <div className="spec-row"><span>POWER</span><b>{selected.right.power}</b></div>
                    <div className="spec-row"><span>DIA</span><b>{selected.right.dia}</b></div>
                    <div className="spec-row"><span>COLOR</span><b>{selected.right.color}</b></div>
                    <div className="spec-row"><span>각인</span><b>{selected.right.engrave}</b></div>
                  </div>
                </div>
              )}

              {selected.recipient && (
                <div className="spec-box" style={{marginBottom:'16px'}}>
                  <div className="spec-box-title"><i className="ti ti-map-pin"></i> 직배송 정보</div>
                  <div className="spec-row"><span>수령인</span><b>{selected.recipient.name}</b></div>
                  <div className="spec-row"><span>연락처</span><b>{selected.recipient.phone}</b></div>
                  <div className="spec-row"><span>주소</span><b>{selected.recipient.addr}</b></div>
                </div>
              )}

              {selected.tracking && (
                <div className="spec-box" style={{marginBottom:'16px'}}>
                  <div className="spec-box-title"><i className="ti ti-truck-delivery"></i> 출고 정보</div>
                  <div className="spec-row"><span>택배사</span><b>{selected.tracking.company}</b></div>
                  <div className="spec-row"><span>송장번호</span><b>{selected.tracking.no}</b></div>
                </div>
              )}

              {selected.memo && (
                <div className="spec-box" style={{marginBottom:'16px'}}>
                  <div className="spec-box-title"><i className="ti ti-note"></i> 메모</div>
                  <div style={{fontSize:'13px', color:'var(--n8)'}}>{selected.memo}</div>
                </div>
              )}

              {selected.status !== '출고완료' && (
                <Ripple className="btn-primary" onClick={()=>advance(selected)}>
                  <i className="ti ti-arrow-right"></i> 다음 단계로 변경 ({STEPS[STEPS.indexOf(selected.status)+1]})
                </Ripple>
              )}
            </div>
          )}
        </div>
      </div>

      {excelOpen && (
        <div className="modal-backdrop" onClick={()=>!excelLoading && setExcelOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Excel 다운로드</div>
              <button className="modal-close" onClick={()=>setExcelOpen(false)}><i className="ti ti-x"></i></button>
            </div>
            <div className="field"><label>기간</label>
              <div style={{display:'flex', gap:'10px'}}>
                <input type="date" defaultValue="2026-09-01" />
                <input type="date" defaultValue="2026-09-10" />
              </div>
            </div>
            <div className="field"><label>주문 종류</label>
              <select><option>전체</option><option>렌즈</option><option>용액</option></select>
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setExcelOpen(false)}>취소</button>
              <Ripple className="btn-primary" onClick={runExcel} disabled={excelLoading}>
                {excelLoading ? <React.Fragment><i className="ti ti-loader-2" style={{animation:'spin 0.8s linear infinite'}}></i> 생성 중...</React.Fragment> : <React.Fragment><i className="ti ti-download"></i> 다운로드 생성</React.Fragment>}
              </Ripple>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ShippingScreen({orders, bulkShip, push}){
  const eligible = orders.filter(o => o.status === '출고준비');
  const [selected, setSelected] = useState([]);
  const [open, setOpen] = useState(false);
  const [company, setCompany] = useState("CJ대한통운");
  const [trackNo, setTrackNo] = useState("");
  const [err, setErr] = useState("");

  const usedTrackNos = orders.filter(o=>o.tracking).map(o=>o.tracking.no);

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const toggleAll = () => setSelected(s => s.length === eligible.length ? [] : eligible.map(o=>o.id));

  const submit = () => {
    if (!trackNo.trim()) { setErr("송장번호를 입력해주세요"); return; }
    if (usedTrackNos.includes(trackNo.trim())) { setErr("이미 등록된 송장번호입니다"); return; }
    bulkShip(selected, company, trackNo.trim());
    push(selected.length + "건의 주문이 '" + company + "' 송장번호로 출고 처리되었습니다");
    setSelected([]); setOpen(false); setTrackNo(""); setErr("");
  };

  return (
    <div>
      <div className="page-head" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
        <div>
          <div className="page-title">출고 처리·송장 등록</div>
          <div className="page-desc">출고준비 상태의 주문을 다중 선택해 택배사·송장번호를 일괄 등록합니다.</div>
        </div>
        <Ripple className="btn-primary" disabled={selected.length===0} onClick={()=>{setOpen(true); setErr("");}}>
          <i className="ti ti-truck-delivery"></i> 선택 {selected.length}건 송장 등록
        </Ripple>
      </div>

      <div className="card" style={{padding:0, overflow:'hidden'}}>
        <table>
          <thead>
            <tr>
              <th style={{width:'40px'}}><input className="checkbox" type="checkbox" checked={eligible.length>0 && selected.length===eligible.length} onChange={toggleAll} /></th>
              <th>주문번호</th><th>거래처</th><th>구분</th><th>제품</th><th>배송방식</th><th>상태</th>
            </tr>
          </thead>
          <tbody>
            {eligible.map(o => (
              <tr key={o.id}>
                <td><input className="checkbox" type="checkbox" checked={selected.includes(o.id)} onChange={()=>toggle(o.id)} /></td>
                <td style={{fontWeight:700}}>{o.id}</td>
                <td>{o.client}</td>
                <td>{o.type==='lens'?'렌즈':'용액'}</td>
                <td>{o.product}</td>
                <td>{o.ship}</td>
                <td><Badge status={o.status} /></td>
              </tr>
            ))}
          </tbody>
        </table>
        {eligible.length === 0 && <div className="empty-state"><i className="ti ti-truck-off"></i>출고 대기 중인 주문이 없습니다</div>}
      </div>

      <div className="page-head" style={{marginTop:'28px'}}>
        <div className="page-title" style={{fontSize:'16px'}}>최근 출고 완료</div>
      </div>
      <div className="card" style={{padding:0, overflow:'hidden'}}>
        <table>
          <thead><tr><th>주문번호</th><th>거래처</th><th>택배사</th><th>송장번호</th></tr></thead>
          <tbody>
            {orders.filter(o=>o.tracking).map(o => (
              <tr key={o.id}>
                <td style={{fontWeight:700}}>{o.id}</td><td>{o.client}</td><td>{o.tracking.company}</td><td>{o.tracking.no}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {open && (
        <div className="modal-backdrop" onClick={()=>setOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">송장 일괄 등록 ({selected.length}건)</div>
              <button className="modal-close" onClick={()=>setOpen(false)}><i className="ti ti-x"></i></button>
            </div>
            <div className="field">
              <label>택배사</label>
              <select value={company} onChange={e=>setCompany(e.target.value)}>
                <option>CJ대한통운</option><option>한진택배</option><option>롯데택배</option><option>우체국택배</option>
              </select>
            </div>
            <div className="field">
              <label>송장번호 <span className="req">*</span></label>
              <input className={err?"err":""} value={trackNo} onChange={e=>{setTrackNo(e.target.value); setErr("");}} placeholder="숫자 12자리" />
              {err && <div className="field-err">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setOpen(false)}>취소</button>
              <Ripple className="btn-primary" onClick={submit}><i className="ti ti-check"></i> 등록 완료</Ripple>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AccountsScreen({accounts, toggleStatus, addAccount, push}){
  const [confirmTarget, setConfirmTarget] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [form, setForm] = useState({name:"", manager:"", phone:""});
  const [err, setErr] = useState({});

  const doToggle = () => {
    toggleStatus(confirmTarget.id);
    push(confirmTarget.name + " 상태가 '" + (confirmTarget.status==='정상'?'거래중지':'정상') + "'로 변경되었습니다");
    setConfirmTarget(null);
  };

  const submitAdd = () => {
    const e = {};
    if (!form.name) e.name = true;
    if (!form.manager) e.manager = true;
    if (!form.phone) e.phone = true;
    setErr(e);
    if (Object.keys(e).length) return;
    addAccount(form);
    push(form.name + " 거래처가 등록되었습니다. 초기 비밀번호가 SMS로 발송됩니다");
    setForm({name:"", manager:"", phone:""});
    setAddOpen(false);
  };

  return (
    <div>
      <div className="page-head" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
        <div>
          <div className="page-title">거래처·권한 관리</div>
          <div className="page-desc">거래처 계정을 등록·발급하고 상태를 관리합니다. 삭제 대신 상태 변경으로 이력을 보존합니다.</div>
        </div>
        <Ripple className="btn-primary" onClick={()=>setAddOpen(true)}><i className="ti ti-plus"></i> 신규 거래처 등록</Ripple>
      </div>

      <div className="card" style={{padding:0, overflow:'hidden'}}>
        <table>
          <thead>
            <tr><th>거래처명</th><th>담당자</th><th>연락처</th><th>가입일</th><th>누적 주문</th><th>상태</th><th style={{width:'120px'}}></th></tr>
          </thead>
          <tbody>
            {accounts.map(a => (
              <tr key={a.id}>
                <td style={{fontWeight:700}}>{a.name}</td>
                <td>{a.manager}</td>
                <td>{a.phone}</td>
                <td>{a.joined}</td>
                <td>{a.orders}건</td>
                <td><Badge status={a.status} /></td>
                <td>
                  <button className={a.status==='정상' ? "btn-danger-ghost" : "btn-ghost"} onClick={()=>setConfirmTarget(a)}>
                    {a.status==='정상' ? '거래중지' : '정상화'}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {confirmTarget && (
        <div className="modal-backdrop" onClick={()=>setConfirmTarget(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:'420px'}}>
            <div className="modal-head">
              <div className="modal-title">상태 변경 확인</div>
              <button className="modal-close" onClick={()=>setConfirmTarget(null)}><i className="ti ti-x"></i></button>
            </div>
            <p style={{fontSize:'13.5px', color:'var(--n8)', lineHeight:1.6}}>
              <b style={{color:'var(--n10)'}}>{confirmTarget.name}</b>의 상태를
              {confirmTarget.status==='정상' ? ' "거래중지"로 변경하시겠습니까? 변경 시 해당 거래처는 로그인이 차단됩니다.' : ' "정상"으로 변경하시겠습니까?'}
            </p>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setConfirmTarget(null)}>취소</button>
              <Ripple className="btn-primary" onClick={doToggle}><i className="ti ti-check"></i> 변경 확정</Ripple>
            </div>
          </div>
        </div>
      )}

      {addOpen && (
        <div className="modal-backdrop" onClick={()=>setAddOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">신규 거래처 등록</div>
              <button className="modal-close" onClick={()=>setAddOpen(false)}><i className="ti ti-x"></i></button>
            </div>
            <div className="field">
              <label>거래처명 <span className="req">*</span></label>
              <input className={err.name?"err":""} value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="예: 서울아이케어안과" />
            </div>
            <div className="field">
              <label>담당자 <span className="req">*</span></label>
              <input className={err.manager?"err":""} value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))} placeholder="예: 김OO 실장" />
            </div>
            <div className="field">
              <label>연락처 <span className="req">*</span></label>
              <input className={err.phone?"err":""} value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="02-000-0000" />
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setAddOpen(false)}>취소</button>
              <Ripple className="btn-primary" onClick={submitAdd}><i className="ti ti-user-plus"></i> 등록 및 계정 발급</Ripple>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState("main");
  const [orders, setOrders] = useState(initialOrders);
  const [accounts, setAccounts] = useState(initialAccounts);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const {toasts, push} = useToast();

  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setCmdkOpen(o=>!o); }
      if (e.key === 'Escape') setCmdkOpen(false);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const addOrder = (o) => setOrders(list => [o, ...list]);
  const updateStatus = (id, status) => setOrders(list => list.map(o => o.id===id ? {...o, status} : o));
  const bulkShip = (ids, company, trackNo) => setOrders(list => list.map(o => ids.includes(o.id) ? {...o, status:'출고완료', tracking:{company, no:trackNo}} : o));
  const toggleStatus = (id) => setAccounts(list => list.map(a => a.id===id ? {...a, status: a.status==='정상'?'거래중지':'정상'} : a));
  const addAccount = (form) => setAccounts(list => [...list, {id: Date.now(), name:form.name, manager:form.manager, phone:form.phone, status:'정상', joined: new Date().toLocaleDateString('ko-KR').replace(/\. /g,'.').slice(0,-1), orders:0}]);

  const navItems = [
    {key:"main", icon:"ti-list-details", label:"관리자 주문 현황 관리"},
    {key:"order-form", icon:"ti-clipboard-plus", label:"렌즈·용액 주문 접수 폼"},
    {key:"shipping", icon:"ti-truck-delivery", label:"출고 처리·송장 등록"},
    {key:"accounts", icon:"ti-building-store", label:"거래처·권한 관리"},
  ];
  const crumbMap = {"main":"주문 현황", "order-form":"주문 접수", "shipping":"출고 관리", "accounts":"거래처 관리"};

  return (
    <div className="app" data-archetype="linear-sidebar-cmdk">
      <aside className="sidebar" data-sidebar style={{width:'264px'}}>
        <div className="sidebar-brand">
          <div className="brand-mark"><i className="ti ti-eyeglass"></i></div>
          <div>
            <div className="brand-name">렌즈메이트</div>
            <div className="brand-sub">거래처 주문관리 콘솔</div>
          </div>
        </div>
        <div className="sidebar-cmdk-hint" onClick={()=>setCmdkOpen(true)}>
          <span><i className="ti ti-search" style={{marginRight:'6px'}}></i>빠른 검색</span>
          <span className="kbd">⌘ K</span>
        </div>
        <nav className="sidebar-nav">
          <div className="sidebar-section-title">주문 관리</div>
          {navItems.map(it => (
            <button key={it.key} className={"sidebar-link " + (view===it.key?"active":"")} onClick={()=>setView(it.key)}>
              <i className={"ti " + it.icon}></i><span>{it.label}</span>
            </button>
          ))}
        </nav>
        <div className="sidebar-user">
          <div className="avatar-sm">관</div>
          <div>
            <div className="user-name">본사 관리자</div>
            <div className="user-role">Admin</div>
          </div>
        </div>
      </aside>

      <main className="main">
        <header className="topbar">
          <nav className="breadcrumb">
            <span>렌즈메이트</span><span className="divider">/</span><span className="current">{crumbMap[view]}</span>
          </nav>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdkOpen(true)}><i className="ti ti-command"></i> 명령 검색 <span className="kbd">⌘K</span></button>
          </div>
        </header>
        <div className="content" key={view}>
          {view === "order-form" && <OrderFormScreen onSubmit={addOrder} push={push} />}
          {view === "main" && <MainScreen orders={orders} updateStatus={updateStatus} push={push} />}
          {view === "shipping" && <ShippingScreen orders={orders} bulkShip={bulkShip} push={push} />}
          {view === "accounts" && <AccountsScreen accounts={accounts} toggleStatus={toggleStatus} addAccount={addAccount} push={push} />}
        </div>
      </main>

      <CmdK open={cmdkOpen} onClose={()=>setCmdkOpen(false)} navigate={setView} />

      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className={"toast " + (t.type==='err'?'err':'')}>
            <i className={"ti " + (t.type==='err'?'ti-alert-circle':'ti-circle-check')}></i>{t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
<style>
@keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
</style>
</body>
</html>
