function useToast(){
  const [toasts, setToasts] = useState([]);
  const push = (msg) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };
  return {toasts, push};
}

function Ripple({onClick, children, className, disabled}){
  const handle = (e) => {
    if (disabled) return;
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const span = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    span.className = 'ripple-span';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 400);
    onClick && onClick(e);
  };
  return <button className={className} onClick={handle} disabled={disabled}>{children}</button>;
}

function KanbanScreen({cards, moveCard, push}){

      moveCard(dragId, stage);
      push(dragId + " 주문이 '" + stage + "'(으)로 이동했습니다");
    }
    setDragId(null); setOverStage(null);
  };

  const nextStage = (card) => {
    const idx = STAGES.findIndex(s=>s.key===card.stage);
    if (idx < STAGES.length-1) { moveCard(card.id, STAGES[idx+1].key); push(card.id + " → '" + STAGES[idx+1].key + "' 단계로 이동했습니다"); }
  };

  return (
    <div>
      <div className="row-between">
        <div>
          <div className="page-title">주문 처리 흐름 칸반 보드</div>
          <div className="page-desc">접수부터 출고완료까지 렌즈·용액 주문을 드래그로 상태 전환합니다.</div>
        </div>
        <div className="board-filters">
          {["전체","렌즈","용액"].map(t => (
            <button key={t} className={"chip-filter " + (filter===t?"active":"")} onClick={()=>setFilter(t)}>{t}</button>
          ))}
        </div>
      </div>

      <div className="kanban-layout" data-archetype="kanban-board">
        <div>
          <main className="board" style={{display:'flex', gap:'16px', overflowX:'auto'}}>
            {STAGES.map(st => {
              const items = visible.filter(c=>c.stage===st.key);
              return (
                <section key={st.key} className={"column " + (overStage===st.key ? "drag-over":"")}
                  onDragOver={(e)=>{e.preventDefault(); setOverStage(st.key);}}
                  onDragLeave={()=>setOverStage(o=>o===st.key?null:o)}
                  onDrop={()=>onDrop(st.key)}>
                  <div className="col-header">
                    <div className="col-header-label"><span className="col-dot" style={{background:'var(--'+st.dot+')'}}></span>{st.key}</div>
                    <span className="count">{items.length}</span>
                  </div>
                  {items.map((c,i) => (
                    <div key={c.id} className={"card " + (dragId===c.id?"dragging":"")} draggable
                      style={{animationDelay:(i*0.04)+'s'}}
                      onDragStart={()=>setDragId(c.id)}
                      onDragEnd={()=>{setDragId(null); setOverStage(null);}}
                      onClick={()=>setDetail(c)}>
                      <div className="card-title">{c.id}</div>
                      <div className="card-sub">{c.client} · {c.product}</div>
                      <div className="card-meta">
                        <div className="card-meta-left">
                          <span className="tag">{c.type}</span>
                          <span className="avatar">{c.staff}</span>
                        </div>
                        <span className={"card-days " + (c.days>=3 && c.stage!=='출고완료' ? "risk":"")}>{c.days===0?'오늘':'D+'+c.days}</span>
                      </div>
                      {st.key !== "출고완료" && (
                        <button className="card-next" onClick={(e)=>{e.stopPropagation(); nextStage(c);}}>
                          <i className="ph ph-arrow-right"></i> 다음 단계
                        </button>
                      )}
                    </div>
                  ))}
                  {items.length===0 && <div style={{fontSize:'11.5px', color:'var(--n6)', textAlign:'center', padding:'16px 0'}}>카드 없음</div>}
                </section>
              );
            })}
          </main>
        </div>

        <aside className="matrix-side">
          <div className="matrix-title"><i className="ph ph-warning-diamond"></i> 지연 위험 매트릭스</div>
          <div className="matrix-desc">경과일 3일 이상이면서 미출고인 주문을 우선순위로 표시합니다.</div>
          {risky.length===0 && <div style={{fontSize:'12px', color:'var(--n6)'}}>지연 위험 주문이 없습니다</div>}
          {risky.map(c => (
            <div key={c.id} className="risk-item">
              <div>
                <div className="name">{c.id}</div>
                <div className="sub">{c.client}</div>
              </div>
              <span className={"risk-badge " + (c.days>=5?"high":"mid")}>{c.days>=5?'긴급':'주의'} D+{c.days}</span>
            </div>
          ))}
          <div className="heat-grid">
            {Array.from({length:16}).map((_,i) => {
              const cls = i===2 ? "crit" : (i===6 || i===9) ? "warn" : "";
              return <div key={i} className={"heat-cell " + cls}></div>;
            })}
          </div>
        </aside>
      </div>

      {detail && (
        <div className="modal-backdrop" onClick={()=>setDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{detail.id}</div>
              <button className="modal-close" onClick={()=>setDetail(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="detail-row"><span className="label">거래처</span><span className="value">{detail.client}</span></div>
            <div className="detail-row"><span className="label">제품</span><span className="value">{detail.product}</span></div>
            <div className="detail-row"><span className="label">구분</span><span className="value">{detail.type}</span></div>
            <div className="detail-row"><span className="label">현재 단계</span><span className="value">{detail.stage}</span></div>
            <div className="detail-row"><span className="label">경과일</span><span className="value">{detail.days===0?'오늘 접수':'D+'+detail.days}</span></div>
            <div className="modal-actions">
              <button className="pill-btn ghost" onClick={()=>setDetail(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function InventoryScreen({push}){
  const [filter, setFilter] = useState("전체");
  const [items, setItems] = useState(inventoryData);
  const [editing, setEditing] = useState(null);
  const [thVal, setThVal] = useState("");

  const visible = items.filter(i => filter==="전체" || i.type===filter).sort((a,b) => (a.stock-a.threshold) - (b.stock-b.threshold));

  const save = () => {
    setItems(list => list.map(i => i.sku===editing.sku ? {...i, threshold:Number(thVal)||i.threshold} : i));
    push(editing.sku + " 임계치가 " + thVal + "개로 변경되었습니다");
    setEditing(null);
  };

  return (
    <div>
      <div className="row-between">
        <div>
          <div className="page-title">제품·재고 연동 구조</div>
          <div className="page-desc">SKU별 재고 수량과 임계치를 관리하고, 임계치 이하 품목은 상단에 강조 표시합니다.</div>
        </div>
      </div>
      <div className="tab-switch">
        {["전체","렌즈","용액"].map(t => <button key={t} className={filter===t?"active":""} onClick={()=>setFilter(t)}>{t}</button>)}
      </div>
      <div className="grid-3">
        <div className="card-box" style={{borderRadius:'20px', boxShadow:'0 16px 40px rgba(30,30,32,0.14)'}}>
          <div className="stat-icon"><i className="ph ph-cube"></i></div>
          <div className="stat-label">전체 SKU</div>
          <div className="stat-value">{items.length}종</div>
        </div>
        <div className="card-box">
          <div className="stat-icon"><i className="ph ph-warning"></i></div>
          <div className="stat-label">임계치 이하</div>
          <div className="stat-value warn">{items.filter(i=>i.stock<=i.threshold).length}종</div>
        </div>
        <div className="card-box">
          <div className="stat-icon"><i className="ph ph-archive"></i></div>
          <div className="stat-label">총 재고 수량</div>
          <div className="stat-value">{items.reduce((s,i)=>s+i.stock,0).toLocaleString()}개</div>
        </div>
      </div>
      <div className="card-box" style={{padding:0, overflow:'hidden'}}>
        <table>
          <thead><tr><th>제품(SKU)</th><th>구분</th><th>현재 재고</th><th>임계치</th><th>상태</th><th style={{width:'100px'}}></th></tr></thead>
          <tbody>
            {visible.map(i => {
              const low = i.stock <= i.threshold;
              return (
                <tr key={i.sku}>
                  <td style={{fontWeight:700}}>{i.sku}</td>
                  <td>{i.type}</td>
                  <td style={low ? {color:'var(--s3-text)', fontWeight:700} : {}}>{i.stock.toLocaleString()}개</td>
                  <td>{i.threshold.toLocaleString()}개</td>
                  <td>{low ? <span className="badge-status failed" style={{background:'var(--s3-bg)', color:'var(--s3-text)'}}>임계치 이하</span> : <span className="badge-status sent">정상</span>}</td>
                  <td><button className="pill-btn ghost sm" onClick={()=>{setEditing(i); setThVal(String(i.threshold));}}>임계치 수정</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {editing && (
        <div className="modal-backdrop" onClick={()=>setEditing(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:'380px'}}>
            <div className="modal-head">
              <div className="modal-title">임계치 수정</div>
              <button className="modal-close" onClick={()=>setEditing(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="field"><label>{editing.sku}</label>
              <input type="number" value={thVal} onChange={e=>setThVal(e.target.value)} />
            </div>
            <div className="modal-actions">
              <button className="pill-btn ghost" onClick={()=>setEditing(null)}>취소</button>
              <Ripple className="pill-btn" onClick={save}><i className="ph ph-check"></i> 저장</Ripple>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SettlementScreen(){
  const [client, setClient] = useState("전체");
  const total = settlementData.reduce((s,d)=>s+d.amount,0);
  const filtered = client==="전체" ? settlementData : settlementData.filter(d=>d.client===client);
  const mono = ["m700","m600","m500","m400","m300"];

  return (
    <div>
      <div className="row-between">
        <div>
          <div className="page-title">정산 집계 구조</div>
          <div className="page-desc">출고완료 건 기준으로 거래처별 공급단가를 집계해 정산 내역을 미리 확인합니다.</div>
        </div>
        <div style={{display:'flex', gap:'10px'}}>
          <input type="date" defaultValue="2026-09-01" />
          <input type="date" defaultValue="2026-09-10" />
        </div>
      </div>
      <div className="tab-switch">
        {["전체", ...settlementData.map(d=>d.client)].map(c => <button key={c} className={client===c?"active":""} onClick={()=>setClient(c)}>{c}</button>)}
      </div>
      <div className="grid-3">
        <div className="card-box">
          <div className="stat-icon"><i className="ph ph-coins"></i></div>
          <div className="stat-label">집계 대상 거래처</div>
          <div className="stat-value">{filtered.length}곳</div>
        </div>
        <div className="card-box">
          <div className="stat-icon"><i className="ph ph-calculator"></i></div>
          <div className="stat-label">기간 정산 합계</div>
          <div className="stat-value">{(client==="전체"?total:filtered[0].amount).toLocaleString()}원</div>
        </div>
        <div className="card-box">
          <div className="stat-icon"><i className="ph ph-chart-line-up"></i></div>
          <div className="stat-label">거래처 평균</div>
          <div className="stat-value">{Math.round(total/settlementData.length).toLocaleString()}원</div>
        </div>
      </div>
      <div className="card-box">
        <div style={{fontSize:'13px', fontWeight:700, marginBottom:'14px'}}>거래처별 정산 금액 비교</div>
        <div className="chart-wrap">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={settlementData} margin={{top:10,right:10,left:0,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C('n3')} vertical={false} />
              <XAxis dataKey="client" tick={{fontSize:11, fill:C('n7')}} axisLine={{stroke:C('n3')}} tickLine={false} />
              <YAxis tick={{fontSize:11, fill:C('n7')}} axisLine={false} tickLine={false} tickFormatter={v=>(v/10000)+'만'} />
              <Tooltip formatter={v=>v.toLocaleString()+'원'} contentStyle={{borderRadius:'12px', border:'1px solid '+C('n3'), fontSize:'12px'}} />
              <Bar dataKey="amount" radius={[8,8,0,0]} fill={C('m600')}>
                {settlementData.map((d,i) => <Cell key={d.client} fill={C(mono[i % mono.length])} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="card-box" style={{padding:0, overflow:'hidden', marginTop:'16px'}}>
        <table>
          <thead><tr><th>거래처</th><th>출고완료 건 기준 정산 금액</th></tr></thead>
          <tbody>
            {filtered.map(d => <tr key={d.client}><td style={{fontWeight:700}}>{d.client}</td><td>{d.amount.toLocaleString()}원</td></tr>)}
            <tr><td style={{fontWeight:800}}>합계</td><td style={{fontWeight:800}}>{filtered.reduce((s,d)=>s+d.amount,0).toLocaleString()}원</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function NotificationsScreen({push}){
  const [queue, setQueue] = useState(notificationSeed);
  const [filter, setFilter] = useState("전체");

  const retry = (id) => {
    setQueue(q => q.map(n => n.id===id ? {...n, status:"발송완료"} : n));
    push("알림이 재전송되어 발송완료로 처리되었습니다");
  };

  const visible = queue.filter(n => filter==="전체" || n.status===filter);
  const ratioData = [{name:"렌즈", value:62},{name:"용액", value:38}];
  const statusData = [
    {name:"대기", value:queue.filter(n=>n.status==='대기').length},
    {name:"발송완료", value:queue.filter(n=>n.status==='발송완료').length},
    {name:"실패", value:queue.filter(n=>n.status==='실패').length},
  ];
  const pieColors = [C('m700'), C('m400')];

  return (
    <div>
      <div className="row-between">
        <div>
          <div className="page-title">알림 큐·처리 현황 분석</div>
          <div className="page-desc">주요 이벤트를 알림 큐로 관리하고 처리 현황을 기간별로 분석합니다.</div>
        </div>
      </div>
      <div className="grid-3">
        <div className="card-box">
          <div style={{fontSize:'13px', fontWeight:700, marginBottom:'10px'}}>렌즈/용액 주문 비율</div>
          <div className="chart-wrap" style={{height:'180px'}}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={ratioData} dataKey="value" nameKey="name" innerRadius={40} outerRadius={62} paddingAngle={3}>
                  {ratioData.map((d,i) => <Cell key={d.name} fill={pieColors[i]} />)}
                </Pie>
                <Tooltip formatter={v=>v+'%'} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="card-box" style={{gridColumn:'span 2'}}>
          <div style={{fontSize:'13px', fontWeight:700, marginBottom:'10px'}}>상태별 처리 건수</div>
          <div className="chart-wrap" style={{height:'180px'}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={statusData} layout="vertical" margin={{top:0,right:20,left:10,bottom:0}}>
                <XAxis type="number" tick={{fontSize:11, fill:C('n7')}} axisLine={false} tickLine={false} />
                <YAxis type="category" dataKey="name" tick={{fontSize:12, fill:C('n8')}} axisLine={false} tickLine={false} width={70} />
                <Tooltip />
                <Bar dataKey="value" radius={[0,8,8,0]} fill={C('m600')} barSize={22} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      <div className="tab-switch">
        {["전체","대기","발송완료","실패"].map(t => <button key={t} className={filter===t?"active":""} onClick={()=>setFilter(t)}>{t}</button>)}
      </div>
      <div>
        {visible.map(n => (
          <div key={n.id} className="queue-item">
            <div className="queue-icon"><i className={"ph " + n.icon}></i></div>
            <div className="queue-body">
              <div className="queue-title">{n.title}</div>
              <div className="queue-sub">{n.sub}</div>
            </div>
            <span className={"badge-status " + (n.status==='대기'?'wait':n.status==='발송완료'?'sent':'failed')}>{n.status}</span>
            {n.status==='실패' && <button className="pill-btn ghost sm" onClick={()=>retry(n.id)}><i className="ph ph-arrow-clockwise"></i> 재전송</button>}
          </div>
        ))}
        {visible.length===0 && <div className="empty-state"><i className="ph ph-bell-slash"></i>해당 상태의 알림이 없습니다</div>}
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState("main");
  const [cards, setCards] = useState(initialCards);
  const {toasts, push} = useToast();

  const moveCard = (id, stage) => setCards(list => list.map(c => c.id===id ? {...c, stage, days: stage==='출고완료' ? c.days : c.days} : c));

  const navItems = [
    {key:"main", icon:"ph-kanban", label:"주문 처리 흐름 칸반 보드"},
    {key:"inventory", icon:"ph-cube", label:"제품·재고 연동 구조"},
    {key:"settlement", icon:"ph-coins", label:"정산 집계 구조"},
    {key:"notifications", icon:"ph-bell", label:"알림 큐·처리 현황 분석"},
  ];

  const heroCopy = {
    main:{eyebrow:"Order Operations", title:"주문 처리 흐름 칸반 보드", desc:"접수→확인→출고준비→출고완료 단계를 카드로 시각화하고, 정체된 주문을 빠르게 식별합니다."},
    inventory:{eyebrow:"Inventory Sync", title:"제품·재고 연동 구조", desc:"제품 마스터에 재고 필드를 확장 연동해 임계치 이하 품목을 자동으로 강조합니다."},
    settlement:{eyebrow:"Settlement", title:"정산 집계 구조", desc:"출고완료 건을 기준으로 거래처별·기간별 정산 금액을 자동 집계합니다."},
    notifications:{eyebrow:"Notify & Analyze", title:"알림 큐·처리 현황 분석", desc:"주요 이벤트를 큐로 관리하고 처리 현황을 차트로 분석합니다."},
  };
  const h = heroCopy[view];

  return (
    <div className="app">
      <nav className="topnav">
        <div className="topnav-brand">
          <div className="brand-mark"><i className="ph ph-lightning"></i></div>
          <div className="brand-text">렌즈메이트 <span>오퍼레이션 허브</span></div>
        </div>
        <div className="topnav-tabs">
          {navItems.map(it => (
            <button key={it.key} className={"topnav-tab " + (view===it.key?"active":"")} onClick={()=>setView(it.key)}>
              <i className={"ph " + it.icon}></i>{it.label}
            </button>
          ))}
        </div>
        <div className="topnav-actions">
          <button className="pill-btn ghost" onClick={()=>push("새로고침되었습니다")}><i className="ph ph-arrow-clockwise"></i></button>
          <Ripple className="pill-btn" onClick={()=>push("주문 등록 화면으로 이동합니다")}><i className="ph ph-plus"></i> 새 주문 등록</Ripple>
        </div>
      </nav>

      <div className="hero">
        <div className="hero-glow"></div>
        <div className="hero-eyebrow">{h.eyebrow}</div>
        <div className="hero-title">{h.title}</div>
        <div className="hero-desc">{h.desc}</div>
        <div className="hero-stats">
          <div className="hero-stat"><span className="hero-stat-value">{cards.length}</span><span className="hero-stat-label">진행 중 주문</span></div>
          <div className="hero-stat"><span className="hero-stat-value">{cards.filter(c=>c.stage!=='출고완료').length}</span><span className="hero-stat-label">처리 대기</span></div>
          <div className="hero-stat"><span className="hero-stat-value">{cards.filter(c=>c.days>=3 && c.stage!=='출고완료').length}</span><span className="hero-stat-label">지연 위험</span></div>
        </div>
      </div>

      <div className="content" key={view}>
        {view === "main" && <KanbanScreen cards={cards} moveCard={moveCard} push={push} />}
        {view === "inventory" && <InventoryScreen push={push} />}
        {view === "settlement" && <SettlementScreen />}
        {view === "notifications" && <NotificationsScreen push={push} />}
      </div>

      <div className="toast-wrap">
        {toasts.map(t => <div key={t.id} className="toast"><i className="ph ph-check-circle"></i>{t.msg}</div>)}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
