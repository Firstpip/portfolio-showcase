<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>힐링스팟 — 우리 동네 마사지샵 지도 검색</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7; --n5:#b5b7ba;
  --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --shadow-card: rgba(71,103,136,.04) 0px 4px 5px 0px, rgba(71,103,136,.03) 0px 8px 15px 0px, rgba(71,103,136,.08) 0px 20px 40px 0px;
  --shadow-float: rgba(71,103,136,.06) 0px 10px 20px 0px, rgba(71,103,136,.10) 0px 24px 48px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0);
  color:var(--n9);
  overflow:hidden;
  height:100vh;
}
#app-root{width:100%;height:100vh;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes markerPulse{0%{box-shadow:0 0 0 0 rgba(0,107,255,.45);}70%{box-shadow:0 0 0 14px rgba(0,107,255,0);}100%{box-shadow:0 0 0 0 rgba(0,107,255,0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,12px);}12%{opacity:1;transform:translate(-50%,0);}88%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,12px);}}
@keyframes ringExpand{0%{transform:scale(.6);opacity:.8;}100%{transform:scale(2.2);opacity:0;}}

/* ── 상단 바 ── */
.topbar{
  position:relative;z-index:30;height:60px;width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--n1);border-bottom:1px solid var(--n3);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--n9);}
.brand-badge{width:32px;height:32px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.btn-ghost{
  display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--n3);
  color:var(--n8);font-size:13px;font-weight:600;padding:8px 14px;border-radius:9999px;
  transition:all .15s ease;
}
.btn-ghost:hover{border-color:var(--n5);background:var(--n2);}
.btn-primary{
  display:flex;align-items:center;gap:6px;background:var(--m600);border:none;color:#fff;
  font-size:13px;font-weight:700;padding:9px 16px;border-radius:9999px;
  box-shadow:0 6px 16px rgba(0,107,255,.28);transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,107,255,.36);}
.btn-primary:active{transform:translateY(0);}

/* ── 맵 캔버스 ── */
.map-stage{position:relative;width:100%;height:calc(100vh - 60px);overflow:hidden;background:
  linear-gradient(180deg,#eaf1fb 0%,#f4f7fb 40%,#eef2f6 100%);}
.map-roads{position:absolute;inset:0;opacity:.9;}
.map-blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;}

.marker{
  position:absolute;width:14px;height:14px;border-radius:50%;
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);
  transform:translate(-50%,-50%);cursor:pointer;transition:transform .18s ease;
  z-index:5;
}
.marker:hover{transform:translate(-50%,-50%) scale(1.25);}
.marker.open{background:var(--s1);}
.marker.closed{background:var(--n5);}
.marker.selected{background:var(--m600);animation:markerPulse 1.8s ease-out infinite;z-index:8;}
.marker-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--m400);animation:ringExpand 1.8s ease-out infinite;pointer-events:none;}

.dong-label{
  position:absolute;font-size:11px;font-weight:600;color:var(--n7);
  background:rgba(255,255,255,.72);padding:2px 8px;border-radius:9999px;
  transform:translate(-50%,-50%);pointer-events:none;letter-spacing:.2px;
}

/* ── 좌측 플로팅 드로어(검색+리스트) ── */
.drawer{
  position:absolute;left:16px;top:16px;bottom:16px;width:340px;
  background:var(--n1);border-radius:24px;box-shadow:var(--shadow-float);
  display:flex;flex-direction:column;overflow:hidden;z-index:20;
  animation:fadeInUp .5s ease both;
}
.drawer-header{padding:18px 18px 12px;border-bottom:1px solid var(--n3);}
.drawer-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.drawer-title{font-size:16px;font-weight:800;color:var(--n9);}
.drawer-count{font-size:12px;color:var(--n7);font-weight:600;}
.drawer-hero-num{font-size:42px;font-weight:800;color:var(--n9);line-height:1;letter-spacing:-.02em;}
.drawer-hero-num span{font-size:15px;font-weight:600;color:var(--n7);margin-left:5px;}
.drawer-hero-label{font-size:11.5px;color:var(--n6);margin-top:4px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--n2);border-radius:12px;
  padding:10px 12px;border:1px solid transparent;transition:border-color .15s ease;
}
.search-box:focus-within{border-color:var(--m300);background:var(--n1);}
.search-box input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--n9);}
.filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.chip{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--n8);
  background:var(--n2);border:1px solid var(--n3);border-radius:9999px;padding:7px 12px;
  transition:all .15s ease;
}
.chip:hover{border-color:var(--n5);}
.chip.active{background:var(--m50);color:var(--m700);border-color:var(--m300);}

.shop-list{flex:1;overflow-y:auto;padding:8px 12px 16px;}
.shop-card{
  display:flex;gap:12px;padding:12px;border-radius:16px;cursor:pointer;
  border:1px solid transparent;transition:all .15s ease;margin-bottom:6px;
}
.shop-card:hover{background:var(--n2);}
.shop-card.selected{background:var(--m50);border-color:var(--m200);}
.shop-thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--n3);}
.shop-info{flex:1;min-width:0;}
.shop-name{font-size:13.5px;font-weight:700;color:var(--n9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shop-meta{font-size:11.5px;color:var(--n7);margin-top:2px;}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
.status-dot.open{background:var(--s1);}
.status-dot.closed{background:var(--n5);}

/* ── 우측 하단 상세 카드 ── */
.detail-card{
  position:absolute;right:16px;bottom:16px;width:320px;
  background:var(--n1);border-radius:24px;box-shadow:var(--shadow-float);
  padding:18px;z-index:20;animation:slideInRight .35s ease both;
}
.detail-empty{
  position:absolute;right:16px;bottom:16px;width:280px;background:var(--n1);
  border-radius:20px;box-shadow:var(--shadow-card);padding:20px;z-index:15;text-align:center;color:var(--n7);font-size:13px;
}
.detail-photo{width:100%;height:120px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:var(--n3);}
.detail-name{font-size:16px;font-weight:800;color:var(--n9);margin-bottom:4px;}
.detail-status{font-size:12px;font-weight:700;display:flex;align-items:center;margin-bottom:10px;}
.detail-status.open{color:var(--s1-text);}
.detail-status.closed{color:var(--n7);}
.detail-row{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--n8);margin-bottom:7px;line-height:1.5;}
.detail-row i{width:15px;height:15px;flex-shrink:0;margin-top:1px;color:var(--n6);}
.detail-actions{display:flex;gap:8px;margin-top:14px;}
.btn-call{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--m600);
  color:#fff;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;
  box-shadow:0 6px 14px rgba(0,107,255,.28);
}
.btn-detail{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--n1);
  color:var(--n8);border:1px solid var(--n3);border-radius:12px;padding:11px;font-size:13px;font-weight:700;
}
.btn-detail:hover{background:var(--n2);}

/* ── 맵 컨트롤 / 범례 ── */
.map-control{
  position:absolute;right:16px;top:16px;background:var(--n1);border-radius:14px;box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.map-control button{width:40px;height:40px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--n8);}
.map-control button:hover{background:var(--n2);}
.map-control button:first-child{border-bottom:1px solid var(--n3);}
.legend{
  position:absolute;left:372px;bottom:16px;background:var(--n1);border-radius:14px;box-shadow:var(--shadow-card);
  padding:12px 14px;z-index:20;font-size:12px;color:var(--n8);display:flex;gap:14px;
}
.legend-item{display:flex;align-items:center;gap:6px;}

/* ── 필터 오버레이(동 단위 필터) ── */
.filter-overlay{position:fixed;inset:0;background:rgba(20,30,45,.32);z-index:40;display:flex;justify-content:flex-end;animation:fadeInUp .2s ease both;}
.filter-panel{
  width:380px;height:100%;background:var(--n1);box-shadow:-16px 0 40px rgba(0,0,0,.12);
  padding:24px;overflow-y:auto;animation:slideInRight .28s ease both;
}
.filter-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.filter-panel-title{font-size:18px;font-weight:800;color:var(--n9);}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n8);}
.icon-btn:hover{background:var(--n3);}
.city-group{margin-bottom:20px;}
.city-title{font-size:13px;font-weight:700;color:var(--n7);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.dong-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dong-check{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--n3);
  font-size:13px;color:var(--n8);font-weight:600;transition:all .15s ease;
}
.dong-check:hover{border-color:var(--n5);}
.dong-check.checked{background:var(--m50);border-color:var(--m300);color:var(--m700);}
.checkbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--n4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.dong-check.checked .checkbox{background:var(--m600);border-color:var(--m600);}
.filter-apply{
  width:100%;padding:14px;background:var(--m600);color:#fff;border:none;border-radius:14px;
  font-size:14px;font-weight:800;margin-top:6px;box-shadow:0 8px 18px rgba(0,107,255,.28);
}
.filter-reset{width:100%;padding:12px;background:transparent;border:none;color:var(--n7);font-size:13px;font-weight:600;margin-top:10px;text-align:center;}

/* ── 상세 모달(샵 상세보기) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,45,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeInUp .2s ease both;}
.modal-body{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--n1);border-radius:28px;box-shadow:var(--shadow-float);animation:fadeInUp .3s ease both;}
.modal-gallery{position:relative;height:220px;overflow:hidden;}
.modal-gallery img{width:100%;height:100%;object-fit:cover;}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;color:var(--n9);box-shadow:0 2px 8px rgba(0,0,0,.15);}
.modal-content{padding:24px;}
.modal-title{font-size:22px;font-weight:800;color:var(--n9);margin-bottom:6px;}
.modal-badges{display:flex;gap:6px;margin-bottom:16px;}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:9999px;background:var(--n2);color:var(--n7);}
.badge.open{background:var(--s1-bg);color:var(--s1-text);}
.badge.closed{background:var(--n2);color:var(--n7);}
.info-block{border-top:1px solid var(--n3);padding-top:16px;margin-top:16px;}
.info-line{display:flex;gap:10px;font-size:13.5px;color:var(--n8);margin-bottom:12px;line-height:1.6;}
.info-line i{width:17px;height:17px;color:var(--n6);flex-shrink:0;margin-top:2px;}
.hours-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
.hours-table td{padding:5px 0;color:var(--n8);}
.hours-table td:first-child{color:var(--n6);width:70px;}
.hours-table tr.today td{color:var(--m700);font-weight:700;}
.modal-desc{font-size:13.5px;color:var(--n8);line-height:1.7;margin-top:14px;}
.modal-cta{display:flex;gap:10px;margin-top:20px;}

/* ── PWA 설치 안내 모달 ── */
.pwa-modal{width:100%;max-width:400px;background:var(--n1);border-radius:28px;box-shadow:var(--shadow-float);padding:28px;text-align:center;animation:fadeInUp .3s ease both;}
.pwa-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,var(--m500),var(--m700));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(0,107,255,.32);}
.pwa-steps{text-align:left;margin-top:20px;}
.pwa-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--n3);}
.pwa-step:first-child{border-top:none;}
.pwa-step-num{width:24px;height:24px;border-radius:50%;background:var(--n2);color:var(--n8);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pwa-step-text{font-size:13px;color:var(--n8);line-height:1.6;}
.pwa-cta{width:100%;padding:14px;background:var(--m600);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:800;margin-top:20px;box-shadow:0 8px 18px rgba(0,107,255,.28);}

/* ── 토스트 ── */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--n10);color:#fff;
  padding:13px 22px;border-radius:9999px;font-size:13px;font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,.25);
  z-index:60;display:flex;align-items:center;gap:8px;animation:toastPop 2.4s ease forwards;white-space:nowrap;
}

@media (max-width:900px){
  .drawer{width:88%;}
  .legend{display:none;}
  .detail-card,.detail-empty{width:88%;right:6%;left:6%;}
}
</style>
</head>

<div id="app-root"></div>

  {id:5, name:"무브프리 스트레칭", dong:"탄현동", city:"고양시", addr:"경기 고양시 일산서구 탄현로 12", phone:"031-555-0912", hours:{mon:"09:00-21:00",tue:"09:00-21:00",wed:"09:00-21:00",thu:"09:00-21:00",fri:"09:00-21:00",sat:"휴무",sun:"휴무"}, desc:"1:1 스트레칭 전문 관리로 자세 교정과 유연성 개선을 돕습니다.", open:true, left:65, top:46, img:"260911massage-card-5"},
  {id:6, name:"손끝케어 지압원", dong:"장항동", city:"고양시", addr:"경기 고양시 일산동구 장항로 300", phone:"031-555-1028", hours:{mon:"10:00-22:00",tue:"10:00-22:00",wed:"휴무",thu:"10:00-22:00",fri:"10:00-22:00",sat:"10:00-22:00",sun:"10:00-20:00"}, desc:"전통 지압 기법과 발반사 관리를 함께 제공하는 지압 전문점입니다.", open:false, left:44, top:16, img:"260911massage-card-6"},
  {id:7, name:"웰니스라운지 운정점", dong:"운정동", city:"파주시", addr:"경기 파주시 운정로 77", phone:"031-555-1145", hours:{mon:"10:00-22:00",tue:"10:00-22:00",wed:"10:00-22:00",thu:"10:00-22:00",fri:"10:00-23:00",sat:"10:00-23:00",sun:"10:00-21:00"}, desc:"운정 신도시 내 접근성이 좋은 위치로, 넓은 개인 관리실을 갖췄습니다.", open:true, left:80, top:62, img:"260911massage-card-7"},
  {id:8, name:"스트레스오프 마사지", dong:"금촌동", city:"파주시", addr:"경기 파주시 금촌동 511", phone:"031-555-1367", hours:{mon:"10:00-21:00",tue:"10:00-21:00",wed:"10:00-21:00",thu:"10:00-21:00",fri:"10:00-21:00",sat:"10:00-21:00",sun:"휴무"}, desc:"직장인 밀집 지역 특성에 맞춰 저녁 예약 없이 방문 가능한 코스를 운영합니다.", open:true, left:88, top:40, img:"260911massage-card-8"}
];

const DAY_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
const DAY_LABEL = {mon:"월", tue:"화", wed:"수", thu:"목", fri:"금", sat:"토", sun:"일"};
const TODAY_KEY = DAY_KEYS[(new Date().getDay()+6)%7];

function Icon({name, ...rest}){
  return <i data-lucide={name} {...rest}></i>;
}

function Toast({text, onDone}){
  useEffect(()=>{
    const t = setTimeout(onDone, 2400);
    return ()=>clearTimeout(t);
  }, []);
  return <div className="toast"><Icon name="check-circle" style={{width:16,height:16}}/>{text}</div>;
}

function MapStage({shops, selected, onSelectShop, onOpenFilter}){
  return (
    <div className="map-stage">
      <svg className="map-roads" width="100%" height="100%" preserveAspectRatio="none">
        <line x1="0" y1="30%" x2="100%" y2="34%" stroke="#dbe4ee" strokeWidth="10"/>
        <line x1="0" y1="62%" x2="100%" y2="58%" stroke="#dbe4ee" strokeWidth="14"/>
        <line x1="20%" y1="0" x2="26%" y2="100%" stroke="#dbe4ee" strokeWidth="10"/>
        <line x1="62%" y1="0" x2="58%" y2="100%" stroke="#dbe4ee" strokeWidth="12"/>
        <line x1="82%" y1="0" x2="86%" y2="100%" stroke="#e4ebf3" strokeWidth="8"/>
      </svg>
      <div className="map-blob" style={{width:340,height:340,left:"4%",top:"8%",background:"radial-gradient(circle, rgba(0,107,255,.10), transparent 70%)"}}></div>
      <div className="map-blob" style={{width:280,height:280,right:"6%",bottom:"6%",background:"radial-gradient(circle, rgba(0,107,255,.08), transparent 70%)"}}></div>

      <div className="dong-label" style={{left:"30%",top:"20%"}}>일산동구</div>
      <div className="dong-label" style={{left:"20%",top:"66%"}}>덕양구</div>
      <div className="dong-label" style={{left:"82%",top:"52%"}}>파주시</div>

      {shops.map(s => {
        const isSel = selected && selected.id===s.id;
        const markerColor = isSel ? "var(--m600)" : (s.open ? "var(--s1)" : "var(--n5)");
        return (
        <div key={s.id} className="marker-wrap" style={{position:"absolute", left:s.left+"%", top:s.top+"%"}}>
          {isSel && <div className="marker-ring"></div>}
          <div
            className="marker"
            style={{background:markerColor, zIndex:isSel?8:5, animation:isSel?"markerPulse 1.8s ease-out infinite":"none"}}
            onClick={()=>onSelectShop(s)}
            title={s.name}
          ></div>
        </div>
        );
      })}

      <div className="map-control">
        <button onClick={()=>{}} title="확대"><Icon name="plus" style={{width:18,height:18}}/></button>
        <button onClick={()=>{}} title="축소"><Icon name="minus" style={{width:18,height:18}}/></button>
      </div>

      <div className="legend">
        <div className="legend-item"><span className="status-dot open"></span>영업중</div>
        <div className="legend-item"><span className="status-dot closed"></span>영업종료</div>
      </div>
    </div>
  );
}

function Drawer({shops, query, setQuery, activeDong, selected, onSelectShop, onOpenFilter}){
  return (
    <div className="drawer">
      <div className="drawer-header">
        <div className="drawer-title-row">
          <div className="drawer-title">우리 동네 마사지샵</div>
          <button className="btn-ghost" style={{padding:"6px 12px"}} onClick={onOpenFilter}>
            <Icon name="sliders-horizontal" style={{width:14,height:14}}/>동 단위 필터
          </button>
        </div>
        <div className="search-box">
          <Icon name="search" style={{width:16,height:16,color:"var(--n6)"}}/>
          <input placeholder="샵 이름으로 검색" value={query} onChange={e=>setQuery(e.target.value)}/>
        </div>
        {activeDong.length>0 &&
          <div className="filter-row">
            {activeDong.map(d => <span key={d} className="chip active">{d}</span>)}
          </div>
        }
        <div style={{marginTop:14}}>
          <div className="drawer-hero-num">{shops.length}<span>곳 검색됨</span></div>
          <div className="drawer-hero-label">지도를 움직이면 목록이 함께 갱신됩니다</div>
        </div>
      </div>
      <div className="shop-list">
        {shops.map(s => (
          <div key={s.id} className={"shop-card " + (selected && selected.id===s.id ? "selected" : "")} onClick={()=>onSelectShop(s)}>
            <img className="shop-thumb" src={"https://picsum.photos/seed/"+s.img+"/96/96"} alt={s.name}/>
            <div className="shop-info">
              <div className="shop-name">{s.name}</div>
              <div className="shop-meta"><span className={"status-dot "+(s.open?"open":"closed")}></span>{s.open?"영업중":"영업종료"} · {s.city} {s.dong}</div>
            </div>
          </div>
        ))}
        {shops.length===0 &&
          <div style={{padding:"40px 12px", textAlign:"center", color:"var(--n6)", fontSize:13}}>
            선택한 조건에 맞는 샵이 없습니다.
          </div>
        }
      </div>
    </div>
  );
}

function DetailCard({shop, onOpenDetail, onCall}){
  const dnaStyle = {borderRadius:'24px', boxShadow:'0 20px 40px rgba(0,107,255,0.12)', padding:'18px'};
  if(!shop){
    return (
      <div className="detail-empty" style={dnaStyle}>
        <Icon name="map-pin" style={{width:22,height:22,color:"var(--n5)",marginBottom:8}}/>
        <div>지도의 마커 또는 목록에서<br/>샵을 선택해 주세요</div>
      </div>
    );
  }
  return (
    <div className="detail-card" key={shop.id} style={dnaStyle}>
      <img className="detail-photo" src={"https://picsum.photos/seed/"+shop.img+"/560/320"} alt={shop.name}/>
      <div className="detail-name">{shop.name}</div>
      <div className={"detail-status "+(shop.open?"open":"closed")}>
        <span className={"status-dot "+(shop.open?"open":"closed")}></span>{shop.open?"영업중":"영업종료"} · 오늘 {shop.hours[TODAY_KEY]}
      </div>
      <div className="detail-row"><Icon name="map-pin"/>{shop.addr}</div>
      <div className="detail-row"><Icon name="phone"/>{shop.phone}</div>
      <div className="detail-actions">
        <button className="btn-call" onClick={()=>onCall(shop)}><Icon name="phone-call" style={{width:15,height:15}}/>전화하기</button>
        <button className="btn-detail" onClick={()=>onOpenDetail(shop)}>샵 상세보기</button>
      </div>
    </div>
  );
}

function FilterOverlay({activeDong, toggleDong, onClose, onApply, onReset}){
  return (
    <div className="filter-overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="filter-panel">
        <div className="filter-panel-header">
          <div className="filter-panel-title">동 단위 필터</div>
          <button className="icon-btn" onClick={onClose}><Icon name="x" style={{width:17,height:17}}/></button>
        </div>
        {Object.entries(DONGS).map(([city, dongs]) => (
          <div className="city-group" key={city}>
            <div className="city-title"><Icon name="map" style={{width:14,height:14}}/>{city}</div>
            <div className="dong-grid">
              {dongs.map(d => (
                <div key={d} className={"dong-check "+(activeDong.includes(d)?"checked":"")} onClick={()=>toggleDong(d)}>
                  <span className="checkbox">{activeDong.includes(d) && <Icon name="check" style={{width:11,height:11,color:"#fff"}}/>}</span>
                  {d}
                </div>
              ))}
            </div>
          </div>
        ))}
        <button className="filter-apply" onClick={onApply}>필터 적용하기</button>
        <button className="filter-reset" onClick={onReset}>전체 초기화</button>
      </div>
    </div>
  );
}

function DetailModal({shop, onClose, onCall}){
  if(!shop) return null;
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal-body">
        <div className="modal-gallery">
          <img src={"https://picsum.photos/seed/"+shop.img+"-wide/800/440"} alt={shop.name}/>
          <button className="modal-close" onClick={onClose}><Icon name="x" style={{width:16,height:16}}/></button>
        </div>
        <div className="modal-content">
          <div className="modal-title">{shop.name}</div>
          <div className="modal-badges">
            <span className={"badge "+(shop.open?"open":"closed")}>{shop.open?"영업중":"영업종료"}</span>
            <span className="badge">{shop.city} {shop.dong}</span>
          </div>
          <div className="modal-desc">{shop.desc}</div>
          <div className="info-block">
            <div className="info-line"><Icon name="map-pin"/>{shop.addr}</div>
            <div className="info-line"><Icon name="phone"/>{shop.phone}</div>
            <div className="info-line" style={{flexDirection:"column"}}>
              <div style={{display:"flex",gap:10,marginBottom:4}}><Icon name="clock"/>영업시간</div>
              <table className="hours-table">
                <tbody>
                  {DAY_KEYS.map(k => (
                    <tr key={k} className={k===TODAY_KEY?"today":""}>
                      <td>{DAY_LABEL[k]}요일</td>
                      <td>{shop.hours[k]}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div className="modal-cta">
            <button className="btn-call" onClick={()=>onCall(shop)}><Icon name="phone-call" style={{width:15,height:15}}/>전화하기</button>
            <button className="btn-detail" onClick={onClose}>목록으로</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PwaModal({onClose, onInstall}){
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="pwa-modal">
        <div className="pwa-icon"><Icon name="smartphone" style={{width:32,height:32,color:"#fff"}}/></div>
        <div style={{fontSize:18,fontWeight:800,color:"var(--n9)"}}>홈 화면에 추가</div>
        <div style={{fontSize:13,color:"var(--n7)",marginTop:6,lineHeight:1.6}}>앱스토어 설치 없이 홈 화면에 추가하면<br/>네이티브 앱처럼 바로 실행할 수 있습니다.</div>
        <div className="pwa-steps">
          <div className="pwa-step">
            <div className="pwa-step-num">1</div>
            <div className="pwa-step-text">브라우저 메뉴에서 <b>공유</b> 또는 <b>추가 메뉴</b>를 엽니다</div>
          </div>
          <div className="pwa-step">
            <div className="pwa-step-num">2</div>
            <div className="pwa-step-text"><b>홈 화면에 추가</b> 항목을 선택합니다</div>
          </div>
          <div className="pwa-step">
            <div className="pwa-step-num">3</div>
            <div className="pwa-step-text">홈 화면의 아이콘으로 바로 실행합니다</div>
          </div>
        </div>
        <button className="pwa-cta" onClick={onInstall}>지금 추가하기</button>
      </div>
    </div>
  );
}

function App(){
  const [query, setQuery] = useState("");
  const [activeDong, setActiveDong] = useState([]);
  const [selected, setSelected] = useState(SHOPS[0]);
  const [showFilter, setShowFilter] = useState(false);
  const [showDetail, setShowDetail] = useState(false);
  const [showPwa, setShowPwa] = useState(false);
  const [toast, setToast] = useState(null);
  const [pendingDong, setPendingDong] = useState([]);

  useEffect(()=>{ lucide.createIcons(); });

  const filtered = SHOPS.filter(s =>
    (query==="" || s.name.includes(query)) &&
    (activeDong.length===0 || activeDong.includes(s.dong))
  );

  function toggleDong(d){
    setPendingDong(prev => prev.includes(d) ? prev.filter(x=>x!==d) : [...prev, d]);
  }
  function openFilter(){ setPendingDong(activeDong); setShowDetail(false); setShowPwa(false); setShowFilter(true); }
  function applyFilter(){ setActiveDong(pendingDong); setShowFilter(false); }
  function resetFilter(){ setPendingDong([]); setActiveDong([]); setShowFilter(false); }

  function selectShop(s){ setSelected(s); }
  function openDetail(s){ setSelected(s); setShowFilter(false); setShowPwa(false); setShowDetail(true); }
  function callShop(s){ setToast(s.name+"로 전화를 연결합니다"); }

  return (
    <div data-archetype="map-canvas" style={{width:"100%",height:"100vh"}}>
      <header className="topbar">
        <div className="brand">
          <div className="brand-badge"><Icon name="map-pinned" style={{width:18,height:18}}/></div>
          힐링스팟
        </div>
        <div className="topbar-actions">
          <button className="btn-ghost" onClick={()=>setToast("회원가입 없이 누구나 바로 이용할 수 있습니다")}><Icon name="info" style={{width:14,height:14}}/>이용 안내</button>
          <button className="btn-primary" onClick={()=>{setShowFilter(false); setShowDetail(false); setShowPwa(true);}}><Icon name="download" style={{width:14,height:14}}/>홈 화면에 추가</button>
        </div>
      </header>

      <div style={{position:"relative"}}>
        <MapStage shops={filtered} selected={selected} onSelectShop={selectShop} onOpenFilter={openFilter}/>
        <Drawer shops={filtered} query={query} setQuery={setQuery} activeDong={activeDong} selected={selected} onSelectShop={selectShop} onOpenFilter={openFilter}/>
        <DetailCard shop={selected} onOpenDetail={openDetail} onCall={callShop}/>
      </div>

      {showFilter &&
        <FilterOverlay activeDong={pendingDong} toggleDong={toggleDong} onClose={()=>setShowFilter(false)} onApply={applyFilter} onReset={resetFilter}/>
      }
      {showDetail &&
        <DetailModal shop={selected} onClose={()=>setShowDetail(false)} onCall={callShop}/>
      }
      {showPwa &&
        <PwaModal onClose={()=>setShowPwa(false)} onInstall={()=>{setShowPwa(false); setToast("홈 화면에 추가되었습니다");}}/>
      }
      {toast && <Toast text={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
