<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>힐링스팟 파트너 콘솔 — 통합 관리 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* refero 시드 출처 기록(showcase 전용, 페이지 장식에는 미사용 — 컬러 역할 규칙 우선): Dub accent #2563eb */
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 ── */
:root{
  --m50:#fbf2ee; --m100:#f6e4dd; --m200:#eecabb; --m300:#e4aa92; --m400:#d88563;
  --m500:#cd6338; --m600:#c2410c; --m700:#9f350a; --m800:#7c2a08; --m900:#571d05;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5; --n5:#bab6b5;
  --n6:#989290; --n7:#7a7371; --n8:#525252; --n9:#3a3736; --n10:#171717;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n1);color:var(--n9);}
#app-root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes dashDraw{from{stroke-dashoffset:280;}to{stroke-dashoffset:var(--dash-final,0);}}
@keyframes slideInPanel{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,10px);}10%{opacity:1;transform:translate(-50%,0);}90%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,10px);}}
@keyframes countUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.shell{display:flex;width:100%;min-height:100vh;}

/* ── 사이드바 ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n0);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:10;}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:18px 20px;border-bottom:1px solid var(--n3);}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--n10);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.brand-text{font-size:14.5px;font-weight:800;color:var(--n10);}
.env-select{margin:12px 16px 4px;padding:8px 10px;border:1px solid var(--n3);border-radius:8px;font-size:11.5px;color:var(--n7);display:flex;align-items:center;justify-content:space-between;font-weight:600;}
.sidebar-section{padding:14px 12px 4px;}
.sidebar-section-title{font-size:10.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;padding:0 10px 8px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--n8);margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;}
.sidebar-link i{font-size:16px;color:var(--n6);}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50);color:var(--m700);}
.sidebar-link.active i{color:var(--m600);}
.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--n3);display:flex;align-items:center;gap:9px;}
.avatar-mono{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* ── 메인 ── */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);}
.page-header{padding:22px 28px 14px;border-bottom:1px solid var(--n3);background:var(--n0);}
.page-title-row{display:flex;align-items:center;justify-content:space-between;}
.page-title{font-size:20px;font-weight:800;color:var(--n9);}
.page-meta{font-size:11.5px;color:var(--n6);margin-top:4px;}
.page-actions{display:flex;gap:8px;}
.btn-secondary{display:flex;align-items:center;gap:6px;background:var(--n0);border:1px solid var(--n3);color:var(--n8);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:8px;}
.btn-secondary:hover{background:var(--n2);}
.btn-primary{display:flex;align-items:center;gap:6px;background:var(--m600);border:none;color:#fff;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:8px;}
.btn-primary:hover{background:var(--m700);}

.content{padding:22px 28px 40px;}

.goal-banner{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--m600),var(--m800));border-radius:12px;padding:26px 28px;margin-bottom:18px;color:#fff;display:flex;align-items:center;justify-content:space-between;animation:fadeInUp .4s ease both;}
.goal-banner-label{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;opacity:.82;}
.goal-banner-title{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.01em;}
.goal-banner-num{font-size:44px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1;}
.goal-banner-num span{font-size:14px;font-weight:600;opacity:.85;margin-left:6px;}
.goal-wave{position:absolute;inset:0;opacity:.5;pointer-events:none;}

/* KPI + hero */
.overview-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
.hero-viz{position:relative;overflow:hidden;background:var(--n0);border:1px solid var(--n3);border-radius:12px;padding:20px;animation:fadeInUp .4s ease both;}
.hero-net{position:absolute;right:-10px;top:-10px;opacity:.55;pointer-events:none;}
.hero-viz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hero-viz-title{font-size:13.5px;font-weight:700;color:var(--n9);}
.hero-viz-sub{font-size:11px;color:var(--n6);}
.donut-row{display:flex;align-items:center;gap:22px;}
.donut-legend{flex:1;}
.donut-legend-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--n2);font-size:12px;}
.donut-legend-row:last-child{border-bottom:none;}
.donut-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;}

.kpi-side{display:flex;flex-direction:column;gap:10px;}
.stat-card{background:var(--n0);border:1px solid var(--n3);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;animation:fadeInUp .4s ease both;transition:transform .15s ease;}
.stat-card:hover{transform:scale(1.02);}
.stat-label{font-size:11.5px;color:var(--n6);font-weight:600;margin-bottom:6px;}
.stat-value{font-size:32px;font-weight:800;color:var(--n9);line-height:1;animation:countUp .5s ease both;}
.stat-delta{font-size:11.5px;font-weight:700;margin-top:6px;}
.stat-delta.positive{color:var(--s1-text);}
.stat-delta.neutral{color:var(--n6);}
.stat-sparkline{flex-shrink:0;}

/* widget grid */
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.widget-card{background:var(--n0);border:1px solid var(--n3);border-radius:12px;padding:16px 18px;animation:fadeInUp .45s ease both;}
.widget-title{font-size:12.5px;font-weight:700;color:var(--n8);margin-bottom:12px;}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:70px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bar-fill{width:100%;border-radius:4px 4px 0 0;transform-origin:bottom;animation:barGrow .6s ease both;}
.bar-label{font-size:9.5px;color:var(--n6);}
.timeline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--n2);font-size:11.5px;}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:6px;height:6px;border-radius:50%;background:var(--n5);margin-top:5px;flex-shrink:0;}
.timeline-dot.hi{background:var(--m600);}

/* tab bar + table */
.data-section{background:var(--n0);border:1px solid var(--n3);border-radius:12px;overflow:hidden;}
.tab-bar{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--n3);}
.tab{background:none;border:none;padding:10px 4px 12px;font-size:12.5px;font-weight:700;color:var(--n6);position:relative;margin-right:18px;}
.tab.active{color:var(--n9);}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--m600);border-radius:2px;}
.data-toolbar{display:flex;align-items:center;gap:8px;padding:12px 18px;}
.search-box{display:flex;align-items:center;gap:7px;background:var(--n1);border:1px solid var(--n3);border-radius:8px;padding:7px 10px;flex:1;max-width:260px;}
.search-box input{border:none;background:transparent;outline:none;font-size:12.5px;flex:1;color:var(--n9);}
.filter-chip{display:flex;align-items:center;gap:5px;background:var(--n1);border:1px solid var(--n3);border-radius:8px;font-size:12px;font-weight:600;color:var(--n7);padding:7px 11px;}
.filter-chip.active{background:var(--m50);color:var(--m700);border-color:var(--m300);}
.export-btn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--n7);background:transparent;border:1px solid var(--n3);border-radius:8px;padding:7px 11px;}
.data-table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{text-align:left;padding:10px 18px;font-size:11px;color:var(--n6);font-weight:700;border-bottom:1px solid var(--n3);white-space:nowrap;}
.data-table tbody td{padding:12px 18px;border-bottom:1px solid var(--n2);color:var(--n8);white-space:nowrap;}
.data-table tbody tr{transition:background .12s ease;}
.data-table tbody tr:hover{background:var(--n1);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:9999px;}
.badge.success{background:var(--s1-bg);color:var(--s1-text);}
.badge.pending{background:var(--n2);color:var(--n7);}
.badge.rejected{background:var(--n9);color:#fff;}
.row-actions{display:flex;gap:6px;}
.row-actions button{border:1px solid var(--n3);background:var(--n0);border-radius:6px;font-size:11px;font-weight:700;padding:5px 9px;color:var(--n8);}
.row-actions button.approve{color:var(--s1-text);border-color:#bfe3cd;}
.row-actions button.reject{color:var(--n9);}
.row-actions button:hover{background:var(--n2);}

/* toggle */
.toggle{width:38px;height:22px;border-radius:9999px;background:var(--n3);position:relative;border:none;flex-shrink:0;transition:background .15s ease;}
.toggle.on{background:var(--m600);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s ease;}
.toggle.on .toggle-knob{transform:translateX(16px);}

/* master-detail: shop-manage */
.md-wrap{display:flex;gap:16px;height:calc(100vh - 190px);min-height:520px;}
.md-list{width:320px;flex-shrink:0;background:var(--n0);border:1px solid var(--n3);border-radius:12px;overflow-y:auto;}
.md-list-item{padding:13px 16px;border-bottom:1px solid var(--n2);cursor:pointer;}
.md-list-item:hover{background:var(--n1);}
.md-list-item.selected{background:var(--m50);border-left:3px solid var(--m600);padding-left:13px;}
.md-item-name{font-size:13px;font-weight:700;color:var(--n9);margin-bottom:3px;}
.md-item-meta{font-size:11px;color:var(--n6);display:flex;align-items:center;gap:6px;}
.md-detail{flex:1;background:var(--n0);border:1px solid var(--n3);border-radius:12px;padding:24px;overflow-y:auto;animation:slideInPanel .25s ease both;}
.field-row{margin-bottom:16px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--n7);margin-bottom:6px;display:block;}
.field-input{width:100%;border:1px solid var(--n3);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--n9);background:var(--n0);}
.field-input:focus{outline:none;border-color:var(--m400);}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.upload-zone{border:1.5px dashed var(--n4);border-radius:10px;padding:22px;text-align:center;color:var(--n6);font-size:12px;margin-top:6px;}
.photo-thumb-row{display:flex;gap:8px;margin-top:10px;}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--n3);}
.detail-footer{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--n3);}

/* region settings */
.region-city{margin-bottom:22px;}
.region-city-title{font-size:13px;font-weight:800;color:var(--n9);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.region-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--n3);border-radius:10px;margin-bottom:8px;background:var(--n0);}
.region-row-left{display:flex;align-items:center;gap:12px;}
.region-name{font-size:13px;font-weight:700;color:var(--n9);}
.region-count{font-size:11px;color:var(--n6);}
.history-link{font-size:11.5px;color:var(--n7);font-weight:600;background:none;border:none;display:flex;align-items:center;gap:4px;}
.history-link:hover{color:var(--n9);}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:#fff;padding:12px 20px;border-radius:9999px;font-size:12.5px;font-weight:600;box-shadow:0 12px 26px rgba(0,0,0,.25);z-index:60;animation:toastPop 2.2s ease forwards;white-space:nowrap;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,18,.36);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s ease both;}
.modal-box{width:100%;max-width:420px;background:var(--n0);border-radius:14px;padding:22px;animation:fadeInUp .25s ease both;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-title{font-size:15px;font-weight:800;color:var(--n9);}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--n1);display:flex;align-items:center;justify-content:center;color:var(--n7);}
.icon-btn:hover{background:var(--n2);}

@media (max-width:900px){
  .overview-grid{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
  .md-wrap{flex-direction:column;height:auto;}
  .md-list{width:100%;max-height:260px;}
  .data-table-wrap{width:100%;}
  .field-grid{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .sidebar{width:64px;}
  .sidebar-brand .brand-text, .sidebar-link .link-label, .sidebar-section-title, .env-select, .sidebar-footer .avatar-mono + div{display:none;}
  .sidebar-link{justify-content:center;}
  .sidebar-footer{justify-content:center;}
  .main-wrap{margin-left:64px;width:calc(100% - 64px);}
  .page-header{padding:16px 14px;}
  .page-title{font-size:17px;}
  .page-actions{flex-wrap:wrap;gap:6px;}
  .content{padding:14px;}
  .goal-banner{flex-direction:column;align-items:flex-start;gap:10px;padding:20px;}
  .goal-banner-num{font-size:32px;}
  .hero-net{display:none;}
}
</style>
</head>

function Icon({name, style}){ return <i className={"ph ph-"+name} style={style}></i>; }

function Sparkline({points, color}){
  const w=64,h=26;
  const max=Math.max(...points), min=Math.min(...points);
  const norm = points.map((p,i)=> [ (i/(points.length-1))*w, h - ((p-min)/((max-min)||1))*h ]);
  const d = norm.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return (
    <svg className="stat-sparkline" width={w} height={h}>
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Donut({segments}){
  const total = segments.reduce((s,x)=>s+x.value,0);
  let acc = 0;
  const r = 42, c = 2*Math.PI*r;
  return (
    <svg width="112" height="112" viewBox="0 0 112 112">
      <g transform="translate(56,56) rotate(-90)">
        <circle r={r} fill="none" stroke="var(--n2)" strokeWidth="16"/>
        {segments.map((s,i)=>{
          const frac = s.value/total;
          const dash = frac*c;
          const offset = -acc*c;
          acc += frac;
          return <circle key={i} r={r} fill="none" stroke={s.color} strokeWidth="16"
            strokeDasharray={dash+" "+(c-dash)} strokeDashoffset={offset}
            style={{'--dash-final':offset, animation:'dashDraw .8s ease both', animationDelay:(i*120)+"ms"}}/>;
        })}
      </g>
      <text x="56" y="52" textAnchor="middle" fontSize="18" fontWeight="800" fill="var(--n9)">{total}</text>
      <text x="56" y="68" textAnchor="middle" fontSize="9.5" fill="var(--n6)">등록 샵</text>
    </svg>
  );
}

          {screen==="main" && <OverviewScreen toast={toast}/>}
          {screen==="shop-manage" && <ShopManageScreen toast={toast}/>}
          {screen==="region-settings" && <RegionSettingsScreen toast={toast}/>}
          {screen==="partnership" && <PartnershipScreen toast={toast}/>}
        </div>
      </main>
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
