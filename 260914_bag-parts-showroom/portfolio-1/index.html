<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파츠웨이 — 가방 부품 디지털 쇼룸</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 210°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbebfb; --m200:#b8d7f7; --m300:#8cbff2; --m400:#5ca4ed;
  --m500:#2e8be8; --m600:#0071e3; --m700:#005dba; --m800:#004891; --m900:#003366;
  --n0:#ffffff; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7; --n5:#b5b8ba;
  --n6:#909498; --n7:#707070; --n8:#53575a; --n9:#36383a; --n10:#1d1d1f;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:var(--n2); color:var(--n9); -webkit-font-smoothing:antialiased;
  font-feature-settings:'tnum' 1;
}
#root{width:100%; min-height:100vh; display:flex; flex-direction:column;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input, select, textarea{font-family:inherit; font-size:15px;}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}

/* ── layout shell ── */
.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column; background:var(--n2);}
.main-area{flex:1; width:100%;}

/* ── header (airbnb-search-grid signature) ── */
.search-header{position:sticky; top:0; z-index:50; width:100%; background:rgba(255,255,255,.86); backdrop-filter:blur(16px); border-bottom:1px solid var(--n3);}
.header-row{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:28px; padding:16px 40px;}
.brand{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; letter-spacing:-0.02em; color:var(--n10); flex-shrink:0;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff;}
.brand-mark svg{width:17px; height:17px;}

.search-bar{flex:1; max-width:640px; display:flex; align-items:stretch; border:1px solid var(--n4); border-radius:999px; background:var(--n1); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden;}
.search-segment{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:8px 20px; text-align:left; background:none; border:none; cursor:pointer; transition:background .15s;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:11px; font-weight:600; color:var(--n7);}
.segment-value{font-size:14px; color:var(--n9); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-segment select{width:100%; border:none; background:none; padding:0; font-size:14px; color:var(--n9); font-weight:500; cursor:pointer; appearance:none;}
.search-divider{width:1px; align-self:center; height:26px; background:var(--n3);}
.search-submit{flex-shrink:0; width:44px; height:44px; margin:4px; border-radius:999px; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; transition:background .15s, transform .15s;}
.search-submit:hover{background:var(--m700); transform:scale(1.04);}
.search-submit svg{width:17px; height:17px;}

.header-nav{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.nav-link{padding:10px 16px; border-radius:999px; font-size:14px; font-weight:500; color:var(--n8); transition:background .15s, color .15s;}
.nav-link:hover{background:var(--n2);}
.nav-link.active{background:var(--m50); color:var(--m700); font-weight:600;}
.nav-icon-btn{width:40px; height:40px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--n8); transition:background .15s;}
.nav-icon-btn:hover{background:var(--n2);}
.nav-icon-btn svg{width:18px; height:18px;}

.filter-chips{max-width:1280px; margin:0 auto; display:flex; gap:8px; padding:0 40px 16px; overflow-x:auto; scrollbar-width:thin;}
.filter-chips::-webkit-scrollbar{height:5px;}
.filter-chips::-webkit-scrollbar-thumb{background:var(--n4); border-radius:99px;}
.chip{flex-shrink:0; display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; border:1px solid var(--n4); background:var(--n1); color:var(--n8); font-size:13.5px; font-weight:500; transition:all .15s;}
.chip:hover{border-color:var(--n6);}
.chip.active{background:var(--m50); color:var(--m700); border-color:var(--m300); font-weight:600;}
.chip svg{width:14px; height:14px;}

/* ── screen transitions ── */
.screen{animation:fadeInUp .45s cubic-bezier(.2,.7,.3,1) both;}
@keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

/* ── hero (main) ── */
.hero-band{width:100%; background:var(--n0);}
.hero-inner{max-width:1280px; margin:0 auto; padding:96px 40px 112px; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
.hero-eyebrow{font-size:13px; font-weight:600; color:var(--m700); letter-spacing:.02em; margin-bottom:20px; display:flex; align-items:center; gap:6px;}
.hero-eyebrow svg{width:14px; height:14px;}
.hero-title{font-size:clamp(40px,6vw,76px); font-weight:700; letter-spacing:-0.03em; line-height:1.08; color:var(--n10); margin-bottom:24px;}
.hero-desc{font-size:17px; line-height:1.6; color:var(--n7); max-width:480px; margin-bottom:32px;}
.hero-actions{display:flex; gap:12px; margin-bottom:36px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; border-radius:999px; font-size:15px; font-weight:600; transition:all .15s;}
.btn svg{width:16px; height:16px;}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700); transform:translateY(-1px);}
.btn-ghost{background:none; border:1px solid var(--n5); color:var(--n9);}
.btn-ghost:hover{border-color:var(--n8); background:var(--n2);}
.hero-stats{display:flex; gap:32px;}
.hero-stat-num{font-size:24px; font-weight:700; color:var(--n10); letter-spacing:-0.02em;}
.hero-stat-label{font-size:12.5px; color:var(--n7); margin-top:2px;}

.hotspot-stage{position:relative; aspect-ratio:1/1; border-radius:32px; background:var(--n2); overflow:hidden; display:flex; align-items:center; justify-content:center;}
.hotspot-stage::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--m300) 30%, transparent), transparent 55%);}
.bag-svg{width:72%; height:72%; position:relative; z-index:1;}
.hotspot-dot{position:absolute; z-index:2; width:26px; height:26px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); box-shadow:0 2px 8px rgba(0,113,227,.35);}
.hotspot-dot svg{width:12px; height:12px;}
.hotspot-ring{position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--m600); animation:hotspotPulseRing 2.2s ease-out infinite;}
@keyframes hotspotPulseRing{0%{transform:scale(.7); opacity:.7;} 100%{transform:scale(2.1); opacity:0;}}
.hotspot-tooltip{position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:var(--n10); color:#fff; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:8px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;}
.hotspot-tooltip::after{content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--n10);}
.hotspot-dot-wrap:hover .hotspot-tooltip{opacity:1; transform:translateX(-50%) translateY(-3px);}
.hotspot-stage-caption{position:absolute; bottom:16px; left:16px; right:16px; background:rgba(255,255,255,.9); backdrop-filter:blur(6px); border-radius:14px; padding:10px 16px; font-size:12.5px; color:var(--n8); display:flex; align-items:center; gap:8px;}
.hotspot-stage-caption svg{width:14px; height:14px; color:var(--m600); flex-shrink:0;}

/* ── quick tiles ── */
.section-band{width:100%;}
.section-band.alt{background:var(--n0);}
.section-inner{max-width:1280px; margin:0 auto; padding:88px 40px;}
.section-head{margin-bottom:40px;}
.section-title{font-size:32px; font-weight:700; letter-spacing:-0.02em; color:var(--n10); margin-bottom:10px;}
.section-sub{font-size:15px; color:var(--n7);}
.tile-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.tile{background:var(--n1); border:1px solid var(--n3); border-radius:26px; padding:28px 24px; text-align:left; display:flex; flex-direction:column; gap:14px; transition:transform .18s, box-shadow .18s, border-color .18s;}
.tile:hover{transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.07); border-color:var(--n4);}
.tile-icon{width:42px; height:42px; border-radius:12px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center;}
.tile:nth-child(1) .tile-icon{background:var(--m50); color:var(--m700);}
.tile-icon svg{width:20px; height:20px;}
.tile-label{font-size:15.5px; font-weight:700; color:var(--n10); line-height:1.35;}
.tile-desc{font-size:13px; color:var(--n7); line-height:1.5;}
.tile-arrow{margin-top:auto; display:flex; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--m700);}
.tile-arrow svg{width:14px; height:14px; transition:transform .15s;}
.tile:hover .tile-arrow svg{transform:translateX(3px);}

/* ── catalog preview / grid ── */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:22px;}
.listing-card{background:var(--n1); border:1px solid var(--n3); border-radius:24px; overflow:hidden; transition:transform .18s, box-shadow .18s; animation:fadeInUp .5s both;}
.listing-card:hover{transform:translateY(-5px); box-shadow:0 16px 32px rgba(0,0,0,.08);}
.card-image-wrap{position:relative; aspect-ratio:4/3; background:var(--n3); overflow:hidden;}
.card-image{width:100%; height:100%; object-fit:cover; filter:grayscale(.55) contrast(1.05) brightness(1.03); transition:transform .3s;}
.listing-card:hover .card-image{transform:scale(1.045);}
.card-image-wrap::after{content:''; position:absolute; inset:0; background:linear-gradient(160deg, color-mix(in srgb, var(--m600) 14%, transparent), transparent 62%); pointer-events:none;}
.card-favorite{position:absolute; top:12px; right:12px; z-index:2; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--n8); transition:transform .15s;}
.card-favorite svg{width:16px; height:16px;}
.card-favorite.active{color:var(--m600);}
.card-favorite.active svg{fill:currentColor;}
.card-favorite.pop{animation:cardPop .3s ease;}
@keyframes cardPop{0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);}}
.card-cert{position:absolute; top:12px; left:12px; z-index:2; display:flex; align-items:center; gap:4px; background:var(--s1-bg); color:var(--s1-text); font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px;}
.card-cert svg{width:11px; height:11px;}
.card-body{padding:18px;}
.card-type{font-size:11.5px; font-weight:700; color:var(--m700); letter-spacing:.02em; margin-bottom:6px;}
.card-title{font-size:15.5px; font-weight:700; color:var(--n10); line-height:1.35; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-meta-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--n7); margin-bottom:4px;}
.card-meta-row svg{width:13px; height:13px; color:var(--n6); flex-shrink:0;}
.card-foot{margin-top:12px; padding-top:12px; border-top:1px solid var(--n3); display:flex; align-items:center; justify-content:space-between;}
.card-moq-label{font-size:11px; color:var(--n6);}
.card-moq{font-size:15px; font-weight:700; color:var(--n10);}

.catalog-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.result-count{font-size:14px; color:var(--n7);}
.result-count strong{color:var(--n10); font-weight:700;}
.empty-state{grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--n7);}
.empty-state svg{width:44px; height:44px; color:var(--n5); margin-bottom:16px;}

/* ── product detail ── */
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px;}
.detail-gallery-main{position:relative; aspect-ratio:4/3; border-radius:22px; overflow:hidden; background:var(--n3); margin-bottom:14px;}
.detail-gallery-main img{width:100%; height:100%; object-fit:cover; filter:grayscale(.5) contrast(1.05);}
.detail-thumbs{display:flex; gap:10px;}
.detail-thumb{width:74px; height:74px; border-radius:12px; overflow:hidden; border:2px solid transparent; opacity:.6; transition:all .15s; flex-shrink:0;}
.detail-thumb img{width:100%; height:100%; object-fit:cover; filter:grayscale(.5);}
.detail-thumb.active{border-color:var(--m600); opacity:1;}
.detail-type-badge{display:inline-block; font-size:12px; font-weight:700; color:var(--m700); background:var(--m50); padding:6px 12px; border-radius:999px; margin-bottom:14px;}
.detail-title{font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--n10); margin-bottom:20px; line-height:1.3;}
.spec-table{width:100%; border-collapse:collapse; margin-bottom:28px;}
.spec-table tr{border-bottom:1px solid var(--n3);}
.spec-table td{padding:13px 4px; font-size:14.5px;}
.spec-table td:first-child{color:var(--n7); width:120px; display:flex; align-items:center; gap:8px;}
.spec-table td:first-child svg{width:15px; height:15px; color:var(--n6);}
.spec-table td:last-child{color:var(--n10); font-weight:600;}
.detail-actions{display:flex; gap:12px; margin-bottom:8px;}
.related-section{margin-top:56px;}
.related-title{font-size:18px; font-weight:700; color:var(--n10); margin-bottom:18px;}
.related-scroll{display:flex; gap:16px; overflow-x:auto; padding-bottom:8px;}
.related-card{flex-shrink:0; width:200px; background:var(--n1); border:1px solid var(--n3); border-radius:16px; overflow:hidden; transition:transform .15s;}
.related-card:hover{transform:translateY(-3px);}
.related-card img{width:100%; aspect-ratio:4/3; object-fit:cover; filter:grayscale(.55);}
.related-card-body{padding:12px 14px;}
.related-card-title{font-size:13px; font-weight:600; color:var(--n10); line-height:1.35; margin-bottom:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.related-card-type{font-size:11px; color:var(--n7);}
.back-link{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--n7); margin-bottom:24px; transition:color .15s;}
.back-link:hover{color:var(--n10);}
.back-link svg{width:15px; height:15px;}

/* ── contact ── */
.contact-wrap{max-width:640px; margin:0 auto;}
.contact-context{display:flex; align-items:center; gap:12px; background:var(--m50); border:1px solid var(--m200); border-radius:16px; padding:14px 18px; margin-bottom:28px;}
.contact-context svg{width:20px; height:20px; color:var(--m700); flex-shrink:0;}
.contact-context-text{font-size:13.5px; color:var(--n9);}
.contact-context-text strong{color:var(--m700);}
.form-group{margin-bottom:20px;}
.form-label{display:block; font-size:13.5px; font-weight:600; color:var(--n9); margin-bottom:8px;}
.form-label .req{color:var(--s2); margin-left:2px;}
.form-input, .form-textarea{width:100%; padding:13px 16px; border:1px solid var(--n4); border-radius:12px; font-size:14.5px; background:var(--n1); color:var(--n10); transition:border-color .15s;}
.form-input:focus, .form-textarea:focus{outline:none; border-color:var(--m500);}
.form-input.err, .form-textarea.err{border-color:var(--s2);}
.form-textarea{resize:vertical; min-height:120px;}
.form-error{font-size:12.5px; color:var(--s2-text); margin-top:6px; display:flex; align-items:center; gap:5px;}
.form-error svg{width:13px; height:13px;}
.form-submit{width:100%; padding:15px; margin-top:8px;}
.success-panel{text-align:center; padding:56px 24px;}
.success-icon{width:64px; height:64px; border-radius:50%; background:var(--s1-bg); color:var(--s1); display:flex; align-items:center; justify-content:center; margin:0 auto 20px;}
.success-icon svg{width:30px; height:30px;}
.success-title{font-size:20px; font-weight:700; color:var(--n10); margin-bottom:8px;}
.success-desc{font-size:14px; color:var(--n7); margin-bottom:24px;}

/* ── about ── */
.about-hero{text-align:center; padding:80px 40px;}
.about-hero-title{font-size:clamp(30px,4vw,44px); font-weight:700; letter-spacing:-0.02em; color:var(--n10); margin-bottom:16px;}
.about-hero-desc{font-size:16px; color:var(--n7); max-width:560px; margin:0 auto; line-height:1.65;}
.about-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.about-card{background:var(--n1); border:1px solid var(--n3); border-radius:20px; padding:30px 26px;}
.about-card-icon{width:44px; height:44px; border-radius:12px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
.about-card-icon svg{width:21px; height:21px;}
.about-card-title{font-size:16.5px; font-weight:700; color:var(--n10); margin-bottom:8px;}
.about-card-desc{font-size:13.5px; color:var(--n7); line-height:1.6;}
.process-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; position:relative;}
.process-step{position:relative; padding-top:14px;}
.process-num{width:34px; height:34px; border-radius:50%; background:var(--m600); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.process-title{font-size:15px; font-weight:700; color:var(--n10); margin-bottom:6px;}
.process-desc{font-size:13px; color:var(--n7); line-height:1.55;}
.history-list{max-width:640px; margin:0 auto;}
.history-item{display:flex; gap:24px; padding:18px 0; border-bottom:1px solid var(--n3);}
.history-year{font-size:15px; font-weight:700; color:var(--m700); width:70px; flex-shrink:0;}
.history-text{font-size:14.5px; color:var(--n9);}
.cta-band{text-align:center; padding:64px 40px; background:var(--n10);}
.cta-band-title{font-size:26px; font-weight:700; color:#fff; margin-bottom:24px; letter-spacing:-0.02em;}

/* ── footer ── */
.footer{width:100%; background:var(--n0); border-top:1px solid var(--n3);}
.footer-cols{max-width:1280px; margin:0 auto; padding:56px 40px 28px; display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:32px;}
.footer-col h4{font-size:13px; font-weight:700; color:var(--n10); margin-bottom:14px;}
.footer-col a, .footer-col button{display:block; font-size:13.5px; color:var(--n7); margin-bottom:10px; transition:color .15s; text-align:left;}
.footer-col a:hover, .footer-col button:hover{color:var(--n10);}
.footer-brand-desc{font-size:13px; color:var(--n7); line-height:1.65; max-width:260px; margin-top:10px;}
.footer-bottom{max-width:1280px; margin:0 auto; padding:20px 40px 32px; border-top:1px solid var(--n3); font-size:12.5px; color:var(--n6); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ── toast ── */
.toast{position:fixed; bottom:28px; right:28px; z-index:200; background:var(--n10); color:#fff; padding:14px 20px; border-radius:14px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:500; box-shadow:0 12px 28px rgba(0,0,0,.22); animation:toastSlideIn .35s cubic-bezier(.2,.8,.3,1);}
.toast svg{width:17px; height:17px; color:var(--s1);}
@keyframes toastSlideIn{from{opacity:0; transform:translateY(16px) translateX(8px);} to{opacity:1; transform:translateY(0) translateX(0);}}

@media (max-width:980px){
  .hero-inner{grid-template-columns:1fr; gap:40px;}
  .tile-grid{grid-template-columns:repeat(2,1fr);}
  .detail-grid{grid-template-columns:1fr;}
  .about-cards, .process-steps{grid-template-columns:repeat(2,1fr);}
  .footer-cols{grid-template-columns:1fr 1fr;}

function Card({p, idx, favorites, toggleFav, onOpen}){
  const typeLabel = PART_TYPES.find(t=>t.id===p.typeId).label;
  const isFav = favorites.has(p.id);
  const [pop, setPop] = useState(false);
  return (
    <article className="listing-card" style={{animationDelay:(idx*0.04)+'s'}} onClick={onOpen}>
      <div className="card-image-wrap">
        <img className="card-image" src={`https://picsum.photos/seed/${p.seed}/480/360`} alt={p.name} loading="lazy"/>
        <div className="card-cert"><Icon name="shield-check"/>정품 인증</div>
        <button className={"card-favorite" + (isFav?' active':'') + (pop?' pop':'')} onClick={(e) => { e.stopPropagation(); toggleFav(p.id); setPop(true); setTimeout(()=>setPop(false),300); }} aria-label="관심 부품">
          <Icon name="heart"/>
        </button>
      </div>
      <div className="card-body">
        <div className="card-type">{typeLabel}</div>
        <div className="card-title">{p.name}</div>
        <div className="card-meta-row"><Icon name="layers"/>{p.material}</div>
        <div className="card-meta-row"><Icon name="ruler"/>{p.size} · {p.weight}</div>
        <div className="card-foot">
          <div>
            <div className="card-moq-label">최소 발주 수량</div>
            <div className="card-moq">{p.moq}</div>
          </div>
          <Icon name="chevron-right" style={{width:'16px', height:'16px', color:'var(--n6)'}}/>
        </div>
      </div>
    </article>
  );
}

function CatalogScreen({typeFilter, setTypeFilter, query, favorites, toggleFav, openDetail}){
  const filtered = useMemo(() => PRODUCTS.filter(p => {
    const typeOk = typeFilter==='all' || p.typeId===typeFilter;
    const qOk = !query || p.name.includes(query) || p.material.includes(query);
    return typeOk && qOk;
  }), [typeFilter, query]);
  return (
    <div className="screen section-inner">
      <div className="section-head">
        <div className="section-title">전체 부품 카탈로그</div>
        <div className="section-sub">유형·소재를 조합해 필터링할 수 있습니다</div>
      </div>
      <div className="catalog-toolbar">
        <div className="result-count">총 <strong>{filtered.length}</strong>개 부품</div>
      </div>
      <div className="card-grid">
        {filtered.length === 0 ? (
          <div className="empty-state"><Icon name="search-x"/><div>조건에 맞는 부품이 없습니다</div></div>
        ) : filtered.map((p,i) => <Card key={p.id} p={p} idx={i} favorites={favorites} toggleFav={toggleFav} onOpen={() => openDetail(p)}/>)}

  );
}

function DetailScreen({product, setScreen, openDetail, prepareContact}){
  const [imgIdx, setImgIdx] = useState(0);
  useEffect(()=>{ setImgIdx(0); }, [product && product.id]);
  if(!product) return null;
  const typeLabel = PART_TYPES.find(t=>t.id===product.typeId).label;
  const thumbs = [product.seed, product.seed+'-b', product.seed+'-c'];
  const related = PRODUCTS.filter(p => p.id !== product.id && p.typeId !== product.typeId).slice(0,4);
  return (
    <div className="screen section-inner">
      <button className="back-link" onClick={() => setScreen('catalog')}><Icon name="chevron-left"/>카탈로그로 돌아가기</button>

          <div className="detail-thumbs">
            {thumbs.map((t,i) => (
              <button key={t} className={"detail-thumb" + (i===imgIdx?' active':'')} onClick={() => setImgIdx(i)}>

        </div>
        <div>

          <h1 className="detail-title">{product.name}</h1>
          <table className="spec-table">

              <tr><td><Icon name="layers"/>소재</td><td>{product.material}</td></tr>
              <tr><td><Icon name="ruler"/>사이즈</td><td>{product.size}</td></tr>
              <tr><td><Icon name="scale"/>중량</td><td>{product.weight}</td></tr>
              <tr><td><Icon name="package"/>최소 발주</td><td>{product.moq}</td></tr>
              <tr><td><Icon name="shield-check"/>인증</td><td>정품 인증 완료</td></tr>
            </tbody>
          </table>
          <div className="detail-actions">
            <button className="btn btn-primary" onClick={() => { prepareContact(product); setScreen('contact'); }}>문의하기 <Icon name="send"/></button>

            <button key={p.id} className="related-card" onClick={() => openDetail(p)}>

              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContactScreen({contextProduct, showToast}){
  const [form, setForm] = useState({name:'', email:'', phone:'', message:''});
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  const validate = () => {
    const e = {};
    if(!form.name.trim()) e.name = '이름을 입력해 주세요';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email)) e.email = '올바른 이메일 형식을 입력해 주세요';
    if(!form.message.trim() || form.message.trim().length < 5) e.message = '문의 내용을 5자 이상 입력해 주세요';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = () => {
    if(!validate()) return;
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      setDone(true);
      showToast('문의가 정상적으로 접수되었습니다');
    }, 1100);
  };

  if(done){
    return (
      <div className="screen section-inner">
        <div className="contact-wrap success-panel">
          <div className="success-icon"><Icon name="check-circle"/></div>
          <div className="success-title">문의가 접수되었습니다</div>
          <div className="success-desc">담당자가 확인 후 입력하신 이메일로 회신드립니다.</div>
          <button className="btn btn-ghost" onClick={() => { setDone(false); setForm({name:'',email:'',phone:'',message:''}); }}>새 문의 작성하기</button>
        </div>
      </div>
    );
  }

  return (
    <div className="screen section-inner">
      <div className="contact-wrap">
        <div className="section-head">
          <div className="section-title">이메일 문의 연결</div>
          <div className="section-sub">제품 확인 후 담당자에게 바로 문의를 남길 수 있습니다</div>
        </div>
        {contextProduct && (
          <div className="contact-context">
            <Icon name="package"/>
            <div className="contact-context-text">문의 제품: <strong>{contextProduct.name}</strong> 에 대한 문의로 접수됩니다</div>
          </div>
        )}
        <div className="form-group">
          <label className="form-label">이름<span className="req">*</span></label>
          <input className={"form-input" + (errors.name?' err':'')} value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="담당자명"/>
          {errors.name && <div className="form-error"><Icon name="alert-circle"/>{errors.name}</div>}
        </div>
        <div className="form-group">
          <label className="form-label">이메일<span className="req">*</span></label>
          <input className={"form-input" + (errors.email?' err':'')} value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="example@company.com"/>
          {errors.email && <div className="form-error"><Icon name="alert-circle"/>{errors.email}</div>}
        </div>
        <div className="form-group">
          <label className="form-label">연락처</label>
          <input className="form-input" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="010-0000-0000"/>
        </div>
        <div className="form-group">
          <label className="form-label">문의 내용<span className="req">*</span></label>
          <textarea className={"form-textarea" + (errors.message?' err':'')} value={form.message} onChange={e=>setForm({...form, message:e.target.value})} placeholder="필요한 수량, 납기, 원하시는 사양 등을 적어 주세요"></textarea>
          {errors.message && <div className="form-error"><Icon name="alert-circle"/>{errors.message}</div>}
        </div>
        <button className="btn btn-primary form-submit" onClick={submit} disabled={submitting}>
          {submitting ? '전송 중...' : <React.Fragment>문의 보내기 <Icon name="send"/></React.Fragment>}
        </button>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [typeFilter, setTypeFilter] = useState('all');
  const [material, setMaterial] = useState('전체 소재');
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState(null);
  const [contextProduct, setContextProduct] = useState(null);
  const [favorites, setFavorites] = useState(new Set());
  const [toast, setToast] = useState(null);

  useEffect(() => { lucide.createIcons(); });
  useEffect(() => { window.scrollTo({top:0, behavior:'auto'}); }, [screen]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  };

  const toggleFav = (id) => {
    setFavorites(prev => {
      const next = new Set(prev);
      if(next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const openDetail = (p) => { setSelected(p); setScreen('detail'); };
  const onHotspot = (h) => {
    const match = PRODUCTS.find(p => p.typeId === h.typeId);
    if(match) openDetail(match);
  };
  const onSearch = () => { setScreen('catalog'); };

  return (
    <div className="app-shell">
      <Header screen={screen} setScreen={setScreen} query={query} setQuery={setQuery} typeFilter={typeFilter} setTypeFilter={setTypeFilter} material={material} setMaterial={setMaterial} onSearch={onSearch}/>
      <div className="main-area">
        {screen === 'main' && <MainScreen setScreen={setScreen} onHotspot={onHotspot} favorites={favorites} toggleFav={toggleFav} openDetail={openDetail}/>}
        {screen === 'catalog' && <CatalogScreen typeFilter={typeFilter} setTypeFilter={setTypeFilter} query={query} favorites={favorites} toggleFav={toggleFav} openDetail={openDetail}/>}
        {screen === 'detail' && <DetailScreen product={selected} setScreen={setScreen} openDetail={openDetail} prepareContact={setContextProduct}/>}
        {screen === 'contact' && <ContactScreen contextProduct={contextProduct} showToast={showToast}/>}
        {screen === 'about' && <AboutScreen/>}
      </div>
      <Footer setScreen={setScreen} openFirstDetail={() => openDetail(PRODUCTS[0])}/>
      {toast && <div className="toast"><Icon name="check-circle"/>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
