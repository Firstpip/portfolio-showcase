<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파츠웨이 관리자 콘솔</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 300°, dark) ── */
:root{
  --m50:#fce7fc; --m100:#f9cff9; --m200:#f6b1f6; --m300:#f290f2; --m400:#ef71ef;
  --m500:#eb52eb; --m600:#c143c1; --m700:#963496; --m800:#6a256a; --m900:#6a256a;
  --n0:#201e20; --n1:#3a363a; --n2:#5a535a; --n3:#7a717a; --n4:#989098; --n5:#bab5ba;
  --n6:#c3c3cc; --n7:#e6e5e6; --n8:#f0eff0; --n9:#ededf3; --n10:#fdfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;
}
#root{width:100%; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input, select, textarea{font-family:inherit; font-size:14px;}
img{display:block; max-width:100%;}

/* ── shell: sidebar-classic 강제 패턴 ── */
.shell{display:flex; width:100%; min-height:100vh;}
.sidebar{position:fixed; left:0; top:0; bottom:0; width:248px; background:var(--n1); border-right:1px solid var(--n3); display:flex; flex-direction:column; z-index:40;}
.main-wrap{margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px); min-height:100vh; display:flex; flex-direction:column;}

.sb-brand{display:flex; align-items:center; gap:10px; padding:22px 20px; border-bottom:1px solid var(--n3);}
.sb-brand-mark{width:32px; height:32px; border-radius:9px; background:var(--m500); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px;}
.sb-brand-name{font-size:15px; font-weight:700; color:var(--n9);}
.sb-brand-sub{font-size:11px; color:var(--n6);}

.sb-nav{flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.sb-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; font-size:14px; font-weight:500; color:var(--n7); text-align:left; transition:background .15s, color .15s; position:relative;}
.sb-item i{font-size:18px; color:var(--n5); flex-shrink:0;}
.sb-item:hover{background:var(--n2); color:var(--n9);}
.sb-item.active{background:color-mix(in srgb, var(--m500) 16%, transparent); color:var(--m300); font-weight:700;}
.sb-item.active i{color:var(--m400);}
.sb-item.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--m500);}
.sb-count{margin-left:auto; font-size:11px; background:var(--n2); color:var(--n6); padding:2px 8px; border-radius:999px;}

.sb-foot{padding:16px 20px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:10px;}
.sb-avatar{width:32px; height:32px; border-radius:10px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:16px;}
.sb-foot-name{font-size:13px; font-weight:600; color:var(--n8);}
.sb-foot-role{font-size:11px; color:var(--n5);}

.topbar{height:72px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 36px; border-bottom:1px solid var(--n3); background:var(--n0);}
.topbar-title{font-size:21px; font-weight:700; color:var(--n9); letter-spacing:-0.01em;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--n6); transition:background .15s;}
.icon-btn:hover{background:var(--n2); color:var(--n9);}
.icon-btn i{font-size:18px;}

.content{flex:1; width:100%; padding:36px 40px; overflow-y:auto;}
.console-banner{position:relative; overflow:hidden; border-radius:16px; padding:32px 36px; margin-bottom:24px; background:linear-gradient(135deg, var(--m800) 0%, var(--n0) 78%);}
.console-banner::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 82% 0%, color-mix(in srgb, var(--m400) 35%, transparent), transparent 60%);}
.console-banner-inner{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:24px;}
.console-banner-title{font-size:26px; font-weight:700; color:var(--n10); letter-spacing:-0.015em; margin-bottom:8px;}
.console-banner-desc{font-size:13.5px; color:var(--n6); max-width:420px; line-height:1.55;}
.console-banner-stats{display:flex; gap:28px; flex-shrink:0;}
.console-banner-stat-num{font-size:28px; font-weight:700; color:var(--n10); letter-spacing:-0.02em;}
.console-banner-stat-label{font-size:11px; color:var(--n5); margin-top:2px;}
.screen{animation:fadeInUp .4s cubic-bezier(.2,.7,.3,1) both;}
@keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; transition:all .15s;}
.btn i{font-size:16px;}
.btn-primary{background:var(--m500); color:#fff;}
.btn-primary:hover{background:var(--m400);}
.btn-ghost{background:var(--n1); border:1px solid var(--n3); color:var(--n8);}
.btn-ghost:hover{border-color:var(--n4); background:var(--n2);}
.btn-danger{background:var(--s2-bg); color:var(--s2-text);}
.btn-danger:hover{background:color-mix(in srgb, var(--s2-bg) 80%, var(--s2) 20%);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}

/* ── master-detail ── */
.md-grid{display:grid; grid-template-columns:340px 1fr; gap:20px; height:calc(100vh - 320px); min-height:460px;}
.list-rail{background:var(--n1); border:1px solid var(--n3); border-radius:12px; display:flex; flex-direction:column; overflow:hidden;}
.list-rail-head{padding:16px; border-bottom:1px solid var(--n3); display:flex; flex-direction:column; gap:10px;}
.search-mini{display:flex; align-items:center; gap:8px; background:var(--n2); border-radius:10px; padding:9px 12px;}
.search-mini i{color:var(--n5); font-size:16px;}
.search-mini input{flex:1; background:none; border:none; color:var(--n9); outline:none;}
.list-rail-body{flex:1; overflow-y:auto; padding:8px;}
.rail-row{display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; transition:background .15s; text-align:left; width:100%;}
.rail-row:hover{background:var(--n2);}
.rail-row.active{background:color-mix(in srgb, var(--m500) 16%, transparent); border:1px solid var(--m600);}
.rail-thumb{width:40px; height:40px; border-radius:8px; overflow:hidden; flex-shrink:0; background:var(--n2);}
.rail-thumb img{width:100%; height:100%; object-fit:cover; filter:grayscale(.6) brightness(.9);}
.rail-row-body{flex:1; min-width:0;}
.rail-row-title{font-size:13px; font-weight:600; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rail-row-sub{font-size:11.5px; color:var(--n6);}
.detail-panel{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:28px; overflow-y:auto;}
.detail-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
.detail-panel-title{font-size:18px; font-weight:700; color:var(--n9);}
.empty-panel{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--n5); gap:12px;}
.empty-panel i{font-size:38px;}

.form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
.form-group{margin-bottom:16px;}
.form-label{display:block; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:7px;}
.form-input, .form-select, .form-textarea{width:100%; padding:11px 13px; background:var(--n0); border:1px solid var(--n3); border-radius:10px; color:var(--n9); transition:border-color .15s;}
.form-input:focus, .form-select:focus, .form-textarea:focus{outline:none; border-color:var(--m500);}
.form-textarea{resize:vertical; min-height:96px;}

.dropzone{border:1.5px dashed var(--n4); border-radius:12px; padding:28px; text-align:center; color:var(--n6); transition:border-color .15s, background .15s; margin-bottom:16px;}
.dropzone.over{border-color:var(--m500); background:color-mix(in srgb, var(--m500) 10%, transparent); color:var(--m300);}
.dropzone i{font-size:26px; margin-bottom:8px; display:block;}
.dropzone-file{margin-top:8px; font-size:12.5px; color:var(--n8); display:flex; align-items:center; justify-content:center; gap:6px;}

.panel-actions{display:flex; gap:10px; margin-top:8px;}

/* ── part types ── */
.type-list{background:var(--n1); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.type-row{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--n3); transition:background .15s;}
.type-row:last-child{border-bottom:none;}
.type-row.dragging{opacity:.4;}
.drag-handle{color:var(--n4); cursor:grab; font-size:17px;}
.type-name{flex:1; font-size:14px; font-weight:600; color:var(--n9);}
.type-name-input{background:var(--n0); border:1px solid var(--m500); border-radius:8px; padding:6px 10px; color:var(--n9); font-size:14px; font-weight:600;}
.type-badge{font-size:11.5px; background:var(--n2); color:var(--n6); padding:4px 10px; border-radius:999px;}
.switch{position:relative; width:38px; height:22px; border-radius:999px; background:var(--n3); flex-shrink:0; transition:background .15s;}
.switch.on{background:var(--m500);}
.switch-knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--n9); transition:transform .15s;}
.switch.on .switch-knob{transform:translateX(16px); background:#fff;}
.row-actions{display:flex; gap:6px;}

/* ── hotspot editor ── */
.hotspot-editor-grid{display:grid; grid-template-columns:1fr 340px; gap:20px;}
.editor-stage{position:relative; aspect-ratio:1/1; background:var(--n1); border:1px solid var(--n3); border-radius:16px; overflow:hidden;}
.editor-stage.placing{cursor:crosshair;}
.editor-stage.placing::after{content:'클릭한 위치에 새 핫스팟이 추가됩니다'; position:absolute; top:14px; left:50%; transform:translateX(-50%); background:var(--m500); color:#fff; font-size:12px; font-weight:600; padding:8px 14px; border-radius:999px; z-index:5;}
.bag-svg-dark{width:66%; height:66%; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);}
.ed-dot{position:absolute; width:24px; height:24px; border-radius:50%; background:var(--m500); border:2px solid var(--n0); transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; z-index:2;}
.ed-dot.selected{box-shadow:0 0 0 4px color-mix(in srgb, var(--m500) 40%, transparent);}
.hotspot-panel{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:10px; max-height:640px; overflow-y:auto;}
.hs-item{background:var(--n0); border:1px solid var(--n3); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px;}
.hs-item.selected{border-color:var(--m500);}
.hs-item-head{display:flex; align-items:center; justify-content:between; justify-content:space-between;}
.hs-item-label{font-size:13.5px; font-weight:700; color:var(--n9);}

/* ── content manage ── */
.cm-grid{display:grid; grid-template-columns:280px 1fr; gap:20px;}
.block-list{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:10px;}
.block-row{padding:12px 14px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--n7); display:flex; align-items:center; gap:10px; transition:background .15s;}
.block-row:hover{background:var(--n2);}
.block-row.active{background:color-mix(in srgb, var(--m500) 16%, transparent); color:var(--m300);}
.status-pill{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;}
.status-pill.draft{background:var(--s3-bg); color:var(--s3-text);}
.status-pill.published{background:var(--s1-bg); color:var(--s1-text);}
.preview-box{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:24px; margin-top:16px;}
.preview-box h3{font-size:17px; margin-bottom:10px; color:var(--n9);}
.preview-box p{font-size:13.5px; color:var(--n7); line-height:1.6;}

/* ── activity log ── */
.log-table{width:100%; border-collapse:collapse; background:var(--n1); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.log-table th{text-align:left; font-size:12px; color:var(--n6); font-weight:600; padding:14px 18px; background:var(--n2); border-bottom:1px solid var(--n3);}
.log-table td{padding:14px 18px; font-size:13.5px; color:var(--n8); border-bottom:1px solid var(--n3);}
.log-table tr:last-child td{border-bottom:none;}

/* ── toast / modal ── */
.toast{position:fixed; bottom:28px; right:28px; z-index:200; background:var(--n1); border:1px solid var(--n3); color:var(--n9); padding:14px 20px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:500; box-shadow:0 12px 28px rgba(0,0,0,.4); animation:toastSlideIn .35s cubic-bezier(.2,.8,.3,1);}
.toast i{font-size:18px; color:var(--s1);}
@keyframes toastSlideIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:150; display:flex; align-items:center; justify-content:center; animation:fadeInUp .2s ease both;}
.modal-box{background:var(--n1); border:1px solid var(--n3); border-radius:14px; padding:26px; width:380px; animation:modalPop .25s cubic-bezier(.2,.8,.3,1) both;}
@keyframes modalPop{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
.modal-title{font-size:16px; font-weight:700; color:var(--n9); margin-bottom:10px;}
.modal-desc{font-size:13.5px; color:var(--n7); margin-bottom:22px; line-height:1.55;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}

@media (max-width:1100px){
  .md-grid, .hotspot-editor-grid, .cm-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
}
@media (max-width:480px){
  .topbar{padding:0 16px;}
  .topbar-title{font-size:16px;}
  .content{padding:20px 16px;}
  .console-banner{padding:22px 20px;}
  .console-banner-inner{flex-direction:column; align-items:flex-start;}
  .console-banner-stats{gap:20px;}
}
</style>
</head>
<body data-archetype="sidebar-classic">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

const HISTORY = [

function BagSVGDark(){
  return (
    <svg className="bag-svg-dark" viewBox="0 0 480 480" fill="none">
      <path d="M200 92 Q200 60 240 60 Q280 60 280 92" stroke="var(--n4)" strokeWidth="10" strokeLinecap="round"/>
      <rect x="110" y="88" width="260" height="96" rx="22" fill="var(--n0)" stroke="var(--n3)" strokeWidth="2"/>

function Toast({msg}){
  if(!msg) return null;
  return <div className="toast"><Ph name="check-circle"/>{msg}</div>;
}

function ConfirmModal({title, desc, onConfirm, onCancel, danger}){
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div className="modal-desc">{desc}</div>
        <div className="modal-actions">
          <button className="btn btn-ghost btn-sm" onClick={onCancel}>취소</button>
          <button className={"btn btn-sm " + (danger?'btn-danger':'btn-primary')} onClick={onConfirm}>확인</button>
        </div>
      </div>
    </div>
  );
}

function Topbar({title, showToast}){

    <div className="topbar">
      <div className="topbar-title">{title}</div>

        <button className="icon-btn" onClick={() => showToast('새 알림이 없습니다')} aria-label="알림"><Ph name="bell"/></button>
        <button className="icon-btn" onClick={() => showToast('설정 화면은 준비 중입니다')} aria-label="설정"><Ph name="gear"/></button>

function ProductScreen({products, setProducts, showToast}){
  const [selectedId, setSelectedId] = useState(products[0] ? products[0].id : null);
  const [query, setQuery] = useState('');
  const [draft, setDraft] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [fileName, setFileName] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);

  const selected = products.find(p => p.id === selectedId) || null;
  useEffect(() => { setDraft(selected ? {...selected} : null); setFileName(''); }, [selectedId]);

  const filtered = useMemo(() => products.filter(p => !query || p.name.includes(query)), [products, query]);

  const startNew = () => { setSelectedId(null); setDraft({id:null, name:'', typeId:'basket', material:'', size:'', weight:'', moq:'', seed:'bp-basket-1'}); setFileName(''); };
  const save = () => {
    if(!draft || !draft.name.trim()) { showToast('부품명을 입력해 주세요'); return; }
    if(draft.id){
      setProducts(products.map(p => p.id === draft.id ? draft : p));
      showToast('변경 사항이 저장되었습니다');
    } else {
      const newP = {...draft, id: Date.now()};
      setProducts([newP, ...products]);
      setSelectedId(newP.id);
      showToast('새 부품이 등록되었습니다');
    }
  };
  const doDelete = () => {
    setProducts(products.filter(p => p.id !== selected.id));
    setConfirmDel(false);
    setSelectedId(null);
    showToast('부품이 삭제되었습니다');
  };

  return (
    <div className="screen">
      <div className="console-banner">
        <div className="console-banner-inner">
          <div>
            <div className="console-banner-title">오늘도 안정적으로 운영 중입니다</div>
            <div className="console-banner-desc">제품·부품 유형·핫스팟 연결을 한 곳에서 관리하고, 변경 사항은 자동으로 이력에 기록됩니다.</div>
          </div>
          <div className="console-banner-stats">
            <div><div className="console-banner-stat-num">{products.length}</div><div className="console-banner-stat-label">등록 제품</div></div>
            <div><div className="console-banner-stat-num">10</div><div className="console-banner-stat-label">부품 유형</div></div>
          </div>
        </div>
      </div>
      <div className="md-grid">
        <div className="list-rail">
          <div className="list-rail-head">
            <button className="btn btn-primary btn-sm" onClick={startNew} style={{width:'100%', justifyContent:'center'}}><Ph name="plus"/>신규 등록</button>
            <div className="search-mini"><Ph name="magnifying-glass"/><input placeholder="부품명 검색" value={query} onChange={e=>setQuery(e.target.value)}/></div>
          </div>
          <div className="list-rail-body">
            {filtered.map(p => (
              <button key={p.id} className={"rail-row" + (selectedId===p.id?' active':'')} onClick={() => setSelectedId(p.id)}>
                <div className="rail-thumb"><img src={`https://picsum.photos/seed/${p.seed}/80/80`} alt=""/></div>
                <div className="rail-row-body">
                  <div className="rail-row-title">{p.name}</div>
                  <div className="rail-row-sub">{p.material}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
        <div className="detail-panel">
          {!draft ? (
            <div className="empty-panel"><Ph name="cursor-click"/><div>좌측에서 부품을 선택하거나 신규 등록을 눌러 주세요</div></div>
          ) : (
            <React.Fragment>
              <div className="detail-panel-head">
                <div className="detail-panel-title">{draft.id ? '부품 정보 수정' : '신규 부품 등록'}</div>
                {draft.id && <button className="btn btn-danger btn-sm" onClick={() => setConfirmDel(true)}><Ph name="trash"/>삭제</button>}
              </div>
              <div
                className={"dropzone" + (dragOver?' over':'')}
                onDragOver={e=>{e.preventDefault(); setDragOver(true);}}
                onDragLeave={() => setDragOver(false)}
                onDrop={e=>{e.preventDefault(); setDragOver(false); const f=e.dataTransfer.files[0]; if(f) setFileName(f.name);}}
              >
                <Ph name="upload-simple"/>
                이미지를 이 영역으로 드래그하거나 클릭하여 업로드
                {fileName && <div className="dropzone-file"><Ph name="image"/>{fileName}</div>}
              </div>
              <div className="form-group">
                <label className="form-label">부품명</label>
                <input className="form-input" value={draft.name} onChange={e=>setDraft({...draft, name:e.target.value})}/>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">부품 유형</label>
                  <select className="form-select" value={draft.typeId} onChange={e=>setDraft({...draft, typeId:e.target.value})}>
                    {PART_TYPES_INIT.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">소재</label>
                  <input className="form-input" value={draft.material} onChange={e=>setDraft({...draft, material:e.target.value})}/>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">사이즈</label>
                  <input className="form-input" value={draft.size} onChange={e=>setDraft({...draft, size:e.target.value})}/>
                </div>
                <div className="form-group">
                  <label className="form-label">중량</label>
                  <input className="form-input" value={draft.weight} onChange={e=>setDraft({...draft, weight:e.target.value})}/>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">최소 발주 수량(개)</label>
                <input className="form-input" value={draft.moq} onChange={e=>setDraft({...draft, moq:e.target.value})}/>
              </div>
              <div className="panel-actions">
                <button className="btn btn-primary" onClick={save}><Ph name="floppy-disk"/>저장</button>
                <button className="btn btn-ghost" onClick={() => setDraft(selected ? {...selected} : null)}>취소</button>
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
      {confirmDel && <ConfirmModal title="부품을 삭제할까요?" desc={`"${selected && selected.name}" 부품을 삭제하면 되돌릴 수 없습니다.`} danger onConfirm={doDelete} onCancel={() => setConfirmDel(false)}/>}
    </div>
  );
}

function PartTypesScreen({types, setTypes, showToast}){
  const [editingId, setEditingId] = useState(null);
  const [tempName, setTempName] = useState('');
  const [dragId, setDragId] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const toggleVisible = (id) => {
    setTypes(types.map(t => t.id===id ? {...t, visible:!t.visible} : t));
    showToast('노출 상태가 변경되었습니다');
  };
  const startEdit = (t) => { setEditingId(t.id); setTempName(t.label); };
  const commitEdit = () => {
    setTypes(types.map(t => t.id===editingId ? {...t, label:tempName || t.label} : t));
    setEditingId(null);
    showToast('부품 유형명이 수정되었습니다');
  };
  const onDrop = (targetId) => {
    if(dragId === null || dragId === targetId) return;
    const list = [...types];
    const from = list.findIndex(t=>t.id===dragId);
    const to = list.findIndex(t=>t.id===targetId);
    const [moved] = list.splice(from,1);
    list.splice(to,0,moved);
    setTypes(list);
    setDragId(null);
    showToast('유형 순서가 변경되었습니다');
  };
  const doDelete = () => {
    setTypes(types.filter(t => t.id !== confirmDel));
    setConfirmDel(null);
    showToast('부품 유형이 삭제되었습니다');
  };

  return (
    <div className="screen">
      <div className="type-list">
        {types.map(t => (
          <div
            key={t.id}
            className={"type-row" + (dragId===t.id?' dragging':'')}
            draggable
            onDragStart={() => setDragId(t.id)}
            onDragOver={e => e.preventDefault()}
            onDrop={() => onDrop(t.id)}
          >
            <span className="drag-handle"><Ph name="dots-six-vertical"/></span>
            {editingId===t.id ? (
              <input className="type-name-input" autoFocus value={tempName} onChange={e=>setTempName(e.target.value)} onBlur={commitEdit} onKeyDown={e=>{if(e.key==='Enter') commitEdit();}}/>
            ) : (
              <button className="type-name" style={{textAlign:'left'}} onClick={() => startEdit(t)}>{t.label}</button>
            )}
            <span className="type-badge">연결된 제품 {t.count}개</span>
            <button className={"switch" + (t.visible?' on':'')} onClick={() => toggleVisible(t.id)} aria-label="노출 토글"><span className="switch-knob"></span></button>
            <div className="row-actions">
              <button className="icon-btn btn-sm" onClick={() => startEdit(t)}><Ph name="pencil-simple"/></button>
              <button className="icon-btn btn-sm" onClick={() => setConfirmDel(t.id)}><Ph name="trash"/></button>
            </div>
          </div>
        ))}
      </div>
      {confirmDel && <ConfirmModal title="부품 유형을 삭제할까요?" desc="연결된 제품의 유형 정보는 유지되며, 필터 목록에서만 제거됩니다." danger onConfirm={doDelete} onCancel={() => setConfirmDel(null)}/>}
    </div>
  );
}

function HotspotEditorScreen({hotspots, setHotspots, showToast}){
  const [placing, setPlacing] = useState(false);
  const [selectedId, setSelectedId] = useState(hotspots[0] ? hotspots[0].id : null);
  const stageRef = useRef(null);

  const onStageClick = (e) => {
    if(!placing) return;
    const rect = stageRef.current.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 1000) / 10;
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 1000) / 10;
    const id = 'hs-' + Date.now();
    const newHs = {id, typeId:'basket', label:'새 핫스팟', x, y};
    setHotspots([...hotspots, newHs]);
    setSelectedId(id);
    setPlacing(false);
    showToast('새 핫스팟이 추가되었습니다');
  };
  const removeHotspot = (id) => {
    setHotspots(hotspots.filter(h => h.id !== id));
    if(selectedId===id) setSelectedId(null);
    showToast('핫스팟이 삭제되었습니다');
  };
  const updateHotspot = (id, patch) => setHotspots(hotspots.map(h => h.id===id ? {...h, ...patch} : h));

  return (
    <div className="screen">
      <div style={{marginBottom:16, display:'flex', gap:10}}>
        <button className={"btn " + (placing?'btn-primary':'btn-ghost')} onClick={() => setPlacing(!placing)}>
          <Ph name={placing ? 'x' : 'crosshair'}/>{placing ? '배치 모드 끄기' : '새 핫스팟 배치 모드'}
        </button>
      </div>
      <div className="hotspot-editor-grid">
        <div ref={stageRef} className={"editor-stage" + (placing?' placing':'')} onClick={onStageClick}>
          <BagSVGDark/>
          {hotspots.map(h => (
            <button
              key={h.id}
              className={"ed-dot" + (selectedId===h.id?' selected':'')}
              style={{left:h.x+'%', top:h.y+'%'}}
              onClick={(e) => { e.stopPropagation(); setSelectedId(h.id); }}
            ><Ph name="map-pin"/></button>
          ))}
        </div>
        <div className="hotspot-panel">
          {hotspots.length===0 && <div style={{color:'var(--n5)', fontSize:13}}>등록된 핫스팟이 없습니다</div>}
          {hotspots.map(h => (
            <div key={h.id} className={"hs-item" + (selectedId===h.id?' selected':'')} onClick={() => setSelectedId(h.id)}>
              <div className="hs-item-head">
                <span className="hs-item-label">{h.label}</span>
                <button className="icon-btn btn-sm" onClick={(e)=>{e.stopPropagation(); removeHotspot(h.id);}}><Ph name="trash"/></button>
              </div>
              <select className="form-select" value={h.typeId} onChange={e => updateHotspot(h.id, {typeId:e.target.value, label: PART_TYPES_INIT.find(t=>t.id===e.target.value).label})}>
                {PART_TYPES_INIT.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const CONTENT_BLOCKS = [
  {id:'intro', title:'대표 인사말', body:'가방 부품 제조 전문 파트너로서 바이어와 신뢰를 쌓아가겠습니다.', status:'published'},
  {id:'business', title:'사업 영역', body:'바스켓·핸들·버클 등 플라스틱·금속 부품을 기획부터 양산까지 공급합니다.', status:'published'},
  {id:'process', title:'제조 프로세스', body:'사양 협의부터 샘플 제작, 양산, 출고까지 전 과정을 직접 관리합니다.', status:'draft'},
  {id:'history', title:'연혁', body:'2016년 설립 이후 취급 부품군을 지속적으로 확장해왔습니다.', status:'published'},
];

function ContentManageScreen({setScreen, showToast}){
  const [blocks, setBlocks] = useState(CONTENT_BLOCKS);
  const [selectedId, setSelectedId] = useState(blocks[0].id);
  const [draft, setDraft] = useState({...blocks[0]});
  const [preview, setPreview] = useState(false);

  const select = (id) => { setSelectedId(id); setDraft({...blocks.find(b=>b.id===id)}); setPreview(false); };
  const saveDraft = () => {
    setBlocks(blocks.map(b => b.id===draft.id ? {...draft, status:'draft'} : b));
    showToast('임시 저장되었습니다');
  };
  const publish = () => {
    setBlocks(blocks.map(b => b.id===draft.id ? {...draft, status:'published'} : b));
    setDraft({...draft, status:'published'});
    showToast('페이지가 게시되었습니다');
  };

  return (
    <div className="screen">
      <div style={{display:'flex', justifyContent:'flex-end', marginBottom:16}}>
        <button className="btn btn-ghost" onClick={() => setScreen('activity-log')}><Ph name="clock-counter-clockwise"/>변경 이력</button>
      </div>
      <div className="cm-grid">
        <div className="block-list">
          {blocks.map(b => (
            <button key={b.id} className={"block-row" + (selectedId===b.id?' active':'')} onClick={() => select(b.id)}>
              <Ph name="squares-four"/>
              <span style={{flex:1}}>{b.title}</span>
              <span className={"status-pill " + b.status}>{b.status==='published' ? '게시됨' : '초안'}</span>
            </button>
          ))}
        </div>
        <div className="detail-panel">
          <div className="detail-panel-head">
            <div className="detail-panel-title">{draft.title} 편집</div>
            <button className="btn btn-ghost btn-sm" onClick={() => setPreview(!preview)}><Ph name={preview?'eye-slash':'eye'}/>{preview?'편집으로':'미리보기'}</button>
          </div>
          {preview ? (
            <div className="preview-box">
              <h3>{draft.title}</h3>
              <p>{draft.body}</p>
            </div>
          ) : (
            <React.Fragment>
              <div className="form-group">
                <label className="form-label">섹션 제목</label>
                <input className="form-input" value={draft.title} onChange={e=>setDraft({...draft, title:e.target.value})}/>
              </div>
              <div className="form-group">
                <label className="form-label">본문</label>
                <textarea className="form-textarea" value={draft.body} onChange={e=>setDraft({...draft, body:e.target.value})}></textarea>
              </div>
            </React.Fragment>
          )}
          <div className="panel-actions">
            <button className="btn btn-ghost" onClick={saveDraft}><Ph name="floppy-disk"/>임시 저장</button>
            <button className="btn btn-primary" onClick={publish}><Ph name="check-circle"/>게시</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ActivityLogScreen({showToast}){
  const [restoring, setRestoring] = useState(null);
  return (
    <div className="screen">
      <table className="log-table">
        <thead>
          <tr><th>변경 항목</th><th>변경자</th><th>변경 일시</th><th>액션</th><th></th></tr>
        </thead>
        <tbody>
          {HISTORY.map(h => (
            <tr key={h.id}>
              <td>{h.item}</td>
              <td>{h.editor}</td>
              <td>{h.at}</td>
              <td>{h.action}</td>
              <td><button className="btn btn-ghost btn-sm" onClick={() => setRestoring(h)}><Ph name="arrow-counter-clockwise"/>되돌리기</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      {restoring && <ConfirmModal title="이 시점으로 되돌릴까요?" desc={`"${restoring.item}"을(를) ${restoring.at} 시점으로 복원합니다.`} onConfirm={() => { setRestoring(null); showToast('이전 버전으로 복원되었습니다'); }} onCancel={() => setRestoring(null)}/>}
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState('main');
  const [products, setProducts] = useState(PRODUCTS_INIT);
  const [types, setTypes] = useState(PART_TYPES_INIT);
  const [hotspots, setHotspots] = useState(HOTSPOTS_INIT);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const titles = {
    'main':'관리자 제품 관리',
    'part-types':'부품 유형 관리',
    'hotspot-editor':'가방-부품 핫스팟 연결 관리',
    'content-manage':'고정 페이지 콘텐츠 관리',
    'activity-log':'변경 이력',
  };

  return (
    <div className="shell">
      <Sidebar screen={screen} setScreen={setScreen} typeCount={types.length}/>
      <div className="main-wrap">
        <Topbar title={titles[screen]} showToast={showToast}/>
        <div className="content">
          {screen==='main' && <ProductScreen products={products} setProducts={setProducts} showToast={showToast}/>}
          {screen==='part-types' && <PartTypesScreen types={types} setTypes={setTypes} showToast={showToast}/>}
          {screen==='hotspot-editor' && <HotspotEditorScreen hotspots={hotspots} setHotspots={setHotspots} showToast={showToast}/>}
          {screen==='content-manage' && <ContentManageScreen setScreen={setScreen} showToast={showToast}/>}
          {screen==='activity-log' && <ActivityLogScreen showToast={showToast}/>}
        </div>
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
