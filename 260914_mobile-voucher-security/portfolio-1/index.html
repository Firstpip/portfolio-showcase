<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안심바우처 — 상품권 안심 구매 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 223°, light) ── */
:root{
  --m50:#f0f3fc; --m100:#e1e8f9; --m200:#c4d1f2; --m300:#a0b4ea; --m400:#7795e2;
  --m500:#5177d9; --m600:#2b59d1; --m700:#2349ab; --m800:#1c3986; --m900:#13285e;
  --n0:#f6f3f1; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b6ba; --n6:#909298; --n7:#797776; --n8:#53555a; --n9:#36373a; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --shadow-1: 0 1px 2px color-mix(in srgb, var(--n9) 8%, transparent);
  --shadow-2: 0 20px 40px color-mix(in srgb, var(--n9) 12%, transparent), 0 6px 12px color-mix(in srgb, var(--n9) 6%, transparent);
  --radius-card: 20px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
#app-root{width:100%;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,12px);}10%{opacity:1;transform:translate(-50%,0);}90%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,12px);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--m600) 35%, transparent);}50%{box-shadow:0 0 0 8px color-mix(in srgb, var(--m600) 0%, transparent);}}
@keyframes drawerIn{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
@keyframes shimmerSweep{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

/* ── 헤더 (search-header, sticky) ── */
.search-header{position:sticky;top:0;z-index:50;background:var(--n1);border-bottom:1px solid var(--n3);}
.header-row{display:flex;align-items:center;gap:18px;padding:14px 32px;max-width:1440px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--n10);flex-shrink:0;}
.brand-badge{width:34px;height:34px;border-radius:11px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.search-bar{flex:1;display:flex;align-items:stretch;background:var(--n1);border:1px solid var(--n3);border-radius:9999px;box-shadow:var(--shadow-1);max-width:600px;margin:0 auto;overflow:hidden;}
.search-segment{flex:1;padding:8px 20px;text-align:left;border-right:1px solid var(--n3);min-width:0;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:10px;font-weight:700;color:var(--n7);}
.segment-value{font-size:13px;color:var(--n9);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-submit{width:38px;height:38px;border-radius:50%;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;margin:5px 6px;flex-shrink:0;font-size:15px;}
.header-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-icon-btn{position:relative;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--n8);font-size:18px;}
.nav-icon-btn:hover{background:var(--n2);}
.grade-pill{display:flex;align-items:center;gap:6px;padding:7px 13px 7px 9px;border-radius:9999px;background:var(--m50);border:1px solid var(--m200);font-size:12px;font-weight:700;color:var(--m700);flex-shrink:0;}
.grade-dot{width:7px;height:7px;border-radius:50%;background:var(--m600);}

/* ── 필터 chips + 바로가기 ── */
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 32px;max-width:1440px;margin:0 auto;}
.chip{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;border:1px solid var(--n3);background:var(--n1);font-size:12.5px;font-weight:600;color:var(--n7);white-space:nowrap;flex-shrink:0;transition:all .14s ease;}
.chip:hover{border-color:var(--n5);}
.chip[data-active="true"]{background:var(--m50);border-color:var(--m600);color:var(--m700);}
.quicklinks{display:flex;gap:8px;padding:0 32px 14px;max-width:1440px;margin:0 auto;flex-wrap:wrap;}
.quicklink{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;background:var(--n2);color:var(--n8);font-size:12px;font-weight:600;}
.quicklink:hover{background:var(--n3);}

.main-wrap{max-width:1440px;margin:0 auto;padding:8px 32px 100px;}

.hero-band{display:flex;align-items:center;justify-content:space-between;gap:32px;background:linear-gradient(120deg,var(--n10),var(--n9));border-radius:28px;padding:40px 44px;margin:16px 0 32px;overflow:hidden;position:relative;}
.hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--m300);margin-bottom:14px;}
.hero-title{font-size:38px;font-weight:800;color:var(--n1);line-height:1.22;letter-spacing:-0.02em;margin:0 0 14px;}
.hero-desc{font-size:13.5px;color:var(--n5);line-height:1.6;max-width:360px;margin:0;}
.hero-art{width:150px;height:150px;flex-shrink:0;}
.hero-sweep{transform-origin:110px 110px;animation:sweepRotate 3.2s linear infinite;}
@keyframes sweepRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (max-width:720px){.hero-band{flex-direction:column;align-items:flex-start;}.hero-art{width:110px;height:110px;}}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.section-title{font-size:20px;font-weight:800;color:var(--n10);}
.section-sub{font-size:12.5px;color:var(--n7);margin-top:4px;}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px;}
.listing-card{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);overflow:hidden;transition:transform .18s ease, box-shadow .18s ease;animation:fadeInUp .5s ease both;text-align:left;width:100%;}
.listing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);}
.card-image-wrap{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--n2),var(--n1));display:flex;align-items:center;justify-content:center;}
.card-image-wrap i{font-size:40px;color:var(--n6);opacity:.7;}
.card-favorite{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb, var(--n1) 82%, transparent);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--n8);}
.card-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:9999px;font-size:10.5px;font-weight:700;}
.card-badge.best{background:var(--n10);color:var(--n1);}
.card-badge.soldout{background:var(--n9);color:var(--n1);}
.card-body{padding:14px 15px 16px;}
.card-row-1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-title{font-size:14.5px;font-weight:700;color:var(--n10);line-height:1.35;}
.card-rating{font-size:12px;color:var(--n8);flex-shrink:0;display:flex;align-items:center;gap:3px;}
.card-meta{font-size:12px;color:var(--n7);margin-top:5px;display:block;}
.card-row-4{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
.card-price{font-size:16.5px;font-weight:800;color:var(--n10);}
.price-unit{font-size:11.5px;color:var(--n7);}
.card-discount{font-size:11.5px;font-weight:700;color:var(--n7);margin-left:2px;}
.buy-btn{margin-top:11px;width:100%;padding:9px 0;border-radius:9999px;background:var(--n0);border:1px solid var(--n3);font-size:12.5px;font-weight:700;color:var(--n8);}
.listing-card:hover .buy-btn{background:var(--m600);border-color:var(--m600);color:#fff;}

/* ── 공통 카드/패널 ── */
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:24px;}
.panel + .panel{margin-top:18px;}
.lock-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;background:var(--n2);color:var(--n7);font-size:11px;font-weight:700;}
.lock-badge i{font-size:12px;}
.verify-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:var(--s1-bg);color:var(--s1-text);font-size:12.5px;font-weight:700;}
.warn-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:var(--s3-bg);color:var(--s3-text);font-size:12.5px;font-weight:700;}

/* ── 결제 화면 ── */
.pay-grid{display:grid;grid-template-columns:1.3fr .8fr;gap:22px;align-items:flex-start;}
@media (max-width:900px){.pay-grid{grid-template-columns:1fr;}}
.method-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.method-tab{padding:10px 16px;border-radius:14px;border:1px solid var(--n3);font-size:12.5px;font-weight:700;color:var(--n7);display:flex;align-items:center;gap:6px;}
.method-tab.active{border-color:var(--m600);background:var(--m50);color:var(--m700);}
.field-row{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:700;color:var(--n8);margin-bottom:6px;display:block;}
.field-input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--n3);font-size:13.5px;color:var(--n9);}
.field-input:focus{outline:none;border-color:var(--m600);}
.limit-note{font-size:11.5px;color:var(--n7);margin-top:6px;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--n8);padding:8px 0;border-bottom:1px solid var(--n3);}
.summary-row:last-of-type{border-bottom:none;font-weight:800;color:var(--n10);font-size:15px;}
.submit-btn{width:100%;padding:14px 0;border-radius:14px;background:var(--m600);color:#fff;font-size:14.5px;font-weight:800;margin-top:16px;}
.submit-btn:disabled{background:var(--n4);cursor:not-allowed;}
.wh-step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;}
.wh-dot{width:22px;height:22px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px;}
.wh-dot.done{background:var(--s1);color:#fff;}
.wh-dot.active{background:var(--m600);color:#fff;animation:pulseGlow 1.4s ease infinite;}

/* ── 마이페이지 ── */
.grade-rail{display:flex;gap:10px;margin:18px 0 22px;}
.grade-step{flex:1;padding:14px 14px 16px;border-radius:16px;border:1px solid var(--n3);background:var(--n0);}
.grade-step.current{border-color:var(--m600);background:var(--m50);}
.grade-step-name{font-size:12.5px;font-weight:800;color:var(--n9);}
.grade-step.current .grade-step-name{color:var(--m700);}
.grade-step-desc{font-size:11px;color:var(--n7);margin-top:5px;line-height:1.5;}
.otp-box{display:flex;gap:8px;margin-top:10px;}
.otp-input{width:44px;height:52px;text-align:center;border-radius:12px;border:1px solid var(--n3);font-size:18px;font-weight:700;}
.otp-input:focus{outline:none;border-color:var(--m600);}
.perm-table{width:100%;border-collapse:collapse;margin-top:8px;}
.perm-table th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--n3);}
.perm-table td{padding:10px 10px;font-size:12.5px;color:var(--n9);border-bottom:1px solid var(--n2);}
.perm-yes{color:var(--s1-text);font-weight:700;}
.perm-no{color:var(--n6);}

/* ── 재고관리(관리자) ── */
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.stock-table{width:100%;border-collapse:collapse;}
.stock-table th{text-align:left;font-size:11px;color:var(--n7);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--n3);text-transform:uppercase;letter-spacing:.03em;}
.stock-table td{padding:12px 12px;font-size:13px;color:var(--n9);border-bottom:1px solid var(--n2);vertical-align:middle;}
.stock-table tr:hover td{background:var(--n0);}
.masked-code{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.04em;color:var(--n7);}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
.status-chip.ok{background:var(--n2);color:var(--n7);}
.status-chip.low{background:var(--s3-bg);color:var(--s3-text);}
.status-chip.soldout{background:var(--n9);color:var(--n1);}
.icon-btn-sm{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--n7);}
.icon-btn-sm:hover{background:var(--n2);}
.primary-btn{padding:10px 18px;border-radius:9999px;background:var(--m600);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

/* ── 주문내역 ── */
.order-row{cursor:pointer;}
.pay-icon{width:26px;height:26px;border-radius:8px;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-right:7px;}

/* ── 모달/드로어/토스트 ── */
.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 46%, transparent);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--n1);border-radius:22px;padding:26px;width:420px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-2);}
.modal-title{font-size:16.5px;font-weight:800;color:var(--n10);margin-bottom:14px;}
.modal-close{position:absolute;}
.drawer-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 40%, transparent);z-index:90;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--n1);z-index:95;box-shadow:var(--shadow-2);overflow-y:auto;animation:drawerIn .28s ease both;}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--n3);}
.drawer-body{padding:22px;}
.toast-stack{position:fixed;bottom:28px;left:50%;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{transform:translateX(-50%);padding:12px 20px;border-radius:14px;background:var(--n10);color:var(--n0);font-size:13px;font-weight:600;box-shadow:var(--shadow-2);animation:toastPop 2.6s ease forwards;white-space:nowrap;}
.toast.success{background:var(--s1);}
.toast.error{background:var(--s2);}

.footer{border-top:1px solid var(--n3);padding:36px 32px;background:var(--n1);}
.footer-cols{max-width:1440px;margin:0 auto;display:flex;gap:60px;flex-wrap:wrap;}
.footer-col h4{font-size:12px;color:var(--n9);margin:0 0 10px;}
.footer-col a{display:block;font-size:12px;color:var(--n7);margin-bottom:7px;}
.footer-bottom{max-width:1440px;margin:18px auto 0;font-size:11.5px;color:var(--n6);border-top:1px solid var(--n3);padding-top:16px;}
</style>
</head>

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, type='default') => {
    const id = Date.now()+Math.random();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 2600);
  };
  return [toasts, push];
}

function ToastStack({toasts}){
  return <div className="toast-stack">
    {toasts.map(t => <div key={t.id} className={"toast "+(t.type||'')}>{t.msg}</div>)}
  </div>;
}

  const addStock = () => {
    if(!qty){ push('추가할 수량을 입력해주세요', 'error'); return; }
    setStock(s => s.map(it => it.id===1 ? {...it, qty: it.qty+parseInt(qty,10)} : it));
    setShowAdd(false); setQty('');
    push('재고가 암호화 저장되었습니다', 'success');
  };
  return <div className="main-wrap">
    <div className="admin-topbar">
      <div>
        <div className="section-title">상품권 재고 암호화 관리</div>
        <div className="section-sub">저장된 상품권 번호는 마스킹된 형태로만 표시됩니다</div>
      </div>
      <button className="primary-btn" onClick={()=>setShowAdd(true)}><Icon name="plus"/>재고 추가</button>
    </div>
    <div className="panel" style={{padding:0, overflow:'hidden'}}>
      <table className="stock-table">
        <thead><tr><th>상품권</th><th>재고 수량</th><th>암호화 번호</th><th>상태</th><th></th></tr></thead>
        <tbody>
          {stock.map(it => (
            <tr key={it.id}>
              <td>{it.name}</td>
              <td>{it.qty.toLocaleString()}개</td>
              <td><span className="masked-code"><Icon name="lock-simple" style={{marginRight:'5px'}}/>{it.code}</span></td>
              <td>
                {it.qty===0 ? <span className="status-chip soldout">품절</span> :
                 it.qty<it.threshold ? <span className="status-chip low">임계 수량 미만</span> :
                 <span className="status-chip ok">정상</span>}
              </td>
              <td><button className="icon-btn-sm" onClick={()=>push(it.name+' 상세 내역을 확인합니다')}><Icon name="dots-three"/></button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    {showAdd && <div className="overlay" onClick={()=>setShowAdd(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">재고 추가</div>
        <div className="lock-badge" style={{marginBottom:'14px'}}><Icon name="lock-key"/>등록되는 상품권 번호는 즉시 암호화되어 저장됩니다</div>
        <div className="field-row">
          <label className="field-label">추가 수량</label>
          <input className="field-input" type="number" value={qty} onChange={e=>setQty(e.target.value)} placeholder="예: 50"/>
        </div>
        <button className="submit-btn" onClick={addStock}>암호화 저장</button>
      </div>
    </div>}
  </div>;
}

function OrdersScreen({push}){
  const [filter, setFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  const statuses = ['all','결제완료','입금대기','승인대기'];
  const list = filter==='all' ? ORDERS : ORDERS.filter(o=>o.status===filter);
  return <div className="main-wrap">
    <div className="section-head">
      <div>
        <div className="section-title">주문내역</div>
        <div className="section-sub">결제 상태와 웹훅 입금 확인 이력을 조회합니다</div>
      </div>
    </div>
    <div className="filter-chips" style={{padding:'0 0 16px', maxWidth:'none', margin:0}}>
      {statuses.map(s => (
        <button key={s} className="chip" data-active={filter===s} onClick={()=>setFilter(s)}>{s==='all'?'전체':s}</button>
      ))}
    </div>
    <div className="panel" style={{padding:0, overflow:'hidden'}}>
      <table className="stock-table">
        <thead><tr><th>주문번호</th><th>상품권</th><th>결제수단</th><th>금액</th><th>상태</th></tr></thead>
        <tbody>
          {list.map(o => (
            <tr key={o.id} className="order-row" onClick={()=>setSelected(o)}>
              <td>{o.id}</td>
              <td>{o.item}</td>
              <td><span className="pay-icon"><Icon name={o.methodIcon}/></span>{o.method}</td>
              <td>{o.amount.toLocaleString()}원</td>
              <td>
                <span className={"status-chip "+(o.status==='결제완료'?'ok':o.status==='입금대기'?'low':'low')}>{o.status}</span>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    {selected && <React.Fragment>
      <div className="drawer-overlay" onClick={()=>setSelected(null)}></div>
      <aside className="drawer">
        <div className="drawer-head"><strong>주문 상세</strong><button className="icon-btn-sm" onClick={()=>setSelected(null)}><Icon name="x"/></button></div>
        <div className="drawer-body">
          <div style={{fontSize:'15px', fontWeight:700, marginBottom:'4px'}}>{selected.item}</div>
          <div style={{fontSize:'12px', color:'var(--n7)', marginBottom:'18px'}}>{selected.id} · {selected.amount.toLocaleString()}원</div>
          <div className="wh-step"><span className="wh-dot done"><Icon name="check"/></span>주문 접수</div>
          <div className="wh-step"><span className={"wh-dot "+(selected.status==='결제완료'?'done':'active')}>{selected.status==='결제완료'?<Icon name="check"/>:2}</span>웹훅 기반 입금·결제 확인</div>
          <div className="wh-step"><span className={"wh-dot "+(selected.status==='결제완료'?'done':'')}>{selected.status==='결제완료'?<Icon name="check"/>:3}</span>상품권 발급 완료</div>
        </div>
      </aside>
    </React.Fragment>}
  </div>;
}

function App(){
  const [screen, setScreen] = useState('main');
  const [cat, setCat] = useState('all');
  const [grade, setGrade] = useState('승인회원');
  const [openVoucher, setOpenVoucher] = useState(null);
  const [paidVoucher, setPaidVoucher] = useState(VOUCHERS[0]);
  const [toasts, push] = useToasts();

  const go = (id) => { setScreen(id); setOpenVoucher(null); window.scrollTo(0,0); };
  const buy = (v) => { setPaidVoucher(v); setOpenVoucher(null); go('payment'); };

  return <React.Fragment>
    <Header screen={screen} go={go} grade={grade} cat={cat} setCat={setCat}/>
    {screen==='main' && <MainScreen cat={cat} onOpen={setOpenVoucher}/>}
    {screen==='payment' && <PaymentScreen voucher={paidVoucher} push={push}/>}
    {screen==='membership' && <MembershipScreen grade={grade} setGrade={setGrade} push={push}/>}
    {screen==='inventory' && <InventoryScreen push={push}/>}
    {screen==='orders' && <OrdersScreen push={push}/>}
    <QuickView v={openVoucher} onClose={()=>setOpenVoucher(null)} onBuy={buy}/>
    <ToastStack toasts={toasts}/>
    <footer className="footer">
      <div className="footer-cols">
        <div className="footer-col">
          <h4>안심바우처</h4>
          <a>서비스 소개</a><a>이용약관</a><a>개인정보처리방침</a>
        </div>
        <div className="footer-col">
          <h4>고객지원</h4>
          <a>자주 묻는 질문</a><a>1:1 문의</a>
        </div>
        <div className="footer-col">
          <h4>보안</h4>
          <a>보안 정책 안내</a><a>결제 안전 가이드</a>
        </div>
      </div>
      <div className="footer-bottom">© 2026 안심바우처 — 자체 개발 프로젝트 (데모)</div>
    </footer>
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
