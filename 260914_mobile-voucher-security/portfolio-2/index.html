/* refero 시드 출처 기록(참고용, 실제 팔레트는 보안 관제 콘솔 컨셉으로 재해석 — 컬러 역할 규칙 0.955 우선): Calendly.com primary #006bff / accent #e55cff */
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 28°, dark) ── */
:root{
  --m50:#fbf5ef; --m100:#f7eadf; --m200:#efd5bf; --m300:#e6bc98; --m400:#dba06c;
  --m500:#d18543; --m600:#c76a1a; --m700:#a35715; --m800:#7f4411; --m900:#5a300c;
  --n0:#201f1e; --n1:#3a3836; --n2:#5a5653; --n3:#7a7571; --n4:#989490;
  --n5:#bab7b5; --n6:#d7d6d5; --n7:#e6e5e5; --n8:#f0f0ef; --n9:#eef2f7; --n10:#fdfcfc;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --shadow-1: 0 1px 2px color-mix(in srgb, var(--n0) 40%, transparent);
  --shadow-2: 0 20px 40px color-mix(in srgb, var(--n0) 55%, transparent), 0 6px 14px color-mix(in srgb, var(--n0) 35%, transparent);
  --radius-card: 10px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n8);-webkit-font-smoothing:antialiased;}
#app-root{width:100%;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
table{border-collapse:collapse;width:100%;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--n3);border-radius:8px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes slideInPanel{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,10px);}10%{opacity:1;transform:translate(-50%,0);}90%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,10px);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes sweepLine{0%{stroke-dashoffset:240;}100%{stroke-dashoffset:0;}}

.shell{display:flex;width:100%;min-height:100vh;}

/* ── 사이드바 (stripe-multipane 시그니처 1) ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n2);display:flex;flex-direction:column;z-index:20;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid var(--n2);background:linear-gradient(135deg, color-mix(in srgb, var(--m900) 55%, var(--n0)), var(--n0));}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-text{font-size:14px;font-weight:800;color:var(--n9);}
.env-select{margin:12px 16px 4px;padding:8px 10px;border:1px solid var(--n2);border-radius:8px;font-size:11px;color:var(--n5);display:flex;align-items:center;justify-content:space-between;font-weight:600;background:var(--n0);}
.env-dot{width:6px;height:6px;border-radius:50%;background:var(--s1);margin-right:6px;animation:pulseDot 1.8s ease infinite;display:inline-block;}
.sidebar-section{padding:14px 12px 2px;}
.sidebar-section-title{font-size:10px;font-weight:700;color:var(--n4);text-transform:uppercase;letter-spacing:.05em;padding:0 10px 8px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--n6);margin-bottom:2px;width:100%;text-align:left;}
.sidebar-link svg{width:15px;height:15px;color:var(--n4);flex-shrink:0;}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:color-mix(in srgb, var(--m600) 18%, transparent);color:var(--m300);}
.sidebar-link.active svg{color:var(--m400);}
.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--n2);display:flex;align-items:center;gap:9px;}
.avatar-mono{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* ── 메인 ── */
.main{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:26px 30px 70px;}
.page-header{margin-bottom:18px;}
.page-title-row{display:flex;justify-content:space-between;align-items:center;}
.page-title{font-size:19px;font-weight:800;color:var(--n9);margin:0;}
.page-actions{display:flex;gap:8px;}
.btn-secondary{padding:8px 14px;border-radius:8px;border:1px solid var(--n2);color:var(--n6);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.btn-secondary:hover{background:var(--n1);}
.btn-primary{padding:8px 16px;border-radius:8px;background:var(--m600);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.page-meta{font-size:11.5px;color:var(--n4);margin-top:5px;}

.radar-hero{display:flex;align-items:center;justify-content:space-between;gap:28px;background:linear-gradient(120deg, var(--n1), var(--n0));border:1px solid var(--n2);border-radius:var(--radius-card);padding:26px 30px;margin-bottom:20px;overflow:hidden;}
.radar-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--m400);margin-bottom:10px;}
.radar-title{font-size:21px;font-weight:800;color:var(--n9);line-height:1.35;margin-bottom:10px;}
.radar-desc{font-size:12px;color:var(--n5);line-height:1.6;max-width:320px;}
.radar-svg{width:150px;height:150px;flex-shrink:0;}
.radar-rotor{transform-origin:110px 110px;animation:radarSpin 2.6s linear infinite;}
.radar-blip{animation:pulseDot 1.6s ease infinite;}
@keyframes radarSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (max-width:820px){.radar-hero{flex-direction:column;align-items:flex-start;}}

/* ── KPI 카드 행 (시그니처 2) ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0 22px;}
.stat-card{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:16px 18px;animation:fadeInUp .4s ease both;}
.stat-label{font-size:11px;color:var(--n4);font-weight:600;}
.stat-value{font-size:29px;font-weight:800;color:var(--n9);margin-top:6px;}
.stat-delta{font-size:11.5px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
.stat-delta.positive{color:var(--s1-text);}
.stat-delta.negative{color:var(--s2-text);}
.stat-sparkline{margin-top:8px;width:100%;height:28px;display:block;}

/* ── 탭 바 + 테이블 (시그니처 3) ── */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--n2);margin-bottom:0;}
.tab{padding:10px 4px;margin-right:20px;font-size:12.5px;font-weight:700;color:var(--n5);border-bottom:2px solid transparent;}
.tab.active{color:var(--m300);border-bottom-color:var(--m600);}
.data-toolbar{display:flex;gap:8px;align-items:center;padding:12px 0;}
.search-input{flex:1;max-width:280px;padding:8px 12px;border-radius:8px;border:1px solid var(--n2);background:var(--n0);color:var(--n7);font-size:12.5px;}
.filter-chip{padding:7px 13px;border-radius:8px;border:1px solid var(--n2);color:var(--n5);font-size:11.5px;font-weight:600;}
.filter-chip.active{border-color:var(--m600);color:var(--m300);background:color-mix(in srgb, var(--m600) 14%, transparent);}
.export-btn{margin-left:auto;padding:8px 13px;border-radius:8px;border:1px solid var(--n2);color:var(--n5);font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.data-table-wrap{border:1px solid var(--n2);border-radius:var(--radius-card);overflow:hidden;}
.data-table th{text-align:left;font-size:10.5px;color:var(--n4);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;background:var(--n1);border-bottom:1px solid var(--n2);}
.data-table td{padding:11px 14px;font-size:12.5px;color:var(--n7);border-bottom:1px solid var(--n1);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover td{background:var(--n1);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:700;}
.badge.ok{background:var(--s1-bg);color:var(--s1-text);}
.badge.danger{background:var(--s2-bg);color:var(--s2-text);}
.badge.neutral{background:var(--n2);color:var(--n5);}

/* ── 마스터-디테일 (composition) ── */
.md-split{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:flex-start;}
@media (max-width:1000px){.md-split{grid-template-columns:1fr;}}
.list-rail{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);overflow:hidden;}
.list-item{width:100%;text-align:left;padding:13px 15px;border-bottom:1px solid var(--n0);display:flex;flex-direction:column;gap:5px;}
.list-item:last-child{border-bottom:none;}
.list-item.active{background:color-mix(in srgb, var(--m600) 15%, transparent);border-left:2px solid var(--m600);}
.list-item-title{font-size:12.5px;font-weight:700;color:var(--n8);}
.list-item-meta{font-size:11px;color:var(--n4);}
.detail-panel{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:20px;animation:slideInPanel .25s ease both;}
.detail-title{font-size:15px;font-weight:800;color:var(--n9);margin-bottom:4px;}
.detail-meta{font-size:11.5px;color:var(--n4);margin-bottom:16px;}
.kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--n0);font-size:12.5px;}
.kv-row span:first-child{color:var(--n4);}
.kv-row span:last-child{color:var(--n7);font-weight:600;}

.card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.panel{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:20px;}
.field-row{margin-bottom:13px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--n5);margin-bottom:6px;display:block;}
.field-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--n2);background:var(--n0);color:var(--n7);font-size:12.5px;}
.toggle{width:38px;height:22px;border-radius:9999px;background:var(--n2);position:relative;display:inline-block;flex-shrink:0;}
.toggle.on{background:var(--m600);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--n8);transition:transform .16s ease;}
.toggle.on .toggle-knob{transform:translateX(16px);}

.icon-btn-sm{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--n5);}
.icon-btn-sm:hover{background:var(--n2);}

.toast-stack{position:fixed;bottom:26px;left:calc(240px + (100% - 240px)/2);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{padding:12px 20px;border-radius:10px;background:var(--n9);color:var(--n0);font-size:12.5px;font-weight:700;box-shadow:var(--shadow-2);animation:toastPop 2.6s ease forwards;white-space:nowrap;}
.toast.success{background:var(--s1);color:var(--n0);}
.toast.error{background:var(--s2);color:var(--n0);}

.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n0) 62%, transparent);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--n1);border:1px solid var(--n2);border-radius:16px;padding:24px;width:400px;max-width:92vw;box-shadow:var(--shadow-2);}
.modal-title{font-size:15px;font-weight:800;color:var(--n9);margin-bottom:14px;}
</style>

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, type='default') => {
    const id = Date.now()+Math.random();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 2600);
  };
  return [toasts, push];
}
function ToastStack({toasts}){
  return <div className="toast-stack">{toasts.map(t => <div key={t.id} className={"toast "+(t.type||'')}>{t.msg}</div>)}</div>;
}

function Sparkline({data, color}){
  const pts = data.map((v,i)=>`${(i/(data.length-1))*100},${28-(v/Math.max(...data))*24}`).join(' ');
  return <svg className="stat-sparkline" viewBox="0 0 100 28" preserveAspectRatio="none">
    <polyline points={pts} fill="none" stroke={"var(--"+color+")"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
}

        ))}

function MembersScreen({push}){
  const [members, setMembers] = useState(MEMBERS);

    setMembers(ms => ms.map(m => m.id===selected.id ? {...m, status:'-', grade: approved? m.requested : m.grade, requested:null,
      history:[...m.history, {at:'2026-09-14', from:m.grade, to: approved? m.requested : m.grade, by:'admin01(현재)'}]} : m));
    push(approved ? '등급 승인이 완료되었습니다' : '등급 변경 요청을 반려했습니다', approved?'success':'error');
  };
  const cur = members.find(m=>m.id===selected.id) || members[0];
  return <div>
    <PageHeader title="회원등급 승인·감사로그 관리" meta="등급 변경 이력은 append-only 감사로그로 기록되며 수정·삭제할 수 없습니다"/>

      <div className="list-rail">
        {members.map(m => (
          <button key={m.id} className={"list-item"+(selected.id===m.id?' active':'')} onClick={()=>setSelected(m)}>
            <div style={{display:'flex', justifyContent:'space-between', width:'100%'}}>
              <span className="list-item-title">{m.name}</span>
              {m.status==='대기' && <span className="badge neutral">대기</span>}
            </div>
            <span className="list-item-meta">{m.grade}{m.requested ? ' → '+m.requested : ''}</span>

      </div>
      <div className="detail-panel">
        <div className="detail-title">{cur.name}</div>
        <div className="detail-meta">현재 등급: {cur.grade}</div>
        {cur.requested && <div className="panel" style={{marginBottom:'16px', background:'var(--n0)'}}>
          <div style={{fontSize:'12.5px', color:'var(--n6)', marginBottom:'10px'}}>{cur.grade} → {cur.requested} 승인 요청</div>
          <div style={{display:'flex', gap:'8px'}}>
            <button className="btn-primary" onClick={()=>approve(true)}>승인</button>
            <button className="btn-secondary" onClick={()=>approve(false)}>반려</button>
          </div>
        </div>}
        <h4 style={{fontSize:'12px', color:'var(--n5)', margin:'4px 0 10px'}}>등급 변경 감사로그</h4>

}
