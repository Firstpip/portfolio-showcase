<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페이스라운지 — 공간 대여 예약 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:16px; --radius-btn:8px; --radius-pill:9999px;
  --shadow-1: 0 1px 2px color-mix(in srgb, var(--m900) 6%, transparent);
  --shadow-2: 0 4px 5px color-mix(in srgb, var(--m900) 4%, transparent), 0 8px 15px color-mix(in srgb, var(--m900) 5%, transparent);
  --shadow-3: 0 4px 5px color-mix(in srgb, var(--m900) 4%, transparent), 0 30px 50px color-mix(in srgb, var(--m900) 10%, transparent);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;
}
#root{width:100%;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
img{display:block;max-width:100%;}
.icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}

/* ── 스크린 전환 ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardEnter{from{opacity:0;transform:translateY(20px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb, var(--m600) 45%, transparent);}50%{opacity:.7;box-shadow:0 0 0 6px transparent;}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) translateX(-50%);}to{opacity:1;transform:translateY(0) translateX(-50%);}}
@keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes countPop{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
.screen-enter{animation:fadeInUp .38s ease both;}
.card-enter{animation:cardEnter .5s cubic-bezier(.2,.8,.2,1) both;}

/* ── 검색 헤더 (archetype 시그니처) ── */
.search-header{position:sticky;top:0;z-index:40;background:var(--n1);border-bottom:1px solid var(--n3);}
.header-row{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:14px 24px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--n9);white-space:nowrap;}
.brand .icon{color:var(--m600);}
.search-bar{flex:1;display:flex;align-items:center;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-pill);box-shadow:var(--shadow-1);overflow:hidden;max-width:640px;}
.search-segment{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px 20px;text-align:left;transition:background .15s;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:11px;font-weight:700;color:var(--n7);}
.segment-value{font-size:13px;font-weight:600;color:var(--n9);}
.search-divider{width:1px;height:26px;background:var(--n3);}
.search-submit{width:40px;height:40px;margin-right:6px;border-radius:50%;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.search-submit:hover{background:var(--m700);}
.header-nav{display:flex;align-items:center;gap:8px;}
.nav-pill{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;color:var(--n8);transition:background .15s,color .15s;}
.nav-pill:hover{background:var(--n2);}
.nav-pill.active{background:var(--m50);color:var(--m700);}
.filter-chips{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:0 24px 14px;overflow-x:auto;}
.chip{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-pill);border:1px solid var(--n3);background:var(--n1);font-size:13px;font-weight:600;color:var(--n7);white-space:nowrap;flex-shrink:0;transition:.15s;}
.chip:hover{border-color:var(--n5);}
.chip.active{background:var(--n9);color:var(--n1);border-color:var(--n9);}

/* ── 퀵 내비 (화면 전환 고정 바) ── */
.quick-nav{background:var(--n1);border-bottom:1px solid var(--n3);}
.quick-nav-inner{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:10px 24px;overflow-x:auto;}
.quick-pill{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;color:var(--n7);background:var(--n0);border:1px solid var(--n3);white-space:nowrap;flex-shrink:0;transition:.15s;}
.quick-pill:hover{border-color:var(--n5);color:var(--n9);}
.quick-pill.active{background:var(--m600);border-color:var(--m600);color:#fff;}

/* ── 히어로 ── */
.hero-band{position:relative;overflow:hidden;background:linear-gradient(135deg, var(--m600), var(--m900));padding:64px 24px 84px;}
.hero-inner{max-width:1240px;margin:0 auto;position:relative;z-index:1;}
.hero-inner h1{font-size:52px;font-weight:800;color:#fff;letter-spacing:-0.02em;line-height:1.18;margin:0 0 16px;max-width:640px;}
.hero-inner p{font-size:17px;color:color-mix(in srgb, #fff 82%, transparent);margin:0 0 28px;max-width:520px;line-height:1.6;}
.hero-wave{position:absolute;right:-40px;bottom:-30px;width:520px;height:260px;opacity:.5;pointer-events:none;}
.hero-cta{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:var(--radius-pill);background:#fff;color:var(--m700);font-weight:800;font-size:15px;}
.hero-cta:hover{background:var(--n1);}

/* ── 메인 ── */
.main{width:100%;max-width:1240px;margin:0 auto;padding:28px 24px 80px;}
.section-title{font-size:22px;font-weight:800;color:var(--n9);margin:0 0 4px;}
.section-sub{font-size:14px;color:var(--n7);margin:0 0 20px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px;margin-bottom:56px;}
.listing-card{background:var(--n1);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-2);border:1px solid var(--n2);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease;}
.listing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-3);}
.card-image-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--n2);}
.card-image{width:100%;height:100%;object-fit:cover;filter:saturate(.72) brightness(.92);}
.card-image-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg, color-mix(in srgb, var(--m700) 38%, transparent) 0%, transparent 55%), linear-gradient(0deg, color-mix(in srgb, var(--n10) 30%, transparent), transparent 45%);pointer-events:none;}
.card-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb, var(--n1) 88%, transparent);display:flex;align-items:center;justify-content:center;color:var(--n8);backdrop-filter:blur(4px);}
.card-favorite.active{color:var(--s2);}
.card-badge{position:absolute;top:10px;left:10px;background:color-mix(in srgb, var(--n10) 62%, transparent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);}
.card-body{padding:14px 16px 16px;}
.card-row-1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-size:15px;font-weight:700;color:var(--n9);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-rating{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--n8);flex-shrink:0;}
.card-rating .icon{color:var(--s3);font-size:14px;width:14px;height:14px;}
.card-meta{display:block;font-size:13px;color:var(--n7);margin-top:3px;}
.card-row-4{display:flex;align-items:baseline;gap:4px;margin-top:10px;}
.card-price{font-size:16px;font-weight:800;color:var(--n9);}
.price-unit{font-size:12px;color:var(--n7);}

/* ── 기능 쇼케이스 ── */
.feature-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px;}
.feature-card{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-1);}
.feature-icon-box{width:44px;height:44px;border-radius:12px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:22px;}
.feature-card h3{margin:0;font-size:16px;font-weight:800;color:var(--n9);}
.feature-card p{margin:0;font-size:13px;color:var(--n7);line-height:1.55;flex:1;}
.feature-cta{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-pill);background:var(--m600);color:#fff;font-size:13px;font-weight:700;transition:background .15s;}
.feature-cta:hover{background:var(--m700);}

.footer{background:var(--n1);border-top:1px solid var(--n3);padding:44px 24px 28px;margin-top:20px;}
.footer-cols{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;}
.footer-col h4{font-size:12px;font-weight:700;color:var(--n7);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;}
.footer-col a{display:block;font-size:13px;color:var(--n8);margin-bottom:8px;}
.footer-bottom{max-width:1240px;margin:32px auto 0;font-size:12px;color:var(--n6);padding-top:20px;border-top:1px solid var(--n3);}

/* ── quick-view drawer ── */
.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 42%, transparent);z-index:60;display:flex;justify-content:flex-end;}
.drawer{width:min(420px,92vw);height:100%;background:var(--n1);box-shadow:var(--shadow-3);overflow-y:auto;animation:drawerIn .32s cubic-bezier(.2,.8,.2,1) both;}
.drawer-head{position:relative;}
.drawer-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb, var(--n10) 55%, transparent);color:#fff;display:flex;align-items:center;justify-content:center;}
.drawer-body{padding:22px;}
.drawer-body h2{font-size:20px;font-weight:800;margin:0 0 6px;}
.drawer-meta{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px;}
.meta-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);background:var(--n2);font-size:12px;font-weight:600;color:var(--n8);}
.slot-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;}
.slot-mini{padding:8px 4px;text-align:center;border-radius:8px;background:var(--n2);font-size:12px;font-weight:700;color:var(--n7);}
.slot-mini.open{background:var(--m50);color:var(--m700);}
.primary-btn{width:100%;padding:14px;border-radius:var(--radius-btn);background:var(--m600);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
.primary-btn:hover{background:var(--m700);}
.primary-btn:disabled{background:var(--n4);color:var(--n7);cursor:not-allowed;}
.ghost-btn{padding:12px 18px;border-radius:var(--radius-btn);border:1px solid var(--n4);color:var(--n8);font-weight:700;font-size:14px;background:var(--n1);transition:.15s;}
.ghost-btn:hover{border-color:var(--n6);}

/* ── 서브 화면 공통 ── */
.sub-header{background:var(--n1);border-bottom:1px solid var(--n3);}
.sub-header-row{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px 24px;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--n8);padding:8px 12px;border-radius:8px;}
.back-btn:hover{background:var(--n2);}
.sub-title{font-size:16px;font-weight:800;}
.sub-main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}

/* ── 예약 캘린더 ── */
.booking-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
@media (max-width:860px){.booking-grid{grid-template-columns:1fr;}}
.panel{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-card);box-shadow:var(--shadow-1);padding:22px;margin-bottom:20px;}
.panel h3{margin:0 0 4px;font-size:15px;font-weight:800;}
.panel .panel-sub{font-size:12px;color:var(--n7);margin:0 0 16px;}
.date-strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;}
.date-chip{flex-shrink:0;width:64px;padding:10px 0;border-radius:12px;background:var(--n2);text-align:center;font-size:12px;font-weight:700;color:var(--n8);border:2px solid transparent;}
.date-chip .dow{display:block;font-size:11px;color:var(--n6);margin-bottom:4px;font-weight:600;}
.date-chip.selected{background:var(--m50);border-color:var(--m600);color:var(--m700);}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.slot{position:relative;padding:12px 6px;border-radius:10px;background:var(--n2);text-align:center;font-size:13px;font-weight:700;color:var(--n8);border:2px solid transparent;transition:.15s;}
.slot:hover:not(.locked){background:var(--n3);}
.slot.selected{background:var(--m600);color:#fff;}
.slot.locked{color:var(--n5);cursor:not-allowed;}
.slot.locked::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--s2);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--s1);animation:pulseDot 1.6s infinite;display:inline-block;margin-right:6px;}
.stepper{display:flex;align-items:center;gap:14px;}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n9);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.stepper button:hover{background:var(--n3);}
.stepper button:disabled{opacity:.4;cursor:not-allowed;}
.stepper .count{min-width:28px;text-align:center;font-weight:800;font-size:15px;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--n7);padding:7px 0;}
.summary-row.total{border-top:1px solid var(--n3);margin-top:8px;padding-top:14px;font-size:16px;font-weight:800;color:var(--n9);}
.summary-row.total span:last-child{animation:countPop .3s ease;}

/* ── 결제 ── */
.pay-tabs{display:flex;gap:8px;margin-bottom:18px;}
.pay-tab{flex:1;padding:14px;border-radius:12px;border:2px solid var(--n3);text-align:center;font-weight:700;font-size:14px;color:var(--n7);background:var(--n1);}
.pay-tab.active{border-color:var(--m600);color:var(--m700);background:var(--m50);}
.refund-sim{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.sim-btn{padding:9px 14px;border-radius:var(--radius-pill);border:1px solid var(--n3);font-size:12px;font-weight:700;color:var(--n7);}
.sim-btn.active{background:var(--n9);color:var(--n1);border-color:var(--n9);}
.result-box{border-radius:12px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.result-box.full{background:var(--s1-bg);color:var(--s1-text);}
.result-box.partial{background:var(--s3-bg);color:var(--s3-text);}
.result-box.none{background:var(--s2-bg);color:var(--s2-text);}
.result-box b{font-size:20px;}

/* ── 알림 로그 ── */
.log-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--n1);border:1px solid var(--n2);margin-bottom:10px;animation:fadeInUp .4s ease both;}
.channel-badge{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);flex-shrink:0;}
.channel-badge.alim{background:var(--m50);color:var(--m700);}
.channel-badge.sms{background:var(--n2);color:var(--n8);}
.status-badge{margin-left:auto;font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);flex-shrink:0;}
.status-badge.success{background:var(--s1-bg);color:var(--s1-text);}
.status-badge.retry{background:var(--s3-bg);color:var(--s3-text);}
.status-badge.fail{background:var(--s2-bg);color:var(--s2-text);}
.log-title{font-weight:700;font-size:13px;color:var(--n9);}
.log-meta{font-size:12px;color:var(--n7);}

/* ── 마이페이지 ── */
.reserve-card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--radius-card);background:var(--n1);border:1px solid var(--n2);margin-bottom:14px;}
.reserve-info h4{margin:0 0 4px;font-size:14px;font-weight:800;}
.reserve-info span{font-size:12px;color:var(--n7);}
.danger-btn{padding:9px 16px;border-radius:8px;border:1px solid var(--s2);color:var(--s2);font-weight:700;font-size:13px;}
.danger-btn:hover{background:var(--s2-bg);}

/* ── 토스트 / 모달 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:#fff;padding:13px 22px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;z-index:100;display:flex;align-items:center;gap:8px;animation:toastIn .28s ease both;box-shadow:var(--shadow-3);}
.toast .icon{color:var(--s1);}
.toast.error .icon{color:var(--s2);}
.modal-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 46%, transparent);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--n1);border-radius:20px;padding:28px;max-width:400px;width:100%;box-shadow:var(--shadow-3);animation:cardEnter .28s ease both;}
.modal-box h3{margin:0 0 10px;font-size:17px;font-weight:800;}
.modal-box p{margin:0 0 20px;font-size:13px;color:var(--n7);line-height:1.6;}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:14px;}
.modal-actions .confirm{background:var(--s2);color:#fff;}
.modal-actions .cancel{background:var(--n2);color:var(--n8);}

.empty-wrap{text-align:center;padding:60px 20px;color:var(--n6);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react,env">
const { useState, useMemo, useEffect, useRef } = React;

const BRANCHES = ['강남점','홍대점','건대점','신촌점','잠실점','수원점','인천점'];
const CATS = [
  { key:'dance', label:'댄스', icon:'ti-run' },
  { key:'vocal', label:'보컬', icon:'ti-microphone-2' },
  { key:'inst', label:'악기', icon:'ti-piano' },
  { key:'act', label:'연기', icon:'ti-drama-masks' },
  { key:'musical', label:'뮤지컬', icon:'ti-stage' },
];

const HOURS = Array.from({length:12}, (_,i)=> 10+i); // 10~21시
const DATES = Array.from({length:7}, (_,i)=>{
  const d = new Date(2026,8,15+i);
  const dow = ['일','월','화','수','목','금','토'][d.getDay()];
  return { key:i, label:`${d.getMonth()+1}/${d.getDate()}`, dow };
});

function money(n){ return n.toLocaleString('ko-KR') + '원'; }

function computeRefund(hoursBeforeUse){
  if (hoursBeforeUse >= 2) return { pct:100, tier:'full', label:'전액 환불' };
  if (hoursBeforeUse >= 0.5) return { pct:50, tier:'partial', label:'50% 차등 환불' };
  return { pct:0, tier:'none', label:'환불 불가' };
}

function Toast({ toast }){
  if (!toast) return null;
  return (
    <div className={`toast ${toast.type === 'error' ? 'error' : ''}`}>
      <i className={`icon ti ${toast.type === 'error' ? 'ti-alert-circle' : 'ti-circle-check'}`}></i>
      {toast.msg}
    </div>
  );
}

function BookingCalendarScreen({ room, setView, notify, lockedSlots, lockSlot }){
  const [dateIdx, setDateIdx] = useState(0);
  const [selected, setSelected] = useState([]);
  const [people, setPeople] = useState(room ? Math.min(2, room.capacity) : 2);
  const base = room || ROOMS[0];
  const baseCapacity = base.capacity;
  const extra = Math.max(0, people - baseCapacity);
  const surcharge = extra * 3000;
  const hourly = base.price + surcharge;
  const total = hourly * selected.length;

  const dayKey = `${base.id}-${dateIdx}`;
  const locked = lockedSlots[dayKey] || [];

  function toggleSlot(h){
    if (locked.includes(h)) {
      notify('이미 예약된 슬롯입니다. 다른 시간을 선택해 주세요.', 'error');
      return;
    }
    setSelected(prev => prev.includes(h) ? prev.filter(x=>x!==h) : [...prev, h].sort((a,b)=>a-b));
  }

  return (
    <React.Fragment>
      <SubHeader title={`${base.name} · 실시간 예약 캘린더`} onBack={()=>setView('main')} />
      <div className="sub-main screen-enter booking-grid">
        <div>
          <div className="panel">
            <h3>날짜 선택</h3>
            <p className="panel-sub">7일 이내 원하는 날짜를 선택합니다.</p>
            <div className="date-strip">
              {DATES.map(d=>(
                <button key={d.key} className={`date-chip ${dateIdx===d.key?'selected':''}`} onClick={()=>{ setDateIdx(d.key); setSelected([]); }}>
                  <span className="dow">{d.dow}</span>{d.label}
                </button>
              ))}
            </div>
            <h3><span className="live-dot"></span>이용 시간 선택 (다중 선택)</h3>
            <p className="panel-sub">잠긴 슬롯은 이미 다른 이용자가 예약을 확정한 시간입니다.</p>
            <div className="slot-grid">
              {HOURS.map(h=>(
                <button key={h}
                  className={`slot ${selected.includes(h)?'selected':''} ${locked.includes(h)?'locked':''}`}
                  onClick={()=>toggleSlot(h)}>
                  {h}:00
                </button>
              ))}
            </div>
          </div>
          <div className="panel">
            <h3>이용 인원</h3>
            <p className="panel-sub">기본 {baseCapacity}인 포함, 초과 인원은 1인당 시간당 3,000원이 추가됩니다.</p>
            <div className="stepper">
              <button onClick={()=>setPeople(p=>Math.max(1,p-1))} disabled={people<=1}>−</button>
              <span className="count">{people}명</span>
              <button onClick={()=>setPeople(p=>Math.min(20,p+1))}>+</button>
            </div>
          </div>
        </div>
        <div className="panel" style={{position:'sticky',top:'96px'}}>
          <h3>예약 요약</h3>
          <p className="panel-sub">{base.branch} · {DATES[dateIdx].label} ({DATES[dateIdx].dow})</p>
          <div className="summary-row"><span>기본 요금 (시간당)</span><span>{money(base.price)}</span></div>
          <div className="summary-row"><span>초과 인원 {extra}명 × 시간당</span><span>{money(surcharge)}</span></div>
          <div className="summary-row"><span>선택 시간</span><span>{selected.length}시간</span></div>
          <div className="summary-row total"><span>결제 예정 금액</span><span key={total}>{money(total)}</span></div>
          <div style={{height:'14px'}}></div>
          <button className="primary-btn" disabled={selected.length===0} onClick={()=>{
            lockSlot(dayKey, selected);
            notify('슬롯이 임시 확보되었습니다. 결제 화면으로 이동합니다.');
            setView('payment');
          }}>
            <i className="ti ti-lock"></i>결제하기
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function NotificationScreen({ setView, notify }){
  const [logs, setLogs] = useState([
    { id:1, name:'김민수', channel:'alim', status:'success', time:'09:12' },
    { id:2, name:'이지은', channel:'alim', status:'success', time:'09:40' },
    { id:3, name:'박서준', channel:'sms', status:'success', time:'10:05', note:'알림톡 실패 → SMS 폴백' },
  ]);
  const [sending, setSending] = useState(false);

  function runTest(){
    if (sending) return;
    setSending(true);
    const id = Date.now();
    setLogs(l=>[{ id, name:'테스트 발송', channel:'alim', status:'retry', time:'지금' }, ...l]);
    setTimeout(()=>{
      setLogs(l=>l.map(x=>x.id===id ? { ...x, status:'fail', note:'알림톡 서버 응답 없음' } : x));
      setTimeout(()=>{
        setLogs(l=>[{ id:id+1, name:'테스트 발송', channel:'sms', status:'success', time:'지금', note:'알림톡 실패 → SMS 자동 폴백' }, ...l]);
        setSending(false);
        notify('알림톡 발송 실패를 감지하여 SMS로 자동 재발송되었습니다.');
      }, 900);
    }, 900);
  }

  return (
    <React.Fragment>
      <SubHeader title="예약 알림 자동 발송" onBack={()=>setView('main')} />
      <div className="sub-main screen-enter" style={{maxWidth:'640px'}}>
        <div className="panel">
          <h3>발송 이력</h3>
          <p className="panel-sub">카카오 알림톡을 우선 발송하고, 실패 시 SMS로 자동 전환됩니다.</p>
          <button className="ghost-btn" style={{marginBottom:'16px'}} onClick={runTest}>
            <i className="ti ti-send" style={{marginRight:'6px'}}></i>{sending ? '발송 중...' : '테스트 발송'}
          </button>
          {logs.map(l=>(
            <div key={l.id} className="log-row">
              <span className={`channel-badge ${l.channel}`}><i className={`ti ${l.channel==='alim'?'ti-brand-kakotalk':'ti-message'}`}></i>{l.channel==='alim'?'알림톡':'SMS'}</span>
              <div>
                <div className="log-title">{l.name}</div>
                <div className="log-meta">{l.time} {l.note ? '· '+l.note : ''}</div>
              </div>
              <span className={`status-badge ${l.status}`}>{l.status==='success'?'발송성공':l.status==='retry'?'재시도':'실패'}</span>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

function MyPageScreen({ setView, notify }){
  const [reservations, setReservations] = useState([
    { id:1, name:'강남점 A룸', date:'9/18 (금) 14:00~16:00', status:'예약확정' },
    { id:2, name:'홍대점 보컬 부스 1', date:'9/21 (월) 19:00~20:00', status:'예약확정' },
  ]);
  const [target, setTarget] = useState(null);

  function cancel(id){
    setReservations(r=>r.filter(x=>x.id!==id));
    setTarget(null);
    notify('예약이 취소되어 환불 규정에 따라 환불 처리가 진행됩니다.');
  }

  return (
    <React.Fragment>
      <SubHeader title="마이페이지" onBack={()=>setView('main')} />
      <div className="sub-main screen-enter" style={{maxWidth:'640px'}}>
        <div className="panel">
          <h3>내 예약 내역</h3>
          <p className="panel-sub">비회원으로 예약한 건도 함께 조회할 수 있습니다.</p>
          {reservations.length===0 ? (
            <div className="empty-wrap"><i className="ti ti-calendar-off" style={{fontSize:'32px'}}></i><p>예약 내역이 없습니다.</p></div>
          ) : reservations.map(r=>(
            <div key={r.id} className="reserve-card">
              <div className="reserve-info">
                <h4>{r.name}</h4>
                <span>{r.date} · {r.status}</span>
              </div>
              <button className="danger-btn" onClick={()=>setTarget(r)}>취소</button>
            </div>
          ))}
        </div>
      </div>
      {target && (
        <div className="modal-overlay" onClick={()=>setTarget(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3>예약을 취소하시겠습니까?</h3>
            <p>{target.name} · {target.date}<br/>환불 규정에 따라 환불 금액이 자동으로 계산되어 안내됩니다.</p>
            <div className="modal-actions">
              <button className="cancel" onClick={()=>setTarget(null)}>닫기</button>
              <button className="confirm" onClick={()=>cancel(target.id)}>취소 확정</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [selectedRoom, setSelectedRoom] = useState(ROOMS[0]);
  const [favorites, setFavorites] = useState([2,5]);
  const [toast, setToast] = useState(null);
  const [lockedSlots, setLockedSlots] = useState({ '1-0':[11,17,18] });
  const query = { branch:'전체 지점', people:2, time:'오늘' };
  const toastTimer = useRef(null);

  function notify(msg, type){
    setToast({ msg, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null), 2600);
  }
  function toggleFav(id){
    setFavorites(f=> f.includes(id) ? f.filter(x=>x!==id) : [...f,id]);
  }
  function lockSlot(dayKey, hours){
    setLockedSlots(prev => ({ ...prev, [dayKey]: [...new Set([...(prev[dayKey]||[]), ...hours])] }));
  }

  let screen;
  if (view === 'main') {
    screen = <MainScreen setView={setView} setSelectedRoom={setSelectedRoom} favorites={favorites} toggleFav={toggleFav} notify={notify} />;
  } else if (view === 'booking-calendar') {
    screen = <BookingCalendarScreen room={selectedRoom} setView={setView} notify={notify} lockedSlots={lockedSlots} lockSlot={lockSlot} />;
  } else if (view === 'payment') {
    screen = <PaymentScreen setView={setView} notify={notify} />;
  } else if (view === 'notification') {
    screen = <NotificationScreen setView={setView} notify={notify} />;
  } else if (view === 'mypage') {
    screen = <MyPageScreen setView={setView} notify={notify} />;
  }

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Header view={view} setView={setView} query={query} showChips={null} notify={notify} />
      <QuickNav view={view} setView={setView} setSelectedRoom={setSelectedRoom} />
      <div style={{flex:1,width:'100%'}}>{screen}</div>
      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <h4>스페이스라운지</h4>
            <a>회사 소개</a><a>이용약관</a><a>개인정보처리방침</a>
          </div>
          <div className="footer-col">
            <h4>이용안내</h4>
            <a>예약 방법</a><a>환불 규정</a><a>지점 안내</a>
          </div>
          <div className="footer-col">
            <h4>고객센터</h4>
            <a>1544-0000</a><a>평일 10:00~19:00</a>
          </div>
        </div>
        <div className="footer-bottom">© 2026 스페이스라운지 (자체 개발 프로젝트 데모)</div>
      </footer>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<div data-archetype="airbnb-search-grid" style={{width:'100%'}}><App /></div>);
</script>
</body>
</html>
