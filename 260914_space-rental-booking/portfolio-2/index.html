<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페이스라운지 운영 콘솔 — 통합 운영 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 25°, light) ── */
:root{
  --m50:#efefef; --m100:#efefef; --m200:#efefef; --m300:#dfdfdf; --m400:#bebfbf;
  --m500:#979899; --m600:#6b6c6e; --m700:#414245; --m800:#17191c; --m900:#131517;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#777b86; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:24px; --radius-btn:9999px;
  --shadow-1: 0 0 0 1px color-mix(in srgb, var(--n9) 5%, transparent);
  --shadow-2: 0 0 0 1px color-mix(in srgb, var(--n9) 5%, transparent), 0 20px 25px -5px color-mix(in srgb, var(--n9) 10%, transparent), 0 8px 10px -6px color-mix(in srgb, var(--n9) 10%, transparent);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
#app-root{width:100%;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
img{display:block;max-width:100%;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes rowEnter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pillPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) translateX(-50%);}to{opacity:1;transform:translateY(0) translateX(-50%);}}
@keyframes progressFill{from{width:0;}to{width:var(--w,100%);}}
.screen-enter{animation:fadeInUp .4s ease both;}

/* ── topbar-analytics 시그니처 ── */
.app-header{position:sticky;top:0;z-index:40;background:var(--n0);border-bottom:1px solid var(--n3);}
.app-header-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 28px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-0.02em;}
.brand .icon-box{width:32px;height:32px;border-radius:9px;background:var(--m800);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:17px;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-btn);background:var(--n1);font-size:13px;font-weight:600;color:var(--n8);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{padding:9px 16px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;color:var(--n7);transition:.15s;}
.nav-link:hover{color:var(--n9);background:var(--n1);}
.nav-link.active{color:var(--n0);background:var(--m800);}
.header-actions{display:flex;align-items:center;gap:14px;flex-shrink:0;}
@media (max-width:640px){
  .global-nav{display:none;}
  .project-switcher{display:none;}
  .app-header-row{gap:10px;padding:12px 16px;}
  .header-actions{gap:8px;}
}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.icon-btn:hover{background:var(--n1);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

.quick-nav{background:var(--n1);border-bottom:1px solid var(--n3);}
.quick-nav-inner{max-width:1320px;margin:0 auto;display:flex;gap:8px;padding:10px 28px;overflow-x:auto;}
.quick-pill{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-btn);font-size:12.5px;font-weight:700;color:var(--n7);background:var(--n0);border:1px solid var(--n3);white-space:nowrap;flex-shrink:0;transition:.15s;}
.quick-pill:hover{border-color:var(--n6);color:var(--n9);}
.quick-pill.active{background:var(--m800);border-color:var(--m800);color:var(--n0);}

.tab-bar{max-width:1320px;margin:0 auto;display:flex;gap:6px;padding:0 28px;border-bottom:1px solid var(--n3);}
.tab-slot{display:inline-flex;margin-right:22px;}
.tab{padding:14px 4px;font-size:14px;font-weight:600;color:var(--n6);border-bottom:2px solid transparent;transition:.15s;}
.tab:hover{color:var(--n8);}
.tab.active{color:var(--n9);border-color:var(--m800);}

.content{max-width:1320px;margin:0 auto;padding:32px 28px 90px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:20px;flex-wrap:wrap;}
.page-title{font-size:46px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;line-height:1.15;}
.page-title em{font-style:italic;font-weight:500;color:var(--n7);}
.hero-doodle{display:block;width:100%;max-width:520px;height:auto;margin:-8px 0 18px;}
.page-sub{font-size:15px;color:var(--n7);margin:0;max-width:640px;line-height:1.5;}

.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;transition:.15s;}
.pill-btn.filled{background:var(--m800);color:var(--n0);}
.pill-btn.filled:hover{background:var(--n10);}
.pill-btn.ghost{border:1px solid var(--n4);color:var(--n8);}
.pill-btn.ghost:hover{border-color:var(--n6);}

/* ── insight-board 컴포지션 ── */
.insight-board{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;margin-bottom:24px;}
@media(max-width:920px){.insight-board{grid-template-columns:1fr;}}
.hero-viz{background:var(--n0);border-radius:var(--radius-card);padding:28px;box-shadow:var(--shadow-2);}
.hero-viz h3{margin:0 0 4px;font-size:16px;font-weight:700;}
.hero-viz .panel-sub{font-size:13px;color:var(--n7);margin:0 0 20px;}
.chart-wrap{position:relative;height:280px;width:100%;}
.kpi-side{display:flex;flex-direction:column;gap:16px;}
.kpi-card{background:var(--n1);border-radius:var(--radius-card);padding:22px;}
.kpi-label{font-size:13px;color:var(--n7);font-weight:600;margin-bottom:8px;}
.kpi-value{font-size:32px;font-weight:700;letter-spacing:-0.02em;}
.kpi-delta{font-size:12px;color:var(--n7);margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--s1-text);}
.channel-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.channel-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.channel-name{width:76px;flex-shrink:0;color:var(--n8);font-weight:600;}
.channel-bar-track{flex:1;height:8px;border-radius:5px;background:var(--n2);overflow:hidden;}
.channel-bar-fill{height:100%;border-radius:5px;background:var(--m800);animation:progressFill 1s ease both;}
.channel-pct{width:38px;text-align:right;color:var(--n7);font-weight:600;}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:920px){.widget-grid{grid-template-columns:1fr;}}
.widget-card{background:var(--n1);border-radius:var(--radius-card);padding:24px;display:flex;flex-direction:column;gap:14px;}
.widget-head{display:flex;align-items:center;gap:10px;}
.widget-icon{width:36px;height:36px;border-radius:10px;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n8);font-size:18px;}
.widget-title{font-size:14px;font-weight:700;}
.widget-body{font-size:12.5px;color:var(--n7);line-height:1.6;flex:1;}
.widget-foot{display:flex;align-items:center;justify-content:space-between;}
.text-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--n9);}
.text-link:hover{text-decoration:underline;}

/* ── 서브 화면 공통 ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:24px;}
.stat-card{background:var(--n1);border-radius:var(--radius-card);padding:22px;}
.stat-label{font-size:12.5px;color:var(--n7);font-weight:600;margin-bottom:8px;}
.stat-value{font-size:30px;font-weight:700;}

.table-wrap{background:var(--n0);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-1);}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:12px;font-weight:700;color:var(--n7);text-transform:uppercase;letter-spacing:.03em;padding:14px 20px;border-bottom:1px solid var(--n3);}
tbody td{padding:16px 20px;font-size:13.5px;color:var(--n8);border-bottom:1px solid var(--n2);}
tbody tr{animation:rowEnter .35s ease both;}
tbody tr:hover{background:var(--n1);}
tbody tr:last-child td{border-bottom:none;}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-btn);font-size:12px;font-weight:700;}
.status-pill.ok{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.warn{background:var(--n2);color:var(--n8);}
.status-pill.mismatch{background:var(--s2-bg);color:var(--s2-text);}
.row-btn{padding:7px 14px;border-radius:var(--radius-btn);border:1px solid var(--n4);font-size:12px;font-weight:600;color:var(--n8);}
.row-btn:hover{border-color:var(--n6);}

.panel{background:var(--n1);border-radius:var(--radius-card);padding:26px;margin-bottom:22px;}
.panel h3{margin:0 0 4px;font-size:16px;font-weight:700;}
.panel .panel-sub{font-size:13px;color:var(--n7);margin:0 0 18px;}
.field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px;}
.field label{font-size:12px;font-weight:600;color:var(--n7);}
.field select,.field input{padding:10px 14px;border-radius:12px;border:1px solid var(--n4);background:var(--n0);font-family:inherit;font-size:13.5px;color:var(--n9);}
.progress-track{height:8px;border-radius:5px;background:var(--n2);overflow:hidden;margin-top:14px;}
.progress-fill{height:100%;background:var(--m800);border-radius:5px;animation:progressFill 1.4s ease forwards;}
.code-box{background:var(--n9);color:var(--n1);border-radius:14px;padding:16px 18px;font-family:ui-monospace,monospace;font-size:12.5px;overflow-x:auto;position:relative;}
.copy-btn{position:absolute;top:12px;right:12px;background:color-mix(in srgb, var(--n0) 15%, transparent);color:var(--n1);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;}

.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px;}
@media(max-width:820px){.compare-grid{grid-template-columns:1fr;}}
.compare-card{background:var(--n1);border-radius:var(--radius-card);padding:22px;}
.compare-title{font-size:13px;font-weight:700;color:var(--n7);margin-bottom:14px;}
.compare-pair{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--n3);}
.compare-pair:last-child{border-bottom:none;}
.compare-pair b{font-weight:700;}
.match-badge{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--radius-btn);}
.match-badge.match{background:var(--s1-bg);color:var(--s1-text);}
.match-badge.mismatch{background:var(--s2-bg);color:var(--s2-text);}

.slide-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 45%, transparent);z-index:60;display:flex;justify-content:flex-end;}
.slide-panel{width:min(460px,92vw);height:100%;background:var(--n0);overflow-y:auto;padding:28px;animation:fadeInUp .3s ease both;}
.slide-panel h2{font-size:20px;font-weight:700;margin:0 0 4px;}
.slide-panel .panel-sub{margin-bottom:22px;}
.close-btn{float:right;width:34px;height:34px;border-radius:50%;background:var(--n1);display:flex;align-items:center;justify-content:center;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n9);color:var(--n0);padding:13px 22px;border-radius:var(--radius-btn);font-size:13px;font-weight:600;z-index:100;display:flex;align-items:center;gap:8px;animation:toastIn .28s ease both;}

.modal-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--n10) 45%, transparent);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--n0);border-radius:20px;padding:28px;max-width:420px;width:100%;animation:fadeInUp .28s ease both;}
.modal-box h3{margin:0 0 10px;font-size:17px;font-weight:700;}
.modal-box p{margin:0 0 20px;font-size:13px;color:var(--n7);line-height:1.6;}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14px;}
.modal-actions .confirm{background:var(--m800);color:var(--n0);}
.modal-actions .cancel{background:var(--n1);color:var(--n8);}

.live-dot{width:6px;height:6px;border-radius:50%;background:var(--s1);animation:pillPulse 1.6s infinite;display:inline-block;margin-right:6px;}
.mini-log{display:flex;flex-direction:column;gap:10px;}
.mini-log-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--n8);padding:8px 0;border-bottom:1px solid var(--n2);}
.mini-log-row:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react,env">
const { useState, useMemo, useRef } = React;
const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;

const BRANCHES = ['강남점','홍대점','건대점','신촌점','잠실점','수원점','인천점'];

const TREND = [
  { day:'9/8', naver:42, kakao:28, direct:20 },
  { day:'9/9', naver:48, kakao:31, direct:19 },
  { day:'9/10', naver:51, kakao:35, direct:22 },
  { day:'9/11', naver:47, kakao:38, direct:24 },
  { day:'9/12', naver:58, kakao:41, direct:23 },
  { day:'9/13', naver:63, kakao:44, direct:26 },
  { day:'9/14', naver:69, kakao:47, direct:28 },
];

const CHANNELS = [
  { name:'네이버 검색', pct:38 },
  { name:'카카오 광고', pct:27 },
  { name:'자연 유입', pct:22 },
  { name:'인스타그램', pct:13 },
];

function money(n){ return n.toLocaleString('ko-KR') + '원'; }

function Toast({ toast }){
  if (!toast) return null;
  return <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>;
}

function Header({ view, setView, notify }){
  const nav = [
    { key:'main', label:'홈' },
    { key:'branch-manage', label:'지점 관리' },
    { key:'data-export', label:'데이터센터' },
    { key:'activity-log', label:'로그' },
  ];
  return (
    <header className="app-header">
      <div className="app-header-row">
        <div className="brand"><span className="icon-box"><i className="ph ph-buildings"></i></span>운영콘솔</div>
        <div className="project-switcher"><i className="ph ph-map-pin"></i>전체 지점<i className="ph ph-caret-down"></i></div>
        <nav className="global-nav">
          {nav.map(n=>(
            <button key={n.key} className={n.key===view ? 'nav-link active' : 'nav-link'} onClick={()=>setView(n.key)}>{n.label}</button>
          ))}
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={()=>notify && notify('전체 지점 기준 검색을 실행했습니다.')}><i className="ph ph-magnifying-glass"></i></button>
          <button className="icon-btn" onClick={()=>notify && notify('새 알림이 없습니다.')}><i className="ph ph-bell"></i></button>
          <div className="avatar">운영</div>
        </div>
      </div>
    </header>
  );
}

function TabBar({ tab, setTab }){
  return (
    <nav className="tab-bar">
      <span className="tab-slot"><button className={tab==='개요' ? 'tab active' : 'tab'} onClick={()=>setTab('개요')}>개요</button></span>
      <span className="tab-slot"><button className={tab==='채널분석' ? 'tab active' : 'tab'} onClick={()=>setTab('채널분석')}>채널분석</button></span>
      <span className="tab-slot"><button className={tab==='예약전환' ? 'tab active' : 'tab'} onClick={()=>setTab('예약전환')}>예약전환</button></span>
      <span className="tab-slot"><button className={tab==='리포트' ? 'tab active' : 'tab'} onClick={()=>setTab('리포트')}>리포트</button></span>
    </nav>
  );
}

function QuickNav({ view, setView }){
  const items = [
    { key:'branch-manage', label:'지점·룸 통합 관리', icon:'ph-buildings' },
    { key:'data-export', label:'예약 데이터 내보내기·조회 API', icon:'ph-download-simple' },
    { key:'migration-report', label:'데이터 이관 검증 리포트', icon:'ph-database-plus' },
    { key:'activity-log', label:'관리자 접근 로그', icon:'ph-clipboard-text' },
  ];
  return (
    <nav className="quick-nav">
      <div className="quick-nav-inner">
        {items.map(it=>(
          <button key={it.key} className={it.key===view ? 'quick-pill active' : 'quick-pill'} onClick={()=>setView(it.key)}>
            <i className={`ph ${it.icon}`}></i>{it.label}
          </button>
        ))}
      </div>
    </nav>
  );
}

function MainScreen({ setView, notify }){
  const [tab, setTab] = useState('개요');
  return (
    <React.Fragment>
      <TabBar tab={tab} setTab={setTab} />
      <div className="content screen-enter">
        <div className="page-head">
          <div>
            <h1 className="page-title">유입 경로를<br/><em>한 화면에서</em> 분석합니다</h1>
            <p className="page-sub">UTM·네이버 파라미터별 유입 경로와 예약 전환 흐름을 채널 단위로 비교합니다.</p>
          </div>
          <button className="pill-btn filled" onClick={()=>notify('최근 30일 리포트를 다시 계산했습니다.')}><i className="ph ph-arrows-clockwise"></i>새로고침</button>
        </div>
        <svg className="hero-doodle" viewBox="0 0 300 60" preserveAspectRatio="none">
          <path d="M0,45 C40,10 70,55 110,28 C150,4 180,48 220,22 C250,4 270,30 300,14" fill="none" stroke="var(--m800)" strokeOpacity="0.16" strokeWidth="2.4" />
        </svg>

        <div className="insight-board">
          <div className="hero-viz">
            <h3><span className="live-dot"></span>채널별 유입 → 예약 전환 추이</h3>
            <p className="panel-sub">최근 7일, 자연 유입 대비 유료 채널의 예약 전환 건수 비교</p>
            <div className="chart-wrap">
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={TREND} margin={{top:6,right:6,left:-18,bottom:0}}>
                  <defs>
                    <linearGradient id="fillNaver" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%" stopColor="#17191c" stopOpacity={0.28}/>

function BranchManage({ notify }){
  const [rooms, setRooms] = useState({
    '강남점':[{name:'A룸',capacity:8,price:24000},{name:'B룸',capacity:4,price:16000}],
    '홍대점':[{name:'보컬 부스 1',capacity:2,price:14000},{name:'밴드 합주실',capacity:5,price:23000}],
    '건대점':[{name:'합주실 B',capacity:6,price:22000}],
    '신촌점':[{name:'연기연습실',capacity:5,price:19000}],
    '잠실점':[{name:'뮤지컬홀',capacity:10,price:29000}],
    '수원점':[{name:'댄스 스튜디오 C',capacity:6,price:18000}],
    '인천점':[{name:'보컬 부스 2',capacity:2,price:13000}],
  });
  const [openNew, setOpenNew] = useState(false);
  const [form, setForm] = useState({ branch:'', room:'', capacity:4, price:15000 });

  function submitNew(e){
    e.preventDefault();
    if (!form.branch || !form.room) { notify('지점명과 룸 이름을 입력해 주세요.'); return; }
    setRooms(r => ({ ...r, [form.branch]: [...(r[form.branch]||[]), { name:form.room, capacity:Number(form.capacity), price:Number(form.price) }] }));
    setOpenNew(false);
    setForm({ branch:'', room:'', capacity:4, price:15000 });
    notify('신규 지점·룸이 등록되어 고객 탐색 화면에 즉시 반영되었습니다.');
  }

  return (
    <div className="content screen-enter">
      <div className="page-head">
        <div>
          <h1 className="page-title">지점·룸 통합 관리</h1>
          <p className="page-sub">코드 수정 없이 화면에서 신규 지점과 룸을 등록·수정합니다.</p>
        </div>
        <button className="pill-btn filled" onClick={()=>setOpenNew(true)}><i className="ph ph-plus"></i>신규 지점 등록</button>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>지점</th><th>룸</th><th>정원</th><th>시간당 요금</th><th></th></tr></thead>
          <tbody>
            {Object.entries(rooms).flatMap(([branch, list]) => list.map((room, i) => (
              <tr key={branch+room.name}>
                <td>{i===0 ? branch : ''}</td>
                <td>{room.name}</td>
                <td>{room.capacity}인</td>
                <td>{money(room.price)}</td>
                <td><button className="row-btn" onClick={()=>notify(`${branch} ${room.name} 정보가 저장되었습니다.`)}>저장</button></td>
              </tr>
            )))}
          </tbody>
        </table>
      </div>

      {openNew && (
        <div className="slide-overlay" onClick={()=>setOpenNew(false)}>
          <form className="slide-panel" onClick={e=>e.stopPropagation()} onSubmit={submitNew}>
            <button type="button" className="close-btn" onClick={()=>setOpenNew(false)}><i className="ph ph-x"></i></button>
            <h2>신규 지점 등록</h2>
            <p className="panel-sub">등록 즉시 고객 탐색 화면에 반영됩니다.</p>
            <div className="field"><label>지점명</label><input value={form.branch} onChange={e=>setForm({...form, branch:e.target.value})} placeholder="예: 판교점" /></div>
            <div className="field" style={{marginTop:'14px'}}><label>룸 이름</label><input value={form.room} onChange={e=>setForm({...form, room:e.target.value})} placeholder="예: C룸" /></div>
            <div className="field-row" style={{marginTop:'14px'}}>
              <div className="field"><label>정원(인)</label><input type="number" value={form.capacity} onChange={e=>setForm({...form, capacity:e.target.value})} /></div>
              <div className="field"><label>시간당 요금(원)</label><input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} /></div>
            </div>
            <button className="pill-btn filled" style={{width:'100%',justifyContent:'center',marginTop:'20px'}} type="submit">등록 완료</button>
          </form>
        </div>
      )}
    </div>
  );
}

function DataExport({ notify }){
  const [range, setRange] = useState('30');
  const [branch, setBranch] = useState('전체');
  const [progress, setProgress] = useState(0);
  const [apiKey, setApiKey] = useState('sk_live_9f2a7c1e0b3d4f5a');

  function runExport(){
    if (progress > 0 && progress < 100) return;
    setProgress(1);
    const timer = setInterval(()=>{
      setProgress(p=>{
        if (p >= 100) { clearInterval(timer); notify('CSV 파일 생성이 완료되어 다운로드를 시작합니다.'); return 100; }
        return p + 20;
      });
    }, 220);
  }

  function reissueKey(){
    setApiKey('sk_live_' + Math.random().toString(16).slice(2,18));
    notify('조회 전용 API 키가 재발급되었습니다. 기존 키는 즉시 만료됩니다.');
  }

  return (
    <div className="content screen-enter">
      <div className="page-head">
        <div>
          <h1 className="page-title">예약 데이터 내보내기·조회 API</h1>
          <p className="page-sub">기간·지점 조건을 지정해 CSV로 내려받거나, 외부 분석 도구가 조회 전용 API로 정기 수집합니다.</p>
        </div>
      </div>

      <div className="panel">
        <h3>CSV 내보내기</h3>
        <p className="panel-sub">조건에 맞는 예약 건만 스트리밍 방식으로 생성됩니다.</p>
        <div className="field-row">
          <div className="field"><label>기간</label>
            <select value={range} onChange={e=>setRange(e.target.value)}>
              <option value="7">최근 7일</option>
              <option value="30">최근 30일</option>
              <option value="90">최근 90일</option>
            </select>
          </div>
          <div className="field"><label>지점</label>
            <select value={branch} onChange={e=>setBranch(e.target.value)}>
              <option>전체</option>
              {BRANCHES.map(b=><option key={b}>{b}</option>)}
            </select>
          </div>
        </div>
        <button className="pill-btn filled" onClick={runExport}><i className="ph ph-file-csv"></i>{progress>0 && progress<100 ? `생성 중 ${progress}%` : 'CSV 다운로드'}</button>
        {progress>0 && (
          <div className="progress-track"><div className="progress-fill" style={{'--w':progress+'%', width:progress+'%'}}></div></div>
        )}
      </div>

      <div className="panel">
        <h3>조회 전용 API</h3>
        <p className="panel-sub">외부 분석 도구의 정기 수집용으로, API Key 인증과 요청 횟수 제한이 적용됩니다.</p>
        <div className="code-box">
          GET /api/v1/reservations?branch=all&period=30d<br/>
          Authorization: Bearer {apiKey}
          <button className="copy-btn" onClick={()=>notify('API 요청 예시가 복사되었습니다.')}>복사</button>
        </div>
        <button className="pill-btn ghost" style={{marginTop:'16px'}} onClick={reissueKey}><i className="ph ph-arrow-counter-clockwise"></i>키 재발급</button>
      </div>
    </div>
  );
}

function MigrationReport({ notify }){
  const [rows, setRows] = useState([
    { id:1, branch:'강남점', diff:'12건 불일치', status:'mismatch' },
    { id:2, branch:'홍대점', diff:'금액 합계 일치', status:'ok' },
    { id:3, branch:'잠실점', diff:'3건 불일치', status:'mismatch' },
    { id:4, branch:'수원점', diff:'전체 일치', status:'ok' },
  ]);

  const compareData = [
    { name:'건수', 원본:57225, 이관:57213 },
    { name:'2026년 병합', 원본:5079, 이관:5079 },
  ];

  function reprocess(id){
    setRows(r => r.map(x => x.id===id ? { ...x, diff:'재처리 완료', status:'ok' } : x));
    notify('선택한 지점의 이관 데이터를 재처리했습니다.');
  }

  return (
    <div className="content screen-enter">
      <div className="page-head">
        <div>
          <h1 className="page-title">데이터 이관 검증 리포트</h1>
          <p className="page-sub">예약 원장·회원 데이터의 이관 결과를 건수·금액·지점별 분포 3개 축으로 확인합니다.</p>
        </div>
      </div>

      <div className="compare-grid">
        <div className="compare-card">
          <div className="compare-title">건수 비교</div>
          <div className="compare-pair"><span>원본 원장</span><b>57,225건</b></div>
          <div className="compare-pair"><span>이관 결과</span><b>57,213건</b></div>
          <span className="match-badge mismatch"><i className="ph ph-warning-circle"></i>12건 확인 필요</span>
        </div>
        <div className="compare-card">
          <div className="compare-title">금액 합계 비교</div>
          <div className="compare-pair"><span>원본 합계</span><b>{money(1284300000)}</b></div>
          <div className="compare-pair"><span>이관 합계</span><b>{money(1284300000)}</b></div>
          <span className="match-badge match"><i className="ph ph-check-circle"></i>일치</span>
        </div>
        <div className="compare-card">
          <div className="compare-title">지점별 분포</div>
          <div className="compare-pair"><span>7개 지점</span><b>분포 비교 완료</b></div>
          <div className="compare-pair"><span>불일치 지점</span><b>2곳</b></div>
          <span className="match-badge mismatch"><i className="ph ph-warning-circle"></i>강남·잠실 확인</span>
        </div>
      </div>

      <div className="panel">
        <h3>건수 비교 차트</h3>
        <p className="panel-sub">원본과 이관 결과의 건수를 항목별로 비교합니다.</p>
        <div className="chart-wrap" style={{height:'220px'}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={compareData} margin={{top:6,right:6,left:-18,bottom:0}}>
              <CartesianGrid vertical={false} stroke="#e6e5e5" />
              <XAxis dataKey="name" tick={{fontSize:12, fill:'#989390'}} axisLine={false} tickLine={false} />
              <YAxis tick={{fontSize:12, fill:'#989390'}} axisLine={false} tickLine={false} width={40} />
              <Tooltip contentStyle={{borderRadius:12,border:'1px solid #e6e5e5',fontSize:12}} />
              <Bar dataKey="원본" fill="#c3c0be" radius={[6,6,0,0]} />
              <Bar dataKey="이관" fill="#17191c" radius={[6,6,0,0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>지점</th><th>검증 결과</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {rows.map(r=>(
              <tr key={r.id}>
                <td>{r.branch}</td>
                <td>{r.diff}</td>
                <td><span className={`status-pill ${r.status==='ok'?'ok':'mismatch'}`}>{r.status==='ok'?'정상':'불일치'}</span></td>
                <td>{r.status!=='ok' && <button className="row-btn" onClick={()=>reprocess(r.id)}>재처리</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  function notify(msg){
    setToast(msg);
    clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(null), 2600);
  }

  let screen;
  if (view === 'main') screen = <MainScreen setView={setView} notify={notify} />;
  else if (view === 'branch-manage') screen = <BranchManage notify={notify} />;
  else if (view === 'data-export') screen = <DataExport notify={notify} />;
  else if (view === 'migration-report') screen = <MigrationReport notify={notify} />;
  else if (view === 'activity-log') screen = <ActivityLog />;

  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Header view={view} setView={setView} notify={notify} />
      <QuickNav view={view} setView={setView} />
      <div style={{flex:1,width:'100%'}}>{screen}</div>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<div data-archetype="topbar-analytics" style={{width:'100%'}}><App /></div>);
</script>
