<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생별 컨테이너 실습 웹 IDE — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 1 · 나머지 무채색 (gen-color-tokens.js 산출, hue 19°, light) ── */
:root{
  --m50:#fef3ed; --m100:#fee6db; --m200:#fccdb8; --m300:#fbaf8c; --m400:#f98e5c;
  --m500:#f76e2e; --m600:#f54e00; --m700:#c94000; --m800:#9d3200; --m900:#6e2300;
  --n0:#f7f7f4; --n1:#f2f1ed; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#a1a19f; --n7:#7a7471; --n8:#5a5553; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { width: 100%; height: 100%; }
body {
  font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  background: var(--n0);
  color: var(--n10);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
::selection { background: #8BC4F8; }

/* ── keyframes (실사용 ≥3) ── */
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(245,78,0,.35); } 50% { box-shadow: 0 0 0 6px rgba(245,78,0,0); } }
@keyframes spinLoader { to { transform: rotate(360deg); } }
@keyframes shimmerBar { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
@keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blinkCaret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes toastPop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* ── layout: linear-sidebar-cmdk ── */
[data-archetype="linear-sidebar-cmdk"] { display: flex; min-height: 100vh; width: 100%; }

.sidebar {
  width: 260px; min-width: 260px; height: 100vh; position: sticky; top: 0;
  background: var(--n1); border-right: 1px solid var(--n3);
  display: flex; flex-direction: column;
}
.sidebar-brand {
  height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-bottom: 1px solid var(--n3);
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 4px; background: var(--m600);
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text b { font-size: 13px; font-weight: 600; color: var(--n10); line-height: 1.3; }
.brand-text span { font-size: 11px; color: var(--n7); }
.sidebar-cmdk-hint {
  margin: 12px 16px; padding: 8px 10px; border: 1px solid var(--n3); border-radius: 4px;
  display: flex; align-items: center; justify-content: space-between; background: var(--n0);
  font-size: 12px; color: var(--n7);
}
.sidebar-cmdk-hint .kbd { border: 1px solid var(--n4); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--n8); background: var(--n1); font-family: ui-monospace, monospace; }
.sidebar-nav { padding: 4px 12px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-section-title { font-size: 11px; font-weight: 600; color: var(--n6); text-transform: uppercase; letter-spacing: .05em; padding: 16px 12px 6px; }
.sidebar-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px;
  font-size: 13px; color: var(--n8); text-align: left; width: 100%; border-left: 3px solid transparent;
  transition: background 120ms ease-out, color 120ms ease-out;
}
.sidebar-link svg { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 1.5; }
.sidebar-link:hover { background: var(--n2); color: var(--n10); }
.sidebar-link.active { background: var(--m50); color: var(--m700); border-left-color: var(--m600); font-weight: 500; }
.sidebar-user {
  margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--n3);
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
}
.avatar-initial {
  width: 28px; height: 28px; border-radius: 50%; background: var(--n2); color: var(--n8);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.sidebar-user b { font-size: 12.5px; color: var(--n10); display: block; }
.sidebar-user span { font-size: 11px; color: var(--n7); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar {
  height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--n3); background: var(--n0);
}
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--n6); }
.breadcrumb a { color: var(--n6); cursor: pointer; }
.breadcrumb a:hover { color: var(--n9); }
.breadcrumb .current { color: var(--n10); font-weight: 500; }
.breadcrumb .divider { color: var(--n5); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.btn-cmdk {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--n3);
  border-radius: 4px; font-size: 12px; color: var(--n7); background: var(--n0);
}
.btn-cmdk:hover { border-color: var(--n5); }
.btn-primary {
  padding: 7px 14px; border-radius: 4px; background: var(--n10); color: var(--n0); font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px; transition: background 150ms;
}
.btn-primary:hover { background: var(--n9); }
.btn-primary svg { width: 14px; height: 14px; }
.btn-ghost {
  padding: 7px 12px; border-radius: 4px; font-size: 13px; color: var(--n8); display: flex; align-items: center; gap: 6px;
  border: 1px solid transparent;
}
.btn-ghost:hover { background: var(--n2); }
.btn-outline {
  padding: 7px 12px; border-radius: 4px; font-size: 13px; color: var(--n8); border: 1px solid var(--n4);
  display: flex; align-items: center; gap: 6px; background: var(--n0);
}
.btn-outline:hover { border-color: var(--n6); color: var(--n10); }
.btn-outline.accent { color: var(--m700); border-color: var(--m300); }
.btn-outline.accent:hover { background: var(--m50); }

.content { flex: 1; overflow: auto; animation: slideUpFade 260ms ease-out; }

/* ── composition: editor-canvas (main 화면) ── */
.editor-canvas { display: flex; height: 100%; }
.file-panel { width: 220px; min-width: 220px; border-right: 1px solid var(--n3); background: var(--n1); padding: 14px 8px; overflow: auto; }
.file-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 10px; }
.file-panel-head span { font-size: 11px; font-weight: 600; color: var(--n6); text-transform: uppercase; letter-spacing: .04em; }
.file-panel-head button { color: var(--n6); display: flex; }
.file-panel-head button:hover { color: var(--m600); }
.file-item {
  display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; border-radius: 4px;
  font-size: 12.5px; color: var(--n8); text-align: left;
}
.file-item svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--n6); }
.file-item:hover { background: var(--n2); }
.file-item.active { background: var(--m50); color: var(--m700); font-weight: 500; }
.file-item.active svg { color: var(--m600); }

.editor-canvas-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--n3); background: var(--n0); }
.editor-tab { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--n8); font-family: ui-monospace, monospace; }
.editor-tab svg { width: 13px; height: 13px; color: var(--n6); }
.editor-toolbar-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 4px;
  border: 1px solid var(--n3); color: var(--n8); background: var(--n0);
}
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { border-color: var(--n5); color: var(--n10); }
.icon-btn.run { background: var(--m600); border-color: var(--m600); color: #fff; }
.icon-btn.run:hover { background: var(--m700); }
.icon-btn.run.running svg { animation: spinLoader 900ms linear infinite; }

.code-area { flex: 1; overflow: auto; background: var(--n0); font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 13px; line-height: 1.7; }
.code-line { display: flex; }
.code-line .ln { width: 44px; text-align: right; padding-right: 14px; color: var(--n5); user-select: none; flex-shrink: 0; }
.code-line .code { white-space: pre; color: var(--n9); }
.tok-kw { color: var(--m700); }
.tok-str { color: #1f894b; }
.tok-cm { color: var(--n6); font-style: italic; }
.tok-fn { color: var(--n10); font-weight: 500; }
.code-line.active-line { background: var(--m50); }
.autosave-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--n6); padding: 6px 16px; border-top: 1px solid var(--n3); }
.autosave-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--s1); animation: pulseDot 1.8s ease-out infinite; }

.right-panel { width: 320px; min-width: 320px; border-left: 1px solid var(--n3); display: flex; flex-direction: column; background: var(--n0); }
.rp-tabs { display: flex; border-bottom: 1px solid var(--n3); }
.rp-tab { flex: 1; padding: 10px; font-size: 12.5px; color: var(--n7); border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 6px; }
.rp-tab svg { width: 14px; height: 14px; }
.rp-tab.active { color: var(--m700); border-bottom-color: var(--m600); font-weight: 500; }
.rp-body { flex: 1; overflow: auto; padding: 12px 14px; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.75; }
.console-line { display: flex; gap: 8px; margin-bottom: 3px; }
.console-line .tag { flex-shrink: 0; color: var(--n5); }
.console-line.stderr .msg { color: var(--n9); }
.console-line.stderr .tag { color: var(--n8); }
.console-line.stdout .msg { color: var(--n8); }
.console-caret { display: inline-block; width: 6px; height: 12px; background: var(--n9); animation: blinkCaret 1s step-end infinite; vertical-align: middle; }
.preview-frame-chrome { border: 1px solid var(--n3); border-radius: 4px; overflow: hidden; background: var(--n1); }
.preview-url-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--n1); border-bottom: 1px solid var(--n3); font-size: 10.5px; color: var(--n6); font-family: ui-monospace, monospace; }
.preview-url-bar svg { width: 11px; height: 11px; }
.preview-body { background: #fff; padding: 16px; min-height: 180px; }

/* ── 공용: 카드 / 배지 / 테이블 / 스탯 ── */
.page-pad { padding: 28px 32px; max-width: 1100px; }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--n10); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--n7); margin-bottom: 24px; }
.stat-strip { display: flex; gap: 10px; padding: 10px 14px; border: 1px solid var(--n3); border-radius: 4px; background: var(--n1); margin-bottom: 20px; flex-wrap: wrap; }
.stat-chip { display: flex; flex-direction: column; padding: 4px 18px; border-right: 1px solid var(--n3); }
.stat-chip:last-child { border-right: none; }
.stat-chip .stat-label { font-size: 11px; color: var(--n6); margin-bottom: 2px; }
.stat-chip .stat-value { font-size: 22px; font-weight: 600; color: var(--n10); font-variant-numeric: tabular-nums; }
.stat-chip .stat-value.hero { font-size: 38px; }
.stat-chip .stat-value.accent { color: var(--m600); }

.card { background: var(--n0); border: 1px solid var(--n3); border-radius: 4px; padding: 20px; }
.card-title { font-size: 14px; font-weight: 600; color: var(--n10); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title svg { width: 16px; height: 16px; color: var(--n7); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 4px; font-size: 11.5px; font-weight: 500; }
.badge.ok { background: var(--s1-bg); color: var(--s1-text); }
.badge.neutral { background: var(--n2); color: var(--n8); }
.badge.pending { background: var(--n2); color: var(--n7); }
.badge svg { width: 12px; height: 12px; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.busy .dot { animation: pulseDot 1.4s ease-out infinite; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 11px; color: var(--n6); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--n3); }
.table td { padding: 10px 10px; border-bottom: 1px solid var(--n2); color: var(--n9); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table-row-btn { display: flex; align-items: center; gap: 8px; }
.spinner-sm { width: 13px; height: 13px; border: 2px solid var(--n4); border-top-color: var(--m600); border-radius: 50%; animation: spinLoader 700ms linear infinite; display: inline-block; }
.shimmer-track { height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--n2) 0px, var(--n3) 40px, var(--n2) 80px); background-size: 200px 100%; animation: shimmerBar 1.2s linear infinite; }

.timeline { display: flex; align-items: center; gap: 0; margin: 6px 0 4px; }
.tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--n2); color: var(--n6); font-size: 11px; font-weight: 600; z-index: 1; border: 2px solid var(--n0); }
.tl-dot.done { background: var(--s1); color: #fff; }
.tl-dot.now { background: var(--m600); color: #fff; }
.tl-dot svg { width: 12px; height: 12px; }
.tl-line { position: absolute; top: 11px; left: 50%; width: 100%; height: 2px; background: var(--n3); z-index: 0; }
.tl-step:last-child .tl-line { display: none; }
.tl-line.done { background: var(--s1); }
.tl-label { font-size: 10.5px; color: var(--n7); margin-top: 6px; text-align: center; }

.recovery-log { display: flex; flex-direction: column; gap: 8px; }
.recovery-log-item { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; border-radius: 4px; background: var(--n1); }
.recovery-log-item .rli-icon { width: 22px; height: 22px; border-radius: 50%; background: var(--n2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.recovery-log-item .rli-icon svg { width: 12px; height: 12px; color: var(--n7); }
.recovery-log-item.ok .rli-icon { background: var(--s1-bg); }
.recovery-log-item.ok .rli-icon svg { color: var(--s1-text); }
.recovery-log-item .rli-time { color: var(--n5); font-size: 11px; margin-left: auto; flex-shrink: 0; }

.wave-wrap { border: 1px solid var(--n3); border-radius: 4px; padding: 16px; background: var(--n1); margin-bottom: 18px; }
.wave-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.wave-head .wh-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--n10); }
.wave-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s1); animation: pulseDot 1.6s ease-out infinite; }

.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--n10); color: var(--n0);
  padding: 11px 16px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px;
  animation: toastPop 220ms ease-out; box-shadow: rgba(0,0,0,.14) 0px 12px 28px 0px; z-index: 200;
}
.toast svg { width: 15px; height: 15px; color: var(--s1); }

/* ── cmd-k overlay ── */
.cmdk-overlay {
  position: fixed; inset: 0; background: rgba(32,30,30,.35); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh;
}
.cmdk-modal { width: 480px; max-width: 90vw; background: var(--n0); border-radius: 8px; border: 1px solid var(--n3); box-shadow: rgba(0,0,0,.14) 0px 28px 70px 0px, rgba(0,0,0,.1) 0px 14px 32px 0px; overflow: hidden; }
.cmdk-input { width: 100%; padding: 14px 16px; font-size: 14px; border: none; border-bottom: 1px solid var(--n3); outline: none; color: var(--n10); }
.cmdk-input::placeholder { color: var(--n6); }
.cmdk-results { padding: 8px; max-height: 320px; overflow: auto; }
.cmdk-group-title { font-size: 10.5px; color: var(--n6); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px 4px; }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 4px; width: 100%; text-align: left; font-size: 13px; color: var(--n9); }
.cmdk-item svg { width: 15px; height: 15px; color: var(--n6); }
.cmdk-item:hover { background: var(--m50); color: var(--m700); }
.cmdk-item:hover svg { color: var(--m600); }
.cmdk-item .kbd { margin-left: auto; border: 1px solid var(--n4); border-radius: 4px; padding: 1px 6px; font-size: 10.5px; color: var(--n6); }

@media (max-width: 1023px) {
  .right-panel { display: none; }
  .file-panel { width: 180px; min-width: 180px; }
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FILES = [
  { path: 'main.py', icon: 'file-code-2' },
  { path: 'app.py', icon: 'file-code-2' },
  { path: 'utils.py', icon: 'file-code-2' },
  { path: 'requirements.txt', icon: 'file-text' },
];

const CODE_BY_FILE = {
  'main.py': [
    { t: 'cm', v: '# 실습 1: 숫자 리스트의 평균과 최댓값 구하기' },
    { t: 'kw', v: 'def ' , fn: 'calc_stats' , rest: '(numbers):' },
    { t: 'plain', v: '    total = sum(numbers)' },
    { t: 'plain', v: '    average = total / len(numbers)' },
    { t: 'plain', v: '    peak = max(numbers)' },
    { t: 'kw', v: 'return ', rest: 'average, peak' },
    { t: 'blank' },
    { t: 'plain', v: 'scores = [88, 92, 76, 95, 81]' },
    { t: 'plain', v: 'avg, best = calc_stats(scores)' },
    { t: 'fn', v: 'print', rest: '(f"평균: {avg:.1f}, 최고점: {best}")' },
  ],
  'app.py': [
    { t: 'kw', v: '/* [auto-removed side-effect import] */streamlit as st' },
    { t: 'blank' },
    { t: 'fn', v: 'st.title', rest: '("나의 첫 점수 대시보드")' },
    { t: 'plain', v: 'name = st.text_input("이름을 입력하세요")' },
    { t: 'plain', v: 'score = st.slider("점수", 0, 100, 82)' },
    { t: 'kw', v: 'if ', rest: 'name:' },
    { t: 'fn', v: '    st.write', rest: '(f"{name}님의 점수는 {score}점입니다")' },
    { t: 'fn', v: '    st.bar_chart', rest: '([score, 100-score])' },
  ],
  'utils.py': [
    { t: 'cm', v: '# 보조 함수 모음' },
    { t: 'kw', v: 'def ', fn: 'to_grade', rest: '(score):' },
    { t: 'kw', v: '    if ', rest: 'score >= 90:' },
    { t: 'kw', v: '        return ', str: '"A"' },
    { t: 'kw', v: '    elif ', rest: 'score >= 80:' },
    { t: 'kw', v: '        return ', str: '"B"' },
    { t: 'kw', v: '    else', rest: ':' },
    { t: 'kw', v: '        return ', str: '"C"' },
  ],
  'requirements.txt': [
    { t: 'plain', v: 'streamlit==1.32.0' },
    { t: 'plain', v: 'pandas==2.2.0' },
  ],
};

const NAV_ITEMS = [
  { id: 'main', label: '웹 IDE', icon: 'code-2' },
  { id: 'console-preview', label: '실시간 콘솔 & Streamlit 미리보기', icon: 'square-terminal' },
  { id: 'container-provision', label: '학생별 컨테이너 프로비저닝', icon: 'box' },

function App() {
  const [view, setView] = useState('main');
  const [selectedFile, setSelectedFile] = useState('main.py');
  const [running, setRunning] = useState(false);
  const [consoleLines, setConsoleLines] = useState([]);
  const [rpTab, setRpTab] = useState('console');
  const [filter, setFilter] = useState('all');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [students, setStudents] = useState(STUDENTS);
  const [recLog, setRecLog] = useState([
    { icon: 'wifi', text: 'WebSocket 연결 수립 (session #8f21)', time: '10:02:14', ok: true },
  ]);
  const [simulating, setSimulating] = useState(false);
  const [attempt, setAttempt] = useState(0);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdkOpen(v => !v); }
      if (e.key === 'Escape') setCmdkOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }

  function runCode() {
    if (running) return;
    setRunning(true);
    setRpTab('console');
    setConsoleLines([]);
    const seq = selectedFile === 'app.py'
      ? [{ type: 'stdout', text: 'Streamlit 서버 기동 중… (:8501)' }, { type: 'stdout', text: 'app.py 실행 완료 — 미리보기 패널을 확인하세요' }]
      : [{ type: 'stdout', text: '평균: 86.4, 최고점: 95' }, { type: 'stdout', text: '프로세스 종료 (0)' }];
    seq.forEach((line, i) => {
      setTimeout(() => setConsoleLines(prev => [...prev, line]), 500 * (i + 1));
    });
    setTimeout(() => setRunning(false), 500 * (seq.length + 1));
  }

  function regenerateContainer(i) {
    setStudents(prev => prev.map((s, idx) => idx === i ? { ...s, status: 'provisioning' } : s));
    showToast(`${students[i].name} 학생 컨테이너 재생성 시작`);
    setTimeout(() => setStudents(prev => prev.map((s, idx) => idx === i ? { ...s, status: 'ready' } : s)), 1800);
  }

  function simulateRecovery() {
    if (simulating) return;
    setSimulating(true);
    setAttempt(0);
    const steps = [
      { icon: 'wifi-off', text: 'WebSocket 연결 끊김 감지', ok: false },
      { icon: 'refresh-cw', text: '재연결 시도 1/5 (1초 대기)', ok: false },
      { icon: 'alert-triangle', text: '컨테이너 비정상 종료 감지 — 볼륨 보존', ok: false },
      { icon: 'box', text: '동일 볼륨으로 컨테이너 재생성', ok: false },
      { icon: 'check-circle-2', text: '재연결 성공 — 세션 재동기화 완료', ok: true },
    ];
    steps.forEach((s, i) => {
      setTimeout(() => {
        setRecLog(prev => [...prev, { ...s, time: new Date().toLocaleTimeString('ko-KR', { hour12: false }) }]);
        setAttempt(i + 1);
        if (i === steps.length - 1) setSimulating(false);
      }, 700 * (i + 1));
    });
  }

  return (
    <div data-archetype="linear-sidebar-cmdk">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-mark"><i data-lucide="graduation-cap"></i></div>
          <div className="brand-text"><b>Square Learning</b><span>파이썬 기초반 A</span></div>
        </div>
        <div className="sidebar-cmdk-hint" role="button" onClick={() => setCmdkOpen(true)} style={{ cursor: 'pointer' }}>
          <span>명령 검색</span><span className="kbd">⌘K</span>
        </div>
        <div className="sidebar-nav">
          {NAV_ITEMS.map(n => (
            <button key={n.id} className={'sidebar-link' + (view === n.id ? ' active' : '')} onClick={() => setView(n.id)}>
              <i data-lucide={n.icon}></i>{n.label}
            </button>
          ))}
        </div>
        <div className="sidebar-section-title">워크스페이스</div>
        <div className="sidebar-nav">
          <button className="sidebar-link" onClick={() => showToast('설정 화면은 데모 범위 밖입니다')}>
            <i data-lucide="settings"></i>환경 설정
          </button>
        </div>
        <div className="sidebar-user">
          <span className="avatar-initial">이</span>
          <div><b>이지은</b><span>학생 · 세션 #8f21</span></div>
        </div>
      </aside>
      <main className="main">
        <div className="topbar">
          <div className="breadcrumb">
            <a onClick={() => setView('main')}>Square Learning</a><span className="divider">/</span><a onClick={() => setView('main')}>실습실</a><span className="divider">/</span><span className="current">파이썬 기초반 A</span>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={() => setCmdkOpen(true)}><i data-lucide="search"></i>검색 <span className="kbd" style={{ marginLeft: 4 }}>⌘K</span></button>
            <button className="btn-primary" onClick={() => showToast('강사에게 질문이 전송되었습니다')}><i data-lucide="message-circle-question"></i>질문하기</button>
          </div>
        </div>
        <div className="content" key={view}>
          {view === 'main' && (
            <MainScreen
              selectedFile={selectedFile} setSelectedFile={setSelectedFile}
              running={running} onRun={runCode}
              onReset={() => showToast('코드가 초기 템플릿으로 초기화되었습니다')}
              onSave={() => showToast('저장되었습니다')}
              rpTab={rpTab} setRpTab={setRpTab} consoleLines={consoleLines}
            />
          )}
          {view === 'console-preview' && (
            <ConsolePreviewScreen consoleLines={consoleLines.length ? consoleLines : [{ type: 'stdout', text: '평균: 86.4, 최고점: 95' }, { type: 'stdout', text: '프로세스 종료 (0)' }]} onRerun={runCode} running={running} filter={filter} setFilter={setFilter} />
          )}
          {view === 'container-provision' && (
            <ContainerProvisionScreen students={students} onRegenerate={regenerateContainer} />
          )}
          {view === 'auto-recovery' && (
            <AutoRecoveryScreen log={recLog} onSimulate={simulateRecovery} simulating={simulating} attempt={attempt} />
          )}
        </div>
      </main>
      <CmdkOverlay open={cmdkOpen} onClose={() => setCmdkOpen(false)} onNav={setView} />
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
