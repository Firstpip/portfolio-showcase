<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노드제로 컨트롤타워 — 멀티 계정 자동매매 관제</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 0°, dark) ── */
:root{
  --m50:#f8f8f8; --m100:#f4f4f4; --m200:#efefef; --m300:#ebebeb; --m400:#e6e6e6;
  --m500:#bdbdbd; --m600:#939393; --m700:#676767; --m800:#676767; --m900:#676767;
  --n0:#201e1e; --n1:#3a3636; --n2:#5a5353; --n3:#7a7171; --n4:#989090;
  --n5:#9c9c9d; --n6:#d7d5d5; --n7:#e6e5e5; --n8:#f0efef; --n9:#f8f7f7; --n10:#ffffff;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--n2); border-radius:8px;}

@keyframes fadeSlideIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
@keyframes pulseLive{ 0%,100%{box-shadow:0 0 0 0 rgba(59,206,120,.5);} 50%{box-shadow:0 0 0 6px rgba(59,206,120,0);} }
@keyframes drawLine{ from{stroke-dashoffset:520;} to{stroke-dashoffset:0;} }
@keyframes floatTile{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
@keyframes ringSpin{ from{transform:rotate(-90deg);} to{transform:rotate(270deg);} }
@keyframes toastPop{ from{opacity:0; transform:translate(-50%,14px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes barGrow{ from{transform:scaleY(0);} to{transform:scaleY(1);} }

.topbar{
  display:flex; align-items:center; gap:24px; padding:14px 32px; border-bottom:1px solid var(--n1);
  background:rgba(32,30,30,.9); backdrop-filter:blur(10px); position:sticky; top:0; z-index:30;
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(145deg, var(--n2), var(--n0)); display:flex; align-items:center; justify-content:center; color:var(--m400); border:1px solid var(--n2);}
.brand-name{font-weight:800; font-size:14.5px; letter-spacing:-.2px; color:var(--n9);}
.top-nav{display:flex; gap:2px; flex:1; overflow-x:auto;}
.top-nav button{padding:9px 14px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--n5); white-space:nowrap; transition:all .15s;}
.top-nav button:hover{color:var(--n8); background:var(--n1);}
.top-nav button.active{color:var(--n10); background:var(--n1); box-shadow:inset 0 0 0 1px var(--n2);}
.top-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.live-chip{display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:var(--n1); font-size:11.5px; font-weight:700; color:var(--n6);}
.live-dot{width:6px; height:6px; border-radius:50%; background:var(--s1); animation:pulseLive 2s infinite;}
.btn{padding:9px 15px; border-radius:10px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px; transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--m400); color:var(--n0);}
.btn-primary:hover{background:var(--n10);}
.btn-danger{background:var(--n1); color:var(--n8); border:1px solid var(--n3);}
.btn-danger:hover{border-color:var(--s3);}

.page{max-width:1360px; margin:0 auto; padding:26px 32px 70px; animation:fadeSlideIn .35s ease;}

.hero-strip{
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  padding:20px 24px; border-radius:var(--radius); background:linear-gradient(135deg, var(--n1) 0%, var(--n0) 100%); border:1px solid var(--n2); margin-bottom:20px;
  position:relative; overflow:hidden;
}
.hero-strip::after{
  content:''; position:absolute; top:-40%; right:-6%; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(230,230,230,.10) 0%, rgba(230,230,230,0) 70%); pointer-events:none;
}
.hero-strip::before{
  content:''; position:absolute; top:-70%; right:-10%; width:60%; height:260%; pointer-events:none;
  background:repeating-linear-gradient(24deg, rgba(230,230,230,.10) 0 14px, rgba(230,230,230,0) 14px 34px);
  animation:floatTile 9s ease-in-out infinite;
}
.hero-title{font-size:19px; font-weight:800; color:var(--n10);}
.hero-sub{font-size:12.5px; color:var(--n5); margin-top:4px;}
.hero-badges{display:flex; gap:8px; flex-wrap:wrap;}
.pill{padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--n2); color:var(--n7);}
.pill.good{background:var(--s1-bg); color:var(--s1-text);}

/* ── bento-grid ── */
.bento{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.tile{
  background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius); padding:20px;
  position:relative; overflow:hidden; animation:floatTile 6s ease-in-out infinite;
}
.tile.feature{grid-column:span 2; grid-row:span 2;}
.tile.wide{grid-column:span 2;}
.tile h4{font-size:12.5px; font-weight:700; color:var(--n5); display:flex; align-items:center; gap:7px; margin-bottom:14px;}
.tile .big-num{font-size:34px; font-weight:800; color:var(--n10); letter-spacing:-.5px;}
.tile .num-sub{font-size:12px; color:var(--n5); margin-top:6px;}
.tile .num-sub.good{color:var(--s1);}
.tile .num-sub.warn{color:var(--s3);}

.chart-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.chart-legend{display:flex; gap:14px; font-size:11px; color:var(--n5);}
.chart-legend span{display:flex; align-items:center; gap:6px;}
.chart-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.range-pick{display:flex; gap:2px; background:var(--n0); border-radius:8px; padding:3px;}
.range-pick button{padding:5px 10px; font-size:11px; font-weight:700; color:var(--n5); border-radius:6px;}
.range-pick button.active{background:var(--n2); color:var(--n9);}

.ring-wrap{display:flex; align-items:center; gap:16px;}
.ring{width:72px; height:72px; flex-shrink:0;}
.ring circle{fill:none; stroke-width:8;}
.ring .bg{stroke:var(--n2);}
.ring .fg{stroke:var(--m400); stroke-linecap:round; transform-origin:center; animation:ringSpin 1s ease-out;}

.mini-feed{display:flex; flex-direction:column; gap:12px; max-height:220px; overflow-y:auto;}
.feed-item{display:flex; gap:10px; align-items:flex-start; font-size:12px;}
.feed-icon{width:26px; height:26px; border-radius:8px; background:var(--n2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--n7); font-size:13px;}
.feed-icon.warn{background:var(--s3-bg); color:var(--s3-text);}
.feed-icon.good{background:var(--s1-bg); color:var(--s1-text);}
.feed-time{color:var(--n5); font-size:10.5px; margin-top:2px;}

.acct-row-list{display:flex; flex-direction:column; gap:10px;}
.acct-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:var(--n0); transition:background .15s;}
.acct-row:hover{background:var(--n2);}
.acct-row-avatar{width:32px; height:32px; border-radius:9px; background:var(--n2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:var(--n7); flex-shrink:0;}
.acct-row-body{flex:1; min-width:0;}
.acct-row-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.acct-row-name{font-size:12.5px; font-weight:700; color:var(--n9);}
.acct-row-balance{font-size:13px; font-weight:800; color:var(--n10); flex-shrink:0;}
.exposure-bar{width:100px; height:6px; border-radius:4px; background:var(--n0); overflow:hidden;}
.exposure-fill{height:100%; background:var(--m400); transform-origin:left; animation:barGrow .5s ease;}
.badge{padding:4px 9px; border-radius:999px; font-size:10.5px; font-weight:700;}
.badge.good{background:var(--s1-bg); color:var(--s1-text);}
.badge.warn{background:var(--s3-bg); color:var(--s3-text);}
.badge.neutral{background:var(--n2); color:var(--n6);}

/* ── risk 화면 ── */
.section-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}
.card{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius); padding:22px;}
.card h3{font-size:14.5px; font-weight:800; margin-bottom:16px; color:var(--n10);}
.field-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--n0);}
.field-row:last-child{border-bottom:none;}
.field-label{font-size:13px; color:var(--n7); font-weight:600;}
.field-input{display:flex; align-items:center; gap:8px;}
.slider-track{width:140px; height:6px; border-radius:4px; background:var(--n0); position:relative;}
.slider-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px; background:var(--m400);}
.slider-btn{width:16px; height:16px; border-radius:50%; background:var(--n10); position:absolute; top:-5px; box-shadow:0 2px 6px rgba(0,0,0,.4);}
.stepper{display:flex; align-items:center; gap:6px; background:var(--n0); border-radius:8px; padding:4px;}
.stepper button{width:22px; height:22px; border-radius:6px; color:var(--n7); font-weight:800;}
.stepper button:hover{background:var(--n2);}
.gate-log{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--n0); font-size:12px;}
.gate-log:last-child{border-bottom:none;}

/* ── pnl 화면 ── */
.pnl-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
.sum-card{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius); padding:18px;}
.sum-card .sc-label{font-size:11.5px; color:var(--n5); font-weight:700;}
.sum-card .sc-val{font-size:24px; font-weight:800; margin-top:6px; color:var(--n10);}

/* ── audit 화면 ── */
.matrix-table{width:100%; border-collapse:collapse;}
.matrix-table th, .matrix-table td{padding:13px 14px; text-align:center; border-bottom:1px solid var(--n0);}
.matrix-table th:first-child, .matrix-table td:first-child{text-align:left;}
.matrix-table th{font-size:11px; color:var(--n5); font-weight:700; text-transform:uppercase;}
.toggle{width:36px; height:21px; border-radius:999px; background:var(--n2); position:relative; display:inline-block;}
.toggle.on{background:var(--m400);}
.toggle-knob{position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:var(--n9); transition:transform .18s;}
.toggle.on .toggle-knob{background:var(--n0); transform:translateX(15px);}
.audit-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--n0); font-size:12.5px;}
.audit-row:last-child{border-bottom:none;}
.audit-time{color:var(--n5); font-size:11px; min-width:96px;}

/* ── accounts 화면 ── */
.acct-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.acct-card{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius); padding:20px;}
.acct-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.acct-avatar{width:38px; height:38px; border-radius:11px; background:var(--n2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--n7);}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--n10); color:var(--n0); padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:60; animation:toastPop .3s ease; display:flex; align-items:center; gap:8px;}

@media (max-width: 1000px){
  .bento{grid-template-columns:repeat(2,1fr);}
  .tile.feature{grid-column:span 2;}
  .section-grid{grid-template-columns:1fr;}
  .pnl-summary{grid-template-columns:1fr;}
  .acct-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;
const PH = (name, cls='') => <i className={"ph ph-" + name + " " + cls}></i>;

const TABS = [
  { key:'main', label:'멀티 계정 통합 관제 허브' },
  { key:'risk', label:'리스크 관리 & 포지션 한도 설정' },
  { key:'pnl', label:'실시간 손익 분석 대시보드' },
  { key:'audit', label:'알림 에스컬레이션 & 감사 로그' },
  { key:'accounts', label:'계정 관리' },
];

const ACCOUNTS = [
  { name:'계정 A · 메인', balance:'82,140 USDT', exposure:64, status:'good', label:'정상' },
  { name:'계정 B · 스캘핑', balance:'31,920 USDT', exposure:88, status:'warn', label:'한도 근접' },
  { name:'계정 C · 헤지', balance:'14,340 USDT', exposure:22, status:'good', label:'정상' },
];

function RingChart({pct=70}){
  const r = 30, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return (
    <svg className="ring" viewBox="0 0 72 72">
      <circle className="bg" cx="36" cy="36" r={r}/>
      <circle className="fg" cx="36" cy="36" r={r} strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 36 36)"/>
      <text x="36" y="41" textAnchor="middle" fontSize="15" fontWeight="800" fill="var(--n10)">{pct}%</text>
    </svg>
  );
}

function LineChart(){
  return (
    <svg viewBox="0 0 320 120" width="100%" height="150" preserveAspectRatio="none">
      <polyline points="0,90 40,84 80,88 120,60 160,66 200,40 240,46 280,20 320,26"
        fill="none" stroke="var(--m400)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        style={{strokeDasharray:520, strokeDashoffset:0, animation:'drawLine 1.1s ease-out'}}/>
      <polyline points="0,70 40,74 80,66 120,72 160,58 200,64 240,50 280,54 320,44"
        fill="none" stroke="var(--n4)" strokeWidth="2" strokeDasharray="3 4" strokeLinecap="round"/>
    </svg>
  );
}

function MainView({goto}){
  const [range, setRange] = useState('24h');
  return (
    <div>
      <div className="hero-strip">
        <div>
          <div className="hero-title">멀티 계정 통합 관제 허브</div>
          <div className="hero-sub">계정별 데이터를 Row-Level Security로 격리하고 하나의 콘솔에서 비교 모니터링합니다</div>
        </div>
        <div className="hero-badges">
          <span className="pill good">{PH('shield-check')} 3개 계정 격리 정상</span>
          <span className="pill">등록 계정 3개</span>
          <button className="btn btn-danger" onClick={() => goto('risk')}>{PH('warning-octagon')}리스크 점검</button>
        </div>
      </div>

      <div className="bento" data-archetype-grid>
        <div className="tile feature" style={{animationDelay:'0s'}}>
          <div className="chart-head">
            <h4>{PH('chart-line-up')}통합 손익 · 잔고 추이</h4>
            <div className="range-pick">
              {['24h','7d','30d'].map(r => <button key={r} className={range===r?'active':''} onClick={() => setRange(r)}>{r}</button>)}
            </div>
          </div>
          <LineChart/>
          <div className="chart-legend">
            <span><i style={{background:'var(--m400)'}}></i>합산 손익</span>
            <span><i style={{background:'var(--n4)'}}></i>합산 잔고</span>
          </div>
        </div>

        <div className="tile" style={{animationDelay:'.3s'}}>
          <h4>{PH('users-three')}등록 계정 수</h4>
          <div className="big-num">3</div>
          <div className="num-sub good">전체 격리 정상</div>
        </div>

        <div className="tile" style={{animationDelay:'.6s'}}>
          <h4>{PH('gauge')}총 노출 한도 사용률</h4>
          <div className="ring-wrap">
            <RingChart pct={71}/>
            <div className="num-sub warn">계정 B 한도 근접</div>
          </div>
        </div>

        <div className="tile wide" style={{animationDelay:'.2s'}}>
          <h4>{PH('list-bullets')}계정별 요약</h4>
          <div className="acct-row-list">
            {ACCOUNTS.map(a => (
              <div className="acct-row" key={a.name}>
                <div className="acct-row-avatar">{a.name[3]}</div>
                <div className="acct-row-body">
                  <div className="acct-row-top"><span className="acct-row-name">{a.name}</span><span className={"badge " + a.status}>{a.label}</span></div>
                  <div className="exposure-bar"><div className="exposure-fill" style={{width:a.exposure+'%'}}></div></div>
                </div>
                <div className="acct-row-balance">{a.balance}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="tile" style={{animationDelay:'.45s'}}>
          <h4>{PH('bell-ringing')}실시간 알림 피드</h4>
          <div className="mini-feed">
            <div className="feed-item">
              <div className="feed-icon warn">{PH('warning')}</div>
              <div><div>계정 B 노출 한도 88% 도달</div><div className="feed-time">2분 전</div></div>
            </div>
            <div className="feed-item">
              <div className="feed-icon good">{PH('check')}</div>
              <div><div>계정 C 손절 규칙 정상 작동</div><div className="feed-time">14분 전</div></div>
            </div>
            <div className="feed-item">
              <div className="feed-icon">{PH('arrows-clockwise')}</div>
              <div><div>계정 A Redis 세션 캐시 갱신</div><div className="feed-time">21분 전</div></div>
            </div>
          </div>
        </div>

        <div className="tile" style={{animationDelay:'.7s'}}>
          <h4>{PH('siren')}리스크 경고</h4>
          <div className="big-num">1</div>
          <div className="num-sub warn">계정 B 한도 근접 경고</div>
        </div>
      </div>
    </div>
  );
}

function RiskView(){
  const [maxExposure, setMaxExposure] = useState(70);
  const [stopLoss, setStopLoss] = useState(5);
  const [leverage, setLeverage] = useState(3);
  const [account, setAccount] = useState('계정 A · 메인');
  const [toast, setToast] = useState('');
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };

  return (
    <div>
      <div className="hero-strip">
        <div>
          <div className="hero-title">리스크 관리 & 포지션 한도 설정</div>
          <div className="hero-sub">주문 생성 파이프라인 앞단의 사전 검증 게이트로 한도 초과를 차단합니다</div>
        </div>
        <div className="range-pick">
          {ACCOUNTS.map(a => <button key={a.name} className={account===a.name?'active':''} onClick={() => setAccount(a.name)}>{a.name.split(' · ')[0]}</button>)}
        </div>
      </div>

      <div className="section-grid">
        <div className="card">
          <h3>{account} 리스크 정책</h3>
          <div className="field-row">
            <span className="field-label">최대 노출 한도</span>
            <div className="field-input">
              <div className="slider-track"><div className="slider-fill" style={{width:maxExposure+'%'}}></div><div className="slider-btn" style={{left:'calc('+maxExposure+'% - 8px)'}}></div></div>
              <span style={{fontSize:12.5, fontWeight:700, minWidth:34}}>{maxExposure}%</span>
              <div className="stepper">
                <button onClick={() => setMaxExposure(m => Math.max(10, m-5))}>−</button>
                <button onClick={() => setMaxExposure(m => Math.min(100, m+5))}>+</button>
              </div>
            </div>
          </div>
          <div className="field-row">
            <span className="field-label">손절 비율</span>
            <div className="field-input">
              <div className="slider-track"><div className="slider-fill" style={{width:(stopLoss*8)+'%'}}></div><div className="slider-btn" style={{left:'calc('+(stopLoss*8)+'% - 8px)'}}></div></div>
              <span style={{fontSize:12.5, fontWeight:700, minWidth:34}}>{stopLoss}%</span>
              <div className="stepper">
                <button onClick={() => setStopLoss(s => Math.max(1, s-1))}>−</button>
                <button onClick={() => setStopLoss(s => Math.min(12, s+1))}>+</button>
              </div>
            </div>
          </div>
          <div className="field-row">
            <span className="field-label">레버리지 상한</span>
            <div className="field-input">
              <span style={{fontSize:13, fontWeight:700}}>{leverage}x</span>
              <div className="stepper">
                <button onClick={() => setLeverage(l => Math.max(1, l-1))}>−</button>
                <button onClick={() => setLeverage(l => Math.min(10, l+1))}>+</button>
              </div>
            </div>
          </div>
          <button className="btn btn-primary" style={{marginTop:16}} onClick={() => flash(account + ' 리스크 정책이 적용되었습니다')}>{PH('floppy-disk')}정책 적용</button>
          {toast && <div className="toast">{PH('check-circle')}{toast}</div>}
        </div>

        <div className="card">
          <h3>사전 검증 게이트 로그</h3>
          <div className="gate-log">
            <div className="feed-icon warn">{PH('prohibit')}</div>
            <div><div style={{fontWeight:700}}>계정 B 신규 매수 차단</div><div style={{color:'var(--n5)', fontSize:11.5}}>노출 한도 88% &gt; 설정 70% — 사전 게이트 차단</div></div>
          </div>
          <div className="gate-log">
            <div className="feed-icon good">{PH('check')}</div>
            <div><div style={{fontWeight:700}}>계정 A 매도 주문 통과</div><div style={{color:'var(--n5)', fontSize:11.5}}>노출 64% ≤ 한도 70%</div></div>
          </div>
          <div className="gate-log">
            <div className="feed-icon good">{PH('check')}</div>
            <div><div style={{fontWeight:700}}>계정 C 손절 규칙 트리거</div><div style={{color:'var(--n5)', fontSize:11.5}}>손실 -5.2% 도달 → 자동 청산 실행</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PnlView(){
  const [range, setRange] = useState('7d');
  return (
    <div>
      <div className="hero-strip">
        <div>
          <div className="hero-title">실시간 손익 분석 대시보드</div>
          <div className="hero-sub">Materialized View로 집계한 계정별·기간별 손익 추이를 시각화합니다</div>
        </div>
        <div className="range-pick">
          {['일','주','월'].map(r => <button key={r} className={range===r?'active':''} onClick={() => setRange(r)}>{r}</button>)}
        </div>
      </div>

      <div className="pnl-summary">
        <div className="sum-card"><div className="sc-label">누적 손익 (전체 계정)</div><div className="sc-val">+4,218 USDT</div></div>
        <div className="sum-card"><div className="sc-label">승률</div><div className="sc-val">58.4%</div></div>
        <div className="sum-card"><div className="sc-label">평균 보유 시간</div><div className="sc-val">2.4시간</div></div>
      </div>

      <div className="tile feature" style={{width:'100%', gridColumn:'unset'}}>
        <div className="chart-head">
          <h4>{PH('chart-bar')}계정별 손익 추이</h4>
          <div className="chart-legend">
            <span><i style={{background:'var(--m400)'}}></i>계정 A</span>
            <span><i style={{background:'var(--n4)'}}></i>계정 B·C</span>
          </div>
        </div>
        <LineChart/>
      </div>
    </div>
  );
}

function AuditView(){
  const severities = ['정보','경고','긴급'];
  const channels = ['이메일','텔레그램','카카오톡'];
  const [matrix, setMatrix] = useState({ 정보:[true,false,false], 경고:[true,true,false], 긴급:[true,true,true] });
  const [toast, setToast] = useState(false);
  const flip = (sev, idx) => setMatrix(m => ({...m, [sev]: m[sev].map((v,i) => i===idx?!v:v)}));
  const save = () => { setToast(true); setTimeout(() => setToast(false), 2200); };

  return (
    <div>
      <div className="hero-strip">
        <div>
          <div className="hero-title">알림 에스컬레이션 & 감사 로그</div>
          <div className="hero-sub">심각도별 채널 매트릭스와 append-only 감사 로그로 조작 추적성을 확보합니다</div>
        </div>
        <button className="btn btn-primary" onClick={save}>{PH('floppy-disk')}저장</button>
      </div>

      <div className="card" style={{marginBottom:18}}>
        <h3>심각도 × 채널 에스컬레이션 매트릭스</h3>
        <table className="matrix-table">
          <thead><tr><th>심각도</th>{channels.map(c => <th key={c}>{c}</th>)}</tr></thead>
          <tbody>
            {severities.map(sev => (
              <tr key={sev}>
                <td style={{fontWeight:700}}>{sev}</td>
                {channels.map((c, idx) => (
                  <td key={c}><button className={"toggle" + (matrix[sev][idx]?" on":"")} onClick={() => flip(sev, idx)}><span className="toggle-knob"></span></button></td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="card">
        <h3>감사 로그 (append-only)</h3>
        <div className="audit-row"><span className="audit-time">14:24:03</span><div>관리자가 계정 B 최대 노출 한도를 80% → 70%로 조정</div></div>
        <div className="audit-row"><span className="audit-time">09-12 03:14</span><div>엔진 재기동 — 긴급 알림 3채널 동시 발송</div></div>
        <div className="audit-row"><span className="audit-time">09-08 21:02</span><div>관리자가 계정 C 손절 비율을 4% → 5%로 조정</div></div>
      </div>

      {toast && <div className="toast">{PH('check-circle')}알림 설정이 저장되었습니다</div>}
    </div>
  );
}

function AccountsView(){
  const [toast, setToast] = useState('');
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };
  return (
    <div>
      <div className="hero-strip">
        <div>
          <div className="hero-title">계정 관리</div>
          <div className="hero-sub">다중 거래 계정을 등록하고 계정별 접근 범위를 관리합니다</div>
        </div>
        <button className="btn btn-primary" onClick={() => flash('계정 등록 절차를 시작합니다')}>{PH('plus')}계정 등록</button>
      </div>
      <div className="acct-grid">
        {ACCOUNTS.map(a => (
          <div className="acct-card" key={a.name}>
            <div className="acct-card-head">
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <div className="acct-avatar">{a.name[3]}</div>
                <div style={{fontWeight:700, fontSize:13.5}}>{a.name}</div>
              </div>
              <span className={"badge " + a.status}>{a.label}</span>
            </div>
            <div style={{fontSize:12, color:'var(--n5)', marginBottom:6}}>잔고</div>
            <div style={{fontSize:18, fontWeight:800, marginBottom:14}}>{a.balance}</div>
            <div className="exposure-bar" style={{width:'100%'}}><div className="exposure-fill" style={{width:a.exposure+'%'}}></div></div>
            <div style={{fontSize:11, color:'var(--n5)', marginTop:6}}>노출률 {a.exposure}%</div>
          </div>
        ))}
      </div>
      {toast && <div className="toast">{PH('check-circle')}{toast}</div>}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [halted, setHalted] = useState(false);
  const [toast, setToast] = useState('');
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  const views = {
    main: <MainView goto={setView}/>,
    risk: <RiskView/>,
    pnl: <PnlView/>,
    audit: <AuditView/>,
    accounts: <AccountsView/>,
  };

  return (
    <div data-archetype="bento-grid">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">{PH('circuitry')}</div>
          <div className="brand-name">노드제로 컨트롤타워</div>
        </div>
        <nav className="top-nav">
          {TABS.map(t => (
            <button key={t.key} className={view===t.key?'active':''} onClick={() => setView(t.key)}>{t.label}</button>
          ))}
        </nav>
        <div className="top-actions">
          <span className="live-chip"><span className="live-dot"></span>{halted ? '전 계정 정지됨' : '실거래 3계정 연결됨'}</span>
          <button className="btn btn-danger" onClick={() => { setHalted(h => !h); flash(halted ? '전 계정 주문 실행을 재개합니다' : '전 계정 신규 주문을 즉시 정지합니다'); }}>{PH('hand-palm')}{halted ? '정지 해제' : '긴급 정지'}</button>
        </div>
      </header>
      {toast && <div className="toast">{PH('check-circle')}{toast}</div>}
      <div className="page" key={view}>
        {views[view]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
