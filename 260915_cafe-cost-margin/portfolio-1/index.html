<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { width: 100%; min-height: 100%; }
body {
  font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  background: var(--n0);
  color: var(--n10);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
::selection { background: var(--m200); }
img { max-width: 100%; display: block; }

/* ── keyframes (실사용) ── */
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(250,93,0,.35); } 50% { box-shadow: 0 0 0 6px rgba(250,93,0,0); } }
@keyframes spinLoader { to { transform: rotate(360deg); } }
@keyframes shimmerBar { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
@keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastPop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes drawLine { from { stroke-dashoffset: 620; } to { stroke-dashoffset: 0; } }
@keyframes countRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── layout: stripe-multipane ── */
[data-archetype="stripe-multipane"] { display: flex; min-height: 100vh; width: 100%; }

.sidebar {
  width: 252px; min-width: 252px; height: 100vh; position: sticky; top: 0;
  background: var(--n1); border-right: 1px solid var(--n3);
  display: flex; flex-direction: column;
}
.sidebar-brand { height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--n3); }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--m600); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; font-size: 16px; }
.brand-text b { font-size: 14.5px; font-weight: 700; color: var(--n10); line-height: 1.3; display: block; }
.brand-text span { font-size: 11px; color: var(--n7); }
.env-selector { margin: 14px 16px 6px; padding: 8px 12px; border: 1px solid var(--n3); border-radius: 10px; background: var(--n0); display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--n8); }
.env-selector .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s1); animation: pulseDot 2s infinite; }
.sidebar-nav { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.sidebar-section-title { font-size: 11px; font-weight: 700; color: var(--n6); text-transform: uppercase; letter-spacing: .06em; padding: 16px 10px 6px; }
.sidebar-link {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px;
  font-size: 13.5px; color: var(--n8); text-align: left; width: 100%; font-weight: 500;
  transition: background 120ms ease-out, color 120ms ease-out;
}
.sidebar-link i { font-size: 17px; width: 18px; text-align: center; flex-shrink: 0; }
.sidebar-link:hover { background: var(--n2); color: var(--n10); }
.sidebar-link.active { background: var(--m50); color: var(--n10); font-weight: 700; border-left: 3px solid var(--m600); padding-left: 9px; }
.sidebar-badge { margin-left: auto; background: var(--s2-bg); color: var(--s2-text); font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--n3); display: flex; align-items: center; gap: 10px; }
.avatar-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--n2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--n8); flex-shrink: 0; }
.sidebar-footer-text b { display: block; font-size: 12.5px; color: var(--n10); }
.sidebar-footer-text span { font-size: 11px; color: var(--n7); }

.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-header { padding: 26px 36px 0; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 23px; font-weight: 800; color: var(--n10); letter-spacing: -0.02em; }
.page-meta { font-size: 12.5px; color: var(--n7); margin-top: 4px; }
.page-actions { display: flex; gap: 8px; }
.btn-primary {
  background: var(--m600); color: #fff; font-size: 13.5px; font-weight: 700; padding: 10px 18px;
  border-radius: 12px; display: flex; align-items: center; gap: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.15);
  transition: background 120ms;
}
.btn-primary:hover { background: var(--m700); }
.btn-secondary { background: var(--n1); color: var(--n9); font-size: 13.5px; font-weight: 600; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--n4); display: flex; align-items: center; gap: 7px; }
.btn-secondary:hover { background: var(--n2); }
.btn-secondary.active { border-color: var(--m600); color: var(--n9); background: var(--m50); }

.content-pad { padding: 22px 36px 48px; flex: 1; }

/* insight-board: hero-viz + kpi-side + widget-grid */
.insight-board { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; margin-bottom: 20px; }
.card {
  background: var(--n1); border: 1px solid var(--n3); border-radius: 20px; padding: 24px;
  box-shadow: 0 2px 10px rgba(29,30,28,.04);
  animation: slideUpFade .4s ease-out;
  transition: transform 160ms ease-out, box-shadow 160ms ease-out;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(29,30,28,.09); }
.card-title { font-size: 15px; font-weight: 700; color: var(--n10); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.card-sub { font-size: 12px; color: var(--n7); margin-bottom: 16px; }

.tab-bar { display: flex; gap: 4px; background: var(--n2); padding: 4px; border-radius: 10px; width: fit-content; }
.tab { padding: 7px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--n7); }
.tab.active { background: var(--n1); color: var(--n10); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.hero-display { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; color: var(--n10); margin-top: 6px; }
.hero-display span { font-size: 15px; font-weight: 600; color: var(--n7); margin-left: 10px; }
.hero-display span i { color: var(--s1); margin-right: 3px; }
.hero-chart-wrap { position: relative; height: 220px; margin-top: 8px; }
.hero-chart-legend { display: flex; gap: 18px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--n8); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.kpi-side { display: flex; flex-direction: column; gap: 14px; }
.stat-card { background: var(--n1); border: 1px solid var(--n3); border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(29,30,28,.04); animation: countRise .4s ease-out; }
.stat-label { font-size: 12px; color: var(--n7); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat-value { font-size: 30px; font-weight: 800; color: var(--n10); margin-top: 6px; letter-spacing: -0.02em; }
.stat-delta { font-size: 12px; font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.stat-delta.up, .stat-delta.down { color: var(--n8); }
.stat-delta.up i { color: var(--s1); }
.stat-delta.down i { color: var(--s2); }
.stat-sparkline { margin-top: 8px; width: 100%; height: 28px; }

.rank-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--n0); }
.rank-num { width: 20px; height: 20px; border-radius: 6px; background: var(--s2-bg); color: var(--s2-text); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rank-name { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--n9); }
.rank-margin { font-size: 12.5px; font-weight: 800; color: var(--n9); }

.widget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.donut-wrap { display: flex; align-items: center; gap: 16px; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.donut-legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--n8); }
.donut-legend-row b { color: var(--n10); margin-left: auto; }

.alert-list { display: flex; flex-direction: column; gap: 10px; }
.alert-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 12px; background: var(--n0); }
.alert-icon { width: 30px; height: 30px; border-radius: 9px; background: var(--s2-bg); color: var(--s2-text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
.alert-icon.warn { background: var(--n2); color: var(--n9); }
.alert-title { font-size: 12.5px; font-weight: 700; color: var(--n10); }
.alert-desc { font-size: 11.5px; color: var(--n7); margin-top: 2px; }

.mini-settlement-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--n3); font-size: 12.5px; }
.mini-settlement-row:last-child { border-bottom: none; }
.mini-settlement-row span { color: var(--n7); }
.mini-settlement-row b { color: var(--n10); }

/* master-detail (cost-data) */
.master-detail { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
.item-search { display: flex; align-items: center; gap: 8px; background: var(--n0); border: 1px solid var(--n3); border-radius: 12px; padding: 9px 14px; margin-bottom: 12px; }
.item-search input { flex: 1; background: none; border: none; outline: none; font-size: 13px; color: var(--n10); }
.item-list { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow-y: auto; }
.item-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; text-align: left; width: 100%; }
.item-row:hover { background: var(--n2); }
.item-row.active { background: var(--m50); border: 1px solid var(--m200); }
.item-avatar { width: 34px; height: 34px; border-radius: 10px; background: var(--n2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--n8); flex-shrink: 0; }
.item-row.active .item-avatar { background: var(--m100); color: var(--n10); }
.item-info b { font-size: 12.5px; color: var(--n9); display: block; }
.item-info span { font-size: 11px; color: var(--n7); }
.item-tag { margin-left: auto; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--n2); color: var(--n8); font-weight: 700; }

.detail-panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.detail-price-box { display: flex; align-items: center; gap: 10px; background: var(--n0); border: 1px solid var(--n3); border-radius: 14px; padding: 16px 20px; margin-bottom: 18px; }
.price-input { font-size: 22px; font-weight: 800; color: var(--n10); background: none; border: none; outline: none; width: 130px; }
.price-recalc-btn { margin-left: auto; }
.spin-icon { display: inline-block; animation: spinLoader .8s linear infinite; }

.field-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.field-table th { text-align: left; font-size: 11.5px; color: var(--n7); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--n3); text-transform: uppercase; letter-spacing: .04em; }
.field-table td { font-size: 13px; padding: 12px; border-bottom: 1px solid var(--n2); color: var(--n9); }
.field-table tr:hover td { background: var(--n0); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.badge.ok { background: var(--s1-bg); color: var(--s1-text); }
.badge.warn { background: var(--n2); color: var(--n9); }
.badge.linked { background: var(--n2); color: var(--n9); }
.badge.linked i { color: var(--m600); }

.recipe-link-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.recipe-link-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: var(--n0); border-radius: 10px; font-size: 12.5px; }
.recipe-link-row.flash { animation: countRise .5s ease-out; background: var(--m50); }

/* settlement */
.settlement-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
.qty-input-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--n2); }
.qty-input-row:last-child { border-bottom: none; }
.qty-input-row b { font-size: 13px; color: var(--n9); }
.qty-stepper { display: flex; align-items: center; gap: 8px; }
.qty-stepper button { width: 26px; height: 26px; border-radius: 8px; background: var(--n2); font-size: 15px; font-weight: 700; color: var(--n9); }
.qty-stepper button:hover { background: var(--n3); }
.qty-stepper span { font-size: 14px; font-weight: 700; width: 28px; text-align: center; }

.settle-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 16px 0; }
.settle-summary-box { background: var(--n0); border-radius: 14px; padding: 14px 16px; }
.settle-summary-box span { font-size: 11.5px; color: var(--n7); font-weight: 600; }
.settle-summary-box b { display: block; font-size: 19px; font-weight: 800; color: var(--n10); margin-top: 4px; }

.history-table-wrap { overflow-x: auto; }

/* notification */
.notif-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.send-mode-row { display: flex; gap: 10px; margin-bottom: 16px; }
.send-mode-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--n3); text-align: center; font-size: 13px; font-weight: 700; color: var(--n8); }
.send-mode-btn.active { border-color: var(--m600); background: var(--m50); color: var(--n9); }
.field-label { font-size: 12px; font-weight: 700; color: var(--n8); margin: 14px 0 6px; }
.field-input { width: 100%; padding: 10px 14px; border: 1px solid var(--n3); border-radius: 10px; font-size: 13px; color: var(--n10); outline: none; }
.field-input:focus { border-color: var(--m500); }
.notif-history-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--n2); font-size: 12.5px; }
.notif-history-row:last-child { border-bottom: none; }
.mission-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; background: var(--n0); margin-bottom: 8px; }
.mission-progress-bar { width: 90px; height: 6px; border-radius: 999px; background: var(--n3); overflow: hidden; }
.mission-progress-fill { height: 100%; background: var(--m600); border-radius: 999px; }

.skeleton { background: linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size: 400px 100%; animation: shimmerBar 1.4s ease-in-out infinite; border-radius: 8px; }

.toast { position: fixed; bottom: 26px; right: 26px; background: var(--n10); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastPop .25s ease-out; z-index: 999; }

@media (max-width: 980px) {
  .insight-board, .master-detail, .settlement-grid, .notif-grid { grid-template-columns: 1fr; }
  .widget-grid { grid-template-columns: 1fr; }
}
</style>
</head>

function Icon({ name, size }) {
  return <i className={'ti ' + name} style={{ fontSize: size || 17 }}></i>;
}

function Sparkline({ points, color }) {
  const w = 100, h = 28;
  const max = Math.max(...points), min = Math.min(...points);
  const norm = points.map((p, i) => {
    const x = (i / (points.length - 1)) * w;
    const y = h - ((p - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={norm} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function HeroChart() {
  const w = 640, h = 200;
  const salesPts = HISTORY.slice().reverse().map(h2 => h2.sales);
  const costPts = HISTORY.slice().reverse().map(h2 => h2.cost);
  const max = Math.max(...salesPts);
  const toPath = (pts) => pts.map((p, i) => {
    const x = (i / (pts.length - 1)) * w;
    const y = h - (p / max) * (h - 20) - 10;
    return `${i === 0 ? 'M' : 'L'}${x},${y}`;
  }).join(' ');
  return (
    <div className="hero-chart-wrap">
      <svg width="100%" height="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--m300)" stopOpacity="0.35" />
            <stop offset="100%" stopColor="var(--m300)" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={toPath(salesPts) + ` L${w},${h} L0,${h} Z`} fill="url(#areaFill)" />
        <path d={toPath(salesPts)} fill="none" stroke="var(--m600)" strokeWidth="3" strokeLinecap="round" style={{ strokeDasharray: 620, strokeDashoffset: 0, animation: 'drawLine 1.1s ease-out' }} />
        <path d={toPath(costPts)} fill="none" stroke="var(--n6)" strokeWidth="2" strokeDasharray="4 4" />
      </svg>
      <div className="hero-chart-legend">
        <div className="legend-item"><span className="legend-dot" style={{ background: 'var(--m600)' }}></span>매출</div>
        <div className="legend-item"><span className="legend-dot" style={{ background: 'var(--n6)' }}></span>원가</div>
      </div>
    </div>
  );
}

function Donut() {
  const data = [{ label: '원재료', v: 46, color: 'var(--m600)' }, { label: '부재료', v: 22, color: 'var(--m300)' }, { label: '고정비 배분', v: 32, color: 'var(--n4)' }];
  let acc = 0;
  const r = 42, cx = 50, cy = 50;
  const segs = data.map(d => {
    const start = acc / 100 * 2 * Math.PI - Math.PI / 2;
    acc += d.v;
    const end = acc / 100 * 2 * Math.PI - Math.PI / 2;
    const large = d.v > 50 ? 1 : 0;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
    return `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
  });
  return (
    <div className="donut-wrap">
      <svg width="100" height="100" viewBox="0 0 100 100">
        {segs.map((d, i) => <path key={i} d={d} fill={data[i].color} />)}
        <circle cx="50" cy="50" r="24" fill="var(--n1)" />
      </svg>
      <div className="donut-legend">
        {data.map((d, i) => (
          <div className="donut-legend-row" key={i}>
            <span className="legend-dot" style={{ background: d.color }}></span>{d.label}<b>{d.v}%</b>
          </div>
        ))}
      </div>
    </div>
  );
}

const TITLES = {
  main: { title: '원가·마진율 대시보드', meta: '오늘 09:12 기준 · 실시간 자동 갱신' },
  'cost-data': { title: '원재료·부재료·중간재 관리', meta: '단가 변경 시 연결 메뉴 원가가 자동 재계산됩니다' },
  settlement: { title: '판매량 입력 및 일일정산', meta: '메뉴별 판매량을 입력하면 정산이 즉시 계산됩니다' },
  notification: { title: 'FCM 푸시 · 고정 미션', meta: '즉시/예약 발송과 미션 완료 현황을 관리합니다' },
};

function App() {
  const [screen, setScreen] = useState('main');
  const [period, setPeriod] = useState('오늘');
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2400); };
  const t = TITLES[screen];

  return (
    <div data-archetype="stripe-multipane">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-mark"><Icon name="ti-coffee" size={18} /></div>
          <div className="brand-text"><b>카페인사이트</b><span>원가·마진 관리 시스템</span></div>
        </div>
        <div className="env-selector"><span className="live-dot"></span>운영 매장 · 본점</div>
        <nav className="sidebar-nav">
          {NAV.map(group => (
            <div key={group.group}>
              <div className="sidebar-section-title">{group.group}</div>
              {group.items.map(item => (
                <button key={item.id} className={'sidebar-link' + (screen === item.id ? ' active' : '')} onClick={() => setScreen(item.id)}>
                  <Icon name={item.icon} />
                  {item.label}
                  {item.badge && <span className="sidebar-badge">{item.badge}</span>}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="avatar-circle">사</div>
          <div className="sidebar-footer-text"><b>사장님</b><span>본점 관리자</span></div>
        </div>
      </aside>
      <div className="main-area">
        <div className="page-header">
          <div className="page-title-row">
            <div>
              <div className="page-title">{t.title}</div>
              <div className="page-meta">{t.meta}</div>
            </div>
            <div className="page-actions">
              <button className="btn-secondary" onClick={() => toast('원가·정산 데이터를 CSV로 내보냈습니다')}><Icon name="ti-download" size={15} />내보내기</button>
              <button className="btn-primary" onClick={() => toast('새 항목 등록 폼이 열렸습니다')}><Icon name="ti-plus" size={15} />새로 등록</button>
            </div>
          </div>
        </div>
        {screen === 'main' && <MainScreen period={period} setPeriod={setPeriod} toast={toast} />}
        {screen === 'cost-data' && <CostDataScreen toast={toast} />}
        {screen === 'settlement' && <SettlementScreen toast={toast} />}
        {screen === 'notification' && <NotificationScreen toast={toast} />}
      </div>
      {toastMsg && <div className="toast"><Icon name="ti-info-circle" size={15} />{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
