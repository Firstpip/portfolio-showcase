<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카페인사이트 멀티매장 통합 관제 플랫폼 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, light) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#1c2b48;
  --n0:#ffffff; --n1:#f4f4f5; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#95979e; --n7:#71747a; --n8:#53565a; --n9:#36373a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { width: 100%; min-height: 100%; }
body {
  font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  background: var(--n0);
  color: var(--n10);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
::selection { background: var(--m200); }

@keyframes livePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(71,107,179,.4); } 50% { box-shadow: 0 0 0 6px rgba(71,107,179,0); } }
@keyframes spinLoad { to { transform: rotate(360deg); } }
@keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes queuePop { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shimmerSweep { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }

/* ── topbar-analytics: NO aside / NO .sidebar anywhere ── */
[data-archetype="topbar-analytics"] { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }

.app-header {
  position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 20px;
  padding: 0 28px; background: var(--n0); border-bottom: 1px solid var(--n3);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; color: var(--n10); }
.brand-icon { width: 30px; height: 30px; border-radius: 9px; background: var(--m600); color: #fff; display: flex; align-items: center; justify-content: center; }
.project-switcher { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; background: var(--n2); font-size: 12.5px; font-weight: 700; color: var(--n9); }
.global-nav { display: flex; gap: 4px; margin-left: 8px; }
.nav-link { padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--n7); }
.nav-link:hover { background: var(--n2); color: var(--n10); }
.nav-link.active { background: var(--m50); color: var(--n10); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.header-icon-btn { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--n7); position: relative; }
.header-icon-btn:hover { background: var(--n2); }
.header-icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--s2); }
.header-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--m100); color: var(--m700); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }

.tab-bar { display: flex; gap: 2px; padding: 0 28px; border-bottom: 1px solid var(--n3); background: var(--n0); position: sticky; top: 60px; z-index: 19; }
.tab { padding: 13px 16px; font-size: 13px; font-weight: 700; color: var(--n7); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--n10); }
.tab.active { color: var(--n10); border-bottom-color: var(--m600); }

.content { max-width: 1280px; margin: 0 auto; width: 100%; padding: 24px 28px 56px; flex: 1; }
.content-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.content-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.content-sub { font-size: 12.5px; color: var(--n7); margin-top: 3px; }
.btn-primary { background: var(--m600); color: #fff; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 12px; display: flex; align-items: center; gap: 7px; }
.btn-primary:hover { background: var(--m700); }
.btn-outline { background: var(--n0); border: 1px solid var(--n4); color: var(--n9); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 12px; display: flex; align-items: center; gap: 7px; }
.btn-outline:hover { background: var(--n2); }
.btn-outline.active { border-color: var(--m600); color: var(--n9); background: var(--m50); }

.aurora-strip { height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--m200), var(--m600) 55%, var(--m800)); margin-bottom: 16px; }
.hero-display { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; color: var(--n10); }
.hero-display span { font-size: 13px; font-weight: 700; color: var(--n7); margin-left: 10px; vertical-align: middle; }
.hero-display span i { color: var(--s1); margin-right: 3px; }

/* status-strip */
.status-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
.status-chip { flex-shrink: 0; min-width: 168px; background: var(--n1); border: 1px solid var(--n3); border-radius: 14px; padding: 13px 16px; animation: fadeSlide .35s ease-out; }
.status-chip .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--s1); margin-right: 6px; animation: livePulse 2s infinite; }
.status-chip.alert .live-dot { background: var(--s2); animation: none; }
.status-chip-name { font-size: 12.5px; font-weight: 700; color: var(--n10); }
.status-chip-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--n7); margin-top: 6px; }
.status-chip-row b { color: var(--n9); font-size: 12px; }

.command-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; margin-bottom: 18px; }
.card { background: var(--n1); border: 1px solid var(--n3); border-radius: 16px; padding: 22px; transition: transform 140ms ease-out; }
.card:hover { transform: scale(1.012); }
.card-title { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.card-sub { font-size: 12px; color: var(--n7); margin-bottom: 14px; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 4px; }
.stat-card { background: var(--n0); border: 1px solid var(--n3); border-radius: 12px; padding: 14px 16px; }
.stat-label { font-size: 11px; color: var(--n7); font-weight: 600; }
.stat-value { font-size: 24px; font-weight: 800; margin-top: 5px; letter-spacing: -0.02em; }
.stat-delta { font-size: 11.5px; font-weight: 700; margin-top: 3px; }
.stat-delta.up, .stat-delta.down { color: var(--n8); }

.priority-rail { display: flex; flex-direction: column; gap: 10px; }
.queue-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 12px; background: var(--n0); border: 1px solid var(--n3); animation: queuePop .3s ease-out; }
.queue-row.critical { border-color: var(--s2); background: var(--s2-bg); }
.queue-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--s2-bg); color: var(--s2-text); }
.queue-icon.warn { background: var(--s3-bg); color: var(--s3-text); }
.queue-title { font-size: 12.5px; font-weight: 700; color: var(--n10); }
.queue-desc { font-size: 11.5px; color: var(--n7); margin-top: 2px; }
.queue-action { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--n8); flex-shrink: 0; }

.secondary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.report-progress-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--n3); font-size: 12.5px; }
.report-progress-row:last-child { border-bottom: none; }
.mini-bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 60px; margin-top: 6px; }
.mini-bar { flex: 1; background: var(--m400); border-radius: 4px 4px 0 0; transform-origin: bottom; animation: barGrow .5s ease-out; }

.data-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--n4); font-size: 12px; font-weight: 600; color: var(--n8); background: var(--n0); }
.chip.active { border-color: var(--m600); background: var(--m50); color: var(--n9); }

.cross-table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 11px; color: var(--n7); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; border-bottom: 1px solid var(--n3); }
.data-table td { font-size: 13px; padding: 12px; border-bottom: 1px solid var(--n2); color: var(--n9); }
.data-table tr:hover td { background: var(--n0); }
.rank-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.rank-badge.top { background: var(--s1-bg); color: var(--s1-text); }
.rank-badge.bottom { background: var(--s2-bg); color: var(--s2-text); }

.combo-chart { height: 200px; margin-top: 10px; }

.report-form-row { display: flex; gap: 10px; margin-bottom: 14px; }
.report-type-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--n3); background: var(--n0); text-align: center; font-size: 13px; font-weight: 700; color: var(--n8); }
.report-type-btn.active { border-color: var(--m600); background: var(--m50); color: var(--n9); }
.queue-list-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--n0); border: 1px solid var(--n3); margin-bottom: 8px; }
.queue-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.queue-status-dot.wait { background: var(--n5); }
.queue-status-dot.processing { background: var(--s3); animation: livePulse 1.4s infinite; }
.queue-status-dot.done { background: var(--s1); }
.spin-icon { display: inline-block; animation: spinLoad .8s linear infinite; }

.heatmap-grid { display: grid; grid-template-columns: 120px repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.heatmap-cell { aspect-ratio: 1.4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--n9); }
.heatmap-label { font-size: 11.5px; color: var(--n8); font-weight: 600; display: flex; align-items: center; }
.heatmap-col-label { font-size: 10.5px; color: var(--n7); font-weight: 700; text-align: center; }

.participant-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--n3); font-size: 12.5px; }
.participant-row:last-child { border-bottom: none; }
.participant-rank { width: 22px; height: 22px; border-radius: 7px; background: var(--m100); color: var(--m700); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

.toggle-switch { display: flex; align-items: center; gap: 8px; }
.toggle-track { width: 40px; height: 22px; border-radius: 999px; background: var(--n4); position: relative; transition: background .15s; }
.toggle-track.on { background: var(--m600); }
.toggle-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle-track.on .toggle-thumb { left: 20px; }

.toast { position: fixed; bottom: 26px; right: 26px; background: var(--n10); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toastIn .25s ease-out; z-index: 999; }

@media (max-width: 980px) {
  .command-grid, .secondary-grid, .stat-row, .heatmap-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const STORES = [
  { name: '본점', sales: '3.4M', cost: 31.3, margin: 68.7, alert: false },
  { name: '강남점', sales: '2.8M', cost: 34.1, margin: 65.9, alert: false },
  { name: '홍대점', sales: '2.1M', cost: 41.8, margin: 58.2, alert: true },
  { name: '판교점', sales: '1.9M', cost: 33.0, margin: 67.0, alert: false },
  { name: '수원점', sales: '1.6M', cost: 30.2, margin: 69.8, alert: false },
  { name: '분당점', sales: '1.4M', cost: 38.4, margin: 61.6, alert: true },
];

const QUEUE = [
  { title: '홍대점 원가율 41.8% (임계 35% 초과)', desc: '최근 3일 연속 상승 — 원재료 단가 확인 필요', level: 'critical' },
  { title: '분당점 정산 지연 2일', desc: '09/12 이후 일일정산 미입력 상태', level: 'critical' },
  { title: '판교점 재고 확인 요청', desc: '유기농 우유 재고 임박', level: 'warn' },
];

const CROSS = [
  { store: '본점', menu: '아메리카노', sales: 279000, cost: 55800, rank: 'top' },
  { store: '본점', menu: '카페라떼', sales: 249600, cost: 69600, rank: 'top' },
  { store: '강남점', menu: '바닐라라떼', sales: 156600, cost: 53460, rank: 'bottom' },
  { store: '홍대점', menu: '콜드브루라떼', sales: 104500, cost: 32680, rank: 'bottom' },
  { store: '판교점', menu: '크루아상', sales: 63000, cost: 21750, rank: 'top' },
  { store: '수원점', menu: '아메리카노', sales: 211500, cost: 42300, rank: 'top' },
];

const REPORTS_QUEUE = [
  { store: '본점', type: '일간', status: 'done' },
  { store: '강남점', type: '일간', status: 'processing' },
  { store: '홍대점', type: '주간', status: 'processing' },
  { store: '판교점', type: '일간', status: 'wait' },
  { store: '수원점', type: '월간', status: 'wait' },
];

const MISSION_MATRIX = {
  rows: ['재고 실사', '정산 마감확인', '유통기한 표시', '위생 체크리스트'],
  cols: STORES.slice(0, 5).map(s => s.name),
  values: [
    [92, 88, 61, 95, 84],
    [97, 90, 73, 98, 91],
    [78, 82, 55, 88, 76],
    [85, 79, 68, 90, 80],
  ],
};

const TOP_PARTICIPANTS = [
  { name: '판교점', score: 95 },
  { name: '본점', score: 92 },
  { name: '강남점', score: 88 },
  { name: '수원점', score: 84 },
];

function Icon({ name, size, weight }) {
  return <i className={'ph' + (weight ? '-' + weight : '') + ' ph-' + name} style={{ fontSize: size || 17 }}></i>;
}

function heatColor(v) {
  if (v >= 90) return 'var(--s1-bg)';
  if (v >= 75) return 'var(--n2)';
  return 'var(--s3-bg)';
}
function heatText(v) {
  if (v >= 90) return 'var(--s1-text)';
  if (v >= 75) return 'var(--n9)';
  return 'var(--s3-text)';
}

function ComboChart() {
  const w = 640, h = 180;
  const bars = [62, 58, 71, 49, 66, 74, 68];
  const line = [40, 42, 38, 45, 41, 37, 39];
  const maxB = Math.max(...bars), maxL = Math.max(...line);
  const linePath = line.map((v, i) => {
    const x = (i / (line.length - 1)) * w;
    const y = h - (v / maxL) * (h - 30) - 10;
    return `${i === 0 ? 'M' : 'L'}${x},${y}`;
  }).join(' ');
  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" className="combo-chart">
      {bars.map((b, i) => {
        const bw = w / bars.length - 14;
        const x = i * (w / bars.length) + 7;
        const bh = (b / maxB) * (h - 30);
        return <rect key={i} x={x} y={h - bh} width={bw} height={bh} rx="4" fill="var(--m300)" />;
      })}
      <path d={linePath} fill="none" stroke="var(--m700)" strokeWidth="2.5" strokeLinecap="round" />
    </svg>
  );
}

function MainScreen({ toast }) {
  return (
    <div className="content">
      <div className="content-head">
        <div><div className="content-title">멀티매장 통합 관제</div><div className="content-sub">6개 매장의 매출·원가·마진 현황을 실시간으로 비교합니다</div></div>
        <button className="btn-outline" onClick={() => toast('전체 매장 리포트를 새로고침했습니다')}><Icon name="arrows-clockwise" size={15} />새로고침</button>
      </div>
      <div className="aurora-strip"></div>
      <div className="hero-display">₩13.2M<span><i className="ph ph-trend-up"></i>네트워크 합산 매출 · 전주 대비 +3.1%</span></div>
      <div className="status-strip" style={{ marginTop: 14 }}>
        {STORES.map(s => (
          <div className={'status-chip' + (s.alert ? ' alert' : '')} key={s.name}>
            <div className="status-chip-name"><span className="live-dot"></span>{s.name}</div>
            <div className="status-chip-row"><span>매출</span><b>₩{s.sales}</b></div>
            <div className="status-chip-row"><span>원가율</span><b style={{ color: s.alert ? 'var(--s2-text)' : 'var(--n9)' }}>{s.cost}%</b></div>
            <div className="status-chip-row"><span>마진율</span><b>{s.margin}%</b></div>
          </div>
        ))}
      </div>
      <div className="command-grid">
        <div className="card">
          <div className="card-title"><Icon name="chart-line-up" />네트워크 매출·원가 추이 (7일)</div>
          <div className="card-sub">전 매장 합산 기준 · 막대: 매출지수 / 선: 원가지수</div>
          <div className="stat-row">
            <div className="stat-card" style={{ borderRadius: 10, boxShadow: '0 1px 4px rgba(30,30,32,0.05)' }}><div className="stat-label">합산 매출</div><div className="stat-value">₩13.2M</div><div className="stat-delta up">+3.1%</div></div>
            <div className="stat-card"><div className="stat-label">평균 원가율</div><div className="stat-value">34.8%</div><div className="stat-delta down">-0.9%p</div></div>
            <div className="stat-card"><div className="stat-label">평균 마진율</div><div className="stat-value">65.2%</div><div className="stat-delta up">+0.9%p</div></div>
            <div className="stat-card"><div className="stat-label">이상 매장</div><div className="stat-value">2곳</div><div className="stat-delta down">주의 필요</div></div>
          </div>
          <ComboChart />
        </div>
        <div className="card">
          <div className="card-title"><Icon name="warning-circle" weight="fill" />우선 대응 큐</div>
          <div className="card-sub">원가율 급등·정산 지연 매장이 자동으로 노출됩니다</div>
          <div className="priority-rail">
            {QUEUE.map((q, i) => (
              <div className={'queue-row' + (q.level === 'critical' ? ' critical' : '')} key={i}>
                <div className={'queue-icon' + (q.level === 'warn' ? ' warn' : '')}><Icon name={q.level === 'critical' ? 'fire' : 'package'} size={16} /></div>
                <div><div className="queue-title">{q.title}</div><div className="queue-desc">{q.desc}</div></div>
                <button className="queue-action" onClick={() => toast(q.title.split(' ')[0] + ' 상세 화면으로 드릴다운합니다')}>상세 →</button>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="secondary-grid">
        <div className="card">
          <div className="card-title"><Icon name="file-pdf" />정산 리포트 생성 현황</div>
          {REPORTS_QUEUE.map((r, i) => (
            <div className="report-progress-row" key={i}>
              <span className={'queue-status-dot ' + r.status}></span>
              <span style={{ flex: 1 }}>{r.store} · {r.type}</span>
              <span style={{ color: 'var(--n7)' }}>{r.status === 'done' ? '완료' : r.status === 'processing' ? '처리중' : '대기'}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title"><Icon name="flag-checkered" />미션 참여 미니 현황</div>
          <div className="mini-bar-chart">
            {STORES.map((s, i) => <div className="mini-bar" key={s.name} style={{ height: (30 + i * 8) + 'px', animationDelay: (i * 0.05) + 's' }}></div>)}
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
            {STORES.map(s => <span key={s.name} style={{ fontSize: 10.5, color: 'var(--n7)' }}>{s.name.slice(0, 2)}</span>)}
          </div>
        </div>
      </div>
    </div>
  );
}

function AnalyticsScreen({ toast }) {
  const [storeFilter, setStoreFilter] = useState('전체');
  const filtered = CROSS.filter(c => storeFilter === '전체' || c.store === storeFilter);
  return (
    <div className="content">
      <div className="content-head">
        <div><div className="content-title">매장별 매출·원가 분석 리포트</div><div className="content-sub">매장·기간·메뉴 축으로 교차 분석하고 수익성을 비교합니다</div></div>
        <button className="btn-primary" onClick={() => toast('현재 조건으로 리포트를 내보냈습니다')}><Icon name="export" size={15} />리포트 내보내기</button>
      </div>
      <div className="card">
        <div className="data-toolbar">
          {['전체', ...STORES.map(s => s.name)].map(s => (
            <button key={s} className={'chip' + (storeFilter === s ? ' active' : '')} onClick={() => setStoreFilter(s)}>{s}</button>
          ))}
        </div>
        <div className="cross-table-wrap">
          <table className="data-table">
            <thead><tr><th>매장</th><th>메뉴</th><th>매출</th><th>원가</th><th>마진율</th><th>전월대비</th><th>순위</th></tr></thead>
            <tbody>
              {filtered.map((c, i) => {
                const marginPct = Math.round((1 - c.cost / c.sales) * 100);
                return (
                  <tr key={i}>
                    <td>{c.store}</td>
                    <td>{c.menu}</td>
                    <td>₩{c.sales.toLocaleString()}</td>
                    <td>₩{c.cost.toLocaleString()}</td>
                    <td>{marginPct}%</td>
                    <td style={{ color: c.rank === 'top' ? 'var(--s1-text)' : 'var(--s2-text)' }}>{c.rank === 'top' ? '+2.4%p' : '-1.6%p'}</td>
                    <td><span className={'rank-badge ' + c.rank}>{c.rank === 'top' ? '상위권' : '하위권'}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function ReportsScreen({ toast }) {
  const [type, setType] = useState('일간');
  const [queue, setQueue] = useState(REPORTS_QUEUE);
  const [requesting, setRequesting] = useState(false);
  const request = () => {
    setRequesting(true);
    setTimeout(() => {
      setQueue(q => [{ store: '전체 매장', type, status: 'processing' }, ...q]);
      setRequesting(false);
      toast(type + ' 정산 리포트 생성이 큐에 등록되었습니다');
    }, 800);
  };
  return (
    <div className="content">
      <div className="content-head">
        <div><div className="content-title">정산 리포트 자동 생성</div><div className="content-sub">일/주/월 단위로 매장별 정산 리포트를 비동기로 생성합니다</div></div>
      </div>
      <div className="secondary-grid">
        <div className="card">
          <div className="card-title"><Icon name="file-plus" />리포트 생성 요청</div>
          <div className="report-form-row">
            {['일간', '주간', '월간'].map(t => (
              <button key={t} className={'report-type-btn' + (type === t ? ' active' : '')} onClick={() => setType(t)}>{t}</button>
            ))}
          </div>
          <button className="btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={request} disabled={requesting}>
            {requesting ? <><span className="spin-icon"><Icon name="spinner-gap" size={15} /></span>큐 등록 중</> : <><Icon name="play" size={15} />전체 매장 리포트 생성</>}
          </button>
        </div>
        <div className="card">
          <div className="card-title"><Icon name="queue" />생성 큐 상태</div>
          {queue.map((r, i) => (
            <div className="queue-list-row" key={i}>
              <span className={'queue-status-dot ' + r.status}></span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12.5, fontWeight: 700 }}>{r.store} · {r.type} 정산 리포트</div>
                <div style={{ fontSize: 11, color: 'var(--n7)' }}>{r.status === 'done' ? '완료 · 다운로드 가능' : r.status === 'processing' ? '처리 중' : '대기 중'}</div>
              </div>
              {r.status === 'done' && <button className="btn-outline" onClick={() => toast(r.store + ' 리포트를 다운로드합니다')}><Icon name="download-simple" size={14} />PDF</button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MissionsScreen({ toast }) {
  const [normalized, setNormalized] = useState(true);
  return (
    <div className="content">
      <div className="content-head">
        <div><div className="content-title">미션 성과 분석</div><div className="content-sub">매장별 고정 미션 참여·완료 추이를 비교합니다</div></div>
        <div className="toggle-switch">
          <span style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--n8)' }}>매장 규모 정규화</span>
          <button className={'toggle-track' + (normalized ? ' on' : '')} onClick={() => { setNormalized(!normalized); toast(normalized ? '원본 완료 건수로 전환했습니다' : '매장 규모 정규화 지표로 전환했습니다'); }}>
            <span className="toggle-thumb"></span>
          </button>
        </div>
      </div>
      <div className="secondary-grid">
        <div className="card">
          <div className="card-title"><Icon name="squares-four" />매장×미션 완료 히트맵</div>
          <div className="heatmap-grid">
            <div></div>
            {MISSION_MATRIX.cols.map(c => <div className="heatmap-col-label" key={c}>{c}</div>)}
            {MISSION_MATRIX.rows.map((row, ri) => (
              <React.Fragment key={row}>
                <div className="heatmap-label">{row}</div>
                {MISSION_MATRIX.values[ri].map((v, ci) => {
                  const val = normalized ? v : Math.round(v * 0.2);
                  return <div className="heatmap-cell" key={ci} style={{ background: heatColor(v), color: heatText(v) }}>{normalized ? val + '%' : val}</div>;
                })}
              </React.Fragment>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-title"><Icon name="trophy" />참여 상위 매장</div>
          {TOP_PARTICIPANTS.map((p, i) => (
            <div className="participant-row" key={p.name}>
              <div className="participant-rank">{i + 1}</div>
              <span style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
              <span style={{ color: 'var(--n7)' }}>{p.score}점</span>
            </div>
          ))}
          <button className="btn-outline" style={{ width: '100%', justifyContent: 'center', marginTop: 12 }} onClick={() => toast('특정 미션을 선택해 참여 상위 매장을 확인합니다')}>
            <Icon name="funnel" size={14} />미션별 필터
          </button>
        </div>
      </div>
    </div>
  );
}

const NAV_LABELS = { main: '관제', analytics: '분석 리포트', reports: '정산 리포트', missions: '미션 성과' };

function App() {
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2400); };

  return (
    <div data-archetype="topbar-analytics">
      <header className="app-header">
        <div className="brand"><div className="brand-icon"><Icon name="buildings" size={16} /></div>카페인사이트 관제</div>
        <div className="project-switcher"><Icon name="storefront" size={14} />전체 매장 (6) <Icon name="caret-down" size={12} /></div>
        <nav className="global-nav">
          {Object.entries(NAV_LABELS).map(([id, label]) => (
            <button key={id} className={'nav-link' + (screen === id ? ' active' : '')} onClick={() => setScreen(id)}>{label}</button>
          ))}
        </nav>
        <div className="header-actions">
          <button className="header-icon-btn" onClick={() => toast('검색 팔레트를 엽니다')}><Icon name="magnifying-glass" size={17} /></button>
          <button className="header-icon-btn" onClick={() => toast('읽지 않은 알림 3건이 있습니다')}><Icon name="bell" size={17} /><span className="dot"></span></button>
          <div className="header-avatar">본사</div>
        </div>
      </header>
      <nav className="tab-bar" role="tablist">
        <button role="tab" aria-selected={screen === 'main'} className={'tab' + (screen === 'main' ? ' active' : '')} onClick={() => setScreen('main')}>멀티매장 통합 관제 대시보드</button>
        <button role="tab" aria-selected={screen === 'analytics'} className={'tab' + (screen === 'analytics' ? ' active' : '')} onClick={() => setScreen('analytics')}>매장별 매출·원가 분석 리포트</button>
        <button role="tab" aria-selected={screen === 'reports'} className={'tab' + (screen === 'reports' ? ' active' : '')} onClick={() => setScreen('reports')}>정산 리포트 자동 생성</button>
        <button role="tab" aria-selected={screen === 'missions'} className={'tab' + (screen === 'missions' ? ' active' : '')} onClick={() => setScreen('missions')}>미션 성과 분석</button>
      </nav>
      {screen === 'main' && <MainScreen toast={toast} />}
      {screen === 'analytics' && <AnalyticsScreen toast={toast} />}
      {screen === 'reports' && <ReportsScreen toast={toast} />}
      {screen === 'missions' && <MissionsScreen toast={toast} />}
      {toastMsg && <div className="toast"><Icon name="info" size={15} />{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
