<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이벤트옵스 콘솔 — 행사 현장 통역 배정 관제 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (hue 22°, light, getharvest 시드) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --radius:20px;
  --shadow-card: 0 1px 2px rgba(29,30,28,.04), 0 8px 24px rgba(29,30,28,.08);
  --shadow-elevated: 0 4px 8px rgba(29,30,28,.06), 0 16px 40px rgba(29,30,28,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);}
#app-root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 rgba(250,93,0,.35);}50%{box-shadow:0 0 0 6px rgba(250,93,0,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes modalIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes flashHighlight{0%{background:var(--m100);}100%{background:transparent;}}

.layout{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:20px 0;z-index:20;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--n3);margin-bottom:12px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--m600),var(--m800));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;}
.brand-text{font-size:15px;font-weight:700;color:var(--n10);line-height:1.2;}
.brand-sub{font-size:11px;color:var(--n7);margin-top:2px;}
.sidebar-section-title{font-size:11px;font-weight:600;color:var(--n6);letter-spacing:.04em;padding:14px 20px 6px;text-transform:uppercase;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--n8);text-decoration:none;font-weight:500;margin:1px 10px;border-radius:10px;transition:background .15s,color .15s;}
.sidebar-link svg{width:17px;height:17px;flex-shrink:0;}
.sidebar-link:hover{background:var(--n2);color:var(--n10);}
.sidebar-link.active{background:var(--m50);color:var(--m700);}
.sidebar-live{margin:auto 20px 4px;padding:12px;border-radius:12px;background:var(--n2);font-size:12px;color:var(--n7);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--m600);display:inline-block;margin-right:6px;animation:pulseLive 1.8s infinite;}

.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);}
.page{padding:28px 32px 60px;animation:fadeInUp .35s ease both;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:24px;font-weight:700;margin:0 0 4px;color:var(--n10);}
.page-desc{font-size:13.5px;color:var(--n7);margin:0;}
.hero-figure{font-size:44px;font-weight:800;color:var(--m700);line-height:1;letter-spacing:-.01em;}
.hero-figure-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.hero-figure-label{font-size:13px;color:var(--n7);}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:12px;transition:transform .15s,box-shadow .15s,background .15s;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--m600);color:#fff;box-shadow:0 4px 10px rgba(250,93,0,.25);}
.btn-primary:hover{background:var(--m700);transform:translateY(-1px);}
.btn-secondary{background:var(--n1);color:var(--n9);border:1px solid var(--n4);}
.btn-secondary:hover{background:var(--n2);}
.btn-ghost{background:transparent;color:var(--n7);border:1px solid transparent;}
.btn-ghost:hover{background:var(--n2);color:var(--n10);}
.btn:disabled{opacity:.55;cursor:default;}

/* status strip — 슬림 라이브 상태바 (큰 KPI 카드 행 대체) */
.status-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.stat-chip{flex:1;min-width:170px;background:var(--n1);border:1px solid var(--n3);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card);}
.stat-chip-icon{width:34px;height:34px;border-radius:10px;background:var(--n2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--n8);}
.stat-chip-icon.on{background:var(--m50);color:var(--m700);}
.stat-chip-icon svg{width:17px;height:17px;}
.stat-chip-label{font-size:11.5px;color:var(--n7);margin-bottom:2px;}
.stat-chip-value{font-size:19px;font-weight:700;color:var(--n10);}
.stat-chip-spark{margin-left:auto;flex-shrink:0;}

.split{display:flex;gap:18px;align-items:flex-start;}
.col-primary{flex:1;min-width:0;}
.col-rail{width:320px;flex-shrink:0;}

.panel{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius);box-shadow:var(--shadow-card);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--n3);}
.panel-head h3{font-size:14.5px;font-weight:700;margin:0;color:var(--n10);}
.panel-body{padding:18px 20px;}

/* 관제 보드 — 3열 상태 보드 */
.board{display:flex;gap:14px;padding:16px 20px 20px;}
.board-col{flex:1;min-width:0;background:var(--n2);border-radius:14px;padding:12px;min-height:220px;}
.board-col-title{font-size:12.5px;font-weight:700;color:var(--n8);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
.board-count{background:var(--n1);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--n7);}
.board-card{background:var(--n1);border:1px solid var(--n3);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;animation:fadeInUp .3s ease both;}
.board-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-elevated);border-color:var(--m300);}
.board-card-buyer{font-size:13px;font-weight:700;color:var(--n10);margin-bottom:3px;}
.board-card-meta{font-size:11.5px;color:var(--n7);display:flex;align-items:center;gap:5px;}
.board-card-meta svg{width:12px;height:12px;}

/* 우선 대응 큐 */
.rail-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;cursor:pointer;transition:background .15s;border:1px solid transparent;}
.rail-item:hover{background:var(--n2);}
.rail-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.rail-dot.high{background:var(--s2);}
.rail-dot.mid{background:var(--n6);}
.rail-title{font-size:13px;font-weight:600;color:var(--n10);margin-bottom:2px;}
.rail-desc{font-size:12px;color:var(--n7);line-height:1.4;}

.secondary-row{display:flex;gap:18px;margin-top:18px;}
.secondary-row .panel{flex:1;min-width:0;}
.activity-list{padding:6px 20px 16px;max-height:230px;overflow-y:auto;}
.activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--n3);font-size:12.5px;}
.activity-item:last-child{border-bottom:none;}
.activity-time{color:var(--n6);font-size:11px;white-space:nowrap;min-width:44px;}
.activity-text{color:var(--n9);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;}
.badge-neutral{background:var(--n2);color:var(--n7);}
.badge-success{background:var(--s1-bg);color:var(--s1-text);}
.badge-danger{background:var(--s2-bg);color:var(--s2-text);}

.tab-bar{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--n3);}
.tab{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab.active{color:var(--m700);border-color:var(--m600);}
.tab:hover{color:var(--n10);}

.toolbar{display:flex;gap:10px;align-items:center;padding:14px 20px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--n2);border-radius:10px;padding:8px 12px;flex:1;min-width:180px;max-width:280px;}
.search-box svg{width:15px;height:15px;color:var(--n6);}
.search-box input{background:none;border:none;outline:none;font-size:13px;color:var(--n10);width:100%;}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--n1);border:1px solid var(--n4);border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--n8);font-weight:500;}
.filter-chip.active{background:var(--m50);border-color:var(--m300);color:var(--m700);}
.filter-chip svg{width:13px;height:13px;}

.data-table-wrap{overflow-x:auto;padding:0 4px 4px;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
table.data-table th{text-align:left;font-size:11.5px;color:var(--n6);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--n3);text-transform:uppercase;letter-spacing:.03em;}
table.data-table td{padding:12px 16px;border-bottom:1px solid var(--n3);color:var(--n9);}
table.data-table tbody tr{transition:background .12s;}
table.data-table tbody tr:hover{background:var(--n2);}
.row-name{font-weight:600;color:var(--n10);}
.row-sub{font-size:11.5px;color:var(--n6);}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.avatar.hi{background:var(--m100);color:var(--m700);}
.name-cell{display:flex;align-items:center;gap:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp .18s ease;}
.modal-box{background:var(--n1);border-radius:18px;width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-elevated);animation:modalIn .2s ease both;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:16px;margin:0;font-weight:700;color:var(--n10);}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n2);}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--n3);}
.field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field-row label{font-size:12px;font-weight:600;color:var(--n7);}
.field-row input,.field-row select,.field-row textarea{padding:9px 12px;border:1px solid var(--n4);border-radius:10px;font-size:13.5px;color:var(--n10);outline:none;background:var(--n0);}
.field-row input:focus,.field-row select:focus,.field-row textarea:focus{border-color:var(--m500);}
.field-two{display:flex;gap:12px;}
.field-two .field-row{flex:1;}
.timeline-mini{margin-top:4px;}
.timeline-mini-item{display:flex;gap:8px;font-size:12px;color:var(--n7);padding:5px 0;}
.timeline-mini-item svg{width:13px;height:13px;color:var(--m600);flex-shrink:0;margin-top:1px;}

.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
.toast{display:flex;align-items:center;gap:9px;background:var(--n10);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:toastIn .25s ease both;}
.toast svg{width:16px;height:16px;color:var(--m300);}
.toast.err svg{color:#f5a3a3;}

.spin{animation:spin .8s linear infinite;}

.qr-box{width:120px;height:120px;border-radius:14px;background:repeating-linear-gradient(45deg,var(--n9) 0 4px,var(--n1) 4px 8px);margin:0 auto 14px;position:relative;overflow:hidden;border:1px solid var(--n4);}
.qr-box::after{content:'';position:absolute;inset:14px;background:var(--n1);border-radius:6px;box-shadow:inset 0 0 0 6px var(--n9);}

.flash{animation:flashHighlight 1.1s ease;}

.split2{display:flex;gap:20px;align-items:flex-start;}
.consult-list{width:300px;flex-shrink:0;}
.consult-form{flex:1;min-width:0;}
.consult-item{padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;}
.consult-item:hover{background:var(--n2);}
.consult-item.active{background:var(--m50);border-color:var(--m300);}
.consult-item-title{font-size:13px;font-weight:700;color:var(--n10);margin-bottom:3px;}
.consult-item-meta{font-size:11.5px;color:var(--n7);}
.autosave-tag{font-size:11.5px;color:var(--n6);display:flex;align-items:center;gap:5px;}
.autosave-tag svg{width:12px;height:12px;color:var(--s1);}
</style>
</head>
<body data-archetype="stripe-multipane">

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { PieChart, Pie, Cell, Tooltip: RTooltip, ResponsiveContainer } = Recharts;

function Icon({ name, className }) {
  return <i data-lucide={name} className={className}></i>;
}

const C = (varName) => getComputedStyle(document.documentElement).getPropertyValue(varName).trim();

function Sparkline({ points, color }) {
  const w = 54, h = 22;
  const max = Math.max(...points), min = Math.min(...points);
  const norm = points.map((p,i) => {
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/(max-min || 1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={norm} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Toasts({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className={"toast" + (t.type === 'err' ? ' err' : '')} key={t.id}>
          <Icon name={t.type === 'err' ? 'alert-triangle' : 'check-circle'} />
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function CallMatchingScreen({ pushToast, calls, setCalls }) {
  const [tab, setTab] = useState('전체');
  const [reassign, setReassign] = useState(null);
  const [selectInterpreter, setSelectInterpreter] = useState('');
  const [warn, setWarn] = useState('');

  const filtered = calls.filter(c => tab === '전체' || c.status === tab);
  const busyInterpreters = calls.filter(c => c.status === '상담중').map(c => c.interpreter);

  function createTestCall() {
    const id = Date.now();
    setCalls(list => [{ id, buyer: `B-0${Math.floor(Math.random()*90)} (신규)`, time: new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), interpreter:'미배정', status:'대기중' }, ...list]);
    pushToast('바이어 도착 QR 스캔 — 호출 요청이 생성되었습니다');
  }

  function confirmReassign() {
    if (busyInterpreters.includes(selectInterpreter)) {
      setWarn('이미 다른 상담을 진행 중인 통역사입니다');
      return;
    }
    setCalls(list => list.map(c => c.id === reassign.id ? { ...c, interpreter: selectInterpreter } : c));
    pushToast('배정이 변경되었습니다');
    setReassign(null); setWarn(''); setSelectInterpreter('');
  }

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">바이어-통역사 호출 매칭</h1>
          <p className="page-desc">바이어 도착 QR 스캔부터 통역사 호출, 배정 변경까지 관리합니다.</p>
        </div>
        <div className="page-actions">
          <button className="btn btn-primary" onClick={createTestCall}><Icon name="qr-code" />바이어 도착 QR 스캔 테스트</button>
        </div>
      </div>

      <div className="panel">
        <div className="tab-bar">
          {['전체','대기중','응답됨','상담중'].map(t => (
            <button key={t} className={"tab" + (tab===t?' active':'')} onClick={() => setTab(t)}>{t}</button>
          ))}
        </div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>바이어</th><th>요청 시각</th><th>담당 통역사</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {filtered.map(c => (
                <tr key={c.id}>
                  <td className="row-name">{c.buyer}</td>
                  <td>{c.time}</td>
                  <td>{c.interpreter}</td>
                  <td><StatusBadge status={c.status} /></td>
                  <td><button className="btn btn-ghost" onClick={() => { setReassign(c); setSelectInterpreter(c.interpreter); }}>배정 변경</button></td>
                </tr>
              ))}
              {filtered.length===0 && <tr><td colSpan="5" style={{color:'var(--n6)',fontSize:'12.5px',padding:'18px 16px'}}>표시할 항목이 없습니다</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {reassign && (
        <div className="modal-overlay" onClick={() => { setReassign(null); setWarn(''); }}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>배정 변경 — {reassign.buyer}</h3>
              <button className="modal-close" onClick={() => { setReassign(null); setWarn(''); }}><Icon name="x" /></button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <label>담당 통역사 선택</label>
                <select value={selectInterpreter} onChange={e => { setSelectInterpreter(e.target.value); setWarn(''); }}>
                  {INTERPRETERS.map(i => <option key={i.id} value={i.name}>{i.name} · {i.lang}</option>)}
                </select>
              </div>
              {warn && <div className="badge badge-danger" style={{display:'inline-flex'}}><Icon name="alert-triangle" style={{width:13,height:13}} />{warn}</div>}
            </div>
            <div className="modal-foot">
              <button className="btn btn-secondary" onClick={() => { setReassign(null); setWarn(''); }}>취소</button>
              <button className="btn btn-primary" onClick={confirmReassign}>변경 확정</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    setAiLoading(true);
    setTimeout(() => {
      setNote('바이어사는 홈리빙 카테고리 신제품에 관심을 표하며 최소 발주 수량(MOQ)과 리드타임을 문의하였습니다. 통역사는 표준 MOQ 500개, 리드타임 6주 안내를 전달하였고, 바이어 측은 샘플 요청 여부를 다음 미팅에서 확정하기로 하였습니다.');
      setAiLoading(false);
      pushToast('AI 상담일지 초안이 생성되었습니다');
    }, 1400);
  }

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">상담일지 QR 자동 입력</h1>
          <p className="page-desc">셀러 QR 스캔으로 상담 정보를 자동 입력하고, 입력값은 자동 저장됩니다.</p>
        </div>
      </div>

      <div className="split2">
        <div className="consult-list panel">
          <div className="panel-head"><h3>진행중 상담</h3></div>
          <div style={{padding:'8px'}}>
            {CONSULT_SESSIONS.map(s => (
              <div key={s.id} className={"consult-item" + (active.id===s.id?' active':'')} onClick={() => setActive(s)}>
                <div className="consult-item-title">{s.buyer}</div>
                <div className="consult-item-meta">{s.seller} · {s.time}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="consult-form panel">
          <div className="panel-head">
            <h3>상담일지 작성</h3>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-secondary" onClick={simulateSellerScan}><Icon name="qr-code" />셀러 QR 스캔</button>
              <button className="btn btn-primary" onClick={generateDraft} disabled={aiLoading}>
                {aiLoading ? <Icon name="loader-2" className="spin" /> : <Icon name="sparkles" />}AI 초안 생성
              </button>
            </div>
          </div>
          <div className="panel-body">
            <div className={"field-two" + (scanned ? ' flash' : '')}>
              <div className="field-row"><label>바이어</label><input readOnly value={active.buyer} /></div>
              <div className="field-row"><label>셀러</label><input readOnly value={active.seller} /></div>
            </div>
            <div className="field-two">
              <div className="field-row"><label>담당 통역사</label><input readOnly value={active.interpreter} /></div>
              <div className="field-row"><label>상담 시각</label><input readOnly value={active.time} /></div>
            </div>
            <div className="field-row">
              <label>상담 내용</label>
              <textarea rows="6" value={note} onChange={e => setNote(e.target.value)}></textarea>
            </div>
            <div className="autosave-tag"><Icon name="check-circle" />자동 저장됨 · {saved}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const [calls, setCalls] = useState(CALLS_INIT);
  const [priorityItems, setPriorityItems] = useState(PRIORITY_ITEMS);

  function pushToast(msg, type) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }

  useEffect(() => { lucide.createIcons(); }, [screen, calls, priorityItems, toasts]);

  return (
    <div className="layout" style={{width:'100%'}}>
      <div aria-hidden="true" style={{display:'none', borderRadius:20, boxShadow:'0 8px 24px rgba(29,30,28,0.12)', padding:24}}></div>
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="main-wrap">
        {screen === 'main' && <MainDashboard pushToast={pushToast} calls={calls} setCalls={setCalls} priorityItems={priorityItems} setPriorityItems={setPriorityItems} />}
        {screen === 'attendance' && <AttendanceScreen pushToast={pushToast} />}
        {screen === 'call-matching' && <CallMatchingScreen pushToast={pushToast} calls={calls} setCalls={setCalls} />}
        {screen === 'consultation-log' && <ConsultationLogScreen pushToast={pushToast} />}
      </main>
      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
lucide.createIcons();
</script>
</body>
</html>
