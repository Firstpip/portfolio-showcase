<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이벤트옵스 허브 — 다중 행사 통합 운영 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (hue 220°, light, huly 시드) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#273b62;
  --n0:#ffffff; --n1:#e5e5e7; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#95979e; --n7:#71747a; --n8:#53565a; --n9:#36373a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius:12px;
  --shadow-card: 0 1px 2px rgba(30,30,32,.04), 0 2px 8px rgba(30,30,32,.05);
  --shadow-elevated: 0 6px 20px rgba(30,30,32,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;background:var(--n0);color:var(--n10);font-family:'Pretendard',-apple-system,sans-serif;}
#app-root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes toastSlide{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
@keyframes modalPop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes pillPulse{0%,100%{opacity:1;}50%{opacity:.45;}}

.top-layout{display:flex;flex-direction:column;width:100%;min-height:100vh;}
.topbar{width:100%;height:60px;background:var(--n0);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:20px;padding:0 24px;position:sticky;top:0;z-index:30;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--n10);flex-shrink:0;}
.brand-mark{width:28px;height:28px;border-radius:999px;background:linear-gradient(135deg,var(--m500),var(--m800));flex-shrink:0;}
.top-nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;}
.top-nav button{padding:9px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--n7);white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s;}
.top-nav button:hover{background:var(--n2);color:var(--n10);}
.top-nav button.active{background:var(--m50);color:var(--m700);}
.top-actions{display:flex;align-items:center;gap:10px;}
.event-switch{display:flex;align-items:center;gap:8px;background:var(--n2);border-radius:999px;padding:6px 14px 6px 8px;font-size:12.5px;font-weight:600;color:var(--n8);}
.event-dot{width:7px;height:7px;border-radius:50%;background:var(--m500);}
.avatar-round{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

main.body-area{flex:1;width:100%;background:var(--n2);}
.page{padding:26px 24px 60px;animation:fadeInUp .35s ease both;max-width:1280px;margin:0 auto;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:21px;font-weight:800;margin:0 0 4px;color:var(--n10);}
.page-desc{font-size:13px;color:var(--n7);margin:0;}
.hero-figure{font-size:46px;font-weight:800;color:var(--m600);line-height:1;letter-spacing:-.01em;}
.hero-figure-row{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
.hero-figure-label{font-size:12.5px;color:var(--n7);}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px;transition:transform .15s,background .15s;}
.btn i{font-size:15px;}
.btn-primary{background:var(--m500);color:#fff;box-shadow:0 3px 10px rgba(86,131,218,.28);}
.btn-primary:hover{background:var(--m600);}
.btn-secondary{background:var(--n0);color:var(--n9);border:1px solid var(--n4);}
.btn-secondary:hover{background:var(--n2);}
.btn-ghost{background:transparent;color:var(--n7);}
.btn-ghost:hover{color:var(--n10);}
.btn:disabled{opacity:.5;cursor:default;}

/* feed-timeline 시그니처 */
.feed-layout{display:flex;justify-content:center;gap:20px;align-items:flex-start;}
.feed-col{flex:1;max-width:600px;min-width:0;}
.right-rail{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}

.composer{position:sticky;top:76px;background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:14px;z-index:10;}
.composer-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.type-chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n7);}
.type-chip.on{background:var(--m50);color:var(--m700);}
.composer input{width:100%;border:1px solid var(--n4);border-radius:10px;padding:9px 12px;font-size:13px;outline:none;color:var(--n10);}
.composer input:focus{border-color:var(--m400);}
.composer-foot{display:flex;justify-content:flex-end;margin-top:10px;}

.post{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius);padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow-card);transition:box-shadow .15s;animation:fadeInUp .3s ease both;}
.post:hover{box-shadow:var(--shadow-elevated);}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.author{font-size:13.5px;font-weight:700;color:var(--n10);}
.post-head time{font-size:11.5px;color:var(--n6);margin-left:auto;}
.post-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.tag-attendance{background:var(--n2);color:var(--n7);}
.tag-call{background:var(--m50);color:var(--m700);}
.tag-issue{background:var(--s3-bg);color:var(--s3-text);}
.post-body{font-size:13.5px;color:var(--n9);line-height:1.55;margin-bottom:10px;}
.post-actions{display:flex;gap:16px;border-top:1px solid var(--n3);padding-top:9px;}
.post-actions button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--n7);font-weight:600;}
.post-actions button:hover{color:var(--m600);}
.post-actions button i{font-size:15px;}

.rail-card{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius);box-shadow:var(--shadow-card);}
.rail-card-head{padding:13px 15px;border-bottom:1px solid var(--n3);font-size:13px;font-weight:700;color:var(--n10);}
.rail-card-body{padding:12px 15px;}
.rail-stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;color:var(--n8);border-bottom:1px solid var(--n3);}
.rail-stat:last-child{border-bottom:none;}
.rail-stat strong{color:var(--n10);font-size:13.5px;}
.event-pill{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:10px;cursor:pointer;}
.event-pill:hover{background:var(--n2);}
.event-pill.active{background:var(--m50);}
.event-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--m500);}

.tab-bar{display:flex;gap:4px;margin-bottom:14px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;}
.tab.active{color:var(--m700);border-color:var(--m500);}
.tab:hover{color:var(--n10);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px;}
.metric-card{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-card);}
.metric-label{font-size:12px;color:var(--n7);margin-bottom:5px;}
.metric-value{font-size:22px;font-weight:800;color:var(--n10);}
.metric-delta{font-size:11.5px;font-weight:700;margin-top:3px;}
.metric-delta.up{color:var(--s1);}
.metric-delta.down{color:var(--s2);}

.panel{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius);box-shadow:var(--shadow-card);margin-bottom:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--n3);}
.panel-head h3{font-size:14px;font-weight:700;margin:0;color:var(--n10);}
.panel-body{padding:16px 18px;}

.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
select.pill-select{border:1px solid var(--n4);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--n8);background:var(--n0);outline:none;}

.chat-box{display:flex;flex-direction:column;gap:10px;padding:16px 18px;min-height:180px;}
.chat-msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
.chat-msg.ai{background:var(--n2);color:var(--n9);align-self:flex-start;}
.chat-msg.sys{background:var(--m50);color:var(--m800);align-self:flex-start;font-size:12px;font-weight:600;}
.chat-loading{display:flex;gap:4px;align-items:center;}
.chat-loading span{width:6px;height:6px;border-radius:50%;background:var(--n6);animation:pillPulse 1s infinite;}
.chat-loading span:nth-child(2){animation-delay:.15s;}
.chat-loading span:nth-child(3){animation-delay:.3s;}

.issue-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--n3);}
.issue-row:last-child{border-bottom:none;}
.issue-sla{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;flex-shrink:0;}
.sla-ok{background:var(--s1-bg);color:var(--s1-text);}
.sla-warn{background:var(--s3-bg);color:var(--s3-text);}
.sla-over{background:var(--s2-bg);color:var(--s2-text);}
.issue-title{font-size:13px;font-weight:700;color:var(--n10);}
.issue-meta{font-size:11.5px;color:var(--n7);}

.modal-overlay{position:fixed;inset:0;background:rgba(30,30,32,.42);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:var(--n0);border-radius:16px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-elevated);animation:modalPop .2s ease both;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--n3);}
.modal-head h3{margin:0;font-size:15px;font-weight:700;}
.modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n2);}
.modal-body{padding:18px 20px;font-size:13px;color:var(--n8);line-height:1.6;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--n3);}

.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{display:flex;align-items:center;gap:8px;background:var(--n10);color:#fff;padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.24);animation:toastSlide .25s ease both;}
.toast i{color:var(--m300);}
.toast.err i{color:#f5a3a3;}
.spin{animation:spin .8s linear infinite;display:inline-block;}
</style>
</head>
<body data-archetype="feed-timeline">
<div id="app-root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RTooltip, ResponsiveContainer } = Recharts;

const C = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function Toasts({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className={"toast" + (t.type === 'err' ? ' err' : '')} key={t.id}>
          <i className={"ph " + (t.type === 'err' ? 'ph-warning' : 'ph-check-circle')}></i>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

const EVENTS = [
  { id:'e1', name:'2026 수출상담회', active:true },
  { id:'e2', name:'2026 하계 바이어 데이', active:false },
  { id:'e3', name:'스마트제조 상담주간', active:false },
];

const NAV = [
  { id:'main', label:'통합 피드' },
  { id:'analytics', label:'행사 데이터 분석 리포트' },
  { id:'ai-assist', label:'상담일지 AI 어시스트' },
  { id:'ops-log', label:'행사 당일 대응 로그 & 알림' },
];

function Topbar({ screen, setScreen }) {
  return (
    <header className="topbar">
      <div className="brand"><span className="brand-mark"></span>이벤트옵스 허브</div>
      <nav className="top-nav">
        {NAV.map(n => (
          <button key={n.id} className={screen===n.id?'active':''} onClick={() => setScreen(n.id)}>{n.label}</button>
        ))}
      </nav>
      <div className="top-actions">
        <div className="event-switch"><span className="event-dot"></span>2026 수출상담회</div>
        <div className="avatar-round">운</div>
      </div>
    </header>
  );
}

const FEED_INIT = [
  { id:1, author:'시스템', tag:'출퇴근', time:'2분 전', body:'통역사 김서연 님이 출근 QR을 스캔하여 정상 출근으로 기록되었습니다.', likes:2, comments:0 },
  { id:2, author:'시스템', tag:'호출', time:'6분 전', body:'바이어 B-032가 도착 QR을 스캔하여 통역사 호출 요청이 생성되었습니다. 담당: 김서연.', likes:1, comments:1 },
  { id:3, author:'운영자 박지현', tag:'이슈', time:'12분 전', body:'C동 QR 스캐너 1대의 인식 속도가 느려져 현장 스태프에게 임시 스캐너 교체를 안내하였습니다.', likes:0, comments:2 },
  { id:4, author:'시스템', tag:'상담', time:'18분 전', body:'상담일지 4건이 셀러 QR 스캔으로 자동 입력되어 검토 대기 상태로 전환되었습니다.', likes:3, comments:0 },
  { id:5, author:'운영자 최도윤', tag:'출퇴근', time:'25분 전', body:'B동 통역사 지각 2건을 확인하여 현장 배정을 재조정하였습니다.', likes:1, comments:1 },
  { id:6, author:'시스템', tag:'호출', time:'31분 전', body:'B-018 호출 요청에 대한 통역사 응답이 완료되어 상담이 시작되었습니다.', likes:0, comments:0 },
];

const TAG_CLASS = { '출퇴근':'tag-attendance', '호출':'tag-call', '이슈':'tag-issue', '상담':'tag-attendance' };

function MainFeed({ pushToast, feed, setFeed }) {
  const [draft, setDraft] = useState('');
  const [type, setType] = useState('이슈');
  const [likedIds, setLikedIds] = useState([]);

  function submitPost() {
    if (!draft.trim()) { pushToast('내용을 입력해 주세요', 'err'); return; }
    setFeed(list => [{ id: Date.now(), author:'운영자', tag: type, time:'방금', body: draft, likes:0, comments:0 }, ...list]);
    setDraft('');
    pushToast('로그가 등록되었습니다');
  }

  function toggleLike(id) {
    setLikedIds(list => list.includes(id) ? list.filter(x=>x!==id) : [...list, id]);
    setFeed(list => list.map(f => f.id===id ? { ...f, likes: likedIds.includes(id) ? f.likes-1 : f.likes+1 } : f));
  }

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">다중 행사 통합 운영 피드</h1>
          <p className="page-desc">출퇴근·호출·상담·이슈 이벤트를 하나의 실시간 피드에서 확인합니다.</p>
        </div>
      </div>
      <div className="hero-figure-row">
        <span className="hero-figure">{feed.length}</span>
        <span className="hero-figure-label">건의 이벤트가 오늘 기록되었습니다</span>
      </div>
      <div className="feed-layout">
        <div className="feed-col">
          <div className="composer">
            <div className="composer-row">
              {['출퇴근','호출','상담','이슈'].map(t => (
                <span key={t} className={"type-chip" + (type===t?' on':'')} onClick={() => setType(t)} style={{cursor:'pointer'}}>{t}</span>
              ))}
            </div>
            <input placeholder="현장 이벤트 로그를 입력하세요..." value={draft} onChange={e=>setDraft(e.target.value)} />
            <div className="composer-foot">
              <button className="btn btn-primary" onClick={submitPost}><i className="ph ph-paper-plane-tilt"></i>로그 등록</button>
            </div>
          </div>

          {feed.map(f => (
            <article className="post" key={f.id}>
              <div className="post-head">
                <div className="avatar-round">{f.author[0]}</div>
                <span className="author">{f.author}</span>
                <span className={"post-tag " + (TAG_CLASS[f.tag]||'tag-attendance')}>{f.tag}</span>
                <time className="post-time">{f.time}</time>
              </div>
              <div className="post-body">{f.body}</div>
              <div className="post-actions">
                <button className="like" onClick={() => toggleLike(f.id)}><i className={"ph " + (likedIds.includes(f.id)?'ph-heart-fill':'ph-heart')}></i>공감 {f.likes}</button>
                <button className="comment" onClick={() => pushToast('댓글 입력창이 열립니다')}><i className="ph ph-chat-circle"></i>댓글 {f.comments}</button>
                <button className="share" onClick={() => pushToast('운영 채널로 공유되었습니다')}><i className="ph ph-share-network"></i>공유</button>
              </div>
            </article>
          ))}
        </div>

        <div className="right-rail">
          <div className="rail-card">
            <div className="rail-card-head">오늘의 요약</div>
            <div className="rail-card-body">
              <div className="rail-stat"><span>출근 인원</span><strong>42 / 48</strong></div>
              <div className="rail-stat"><span>진행중 호출</span><strong>3건</strong></div>
              <div className="rail-stat"><span>미해결 이슈</span><strong>1건</strong></div>
            </div>
          </div>
          <div className="rail-card">
            <div className="rail-card-head">운영중 행사</div>
            <div className="rail-card-body" style={{padding:'6px'}}>
              {EVENTS.map(e => (
                <div key={e.id} className={"event-pill" + (e.active?' active':'')}>
                  <span className="event-pill-dot"></span><span style={{fontSize:'12.5px',fontWeight:600,color:'var(--n9)'}}>{e.name}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const CHART_DATA = [
  { day:'9/1', attendance:38, calls:22, issues:2 },
  { day:'9/2', attendance:41, calls:26, issues:1 },

function AnalyticsScreen({ pushToast }) {
  const [range, setRange] = useState('최근 7일');
  const [exporting, setExporting] = useState(false);

  function exportCsv() {
    setExporting(true);
    setTimeout(() => { setExporting(false); pushToast('CSV 리포트가 다운로드되었습니다'); }, 900);
  }

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">행사 데이터 분석 리포트</h1>
          <p className="page-desc">출퇴근·호출·상담 지표를 행사·기간별로 집계해 시각화합니다.</p>
        </div>
        <div className="btn-row" style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={exportCsv} disabled={exporting}>
            {exporting ? <i className="ph ph-spinner spin"></i> : <i className="ph ph-download-simple"></i>}CSV 내보내기
          </button>
        </div>
      </div>

      <div className="filter-row">
        <select className="pill-select" value={range} onChange={e=>{ setRange(e.target.value); pushToast(e.target.value + ' 데이터로 갱신되었습니다'); }}>
          <option>최근 7일</option><option>최근 30일</option><option>전체 기간</option>
        </select>
        <select className="pill-select" defaultValue="2026 수출상담회">
          {EVENTS.map(e => <option key={e.id}>{e.name}</option>)}
        </select>
      </div>

      <div className="grid-cards">
        <div className="metric-card"><div className="metric-label">누적 출근 인원</div><div className="metric-value">251명</div><div className="metric-delta up">전일 대비 +6명</div></div>
        <div className="metric-card"><div className="metric-label">누적 호출 건수</div><div className="metric-value">175건</div><div className="metric-delta up">전일 대비 +9건</div></div>
        <div className="metric-card"><div className="metric-label">평균 대응 시간</div><div className="metric-value">2.4분</div><div className="metric-delta down">전일 대비 -0.3분</div></div>
        <div className="metric-card"><div className="metric-label">미해결 이슈</div><div className="metric-value">1건</div><div className="metric-delta up">전일 대비 -2건</div></div>
      </div>

      <div className="panel">
        <div className="panel-head"><h3>일별 출근·호출 추이</h3></div>
        <div style={{height:240,padding:'10px 16px 18px'}}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={CHART_DATA}>
              <CartesianGrid strokeDasharray="3 3" stroke={C('--n3')} />
              <XAxis dataKey="day" tick={{fontSize:12, fill: C('--n7')}} />
              <YAxis tick={{fontSize:12, fill: C('--n7')}} />
              <RTooltip />
              <Line type="monotone" dataKey="attendance" name="출근" stroke={C('--m500')} strokeWidth={2.5} dot={false} />
              <Line type="monotone" dataKey="calls" name="호출" stroke={C('--n5')} strokeWidth={2} dot={false} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><h3>이슈 발생 건수</h3></div>
        <div style={{height:200,padding:'10px 16px 18px'}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={CHART_DATA}>
              <CartesianGrid strokeDasharray="3 3" stroke={C('--n3')} />
              <XAxis dataKey="day" tick={{fontSize:12, fill: C('--n7')}} />
              <YAxis tick={{fontSize:12, fill: C('--n7')}} allowDecimals={false} />
              <RTooltip />
              <Bar dataKey="issues" name="이슈" fill={C('--n5')} radius={[4,4,0,0]} />

          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function AiAssistScreen({ pushToast }) {
  const [loading, setLoading] = useState(false);
  const [draft, setDraft] = useState('');
  const [version, setVersion] = useState(0);
  const [input, setInput] = useState('바이어 B-032, 홈리빙 카테고리, MOQ·리드타임 문의');

  function generate() {
    setLoading(true);
    setTimeout(() => {
      setDraft('바이어사는 홈리빙 카테고리 신제품에 관심을 표하며 최소 발주 수량(MOQ)과 리드타임을 문의하였습니다. 담당 통역사는 표준 MOQ 500개, 리드타임 6주를 안내하였고, 샘플 요청 여부는 차기 미팅에서 확정하기로 하였습니다.');
      setVersion(v => v+1);
      setLoading(false);
    }, 1300);
  }

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">상담일지 AI 어시스트</h1>
          <p className="page-desc">상담 메타데이터를 바탕으로 상담일지 초안을 생성해 작성 부담을 줄입니다.</p>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><h3>상담 메타데이터</h3></div>
        <div className="panel-body">
          <input style={{width:'100%',border:'1px solid var(--n4)',borderRadius:10,padding:'9px 12px',fontSize:13}} value={input} onChange={e=>setInput(e.target.value)} />
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h3>AI 초안 {version>0 && <span style={{color:'var(--n6)',fontWeight:500,fontSize:12}}>· v{version}</span>}</h3>
          <button className="btn btn-primary" onClick={generate} disabled={loading}>
            {loading ? <i className="ph ph-spinner spin"></i> : <i className="ph ph-sparkle"></i>}{version>0 ? '재생성' : '초안 생성'}
          </button>
        </div>
        <div className="chat-box">
          {!draft && !loading && <div style={{fontSize:13,color:'var(--n6)'}}>초안 생성을 누르면 상담 메타데이터를 바탕으로 상담일지 초안이 만들어집니다.</div>}
          {loading && <div className="chat-msg ai"><div className="chat-loading"><span></span><span></span><span></span></div></div>}
          {!loading && draft && <div className="chat-msg ai">{draft}</div>}
          {!loading && draft && <div className="chat-msg sys">초안이 생성되었습니다. 수정 후 저장하거나 재생성할 수 있습니다.</div>}
        </div>
        {draft && (
          <div className="panel-body" style={{paddingTop:0,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={() => pushToast('초안이 상담일지에 저장되었습니다')}><i className="ph ph-floppy-disk"></i>저장</button>
          </div>
        )}
      </div>
    </div>
  );
}

function OpsLogScreen({ pushToast }) {
  const [filter, setFilter] = useState('전체');
  const filtered = ISSUES.filter(i => filter==='전체' || i.type===filter);
  const [detail, setDetail] = useState(null);

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">행사 당일 대응 로그 &amp; 알림</h1>
          <p className="page-desc">현장 이슈 대응 이력을 SLA 기준으로 추적하고, 원격 리허설·대응 체계를 기록합니다.</p>
        </div>
        <button className="btn btn-secondary" onClick={() => pushToast('현장 리허설 화상 가이드 링크가 발송되었습니다')}><i className="ph ph-video-camera"></i>원격 리허설 가이드 발송</button>
      </div>

      <div className="tab-bar">
        {['전체','디바이스','네트워크','인원배정'].map(t => (
          <button key={t} className={"tab" + (filter===t?' active':'')} onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>

      <div className="panel">
        <div className="panel-head"><h3>이슈 대응 로그</h3><span style={{fontSize:12,color:'var(--n6)'}}>{filtered.length}건</span></div>
        {filtered.map(i => (
          <div className="issue-row" key={i.id} onClick={() => setDetail(i)} style={{cursor:'pointer'}}>
            <span className={"issue-sla " + i.sla}>{i.slaText}</span>
            <div style={{flex:1}}>
              <div className="issue-title">{i.title}</div>
              <div className="issue-meta">{i.type}</div>
            </div>
            <i className="ph ph-caret-right" style={{color:'var(--n5)'}}></i>
          </div>
        ))}
      </div>

      {detail && (
        <div className="modal-overlay" onClick={() => setDetail(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><h3>{detail.title}</h3><button className="modal-close" onClick={()=>setDetail(null)}><i className="ph ph-x"></i></button></div>
            <div className="modal-body">
              <p><strong>유형</strong> · {detail.type}</p>
              <p><strong>SLA 상태</strong> · {detail.slaText}</p>
              <p>{detail.desc}</p>
            </div>
            <div className="modal-foot">
              <button className="btn btn-secondary" onClick={()=>setDetail(null)}>닫기</button>
              <button className="btn btn-primary" onClick={() => { pushToast('담당자에게 알림이 전송되었습니다'); setDetail(null); }}>담당자 알림</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const [feed, setFeed] = useState(FEED_INIT);

  function pushToast(msg, type) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 2600);
  }

  return (
    <div className="top-layout">
      <div aria-hidden="true" style={{display:'none', borderRadius:12, boxShadow:'0 2px 8px rgba(30,30,32,0.08)', padding:16}}></div>
      <Topbar screen={screen} setScreen={setScreen} />
      <main className="body-area">
        {screen === 'main' && <MainFeed pushToast={pushToast} feed={feed} setFeed={setFeed} />}
        {screen === 'analytics' && <AnalyticsScreen pushToast={pushToast} />}
        {screen === 'ai-assist' && <AiAssistScreen pushToast={pushToast} />}
        {screen === 'ops-log' && <OpsLogScreen pushToast={pushToast} />}
      </main>
      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
