<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메디쿼트 — 의료장비 비교견적 매칭 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 0°, light) ── */
:root{
  --m50:#f0f0f0; --m100:#f0f0f0; --m200:#f0f0f0; --m300:#e0e0e0; --m400:#c2c2c2;
  --m500:#9c9c9c; --m600:#737373; --m700:#4b4b4b; --m800:#242424; --m900:#1e1e1e;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d5d5;
  --n5:#bab5b5; --n6:#989090; --n7:#797776; --n8:#5a5353; --n9:#3a3636; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

*{box-sizing:border-box;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--n5);border-radius:99px;}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--n0);}

/* ── header / search (archetype signature) ── */
.search-header{position:sticky;top:0;z-index:50;background:rgba(246,243,241,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);width:100%;}
.header-row{max-width:1432px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:18px 32px;}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--n10);cursor:pointer;background:none;border:none;font-family:inherit;flex-shrink:0;}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--m800);display:flex;align-items:center;justify-content:center;color:var(--n0);font-size:15px;}
.search-bar{flex:1;max-width:620px;display:flex;align-items:center;background:var(--n1);border-radius:999px;padding:5px;border:1px solid var(--n3);}
.search-segment{display:flex;flex-direction:column;padding:8px 20px;border-radius:999px;border:none;background:transparent;text-align:left;cursor:pointer;transition:background .15s;}
.search-segment:hover{background:var(--n0);}
.search-segment-info{display:flex;flex-direction:column;padding:8px 20px;flex:1;}
.segment-label{font-size:10.5px;color:var(--n7);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
.segment-value{font-size:14px;color:var(--n10);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-divider{width:1px;height:26px;background:var(--n4);flex-shrink:0;}
.search-submit{width:40px;height:40px;border-radius:50%;background:var(--m800);color:var(--n0);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:4px;transition:transform .15s;}
.search-submit:hover{transform:scale(1.06);}
.header-nav{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.nav-btn{padding:10px 16px;border-radius:999px;border:none;background:transparent;font-size:13.5px;font-weight:700;color:var(--n7);cursor:pointer;transition:all .15s;white-space:nowrap;}
.nav-btn.active{background:var(--m800);color:var(--n0);}
.nav-btn:hover:not(.active){background:var(--n2);color:var(--n9);}

.request-dropdown{position:absolute;top:64px;left:32px;background:var(--n0);border:1px solid var(--n3);border-radius:20px;box-shadow:0 16px 40px rgba(36,36,36,.16);z-index:60;width:320px;padding:10px;animation:dropIn .2s ease;}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.request-option{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;border:none;background:transparent;text-align:left;cursor:pointer;width:100%;}
.request-option:hover{background:var(--n2);}
.request-option.active{background:var(--n2);border:1px solid var(--n4);}
.request-option-title{font-size:14px;font-weight:700;color:var(--n10);}
.request-option-meta{font-size:12px;color:var(--n7);}

.filter-chips{max-width:1432px;margin:0 auto;display:flex;gap:8px;padding:0 32px 16px;overflow-x:auto;width:100%;}
.chip{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;border:1px solid var(--n4);background:var(--n1);font-size:13px;font-weight:700;color:var(--n8);white-space:nowrap;cursor:pointer;flex-shrink:0;transition:all .15s;}
.chip.active{background:var(--m800);border-color:var(--m800);color:var(--n0);}
.chip:hover:not(.active){border-color:var(--n6);}

/* ── main ── */
.main-area{flex:1;width:100%;max-width:1432px;margin:0 auto;padding:32px;position:relative;}
.hero-banner{position:relative;overflow:hidden;border-radius:32px;border:1px solid var(--n3);padding:56px 48px;margin-bottom:32px;background:var(--n1);}
.hero-glow{position:absolute;width:420px;height:420px;border-radius:50%;top:-160px;right:-100px;background:radial-gradient(circle, var(--m300) 0%, transparent 70%);filter:blur(30px);opacity:.55;}
.hero-glow-2{width:280px;height:280px;top:auto;bottom:-140px;left:-80px;right:auto;background:radial-gradient(circle, var(--n4) 0%, transparent 70%);opacity:.5;}
.hero-title{position:relative;font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;color:var(--n10);margin:0 0 14px;max-width:640px;}
.hero-sub{position:relative;font-size:15px;color:var(--n7);line-height:1.6;margin:0;max-width:560px;}
.request-context{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
.request-context h1{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;color:var(--n10);}
.request-context p{font-size:14px;color:var(--n7);margin:0;}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--s1-bg);color:var(--s1-text);font-size:12.5px;font-weight:700;}
.quote-count{font-size:14px;color:var(--n8);font-weight:700;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;width:100%;}
.listing-card{background:var(--n1);border:1px solid var(--n3);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;animation:cardIn .5s ease backwards;}
.listing-card:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 16px 32px rgba(36,36,36,.14);}
.card-image-wrap{position:relative;aspect-ratio:4/3;background:var(--n2);overflow:hidden;}
.card-image{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.7) contrast(1.02);}
.card-favorite{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(246,243,241,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);}
.card-favorite.active{color:var(--m800);}
.card-body{padding:20px;display:flex;flex-direction:column;gap:8px;}
.card-row-1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card-title{font-size:16px;font-weight:800;color:var(--n10);}
.card-badge{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--n2);color:var(--n7);font-weight:700;flex-shrink:0;}
.card-badge.new{background:var(--s1-bg);color:var(--s1-text);}
.card-meta-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--n7);}
.card-price-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:12px;border-top:1px dashed var(--n4);}
.card-price{font-size:19px;font-weight:800;color:var(--n10);}
.price-unit{font-size:12px;color:var(--n6);margin-left:4px;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;background:var(--n1);border-radius:28px;border:1px dashed var(--n4);}
.empty-icon-box{width:64px;height:64px;border-radius:20px;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n6);font-size:28px;margin-bottom:20px;}
.empty-state h3{font-size:18px;font-weight:800;color:var(--n9);margin:0 0 8px;}
.empty-state p{font-size:14px;color:var(--n7);margin:0 0 20px;}

.btn-primary{background:var(--m800);color:var(--n0);border:none;padding:13px 26px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s;}
.btn-primary:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--n9);border:1px solid var(--n9);padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-ghost:hover{background:var(--n2);}
.btn-dark{background:var(--m800);color:var(--n0);border:none;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;}

/* ── feature hub ── */
.feature-hub{margin-top:64px;}
.feature-hub h2{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:0 0 8px;color:var(--n10);}
.feature-hub .sub{font-size:14px;color:var(--n7);margin:0 0 24px;}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.feature-card{background:var(--n1);border:1px solid var(--n3);border-radius:26px;padding:28px;cursor:pointer;text-align:left;transition:all .2s;}
.feature-card:hover{border-color:var(--m800);transform:translateY(-3px);}
.feature-icon-box{width:46px;height:46px;border-radius:15px;background:var(--n2);display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--n8);font-size:20px;}
.feature-name{font-size:16px;font-weight:800;color:var(--n10);margin:0 0 8px;line-height:1.35;}
.feature-desc{font-size:13px;color:var(--n7);line-height:1.6;margin:0;}

/* ── quickview drawer ── */
.overlay{position:fixed;inset:0;background:rgba(36,36,36,.4);z-index:200;display:flex;justify-content:flex-end;animation:fadeIn .2s ease;}
.overlay.center{align-items:center;justify-content:center;}
.drawer{width:440px;max-width:92vw;height:100%;background:var(--n0);padding:36px;overflow-y:auto;animation:slideIn .3s ease;}
.drawer-modal{width:480px;max-width:92vw;max-height:86vh;background:var(--n0);border-radius:28px;padding:36px;overflow-y:auto;animation:fadeInScale .25s ease;}
.drawer-close{width:36px;height:36px;border-radius:50%;background:var(--n2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);margin-bottom:24px;}
.drawer-close:hover{background:var(--n3);}
.drawer h2{font-size:22px;font-weight:800;color:var(--n10);margin:0 0 6px;}
.drawer .company{font-size:14px;color:var(--n7);margin:0 0 24px;}
.drawer-section{margin-bottom:22px;}
.drawer-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--n6);font-weight:800;margin:0 0 10px;}
.drawer-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--n3);font-size:14px;}
.drawer-row span:first-child{color:var(--n7);}
.drawer-row span:last-child{color:var(--n10);font-weight:700;}
.drawer-note{background:var(--n1);border-radius:16px;padding:16px;font-size:13.5px;color:var(--n8);line-height:1.6;}
.drawer-actions{display:flex;gap:10px;margin-top:24px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,20px)}}
@keyframes spinRing{to{transform:rotate(360deg);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--m800);color:var(--n0);padding:14px 26px;border-radius:999px;font-size:14px;font-weight:700;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 2.4s forwards;display:flex;align-items:center;gap:10px;}

/* ── form page ── */
.page-inner{max-width:900px;margin:0 auto;}
.page-header{margin-bottom:32px;}
.page-header h1{font-size:28px;font-weight:800;color:var(--n10);margin:0 0 8px;}
.page-header p{font-size:14px;color:var(--n7);margin:0;}
.form-card{background:var(--n1);border:1px solid var(--n3);border-radius:28px;padding:36px;margin-bottom:24px;}
.form-section-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:var(--n10);margin:0 0 20px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-grid.full{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:8px;}
.field label{font-size:13px;font-weight:700;color:var(--n8);}
.field label .req{color:var(--n10);margin-left:2px;}
.field select,.field input,.field textarea{background:var(--n0);border:1px solid var(--n4);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--n9);width:100%;}
.field select:focus,.field input:focus,.field textarea:focus{outline:2px solid var(--m600);border-color:var(--m600);}
.field-error{font-size:12px;color:var(--n10);font-weight:700;}
.field textarea{resize:vertical;min-height:80px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip-toggle{padding:9px 16px;border-radius:999px;border:1px solid var(--n4);background:var(--n0);font-size:13px;font-weight:700;color:var(--n8);cursor:pointer;}
.chip-toggle.active{background:var(--m800);border-color:var(--m800);color:var(--n0);}
.conditional-block{margin-top:20px;padding-top:20px;border-top:1px dashed var(--n4);animation:fadeIn .3s ease;}
.conditional-label{font-size:12.5px;font-weight:800;color:var(--n7);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:block;}
.radio-row{display:flex;gap:10px;}
.radio-chip{flex:1;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--n4);background:var(--n0);font-size:13.5px;font-weight:700;color:var(--n8);cursor:pointer;}
.radio-chip.active{border-color:var(--m800);background:var(--n2);color:var(--n10);}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:8px;}

.req-list-item{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--n1);border:1px solid var(--n3);border-radius:20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
.req-list-item:hover{border-color:var(--n6);}
.req-list-left h4{font-size:15px;font-weight:800;color:var(--n10);margin:0 0 4px;}
.req-list-left p{font-size:12.5px;color:var(--n7);margin:0;}
.req-list-right{display:flex;align-items:center;gap:14px;}

/* ── signup / hospital page ── */
.tab-strip{display:flex;gap:6px;background:var(--n1);padding:6px;border-radius:16px;margin-bottom:28px;width:fit-content;}
.tab-btn{padding:11px 22px;border-radius:12px;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--n7);cursor:pointer;}
.tab-btn.active{background:var(--n0);color:var(--n10);box-shadow:0 2px 8px rgba(36,36,36,.08);}

.info-card{display:flex;justify-content:space-between;align-items:flex-start;background:var(--n1);border:1px solid var(--n3);border-radius:24px;padding:28px;margin-bottom:20px;}
.info-card h3{font-size:16px;font-weight:800;color:var(--n10);margin:0 0 4px;}
.info-card p{font-size:13px;color:var(--n7);margin:0;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px;}
.info-item{background:var(--n0);border-radius:14px;padding:14px 16px;}
.info-item .k{font-size:11.5px;color:var(--n7);font-weight:700;text-transform:uppercase;margin-bottom:4px;}
.info-item .v{font-size:14px;color:var(--n10);font-weight:700;}

/* ── notification page ── */
.notif-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
.notif-list{background:var(--n1);border:1px solid var(--n3);border-radius:24px;overflow:hidden;}
.notif-list-header{padding:20px 22px;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:center;}
.notif-list-header h3{font-size:15px;font-weight:800;margin:0;color:var(--n10);}
.unread-badge{background:var(--m800);color:var(--n0);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;}
.notif-item{display:flex;gap:12px;padding:16px 22px;border-bottom:1px solid var(--n3);cursor:pointer;position:relative;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--n2);}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--m800);flex-shrink:0;margin-top:6px;animation:pulseDot 1.8s ease-in-out infinite;}
.notif-dot.read{background:var(--n4);animation:none;}
.notif-body p{margin:0;font-size:13.5px;color:var(--n9);line-height:1.5;}
.notif-body span{font-size:11.5px;color:var(--n6);}

.thread-panel{background:var(--n1);border:1px solid var(--n3);border-radius:24px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:480px;}
.thread-header{padding:22px 26px;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:center;}
.thread-header h3{margin:0;font-size:16px;font-weight:800;color:var(--n10);}
.thread-header p{margin:2px 0 0;font-size:12.5px;color:var(--n7);}
.thread-body{flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:360px;}
.msg{max-width:76%;padding:13px 17px;border-radius:18px;font-size:13.5px;line-height:1.55;}
.msg.mine{align-self:flex-end;background:var(--m800);color:var(--n0);border-bottom-right-radius:4px;}
.msg.theirs{align-self:flex-start;background:var(--n0);color:var(--n9);border:1px solid var(--n3);border-bottom-left-radius:4px;}
.msg-time{font-size:10.5px;color:var(--n6);margin-top:6px;display:block;}
.thread-input{display:flex;gap:10px;padding:18px 22px;border-top:1px solid var(--n3);}
.thread-input textarea{flex:1;border:1px solid var(--n4);border-radius:16px;padding:12px 16px;font-size:13.5px;resize:none;min-height:44px;max-height:100px;background:var(--n0);color:var(--n9);}
.email-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--n6);padding:0 26px 16px;}

/* ── profile ── */
.profile-card{background:var(--n1);border:1px solid var(--n3);border-radius:28px;padding:36px;display:flex;gap:24px;align-items:center;margin-bottom:24px;}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--m800);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex-shrink:0;}
.profile-meta h2{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--n10);}
.profile-meta p{margin:0;font-size:13.5px;color:var(--n7);}
.activity-row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--n3);font-size:14px;}
.activity-row:last-child{border-bottom:none;}

footer.site-footer{border-top:1px solid var(--n3);padding:40px 32px;margin-top:64px;}
.footer-inner{max-width:1432px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-inner p{font-size:12.5px;color:var(--n6);margin:0;}

@media (max-width:860px){
  .header-row{flex-wrap:wrap;}
  .search-bar{order:3;max-width:100%;margin-top:10px;}
  .form-grid{grid-template-columns:1fr;}
  .notif-layout{grid-template-columns:1fr;}
  .info-grid{grid-template-columns:1fr;}

function FilterChips({filters, toggleFilter}){
  const groups = [
    {key:'manufacturer', label:'전체 업체', value:null},
    ...MANUFACTURERS.map(m => ({key:'manufacturer', label:m, value:m})),
    {key:'condition', label:'신품', value:'신품'},
    {key:'condition', label:'중고', value:'중고'},
    {key:'price', label:'1억 미만', value:'under1'},
    {key:'price', label:'1~1.5억', value:'mid'},
    {key:'price', label:'1.5억 이상', value:'over'},
  ];
  return (
    <div className="filter-chips">
      {groups.map((g, idx) => {
        const isAll = g.value === null;
        const active = isAll ? !filters.manufacturer : filters[g.key] === g.value;
        return (
          <button key={idx} className={'chip' + (active ? ' active' : '')}
            onClick={() => toggleFilter(g.key, g.value)}>
            {g.label}
          </button>
        );
      })}
    </div>
  );
}

    setForm({equipment:'', dept:'', purpose:'', region:'', timing:'', budget:'', manufacturer:'', condition:'무관', owned:'', note:''});

function NotificationPage({inquiryTarget, setInquiryTarget, showToast}){
  const [notifs, setNotifs] = useState(NOTIFICATIONS);
  const [thread, setThread] = useState(THREADS);
  const [draft, setDraft] = useState('');
  const unread = notifs.filter(n=>!n.read).length;
  const activeCompany = inquiryTarget || Object.keys(thread)[0];

  const markRead = (id) => setNotifs(notifs.map(n => n.id===id ? {...n, read:true} : n));

  const send = () => {
    if(!draft.trim()) return;
    const cur = thread[activeCompany] || [];
    setThread({...thread, [activeCompany]: [...cur, {from:'me', text:draft, time:'방금 전'}]});
    setDraft('');
    showToast('문의가 전송되었습니다. 이메일로도 함께 발송됩니다.');
  };

  return (
    <div className="main-area">
      <div className="page-header">
        <h1>업체 문의 및 알림</h1>
        <p>견적 제출·문의 답변 발생 시 사이트 내 알림과 이메일로 함께 안내받습니다.</p>
      </div>
      <div className="notif-layout">
        <div className="notif-list">
          <div className="notif-list-header">
            <h3>알림 센터</h3>
            {unread>0 && <span className="unread-badge">{unread}</span>}
          </div>
          {notifs.map(n => (
            <div key={n.id} className="notif-item" onClick={()=>markRead(n.id)}>
              <span className={'notif-dot' + (n.read?' read':'')}></span>
              <div className="notif-body">
                <p>{n.text}</p>
                <span>{n.time}</span>
              </div>
            </div>
          ))}
        </div>

        <div className="thread-panel">
          <div className="thread-header">
            <div>
              <h3>{activeCompany}</h3>
              <p>Q-2024-014 관련 문의</p>
            </div>
            <select value={activeCompany} onChange={e=>setInquiryTarget(e.target.value)} style={{border:'1px solid var(--n4)', borderRadius:12, padding:'8px 12px', fontSize:13, background:'var(--n0)'}}>
              {Object.keys(thread).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="thread-body">
            {(thread[activeCompany]||[]).map((m,i) => (
              <div key={i} className={'msg ' + (m.from==='me'?'mine':'theirs')}>
                {m.text}
                <span className="msg-time">{m.time}</span>
              </div>
            ))}
          </div>
          <div className="thread-input">
            <textarea placeholder="문의 내용을 입력하세요" value={draft} onChange={e=>setDraft(e.target.value)} />
            <button className="btn-primary" onClick={send}><i className="ti ti-send"></i></button>
          </div>
          <div className="email-hint"><i className="ti ti-mail"></i> 답변 등록 시 이메일로도 발송됩니다</div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [page, setPage] = useState('main');
  const [activeRequestId, setActiveRequestId] = useState('Q-2024-014');
  const [requestPickerOpen, setRequestPickerOpen] = useState(false);
  const [filters, setFilters] = useState({manufacturer:null, condition:null, price:null});
  const [openQuote, setOpenQuote] = useState(null);
  const [favorites, setFavorites] = useState(new Set());
  const [inquiryTarget, setInquiryTarget] = useState(null);
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);

  const activeRequest = MY_REQUESTS.find(r => r.id === activeRequestId) || MY_REQUESTS[0];

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2700);
  };

  const toggleFilter = (key, value) => {
    setFilters(prev => ({...prev, [key]: prev[key] === value ? null : value}));
  };

  const toggleFavorite = (id) => {
    setFavorites(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const handleInquire = (company) => {
    setInquiryTarget(company);
    setOpenQuote(null);
    setPage('notification');
  };

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <SearchHeader page={page} setPage={setPage} activeRequest={activeRequest} setActiveRequestId={setActiveRequestId}
        requestPickerOpen={requestPickerOpen} setRequestPickerOpen={setRequestPickerOpen} />
      {page === 'main' && <FilterChips filters={filters} toggleFilter={toggleFilter} />}

      {page === 'main' && <MainPage activeRequest={activeRequest} filters={filters} toggleFilter={toggleFilter}
        onOpenQuote={setOpenQuote} favorites={favorites} toggleFavorite={toggleFavorite} onFeatureClick={setPage} />}
      {page === 'request' && <RequestPage showToast={showToast} />}
      {page === 'hospital' && <HospitalPage showToast={showToast} />}
      {page === 'notification' && <NotificationPage inquiryTarget={inquiryTarget} setInquiryTarget={setInquiryTarget} showToast={showToast} />}
      {page === 'profile' && <ProfilePage showToast={showToast} />}

      <QuickView quote={openQuote} onClose={() => setOpenQuote(null)} onInquire={handleInquire} />
      <Toast message={toast} />

      <footer className="site-footer">
        <div className="footer-inner">
          <p>© 2024 메디쿼트 — 자체 개발 프로젝트</p>
          <p>본 화면은 데모용으로 제작된 목업이며 실제 서비스와 무관합니다.</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
