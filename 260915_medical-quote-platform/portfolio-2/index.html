<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메디쿼트 콘솔 — 의료장비 조달 통합 운영 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 254°, light) ── */
:root{
  --m50:#f3efff; --m100:#ece6ff; --m200:#e3dbff; --m300:#dcd1ff; --m400:#d4c7ff;
  --m500:#aea3d1; --m600:#887fa3; --m700:#5f5a73; --m800:#5f5a73; --m900:#5f5a73;
  --n0:#f2f0eb; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d6d5d7;
  --n5:#b6b5ba; --n6:#929098; --n7:#666666; --n8:#55535a; --n9:#37363a; --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--n5);border-radius:99px;}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--n0);}

.topbar{width:100%;background:var(--n1);border-bottom:1px solid var(--n3);position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:16px 32px;}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--n10);cursor:pointer;background:none;border:none;flex-shrink:0;}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;}
.top-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--n7);cursor:pointer;white-space:nowrap;}
.nav-btn.active{background:var(--m100);color:var(--m700);}
.nav-btn:hover:not(.active){background:var(--n2);color:var(--n9);}
.top-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--n3);background:var(--n1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n7);position:relative;}
.icon-btn:hover{background:var(--n2);}
.icon-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--m600);animation:pulseDot 1.8s ease-in-out infinite;}

.content{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:28px 32px 60px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.page-header h1{font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;color:var(--n10);}
.page-header p{font-size:13.5px;color:var(--n7);margin:0;}

/* ── bento archetype ── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.tile{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:22px;box-shadow:0 2px 10px rgba(41,40,39,.05);animation:tileIn .5s ease backwards;}
.tile.feature{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;}
.tile.wide{grid-column:span 2;}
.tile.metric{display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .18s,box-shadow .18s;}
.tile.metric:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(41,40,39,.10);}
.tile.list{cursor:pointer;transition:border-color .18s;}
.tile.list:hover{border-color:var(--n6);}
.tile-label{font-size:12px;color:var(--n7);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.tile-num{font-size:36px;font-weight:800;color:var(--n10);line-height:1;}
.tile-delta{font-size:12.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px;}
.tile-delta.up{color:var(--s1-text);}
.tile-delta.warn{color:var(--s3-text);}
.tile-icon-box{width:38px;height:38px;border-radius:12px;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n8);margin-bottom:14px;}
.tile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.tile-head h3{margin:0;font-size:15px;font-weight:700;color:var(--n10);}
.chart-wrap{position:relative;height:220px;width:100%;}
.chart-wrap.small{height:180px;}
.mini-list{display:flex;flex-direction:column;gap:10px;}
.mini-list-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--n2);}
.mini-list-item:last-child{border-bottom:none;}
.mini-list-item span:first-child{color:var(--n9);}
.mini-list-item span:last-child{color:var(--n6);font-size:12px;}

@keyframes tileIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,20px)}}
@keyframes barGrow{from{width:0;}}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:13px 24px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 2.4s forwards;display:flex;align-items:center;gap:9px;}

.btn-primary{background:var(--m600);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s;}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{background:var(--n1);color:var(--n9);border:1px solid var(--n4);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-ghost:hover{background:var(--n2);}
.btn-danger-outline{background:var(--n1);color:var(--n9);border:1px solid var(--n4);padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;}
.btn-danger-outline:hover{border-color:var(--n7);}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px;}

.panel{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:26px;margin-bottom:20px;box-shadow:0 2px 10px rgba(41,40,39,.04);}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.panel-head h3{margin:0;font-size:15.5px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-size:12.5px;font-weight:700;color:var(--n8);}
.field input,.field select,.field textarea{background:var(--n0);border:1px solid var(--n4);border-radius:11px;padding:10px 13px;font-size:13.5px;color:var(--n9);width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--m500);border-color:var(--m500);}
.field textarea{min-height:70px;resize:vertical;}
.tag-input{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--n4);border-radius:11px;background:var(--n0);}
.tag-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--m100);color:var(--m700);font-size:12px;font-weight:700;}
.tag-chip button{background:none;border:none;color:var(--m700);cursor:pointer;display:flex;padding:0;}
.upload-zone{border:1.5px dashed var(--n5);border-radius:14px;padding:24px;text-align:center;color:var(--n7);font-size:13px;cursor:pointer;}
.upload-zone:hover{border-color:var(--n7);background:var(--n2);}
.file-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--n0);border-radius:11px;margin-top:10px;font-size:13px;}

.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--n6);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--n3);}
.data-table td{padding:14px 12px;border-bottom:1px solid var(--n2);font-size:13.5px;color:var(--n9);vertical-align:middle;}
.data-table tr:hover td{background:var(--n0);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--n2);color:var(--n7);}
.badge.success{background:var(--s1-bg);color:var(--s1-text);}
.badge.danger{background:var(--s2-bg);color:var(--s2-text);}
.badge.warn{background:var(--s3-bg);color:var(--s3-text);}
.checkbox{width:17px;height:17px;accent-color:var(--m600);}

.tab-strip{display:flex;gap:6px;background:var(--n2);padding:5px;border-radius:13px;margin-bottom:22px;width:fit-content;}
.tab-btn{padding:9px 18px;border-radius:9px;border:none;background:transparent;font-size:13.5px;font-weight:700;color:var(--n7);cursor:pointer;}
.tab-btn.active{background:var(--n1);color:var(--n10);box-shadow:0 1px 4px rgba(0,0,0,.08);}

.filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.filter-bar select{border:1px solid var(--n4);border-radius:11px;padding:9px 13px;font-size:13px;background:var(--n1);color:var(--n9);}
.card-list-item{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:var(--n1);border:1px solid var(--n3);border-radius:16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
.card-list-item:hover{border-color:var(--n6);}
.card-list-item h4{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--n10);}
.card-list-item p{margin:0;font-size:12.5px;color:var(--n7);}

.overlay{position:fixed;inset:0;background:rgba(41,40,39,.4);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;}
.modal{width:520px;max-width:92vw;max-height:86vh;overflow-y:auto;background:var(--n1);border-radius:22px;padding:30px;animation:fadeInScale .25s ease;}
.modal-close{width:34px;height:34px;border-radius:10px;background:var(--n2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);float:right;}
.modal h2{font-size:19px;font-weight:700;margin:0 0 4px;color:var(--n10);}
.modal .sub{font-size:13px;color:var(--n7);margin:0 0 20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.history-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--n3);}
.history-item:last-child{border-bottom:none;}
.history-dot{width:32px;height:32px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n8);flex-shrink:0;}
.history-body p{margin:0 0 4px;font-size:13.5px;color:var(--n9);}
.history-body span{font-size:11.5px;color:var(--n6);}

@media (max-width:960px){ .bento{grid-template-columns:repeat(2,1fr);} .tile.feature{grid-column:span 2;grid-row:span 1;} .form-grid{grid-template-columns:1fr;} }
@media (max-width:600px){ .bento{grid-template-columns:1fr;} .tile.feature,.tile.wide{grid-column:span 1;} .topbar-inner{flex-wrap:wrap;padding:12px 18px;} .content{padding:20px;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, BarChart, Bar, CartesianGrid} = Recharts;

const CSS = (k) => getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();

const EQUIPMENT = ['초음파','CT','MRI','X-ray','유방촬영기','골밀도','PACS','기타'];
const DEPTS = ['영상의학과','정형외과','가정의학과','검진센터'];
const REGIONS = ['서울','경기','인천','부산','대전'];
const TIMING = ['1개월 이내','1~3개월','3~6개월','6개월 이상'];

const TREND_DATA = [
  {d:'02.15',요청:3,제출:5},{d:'02.19',요청:5,제출:7},{d:'02.23',요청:4,제출:6},
  {d:'02.27',요청:6,제출:9},{d:'03.02',요청:8,제출:11},{d:'03.06',요청:7,제출:10},
  {d:'03.10',요청:9,제출:14},{d:'03.14',요청:11,제출:16},
];

const CATEGORY_DATA = [
  {name:'초음파', value:34}, {name:'X-ray', value:21}, {name:'CT', value:16},
  {name:'MRI', value:11}, {name:'골밀도', value:8}, {name:'기타', value:10},
];

const OPEN_REQUESTS = [
  {id:'Q-2024-014', equipment:'초음파', dept:'영상의학과', region:'서울 강남구', timing:'1~3개월', submitted:false},
  {id:'Q-2024-021', equipment:'X-ray', dept:'정형외과', region:'경기 성남시', timing:'1개월 이내', submitted:true},
  {id:'Q-2024-027', equipment:'골밀도', dept:'가정의학과', region:'인천 남동구', timing:'6개월 이상', submitted:false},
  {id:'Q-2024-030', equipment:'CT', dept:'영상의학과', region:'서울 송파구', timing:'3~6개월', submitted:false},
  {id:'Q-2024-032', equipment:'MRI', dept:'검진센터', region:'부산 해운대구', timing:'3~6개월', submitted:false},
  {id:'Q-2024-035', equipment:'PACS', dept:'영상의학과', region:'대전 유성구', timing:'1개월 이내', submitted:true},
];

const PENDING_MEMBERS = [
  {id:1, type:'병원', name:'서울리버 병원', contact:'김민수', date:'2024.03.13', status:'대기'},
  {id:2, type:'공급업체', name:'뉴메디이큅먼트', contact:'박지훈', date:'2024.03.13', status:'대기'},
  {id:3, type:'개원준비', name:'이서연 원장', contact:'이서연', date:'2024.03.12', status:'대기'},
  {id:4, type:'공급업체', name:'케어라인메디칼', contact:'최도윤', date:'2024.03.12', status:'대기'},
  {id:5, type:'병원', name:'한빛종합의원', contact:'정하늘', date:'2024.03.11', status:'대기'},
];

const ACTIVE_MEMBERS = [
  {id:11, type:'병원', name:'서초연합병원', contact:'강수진', joined:'2024.01.20', status:'정상'},
  {id:12, type:'공급업체', name:'메디텍코리아', contact:'윤지호', joined:'2024.01.05', status:'정상'},
  {id:13, type:'개원준비', name:'문가영 원장', contact:'문가영', joined:'2024.02.02', status:'정상'},
];

const INITIAL_CATEGORIES = {
  장비종류: [...EQUIPMENT],
  진료과: [...DEPTS],
  지역: [...REGIONS],
};

const INITIAL_HISTORY = [
  {icon:'file-check', text:'메디텍코리아 회원 승인 처리', by:'관리자 최OO', time:'2024.03.10 14:02'},
  {icon:'ban', text:'뉴메디이큅먼트 계정 정지 (사유: 서류 미비)', by:'관리자 최OO', time:'2024.03.08 11:20'},
  {icon:'tag', text:'카테고리 "PACS" 추가', by:'관리자 최OO', time:'2024.03.05 09:40'},
  {icon:'user-check', text:'서초연합병원 회원 승인 처리', by:'관리자 최OO', time:'2024.01.20 10:15'},
];

function Toast({message}){
  if(!message) return null;
  return <div className="toast"><i data-lucide="check-circle-2" style={{width:16,height:16}}></i><span>{message}</span></div>;
}

function TopBar({page, setPage, showToast}){
  const NAVS = [
    {key:'main', label:'대시보드', icon:'layout-grid', full:null},
    {key:'quote-submit', label:'견적 제출', icon:'file-text', full:'공급업체 견적 제출 및 회사정보 관리'},
    {key:'requests', label:'견적 요청 목록', icon:'list-filter', full:'견적 요청 목록 조회 및 필터 (공급업체)'},
    {key:'admin', label:'회원·카테고리 관리', icon:'shield-check', full:'회원 승인 및 카테고리 관리 (관리자)'},
    {key:'audit-log', label:'승인 이력 로그', icon:'history', full:null},
  ];
  return (
    <header className="topbar">
      <div className="topbar-inner">
        <button className="brand" onClick={() => setPage('main')}>
          <span className="brand-mark"><i data-lucide="activity" style={{width:16,height:16}}></i></span>
          메디쿼트 콘솔
        </button>
        <nav className="top-nav">
          {NAVS.map(n => (
            <button key={n.key} className={'nav-btn' + (page===n.key?' active':'')} onClick={() => setPage(n.key)}>
              {n.full && <span className="sr-only">{n.full}</span>}
              <i data-lucide={n.icon} style={{width:15,height:15}}></i>{n.label}
            </button>
          ))}
        </nav>
        <div className="top-actions">
          <button className="icon-btn" title="알림" onClick={() => showToast('신규 견적 제출 알림 3건이 있습니다.')}><i data-lucide="bell" style={{width:16,height:16}}></i><span className="icon-dot"></span></button>
          <button className="icon-btn" title="설정" onClick={() => showToast('설정 화면은 준비 중입니다.')}><i data-lucide="settings" style={{width:16,height:16}}></i></button>
        </div>
      </div>
    </header>
  );
}

function MainDashboard({setPage, onFeatureClick}){
  return (
    <div className="content">
      <div className="page-header">
        <div>
          <h1>통계·운영 현황 통합 콘솔</h1>
          <p>회원·견적·승인 현황을 하나의 화면에서 확인합니다.</p>
        </div>
        <button className="btn-ghost" onClick={() => onFeatureClick('admin')}><i data-lucide="user-check" style={{width:14,height:14}}></i> 승인 대기 처리</button>
      </div>

      <div className="bento">
        <section className="tile feature">
          <div className="tile-head">
            <h3>최근 30일 견적 요청·제출 추이</h3>
            <span className="badge success">
              <svg width="10" height="10" viewBox="0 0 10 10" style={{marginRight:2}}>

function AdminPage({showToast, addHistory}){
  const [tab, setTab] = useState('approval');
  const [pending, setPending] = useState(PENDING_MEMBERS);
  const [active, setActive] = useState(ACTIVE_MEMBERS);
  const [selected, setSelected] = useState(new Set());
  const [categories, setCategories] = useState(INITIAL_CATEGORIES);
  const [catGroup, setCatGroup] = useState('장비종류');
  const [newCat, setNewCat] = useState('');
  const [confirmCfg, setConfirmCfg] = useState(null);

  const toggleSelect = (id) => setSelected(prev => { const n = new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });

  const bulkApprove = () => {
    if(selected.size===0){ showToast('승인할 회원을 선택해주세요.'); return; }
    const approvedNames = pending.filter(p => selected.has(p.id)).map(p=>p.name);
    setPending(pending.filter(p => !selected.has(p.id)));
    setActive([...active, ...pending.filter(p=>selected.has(p.id)).map(p=>({...p, joined:'2024.03.15', status:'정상'}))]);
    approvedNames.forEach(n => addHistory('user-check', n + ' 회원 승인 처리'));
    setSelected(new Set());
    showToast(approvedNames.length + '건이 일괄 승인되었습니다.');
  };

  const suspendMember = (m) => setConfirmCfg({
    title: m.name + ' 계정 정지', desc: '정지 처리 시 사유가 함께 기록됩니다.',
    onOk: (reason) => {
      setActive(active.map(a => a.id===m.id ? {...a, status:'정지'} : a));
      addHistory('ban', m.name + ' 계정 정지 (사유: ' + reason + ')');
      showToast(m.name + ' 계정이 정지 처리되었습니다.');
    }
  });

  const addCategory = () => {
    if(!newCat.trim()) return;
    setCategories({...categories, [catGroup]: [...categories[catGroup], newCat.trim()]});
    addHistory('tag', '카테고리 "' + newCat.trim() + '" 추가 (' + catGroup + ')');
    setNewCat('');
    showToast('카테고리가 추가되었습니다.');
  };
  const removeCategory = (group, val) => setCategories({...categories, [group]: categories[group].filter(c=>c!==val)});

  return (
    <div className="content">
      <div className="page-header"><div><h1>회원 승인 및 카테고리 관리</h1><p>가입 승인·계정 상태 변경과 선택 항목 카테고리를 관리합니다.</p></div></div>

      <div className="tab-strip">
        <button className={'tab-btn'+(tab==='approval'?' active':'')} onClick={()=>setTab('approval')}>회원 승인</button>
        <button className={'tab-btn'+(tab==='members'?' active':'')} onClick={()=>setTab('members')}>회원 관리</button>
        <button className={'tab-btn'+(tab==='category'?' active':'')} onClick={()=>setTab('category')}>카테고리 관리</button>
      </div>

      {tab === 'approval' && (
        <div className="panel">
          <div className="panel-head">
            <h3><i data-lucide="user-clock" style={{width:16,height:16}}></i> 승인 대기 ({pending.length})</h3>
            <button className="btn-primary btn-sm" onClick={bulkApprove}><i data-lucide="check-check" style={{width:13,height:13}}></i> 선택 일괄 승인</button>
          </div>
          <table className="data-table">
            <thead><tr><th></th><th>구분</th><th>이름</th><th>담당자</th><th>신청일</th><th>상태</th></tr></thead>
            <tbody>
              {pending.map(m => (
                <tr key={m.id}>
                  <td><input type="checkbox" className="checkbox" checked={selected.has(m.id)} onChange={()=>toggleSelect(m.id)} /></td>
                  <td>{m.type}</td><td>{m.name}</td><td>{m.contact}</td><td>{m.date}</td>
                  <td><span className="badge warn">{m.status}</span></td>
                </tr>
              ))}
              {pending.length===0 && <tr><td colSpan="6" style={{textAlign:'center', color:'var(--n6)', padding:'24px 0'}}>대기 중인 승인 요청이 없습니다.</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === 'members' && (
        <div className="panel">
          <div className="panel-head"><h3><i data-lucide="users" style={{width:16,height:16}}></i> 활성 회원 ({active.length})</h3></div>
          <table className="data-table">
            <thead><tr><th>구분</th><th>이름</th><th>담당자</th><th>가입일</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {active.map(m => (
                <tr key={m.id}>
                  <td>{m.type}</td><td>{m.name}</td><td>{m.contact}</td><td>{m.joined}</td>
                  <td><span className={'badge ' + (m.status==='정상'?'success':'danger')}>{m.status}</span></td>
                  <td>{m.status==='정상' && <button className="btn-danger-outline" onClick={()=>suspendMember(m)}>정지</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === 'category' && (
        <div className="panel">
          <div className="panel-head"><h3><i data-lucide="tags" style={{width:16,height:16}}></i> 카테고리 관리</h3></div>
          <div className="tab-strip">
            {Object.keys(categories).map(g => (
              <button key={g} className={'tab-btn'+(catGroup===g?' active':'')} onClick={()=>setCatGroup(g)}>{g}</button>
            ))}
          </div>
          <div className="tag-input" style={{marginBottom:16}}>
            {categories[catGroup].map((c,i) => (
              <span key={i} className="tag-chip">{c}<button onClick={()=>removeCategory(catGroup,c)}><i data-lucide="x" style={{width:11,height:11}}></i></button></span>
            ))}
            <input style={{border:'none', outline:'none', flex:1, minWidth:120, background:'transparent', fontSize:13}}
              value={newCat} placeholder="항목 추가 후 Enter" onChange={e=>setNewCat(e.target.value)}
              onKeyDown={e => { if(e.key==='Enter'){ e.preventDefault(); addCategory(); } }} />
          </div>
          <button className="btn-primary btn-sm" onClick={addCategory}><i data-lucide="plus" style={{width:13,height:13}}></i> 항목 추가</button>
        </div>
      )}

      <ConfirmModal config={confirmCfg} onClose={()=>setConfirmCfg(null)} onConfirm={(reason) => { confirmCfg.onOk(reason); setConfirmCfg(null); }} />
    </div>
  );
}

function AuditLogPage({history}){
  return (
    <div className="content">
      <div className="page-header"><div><h1>승인 이력 로그</h1><p>회원 승인·정지·해지·카테고리 변경 이력을 시간순으로 조회합니다.</p></div></div>
      <div className="panel">
        {history.map((h,i) => (
          <div key={i} className="history-item">
            <div className="history-dot"><i data-lucide={h.icon} style={{width:15,height:15}}></i></div>
            <div className="history-body">
              <p>{h.text}</p>
              <span>{h.by} · {h.time}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [page, setPage] = useState('main');
  const [toast, setToast] = useState('');
  const [history, setHistory] = useState(INITIAL_HISTORY);
  const [presetRequest, setPresetRequest] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => { if(window.lucide) window.lucide.createIcons(); });

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2700);
  };

  const addHistory = (icon, text) => {
    setHistory(prev => [{icon, text, by:'관리자 최OO', time:'방금 전'}, ...prev]);
  };

  const goSubmitFor = (req) => { setPresetRequest(req); setPage('quote-submit'); };

  return (
    <div className="app-shell" data-archetype="bento-grid">
      <TopBar page={page} setPage={setPage} showToast={showToast} />
      {page === 'main' && <MainDashboard setPage={setPage} onFeatureClick={setPage} />}
      {page === 'quote-submit' && <QuoteSubmitPage showToast={showToast} />}
      {page === 'requests' && <RequestsPage onGoSubmit={goSubmitFor} />}
      {page === 'admin' && <AdminPage showToast={showToast} addHistory={addHistory} />}
      {page === 'audit-log' && <AuditLogPage history={history} />}
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
