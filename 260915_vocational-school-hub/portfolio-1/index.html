<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스터디패스 — 특성화고 학생 성장관리 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 234°, light) ── */
:root{
  --m50:#e5e7ff; --m100:#cacfff; --m200:#aab3ff; --m300:#8692ff; --m400:#6474ff;
  --m500:#4255ff; --m600:#3646d1; --m700:#2a36a3; --m800:#1e2673; --m900:#1e2673;
  --n0:#f6f7fb; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d5d5d7;
  --n5:#b5b5ba; --n6:#909098; --n7:#71727a; --n8:#53545a; --n9:#36363a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --shadow-sm: rgba(40,46,62,0.08) 0px 2px 4px 0px;
  --shadow-md: rgba(40,46,62,0.10) 0px 4px 16px 0px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n9);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}
button{font-family:inherit; cursor:pointer;}
a{text-decoration:none; color:inherit;}

/* ── keyframes ── */
@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 0 rgba(66,85,255,0.35);} 50%{box-shadow:0 0 0 6px rgba(66,85,255,0);} }
@keyframes slideInRight{ from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);} }
@keyframes spinLoader{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes toastIn{ from{opacity:0; transform:translateY(12px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes cmdkIn{ from{opacity:0; transform:scale(0.97);} to{opacity:1; transform:scale(1);} }

/* ── layout ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; z-index:20;
}
.sidebar-brand{
  height:64px; display:flex; align-items:center; gap:10px; padding:0 20px;
  border-bottom:1px solid var(--n3); flex-shrink:0;
}
.sidebar-brand .mark{
  width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--m400), var(--m700));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
}
.status-strip{position:relative; overflow:hidden;}
.status-strip::before{
  content:''; position:absolute; top:-40px; right:-30px; width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle, var(--m300) 0%, transparent 70%); opacity:0.18; pointer-events:none;
}
.sidebar-brand .name{font-weight:700; font-size:15px; letter-spacing:-0.2px;}
.sidebar-cmdk-hint{
  margin:14px 16px 6px; padding:9px 12px; border-radius:8px; background:var(--n2);
  display:flex; align-items:center; justify-content:space-between; border:none; width:calc(100% - 32px);
  color:var(--n7); font-size:12.5px;
}
.sidebar-cmdk-hint:hover{background:var(--n3);}
.kbd{
  font-family:ui-monospace, monospace; background:var(--n1); border:1px solid var(--n4);
  border-radius:5px; padding:1px 6px; font-size:11px; color:var(--n7);
}
.sidebar-section-title{
  font-size:11px; font-weight:700; color:var(--n5); letter-spacing:0.06em;
  text-transform:uppercase; padding:16px 20px 6px;
}
.sidebar-nav{padding:0 10px; display:flex; flex-direction:column; gap:2px;}
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px;
  font-size:13.5px; font-weight:500; color:var(--n8); border:none; background:transparent;
  width:100%; text-align:left; position:relative;
}
.sidebar-link i{font-size:17px; color:var(--n6);}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50); color:var(--n9); font-weight:600;}
.sidebar-link.active i{color:var(--m600);}
.sidebar-link.active::before{
  content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px;
  background:var(--m600); border-radius:0 3px 3px 0;
}
.sidebar-badge{
  margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;
  background:var(--n2); color:var(--n7);
}
.sidebar-link.role-teacher{background:transparent;}
.role-tag{
  font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; margin-left:auto;
  background:var(--n2); color:var(--n7);
}
.sidebar-user{
  margin-top:auto; padding:14px 16px; border-top:1px solid var(--n3);
  display:flex; align-items:center; gap:10px;
}
.avatar-circle{
  width:32px; height:32px; border-radius:50%; background:var(--m100); color:var(--m700);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;
}
.sidebar-user .u-name{font-size:12.5px; font-weight:600; color:var(--n9);}
.sidebar-user .u-role{font-size:11px; color:var(--n6);}

.main-wrap{
  margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px);
  min-height:100vh; display:flex; flex-direction:column;
}
.topbar{
  height:56px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; border-bottom:1px solid var(--n3); background:var(--n1);
  position:sticky; top:0; z-index:10;
}
.breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n6);}
.breadcrumb .current{color:var(--n9); font-weight:600;}
.breadcrumb .divider{color:var(--n4);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.btn-cmdk{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:7px;
  border:1px solid var(--n3); background:var(--n1); color:var(--n7); font-size:12.5px; font-weight:500;
}
.btn-cmdk:hover{background:var(--n2);}
.btn-primary{
  padding:9px 18px; border-radius:200px; border:none; background:var(--m500); color:#fff;
  font-weight:600; font-size:13.5px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:6px;
}
.btn-primary:hover{background:var(--m600);}
.btn-ghost{
  padding:9px 16px; border-radius:200px; border:1px solid var(--n3); background:transparent;
  color:var(--n8); font-weight:600; font-size:13px;
}
.btn-ghost:hover{border-color:var(--n5); background:var(--n2);}
.content{padding:28px 32px; width:100%; flex:1;}

.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; animation:fadeInUp .4s ease both;}
.page-title{font-size:26px; font-weight:700; letter-spacing:-0.5px; margin:0 0 4px;}
.page-sub{font-size:13.5px; color:var(--n7); margin:0;}

/* status strip */
.status-strip{
  display:flex; align-items:center; gap:0; background:var(--n1); border:1px solid var(--n3);
  border-radius:10px; padding:14px 20px; margin-bottom:20px; animation:fadeInUp .4s ease .03s both;
  flex-wrap:wrap; box-shadow:var(--shadow-sm);
}
.status-item{display:flex; align-items:center; gap:8px; padding:0 20px; border-right:1px solid var(--n3);}
.status-item:last-child{border-right:none;}
.status-item .live-dot{width:8px; height:8px; border-radius:50%; background:var(--m500); animation:pulseDot 2s infinite;}
.status-item .s-label{font-size:11.5px; color:var(--n6);}
.status-item .s-value{font-size:15px; font-weight:700; color:var(--n9);}
.status-item .s-value.big{font-size:22px;}

.grid-2col{display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start;}
@media(max-width:1100px){ .grid-2col{grid-template-columns:1fr;} }

.card{
  background:var(--n1); border:1px solid var(--n3); border-radius:10px; padding:22px;
  animation:fadeInUp .45s ease .06s both;
}
.card-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:14px;}
.card-title{font-size:15px; font-weight:700; margin:0;}
.card-title.lg{font-size:22px;}
.card-desc{font-size:12.5px; color:var(--n6); margin:2px 0 0;}

.area-bars{display:flex; flex-direction:column; gap:12px; margin-top:16px;}
.area-bar-row{display:flex; align-items:center; gap:12px; cursor:pointer; padding:8px; border-radius:8px; transition:background .15s;}
.area-bar-row:hover{background:var(--n2);}
.area-bar-label{width:120px; flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--n8);}
.area-bar-track{flex:1; height:8px; background:var(--n2); border-radius:8px; overflow:hidden; position:relative;}
.area-bar-fill{height:100%; background:var(--m500); border-radius:8px; transform-origin:left; animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.area-bar-fill.warn{background:var(--n5);}
.area-bar-cutline{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--s3);}
.area-bar-val{width:70px; text-align:right; font-size:12.5px; font-weight:700; color:var(--n9); flex-shrink:0;}
.area-bar-badge{width:22px; flex-shrink:0; text-align:center;}

.priority-rail{display:flex; flex-direction:column; gap:10px;}
.priority-item{
  background:var(--n1); border:1px solid var(--n3); border-radius:10px; padding:14px;
  animation:fadeInUp .4s ease both; cursor:pointer; transition:border-color .15s, transform .15s;
}
.priority-item:hover{border-color:var(--m300); transform:translateY(-1px);}
.priority-item .p-rank{font-size:10.5px; font-weight:700; color:var(--n7); background:var(--n2); padding:2px 7px; border-radius:20px; display:inline-block; margin-bottom:6px;}
.priority-item .p-rank.top{color:var(--m600); background:var(--m50);}
.priority-item .p-title{font-size:13px; font-weight:700; color:var(--n9); margin:0 0 4px;}
.priority-item .p-desc{font-size:12px; color:var(--n7); margin:0;}
.priority-item .p-gain{font-size:11.5px; font-weight:700; color:var(--n8); margin-top:6px; display:flex; align-items:center; gap:4px;}
.priority-item .p-gain i{color:var(--n6);}
.priority-item .p-gain.top i{color:var(--s1);}

.widget-row{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:16px; margin-top:20px;}
@media(max-width:1100px){.widget-row{grid-template-columns:1fr;}}
.widget-card{background:var(--n1); border:1px solid var(--n3); border-radius:10px; padding:18px; animation:fadeInUp .4s ease .1s both;}
.widget-title{font-size:12.5px; font-weight:700; color:var(--n7); margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em;}

.legend-row{display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--n7);}
.legend-dot{width:8px; height:8px; border-radius:50%;}

/* generic controls */
.pill-toggle-group{display:flex; gap:6px; background:var(--n2); padding:4px; border-radius:200px;}
.pill-toggle{border:none; background:transparent; padding:7px 14px; border-radius:200px; font-size:12.5px; font-weight:600; color:var(--n7);}
.pill-toggle.active{background:var(--n1); color:var(--m600); box-shadow:var(--shadow-sm);}

.company-chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.company-chip{
  border:1px solid var(--n3); background:var(--n1); padding:10px 16px; border-radius:200px;
  font-size:13px; font-weight:600; color:var(--n8); display:flex; align-items:center; gap:7px;
}
.company-chip:hover{border-color:var(--n5);}
.company-chip.active{background:var(--m500); border-color:var(--m500); color:#fff;}
.company-chip .chip-dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5;}

.gauge-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px;}
.gauge-value{font-size:36px; font-weight:800; color:var(--n9); letter-spacing:-1px;}
.gauge-sub{font-size:12.5px; color:var(--n6); margin-top:2px;}
.gauge-status{
  margin-top:10px; padding:5px 14px; border-radius:200px; font-size:12px; font-weight:700;
}
.gauge-status.pass{background:var(--s1-bg); color:var(--s1-text);}
.gauge-status.fail{background:var(--s2-bg); color:var(--s2-text);}

.field-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;}
@media(max-width:900px){.field-grid{grid-template-columns:repeat(2,1fr);}}
.field-card{background:var(--n2); border-radius:10px; padding:14px;}
.field-card .f-name{font-size:12px; color:var(--n7); margin:0 0 6px;}
.field-card .f-score{font-size:20px; font-weight:800; color:var(--n9);}

.cond-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
.cond-row{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 10px; border-radius:8px; background:var(--n2);}
.cond-row i{font-size:15px;}
.cond-row.ok i{color:var(--s1);}
.cond-row.no i{color:var(--s2);}
.cond-row.no{background:var(--s2-bg); color:var(--s2-text);}
.cond-row.ok{background:var(--s1-bg); color:var(--s1-text);}

/* upload */
.dropzone{
  border:2px dashed var(--n4); border-radius:14px; padding:44px 20px; text-align:center;
  background:var(--n2); transition:all .2s; cursor:pointer;
}
.dropzone:hover, .dropzone.drag{border-color:var(--m400); background:var(--m50);}
.dropzone i{font-size:34px; color:var(--n5); margin-bottom:10px;}
.dropzone.drag i{color:var(--m500);}
.dropzone .dz-title{font-size:14.5px; font-weight:700; color:var(--n8); margin:6px 0 4px;}
.dropzone .dz-sub{font-size:12px; color:var(--n6);}

.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--n3); border-top-color:var(--m500);
  animation:spinLoader .7s linear infinite; display:inline-block;
}
.progress-track{height:8px; background:var(--n2); border-radius:8px; overflow:hidden; margin:14px 0;}
.progress-fill{height:100%; background:var(--m500); border-radius:8px; transition:width .3s ease;}

.upload-summary{display:flex; gap:12px; margin-top:16px;}
.sum-box{flex:1; background:var(--n2); border-radius:10px; padding:14px; text-align:center;}
.sum-box.err{background:var(--s2-bg);}
.sum-box .sum-val{font-size:22px; font-weight:800; color:var(--n9);}
.sum-box.err .sum-val{color:var(--s2-text);}
.sum-box .sum-label{font-size:11.5px; color:var(--n6); margin-top:2px;}

table.data-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px;}
table.data-table th{text-align:left; padding:9px 10px; color:var(--n6); font-weight:600; border-bottom:1px solid var(--n3); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
table.data-table td{padding:11px 10px; border-bottom:1px solid var(--n2); color:var(--n8);}
table.data-table tr.clickable{cursor:pointer;}
table.data-table tr.clickable:hover td{background:var(--n2);}
.status-badge{padding:3px 10px; border-radius:200px; font-size:11px; font-weight:700; display:inline-block;}
.status-badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.status-badge.err{background:var(--s2-bg); color:var(--s2-text);}
.status-badge.wait{background:var(--n2); color:var(--n7);}

/* tabs */
.tab-row{display:flex; gap:4px; border-bottom:1px solid var(--n3); margin-bottom:20px;}
.tab-item{padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--n6); border:none; background:transparent; border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:6px;}
.tab-item.active{color:var(--m600); border-bottom-color:var(--m500);}

.notice-list{display:flex; flex-direction:column; gap:2px;}
.notice-row{display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:8px; cursor:pointer;}
.notice-row:hover{background:var(--n2);}
.notice-row .unread-dot{width:7px; height:7px; border-radius:50%; background:var(--m500); flex-shrink:0;}
.notice-row .unread-dot.read{background:transparent;}
.notice-row .n-title{font-size:13.5px; color:var(--n9); flex:1;}
.notice-row.is-read .n-title{color:var(--n6); font-weight:400;}
.notice-row .n-title{font-weight:600;}
.notice-row .n-date{font-size:11.5px; color:var(--n6);}

.activity-card{background:var(--n1); border:1px solid var(--n3); border-radius:12px; padding:18px; margin-bottom:12px;}
.activity-card .a-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
.activity-card .a-title{font-size:14.5px; font-weight:700; margin:0;}
.activity-card .a-meta{font-size:12px; color:var(--n6); margin-top:4px;}
.activity-card .a-reward{font-size:11.5px; color:var(--s1); font-weight:700; margin-top:8px;}

.consult-status-track{display:flex; align-items:center; gap:0; margin-top:14px;}
.consult-step{flex:1; text-align:center; position:relative;}
.consult-step .dot{width:22px; height:22px; border-radius:50%; background:var(--n3); color:var(--n6); display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:11px; font-weight:700; position:relative; z-index:1;}
.consult-step.done .dot{background:var(--m500); color:#fff;}
.consult-step.current .dot{background:var(--m100); color:var(--m700); border:2px solid var(--m500);}
.consult-step .label{font-size:11px; color:var(--n7);}
.consult-step::after{content:''; position:absolute; top:11px; left:50%; width:100%; height:2px; background:var(--n3); z-index:0;}
.consult-step:last-child::after{display:none;}
.consult-step.done::after{background:var(--m400);}

/* modal / drawer / toast */
.overlay-backdrop{position:fixed; inset:0; background:rgba(20,22,30,0.45); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeInUp .2s ease;}
.modal-box{background:var(--n1); border-radius:14px; width:460px; max-width:92vw; padding:24px; box-shadow:var(--shadow-md); animation:fadeInUp .25s ease;}
.modal-box.wide{width:600px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-title{font-size:17px; font-weight:700; margin:0;}
.modal-close{background:var(--n2); border:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:6px;}
.form-row input, .form-row select, .form-row textarea{
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--n3); font-size:13.5px;
  font-family:inherit; background:var(--n1); color:var(--n9);
}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

.drawer-backdrop{position:fixed; inset:0; background:rgba(20,22,30,0.4); z-index:100;}
.drawer-panel{
  position:fixed; right:0; top:0; bottom:0; width:420px; max-width:92vw; background:var(--n1);
  box-shadow:-8px 0 30px rgba(0,0,0,0.12); z-index:101; animation:slideInRight .28s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column;
}

            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={e => { e.preventDefault(); setDrag(false); startUpload(); }}
            onClick={startUpload}>
            <i className="ph ph-file-xls"></i>
            <p className="dz-title">엑셀 파일을 드래그하거나 클릭하여 업로드</p>
            <p className="dz-sub">.xlsx · 연 2회 갱신 기준 · 최대 10MB</p>
          </div>
          {status === 'uploading' && (
            <div>
              <div style={{display:'flex', alignItems:'center', gap:8, marginTop:16, fontSize:12.5, color:'var(--n7)'}}>
                <span className="spinner"></span> 3학년_2학기_성적출결.xlsx 파싱 중…
              </div>
              <div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}></div></div>
            </div>
          )}
          {status === 'done' && (
            <div>
              <div className="upload-summary">
                <div className="sum-box"><div className="sum-val">139</div><div className="sum-label">정상 반영 행</div></div>
                <div className="sum-box err"><div className="sum-val">3</div><div className="sum-label">형식 오류 행</div></div>
              </div>
              <table className="data-table">
                <thead><tr><th>행 번호</th><th>학생</th><th>오류 사유</th></tr></thead>
                <tbody>
                  <tr><td>34</td><td>한지민</td><td><span className="status-badge err">출결 값 형식 오류</span></td></tr>
                  <tr><td>78</td><td>오세준</td><td><span className="status-badge err">과목 코드 누락</span></td></tr>
                  <tr><td>121</td><td>윤소율</td><td><span className="status-badge err">점수 범위 초과</span></td></tr>
                </tbody>
              </table>
            </div>
          )}
          <h3 style={{fontSize:13.5, marginTop:22, marginBottom:8}}>갱신 이력</h3>
          <table className="data-table">
            <thead><tr><th>파일명</th><th>업로드 시각</th><th>처리행</th><th>오류</th></tr></thead>
            <tbody>
              {history.map(h => (
                <tr key={h.id}><td>{h.name}</td><td>{h.date}</td><td>{h.rows}</td><td>{h.errors > 0 ? <span className="status-badge err">{h.errors}건</span> : <span className="status-badge ok">0건</span>}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card">
          <h2 className="card-title">처리 파이프라인</h2>
          <div style={{display:'flex', flexDirection:'column', gap:10, marginTop:14}}>
            <div className="cond-row ok"><i className="ph ph-magnifying-glass"></i> 1단계 · 컬럼 구조 검증</div>
            <div className="cond-row ok"><i className="ph ph-arrows-left-right"></i> 2단계 · 배점 규칙 매핑</div>
            <div className="cond-row ok"><i className="ph ph-database"></i> 3단계 · 점수 테이블 반영</div>
          </div>
          <p style={{fontSize:12, color:'var(--n6)', marginTop:14, lineHeight:1.6}}>정상 처리된 행만 즉시 반영되고, 오류 행은 재업로드 큐에서 개별 재처리할 수 있습니다.</p>
        </div>
      </div>
    </div>
  );
}

function SchoolLifeView({ pushToast, openDrawer }) {
  const [tab, setTab] = useState('activity');
  const [notices, setNotices] = useState(NOTICES);
  const toggleRead = (id) => setNotices(ns => ns.map(n => n.id===id ? { ...n, read:true } : n));
  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">학교생활 기능</h1>
          <p className="page-sub">가정통신문 · 체험활동 · 설문 · 상담을 한 화면에서 처리합니다</p>
        </div>
      </div>
      <div className="tab-row">
        <button className={"tab-item"+(tab==='notice'?' active':'')} onClick={()=>setTab('notice')}><i className="ph ph-megaphone"></i>가정통신문</button>
        <button className={"tab-item"+(tab==='activity'?' active':'')} onClick={()=>setTab('activity')}><i className="ph ph-compass"></i>체험활동</button>
        <button className={"tab-item"+(tab==='survey'?' active':'')} onClick={()=>setTab('survey')}><i className="ph ph-clipboard-text"></i>설문</button>
        <button className={"tab-item"+(tab==='consult'?' active':'')} onClick={()=>setTab('consult')}><i className="ph ph-chats-circle"></i>상담신청</button>
      </div>
      {tab==='notice' && (
        <div className="card">
          <div className="notice-list">
            {notices.map(n => (
              <div key={n.id} className={"notice-row"+(n.read?' is-read':'')} onClick={() => toggleRead(n.id)}>
                <span className={"unread-dot"+(n.read?' read':'')}></span>
                <span className="n-title">{n.title}</span>
                <span className="n-date">{n.date}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {tab==='activity' && (
        <div>
          {ACTIVITIES.map(a => (
            <div className="activity-card" key={a.id}>
              <div className="a-top">
                <div>
                  <p className="a-title">{a.title}</p>
                  <p className="a-meta">{a.meta}</p>
                </div>
                <button className="btn-primary" onClick={() => { pushToast(a.title + ' 신청이 접수되었습니다'); openDrawer({ name:a.area, score:0, cut:0, activity:a }); }}>신청하기</button>
              </div>
              <div className="a-reward"><i className="ph ph-trend-up"></i> 참여 시 {a.area} 영역 점수 자동 반영</div>
            </div>
          ))}
        </div>
      )}
      {tab==='survey' && (
        <div className="card">
          <div className="notice-row" onClick={() => pushToast('설문에 참여했습니다')}><span className="unread-dot"></span><span className="n-title">2학기 학교생활 만족도 조사</span><span className="n-date">참여하기</span></div>
          <div className="notice-row" onClick={() => pushToast('설문에 참여했습니다')}><span className="unread-dot read"></span><span className="n-title">진로진학 희망 조사</span><span className="n-date">참여완료</span></div>
        </div>
      )}
      {tab==='consult' && (
        <div className="card">
          <p className="card-desc" style={{marginBottom:10}}>진로 상담 신청 · 현재 진행 상태</p>
          <div className="consult-status-track">
            <div className="consult-step done"><div className="dot"><i className="ph ph-check"></i></div><div className="label">신청</div></div>
            <div className="consult-step current"><div className="dot">2</div><div className="label">진행</div></div>
            <div className="consult-step"><div className="dot">3</div><div className="label">완료</div></div>
          </div>
          <button className="btn-ghost" style={{marginTop:20}} onClick={() => pushToast('새 상담 신청이 접수되었습니다')}><i className="ph ph-plus"></i> 새 상담 신청</button>
        </div>
      )}
    </div>
  );
}

function RecordsView({ openRecordDrawer }) {
  const [query, setQuery] = useState('');
  const filtered = RECORDS.filter(r => r.name.includes(query));
  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">성적·출결 기록 조회</h1>
          <p className="page-sub">나이스 업로드로 반영된 학생별 성적·출결 원자료를 조회합니다</p>
        </div>
      </div>
      <div className="card">
        <input placeholder="학생 이름 검색" value={query} onChange={e=>setQuery(e.target.value)}
          style={{width:260, padding:'9px 14px', borderRadius:8, border:'1px solid var(--n3)', fontSize:13, marginBottom:14, fontFamily:'inherit'}} />
        <table className="data-table">
          <thead><tr><th>이름</th><th>학급</th><th>평균 점수</th><th>출결률</th><th>갱신일</th></tr></thead>
          <tbody>
            {filtered.map(r => (
              <tr key={r.id} className="clickable" onClick={() => openRecordDrawer(r)}>
                <td style={{fontWeight:600}}>{r.name}</td><td>{r.grade}</td><td>{r.value}점</td><td>{r.attendance}</td><td>{r.updated}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [drawerArea, setDrawerArea] = useState(null);
  const [recordDrawer, setRecordDrawer] = useState(null);
  const [toasts, setToasts] = useState([]);

  const pushToast = (text) => {
    const id = Date.now();
    setToasts(ts => [...ts, { id, text }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2600);
  };

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdkOpen(o => !o); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const navItems = [
    { view:'main', label:'졸업인증 현황', icon:'ph-gauge' },
    { view:'diagnosis', label:'관심기업 모의 지원 진단', icon:'ph-target' },
    { view:'nice-upload', label:'나이스 엑셀 업로드 자동 채점', icon:'ph-upload-simple', role:true },
    { view:'school-life', label:'학교생활 기능', icon:'ph-calendar-check' },
    { view:'records', label:'성적·출결 기록 조회', icon:'ph-clipboard-text', role:true },
  ];
  const crumbMap = { main:'졸업인증 현황', diagnosis:'관심기업 모의 지원 진단', 'nice-upload':'나이스 엑셀 업로드', 'school-life':'학교생활 기능', records:'성적·출결 기록' };

  return (
    <div className="app-shell" data-archetype="linear-sidebar-cmdk">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand"><div className="mark">S</div><div className="name">스터디패스</div></div>
        <button className="sidebar-cmdk-hint" onClick={() => setCmdkOpen(true)}>
          <span><i className="ph ph-magnifying-glass" style={{marginRight:6}}></i>빠른 이동</span>
          <span className="kbd">⌘K</span>
        </button>
        <div className="sidebar-section-title">학생 메뉴</div>
        <nav className="sidebar-nav">
          {navItems.filter(n => !n.role).map(n => (
            <button key={n.view} className={"sidebar-link"+(view===n.view?' active':'')} onClick={() => setView(n.view)}>
              <i className={"ph "+n.icon}></i>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-section-title">학습 데이터 관리</div>
        <nav className="sidebar-nav">
          {navItems.filter(n => n.role).map(n => (
            <button key={n.view} className={"sidebar-link"+(view===n.view?' active':'')} onClick={() => setView(n.view)}>
              <i className={"ph "+n.icon}></i>{n.label}<span className="role-tag">교사</span>
            </button>
          ))}
        </nav>
        <div className="sidebar-user">
          <div className="avatar-circle">김도</div>
          <div><div className="u-name">김도윤</div><div className="u-role">3학년 2반</div></div>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="topbar">
          <div className="breadcrumb">
            <span>스터디패스</span><span className="divider">/</span><span className="current">{crumbMap[view]}</span>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={() => setCmdkOpen(true)}><i className="ph ph-command"></i> 명령 팔레트 <span className="kbd">⌘K</span></button>
          </div>
        </header>
        <div className="content">
          {view === 'main' && <MainView openDrawer={setDrawerArea} pushToast={pushToast} />}
          {view === 'diagnosis' && <DiagnosisView pushToast={pushToast} />}
          {view === 'nice-upload' && <NiceUploadView pushToast={pushToast} />}
          {view === 'school-life' && <SchoolLifeView pushToast={pushToast} openDrawer={setDrawerArea} />}
          {view === 'records' && <RecordsView openRecordDrawer={setRecordDrawer} />}
        </div>
      </div>

      {drawerArea && (
        <Drawer title={drawerArea.name + ' 영역 상세'} onClose={() => setDrawerArea(null)}
          footer={<React.Fragment><button className="btn-ghost" onClick={() => setDrawerArea(null)}>닫기</button><button className="btn-primary" onClick={() => { pushToast('목표 설정이 저장되었습니다'); setDrawerArea(null); }}>목표 저장</button></React.Fragment>}>
          {drawerArea.activity ? (
            <div>
              <div className="detail-row"><span className="d-label">활동명</span><span className="d-value">{drawerArea.activity.title}</span></div>
              <div className="detail-row"><span className="d-label">일정</span><span className="d-value">{drawerArea.activity.meta}</span></div>
              <div className="detail-row"><span className="d-label">반영 영역</span><span className="d-value">{drawerArea.activity.area}</span></div>
              <div className="detail-row"><span className="d-label">상태</span><span className="d-value">{drawerArea.activity.status}</span></div>
            </div>
          ) : (
            <div>
              <div className="detail-row"><span className="d-label">현재 점수</span><span className="d-value">{drawerArea.score}점</span></div>
              <div className="detail-row"><span className="d-label">B등급 커트라인</span><span className="d-value">{drawerArea.cut}점</span></div>
              <div className="detail-row"><span className="d-label">산출 방식</span><span className="d-value">배점 규칙 가중합</span></div>
              <div className="detail-row"><span className="d-label">다음 목표</span><span className="d-value">{drawerArea.cut - drawerArea.score > 0 ? (drawerArea.cut - drawerArea.score) + '점 추가 필요' : '목표 달성'}</span></div>
            </div>
          )}
        </Drawer>
      )}

      {recordDrawer && (
        <Drawer title={recordDrawer.name + ' 학생 기록'} onClose={() => setRecordDrawer(null)}
          footer={<button className="btn-ghost" onClick={() => setRecordDrawer(null)}>닫기</button>}>
          <div className="detail-row"><span className="d-label">학급</span><span className="d-value">{recordDrawer.grade}</span></div>
          <div className="detail-row"><span className="d-label">평균 점수</span><span className="d-value">{recordDrawer.value}점</span></div>
          <div className="detail-row"><span className="d-label">출결률</span><span className="d-value">{recordDrawer.attendance}</span></div>
          <div className="detail-row"><span className="d-label">최근 갱신</span><span className="d-value">{recordDrawer.updated}</span></div>
        </Drawer>
      )}

      {cmdkOpen && <CmdK onClose={() => setCmdkOpen(false)} navigate={setView} />}
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
