<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인재허브 — 협약형 인재양성 통합 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 144°, light) ── */
:root{
  --m50:#e7faef; --m100:#d0f5df; --m200:#b3eecb; --m300:#93e7b5; --m400:#74e1a0;
  --m500:#56da8b; --m600:#47b372; --m700:#378c59; --m800:#27623f; --m900:#27623f;
  --n0:#ffffff; --n1:#e5e5e7; --n2:#eff0f0; --n3:#e5e6e5; --n4:#d5d7d6;
  --n5:#b5bab7; --n6:#95979e; --n7:#717a74; --n8:#535a56; --n9:#363a38; --n10:#1e201e;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --shadow-sm: rgba(9,10,12,0.06) 0px 4px 6px 0px;
  --shadow-md: rgba(9,10,12,0.10) 0px 8px 24px 0px;
  --shadow-xl: rgba(9,10,12,0.14) 0px 16px 40px 0px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n2); color:var(--n9); -webkit-font-smoothing:antialiased;
}
#root{width:100%;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}
button{font-family:inherit; cursor:pointer;}
a{text-decoration:none; color:inherit;}

@keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes floatGlow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
@keyframes ringPulse{ 0%{box-shadow:0 0 0 0 rgba(71,179,114,0.4);} 100%{box-shadow:0 0 0 10px rgba(71,179,114,0);} }
@keyframes shimmerSweep{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
@keyframes popIn{ from{opacity:0; transform:scale(0.94);} to{opacity:1; transform:scale(1);} }
@keyframes slideUpSheet{ from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

.wrap{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* header */
.app-header{
  position:sticky; top:0; z-index:30; height:64px; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--n3); display:flex; align-items:center; padding:0 28px; gap:28px;
}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; letter-spacing:-0.3px; flex-shrink:0;}
.brand .mark{width:30px; height:30px; border-radius:9999px; background:linear-gradient(135deg, var(--m600), var(--m800)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;}
.proj-switcher{display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:9999px; background:var(--n1); font-size:12.5px; font-weight:600; color:var(--n8); border:1px solid var(--n3); flex-shrink:0;}
.global-nav{display:flex; align-items:center; gap:6px; flex:1;}
.nav-link{padding:8px 14px; border-radius:9999px; font-size:13px; font-weight:600; color:var(--n7); border:none; background:transparent;}
.nav-link:hover{background:var(--n1);}
.nav-link.active{background:var(--n9); color:#fff;}
.header-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{width:36px; height:36px; border-radius:9999px; border:1px solid var(--n3); background:var(--n0); display:flex; align-items:center; justify-content:center; color:var(--n7); position:relative;}
.icon-btn:hover{background:var(--n1);}
.notif-dot{position:absolute; top:7px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--m600);}
.header-avatar{width:36px; height:36px; border-radius:9999px; background:var(--m100); color:var(--m800); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;}

/* tab bar */
.tab-bar{
  display:flex; gap:4px; padding:12px 28px; background:var(--n0); border-bottom:1px solid var(--n3);
  overflow-x:auto; position:sticky; top:64px; z-index:20;
}
.tab{
  padding:9px 16px; border-radius:9999px; border:none; background:transparent; font-size:13px; font-weight:600;
  color:var(--n7); white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:6px;
}
.tab:hover{background:var(--n1);}
.tab.active{background:var(--m50); color:var(--m800);}
.tab .badge-mini{background:var(--n2); color:var(--n7); font-size:10px; font-weight:700; padding:1px 6px; border-radius:9999px;}
.tab.active .badge-mini{background:var(--m600); color:#fff;}

.content{max-width:1320px; margin:0 auto; width:100%; padding:28px 28px 60px; flex:1;}

.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; animation:fadeUp .4s ease both;}
.page-title{font-size:28px; font-weight:800; letter-spacing:-0.6px; margin:0 0 5px;}
.page-sub{font-size:13.5px; color:var(--n7); margin:0;}

.btn-primary{
  padding:11px 22px; border-radius:9999px; border:none; background:var(--m600); color:#fff;
  font-weight:700; font-size:13.5px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:7px;
}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{
  padding:10px 18px; border-radius:9999px; border:1px solid var(--n4); background:var(--n0);
  color:var(--n8); font-weight:600; font-size:13px;
}
.btn-ghost:hover{background:var(--n1);}

/* insight-board */
.hero-row{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; margin-bottom:20px;}
@media(max-width:1100px){.hero-row{grid-template-columns:1fr;}}
.hero-card{
  background:var(--n0); border-radius:20px; box-shadow:var(--shadow-md); position:relative; overflow:hidden;
  animation:fadeUp .5s ease .04s both;
}
.hero-band{
  position:relative; padding:26px 28px 34px; overflow:hidden;
  background:linear-gradient(150deg, var(--m600) 0%, var(--m800) 65%, var(--m900) 100%);
}
.hero-band::before{
  content:''; position:absolute; top:-70px; left:20%; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, var(--m300) 0%, transparent 72%); opacity:0.55; animation:floatGlow 6s ease-in-out infinite;
}
.hero-band::after{
  content:''; position:absolute; bottom:-90px; right:-40px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, var(--m400) 0%, transparent 70%); opacity:0.35;
}
.hero-body{padding:24px 28px 28px;}
.hero-head{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
.hero-title{font-size:20px; font-weight:800; margin:0 0 5px; color:#fff;}
.hero-desc{font-size:12.5px; color:rgba(255,255,255,0.82); margin:0; max-width:420px;}
.hero-total-badge{
  position:relative; z-index:1; display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:9999px;
  background:rgba(255,255,255,0.16); color:#fff; font-size:12px; font-weight:700; backdrop-filter:blur(4px);
}

.slider-group{display:flex; flex-direction:column; gap:16px; position:relative;}
.slider-row{display:flex; flex-direction:column; gap:6px;}
.slider-row .sr-top{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--n8);}
.slider-row input[type=range]{
  -webkit-appearance:none; width:100%; height:6px; border-radius:9999px; background:var(--n2); outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--m600);
  border:3px solid #fff; box-shadow:var(--shadow-sm); cursor:pointer;
}

.kpi-side{display:flex; flex-direction:column; gap:14px;}
.kpi-strip-card{background:var(--n0); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow-sm); animation:fadeUp .45s ease .08s both;}
.kpi-strip-card .k-label{font-size:11.5px; color:var(--n7); margin-bottom:6px;}
.kpi-strip-card .k-value{font-size:30px; font-weight:800; letter-spacing:-0.6px; color:var(--n9);}
.kpi-strip-card .k-delta{font-size:11.5px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:4px;}
.kpi-strip-card .k-delta.up{color:var(--n8);}

.widget-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:1000px){.widget-grid3{grid-template-columns:1fr;}}
.widget-card{background:var(--n0); border-radius:16px; padding:20px; box-shadow:var(--shadow-sm); animation:fadeUp .45s ease .1s both; transition:transform .18s ease;}
.widget-card:hover{transform:scale(1.015);}
.widget-card .w-title{font-size:12.5px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.04em; margin:0 0 12px;}

.legend-row{display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--n7);}
.legend-dot{width:8px; height:8px; border-radius:50%;}

.mini-list{display:flex; flex-direction:column; gap:2px;}
.mini-list-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--n2); font-size:12.5px;}
.mini-list-row:last-child{border-bottom:none;}
.rank-badge{width:20px; height:20px; border-radius:9999px; background:var(--n2); color:var(--n7); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rank-badge.top{background:var(--m600); color:#fff;}

.stat-row{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.stat-card{
  flex:1; min-width:150px; background:var(--n0); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow-sm);
  animation:fadeUp .4s ease both;
}
.stat-card .stat-label{font-size:11.5px; color:var(--n7); margin-bottom:6px;}
.stat-card .stat-value{font-size:26px; font-weight:800; color:var(--n9); letter-spacing:-0.5px;}

.chart-panel{background:var(--n0); border-radius:18px; padding:22px; box-shadow:var(--shadow-sm); margin-bottom:20px; animation:fadeUp .45s ease .05s both;}
.chart-panel .cp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.cp-title{font-size:16px; font-weight:800; margin:0;}
.updated-tag{font-size:11px; color:var(--n6); display:flex; align-items:center; gap:5px;}

table.data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.data-table th{text-align:left; padding:10px 12px; color:var(--n6); font-weight:700; border-bottom:1px solid var(--n3); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
table.data-table td{padding:12px; border-bottom:1px solid var(--n2); color:var(--n8);}
table.data-table tr.clickable{cursor:pointer;}
table.data-table tr.clickable:hover td{background:var(--n1);}
.status-badge{padding:3px 11px; border-radius:9999px; font-size:11px; font-weight:700; display:inline-block; background:var(--n2); color:var(--n7);}
.status-badge.ok{background:var(--m50); color:var(--m800);}
.status-badge.err{background:var(--s2-bg); color:var(--s2-text);}
.status-badge.warn{background:var(--s3-bg); color:var(--s3-text);}

/* lifecycle pipeline */
.pipeline-row{display:flex; align-items:center; gap:0; margin:24px 0; position:relative;}
.pipeline-stage{flex:1; text-align:center; position:relative; z-index:1;}
.pipeline-stage .ps-circle{
  width:64px; height:64px; border-radius:9999px; background:var(--n1); color:var(--n7); display:flex; align-items:center;
  justify-content:center; margin:0 auto 10px; font-size:22px; border:2px solid var(--n3);
}
.pipeline-stage.active .ps-circle{background:var(--m50); color:var(--m700); border-color:var(--m500); animation:ringPulse 2.4s infinite;}
.pipeline-stage .ps-label{font-size:13px; font-weight:700; color:var(--n9);}
.pipeline-stage .ps-count{font-size:11.5px; color:var(--n6); margin-top:2px;}
.pipeline-line{position:absolute; top:32px; left:12%; right:12%; height:2px; background:var(--n3); z-index:0;}
.pipeline-line-fill{position:absolute; top:0; left:0; height:100%; background:var(--m400); width:55%;}

/* permission matrix */
.role-pill-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.role-pill{padding:9px 16px; border-radius:9999px; border:1px solid var(--n3); background:var(--n0); font-size:12.5px; font-weight:600; color:var(--n8);}
.role-pill.active{background:var(--n9); color:#fff; border-color:var(--n9);}
.perm-matrix{width:100%; border-collapse:collapse; font-size:12.5px;}
.perm-matrix th, .perm-matrix td{padding:11px 12px; border-bottom:1px solid var(--n2); text-align:left;}
.perm-matrix th{color:var(--n6); font-weight:700; font-size:11px; text-transform:uppercase;}
.toggle-sw{width:38px; height:22px; border-radius:9999px; background:var(--n3); position:relative; border:none; flex-shrink:0;}
.toggle-sw.on{background:var(--m600);}
.toggle-sw .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s ease;}
.toggle-sw.on .knob{transform:translateX(16px);}

/* posting cards */
.posting-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:1000px){.posting-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:680px){.posting-grid{grid-template-columns:1fr;}}
.posting-card{background:var(--n0); border-radius:16px; padding:20px; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s, box-shadow .15s; animation:popIn .4s ease both;}
.posting-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
.posting-tag{display:inline-block; padding:3px 10px; border-radius:9999px; background:var(--m50); color:var(--m800); font-size:10.5px; font-weight:700; margin-bottom:10px;}
.posting-title{font-size:14.5px; font-weight:800; margin:0 0 6px;}
.posting-meta{font-size:12px; color:var(--n7); margin:0 0 12px; line-height:1.6;}
.posting-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--n6); padding-top:10px; border-top:1px solid var(--n2);}

/* modal / drawer / toast */
.overlay-backdrop{position:fixed; inset:0; background:rgba(15,20,15,0.4); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeUp .2s ease;}
.modal-box{background:var(--n0); border-radius:20px; width:480px; max-width:92vw; padding:26px; box-shadow:var(--shadow-xl); animation:popIn .22s ease;}
.modal-box.wide{width:620px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-title{font-size:18px; font-weight:800; margin:0;}
.modal-close{background:var(--n2); border:none; width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:12.5px; font-weight:700; color:var(--n7); margin-bottom:6px;}
.form-row input, .form-row select, .form-row textarea{
  width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--n3); font-size:13.5px;
  font-family:inherit; background:var(--n0); color:var(--n9);
}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}

.drawer-backdrop{position:fixed; inset:0; background:rgba(15,20,15,0.35); z-index:100;}
.drawer-panel{
  position:fixed; right:0; top:0; bottom:0; width:440px; max-width:92vw; background:var(--n0);
  box-shadow:-10px 0 30px rgba(0,0,0,0.12); z-index:101; animation:slideUpSheet .28s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; border-radius:20px 0 0 20px;
}
.drawer-head{padding:22px 24px; border-bottom:1px solid var(--n2); display:flex; align-items:center; justify-content:space-between;}
.drawer-body{padding:22px 24px; overflow-y:auto; flex:1;}
.drawer-foot{padding:16px 24px; border-top:1px solid var(--n2); display:flex; gap:8px; justify-content:flex-end;}
.detail-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.detail-row .d-label{color:var(--n6);}
.detail-row .d-value{color:var(--n9); font-weight:700;}

.toast-stack{position:fixed; bottom:26px; right:26px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--n9); color:#fff; padding:14px 20px; border-radius:9999px; font-size:13px;
  display:flex; align-items:center; gap:10px; animation:popIn .3s cubic-bezier(.2,.8,.2,1); box-shadow:var(--shadow-md);
}
.toast i{color:var(--m400); font-size:16px;}

.skel-shimmer{background:linear-gradient(90deg, var(--n2) 0px, var(--n1) 40px, var(--n2) 80px); background-size:200px 100%; animation:shimmerSweep 1.4s infinite; border-radius:10px;}
</style>
</head>

<div id="app-root"></div>

        <div className="header-actions">
          <button className="icon-btn" onClick={() => pushToast('검색을 열었습니다')}><i className="ti ti-search"></i></button>
          <button className="icon-btn" onClick={() => pushToast('알림 3건을 확인했습니다')}><i className="ti ti-bell"></i><span className="notif-dot"></span></button>
          <div className="header-avatar">관리</div>
        </div>
      </header>

      <nav className="tab-bar">
        {tabs.map(t => (
          <button key={t.view} className="tab" role="tab" aria-selected={view===t.view}
            style={view===t.view ? {background:'var(--m50)', color:'var(--n9)', fontWeight:800} : {}}
            onClick={() => setView(t.view)}>
            {t.label}
          </button>
        ))}
      </nav>

      <div className="content">
        {view==='main' && <MainView pushToast={pushToast} openDrawer={setDrawerItem} />}
        {view==='gov-dashboard' && <GovDashboardView />}
        {view==='graduate-handoff' && <GraduateHandoffView pushToast={pushToast} openDrawer={setDrawerItem} />}
        {view==='account-permissions' && <AccountPermissionsView pushToast={pushToast} />}
        {view==='company-posting' && <CompanyPostingView pushToast={pushToast} openDrawer={setDrawerItem} />}
      </div>

      {drawerItem && (
        <Drawer title={(drawerItem.name || drawerItem.title) + ' 상세'} onClose={() => setDrawerItem(null)}
          footer={<button className="btn-ghost" onClick={() => setDrawerItem(null)}>닫기</button>}>
          {drawerItem.score !== undefined && (
            <React.Fragment>
              <div className="detail-row"><span className="d-label">순위</span><span className="d-value">{drawerItem.rank}위</span></div>
              <div className="detail-row"><span className="d-label">매칭 점수</span><span className="d-value">{drawerItem.score}점</span></div>
              <div className="detail-row"><span className="d-label">동의 상태</span><span className="d-value">열람 동의 완료</span></div>
            </React.Fragment>
          )}
          {drawerItem.year !== undefined && (
            <React.Fragment>
              <div className="detail-row"><span className="d-label">졸업연도</span><span className="d-value">{drawerItem.year}</span></div>
              <div className="detail-row"><span className="d-label">현재 상태</span><span className="d-value">{drawerItem.status}</span></div>
              <div className="detail-row"><span className="d-label">최근 갱신</span><span className="d-value">{drawerItem.updated}</span></div>
            </React.Fragment>
          )}
          {drawerItem.meta !== undefined && (
            <React.Fragment>
              <div className="detail-row"><span className="d-label">유형</span><span className="d-value">{drawerItem.tag}</span></div>
              <div className="detail-row"><span className="d-label">모집 정보</span><span className="d-value">{drawerItem.meta}</span></div>
              <div className="detail-row"><span className="d-label">지원 현황</span><span className="d-value">{drawerItem.apps}건</span></div>
            </React.Fragment>
          )}
        </Drawer>
      )}
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
