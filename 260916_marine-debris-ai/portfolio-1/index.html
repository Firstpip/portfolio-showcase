  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {

a { color: inherit; text-decoration: none; }

@keyframes toastIn { from { opacity:0; transform: translate(-50%,16px);} to { opacity:1; transform: translate(-50%,0);} }
@keyframes spinSoft { to { transform: rotate(360deg); } }

.app-shell { width:100%; min-height:100vh; display:flex; flex-direction:column; }

.app-header {

  display:flex; align-items:center; gap:20px;
  height: 60px; padding: 0 28px;
  background: var(--n0); border-bottom: 1px solid var(--n3);

.brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; letter-spacing:-0.01em; color:var(--n10); }

.icon-btn { position:relative; width:34px; height:34px; border-radius:50%; border:1px solid var(--n3); background:var(--n0); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--n8); }

.spinner { width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation: spinSoft .7s linear infinite; }

function latestRiskBySite(day) {
  return SITES.map((s) => {
    const past = (LOTS[s.id] || []).filter((l) => l.date <= '2026.' + day).sort((a, b) => (a.date < b.date ? 1 : -1));
    return past.length ? { site: s, risk: past[0].risk } : null;
  }).filter(Boolean);
}
function avgRisk(day) {
  const r = latestRiskBySite(day);
  return r.length ? Math.round(r.reduce((a, x) => a + x.risk, 0) / r.length) : 0;
}
function dangerSiteCount(day) { return latestRiskBySite(day).filter((x) => gradeOf(x.risk) === 'danger').length; }

const TREND = DAYS.map((d) => ({ date: d, riskIndex: avgRisk(d) }));

const GRADE_DIST = [['ok', '정상'], ['warn', '주의'], ['danger', '위험']].map(([key, name]) => ({
  key, name, value: CAPTURES.filter((c) => gradeOf(c.risk) === key).length,
}));

const SITE_RISK_BAR = latestRiskBySite(TODAY).map((x) => ({ name: x.site.name.replace('거점', ''), risk: x.risk }));

const TIMELINE_EVENTS = [...CAPTURES].sort((a, b) => (a.time < b.time ? 1 : -1)).slice(0, 5).map((c) => {
  const g = gradeOf(c.risk);
  return { text: c.site + ' ' + c.lot.replace('2026-09 ', '') + ' ' + GRADE_META[g].label + ' 판정 (위험지수 ' + c.risk + ')', time: c.time.slice(5), grade: g };
});

const RECENT_7 = CAPTURES.filter((c) => c.time.slice(5, 10) > WEEK_AGO).length;
const PREV_7 = CAPTURES.length - RECENT_7;

function StatCard({ label, value, delta, deltaType, iconName }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    let raf, start;
    const dur = 700;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / dur);
      setDisplay(Math.round(value * p));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return (
    <div className="stat-card">
      <div className="stat-top">
        <span className="stat-label">{label}</span>
        <Icon name={iconName} size={15} style={{ color: 'var(--n6)' }} />
      </div>
      <div className="stat-value">{display}</div>
      <div className={'stat-delta ' + (deltaType || 'flat')}>
        {deltaType === 'up' ? <Icon name="trending-up" size={12} /> : <Icon name="minus" size={12} />}
        {delta}
      </div>
      <svg className="spark" width="100%" height="22" viewBox="0 0 100 22" preserveAspectRatio="none">
        <polyline points="0,18 15,12 30,15 45,8 60,10 75,4 100,7" fill="none" stroke="var(--m400)" strokeWidth="2" />
      </svg>
    </div>
  );
}

function RiskGauge({ risk }) {
  const g = GRADE_META[gradeOf(risk)];
  return (
    <div className="gauge-wrap">
      <div className="gauge-track"><div className="gauge-fill" style={{ width: risk + '%', background: g.color }} /></div>
      <span style={{ fontSize: 13, fontWeight: 700 }}>{risk}</span>
    </div>
  );
}

function SiteLotView({ onOpenDetail }) {

  const rows = SITES.flatMap((s) => (LOTS[s.id] || []).map((l) => ({ ...l, siteName: s.name })))
    .filter((l) => riskFilter === 'all' || gradeOf(l.risk) === riskFilter);

  // 로트에서 연 상세도 촬영 기록의 GPS·촬영 시각을 그대로 보여준다
  function openLot(l) {
    const c = CAPTURES.find((x) => x.lot === l.name && x.site === l.siteName);
    onOpenDetail(c || { id: l.id, site: l.siteName, lot: l.name, gps: '-', time: l.date, envelope: l.envelope, risk: l.risk });

                <td>
                  <select value={u.role} onChange={(e) => changeRole(u.id, e.target.value)} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '5px 8px', fontSize: 12.5 }}>
                    <option>현장 작업자</option>
                    <option>거점 관리자</option>
                  </select>
                </td>
                <td>{u.site}</td>
                <td><span className={'badge ' + (u.status === '활성' ? 'grade-ok' : 'grade-warn')}>{u.status}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {siteModal && (
        <Modal title="거점 추가" onClose={() => setSiteModal(false)} footer={<>
          <button className="btn btn-ghost" onClick={() => setSiteModal(false)}>취소</button>
          <button className="btn btn-primary" onClick={addSite}>등록</button>
        </>}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div className="field"><label>거점명</label><input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }} /></div>
            <div className="field"><label>지역</label><input type="text" value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }} /></div>
            <div className="field"><label>담당자</label><input type="text" value={form.manager} onChange={(e) => setForm({ ...form, manager: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }} /></div>
          </div>
        </Modal>
      )}
      {userModal && (
        <Modal title="사용자 초대" onClose={() => setUserModal(false)} footer={<>
          <button className="btn btn-ghost" onClick={() => setUserModal(false)}>취소</button>
          <button className="btn btn-primary" onClick={addUser}>초대</button>
        </>}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div className="field"><label>이름</label><input type="text" value={userForm.name} onChange={(e) => setUserForm({ ...userForm, name: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }} /></div>
            <div className="field"><label>권한</label>
              <select value={userForm.role} onChange={(e) => setUserForm({ ...userForm, role: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }}>
                <option>현장 작업자</option><option>거점 관리자</option>
              </select>
            </div>
            <div className="field"><label>소속 거점</label>
              <select value={userForm.site} onChange={(e) => setUserForm({ ...userForm, site: e.target.value })} style={{ border: '1px solid var(--n3)', borderRadius: 6, padding: '9px 12px' }}>
                {SITES.map((s) => <option key={s.id}>{s.name}</option>)}
              </select>
            </div>
          </div>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="거점 삭제" onClose={() => setConfirmDelete(null)} footer={<>
          <button className="btn btn-ghost" onClick={() => setConfirmDelete(null)}>취소</button>
          <button className="btn btn-primary" style={{ background: 'var(--n10)' }} onClick={() => removeSite(confirmDelete.id)}>삭제</button>
        </>}>
          <p style={{ margin: 0, fontSize: 13.5 }}>'{confirmDelete.name}'을(를) 정말 삭제하시겠습니까? 관련 로트·촬영 기록은 보존됩니다.</p>
        </Modal>
      )}
    </section>
  );
}

function App() {
  const [tab, setTab] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [detail, setDetail] = useState(null);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  function showToast(msg) {
    setToast(msg);
    window.clearTimeout(window.__mgToast);
    window.__mgToast = window.setTimeout(() => setToast(null), 2600);
  }

  return (
    <div className="app-shell" data-archetype="topbar-analytics">
      <header className="app-header">
        <div className="brand">
          <span className="brand-mark"><Icon name="waves" size={15} /></span>
          마린가드 판정 콘솔
        </div>
        <div className="project-switcher" onClick={() => showToast('권역별 거점 필터를 엽니다')}>
          전체 권역 · 5개 거점 <Icon name="chevron-down" size={13} />
        </div>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => showToast('거점·로트 검색을 엽니다')}><Icon name="search" size={16} /></button>
          <button className="icon-btn" onClick={() => showToast('위험 판정 거점 알림 ' + dangerSiteCount(TODAY) + '건이 있습니다')}><Icon name="bell" size={16} /><span className="ping-dot" /></button>
          <div className="avatar">김</div>
        </div>
      </header>

      <nav className="tab-bar">
        <button className="tab" data-active={tab === 'dashboard'} onClick={() => setTab('dashboard')}>AI 판정 분석 대시보드</button>
        <button className="tab" data-active={tab === 'capture-log'} onClick={() => setTab('capture-log')}>현장 촬영 이력</button>
        <button className="tab" data-active={tab === 'site-lot'} onClick={() => setTab('site-lot')}>거점·로트 조회</button>
        <button className="tab" data-active={tab === 'report'} onClick={() => setTab('report')}>판정 리포트</button>
        <button className="tab" data-active={tab === 'site-manage'} onClick={() => setTab('site-manage')}>거점 관리</button>
      </nav>

      <main className="content">
        {tab === 'dashboard' && <DashboardView />}
        {tab === 'capture-log' && <CaptureLogView onOpenDetail={setDetail} />}
        {tab === 'site-lot' && <SiteLotView onOpenDetail={setDetail} />}
        {tab === 'report' && <ReportView showToast={showToast} />}
        {tab === 'site-manage' && <SiteManageView showToast={showToast} />}
      </main>

      {detail && (
        <Modal title="판정 상세" onClose={() => setDetail(null)} footer={<>
          <button className="btn btn-ghost" onClick={() => setDetail(null)}>닫기</button>
          <button className="btn btn-primary" onClick={() => { showToast('리포트에 포함되었습니다'); setDetail(null); }}><Icon name="file-plus" size={14} />리포트에 포함</button>
        </>}>
          <div className="mask-thumb" style={{ height: 200 }}><MaskThumb seed={seedOf(detail.id)} size={200} /></div>
          <RiskGauge risk={detail.risk} />
          <div className="info-grid">
            <div className="info-item"><div className="k">거점</div><div className="v">{detail.site}</div></div>
            <div className="info-item"><div className="k">로트</div><div className="v">{detail.lot}</div></div>
            <div className="info-item"><div className="k">GPS 좌표</div><div className="v">{detail.gps}</div></div>
            <div className="info-item"><div className="k">촬영 시각</div><div className="v">{detail.time}</div></div>
            <div className="info-item"><div className="k">봉투 수</div><div className="v">{detail.envelope}개</div></div>
            <div className="info-item"><div className="k">판정</div><div className="v">{GRADE_META[gradeOf(detail.risk)].label}</div></div>
          </div>
        </Modal>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
