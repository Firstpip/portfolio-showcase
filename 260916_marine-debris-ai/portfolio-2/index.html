<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마린가드 거점 통합 관제 플랫폼 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 152°, light) ── */
:root{
  --m50:#eff4f2; --m100:#eff4f2; --m200:#eff4f2; --m300:#dfe8e4; --m400:#bfd2c9;
  --m500:#98b7a9; --m600:#6d9884; --m700:#447b62; --m800:#1b5e3f; --m900:#164d34;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d7d6;
  --n5:#b5bab8; --n6:#909894; --n7:#797776; --n8:#535a57; --n9:#363a38; --n10:#242424;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;

  --radius-card: 22px;
  --radius-pill: 999px;
  --shadow-float: 0 14px 34px rgba(27,40,33,.16);
  --shadow-soft: 0 0 10px rgba(0,0,0,.10);
}
* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n10);
  -webkit-font-smoothing: antialiased;
  width: 100%;
}
button, input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }
#root { width: 100%; min-height: 100vh; }

@keyframes fadeInUp { from { opacity:0; transform: translateY(18px);} to { opacity:1; transform: translateY(0);} }
@keyframes floatPulse { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }
@keyframes ringPing { 0% { transform: scale(0.6); opacity:.65;} 100% { transform: scale(2.4); opacity:0;} }
@keyframes barGrowP2 { from { transform: scaleX(0);} to { transform: scaleX(1);} }
@keyframes toastInP2 { from { opacity:0; transform: translate(-50%,18px);} to { opacity:1; transform: translate(-50%,0);} }

.app-shell { width:100%; min-height:100vh; display:flex; flex-direction:column; }

.topnav { position:sticky; top:0; z-index:40; width:100%; display:flex; align-items:center; gap:28px; padding:0 32px; height:74px; background: rgba(246,243,241,.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--n1); }
.logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; letter-spacing:-0.01em; }
.logo-dot { width:30px; height:30px; border-radius:50%; background: var(--m800); display:flex; align-items:center; justify-content:center; color:#fff; animation: floatPulse 3.4s ease-in-out infinite; }
.nav-links { display:flex; align-items:center; gap:6px; margin-left:8px; }
.nav-link { padding:9px 16px; border-radius: var(--radius-pill); font-size:13.5px; font-weight:600; color:var(--n8); background:transparent; border:none; cursor:pointer; }
.nav-link:hover { background: var(--n2); }
.nav-link.active { background: var(--n10); color:#fff; }
.topnav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
.bell-btn { position:relative; width:38px; height:38px; border-radius:50%; border:1px solid var(--n1); background:var(--n0); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.bell-count { position:absolute; top:-4px; right:-4px; background: var(--s2); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.pill-btn { border:none; border-radius: var(--radius-pill); padding:11px 24px; font-size:13.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.pill-btn.primary { background: var(--m800); color:#fff; }
.pill-btn.primary:hover { background: var(--m900); }
.pill-btn.ghost { background:transparent; border:1.4px solid var(--n9); color:var(--n9); }
.pill-btn.ghost:hover { background: var(--n2); }
.pill-btn.sm { padding:7px 15px; font-size:12px; }
.pill-btn:disabled { opacity:.5; cursor:not-allowed; }

.page { width:100%; flex:1; }
.page-inner { max-width:1280px; margin:0 auto; padding: 36px 32px 90px; width:100%; }
.page-head { margin-bottom:26px; }
.page-head h1 { font-size:42px; margin:0 0 6px; font-weight:700; letter-spacing:-0.02em; }
.page-head p { margin:0; font-size:13.5px; color:var(--n7); }

/* ── map-canvas archetype (main 화면) ── */
.map-stage { position:relative; width:100%; height: calc(100vh - 74px); overflow:hidden; background: linear-gradient(160deg, var(--m100) 0%, var(--n0) 55%, var(--n2) 100%); }
.map-canvas { position:absolute; inset:0; width:100%; height:100%; }
.map-blob { position:absolute; border-radius:48% 52% 55% 45% / 55% 45% 55% 45%; opacity:.55; filter: blur(1px); }
.marker { position:absolute; width:16px; height:16px; border-radius:50%; transform: translate(-50%,-50%); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 8px rgba(0,0,0,.18); border:2.5px solid #fff; }
.marker-ring { position:absolute; inset:-6px; border-radius:50%; border:2px solid currentColor; animation: ringPing 2.6s ease-out infinite; opacity:.5; }
.marker.selected { width:22px; height:22px; }

.geo-stats { position:absolute; top:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; background:rgba(255,255,255,.85); backdrop-filter: blur(6px); border-radius: var(--radius-pill); padding:8px 10px; box-shadow: var(--shadow-float); z-index:10; }
.geo-stat-pill { display:flex; align-items:center; gap:7px; padding:6px 14px; border-radius: var(--radius-pill); font-size:12.5px; font-weight:700; color:var(--n8); }
.geo-stat-pill b { font-size:15px; color:var(--n10); }

.drawer { position:absolute; left:20px; top:88px; bottom:20px; width:300px; background:#fff; border:1px solid var(--n1); border-radius: var(--radius-card); box-shadow: var(--shadow-float); padding:18px; display:flex; flex-direction:column; gap:12px; z-index:9; animation: fadeInUp .4s ease both; overflow-y:auto; }
.drawer-search { border:1px solid var(--n2); border-radius: var(--radius-pill); padding:10px 16px; font-size:13px; width:100%; }
.drawer-item { border-radius:16px; padding:12px 14px; cursor:pointer; border:1px solid transparent; }
.drawer-item:hover { background: var(--n2); }
.drawer-item.active { background: var(--m50); border-color: var(--m300); }
.drawer-item-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.drawer-item-name { font-size:13.5px; font-weight:700; }
.drawer-item-sub { font-size:11.5px; color:var(--n7); }

.geo-side { position:absolute; right:20px; bottom:20px; width:300px; background:#fff; border:1px solid var(--n1); border-radius: var(--radius-card); box-shadow: var(--shadow-float); padding:20px; z-index:9; animation: fadeInUp .4s ease .05s both; }
.geo-side h4 { margin:0 0 4px; font-size:15.5px; font-weight:700; }
.geo-side .sub { font-size:12px; color:var(--n7); margin-bottom:14px; }

.map-control { position:absolute; right:20px; top:20px; display:flex; flex-direction:column; gap:6px; z-index:9; }
.map-control button { width:36px; height:36px; border-radius:12px; border:none; background:#fff; box-shadow: var(--shadow-float); cursor:pointer; display:flex; align-items:center; justify-content:center; }

.legend { position:absolute; left:20px; bottom:20px; background:#fff; border-radius: var(--radius-card); box-shadow: var(--shadow-float); padding:14px 18px; z-index:8; font-size:12px; display:flex; gap:14px; }
.legend-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }

/* generic content cards */
.card { background:#fff; border-radius: var(--radius-card); padding:26px; box-shadow: var(--shadow-soft); }
.grid-3 { display:grid; grid-template-columns: repeat(3,1fr); gap:20px; }
.grid-2 { display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; }

/* alert center */
.alert-tabs { display:flex; gap:8px; margin-bottom:18px; }
.alert-list { display:flex; flex-direction:column; gap:12px; }
.alert-item { background:#fff; border-radius:18px; padding:18px 20px; display:flex; gap:14px; align-items:flex-start; box-shadow: var(--shadow-soft); transition: transform .15s; }
.alert-item:hover { transform: translateY(-2px); }
.alert-item.read { opacity:.55; }
.alert-ico { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.alert-body { flex:1; }
.alert-title { font-size:14px; font-weight:700; margin-bottom:3px; }
.alert-meta { font-size:11.5px; color:var(--n7); }
.badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 10px; border-radius: var(--radius-pill); }
.badge.danger { background: var(--s2-bg); color: var(--s2-text); }
.badge.warn { background: var(--s3-bg); color: var(--s3-text); }
.badge.neutral { background: var(--n2); color: var(--n8); }

/* batch upload */
.dropzone { border:2px dashed var(--n1); border-radius: var(--radius-card); padding:44px; text-align:center; cursor:pointer; transition: border-color .15s, background .15s; }
.dropzone:hover { border-color: var(--m600); background: var(--m50); }
.file-row { display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px; padding:14px 18px; box-shadow: var(--shadow-soft); }
.file-progress-track { flex:1; height:7px; border-radius:6px; background: var(--n2); overflow:hidden; }
.file-progress-fill { height:100%; border-radius:6px; transform-origin:left; animation: barGrowP2 .8s ease both; }
.conn-banner { border-radius: var(--radius-pill); padding:10px 18px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:8px; margin-bottom:16px; }
.conn-banner.online { background: var(--n2); color: var(--n8); }
.conn-banner.offline { background: var(--s3-bg); color: var(--s3-text); }

/* stats */
.stat-tile { background:#fff; border-radius: var(--radius-card); padding:22px; box-shadow: var(--shadow-soft); }
.stat-tile .num { font-size:30px; font-weight:700; letter-spacing:-0.02em; }
.stat-tile .lbl { font-size:12.5px; color:var(--n7); margin-top:4px; }

table.dt { width:100%; border-collapse:collapse; font-size:13px; }
table.dt th { text-align:left; font-size:11.5px; color:var(--n7); font-weight:700; padding:10px; border-bottom:1px solid var(--n1); }
table.dt td { padding:12px 10px; border-bottom:1px solid var(--n2); }

.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:11.5px; color:var(--n7); font-weight:700; }
.field select, .field input { border:1px solid var(--n1); border-radius:14px; padding:9px 14px; font-size:13px; background:#fff; }

.modal-overlay { position:fixed; inset:0; background:rgba(20,24,21,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal-box { background:#fff; border-radius:26px; width:100%; max-width:540px; max-height:86vh; overflow-y:auto; animation: fadeInUp .25s ease both; }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:22px 26px; border-bottom:1px solid var(--n2); }
.modal-head h3 { margin:0; font-size:17px; font-weight:700; }
.modal-close { border:none; background: var(--n2); cursor:pointer; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.modal-body { padding:22px 26px; }
.modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 26px; border-top:1px solid var(--n2); }

.toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background: var(--n10); color:#fff; padding:13px 24px; border-radius: var(--radius-pill); font-size:13px; font-weight:600; z-index:200; animation: toastInP2 .3s ease both; box-shadow: 0 14px 34px rgba(0,0,0,.28); }

.footer { width:100%; padding: 26px 32px; border-top:1px solid var(--n1); font-size:12px; color:var(--n7); display:flex; justify-content:space-between; }

@media (max-width: 980px) {
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .drawer { width: 240px; }
  .geo-side { width: 240px; }
}
@media (max-width: 640px) {
  .topnav { padding: 0 14px; gap: 10px; }
  .logo-text { display: none; }
  .nav-links { overflow-x: auto; max-width: 40vw; }
  .nav-links::-webkit-scrollbar { display: none; }
  .topnav-actions .pill-btn.sm { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell, LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

function Icon({ name, size = 17, weight = 'regular', style }) {
  return <i className={'ph' + (weight === 'fill' ? '-fill' : '') + ' ph-' + name} style={{ fontSize: size, ...style }}></i>;
}

const GRADE_P2 = {
  ok: { label: '정상', color: 'var(--n7)', badge: 'neutral' },
  warn: { label: '주의', color: 'var(--s3)', badge: 'warn' },
  danger: { label: '위험', color: 'var(--s2)', badge: 'danger' },
};
function gradeOf(idx) { return idx >= 70 ? 'danger' : idx >= 40 ? 'warn' : 'ok'; }

const SITES = [
  { id: 's1', name: '제주 서부 A거점', region: '제주특별자치도', x: 22, y: 82, risk: 76, lastEvent: '위험 판정 발생', updated: '09.14 09:21' },
  { id: 's2', name: '완도 남부 B거점', region: '전라남도', x: 32, y: 70, risk: 24, lastEvent: '정상 판정 유지', updated: '09.13 09:05' },
  { id: 's3', name: '여수 동부 C거점', region: '전라남도', x: 44, y: 62, risk: 82, lastEvent: '위험 판정 발생', updated: '09.11 15:04' },
  { id: 's4', name: '통영 남해 D거점', region: '경상남도', x: 55, y: 57, risk: 41, lastEvent: '주의 구간 진입', updated: '09.12 16:20' },
  { id: 's5', name: '포항 동해 E거점', region: '경상북도', x: 70, y: 36, risk: 15, lastEvent: '정기 점검 완료', updated: '09.10 10:33' },
];

const ALERTS = [
  { id: 'a1', site: '여수 동부 C거점', text: '위험지수 82로 위험 등급을 초과했습니다', level: 'danger', time: '09.11 15:04', read: false },
  { id: 'a2', site: '제주 서부 A거점', text: '위험지수 76로 위험 등급을 초과했습니다', level: 'danger', time: '09.14 09:21', read: false },
  { id: 'a3', site: '완도 남부 B거점', text: '위험지수가 주의 구간에 근접했습니다', level: 'warn', time: '09.13 09:05', read: false },
  { id: 'a4', site: '통영 남해 D거점', text: '위험지수가 주의 구간에 진입했습니다', level: 'warn', time: '09.12 16:20', read: true },
  { id: 'a5', site: '포항 동해 E거점', text: '정기 점검이 완료되었습니다', level: 'ok', time: '09.10 10:33', read: true },
  { id: 'a6', site: '제주 서부 A거점', text: '신규 촬영 9건이 업로드되었습니다', level: 'ok', time: '09.14 09:20', read: true },
];

const UPLOAD_FILES = [
  { id: 'f1', name: 'IMG_20260914_0921.jpg', size: '4.2MB', status: 'done', pct: 100 },
  { id: 'f2', name: 'IMG_20260914_0922.jpg', size: '3.8MB', status: 'done', pct: 100 },
  { id: 'f3', name: 'IMG_20260914_0925.jpg', size: '4.5MB', status: 'uploading', pct: 62 },
  { id: 'f4', name: 'IMG_20260914_0930.jpg', size: '3.9MB', status: 'failed', pct: 28 },
  { id: 'f5', name: 'IMG_20260914_0933.jpg', size: '4.1MB', status: 'queued', pct: 0 },
];

const TREND_SITE = [
  { w: '6월 4주', risk: 22 }, { w: '7월 1주', risk: 31 }, { w: '7월 2주', risk: 28 }, { w: '7월 3주', risk: 40 },
  { w: '7월 4주', risk: 46 }, { w: '8월 1주', risk: 39 }, { w: '8월 2주', risk: 52 }, { w: '8월 3주', risk: 58 },
  { w: '8월 4주', risk: 49 }, { w: '9월 1주', risk: 61 }, { w: '9월 2주', risk: 55 }, { w: '9월 3주', risk: 67 },
];

const SITE_VOLUME = SITES.map((s) => ({ name: s.name.replace('거점', ''), count: 18 + Math.round(s.risk / 3) }));
const GRADE_DIST_P2 = [
  { name: '정상', value: 3, key: 'ok' }, { name: '주의', value: 1, key: 'warn' }, { name: '위험', value: 1, key: 'danger' },
];

function Modal({ title, onClose, children, footer }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{ boxShadow: '0 16px 36px rgba(20,24,21,0.18)' }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><Icon name="x" size={15} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function MapView({ selected, setSelected, goDetail, showToast }) {
  const site = SITES.find((s) => s.id === selected) || SITES[0];
  const totalDanger = SITES.filter((s) => gradeOf(s.risk) === 'danger').length;
  const [q, setQ] = useState('');
  const list = SITES.filter((s) => s.name.includes(q));

  return (
    <div className="map-stage" data-archetype="map-canvas">
      <div className="map-canvas">
        <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="var(--m100)" />
              <stop offset="100%" stopColor="var(--n2)" />
            </linearGradient>
            <radialGradient id="glowGrad" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stopColor="var(--m600)" stopOpacity="0.28" />
              <stop offset="100%" stopColor="var(--m600)" stopOpacity="0" />
            </radialGradient>
          </defs>
          <rect width="100" height="100" fill="url(#waterGrad)" />
          <circle cx="46" cy="55" r="34" fill="url(#glowGrad)" />
          <path d="M0,60 C15,50 25,65 40,55 C55,45 65,58 80,48 C90,42 95,50 100,45 L100,100 L0,100 Z" fill="var(--m200)" opacity="0.45" />
          <g stroke="var(--n4)" strokeWidth="0.15" opacity="0.5">
            {Array.from({ length: 10 }).map((_, i) => <line key={i} x1={i * 10} y1="0" x2={i * 10} y2="100" />)}
            {Array.from({ length: 10 }).map((_, i) => <line key={'h' + i} x1="0" y1={i * 10} x2="100" y2={i * 10} />)}
          </g>
        </svg>
        <div className="map-blob" style={{ width: 260, height: 260, left: '8%', top: '10%', background: 'radial-gradient(circle, var(--m400) 0%, transparent 70%)' }} />
        <div className="map-blob" style={{ width: 200, height: 200, right: '6%', top: '4%', background: 'radial-gradient(circle, var(--m300) 0%, transparent 70%)' }} />
        {SITES.map((s) => {
          const g = GRADE_P2[gradeOf(s.risk)];
          const isSel = s.id === selected;
          return (
            <div key={s.id} className={'marker' + (isSel ? ' selected' : '')} style={{ left: s.x + '%', top: s.y + '%', background: g.color, color: g.color }} onClick={() => setSelected(s.id)}>
              {isSel && <span className="marker-ring" />}
            </div>
          );
        })}
      </div>

      <div className="geo-stats">
        <div className="geo-stat-pill"><Icon name="map-pin-area" size={15} /> 총 거점 <b>{SITES.length}</b></div>
        <div className="geo-stat-pill"><Icon name="warning" size={15} style={{ color: 'var(--s2)' }} /> 위험 거점 <b>{totalDanger}</b></div>
        <div className="geo-stat-pill"><Icon name="bell-ringing" size={15} /> 금일 신규 이벤트 <b>{ALERTS.filter((a) => !a.read).length}</b></div>
      </div>

      <div className="drawer">
        <input className="drawer-search" placeholder="거점명 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        {list.map((s) => {
          const g = GRADE_P2[gradeOf(s.risk)];
          return (
            <div key={s.id} className={'drawer-item' + (s.id === selected ? ' active' : '')} onClick={() => setSelected(s.id)}>
              <div className="drawer-item-top">
                <span className="drawer-item-name">{s.name}</span>
                <span className="badge" style={{ background: g.badge === 'neutral' ? 'var(--n2)' : undefined }}>
                  <span className="legend-dot" style={{ background: g.color, marginRight: 4 }}></span>{g.label}
                </span>
              </div>
              <div className="drawer-item-sub">{s.region} · 위험지수 {s.risk}</div>
            </div>
          );
        })}
      </div>

      <div className="geo-side">
        <h4>{site.name}</h4>
        <div className="sub">{site.region} · {site.updated} 갱신</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
          <span className="badge" style={{ background: GRADE_P2[gradeOf(site.risk)].badge === 'danger' ? 'var(--s2-bg)' : GRADE_P2[gradeOf(site.risk)].badge === 'warn' ? 'var(--s3-bg)' : 'var(--n2)', color: GRADE_P2[gradeOf(site.risk)].color }}>
            위험지수 {site.risk}
          </span>
          <span style={{ fontSize: 12, color: 'var(--n7)' }}>{site.lastEvent}</span>
        </div>
        <button className="pill-btn primary sm" onClick={() => goDetail(site.id)} style={{ width: '100%', justifyContent: 'center' }}>
          거점 상세 <Icon name="arrow-right" size={14} />
        </button>
      </div>

      <div className="map-control">
        <button onClick={() => showToast('지도를 확대합니다')}><Icon name="plus" size={16} /></button>
        <button onClick={() => showToast('지도를 축소합니다')}><Icon name="minus" size={16} /></button>
        <button onClick={() => showToast('지도 레이어를 전환합니다')}><Icon name="stack" size={16} /></button>
      </div>

      <div className="legend">
        <span><span className="legend-dot" style={{ background: 'var(--n7)' }}></span>정상</span>
        <span><span className="legend-dot" style={{ background: 'var(--s3)' }}></span>주의</span>
        <span><span className="legend-dot" style={{ background: 'var(--s2)' }}></span>위험</span>
      </div>
    </div>
  );
}

function AlertView({ showToast }) {
  const [items, setItems] = useState(ALERTS);
  const [filter, setFilter] = useState('all');
  const filtered = items.filter((a) => filter === 'all' || a.level === filter);

  function markRead(id) { setItems((s) => s.map((a) => a.id === id ? { ...a, read: true } : a)); showToast('알림을 확인 처리했습니다'); }

  return (
    <div className="page-inner">
      <div className="page-head"><h1>위험등급 알림</h1><p>위험지수 임계값 초과 이벤트를 자동으로 감지해 알림 센터에 표시합니다</p></div>
      <div className="alert-tabs">
        {[['all', '전체'], ['danger', '긴급'], ['warn', '주의'], ['ok', '완료']].map(([k, l]) => (
          <button key={k} className={'pill-btn sm ' + (filter === k ? 'primary' : 'ghost')} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>
      <div className="alert-list">
        {filtered.map((a) => (
          <div className={'alert-item' + (a.read ? ' read' : '')} key={a.id}>
            <div className="alert-ico" style={{ background: GRADE_P2[a.level].badge === 'danger' ? 'var(--s2-bg)' : GRADE_P2[a.level].badge === 'warn' ? 'var(--s3-bg)' : 'var(--n2)' }}>
              <Icon name={a.level === 'danger' ? 'warning' : a.level === 'warn' ? 'clock-countdown' : 'check-circle'} size={18} style={{ color: GRADE_P2[a.level].color }} />
            </div>
            <div className="alert-body">
              <div className="alert-title">{a.site}</div>
              <div>{a.text}</div>
              <div className="alert-meta">{a.time}</div>
            </div>
            {!a.read && <button className="pill-btn ghost sm" onClick={() => markRead(a.id)}>확인 처리</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

function BatchUploadView({ showToast }) {
  const [files, setFiles] = useState(UPLOAD_FILES);
  const [online, setOnline] = useState(true);

  function retry(id) { setFiles((f) => f.map((x) => x.id === id ? { ...x, status: 'uploading', pct: 10 } : x)); showToast('업로드를 재시도합니다'); }
  function toggleConn() {
    setOnline((v) => !v);
    if (online) showToast('네트워크 연결이 끊겼습니다 — 업로드가 일시 중단됩니다');
    else { showToast('네트워크가 재연결되어 업로드를 자동으로 재개합니다'); setFiles((f) => f.map((x) => x.status === 'failed' ? { ...x, status: 'uploading', pct: 20 } : x)); }
  }

  const statusMeta = { done: { label: '완료', color: 'var(--n7)' }, uploading: { label: '업로드 중', color: 'var(--m700)' }, failed: { label: '실패', color: 'var(--s2)' }, queued: { label: '대기', color: 'var(--n6)' } };

  return (
    <div className="page-inner">
      <div className="page-head"><h1>오프라인 일괄 업로드</h1><p>오프라인 상태에서 누적된 촬영 데이터를 복귀 시 한 번에 업로드합니다</p></div>
      <div className={'conn-banner ' + (online ? 'online' : 'offline')} onClick={toggleConn} style={{ cursor: 'pointer' }}>
        <Icon name={online ? 'wifi-high' : 'wifi-slash'} size={15} /> {online ? '네트워크 연결됨 — 클릭 시 연결 끊김 시뮬레이션' : '오프라인 — 클릭 시 재연결'}
      </div>
      <div className="dropzone" onClick={() => showToast('촬영 데이터 5건을 업로드 대기열에 추가했습니다')}>
        <Icon name="upload-simple" size={28} style={{ color: 'var(--m700)' }} />
        <div style={{ marginTop: 10, fontWeight: 700 }}>여기를 클릭하거나 파일을 끌어다 놓으세요</div>
        <div style={{ fontSize: 12, color: 'var(--n7)', marginTop: 4 }}>오프라인 구간 누적 이미지를 한 번에 큐에 올립니다</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 20 }}>
        {files.map((f) => {
          const m = statusMeta[f.status];
          return (
            <div className="file-row" key={f.id}>
              <Icon name="image" size={20} style={{ color: 'var(--n6)' }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{f.name}</div>
                <div style={{ fontSize: 11, color: 'var(--n7)' }}>{f.size}</div>
              </div>
              <div className="file-progress-track" style={{ width: 140 }}>
                <div className="file-progress-fill" style={{ width: f.pct + '%', background: f.status === 'failed' ? 'var(--s2)' : 'var(--m700)' }} />
              </div>
              <span style={{ fontSize: 12, fontWeight: 700, color: m.color, width: 64, textAlign: 'right' }}>{m.label}</span>
              {f.status === 'failed' && <button className="pill-btn ghost sm" onClick={() => retry(f.id)}>재시도</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatsView({ showToast }) {
  const [period, setPeriod] = useState('2026-09');
  const [generating, setGenerating] = useState(false);

  function exportPdf() {
    setGenerating(true);
    setTimeout(() => { setGenerating(false); showToast(period + ' 거점 통계 리포트를 PDF로 내보냈습니다'); }, 1400);
  }

  return (
    <div className="page-inner">
      <div className="page-head"><h1>거점 통계 리포트</h1><p>전체 거점의 판정 통계를 기간별로 집계해 종합 리포트로 제공합니다</p></div>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end', marginBottom: 22 }}>
        <div className="field"><label>집계 월</label><input type="month" value={period} onChange={(e) => setPeriod(e.target.value)} /></div>
        <button className="pill-btn primary" onClick={exportPdf} disabled={generating}>
          <Icon name="file-pdf" size={15} /> {generating ? '내보내는 중...' : 'PDF로 내보내기'}
        </button>
      </div>
      <div className="grid-3" style={{ marginBottom: 20 }}>
        <div className="stat-tile"><div className="num">{SITE_VOLUME.reduce((a, s) => a + s.count, 0)}</div><div className="lbl">이번 달 총 촬영 건수</div></div>
        <div className="stat-tile"><div className="num">{SITES.length}</div><div className="lbl">집계 대상 거점 수</div></div>
        <div className="stat-tile"><div className="num">{Math.round(SITES.reduce((a, s) => a + s.risk, 0) / SITES.length)}</div><div className="lbl">전체 평균 위험지수</div></div>
      </div>
      <div className="grid-2">
        <div className="card">
          <h3 style={{ marginTop: 0 }}>거점별 촬영 건수</h3>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={SITE_VOLUME} margin={{ left: -18 }}>
              <CartesianGrid stroke="var(--n2)" vertical={false} />
              <XAxis dataKey="name" tick={{ fontSize: 10, fill: 'var(--n7)' }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize: 10, fill: 'var(--n7)' }} axisLine={false} tickLine={false} width={24} />
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 10 }} />
              <Bar dataKey="count" radius={[8, 8, 0, 0]} fill="var(--m700)" />
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div className="card">
          <h3 style={{ marginTop: 0 }}>위험등급 비율</h3>
          <ResponsiveContainer width="100%" height={220}>
            <PieChart>
              <Pie data={GRADE_DIST_P2} dataKey="value" nameKey="name" innerRadius={44} outerRadius={72} paddingAngle={3}>
                {GRADE_DIST_P2.map((d, i) => <Cell key={i} fill={d.key === 'ok' ? 'var(--n6)' : d.key === 'warn' ? 'var(--s3)' : 'var(--s2)'} />)}
              </Pie>
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 10 }} />
            </PieChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function SiteDetailView({ selected, setSelected }) {
  const site = SITES.find((s) => s.id === selected) || SITES[0];
  return (
    <div className="page-inner">
      <div className="page-head"><h1>거점 상세</h1><p>거점의 위험지수 이력과 최근 판정 기록을 확인합니다</p></div>
      <div className="field" style={{ marginBottom: 20, maxWidth: 280 }}>
        <label>거점 선택</label>
        <select value={site.id} onChange={(e) => setSelected(e.target.value)}>
          {SITES.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>
      <div className="grid-2">
        <div className="card">
          <h3 style={{ marginTop: 0 }}>{site.name} 위험지수 12주 추이</h3>
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={TREND_SITE} margin={{ left: -18 }}>
              <CartesianGrid stroke="var(--n2)" vertical={false} />
              <XAxis dataKey="w" tick={{ fontSize: 9.5, fill: 'var(--n7)' }} axisLine={false} tickLine={false} interval={1} />
              <YAxis tick={{ fontSize: 10, fill: 'var(--n7)' }} axisLine={false} tickLine={false} width={24} />
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 10 }} />
              <Line type="monotone" dataKey="risk" stroke="var(--m700)" strokeWidth={2.5} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div className="card">
          <h3 style={{ marginTop: 0 }}>거점 위치</h3>
          <div style={{ position: 'relative', width: '100%', height: 200, borderRadius: 16, overflow: 'hidden', background: 'var(--m100)' }}>
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
              <path d="M0,60 C15,50 25,65 40,55 C55,45 65,58 80,48 C90,42 95,50 100,45 L100,100 L0,100 Z" fill="var(--m300)" opacity="0.5" />
            </svg>
            <div className="marker selected" style={{ position: 'absolute', left: site.x + '%', top: (site.y - 20) + '%', background: 'var(--m800)' }}>
              <span className="marker-ring" style={{ color: 'var(--m800)' }} />
            </div>
          </div>
          <div style={{ marginTop: 14, fontSize: 13, color: 'var(--n7)' }}>{site.region} · 최근 갱신 {site.updated}</div>
        </div>
      </div>
      <div className="card" style={{ marginTop: 20 }}>
        <h3 style={{ marginTop: 0 }}>최근 판정 기록</h3>
        <table className="dt">
          <thead><tr><th>로트</th><th>위험지수</th><th>판정</th><th>비고</th></tr></thead>
          <tbody>
            {[0, 1, 2].map((i) => {
              const r = Math.max(10, site.risk - i * 14 + (i % 2 ? 6 : -4));
              const g = GRADE_P2[gradeOf(r)];
              return (
                <tr key={i}>
                  <td>2026-09 {3 - i}주차 로트</td>
                  <td>{r}</td>
                  <td><span className="badge" style={{ color: g.color }}>{g.label}</span></td>
                  <td>{site.lastEvent}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('map');
  const [selected, setSelected] = useState('s1');
  const [toast, setToast] = useState(null);

  function showToast(msg) { setToast(msg); window.clearTimeout(window.__mgToast2); window.__mgToast2 = window.setTimeout(() => setToast(null), 2600); }
  function goDetail(id) { setSelected(id); setView('site-detail'); }

  const navItems = [
    ['map', '거점 지도 관제'],
    ['alert', '위험등급 알림'],
    ['batch-upload', '오프라인 일괄 업로드'],
    ['stats', '거점 통계 리포트'],
    ['site-detail', '거점 상세'],
  ];

  return (
    <div className="app-shell">
      <nav className="topnav">
        <div className="logo"><span className="logo-dot"><Icon name="waves" size={15} weight="fill" /></span><span className="logo-text">마린가드 관제</span></div>
        <div className="nav-links">
          {navItems.map(([k, l]) => (
            <button key={k} className={'nav-link' + (view === k ? ' active' : '')} onClick={() => setView(k)}>{l}</button>
          ))}
        </div>
        <div className="topnav-actions">
          <button className="bell-btn" onClick={() => setView('alert')}>
            <Icon name="bell-ringing" size={18} />
            <span className="bell-count">{ALERTS.filter((a) => !a.read).length}</span>
          </button>
          <button className="pill-btn primary sm" onClick={() => showToast('전체 거점 요약 리포트를 요청했습니다')}>요약 리포트</button>
        </div>
      </nav>

      <div className="page">
        {view === 'map' && <MapView selected={selected} setSelected={setSelected} goDetail={goDetail} showToast={showToast} />}
        {view === 'alert' && <AlertView showToast={showToast} />}
        {view === 'batch-upload' && <BatchUploadView showToast={showToast} />}
        {view === 'stats' && <StatsView showToast={showToast} />}
        {view === 'site-detail' && <SiteDetailView selected={selected} setSelected={setSelected} />}
      </div>

      {view !== 'map' && (
        <div className="footer">
          <span>마린가드 거점 통합 관제 플랫폼 — 자체 개발 프로젝트</span>
          <span>© 2026 마린가드</span>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
