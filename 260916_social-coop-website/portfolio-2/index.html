.sb-brand-mark { width:32px; height:32px; border-radius:8px; background: linear-gradient(135deg, var(--m600), var(--m900)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }

.toggle { width:36px; height:20px; border-radius:999px; background:var(--n4); position:relative; display:inline-block; transition: background .15s ease; }

.toast-stack { position:fixed; bottom:24px; right:24px; z-index:100; display:flex; flex-direction:column; gap:10px; }

@media (max-width: 980px) {

  .md-wrap { flex-direction:column; height:auto; }
  .list-rail { width:100%; }
  .kv-grid, .dash-grid { grid-template-columns:1fr; }
}

function Icon({ name, size=16, weight='' }) {
  return <i className={`ph${weight?'-'+weight:''} ph-${name}`} style={{fontSize:size, lineHeight:1}}></i>;
}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = (text) => {
    const id = Date.now();
    setToasts(l => [...l, { id, text }]);
    setTimeout(() => setToasts(l => l.filter(t=>t.id!==id)), 2500);
  };
  return { toasts, push };
}

/* ───────── 신청 내역 마스터-디테일 관리 (composition: list-rail + detail-panel) ───────── */
function MainDetailScreen({ push }) {
  const [selected, setSelected] = useState(APPLICATIONS[0].id);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [apps, setApps] = useState(APPLICATIONS);
  const [memoDraft, setMemoDraft] = useState(APPLICATIONS[0].memo);

  const filtered = useMemo(() => apps.filter(a => {
    if (filter !== 'all' && a.status !== filter) return false;
    if (search && !(a.name.includes(search) || a.id.includes(search) || a.org.includes(search))) return false;
    return true;
  }), [apps, filter, search]);

  const current = apps.find(a => a.id === selected) || filtered[0];

  const pick = (a) => { setSelected(a.id); setMemoDraft(a.memo); };

  const changeStatus = (next) => {
    setApps(list => list.map(a => a.id === current.id ? { ...a, status: next, log:[...a.log, `상태 변경 → ${next} (09.16)`] } : a));
    push(`${current.id} 상태가 '${next}'(으)로 변경되었습니다`);
  };
  const assign = (name) => {
    setApps(list => list.map(a => a.id === current.id ? { ...a, assignee: name, log:[...a.log, `담당자 배정 → ${name} (09.16)`] } : a));
    push(`담당자가 ${name}(으)로 배정되었습니다`);
  };
  const saveMemo = () => {
    setApps(list => list.map(a => a.id === current.id ? { ...a, memo: memoDraft } : a));
    push('메모가 저장되었습니다');
  };

  if (!current) return null;

  return (
    <div className="md-wrap">
      <div className="list-rail card">
        <div className="list-rail-head">
          <div className="list-search"><Icon name="magnifying-glass" size={15}/><input placeholder="이름·기관·접수번호 검색" value={search} onChange={e=>setSearch(e.target.value)} /></div>
          <div className="list-filter-row">
            {['all','대기','진행','완료'].map(f => (
              <button key={f} className={`filter-pill ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f==='all'?'전체':f}</button>
            ))}
          </div>
        </div>
        <div className="list-scroll">
          {filtered.map((a,i) => (
            <button key={a.id} className={`list-item ${selected===a.id?'selected':''}`} style={{animation:`rowIn .3s ease ${i*0.03}s both`}} onClick={()=>pick(a)}>
              <div className="li-top"><span className="li-name">{a.name} <span className="tx-caption">· {a.type}</span></span>{statusBadge(a.status)}</div>
              <div className="li-meta">{a.id} · {a.org !== '-' ? a.org : '개인'} · {a.date}</div>
            </button>
          ))}
        </div>
      </div>

      <div className="detail-panel card">
        <div className="detail-head">
          <div>
            <div className="tx-caption" style={{marginBottom:6}}>{current.id}</div>
            <div className="tx-h1">{current.name} {current.org !== '-' && <span style={{fontSize:15, color:'var(--n7)', fontWeight:500}}>· {current.org}</span>}</div>
          </div>
          {statusBadge(current.status)}
        </div>
        <div className="detail-body">
          <div className="kv-grid">
            <div className="kv-item"><span>신청 유형</span><b>{current.type}</b></div>
            <div className="kv-item"><span>연락처</span><b>{current.phone}</b></div>
            <div className="kv-item"><span>접수일</span><b>{current.date}</b></div>
            <div className="kv-item"><span>담당자</span><b>{current.assignee}</b></div>
          </div>

          <div style={{display:'flex', gap:8, marginBottom:22, flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={()=>changeStatus('대기')}>대기로</button>
            <button className="btn btn-outline btn-sm" onClick={()=>changeStatus('진행')}>진행으로</button>
            <button className="btn btn-primary btn-sm" onClick={()=>changeStatus('완료')}>완료 처리</button>
            <span style={{width:1, background:'var(--n3)'}}></span>
            {['한지훈','김도윤','윤하은'].map(n => (
              <button key={n} className="btn btn-ghost btn-sm" onClick={()=>assign(n)}>{n} 배정</button>
            ))}
          </div>

          <h3 className="tx-h3" style={{marginBottom:10}}>담당자 메모</h3>
          <textarea className="memo-box" value={memoDraft} onChange={e=>setMemoDraft(e.target.value)} placeholder="처리 경과나 특이사항을 기록하세요"></textarea>
          <button className="btn btn-outline btn-sm" style={{marginTop:10, marginBottom:22}} onClick={saveMemo}><Icon name="floppy-disk" size={14}/>메모 저장</button>

          <h3 className="tx-h3" style={{marginBottom:10}}>처리 이력</h3>
          {current.log.map((l,i) => (
            <div className="timeline-item" key={i}><span className="timeline-dot"></span>{l}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ───────── 콘텐츠·교육과정 관리 ───────── */
function ContentScreen({ push }) {
  const [tab, setTab] = useState('intro');
  const [courses, setCourses] = useState(COURSES);
  const [editing, setEditing] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [uploadPct, setUploadPct] = useState(0);
  const fileInputRef = useRef(null);

  const toggleStatus = (id) => {
    setCourses(list => list.map(c => c.id === id ? { ...c, status: c.status === '모집중' ? '마감' : '모집중' } : c));
    push('모집 상태가 변경되었습니다');
  };

  const simulateUpload = () => {
    setUploadPct(0);
    const t = setInterval(() => {
      setUploadPct(p => {
        if (p >= 100) { clearInterval(t); push('이미지 업로드가 완료되었습니다'); return 100; }
        return p + 20;
      });
    }, 180);
  };

  return (
    <div>
      <div className="content-tabs">
        <button className={`ctab ${tab==='intro'?'active':''}`} onClick={()=>setTab('intro')}>소개 콘텐츠</button>
        <button className={`ctab ${tab==='courses'?'active':''}`} onClick={()=>setTab('courses')}>교육과정</button>
      </div>

      {tab === 'intro' ? (
        <div className="card" style={{padding:22}}>
          <h3 className="tx-h3" style={{marginBottom:14}}>조합·사업 소개 섹션 편집</h3>
          <div style={{display:'grid', gridTemplateColumns:'1fr 320px', gap:22}}>
            <div>
              <label className="tx-caption" style={{display:'block', marginBottom:6}}>섹션 제목</label>
              <input defaultValue="지역과 함께 성장하는 사회적협동조합입니다" style={{width:'100%', padding:'10px 12px', border:'1.5px solid var(--n4)', borderRadius:8, marginBottom:14, fontSize:13.5}} />
              <label className="tx-caption" style={{display:'block', marginBottom:6}}>본문 내용</label>
              <textarea className="memo-box" style={{minHeight:140}} defaultValue="교육 위탁 사업과 컨설팅, 회원 커뮤니티를 하나의 홈페이지에서 만나보세요."></textarea>
              <button className="btn btn-primary btn-sm" style={{marginTop:14}} onClick={()=>push('소개 콘텐츠가 저장되었습니다')}><Icon name="floppy-disk" size={14}/>저장</button>
            </div>
            <div
              className={`upload-drop ${dragging?'dragging':''}`}
              onDragOver={e=>{e.preventDefault(); setDragging(true);}}
              onDragLeave={()=>setDragging(false)}
              onDrop={e=>{e.preventDefault(); setDragging(false); simulateUpload();}}
              onClick={()=>fileInputRef.current && fileInputRef.current.click()}
            >
              <input ref={fileInputRef} type="file" style={{display:'none'}} onChange={simulateUpload} />
              <Icon name="upload-simple" size={26}/>
              <div style={{marginTop:8, fontSize:13}}>이미지를 끌어놓거나 클릭해 업로드</div>
              {uploadPct > 0 && <div className="progress-bar"><div className="progress-fill" style={{width:uploadPct+'%'}}></div></div>}
            </div>
          </div>
        </div>
      ) : (
        <div className="card">
          {courses.map(c => (
            <div className="cms-row" key={c.id}>
              <div className="cms-thumb"><Icon name="book-open" size={20}/></div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:14}}>{c.title}</div>
                <div className="tx-caption">최근 수정 {c.updated}</div>
              </div>
              <span className={`badge ${c.status==='모집중'?'badge-s1':c.status==='마감'?'badge-neutral':'badge-s3'}`}>{c.status}</span>
              <button className="btn btn-outline btn-sm" onClick={()=>toggleStatus(c.id)}>상태 전환</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setEditing(c.id)}><Icon name="pencil-simple" size={14}/>편집</button>
            </div>
          ))}
        </div>
      )}

      {editing && (
        <div className="overlay modal-center" onClick={()=>setEditing(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h3 className="tx-h2" style={{marginTop:0}}>교육과정 편집</h3>
            <label className="tx-caption" style={{display:'block', margin:'12px 0 6px'}}>과정명</label>
            <input defaultValue={courses.find(c=>c.id===editing)?.title} style={{width:'100%', padding:'10px 12px', border:'1.5px solid var(--n4)', borderRadius:8, fontSize:13.5, marginBottom:14}} />
            <label className="tx-caption" style={{display:'block', margin:'0 0 6px'}}>정렬 순서</label>
            <input type="number" defaultValue="1" style={{width:'100%', padding:'10px 12px', border:'1.5px solid var(--n4)', borderRadius:8, fontSize:13.5, marginBottom:18}} />
            <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>{ setEditing(null); push('교육과정 정보가 저장되었습니다'); }}>저장하기</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────── 커뮤니티·회원 관리 ───────── */
function CommunityAdminScreen({ push }) {
  const [tab, setTab] = useState('reports');
  const [reports, setReports] = useState(REPORTS);
  const [members, setMembers] = useState(MEMBERS);
  const [qnaFilterUnanswered, setQnaFilterUnanswered] = useState(false);

  const resolveReport = (id) => {
    setReports(list => list.filter(r => r.id !== id));
    push('신고 처리(삭제)가 완료되었습니다');
  };
  const toggleMember = (id) => {
    setMembers(list => list.map(m => m.id === id ? { ...m, status: m.status==='정상' ? '정지' : '정상' } : m));
    push('회원 상태가 변경되었습니다');
  };

  const visibleReports = qnaFilterUnanswered ? reports.filter(r => r.kind === 'Q&A') : reports;

  return (
    <div>
      <div className="admin-tab-row">
        <button className={`ctab ${tab==='reports'?'active':''}`} onClick={()=>setTab('reports')}>게시글·Q&A 관리</button>
        <button className={`ctab ${tab==='members'?'active':''}`} onClick={()=>setTab('members')}>회원 관리</button>
      </div>

      {tab === 'reports' ? (
        <div className="card">
          <div style={{padding:'14px 16px', borderBottom:'1px solid var(--n3)', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span className="tx-h3">신고·미답변 항목 {visibleReports.length}건</span>
            <button className={`filter-pill ${qnaFilterUnanswered?'active':''}`} onClick={()=>setQnaFilterUnanswered(v=>!v)}>Q&A 미답변만</button>
          </div>
          <table className="table">
            <thead><tr><th>유형</th><th>제목</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {visibleReports.map(r => (
                <tr key={r.id}>
                  <td><span className="badge badge-neutral">{r.kind}</span></td>
                  <td>{r.title}</td>
                  <td>{r.flagged ? <span className="badge badge-s2">신고됨</span> : <span className="badge badge-s3">미답변</span>}</td>
                  <td style={{textAlign:'right'}}>
                    {r.flagged ? (
                      <button className="btn-danger-outline btn btn-sm" onClick={()=>resolveReport(r.id)}><Icon name="trash" size={13}/>삭제</button>
                    ) : (
                      <button className="btn btn-outline btn-sm" onClick={()=>push('답변이 등록되었습니다')}><Icon name="chat-circle-text" size={13}/>답변하기</button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="card">
          <table className="table">
            <thead><tr><th>회원</th><th>게시글</th><th>댓글</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {members.map(m => (
                <tr key={m.id}>
                  <td><span className="row-avatar">{m.name[0]}</span>{m.name}</td>
                  <td className="mono-num">{m.posts}</td>
                  <td className="mono-num">{m.comments}</td>
                  <td>{m.status==='정상' ? <span className="badge badge-s1">정상</span> : <span className="badge badge-s2">정지</span>}</td>
                  <td style={{textAlign:'right'}}>
                    <button className={`btn btn-sm ${m.status==='정상'?'btn-danger-outline':'btn-outline'}`} onClick={()=>toggleMember(m.id)}>
                      {m.status==='정상' ? '정지 처리' : '정지 해제'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ───────── 권한·역할 설정 ───────── */
function SettingsScreen({ push }) {
  const [matrix, setMatrix] = useState(ROLES.map(r => [...r.perms]));

  const toggle = (ri, ci) => {
    setMatrix(m => m.map((row,i) => i===ri ? row.map((v,j) => j===ci ? !v : v) : row));
  };

  return (
    <div className="card" style={{padding:22}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
        <h3 className="tx-h3">역할별 권한 매트릭스</h3>
        <button className="btn btn-primary btn-sm" onClick={()=>push('권한 설정이 저장되었습니다')}><Icon name="floppy-disk" size={14}/>저장</button>
      </div>
      <table className="table perm-table">
        <thead>
          <tr><th>역할</th>{PERM_COLS.map(c => <th key={c}>{c}</th>)}</tr>
        </thead>
        <tbody>
          {ROLES.map((r,ri) => (
            <tr key={r.role}>
              <td style={{fontWeight:700}}>{r.role}</td>
              {matrix[ri].map((v,ci) => (
                <td key={ci}><button className={`toggle ${v?'on':''}`} onClick={()=>toggle(ri,ci)}></button></td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      <p className="tx-caption" style={{marginTop:16}}>권한 변경은 즉시 반영되며, 슈퍼관리자 권한은 최소 1개 계정 이상 유지되어야 합니다.</p>

  );
}
