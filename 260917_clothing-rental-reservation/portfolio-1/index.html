<title>당일 여성의류 렌탈 예약 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; margin:0; padding:0; }
html, body { width:100%; font-family:'Pretendard', -apple-system, sans-serif; background:var(--n0); color:var(--n9); }
#root { width:100%; min-height:100vh; display:flex; flex-direction:column; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select { font-family:inherit; }
img { display:block; }

@keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@keyframes cardStagger { from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes slideInRight { from{transform:translateX(100%);} to{transform:translateX(0);} }
@keyframes softPulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
@keyframes shimmerSweep { 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }

/* ── 검색 헤더 (airbnb-search-grid 시그니처) ── */
.search-header{ position:sticky; top:0; z-index:40; width:100%; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--n3); }
.header-row{ display:flex; align-items:center; gap:24px; padding:14px 32px; max-width:1280px; margin:0 auto; }
.brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; color:var(--n9); flex-shrink:0; }
.brand i{ color:var(--m600); }
.search-bar{ display:flex; align-items:center; background:var(--n1); border:1px solid var(--n4); border-radius:9999px; padding:4px; box-shadow:rgba(71,103,136,.06) 0 4px 12px 0; flex:1; max-width:560px; }
.search-segment{ flex:1; padding:8px 18px; border-radius:9999px; text-align:left; transition:background .15s; }
.search-segment:hover{ background:var(--n2); }
.segment-label{ font-size:11px; font-weight:600; color:var(--n7); }
.segment-value{ font-size:13px; font-weight:600; color:var(--n9); margin-top:1px; }
.search-divider{ width:1px; height:24px; background:var(--n4); }
.search-submit{ width:38px; height:38px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s; }
.search-submit:hover{ transform:scale(1.06); }
.header-nav{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.nav-tab{ padding:9px 16px; border-radius:9999px; font-size:14px; font-weight:600; color:var(--n7); transition:all .15s; }
.nav-tab:hover{ background:var(--n2); color:var(--n9); }
.nav-tab.active{ background:var(--m50); color:var(--m700); }
.user-menu{ width:38px; height:38px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n7); flex-shrink:0; }

/* ── 필터 칩 ── */
.filter-chips{ display:flex; gap:8px; overflow-x:auto; padding:14px 32px; max-width:1280px; margin:0 auto; scrollbar-width:none; }
.filter-chips::-webkit-scrollbar{ display:none; }
.chip{ display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:9999px; background:var(--n1); border:1px solid var(--n4); font-size:13px; font-weight:600; color:var(--n7); white-space:nowrap; transition:all .15s; flex-shrink:0; }
.chip:hover{ border-color:var(--n6); }
.chip.active{ background:var(--m600); border-color:var(--m600); color:#fff; }
.chip.filter-toggle{ background:var(--n9); border-color:var(--n9); color:#fff; }

.view-wrap{ width:100%; max-width:1280px; margin:0 auto; flex:1; padding:0 32px 64px; animation:fadeIn .35s ease; }

/* ── 히어로 소개 문구 ── */
.hero-blurb{ padding:32px 0 8px; }
.hero-blurb h1{ font-size:44px; font-weight:700; letter-spacing:-.8px; color:var(--n9); line-height:1.2; }
.hero-blurb p{ font-size:15px; color:var(--n7); margin-top:8px; max-width:560px; line-height:1.6; }

/* ── 카드 그리드 ── */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(268px,1fr)); gap:22px; margin-top:20px; }
.listing-card{ background:var(--n1); border-radius:16px; overflow:hidden; box-shadow:rgba(71,103,136,.05) 0 2px 6px 0, rgba(71,103,136,.06) 0 10px 24px 0; transition:transform .2s, box-shadow .2s; animation:cardStagger .4s ease both; cursor:pointer; }
.listing-card:hover{ transform:translateY(-4px) scale(1.01); box-shadow:rgba(71,103,136,.08) 0 8px 20px 0, rgba(71,103,136,.1) 0 20px 40px 0; }
.card-image-wrap{ position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--n2); }
.card-image-wrap img{ width:100%; height:100%; object-fit:cover; filter:saturate(.92); }
.card-image-wrap::after{ content:''; position:absolute; inset:0; background:linear-gradient(160deg, color-mix(in srgb, var(--m600) 12%, transparent) 0%, transparent 55%); }
.card-favorite{ position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; color:var(--n7); z-index:2; }
.card-favorite.active{ color:var(--m600); }
.card-avail-badge{ position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:9999px; background:rgba(255,255,255,.94); font-size:11px; font-weight:700; z-index:2; }
.avail-dot{ width:6px; height:6px; border-radius:50%; }
.card-body{ padding:16px; }
.card-row-1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-title{ font-size:16px; font-weight:700; color:var(--n9); line-height:1.35; }
.card-rating{ display:flex; align-items:center; gap:3px; font-size:13px; font-weight:600; color:var(--n8); flex-shrink:0; }
.card-rating i{ color:var(--m600); width:13px; height:13px; }
.card-meta{ display:block; font-size:12.5px; color:var(--n7); margin-top:6px; }
.card-row-4{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
.card-price{ font-size:17px; font-weight:800; color:var(--n9); }
.price-unit{ font-size:12px; color:var(--n7); margin-left:2px; }
.btn-detail{ font-size:12.5px; font-weight:700; color:var(--m700); padding:6px 12px; border-radius:9999px; background:var(--m50); }

/* ── 퀵뷰 드로어 ── */
.drawer-overlay{ position:fixed; inset:0; background:rgba(20,24,30,.42); z-index:80; display:flex; justify-content:flex-end; animation:fadeIn .2s ease; }
.drawer{ width:min(440px,92vw); height:100%; background:var(--n1); overflow-y:auto; animation:slideInRight .3s cubic-bezier(.2,.8,.2,1); box-shadow:-8px 0 32px rgba(20,24,30,.14); }
.drawer-close{ position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; z-index:5; }
.drawer-img{ width:100%; aspect-ratio:1/1; object-fit:cover; }
.drawer-body{ padding:24px; }
.drawer-cat{ font-size:12px; font-weight:700; color:var(--m700); background:var(--m50); display:inline-block; padding:4px 10px; border-radius:9999px; }
.drawer-title{ font-size:22px; font-weight:800; margin-top:10px; color:var(--n9); }
.drawer-desc{ font-size:13.5px; color:var(--n7); margin-top:8px; line-height:1.6; }
.drawer-section{ margin-top:22px; }
.drawer-label{ font-size:13px; font-weight:700; color:var(--n8); margin-bottom:10px; display:block; }
.option-row{ display:flex; gap:8px; flex-wrap:wrap; }
.option-chip{ padding:8px 14px; border-radius:9999px; border:1px solid var(--n4); font-size:13px; font-weight:600; color:var(--n8); }
.option-chip.selected{ background:var(--m600); border-color:var(--m600); color:#fff; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:8px; }
.cal-cell{ aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; background:var(--n2); color:var(--n8); }
.cal-cell.booked{ background:var(--s2-bg); color:var(--s2-text); cursor:not-allowed; opacity:.7; }
.cal-cell.selected{ background:var(--m600); color:#fff; border:2px solid var(--m700); }
.drawer-price-box{ background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:16px; margin-top:22px; }
.drawer-price-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--n7); margin-bottom:6px; }
.drawer-price-total{ display:flex; justify-content:space-between; font-size:18px; font-weight:800; color:var(--n9); padding-top:10px; border-top:1px solid var(--n3); margin-top:6px; }
.btn-primary{ width:100%; padding:15px; border-radius:8px; background:var(--m600); color:#fff; font-size:16px; font-weight:700; margin-top:18px; transition:background .15s; }
.btn-primary:hover{ background:var(--m700); }
.btn-primary:disabled{ background:var(--n4); color:var(--n6); cursor:not-allowed; }
.btn-secondary{ width:100%; padding:13px; border-radius:8px; background:var(--n1); border:1px solid var(--n4); color:var(--n8); font-size:14px; font-weight:700; margin-top:10px; }

/* ── 폼 공용 ── */
.panel{ background:var(--n1); border-radius:20px; padding:28px; box-shadow:rgba(71,103,136,.04) 0 4px 5px 0, rgba(71,103,136,.05) 0 20px 40px 0; margin-top:20px; }
.panel-title{ font-size:19px; font-weight:800; color:var(--n9); display:flex; align-items:center; gap:8px; }
.panel-title i{ color:var(--m600); }
.field-label{ font-size:13px; font-weight:700; color:var(--n8); margin-bottom:6px; display:block; }
.field-input{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--n4); font-size:14px; color:var(--n9); background:var(--n1); }
.field-input:focus{ outline:2px solid var(--m300); border-color:var(--m600); }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.wearer-card{ display:flex; gap:12px; align-items:flex-end; padding:14px; border:1px solid var(--n3); border-radius:12px; margin-top:12px; background:var(--n0); }
.wearer-card .field-input{ background:var(--n1); }
.btn-remove{ width:38px; height:38px; border-radius:8px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.btn-add-wearer{ display:flex; align-items:center; gap:6px; margin-top:14px; padding:10px 16px; border-radius:8px; border:1.5px dashed var(--n4); font-size:13.5px; font-weight:700; color:var(--m700); width:100%; justify-content:center; }
.error-banner{ display:flex; gap:8px; align-items:flex-start; background:var(--s2-bg); color:var(--s2-text); padding:12px 14px; border-radius:10px; font-size:13px; font-weight:600; margin-top:14px; }
.slot-row{ display:flex; gap:10px; margin-top:8px; }
.slot-chip{ flex:1; padding:12px; text-align:center; border-radius:10px; border:1.5px solid var(--n4); font-size:13.5px; font-weight:700; color:var(--n8); }
.slot-chip.selected{ border-color:var(--m600); background:var(--m50); color:var(--m700); }
.checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--n7); }

/* ── 결제 화면 ── */
.method-tabs{ display:flex; gap:8px; margin-top:12px; }
.method-tab{ flex:1; padding:14px 8px; border-radius:12px; border:1.5px solid var(--n4); text-align:center; font-size:13.5px; font-weight:700; color:var(--n8); }
.method-tab.active{ border-color:var(--m600); background:var(--m50); color:var(--m700); }
.info-banner{ display:flex; gap:10px; align-items:flex-start; background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:14px; margin-top:16px; font-size:13px; color:var(--n8); line-height:1.6; }
.info-banner i{ color:var(--m600); flex-shrink:0; margin-top:2px; }
.hold-box{ display:flex; align-items:center; justify-content:space-between; background:var(--s3-bg); border-radius:12px; padding:14px 16px; margin-top:16px; }
.hold-left{ display:flex; align-items:center; gap:10px; }
.hold-dot{ width:9px; height:9px; border-radius:50%; background:var(--s3); animation:softPulse 1.4s ease infinite; }
.hold-text{ font-size:13px; font-weight:700; color:var(--s3-text); }
.hold-time{ font-size:17px; font-weight:800; color:var(--s3-text); font-variant-numeric:tabular-nums; }

/* ── 마이페이지 ── */
.mypage-tabs{ display:flex; gap:6px; }
.mypage-tab{ padding:10px 18px; border-radius:9999px; font-size:13.5px; font-weight:700; color:var(--n7); }
.mypage-tab.active{ background:var(--m600); color:#fff; }
.res-card{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border:1px solid var(--n3); border-radius:14px; margin-top:12px; background:var(--n1); transition:border-color .15s; }
.res-card:hover{ border-color:var(--m300); }
.res-main strong{ font-size:15px; color:var(--n9); }
.res-main div{ font-size:12.5px; color:var(--n7); margin-top:4px; }
.status-pill{ padding:5px 12px; border-radius:9999px; font-size:12px; font-weight:700; background:var(--n2); color:var(--n7); }
.status-pill.success{ background:var(--s1-bg); color:var(--s1-text); }
.status-pill.danger{ background:var(--s2-bg); color:var(--s2-text); }
.status-pill.warn{ background:var(--s3-bg); color:var(--s3-text); }
.res-actions{ display:flex; gap:8px; }
.btn-chip{ padding:8px 14px; border-radius:9999px; border:1px solid var(--n4); font-size:12.5px; font-weight:700; color:var(--n8); }
.btn-chip:hover{ background:var(--n2); }
.coupon-card{ display:flex; justify-content:space-between; align-items:center; padding:16px; border:1.5px dashed var(--n4); border-radius:14px; margin-top:12px; }
.coupon-card strong{ font-size:14px; color:var(--n9); }
.coupon-card div{ font-size:12px; color:var(--n7); margin-top:4px; }

/* ── 모달 ── */
.modal-overlay{ position:fixed; inset:0; background:rgba(20,24,30,.45); z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s ease; }
.modal-box{ width:min(440px,100%); background:var(--n1); border-radius:20px; padding:26px; animation:cardStagger .25s ease; }
.modal-title{ font-size:17px; font-weight:800; color:var(--n9); }
.modal-desc{ font-size:13px; color:var(--n7); margin-top:6px; line-height:1.6; }
.modal-actions{ display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn-secondary, .modal-actions .btn-primary{ margin-top:0; }

/* ── 토스트 ── */
.toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--n9); color:#fff; padding:14px 22px; border-radius:9999px; font-size:13.5px; font-weight:600; z-index:100; display:flex; align-items:center; gap:8px; animation:fadeIn .25s ease; box-shadow:0 12px 30px rgba(0,0,0,.2); }
.toast i{ color:var(--m300); }

/* ── 빈 상태 ── */
.empty-state{ text-align:center; padding:60px 20px; color:var(--n7); }
.empty-state i{ color:var(--n5); margin-bottom:12px; }

/* ── footer ── */
.footer{ width:100%; background:var(--n1); border-top:1px solid var(--n3); padding:36px 32px; margin-top:auto; }
.footer-cols{ max-width:1280px; margin:0 auto; display:flex; gap:64px; flex-wrap:wrap; }
.footer-col h4{ font-size:12px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px; }
.footer-col a{ display:block; font-size:13px; color:var(--n8); margin-bottom:6px; }
.footer-note{ max-width:1280px; margin:20px auto 0; font-size:12px; color:var(--n6); }

@media (max-width:720px){
  .header-row{ flex-wrap:wrap; }
  .search-bar{ order:3; width:100%; max-width:none; }
  .field-row{ grid-template-columns:1fr; }
}
</style>
</head>

function nextDays(n){
  const arr=[]; const base=new Date(2026,9,17);
  for(let i=0;i<n;i++){ const d=new Date(base); d.setDate(base.getDate()+i); arr.push(d); }
  return arr;
}
const BOOKED_OFFSETS = [2,3,9,10,11];

function Toast({ text, onClose }){
  useEffect(()=>{ const t=setTimeout(onClose, 2600); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><Icon name="check-circle-2" size={16}/>{text}</div>;
}

function ReservationView({ draft, onSubmit, onGoMain }){
  const [wearers, setWearers] = useState([{ name:'김하늘', size: draft?.size || 'M' }]);
  const [slot, setSlot] = useState('오후 12~18시');
  const [dropAddr, setDropAddr] = useState('서울 강남구 논현로 12길 8');
  const [pickAddr, setPickAddr] = useState('');
  const [sameAddr, setSameAddr] = useState(true);
  const [error, setError] = useState('');
  useEffect(()=>{ lucide.createIcons(); },[wearers, slot, error]);
  useEffect(()=>{ if(sameAddr) setPickAddr(dropAddr); },[sameAddr, dropAddr]);

  const addWearer = () => {
    if(wearers.length>=4) return;
    setWearers(w=>[...w, { name:'', size: draft?.size || 'M' }]);
  };
  const removeWearer = (i) => setWearers(w=>w.filter((_,idx)=>idx!==i));
  const updateWearer = (i, field, val) => setWearers(w=>w.map((x,idx)=> idx===i? {...x,[field]:val} : x));

  const hasDuplicate = () => {
    const names = wearers.map(w=>w.name.trim()).filter(Boolean);
    return new Set(names).size !== names.length;
  };

  const handleSubmit = () => {
    if(!draft){ setError('먼저 대여할 상품을 선택해주세요.'); return; }
    if(wearers.some(w=>!w.name.trim())){ setError('모든 착용자의 이름을 입력해주세요.'); return; }
    if(hasDuplicate()){ setError('동일한 착용자에게 같은 기간 2벌 이상을 담을 수 없습니다. 착용자 이름을 확인해주세요.'); return; }
    if(!dropAddr){ setError('배송지를 입력해주세요.'); return; }
    setError('');
    onSubmit({ wearers, slot, dropAddr, pickAddr });
  };

  if(!draft){
    return (
      <div className="panel">
        <div className="panel-title"><Icon name="package-search" size={18}/>선택된 상품이 없습니다</div>
        <p style={{fontSize:13, color:'var(--n7)', marginTop:10}}>상품 탐색 화면에서 대여할 상품을 먼저 선택해주세요.</p>
        <button className="btn-primary" onClick={onGoMain}>상품 둘러보기</button>
      </div>
    );
  }

  return (
    <div className="panel">
      <div className="panel-title"><Icon name="clipboard-list" size={18}/>예약 작성</div>
      <div style={{display:'flex', gap:12, alignItems:'center', marginTop:14, padding:14, background:'var(--n0)', borderRadius:12}}>
        <img src={`https://picsum.photos/seed/${draft.product.seed}/80/80`} style={{width:56,height:56,borderRadius:10,objectFit:'cover'}} alt=""/>
        <div>
          <strong style={{fontSize:14}}>{draft.product.name}</strong>
          <div style={{fontSize:12.5, color:'var(--n7)', marginTop:3}}>{draft.size} 사이즈 · {draft.days}일 · {draft.total.toLocaleString()}원</div>
        </div>
      </div>

      <div style={{marginTop:22}}>
        <span className="field-label">착용자 정보</span>
        {wearers.map((w,i)=>(
          <div className="wearer-card" key={i}>
            <div style={{flex:1}}>
              <span className="field-label">착용자 {i+1} 이름</span>
              <input className="field-input" placeholder="이름 입력" value={w.name} onChange={e=>updateWearer(i,'name',e.target.value)}/>
            </div>
            <div style={{width:100}}>
              <span className="field-label">사이즈</span>
              <select className="field-input" value={w.size} onChange={e=>updateWearer(i,'size',e.target.value)}>
                {draft.product.size.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            {wearers.length>1 && <button className="btn-remove" onClick={()=>removeWearer(i)}><Icon name="trash-2" size={15}/></button>}
          </div>
        ))}
        <button className="btn-add-wearer" onClick={addWearer}><Icon name="user-plus" size={15}/>착용자 추가</button>
      </div>

      <div style={{marginTop:22}}>
        <span className="field-label">배송 슬롯</span>
        <div className="slot-row">
          {['오전 9~12시','오후 12~18시','저녁 18~21시'].map(s=>(
            <button key={s} className={"slot-chip"+(slot===s?' selected':'')} onClick={()=>setSlot(s)}>{s}</button>
          ))}
        </div>
      </div>

      <div className="field-row">
        <div>
          <span className="field-label">배송지</span>
          <input className="field-input" placeholder="도로명 주소 입력" value={dropAddr} onChange={e=>setDropAddr(e.target.value)}/>
        </div>
        <div>
          <span className="field-label">회수지</span>
          <input className="field-input" placeholder="도로명 주소 입력" value={pickAddr} disabled={sameAddr} onChange={e=>setPickAddr(e.target.value)}/>
        </div>
      </div>
      <label className="checkbox-row">
        <input type="checkbox" checked={sameAddr} onChange={e=>setSameAddr(e.target.checked)}/>
        회수지가 배송지와 동일합니다
      </label>

      {error && <div className="error-banner"><Icon name="alert-triangle" size={15}/>{error}</div>}

      <button className="btn-primary" onClick={handleSubmit}>다음: 결제하기</button>
    </div>
  );
}

  };
  const mm = String(Math.floor(seconds/60)).padStart(2,'0');

  if(!draft || !order){
    return (

        <div className="method-tabs">
          {METHODS.map(m=>(
            <button key={m} className={"method-tab"+(method===m?' active':'')} onClick={()=>setMethod(m)}>{m}</button>
          ))}
        </div>
      </div>

      <div className="info-banner"><Icon name="info" size={15}/><span>{infoByMethod[method]}</span></div>

      <div className="hold-box">
        <div className="hold-left">
          <span className="hold-dot"></span>
          <span className="hold-text">결제 진행 중 재고가 임시로 확보되었습니다</span>

      <button className="btn-primary" disabled={seconds===0} onClick={()=>onComplete(method)}>
        {seconds===0? '재고가 반환되었습니다' : '결제 완료'}
      </button>
    </div>
  );
}

    setToast('결제가 완료되어 예약 내역에 반영되었습니다.');
    setView('mypage');
  };
  const handleChangeAddress = (id, addr) => {
    setReservations(rs => rs.map(r => r.id===id ? { ...r, dropAddr: addr } : r));
    setToast('수거지 변경 이력이 기록되었습니다.');
  };
  const handleReorder = (r) => {
    setDraft({ product:r.product, size:r.size, days:r.days, total:r.total });
    setView('reservation');
    setToast('이전 예약 정보를 불러왔습니다.');
  };

  return (
    <React.Fragment>
      <header className="search-header" data-search-header>
        <div className="header-row">
          <div className="brand"><Icon name="shirt" size={20}/>데일리핏 렌탈</div>
          <div className="search-bar">
            <button className="search-segment" onClick={()=>setSearchSeg(s=>({ ...s, region: REGION_OPTS[(REGION_OPTS.indexOf(s.region)+1)%REGION_OPTS.length] }))}>
              <div className="segment-label">배송 가능 지역</div>
              <div className="segment-value">{searchSeg.region}</div>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>setSearchSeg(s=>({ ...s, style: STYLE_OPTS[(STYLE_OPTS.indexOf(s.style)+1)%STYLE_OPTS.length] }))}>
              <div className="segment-label">스타일</div>
              <div className="segment-value">{searchSeg.style}</div>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>setSearchSeg(s=>({ ...s, days: DAYS_OPTS[(DAYS_OPTS.indexOf(s.days)+1)%DAYS_OPTS.length] }))}>
              <div className="segment-label">렌탈 기간</div>
              <div className="segment-value">{searchSeg.days}</div>
            </button>
            <button className="search-submit" onClick={()=>{ setView('main'); setToast(searchSeg.region+' · '+searchSeg.style+' 검색 결과가 갱신되었습니다.'); }}><Icon name="search" size={16}/></button>
          </div>
          <nav className="header-nav">
            <button className={"nav-tab"+(view==='main'?' active':'')} onClick={()=>setView('main')}>홈</button>
            <button className={"nav-tab"+(view==='reservation'?' active':'')} onClick={()=>setView('reservation')}>예약 작성</button>
            <button className={"nav-tab"+(view==='payment'?' active':'')} onClick={()=>setView('payment')}>결제</button>
            <button className={"nav-tab"+(view==='mypage'?' active':'')} onClick={()=>setView('mypage')}>예약 관리</button>
            <button className="user-menu" onClick={()=>setToast('로그인 계정: 김민수')}><Icon name="user" size={16}/></button>
          </nav>
        </div>
        {view==='main' && (
          <div className="filter-chips">
            {MainView.CATEGORIES.map(c=>(
              <button key={c} className={"chip"+(activeCat===c?' active':'')} onClick={()=>setActiveCat(c)}>{c}</button>
            ))}
            <button className="chip filter-toggle" onClick={()=>setToast('상세 필터가 열렸습니다.')}><Icon name="sliders-horizontal" size={13}/>필터</button>
          </div>
        )}
      </header>

      <div className="view-wrap" key={view}>
        {view==='main' && <MainView onOpenDetail={openDetail} activeCat={activeCat} />}
        {view==='reservation' && <ReservationView draft={draft} onSubmit={handleReservationSubmit} onGoMain={()=>setView('main')} />}
        {view==='payment' && <PaymentView draft={draft} order={order} onComplete={handlePaymentComplete} />}
        {view==='mypage' && <MypageView reservations={reservations} coupons={coupons} onChangeAddress={handleChangeAddress} onReorder={handleReorder} />}
      </div>

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <h4>서비스</h4>
            <a>당일 렌탈 안내</a>
            <a>배송 가능 지역</a>
            <a>이용 약관</a>
          </div>
          <div className="footer-col">
            <h4>고객 지원</h4>
            <a>자주 묻는 질문</a>
            <a>1:1 문의</a>
          </div>
          <div className="footer-col">
            <h4>회사</h4>
            <a>회사 소개</a>
            <a>제휴 문의</a>
          </div>
        </div>
        <div className="footer-note">© 2026 데일리핏 렌탈 — 자체 개발 프로젝트 데모</div>
      </footer>

      {quickViewProduct && <QuickView product={quickViewProduct} onClose={()=>setQuickViewProduct(null)} onReserve={handleReserve} />}
      {toast && <Toast text={toast} onClose={()=>setToast(null)} />}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
setTimeout(()=>{ if(window.lucide) lucide.createIcons(); }, 50);
</script>
</body>
</html>
