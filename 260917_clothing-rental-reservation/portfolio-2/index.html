<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 305°, light) ── */
:root{
  --m50:#ffeffe; --m100:#ffe6fd; --m200:#ffdbfc; --m300:#ffd1fb; --m400:#ffc7fa;
  --m500:#d1a3cd; --m600:#a37fa0; --m700:#735a71; --m800:#735a71; --m900:#735a71;
  --n0:#f2f0eb; --n1:#ffffff; --n2:#f0eff0; --n3:#e6e5e6; --n4:#d7d5d7;
  --n5:#bab5ba; --n6:#989097; --n7:#666666; --n8:#5a535a; --n9:#3a363a; --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; font-family:'Pretendard', -apple-system, sans-serif; background:var(--n0); color:var(--n9); }
#root { width:100%; min-height:100vh; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select, textarea { font-family:inherit; }

@keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
@keyframes listStagger { from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
@keyframes cmdkPop { from{opacity:0; transform:translateY(-8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:.3;} }
@keyframes barGrow { from{transform:scaleY(0);} to{transform:scaleY(1);} }

.app-shell{ display:flex; width:100%; min-height:100vh; }

/* ── 사이드바 (linear-sidebar-cmdk 시그니처) ── */
.sidebar{ position:fixed; left:0; top:0; bottom:0; width:260px; background:var(--n1); border-right:1px solid var(--n3); display:flex; flex-direction:column; z-index:30; }
.sidebar-brand{ height:56px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--n3); flex-shrink:0; }
.sidebar-brand strong{ font-size:14px; font-weight:700; color:var(--n9); }
.brand-badge{ width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg, var(--m500), var(--m700)); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand-badge i{ color:#fff; font-size:15px; }
.sidebar-cmdk-hint{ margin:12px 16px; padding:9px 12px; background:var(--n0); border:1px solid var(--n3); border-radius:6px; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--n7); }
.kbd{ font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; background:var(--n2); border:1px solid var(--n4); color:var(--n8); }
.sidebar-nav{ padding:4px 10px; display:flex; flex-direction:column; gap:2px; }
.sidebar-link{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; font-size:13.5px; font-weight:600; color:var(--n7); position:relative; }
.sidebar-link i{ font-size:16px; }
.sidebar-link:hover{ background:var(--n2); }
.sidebar-link.active{ background:var(--m50); color:var(--m700); }
.sidebar-link.active::before{ content:''; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:3px; background:var(--m600); }
.sidebar-section{ margin-top:16px; padding:0 20px; }
.sidebar-section-title{ font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px; }
.sidebar-user{ margin-top:auto; padding:14px 16px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:10px; }
.avatar-dot{ width:28px; height:28px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.sidebar-user div strong{ display:block; font-size:12.5px; color:var(--n9); }
.sidebar-user div span{ font-size:11px; color:var(--n7); }

/* ── 메인 ── */
.main-wrap{ margin-left:260px; flex:1; min-width:0; width:calc(100% - 260px); display:flex; flex-direction:column; min-height:100vh; }
.topbar{ height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--n3); background:var(--n1); flex-shrink:0; }
.breadcrumb{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n7); }
.breadcrumb .divider{ color:var(--n5); }
.breadcrumb .current{ color:var(--n9); font-weight:700; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.btn-cmdk{ display:flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--n4); border-radius:6px; font-size:12.5px; font-weight:600; color:var(--n7); }
.btn-primary{ padding:9px 16px; border-radius:8px; background:var(--m600); color:#fff; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
.btn-primary:hover{ background:var(--m700); }
.btn-primary:disabled{ background:var(--n4); color:var(--n6); cursor:not-allowed; }
.btn-secondary{ padding:9px 16px; border-radius:8px; border:1px solid var(--n4); background:var(--n1); color:var(--n8); font-size:13.5px; font-weight:700; }
.content{ padding:24px; flex:1; animation:fadeIn .25s ease; }

/* ── master-detail ── */
.md-split{ display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
.list-rail{ background:var(--n1); border:1px solid var(--n3); border-radius:8px; overflow:hidden; }
.list-rail-head{ padding:14px 16px; border-bottom:1px solid var(--n3); display:flex; gap:8px; }
.list-search{ flex:1; padding:8px 10px; border:1px solid var(--n4); border-radius:6px; font-size:12.5px; }
.list-item{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--n3); font-size:13px; animation:listStagger .3s ease both; }
.list-item:last-child{ border-bottom:none; }
.list-item:hover{ background:var(--n0); }
.list-item.selected{ background:var(--m50); }
.list-item-main strong{ display:block; font-size:13.5px; color:var(--n9); }
.list-item-main span{ font-size:11.5px; color:var(--n7); }
.badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:9999px; background:var(--n2); color:var(--n7); white-space:nowrap; }
.badge.success{ background:var(--s1-bg); color:var(--s1-text); }
.badge.danger{ background:var(--s2-bg); color:var(--s2-text); }
.badge.warn{ background:var(--s3-bg); color:var(--s3-text); }

.detail-panel{ background:var(--n1); border:1px solid var(--n3); border-radius:8px; padding:22px; min-height:420px; }
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; }
.detail-title{ font-size:20px; font-weight:800; color:var(--n9); }
.detail-sub{ font-size:12.5px; color:var(--n7); margin-top:4px; }
.detail-actions{ display:flex; gap:8px; }
.detail-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:20px; }
.detail-stat{ background:var(--n0); border:1px solid var(--n3); border-radius:6px; padding:12px 14px; }
.detail-stat span{ display:block; font-size:11px; color:var(--n7); margin-bottom:4px; }
.detail-stat strong{ font-size:16px; color:var(--n9); }
.timeline{ margin-top:22px; }
.timeline-item{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--n2); font-size:13px; }
.timeline-dot{ width:8px; height:8px; border-radius:50%; background:var(--n5); margin-top:5px; flex-shrink:0; }
.timeline-item.done .timeline-dot{ background:var(--s1); }
.timeline-item div strong{ display:block; color:var(--n9); font-size:13px; }
.timeline-item div span{ color:var(--n7); font-size:11.5px; }
.linked-box{ margin-top:20px; background:var(--s2-bg); border-radius:8px; padding:14px 16px; }
.linked-box strong{ color:var(--s2-text); font-size:13px; display:flex; align-items:center; gap:6px; }
.linked-item{ font-size:12.5px; color:var(--s2-text); margin-top:8px; padding-left:22px; }
.replace-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
.replace-card{ display:flex; justify-content:space-between; align-items:center; background:var(--n1); border:1px solid var(--n3); border-radius:6px; padding:10px 12px; font-size:12.5px; }

/* ── 폼/모달 ── */
.field-label{ font-size:12.5px; font-weight:700; color:var(--n8); margin-bottom:6px; display:block; }
.field-input{ width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--n4); font-size:13.5px; background:var(--n1); color:var(--n9); }
.modal-overlay{ position:fixed; inset:0; background:rgba(41,40,39,.4); z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s ease; }
.modal-box{ width:min(460px,100%); background:var(--n1); border-radius:8px; border:1px solid var(--n3); padding:22px; animation:cmdkPop .2s ease; }
.modal-title{ font-size:15.5px; font-weight:800; color:var(--n9); }
.modal-desc{ font-size:12.5px; color:var(--n7); margin-top:6px; line-height:1.6; }
.modal-actions{ display:flex; gap:8px; margin-top:18px; justify-content:flex-end; }

/* ── cmd-k ── */
.cmdk-overlay{ position:fixed; inset:0; background:rgba(41,40,39,.35); z-index:100; display:flex; justify-content:center; padding-top:14vh; }
.cmdk-modal{ width:min(520px,92vw); background:var(--n1); border-radius:8px; border:1px solid var(--n3); box-shadow:0 24px 60px rgba(41,40,39,.25); height:fit-content; animation:cmdkPop .18s ease; }
.cmdk-input{ width:100%; padding:16px 18px; border:none; border-bottom:1px solid var(--n3); font-size:14px; }
.cmdk-input:focus{ outline:none; }
.cmdk-results{ padding:8px; max-height:320px; overflow-y:auto; }
.cmdk-group-title{ font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase; padding:8px 10px 4px; }
.cmdk-item{ display:flex; justify-content:space-between; align-items:center; padding:10px; border-radius:6px; font-size:13px; color:var(--n8); }
.cmdk-item:hover{ background:var(--n0); }

/* ── 화면 헤더 공통 ── */
.screen-title{ font-size:32px; font-weight:800; color:var(--n9); letter-spacing:-.3px; }
.screen-sub{ font-size:13px; color:var(--n7); margin-top:6px; }

/* ── 주문 관리 ── */
.order-row{ display:grid; grid-template-columns:1.4fr .8fr .8fr .8fr .8fr; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--n3); font-size:13px; animation:listStagger .3s ease both; }
.order-row:hover{ background:var(--n0); }
.order-head{ display:grid; grid-template-columns:1.4fr .8fr .8fr .8fr .8fr; gap:10px; padding:12px 16px; font-size:11.5px; font-weight:700; color:var(--n7); text-transform:uppercase; border-bottom:1px solid var(--n3); background:var(--n0); }
.tag-source{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--n2); color:var(--n7); }
.card-panel{ background:var(--n1); border:1px solid var(--n3); border-radius:8px; }

/* ── 반납 검수 ── */
.inspect-status-row{ display:flex; gap:8px; margin-top:16px; }
.status-btn{ flex:1; padding:12px; border-radius:6px; border:1.5px solid var(--n4); text-align:center; font-size:12.5px; font-weight:700; color:var(--n8); }
.status-btn.on-normal.selected{ border-color:var(--s1); background:var(--s1-bg); color:var(--s1-text); }
.status-btn.on-laundry.selected{ border-color:var(--m600); background:var(--m50); color:var(--m700); }
.status-btn.on-damage.selected, .status-btn.on-lost.selected{ border-color:var(--s2); background:var(--s2-bg); color:var(--s2-text); }

/* ── 정산 관리 ── */
.stat-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.stat-card{ background:var(--n1); border:1px solid var(--n3); border-radius:8px; padding:16px; }
.stat-card span{ font-size:11.5px; color:var(--n7); }
.stat-card strong{ display:block; font-size:20px; color:var(--n9); margin-top:6px; }
.chart-wrap{ position:relative; height:240px; margin-top:16px; background:var(--n1); border:1px solid var(--n3); border-radius:8px; padding:16px; }
.coupon-row{ display:flex; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--n3); font-size:13px; }

/* ── 직원 관리 ── */
.staff-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--n3); }
.toggle-row{ display:flex; gap:8px; margin-top:10px; }
.toggle-btn{ padding:10px 16px; border-radius:6px; border:1.5px solid var(--n4); font-size:12.5px; font-weight:700; color:var(--n8); }
.toggle-btn.selected{ border-color:var(--m600); background:var(--m50); color:var(--m700); }
.log-item{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--n2); font-size:12.5px; color:var(--n7); }

.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--n10); color:#fff; padding:12px 20px; border-radius:8px; font-size:13px; font-weight:600; z-index:110; display:flex; align-items:center; gap:8px; animation:fadeIn .2s ease; }
.toast i{ color:var(--m300); }

@media (max-width:900px){
  .md-split{ grid-template-columns:1fr; }
  .detail-grid{ grid-template-columns:repeat(2,1fr); }
  .stat-cards{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

function Toast({ text, onClose }){
  useEffect(()=>{ const t=setTimeout(onClose,2600); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><PI name="check-circle"/>{text}</div>;
}

function CmdkOverlay({ onClose }){

  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk-modal" onClick={e=>e.stopPropagation()}>

  const [query, setQuery] = useState('');
  const filtered = ASSETS.filter(a => (a.code+a.name).toLowerCase().includes(query.toLowerCase()));

  const statusBadge = (s) => s==='정상' ? 'success' : (s==='손상'||s==='분실') ? 'danger' : (s==='세탁중') ? 'warn' : '';

  return (
    <div className="md-split">
      <div className="list-rail">
        <div className="list-rail-head">
          <input className="list-search" placeholder="자산 코드/이름 검색" value={query} onChange={e=>setQuery(e.target.value)}/>
        </div>
        {filtered.map((a,i)=>(
          <div key={a.id} className={"list-item"+(selected.id===a.id?' selected':'')} style={{animationDelay:(i*.03)+'s'}} onClick={()=>setSelected(a)}>
            <div className="list-item-main"><strong>{a.code}</strong><span>{a.name}</span></div>
            <span className={"badge "+statusBadge(a.status)}>{a.status}</span>
          </div>
        ))}
      </div>
      <div className="detail-panel">
        <div className="detail-head">
          <div>
            <div className="detail-title">{selected.code}</div>
            <div className="detail-sub">{selected.name} · 사이즈 {selected.size} · {selected.category}</div>
          </div>
          <div className="detail-actions">
            <button className="btn-secondary" onClick={()=>toast('엑셀로 자산 정보를 내보냈습니다.')}><PI name="download-simple"/> 내보내기</button>
            <button className="btn-primary" onClick={()=>toast('상태 이력이 갱신되었습니다.')}><PI name="pencil-simple"/> 상태 갱신</button>
          </div>
        </div>
        <div className="detail-grid">
          <div className="detail-stat"><span>현재 상태</span><strong>{selected.status}</strong></div>
          <div className="detail-stat"><span>누적 대여 횟수</span><strong>18회</strong></div>
          <div className="detail-stat"><span>최근 반납일</span><strong>{selected.history[0]?.date}</strong></div>
        </div>
        <div className="timeline">
          {selected.history.map((h,i)=>(
            <div key={i} className={"timeline-item"+(h.done?' done':'')}>
              <span className="timeline-dot"></span>
              <div><strong>{h.event}</strong><span>{h.date}</span></div>
            </div>
          ))}
        </div>
        {selected.linked.length>0 && (
          <div className="linked-box">
            <strong><PI name="warning-circle"/> 이 자산이 걸린 향후 예약</strong>
            {selected.linked.map((l,i)=><div className="linked-item" key={i}>{l}</div>)}
            <div className="replace-list">
              {REPLACEMENTS.map(r=>(
                <div className="replace-card" key={r.code}>
                  <span>{r.code} · {r.name} · {r.size}</span>
                  <button className="btn-secondary" style={{padding:'6px 10px'}} onClick={()=>toast(r.code+' 대체 상품이 배정되었습니다.')}>대체 배정</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function OrdersScreen({ toast }){
  const [selected, setSelected] = useState(null);
  return (
    <div className="card-panel">
      <div className="order-head">
        <span>주문/고객</span><span>경로</span><span>배송 상태</span><span>라이더</span><span>현장 수금</span>
      </div>
      {ORDERS.map((o,i)=>(
        <div key={o.id} className="order-row" style={{animationDelay:(i*.03)+'s'}} onClick={()=>setSelected(o)}>
          <div><strong style={{display:'block',fontSize:13.5,color:'var(--n9)'}}>{o.id}</strong><span style={{fontSize:11.5,color:'var(--n7)'}}>{o.customer} · {o.product}</span></div>
          <span className="tag-source">{o.source}</span>
          <span className={"badge "+(o.delivery==='배송완료'?'success':o.delivery==='취소'?'danger':'')}>{o.delivery}</span>
          <span style={{fontSize:12.5,color:'var(--n7)'}}>{o.rider}</span>
          <span style={{fontSize:12.5,color:'var(--n7)'}}>{o.cod}</span>
        </div>
      ))}
      {selected && (
        <div className="modal-overlay" onClick={()=>setSelected(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">{selected.id} 상세</div>
            <p className="modal-desc">{selected.customer}님 · {selected.product} · 접수 경로: {selected.source}<br/>라이더: {selected.rider} · 현장 수금: {selected.cod}</p>
            <div className="modal-actions">
              <button className="btn-secondary" onClick={()=>setSelected(null)}>닫기</button>
              <button className="btn-primary" onClick={()=>{ toast('배송 상태가 변경되어 라이더 화면에 반영되었습니다.'); setSelected(null); }}>배송중으로 변경</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function InspectionScreen({ toast }){
  const [selected, setSelected] = useState(INSPECT_QUEUE[0]);
  const [status, setStatus] = useState(null);
  const damaged = status==='손상' || status==='분실';
  useEffect(()=>{ setStatus(null); },[selected]);

  return (
    <div className="md-split">
      <div className="list-rail">
        <div className="list-rail-head"><strong style={{fontSize:13}}>검수 대기 {INSPECT_QUEUE.length}건</strong></div>
        {INSPECT_QUEUE.map((q,i)=>(
          <div key={q.id} className={"list-item"+(selected.id===q.id?' selected':'')} style={{animationDelay:(i*.03)+'s'}} onClick={()=>setSelected(q)}>
            <div className="list-item-main"><strong>{q.code}</strong><span>{q.name}</span></div>
            <span className="badge">{q.returnedAt}</span>
          </div>
        ))}
      </div>
      <div className="detail-panel">
        <div className="detail-title">{selected.code}</div>
        <div className="detail-sub">{selected.name} · 반납일 {selected.returnedAt}</div>
        <span className="field-label" style={{marginTop:20,display:'block'}}>검수 결과</span>
        <div className="inspect-status-row">
          <button className={"status-btn on-normal"+(status==='정상'?' selected':'')} onClick={()=>setStatus('정상')}>정상</button>
          <button className={"status-btn on-laundry"+(status==='세탁 필요'?' selected':'')} onClick={()=>setStatus('세탁 필요')}>세탁 필요</button>
          <button className={"status-btn on-damage"+(status==='손상'?' selected':'')} onClick={()=>setStatus('손상')}>손상</button>
          <button className={"status-btn on-lost"+(status==='분실'?' selected':'')} onClick={()=>setStatus('분실')}>분실</button>
        </div>
        {status==='세탁 필요' && (
          <div className="detail-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
            <div className="detail-stat"><span>배정 업체</span><strong>세탁업체 A</strong></div>
            <div className="detail-stat"><span>예상 완료일</span><strong>2026.09.19</strong></div>
          </div>
        )}
        {damaged && (
          <div className="linked-box">
            <strong><PI name="warning-circle"/> 이 자산이 걸린 향후 예약이 자동 조회되었습니다</strong>
            <div className="linked-item">R-2231 (2026.09.20 예약) · R-2244 (2026.09.22 예약)</div>
            <div className="replace-list">
              {REPLACEMENTS.map(r=>(
                <div className="replace-card" key={r.code}>
                  <span>{r.code} · {r.name} · {r.size}</span>
                  <button className="btn-secondary" style={{padding:'6px 10px'}} onClick={()=>toast(r.code+' 대체 상품 후보로 안내되었습니다.')}>후보 안내</button>
                </div>
              ))}
            </div>
          </div>
        )}
        <button className="btn-primary" style={{marginTop:20}} disabled={!status} onClick={()=>toast(selected.code+' 검수 결과가 저장되었습니다: '+status)}>검수 결과 저장</button>
      </div>
    </div>
  );
}

function SettlementScreen(){
  const canvasRef = useRef(null);
  useEffect(()=>{
    const C = k => getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
    const chart = new Chart(canvasRef.current, {
      type:'bar',
      data:{
        labels:['09.10','09.11','09.12','09.13','09.14','09.15','09.16'],
        datasets:[{ label:'일별 정산 금액(만원)', data:[182,164,201,178,225,240,198], backgroundColor:C('m600'), borderRadius:6, maxBarThickness:28 }]
      },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:C('n2')}, ticks:{color:C('n7')} }, x:{ grid:{display:false}, ticks:{color:C('n7')} } } }
    });
    return ()=>chart.destroy();
  },[]);

  return (
    <React.Fragment>
      <div className="stat-cards">
        <div className="stat-card"><span>카드 결제 정산</span><strong>842만원</strong></div>
        <div className="stat-card"><span>계좌이체 정산</span><strong>316만원</strong></div>
        <div className="stat-card"><span>현장결제(라이더 수금)</span><strong>128만원</strong></div>
        <div className="stat-card"><span>쿠폰 회차권 차감</span><strong>54건</strong></div>
      </div>
      <div className="chart-wrap"><canvas ref={canvasRef}></canvas></div>
      <div className="card-panel" style={{marginTop:16}}>
        <div style={{padding:'14px 16px', borderBottom:'1px solid var(--n3)', fontWeight:700, fontSize:13.5}}>쿠폰 발급 이력</div>
        <div className="coupon-row"><span>3회 렌탈 회차권 · 김민수</span><span className="badge success">발급완료</span></div>
        <div className="coupon-row"><span>첫 예약 5,000원 할인 · 이지은</span><span className="badge">사용대기</span></div>
        <div className="coupon-row"><span>여름 시즌 프로모션 · 정하윤</span><span className="badge success">사용완료</span></div>
      </div>
    </React.Fragment>
  );
}

function StaffScreen({ toast }){
  const [mode, setMode] = useState('공동 처리');
  return (
    <React.Fragment>
      <div className="card-panel">
        <div style={{padding:'14px 16px', borderBottom:'1px solid var(--n3)', fontWeight:700, fontSize:13.5}}>직원 계정</div>
        {STAFF.map(s=>(
          <div className="staff-row" key={s.id}>
            <div><strong style={{fontSize:13.5}}>{s.name}</strong><div style={{fontSize:11.5,color:'var(--n7)'}}>{s.role} · {s.region}</div></div>
            <span className="badge">담당 {s.assigned}건</span>
          </div>
        ))}
      </div>
      <div className="card-panel" style={{marginTop:16, padding:16}}>
        <span className="field-label">업무 배정 방식</span>
        <p style={{fontSize:12.5, color:'var(--n7)'}}>현재 미확정 항목으로, 설계 단계에서 발주처와 함께 방식을 정합니다. 데모는 두 방식을 토글로 비교할 수 있게 구현합니다.</p>
        <div className="toggle-row">
          <button className={"toggle-btn"+(mode==='공동 처리'?' selected':'')} onClick={()=>{ setMode('공동 처리'); toast('공동 처리 방식으로 전환되었습니다.'); }}>공동 처리</button>
          <button className={"toggle-btn"+(mode==='담당자 배정'?' selected':'')} onClick={()=>{ setMode('담당자 배정'); toast('주문 단위 담당자 배정 방식으로 전환되었습니다.'); }}>주문 단위 담당자 배정</button>
        </div>
        <div style={{marginTop:18}}>
          <span className="field-label">배정 이력</span>
          {ASSIGN_LOG.map((l,i)=><div className="log-item" key={i}><PI name="clock-counter-clockwise"/>{l}</div>)}
        </div>
      </div>
    </React.Fragment>
  );
}

const SCREENS = [
  { key:'main', label:'자산 관리', icon:'stack' },
  { key:'orders', label:'주문 관리', icon:'clipboard-text' },
  { key:'inspection', label:'반납 검수', icon:'magnifying-glass' },
  { key:'settlement', label:'정산 관리', icon:'chart-bar' },
  { key:'staff', label:'직원 관리', icon:'users-three' },
];

function App(){
  const [screen, setScreen] = useState('main');
  const [cmdk, setCmdk] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (m) => setToastMsg(m);

  useEffect(()=>{
    const onKey = (e) => { if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setCmdk(true); } };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[]);

  const active = SCREENS.find(s=>s.key===screen);

  return (
    <div className="app-shell">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand"><span className="brand-badge"><PI name="hanger"/></span><strong>렌탈 운영 콘솔</strong></div>
        <button className="sidebar-cmdk-hint" onClick={()=>setCmdk(true)}>
          <span>빠른 검색</span><span className="kbd">⌘ K</span>
        </button>
        <nav className="sidebar-nav">
          {SCREENS.map(s=>(
            <a key={s.key} className={"sidebar-link"+(screen===s.key?' active':'')} onClick={()=>setScreen(s.key)}>
              <PI name={s.icon}/>{s.label}
            </a>
          ))}
        </nav>
        <div className="sidebar-section">
          <div className="sidebar-section-title">운영</div>
          <a className="sidebar-link" onClick={()=>toast('운영 설정 화면입니다.')}><PI name="gear-six"/>운영 설정</a>
        </div>
        <div className="sidebar-user">
          <span className="avatar-dot">관</span>
          <div><strong>운영 관리자</strong><span>admin@rental-ops.demo</span></div>
        </div>
      </aside>

      <main className="main-wrap">
        <header className="topbar">
          <nav className="breadcrumb">
            <span>운영 콘솔</span><span className="divider">/</span><span className="current">{active.label}</span>
          </nav>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={()=>setCmdk(true)}><PI name="magnifying-glass"/>⌘ K</button>
            <button className="btn-primary" onClick={()=>toast('신규 항목이 등록되었습니다.')}><PI name="plus"/>신규 등록</button>
          </div>
        </header>
        <div className="content" key={screen}>
          {screen==='main' && (<><h1 className="screen-title">의류 자산 관리</h1><p className="screen-sub">LOOK과 개별 자산의 상태 이력을 관리하고 재고 캘린더를 확인합니다.</p><div style={{marginTop:20}}><AssetScreen toast={toast}/></div></>)}
          {screen==='orders' && (<><h1 className="screen-title">주문 관리</h1><p className="screen-sub">홈페이지·메신저 대리입력 주문을 하나의 대장에서 관리합니다.</p><div style={{marginTop:20}}><OrdersScreen toast={toast}/></div></>)}
          {screen==='inspection' && (<><h1 className="screen-title">반납 검수</h1><p className="screen-sub">반납 상품을 검수하고 세탁·손상·분실 상태를 분류합니다.</p><div style={{marginTop:20}}><InspectionScreen toast={toast}/></div></>)}
          {screen==='settlement' && (<><h1 className="screen-title">정산 관리</h1><p className="screen-sub">결제 수단·라이더 수금을 포함한 정산과 쿠폰 발급을 관리합니다.</p><div style={{marginTop:20}}><SettlementScreen/></div></>)}
          {screen==='staff' && (<><h1 className="screen-title">직원 관리</h1><p className="screen-sub">직원 계정과 업무 배정 방식, 처리 이력을 관리합니다.</p><div style={{marginTop:20}}><StaffScreen toast={toast}/></div></>)}
        </div>
      </main>

      {cmdk && <CmdkOverlay onClose={()=>setCmdk(false)} />}
      {toastMsg && <Toast text={toastMsg} onClose={()=>setToastMsg(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
