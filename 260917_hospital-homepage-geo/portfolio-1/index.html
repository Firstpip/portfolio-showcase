<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리본의원 — 공식 홈페이지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 210°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbebfb; --m200:#b8d7f7; --m300:#8cbff2; --m400:#5ca4ed;
  --m500:#2e8be8; --m600:#0071e3; --m700:#005dba; --m800:#004891; --m900:#003366;
  --n0:#ffffff; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909498; --n7:#707070; --n8:#53575a; --n9:#36383a; --n10:#1d1d1f;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;}
a{text-decoration:none;color:inherit;}
.container{max-width:1200px;margin:0 auto;padding:0 40px;}
@media (max-width:768px){.container{padding:0 20px;}}

/* ── keyframes (실사용 3개 이상) ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes floatBlob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-16px) rotate(3deg);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}

/* ── topnav ── */
.topnav{position:sticky;top:0;z-index:60;width:100%;height:68px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);border-bottom:1px solid var(--n3);padding:0 40px;}
@media (max-width:768px){.topnav{padding:0 20px;}}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-0.01em;color:var(--n10);cursor:pointer;background:none;border:none;}
.nav-tabs{display:flex;gap:2px;background:var(--n2);padding:4px;border-radius:999px;}
@media (max-width:900px){.nav-tabs{display:none;}}
.nav-tab{padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--n7);background:transparent;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;}
.nav-tab.active{color:var(--m700);background:var(--n0);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.nav-tab:hover:not(.active){color:var(--n9);}
.nav-right{display:flex;align-items:center;gap:10px;}

/* ── buttons ── */
.btn-primary{background:var(--m600);color:var(--n0);border:none;border-radius:999px;padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:transparent;border:1.5px solid var(--n9);color:var(--n9);border-radius:999px;padding:11px 24px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s;}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:8px 16px;font-size:13px;}
.icon-btn{width:34px;height:34px;border-radius:999px;background:var(--n2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n8);transition:.15s;}
.icon-btn:hover{background:var(--n3);}

/* ── hero ── */
.hero{width:100%;padding:100px 0 80px;background:var(--n0);overflow:hidden;}
.hero-grid{display:flex;align-items:center;gap:56px;}
@media (max-width:900px){.hero-grid{flex-direction:column;text-align:center;}}
.hero-copy{flex:1;min-width:0;animation:fadeUp .7s ease both;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--m700);background:var(--m50);padding:6px 14px;border-radius:999px;margin-bottom:20px;}
.hero-title{font-size:clamp(34px,5.6vw,64px);font-weight:800;letter-spacing:-0.03em;line-height:1.12;color:var(--n10);margin:0 0 20px;}
.hero-sub{font-size:17px;line-height:1.6;color:var(--n7);max-width:480px;margin:0 0 32px;}
@media (max-width:900px){.hero-sub{margin:0 auto 32px;}}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
@media (max-width:900px){.hero-actions{justify-content:center;}}
.hero-visual{flex:1;min-width:0;display:flex;justify-content:center;animation:fadeUp .8s ease .1s both;}
.blob{width:320px;height:320px;border-radius:42% 58% 62% 38%/48% 40% 60% 52%;background:linear-gradient(135deg,var(--m500),var(--m800));position:relative;animation:floatBlob 7s ease-in-out infinite;box-shadow:0 40px 80px -20px rgba(0,113,227,.35);}
.blob svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56%;height:56%;color:var(--n0);opacity:.92;}

/* ── section shells ── */
.section{width:100%;padding:88px 0;}
.section.alt{background:var(--n2);}
.section-head{max-width:640px;margin:0 0 48px;}
.section-label{font-size:13px;font-weight:700;color:var(--m700);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.section-title{font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:-0.01em;color:var(--n10);margin:0 0 12px;}
.section-desc{font-size:16px;color:var(--n7);line-height:1.6;margin:0;}

/* ── feature cards (SEO/GEO 강점) ── */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media (max-width:900px){.grid-3{grid-template-columns:1fr;}}
.feat-card{background:var(--n0);border-radius:24px;padding:32px 28px;cursor:pointer;transition:transform .25s,box-shadow .25s;border:1px solid var(--n3);animation:fadeUp .6s ease both;}
.feat-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -16px rgba(29,29,31,.14);}
.feat-icon{width:46px;height:46px;border-radius:14px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.feat-card h3{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--n10);}
.feat-card p{font-size:14px;color:var(--n7);line-height:1.6;margin:0 0 14px;}
.feat-link{font-size:13px;font-weight:700;color:var(--m700);display:inline-flex;align-items:center;gap:4px;}

/* ── how (CMS 운영 방식) ── */
.how-grid{display:flex;gap:48px;align-items:flex-start;}
@media (max-width:900px){.how-grid{flex-direction:column;}}
.how-copy{flex:1;min-width:0;}
.how-list{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;}
.how-list li{display:flex;gap:12px;font-size:15px;color:var(--n8);line-height:1.6;}
.how-list li .dot{width:22px;height:22px;border-radius:50%;background:var(--m50);color:var(--m700);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.how-preview{flex:1;min-width:0;background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:24px;}
.preview-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--n3);}
.preview-row:last-of-type{border-bottom:none;}
.preview-row .ptitle{font-size:14px;font-weight:600;color:var(--n9);}
.preview-row .pmeta{font-size:12px;color:var(--n6);margin-top:3px;}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--n2);color:var(--n7);}
.badge.live{background:var(--s1-bg);color:var(--s1-text);}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;margin-right:5px;animation:pulseDot 1.8s ease-in-out infinite;}

/* ── proof (구현 범위 chips) ── */
.chip-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:900px){.chip-row{grid-template-columns:repeat(2,1fr);}}
.chip{background:var(--n0);border:1px solid var(--n3);border-radius:20px;padding:22px 20px;text-align:left;}
.chip .num{font-size:22px;font-weight:800;color:var(--n10);letter-spacing:-0.02em;}
.chip .lbl{font-size:13px;color:var(--n7);margin-top:6px;}

/* ── cta-foot ── */
.foot-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;}
@media (max-width:900px){.foot-grid{grid-template-columns:1fr;}}
.map-card{border-radius:24px;background:linear-gradient(135deg,var(--m50),var(--n2));padding:0;overflow:hidden;height:220px;position:relative;}
.map-card svg{width:100%;height:100%;}
.info-card{background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:28px;}
.info-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid var(--n3);}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--n7);}
.info-row span:last-child{color:var(--n9);font-weight:600;}
.footer{width:100%;background:var(--n10);color:var(--n5);padding:44px 0 28px;margin-top:0;}
.footer .container{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.footer small{font-size:12px;color:var(--n6);}
.footer .flinks{display:flex;gap:16px;font-size:12px;color:var(--n6);}

/* ── generic screen shell (SEO/GEO/CMS) ── */
.screen{width:100%;padding:56px 0 88px;}
.screen-head{margin-bottom:36px;}
.screen-head h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-0.02em;margin:0 0 8px;}
.screen-head p{font-size:15px;color:var(--n7);margin:0;}
.card{background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:28px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
.stack{display:flex;flex-direction:column;gap:20px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:600;color:var(--n8);}
.field input,.field textarea,.field select{border:1px solid var(--n4);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;color:var(--n10);background:var(--n0);}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px var(--m50);}
.serp-card{border:1px solid var(--n3);border-radius:16px;padding:18px 20px;background:var(--n1);}
.serp-url{font-size:12px;color:var(--s1-text);margin-bottom:4px;}
.serp-title{font-size:18px;color:var(--m700);margin:0 0 4px;font-weight:600;}
.serp-desc{font-size:13px;color:var(--n7);line-height:1.5;margin:0;}
.htag-tree{display:flex;flex-direction:column;gap:8px;font-size:13px;}
.htag-tree .h1{font-weight:800;color:var(--n10);}
.htag-tree .h2{padding-left:20px;font-weight:600;color:var(--n9);}
.htag-tree .h3{padding-left:40px;color:var(--n7);}
.codeblock{background:var(--n10);color:var(--n5);border-radius:16px;padding:20px;font-family:'SF Mono',Menlo,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre;}
.codeblock .k{color:var(--m300);}
.codeblock .s{color:var(--s1);}
.accordion-item{border:1px solid var(--n3);border-radius:16px;overflow:hidden;margin-bottom:10px;}
.accordion-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;background:var(--n1);}
.accordion-head span{font-size:14px;font-weight:600;color:var(--n9);}
.accordion-body{padding:0 20px 18px;font-size:13px;color:var(--n7);line-height:1.6;}
.sim-box{border:1px solid var(--n3);border-radius:16px;padding:20px;}
.sim-result{margin-top:16px;background:var(--n2);border-radius:14px;padding:16px 18px;font-size:13px;color:var(--n8);line-height:1.6;}
.sim-cite{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:var(--m700);background:var(--m50);padding:4px 10px;border-radius:999px;}

/* ── CMS ── */
.seg{display:inline-flex;background:var(--n2);border-radius:999px;padding:4px;gap:2px;margin-bottom:28px;flex-wrap:wrap;}
.seg button{padding:9px 18px;border-radius:999px;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--n7);cursor:pointer;}
.seg button.active{background:var(--n0);color:var(--m700);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.list-card{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--n3);border-radius:18px;margin-bottom:12px;background:var(--n0);}
.tile{width:52px;height:52px;border-radius:14px;background:var(--n2);color:var(--n7);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;gap:2px;}
.list-card .main{flex:1;min-width:0;}
.list-card .main .t{font-size:14.5px;font-weight:700;color:var(--n10);}
.list-card .main .m{font-size:12.5px;color:var(--n6);margin-top:3px;}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--n4);border:none;cursor:pointer;flex-shrink:0;transition:.2s;}
.switch.on{background:var(--m600);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--n0);transition:.2s;}
.switch.on .knob{left:20px;}
.row-actions{display:flex;gap:8px;}
table.tbl{width:100%;border-collapse:collapse;}
table.tbl th{text-align:left;font-size:12.5px;color:var(--n6);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--n3);}
table.tbl td{padding:14px;font-size:14px;color:var(--n9);border-bottom:1px solid var(--n3);}
table.tbl tr{cursor:pointer;transition:background .15s;}
table.tbl tbody tr:hover{background:var(--n2);}
.status-tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--n2);color:var(--n7);}

/* ── modal / drawer / toast ── */
.overlay{position:fixed;inset:0;background:rgba(29,29,31,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:var(--n0);border-radius:24px;padding:32px;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;animation:fadeUp .28s ease both;}
.modal h2{font-size:19px;font-weight:700;margin:0 0 20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(29,29,31,.4);z-index:200;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--n0);z-index:201;padding:32px;overflow-y:auto;animation:drawerIn .32s ease both;}
@media (max-width:768px){.drawer{width:100%;}}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:300;}
.toast{background:var(--n10);color:var(--n0);padding:14px 20px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;animation:toastSlide .3s ease both;box-shadow:0 12px 32px -8px rgba(0,0,0,.3);}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--n0);border-radius:50%;animation:spin .7s linear infinite;}
.close-x{background:none;border:none;cursor:pointer;color:var(--n7);display:flex;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

function Icon({name, size=18, style}) {
  return <i data-lucide={name} style={{width:size,height:size,...style}}></i>;
}

/* ───────── shared ───────── */
function Toast({toast}){
  if(!toast) return null;
  return (
    <div className="toast-wrap">
      <div className="toast">
        <Icon name={toast.type==='error'?'alert-circle':'check-circle-2'} size={16}/>
        {toast.msg}
      </div>
    </div>
  );
}

function Modal({title, onClose, children}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h2>{title}</h2>
          <button className="close-x" onClick={onClose}><Icon name="x" size={20}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({title, desc, onCancel, onConfirm}){
  return (
    <Modal title={title} onClose={onCancel}>
      <p style={{fontSize:14,color:'var(--n7)',lineHeight:1.6,margin:'0 0 4px'}}>{desc}</p>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onCancel}>취소</button>
        <button className="btn-primary btn-sm" style={{background:'var(--s2)'}} onClick={onConfirm}>삭제</button>
      </div>
    </Modal>
  );
}

/* ───────── top navigation ───────── */
function TopNav({tab, setTab, onBook}){
  const tabs = [
    {id:'main', label:'홈'},
    {id:'seo', label:'SEO 최적화'},
    {id:'geo', label:'GEO 최적화'},
    {id:'cms', label:'관리자 CMS'},
  ];
  return (
    <header className="topnav">
      <button className="brand" onClick={()=>setTab('main')}>
        <Icon name="stethoscope" size={20} style={{color:'var(--m600)'}}/>
        리본의원
      </button>
      <nav className="nav-tabs">
        {tabs.map(t=>(
          <button key={t.id} className={"nav-tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </nav>
      <div className="nav-right">
        <button className="btn-primary" onClick={onBook}>진료 예약하기</button>
      </div>
    </header>
  );
}

/* ───────── main (병원 홈페이지) — composition: hero → features → how → proof → cta-foot ───────── */
function MainScreen({setTab, onBook}){
  const feats = [
    {icon:'search', title:'메타태그 자동 최적화', desc:'페이지별 title·description·OG 태그를 콘텐츠 변경에 맞춰 함께 관리하는 구조를 구현합니다.', go:'seo'},
    {icon:'sparkles', title:'생성형 AI 노출 대응', desc:'챗GPT·구글 AI 개요 같은 생성형 AI 검색이 인용하기 쉬운 구조화 데이터와 문맥을 설계합니다.', go:'geo'},
    {icon:'map', title:'사이트맵 자동 생성', desc:'공개 페이지 전체를 포함하는 sitemap.xml과 robots.txt를 자동 생성하는 구조를 구현합니다.', go:'seo'},
  ];
  return (
    <div>
      <section className="hero">
        <div className="container hero-grid">
          <div className="hero-copy">
            <span className="eyebrow"><Icon name="badge-check" size={14}/> 내과 · 정형외과 · 피부과 통합진료</span>
            <h1 className="hero-title">환자의 이야기를<br/>가장 먼저 듣는 진료</h1>
            <p className="hero-sub">리본의원은 정확한 진단과 편안한 진료 환경을 함께 제공하는 것을 목표로 홈페이지를 새롭게 구축합니다. 예약부터 진료 안내까지 모바일에서도 자연스럽게 이어집니다.</p>
            <div className="hero-actions">
              <button className="btn-primary" onClick={onBook}>진료 예약하기</button>
              <button className="btn-ghost" onClick={()=>setTab('cms')}>운영 화면 살펴보기</button>
            </div>
          </div>
          <div className="hero-visual">
            <div className="blob">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4">

function GeoScreen({notify}){
  const [openFaq, setOpenFaq] = useState(0);
  const [q, setQ] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const faqs = [
    {q:'리본의원의 진료 시간은 어떻게 되나요?', a:'평일 오전 9시부터 오후 6시 30분까지, 토요일은 오전 9시부터 오후 1시까지 진료합니다.'},
    {q:'온라인으로 예약이 가능한가요?', a:'홈페이지 상단의 진료 예약하기 버튼을 통해 원하는 진료과와 시간을 선택해 예약할 수 있습니다.'},
    {q:'정형외과 진료도 받을 수 있나요?', a:'내과, 정형외과, 피부과 진료를 함께 운영하며 각 진료과별 담당 의료진 정보를 홈페이지에서 확인할 수 있습니다.'},
  ];

  function runSim(){
    if(!q.trim()) return;
    setLoading(true); setResult(null);
    setTimeout(()=>{
      setLoading(false);
      setResult('"'+q+'"에 대한 답변은 리본의원 홈페이지의 FAQPage 구조화 데이터와 진료안내 문단에서 인용됩니다. 진료 시간, 진료과, 예약 방법이 사실 진술 문장 단위로 구성되어 생성형 AI가 답변에 그대로 반영하기 쉬운 구조입니다.');
    }, 1300);
  }

  return (
    <div className="container screen">
      <div className="screen-head">
        <h1>GEO 최적화</h1>
        <p>챗GPT·구글 AI 개요 같은 생성형 AI 검색이 인용하기 쉬운 구조화 데이터와 콘텐츠를 설계합니다.</p>
      </div>
      <div className="two-col">
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <h3 style={{margin:0,fontSize:15,fontWeight:700}}>구조화 데이터 (JSON-LD)</h3>
            <button className="btn-ghost btn-sm" onClick={()=>notify('구조화 데이터를 클립보드에 복사합니다.')}>복사</button>
          </div>
          <div className="codeblock">{'{\n  "@type": "MedicalOrganization",\n  "name": "리본의원",\n  "medicalSpecialty": ["내과","정형외과","피부과"],\n  "openingHours": "Mo-Fr 09:00-18:30",\n  "address": {\n    "@type": "PostalAddress",\n    "addressLocality": "서울 양천구"\n  }\n}'}</div>

          <h3 style={{margin:'24px 0 12px',fontSize:15,fontWeight:700}}>Q&amp;A 콘텐츠 블록</h3>
          {faqs.map((f,i)=>(
            <div className="accordion-item" key={f.q}>
              <div className="accordion-head" onClick={()=>setOpenFaq(openFaq===i?-1:i)}>
                <span>{f.q}</span>
                <Icon name={openFaq===i?'chevron-up':'chevron-down'} size={16} style={{color:'var(--n6)'}}/>
              </div>
              {openFaq===i && <div className="accordion-body">{f.a}</div>}
            </div>
          ))}
        </div>

        <div className="card">
          <h3 style={{margin:'0 0 14px',fontSize:15,fontWeight:700}}>AI 검색 노출 시뮬레이션</h3>
          <div className="sim-box">
            <div className="field" style={{marginBottom:12}}>
              <label>환자가 물어볼 질문을 입력해보세요</label>
              <input placeholder="예: 리본의원 토요일에도 진료하나요?" value={q} onChange={e=>setQ(e.target.value)} />
            </div>
            <button className="btn-primary btn-sm" onClick={runSim} disabled={loading}>
              {loading ? <span className="spinner"></span> : '확인'}
            </button>
            {result && (
              <div className="sim-result">
                {result}
                <div><span className="sim-cite">리본의원 공식 홈페이지 &gt; 진료안내</span></div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

      )}

      {sub==='notice' && (
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{display:'flex',justifyContent:'flex-end',padding:'18px 20px 0'}}>
            <button className="btn-primary btn-sm" onClick={()=>setNoticeModal(true)}>공지 등록</button>
          </div>
          <table className="tbl" style={{marginTop:12}}>
            <thead><tr><th>제목</th><th>작성일</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {notices.map(n=>(
                <tr key={n.id} onClick={()=>setDetailNotice(n)}>
                  <td>{n.title}</td>
                  <td>{n.date}</td>
                  <td><span className="status-tag">{n.status}</span></td>
                  <td style={{textAlign:'right'}}>
                    <button className="icon-btn" onClick={(e)=>{e.stopPropagation(); setConfirmDel({type:'notice', id:n.id});}}><Icon name="trash-2" size={14}/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {sub==='closure' && (
        <div>
          <div className="card" style={{marginBottom:20}}>
            <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700}}>휴진 안내 등록</h3>
            <div className="two-col">
              <div className="field"><label>진료과</label><input value={closureForm.dept} onChange={e=>setClosureForm({...closureForm, dept:e.target.value})} placeholder="예: 정형외과"/></div>
              <div className="field"><label>휴진일</label><input type="date" value={closureForm.date} onChange={e=>setClosureForm({...closureForm, date:e.target.value})} /></div>
            </div>
            <div className="field"><label>사유</label><input value={closureForm.reason} onChange={e=>setClosureForm({...closureForm, reason:e.target.value})} placeholder="예: 학회 참석"/></div>
            <button className="btn-primary btn-sm" onClick={addClosure}>등록</button>
          </div>
          {closures.map(c=>(
            <div className="list-card" key={c.id}>
              <div className="tile"><Icon name="calendar-x" size={18}/></div>
              <div className="main">
                <div className="t">{c.dept} · {c.date}</div>
                <div className="m">{c.reason || '사유 미기재'}</div>
              </div>
              <button className={"switch"+(c.active?' on':'')} onClick={()=>toggleClosure(c.id)}><span className="knob"></span></button>
              <div className="row-actions">
                <button className="icon-btn" onClick={()=>setConfirmDel({type:'closure', id:c.id})}><Icon name="trash-2" size={15}/></button>
              </div>
            </div>
          ))}
        </div>
      )}

      {popupModal && (
        <PopupFormModal onClose={()=>setPopupModal(false)} onSubmit={addPopup} label="팝업" />
      )}
      {bannerModal && (
        <SimpleFormModal title="새 배너 등록" onClose={()=>setBannerModal(false)} onSubmit={addBanner} />
      )}
      {noticeModal && (
        <NoticeFormModal onClose={()=>setNoticeModal(false)} onSubmit={addNotice} />
      )}
      {confirmDel && (
        <ConfirmModal title="삭제 확인" desc="정말 삭제하시겠습니까? 삭제 후에는 되돌릴 수 없습니다." onCancel={()=>setConfirmDel(null)} onConfirm={confirmDelete} />
      )}
      {detailNotice && (
        <div className="drawer-overlay" onClick={()=>setDetailNotice(null)}>
          <div className="drawer" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <h2 style={{fontSize:18,fontWeight:700,margin:0}}>공지사항 상세</h2>
              <button className="close-x" onClick={()=>setDetailNotice(null)}><Icon name="x" size={20}/></button>
            </div>
            <div style={{marginBottom:16}}><span className="status-tag">{detailNotice.status}</span></div>
            <h3 style={{fontSize:17,fontWeight:700,margin:'0 0 8px'}}>{detailNotice.title}</h3>
            <div style={{fontSize:12,color:'var(--n6)',marginBottom:20}}>{detailNotice.date}</div>
            <p style={{fontSize:14,color:'var(--n8)',lineHeight:1.7}}>{detailNotice.content}</p>
          </div>
        </div>
      )}
    </div>
  );
}

function PopupFormModal({onClose, onSubmit}){
  const [title, setTitle] = useState('');
  const [period, setPeriod] = useState('');
  return (
    <Modal title="새 팝업 등록" onClose={onClose}>
      <div className="field"><label>팝업 제목</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="예: 연휴 진료 안내"/></div>
      <div className="field"><label>노출 기간</label><input value={period} onChange={e=>setPeriod(e.target.value)} placeholder="예: 09.28 ~ 10.01"/></div>
      <div className="field">
        <label>이미지</label>
        <div style={{border:'1.5px dashed var(--n4)',borderRadius:14,padding:'22px',textAlign:'center',color:'var(--n6)',fontSize:13}}>
          <Icon name="upload" size={20} style={{marginBottom:6}}/><div>이미지를 드래그하거나 클릭하여 업로드</div>
        </div>
      </div>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onClose}>취소</button>
        <button className="btn-primary btn-sm" onClick={()=>title && onSubmit(title, period||'상시')}>저장</button>
      </div>
    </Modal>
  );
}

function SimpleFormModal({title:modalTitle, onClose, onSubmit}){
  const [val, setVal] = useState('');
  return (
    <Modal title={modalTitle} onClose={onClose}>
      <div className="field"><label>배너 제목</label><input value={val} onChange={e=>setVal(e.target.value)} placeholder="예: 건강검진 프로모션"/></div>
      <div className="field">
        <label>이미지</label>
        <div style={{border:'1.5px dashed var(--n4)',borderRadius:14,padding:'22px',textAlign:'center',color:'var(--n6)',fontSize:13}}>
          <Icon name="upload" size={20} style={{marginBottom:6}}/><div>이미지를 드래그하거나 클릭하여 업로드</div>
        </div>
      </div>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onClose}>취소</button>
        <button className="btn-primary btn-sm" onClick={()=>val && onSubmit(val)}>저장</button>
      </div>
    </Modal>
  );
}

function NoticeFormModal({onClose, onSubmit}){
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  return (
    <Modal title="공지사항 등록" onClose={onClose}>
      <div className="field"><label>제목</label><input value={title} onChange={e=>setTitle(e.target.value)} /></div>
      <div className="field"><label>내용</label><textarea rows="4" value={content} onChange={e=>setContent(e.target.value)}></textarea></div>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onClose}>취소</button>
        <button className="btn-primary btn-sm" onClick={()=>title && onSubmit(title, content)}>등록</button>
      </div>
    </Modal>
  );
}

/* ───────── booking modal (진료 예약) ───────── */
function BookingModal({onClose, notify}){
  const [dept, setDept] = useState('내과');
  const [date, setDate] = useState('');
  return (
    <Modal title="진료 예약" onClose={onClose}>
      <div className="field">
        <label>진료과</label>
        <select value={dept} onChange={e=>setDept(e.target.value)}>
          <option>내과</option><option>정형외과</option><option>피부과</option>
        </select>
      </div>
      <div className="field"><label>희망 날짜</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onClose}>취소</button>
        <button className="btn-primary btn-sm" onClick={()=>{onClose(); notify(dept+' 예약 요청이 접수되었습니다.');}}>예약 요청</button>
      </div>
    </Modal>
  );
}

/* ───────── App ───────── */
function App(){
  const [tab, setTab] = useState('main');
  const [booking, setBooking] = useState(false);
  const [toast, setToast] = useState(null);

  function notify(msg, type='success'){ setToast({msg, type, id:Date.now()}); }
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null), 2600); return ()=>clearTimeout(t); }, [toast]);
  useEffect(()=>{ lucide.createIcons(); });

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <TopNav tab={tab} setTab={setTab} onBook={()=>setBooking(true)} />
      <main style={{flex:1, width:'100%'}}>
        {tab==='main' && <MainScreen setTab={setTab} onBook={()=>setBooking(true)} />}
        {tab==='seo' && <SeoScreen notify={notify} />}
        {tab==='geo' && <GeoScreen notify={notify} />}
        {tab==='cms' && <CmsScreen notify={notify} />}
      </main>
      {booking && <BookingModal onClose={()=>setBooking(false)} notify={notify} />}
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
