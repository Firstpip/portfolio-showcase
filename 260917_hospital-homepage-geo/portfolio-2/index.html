<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>병원 홈페이지 통합 관리 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 300°, dark) ── */
:root{
  --m50:#fce7fc; --m100:#f9cff9; --m200:#f6b1f6; --m300:#f290f2; --m400:#ef71ef;
  --m500:#eb52eb; --m600:#c143c1; --m700:#963496; --m800:#6a256a; --m900:#6a256a;
  --n0:#201e20; --n1:#3a363a; --n2:#5a535a; --n3:#7a717a; --n4:#989098;
  --n5:#bab5ba; --n6:#c3c3cc; --n7:#e6e5e6; --n8:#f0eff0; --n9:#ededf3; --n10:#fdfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;}
a{text-decoration:none;color:inherit;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes dragLift{from{opacity:.5;}to{opacity:1;}}

/* ── sidebar ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--n1);border-right:1px solid var(--n2);padding:24px 16px;display:flex;flex-direction:column;z-index:40;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.sb-brand .mark{width:34px;height:34px;border-radius:10px;background:var(--m500);display:flex;align-items:center;justify-content:center;color:var(--n0);font-size:16px;flex-shrink:0;}
.sb-brand .txt b{display:block;font-size:14.5px;font-weight:700;color:var(--n9);}
.sb-brand .txt span{display:block;font-size:11.5px;color:var(--n5);margin-top:1px;}
.sb-branch{margin:0 0 20px;padding:10px 12px;background:var(--n0);border:1px solid var(--n2);border-radius:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.sb-branch select{background:transparent;border:none;color:var(--n8);font-size:13px;font-weight:600;width:100%;cursor:pointer;}
.sb-branch select:focus{outline:none;}
.sb-nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;background:transparent;border:none;color:var(--n5);font-size:13.5px;font-weight:600;text-align:left;line-height:1.35;cursor:pointer;transition:.15s;}
.sb-item i{font-size:18px;flex-shrink:0;}
.sb-item:hover{background:var(--n0);color:var(--n8);}
.sb-item.active{background:var(--m900);color:var(--n9);}
.sb-item.active i{color:var(--m300);}
.sb-foot{border-top:1px solid var(--n2);padding-top:16px;display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
.sb-foot .who b{display:block;font-size:12.5px;color:var(--n8);}
.sb-foot .who span{display:block;font-size:11px;color:var(--n5);}

/* ── main-wrap ── */
.main-wrap{margin-left:250px;flex:1;min-width:0;width:calc(100% - 250px);min-height:100vh;}
.topbar{position:sticky;top:0;z-index:30;height:68px;background:var(--n0);border-bottom:1px solid var(--n2);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px;}
@media (max-width:480px){.topbar{padding:0 16px;}}
.search-box{display:flex;align-items:center;gap:8px;background:var(--n1);border:1px solid var(--n2);border-radius:10px;padding:9px 14px;width:280px;color:var(--n5);}
.search-box input{background:transparent;border:none;color:var(--n8);font-size:13.5px;width:100%;}
.search-box input:focus{outline:none;}
@media (max-width:640px){.search-box{display:none;}}
.topbar-right{display:flex;align-items:center;gap:12px;}
@media (max-width:480px){.topbar-right .btn-primary span.btn-label{display:none;}.topbar-right .btn-primary{padding:11px 14px;}}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--n1);border:1px solid var(--n2);color:var(--n6);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.15s;}
.icon-btn:hover{background:var(--n2);color:var(--n8);}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--s2);}
.btn-primary{background:var(--m500);color:var(--n0);border:none;border-radius:32px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap;}
.btn-primary:hover{background:var(--m400);}
.btn-ghost{background:transparent;border:1px solid var(--n3);color:var(--n8);border-radius:32px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-ghost:hover{background:var(--n1);}
.btn-ghost.on{background:var(--n1);border-color:var(--m500);color:var(--m300);}
.btn-sm{padding:8px 16px;font-size:12.5px;}

.content{padding:32px;}
@media (max-width:480px){.content{padding:16px;}}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-0.01em;margin:0 0 6px;color:var(--n9);}
.page-head p{font-size:13.5px;color:var(--n5);margin:0;}
.status-strip{display:flex;gap:24px;padding:14px 20px;background:var(--n1);border:1px solid var(--n2);border-radius:12px;margin-bottom:24px;font-size:13px;color:var(--n6);flex-wrap:wrap;}
.status-strip b{color:var(--n9);font-weight:700;}

.insight-banner{display:flex;align-items:center;justify-content:space-between;gap:32px;background:linear-gradient(135deg,var(--m900) 0%,var(--m800) 45%,var(--m600) 100%);border-radius:20px;padding:40px 44px;margin-bottom:24px;position:relative;overflow:hidden;}
.insight-banner::before,.insight-banner::after{content:'';position:absolute;border-radius:50%;filter:blur(1px);pointer-events:none;}
.insight-banner::before{width:280px;height:280px;background:radial-gradient(circle,var(--m400) 0%,transparent 70%);opacity:.28;top:-120px;right:60px;}
.insight-banner::after{width:180px;height:180px;background:radial-gradient(circle,var(--m300) 0%,transparent 70%);opacity:.18;bottom:-90px;right:220px;}
.insight-copy{flex:1;min-width:0;position:relative;z-index:1;}
.insight-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--n10);opacity:.75;margin-bottom:10px;}
.insight-banner h2{font-size:clamp(24px,2.8vw,36px);font-weight:700;letter-spacing:-0.01em;line-height:1.2;margin:0 0 10px;color:var(--n10);}
.insight-banner p{font-size:14px;color:var(--n9);opacity:.85;margin:0;max-width:480px;line-height:1.55;}
.insight-art{width:200px;height:120px;flex-shrink:0;position:relative;z-index:1;}
@media (max-width:900px){.insight-art{display:none;}}
@media (max-width:480px){.insight-banner{padding:28px 24px;}}

/* ── master-detail (대시보드) ── */
.md-grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:flex-start;}
@media (max-width:1100px){.md-grid{grid-template-columns:1fr;}}
.card{background:var(--n1);border:1px solid var(--n2);border-radius:12px;padding:32px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);}
.list-rail{padding:12px;max-height:640px;overflow-y:auto;}
.rail-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent;}
.rail-item:hover{background:var(--n0);}
.rail-item.active{background:var(--n0);border-color:var(--m600);}
.rail-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--n2);color:var(--n7);flex-shrink:0;}
.rail-main{flex:1;min-width:0;}
.rail-main .t{font-size:13.5px;font-weight:600;color:var(--n8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-main .m{font-size:11.5px;color:var(--n5);margin-top:2px;}
.rail-status{width:8px;height:8px;border-radius:50%;background:var(--n3);flex-shrink:0;}
.rail-status.on{background:var(--s1);}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;color:var(--n5);gap:12px;text-align:center;}
.detail-empty i{font-size:36px;color:var(--n3);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12.5px;font-weight:600;color:var(--n6);}
.field input,.field select,.field textarea{background:var(--n0);border:1px solid var(--n3);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--n8);font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--m500);}
.detail-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.detail-title h3{font-size:16px;font-weight:700;color:var(--n9);margin:0;}

/* ── analytics ── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
@media (max-width:900px){.stat-row{grid-template-columns:1fr;}}
.stat-card{background:var(--n1);border:1px solid var(--n2);border-radius:12px;padding:24px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);}
.stat-card .lbl{font-size:12.5px;color:var(--n5);margin-bottom:8px;}
.stat-card .val{font-size:26px;font-weight:800;color:var(--n9);letter-spacing:-0.02em;}
.bar-wrap{height:6px;background:var(--n2);border-radius:999px;overflow:hidden;margin-top:12px;}
.bar-fill{height:100%;background:var(--m500);border-radius:999px;transform-origin:left;animation:barGrow 1s ease both;}
.chart-box{height:280px;position:relative;}
table.tbl{width:100%;border-collapse:collapse;}
table.tbl th{text-align:left;font-size:11.5px;color:var(--n5);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--n2);}
table.tbl td{padding:14px;font-size:13px;color:var(--n8);border-bottom:1px solid var(--n2);}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--n2);color:var(--n7);}
.pill.good{background:var(--s1-bg);color:var(--s1-text);}
.pill.warn{background:var(--s3-bg);color:var(--s3-text);}

/* ── banner scheduler ── */
.sched-item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--n1);border:1px solid var(--n2);border-radius:12px;margin-bottom:10px;cursor:grab;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);}
.sched-item.dragging{animation:dragLift .2s ease both;border-color:var(--m500);}
.sched-handle{color:var(--n4);font-size:16px;cursor:grab;}
.sched-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--n2);color:var(--n7);flex-shrink:0;}
.sched-main{flex:1;min-width:0;}
.sched-main .t{font-size:13.5px;font-weight:600;color:var(--n8);}
.sched-main .m{font-size:11.5px;color:var(--n5);margin-top:3px;}
.status-pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;}
.status-pill.active{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.ended{background:var(--n2);color:var(--n6);}
.status-pill.pending{background:var(--s3-bg);color:var(--s3-text);}

/* ── user roles ── */
.role-select{background:var(--n0);border:1px solid var(--n3);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--n8);}
.matrix-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.matrix-table th,.matrix-table td{border:1px solid var(--n2);padding:10px;text-align:center;color:var(--n7);}
.matrix-table th{background:var(--n0);color:var(--n8);}

/* ── modal / drawer / toast ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:var(--n1);border:1px solid var(--n2);border-radius:16px;padding:32px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;animation:fadeIn .22s ease both;}
.modal h2{font-size:18px;font-weight:700;margin:0 0 20px;color:var(--n9);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.close-x{background:none;border:none;cursor:pointer;color:var(--n5);font-size:18px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--n1);border-left:1px solid var(--n2);z-index:201;padding:32px;overflow-y:auto;}
@media (max-width:768px){.drawer{width:100%;}}
.log-row{padding:12px 0;border-bottom:1px solid var(--n2);font-size:12.5px;color:var(--n6);}
.log-row b{color:var(--n8);}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:300;}
.toast{background:var(--n9);color:var(--n0);padding:14px 20px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;animation:toastSlide .3s ease both;box-shadow:0 12px 32px -8px rgba(0,0,0,.5);}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--n0);border-radius:50%;animation:spin .7s linear infinite;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {BarChart, Bar, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer} = Recharts;

function Toast({toast}){
  if(!toast) return null;
  return (
    <div className="toast-wrap">
      <div className="toast">
        <i className={toast.type==='error' ? 'ph ph-warning-circle' : 'ph ph-check-circle'}></i>
        {toast.msg}
      </div>
    </div>
  );
}

function Modal({title, onClose, children, width}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={width?{maxWidth:width}:null} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h2>{title}</h2>
          <button className="close-x" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({desc, onCancel, onConfirm}){
  return (
    <Modal title="삭제 확인" onClose={onCancel}>
      <p style={{fontSize:13.5,color:'var(--n6)',lineHeight:1.6,margin:'0 0 4px'}}>{desc}</p>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onCancel}>취소</button>
        <button className="btn-primary btn-sm" style={{background:'var(--s2)'}} onClick={onConfirm}>삭제</button>
      </div>
    </Modal>
  );
}

/* ───────── Sidebar ───────── */
function Sidebar({page, setPage}){
  const items = [
    {id:'main', icon:'squares-four', label:'대시보드'},
    {id:'seo-analytics', icon:'chart-line-up', label:'검색 노출 분석 리포트'},
    {id:'banner-scheduler', icon:'calendar-check', label:'다중 지점 배너·팝업 스케줄링'},
    {id:'user-roles', icon:'users-three', label:'권한 기반 사용자 관리'},
  ];
  return (
    <aside className="sidebar">
      <div className="sb-brand">
        <div className="mark"><i className="ph ph-hospital"></i></div>
        <div className="txt"><b>리본 통합관리</b><span>멀티 지점 콘텐츠 운영</span></div>
      </div>
      <div className="sb-branch">
        <i className="ph ph-map-pin" style={{color:'var(--n5)',marginRight:8}}></i>
        <select defaultValue="all">
          <option value="all">전체 지점</option>
          <option value="gangnam">강남점</option>
          <option value="mokdong">목동점</option>
          <option value="seocho">서초점</option>
        </select>
      </div>
      <nav className="sb-nav">
        {items.map(it=>(
          <button key={it.id} className={"sb-item"+(page===it.id?" active":"")} onClick={()=>setPage(it.id)}>
            <i className={"ph ph-"+it.icon}></i>{it.label}
          </button>
        ))}
      </nav>
      <div className="sb-foot">
        <div className="avatar">마</div>
        <div className="who"><b>마케팅 담당자</b><span>최고관리자</span></div>
      </div>
    </aside>
  );
}

/* ───────── 대시보드 (master-detail) ───────── */
function DashboardScreen({notify}){
  const [items, setItems] = useState([
    {id:1, type:'배너', title:'가을철 건강검진 프로모션', branch:'강남점', status:'게시중', active:true},
    {id:2, type:'팝업', title:'추석 연휴 진료 안내', branch:'목동점', status:'예약됨', active:false},
    {id:3, type:'공지', title:'정형외과 신규 장비 도입 안내', branch:'서초점', status:'게시중', active:true},
    {id:4, type:'배너', title:'피부과 레이저 시술 안내', branch:'서초점', status:'게시중', active:true},
    {id:5, type:'휴진', title:'내과 학회 참석 휴진', branch:'강남점', status:'대기', active:false},
    {id:6, type:'공지', title:'독감 예방접종 사전예약', branch:'목동점', status:'게시중', active:true},
  ]);
  const [selectedId, setSelectedId] = useState(1);
  const [draft, setDraft] = useState(null);
  const selected = items.find(i=>i.id===selectedId) || null;

  useEffect(()=>{ setDraft(selected ? {...selected} : null); }, [selectedId]);

  function save(){
    setItems(list=>list.map(i=>i.id===draft.id?{...draft}:i));
    notify('변경 내용이 저장되었습니다.');
  }
  function toggleActive(){
    setDraft(d=>({...d, active:!d.active, status: !d.active ? '게시중' : '중지됨'}));
  }

  return (
    <div>
      <div className="page-head">
        <h1>대시보드</h1>
        <p>지점별 배너·팝업·공지사항·휴진 안내를 한 화면에서 조회하고 편집합니다.</p>
      </div>
      <div className="insight-banner">
        <div className="insight-copy">
          <div className="insight-eyebrow">Overview</div>
          <h2>전체 지점 콘텐츠 현황을 한눈에 확인합니다</h2>
          <p>강남점·목동점·서초점의 배너·팝업·공지사항 게시 상태를 하나의 목록에서 관리합니다.</p>
        </div>
        <svg className="insight-art" viewBox="0 0 220 140" fill="none">
          <path d="M10 90 L55 60 L95 95 L140 40 L185 68 L210 30" stroke="var(--n10)" strokeWidth="1.6" opacity="0.45"/>
          <circle cx="10" cy="90" r="4" fill="var(--n10)" opacity="0.9"/>
          <circle cx="55" cy="60" r="4" fill="var(--n10)" opacity="0.75"/>
          <circle cx="95" cy="95" r="4" fill="var(--n10)" opacity="0.8"/>

/* ───────── 검색 노출 분석 리포트 ───────── */
function SeoAnalyticsScreen({notify}){
  const [period, setPeriod] = useState('week');
  const dataWeek = [
    {page:'홈', rate:94}, {page:'병원소개', rate:88}, {page:'진료안내', rate:91},
    {page:'의료진', rate:76}, {page:'예약안내', rate:82}, {page:'공지사항', rate:69},
  ];
  const dataMonth = [
    {page:'홈', rate:97}, {page:'병원소개', rate:93}, {page:'진료안내', rate:95},
    {page:'의료진', rate:85}, {page:'예약안내', rate:89}, {page:'공지사항', rate:78},
  ];
  const data = period==='week' ? dataWeek : dataMonth;
  const avg = Math.round(data.reduce((s,d)=>s+d.rate,0)/data.length);

  return (
    <div>
      <div className="page-head">
        <h1>검색 노출 분석 리포트</h1>
        <p>SEO·GEO 구조화 데이터 적용 현황과 페이지별 검색 노출 추적을 확인합니다.</p>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div style={{display:'flex',gap:8}}>
          <button className={"btn-ghost btn-sm"+(period==='week'?' on':'')} onClick={()=>setPeriod('week')}>주간</button>
          <button className={"btn-ghost btn-sm"+(period==='month'?' on':'')} onClick={()=>setPeriod('month')}>월간</button>
        </div>
        <button className="btn-ghost btn-sm" onClick={()=>notify('리포트를 CSV로 내보냅니다.')}><i className="ph ph-download-simple" style={{marginRight:6}}></i>CSV 내보내기</button>
      </div>
      <div className="stat-row">
        <div className="stat-card">
          <div className="lbl">평균 구조화 데이터 적용률</div>
          <div className="val">{avg}%</div>
          <div className="bar-wrap"><div className="bar-fill" style={{width:avg+'%'}}></div></div>
        </div>
        <div className="stat-card">
          <div className="lbl">JSON-LD 적용 페이지</div>
          <div className="val">{data.filter(d=>d.rate>=85).length} / {data.length}</div>
        </div>
        <div className="stat-card">
          <div className="lbl">GEO 대응 콘텐츠 블록</div>
          <div className="val">{period==='week'?12:15}개</div>
        </div>
      </div>
      <div className="card">
        <h3 style={{margin:'0 0 16px',fontSize:14.5,fontWeight:700,color:'var(--n9)'}}>페이지별 구조화 데이터 적용률</h3>
        <div className="chart-box">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={data} margin={{top:8,right:8,left:-16,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#3a363a" vertical={false} />
              <XAxis dataKey="page" stroke="#c3c3cc" fontSize={12} tickLine={false} axisLine={{stroke:'#3a363a'}} />
              <YAxis stroke="#c3c3cc" fontSize={12} tickLine={false} axisLine={false} />
              <Tooltip contentStyle={{background:'#3a363a',border:'1px solid #5a535a',borderRadius:10,color:'#ededf3',fontSize:12.5}} />
              <Bar dataKey="rate" radius={[6,6,0,0]} fill="#eb52eb">
                {data.map((d,i)=>(<Cell key={i} fill={PALETTE[i % PALETTE.length]} />))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="card" style={{marginTop:20, padding:0, overflow:'hidden'}}>
        <table className="tbl">
          <thead><tr><th>페이지</th><th>구조화 데이터</th><th>적용률</th></tr></thead>
          <tbody>
            {data.map(d=>(
              <tr key={d.page}>
                <td>{d.page}</td>
                <td><span className={"pill "+(d.rate>=85?'good':d.rate>=75?'':'warn')}>{d.rate>=85?'적용 완료':d.rate>=75?'적용 중':'점검 필요'}</span></td>
                <td>{d.rate}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* Recharts Bar 자식 Cell에 색을 명시 (모노크롬 메인 램프 — 컬러 역할 규칙) */
const PALETTE = ['#eb52eb','#d94ad9','#c143c1','#ae3cae','#963496','#832e83'];

/* ───────── 배너·팝업 스케줄링 (드래그 정렬) ───────── */
function SchedulerScreen({notify}){
  const [items, setItems] = useState([
    {id:1, type:'배너', title:'가을철 건강검진 프로모션', branch:'강남점', start:'2026-09-20 00:00', end:'2026-09-30 23:59', status:'active'},
    {id:2, type:'팝업', title:'추석 연휴 진료 안내', branch:'전지점', start:'2026-09-28 00:00', end:'2026-10-01 23:59', status:'pending'},
    {id:3, type:'배너', title:'독감 예방접종 사전예약', branch:'목동점', start:'2026-09-01 00:00', end:'2026-09-15 23:59', status:'ended'},
  ]);
  const [modal, setModal] = useState(false);
  const [dragId, setDragId] = useState(null);

  function onDrop(targetId){
    if(dragId===null || dragId===targetId) return;
    setItems(list=>{
      const from = list.findIndex(i=>i.id===dragId);
      const to = list.findIndex(i=>i.id===targetId);
      const copy = [...list];
      const [moved] = copy.splice(from,1);
      copy.splice(to,0,moved);
      return copy;
    });
    setDragId(null);
    notify('노출 우선순위가 변경되었습니다.');
  }
  function runNow(id){
    setItems(list=>list.map(i=>i.id===id?{...i, status:'active'}:i));
    notify('즉시 노출로 전환되었습니다.');
  }
  function addItem(payload){
    setItems(list=>[...list, {id:Date.now(), status:'pending', ...payload}]);
    setModal(false); notify('예약 발행이 등록되었습니다.');
  }

  return (
    <div>
      <div className="page-head">
        <h1>다중 지점 배너·팝업 스케줄링</h1>
        <p>여러 지점의 배너·팝업을 예약 발행하고, 드래그로 노출 우선순위를 조정합니다.</p>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        <button className="btn-primary btn-sm" onClick={()=>setModal(true)}><i className="ph ph-plus" style={{marginRight:6}}></i>예약 등록</button>
      </div>
      {items.map(it=>(
        <div
          key={it.id}
          className={"sched-item"+(dragId===it.id?" dragging":"")}
          draggable
          onDragStart={()=>setDragId(it.id)}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={()=>onDrop(it.id)}
        >
          <i className="ph ph-dots-six-vertical sched-handle"></i>
          <span className="sched-tag">{it.type}</span>
          <div className="sched-main">
            <div className="t">{it.title}</div>
            <div className="m">{it.branch} · {it.start} ~ {it.end}</div>
          </div>
          <span className={"status-pill "+it.status}>{it.status==='active'?'노출중':it.status==='pending'?'예약됨':'종료'}</span>
          {it.status!=='active' && (
            <button className="btn-ghost btn-sm" onClick={()=>runNow(it.id)}>지금 실행</button>
          )}
        </div>
      ))}
      {modal && <SchedulerModal onClose={()=>setModal(false)} onSubmit={addItem} />}
    </div>
  );
}

function SchedulerModal({onClose, onSubmit}){
  const [type, setType] = useState('배너');
  const [branch, setBranch] = useState('강남점');
  const [title, setTitle] = useState('');
  const [start, setStart] = useState('');
  const [end, setEnd] = useState('');
  return (
    <Modal title="예약 발행 등록" onClose={onClose}>
      <div className="field"><label>제목</label><input value={title} onChange={e=>setTitle(e.target.value)} /></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="field"><label>타입</label><select value={type} onChange={e=>setType(e.target.value)}><option>배너</option><option>팝업</option></select></div>
        <div className="field"><label>지점</label><select value={branch} onChange={e=>setBranch(e.target.value)}><option>강남점</option><option>목동점</option><option>서초점</option><option>전지점</option></select></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="field"><label>시작</label><input type="datetime-local" value={start} onChange={e=>setStart(e.target.value)} /></div>
        <div className="field"><label>종료</label><input type="datetime-local" value={end} onChange={e=>setEnd(e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <button className="btn-ghost btn-sm" onClick={onClose}>취소</button>
        <button className="btn-primary btn-sm" onClick={()=>title && onSubmit({type, branch, title, start:start||'미정', end:end||'미정'})}>등록</button>
      </div>
    </Modal>
  );
}

/* ───────── 권한 기반 사용자 관리 ───────── */
function UserRolesScreen({notify}){

    {id:1, name:'마케팅 담당자', branch:'전지점', role:'최고관리자', last:'2026.09.17 09:12'},
    {id:2, name:'강남점 매니저', branch:'강남점', role:'지점관리자', last:'2026.09.16 18:40'},
    {id:3, name:'서초점 담당자', branch:'서초점', role:'에디터', last:'2026.09.15 11:02'},
    {id:4, name:'목동점 담당자', branch:'목동점', role:'에디터', last:'2026.09.14 15:27'},
  ]);

  const [logOpen, setLogOpen] = useState(false);

  function changeRole(id, role){

  const logs = [

    {who:'서초점 담당자', act:'공지사항 등록', at:'2026.09.16 14:12'},
    {who:'마케팅 담당자', act:'사용자 권한 변경', at:'2026.09.15 10:03'},
  ];

  return (
    <div>
      <div className="page-head">
        <h1>권한 기반 사용자 관리</h1>
        <p>지점·역할별 접근 권한을 관리하고 최근 활동을 추적합니다.</p>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginBottom:16}}>
        <button className="btn-ghost btn-sm" onClick={()=>setLogOpen(true)}>접근 로그 보기</button>

      </div>
      <div className="card" style={{padding:0, overflow:'hidden'}}>
        <table className="tbl">
          <thead><tr><th>이름</th><th>지점</th><th>역할</th><th>최근 활동</th></tr></thead>
          <tbody>
            {users.map(u=>(
              <tr key={u.id}>
                <td>{u.name}</td>
                <td>{u.branch}</td>
                <td>
                  <select className="role-select" value={u.role} onChange={e=>changeRole(u.id, e.target.value)}>
                    <option>최고관리자</option><option>지점관리자</option><option>에디터</option>
                  </select>
                </td>
                <td style={{color:'var(--n5)'}}>{u.last}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {matrixOpen && (
        <Modal title="역할 매트릭스" onClose={()=>setMatrixOpen(false)} width="560px">
          <table className="matrix-table">
            <thead><tr><th>권한</th><th>최고관리자</th><th>지점관리자</th><th>에디터</th></tr></thead>
            <tbody>
              <tr><td>전체 지점 조회</td><td>✓</td><td>—</td><td>—</td></tr>

              <tr><td>타 지점 편집</td><td>✓</td><td>—</td><td>—</td></tr>
              <tr><td>사용자 권한 변경</td><td>✓</td><td>—</td><td>—</td></tr>
              <tr><td>공지사항 등록</td><td>✓</td><td>✓</td><td>✓</td></tr>
            </tbody>
          </table>
          <div className="modal-actions"><button className="btn-primary btn-sm" onClick={()=>setMatrixOpen(false)}>확인</button></div>
        </Modal>
      )}

      {logOpen && (
        <div className="drawer-overlay" onClick={()=>setLogOpen(false)}>

            {logs.map((l,i)=>(
              <div className="log-row" key={i}><b>{l.who}</b> · {l.act}<div style={{marginTop:2}}>{l.at}</div></div>

/* ───────── App ───────── */
function App(){
  const [page, setPage] = useState('main');
  const [toast, setToast] = useState(null);
  const [addModal, setAddModal] = useState(false);

  function notify(msg, type='success'){ setToast({msg, type, id:Date.now()}); }
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null), 2600); return ()=>clearTimeout(t); }, [toast]);

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <Sidebar page={page} setPage={setPage} />
      <main className="main-wrap">
        <header className="topbar">
          <div className="search-box"><i className="ph ph-magnifying-glass"></i><input placeholder="콘텐츠 · 지점 · 사용자 검색" /></div>
          <div className="topbar-right">
            <button className="icon-btn" onClick={()=>notify('읽지 않은 알림 2건이 있습니다.')}><i className="ph ph-bell"></i><span className="dot"></span></button>
            <button className="btn-primary" onClick={()=>setAddModal(true)}><i className="ph ph-plus" style={{marginRight:6}}></i><span className="btn-label">새 콘텐츠 등록</span></button>
          </div>
        </header>
        <div className="content">
          {page==='main' && <DashboardScreen notify={notify} />}
          {page==='seo-analytics' && <SeoAnalyticsScreen notify={notify} />}
          {page==='banner-scheduler' && <SchedulerScreen notify={notify} />}
          {page==='user-roles' && <UserRolesScreen notify={notify} />}
        </div>
      </main>
      {addModal && (
        <QuickAddModal onClose={()=>setAddModal(false)} onSubmit={()=>{setAddModal(false); notify('새 콘텐츠가 등록되었습니다.');}} />
      )}
      <Toast toast={toast} />
    </div>
  );
}

function QuickAddModal({onClose, onSubmit}){
  const [title, setTitle] = useState('');
  const [type, setType] = useState('배너');
  const [branch, setBranch] = useState('강남점');
  return (
    <Modal title="새 콘텐츠 등록" onClose={onClose}>
      <div className="field"><label>제목</label><input value={title} onChange={e=>setTitle(e.target.value)} /></div>

        <div className="field"><label>타입</label><select value={type} onChange={e=>setType(e.target.value)}><option>배너</option><option>팝업</option><option>공지</option></select></div>
        <div className="field"><label>지점</label><select value={branch} onChange={e=>setBranch(e.target.value)}><option>강남점</option><option>목동점</option><option>서초점</option></select></div>

      </div>

  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
