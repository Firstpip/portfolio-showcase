<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클리니컬리드 — 검사결과 AI 자동 판독 검증 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/dist/index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 150°, light) ── */
:root{
  --m50:#f1fcf7; --m100:#e3faef; --m200:#c8f4de; --m300:#a6eeca; --m400:#81e7b4;
  --m500:#5de09f; --m600:#3ad98a; --m700:#30b271; --m800:#258b58; --m900:#1a623e;
  --n0:#f4f4f4; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d7d6;
  --n5:#b5bab8; --n6:#909894; --n7:#717a75; --n8:#535a57; --n9:#363a38; --n10:#101010;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n9);
  -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5; letter-spacing:-0.1px;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit;}
input, select, textarea{font-family:inherit; font-size:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

/* ── 레이아웃 골격 (sidebar-classic) ── */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:248px;
  background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; padding:20px 14px; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand-mark{width:32px; height:32px; border-radius:9px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0;}
.brand-name{font-size:16px; font-weight:700; color:var(--n10);}
.brand-sub{font-size:11px; color:var(--n6); margin-top:1px;}
.nav-group-label{font-size:11px; color:var(--n6); font-weight:600; padding:14px 10px 6px; letter-spacing:0.02em;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:500; color:var(--n8);
  transition:background .15s, color .15s;
}
.nav-item i{font-size:17px; color:var(--n6); transition:color .15s;}
.nav-item:hover{background:var(--n2);}
.nav-item.active{background:var(--m50); color:var(--m800); font-weight:600;}
.nav-item.active i{color:var(--m700);}
.sidebar-foot{margin-top:auto; padding:14px 10px 4px; border-top:1px solid var(--n3);}
.sidebar-user{display:flex; align-items:center; gap:10px;}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.user-meta{min-width:0;}
.user-name{font-size:13px; font-weight:600; color:var(--n9); white-space:nowrap;}
.user-role{font-size:11.5px; color:var(--n6);}

.main-wrap{margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px); min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  height:60px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; background:var(--n1); border-bottom:1px solid var(--n3); position:sticky; top:0; z-index:30;
}
.topbar-title{font-size:18px; font-weight:700; color:var(--n10);}
.topbar-actions{display:flex; align-items:center; gap:14px;}
.icon-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--n7); transition:background .15s;}
.icon-btn:hover{background:var(--n2);}
.content-pad{padding:28px; flex:1;}
.hero-band{
  border-radius:16px; padding:22px 26px; margin-bottom:20px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--m700) 0%, var(--m900) 100%);
}
.hero-band-row{display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; z-index:1;}
.hero-band h2{font-size:22px; font-weight:700; margin-bottom:6px;}
.hero-band p{font-size:13px; opacity:.85;}
.hero-band-stat{font-size:32px; font-weight:800; letter-spacing:-0.5px;}
.hero-band-stat-label{font-size:11.5px; opacity:.8; margin-top:2px;}
.hero-band-orbit{position:absolute; right:-40px; top:-60px; width:220px; height:220px; opacity:.5;}

/* ── 카드/버튼 공통 ── */
.card{background:var(--n1); border:1px solid var(--n3); border-radius:12px; box-shadow:0 1px 2px rgba(16,16,16,.03), 0 4px 8px rgba(16,16,16,.04);}
.btn{border-radius:9999px; padding:10px 20px; font-size:13.5px; font-weight:600; transition:transform .12s, background .15s, box-shadow .15s; display:inline-flex; align-items:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700); box-shadow:0 4px 12px rgba(58,217,138,.28);}
.btn-ghost{background:var(--n0); color:var(--n8); border:1px solid var(--n4);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:6px 14px; font-size:12.5px; border-radius:9999px;}
.btn-danger-ghost{background:var(--s2-bg); color:var(--s2-text); border:1px solid transparent;}
.btn-danger-ghost:hover{filter:brightness(0.97);}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:9999px;}
.badge-n{background:var(--n2); color:var(--n7);}
.badge-warn{background:var(--s3-bg); color:var(--s3-text);}
.badge-err{background:var(--s2-bg); color:var(--s2-text);}
.badge-dark{background:var(--n9); color:var(--n1);}
.dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.dot-live{background:var(--m600); animation:pulseDot 1.4s ease-in-out infinite;}

/* ── 워크스페이스 (editor-canvas 컴포지션) ── */
.workspace{display:grid; grid-template-columns:280px 1fr 300px; gap:16px; align-items:start;}
.ws-panel{background:var(--n1); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.ws-panel-head{padding:14px 16px; border-bottom:1px solid var(--n3); display:flex; align-items:center; justify-content:space-between;}
.ws-panel-title{font-size:12.5px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.03em;}
.dropzone{margin:12px; border:1.5px dashed var(--n4); border-radius:10px; padding:16px 12px; text-align:center; transition:border-color .15s, background .15s;}
.dropzone.drag-over{border-color:var(--m600); background:var(--m50);}
.dropzone i{font-size:22px; color:var(--n6); margin-bottom:6px; display:block;}
.dropzone p{font-size:12px; color:var(--n7); margin-top:2px;}
.doc-list{padding:6px 8px 12px; max-height:520px; overflow-y:auto;}
.doc-row{
  display:flex; flex-direction:column; gap:6px; width:100%; text-align:left; padding:11px 10px; border-radius:9px;
  border:1px solid transparent; margin-bottom:4px; animation:fadeInUp .35s ease both;
}
.doc-row:hover{background:var(--n0);}
.doc-row.selected{background:var(--m50); border-color:var(--m300);}
.doc-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.doc-name{font-size:12.5px; font-weight:600; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.doc-meta{font-size:11px; color:var(--n6);}

.canvas-body{padding:0;}
.split-view{display:grid; grid-template-columns:1fr 1fr; min-height:560px;}
.origin-pane{padding:20px; border-right:1px solid var(--n3); background:var(--n0);}
.origin-doc{background:#fff; border:1px solid var(--n3); border-radius:8px; padding:22px 18px; min-height:480px; position:relative; box-shadow:0 1px 3px rgba(16,16,16,.05);}
.origin-doc h4{font-size:13px; color:var(--n8); margin-bottom:14px; border-bottom:1px solid var(--n3); padding-bottom:8px;}
.origin-line{height:9px; background:var(--n3); border-radius:3px; margin-bottom:10px;}
.origin-region{
  position:absolute; border:2px solid transparent; border-radius:4px; transition:border-color .2s, background .2s;
}
.origin-region.hl{border-color:var(--m600); background:rgba(58,217,138,.08);}
.extract-pane{padding:20px; overflow-y:auto; max-height:600px;}
.field-row{padding:12px 12px; border-radius:9px; border:1px solid var(--n3); margin-bottom:9px; cursor:pointer; transition:border-color .15s, background .15s;}
.field-row:hover{border-color:var(--n5);}
.field-row.active{border-color:var(--m500); background:var(--m50);}
.field-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.field-label{font-size:12px; font-weight:600; color:var(--n7);}
.field-value-input{
  width:100%; border:1px solid var(--n3); border-radius:7px; padding:7px 9px; font-size:13px; color:var(--n9);
  background:var(--n1);
}
.field-value-input:focus{outline:2px solid var(--m300); border-color:var(--m500);}
.conf-track{width:56px; height:5px; border-radius:4px; background:var(--n3); overflow:hidden;}
.conf-fill{height:100%; border-radius:4px; animation:growBar .6s ease both;}

.inspector-body{padding:16px;}
.inspector-empty{padding:40px 16px; text-align:center; color:var(--n6); font-size:12.5px;}
.map-row{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
.map-row label{font-size:11.5px; color:var(--n6); font-weight:600;}
.map-select{width:100%; border:1px solid var(--n3); border-radius:8px; padding:8px 10px; font-size:12.5px; background:var(--n1); color:var(--n9);}
.confirm-strip{display:flex; gap:8px; margin-top:8px;}
.mini-log{margin-top:16px; padding-top:14px; border-top:1px solid var(--n3);}
.mini-log-item{display:flex; gap:8px; font-size:11.5px; color:var(--n7); margin-bottom:8px; align-items:flex-start;}
.mini-log-item i{color:var(--n5); margin-top:2px; font-size:13px;}

/* ── 테이블 화면 공통 (extraction / verify / mapping / roles 대체) ── */
.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; gap:16px;}
.page-title{font-size:22px; font-weight:700; color:var(--n10);}
.page-sub{font-size:13px; color:var(--n7); margin-top:4px;}
.hero-stat{font-size:38px; font-weight:800; color:var(--n10); letter-spacing:-0.5px;}
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat-card{padding:18px 18px 16px;}
.stat-card .lbl{font-size:12px; color:var(--n6); font-weight:600; margin-bottom:8px;}
.stat-card .val{font-size:24px; font-weight:700; color:var(--n10);}

.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11.5px; color:var(--n6); font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:12px 16px; border-bottom:1px solid var(--n3); background:var(--n0);}
tbody td{padding:13px 16px; border-bottom:1px solid var(--n3); color:var(--n8);}
tbody tr{transition:background .12s; cursor:pointer;}
tbody tr:hover{background:var(--n0);}
tbody tr:last-child td{border-bottom:none;}
.progress-track{width:100px; height:6px; background:var(--n3); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; border-radius:4px; background:var(--m600); animation:growBar .8s ease both;}

.filter-bar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.select-chip{border:1px solid var(--n4); background:var(--n1); border-radius:9999px; padding:8px 14px; font-size:12.5px; color:var(--n8); display:flex; align-items:center; gap:6px;}
.search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--n4); border-radius:9999px; padding:8px 14px; background:var(--n1); flex:1; max-width:280px;}
.search-box input{border:none; outline:none; flex:1; background:transparent; color:var(--n9);}

/* mapping rules */
.rule-row{display:grid; grid-template-columns:1fr 40px 1fr 90px; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--n3);}
.rule-row:last-child{border-bottom:none;}
.rule-field{font-size:13px; color:var(--n9); font-weight:500;}
.rule-target{font-size:13px; color:var(--n8);}
.rule-target.unmapped{color:var(--s3-text); font-style:italic;}

/* settings */
.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.settings-card{padding:20px;}
.settings-card h3{font-size:14px; font-weight:700; margin-bottom:4px;}
.settings-card p{font-size:12.5px; color:var(--n7); margin-bottom:16px;}
.setting-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--n3);}
.setting-row:last-child{border-bottom:none;}
.setting-row .lbl{font-size:13px; color:var(--n9); font-weight:500;}
.setting-row .desc{font-size:11.5px; color:var(--n6); margin-top:2px;}
.switch{width:38px; height:22px; border-radius:9999px; background:var(--n4); position:relative; transition:background .2s; flex-shrink:0;}
.switch.on{background:var(--m600);}
.switch-knob{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .2s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch.on .switch-knob{left:18px;}
.status-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 11px; border-radius:9999px;}

/* ── modal / drawer / toast ── */
.overlay{position:fixed; inset:0; background:rgba(16,16,16,.42); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeIn .18s ease;}
.modal{background:#fff; border-radius:16px; width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; padding:26px; animation:fadeInScale .2s ease;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:17px; font-weight:700; color:var(--n10);}
.close-btn{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.close-btn:hover{background:var(--n2);}
.form-field{margin-bottom:14px;}
.form-field label{display:block; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:6px;}
.form-field input, .form-field select, .form-field textarea{
  width:100%; border:1px solid var(--n3); border-radius:9px; padding:9px 11px; font-size:13px; color:var(--n9); background:var(--n0);
}

.drawer-overlay{position:fixed; inset:0; background:rgba(16,16,16,.35); z-index:200; animation:fadeIn .18s ease;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff; z-index:210;
  box-shadow:-8px 0 28px rgba(16,16,16,.14); padding:24px; overflow-y:auto; animation:slideInRight .25s ease;
}

.toast-stack{position:fixed; bottom:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--n10); color:#fff; padding:12px 18px; border-radius:10px; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:9px; box-shadow:0 8px 24px rgba(16,16,16,.25); animation:toastIn .25s ease;
}
.toast i{color:var(--m400); font-size:16px;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
@keyframes fadeInUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInRight{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastIn{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(58,217,138,.5);} 50%{box-shadow:0 0 0 5px rgba(58,217,138,0);}}
@keyframes growBar{from{width:0;} }

@media (max-width: 1100px){
  .workspace{grid-template-columns:1fr;}
  .split-view{grid-template-columns:1fr;}
}
</style>
</head>
<body>

const STATUS_STYLE = {
  '대기': { cls:'badge-n', icon:'clock' },
  '추출중': { cls:'badge-warn', icon:'sparkle' },
  '검증대기': { cls:'badge-err', icon:'eye' },
  '확정완료': { cls:'badge-dark', icon:'check-circle' },
};

function StatusBadge({ status, live }) {
  const s = STATUS_STYLE[status] || STATUS_STYLE['대기'];
  return (
    <span className={"badge " + s.cls}>
      {live ? <span className="dot dot-live"></span> : <Icon name={s.icon} />}
      {status}
    </span>
  );
}

function ConfBar({ value }) {
  const color = value >= 85 ? 'var(--m600)' : value < 70 ? 'var(--s3)' : 'var(--n5)';
  return (
    <div className="conf-track">
      <div className="conf-fill" style={{ width: value + '%', background: color }}></div>
    </div>
  );
}

          <div className="brand-sub">CDSS 검증 워크벤치</div>

      </div>
      <div className="nav-group-label">워크플로우</div>
      {items.map(it => (

function Dropzone({ onDrop }) {
  const [drag, setDrag] = useState(false);
  return (
    <div
      className={"dropzone" + (drag ? ' drag-over' : '')}
      onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={(e) => { e.preventDefault(); setDrag(false); onDrop(); }}
    >
      <Icon name="upload-simple" />
      <button className="btn btn-ghost btn-sm" style={{ width:'100%', justifyContent:'center' }} onClick={onDrop}>
        <Icon name="plus" /> 검사지 업로드
      </button>
      <p>PDF · 이미지 파일을 여기로 드래그</p>
    </div>
  );
}

function WorkspaceScreen({ docs, selectedId, setSelectedId, selectedField, setSelectedField, onConfirmField, onMapField, onFinalizeDoc, onUpload, pushToast }) {

  const field = doc && doc.fields.find(f => f.id === selectedField);

  const avgConf = Math.round(docs.flatMap(d => d.fields).reduce((s,f,_,arr) => s + f.confidence/arr.length, 0)) || 0;
  const doneToday = docs.filter(d => d.status === '확정완료').length;

  return (
    <React.Fragment>
      <div className="hero-band">
        <svg className="hero-band-orbit" viewBox="0 0 220 220" fill="none">
          <circle cx="150" cy="60" r="90" stroke="rgba(255,255,255,.35)" strokeWidth="1.4" />
          <circle cx="150" cy="60" r="60" stroke="rgba(255,255,255,.25)" strokeWidth="1.4" />
          <circle cx="150" cy="60" r="30" stroke="rgba(255,255,255,.2)" strokeWidth="1.4" />
          <circle cx="205" cy="30" r="4" fill="rgba(255,255,255,.6)" />
          <circle cx="90" cy="95" r="3" fill="rgba(255,255,255,.4)" />
        </svg>
        <div className="hero-band-row">
          <div>
            <h2>오늘의 검증 워크벤치</h2>
            <p>AI 추출부터 의료진 검증, CDSS 매핑까지 한 화면에서 처리합니다</p>
          </div>
          <div style={{ display:'flex', gap:'28px' }}>
            <div><div className="hero-band-stat">{doneToday}</div><div className="hero-band-stat-label">오늘 확정 완료</div></div>
            <div><div className="hero-band-stat">{avgConf || 89}%</div><div className="hero-band-stat-label">평균 추출 신뢰도</div></div>
          </div>
        </div>
      </div>
    <div className="workspace">
      <div className="ws-panel">
        <div className="ws-panel-head">
          <span className="ws-panel-title">문서 큐</span>
          <span className="badge badge-n">{docs.length}건</span>
        </div>
        <Dropzone onDrop={onUpload} />
        <div className="doc-list">
          {docs.map((d, i) => (
            <button
              key={d.id}
              className={"doc-row" + (d.id === doc.id ? ' selected' : '')}
              style={{ animationDelay: (i * 0.03) + 's' }}
              onClick={() => { setSelectedId(d.id); setSelectedField(null); }}

              <div className="doc-row-top">
                <span className="doc-name">{d.name}</span>
              </div>
              <div className="doc-meta">{d.patient} · {d.uploadedAt}</div>
              <StatusBadge status={d.status} live={d.status === '추출중'} />
            </button>
          ))}
        </div>
      </div>

      <div className="ws-panel canvas-body">
        <div className="ws-panel-head">
          <span className="ws-panel-title">원본 · 추출 Split View — {doc.name}</span>
          <button className="btn btn-ghost btn-sm" onClick={() => pushToast('동기 스크롤 모드가 켜졌습니다')}>
            <Icon name="arrows-vertical" /> 동기 스크롤
          </button>
        </div>
        {doc.fields.length === 0 ? (
          <div className="inspector-empty" style={{ padding:'80px 20px' }}>
            <Icon name="hourglass-medium" style={{ fontSize:'26px' }} /><br />
            {doc.status === '추출중' ? 'AI가 검사지를 판독하는 중입니다…' : '아직 추출이 시작되지 않은 문서입니다.'}
          </div>
        ) : (
          <div className="split-view">
            <div className="origin-pane">
              <div className="origin-doc">
                <h4>{doc.name}</h4>
                {doc.fields.map(f => <div key={f.id} className="origin-line" style={{ width: (60 + Math.random()*30) + '%' }}></div>)}
                {doc.fields.map(f => (
                  <div key={f.id} className={"origin-region" + (selectedField === f.id ? ' hl' : '')}
                    style={{ top: f.top + 'px', left: f.left + 'px', width: f.w + 'px', height: f.h + 'px' }}></div>
                ))}
              </div>
            </div>
            <div className="extract-pane">
              {doc.fields.map(f => (
                <div key={f.id} className={"field-row" + (selectedField === f.id ? ' active' : '')} onClick={() => setSelectedField(f.id)}>

            <div className="inspector-empty">필드를 선택하면<br />매핑 대상과 신뢰도를 확인할 수 있습니다</div>

            <React.Fragment>
              <div className="map-row">
                <label>추출 필드</label>
                <div style={{ fontSize:'13px', fontWeight:600 }}>{field.label}</div>
              </div>
              <div className="map-row">
                <label>신뢰도</label>
                <ConfBar value={field.confidence} />

              </div>
              <div className="map-row">
                <label>기존 CDSS 매핑 대상</label>

                  {MAPPING_TARGETS.map(t => <option key={t} value={t}>{t || '— 매핑 대상 선택 —'}</option>)}
                </select>
              </div>
              <div className="confirm-strip">
                <button className="btn btn-primary btn-sm" style={{ flex:1, justifyContent:'center' }} onClick={() => onConfirmField(doc.id, field.id)}>
                  <Icon name="check" /> 검증 완료

              </div>
            </React.Fragment>

            <div className="ws-panel-title" style={{ marginBottom:'10px' }}>처리 이력</div>
            <div className="mini-log-item"><Icon name="sparkle" /> GPT-4o Vision 추출 완료 · 09-10 09:14</div>
            <div className="mini-log-item"><Icon name="pencil-simple" /> 이지현 선생님 CRP 값 수정 · 09-10 10:02</div>

              <Icon name="check-circle" /> 전체 확정 및 CDSS 반영
            </button>
          )}
        </div>
      </div>
    </div>
    </React.Fragment>
  );
}

function VerifyScreen({ docs, openDrawer }) {
  const pending = docs.filter(d => d.status === '검증대기');
  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">Split View 검증 및 수정</div>
          <div className="page-sub">원본과 추출 데이터를 대조하여 확정 대기 중인 문서 큐입니다</div>
        </div>
      </div>
      <div className="filter-bar">
        <div className="search-box"><Icon name="magnifying-glass" /><input placeholder="환자명 또는 문서명 검색" /></div>
        <div className="select-chip"><Icon name="funnel" /> 신뢰도 낮은 순</div>
        <div className="select-chip"><Icon name="calendar" /> 최근 7일</div>
      </div>
      <div className="card table-wrap">
        <table>
          <thead><tr><th>문서명</th><th>환자</th><th>필드 수</th><th>평균 신뢰도</th><th>대기 시간</th><th></th></tr></thead>
          <tbody>
            {pending.length === 0 && <tr><td colSpan="6" style={{ textAlign:'center', color:'var(--n6)', padding:'30px' }}>검증 대기 문서가 없습니다</td></tr>}
            {pending.map(d => {
              const avg = Math.round(d.fields.reduce((s,f) => s+f.confidence,0) / d.fields.length);
              return (
                <tr key={d.id} onClick={() => openDrawer(d)}>
                  <td>{d.name}</td>
                  <td>{d.patient}</td>
                  <td>{d.fields.length}개</td>
                  <td><ConfBar value={avg} /></td>
                  <td>2시간 전</td>
                  <td><button className="btn btn-ghost btn-sm" onClick={(e) => { e.stopPropagation(); openDrawer(d); }}>검증하기</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MappingScreen({ pushToast }) {
  const [rules, setRules] = useState([
    { id:'r1', src:'검사일자', target:'환자 기본정보 > 검사일' },
    { id:'r2', src:'WBC(백혈구)', target:'검사결과 > 혈액 > WBC' },
    { id:'r3', src:'CRP', target:'검사결과 > 염증수치 > CRP' },
    { id:'r4', src:'검사기관', target:'' },
    { id:'r5', src:'검출균주', target:'검사결과 > 배양 > 균주명' },
    { id:'r6', src:'감수성 항생제', target:'처방정보 > 권장 항생제' },
  ]);
  const [editing, setEditing] = useState(null);
  const [exporting, setExporting] = useState(false);

  const save = (target) => {
    setRules(rs => rs.map(r => r.id === editing.id ? { ...r, target } : r));
    setEditing(null);
    pushToast('매핑 규칙이 저장되었습니다');
  };

  const runExport = () => {
    setExporting(true);
    setTimeout(() => { setExporting(false); pushToast('CDSS 입력 형식으로 내보내기가 완료되었습니다'); }, 1400);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">확정 데이터 매핑</div>
          <div className="page-sub">검증 완료된 데이터를 기존 CDSS 입력 항목으로 변환하는 매핑 규칙입니다</div>
        </div>
        <button className="btn btn-primary" onClick={runExport} disabled={exporting}>
          {exporting ? <React.Fragment><Icon name="circle-notch" /> 내보내는 중…</React.Fragment> : <React.Fragment><Icon name="export" /> JSON/CSV 내보내기</React.Fragment>}
        </button>
      </div>
      <div className="card" style={{ padding:'8px 20px' }}>
        <div className="rule-row" style={{ borderBottom:'2px solid var(--n4)' }}>
          <span style={{ fontSize:'11.5px', color:'var(--n6)', fontWeight:700 }}>추출 항목명</span>
          <span></span>
          <span style={{ fontSize:'11.5px', color:'var(--n6)', fontWeight:700 }}>CDSS 매핑 대상</span>
          <span></span>
        </div>
        {rules.map(r => (
          <div key={r.id} className="rule-row">
            <span className="rule-field">{r.src}</span>
            <Icon name="arrow-right" style={{ color:'var(--n5)' }} />
            <span className={"rule-target" + (!r.target ? ' unmapped' : '')}>{r.target || '매핑 필요'}</span>
            <button className="btn btn-ghost btn-sm" onClick={() => setEditing(r)}>재매핑</button>
          </div>
        ))}
      </div>

      {editing && (
        <div className="overlay" onClick={() => setEditing(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <h3>매핑 대상 재지정</h3>
              <button className="close-btn" onClick={() => setEditing(null)}><Icon name="x" /></button>
            </div>
            <div className="form-field">
              <label>추출 항목명</label>
              <input defaultValue={editing.src} disabled />
            </div>
            <div className="form-field">
              <label>CDSS 매핑 대상</label>
              <select id="mapTargetSelect" defaultValue={editing.target}>
                {MAPPING_TARGETS.map(t => <option key={t} value={t}>{t || '— 선택 —'}</option>)}
              </select>
            </div>
            <div style={{ display:'flex', gap:'10px', marginTop:'20px' }}>
              <button className="btn btn-ghost" style={{ flex:1, justifyContent:'center' }} onClick={() => setEditing(null)}>취소</button>
              <button className="btn btn-primary" style={{ flex:1, justifyContent:'center' }} onClick={() => save(document.getElementById('mapTargetSelect').value)}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          <div className="setting-row">
            <div><div className="lbl">주간 처리 리포트</div><div className="desc">매주 월요일 요약 메일 발송</div></div>
            <button className={"switch" + (toggles.weeklyReport ? ' on' : '')} onClick={() => { toggle('weeklyReport'); pushToast('주간 리포트 설정이 변경되었습니다'); }}><span className="switch-knob"></span></button>
          </div>
        </div>

        <div className="card settings-card">
          <h3>스토리지 보관 정책</h3>
          <p>임시 업로드 파일의 보관 기간입니다</p>
          <div className="form-field"><label>보관 기간</label>
            <select defaultValue="14" onChange={() => pushToast('보관 기간이 변경되었습니다')}>
              <option value="7">7일 후 자동 삭제</option>
              <option value="14">14일 후 자동 삭제</option>
              <option value="30">30일 후 자동 삭제</option>
            </select>
          </div>
        </div>

        <div className="card settings-card">
          <h3>계정</h3>
          <p>내 계정 정보입니다</p>
          <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'14px' }}>
            <div className="avatar" style={{ width:'44px', height:'44px', fontSize:'16px' }}>이</div>
            <div>
              <div style={{ fontWeight:600, fontSize:'13.5px' }}>이지현 선생님</div>
              <div style={{ fontSize:'12px', color:'var(--n6)' }}>감염내과 · 검증 의료진</div>
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={() => pushToast('프로필 편집 화면은 준비 중입니다')}><Icon name="pencil-simple" /> 프로필 편집</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [docs, setDocs] = useState(INITIAL_DOCS);
  const [selectedId, setSelectedId] = useState('d1');
  const [selectedField, setSelectedField] = useState(null);
  const [drawerDoc, setDrawerDoc] = useState(null);
  const [detailDoc, setDetailDoc] = useState(null);
  const [toasts, setToasts] = useState([]);

  const pushToast = (msg) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };

  const onUpload = () => {
    const id = 'd' + (docs.length + 1) + Math.floor(Math.random()*99);
    const newDoc = { id, name:'신규_검사지_' + (docs.length+1) + '.pdf', patient:'신규 환자', uploadedAt:'방금 전', status:'대기', fields:[] };
    setDocs(d => [newDoc, ...d]);
    pushToast('검사지가 업로드되었습니다 — 처리 대기열에 추가됨');
    setTimeout(() => {
      setDocs(d => d.map(x => x.id === id ? { ...x, status:'추출중' } : x));
    }, 1300);
  };

  const onRetry = (id) => {
    setDocs(d => d.map(x => x.id === id ? { ...x, status:'추출중' } : x));
    pushToast('AI 추출을 다시 시작합니다');
  };

  const onConfirmField = (docId, fieldId) => {
    pushToast('필드가 검증 완료로 표시되었습니다');
  };

  const onMapField = () => {};

  const onFinalizeDoc = (docId) => {
    setDocs(d => d.map(x => x.id === docId ? { ...x, status:'확정완료' } : x));
    pushToast('문서가 확정되어 CDSS 입력 항목에 반영되었습니다');
  };

  const titleMap = {
    main:'문서 업로드 및 처리 현황', extraction:'AI 자동 데이터 추출',
    verify:'Split View 검증 및 수정', mapping:'확정 데이터 매핑', settings:'시스템 설정',
  };

  return (
    <div className="app-shell" data-archetype="editor-canvas-sidebar">
      <Sidebar screen={screen} setScreen={setScreen} />
      <div className="main-wrap">
        <div className="topbar">
          <div className="topbar-title">{titleMap[screen]}</div>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={() => pushToast('검색 팔레트가 열렸습니다')}><Icon name="magnifying-glass" /></button>
            <button className="icon-btn" onClick={() => pushToast('새 알림이 없습니다')}><Icon name="bell" /></button>
            <div className="avatar">이</div>
          </div>
        </div>
        <div className="content-pad">
          {screen === 'main' && (
            <WorkspaceScreen
              docs={docs} selectedId={selectedId} setSelectedId={setSelectedId}
              selectedField={selectedField} setSelectedField={setSelectedField}
              onConfirmField={onConfirmField} onMapField={onMapField} onFinalizeDoc={onFinalizeDoc}
              onUpload={onUpload} pushToast={pushToast}
            />
          )}
          {screen === 'extraction' && <ExtractionScreen docs={docs} onRetry={onRetry} openDetail={setDetailDoc} />}
          {screen === 'verify' && <VerifyScreen docs={docs} openDrawer={setDrawerDoc} />}
          {screen === 'mapping' && <MappingScreen pushToast={pushToast} />}
          {screen === 'settings' && <SettingsScreen pushToast={pushToast} />}
        </div>
      </div>

      {detailDoc && (
        <div className="overlay" onClick={() => setDetailDoc(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <h3>{detailDoc.name}</h3>
              <button className="close-btn" onClick={() => setDetailDoc(null)}><Icon name="x" /></button>
            </div>
            <div className="badge badge-n" style={{ marginBottom:'14px' }}>{detailDoc.patient}</div>
            {detailDoc.fields.length === 0 ? (
              <div className="inspector-empty">아직 추출된 필드가 없습니다</div>
            ) : detailDoc.fields.map(f => (
              <div key={f.id} className="field-row">
                <div className="field-top"><span className="field-label">{f.label}</span><ConfBar value={f.confidence} /></div>
                <div style={{ fontSize:'13px', color:'var(--n9)' }}>{f.value || '값 없음'}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {drawerDoc && (
        <React.Fragment>
          <div className="drawer-overlay" onClick={() => setDrawerDoc(null)}></div>
          <div className="drawer">
            <div className="modal-head">
              <h3>{drawerDoc.name}</h3>
              <button className="close-btn" onClick={() => setDrawerDoc(null)}><Icon name="x" /></button>
            </div>
            <div className="badge badge-n" style={{ marginBottom:'16px' }}>{drawerDoc.patient} · {drawerDoc.uploadedAt}</div>
            {drawerDoc.fields.map(f => (
              <div key={f.id} className="field-row">
                <div className="field-top"><span className="field-label">{f.label}</span><ConfBar value={f.confidence} /></div>
                <input className="field-value-input" defaultValue={f.value} />
              </div>
            ))}
            <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center', marginTop:'18px' }}
              onClick={() => { setDocs(d => d.map(x => x.id === drawerDoc.id ? { ...x, status:'확정완료' } : x)); setDrawerDoc(null); pushToast('검증이 완료되어 확정 처리되었습니다'); }}>
              <Icon name="check-circle" /> 검증 완료 및 확정
            </button>
          </div>
        </React.Fragment>
      )}

      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className="toast"><Icon name="check-circle" />{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
