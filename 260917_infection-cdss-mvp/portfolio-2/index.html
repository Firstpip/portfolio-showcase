<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클리니컬리드 옵스 — 다중 의료진 검증 관제 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 249°, dark) ── */
:root{
  --m50:#eeeef1; --m100:#eeeef1; --m200:#eeeef1; --m300:#dedde3; --m400:#bcbac8;
  --m500:#9390a6; --m600:#666281; --m700:#3b355d; --m800:#10093a; --m900:#0d0730;
  --n0:#1e1e20; --n1:#36363a; --n2:#54535a; --n3:#72717a; --n4:#919098;
  --n5:#a8a6b7; --n6:#d5d5d7; --n7:#e5e5e6; --n8:#efeff0; --n9:#f4f0ff; --n10:#fcfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
  --accent-violet:#9382ff;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n8);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.55;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit;}
input, select, textarea{font-family:inherit; font-size:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n2); border-radius:8px;}

.app-root{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* ── 시그니처 1: 상단 글로벌 내비 ── */
.app-header{
  position:sticky; top:0; z-index:40; height:64px; width:100%;
  display:flex; align-items:center; gap:28px; padding:0 28px;
  background:var(--n1); border-bottom:1px solid var(--n2);
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--m800); box-shadow:inset 0 0 12px rgba(147,130,255,.35); display:flex; align-items:center; justify-content:center; color:var(--accent-violet); font-size:16px;}
.brand-name{font-size:15px; font-weight:700; color:var(--n9);}
.project-switcher{
  display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:9999px;
  background:var(--n0); border:1px solid var(--n2); font-size:12.5px; color:var(--n6); flex-shrink:0;
}
.global-nav{display:flex; align-items:center; gap:4px; flex:1;}
.nav-link{
  padding:9px 14px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--n5);
  border-bottom:2px solid transparent; transition:color .15s, background .15s;
}
.nav-link:hover{color:var(--n8); background:var(--n0);}
.nav-link.active{color:var(--n9); font-weight:600; background:var(--m800); box-shadow:inset 0 0 16px rgba(147,130,255,.18);}
.header-actions{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.icon-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--n5); transition:background .15s, color .15s;}
.icon-btn:hover{background:var(--n0); color:var(--n8);}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;}

/* ── 시그니처 2: 보조 탭 행 ── */
.tab-bar{display:flex; gap:4px; padding:0 28px; background:var(--n0); border-bottom:1px solid var(--n1); max-width:1280px; margin:0 auto; width:100%;}
.tab{
  padding:13px 6px; margin-right:22px; font-size:13.5px; font-weight:500; color:var(--n5);
  border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
}
.tab:hover{color:var(--n8);}
.tab.active{color:var(--n9); border-color:var(--accent-violet); font-weight:600;}

/* ── 시그니처 3: 전체 폭 콘텐츠 ── */
.content{max-width:1280px; margin:0 auto; width:100%; padding:28px; flex:1;}
.hero-band{
  border-radius:16px; padding:24px 28px; margin-bottom:20px; color:var(--n10); position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--m700) 0%, var(--m900) 100%);
  box-shadow:inset 0 0 30px rgba(255,255,255,.05);
}
.hero-band-row{display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; z-index:1;}
.hero-band h2{font-size:22px; font-weight:700; margin-bottom:6px;}
.hero-band p{font-size:13px; opacity:.75;}
.hero-band-stat{font-size:32px; font-weight:800; letter-spacing:-0.5px;}
.hero-band-stat-label{font-size:11.5px; opacity:.7; margin-top:2px;}
.hero-band-orbit{position:absolute; right:-30px; top:-50px; width:220px; height:220px; opacity:.5;}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px;}
.page-title{font-size:22px; font-weight:700; color:var(--n9);}
.page-sub{font-size:13px; color:var(--n5); margin-top:4px;}
.hero-num{font-size:38px; font-weight:800; color:var(--n9); letter-spacing:-0.5px;}

.card{background:var(--n1); border:1px solid var(--n2); border-radius:16px; box-shadow:inset 0 0 24px rgba(255,255,255,.03);}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
.stat-card{padding:18px 20px;}
.stat-card .lbl{font-size:12px; color:var(--n5); font-weight:600; margin-bottom:9px; display:flex; align-items:center; justify-content:space-between;}
.stat-card .val{font-size:28px; font-weight:700; color:var(--n9);}
.stat-delta{font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:3px;}
.stat-delta.up{color:var(--s1-text);}
.stat-delta.down{color:var(--s2-text);}

.hero-viz{padding:22px 24px 10px; margin-bottom:16px;}
.hero-viz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.hero-viz-title{font-size:14px; font-weight:700; color:var(--n8);}
.chart-wrap{height:260px; width:100%; margin-top:6px;}

.widget-grid{display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:14px;}
.widget-card{padding:20px;}
.widget-title{font-size:12.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; margin-bottom:14px;}
.donut-wrap{height:180px; display:flex; align-items:center; justify-content:center;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--n6); margin-top:6px;}
.legend-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.timeline-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--n0);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0; background:var(--n4);}
.timeline-dot.live{background:var(--accent-violet); animation:pulseGlow 1.5s ease-in-out infinite;}
.timeline-text{font-size:12.5px; color:var(--n7);}
.timeline-time{font-size:11px; color:var(--n4); margin-top:2px;}

.filter-bar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.select-chip{border:1px solid var(--n2); background:var(--n1); border-radius:9999px; padding:8px 14px; font-size:12.5px; color:var(--n6); display:flex; align-items:center; gap:6px;}
.select-chip:hover{border-color:var(--n3);}
.search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--n2); border-radius:9999px; padding:8px 14px; background:var(--n1); flex:1; max-width:280px;}
.search-box input{border:none; outline:none; flex:1; background:transparent; color:var(--n8);}
.search-box input::placeholder{color:var(--n4);}

.btn{border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:600; transition:transform .12s, box-shadow .15s, background .15s; display:inline-flex; align-items:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m500); color:var(--n10);}
.btn-primary:hover{background:#7a76a0; box-shadow:0 0 0 3px rgba(147,130,255,.16);}
.btn-ghost{background:transparent; color:var(--n6); border:1px solid var(--n2);}
.btn-ghost:hover{border-color:var(--n3); color:var(--n8);}
.btn-sm{padding:6px 13px; font-size:12px; border-radius:9999px;}
.btn-danger-ghost{background:var(--s2-bg); color:var(--s2-text);}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11.5px; color:var(--n5); font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:12px 16px; border-bottom:1px solid var(--n2);}
tbody td{padding:13px 16px; border-bottom:1px solid var(--n1); color:var(--n7);}
tbody tr{transition:background .12s; cursor:pointer;}
tbody tr:hover{background:var(--n0);}
tbody tr:last-child td{border-bottom:none;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:9999px;}
.badge-n{background:var(--n2); color:var(--n6);}
.badge-s1{background:var(--s1-bg); color:var(--s1-text);}
.badge-s2{background:var(--s2-bg); color:var(--s2-text);}
.badge-s3{background:var(--s3-bg); color:var(--s3-text);}
.conf-track{width:70px; height:5px; border-radius:4px; background:var(--n2); overflow:hidden;}
.conf-fill{height:100%; border-radius:4px; animation:growBar .6s ease both;}

.timeline-panel{display:flex; flex-direction:column; gap:0;}
.audit-entry{padding:16px 0; border-bottom:1px solid var(--n1); display:flex; gap:14px;}
.audit-entry:last-child{border-bottom:none;}
.audit-icon{width:34px; height:34px; border-radius:10px; background:var(--n0); display:flex; align-items:center; justify-content:center; color:var(--n5); flex-shrink:0;}
.audit-body{flex:1;}
.audit-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.audit-title{font-size:13px; font-weight:600; color:var(--n8);}
.audit-time{font-size:11.5px; color:var(--n4);}
.audit-diff{display:flex; gap:10px; margin-top:8px; font-size:12px;}
.diff-box{flex:1; padding:8px 10px; border-radius:8px; background:var(--n0);}
.diff-box .k{font-size:10.5px; color:var(--n4); margin-bottom:3px; text-transform:uppercase;}
.diff-before{color:var(--s2-text);}
.diff-after{color:var(--s1-text);}

.role-badge{padding:4px 11px; border-radius:9999px; font-size:11.5px; font-weight:600;}
.role-admin{background:var(--m800); color:var(--n9); box-shadow:inset 0 0 10px rgba(147,130,255,.2);}
.role-verify{background:var(--n2); color:var(--n7);}
.role-view{background:var(--n0); color:var(--n5); border:1px solid var(--n2);}

/* ── modal / drawer / toast ── */
.overlay{position:fixed; inset:0; background:rgba(3,0,20,.6); display:flex; align-items:center; justify-content:center; z-index:200; animation:fadeIn .18s ease;}
.modal{background:var(--n1); border:1px solid var(--n2); border-radius:18px; width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; padding:26px; animation:fadeInScale .2s ease; box-shadow:inset 0 0 30px rgba(255,255,255,.04);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:16.5px; font-weight:700; color:var(--n9);}
.close-btn{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--n5);}
.close-btn:hover{background:var(--n0);}
.form-field{margin-bottom:14px;}
.form-field label{display:block; font-size:12.5px; font-weight:600; color:var(--n5); margin-bottom:6px;}
.form-field input, .form-field select{
  width:100%; border:1px solid var(--n2); border-radius:9px; padding:9px 11px; font-size:13px; color:var(--n8); background:var(--n0);
}

.drawer-overlay{position:fixed; inset:0; background:rgba(3,0,20,.5); z-index:200; animation:fadeIn .18s ease;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:var(--n1); z-index:210;
  border-left:1px solid var(--n2); padding:24px; overflow-y:auto; animation:slideInRight .25s ease;
}

.toast-stack{position:fixed; bottom:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--n1); border:1px solid var(--n2); color:var(--n8); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:9px; box-shadow:inset 0 0 20px rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.4); animation:toastIn .25s ease;
}
.toast i{color:var(--accent-violet); font-size:16px;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
@keyframes fadeInUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInRight{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastIn{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(147,130,255,.55);} 50%{box-shadow:0 0 0 6px rgba(147,130,255,0);}}
@keyframes growBar{from{width:0;}}

@media (max-width: 1100px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .widget-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

function ConfBar({ value }) {
  const color = value >= 90 ? 'var(--s1)' : value < 80 ? 'var(--s2)' : 'var(--m400)';
  return <div className="conf-track"><div className="conf-fill" style={{ width: value + '%', background: color }}></div></div>;
}

function Header({ page, setPage, pushToast }) {
  const links = [
    { key:'main', label:'통합 관제 대시보드' },
    { key:'accuracy', label:'추출 정확도 분석' },
    { key:'audit', label:'검증 이력 및 감사 로그' },

  return (
    <header className="app-header">
      <div className="brand">
        <div className="brand-mark"><Icon name="stethoscope" /></div>

            </div>
            <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center', marginTop:'12px' }}
              onClick={() => { pushToast(assignDoc.name + ' 담당자가 지정되었습니다'); setAssignDoc(null); }}>
              <Icon name="check" /> 지정 완료
            </button>
          </div>
        </React.Fragment>
      )}

      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className="toast"><Icon name="bell-ringing" />{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
