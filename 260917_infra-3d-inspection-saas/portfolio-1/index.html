<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인프라 점검 데이터 업로드 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 23°, light) ── */
:root{
  --m50:#faf4f1; --m100:#f4e9e3; --m200:#e9d4c6; --m300:#dcbaa4; --m400:#ce9c7d;
  --m500:#c08159; --m600:#b26534; --m700:#92532b; --m800:#724121; --m900:#502d17;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#777b86; --n8:#5a5653; --n9:#3a3836; --n10:#17191c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --radius-card:24px; --radius-el:20px; --radius-input:16px; --radius-btn:9999px; --radius-sm:10px;
  --shadow-float: 0 0 0 1px rgba(32,30,30,0.05), 0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
.serif{font-family:'Noto Serif KR',serif;font-weight:400;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInPanel{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes fillBar{from{width:0%;}}
@keyframes staggerIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.app-shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:264px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:20;}
.sidebar-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--n3);flex-shrink:0;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
.brand-name{font-size:14.5px;font-weight:600;color:var(--n10);line-height:1.2;}
.brand-sub{font-size:11px;color:var(--n7);}
.sidebar-cmdk-hint{margin:14px 16px 4px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--n0);border:1px solid var(--n3);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--n7);}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;border-radius:5px;background:var(--n2);border:1px solid var(--n4);font-size:11px;color:var(--n8);}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;line-height:1.35;color:var(--n8);text-align:left;transition:background .12s ease,color .12s ease;position:relative;width:100%;}
.sidebar-link:hover{background:var(--n2);color:var(--n10);}
.sidebar-link.active{background:var(--m50);color:var(--m700);font-weight:600;}
.sidebar-link.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--m600);}
.sidebar-link .ic{flex-shrink:0;stroke-width:1.6;}
.sidebar-section-title{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--n6);text-transform:uppercase;padding:14px 12px 6px;}
.sidebar-user{border-top:1px solid var(--n3);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0;}
.user-meta{line-height:1.25;overflow:hidden;}
.user-name{font-size:13px;font-weight:600;color:var(--n10);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:var(--n7);}

.main-wrap{margin-left:264px;flex:1;min-width:0;width:calc(100% - 264px);display:flex;flex-direction:column;min-height:100vh;background:var(--n0);}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--n3);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);z-index:10;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n6);}
.breadcrumb .current{color:var(--n10);font-weight:600;}
.breadcrumb .divider{color:var(--n4);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;padding:9px 18px;border-radius:var(--radius-btn);white-space:nowrap;transition:transform .12s ease,background .12s ease,box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600);color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{background:var(--n4);color:var(--n6);cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--n4);color:var(--n9);}
.btn-ghost:hover{border-color:var(--n6);background:var(--n1);}
.btn-cmdk{background:var(--n1);border:1px solid var(--n3);color:var(--n7);font-size:12.5px;padding:7px 12px;border-radius:var(--radius-sm);}
.btn-cmdk:hover{background:var(--n2);}
.btn-sm{font-size:12.5px;padding:6px 13px;}

.content{padding:28px 32px 60px;width:100%;flex:1;}

.master-detail{display:grid;grid-template-columns:376px 1fr;gap:24px;align-items:start;}
.list-rail{background:var(--n0);}
.rail-head{margin-bottom:18px;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--n7);text-transform:uppercase;}
.serif-h1{font-size:34px;line-height:1.25;letter-spacing:-.01em;margin:6px 0 6px;color:var(--n10);}
.rail-sub{font-size:13.5px;color:var(--n7);line-height:1.5;}
.hero-title{font-size:clamp(28px, 3.4vw, 46px);}
.rail-search{display:flex;align-items:center;gap:8px;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-input);padding:10px 14px;margin:16px 0 12px;}
.rail-search input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;color:var(--n9);}
.rail-search input::placeholder{color:var(--n6);}
.rail-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{font-size:12px;padding:6px 12px;border-radius:var(--radius-btn);border:1px solid var(--n3);color:var(--n7);background:var(--n0);display:flex;align-items:center;gap:5px;}
.chip.active{background:var(--m50);border-color:var(--m300);color:var(--m700);font-weight:600;}
.chip-count{font-size:10.5px;color:var(--n6);}
.chip.active .chip-count{color:var(--m600);}
.rail-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 320px);overflow-y:auto;padding-right:2px;}
.rail-item{width:100%;text-align:left;padding:13px 14px;border-radius:var(--radius-el);border:1px solid var(--n3);background:var(--n0);animation:staggerIn .32s ease both;}
.rail-item:hover{border-color:var(--n5);}
.rail-item.active{background:var(--m50);border-color:var(--m600);}
.rail-item-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.rail-item-top .ic{color:var(--n6);flex-shrink:0;}
.rail-item.active .rail-item-top .ic{color:var(--m700);}
.rail-item-name{flex:1;font-size:13.5px;font-weight:600;color:var(--n10);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-item-meta{display:flex;gap:10px;font-size:11.5px;color:var(--n6);padding-left:24px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:var(--radius-btn);flex-shrink:0;}
.badge-neutral{background:var(--n2);color:var(--n7);}
.badge-success{background:var(--s1-bg);color:var(--s1-text);}
.badge-danger{background:var(--s2-bg);color:var(--s2-text);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-dot.pulsing{animation:pulseDot 1.6s ease-in-out infinite;}

.detail-panel{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);box-shadow:var(--shadow-float);padding:28px;animation:slideInPanel .28s ease both;min-height:520px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--n3);margin-bottom:20px;}
.detail-title{font-size:22px;font-weight:600;color:var(--n10);margin-bottom:6px;}
.detail-sub{font-size:12.5px;color:var(--n7);display:flex;gap:12px;flex-wrap:wrap;}
.detail-sub span{display:flex;align-items:center;gap:5px;}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-tile{background:var(--n1);border-radius:var(--radius-el);padding:14px 16px;}
.stat-tile .ic{color:var(--n6);margin-bottom:8px;}
.stat-num{font-size:15px;font-weight:700;color:var(--n10);}
.stat-label{font-size:11px;color:var(--n7);margin-top:2px;}
.section-title{font-size:13px;font-weight:700;color:var(--n9);margin:22px 0 10px;display:flex;align-items:center;gap:7px;}
.file-list{display:flex;flex-direction:column;gap:7px;}
.file-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--n1);border-radius:var(--radius-sm);font-size:12.5px;}
.file-row .ic{color:var(--n7);flex-shrink:0;}
.file-name{flex:1;color:var(--n9);font-weight:500;}
.file-meta{color:var(--n6);font-size:11.5px;}
.check-list{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--n8);}
.check-item .ic-ok{color:var(--s1);flex-shrink:0;}
.check-item .ic-pending{color:var(--n5);flex-shrink:0;}
.detail-actions{display:flex;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--n3);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:460px;color:var(--n6);gap:10px;}

.cmdk-overlay{position:fixed;inset:0;background:rgba(32,30,30,.42);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100;animation:fadeUp .16s ease both;}
.cmdk-modal{width:560px;max-width:92vw;background:var(--n0);border-radius:var(--radius-card);box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden;border:1px solid var(--n3);}
.cmdk-input-row{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--n3);}
.cmdk-input{flex:1;border:none;outline:none;font-size:15px;color:var(--n10);}
.cmdk-input::placeholder{color:var(--n6);}
.cmdk-results{max-height:340px;overflow-y:auto;padding:8px;}
.cmdk-group-title{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--n6);text-transform:uppercase;padding:10px 12px 6px;}
.cmdk-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--n9);}
.cmdk-item:hover{background:var(--m50);color:var(--m700);}
.cmdk-item .kbd{margin-left:auto;}

.toast-host{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--n10);color:#fff;padding:12px 18px;border-radius:var(--radius-el);font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 12px 30px rgba(0,0,0,.28);animation:toastIn .22s ease both;}
.toast .ic{color:var(--s1);flex-shrink:0;}

.wizard-wrap{max-width:920px;margin:0 auto;}
.wizard-steps{display:flex;align-items:center;gap:4px;margin-bottom:30px;flex-wrap:wrap;}
.wizard-step-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--n6);padding:6px 10px 6px 6px;border-radius:var(--radius-btn);}
.wizard-step-pill.done{color:var(--s1);}
.wizard-step-pill.current{background:var(--m50);color:var(--m700);font-weight:700;}
.wizard-step-num{width:20px;height:20px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;}
.wizard-step-pill.done .wizard-step-num{background:var(--s1);color:#fff;}
.wizard-step-pill.current .wizard-step-num{background:var(--m600);color:#fff;}
.wizard-step-sep{width:16px;height:1px;background:var(--n4);flex-shrink:0;}
.wizard-card{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);box-shadow:var(--shadow-float);padding:36px;animation:fadeUp .25s ease both;}
.wizard-card-title{font-size:20px;font-weight:600;color:var(--n10);margin-bottom:6px;}
.wizard-card-desc{font-size:13px;color:var(--n7);margin-bottom:26px;line-height:1.55;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12.5px;font-weight:600;color:var(--n8);}
.form-field input, .form-field select, .form-field textarea{border:1px solid var(--n3);border-radius:var(--radius-input);padding:11px 14px;font-size:13.5px;color:var(--n9);outline:none;background:var(--n0);width:100%;}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{border-color:var(--m500);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--n1);border-radius:var(--radius-el);padding:14px 16px;}
.toggle-row-label{font-size:13px;font-weight:600;color:var(--n9);}
.toggle-row-desc{font-size:11.5px;color:var(--n7);margin-top:2px;}
.switch{width:40px;height:23px;border-radius:20px;background:var(--n4);position:relative;flex-shrink:0;transition:background .15s ease;}
.switch.on{background:var(--m600);}
.switch-knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on .switch-knob{transform:translateX(17px);}

.dropzone{border:1.5px dashed var(--n4);border-radius:var(--radius-el);padding:38px 24px;text-align:center;background:var(--n1);}
.dropzone .ic-big{color:var(--n6);margin-bottom:12px;}
.dropzone-title{font-size:14px;font-weight:600;color:var(--n9);margin-bottom:4px;}
.dropzone-desc{font-size:12px;color:var(--n7);margin-bottom:16px;}
.upload-result{display:flex;align-items:center;gap:12px;background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-el);padding:14px 16px;margin-top:14px;}
.upload-result .ic{color:var(--s1);flex-shrink:0;}
.progress-track{flex:1;height:6px;background:var(--n3);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--m600);border-radius:6px;animation:fillBar .3s ease-out;}
.upload-file-name{font-size:12.5px;font-weight:600;color:var(--n9);}
.upload-file-meta{font-size:11px;color:var(--n7);}

.validation-note{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:var(--radius-sm);font-size:12px;margin-top:14px;}
.validation-note.ok{background:var(--s1-bg);color:var(--s1-text);}
.validation-note.error{background:var(--s2-bg);color:var(--s2-text);}
.validation-note .ic{flex-shrink:0;margin-top:1px;}
.demo-toggle{font-size:11px;color:var(--n6);text-decoration:underline;margin-top:10px;display:inline-block;background:none;border:none;}

.wizard-footer{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}
.review-summary{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--n1);border-radius:var(--radius-sm);font-size:12.5px;}
.review-row .review-label{color:var(--n7);}
.review-row .review-val{color:var(--n9);font-weight:600;}

.result-layout{display:grid;grid-template-columns:300px 1fr;gap:24px;}
.result-list{display:flex;flex-direction:column;gap:8px;}
.result-item{width:100%;text-align:left;padding:12px 13px;border-radius:var(--radius-el);border:1px solid var(--n3);background:var(--n0);}
.result-item.active{border-color:var(--m600);background:var(--m50);}
.result-item-name{font-size:13px;font-weight:600;color:var(--n10);margin-bottom:4px;}
.viewer-card{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);box-shadow:var(--shadow-float);overflow:hidden;animation:slideInPanel .26s ease both;}
.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--n3);}
.viewer-frame-wrap{background:var(--n2);padding:20px;}
.viewer-frame{width:100%;height:440px;border:1px solid var(--n3);border-radius:var(--radius-el);background:#fff;}
.viewer-meta-row{display:flex;gap:20px;padding:16px 24px;flex-wrap:wrap;}
.viewer-meta-row .m-item{font-size:12px;color:var(--n7);display:flex;align-items:center;gap:6px;}

.pg-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:54px 24px 40px;background:var(--n1);border-radius:var(--radius-card);}
.pg-icon-ring{width:64px;height:64px;border-radius:50%;background:var(--n0);border:1px solid var(--n3);display:flex;align-items:center;justify-content:center;color:var(--n7);margin-bottom:18px;}
.pg-contact-card{display:flex;align-items:center;gap:14px;background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-el);padding:16px 20px;margin-top:22px;}
.pg-form-card{max-width:640px;margin:32px auto 0;background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);padding:30px;}
.pg-inquiry-list{max-width:640px;margin:22px auto 0;display:flex;flex-direction:column;gap:8px;}
.pg-inquiry-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--n1);border-radius:var(--radius-sm);font-size:12.5px;animation:staggerIn .3s ease both;}

@media (max-width:1180px){
  .master-detail{grid-template-columns:1fr;}
  .result-layout{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:480px){
  .topbar{padding:0 12px;}
  .breadcrumb{font-size:11px;gap:5px;}
  .btn-cmdk{display:none;}
  .content{padding:20px 14px 40px;}
  .detail-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function Ic({name, size=16, className='', style={}}) {
  return <i data-lucide={name} className={'ic ' + className} style={{width:size,height:size,display:'inline-block',...style}}></i>;

const WIZARD_STEPS = ['점검 정보','점군(.pcd)','궤적(.txt)','RGB 이미지','Depth 이미지','캘리브레이션','확인 및 제출'];

function UploadWizardScreen({onSubmitted}) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({structureName:'', structureType:'교량', inspectDate:'2026-09-17', part:'', depthOption:true, memo:''});
  const [pcd, setPcd] = useState(null);
  const [poses, setPoses] = useState(null);
  const [rgbCount, setRgbCount] = useState(0);
  const [depthCount, setDepthCount] = useState(0);
  const [calib, setCalib] = useState(null);
  const [progress, setProgress] = useState(0);
  const [uploading, setUploading] = useState(false);
  const [mismatchDemo, setMismatchDemo] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  function simulateUpload(done) {
    setUploading(true); setProgress(0);
    let p = 0;
    const t = setInterval(() => {
      p += 20;
      setProgress(Math.min(p,100));
      if (p>=100) { clearInterval(t); setUploading(false); done(); }
    }, 140);
  }

  function selectPcd() { simulateUpload(() => setPcd({name:'화랑대교_점군_0917.pcd', size:'834MB'})); }
  function selectPoses() { simulateUpload(() => setPoses({name:'trajectory_0917.txt', size:'15MB'})); }
  function selectRgb() { simulateUpload(() => { setRgbCount(174); setDepthCount(174); }); }
  function selectDepth() { simulateUpload(() => setDepthCount(mismatchDemo ? 168 : 174)); }
  function selectCalib() { setCalib({name:'calibration_set_new', count:22}); }

  function canNext() {
    if (step===1) return form.structureName.trim().length>0 && form.part.trim().length>0;
    if (step===2) return !!pcd;
    if (step===3) return !!poses;
    if (step===4) return rgbCount>0;
    if (step===5) return !form.depthOption || depthCount>0;
    if (step===6) return !!calib;
    return true;
  }

  function submit() {
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); onSubmitted(form.structureName || '신규 점검'); }, 900);
  }

  return (
    <div className="content wizard-wrap">
      <div className="eyebrow">점검 데이터 업로드 위저드</div>
      <h2 className="serif-h1 serif" style={{fontSize:'28px', margin:'6px 0 22px'}}>7단계로 나눈 안전한 업로드 흐름</h2>
      <div className="wizard-steps">
        {WIZARD_STEPS.map((label,i) => (
          <React.Fragment key={i}>
            <div className={'wizard-step-pill ' + (i+1<step ? 'done' : i+1===step ? 'current' : '')}>
              <span className="wizard-step-num">{i+1<step ? <Ic name="check" size={11} /> : i+1}</span>
              {label}
            </div>
            {i<WIZARD_STEPS.length-1 && <div className="wizard-step-sep"></div>}
          </React.Fragment>
        ))}
      </div>
      <div className="wizard-card">
        {step===1 && (
          <React.Fragment>
            <div className="wizard-card-title">1단계 · 점검 정보</div>
            <div className="wizard-card-desc">구조물 기본 정보와 점검 범위를 입력합니다.</div>
            <div className="form-grid">
              <div className="form-field">
                <label>구조물명</label>
                <input value={form.structureName} placeholder="예: 화랑대교" onChange={e => setForm({...form, structureName:e.target.value})} />
              </div>
              <div className="form-field">
                <label>구조물 유형</label>
                <select value={form.structureType} onChange={e => setForm({...form, structureType:e.target.value})}>
                  {['교량','터널','댐','기타'].map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label>점검일</label>
                <input type="date" value={form.inspectDate} onChange={e => setForm({...form, inspectDate:e.target.value})} />
              </div>
              <div className="form-field">
                <label>점검 부위</label>
                <input value={form.part} placeholder="예: 교각 3~5번 경간 하부" onChange={e => setForm({...form, part:e.target.value})} />
              </div>
              <div className="form-field full">
                <label>메모</label>
                <textarea rows="2" value={form.memo} placeholder="현장에서 참고할 메모를 남겨주세요" onChange={e => setForm({...form, memo:e.target.value})}></textarea>
              </div>
            </div>
            <div className="toggle-row" style={{marginTop:'16px'}}>
              <div>
                <div className="toggle-row-label">치수 측정 옵션</div>
                <div className="toggle-row-desc">활성화 시 Depth 이미지 업로드가 필수가 됩니다</div>
              </div>
              <div className={'switch' + (form.depthOption ? ' on' : '')} onClick={() => setForm({...form, depthOption: !form.depthOption})}>
                <div className="switch-knob"></div>
              </div>
            </div>
          </React.Fragment>
        )}
        {step===2 && (
          <React.Fragment>
            <div className="wizard-card-title">2단계 · LiDAR 점군 업로드</div>
            <div className="wizard-card-desc">.pcd 파일 1개를 업로드합니다. 수 GB 파일은 자동으로 분할 전송됩니다.</div>
            {!pcd ? (
              <div className="dropzone">
                <Ic name="upload-cloud" size={30} className="ic-big" />
                <div className="dropzone-title">.pcd 파일을 드래그하거나 선택하세요</div>
                <div className="dropzone-desc">대용량 파일은 멀티파트로 분할 업로드됩니다</div>
                <button className="btn btn-ghost" onClick={selectPcd} disabled={uploading}>{uploading ? '업로드 중…' : '파일 선택'}</button>
              </div>
            ) : (
              <div className="upload-result">
                <Ic name="check-circle-2" />
                <div style={{flex:1}}>
                  <div className="upload-file-name">{pcd.name}</div>
                  <div className="upload-file-meta">{pcd.size} · 업로드 완료</div>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={() => setPcd(null)}>다시 선택</button>
              </div>
            )}
            {uploading && <div className="progress-track" style={{marginTop:'14px'}}><div className="progress-fill" style={{width:progress+'%'}}></div></div>}
          </React.Fragment>
        )}
        {step===3 && (
          <React.Fragment>
            <div className="wizard-card-title">3단계 · 위치 궤적 업로드</div>
            <div className="wizard-card-desc">촬영 경로의 위치 궤적(Poses) .txt 파일 1개를 업로드합니다.</div>
            {!poses ? (
              <div className="dropzone">
                <Ic name="route" size={30} className="ic-big" />
                <div className="dropzone-title">.txt 궤적 파일을 선택하세요</div>
                <div className="dropzone-desc">poses.txt 형식의 좌표 시퀀스 파일</div>
                <button className="btn btn-ghost" onClick={selectPoses} disabled={uploading}>{uploading ? '업로드 중…' : '파일 선택'}</button>
              </div>
            ) : (
              <div className="upload-result">
                <Ic name="check-circle-2" />
                <div style={{flex:1}}>
                  <div className="upload-file-name">{poses.name}</div>
                  <div className="upload-file-meta">{poses.size} · 업로드 완료</div>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={() => setPoses(null)}>다시 선택</button>
              </div>
            )}
            {uploading && <div className="progress-track" style={{marginTop:'14px'}}><div className="progress-fill" style={{width:progress+'%'}}></div></div>}
          </React.Fragment>
        )}
        {step===4 && (
          <React.Fragment>
            <div className="wizard-card-title">4단계 · RGB 이미지 폴더</div>
            <div className="wizard-card-desc">png · jpg · jpeg 형식의 RGB 이미지 폴더를 통째로 업로드합니다.</div>
            {rgbCount===0 ? (
              <div className="dropzone">
                <Ic name="image" size={30} className="ic-big" />
                <div className="dropzone-title">RGB 이미지 폴더를 선택하세요</div>
                <div className="dropzone-desc">폴더 단위 다중 업로드 지원</div>
                <button className="btn btn-ghost" onClick={selectRgb} disabled={uploading}>{uploading ? '업로드 중…' : '폴더 선택'}</button>
              </div>
            ) : (
              <div className="upload-result">
                <Ic name="check-circle-2" />
                <div style={{flex:1}}>
                  <div className="upload-file-name">RGB 이미지 {rgbCount}장</div>
                  <div className="upload-file-meta">업로드 완료</div>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={() => setRgbCount(0)}>다시 선택</button>
              </div>
            )}
            {uploading && <div className="progress-track" style={{marginTop:'14px'}}><div className="progress-fill" style={{width:progress+'%'}}></div></div>}
          </React.Fragment>
        )}
        {step===5 && (
          <React.Fragment>
            <div className="wizard-card-title">5단계 · Depth 이미지 폴더</div>
            <div className="wizard-card-desc">{form.depthOption ? '치수 측정 옵션이 활성화되어 Depth 이미지가 필수입니다.' : '치수 측정 옵션이 비활성화되어 있어 이 단계는 건너뛸 수 있습니다.'}</div>
            {!form.depthOption ? (
              <div className="validation-note ok"><Ic name="check-circle-2" size={15} />치수 측정을 사용하지 않으므로 Depth 업로드 없이 다음 단계로 진행할 수 있습니다.</div>
            ) : (
              <React.Fragment>
                {depthCount===0 ? (
                  <div className="dropzone">
                    <Ic name="layers" size={30} className="ic-big" />
                    <div className="dropzone-title">Depth 이미지 폴더를 선택하세요</div>
                    <div className="dropzone-desc">RGB 이미지와 장수가 일치해야 합니다 (현재 RGB {rgbCount}장)</div>
                    <button className="btn btn-ghost" onClick={selectDepth} disabled={uploading}>{uploading ? '업로드 중…' : '폴더 선택'}</button>
                  </div>
                ) : (
                  <div className="upload-result">
                    <Ic name="check-circle-2" />
                    <div style={{flex:1}}>
                      <div className="upload-file-name">Depth 이미지 {depthCount}장</div>
                      <div className="upload-file-meta">업로드 완료</div>
                    </div>
                    <button className="btn btn-ghost btn-sm" onClick={() => setDepthCount(0)}>다시 선택</button>
                  </div>
                )}
                {uploading && <div className="progress-track" style={{marginTop:'14px'}}><div className="progress-fill" style={{width:progress+'%'}}></div></div>}
                {depthCount>0 && (depthCount===rgbCount ? (
                  <div className="validation-note ok"><Ic name="check-circle-2" size={15} />RGB({rgbCount}) · Depth({depthCount}) 이미지 장수가 일치합니다.</div>
                ) : (
                  <div className="validation-note error"><Ic name="alert-triangle" size={15} />RGB({rgbCount}) · Depth({depthCount}) 장수가 일치하지 않습니다. 다시 업로드해주세요.</div>
                ))}
                {depthCount>0 && (
                  <button className="demo-toggle" onClick={() => { setMismatchDemo(!mismatchDemo); setDepthCount(!mismatchDemo ? Math.max(1,rgbCount-6) : rgbCount); }}>
                    {mismatchDemo ? '정상 예시로 되돌리기' : '불일치 검증 예시 보기'}
                  </button>
                )}
              </React.Fragment>
            )}
          </React.Fragment>
        )}
        {step===6 && (
          <React.Fragment>
            <div className="wizard-card-title">6단계 · 캘리브레이션 데이터</div>
            <div className="wizard-card-desc">카메라 · 센서 캘리브레이션 json 파일이 담긴 폴더를 업로드합니다.</div>
            {!calib ? (
              <div className="dropzone">
                <Ic name="sliders-horizontal" size={30} className="ic-big" />
                <div className="dropzone-title">캘리브레이션 폴더를 선택하세요</div>
                <div className="dropzone-desc">json 형식 파일 다중 업로드</div>
                <button className="btn btn-ghost" onClick={selectCalib}>폴더 선택</button>
              </div>
            ) : (
              <div className="upload-result">
                <Ic name="check-circle-2" />
                <div style={{flex:1}}>
                  <div className="upload-file-name">{calib.name}</div>
                  <div className="upload-file-meta">{calib.count}개 파일 · 업로드 완료</div>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={() => setCalib(null)}>다시 선택</button>
              </div>
            )}
          </React.Fragment>
        )}
        {step===7 && (
          <React.Fragment>
            <div className="wizard-card-title">7단계 · 확인 및 제출</div>
            <div className="wizard-card-desc">입력한 정보를 최종 확인한 뒤 제출하세요. 제출 즉시 접수완료 상태로 전환됩니다.</div>
            <div className="review-summary">
              <div className="review-row"><span className="review-label">구조물명</span><span className="review-val">{form.structureName || '미입력'}</span></div>
              <div className="review-row"><span className="review-label">유형 / 부위</span><span className="review-val">{form.structureType} · {form.part || '미입력'}</span></div>
              <div className="review-row"><span className="review-label">점군 · 궤적</span><span className="review-val">{pcd ? pcd.name : '-'} / {poses ? poses.name : '-'}</span></div>
              <div className="review-row"><span className="review-label">RGB / Depth</span><span className="review-val">{rgbCount}장 / {form.depthOption ? depthCount+'장' : '옵션 미사용'}</span></div>
              <div className="review-row"><span className="review-label">캘리브레이션</span><span className="review-val">{calib ? calib.name : '-'}</span></div>
            </div>
          </React.Fragment>
        )}
        <div className="wizard-footer">
          <button className="btn btn-ghost" disabled={step===1} onClick={() => setStep(step-1)}><Ic name="arrow-left" size={14} />이전</button>
          {step<7 ? (
            <button className="btn btn-primary" disabled={!canNext()} onClick={() => setStep(step+1)}>다음<Ic name="arrow-right" size={14} /></button>
          ) : (
            <button className="btn btn-primary" disabled={submitting} onClick={submit}>
              <Ic name={submitting ? 'loader-2' : 'check'} size={14} style={submitting ? {animation:'spin 0.8s linear infinite'} : {}} />
              {submitting ? '제출 중…' : '제출하기'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function ResultViewScreen({inspections, selectedId, setSelectedId, onDownload}) {
  const completed = inspections.filter(i => i.status==='분석완료');
  const selected = completed.find(i => i.id===selectedId) || completed[0];
  const reportHtml = selected ? (
    '<html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;background:#12100e;color:#f2ede8;height:100%;display:flex;flex-direction:column;}' +
    '.hd{padding:14px 20px;border-bottom:1px solid #2b2622;display:flex;justify-content:space-between;font-size:12px;color:#c9beb2;}' +
    '.wrap{flex:1;display:flex;align-items:center;justify-content:center;perspective:900px;background:radial-gradient(circle at 50% 40%,#231d18,#0c0a08 70%);position:relative;}' +
    '.grid{width:340px;height:240px;background-image:linear-gradient(#5d4a34 1px,transparent 1px),linear-gradient(90deg,#5d4a34 1px,transparent 1px);background-size:20px 20px;transform:rotateX(55deg);opacity:.85;}' +
    '.legend{position:absolute;bottom:16px;left:20px;display:flex;gap:14px;font-size:11px;color:#c9beb2;}' +
    '.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}' +
    '</style></head><body>' +
    '<div class="hd"><span>3D 외관조사망도 · ' + selected.name + '</span><span>' + selected.part + '</span></div>' +
    '<div class="wrap"><div class="grid"></div>' +
    '<div class="legend"><span><i class="dot" style="background:#4caf6f"></i>정상</span><span><i class="dot" style="background:#e0b23f"></i>경미 손상</span><span><i class="dot" style="background:#d9534f"></i>정밀 진단 필요</span></div>' +
    '</div></body></html>'
  ) : '';

  return (
    <div className="content">
      <div className="eyebrow">점검 결과 확인 및 다운로드</div>
      <h2 className="serif-h1 serif" style={{fontSize:'28px', margin:'6px 0 22px'}}>분석이 끝난 결과를 안전하게 확인합니다</h2>
      <div className="result-layout">
        <div className="result-list">
          {completed.map(item => (
            <button key={item.id} className={'result-item' + (selected && selected.id===item.id ? ' active' : '')} onClick={() => setSelectedId(item.id)}>
              <div className="result-item-name">{item.name}</div>
              <div style={{fontSize:'11.5px', color:'var(--n6)'}}>{item.id} · {item.date}</div>
            </button>
          ))}
        </div>
        {selected ? (
          <div className="viewer-card">
            <div className="viewer-head">
              <div>
                <div style={{fontSize:'16px', fontWeight:600, color:'var(--n10)'}}>{selected.name} · 3D 외관조사망도</div>
                <div style={{fontSize:'12px', color:'var(--n7)', marginTop:'3px'}}>외부 분석 프로그램이 생성한 결과 HTML을 격리된 영역에 표시합니다</div>
              </div>
              <button className="btn btn-primary btn-sm" onClick={() => onDownload(selected.name)}><Ic name="download" size={14} />다운로드 (약 3MB)</button>
            </div>
            <div className="viewer-frame-wrap">
              <iframe className="viewer-frame" sandbox="allow-scripts allow-same-origin" srcDoc={reportHtml} title="3D 외관조사망도 미리보기"></iframe>
            </div>
            <div className="viewer-meta-row">
              <span className="m-item"><Ic name="user" size={13} />담당 {selected.analyst}</span>
              <span className="m-item"><Ic name="hard-drive" size={13} />{selected.size}</span>
              <span className="m-item"><Ic name="lock" size={13} />본인 결과만 접근 가능</span>
            </div>
          </div>
        ) : (
          <div className="empty-state"><Ic name="file-check-2" size={28} />분석완료된 점검이 없습니다.</div>
        )}
      </div>
    </div>
  );
}

function PurchaseGuideScreen() {
  const [form, setForm] = useState({company:'', manager:'', contact:'', message:''});
  const [inquiries, setInquiries] = useState([{company:'대한안전진단(주)', at:'09.14 11:20', status:'답변 대기'}]);
  const [toastMsg, setToastMsg] = useState(null);

  function submit() {
    if (!form.company.trim() || !form.contact.trim()) return;
    setInquiries([{company:form.company, at:'방금 전', status:'답변 대기'}, ...inquiries]);
    setForm({company:'', manager:'', contact:'', message:''});
    setToastMsg('문의가 접수되었습니다');
    setTimeout(() => setToastMsg(null), 2400);
  }

  return (
    <div className="content" id="purchase-guide-content">
      <div className="eyebrow">이용 권한 안내 및 구매 문의</div>
      <div className="pg-hero">
        <div className="pg-icon-ring"><Ic name="lock" size={26} /></div>
        <h2 className="serif-h1 serif" style={{fontSize:'26px'}}>이 계정에는 아직 이용 권한이 없습니다</h2>
        <p className="rail-sub" style={{maxWidth:'440px'}}>점검 데이터 업로드와 결과 확인 기능은 이용 권한이 부여된 계정만 사용할 수 있습니다. 아래로 문의를 남겨주시면 담당자가 안내드립니다.</p>
        <div className="pg-contact-card">
          <Ic name="phone" style={{color:'var(--m600)'}} />
          <div>
            <div style={{fontSize:'13px', fontWeight:600, color:'var(--n10)'}}>02-1533-0199</div>
            <div style={{fontSize:'11.5px', color:'var(--n7)'}}>평일 09:00 – 18:00 · biz@infrascan-demo.co.kr</div>
          </div>
        </div>
      </div>
      <div className="pg-form-card">
        <div className="wizard-card-title">구매 문의 남기기</div>
        <div className="wizard-card-desc">작성해주신 내용은 관리자 화면에 즉시 접수됩니다.</div>
        <div className="form-grid">
          <div className="form-field">
            <label>회사명</label>
            <input value={form.company} placeholder="예: 대한안전진단(주)" onChange={e => setForm({...form, company:e.target.value})} />
          </div>
          <div className="form-field">
            <label>담당자명</label>
            <input value={form.manager} placeholder="홍길동" onChange={e => setForm({...form, manager:e.target.value})} />
          </div>
          <div className="form-field">
            <label>연락처</label>
            <input value={form.contact} placeholder="010-0000-0000" onChange={e => setForm({...form, contact:e.target.value})} />
          </div>
          <div className="form-field">
            <label>희망 상담 방식</label>
            <select>{['전화','이메일'].map(v => <option key={v}>{v}</option>)}</select>
          </div>
          <div className="form-field full">
            <label>문의 내용</label>
            <textarea rows="3" value={form.message} placeholder="필요하신 점검 건수, 희망 계약 형태 등을 남겨주세요" onChange={e => setForm({...form, message:e.target.value})}></textarea>
          </div>
        </div>
        <div style={{marginTop:'18px', display:'flex', justifyContent:'flex-end'}}>
          <button className="btn btn-primary" onClick={submit}><Ic name="send" size={14} />문의 제출</button>
        </div>
      </div>
      <div className="pg-inquiry-list">
        <div className="section-title"><Ic name="inbox" size={14} />최근 문의 내역</div>
        {inquiries.map((q,i) => (
          <div key={i} className="pg-inquiry-row" style={{animationDelay:(i*0.05)+'s'}}>
            <span>{q.company}</span><span style={{color:'var(--n6)'}}>{q.at}</span><span className="badge badge-neutral">{q.status}</span>
          </div>
        ))}
      </div>
      {toastMsg && <ToastHost toasts={[{id:1, msg:toastMsg}]} />}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [selectedId, setSelectedId] = useState(INSPECTIONS[0].id);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [inspections, setInspections] = useState(INSPECTIONS);
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); setCmdkOpen(o => !o); }
      if (e.key==='Escape') setCmdkOpen(false);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  function pushToast(msg) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 2600);
  }

  function handleDownload(name) {
    pushToast(name + ' 데이터를 내려받는 중입니다');
  }

  function handlePrimary() {
    if (screen==='main') setScreen('upload-wizard');
    else if (screen==='purchase-guide') {
      const el = document.querySelector('.pg-form-card');
      if (el) el.scrollIntoView({behavior:'smooth'});
    }
  }

  function onSubmitted(name) {
    const newItem = {id:'INSP-2409-0'+(15+inspections.length), name:name, type:'교량', typeIcon:'building-2', part:'신규 등록', date:'2026.09.17', status:'접수완료', analyst:'-', size:'—', updatedAt:'방금 전', files:{pcd:'업로드됨', poses:'업로드됨', rgb:0, depth:0, calib:'업로드됨'}};
    setInspections([newItem, ...inspections]);
    setSelectedId(newItem.id);
    setScreen('main');
    pushToast('점검 데이터가 접수완료 상태로 제출되었습니다');
  }

  return (
    <div className="app-shell" data-archetype="linear-sidebar-cmdk">
      <Sidebar screen={screen} setScreen={setScreen} />
      <div className="main-wrap">
        <Topbar screen={screen} onPrimary={handlePrimary} onCmdk={() => setCmdkOpen(true)} />
        {screen==='main' && <MainScreen setScreen={setScreen} selectedId={selectedId} setSelectedId={setSelectedId} inspections={inspections} onDownload={handleDownload} />}
        {screen==='upload-wizard' && <UploadWizardScreen onSubmitted={onSubmitted} />}
        {screen==='result-view' && <ResultViewScreen inspections={inspections} selectedId={selectedId} setSelectedId={setSelectedId} onDownload={handleDownload} />}
        {screen==='purchase-guide' && <PurchaseGuideScreen />}
      </div>
      <CmdkOverlay open={cmdkOpen} onClose={() => setCmdkOpen(false)} onNavigate={setScreen} />
      <ToastHost toasts={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
