<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인프라 점검 통합 운영 콘솔 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 223°, light) ── */
:root{
  --m50:#f0f3fc; --m100:#e1e8f9; --m200:#c4d1f2; --m300:#a0b4ea; --m400:#7795e2;
  --m500:#5177d9; --m600:#2b59d1; --m700:#2349ab; --m800:#1c3986; --m900:#13285e;
  --n0:#f6f3f1; --n1:#cecac8; --n2:#efeff0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b6ba; --n6:#909298; --n7:#797776; --n8:#53555a; --n9:#36373a; --n10:#242424;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:40px; --radius-el:26px; --radius-input:16px; --radius-btn:100px; --radius-sm:12px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',ui-sans-serif,system-ui,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
.serif{font-family:'Noto Serif KR',serif;font-weight:400;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n1);border-radius:8px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes drawerIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(43,89,209,.28);}70%{box-shadow:0 0 0 8px rgba(43,89,209,0);}100%{box-shadow:0 0 0 0 rgba(43,89,209,0);}}
@keyframes fillProg{from{width:0%;}}

.app-shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}
.topbar{width:100%;height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--n1);background:var(--n0);position:sticky;top:0;z-index:30;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--m600),var(--m800));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.brand-name{font-size:15px;font-weight:600;}
.brand-tag{font-size:10.5px;color:var(--n7);}
.tabnav{display:flex;align-items:center;gap:4px;}
.tab-btn{font-size:13px;padding:9px 16px;border-radius:var(--radius-btn);color:var(--n8);font-weight:500;}
.tab-btn:hover{background:var(--n2);}
.tab-btn.active{background:var(--n10);color:#fff;}
.topbar-actions{display:flex;align-items:center;gap:10px;}

.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:11px 24px;border-radius:var(--radius-btn);white-space:nowrap;transition:transform .12s ease,opacity .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-primary:disabled{background:var(--n4);color:var(--n7);cursor:not-allowed;}
.btn-dark{background:var(--n10);color:#fff;}
.btn-new-pulse{animation:pulseRing 2.4s ease-out infinite;}
.btn-ghost{background:transparent;border:1px solid var(--n1);color:var(--n9);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:8px 16px;font-size:12px;}

.content{padding:36px 32px 60px;width:100%;flex:1;}
.page-head{margin-bottom:26px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--m700);text-transform:uppercase;}
.page-title{font-size:clamp(28px, 2.6vw, 40px);margin:8px 0 6px;letter-spacing:-.01em;}
.page-sub{font-size:13.5px;color:var(--n7);max-width:560px;line-height:1.5;}

/* kanban composition */
.board-layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
.column{flex:0 0 272px;background:var(--n2);border-radius:var(--radius-el);padding:14px;}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 12px;}
.col-header-label{font-size:12.5px;font-weight:700;color:var(--n9);display:flex;align-items:center;gap:7px;}
.count{font-size:11px;font-weight:700;color:var(--n7);background:var(--n0);border:1px solid var(--n1);border-radius:var(--radius-btn);padding:2px 9px;}
.col-cards{display:flex;flex-direction:column;gap:10px;min-height:40px;}
.card{background:var(--n0);border:1px solid var(--n1);border-radius:var(--radius-sm);padding:13px 14px;width:100%;text-align:left;transition:transform .15s ease,border-color .15s ease;}
.card:hover{transform:scale(1.02);border-color:var(--n5);}
.card.overdue{border-color:var(--s3);}
.card-title{font-size:12.5px;font-weight:600;color:var(--n10);margin-bottom:8px;line-height:1.4;}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tag{font-size:10.5px;padding:3px 9px;border-radius:var(--radius-btn);background:var(--n2);color:var(--n7);}
.priority{font-size:10px;padding:3px 8px;border-radius:var(--radius-btn);font-weight:700;}
.priority.high{background:var(--s3-bg);color:var(--s3-text);}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-left:auto;flex-shrink:0;}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:10.5px;color:var(--n6);}

.matrix-side{background:var(--n2);border-radius:var(--radius-el);padding:20px;}
.matrix-title{font-size:12.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.filter-chip{font-size:11px;padding:6px 12px;border-radius:var(--radius-btn);border:1px solid var(--n1);color:var(--n7);background:var(--n0);}
.filter-chip.active{background:var(--m600);color:#fff;border-color:var(--m600);}
.overdue-list{display:flex;flex-direction:column;gap:8px;}
.overdue-item{display:flex;justify-content:space-between;align-items:center;background:var(--n0);border-radius:var(--radius-sm);padding:10px 12px;font-size:11.5px;border:1px solid var(--n1);}
.overdue-days{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--s3-text);}

/* drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(36,36,36,.35);z-index:100;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--n0);z-index:101;box-shadow:-16px 0 40px rgba(0,0,0,.16);animation:drawerIn .22s ease both;overflow-y:auto;padding:28px;}
.drawer-close{position:absolute;top:22px;right:22px;width:32px;height:32px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;}
.drawer-title{font-size:20px;margin:8px 0 4px;padding-right:40px;}
.drawer-sub{font-size:12px;color:var(--n7);margin-bottom:20px;}
.drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
.dstat{background:var(--n2);border-radius:var(--radius-sm);padding:12px 14px;}
.dstat-label{font-size:10.5px;color:var(--n7);margin-bottom:3px;}
.dstat-val{font-size:13px;font-weight:700;}
.status-select-row{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.status-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--n1);font-size:12.5px;}
.status-opt.current{border-color:var(--m600);background:var(--m50);font-weight:600;}
.memo-box{background:var(--s3-bg);color:var(--s3-text);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;margin-bottom:16px;}

/* member table */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--n2);border-radius:var(--radius-input);padding:10px 16px;flex:1;max-width:340px;}
.search-box input{flex:1;border:none;background:transparent;outline:none;font-size:13px;}
.member-list{display:flex;flex-direction:column;gap:10px;}
.member-row{display:flex;align-items:center;gap:14px;background:var(--n2);border-radius:var(--radius-el);padding:16px 20px;animation:fadeUp .28s ease both;}
.member-avatar{width:40px;height:40px;border-radius:50%;background:var(--n0);border:1px solid var(--n1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.member-info{flex:1;min-width:0;}
.member-company{font-size:13.5px;font-weight:600;}
.member-sub{font-size:11.5px;color:var(--n7);margin-top:2px;}
.member-activity{font-size:11px;color:var(--n6);font-family:'JetBrains Mono',monospace;}
.switch{width:42px;height:24px;border-radius:24px;background:var(--n1);position:relative;flex-shrink:0;}
.switch.on{background:var(--m600);}
.switch-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s ease;}
.switch.on .switch-knob{transform:translateX(18px);}
.audit-log{margin-top:26px;}
.audit-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--n1);font-size:11.5px;color:var(--n7);}
.audit-row .mono{color:var(--n9);}

/* result upload */
.upload-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
.task-pick{display:flex;flex-direction:column;gap:8px;}
.task-pick-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--n1);background:var(--n2);}
.task-pick-item.selected{border-color:var(--m600);background:var(--m50);}
.dropzone{border:1.5px dashed var(--n1);border-radius:var(--radius-el);padding:40px 24px;text-align:center;background:var(--n2);}
.progress-track{height:6px;background:var(--n1);border-radius:6px;overflow:hidden;margin-top:14px;}
.progress-fill{height:100%;background:var(--m600);border-radius:6px;animation:fillProg .3s ease-out;}
.upload-log{margin-top:24px;display:flex;flex-direction:column;gap:8px;}
.upload-log-row{display:flex;justify-content:space-between;padding:11px 16px;background:var(--n2);border-radius:var(--radius-sm);font-size:12px;}

/* api analytics */
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;}
.api-key-card{background:var(--n2);border-radius:var(--radius-el);padding:24px;}
.api-key-value{font-family:'JetBrains Mono',monospace;font-size:13.5px;background:var(--n0);border:1px solid var(--n1);border-radius:var(--radius-sm);padding:12px 16px;margin:12px 0;word-break:break-all;}
.chart-card{background:var(--n2);border-radius:var(--radius-el);padding:24px;}
.chart-wrap{height:240px;position:relative;margin-top:10px;}
.endpoint-log{margin-top:8px;}
.endpoint-row{display:grid;grid-template-columns:70px 1fr 70px 90px;gap:10px;padding:10px 4px;border-bottom:1px solid var(--n1);font-size:11.5px;align-items:center;}
.method-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--n0);border:1px solid var(--n1);width:fit-content;}

.toast-host{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--n10);color:#fff;padding:12px 20px;border-radius:var(--radius-btn);font-size:13px;display:flex;align-items:center;gap:9px;animation:toastIn .22s ease both;}

@media (max-width:1100px){
  .board-layout{grid-template-columns:1fr;}
  .upload-layout{grid-template-columns:1fr;}
  .api-grid{grid-template-columns:1fr;}
}
@media (max-width:480px){
  .topbar{padding:0 14px;height:auto;flex-wrap:wrap;gap:10px;padding-top:12px;padding-bottom:12px;}
  .tabnav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;}
  .content{padding:22px 14px 40px;}
  .brand-tag{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const {BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell} = Recharts;

function Ic({name, size=16, style={}}) {
  return <i className={'ph ph-' + name} style={{fontSize:size, ...style}}></i>;
}

const TASKS_INIT = [
  {id:'TSK-241', structure:'해오름대교 주탑부', company:'경기안전기술원', type:'교량', elapsedDays:1, sizeGB:'3.6GB', status:'접수완료'},
  {id:'TSK-240', structure:'중앙지하차도 환기구', company:'서울안전진단(주)', type:'터널', elapsedDays:2, sizeGB:'2.1GB', status:'접수완료'},
  {id:'TSK-238', structure:'미리내저수지 제방', company:'경기안전기술원', type:'댐', elapsedDays:6, sizeGB:'4.4GB', status:'분석중'},
  {id:'TSK-236', structure:'구봉산터널 배기구', company:'부산인프라점검', type:'터널', elapsedDays:3, sizeGB:'3.0GB', status:'분석중'},
  {id:'TSK-233', structure:'선린대교 교각부', company:'서울안전진단(주)', type:'교량', elapsedDays:1, sizeGB:'2.9GB', status:'분석완료'},
  {id:'TSK-231', structure:'대일배수터널', company:'경기안전기술원', type:'기타', elapsedDays:2, sizeGB:'3.3GB', status:'분석완료'},
  {id:'TSK-229', structure:'청호천교 하부', company:'부산인프라점검', type:'교량', elapsedDays:4, sizeGB:'2.5GB', status:'보완요청', memo:'RGB 이미지 76장 누락 — 재업로드 필요'},
  {id:'TSK-227', structure:'남악터널 진입로', company:'서울안전진단(주)', type:'터널', elapsedDays:1, sizeGB:'1.8GB', status:'보완요청', memo:'캘리브레이션 파일 형식 오류'},
];
const STATUS_ORDER = ['접수완료','분석중','분석완료','보완요청'];
const STATUS_TONE = {'접수완료':'neutral','분석중':'neutral','분석완료':'success','보완요청':'danger'};

function initials(s) { return s.replace(/\(주\)/,'').trim().charAt(0); }

function Card({task, onOpen}) {
  const overdue = task.elapsedDays >= 5;
  return (
    <button className={'card' + (overdue ? ' overdue' : '')} onClick={() => onOpen(task)}>
      <div className="card-title">{task.structure}</div>
      <div className="card-meta">
        <span className="tag">{task.type}</span>
        {overdue && <span className="priority high">지연 {task.elapsedDays}일</span>}
        <span className="avatar">{initials(task.company)}</span>
      </div>
      <div className="card-foot">
        <span className="mono">{task.id}</span>
        <span>{task.sizeGB}</span>
      </div>
    </button>
  );
}

function BoardScreen({tasks, onOpen, onToast}) {
  const [typeFilter, setTypeFilter] = useState('전체');
  const types = ['전체','교량','터널','댐','기타'];
  const visible = typeFilter==='전체' ? tasks : tasks.filter(t => t.type===typeFilter);
  const overdueTop = [...tasks].filter(t => t.elapsedDays>=4).sort((a,b) => b.elapsedDays-a.elapsedDays).slice(0,4);

  const col1 = visible.filter(t => t.status==='접수완료');
  const col2 = visible.filter(t => t.status==='분석중');
  const col3 = visible.filter(t => t.status==='분석완료');
  const col4 = visible.filter(t => t.status==='보완요청');

  return (
    <div className="content">
      <div className="page-head">
        <div className="eyebrow">관리자 작업 상태 보드</div>
        <h1 className="page-title serif">전체 처리 현황을 한 화면에서 지휘합니다</h1>
        <p className="page-sub">접수완료부터 보완요청까지, 네 단계 워크플로우를 칸반 보드로 관리하고 카드 버튼으로 즉시 상태를 전환합니다.</p>
      </div>
      <div className="board-layout">
        <div className="board" data-archetype="kanban-board">
          <section className="column">
            <div className="col-header"><span className="col-header-label"><Ic name="tray" size={14}/>접수완료</span><span className="count">{col1.length}</span></div>
            <div className="col-cards">{col1.map(t => <Card key={t.id} task={t} onOpen={onOpen} />)}</div>
          </section>
          <section className="column">
            <div className="col-header"><span className="col-header-label"><Ic name="spinner-gap" size={14}/>분석중</span><span className="count">{col2.length}</span></div>
            <div className="col-cards">{col2.map(t => <Card key={t.id} task={t} onOpen={onOpen} />)}</div>
          </section>
          <section className="column">
            <div className="col-header"><span className="col-header-label"><Ic name="check-circle" size={14}/>분석완료</span><span className="count">{col3.length}</span></div>
            <div className="col-cards">{col3.map(t => <Card key={t.id} task={t} onOpen={onOpen} />)}</div>
          </section>
          <section className="column">
            <div className="col-header"><span className="col-header-label"><Ic name="warning" size={14}/>보완요청</span><span className="count">{col4.length}</span></div>
            <div className="col-cards">{col4.map(t => <Card key={t.id} task={t} onOpen={onOpen} />)}</div>
          </section>
        </div>
        <aside className="matrix-side">
          <div className="matrix-title"><Ic name="funnel" size={14}/>유형 필터</div>
          <div className="filter-row">
            {types.map(t => (
              <button key={t} className={'filter-chip' + (typeFilter===t ? ' active' : '')} onClick={() => setTypeFilter(t)}>{t}</button>
            ))}
          </div>
          <div className="matrix-title"><Ic name="clock-countdown" size={14}/>지연 임박 상위</div>
          <div className="overdue-list">
            {overdueTop.length===0 && <div style={{fontSize:'11.5px', color:'var(--n7)'}}>지연 임박 건이 없습니다.</div>}
            {overdueTop.map(t => (
              <div key={t.id} className="overdue-item">
                <span>{t.structure}</span>
                <span className="overdue-days">{t.elapsedDays}일째</span>
              </div>
            ))}
          </div>
        </aside>
      </div>
    </div>
  );
}

function TaskDrawer({task, onClose, onChangeStatus}) {
  if (!task) return null;
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <button className="drawer-close" onClick={onClose}><Ic name="x" size={16}/></button>
        <div className="tag">{task.type}</div>
        <h2 className="drawer-title serif">{task.structure}</h2>
        <div className="drawer-sub mono">{task.id} · {task.company}</div>
        {task.memo && <div className="memo-box"><Ic name="warning-circle" size={14}/> {task.memo}</div>}
        <div className="drawer-grid">
          <div className="dstat"><div className="dstat-label">업로드 용량</div><div className="dstat-val">{task.sizeGB}</div></div>
          <div className="dstat"><div className="dstat-label">경과일</div><div className="dstat-val">{task.elapsedDays}일</div></div>
        </div>
        <div className="matrix-title">상태 전환</div>
        <div className="status-select-row">
          {STATUS_ORDER.map(s => (
            <button key={s} className={'status-opt' + (task.status===s ? ' current' : '')} onClick={() => onChangeStatus(task.id, s)}>
              <Ic name={task.status===s ? 'radio-button-fill' : 'circle'} size={14} />
              {s}
            </button>
          ))}
        </div>
        <button className="btn btn-ghost" style={{width:'100%', justifyContent:'center'}} onClick={onClose}>닫기</button>
      </div>
    </React.Fragment>
  );
}

    {id:'m3', company:'부산인프라점검', manager:'배지훈', email:'jh.bae@busaninfra.demo', granted:false, lastActive:'09.10 17:40'},
    {id:'m4', company:'대전토목안전공사', manager:'심유나', email:'yn.sim@daejeoncivil.demo', granted:true, lastActive:'09.15 11:05'},

function ResultUploadScreen({tasks, onUploadDone, onToast}) {
  const eligible = tasks.filter(t => t.status==='분석중');
  const [pickedId, setPickedId] = useState(eligible[0] ? eligible[0].id : null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [log, setLog] = useState([
    {name:'선린대교 교각부', at:'09.16 15:20', result:'검증 통과'},
  ]);

  function doUpload() {
    if (!pickedId) return;
    setUploading(true); setProgress(0);
    let p = 0;
    const t = setInterval(() => {
      p += 25;
      setProgress(Math.min(p,100));
      if (p>=100) {
        clearInterval(t);
        setUploading(false);
        const task = eligible.find(x => x.id===pickedId);
        onUploadDone(pickedId);
        setLog([{name:task.structure, at:'방금 전', result:'검증 통과'}, ...log]);
        onToast(task.structure+' 결과가 업로드되어 분석완료로 자동 전환되었습니다');
        setPickedId(null);
      }
    }, 150);
  }

  return (
    <div className="content">
      <div className="page-head">
        <div className="eyebrow">결과물 업로드 및 자동 상태 전환</div>
        <h1 className="page-title serif" style={{fontSize:'26px'}}>결과 HTML을 올리면 상태가 자동으로 전환됩니다</h1>
        <p className="page-sub">업로드 완료 시 확장자·용량 검증 후 상태가 분석완료로 자동 전환되고, 사용자와 관리자에게 동시에 알림이 발송됩니다.</p>
      </div>
      <div className="upload-layout">
        <div>
          <div className="matrix-title"><Ic name="list-checks" size={14}/>분석중인 점검 선택</div>
          <div className="task-pick">
            {eligible.length===0 && <div style={{fontSize:'12.5px', color:'var(--n7)'}}>분석중인 점검이 없습니다.</div>}
            {eligible.map(t => (
              <button key={t.id} className={'task-pick-item' + (pickedId===t.id ? ' selected' : '')} onClick={() => setPickedId(t.id)}>
                <span>{t.structure} <span className="mono" style={{fontSize:'10.5px', color:'var(--n6)'}}>{t.id}</span></span>
                <Ic name={pickedId===t.id ? 'radio-button-fill' : 'circle'} size={16} />
              </button>
            ))}
          </div>
        </div>
        <div>
          <div className="matrix-title"><Ic name="upload-simple" size={14}/>결과 HTML 업로드</div>
          <div className="dropzone">
            <Ic name="file-html" size={30} style={{color:'var(--n6)', marginBottom:'10px'}} />
            <div style={{fontSize:'13.5px', fontWeight:600, marginBottom:'4px'}}>3D 외관조사망도 결과 HTML을 올려주세요</div>
            <div style={{fontSize:'11.5px', color:'var(--n7)', marginBottom:'16px'}}>단일 HTML 파일, 최대 10MB</div>
            <button className="btn btn-primary btn-sm" onClick={doUpload} disabled={uploading || !pickedId}>{uploading ? '업로드 중…' : '파일 선택 후 업로드'}</button>
          </div>
          {uploading && <div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}></div></div>}
        </div>
      </div>
      <div className="upload-log">
        <div className="matrix-title"><Ic name="clock-clockwise" size={14}/>업로드 처리 이력</div>
        {log.map((l,i) => (
          <div key={i} className="upload-log-row"><span>{l.name}</span><span className="mono">{l.at}</span><span style={{color:'var(--s1-text)'}}>{l.result}</span></div>
        ))}
      </div>
    </div>
  );
}

  return (
    <div className="content">

        <h1 className="page-title serif" style={{fontSize:'26px'}}>같은 API로 수동과 자동 처리를 함께 지원합니다</h1>
        <p className="page-sub">API 키 기반 인증으로 외부 분석 서버가 신규 작업 조회부터 결과 업로드까지 처리할 수 있고, 처리 현황은 실시간 통계로 확인합니다.</p>

      <div className="api-grid">
        <div className="api-key-card">
          <div className="matrix-title"><Ic name="key" size={14}/>발급된 API 키</div>
          <div className="api-key-value mono">{apiKey}</div>
          <button className="btn btn-ghost btn-sm" onClick={regenKey}><Ic name="arrows-clockwise" size={14}/>재발급</button>
        </div>
        <div className="chart-card">
          <div className="matrix-title"><Ic name="chart-bar" size={14}/>컬럼별 처리 건수 · 평균 처리 시간 {avgTime}</div>
          <div className="chart-wrap">

                <Tooltip />

const TABS = [
  {key:'main', label:'관리자 작업 상태 보드'},
  {key:'member-permission', label:'회원·권한 관리'},
  {key:'result-upload', label:'결과물 업로드 및 자동 상태 전환'},
  {key:'api-analytics', label:'외부 분석 서버 연동 API 및 통계 현황'},
];

function App() {
  const [screen, setScreen] = useState('main');
  const [tasks, setTasks] = useState(TASKS_INIT);
  const [drawerTask, setDrawerTask] = useState(null);
  const [toasts, setToasts] = useState([]);

  function pushToast(msg) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 2600);
  }

  function openDrawer(task) { setDrawerTask(task); }
  function closeDrawer() { setDrawerTask(null); }

  function changeStatus(id, status) {
    setTasks(prev => prev.map(t => t.id===id ? {...t, status} : t));
    setDrawerTask(prev => prev ? {...prev, status} : prev);
    pushToast(id+' 상태가 '+status+'(으)로 변경되었습니다');
  }

  function uploadDone(id) {
    setTasks(prev => prev.map(t => t.id===id ? {...t, status:'분석완료'} : t));
  }

  return (
    <div className="app-shell" data-archetype="kanban-board">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">IO</div>
          <div>
            <div className="brand-name">인프라스캔 운영 콘솔</div>
            <div className="brand-tag">Ops Console for Inspection Partners</div>
          </div>
        </div>
        <nav className="tabnav">
          {TABS.map(t => (
            <button key={t.key} className={'tab-btn' + (screen===t.key ? ' active' : '')} onClick={() => setScreen(t.key)}>{t.label}</button>
          ))}
        </nav>
        <div className="topbar-actions">
          <button className="btn btn-dark btn-sm btn-new-pulse" onClick={() => pushToast('새 작업 등록 화면으로 이동합니다')}><Ic name="plus" size={14}/>새 작업</button>
        </div>
      </header>

      {screen==='main' && <BoardScreen tasks={tasks} onOpen={openDrawer} onToast={pushToast} />}
      {screen==='member-permission' && <MemberPermissionScreen onToast={pushToast} />}
      {screen==='result-upload' && <ResultUploadScreen tasks={tasks} onUploadDone={uploadDone} onToast={pushToast} />}
      {screen==='api-analytics' && <ApiAnalyticsScreen tasks={tasks} />}

      <TaskDrawer task={drawerTask} onClose={closeDrawer} onChangeStatus={changeStatus} />

      <div className="toast-host">
        {toasts.map(t => <div key={t.id} className="toast"><Ic name="check-circle" size={16}/>{t.msg}</div>)}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
