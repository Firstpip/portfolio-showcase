<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한빛정책연구소 — 콘텐츠 관리 플랫폼 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 208°, light) ── */
:root{
  --m50:#edf5fd; --m100:#dbecfa; --m200:#b8d8f6; --m300:#8cc1f0; --m400:#5ca7ea;
  --m500:#2e8ee4; --m600:#0075de; --m700:#0060b6; --m800:#004b8e; --m900:#003564;
  --n0:#f6f5f4; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909498; --n7:#757575; --n8:#53575a; --n9:#36383a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body,#root{margin:0;padding:0;width:100%;min-height:100%;}
body{background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;}

.ic-12{width:12px;height:12px;flex-shrink:0;}
.ic-14{width:14px;height:14px;flex-shrink:0;}
.ic-16{width:16px;height:16px;flex-shrink:0;}
.ic-18{width:18px;height:18px;flex-shrink:0;}
.ic-24{width:24px;height:24px;flex-shrink:0;}

.app-shell{display:flex;width:100%;min-height:100vh;}

/* ── 트리 사이드바 (notion-blocks-tree 시그니처) ── */
.tree-sidebar{position:fixed;left:0;top:0;bottom:0;width:256px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:20;overflow-y:auto;}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;font-size:14px;font-weight:700;color:var(--n9);cursor:pointer;}
.brand-dot{width:20px;height:20px;border-radius:6px;background:var(--m600);flex-shrink:0;}
.sidebar-search{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px;}
.search-btn,.quick-add{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--n7);background:var(--n2);text-align:left;}
.search-btn:hover,.quick-add:hover{background:var(--n3);}
.search-input{width:100%;padding:7px 10px;border:1px solid var(--m300);border-radius:7px;font-size:13px;outline:none;}
.tree-nav{flex:1;padding:6px 8px 16px;overflow-y:auto;}
.tree-group-label{font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;padding:14px 10px 6px;}
.tree-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:6px;font-size:13.5px;color:var(--n8);cursor:pointer;transition:background .15s;}
.tree-item:hover{background:var(--n2);}
.tree-item.active{background:var(--m50);color:var(--m700);font-weight:700;}
.tree-item.expandable{font-weight:600;color:var(--n7);}
.tree-toggle{color:var(--n6);}
.tree-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-footer{border-top:1px solid var(--n3);padding:8px;display:flex;flex-direction:column;gap:2px;}
.footer-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--n6);}
.footer-link:hover{background:var(--n2);}

/* ── 메인 영역 ── */
.page-wrap{margin-left:256px;flex:1;min-width:0;width:calc(100% - 256px);display:flex;min-height:100vh;}
.canvas-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.inspector-col{width:280px;flex-shrink:0;border-left:1px solid var(--n3);background:var(--n1);padding:24px 20px;}
.inspector-section{margin-bottom:22px;}
.inspector-label{font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
.inspector-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--n8);}
.inspector-value{font-size:14px;color:var(--n8);}
.btn-ghost.full{width:100%;justify-content:center;margin-top:8px;}

.canvas-scroll{flex:1;overflow-y:auto;padding:36px 0 80px;animation:fadeInUp .35s ease;}
.canvas-inner{max-width:840px;margin:0 auto;padding:0 40px;}
.canvas-inner.wide{max-width:920px;}

.toolbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.breadcrumb{font-size:13px;color:var(--n6);display:flex;align-items:center;gap:6px;}
.toolbar-actions{display:flex;align-items:center;gap:10px;}
.device-toggle{display:flex;gap:3px;background:var(--n2);border-radius:8px;padding:3px;}
.device-btn{padding:6px 9px;border-radius:6px;color:var(--n6);display:flex;}
.device-btn.active{background:var(--n1);color:var(--m600);box-shadow:0 1px 2px rgba(0,0,0,.1);}

.feature-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--m50);color:var(--m700);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:20px;}
.feature-eyebrow:hover{background:var(--m100);}
.edit-mode-banner{display:flex;align-items:center;gap:8px;background:var(--m50);color:var(--m700);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:8px;margin-bottom:20px;animation:fadeInUp .2s ease;}

.preview-strip{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
.preview-frame{border:1.5px solid var(--n3);border-radius:10px;padding:8px;background:var(--n1);cursor:pointer;transition:border-color .15s;}
.preview-frame.current{border-color:var(--m600);}
.preview-desktop{width:220px;}
.preview-tablet{width:150px;}
.preview-mobile{width:90px;}
.preview-bar{height:6px;border-radius:3px;background:var(--n3);margin-bottom:6px;width:40%;}
.preview-hero{height:36px;border-radius:6px;background:var(--n2);margin-bottom:6px;}
.preview-row{display:flex;gap:5px;}
.preview-card{flex:1;height:22px;border-radius:5px;background:var(--n2);}

.page-cover{width:100%;height:96px;border-radius:14px;background:linear-gradient(120deg,var(--m600),var(--m800));margin-bottom:24px;overflow:hidden;position:relative;}
.page-cover-art{width:100%;height:100%;display:block;}
.page-header-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:26px;margin-top:-22px;padding-left:8px;}
.page-icon-badge{width:52px;height:52px;border-radius:12px;background:var(--m50);color:var(--m600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.page-title{font-size:48px;font-weight:700;color:var(--n10);margin:0 0 4px;letter-spacing:-.02em;line-height:1.1;}
.page-sub{font-size:13.5px;color:var(--n6);}

.section-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}

.block-list{display:flex;flex-direction:column;}
.block{position:relative;padding:6px 4px 6px 32px;border-radius:6px;}
.block:hover{background:var(--n1);}
.block-handle{position:absolute;left:0;top:6px;width:22px;height:22px;display:none;align-items:center;justify-content:center;color:var(--n5);}
.block-add-btn{position:absolute;left:22px;top:6px;width:22px;height:22px;display:none;align-items:center;justify-content:center;color:var(--n5);}
.editing .block:hover .block-handle,.editing .block:hover .block-add-btn{display:flex;}
.block-heading h2{font-size:22px;font-weight:700;margin:18px 0 8px;color:var(--n10);}
.block-text p{font-size:15.5px;line-height:1.75;color:var(--n8);margin:6px 0;}
.block-callout{display:flex;gap:10px;background:var(--m50);border-left:3px solid var(--m600);border-radius:8px;padding:14px 16px;margin:14px 0;color:var(--m700);}
.block-callout p{margin:0;font-size:13.5px;color:var(--n8);line-height:1.6;}
.block-toggle{margin:6px 0;}
.toggle-summary-row{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 4px;border-radius:6px;font-size:15px;font-weight:600;color:var(--n9);}
.toggle-summary-row:hover{background:var(--n2);}
.toggle-content{padding:4px 4px 10px 22px;font-size:13.5px;color:var(--n7);line-height:1.7;}
.block-table table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.block-table th{text-align:left;padding:8px 10px;background:var(--n1);color:var(--n6);font-weight:700;border-bottom:1px solid var(--n3);font-size:11.5px;}
.block-table td{padding:8px 10px;border-bottom:1px solid var(--n3);color:var(--n8);}
.block-list-items{margin:8px 0;padding-left:20px;color:var(--n8);font-size:14.5px;line-height:1.85;}
.block-divider hr{border:none;border-top:1px solid var(--n3);margin:20px 0;}
.block-add-row{display:flex;align-items:center;gap:6px;color:var(--n5);font-size:13.5px;cursor:pointer;margin-top:6px;}
.block-add-row:hover{color:var(--n7);}

.slash-menu{position:absolute;left:32px;top:100%;margin-top:6px;width:230px;background:var(--n1);border:1px solid var(--n3);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);z-index:30;padding:6px;animation:fadeInUp .18s ease;}
.slash-input{width:100%;border:none;padding:8px 10px;font-size:13px;color:var(--n8);outline:none;}
.slash-group-title{font-size:10.5px;font-weight:700;color:var(--n6);padding:6px 10px 2px;text-transform:uppercase;}
.slash-item{padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--n8);display:flex;align-items:center;gap:8px;}
.slash-item:hover{background:var(--n2);}

.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--n3);margin-bottom:18px;}
.tab-btn{padding:9px 4px;margin-right:18px;font-size:14px;font-weight:600;color:var(--n6);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--m700);border-bottom-color:var(--m600);}

.data-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.data-table th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--n3);}
.data-table td{padding:11px 12px;font-size:13.5px;color:var(--n8);border-bottom:1px solid var(--n3);}
.data-table tbody tr{cursor:pointer;transition:background .12s;}
.data-table tbody tr:hover{background:var(--n1);}
.cell-title{color:var(--n9);font-weight:600;}
.cell-title-static{color:var(--n9);font-weight:600;}
.cell-muted{color:var(--n6);}
.cell-mono{font-family:'SF Mono',Menlo,monospace;color:var(--n7);font-size:12.5px;}
.cell-arrow{color:var(--n5);text-align:center;}
.cell-actions{display:flex;gap:4px;}
.empty-row{text-align:center;color:var(--n6);padding:28px 0;}
.order-cell{display:flex;align-items:center;gap:6px;}
.file-count{display:inline-flex;align-items:center;gap:4px;color:var(--n6);}

.icon-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--n6);}
.icon-btn:hover{background:var(--n2);color:var(--n8);transform:translateY(-1px);}
.icon-btn.sm{width:20px;height:20px;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge-neutral{background:var(--n2);color:var(--n7);}
.badge-success{background:var(--s1-bg);color:var(--s1-text);}
.badge-warn{background:var(--s3-bg);color:var(--s3-text);}

.switch{width:36px;height:20px;border-radius:999px;background:var(--n3);position:relative;flex-shrink:0;display:inline-block;transition:background .2s;}
.switch.on{background:var(--m600);}
.switch-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on .switch-knob{left:18px;}

.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-dot.live{background:var(--s1);animation:pulseDot 1.6s ease infinite;}

.btn-primary{background:var(--m600);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:var(--n1);color:var(--n8);border:1px solid var(--n3);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{background:var(--n2);}
.btn-ghost.active-toggle{background:var(--m50);color:var(--m700);border-color:var(--m200);}
.btn-danger{background:var(--s2);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;}

.field{margin-bottom:16px;}
.field-label{display:block;font-size:12px;font-weight:700;color:var(--n6);margin-bottom:6px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.input{width:100%;padding:9px 12px;border:1px solid var(--n4);border-radius:8px;font-size:13.5px;color:var(--n9);background:var(--n1);outline:none;}
.input:focus{border-color:var(--m400);}
.textarea{resize:vertical;min-height:100px;}
.select-mini{padding:7px 10px;font-size:13px;}
.search-mini{max-width:220px;}

.upload-zone{border:1.5px dashed var(--n4);border-radius:10px;padding:24px;text-align:center;color:var(--n6);font-size:12.5px;transition:border-color .15s,background .15s;}
.upload-zone:hover{border-color:var(--m400);background:var(--m50);}
.file-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.file-chip{display:inline-flex;align-items:center;gap:5px;background:var(--n2);color:var(--n7);padding:4px 10px;border-radius:999px;font-size:12px;}

.stat-strip{display:flex;gap:24px;margin-bottom:20px;padding:16px 20px;background:var(--n1);border:1px solid var(--n3);border-radius:10px;}
.stat-mini{display:flex;flex-direction:column;gap:2px;}
.stat-mini.warn{color:var(--s3-text);}
.stat-mini-num{font-size:18px;font-weight:700;color:var(--n9);}
.stat-mini.warn .stat-mini-num{color:var(--s3-text);}
.stat-mini-label{font-size:11.5px;color:var(--n6);}

.source-chip-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.source-chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);font-size:12.5px;color:var(--n7);}
.source-chip.active{border-color:var(--m600);color:var(--m700);background:var(--m50);}
.chip-count{color:var(--n5);}

.preview-panel{margin-top:8px;padding:18px 20px;background:var(--n1);border:1px solid var(--n3);border-radius:10px;}
.preview-panel-title{font-size:13px;font-weight:700;color:var(--n8);margin-bottom:12px;}

.skeleton{background:linear-gradient(90deg,var(--n2) 25%,var(--n3) 37%,var(--n2) 63%);background-size:400px 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;justify-content:flex-end;z-index:100;animation:fadeIn .2s ease;}
.drawer-panel{width:420px;max-width:92vw;height:100%;background:var(--n1);box-shadow:-8px 0 28px rgba(0,0,0,.14);display:flex;flex-direction:column;animation:slideInRight .25s ease;}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--n3);}
.drawer-header h3{margin:0;font-size:16px;font-weight:700;}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px;}
.drawer-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--n3);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s ease;padding:20px;}
.modal-box{width:420px;max-width:100%;background:var(--n1);border-radius:14px;padding:24px;animation:fadeInUp .25s ease;box-shadow:0 24px 64px rgba(0,0,0,.22);}
.modal-box.wide{width:560px;}
.modal-title{margin:0 0 8px;font-size:17px;font-weight:700;color:var(--n10);}
.modal-desc{font-size:13.5px;color:var(--n6);margin:0 0 20px;line-height:1.6;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.modal-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-meta-row{display:flex;gap:14px;font-size:12.5px;color:var(--n6);margin:8px 0 16px;}
.modal-body-text{font-size:14px;color:var(--n8);line-height:1.75;margin:0 0 18px;}
.attach-list{display:flex;flex-direction:column;gap:6px;}
.attach-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--n3);border-radius:8px;font-size:13px;color:var(--n8);}
.attach-item:hover{background:var(--n2);}
.attach-item span{flex:1;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:8px;z-index:200;animation:toastIn .25s ease;box-shadow:0 10px 28px rgba(0,0,0,.28);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useLucideIcons(){ useEffect(() => { if (window.lucide) window.lucide.createIcons(); }); }
function Icon({ name, className }) { return <i data-lucide={name} className={className || 'ic-18'}></i>; }

function useToast(){
  const [toast, setToast] = useState(null);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);
  return [toast, (msg) => setToast({ msg, key: Date.now() })];
}
function Toast({ toast }) {
  if (!toast) return null;
  return <div className="toast" key={toast.key}><Icon name="check-circle-2" className="ic-16" /><span>{toast.msg}</span></div>;
}

function ConfirmModal({ open, title, desc, onCancel, onConfirm }) {
  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()}>
        <h3 className="modal-title">{title}</h3>
        <p className="modal-desc">{desc}</p>
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onCancel}>취소</button>
          <button className="btn-danger" onClick={onConfirm}>확인</button>
        </div>
      </div>
    </div>
  );
}

function SlideOver({ open, title, onClose, children, footer }) {
  if (!open) return null;
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer-panel" onClick={(e) => e.stopPropagation()}>
        <div className="drawer-header">
          <h3>{title}</h3>
          <button className="icon-btn" onClick={onClose}><Icon name="x" className="ic-18" /></button>
        </div>
        <div className="drawer-body">{children}</div>
        {footer && <div className="drawer-footer">{footer}</div>}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div className="field"><label className="field-label">{label}</label>{children}</div>;
}

function UploadZone({ files, onAdd, multiple }) {
  const inputRef = useRef(null);
  return (
    <div>
      <div className="upload-zone" onClick={() => inputRef.current && inputRef.current.click()}>

/* ── 블록 ── */
function Block({ block, toggleOpen, onToggle }) {
  const handle = (
    <React.Fragment>
      <span className="block-handle"><Icon name="grip-vertical" className="ic-14" /></span>
      <span className="block-add-btn"><Icon name="plus" className="ic-14" /></span>
    </React.Fragment>
  );
  if (block.type === 'heading') return <div className="block block-heading" data-block-type="heading">{handle}<h2>{block.text}</h2></div>;
  if (block.type === 'text') return <div className="block block-text" data-block-type="text">{handle}<p>{block.text}</p></div>;
  if (block.type === 'callout') return (
    <div className="block block-callout" data-block-type="callout">{handle}<Icon name="info" className="ic-16" /><p>{block.text}</p></div>
  );
  if (block.type === 'toggle') return (
    <div className="block block-toggle" data-block-type="toggle">
      {handle}
      <div className="toggle-summary-row" onClick={onToggle}>
        <Icon name={toggleOpen ? 'chevron-down' : 'chevron-right'} className="ic-14" /><span>{block.summary}</span>
      </div>
      {toggleOpen && <div className="toggle-content">{block.content}</div>}
    </div>
  );
  if (block.type === 'table') return (
    <div className="block block-table" data-block-type="table">
      {handle}
      <table>
        <thead><tr>{block.headers.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
        <tbody>{block.rows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
  if (block.type === 'list') return (
    <div className="block block-list-block" data-block-type="list">
      {handle}<ul className="block-list-items">{block.items.map((it, i) => <li key={i}>{it}</li>)}</ul>
    </div>
  );
  if (block.type === 'divider') return <div className="block block-divider" data-block-type="divider">{handle}<hr /></div>;
  return null;
}

        <Field label="노출 시작일"><input type="date" className="input" value={data.start || ''} onChange={(e) => onChange('start', e.target.value)} /></Field>
        <Field label="노출 종료일"><input type="date" className="input" value={data.end || ''} onChange={(e) => onChange('end', e.target.value)} /></Field>
      </div>
    </React.Fragment>
  );
}
function PopupForm({ data, onChange }) {
  return (
    <React.Fragment>
      <Field label="팝업명"><input className="input" value={data.title || ''} onChange={(e) => onChange('title', e.target.value)} placeholder="예: 개인정보 처리방침 변경 안내" /></Field>
      <Field label="팝업 이미지"><UploadZone files={data.imageFile ? [data.imageFile] : []} onAdd={(list) => onChange('imageFile', list[0])} /></Field>
      <Field label="노출 페이지">
        <select className="input" value={data.pages || '전체'} onChange={(e) => onChange('pages', e.target.value)}>
          <option value="전체">전체 페이지</option><option value="메인">메인 페이지</option><option value="공지사항">공지사항</option>
        </select>
      </Field>
    </React.Fragment>
  );
}

function BannerAdmin({ showToast }) {
  const [tab, setTab] = useState('banner');
  const [banners, setBanners] = useState(INITIAL_BANNERS);
  const [popups, setPopups] = useState(INITIAL_POPUPS);
  const [slide, setSlide] = useState(null);
  const [confirmTarget, setConfirmTarget] = useState(null);

  const onChangeField = (field, value) => setSlide(prev => ({ ...prev, data: { ...prev.data, [field]: value } }));

  const moveOrder = (id, dir) => {
    setBanners(prev => {
      const arr = [...prev].sort((a, b) => a.order - b.order);
      const idx = arr.findIndex(b => b.id === id);
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= arr.length) return prev;
      const tmp = arr[idx].order; arr[idx].order = arr[swapIdx].order; arr[swapIdx].order = tmp;
      return [...arr];
    });
  };
  const saveBanner = (data) => {
    if (data.id) { setBanners(prev => prev.map(b => b.id === data.id ? data : b)); showToast('배너 정보가 수정되었습니다'); }
    else { setBanners(prev => [...prev, { ...data, id: Date.now(), order: prev.length + 1, status: '예약' }]); showToast('배너가 등록되었습니다'); }
    setSlide(null);
  };
  const savePopup = (data) => {
    if (data.id) { setPopups(prev => prev.map(p => p.id === data.id ? data : p)); showToast('팝업 정보가 수정되었습니다'); }
    else { setPopups(prev => [...prev, { ...data, id: Date.now(), enabled: true }]); showToast('팝업이 등록되었습니다'); }
    setSlide(null);
  };
  const doDelete = () => {
    if (!confirmTarget) return;
    if (confirmTarget.kind === 'banner') setBanners(prev => prev.filter(b => b.id !== confirmTarget.id));
    else setPopups(prev => prev.filter(p => p.id !== confirmTarget.id));
    showToast('삭제되었습니다'); setConfirmTarget(null);
  };

  return (
    <div className="canvas-scroll">
      <div className="canvas-inner wide">
        <div className="section-header-row">
          <div><h1 className="page-title">코드 없는 배너·팝업 관리자</h1><div className="page-sub">별도 배포 없이 메인 페이지의 배너와 팝업을 바로 등록·수정할 수 있습니다.</div></div>
          <button className="btn-primary" onClick={() => setSlide({ kind: tab, mode: 'create', data: tab === 'banner' ? { title: '', link: '', start: '', end: '' } : { title: '', pages: '전체' } })}>
            <Icon name="plus" className="ic-14" /> {tab === 'banner' ? '새 배너 등록' : '새 팝업 등록'}
          </button>
        </div>
        <div className="tab-row">
          <button className={'tab-btn' + (tab === 'banner' ? ' active' : '')} onClick={() => setTab('banner')}>배너 관리</button>
          <button className={'tab-btn' + (tab === 'popup' ? ' active' : '')} onClick={() => setTab('popup')}>팝업 관리</button>
        </div>

        {tab === 'banner' ? (
          <table className="data-table">
            <thead><tr><th>순서</th><th>배너명</th><th>노출 기간</th><th>상태</th><th>액션</th></tr></thead>
            <tbody>
              {[...banners].sort((a, b) => a.order - b.order).map(b => (
                <tr key={b.id}>
                  <td><div className="order-cell">
                    <button className="icon-btn sm" onClick={() => moveOrder(b.id, -1)}><Icon name="arrow-up" className="ic-12" /></button>
                    <span>{b.order}</span>
                    <button className="icon-btn sm" onClick={() => moveOrder(b.id, 1)}><Icon name="arrow-down" className="ic-12" /></button>
                  </div></td>
                  <td className="cell-title" onClick={() => setSlide({ kind: 'banner', mode: 'edit', data: b })}>{b.title}</td>
                  <td className="cell-muted">{b.start} ~ {b.end}</td>
                  <td><span className={'badge ' + (b.status === '진행중' ? 'badge-success' : 'badge-neutral')}>{b.status}</span></td>
                  <td className="cell-actions">
                    <button className="icon-btn" onClick={() => setSlide({ kind: 'banner', mode: 'edit', data: b })}><Icon name="pencil" className="ic-14" /></button>
                    <button className="icon-btn" onClick={() => setConfirmTarget({ kind: 'banner', id: b.id, title: b.title })}><Icon name="trash-2" className="ic-14" /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        ) : (
          <table className="data-table">
            <thead><tr><th>팝업명</th><th>노출 페이지</th><th>노출 여부</th><th>액션</th></tr></thead>
            <tbody>
              {popups.map(p => (
                <tr key={p.id}>
                  <td className="cell-title" onClick={() => setSlide({ kind: 'popup', mode: 'edit', data: p })}>{p.title}</td>
                  <td className="cell-muted">{p.pages}</td>
                  <td><span className={'switch' + (p.enabled ? ' on' : '')} onClick={() => setPopups(prev => prev.map(x => x.id === p.id ? { ...x, enabled: !x.enabled } : x))}><span className="switch-knob" /></span></td>
                  <td className="cell-actions">
                    <button className="icon-btn" onClick={() => setSlide({ kind: 'popup', mode: 'edit', data: p })}><Icon name="pencil" className="ic-14" /></button>
                    <button className="icon-btn" onClick={() => setConfirmTarget({ kind: 'popup', id: p.id, title: p.title })}><Icon name="trash-2" className="ic-14" /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <SlideOver open={!!slide} title={slide ? (slide.mode === 'create' ? (slide.kind === 'banner' ? '새 배너 등록' : '새 팝업 등록') : (slide.kind === 'banner' ? '배너 수정' : '팝업 수정')) : ''}
        onClose={() => setSlide(null)}
        footer={slide && (<React.Fragment><button className="btn-ghost" onClick={() => setSlide(null)}>취소</button><button className="btn-primary" onClick={() => (slide.kind === 'banner' ? saveBanner(slide.data) : savePopup(slide.data))}>저장</button></React.Fragment>)}>
        {slide && slide.kind === 'banner' && <BannerForm data={slide.data} onChange={onChangeField} />}
        {slide && slide.kind === 'popup' && <PopupForm data={slide.data} onChange={onChangeField} />}
      </SlideOver>

      <ConfirmModal open={!!confirmTarget} title="삭제하시겠습니까?" desc={confirmTarget ? ('"' + confirmTarget.title + '" 항목이 즉시 삭제됩니다.') : ''}
        onCancel={() => setConfirmTarget(null)} onConfirm={doDelete} />
    </div>
  );
}
</script>
<script type="text/babel">
/* ── 게시판 관리 ── */
function BoardAdmin({ showToast }) {
  const [tab, setTab] = useState('notice');
  const [noticePosts, setNoticePosts] = useState(INITIAL_NOTICE_POSTS);
  const [archivePosts, setArchivePosts] = useState(INITIAL_ARCHIVE_POSTS);
  const [query, setQuery] = useState('');
  const [sortKey, setSortKey] = useState('date');
  const [newPost, setNewPost] = useState(null);
  const [detail, setDetail] = useState(null);

  const posts = tab === 'notice' ? noticePosts : archivePosts;
  const setPosts = tab === 'notice' ? setNoticePosts : setArchivePosts;
  const filtered = posts.filter(p => p.title.includes(query)).sort((a, b) => sortKey === 'views' ? b.views - a.views : (a.date < b.date ? 1 : -1));

  const savePost = () => {
    const item = { id: Date.now(), title: newPost.title || '(제목 없음)', date: '2026.09.17', views: 0, files: (newPost.files || []).length, body: newPost.body || '' };
    setPosts(prev => [item, ...prev]);
    showToast('게시글이 등록되었습니다'); setNewPost(null);
  };

  return (
    <div className="canvas-scroll">
      <div className="canvas-inner wide">
        <div className="section-header-row">
          <div><h1 className="page-title">공지사항·자료집 게시판 관리</h1><div className="page-sub">게시글 작성일·조회수 등 메타정보를 유지하며 첨부파일을 함께 관리합니다.</div></div>
          <button className="btn-primary" onClick={() => setNewPost({ title: '', body: '', files: [] })}><Icon name="plus" className="ic-14" /> 새 글 작성</button>
        </div>
        <div className="tab-row">
          <button className={'tab-btn' + (tab === 'notice' ? ' active' : '')} onClick={() => setTab('notice')}>공지사항</button>
          <button className={'tab-btn' + (tab === 'archive' ? ' active' : '')} onClick={() => setTab('archive')}>학술자료집</button>
        </div>
        <div className="toolbar-row">
          <input className="input search-mini" placeholder="제목 검색" value={query} onChange={(e) => setQuery(e.target.value)} />
          <select className="input select-mini" value={sortKey} onChange={(e) => setSortKey(e.target.value)}>
            <option value="date">최신순</option><option value="views">조회수순</option>
          </select>
        </div>
        <table className="data-table">
          <thead><tr><th>제목</th><th>작성일</th><th>조회수</th><th>첨부</th></tr></thead>
          <tbody>
            {filtered.map(p => (
              <tr key={p.id} onClick={() => setDetail(p)}>
                <td className="cell-title">{p.title}</td>
                <td className="cell-muted">{p.date}</td>
                <td className="cell-muted">{p.views.toLocaleString()}</td>
                <td className="cell-muted">{p.files > 0 ? <span className="file-count"><Icon name="paperclip" className="ic-12" />{p.files}</span> : '—'}</td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="4" className="empty-row">검색 결과가 없습니다.</td></tr>}
          </tbody>
        </table>
      </div>

      <SlideOver open={!!newPost} title="새 글 작성" onClose={() => setNewPost(null)}
        footer={newPost && (<React.Fragment><button className="btn-ghost" onClick={() => setNewPost(null)}>취소</button><button className="btn-primary" onClick={savePost}>등록</button></React.Fragment>)}>
        {newPost && (
          <React.Fragment>
            <Field label="제목"><input className="input" value={newPost.title} onChange={(e) => setNewPost({ ...newPost, title: e.target.value })} /></Field>
            <Field label="본문"><textarea className="input textarea" rows="6" value={newPost.body} onChange={(e) => setNewPost({ ...newPost, body: e.target.value })} placeholder="게시글 내용을 입력해 주세요." /></Field>
            <Field label="첨부파일"><UploadZone files={newPost.files} multiple onAdd={(list) => setNewPost({ ...newPost, files: [...newPost.files, ...list] })} /></Field>
          </React.Fragment>
        )}
      </SlideOver>

      {detail && (
        <div className="modal-overlay" onClick={() => setDetail(null)}>
          <div className="modal-box wide" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header-row">
              <h3 className="modal-title">{detail.title}</h3>
              <button className="icon-btn" onClick={() => setDetail(null)}><Icon name="x" className="ic-16" /></button>
            </div>
            <div className="modal-meta-row"><span>{detail.date}</span><span>조회 {detail.views.toLocaleString()}</span></div>
            <p className="modal-body-text">{detail.body || '게시글 본문 내용이 이 영역에 표시됩니다. 작성일과 조회수는 이관 후에도 원본 메타정보 그대로 유지됩니다.'}</p>
            {detail.files > 0 && (
              <div className="attach-list">
                {Array.from({ length: detail.files }).map((_, i) => (
                  <div key={i} className="attach-item" onClick={() => showToast('다운로드를 시작합니다')}>
                    <Icon name="file-text" className="ic-16" /><span>{detail.title.slice(0, 10)}_첨부{i + 1}.pdf</span><Icon name="download" className="ic-14" />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
</script>
<script type="text/babel">
/* ── 마이그레이션 매핑 도구 ── */
function MigrationTool({ showToast }) {
  const [selectedSource, setSelectedSource] = useState('wp_board');
  const [mapping, setMapping] = useState(INITIAL_MAPPING);
  const [scanning, setScanning] = useState(false);
  const [preview, setPreview] = useState(null);

  const updateMapping = (idx, dst) => setMapping(prev => prev.map((m, i) => i === idx ? { ...m, dst, status: dst ? 'auto' : 'warn' } : m));
  const runPreview = () => {
    setScanning(true); setPreview(null);
    setTimeout(() => { setScanning(false); setPreview(SAMPLE_PREVIEW_ROWS); showToast('샘플 이관 미리보기가 완료되었습니다'); }, 900);
  };
  const warnCount = mapping.filter(m => m.status === 'warn').length;

  return (
    <div className="canvas-scroll">
      <div className="canvas-inner wide">
        <div className="section-header-row">
          <div><h1 className="page-title">레거시 게시글 데이터 이관 매핑 도구</h1><div className="page-sub">기존 MySQL 게시판 컬럼을 새 스키마로 매핑하고, 이관 전 결과를 미리 확인합니다.</div></div>
          <button className="btn-primary" onClick={runPreview}><Icon name="play" className="ic-14" /> 샘플 이관 미리보기 실행</button>
        </div>

        <div className="stat-strip">
          <div className="stat-mini"><span className="stat-mini-num">1,842건</span><span className="stat-mini-label">총 대상 게시글</span></div>
          <div className="stat-mini"><span className="stat-mini-num">{mapping.length - warnCount}/{mapping.length}</span><span className="stat-mini-label">매핑 완료 컬럼</span></div>
          <div className="stat-mini warn"><span className="stat-mini-num">{warnCount}건</span><span className="stat-mini-label">매핑 경고</span></div>
        </div>

        <div className="source-chip-row">
          {SOURCE_TABLES.map(t => (
            <button key={t.name} className={'source-chip' + (selectedSource === t.name ? ' active' : '')} onClick={() => setSelectedSource(t.name)}>
              <Icon name="database" className="ic-12" /> {t.name} <span className="chip-count">{t.rows.toLocaleString()}건</span>
            </button>
          ))}
        </div>

        <table className="data-table">
          <thead><tr><th>원본 컬럼</th><th></th><th>대상 컬럼</th><th>상태</th></tr></thead>
          <tbody>
            {mapping.map((m, i) => (
              <tr key={m.src}>
                <td className="cell-mono">{m.src}</td>
                <td className="cell-arrow"><Icon name="arrow-right" className="ic-14" /></td>
                <td>
                  <select className="input select-mini" value={m.dst} onChange={(e) => updateMapping(i, e.target.value)}>
                    <option value="">— 미매핑 —</option>
                    {TARGET_COLUMNS.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </td>
                <td>{m.status === 'auto' ? <span className="badge badge-neutral"><Icon name="check" className="ic-12" />자동 매핑</span> : <span className="badge badge-warn"><Icon name="triangle-alert" className="ic-12" />미매핑</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>

        {scanning && (<div className="preview-panel"><div className="skeleton" style={{ height: 18, width: '40%', marginBottom: 10 }} /><div className="skeleton" style={{ height: 110 }} /></div>)}

        {preview && !scanning && (
          <div className="preview-panel">
            <div className="preview-panel-title">샘플 이관 결과 미리보기 (5건)</div>
            <table className="data-table">
              <thead><tr><th>id</th><th>title</th><th>created_at</th><th>view_count</th><th>비고</th></tr></thead>
              <tbody>
                {preview.map(r => (
                  <tr key={r.id}>
                    <td className="cell-mono">{r.id}</td><td className="cell-title-static">{r.title}</td>
                    <td className="cell-muted">{r.created_at}</td><td className="cell-muted">{r.view_count}</td>
                    <td>{r.note === '인코딩 경고' ? <span className="badge badge-warn"><Icon name="triangle-alert" className="ic-12" />인코딩 경고</span> : <span className="cell-muted">정상</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [mode, setMode] = useState('site');
  const [selectedPage, setSelectedPage] = useState('about');
  const [pages, setPages] = useState(PAGES);
  const [blocksByPage, setBlocksByPage] = useState(INITIAL_BLOCKS_BY_PAGE);
  const [editMode, setEditMode] = useState(false);
  const [device, setDevice] = useState('desktop');
  const [showPreview, setShowPreview] = useState(false);
  const [expanded, setExpanded] = useState({ content: true, data: true });
  const [openToggles, setOpenToggles] = useState({});
  const [toast, showToast] = useToast();
  useLucideIcons();

  const currentPage = pages.find(p => p.id === selectedPage) || pages[0];
  const currentBlocks = blocksByPage[selectedPage] || [];

  const addBlock = (kind) => setBlocksByPage(prev => ({ ...prev, [selectedPage]: [...(prev[selectedPage] || []), newBlockFor(kind)] }));
  const toggleBlock = (idx) => setOpenToggles(s => ({ ...s, [idx]: !s[idx] }));
  const addPage = () => {
    const id = 'page-' + Date.now();
    setPages(prev => [...prev, { id, title: '새 페이지', icon: 'file-text' }]);
    setBlocksByPage(prev => ({ ...prev, [id]: [{ type: 'heading', text: '새 페이지' }, { type: 'text', text: '내용을 입력해 주세요.' }] }));
    setMode('site'); setSelectedPage(id); showToast('새 페이지가 추가되었습니다');
  };

  return (
    <div className="app-shell" data-archetype="notion-blocks-tree">
      <TreeSidebar mode={mode} selectedPage={selectedPage} pages={pages} expanded={expanded}
        onToggleGroup={(k) => setExpanded(s => ({ ...s, [k]: !s[k] }))}
        onSelectPage={(id) => { setMode('site'); setSelectedPage(id); setEditMode(false); }}
        onSelectMode={(m) => setMode(m)} onAddPage={addPage}
        onTrash={() => showToast('휴지통이 비어 있습니다')} onSettings={() => showToast('자동 저장이 활성화되어 있습니다')} />

      <div className="page-wrap">
        <div className="canvas-col">
          {mode === 'site' && (
            <SiteCanvas key={selectedPage} page={currentPage} blocks={currentBlocks} editMode={editMode}
              onToggleEdit={() => setEditMode(v => !v)} device={device} setDevice={setDevice}
              showPreview={showPreview} setShowPreview={setShowPreview} onAddBlock={addBlock}
              toggleStates={openToggles} onToggleBlock={toggleBlock} showToast={showToast} />
          )}
          {mode === 'banner-admin' && <BannerAdmin showToast={showToast} />}
          {mode === 'board' && <BoardAdmin showToast={showToast} />}
          {mode === 'migration-preview' && <MigrationTool showToast={showToast} />}
        </div>

        {mode === 'site' && (
          <aside className="inspector-col">
            <div className="inspector-section">
              <div className="inspector-label">노출 설정</div>
              <div className="inspector-row"><span><span className="status-dot live"></span>공개 상태</span><span className="switch on"><span className="switch-knob" /></span></div>
            </div>
            <div className="inspector-section"><div className="inspector-label">URL</div><div className="inspector-value cell-mono">/{selectedPage}</div></div>
            <div className="inspector-section"><div className="inspector-label">최종 수정</div><div className="inspector-value">2026.09.14</div></div>
            <button className="btn-ghost full" onClick={() => showToast('미리보기 링크가 복사되었습니다')}><Icon name="link-2" className="ic-14" /> 미리보기 링크 복사</button>
          </aside>
        )}
      </div>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
