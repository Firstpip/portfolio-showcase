:root{

  --m500:#d656da; --m600:#af47b3; --m700:#89378c; --m800:#602762; --m900:#602762;

  --n5:#bab5ba; --n6:#95979e; --n7:#7a717a; --n8:#5a535a; --n9:#3a363a; --n10:#1f1e20;

html,body,#root{margin:0;padding:0;width:100%;min-height:100%;}
body{background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}

.container{max-width:1240px;margin:0 auto;width:100%;}

.card{background:var(--n1);border-radius:18px;padding:22px;box-shadow:0 8px 22px rgba(0,0,0,.07);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;animation:toastIn .25s ease;box-shadow:0 10px 28px rgba(0,0,0,.3);}

.preview-box{padding:16px 18px;background:var(--n2);border-radius:14px;font-size:13px;color:var(--n8);line-height:1.7;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

const { useState, useEffect } = React;
const { AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

function useToast(){
  const [toast, setToast] = useState(null);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);
  return [toast, (msg) => setToast({ msg, key: Date.now() })];
}
function Toast({ toast }) {
  if (!toast) return null;
  return <div className="toast" key={toast.key}><i className="ph ph-check-circle"></i><span>{toast.msg}</span></div>;
}

function RadialProgress({ value, size }) {
  const r = (size - 12) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  const mid = size / 2;
  return (
    <svg width={size} height={size} viewBox={'0 0 ' + size + ' ' + size}>
      <circle cx={mid} cy={mid} r={r} fill="none" stroke="#e6e5e6" strokeWidth="9" />
      <circle cx={mid} cy={mid} r={r} fill="none" stroke="#af47b3" strokeWidth="9"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={'rotate(-90 ' + mid + ' ' + mid + ')'} />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" fontSize="18" fontWeight="800" fill="#3a363a">{value}%</text>

}

                  <Area type="monotone" dataKey="migrated" stroke="#af47b3" fill="#f4d0f5" strokeWidth={2.5} />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          )}
          <div className="hero-foot-row">
            <div className="radial-block"><RadialProgress value={96} size={56} /><span className="radial-label">무결성<br />통과율</span></div>
            <div className="radial-block"><RadialProgress value={99} size={56} /><span className="radial-label">이관 완료<br />진행률</span></div>
          </div>
        </div>

        <div className="kpi-side-col">
          <div className="stat-tile">
            <div className="stat-tile-label">총 이관건수</div>
            <div className="stat-tile-num">1,842건</div>
          </div>
          <div className="stat-tile">
            <div className="stat-tile-label">완료건수</div>
            <div className="stat-tile-num">1,790건</div>
          </div>
          <div className="stat-tile danger">
            <div className="stat-tile-label">실패건수</div>
            <div className="stat-tile-num">4건</div>
          </div>
          <div className="stat-tile">
            <div className="stat-tile-label">무결성 통과율</div>
            <div className="stat-tile-num">96%</div>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="widget-card">
          <div className="widget-title">자료유형별 이관 현황</div>
          <div className="chart-wrap" style={{ height: 140 }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={DONUT_DATA} dataKey="value" nameKey="name" innerRadius={38} outerRadius={58} paddingAngle={2}>
                  {DONUT_DATA.map((d, i) => <Cell key={i} fill={DONUT_COLORS[i % DONUT_COLORS.length]} />)}
                </Pie>
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div className="donut-legend">
            {DONUT_DATA.map((d, i) => (
              <div className="legend-row" key={i}><span className="legend-dot" style={{ background: DONUT_COLORS[i % DONUT_COLORS.length] }}></span>{d.name} · {d.value.toLocaleString()}건</div>
            ))}
          </div>
        </div>

        <div className="widget-card">
          <div className="widget-title">단계별 처리량</div>
          <div className="chart-wrap" style={{ height: 170 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={BAR_DATA} margin={{ top: 6, right: 6, left: -18, bottom: 0 }}>
                <CartesianGrid stroke="#e6e5e6" vertical={false} />
                <XAxis dataKey="stage" tick={{ fontSize: 11, fill: '#95979e' }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: '#95979e' }} axisLine={false} tickLine={false} />
                <Tooltip />
                <Bar dataKey="count" fill="#af47b3" radius={[6, 6, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="widget-card">
          <div className="widget-title">최근 이관 로그</div>
          <div className="timeline-list">
            {RECENT_LOGS.map((l, i) => <div className="timeline-item" key={i}><span className="timeline-time">{l.time}</span><span>{l.text}</span></div>)}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="widget-title">필드 매핑 요약</div>
        <table className="data-table">
          <thead><tr><th>원본 테이블</th><th>원본 컬럼</th><th>대상 컬럼</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {MAPPING_SUMMARY.map(m => (
              <tr key={m.id}>
                <td className="cell-mono">{m.table}</td>
                <td className="cell-mono">{m.src}</td>
                <td className="cell-mono">{m.dst}</td>
                <td>{m.status === '완료' ? <span className="badge badge-neutral"><i className="ph ph-check"></i>완료</span> : <span className="badge badge-warn"><i className="ph ph-warning"></i>경고</span>}</td>
                <td><button className="btn-ghost sm" onClick={() => setDetail(m)}>필드 매핑 상세</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <div className="modal-overlay" onClick={() => setDetail(null)}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header-row">
              <h3 className="modal-title">필드 매핑 상세</h3>
              <button className="icon-btn" onClick={() => setDetail(null)}><i className="ph ph-x"></i></button>
            </div>
            <p className="modal-desc">{detail.table}.{detail.src} → {detail.dst}</p>
            <div className="compare-row">
              <div className="compare-col"><div className="compare-label">원본 샘플값</div><div className="compare-value">{detail.sample}</div></div>
              <div className="compare-col"><div className="compare-label">변환 결과</div><div className="compare-value">{detail.converted}</div></div>
            </div>
            <div className="modal-actions"><button className="btn-ghost" onClick={() => setDetail(null)}>닫기</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
</script>
<script type="text/babel">
/* ── 무결성 검증 리포트 ── */
function IntegrityReport({ showToast }) {
  const reasonBadge = (reason) => {
    if (reason === '첨부파일 누락') return <span className="badge badge-danger"><i className="ph ph-warning-circle"></i>{reason}</span>;
    return <span className="badge badge-warn"><i className="ph ph-warning"></i>{reason}</span>;
  };
  return (
    <div className="container">
      <div className="page-head-row">
        <div>
          <h1 className="page-title">이관 진행률 및 무결성 검증 리포트</h1>
          <div className="page-sub">이관된 게시글과 첨부파일이 원본과 일치하는지 건별로 검증합니다.</div>
        </div>
        <button className="btn-primary" onClick={() => showToast('검증 리포트를 CSV로 내보냅니다')}><i className="ph ph-download-simple"></i> CSV로 내보내기</button>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div className="widget-title">검증 규칙 통과율</div>
        <table className="data-table">
          <thead><tr><th>검증 규칙</th><th>통과</th><th>불일치</th><th style={{ width: 160 }}>통과율</th></tr></thead>
          <tbody>
            {VERIFY_RULES.map((r, i) => {
              const total = r.pass + r.fail;
              const pct = Math.round((r.pass / total) * 100);
              return (
                <tr key={i}>
                  <td className="cell-title">{r.name}</td>
                  <td className="cell-muted">{r.pass.toLocaleString()}</td>
                  <td className="cell-muted">{r.fail > 0 ? <span className="badge badge-warn">{r.fail}</span> : '0'}</td>
                  <td><div className="progress-bar-outer"><div className="progress-bar-inner" style={{ width: pct + '%' }}></div></div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="card">
        <div className="widget-title">불일치 건 목록 ({MISMATCH_LIST.length}건)</div>
        <table className="data-table">
          <thead><tr><th>ID</th><th>제목</th><th>원인</th><th></th></tr></thead>
          <tbody>
            {MISMATCH_LIST.map(m => (
              <tr key={m.id}>
                <td className="cell-mono">{m.id}</td>
                <td className="cell-title">{m.title}</td>
                <td>{reasonBadge(m.reason)}</td>
                <td><button className="btn-ghost sm" onClick={() => showToast('#' + m.id + ' 건을 재처리 큐에 추가합니다')}>재처리</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── 다국어 콘텐츠 관리 ── */
function I18nManager({ showToast }) {
  const [fallback, setFallback] = useState(true);
  const [selected, setSelected] = useState(I18N_PAGES[0]);
  const [lang, setLang] = useState('ko');

  return (
    <div className="container">
      <div className="page-head-row">
        <div>
          <h1 className="page-title">다국어 콘텐츠 관리 확장</h1>
          <div className="page-sub">국문 콘텐츠를 기반으로 영문 간략 페이지를 함께 관리하고, 미번역 페이지는 자동으로 국문 대체됩니다.</div>
        </div>
        <div className="inspector-row" style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 12.5, color: 'var(--n7)', fontWeight: 700 }}>미번역 시 국문 자동 폴백</span>
          <span className={'switch' + (fallback ? ' on' : '')} onClick={() => setFallback(v => !v)}><span className="switch-knob" /></span>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <table className="data-table">
          <thead><tr><th>페이지</th><th>국문</th><th>영문</th><th></th></tr></thead>
          <tbody>
            {I18N_PAGES.map(p => (
              <tr key={p.id} onClick={() => { setSelected(p); setLang('ko'); }}>
                <td className="cell-title">{p.title}</td>
                <td><span className="badge badge-neutral"><i className="ph ph-check"></i>완료</span></td>
                <td>{p.en ? <span className="badge badge-neutral"><i className="ph ph-check"></i>완료</span> : <span className="badge badge-warn"><i className="ph ph-warning"></i>미번역</span>}</td>
                <td className="cell-muted">미리보기</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="card">
        <div className="widget-title">{selected.title} — 언어 전환 미리보기</div>
        <div className="i18n-preview">
          <div className="lang-toggle">
            <button className="lang-btn" data-active={lang === 'ko' ? 'true' : 'false'} onClick={() => setLang('ko')}>KO</button>
            <button className="lang-btn" data-active={lang === 'en' ? 'true' : 'false'} onClick={() => setLang('en')}>EN</button>
          </div>
          {lang === 'en' && !selected.en && <span className="badge badge-warn"><i className="ph ph-warning"></i>번역 없음 — 국문 자동 대체</span>}
        </div>
        <div className="preview-box">
          {lang === 'ko' ? selected.sample.ko : (selected.sample.en || selected.sample.ko)}
        </div>
      </div>
    </div>
  );
}
</script>
<script type="text/babel">
/* ── 감사 로그 ── */
function AuditLog({ showToast }) {
  const [filter, setFilter] = useState('전체');
  const [logs, setLogs] = useState(AUDIT_LOGS_INIT);

  const filtered = filter === '전체' ? logs : logs.filter(l => l.job === filter);

  const retry = (id) => {
    setLogs(prev => prev.map(l => l.id === id ? { ...l, status: '재처리 대기' } : l));
    setTimeout(() => {
      setLogs(prev => prev.map(l => l.id === id ? { ...l, status: '재시도 완료' } : l));
      showToast('재처리가 완료되었습니다');
    }, 900);
  };

  return (
    <div className="container">
      <div className="page-head-row">
        <div>
          <h1 className="page-title">이관 실패 건 재처리 및 감사 로그</h1>
          <div className="page-sub">실패한 이관 작업을 재시도하고 전체 처리 이력을 작업 단위로 추적합니다.</div>
        </div>
      </div>

      <div className="tab-row-sub">
        {['전체', '스캔', '매핑', '이관', '검증'].map(f => (
          <button key={f} className="chip-btn" data-active={filter === f ? 'true' : 'false'} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>

      <div className="card">
        <table className="data-table">
          <thead><tr><th>시각</th><th>작업</th><th>상태</th><th>상세</th><th></th></tr></thead>
          <tbody>
            {filtered.map(l => (
              <tr key={l.id}>
                <td className="cell-mono">{l.time}</td>
                <td className="cell-title">{l.job}</td>
                <td>
                  {l.status === '실패' && <span className="badge badge-danger"><i className="ph ph-x-circle"></i>실패</span>}
                  {l.status === '완료' && <span className="badge badge-neutral"><i className="ph ph-check"></i>완료</span>}
                  {l.status === '재시도 완료' && <span className="badge badge-neutral"><i className="ph ph-check"></i>재시도 완료</span>}
                  {l.status === '재처리 대기' && <span className="badge badge-warn"><i className="ph ph-hourglass"></i>재처리 대기</span>}
                </td>
                <td className="cell-muted">{l.detail}</td>
                <td>{l.status === '실패' && <button className="btn-ghost sm" onClick={() => retry(l.id)}>재시도</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [tab, setTab] = useState('main');
  const [toast, showToast] = useToast();

  return (
    <div className="app-shell" data-archetype="topbar-analytics">
      <header className="topnav">
        <div className="brand"><span className="brand-mark"></span>이관 콘솔</div>
        <nav className="topnav-tabs">
          <button className="tab-btn" data-active={tab === 'main' ? 'true' : 'false'} onClick={() => setTab('main')}>레거시 DB 스캔·필드 매핑 마이그레이션 콘솔</button>
          <button className="tab-btn" data-active={tab === 'integrity' ? 'true' : 'false'} onClick={() => setTab('integrity')}>이관 진행률 및 무결성 검증 리포트</button>
          <button className="tab-btn" data-active={tab === 'i18n' ? 'true' : 'false'} onClick={() => setTab('i18n')}>다국어 콘텐츠 관리 확장</button>
          <button className="tab-btn" data-active={tab === 'audit-log' ? 'true' : 'false'} onClick={() => setTab('audit-log')}>이관 실패 건 재처리 및 감사 로그</button>
        </nav>
        <div className="topnav-right">
          <button className="icon-btn" onClick={() => showToast('알림이 없습니다')}><i className="ph ph-bell"></i></button>
          <span className="avatar">관</span>
        </div>
      </header>

      <main className="main-area">
        {tab === 'main' && <MainConsole showToast={showToast} />}
        {tab === 'integrity' && <IntegrityReport showToast={showToast} />}
        {tab === 'i18n' && <I18nManager showToast={showToast} />}
        {tab === 'audit-log' && <AuditLog showToast={showToast} />}
      </main>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
