<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파츠허브 — 자동차 부품 통합 검색·비교 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 23°, light) ── */
:root{
  --m50:#fbf5f1;
  --m100:#f6ebe4;
  --m200:#eed7c9;
  --m300:#e4bfa8;
  --m400:#d8a383;
  --m500:#cd8a60;
  --m600:#c2703d;
  --m700:#9f5c32;
  --m800:#7c4827;
  --m900:#57321b;
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#f0f0ef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab7b5;
  --n6:#989390;
  --n7:#777b86;
  --n8:#5a5653;
  --n9:#3a3836;
  --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100%;}
body{font-family:'Pretendard',-apple-system,sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;}
#app-root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}

/* ===== keyframes ===== */
@keyframes fadeInUp { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes rippleFx { from{transform:scale(0); opacity:.5;} to{transform:scale(2.6); opacity:0;} }
@keyframes drawerIn { from{transform:translateX(100%);} to{transform:translateX(0);} }
@keyframes toastIn { from{opacity:0; transform:translate(-50%,14px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes shimmerMove { from{background-position:-300px 0;} to{background-position:300px 0;} }
@keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ===== search header ===== */
.search-header{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--n3);}
.header-row{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:24px; padding:16px 28px;}
.brand{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; color:var(--n10); flex-shrink:0;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;}
.search-bar{flex:1; display:flex; align-items:center; background:var(--n1); border-radius:9999px; border:1px solid var(--n3); padding:4px; max-width:640px; transition:box-shadow .2s;}
.search-bar:focus-within{box-shadow:0 0 0 3px var(--m100); border-color:var(--m400);}
.search-segment{flex:1; display:flex; flex-direction:column; align-items:flex-start; padding:6px 18px; border-radius:9999px; background:transparent; transition:background .15s; min-width:0;}
.search-segment:hover{background:var(--n0);}
.segment-label{font-size:11px; font-weight:700; color:var(--n8);}
.segment-value{font-size:13px; color:var(--n6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
.segment-value.filled{color:var(--n9);}
.search-divider{width:1px; height:26px; background:var(--n4);}
.search-submit{width:38px; height:38px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.search-submit:hover{background:var(--m700);}
.header-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.header-nav button{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--n7); padding:9px 13px; border-radius:9999px; white-space:nowrap;}
.header-nav button:hover{background:var(--n1); color:var(--n9);}
.header-nav button.active{background:var(--m50); color:var(--m700);}
.header-icons{display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:4px;}
.icon-btn{position:relative; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n8);}
.icon-btn:hover{background:var(--n1);}
.icon-badge{position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 3px; border-radius:9999px; background:var(--m600); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;}

.filter-chips{display:flex; gap:8px; overflow-x:auto; padding:12px 28px 14px; max-width:1280px; margin:0 auto; scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9999px; border:1px solid var(--n3); font-size:13px; font-weight:600; color:var(--n8); background:var(--n0); white-space:nowrap; flex-shrink:0; transition:all .15s;}
.chip:hover{border-color:var(--n5);}
.chip.active{background:var(--m600); border-color:var(--m600); color:#fff;}
.chip.filter-toggle{background:var(--n9); color:#fff; border-color:var(--n9);}

/* ===== layout shell ===== */
.page-wrap{max-width:1280px; margin:0 auto; padding:28px;}
.hero-heading{font-size:46px; font-weight:400; line-height:1.16; letter-spacing:-0.02em; color:var(--n10); margin:6px 0 6px;}
.hero-sub{font-size:14.5px; color:var(--n7); margin-bottom:20px;}
.editorial-strip{display:flex; align-items:center; gap:14px; background:#fbe1d1; color:#5d2a1a; border-radius:20px; padding:16px 22px; margin-bottom:26px;}
.editorial-strip .label{font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; opacity:.75;}
.editorial-strip .msg{font-size:14px; font-weight:700;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
.section-title{font-size:26px; font-weight:800; letter-spacing:-0.02em; color:var(--n10);}
.section-sub{font-size:13.5px; color:var(--n7); margin-top:4px;}
.result-count{font-size:13px; color:var(--n7);}

/* ===== card grid (gallery) ===== */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
.listing-card{background:var(--n0); border:1px solid var(--n3); border-radius:20px; overflow:hidden; cursor:pointer; transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; animation:fadeInUp .5s ease backwards;}
.listing-card:hover{transform:translateY(-5px); box-shadow:0 16px 32px -18px rgba(32,30,30,.28); border-color:var(--n4);}
.card-image-wrap{position:relative; aspect-ratio:4/3; background:linear-gradient(135deg, var(--m100), var(--n1)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
.card-image-wrap .tile-icon{width:52px; height:52px; border-radius:16px; background:var(--n0); display:flex; align-items:center; justify-content:center; color:var(--m600); box-shadow:0 6px 16px -8px rgba(32,30,30,.25);}
.card-image-wrap .tile-num{font-size:20px; font-weight:800; color:var(--n9);}
.card-image-wrap .tile-spec{font-size:11.5px; color:var(--n7); font-weight:600;}
.card-favorite{position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--n7); transition:color .15s, transform .15s;}
.card-favorite:hover{transform:scale(1.08);}
.card-favorite.on{color:var(--m600);}
.card-condition{position:absolute; top:12px; left:12px; padding:4px 10px; border-radius:9999px; background:var(--n0); font-size:11px; font-weight:700; color:var(--n8); border:1px solid var(--n3);}
.card-body{padding:16px;}
.card-row-1{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
.card-title{font-size:15.5px; font-weight:700; color:var(--n10); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-rating{display:flex; align-items:center; gap:3px; font-size:13px; font-weight:700; color:var(--n8); flex-shrink:0;}
.card-meta{font-size:12.5px; color:var(--n7); display:block; margin-bottom:2px;}
.card-row-4{display:flex; align-items:baseline; justify-content:space-between; margin-top:10px;}
.card-price{font-size:17px; font-weight:800; color:var(--n10);}
.price-unit{font-size:12px; color:var(--n6); margin-left:2px;}
.card-sellers{font-size:12px; color:var(--n7); font-weight:700;}

/* ===== drawer (quick-view) ===== */
.overlay{position:fixed; inset:0; background:rgba(32,30,30,.42); z-index:60; display:flex; justify-content:flex-end; animation:fadeInUp .2s ease;}
.drawer{width:420px; max-width:92vw; height:100%; background:var(--n0); box-shadow:-24px 0 48px -24px rgba(0,0,0,.3); animation:drawerIn .28s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column;}
.drawer-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--n3);}
.drawer-head h3{font-size:16px; font-weight:800;}
.drawer-close{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.drawer-close:hover{background:var(--n1);}
.drawer-body{padding:22px; overflow-y:auto; flex:1;}
.drawer-tile{width:100%; aspect-ratio:16/9; border-radius:16px; background:linear-gradient(135deg, var(--m100), var(--n1)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; margin-bottom:18px;}
.drawer-tile .tile-icon{width:64px; height:64px; border-radius:18px; background:var(--n0); display:flex; align-items:center; justify-content:center; color:var(--m600);}
.spec-list{display:flex; flex-direction:column; gap:10px; margin:18px 0;}
.spec-row{display:flex; justify-content:space-between; font-size:13.5px; padding-bottom:10px; border-bottom:1px dashed var(--n3);}
.spec-row .k{color:var(--n7);}
.spec-row .v{font-weight:700; color:var(--n9);}
.drawer-actions{display:flex; gap:10px; margin-top:18px;}

/* ===== buttons ===== */
.btn{position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:14px; font-weight:700; border-radius:9999px; padding:12px 22px; transition:transform .15s, background .15s, box-shadow .15s;}
.btn-primary{background:var(--m600); color:#fff; box-shadow:0 10px 22px -12px var(--m600);}
.btn-primary:hover{background:var(--m700); transform:translateY(-1px);}
.btn-ghost{background:var(--n0); color:var(--n9); border:1.5px solid var(--n4);}
.btn-ghost:hover{border-color:var(--n6);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px; font-size:13px;}

/* ===== compare screen ===== */
.compare-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.sort-group{display:flex; gap:6px; flex-wrap:wrap;}
.sort-btn{padding:8px 14px; border-radius:9999px; border:1px solid var(--n3); font-size:12.5px; font-weight:700; color:var(--n7);}
.sort-btn.active{background:var(--n9); color:#fff; border-color:var(--n9);}
.compare-list{display:flex; flex-direction:column; gap:12px;}
.seller-row{display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:18px; border:1.5px solid var(--n3); background:var(--n0); transition:border-color .15s, box-shadow .15s;}
.seller-row.best{border-color:var(--m400); background:var(--m50); box-shadow:0 10px 24px -18px var(--m600);}
.seller-row.soldout{opacity:.55;}
.seller-avatar{width:46px; height:46px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;}
.seller-info{flex:1; min-width:0;}
.seller-name-row{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.seller-name{font-weight:700; font-size:14.5px; color:var(--n10);}
.recommend-badge{padding:2px 9px; border-radius:9999px; background:var(--m600); color:#fff; font-size:11px; font-weight:800;}
.seller-meta-row{display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--n7); flex-wrap:wrap;}
.status-pill{padding:3px 10px; border-radius:9999px; font-size:11.5px; font-weight:700; background:var(--n2); color:var(--n8);}
.status-pill.ok{background:var(--s1-bg); color:var(--s1-text);}
.seller-price-col{text-align:right; flex-shrink:0; min-width:110px;}
.seller-price{font-size:19px; font-weight:800; color:var(--n10);}

/* ===== product detail ===== */
.product-grid{display:grid; grid-template-columns:1fr 380px; gap:32px; align-items:start;}
.product-gallery{position:relative;}
.gallery-tile{width:100%; aspect-ratio:1/1; border-radius:22px; background:linear-gradient(135deg, var(--m100), var(--n1)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
.gallery-tile .tile-icon{width:88px; height:88px; border-radius:24px; background:var(--n0); display:flex; align-items:center; justify-content:center; color:var(--m600); box-shadow:0 14px 30px -16px rgba(32,30,30,.3);}
.gallery-dots{display:flex; gap:6px; justify-content:center; margin-top:14px;}
.gdot{width:7px; height:7px; border-radius:50%; background:var(--n4); transition:background .15s, width .15s;}
.gdot.active{background:var(--m600); width:20px; border-radius:9999px;}
.tab-bar{display:flex; gap:4px; margin-top:26px; border-bottom:1px solid var(--n3);}
.tab{padding:12px 6px; margin-right:22px; font-size:14px; font-weight:700; color:var(--n6); border-bottom:2px solid transparent; position:relative; top:1px;}
.tab.active{color:var(--n10); border-color:var(--m600);}
.tab-panel{padding:20px 2px; font-size:13.5px; line-height:1.8; color:var(--n8);}
.compat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.compat-item{padding:10px 14px; border-radius:12px; background:var(--n1); font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;}
.compat-item.match{background:var(--s1-bg); color:var(--s1-text);}
.buy-box{border:1.5px solid var(--n3); border-radius:20px; padding:22px; position:sticky; top:92px;}
.buy-price{font-size:26px; font-weight:800; color:var(--n10); margin-bottom:4px;}
.buy-stock{font-size:12.5px; color:var(--n7); margin-bottom:18px;}
.qty-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.qty-control{display:flex; align-items:center; border:1.5px solid var(--n3); border-radius:9999px; overflow:hidden;}
.qty-control button{width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--n8);}
.qty-control button:hover{background:var(--n1);}
.qty-control span{width:32px; text-align:center; font-weight:700;}
.seller-card{display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; background:var(--n1); margin-top:18px;}
.seller-card .info{flex:1;}
.seller-card .name{font-weight:700; font-size:13.5px;}
.seller-card .sub{font-size:12px; color:var(--n7); margin-top:2px;}

.review-section{margin-top:44px;}
.review-item{display:flex; gap:14px; padding:18px 0; border-bottom:1px solid var(--n3);}
.review-body{flex:1;}
.review-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.review-name{font-weight:700; font-size:13.5px;}
.review-date{font-size:12px; color:var(--n6);}
.review-stars{color:var(--n8); font-size:13px; margin-bottom:6px;}
.review-text{font-size:13.5px; color:var(--n8); line-height:1.65;}

/* ===== order screen ===== */
.order-grid{display:grid; grid-template-columns:1fr 360px; gap:32px; align-items:start;}
.order-card{border:1px solid var(--n3); border-radius:18px; padding:22px; margin-bottom:16px; background:var(--n0);}
.order-card h4{font-size:14.5px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:700; color:var(--n7);}
.field input, .field select{border:1.5px solid var(--n3); border-radius:11px; padding:11px 13px; font-size:13.5px; color:var(--n9); background:var(--n0);}
.field input:focus, .field select:focus{outline:none; border-color:var(--m500); box-shadow:0 0 0 3px var(--m100);}
.pay-options{display:flex; flex-direction:column; gap:10px;}
.pay-opt{display:flex; align-items:center; gap:10px; padding:13px 15px; border:1.5px solid var(--n3); border-radius:13px;}
.pay-opt.active{border-color:var(--m500); background:var(--m50);}
.radio-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--n4); flex-shrink:0; position:relative;}
.pay-opt.active .radio-dot{border-color:var(--m600);}
.pay-opt.active .radio-dot::after{content:''; position:absolute; inset:3px; border-radius:50%; background:var(--m600);}
.point-row{display:flex; align-items:center; gap:10px;}
.point-row input{flex:1;}
.summary-line{display:flex; justify-content:space-between; font-size:13.5px; color:var(--n7); margin-bottom:10px;}
.summary-line.total{font-size:16px; font-weight:800; color:var(--n10); border-top:1px solid var(--n3); padding-top:14px; margin-top:6px;}
.timeline{display:flex; align-items:center; margin:18px 0 6px;}
.tl-step{flex:1; text-align:center; position:relative;}
.tl-dot{width:14px; height:14px; border-radius:50%; background:var(--n3); margin:0 auto 8px; position:relative; z-index:2;}
.tl-step.done .tl-dot{background:var(--s1);}
.tl-step.current .tl-dot{background:var(--m600); animation:pulseDot 1.4s ease infinite;}
.tl-line{position:absolute; top:7px; left:-50%; width:100%; height:2px; background:var(--n3); z-index:1;}
.tl-step.done .tl-line{background:var(--s1);}
.tl-step:first-child .tl-line{display:none;}
.tl-label{font-size:11.5px; color:var(--n7); font-weight:600;}
.mypage-order{display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--n3);}
.mypage-order .thumb{width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,var(--m100),var(--n1)); display:flex; align-items:center; justify-content:center; color:var(--m600); flex-shrink:0;}

.point-banner{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-radius:16px; background:var(--n9); color:#fff; margin-bottom:22px;}
.point-banner .amt{font-size:20px; font-weight:800;}

/* ===== modal / toast ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(32,30,30,.45); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{width:420px; max-width:100%; background:var(--n0); border-radius:22px; padding:26px; animation:fadeInUp .22s ease;}
.modal-box h3{font-size:16.5px; font-weight:800; margin-bottom:16px;}
.star-picker{display:flex; gap:6px; margin-bottom:16px;}
.star-picker button{color:var(--n4); font-size:26px;}
.star-picker button.on{color:var(--n9);}
.modal-box textarea{width:100%; border:1.5px solid var(--n3); border-radius:12px; padding:12px; font-size:13.5px; min-height:90px; resize:vertical; margin-bottom:16px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}

.toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:var(--n9); color:#fff; padding:13px 22px; border-radius:9999px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:100; animation:toastIn .25s ease;}

.skeleton{background:linear-gradient(90deg, var(--n2) 25%, var(--n1) 37%, var(--n2) 63%); background-size:400px 100%; animation:shimmerMove 1.2s ease infinite; border-radius:20px;}

.footer{border-top:1px solid var(--n3); margin-top:60px; padding:44px 28px;}
.footer-cols{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:32px;}
.footer-col h4{font-size:13px; font-weight:700; color:var(--n9); margin-bottom:12px;}
.footer-col a{display:block; font-size:12.5px; color:var(--n7); margin-bottom:8px;}
.footer-brand{font-size:12.5px; color:var(--n6); line-height:1.7;}

.ripple-span{position:absolute; border-radius:50%; background:rgba(255,255,255,.55); transform:scale(0); animation:rippleFx .6s ease-out; pointer-events:none;}

@media (max-width:860px){

function Ripple({onClick, children, className, style}){
  const ref = useRef(null);
  const handle = (e) => {
    const btn = ref.current;
    if (btn){
      const rect = btn.getBoundingClientRect();
      const span = document.createElement('span');
      span.className = 'ripple-span';
      const size = Math.max(rect.width, rect.height);
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size/2) + 'px';
      span.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(span);
      setTimeout(() => span.remove(), 620);
    }
    onClick && onClick(e);
  };
  return <button ref={ref} className={className} style={{position:'relative', overflow:'hidden', ...style}} onClick={handle}>{children}</button>;
}

    <div className="page-wrap">

          <div className="section-title">판매자별 가격·재고 비교</div>

          </div>
        </div>
      </div>
    </div>
  );
}

function OrderView({cart, points, onSubmitOrder, orders, onReview}){
  const [addr, setAddr] = useState('서울시 강남구 테헤란로 1');
  const [phone, setPhone] = useState('010-0000-0000');
  const [pay, setPay] = useState('card');
  const [usePoint, setUsePoint] = useState(0);
  const [reviewModal, setReviewModal] = useState(null);
  const [stars, setStars] = useState(5);
  const [reviewText, setReviewText] = useState('');

  const itemsTotal = cart.length ? cart.reduce((s,c) => s + c.price*c.qty, 0) : (PARTS[0].price);
  const shipFee = 3000;
  const pointUse = Math.min(usePoint, points, itemsTotal);
  const total = Math.max(0, itemsTotal + shipFee - pointUse);

  return (
    <div className="page-wrap">
      <div className="point-banner">
        <div>
          <div style={{fontSize:12.5, opacity:.75, marginBottom:2}}>보유 포인트</div>
          <div className="amt">{points.toLocaleString()}P</div>
        </div>
        <Icon name="gift" size={24}/>
      </div>
      <div className="section-head"><div className="section-title">주문 · 결제</div></div>
      <div className="order-grid">
        <div>
          <div className="order-card">
            <h4><Icon name="package" size={16}/> 주문 상품</h4>
            {(cart.length ? cart : [{...PARTS[0], qty:1}]).map((c,i) => (
              <div className="mypage-order" key={i} style={{borderBottom: i===cart.length-1 ? 'none':'1px solid var(--n3)'}}>
                <div className="thumb"><Icon name={c.icon} size={22}/></div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700, fontSize:13.5}}>{c.name}</div>
                  <div style={{fontSize:12, color:'var(--n7)', marginTop:2}}>수량 {c.qty}개 · {c.price.toLocaleString()}원</div>
                </div>
              </div>
            ))}
          </div>
          <div className="order-card">
            <h4><Icon name="map-pin" size={16}/> 배송지</h4>
            <div className="field-row">
              <div className="field"><label>받는 분 주소</label><input value={addr} onChange={e => setAddr(e.target.value)} /></div>
              <div className="field"><label>연락처</label><input value={phone} onChange={e => setPhone(e.target.value)} /></div>
            </div>
          </div>
          <div className="order-card">
            <h4><Icon name="credit-card" size={16}/> 결제 수단</h4>
            <div className="pay-options">
              {[{id:'card', label:'신용·체크카드'}, {id:'easy', label:'간편결제 (카카오페이·네이버페이)'}, {id:'bank', label:'무통장입금'}].map(o => (
                <div key={o.id} className={'pay-opt' + (pay===o.id?' active':'')} onClick={() => setPay(o.id)}>
                  <div className="radio-dot"></div>
                  <span style={{fontSize:13.5, fontWeight:600}}>{o.label}</span>
                </div>
              ))}
            </div>
            <div style={{marginTop:16}}>
              <label style={{fontSize:12, fontWeight:700, color:'var(--n7)', display:'block', marginBottom:6}}>포인트 사용 (보유 {points.toLocaleString()}P)</label>
              <div className="point-row">
                <input type="number" min="0" max={points} value={usePoint} onChange={e => setUsePoint(Math.max(0, Math.min(points, Number(e.target.value)||0)))} />
                <button className="btn btn-ghost btn-sm" onClick={() => setUsePoint(points)}>전액 사용</button>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div className="order-card">
            <h4><Icon name="receipt" size={16}/> 결제 금액</h4>
            <div className="summary-line"><span>상품 금액</span><span>{itemsTotal.toLocaleString()}원</span></div>
            <div className="summary-line"><span>배송비</span><span>{shipFee.toLocaleString()}원</span></div>
            <div className="summary-line"><span>포인트 사용</span><span>-{pointUse.toLocaleString()}P</span></div>
            <div className="summary-line total"><span>총 결제금액</span><span>{total.toLocaleString()}원</span></div>
            <button className="btn btn-primary btn-block" style={{marginTop:16}} onClick={() => onSubmitOrder(total, pointUse)}>결제하기</button>
          </div>

          {orders.length>0 && (
            <div className="order-card">
              <h4><Icon name="truck" size={16}/> 주문 내역</h4>
              {orders.map((o,i) => (
                <div key={i} style={{marginBottom: i===orders.length-1?0:22, paddingBottom: i===orders.length-1?0:20, borderBottom: i===orders.length-1?'none':'1px solid var(--n3)'}}>
                  <div style={{fontSize:13, fontWeight:700, marginBottom:4}}>{o.name}</div>
                  <div style={{fontSize:11.5, color:'var(--n7)', marginBottom:10}}>{o.date} · {o.total.toLocaleString()}원</div>
                  <div className="timeline">
                    {['주문확인','배송중','배송완료'].map((step, si) => (
                      <div key={step} className={'tl-step' + (si<o.stage?' done':'') + (si===o.stage?' current':'')}>
                        <div className="tl-line"></div>
                        <div className="tl-dot"></div>
                        <div className="tl-label">{step}</div>
                      </div>
                    ))}
                  </div>
                  {o.stage>=2 && !o.reviewed && (
                    <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}} onClick={() => {setReviewModal(o); setStars(5); setReviewText('');}}>후기 작성하기</button>
                  )}
                  {o.reviewed && <div style={{fontSize:12, color:'var(--s1-text)', fontWeight:700, marginTop:8}}><Icon name="check-circle" size={12}/> 후기 작성 완료 · 포인트 적립됨</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {reviewModal && (
        <div className="modal-overlay" onClick={() => setReviewModal(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3>구매 후기 작성</h3>
            <div className="star-picker">
              {[1,2,3,4,5].map(n => <button key={n} className={n<=stars?'on':''} onClick={() => setStars(n)}>★</button>)}
            </div>
            <textarea placeholder="상품과 배송에 대한 후기를 남겨주세요" value={reviewText} onChange={e => setReviewText(e.target.value)}></textarea>
            <div className="modal-actions">
              <button className="btn btn-ghost btn-sm" onClick={() => setReviewModal(null)}>취소</button>
              <button className="btn btn-primary btn-sm" onClick={() => {onReview(reviewModal, stars, reviewText); setReviewModal(null);}}>등록하고 포인트 받기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Footer(){
  return (
    <footer className="footer">
      <div className="footer-cols">
        <div className="footer-col">
          <div className="brand" style={{marginBottom:10}}><span className="brand-mark">P</span>파츠허브</div>
          <p className="footer-brand">차종·부품명·품번으로 검색하고 여러 판매자를 비교해 구매하는<br/>자동차 부품 오픈마켓 — 자체 개발 프로젝트</p>
        </div>
        <div className="footer-col"><h4>서비스</h4><a>부품 검색</a><a>판매자 비교</a><a>부품 찾기 요청</a></div>
        <div className="footer-col"><h4>판매자</h4><a>입점 신청</a><a>판매자 오피스</a><a>정산 안내</a></div>
        <div className="footer-col"><h4>고객센터</h4><a>자주 묻는 질문</a><a>1:1 문의</a><a>이용약관</a></div>
      </div>
      <div style={{maxWidth:1280, margin:'28px auto 0', fontSize:11.5, color:'var(--n6)'}}>© 2026 파츠허브 — 데모 프로젝트 (실제 서비스 아님)</div>
    </footer>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [selected, setSelected] = useState(PARTS[0]);
  const [quick, setQuick] = useState(null);
  const [wish, setWish] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([{name:'전륜 브레이크 패드 세트', date:'2026.09.10', total:52000, stage:2, reviewed:false}]);
  const [points, setPoints] = useState(3200);
  const [toast, setToast] = useState('');

  useIcons([view, quick, cart, orders]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };
  const toggleWish = (id) => setWish(w => w.includes(id) ? w.filter(x=>x!==id) : [...w, id]);

  const openQuick = (p) => setQuick(p);
  const goCompare = (p) => { setSelected(p); setQuick(null); setView('compare'); };
  const goProduct = (p) => { setSelected(p); setQuick(null); setView('product'); };
  const addFromCompare = (seller) => { setCart(c => [...c, {...selected, qty:1, price:seller.price}]); showToast(selected.name + ' 장바구니에 담았습니다'); };
  const addCart = (p, qty) => { setCart(c => [...c, {...p, qty}]); showToast('장바구니에 담았습니다'); };
  const buyNow = (p, qty) => { setCart([{...p, qty}]); setView('order'); };
  const submitOrder = (total, pointUse) => {
    setPoints(pt => pt - pointUse + Math.round(total*0.01));
    setOrders(o => [{name: (cart[0]||PARTS[0]).name, date:'2026.09.18', total, stage:0, reviewed:false}, ...o]);
    setCart([]);
    showToast('결제가 완료되었습니다 · ' + Math.round(total*0.01) + 'P 적립 예정');
  };
  const submitReview = (order, stars, text) => {
    setOrders(os => os.map(o => o===order ? {...o, reviewed:true} : o));
    setPoints(pt => pt + 300);
    showToast('후기가 등록되었습니다 · 300P 적립완료');
  };

  return (
    <div style={{width:'100%'}}>
      <Header view={view} setView={setView} cartCount={cart.length} wishCount={wish.length} onToast={showToast} />
      {view==='main' && <MainView onOpenQuick={openQuick} onToast={showToast} wish={wish} toggleWish={toggleWish} />}
      {view==='compare' && <CompareView part={selected} onAdd={addFromCompare} onGoProduct={goProduct} />}
      {view==='product' && <ProductView part={selected} onAddCart={addCart} onBuyNow={buyNow} />}
      {view==='order' && <OrderView cart={cart} points={points} onSubmitOrder={submitOrder} orders={orders} onReview={submitReview} />}
      {view==='main' && <Footer />}
      <QuickView part={quick} onClose={() => setQuick(null)} onGoCompare={goCompare} onGoProduct={goProduct} />
      {toast && <div className="toast"><Icon name="check-circle" size={15}/>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
