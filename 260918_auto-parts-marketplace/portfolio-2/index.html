<html lang="ko">
<head>

<title>파츠허브 운영콘솔 — 판매자·정산·플랫폼 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 221°, light) ── */
:root{
  --m50:#f0f4fe;
  --m100:#e0e9fc;
  --m200:#c2d3f9;
  --m300:#9db9f6;
  --m400:#739bf2;
  --m500:#4c7fef;
  --m600:#2563eb;
  --m700:#1e51c1;
  --m800:#183f96;
  --m900:#112d6a;
  --n0:#ffffff;
  --n1:#f5f5f5;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909298;
  --n7:#71747a;
  --n8:#262626;
  --n9:#36373a;
  --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100%;}
body{font-family:'Pretendard',-apple-system,sans-serif; background:var(--n1); color:var(--n8); -webkit-font-smoothing:antialiased; font-size:13.5px;}
#app-shell{width:100%; display:flex; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
table{border-collapse:collapse; width:100%;}

@keyframes fadeInUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes rowIn { from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
@keyframes toastIn { from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes barGrow { from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes spinCircle { to{transform:rotate(360deg);} }
@keyframes countPulse { 0%{transform:scale(1);} 30%{transform:scale(1.08);} 100%{transform:scale(1);} }

/* ===== sidebar ===== */
.sidebar{width:240px; flex-shrink:0; background:var(--n0); border-right:1px solid var(--n3); display:flex; flex-direction:column; height:100vh; position:sticky; top:0;}
.sidebar-brand{display:flex; align-items:center; gap:9px; padding:18px 18px 14px;}
.sidebar-brand .mark{width:26px; height:26px; border-radius:7px; background:var(--n10); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
.sidebar-brand .name{font-size:14px; font-weight:700;}
.env-pill{margin-left:auto; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:9999px; background:var(--n2); color:var(--n7);}
.sidebar-section{padding:14px 10px 4px;}
.sidebar-section-title{font-size:10.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.04em; padding:0 10px 8px;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:2px;}
.sidebar-link i{font-size:16px; flex-shrink:0;}
.sidebar-link:hover{background:var(--n1); color:var(--n9);}
.sidebar-link.active{background:var(--m50); color:var(--m700);}
.sidebar-foot{margin-top:auto; padding:14px 16px; border-top:1px solid var(--n3); display:flex; align-items:center; gap:10px;}
.sidebar-foot .who{flex:1; min-width:0;}
.sidebar-foot .name{font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sidebar-foot .role{font-size:10.5px; color:var(--n6);}

/* ===== main ===== */
.main-wrap{flex:1; min-width:0; display:flex; flex-direction:column;}
.main{padding:26px 30px; width:100%;}
.page-header{margin-bottom:20px;}
.page-title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.page-title{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
.page-actions{display:flex; gap:8px;}
.btn{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; border-radius:8px; padding:9px 14px; transition:all .15s;}
.btn-secondary{background:var(--n0); border:1px solid var(--n3); color:var(--n8);}
.btn-secondary:hover{border-color:var(--n5);}
.btn-primary{background:var(--n10); color:#fff;}
.btn-primary:hover{background:var(--m700); }
.btn-primary.accent{background:var(--m600);}
.btn-primary.accent:hover{background:var(--m700);}
.btn-sm{padding:7px 11px; font-size:12px;}
.btn-danger-ghost{background:var(--n0); border:1px solid var(--n3); color:var(--n7);}
.page-meta{font-size:11.5px; color:var(--n6); margin-top:6px;}

/* ===== ops banner ===== */
.ops-banner{background:linear-gradient(135deg, var(--m700), var(--m900)); color:#fff; border-radius:12px; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.ops-banner-title{font-size:16.5px; font-weight:800; margin-bottom:4px;}
.ops-banner-sub{font-size:12px; opacity:.82;}

/* ===== stat row ===== */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:18px 20px; animation:fadeInUp .4s ease backwards;}
.stat-label{font-size:11.5px; color:var(--n7); font-weight:600; margin-bottom:8px;}
.stat-value{font-size:28px; font-weight:800; color:var(--n9); animation:countPulse .5s ease;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:6px; display:flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--s1-text);}
.stat-delta.negative{color:var(--s2-text);}
.stat-delta.neutral{color:var(--n6);}
.stat-sparkline{width:100%; height:28px; margin-top:10px;}

/* ===== master-detail (심사 대기) ===== */
.review-panel{display:grid; grid-template-columns:340px 1fr; gap:0; background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden; margin-bottom:24px;}
.review-list{border-right:1px solid var(--n3); max-height:360px; overflow-y:auto;}
.review-list-head{padding:14px 16px; border-bottom:1px solid var(--n3); font-size:12.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.review-item{padding:13px 16px; border-bottom:1px solid var(--n2); cursor:pointer; animation:rowIn .3s ease backwards;}
.review-item:hover{background:var(--n1);}
.review-item.active{background:var(--m50); border-left:2px solid var(--m600);}
.review-item .biz{font-size:12.5px; font-weight:700; margin-bottom:3px;}
.review-item .sub{font-size:11px; color:var(--n7);}
.review-detail{padding:22px;}
.detail-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--n6); font-size:12.5px; height:300px; gap:10px;}
.detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.detail-head h3{font-size:16px; font-weight:800;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;}
.detail-field{background:var(--n1); border-radius:8px; padding:12px 14px;}
.detail-field .k{font-size:10.5px; color:var(--n7); font-weight:600; margin-bottom:4px;}
.detail-field .v{font-size:13px; font-weight:700;}
.detail-actions{display:flex; gap:8px;}

/* ===== tab & table ===== */
.data-section{background:var(--n0); border:1px solid var(--n3); border-radius:12px; overflow:hidden;}
.tab-bar{display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--n3);}
.tab-bar .tab{padding:13px 4px; margin-right:20px; font-size:12.5px; font-weight:700; color:var(--n6); border-bottom:2px solid transparent; position:relative; top:1px;}
.tab-bar .tab.active{color:var(--n9); border-color:var(--m600);}
.data-toolbar{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--n3);}
.data-toolbar .search{flex:1; max-width:260px; border:1px solid var(--n3); border-radius:8px; padding:8px 12px; font-size:12.5px;}
.filter-chip{border:1px solid var(--n3); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600; color:var(--n7); display:flex; align-items:center; gap:5px;}
.filter-chip.active{background:var(--n9); color:#fff; border-color:var(--n9);}
.export-btn{margin-left:auto; border:1px solid var(--n3); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px;}
.export-btn:hover{border-color:var(--n5);}
.data-table-wrap{overflow-x:auto;}
.data-table th{text-align:left; font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; padding:10px 16px; border-bottom:1px solid var(--n3); background:var(--n1);}
.data-table td{padding:12px 16px; font-size:12.5px; border-bottom:1px solid var(--n2); color:var(--n8);}
.data-table tr:hover td{background:var(--n1);}
.data-table tr{animation:rowIn .3s ease backwards;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:700; background:var(--n2); color:var(--n7);}
.badge.ok{background:var(--s1-bg); color:var(--s1-text);}
.badge.warn{background:var(--s3-bg); color:var(--s3-text);}
.badge.bad{background:var(--s2-bg); color:var(--s2-text);}
.row-action{color:var(--n6); padding:5px;}
.row-action:hover{color:var(--n9);}
.checkbox{width:15px; height:15px; accent-color:var(--n9);}

/* ===== upload / products ===== */
.dropzone{border:1.5px dashed var(--n4); border-radius:12px; padding:34px; text-align:center; background:var(--n0); margin-bottom:20px; transition:border-color .15s, background .15s;}
.dropzone.drag{border-color:var(--m500); background:var(--m50);}
.dropzone i{font-size:34px; color:var(--n5); margin-bottom:10px;}
.dropzone .hint{font-size:12px; color:var(--n6); margin-top:6px;}
.progress-wrap{background:var(--n2); border-radius:8px; padding:16px; margin-bottom:20px;}
.progress-top{display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:8px;}
.progress-bar-track{height:6px; background:var(--n3); border-radius:9999px; overflow:hidden;}
.progress-bar-fill{height:100%; background:var(--m600); border-radius:9999px; transform-origin:left; animation:barGrow 1.4s ease forwards;}
.spin{display:inline-block; animation:spinCircle 1s linear infinite;}
.stock-select{border:1px solid var(--n3); border-radius:7px; padding:5px 9px; font-size:12px; font-weight:600; background:var(--n0);}

/* ===== policy form ===== */
.policy-card{background:var(--n0); border:1px solid var(--n3); border-radius:12px; padding:20px; margin-bottom:20px;}
.policy-card h4{font-size:13.5px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.policy-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--n2);}
.policy-row:last-child{border-bottom:none;}
.policy-label{font-size:12.5px; font-weight:600;}
.policy-sub{font-size:11px; color:var(--n7); margin-top:2px;}
.policy-input{display:flex; align-items:center; gap:6px;}
.policy-input input{width:64px; border:1px solid var(--n3); border-radius:7px; padding:7px 9px; font-size:12.5px; text-align:right;}

.qna-item{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--n2);}
.qna-item:last-child{border-bottom:none;}
.qna-avatar{width:32px; height:32px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;}
.qna-body{flex:1; min-width:0;}
.qna-title{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.qna-sub{font-size:11px; color:var(--n7); margin-top:2px;}

.report-item{display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--n3); border-radius:9px; margin-bottom:8px;}
.report-item.selected{border-color:var(--m400); background:var(--m50);}

/* ===== modal / toast ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(10,10,10,.4); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{width:420px; max-width:100%; background:var(--n0); border-radius:14px; padding:22px; animation:fadeInUp .2s ease;}
.modal-box h3{font-size:15px; font-weight:800; margin-bottom:14px;}
.modal-box p{font-size:12.5px; color:var(--n7); line-height:1.6; margin-bottom:16px;}
.modal-box textarea{width:100%; border:1px solid var(--n3); border-radius:8px; padding:10px; font-size:12.5px; min-height:70px; margin-bottom:14px;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--n10); color:#fff; padding:11px 18px; border-radius:9px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:100; animation:toastIn .22s ease;}

@media (max-width:960px){
  .sidebar{display:none;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .review-panel{grid-template-columns:1fr;}
}
</style>
</head>

function Sparkline({data, color}){
  const w=100,h=28, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

function Sidebar({view, setView}){
  const groups = [
    {title:'운영', items:[{id:'main', icon:'gauge', label:'통합 운영 대시보드'}]},

function StatusBadge({status}){
  const map = {'배송완료':'ok','배송중':'','정산대기':'warn','취소·환불':'bad','주문확인':'', '판매중':'ok','예약중':'warn','품절':'bad'};
  const cls = map[status] ?? '';

            <div style={{flex:1}}>
              <div style={{fontWeight:700, fontSize:12.5}}>{r.target}</div>
              <div style={{fontSize:11.5, color:'var(--n7)'}}>{r.reason} · 신고자 {r.by}</div>
            </div>
          </div>
        ))}
        <button className="btn btn-secondary btn-sm" style={{marginTop:10}} disabled={selectedReports.length===0} onClick={() => setConfirmHide(true)}><Icon name="eye-slash" size={13}/>선택 항목 일괄 숨김 처리 ({selectedReports.length})</button>
      </div>

      {confirmHide && (
        <div className="modal-overlay" onClick={() => setConfirmHide(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3>선택한 {selectedReports.length}건을 숨김 처리할까요?</h3>
            <p>숨김 처리된 콘텐츠는 사용자 화면에서 즉시 비공개로 전환됩니다.</p>
            <div className="modal-actions">
              <button className="btn btn-secondary btn-sm" onClick={() => setConfirmHide(false)}>취소</button>
              <button className="btn btn-primary accent btn-sm" onClick={() => {onToast(selectedReports.length + '건을 숨김 처리했습니다'); setSelectedReports([]); setConfirmHide(false);}}>숨김 처리</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [period, setPeriod] = useState('최근 7일');
  const [toast, setToast] = useState('');
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  return (
    <React.Fragment>
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        {view==='main' && <MainView onToast={showToast} period={period} setPeriod={setPeriod} />}
        {view==='products' && <ProductsView onToast={showToast} />}
        {view==='settlement' && <SettlementView onToast={showToast} />}
        {view==='ops' && <OpsView onToast={showToast} />}
      </div>
      {toast && <div className="toast"><Icon name="check-circle" size={15}/>{toast}</div>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('app-shell')).render(<App />);
</script>
</body>
</html>
