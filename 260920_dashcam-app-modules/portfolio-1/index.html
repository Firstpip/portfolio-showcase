<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드라이브노트 — 운전자 주행 리포트 통합 앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (hue 17°, light) ── */
:root{
  --m50:#ffeae1; --m100:#ffd5c4; --m200:#ffbba0; --m300:#ff9e78; --m400:#ff8352;
  --m500:#ff682c; --m600:#d15524; --m700:#a3431c; --m800:#732f14; --m900:#732f14;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab6b5; --n6:#989290; --n7:#7a7371; --n8:#4d4d4d; --n9:#3a3736; --n10:#202020;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; overflow-x: hidden; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n10);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
#root { width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--n4); border-radius: 8px; }

/* ── keyframes ── */
@keyframes fadeInUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
@keyframes slideInRight { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
@keyframes toastIn { from { opacity:0; transform: translateY(16px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:.35; } }
@keyframes spinLoader { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes drawGraph { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes fadeInScale { from { opacity:0; transform: scale(.96); } to { opacity:1; transform: scale(1); } }

/* ── header ── */
.app-header {
  position: sticky; top:0; z-index: 40;
  display:flex; align-items:center; justify-content:space-between;
  height: 64px; padding: 0 28px;
  background: var(--n0); border-bottom: 1px solid var(--n3);
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark {
  width: 32px; height:32px; border-radius: 8px;
  background: var(--m500); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight: 700; font-size: 15px;
}
.brand-word { font-weight: 700; font-size: 17px; letter-spacing:-0.02em; color: var(--n10); }
.header-actions { display:flex; align-items:center; gap:8px; }
.icon-btn {
  width: 38px; height:38px; border-radius: 0px;
  display:flex; align-items:center; justify-content:center;
  color: var(--n8); position: relative; transition: background .15s;
}
.icon-btn:hover { background: var(--n2); }
.icon-btn .dot {
  position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%;
  background: var(--m500); animation: pulseDot 1.8s infinite;
}
.avatar {
  width: 34px; height:34px; border-radius: 50%;
  background: var(--n2); color: var(--n7);
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:13px;
}

/* ── tab-bar (feature switcher) ── */
.tab-bar {
  display:flex; gap: 4px; padding: 0 24px;
  background: var(--n0); border-bottom: 1px solid var(--n3);
  overflow-x:auto;
}
.tab {
  padding: 14px 16px; font-size: 14px; font-weight: 600; color: var(--n6);
  border-bottom: 2px solid transparent; white-space:nowrap;
  display:flex; align-items:center; gap:6px; transition: color .15s;
}
.tab:hover { color: var(--n9); }
.tab.active { color: var(--m600); border-bottom-color: var(--m600); }

main.content { width:100%; min-height: calc(100vh - 113px); background: var(--n1); }
.page-wrap { max-width: 1200px; margin: 0 auto; padding: 28px; animation: fadeInUp .35s ease both; }

/* ── status-strip ── */
.status-strip {
  display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  background: var(--n0); border:1px solid var(--n3); border-radius: 8px;
  padding: 16px 24px; margin-bottom: 20px;
}
.status-item { display:flex; align-items:center; gap:10px; }
.status-item .ic { color: var(--n6); width:18px; height:18px; }
.status-label { font-size:12px; color: var(--n6); }
.stat-value { font-size: 30px; font-weight: 700; letter-spacing:-0.03em; color: var(--n10); line-height:1; }
.status-sep { width:1px; height: 28px; background: var(--n3); }
.live-badge { display:flex; align-items:center; gap:6px; margin-left:auto; font-size:12px; color: var(--n6); }
.live-badge .dot { width:7px; height:7px; border-radius:50%; background: var(--s1); animation: pulseDot 1.6s infinite; }

/* ── command-tower grid ── */
.tower-grid { display:grid; grid-template-columns: 1fr 320px; gap: 20px; align-items:start; }
.panel {
  background: var(--n0); border: 1px solid var(--n3); border-radius: 8px;
  padding: 24px;
}
.panel-title { font-size: 16px; font-weight: 700; letter-spacing:-0.01em; }
.panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }

.filter-tab-row { display:flex; gap:6px; background: var(--n2); padding:4px; border-radius: 20px; }
.filter-tab { padding:7px 16px; font-size:13px; font-weight:600; color:var(--n7); border-radius:20px; }
.filter-tab.active { background: var(--n0); color: var(--n10); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

.report-card {
  display:flex; align-items:center; gap:16px; padding:16px;
  border: 1px solid var(--n3); border-radius: 6px 0px 0px 6px; margin-bottom:10px;
  animation: fadeInUp .4s ease both; transition: border-color .15s, background .15s;
}
.report-card:hover { border-color: var(--n5); background: var(--n1); }
.report-icon { width:40px; height:40px; border-radius:8px; background: var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.report-body { flex:1; min-width:0; }
.report-title { font-size:14px; font-weight:600; color:var(--n10); }
.report-sub { font-size:12.5px; color:var(--n6); margin-top:3px; }
.type-badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--n2); color:var(--n7); flex-shrink:0; }

.priority-item {
  padding:14px; border-radius:6px; border:1px solid var(--n3); margin-bottom:10px;
  border-left: 3px solid var(--n3);
}
.priority-item.urgent { border-left-color: var(--m500); background: var(--m50); }
.priority-item .pt { font-size:13px; font-weight:600; color:var(--n10); display:flex; align-items:center; gap:6px; }
.priority-item .ps { font-size:12px; color:var(--n6); margin-top:4px; }
.badge-warn { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; background: var(--s3-bg); color: var(--s3-text); }

.secondary-row { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px; }
.mini-widget { background: var(--n0); border:1px solid var(--n3); border-radius:8px; padding:20px; }
.mini-widget-title { font-size:12.5px; color:var(--n6); margin-bottom:12px; font-weight:600; }

/* ── buttons ── */
.btn-primary {
  background: var(--n10); color:#fff; padding:10px 20px; border-radius:0px;
  font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
  transition: opacity .15s;
}
.btn-primary:hover { opacity:.85; }
.btn-ghost {
  background:transparent; border:1px solid var(--n9); color:var(--n9); padding:10px 20px; border-radius:0px;
  font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
}
.btn-ghost:hover { background: var(--n2); }
.btn-link { color: var(--m600); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

/* ── drawer ── */
.drawer-overlay { position:fixed; inset:0; background:rgba(32,32,32,.35); z-index:60; animation: fadeInScale .2s ease; }
.panel-drawer {
  position:fixed; top:0; right:0; bottom:0; width: 420px; max-width:92vw;
  background: var(--n0); z-index:61; box-shadow: -8px 0 24px rgba(0,0,0,.12);
  animation: slideInRight .28s cubic-bezier(.2,.8,.3,1); overflow-y:auto;
}
.drawer-head { display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--n3); }
.drawer-body { padding:24px; }
.drawer-close { width:32px; height:32px; border-radius:0; display:flex; align-items:center; justify-content:center; color:var(--n8); }
.drawer-close:hover { background: var(--n2); }

/* ── modal ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(32,32,32,.4); z-index:70;
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation: fadeInScale .2s ease;
}
.modal-box { width:480px; max-width:100%; background: var(--n0); border-radius:8px; animation: fadeInUp .25s ease; max-height:86vh; overflow-y:auto; }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--n3); }
.modal-body { padding:24px; }
.modal-foot { padding:18px 24px; border-top:1px solid var(--n3); display:flex; gap:10px; justify-content:flex-end; }

/* ── toast ── */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:80;
  background: var(--n10); color:#fff; padding:14px 22px; border-radius:0px;
  font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px;
  animation: toastIn .28s cubic-bezier(.2,.8,.3,1);
}

/* ── form ── */
.field-label { font-size:12.5px; font-weight:600; color:var(--n7); margin-bottom:6px; display:block; }
.field-input { width:100%; padding:11px 14px; border:1px solid var(--n4); border-radius:0px; font-size:14px; color:var(--n10); background:var(--n0); }
.field-input:focus { outline:none; border-color:var(--m500); }

.seg-toggle { display:inline-flex; background:var(--n2); border-radius:20px; padding:4px; }
.seg-btn { padding:8px 18px; font-size:13px; font-weight:600; color:var(--n7); border-radius:20px; }
.seg-btn.active { background:var(--n0); color:var(--n10); box-shadow:0 1px 2px rgba(0,0,0,.08); }

.big-score { font-size: 66px; font-weight:700; letter-spacing:-0.03em; line-height:0.91; color: var(--n10); }
.spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation: spinLoader .7s linear infinite; }

.card-list-row { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--n3); border-radius:6px; margin-bottom:8px; transition: background .15s; }
.card-list-row:hover { background: var(--n1); }

.check-box { width:18px; height:18px; border:1.5px solid var(--n5); border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition: background .15s, border-color .15s; }
.check-box.checked { background: var(--n9); border-color:var(--n9); color:#fff; }

.section-title { font-size:20px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; }
.section-sub { font-size:13.5px; color:var(--n6); margin-bottom:20px; }

@media (max-width: 860px) {
  .tower-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .tab { padding: 12px 10px; font-size: 12.5px; }
  .app-header { padding: 0 16px; }
  .page-wrap { padding: 18px 14px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Icon({ name, size = 18, className = '' }) {
  return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
}

function useIcons(deps) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
}

function Toast({ message, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 2400);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return (
    <div className="toast">
      <Icon name="check-circle-2" size={16} />
      <span>{message}</span>
    </div>
  );
}

function Drawer({ title, onClose, children }) {
  useIcons();
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="panel-drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer-head">
          <div className="panel-title">{title}</div>
          <button className="drawer-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        <div className="drawer-body">{children}</div>
      </div>
    </div>
  );
}

function Modal({ title, onClose, children, footer }) {
  useIcons();
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="panel-title">{title}</div>
          <button className="drawer-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

// ─────────────────────────── mock data ───────────────────────────

// ─────────────────────────── screens ───────────────────────────

function StatusStrip() {
  return (
    <div className="status-strip">
      <div className="status-item"><Icon name="gauge" className="ic" /><div><div className="status-label">오늘 운전 점수</div><div className="stat-value">87점</div></div></div>
      <div className="status-sep" />
      <div className="status-item"><Icon name="route" className="ic" /><div><div className="status-label">이번달 누적 주행거리</div><div className="stat-value">482km</div></div></div>
      <div className="status-sep" />
      <div className="status-item"><Icon name="bell" className="ic" /><div><div className="status-label">신규 알림</div><div className="stat-value">3건</div></div></div>
      <div className="live-badge"><span className="dot" />실시간 수집 중</div>
    </div>

}

function MainScreen({ onNavigate }) {
  const [filter, setFilter] = useState('전체');
  const [selected, setSelected] = useState(null);
  const filtered = filter === '전체' ? REPORTS : REPORTS.filter(r => r.type === filter);

  return (
    <div className="tower-grid">
      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">주행·주차 리포트</div>
            <div className="section-sub" style={{ margin: '4px 0 0' }}>월별 리포트를 탭으로 구분해 확인합니다</div>
          </div>
          <div className="filter-tab-row">
            {['전체', '주행', '주차'].map(f => (
              <button key={f} className={'filter-tab' + (filter === f ? ' active' : '')} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
        </div>
        {filtered.map((r, i) => (
          <div key={r.id} className="report-card" style={{ animationDelay: (i * 0.05) + 's' }} onClick={() => setSelected(r)}>

            <Icon name="chevron-right" size={16} className="ic" />

            </svg>
            <div style={{ fontSize: 12.5, color: 'var(--n7)', lineHeight: 1.7 }}>
              <div><Icon name="circle" size={8} style={{ color: 'var(--m600)' }} /> &nbsp;정상 주행 72%</div>
              <div><Icon name="circle" size={8} style={{ color: 'var(--n4)' }} /> &nbsp;주의 이벤트 28%</div>

            <span style={{ fontSize: 13, color: 'var(--n7)' }}>{selected.date}</span>

          {selected.distance && (
            <div style={{ display: 'flex', gap: 24, marginBottom: 20 }}>
              <div><div className="status-label">주행 거리</div><div className="stat-value" style={{ fontSize: 22 }}>{selected.distance}</div></div>
              <div><div className="status-label">소요 시간</div><div className="stat-value" style={{ fontSize: 22 }}>{selected.duration}</div></div>
              {selected.score && <div><div className="status-label">운전 점수</div><div className="stat-value" style={{ fontSize: 22 }}>{selected.score}점</div></div>}
            </div>
          )}
          <div className="panel-title" style={{ fontSize: 14, marginBottom: 12 }}>타임라인</div>
          {selected.events.map((e, i) => (
            <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'center', padding: '9px 0', borderBottom: i < selected.events.length - 1 ? '1px solid var(--n3)' : 'none' }}>

  );
}

function ParkingAlertScreen({ toast }) {
  const [plate, setPlate] = useState('');
  const [region, setRegion] = useState('서초구 서초동');
  const [alerts, setAlerts] = useState(PARKING_ALERTS);
  const [parkingView, setParkingView] = useState(null);

  const levelBadge = (level) => {
    if (level === '위험') return <span style={{ fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 20, background: 'var(--n9)', color: '#fff' }}><Icon name="triangle-alert" size={11} /> 위험</span>;
    if (level === '주의') return <span className="badge-warn">주의</span>;
    return <span style={{ fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 20, background: 'var(--s1-bg)', color: 'var(--s1-text)' }}>양호</span>;
  };

  const register = () => {
    if (!plate.trim()) return;
    setAlerts([{ id: Date.now(), plate, region, level: '주의', time: '상시', parkings: [{ name: region + ' 공영주차장', dist: '150m', spots: 12 }] }, ...alerts]);
    setPlate('');
    toast('차량이 등록되었습니다');
  };

  return (
    <div className="tower-grid">
      <div>
        <div className="panel" style={{ marginBottom: 20 }}>
          <div className="panel-title" style={{ marginBottom: 16 }}>등록된 단속 위험 알림</div>
          {alerts.map(a => (
            <div key={a.id} className="report-card" style={{ cursor: 'default' }}>
              <div className="report-icon"><Icon name="car" /></div>
              <div className="report-body">
                <div className="report-title">{a.plate} · {a.region}</div>
                <div className="report-sub">단속 시간대 {a.time}</div>
              </div>
              {levelBadge(a.level)}
              <button className="btn-link" style={{ marginLeft: 12 }} onClick={() => setParkingView(a)}>주변 주차장 보기</button>
            </div>
          ))}
        </div>
      </div>
      <div className="panel">
        <div className="panel-title" style={{ marginBottom: 16 }}>차량·지역 등록</div>
        <label className="field-label">차량 번호</label>
        <input className="field-input" placeholder="12가 3456" value={plate} onChange={e => setPlate(e.target.value)} style={{ marginBottom: 14 }} />
        <label className="field-label">관심 지역</label>
        <select className="field-input" value={region} onChange={e => setRegion(e.target.value)} style={{ marginBottom: 18 }}>
          <option>서초구 서초동</option>
          <option>강남구 역삼동</option>
          <option>송파구 잠실동</option>
        </select>
        <button className="btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={register}><Icon name="plus" size={15} />등록</button>
      </div>

      {parkingView && (
        <Drawer title={parkingView.region + ' 주변 주차장'} onClose={() => setParkingView(null)}>
          {parkingView.parkings.map((p, i) => (
            <div key={i} className="card-list-row">
              <div className="report-icon"><Icon name="square-parking" /></div>
              <div className="report-body">
                <div className="report-title">{p.name}</div>
                <div className="report-sub">{p.dist} · 잔여 {p.spots}면</div>
              </div>
            </div>
          ))}
        </Drawer>
      )}
    </div>
  );
}

function DrivingLogScreen({ toast }) {
  const [purpose, setPurpose] = useState('출퇴근');
  const [checked, setChecked] = useState([1, 3, 5]);
  const [generating, setGenerating] = useState(false);
  const [previewOpen, setPreviewOpen] = useState(false);
  const trips = DRIVE_LOG_TRIPS.filter(t => t.purpose === purpose || purpose === '전체');

  const toggle = (id) => setChecked(checked.includes(id) ? checked.filter(x => x !== id) : [...checked, id]);

  const generate = () => {
    setGenerating(true);
    setTimeout(() => { setGenerating(false); setPreviewOpen(true); }, 1400);
  };

  return (
    <div>
      <div className="panel" style={{ marginBottom: 20 }}>
        <div className="panel-head">
          <div className="seg-toggle">
            {['전체', '출퇴근', '업무'].map(p => (
              <button key={p} className={'seg-btn' + (purpose === p ? ' active' : '')} onClick={() => setPurpose(p)}>{p}용</button>
            ))}
          </div>
          <button className="btn-primary" onClick={generate} disabled={generating}>
            {generating ? <span className="spinner" /> : <Icon name="file-text" size={15} />}
            {generating ? '생성 중...' : '운행일지 PDF 생성'}
          </button>
        </div>
        {trips.map(t => (
          <div key={t.id} className="card-list-row" onClick={() => toggle(t.id)}>
            <div className={'check-box' + (checked.includes(t.id) ? ' checked' : '')}>{checked.includes(t.id) && <Icon name="check" size={12} />}</div>
            <div className="report-body">
              <div className="report-title">{t.route}</div>
              <div className="report-sub">{t.date} · {t.purpose} · {t.distance}</div>
            </div>
          </div>
        ))}
        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '16px 4px 0', fontSize: 13.5, color: 'var(--n7)', borderTop: '1px solid var(--n3)', marginTop: 10 }}>
          <span>선택된 운행 {checked.length}건</span>
          <span>총 주행거리 {trips.filter(t => checked.includes(t.id)).reduce((s, t) => s + parseFloat(t.distance), 0).toFixed(1)}km</span>
        </div>
      </div>

      {previewOpen && (
        <Modal title="운행일지 미리보기" onClose={() => setPreviewOpen(false)} footer={
          <React.Fragment>
            <button className="btn-ghost" onClick={() => { toast('엑셀 파일 다운로드가 완료되었습니다'); setPreviewOpen(false); }}><Icon name="sheet" size={15} />엑셀 출력</button>
            <button className="btn-primary" onClick={() => { toast('공유 링크가 복사되었습니다'); setPreviewOpen(false); }}><Icon name="share-2" size={15} />공유</button>
          </React.Fragment>
        }>
          <div style={{ border: '1px solid var(--n3)', borderRadius: 4, padding: 20, background: '#fff' }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>차량운행일지 (국세청 양식)</div>
            <div style={{ fontSize: 12, color: 'var(--n6)', marginBottom: 16 }}>2026년 09월 · {purpose}용</div>
            {trips.filter(t => checked.includes(t.id)).map(t => (
              <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, padding: '7px 0', borderBottom: '1px dashed var(--n3)' }}>
                <span>{t.date}</span><span>{t.route}</span><span>{t.distance}</span>
              </div>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─────────────────────────── app shell ───────────────────────────

const TABS = [
  { key: 'main', label: '대시보드' },
  { key: 'driving-score', label: '운전 점수 분석' },
  { key: 'parking-alert', label: '주정차 단속 위험 알림' },
  { key: 'driving-log', label: '운행일지 자동 생성' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState('');
  useIcons([screen]);
  const toast = (m) => setToastMsg(m);

  return (
    <div data-archetype="topbar-analytics" style={{ width: '100%', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="app-header">
        <div className="brand"><div className="brand-mark">DN</div><div className="brand-word">드라이브노트</div></div>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => toast('알림 3건을 모두 확인했습니다')}><Icon name="bell" size={18} /><span className="dot" /></button>
          <button className="avatar" onClick={() => toast('프로필 메뉴')}>김</button>
        </div>
      </header>
      <nav className="tab-bar" role="tablist">
        <button role="tab" aria-selected={screen === 'main'} className={screen === 'main' ? 'tab active' : 'tab'} onClick={() => setScreen('main')}>대시보드</button>
        <button role="tab" aria-selected={screen === 'driving-score'} className={screen === 'driving-score' ? 'tab active' : 'tab'} onClick={() => setScreen('driving-score')}>운전 점수 분석</button>
        <button role="tab" aria-selected={screen === 'parking-alert'} className={screen === 'parking-alert' ? 'tab active' : 'tab'} onClick={() => setScreen('parking-alert')}>주정차 단속 위험 알림</button>
        <button role="tab" aria-selected={screen === 'driving-log'} className={screen === 'driving-log' ? 'tab active' : 'tab'} onClick={() => setScreen('driving-log')}>운행일지 자동 생성</button>
      </nav>
      <main className="content" style={{ flex: 1, width: '100%' }}>
        <div className="page-wrap" key={screen}>
          {screen === 'main' && <React.Fragment><StatusStrip /><MainScreen onNavigate={setScreen} /></React.Fragment>}
          {screen === 'driving-score' && <DrivingScoreScreen />}
          {screen === 'parking-alert' && <ParkingAlertScreen toast={toast} />}
          {screen === 'driving-log' && <DrivingLogScreen toast={toast} />}
        </div>
      </main>
      <Toast message={toastMsg} onClose={() => setToastMsg('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
