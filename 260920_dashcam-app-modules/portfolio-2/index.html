<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드라이브노트 라이프 — 블랙박스 라이프스타일 확장 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (hue 89°, light) ── */
:root{
  --m50:#eff1ed; --m100:#eff1ed; --m200:#eff1ed; --m300:#dfe2db; --m400:#bfc6b8;
  --m500:#98a38c; --m600:#6c7c5c; --m700:#43582e; --m800:#1a3300; --m900:#152a00;
  --n0:#fcfaf5; --n1:#f1f1f1; --n2:#f0f0ef; --n3:#e6e6e5; --n4:#d6d7d5;
  --n5:#f1f1f1; --n6:#949890; --n7:#757a71; --n8:#575a53; --n9:#383a36; --n10:#1f201e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; overflow-x: hidden; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0); color: var(--n9);
  -webkit-font-smoothing: antialiased;
}
#root { width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--n4); border-radius: 8px; }

@keyframes riseIn { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes popIn { from { opacity:0; transform: scale(.9); } to { opacity:1; transform: scale(1); } }
@keyframes chipBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(26,51,0,.28); } 100% { box-shadow: 0 0 0 14px rgba(26,51,0,0); } }
@keyframes noteIn { from { opacity:0; transform: translateY(-10px) rotate(-1deg); } to { opacity:1; transform: translateY(0) rotate(-1deg); } }
@keyframes spinLoaderB { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.app-shell { width:100%; min-height:100vh; position:relative; background: var(--n0); }

/* ── floating top pill nav ── */
.pill-nav {
  position: sticky; top: 16px; z-index: 50; margin: 16px auto 0; max-width: 920px;
  display:flex; align-items:center; gap:6px; padding: 8px 10px;
  background: var(--n0); border: 1px solid var(--n4); border-radius: 16px;
  box-shadow: 0 1px 2px rgba(26,51,0,.05), 0 18px 40px -18px rgba(26,51,0,.18);
}
.logo-lockup { display:flex; align-items:center; gap:8px; padding-left:6px; padding-right:10px; }
.logo-mark { width:34px; height:34px; border-radius:9px; background: var(--n2); color: var(--m800); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0; }
.logo-word { font-weight:800; font-size:15px; letter-spacing:0.01em; color: var(--m800); }
.pnav-btn { padding:9px 14px; border-radius:12px; font-size:13.5px; font-weight:700; color: var(--n7); white-space:nowrap; }
.pnav-btn:hover { background: var(--n1); }
.pnav-btn.active { background: var(--m800); color: var(--n0); }
.pnav-fab { margin-left:auto; width:38px; height:38px; border-radius:11px; background:var(--n2); color:var(--n8); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pnav-fab:hover { background: var(--n3); }

/* ── map-canvas ── */
.map-canvas-wrap { position:relative; height: calc(100vh - 90px); width:100%; overflow:hidden; }
.geo-map {
  position:absolute; inset:0; width:100%; height:100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(26,51,0,.06), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(255,233,92,.35), transparent 40%),
    linear-gradient(135deg, #f4f1e6 0%, var(--n0) 60%);
}
.geo-map svg.roads { position:absolute; inset:0; width:100%; height:100%; opacity:.55; }
.pin { position:absolute; width:34px; height:34px; margin-left:-17px; margin-top:-34px; cursor:pointer; }
.pin-drop { width:34px; height:34px; border-radius: 50% 50% 50% 0; background: var(--n0); border:2px solid var(--n6); transform: rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow: 0 3px 8px rgba(26,51,0,.18); }
.pin-drop i { transform: rotate(45deg); color: var(--n7); font-size:15px; }
.pin.urgent .pin-drop { border-color: var(--m800); background: var(--m800); animation: ringPulse 1.8s infinite; }
.pin.urgent .pin-drop i { color: var(--n0); }

.geo-side {
  position:absolute; left:16px; top:16px; bottom:16px; width: 340px; max-width:88vw;
  background: var(--n0); border:1px solid var(--n4); border-radius:16px;
  box-shadow: 0 20px 48px -20px rgba(26,51,0,.28);
  display:flex; flex-direction:column; overflow:hidden; animation: riseIn .35s ease both;
}
.geo-side-head { padding:16px; border-bottom:1px solid var(--n3); }
.search-input { width:100%; padding:11px 14px 11px 38px; border-radius:12px; border:1px solid var(--n4); font-size:13.5px; background: var(--n1); position:relative; }
.search-wrap { position:relative; }
.search-wrap i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--n6); font-size:16px; }
.geo-list { flex:1; overflow-y:auto; padding:8px; }
.report-item { display:flex; gap:10px; padding:12px; border-radius:12px; margin-bottom:6px; transition: background .15s; }
.report-item:hover { background: var(--n1); }
.report-item .ric { width:36px; height:36px; border-radius:10px; background: var(--n2); color: var(--n7); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
.report-item .rtitle { font-size:13.5px; font-weight:700; color: var(--n9); }
.report-item .rsub { font-size:11.5px; color:var(--n6); margin-top:2px; }

.geo-stats {
  position:absolute; right:16px; top:16px;
  display:flex; gap:10px; background: var(--n0); border:1px solid var(--n4); border-radius:14px;
  padding:10px 16px; box-shadow: 0 12px 32px -16px rgba(26,51,0,.25);
}
.gstat { text-align:center; padding:0 8px; }
.gstat b { display:block; font-size:20px; font-weight:800; color: var(--n9); }
.gstat span { font-size:10.5px; color: var(--n6); }

.detail-card {
  position:absolute; right:16px; bottom:16px; width:340px; max-width:88vw;
  background: var(--n0); border:1px solid var(--n4); border-radius:16px; padding:18px;
  box-shadow: 0 20px 48px -18px rgba(26,51,0,.3); animation: popIn .25s ease both;
}
.map-control {
  position:absolute; right:16px; z-index:5;
  display:flex; flex-direction:column; gap:6px;
  background: var(--n0); border:1px solid var(--n4); border-radius:12px; overflow:hidden;
  box-shadow: 0 8px 20px -10px rgba(26,51,0,.25);
}
.map-control button { width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--n7); }
.map-control button:hover { background: var(--n1); }
.legend {
  position:absolute; left:16px; bottom:16px; z-index:5;
  background: var(--n0); border:1px solid var(--n4); border-radius:12px; padding:12px 14px;
  font-size:11.5px; color:var(--n7); box-shadow: 0 8px 20px -10px rgba(26,51,0,.2);
  display:flex; flex-direction:column; gap:6px;
}
.legend .lg-row { display:flex; align-items:center; gap:7px; }
.legend .lg-dot { width:9px; height:9px; border-radius:50%; }

.fab {
  position:absolute; right:16px; z-index:6;
  width:52px; height:52px; border-radius:16px; background: var(--m800); color:var(--n0);
  display:flex; align-items:center; justify-content:center; font-size:22px;
  box-shadow: 0 14px 30px -10px rgba(26,51,0,.45);
}
.fab:hover { transform: translateY(-2px); }

/* ── generic content page (non-map screens) ── */
.content-page { max-width:1120px; margin:0 auto; padding: 24px 20px 60px; animation: riseIn .35s ease both; }
.section-title { font-size:48px; font-weight:800; letter-spacing:0.01em; line-height:1.05; color: var(--n9); margin-bottom:8px; }
.section-sub { font-size:13.5px; color:var(--n7); margin-bottom:22px; }

.sticky-card { background: var(--n0); border:1px solid var(--n4); border-radius:16px; padding:24px; margin-bottom:16px; }
.tag-pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:9999px; background: var(--n2); color: var(--n7); }
.tag-pill.hl { background: var(--s3-bg); color: var(--s3-text); animation: chipBounce 1.6s ease-in-out infinite; }
.tag-pill.ok { background: var(--s1-bg); color: var(--s1-text); }
.tag-pill.risk { background: var(--n9); color: var(--n0); }

.btn-fill { background: var(--m800); color: var(--n0); padding:12px 22px; border-radius:12px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:8px; box-shadow: 0 1px 2px rgba(26,51,0,.08); transition: transform .15s; }
.btn-fill:hover { transform: translateY(-1px); }
.btn-outline { background:transparent; border:1.5px solid var(--n8); color: var(--n8); padding:11px 20px; border-radius:12px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
.btn-pastel { background: var(--n2); color: var(--n8); padding:10px 18px; border-radius:12px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px; }
.btn-pastel:hover { background: var(--n3); }

.province-grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; }
.province-tile {
  position:relative; aspect-ratio: 1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background: var(--n1); border:1.5px solid var(--n3); font-size:12.5px; font-weight:700; color: var(--n7);
  animation: riseIn .35s ease both; transition: transform .18s ease;
}
.province-tile:hover { transform: scale(1.06); }
.province-tile.visited { background: var(--n2); color: var(--n9); border-color: var(--n4); }
.province-tile.picked { border-color: var(--m800); border-width:2px; }
.province-tile .pv-count { font-size:10px; font-weight:600; color: var(--n6); }
.province-tile .pv-dot { position:absolute; top:8px; right:8px; width:7px; height:7px; border-radius:50%; background: var(--m800); }

.vc-row { display:flex; align-items:center; gap:14px; padding:16px; border:1px solid var(--n3); border-radius:14px; margin-bottom:10px; }
.vc-ic { width:42px; height:42px; border-radius:12px; background: var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }

.toggle-sw { width:40px; height:23px; border-radius:9999px; background: var(--n3); position:relative; transition: background .15s; flex-shrink:0; }
.toggle-sw.on { background: var(--m800); }
.toggle-sw .knob { position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition: transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.toggle-sw.on .knob { transform: translateX(17px); }

/* ── bottom sheet ── */
.sheet-overlay { position:fixed; inset:0; background:rgba(26,51,0,.28); z-index:60; }
.bottom-sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:88vh; overflow-y:auto;
  background: var(--n0); border-radius: 24px 24px 0 0; box-shadow: 0 -18px 48px rgba(26,51,0,.22);
  animation: sheetUp .3s cubic-bezier(.2,.8,.3,1); max-width:640px; margin:0 auto;
}
.sheet-grip { width:44px; height:5px; border-radius:9999px; background: var(--n4); margin: 12px auto; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; padding:6px 22px 16px; border-bottom:1px solid var(--n3); }
.sheet-body { padding:22px; }
.sheet-close { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:var(--n7); }
.sheet-close:hover { background: var(--n2); }

.field-label { font-size:12.5px; font-weight:700; color:var(--n7); margin-bottom:6px; display:block; }
.field-input { width:100%; padding:12px 14px; border:1.5px solid var(--n4); border-radius:12px; font-size:14px; color: var(--n9); background: var(--n0); margin-bottom:14px; }
.field-input:focus { outline:none; border-color: var(--m800); }

.seg2 { display:inline-flex; background: var(--n1); border-radius:12px; padding:4px; margin-bottom:14px; }
.seg2 button { padding:9px 18px; border-radius:9px; font-size:13px; font-weight:700; color: var(--n7); }
.seg2 button.active { background: var(--n0); color: var(--n9); box-shadow:0 1px 2px rgba(0,0,0,.08); }

/* ── sticky note toast ── */
.note-toast {
  position:fixed; top:24px; right:24px; z-index:80; max-width:300px;
  background: var(--n9); color: var(--n0); padding:14px 18px; border-radius:14px;
  font-size:13.5px; font-weight:700; box-shadow: 0 16px 32px -12px rgba(26,51,0,.4);
  animation: noteIn .3s cubic-bezier(.2,.8,.3,1); display:flex; gap:10px; align-items:flex-start;
}
.spinner2 { width:16px; height:16px; border:2px solid var(--n3); border-top-color: var(--n8); border-radius:50%; animation: spinLoaderB .7s linear infinite; display:inline-block; }

@media (max-width: 760px) {
  .province-grid { grid-template-columns: repeat(4,1fr); }
  .geo-side { width: 88vw; }
  .pill-nav { max-width: calc(100vw - 24px); overflow-x: auto; -webkit-overflow-scrolling: touch; justify-content: flex-start; }
  .pill-nav .pnav-btn { padding: 9px 11px; font-size: 12.5px; }
  .logo-lockup { display: none; }
  .section-title { font-size: 34px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function Icon({ name, size = 18, weight = 'regular', style = {} }) {
  return <i className={'ph' + (weight === 'fill' ? '-fill' : '') + ' ph-' + name} style={{ fontSize: size, ...style }}></i>;
}

function NoteToast({ message, onClose }) {
  useEffect(() => { if (!message) return; const t = setTimeout(onClose, 2400); return () => clearTimeout(t); }, [message]);
  if (!message) return null;
  return (
    <div className="note-toast">
      <Icon name="check-circle" weight="fill" size={18} />
      <span>{message}</span>
    </div>
  );
}

function BottomSheet({ title, onClose, children, footer }) {
  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="bottom-sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-grip" />
        <div className="sheet-head">
          <div className="section-title" style={{ fontSize: 17, marginBottom: 0 }}>{title}</div>
          <button className="sheet-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        <div className="sheet-body">{children}</div>
        {footer && <div style={{ padding: '0 22px 22px', display: 'flex', gap: 10 }}>{footer}</div>}
      </div>
    </div>
  );
}

// ─────────────────────────── mock data ───────────────────────────
const REPORTS = [
  { id: 1, kind: '목격제보', urgent: true, title: '역삼동 이면도로 접촉사고 목격', sub: '09.18 11:42 · 강남구 역삼동', left: '32%', top: '38%', author: '익명', desc: '골목 주차 중 차량 접촉을 목격했습니다. 흰색 세단, 번호판 뒷자리 78XX.' },
  { id: 2, kind: '도움요청', urgent: false, title: '주차 중 경미한 스크래치 목격자 찾습니다', sub: '09.18 09:10 · 서초구 서초동', left: '58%', top: '52%', author: '박OO', desc: '09.17 저녁 8시경 서초동 인근 노상주차 중 발생한 스크래치입니다. 목격자분 제보 부탁드립니다.' },
  { id: 3, kind: '목격제보', urgent: false, title: '무단횡단 급정거 상황 제보', sub: '09.17 20:05 · 송파구 잠실동', left: '70%', top: '30%', author: '익명', desc: '잠실역 인근 무단횡단으로 인한 급정거 상황을 블랙박스로 확인했습니다.' },
  { id: 4, kind: '도움요청', urgent: false, title: '주차장 출차 시 동승자 확인 요청', sub: '09.17 14:22 · 강남구 대치동', left: '44%', top: '68%', author: '이OO', desc: '지하주차장 출차 과정에서 동승자 목격 여부를 확인하고 싶습니다.' },
];

const PROVINCES = [
  { name: '서울', visited: true, count: 42 }, { name: '경기', visited: true, count: 31 }, { name: '인천', visited: true, count: 6 },
  { name: '강원', visited: false, count: 0 }, { name: '충북', visited: true, count: 3 }, { name: '충남', visited: false, count: 0 },
  { name: '대전', visited: true, count: 2 }, { name: '경북', visited: false, count: 0 }, { name: '경남', visited: true, count: 4 },
  { name: '대구', visited: false, count: 0 }, { name: '전북', visited: false, count: 0 }, { name: '전남', visited: true, count: 1 },
  { name: '광주', visited: false, count: 0 }, { name: '부산', visited: true, count: 5 }, { name: '울산', visited: false, count: 0 },
  { name: '세종', visited: true, count: 1 }, { name: '제주', visited: true, count: 2 },
];

const MAINT_ITEMS = [
  { id: 1, name: '엔진오일', status: '주의', remain: '320km 남음', icon: 'drop' },
  { id: 2, name: '타이어 마모', status: '양호', remain: '8,200km 남음', icon: 'tire' },
  { id: 3, name: '브레이크 패드', status: '위험', remain: '즉시 점검 필요', icon: 'warning-octagon' },
  { id: 4, name: '와이퍼', status: '양호', remain: '4,100km 남음', icon: 'wind' },
];

const FUEL_LOGS = [
  { id: 1, date: '09.18', place: 'GS칼텍스 역삼점', amount: '68,200원', liter: '38.4L' },
  { id: 2, date: '09.11', place: 'SK에너지 서초점', amount: '71,000원', liter: '39.9L' },
];

const NOTI_ITEMS = [
  { id: 1, kind: '정비', title: '브레이크 패드 즉시 점검이 필요합니다', time: '오늘 09:10', priority: true },
  { id: 2, kind: '리콜', title: '차량 안전 리콜 대상 여부를 확인해 주세요', time: '어제 18:40', priority: true },
  { id: 3, kind: '주유', title: '평균 대비 주유 간격이 짧아졌습니다', time: '09.17', priority: false },
  { id: 4, kind: '정비', title: '엔진오일 교체 시기가 가까워지고 있습니다', time: '09.15', priority: false },
];

// ─────────────────────────── screens ───────────────────────────

function MapScreen({ toast }) {
  const [selected, setSelected] = useState(REPORTS[0]);
  const [composeOpen, setComposeOpen] = useState(false);
  const [reports, setReports] = useState(REPORTS);
  const [type, setType] = useState('도움요청');
  const [desc, setDesc] = useState('');

  const submit = () => {
    if (!desc.trim()) return;
    setReports([{ id: Date.now(), kind: type, urgent: false, title: desc.slice(0, 24), sub: '방금 전 · 내 위치 기준', left: '50%', top: '50%', author: '나', desc }, ...reports]);
    setDesc(''); setComposeOpen(false);
    toast(type + '가 등록되었습니다');
  };

  return (
    <div className="map-canvas-wrap">
      <div className="geo-map map">
        <svg className="roads" viewBox="0 0 800 600" preserveAspectRatio="none">
          <path d="M0,180 C200,120 400,260 800,140" stroke="var(--n4)" strokeWidth="10" fill="none" />
          <path d="M100,0 C160,220 260,380 220,600" stroke="var(--n4)" strokeWidth="8" fill="none" />
          <path d="M0,420 C260,380 520,480 800,400" stroke="var(--n4)" strokeWidth="8" fill="none" />
          <path d="M560,0 C520,220 620,380 700,600" stroke="var(--n4)" strokeWidth="7" fill="none" />
        </svg>

        {/* 손그림 무드 스케치 — Say Briefly 아틀리에 톤 (장식, 저채도 forest ink 30%) */}
        <svg className="sketch-atmo" viewBox="0 0 800 600" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.16, pointerEvents: 'none' }}>
          <path d="M60,80 C120,40 180,110 140,150 C110,180 60,150 90,110" stroke="var(--m800)" strokeWidth="2" fill="none" strokeLinecap="round" />
          <circle cx="720" cy="480" r="44" stroke="var(--m800)" strokeWidth="2" fill="none" strokeDasharray="5 7" />
          <path d="M640,90 L700,70 L690,120 Z" stroke="var(--m800)" strokeWidth="2" fill="none" strokeLinejoin="round" />
        </svg>

        {/* 시그니처: 마커/핀 ≥3 (리터럴 고정, 지도상 절대 위치) */}
        <div className="pin urgent" style={{ left: REPORTS[0].left, top: REPORTS[0].top }} onClick={() => setSelected(REPORTS[0])}>
          <div className="pin-drop marker"><i className="ph-fill ph-warning" /></div>
        </div>
        <div className="pin" style={{ left: REPORTS[1].left, top: REPORTS[1].top }} onClick={() => setSelected(REPORTS[1])}>
          <div className="pin-drop marker"><i className="ph ph-hand-heart" /></div>
        </div>
        <div className="pin" style={{ left: REPORTS[2].left, top: REPORTS[2].top }} onClick={() => setSelected(REPORTS[2])}>
          <div className="pin-drop marker"><i className="ph ph-camera" /></div>
        </div>
        <div className="pin" style={{ left: REPORTS[3].left, top: REPORTS[3].top }} onClick={() => setSelected(REPORTS[3])}>
          <div className="pin-drop marker"><i className="ph ph-hand-heart" /></div>
        </div>
      </div>

      <aside className="geo-side drawer">
        <div className="geo-side-head">
          <div className="section-title" style={{ fontSize: 22, letterSpacing: '0.01em', marginBottom: 10 }}>제보·도움요청</div>
          <div className="search-wrap">
            <Icon name="magnifying-glass" size={16} />
            <input className="search-input" placeholder="장소·내용 검색" />
          </div>
        </div>
        <div className="geo-list list-panel">
          {reports.map(r => (
            <div key={r.id} className="report-item" onClick={() => setSelected(r)}>
              <div className="ric"><Icon name={r.kind === '목격제보' ? 'camera' : 'hand-heart'} size={17} /></div>
              <div>
                <div className="rtitle">{r.title}</div>
                <div className="rsub">{r.kind} · {r.sub}</div>
              </div>
            </div>
          ))}
        </div>
      </aside>

      <div className="geo-stats">
        <div className="gstat"><b>{reports.length}</b><span>주변 제보</span></div>
        <div className="gstat"><b>500m</b><span>알림 반경</span></div>
        <div className="gstat"><b>1</b><span>긴급</span></div>
      </div>

      <div className="map-control zoom" style={{ top: 76 }}>
        <button onClick={() => toast('지도를 확대했습니다')}><Icon name="plus" size={17} /></button>
        <button onClick={() => toast('지도를 축소했습니다')}><Icon name="minus" size={17} /></button>
      </div>

      <div className="legend">
        <div className="lg-row"><span className="lg-dot" style={{ background: 'var(--m800)' }} />긴급 제보</div>
        <div className="lg-row"><span className="lg-dot" style={{ background: 'var(--n5)' }} />일반 제보·요청</div>
      </div>

      {selected && (
        <div className="detail-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
            <span className="tag-pill">{selected.kind}</span>
            <button className="sheet-close" onClick={() => setSelected(null)}><Icon name="x" size={16} /></button>
          </div>
          <div style={{ fontWeight: 800, fontSize: 14.5, marginBottom: 6, color: 'var(--n9)' }}>{selected.title}</div>
          <div style={{ fontSize: 12, color: 'var(--n6)', marginBottom: 10 }}>{selected.author} · {selected.sub}</div>
          <div style={{ background: 'var(--n1), var(--n1)'.split(',')[0], borderRadius: 10, height: 90, marginBottom: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--n6)', fontSize: 12 }}>
            <Icon name="video-camera" size={22} />&nbsp;제보 영상
          </div>
          <div style={{ fontSize: 13, color: 'var(--n8)', lineHeight: 1.6, marginBottom: 14 }}>{selected.desc}</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn-pastel" style={{ flex: 1, justifyContent: 'center' }} onClick={() => toast('신고가 접수되었습니다')}><Icon name="flag" size={14} />신고</button>
            <button className="btn-pastel" style={{ flex: 1, justifyContent: 'center' }} onClick={() => toast('작성자를 차단했습니다')}><Icon name="prohibit" size={14} />차단</button>
          </div>
        </div>
      )}

      <button className="fab" style={{ bottom: selected ? 300 : 16 }} onClick={() => setComposeOpen(true)}><Icon name="plus" size={24} /></button>

      {composeOpen && (
        <BottomSheet title="제보·도움요청 작성" onClose={() => setComposeOpen(false)} footer={
          <button className="btn-fill" style={{ width: '100%', justifyContent: 'center' }} onClick={submit}><Icon name="paper-plane-tilt" size={16} />등록</button>
        }>
          <div className="seg2">
            <button className={type === '도움요청' ? 'active' : ''} onClick={() => setType('도움요청')}>도움요청</button>
            <button className={type === '목격제보' ? 'active' : ''} onClick={() => setType('목격제보')}>목격제보</button>
          </div>
          <label className="field-label">발생 장소</label>
          <input className="field-input" placeholder="예: 강남구 역삼동 이면도로" />
          <label className="field-label">발생 추정 시각</label>
          <input className="field-input" type="datetime-local" />
          <label className="field-label">상황 설명</label>
          <textarea className="field-input" rows="3" placeholder="상황을 자세히 적어주세요" value={desc} onChange={e => setDesc(e.target.value)} style={{ resize: 'none' }} />
          <div style={{ fontSize: 12, color: 'var(--n6)' }}><Icon name="bell-ringing" size={13} /> 반경 500m 이내 사용자에게 알림이 전송됩니다</div>
        </BottomSheet>
      )}
    </div>
  );
}

function TravelSummaryScreen({ toast }) {
  const [period, setPeriod] = useState('연말');
  const [pick, setPick] = useState(PROVINCES[0]);
  const visitedCount = PROVINCES.filter(p => p.visited).length;

  return (
    <div className="content-page">
      <div className="section-title">연간 이동 결산</div>
      <div className="section-sub">17개 시도 방문 지역을 기간별로 확인합니다</div>
      <div className="seg2">
        {['연말', '추석', '설날'].map(p => <button key={p} className={period === p ? 'active' : ''} onClick={() => setPeriod(p)}>{p}</button>)}
      </div>
      <div className="sticky-card">
        <div style={{ display: 'flex', gap: 28, marginBottom: 20 }}>
          <div><span style={{ fontSize: 26, fontWeight: 800, color: 'var(--n9)' }}>{visitedCount}</span><span style={{ fontSize: 12.5, color: 'var(--n6)' }}> / 17개 시도 방문</span></div>
          <div><span style={{ fontSize: 26, fontWeight: 800, color: 'var(--n9)' }}>1,240km</span><span style={{ fontSize: 12.5, color: 'var(--n6)' }}> 이동 거리</span></div>
        </div>
        <div className="province-grid">
          {PROVINCES.map((p, i) => (
            <div key={p.name} className={'province-tile' + (p.visited ? ' visited' : '') + (pick.name === p.name ? ' picked' : '')} style={{ animationDelay: (i * 0.03) + 's' }} onClick={() => setPick(p)}>
              {p.visited && <span className="pv-dot" />}
              <span>{p.name}</span>
              {p.visited && <span className="pv-count">{p.count}회</span>}
            </div>
          ))}
        </div>
      </div>
      <div className="sticky-card">
        <div style={{ fontWeight: 800, marginBottom: 10 }}>{pick.name} 대표 이동 경로</div>
        {pick.visited ? (
          <svg width="100%" height="120" viewBox="0 0 400 120">
            <path d="M20,90 C120,20 260,110 380,30" fill="none" stroke="var(--n4)" strokeWidth="3" strokeDasharray="1 8" />
            <path d="M20,90 C120,20 260,110 380,30" fill="none" stroke="var(--m800)" strokeWidth="3" strokeLinecap="round" />
            <circle cx="20" cy="90" r="6" fill="var(--m800)" /><circle cx="380" cy="30" r="6" fill="var(--n9)" />
          </svg>
        ) : <div style={{ fontSize: 13, color: 'var(--n6)' }}>아직 방문 기록이 없는 지역입니다</div>}
      </div>
    </div>
  );
}

function VehicleCareScreen({ toast }) {
  const [receiptOpen, setReceiptOpen] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [ocr, setOcr] = useState(null);
  const [store, setStore] = useState('');
  const [amount, setAmount] = useState('');

  const scan = () => {
    setScanning(true);
    setTimeout(() => { setScanning(false); setOcr(true); setStore('현대모비스 서초정비점'); setAmount('184,000'); }, 1300);
  };

  return (
    <div className="content-page">
      <div className="section-title">차량 정비·주유 관리</div>
      <div className="section-sub">정비 알림과 소모품 주기를 확인하고 영수증을 등록합니다</div>

      <div className="sticky-card" style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div style={{ fontWeight: 800 }}>정비 알림</div>
          <span className="tag-pill risk"><Icon name="warning-octagon" size={12} />1건 즉시 점검</span>
        </div>
        {MAINT_ITEMS.map(m => (
          <div key={m.id} className="vc-row">
            <div className="vc-ic"><Icon name={m.icon} size={19} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{m.name}</div>
              <div style={{ fontSize: 12, color: 'var(--n6)' }}>{m.remain}</div>
            </div>
            <span className={'tag-pill' + (m.status === '위험' ? ' risk' : m.status === '주의' ? ' hl' : ' ok')}>{m.status}</span>
          </div>
        ))}
      </div>

      <div className="sticky-card" style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div style={{ fontWeight: 800 }}>정비 영수증</div>
          <button className="btn-fill" onClick={() => setReceiptOpen(true)}><Icon name="camera" size={15} />영수증 촬영</button>
        </div>
        <div style={{ fontSize: 13, color: 'var(--n6)' }}>최근 등록된 영수증이 없습니다. 촬영하면 인식 결과를 바로 확인할 수 있습니다.</div>
      </div>

      <div className="sticky-card">
        <div style={{ fontWeight: 800, marginBottom: 16 }}>주유 내역</div>
        {FUEL_LOGS.map(f => (
          <div key={f.id} className="vc-row">
            <div className="vc-ic"><Icon name="gas-can" size={19} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{f.place}</div>
              <div style={{ fontSize: 12, color: 'var(--n6)' }}>{f.date} · {f.liter}</div>
            </div>
            <span style={{ fontWeight: 700, fontSize: 14 }}>{f.amount}</span>
          </div>
        ))}
        <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
          <button className="btn-pastel" onClick={() => toast('주유소 위치를 인식했습니다')}><Icon name="map-pin" size={14} />위치인식</button>
          <button className="btn-pastel" onClick={() => toast('영수증 촬영 화면을 엽니다')}><Icon name="camera" size={14} />촬영</button>
          <button className="btn-pastel" onClick={() => toast('직접 입력 항목이 추가되었습니다')}><Icon name="pencil-simple" size={14} />직접입력</button>
        </div>
      </div>

      {receiptOpen && (
        <BottomSheet title="정비 영수증 등록" onClose={() => { setReceiptOpen(false); setOcr(null); }} footer={ocr && (
          <button className="btn-fill" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { toast('정비 이력에 저장되었습니다'); setReceiptOpen(false); setOcr(null); }}><Icon name="floppy-disk" size={16} />저장</button>
        )}>
          {!ocr ? (
            <div>
              <div style={{ height: 160, borderRadius: 14, border: '1.5px dashed var(--n4)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, marginBottom: 16 }}>
                {scanning ? <React.Fragment><span className="spinner2" /><span style={{ fontSize: 12.5, color: 'var(--n6)' }}>OCR 인식 중...</span></React.Fragment> : <React.Fragment><Icon name="image" size={28} style={{ color: 'var(--n5)' }} /><span style={{ fontSize: 12.5, color: 'var(--n6)' }}>영수증 사진을 선택하세요</span></React.Fragment>}
              </div>
              <button className="btn-outline" style={{ width: '100%', justifyContent: 'center' }} onClick={scan} disabled={scanning}><Icon name="upload-simple" size={15} />앨범에서 선택</button>
            </div>
          ) : (
            <div>
              <label className="field-label">상호</label>
              <input className="field-input" value={store} onChange={e => setStore(e.target.value)} />
              <label className="field-label">결제 금액</label>
              <input className="field-input" value={amount} onChange={e => setAmount(e.target.value)} />
              <label className="field-label">정비 항목</label>
              <input className="field-input" defaultValue="브레이크 패드 교체" />
            </div>
          )}
        </BottomSheet>
      )}
    </div>
  );
}

function NotificationCenterScreen({ toast }) {
  const [sortPriority, setSortPriority] = useState(true);
  const [channels, setChannels] = useState({ 정비: true, 리콜: true, 주유: false });
  const list = [...NOTI_ITEMS].sort((a, b) => sortPriority ? (b.priority - a.priority) : 0);

  return (
    <div className="content-page">
      <div className="section-title">통합 알림·리마인더 센터</div>
      <div className="section-sub">정비·리콜·주유 알림을 우선순위와 채널별로 관리합니다</div>

      <div className="sticky-card" style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div style={{ fontWeight: 800 }}>알림 목록</div>
          <button className="btn-pastel" onClick={() => setSortPriority(!sortPriority)}><Icon name="sort-descending" size={14} />{sortPriority ? '우선순위순' : '최신순'}</button>
        </div>
        {list.map(n => (
          <div key={n.id} className="vc-row" style={{ borderColor: n.priority ? 'var(--m800)' : 'var(--n3)' }}>
            <div className="vc-ic"><Icon name={n.kind === '정비' ? 'wrench' : n.kind === '리콜' ? 'siren' : 'gas-can'} size={18} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{n.title}</div>
              <div style={{ fontSize: 11.5, color: 'var(--n6)' }}>{n.kind} · {n.time}</div>
            </div>
            {n.priority && <span className="tag-pill hl">우선</span>}
          </div>
        ))}
      </div>

      <div className="sticky-card">
        <div style={{ fontWeight: 800, marginBottom: 16 }}>채널별 수신 설정</div>
        {Object.keys(channels).map(k => (
          <div key={k} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid var(--n3)' }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{k} 알림</div>
              <div style={{ fontSize: 11.5, color: 'var(--n6)' }}>푸시 + 인앱으로 수신합니다</div>
            </div>
            <div className={'toggle-sw' + (channels[k] ? ' on' : '')} onClick={() => setChannels({ ...channels, [k]: !channels[k] })}><span className="knob" /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────── app shell ───────────────────────────

function App() {
  const [screen, setScreen] = useState('main');
  const [toastMsg, setToastMsg] = useState('');
  const toast = (m) => setToastMsg(m);

  return (
    <div data-archetype="map-canvas" className="app-shell">
      <nav className="pill-nav">
        <div className="logo-lockup"><div className="logo-mark">DL</div><div className="logo-word">드라이브노트 라이프</div></div>
        <button className={screen === 'main' ? 'pnav-btn active' : 'pnav-btn'} onClick={() => setScreen('main')}>커뮤니티 제보·도움요청 지도</button>
        <button className={screen === 'travel-summary' ? 'pnav-btn active' : 'pnav-btn'} onClick={() => setScreen('travel-summary')}>연간 이동 결산 지도</button>
        <button className={screen === 'vehicle-care' ? 'pnav-btn active' : 'pnav-btn'} onClick={() => setScreen('vehicle-care')}>차량 정비·주유 관리</button>
        <button className={screen === 'notification-center' ? 'pnav-btn active' : 'pnav-btn'} onClick={() => setScreen('notification-center')}>통합 알림·리마인더 센터</button>
        <button className="pnav-fab" onClick={() => toast('프로필 메뉴')}><Icon name="user-circle" size={20} /></button>
      </nav>

      <div key={screen}>
        {screen === 'main' && <MapScreen toast={toast} />}
        {screen === 'travel-summary' && <TravelSummaryScreen toast={toast} />}
        {screen === 'vehicle-care' && <VehicleCareScreen toast={toast} />}
        {screen === 'notification-center' && <NotificationCenterScreen toast={toast} />}
      </div>

      <NoteToast message={toastMsg} onClose={() => setToastMsg('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
