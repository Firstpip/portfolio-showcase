<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>파트너허브 — 거래처별 접수·정산 조회 포털</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 221°, light) ── */
:root{
  --m50:#f0f4fe; --m100:#e0e9fc; --m200:#c2d3f9; --m300:#9db9f6; --m400:#739bf2;
  --m500:#4c7fef; --m600:#2563eb; --m700:#1e51c1; --m800:#183f96; --m900:#112d6a;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909298; --n7:#71747a; --n8:#262626; --n9:#36373a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
#root{width:100%;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n1);color:var(--n8);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideInRight{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes countUpFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes rippleGrow{from{transform:scale(0);opacity:.45;}to{transform:scale(2.4);opacity:0;}}

.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:24px;height:60px;padding:0 24px;background:var(--n0);border-bottom:1px solid var(--n3);}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--n9);flex-shrink:0;}
.brand .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
.company-switcher{position:relative;flex-shrink:0;}
.company-switcher-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--n3);border-radius:8px;background:var(--n0);color:var(--n8);font-size:13px;font-weight:500;}
.company-switcher-btn:hover{border-color:var(--n5);}
.company-dropdown{position:absolute;top:44px;left:0;width:260px;background:var(--n0);border:1px solid var(--n3);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;z-index:60;animation:scaleIn .14s ease;transform-origin:top left;}
.company-dropdown-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;font-size:13px;color:var(--n8);}
.company-dropdown-item:hover{background:var(--n1);}
.company-dropdown-item.active{background:var(--m50);color:var(--m700);font-weight:600;}
.rls-note{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--n6);padding:8px 10px 4px;border-top:1px solid var(--n3);margin-top:4px;}
.global-nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;}
.nav-link{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:500;color:var(--n7);white-space:nowrap;}
.nav-link:hover{background:var(--n1);color:var(--n9);}
.nav-link.active{background:var(--m50);color:var(--m700);}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.icon-btn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--n7);font-size:16px;}
.icon-btn:hover{background:var(--n1);color:var(--n9);}
.notif-dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--s2);animation:pulseDot 1.8s infinite;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.search-box{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--n3);border-radius:8px;background:var(--n1);width:180px;}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--n8);}
.search-box i{color:var(--n6);font-size:14px;}

.tab-bar{display:flex;gap:4px;padding:10px 24px 0;background:var(--n0);border-bottom:1px solid var(--n3);overflow-x:auto;}
.tab{border:none;background:transparent;padding:9px 4px 12px;font-size:13.5px;font-weight:500;color:var(--n6);border-bottom:2px solid transparent;white-space:nowrap;margin-right:20px;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--n9);}
.tab.active{color:var(--m700);border-bottom-color:var(--m600);font-weight:600;}

.content{max-width:1240px;margin:0 auto;padding:28px 24px 64px;width:100%;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:700;color:var(--n9);margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--n6);margin:0;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:8px;border:none;background:var(--m600);color:#fff;font-size:13.5px;font-weight:600;position:relative;overflow:hidden;}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--n3);background:var(--n0);color:var(--n8);font-size:13.5px;font-weight:500;}
.btn-ghost:hover{border-color:var(--n5);background:var(--n1);}
.btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;animation:rippleGrow .55s ease-out forwards;}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--n0);border:1px solid var(--n3);border-radius:10px;padding:18px 18px 14px;animation:countUpFade .4s ease both;}
.stat-label{font-size:12.5px;color:var(--n6);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.stat-value{font-size:30px;font-weight:700;color:var(--n9);line-height:1.1;}
.stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;margin-top:6px;}
.stat-delta.up{color:var(--s1-text);}
.stat-delta.warn{color:var(--s3-text);}
.stat-sparkline{margin-top:8px;display:block;}

.chart-panel{background:var(--n0);border:1px solid var(--n3);border-radius:10px;padding:20px;margin-bottom:20px;}
.chart-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.chart-panel-title{font-size:14.5px;font-weight:600;color:var(--n9);}
.legend-dot{width:8px;height:8px;border-radius:50%;background:var(--m600);display:inline-block;margin-right:6px;}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--n3);background:var(--n0);font-size:13px;color:var(--n7);}
.filter-chip.active{background:var(--m50);border-color:var(--m300);color:var(--m700);font-weight:600;}
.select-box{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--n3);background:var(--n0);font-size:13px;color:var(--n8);}

.card-panel{background:var(--n0);border:1px solid var(--n3);border-radius:10px;overflow:hidden;}
table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--n6);text-transform:uppercase;letter-spacing:.03em;padding:12px 16px;border-bottom:1px solid var(--n3);background:var(--n1);}
table.data-table tbody td{padding:13px 16px;border-bottom:1px solid var(--n3);color:var(--n8);}
table.data-table tbody tr{transition:background .1s;cursor:pointer;}
table.data-table tbody tr:hover{background:var(--n1);}
table.data-table tbody tr:last-child td{border-bottom:none;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.badge-success{background:var(--s1-bg);color:var(--s1-text);}
.badge-warn{background:var(--s3-bg);color:var(--s3-text);}
.badge-danger{background:var(--s2-bg);color:var(--s2-text);}
.badge-neutral{background:var(--n2);color:var(--n7);}

.summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.summary-card{background:var(--n0);border:1px solid var(--n3);border-radius:10px;padding:16px 18px;}
.summary-card-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--n6);margin-bottom:8px;}
.summary-card-icon{width:28px;height:28px;border-radius:7px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:14px;}
.summary-card-amount{font-size:22px;font-weight:700;color:var(--n9);}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s ease;}
.overlay.drawer-overlay{justify-content:flex-end;}
.modal{width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--n0);border-radius:12px;padding:24px;animation:scaleIn .18s ease;}
.drawer{width:420px;max-width:92vw;height:100%;background:var(--n0);padding:24px;overflow-y:auto;animation:slideInRight .22s ease;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:17px;font-weight:700;color:var(--n9);}
.close-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:var(--n2);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--n7);margin-bottom:6px;}
.field input,.field select{width:100%;height:38px;padding:0 12px;border:1px solid var(--n3);border-radius:8px;font-size:13.5px;background:var(--n0);color:var(--n8);outline:none;}
.field input:focus,.field select:focus{border-color:var(--m600);box-shadow:0 0 0 3px var(--m100);}
.combobox-list{border:1px solid var(--n3);border-radius:8px;max-height:150px;overflow-y:auto;margin-top:4px;}
.combobox-item{padding:9px 12px;font-size:13px;color:var(--n8);}
.combobox-item:hover{background:var(--n1);}
.detail-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--n2);font-size:13.5px;}
.detail-row .k{color:var(--n6);}
.detail-row .v{color:var(--n9);font-weight:600;}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:8px;background:var(--n9);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;font-weight:500;animation:fadeIn .2s ease;box-shadow:0 8px 20px rgba(0,0,0,.18);}
.toast i{color:var(--s1);}

.skeleton{background:linear-gradient(90deg,var(--n2) 25%,var(--n1) 50%,var(--n2) 75%);background-size:800px 100%;animation:shimmer 1.3s infinite linear;border-radius:8px;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--n6);gap:10px;}
.empty-state i{font-size:36px;color:var(--n4);}

@media (max-width:900px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .summary-cards{grid-template-columns:1fr;}
  .search-box{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

/* ── 도메인 상수 ── */
const COMPANIES = [
  { id: 'c1', name: '가나텔레콤', biz: '210-88-2X4XX' },
  { id: 'c2', name: '다라렌탈',   biz: '128-81-7X1XX' },
  { id: 'c3', name: '라마모바일', biz: '305-86-4X9XX' },
  { id: 'c4', name: '바사인터넷', biz: '502-87-1X3XX' },
  { id: 'c5', name: '아자통신',   biz: '119-85-6X7XX' },
];
const MENUS = [
  { id: 'internet', label: '인터넷', icon: 'ti-wifi' },
  { id: 'rental',   label: '렌탈',   icon: 'ti-home' },
  { id: 'mobile',   label: '휴대폰', icon: 'ti-device-mobile' },
];
const NAV = [
  { id: 'main',         label: '대시보드',              icon: 'ti-layout-dashboard' },
  { id: 'applications', label: '접수내역 조회',          icon: 'ti-list-check' },
  { id: 'settlements',  label: '정산 조회',              icon: 'ti-report-money' },
  { id: 'admin',        label: '관리자 접수·정산 관리',  icon: 'ti-settings' },
];

function seedRand(seed){ let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function genApplications(companyId, seedBase){
  const rnd = seedRand(seedBase);
  const names = ['김민수','이지은','박서준','최유나','정하늘','오세훈','강다은','윤도현','임수아','한지호'];
  const statuses = [
    { key: '접수완료', tone: 'success' }, { key: '접수중', tone: 'neutral' },
    { key: '보류', tone: 'warn' }, { key: '취소', tone: 'danger' },
  ];
  const count = 9 + Math.floor(rnd() * 6);
  const arr = [];
  for (let i = 0; i < count; i++) {
    const menu = MENUS[Math.floor(rnd() * MENUS.length)];
    const st = statuses[Math.floor(rnd() * (rnd() > 0.75 ? statuses.length : 2))];
    arr.push({
      id: `${companyId}-A${String(1000 + i)}`,
      customer: names[Math.floor(rnd() * names.length)],
      phone: `010-${String(1000 + Math.floor(rnd()*8999)).slice(0,4)}-${String(1000 + Math.floor(rnd()*8999)).slice(0,4)}`,
      menuId: menu.id, menuLabel: menu.label, menuIcon: menu.icon,
      date: `2026.09.${String(1 + Math.floor(rnd()*19)).padStart(2,'0')}`,
      status: st.key, tone: st.tone,
      memo: rnd() > 0.6 ? '고객 요청으로 설치 일정 재조율 예정' : '',
    });
  }
  return arr;
}
function genSettlements(companyId, seedBase){
  const rnd = seedRand(seedBase + 500);
  const months = ['2026-06','2026-07','2026-08','2026-09'];
  const statuses = [{k:'정산완료',t:'success'},{k:'정산대기',t:'neutral'},{k:'정산보류',t:'warn'}];
  const arr = [];
  months.forEach((m) => {
    MENUS.forEach((menu) => {
      const st = statuses[Math.floor(rnd() * (m === '2026-09' ? 2 : 1))];
      arr.push({
        id: `${companyId}-S${m}-${menu.id}`,
        month: m, menuId: menu.id, menuLabel: menu.label, menuIcon: menu.icon,
        count: 4 + Math.floor(rnd() * 20),
        amount: (30 + Math.floor(rnd() * 90)) * 10000,
        status: st.k, tone: st.t,
      });
    });
  });
  return arr;
}
const SEED = {};
COMPANIES.forEach((c, idx) => { SEED[c.id] = { apps: genApplications(c.id, idx*97+13), sett: genSettlements(c.id, idx*97+13) }; });

const TREND = [
  { w: '8/25', v: 12 }, { w: '9/01', v: 18 }, { w: '9/08', v: 15 },
  { w: '9/15', v: 24 }, { w: '9/22', v: 21 }, { w: '9/29', v: 29 },
];

function Sparkline({ data, color }) {
  const w = 100, h = 28;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function StatusBadge({ status, tone }) {
  const cls = tone === 'success' ? 'badge-success' : tone === 'warn' ? 'badge-warn' : tone === 'danger' ? 'badge-danger' : 'badge-neutral';
  const icon = tone === 'success' ? 'ti-circle-check' : tone === 'danger' ? 'ti-circle-x' : tone === 'warn' ? 'ti-alert-triangle' : 'ti-clock';
  return <span className={`badge ${cls}`}><i className={`ti ${icon}`}></i>{status}</span>;
}

function RippleButton({ className, onClick, children, ...rest }) {
  const ref = useRef(null);
  const handle = (e) => {
    const btn = ref.current;
    if (btn) {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      setTimeout(() => span.remove(), 560);
    }
    onClick && onClick(e);
  };
  return <button ref={ref} className={className} onClick={handle} {...rest}>{children}</button>;
}

function Toast({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div className="toast" key={t.id}><i className="ti ti-circle-check"></i>{t.msg}</div>
      ))}
    </div>
  );
}

function CompanyCombobox({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const filtered = COMPANIES.filter(c => c.name.includes(q));
  const selected = COMPANIES.find(c => c.id === value);
  return (
    <div className="field" style={{ position: 'relative' }}>
      <label>거래처 지정</label>
      <input
        value={open ? q : (selected ? selected.name : '')}
        placeholder="거래처명 검색"
        onFocus={() => { setOpen(true); setQ(''); }}
        onChange={(e) => setQ(e.target.value)}
      />
      {open && (
        <div className="combobox-list">
          {filtered.map(c => (
            <div key={c.id} className="combobox-item" onClick={() => { onChange(c.id); setOpen(false); }}>
              {c.name} <span style={{ color: 'var(--n5)', fontSize: 11 }}>· {c.biz}</span>
            </div>
          ))}
          {filtered.length === 0 && <div className="combobox-item" style={{ color: 'var(--n5)' }}>일치하는 거래처가 없습니다</div>}
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [activeCompany, setActiveCompany] = useState('c1');
  const [companyOpen, setCompanyOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const pushToast = (msg) => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };

  const [appMenuFilter, setAppMenuFilter] = useState('all');
  const [appStatusFilter, setAppStatusFilter] = useState('all');
  const [appSearch, setAppSearch] = useState('');
  const [selectedApp, setSelectedApp] = useState(null);

  const [settMonth, setSettMonth] = useState('2026-09');

  const [adminTab, setAdminTab] = useState('applications');
  const [showAppModal, setShowAppModal] = useState(false);
  const [showSettModal, setShowSettModal] = useState(false);
  const [editingApp, setEditingApp] = useState(null);
  const [allApps, setAllApps] = useState(() => {
    const merged = [];
    COMPANIES.forEach(c => SEED[c.id].apps.forEach(a => merged.push({ ...a, companyId: c.id, companyName: c.name })));
    return merged;
  });
  const [allSett, setAllSett] = useState(() => {
    const merged = [];
    COMPANIES.forEach(c => SEED[c.id].sett.forEach(s => merged.push({ ...s, companyId: c.id, companyName: c.name })));
    return merged;
  });

  const companyApps = allApps.filter(a => a.companyId === activeCompany);
  const companySett = allSett.filter(s => s.companyId === activeCompany);

  const filteredApps = companyApps.filter(a =>
    (appMenuFilter === 'all' || a.menuId === appMenuFilter) &&
    (appStatusFilter === 'all' || a.status === appStatusFilter) &&
    (appSearch === '' || a.customer.includes(appSearch) || a.phone.includes(appSearch))
  );

  const monthOptions = [...new Set(companySett.map(s => s.month))];
  const monthSett = companySett.filter(s => s.month === settMonth);
  const settByMenu = MENUS.map(m => ({
    ...m,
    total: monthSett.filter(s => s.menuId === m.id).reduce((sum, s) => sum + s.amount, 0),
  }));

  const kpi = {
    total: companyApps.length,
    inProgress: companyApps.filter(a => a.status === '접수중').length,
    settleAmount: companySett.filter(s => s.month === '2026-09').reduce((s, x) => s + x.amount, 0),
    settlePending: companySett.filter(s => s.status === '정산대기').length,
  };

  const closeCompany = (id) => { setActiveCompany(id); setCompanyOpen(false); };

  const downloadCsv = () => {
    const rows = [['정산월','메뉴','건수','정산금액','상태'], ...monthSett.map(s => [s.month, s.menuLabel, s.count, s.amount, s.status])];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `정산내역_${settMonth}.csv`; a.click();
    URL.revokeObjectURL(url);
    pushToast('정산 내역 CSV 파일이 다운로드되었습니다');
  };

  const submitNewApp = (e) => {
    e.preventDefault();
    const f = e.target;
    const companyId = f.company.value;
    const company = COMPANIES.find(c => c.id === companyId);
    if (!company) { pushToast('거래처를 지정해 주세요'); return; }
    const newRow = {
      id: `${companyId}-A${Date.now()}`, companyId, companyName: company.name,
      customer: f.customer.value, phone: f.phone.value,
      menuId: f.menu.value, menuLabel: MENUS.find(m => m.id === f.menu.value).label,
      menuIcon: MENUS.find(m => m.id === f.menu.value).icon,
      date: '2026.09.20', status: f.status.value,
      tone: f.status.value === '접수완료' ? 'success' : f.status.value === '보류' ? 'warn' : f.status.value === '취소' ? 'danger' : 'neutral',
      memo: f.memo.value,
    };
    setAllApps(prev => editingApp ? prev.map(a => a.id === editingApp.id ? { ...a, ...newRow, id: editingApp.id } : a) : [newRow, ...prev]);
    setShowAppModal(false); setEditingApp(null);
    pushToast(editingApp ? '접수 내역이 수정되었습니다' : '신규 접수가 등록되었습니다');
  };

  const [companyForm, setCompanyForm] = useState('c1');

  const navClick = (id) => setScreen(id);

  return (
    <div data-archetype="topbar-analytics" style={{ width: '100%', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="app-header">
        <div className="brand"><span className="brand-mark" style={{ borderRadius: '7px', boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}><i className="ti ti-building-store"></i></span>파트너허브</div>

        <div className="company-switcher">
          <button className="company-switcher-btn" onClick={() => setCompanyOpen(o => !o)}>
            <i className="ti ti-building"></i>
            {COMPANIES.find(c => c.id === activeCompany).name}
            <i className="ti ti-chevron-down" style={{ fontSize: 12 }}></i>
          </button>
          {companyOpen && (
            <div className="company-dropdown">
              {COMPANIES.map(c => (
                <div key={c.id} className={`company-dropdown-item ${c.id === activeCompany ? 'active' : ''}`} onClick={() => closeCompany(c.id)}>
                  <span>{c.name}</span>
                  {c.id === activeCompany && <i className="ti ti-check"></i>}
                </div>
              ))}
              <div className="rls-note"><i className="ti ti-lock" style={{ fontSize: 12 }}></i>선택한 거래처 데이터만 조회됩니다</div>
            </div>
          )}
        </div>

        <nav className="global-nav">
          {NAV.map(item => (
            <button key={item.id} className={`nav-link ${screen === item.id ? 'active' : ''}`} onClick={() => navClick(item.id)}>
              <i className={`ti ${item.icon}`}></i>{item.label}
            </button>
          ))}
        </nav>

        <div className="header-actions">
          <div className="search-box"><i className="ti ti-search"></i><input placeholder="검색" /></div>
          <button className="icon-btn" onClick={() => pushToast('새 알림이 없습니다')}>
            <i className="ti ti-bell"></i><span className="notif-dot"></span>
          </button>
          <div className="avatar">관</div>
        </div>
      </header>

      {screen !== 'admin' && (
        <nav className="tab-bar">
          {['전체', '인터넷', '렌탈', '휴대폰'].map((label, idx) => {
            const val = idx === 0 ? 'all' : MENUS[idx - 1].id;
            const active = screen === 'applications' ? appMenuFilter === val : screen === 'settlements' ? (idx===0) : idx === 0;
            return (
              <button key={label} className={`tab ${active ? 'active' : ''}`} onClick={() => { if (screen === 'applications') setAppMenuFilter(val); }}>
                {idx > 0 && <i className={`ti ${MENUS[idx-1].icon}`}></i>}{label}
              </button>
            );
          })}
        </nav>
      )}

      <main className="content">
        {screen === 'main' && (
          <React.Fragment>
            <div className="page-head">
              <div>
                <h1 className="page-title">{COMPANIES.find(c => c.id === activeCompany).name} 대시보드</h1>
                <p className="page-sub">로그인한 거래처의 접수·정산 데이터만 집계해 보여줍니다 (Row-Level Security)</p>
              </div>
            </div>
            <div className="stat-row">
              <div className="stat-card" style={{ animationDelay: '0ms' }}>
                <div className="stat-label"><i className="ti ti-list-check"></i>총 접수 건수</div>
                <div className="stat-value">{kpi.total}건</div>
                <Sparkline data={TREND.map(t => t.v)} color="var(--m600)" />
              </div>
              <div className="stat-card" style={{ animationDelay: '40ms' }}>
                <div className="stat-label"><i className="ti ti-clock"></i>접수 진행 중</div>
                <div className="stat-value">{kpi.inProgress}건</div>
                <div className="stat-delta warn"><i className="ti ti-arrow-up-right"></i>처리 대기</div>
              </div>
              <div className="stat-card" style={{ animationDelay: '80ms' }}>
                <div className="stat-label"><i className="ti ti-report-money"></i>이번 달 정산액</div>
                <div className="stat-value">{(kpi.settleAmount / 10000).toLocaleString()}만원</div>
                <div className="stat-delta up"><i className="ti ti-arrow-up-right"></i>전월 대비 집계</div>
              </div>
              <div className="stat-card" style={{ animationDelay: '120ms' }}>
                <div className="stat-label"><i className="ti ti-hourglass"></i>정산 대기</div>
                <div className="stat-value">{kpi.settlePending}건</div>
                <div className="stat-delta warn"><i className="ti ti-alert-triangle"></i>확인 필요</div>
              </div>
            </div>

            <div className="chart-panel">
              <div className="chart-panel-head">
                <div className="chart-panel-title"><span className="legend-dot"></span>최근 6주 접수 추이</div>
              </div>
              <ResponsiveContainer width="100%" height={220}>
                <AreaChart data={TREND}>
                  <defs>
                    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#2563eb" stopOpacity={0.28} />
                      <stop offset="100%" stopColor="#2563eb" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid vertical={false} stroke="#e5e5e6" />
                  <XAxis dataKey="w" tick={{ fontSize: 12, fill: '#71747a' }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fontSize: 12, fill: '#71747a' }} axisLine={false} tickLine={false} width={28} />
                  <Tooltip />
                  <Area type="monotone" dataKey="v" stroke="#2563eb" strokeWidth={2.5} fill="url(#areaFill)" />
                </AreaChart>
              </ResponsiveContainer>
            </div>

            <div className="card-panel">
              <table className="data-table">
                <thead><tr><th>최근 접수</th><th>메뉴</th><th>접수일</th><th>상태</th></tr></thead>
                <tbody>
                  {companyApps.slice(0, 5).map(a => (
                    <tr key={a.id} onClick={() => { setScreen('applications'); setSelectedApp(a); }}>
                      <td>{a.customer} · {a.phone}</td>
                      <td><i className={`ti ${a.menuIcon}`} style={{ marginRight: 6, color: 'var(--n6)' }}></i>{a.menuLabel}</td>
                      <td>{a.date}</td>
                      <td><StatusBadge status={a.status} tone={a.tone} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

        {screen === 'applications' && (
          <React.Fragment>
            <div className="page-head">
              <div>
                <h1 className="page-title">접수내역 조회</h1>
                <p className="page-sub">{COMPANIES.find(c => c.id === activeCompany).name}의 메뉴별 접수 건과 진행 상태를 조회합니다</p>
              </div>
            </div>
            <div className="toolbar">
              <div className="search-box" style={{ width: 220 }}>
                <i className="ti ti-search"></i>
                <input placeholder="고객명·연락처 검색" value={appSearch} onChange={e => setAppSearch(e.target.value)} />
              </div>
              <select className="select-box" value={appStatusFilter} onChange={e => setAppStatusFilter(e.target.value)}>
                <option value="all">전체 상태</option>
                <option value="접수완료">접수완료</option>
                <option value="접수중">접수중</option>
                <option value="보류">보류</option>
                <option value="취소">취소</option>
              </select>
              {appMenuFilter !== 'all' && (
                <span className="filter-chip active" onClick={() => setAppMenuFilter('all')}>
                  {MENUS.find(m=>m.id===appMenuFilter).label} 필터 해제 <i className="ti ti-x" style={{fontSize:11}}></i>
                </span>
              )}
            </div>
            <div className="card-panel">
              {filteredApps.length === 0 ? (
                <div className="empty-state"><i className="ti ti-inbox"></i>조건에 맞는 접수 내역이 없습니다</div>
              ) : (
                <table className="data-table">
                  <thead><tr><th>접수번호</th><th>고객명</th><th>연락처</th><th>메뉴</th><th>신청일</th><th>상태</th></tr></thead>
                  <tbody>
                    {filteredApps.map(a => (
                      <tr key={a.id} onClick={() => setSelectedApp(a)}>
                        <td style={{ color: 'var(--n6)' }}>{a.id}</td>
                        <td style={{ fontWeight: 600 }}>{a.customer}</td>
                        <td>{a.phone}</td>
                        <td><i className={`ti ${a.menuIcon}`} style={{ marginRight: 6, color: 'var(--n6)' }}></i>{a.menuLabel}</td>
                        <td>{a.date}</td>
                        <td><StatusBadge status={a.status} tone={a.tone} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </React.Fragment>
        )}

        {screen === 'settlements' && (
          <React.Fragment>
            <div className="page-head">
              <div>
                <h1 className="page-title">정산 조회</h1>
                <p className="page-sub">{COMPANIES.find(c => c.id === activeCompany).name}의 메뉴별 정산 내역을 기간별로 조회합니다</p>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <select className="select-box" value={settMonth} onChange={e => setSettMonth(e.target.value)}>
                  {monthOptions.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
                <RippleButton className="btn-ghost" onClick={downloadCsv}><i className="ti ti-download"></i>CSV 다운로드</RippleButton>
              </div>
            </div>
            <div className="summary-cards">
              {settByMenu.map(m => (
                <div className="summary-card" key={m.id}>
                  <div className="summary-card-head"><span className="summary-card-icon"><i className={`ti ${m.icon}`}></i></span>{m.label} 정산 합계</div>
                  <div className="summary-card-amount">{(m.total / 10000).toLocaleString()}만원</div>
                </div>
              ))}
            </div>
            <div className="card-panel">
              <table className="data-table">
                <thead><tr><th>정산월</th><th>메뉴</th><th>건수</th><th>정산금액</th><th>상태</th></tr></thead>
                <tbody>
                  {monthSett.map(s => (
                    <tr key={s.id} onClick={() => pushToast(`${s.menuLabel} ${s.month} 정산 상세를 확인합니다`)}>
                      <td>{s.month}</td>
                      <td><i className={`ti ${s.menuIcon}`} style={{ marginRight: 6, color: 'var(--n6)' }}></i>{s.menuLabel}</td>
                      <td>{s.count}건</td>
                      <td style={{ fontWeight: 600 }}>{s.amount.toLocaleString()}원</td>
                      <td><StatusBadge status={s.status} tone={s.tone} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}

        {screen === 'admin' && (
          <React.Fragment>
            <div className="page-head">
              <div>
                <h1 className="page-title">관리자 접수·정산 관리</h1>
                <p className="page-sub">전체 거래처의 접수·정산 내역을 수기로 등록하고 거래처를 지정합니다</p>
              </div>
              <RippleButton className="btn-primary" onClick={() => { setEditingApp(null); setShowAppModal(true); }}>
                <i className="ti ti-plus"></i>신규 접수 등록
              </RippleButton>
            </div>
            <nav className="tab-bar" style={{ padding: '0 0 0', marginBottom: 14, borderBottom: '1px solid var(--n3)' }}>
              {[['applications','접수 관리'],['settlements','정산 관리'],['partners','거래처 관리']].map(([id,label]) => (
                <button key={id} className={`tab ${adminTab === id ? 'active' : ''}`} onClick={() => setAdminTab(id)}>{label}</button>
              ))}
            </nav>

            {adminTab === 'applications' && (
              <div className="card-panel">
                <table className="data-table">
                  <thead><tr><th>거래처</th><th>고객명</th><th>메뉴</th><th>신청일</th><th>상태</th><th></th></tr></thead>
                  <tbody>
                    {allApps.slice(0, 14).map(a => (
                      <tr key={a.id}>
                        <td>{a.companyName}</td>
                        <td>{a.customer}</td>
                        <td><i className={`ti ${a.menuIcon}`} style={{ marginRight: 6, color: 'var(--n6)' }}></i>{a.menuLabel}</td>
                        <td>{a.date}</td>
                        <td><StatusBadge status={a.status} tone={a.tone} /></td>
                        <td onClick={e => e.stopPropagation()}>
                          <button className="icon-btn" onClick={() => { setEditingApp(a); setShowAppModal(true); }}><i className="ti ti-edit"></i></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {adminTab === 'settlements' && (
              <div className="card-panel">
                <table className="data-table">
                  <thead><tr><th>거래처</th><th>정산월</th><th>메뉴</th><th>정산금액</th><th>상태</th></tr></thead>
                  <tbody>
                    {allSett.slice(0, 14).map(s => (
                      <tr key={s.id} onClick={() => setShowSettModal(true)}>
                        <td>{s.companyName}</td>
                        <td>{s.month}</td>
                        <td><i className={`ti ${s.menuIcon}`} style={{ marginRight: 6, color: 'var(--n6)' }}></i>{s.menuLabel}</td>
                        <td style={{ fontWeight: 600 }}>{s.amount.toLocaleString()}원</td>
                        <td><StatusBadge status={s.status} tone={s.tone} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {adminTab === 'partners' && (
              <div className="card-panel">
                <table className="data-table">
                  <thead><tr><th>거래처명</th><th>사업자번호</th><th>접수 건수</th><th>계정 상태</th></tr></thead>
                  <tbody>
                    {COMPANIES.map(c => (
                      <tr key={c.id} onClick={() => pushToast(`${c.name} 계정 정보를 확인합니다`)}>
                        <td style={{ fontWeight: 600 }}>{c.name}</td>
                        <td>{c.biz}</td>
                        <td>{allApps.filter(a => a.companyId === c.id).length}건</td>
                        <td><span className="badge badge-success"><i className="ti ti-circle-check"></i>활성</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </React.Fragment>
        )}
      </main>

      {selectedApp && (
        <div className="overlay drawer-overlay" onClick={() => setSelectedApp(null)}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">접수 상세</div>
              <button className="close-btn" onClick={() => setSelectedApp(null)}><i className="ti ti-x"></i></button>
            </div>
            <div className="detail-row"><span className="k">접수번호</span><span className="v">{selectedApp.id}</span></div>
            <div className="detail-row"><span className="k">고객명</span><span className="v">{selectedApp.customer}</span></div>
            <div className="detail-row"><span className="k">연락처</span><span className="v">{selectedApp.phone}</span></div>
            <div className="detail-row"><span className="k">메뉴</span><span className="v">{selectedApp.menuLabel}</span></div>
            <div className="detail-row"><span className="k">신청일</span><span className="v">{selectedApp.date}</span></div>
            <div className="detail-row"><span className="k">상태</span><span className="v"><StatusBadge status={selectedApp.status} tone={selectedApp.tone} /></span></div>
            <div style={{ marginTop: 16 }}>
              <label style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--n7)' }}>메모</label>
              <p style={{ fontSize: 13.5, color: 'var(--n8)', marginTop: 6, lineHeight: 1.6 }}>{selectedApp.memo || '등록된 메모가 없습니다.'}</p>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>
              <button className="btn-ghost" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setSelectedApp(null)}>닫기</button>
              <RippleButton className="btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { pushToast('처리 상태가 갱신되었습니다'); setSelectedApp(null); }}>처리 완료로 변경</RippleButton>
            </div>
          </div>
        </div>
      )}

      {showAppModal && (
        <div className="overlay" onClick={() => { setShowAppModal(false); setEditingApp(null); }}>
          <form className="modal" onClick={e => e.stopPropagation()} onSubmit={submitNewApp}>
            <div className="modal-head">
              <div className="modal-title">{editingApp ? '접수 내역 수정' : '신규 접수 등록'}</div>
              <button type="button" className="close-btn" onClick={() => { setShowAppModal(false); setEditingApp(null); }}><i className="ti ti-x"></i></button>
            </div>
            <input type="hidden" name="company" value={companyForm} readOnly />
            <CompanyCombobox value={editingApp ? editingApp.companyId : companyForm} onChange={setCompanyForm} />
            <div className="field"><label>고객명</label><input name="customer" required defaultValue={editingApp ? editingApp.customer : ''} placeholder="예: 김민수" /></div>
            <div className="field"><label>연락처</label><input name="phone" required defaultValue={editingApp ? editingApp.phone : ''} placeholder="010-0000-0000" /></div>
            <div className="field"><label>메뉴</label>
              <select name="menu" defaultValue={editingApp ? editingApp.menuId : 'internet'}>
                {MENUS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
            </div>
            <div className="field"><label>진행 상태</label>
              <select name="status" defaultValue={editingApp ? editingApp.status : '접수중'}>
                <option>접수중</option><option>접수완료</option><option>보류</option><option>취소</option>
              </select>
            </div>
            <div className="field"><label>메모</label><input name="memo" defaultValue={editingApp ? editingApp.memo : ''} placeholder="선택 입력" /></div>
            <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
              <button type="button" className="btn-ghost" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { setShowAppModal(false); setEditingApp(null); }}>취소</button>
              <RippleButton className="btn-primary" style={{ flex: 1, justifyContent: 'center' }}>{editingApp ? '수정 저장' : '등록'}</RippleButton>
            </div>
          </form>
        </div>
      )}

      {showSettModal && (
        <div className="overlay" onClick={() => setShowSettModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">정산 내역 수정</div>
              <button className="close-btn" onClick={() => setShowSettModal(false)}><i className="ti ti-x"></i></button>
            </div>
            <CompanyCombobox value={companyForm} onChange={setCompanyForm} />
            <div className="field"><label>정산 상태</label>
              <select defaultValue="정산완료"><option>정산완료</option><option>정산대기</option><option>정산보류</option></select>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
              <button className="btn-ghost" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setShowSettModal(false)}>취소</button>
              <RippleButton className="btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { pushToast('정산 내역이 수정되었습니다'); setShowSettModal(false); }}>저장</RippleButton>
            </div>
          </div>
        </div>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
