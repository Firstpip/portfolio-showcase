<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>파트너옵스 — 거래처 통합 관리 및 정산 분석 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 15°, light) ── */
:root{
  --m50:#fff1ed; --m100:#ffe4db; --m200:#ffc9b8; --m300:#ffa88c; --m400:#ff835c;
  --m500:#ff612e; --m600:#ff3e00; --m700:#d13300; --m800:#a32800; --m900:#731c00;
  --n0:#fafafa; --n1:#ffffff; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab6b5; --n6:#989290; --n7:#666666; --n8:#5a5553; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
#root{width:100%;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes liftIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,62,0,.16);}50%{box-shadow:0 0 0 8px rgba(255,62,0,0);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes spinSlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:20px 14px;z-index:30;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;}
.sidebar-brand-mark{width:32px;height:32px;border-radius:10px;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 10px rgba(255,62,0,.25);}
.sidebar-brand-name{font-size:15px;font-weight:700;color:var(--n9);}
.env-pill{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--n2);color:var(--n7);}
.sidebar-section{margin-bottom:18px;}
.sidebar-section-title{font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.06em;padding:0 10px;margin-bottom:8px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--n7);margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;}
.sidebar-link:hover{background:var(--n2);color:var(--n9);}
.sidebar-link.active{background:var(--m50);color:var(--m700);font-weight:700;}
.sidebar-link .badge-mini{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--n2);color:var(--n7);padding:2px 7px;border-radius:999px;}
.sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--n2);}
.sidebar-foot .avatar{width:32px;height:32px;border-radius:50%;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}

.main-wrap{margin-left:250px;flex:1;min-width:0;width:calc(100% - 250px);min-height:100vh;}
.page-header{padding:26px 32px 0;}
.page-title-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.page-title{font-size:24px;font-weight:800;color:var(--n9);margin:0 0 4px;letter-spacing:-.01em;}
.page-meta{font-size:13px;color:var(--n6);margin:0;}
.page-actions{display:flex;gap:10px;}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);color:var(--n8);font-size:13.5px;font-weight:600;}
.btn-secondary:hover{border-color:var(--n5);}
.btn-primary{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;border-radius:999px;border:none;background:var(--m600);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 6px 16px rgba(255,62,0,.22);}
.btn-primary:hover{background:var(--m700);}

.content{padding:22px 32px 64px;}
.section-gap{margin-bottom:24px;}

.insight-hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,var(--m700),var(--m900));padding:32px 36px;margin-bottom:24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.insight-hero-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.02em;}
.insight-hero-value{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:10px;}
.insight-hero-sub{font-size:13px;color:rgba(255,255,255,.68);margin-top:10px;}
.insight-hero-wave{position:absolute;right:0;top:0;bottom:0;width:46%;opacity:.9;pointer-events:none;}
.insight-row{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px;}
.card{background:var(--n1);border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(58,55,54,.06), 0 10px 24px rgba(58,55,54,.05);animation:liftIn .35s ease both;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:15.5px;font-weight:700;color:var(--n9);}
.card-sub{font-size:12px;color:var(--n6);margin-top:2px;}

.kpi-side{display:flex;flex-direction:column;gap:14px;}
.stat-card{background:var(--n1);border-radius:16px;padding:18px 20px;box-shadow:0 1px 3px rgba(58,55,54,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;animation:liftIn .35s ease both;transition:transform .18s ease, box-shadow .18s ease;}
.stat-card:hover{transform:scale(1.02);box-shadow:0 10px 28px rgba(58,55,54,.10);}
.watch-item{transition:transform .15s ease;}
.watch-item:hover{transform:scale(1.015);}
.stat-card-icon{width:38px;height:38px;border-radius:12px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.stat-card-icon.hot{background:var(--m50);color:var(--m700);}
.stat-label{font-size:12px;color:var(--n6);font-weight:600;}
.stat-value{font-size:24px;font-weight:800;color:var(--n9);margin-top:2px;}
.stat-delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-top:3px;}
.stat-delta.up{color:var(--s1-text);}
.stat-delta.warn{color:var(--s3-text);}

.watch-list{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.watch-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;}
.watch-item:hover{background:var(--n2);}
.watch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.watch-dot.warn{background:var(--s3);animation:glowPulse 2s infinite;}
.watch-dot.ok{background:var(--n4);}
.watch-name{font-size:13px;font-weight:600;color:var(--n9);}
.watch-sub{font-size:11.5px;color:var(--n6);}
.watch-amt{margin-left:auto;font-size:13px;font-weight:700;color:var(--n9);}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--n8);}
.donut-legend-item .sw{width:10px;height:10px;border-radius:3px;}

.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.hbar-label{width:64px;font-size:12px;color:var(--n7);flex-shrink:0;}
.hbar-track{flex:1;height:10px;border-radius:999px;background:var(--n2);overflow:hidden;}
.hbar-fill{height:100%;border-radius:999px;transform-origin:left;animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.hbar-val{width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--n9);}

.timeline{display:flex;flex-direction:column;gap:0;}
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--n2);}
.timeline-item:last-child{border-bottom:none;}
.timeline-icon{width:30px;height:30px;border-radius:10px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.timeline-icon.warn{background:var(--s3-bg);color:var(--s3-text);}
.timeline-text{font-size:12.5px;color:var(--n8);line-height:1.5;}
.timeline-time{font-size:11px;color:var(--n6);margin-top:2px;}

.tab-bar{display:flex;gap:8px;margin-bottom:16px;}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);font-size:13px;font-weight:600;color:var(--n7);}
.tab.active{background:var(--n9);color:#fff;border-color:var(--n9);}
.data-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);font-size:13px;min-width:200px;outline:none;}
.search:focus{border-color:var(--m400);}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);font-size:13px;color:var(--n7);}
.export-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--n3);background:var(--n1);font-size:13px;font-weight:600;color:var(--n8);}
.export-btn:hover{border-color:var(--n5);}

.data-table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table thead th{text-align:left;font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--n3);}
table.data-table tbody td{padding:14px;border-bottom:1px solid var(--n2);color:var(--n8);}
table.data-table tbody tr:hover{background:var(--n0);}
table.data-table tbody tr:last-child td{border-bottom:none;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge-success{background:var(--s1-bg);color:var(--s1-text);}
.badge-warn{background:var(--s3-bg);color:var(--s3-text);}
.badge-danger{background:var(--n9);color:#fff;}
.badge-neutral{background:var(--n2);color:var(--n7);}

.grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;}
.form-panel .field{margin-bottom:16px;}
.form-panel label{display:block;font-size:12.5px;font-weight:700;color:var(--n7);margin-bottom:7px;}
.form-panel input,.form-panel select{width:100%;height:42px;padding:0 14px;border:1px solid var(--n3);border-radius:12px;font-size:13.5px;background:var(--n1);outline:none;}
.form-panel input:focus,.form-panel select:focus{border-color:var(--m500);box-shadow:0 0 0 4px var(--m100);}

.dropzone{border:2px dashed var(--n4);border-radius:18px;padding:48px 24px;text-align:center;background:var(--n1);transition:border-color .15s;}
.dropzone.drag{border-color:var(--m500);background:var(--m50);}
.dropzone i{font-size:38px;color:var(--n5);}
.progress-track{height:10px;border-radius:999px;background:var(--n2);overflow:hidden;margin-top:16px;}
.progress-fill{height:100%;background:var(--m600);border-radius:999px;transition:width .25s ease;}
.spin{display:inline-block;animation:spinSlow 1s linear infinite;}

.combobox-list{border:1px solid var(--n3);border-radius:12px;max-height:150px;overflow-y:auto;margin-top:6px;background:var(--n1);}
.combobox-item{padding:10px 14px;font-size:13px;color:var(--n8);}
.combobox-item:hover{background:var(--n2);}

.overlay{position:fixed;inset:0;background:rgba(32,30,30,.5);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s ease;}
.modal{width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--n1);border-radius:20px;padding:28px;animation:scaleIn .18s ease;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-size:18px;font-weight:800;color:var(--n9);}
.close-btn{width:34px;height:34px;border-radius:12px;border:none;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:var(--n3);}

.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:10px;background:var(--n9);color:#fff;padding:14px 18px;border-radius:14px;font-size:13.5px;font-weight:600;animation:liftIn .25s ease;box-shadow:0 10px 24px rgba(0,0,0,.22);}
.toast i{color:var(--m400);}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--n6);gap:10px;}
.empty i{font-size:34px;color:var(--n4);}

.toggle-switch{width:42px;height:24px;border-radius:999px;background:var(--n3);position:relative;border:none;flex-shrink:0;}
.toggle-switch.on{background:var(--m500);}
.toggle-switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s ease;}
.toggle-switch.on .knob{transform:translateX(18px);}

@media (max-width:1000px){
  .insight-row{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

const COMPANIES = [
  { id: 'c1', name: '가나텔레콤', biz: '210-88-2X4XX', manager: '이서연', status: '활성', apps: 34, anomaly: true },

const MENUS = [

  { id: 'rental',   label: '렌탈',   icon: 'ph-house-line', color: 'var(--n6)' },
  { id: 'mobile',   label: '휴대폰', icon: 'ph-device-mobile', color: 'var(--n4)' },
];
const NAV_GROUPS = [

  { title: '거래처', items: [

const TREND = [
  { m: '4월', v: 820 }, { m: '5월', v: 940 }, { m: '6월', v: 880 },
  { m: '7월', v: 1120 }, { m: '8월', v: 1260 }, { m: '9월', v: 1480 },
];

  { id: 'R3', company: '다라렌탈',   month: '2026-09', menu: '렌탈',   amount: 2310000, status: '정상', tone: 'success' },
  { id: 'R4', company: '아자통신',   month: '2026-09', menu: '인터넷', amount: 1980000, status: '정상', tone: 'success' },
  { id: 'R5', company: '바사인터넷', month: '2026-09', menu: '휴대폰', amount: 3540000, status: '정상', tone: 'success' },
  { id: 'R6', company: '가나텔레콤', month: '2026-08', menu: '렌탈',   amount: 2870000, status: '정상', tone: 'success' },
  { id: 'R7', company: '라마모바일', month: '2026-08', menu: '인터넷', amount: 4110000, status: '정상', tone: 'success' },
];
const NOTIF_LOG = [
  { text: '가나텔레콤 인터넷 정산이 임계치(월 평균 대비 +45%)를 초과했습니다', time: '오늘 09:12', warn: true },
  { text: '라마모바일 휴대폰 정산 이상치 알림이 발송되었습니다', time: '오늘 08:40', warn: true },
  { text: '다라렌탈 렌탈 9월 정산이 정상 처리되었습니다', time: '어제 18:02', warn: false },
  { text: '엑셀 데이터 이관 배치가 정상 완료되었습니다 (128건)', time: '어제 11:20', warn: false },
];

function Toast({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => <div className="toast" key={t.id}><i className="ph ph-check-circle"></i>{t.msg}</div>)}
    </div>
  );
}

function Sparkline({ data, color }) {
  const w = 84, h = 26;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function StatBadge({ status, tone }) {
  const cls = tone === 'success' ? 'badge-success' : tone === 'warn' ? 'badge-warn' : tone === 'danger' ? 'badge-danger' : 'badge-neutral';
  const icon = tone === 'success' ? 'ph-check-circle' : tone === 'warn' ? 'ph-warning-circle' : tone === 'danger' ? 'ph-x-circle' : 'ph-clock';
  return <span className={`badge ${cls}`}><i className={`ph ${icon}`}></i>{status}</span>;
}

function CompanyCombobox({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const filtered = COMPANIES.filter(c => c.name.includes(q));
  const sel = COMPANIES.find(c => c.id === value);
  return (
    <div className="field" style={{ position: 'relative' }}>
      <label>거래처 지정</label>
      <input value={open ? q : (sel ? sel.name : '')} placeholder="거래처명 검색"
        onFocus={() => { setOpen(true); setQ(''); }} onChange={e => setQ(e.target.value)} />
      {open && (
        <div className="combobox-list">
          {filtered.map(c => (
            <div key={c.id} className="combobox-item" onClick={() => { onChange(c.id); setOpen(false); }}>
              {c.name} <span style={{ color: 'var(--n5)', fontSize: 11 }}>· {c.biz}</span>
            </div>
          ))}
          {filtered.length === 0 && <div className="combobox-item" style={{ color: 'var(--n5)' }}>일치하는 거래처가 없습니다</div>}
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const pushToast = (msg) => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  };

  const [companies, setCompanies] = useState(COMPANIES);
  const [showAddPartner, setShowAddPartner] = useState(false);
  const [partnerForm, setPartnerForm] = useState({ name: '', biz: '', manager: '' });

  const [reportTab, setReportTab] = useState('all');
  const filteredReports = REPORT_ROWS.filter(r => reportTab === 'all' || r.menu === MENUS.find(m => m.id === reportTab).label);

  const [dragOver, setDragOver] = useState(false);
  const [uploadState, setUploadState] = useState('idle'); // idle | uploading | done
  const [uploadProgress, setUploadProgress] = useState(0);
  const fileInputRef = useRef(null);

  const startUpload = () => {
    setUploadState('uploading'); setUploadProgress(0);
    const timer = setInterval(() => {
      setUploadProgress(p => {
        if (p >= 100) { clearInterval(timer); setUploadState('done'); return 100; }
        return p + 14;
      });
    }, 180);
  };

  const submitPartner = (e) => {
    e.preventDefault();
    if (!partnerForm.name) { pushToast('거래처명을 입력해 주세요'); return; }
    setCompanies(prev => [{ id: 'c' + Date.now(), name: partnerForm.name, biz: partnerForm.biz || '000-00-0XXXX', manager: partnerForm.manager || '-', status: '활성', apps: 0, anomaly: false }, ...prev]);
    setShowAddPartner(false);
    setPartnerForm({ name: '', biz: '', manager: '' });
    pushToast('거래처와 초기 로그인 계정이 함께 발급되었습니다');
  };

  const toggleLock = (id) => {
    setCompanies(prev => prev.map(c => c.id === id ? { ...c, status: c.status === '활성' ? '잠금' : '활성' } : c));
    pushToast('거래처 계정 상태가 변경되었습니다');
  };

  const donutData = MENUS.map(m => ({ ...m, pct: m.id === 'internet' ? 46 : m.id === 'mobile' ? 34 : 20 }));
  const totalAnomaly = REPORT_ROWS.filter(r => r.tone === 'warn').length;

  const donutGradient = (() => {
    let acc = 0;
    return donutData.map(d => {
      const start = acc; acc += d.pct;
      return `${d.color} ${start}% ${acc}%`;
    }).join(', ');
  })();

  return (
    <div data-archetype="stripe-multipane" className="shell">
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <span className="sidebar-brand-mark" style={{ borderRadius: '10px', boxShadow: '0 10px 28px rgba(0,0,0,0.10)' }}><i className="ph ph-flow-arrow"></i></span>
          <span className="sidebar-brand-name">파트너옵스</span>
          <span className="env-pill">Production</span>
        </div>
        {NAV_GROUPS.map(g => (
          <div className="sidebar-section" key={g.title}>
            <div className="sidebar-section-title">{g.title}</div>
            {g.items.map(item => (
              <button key={item.id} className={`sidebar-link ${screen === item.id ? 'active' : ''}`} onClick={() => setScreen(item.id)}>
                <i className={`ph ${item.icon}`}></i>{item.label}
                {item.id === 'reports' && totalAnomaly > 0 && <span className="badge-mini">{totalAnomaly}</span>}
              </button>
            ))}
          </div>
        ))}
        <div className="sidebar-foot">
          <span className="avatar">관</span>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--n9)' }}>운영 관리자</div>
            <div style={{ fontSize: 11, color: 'var(--n6)' }}>admin@partnerops</div>
          </div>
        </div>
      </aside>

      <div className="main-wrap">
        {screen === 'main' && (
          <React.Fragment>
            <div className="page-header">
              <div className="page-title-row">
                <div>
                  <h1 className="page-title">통합 운영 대시보드</h1>
                  <p className="page-meta">전체 거래처의 접수·정산 현황을 한눈에 확인합니다 · 마지막 갱신 09:30</p>
                </div>
                <div className="page-actions">
                  <button className="btn-secondary" onClick={() => pushToast('조회 기간이 최근 6개월로 설정되었습니다')}><i className="ph ph-calendar-blank"></i>최근 6개월</button>
                  <button className="btn-primary" onClick={() => { setScreen('reports'); pushToast('정산 리포트 화면으로 이동합니다'); }}><i className="ph ph-file-arrow-down"></i>리포트 내보내기</button>
                </div>
              </div>
            </div>
            <div className="content">
              <div className="insight-hero">
                <div>
                  <div className="insight-hero-label">9월 정산 현황 · 전체 거래처 합산</div>
                  <div className="insight-hero-value">1,480만원</div>
                  <div className="insight-hero-sub">전월 대비 상승 · 이상치 {totalAnomaly}건 확인 필요</div>
                </div>
                <svg className="insight-hero-wave" viewBox="0 0 400 200" preserveAspectRatio="none">
                  <path d="M0,140 C60,100 100,180 160,120 C220,60 260,160 320,90 C350,55 380,80 400,60 L400,200 L0,200 Z" fill="rgba(255,255,255,0.10)" />
                  <path d="M0,120 C70,150 120,70 190,110 C250,145 300,60 400,100" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2" />
                  <circle cx="330" cy="70" r="34" fill="rgba(255,255,255,0.08)" />
                  <circle cx="330" cy="70" r="34" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="1.5" />
                </svg>
              </div>
              <div className="insight-row">
                <div className="card">
                  <div className="card-head">
                    <div>
                      <div className="card-title">거래처 정산 추이</div>
                      <div className="card-sub">전체 거래처 합산 · 월별 정산 총액(만원)</div>
                    </div>
                  </div>
                  <ResponsiveContainer width="100%" height={260}>
                    <AreaChart data={TREND}>
                      <defs>
                        <linearGradient id="areaFill2" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#ff3e00" stopOpacity={0.24} />
                          <stop offset="100%" stopColor="#ff3e00" stopOpacity={0} />
                        </linearGradient>
                      </defs>
                      <CartesianGrid vertical={false} stroke="#e6e5e5" />
                      <XAxis dataKey="m" tick={{ fontSize: 12, fill: '#989290' }} axisLine={false} tickLine={false} />
                      <YAxis tick={{ fontSize: 12, fill: '#989290' }} axisLine={false} tickLine={false} width={36} />
                      <Tooltip />
                      <Area type="monotone" dataKey="v" stroke="#ff3e00" strokeWidth={3} fill="url(#areaFill2)" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>

                <div className="kpi-side">
                  <div className="stat-card" style={{ animationDelay: '0ms' }}>
                    <div>
                      <div className="stat-label">전체 거래처 수</div>
                      <div className="stat-value">{companies.length}개사</div>
                      <div className="stat-delta up"><i className="ph ph-arrow-up-right"></i>활성 {companies.filter(c=>c.status==='활성').length}개</div>
                    </div>
                    <Sparkline data={[3,4,4,5,5,companies.length]} color="var(--m600)" />
                  </div>
                  <div className="stat-card" style={{ animationDelay: '60ms' }}>
                    <div>
                      <div className="stat-label">이번 달 총 정산액</div>
                      <div className="stat-value">1,480만원</div>
                      <div className="stat-delta up"><i className="ph ph-trend-up"></i>전월 대비 상승</div>
                    </div>
                    <Sparkline data={TREND.map(t => t.v)} color="var(--m600)" />
                  </div>
                  <div className="stat-card" style={{ animationDelay: '120ms' }}>
                    <div>
                      <div className="stat-label">정산 이상치</div>
                      <div className="stat-value">{totalAnomaly}건</div>
                      <div className="stat-delta warn"><i className="ph ph-warning"></i>확인 필요</div>
                    </div>
                    <Sparkline data={[1,1,2,1,2,totalAnomaly]} color="var(--s3)" />
                  </div>
                  <div className="card" style={{ padding: '16px 16px 8px' }}>
                    <div className="card-title" style={{ fontSize: 13.5, marginBottom: 2 }}>이상 거래처 확인</div>
                    <div className="watch-list">
                      {companies.map(c => (
                        <div className="watch-item" key={c.id} onClick={() => { setScreen('partners'); pushToast(`${c.name} 상세로 이동합니다`); }}>
                          <span className={`watch-dot ${c.anomaly ? 'warn' : 'ok'}`}></span>
                          <div>
                            <div className="watch-name">{c.name}</div>
                            <div className="watch-sub">{c.manager} 담당</div>
                          </div>
                          <span className="watch-amt">{c.apps}건</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              <div className="widget-grid">
                <div className="card">
                  <div className="card-title">메뉴별 정산 비중</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 20, marginTop: 14 }}>
                    <div style={{ width: 120, height: 120, borderRadius: '50%', background: `conic-gradient(${donutGradient})`, position: 'relative', flexShrink: 0 }}>
                      <div style={{ position: 'absolute', inset: 16, borderRadius: '50%', background: 'var(--n1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column' }}>
                        <div style={{ fontSize: 20, fontWeight: 800, color: 'var(--n9)' }}>100%</div>
                        <div style={{ fontSize: 10.5, color: 'var(--n6)' }}>합계</div>
                      </div>
                    </div>
                    <div className="donut-legend">
                      {donutData.map(d => (
                        <div className="donut-legend-item" key={d.id}><span className="sw" style={{ background: d.color }}></span>{d.label} {d.pct}%</div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-title">정산 상태 분포</div>
                  <div style={{ marginTop: 16 }}>
                    <div className="hbar-row"><span className="hbar-label">정상</span><div className="hbar-track"><div className="hbar-fill" style={{ width: '78%', background: 'var(--n9)' }}></div></div><span className="hbar-val">78%</span></div>
                    <div className="hbar-row"><span className="hbar-label">이상치</span><div className="hbar-track"><div className="hbar-fill" style={{ width: '15%', background: 'var(--s3)' }}></div></div><span className="hbar-val">15%</span></div>
                    <div className="hbar-row"><span className="hbar-label">대기</span><div className="hbar-track"><div className="hbar-fill" style={{ width: '7%', background: 'var(--n4)' }}></div></div><span className="hbar-val">7%</span></div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-title">최근 알림 이력</div>
                  <div className="timeline" style={{ marginTop: 10 }}>
                    {NOTIF_LOG.map((n, i) => (
                      <div className="timeline-item" key={i}>
                        <span className={`timeline-icon ${n.warn ? 'warn' : ''}`}><i className={`ph ${n.warn ? 'ph-bell-ringing' : 'ph-check'}`}></i></span>
                        <div>
                          <div className="timeline-text">{n.text}</div>
                          <div className="timeline-time">{n.time}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {screen === 'partners' && (
          <React.Fragment>
            <div className="page-header">
              <div className="page-title-row">
                <div>
                  <h1 className="page-title">거래처 계정 관리</h1>
                  <p className="page-meta">거래처를 등록하면 초기 로그인 계정이 자동으로 발급됩니다</p>
                </div>
                <button className="btn-primary" onClick={() => setShowAddPartner(true)}><i className="ph ph-plus"></i>거래처 등록</button>
              </div>
            </div>
            <div className="content">
              <div className="card">
                <div className="data-table-wrap">
                  <table className="data-table">
                    <thead><tr><th>거래처명</th><th>사업자번호</th><th>담당자</th><th>접수 건수</th><th>계정 상태</th><th>계정 잠금</th></tr></thead>
                    <tbody>
                      {companies.map(c => (
                        <tr key={c.id}>
                          <td style={{ fontWeight: 700 }}>{c.name}</td>
                          <td>{c.biz}</td>
                          <td>{c.manager}</td>
                          <td>{c.apps}건</td>
                          <td><StatBadge status={c.status} tone={c.status === '활성' ? 'success' : 'neutral'} /></td>
                          <td>
                            <button className={`toggle-switch ${c.status === '잠금' ? 'on' : ''}`} onClick={() => toggleLock(c.id)}>
                              <span className="knob"></span>
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {screen === 'bulk-import' && (
          <React.Fragment>
            <div className="page-header">
              <div className="page-title-row">
                <div>
                  <h1 className="page-title">대량 데이터 일괄 처리</h1>
                  <p className="page-meta">구글 드라이브 엑셀 데이터를 업로드해 일괄 이관합니다</p>
                </div>
              </div>
            </div>
            <div className="content">
              <div className="grid-2">
                <div className="card">
                  <div className="card-title" style={{ marginBottom: 16 }}>엑셀 업로드</div>
                  <div className={`dropzone ${dragOver ? 'drag' : ''}`}
                    onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={e => { e.preventDefault(); setDragOver(false); startUpload(); }}
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                    <input ref={fileInputRef} type="file" accept=".xlsx" style={{ display: 'none' }} onChange={() => startUpload()} />
                    <i className={uploadState === 'uploading' ? 'ph ph-spinner-gap spin' : 'ph ph-upload-simple'}></i>
                    <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--n8)', margin: '14px 0 4px' }}>
                      {uploadState === 'idle' && '엑셀 파일을 드래그하거나 클릭해 업로드'}
                      {uploadState === 'uploading' && `업로드·검증 중… ${uploadProgress}%`}
                      {uploadState === 'done' && '이관이 완료되었습니다'}
                    </p>
                    <p style={{ fontSize: 12, color: 'var(--n6)' }}>접수내역_2026.xlsx (.xlsx, 최대 20MB)</p>
                    {uploadState !== 'idle' && (
                      <div className="progress-track"><div className="progress-fill" style={{ width: uploadProgress + '%' }}></div></div>
                    )}
                  </div>
                  {uploadState === 'done' && (
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <div className="badge badge-success"><i className="ph ph-check-circle"></i>성공 122건</div>
                      <div className="badge badge-warn"><i className="ph ph-warning-circle"></i>오류 6건</div>
                      <button className="btn-secondary" onClick={() => pushToast('오류 행 리포트를 다운로드합니다')}><i className="ph ph-file-arrow-down"></i>오류 리포트</button>
                    </div>
                  )}
                </div>
                <div className="card">
                  <div className="card-title" style={{ marginBottom: 12 }}>컬럼 매핑 규칙</div>
                  <div className="timeline">
                    {[['거래처명','company_name'],['고객명','customer'],['연락처','phone'],['메뉴 구분','menu_type'],['접수 상태','status']].map(([a,b]) => (
                      <div className="timeline-item" key={b}>
                        <span className="timeline-icon"><i className="ph ph-arrows-left-right"></i></span>
                        <div className="timeline-text">엑셀 <b>{a}</b> 열 → DB <code>{b}</code> 컬럼</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {screen === 'reports' && (
          <React.Fragment>
            <div className="page-header">
              <div className="page-title-row">
                <div>
                  <h1 className="page-title">정산 리포트 및 알림</h1>
                  <p className="page-meta">거래처별·메뉴별 정산 리포트를 조회하고 이상치 알림을 관리합니다</p>
                </div>
              </div>
            </div>
            <div className="content">
              <div className="tab-bar">
                <button className={`tab ${reportTab === 'all' ? 'active' : ''}`} onClick={() => setReportTab('all')}>전체</button>
                {MENUS.map(m => (
                  <button key={m.id} className={`tab ${reportTab === m.id ? 'active' : ''}`} onClick={() => setReportTab(m.id)}>{m.label}</button>
                ))}
              </div>
              <div className="card">
                <div className="data-toolbar">
                  <input className="search" placeholder="거래처명 검색" />
                  <button className="filter-chip" onClick={() => pushToast('2026년 9월 기준으로 필터링합니다')}><i className="ph ph-calendar-blank"></i>2026-09</button>
                  <button className="export-btn" onClick={() => pushToast('정산 리포트를 엑셀로 내보냅니다')}><i className="ph ph-file-xls"></i>엑셀 내보내기</button>
                </div>
                <div className="data-table-wrap">
                  <table className="data-table">
                    <thead><tr><th>거래처</th><th>정산월</th><th>메뉴</th><th>정산금액</th><th>상태</th></tr></thead>
                    <tbody>
                      {filteredReports.length === 0 ? (
                        <tr><td colSpan="5"><div className="empty"><i className="ph ph-tray"></i>조건에 맞는 리포트가 없습니다</div></td></tr>
                      ) : filteredReports.map(r => (
                        <tr key={r.id} onClick={() => pushToast(r.tone === 'warn' ? `${r.company} 이상치 상세를 확인합니다` : `${r.company} 정산 상세를 확인합니다`)}>
                          <td style={{ fontWeight: 700 }}>{r.company}</td>
                          <td>{r.month}</td>
                          <td>{r.menu}</td>
                          <td>{r.amount.toLocaleString()}원</td>
                          <td><StatBadge status={r.status} tone={r.tone} /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </React.Fragment>
        )}
      </div>

      {showAddPartner && (
        <div className="overlay" onClick={() => setShowAddPartner(false)}>
          <form className="modal form-panel" onClick={e => e.stopPropagation()} onSubmit={submitPartner}>
            <div className="modal-head">
              <div className="modal-title">신규 거래처 등록</div>
              <button type="button" className="close-btn" onClick={() => setShowAddPartner(false)}><i className="ph ph-x"></i></button>
            </div>
            <div className="field"><label>거래처명</label>
              <input value={partnerForm.name} onChange={e => setPartnerForm(f => ({ ...f, name: e.target.value }))} placeholder="예: 사바텔레콤" required />
            </div>
            <div className="field"><label>사업자번호</label>
              <input value={partnerForm.biz} onChange={e => setPartnerForm(f => ({ ...f, biz: e.target.value }))} placeholder="000-00-00000" />
            </div>
            <div className="field"><label>담당자명</label>
              <input value={partnerForm.manager} onChange={e => setPartnerForm(f => ({ ...f, manager: e.target.value }))} placeholder="예: 김담당" />
            </div>
            <p style={{ fontSize: 12, color: 'var(--n6)', marginBottom: 18, display: 'flex', alignItems: 'center', gap: 6 }}>
              <i className="ph ph-info"></i>등록과 동시에 초기 계정·임시 비밀번호가 자동 발급됩니다
            </p>
            <div style={{ display: 'flex', gap: 10 }}>
              <button type="button" className="btn-secondary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setShowAddPartner(false)}>취소</button>
              <button type="submit" className="btn-primary" style={{ flex: 1, justifyContent: 'center' }}>등록 및 계정 발급</button>
            </div>
          </form>
        </div>
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
