<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비즈매치 — 맞춤 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 21°, light) ── */
:root{
  --m50:#fff3ed; --m100:#ffe8db; --m200:#ffd1b8; --m300:#ffb58c; --m400:#ff955c;
  --m500:#ff782e; --m600:#ff5a00; --m700:#d14a00; --m800:#a33a00; --m900:#732800;
  --n0:#f4f4f5; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#18181b; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --radius-card: 28px;
  --radius-btn: 14px;
  --radius-pill: 999px;
  --radius-badge: 10px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--n0); color:var(--n8);
  -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.45;
}
#app-root{width:100%;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

/* ── layout shell ── */
.shell{display:flex; width:100%; min-height:100vh;}
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:248px;
  background:var(--n1); border-right:1px solid var(--n3);
  display:flex; flex-direction:column; padding:24px 16px; z-index:20;
}
.main-wrap{
  margin-left:248px; flex:1; min-width:0; width:calc(100% - 248px);
  min-height:100vh; display:flex; flex-direction:column;
}
.brand{
  display:flex; align-items:center; gap:10px; padding:4px 8px 28px 8px;
}
.brand-mark{
  width:34px; height:34px; border-radius:11px; background:var(--n8);
  color:var(--m600); display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:15px; flex-shrink:0;
}
.brand-name{font-size:17px; font-weight:700; color:var(--n8); letter-spacing:-0.02em;}
.nav-group-label{
  font-size:11px; font-weight:600; color:var(--n6); letter-spacing:0.06em;
  text-transform:uppercase; padding:16px 12px 8px;
}
.nav-item{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:10px 12px; border-radius:12px; border:none; background:transparent;
  color:var(--n7); font-size:14px; font-weight:500; transition:background .15s, color .15s;
  margin-bottom:2px;
}
.nav-item:hover{background:var(--n2); color:var(--n8);}
.nav-item.active{background:var(--m50); color:var(--m700); font-weight:600;}
.nav-item svg{flex-shrink:0; width:18px; height:18px;}
.nav-item .label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sidebar-footer{
  margin-top:auto; padding:14px 12px; border-radius:16px; background:var(--n2);
  display:flex; align-items:center; gap:10px;
}
.avatar-init{
  width:32px; height:32px; border-radius:50%; background:var(--n3); color:var(--n7);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
}
.sidebar-footer .who{font-size:13px; font-weight:600; color:var(--n8);}
.sidebar-footer .role{font-size:11.5px; color:var(--n6);}

.topbar{
  height:64px; flex-shrink:0; background:var(--n1); border-bottom:1px solid var(--n3);
  display:flex; align-items:center; justify-content:space-between; padding:0 28px; width:100%;
}
.topbar-title{font-size:18px; font-weight:700; color:var(--n8); letter-spacing:-0.01em;}
.topbar-sub{font-size:12.5px; color:var(--n6); margin-top:1px;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:11px; border:1px solid var(--n3); background:var(--n1);
  display:flex; align-items:center; justify-content:center; color:var(--n7);
}
.icon-btn:hover{background:var(--n2);}

.page{flex:1; width:100%; padding:24px 28px 48px; overflow-x:hidden;}
.btn{
  border:none; border-radius:var(--radius-btn); font-weight:600; font-size:13.5px;
  padding:10px 18px; display:inline-flex; align-items:center; gap:7px; transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--n8); color:#fff;}
.btn-primary:hover{background:var(--n9);}
.btn-outline{background:var(--n1); color:var(--n8); border:1px solid var(--n3);}
.btn-outline:hover{background:var(--n2);}
.btn-ghost{background:transparent; color:var(--n7); border:1px solid transparent;}
.btn-ghost:hover{background:var(--n2);}
.btn-accent{background:var(--m600); color:#fff;}
.btn-accent:hover{background:var(--m700);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ── main: master-detail composition ── */
.hero-banner{
  position:relative; width:100%; border-radius:32px; overflow:hidden; margin-bottom:22px;
  background:linear-gradient(135deg, var(--n8) 0%, var(--n10) 100%);
  padding:34px 36px; display:flex; align-items:center; justify-content:space-between; gap:24px;
}
.hero-copy{max-width:56%;}
.hero-eyebrow{font-size:12px; font-weight:700; color:var(--m400); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.hero-title{font-size:36px; font-weight:800; color:#fff; line-height:1.22; letter-spacing:-0.02em; margin:0 0 12px;}
.hero-sub{font-size:13.5px; color:rgba(255,255,255,.68); line-height:1.6; margin:0;}
.hero-graph{width:220px; height:150px; flex-shrink:0; position:relative;}
.hero-graph .pulse-node{animation:nodePulse 2.4s ease-in-out infinite;}
@keyframes nodePulse{0%,100%{r:5;} 50%{r:7;}}
.md-shell{display:flex; gap:20px; width:100%; align-items:flex-start;}
.filter-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.chip{
  border:1px solid var(--n3); background:var(--n1); border-radius:var(--radius-pill);
  padding:7px 14px; font-size:13px; font-weight:600; color:var(--n7); display:flex; align-items:center; gap:6px;
}
.chip.active{background:var(--m50); border-color:var(--m300); color:var(--m700);}
.list-rail{width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;}
.match-card{
  background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card);
  padding:16px; cursor:pointer; transition:border-color .15s, transform .15s;
  animation:cardIn .4s ease backwards;
}
.match-card:hover{border-color:var(--n5); transform:translateY(-1px);}
.match-card.selected{border-color:var(--m600); background:var(--m50);}
.match-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.match-id{display:flex; align-items:center; gap:10px; min-width:0;}
.match-name{font-size:14.5px; font-weight:700; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.match-role{font-size:12px; color:var(--n6); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fit-badge{
  flex-shrink:0; font-size:12px; font-weight:700; color:var(--n7); background:var(--n2);
  border-radius:var(--radius-badge); padding:3px 9px;
}
.match-reason{font-size:12.5px; color:var(--n7); margin-top:9px; line-height:1.5;}
.match-tags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.tag{font-size:11px; font-weight:600; color:var(--n7); background:var(--n2); border-radius:8px; padding:3px 8px;}
.req-badge{font-size:11px; font-weight:700; color:var(--s1-text); background:var(--s1-bg); border-radius:8px; padding:3px 8px; margin-top:9px; display:inline-block;}

.detail-panel{
  flex:1; min-width:0; background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card);
  padding:32px; animation:fadeSlide .3s ease;
}
.detail-empty{
  flex:1; min-width:0; background:var(--n1); border:1px dashed var(--n4); border-radius:var(--radius-card);
  padding:60px 32px; text-align:center; color:var(--n6);
}
.dp-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
.dp-person{display:flex; gap:16px; align-items:center;}
.dp-avatar{width:56px; height:56px; border-radius:18px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700;}
.dp-name{font-size:20px; font-weight:700; color:var(--n9); letter-spacing:-0.01em;}
.dp-role{font-size:13.5px; color:var(--n6); margin-top:2px;}
.dp-fit-ring{
  width:76px; height:76px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background: conic-gradient(var(--m600) calc(var(--pct)*1%), var(--n3) 0);
}
.dp-fit-inner{width:60px; height:60px; border-radius:50%; background:var(--n1); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dp-fit-inner b{font-size:16px; color:var(--n9);}
.dp-fit-inner span{font-size:9.5px; color:var(--n6); font-weight:600;}
.dp-section{margin-top:26px;}
.dp-section h4{font-size:12.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 10px;}
.reason-box{background:var(--n2); border-radius:16px; padding:16px; font-size:13.5px; color:var(--n8); line-height:1.6;}
.hw-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.hw-col-title{font-size:12px; font-weight:700; color:var(--n6); margin-bottom:8px;}
.hw-chip-list{display:flex; flex-direction:column; gap:6px;}
.hw-chip{background:var(--n2); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--n8);}
.contact-row{display:flex; align-items:center; justify-content:space-between; background:var(--n2); border-radius:14px; padding:12px 16px; margin-top:10px;}
.contact-row .val{font-family:monospace; font-size:13px; color:var(--n9); font-weight:600;}
.dp-cta-row{display:flex; gap:10px; margin-top:28px;}

/* ── onboarding ── */
.chat-shell{display:flex; gap:20px; width:100%; align-items:flex-start;}
.chat-panel{
  flex:1.2; min-width:0; background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card);
  display:flex; flex-direction:column; height:600px;
}
.chat-log{flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:78%; padding:12px 16px; border-radius:16px; font-size:13.5px; line-height:1.55; animation:fadeSlide .3s ease;}
.msg.ai{background:var(--n2); color:var(--n8); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.me{background:var(--n8); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
.msg.ai b{color:var(--m700);}
.typing{display:flex; gap:4px; padding:12px 16px; background:var(--n2); border-radius:16px; align-self:flex-start; width:fit-content;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--n6); animation:bounce 1.1s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
.chat-input-row{display:flex; gap:10px; padding:16px; border-top:1px solid var(--n3);}
.chat-input-row input{
  flex:1; border:1px solid var(--n3); border-radius:var(--radius-pill); padding:11px 18px; font-size:13.5px;
  font-family:inherit; outline:none; background:var(--n0);
}
.chat-input-row input:focus{border-color:var(--m400);}
.hw-panel{
  width:340px; flex-shrink:0; background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card);
  padding:22px; position:sticky; top:0;
}
.hw-panel h3{font-size:15px; font-weight:700; margin:0 0 4px;}
.hw-panel .desc{font-size:12px; color:var(--n6); margin-bottom:16px;}
.hw-edit-item{
  display:flex; align-items:center; justify-content:space-between; background:var(--n2);
  border-radius:12px; padding:9px 12px; margin-bottom:8px; font-size:13px; animation:fadeSlide .3s ease;
}
.hw-edit-item button{background:none; border:none; color:var(--n6); display:flex;}
.hw-edit-item button:hover{color:var(--s2);}
.hw-status{font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; display:inline-block; margin-top:2px;}
.hw-status.have{background:var(--m100); color:var(--m700);}
.hw-status.want{background:var(--n2); color:var(--n7); border:1px solid var(--n4);}

/* ── connections ── */
.tab-row{display:flex; gap:4px; background:var(--n2); border-radius:14px; padding:4px; width:fit-content; margin-bottom:20px;}
.tab-btn{border:none; background:transparent; padding:9px 20px; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--n6);}
.tab-btn.active{background:var(--n1); color:var(--n9); box-shadow:0 1px 2px rgba(0,0,0,.06);}
.conn-list{display:flex; flex-direction:column; gap:10px;}
.conn-row{
  background:var(--n1); border:1px solid var(--n3); border-radius:18px; padding:16px 20px;
  display:flex; align-items:center; gap:16px; cursor:pointer; transition:border-color .15s;
  animation:fadeSlide .3s ease;
}
.conn-row:hover{border-color:var(--n5);}
.conn-avatar{width:42px; height:42px; border-radius:14px; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;}
.conn-info{flex:1; min-width:0;}
.conn-name{font-size:14px; font-weight:700; color:var(--n9);}
.conn-sub{font-size:12px; color:var(--n6); margin-top:2px;}
.status-pill{font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:var(--radius-pill); flex-shrink:0;}
.status-pill.pending{background:var(--n2); color:var(--n7);}
.status-pill.accepted{background:var(--s1-bg); color:var(--s1-text);}
.status-pill.rejected{background:var(--s2-bg); color:var(--s2-text);}
.status-pill.mutual{background:var(--m100); color:var(--m700);}
.conn-actions{display:flex; gap:8px; flex-shrink:0;}

/* ── admin ── */
.kpi-row{display:flex; gap:14px; margin-bottom:20px;}
.kpi-card{flex:1; background:var(--n1); border:1px solid var(--n3); border-radius:20px; padding:18px 20px;}
.kpi-label{font-size:12px; color:var(--n6); font-weight:600;}
.kpi-value{font-size:24px; font-weight:800; color:var(--n9); margin-top:6px; letter-spacing:-0.02em;}
.kpi-delta{font-size:11.5px; margin-top:4px; font-weight:700;}
.kpi-delta.up{color:var(--s1-text);}
.admin-tabs{display:flex; gap:4px; background:var(--n2); border-radius:14px; padding:4px; width:fit-content; margin-bottom:16px;}
.review-row{
  background:var(--n1); border:1px solid var(--n3); border-radius:16px; padding:14px 18px;
  display:flex; align-items:center; gap:14px; margin-bottom:8px;
}
.review-pair{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--n8); font-weight:600; min-width:0; flex:1;}
.review-pair .arrow{color:var(--n5);}
.review-fit{font-size:12px; font-weight:700; color:var(--n7); background:var(--n2); border-radius:8px; padding:3px 9px; flex-shrink:0;}
.review-actions{display:flex; gap:6px; flex-shrink:0;}
.mini-btn{border:1px solid var(--n3); background:var(--n1); border-radius:9px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--n7);}
.mini-btn.approve:hover{background:var(--s1-bg); border-color:var(--s1); color:var(--s1-text);}
.mini-btn.hold:hover{background:var(--n2);}
.mini-btn.reject:hover{background:var(--s2-bg); border-color:var(--s2); color:var(--s2-text);}
.review-decision{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:8px; flex-shrink:0;}
.review-decision.approved{background:var(--s1-bg); color:var(--s1-text);}
.review-decision.held{background:var(--n2); color:var(--n7);}
.review-decision.rejected{background:var(--s2-bg); color:var(--s2-text);}
.member-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; cursor:pointer;
}
.member-row:hover{background:var(--n2);}
.member-row.selected{background:var(--m50);}

/* ── modal / toast ── */
.overlay{
  position:fixed; inset:0; background:rgba(24,24,27,.42); z-index:100;
  display:flex; align-items:center; justify-content:center; animation:fadeIn .2s ease; padding:20px;
}
.modal{
  background:var(--n1); border-radius:24px; padding:28px; width:420px; max-width:100%;
  animation:fadeInScale .25s cubic-bezier(.2,.9,.3,1.2);
}
.modal h3{margin:0 0 8px; font-size:17px; font-weight:700; color:var(--n9);}
.modal p{margin:0 0 20px; font-size:13.5px; color:var(--n7); line-height:1.6;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}
.toast-stack{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--n8); color:#fff; padding:13px 20px; border-radius:14px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:9px; animation:toastIn .3s ease, toastOut .3s ease 2.4s forwards;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}

.empty-state{display:flex; flex-direction:column; align-items:center; padding:70px 20px; color:var(--n6);}
.empty-state svg{color:var(--n4); margin-bottom:14px;}
.empty-state p{font-size:13.5px; margin:0;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes fadeInScale{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
@keyframes fadeSlide{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes cardIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-5px);}}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
@keyframes toastOut{to{opacity:0; transform:translateX(30px);}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,90,0,.28);} 100%{box-shadow:0 0 0 8px rgba(255,90,0,0);}}
.live-dot{width:8px; height:8px; border-radius:50%; background:var(--m600); animation:pulseRing 1.8s infinite;}

@media (max-width: 980px){
  .sidebar{display:none;}
  .main-wrap{margin-left:0; width:100%;}
  .md-shell, .chat-shell{flex-direction:column;}
  .list-rail, .hw-panel{width:100%;}
  .hw-cols{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

const NAV = [
  { key: 'main', label: '매칭 추천', icon: 'sparkles' },
  { key: 'onboarding', label: 'AI 온보딩 대화 + HAVE·WANT 구조화', icon: 'message-circle' },
  { key: 'connections', label: '연결 요청·수락 상태머신', icon: 'link-2' },
  { key: 'admin', label: '마스터 관리자 백오피스', icon: 'shield-check' },
];

const Icon = ({ name, size = 18, className = '' }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ nameAttr: 'data-lucide', attrs: { width: size, height: size } , icons: undefined, node: ref.current});
    }
  }, [name, size]);

function OnboardingScreen({ toast }) {
  const [visible, setVisible] = useState(1);
  const [typing, setTyping] = useState(false);
  const [input, setInput] = useState('');
  const [have, setHave] = useState(['오프라인 유통 채널 3곳 네트워크']);
  const [want, setWant] = useState(['식품유통 도메인 이해가 있는 투자자 연결']);
  const logRef = useRef(null);

  useEffect(() => {
    if (visible >= AI_SCRIPT.length) return;
    const next = AI_SCRIPT[visible];
    if (next.role === 'ai') {
      setTyping(true);
      const t = setTimeout(() => { setTyping(false); setVisible(v => v+1); }, 900);
      return () => clearTimeout(t);
    }
  }, [visible]);

  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [visible, typing]);

  const sendManual = () => {
    if (!input.trim()) return;
    setInput('');
    if (visible < AI_SCRIPT.length) setVisible(v => v+1);
  };

  const removeItem = (list, setList, idx) => setList(list.filter((_,i)=>i!==idx));
  const confirmSave = () => toast('HAVE·WANT가 프로필에 확정 저장되었습니다.');

  return (
    <div className="chat-shell">
      <div className="chat-panel">
        <div className="chat-log" ref={logRef}>
          {AI_SCRIPT.slice(0, visible).map((m,i) => (
            <div key={i} className={`msg ${m.role==='ai'?'ai':'me'}`}>{m.text}</div>
          ))}
          {typing && <div className="typing"><span></span><span></span><span></span></div>}
        </div>
        <div className="chat-input-row">
          <input placeholder="자유롭게 이야기해주세요…" value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') sendManual(); }} />
          <button className="btn btn-primary" onClick={sendManual}><Icon name="arrow-up" size={15}/></button>
        </div>
      </div>

      <div className="hw-panel">
        <h3>HAVE · WANT 확인</h3>
        <div className="desc">AI가 대화에서 구조화한 항목입니다. 수정 후 확정 저장하세요.</div>
        <div className="hw-status have">HAVE</div>
        {have.map((h,i) => (
          <div key={i} className="hw-edit-item"><span>{h}</span><button onClick={()=>removeItem(have,setHave,i)}><Icon name="x" size={14}/></button></div>
        ))}
        <div style={{height:12}}></div>
        <div className="hw-status want">WANT</div>
        {want.map((w,i) => (
          <div key={i} className="hw-edit-item"><span>{w}</span><button onClick={()=>removeItem(want,setWant,i)}><Icon name="x" size={14}/></button></div>
        ))}
        <button className="btn btn-accent" style={{width:'100%', justifyContent:'center', marginTop:16}} onClick={confirmSave}>
          <Icon name="check-circle" size={15}/> 확인하고 확정 저장
        </button>
      </div>
    </div>
  );
}

function ConnectionsScreen({ toast }) {
  const [tab, setTab] = useState('received');
  const [received, setReceived] = useState(RECEIVED);
  const [sent] = useState(SENT);
  const [confirm, setConfirm] = useState(null); // {row, action}

  const applyDecision = (id, status) => {
    setReceived(prev => prev.map(r => r.id===id ? {...r, status} : r));
    setConfirm(null);
    toast(status==='mutual' ? '상호수락 완료 — 연락처가 공개되었습니다.' : status==='accepted' ? '요청을 수락했습니다.' : '요청을 거절했습니다.');
  };

  const list = tab === 'received' ? received : sent;
  const statusLabel = { pending:'대기중', accepted:'수락됨', rejected:'거절됨', mutual:'상호수락' };

  return (
    <div>
      <div className="tab-row">
        <button className={`tab-btn ${tab==='received'?'active':''}`} onClick={()=>setTab('received')}>받은 요청 ({received.length})</button>
        <button className={`tab-btn ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>보낸 요청 ({sent.length})</button>
      </div>
      <div className="conn-list">
        {list.map(r => (
          <div key={r.id} className="conn-row">
            <Avatar name={r.name} size={44} />
            <div className="conn-info">
              <div className="conn-name">{r.name}</div>
              <div className="conn-sub">{r.role}</div>
            </div>
            {r.status === 'mutual' ? (
              <div className="contact-row" style={{margin:0, background:'var(--m50)'}}>
                <Icon name="unlock" size={14} className="mr-1" />
                <span className="val" style={{marginLeft:8}}>010-4482-9931</span>
              </div>
            ) : (
              <span className={`status-pill ${r.status}`}>{statusLabel[r.status]}</span>
            )}
            {tab === 'received' && r.status === 'pending' && (
              <div className="conn-actions">
                <button className="mini-btn approve" onClick={()=>setConfirm({id:r.id, action:'mutual', name:r.name})}>수락</button>
                <button className="mini-btn reject" onClick={()=>setConfirm({id:r.id, action:'rejected', name:r.name})}>거절</button>
              </div>
            )}
          </div>
        ))}
      </div>

      {confirm && (
        <div className="overlay" onClick={()=>setConfirm(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{confirm.action==='mutual' ? '요청을 수락할까요?' : '요청을 거절할까요?'}</h3>
            <p>{confirm.name}님의 연결 요청입니다. {confirm.action==='mutual' ? '수락하면 양측이 모두 수락한 상태가 되어 연락처가 공개됩니다.' : '거절하면 상대방에게 거절 상태로 표시됩니다.'}</p>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={()=>setConfirm(null)}>취소</button>
              <button className={confirm.action==='mutual' ? 'btn btn-accent' : 'btn btn-outline'} onClick={()=>applyDecision(confirm.id, confirm.action)}>
                {confirm.action==='mutual' ? '수락하기' : '거절하기'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  { id:1, a:'김도윤', b:'배지훈', fit:92, decision:null },
  { id:2, a:'박서연', b:'현지오', fit:87, decision:null },
  { id:3, a:'이하준', b:'정민재', fit:74, decision:'approved' },
  { id:4, a:'최유나', b:'한소율', fit:58, decision:'rejected' },
];

function AdminScreen({ toast }) {
  const [selMember, setSelMember] = useState(MEMBERS[0].id);
  const [reviews, setReviews] = useState(AI_REVIEWS);
  const [adminTab, setAdminTab] = useState('review');
  const member = MEMBERS.find(m=>m.id===selMember);

  const decide = (id, decision) => {
    setReviews(prev => prev.map(r => r.id===id ? {...r, decision} : r));
    const label = decision==='approved'?'승인':decision==='held'?'보류':'거절';
    toast(`AI 추천을 ${label}했습니다.`);
  };

  return (
    <div>
      <div className="kpi-row">
        <div className="kpi-card"><div className="kpi-label">전체 가입</div><div className="kpi-value">184명</div><div className="kpi-delta up">↑ 12명 (7일)</div></div>
        <div className="kpi-card"><div className="kpi-label">프로필 완성</div><div className="kpi-value">142명</div><div className="kpi-delta up">완성률 77%</div></div>
        <div className="kpi-card"><div className="kpi-label">AI 추천 생성</div><div className="kpi-value">391건</div><div className="kpi-delta up">승인률 68%</div></div>
        <div className="kpi-card"><div className="kpi-label">상호수락</div><div className="kpi-value">36건</div><div className="kpi-delta up">↑ 5건 (7일)</div></div>
      </div>

      <div className="admin-tabs">
        <button className={`tab-btn ${adminTab==='review'?'active':''}`} onClick={()=>setAdminTab('review')}>AI 추천 검토</button>
        <button className={`tab-btn ${adminTab==='members'?'active':''}`} onClick={()=>setAdminTab('members')}>회원 관리</button>
      </div>

      {adminTab === 'review' ? (
        <div>
          {reviews.map(r => (
            <div key={r.id} className="review-row">
              <div className="review-pair"><span>{r.a}</span><Icon name="arrow-right" size={13} className="arrow"/><span>{r.b}</span></div>
              <span className="review-fit">적합도 {r.fit}%</span>
              {r.decision ? (
                <span className={`review-decision ${r.decision}`}>{r.decision==='approved'?'승인됨':r.decision==='held'?'보류됨':'거절됨'}</span>
              ) : (
                <div className="review-actions">
                  <button className="mini-btn approve" onClick={()=>decide(r.id,'approved')}>승인</button>
                  <button className="mini-btn hold" onClick={()=>decide(r.id,'held')}>보류</button>
                  <button className="mini-btn reject" onClick={()=>decide(r.id,'rejected')}>거절</button>
                </div>
              )}
            </div>
          ))}
        </div>
      ) : (
        <div className="md-shell">
          <div className="list-rail" style={{width:280}}>
            {MEMBERS.map(m => (
              <div key={m.id} className={`member-row ${selMember===m.id?'selected':''}`} onClick={()=>setSelMember(m.id)}>
                <Avatar name={m.name} size={36} />
                <div><div style={{fontSize:13.5,fontWeight:700,color:'var(--n9)'}}>{m.name}</div><div style={{fontSize:11.5,color:'var(--n6)'}}>{m.joined} 가입</div></div>
              </div>
            ))}
          </div>
          <div className="detail-panel">
            <div className="dp-person"><div className="dp-avatar">{member.name.charAt(0)}</div><div><div className="dp-name">{member.name}</div><div className="dp-role">가입일 {member.joined}</div></div></div>
            <div className="dp-section">
              <h4>등록 현황</h4>
              <div className="hw-cols">
                <div className="kpi-card"><div className="kpi-label">HAVE 등록</div><div className="kpi-value">{member.have}건</div></div>
                <div className="kpi-card"><div className="kpi-label">WANT 등록</div><div className="kpi-value">{member.want}건</div></div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  const toast = (msg) => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 2800);
  };

  const titles = {
    main: ['매칭 추천', '관리자 승인을 거친 추천 후보 목록'],
    onboarding: ['AI 온보딩 대화', 'HAVE·WANT를 자연어로 정리합니다'],
    connections: ['연결 요청', '받은/보낸 요청과 상호수락 현황'],
    admin: ['관리자 백오피스', '회원·AI추천·운영지표 통합 관리'],
  };

  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="brand"><div className="brand-mark">B</div><div className="brand-name">비즈매치</div></div>
        <div className="nav-group-label">서비스</div>
        {NAV.slice(0,3).map(n => (
          <button key={n.key} className={`nav-item ${screen===n.key?'active':''}`} onClick={()=>setScreen(n.key)}>
            <Icon name={n.icon} size={17} /><span className="label">{n.label}</span>
          </button>
        ))}
        <div className="nav-group-label">운영</div>
        {NAV.slice(3).map(n => (
          <button key={n.key} className={`nav-item ${screen===n.key?'active':''}`} onClick={()=>setScreen(n.key)}>
            <Icon name={n.icon} size={17} /><span className="label">{n.label}</span>
          </button>
        ))}
        <div className="sidebar-footer">
          <div className="avatar-init">정</div>
          <div><div className="who">정하늘</div><div className="role">사업개발 · 회원</div></div>
        </div>
      </aside>
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="topbar-title">{titles[screen][0]}</div>
            <div className="topbar-sub">{titles[screen][1]}</div>
          </div>
          <div className="topbar-actions">
            <span className="live-dot"></span>
            <button className="icon-btn" onClick={() => toast('새 알림이 없습니다.')}><Icon name="bell" size={16}/></button>
            <button className="icon-btn" onClick={() => toast('설정 화면은 준비 중입니다.')}><Icon name="settings" size={16}/></button>
          </div>
        </div>
        <div className="page">
          {screen === 'main' && <MainScreen toast={toast} />}
          {screen === 'onboarding' && <OnboardingScreen toast={toast} />}
          {screen === 'connections' && <ConnectionsScreen toast={toast} />}
          {screen === 'admin' && <AdminScreen toast={toast} />}
        </div>
      </div>
      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className="toast"><Icon name="check-circle-2" size={16}/>{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
