<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비즈매치 파트너 생태계 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 254°, light) ── */
:root{
  --m50:#f3efff; --m100:#ece6ff; --m200:#e3dbff; --m300:#dcd1ff; --m400:#d4c7ff;
  --m500:#aea3d1; --m600:#887fa3; --m700:#5f5a73; --m800:#5f5a73; --m900:#5f5a73;
  --n0:#f2f0eb; --n1:#ffffff; --n2:#efeff0; --n3:#e5e5e6; --n4:#d6d5d7;
  --n5:#b6b5ba; --n6:#929098; --n7:#666666; --n8:#55535a; --n9:#37363a; --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:16px; --radius-btn:16px; --radius-pill:999px;
}
*{box-sizing:border-box;}
html,body{width:100%; margin:0; padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--n0); color:var(--n10); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#app-root{width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}

/* ── search header (archetype signature) ── */
.search-header{
  position:sticky; top:0; z-index:50; width:100%; background:rgba(255,255,255,.86);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--n3); padding:14px 32px 0;
}
.header-row{display:flex; align-items:center; gap:24px; max-width:1280px; margin:0 auto; padding-bottom:14px;}
.brand-btn{display:flex; align-items:center; gap:9px; flex-shrink:0;}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--n10); color:var(--m300); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.brand-text{font-size:16.5px; font-weight:700; color:var(--n10); letter-spacing:-0.01em;}
.search-bar{
  flex:1; display:flex; align-items:center; background:var(--n1); border:1px solid var(--n3);
  border-radius:var(--radius-pill); padding:6px; max-width:560px; box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.search-segment{flex:1; text-align:left; padding:7px 16px; border-radius:var(--radius-pill); min-width:0;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:10.5px; font-weight:700; color:var(--n7);}
.segment-value{font-size:12.5px; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-divider{width:1px; height:22px; background:var(--n3);}
.search-input-wrap{display:flex; align-items:center; gap:6px; flex:1.4; padding:0 10px;}
.search-input-wrap input{border:none; outline:none; font-size:13px; width:100%; background:transparent; font-family:inherit;}
.search-submit{
  width:36px; height:36px; border-radius:50%; background:var(--n10); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.header-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.nav-link{padding:9px 14px; border-radius:12px; font-size:13px; font-weight:600; color:var(--n7); white-space:nowrap;}
.nav-link:hover{background:var(--n2);}
.nav-link.active{background:var(--m100); color:var(--m700);}
.user-menu{width:38px; height:38px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n8); flex-shrink:0;}

.filter-chips{
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; max-width:1280px; margin:0 auto;
  scrollbar-width:none;
}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; display:flex; align-items:center; gap:6px; border:1px solid var(--n3); background:var(--n1);
  border-radius:var(--radius-pill); padding:8px 16px; font-size:12.5px; font-weight:600; color:var(--n8);
  transition:transform .15s, border-color .15s;
}
.chip:hover{transform:translateY(-1px); border-color:var(--n5);}
.chip.active{background:var(--n10); color:#fff; border-color:var(--n10);}
.chip .ph{font-size:15px;}

.main-content{flex:1; width:100%; max-width:1280px; margin:0 auto; padding:26px 32px 60px;}

/* ── card grid ── */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(272px, 1fr)); gap:20px;}
.listing-card{
  background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); overflow:hidden;
  cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; animation:cardRise .45s ease backwards;
}
.listing-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(41,40,39,.09);}
.card-image-wrap{position:relative; aspect-ratio:4/3; background:linear-gradient(150deg, var(--m100), var(--n2)); display:flex; align-items:center; justify-content:center;}
.card-image-wrap .ph{font-size:40px; color:var(--m600); opacity:.55;}
.card-favorite{
  position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.88);
  display:flex; align-items:center; justify-content:center; color:var(--n8);
}
.card-favorite.active{color:var(--s2);}
.card-badge{position:absolute; top:10px; left:10px; background:rgba(41,40,39,.78); color:#fff; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:8px;}
.card-body{padding:14px 16px 16px;}
.card-row-1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-title{font-size:14.5px; font-weight:700; color:var(--n10); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-rating{font-size:12.5px; font-weight:700; color:var(--n9); display:flex; align-items:center; gap:3px; flex-shrink:0;}
.card-meta{font-size:12px; color:var(--n7); display:block; margin-top:3px;}
.card-row-4{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.card-price{font-size:13.5px; font-weight:700; color:var(--m700);}
.price-unit{font-size:11px; color:var(--n6); margin-left:4px;}

/* ── quick-view drawer ── */
.drawer-overlay{position:fixed; inset:0; background:rgba(41,40,39,.4); z-index:100; animation:fadeIn .2s ease;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--n1); z-index:101;
  box-shadow:-16px 0 40px rgba(0,0,0,.14); padding:28px; overflow-y:auto; animation:drawerIn .32s cubic-bezier(.16,.9,.3,1);
}
.drawer-close{width:34px; height:34px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
.drawer-hero{aspect-ratio:16/9; border-radius:14px; background:linear-gradient(150deg, var(--m100), var(--n2)); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
.drawer-hero .ph{font-size:52px; color:var(--m600); opacity:.6;}
.drawer h2{font-size:19px; margin:0 0 4px; color:var(--n10);}
.drawer .sub{font-size:13px; color:var(--n7); margin-bottom:18px;}
.drawer-stat-row{display:flex; gap:10px; margin-bottom:18px;}
.drawer-stat{flex:1; background:var(--n0); border-radius:12px; padding:12px; text-align:center;}
.drawer-stat b{display:block; font-size:17px; color:var(--n10);}
.drawer-stat span{font-size:11px; color:var(--n7);}
.drawer-section{margin-bottom:18px;}
.drawer-section h4{font-size:11.5px; font-weight:700; color:var(--n7); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px;}
.drawer-tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.drawer-tag{background:var(--n2); border-radius:9px; padding:6px 10px; font-size:12.5px; color:var(--n9);}

/* ── analytics ── */
.section-title{font-size:19px; font-weight:700; color:var(--n10); margin:0 0 4px;}
.section-desc{font-size:13px; color:var(--n7); margin:0 0 22px;}
.analytics-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:20px;}
.panel{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:22px;}
.panel h3{font-size:14.5px; font-weight:700; margin:0 0 14px; color:var(--n10);}
.category-filter-row{display:flex; gap:8px; margin-bottom:18px;}
.funnel-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.funnel-label{width:96px; font-size:12.5px; color:var(--n7); flex-shrink:0;}
.funnel-bar-wrap{flex:1; height:28px; background:var(--n2); border-radius:8px; overflow:hidden;}
.funnel-bar{height:100%; background:linear-gradient(90deg, var(--m600), var(--m400)); border-radius:8px; transition:width .6s ease;}
.funnel-value{width:52px; text-align:right; font-size:13px; font-weight:700; color:var(--n9); flex-shrink:0;}

/* ── workspace ── */
.ws-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.ws-list{display:flex; flex-direction:column; gap:12px;}
.ws-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:18px 20px;}
.ws-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
.ws-name{font-size:14.5px; font-weight:700; color:var(--n10);}
.ws-time{font-size:11.5px; color:var(--n6);}
.ws-note{font-size:13px; color:var(--n8); margin-top:8px; line-height:1.6;}
.ws-tag-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.ws-tag{background:var(--m50); color:var(--m700); font-size:11px; font-weight:600; padding:3px 9px; border-radius:8px;}
.ws-timeline-dot{width:8px; height:8px; border-radius:50%; background:var(--m600); flex-shrink:0; margin-top:5px;}
.compose-box{display:flex; gap:10px; margin-top:6px;}
.compose-box textarea{flex:1; border:1px solid var(--n3); border-radius:14px; padding:12px 14px; font-family:inherit; font-size:13px; resize:none; outline:none;}
.compose-box textarea:focus{border-color:var(--m400);}

/* ── tuning ── */
.tuning-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
.slider-row{margin-bottom:22px;}
.slider-row .head{display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--n9); margin-bottom:8px;}
.slider-row input[type=range]{width:100%; accent-color:var(--m600);}
.sim-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.sim-item:last-child{border-bottom:none;}
.version-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.version-table th{text-align:left; color:var(--n6); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--n3);}
.version-table td{padding:9px 6px; border-bottom:1px solid var(--n2); color:var(--n8);}
.version-table tr:last-child td{border-bottom:none;}

.btn{border-radius:var(--radius-btn); font-weight:600; font-size:13px; padding:9px 18px; display:inline-flex; align-items:center; gap:7px; transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-outline{background:var(--n1); color:var(--n9); border:1px solid var(--n3);}
.btn-outline:hover{background:var(--n2);}
.btn-ghost{background:transparent; color:var(--n7);}
.btn-ghost:hover{background:var(--n2);}

.footer{background:var(--n10); color:#fff; padding:44px 32px; width:100%; margin-top:40px;}
.footer-cols{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:28px;}
.footer-col h4{font-size:12.5px; font-weight:700; margin:0 0 12px; color:rgba(255,255,255,.9);}
.footer-col a{display:block; font-size:12.5px; color:rgba(255,255,255,.62); margin-bottom:8px;}

.toast-stack{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--n10); color:#fff; padding:13px 20px; border-radius:14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; animation:toastIn .3s ease, toastOut .3s ease 2.4s forwards; box-shadow:0 10px 26px rgba(0,0,0,.2);}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes drawerIn{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes cardRise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastOut{to{opacity:0; transform:translateY(12px);}}
@keyframes glowPulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
.card-image-wrap .ph{animation:glowPulse 2.6s ease-in-out infinite;}

@media (max-width: 980px){
  .header-row{flex-wrap:wrap;}
  .header-nav{order:3; width:100%; overflow-x:auto;}
  .analytics-grid, .tuning-grid{grid-template-columns:1fr;}
  .footer-cols{grid-template-columns:repeat(2,1fr);}
  .drawer{width:100vw;}
}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const { FunnelChart, Funnel, LabelList, ResponsiveContainer, Tooltip, BarChart, Bar, XAxis, YAxis, CartesianGrid, Cell } = Recharts;

const CATEGORIES = [
  { key:'전체', icon:'ph-squares-four' },
  { key:'투자', icon:'ph-trend-up' },
  { key:'유통파트너', icon:'ph-truck' },
  { key:'자문', icon:'ph-chats-circle' },
  { key:'기술파트너', icon:'ph-cpu' },
  { key:'고객사연결', icon:'ph-handshake' },
  { key:'브랜드소싱', icon:'ph-tag' },
];

const PARTNERS = [
  { id:1, name:'김도윤', role:'유통 스타트업 대표', cat:'투자', region:'서울', fit:92, icon:'ph-trend-up', want:'시드 투자 3~5억' },
  { id:2, name:'박서연', role:'로컬 편집숍 운영', cat:'브랜드소싱', region:'서울', fit:87, icon:'ph-storefront', want:'신규 브랜드 소싱' },
  { id:3, name:'이하준', role:'스타트업 세무 자문', cat:'자문', region:'경기', fit:81, icon:'ph-scales', want:'투자자문 교환' },
  { id:4, name:'최유나', role:'D2C 뷰티 브랜드 대표', cat:'유통파트너', region:'서울', fit:76, icon:'ph-flower-lotus', want:'오프라인 채널 입점' },
  { id:5, name:'정민재', role:'물류 스타트업 공동창업자', cat:'기술파트너', region:'인천', fit:69, icon:'ph-cpu', want:'라스트마일 알고리즘' },
  { id:6, name:'한소율', role:'수출 컨설팅 전문가', cat:'고객사연결', region:'부산', fit:64, icon:'ph-globe', want:'제조사 고객사 연결' },
  { id:7, name:'배지훈', role:'제조업 전문 투자자', cat:'투자', region:'서울', fit:58, icon:'ph-factory', want:'제조 스타트업 발굴' },
  { id:8, name:'현지오', role:'F&B 프랜차이즈 운영', cat:'유통파트너', region:'대구', fit:55, icon:'ph-bowl-food', want:'신규 지역 가맹점' },
];

const FUNNEL = [
  { label:'가입', value:184 }, { label:'온보딩완료', value:151 }, { label:'추천생성', value:112 },
  { label:'연결요청', value:64 }, { label:'상호수락', value:36 },
];

const Icon = ({ name, size=17, className='' }) => <i className={`ph ${name} ${className}`} style={{fontSize:size}}></i>;
const Avatar = ({ name }) => <span style={{width:44,height:44,borderRadius:14,background:'var(--n2)',color:'var(--n8)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:16,flexShrink:0}}>{(name||'?').charAt(0)}</span>;

function Header({ screen, setScreen, toast }) {
  const NAV = [
    { key:'analytics', label:'매칭 품질 분석 대시보드' },
    { key:'workspace', label:'파트너십 워크스페이스 & 활동 이력' },
    { key:'tuning', label:'추천 알고리즘 튜닝 관리자 콘솔' },
  ];
  return (
    <header className="search-header" data-search-header>
      <div className="header-row">
        <button className="brand-btn" onClick={()=>setScreen('main')}>
          <div className="brand-mark">B</div><div className="brand-text">비즈매치</div>
        </button>
        <div className="search-bar">
          <button className="search-segment" onClick={()=>toast('카테고리 선택 패널을 엽니다.')}><div className="segment-label">카테고리</div><div className="segment-value">전체 카테고리</div></button>
          <div className="search-divider"></div>
          <button className="search-segment" onClick={()=>toast('니즈 유형 선택 패널을 엽니다.')}><div className="segment-label">니즈 유형</div><div className="segment-value">투자·파트너·자문</div></button>
          <div className="search-divider"></div>
          <div className="search-input-wrap">
            <Icon name="ph-magnifying-glass" size={14} />
            <input type="search" placeholder="이름·업종 검색" />
          </div>
          <button className="search-submit" onClick={()=>toast('검색 조건이 적용되었습니다.')}><Icon name="ph-arrow-right" size={15} /></button>
        </div>
        <nav className="header-nav">
          {NAV.map(n => (
            <button key={n.key} className={`nav-link ${screen===n.key?'active':''}`} onClick={()=>setScreen(n.key)}>{n.label}</button>
          ))}
          <button className="user-menu" onClick={()=>toast('계정 메뉴')}><Icon name="ph-user" size={17} /></button>
        </nav>
      </div>
    </header>
  );
}

function MainScreen({ toast, openDrawer }) {
  const [cat, setCat] = useState('전체');
  const [favs, setFavs] = useState(() => new Set());
  const list = useMemo(() => cat==='전체' ? PARTNERS : PARTNERS.filter(p=>p.cat===cat), [cat]);

  const toggleFav = (e, id) => {
    e.stopPropagation();
    setFavs(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  };

  return (
    <div>
      <div className="filter-chips" data-filter-chips>
        {CATEGORIES.map(c => (
          <button key={c.key} className={`chip ${cat===c.key?'active':''}`} onClick={()=>setCat(c.key)}>
            <Icon name={c.icon} /> <span>{c.key}</span>
          </button>
        ))}
        <button className="chip filter-toggle" onClick={()=>toast('세부 필터 패널을 엽니다.')}><Icon name="ph-sliders-horizontal" /> 필터</button>
      </div>

      <div className="main-content" style={{paddingTop:0}}>
        <h2 className="section-title">다중 카테고리 파트너 디스커버리</h2>
        <p className="section-desc">AI 추천 외에도 카테고리·니즈 유형을 조합해 직접 탐색할 수 있습니다. 조건은 {list.length}건이 일치합니다.</p>
        <section className="card-grid">
          {/* stagger: cascading cardRise animation delay per card index */}
          {list.map((p,i) => (
            <article key={p.id} className="listing-card" style={{animationDelay:`${i*0.05}s`}} onClick={()=>openDrawer(p)}>
              <div className="card-image-wrap">
                <span className="card-badge">적합도 {p.fit}%</span>
                <button className={`card-favorite ${favs.has(p.id)?'active':''}`} onClick={(e)=>toggleFav(e,p.id)}>
                  <Icon name={favs.has(p.id)?'ph-heart-fill':'ph-heart'} size={16} />
                </button>
                <Icon name={p.icon} />
              </div>
              <div className="card-body">
                <div className="card-row-1">
                  <h3 className="card-title">{p.name}</h3>
                  <div className="card-rating"><Icon name="ph-star-fill" size={12} className="mr-1" />{(p.fit/20).toFixed(1)}</div>
                </div>
                <span className="card-meta">{p.role}</span>
                <span className="card-meta">{p.region} · {p.cat}</span>
                <div className="card-row-4">
                  <span className="card-price">{p.want}</span>
                </div>
              </div>
            </article>
          ))}
        </section>
      </div>
    </div>
  );
}

function QuickView({ partner, onClose, onRequest }) {
  if (!partner) return null;
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <button className="drawer-close" onClick={onClose}><Icon name="ph-x" size={16} /></button>
        <div className="drawer-hero"><Icon name={partner.icon} /></div>
        <h2>{partner.name}</h2>
        <div className="sub">{partner.role} · {partner.region}</div>
        <div className="drawer-stat-row">
          <div className="drawer-stat"><b>{partner.fit}%</b><span>적합도</span></div>
          <div className="drawer-stat"><b>{partner.cat}</b><span>카테고리</span></div>
        </div>
        <div className="drawer-section">
          <h4>필요로 하는 것 (WANT)</h4>
          <div className="drawer-tag-row"><span className="drawer-tag">{partner.want}</span></div>
        </div>
        <div className="drawer-section">
          <h4>추천 이유</h4>
          <p style={{fontSize:13, color:'var(--n8)', lineHeight:1.6, margin:0}}>AI가 회원님의 HAVE와 {partner.name}님의 WANT를 비교한 결과, 업종·니즈 유형 일치도가 높은 후보로 분류되었습니다.</p>
        </div>
        <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={()=>onRequest(partner)}><Icon name="ph-paper-plane-tilt" size={15} /> 연결 요청 보내기</button>
      </div>
    </React.Fragment>
  );
}

function AnalyticsScreen() {
  const [catFilter, setCatFilter] = useState('전체');
  const max = FUNNEL[0].value;
  const rejectData = [
    { name:'니즈 불명확', value:34 }, { name:'업종 비관련', value:22 }, { name:'규모 불일치', value:15 }, { name:'기타', value:9 },
  ];
  return (
    <div className="main-content">
      <h2 className="section-title">매칭 품질 분석 대시보드</h2>
      <p className="section-desc">가입부터 상호수락까지 단계별 인원 흐름과 AI 추천 거절 사유를 확인합니다.</p>
      <div className="category-filter-row">
        {['전체','투자','유통파트너','자문'].map(c => (
          <button key={c} className={`chip ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>
        ))}
      </div>
      <div className="analytics-grid">
        <div className="panel">
          <h3>단계별 퍼널 ({catFilter})</h3>
          {FUNNEL.map(f => (
            <div key={f.label} className="funnel-row">
              <span className="funnel-label">{f.label}</span>
              <div className="funnel-bar-wrap"><div className="funnel-bar" style={{width:`${(f.value/max)*100}%`}}></div></div>
              <span className="funnel-value">{f.value}명</span>
            </div>
          ))}
        </div>
        <div className="panel">
          <h3>AI 추천 거절 사유 분포</h3>
          <div style={{height:220}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={rejectData} layout="vertical" margin={{left:8,right:16}}>
                <CartesianGrid strokeDasharray="3 3" stroke="var(--n3)" horizontal={false} />
                <XAxis type="number" tick={{fontSize:11, fill:'var(--n7)'}} axisLine={false} tickLine={false} />
                <YAxis type="category" dataKey="name" tick={{fontSize:11.5, fill:'var(--n8)'}} width={90} axisLine={false} tickLine={false} />
                <Tooltip />
                <Bar dataKey="value" fill="#d6d5d7" radius={[0,8,8,0]}>
                  {rejectData.map((entry, i) => <Cell key={i} fill={i===0 ? '#887fa3' : '#d6d5d7'} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );
}

const WS_ITEMS = [
  { id:1, name:'김도윤', time:'2026.09.18', note:'화상 미팅 진행 — 투자 라운드 규모와 마일스톤 공유 완료.', tags:['미팅완료','투자'] },
  { id:2, name:'이하준', time:'2026.09.15', note:'세무 자문 계약 조건 조율 중, 다음 액션은 계약서 초안 검토.', tags:['협의중','자문'] },
  { id:3, name:'박서연', time:'2026.09.10', note:'편집숍 입점 브랜드 리스트 3건 전달, 회신 대기.', tags:['대기','브랜드소싱'] },
];

function WorkspaceScreen({ toast }) {
  const [items, setItems] = useState(WS_ITEMS);
  const [note, setNote] = useState('');
  const add = () => {
    if (!note.trim()) return;
    setItems(prev => [{ id:Date.now(), name:'김도윤', time:'방금 전', note, tags:['메모추가'] }, ...prev]);
    setNote('');
    toast('활동 메모가 추가되었습니다.');
  };
  return (
    <div className="main-content">
      <div className="ws-toolbar">
        <div>
          <h2 className="section-title">파트너십 워크스페이스 & 활동 이력</h2>
          <p className="section-desc" style={{marginBottom:0}}>연결된 파트너와의 후속 미팅·메모·다음 액션을 관리합니다.</p>
        </div>
      </div>
      <div className="panel" style={{marginBottom:18}}>
        <h3>새 활동 기록</h3>
        <div className="compose-box">
          <textarea rows={2} placeholder="예: 김도윤님과 다음 주 화요일 후속 미팅 예정…" value={note} onChange={e=>setNote(e.target.value)} />
          <button className="btn btn-primary" onClick={add}><Icon name="ph-plus" size={15}/> 추가</button>
        </div>
      </div>
      <div className="ws-list">
        {items.map(w => (
          <div key={w.id} className="ws-card">
            <div className="ws-card-top">
              <div style={{display:'flex', gap:12}}>
                <div className="ws-timeline-dot"></div>
                <div>
                  <div className="ws-name">{w.name}</div>
                  <div className="ws-note">{w.note}</div>
                  <div className="ws-tag-row">{w.tags.map((t,i)=><span key={i} className="ws-tag">{t}</span>)}</div>
                </div>
              </div>
              <span className="ws-time">{w.time}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const VERSIONS = [
  { v:'v1.4', date:'2026.09.16', note:'유통파트너 가중치 +0.1', author:'관리자' },
  { v:'v1.3', date:'2026.09.08', note:'거절 사유 기반 임계값 조정', author:'관리자' },
  { v:'v1.2', date:'2026.08.29', note:'투자 카테고리 우선순위 상향', author:'관리자' },
];

function TuningScreen({ toast }) {
  const [semantic, setSemantic] = useState(65);
  const [category, setCategory] = useState(50);
  const [threshold, setThreshold] = useState(60);
  const [preview, setPreview] = useState([
    { pair:'김도윤 → 배지훈', before:78, after:78 },
    { pair:'박서연 → 현지오', before:64, after:64 },
    { pair:'이하준 → 정민재', before:71, after:71 },
  ]);

  const recompute = (s, c) => {
    setPreview(prev => prev.map(p => ({ ...p, after: Math.min(99, Math.round(p.before * (0.7 + s/200) * (0.85 + c/300))) })));
  };

  const onSemantic = (v) => { setSemantic(v); recompute(v, category); };
  const onCategory = (v) => { setCategory(v); recompute(semantic, v); };

  return (
    <div className="main-content">
      <h2 className="section-title">추천 알고리즘 튜닝 관리자 콘솔</h2>
      <p className="section-desc">임베딩 유사도 가중치와 매칭 규칙을 조정하고 표본 데이터로 영향도를 미리 확인합니다.</p>
      <div className="tuning-grid">
        <div className="panel">
          <h3>가중치 파라미터</h3>
          <div className="slider-row">
            <div className="head"><span>의미 유사도(임베딩) 가중치</span><span>{semantic}%</span></div>
            <input type="range" min="0" max="100" value={semantic} onChange={e=>onSemantic(Number(e.target.value))} />
          </div>
          <div className="slider-row">
            <div className="head"><span>카테고리 일치 가중치</span><span>{category}%</span></div>
            <input type="range" min="0" max="100" value={category} onChange={e=>onCategory(Number(e.target.value))} />
          </div>
          <div className="slider-row">
            <div className="head"><span>추천 노출 최소 임계값</span><span>{threshold}%</span></div>
            <input type="range" min="0" max="100" value={threshold} onChange={e=>setThreshold(Number(e.target.value))} />
          </div>
          <button className="btn btn-primary" onClick={()=>toast('설정이 새 버전(v1.5)으로 저장되었습니다.')}><Icon name="ph-floppy-disk" size={15}/> 새 버전으로 저장</button>
        </div>
        <div className="panel">
          <h3>표본 매칭 결과 미리보기</h3>
          {preview.map((p,i) => (
            <div key={i} className="sim-item">
              <span>{p.pair}</span>
              <span style={{fontWeight:700, color: p.after>=p.before ? 'var(--s1-text)' : 'var(--s2-text)'}}>{p.before}% → {p.after}%</span>
            </div>
          ))}
          <h3 style={{marginTop:20}}>설정 버전 이력</h3>
          <table className="version-table">
            <thead><tr><th>버전</th><th>일자</th><th>변경 내용</th></tr></thead>
            <tbody>
              {VERSIONS.map(v => (
                <tr key={v.v}>
                  <td>{v.v}</td><td>{v.date}</td><td>{v.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [drawerItem, setDrawerItem] = useState(null);
  const [toasts, setToasts] = useState([]);
  const toast = (msg) => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 2800);
  };
  const requestConnect = (p) => { setDrawerItem(null); toast(`${p.name}님에게 연결 요청을 보냈습니다.`); };

  return (
    <div className="app-shell" data-archetype="airbnb-search-grid">
      <Header screen={screen} setScreen={setScreen} toast={toast} />
      {screen === 'main' && <MainScreen toast={toast} openDrawer={setDrawerItem} />}
      {screen === 'analytics' && <AnalyticsScreen />}
      {screen === 'workspace' && <WorkspaceScreen toast={toast} />}
      {screen === 'tuning' && <TuningScreen toast={toast} />}

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <h4>비즈매치</h4>
            <a>서비스 소개</a><a>이용 요금</a><a>파트너 사례</a>
          </div>
          <div className="footer-col">
            <h4>디스커버리</h4>
            <a>카테고리 탐색</a><a>추천 알고리즘</a><a>매칭 가이드</a>
          </div>
          <div className="footer-col">
            <h4>운영</h4>
            <a>분석 대시보드</a><a>워크스페이스</a><a>튜닝 콘솔</a>
          </div>
          <div className="footer-col">
            <h4>고객지원</h4>
            <a>자주 묻는 질문</a><a>문의하기</a>
          </div>
        </div>
      </footer>

      {drawerItem && <QuickView partner={drawerItem} onClose={()=>setDrawerItem(null)} onRequest={requestConnect} />}
      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className="toast"><Icon name="ph-check-circle" size={16}/>{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
