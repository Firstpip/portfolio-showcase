<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보카브릿지 — AI 보이스카드 영어학습 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 89°, light) ── */
:root{
  --m50:#eff1ed;
  --m100:#eff1ed;
  --m200:#eff1ed;
  --m300:#dfe2db;
  --m400:#bfc6b8;
  --m500:#98a38c;
  --m600:#6c7c5c;
  --m700:#43582e;
  --m800:#1a3300;
  --m900:#152a00;
  --n0:#fcfaf5;
  --n1:#f1f1f1;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d6d7d5;
  --n5:#b8bab5;
  --n6:#949890;
  --n7:#757a71;
  --n8:#5c5c5c;
  --n9:#383a36;
  --n10:#1f201e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card: 20px;
  --radius-btn: 10px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--n0);
  color:var(--n9);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
#app{width:100%;min-height:100vh;}

/* ── keyframes ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes ripple{from{transform:scale(0);opacity:.55;}to{transform:scale(2.6);opacity:0;}}
@keyframes pulseFlame{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
@keyframes waveBar{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes spinSlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes dashSweep{from{stroke-dashoffset:220;}to{stroke-dashoffset:var(--ring-offset,60);}}

/* ── topbar ── */
.topbar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;background:var(--n0);border-bottom:1px solid var(--n3);
  position:sticky;top:0;z-index:40;
}
.topbar-left{display:flex;align-items:center;gap:36px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--m800);display:flex;align-items:center;justify-content:center;color:var(--n0);font-size:18px;flex-shrink:0;}
.brand-name{font-weight:800;font-size:19px;letter-spacing:-.2px;}
.topnav{display:flex;align-items:center;gap:4px;}
.nav-btn{padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--n7);transition:background .15s,color .15s;position:relative;overflow:hidden;}
.nav-btn:hover{background:var(--n2);color:var(--n9);}
.nav-btn.active{background:var(--m50);color:var(--m800);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.status-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--s3-bg);color:var(--s3-text);font-size:13px;font-weight:700;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n1);transition:background .15s;}
.icon-btn:hover{background:var(--n3);}

.page{width:100%;max-width:1280px;margin:0 auto;padding:36px 32px 80px;animation:fadeInUp .45s ease both;}

/* ── bento ── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;width:100%;}
.tile{
  background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);
  padding:26px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;
  display:flex;flex-direction:column;
}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(26,51,0,.08);}
.tile.feature{grid-column:span 2;grid-row:span 2;background:linear-gradient(145deg, var(--m700) 0%, var(--m900) 100%);color:var(--n0);justify-content:space-between;}
.tile.wide{grid-column:span 4;}
.tile-label{font-size:13px;font-weight:700;color:var(--n7);letter-spacing:.2px;margin-bottom:14px;}
.tile.feature .tile-label{color:var(--n3);}
.tile-num{font-weight:800;letter-spacing:-1px;}
.hero-greeting{font-size:clamp(28px,3.2vw,32px);font-weight:800;margin:0 0 6px;letter-spacing:-.5px;}
.hero-sub{font-size:15px;color:var(--n3);margin:0;opacity:.85;}
.streak-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px;}
.streak-num{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px;}
.streak-flame{font-size:30px;color:var(--s3);animation:pulseFlame 1.6s ease-in-out infinite;}
.ring-wrap{position:relative;width:78px;height:78px;flex-shrink:0;}
.metric-num{font-size:38px;font-weight:800;letter-spacing:-1px;color:var(--n9);}
.metric-sub{font-size:13px;color:var(--n7);margin-top:4px;}
.badge-trial{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--s3-bg);color:var(--s3-text);font-size:13px;font-weight:700;margin-top:8px;}
.action-btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--radius-btn);background:var(--n2);color:var(--n9);font-weight:700;font-size:14px;transition:background .15s;position:relative;overflow:hidden;}
.action-btn:hover{background:var(--n3);}
.action-btn.primary{background:var(--m800);color:var(--n0);}
.action-btn.primary:hover{background:var(--m900);}
.ripple-span{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;animation:ripple .55s ease-out;}

.card-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;margin-top:4px;}
.mini-card{flex:0 0 200px;background:var(--n0);border:1px solid var(--n3);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}
.mini-card:hover{border-color:var(--m600);}
.mini-avatar{width:40px;height:40px;border-radius:50%;background:var(--n2);color:var(--n6);display:flex;align-items:center;justify-content:center;}
.mini-phrase{font-size:14px;font-weight:600;color:var(--n9);line-height:1.4;}
.mini-meta{font-size:12.5px;color:var(--n7);display:flex;align-items:center;justify-content:space-between;}
.play-dot{width:26px;height:26px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n8);flex-shrink:0;}

/* ── generic section ── */
.section-head{margin-bottom:24px;}
.section-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;}
.section-desc{font-size:14.5px;color:var(--n7);margin:0;}

/* ── QR onboarding ── */
.qr-layout{display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start;}
.qr-card{background:linear-gradient(160deg, var(--m700) 0%, var(--m900) 100%);border-radius:24px;padding:32px;color:var(--n0);text-align:center;}
.qr-grid{width:200px;height:200px;margin:0 auto 18px;background:var(--n0);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;}
.qr-cell{background:var(--n9);border-radius:1.5px;}
.qr-cell.off{background:transparent;}
.qr-token{font-size:12.5px;color:var(--n3);margin-top:10px;font-family:monospace;}
.qr-expiry{margin-top:14px;font-size:13px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;}
.steps-list{display:flex;flex-direction:column;gap:14px;margin:20px 0 28px;}
.step-item{display:flex;gap:14px;align-items:flex-start;}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex-shrink:0;}
.step-body h4{margin:0 0 3px;font-size:15px;font-weight:700;}
.step-body p{margin:0;font-size:13.5px;color:var(--n7);}
.sim-buttons{display:flex;gap:12px;margin-bottom:22px;}
.sim-btn{flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--n3);background:var(--n1);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
.sim-btn:hover{border-color:var(--m600);}
.sim-btn.selected{border-color:var(--m600);background:var(--m50);color:var(--n9);}
.result-panel{border-radius:18px;padding:24px;border:1px solid var(--n3);background:var(--n1);animation:fadeInUp .3s ease;}
.result-panel.installed{border-color:var(--s1);background:var(--s1-bg);}
.result-panel.web{border-color:var(--m600);background:var(--n0);}
.result-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;}
.result-desc{font-size:14px;color:var(--n8);line-height:1.6;margin-bottom:14px;}
.store-row{display:flex;gap:10px;}
.store-chip{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--n9);color:var(--n0);font-size:13px;font-weight:700;}
.expired-toggle{margin-top:16px;font-size:13px;color:var(--n7);display:flex;align-items:center;gap:8px;}
.switch{width:38px;height:22px;border-radius:999px;background:var(--n4);position:relative;transition:.2s;flex-shrink:0;}
.switch.on{background:var(--m800);}
.switch-dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on .switch-dot{left:18px;}

/* ── voice card ── */
.vc-layout{display:flex;flex-direction:column;align-items:center;gap:22px;}
.vc-card{width:100%;max-width:440px;background:var(--n1);border:1px solid var(--n3);border-radius:26px;padding:34px;text-align:center;position:relative;}
.vc-silhouette{width:88px;height:88px;border-radius:50%;background:var(--n2);color:var(--n5);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.vc-name{font-size:15px;font-weight:700;color:var(--n8);margin-bottom:18px;}
.vc-phrase-en{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;line-height:1.35;}
.vc-phrase-kr{font-size:14.5px;color:var(--n7);margin-bottom:26px;}
.wave-row{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:44px;margin-bottom:22px;}
.wave-bar{width:5px;border-radius:3px;background:var(--m600);transform-origin:bottom;height:100%;}
.vc-btn-row{display:flex;gap:12px;justify-content:center;}
.vc-btn{display:flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;}
.vc-btn.play{background:var(--m800);color:var(--n0);}
.vc-btn.mic{background:var(--n2);color:var(--n9);border:1.5px solid var(--n3);}
.vc-btn.mic.recording{background:var(--s2-bg);color:var(--s2-text);border-color:var(--s2);}
.vc-nav{display:flex;align-items:center;gap:20px;}
.vc-arrow{width:44px;height:44px;border-radius:50%;background:var(--n1);border:1px solid var(--n3);display:flex;align-items:center;justify-content:center;color:var(--n8);}
.vc-arrow:hover{background:var(--n2);}
.vc-dots{display:flex;gap:7px;}
.vc-dot{width:7px;height:7px;border-radius:50%;background:var(--n4);}
.vc-dot.active{background:var(--m800);width:20px;border-radius:4px;}
.vc-fallback{margin-top:6px;width:100%;max-width:440px;border:1px dashed var(--s3);background:var(--s3-bg);color:var(--s3-text);border-radius:16px;padding:16px;font-size:13.5px;line-height:1.6;text-align:left;}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--n7);}

/* ── subscription ── */
.sub-layout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;}
.plan-card{background:var(--n1);border:1px solid var(--n3);border-radius:22px;padding:28px;margin-bottom:24px;}
.plan-badge{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--n2);color:var(--n8);font-size:12.5px;font-weight:700;margin-bottom:12px;}
.plan-price{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0;}
.plan-price span{font-size:15px;font-weight:600;color:var(--n7);}
.stepper{display:flex;align-items:center;margin:26px 0;}
.step-circle{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex-shrink:0;}
.step-circle.done{background:var(--m800);color:var(--n0);}
.step-circle.current{background:var(--m50);color:var(--m800);border:2px solid var(--m800);}
.step-line{flex:1;height:2px;background:var(--n3);}
.step-line.done{background:var(--m800);}
.step-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--n7);margin-top:8px;}
.form-card{background:var(--n1);border:1px solid var(--n3);border-radius:18px;padding:22px;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:13px;font-weight:700;color:var(--n8);margin-bottom:6px;}
.form-row input,.form-row select{width:100%;padding:11px 12px;border:1.5px solid var(--n3);border-radius:10px;font-size:14px;background:var(--n0);color:var(--n9);}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--m800);}
.warn-inline{margin-top:10px;padding:10px 12px;background:var(--s3-bg);color:var(--s3-text);border-radius:10px;font-size:12.5px;line-height:1.5;display:flex;gap:8px;}
.retry-timeline{display:flex;flex-direction:column;gap:10px;}
.retry-item{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--n0);border:1px solid var(--n3);}
.retry-item .dot{width:8px;height:8px;border-radius:50%;background:var(--n4);flex-shrink:0;}
.retry-item.fail .dot{background:var(--s2);}
.retry-item.final .dot{background:var(--s3);}
.side-panel{background:var(--n1);border:1px solid var(--n3);border-radius:18px;padding:22px;}
.side-panel h4{margin:0 0 14px;font-size:15px;font-weight:800;}
.side-row{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--n3);color:var(--n8);}
.side-row:last-child{border-bottom:none;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(26,51,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp .2s ease;}
.modal-box{width:420px;max-width:92vw;background:var(--n1);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.18);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{margin:0;font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;}
.modal-actions{display:flex;gap:10px;margin-top:22px;}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;}
.btn.ghost{background:var(--n2);color:var(--n9);}
.btn.solid{background:var(--m800);color:var(--n0);}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--m900);color:var(--n0);padding:14px 22px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:200;animation:toastIn .25s ease;box-shadow:0 12px 30px rgba(0,0,0,.2);}

@media (max-width:860px){
  .bento{grid-template-columns:repeat(2,1fr);}
  .tile.feature{grid-column:span 2;}
  .tile.wide{grid-column:span 2;}
  .qr-layout,.sub-layout{grid-template-columns:1fr;}
  .topnav{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function ProgressRing({percent=60, size=78, stroke=8, color='var(--n0)', track='rgba(255,255,255,.18)'}){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (percent/100) * c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .6s ease'}} />
      <text x="50%" y="52%" textAnchor="middle" fontSize="16" fontWeight="800" fill={color}>{percent}%</text>
    </svg>
  );
}

function Silhouette({size=44}){
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/>
    </svg>
  );
}

function QrPattern(){
  const seed = 91827;
  const cells = [];
  let s = seed;
  const rand = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return (s % 100) / 100; };
  for(let i=0;i<64;i++){
    const corner = (i<9 && (i%8<3)) || (i>=56 && i%8<3) || (i<9 && false);
    const isCorner = (Math.floor(i/8) < 3 && i%8 < 3) || (Math.floor(i/8) < 3 && i%8 > 4) || (Math.floor(i/8) > 4 && i%8 < 3);
    cells.push(isCorner ? true : rand() > 0.46);
  }
  return (
    <div className="qr-grid">
      {cells.map((on,i)=>(<div key={i} className={`qr-cell ${on?'':'off'}`}></div>))}
    </div>
  );
}

function Toast({msg, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return <div className="toast"><i className="ph ph-check-circle"></i>{msg}</div>;
}

function RippleButton({className, onClick, children}){
  const ref = useRef(null);
  const handle = (e) => {
    const btn = ref.current;
    const rect = btn.getBoundingClientRect();
    const span = document.createElement('span');
    span.className = 'ripple-span';
    span.style.left = (e.clientX - rect.left - 10) + 'px';
    span.style.top = (e.clientY - rect.top - 10) + 'px';
    span.style.width = span.style.height = '20px';
    btn.appendChild(span);
    setTimeout(()=>span.remove(), 550);
    onClick && onClick(e);
  };
  return <button ref={ref} className={className} onClick={handle}>{children}</button>;
}

const VOICE_CARDS = [
  { name: 'Emma · 영국식 발음', en: 'Could you repeat that, please?', kr: '다시 한 번 말씀해 주시겠어요?' },
  { name: 'Daniel · 미국식 발음', en: "I'd like to check in for my flight.", kr: '항공편 체크인을 하고 싶습니다.' },
  { name: 'Sophie · 호주식 발음', en: 'How much does this cost in total?', kr: '전부 합쳐서 얼마인가요?' },
  { name: 'Marcus · 캐나다식 발음', en: 'Can you recommend a good restaurant nearby?', kr: '근처에 괜찮은 식당을 추천해 주시겠어요?' },
  { name: 'Olivia · 미국식 발음', en: "I'm sorry, I didn't catch your name.", kr: '죄송한데 성함을 못 들었어요.' },
];

const RECENT_CARDS = [
  { name: 'Emma', phrase: 'Could you repeat that, please?', dur: '0:12' },
  { name: 'Daniel', phrase: "I'd like to check in for my flight.", dur: '0:15' },
  { name: 'Sophie', phrase: 'How much does this cost in total?', dur: '0:10' },

function QrOnboardingView(){
  const [mode, setMode] = useState(null);
  const [expired, setExpired] = useState(false);

  return (
    <div className="page">
      <div className="section-head">
        <h1 className="section-title">QR 온보딩</h1>
        <p className="section-desc">콘서트 현장 QR 스캔부터 AI 보이스카드 영어 학습 화면 진입까지의 라우팅 흐름을 시뮬레이션합니다.</p>
      </div>
      <div className="qr-layout">
        <div className="qr-card">
          <QrPattern />
          <div style={{fontWeight:800, fontSize:15}}>보카브릿지 콘서트 현장 QR</div>
          <div className="qr-token">token: vb-2026-1001-a91f</div>
          <div className="qr-expiry"><i className="ph ph-calendar-check"></i> 유효기간 2026.10.01 09:00 ~ 10.08 09:00</div>
          <div style={{marginTop:14, fontSize:12.5, color:'var(--n3)', lineHeight:1.5}}>
            스캔 시 첫 AI 보이스카드 무료 체험으로 연결됩니다<br/>
            <span style={{fontStyle:'italic'}}>"Could you repeat that, please?"</span>
          </div>
          <div className="expired-toggle" style={{justifyContent:'center', marginTop:16}}>
            <span>만료된 QR 시뮬레이션</span>
            <div className={`switch ${expired?'on':''}`} onClick={()=>setExpired(!expired)}>
              <div className="switch-dot"></div>
            </div>
          </div>
        </div>

        <div>
          <div className="steps-list">
            <div className="step-item">
              <div className="step-num">1</div>
              <div className="step-body"><h4>QR 스캔</h4><p>콘서트 현장 배너·팔찌의 보카브릿지 QR을 카메라 앱으로 스캔합니다.</p></div>
            </div>
            <div className="step-item">
              <div className="step-num">2</div>
              <div className="step-body"><h4>설치 여부 판별</h4><p>딥링크 토큰을 파싱해 기기의 앱 설치 여부를 확인합니다.</p></div>
            </div>
            <div className="step-item">
              <div className="step-num">3</div>
              <div className="step-body"><h4>보이스카드 학습 화면 진입</h4><p>설치된 사용자는 앱의 AI 보이스카드로, 미설치 사용자는 웹 프리뷰로 이동해 영어 학습을 바로 시작합니다.</p></div>
            </div>
          </div>

          {expired ? (
            <div className="result-panel" style={{borderColor:'var(--s2)', background:'var(--s2-bg)'}}>
              <div className="result-title" style={{color:'var(--s2-text)'}}><i className="ph ph-warning-circle"></i> QR 유효기간이 만료되었습니다</div>
              <div className="result-desc">이 QR은 2026.10.08 09:00에 만료되었습니다. 최신 QR을 다시 발급받아 주세요.</div>
            </div>
          ) : (
            <React.Fragment>
              <div className="sim-buttons">
                <button className={`sim-btn ${mode==='installed'?'selected':''}`} onClick={()=>setMode('installed')}>
                  <i className="ph ph-device-mobile"></i> 설치된 사용자로 시뮬레이션
                </button>
                <button className={`sim-btn ${mode==='web'?'selected':''}`} onClick={()=>setMode('web')}>
                  <i className="ph ph-globe"></i> 미설치 사용자로 시뮬레이션
                </button>

              {mode === 'installed' && (

                  <div className="result-title" style={{color:'var(--s1-text)'}}><i className="ph-fill ph-check-circle-fill"></i> 앱으로 즉시 이동</div>
                  <div className="result-desc">Universal Link(iOS) / App Link(Android) 스킴으로 앱의 보이스카드 화면까지 직접 진입합니다. 별도 클릭 없이 1주일 무료체험이 자동 활성화됩니다.</div>
                </div>
              )}
              {mode === 'web' && (
                <div className="result-panel web">
                  <div className="result-title"><i className="ph ph-browser"></i> 웹 프리뷰로 이동</div>
                  <div className="result-desc">미설치 사용자는 웹 기반 프리뷰 페이지에서 보이스카드 1개를 미리 체험한 뒤, 마켓으로 안내됩니다.</div>
                  <div className="store-row">
                    <div className="store-chip"><i className="ph-fill ph-apple-logo-fill"></i> App Store</div>
                    <div className="store-chip"><i className="ph-fill ph-google-play-logo-fill"></i> Google Play</div>
                  </div>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
    </div>

}

function VoiceCardView(){
  const [idx, setIdx] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [recording, setRecording] = useState(false);
  const [simFail, setSimFail] = useState(false);
  const [toast, setToast] = useState(null);
  const card = VOICE_CARDS[idx];

  const play = () => {
    if (simFail) return;
    setPlaying(true);
    setTimeout(()=>setPlaying(false), 1600);
  };
  const record = () => {
    setRecording(true);
    setTimeout(()=>{
      setRecording(false);
      setToast('녹음 완료! 발음 유사도 92점');
    }, 1800);
  };

  return (
    <div className="page">
      <div className="section-head">
        <h1 className="section-title">AI 보이스카드</h1>
        <p className="section-desc">ElevenLabs로 합성한 원어민 음성을 듣고 따라 말하며 발음을 연습합니다.</p>
      </div>
      <div className="vc-layout">
        <div className="toggle-row">
          <span>네트워크 오류(음성 로드 실패) 시뮬레이션</span>
          <div className={`switch ${simFail?'on':''}`} onClick={()=>setSimFail(!simFail)}><div className="switch-dot"></div></div>
        </div>

        <div className="vc-card">
          <div className="vc-silhouette"><Silhouette size={48} /></div>
          <div className="vc-name">{card.name}</div>
          <div className="vc-phrase-en">"{card.en}"</div>
          <div className="vc-phrase-kr">{card.kr}</div>

          {playing && (
            <div className="wave-row">
              {[0,1,2,3,4,5,6,7].map(i=>(
                <div key={i} className="wave-bar" style={{height: (18+((i*37)%26))+'px', animation:`waveBar ${0.5+(i%3)*0.15}s ease-in-out infinite`}}></div>
              ))}
            </div>
          )}

          <div className="vc-btn-row">
            <RippleButton className="vc-btn play" onClick={play}>
              <i className={`ph-fill ${playing?'ph-speaker-high-fill':'ph-play-fill'}`}></i> {playing ? '재생 중' : '재생'}
            </RippleButton>
            <RippleButton className={`vc-btn mic ${recording?'recording':''}`} onClick={record}>
              <i className={`ph ${recording?'ph-record-fill':'ph-microphone'}`}></i> {recording ? '녹음 중...' : '따라 말하기'}
            </RippleButton>
          </div>

          {simFail && (
            <div className="vc-fallback">
              <strong>음성 로드에 실패했습니다.</strong><br/>
              네트워크 상태를 확인해 주세요. 아래 텍스트 스크립트로 발음을 참고할 수 있습니다.<br/>
              <span style={{fontStyle:'italic'}}>"{card.en}"</span>
            </div>
          )}
        </div>

        <div className="vc-nav">
          <button className="vc-arrow" onClick={()=>setIdx((idx-1+VOICE_CARDS.length)%VOICE_CARDS.length)}><i className="ph ph-caret-left"></i></button>
          <div className="vc-dots">
            {VOICE_CARDS.map((_,i)=>(<div key={i} className={`vc-dot ${i===idx?'active':''}`} onClick={()=>setIdx(i)}></div>))}
          </div>
          <button className="vc-arrow" onClick={()=>setIdx((idx+1)%VOICE_CARDS.length)}><i className="ph ph-caret-right"></i></button>
        </div>
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

function PaymentModal({onClose, onSubmit}){
  const [country, setCountry] = useState('한국');
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3>결제 수단 등록</h3>
          <button className="modal-close" onClick={onClose}><i className="ph ph-x"></i></button>
        </div>
        <div className="form-row">
          <label>카드 번호</label>
          <input defaultValue="4512 - - -" placeholder="0000 0000 0000 0000" />
        </div>
        <div style={{display:'flex', gap:12}}>
          <div className="form-row" style={{flex:1}}>
            <label>유효기간</label>
            <input placeholder="MM / YY" />
          </div>
          <div className="form-row" style={{flex:1}}>
            <label>CVC</label>
            <input placeholder="123" />
          </div>
        </div>
        <div className="form-row">
          <label>카드 발급국</label>
          <select value={country} onChange={e=>setCountry(e.target.value)}>
            <option>한국</option>
            <option>일본</option>
            <option>기타 해외</option>
          </select>
        </div>
        {country !== '한국' && (
          <div className="warn-inline">
            <i className="ph ph-warning"></i>
            토스페이먼츠는 국내 발급 카드만 지원합니다. 제출 시 대체 결제 수단 안내로 전환됩니다.
          </div>
        )}
        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose}>취소</button>
          <button className="btn solid" onClick={()=>onSubmit(country)}>등록하기</button>
        </div>
      </div>
    </div>
  );
}

function SubscriptionView(){
  const [showModal, setShowModal] = useState(false);
  const [status, setStatus] = useState('idle'); // idle | trial | altpay
  const [toast, setToast] = useState(null);

  const submit = (country) => {
    setShowModal(false);
    if (country === '한국') {
      setStatus('trial');
      setToast('체험 등록 완료! 10월 8일부터 자동 결제됩니다.');
    } else {
      setStatus('altpay');
      setToast('해외 카드 감지 — 대체 결제 수단 안내로 전환되었습니다.');
    }
  };

  const steps = ['체험 등록', '결제 시도', '결제 완료', '재시도'];
  const currentStep = status === 'idle' ? 0 : status === 'trial' ? 1 : 1;

  return (
    <div className="page">
      <div className="section-head">
        <h1 className="section-title">구독 결제</h1>
        <p className="section-desc">7일 무료체험 후 자동 결제로 전환되는 구독 플로우와 해외 결제 대안을 확인합니다.</p>
      </div>
      <div className="sub-layout">
        <div>
          <div className="plan-card">
            <span className="plan-badge">7일 무료체험</span>
            <div className="plan-price">9,900원 <span>/ 월 (체험 종료 후)</span></div>
            <div className="stepper">
              {steps.map((s,i)=>(
                <React.Fragment key={i}>
                  <div className={`step-circle ${i<currentStep?'done':i===currentStep?'current':''}`}>{i<currentStep? <i className="ph ph-check"></i> : i+1}</div>
                  {i<steps.length-1 && <div className={`step-line ${i<currentStep?'done':''}`}></div>}
                </React.Fragment>
              ))}
            </div>
            <div className="step-labels">{steps.map((s,i)=>(<span key={i}>{s}</span>))}</div>

            {status === 'altpay' && (
              <div className="warn-inline" style={{marginTop:18}}>
                <i className="ph ph-globe"></i>
                해외 발급 카드는 토스페이먼츠 결제가 제한됩니다. 대체 결제 수단(해외 카드 전용 PG) 연동 안내 메일이 발송되었습니다.
              </div>
            )}

            <RippleButton className="action-btn primary" style={{marginTop:20}} onClick={()=>setShowModal(true)}>
              <i className="ph ph-credit-card"></i> 결제 수단 등록
            </RippleButton>
          </div>

          <div className="form-card">
            <h4 style={{margin:'0 0 14px', fontSize:15, fontWeight:800}}>결제 실패 재시도 정책</h4>
            <div className="retry-timeline">
              <div className="retry-item fail"><span className="dot"></span> 재시도 1회차 — 결제 실패 (카드 한도 초과)</div>
              <div className="retry-item fail"><span className="dot"></span> 재시도 2회차 — 결제 실패 (일시적 승인 거절)</div>
              <div className="retry-item fail"><span className="dot"></span> 재시도 3회차 — 결제 실패</div>
              <div className="retry-item final"><span className="dot"></span> 자동 재시도 중단 → 수동 결제 화면으로 전환</div>
            </div>
          </div>
        </div>

        <div className="side-panel">
          <h4>구독 요약</h4>
          <div className="side-row"><span>현재 상태</span><span>{status==='idle' ? '결제수단 미등록' : status==='trial' ? '무료체험 중' : '대체 결제 안내'}</span></div>
          <div className="side-row"><span>체험 종료일</span><span>2026.10.08</span></div>
          <div className="side-row"><span>결제 수단</span><span>{status==='idle' ? '없음' : '토스페이먼츠'}</span></div>
          <div className="side-row"><span>다음 결제 예정</span><span>2026.10.08</span></div>
        </div>
      </div>

      {showModal && <PaymentModal onClose={()=>setShowModal(false)} onSubmit={submit} />}
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  return (
    <div data-archetype="bento-grid" style={{width:'100%', minHeight:'100vh'}}>
      <TopBar view={view} setView={setView} />
      {view === 'main' && <HomeView setView={setView} />}
      {view === 'qr-onboarding' && <QrOnboardingView />}
      {view === 'voice-card' && <VoiceCardView />}
      {view === 'subscription' && <SubscriptionView />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
