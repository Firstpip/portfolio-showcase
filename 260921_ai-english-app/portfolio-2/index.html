<style>

:root{
  --m50:#f3efff;
  --m100:#ece6ff;
  --m200:#e3dbff;
  --m300:#dcd1ff;
  --m400:#d4c7ff;
  --m500:#aea3d1;
  --m600:#887fa3;
  --m700:#5f5a73;
  --m800:#5f5a73;
  --m900:#5f5a73;
  --n0:#f2f0eb;
  --n1:#ffffff;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d6d5d7;
  --n5:#b6b5ba;
  --n6:#929098;
  --n7:#666666;
  --n8:#55535a;
  --n9:#37363a;
  --n10:#292827;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --sidebar-w: 244px;
  --radius-card: 14px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;}
#app{width:100%;min-height:100vh;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes ripple2{from{transform:scale(0);opacity:.5;}to{transform:scale(2.4);opacity:0;}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes toastIn2{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes shimmer2{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
@keyframes rowPulse{0%{background:var(--m50);}100%{background:transparent;}}

/* ── stripe-multipane skeleton ── */
.shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--n1);border-right:1px solid var(--n3);padding:20px 14px;overflow-y:auto;z-index:30;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.sidebar-brand .mark{width:32px;height:32px;border-radius:9px;background:var(--m700);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-brand .name{font-weight:800;font-size:15.5px;letter-spacing:-.2px;}
.env-select{display:flex;align-items:center;gap:6px;margin:0 8px 18px;padding:8px 10px;border-radius:9px;background:var(--n2);font-size:12.5px;color:var(--n7);font-weight:600;}
.sidebar-section{margin-bottom:18px;}
.sidebar-section-title{font-size:11px;font-weight:800;color:var(--n6);text-transform:uppercase;letter-spacing:.6px;padding:0 10px;margin-bottom:8px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--n8);margin-bottom:2px;transition:background .15s,color .15s;}
.sidebar-link:hover{background:var(--n2);}
.sidebar-link.active{background:var(--m50);color:var(--m700);}
.sidebar-link i{width:17px;}

.main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;width:calc(100% - var(--sidebar-w));min-height:100vh;}
.page-header{padding:26px 32px 0;}
.page-title-row{display:flex;justify-content:space-between;align-items:center;}
.page-title{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:0;}
.hero-band{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:22px 26px;margin-bottom:20px;position:relative;overflow:hidden;}
.hero-band-title{font-size:19px;font-weight:800;margin:0 0 4px;color:var(--n10);}
.hero-band-sub{font-size:13px;color:var(--n7);margin:0;}
.hero-band svg{position:absolute;right:-6px;top:-14px;opacity:.5;pointer-events:none;}
.page-actions{display:flex;gap:10px;}
.btn-secondary{padding:9px 15px;border-radius:9px;background:var(--n2);color:var(--n9);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.btn-primary{padding:9px 16px;border-radius:9px;background:var(--m700);color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;position:relative;overflow:hidden;}
.page-meta{font-size:12.5px;color:var(--n6);margin-top:6px;}

.content{padding:20px 32px 60px;animation:fadeInUp .4s ease both;}

/* KPI row */
.insight-row{display:grid;grid-template-columns:2.1fr 1fr;gap:16px;margin-bottom:16px;align-items:stretch;}
.hero-viz-card{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);overflow:hidden;position:relative;}
.hero-viz-card .accent-blob{position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 30% 30%, var(--m300), var(--m700) 78%);opacity:.22;pointer-events:none;}
.kpi-side{display:flex;flex-direction:column;gap:12px;}

.kpi-row-card .kpi-text{display:flex;flex-direction:column;gap:3px;}
.kpi-row-card .kpi-row-label{font-size:11.5px;font-weight:700;color:var(--n7);}
.kpi-row-card .kpi-row-value{font-size:20px;font-weight:800;color:var(--n10);letter-spacing:-.4px;}
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.widget-card{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:18px;}
.widget-card h4{margin:0 0 12px;font-size:13px;font-weight:800;color:var(--n8);}

.widget-bar-fill{height:100%;border-radius:4px;background:var(--n5);}
.widget-bar-row.emph .widget-bar-fill{background:var(--m600);}
.retry-reason-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--n8);padding:7px 0;border-bottom:1px solid var(--n3);}
.retry-reason-row:last-child{border-bottom:none;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:20px;box-shadow:0 1px 3px rgba(41,40,39,.06);transition:transform .15s;}
.stat-card:hover{transform:scale(1.015);}
.stat-label{font-size:12.5px;color:var(--n7);font-weight:700;margin-bottom:8px;}
.stat-value{font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--n10);}
.stat-delta{font-size:12.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
.stat-delta.positive{color:var(--s1-text);}
.stat-delta.negative{color:var(--s2-text);}
.stat-sparkline{margin-top:10px;display:block;}

.data-section{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);overflow:hidden;margin-bottom:20px;}
.tab-bar{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--n3);}
.tab{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--n7);border-bottom:2px solid transparent;}
.tab.active{color:var(--m700);border-color:var(--m700);}
.chart-wrap{padding:20px;height:260px;position:relative;}
.data-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--n3);flex-wrap:wrap;}

.data-table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;}

.data-table tr{cursor:pointer;transition:background .12s;}

.badge.warn{background:var(--s3-bg);color:var(--s3-text);}
.badge.fail{background:var(--s2-bg);color:var(--s2-text);}
.badge.neutral{background:var(--n2);color:var(--n7);}

/* content management */
.upload-zone{border:2px dashed var(--n4);border-radius:var(--radius-card);padding:40px;text-align:center;background:var(--n1);margin-bottom:20px;transition:border-color .15s,background .15s;cursor:pointer;}

.storage-row{display:flex;gap:16px;margin-bottom:20px;}
.storage-card{flex:1;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:16px 18px;}
.storage-bar{height:8px;border-radius:4px;background:var(--n3);margin-top:10px;overflow:hidden;}
.storage-fill{height:100%;background:var(--m600);border-radius:4px;}

/* user management */
.detail-panel{background:var(--n0);border-top:1px solid var(--n3);padding:18px 24px;animation:fadeInUp .2s ease;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.detail-block h5{margin:0 0 10px;font-size:12.5px;font-weight:800;color:var(--n6);text-transform:uppercase;}

.locked-cell{color:var(--n5);display:flex;align-items:center;gap:5px;font-size:12.5px;}

.country-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--n3);}

.fail-count{font-size:13px;color:var(--s2-text);font-weight:700;}
.mini-switch{width:36px;height:20px;border-radius:999px;background:var(--n4);position:relative;transition:.2s;flex-shrink:0;}
.mini-switch.on{background:var(--m700);}
.mini-switch-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;}
.mini-switch.on .mini-switch-dot{left:18px;}
.alert-banner{display:flex;gap:12px;align-items:flex-start;background:var(--s3-bg);color:var(--s3-text);border-radius:var(--radius-card);padding:16px;margin-bottom:20px;font-size:13.5px;line-height:1.6;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(41,40,39,.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp .2s ease;}
.modal-box{width:440px;max-width:92vw;background:var(--n1);border-radius:16px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.2);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;font-weight:800;}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--n8);margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 11px;border:1.5px solid var(--n3);border-radius:8px;font-size:13.5px;background:var(--n0);}
.progress-track{height:8px;border-radius:4px;background:var(--n3);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--m600);border-radius:4px;transition:width .3s ease;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn2{flex:1;padding:11px;border-radius:9px;font-weight:700;font-size:13.5px;text-align:center;}
.btn2.ghost{background:var(--n2);}
.btn2.solid{background:var(--m700);color:#fff;}

.toast2{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--n10);color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;z-index:200;animation:toastIn2 .25s ease;}
.ripple-span2{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;animation:ripple2 .5s ease-out;}

@media (max-width:960px){
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .insight-row{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .sidebar{transform:translateX(-100%);}
  .main-wrap{margin-left:0;width:100%;}
}
</style>

const {useState, useEffect, useRef} = React;
const {LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, PieChart, Pie, Cell} = Recharts;

function useLucide(deps){

}

function Sparkline({data, color='var(--m600)', width=100, height=28}){
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1)) * width;
    const y = height - ((v - min) / (max - min || 1)) * height;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} className="stat-sparkline">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function RippleBtn({className, onClick, children, style}){
  const ref = useRef(null);
  const handle = (e) => {
    const btn = ref.current;
    const rect = btn.getBoundingClientRect();
    const span = document.createElement('span');
    span.className = 'ripple-span2';
    span.style.left = (e.clientX - rect.left - 10) + 'px';
    span.style.top = (e.clientY - rect.top - 10) + 'px';
    span.style.width = span.style.height = '20px';
    btn.appendChild(span);
    setTimeout(()=>span.remove(), 500);
    onClick && onClick(e);
  };
  return <button ref={ref} className={className} style={style} onClick={handle}>{children}</button>;
}

function Toast({msg, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2400); return ()=>clearTimeout(t); },[]);
  return <div className="toast2"><i data-lucide="check-circle" style={{width:16,height:16}}></i>{msg}</div>;
}

function UploadModal({onClose, onDone}){
  const [progress, setProgress] = useState(0);
  const [uploading, setUploading] = useState(false);
  useLucide([progress]);
  const start = () => {
    setUploading(true);
    let p = 0;
    const t = setInterval(()=>{
      p += 22;
      setProgress(Math.min(p,100));
      if (p >= 100){ clearInterval(t); setTimeout(onDone, 400); }
    }, 220);
  };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>새 콘텐츠 업로드</h3><button className="modal-close" onClick={onClose}><i data-lucide="x" style={{width:15,height:15}}></i></button></div>
        <div className="field"><label>크리에이터</label><select><option>스튜디오 A</option><option>스튜디오 B</option><option>스튜디오 C</option></select></div>
        <div className="field"><label>파일명</label><input defaultValue="Ryan_greeting.mp4" /></div>
        {uploading && (
          <div className="field">
            <label>업로드 진행률 — {progress}%</label>
            <div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}></div></div>
          </div>
        )}
        <div className="modal-actions">
          <button className="btn2 ghost" onClick={onClose}>취소</button>
          <button className="btn2 solid" onClick={start} disabled={uploading}>{uploading ? '업로드 중…' : '업로드 시작'}</button>
        </div>
      </div>
    </div>
  );
}

          </div>
        </section>

        <section className="data-section">
          <div className="page-meta" style={{padding:'16px 16px 4px'}}>국가별 대체 PG 어댑터 설정</div>
          {Object.keys(adapters).map(c=>(
            <div className="country-row" key={c}>
              <div className="country-name"><i data-lucide="flag" style={{width:15,height:15}}></i> {c}</div>
              <div className="fail-count">{COUNTRY_PAY.find(x=>x.country===c)?.fail || 0}건 실패</div>
              <div className={`mini-switch ${adapters[c]?'on':''}`} onClick={()=>toggle(c)}><div className="mini-switch-dot"></div></div>
            </div>
          ))}
        </section>
      </div>
      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
    </div>
  );
}

function App(){
  const [view, setView] = useState('main');
  return (
    <div data-archetype="stripe-multipane" className="shell">
      <Sidebar view={view} setView={setView} />
      <main className="main-wrap">
        {view === 'main' && <MainView />}
        {view === 'content-management' && <ContentManagementView />}
        {view === 'user-management' && <UserManagementView />}
        {view === 'payment-monitoring' && <PaymentMonitoringView />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
