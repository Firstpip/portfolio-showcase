<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포이야기 — AI 반려동물 동화 스토리북 생성 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 24°, light) ── */
:root{
  --m50:#fbf6f2; --m100:#f7ece5; --m200:#f0dacb; --m300:#e7c3ac; --m400:#dcaa89;
  --m500:#d39267; --m600:#c97a46; --m700:#a56439; --m800:#814e2d; --m900:#5a3720;
  --n0:#ffffff; --n1:#f2f2f3; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#777b86; --n8:#5a5653; --n9:#3a3836; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  /* refero 시드(Steep) 원본 브랜드색 — 출처 기록용, 렌더에는 컬러 역할 토큰(위 --m*)만 사용 */
  --seed-primary:#17191c; --seed-accent:#fbe1d1;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;}
#root{width:100%; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,textarea,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeInUp{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}
@keyframes pulseDot{
  0%,100%{opacity:1; transform:scale(1);}
  50%{opacity:.45; transform:scale(.85);}
}
@keyframes spinSlow{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes toastIn{
  from{opacity:0; transform:translate(-50%,12px);}
  to{opacity:1; transform:translate(-50%,0);}
}

.fade-up{animation:fadeInUp .38s ease both;}
.stagger > *{animation:fadeInUp .42s ease both;}
.stagger > *:nth-child(1){animation-delay:.02s;}
.stagger > *:nth-child(2){animation-delay:.07s;}
.stagger > *:nth-child(3){animation-delay:.12s;}
.stagger > *:nth-child(4){animation-delay:.17s;}
.stagger > *:nth-child(5){animation-delay:.22s;}
.stagger > *:nth-child(6){animation-delay:.27s;}
.stagger > *:nth-child(7){animation-delay:.32s;}
.stagger > *:nth-child(8){animation-delay:.37s;}
.stagger > *:nth-child(9){animation-delay:.42s;}
.stagger > *:nth-child(10){animation-delay:.47s;}

/* topnav-hero 골격 */
.app-shell{width:100%; min-height:100vh; display:flex; flex-direction:column;}
.topnav{width:100%; height:68px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; border-bottom:1px solid var(--n3); background:var(--n0); position:sticky; top:0; z-index:40;}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:18px; letter-spacing:-.3px; color:var(--n9);}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.nav-links{display:flex; align-items:center; gap:4px;}
.nav-link{display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:9999px; font-size:14.5px; font-weight:500; color:var(--n7); transition:background .15s,color .15s;}
.nav-link:hover{background:var(--n1); color:var(--n9);}
.nav-link.active{background:var(--m50); color:var(--m700); font-weight:600;}
.nav-actions{display:flex; align-items:center; gap:8px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:14.5px; font-weight:600;
  border-radius:9999px; padding:10px 20px; transition:transform .12s ease, box-shadow .12s ease, background .15s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--m600); color:#fff;}
.btn-primary:hover{background:var(--m700);}
.btn-ghost{background:transparent; color:var(--n9); border:1px solid var(--n4);}
.btn-ghost:hover{border-color:var(--n9);}
.btn-outline-main{background:transparent; color:var(--m700); border:1px solid var(--m300);}
.btn-outline-main:hover{background:var(--m50);}
.btn-sm{padding:7px 14px; font-size:13.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

main.view{flex:1; width:100%; min-height:0;}

/* hero */
.hero{width:100%; padding:56px 32px 40px; background:linear-gradient(180deg, var(--m50) 0%, var(--n0) 100%); border-bottom:1px solid var(--n2);}
.hero-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:32px;}
.hero-copy{flex:1; min-width:280px;}
.hero-art{width:220px; height:200px; flex-shrink:0;}
@media (max-width:900px){ .hero-art{display:none;} }
.hero-eyebrow{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--n8); background:var(--n0); border:1px solid var(--n3); padding:6px 12px; border-radius:9999px; margin-bottom:18px;}
.hero-title{font-size:46px; font-weight:700; letter-spacing:-1.2px; line-height:1.22; color:var(--n10); max-width:680px;}
.hero-sub{margin-top:14px; font-size:16px; color:var(--n7); line-height:1.6; max-width:560px;}

/* wizard */
.wizard-wrap{max-width:1180px; margin:0 auto; padding:36px 32px 80px; display:grid; grid-template-columns:1fr 320px; gap:28px;}
.stepper{display:flex; align-items:center; gap:0; margin-bottom:28px; grid-column:1/-1;}
.step-pill{display:flex; align-items:center; gap:10px; padding:10px 16px 10px 10px; border-radius:9999px; background:var(--n1); flex-shrink:0;}
.step-pill.active{background:var(--m50);}
.step-pill.done{background:var(--n1);}
.step-num{width:26px; height:26px; border-radius:50%; background:var(--n4); color:var(--n0); font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.step-pill.active .step-num{background:var(--m600);}
.step-pill.done .step-num{background:var(--n9);}
.step-label{font-size:13.5px; font-weight:600; color:var(--n6); white-space:nowrap;}
.step-pill.active .step-label{color:var(--m700);}
.step-pill.done .step-label{color:var(--n9);}
.step-line{flex:1; height:2px; background:var(--n3); margin:0 6px; min-width:16px;}
.step-line.done{background:var(--n9);}

.step-body{background:var(--n0); border:1px solid var(--n3); border-radius:14px; padding:32px;}
.field-group{margin-bottom:22px;}
.field-label{display:block; font-size:13.5px; font-weight:600; color:var(--n8); margin-bottom:8px;}
.field-label .req{color:var(--s2); margin-left:2px;}
.field-input, .field-textarea, .field-select{width:100%; border:1px solid var(--n4); border-radius:10px; padding:12px 14px; font-size:14.5px; color:var(--n9); background:var(--n0); transition:border-color .15s;}
.field-input:focus, .field-textarea:focus, .field-select:focus{outline:none; border-color:var(--m500); box-shadow:0 0 0 3px var(--m100);}
.field-textarea{resize:vertical; min-height:120px; line-height:1.6;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.field-error{font-size:12.5px; color:var(--s2-text); margin-top:6px; display:flex; align-items:center; gap:4px;}
.step-actions{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:22px; border-top:1px solid var(--n2);}

.photo-drop{border:1.5px dashed var(--n4); border-radius:12px; padding:28px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;}
.photo-drop:hover{border-color:var(--m400); background:var(--m50);}
.photo-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:16px;}
.photo-tile{aspect-ratio:1; border-radius:10px; background:var(--n1); display:flex; align-items:center; justify-content:center; position:relative; border:1px solid var(--n3);}
.photo-tile .rm{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:var(--n9); color:#fff; display:flex; align-items:center; justify-content:center;}
.photo-count{font-size:13px; color:var(--n6); margin-top:10px;}

.summary-side{background:var(--n1); border-radius:14px; padding:24px; align-self:start; position:sticky; top:88px;}
.summary-title{font-size:14px; font-weight:700; color:var(--n9); margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--n3); font-size:13.5px;}
.summary-row:last-of-type{border-bottom:none;}
.summary-label{color:var(--n7);}
.summary-val{color:var(--n9); font-weight:600; max-width:150px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tip-box{margin-top:18px; padding:14px; border-radius:10px; background:var(--n0); border:1px solid var(--n3);}
.tip-box p{font-size:12.5px; color:var(--n7); line-height:1.55;}

.review-block{border:1px solid var(--n3); border-radius:12px; padding:18px 20px; margin-bottom:14px;}
.review-block h4{font-size:13.5px; color:var(--n6); font-weight:600; margin-bottom:8px;}
.review-block p{font-size:14.5px; color:var(--n9); line-height:1.6;}

/* generation view */
.gen-wrap{max-width:1180px; margin:0 auto; padding:40px 32px 80px;}
.gen-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.gen-head h2{font-size:24px; font-weight:700; color:var(--n10); letter-spacing:-.4px;}
.progress-track{width:100%; height:10px; border-radius:9999px; background:var(--n2); overflow:hidden; margin:20px 0 8px;}
.progress-fill{height:100%; border-radius:9999px; background:var(--m600); transition:width .5s ease;}
.progress-meta{display:flex; justify-content:space-between; font-size:13px; color:var(--n7);}
.stage-row{display:flex; gap:10px; margin:24px 0 30px; flex-wrap:wrap;}
.stage-chip{display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9999px; background:var(--n1); font-size:13px; font-weight:600; color:var(--n7);}
.stage-chip.active{background:var(--m50); color:var(--m700);}
.stage-chip.complete{background:var(--n1); color:var(--n9);}
.stage-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--n5);}
.stage-chip.active .dot{background:var(--m600); animation:pulseDot 1.1s ease-in-out infinite;}
.stage-chip.complete .dot{background:var(--n9);}

.page-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:16px;}
.page-card{border:1px solid var(--n3); border-radius:12px; overflow:hidden; background:var(--n0); transition:box-shadow .15s, transform .15s;}
.page-card:hover{transform:translateY(-3px); box-shadow:0 8px 22px rgba(32,30,30,.08);}
.page-thumb{aspect-ratio:1; background:var(--n1); display:flex; align-items:center; justify-content:center; position:relative;}
.page-thumb .spin-icon{animation:spinSlow 1.4s linear infinite;}
.page-idx{position:absolute; top:8px; left:8px; font-size:11px; font-weight:700; color:var(--n6); background:var(--n0); border-radius:6px; padding:2px 6px;}
.page-meta{padding:10px 12px;}
.page-title{font-size:12.5px; font-weight:600; color:var(--n9); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.status-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:9999px;}
.status-done{background:var(--s1-bg); color:var(--s1-text);}
.status-generating{background:var(--m50); color:var(--m700);}
.status-queued{background:var(--n1); color:var(--n7);}
.status-failed{background:var(--s2-bg); color:var(--s2-text);}
.retry-btn{margin-top:8px; font-size:11.5px; font-weight:700; color:var(--s2-text); display:flex; align-items:center; gap:4px;}
.gen-footer{display:flex; justify-content:flex-end; margin-top:32px;}

/* preview view */
.preview-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
.compare-tray{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--n7);}
.thumb-select{position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--n4); background:var(--n0); display:flex; align-items:center; justify-content:center;}
.thumb-select.checked{background:var(--m600); border-color:var(--m600); color:#fff;}
.page-card.selected{outline:2px solid var(--m600); outline-offset:2px;}

/* download view */
.dl-wrap{max-width:900px; margin:0 auto; padding:40px 32px 80px;}
.dl-card{border:1px solid var(--n3); border-radius:14px; padding:28px; margin-bottom:20px;}
.dl-card h3{font-size:15px; font-weight:700; color:var(--n9); margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.preset-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.preset-tile{border:1.5px solid var(--n3); border-radius:10px; padding:16px; text-align:center; transition:border-color .15s;}
.preset-tile.active{border-color:var(--m600); background:var(--m50);}
.preset-tile strong{display:block; font-size:14px; color:var(--n9); margin-bottom:4px;}
.preset-tile span{font-size:12px; color:var(--n6);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--n2);}
.toggle-row:last-child{border-bottom:none;}
.toggle{width:40px; height:22px; border-radius:9999px; background:var(--n4); position:relative; transition:background .15s; flex-shrink:0;}
.toggle.on{background:var(--m600);}
.toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s;}
.toggle.on .knob{transform:translateX(18px);}
.dl-summary-row{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px; color:var(--n7);}
.dl-summary-row b{color:var(--n9);}
.dl-cta{margin-top:24px;}

/* library */
.lib-wrap{max-width:1180px; margin:0 auto; padding:40px 32px 80px;}
.lib-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:24px;}
.lib-card{border:1px solid var(--n3); border-radius:14px; overflow:hidden; transition:transform .15s, box-shadow .15s;}
.lib-card:hover{transform:translateY(-4px); box-shadow:0 10px 26px rgba(32,30,30,.09);}
.lib-cover{aspect-ratio:4/3; background:var(--m50); display:flex; align-items:center; justify-content:center; color:var(--m600);}
.lib-info{padding:14px 16px;}
.lib-info h4{font-size:14.5px; font-weight:700; color:var(--n9); margin-bottom:4px;}
.lib-info p{font-size:12px; color:var(--n6);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(32,30,30,.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--n0); border-radius:16px; padding:28px; max-width:420px; width:100%; animation:fadeInUp .25s ease;}
.modal-box.wide{max-width:640px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-head h3{font-size:17px; font-weight:700; color:var(--n9);}
.modal-close{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n6);}
.modal-close:hover{background:var(--n1);}

.compare-pair{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.compare-pair .art{aspect-ratio:1; background:var(--n1); border-radius:10px; display:flex; align-items:center; justify-content:center;}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--n10); color:#fff; padding:13px 22px; border-radius:9999px;
  font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:200; animation:toastIn .28s ease both; box-shadow:0 12px 30px rgba(0,0,0,.22);}

.empty-note{font-size:12.5px; color:var(--n6); text-align:center; padding:20px;}

@media (max-width:900px){
  .wizard-wrap{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .page-grid{grid-template-columns:repeat(3,1fr);}
  .preset-grid{grid-template-columns:1fr;}
  .lib-grid{grid-template-columns:repeat(2,1fr);}
  .nav-links{display:none;}
}
@media (max-width:480px){
  .hero{padding:40px 18px 28px;}
  .hero-title{font-size:32px;}
  .wizard-wrap{padding:24px 18px 60px;}
  .step-body{padding:20px;}
  .stepper{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
  .step-pill{padding:8px 10px 8px 8px; flex-shrink:0;}
  .step-pill .step-label{display:none;}
  .step-line{min-width:10px;}
  .photo-grid{grid-template-columns:repeat(3,1fr);}
  .page-grid{grid-template-columns:repeat(2,1fr);}
  .lib-grid{grid-template-columns:1fr;}
  .compare-pair{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── 인라인 SVG 아이콘 세트 (CDN 의존 없음 — P1 전용, P2는 Phosphor 웹폰트) ── */
function Sparkles({ size = 18, color, strokeWidth = 1.6, style, className }) {

  </svg>);
}
function BookOpen({ size = 18, color, strokeWidth = 1.7, style, className }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || 'currentColor'} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
    <path d="M12 6.2C10 4.6 7 4 4 5v13c3-1 6-.4 8 1.2 2-1.6 5-2.2 8-1.2V5c-3-1-6-.4-8 1.2z" />
    <path d="M12 6.2V19.2" />
  </svg>);
}
function Images({ size = 18, color, strokeWidth = 1.7, style, className }) {

    <rect x="3" y="6" width="14" height="13" rx="2" />
    <path d="M7 15l3-3 3 3 2-2 3 3" />
    <circle cx="8" cy="10.2" r="1.2" />
    <path d="M8 4h10a2 2 0 0 1 2 2v10" />
  </svg>);
}
function Download({ size = 18, color, strokeWidth = 1.7, style, className }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || 'currentColor'} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
    <path d="M12 3v11" /><path d="M7.5 10.5L12 15l4.5-4.5" /><path d="M5 20h14" />
  </svg>);
}
function LibraryBig({ size = 18, color, strokeWidth = 1.7, style, className }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || 'currentColor'} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
    <rect x="4" y="9" width="4" height="11" rx="1" /><rect x="10" y="5" width="4" height="15" rx="1" /><rect x="16" y="12" width="4" height="8" rx="1" />
  </svg>);
}

      return;

    if (step === 2 && formData.story.trim().length < 10) {
      setError('에피소드·사연을 10자 이상 입력해야 합니다.');
      return;

      return;

function GenerationView({ pages, setPages, onGoPreview }) {
  const timerRef = useRef(null);
  useEffect(() => {
    timerRef.current = setInterval(() => {
      setPages(prev => {
        const idx = prev.findIndex(p => p.status === 'queued' || p.status === 'generating');
        if (idx === -1) { clearInterval(timerRef.current); return prev; }
        const copy = [...prev];
        if (copy[idx].status === 'queued') {
          copy[idx] = { ...copy[idx], status: 'generating' };
        } else {
          const fail = copy[idx].id === 7;
          copy[idx] = { ...copy[idx], status: fail ? 'failed' : 'done' };
        }
        return copy;
      });
    }, 850);
    return () => clearInterval(timerRef.current);
  }, []);

  function retry(id) {
    setPages(prev => prev.map(p => p.id === id ? { ...p, status: 'generating' } : p));
    setTimeout(() => {
      setPages(prev => prev.map(p => p.id === id ? { ...p, status: 'done' } : p));
    }, 1200);
  }

  const done = pages.filter(p => p.status === 'done').length;
  const pct = Math.round((done / pages.length) * 100);
  const anyGenerating = pages.some(p => p.status === 'generating' || p.status === 'queued');

  return (
    <div className="gen-wrap fade-up">
      <div className="gen-head">
        <h2>AI 스토리·삽화 자동 생성</h2>
        <span style={{ fontSize: 13, color: 'var(--n7)' }}>선택 AI: OpenAI GPT 이미지 생성</span>
      </div>
      <div className="progress-track"><div className="progress-fill" style={{ width: pct + '%' }} /></div>
      <div className="progress-meta"><span>{done} / {pages.length} 페이지 완료</span><span>{pct}%</span></div>
      <div className="stage-row">
        <div className="stage-chip complete"><span className="dot" />텍스트 생성</div>
        <div className={`stage-chip ${anyGenerating ? 'active' : 'complete'}`}><span className="dot" />삽화 생성</div>
        <div className={`stage-chip ${!anyGenerating ? 'active' : ''}`}><span className="dot" />페이지 조판</div>
      </div>
      <div className="page-grid stagger">
        {pages.map((p, i) => (
          <div className="page-card" key={p.id}>
            <div className="page-thumb">
              <span className="page-idx">{i + 1}</span>
              {p.status === 'generating' && <Icon icon={Loader2} size={22} color="var(--m600)" className="spin-icon" />}
              {p.status === 'done' && <Icon icon={Dog} size={26} color="var(--n6)" />}
              {p.status === 'queued' && <Icon icon={Dog} size={22} color="var(--n4)" />}
              {p.status === 'failed' && <Icon icon={X} size={22} color="var(--s2)" />}
            </div>
            <div className="page-meta">
              <div className="page-title">{p.title}</div>
              <span className={`status-badge status-${p.status}`}>
                {{ done: '완료', generating: '생성 중', queued: '대기', failed: '실패' }[p.status]}
              </span>
              {p.status === 'failed' && (
                <div className="retry-btn" onClick={() => retry(p.id)}>
                  <Icon icon={RefreshCw} size={12} /> 이 페이지만 재시도
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
      <div className="gen-footer">
        <button className="btn btn-primary" onClick={onGoPreview}>
          미리보기로 이동 <Icon icon={ChevronRight} size={15} />
        </button>
      </div>
    </div>
  );
}

function PreviewView({ pages, onOpenDetail }) {
  const [selected, setSelected] = useState([]);
  const [showCompare, setShowCompare] = useState(false);

  function toggleSelect(id) {
    setSelected(s => s.includes(id) ? s.filter(x => x !== id) : s.length < 2 ? [...s, id] : [s[1], id]);
  }

  return (
    <div className="gen-wrap fade-up">
      <div className="preview-toolbar">
        <h2 style={{ fontSize: 24, fontWeight: 700, color: 'var(--n10)', letterSpacing: '-.4px' }}>캐릭터 일관성 검증 미리보기</h2>
        <div className="compare-tray">
          <span>{selected.length}/2 페이지 선택됨</span>
          <button className="btn btn-outline-main btn-sm" disabled={selected.length !== 2} onClick={() => setShowCompare(true)}>
            <Icon icon={ScanLine} size={14} /> 나란히 비교
          </button>
        </div>
      </div>
      <div className="page-grid stagger">
        {pages.map((p, i) => (
          <div className={`page-card ${selected.includes(p.id) ? 'selected' : ''}`} key={p.id} style={{ position: 'relative' }}>
            <div className="page-thumb" onClick={() => onOpenDetail(p)}>
              <span className="page-idx">{i + 1}</span>
              <Icon icon={Dog} size={26} color="var(--n6)" />
              <div className={`thumb-select ${selected.includes(p.id) ? 'checked' : ''}`}
                onClick={e => { e.stopPropagation(); toggleSelect(p.id); }}>
                {selected.includes(p.id) && <Icon icon={Check} size={12} />}
              </div>
            </div>
            <div className="page-meta">
              <div className="page-title">{p.title}</div>
              <span className={`status-badge status-${p.status === 'failed' ? 'failed' : 'done'}`}>
                {p.status === 'failed' ? '재생성 필요' : '검수 완료'}
              </span>
            </div>
          </div>
        ))}
      </div>
      {showCompare && (
        <ComparePreviewModal pages={pages.filter(p => selected.includes(p.id))} onClose={() => setShowCompare(false)} />
      )}
    </div>
  );
}

function DownloadView({ onDownload }) {
  const [preset, setPreset] = useState('square');
  const [bleed, setBleed] = useState(true);
  const [safeArea, setSafeArea] = useState(true);
  const [loading, setLoading] = useState(false);

  function handleDownload() {
    setLoading(true);
    setTimeout(() => { setLoading(false); onDownload(); }, 1500);
  }

  return (
    <div className="dl-wrap fade-up">
      <div className="dl-card">
        <h3><Icon icon={Ruler} size={16} color="var(--m600)" /> 인쇄 판형 선택</h3>
        <div className="preset-grid">
          {[
            { id: 'square', name: '정방형 210×210mm', desc: '표준 그림책 판형' },
            { id: 'a5', name: 'A5 148×210mm', desc: '보급형 문고판' },
            { id: 'square-l', name: '대형 220×220mm', desc: '프리미엄 판형' },
          ].map(p => (
            <div key={p.id} className={`preset-tile ${preset === p.id ? 'active' : ''}`} onClick={() => setPreset(p.id)}>
              <strong>{p.name}</strong>
              <span>{p.desc}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="dl-card">
        <h3><Icon icon={Layers} size={16} color="var(--m600)" /> 출판 품질 옵션</h3>
        <div className="toggle-row">
          <span style={{ fontSize: 14, color: 'var(--n9)' }}>재단선(Bleed) 표시</span>
          <div className={`toggle ${bleed ? 'on' : ''}`} onClick={() => setBleed(v => !v)}><span className="knob" /></div>
        </div>
        <div className="toggle-row">
          <span style={{ fontSize: 14, color: 'var(--n9)' }}>안전 여백 가이드</span>
          <div className={`toggle ${safeArea ? 'on' : ''}`} onClick={() => setSafeArea(v => !v)}><span className="knob" /></div>
        </div>
      </div>
      <div className="dl-card">
        <h3><Icon icon={FileCheck2} size={16} color="var(--m600)" /> 최종 산출 요약</h3>
        <div className="dl-summary-row"><span>해상도</span><b>약 300DPI</b></div>
        <div className="dl-summary-row"><span>전체 페이지</span><b>10페이지 (표지 포함)</b></div>
        <div className="dl-summary-row"><span>색상 모드</span><b>RGB (인쇄소 CMYK 변환 별도 협의)</b></div>
        <div className="dl-cta">
          <button className="btn btn-primary btn-block" onClick={handleDownload} disabled={loading}>
            {loading ? <><Icon icon={Loader2} size={16} className="spin-icon" /> PDF 생성 중…</> : <><Icon icon={Download} size={16} /> PDF 다운로드</>}
          </button>
        </div>
      </div>
    </div>
  );
}

function LibraryView({ onNew }) {
  return (
    <div className="lib-wrap fade-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: 'var(--n10)', letterSpacing: '-.4px' }}>보관함</h2>
        <button className="btn btn-primary btn-sm" onClick={onNew}><Icon icon={Sparkles} size={14} /> 새 스토리북 만들기</button>
      </div>
      <div className="lib-grid">
        {LIBRARY_ITEMS.map(item => (
          <div className="lib-card" key={item.id}>
            <div className="lib-cover"><Icon icon={BookOpen} size={38} /></div>
            <div className="lib-info">
              <h4>{item.name}</h4>
              <p>{item.date} · {item.pages}페이지</p>
              <span className="status-badge status-done" style={{ marginTop: 8 }}>{item.status}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [step, setStep] = useState(1);
  const [formData, setFormData] = useState({ petName: '', species: '', appearance: '', contact: '', story: '', notes: '', photos: [] });
  const [pages, setPages] = useState(makePages());
  const [showLogin, setShowLogin] = useState(false);
  const [detailPage, setDetailPage] = useState(null);
  const [toast, setToast] = useState(null);

  function startGeneration() {
    setPages(makePages());
    setView('generation');
  }

  function regeneratePage(id) {
    setPages(prev => prev.map(p => p.id === id ? { ...p, status: 'generating' } : p));
    setTimeout(() => {
      setPages(prev => prev.map(p => p.id === id ? { ...p, status: 'done' } : p));
      setToast('페이지 재생성 요청이 완료되었습니다.');
    }, 1300);
  }

  return (
    <div className="app-shell" style={{ width: '100%' }}>
      <header className="topnav">
        <div className="brand" onClick={() => setView('main')} style={{ cursor: 'pointer' }}>
          <span className="brand-mark"><Icon icon={BookOpen} size={17} /></span>
          포이야기
        </div>
        <nav className="nav-links">
          {NAV_ITEMS.map(item => (
            <button key={item.key} className={`nav-link ${view === item.key ? 'active' : ''}`} onClick={() => setView(item.key)}>
              <Icon icon={item.icon} size={15} /><span>{item.label}</span>
            </button>
          ))}
        </nav>
        <div className="nav-actions">
          <button className="btn btn-ghost btn-sm" onClick={() => setShowLogin(true)}>로그인</button>
          <button className="btn btn-primary btn-sm" onClick={() => { setView('main'); setStep(1); }}>무료로 시작하기</button>
        </div>
      </header>

      {view === 'main' && (
        <main className="view">
          <div className="hero">
            <div className="hero-inner">
              <div className="hero-copy">
                <span className="hero-eyebrow"><Icon icon={Sparkles} size={13} /> PoC — AI 동화 스토리북 생성</span>
                <h1 className="hero-title">사진 몇 장과 사연 한 줄로,<br />반려동물만의 동화책을 만듭니다</h1>
                <p className="hero-sub">보호자가 입력한 사진과 이야기를 바탕으로 AI가 동화형 스토리와 삽화를 자동 생성하고, 출판 가능한 300DPI PDF 스토리북으로 완성합니다.</p>
              </div>
              <svg className="hero-art" viewBox="0 0 220 200" fill="none" aria-hidden="true">
                <path d="M20 150c0-60 30-95 90-95s90 35 90 95" stroke="var(--n3)" strokeWidth="1.4" strokeDasharray="3 6" />
                <g>
                  <path d="M40 150V70c22-8 40-8 60 2V158c-20-9-38-9-60-8z" fill="var(--n0)" stroke="var(--n4)" strokeWidth="1.6" />
                  <path d="M180 150V70c-22-8-40-8-60 2V158c20-9 38-9 60-8z" fill="var(--n0)" stroke="var(--n4)" strokeWidth="1.6" />
                  <path d="M100 72v88" stroke="var(--n4)" strokeWidth="1.6" />
                  <path d="M52 88h34M52 102h30M52 116h34" stroke="var(--n3)" strokeWidth="2" strokeLinecap="round" />
                  <path d="M134 88h34M138 102h30M134 116h34" stroke="var(--n3)" strokeWidth="2" strokeLinecap="round" />
                </g>
                <g transform="translate(70,18)">
                  <path d="M8 26L24 8l7 15" stroke="var(--m400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                  <path d="M58 26L42 8l-7 15" stroke="var(--m400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                  <circle cx="33" cy="30" r="22" fill="var(--m100)" stroke="var(--m400)" strokeWidth="2" />
                  <circle cx="26" cy="27" r="2.2" fill="var(--m700)" />
                  <circle cx="40" cy="27" r="2.2" fill="var(--m700)" />
                  <path d="M27 36c3.5 3 8.5 3 12 0" stroke="var(--m700)" strokeWidth="2" strokeLinecap="round" fill="none" />
                </g>
                <g style={{ animation: 'pulseDot 2.4s ease-in-out infinite' }}>
                  <path d="M182 44l2.4 6.8L191 53l-6.6 2.4L182 62l-2.4-6.6L173 53l6.6-2.2L182 44z" fill="var(--m500)" />
                </g>
              </svg>
            </div>
          </div>
          <MainWizard formData={formData} setFormData={setFormData} step={step} setStep={setStep} onStartGeneration={startGeneration} />
        </main>
      )}

      {view === 'generation' && (
        <main className="view">
          <GenerationView pages={pages} setPages={setPages} onGoPreview={() => setView('preview')} />
        </main>
      )}

      {view === 'preview' && (
        <main className="view">
          <PreviewView pages={pages} onOpenDetail={setDetailPage} />
        </main>
      )}

      {view === 'download' && (
        <main className="view">
          <DownloadView onDownload={() => setToast('PDF 다운로드가 완료되었습니다.')} />
        </main>
      )}

      {view === 'library' && (
        <main className="view">
          <LibraryView onNew={() => { setView('main'); setStep(1); }} />
        </main>
      )}

      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onSuccess={() => { setShowLogin(false); setToast('환영합니다, 보호자님.'); }} />}
      {detailPage && <PageDetailModal page={detailPage} onClose={() => setDetailPage(null)} onRegenerate={regeneratePage} />}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
