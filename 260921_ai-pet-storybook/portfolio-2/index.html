<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포이야기 운영 콘솔 — 스토리북 통합 운영 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 89°, light) ── */
:root{
  --m50:#eff1ed; --m100:#eff1ed; --m200:#eff1ed; --m300:#dfe2db; --m400:#bfc6b8;
  --m500:#98a38c; --m600:#6c7c5c; --m700:#43582e; --m800:#1a3300; --m900:#152a00;
  --n0:#fcfaf5; --n1:#f1f1f1; --n2:#f0f0ef; --n3:#e6e6e5; --n4:#d6d7d5;
  --n5:#b8bab5; --n6:#949890; --n7:#757a71; --n8:#575a53; --n9:#383a36; --n10:#1f201e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; min-height:100vh;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased; font-size:13.5px;}
#root{width:100%; min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,textarea,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes rowIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
@keyframes pulseRing{ 0%{box-shadow:0 0 0 0 var(--m300);} 70%{box-shadow:0 0 0 6px rgba(0,0,0,0);} 100%{box-shadow:0 0 0 0 rgba(0,0,0,0);} }
@keyframes spinSlow{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes slideDown{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

.fade-up{animation:fadeInUp .3s ease both;}
.stagger-rows > *{animation:rowIn .32s ease both;}
.stagger-rows > *:nth-child(1){animation-delay:.01s;} .stagger-rows > *:nth-child(2){animation-delay:.04s;}
.stagger-rows > *:nth-child(3){animation-delay:.07s;} .stagger-rows > *:nth-child(4){animation-delay:.10s;}
.stagger-rows > *:nth-child(5){animation-delay:.13s;} .stagger-rows > *:nth-child(6){animation-delay:.16s;}
.stagger-rows > *:nth-child(7){animation-delay:.19s;} .stagger-rows > *:nth-child(8){animation-delay:.22s;}

/* sidebar-classic 골격 */
.app-shell{display:flex; width:100%; min-height:100vh;}
.sidebar{position:fixed; left:0; top:0; bottom:0; width:224px; background:linear-gradient(190deg, var(--n10) 0%, #262822 100%); display:flex; flex-direction:column; z-index:50;}
.sb-brand{display:flex; align-items:center; gap:9px; padding:20px 18px; font-weight:700; font-size:15.5px; color:#fff; border-bottom:1px solid rgba(255,255,255,.08);}
.sb-brand .mark{width:28px; height:28px; border-radius:8px; background:var(--m600); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sb-nav{flex:1; padding:14px 10px; overflow-y:auto;}
.sb-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,.62); font-size:13.5px; font-weight:500; margin-bottom:2px; transition:background .15s,color .15s; width:100%; text-align:left;}
.sb-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-item.active{background:var(--m700); color:#fff;}
.sb-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px;}
.sb-avatar{width:30px; height:30px; border-radius:8px; background:var(--n8); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.sb-foot-name{color:#fff; font-size:12.5px; font-weight:600;}
.sb-foot-role{color:rgba(255,255,255,.5); font-size:11px;}

.main-wrap{margin-left:224px; flex:1; min-width:0; width:calc(100% - 224px); display:flex; flex-direction:column; min-height:100vh;}
.topbar{height:56px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--n3); background:var(--n0); position:sticky; top:0; z-index:30;}
.crumb{font-size:13px; color:var(--n7); display:flex; align-items:center; gap:6px;}
.crumb b{color:var(--n9); font-weight:700;}
.topbar-actions{display:flex; align-items:center; gap:10px;}

.content{flex:1; padding:22px 24px; min-width:0;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:600; border-radius:6px; padding:8px 14px; transition:transform .1s, background .15s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--m700); color:#fff;}
.btn-primary:hover{background:var(--m800);}
.btn-ghost{background:transparent; color:var(--n8); border:1px solid var(--n4);}
.btn-ghost:hover{border-color:var(--n8);}
.btn-danger{background:transparent; color:var(--s2-text); border:1px solid var(--s2);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.icon-btn{width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--n7);}
.icon-btn:hover{background:var(--n1);}

.page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.page-head h1{font-size:19px; font-weight:700; color:var(--n10); letter-spacing:-.3px;}
.page-head p{font-size:12.5px; color:var(--n7); margin-top:4px;}
.hero-greet{font-size:46px; font-weight:800; letter-spacing:.4px; color:var(--n10); line-height:1.15; margin-bottom:4px;}
.hero-greet-sub{font-size:13px; color:var(--n7); margin-bottom:20px;}

/* master-detail */
.md-shell{display:flex; gap:16px; height:calc(100vh - 56px - 44px); min-height:520px;}
.list-rail{width:300px; flex-shrink:0; border:1px solid var(--n3); border-radius:10px; background:var(--n0); display:flex; flex-direction:column; overflow:hidden;}
.rail-search{padding:12px; border-bottom:1px solid var(--n2);}
.rail-search input{width:100%; padding:8px 10px; border:1px solid var(--n3); border-radius:6px; font-size:12.5px;}
.rail-list{flex:1; overflow-y:auto;}
.rail-item{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--n2); transition:background .12s; width:100%; text-align:left;}
.rail-item:hover{background:var(--n1);}
.rail-item.active{background:var(--m50); box-shadow:inset 3px 0 0 var(--m700);}
.rail-avatar{width:30px; height:30px; border-radius:8px; background:var(--n2); color:var(--n7); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rail-txt{min-width:0; flex:1;}
.rail-name{font-size:13px; font-weight:600; color:var(--n9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rail-sub{font-size:11px; color:var(--n6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.detail-panel{flex:1; min-width:0; border:1px solid var(--n3); border-radius:10px; background:var(--n0); overflow-y:auto; padding:22px;}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:16px; border-bottom:1px solid var(--n2); margin-bottom:16px;}
.detail-title{font-size:16.5px; font-weight:700; color:var(--n10);}
.detail-sub{font-size:12px; color:var(--n7); margin-top:3px;}
.summary-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
.sm-card{border:1px solid var(--n3); border-radius:8px; padding:12px;}
.sm-card .lbl{font-size:11px; color:var(--n6); margin-bottom:6px;}
.sm-card .val{font-size:15px; font-weight:700; color:var(--n9);}
.section-title{font-size:12.5px; font-weight:700; color:var(--n8); margin:20px 0 10px; display:flex; align-items:center; gap:6px;}
.gallery-row{display:flex; gap:8px; flex-wrap:wrap;}
.gallery-tile{width:56px; height:56px; border-radius:8px; background:var(--n1); display:flex; align-items:center; justify-content:center; color:var(--n6); flex-shrink:0;}
.history-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.history-table th{text-align:left; padding:8px 10px; color:var(--n6); font-weight:600; border-bottom:1px solid var(--n3); font-size:11.5px;}
.history-table td{padding:9px 10px; border-bottom:1px solid var(--n2); color:var(--n9);}
.history-table tr:hover td{background:var(--n1);}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px;}
.badge-neutral{background:var(--n1); color:var(--n7);}
.badge-success{background:var(--s1-bg); color:var(--s1-text);}
.badge-danger{background:var(--s2-bg); color:var(--s2-text);}
.badge-warn{background:var(--s3-bg); color:var(--s3-text);}

/* review */
.review-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.bulk-tray{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--n7);}
.review-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px;}
.rv-card{border:1px solid var(--n3); border-radius:8px; overflow:hidden; position:relative; background:var(--n0);}
.rv-thumb{aspect-ratio:1; background:var(--n1); display:flex; align-items:center; justify-content:center; position:relative;}
.rv-check{position:absolute; top:6px; left:6px; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--n4); background:var(--n0); display:flex; align-items:center; justify-content:center;}
.rv-check.checked{background:var(--m700); border-color:var(--m700); color:#fff;}
.rv-meta{padding:8px;}
.rv-name{font-size:11px; font-weight:600; color:var(--n9); margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* print-settings */
.preset-list{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.pr-card{border:1px solid var(--n3); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.pr-card h3{font-size:14px; font-weight:700; color:var(--n9); margin-bottom:8px;}
.pr-row{display:flex; justify-content:space-between; font-size:12px; color:var(--n7); padding:4px 0;}
.pr-actions{display:flex; gap:6px; margin-top:12px;}
.pr-card.new{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; border:1.5px dashed var(--n4); color:var(--n6); min-height:140px;}
.pr-card.new:hover{border-color:var(--m600); color:var(--m700);}

/* monitoring */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.kpi-card{border:1px solid var(--n3); border-radius:10px; padding:14px;}
.kpi-card .lbl{font-size:11.5px; color:var(--n6); margin-bottom:8px; display:flex; align-items:center; gap:5px;}
.kpi-card .val{font-size:22px; font-weight:700; color:var(--n9);}
.kpi-card .delta{font-size:11px; margin-top:4px; display:flex; align-items:center; gap:3px;}
.delta.up{color:var(--s1-text);} .delta.down{color:var(--s2-text);}
.chart-row{display:grid; grid-template-columns:2fr 1fr; gap:14px;}
.chart-card{border:1px solid var(--n3); border-radius:10px; padding:16px;}
.chart-card h3{font-size:13px; font-weight:700; color:var(--n9); margin-bottom:12px;}
.chart-wrap{position:relative; height:230px;}
.range-toggle{display:flex; gap:4px; background:var(--n1); padding:3px; border-radius:7px;}
.range-toggle button{padding:5px 10px; border-radius:5px; font-size:11.5px; font-weight:600; color:var(--n7);}
.range-toggle button.active{background:var(--n0); color:var(--n9); box-shadow:0 1px 2px rgba(0,0,0,.08);}
.reason-list{list-style:none; margin-top:8px;}
.reason-list li{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--n2); font-size:12px; color:var(--n8);}
.reason-list li:last-child{border-bottom:none;}

/* permissions */
.perm-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.perm-table th{text-align:left; padding:10px; color:var(--n6); border-bottom:1px solid var(--n3); font-size:11.5px;}
.perm-table td{padding:12px 10px; border-bottom:1px solid var(--n2);}
.toggle{width:36px; height:20px; border-radius:9999px; background:var(--n4); position:relative; transition:background .15s; display:inline-block;}
.toggle.on{background:var(--m700);}
.toggle .knob{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s;}
.toggle.on .knob{transform:translateX(16px);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(31,32,30,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--n0); border-radius:12px; padding:24px; max-width:420px; width:100%; animation:fadeInUp .22s ease; box-shadow:0 12px 34px rgba(0,0,0,.16);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h3{font-size:15.5px; font-weight:700; color:var(--n9);}
.field-group{margin-bottom:14px;}
.field-label{display:block; font-size:12px; font-weight:600; color:var(--n8); margin-bottom:6px;}
.field-input{width:100%; border:1px solid var(--n4); border-radius:7px; padding:9px 11px; font-size:13px;}
.field-input:focus{outline:none; border-color:var(--m600);}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--n10); color:#fff; padding:11px 20px; border-radius:8px;
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; z-index:200; animation:slideDown .25s ease both; box-shadow:0 10px 26px rgba(0,0,0,.22);}

.empty-state{text-align:center; padding:60px 20px; color:var(--n6); font-size:12.5px;}

@media (max-width:1000px){
  .md-shell{flex-direction:column; height:auto;}
  .list-rail{width:100%;}
  .summary-cards, .kpi-row{grid-template-columns:repeat(2,1fr);}
  .chart-row, .preset-list, .review-grid{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main-wrap{margin-left:0; width:100%;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
  PieChart, Pie, Cell,
} = Recharts;

const M600 = '#6c7c5c', M700 = '#43582e', N4 = '#d6d7d5', N6 = '#949890', S2 = '#cf3f3f';

const NAV_ITEMS = [
  { key: 'main', label: '고객 관리', icon: 'ph-users-three' },
  { key: 'review', label: '생성 이력 검수', icon: 'ph-magnifying-glass' },
  { key: 'print-settings', label: '출력 설정', icon: 'ph-ruler' },
  { key: 'monitoring', label: '이용 현황', icon: 'ph-chart-line-up' },
  { key: 'permissions', label: '권한 관리', icon: 'ph-shield-check' },
];

const CUSTOMERS = [
  { id: 1, name: '김민수', pet: '몽이 (말티즈)', phone: '010-2231-9087', pages: 12, status: '완료', photos: 8, story: '3년 전 유기견 보호소에서 처음 만난 몽이와의 이야기를 담고 싶어요.' },
  { id: 2, name: '이지은', pet: '보리 (믹스견)', phone: '010-5521-3312', pages: 16, status: '검수 대기', photos: 10, story: '보리가 무지개다리를 건너기 전 마지막 여름 이야기를 책으로 남기고 싶습니다.' },
  { id: 3, name: '박서준', pet: '코코 (코리안숏헤어)', phone: '010-7789-1120', pages: 10, status: '완료', photos: 6, story: '집사와 코코가 처음 만난 겨울, 창가에서 함께 보낸 시간들.' },
  { id: 4, name: '최유나', pet: '두부 (푸들)', phone: '010-3345-8890', pages: 14, status: '재생성 요청', photos: 9, story: '두부가 산책길에서 겪은 작은 모험들을 동화처럼 그려주세요.' },
  { id: 5, name: '정하늘', pet: '별이 (러시안블루)', phone: '010-9012-4471', pages: 12, status: '완료', photos: 7, story: '별이와 함께한 이사, 새 집 적응기를 담고 싶어요.' },
  { id: 6, name: '한소율', pet: '까망이 (믹스묘)', phone: '010-6612-7734', pages: 18, status: '검수 대기', photos: 10, story: '까망이가 우리 가족이 된 첫날부터의 성장 이야기.' },
];

const REVIEW_PAGES = Array.from({ length: 12 }).map((_, i) => ({
  id: i + 1, name: `보리 스토리북 · ${i + 1}p`,
  status: i === 3 || i === 8 ? 'flagged' : 'ok',
}));

const PRESETS = [
  { id: 1, name: '정방형 210×210mm', bleed: '3mm', safe: '5mm', used: 24 },
  { id: 2, name: 'A5 148×210mm', bleed: '3mm', safe: '4mm', used: 11 },
  { id: 3, name: '대형 220×220mm', bleed: '4mm', safe: '6mm', used: 6 },
];

const MONITOR_DATA_7 = [
  { day: '9/15', requests: 8, retries: 2, done: 6 },
  { day: '9/16', requests: 11, retries: 3, done: 9 },
  { day: '9/17', requests: 9, retries: 1, done: 8 },
  { day: '9/18', requests: 14, retries: 4, done: 11 },
  { day: '9/19', requests: 12, retries: 2, done: 10 },
  { day: '9/20', requests: 16, retries: 3, done: 14 },
  { day: '9/21', requests: 13, retries: 2, done: 12 },
];
const MONITOR_DATA_30 = MONITOR_DATA_7.map((d, i) => ({ ...d, day: `W${i + 1}` }));

const FAIL_REASONS = [
  { name: '삽화 API 응답 지연', value: 42, fill: M700 },
  { name: '캐릭터 일관성 저하', value: 30, fill: '#8a9a78' },
  { name: '이미지 해상도 미달', value: 18, fill: N4 },
  { name: '기타', value: 10, fill: '#c6c8c3' },
];

function Ico({ name, size = 15, style }) {
  return <i className={`ph ${name}`} style={{ fontSize: size, ...style }} />;
}

function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return <div className="toast"><Ico name="ph-check-circle" size={15} />{message}</div>;
}

function Sidebar({ view, setView }) {
  return (
    <aside className="sidebar">
      <div className="sb-brand">
        <span className="mark"><Ico name="ph-book-open-text" size={15} style={{ color: '#fff' }} /></span>
        포이야기 운영 콘솔
      </div>
      <nav className="sb-nav">
        {NAV_ITEMS.map(item => (
          <button key={item.key} className={`sb-item ${view === item.key ? 'active' : ''}`} onClick={() => setView(item.key)}>
            <Ico name={item.icon} size={16} /><span>{item.label}</span>
          </button>
        ))}
      </nav>
      <div className="sb-foot">
        <span className="sb-avatar">관</span>
        <div>
          <div className="sb-foot-name">운영 관리자</div>
          <div className="sb-foot-role">Admin</div>
        </div>
      </div>
    </aside>
  );
}

function CustomerDetail({ customer, onRequestRegen }) {
  if (!customer) return <div className="detail-panel"><div className="empty-state">좌측에서 고객을 선택하면 상세 정보가 표시됩니다.</div></div>;
  return (
    <div className="detail-panel fade-up" key={customer.id}>
      <div className="detail-head">
        <div>
          <div className="detail-title">{customer.name} 님 · {customer.pet}</div>
          <div className="detail-sub">{customer.phone} · 스토리북 {customer.pages}페이지</div>
        </div>
        <span className={`badge ${customer.status === '완료' ? 'badge-success' : customer.status === '재생성 요청' ? 'badge-danger' : 'badge-neutral'}`}>{customer.status}</span>
      </div>
      <div className="summary-cards">
        <div className="sm-card"><div className="lbl">업로드 사진</div><div className="val">{customer.photos}장</div></div>
        <div className="sm-card"><div className="lbl">생성 페이지</div><div className="val">{customer.pages}p</div></div>
        <div className="sm-card"><div className="lbl">재생성 요청</div><div className="val">{customer.status === '재생성 요청' ? 2 : 0}건</div></div>
        <div className="sm-card"><div className="lbl">최근 활동</div><div className="val">2일 전</div></div>
      </div>
      <div className="section-title"><Ico name="ph-note-pencil" size={14} /> 사연 요약</div>
      <p style={{ fontSize: 12.5, color: 'var(--n8)', lineHeight: 1.6 }}>{customer.story}</p>

      <div className="section-title"><Ico name="ph-images" size={14} /> 업로드 사진</div>
      <div className="gallery-row">
        {Array.from({ length: Math.min(customer.photos, 8) }).map((_, i) => (
          <div className="gallery-tile" key={i}><Ico name="ph-dog" size={20} /></div>
        ))}
      </div>

      <div className="section-title"><Ico name="ph-clock-counter-clockwise" size={14} /> 생성 이력</div>
      <table className="history-table">
        <thead><tr><th>버전</th><th>생성일</th><th>페이지</th><th>상태</th><th></th></tr></thead>
        <tbody>
          <tr><td>v3</td><td>2024.11.02</td><td>{customer.pages}p</td><td><span className="badge badge-success">완료</span></td>
            <td><button className="btn btn-ghost" style={{ padding: '4px 10px' }} onClick={() => onRequestRegen(customer.id)}>PDF 열람</button></td></tr>
          <tr><td>v2</td><td>2024.10.28</td><td>{customer.pages}p</td><td><span className="badge badge-neutral">보관</span></td>
            <td><button className="btn btn-ghost" style={{ padding: '4px 10px' }} onClick={() => onRequestRegen(customer.id)}>PDF 열람</button></td></tr>
        </tbody>
      </table>
    </div>
  );
}

function MainView({ toast, setToast }) {
  const [query, setQuery] = useState('');
  const [selectedId, setSelectedId] = useState(CUSTOMERS[0].id);
  const filtered = useMemo(() => CUSTOMERS.filter(c => (c.name + c.pet).includes(query)), [query]);
  const selected = CUSTOMERS.find(c => c.id === selectedId);

  return (
    <div>
      <div className="hero-greet">안녕하세요, 운영 관리자님</div>
      <div className="hero-greet-sub">오늘 검수 대기 {CUSTOMERS.filter(c => c.status === '검수 대기').length}건 · 재생성 요청 {CUSTOMERS.filter(c => c.status === '재생성 요청').length}건이 있습니다.</div>
      <div className="page-head">
        <div>
          <h1>고객·반려동물 자료 통합 관리</h1>
          <p>좌측에서 고객을 선택하면 반려동물 정보, 사연, 사진, 생성 이력을 한 화면에서 확인할 수 있습니다.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setToast('고객 목록을 최신순으로 새로고침했습니다.')}><Ico name="ph-arrows-clockwise" size={14} /> 새로고침</button>
      </div>
      <div className="md-shell">
        <div className="list-rail">
          <div className="rail-search">
            <input placeholder="이름 또는 반려동물로 검색" value={query} onChange={e => setQuery(e.target.value)} />
          </div>
          <div className="rail-list">
            {filtered.map(c => (
              <button key={c.id} className={`rail-item ${selectedId === c.id ? 'active' : ''}`} onClick={() => setSelectedId(c.id)}>
                <span className="rail-avatar">{c.name.charAt(0)}</span>
                <span className="rail-txt">
                  <div className="rail-name">{c.name} · {c.pet}</div>
                  <div className="rail-sub">{c.pages}페이지 · {c.status}</div>
                </span>
              </button>
            ))}
            {filtered.length === 0 && <div className="empty-state">검색 결과가 없습니다.</div>}
          </div>
        </div>
        <CustomerDetail customer={selected} onRequestRegen={() => setToast('PDF 열람 페이지를 새 탭에서 준비했습니다.')} />
      </div>
    </div>
  );
}

function ReviewView({ setToast }) {
  const [checked, setChecked] = useState([]);
  const [pages, setPages] = useState(REVIEW_PAGES);
  function toggle(id) { setChecked(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id]); }
  function bulkRegen() {
    setPages(p => p.map(pg => checked.includes(pg.id) ? { ...pg, status: 'ok' } : pg));
    setToast(`선택한 ${checked.length}개 페이지의 재생성 요청을 큐에 등록했습니다.`);
    setChecked([]);
  }
  return (
    <div>
      <div className="page-head">
        <div>
          <h1>생성 이력 및 캐릭터 일관성 검수</h1>
          <p>AI 삽화 생성 결과를 페이지별로 검수하고, 일관성이 낮은 페이지는 표시해 일괄 재생성을 요청할 수 있습니다.</p>
        </div>
      </div>
      <div className="review-toolbar">
        <div className="bulk-tray">
          <span>{checked.length}개 선택됨</span>
          <button className="btn btn-ghost" disabled={checked.length === 0} onClick={bulkRegen}><Ico name="ph-arrow-counter-clockwise" size={13} /> 일괄 재생성 요청</button>
        </div>
        <span style={{ fontSize: 12, color: 'var(--n6)' }}>보리(이지은 고객) · v2 검수</span>
      </div>
      <div className="review-grid stagger-rows">
        {pages.map(p => (
          <div className="rv-card" key={p.id}>
            <div className="rv-thumb">
              <Ico name="ph-dog" size={22} style={{ color: 'var(--n6)' }} />
              <div className={`rv-check ${checked.includes(p.id) ? 'checked' : ''}`} onClick={() => toggle(p.id)}>
                {checked.includes(p.id) && <Ico name="ph-check-bold" size={11} />}
              </div>
            </div>
            <div className="rv-meta">
              <div className="rv-name">{p.name}</div>
              <span className={`badge ${p.status === 'flagged' ? 'badge-danger' : 'badge-success'}`}>
                {p.status === 'flagged' ? '일관성 확인 필요' : '승인'}
              </span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PrintSettingsView({ setToast }) {
  const [presets, setPresets] = useState(PRESETS);
  const [showNew, setShowNew] = useState(false);
  const [name, setName] = useState('');
  function addPreset() {
    if (!name.trim()) return;
    setPresets(p => [...p, { id: Date.now(), name, bleed: '3mm', safe: '5mm', used: 0 }]);
    setShowNew(false); setName('');
    setToast('새 판형 프리셋이 등록되었습니다.');
  }
  function remove(id) {
    setPresets(p => p.filter(x => x.id !== id));
    setToast('판형 프리셋을 삭제했습니다. 기존 생성물의 규격은 유지됩니다.');
  }
  return (
    <div>
      <div className="page-head">
        <div>
          <h1>판형·출력 규격 프리셋 관리</h1>
          <p>인쇄 판형을 프리셋으로 등록하고 재단선·안전여백 값을 관리합니다. 변경해도 기존 생성물의 규격에는 영향이 없습니다.</p>
        </div>
      </div>
      <div className="preset-list">
        {presets.map(p => (
          <div className="pr-card" key={p.id} style={{ borderRadius: 10, boxShadow: '0 4px 14px rgba(26,51,0,0.14)' }}>
            <h3>{p.name}</h3>
            <div className="pr-row"><span>재단선(Bleed)</span><b>{p.bleed}</b></div>
            <div className="pr-row"><span>안전 여백</span><b>{p.safe}</b></div>
            <div className="pr-row"><span>사용 중인 스토리북</span><b>{p.used}건</b></div>
            <div className="pr-actions">
              <button className="btn btn-ghost" onClick={() => setToast(`${p.name} 프리셋 값을 수정할 수 있습니다.`)}><Ico name="ph-pencil-simple" size={13} /> 수정</button>
              <button className="btn btn-danger" onClick={() => remove(p.id)}><Ico name="ph-trash" size={13} /> 삭제</button>
            </div>
          </div>
        ))}
        <div className="pr-card new" onClick={() => setShowNew(true)}>
          <Ico name="ph-plus-circle" size={26} />
          <span>새 판형 프리셋 추가</span>
        </div>
      </div>
      {showNew && (
        <div className="modal-overlay" onClick={() => setShowNew(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><h3>새 판형 프리셋</h3><button className="icon-btn" onClick={() => setShowNew(false)}><Ico name="ph-x" size={16} /></button></div>
            <div className="field-group"><label className="field-label">판형 이름</label><input className="field-input" value={name} onChange={e => setName(e.target.value)} placeholder="예: 미니 150×150mm" /></div>
            <div className="field-group"><label className="field-label">재단선(mm)</label><input className="field-input" placeholder="3mm" /></div>
            <div className="field-group"><label className="field-label">안전 여백(mm)</label><input className="field-input" placeholder="5mm" /></div>
            <button className="btn btn-primary" style={{ width: '100%' }} onClick={addPreset}><Ico name="ph-check" size={14} /> 등록</button>
          </div>
        </div>
      )}
    </div>
  );
}

function MonitoringView() {
  const [range, setRange] = useState('7');
  const data = range === '7' ? MONITOR_DATA_7 : MONITOR_DATA_30;
  const totalReq = data.reduce((s, d) => s + d.requests, 0);
  const totalRetry = data.reduce((s, d) => s + d.retries, 0);
  const totalDone = data.reduce((s, d) => s + d.done, 0);

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>생성 파이프라인 이용 현황 모니터링</h1>
          <p>반려동물 스토리북 삽화·본문 생성 요청, 재시도, 완료 건수와 재생성 원인을 확인할 수 있습니다.</p>
        </div>
        <div className="range-toggle">
          <button className={range === '7' ? 'active' : ''} onClick={() => setRange('7')}>최근 7일</button>
          <button className={range === '30' ? 'active' : ''} onClick={() => setRange('30')}>최근 30일</button>
        </div>
      </div>
      <div className="kpi-row">
        <div className="kpi-card"><div className="lbl"><Ico name="ph-tray-arrow-down" size={13} /> 스토리북 생성 요청</div><div className="val">{totalReq}건</div><div className="delta up"><Ico name="ph-arrow-up" size={11} /> 전 기간 대비 증가</div></div>
        <div className="kpi-card"><div className="lbl"><Ico name="ph-check-circle" size={13} /> 삽화 완성</div><div className="val">{totalDone}건</div></div>
        <div className="kpi-card"><div className="lbl"><Ico name="ph-arrow-counter-clockwise" size={13} /> 캐릭터 재생성 발생</div><div className="val">{totalRetry}건</div><div className="delta down"><Ico name="ph-arrow-down" size={11} /> 전 기간 대비 감소</div></div>
        <div className="kpi-card"><div className="lbl"><Ico name="ph-percent" size={13} /> 재생성 요청률</div><div className="val">{Math.round((totalRetry / totalReq) * 100)}%</div></div>
      </div>
      <div className="chart-row">
        <div className="chart-card">
          <h3>일별 스토리북 생성 요청 · 재생성 · 완료 추이</h3>
          <div className="chart-wrap">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={data} margin={{ top: 4, right: 8, left: -18, bottom: 0 }}>
                <CartesianGrid stroke="#e6e6e5" vertical={false} />
                <XAxis dataKey="day" tick={{ fontSize: 11, fill: '#757a71' }} axisLine={{ stroke: '#e6e6e5' }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: '#757a71' }} axisLine={false} tickLine={false} />
                <Tooltip />
                <Line type="monotone" dataKey="requests" name="요청" stroke={M700} strokeWidth={2.4} dot={false} />
                <Line type="monotone" dataKey="done" name="완료" stroke="#8a9a78" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="retries" name="재시도" stroke={S2} strokeWidth={1.6} strokeDasharray="4 3" dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="chart-card">
          <h3>삽화 재생성 요청 원인 분류</h3>
          <div className="chart-wrap" style={{ height: 150 }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={FAIL_REASONS} dataKey="value" innerRadius={40} outerRadius={62} paddingAngle={2}>
                  {FAIL_REASONS.map((f, i) => <Cell key={i} fill={f.fill} />)}
                </Pie>
                <Tooltip />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <ul className="reason-list">
            {FAIL_REASONS.map(f => <li key={f.name}><span>{f.name}</span><b>{f.value}%</b></li>)}
          </ul>
        </div>
      </div>
    </div>
  );
}

function PermissionsView({ setToast }) {
  const [rows, setRows] = useState([
    { id: 1, name: '운영 관리자', role: 'Admin', dashboard: true, delete: true },
    { id: 2, name: '고객 상담 담당', role: 'Viewer', dashboard: true, delete: false },
    { id: 3, name: '외부 검수 인력', role: 'Reviewer', dashboard: true, delete: false },
  ]);
  function toggle(id, key) {
    setRows(rs => rs.map(r => r.id === id ? { ...r, [key]: !r[key] } : r));
    setToast('권한 설정이 변경되었습니다.');
  }
  return (
    <div>
      <div className="page-head">
        <div>
          <h1>권한 관리</h1>
          <p>운영 콘솔에 접근하는 계정별 권한을 관리합니다.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setToast('새 운영 계정 초대 메일을 발송했습니다.')}><Ico name="ph-user-plus" size={14} /> 계정 초대</button>
      </div>
      <table className="perm-table">
        <thead><tr><th>이름</th><th>역할</th><th>대시보드 열람</th><th>삭제 권한</th></tr></thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.id}>
              <td>{r.name}</td>
              <td><span className="badge badge-neutral">{r.role}</span></td>
              <td><span className={`toggle ${r.dashboard ? 'on' : ''}`} onClick={() => toggle(r.id, 'dashboard')}><span className="knob" /></span></td>
              <td><span className={`toggle ${r.delete ? 'on' : ''}`} onClick={() => toggle(r.id, 'delete')}><span className="knob" /></span></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);

  const crumbLabel = NAV_ITEMS.find(n => n.key === view)?.label || '';

  return (
    <div className="app-shell">
      <Sidebar view={view} setView={setView} />
      <div className="main-wrap">
        <div className="topbar">
          <div className="crumb">운영 콘솔 / <b>{crumbLabel}</b></div>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={() => setToast('새 알림이 없습니다.')}><Ico name="ph-bell" size={16} /></button>
            <button className="icon-btn" onClick={() => setToast('환경 설정 화면은 준비 중입니다.')}><Ico name="ph-gear" size={16} /></button>
          </div>
        </div>
        <div className="content">
          {view === 'main' && <MainView toast={toast} setToast={setToast} />}
          {view === 'review' && <ReviewView setToast={setToast} />}
          {view === 'print-settings' && <PrintSettingsView setToast={setToast} />}
          {view === 'monitoring' && <MonitoringView />}
          {view === 'permissions' && <PermissionsView setToast={setToast} />}
        </div>
      </div>
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
