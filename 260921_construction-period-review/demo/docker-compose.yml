# 한 줄 설치: cp server/.env.example server/.env → 인증키 입력 → docker compose up -d → http://<서버>:8765
services:
  console:
    build: .
    image: period-console:latest
    container_name: period-console
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-8765}:8765"
    env_file:
      - server/.env
    volumes:
      - console-data:/data      # 검토 저장소(reviews.db) + 기상 캐시 — 컨테이너를 지워도 유지
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
volumes:
  console-data:
