<script>
/* =====================================================================
   공사기간 산정 콘솔 — 시연 데모 (v2)
   화면의 모든 수치는 실제로 계산됩니다. 하드코딩된 결과값은 없습니다.
   ===================================================================== */

/* ---------- 0. 유틸 ---------- */
const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;};
const fmt=n=>Number(n).toLocaleString('ko-KR');
const fmt1=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kdate=d=>`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
const sdate=d=>`${d.getMonth()+1}/${d.getDate()}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parseDate=s=>new Date(s+'T00:00:00');
function toast(msg){const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),2800);}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function download(name,content,type){const blob=content instanceof Blob?content:new Blob([content],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

/* ---------- 1. 표준품셈 (data/standards.js + 사용자 업로드) ---------- */
const SCOPES={earth:'토공·옥외',concrete:'콘크리트',height:'고소·양중',interior:'실내마감',general:'일반'};
const ALL_SCOPES=Object.keys(SCOPES);
let _STD_CACHE=null,_STD_KEY='';
function STD(){const key=(S.extraStd||[]).length+'|'+(window.STD_OFFICIAL||[]).length+'|'+(window.STD_GUIDE||[]).length;if(_STD_CACHE&&_STD_KEY===key)return _STD_CACHE;
  const cur=(window.STD_ITEMS||[]);const curSecs=new Set(cur.map(s=>s.sec).filter(Boolean).map(x=>x.replace(/\s+다$/,'')));
  const auto=(window.STD_OFFICIAL||[]).filter(s=>!curSecs.has(s.sec));
  _STD_CACHE=cur.concat(auto,window.STD_GUIDE||[],S.extraStd||[]);_STD_KEY=key;return _STD_CACHE;}

const UNIT_ALIAS={'m2':'m²','㎡':'m²','m^2':'m²','평방미터':'m²','m3':'m³','㎥':'m³','m^3':'m³','t':'ton','톤':'ton','ea':'개소','개':'개','개소':'개소','m':'m','식':'식','ton':'ton','m²':'m²','m³':'m³','주':'주','대':'대','면':'면','동':'동','공m3':'공m³','공㎥':'공m³'};
const normUnit=u=>UNIT_ALIAS[String(u||'').trim().toLowerCase()]||String(u||'').trim();
const unitCompat=(a,b)=>a===b||(a==='개'&&b==='개소')||(a==='개소'&&b==='개');
const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^\w가-힣.]/g,'').replace(/(공사|작업|공|설치및해체|및)/g,'');
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a;}
function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);if(!A.length||!B.length)return a.includes(b)||b.includes(a)?0.6:0;const set=new Map();A.forEach(x=>set.set(x,(set.get(x)||0)+1));let inter=0;B.forEach(x=>{const c=set.get(x);if(c){inter++;set.set(x,c-1);}});return 2*inter/(A.length+B.length);}
function scoreItem(row,std){
  const rawP=norm(String(row.name).replace(/[()]/g,' '));const raw=norm(row.name), rawFull=norm(row.name+' '+(row.spec||''));
  let best=0,why='';
  for(const s of std.syn){const ns=norm(s);if(!ns)continue;for(const r0 of [raw,rawP]){if(!r0)continue;
    if(r0===ns){const sc=0.98+ns.length*0.002;if(sc>best){best=sc;why='동의어 완전일치';}}
    else if(r0.includes(ns)||ns.includes(r0)){const r=Math.min(ns.length,r0.length)/Math.max(ns.length,r0.length);const sc=0.72+0.24*r;if(sc>best){best=sc;why='동의어 부분일치';}}
    else{const d=dice(r0,ns);if(d*0.9>best){best=d*0.9;why='동의어 유사';}}}}
  const d2=dice(rawFull,norm(std.name));if(d2*0.85>best){best=d2*0.85;why='표준명 유사';}
  if(std.src==='guide')best-=0.02;/* 국토부 가이드라인 1일 작업량은 표준품셈과 동점이면 후순위 */
  const u=normUnit(row.unit);let unitNote='';
  if(u&&std.unit){if(unitCompat(u,std.unit)){best=best+0.04;}else{best*=0.55;unitNote=`단위 불일치(${u}≠${std.unit})`;}}
  return {score:Math.min(100,Math.round(best*100)),rank:best,why:unitNote?`${why} · ${unitNote}`:why,unitMismatch:!!unitNote};
}
function candidatesFor(row,n=3){return STD().map(s=>({std:s,...scoreItem(row,s)})).sort((a,b)=>b.rank-a.rank).slice(0,n);}
function mapRow(row,settings){

function workdays(row){if(row.manualDays!=null&&!row.mapped)return {raw:row.manualDays,days:Math.max(1,Math.ceil(row.manualDays)),std:null,manual:true,hz:0};const std=row.mapped?stdBy(row.mapped):null;if(!std)return null;const hz=hzRate(S.site,std.scope||'general');const base=row.qty/(std.prod*(row.crews||1));const days=base*(1+hz.rate/100);return {raw:days,base,days:Math.max(1,Math.ceil(days-1e-9)),std,hz:hz.rate,hzParts:hz.parts};}

function majorityScope(items){const c={};items.forEach(i=>{const s=i.wd.std?i.wd.std.scope:'general';c[s]=(c[s]||0)+i.wd.days;});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'general';}
function buildActivities(rows,settings,preds,site){
  const groups={};for(const r of rows){const wd=workdays(r);if(!wd)continue;const k=groupKey(r);groups[k]=groups[k]||{key:k,items:[],net:0};groups[k].items.push({...r,wd});groups[k].net+=wd.days;}
  const adjRate=(site.small?settings.adjust.small:0);const insp=settings.indirect.inspectionPerActivity;
  const acts=[];const order=[...ACT_ORDER,...Object.keys(groups).filter(k=>!ACT_ORDER.includes(k))];
  for(const k of order){
    if(k==='양생·검측'){if(!groups['철근콘크리트공사'])continue;acts.push({key:k,group:k,items:[],net:0,indirect:settings.indirect.curing,adj:0,dur:settings.indirect.curing,scope:'concrete',note:'콘크리트 양생 및 검측(간접작업일)'});continue;}
    const g=groups[k];if(!g)continue;
    if(settings.granularity==='item'){let prev=null;const seen={};g.items.forEach((it,i)=>{const adj=Math.ceil(it.wd.days*adjRate/100-1e-9);const last=i===g.items.length-1;const c=(seen[it.name]=(seen[it.name]||0)+1);/* 같은 품명이 층·구역별로 반복되면 키를 고유하게 */const a={key:`${k} › ${it.name}${c>1?' #'+c:''}`,group:k,items:[it],net:it.wd.days,indirect:last?insp:0,adj,dur:it.wd.days+(last?insp:0)+adj,scope:it.wd.std?it.wd.std.scope:'general',note:'',chainPrev:prev};acts.push(a);prev=a.key;});}

function monthWxPlan(stn,settings,scope,y,m,hs){const nw=nonWorking(stn,settings,scope);const dim=new Date(y,m,0).getDate();const cand=[];for(let d=1;d<=dim;d++){if(!dayOff(new Date(y,m-1,d),hs))cand.push(d);}const n=Math.min(cand.length,Math.round(nw.monthly[m-1].wx));const set=new Set();for(let i=0;i<n;i++)set.add(cand[Math.floor((i+0.5)*cand.length/n)]);return set;}
function scheduleCalendar(order,site,settings){
  const hs=settings.holiday;const start=parseDate(site.start);const prepEnd=addDays(start,settings.period.prep-1);const workStart=addDays(start,settings.period.prep);

}

    const r=await fetch(API_BASE+'/api/map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(240000)});if(!r.ok)throw new Error((await r.text()).slice(0,200));const j=await r.json();
    let changed=0,confirmed=0;const th=S.settings.thresholds;
    for(const row of S.rows){if(row.manual)continue;const res=j.results[String(row.no)];if(!res)continue;const before=row.mapped;
      if(res.code){row.mapped=res.code;row.score=res.confidence;row.ai={code:res.code,confidence:res.confidence,reason:res.reason};row.status=res.confidence>=th.auto?'auto':res.confidence>=th.review?'review':'unmapped';if(row.status==='unmapped')row.mapped=null;if(row.mapped&&before!==row.mapped)row.crews=stdBy(row.mapped)?.nc||1;}
      else{row.ai={code:null,confidence:res.confidence,reason:res.reason};row.mapped=null;row.status='unmapped';row.score=res.confidence;}
      if(before!==row.mapped)changed++;else confirmed++;}
    LIVE.mapped={model:j.model,changed,confirmed,vector:LIVE.vectorReady?LIVE.vector:null};S.reportGenerated=false;S.narrative=null;persist();toast(`AI 문맥 보정 완료 (${j.model}${LIVE.vectorReady?' + 벡터 후보':''}) — 변경 ${changed}건, 확인 ${confirmed}건`);}
  catch(e){toast('AI 보정 실패: '+String(e.message||e).slice(0,80));}
  LIVE.mapping=false;render();}

function parseWorkbook(buf,name){
  if(!window.XLSX){toast('엑셀 파서를 불러오지 못했습니다(오프라인). 샘플 데이터를 사용합니다.');loadSample();return;}
  const wb=XLSX.read(buf,{type:'array'});
  const KEY={group:['공종구분','대공종','공종명칭','공사구분','구분'],name:['품명','공종명','명칭','품목','항목명','항목','내역','공종','공정명','작업명'],spec:['규격','사양'],unit:['단위'],qty:['수량','물량']};
  let best=null;
  for(const sn of wb.SheetNames){const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    for(let i=0;i<Math.min(aoa.length,40);i++){const cells=aoa[i].map(c=>String(c).replace(/\s/g,''));const m={};const used=new Set();
      for(const[k,ks]of Object.entries(KEY)){let idx=-1;for(const x of ks){idx=cells.findIndex((c,ci)=>!used.has(ci)&&c&&(c===x||c.includes(x)));if(idx>=0)break;}if(idx>=0){m[k]=idx;used.add(idx);}}
      if(m.name!=null&&m.qty!=null){best={sheet:sn,aoa,hi:i,map:m};break;}}
    if(best)break;}
  if(!best){toast('헤더(품명·수량)를 찾지 못했습니다. 시트의 컬럼명을 확인하세요.');return;}
  const {aoa,hi,map,sheet}=best;const rows=[];let no=0;
  for(let i=hi+1;i<aoa.length;i++){const r=aoa[i];const name=String(r[map.name]||'').trim();const qty=parseFloat(String(r[map.qty]).replace(/,/g,''));if(!name||!isFinite(qty)||qty<=0)continue;if(/합계|소계|계$/.test(name))continue;
    rows.push({no:++no,group:map.group!=null?String(r[map.group]||'').trim():'',name,spec:map.spec!=null?String(r[map.spec]||'').trim():'',unit:map.unit!=null?String(r[map.unit]||'').trim():'',qty});}
  if(!rows.length){toast('유효한 내역 행이 없습니다.');return;}
  let g='';rows.forEach(r=>{if(r.group)g=r.group;else r.group=g||'기타';});
  LIVE.mapped=null;S.narrative=null;S.reviewId=null;S.reviewVersion=null;S.rows=rows.map(r=>mapRow(r,S.settings));S.fileName=name;S.reportGenerated=false;S.preds={};persist();render();
  toast(`'${name}' [${sheet}] ${rows.length}행 파싱 완료 (헤더 ${hi+1}행 자동 인식)`);
