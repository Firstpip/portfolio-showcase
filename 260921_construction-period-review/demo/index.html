<style>

  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;

*{box-sizing:border-box;margin:0;padding:0}

.right{text-align:right}

<body>
<div id="app"></div>
<script>
/* =====================================================================
   공사기간 산정 콘솔 — 시연 데모 (v2)
   화면의 모든 수치는 실제로 계산됩니다. 하드코딩된 결과값은 없습니다.
   ===================================================================== */

/* ---------- 0. 유틸 ---------- */
const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;};
const fmt=n=>Number(n).toLocaleString('ko-KR');
const fmt1=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kdate=d=>`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
const sdate=d=>`${d.getMonth()+1}/${d.getDate()}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parseDate=s=>new Date(s+'T00:00:00');
function toast(msg){const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),2800);}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function download(name,content,type){const blob=content instanceof Blob?content:new Blob([content],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

/* ---------- 1. 표준품셈 (data/standards.js + 사용자 업로드) ---------- */
const SCOPES={earth:'토공·옥외',concrete:'콘크리트',height:'고소·양중',interior:'실내마감',general:'일반'};
const ALL_SCOPES=Object.keys(SCOPES);
function STD(){return (window.STD_ITEMS||[]).concat(S.extraStd||[]);}
const stdBy=code=>STD().find(s=>s.code===code);
const PUMSEM_PDF='data/pumsem2026.pdf';
function srcBadge(s,small){if(!s)return null;if(s.user)return h('span',{class:'pill pill-info'},'업로드');if(s.src==='official')return h('a',{class:'pill pill-good',href:`${PUMSEM_PDF}#page=${s.pdf}`,target:'_blank',title:`2026 건설공사 표준품셈 ${s.sec} 원문 보기 (PDF p.${s.pdf})`,onclick:e=>e.stopPropagation()},'공식 2026',small?null:' ↗');return h('span',{class:'pill pill-gray',title:'원문 대조 전 대표값 — 착수 후 표준품셈 원문으로 교체'},'대표값');}

const UNIT_ALIAS={'m2':'m²','㎡':'m²','m^2':'m²','평방미터':'m²','m3':'m³','㎥':'m³','m^3':'m³','t':'ton','톤':'ton','ea':'개소','개':'개','개소':'개소','m':'m','식':'식','ton':'ton','m²':'m²','m³':'m³','주':'주','대':'대','면':'면','동':'동','공m3':'공m³','공㎥':'공m³'};
const normUnit=u=>UNIT_ALIAS[String(u||'').trim().toLowerCase()]||String(u||'').trim();
const unitCompat=(a,b)=>a===b||(a==='개'&&b==='개소')||(a==='개소'&&b==='개');
const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^\w가-힣.]/g,'').replace(/(공사|작업|공|설치및해체|및)/g,'');
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a;}
function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);if(!A.length||!B.length)return a.includes(b)||b.includes(a)?0.6:0;const set=new Map();A.forEach(x=>set.set(x,(set.get(x)||0)+1));let inter=0;B.forEach(x=>{const c=set.get(x);if(c){inter++;set.set(x,c-1);}});return 2*inter/(A.length+B.length);}
function scoreItem(row,std){
  const rawP=norm(String(row.name).replace(/[()]/g,' '));const raw=norm(row.name), rawFull=norm(row.name+' '+(row.spec||''));
  let best=0,why='';
  for(const s of std.syn){const ns=norm(s);if(!ns)continue;for(const r0 of [raw,rawP]){if(!r0)continue;
    if(r0===ns){const sc=0.98+ns.length*0.002;if(sc>best){best=sc;why='동의어 완전일치';}}
    else if(r0.includes(ns)||ns.includes(r0)){const r=Math.min(ns.length,r0.length)/Math.max(ns.length,r0.length);const sc=0.72+0.24*r;if(sc>best){best=sc;why='동의어 부분일치';}}
    else{const d=dice(r0,ns);if(d*0.9>best){best=d*0.9;why='동의어 유사';}}}}
  const d2=dice(rawFull,norm(std.name));if(d2*0.85>best){best=d2*0.85;why='표준명 유사';}
  const u=normUnit(row.unit);let unitNote='';
  if(u&&std.unit){if(unitCompat(u,std.unit)){best=best+0.04;}else{best*=0.55;unitNote=`단위 불일치(${u}≠${std.unit})`;}}
  return {score:Math.min(100,Math.round(best*100)),rank:best,why:unitNote?`${why} · ${unitNote}`:why,unitMismatch:!!unitNote};
}
function candidatesFor(row,n=3){return STD().map(s=>({std:s,...scoreItem(row,s)})).sort((a,b)=>b.rank-a.rank).slice(0,n);}
function mapRow(row,settings){
  const cands=candidatesFor(row,3);const top=cands[0];
  let status='unmapped';if(top&&top.score>=settings.thresholds.auto)status='auto';else if(top&&top.score>=settings.thresholds.review)status='review';
  return {...row,cands,mapped:status==='unmapped'?null:top.std.code,score:top?top.score:0,status,manual:false,crews:(top&&top.std.nc)||1,manualDays:null,ai:null};
}
function remapAll(){S.rows=S.rows.map(r=>{if(r.manual)return {...r,cands:candidatesFor(r,3)};if(r.manualDays!=null&&!r.mapped)return {...r,cands:candidatesFor(r,3)};return mapRow(r,S.settings);});}

function simulate(stn){const st=stationBy(stn)||{lat:35.9,lon:128.6};const tAdj=(35.9-st.lat)*0.6;const rnd=seeded(parseInt(stn)*7919+1);const days=[];

      const tmax=Math.round((tm+tAdj+yearAdj+gauss(rnd)*ts-(wet?2.5:0))*10)/10;const tmin=Math.round((tmax-(8+gauss(rnd)*2))*10)/10;const hum=Math.min(98,Math.max(20,Math.round(rh+(wet?18:0)+gauss(rnd)*8)));
      const wind=Math.round(Math.max(0.5,wm*Math.exp(gauss(rnd)*0.45)*(m>=3&&m<=4?1.25:1))*10)/10;const snow=(sp>0&&rnd()<sp)?Math.round((0.5+rnd()*6)*10)/10:0;

  const byRule={};rules.forEach(r=>byRule[r.id]=0);let wxTotal=0,wxOnHoliday=0,holTotal=0;

  for(const day of days){const hit=ruleHits(day,rules,scope);const dt=new Date(day.y,day.m-1,day.d);const off=dayOff(dt,hs);const rec=mon[day.m-1];
    if(off){rec.hol++;holTotal++;}
