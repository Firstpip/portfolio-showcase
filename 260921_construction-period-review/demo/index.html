<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공사기간 산정 콘솔 — 시연 데모</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f3d6e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23eb6834%27 font-weight=%27700%27%3E公%3C/text%3E%3C/svg%3E">
<meta name="description" content="내역서 업로드 → 표준품셈 매핑 → 작업일수 → 기상 비작업일수 → CPM 공정표 → 검토보고서 초안까지 한 흐름으로 동작하는 시연 데모">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--ink:#0f172a;--ink2:#475569;--muted:#8a8f99;--line:#e3e6eb;--line2:#cfd4dc;
  --brand:#0f3d6e;--brand2:#1c5cab;--accent:#eb6834;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s7:#4a3aa7;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --good-bg:#e8f7e8;--warn-bg:#fff5db;--crit-bg:#fdeaea;--info-bg:#e9f1fb;
  --r:10px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--ink2);font-weight:600;background:#f8f9fb;white-space:nowrap}
td.num,th.num{text-align:right}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px}
/* layout */
.app-header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;height:54px;display:flex;align-items:center;gap:18px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.2px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:900}
.brand .tag{font-size:11px;font-weight:600;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:99px;margin-left:4px}
.site{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;font-size:13px}
.site select{background:transparent;border:0;color:#fff;outline:none;font-weight:600}
.site select option{color:#000}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px}
.hbtn{color:#fff;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:8px;font-weight:600;font-size:12.5px}
.hbtn:hover{background:rgba(255,255,255,.24)}
.stepbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.step .n{width:22px;height:22px;border-radius:99px;background:#e9edf3;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink2)}
.step.active{color:var(--brand);border-bottom-color:var(--brand)}
.step.active .n{background:var(--brand);color:#fff}
.step.done .n{background:var(--good);color:#fff}
.step.util{margin-left:auto}
.content{max-width:1320px;margin:0 auto;padding:22px 20px 60px}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-title p{color:var(--ink2);font-size:13px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-desc{font-size:12.5px;color:var(--ink2);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-side{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:960px){.grid2,.grid3,.grid4,.grid-side{grid-template-columns:1fr}}
@media(max-width:720px){.app-header{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}.header-right{margin-left:0}.header-right>span{display:none}.content{padding:16px 16px 40px}.page-title h1{font-size:18px}.month-grid{grid-template-columns:repeat(6,1fr)}}
/* kpi */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid transparent;transition:.12s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{border-color:var(--line2);background:#fff;color:var(--ink)}
.btn-outline:hover{background:#f6f7f9}
.btn-ghost{color:var(--brand);background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-good{background:var(--good-bg);color:#006300}
.pill-warn{background:var(--warn-bg);color:#7a4b00}
.pill-crit{background:var(--crit-bg);color:#9b1c1c}
.pill-info{background:var(--info-bg);color:#184f95}
.pill-gray{background:#eef0f3;color:var(--ink2)}
.pill-cp{background:#fdece4;color:#9a3a10}
/* forms */
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;outline:none;font-size:13px}
input:focus,select:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(28,92,171,.14)}
input[type=number]{width:90px;text-align:right}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:#cfd4dc;position:relative;transition:.15s;cursor:pointer}
.switch input:checked{background:var(--brand2)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:.15s}
.switch input:checked::after{left:16px}
/* dropzone */
.dropzone{border:2px dashed var(--line2);border-radius:var(--r);padding:34px 20px;text-align:center;background:#fafbfc;transition:.15s}
.dropzone.drag{border-color:var(--brand2);background:var(--info-bg)}
.dropzone h3{font-size:15px;font-weight:800;margin-bottom:4px}
.dropzone p{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
/* sim bar */
.simbar{display:inline-block;width:64px;height:6px;border-radius:99px;background:#e9edf3;vertical-align:middle;margin-right:6px;overflow:hidden}
.simbar i{display:block;height:100%;border-radius:99px;background:var(--s1)}
.simbar.w i{background:var(--warn)}
.simbar.c i{background:var(--crit)}
/* tables */
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
.tag-src{font-size:11px;color:var(--muted)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis{font-size:11px;fill:var(--muted)}
.grid{stroke:#e1e0d9;stroke-width:1}
.tooltip{position:absolute;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tooltip.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* gantt */
.gantt{overflow-x:auto}
.gantt-row{display:grid;grid-template-columns:200px 1fr;align-items:center;min-height:34px;border-bottom:1px solid var(--line)}
.gantt-row:last-child{border-bottom:0}
.gantt-label{font-size:12.5px;font-weight:600;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-label small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.gantt-track{position:relative;height:26px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),#eceff3 calc(10% - 1px),#eceff3 10%)}
.gantt-bar{position:absolute;top:4px;height:18px;border-radius:4px;background:var(--s1);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 6px;white-space:nowrap;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.gantt-bar.cp{background:var(--accent)}
.gantt-float{position:absolute;top:8px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,#cfd4dc 0,#cfd4dc 3px,transparent 3px,transparent 6px)}
.gantt-head{display:grid;grid-template-columns:200px 1fr;font-size:11px;color:var(--muted);padding-bottom:4px}
.gantt-ticks{display:flex;justify-content:space-between}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:6px}
.modal .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.cand{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.cand:hover{border-color:var(--brand2);background:var(--info-bg)}
.cand.sel{border-color:var(--brand);background:var(--info-bg)}
.cand .t{font-weight:700}
.cand .m{font-size:12px;color:var(--ink2)}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .2s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* callouts */
.note{border-left:3px solid var(--brand2);background:var(--info-bg);padding:10px 12px;border-radius:6px;font-size:12.5px;color:#184f95}
.note.warn{border-color:var(--warn);background:var(--warn-bg);color:#7a4b00}
.note.crit{border-color:var(--crit);background:var(--crit-bg);color:#9b1c1c}
.note.good{border-color:var(--good);background:var(--good-bg);color:#006300}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv b{color:var(--ink2);font-weight:600}
.formula{font-family:"SF Mono",Menlo,monospace;font-size:12px;background:#f6f7f9;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink2)}
.rule{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .name{font-weight:700}
.rule .desc{font-size:12px;color:var(--ink2)}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px}
.live-pill i{width:8px;height:8px;border-radius:99px;background:#94a3b8;display:inline-block}
.live-pill i.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.live-pill.off{opacity:.75}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:99px;animation:sp .8s linear infinite;vertical-align:-2px}
.btn-outline .spin{border-color:#cfd4dc;border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);border:1px dashed var(--line2);border-radius:6px;padding:2px 8px;margin-left:6px}
/* report */
.report{background:#fff;padding:40px 48px;border:1px solid var(--line);border-radius:var(--r);max-width:900px;margin:0 auto;font-size:13.5px;line-height:1.7}
.report h2{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:-.3px}
.report .meta{text-align:center;color:var(--ink2);font-size:12.5px;margin-bottom:26px}
.report h3{font-size:15px;font-weight:800;margin:24px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--brand)}
.report h4{font-size:13.5px;font-weight:700;margin:12px 0 4px}
.report table{font-size:12.5px;margin:8px 0}
.report th{background:#f1f4f8}
.report p{margin-bottom:8px}
.report .ai{border:1px dashed var(--brand2);background:#f7faff;padding:10px 14px;border-radius:6px;margin:8px 0}
.report .ai .lbl{font-size:11px;font-weight:800;color:var(--brand2);letter-spacing:.3px;margin-bottom:4px}
.report .verdict{display:flex;gap:14px;align-items:center;border:2px solid var(--line2);border-radius:8px;padding:12px 16px;margin:10px 0}
.report .verdict .big{font-size:24px;font-weight:900}
.report ul{padding-left:18px}
.report li{margin-bottom:3px}
.report .sig{margin-top:30px;text-align:right;color:var(--ink2);font-size:12.5px}
.rep-toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
@media print{
  body{background:#fff}
  .app-header,.stepbar,.rep-toolbar,.no-print,.toast{display:none!important}
  .content{padding:0;max-width:none}
  .report{border:0;padding:0;max-width:none;box-shadow:none}
  .card{box-shadow:none}
  @page{size:A4;margin:18mm 16mm}
}
.hidden{display:none!important}
.small{font-size:12px;color:var(--ink2)}
.right{text-align:right}
.pre-wrap{white-space:pre-wrap}
.std-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.std-item .t{font-weight:700}
.std-item .m{font-size:12px;color:var(--ink2)}
.month-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;text-align:center}
.month-grid .c{background:#f8f9fb;border:1px solid var(--line);border-radius:6px;padding:6px 2px}
.month-grid .c b{display:block;font-size:14px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px}
.calendar .d{height:26px;border-radius:4px;display:grid;place-items:center;background:#f1f3f6;color:var(--ink2)}
.calendar .d.work{background:#dbe8f8;color:#184f95;font-weight:700}
.calendar .d.hol{background:#eef0f3;color:var(--muted)}
.calendar .d.wx{background:#fde1d3;color:#9a3a10;font-weight:700}
.calendar .d.prep{background:#fff5db;color:#7a4b00}
.calendar .d.out{background:transparent}
.calendar .h{font-weight:700;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   공사기간 산정 콘솔 — 시연 데모
   모든 수치는 화면에서 실제로 계산됩니다 (하드코딩된 결과값 없음).
   - 내역서: 엑셀 실제 파싱(SheetJS) 또는 내장 샘플
   - 매핑: 동의어 사전 + 문자열 유사도(바이그램 Dice) + 단위 정합 → 신뢰도
   - 작업일수: 수량 ÷ (표준품셈 생산성 × 투입조) + 간접·보정
   - 비작업일수: 10년 일별 기상 데이터 × 룰 엔진 × 휴일 중복 제외
   - 공정표: CPM Forward/Backward pass, 여유일수, 주공정선
   - 보고서: 계산값을 템플릿으로 서술 (실 시스템에서는 LLM 초안 생성 지점)
   ===================================================================== */

/* ---------- 1. 표준품셈 (데모용 요약본) ---------- */
const STD = [
 {code:'A-01',name:'강관비계 설치 및 해체',cat:'가설공사',unit:'m²',prod:120,nc:2,crew:'비계공 2 + 보통인부 1',ref:'표준품셈 가설공사 2-1 강관비계',syn:['비계','강관비계','외부비계','비계설치']},
 {code:'T-01',name:'절토 (기계, 백호우 1.0㎥)',cat:'토공사',unit:'m³',prod:480,nc:1,crew:'백호우 1.0㎥ 1대 + 보통인부 1',ref:'표준품셈 토공사 2-2 기계절토',syn:['흙깎기','토사절취','절취','깎기','절토','토사깎기','절토공']},
 {code:'T-02',name:'터파기 (기계, 백호우 0.7㎥)',cat:'토공사',unit:'m³',prod:320,nc:1,crew:'백호우 0.7㎥ 1대 + 보통인부 1',ref:'표준품셈 토공사 2-3 기계터파기',syn:['터파기','굴착','흙파기','기초터파기','굴착공']},

const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;};
const fmt=n=>Number(n).toLocaleString('ko-KR');

function toast(msg){const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),2400);}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---------- 5. 공종명 매핑 엔진 ---------- */
const UNIT_ALIAS={'m2':'m²','㎡':'m²','m^2':'m²','평방미터':'m²','m3':'m³','㎥':'m³','m^3':'m³','t':'ton','톤':'ton','ea':'개소','개':'개소','개소':'개소','m':'m','식':'식','ton':'ton','m²':'m²','m³':'m³'};
const normUnit=u=>UNIT_ALIAS[String(u||'').trim().toLowerCase()]||String(u||'').trim();
const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^\w가-힣]/g,'').replace(/(공사|작업|공|설치및해체|및)/g,'');
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a;}
function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);if(!A.length||!B.length)return a.includes(b)||b.includes(a)?0.6:0;const set=new Map();A.forEach(x=>set.set(x,(set.get(x)||0)+1));let inter=0;B.forEach(x=>{const c=set.get(x);if(c){inter++;set.set(x,c-1);}});return 2*inter/(A.length+B.length);}
function scoreItem(row,std){
  const rawP=norm(String(row.name).replace(/[()]/g,' ')); // 괄호 안 표기(벽·슬래브 등)를 포함한 형태
  const raw=norm(row.name), rawFull=norm(row.name+' '+(row.spec||''));
  let best=0,why='';
  // 1) 동의어 사전 — 괄호 제외형/포함형 두 표기 모두 대조
  for(const s of std.syn){const ns=norm(s);if(!ns)continue;for(const r0 of [raw,rawP]){if(!r0)continue;
    if(r0===ns){const sc=0.98+ns.length*0.002;if(sc>best){best=sc;why='동의어 완전일치';}}
    else if(r0.includes(ns)||ns.includes(r0)){const r=Math.min(ns.length,r0.length)/Math.max(ns.length,r0.length);const sc=0.72+0.24*r;if(sc>best){best=sc;why='동의어 부분일치';}}
    else{const d=dice(r0,ns);if(d*0.9>best){best=d*0.9;why='동의어 유사';}}}}
  // 2) 표준명 유사도
  const d2=dice(rawFull,norm(std.name));if(d2*0.85>best){best=d2*0.85;why='표준명 유사';}
  // 3) 단위 정합
  const u=normUnit(row.unit);let unitNote='';
  if(u&&std.unit){if(u===std.unit){best=best+0.04;}else{best*=0.55;unitNote=`단위 불일치(${u}≠${std.unit})`;}}
  return {score:Math.min(100,Math.round(best*100)),rank:best,why:unitNote?`${why} · ${unitNote}`:why,unitMismatch:!!unitNote};
}
function mapRow(row,settings){
  const cands=STD.map(s=>({std:s,...scoreItem(row,s)})).sort((a,b)=>b.rank-a.rank).slice(0,3);
  const top=cands[0];
  let status='unmapped';
  if(top.score>=settings.thresholds.auto)status='auto';else if(top.score>=settings.thresholds.review)status='review';
  return {...row,cands,mapped:status==='unmapped'?null:top.std.code,score:top.score,status,manual:false,crews:top.std.nc||1};
}

 5:[0.20,12,25,3.5,42,2.6,0],6:[0.26,14,28,3,54,2.3,0],7:[0.34,20,31.5,2.8,60,2.3,0],8:[0.32,22,32.5,2.8,58,2.2,0],
 9:[0.24,16,27.5,3,56,2.2,0],10:[0.13,10,22,3.5,48,2.2,0],11:[0.12,7,13,4,46,2.4,0.01],12:[0.10,5,5.5,4,44,2.5,0.05]};
const STATION_ADJ={daegu:{t:0,rain:1,wind:1},gumi:{t:-0.6,rain:1.05,wind:1.1}};
function feelsLike(Ta,RH){ // 기상청 여름철 체감온도 (Stull 습구온도 기반)
  const Tw=Ta*Math.atan(0.151977*Math.sqrt(RH+8.313659))+Math.atan(Ta+RH)-Math.atan(RH-1.67633)+0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH)-4.686035;
  return -0.2442+0.55399*Tw+0.45535*Ta-0.0022*Tw*Tw+0.00278*Tw*Ta+3.0;
}
const WX_CACHE={};
function weatherData(siteId){
  if(WX_CACHE[siteId])return WX_CACHE[siteId];
  const adj=STATION_ADJ[siteId]||STATION_ADJ.daegu;const rnd=seeded(siteId==='daegu'?20160101:20279);const days=[];
  for(let y=2016;y<=2025;y++){const yearAdj=(y-2016)*0.06; // 완만한 온난화 추세
    for(let m=1;m<=12;m++){const [rp,rm,tm,ts,rh,wm,sp]=CLIMO[m];const dim=new Date(y,m,0).getDate();
      let wet=false;
      for(let d=1;d<=dim;d++){
        const p=rp*(wet?1.6:0.85);wet=rnd()<p;
        const rain=wet?Math.max(0.1,Math.round((-rm*Math.log(1-rnd()*0.98))*10)/10):0;
        const tmax=Math.round((tm+adj.t+yearAdj+gauss(rnd)*ts-(wet?2.5:0))*10)/10;
        const tmin=Math.round((tmax-(8+gauss(rnd)*2))*10)/10;
        const hum=Math.min(98,Math.max(20,Math.round(rh+(wet?18:0)+gauss(rnd)*8)));
        const wind=Math.round(Math.max(0.5,(wm*adj.wind)*Math.exp(gauss(rnd)*0.45)*(m>=3&&m<=4?1.25:1))*10)/10;
        const snow=(sp>0&&rnd()<sp)?Math.round((0.5+rnd()*6)*10)/10:0;
        const feels=Math.round(feelsLike(tmax,hum)*10)/10;
        days.push({y,m,d,rain,tmax,tmin,hum,wind,snow,feels});
      }}}
  WX_CACHE[siteId]=days;return days;
}

const HOL_NAME={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
function isPublicHoliday(y,m,d){const md=`${pad(m)}-${pad(d)}`;if(FIXED.includes(md))return HOL_NAME[md];if((LUNAR[y]||[]).includes(md))return '명절·대체';
  // 어린이날·삼일절·광복절·개천절·한글날·성탄절 대체공휴일(2021~)
  if(y>=2022){const dt=new Date(y,m-1,d);const dow=dt.getDay();if(dow===1){for(const k of[1,2]){const p=addDays(dt,-k);const pmd=`${pad(p.getMonth()+1)}-${pad(p.getDate())}`;if(['03-01','05-05','08-15','10-03','10-09','12-25','01-01'].includes(pmd)&&(k===1||p.getDay()===6))return '대체공휴일';}}}
  return null;}
function dayOff(dt,hs){const dow=dt.getDay();if(hs.sunday&&dow===0)return '일요일';if(hs.saturday&&dow===6)return '토요일';if(hs.public){const n=isPublicHoliday(dt.getFullYear(),dt.getMonth()+1,dt.getDate());if(n)return n;}return null;}

/* ---------- 8. 비작업일수 엔진 ---------- */
function evalRules(day,rules){const hit=[];for(const r of rules){if(!r.enabled)continue;const v=day[r.field];if(r.op==='>='?v>=r.value:v<=r.value)hit.push(r.id);}return hit;}
function nonWorking(siteId,settings){
  const days=weatherData(siteId);const rules=settings.rules;const hs=settings.holiday;
  const perYM={};const byRule={};rules.forEach(r=>byRule[r.id]=0);let wxTotal=0,wxOnHoliday=0,holTotal=0;
  for(const day of days){const key=`${day.y}-${day.m}`;perYM[key]=perYM[key]||{wx:0,hol:0,overlap:0,days:0};const rec=perYM[key];rec.days++;
    const hit=evalRules(day,rules);const dt=new Date(day.y,day.m-1,day.d);const off=dayOff(dt,hs);
    if(off){rec.hol++;holTotal++;}
    if(hit.length){wxTotal++;hit.forEach(id=>byRule[id]++);if(off){rec.overlap++;wxOnHoliday++;if(!hs.dedupe)rec.wx++;}else rec.wx++;}
  }
  const monthly=[];for(let m=1;m<=12;m++){let wx=0,hol=0,ov=0,cnt=0;for(let y=2016;y<=2025;y++){const r=perYM[`${y}-${m}`];wx+=r.wx;hol+=r.hol;ov+=r.overlap;cnt++;}
    const byR={};rules.forEach(r=>byR[r.id]=0);
    for(const day of days){if(day.m!==m)continue;const hit=evalRules(day,rules);if(!hit.length)continue;const off=dayOff(new Date(day.y,m-1,day.d),hs);if(off&&hs.dedupe)continue;hit.forEach(id=>byR[id]+=1/cnt);}
    monthly.push({m,wx:wx/cnt,hol:hol/cnt,overlap:ov/cnt,byRule:byR});}
  const annualWx=monthly.reduce((a,b)=>a+b.wx,0);
  return {monthly,annualWx,byRule,wxTotal,wxOnHoliday,holTotal,years:10,days:days.length};
}

/* ---------- 9. 작업일수 & CPM ---------- */
const stdBy=code=>STD.find(s=>s.code===code);
function activityKey(row){const std=row.mapped?stdBy(row.mapped):null;if(std&&std.code==='T-03')return '되메우기';if(std)return std.cat;return row.group||'기타';}
const ACT_ORDER=['가설공사','철거공사','토공사','지정공사','철근콘크리트공사','양생·검측','조적공사','방수공사','미장공사','되메우기','배수공사','포장공사','부대공사','기타'];
const DEFAULT_PRED={'가설공사':[],'철거공사':['가설공사'],'토공사':['철거공사'],'지정공사':['토공사'],'철근콘크리트공사':['지정공사'],'양생·검측':['철근콘크리트공사'],'조적공사':['양생·검측'],'방수공사':['양생·검측'],'미장공사':['조적공사'],'되메우기':['방수공사'],'배수공사':['되메우기'],'포장공사':['배수공사'],'부대공사':['포장공사'],'기타':['부대공사','미장공사']};
function workdays(row){const std=row.mapped?stdBy(row.mapped):null;if(!std)return null;const days=row.qty/(std.prod*(row.crews||1));return {raw:days,days:Math.max(1,Math.ceil(days-1e-9)),std};}
function buildActivities(rows,settings,preds){
  const groups={};for(const r of rows){const wd=workdays(r);if(!wd)continue;const k=activityKey(r);groups[k]=groups[k]||{key:k,items:[],net:0};groups[k].items.push({...r,wd});groups[k].net+=wd.days;}
  const acts=[];for(const k of ACT_ORDER){if(!groups[k]&&k!=='양생·검측')continue;
    if(k==='양생·검측'){if(!groups['철근콘크리트공사'])continue;acts.push({key:k,items:[],net:0,indirect:settings.indirect.curing,adj:0,dur:settings.indirect.curing,note:'콘크리트 양생 및 검측(간접작업일)'});continue;}
    const g=groups[k];const insp=settings.indirect.inspectionPerActivity;const adjRate=(S.site.urban?settings.adjust.urban:0)+(S.site.small?settings.adjust.small:0);const adj=Math.ceil(g.net*adjRate/100-1e-9);
    acts.push({...g,indirect:insp,adj,dur:g.net+insp+adj,note:`검측 ${insp}일 + 보정 ${adj}일`});}
  for(const k of Object.keys(groups))if(!ACT_ORDER.includes(k)){const g=groups[k];acts.push({...g,indirect:0,adj:0,dur:g.net,note:''});}
  const keys=new Set(acts.map(a=>a.key));
  for(const a of acts){const p=(preds[a.key]||DEFAULT_PRED[a.key]||[]).filter(x=>keys.has(x)&&x!==a.key);a.pred=p;}
  return acts;
}
function cpm(acts){ // Forward/Backward pass (topological)
  const by={};acts.forEach(a=>by[a.key]=a);const order=[];const seen=new Set();
  const visit=(a,stack=new Set())=>{if(seen.has(a.key))return;if(stack.has(a.key))throw new Error('순환 참조: '+a.key);stack.add(a.key);a.pred.forEach(p=>visit(by[p],stack));stack.delete(a.key);seen.add(a.key);order.push(a);};
  acts.forEach(a=>visit(a));
  for(const a of order){a.es=a.pred.length?Math.max(...a.pred.map(p=>by[p].ef)):0;a.ef=a.es+a.dur;}
  const total=Math.max(0,...order.map(a=>a.ef));
  for(const a of [...order].reverse()){const succ=order.filter(x=>x.pred.includes(a.key));a.lf=succ.length?Math.min(...succ.map(s=>s.ls)):total;a.ls=a.lf-a.dur;a.float=a.ls-a.es;a.critical=a.float===0;}
  return {order,total};
}
/* 캘린더 환산: 작업일 인덱스 → 실제 날짜 (휴일·기상비작업일 건너뜀) */
function calendarize(startStr,workDaysNeeded,settings,nw){
  const start=new Date(startStr+'T00:00:00');const hs=settings.holiday;const days=[];let cur=new Date(start);
  for(let i=0;i<settings.period.prep;i++){days.push({date:new Date(cur),kind:'prep',label:'준비기간'});cur=addDays(cur,1);}
  let count=0;const monthPlan={};
  while(count<workDaysNeeded&&days.length<2000){
    const y=cur.getFullYear(),m=cur.getMonth()+1;const key=`${y}-${m}`;
    if(!monthPlan[key]){const dim=new Date(y,m,0).getDate();const cand=[];for(let d=1;d<=dim;d++){const dt=new Date(y,m-1,d);if(!dayOff(dt,hs))cand.push(d);}
      const n=Math.min(cand.length,Math.round(nw.monthly[m-1].wx));const set=new Set();for(let i=0;i<n;i++)set.add(cand[Math.floor((i+0.5)*cand.length/n)]);monthPlan[key]=set;}
    const off=dayOff(cur,hs);
    if(off)days.push({date:new Date(cur),kind:'hol',label:off});
    else if(monthPlan[key].has(cur.getDate()))days.push({date:new Date(cur),kind:'wx',label:'기상 비작업일(예상)'});
    else{count++;days.push({date:new Date(cur),kind:'work',label:`작업일 ${count}`,idx:count});}
    cur=addDays(cur,1);
  }
  for(let i=0;i<settings.period.cleanup;i++){days.push({date:new Date(cur),kind:'clean',label:'정리기간'});cur=addDays(cur,1);}
  const end=days[days.length-1].date;const cnt=k=>days.filter(d=>d.kind===k).length;
  return {days,start,end,total:days.length,prep:cnt('prep'),work:cnt('work'),hol:cnt('hol'),wx:cnt('wx'),clean:cnt('clean')};
}
