<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공사기간 적정성 검토 자동화 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);letter-spacing:0.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(250,93,0,0.35);}50%{opacity:0.75;box-shadow:0 0 0 6px rgba(250,93,0,0);}}
@keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes growBar{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}

.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;height:60px;padding:0 24px;background:var(--n0);border-bottom:1px solid var(--n3);}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--n10);flex-shrink:0;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--n1);border:1px solid var(--n3);font-size:13px;font-weight:600;color:var(--n9);}
.project-switcher:hover{border-color:var(--n5);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--n7);}
.nav-link.active{color:var(--m700);background:var(--m50);}
.nav-link:hover:not(.active){background:var(--n2);color:var(--n9);}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--n7);position:relative;}
.icon-btn:hover{background:var(--n2);color:var(--n9);}
.notif-badge{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--m600);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}

.tab-bar{display:flex;gap:4px;padding:0 24px;background:var(--n0);border-bottom:1px solid var(--n3);overflow-x:auto;}
.tab{padding:12px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tab.active{color:var(--m700);border-bottom-color:var(--m600);}
.tab:hover:not(.active){color:var(--n9);}

.content{max-width:1280px;margin:0 auto;padding:24px;width:100%;}
.status-strip{display:flex;align-items:center;gap:0;background:var(--n1);border:1px solid var(--n3);border-radius:14px;padding:14px 20px;margin-bottom:20px;overflow-x:auto;animation:fadeInUp 0.4s ease both;}
.stat-item{display:flex;align-items:center;gap:10px;padding:0 22px;border-right:1px solid var(--n3);white-space:nowrap;}
.stat-item:last-child{border-right:none;}
.stat-item .s-icon{width:30px;height:30px;border-radius:8px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-item .s-label{font-size:12px;color:var(--n7);}
.stat-item .s-value{font-size:16px;font-weight:700;color:var(--n10);}
.stat-item.live .s-icon{background:var(--m50);color:var(--m700);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--m600);animation:pulseDot 1.8s infinite;flex-shrink:0;}

.grid-main{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
@media (max-width:980px){.grid-main{grid-template-columns:1fr;}}

.card{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:24px;animation:fadeInUp 0.45s ease both;}
.card + .card{margin-top:20px;}
.card-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:17px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px;}
.card-desc{font-size:13px;color:var(--n7);margin-top:2px;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:16px;font-size:14px;font-weight:600;transition:transform 0.15s, box-shadow 0.15s;}
.btn-primary{background:var(--m600);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.18);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(250,93,0,0.28);}
.btn-ghost{background:var(--n2);color:var(--n9);}
.btn-ghost:hover{background:var(--n3);}
.btn-outline{background:transparent;border:1px solid var(--n4);color:var(--n9);}
.btn-outline:hover{border-color:var(--n6);}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.dropzone{border:2px dashed var(--n4);border-radius:16px;padding:30px 20px;text-align:center;transition:border-color 0.15s, background 0.15s;}
.dropzone.drag{border-color:var(--m600);background:var(--m50);}
.dropzone .dz-icon{width:44px;height:44px;border-radius:12px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:9px 10px;color:var(--n7);font-weight:600;font-size:12px;border-bottom:1px solid var(--n3);white-space:nowrap;}
td{padding:11px 10px;border-bottom:1px solid var(--n2);color:var(--n9);}
tr.row-clickable:hover{background:var(--n2);cursor:pointer;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.pill-mapped{background:var(--s1-bg);color:var(--s1-text);}
.pill-review{background:var(--n2);color:var(--n8);}
.pill-unmapped{background:var(--s2-bg);color:var(--s2-text);}
.sim-bar-wrap{width:64px;height:5px;border-radius:99px;background:var(--n3);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.sim-bar{height:100%;background:var(--m600);border-radius:99px;transform-origin:left;animation:growBar 0.6s ease both;}

.rail-list{display:flex;flex-direction:column;gap:8px;}
.rail-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:14px;background:var(--n0);border:1px solid var(--n3);text-align:left;transition:border-color .15s, background .15s;}
.rail-item:hover{border-color:var(--n5);background:var(--n2);}
.rail-item .ri-icon{width:32px;height:32px;border-radius:9px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rail-item.urgent .ri-icon{background:var(--s2-bg);color:var(--s2-text);}
.rail-item .ri-title{font-size:13.5px;font-weight:700;color:var(--n10);line-height:1.4;}
.rail-item .ri-sub{font-size:12px;color:var(--n7);margin-top:2px;}

.nav-quick{display:flex;flex-direction:column;gap:8px;}
.nav-quick-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--n3);background:var(--n0);text-align:left;transition:all .15s;}
.nav-quick-btn:hover{border-color:var(--m300);background:var(--m50);transform:translateX(2px);}
.nav-quick-btn .nq-icon{width:34px;height:34px;border-radius:10px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-quick-btn:hover .nq-icon{background:var(--m100);color:var(--m700);}
.nav-quick-btn .nq-text{font-size:13.5px;font-weight:700;color:var(--n10);line-height:1.35;}

.quickjump-strip{margin-top:24px;padding:18px 20px;border-radius:16px;background:var(--n1);border:1px solid var(--n3);}
.quickjump-title{font-size:12.5px;font-weight:700;color:var(--n7);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.quickjump-row{display:flex;flex-wrap:wrap;gap:8px;}
.quickjump-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:1px solid var(--n3);background:var(--n0);font-size:12.5px;font-weight:600;color:var(--n8);}
.quickjump-btn:hover{border-color:var(--m300);background:var(--m50);color:var(--m700);}

.mini-widgets{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px;}
@media (max-width:980px){.mini-widgets{grid-template-columns:1fr;}}
.timeline-log{display:flex;flex-direction:column;gap:0;}
.log-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--n2);}
.log-row:last-child{border-bottom:none;}
.log-dot{width:8px;height:8px;border-radius:50%;background:var(--n5);margin-top:5px;flex-shrink:0;}
.log-dot.ok{background:var(--s1);}
.log-body .log-title{font-size:13px;font-weight:600;color:var(--n9);}
.log-body .log-time{font-size:11.5px;color:var(--n6);}

.threshold-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--n2);}
.threshold-row:last-child{border-bottom:none;}
input[type=range]{accent-color:var(--m600);width:140px;}
input[type=text],input[type=number]{padding:9px 12px;border-radius:12px;border:1px solid var(--n4);font-size:13.5px;color:var(--n9);background:var(--n0);}
input[type=text]:focus,input[type=number]:focus{outline:2px solid var(--m300);outline-offset:1px;border-color:var(--m500);}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:var(--n2);color:var(--n8);font-size:12.5px;font-weight:600;}
.chip.active{background:var(--m600);color:#fff;}

.gantt-wrap{overflow-x:auto;}
.gantt-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
.gantt-label{width:150px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--n9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gantt-track{position:relative;flex:1;height:22px;background:var(--n2);border-radius:8px;min-width:420px;}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:8px;background:var(--n5);display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;transition:transform .15s;animation:slideInRight .5s ease both;}
.gantt-bar.critical{background:var(--m600);}
.gantt-bar:hover{transform:scaleY(1.15);}
.gantt-float{position:absolute;top:0;height:100%;border-radius:8px;background:repeating-linear-gradient(45deg,var(--n3),var(--n3) 4px,transparent 4px,transparent 8px);}

.skeleton{background:linear-gradient(90deg,var(--n2) 25%,var(--n3) 37%,var(--n2) 63%);background-size:400px 100%;animation:shimmer 1.3s infinite linear;border-radius:10px;}

.evidence-card{border:1px solid var(--n3);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--n0);}
.evidence-num{font-size:20px;font-weight:800;color:var(--n10);}
.evidence-tag{font-size:11.5px;color:var(--m700);background:var(--m50);padding:2px 8px;border-radius:999px;font-weight:700;}

.modal-overlay{position:fixed;inset:0;background:rgba(29,30,28,0.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeInUp 0.2s ease both;}
.modal-box{background:var(--n1);border-radius:20px;width:520px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-close{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n2);}

.drawer-overlay{position:fixed;inset:0;background:rgba(29,30,28,0.4);z-index:100;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--n1);box-shadow:-8px 0 30px rgba(0,0,0,0.15);padding:26px;overflow-y:auto;animation:slideInRight 0.28s cubic-bezier(.2,.8,.3,1) both;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:200;display:flex;align-items:center;gap:8px;animation:toastIn 0.28s ease both;box-shadow:0 10px 30px rgba(0,0,0,0.25);}

.empty-state{text-align:center;padding:40px 20px;color:var(--n7);}
.empty-state svg{margin-bottom:10px;color:var(--n5);}

.search-hero{display:flex;gap:10px;margin-bottom:20px;}
.search-hero input{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--n4);font-size:14px;}
.result-card{border:1px solid var(--n3);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--n0);animation:fadeInUp 0.35s ease both;}
.result-title{font-weight:700;font-size:14px;color:var(--n10);}
.result-meta{font-size:12px;color:var(--n7);margin-top:3px;}

h1,h2,h3{margin:0;}
p{margin:0;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, PieChart, Pie, Cell, LineChart, Line } = Recharts;

function Icon({ name, size = 18, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ nameAttr: 'data-lucide' });
  });
  return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
}

function Toast({ message, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 2400);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="toast">
      <Icon name="check-circle" size={16} />
      <span>{message}</span>
    </div>
  );
}

function Modal({ title, onClose, children, width }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={width ? { width } : {}} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
          <h3 style={{ fontSize: 18, fontWeight: 800 }}>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Drawer({ title, onClose, children }) {
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <h3 style={{ fontSize: 18, fontWeight: 800 }}>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

            <div className="log-row"><div className="log-dot ok"></div><div className="log-body"><div className="log-title">내역서 A동_1차.xlsx 파싱 완료 (128행)</div><div className="log-time">40분 전 · 업로드</div></div></div>

  function recollect() {

          <div className="card-desc" style={{ marginBottom: 14 }}>강수량 기준과 고온 기준을 구분해 표시합니다 (공휴일 중복 {excludeHoliday ? '제외됨' : '포함'}).</div>

            </BarChart>
          </ResponsiveContainer>
          <div style={{ textAlign: 'center', marginTop: 8, fontSize: 13, color: 'var(--n7)' }}>연간 비작업일수 합계 <strong style={{ color: 'var(--n10)' }}>{total}일</strong></div>

      </div>
    </React.Fragment>
  );

          <div className="skeleton" style={{ height: 14, marginBottom: 8 }}></div>
          <div className="skeleton" style={{ height: 14, marginBottom: 8 }}></div>
          <div className="skeleton" style={{ height: 14, width: '80%' }}></div>
        </div>
      )}
      {status === 'done' && (
        <div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 14, marginBottom: 18 }}>
            <div className="evidence-card"><span className="evidence-tag">산정 총 공기</span><div className="evidence-num" style={{ marginTop: 8 }}>72일</div></div>
            <div className="evidence-card"><span className="evidence-tag">비작업일수</span><div className="evidence-num" style={{ marginTop: 8 }}>18일</div></div>
            <div className="evidence-card"><span className="evidence-tag">공고 대비 여유</span><div className="evidence-num" style={{ marginTop: 8 }}>+8일</div></div>
          </div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>1. 산정 개요</div>
          <p style={{ fontSize: 13.5, color: 'var(--n8)', lineHeight: 1.7, marginBottom: 16 }}>
            내역서 128개 공종을 표준품셈 명칭으로 매핑(정합률 91%)하여 순작업일수 54일을 산출하고, 현장 위치(대구광역시 달서구) 최근 10년 기상 자료 기반 비작업일수 18일을 반영하였습니다. CPM 분석 결과 주공정선은 가설공사 → 토공사 → 기초 콘크리트 → 골조 2층 순으로 이어지며 총 공기는 72일로 산정됩니다.
          </p>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>2. 산정 근거표</div>
          <table style={{ marginBottom: 16 }}>
            <thead><tr><th>항목</th><th>산출값</th><th>근거</th></tr></thead>
            <tbody>
              <tr><td>순작업일수</td><td>54일</td><td>표준품셈 생산성 기준 × 매핑 수량</td></tr>
              <tr><td>비작업일수</td><td>18일</td><td>기상청 API 강수·고온 임계값 룰 엔진</td></tr>
              <tr><td>간접·보정일수</td><td>4일</td><td>도심지 소규모 현장 보정계수 적용</td></tr>
            </tbody>
          </table>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="btn btn-primary" onClick={() => showToast('보고서를 PDF로 내보냈습니다.')}><Icon name="download" size={15} /> PDF 다운로드</button>
            <button className="btn btn-outline" onClick={generate}><Icon name="refresh-cw" size={15} /> 최신 데이터로 재생성</button>
          </div>
        </div>
      )}
    </div>
  );
}

function StandardsScreen({ showToast }) {
  const [q, setQ] = useState('');
  const [applied, setApplied] = useState('');
  const filtered = STANDARD_DB.filter(s => s.name.includes(applied) || s.category.includes(applied));
  return (
    <div className="card">
      <div className="card-title" style={{ marginBottom: 4 }}><Icon name="database" size={18} /> 표준품셈 검색</div>
      <div className="card-desc" style={{ marginBottom: 16 }}>벡터 DB에 임베딩된 표준품셈 자료를 RAG 방식으로 검색합니다.</div>
      <div className="search-hero">
        <input type="text" placeholder="공종명 또는 분류로 검색 (예: 굴착, 콘크리트)" value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && setApplied(q)} />
        <button className="btn btn-primary" onClick={() => { setApplied(q); showToast('표준품셈 벡터 검색을 실행했습니다.'); }}><Icon name="search" size={15} /> 검색</button>
      </div>
      {filtered.map((s, i) => (
        <div key={i} className="result-card">
          <div>
            <div className="result-title">{s.name}</div>
            <div className="result-meta">{s.category} · 생산성 기준 {s.unit}</div>
          </div>
          <span className="pill pill-mapped"><Icon name="database" size={12} /> 벡터 검색</span>
        </div>
      ))}
      {filtered.length === 0 && <div className="empty-state"><Icon name="search-x" size={36} /><div>일치하는 표준품셈 항목이 없습니다.</div></div>}
    </div>
  );
}

function QuickJumpStrip({ setScreen }) {
  return (
    <div className="quickjump-strip">
      <div className="quickjump-title"><Icon name="compass" size={14} /> 다른 화면 바로가기</div>
      <div className="quickjump-row">
        <button className="quickjump-btn" onClick={() => setScreen('weather')}><Icon name="cloud-rain" size={14} />기상 데이터 연동 및 비작업일수 자동 계산</button>
        <button className="quickjump-btn" onClick={() => setScreen('schedule')}><Icon name="git-branch" size={14} />CPM 공정표 및 간트차트 자동 생성</button>
        <button className="quickjump-btn" onClick={() => setScreen('report')}><Icon name="file-text" size={14} />공사기간 적정성 검토 보고서 자동 생성</button>
        <button className="quickjump-btn" onClick={() => setScreen('standards')}><Icon name="search" size={14} />표준품셈 검색</button>
      </div>
    </div>
  );
}

const PAGE_TITLES = {
  main: '공사기간 검토 개요',
  weather: '기상 분석',
  schedule: '공정표',
  report: '검토보고서',
  standards: '표준품셈 검색',
};

const TABS = [
  { id: 'main', label: '개요', icon: 'layout-dashboard' },
  { id: 'weather', label: '기상 분석', icon: 'cloud-rain' },
  { id: 'schedule', label: '공정표', icon: 'git-branch' },
  { id: 'report', label: '검토보고서', icon: 'file-text' },
  { id: 'standards', label: '표준품셈', icon: 'database' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [toast, setToast] = useState(null);
  const showToast = (msg) => setToast(msg);

  return (
    <div data-archetype="topbar-analytics" style={{ width: '100%', minHeight: '100vh' }}>
      <header className="app-header">
        <div className="brand"><div className="brand-mark"><Icon name="hard-hat" size={16} /></div>공기검토 콘솔</div>
        <div className="project-switcher"><Icon name="building-2" size={14} />샘플건설 A현장 <Icon name="chevron-down" size={14} /></div>
        <nav className="global-nav">
          <a className="nav-link active" onClick={() => setScreen('main')}>대시보드</a>
          <a className="nav-link" onClick={() => showToast('현장관리 화면은 데모 범위 밖입니다.')}>현장관리</a>
          <a className="nav-link" onClick={() => showToast('설정 화면은 데모 범위 밖입니다.')}>설정</a>
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => showToast('전체 항목을 검색할 수 있습니다.')}><Icon name="search" size={17} /></button>
          <button className="icon-btn" onClick={() => showToast('새 알림 2건이 있습니다.')}><Icon name="bell" size={17} /><span className="notif-badge"></span></button>
          <div className="avatar">이</div>
        </div>
      </header>

      <nav className="tab-bar" role="tablist">
        <button role="tab" aria-selected={screen === 'main'} className={"tab" + (screen === 'main' ? ' active' : '')} onClick={() => setScreen('main')}>
          <Icon name="layout-dashboard" size={15} />개요
        </button>
        <button role="tab" aria-selected={screen === 'weather'} className={"tab" + (screen === 'weather' ? ' active' : '')} onClick={() => setScreen('weather')}>
          <Icon name="cloud-rain" size={15} />기상 분석
        </button>
        <button role="tab" aria-selected={screen === 'schedule'} className={"tab" + (screen === 'schedule' ? ' active' : '')} onClick={() => setScreen('schedule')}>
          <Icon name="git-branch" size={15} />공정표
        </button>
        <button role="tab" aria-selected={screen === 'report'} className={"tab" + (screen === 'report' ? ' active' : '')} onClick={() => setScreen('report')}>
          <Icon name="file-text" size={15} />검토보고서
        </button>
        <button role="tab" aria-selected={screen === 'standards'} className={"tab" + (screen === 'standards' ? ' active' : '')} onClick={() => setScreen('standards')}>
          <Icon name="database" size={15} />표준품셈
        </button>
      </nav>

      <main className="content">
        <h1 style={{ fontSize: 32, fontWeight: 800, letterSpacing: '0.36px', color: 'var(--n10)', marginBottom: 18 }}>{PAGE_TITLES[screen]}</h1>
        {screen === 'main' && <MainScreen setScreen={setScreen} showToast={showToast} />}
        {screen === 'weather' && <WeatherScreen showToast={showToast} />}
        {screen === 'schedule' && <ScheduleScreen showToast={showToast} />}
        {screen === 'report' && <ReportScreen showToast={showToast} />}
        {screen === 'standards' && <StandardsScreen showToast={showToast} />}
        <QuickJumpStrip setScreen={setScreen} />
      </main>

      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
