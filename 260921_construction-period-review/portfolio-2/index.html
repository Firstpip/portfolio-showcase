<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 현장 공사기간 검토 관리 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, light) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#273b62;
  --n0:#ffffff; --n1:#e5e5e7; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#95979e; --n7:#71747a; --n8:#53565a; --n9:#36373a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n2);color:var(--n10);}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeStagger{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardDrop{0%{transform:scale(1.04) rotate(1deg);box-shadow:0 14px 30px rgba(30,30,32,0.18);}100%{transform:scale(1) rotate(0);box-shadow:0 2px 10px rgba(30,30,32,0.06);}}
@keyframes badgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
@keyframes drawerSlide{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes ringGrow{from{stroke-dashoffset:340;}to{stroke-dashoffset:var(--ring-offset,120);}}
@keyframes toastPop{from{opacity:0;transform:translateY(14px) scale(0.94);}to{opacity:1;transform:translateY(0) scale(1);}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;}
.board-header{display:flex;align-items:center;gap:16px;padding:18px 28px;background:var(--n0);border-bottom:1px solid var(--n3);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;flex-shrink:0;}
.brand-mark{width:30px;height:30px;border-radius:9999px;background:linear-gradient(135deg, var(--m500), var(--m700));display:flex;align-items:center;justify-content:center;color:#fff;}
.board-title-wrap{position:relative;}
.board-title-wrap::before{content:'';position:absolute;left:-14px;top:-6px;width:6px;height:34px;border-radius:4px;background:linear-gradient(180deg, var(--m400), var(--m700));}
.board-title{font-size:20px;font-weight:800;color:var(--n10);}
.board-sub{font-size:12.5px;color:var(--n7);margin-top:2px;}
.pillnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px;}
.pillnav button{padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:700;color:var(--n7);background:var(--n2);display:flex;align-items:center;gap:6px;}
.pillnav button.active{background:var(--m500);color:#fff;}
.pillnav button:hover:not(.active){background:var(--n3);}
.spacer{flex:1;}
.header-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n2);position:relative;}
.icon-btn:hover{background:var(--n3);}
.notif-badge{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--m500);animation:badgePulse 1.6s infinite;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--m100);color:var(--m700);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:9999px;font-size:13.5px;font-weight:700;transition:transform .15s, box-shadow .15s;}
.btn-primary{background:var(--m500);color:#fff;box-shadow:0 4px 14px rgba(86,131,218,0.25);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(86,131,218,0.32);}
.btn-outline{background:var(--n0);border:1px solid var(--n4);color:var(--n9);}
.btn-outline:hover{background:var(--n2);}
.btn-ghost{background:var(--n2);color:var(--n8);}
.btn-sm{padding:7px 14px;font-size:12.5px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.content{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:24px 28px;}

.board-layout{display:flex;gap:22px;align-items:flex-start;}
.board-scroll{display:flex;gap:16px;overflow-x:auto;flex:1;padding-bottom:8px;}
.column{width:280px;flex-shrink:0;background:var(--n0);border-radius:18px;padding:14px;border:1px solid var(--n3);}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;font-weight:800;font-size:14px;color:var(--n9);}
.count{background:var(--n2);color:var(--n8);font-size:12px;font-weight:800;padding:2px 10px;border-radius:9999px;}
.card{background:var(--n0);border:1px solid var(--n3);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(30,30,32,0.06);animation:fadeStagger .4s ease both;transition:transform .15s, box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,30,32,0.10);cursor:pointer;}
.card.dropped{animation:cardDrop .4s ease both;}
.card-title{font-size:13.5px;font-weight:700;color:var(--n10);line-height:1.4;margin-bottom:10px;}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;background:var(--n2);color:var(--n8);}
.tag.risk-high{background:var(--s2-bg);color:var(--s2-text);}
.tag.risk-mid{background:var(--s3-bg);color:var(--s3-text);}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.priority-dot{width:8px;height:8px;border-radius:50%;}
.priority-dot.high{background:var(--s2);}
.priority-dot.mid{background:var(--s3);}
.priority-dot.low{background:var(--n5);}
.due{font-size:11px;color:var(--n6);}
.due.overdue{color:var(--s2-text);font-weight:700;}
.move-actions{display:flex;gap:6px;margin-top:10px;}
.move-btn{flex:1;padding:6px 0;border-radius:9999px;background:var(--n2);color:var(--n7);font-size:11px;font-weight:700;text-align:center;}
.move-btn:hover{background:var(--m50);color:var(--m700);}

.matrix-side{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}
.side-card{background:var(--n0);border-radius:18px;padding:18px;border:1px solid var(--n3);}
.side-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.filter-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--n2);}
.filter-row:last-child{border-bottom:none;}
.toggle{width:38px;height:22px;border-radius:9999px;background:var(--n3);position:relative;transition:background .15s;flex-shrink:0;}
.toggle.on{background:var(--m500);}
.toggle-dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .toggle-dot{left:18px;}
.matrix-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.matrix-cell{border-radius:12px;padding:12px;background:var(--n2);text-align:center;}
.matrix-cell .mc-num{font-size:40px;font-weight:800;color:var(--n9);line-height:1.1;}
.matrix-cell .mc-label{font-size:11px;color:var(--n7);margin-top:2px;}
.matrix-cell.hot{background:var(--m50);}
.matrix-cell.hot .mc-num{color:var(--m700);}

.tabbed-panel{background:var(--n0);border-radius:20px;border:1px solid var(--n3);padding:24px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.panel-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;}
.panel-desc{font-size:13px;color:var(--n7);margin-top:2px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px;color:var(--n7);font-weight:700;font-size:12px;border-bottom:1px solid var(--n3);}
td{padding:12px 10px;border-bottom:1px solid var(--n2);color:var(--n9);}
tr.row-clickable:hover{background:var(--n2);cursor:pointer;}

.approval-chain{display:flex;align-items:center;gap:0;margin-bottom:24px;overflow-x:auto;}
.chain-step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:100px;}
.chain-circle{width:38px;height:38px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.chain-circle.done{background:var(--s1);color:#fff;}
.chain-circle.current{background:var(--m500);color:#fff;box-shadow:0 0 0 5px var(--m50);}
.chain-line{flex:1;height:2px;background:var(--n3);min-width:30px;}
.chain-line.done{background:var(--s1);}
.chain-label{font-size:11.5px;font-weight:700;color:var(--n8);text-align:center;}

.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--n2);}
.comment:last-child{border-bottom:none;}
.comment-body{flex:1;}
.comment-name{font-size:12.5px;font-weight:800;}
.comment-time{font-size:11px;color:var(--n6);margin-left:6px;}
.comment-text{font-size:13px;color:var(--n8);margin-top:3px;}
.comment-input{display:flex;gap:8px;margin-top:14px;}
.comment-input input{flex:1;padding:11px 16px;border-radius:9999px;border:1px solid var(--n4);font-size:13.5px;}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.diff-col{background:var(--n2);border-radius:14px;padding:16px;}
.diff-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--n3);}
.diff-row:last-child{border-bottom:none;}
.diff-changed{color:var(--m700);font-weight:800;}

.region-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px;}
.region-cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:transform .15s;}
.region-cell:hover{transform:scale(1.05);cursor:pointer;}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--n7);margin-bottom:16px;}
.legend-swatch{width:14px;height:14px;border-radius:4px;}

.member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--n2);}
.member-row:last-child{border-bottom:none;}
.role-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;background:var(--n2);color:var(--n8);}
.role-badge.admin{background:var(--m50);color:var(--m700);}

.modal-overlay{position:fixed;inset:0;background:rgba(30,30,32,0.45);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:var(--n0);border-radius:22px;width:540px;max-width:92vw;max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.28);animation:fadeStagger .25s ease both;}
.modal-close{width:32px;height:32px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n2);}
.modal-close:hover{background:var(--n3);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--n9);color:#fff;padding:13px 24px;border-radius:9999px;font-size:13.5px;font-weight:700;z-index:200;display:flex;align-items:center;gap:8px;animation:toastPop .28s ease both;box-shadow:0 12px 30px rgba(0,0,0,0.25);}

h1,h2,h3{margin:0;}
p{margin:0;}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const { RadialBarChart, RadialBar, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid } = Recharts;

function Ico({ name, size = 16, style }) {
  return <i className={"ph ph-" + name} style={{ fontSize: size, lineHeight: 1, ...style }}></i>;
}

function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2400); return () => clearTimeout(t); }, []);
  return <div className="toast"><Ico name="check-circle" size={16} /><span>{message}</span></div>;
}

function Modal({ title, onClose, children, width }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={width ? { width } : {}} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
          <h3 style={{ fontSize: 18, fontWeight: 800 }}>{title}</h3>
          <button className="modal-close" onClick={onClose}><Ico name="x" size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

const INITIAL_CARDS = {
  intake: [
    { id: 1, name: '동탄 물류센터 증축 검토', tag: '신규', risk: 'mid', assignee: '김', due: '9/28', overdue: false },
    { id: 2, name: '세종 행정타운 3구역', tag: '재검토', risk: 'low', assignee: '박', due: '10/02', overdue: false },
  ],
  review: [
    { id: 3, name: '대구 달서 근린생활시설', tag: '진행중', risk: 'high', assignee: '이', due: '9/24', overdue: true },
    { id: 4, name: '부산 해운대 리모델링', tag: '진행중', risk: 'mid', assignee: '최', due: '9/30', overdue: false },
    { id: 5, name: '인천 송도 오피스텔', tag: '진행중', risk: 'low', assignee: '김', due: '10/05', overdue: false },
  ],
  drafting: [
    { id: 6, name: '광주 첨단산업단지 2공구', tag: '작성중', risk: 'mid', assignee: '박', due: '9/26', overdue: false },
    { id: 7, name: '청주 물류터미널', tag: '작성중', risk: 'low', assignee: '정', due: '10/01', overdue: false },
  ],
  done: [
    { id: 8, name: '천안 산업단지 A블록', tag: '승인완료', risk: 'low', assignee: '이', due: '9/18', overdue: false },
    { id: 9, name: '전주 신시가지 조성', tag: '승인완료', risk: 'low', assignee: '최', due: '9/15', overdue: false },
    { id: 10, name: '창원 자유무역지역', tag: '승인완료', risk: 'mid', assignee: '김', due: '9/12', overdue: false },
  ],
};
const COLUMN_META = [
  { key: 'intake', label: '접수' },
  { key: 'review', label: '검토중' },
  { key: 'drafting', label: '보고서작성' },
  { key: 'done', label: '승인완료' },
];
const FLOW = ['intake', 'review', 'drafting', 'done'];

const VERSIONS = {
  v2: { 순작업일수: '54일', 비작업일수: '18일', 총공기: '72일', 매핑정합률: '91%' },
  v1: { 순작업일수: '58일', 비작업일수: '15일', 총공기: '73일', 매핑정합률: '84%' },
};

const REGIONS = [
  { name: '서울', risk: 2 }, { name: '경기', risk: 3 }, { name: '인천', risk: 1 }, { name: '대전', risk: 2 }, { name: '세종', risk: 1 },
  { name: '대구', risk: 4 }, { name: '부산', risk: 2 }, { name: '광주', risk: 1 }, { name: '울산', risk: 3 }, { name: '강원', risk: 2 },
];
const RISK_COLOR = { 1: '#e7eefa', 2: '#93b0e7', 3: '#5683da', 4: '#37548c' };

const STAGE_TIME = [
  { stage: '접수', days: 1.2 }, { stage: '검토중', days: 4.8 }, { stage: '보고서작성', days: 2.6 }, { stage: '승인완료', days: 1.5 },
];

function MainScreen({ showToast, setDetail }) {
  const [cards, setCards] = useState(INITIAL_CARDS);
  const [filterHigh, setFilterHigh] = useState(false);
  const [autoAssign, setAutoAssign] = useState(true);
  const [justMoved, setJustMoved] = useState(null);

  function moveCard(colKey, cardId, dir) {
    const idx = FLOW.indexOf(colKey);
    const target = FLOW[idx + dir];
    if (!target) return;
    const card = cards[colKey].find(c => c.id === cardId);
    const next = { ...cards, [colKey]: cards[colKey].filter(c => c.id !== cardId), [target]: [...cards[target], card] };
    setCards(next);
    setJustMoved(cardId);
    showToast(card.name + ' 항목이 "' + COLUMN_META.find(c => c.key === target).label + '" 단계로 이동했습니다.');
    setTimeout(() => setJustMoved(null), 450);
  }

  const totalCards = Object.values(cards).flat().length;
  const highCount = Object.values(cards).flat().filter(c => c.risk === 'high').length;

  function renderCards(colKey, list) {
    return list.map(c => (
      <div key={c.id} className={"card" + (justMoved === c.id ? ' dropped' : '')} onClick={() => setDetail(c)}>
        <div className="card-title">{c.name}</div>
        <div className="card-meta">
          <span className={"tag" + (c.risk === 'high' ? ' risk-high' : c.risk === 'mid' ? ' risk-mid' : '')}>{c.tag}</span>
          <span className="avatar-sm">{c.assignee}</span>
        </div>
        <div className="card-foot">
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <span className={"priority-dot " + c.risk}></span>
            <span className={"due" + (c.overdue ? ' overdue' : '')}>{c.due} 마감</span>
          </span>
        </div>
        <div className="move-actions" onClick={e => e.stopPropagation()}>
          {FLOW.indexOf(colKey) > 0 && <button className="move-btn" onClick={() => moveCard(colKey, c.id, -1)}>◀ 이전</button>}
          {FLOW.indexOf(colKey) < 3 && <button className="move-btn" onClick={() => moveCard(colKey, c.id, 1)}>다음 ▶</button>}
        </div>
      </div>
    ));
  }

  const listIntake = cards.intake.filter(c => !filterHigh || c.risk === 'high');
  const listReview = cards.review.filter(c => !filterHigh || c.risk === 'high');
  const listDrafting = cards.drafting.filter(c => !filterHigh || c.risk === 'high');
  const listDone = cards.done.filter(c => !filterHigh || c.risk === 'high');

  return (
    <div className="board-layout">
      <div className="board-scroll">
        <section className="column">
          <div className="col-header">접수<span className="count">{listIntake.length}</span></div>
          {renderCards('intake', listIntake)}
          {listIntake.length === 0 && <div style={{ fontSize: 12.5, color: 'var(--n6)', textAlign: 'center', padding: '18px 0' }}>표시할 항목 없음</div>}
        </section>
        <section className="column">
          <div className="col-header">검토중<span className="count">{listReview.length}</span></div>
          {renderCards('review', listReview)}
          {listReview.length === 0 && <div style={{ fontSize: 12.5, color: 'var(--n6)', textAlign: 'center', padding: '18px 0' }}>표시할 항목 없음</div>}
        </section>
        <section className="column">
          <div className="col-header">보고서작성<span className="count">{listDrafting.length}</span></div>
          {renderCards('drafting', listDrafting)}
          {listDrafting.length === 0 && <div style={{ fontSize: 12.5, color: 'var(--n6)', textAlign: 'center', padding: '18px 0' }}>표시할 항목 없음</div>}
        </section>
        <section className="column">
          <div className="col-header">승인완료<span className="count">{listDone.length}</span></div>
          {renderCards('done', listDone)}
          {listDone.length === 0 && <div style={{ fontSize: 12.5, color: 'var(--n6)', textAlign: 'center', padding: '18px 0' }}>표시할 항목 없음</div>}
        </section>
      </div>

      <div className="matrix-side">
        <div className="side-card">
          <div className="side-title"><Ico name="funnel" size={17} /> 우선순위 필터</div>
          <div className="filter-row">
            <span style={{ fontSize: 13 }}>고위험 건만 보기</span>
            <div className={"toggle" + (filterHigh ? ' on' : '')} onClick={() => setFilterHigh(!filterHigh)}><div className="toggle-dot"></div></div>
          </div>
          <div className="filter-row">
            <span style={{ fontSize: 13 }}>담당자 자동 배정</span>
            <div className={"toggle" + (autoAssign ? ' on' : '')} onClick={() => { setAutoAssign(!autoAssign); showToast('담당자 자동 배정을 ' + (!autoAssign ? '켰습니다' : '껐습니다') + '.'); }}><div className="toggle-dot"></div></div>
          </div>
        </div>
        <div className="side-card">
          <div className="side-title"><Ico name="squares-four" size={17} /> 빈도 × 영향 매트릭스</div>
          <div className="matrix-grid">
            <div className="matrix-cell hot"><div className="mc-num">{highCount}</div><div className="mc-label">고위험 건</div></div>
            <div className="matrix-cell"><div className="mc-num">{totalCards}</div><div className="mc-label">전체 건수</div></div>
            <div className="matrix-cell"><div className="mc-num">3.8일</div><div className="mc-label">평균 검토 소요</div></div>
            <div className="matrix-cell"><div className="mc-num">91%</div><div className="mc-label">기한 준수율</div></div>
          </div>
        </div>
        <div className="side-card">
          <div className="side-title"><Ico name="plus-circle" size={17} /> 새 검토 등록</div>
          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => showToast('새 검토 건 등록 폼은 접수 컬럼에 카드로 추가됩니다.')}>
            <Ico name="plus" size={15} /> 현장 추가
          </button>
        </div>
      </div>
    </div>
  );
}

function ArchiveScreen() {
  const [selA, setSelA] = useState('v1');
  const [selB, setSelB] = useState('v2');
  const a = VERSIONS[selA], b = VERSIONS[selB];
  return (
    <div className="tabbed-panel">
      <div className="panel-head">
        <div>
          <div className="panel-title"><Ico name="clock-counter-clockwise" size={19} /> 검토 이력 아카이브 및 버전 비교</div>
          <div className="panel-desc">완료된 검토 건의 보고서 버전을 비교해 산정 근거 변경분을 확인합니다.</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <select value={selA} onChange={e => setSelA(e.target.value)} style={{ padding: '9px 14px', borderRadius: 9999, border: '1px solid var(--n4)' }}>
            <option value="v1">v1 (9/02)</option><option value="v2">v2 (9/18)</option>
          </select>
          <select value={selB} onChange={e => setSelB(e.target.value)} style={{ padding: '9px 14px', borderRadius: 9999, border: '1px solid var(--n4)' }}>
            <option value="v1">v1 (9/02)</option><option value="v2">v2 (9/18)</option>
          </select>
        </div>
      </div>
      <div className="diff-grid">
        <div className="diff-col">
          <div style={{ fontWeight: 800, marginBottom: 10 }}>{selA} 스냅샷</div>
          {Object.entries(a).map(([k, v]) => (
            <div className="diff-row" key={k}><span>{k}</span><span className={v !== b[k] ? 'diff-changed' : ''}>{v}</span></div>
          ))}
        </div>
        <div className="diff-col">
          <div style={{ fontWeight: 800, marginBottom: 10 }}>{selB} 스냅샷</div>
          {Object.entries(b).map(([k, v]) => (
            <div className="diff-row" key={k}><span>{k}</span><span className={v !== a[k] ? 'diff-changed' : ''}>{v}</span></div>
          ))}
        </div>
      </div>
      <div style={{ marginTop: 18, fontSize: 12.5, color: 'var(--n7)' }}>강조 표시된 값은 두 버전 간 변경된 산정값입니다. PDF 원본은 AWS S3에 버전별로 보관됩니다.</div>
    </div>
  );
}

function ApprovalScreen({ showToast }) {
  const [step, setStep] = useState(1);
  const [comments, setComments] = useState([
    { name: '김민수', time: '2시간 전', text: '비작업일수 산정 근거를 조금 더 상세히 부탁드립니다.' },
    { name: '박서연', time: '40분 전', text: '갱신했습니다. 8월 폭염 구간 기준을 반영했어요.' },
  ]);
  const [input, setInput] = useState('');
  const STEPS = ['담당자 작성', '팀장 검토', '최종 승인'];

  function submitComment() {
    if (!input.trim()) return;
    setComments([...comments, { name: '나', time: '방금 전', text: input }]);
    setInput('');
  }

  return (
    <div className="tabbed-panel">
      <div className="panel-head">
        <div>
          <div className="panel-title"><Ico name="path" size={19} /> 팀 협업 및 승인 워크플로우</div>
          <div className="panel-desc">역할 기반 다단계 승인 체인과 카드별 코멘트로 협업합니다.</div>
        </div>
      </div>
      <div className="approval-chain">
        {STEPS.map((s, i) => (
          <React.Fragment key={s}>
            {i > 0 && <div className={"chain-line" + (i <= step - 1 ? ' done' : '')}></div>}
            <div className="chain-step">
              <div className={"chain-circle" + (i + 1 < step ? ' done' : i + 1 === step ? ' current' : '')}>
                {i + 1 < step ? <Ico name="check" size={16} /> : i + 1}
              </div>
              <div className="chain-label">{s}</div>
            </div>
          </React.Fragment>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 10, marginBottom: 22 }}>
        <button className="btn btn-primary" disabled={step >= 3} onClick={() => { setStep(step + 1); showToast('다음 승인 단계로 진행했습니다.'); }}>
          <Ico name="check-circle" size={15} /> 승인하고 다음 단계로
        </button>
        <button className="btn btn-outline" disabled={step <= 1} onClick={() => { setStep(step - 1); showToast('반려 사유와 함께 이전 단계로 회귀했습니다.'); }}>
          <Ico name="arrow-counter-clockwise" size={15} /> 반려
        </button>
      </div>
      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 4 }}>코멘트 스레드</div>
      <div className="panel-desc" style={{ marginBottom: 12 }}>카드별 코멘트는 실시간(WebSocket)으로 동기화됩니다.</div>
      {comments.map((c, i) => (
        <div className="comment" key={i}>
          <div className="avatar-sm" style={{ width: 30, height: 30 }}>{c.name[0]}</div>
          <div className="comment-body"><span className="comment-name">{c.name}</span><span className="comment-time">{c.time}</span><div className="comment-text">{c.text}</div></div>
        </div>
      ))}
      <div className="comment-input">
        <input type="text" placeholder="코멘트를 입력하세요" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && submitComment()} />
        <button className="btn btn-primary btn-sm" onClick={submitComment}><Ico name="paper-plane-tilt" size={14} /></button>
      </div>
    </div>
  );
}

function AnalyticsScreen({ setDetailRegion }) {
  return (
    <div className="tabbed-panel">
      <div className="panel-head">
        <div>
          <div className="panel-title"><Ico name="chart-donut" size={19} /> 현장별 리스크 관리자 분석 대시보드</div>
          <div className="panel-desc">지역별 비작업일수 리스크와 단계별 처리 소요를 한눈에 파악합니다.</div>
        </div>
      </div>
      <div className="legend">
        <span>리스크 낮음</span>
        {[1, 2, 3, 4].map(l => <span key={l} className="legend-swatch" style={{ background: RISK_COLOR[l] }}></span>)}
        <span>리스크 높음</span>
      </div>
      <div className="region-grid">
        {REGIONS.map(r => (
          <div key={r.name} className="region-cell" style={{ background: RISK_COLOR[r.risk] }} onClick={() => setDetailRegion(r)}>
            {r.name}
          </div>
        ))}
      </div>
      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 12 }}>단계별 평균 처리 소요일</div>
      <ResponsiveContainer width="100%" height={220}>
        <BarChart data={STAGE_TIME} layout="vertical">
          <CartesianGrid strokeDasharray="3 3" stroke="#e5e5e6" horizontal={false} />
          <XAxis type="number" tick={{ fontSize: 12, fill: '#71747a' }} axisLine={false} tickLine={false} />
          <YAxis type="category" dataKey="stage" tick={{ fontSize: 12.5, fill: '#36373a' }} axisLine={false} tickLine={false} width={90} />
          <Tooltip />
          <Bar dataKey="days" fill="#5683da" radius={[0, 8, 8, 0]} />
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

function TeamScreen({ showToast }) {
  const MEMBERS = [
    { name: '김민수', role: '관리자', badge: 'admin', email: 'minsu.k@sample.dev' },
    { name: '박서연', role: '팀장 검토자', badge: '', email: 'seoyeon.p@sample.dev' },
    { name: '이도현', role: '담당 작성자', badge: '', email: 'dohyun.l@sample.dev' },
    { name: '최지우', role: '담당 작성자', badge: '', email: 'jiwoo.c@sample.dev' },

      <div className="panel-head">

          <div className="panel-desc">역할별 승인 권한 범위를 관리합니다.</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => showToast('팀원 초대 메일을 발송했습니다.')}><Ico name="user-plus" size={14} /> 팀원 초대</button>

const NAV_ITEMS = [
  { id: 'main', label: '현황판', icon: 'kanban' },
  { id: 'archive', label: '검토 이력 아카이브 및 버전 비교', icon: 'clock-counter-clockwise' },
  { id: 'approval', label: '팀 협업 및 승인 워크플로우', icon: 'path' },
  { id: 'analytics', label: '현장별 리스크 관리자 분석 대시보드', icon: 'chart-donut' },
  { id: 'team', label: '팀원 및 권한 관리', icon: 'users-three' },
];

function App() {
  const [screen, setScreen] = useState('main');
  const [toast, setToast] = useState(null);
  const [detail, setDetail] = useState(null);
  const [detailRegion, setDetailRegion] = useState(null);
  const showToast = (msg) => setToast(msg);

  return (
    <div data-archetype="kanban-board" className="shell">
      <header className="board-header">
        <div className="brand"><div className="brand-mark"><Ico name="hard-hat" size={16} style={{ color: '#fff' }} /></div>공기검토 허브</div>
        <div style={{ width: 1, height: 26, background: 'var(--n3)' }}></div>
        <div className="board-title-wrap" style={{ marginLeft: 8 }}>
          <div className="board-title">다중 현장 검토 현황판</div>
          <div className="board-sub">전체 10건 진행 중</div>
        </div>
        <div className="pillnav">
          {NAV_ITEMS.map(n => (
            <button key={n.id} className={screen === n.id ? 'active' : ''} onClick={() => setScreen(n.id)}>
              <Ico name={n.icon} size={14} />{n.label}
            </button>
          ))}
        </div>
        <div className="spacer"></div>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => showToast('전체 항목을 검색할 수 있습니다.')}><Ico name="magnifying-glass" size={16} /></button>
          <button className="icon-btn" onClick={() => showToast('새 알림 3건이 있습니다.')}><Ico name="bell" size={16} /><span className="notif-badge"></span></button>
          <div className="avatar">김</div>
        </div>
      </header>

      <main className="content">
        {screen === 'main' && <MainScreen showToast={showToast} setDetail={setDetail} />}
        {screen === 'archive' && <ArchiveScreen />}
        {screen === 'approval' && <ApprovalScreen showToast={showToast} />}
        {screen === 'analytics' && <AnalyticsScreen setDetailRegion={setDetailRegion} />}
        {screen === 'team' && <TeamScreen showToast={showToast} />}
      </main>

      {detail && (
        <Modal title={detail.name} onClose={() => setDetail(null)}>
          <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
            <span className={"tag" + (detail.risk === 'high' ? ' risk-high' : detail.risk === 'mid' ? ' risk-mid' : '')}>{detail.tag}</span>
            <span className="tag"><Ico name="calendar" size={12} /> {detail.due} 마감</span>
            <span className="tag"><Ico name="user" size={12} /> 담당 {detail.assignee}</span>
          </div>
          <div style={{ fontSize: 13.5, color: 'var(--n8)', lineHeight: 1.7, marginBottom: 16 }}>
            해당 현장 검토 건의 세부 산정 데이터와 코멘트 이력은 승인 워크플로우 화면에서 이어서 확인할 수 있습니다.
          </div>
          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { setDetail(null); setScreen('approval'); }}>
            <Ico name="path" size={15} /> 승인 워크플로우로 이동
          </button>
        </Modal>
      )}

      {detailRegion && (
        <Modal title={detailRegion.name + ' 지역 리스크'} onClose={() => setDetailRegion(null)}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <div className="matrix-cell hot"><div className="mc-num">{detailRegion.risk}단계</div><div className="mc-label">리스크 등급</div></div>
            <div className="matrix-cell"><div className="mc-num">{detailRegion.risk * 2}건</div><div className="mc-label">진행 중 검토</div></div>
          </div>
        </Modal>
      )}

      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
