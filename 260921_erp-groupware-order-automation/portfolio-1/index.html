<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고 판정 발주 자동화 시스템 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --radius-btn:16px; --radius-card:20px; --radius-tag:999px;
  --shadow-sm: rgba(0,0,0,0.2) 0px 1px 4px 0px;
  --shadow-warm: rgba(250,93,0,0.16) 6px 4px 24px 0px;
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;letter-spacing:0.005em;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.55;transform:scale(0.85);}}
@keyframes barGrow{from{width:0;}}
@keyframes modalIn{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ── layout shell ── */
.shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:20;}
.sidebar-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--n3);flex-shrink:0;}
.sidebar-brand .mark{width:28px;height:28px;border-radius:8px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sidebar-brand .name{font-weight:700;font-size:15px;color:var(--n10);}
.sidebar-brand .sub{font-size:11px;color:var(--n7);}
.sidebar-cmdk-hint{margin:14px 16px 6px;}
.cmdk-hint-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--n2);border:1px solid var(--n3);border-radius:10px;color:var(--n7);font-size:13px;transition:background 0.15s;}
.cmdk-hint-btn:hover{background:var(--n3);}
.kbd{font-size:11px;padding:2px 6px;background:var(--n1);border:1px solid var(--n4);border-radius:5px;color:var(--n8);font-family:inherit;}
.sidebar-nav{padding:12px 12px 0;display:flex;flex-direction:column;gap:2px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--n8);text-align:left;width:100%;transition:background 0.12s,color 0.12s;border-left:3px solid transparent;}
.sidebar-link:hover{background:var(--n2);color:var(--n10);}
.sidebar-link.active{background:var(--m50);color:var(--m700);font-weight:600;border-left:3px solid var(--m600);}
.sidebar-link svg{flex-shrink:0;width:17px;height:17px;}
.sidebar-section{padding:18px 12px 0;}
.sidebar-section-title{font-size:11px;font-weight:600;color:var(--n6);text-transform:uppercase;letter-spacing:0.04em;padding:0 12px 6px;}
.sidebar-user{margin-top:auto;padding:14px 16px;border-top:1px solid var(--n3);display:flex;align-items:center;gap:10px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
.sidebar-user .info .u-name{font-size:13px;font-weight:600;color:var(--n10);}
.sidebar-user .info .u-role{font-size:11px;color:var(--n7);}

.main{margin-left:260px;flex:1;min-width:0;width:calc(100% - 260px);min-height:100vh;display:flex;flex-direction:column;}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--n3);background:var(--n0);position:sticky;top:0;z-index:10;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n7);}
.breadcrumb a{color:var(--n7);}
.breadcrumb .current{color:var(--n10);font-weight:600;}
.breadcrumb .divider{color:var(--n5);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn-cmdk{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;background:var(--n1);border:1px solid var(--n3);color:var(--n7);font-size:12.5px;}
.btn-cmdk:hover{background:var(--n2);}
.btn-primary{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-btn);background:var(--m600);color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);transition:background 0.15s,transform 0.1s;}
.btn-primary:hover{background:var(--m700);}
.btn-primary:active{transform:scale(0.97);}
.btn-ghost{padding:9px 16px;border-radius:var(--radius-btn);background:var(--n1);border:1px solid var(--n3);color:var(--n9);font-size:13.5px;font-weight:600;transition:background 0.15s;}
.btn-ghost:hover{background:var(--n2);}
.btn-outline-sm{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;border:1px solid var(--n3);background:var(--n1);color:var(--n8);font-size:12.5px;font-weight:600;}
.btn-outline-sm:hover{background:var(--n2);}

.content{padding:24px;flex:1;width:100%;animation:fadeInUp 0.3s ease-out;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:34px;font-weight:700;color:var(--n10);letter-spacing:-0.015em;line-height:1.15;}
.page-desc{font-size:13px;color:var(--n7);margin-top:4px;max-width:640px;line-height:1.5;}

.card{background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);}
.panel-warm{box-shadow:var(--shadow-warm);}

/* master-detail composition */
.md-wrap{display:flex;gap:16px;align-items:flex-start;width:100%;}
.md-list{width:380px;flex-shrink:0;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);overflow:hidden;}
.md-list-head{padding:14px 16px;border-bottom:1px solid var(--n3);display:flex;flex-direction:column;gap:10px;}
.search-box{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--n2);border-radius:10px;}
.search-box input{background:transparent;border:none;outline:none;font-size:13px;color:var(--n10);width:100%;}
.search-box svg{color:var(--n6);flex-shrink:0;}
.filter-row{display:flex;align-items:center;justify-content:space-between;}
.toggle-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--n8);}
.switch{width:34px;height:19px;border-radius:999px;background:var(--n4);position:relative;transition:background 0.15s;flex-shrink:0;}
.switch.on{background:var(--m600);}
.switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left 0.15s;}
.switch.on .knob{left:17px;}
.sort-select{font-size:12px;color:var(--n7);background:var(--n1);border:1px solid var(--n3);border-radius:7px;padding:4px 8px;}
.md-items{max-height:640px;overflow-y:auto;}
.md-item{padding:12px 16px;border-bottom:1px solid var(--n2);cursor:pointer;transition:background 0.12s;position:relative;}
.md-item:hover{background:var(--n0);}
.md-item.selected{background:var(--m50);}
.md-item.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m600);}
.md-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.md-item-name{font-size:13.5px;font-weight:600;color:var(--n10);}
.md-item-factory{font-size:11.5px;color:var(--n6);margin-top:2px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-tag);font-size:11px;font-weight:600;}
.badge-need{background:var(--n10);color:#fff;}
.badge-ok{background:var(--n2);color:var(--n7);}
.md-item-meta{display:flex;gap:12px;font-size:11.5px;color:var(--n7);}

.detail-panel{flex:1;min-width:0;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-card);padding:28px 32px;}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--n6);gap:10px;}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--n3);margin-bottom:20px;}
.detail-head h2{font-size:20px;font-weight:700;margin:0 0 6px;color:var(--n10);}
.detail-sub{font-size:12.5px;color:var(--n7);display:flex;gap:14px;flex-wrap:wrap;}
.formula-box{background:var(--n0);border:1px solid var(--n3);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
.formula-title{font-size:12px;font-weight:700;color:var(--n7);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;}
.formula-eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:14px;color:var(--n9);font-variant-numeric:tabular-nums;}
.formula-eq .op{color:var(--n5);font-weight:700;}
.formula-eq .val{font-weight:700;color:var(--n10);}
.formula-result{margin-top:12px;padding-top:12px;border-top:1px dashed var(--n4);display:flex;align-items:center;justify-content:space-between;}
.formula-result .r-label{font-size:12.5px;color:var(--n7);}
.formula-result .r-val{font-size:19px;font-weight:800;color:var(--n10);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.mini-stat{background:var(--n0);border:1px solid var(--n3);border-radius:12px;padding:14px 16px;}
.mini-stat .lbl{font-size:11.5px;color:var(--n7);margin-bottom:4px;}
.mini-stat .val{font-size:17px;font-weight:700;color:var(--n10);}
.section-block{margin-bottom:22px;}
.section-block h4{font-size:13px;font-weight:700;color:var(--n9);margin:0 0 10px;display:flex;align-items:center;gap:7px;}
.timeline-row{display:flex;gap:10px;font-size:12.5px;color:var(--n8);padding:8px 0;border-bottom:1px solid var(--n2);}
.timeline-row:last-child{border-bottom:none;}
.timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--n5);margin-top:5px;flex-shrink:0;}
.timeline-dot.done{background:var(--s1);}
.detail-actions{display:flex;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--n3);}

/* KPI status strip (used sparingly, not the whole layout) */
.status-mini{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.status-mini .pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--n7);background:var(--n1);border:1px solid var(--n3);padding:6px 12px;border-radius:999px;}
.status-mini .pill b{color:var(--n10);font-weight:700;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--s1);animation:pulseDot 1.8s infinite ease-in-out;}

/* ecount-order screen */
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;width:100%;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--n8);margin-bottom:6px;}
.form-group select,.form-group input{width:100%;padding:10px 12px;border:1px solid var(--n3);border-radius:12px;font-size:13.5px;color:var(--n10);background:var(--n0);outline:none;}
.form-group select:focus,.form-group input:focus{border-color:var(--m600);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.limit-gauge{margin-bottom:14px;}
.limit-gauge-top{display:flex;justify-content:space-between;font-size:12px;color:var(--n7);margin-bottom:6px;}
.gauge-track{height:7px;background:var(--n3);border-radius:999px;overflow:hidden;}
.gauge-fill{height:100%;background:var(--m600);border-radius:999px;animation:barGrow 0.9s ease-out;}
.gauge-fill.risk{background:var(--s2);}
.warn-banner{display:flex;align-items:flex-start;gap:10px;background:var(--s2-bg);color:var(--s2-text);border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:16px;}
.verify-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.verify-table th{text-align:left;padding:8px 10px;color:var(--n6);font-weight:600;border-bottom:1px solid var(--n3);font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;}
.verify-table td{padding:9px 10px;border-bottom:1px solid var(--n2);color:var(--n9);}
.match-icon{color:var(--s1);}
.mismatch-icon{color:var(--s2);}
.skeleton-row{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--n2) 0%,var(--n3) 50%,var(--n2) 100%);background-size:800px 100%;animation:shimmer 1.3s infinite linear;margin-bottom:8px;}
.order-list-mini{max-height:420px;overflow-y:auto;}
.order-mini-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;border:1px solid var(--n3);margin-bottom:8px;cursor:pointer;transition:background 0.12s,border-color 0.12s;}
.order-mini-item:hover{background:var(--n0);}
.order-mini-item.picked{border-color:var(--m600);background:var(--m50);}
.order-mini-item .om-name{font-size:13px;font-weight:600;color:var(--n10);}
.order-mini-item .om-sub{font-size:11.5px;color:var(--n7);margin-top:2px;}

/* pdf screen */
.pdf-shell{display:flex;gap:20px;width:100%;}
.pdf-side{width:280px;flex-shrink:0;}
.pdf-preview-wrap{flex:1;min-width:0;background:var(--n2);border-radius:18px;padding:28px;display:flex;justify-content:center;}
.pdf-sheet{width:100%;max-width:560px;background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.12);padding:34px 36px;color:#26251f;}
.pdf-head-row{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #26251f;padding-bottom:14px;margin-bottom:16px;}
.pdf-title{font-size:19px;font-weight:800;letter-spacing:0.02em;}
.pdf-meta{font-size:10.5px;color:#8a857f;margin-top:3px;}
.pdf-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px;margin-bottom:16px;}
.pdf-field-grid div{display:flex;justify-content:space-between;border-bottom:1px dotted #d8d4cd;padding-bottom:3px;}
.pdf-field-grid .k{color:#8a857f;}
.pdf-items-table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:16px;}
.pdf-items-table th{background:#f4f1ea;padding:6px 6px;text-align:left;border:1px solid #e2ded5;font-weight:700;}
.pdf-items-table td{padding:6px 6px;border:1px solid #e2ded5;}
.pdf-terms{font-size:10px;color:#5a564f;line-height:1.7;border-top:1px solid #e2ded5;padding-top:10px;}
.pdf-terms b{color:#26251f;}
.version-list{margin-top:14px;}
.version-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--n2);font-size:12px;color:var(--n8);}
.version-row:last-child{border-bottom:none;}
.progress-inline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n7);}
.spin{animation:spinRot 0.8s linear infinite;}
@keyframes spinRot{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* approval screen */
.tab-strip{display:flex;gap:4px;background:var(--n2);border-radius:11px;padding:4px;margin-bottom:18px;width:fit-content;}
.tab-strip button{padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--n7);}
.tab-strip button.active{background:var(--n1);color:var(--n10);box-shadow:var(--shadow-sm);}
.draft-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--n1);border:1px solid var(--n3);border-radius:14px;margin-bottom:10px;transition:box-shadow 0.15s;}
.draft-row:hover{box-shadow:var(--shadow-sm);}
.draft-icon{width:36px;height:36px;border-radius:10px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.draft-body{flex:1;min-width:0;}
.draft-body .d-title{font-size:13.5px;font-weight:600;color:var(--n10);}
.draft-body .d-sub{font-size:11.5px;color:var(--n7);margin-top:2px;}
.status-pill{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;flex-shrink:0;}
.status-pill.done{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.wait{background:var(--n2);color:var(--n7);}
.mail-table,.pi-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.mail-table th,.pi-table th{text-align:left;padding:9px 10px;color:var(--n6);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;border-bottom:1px solid var(--n3);}
.mail-table td,.pi-table td{padding:11px 10px;border-bottom:1px solid var(--n2);color:var(--n9);}
.mail-table tr:hover td,.pi-table tr:hover td{background:var(--n0);}
.upload-zone{border:1.5px dashed var(--n4);border-radius:14px;padding:26px;text-align:center;color:var(--n7);font-size:12.5px;transition:border-color 0.15s,background 0.15s;cursor:pointer;}
.upload-zone:hover{border-color:var(--m400);background:var(--m50);}

/* modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(29,30,28,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--n1);border-radius:20px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;animation:modalIn 0.18s ease-out;box-shadow:0 24px 60px rgba(0,0,0,0.22);}
.modal.wide{max-width:600px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:16px;font-weight:700;margin:0;color:var(--n10);}
.modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n2);}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--n3);}

/* cmdk */
.cmdk-overlay{position:fixed;inset:0;background:rgba(29,30,28,0.45);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:200;}
.cmdk-modal{width:100%;max-width:560px;background:var(--n1);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:modalIn 0.15s ease-out;overflow:hidden;}
.cmdk-input{width:100%;border:none;outline:none;padding:16px 18px;font-size:15px;border-bottom:1px solid var(--n3);color:var(--n10);}
.cmdk-results{max-height:320px;overflow-y:auto;padding:8px;}
.cmdk-group-title{font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:0.04em;padding:10px 10px 4px;}
.cmdk-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--n9);}
.cmdk-item:hover{background:var(--n2);}

/* toast */
.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{display:flex;align-items:center;gap:9px;background:var(--n10);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.25);animation:toastSlide 0.2s ease-out;}
.toast svg{color:var(--s1);flex-shrink:0;}

.empty-hint{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;color:var(--n6);text-align:center;}

@media (max-width: 900px){
  .sidebar{width:220px;}
  .main{margin-left:220px;width:calc(100% - 220px);}
  .md-wrap,.two-col,.pdf-shell{flex-direction:column;}
  .md-list{width:100%;}
  .pdf-side{width:100%;}
  .form-row,.grid-2{grid-template-columns:1fr;}
}
@media (max-width: 600px){
  .sidebar{position:static;width:100%;height:auto;}
  .main{margin-left:0;width:100%;}
  .shell{flex-direction:column;}
  .topbar{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px;}
  .content{padding:16px;}
  .breadcrumb{font-size:12px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

/* ───────── 판정식 순수 함수 (엑셀 공식 1:1 재현) ───────── */
function judgeOrder({availStock, openOrderQty, avgSales, factorIdx, minOrderQty}) {
  const result = availStock + openOrderQty - avgSales * factorIdx;
  const needOrder = result < 0;
  const suggestQty = needOrder ? minOrderQty : 0;
  return { result: Math.round(result), needOrder, suggestQty };
}

const FACTORIES = ['하노이 1공장','다카 3공장','칭다오 협력공장','호치민 2공장','치타공 4공장'];

const ORDERS = [
  { id:'ITM-1042', name:'접이식 캠핑 테이블 M', factory:FACTORIES[0], availStock:120, openOrderQty:40, avgSales:96, factorIdx:1.8, minOrderQty:300, ecount:{registered:true, reread:true, match:true, poNo:'PO-HN1-20260918-002'}, approval:'기안완료' },
  { id:'ITM-2210', name:'보온 텀블러 500ml', factory:FACTORIES[1], availStock:860, openOrderQty:200, avgSales:410, factorIdx:1.5, minOrderQty:500, ecount:{registered:false}, approval:null },
  { id:'ITM-3305', name:'원목 트레이 세트', factory:FACTORIES[2], availStock:35, openOrderQty:0, avgSales:58, factorIdx:2.0, minOrderQty:200, ecount:{registered:false}, approval:null },
  { id:'ITM-1188', name:'접이식 빨래건조대', factory:FACTORIES[3], availStock:410, openOrderQty:80, avgSales:130, factorIdx:1.2, minOrderQty:150, ecount:{registered:true, reread:true, match:false, poNo:'PO-HC2-20260917-005'}, approval:'상신대기' },
  { id:'ITM-4470', name:'스테인리스 밀폐용기 3P', factory:FACTORIES[4], availStock:920, openOrderQty:150, avgSales:305, factorIdx:1.6, minOrderQty:400, ecount:{registered:false}, approval:null },
  { id:'ITM-2901', name:'멀티 수납 선반', factory:FACTORIES[0], availStock:64, openOrderQty:20, avgSales:74, factorIdx:1.4, minOrderQty:250, ecount:{registered:false}, approval:null },
  { id:'ITM-3760', name:'실리콘 주방매트', factory:FACTORIES[2], availStock:540, openOrderQty:60, avgSales:190, factorIdx:1.1, minOrderQty:300, ecount:{registered:false}, approval:null },
  { id:'ITM-1509', name:'미니 서큘레이터', factory:FACTORIES[1], availStock:88, openOrderQty:0, avgSales:112, factorIdx:1.9, minOrderQty:350, ecount:{registered:true, reread:true, match:true, poNo:'PO-DK3-20260916-011'}, approval:'승인완료' },
].map(o => ({...o, ...judgeOrder(o)}));

const num = n => n.toLocaleString('ko-KR');

/* ───────── 공통 컴포넌트 ───────── */
function Icon({name, size=17, className=''}) {
  const ref = useRef(null);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
  return <i data-lucide={name} style={{width:size, height:size}} className={className}></i>;
}

function Toast({toasts}) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div className="toast" key={t.id}>
          <Icon name="check-circle-2" size={16} />
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function Modal({title, onClose, children, wide, footer}) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className={"modal" + (wide ? " wide" : "")} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ───────── CMD-K ───────── */
function CmdK({onClose, onNavigate}) {
  const [q, setQ] = useState('');
  const items = [
    {label:'발주 점검 대시보드', screen:'main', icon:'layout-dashboard'},
    {label:'이카운트 ERP 발주서 자동 등록', screen:'ecount-order', icon:'plug-zap'},
    {label:'발주서 PDF 자동 생성', screen:'pdf', icon:'file-text'},
    {label:'하이웍스 전자결재 자동 기안', screen:'approval', icon:'stamp'},
  ].filter(i => i.label.includes(q));
  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk-modal" onClick={e => e.stopPropagation()}>
        <input className="cmdk-input" autoFocus placeholder="명령 또는 화면 검색…" value={q} onChange={e => setQ(e.target.value)} />
        <div className="cmdk-results">
          <div className="cmdk-group-title">이동</div>
          {items.map(i => (
            <div className="cmdk-item" key={i.screen} onClick={() => { onNavigate(i.screen); onClose(); }}>
              <span style={{display:'flex',alignItems:'center',gap:9}}><Icon name={i.icon} size={15} />{i.label}</span>
              <span className="kbd">⏎</span>
            </div>
          ))}
          {items.length === 0 && <div style={{padding:'20px', color:'var(--n6)', fontSize:13}}>결과 없음</div>}
        </div>
      </div>
    </div>
  );
}

/* ───────── main: 발주 점검 대시보드 (master-detail) ───────── */
function MainScreen({pushToast}) {
  const [query, setQuery] = useState('');
  const [needOnly, setNeedOnly] = useState(true);
  const [sortBy, setSortBy] = useState('urgent');
  const [selectedId, setSelectedId] = useState(ORDERS[0].id);

  const list = useMemo(() => {
    let arr = ORDERS.filter(o => o.name.includes(query) || o.id.includes(query) || o.factory.includes(query));
    if (needOnly) arr = arr.filter(o => o.needOrder);
    arr = [...arr].sort((a,b) => sortBy === 'urgent' ? a.result - b.result : a.name.localeCompare(b.name));
    return arr;
  }, [query, needOnly, sortBy]);

  const selected = ORDERS.find(o => o.id === selectedId) || list[0];

  return (
    <div className="md-wrap">
      <div className="md-list">
        <div className="md-list-head">
          <div className="search-box">
            <Icon name="search" size={15} />
            <input placeholder="품목명·공장 검색" value={query} onChange={e => setQuery(e.target.value)} />
          </div>
          <div className="filter-row">
            <div className="toggle-chip">
              <div className={"switch" + (needOnly ? " on" : "")} onClick={() => setNeedOnly(!needOnly)}><div className="knob"></div></div>
              발주 대상만 보기
            </div>
            <select className="sort-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="urgent">긴급순</option>
              <option value="name">품목명순</option>
            </select>
          </div>
        </div>
        <div className="md-items">
          {list.map(o => (
            <div key={o.id} className={"md-item" + (o.id === selectedId ? " selected" : "")} onClick={() => setSelectedId(o.id)}>
              <div className="md-item-top">
                <span className="md-item-name">{o.name}</span>
                <span className={"badge " + (o.needOrder ? "badge-need" : "badge-ok")}>{o.needOrder ? "발주 필요" : "충분"}</span>
              </div>
              <div className="md-item-factory">{o.factory} · {o.id}</div>
              <div className="md-item-meta">
                <span>판정값 {num(o.result)}</span>
                <span>제안수량 {o.needOrder ? num(o.suggestQty) : '-'}</span>
              </div>
            </div>
          ))}
          {list.length === 0 && <div className="empty-hint"><Icon name="inbox" size={26} /><span>조건에 맞는 품목이 없습니다</span></div>}
        </div>
      </div>

      <div className="detail-panel">
        {!selected ? (
          <div className="detail-empty"><Icon name="mouse-pointer-click" size={28} /><span>좌측 목록에서 품목을 선택하세요</span></div>
        ) : (
          <React.Fragment>
            <div className="detail-head">
              <div>
                <h2>{selected.name}</h2>
                <div className="detail-sub">
                  <span>{selected.id}</span>
                  <span>{selected.factory}</span>
                  <span className={"badge " + (selected.needOrder ? "badge-need" : "badge-ok")}>{selected.needOrder ? "발주 필요" : "재고 충분"}</span>
                </div>
              </div>
              <button className="btn-outline-sm" onClick={() => pushToast('가산 지수를 기준정보에서 수정할 수 있습니다')}>
                <Icon name="sliders-horizontal" size={13} /> 가산지수 조정
              </button>
            </div>

            <div className="formula-box">
              <div className="formula-title">판정식 재현 (엑셀 수식 1:1 대응)</div>
              <div className="formula-eq">
                <span className="val">{num(selected.availStock)}</span><span>가용재고</span>
                <span className="op">+</span>
                <span className="val">{num(selected.openOrderQty)}</span><span>기발주량</span>
                <span className="op">−</span>
                <span className="val">{num(selected.avgSales)}</span><span>월평균판매량</span>
                <span className="op">×</span>
                <span className="val">{selected.factorIdx}</span><span>가산지수</span>
              </div>
              <div className="formula-result">
                <span className="r-label">판정 결과값 (음수 = 발주 대상)</span>
                <span className="r-val">{num(selected.result)}</span>
              </div>
            </div>

            <div className="grid-2">
              <div className="mini-stat"><div className="lbl">최소발주수량</div><div className="val">{num(selected.minOrderQty)}</div></div>
              <div className="mini-stat"><div className="lbl">제안 발주수량</div><div className="val">{selected.needOrder ? num(selected.suggestQty) : '—'}</div></div>
            </div>

            <div className="section-block">
              <h4><Icon name="database" size={14} /> 이카운트 되읽기 검증</h4>
              {selected.ecount.registered ? (
                <div className="timeline-row" style={{border:'1px solid var(--n3)', borderRadius:12, padding:'10px 12px'}}>
                  <div className={"timeline-dot " + (selected.ecount.match ? "done" : "")}></div>
                  <div>
                    <div>발주번호 <b>{selected.ecount.poNo}</b> — 되읽기 {selected.ecount.match ? '일치' : '불일치 감지'}</div>
                    <div style={{color:'var(--n6)', marginTop:2, fontSize:11.5}}>{selected.ecount.match ? '등록 요청값과 ERP 조회값이 동일하게 확인되었습니다' : '수량 필드가 상이하여 담당자 재확인이 필요합니다'}</div>
                  </div>
                </div>
              ) : (
                <div className="empty-hint" style={{padding:'18px 10px'}}><Icon name="clock" size={20} /><span>아직 발주서가 등록되지 않았습니다</span></div>
              )}
            </div>

            <div className="section-block">
              <h4><Icon name="stamp" size={14} /> 전자결재 상태</h4>
              <span className={"status-pill " + (selected.approval === '승인완료' ? 'done' : 'wait')}>
                {selected.approval || '미기안'}
              </span>
            </div>

            <div className="detail-actions">
              <button className="btn-primary" onClick={() => pushToast(selected.name + ' 발주서 등록 화면으로 이동해 주세요')}>
                <Icon name="send" size={14} /> 이카운트로 발주서 등록
              </button>
              <button className="btn-ghost" onClick={() => pushToast('첨부 문서함을 열었습니다 (PI · 발주서 PDF)')}>
                <Icon name="paperclip" size={14} /> 첨부 보기
              </button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ───────── ecount-order: 이카운트 ERP 발주서 자동 등록 ───────── */
function EcountScreen({pushToast}) {
  const pending = ORDERS.filter(o => o.needOrder);
  const [pick, setPick] = useState(pending[0]?.id || null);
  const [warehouse, setWarehouse] = useState('본사 통합창고');
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [stage, setStage] = useState('idle'); // idle | loading | done
  const [callUsage] = useState({input: 61, query: 34});

  const target = ORDERS.find(o => o.id === pick);

  function submit() {
    setConfirmOpen(false);
    setStage('loading');
    setTimeout(() => {
      setStage('done');
      pushToast('발주서 등록 완료 — 되읽기 검증까지 통과했습니다');
    }, 1400);
  }

  return (
    <div className="two-col">
      <div className="card" style={{padding:24}}>
        <h4 style={{margin:'0 0 4px', fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:8}}><Icon name="plug-zap" size={16} />발주서 등록 — 확인 후 전송</h4>
        <p style={{fontSize:12, color:'var(--n7)', margin:'0 0 16px'}}>이카운트 전표는 등록 후 수정·삭제가 불가능합니다. 반드시 확인 단계를 거칩니다.</p>

        {callUsage.input >= 80 && (
          <div className="warn-banner"><Icon name="alert-triangle" size={16} />오늘 입력 호출 한도의 80%를 초과했습니다. 배치 분할 큐로 순차 처리됩니다.</div>
        )}

        <div className="limit-gauge">
          <div className="limit-gauge-top"><span>입력 호출 한도 (1일 5,000줄)</span><span>{callUsage.input}%</span></div>
          <div className="gauge-track"><div className={"gauge-fill" + (callUsage.input >= 80 ? " risk" : "")} style={{width: callUsage.input + '%'}}></div></div>
        </div>
        <div className="limit-gauge">
          <div className="limit-gauge-top"><span>조회 호출 한도 (1시간 6,000건)</span><span>{callUsage.query}%</span></div>
          <div className="gauge-track"><div className="gauge-fill" style={{width: callUsage.query + '%'}}></div></div>
        </div>

        <div className="form-group">
          <label>발주 대상 품목</label>
          <select value={pick || ''} onChange={e => { setPick(e.target.value); setStage('idle'); }}>
            {pending.map(o => <option key={o.id} value={o.id}>{o.name} — {o.factory}</option>)}
          </select>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>출고 창고</label>
            <select value={warehouse} onChange={e => setWarehouse(e.target.value)}>
              <option>본사 통합창고</option>
              <option>수도권 물류센터</option>
              <option>남부 보관창고</option>
            </select>
          </div>
          <div className="form-group">
            <label>발주번호 (자동 채번)</label>
            <input disabled value={target ? `PO-${target.factory.slice(0,2)}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-001` : ''} />
          </div>
        </div>
        <div className="form-group">
          <label>발주 수량</label>
          <input disabled value={target ? num(target.suggestQty) + ' EA (최소발주수량 기준)' : ''} />
        </div>

        <button className="btn-primary" style={{width:'100%', justifyContent:'center'}} disabled={!target || stage==='loading'} onClick={() => setConfirmOpen(true)}>
          <Icon name="shield-check" size={15} /> 확인 후 이카운트에 등록
        </button>
      </div>

      <div className="card" style={{padding:24}}>
        <h4 style={{margin:'0 0 14px', fontSize:15, fontWeight:700}}>등록 · 되읽기 검증 결과</h4>
        {stage === 'idle' && <div className="empty-hint" style={{padding:'50px 10px'}}><Icon name="file-clock" size={26} /><span>등록을 진행하면 결과가 여기 표시됩니다</span></div>}
        {stage === 'loading' && (
          <div>
            <div className="progress-inline" style={{marginBottom:14}}><Icon name="loader-2" size={15} className="spin" />전표 등록 후 되읽기 조회 중…</div>
            <div className="skeleton-row" style={{width:'92%'}}></div>
            <div className="skeleton-row" style={{width:'76%'}}></div>
            <div className="skeleton-row" style={{width:'85%'}}></div>
          </div>
        )}
        {stage === 'done' && target && (
          <table className="verify-table">
            <thead><tr><th>필드</th><th>요청값</th><th>되읽기값</th><th>일치</th></tr></thead>
            <tbody>
              <tr><td>품목코드</td><td>{target.id}</td><td>{target.id}</td><td><Icon name="check" size={14} className="match-icon" /></td></tr>
              <tr><td>발주수량</td><td>{num(target.suggestQty)}</td><td>{num(target.suggestQty)}</td><td><Icon name="check" size={14} className="match-icon" /></td></tr>
              <tr><td>출고창고</td><td>{warehouse}</td><td>{warehouse}</td><td><Icon name="check" size={14} className="match-icon" /></td></tr>
              <tr><td>응답코드</td><td>정상(00)</td><td>정상(00)</td><td><Icon name="check" size={14} className="match-icon" /></td></tr>
            </tbody>
          </table>
        )}
      </div>

      {confirmOpen && (
        <Modal title="발주서 등록 확인" onClose={() => setConfirmOpen(false)} footer={
          <React.Fragment>
            <button className="btn-ghost" onClick={() => setConfirmOpen(false)}>취소</button>
            <button className="btn-primary" onClick={submit}><Icon name="check" size={14} /> 등록 확정</button>
          </React.Fragment>
        }>
          <p style={{fontSize:13.5, lineHeight:1.6, color:'var(--n9)'}}>
            <b>{target?.name}</b> {num(target?.suggestQty || 0)} EA를 이카운트 ERP에 전표로 등록합니다.
            등록 후에는 수정·삭제가 불가능하며, 되읽기 조회로 저장 결과를 즉시 검증합니다.
          </p>
        </Modal>
      )}
    </div>
  );
}

/* ───────── pdf: 발주서 PDF 자동 생성 ───────── */
function PdfScreen({pushToast}) {
  const registered = ORDERS.filter(o => o.ecount.registered);
  const [pick, setPick] = useState(registered[0]?.id || null);
  const [downloading, setDownloading] = useState(false);
  const target = ORDERS.find(o => o.id === pick) || registered[0];

  function download() {
    setDownloading(true);
    setTimeout(() => { setDownloading(false); pushToast('발주서 PDF 다운로드가 완료되었습니다'); }, 1300);
  }

  return (
    <div className="pdf-shell">
      <div className="pdf-side">
        <div className="card" style={{padding:20, marginBottom:16}}>
          <h4 style={{margin:'0 0 12px', fontSize:14, fontWeight:700}}>등록된 발주 건</h4>
          <div className="order-list-mini">
            {registered.map(o => (
              <div key={o.id} className={"order-mini-item" + (o.id === (target && target.id) ? " picked" : "")} onClick={() => setPick(o.id)}>
                <div><div className="om-name">{o.name}</div><div className="om-sub">{o.ecount.poNo}</div></div>
                <Icon name="chevron-right" size={15} />
              </div>
            ))}
          </div>
        </div>
        <div className="card" style={{padding:20}}>
          <h4 style={{margin:'0 0 10px', fontSize:14, fontWeight:700}}>버전 이력</h4>
          <div className="version-list">
            <div className="version-row"><span>v2 · 수량 수정 반영</span><span>2026.09.19</span></div>
            <div className="version-row"><span>v1 · 최초 생성</span><span>2026.09.18</span></div>
          </div>
          <button className="btn-outline-sm" style={{marginTop:12, width:'100%', justifyContent:'center'}} disabled={!target || downloading} onClick={download}>
            {downloading ? <React.Fragment><Icon name="loader-2" size={14} className="spin" />생성 중…</React.Fragment> : <React.Fragment><Icon name="download" size={14} />PDF 다운로드</React.Fragment>}
          </button>
        </div>
      </div>

      <div className="pdf-preview-wrap">
        {!target ? (
          <div className="empty-hint"><Icon name="file-x" size={26} /><span>등록된 발주 건이 없습니다</span></div>
        ) : (
          <div className="pdf-sheet">
            <div className="pdf-head-row">
              <div><div className="pdf-title">PURCHASE ORDER</div><div className="pdf-meta">발주번호 {target.ecount.poNo}</div></div>
              <div style={{fontSize:10, color:'#8a857f', textAlign:'right'}}>발행일<br/>2026.09.21</div>
            </div>
            <div className="pdf-field-grid">
              <div><span className="k">공급처</span><span>{target.factory}</span></div>
              <div><span className="k">품목코드</span><span>{target.id}</span></div>
              <div><span className="k">납기일</span><span>2026.10.15</span></div>
              <div><span className="k">결제조건</span><span>선금 30% / 잔금 70%</span></div>
              <div><span className="k">인코텀즈</span><span>FOB</span></div>
            </div>
            <table className="pdf-items-table">
              <thead><tr><th>No</th><th>품목명</th><th>규격</th><th>수량</th><th>단가</th><th>금액</th></tr></thead>
              <tbody>
                <tr><td>1</td><td>{target.name}</td><td>표준</td><td>{num(target.suggestQty)}</td><td>USD 4.20</td><td>USD {num(Math.round(target.suggestQty*4.2))}</td></tr>
              </tbody>
            </table>
            <div className="pdf-terms">
              <b>거래조건</b> 1) 선적: 부분선적 불가 2) 검수: 선적 전 QC 3) 클레임: 입고 후 7일 이내
              4) 포장: 수출표준포장 5) 보험: 발주처 부보 6) 지연: 지연 시 사전 통지 7) 분쟁: 대한상사중재원
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ───────── approval: 하이웍스 전자결재 자동 기안 ───────── */
function ApprovalScreen({pushToast}) {
  const [tab, setTab] = useState('draft');
  const [drafts, setDrafts] = useState([
    {id:1, type:'발주 품의', ref:'PO-HN1-20260918-002', status:'기안완료', date:'2026.09.18'},
    {id:2, type:'견적송장 명판 날인', ref:'PI-20260917-31', status:'상신대기', date:'2026.09.19'},
    {id:3, type:'선금 지급 요청', ref:'PO-DK3-20260916-011', status:'상신대기', date:'2026.09.16'},
  ]);
  const [createOpen, setCreateOpen] = useState(false);
  const [piDetail, setPiDetail] = useState(null);

  const mails = [
    {to:'하노이 1공장 (구매팀)', at:'2026.09.18 14:02', file:'PO-HN1-20260918-002.pdf', status:'발송완료'},
    {to:'치타공 4공장 (영업팀)', at:'2026.09.17 09:41', file:'PO-CB4-20260917-004.pdf', status:'발송완료'},
  ];
  const pis = [
    {from:'sales@hanoi-fac.example.com', at:'2026.09.19 08:12', file:'PI_HN1_0918.pdf', linked:'PO-HN1-20260918-002'},
    {from:'export@dhaka-fac.example.com', at:'2026.09.16 22:47', file:'PI_DK3_0915.pdf', linked:'PO-DK3-20260916-011'},
  ];

  function createDraft(type) {
    setCreateOpen(false);
    const id = drafts.length + 1;
    setDrafts([{id, type, ref:'PO-신규-' + id, status:'기안완료', date:'2026.09.21'}, ...drafts]);
    pushToast(type + ' 기안이 생성되었습니다 — 담당자 상신 대기');
  }

  return (
    <div>
      <div className="tab-strip">
        <button className={tab==='draft'?'active':''} onClick={() => setTab('draft')}>전자결재 기안</button>
        <button className={tab==='mail'?'active':''} onClick={() => setTab('mail')}>공장 발주 메일</button>
        <button className={tab==='pi'?'active':''} onClick={() => setTab('pi')}>PI 이메일 접수</button>
      </div>

      {tab === 'draft' && (
        <div>
          <div style={{display:'flex', justifyContent:'flex-end', marginBottom:12}}>
            <button className="btn-primary" onClick={() => setCreateOpen(true)}><Icon name="plus" size={14} />기안 생성</button>
          </div>
          {drafts.map(d => (
            <div className="draft-row" key={d.id}>
              <div className="draft-icon"><Icon name="stamp" size={17} /></div>
              <div className="draft-body">
                <div className="d-title">{d.type}</div>
                <div className="d-sub">{d.ref} · {d.date}</div>
              </div>
              <span className={"status-pill " + (d.status === '기안완료' ? 'done' : 'wait')}>{d.status}</span>
            </div>
          ))}
        </div>
      )}

      {tab === 'mail' && (
        <div className="card" style={{padding:0, overflow:'hidden'}}>
          <table className="mail-table">
            <thead><tr><th>수신처</th><th>발송시각</th><th>첨부파일</th><th>상태</th><th></th></tr></thead>
            <tbody>
              {mails.map((m,i) => (
                <tr key={i}>
                  <td>{m.to}</td><td>{m.at}</td><td>{m.file}</td>
                  <td><span className="status-pill done">{m.status}</span></td>
                  <td><button className="btn-outline-sm" onClick={() => pushToast(m.to + '로 메일을 재발송했습니다')}><Icon name="rotate-cw" size={12} />재발송</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === 'pi' && (
        <div>
          <div className="upload-zone" style={{marginBottom:16}} onClick={() => pushToast('PI 파일을 선택했습니다 — 발주 건 연결을 확인해 주세요')}>
            <Icon name="upload-cloud" size={22} />
            <div style={{marginTop:8}}>회신 메일을 직접 전달받지 못한 경우, 여기로 PI 파일을 끌어놓거나 클릭해 업로드합니다</div>
          </div>
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <table className="pi-table">
              <thead><tr><th>발신자</th><th>수신시각</th><th>첨부파일</th><th>연결 발주건</th></tr></thead>
              <tbody>
                {pis.map((p,i) => (
                  <tr key={i} onClick={() => setPiDetail(p)}>
                    <td>{p.from}</td><td>{p.at}</td><td>{p.file}</td><td>{p.linked}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {createOpen && (
        <Modal title="전자결재 기안 생성" onClose={() => setCreateOpen(false)}>
          <p style={{fontSize:12.5, color:'var(--n7)', marginBottom:14}}>기안 유형을 선택하면 양식식별자·본문 HTML·첨부가 자동으로 채워집니다. 최종 상신은 담당자가 직접 진행합니다.</p>
          {['발주 품의','견적송장 명판 날인','선금 지급 요청'].map(t => (
            <div key={t} className="order-mini-item" onClick={() => createDraft(t)}>
              <div className="om-name">{t}</div>
              <Icon name="chevron-right" size={15} />
            </div>
          ))}
        </Modal>
      )}

      {piDetail && (
        <Modal title="PI 접수 상세" onClose={() => setPiDetail(null)} footer={
          <button className="btn-primary" onClick={() => { setPiDetail(null); pushToast('명판 날인 결재로 연결되었습니다'); }}><Icon name="link" size={14} />명판 날인 결재로 연결</button>
        }>
          <div style={{fontSize:13, lineHeight:2, color:'var(--n9)'}}>
            <div>발신자 <b>{piDetail.from}</b></div>
            <div>수신시각 {piDetail.at}</div>
            <div>첨부파일 {piDetail.file}</div>
            <div>연결 발주건 {piDetail.linked}</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── App ───────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  function pushToast(msg) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdkOpen(true); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const NAV = [
    {screen:'main', label:'발주 점검 대시보드', icon:'layout-dashboard'},
    {screen:'ecount-order', label:'이카운트 ERP 발주서 자동 등록', icon:'plug-zap'},
    {screen:'pdf', label:'발주서 PDF 자동 생성', icon:'file-text'},
    {screen:'approval', label:'하이웍스 전자결재 자동 기안', icon:'stamp'},
  ];
  const crumbMap = {main:'발주 점검', 'ecount-order':'ERP 발주서 등록', pdf:'발주서 PDF', approval:'전자결재 기안'};

  return (
    <div className="shell" data-archetype="linear-sidebar-cmdk">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="mark"><Icon name="boxes" size={16} /></div>
          <div><div className="name">오더플로우</div><div className="sub">발주 자동화 콘솔</div></div>
        </div>
        <div className="sidebar-cmdk-hint">
          <button className="cmdk-hint-btn" onClick={() => setCmdkOpen(true)}>
            <span style={{display:'flex',alignItems:'center',gap:7}}><Icon name="search" size={14} />빠른 검색</span>
            <span className="kbd">⌘K</span>
          </button>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n => (
            <button key={n.screen} className={"sidebar-link" + (screen===n.screen ? " active" : "")} onClick={() => setScreen(n.screen)}>
              <Icon name={n.icon} /> {n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-section">
          <div className="sidebar-section-title">연동 상태</div>
          <div style={{padding:'0 12px', fontSize:12, color:'var(--n7)', display:'flex', flexDirection:'column', gap:6}}>
            <span style={{display:'flex',alignItems:'center',gap:7}}><span className="live-dot"></span>이카운트 세션 정상</span>
            <span style={{display:'flex',alignItems:'center',gap:7}}><span className="live-dot"></span>하이웍스 토큰 정상</span>
          </div>
        </div>
        <div className="sidebar-user">
          <div className="avatar">발</div>
          <div className="info"><div className="u-name">발주 담당자</div><div className="u-role">구매물류팀</div></div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div className="breadcrumb">
            <span>발주 자동화</span><span className="divider">/</span><span className="current">{crumbMap[screen]}</span>
          </div>
          <div className="topbar-actions">
            <button className="btn-cmdk" onClick={() => setCmdkOpen(true)}><Icon name="command" size={13} />⌘ K</button>
            <button className="btn-primary" onClick={() => pushToast('새 발주 후보를 재고 판정식으로 즉시 검토합니다')}><Icon name="plus" size={14} />새 발주 검토</button>
          </div>
        </header>
        <div className="content" key={screen}>
          <div className="page-head">
            <div>
              <div className="page-title">{NAV.find(n => n.screen===screen)?.label}</div>
              <div className="page-desc">
                {screen==='main' && '엑셀 판정식을 그대로 재현해 발주가 필요한 품목을 자동으로 검출합니다.'}
                {screen==='ecount-order' && '확인 단계를 거쳐 이카운트 ERP에 전표를 등록하고, 되읽기로 결과를 검증합니다.'}
                {screen==='pdf' && '현행 인쇄 양식과 동일한 발주서를 동적으로 생성합니다.'}
                {screen==='approval' && '발주 품의·명판 날인·선금 지급 요청 기안을 자동 생성하고, 공장 메일·PI 접수까지 연결합니다.'}
              </div>
            </div>
          </div>
          {screen==='main' && <MainScreen pushToast={pushToast} />}
          {screen==='ecount-order' && <EcountScreen pushToast={pushToast} />}
          {screen==='pdf' && <PdfScreen pushToast={pushToast} />}
          {screen==='approval' && <ApprovalScreen pushToast={pushToast} />}
        </div>
      </div>

      {cmdkOpen && <CmdK onClose={() => setCmdkOpen(false)} onNavigate={setScreen} />}
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
