<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발주 운영 관제 플랫폼 — 구현 데모</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, dark) ── */
:root{
  --m50:#e7eefa; --m100:#d0dcf5; --m200:#b3c7ee; --m300:#93b0e7; --m400:#7499e1;
  --m500:#5683da; --m600:#476bb3; --m700:#37548c; --m800:#273b62; --m900:#273b62;
  --n0:#1e1e20; --n1:#26272b; --n2:#53565a; --n3:#71747a; --n4:#909398;
  --n5:#95979e; --n6:#d5d6d7; --n7:#e5e5e6; --n8:#eff0f0; --n9:#f2f3f5; --n10:#fcfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
  --radius-btn:999px; --radius-card:18px; --radius-panel:26px;
  --shadow-glass: 0 4px 18px rgba(0,0,0,0.32), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-elevated: 0 14px 36px rgba(86,131,218,0.28);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n2);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0;transform:translateY(14px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes ping{0%{transform:scale(1);opacity:0.7;}75%,100%{transform:scale(2.2);opacity:0;}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,137,100,0.4);}50%{box-shadow:0 0 0 7px rgba(255,137,100,0);}}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastSlide{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes auroraDrift{0%{transform:translate(-6%,-4%) rotate(0deg);}50%{transform:translate(4%,3%) rotate(8deg);}100%{transform:translate(-6%,-4%) rotate(0deg);}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* 절차적 비주얼 — 옵시디언 캔버스 위 바이올렛→코럴 오로라 (Huly 시그니처, 상단 고정, 마케팅 히어로 아님) */
.aurora-glow{position:fixed;top:-220px;left:50%;width:920px;height:520px;transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(86,131,218,0.32) 0%, rgba(255,137,100,0.16) 45%, transparent 72%);filter:blur(30px);pointer-events:none;z-index:0;animation:auroraDrift 16s ease-in-out infinite;}

/* ── 시그니처 1: 상단 글로벌 내비 ── */
.app-header{position:sticky;top:0;z-index:30;height:60px;width:100%;background:rgba(30,30,32,0.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--n2);display:flex;align-items:center;gap:22px;padding:0 26px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--n9);flex-shrink:0;}
.brand .mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,var(--m500),var(--m800));display:flex;align-items:center;justify-content:center;color:#fff;}
.project-switcher{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--n1);font-size:12.5px;color:var(--n6);font-weight:600;flex-shrink:0;}
.project-switcher:hover{background:var(--n2);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--n5);font-weight:600;transition:background 0.15s,color 0.15s;}
.nav-link:hover{background:var(--n1);color:var(--n9);}
.nav-link.active{background:rgba(86,131,218,0.18);color:var(--m300);}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--n5);background:var(--n1);position:relative;transition:background 0.15s;}
.icon-btn:hover{background:var(--n2);}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--s2);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n1);color:var(--n6);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}

/* ── 시그니처 2: 보조 탭 ── */
.tab-bar{width:100%;background:var(--n1);border-bottom:1px solid var(--n2);display:flex;gap:4px;padding:0 26px;overflow-x:auto;position:relative;z-index:1;}
.tab{padding:14px 6px;margin-right:22px;font-size:13.5px;font-weight:600;color:var(--n5);border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s;}
.tab:hover{color:var(--n9);}
.tab.active{color:var(--m300);border-bottom:2px solid var(--m500);}

/* ── 시그니처 3: 콘텐츠 ── */
.content{width:100%;max-width:1280px;margin:0 auto;padding:26px 26px 60px;animation:fadeInUp 0.32s ease-out;position:relative;z-index:1;}
.page-head{margin-bottom:20px;}
.page-title{font-size:42px;font-weight:800;color:var(--n9);letter-spacing:-0.03em;line-height:1.05;}
.page-desc{font-size:13px;color:var(--n5);margin-top:5px;max-width:660px;line-height:1.55;}

.glass{background:rgba(38,39,43,0.72);backdrop-filter:blur(10px);border:1px solid var(--n2);border-radius:var(--radius-card);box-shadow:var(--shadow-glass);}
.glass:hover{box-shadow:var(--shadow-elevated);border-color:var(--m700);}

/* status-strip: 슬림 상태바 겸 stat row */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-card{background:rgba(38,39,43,0.72);backdrop-filter:blur(10px);border:1px solid var(--n2);border-radius:var(--radius-card);padding:14px 16px;box-shadow:var(--shadow-glass);animation:cardStagger 0.4s ease-out backwards;transition:transform 0.18s,box-shadow 0.18s;}
.stat-card:hover{transform:translateY(-2px) scale(1.01);box-shadow:var(--shadow-elevated);border-color:var(--m700);}
.stat-card:nth-child(1){animation-delay:0.02s;} .stat-card:nth-child(2){animation-delay:0.07s;} .stat-card:nth-child(3){animation-delay:0.12s;} .stat-card:nth-child(4){animation-delay:0.17s;}
.stat-label{font-size:11px;color:var(--n7);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
.stat-value{font-size:28px;font-weight:800;color:var(--n10);letter-spacing:-0.01em;line-height:1;}
.stat-delta{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;}
.stat-delta.up{color:var(--s1);}
.stat-delta.warn{color:var(--s3-text);}
.sparkline{margin-top:8px;display:block;}

/* primary-focus: 타임라인 */
.tower-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title h4{font-size:14.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;color:var(--n10);}
.timeline-strip{padding:22px 20px;}
.day-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day-col{background:var(--n2);border-radius:14px;padding:10px 8px;min-height:150px;display:flex;flex-direction:column;gap:6px;}
.day-col-head{font-size:10.5px;color:var(--n6);font-weight:700;text-align:center;margin-bottom:4px;}
.day-col.over{background:var(--s3-bg);}
.pay-chip{background:var(--n1);border-radius:10px;padding:7px 8px;font-size:10.5px;color:var(--n7);border:1px solid var(--n2);cursor:pointer;transition:box-shadow 0.15s;}
.pay-chip:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.pay-chip b{display:block;font-size:11px;color:var(--n10);}
.pay-chip.mine{border-color:var(--m400);background:rgba(86,131,218,0.16);animation:glow 2.4s infinite;}

/* priority-rail */
.rail-item{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--n2);margin-bottom:9px;cursor:pointer;transition:background 0.15s;}
.rail-item:hover{background:var(--n1);}
.rail-badge{width:30px;height:30px;border-radius:999px;background:var(--s2-bg);color:var(--s2-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rail-badge.warn{background:var(--s3-bg);color:var(--s3-text);}
.rail-text{font-size:12px;color:var(--n9);line-height:1.4;}
.rail-text b{display:block;font-size:12.5px;margin-bottom:2px;}

/* secondary */
.secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.mini-panel{padding:18px 20px;}
.mini-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--n2);font-size:12.5px;color:var(--n8);}
.mini-row:last-child{border-bottom:none;}
.mini-bar-track{width:100px;height:6px;background:var(--n3);border-radius:999px;overflow:hidden;}
.mini-bar-fill{height:100%;background:var(--m500);border-radius:999px;}

/* buttons */
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-btn);background:linear-gradient(135deg,var(--m600),var(--m800));color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(71,107,179,0.28);transition:transform 0.12s,box-shadow 0.15s;}
.btn-primary:hover{transform:scale(1.03);box-shadow:0 6px 18px rgba(71,107,179,0.36);}
.btn-primary:active{transform:scale(0.97);}
.btn-ghost{padding:10px 18px;border-radius:var(--radius-btn);background:var(--n1);border:1px solid var(--n2);color:var(--n9);font-size:13px;font-weight:600;transition:background 0.15s;}
.btn-ghost:hover{background:var(--n1);}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-btn);background:var(--n1);border:1px solid var(--n2);color:var(--n7);font-size:12px;font-weight:600;}
.btn-sm:hover{background:var(--n1);}

/* ops-monitor */
.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
.health-card{padding:18px 20px;}
.health-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.health-name{font-size:13.5px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px;}
.pulse-dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--s1);flex-shrink:0;}
.pulse-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--s1);animation:ping 1.8s infinite;}
.health-metric{font-size:11.5px;color:var(--n7);display:flex;justify-content:space-between;padding:3px 0;}
.rule-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:var(--n2);margin-bottom:8px;}
.rule-left{font-size:12.5px;color:var(--n9);}
.rule-left b{display:block;font-size:13px;color:var(--n10);}
.switch{width:36px;height:20px;border-radius:999px;background:var(--n4);position:relative;transition:background 0.15s;flex-shrink:0;}
.switch.on{background:var(--m600);}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.15s;}
.switch.on .knob{left:18px;}
.chart-box{height:220px;position:relative;padding:16px;}

/* returns */
.returns-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.returns-table th{text-align:left;padding:10px 12px;color:var(--n6);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;border-bottom:1px solid var(--n3);}
.returns-table td{padding:12px;border-bottom:1px solid var(--n2);color:var(--n9);}
.returns-table tr{cursor:pointer;}
.returns-table tr:hover td{background:var(--n2);}
.status-pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;}
.status-pill.wait{background:var(--n1);color:var(--n7);}
.status-pill.done{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.warn{background:var(--s3-bg);color:var(--s3-text);}

/* audit-log */
.role-switch{display:flex;gap:4px;background:var(--n1);border-radius:999px;padding:4px;width:fit-content;margin-bottom:16px;}
.role-switch button{padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--n7);}
.role-switch button.active{background:var(--n2);color:var(--m300);box-shadow:var(--shadow-glass);}
.chip-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{padding:7px 13px;border-radius:999px;background:var(--n1);color:var(--n7);font-size:12px;font-weight:600;border:1px solid transparent;}
.filter-chip.active{background:var(--m50);color:var(--m700);border-color:var(--m300);}
.audit-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.audit-table th{text-align:left;padding:10px 12px;color:var(--n6);font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--n3);}
.audit-table td{padding:11px 12px;border-bottom:1px solid var(--n2);color:var(--n9);}
.audit-table tr{cursor:pointer;}
.audit-table tr:hover td{background:var(--n2);}
.masked{color:var(--n5);letter-spacing:2px;}

/* modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(20,22,28,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--n1);border:1px solid var(--n2);border-radius:var(--radius-panel);width:100%;max-width:480px;max-height:86vh;overflow-y:auto;animation:modalIn 0.18s ease-out;box-shadow:0 30px 70px rgba(0,0,0,0.5);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:16px;font-weight:700;margin:0;}
.modal-close{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n1);}
.modal-close:hover{background:var(--n3);}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--n3);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--n8);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;border:1px solid var(--n2);border-radius:14px;font-size:13px;background:var(--n1);color:var(--n9);outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--m500);background:var(--n2);}

.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{display:flex;align-items:center;gap:9px;background:var(--n1);border:1px solid var(--n2);color:var(--n9);padding:12px 17px;border-radius:999px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,0.4);animation:toastSlide 0.2s ease-out;}
.toast i{color:var(--s1);}
.empty-hint{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;color:var(--n6);text-align:center;}

@media (max-width: 900px){
  .tower-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .health-grid{grid-template-columns:1fr;}
  .global-nav{display:none;}
}
@media (max-width: 600px){
  .app-header{padding:0 14px;gap:12px;}
  .project-switcher span,.project-switcher{font-size:11px;padding:6px 9px;}
  .content{padding:16px;}
  .page-title{font-size:28px;}
  .stat-row{grid-template-columns:1fr;}
  .day-cols{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const {ResponsiveContainer, BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Cell} = Recharts;
const num = n => n.toLocaleString('ko-KR');

function Icon({name, size=17, weight='regular', style}) {
  return <i className={`ph ph-${name}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Toast({toasts}) {
  return (
    <div className="toast-stack">
      {toasts.map(t => <div className="toast" key={t.id}><Icon name="check-circle" size={16} />{t.msg}</div>)}
    </div>
  );
}

function Modal({title, onClose, children, footer}) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><Icon name="x" size={15} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function Sparkline({data, color}) {
  const w=90,h=26, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h - ((v-min)/(max-min||1))*h}`).join(' ');
  return <svg className="sparkline" width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}

/* ───────── main: 선금 지급 스케줄러 (command-tower composition) ───────── */
const PAY_QUEUE = [
  {id:1, day:0, factory:'하노이 1공장', amount:'USD 4,200', poNo:'PO-HN1-20260918-002', mine:true},
  {id:2, day:0, factory:'다카 3공장', amount:'USD 3,150', poNo:'PO-DK3-20260916-011'},
  {id:3, day:0, factory:'칭다오 협력공장', amount:'USD 2,800', poNo:'PO-QD-20260915-007'},
  {id:4, day:0, factory:'호치민 2공장', amount:'USD 1,960', poNo:'PO-HC2-20260917-005'},
  {id:5, day:0, factory:'치타공 4공장', amount:'USD 5,100', poNo:'PO-CB4-20260914-003', over:true},
  {id:6, day:1, factory:'하노이 1공장', amount:'USD 2,300', poNo:'PO-HN1-20260919-004'},
  {id:7, day:2, factory:'다카 3공장', amount:'USD 1,800', poNo:'PO-DK3-20260920-008'},
  {id:8, day:3, factory:'칭다오 협력공장', amount:'USD 4,650', poNo:'PO-QD-20260921-012'},
];
const DAYS = ['오늘','내일','+2일','+3일','+4일','+5일','+6일'];

function MainScreen({pushToast}) {
  const [payDetail, setPayDetail] = useState(null);
  const byDay = d => PAY_QUEUE.filter(p => p.day === d);

  return (
    <div>
      <div className="stat-row">
        <div className="stat-card"><div className="stat-label">오늘 송금 예정</div><div className="stat-value">4 / 4</div><div className="stat-delta warn"><Icon name="arrow-up" size={12} />한도 도달 — 1건 이월</div></div>
        <div className="stat-card"><div className="stat-label">이번 주 총 요청액</div><div className="stat-value">USD 25.9K</div><Sparkline data={[12,15,11,18,14,20,17]} color="var(--m500)" /></div>
        <div className="stat-card"><div className="stat-label">연동 헬스</div><div className="stat-value">정상</div><div className="stat-delta up"><Icon name="pulse" size={12} />3/3 서비스 응답</div></div>

              <div className="mini-row"><span>남부 보관창고</span><div className="mini-bar-track"><div className="mini-bar-fill" style={{width:'52%'}}></div></div></div>

/* ───────── ops-monitor: 운영 감시·장애 알림 콘솔 ───────── */
const FAIL_TREND = [
  {t:'09/15', rate:1.2},{t:'09/16', rate:0.8},{t:'09/17', rate:2.1},{t:'09/18', rate:1.4},
  {t:'09/19', rate:0.6},{t:'09/20', rate:3.2},{t:'09/21', rate:1.0},
];

function OpsScreen({pushToast}) {
  const [rules, setRules] = useState([
    {id:1, label:'호출 한도 80% 초과 시 알림', on:true},
    {id:2, label:'연속 실패 3회 시 즉시 알림', on:true},
    {id:3, label:'배치 작업 지연 10분 초과 알림', on:false},
  ]);
  function toggle(id){ setRules(r => r.map(x => x.id===id ? {...x, on:!x.on} : x)); }

  return (
    <div>
      <div className="health-grid">
        {[
          {name:'이카운트 ERP', latency:'182ms', uptime:'99.94%'},
          {name:'하이웍스 그룹웨어', latency:'240ms', uptime:'99.88%'},
          {name:'PI 이메일 인박스', latency:'—', uptime:'99.97%'},
        ].map(s => (
          <div className="glass health-card" key={s.name}>
            <div className="health-top"><div className="health-name"><span className="pulse-dot"></span>{s.name}</div></div>
            <div className="health-metric"><span>응답 지연</span><span>{s.latency}</span></div>
            <div className="health-metric"><span>가동률(7일)</span><span>{s.uptime}</span></div>
          </div>
        ))}
      </div>

      <div className="tower-grid">
        <div className="glass chart-box">
          <div className="panel-title" style={{marginBottom:0}}><h4><Icon name="chart-line" size={16} />API 호출 실패율 추이 (7일)</h4></div>
          <ResponsiveContainer width="100%" height="82%">
            <LineChart data={FAIL_TREND} margin={{top:16,right:10,left:-14,bottom:0}}>
              <CartesianGrid stroke="var(--n3)" strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="t" tick={{fontSize:11, fill:'#71747a'}} axisLine={{stroke:'#e5e5e6'}} tickLine={false} />
              <YAxis tick={{fontSize:11, fill:'#71747a'}} axisLine={false} tickLine={false} unit="%" />
              <Tooltip contentStyle={{borderRadius:12, border:'1px solid #e5e5e6', fontSize:12}} />
              <Line type="monotone" dataKey="rate" stroke="#476bb3" strokeWidth={2.5} dot={{r:3, fill:'#476bb3'}} />
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div>
          <div className="glass" style={{padding:18}}>
            <div className="panel-title"><h4><Icon name="bell-ringing" size={15} />임계치 알림 규칙</h4></div>
            {rules.map(r => (
              <div className="rule-row" key={r.id}>
                <div className="rule-left">{r.label}</div>
                <div className={"switch" + (r.on ? " on" : "")} onClick={() => toggle(r.id)}><div className="knob"></div></div>
              </div>
            ))}
            <button className="btn-sm" style={{width:'100%', justifyContent:'center', marginTop:6}} onClick={() => pushToast('담당자 메신저 채널로 테스트 알림을 전송했습니다')}>
              <Icon name="paper-plane-tilt" size={13} />테스트 알림 발송
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── returns: 반품 모니터링·재고 보정 ───────── */
const RETURN_ROWS = [
  {id:1, wh:'남부 보관창고', item:'접이식 캠핑 테이블 M', qty:18, status:'대기'},
  {id:2, wh:'수도권 물류센터', item:'보온 텀블러 500ml', qty:42, status:'대기'},
  {id:3, wh:'본사 통합창고', item:'원목 트레이 세트', qty:6, status:'보정완료'},
  {id:4, wh:'남부 보관창고', item:'실리콘 주방매트', qty:29, status:'예외'},
];
const RETURN_CHART = [
  {wh:'수도권', rate:34},{wh:'본사', rate:19},{wh:'남부', rate:52},
];

function ReturnsScreen({pushToast}) {
  const [rows, setRows] = useState(RETURN_ROWS);
  const [pick, setPick] = useState(null);
  const [reason, setReason] = useState('');

  function apply() {
    setRows(rows.map(r => r.id === pick.id ? {...r, status:'보정완료'} : r));
    setPick(null); setReason('');
    pushToast('재고 보정이 반영되고 원본 발주 이력에 연결되었습니다');
  }

  return (
    <div className="tower-grid" style={{gridTemplateColumns:'1fr 340px'}}>
      <div className="glass" style={{padding:0, overflow:'hidden'}}>
        <div className="panel-title" style={{padding:'18px 20px 0'}}><h4><Icon name="arrow-u-down-left" size={16} />반품 의심 건 (재고 스냅샷 차분 탐지)</h4></div>
        <table className="returns-table" style={{marginTop:10}}>
          <thead><tr><th>창고</th><th>품목</th><th>예상 반품수량</th><th>상태</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id} onClick={() => r.status==='대기' && setPick(r)}>
                <td>{r.wh}</td><td>{r.item}</td><td>{num(r.qty)}</td>
                <td><span className={"status-pill " + (r.status==='보정완료' ? 'done' : r.status==='예외' ? 'warn' : 'wait')}>{r.status}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="glass" style={{padding:18}}>
        <div className="panel-title"><h4><Icon name="chart-bar" size={15} />창고별 반품율</h4></div>
        <div style={{height:180}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={RETURN_CHART} margin={{top:10,right:6,left:-20,bottom:0}}>
              <CartesianGrid stroke="var(--n3)" strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="wh" tick={{fontSize:11, fill:'#71747a'}} axisLine={false} tickLine={false} />
              <YAxis tick={{fontSize:11, fill:'#71747a'}} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{borderRadius:12, border:'1px solid #e5e5e6', fontSize:12}} />
              <Bar dataKey="rate" radius={[8,8,0,0]} fill="#93b0e7">
                {RETURN_CHART.map((e,i) => <Cell key={i} fill={e.rate>45 ? '#476bb3' : '#b3c7ee'} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {pick && (
        <Modal title="반품 보정 처리" onClose={() => setPick(null)} footer={
          <React.Fragment><button className="btn-ghost" onClick={() => setPick(null)}>취소</button><button className="btn-primary" onClick={apply}><Icon name="check" size={14} />보정 반영</button></React.Fragment>
        }>
          <div style={{fontSize:13, color:'var(--n9)', marginBottom:14}}>{pick.wh} · {pick.item} · 예상 {num(pick.qty)}개</div>
          <div className="form-group"><label>보정 전 재고</label><input disabled value={num(1200 - pick.qty)} /></div>
          <div className="form-group"><label>보정 후 재고</label><input disabled value={num(1200)} /></div>
          <div className="form-group"><label>보정 사유</label><textarea rows={3} placeholder="예: 9월 셋째 주 반품 입고 확인" value={reason} onChange={e => setReason(e.target.value)}></textarea></div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── audit-log: 권한별 가시성·감사 로그 ───────── */
const AUDIT_ROWS = [
  {id:1, type:'발주', who:'김민수', at:'2026.09.21 10:02', desc:'PO-HN1-20260918-002 등록', cost:'USD 21,420'},
  {id:2, type:'결재', who:'이지은', at:'2026.09.21 09:40', desc:'선금 지급 요청 기안 생성', cost:'USD 4,200'},
  {id:3, type:'메일', who:'시스템', at:'2026.09.20 17:12', desc:'치타공 4공장 발주 메일 발송', cost:'—'},
  {id:4, type:'수정', who:'박서준', at:'2026.09.20 15:03', desc:'가산지수 1.6 → 1.8 변경', cost:'—'},
];
const TYPES = ['전체','발주','결재','메일','수정'];

function AuditScreen({pushToast}) {
  const [role, setRole] = useState('담당자');
  const [filter, setFilter] = useState('전체');
  const [detail, setDetail] = useState(null);
  const canSeeCost = role === '관리자';
  const rows = AUDIT_ROWS.filter(r => filter==='전체' || r.type===filter);

  return (
    <div>
      <div className="role-switch">
        {['담당자','매니저','관리자'].map(r => (
          <button key={r} className={role===r ? 'active' : ''} onClick={() => { setRole(r); pushToast(r + ' 권한으로 전환했습니다'); }}>{r}</button>
        ))}
      </div>
      <div className="chip-row">
        {TYPES.map(t => <button key={t} className={"filter-chip" + (filter===t ? ' active' : '')} onClick={() => setFilter(t)}>{t}</button>)}
      </div>
      <div className="glass" style={{padding:0, overflow:'hidden'}}>
        <table className="audit-table">
          <thead><tr><th>유형</th><th>처리자</th><th>시각</th><th>내용</th><th>원가 정보</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id} onClick={() => setDetail(r)}>
                <td>{r.type}</td><td>{r.who}</td><td>{r.at}</td><td>{r.desc}</td>
                <td>{canSeeCost ? r.cost : <span className="masked">●●●●●●</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {!canSeeCost && <div style={{fontSize:11.5, color:'var(--n6)', marginTop:10}}>원가 정보는 관리자 권한에서만 표시됩니다. 필드 단위 마스킹이 응답 직렬화 단계에서 적용됩니다.</div>}

      {detail && (
        <Modal title="감사 로그 상세" onClose={() => setDetail(null)}>
          <div style={{fontSize:13, lineHeight:2, color:'var(--n9)'}}>
            <div>유형 <b>{detail.type}</b></div>
            <div>처리자 {detail.who}</div>
            <div>시각 {detail.at}</div>
            <div>내용 {detail.desc}</div>
            <div>원가 정보 {canSeeCost ? detail.cost : '마스킹됨 (관리자만 조회 가능)'}</div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── App ───────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(msg) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }

  const TABS = [
    {screen:'main', label:'선금 지급 스케줄러'},
    {screen:'ops-monitor', label:'운영 감시·장애 알림 콘솔'},
    {screen:'returns', label:'반품 모니터링·재고 보정'},
    {screen:'audit-log', label:'권한별 가시성·감사 로그'},
  ];
  const descMap = {
    main:'선금비율·지급일 기반 요청을 해외송금 1일 4건 제한 안에서 자동으로 분산 배치합니다.',
    'ops-monitor':'이카운트·하이웍스·PI 인박스 연동 상태와 호출 한도 사용률을 한 콘솔에서 관측합니다.',
    'returns':'창고별 재고 스냅샷 차분으로 반품을 자동 감지하고 원인 발주 건까지 역추적합니다.',
    'audit-log':'역할별 데이터 가시성을 적용하고 발주·결재·메일·수정 이벤트를 감사 로그로 남깁니다.',
  };

  return (
    <div className="shell" data-archetype="topbar-analytics">
      <div className="aurora-glow"></div>
      <header className="app-header">
        <div className="brand"><div className="mark"><Icon name="stack" size={16} /></div>오더타워</div>
        <button className="project-switcher" onClick={() => pushToast('수입 유통 법인 컨텍스트를 확인했습니다')}><Icon name="buildings" size={14} />유통법인 A ▾</button>
        <nav className="global-nav">
          <button className="nav-link active" onClick={() => pushToast('운영 콘솔 홈에 있습니다')}>운영 콘솔</button>
          <button className="nav-link" onClick={() => pushToast('연동 문서함을 열었습니다')}>연동 문서</button>
          <button className="nav-link" onClick={() => pushToast('설정 화면으로 이동합니다')}>설정</button>
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => pushToast('전체 발주 건을 검색합니다')}><Icon name="magnifying-glass" size={16} /></button>
          <button className="icon-btn" onClick={() => pushToast('알림 3건을 확인했습니다')}><Icon name="bell" size={16} /><span className="notif-dot"></span></button>
          <div className="avatar">관</div>
        </div>
      </header>

      <nav className="tab-bar">
        {TABS.map(t => (
          <button key={t.screen} className={"tab" + (screen===t.screen ? " active" : "")} onClick={() => setScreen(t.screen)}>{t.label}</button>
        ))}
      </nav>

      <main className="content" key={screen}>
        <div className="page-head">
          <div className="page-title">{TABS.find(t => t.screen===screen)?.label}</div>
          <div className="page-desc">{descMap[screen]}</div>
        </div>
        {screen==='main' && <MainScreen pushToast={pushToast} />}
        {screen==='ops-monitor' && <OpsScreen pushToast={pushToast} />}
        {screen==='returns' && <ReturnsScreen pushToast={pushToast} />}
        {screen==='audit-log' && <AuditScreen pushToast={pushToast} />}
      </main>

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
