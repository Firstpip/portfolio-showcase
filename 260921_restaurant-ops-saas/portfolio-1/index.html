<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>외식업 매장 운영 관리 시스템 — 맞춤 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 221°, light) ── */
:root{
  --m50:#f0f4fe; --m100:#e0e9fc; --m200:#c2d3f9; --m300:#9db9f6; --m400:#739bf2;
  --m500:#4c7fef; --m600:#2563eb; --m700:#1e51c1; --m800:#183f96; --m900:#112d6a;
  --n0:#ffffff; --n1:#f5f5f5; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909298; --n7:#71747a; --n8:#262626; --n9:#36373a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-btn:8px; --radius-card:12px; --radius-lg:16px; --radius-tag:9999px; --radius-input:6px;
  --shadow-hair: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-ring: 0 0 0 4px rgba(37,99,235,0.08);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n8);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.82);}}
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes ringPop{0%{box-shadow:0 0 0 0 rgba(37,99,235,0.35);}100%{box-shadow:0 0 0 8px rgba(37,99,235,0);}}

/* ── shell / 사이드바 (stripe-multipane 시그니처 1) ── */
.shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:252px;background:var(--n0);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:30;}
.sidebar-brand{height:60px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--n3);flex-shrink:0;}
.sidebar-brand .mark{width:26px;height:26px;border-radius:7px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sidebar-brand .name{font-weight:700;font-size:14px;color:var(--n10);}
.sidebar-brand .sub{font-size:10.5px;color:var(--n7);}
.store-switch{margin:14px 14px 4px;position:relative;}
.store-switch-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-input);color:var(--n9);font-size:12.5px;font-weight:600;}
.store-switch-btn:hover{background:var(--n2);}
.store-switch-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-input);box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:40;overflow:hidden;animation:modalIn 0.12s ease-out;}
.store-switch-menu button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:12.5px;color:var(--n8);}
.store-switch-menu button:hover{background:var(--n1);}
.store-switch-menu button.active{color:var(--m700);font-weight:700;background:var(--m50);}
.sidebar-nav{padding:10px 12px 0;display:flex;flex-direction:column;gap:2px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-input);font-size:13.5px;color:var(--n8);text-align:left;width:100%;transition:background 0.12s,color 0.12s;}
.sidebar-link:hover{background:var(--n1);}
.sidebar-link.active{background:var(--m50);color:var(--m700);font-weight:700;}
.sidebar-link svg{flex-shrink:0;width:16px;height:16px;}
.sidebar-section{padding:18px 12px 0;}
.sidebar-section-title{font-size:10.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:0.05em;padding:0 11px 7px;}
.integration-row{display:flex;align-items:center;gap:7px;padding:0 11px;font-size:11.5px;color:var(--n7);margin-bottom:6px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--s1);flex-shrink:0;animation:pulseDot 1.8s infinite ease-in-out;}
.sidebar-user{margin-top:auto;padding:13px 16px;border-top:1px solid var(--n3);display:flex;align-items:center;gap:9px;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
.sidebar-user .info .u-name{font-size:12.5px;font-weight:700;color:var(--n10);}
.sidebar-user .info .u-role{font-size:11px;color:var(--n7);}

/* ── main / topbar ── */
.main{margin-left:252px;flex:1;min-width:0;width:calc(100% - 252px);min-height:100vh;display:flex;flex-direction:column;}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--n3);background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--n7);}
.breadcrumb .current{color:var(--n10);font-weight:700;}
.breadcrumb .divider{color:var(--n5);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-btn);background:var(--n10);color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-hair);transition:background 0.15s,transform 0.1s;}
.btn-primary:hover{background:#171717;}
.btn-primary:active{transform:scale(0.97);}
.btn-outline{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--radius-btn);background:var(--n0);border:1px solid var(--n3);color:var(--n9);font-size:13px;font-weight:600;transition:background 0.15s;}
.btn-outline:hover{background:var(--n1);}
.btn-sm{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--radius-btn);border:1px solid var(--n3);background:var(--n0);color:var(--n8);font-size:12px;font-weight:600;}
.btn-sm:hover{background:var(--n1);}

.content{padding:26px;flex:1;width:100%;animation:fadeInUp 0.28s ease-out;max-width:1220px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:36px;font-weight:800;color:var(--n10);letter-spacing:-0.02em;line-height:1.15;}
.page-desc{font-size:12.5px;color:var(--n7);margin-top:4px;max-width:600px;line-height:1.55;}

.card{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);}

/* ── calendar-schedule composition (main) ── */
.cal-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:flex-start;}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-title h4{font-size:14px;font-weight:700;margin:0;display:flex;align-items:center;gap:7px;color:var(--n10);}
.cal-card{padding:20px 20px 22px;}
.week-nav{display:flex;align-items:center;gap:8px;}
.week-nav button{width:28px;height:28px;border-radius:var(--radius-btn);border:1px solid var(--n3);display:flex;align-items:center;justify-content:center;color:var(--n7);}
.week-nav button:hover{background:var(--n1);}
.week-label{font-size:12.5px;font-weight:700;color:var(--n9);min-width:96px;text-align:center;}
.day-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day-col{background:var(--n1);border-radius:10px;padding:9px 7px;min-height:172px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--n2);}
.day-col.weekend{background:var(--n2);}
.day-col-head{font-size:10.5px;color:var(--n6);font-weight:700;text-align:center;margin-bottom:2px;}
.day-col-head b{display:block;font-size:13px;color:var(--n9);margin-top:1px;}
.shift-chip{background:var(--n0);border-radius:8px;padding:6px 7px;font-size:10.5px;color:var(--n7);border:1px solid var(--n3);cursor:pointer;transition:box-shadow 0.15s,border-color 0.15s;}
.shift-chip:hover{box-shadow:var(--shadow-hair);border-color:var(--n5);}
.shift-chip b{display:block;font-size:11px;color:var(--n10);margin-bottom:1px;}
.shift-chip.repeat{position:relative;}
.shift-chip .repeat-mark{position:absolute;top:5px;right:5px;color:var(--n5);}
.shift-chip.conflict{border-color:var(--s2);background:var(--s2-bg);animation:ringPop 1.6s ease-out infinite;}
.add-shift-btn{border:1px dashed var(--n4);border-radius:8px;padding:8px 4px;font-size:10.5px;color:var(--n6);text-align:center;}
.add-shift-btn:hover{background:var(--n0);color:var(--n8);}

/* slot-side */
.slot-side{display:flex;flex-direction:column;gap:12px;}
.stat-row-v{display:flex;flex-direction:column;gap:10px;}
.stat-card{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stat-card .txt .stat-label{font-size:11px;color:var(--n7);font-weight:600;}
.stat-card .txt .stat-value{font-size:26px;font-weight:800;color:var(--n10);letter-spacing:-0.01em;line-height:1.15;margin-top:2px;}
.stat-card .stat-delta{font-size:11px;margin-top:3px;display:flex;align-items:center;gap:3px;color:var(--n7);}
.stat-card .stat-delta.warn{color:var(--s3-text);}
.stat-card .stat-delta.up{color:var(--s1-text);}
.stat-icon-box{width:34px;height:34px;border-radius:9px;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon-box.hot{background:var(--m50);color:var(--m700);}
.sparkline{display:block;}
.queue-item{display:flex;gap:9px;padding:10px 11px;border-radius:10px;background:var(--n1);margin-bottom:7px;cursor:pointer;transition:background 0.12s;}
.queue-item:hover{background:var(--n2);}
.queue-badge{width:26px;height:26px;border-radius:var(--radius-tag);background:var(--s3-bg);color:var(--s3-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.queue-text{font-size:11.5px;color:var(--n9);line-height:1.4;}
.queue-text b{display:block;font-size:12px;margin-bottom:1px;}

/* ── RBAC 화면 — 탭 + 테이블 (stripe-multipane 시그니처 2,3) ── */
.tab-bar{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--n3);}
.tab{padding:10px 4px;margin-right:20px;font-size:13px;font-weight:700;color:var(--n6);border-bottom:2px solid transparent;transition:color 0.15s;}
.tab:hover{color:var(--n9);}
.tab.active{color:var(--m700);border-bottom:2px solid var(--m600);}
.data-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--n1);border:1px solid var(--n3);border-radius:var(--radius-tag);min-width:200px;}
.search-box input{background:transparent;border:none;outline:none;font-size:12.5px;color:var(--n9);width:100%;}
.search-box svg{color:var(--n6);flex-shrink:0;}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--radius-tag);border:1px solid var(--n3);background:var(--n0);font-size:12px;color:var(--n7);font-weight:600;}
.filter-chip.active{background:var(--m50);color:var(--m700);border-color:var(--m300);}
.export-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-tag);border:1px solid var(--n3);background:var(--n0);font-size:12.5px;font-weight:600;color:var(--n8);}
.export-btn:hover{border-color:var(--n5);}
.data-table-wrap{overflow-x:auto;border:1px solid var(--n3);border-radius:var(--radius-card);}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table thead th{text-align:left;font-size:10.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:0.04em;padding:11px 14px;border-bottom:1px solid var(--n3);background:var(--n1);}
table.data-table tbody td{padding:12px 14px;border-bottom:1px solid var(--n2);color:var(--n8);}
table.data-table tbody tr{cursor:pointer;transition:background .12s;}
table.data-table tbody tr:hover{background:var(--n1);}
table.data-table tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-tag);font-size:11px;font-weight:700;background:var(--n2);color:var(--n7);}
.badge.role-owner{background:var(--m50);color:var(--m700);}
.perm-chip{display:inline-flex;padding:2px 8px;border-radius:var(--radius-tag);background:var(--n1);color:var(--n7);font-size:10.5px;margin:1px;border:1px solid var(--n3);}

/* ── 근태 화면 ── */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.status-pill{padding:4px 10px;border-radius:var(--radius-tag);font-size:11px;font-weight:700;}
.status-pill.ok{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.late{background:var(--s3-bg);color:var(--s3-text);}
.status-pill.leave{background:var(--n2);color:var(--n7);}
.status-pill.absent{background:var(--s2-bg);color:var(--s2-text);}

/* ── 체크리스트 화면 ── */
.checklist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.check-card{padding:0;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.check-card:hover{box-shadow:0 8px 22px rgba(0,0,0,0.07);transform:translateY(-2px);}
.check-photo{height:110px;background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n6);position:relative;overflow:hidden;}
.check-photo.pending{background:linear-gradient(90deg,var(--n1) 25%,var(--n2) 37%,var(--n1) 63%);background-size:400px 100%;animation:shimmer 1.4s infinite linear;color:var(--n5);}
.check-body{padding:14px 16px 16px;}
.check-title{font-size:13.5px;font-weight:700;color:var(--n10);margin-bottom:4px;}
.check-meta{font-size:11.5px;color:var(--n7);margin-bottom:10px;}
.check-progress-track{height:6px;border-radius:999px;background:var(--n2);overflow:hidden;}
.check-progress-fill{height:100%;background:var(--m600);border-radius:999px;}
.check-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--n7);margin-top:6px;}

/* ── modal / toast ── */
.overlay{position:fixed;inset:0;background:rgba(20,20,20,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:86vh;overflow-y:auto;animation:modalIn 0.16s ease-out;box-shadow:0 24px 60px rgba(0,0,0,0.16);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:15px;font-weight:700;margin:0;color:var(--n10);}
.modal-close{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n1);}
.modal-body{padding:20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--n3);}
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:11.5px;font-weight:700;color:var(--n7);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--n10);border-radius:var(--radius-input);font-size:13px;background:var(--n0);color:var(--n9);outline:none;}
.form-group input:disabled{color:var(--n7);border-color:var(--n3);background:var(--n1);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--m600);box-shadow:var(--shadow-ring);}
.audit-line{font-size:11.5px;color:var(--n7);padding:7px 0;border-top:1px dashed var(--n3);}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{display:flex;align-items:center;gap:8px;background:var(--n10);color:#fff;padding:11px 16px;border-radius:var(--radius-tag);font-size:12.5px;box-shadow:0 12px 28px rgba(0,0,0,0.24);animation:toastSlide 0.2s ease-out;}
.toast svg{color:var(--s1);flex-shrink:0;}

@media (max-width:980px){
  .cal-grid{grid-template-columns:1fr;}
  .checklist-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:640px){
  .sidebar{display:none;}
  .main{margin-left:0;width:100%;}
  .day-cols{grid-template-columns:repeat(3,1fr);}
  .checklist-grid{grid-template-columns:1fr;}
  .content{padding:16px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const num = n => n.toLocaleString('ko-KR');

function Icon({name, size=16, style, className=''}) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
  return <i data-lucide={name} style={{width:size, height:size, ...style}} className={className}></i>;
}

function Sparkline({data, color='var(--m600)'}) {
  const w=76,h=24, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h - ((v-min)/((max-min)||1))*h}`).join(' ');
  return <svg className="sparkline" width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}

function Toast({toasts}) {
  return (
    <div className="toast-stack">
      {toasts.map(t => <div className="toast" key={t.id}><Icon name="check-circle" size={15} />{t.msg}</div>)}
    </div>
  );
}

function Modal({title, onClose, children, footer}) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><Icon name="x" size={15} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ───────── 공통 데이터 ───────── */
const STORES = ['강남점','홍대점','부산서면점'];
const DAYS = ['월','화','수','목','금','토','일'];
const DATES = ['9/22','9/23','9/24','9/25','9/26','9/27','9/28'];

const SHIFT_MAP = {

/* ───────── attendance: 근태 자동 판정 ───────── */
function AttendanceScreen({pushToast}) {
  const [filter, setFilter] = useState('전체');
  const [rows, setRows] = useState(ATTEND_ROWS);
  const [edit, setEdit] = useState(null);
  const [reason, setReason] = useState('');
  const filtered = filter==='전체' ? rows : rows.filter(r => r.status===filter);

  function applyEdit() {
    setRows(rows.map(r => r.id===edit.id ? {...r, status:'정상', out: r.out==='—' ? '18:00' : r.out} : r));
    pushToast(`${edit.name}님의 근태 기록을 수정하고 수정 이력에 기록했습니다`);
    setEdit(null); setReason('');
  }

  return (
    <div>
      <div className="stat-row-v" style={{flexDirection:'row', display:'flex', gap:12, marginBottom:18}}>
        <div className="card stat-card" style={{flex:1}}><div className="txt"><div className="stat-label">정상 출근</div><div className="stat-value">{rows.filter(r=>r.status==='정상').length}</div></div><div className="stat-icon-box"><Icon name="badge-check" size={16} /></div></div>
        <div className="card stat-card" style={{flex:1}}><div className="txt"><div className="stat-label">지각</div><div className="stat-value">{rows.filter(r=>r.status==='지각').length}</div></div><div className="stat-icon-box"><Icon name="clock-alert" size={16} /></div></div>
        <div className="card stat-card" style={{flex:1}}><div className="txt"><div className="stat-label">결근</div><div className="stat-value">{rows.filter(r=>r.status==='결근').length}</div></div><div className="stat-icon-box"><Icon name="user-round-x" size={16} /></div></div>
      </div>

      <div className="filter-row">
        {['전체','정상','지각','조퇴','결근'].map(s => (
          <button key={s} className={"filter-chip" + (filter===s?" active":"")} onClick={() => setFilter(s)}>{s}</button>
        ))}
      </div>
      <div className="data-table-wrap">
        <table className="data-table">
          <thead><tr><th>직원</th><th>매장</th><th>출근</th><th>퇴근</th><th>판정</th><th></th></tr></thead>
          <tbody>
            {filtered.map(r => (
              <tr key={r.id} onClick={() => setEdit(r)}>
                <td>{r.name}</td><td>{r.store}</td><td>{r.in}</td><td>{r.out}</td>
                <td><StatusBadge s={r.status} /></td>
                <td><Icon name="pencil" size={13} style={{color:'var(--n6)'}} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {edit && (
        <Modal title="근태 수정" onClose={() => setEdit(null)} footer={
          <React.Fragment><button className="btn-outline" onClick={() => setEdit(null)}>취소</button><button className="btn-primary" onClick={applyEdit}><Icon name="check" size={13} />수정 반영</button></React.Fragment>
        }>
          <div style={{fontSize:13, color:'var(--n9)', marginBottom:12}}>{edit.name} · {edit.store} · 현재 판정 <StatusBadge s={edit.status} /></div>
          <div className="form-group"><label>출근 시각</label><input defaultValue={edit.in==='—' ? '' : edit.in} placeholder="예: 09:00" /></div>
          <div className="form-group"><label>퇴근 시각</label><input defaultValue={edit.out==='—' ? '' : edit.out} placeholder="예: 18:00" /></div>
          <div className="form-group"><label>수정 사유</label><textarea rows={3} placeholder="예: 근무표 대비 지연 사유 확인" value={reason} onChange={e => setReason(e.target.value)}></textarea></div>
          <div className="audit-line">수정 이력: 관리자 김도윤 · 2026.09.22 14:32 · 수정 전 값 자동 보존</div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── checklist: 체크리스트 사진 인증 ───────── */
function ChecklistScreen({pushToast}) {
  const [items, setItems] = useState(CHECKLIST_ITEMS);
  const [detail, setDetail] = useState(null);

  function complete(id) {
    setItems(items.map(it => it.id===id ? {...it, done: Math.min(it.done+1, it.total), photo:'done'} : it));
    pushToast('체크리스트 항목을 완료 처리하고 사진 인증을 저장했습니다');
  }

  return (
    <div>
      <div className="checklist-grid">
        {items.map(it => (
          <div key={it.id} className="card check-card" onClick={() => setDetail(it)}>
            <div className={"check-photo" + (it.photo==='pending'?' pending':'')}>
              {it.photo==='done' ? <Icon name="image" size={26} /> : <Icon name="camera" size={22} />}
            </div>
            <div className="check-body">
              <div className="check-title">{it.title}</div>
              <div className="check-meta">{it.slot}</div>
              <div className="check-progress-track"><div className="check-progress-fill" style={{width:`${(it.done/it.total)*100}%`}}></div></div>
              <div className="check-progress-label"><span>{it.done}/{it.total} 완료</span><span>{Math.round((it.done/it.total)*100)}%</span></div>
            </div>
          </div>
        ))}
      </div>

      {detail && (
        <Modal title={detail.title} onClose={() => setDetail(null)} footer={
          <button className="btn-primary" onClick={() => { complete(detail.id); setDetail(null); }}><Icon name="camera" size={13} />항목 완료 + 사진 인증</button>
        }>
          <div style={{fontSize:12.5, color:'var(--n7)', marginBottom:12}}>시간대 {detail.slot}</div>
          {Array.from({length:detail.total}).map((_,i) => (
            <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'9px 0', borderBottom:'1px solid var(--n2)', fontSize:13, color:'var(--n8)'}}>
              <Icon name={i < detail.done ? 'circle-check' : 'circle'} size={16} style={{color: i < detail.done ? 'var(--s1)' : 'var(--n5)', flexShrink:0}} />
              <span style={{flex:1}}>체크리스트 항목 {i+1}</span>
              {i < detail.done && <span style={{fontSize:11, color:'var(--n6)'}}>사진 첨부됨</span>}
            </div>
          ))}
        </Modal>
      )}
    </div>
  );
}

/* ───────── App ───────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [store, setStore] = useState('강남점');
  const [storeMenuOpen, setStoreMenuOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  function pushToast(msg) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }

  const NAV = [
    {screen:'main', label:'근무표 편성 및 캘린더', icon:'calendar-days'},
    {screen:'rbac', label:'역할별 권한 관리(RBAC)', icon:'shield-check'},
    {screen:'attendance', label:'근태 자동 판정', icon:'clock'},
    {screen:'checklist', label:'체크리스트 사진 인증', icon:'clipboard-check'},
  ];
  const crumbMap = {main:'근무표', rbac:'권한 관리', attendance:'근태 관리', checklist:'체크리스트'};
  const descMap = {
    main:`${store} 기준 주간 근무표를 반복 패턴으로 편성하고, 동일 시간대 중복 편성을 저장 시점에 자동 차단합니다.`,
    rbac:'사장·점장·직원·본사·서비스 운영자 5개 역할별 메뉴 접근 범위와 매장 데이터 격리 규칙을 관리합니다.',
    attendance:'근무표 대비 실제 출퇴근 시각을 비교해 지각·조퇴·결근을 자동 판정하고, 수정 이력을 감사 로그로 보존합니다.',
    checklist:'매장·시간대별 반복 업무 체크리스트를 완료 처리하고 사진 인증을 첨부해 이행 여부를 추적합니다.',
  };

  return (
    <div className="shell" data-archetype="stripe-multipane">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="mark"><Icon name="store" size={15} /></div>
          <div><div className="name">매장허브</div><div className="sub">외식업 매장운영 SaaS</div></div>
        </div>
        <div className="store-switch">
          <button className="store-switch-btn" onClick={() => setStoreMenuOpen(v => !v)}>
            <span style={{display:'flex',alignItems:'center',gap:7}}><Icon name="building-2" size={13} />{store}</span>
            <Icon name="chevron-down" size={13} />
          </button>
          {storeMenuOpen && (
            <div className="store-switch-menu">
              {STORES.map(s => (
                <button key={s} className={s===store?'active':''} onClick={() => { setStore(s); setStoreMenuOpen(false); pushToast(`${s} 데이터로 전환했습니다`); }}>{s}</button>
              ))}
            </div>
          )}
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n => (
            <button key={n.screen} className={"sidebar-link" + (screen===n.screen ? " active" : "")} onClick={() => setScreen(n.screen)}>
              <Icon name={n.icon} /> {n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-section">
          <div className="sidebar-section-title">연동 상태</div>
          <div className="integration-row"><span className="live-dot"></span>웹 푸시 발송 정상</div>
          <div className="integration-row"><span className="live-dot"></span>사진 저장소 연동 정상</div>
        </div>
        <div className="sidebar-user">
          <div className="avatar">김</div>
          <div className="info"><div className="u-name">김도윤 사장</div><div className="u-role">전체 매장 관리자</div></div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div className="breadcrumb"><span>매장운영</span><span className="divider">/</span><span className="current">{crumbMap[screen]}</span></div>
          <div className="topbar-actions">
            <button className="btn-outline" onClick={() => pushToast('공지사항 작성 화면을 열었습니다')}><Icon name="megaphone" size={13} />공지 작성</button>
            <button className="btn-primary" onClick={() => pushToast('신규 근무 슬롯을 빠르게 추가합니다')}><Icon name="plus" size={13} />근무 추가</button>
          </div>
        </header>
        <div className="content" key={screen}>
          <div className="page-head">
            <div>
              <div className="page-title">{NAV.find(n => n.screen===screen)?.label}</div>
              <div className="page-desc">{descMap[screen]}</div>
            </div>
          </div>
          {screen==='main' && <MainScreen pushToast={pushToast} store={store} />}
          {screen==='rbac' && <RbacScreen pushToast={pushToast} />}
          {screen==='attendance' && <AttendanceScreen pushToast={pushToast} />}
          {screen==='checklist' && <ChecklistScreen pushToast={pushToast} />}
        </div>
      </div>

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
