<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>다점포 통합 운영 플랫폼 — 구현 데모</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 89°, light) ── */
:root{
  --m50:#eff1ed; --m100:#eff1ed; --m200:#eff1ed; --m300:#dfe2db; --m400:#bfc6b8;
  --m500:#98a38c; --m600:#6c7c5c; --m700:#43582e; --m800:#1a3300; --m900:#152a00;
  --n0:#fcfaf5; --n1:#f1f1f1; --n2:#f0f0ef; --n3:#e6e6e5; --n4:#d6d7d5;
  --n5:#c3c4c1; --n6:#949890; --n7:#757a71; --n8:#575a53; --n9:#383a36; --n10:#1f201e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-btn:999px; --radius-card:16px; --radius-lg:20px; --radius-input:10px;
  --shadow-card: 0 1px 3px rgba(26,51,0,0.06), 0 8px 20px rgba(26,51,0,0.05);
  --shadow-elevated: 0 14px 32px rgba(26,51,0,0.12);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n8);-webkit-font-smoothing:antialiased;}
#root{width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardStagger{from{opacity:0;transform:translateY(12px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes countPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastSlide{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes dotPing{0%{box-shadow:0 0 0 0 rgba(31,137,75,0.35);}100%{box-shadow:0 0 0 7px rgba(31,137,75,0);}}

.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.paper-glow{position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:820px;height:440px;background:radial-gradient(ellipse at center, rgba(26,51,0,0.05) 0%, rgba(255,233,92,0.05) 46%, transparent 72%);pointer-events:none;z-index:0;filter:blur(22px);}

/* ── 시그니처 1: 상단 글로벌 내비 (사이드바 없음) ── */
.app-header{position:sticky;top:0;z-index:30;height:64px;width:100%;background:rgba(252,250,245,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:20px;padding:0 28px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--n9);flex-shrink:0;}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--m800);display:flex;align-items:center;justify-content:center;color:var(--n0);flex-shrink:0;}
.tenant-switch{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--n1);font-size:12.5px;color:var(--n8);font-weight:700;flex-shrink:0;border:1px solid var(--n3);}
.tenant-switch:hover{background:var(--n2);}
.global-nav{display:flex;align-items:center;gap:4px;flex:1;}
.nav-link{padding:9px 15px;border-radius:999px;font-size:13px;color:var(--n7);font-weight:700;transition:background 0.15s,color 0.15s;}
.nav-link:hover{background:var(--n1);color:var(--n9);}
.nav-link.active{background:var(--m50);color:var(--m800);}
.header-actions{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n1);position:relative;transition:background 0.15s;border:1px solid var(--n3);}
.icon-btn:hover{background:var(--n2);}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--s2);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--m800);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}

/* ── 시그니처 2: 보조 탭 ── */
.tab-bar{width:100%;background:var(--n0);border-bottom:1px solid var(--n3);display:flex;gap:4px;padding:0 28px;overflow-x:auto;}
.tab{padding:15px 4px;margin-right:26px;font-size:13.5px;font-weight:700;color:var(--n6);border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s;}
.tab:hover{color:var(--n9);}
.tab.active{color:var(--m800);border-bottom:2px solid var(--m800);}

/* ── 시그니처 3: 콘텐츠 (전체 폭, 사이드바 없음) ── */
.content{width:100%;max-width:1280px;margin:0 auto;padding:28px 28px 64px;animation:fadeInUp 0.32s ease-out;}
.page-head{margin-bottom:22px;}
.page-title{font-size:56px;font-weight:800;color:var(--n10);letter-spacing:0.01em;line-height:1.02;}
.page-desc{font-size:13px;color:var(--n7);margin-top:6px;max-width:660px;line-height:1.6;}

.panel{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-card);box-shadow:var(--shadow-card);transition:box-shadow .18s ease,border-color .18s ease;}
.panel:hover{box-shadow:var(--shadow-elevated);}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-title h4{font-size:14.5px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;color:var(--n9);}

/* insight-board: hero-viz + kpi-side + widget-grid */
.board-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:20px;}
.hero-viz{padding:24px 26px;}
.chart-box{height:236px;position:relative;}
.kpi-side{display:flex;flex-direction:column;gap:12px;}
.stat-card{padding:16px 18px;box-shadow:var(--shadow-card);animation:cardStagger 0.4s ease-out backwards;transition:transform .18s,box-shadow .18s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-elevated);}
.stat-card:nth-child(1){animation-delay:.02s;} .stat-card:nth-child(2){animation-delay:.07s;} .stat-card:nth-child(3){animation-delay:.12s;}
.stat-label{font-size:11px;color:var(--n7);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.stat-value{font-size:30px;font-weight:800;color:var(--n10);letter-spacing:-0.01em;line-height:1;animation:countPulse 2.4s ease-in-out infinite;}
.stat-delta{font-size:11.5px;margin-top:7px;display:flex;align-items:center;gap:4px;color:var(--n7);}
.stat-delta.warn i,.stat-delta.warn svg{color:var(--s3-text);}
.stat-delta.up i,.stat-delta.up svg{color:var(--s1-text);}
.stat-row-top{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;}

.alert-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--n2);cursor:pointer;}
.alert-item:last-child{border-bottom:none;}
.alert-item:hover .alert-name{color:var(--m800);}
.alert-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;background:var(--n4);}
.alert-dot.warn{background:var(--s3);animation:dotPing 2s infinite;}
.alert-name{font-size:13px;font-weight:700;color:var(--n9);}
.alert-sub{font-size:11.5px;color:var(--n7);margin-top:1px;}
.alert-amt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--n9);flex-shrink:0;}

.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.widget{padding:20px 22px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n8);}
.donut-legend-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.hbar-label{width:76px;font-size:11.5px;color:var(--n7);flex-shrink:0;}
.hbar-track{flex:1;height:9px;border-radius:999px;background:var(--n2);overflow:hidden;}
.hbar-fill{height:100%;border-radius:999px;background:var(--m700);transform-origin:left;animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both;}
.hbar-val{width:38px;text-align:right;font-size:11.5px;font-weight:700;color:var(--n9);}
.timeline{display:flex;flex-direction:column;gap:0;}
.timeline-item{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--n2);}
.timeline-item:last-child{border-bottom:none;}
.timeline-icon{width:28px;height:28px;border-radius:9px;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.timeline-icon.warn{background:var(--s3-bg);color:var(--s3-text);}
.timeline-text{font-size:12px;color:var(--n8);line-height:1.5;}
.timeline-time{font-size:10.5px;color:var(--n6);margin-top:1px;}

/* buttons */
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:var(--radius-btn);background:var(--m800);color:var(--n0);font-size:13px;font-weight:700;box-shadow:0 6px 16px rgba(26,51,0,0.18);transition:transform .12s,box-shadow .15s;}
.btn-primary:hover{transform:scale(1.02);background:var(--m900);}
.btn-primary:active{transform:scale(0.97);}
.btn-outline{padding:10px 18px;border-radius:var(--radius-btn);background:var(--n0);border:1px solid var(--n4);color:var(--n9);font-size:13px;font-weight:700;transition:background .15s;}
.btn-outline:hover{background:var(--n1);}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-btn);background:var(--n1);border:1px solid var(--n3);color:var(--n8);font-size:12px;font-weight:700;}
.btn-sm:hover{background:var(--n2);}

/* admin table */
.data-table-wrap{overflow-x:auto;border:1px solid var(--n3);border-radius:var(--radius-card);}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table thead th{text-align:left;font-size:10.5px;font-weight:800;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--n3);background:var(--n1);}
table.data-table tbody td{padding:13px 16px;border-bottom:1px solid var(--n2);color:var(--n8);}
table.data-table tbody tr{transition:background .12s;}
table.data-table tbody tr:hover{background:var(--n1);}
table.data-table tbody tr:last-child td{border-bottom:none;}
.plan-badge{display:inline-flex;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;background:var(--n2);color:var(--n7);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;}
.status-badge.active{background:var(--s1-bg);color:var(--s1-text);}
.status-badge.pending{background:var(--s3-bg);color:var(--s3-text);}
.status-badge.suspended{background:var(--n2);color:var(--n7);}
.switch{width:38px;height:21px;border-radius:999px;background:var(--n4);position:relative;transition:background 0.15s;flex-shrink:0;cursor:pointer;}
.switch.on{background:var(--m800);}
.switch .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left 0.15s;}
.switch.on .knob{left:19px;}

/* notification rules */
.rule-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--radius-card);background:var(--n0);border:1px solid var(--n3);margin-bottom:9px;}
.rule-left{display:flex;align-items:center;gap:12px;}
.rule-icon{width:36px;height:36px;border-radius:11px;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.rule-name{font-size:13.5px;font-weight:700;color:var(--n9);}
.rule-sub{font-size:11.5px;color:var(--n7);margin-top:2px;}
.channel-pill{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--n1);color:var(--n7);margin-right:4px;}
.channel-pill.pending{background:var(--s3-bg);color:var(--s3-text);}

/* integration modules */
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.module-card{padding:20px 22px;}
.module-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.module-icon{width:40px;height:40px;border-radius:12px;background:var(--n1);color:var(--n7);display:flex;align-items:center;justify-content:center;}

.module-name{font-size:14.5px;font-weight:800;color:var(--n9);margin-bottom:4px;}
.module-desc{font-size:12px;color:var(--n7);line-height:1.55;margin-bottom:14px;}
.module-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--n7);border-top:1px solid var(--n2);padding-top:12px;}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(26,51,0,0.28);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--n0);border:1px solid var(--n3);border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:86vh;overflow-y:auto;animation:modalIn 0.18s ease-out;box-shadow:0 30px 70px rgba(26,51,0,0.2);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:16px;font-weight:800;margin:0;color:var(--n10);}
.modal-close{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.modal-close:hover{background:var(--n1);}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--n3);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--n8);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;border:1px solid var(--n3);border-radius:var(--radius-input);font-size:13px;background:var(--n1);color:var(--n9);outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--m700);background:var(--n0);}

.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{display:flex;align-items:center;gap:9px;background:var(--n10);color:var(--n0);padding:12px 18px;border-radius:999px;font-size:13px;box-shadow:0 12px 30px rgba(26,51,0,0.28);animation:toastSlide 0.2s ease-out;}
.toast i{color:var(--s1);}

@media (max-width:960px){
  .board-grid{grid-template-columns:1fr;}
  .widget-grid{grid-template-columns:1fr;}
  .module-grid{grid-template-columns:1fr;}
  .global-nav{display:none;}
}
@media (max-width:600px){
  .app-header{padding:0 14px;gap:12px;}
  .tenant-switch{display:none;}
  .content{padding:18px;}
  .page-title{font-size:28px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const {ResponsiveContainer, LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Cell} = Recharts;
const num = n => n.toLocaleString('ko-KR');

function Icon({name, size=16, style}) {
  return <i className={`ph ph-${name}`} style={{fontSize:size, lineHeight:1, ...style}}></i>;
}

function Sparkline({data, color='var(--m800)'}) {
  const w=88,h=26, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h - ((v-min)/((max-min)||1))*h}`).join(' ');
  return <svg width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}

function Toast({toasts}) {
  return (
    <div className="toast-stack">
      {toasts.map(t => <div className="toast" key={t.id}><Icon name="check-circle" size={15} />{t.msg}</div>)}
    </div>
  );
}

function Modal({title, onClose, children, footer}) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose}><Icon name="x" size={15} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ───────── 공통 데이터 ───────── */
const TREND = [
  {t:'8/25', rate:82},{t:'8/29', rate:85},{t:'9/2', rate:80},{t:'9/6', rate:88},
  {t:'9/10', rate:91},{t:'9/14', rate:87},{t:'9/18', rate:93},{t:'9/21', rate:90},
];
const STORE_COMPARE = [
  {store:'강남점', rate:96},{store:'홍대점', rate:78},{store:'부산서면', rate:88},{store:'대구동성로', rate:64},
];

const STORE_ROWS = [
  {id:1, name:'강남점', owner:'김도윤', plan:'베이직', status:'active'},
  {id:2, name:'홍대점', owner:'박하은', plan:'베이직', status:'active'},
  {id:3, name:'부산서면점', owner:'한지민', plan:'스탠다드', status:'active'},
  {id:4, name:'대구동성로점', owner:'윤서아', plan:'스탠다드', status:'pending'},
  {id:5, name:'인천구월점', owner:'조은우', plan:'베이직', status:'active'},
  {id:6, name:'제주노형점', owner:'문승현', plan:'베이직', status:'suspended'},
];

const NOTI_RULES = [
  {id:1, name:'근무표 변경 알림', sub:'점장이 근무표를 수정하면 대상 직원에게 즉시 발송', channels:['웹 푸시'], on:true},
  {id:2, name:'공지 발행 알림', sub:'신규 공지 등록 시 소속 매장 전체 직원에게 발송', channels:['웹 푸시'], on:true},
  {id:3, name:'지각·결근 알림', sub:'근태 자동 판정 결과를 점장에게 실시간 전달', channels:['웹 푸시','문자'], on:true},
  {id:4, name:'카카오 알림톡 발송', sub:'발신 프로필·템플릿 심사 완료 후 자동 활성화 예정', channels:['카카오 알림톡'], on:false, pending:true},
];

const MODULES = [
  {id:1, name:'결제 연동', icon:'credit-card', desc:'매장 구독 과금을 위한 결제대행사 연동 인터페이스. 요금제 확정 시 활성화됩니다.', stores:0, on:false},
  {id:2, name:'AI 매장 진단', icon:'brain', desc:'근태·체크리스트 데이터를 기반으로 매장별 운영 리스크를 자동 진단하는 확장 모듈입니다.', stores:0, on:false},
  {id:3, name:'고객 리뷰 수집', icon:'star', desc:'매장별 고객 리뷰를 수집·집계해 통합 대시보드에 노출하는 모듈입니다.', stores:2, on:true},
  {id:4, name:'재고 발주 연동', icon:'package', desc:'체크리스트 완료 데이터를 기반으로 소모품 재고 발주를 자동 제안하는 모듈입니다.', stores:3, on:true},
];

/* ───────── main: 다점포 통합 대시보드 (insight-board composition) ───────── */
function MainScreen({pushToast}) {
  const [rangeTab, setRangeTab] = useState('30일');

  return (
    <div>
      <div className="board-grid">
        <div className="panel hero-viz">
          <div className="panel-title">
            <h4><Icon name="chart-line-up" size={17} />전체 매장 체크리스트 이행률 추이</h4>
            <div style={{display:'flex', gap:6}}>
              {['7일','30일','분기'].map(r => (
                <button key={r} className={"btn-sm" + (rangeTab===r ? "" : "")} style={rangeTab===r ? {background:'var(--m800)', color:'var(--n0)', borderColor:'var(--m800)'} : {}} onClick={() => { setRangeTab(r); pushToast(`${r} 구간 추이로 다시 집계했습니다`); }}>{r}</button>
              ))}
            </div>
          </div>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={TREND} margin={{top:10,right:8,left:-18,bottom:0}}>
                <CartesianGrid stroke="var(--n3)" strokeDasharray="3 3" vertical={false} />
                <XAxis dataKey="t" tick={{fontSize:11, fill:'#757a71'}} axisLine={{stroke:'#e6e6e5'}} tickLine={false} />
                <YAxis tick={{fontSize:11, fill:'#757a71'}} axisLine={false} tickLine={false} unit="%" />
                <Tooltip contentStyle={{borderRadius:12, border:'1px solid #e6e6e5', fontSize:12}} />
                <Line type="monotone" dataKey="rate" stroke="#1a3300" strokeWidth={2.5} dot={{r:3, fill:'#1a3300'}} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="kpi-side">
          <div className="panel stat-card">
            <div className="stat-label">가입 매장 수</div>
            <div className="stat-value">6</div>
            <Sparkline data={[2,3,3,4,5,5,6]} />
            <div className="stat-delta up"><Icon name="trend-up" size={12} />이번 달 +2개점</div>
          </div>
          <div className="panel stat-card">
            <div className="stat-label">이상 매장</div>
            <div className="stat-value">1</div>
            <div className="stat-delta warn"><Icon name="warning" size={12} />체크리스트 이행률 기준치 미달</div>
          </div>
          <div className="panel" style={{padding:'16px 18px'}}>
            <div className="panel-title" style={{marginBottom:8}}><h4 style={{fontSize:13}}><Icon name="bell-ringing" size={14} />이상 매장 알림</h4></div>
            <div className="alert-item" onClick={() => pushToast('대구동성로점 상세 리포트를 확인했습니다')}>
              <div className="alert-dot warn"></div>
              <div><div className="alert-name">대구동성로점</div><div className="alert-sub">이행률 64% — 기준치(80%) 미달</div></div>
            </div>
            <div className="alert-item" onClick={() => pushToast('홍대점 근태 지연 추세를 확인했습니다')}>
              <div className="alert-dot"></div>
              <div><div className="alert-name">홍대점</div><div className="alert-sub">지각 건수 전주 대비 소폭 증가</div></div>
            </div>
          </div>
        </div>
      </div>

      <div className="widget-grid">
        <div className="panel widget">
          <div className="panel-title" style={{marginBottom:6}}><h4 style={{fontSize:13}}><Icon name="chart-pie-slice" size={14} />근태 판정 분포</h4></div>
          <div className="donut-legend">
            <div className="donut-legend-item"><span className="sw" style={{background:'var(--m800)'}}></span>정상 87%</div>
            <div className="donut-legend-item"><span className="sw" style={{background:'var(--n4)'}}></span>지각·조퇴 10%</div>
            <div className="donut-legend-item"><span className="sw" style={{background:'var(--s3)'}}></span>결근 3%</div>
          </div>
        </div>
        <div className="panel widget">
          <div className="panel-title" style={{marginBottom:6}}><h4 style={{fontSize:13}}><Icon name="chart-bar" size={14} />매장별 이행률 비교</h4></div>
          {STORE_COMPARE.map(s => (
            <div key={s.store} className="hbar-row">
              <div className="hbar-label">{s.store}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{width:`${s.rate}%`}}></div></div>
              <div className="hbar-val">{s.rate}%</div>
            </div>
          ))}
        </div>
        <div className="panel widget">
          <div className="panel-title" style={{marginBottom:6}}><h4 style={{fontSize:13}}><Icon name="clock-counter-clockwise" size={14} />최근 이벤트</h4></div>
          <div className="timeline">
            <div className="timeline-item"><div className="timeline-icon"><Icon name="storefront" size={13} /></div><div><div className="timeline-text">대구동성로점 가입 승인 대기</div><div className="timeline-time">10분 전</div></div></div>
            <div className="timeline-item"><div className="timeline-icon warn"><Icon name="warning" size={13} /></div><div><div className="timeline-text">제주노형점 계정 정지 처리됨</div><div className="timeline-time">3시간 전</div></div></div>
            <div className="timeline-item"><div className="timeline-icon"><Icon name="plug" size={13} /></div><div><div className="timeline-text">고객 리뷰 수집 모듈 2개 매장 활성화</div><div className="timeline-time">어제</div></div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── admin: 서비스 운영자 관리자 ───────── */
function AdminScreen({pushToast}) {
  const [rows, setRows] = useState(STORE_ROWS);
  const [invite, setInvite] = useState(false);
  const [detail, setDetail] = useState(null);
  const [statusTab, setStatusTab] = useState('all');
  const visibleRows = rows.filter(r => statusTab==='all' || r.status===statusTab);

  function toggleStatus(id) {
    setRows(rows.map(r => r.id===id ? {...r, status: r.status==='active' ? 'suspended' : 'active'} : r));
    pushToast('매장 계정 상태를 변경하고 접근 권한을 즉시 반영했습니다');
  }
  function approve(id) {
    setRows(rows.map(r => r.id===id ? {...r, status:'active'} : r));
    pushToast('신규 매장을 활성화하고 초기 관리자 계정을 자동 발급했습니다');
    setDetail(null);
  }

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:10}}>
        <nav className="tab-bar" style={{padding:0, border:'none'}}>
          <button className="tab" style={statusTab==='all' ? {color:'var(--m800)', borderBottom:'2px solid var(--m800)'} : {}} onClick={() => setStatusTab('all')}>전체</button>
          <button className="tab" style={statusTab==='active' ? {color:'var(--m800)', borderBottom:'2px solid var(--m800)'} : {}} onClick={() => setStatusTab('active')}>활성</button>
          <button className="tab" style={statusTab==='pending' ? {color:'var(--m800)', borderBottom:'2px solid var(--m800)'} : {}} onClick={() => setStatusTab('pending')}>승인 대기</button>
          <button className="tab" style={statusTab==='suspended' ? {color:'var(--m800)', borderBottom:'2px solid var(--m800)'} : {}} onClick={() => setStatusTab('suspended')}>정지됨</button>
        </nav>
        <button className="btn-primary" onClick={() => setInvite(true)}><Icon name="plus" size={14} />신규 매장 초대</button>
      </div>
      <div className="data-table-wrap">
        <table className="data-table">
          <thead><tr><th>매장명</th><th>대표 계정</th><th>요금제</th><th>상태</th><th></th></tr></thead>
          <tbody>
            {visibleRows.map(r => (
              <tr key={r.id}>
                <td onClick={() => setDetail(r)} style={{cursor:'pointer', fontWeight:700, color:'var(--n9)'}}>{r.name}</td>
                <td>{r.owner}</td>
                <td><span className="plan-badge">{r.plan}</span></td>
                <td><span className={"status-badge " + r.status}>{r.status==='active'?'활성':r.status==='pending'?'승인 대기':'정지됨'}</span></td>
                <td>
                  {r.status==='pending'
                    ? <button className="btn-sm" onClick={() => approve(r.id)}><Icon name="check" size={12} />승인</button>
                    : <div className={"switch" + (r.status==='active' ? " on" : "")} onClick={() => toggleStatus(r.id)}><div className="knob"></div></div>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {detail && (
        <Modal title="가입 매장 상세" onClose={() => setDetail(null)} footer={
          <button className="btn-primary" onClick={() => { setDetail(null); pushToast(`${detail.name} 정보를 확인했습니다`); }}><Icon name="check" size={13} />확인</button>
        }>
          <div style={{fontSize:13, lineHeight:2, color:'var(--n9)'}}>
            <div>매장명 <b>{detail.name}</b></div>
            <div>대표 계정 {detail.owner}</div>
            <div>요금제 {detail.plan}</div>
            <div>상태 {detail.status==='active'?'활성':detail.status==='pending'?'승인 대기':'정지됨'}</div>
          </div>
        </Modal>
      )}

      {invite && (
        <Modal title="신규 매장 초대" onClose={() => setInvite(false)} footer={
          <React.Fragment><button className="btn-outline" onClick={() => setInvite(false)}>취소</button><button className="btn-primary" onClick={() => { setInvite(false); pushToast('초대 메일을 발송하고 초기 관리자 계정을 자동 발급했습니다'); }}><Icon name="paper-plane-tilt" size={13} />초대 발송</button></React.Fragment>
        }>
          <div className="form-group"><label>매장명</label><input placeholder="예: 대전둔산점" /></div>
          <div className="form-group"><label>대표 계정 이메일</label><input placeholder="owner@example.com" /></div>
          <div className="form-group"><label>요금제</label><select><option>베이직</option><option>스탠다드</option></select></div>
        </Modal>
      )}
    </div>
  );
}

/* ───────── notification: 다채널 알림 관리 ───────── */
function NotificationScreen({pushToast}) {
  const [rules, setRules] = useState(NOTI_RULES);
  function toggle(id) {
    setRules(rules.map(r => r.id===id && !r.pending ? {...r, on:!r.on} : r));
    pushToast('알림 발송 규칙을 변경했습니다');
  }
  return (
    <div>
      {rules.map(r => (
        <div key={r.id} className="rule-row">
          <div className="rule-left">
            <div className={"rule-icon" + (r.on ? " active" : "")}><Icon name={r.pending ? 'hourglass' : 'bell'} size={17} /></div>
            <div>
              <div className="rule-name">{r.name}</div>
              <div className="rule-sub">{r.sub}</div>
              <div style={{marginTop:6}}>{r.channels.map(c => <span key={c} className={"channel-pill" + (r.pending?' pending':'')}>{c}</span>)}</div>
            </div>
          </div>
          {r.pending
            ? <button className="btn-sm" onClick={() => pushToast('카카오 알림톡 발신 프로필 심사 현황을 확인했습니다')}><Icon name="info" size={12} />심사 현황</button>
            : <div className={"switch" + (r.on ? " on" : "")} onClick={() => toggle(r.id)}><div className="knob"></div></div>}
        </div>
      ))}
      <div className="panel" style={{padding:'18px 20px', marginTop:16}}>
        <div className="panel-title"><h4><Icon name="paper-plane-tilt" size={16} />발송 이력 · 재발송</h4></div>
        <div className="timeline">
          <div className="timeline-item"><div className="timeline-icon"><Icon name="check" size={13} /></div><div><div className="timeline-text">근무표 변경 알림 12건 발송 완료</div><div className="timeline-time">방금 전</div></div></div>
          <div className="timeline-item"><div className="timeline-icon warn"><Icon name="warning" size={13} /></div><div><div className="timeline-text">지각 알림 1건 발송 실패 — 재시도 대기</div><div className="timeline-time">8분 전</div></div></div>
        </div>
        <button className="btn-sm" style={{marginTop:10}} onClick={() => pushToast('실패 건을 재발송 큐에 등록했습니다')}><Icon name="arrow-clockwise" size={13} />실패 건 재발송</button>
      </div>
    </div>
  );
}

/* ───────── integration: 확장 모듈 연동 설정 ───────── */
function IntegrationScreen({pushToast}) {
  const [modules, setModules] = useState(MODULES);
  function toggle(id) {
    setModules(modules.map(m => m.id===id ? {...m, on:!m.on} : m));
    pushToast('모듈 활성화 상태를 변경했습니다 — API 버전은 그대로 유지됩니다');
  }
  return (
    <div>
      <div className="module-grid">
        {modules.map(m => (
          <div key={m.id} className="panel module-card">
            <div className="module-top">
              <div className={"module-icon" + (m.on ? " on" : "")}><Icon name={m.icon} size={20} /></div>
              <div className={"switch" + (m.on ? " on" : "")} onClick={() => toggle(m.id)}><div className="knob"></div></div>
            </div>
            <div className="module-name">{m.name}</div>
            <div className="module-desc">{m.desc}</div>
            <div className="module-meta"><span>활성 매장 {m.stores}개</span><span>API v1</span></div>
          </div>
        ))}
      </div>
      <div className="panel" style={{padding:'18px 20px', marginTop:18}}>
        <div className="panel-title"><h4><Icon name="git-branch" size={16} />API 버전 관리</h4></div>
        <p style={{fontSize:12.5, color:'var(--n7)', lineHeight:1.6}}>모듈을 추가해도 기존 웹·향후 네이티브 앱 클라이언트가 사용하는 API v1 계약은 변경되지 않습니다. 신규 모듈은 v1 위에 별도 엔드포인트로 추가되어 하위 호환을 유지합니다.</p>
        <button className="btn-sm" style={{marginTop:8}} onClick={() => pushToast('API 변경 이력 문서를 열었습니다')}><Icon name="file-text" size={13} />변경 이력 보기</button>
      </div>
    </div>
  );
}

/* ───────── App ───────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(msg) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }

  const TABS = [
    {screen:'main', label:'다점포 통합 대시보드'},
    {screen:'admin', label:'서비스 운영자 관리자'},
    {screen:'notification', label:'다채널 알림 관리'},
    {screen:'integration', label:'확장 모듈 연동 설정'},
  ];
  const descMap = {
    main:'가입된 모든 매장의 근무·근태·체크리스트 이행률을 한 화면에서 비교하고, 이상 매장을 우선적으로 식별합니다.',
    admin:'서비스 운영자가 가입 매장·계정 상태·요금제를 관리하고, 매장별 기본 관리 권한을 부여합니다.',
    notification:'근무 변경·공지 등 핵심 이벤트에 웹 푸시를 우선 발송하고, 문자·카카오 알림톡은 채널 어댑터로 확장합니다.',
    integration:'결제·AI 추천 등 향후 기능을 플러그인 형태로 연결할 수 있도록 모듈 활성화 상태를 관리합니다.',
  };

  return (
    <div className="shell" data-archetype="topbar-analytics">
      <div className="paper-glow"></div>
      <header className="app-header">
        <div className="brand"><div className="mark"><Icon name="stack" size={17} /></div>매장허브 콘솔</div>
        <button className="tenant-switch" onClick={() => pushToast('본사 통합 컨텍스트를 확인했습니다')}><Icon name="buildings" size={14} />본사 통합 ▾</button>
        <nav className="global-nav">
          <button className="nav-link active" onClick={() => pushToast('운영 콘솔 홈에 있습니다')}>운영 콘솔</button>
          <button className="nav-link" onClick={() => pushToast('요금제 관리 화면으로 이동합니다')}>요금제</button>
          <button className="nav-link" onClick={() => pushToast('시스템 설정 화면으로 이동합니다')}>설정</button>
        </nav>
        <div className="header-actions">
          <button className="icon-btn" onClick={() => pushToast('전체 매장을 검색합니다')}><Icon name="magnifying-glass" size={16} /></button>
          <button className="icon-btn" onClick={() => pushToast('알림 2건을 확인했습니다')}><Icon name="bell" size={16} /><span className="notif-dot"></span></button>
          <div className="avatar">운</div>
        </div>
      </header>

      <nav className="tab-bar">
        {TABS.map(t => (
          <button key={t.screen} className={"tab" + (screen===t.screen ? " active" : "")} onClick={() => setScreen(t.screen)}>{t.label}</button>
        ))}
      </nav>

      <main className="content" key={screen}>
        <div className="page-head">
          <div className="page-title">{TABS.find(t => t.screen===screen)?.label}</div>
          <div className="page-desc">{descMap[screen]}</div>
        </div>
        {screen==='main' && <MainScreen pushToast={pushToast} />}
        {screen==='admin' && <AdminScreen pushToast={pushToast} />}
        {screen==='notification' && <NotificationScreen pushToast={pushToast} />}
        {screen==='integration' && <IntegrationScreen pushToast={pushToast} />}
      </main>

      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
