<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 299°, dark) ── */
:root{
  --m50:#f1eef1;
  --m100:#f1eef1;
  --m200:#f1eef1;
  --m300:#e3dde3;
  --m400:#c8bac8;
  --m500:#a690a6;
  --m600:#806281;
  --m700:#5d355d;
  --m800:#39093a;
  --m900:#2f0730;
  --n0:#1f1e20;
  --n1:#3a363a;
  --n2:#5a535a;
  --n3:#7a717a;
  --n4:#989098;
  --n5:#a8a6b7;
  --n6:#d7d5d7;
  --n7:#e6e5e6;
  --n8:#f0eff0;
  --n9:#f4f0ff;
  --n10:#fdfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
}

* { box-sizing: border-box; }
html, body { width:100%; margin:0; padding:0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n9);
  -webkit-font-smoothing: antialiased;
}
#app-root { width:100%; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background: var(--n2); border-radius:8px; }
::-webkit-scrollbar-track { background: transparent; }

@keyframes fadeUp { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:translateY(0);} }
@keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(147,130,255,0.0);} 50% { box-shadow: 0 0 24px 2px rgba(147,130,255,0.12);} }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
@keyframes starTwinkle { 0%,100% { opacity:0.15; } 50% { opacity:0.7; } }
@keyframes barRise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes toastRise { from { opacity:0; transform: translate(-50%, 14px);} to { opacity:1; transform: translate(-50%, 0);} }

.fade-up { animation: fadeUp 0.36s ease both; }
.spin-icon { animation: spin 0.9s linear infinite; }

.star-field { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.star { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation: starTwinkle 3.4s ease-in-out infinite; }

.app-shell { position:relative; z-index:1; width:100%; min-height:100vh; display:flex; flex-direction:column; }

.search-header {
  position: sticky; top:0; z-index:40;
  background: rgba(3,0,20,0.86); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--n1);
  padding: 14px 32px 0;
}
.header-row { display:flex; align-items:center; gap:20px; max-width:1360px; margin:0 auto; }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; color:var(--n9); flex-shrink:0; }
.brand .brand-mark {
  width:28px; height:28px; border-radius:8px; background: var(--m800);
  display:flex; align-items:center; justify-content:center; color: var(--m300);
  animation: glowPulse 3.5s ease-in-out infinite;
}
.search-bar {
  flex:1; display:flex; align-items:stretch; background: var(--n1); border:1px solid var(--n1);
  border-radius: 999px; overflow:hidden; max-width:660px;
}
.search-segment { flex:1; padding:8px 18px; text-align:left; background:none; border:none; cursor:pointer; font-family:inherit; }
.search-segment:hover { background: var(--n2); }
.segment-label { font-size:10.5px; color: var(--n5); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
.segment-value { font-size:13px; color: var(--n8); margin-top:2px; }
.search-divider { width:1px; background: var(--n1); margin: 8px 0; }
.search-submit {
  width:42px; flex-shrink:0; background: var(--m700); border:none; color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.search-submit:hover { background: var(--m600); }
.header-nav { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.nav-link {
  font-size:13px; color: var(--n5); background:none; border:none; cursor:pointer; padding:8px 12px;
  border-radius:8px; font-family:inherit; display:flex; align-items:center; gap:6px;
}
.nav-link:hover { background: var(--n1); color: var(--n8); }
.nav-link.active { background: var(--m800); color: var(--n9); font-weight:600; }

.filter-chips { display:flex; gap:8px; overflow-x:auto; padding: 14px 0 14px; max-width:1360px; margin:0 auto; scrollbar-width:none; }
.filter-chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; display:flex; align-items:center; gap:6px; padding:7px 15px; border-radius:999px;
  border:1px solid var(--n1); background: var(--n1); color: var(--n6); font-size:12.5px; cursor:pointer;
  font-family:inherit; white-space:nowrap;
}
.chip:hover { background: var(--n2); }
.chip[data-active="true"] { background: var(--m700); border-color: var(--m600); color:#fff; font-weight:600; }

.main { max-width:1360px; margin:0 auto; padding: 22px 32px 80px; width:100%; }
.section-title { font-size:40px; font-weight:500; color:var(--n9); margin: 4px 0 4px; letter-spacing:-0.3px; line-height:1.17; }
.section-sub { font-size:13px; color: var(--n5); margin: 0 0 20px; line-height:1.6; }

.card-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
.listing-card {
  background: var(--n1); border:1px solid var(--n1); border-radius:16px; overflow:hidden; cursor:pointer;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
}
.listing-card:hover { transform: scale(1.025); border-color: var(--n2); box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
.card-image-wrap {
  position:relative; aspect-ratio: 16 / 9; height:132px; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, var(--n2), var(--n0));
  overflow:hidden;
}
.card-image-wrap.featured { background: linear-gradient(135deg, var(--m800), var(--m900)); }
.card-image-wrap .cover-icon { color: var(--n3); opacity:0.5; }
.card-image-wrap.featured .cover-icon { color: var(--m300); opacity:0.85; }
.card-favorite {
  position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%;
  background: rgba(0,0,0,0.4); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.card-favorite.active { color: var(--m300); }
.card-cat-badge {
  position:absolute; top:10px; left:10px; font-size:10.5px; padding:3px 9px; border-radius:999px;
  background: rgba(255,255,255,0.08); color: var(--n7); backdrop-filter: blur(4px);
}
.card-body { padding:14px 16px 16px; }
.card-row-1 { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
.card-title { font-size:14.5px; font-weight:700; color: var(--n9); margin:0; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.card-rating { font-size:12px; color: var(--n5); flex-shrink:0; display:flex; align-items:center; gap:3px; }
.card-meta { font-size:12px; color: var(--n5); display:block; margin-top:4px; }
.card-row-4 { display:flex; align-items:baseline; gap:5px; margin-top:10px; }
.card-price { font-size:14px; font-weight:700; color: var(--n8); }
.price-unit { font-size:11.5px; color: var(--n5); }

.footer { border-top:1px solid var(--n1); padding: 32px; margin-top:40px; }
.footer-cols { display:flex; gap:64px; max-width:1360px; margin:0 auto; flex-wrap:wrap; }
.footer-col h4 { font-size:12px; color: var(--n5); text-transform:uppercase; letter-spacing:0.04em; margin:0 0 10px; }
.footer-col a { display:block; font-size:12.5px; color: var(--n6); margin-bottom:7px; cursor:pointer; }
.footer-col a:hover { color: var(--n9); }

.quick-view-overlay {
  position:fixed; inset:0; background: rgba(3,0,20,0.7); backdrop-filter: blur(3px); z-index:100;
  display:flex; align-items:center; justify-content:flex-end;
}
.quick-view-drawer {
  width:420px; max-width:92vw; height:100vh; background: var(--n1); border-left:1px solid var(--n1);
  padding: 24px; overflow-y:auto; animation: fadeUp 0.28s ease both;
}
.qv-close { background:none; border:1px solid var(--n1); color:var(--n6); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.qv-title { font-size:18px; font-weight:700; color: var(--n9); line-height:1.4; margin-bottom:6px; }
.qv-meta { font-size:12.5px; color: var(--n5); margin-bottom:18px; }
.qv-abstract { font-size:13.5px; line-height:1.75; color: var(--n7); margin-bottom:20px; }
.qv-stat-row { display:flex; gap:20px; margin-bottom:20px; }
.qv-stat { flex:1; background: var(--n2); border-radius:10px; padding:12px; text-align:center; }
.qv-stat .qs-num { font-size:17px; font-weight:800; color: var(--n9); }
.qv-stat .qs-label { font-size:10.5px; color: var(--n5); margin-top:3px; }

.btn { font-family:inherit; font-size:13px; font-weight:600; border-radius:8px; padding:9px 18px; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background: var(--m700); color:#fff; }
.btn-primary:hover { background: var(--m600); }
.btn-outline { background:transparent; color: var(--n7); border:1px solid var(--n2); }
.btn-outline:hover { background: var(--n2); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* admin workflow */
.workflow-board { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top:20px; }
.wf-col { background: var(--n1); border:1px solid var(--n1); border-radius:14px; padding:14px; min-height:340px; }
.wf-col-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.wf-col-title { font-size:13px; font-weight:700; color: var(--n8); display:flex; align-items:center; gap:6px; }
.wf-col-count { font-size:11px; color: var(--n5); background: var(--n2); padding:2px 8px; border-radius:999px; }
.wf-card {
  background: var(--n2); border:1px solid var(--n1); border-radius:10px; padding:12px; margin-bottom:10px; cursor:grab;
  transition: border-color 0.15s;
}
.wf-card:hover { border-color: var(--n3); }
.wf-card-title { font-size:12.5px; font-weight:600; color: var(--n8); line-height:1.4; margin-bottom:6px; }
.wf-card-meta { font-size:11px; color: var(--n5); margin-bottom:8px; }
.wf-card-actions { display:flex; gap:6px; }
.wf-mini-btn { font-size:10.5px; padding:4px 9px; border-radius:6px; border:1px solid var(--n2); background:none; color: var(--n6); cursor:pointer; font-family:inherit; }
.wf-mini-btn:hover { background: var(--n1); }
.wf-mini-btn.approve { color: var(--s1-text); border-color: var(--s1); }
.wf-mini-btn.reject { color: var(--s2-text); border-color: var(--s2); }
.audit-log { margin-top:24px; background: var(--n1); border:1px solid var(--n1); border-radius:14px; padding:16px; }
.audit-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--n1); font-size:12.5px; }
.audit-row:last-child { border-bottom:none; }
.audit-time { color: var(--n4); font-size:11px; margin-left:auto; flex-shrink:0; }

/* stats dashboard */
.stat-cards { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin: 18px 0 24px; }
.stat-card { background: var(--n1); border:1px solid var(--n1); border-radius:14px; padding:16px; }
.stat-card .sc-label { font-size:11.5px; color: var(--n5); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.stat-card .sc-num { font-size:24px; font-weight:800; color: var(--n9); }
.stat-card .sc-delta { font-size:11.5px; margin-top:4px; display:flex; align-items:center; gap:3px; }
.delta-up { color: var(--s1-text); }
.delta-down { color: var(--s2-text); }
.chart-row { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; margin-bottom:16px; }
.chart-panel { background: var(--n1); border:1px solid var(--n1); border-radius:14px; padding:18px; }
.chart-panel h4 { font-size:13.5px; color: var(--n8); margin:0 0 4px; }
.chart-panel .cp-sub { font-size:11.5px; color: var(--n5); margin-bottom:12px; }
.chart-wrap { position:relative; height:240px; }
.range-tabs { display:flex; gap:4px; margin-left:auto; }
.range-tab { font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--n1); background:none; color:var(--n5); cursor:pointer; font-family:inherit; }
.range-tab.active { background: var(--m700); border-color: var(--m600); color:#fff; }
.journal-rank { display:flex; flex-direction:column; gap:10px; }
.jr-row { display:flex; align-items:center; gap:10px; }
.jr-rank { width:20px; font-size:12px; color: var(--n5); font-weight:700; }
.jr-name { flex:1; font-size:12.5px; color: var(--n7); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jr-bar-track { width:70px; height:5px; background: var(--n1); border-radius:4px; overflow:hidden; }
.jr-bar-fill { height:100%; background: var(--m500); transform-origin:left; animation: barRise 0.6s ease both; }
.jr-count { font-size:11.5px; color: var(--n5); width:36px; text-align:right; }

/* deploy pipeline */
.deploy-stage-row { display:flex; align-items:center; gap:0; margin: 20px 0 28px; }
.deploy-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
.deploy-step-circle {
  width:38px; height:38px; border-radius:50%; background: var(--n2); border:2px solid var(--n2);
  display:flex; align-items:center; justify-content:center; color: var(--n5); z-index:2;
}
.deploy-step.done .deploy-step-circle { background: var(--s1-bg); border-color: var(--s1); color: var(--s1-text); }
.deploy-step.active .deploy-step-circle { background: var(--m800); border-color: var(--m500); color: var(--n9); animation: glowPulse 1.6s ease-in-out infinite; }
.deploy-step.failed .deploy-step-circle { background: var(--s2-bg); border-color: var(--s2); color: var(--s2-text); }
.deploy-step-label { font-size:11.5px; color: var(--n6); text-align:center; }
.deploy-step-connector { position:absolute; top:19px; left:50%; width:100%; height:2px; background: var(--n1); z-index:1; }
.deploy-step:last-child .deploy-step-connector { display:none; }
.deploy-step.done .deploy-step-connector { background: var(--s1); }

.log-console {
  background: var(--n2); border:1px solid var(--n1); border-radius:12px; padding:16px;
  font-family: 'SF Mono', Menlo, monospace; font-size:12px; line-height:1.8; max-height:220px; overflow-y:auto;
}
.log-line { display:flex; gap:8px; color: var(--n5); }
.log-line.ok { color: var(--s1-text); }
.log-line .lt { color: var(--n4); flex-shrink:0; }
.rollback-panel { display:flex; align-items:center; justify-content:space-between; background: var(--n1); border:1px solid var(--n1); border-radius:14px; padding:16px 18px; margin-top:20px; }
.rollback-info { font-size:13px; color: var(--n7); }
.rollback-info strong { color: var(--n9); }

.toast {
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:200;
  background: var(--n2); border:1px solid var(--n1); color:var(--n9); padding:11px 20px; border-radius:12px;
  font-size:13.5px; display:flex; align-items:center; gap:8px; animation: toastRise 0.26s ease both;
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}

@media (max-width: 1100px) {
  .header-row { flex-wrap:wrap; }
  .search-bar { order:3; max-width:100%; }
  .header-nav { flex-wrap:wrap; row-gap:4px; width:100%; order:4; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .chart-row { grid-template-columns: 1fr; }
  .workflow-board { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .main { padding-left:18px; padding-right:18px; }
  .nav-link { font-size:11.5px; padding:6px 8px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filter-chips { padding-left:0; padding-right:0; }
  .stat-cards { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

function DeployPipeline({ showToast }) {
  const [stage, setStage] = useState(0);
  const [running, setRunning] = useState(false);
  const [logs, setLogs] = useState([]);
  const steps = ['정적 분석', '인코딩 회귀 테스트', '심볼릭 링크 배포', '헬스체크'];

  const runPipeline = () => {
    if (running) return;
    setRunning(true); setStage(0); setLogs([]);
    const logLines = [
      '$ php -l src/**/*.php — 구문 오류 0건',
      '$ phpstan analyse --level=6 — 경고 2건 (무시 목록)',
      '$ phpunit tests/EncodingRegressionTest.php — 18 passed',
      '$ ln -sfn releases/2026092201 current — 심볼릭 링크 전환 완료',
      '$ curl -sf https://legacy-server/health — 200 OK',
    ];
    let i = 0;
    const timer = setInterval(() => {
      setStage(s => Math.min(steps.length, s + 1));
      setLogs(l => [...l, logLines[i] || '완료']);
      i += 1;
      if (i > steps.length) {
        clearInterval(timer);
        setRunning(false);
        showToast('배포 파이프라인이 정상 완료되었습니다', 'rocket-launch');
      }
    }, 620);
  };

  const rollback = () => {
    showToast('직전 릴리스로 롤백되었습니다 — 서버 디렉토리 구조는 변경되지 않았습니다', 'arrow-counter-clockwise');
    setStage(0); setLogs([]);
  };

  return (
    <main className="main">
      <h1 className="section-title">레거시 서버 호환 배포 자동화 파이프라인</h1>
      <p className="section-sub">기존 PHP 서버 디렉토리 구조를 유지한 채, 정적 분석·회귀 테스트를 자동 실행하고 심볼릭 링크 방식 무중단 배포와 즉시 롤백을 지원합니다.</p>

      <div className="deploy-stage-row">
        {steps.map((s, idx) => (
          <div key={s} className={"deploy-step" + (idx < stage ? ' done' : idx === stage && running ? ' active' : '')}>
            <div className="deploy-step-connector" />
            <div className="deploy-step-circle">
              {idx < stage ? <Ph name="check" size={16} /> : idx === stage && running ? <Ph name="spinner-gap" size={16} className="spin-icon" /> : idx + 1}
            </div>
            <div className="deploy-step-label">{s}</div>
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', gap: 10, marginBottom: 18 }}>
        <button className="btn btn-primary" onClick={runPipeline} disabled={running}>
          {running ? <Ph name="spinner-gap" size={14} className="spin-icon" /> : <Ph name="play" size={14} />} {running ? '파이프라인 실행 중…' : '배포 파이프라인 실행'}
        </button>
        <button className="btn btn-outline" onClick={rollback}><Ph name="arrow-counter-clockwise" size={14} /> 직전 릴리스로 롤백</button>
      </div>

      <div className="log-console">
        {logs.length === 0 && <div className="log-line"><span className="lt">$</span> 파이프라인 실행 대기 중…</div>}
        {logs.map((l, i) => (
          <div className={"log-line" + (l.includes('완료') || l.includes('passed') || l.includes('200 OK') ? ' ok' : '')} key={i}>
            <span className="lt">[{String(i + 1).padStart(2, '0')}]</span> {l}
          </div>
        ))}
      </div>

      <div className="rollback-panel">
        <div className="rollback-info">현재 배포 버전 <strong>releases/2026092201</strong> · 이전 버전 <strong>releases/2026091501</strong> 보관 중</div>
        <span style={{ fontSize: 11.5, color: 'var(--s1-text)', display: 'flex', alignItems: 'center', gap: 5 }}><Ph name="check-circle" size={13} /> 서버 구조 변경 없음</span>
      </div>
    </main>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [searchOpen, setSearchOpen] = useState(null);
  const [quickView, setQuickView] = useState(null);
  const [favorites, setFavorites] = useState([1, 8]);
  const [toast, setToast] = useState(null);

  const showToast = (text, icon) => {
    setToast({ text, icon });
    setTimeout(() => setToast(null), 2600);
  };
  const toggleFav = (id) => setFavorites(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
  const onSubmitSearch = () => showToast('검색 조건을 적용해 결과를 재조회했습니다', 'magnifying-glass');

  return (
    <div className="app-shell">
      <StarField />
      <Header view={view} setView={setView} searchOpen={searchOpen} setSearchOpen={setSearchOpen} onSubmitSearch={onSubmitSearch} />
      {view === 'main' && <SearchMain onOpenPaper={setQuickView} favorites={favorites} toggleFav={toggleFav} />}
      {view === 'admin-workflow' && <AdminWorkflow showToast={showToast} />}
      {view === 'stats-dashboard' && <StatsDashboard />}
      {view === 'deploy-pipeline' && <DeployPipeline showToast={showToast} />}
      <QuickView paper={quickView} onClose={() => setQuickView(null)} />
      {toast && <Toast text={toast.text} icon={toast.icon} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
