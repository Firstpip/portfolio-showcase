<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온담 — 프리미엄 욕실용품 전문몰</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (hue 25°, dark) ── */
:root{
  --m50:#f1f0ef; --m100:#f1f0ef; --m200:#f1f0ef; --m300:#e3e0de; --m400:#c7c2be;
  --m500:#a59c96; --m600:#80736a; --m700:#5c4b40; --m800:#382416; --m900:#2e1e12;
  --n0:#201e1e; --n1:#3a3836; --n2:#5a5653; --n3:#7a7471; --n4:#989390;
  --n5:#bab7b5; --n6:#d7d6d5; --n7:#e6e5e5; --n8:#f0f0ef; --n9:#f8f7f7; --n10:#fdfcfc;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--n0); color:var(--n8);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n2);border-radius:8px;}
img{display:block;max-width:100%;}

/* ── keyframes ── */
@keyframes heroGlow{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.9;transform:scale(1.04);}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes ripple{from{transform:scale(0);opacity:.5;}to{transform:scale(2.6);opacity:0;}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes floatSlow{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes dashMove{to{stroke-dashoffset:-24;}}

/* ── app shell ── */
.app{width:100%;min-height:100vh;display:flex;flex-direction:column;}

.search-header{position:sticky;top:0;z-index:50;background:rgba(32,30,30,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--n1);}
.header-row{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:16px 32px;}
.brand{display:flex;align-items:baseline;gap:8px;flex-shrink:0;}
.brand-kr{font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--n9);}
.brand-en{font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--m400);text-transform:uppercase;}

.search-bar{flex:1;display:flex;align-items:center;border:1px solid var(--n2);border-radius:9999px;padding:4px;max-width:640px;transition:border-color .2s,box-shadow .2s;}
.search-bar:hover{border-color:var(--m600);box-shadow:0 4px 22px rgba(0,0,0,.35);}
.search-segment{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:8px 20px;border-radius:9999px;transition:background .15s;text-align:left;min-width:0;}
.search-segment:hover{background:var(--n1);}
.segment-label{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--n5);text-transform:uppercase;}
.segment-value{font-size:12.5px;color:var(--n8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.search-divider{width:1px;height:22px;background:var(--n2);}
.search-submit{width:38px;height:38px;border-radius:50%;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:2px;transition:transform .15s;position:relative;overflow:hidden;}
.search-submit:hover{transform:scale(1.06);}

.header-nav{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.nav-link{padding:10px 16px;border-radius:9999px;font-size:13px;font-weight:500;color:var(--n5);transition:background .15s,color .15s;white-space:nowrap;}
.nav-link:hover{background:var(--n1);color:var(--n9);}
.nav-link.active{background:var(--n1);color:var(--m400);}
.cart-btn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7);flex-shrink:0;}
.cart-btn:hover{background:var(--n1);}
.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--m400);color:var(--n0);font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.filter-chips{max-width:1400px;margin:0 auto;display:flex;gap:8px;padding:0 32px 14px;overflow-x:auto;}
.chip{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;border:1px solid var(--n2);font-size:12.5px;font-weight:500;color:var(--n6);white-space:nowrap;transition:all .15s;flex-shrink:0;}
.chip:hover{border-color:var(--m600);color:var(--n9);}
.chip.active{background:var(--n9);border-color:var(--n9);color:var(--n0);}

/* ── hero ── */
.hero{position:relative;width:100%;min-height:520px;overflow:hidden;background:radial-gradient(120% 100% at 20% 0%,var(--m900) 0%,var(--n0) 62%);display:flex;align-items:center;}
.hero-glow{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--m600) 0%,transparent 70%);animation:heroGlow 5s ease-in-out infinite;filter:blur(6px);}
.hero-inner{position:relative;z-index:2;max-width:1400px;margin:0 auto;width:100%;padding:64px 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--m400);text-transform:uppercase;margin-bottom:18px;}
.hero-title{font-size:44px;font-weight:600;line-height:1.18;letter-spacing:-.01em;color:var(--n9);margin-bottom:20px;}
.hero-title em{font-style:normal;color:var(--m400);}
.hero-desc{font-size:16px;line-height:1.7;color:var(--n6);max-width:440px;margin-bottom:32px;}
.hero-ctas{display:flex;gap:12px;}
.btn-primary{background:var(--m800);color:var(--n9);border:1px solid var(--m600);padding:14px 26px;border-radius:9999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .15s;position:relative;overflow:hidden;}
.btn-primary:hover{background:var(--m700);transform:translateY(-1px);}
.btn-ghost{border:1px solid var(--n3);color:var(--n8);padding:14px 22px;border-radius:9999px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s;}
.btn-ghost:hover{border-color:var(--m600);color:var(--n9);}

.hero-video{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--n1);background:linear-gradient(160deg,var(--m900),var(--n0));display:flex;align-items:center;justify-content:center;}
.hero-video-canvas{position:absolute;inset:0;}
.hero-play-btn{position:relative;z-index:2;width:64px;height:64px;border-radius:50%;background:rgba(253,252,252,.12);border:1px solid var(--n6);display:flex;align-items:center;justify-content:center;color:var(--n9);backdrop-filter:blur(4px);transition:transform .2s,background .2s;}
.hero-play-btn:hover{transform:scale(1.08);background:rgba(253,252,252,.2);}
.hero-video-caption{position:absolute;left:20px;bottom:18px;z-index:2;background:rgba(20,18,18,.55);border:1px solid var(--n1);border-radius:12px;padding:12px 16px;max-width:260px;}
.hero-video-caption .cap-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--n9);text-transform:uppercase;margin-bottom:4px;}
.hero-video-caption .cap-desc{font-size:11.5px;color:var(--n5);line-height:1.5;}
.playing .hero-video-canvas circle{animation:dashMove 2.4s linear infinite;}

/* ── product grid ── */
.section{max-width:1400px;margin:0 auto;padding:64px 32px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;}
.section-title{font-size:24px;font-weight:600;color:var(--n9);letter-spacing:-.01em;}
.section-sub{font-size:13px;color:var(--n5);margin-top:6px;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.listing-card{background:var(--n1);border:1px solid var(--n2);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;animation:cardIn .5s ease backwards;}
.listing-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.4);border-color:var(--m600);}
.card-image-wrap{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,var(--n2),var(--n0));display:flex;align-items:center;justify-content:center;}
.card-favorite{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(32,30,30,.6);display:flex;align-items:center;justify-content:center;color:var(--n7);transition:color .15s,transform .15s;}
.card-favorite:hover{transform:scale(1.1);}
.card-favorite.on{color:var(--s2);}
.card-badge{position:absolute;top:10px;left:10px;background:var(--n0);border:1px solid var(--n2);color:var(--n7);font-size:10px;font-weight:600;padding:4px 9px;border-radius:9999px;}
.card-body{padding:16px;}
.card-row-1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.card-title{font-size:14.5px;font-weight:600;color:var(--n9);line-height:1.3;}
.card-rating{font-size:12px;color:var(--n6);white-space:nowrap;display:flex;align-items:center;gap:3px;}
.card-rating i{color:var(--m400);}
.card-meta{font-size:12px;color:var(--n5);display:block;margin-bottom:2px;}
.card-row-4{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
.card-price{font-size:16px;font-weight:700;color:var(--n9);}
.price-unit{font-size:11.5px;color:var(--n5);}
.card-actions{display:flex;gap:8px;margin-top:12px;}
.card-add{flex:1;padding:8px 0;border-radius:9999px;border:1px solid var(--n2);font-size:12.5px;font-weight:600;color:var(--n8);transition:all .15s;}
.card-add:hover{background:var(--m800);border-color:var(--m600);color:var(--n9);}

/* ── reviews / sns ── */
.review-track{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth;}
.review-card{flex:0 0 300px;background:var(--n1);border:1px solid var(--n2);border-radius:14px;padding:18px;}
.review-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.review-name{font-size:13px;font-weight:600;color:var(--n9);}
.review-stars{font-size:11px;color:var(--m400);}
.review-photo{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--n2);}
.review-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.02);}
.review-text{font-size:12.5px;line-height:1.6;color:var(--n6);}
.review-arrows{display:flex;gap:8px;margin-top:14px;}
.arrow-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n7);transition:border-color .15s;}
.arrow-btn:hover{border-color:var(--m600);color:var(--n9);}

.sns-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:32px;}
.sns-tile{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--n2);}
.sns-tile img{width:100%;height:100%;object-fit:cover;}
.sns-tile .sns-heart{position:absolute;bottom:8px;left:8px;font-size:11px;color:var(--n9);display:flex;align-items:center;gap:3px;background:rgba(20,18,18,.5);padding:3px 7px;border-radius:9999px;}

/* ── footer ── */
.footer{border-top:1px solid var(--n1);margin-top:40px;}
.footer-cols{max-width:1400px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.footer-col h4{font-size:12.5px;font-weight:600;color:var(--n8);margin-bottom:14px;}
.footer-col a{display:block;font-size:12.5px;color:var(--n5);margin-bottom:9px;}
.footer-col a:hover{color:var(--n9);}
.footer-note{font-size:11.5px;color:var(--n4);line-height:1.7;}
.footer-bottom{max-width:1400px;margin:0 auto;padding:0 32px 32px;font-size:11px;color:var(--n4);}

/* ── chat widget ── */
.chat-fab{position:fixed;right:26px;bottom:26px;z-index:80;width:56px;height:56px;border-radius:50%;background:var(--m700);color:var(--n9);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .2s;animation:floatSlow 3.4s ease-in-out infinite;}
.chat-fab:hover{transform:scale(1.06);}
.chat-panel{position:fixed;right:26px;bottom:92px;z-index:80;width:320px;max-height:420px;background:var(--n1);border:1px solid var(--n2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:cardIn .25s ease;}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--n2);display:flex;justify-content:space-between;align-items:center;}
.chat-head strong{font-size:13.5px;color:var(--n9);}
.chat-close{color:var(--n6);}
.chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:180px;}
.chat-msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;}
.chat-msg.them{background:var(--n2);color:var(--n8);align-self:flex-start;border-bottom-left-radius:2px;}
.chat-msg.me{background:var(--m700);color:var(--n9);align-self:flex-end;border-bottom-right-radius:2px;}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--n2);}
.chat-input-row input{flex:1;background:var(--n0);border:1px solid var(--n2);border-radius:9999px;padding:9px 14px;font-size:12.5px;color:var(--n9);}
.chat-send{width:34px;height:34px;border-radius:50%;background:var(--m700);color:var(--n9);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── toast ── */
.toast-stack{position:fixed;right:26px;bottom:26px;z-index:100;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{background:var(--n9);color:var(--n0);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;}
.toast.err{background:var(--s2);color:var(--n9);}

/* ── modal / drawer ── */
.overlay{position:fixed;inset:0;background:rgba(10,9,8,.6);z-index:90;display:flex;align-items:stretch;justify-content:flex-end;backdrop-filter:blur(2px);}
.overlay.center{align-items:center;justify-content:center;}
.drawer{width:420px;max-width:92vw;background:var(--n1);height:100%;overflow-y:auto;animation:drawerIn .28s cubic-bezier(.19,1,.22,1);border-left:1px solid var(--n2);}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--n2);position:sticky;top:0;background:var(--n1);z-index:2;}
.drawer-head strong{font-size:14.5px;color:var(--n9);}
.drawer-close{color:var(--n6);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.drawer-close:hover{background:var(--n2);}
.drawer-body{padding:22px;}
.qv-image{width:100%;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(150deg,var(--n2),var(--n0));display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.qv-title{font-size:18px;font-weight:600;color:var(--n9);margin-bottom:6px;}
.qv-price{font-size:20px;font-weight:700;color:var(--n9);margin-bottom:14px;}
.qv-desc{font-size:13px;line-height:1.7;color:var(--n6);margin-bottom:20px;}
.qv-actions{display:flex;gap:10px;}

.modal-box{background:var(--n1);border-radius:16px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;border:1px solid var(--n2);animation:cardIn .22s ease;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--n2);display:flex;justify-content:space-between;align-items:center;}
.modal-head strong{font-size:15px;color:var(--n9);}
.modal-body{padding:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--n6);margin-bottom:7px;}
.field input,.field textarea,.field select{width:100%;background:var(--n0);border:1px solid var(--n2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--n9);}
.field textarea{resize:vertical;min-height:70px;}
.field-err{font-size:11px;color:var(--s2);margin-top:5px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--n2);display:flex;justify-content:flex-end;gap:10px;}

/* ── product detail ── */
.pd-wrap{max-width:1400px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:.95fr 1.05fr;gap:56px;}
.pd-gallery-main{aspect-ratio:1/1;border-radius:16px;background:radial-gradient(120% 120% at 30% 20%,var(--m900),var(--n0));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:14px;border:1px solid var(--n1);}
.pd-thumbs{display:flex;gap:10px;}
.pd-thumb{width:64px;height:64px;border-radius:10px;background:var(--n1);border:1px solid var(--n2);display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
.pd-thumb.active{border-color:var(--m600);}
.pd-crumb{font-size:12px;color:var(--n5);margin-bottom:14px;}
.pd-title{font-size:28px;font-weight:600;color:var(--n9);margin-bottom:10px;letter-spacing:-.01em;}
.pd-rating-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:var(--n6);}
.pd-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--n2);}
.pd-price{font-size:28px;font-weight:700;color:var(--n9);}
.pd-qty{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.qty-box{display:flex;align-items:center;border:1px solid var(--n2);border-radius:9999px;}
.qty-box button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--n8);}
.qty-box span{width:34px;text-align:center;font-size:13px;color:var(--n9);}
.pd-cta-row{display:flex;gap:12px;margin-bottom:32px;}
.pd-spec-table{width:100%;border-collapse:collapse;margin-bottom:32px;}
.pd-spec-table tr{border-bottom:1px solid var(--n2);}
.pd-spec-table td{padding:12px 0;font-size:13px;color:var(--n6);}
.pd-spec-table td:first-child{width:120px;color:var(--n5);font-weight:600;}
.pd-tabs{display:flex;gap:4px;border-bottom:1px solid var(--n2);margin-bottom:24px;}
.pd-tab{padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--n5);border-bottom:2px solid transparent;}
.pd-tab.active{color:var(--n9);border-color:var(--m600);}
.usage-block{margin-bottom:22px;}
.usage-visual{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,var(--n1),var(--n0));display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--n1);}
.usage-step-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--m400);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.usage-desc{font-size:13px;line-height:1.7;color:var(--n6);}

/* ── checkout ── */
.co-wrap{max-width:1100px;margin:0 auto;padding:48px 32px 90px;display:grid;grid-template-columns:1.3fr .9fr;gap:44px;}
.co-title{font-size:22px;font-weight:600;color:var(--n9);margin-bottom:22px;}
.cart-item{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--n2);}
.cart-thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(150deg,var(--n2),var(--n0));flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.cart-info{flex:1;min-width:0;}
.cart-name{font-size:13.5px;font-weight:600;color:var(--n9);margin-bottom:4px;}
.cart-opt{font-size:11.5px;color:var(--n5);}
.cart-remove{color:var(--n5);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.cart-remove:hover{color:var(--s2);background:var(--n2);}
.co-form-title{font-size:14px;font-weight:600;color:var(--n9);margin:28px 0 14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.summary-card{background:var(--n1);border:1px solid var(--n2);border-radius:16px;padding:22px;position:sticky;top:96px;height:fit-content;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--n6);margin-bottom:12px;}
.summary-row.total{font-size:16px;font-weight:700;color:var(--n9);border-top:1px solid var(--n2);padding-top:14px;margin-top:6px;}
.pg-badge{display:flex;align-items:center;gap:8px;background:var(--n0);border:1px solid var(--n2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--n6);margin:16px 0;}
.pay-status{margin-top:16px;padding:14px;border-radius:10px;background:var(--s1-bg);color:var(--s1-text);font-size:12.5px;display:flex;align-items:center;gap:8px;}

/* ── admin products ── */
.admin-wrap{max-width:1400px;margin:0 auto;padding:40px 32px 90px;}
.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.admin-table-wrap{background:var(--n1);border:1px solid var(--n2);border-radius:14px;overflow:hidden;}
table.admin-table{width:100%;border-collapse:collapse;}
.admin-table th{text-align:left;font-size:11.5px;font-weight:600;color:var(--n5);text-transform:uppercase;letter-spacing:.04em;padding:14px 18px;border-bottom:1px solid var(--n2);}
.admin-table td{padding:14px 18px;font-size:13px;color:var(--n8);border-bottom:1px solid var(--n2);}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table tr:hover td{background:var(--n2);}
.row-thumb{width:38px;height:38px;border-radius:8px;background:linear-gradient(150deg,var(--n2),var(--n0));display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:10px;}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:9999px;}
.status-pill.on{background:var(--s1-bg);color:var(--s1-text);}
.status-pill.off{background:var(--n2);color:var(--n6);}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--n6);}
.icon-btn:hover{background:var(--n2);color:var(--n9);}
.upload-zone{border:1.5px dashed var(--n3);border-radius:12px;padding:24px;text-align:center;color:var(--n5);font-size:12.5px;margin-bottom:6px;transition:border-color .15s;}
.upload-zone.drag{border-color:var(--m600);color:var(--n8);}
.upload-progress-track{height:6px;background:var(--n2);border-radius:9999px;overflow:hidden;margin-top:10px;}
.upload-progress-fill{height:100%;background:var(--m600);border-radius:9999px;transition:width .2s;}

@media(max-width:960px){
  .hero-inner{grid-template-columns:1fr;}
  .pd-wrap,.co-wrap{grid-template-columns:1fr;}
  .footer-cols{grid-template-columns:1fr 1fr;}
  .sns-grid{grid-template-columns:repeat(3,1fr);}
  .search-bar{display:none;}
  .header-nav{gap:2px;}
  .header-nav .nav-link{padding:9px 10px;font-size:12px;}
}
@media(max-width:600px){
  .header-row{gap:10px;padding:14px 16px;}
  .header-nav .nav-link{display:none;}
  .filter-chips{padding:0 16px 14px;}
  .hero-inner{padding:40px 16px;}
  .section{padding:40px 16px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect} = React;

const CATEGORIES = ["전체","샤워헤드","수전","디퓨저","선반","조명","액세서리"];

const PRODUCTS = [
  {id:1,name:"온담 레인미스트 샤워헤드",cat:"샤워헤드",price:189000,rating:4.9,reviews:212,badge:"BEST",hue:"m"},
  {id:2,name:"온담 웜터치 수전 세트",cat:"수전",price:268000,rating:4.8,reviews:96,badge:null,hue:"n"},
  {id:3,name:"온담 시트러스 디퓨저 스탠드",cat:"디퓨저",price:84000,rating:4.7,reviews:154,badge:"NEW",hue:"n"},
  {id:4,name:"온담 리트리트 선반 유닛",cat:"선반",price:132000,rating:4.6,reviews:58,badge:null,hue:"n"},
  {id:5,name:"온담 미러라이트 조명 바",cat:"조명",price:156000,rating:4.9,reviews:83,badge:null,hue:"n"},
  {id:6,name:"온담 스톤그레인 발매트",cat:"액세서리",price:58000,rating:4.5,reviews:121,badge:null,hue:"n"},
  {id:7,name:"온담 히트글로우 수건걸이",cat:"액세서리",price:96000,rating:4.7,reviews:44,badge:null,hue:"n"},
  {id:8,name:"온담 캄웨이브 배수 트랩",cat:"샤워헤드",price:74000,rating:4.4,reviews:31,badge:"NEW",hue:"n"},
];

const REVIEWS = [
  {name:"김서연",initial:"김",stars:5,seed:"ondam-rv-1",text:"물줄기가 은은하게 퍼져서 샤워할 때마다 기분이 좋아집니다. 설치도 어렵지 않았어요."},
  {name:"박도윤",initial:"박",stars:5,seed:"ondam-rv-2",text:"욕실 전체 분위기가 달라 보입니다. 수전 색감이 사진보다 고급스럽습니다."},
  {name:"이하은",initial:"이",stars:4,seed:"ondam-rv-3",text:"디퓨저 스탠드 크기가 딱 알맞고, 향 지속력도 만족스럽습니다."},
  {name:"최지호",initial:"최",stars:5,seed:"ondam-rv-4",text:"주말마다 반신욕할 때 조명 바를 켜두면 스파에 온 듯한 느낌입니다."},
  {name:"정유나",initial:"정",stars:5,seed:"ondam-rv-5",text:"수건걸이 발열 기능이 겨울에 특히 유용할 것 같습니다."},
];

const SNS_SEEDS = ["ondam-sns-1","ondam-sns-2","ondam-sns-3","ondam-sns-4","ondam-sns-5","ondam-sns-6"];

function formatWon(n){ return n.toLocaleString('ko-KR') + "원"; }

function ProductVisual({hue="m", size=64}){
  const stroke = hue==="m" ? "var(--m400)" : "var(--n5)";
  return (
    <svg width="60%" height="60%" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="38" r="22" stroke={stroke} strokeWidth="2" strokeDasharray="6 4"/>
      <path d="M30 62 L70 62 L64 90 L36 90 Z" stroke={stroke} strokeWidth="2" strokeLinejoin="round"/>
      <circle cx="50" cy="38" r="6" fill={stroke}/>
    </svg>
  );
}

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div key={t.id} className={"toast" + (t.type==="err" ? " err" : "")}>
          <i className={t.type==="err" ? "ph ph-x-circle" : "ph ph-check-circle"}></i>{t.msg}
        </div>
      ))}
    </div>
  );
}

function Ripple({e, targetClass}){
  // simple ripple effect helper invoked inline in onClick handlers
}

function App(){
  const [screen,setScreen] = useState("main");
  const [activeCat,setActiveCat] = useState("전체");
  const [cart,setCart] = useState([{id:1,qty:1},{id:3,qty:2}]);
  const [favorites,setFavorites] = useState([]);
  const [quickView,setQuickView] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [chatOpen,setChatOpen] = useState(false);
  const [chatMsgs,setChatMsgs] = useState([{from:"them",text:"안녕하세요! 온담 상담팀입니다. 궁금하신 점을 남겨주세요."}]);
  const [chatInput,setChatInput] = useState("");
  const [playingHero,setPlayingHero] = useState(false);
  const [reviewIdx,setReviewIdx] = useState(0);
  const reviewTrackRef = useRef(null);

  const [pdTab,setPdTab] = useState("spec");
  const [pdQty,setPdQty] = useState(1);
  const [pdThumb,setPdThumb] = useState(0);

  const [payStep,setPayStep] = useState("idle"); // idle | processing | done
  const [addrForm,setAddrForm] = useState({name:"김민수",phone:"010-1234-5678",addr:"서울시 마포구 연남로 12길 8"});

  const [adminProducts,setAdminProducts] = useState(PRODUCTS.map(p=>({...p,active:true})));
  const [adminModal,setAdminModal] = useState(null); // {mode:'new'|'edit', data}
  const [deleteTarget,setDeleteTarget] = useState(null);
  const [uploadPct,setUploadPct] = useState(0);
  const [uploading,setUploading] = useState(false);
  const [formErr,setFormErr] = useState({});

  function pushToast(msg, type="ok"){
    const id = Date.now()+Math.random();
    setToasts(t => [...t,{id,msg,type}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 2600);
  }

  function goScreen(s){ setScreen(s); window.scrollTo({top:0,behavior:"smooth"}); }

  function addToCart(id, qty=1){
    setCart(c => {
      const found = c.find(x=>x.id===id);
      if(found) return c.map(x=> x.id===id ? {...x,qty:x.qty+qty} : x);
      return [...c,{id,qty}];
    });
    pushToast("장바구니에 담았습니다");
  }

  function removeFromCart(id){
    setCart(c => c.filter(x=>x.id!==id));
  }

  function toggleFavorite(id){
    setFavorites(f => f.includes(id) ? f.filter(x=>x!==id) : [...f,id]);
  }

  function openQuickView(p){ setQuickView(p); setPdQty(1); }

  function goProductDetail(p){
    setQuickView(null);
    setPdTab("spec"); setPdQty(1); setPdThumb(0);
    goScreen("product-detail");
  }

  function sendChat(){
    if(!chatInput.trim()) return;
    const msg = chatInput.trim();
    setChatMsgs(m => [...m,{from:"me",text:msg}]);
    setChatInput("");
    setTimeout(()=>{
      setChatMsgs(m => [...m,{from:"them",text:"문의 감사합니다. 상담원이 곧 이어서 답변드리겠습니다."}]);
    }, 900);
  }

  function scrollReview(dir){
    if(!reviewTrackRef.current) return;
    reviewTrackRef.current.scrollBy({left: dir*320, behavior:"smooth"});
  }

  const cartItems = cart.map(c => ({...c, product: PRODUCTS.find(p=>p.id===c.id)})).filter(c=>c.product);
  const cartTotal = cartItems.reduce((s,c)=> s + c.product.price*c.qty, 0);
  const shipFee = cartTotal > 0 && cartTotal < 100000 ? 3000 : 0;

  function startPayment(){
    setPayStep("processing");
    setTimeout(()=>{
      setPayStep("done");
      pushToast("결제가 완료되었습니다");
    }, 1600);
  }

  function openAdminNew(){
    setFormErr({});
    setAdminModal({mode:"new", data:{name:"",cat:"샤워헤드",price:""}});
  }
  function openAdminEdit(p){
    setFormErr({});
    setAdminModal({mode:"edit", data:{...p}});
  }
  function saveAdminProduct(){
    const d = adminModal.data;
    const errs = {};
    if(!d.name || d.name.trim().length<2) errs.name = "상품명을 2자 이상 입력해주세요";
    if(!d.price || Number(d.price)<=0) errs.price = "가격을 올바르게 입력해주세요";
    if(Object.keys(errs).length){ setFormErr(errs); return; }
    if(adminModal.mode==="new"){
      const id = Math.max(...adminProducts.map(p=>p.id))+1;
      setAdminProducts(list => [...list, {...d, id, price:Number(d.price), rating:4.5, reviews:0, badge:"NEW", hue:"n", active:true}]);
      pushToast("상품이 등록되었습니다");
    } else {
      setAdminProducts(list => list.map(p => p.id===d.id ? {...p, ...d, price:Number(d.price)} : p));
      pushToast("상품 정보가 수정되었습니다");
    }
    setAdminModal(null);
  }
  function confirmDelete(){
    setAdminProducts(list => list.filter(p=>p.id!==deleteTarget.id));
    pushToast("상품이 삭제되었습니다");
    setDeleteTarget(null);
  }
  function toggleAdminActive(id){
    setAdminProducts(list => list.map(p => p.id===id ? {...p, active:!p.active} : p));
  }
  function simulateUpload(){
    setUploading(true); setUploadPct(0);
    const t = setInterval(()=>{
      setUploadPct(v => {
        if(v>=100){ clearInterval(t); setUploading(false); pushToast("이미지 업로드가 완료되었습니다"); return 100; }
        return v+18;
      });
    }, 200);
  }

  const filteredProducts = activeCat==="전체" ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);

  return (
    <div className="app" data-archetype="airbnb-search-grid">
      <header className="search-header">
        <div className="header-row">
          <div className="brand">
            <span className="brand-kr">온담</span>
            <span className="brand-en">ONDAM BATH</span>
          </div>
          <div className="search-bar">
            <button className="search-segment" onClick={()=>document.getElementById('grid-section') && document.getElementById('grid-section').scrollIntoView({behavior:'smooth'})}>
              <span className="segment-label">카테고리</span>
              <span className="segment-value">{activeCat}</span>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>pushToast("가격대 필터를 적용했습니다")}>
              <span className="segment-label">가격대</span>
              <span className="segment-value">5만원 ~ 30만원</span>
            </button>
            <div className="search-divider"></div>
            <button className="search-segment" onClick={()=>pushToast("마감재 필터를 적용했습니다")}>
              <span className="segment-label">마감</span>
              <span className="segment-value">전체 마감재</span>
            </button>
            <button className="search-submit" onClick={()=>pushToast("검색 결과를 불러왔습니다")}>
              <i className="ph ph-magnifying-glass"></i>
            </button>
          </div>
          <nav className="header-nav">
            <button className={"nav-link" + (screen==="main"?" active":"")} onClick={()=>goScreen("main")}>메인</button>
            <button className={"nav-link" + (screen==="product-detail"?" active":"")} onClick={()=>{ setPdTab("spec"); setPdQty(1); setPdThumb(0); goScreen("product-detail"); }}>상품 상세</button>
            <button className={"nav-link" + (screen==="checkout"?" active":"")} onClick={()=>goScreen("checkout")}>장바구니·결제</button>
            <button className={"nav-link" + (screen==="admin-products"?" active":"")} onClick={()=>goScreen("admin-products")}>상품 관리</button>
            <button className="cart-btn" onClick={()=>goScreen("checkout")}>
              <i className="ph ph-shopping-cart"></i>
              {cartItems.length>0 && <span className="cart-badge">{cartItems.length}</span>}
            </button>
          </nav>
        </div>
        <div className="filter-chips">
          {[
            {label:"전체",icon:"ph-squares-four"},
            {label:"샤워헤드",icon:"ph-drop"},
            {label:"수전",icon:"ph-faucet"},
            {label:"디퓨저",icon:"ph-flame"},
            {label:"선반",icon:"ph-stack"},
            {label:"조명",icon:"ph-lightbulb"},
            {label:"액세서리",icon:"ph-dots-nine"},
          ].map(c => (
            <button key={c.label} className={"chip" + (activeCat===c.label ? " active" : "")} onClick={()=>setActiveCat(c.label)}>
              <i className={"ph " + c.icon}></i><span>{c.label}</span>
            </button>
          ))}
        </div>
      </header>

      {screen==="main" && (
        <main>
          <section className="hero">
            <div className="hero-glow"></div>
            <div className="hero-inner">
              <div>
                <div className="hero-eyebrow">Ondam Bath Collection</div>
                <h1 className="hero-title">매일 쓰는 욕실에<br/><em>온기 하나</em>를 더합니다</h1>
                <p className="hero-desc">물줄기, 조명, 향까지 — 온담은 매일의 루틴을 작은 리추얼로 바꾸는 욕실용품을 만듭니다. 설치 이후에도 오래 남는 감각을 설계합니다.</p>
                <div className="hero-ctas">
                  <button className="btn-primary" onClick={()=>document.getElementById('grid-section').scrollIntoView({behavior:'smooth'})}>
                    <i className="ph ph-shopping-bag-open"></i> 컬렉션 둘러보기
                  </button>
                  <button className="btn-ghost" onClick={()=>setPlayingHero(p=>!p)}>
                    <i className={playingHero ? "ph ph-pause" : "ph ph-play"}></i> {playingHero ? "영상 일시정지" : "브랜드 영상 보기"}
                  </button>
                </div>
              </div>
              <div className={"hero-video" + (playingHero ? " playing" : "")}>
                <svg className="hero-video-canvas" width="100%" height="100%" viewBox="0 0 400 300" fill="none">
                  <defs>
                    <radialGradient id="vg" cx="50%" cy="35%" r="65%">
                      <stop offset="0%" stopColor="var(--m600)" stopOpacity="0.5"/>
                      <stop offset="100%" stopColor="var(--m900)" stopOpacity="0"/>
                    </radialGradient>
                  </defs>
                  <rect width="400" height="300" fill="url(#vg)"/>
                  <circle cx="200" cy="130" r="60" stroke="var(--n7)" strokeWidth="1.4" strokeDasharray="8 6"/>
                  <circle cx="200" cy="130" r="86" stroke="var(--n4)" strokeWidth="1" strokeDasharray="4 10"/>
                  <path d="M150 200 Q200 260 250 200" stroke="var(--m400)" strokeWidth="2" fill="none"/>
                </svg>
                <button className="hero-play-btn" onClick={()=>setPlayingHero(p=>!p)}>
                  <i className={playingHero ? "ph ph-pause" : "ph ph-play"} style={{fontSize:24}}></i>
                </button>
                <div className="hero-video-caption">
                  <div className="cap-title">Ondam Film — Rainmist</div>
                  <div className="cap-desc">레인미스트 샤워헤드의 물줄기 구조를 담은 30초 소개 영상입니다.</div>
                </div>
              </div>
            </div>
          </section>

          <section className="section" id="grid-section">
            <div className="section-head">
              <div>
                <div className="section-title">{activeCat==="전체" ? "온담 컬렉션" : activeCat + " 컬렉션"}</div>
                <div className="section-sub">{filteredProducts.length}개의 상품 · 온담이 직접 기획하고 생산합니다</div>
              </div>
            </div>
            <div className="card-grid">
              {filteredProducts.map((p,i) => (
                <article key={p.id} className="listing-card" style={{animationDelay:(i*0.05)+"s"}} onClick={()=>openQuickView(p)}>
                  <div className="card-image-wrap">
                    {p.badge && <span className="card-badge">{p.badge}</span>}
                    <button className="card-favorite" onClick={(e)=>{e.stopPropagation(); toggleFavorite(p.id);}}>
                      <i className={favorites.includes(p.id) ? "ph-fill ph-heart" : "ph ph-heart"} style={favorites.includes(p.id) ? {color:"var(--s2)"} : {}}></i>
                    </button>
                    <ProductVisual hue={p.hue} />
                  </div>
                  <div className="card-body">
                    <div className="card-row-1">
                      <h3 className="card-title">{p.name}</h3>
                      <div className="card-rating"><i className="ph-fill ph-star"></i>{p.rating}</div>
                    </div>
                    <span className="card-meta">{p.cat} · 리뷰 {p.reviews}건</span>
                    <div className="card-row-4">
                      <strong className="card-price">{formatWon(p.price)}</strong>
                    </div>
                    <div className="card-actions">
                      <button className="card-add" onClick={(e)=>{e.stopPropagation(); addToCart(p.id);}}>장바구니 담기</button>
                    </div>
                  </div>
                </article>
              ))}
            </div>
          </section>

          <section className="section">
            <div className="section-head">
              <div>
                <div className="section-title">고객 리뷰</div>
                <div className="section-sub">온담을 먼저 사용해본 분들의 생생한 후기</div>
              </div>
              <div className="review-arrows">
                <button className="arrow-btn" onClick={()=>scrollReview(-1)}><i className="ph ph-caret-left"></i></button>
                <button className="arrow-btn" onClick={()=>scrollReview(1)}><i className="ph ph-caret-right"></i></button>
              </div>
            </div>
            <div className="review-track" ref={reviewTrackRef}>
              {REVIEWS.map((r,i) => (
                <div className="review-card" key={i}>
                  <div className="review-photo">
                    <img src={"https://picsum.photos/seed/"+r.seed+"/320/200"} alt="리뷰 사진" loading="lazy"/>
                  </div>
                  <div className="review-top">
                    <span className="avatar">{r.initial}</span>
                    <div>
                      <div className="review-name">{r.name}</div>
                      <div className="review-stars">{"★".repeat(r.stars)}{"☆".repeat(5-r.stars)}</div>
                    </div>
                  </div>
                  <p className="review-text">{r.text}</p>
                </div>
              ))}
            </div>
            <div className="sns-grid">
              {SNS_SEEDS.map((s,i) => (
                <div className="sns-tile" key={i}>
                  <img src={"https://picsum.photos/seed/"+s+"/240/240"} alt="인스타그램 피드" loading="lazy"/>
                  <span className="sns-heart"><i className="ph-fill ph-heart"></i> {80+i*7}</span>
                </div>
              ))}
            </div>
          </section>
        </main>
      )}

      {screen==="product-detail" && (
        <main>
          <div className="pd-wrap">
            <div>
              <div className="pd-gallery-main">
                <ProductVisual hue="m" size={200}/>
              </div>
              <div className="pd-thumbs">
                {[0,1,2,3].map(i => (
                  <button key={i} className={"pd-thumb" + (pdThumb===i ? " active" : "")} onClick={()=>setPdThumb(i)}>
                    <i className="ph ph-drop" style={{color:"var(--n5)"}}></i>
                  </button>
                ))}
              </div>
            </div>
            <div>
              <div className="pd-crumb">온담 &gt; 샤워헤드 &gt; 레인미스트</div>
              <h1 className="pd-title">온담 레인미스트 샤워헤드</h1>
              <div className="pd-rating-row"><i className="ph-fill ph-star" style={{color:"var(--m400)"}}></i> 4.9 · 리뷰 212건 · 문의 18건</div>
              <div className="pd-price-row">
                <span className="pd-price">{formatWon(189000)}</span>
              </div>
              <div className="pd-qty">
                <span style={{fontSize:13,color:"var(--n6)"}}>수량</span>
                <div className="qty-box">
                  <button onClick={()=>setPdQty(q=>Math.max(1,q-1))}><i className="ph ph-minus"></i></button>
                  <span>{pdQty}</span>
                  <button onClick={()=>setPdQty(q=>q+1)}><i className="ph ph-plus"></i></button>
                </div>
              </div>
              <div className="pd-cta-row">
                <button className="btn-primary" onClick={()=>{ addToCart(1, pdQty); }}><i className="ph ph-shopping-cart"></i> 장바구니 담기</button>
                <button className="btn-ghost" onClick={()=>{ addToCart(1, pdQty); goScreen("checkout"); }}>바로 구매</button>
              </div>
              <div className="pd-tabs">
                <button className={"pd-tab"+(pdTab==="spec"?" active":"")} onClick={()=>setPdTab("spec")}>제품 사양</button>
                <button className={"pd-tab"+(pdTab==="usage"?" active":"")} onClick={()=>setPdTab("usage")}>사용 방법</button>
                <button className={"pd-tab"+(pdTab==="review"?" active":"")} onClick={()=>setPdTab("review")}>리뷰</button>
              </div>
              {pdTab==="spec" && (
                <table className="pd-spec-table">
                  <tbody>
                    <tr><td>소재</td><td>스테인리스 스틸 + 세라믹 코팅</td></tr>
                    <tr><td>수압 방식</td><td>3단 레인미스트 전환</td></tr>
                    <tr><td>설치 방식</td><td>표준 규격 나사 체결 (공구 불필요)</td></tr>
                    <tr><td>색상</td><td>웜 그레이 / 브러시드 브론즈</td></tr>
                    <tr><td>구성품</td><td>본체, 연결 호스, 설치 가이드</td></tr>
                  </tbody>
                </table>
              )}
              {pdTab==="usage" && (
                <div>
                  <div className="usage-block">
                    <div className="usage-visual"><i className="ph ph-wrench" style={{fontSize:34,color:"var(--n5)"}}></i></div>
                    <div className="usage-step-badge">Step 1 · 설치 준비</div>
                    <p className="usage-desc">기존 샤워헤드를 분리하고 연결부의 실리콘 패킹을 확인합니다. 별도 공구 없이 손으로 체결 가능합니다.</p>
                  </div>
                  <div className="usage-block">
                    <div className="usage-visual"><i className="ph ph-drop-half" style={{fontSize:34,color:"var(--n5)"}}></i></div>
                    <div className="usage-step-badge">Step 2 · 수압 모드 전환</div>
                    <p className="usage-desc">헤드 옆면의 다이얼을 돌려 레인 · 미스트 · 마사지 모드를 선택합니다. 모드별 수압은 상세 페이지 영상으로 안내합니다.</p>
                  </div>
                  <div className="usage-block">
                    <div className="usage-visual"><i className="ph ph-sparkle" style={{fontSize:34,color:"var(--n5)"}}></i></div>
                    <div className="usage-step-badge">Step 3 · 관리 방법</div>
                    <p className="usage-desc">월 1회 구연산 희석액으로 노즐을 닦아주면 미네랄 침착을 줄일 수 있습니다.</p>
                  </div>
                </div>
              )}
              {pdTab==="review" && (
                <div>
                  {REVIEWS.slice(0,3).map((r,i)=>(
                    <div key={i} style={{padding:"14px 0",borderBottom:"1px solid var(--n2)"}}>
                      <div className="review-top">
                        <span className="avatar">{r.initial}</span>
                        <div>
                          <div className="review-name">{r.name}</div>
                          <div className="review-stars">{"★".repeat(r.stars)}{"☆".repeat(5-r.stars)}</div>
                        </div>
                      </div>
                      <p className="review-text" style={{marginTop:8}}>{r.text}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </main>
      )}

      {screen==="checkout" && (
        <main>
          <div className="co-wrap">
            <div>
              <h2 className="co-title">장바구니</h2>
              {cartItems.length===0 && <p style={{color:"var(--n5)",fontSize:13}}>장바구니가 비어 있습니다.</p>}
              {cartItems.map(c => (
                <div className="cart-item" key={c.id}>
                  <div className="cart-thumb"><ProductVisual hue={c.product.hue} size={36}/></div>
                  <div className="cart-info">
                    <div className="cart-name">{c.product.name}</div>
                    <div className="cart-opt">{formatWon(c.product.price)} · 수량 {c.qty}개</div>
                  </div>
                  <strong style={{fontSize:13.5,color:"var(--n9)"}}>{formatWon(c.product.price*c.qty)}</strong>
                  <button className="cart-remove" onClick={()=>removeFromCart(c.id)}><i className="ph ph-trash"></i></button>
                </div>
              ))}

              <h3 className="co-form-title">배송 정보</h3>
              <div className="form-grid">
                <div className="field"><label>받는 분</label><input value={addrForm.name} onChange={e=>setAddrForm(f=>({...f,name:e.target.value}))}/></div>
                <div className="field"><label>연락처</label><input value={addrForm.phone} onChange={e=>setAddrForm(f=>({...f,phone:e.target.value}))}/></div>
                <div className="field" style={{gridColumn:"1 / -1"}}><label>배송 주소</label><input value={addrForm.addr} onChange={e=>setAddrForm(f=>({...f,addr:e.target.value}))}/></div>
                <div className="field" style={{gridColumn:"1 / -1"}}><label>배송 메모</label><textarea placeholder="예: 부재 시 경비실에 맡겨주세요"></textarea></div>
              </div>
            </div>

            <div className="summary-card">
              <h3 style={{fontSize:14,fontWeight:600,color:"var(--n9)",marginBottom:16}}>결제 금액</h3>
              <div className="summary-row"><span>상품 금액</span><span>{formatWon(cartTotal)}</span></div>
              <div className="summary-row"><span>배송비</span><span>{shipFee===0 ? "무료" : formatWon(shipFee)}</span></div>
              <div className="summary-row total"><span>총 결제 금액</span><span>{formatWon(cartTotal+shipFee)}</span></div>
              <div className="pg-badge"><i className="ph ph-shield-check"></i> 포트원 결제 시스템으로 안전하게 결제됩니다</div>
              {payStep==="idle" && (
                <button className="btn-primary" style={{width:"100%",justifyContent:"center"}} onClick={startPayment} disabled={cartItems.length===0}>
                  <i className="ph ph-lock-key"></i> {formatWon(cartTotal+shipFee)} 결제하기
                </button>
              )}
              {payStep==="processing" && (
                <button className="btn-primary" style={{width:"100%",justifyContent:"center",opacity:.7}} disabled>
                  <i className="ph ph-spinner-gap"></i> 결제 진행 중...
                </button>
              )}
              {payStep==="done" && (
                <div className="pay-status"><i className="ph-fill ph-check-circle"></i> 결제가 완료되었습니다. 주문번호 ONDM-88213</div>
              )}
            </div>
          </div>
        </main>
      )}

      {screen==="admin-products" && (
        <main>
          <div className="admin-wrap">
            <div className="admin-top">
              <div>
                <h2 style={{fontSize:20,fontWeight:600,color:"var(--n9)"}}>상품 관리</h2>
                <p style={{fontSize:12.5,color:"var(--n5)",marginTop:4}}>발주사가 직접 상품을 등록하고 노출 상태를 관리하는 화면입니다</p>
              </div>
              <button className="btn-primary" onClick={openAdminNew}><i className="ph ph-plus"></i> 신규 상품 등록</button>
            </div>

            <div className="admin-table-wrap">
              <table className="admin-table">
                <thead>
                  <tr><th>상품</th><th>카테고리</th><th>가격</th><th>노출 상태</th><th style={{textAlign:"right"}}>관리</th></tr>
                </thead>
                <tbody>
                  {adminProducts.map(p => (
                    <tr key={p.id}>
                      <td><span className="row-thumb"><i className="ph ph-package" style={{fontSize:16,color:"var(--n5)"}}></i></span>{p.name}</td>
                      <td>{p.cat}</td>
                      <td>{formatWon(p.price)}</td>
                      <td>
                        <button className={"status-pill " + (p.active?"on":"off")} onClick={()=>toggleAdminActive(p.id)}>
                          <i className={p.active?"ph-fill ph-check-circle":"ph ph-eye-slash"}></i>{p.active?"노출중":"숨김"}
                        </button>
                      </td>
                      <td style={{textAlign:"right"}}>
                        <button className="icon-btn" onClick={()=>openAdminEdit(p)}><i className="ph ph-pencil-simple"></i></button>
                        <button className="icon-btn" onClick={()=>setDeleteTarget(p)}><i className="ph ph-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </main>
      )}

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col">
            <h4>온담 ONDAM</h4>
            <p className="footer-note">© 2026 온담 — 자체 개발 프로젝트<br/>본 사이트는 데모 목적의 샘플 브랜드입니다.</p>
          </div>
          <div className="footer-col">
            <h4>쇼핑 안내</h4>
            <a href="#">배송 정책</a><a href="#">교환·반품</a><a href="#">자주 묻는 질문</a>
          </div>
          <div className="footer-col">
            <h4>고객센터</h4>
            <a href="#">1:1 문의</a><a href="#">실시간 상담</a><a href="#">공지사항</a>
          </div>
          <div className="footer-col">
            <h4>회사 정보</h4>
            <a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">사업자 정보</a>
          </div>
        </div>
      </footer>

      <button className="chat-fab" onClick={()=>setChatOpen(o=>!o)}>
        <i className={chatOpen ? "ph ph-x" : "ph ph-chat-circle-dots"} style={{fontSize:24}}></i>
      </button>
      {chatOpen && (
        <div className="chat-panel">
          <div className="chat-head">
            <strong>온담 실시간 상담</strong>
            <button className="chat-close" onClick={()=>setChatOpen(false)}><i className="ph ph-x"></i></button>
          </div>
          <div className="chat-body">
            {chatMsgs.map((m,i) => <div key={i} className={"chat-msg "+m.from}>{m.text}</div>)}
          </div>
          <div className="chat-input-row">
            <input placeholder="메시지를 입력하세요" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") sendChat();}}/>
            <button className="chat-send" onClick={sendChat}><i className="ph ph-paper-plane-right"></i></button>
          </div>
        </div>
      )}

      {quickView && (
        <div className="overlay" onClick={()=>setQuickView(null)}>
          <div className="drawer" onClick={e=>e.stopPropagation()}>
            <div className="drawer-head">
              <strong>퀵 보기</strong>
              <button className="drawer-close" onClick={()=>setQuickView(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="drawer-body">
              <div className="qv-image"><ProductVisual hue={quickView.hue} size={160}/></div>
              <div className="qv-title">{quickView.name}</div>
              <div className="qv-price">{formatWon(quickView.price)}</div>
              <p className="qv-desc">{quickView.cat} 카테고리 인기 상품입니다. 리뷰 {quickView.reviews}건 · 평점 {quickView.rating}점을 기록하고 있습니다.</p>
              <div className="qv-actions">
                <button className="btn-primary" onClick={()=>{ addToCart(quickView.id); }}><i className="ph ph-shopping-cart"></i> 담기</button>
                <button className="btn-ghost" onClick={()=>goProductDetail(quickView)}>상세보기</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {adminModal && (
        <div className="overlay center" onClick={()=>setAdminModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <strong>{adminModal.mode==="new" ? "신규 상품 등록" : "상품 정보 수정"}</strong>
              <button className="drawer-close" onClick={()=>setAdminModal(null)}><i className="ph ph-x"></i></button>
            </div>
            <div className="modal-body">
              <div className="field">
                <label>상품명</label>
                <input value={adminModal.data.name} onChange={e=>setAdminModal(m=>({...m,data:{...m.data,name:e.target.value}}))}/>
                {formErr.name && <div className="field-err">{formErr.name}</div>}
              </div>
              <div className="field">
                <label>카테고리</label>
                <select value={adminModal.data.cat} onChange={e=>setAdminModal(m=>({...m,data:{...m.data,cat:e.target.value}}))}>
                  {CATEGORIES.filter(c=>c!=="전체").map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="field">
                <label>가격 (원)</label>
                <input type="number" value={adminModal.data.price} onChange={e=>setAdminModal(m=>({...m,data:{...m.data,price:e.target.value}}))}/>
                {formErr.price && <div className="field-err">{formErr.price}</div>}
              </div>
              <div className="field">
                <label>상품 이미지</label>
                <div className={"upload-zone"+(uploading?" drag":"")} onClick={simulateUpload}>
                  <i className="ph ph-upload-simple" style={{fontSize:20,marginBottom:6}}></i>
                  <div>클릭하여 이미지를 업로드하세요</div>
                </div>
                {(uploading || uploadPct>0) && (
                  <div className="upload-progress-track"><div className="upload-progress-fill" style={{width:uploadPct+"%"}}></div></div>
                )}
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn-ghost" onClick={()=>setAdminModal(null)}>취소</button>
              <button className="btn-primary" onClick={saveAdminProduct}>저장</button>
            </div>
          </div>
        </div>
      )}

      {deleteTarget && (
        <div className="overlay center" onClick={()=>setDeleteTarget(null)}>
          <div className="modal-box" style={{width:360}} onClick={e=>e.stopPropagation()}>
            <div className="modal-body" style={{textAlign:"center",paddingTop:28}}>
              <i className="ph ph-warning-circle" style={{fontSize:36,color:"var(--s2)"}}></i>
              <p style={{margin:"14px 0 4px",fontSize:14.5,color:"var(--n9)",fontWeight:600}}>정말 삭제하시겠습니까?</p>
              <p style={{fontSize:12.5,color:"var(--n5)"}}>{deleteTarget.name} 상품이 목록에서 삭제됩니다.</p>
            </div>
            <div className="modal-foot">
              <button className="btn-ghost" onClick={()=>setDeleteTarget(null)}>취소</button>
              <button className="btn-primary" style={{background:"var(--s2)",borderColor:"var(--s2)"}} onClick={confirmDelete}>삭제</button>
            </div>
          </div>
        </div>
      )}

      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
