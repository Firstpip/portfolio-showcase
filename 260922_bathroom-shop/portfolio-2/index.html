<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온담 멀티 카탈로그 통합 운영 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (hue 176°, light) ── */
:root{
  --m50:#eef6f5; --m100:#eef6f5; --m200:#ddedec; --m300:#bcdad8; --m400:#93c4c0;
  --m500:#65aba6; --m600:#39948d; --m700:#0e7c74; --m800:#0b665f; --m900:#094f4a;
  --n0:#ffffff; --n1:#9a9a9a; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d7d7;
  --n5:#b5baba; --n6:#909898; --n7:#6d6d6d; --n8:#535a5a; --n9:#363a3a; --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--n2); color:var(--n9);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:2px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes rowIn{from{opacity:0;}to{opacity:1;}}
@keyframes toastSlide{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}

.app{display:flex;width:100%;min-height:100vh;}

/* ── sidebar ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--n0);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:40;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid var(--n3);}
.sb-brand-mark{width:28px;height:28px;background:var(--n10);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.sb-brand-text{font-size:13.5px;font-weight:600;letter-spacing:.02em;}
.sb-brand-sub{font-size:9.5px;color:var(--n6);letter-spacing:.1em;text-transform:uppercase;}
.sb-section{padding:20px 14px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--n6);text-transform:uppercase;}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 16px;margin:0 8px;font-size:13px;font-weight:500;color:var(--n7);transition:background .15s,color .15s;}
.sb-link:hover{background:var(--n2);}
.sb-link.active{background:var(--n9);color:var(--n0);}
.sb-link .badge-count{margin-left:auto;font-size:10.5px;background:var(--n3);color:var(--n8);padding:1px 7px;}
.sb-link.active .badge-count{background:var(--m400);color:var(--n10);}
.sb-foot{margin-top:auto;padding:16px;border-top:1px solid var(--n3);display:flex;align-items:center;gap:10px;}
.sb-foot .avatar{width:30px;height:30px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.sb-foot-name{font-size:12.5px;font-weight:600;}
.sb-foot-role{font-size:10.5px;color:var(--n6);}

.main-wrap{margin-left:248px;flex:1;min-width:0;width:calc(100% - 248px);display:flex;flex-direction:column;}
.topbar{height:64px;background:var(--n0);border-bottom:1px solid var(--n3);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-sub{font-size:11.5px;color:var(--n6);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.tb-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--n7);border:1px solid transparent;}
.tb-btn:hover{background:var(--n2);}
.tb-search{display:flex;align-items:center;gap:8px;border:1px solid var(--n3);padding:8px 12px;font-size:12.5px;color:var(--n6);width:220px;}
.tb-search input{border:none;outline:none;background:transparent;flex:1;font-size:12.5px;color:var(--n9);}

.content{padding:26px 28px 60px;}
.page-mast{position:relative;padding:52px 44px;margin-bottom:24px;overflow:hidden;background:linear-gradient(125deg,var(--m900) 0%,var(--m700) 55%,var(--m600) 100%);}
.page-mast-blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;pointer-events:none;}
.page-mast-blob.b1{width:260px;height:260px;background:var(--m400);top:-90px;right:8%;}
.page-mast-blob.b2{width:180px;height:180px;background:var(--m200);bottom:-70px;right:26%;opacity:.35;}
.page-mast-label{position:relative;z-index:1;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--m100);text-transform:uppercase;margin-bottom:10px;}
.page-mast-title{position:relative;z-index:1;font-size:54px;font-weight:300;letter-spacing:-.02em;line-height:1;color:var(--n0);}
.page-mast-sub{position:relative;z-index:1;font-size:13px;color:var(--m100);margin-top:14px;max-width:460px;line-height:1.6;}

/* ── master-detail ── */
.md-wrap{display:grid;grid-template-columns:360px 1fr;gap:0;background:var(--n0);border:1px solid var(--n3);min-height:640px;}
.list-rail{border-right:1px solid var(--n3);display:flex;flex-direction:column;}
.list-rail-head{padding:16px 18px;border-bottom:1px solid var(--n3);}
.list-search{display:flex;align-items:center;gap:8px;border:1px solid var(--n3);padding:8px 12px;margin-bottom:10px;}
.list-search input{border:none;outline:none;background:transparent;flex:1;font-size:12.5px;}
.list-filter-row{display:flex;gap:6px;flex-wrap:wrap;}
.list-filter-row button{font-size:11px;font-weight:600;padding:5px 10px;border:1px solid var(--n3);color:var(--n7);}
.list-filter-row button.active{background:var(--n9);color:var(--n0);border-color:var(--n9);}
.order-list{flex:1;overflow-y:auto;}
.order-row{padding:14px 18px;border-bottom:1px solid var(--n3);cursor:pointer;animation:rowIn .3s ease;transition:background .12s;}
.order-row:hover{background:var(--n2);}
.order-row.selected{background:var(--m50);border-left:3px solid var(--m700);padding-left:15px;}
.order-row-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.order-id{font-size:12px;font-weight:700;color:var(--n8);}
.order-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.order-meta{font-size:11.5px;color:var(--n6);}
.status-dot-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;}
.status-dot-badge .dot{width:6px;height:6px;border-radius:50%;}
.st-pending{background:var(--n2);color:var(--n7);}
.st-pending .dot{background:var(--n6);}
.st-paid{background:var(--s1-bg);color:var(--s1-text);}
.st-paid .dot{background:var(--s1);}
.st-shipping{background:var(--m100);color:var(--m800);}
.st-shipping .dot{background:var(--m700);}
.st-done{background:var(--n2);color:var(--n8);}
.st-done .dot{background:var(--n8);}
.st-cancel{background:var(--s2-bg);color:var(--s2-text);}
.st-cancel .dot{background:var(--s2);}

.detail-panel{padding:26px 30px;overflow-y:auto;}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--n5);gap:10px;padding:80px 0;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--n3);}
.detail-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.detail-sub{font-size:12px;color:var(--n6);}
.detail-actions{display:flex;gap:8px;}
.btn-line{border:1px solid var(--n8);color:var(--n9);padding:9px 16px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s;}
.btn-line:hover{background:var(--n9);color:var(--n0);}
.btn-pill{background:var(--n9);color:var(--n0);padding:9px 20px;border-radius:9999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s;}
.btn-pill:hover{opacity:.82;}
.btn-pill.danger{background:var(--s2);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:24px;}
.dgroup h4{font-size:11px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.dgroup-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--n2);}
.dgroup-row span:first-child{color:var(--n6);}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:6px;}
.tl-item{display:flex;gap:12px;padding-bottom:20px;position:relative;}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--n3);}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--n9);flex-shrink:0;margin-top:2px;}
.tl-dot.pending{background:var(--n4);}
.tl-text strong{font-size:12.5px;display:block;}
.tl-text span{font-size:11px;color:var(--n6);}
.items-table{width:100%;border-collapse:collapse;margin-top:6px;}
.items-table th{text-align:left;font-size:10.5px;color:var(--n6);text-transform:uppercase;padding:8px 0;border-bottom:1px solid var(--n3);}
.items-table td{font-size:12.5px;padding:10px 0;border-bottom:1px solid var(--n2);}

/* ── kpi-free header strip for catalog/analytics ── */
.strip{display:flex;gap:0;border:1px solid var(--n3);background:var(--n0);margin-bottom:20px;}
.strip-cell{flex:1;padding:16px 20px;border-right:1px solid var(--n3);}
.strip-cell:last-child{border-right:none;}
.strip-label{font-size:10.5px;color:var(--n6);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.strip-value{font-size:20px;font-weight:700;}
.strip-value.warn{color:var(--s3-text);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.tb-left{display:flex;gap:8px;}
.tb-tab{font-size:12.5px;font-weight:600;padding:8px 14px;border:1px solid var(--n3);color:var(--n7);}
.tb-tab.active{background:var(--n9);color:var(--n0);border-color:var(--n9);}

.catalog-table-wrap{background:var(--n0);border:1px solid var(--n3);}
table.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;padding:12px 18px;border-bottom:1px solid var(--n3);}
.data-table td{padding:12px 18px;font-size:12.5px;border-bottom:1px solid var(--n2);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--n2);}
.sku-tag{font-size:10.5px;background:var(--n2);color:var(--n7);padding:2px 7px;margin-right:4px;}
.stock-bar-track{width:80px;height:5px;background:var(--n3);display:inline-block;vertical-align:middle;margin-right:6px;}
.stock-bar-fill{height:100%;background:var(--n8);}
.stock-bar-fill.low{background:var(--s3);}
.chip-icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--n6);}
.chip-icon-btn:hover{background:var(--n2);color:var(--n9);}

.chart-card{background:var(--n0);border:1px solid var(--n3);padding:22px;margin-bottom:20px;}
.chart-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.chart-card-head h3{font-size:13.5px;font-weight:700;}
.period-toggle{display:flex;gap:4px;}
.period-toggle button{font-size:11px;font-weight:600;padding:5px 10px;border:1px solid var(--n3);color:var(--n7);}
.period-toggle button.active{background:var(--n9);color:var(--n0);border-color:var(--n9);}
.chart-box{height:260px;position:relative;}
.chart-row{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

.settle-table td .mismatch{color:var(--s2-text);font-weight:700;}
.reconcile-badge{font-size:10.5px;font-weight:700;padding:3px 8px;}
.reconcile-badge.ok{background:var(--s1-bg);color:var(--s1-text);}
.reconcile-badge.warn{background:var(--s3-bg);color:var(--s3-text);}
.retry-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--n6);}
.retry-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--s3);animation:pulseDot 1.4s infinite;}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:flex;align-items:center;justify-content:center;}
.modal-box{background:var(--n0);width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;border:1px solid var(--n3);animation:fadeUp .2s ease;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:center;}
.modal-head strong{font-size:14.5px;}
.modal-body{padding:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--n7);text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--n3);padding:10px 12px;font-size:13px;color:var(--n9);background:var(--n0);}
.field textarea{min-height:70px;resize:vertical;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--n3);display:flex;justify-content:flex-end;gap:10px;}

.toast-stack{position:fixed;right:26px;bottom:26px;z-index:100;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--n9);color:var(--n0);padding:12px 18px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;animation:toastSlide .25s ease;box-shadow:0 12px 26px rgba(0,0,0,.16);}
.toast.err{background:var(--s2);}

@media(max-width:1040px){
  .md-wrap{grid-template-columns:1fr;}
  .list-rail{border-right:none;border-bottom:1px solid var(--n3);}
  .detail-grid,.chart-row{grid-template-columns:1fr;}
}
</style>
</head>

const SALES_BY_CAT = [
  {cat:"샤워헤드",sales:38},{cat:"수전",sales:24},{cat:"디퓨저",sales:14},
  {cat:"선반",sales:10},{cat:"조명",sales:9},{cat:"액세서리",sales:5},
];

const SETTLEMENTS = [
  {id:"STL-3301",order:"ORD-58210",pg:189000,order_amt:189000,carrier:"CJ대한통운",invoice:"6821-4471-902",status:"ok"},
  {id:"STL-3300",order:"ORD-58209",pg:268000,order_amt:268000,carrier:"한진택배",invoice:"5512-2201-773",status:"ok"},
  {id:"STL-3299",order:"ORD-58208",pg:158000,order_amt:168000,carrier:"우체국택배",invoice:"—",status:"warn"},
  {id:"STL-3298",order:"ORD-58203",pg:263000,order_amt:263000,carrier:"롯데택배",invoice:"3391-8820-115",status:"ok"},
  {id:"STL-3297",order:"ORD-58201",pg:268000,order_amt:268000,carrier:"CJ대한통운",invoice:"6821-4402-330",status:"ok"},
];

function formatWon(n){ return n.toLocaleString('ko-KR') + "원"; }

function Toast({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t => <div key={t.id} className={"toast"+(t.type==="err"?" err":"")}><i data-lucide={t.type==="err"?"x-circle":"check-circle"} style={{width:16,height:16}}></i>{t.msg}</div>)}
    </div>
  );
}

function useLucide(dep){
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
}

function App(){
  const [screen,setScreen] = useState("main");
  const [toasts,setToasts] = useState([]);
  function pushToast(msg,type="ok"){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  }

  // master-detail order state
  const [orders,setOrders] = useState(ORDERS);
  const [selectedId,setSelectedId] = useState(ORDERS[0].id);
  const [orderFilter,setOrderFilter] = useState("all");
  const [orderQuery,setOrderQuery] = useState("");
  const selected = orders.find(o=>o.id===selectedId);

  // catalog state
  const [catalog,setCatalog] = useState(CATALOG);
  const [catModal,setCatModal] = useState(null);
  const [csvBusy,setCsvBusy] = useState(false);
  const fileInputRef = useRef(null);

  // analytics
  const [period,setPeriod] = useState("일");

  // settlement
  const [retryTarget,setRetryTarget] = useState(null);

  useLucide([screen, orders, catalog, selectedId]);

  function goScreen(s){ setScreen(s); window.scrollTo({top:0,behavior:"smooth"}); }

  const filteredOrders = useMemo(()=>{
    return orders.filter(o => {
      if(orderFilter!=="all" && o.status!==orderFilter) return false;
      if(orderQuery && !(o.name.includes(orderQuery) || o.id.includes(orderQuery.toUpperCase()))) return false;
      return true;
    });
  }, [orders, orderFilter, orderQuery]);

  function advanceStatus(id){
    const flow = ["pending","paid","shipping","done"];
    setOrders(list => list.map(o => {
      if(o.id!==id) return o;
      const idx = flow.indexOf(o.status);
      if(idx<0 || idx>=flow.length-1) return o;
      return {...o, status:flow[idx+1]};
    }));
    pushToast("주문 상태가 변경되었습니다");
  }
  function cancelOrder(id){
    setOrders(list => list.map(o => o.id===id ? {...o,status:"cancel"} : o));
    pushToast("주문이 취소 처리되었습니다", "err");
  }

  function openCatModal(mode, item){
    setCatModal({mode, data: item ? {...item} : {name:"",cat:"샤워헤드",price:"",stock:""}});
  }
  function saveCatItem(){
    const d = catModal.data;
    if(!d.name || !d.price) { pushToast("필수 항목을 입력해주세요","err"); return; }
    if(catModal.mode==="new"){
      const id = Math.max(...catalog.map(c=>c.id))+1;
      setCatalog(list => [...list, {...d, id, price:Number(d.price), stock:Number(d.stock||0), stockPct:60, options:["기본"]}]);
      pushToast("상품이 카탈로그에 등록되었습니다");
    } else {
      setCatalog(list => list.map(c => c.id===d.id ? {...c, ...d, price:Number(d.price), stock:Number(d.stock)} : c));
      pushToast("상품 정보가 수정되었습니다");
    }
    setCatModal(null);
  }
  function simulateCsvUpload(){
    setCsvBusy(true);
    setTimeout(()=>{ setCsvBusy(false); pushToast("CSV 일괄 업로드가 완료되었습니다 (24건 등록, 2건 형식 오류)"); }, 1400);
  }

  function retrySettlement(){
    pushToast("택배사 송장 재조회 요청을 큐에 등록했습니다");
    setRetryTarget(null);
  }

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sb-brand">
          <div className="sb-brand-mark">O</div>
          <div>
            <div className="sb-brand-text">온담 운영</div>
            <div className="sb-brand-sub">Ops Platform</div>
          </div>
        </div>
        <div className="sb-section">운영</div>
        <a className={"sb-link"+(screen==="main"?" active":"")} onClick={()=>goScreen("main")}>
          <i data-lucide="clipboard-list" style={{width:16,height:16}}></i> 주문 관리
          <span className="badge-count">{orders.filter(o=>o.status==="pending"||o.status==="paid").length}</span>
        </a>
        <a className={"sb-link"+(screen==="catalog"?" active":"")} onClick={()=>goScreen("catalog")}>
          <i data-lucide="layout-grid" style={{width:16,height:16}}></i> 다품목 카탈로그
        </a>
        <div className="sb-section">분석 · 정산</div>
        <a className={"sb-link"+(screen==="analytics"?" active":"")} onClick={()=>goScreen("analytics")}>
          <i data-lucide="bar-chart-3" style={{width:16,height:16}}></i> 매출·재고 분석
        </a>
        <a className={"sb-link"+(screen==="settlement"?" active":"")} onClick={()=>goScreen("settlement")}>
          <i data-lucide="banknote" style={{width:16,height:16}}></i> 정산·배송 연동
          <span className="badge-count">1</span>
        </a>
        <div className="sb-foot">
          <span className="avatar">관</span>
          <div>
            <div className="sb-foot-name">운영 관리자</div>
            <div className="sb-foot-role">온담 자사몰</div>
          </div>
        </div>
      </aside>

      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="topbar-title">
              {screen==="main" && "주문 관리"}
              {screen==="catalog" && "다품목 카탈로그"}
              {screen==="analytics" && "매출·재고 분석"}
              {screen==="settlement" && "정산·배송 연동"}
            </div>
            <div className="topbar-sub">
              {screen==="main" && "좌측 리스트에서 주문을 선택하면 우측에 상세가 표시됩니다"}
              {screen==="catalog" && "카테고리·옵션·재고를 다품목 구조로 관리합니다"}
              {screen==="analytics" && "일별·카테고리별 매출과 재고 회전을 확인합니다"}
              {screen==="settlement" && "PG 정산과 택배사 송장 상태를 통합 확인합니다"}
            </div>
          </div>
          <div className="topbar-actions">
            <div className="tb-search"><i data-lucide="search" style={{width:14,height:14}}></i><input placeholder="전체 검색"/></div>
            <button className="tb-btn" onClick={()=>pushToast("알림이 없습니다")}><i data-lucide="bell" style={{width:17,height:17}}></i></button>
            <button className="tb-btn" onClick={()=>pushToast("설정 화면은 다음 단계에서 제공됩니다")}><i data-lucide="settings" style={{width:17,height:17}}></i></button>
          </div>
        </div>

        <div className="content">
          <div className="page-mast">
            <div className="page-mast-blob b1"></div>
            <div className="page-mast-blob b2"></div>
            <div className="page-mast-label">Ondam Ops · {screen==="main"?"Orders":screen==="catalog"?"Catalog":screen==="analytics"?"Insights":"Settlement"}</div>
            <div className="page-mast-title">
              {screen==="main" && "주문 관리"}
              {screen==="catalog" && "카탈로그"}
              {screen==="analytics" && "매출 분석"}
              {screen==="settlement" && "정산 연동"}
            </div>
            <div className="page-mast-sub">
              {screen==="main" && "결제·배송 상태를 한 화면에서 확인하고 다음 단계로 처리합니다."}
              {screen==="catalog" && "단품에서 다품목으로 — 카테고리·옵션·재고를 하나의 구조로 관리합니다."}
              {screen==="analytics" && "일별 매출 추이와 카테고리 비중, 재고 회전을 함께 살펴봅니다."}
              {screen==="settlement" && "PG 정산과 택배사 송장을 자동으로 매칭하고 불일치를 표시합니다."}
            </div>
          </div>
          {screen==="main" && (
            <div className="md-wrap">
              <div className="list-rail">
                <div className="list-rail-head">
                  <div className="list-search">
                    <i data-lucide="search" style={{width:14,height:14}}></i>
                    <input placeholder="주문번호 또는 이름 검색" value={orderQuery} onChange={e=>setOrderQuery(e.target.value)}/>
                  </div>
                  <div className="list-filter-row">
                    {["all","pending","paid","shipping","done","cancel"].map(s => (
                      <button key={s} className={orderFilter===s?"active":""} onClick={()=>setOrderFilter(s)}>{s==="all"?"전체":STATUS_LABEL[s]}</button>
                    ))}
                  </div>
                </div>
                <div className="order-list">
                  {filteredOrders.map(o => (
                    <div key={o.id} className={"order-row"+(selectedId===o.id?" selected":"")} onClick={()=>setSelectedId(o.id)}>
                      <div className="order-row-top">
                        <span className="order-id">{o.id}</span>
                        <span className={"status-dot-badge st-"+o.status}><span className="dot"></span>{STATUS_LABEL[o.status]}</span>
                      </div>
                      <div className="order-name">{o.name} · {formatWon(o.amount)}</div>
                      <div className="order-meta">{o.date} · 상품 {o.items.length}종</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="detail-panel">
                {!selected && <div className="detail-empty"><i data-lucide="inbox" style={{width:36,height:36}}></i>좌측에서 주문을 선택해주세요</div>}
                {selected && (
                  <div>
                    <div className="detail-head">
                      <div>
                        <div className="detail-title">{selected.id}</div>
                        <div className="detail-sub">{selected.name} · {selected.date} 접수</div>
                      </div>
                      <div className="detail-actions">
                        <button className="btn-line" onClick={()=>pushToast("배송 메모를 저장했습니다")}><i data-lucide="sticky-note" style={{width:14,height:14}}></i> 메모</button>
                        {selected.status!=="done" && selected.status!=="cancel" && (
                          <button className="btn-pill" onClick={()=>advanceStatus(selected.id)}><i data-lucide="arrow-right-circle" style={{width:14,height:14}}></i> 다음 단계로</button>
                        )}
                        {selected.status!=="cancel" && selected.status!=="done" && (
                          <button className="btn-pill danger" onClick={()=>cancelOrder(selected.id)}><i data-lucide="ban" style={{width:14,height:14}}></i> 주문 취소</button>
                        )}
                      </div>
                    </div>
                    <div className="detail-grid">
                      <div className="dgroup">
                        <h4>주문 정보</h4>
                        <div className="dgroup-row"><span>결제 금액</span><span>{formatWon(selected.amount)}</span></div>
                        <div className="dgroup-row"><span>결제 수단</span><span>포트원 · 카드결제</span></div>
                        <div className="dgroup-row"><span>배송지</span><span>{selected.addr}</span></div>
                        <div className="dgroup-row"><span>연락처</span><span>010-****-{String(selected.id).slice(-4)}</span></div>
                      </div>
                      <div className="dgroup">
                        <h4>처리 타임라인</h4>
                        <div className="timeline">
                          <div className="tl-item"><div className="tl-dot"></div><div className="tl-text"><strong>주문 접수</strong><span>{selected.date}</span></div></div>
                          <div className="tl-item"><div className={"tl-dot"+((selected.status==="pending")?" pending":"")}></div><div className="tl-text"><strong>결제 완료</strong><span>{selected.status==="pending" ? "대기 중" : "확인됨"}</span></div></div>
                          <div className="tl-item"><div className={"tl-dot"+((selected.status==="pending"||selected.status==="paid")?" pending":"")}></div><div className="tl-text"><strong>배송 시작</strong><span>{selected.status==="shipping"||selected.status==="done" ? "송장 등록 완료" : "대기 중"}</span></div></div>
                          <div className="tl-item"><div className={"tl-dot"+(selected.status!=="done"?" pending":"")}></div><div className="tl-text"><strong>배송 완료</strong><span>{selected.status==="done" ? "수령 확인" : "대기 중"}</span></div></div>
                        </div>
                      </div>
                    </div>
                    <h4 style={{fontSize:11,fontWeight:700,color:"var(--n6)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>주문 품목</h4>
                    <table className="items-table">
                      <thead><tr><th>상품명</th><th>수량</th><th style={{textAlign:"right"}}>금액</th></tr></thead>
                      <tbody>
                        {selected.items.map((it,i)=>(
                          <tr key={i}><td>{it.name}</td><td>{it.qty}개</td><td style={{textAlign:"right"}}>{formatWon(it.price*it.qty)}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {screen==="catalog" && (
            <div>
              <div className="strip">
                <div className="strip-cell"><div className="strip-label">전체 SKU</div><div className="strip-value">{catalog.length}종</div></div>
                <div className="strip-cell"><div className="strip-label">재고 경고</div><div className="strip-value warn">{catalog.filter(c=>c.stockPct<20).length}종</div></div>
                <div className="strip-cell"><div className="strip-label">카테고리</div><div className="strip-value">6개</div></div>
              </div>
              <div className="toolbar">
                <div className="tb-left">
                  <button className="tb-tab active" onClick={()=>pushToast("전체 상품 목록을 표시합니다")}>전체 상품</button>
                  <button className="tb-tab" onClick={()=>pushToast("옵션 조합 관리 화면으로 이동합니다")}>옵션·SKU</button>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <input type="file" ref={fileInputRef} style={{display:"none"}} onChange={simulateCsvUpload}/>
                  <button className="btn-line" onClick={()=>fileInputRef.current && fileInputRef.current.click()} disabled={csvBusy}>
                    <i data-lucide="upload" style={{width:14,height:14}}></i> {csvBusy ? "업로드 중..." : "CSV 일괄 업로드"}
                  </button>
                  <button className="btn-pill" onClick={()=>openCatModal("new")}><i data-lucide="plus" style={{width:14,height:14}}></i> 신규 상품</button>
                </div>
              </div>
              <div className="catalog-table-wrap">
                <table className="data-table">
                  <thead><tr><th>상품</th><th>옵션(SKU)</th><th>재고</th><th>가격</th><th style={{textAlign:"right"}}>관리</th></tr></thead>
                  <tbody>
                    {catalog.map(c => (
                      <tr key={c.id}>
                        <td><strong>{c.name}</strong><div style={{fontSize:11,color:"var(--n6)"}}>{c.cat}</div></td>
                        <td>{c.options.map(o => <span key={o} className="sku-tag">{o}</span>)}</td>
                        <td>
                          <span className={"stock-bar-track"}><span className={"stock-bar-fill"+(c.stockPct<20?" low":"")} style={{width:c.stockPct+"%"}}></span></span>
                          {c.stock}개 {c.stockPct<20 && <span style={{color:"var(--s3-text)",fontWeight:700,fontSize:11}}> · 재입고 필요</span>}
                        </td>
                        <td>{formatWon(c.price)}</td>
                        <td style={{textAlign:"right"}}>
                          <button className="chip-icon-btn" onClick={()=>openCatModal("edit",c)}><i data-lucide="pencil" style={{width:15,height:15}}></i></button>
                          <button className="chip-icon-btn" onClick={()=>{setCatalog(l=>l.filter(x=>x.id!==c.id)); pushToast("상품이 삭제되었습니다","err");}}><i data-lucide="trash-2" style={{width:15,height:15}}></i></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {screen==="analytics" && (
            <div>
              <div className="chart-row">
                <div className="chart-card">
                  <div className="chart-card-head">
                    <h3>일별 매출 추이</h3>
                    <div className="period-toggle">
                      {["일","주","월"].map(p => <button key={p} className={period===p?"active":""} onClick={()=>setPeriod(p)}>{p}</button>)}
                    </div>
                  </div>
                  <div className="chart-box">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={SALES_DAILY}>
                        <CartesianGrid stroke="#e5e6e6" vertical={false}/>
                        <XAxis dataKey="d" tick={{fontSize:11,fill:"#909898"}} axisLine={false} tickLine={false}/>
                        <YAxis tick={{fontSize:11,fill:"#909898"}} axisLine={false} tickLine={false} tickFormatter={v=>(v/10000)+"만"}/>
                        <Tooltip formatter={v=>formatWon(v)}/>
                        <Line type="monotone" dataKey="sales" stroke="#0e7c74" strokeWidth={2.4} dot={{r:3,fill:"#0e7c74"}}/>
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
                <div className="chart-card">
                  <div className="chart-card-head"><h3>카테고리별 매출 비중</h3></div>
                  <div className="chart-box">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={SALES_BY_CAT} layout="vertical" margin={{left:10}}>
                        <CartesianGrid stroke="#e5e6e6" horizontal={false}/>
                        <XAxis type="number" tick={{fontSize:11,fill:"#909898"}} axisLine={false} tickLine={false}/>
                        <YAxis type="category" dataKey="cat" tick={{fontSize:11.5,fill:"#363a3a"}} axisLine={false} tickLine={false} width={64}/>
                        <Tooltip formatter={v=>v+"%"}/>
                        <Bar dataKey="sales" fill="#39948d" radius={[0,2,2,0]} onClick={(d)=>pushToast(d.cat+" 카테고리 상세로 이동합니다")} cursor="pointer" barSize={16}/>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
              <div className="chart-card">
                <div className="chart-card-head"><h3>재고 회전 — 회전율 낮은 순</h3></div>
                <table className="data-table">
                  <thead><tr><th>상품</th><th>현재 재고</th><th>최근 7일 판매</th><th>회전 상태</th></tr></thead>
                  <tbody>
                    {catalog.slice().sort((a,b)=>a.stockPct-b.stockPct).map(c => (
                      <tr key={c.id} style={{cursor:"pointer"}} onClick={()=>{goScreen("catalog");}}>
                        <td>{c.name}</td>
                        <td>{c.stock}개</td>
                        <td>{Math.round(c.stock*0.18)}개</td>
                        <td>{c.stockPct<20 ? <span className="reconcile-badge warn">회전 느림</span> : <span className="reconcile-badge ok">정상</span>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {screen==="settlement" && (
            <div>
              <div className="strip">
                <div className="strip-cell"><div className="strip-label">정산 완료</div><div className="strip-value">{SETTLEMENTS.filter(s=>s.status==="ok").length}건</div></div>
                <div className="strip-cell"><div className="strip-label">불일치</div><div className="strip-value warn">{SETTLEMENTS.filter(s=>s.status==="warn").length}건</div></div>
                <div className="strip-cell"><div className="strip-label">재처리 대기</div><div className="strip-value">1건</div></div>
              </div>
              <div className="catalog-table-wrap">
                <table className="data-table settle-table">
                  <thead><tr><th>정산번호</th><th>주문</th><th>PG 금액</th><th>주문 금액</th><th>택배사</th><th>송장번호</th><th>상태</th></tr></thead>
                  <tbody>
                    {SETTLEMENTS.map(s => (
                      <tr key={s.id}>
                        <td>{s.id}</td>
                        <td>{s.order}</td>
                        <td className={s.status==="warn"?"mismatch":""}>{formatWon(s.pg)}</td>
                        <td>{formatWon(s.order_amt)}</td>
                        <td>{s.carrier}</td>
                        <td>
                          {s.invoice==="—" ? (
                            <span className="retry-badge"><span className="dot"></span> 재시도 대기</span>
                          ) : s.invoice}
                        </td>
                        <td>
                          {s.status==="ok" ? <span className="reconcile-badge ok">일치</span> : (
                            <button className="reconcile-badge warn" onClick={()=>setRetryTarget(s)}>불일치 · 재조회</button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      </div>

      {catModal && (
        <div className="overlay" onClick={()=>setCatModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><strong>{catModal.mode==="new" ? "신규 상품 등록" : "상품 정보 수정"}</strong><button onClick={()=>setCatModal(null)}><i data-lucide="x" style={{width:18,height:18}}></i></button></div>
            <div className="modal-body">
              <div className="field"><label>상품명</label><input value={catModal.data.name} onChange={e=>setCatModal(m=>({...m,data:{...m.data,name:e.target.value}}))}/></div>
              <div className="field"><label>카테고리</label>
                <select value={catModal.data.cat} onChange={e=>setCatModal(m=>({...m,data:{...m.data,cat:e.target.value}}))}>
                  {["샤워헤드","수전","디퓨저","선반","조명","액세서리"].map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="field"><label>가격 (원)</label><input type="number" value={catModal.data.price} onChange={e=>setCatModal(m=>({...m,data:{...m.data,price:e.target.value}}))}/></div>
              <div className="field"><label>재고 수량</label><input type="number" value={catModal.data.stock} onChange={e=>setCatModal(m=>({...m,data:{...m.data,stock:e.target.value}}))}/></div>
            </div>
            <div className="modal-foot">
              <button className="btn-line" onClick={()=>setCatModal(null)}>취소</button>
              <button className="btn-pill" onClick={saveCatItem}>저장</button>
            </div>
          </div>
        </div>
      )}

      {retryTarget && (
        <div className="overlay" onClick={()=>setRetryTarget(null)}>
          <div className="modal-box" style={{width:380}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><strong>정산 불일치 재조회</strong><button onClick={()=>setRetryTarget(null)}><i data-lucide="x" style={{width:18,height:18}}></i></button></div>
            <div className="modal-body">
              <p style={{fontSize:13,lineHeight:1.7,color:"var(--n7)"}}>
                {retryTarget.id} 건은 PG 정산 금액과 주문 금액이 {formatWon(retryTarget.order_amt-retryTarget.pg)} 차이 나며, 택배사 송장 정보도 아직 수신되지 않았습니다. 재조회 큐에 등록하시겠습니까?
              </p>
            </div>
            <div className="modal-foot">
              <button className="btn-line" onClick={()=>setRetryTarget(null)}>취소</button>
              <button className="btn-pill" onClick={retrySettlement}>재조회 등록</button>
            </div>
          </div>
        </div>
      )}

      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
