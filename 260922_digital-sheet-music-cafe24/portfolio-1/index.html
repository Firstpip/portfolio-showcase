<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스코어허브 운영센터 — 카탈로그 자동화 파이프라인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n0);
  color: var(--n10);
  width: 100%;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#root { width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select { font-family: inherit; }
table { border-collapse: collapse; width: 100%; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(31,137,75,.35); } 50% { box-shadow: 0 0 0 5px rgba(31,137,75,0); } }
@keyframes flowMove { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
@keyframes fadeInScale { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes toastSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }

.stagger { animation: fadeInUp .45s ease both; }
.pulse-live { animation: pulseDot 1.8s ease-in-out infinite; }

.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 250px;
  background: var(--n1); border-right: 1px solid var(--n3);
  display: flex; flex-direction: column; padding: 22px 16px; z-index: 20;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.sidebar-brand-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--m600);
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.env-select {
  margin: 0 8px 18px; padding: 8px 10px; border-radius: 999px; background: var(--n2);
  font-size: 12px; color: var(--n8); display: flex; align-items: center; justify-content: space-between; font-weight: 600;
}
.sidebar-section-title {
  font-size: 11px; font-weight: 700; color: var(--n6); text-transform: uppercase;
  letter-spacing: .04em; padding: 14px 12px 8px;
}
.sidebar-link {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  font-size: 14px; font-weight: 500; color: var(--n8); margin-bottom: 2px; transition: background .15s;
}
.sidebar-link:hover { background: var(--n2); }
.sidebar-link.active { background: var(--m50); color: var(--m700); font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 14px 12px; border-top: 1px solid var(--n3); font-size: 12px; color: var(--n6); }

.main-wrap {
  margin-left: 250px; flex: 1; min-width: 0; width: calc(100% - 250px);
  min-height: 100vh; padding: 32px 40px 60px;
}
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.page-meta { font-size: 13px; color: var(--n7); margin-top: 4px; }
.page-actions { display: flex; gap: 10px; }

.btn-primary {
  background: var(--m600); color: #fff; font-size: 14px; font-weight: 600;
  padding: 11px 20px; border-radius: 16px; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,.16); transition: background .15s;
}
.btn-primary:hover { background: var(--m700); }
.btn-secondary {
  background: var(--n1); color: var(--n9); font-size: 14px; font-weight: 600;
  padding: 10px 18px; border-radius: 16px; border: 1px solid var(--n4); display: inline-flex; align-items: center; gap: 6px;
}
.btn-secondary:hover { background: var(--n2); }
.btn-ghost { color: var(--n8); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 6px 4px; }
.btn-ghost:hover { color: var(--n10); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--n7); background: var(--n1); border: 1px solid var(--n3);
}
.icon-btn:hover { background: var(--n2); }

.status-strip {
  display: flex; gap: 10px; margin: 22px 0; flex-wrap: wrap;
}
.status-pill {
  display: flex; align-items: center; gap: 8px; background: var(--n1); border: 1px solid var(--n3);
  border-radius: 999px; padding: 8px 14px 8px 10px; font-size: 13px; font-weight: 600; color: var(--n9);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.status-dot.ok { background: var(--s1); }
.status-dot.warn { background: var(--n7); }
.status-dot.off { background: var(--n5); }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--n1); border-radius: 20px; padding: 20px 22px; border: 1px solid var(--n3);
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.stat-label { font-size: 12px; color: var(--n7); font-weight: 600; margin-bottom: 10px; }
.stat-value { font-size: 32px; font-weight: 700; letter-spacing: -.02em; color: var(--n10); }
.stat-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.stat-delta { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.stat-delta.up { color: var(--s1); }
.stat-delta.down { color: var(--s2); }

.split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
.card {
  background: var(--n1); border-radius: 20px; border: 1px solid var(--n3); box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--n3); }
.card-title { font-size: 16px; font-weight: 700; }

.tab-bar { display: flex; gap: 4px; padding: 12px 22px 0; }
.tab {
  padding: 10px 4px; margin-right: 18px; font-size: 14px; font-weight: 600; color: var(--n7);
  border-bottom: 2px solid transparent; background: transparent;
}
.tab.active { color: var(--m700); border-bottom-color: var(--m600); }

.pipeline-wrap { padding: 26px 22px 22px; }
.pipeline-track { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.pipeline-node { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 84px; }
.node-icon {
  width: 48px; height: 48px; border-radius: 14px; background: var(--n2); color: var(--n8);
  display: flex; align-items: center; justify-content: center;
}
.node-icon.active { background: var(--m50); color: var(--m700); }
.node-label { font-size: 11px; font-weight: 600; color: var(--n8); text-align: center; }
.node-count { font-size: 11px; color: var(--n6); }

.data-toolbar { display: flex; gap: 8px; padding: 14px 22px 0; align-items: center; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 8px; background: var(--n2); border-radius: 12px;
  padding: 9px 14px; color: var(--n7); font-size: 13px;
}
.search-box input { background: transparent; border: none; outline: none; flex: 1; font-size: 13px; color: var(--n10); }
.filter-chip {
  padding: 8px 14px; border-radius: 999px; background: var(--n2); font-size: 12px; font-weight: 600; color: var(--n8);
}
.filter-chip.active { background: var(--m50); color: var(--m700); }

.data-table-wrap { padding: 16px 22px 22px; overflow-x: auto; }
.data-table th {
  text-align: left; font-size: 11px; color: var(--n6); text-transform: uppercase; letter-spacing: .03em;
  padding: 8px 12px; border-bottom: 1px solid var(--n3);
}
.data-table td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--n3); color: var(--n9); }
.data-table tr.rowbtn { cursor: pointer; transition: background .12s; }
.data-table tr.rowbtn:hover { background: var(--n2); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge.neutral { background: var(--n2); color: var(--n8); }
.badge.wait { background: var(--n2); color: var(--n8); }
.badge.progress { background: var(--m50); color: var(--m700); }
.badge.done { background: var(--s1-bg); color: var(--s1-text); }
.badge.fail { background: var(--s2-bg); color: var(--s2-text); }

.rail-card { padding: 18px; }
.rail-item {
  display: flex; gap: 12px; padding: 12px; border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--n3);
}
.rail-item:hover { background: var(--n2); }
.rail-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--n2); color: var(--n8); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rail-title { font-size: 13px; font-weight: 700; color: var(--n10); }
.rail-sub { font-size: 12px; color: var(--n7); margin-top: 2px; }
.rail-tag { font-size: 11px; font-weight: 700; color: var(--m700); background: var(--m50); padding: 2px 8px; border-radius: 999px; }

.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 18px 18px; }
.matrix-cell { border-radius: 12px; padding: 12px; background: var(--n2); }
.matrix-cell.hot { background: var(--n9); color: #fff; }
.matrix-num { font-size: 20px; font-weight: 700; }
.matrix-lbl { font-size: 11px; color: var(--n7); margin-top: 4px; }
.matrix-cell.hot .matrix-lbl { color: var(--n4); }

.section-title-row { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 14px; }
.section-title { font-size: 18px; font-weight: 700; }

.hero-wash {
  position: relative; overflow: hidden; border-radius: 22px; padding: 26px 28px; margin-bottom: 22px;
  background: linear-gradient(120deg, var(--m50) 0%, var(--n0) 55%, var(--n1) 100%);
  border: 1px solid var(--n3);
}
.hero-wash-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; color: var(--n10); max-width: 60%; }
.hero-wash-sub { font-size: 13px; color: var(--n8); max-width: 58%; }
.hero-blob { position: absolute; border-radius: 50%; filter: blur(2px); }

/* overlay layer */
.overlay {
  position: fixed; inset: 0; background: rgba(29,30,28,.42); z-index: 90;
  display: flex; align-items: center; justify-content: center; animation: fadeInUp .18s ease;
}
.modal {
  background: var(--n1); border-radius: 20px; width: 480px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
  animation: fadeInScale .2s ease; box-shadow: 0 20px 60px rgba(29,30,28,.25);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--n3); }
.modal-body { padding: 22px 24px; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--n3); display: flex; justify-content: flex-end; gap: 10px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--n8); margin-bottom: 6px; display: block; }
.field-input {
  width: 100%; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--n4); font-size: 14px; margin-bottom: 16px; color: var(--n10);
}
.timeline-item { display: flex; gap: 12px; padding-bottom: 18px; position: relative; }
.timeline-item:not(:last-child)::before {
  content: ''; position: absolute; left: 11px; top: 26px; bottom: -4px; width: 2px; background: var(--n3);
}
.timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--n2); color: var(--n8); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; }
.timeline-dot.done { background: var(--s1); color: #fff; }
.timeline-dot.fail { background: var(--s2); color: #fff; }
.timeline-dot.pending { background: var(--m50); color: var(--m700); }

.toast-wrap { position: fixed; bottom: 26px; right: 26px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--n10); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: toastSlide .22s ease;
}

.watermark-preview {
  background: var(--n9); border-radius: 16px; padding: 26px; color: #fff; position: relative; overflow: hidden; text-align: center;
}
.watermark-preview .wm-tag {
  position: absolute; font-size: 11px; color: rgba(255,255,255,.35); font-weight: 700; transform: rotate(-18deg);
}
.skel { background: linear-gradient(90deg, var(--n2) 25%, var(--n3) 37%, var(--n2) 63%); background-size: 400px 100%; animation: shimmer 1.3s infinite linear; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const {
  ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, BarChart, Bar,
} = Recharts;

function Icon({ name, size = 18, style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ nameAttr: 'data-lucide' });
  });
  return <i data-lucide={name} style={{ width: size, height: size, ...style }} ref={ref}></i>;
}

function Sparkline({ data, color }) {
  const w = 72, h = 28;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke="var(--n5)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function StatCard({ label, value, delta, up, spark, i }) {
  return (
    <div className="stat-card stagger" style={{ animationDelay: `${i * 0.05}s` }}>
      <div className="stat-label">{label}</div>
      <div className="stat-foot">
        <div>
          <div className="stat-value">{value}</div>
          <div className={`stat-delta ${up ? 'up' : 'down'}`}>
            <Icon name={up ? 'arrow-up-right' : 'arrow-down-right'} size={13} />
            {delta}
          </div>
        </div>
        <Sparkline data={spark} color={up ? 'var(--s1)' : 'var(--m600)'} />
      </div>
    </div>
  );
}

function Toast({ items }) {
  return (
    <div className="toast-wrap">
      {items.map(t => (
        <div className="toast" key={t.id}><Icon name="check-circle-2" size={16} /> {t.text}</div>
      ))}
    </div>
  );
}

const DESIGN_DNA = { borderRadius: 20, boxShadow: '0 20px 60px rgba(29,30,28,.25)' };

function Modal({ title, onClose, children, footer, width }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ borderRadius: DESIGN_DNA.borderRadius, boxShadow: DESIGN_DNA.boxShadow, ...(width ? { width } : {}) }} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="card-title">{title}</div>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

const PUBLISHERS = [
  { id: 'A', name: '출판사 A', method: 'FTP · CSV 피드', status: 'ok', lastSync: '5분 전', today: 38 },
  { id: 'B', name: '출판사 B', method: 'FTP · XML 피드', status: 'ok', lastSync: '22분 전', today: 41 },
  { id: 'C', name: '출판사 C', method: 'REST · JSON API', status: 'warn', lastSync: '58분 전', today: 12 },
  { id: 'D', name: '출판사 D', method: '자체 보유 파일', status: 'off', lastSync: '수동 등록', today: 0 },
];

const RETRY_SEED = [
  { id: 1, pub: '출판사 C', type: 'API 응답 지연 (timeout 30s)', time: '09:42', retries: 2, status: '대기' },
  { id: 2, pub: '출판사 B', type: 'XML 스키마 필드 불일치', time: '09:15', retries: 1, status: '대기' },
  { id: 3, pub: '출판사 A', type: 'FTP 연결 실패 (인증 만료)', time: '08:58', retries: 3, status: '재시도중' },
  { id: 4, pub: '출판사 D', type: '파일 인코딩 오류', time: '08:30', retries: 1, status: '대기' },
  { id: 5, pub: '출판사 C', type: '페이지네이션 커서 누락', time: '07:55', retries: 2, status: '대기' },
  { id: 6, pub: '출판사 B', type: '중복 SKU 충돌', time: '07:20', retries: 1, status: '해결' },
  { id: 7, pub: '출판사 A', type: '커버이미지 URL 만료', time: '06:48', retries: 1, status: '대기' },
];

const PIPELINE_LOG = [
  { id: 1, pub: '출판사 A', file: 'catalog_0921.csv', items: 214, result: '완료', time: '09:58' },
  { id: 2, pub: '출판사 B', file: 'feed_full_0921.xml', items: 188, result: '완료', time: '05:12' },
  { id: 3, pub: '출판사 C', file: 'increment_p42.json', items: 46, result: '지연', time: '08:44' },
  { id: 4, pub: '출판사 D', file: 'batch_manual_0920.zip', items: 1000, result: '완료', time: '어제' },
  { id: 5, pub: '출판사 A', file: 'catalog_0920.csv', items: 209, result: '완료', time: '어제' },
  { id: 6, pub: '출판사 B', file: 'feed_full_0920.xml', items: 176, result: '부분실패', time: '어제' },
];

function StatusStrip() {
  return (
    <div className="status-strip">
      {PUBLISHERS.map(p => (
        <div className="status-pill" key={p.id}>
          <span className={`status-dot ${p.status === 'ok' ? 'ok pulse-live' : p.status === 'warn' ? 'warn' : 'off'}`}></span>
          {p.name} · {p.method} · {p.lastSync}
        </div>
      ))}
    </div>
  );
}

function MainScreen({ onOpenDetail, pushToast }) {
  const [tab, setTab] = useState('pipeline');
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('전체');
  const [rows, setRows] = useState(RETRY_SEED);

  const stats = [
    { label: '오늘 신규 수집 상품', value: '128건', delta: '+12.4%', up: true, spark: [4,7,5,9,12,10,14] },
    { label: '카페24 자동 등록 완료', value: '1,842건', delta: '+3.1%', up: true, spark: [30,32,29,35,38,36,40] },
    { label: '다운로드 발급 건수', value: '356건', delta: '+8.0%', up: true, spark: [12,14,13,18,20,19,24] },
    { label: '재처리 대기', value: '7건', delta: '-2건', up: false, spark: [12,11,9,10,8,9,7] },
  ];

  const filteredRows = rows.filter(r => (filter === '전체' || r.pub === filter) && (r.type.includes(q) || r.pub.includes(q)));

  function retry(id) {
    setRows(rows.map(r => r.id === id ? { ...r, status: '재시도중' } : r));
    pushToast(`재처리 큐에 다시 등록되었습니다`);

      <Modal title={target.id} onClose={onClose}>
        {[
          { s: '카페24 결제 완료 웹훅 수신', k: 'done' },
          { s: `출판사 API 주문 제출 (${target.pub})`, k: target.dl.includes('재시도') ? 'pending' : 'done' },
          { s: '다운로드 권한 부여', k: target.dl === '권한부여' ? 'done' : target.dl === '권한회수' ? 'fail' : 'pending' },
          { s: '구매자 마이페이지 노출', k: target.dl === '권한부여' ? 'done' : 'pending' },
        ].map((r, i) => (
          <div className="timeline-item" key={i}>
            <div className={`timeline-dot ${r.k}`}><Icon name={r.k === 'done' ? 'check' : r.k === 'fail' ? 'x' : 'clock'} size={12} /></div>
            <div className="rail-title">{r.s}</div>
          </div>
        ))}
      </Modal>
    );
  }
  if (target.file) {
    return (
      <Modal title={target.file} onClose={onClose}>
        <div className="rail-sub">주문번호: {target.order}</div>
        <div className="rail-sub" style={{ marginTop: 6 }}>상태: {target.status}</div>
        <div className="rail-sub" style={{ marginTop: 6 }}>잔여 다운로드: {target.left}회</div>
        <div className="rail-sub" style={{ marginTop: 6 }}>만료 시각: {target.exp}</div>
      </Modal>
    );
  }
  return null;
}

function IssueLinkModal({ onClose, onIssued }) {
  const [orderNo, setOrderNo] = useState('OD-2409-119');
  const [limit, setLimit] = useState('3');
  const [days, setDays] = useState('7');
  return (
    <Modal title="새 다운로드 링크 발급" onClose={onClose} footer={
      <React.Fragment>
        <button className="btn-secondary" onClick={onClose}>취소</button>
        <button className="btn-primary" onClick={() => onIssued(orderNo)}>발급</button>
      </React.Fragment>
    }>
      <label className="field-label">주문번호</label>
      <input className="field-input" value={orderNo} onChange={e => setOrderNo(e.target.value)} />
      <label className="field-label">다운로드 허용 횟수</label>
      <input className="field-input" value={limit} onChange={e => setLimit(e.target.value)} />
      <label className="field-label">만료까지 일수</label>
      <input className="field-input" value={days} onChange={e => setDays(e.target.value)} />
    </Modal>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [detail, setDetail] = useState(null);
  const [issueOpen, setIssueOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  function pushToast(text) {
    const id = Date.now();
    setToasts(t => [...t, { id, text }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2400);
  }

  const NAV = [
    { key: 'main', label: '출판사 카탈로그 자동수집', icon: 'layout-dashboard' },
    { key: 'product-sync', label: '카페24 상품 자동 등록·갱신', icon: 'store' },
    { key: 'order-download', label: '결제·다운로드 권한 연동', icon: 'download-cloud' },
    { key: 'secure-download', label: '워터마킹 보안 다운로드', icon: 'shield-check' },
  ];

  return (
    <div data-archetype="stripe-multipane" style={{ display: 'flex', width: '100%', minHeight: '100vh' }}>
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand">
          <div className="sidebar-brand-mark"><Icon name="music-4" size={18} /></div>
          <div style={{ fontSize: 15, fontWeight: 800 }}>스코어허브 운영센터</div>
        </div>
        <div className="env-select">Production <Icon name="chevron-down" size={14} /></div>
        <div className="sidebar-section-title">파이프라인</div>
        {NAV.map(n => (
          <a key={n.key} className={`sidebar-link ${screen === n.key ? 'active' : ''}`} onClick={() => setScreen(n.key)}>
            <Icon name={n.icon} size={17} /> {n.label}
          </a>
        ))}
        <div className="sidebar-section-title">설정</div>
        <a className="sidebar-link" onClick={() => pushToast('알림 채널 설정을 열었습니다')}><Icon name="settings" size={17} /> 운영 설정</a>
        <div className="sidebar-foot">스코어허브 v2.4 · 자체 개발 프로젝트</div>
      </aside>

      <main className="main-wrap">
        {screen === 'main' && <MainScreen onOpenDetail={setDetail} pushToast={pushToast} />}
        {screen === 'product-sync' && <ProductSyncScreen onOpenDetail={setDetail} pushToast={pushToast} />}
        {screen === 'order-download' && <OrderDownloadScreen onOpenDetail={setDetail} pushToast={pushToast} />}
        {screen === 'secure-download' && <SecureDownloadScreen onOpenDetail={setDetail} pushToast={pushToast} onIssue={() => setIssueOpen(true)} />}
      </main>

      <DetailModal target={detail} onClose={() => setDetail(null)} />
      {issueOpen && <IssueLinkModal onClose={() => setIssueOpen(false)} onIssued={(no) => { setIssueOpen(false); pushToast(`${no} 다운로드 링크가 발급되었습니다`); }} />}
      <Toast items={toasts} />
      <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
