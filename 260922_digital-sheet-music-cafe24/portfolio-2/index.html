<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출판사 통합 운영 관제 플랫폼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 206°, light) ── */
:root{
  --m50:#edf7ff; --m100:#dbf0ff; --m200:#b8e0ff; --m300:#8cceff; --m400:#5cb9ff;
  --m500:#2ea5ff; --m600:#0091ff; --m700:#0077d1; --m800:#005da3; --m900:#004173;
  --n0:#ffffff; --n1:#f8f9fa; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b5b8ba; --n6:#909498; --n7:#838383; --n8:#53575a; --n9:#36383a; --n10:#202020;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--n1); color: var(--n10); width: 100%; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
#root { width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select { font-family: inherit; }
table { border-collapse: collapse; width: 100%; }

@keyframes fadeInPop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeInScale { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes toastSlide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.stagger { animation: fadeInPop .3s ease both; }

.topnav {
  width: 100%; height: 64px; background: var(--n0); border-bottom: 1px solid var(--n3);
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9999px; background: linear-gradient(135deg, var(--m600), var(--m800)); color: #fff; display: flex; align-items: center; justify-content: center; }

.hero-band {
  position: relative; overflow: hidden; border-radius: 16px; padding: 22px 26px; margin-bottom: 20px;
  background: linear-gradient(120deg, var(--m800) 0%, var(--m600) 55%, var(--m500) 100%); color: #fff;
}
.hero-band-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
.hero-band-sub { font-size: 13px; color: rgba(255,255,255,.75); }
.hero-wave { position: absolute; right: -20px; top: -30px; opacity: .5; }
.nav-links { display: flex; gap: 4px; }
.nav-link {
  padding: 9px 16px; border-radius: 9999px; font-size: 14px; font-weight: 600; color: var(--n7); display: flex; align-items: center; gap: 6px;
}
.nav-link:hover { background: var(--n2); }
.nav-link.active { background: var(--m50); color: var(--m700); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 9999px; display: flex; align-items: center; justify-content: center;
  color: var(--n7); background: var(--n1); position: relative;
}
.icon-btn:hover { background: var(--n2); }
.dot-badge { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--s2); }
.avatar { width: 32px; height: 32px; border-radius: 9999px; background: var(--n2); color: var(--n8); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

.page { width: 100%; padding: 28px 32px 60px; max-width: 1360px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.page-title { font-size: 24px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.page-meta { font-size: 13px; color: var(--n7); margin-top: 4px; }

.seg { display: flex; background: var(--n2); border-radius: 9999px; padding: 3px; }
.seg-btn { padding: 8px 16px; border-radius: 9999px; font-size: 13px; font-weight: 700; color: var(--n7); }
.seg-btn.active { background: var(--n0); color: var(--n10); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.btn-primary { background: var(--n10); color: #fff; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary:hover { background: var(--m700); }
.btn-secondary { background: var(--n0); color: var(--n9); font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 9999px; border: 1px solid var(--n3); display: inline-flex; align-items: center; gap: 6px; }
.btn-secondary:hover { background: var(--n2); }
.btn-ghost { color: var(--n8); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.btn-ghost:hover { color: var(--n10); }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--n0); border: 1px solid var(--n3); border-radius: 12px; padding: 16px 18px; }
.stat-label { font-size: 11px; font-weight: 700; color: var(--n7); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
.stat-value { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.stat-delta { font-size: 12px; font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 2px; }
.stat-delta.up { color: var(--s1); }
.stat-delta.down { color: var(--s2); }

.card { background: var(--n0); border: 1px solid var(--n3); border-radius: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--n3); }
.card-title { font-size: 15px; font-weight: 800; }

.data-table th { text-align: left; font-size: 11px; color: var(--n7); text-transform: uppercase; letter-spacing: .03em; padding: 8px 12px; border-bottom: 1px solid var(--n3); }
.data-table td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--n3); }
.data-table tr.rowbtn { cursor: pointer; }
.data-table tr.rowbtn:hover { background: var(--n1); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
.badge.neutral { background: var(--n2); color: var(--n8); }
.badge.done { background: var(--s1-bg); color: var(--s1-text); }
.badge.fail { background: var(--s2-bg); color: var(--s2-text); }
.badge.warn { background: var(--s3-bg); color: var(--s3-text); }

.split2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }

/* board */
.board-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.board-wrap { display: flex; gap: 16px; }
.board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; flex: 1; min-width: 0; }
.column { flex: 0 0 272px; background: var(--n2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 640px; overflow-y: auto; }
.col-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 6px; font-size: 13px; font-weight: 800; color: var(--n8); }
.count { background: var(--n0); border-radius: 9999px; padding: 2px 9px; font-size: 11px; font-weight: 800; color: var(--n8); }
.card.task { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--n3); cursor: pointer; transition: transform .14s ease, box-shadow .14s ease; }
.card.task:hover { transform: scale(1.02); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.card-title-sm { font-size: 13px; font-weight: 700; color: var(--n10); margin-bottom: 10px; line-height: 1.4; }
.card-meta { display: flex; align-items: center; justify-content: space-between; }
.tag { font-size: 10px; font-weight: 700; background: var(--n2); color: var(--n8); padding: 3px 8px; border-radius: 9999px; }
.card.task .tag { background: var(--n1); }
.meta-right { display: flex; align-items: center; gap: 6px; }
.priority-dot { width: 7px; height: 7px; border-radius: 50%; }
.priority-dot.high { background: var(--s2); }
.priority-dot.mid { background: var(--s3); }
.priority-dot.low { background: var(--n5); }
.mini-avatar { width: 22px; height: 22px; border-radius: 9999px; background: var(--n0); border: 1px solid var(--n3); color: var(--n8); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

.matrix-side { flex: 0 0 260px; }
.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; }
.matrix-cell { background: var(--n2); border-radius: 10px; padding: 12px; }
.matrix-cell.hot { background: var(--n10); color: #fff; }
.matrix-num { font-size: 18px; font-weight: 800; }
.matrix-lbl { font-size: 10px; color: var(--n7); margin-top: 4px; }
.matrix-cell.hot .matrix-lbl { color: var(--n4); }
.filter-row { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--n9); }
.checkbox { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--n5); display: inline-flex; align-items: center; justify-content: center; }
.checkbox.on { background: var(--m600); border-color: var(--m600); color: #fff; }

/* scheduling */
.sched-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--n3); }
.sched-row:last-child { border-bottom: none; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.status-dot.ok { background: var(--s1); }
.status-dot.fail { background: var(--s2); }
.cron-chip { font-family: ui-monospace, monospace; font-size: 12px; background: var(--n2); padding: 5px 10px; border-radius: 8px; color: var(--n9); }
.toggle { width: 38px; height: 22px; border-radius: 9999px; background: var(--n3); position: relative; flex-shrink: 0; }
.toggle.on { background: var(--m600); }
.toggle-dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on .toggle-dot { transform: translateX(16px); }
.timeline-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
.timeline-item:not(:last-child)::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: -2px; width: 2px; background: var(--n3); }
.timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--n2); color: var(--n8); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; }
.timeline-dot.done { background: var(--s1); color: #fff; }
.timeline-dot.fail { background: var(--s2); color: #fff; }

.filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.filter-tab { padding: 8px 16px; border-radius: 9999px; font-size: 13px; font-weight: 700; color: var(--n7); background: var(--n2); }
.filter-tab.active { background: var(--n10); color: #fff; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(32,32,32,.4); z-index: 90; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--n0); border-radius: 16px; width: 460px; max-width: 92vw; max-height: 86vh; overflow-y: auto; animation: fadeInScale .18s ease; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--n3); }
.modal-body { padding: 20px 22px; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--n3); display: flex; justify-content: flex-end; gap: 8px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--n8); margin-bottom: 6px; display: block; }
.field-input { width: 100%; padding: 10px 13px; border-radius: 10px; border: 1px solid var(--n4); font-size: 14px; margin-bottom: 14px; color: var(--n10); }

.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--n10); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: toastSlide .2s ease; }

.chart-legend { display: flex; gap: 14px; padding: 0 20px 14px; font-size: 12px; color: var(--n7); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.bar-track { height: 6px; background: var(--n2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transform-origin: left; animation: barGrow .6s ease both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, Legend } = Recharts;

function Icon({ name, size = 17, style, className }) {
  return <i className={`ph ph-${name} ${className || ''}`} style={{ fontSize: size, lineHeight: 1, ...style }}></i>;
}

const DESIGN_DNA = { borderRadius: 12, boxShadow: '0 1px 3px rgba(0,0,0,.06)' };

function Modal({ title, onClose, children, footer }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ borderRadius: DESIGN_DNA.borderRadius, boxShadow: DESIGN_DNA.boxShadow }} onClick={e => e.stopPropagation()}>
        <div className="modal-head"><div className="card-title">{title}</div><button className="icon-btn" onClick={onClose}><Icon name="x" size={16} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}
function Toast({ items }) {
  return <div className="toast-wrap">{items.map(t => <div className="toast" key={t.id}><Icon name="check-circle" size={16} /> {t.text}</div>)}</div>;
}
function StatCard({ label, value, delta, up }) {
  return (
    <div className="stat-card stagger">
      <div className="stat-label">{label}</div>
      <div className="stat-value">{value}</div>
      <div className={`stat-delta ${up ? 'up' : 'down'}`}><Icon name={up ? 'arrow-up-right' : 'arrow-down-right'} size={13} />{delta}</div>
    </div>
  );
}

const PUB_STATS = [
  { name: '출판사 A', sales: 412, fail: 1.2, revenue: '612만원' },
  { name: '출판사 B', sales: 356, fail: 2.4, revenue: '498만원' },
  { name: '출판사 C', sales: 128, fail: 6.8, revenue: '181만원' },
  { name: '출판사 D', sales: 94, fail: 0.5, revenue: '141만원' },
].sort((a, b) => b.fail - a.fail);

const TREND = [
  { d: '9/16', A: 52, B: 44, C: 12, D: 9 },
  { d: '9/17', A: 58, B: 41, C: 18, D: 11 },
  { d: '9/18', A: 61, B: 50, C: 14, D: 12 },
  { d: '9/19', A: 55, B: 47, C: 20, D: 15 },
  { d: '9/20', A: 68, B: 52, C: 16, D: 13 },
  { d: '9/21', A: 72, B: 58, C: 22, D: 17 },
  { d: '9/22', A: 66, B: 49, C: 26, D: 17 },
];

function MainScreen({ pushToast }) {
  const [period, setPeriod] = useState('이번주');
  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">출판사 통합 판매 · 다운로드 대시보드</h1>
          <div className="page-meta">신규 4개 출판사 지표를 기존 관리자 DB 체계에 편입</div>
        </div>
        <div className="seg">
          {['오늘', '이번주', '이번달'].map(p => (
            <button key={p} className={`seg-btn ${period === p ? 'active' : ''}`} onClick={() => { setPeriod(p); pushToast(`${p} 기준으로 위젯을 갱신했습니다`); }}>{p}</button>
          ))}
        </div>
      </div>

      <div className="hero-band">
        <svg className="hero-wave" width="220" height="140" viewBox="0 0 220 140" fill="none">
          <path d="M0 90 Q 40 40 80 90 T 160 90 T 240 90" stroke="rgba(255,255,255,.4)" strokeWidth="2" fill="none" />
          <path d="M0 120 Q 40 70 80 120 T 160 120 T 240 120" stroke="rgba(255,255,255,.25)" strokeWidth="2" fill="none" />
          <circle cx="150" cy="45" r="34" fill="rgba(255,255,255,.12)" />
        </svg>
        <div className="hero-band-title">신규 4개 출판사 지표를 기존 관리자 체계 위에 통합 편입</div>
        <div className="hero-band-sub">출판사별 판매·다운로드 현황을 한 화면에서 비교하고, 실패율이 높은 출판사를 자동으로 상단에 정렬합니다.</div>
      </div>

      <div className="stat-row">
        <StatCard label="이번 달 총 판매" value="990건" delta="+6.4%" up />
        <StatCard label="다운로드 발급" value="1,204건" delta="+4.1%" up />
        <StatCard label="다운로드 실패율" value="2.7%" delta="-0.4%p" up />
        <StatCard label="활성 SKU" value="6,182개" delta="+312개" up />
      </div>

      <div className="split2">
        <div className="card">
          <div className="card-head"><div className="card-title">출판사별 판매 추이 ({period})</div><button className="btn-ghost" onClick={() => pushToast('상세 리포트를 새 탭에 준비 중입니다')}>상세 리포트 <Icon name="arrow-up-right" size={13} /></button></div>
          <div className="chart-legend">
            <span><span className="legend-dot" style={{ background: 'var(--m700)' }}></span>출판사 A</span>
            <span><span className="legend-dot" style={{ background: 'var(--m500)' }}></span>출판사 B</span>
            <span><span className="legend-dot" style={{ background: 'var(--m300)' }}></span>출판사 C</span>
            <span><span className="legend-dot" style={{ background: 'var(--n5)' }}></span>출판사 D</span>
          </div>
          <div style={{ padding: '0 12px 16px', height: 240, position: 'relative' }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={TREND}>
                <CartesianGrid stroke="var(--n3)" vertical={false} />
                <XAxis dataKey="d" tick={{ fontSize: 11, fill: '#909498' }} axisLine={{ stroke: '#e5e6e6' }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: '#909498' }} axisLine={false} tickLine={false} />
                <Tooltip contentStyle={{ fontSize: 12, borderRadius: 10, border: '1px solid #e5e6e6' }} />
                <Line type="monotone" dataKey="A" stroke="#0077d1" strokeWidth={2.4} dot={false} />
                <Line type="monotone" dataKey="B" stroke="#2ea5ff" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="C" stroke="#8cceff" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="D" stroke="#b5b8ba" strokeWidth={2} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">출판사별 비교</div></div>
          <div style={{ padding: '14px 18px' }}>
            {PUB_STATS.map((p, i) => (
              <div key={p.name} style={{ marginBottom: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 6 }}>
                  <span style={{ fontWeight: 700 }}>{p.name} {i === 0 && <span className="badge warn" style={{ marginLeft: 6 }}><Icon name="warning" size={11} />실패율 주의</span>}</span>
                  <span style={{ color: 'var(--n7)' }}>{p.revenue}</span>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{ width: `${Math.min(p.sales / 4.2, 100)}%`, background: i === 0 ? 'var(--s3)' : 'var(--m600)' }}></div></div>
                <div style={{ fontSize: 11, color: 'var(--n7)', marginTop: 4 }}>판매 {p.sales}건 · 다운로드 실패율 {p.fail}%</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const COLUMNS = [
  { key: 'new', label: '신규실패' },
  { key: 'wait', label: '재처리대기' },
  { key: 'progress', label: '재처리중' },
  { key: 'done', label: '해결완료' },
];
const SEED_CARDS = [
  { id: 1, col: 'new', title: '출판사 B FTP 연결 실패 — 인증서 만료', pub: '출판사 B', assignee: '민', prio: 'high' },
  { id: 2, col: 'new', title: '출판사 C REST API 429 다발', pub: '출판사 C', assignee: '지', prio: 'high' },
  { id: 3, col: 'wait', title: '출판사 A 커버이미지 URL 404', pub: '출판사 A', assignee: '민', prio: 'mid' },
  { id: 4, col: 'wait', title: '출판사 D 파일 인코딩 오류 3건', pub: '출판사 D', assignee: '수', prio: 'mid' },
  { id: 5, col: 'wait', title: '출판사 C 페이지네이션 커서 유실', pub: '출판사 C', assignee: '지', prio: 'low' },
  { id: 6, col: 'progress', title: '출판사 B XML 스키마 필드 매핑 재작업', pub: '출판사 B', assignee: '수', prio: 'high' },
  { id: 7, col: 'progress', title: '카페24 상품 등록 Rate Limit 초과', pub: '전체', assignee: '민', prio: 'mid' },
  { id: 8, col: 'done', title: '출판사 A SKU 중복 충돌 해결', pub: '출판사 A', assignee: '지', prio: 'low' },
];
const NEXT_COL = { new: 'wait', wait: 'progress', progress: 'done', done: 'done' };

function RetryBoardScreen({ pushToast }) {
  const [cards, setCards] = useState(SEED_CARDS);
  const [selected, setSelected] = useState(null);
  const [pubFilter, setPubFilter] = useState({ '출판사 A': true, '출판사 B': true, '출판사 C': true, '출판사 D': true });
  const [newOpen, setNewOpen] = useState(false);

  const visible = cards.filter(c => c.pub === '전체' || pubFilter[c.pub]);

  function advance(id) {
    setCards(cs => cs.map(c => c.id === id ? { ...c, col: NEXT_COL[c.col] } : c));
    pushToast('카드가 다음 단계로 이동했습니다');
    setSelected(null);
  }

  return (
    <div className="page">
      <div className="board-header">
        <div>
          <h1 className="page-title">수집 · 등록 오류 재처리 보드</h1>
          <div className="page-meta">실패 이벤트가 자동으로 카드화되어 담당자에게 배정됩니다</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn-secondary" onClick={() => pushToast('출판사 · 담당자 필터를 열었습니다')}><Icon name="funnel" size={14} /> 필터</button>
          <button className="btn-primary" onClick={() => setNewOpen(true)}><Icon name="plus" size={14} /> 새 항목</button>
        </div>
      </div>

      <div className="board-wrap" data-archetype="kanban-board">
        <div className="board">
          {COLUMNS.map(col => {
            const items = visible.filter(c => c.col === col.key);
            return (
              <section className="column" key={col.key}>
                <div className="col-header">{col.label} <span className="count">{items.length}</span></div>
                {items.map(c => (
                  <div className="card task" key={c.id} onClick={() => setSelected(c)}>
                    <div className="card-title-sm">{c.title}</div>
                    <div className="card-meta">
                      <span className="tag">{c.pub}</span>
                      <div className="meta-right">
                        <span className={`priority-dot ${c.prio}`}></span>
                        <span className="mini-avatar">{c.assignee}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </section>
            );
          })}
        </div>

        <div className="matrix-side card">
          <div className="card-head"><div className="card-title">영향도 × 긴급도</div></div>
          <div className="matrix-grid">
            <div className="matrix-cell hot"><div className="matrix-num">{visible.filter(c=>c.prio==='high').length}</div><div className="matrix-lbl">고영향 · 긴급</div></div>
            <div className="matrix-cell"><div className="matrix-num">{visible.filter(c=>c.prio==='mid').length}</div><div className="matrix-lbl">중간</div></div>
            <div className="matrix-cell"><div className="matrix-num">{visible.filter(c=>c.prio==='low').length}</div><div className="matrix-lbl">저영향 · 여유</div></div>
            <div className="matrix-cell"><div className="matrix-num">{cards.filter(c=>c.col==='done').length}</div><div className="matrix-lbl">해결완료 누적</div></div>
          </div>
          <div className="card-head" style={{ borderTop: '1px solid var(--n3)', borderBottom: 'none' }}><div className="card-title" style={{ fontSize: 13 }}>출판사 필터</div></div>
          <div className="filter-row">
            {Object.keys(pubFilter).map(p => (
              <div className="check-row" key={p} onClick={() => setPubFilter(f => ({ ...f, [p]: !f[p] }))} style={{ cursor: 'pointer' }}>
                <span className={`checkbox ${pubFilter[p] ? 'on' : ''}`}>{pubFilter[p] && <Icon name="check" size={11} />}</span>
                {p}
              </div>
            ))}
          </div>
        </div>
      </div>

      {selected && (
        <Modal title={selected.title} onClose={() => setSelected(null)} footer={
          selected.col !== 'done' ? <button className="btn-primary" onClick={() => advance(selected.id)}>다음 단계로 이동</button> : <span className="badge done">처리 완료</span>
        }>
          {[
            { s: '실패 이벤트 감지', k: 'done' },
            { s: `${selected.pub} 재처리 큐 등록`, k: 'done' },
            { s: `담당자 배정 (${selected.assignee})`, k: selected.col === 'new' ? 'pending' : 'done' },
            { s: '재처리 실행 및 검증', k: selected.col === 'done' ? 'done' : 'pending' },
          ].map((r, i) => (
            <div className="timeline-item" key={i}>
              <div className={`timeline-dot ${r.k}`}><Icon name={r.k === 'done' ? 'check' : 'clock'} size={12} /></div>
              <div className="card-title-sm" style={{ marginBottom: 0 }}>{r.s}</div>
            </div>
          ))}
        </Modal>
      )}
      {newOpen && (
        <Modal title="새 재처리 항목 등록" onClose={() => setNewOpen(false)} footer={
          <React.Fragment>
            <button className="btn-secondary" onClick={() => setNewOpen(false)}>취소</button>
            <button className="btn-primary" onClick={() => { setNewOpen(false); pushToast('새 항목이 신규실패 컬럼에 등록되었습니다'); }}>등록</button>
          </React.Fragment>
        }>
          <label className="field-label">출판사</label>
          <input className="field-input" defaultValue="출판사 C" />
          <label className="field-label">실패 유형</label>
          <input className="field-input" placeholder="예: API 응답 지연" />
        </Modal>
      )}
    </div>
  );
}

const SCHED_ROWS = [
  { pub: '출판사 A', cron: '0 3 * * *', next: '내일 03:00', last: 'ok', running: false },
  { pub: '출판사 B', cron: '30 3 * * *', next: '내일 03:30', last: 'ok', running: false },
  { pub: '출판사 C', cron: '*/20 * * * *', next: '18분 후', last: 'fail', running: false },
  { pub: '출판사 D', cron: '수동 실행', next: '-', last: 'ok', running: false },
];

function SchedulingScreen({ pushToast }) {
  const [rows, setRows] = useState(SCHED_ROWS);
  const [editing, setEditing] = useState(null);
  const [emailOn, setEmailOn] = useState(true);
  const [webhookOn, setWebhookOn] = useState(false);

  function runNow(pub) {
    setRows(rs => rs.map(r => r.pub === pub ? { ...r, running: true } : r));
    pushToast(`${pub} 수집을 큐에 즉시 등록했습니다`);
    setTimeout(() => setRows(rs => rs.map(r => r.pub === pub ? { ...r, running: false, last: 'ok' } : r)), 1500);
  }

  return (
    <div className="page">
      <div className="page-header">
        <div><h1 className="page-title">수집 스케줄링 및 크론 관리</h1><div className="page-meta">출판사별 독립 스케줄 · Bull Queue 기반 반복 작업</div></div>
      </div>
      <div className="split2">
        <div className="card">
          <div className="card-head"><div className="card-title">출판사별 스케줄</div></div>
          {rows.map(r => (
            <div className="sched-row" key={r.pub}>
              <span className={`status-dot ${r.last}`}></span>
              <div style={{ width: 84, fontWeight: 700, fontSize: 13 }}>{r.pub}</div>
              <span className="cron-chip">{r.cron}</span>
              <div style={{ flex: 1, fontSize: 12, color: 'var(--n7)' }}>다음 실행 {r.next}</div>
              <button className="btn-secondary" onClick={() => setEditing(r)}><Icon name="pencil-simple" size={13} /> 편집</button>
              <button className="btn-primary" onClick={() => runNow(r.pub)}>
                <Icon name={r.running ? 'spinner-gap' : 'play'} size={13} style={r.running ? { animation: 'spin .8s linear infinite' } : undefined} /> {r.running ? '실행중' : '지금 실행'}
              </button>
            </div>
          ))}
          <div className="sched-row" style={{ paddingTop: 16 }}>
            <div style={{ flex: 1 }}>
              <div className="card-title-sm" style={{ marginBottom: 2 }}>이메일 알림</div>
              <div style={{ fontSize: 12, color: 'var(--n7)' }}>3회 연속 실패 시 담당자 이메일 발송</div>
            </div>
            <div className={`toggle ${emailOn ? 'on' : ''}`} onClick={() => setEmailOn(v => !v)}><div className="toggle-dot"></div></div>
          </div>
          <div className="sched-row">
            <div style={{ flex: 1 }}>
              <div className="card-title-sm" style={{ marginBottom: 2 }}>웹훅 알림</div>
              <div style={{ fontSize: 12, color: 'var(--n7)' }}>내부 협업 도구로 실패 이벤트 전송</div>
            </div>
            <div className={`toggle ${webhookOn ? 'on' : ''}`} onClick={() => setWebhookOn(v => !v)}><div className="toggle-dot"></div></div>
          </div>
        </div>
        <div className="card">
          <div className="card-head"><div className="card-title">실행 이력</div></div>
          <div style={{ padding: 18 }}>
            {[
              { s: '출판사 A 수집 완료 — 214건', t: '오늘 03:00', k: 'done' },
              { s: '출판사 B 수집 완료 — 188건', t: '오늘 03:30', k: 'done' },
              { s: '출판사 C 수집 실패 — 429 응답', t: '오늘 09:20', k: 'fail' },
              { s: '출판사 A 수집 완료 — 209건', t: '어제 03:00', k: 'done' },
              { s: '출판사 B 수집 완료 — 176건', t: '어제 03:30', k: 'done' },
            ].map((r, i) => (
              <div className="timeline-item" key={i}>
                <div className={`timeline-dot ${r.k}`}><Icon name={r.k === 'done' ? 'check' : 'x'} size={12} /></div>
                <div><div className="card-title-sm" style={{ marginBottom: 2 }}>{r.s}</div><div style={{ fontSize: 12, color: 'var(--n7)' }}>{r.t}</div></div>
              </div>
            ))}
          </div>
        </div>
      </div>
      {editing && (
        <Modal title={`${editing.pub} 크론 표현식 편집`} onClose={() => setEditing(null)} footer={
          <React.Fragment><button className="btn-secondary" onClick={() => setEditing(null)}>취소</button>
          <button className="btn-primary" onClick={() => { setEditing(null); pushToast('크론 표현식이 저장되었습니다'); }}>저장</button></React.Fragment>
        }>
          <label className="field-label">크론 표현식</label>
          <input className="field-input" defaultValue={editing.cron} />
          <div style={{ fontSize: 12, color: 'var(--n7)' }}>변경 시 다음 실행 예정 시각이 즉시 갱신됩니다.</div>
        </Modal>
      )}
    </div>
  );
}

const REFUND_ROWS = [
  { id: 'RF-0231', order: 'OD-2409-116', pub: '출판사 B', date: '09-21', reason: '중복 결제', status: '대기' },
  { id: 'RF-0230', order: 'OD-2409-098', pub: '출판사 A', date: '09-20', reason: '단순 변심', status: '승인' },
  { id: 'RF-0229', order: 'OD-2409-081', pub: '출판사 D', date: '09-19', reason: '다운로드 실패 반복', status: '승인' },
  { id: 'RF-0228', order: 'OD-2409-076', pub: '출판사 C', date: '09-18', reason: '요청 사유 불명확', status: '반려' },
  { id: 'RF-0227', order: 'OD-2409-070', pub: '출판사 A', date: '09-17', reason: '잘못된 상품 구매', status: '대기' },
];

function RefundScreen({ pushToast }) {
  const [rows, setRows] = useState(REFUND_ROWS);
  const [filter, setFilter] = useState('전체');
  const [sel, setSel] = useState(null);
  const filtered = rows.filter(r => filter === '전체' || r.status === filter);

  function decide(id, status) {
    setRows(rs => rs.map(r => r.id === id ? { ...r, status } : r));
    setSel(null);
    pushToast(status === '승인' ? '환불 처리 및 다운로드 권한 회수가 함께 반영되었습니다' : '환불 요청이 반려 처리되었습니다');
  }

  return (
    <div className="page">
      <div className="page-header">
        <div><h1 className="page-title">환불 처리 및 다운로드 권한 회수 관리</h1><div className="page-meta">승인과 권한 회수를 하나의 트랜잭션으로 처리</div></div>
      </div>
      <div className="filter-tabs">
        {['전체', '대기', '승인', '반려'].map(f => (
          <button key={f} className={`filter-tab ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="card">
        <div className="data-table-wrap" style={{ padding: 4 }}>
          <table className="data-table">
            <thead><tr><th>요청번호</th><th>주문번호</th><th>출판사</th><th>요청일</th><th>사유</th><th>상태</th></tr></thead>
            <tbody>
              {filtered.map(r => (
                <tr key={r.id} className="rowbtn" onClick={() => setSel(r)}>
                  <td>{r.id}</td><td>{r.order}</td><td>{r.pub}</td><td>{r.date}</td><td>{r.reason}</td>
                  <td><span className={`badge ${r.status === '승인' ? 'done' : r.status === '반려' ? 'fail' : 'neutral'}`}>{r.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {sel && (
        <Modal title={sel.id} onClose={() => setSel(null)} footer={
          sel.status === '대기' ? (
            <React.Fragment>
              <button className="btn-secondary" onClick={() => decide(sel.id, '반려')}>반려</button>
              <button className="btn-primary" onClick={() => decide(sel.id, '승인')}>승인 및 권한 회수</button>
            </React.Fragment>
          ) : <span className={`badge ${sel.status === '승인' ? 'done' : 'fail'}`}>{sel.status}</span>
        }>
          <div style={{ fontSize: 13, marginBottom: 8 }}>주문번호: {sel.order}</div>
          <div style={{ fontSize: 13, marginBottom: 8 }}>출판사: {sel.pub}</div>
          <div style={{ fontSize: 13, marginBottom: 8 }}>요청 사유: {sel.reason}</div>
          <div style={{ fontSize: 13 }}>요청일: {sel.date}</div>
        </Modal>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('main');
  const [toasts, setToasts] = useState([]);
  function pushToast(text) {
    const id = Date.now();
    setToasts(t => [...t, { id, text }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2400);
  }
  const NAV = [
    { key: 'main', label: '통합 대시보드', icon: 'squares-four' },
    { key: 'retry-board', label: '수집·등록 오류 재처리 보드', icon: 'kanban' },
    { key: 'scheduling', label: '수집 스케줄링 및 크론 관리', icon: 'clock-countdown' },
    { key: 'refund', label: '환불 처리 및 다운로드 권한 회수 관리', icon: 'arrow-counter-clockwise' },
  ];
  return (
    <div data-archetype="kanban-board" style={{ width: '100%', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="topnav">
        <div className="brand"><div className="brand-mark"><Icon name="waveform" size={16} /></div>스코어허브 관제 콘솔</div>
        <nav className="nav-links">
          {NAV.map(n => (
            <button key={n.key} className={`nav-link ${screen === n.key ? 'active' : ''}`} onClick={() => setScreen(n.key)}><Icon name={n.icon} size={15} />{n.label}</button>
          ))}
        </nav>
        <div className="nav-right">
          <button className="icon-btn" onClick={() => pushToast('검색을 열었습니다')}><Icon name="magnifying-glass" size={16} /></button>
          <button className="icon-btn" onClick={() => pushToast('알림 3건을 확인했습니다')}><Icon name="bell" size={16} /><span className="dot-badge"></span></button>
          <div className="avatar">운영</div>
        </div>
      </header>
      <main style={{ flex: 1, width: '100%' }}>
        {screen === 'main' && <MainScreen pushToast={pushToast} />}
        {screen === 'retry-board' && <RetryBoardScreen pushToast={pushToast} />}
        {screen === 'scheduling' && <SchedulingScreen pushToast={pushToast} />}
        {screen === 'refund' && <RefundScreen pushToast={pushToast} />}
      </main>
      <Toast items={toasts} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
