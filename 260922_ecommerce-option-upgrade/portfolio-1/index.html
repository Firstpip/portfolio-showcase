<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤 인테리어 필름 주문 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (hue 206°, light) ── */
:root{
  --m50:#edf7ff; --m100:#dbf0ff; --m200:#b8e0ff; --m300:#8cceff; --m400:#5cb9ff;
  --m500:#2ea5ff; --m600:#0091ff; --m700:#0077d1; --m800:#005da3; --m900:#004173;
  --n0:#ffffff; --n1:#f8f9fa; --n2:#eff0f0; --n3:#e5e6e6; --n4:#d5d6d7;
  --n5:#b3b3b3; --n6:#909498; --n7:#71767a; --n8:#53575a; --n9:#36383a; --n10:#202020;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--n1); color:var(--n10);
  -webkit-font-smoothing:antialiased;
}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

/* ── layout ── */
.app{width:100%;min-height:100vh;display:flex;flex-direction:column;}
.search-header{position:sticky;top:0;z-index:40;background:var(--n0);border-bottom:1px solid var(--n3);}
.header-row{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:16px 32px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:var(--n10);flex-shrink:0;}
.brand .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;}
.search-bar{flex:1;display:flex;align-items:center;border:1px solid var(--n3);border-radius:9999px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:4px;max-width:640px;transition:box-shadow .2s;}
.search-bar:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.search-segment{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:8px 20px;border-radius:9999px;transition:background .15s;text-align:left;min-width:0;}
.search-segment:hover{background:var(--n1);}
.segment-label{font-size:11px;font-weight:700;color:var(--n9);}
.segment-value{font-size:12.5px;color:var(--n6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.search-divider{width:1px;height:22px;background:var(--n3);}
.search-submit{width:38px;height:38px;border-radius:50%;background:var(--m600);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:2px;transition:transform .15s;}
.search-submit:hover{transform:scale(1.06);}
.header-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-link{padding:10px 14px;border-radius:9999px;font-size:13.5px;font-weight:600;color:var(--n8);transition:background .15s,color .15s;white-space:nowrap;}
.nav-link:hover{background:var(--n1);color:var(--n10);}
.nav-link.active{background:var(--m50);color:var(--m700);}
.cart-btn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n8);}
.cart-btn:hover{background:var(--n1);}
.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--m600);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.filter-chips{max-width:1360px;margin:0 auto;display:flex;gap:8px;padding:0 32px 14px;overflow-x:auto;}
.chip{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;border:1px solid var(--n3);font-size:13px;font-weight:600;color:var(--n7);white-space:nowrap;flex-shrink:0;transition:all .15s;}
.chip:hover{border-color:var(--n5);color:var(--n9);}
.chip.active{background:var(--n10);color:#fff;border-color:var(--n10);}
.chip .chip-icon{display:flex;}

.main{flex:1;width:100%;max-width:1360px;margin:0 auto;padding:24px 32px 80px;}
.section-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.section-title{font-size:21px;font-weight:800;letter-spacing:-0.02em;}
.section-sub{font-size:13px;color:var(--n7);margin-top:2px;}
.result-count{font-size:13px;color:var(--n7);font-weight:600;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:22px;}
.listing-card{border-radius:16px;overflow:hidden;background:var(--n0);cursor:pointer;transition:transform .18s,box-shadow .18s;animation:cardIn .5s both;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.listing-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10);}
.card-image-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--n2);}
.card-image{width:100%;height:100%;object-fit:cover;display:block;}
.card-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--n8);transition:transform .15s;}
.card-favorite:hover{transform:scale(1.1);}
.card-favorite.on{color:var(--s2);}
.card-tag{position:absolute;top:10px;left:10px;background:var(--n10);color:#fff;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:9999px;}
.card-tag.special{background:var(--s3-text);}
.card-body{padding:14px 14px 16px;}
.card-row-1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;}
.card-title{font-size:15.5px;font-weight:700;line-height:1.3;letter-spacing:-0.01em;}
.card-rating{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--n8);flex-shrink:0;}
.card-meta{font-size:12.5px;color:var(--n7);display:block;margin-bottom:2px;}
.card-row-4{display:flex;align-items:baseline;gap:4px;margin-top:8px;}
.card-price{font-size:16.5px;font-weight:800;color:var(--n10);}
.price-unit{font-size:12px;color:var(--n6);}

/* quick-view drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,20,20,.42);z-index:60;display:flex;justify-content:flex-end;animation:fadeIn .2s;}
.drawer{width:min(480px,92vw);height:100%;background:var(--n0);box-shadow:-8px 0 32px rgba(0,0,0,.14);display:flex;flex-direction:column;animation:slideInRight .28s cubic-bezier(.16,1,.3,1);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--n3);}
.drawer-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7);}
.drawer-close:hover{background:var(--n1);}
.drawer-body{flex:1;overflow-y:auto;padding:22px;}
.drawer-img{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;margin-bottom:18px;background:var(--n2);}
.drawer-img img{width:100%;height:100%;object-fit:cover;}
.spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--n2);font-size:13.5px;}
.spec-row span:first-child{color:var(--n7);}
.spec-row span:last-child{font-weight:600;}
.drawer-foot{padding:18px 22px;border-top:1px solid var(--n3);display:flex;gap:10px;}

.btn{padding:12px 20px;border-radius:9999px;font-size:14px;font-weight:700;transition:transform .12s,box-shadow .12s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600);color:#fff;box-shadow:0 4px 14px rgba(0,145,255,.28);}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{background:var(--n4);color:var(--n6);box-shadow:none;cursor:not-allowed;}
.btn-outline{background:var(--n0);color:var(--n9);border:1.5px solid var(--n3);}
.btn-outline:hover{border-color:var(--n6);}
.btn-ghost{background:var(--n1);color:var(--n8);}
.btn-ghost:hover{background:var(--n2);}
.btn-block{width:100%;}

/* ── option builder ── */
.builder-wrap{max-width:980px;margin:0 auto;padding:36px 32px 100px;}
.builder-title{font-size:34px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;line-height:1.18;}
.hero-title{font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:1.2;margin-bottom:8px;}
.hero-title em{font-style:normal;color:var(--m600);}
.hero-sub{font-size:14px;color:var(--n7);margin-bottom:22px;display:flex;align-items:center;gap:8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--s1);animation:pulseDot 1.6s ease-in-out infinite;flex-shrink:0;}
.builder-desc{font-size:14px;color:var(--n7);margin-bottom:28px;}
.step-track{display:flex;align-items:center;margin-bottom:32px;}
.step-node{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;}
.step-dot{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n6);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid transparent;transition:all .2s;z-index:1;}
.step-node.done .step-dot{background:var(--m600);color:#fff;}
.step-node.active .step-dot{background:var(--n0);color:var(--m700);border-color:var(--m600);box-shadow:0 0 0 4px var(--m50);}
.step-label{font-size:12px;font-weight:600;color:var(--n7);}
.step-node.active .step-label{color:var(--n10);}
.step-line{position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);height:2px;background:var(--n3);z-index:0;}
.step-node.done .step-line{background:var(--m600);}
.step-node:last-child .step-line{display:none;}

.builder-grid{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;}
.option-panel{background:var(--n0);border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:320px;}
.panel-heading{font-size:17px;font-weight:800;margin-bottom:4px;}
.panel-hint{font-size:12.5px;color:var(--n7);margin-bottom:20px;}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.opt-card{border:1.5px solid var(--n3);border-radius:13px;padding:14px;text-align:left;transition:all .15s;}
.opt-card:hover{border-color:var(--n6);}
.opt-card.selected{border-color:var(--m600);background:var(--m50);box-shadow:0 0 0 1px var(--m600) inset;}
.opt-card.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
.opt-swatch{width:100%;height:52px;border-radius:8px;margin-bottom:10px;}
.opt-name{font-size:13px;font-weight:700;color:var(--n10);}
.opt-price{font-size:11.5px;color:var(--n7);margin-top:2px;}
.opt-card.selected .opt-name{color:var(--m800);}

.size-form{display:flex;gap:16px;}
.size-field{flex:1;}
.size-field label{display:block;font-size:12.5px;font-weight:700;color:var(--n8);margin-bottom:6px;}
.size-field input{width:100%;padding:12px 14px;border:1.5px solid var(--n3);border-radius:10px;font-size:15px;font-weight:700;}
.size-field input:focus{outline:none;border-color:var(--m600);}
.size-preset-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.size-preset{padding:8px 14px;border-radius:9999px;border:1.5px solid var(--n3);font-size:12.5px;font-weight:600;color:var(--n7);}
.size-preset.selected{border-color:var(--m600);background:var(--m50);color:var(--m700);}

.summary-panel{background:var(--n0);border-radius:18px;padding:22px;position:sticky;top:96px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.summary-title{font-size:14px;font-weight:800;margin-bottom:14px;}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--n3);font-size:13px;}
.summary-row span:first-child{color:var(--n7);}
.summary-row span:last-child{font-weight:600;color:var(--n9);max-width:130px;text-align:right;}
.summary-row.empty span:last-child{color:var(--n5);font-weight:500;}
.summary-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--n3);}
.summary-total-label{font-size:13px;font-weight:700;}
.summary-total-price{font-size:22px;font-weight:800;color:var(--m700);}
.step-btn-row{display:flex;gap:10px;margin-top:22px;}

/* ── special order ── */
.special-wrap{max-width:900px;margin:0 auto;padding:36px 32px 100px;}
.banner{display:flex;gap:14px;align-items:flex-start;background:var(--s3-bg);border:1px solid #ecd9b8;border-radius:16px;padding:18px 20px;margin-bottom:26px;}
.banner-icon{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--s3-text);flex-shrink:0;}
.banner-title{font-size:14.5px;font-weight:800;color:var(--s3-text);margin-bottom:3px;}
.banner-desc{font-size:13px;color:var(--n8);line-height:1.5;}

.compare-table{width:100%;border-collapse:collapse;margin-bottom:28px;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.compare-table th,.compare-table td{padding:13px 16px;font-size:13px;text-align:left;border-bottom:1px solid var(--n2);}
.compare-table th{background:var(--n1);color:var(--n7);font-weight:700;font-size:12px;}
.compare-table td{background:var(--n0);}
.compare-table tr:last-child td{border-bottom:none;}
.pill-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:11.5px;font-weight:700;}
.pill-tag.ok{background:var(--s1-bg);color:var(--s1-text);}
.pill-tag.no{background:var(--s2-bg);color:var(--s2-text);}

.form-card{background:var(--n0);border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.form-row{margin-bottom:18px;}
.form-row label{display:block;font-size:13px;font-weight:700;color:var(--n8);margin-bottom:7px;}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:12px 14px;border:1.5px solid var(--n3);border-radius:11px;font-size:13.5px;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--m600);}
.form-row textarea{resize:vertical;min-height:80px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:9999px;font-size:12.5px;font-weight:700;}
.status-badge.pending{background:var(--n2);color:var(--n7);}
.status-badge.submitted{background:var(--s1-bg);color:var(--s1-text);}

/* ── checkout ── */
.checkout-wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px;display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;}
.mini-stepper{display:flex;align-items:center;gap:6px;margin-bottom:26px;font-size:12px;font-weight:700;color:var(--n6);}
.mini-stepper .msp{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;background:var(--n2);}
.mini-stepper .msp.current{background:var(--m50);color:var(--m700);}
.mini-stepper .msp-arrow{color:var(--n4);}

.cart-item{display:flex;gap:14px;background:var(--n0);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.cart-item-img{width:76px;height:76px;border-radius:11px;overflow:hidden;flex-shrink:0;background:var(--n2);}
.cart-item-img img{width:100%;height:100%;object-fit:cover;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-size:14px;font-weight:700;margin-bottom:6px;}
.cart-chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.cart-chip{font-size:10.5px;font-weight:600;background:var(--n2);color:var(--n7);padding:3px 8px;border-radius:9999px;}
.cart-item-price{font-size:14.5px;font-weight:800;}
.cart-item-remove{color:var(--n5);flex-shrink:0;}
.cart-item-remove:hover{color:var(--s2);}

.checkout-form-card{background:var(--n0);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:20px;}
.pay-method-row{display:flex;gap:10px;margin-top:8px;}
.pay-method{flex:1;border:1.5px solid var(--n3);border-radius:12px;padding:14px;text-align:center;font-size:12.5px;font-weight:700;color:var(--n7);transition:all .15s;}
.pay-method.selected{border-color:var(--m600);background:var(--m50);color:var(--m700);}

.order-summary{background:var(--n0);border-radius:18px;padding:22px;position:sticky;top:96px;box-shadow:0 1px 2px rgba(0,0,0,.04);}

/* ── modal / toast ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s;}
.modal-box{background:var(--n0);border-radius:20px;width:min(420px,100%);padding:28px;animation:fadeInScale .22s cubic-bezier(.16,1,.3,1);}
.modal-icon{width:52px;height:52px;border-radius:50%;background:var(--m50);color:var(--m700);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.modal-icon.loading{background:var(--n2);color:var(--n7);}
.modal-title{font-size:17px;font-weight:800;margin-bottom:8px;}
.modal-desc{font-size:13.5px;color:var(--n7);line-height:1.55;margin-bottom:22px;}
.modal-actions{display:flex;gap:10px;}
.spinner{width:34px;height:34px;border:3px solid var(--n3);border-top-color:var(--m600);border-radius:50%;animation:spin .8s linear infinite;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:14px 22px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:100;animation:slideUp .3s cubic-bezier(.16,1,.3,1);box-shadow:0 12px 30px rgba(0,0,0,.25);}
.toast .ti{color:var(--m400);}

/* ── footer ── */
.footer{border-top:1px solid var(--n3);background:var(--n0);padding:40px 32px 30px;margin-top:auto;}
.footer-cols{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;}
.footer-col h4{font-size:12.5px;font-weight:800;color:var(--n9);margin-bottom:12px;}
.footer-col a{display:block;font-size:12.5px;color:var(--n7);margin-bottom:9px;}
.footer-col a:hover{color:var(--n10);}
.footer-brand-desc{font-size:12.5px;color:var(--n6);line-height:1.6;margin-top:10px;max-width:240px;}
.footer-note{max-width:1360px;margin:26px auto 0;padding-top:20px;border-top:1px solid var(--n2);font-size:11.5px;color:var(--n5);}

/* ── animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseDot{0%,100%{opacity:.3}50%{opacity:1}}

@media (max-width:860px){
  .builder-grid,.checkout-wrap{grid-template-columns:1fr;}
  .header-nav .nav-link span.nl-text{display:none;}
}
@media (max-width:640px){
  .search-bar{display:none;}
  .header-row{gap:12px;}
  .hero-title{font-size:26px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

/* ───────────────────────── icon helper ───────────────────────── */
function Icon({name, size=18, className=''}){
  const ref = React.useRef(null);
  useEffect(() => { if (ref.current && window.lucide) { ref.current.innerHTML=''; const el=document.createElement('i'); el.setAttribute('data-lucide', name); ref.current.appendChild(el); window.lucide.createIcons({nameAttr:'data-lucide', icons: undefined}); } }, [name]);
  return <span ref={ref} className={className} style={{display:'inline-flex', width:size, height:size, alignItems:'center', justifyContent:'center'}}></span>;
}

}

function QuickView({product, onClose, onStartOption}){
  if (!product) return null;
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer-head">
          <strong style={{fontSize:15, fontWeight:800}}>퀵뷰</strong>
          <button className="drawer-close" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        <div className="drawer-body">
          <div className="drawer-img"><img src={imgUrl(product.img, 600, 380)} alt={product.name} /></div>
          <h2 style={{fontSize:19, fontWeight:800, marginBottom:6}}>{product.name}</h2>
          <div style={{fontSize:13, color:'var(--n7)', marginBottom:16}}>{product.catLabel} · {product.meta}</div>
          {product.special && (
            <div className="banner" style={{marginBottom:16, padding:'12px 14px'}}>
              <span className="banner-icon" style={{width:30, height:30}}><Icon name="ruler" size={14} /></span>
              <div>
                <div className="banner-title" style={{fontSize:12.5}}>현장 실측이 필요한 상품입니다</div>
                <div className="banner-desc" style={{fontSize:12}}>재단 완료 후에는 환불이 제한됩니다</div>
              </div>
            </div>
          )}
          <div className="spec-row"><span>기준 가격</span><span>{won(product.price)} / ㎡</span></div>
          <div className="spec-row"><span>평점</span><span>★ {product.rating} (128건)</span></div>
          <div className="spec-row"><span>제작 기간</span><span>{product.special ? '실측 후 5~7일' : '3~4 영업일'}</span></div>
          <div className="spec-row"><span>배송</span><span>{product.special ? '별도 시공 배송비' : '무료배송'}</span></div>

/* ───────────────────────── option builder (5 steps) ───────────────────────── */
const STEPS = ['재질', '색상/패턴', '사이즈', '마감 가공', '시공 서비스'];

function OptionBuilder({baseProduct, onAddToCart}){
  const [step, setStep] = useState(0);
  const [material, setMaterial] = useState(null);
  const [color, setColor] = useState(null);
  const [size, setSize] = useState(null);
  const [finish, setFinish] = useState(null);
  const [install, setInstall] = useState(null);
  const [added, setAdded] = useState(false);

  const availableColors = material ? (COLORS_BY_MATERIAL[material.id] || []) : [];
  const availableMaterials = baseProduct && baseProduct.special ? MATERIALS : MATERIALS.filter(m => !m.fireOnly);

  useEffect(() => { setColor(null); }, [material]);

  const basePrice = baseProduct ? baseProduct.price : 28000;
  const total = basePrice
    + (material ? material.price : 0)
    + (finish ? finish.price : 0)
    + (install ? install.price : 0)
    + (size ? Math.round(size.w * size.h / 10000) * 1000 : 0);

  const canGoStep = (i) => {
    if (i===0) return true;
    if (i===1) return !!material;
    if (i===2) return !!color;
    if (i===3) return !!size;
    if (i===4) return !!finish;
    return false;
  };
  const allDone = material && color && size && finish && install;

  const handleAdd = () => {
    setAdded(true);
    onAddToCart({
      name: baseProduct ? baseProduct.name : '맞춤 필름 상품',
      img: baseProduct ? baseProduct.img : 'wood-film',
      price: total,
      opts: [material.name, `${size.w/100}m×${size.h/100}m`, finish.name, install.name],
    });
    setTimeout(() => setAdded(false), 2600);
  };

  return (
    <div className="builder-wrap">
      <h1 className="builder-title">5단계 맞춤 옵션 빌더</h1>
      <p className="builder-desc">{baseProduct ? baseProduct.name : '필름 상품'}에 적용할 재질부터 시공 서비스까지 순서대로 선택하면, 이전 단계에 맞는 옵션만 표시됩니다.</p>

      <div className="step-track">
        {STEPS.map((s, i) => (
          <div key={s} className={"step-node" + (i===step?' active':'') + (i<step?' done':'')}>
            <div className="step-dot">{i<step ? <Icon name="check" size={14} /> : i+1}</div>
            <div className="step-line"></div>
            <div className="step-label">{s}</div>
          </div>
        ))}
      </div>

      <div className="builder-grid">
        <div className="option-panel">
          {step===0 && (
            <div>
              <div className="panel-heading">재질을 선택하세요</div>
              <div className="panel-hint">방염 인증이 필요한 상품은 방염 소재만 선택 가능합니다</div>
              <div className="opt-grid">
                {availableMaterials.map(m => (
                  <button key={m.id} className={"opt-card" + (material && material.id===m.id?' selected':'')} onClick={() => setMaterial(m)}>
                    <div className="opt-swatch" style={{background:m.color}}></div>
                    <div className="opt-name">{m.name}</div>
                    <div className="opt-price">{m.price>0 ? '+' + won(m.price) : '기본 포함'}</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          {step===1 && (
            <div>
              <div className="panel-heading">색상/패턴을 선택하세요</div>
              <div className="panel-hint">{material ? material.name + '에서 지원하는 색상만 표시됩니다' : '먼저 재질을 선택해주세요'}</div>
              <div className="opt-grid">
                {availableColors.map(c => (
                  <button key={c.id} className={"opt-card" + (color && color.id===c.id?' selected':'')} onClick={() => setColor(c)}>
                    <div className="opt-swatch" style={{background:c.hex}}></div>
                    <div className="opt-name">{c.name}</div>
                    <div className="opt-price">추가 비용 없음</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          {step===2 && (
            <div>
              <div className="panel-heading">사이즈를 입력하세요</div>
              <div className="panel-hint">직접 입력하거나 자주 쓰는 사이즈를 선택할 수 있습니다</div>
              <div className="size-form">
                <div className="size-field">
                  <label>가로 (cm)</label>
                  <input type="number" placeholder="예: 200" value={size ? size.w : ''} onChange={e => setSize(s => ({w:Number(e.target.value)||0, h:(s?s.h:100)}))} />
                </div>
                <div className="size-field">
                  <label>세로 (cm)</label>
                  <input type="number" placeholder="예: 150" value={size ? size.h : ''} onChange={e => setSize(s => ({w:(s?s.w:100), h:Number(e.target.value)||0}))} />
                </div>
              </div>
              <div className="size-preset-row">
                {SIZE_PRESETS.map(sp => (
                  <button key={sp.id} className={"size-preset" + (size && size.w===sp.w && size.h===sp.h?' selected':'')} onClick={() => setSize({w:sp.w, h:sp.h})}>{sp.label}</button>
                ))}
              </div>
            </div>
          )}
          {step===3 && (
            <div>
              <div className="panel-heading">마감 가공을 선택하세요</div>
              <div className="panel-hint">표면 마감에 따라 시공 난이도와 내구성이 달라집니다</div>
              <div className="opt-grid">
                {FINISHES.map(f => (
                  <button key={f.id} className={"opt-card" + (finish && finish.id===f.id?' selected':'')} onClick={() => setFinish(f)}>
                    <div className="opt-swatch" style={{background:'linear-gradient(135deg, var(--n3), var(--n1))'}}></div>
                    <div className="opt-name">{f.name}</div>
                    <div className="opt-price">{f.price>0 ? '+' + won(f.price) : '기본 포함'}</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          {step===4 && (
            <div>
              <div className="panel-heading">시공 서비스를 선택하세요</div>
              <div className="panel-hint">모든 단계 선택이 끝나면 장바구니에 담을 수 있습니다</div>
              <div className="opt-grid" style={{gridTemplateColumns:'1fr'}}>
                {INSTALL.map(it => (
                  <button key={it.id} className={"opt-card" + (install && install.id===it.id?' selected':'')} style={{display:'flex', alignItems:'center', gap:14}} onClick={() => setInstall(it)}>
                    <Icon name={it.id==='self'?'package':it.id==='partial'?'hammer':'users'} size={22} />
                    <div style={{flex:1}}>
                      <div className="opt-name">{it.name}</div>
                      <div className="opt-price">{it.desc} · {it.price>0 ? '+' + won(it.price) : '무료'}</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          <div className="step-btn-row">
            {step>0 && <button className="btn btn-outline" onClick={() => setStep(s => s-1)}><Icon name="arrow-left" size={14} /> 이전</button>}
            {step<4 && <button className="btn btn-primary" disabled={!canGoStep(step+1)} onClick={() => setStep(s => Math.min(4, s+1))}>다음 단계 <Icon name="arrow-right" size={14} /></button>}
            {step===4 && <button className="btn btn-primary" disabled={!allDone} onClick={handleAdd}><Icon name="shopping-cart" size={15} /> 장바구니 담기</button>}
          </div>
        </div>

        <aside className="summary-panel">
          <div className="summary-title">선택 옵션 요약</div>
          <div className={"summary-row" + (!material?' empty':'')}><span>재질</span><span>{material ? material.name : '미선택'}</span></div>
          <div className={"summary-row" + (!color?' empty':'')}><span>색상/패턴</span><span>{color ? color.name : '미선택'}</span></div>
          <div className={"summary-row" + (!size?' empty':'')}><span>사이즈</span><span>{size ? `${size.w}×${size.h}cm` : '미선택'}</span></div>
          <div className={"summary-row" + (!finish?' empty':'')}><span>마감 가공</span><span>{finish ? finish.name : '미선택'}</span></div>
          <div className={"summary-row" + (!install?' empty':'')}><span>시공 서비스</span><span>{install ? install.name : '미선택'}</span></div>
          <div className="summary-total">
            <span className="summary-total-label">예상 금액</span>
            <span className="summary-total-price">{won(total)}</span>
          </div>
          {added && <div style={{marginTop:12, fontSize:12, color:'var(--s1-text)', display:'flex', alignItems:'center', gap:5}}><Icon name="check-circle-2" size={14} /> 장바구니에 담았습니다</div>}
        </aside>
      </div>
    </div>
  );
}

/* ───────────────────────── special order ───────────────────────── */
function SpecialOrder({setScreen}){
  const [form, setForm] = useState({addr:'', date:'', memo:''});
  const [status, setStatus] = useState('pending');
  const [showConfirm, setShowConfirm] = useState(false);

  const submit = () => setShowConfirm(true);
  const confirmSubmit = () => { setShowConfirm(false); setStatus('submitted'); };

  return (
    <div className="special-wrap">
      <h1 className="builder-title">특수 필름 주문 예외 처리</h1>
      <p className="builder-desc">현장 실측 재단이 필요한 특수 필름 상품은 일반 주문과 다른 흐름으로 처리됩니다.</p>

      <div className="banner">
        <span className="banner-icon"><Icon name="alert-triangle" size={18} /></span>
        <div>
          <div className="banner-title">현재 상품: 방염 인증 벽면필름 — 현장 실측 필요</div>
          <div className="banner-desc">결제 전 실측 요청이 접수되어야 하며, 재단 완료 후에는 환불이 제한됩니다. 배송비는 시공 지역에 따라 별도 산정됩니다.</div>
        </div>
      </div>

      <table className="compare-table">
        <thead>
          <tr><th>구분</th><th>일반 상품</th><th>특수 재단 상품</th></tr>
        </thead>
        <tbody>
          <tr><td>주문 흐름</td><td>바로 결제 가능</td><td>실측 요청 → 승인 → 결제</td></tr>
          <tr><td>배송비</td><td>무료배송</td><td>시공 지역별 별도 산정</td></tr>
          <tr><td>환불 가능 여부</td><td><span className="pill-tag ok"><Icon name="check" size={11} />가능</span></td><td><span className="pill-tag no"><Icon name="x" size={11} />재단 후 제한</span></td></tr>
          <tr><td>제작 기간</td><td>3~4 영업일</td><td>실측 후 5~7 영업일</td></tr>
        </tbody>
      </table>

      <div className="form-card">
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18}}>
          <strong style={{fontSize:15, fontWeight:800}}>실측 요청 접수</strong>
          <span className={"status-badge " + status}>
            {status==='pending' ? <><Icon name="clock" size={12} /> 접수 대기</> : <><Icon name="check-circle-2" size={12} /> 접수 완료</>}
          </span>
        </div>
        <div className="form-row">
          <label>실측 희망 주소</label>
          <input placeholder="예: 서울시 마포구 ○○로 12" value={form.addr} onChange={e => setForm(f => ({...f, addr:e.target.value}))} />
        </div>
        <div className="form-grid-2">
          <div className="form-row">
            <label>희망 방문일</label>
            <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date:e.target.value}))} />
          </div>
          <div className="form-row">
            <label>방문 가능 시간대</label>
            <select>
              <option>오전 (09:00~12:00)</option>
              <option>오후 (13:00~17:00)</option>
              <option>저녁 (17:00~19:00)</option>
            </select>
          </div>
        </div>
        <div className="form-row">
          <label>특이사항 (현장 조건, 접근 안내 등)</label>
          <textarea placeholder="예: 3층이며 엘리베이터 없음, 주차는 건물 뒤편 가능" value={form.memo} onChange={e => setForm(f => ({...f, memo:e.target.value}))}></textarea>
        </div>
        <button className="btn btn-primary btn-block" disabled={status==='submitted'} onClick={submit}>
          <Icon name="send" size={15} /> {status==='submitted' ? '실측 요청이 접수되었습니다' : '실측 요청 제출'}
        </button>
      </div>

      {showConfirm && (
        <div className="modal-overlay" onClick={() => setShowConfirm(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-icon"><Icon name="ruler" size={22} /></div>
            <div className="modal-title">실측 요청을 제출할까요?</div>
            <div className="modal-desc">제출 후에는 담당 기사님이 입력하신 주소와 일정으로 방문 연락을 드립니다. 실측 완료 후 재단이 시작되면 환불이 제한됩니다.</div>
            <div className="modal-actions">
              <button className="btn btn-outline btn-block" onClick={() => setShowConfirm(false)}>취소</button>
              <button className="btn btn-primary btn-block" onClick={confirmSubmit}>제출하기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────────── checkout ───────────────────────── */
function Checkout({cart, setCart}){
  const [payMethod, setPayMethod] = useState('card');
  const [paying, setPaying] = useState(false);
  const [done, setDone] = useState(false);
  const [orderNo, setOrderNo] = useState(null);

  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const removeItem = (id) => setCart(cs => cs.filter(c => c.id !== id));

  const pay = () => {
    setPaying(true);
    setTimeout(() => {
      setPaying(false);
      setDone(true);
      setOrderNo('FS-' + Math.floor(100000 + Math.random()*899999));
    }, 1400);
  };

  return (
    <div className="checkout-wrap">
      <div>
        <h1 className="builder-title">실시간 견적 장바구니 및 결제</h1>
        <div className="mini-stepper">
          <span className={"msp" + (!done?' current':'')}><Icon name="shopping-cart" size={12} />주문접수</span>
          <span className="msp-arrow">→</span>
          <span className={"msp" + (done?' current':'')}><Icon name="credit-card" size={12} />결제완료</span>
          <span className="msp-arrow">→</span>
          <span className="msp"><Icon name="truck" size={12} />배송준비</span>
        </div>

        {cart.length===0 && <div style={{padding:40, textAlign:'center', color:'var(--n6)', fontSize:13.5}}>장바구니가 비어 있습니다. 옵션 빌더에서 상품을 담아보세요.</div>}
        {cart.map(item => (
          <div className="cart-item" key={item.id}>
            <div className="cart-item-img"><img src={imgUrl(item.img, 200, 200)} alt={item.name} /></div>
            <div className="cart-item-info">
              <div className="cart-item-name">{item.name} <span style={{color:'var(--n6)', fontWeight:500}}>× {item.qty}</span></div>
              <div className="cart-chip-row">{item.opts.map((o,i) => <span key={i} className="cart-chip">{o}</span>)}</div>
              <div className="cart-item-price">{won(item.price * item.qty)}</div>
            </div>
            <button className="cart-item-remove" onClick={() => removeItem(item.id)}><Icon name="trash-2" size={16} /></button>
          </div>
        ))}

        <div className="checkout-form-card">
          <strong style={{fontSize:14.5, fontWeight:800, display:'block', marginBottom:16}}>배송지 및 시공 일정</strong>
          <div className="form-row"><label>배송지 주소</label><input placeholder="예: 경기도 성남시 분당구 ○○로 45" /></div>
          <div className="form-grid-2">
            <div className="form-row"><label>희망 시공일</label><input type="date" /></div>
            <div className="form-row"><label>연락처</label><input placeholder="010-0000-0000" /></div>
          </div>
        </div>

        <div className="checkout-form-card">
          <strong style={{fontSize:14.5, fontWeight:800, display:'block', marginBottom:14}}>결제 수단</strong>
          <div className="pay-method-row">
            {[{id:'card', label:'신용/체크카드', icon:'credit-card'}, {id:'transfer', label:'무통장입금', icon:'landmark'}, {id:'easy', label:'포트원 간편결제', icon:'smartphone'}].map(pm => (
              <button key={pm.id} className={"pay-method" + (payMethod===pm.id?' selected':'')} onClick={() => setPayMethod(pm.id)}>
                <Icon name={pm.icon} size={18} /><div style={{marginTop:6}}>{pm.label}</div>
              </button>
            ))}
          </div>
        </div>
      </div>

      <aside className="order-summary">
        <div className="summary-title">결제 금액</div>
        <div className="summary-row"><span>상품 합계</span><span>{won(total)}</span></div>
        <div className="summary-row"><span>배송/시공비</span><span>옵션에 포함</span></div>
        <div className="summary-total">
          <span className="summary-total-label">총 결제 금액</span>
          <span className="summary-total-price">{won(total)}</span>
        </div>
        <button className="btn btn-primary btn-block" style={{marginTop:20}} disabled={cart.length===0 || done} onClick={pay}>
          <Icon name="lock" size={14} /> {done ? '결제 완료' : '결제하기'}
        </button>
      </aside>

      {paying && (
        <div className="modal-overlay">
          <div className="modal-box" style={{textAlign:'center'}}>
            <div style={{display:'flex', justifyContent:'center', marginBottom:16}}><div className="spinner"></div></div>
            <div className="modal-title">결제 진행 중...</div>
            <div className="modal-desc">옵션 스냅샷과 결제 상태를 확인하고 있습니다. 잠시만 기다려주세요.</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────────── toast ───────────────────────── */
function Toast({msg, onDone}){
  useEffect(() => { const t = setTimeout(onDone, 2600); return () => clearTimeout(t); }, []);
  return <div className="toast"><Icon name="check-circle-2" size={16} className="ti" />{msg}</div>;
}

/* ───────────────────────── app ───────────────────────── */
function App(){
  const [screen, setScreen] = useState('main');
  const [quickView, setQuickView] = useState(null);
  const [cart, setCart] = useState(CART_SEED);
  const [cartDrawer, setCartDrawer] = useState(false);
  const [orderDone, setOrderDone] = useState(false);
  const [toast, setToast] = useState(null);
  const [builderProduct, setBuilderProduct] = useState(null);

  const addToCart = (item) => {
    setCart(cs => [...cs, {...item, id: 'c' + (cs.length+1) + '-' + Date.now()}]);
    setToast('장바구니에 담았습니다');
  };

  const startOption = (product) => { setBuilderProduct(product); setQuickView(null); setScreen('option-builder'); };

  return (
    <div className="app" data-archetype="airbnb-search-grid">
      <Header screen={screen} setScreen={setScreen} cartCount={cart.length} openCart={() => setScreen('checkout')} />

      {screen==='main' && <MainScreen onOpenQuickView={setQuickView} />}
      {screen==='option-builder' && <OptionBuilder baseProduct={builderProduct} onAddToCart={addToCart} />}
      {screen==='special-order' && <SpecialOrder setScreen={setScreen} />}
      {screen==='checkout' && <Checkout cart={cart} setCart={setCart} />}

      {quickView && <QuickView product={quickView} onClose={() => setQuickView(null)} onStartOption={startOption} />}
      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}

      <footer className="footer">
        <div className="footer-cols">
          <div>
            <div className="brand"><span className="brand-mark"><Icon name="layers" size={16} /></span>필름스튜디오</div>
            <p className="footer-brand-desc">맞춤 제작 인테리어·자동차·가구 필름을 5단계 옵션으로 주문하는 데모 쇼핑몰입니다.</p>
          </div>
          <div className="footer-col">
            <h4>쇼핑</h4>
            <a onClick={() => setScreen('main')}>전체 상품</a>
            <a onClick={() => setScreen('option-builder')}>맞춤 옵션 빌더</a>
            <a onClick={() => setScreen('special-order')}>특수 상품 안내</a>
          </div>
          <div className="footer-col">
            <h4>고객지원</h4>
            <a>자주 묻는 질문</a>
            <a>실측 서비스 안내</a>
            <a>교환/환불 정책</a>
          </div>
          <div className="footer-col">
            <h4>회사</h4>
            <a>소개</a>
            <a>이용약관</a>
            <a>개인정보처리방침</a>
          </div>
        </div>
        <div className="footer-note">© 2026 필름스튜디오 — 자체 개발 데모 프로젝트</div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
