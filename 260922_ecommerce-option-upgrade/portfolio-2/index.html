<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특수상품 쇼핑몰 통합 운영·정산 관리 시스템</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (hue 22°, light) ── */
:root{
  --m50:#fff4ed; --m100:#fee8db; --m200:#fed2b8; --m300:#fdb68c; --m400:#fc975c;
  --m500:#fb7a2e; --m600:#fa5d00; --m700:#cd4c00; --m800:#a03c00; --m900:#712a00;
  --n0:#fff8f1; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#615f5c; --n9:#3a3836; --n10:#1d1e1c;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased;}
#root{width:100%;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4);border-radius:8px;}

/* ── shell ── */
.shell{display:flex;width:100%;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:30;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;}
.sb-brand-mark{width:34px;height:34px;border-radius:11px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sb-brand-text{font-size:15.5px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;}
.sb-brand-text small{display:block;font-size:10.5px;font-weight:600;color:var(--n6);}

.workspace-switch{margin:0 16px 18px;padding:11px 13px;border:1.5px solid var(--n3);border-radius:14px;background:var(--n0);}
.ws-label{font-size:10px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.ws-value{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ws-name{font-size:13px;font-weight:700;color:var(--n9);}
.ws-menu{margin-top:8px;border-top:1px dashed var(--n3);padding-top:8px;display:none;}
.ws-menu.open{display:block;}
.ws-item{padding:8px 6px;border-radius:9px;font-size:12.5px;color:var(--n7);display:flex;align-items:center;gap:7px;}
.ws-item:hover{background:var(--n2);color:var(--n10);}
.ws-item.active{color:var(--m700);font-weight:700;}

.sb-nav{flex:1;padding:4px 12px;overflow-y:auto;}
.sb-section{font-size:10px;font-weight:700;color:var(--n6);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--n7);margin-bottom:2px;transition:background .15s,color .15s;}
.sb-link:hover{background:var(--n2);color:var(--n10);}
.sb-link.active{background:var(--m100);color:var(--m800);}
.sb-link .count{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--n3);color:var(--n7);padding:2px 7px;border-radius:9999px;}
.sb-link.active .count{background:var(--m600);color:#fff;}

.sb-foot{padding:16px;border-top:1px solid var(--n3);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sb-user-name{font-size:12.5px;font-weight:700;}
.sb-user-role{font-size:11px;color:var(--n6);}

.main-wrap{margin-left:248px;flex:1;min-width:0;width:calc(100% - 248px);display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:64px;flex-shrink:0;background:var(--n0);border-bottom:1px solid var(--n3);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;}
.topbar-title{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
.topbar-sub{font-size:12px;color:var(--n6);margin-top:1px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--n7);background:var(--n1);border:1px solid var(--n3);}
.icon-btn:hover{background:var(--n2);}

.content{flex:1;padding:26px 28px 60px;}

.btn{padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,background .15s,box-shadow .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--m600);color:#fff;box-shadow:0 4px 12px rgba(250,93,0,.24);}
.btn-primary:hover{background:var(--m700);}
.btn-primary:disabled{background:var(--n4);color:var(--n7);box-shadow:none;cursor:not-allowed;}
.btn-outline{background:var(--n1);color:var(--n9);border:1.5px solid var(--n3);}
.btn-outline:hover{border-color:var(--n6);}
.btn-ghost{background:var(--n2);color:var(--n8);}
.btn-ghost:hover{background:var(--n3);}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;justify-content:center;}
.btn-danger-outline{background:var(--n1);color:var(--s2-text);border:1.5px solid var(--s2-bg);}

/* ── ops hero (gradient + procedural svg) ── */
.ops-hero{position:relative;overflow:hidden;background:linear-gradient(135deg, var(--m600), var(--m800));border-radius:22px;padding:26px 30px;color:#fff;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.ops-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.14) 48%, transparent 62%);background-size:240px 100%;background-repeat:no-repeat;animation:shimmer 3.2s linear infinite;pointer-events:none;}
.ops-hero-svg{position:absolute;right:0;top:0;height:100%;width:46%;opacity:.5;}
.ops-hero-label{font-size:12.5px;font-weight:700;opacity:.85;letter-spacing:.02em;margin-bottom:8px;}
.ops-hero-num{font-size:38px;font-weight:800;letter-spacing:-0.02em;}
.ops-hero-num span{font-size:16px;font-weight:600;margin-left:4px;opacity:.85;}
.ops-hero-sub{font-size:12.5px;opacity:.85;margin-top:8px;}
.ops-hero-stats{display:flex;gap:26px;position:relative;z-index:1;}
.ops-hero-stat-label{font-size:11px;opacity:.8;margin-bottom:4px;}
.ops-hero-stat-val{font-size:19px;font-weight:800;}
.ops-hero-ring{width:64px;height:64px;flex-shrink:0;position:relative;z-index:1;}

/* ── kanban ── */
.kanban-layout{display:grid;grid-template-columns:1fr 296px;gap:22px;align-items:start;}
.board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.board-title{font-size:19px;font-weight:800;}
.board-filter-row{display:flex;gap:8px;}
.board-chip{padding:7px 13px;border-radius:9999px;border:1.5px solid var(--n3);font-size:12px;font-weight:600;color:var(--n7);}
.board-chip.active{background:var(--n10);color:#fff;border-color:var(--n10);}

.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:14px;}
.column{width:252px;flex-shrink:0;background:var(--n2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px;transition:background .15s;}
.column.drag-over{background:var(--m100);}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px;}
.col-header-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--n8);}
.col-dot{width:7px;height:7px;border-radius:50%;}
.count{font-size:11px;font-weight:700;background:var(--n1);color:var(--n7);padding:2px 8px;border-radius:9999px;}

.card{background:var(--n1);border-radius:13px;padding:13px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab;transition:transform .15s,box-shadow .15s;animation:cardIn .4s both;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.09);}
.card.dragging{opacity:.4;}
.card-title{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.35;}
.card-meta{display:flex;align-items:center;justify-content:space-between;}
.card-meta-left{display:flex;gap:6px;align-items:center;}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:9999px;background:var(--n2);color:var(--n7);}
.tag.special{background:var(--m100);color:var(--m800);}
.card-avatar{width:22px;height:22px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.card-date{font-size:10.5px;color:var(--n6);margin-top:8px;}

.matrix-panel{background:var(--n1);border-radius:18px;padding:20px;position:sticky;top:88px;border:1px solid var(--n3);}
.matrix-title{font-size:13.5px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:7px;}
.matrix-row{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
.matrix-label{width:76px;font-size:11.5px;color:var(--n7);font-weight:600;flex-shrink:0;}
.matrix-bar-track{flex:1;height:8px;background:var(--n2);border-radius:9999px;overflow:hidden;}
.matrix-bar-fill{height:100%;border-radius:9999px;background:var(--m500);}
.matrix-val{width:26px;text-align:right;font-size:11.5px;font-weight:700;flex-shrink:0;}
.matrix-divider{height:1px;background:var(--n3);margin:16px 0;}
.filter-check-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--n8);}
.filter-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--n4);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.filter-check.checked{background:var(--m600);border-color:var(--m600);color:#fff;}

/* ── option schema screen ── */
.schema-layout{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start;}
.schema-tree{background:var(--n1);border-radius:18px;padding:22px;border:1px solid var(--n3);}
.tree-group{border:1px solid var(--n3);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.tree-group-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--n2);}
.tree-group-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;}
.tree-step-num{width:22px;height:22px;border-radius:50%;background:var(--m600);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.tree-items{padding:8px 14px;}
.tree-item{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--n3);font-size:12.5px;}
.tree-item:last-child{border-bottom:none;}
.tree-item-name{font-weight:600;}
.tree-item-price{color:var(--n6);margin-right:10px;}
.tree-item-actions{display:flex;gap:4px;}
.tree-item-actions button{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n6);}
.tree-item-actions button:hover{background:var(--n2);color:var(--n9);}
.tree-add-row{padding:10px 14px;}

.preview-panel{background:var(--n1);border-radius:18px;padding:20px;border:1px solid var(--n3);position:sticky;top:88px;}
.preview-title{font-size:13px;font-weight:800;margin-bottom:4px;}
.preview-hint{font-size:11.5px;color:var(--n6);margin-bottom:14px;}
.preview-frame{border:1.5px dashed var(--n4);border-radius:14px;padding:16px;background:var(--n0);}
.preview-swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.preview-swatch{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--n3);}

.price-table{width:100%;border-collapse:collapse;margin-top:16px;}
.price-table th,.price-table td{padding:10px 12px;font-size:12.5px;text-align:left;border-bottom:1px solid var(--n2);}
.price-table th{color:var(--n6);font-weight:700;font-size:11px;}

/* ── settlement screen ── */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:14px 16px;}
.filter-bar select,.filter-bar input{padding:9px 12px;border:1.5px solid var(--n3);border-radius:10px;font-size:12.5px;}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
.kpi-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px 20px;}
.kpi-label{font-size:12px;color:var(--n6);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.kpi-value{font-size:23px;font-weight:800;}
.kpi-delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.kpi-delta.up{color:var(--s1-text);}
.kpi-delta.down{color:var(--s2-text);}

.data-table-wrap{background:var(--n1);border:1px solid var(--n3);border-radius:18px;overflow:hidden;}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{background:var(--n2);padding:12px 16px;text-align:left;font-size:11.5px;font-weight:700;color:var(--n7);}
.data-table td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--n2);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--n0);}
.badge{padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
.badge.paid{background:var(--s1-bg);color:var(--s1-text);}
.badge.wait{background:var(--n2);color:var(--n7);}

/* ── legacy sync screen ── */
.sync-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.queue-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s;}
.queue-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.06);}
.queue-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.queue-id{font-size:12px;font-weight:700;color:var(--n6);}
.queue-title{font-size:13.5px;font-weight:700;margin-bottom:6px;}
.queue-reason{font-size:12px;color:var(--s2-text);background:var(--s2-bg);padding:7px 10px;border-radius:9px;}

.refund-card{background:var(--n1);border:1px solid var(--n3);border-radius:18px;padding:20px;}
.refund-item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--n3);font-size:12.5px;}
.refund-item-row:last-child{border-bottom:none;}
.refund-item-row input[type=checkbox]{width:16px;height:16px;}
.refund-total{margin-top:14px;padding-top:14px;border-top:1.5px solid var(--n3);display:flex;justify-content:space-between;align-items:baseline;}
.refund-total-val{font-size:20px;font-weight:800;color:var(--m700);}

/* ── modal/toast ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s;}
.modal-box{background:var(--n1);border-radius:20px;width:min(460px,100%);padding:26px;animation:fadeInScale .22s cubic-bezier(.16,1,.3,1);max-height:86vh;overflow-y:auto;}
.modal-title{font-size:16.5px;font-weight:800;margin-bottom:8px;}
.modal-desc{font-size:13px;color:var(--n7);line-height:1.55;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;font-size:12px;font-weight:700;color:var(--n7);margin-bottom:5px;}
.modal-field input,.modal-field select{width:100%;padding:10px 12px;border:1.5px solid var(--n3);border-radius:10px;font-size:13px;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--n10);color:#fff;padding:14px 22px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:100;animation:slideUp .3s cubic-bezier(.16,1,.3,1);box-shadow:0 12px 30px rgba(0,0,0,.25);}
.toast .ti{color:var(--m400);}

.spinner{width:30px;height:30px;border:3px solid var(--n3);border-top-color:var(--m600);border-radius:50%;animation:spin .8s linear infinite;}

/* ── animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barGrow{from{width:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}

@media (max-width:960px){
  .kanban-layout,.schema-layout,.sync-layout{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

function won(n){ return n.toLocaleString('ko-KR') + '원'; }
function Ic({name, size=17, weight='regular', style}){
  return <i className={`ph${weight==='fill'?'-fill':''} ph-${name}`} style={{fontSize:size, ...style}}></i>;
}

/* ───────────────────────── mock data ───────────────────────── */
const WORKSPACES = [
  {id:'internal', name:'내부 운영팀', role:'전체 관리'},
  {id:'v1', name:'인테리어필름코리아', role:'입점사'},
  {id:'v2', name:'카젠 랩핑스튜디오', role:'입점사'},
];

const COLUMNS = [
  {id:'received', name:'접수', dot:'var(--n5)'},
  {id:'verify', name:'검증', dot:'var(--n6)'},
  {id:'cut', name:'재단·제작', dot:'var(--m500)'},
  {id:'ready', name:'배송준비', dot:'var(--m600)'},
  {id:'shipping', name:'배송중', dot:'var(--m700)'},
  {id:'done', name:'완료', dot:'var(--s1)'},
];
const FLOW_ORDER = COLUMNS.map(c => c.id);

const SEED_ORDERS = [
  {id:'ORD-2201', title:'스칸딕 우드그레인 필름 4㎡', ws:'v1', special:false, owner:'김민수', due:'09.24', col:'received'},
  {id:'ORD-2202', title:'방염 인증 벽면필름 실측 대기', ws:'internal', special:true, owner:'이지은', due:'09.25', col:'received'},
  {id:'ORD-2203', title:'매트 차콜 랩핑시트 전체시공', ws:'v2', special:false, owner:'박서준', due:'09.23', col:'verify'},
  {id:'ORD-2204', title:'클래식 마블 대리석필름 2㎡', ws:'v1', special:false, owner:'정하늘', due:'09.24', col:'verify'},
  {id:'ORD-2205', title:'홀로그램 펄 디자인시트 재단', ws:'internal', special:true, owner:'최유진', due:'09.26', col:'cut'},
  {id:'ORD-2206', title:'브러시드 메탈 랩핑 부분시공', ws:'v2', special:false, owner:'한도윤', due:'09.22', col:'cut'},

/* ───────────────────────── main: kanban ───────────────────────── */
function KanbanMain({orders, setOrders, ws}){
  const [dragId, setDragId] = useState(null);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [toast, setToast] = useState(null);
  const [wsFilterOn, setWsFilterOn] = useState(true);

  const visible = wsFilterOn && ws!=='internal' ? orders.filter(o => o.ws===ws) : orders;

  const allowedNext = (colId) => {
    const idx = FLOW_ORDER.indexOf(colId);
    return [FLOW_ORDER[idx-1], FLOW_ORDER[idx], FLOW_ORDER[idx+1]].filter(Boolean);
  };

  const handleDrop = (targetCol) => {
    setDragOverCol(null);
    if (!dragId) return;
    const order = orders.find(o => o.id===dragId);
    if (!order) return;
    if (!allowedNext(order.col).includes(targetCol)) {
      setToast('허용되지 않은 상태 전이입니다 — 단계를 건너뛸 수 없습니다');
      setDragId(null);
      return;
    }
    setOrders(os => os.map(o => o.id===dragId ? {...o, col: targetCol} : o));
    setDragId(null);
    setToast(`${order.id} 상태가 변경되었습니다`);
  };

  const matrixData = COLUMNS.map(c => ({...c, cnt: visible.filter(o => o.col===c.id).length}));
  const maxCnt = Math.max(1, ...matrixData.map(m => m.cnt));

  const doneCount = visible.filter(o => o.col==='done').length;
  const completionRate = Math.round((doneCount / Math.max(1, visible.length)) * 100);
  const ringR = 26, ringC = 2 * Math.PI * ringR;

  return (
    <div className="kanban-layout">
      <div>
        <div className="ops-hero">
          <svg className="ops-hero-svg" viewBox="0 0 300 160" preserveAspectRatio="none">
            <path d="M0,120 C60,80 120,150 180,90 C220,50 260,100 300,60" fill="none" stroke="#ffffff" strokeOpacity="0.35" strokeWidth="3" />
            <path d="M0,150 C70,110 140,170 210,110 C250,80 280,120 300,95" fill="none" stroke="#ffffff" strokeOpacity="0.2" strokeWidth="2" />
            <circle cx="250" cy="40" r="34" fill="#ffffff" opacity="0.10" />
            <circle cx="270" cy="90" r="14" fill="#ffffff" opacity="0.14" />
          </svg>
          <div>
            <div className="ops-hero-label">이번 달 주문 처리 현황</div>
            <div className="ops-hero-num">{visible.length}<span>건 진행 중</span></div>
            <div className="ops-hero-sub">현재 워크스페이스 기준 실시간 칸반 집계</div>
          </div>
          <div className="ops-hero-stats">
            <div>
              <div className="ops-hero-stat-label">완료</div>
              <div className="ops-hero-stat-val">{doneCount}건</div>
            </div>
            <div>
              <div className="ops-hero-stat-label">특수재단</div>
              <div className="ops-hero-stat-val">{visible.filter(o => o.special).length}건</div>
            </div>
            <svg className="ops-hero-ring" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r={ringR} fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="6" />
              <circle cx="32" cy="32" r={ringR} fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                strokeDasharray={ringC} strokeDashoffset={ringC - (ringC * completionRate / 100)}
                transform="rotate(-90 32 32)" style={{transition:'stroke-dashoffset .6s ease-out'}} />
              <text x="32" y="37" textAnchor="middle" fontSize="13" fontWeight="800" fill="#ffffff">{completionRate}%</text>
            </svg>
          </div>
        </div>
        <div className="board-header">
          <div>
            <div className="board-title">주문 처리 칸반</div>
            <div style={{fontSize:12, color:'var(--n6)', marginTop:2}}>드래그로 카드를 옮기면 허용된 단계로만 이동합니다</div>
          </div>
          <div className="board-filter-row">
            <button className={"board-chip" + (wsFilterOn?' active':'')} onClick={() => setWsFilterOn(v => !v)}>
              <Ic name="funnel" size={12} /> 현재 워크스페이스만
            </button>
          </div>
        </div>

        <div className="board">
          {COLUMNS.map(col => {
            const cards = visible.filter(o => o.col===col.id);
            return (
              <section key={col.id} className={"column" + (dragOverCol===col.id?' drag-over':'')}
                onDragOver={e => { e.preventDefault(); setDragOverCol(col.id); }}
                onDragLeave={() => setDragOverCol(c => c===col.id ? null : c)}
                onDrop={() => handleDrop(col.id)}>
                <div className="col-header">
                  <div className="col-header-label"><span className="col-dot" style={{background:col.dot}}></span>{col.name}</div>
                  <span className="count">{cards.length}</span>
                </div>
                {cards.map(card => (
                  <div key={card.id} className="card" draggable
                    onDragStart={() => setDragId(card.id)}
                    onDragEnd={() => setDragId(null)}>
                    <div className="card-title">{card.title}</div>
                    <div className="card-meta">
                      <div className="card-meta-left">
                        <span className={"tag" + (card.special?' special':'')}>{card.special ? '특수재단' : '일반'}</span>
                      </div>
                      <span className="card-avatar">{card.owner.charAt(0)}</span>
                    </div>
                    <div className="card-date"><Ic name="calendar-blank" size={11} /> {card.due} 마감 · {card.id}</div>
                  </div>
                ))}
                {cards.length===0 && <div style={{fontSize:11.5, color:'var(--n5)', textAlign:'center', padding:'14px 0'}}>비어 있음</div>}
              </section>
            );
          })}
        </div>
      </div>

      <aside className="matrix-panel">
        <div className="matrix-title"><Ic name="gauge" size={16} /> 단계별 정체 매트릭스</div>
        {matrixData.map(m => (
          <div className="matrix-row" key={m.id}>
            <span className="matrix-label">{m.name}</span>
            <div className="matrix-bar-track"><div className="matrix-bar-fill" style={{width:(m.cnt/maxCnt*100)+'%', background:m.dot, animation:'barGrow .6s ease-out'}}></div></div>
            <span className="matrix-val">{m.cnt}</span>
          </div>
        ))}
        <div className="matrix-divider"></div>
        <div className="matrix-title" style={{fontSize:12.5}}><Ic name="storefront" size={15} /> 워크스페이스 필터</div>
        {WORKSPACES.map(w => (
          <div className="filter-check-row" key={w.id}>
            <span className={"filter-check" + (w.id===ws?' checked':'')}>{w.id===ws && <Ic name="check" size={11} />}</span>
            {w.name}
          </div>
        ))}
      </aside>

      {toast && <ToastEl msg={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

function ToastEl({msg, onDone}){
  useEffect(() => { const t = setTimeout(onDone, 2600); return () => clearTimeout(t); }, []);
  return <div className="toast"><Ic name="check-circle" weight="fill" size={16} className="ti" />{msg}</div>;
}

/* ───────────────────────── option schema management ───────────────────────── */
function OptionSchema(){
  const [steps, setSteps] = useState(SCHEMA_STEPS);
  const [confirmDel, setConfirmDel] = useState(null);
  const [previewMat, setPreviewMat] = useState('PVC 시트');
  const [newRule, setNewRule] = useState({combo:'', price:''});
  const [ruleError, setRuleError] = useState('');
  const [rules, setRules] = useState([
    {combo:'방염 인증 소재 + 3m×2m', price:33000},
    {combo:'메탈 라미네이트 + 유광', price:15000},
  ]);
  const [saveToast, setSaveToast] = useState(null);
  const [addTarget, setAddTarget] = useState(null);
  const [addForm, setAddForm] = useState({name:'', price:''});

  const removeItem = (stepId, itemName) => setConfirmDel({stepId, itemName});
  const confirmRemove = () => {
    setSteps(ss => ss.map(s => s.id===confirmDel.stepId ? {...s, items: s.items.filter(i => i.name !== confirmDel.itemName)} : s));
    setConfirmDel(null);
  };
  const saveChanges = () => { setSaveToast('옵션 트리 변경사항이 저장되었습니다'); };
  const confirmAddItem = () => {
    if (!addForm.name.trim()) return;
    setSteps(ss => ss.map(s => s.id===addTarget ? {...s, items:[...s.items, {name:addForm.name, price:Number(addForm.price)||0}]} : s));
    setAddForm({name:'', price:''});
    setAddTarget(null);
  };

  const addRule = () => {
    if (!newRule.combo.trim()) { setRuleError('조합을 입력해주세요'); return; }
    const price = Number(newRule.price);
    if (!price || price < 0) { setRuleError('추가 가격은 0보다 큰 숫자여야 합니다'); return; }
    if (rules.some(r => r.combo === newRule.combo)) { setRuleError('이미 등록된 조합입니다'); return; }
    setRules(rs => [...rs, {combo:newRule.combo, price}]);
    setNewRule({combo:'', price:''});
    setRuleError('');
  };

  return (
    <div className="schema-layout">
      <div className="schema-tree">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
          <strong style={{fontSize:15, fontWeight:800}}>옵션 트리 편집기</strong>
          <button className="btn btn-outline btn-sm" onClick={saveChanges}><Ic name="floppy-disk" size={13} /> 변경사항 저장</button>
        </div>
        {steps.map(step => (
          <div className="tree-group" key={step.id}>
            <div className="tree-group-head">
              <div className="tree-group-title"><span className="tree-step-num">{step.id}</span>{step.name}</div>
              <span style={{fontSize:11, color:'var(--n6)'}}>{step.items.length}개 항목</span>
            </div>
            <div className="tree-items">
              {step.items.map(item => (
                <div className="tree-item" key={item.name}>
                  <span className="tree-item-name">{item.name}</span>
                  <div style={{display:'flex', alignItems:'center'}}>
                    <span className="tree-item-price">{item.price>0 ? '+'+won(item.price) : '기본'}</span>
                    <div className="tree-item-actions">
                      <button onClick={() => setPreviewMat(item.name)}><Ic name="eye" size={14} /></button>
                      <button onClick={() => removeItem(step.id, item.name)}><Ic name="trash" size={14} /></button>
                    </div>
                  </div>
                </div>
              ))}
              {step.items.length===0 && <div style={{padding:'10px 4px', fontSize:12, color:'var(--n5)'}}>항목 없음</div>}
            </div>
            <div className="tree-add-row">
              <button className="btn btn-ghost btn-sm" onClick={() => setAddTarget(step.id)}><Ic name="plus" size={13} /> 항목 추가</button>
            </div>
          </div>
        ))}

        <div style={{marginTop:6}}>
          <strong style={{fontSize:13.5, fontWeight:800}}>조합별 추가 가격표</strong>
          <table className="price-table">
            <thead><tr><th>옵션 조합</th><th>추가 가격</th></tr></thead>
            <tbody>
              {rules.map((r,i) => <tr key={i}><td>{r.combo}</td><td>{won(r.price)}</td></tr>)}
            </tbody>
          </table>
          <div style={{display:'flex', gap:8, marginTop:10}}>
            <input placeholder="예: 방염 인증 소재 + 엠보싱" value={newRule.combo} onChange={e => setNewRule(r => ({...r, combo:e.target.value}))}
              style={{flex:1, padding:'9px 11px', border:'1.5px solid var(--n3)', borderRadius:9, fontSize:12.5}} />
            <input placeholder="가격" value={newRule.price} onChange={e => setNewRule(r => ({...r, price:e.target.value}))}
              style={{width:100, padding:'9px 11px', border:'1.5px solid var(--n3)', borderRadius:9, fontSize:12.5}} />
            <button className="btn btn-primary btn-sm" onClick={addRule}>추가</button>
          </div>
          {ruleError && <div style={{fontSize:11.5, color:'var(--s2-text)', marginTop:7}}><Ic name="warning-circle" size={12} /> {ruleError}</div>}
        </div>
      </div>

      <aside className="preview-panel">
        <div className="preview-title">소비자 화면 미리보기</div>
        <div className="preview-hint">선택한 항목이 실제 쇼핑몰에서 어떻게 보이는지 확인합니다</div>
        <div className="preview-frame">
          <div style={{fontSize:12, color:'var(--n6)', marginBottom:8}}>선택된 재질</div>
          <div style={{fontSize:14.5, fontWeight:800, marginBottom:12}}>{previewMat}</div>
          <div className="preview-swatch-row">
            {steps[1].items.map(c => <div key={c.name} className="preview-swatch" title={c.name} style={{background:'var(--n2)'}}></div>)}
          </div>
        </div>
      </aside>

      {confirmDel && (
        <div className="modal-overlay" onClick={() => setConfirmDel(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-title">항목을 삭제할까요?</div>
            <div className="modal-desc">"{confirmDel.itemName}" 옵션 항목을 삭제하면 이미 진행 중인 주문에는 영향을 주지 않고, 신규 주문에서만 선택할 수 없게 됩니다.</div>
            <div className="modal-actions">
              <button className="btn btn-outline btn-block" onClick={() => setConfirmDel(null)}>취소</button>
              <button className="btn btn-danger-outline btn-block" onClick={confirmRemove}>삭제</button>
            </div>
          </div>
        </div>
      )}
      {addTarget && (
        <div className="modal-overlay" onClick={() => setAddTarget(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-title">옵션 항목 추가</div>
            <div className="modal-desc">이 단계에 새 옵션 항목과 추가 가격을 등록합니다.</div>
            <div className="modal-field"><label>항목 이름</label><input placeholder="예: 브러시드 메탈 마감" value={addForm.name} onChange={e => setAddForm(f => ({...f, name:e.target.value}))} /></div>
            <div className="modal-field"><label>추가 가격 (원)</label><input placeholder="0" value={addForm.price} onChange={e => setAddForm(f => ({...f, price:e.target.value}))} /></div>
            <div className="modal-actions">
              <button className="btn btn-outline btn-block" onClick={() => setAddTarget(null)}>취소</button>
              <button className="btn btn-primary btn-block" onClick={confirmAddItem}>추가</button>
            </div>
          </div>
        </div>
      )}
      {saveToast && <ToastEl msg={saveToast} onDone={() => setSaveToast(null)} />}
    </div>
  );
}

function Settlement(){
  const [period, setPeriod] = useState('2026-09');
  const [exporting, setExporting] = useState(false);
  const [exported, setExported] = useState(false);

  const totalSales = SETTLEMENT_ROWS.reduce((s,r) => s+r.sales, 0);
  const totalOrders = SETTLEMENT_ROWS.reduce((s,r) => s+r.orders, 0);
  const avgRefund = (SETTLEMENT_ROWS.reduce((s,r) => s+r.refund, 0) / SETTLEMENT_ROWS.length).toFixed(1);

  const doExport = () => {
    setExporting(true);
    setTimeout(() => { setExporting(false); setExported(true); setTimeout(() => setExported(false), 2400); }, 1200);
  };

  return (
    <div>
      <div className="filter-bar">
        <Ic name="calendar-blank" size={15} style={{color:'var(--n6)'}} />
        <select value={period} onChange={e => setPeriod(e.target.value)}>
          <option value="2026-09">2026년 9월</option>
          <option value="2026-08">2026년 8월</option>
          <option value="2026-07">2026년 7월</option>
        </select>
        <Ic name="storefront" size={15} style={{color:'var(--n6)'}} />
        <select><option>전체 입점사</option>{SETTLEMENT_ROWS.map(r => <option key={r.vendor}>{r.vendor}</option>)}</select>
        <div style={{flex:1}}></div>
        <button className="btn btn-outline btn-sm" onClick={doExport} disabled={exporting}>
          {exporting ? <><span className="spinner" style={{width:14,height:14,borderWidth:2}}></span> 내보내는 중...</> : exported ? <><Ic name="check" size={13}/> 완료</> : <><Ic name="download-simple" size={13}/> CSV 내보내기</>}
        </button>
      </div>

      <div className="kpi-row">
        <div className="kpi-card">
          <div className="kpi-label"><Ic name="chart-line-up" size={14} /> 총 매출</div>
          <div className="kpi-value">{won(totalSales)}</div>
          <span className="kpi-delta up"><Ic name="arrow-up-right" size={12} /> 전월 대비 8.2%</span>
        </div>
        <div className="kpi-card">
          <div className="kpi-label"><Ic name="receipt" size={14} /> 총 주문 건수</div>
          <div className="kpi-value">{totalOrders}건</div>
          <span className="kpi-delta up"><Ic name="arrow-up-right" size={12} /> 전월 대비 5.4%</span>
        </div>
        <div className="kpi-card">
          <div className="kpi-label"><Ic name="arrow-counter-clockwise" size={14} /> 평균 반품률</div>
          <div className="kpi-value">{avgRefund}%</div>
          <span className="kpi-delta down"><Ic name="arrow-down-right" size={12} /> 전월 대비 0.3%p</span>
        </div>
      </div>

      <div className="data-table-wrap">
        <table className="data-table">
          <thead><tr><th>입점사</th><th>매출</th><th>주문건수</th><th>수수료율</th><th>차감액</th><th>지급액</th><th>상태</th></tr></thead>
          <tbody>
            {SETTLEMENT_ROWS.map(r => {
              const fee = Math.round(r.sales * r.feeRate/100);
              return (
                <tr key={r.vendor}>
                  <td style={{fontWeight:700}}>{r.vendor}</td>
                  <td>{won(r.sales)}</td>
                  <td>{r.orders}건</td>
                  <td>{r.feeRate}%</td>
                  <td>{won(fee)}</td>
                  <td style={{fontWeight:700}}>{won(r.sales-fee)}</td>
                  <td><span className={"badge " + r.status}>{r.status==='paid' ? '지급완료' : '정산대기'}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ───────────────────────── legacy sync ───────────────────────── */
function LegacySync(){
  const [queue, setQueue] = useState(SYNC_QUEUE);
  const [reviewing, setReviewing] = useState(null);
  const [refundChecked, setRefundChecked] = useState({r1:true, r2:false, r3:false});
  const [toast, setToast] = useState(null);

  const confirmMapping = () => {
    setQueue(q => q.filter(item => item.id !== reviewing.id));
    setToast(`${reviewing.id} 매핑이 확정되어 신규 스키마로 저장되었습니다`);
    setReviewing(null);
  };

  const refundTotal = REFUND_ITEMS.filter(i => refundChecked[i.id]).reduce((s,i) => s+i.price, 0);

  return (
    <div className="sync-layout">
      <div>
        <strong style={{fontSize:15, fontWeight:800, display:'block', marginBottom:4}}>매핑 검토 큐</strong>
        <p style={{fontSize:12.5, color:'var(--n6)', marginBottom:16}}>규칙에 맞지 않는 기존 주문 데이터는 자동 반영되지 않고 여기서 대기합니다</p>
        {queue.length===0 && <div style={{padding:30, textAlign:'center', color:'var(--n6)', fontSize:13}}>검토 대기 항목이 없습니다</div>}
        {queue.map(item => (
          <div className="queue-card" key={item.id} onClick={() => setReviewing(item)}>
            <div className="queue-card-head">
              <span className="queue-id">{item.id}</span>
              <Ic name="caret-right" size={14} style={{color:'var(--n5)'}} />
            </div>
            <div className="queue-title">{item.title}</div>
            <div className="queue-reason"><Ic name="warning" size={12} /> {item.reason}</div>
          </div>
        ))}
      </div>

      <div>
        <strong style={{fontSize:15, fontWeight:800, display:'block', marginBottom:4}}>옵션 단위 부분 반품/환불</strong>
        <p style={{fontSize:12.5, color:'var(--n6)', marginBottom:16}}>반품 대상 옵션만 선택하면 해당 비중만큼 환불 금액이 재계산됩니다</p>
        <div className="refund-card">
          <div style={{fontSize:12.5, fontWeight:700, color:'var(--n7)', marginBottom:8}}>ORD-2204 · 클래식 마블 대리석필름</div>
          {REFUND_ITEMS.map(item => (
            <label className="refund-item-row" key={item.id}>
              <input type="checkbox" checked={!!refundChecked[item.id]} onChange={() => setRefundChecked(c => ({...c, [item.id]: !c[item.id]}))} />
              <span style={{flex:1}}>{item.name}</span>
              <span style={{fontWeight:700}}>{won(item.price)}</span>
            </label>
          ))}
          <div className="refund-total">
            <span style={{fontSize:13, fontWeight:700}}>환불 예상 금액</span>
            <span className="refund-total-val">{won(refundTotal)}</span>
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:16}} disabled={refundTotal===0}>
            <Ic name="arrow-counter-clockwise" size={14} /> 부분 환불 처리
          </button>
        </div>
      </div>

      {reviewing && (
        <div className="modal-overlay" onClick={() => setReviewing(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-title">{reviewing.id} 매핑 확정</div>
            <div className="modal-desc">{reviewing.reason}</div>
            <div className="modal-field"><label>신규 스키마 매핑 값</label><input placeholder="예: 방염 인증 소재 / 3m×2m" /></div>
            <div className="modal-field"><label>검토자 메모</label><input placeholder="매핑 확정 사유를 남겨주세요" /></div>
            <div className="modal-actions">
              <button className="btn btn-outline btn-block" onClick={() => setReviewing(null)}>취소</button>
              <button className="btn btn-primary btn-block" onClick={confirmMapping}>매핑 확정</button>
            </div>
          </div>
        </div>
      )}
      {toast && <ToastEl msg={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

/* ───────────────────────── app ───────────────────────── */
const SCREEN_META = {
  'main': {title:'멀티테넌트 워크스페이스 전환 및 주문 칸반', sub:'워크스페이스별 권한 범위에서 주문을 칸반으로 처리합니다'},
  'option-schema': {title:'5단계 옵션 스키마 관리', sub:'옵션 트리와 조합별 추가 가격을 관리합니다'},
  'sales-settlement': {title:'입점사별 판매 통계 및 정산', sub:'기간·입점사별 매출과 정산 지급액을 확인합니다'},
  'legacy-sync': {title:'기존 주문 데이터 연동 및 반품/환불 처리', sub:'레거시 데이터 매핑과 옵션 단위 반품을 처리합니다'},
};

function App(){
  const [screen, setScreen] = useState('main');
  const [ws, setWs] = useState('internal');
  const [orders, setOrders] = useState(SEED_ORDERS);
  const [notifOpen, setNotifOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const meta = SCREEN_META[screen];

  return (
    <div className="shell" data-archetype="kanban-board">
      <Sidebar screen={screen} setScreen={setScreen} ws={ws} setWs={setWs} />
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="topbar-title">{meta.title}</div>
            <div className="topbar-sub">{meta.sub}</div>
          </div>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={() => setNotifOpen(true)}><Ic name="bell" size={17} /></button>
            <button className="icon-btn" onClick={() => setSettingsOpen(true)}><Ic name="gear" size={17} /></button>
          </div>
        </div>
        {notifOpen && (
          <div className="modal-overlay" onClick={() => setNotifOpen(false)}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              <div className="modal-title">알림</div>
              <div className="modal-desc">ORD-2202 방염 인증 벽면필름 실측 요청이 접수 대기 중입니다.<br/>LG-091 매핑 검토가 3건 대기 중입니다.</div>
              <div className="modal-actions"><button className="btn btn-primary btn-block" onClick={() => setNotifOpen(false)}>확인</button></div>
            </div>
          </div>
        )}
        {settingsOpen && (
          <div className="modal-overlay" onClick={() => setSettingsOpen(false)}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              <div className="modal-title">운영 설정</div>
              <div className="modal-field"><label>기본 워크스페이스</label><select><option>내부 운영팀</option><option>인테리어필름코리아</option></select></div>
              <div className="modal-field"><label>알림 수신</label><select><option>전체 수신</option><option>중요 알림만</option></select></div>
              <div className="modal-actions"><button className="btn btn-outline btn-block" onClick={() => setSettingsOpen(false)}>닫기</button><button className="btn btn-primary btn-block" onClick={() => setSettingsOpen(false)}>저장</button></div>
            </div>
          </div>
        )}
        <div className="content">
          {screen==='main' && <KanbanMain orders={orders} setOrders={setOrders} ws={ws} />}
          {screen==='option-schema' && <OptionSchema />}
          {screen==='sales-settlement' && <Settlement />}
          {screen==='legacy-sync' && <LegacySync />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
