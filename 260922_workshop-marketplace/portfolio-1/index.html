<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크숍허브 — 기업 워크숍 프로그램 검색·견적 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  --m50:#edf5ff; --m100:#dbeaff; --m200:#b8d6ff; --m300:#8cbcff; --m400:#5ca0ff;
  --m500:#2e86ff; --m600:#006bff; --m700:#0058d1; --m800:#0044a3; --m900:#003073;
  --n0:#f8f9fb; --n1:#ffffff; --n2:#eff0f0; --n3:#e5e5e6; --n4:#d5d6d7;
  --n5:#b5b7ba; --n6:#909398; --n7:#71757a; --n8:#53565a; --n9:#36383a; --n10:#1e1e20;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
  --radius-card:16px; --radius-btn:10px; --radius-pill:999px;
  --shadow-sm: 0 1px 2px rgba(20,30,50,.05), 0 2px 6px rgba(20,30,50,.04);
  --shadow-elevated: 0 4px 10px rgba(20,30,50,.05), 0 20px 40px -12px rgba(20,30,50,.14);
  --shadow-floating: 0 8px 20px rgba(20,30,50,.06), 0 32px 64px -16px rgba(20,30,50,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif; background:var(--n0); color:var(--n9); -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

/* ===== keyframes ===== */
@keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes shimmer{ 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
@keyframes drawerSlideIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
@keyframes chipPop{ 0%{transform:scale(.9);} 60%{transform:scale(1.05);} 100%{transform:scale(1);} }
@keyframes rippleAnim{ from{transform:scale(0); opacity:.35;} to{transform:scale(2.6); opacity:0;} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes spinSoft{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* ===== search header (airbnb-search-grid 시그니처) ===== */
.search-header{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--n3);}
.header-row{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:24px; padding:16px 32px;}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; color:var(--n9); flex-shrink:0;}
.brand .brand-mark{width:30px; height:30px; border-radius:9px; background:var(--m600); display:flex; align-items:center; justify-content:center; color:#fff;}
.search-bar{flex:1; display:flex; align-items:center; background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-pill); box-shadow:var(--shadow-sm); padding:4px; max-width:640px;}
.search-segment{flex:1; display:flex; flex-direction:column; align-items:flex-start; padding:8px 20px; border-radius:var(--radius-pill); transition:background .15s;}
.search-segment:hover{background:var(--n2);}
.segment-label{font-size:11px; font-weight:700; color:var(--n7);}
.segment-value{font-size:13.5px; font-weight:600; color:var(--n9); margin-top:1px;}
.segment-select{border:none; background:transparent; font-size:13.5px; font-weight:600; color:var(--n9); appearance:none; width:100%; cursor:pointer;}
.search-divider{width:1px; height:26px; background:var(--n3); flex-shrink:0;}
.search-submit{width:40px; height:40px; border-radius:50%; background:var(--m600); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s;}
.search-submit:hover{transform:scale(1.06);}
.header-nav{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.nav-feature-link{font-size:13.5px; font-weight:600; color:var(--n8); padding:9px 14px; border-radius:var(--radius-btn); white-space:nowrap; transition:background .15s, color .15s;}
.nav-feature-link:hover{background:var(--n2); color:var(--m700);}
.nav-feature-link.primary{background:var(--m600); color:#fff;}
.nav-feature-link.primary:hover{background:var(--m700); color:#fff;}
.user-menu{width:38px; height:38px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n7);}

.filter-chips{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:0 32px 14px; overflow-x:auto;}
.chip{display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius-pill); border:1px solid var(--n3); background:var(--n1); font-size:13px; font-weight:600; color:var(--n7); flex-shrink:0; transition:all .15s;}
.chip:hover{border-color:var(--m300);}
.chip.active{background:var(--m50); border-color:var(--m600); color:var(--m700); animation:chipPop .25s ease;}
.chip.filter-toggle{background:var(--n9); color:#fff; border-color:var(--n9);}

.trust-strip{max-width:1280px; margin:0 auto; display:flex; gap:40px; padding:14px 32px 22px; flex-wrap:wrap;}
.trust-stat{display:flex; flex-direction:column;}
.trust-num{font-size:22px; font-weight:800; color:var(--n9); font-variant-numeric:tabular-nums;}
.trust-label{font-size:12px; color:var(--n7); margin-top:2px;}

/* ===== main / gallery ===== */
.main{width:100%; max-width:1280px; margin:0 auto; padding:8px 32px 80px;}
.section-title-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;}
.section-title{font-size:22px; font-weight:800; color:var(--n9);}
.section-sub{font-size:13.5px; color:var(--n7); margin-top:4px;}
.result-count{font-size:13px; color:var(--n7); font-weight:600;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:22px;}
.listing-card{background:var(--n1); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--shadow-elevated); border:1px solid var(--n3); cursor:pointer; opacity:0; animation:fadeInUp .5s ease forwards; transition:transform .22s, box-shadow .22s;}
.listing-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-floating);}
.card-image-wrap{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--n2);}
.card-image{width:100%; height:100%; object-fit:cover; transition:transform .35s;}
.listing-card:hover .card-image{transform:scale(1.05);}
.card-favorite{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--n8); box-shadow:var(--shadow-sm);}
.card-favorite.active{color:var(--m600);}
.card-cat-badge{position:absolute; top:10px; left:10px; background:rgba(255,255,255,.92); font-size:11px; font-weight:700; color:var(--n8); padding:4px 10px; border-radius:var(--radius-pill);}
.card-body{padding:16px;}
.card-row-1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-title{font-size:15.5px; font-weight:700; color:var(--n9); line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card-rating{font-size:13px; font-weight:700; color:var(--n8); display:flex; align-items:center; gap:3px; flex-shrink:0;}
.card-row-2,.card-row-3{font-size:12.5px; color:var(--n7); margin-top:4px; display:flex; align-items:center; gap:5px;}
.card-row-4{display:flex; align-items:baseline; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--n2);}
.card-price{font-size:16px; font-weight:800; color:var(--n9);}
.price-unit{font-size:12px; color:var(--n7); font-weight:500;}

.empty-state{display:flex; flex-direction:column; align-items:center; padding:80px 20px; color:var(--n6); text-align:center;}
.empty-state svg{margin-bottom:14px; opacity:.5;}

/* ===== quick-view drawer ===== */
.drawer-overlay{position:fixed; inset:0; background:rgba(20,25,35,.42); z-index:60; display:flex; justify-content:flex-end;}
.drawer{width:420px; max-width:92vw; height:100%; background:var(--n1); box-shadow:var(--shadow-floating); animation:drawerSlideIn .3s cubic-bezier(.2,.8,.3,1); display:flex; flex-direction:column;}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--n3);}
.drawer-close{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--n7); background:var(--n2);}
.drawer-body{flex:1; overflow-y:auto; padding:0 22px 22px;}
.drawer-img{width:100%; aspect-ratio:16/9; border-radius:var(--radius-card); overflow:hidden; margin:14px 0;}
.drawer-img img{width:100%; height:100%; object-fit:cover;}
.drawer-meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
.meta-tile{background:var(--n2); border-radius:12px; padding:12px;}
.meta-tile-label{font-size:11px; color:var(--n7); font-weight:600;}
.meta-tile-value{font-size:14px; font-weight:700; color:var(--n9); margin-top:2px;}
.drawer-cta{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--n3);}

/* ===== buttons ===== */
.btn{position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 22px; border-radius:var(--radius-btn); font-size:14.5px; font-weight:700; transition:transform .12s, box-shadow .12s;}
.btn-primary{background:var(--m600); color:#fff; box-shadow:0 8px 18px -6px rgba(0,107,255,.45);}
.btn-primary:hover{background:var(--m700); transform:translateY(-1px);}
.btn-outline{background:var(--n1); color:var(--n9); border:1.5px solid var(--n4);}
.btn-outline:hover{border-color:var(--n7);}
.btn-ghost{background:transparent; color:var(--n8);}
.btn-ghost:hover{background:var(--n2);}
.btn-block{width:100%;}
.ripple-el{position:absolute; border-radius:50%; background:rgba(255,255,255,.55); pointer-events:none; animation:rippleAnim .55s ease-out;}

/* ===== generic page shells ===== */
.page{max-width:1280px; margin:0 auto; padding:36px 32px 90px; width:100%;}
.page-head{margin-bottom:28px;}
.page-eyebrow{font-size:12.5px; font-weight:700; color:var(--m700); text-transform:uppercase; letter-spacing:.04em;}
.page-title{font-size:44px; font-weight:800; color:var(--n9); margin-top:8px; line-height:1.15; letter-spacing:-.01em;}
.page-desc{font-size:14.5px; color:var(--n7); margin-top:8px; max-width:640px; line-height:1.6;}

/* ===== AI recommend ===== */
.ai-shell{display:grid; grid-template-columns:400px 1fr; gap:28px; align-items:flex-start;}
@media(max-width:900px){ .ai-shell{grid-template-columns:1fr;} }
.ai-panel{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:24px; box-shadow:var(--shadow-elevated); position:sticky; top:90px;}
.ai-textarea{width:100%; min-height:110px; border:1.5px solid var(--n3); border-radius:12px; padding:14px; font-size:14px; color:var(--n9); resize:vertical; background:var(--n0);}
.ai-textarea:focus{outline:none; border-color:var(--m600);}
.ai-examples{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
.ai-example-chip{text-align:left; font-size:12.5px; color:var(--n7); background:var(--n2); border-radius:10px; padding:10px 12px; transition:background .15s;}
.ai-example-chip:hover{background:var(--n3); color:var(--n9);}
.ai-parsed{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0;}
.ai-parsed-tag{background:var(--m50); color:var(--m700); font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:var(--radius-pill);}
.skeleton-card{border-radius:var(--radius-card); background:linear-gradient(90deg, var(--n2) 0%, var(--n3) 50%, var(--n2) 100%); background-size:800px 100%; animation:shimmer 1.4s infinite linear; height:270px;}
.ai-result-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px;}
.ai-loading-row{display:flex; align-items:center; gap:10px; color:var(--n7); font-size:13.5px; font-weight:600; margin-bottom:16px;}
.spinner{width:18px; height:18px; border:2.5px solid var(--n3); border-top-color:var(--m600); border-radius:50%; animation:spinSoft .7s linear infinite;}

/* ===== quote request ===== */
.qr-shell{display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:flex-start;}
@media(max-width:960px){ .qr-shell{grid-template-columns:1fr;} }
.qr-hero{border-radius:var(--radius-card); overflow:hidden; aspect-ratio:16/9; box-shadow:var(--shadow-elevated);}
.qr-hero img{width:100%; height:100%; object-fit:cover;}
.qr-block{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:22px; margin-top:18px;}
.qr-block h3{font-size:15.5px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.qr-block p{font-size:13.5px; color:var(--n7); line-height:1.7;}
.qr-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.qr-list-item{display:flex; align-items:flex-start; gap:8px; font-size:13.5px; color:var(--n8);}
.review-card{border-top:1px solid var(--n2); padding-top:14px; margin-top:14px;}
.review-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}

.qr-form-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:24px; box-shadow:var(--shadow-floating); position:sticky; top:90px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--n8); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; border:1.5px solid var(--n3); border-radius:10px; padding:10px 12px; font-size:13.5px; color:var(--n9); background:var(--n0);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--m600); background:var(--n1);}
.field.error input, .field.error select, .field.error textarea{border-color:var(--s2);}
.field-error-msg{font-size:11.5px; color:var(--s2-text); margin-top:4px;}
.selected-program-tag{display:flex; align-items:center; gap:8px; background:var(--m50); border-radius:12px; padding:10px 12px; margin-bottom:16px; font-size:13px; font-weight:700; color:var(--m700);}

/* ===== partner register ===== */
.type-select-row{display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;}
.type-card{flex:1; min-width:160px; border:1.5px solid var(--n3); border-radius:14px; padding:18px; text-align:left; background:var(--n1); transition:all .15s;}
.type-card:hover{border-color:var(--m300);}
.type-card.active{border-color:var(--m600); background:var(--m50); box-shadow:0 0 0 3px var(--m100);}
.type-card svg{margin-bottom:8px; color:var(--n7);}
.type-card.active svg{color:var(--m700);}
.type-card-title{font-size:14.5px; font-weight:800; color:var(--n9);}
.type-card-desc{font-size:12px; color:var(--n7); margin-top:4px; line-height:1.5;}
.partner-form-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:26px; max-width:640px;}
.draft-badge{display:inline-flex; align-items:center; gap:6px; background:var(--s3-bg); color:var(--s3-text); font-size:12px; font-weight:700; padding:5px 10px; border-radius:var(--radius-pill); margin-left:10px;}
.status-pending{display:inline-flex; align-items:center; gap:8px; background:var(--s3-bg); color:var(--s3-text); font-weight:700; padding:8px 14px; border-radius:var(--radius-pill); font-size:13px;}
.success-panel{text-align:center; padding:60px 20px;}
.success-icon{width:72px; height:72px; border-radius:50%; background:var(--s1-bg); color:var(--s1); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}

/* ===== toast ===== */
.toast{position:fixed; bottom:28px; left:50%; background:var(--n9); color:#fff; padding:13px 22px; border-radius:var(--radius-btn); font-size:13.5px; font-weight:600; z-index:100; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-floating); animation:toastIn .28s ease;}

/* ===== footer ===== */
.footer{background:var(--n1); border-top:1px solid var(--n3); margin-top:60px;}
.footer-cols{max-width:1280px; margin:0 auto; padding:44px 32px; display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:28px;}
.footer-col h4{font-size:12px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px;}
.footer-col a{display:block; font-size:13.5px; color:var(--n8); margin-bottom:9px;}
.footer-brand-desc{font-size:13px; color:var(--n7); line-height:1.7; margin-top:10px; max-width:280px;}
.footer-bottom{border-top:1px solid var(--n2); padding:16px 32px; font-size:12px; color:var(--n6); max-width:1280px; margin:0 auto;}

@media(max-width:860px){
  .header-row{flex-wrap:wrap;}
  .search-bar{order:3; max-width:none; width:100%;}
  .header-nav{overflow-x:auto;}
}
</style>
</head>

function useIcons(deps){
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }, deps);
}

function Ripple({onClick, className, children, ...rest}){
  const spawn = (e) => {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const span = document.createElement('span');
    span.className = 'ripple-el';
    const size = Math.max(rect.width, rect.height);
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(()=>span.remove(), 550);
    if(onClick) onClick(e);
  };
  return <button className={className} onClick={spawn} {...rest}>{children}</button>;
}

function CountUp({to, suffix=''}){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let start = null; const dur = 900;
    const step = (ts) => {
      if(!start) start = ts;
      const p = Math.min((ts-start)/dur, 1);
      setN(Math.round(to * (1 - Math.pow(1-p, 3))));
      if(p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [to]);
  return <span>{n.toLocaleString()}{suffix}</span>;
}

function Toast({message, onDone}){
  useEffect(()=>{ const t = setTimeout(onDone, 2400); return ()=>clearTimeout(t); }, [message]);
  return <div className="toast">{L('check-circle-2', {style:{width:16,height:16}})}{message}</div>;
}

function parseQuery(text){
  const headcount = (text.match(/(\d+)\s*명/)||[])[1];
  const duration = (text.match(/(\d+)\s*시간/)||[])[1];
  let purpose = '팀워크·협업';
  if(text.includes('소통')) purpose = '소통·조직문화';
  if(text.includes('리더십')||text.includes('코칭')) purpose = '전략·문제해결';
  return {headcount: headcount?headcount+'명':'제한 없음', duration: duration?duration+'시간':'제한 없음', purpose};
}

              <div className="review-head"><span className="avatar">김</span><strong style={{fontSize:13.5}}>김O수 담당자</strong></div>
              <p style={{fontSize:13}}>신입사원들 반응이 정말 좋았고 운영진의 진행이 매끄러웠습니다.</p>
            </div>
            <div className="review-card">
              <div className="review-head"><span className="avatar">이</span><strong style={{fontSize:13.5}}>이O진 담당자</strong></div>
              <p style={{fontSize:13}}>사전 커뮤니케이션이 꼼꼼해서 준비 과정이 수월했습니다.</p>
            </div>
          </div>
        </div>

        <div className="qr-form-card">
          <div className="selected-program-tag">{L('bookmark-check',{style:{width:15,height:15}})} 선택 프로그램: {p.title}</div>
          <div className="form-row">
            <div className={'field'+(errors.company?' error':'')}>
              <label>회사명 *</label>
              <input value={form.company} onChange={e=>set('company', e.target.value)} placeholder="(주)샘플기업"/>
              {errors.company && <div className="field-error-msg">{errors.company}</div>}
            </div>
            <div className={'field'+(errors.manager?' error':'')}>
              <label>담당자명 *</label>
              <input value={form.manager} onChange={e=>set('manager', e.target.value)} placeholder="홍길동"/>
              {errors.manager && <div className="field-error-msg">{errors.manager}</div>}
            </div>
          </div>
          <div className="form-row">
            <div className={'field'+(errors.phone?' error':'')}>
              <label>연락처 *</label>
              <input value={form.phone} onChange={e=>set('phone', e.target.value)} placeholder="010-0000-0000"/>
              {errors.phone && <div className="field-error-msg">{errors.phone}</div>}
            </div>
            <div className="field">
              <label>이메일</label>
              <input value={form.email} onChange={e=>set('email', e.target.value)} placeholder="manager@company.co.kr"/>
            </div>
          </div>
          <div className="form-row">
            <div className={'field'+(errors.date?' error':'')}>
              <label>희망 날짜 *</label>
              <input type="date" value={form.date} onChange={e=>set('date', e.target.value)}/>
              {errors.date && <div className="field-error-msg">{errors.date}</div>}
            </div>
            <div className={'field'+(errors.headcount?' error':'')}>
              <label>참여 인원 *</label>
              <input value={form.headcount} onChange={e=>set('headcount', e.target.value)} placeholder="예: 80명"/>
              {errors.headcount && <div className="field-error-msg">{errors.headcount}</div>}
            </div>
          </div>
          <div className="form-row">
            <div className="field">
              <label>희망 지역</label>
              <input value={form.region} onChange={e=>set('region', e.target.value)}/>
            </div>
            <div className="field">
              <label>진행 시간</label>
              <input value={form.duration} onChange={e=>set('duration', e.target.value)}/>
            </div>
          </div>
          <div className="form-row full">
            <div className="field">
              <label>프로그램 목적</label>
              <select value={form.purpose} onChange={e=>set('purpose', e.target.value)}>
                <option value="">선택해주세요</option>
                <option>팀워크·협업</option><option>소통·조직문화</option><option>전략·문제해결</option><option>리프레시</option>
              </select>
            </div>
          </div>
          <div className="form-row full">
            <div className="field">
              <label>예상 예산</label>
              <input value={form.budget} onChange={e=>set('budget', e.target.value)} placeholder="예: 1인 5만원 이내"/>
            </div>
          </div>
          <div className="form-row full">
            <div className="field">
              <label>요청사항</label>
              <textarea rows="3" value={form.note} onChange={e=>set('note', e.target.value)} placeholder="추가로 전달하고 싶은 내용을 입력해주세요"></textarea>
            </div>
          </div>
          <button className="btn btn-primary btn-block" onClick={submit}>{L('send',{style:{width:15,height:15}})} 견적 요청하기</button>
        </div>
      </div>
    </main>
  );
}

const PARTNER_TYPES = [
  {key:'instructor', label:'강사', desc:'전문 분야 강의·진행', icon:'graduation-cap'},
  {key:'company', label:'업체', desc:'팀빌딩·행사대행 업체', icon:'building-2'},
  {key:'space', label:'공간·숙박', desc:'연수원·워크숍 공간', icon:'landmark'},
];

function PartnerRegisterView({showToast}){
  const [type, setType] = useState('instructor');
  const [form, setForm] = useState({});
  const [draftSaved, setDraftSaved] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  useIcons([type, submitted]);
  const set = (k,v)=> setForm(f=>({...f,[k]:v}));

  const saveDraft = () => { setDraftSaved(true); showToast('작성 중인 내용이 초안으로 저장되었습니다.'); };
  const submit = () => { setSubmitted(true); showToast('프로그램 등록이 접수되었습니다.'); };

  if(submitted){
    return (
      <main className="page">
        <div className="success-panel">
          <div className="success-icon">{L('check',{style:{width:32,height:32}})}</div>
          <h2 style={{fontSize:22, fontWeight:800}}>등록이 접수되었습니다</h2>
          <p style={{color:'var(--n7)', marginTop:10, fontSize:14}}>운영사 검수 후 카탈로그에 노출됩니다.</p>
          <div style={{marginTop:16}}><span className="status-pending">{L('clock',{style:{width:14,height:14}})} 검수대기</span></div>
          <button className="btn btn-outline" style={{marginTop:22}} onClick={()=>{setSubmitted(false); setForm({});}}>{L('plus',{style:{width:14,height:14}})} 새 프로그램 등록하기</button>
        </div>
      </main>
    );
  }

  return (
    <main className="page">
      <div className="page-head">
        <div className="page-eyebrow">파트너사 프로그램 등록</div>
        <h1 className="page-title">파트너 유형을 선택하고 프로그램을 등록하세요 {draftSaved && <span className="draft-badge">{L('save',{style:{width:12,height:12}})} 초안 저장됨</span>}</h1>
        <p className="page-desc">강사·업체·공간 등 파트너 유형에 따라 입력 항목이 달라집니다. 등록된 프로그램은 운영사 검수 후 카탈로그에 게시됩니다.</p>
      </div>
      <div className="type-select-row">
        {PARTNER_TYPES.map(t=>(
          <button key={t.key} className={'type-card'+(type===t.key?' active':'')} onClick={()=>setType(t.key)}>
            {L(t.icon, {style:{width:22,height:22}})}
            <div className="type-card-title">{t.label}</div>
            <div className="type-card-desc">{t.desc}</div>
          </button>
        ))}
      </div>
      <div className="partner-form-card">
        {type==='instructor' && (
          <React.Fragment>
            <div className="form-row"><div className="field"><label>이름</label><input onChange={e=>set('name',e.target.value)} placeholder="홍길동"/></div><div className="field"><label>연락처</label><input placeholder="010-0000-0000"/></div></div>
            <div className="form-row"><div className="field"><label>전문분야</label><input placeholder="예: 팀빌딩 퍼실리테이션"/></div><div className="field"><label>강의가능분야</label><input placeholder="예: 리더십, 커뮤니케이션"/></div></div>
            <div className="form-row"><div className="field"><label>활동지역</label><input placeholder="서울/수도권"/></div><div className="field"><label>기본 강사료</label><input placeholder="1일 80만원"/></div></div>
          </React.Fragment>
        )}
        {type==='company' && (
          <React.Fragment>
            <div className="form-row"><div className="field"><label>업체명</label><input placeholder="(주)샘플팀빌딩"/></div><div className="field"><label>담당자</label><input placeholder="홍길동"/></div></div>
            <div className="form-row"><div className="field"><label>연락처</label><input placeholder="010-0000-0000"/></div><div className="field"><label>이메일</label><input placeholder="partner@company.co.kr"/></div></div>
            <div className="form-row full"><div className="field"><label>대표 프로그램 소개</label><textarea rows="3" placeholder="대표 프로그램을 간단히 소개해주세요"></textarea></div></div>
          </React.Fragment>
        )}
        {type==='space' && (
          <React.Fragment>
            <div className="form-row"><div className="field"><label>공간명</label><input placeholder="예: 샘플리조트 컨벤션홀"/></div><div className="field"><label>주소</label><input placeholder="지역을 입력해주세요"/></div></div>
            <div className="form-row"><div className="field"><label>수용 인원</label><input placeholder="최대 200명"/></div><div className="field"><label>대실 비용</label><input placeholder="1일 150만원"/></div></div>
            <div className="form-row full"><div className="field"><label>부대시설</label><textarea rows="3" placeholder="숙박, 식사, 회의실 등 부대시설을 입력해주세요"></textarea></div></div>
          </React.Fragment>
        )}
        <div className="form-row full"><div className="field"><label>제안서 업로드 (선택)</label>
          <div style={{border:'1.5px dashed var(--n4)', borderRadius:'12px', padding:'20px', textAlign:'center', color:'var(--n6)', fontSize:13}}>
            {L('upload-cloud',{style:{width:22,height:22}})}
            <div style={{marginTop:6}}>파일을 드래그하거나 클릭해 업로드</div>
          </div>
        </div></div>
        <div style={{display:'flex', gap:10, marginTop:6}}>
          <button className="btn btn-outline" onClick={saveDraft}>{L('save',{style:{width:14,height:14}})} 초안 저장</button>
          <button className="btn btn-primary btn-block" onClick={submit}>{L('check-circle',{style:{width:14,height:14}})} 등록하기</button>
        </div>
      </div>
    </main>
  );
}

function Footer(){
  return (
    <footer className="footer">
      <div className="footer-cols">
        <div className="footer-col">
          <div className="brand" style={{marginBottom:10}}><span className="brand-mark">{L('sparkles',{style:{width:14,height:14}})}</span>워크숍허브</div>
          <p className="footer-brand-desc">기업 워크숍·팀빌딩·교육 프로그램을 검색하고 견적을 요청할 수 있는 B2B 중개 플랫폼입니다.</p>
        </div>
        <div className="footer-col"><h4>서비스</h4><a>프로그램 찾기</a><a>AI 추천</a><a>견적 요청</a></div>
        <div className="footer-col"><h4>파트너</h4><a>파트너 등록</a><a>파트너 가이드</a><a>정산 안내</a></div>
        <div className="footer-col"><h4>고객지원</h4><a>자주 묻는 질문</a><a>이용약관</a><a>개인정보처리방침</a></div>
      </div>
      <div className="footer-bottom">© 2026 워크숍허브 — 자체 개발 프로젝트 (데모)</div>
    </footer>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [query, setQuery] = useState({purpose:'', duration:'', region:''});
  const [activeCategory, setActiveCategory] = useState('all');
  const [quickViewProgram, setQuickViewProgram] = useState(null);
  const [selectedProgram, setSelectedProgram] = useState(null);
  const [favorites, setFavorites] = useState([]);
  const [toast, setToast] = useState(null);

  useIcons([view, quickViewProgram]);

  const toggleFav = (id) => setFavorites(f => f.includes(id) ? f.filter(x=>x!==id) : [...f, id]);
  const openQuick = (p) => setQuickViewProgram(p);
  const goQuote = (p) => { setSelectedProgram(p); setQuickViewProgram(null); setView('quote-request'); };
  const showToast = (msg) => setToast(msg);

  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <Header query={query} setQuery={setQuery} activeCategory={activeCategory} setActiveCategory={setActiveCategory} view={view} setView={setView} />
      <div style={{flex:1, width:'100%'}}>
        {view==='main' && <MainView query={query} activeCategory={activeCategory} onOpen={openQuick} favorites={favorites} toggleFav={toggleFav}/>}
        {view==='ai-recommend' && <AiRecommendView onOpen={openQuick}/>}
        {view==='quote-request' && <QuoteRequestView program={selectedProgram} showToast={showToast}/>}
        {view==='partner-register' && <PartnerRegisterView showToast={showToast}/>}
      </div>
      <Footer/>
      {quickViewProgram && <QuickView program={quickViewProgram} onClose={()=>setQuickViewProgram(null)} onGoQuote={goQuote}/>}
      {toast && <Toast message={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
