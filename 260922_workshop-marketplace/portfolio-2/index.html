<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크숍허브 오퍼레이션스 — 통합 운영·정산 관리 시스템</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 21°, light) ── */
:root{
  --m50:#fff3ed; --m100:#ffe8db; --m200:#ffd1b8; --m300:#ffb58c; --m400:#ff955c;
  --m500:#ff782e; --m600:#ff5a00; --m700:#d14a00; --m800:#a33a00; --m900:#732800;
  --n0:#f4f4f5; --n1:#ffffff; --n2:#f0f0ef; --n3:#e6e5e5; --n4:#d7d6d5;
  --n5:#bab7b5; --n6:#989390; --n7:#7a7471; --n8:#18181b; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --radius-card:10px; --radius-btn:8px; --radius-pill:999px;
  --sidebar-w:240px;
  --shadow-sm: 0 1px 2px rgba(20,18,16,.05);
  --shadow-flat: 0 1px 0 rgba(20,18,16,.04);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; font-family:'Pretendard', ui-sans-serif, system-ui, sans-serif; background:var(--n0); color:var(--n8); -webkit-font-smoothing:antialiased; font-size:13.5px;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
table{border-collapse:collapse; width:100%;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--n4); border-radius:8px;}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes rowFade{ from{opacity:0;} to{opacity:1;} }
@keyframes barGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes modalIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ===== sidebar (stripe-multipane 시그니처) ===== */
.sidebar{position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w); background:var(--n1); border-right:1px solid var(--n3); overflow-y:auto; z-index:30;}
.sidebar-brand{display:flex; align-items:center; gap:9px; padding:18px 18px 14px;}
.sidebar-brand .mark{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg, var(--m600), var(--m900)); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sidebar-brand strong{font-size:14.5px; font-weight:800; color:var(--n8);}
.env-selector{margin:0 14px 16px; display:flex; align-items:center; gap:6px; background:var(--n2); border:1px solid var(--n3); border-radius:var(--radius-btn); padding:7px 10px; font-size:12px; font-weight:600; color:var(--n7);}
.env-dot{width:7px; height:7px; border-radius:50%; background:var(--s1); animation:pulseDot 2s infinite;}
.sidebar-section{padding:4px 10px 14px;}
.sidebar-section-title{font-size:10.5px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.06em; padding:6px 10px;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13px; font-weight:600; color:var(--n7); margin-bottom:2px; width:100%; text-align:left;}
.sidebar-link:hover{background:var(--n2); color:var(--n8);}
.sidebar-link.active{background:var(--n8); color:#fff;}
.sidebar-link .badge-count{margin-left:auto; background:var(--n3); color:var(--n7); font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:var(--radius-pill);}
.sidebar-link.active .badge-count{background:rgba(255,255,255,.18); color:#fff;}

/* ===== main-wrap ===== */
.main-wrap{margin-left:var(--sidebar-w); flex:1; min-width:0; width:calc(100% - var(--sidebar-w)); min-height:100vh; padding:22px 28px 60px;}
.page-header{margin-bottom:18px;}
.page-title-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.page-title{font-size:34px; font-weight:800; color:var(--n8); letter-spacing:-.01em;}
.page-actions{display:flex; gap:8px;}
.page-meta{font-size:12px; color:var(--n7); margin-top:4px;}

/* ===== buttons ===== */
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-btn); font-size:12.5px; font-weight:700; transition:all .12s;}
.btn-primary{background:var(--n8); color:#fff;}
.btn-primary:hover{background:var(--n9);}
.btn-secondary{background:var(--n1); color:var(--n8); border:1px solid var(--n4);}
.btn-secondary:hover{border-color:var(--n6);}
.btn-accent{background:var(--m600); color:#fff;}
.btn-accent:hover{background:var(--m700);}
.btn-ghost{background:transparent; color:var(--n7);}
.btn-ghost:hover{background:var(--n2);}
.btn-sm{padding:6px 10px; font-size:11.5px;}

/* ===== KPI stat row (시그니처) ===== */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
@media(max-width:1100px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
.stat-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:16px 18px; opacity:0; animation:fadeInUp .4s ease forwards;}
.stat-label{font-size:11.5px; font-weight:700; color:var(--n7); display:flex; align-items:center; gap:6px;}
.stat-value{font-size:29px; font-weight:800; color:var(--n8); margin-top:6px; font-variant-numeric:tabular-nums;}
.stat-delta{font-size:11.5px; font-weight:700; margin-top:4px; display:inline-flex; align-items:center; gap:3px;}
.stat-delta.positive{color:var(--s1-text);}
.stat-delta.negative{color:var(--s2-text);}
.stat-sparkline{margin-top:8px; width:100%; height:28px;}

/* ===== pipeline (hero-viz) ===== */
.pipeline-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:20px; margin-bottom:18px;}
.pipeline-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.pipeline-head h2{font-size:14.5px; font-weight:800; color:var(--n8);}
.pipeline-rows{display:flex; flex-direction:column; gap:9px;}
.pipeline-row{display:grid; grid-template-columns:104px 1fr 46px; align-items:center; gap:10px; cursor:pointer;}
.pipeline-stage-label{font-size:11.5px; font-weight:700; color:var(--n7);}
.pipeline-track{background:var(--n2); border-radius:6px; height:22px; overflow:hidden; position:relative;}
.pipeline-fill{height:100%; border-radius:6px; transform-origin:left; animation:barGrow .6s ease forwards; display:flex; align-items:center; padding-left:8px;}
.pipeline-count{font-size:12px; font-weight:700; color:var(--n8); text-align:right;}
.pipeline-row.selected .pipeline-stage-label{color:var(--n8);}

/* ===== tab bar / toolbar / table ===== */
.data-section{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); overflow:hidden;}
.tab-bar{display:flex; gap:2px; padding:10px 16px 0; border-bottom:1px solid var(--n3);}
.tab{padding:10px 14px; font-size:12.5px; font-weight:700; color:var(--n7); border-bottom:2px solid transparent; display:flex; align-items:center; gap:6px;}
.tab.active{color:var(--n8); border-bottom-color:var(--n8);}
.tab .tab-count{background:var(--n2); color:var(--n7); font-size:10.5px; padding:1px 6px; border-radius:var(--radius-pill);}
.data-toolbar{display:flex; align-items:center; gap:8px; padding:12px 16px;}
.search-input{flex:1; max-width:280px; border:1px solid var(--n3); border-radius:var(--radius-btn); padding:7px 12px; font-size:12.5px; background:var(--n0);}
.search-input:focus{outline:none; border-color:var(--n8);}
.filter-chip{border:1px solid var(--n3); background:var(--n1); border-radius:var(--radius-btn); padding:7px 12px; font-size:12px; font-weight:600; color:var(--n7); display:flex; align-items:center; gap:5px;}
.filter-chip:hover{border-color:var(--n6);}
.export-btn{margin-left:auto;}
.data-table-wrap{overflow-x:auto;}
.data-table th{text-align:left; font-size:11px; font-weight:700; color:var(--n6); text-transform:uppercase; letter-spacing:.03em; padding:9px 14px; border-bottom:1px solid var(--n3); white-space:nowrap;}
.data-table td{padding:11px 14px; border-bottom:1px solid var(--n2); font-size:12.5px; color:var(--n8); white-space:nowrap;}
.data-table tbody tr{animation:rowFade .3s ease;}
.data-table tbody tr:hover{background:var(--n0);}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill);}
.badge-success{background:var(--s1-bg); color:var(--s1-text);}
.badge-danger{background:var(--s2-bg); color:var(--s2-text);}
.badge-neutral{background:var(--n2); color:var(--n7);}
.row-action{color:var(--n6);}
.row-action:hover{color:var(--n8);}
.table-foot{padding:14px 16px; text-align:center; color:var(--n6); font-size:12px;}

/* ===== widget grid ===== */
.widget-grid{display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-top:14px;}
@media(max-width:1000px){ .widget-grid{grid-template-columns:1fr;} }
.widget-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:16px 18px;}
.widget-card h3{font-size:13px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.chart-wrap{position:relative; height:220px;}
.legend-row{display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--n7);}
.legend-dot{width:8px; height:8px; border-radius:2px;}

.owner-list{display:flex; flex-direction:column; gap:10px;}
.owner-row{display:flex; align-items:center; gap:10px;}
.avatar{width:28px; height:28px; border-radius:50%; background:var(--n2); color:var(--n7); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.owner-name{font-size:12.5px; font-weight:700;}
.owner-sub{font-size:11px; color:var(--n7);}
.owner-count{margin-left:auto; font-size:13px; font-weight:800;}

/* ===== crm / instructor list-style ===== */
.split-layout{display:grid; grid-template-columns:340px 1fr; gap:14px;}
@media(max-width:980px){ .split-layout{grid-template-columns:1fr;} }
.filter-panel{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:16px;}
.filter-panel .field{margin-bottom:12px;}
.filter-panel label{font-size:11.5px; font-weight:700; color:var(--n7); display:block; margin-bottom:6px;}
.filter-panel select, .filter-panel input{width:100%; border:1px solid var(--n3); border-radius:var(--radius-btn); padding:8px 10px; font-size:12.5px; background:var(--n0);}
.instructor-list{display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto;}
.instructor-item{display:flex; align-items:center; gap:10px; border:1px solid var(--n3); border-radius:var(--radius-btn); padding:10px 12px; text-align:left; width:100%; background:var(--n1);}
.instructor-item.selected{border-color:var(--n8); background:var(--n0);}
.instructor-name{font-size:12.5px; font-weight:700;}
.instructor-sub{font-size:11px; color:var(--n7);}
.status-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-left:auto;}

.calendar-card{background:var(--n1); border:1px solid var(--n3); border-radius:var(--radius-card); padding:16px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:12px;}
.cal-day-head{font-size:11px; font-weight:700; color:var(--n7); text-align:center;}
.cal-cell{border:1px dashed var(--n3); border-radius:8px; min-height:78px; padding:6px; font-size:11px; color:var(--n6); cursor:pointer;}
.cal-cell:hover{border-color:var(--n7); background:var(--n0);}
.cal-cell.has-slot{border-style:solid; border-color:var(--n3);}
.cal-slot{background:var(--n2); border-radius:6px; padding:4px 6px; font-size:10.5px; font-weight:700; color:var(--n8); margin-bottom:4px;}
.cal-slot.conflict{background:var(--s2-bg); color:var(--s2-text);}

/* ===== modal ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(20,18,16,.45); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--n1); border-radius:14px; width:560px; max-width:100%; max-height:88vh; overflow-y:auto; animation:modalIn .2s ease; box-shadow:0 30px 60px -15px rgba(20,18,16,.3);}
.modal.wide{width:720px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--n3);}
.modal-head h3{font-size:15px; font-weight:800;}
.modal-close{width:30px; height:30px; border-radius:50%; background:var(--n2); display:flex; align-items:center; justify-content:center; color:var(--n7);}
.modal-body{padding:20px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--n3);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.form-row.full{grid-template-columns:1fr;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--n7); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; border:1px solid var(--n3); border-radius:var(--radius-btn); padding:8px 10px; font-size:12.5px; background:var(--n0);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--n8);}

.cost-line{display:grid; grid-template-columns:1fr 130px; gap:10px; align-items:center; margin-bottom:8px;}
.cost-total-row{display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:8px; border-top:1px solid var(--n3);}
.cost-total-label{font-size:13px; font-weight:700; color:var(--n7);}
.cost-total-value{font-size:20px; font-weight:800; color:var(--n8);}

.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{display:flex; gap:12px; padding-bottom:16px; position:relative;}
.tl-item::before{content:''; position:absolute; left:5px; top:16px; bottom:0; width:1px; background:var(--n3);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:11px; height:11px; border-radius:50%; background:var(--n3); flex-shrink:0; margin-top:3px; z-index:1;}
.tl-dot.success{background:var(--s1);}
.tl-content{flex:1;}
.tl-title{font-size:12.5px; font-weight:700;}
.tl-date{font-size:11px; color:var(--n6); margin-top:1px;}

.toast{position:fixed; bottom:26px; left:calc(var(--sidebar-w) + (100% - var(--sidebar-w))/2); transform:translateX(-50%); background:var(--n8); color:#fff; padding:12px 20px; border-radius:var(--radius-btn); font-size:12.5px; font-weight:600; z-index:100; display:flex; align-items:center; gap:8px; animation:toastIn .25s ease;}

.conflict-warning{background:var(--s2-bg); color:var(--s2-text); border-radius:8px; padding:10px 12px; font-size:12px; font-weight:600; display:flex; gap:8px; align-items:flex-start; margin-top:10px;}
</style>
</head>
<body data-archetype="stripe-multipane">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;
const Ic = ({name, size=15, style={}}) => <i className={'ph ph-'+name} style={{fontSize:size, ...style}}></i>;

const STAGES = ['신규문의','상담중','견적작성','견적발송','협의중','계약완료','진행완료','취소'];
const STAGE_COLOR = {신규문의:'var(--m100)', 상담중:'var(--m200)', 견적작성:'var(--m300)', 견적발송:'var(--m400)', 협의중:'var(--m500)', 계약완료:'var(--m700)', 진행완료:'var(--m800)', 취소:'var(--n4)'};

function badgeClass(stage){
  if(stage==='계약완료' || stage==='진행완료') return 'badge badge-success';
  if(stage==='취소') return 'badge badge-danger';
  return 'badge badge-neutral';
}

const COMPANIES = ['브릿지웍스','한강푸드시스템','스텔라제약','그린모션모빌리티','위드파트너스','하나테라피그룹','대한스마트부품','클라우드나인HR','파인트리교육','오로라리테일','별빛물류','산들바람케어','코스모스전자','리버스톤금융'];

function seedQuotes(){
  return COMPANIES.map((c,i)=>({
    id: 1000+i,
    company: c,
    manager: ['김민수','이서연','박도현','최유진','정하늘'][i%5],
    program: ['신입사원 팀빌딩','조직문화 워크숍','리더십 코칭','체육대회 대행','AI 리터러시 특강'][i%5],
    amount: 800000 + (i%7)*350000,
    stage: STAGES[i % STAGES.length],
    updated: `2026.09.${String(10 + (i%18)).padStart(2,'0')}`,
    owner: ['김민수','이서연','박도현'][i%3],
    lines: [
      {label:'프로그램비', amount: 400000 + (i%5)*80000},
      {label:'강사료', amount: 250000 + (i%4)*60000},
      {label:'운영인력', amount: 120000},
      {label:'장소·장비', amount: i%2===0 ? 90000 : 0},
      {label:'식사', amount: i%3===0 ? 60000 : 0},
    ],
  }));
}

const INSTRUCTORS = [
  {id:1, name:'윤태호', field:'팀빌딩 퍼실리테이션', region:'서울', status:'가능', rate:'1일 80만원', rating:4.9, projects:38},
  {id:2, name:'서지민', field:'리더십 코칭', region:'서울', status:'일정있음', rate:'1일 95만원', rating:4.8, projects:27},
  {id:3, name:'한도윤', field:'커뮤니케이션 교육', region:'경기', status:'가능', rate:'1일 70만원', rating:4.7, projects:31},
  {id:4, name:'오세아', field:'AI 리터러시', region:'서울', status:'가능', rate:'1일 90만원', rating:4.9, projects:19},
  {id:5, name:'민지호', field:'체험 프로그램 진행', region:'강원', status:'휴면', rate:'1일 65만원', rating:4.6, projects:22},
  {id:6, name:'배소율', field:'조직문화 워크숍', region:'경기', status:'불가능', rate:'1일 85만원', rating:4.8, projects:24},
  {id:7, name:'천유나', field:'세대공감 커뮤니케이션', region:'서울', status:'일정있음', rate:'1일 75만원', rating:4.7, projects:16},
  {id:8, name:'강도현', field:'전략·문제해결 워크숍', region:'전국', status:'가능', rate:'1일 100만원', rating:4.9, projects:21},
];
const INSTRUCTOR_STATUS_DOT = {가능:'var(--s1)', 일정있음:'var(--n5)', 휴면:'var(--n4)', 불가능:'var(--s2)'};

function useIcons(){}

function Sparkline({data, color='var(--n5)', height=28}){
  const w = 100, h = height;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/(max-min||1))*h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Toast({message, onDone}){
  useEffect(()=>{ const t=setTimeout(onDone, 2300); return ()=>clearTimeout(t); }, [message]);
  return <div className="toast"><Ic name="check-circle" size={15}/>{message}</div>;
}

        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}

  );
}

const NEXT_STAGE = {신규문의:'상담중', 상담중:'견적작성', 견적작성:'견적발송', 견적발송:'협의중', 협의중:'계약완료', 계약완료:'진행완료'};

function QuoteDetailModal({quote, onClose, onUpdateStage, showToast}){
  const [lines, setLines] = useState(quote.lines);
  const total = lines.reduce((a,l)=>a+Number(l.amount||0),0);
  const setLine = (i, v) => setLines(ls=>ls.map((l,idx)=>idx===i?{...l, amount:v}:l));
  const nextStage = NEXT_STAGE[quote.stage];
  const canAdvance = !!nextStage;

  return (
    <Modal title={quote.company+' — 견적 상세'} wide onClose={onClose}
      footer={<React.Fragment>
        <button className="btn btn-secondary" onClick={onClose}>닫기</button>
        <button className="btn btn-secondary" onClick={()=>showToast('견적서 PDF가 생성되어 고객 이메일로 발송되었습니다.')}><Ic name="file-pdf" size={14}/>견적서 발송</button>
        <button className="btn btn-primary" disabled={!canAdvance} style={canAdvance?{}:{opacity:.4, cursor:'not-allowed'}}
          onClick={()=>{ if(canAdvance){ onUpdateStage(quote.id, nextStage); showToast(`상태가 '${nextStage}'(으)로 변경되었습니다.`);} }}>
          <Ic name="arrow-right" size={14}/>{canAdvance? `다음 단계 (${nextStage})` : '최종 단계'}
        </button>
      </React.Fragment>}>
      <div className="form-row">
        <div className="field"><label>담당자</label><input value={quote.manager} readOnly/></div>
        <div className="field"><label>현재 상태</label><input value={quote.stage} readOnly/></div>
      </div>
      <div className="form-row full"><div className="field"><label>프로그램</label><input value={quote.program} readOnly/></div></div>
      <h3 style={{fontSize:13, fontWeight:800, margin:'16px 0 10px'}}>비용 항목 구성 (자동 견적)</h3>
      {lines.map((l,i)=>(
        <div className="cost-line" key={i}>
          <div className="field" style={{marginBottom:0}}><label>{l.label}</label></div>
          <input type="number" value={l.amount} onChange={e=>setLine(i, e.target.value)} style={{border:'1px solid var(--n3)', borderRadius:'8px', padding:'8px 10px', fontSize:12.5}}/>
        </div>
      ))}
      <div className="cost-total-row">
        <span className="cost-total-label">견적 총액</span>
        <span className="cost-total-value">{total.toLocaleString()}원</span>
      </div>
    </Modal>
  );
}

  const chartRef = useRef(null);
  const [filterPartner, setFilterPartner] = useState('');
  const rows = SETTLEMENTS.map(s=>({...s, settle: s.revenue - s.fee - s.instructorFee - s.ops}));
  const filtered = rows.filter(r=>!filterPartner || r.partner===filterPartner);
  const totalSettle = filtered.reduce((a,r)=>a+r.settle,0);
  const waiting = filtered.filter(r=>r.status==='대기').length;

  useEffect(()=>{
    if(!chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');
    const chart = new Chart(ctx, {
      type:'bar',
      data:{
        labels:['5월','6월','7월','8월','9월'],
        datasets:[{ label:'정산 총액', data:[1820,2140,1990,2460,Math.round(totalSettle/10000)||2680],
          backgroundColor:'#ff5a00', borderRadius:6, maxBarThickness:34 }]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ y:{ grid:{color:'#f0f0ef'}, ticks:{callback:v=>v+'만'} }, x:{ grid:{display:false} } } }
    });
    return ()=>chart.destroy();
  }, [totalSettle]);

  return (
    <React.Fragment>
      <PageHeader title="자동 정산 및 파트너 정산관리" meta="진행완료 건은 정산 배치가 자동으로 수수료·강사료·운영비를 계산합니다."
        actions={<button className="btn btn-secondary" onClick={()=>showToast('정산 내역을 CSV 파일로 내보냈습니다.')}><Ic name="download-simple" size={14}/>CSV 내보내기</button>} />

      <div className="stat-row" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="stat-card"><div className="stat-label"><Ic name="wallet" size={13}/>이번달 총 정산액</div><div className="stat-value">{(totalSettle/10000).toFixed(0)}만</div><Sparkline data={[18,21,19,24,totalSettle/100000]} color="var(--m600)"/></div>
        <div className="stat-card"><div className="stat-label"><Ic name="handshake" size={13}/>파트너사 수</div><div className="stat-value">{new Set(rows.map(r=>r.partner)).size}</div><Sparkline data={[3,4,4,5,6]} /></div>
        <div className="stat-card"><div className="stat-label"><Ic name="hourglass-medium" size={13}/>지급 대기 건</div><div className="stat-value">{waiting}</div><Sparkline data={[2,3,2,4,waiting]} /></div>
      </div>

      <div className="widget-grid">
        <div className="widget-card">
          <h3><Ic name="chart-bar" size={14}/>월별 정산 추이</h3>
          <div className="chart-wrap"><canvas ref={chartRef}></canvas></div>
        </div>
        <div className="widget-card">
          <h3><Ic name="funnel" size={14}/>파트너사 필터</h3>
          <select value={filterPartner} onChange={e=>setFilterPartner(e.target.value)} style={{width:'100%', border:'1px solid var(--n3)', borderRadius:8, padding:'9px 10px', fontSize:12.5, marginBottom:10}}>
            <option value="">전체 파트너사</option>
            {[...new Set(rows.map(r=>r.partner))].map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <div className="owner-list">
            {[...new Set(rows.map(r=>r.partner))].slice(0,4).map(p=>(
              <div className="owner-row" key={p}>
                <span className="avatar">{p.charAt(0)}</span>
                <div><div className="owner-name">{p}</div><div className="owner-sub">정산 {rows.filter(r=>r.partner===p).length}건</div></div>
                <span className="owner-count">{(rows.filter(r=>r.partner===p).reduce((a,r)=>a+r.settle,0)/10000).toFixed(0)}만</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="data-section" style={{marginTop:14}}>
        <div className="data-toolbar"><strong style={{fontSize:13}}>정산 내역</strong></div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>파트너사</th><th>프로그램</th><th>진행일</th><th>매출</th><th>수수료</th><th>강사료</th><th>운영비</th><th>정산액</th><th>지급상태</th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td style={{fontWeight:700}}>{r.partner}</td>
                  <td>{r.program}</td>
                  <td>{r.date}</td>
                  <td>{r.revenue.toLocaleString()}원</td>
                  <td>{r.fee.toLocaleString()}원</td>
                  <td>{r.instructorFee.toLocaleString()}원</td>
                  <td>{r.ops.toLocaleString()}원</td>
                  <td style={{fontWeight:800}}>{r.settle.toLocaleString()}원</td>
                  <td><span className={r.status==='완료'?'badge badge-success':'badge badge-neutral'}>{r.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </React.Fragment>
  );
}

const WEEK_DAYS = ['월','화','수','목','금','토','일'];
function seedSchedule(){
  const s = {};
  s['1-윤태호'] = {instructor:'윤태호', title:'신입사원 팀빌딩'};
  s['3-서지민'] = {instructor:'서지민', title:'리더십 코칭'};
  s['4-한도윤'] = {instructor:'한도윤', title:'커뮤니케이션 교육'};
  s['5-오세아'] = {instructor:'오세아', title:'AI 특강'};
  return s;
}

function InstructorScheduleView({showToast}){
  const [regionFilter, setRegionFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [selectedInstructor, setSelectedInstructor] = useState(INSTRUCTORS[0]);
  const [schedule, setSchedule] = useState(seedSchedule());
  const [assignModal, setAssignModal] = useState(null);

  const filteredInstructors = INSTRUCTORS.filter(i=>(!regionFilter||i.region===regionFilter) && (!statusFilter||i.status===statusFilter));

  const openAssign = (day) => {
    const key = day+'-'+selectedInstructor.name;
    const conflict = Object.keys(schedule).some(k=>k.endsWith('-'+selectedInstructor.name) && k.startsWith(day+'-'));
    setAssignModal({day, key, conflict});
  };

  const confirmAssign = () => {
    if(assignModal.conflict){ showToast('이미 해당 요일에 배정된 일정이 있어 배정할 수 없습니다.'); setAssignModal(null); return; }
    setSchedule(s=>({...s, [assignModal.key]:{instructor:selectedInstructor.name, title:'신규 프로그램 배정'}}));
    showToast(`${selectedInstructor.name} 강사가 배정되었습니다.`);
    setAssignModal(null);
  };

  return (
    <React.Fragment>
      <PageHeader title="강사 DB 및 일정 매칭" meta="강사 상태와 프로그램 일정을 대조해 배정 충돌을 방지합니다."
        actions={<button className="btn btn-primary" onClick={()=>showToast('강사 등록 폼을 준비 중입니다.')}><Ic name="user-plus" size={14}/>강사 등록</button>} />
      <div className="split-layout">
        <div className="filter-panel">
          <div className="field"><label>활동지역</label>
            <select value={regionFilter} onChange={e=>setRegionFilter(e.target.value)}>
              <option value="">전체 지역</option><option>서울</option><option>경기</option><option>강원</option><option>전국</option>
            </select>
          </div>
          <div className="field"><label>상태</label>
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
              <option value="">전체 상태</option><option>가능</option><option>일정있음</option><option>휴면</option><option>불가능</option>
            </select>
          </div>
          <div className="instructor-list">
            {filteredInstructors.map(ins=>(
              <button key={ins.id} className={'instructor-item'+(selectedInstructor.id===ins.id?' selected':'')} onClick={()=>setSelectedInstructor(ins)}>
                <span className="avatar">{ins.name.charAt(0)}</span>
                <div style={{flex:1, textAlign:'left'}}>
                  <div className="instructor-name">{ins.name}</div>
                  <div className="instructor-sub">{ins.field} · {ins.region} · ★{ins.rating}</div>
                </div>
                <span className="status-dot" style={{background:INSTRUCTOR_STATUS_DOT[ins.status]}}></span>
              </button>
            ))}
          </div>
        </div>
        <div className="calendar-card">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <h3 style={{fontSize:13.5, fontWeight:800}}><Ic name="calendar-check" size={14}/> {selectedInstructor.name} 강사 배정 캘린더 — 이번 주</h3>
            <span className="badge badge-neutral">기본 강사료 {selectedInstructor.rate}</span>
          </div>
          <div className="cal-grid">
            {WEEK_DAYS.map((d,i)=><div key={d} className="cal-day-head">{d}</div>)}
            {WEEK_DAYS.map((d,i)=>{
              const dayNum = i+1;
              const entries = Object.entries(schedule).filter(([k])=>k.startsWith(dayNum+'-'));
              return (
                <div key={d} className={'cal-cell'+(entries.length?' has-slot':'')} onClick={()=>openAssign(dayNum)}>
                  {entries.map(([k,v])=>(
                    <div key={k} className={'cal-slot'+(v.instructor===selectedInstructor.name?'':'')}>{v.instructor} · {v.title}</div>
                  ))}
                  {entries.length===0 && <span style={{opacity:.5}}>+ 배정</span>}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {assignModal && (
        <Modal title="강사 배정" onClose={()=>setAssignModal(null)}
          footer={<React.Fragment>
            <button className="btn btn-secondary" onClick={()=>setAssignModal(null)}>취소</button>
            <button className="btn btn-primary" onClick={confirmAssign}><Ic name="check" size={14}/>배정 확정</button>
          </React.Fragment>}>
          <div className="form-row full"><div className="field"><label>강사</label><input value={selectedInstructor.name+' · '+selectedInstructor.field} readOnly/></div></div>
          <div className="form-row full"><div className="field"><label>배정 요일</label><input value={WEEK_DAYS[assignModal.day-1]+'요일'} readOnly/></div></div>
          {assignModal.conflict ? (
            <div className="conflict-warning"><Ic name="warning-circle" size={16}/>선택한 요일에 이미 이 강사의 일정이 있습니다. 다른 요일을 선택하거나 다른 강사를 배정해주세요.</div>
          ) : (
            <div className="conflict-warning" style={{background:'var(--s1-bg)', color:'var(--s1-text)'}}><Ic name="check-circle" size={16}/>선택한 요일에 일정 충돌이 없습니다. 배정을 진행할 수 있습니다.</div>
          )}
        </Modal>
      )}
    </React.Fragment>
  );
}

function App(){
  const [view, setView] = useState('main');
  const [quotes, setQuotes] = useState(seedQuotes());
  const [toast, setToast] = useState(null);
  const showToast = (msg) => setToast(msg);

  return (
    <div style={{display:'flex', width:'100%', minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView}/>
      <main className="main-wrap">
        {view==='main' && <QuoteDashboard quotes={quotes} setQuotes={setQuotes} showToast={showToast}/>}
        {view==='crm' && <CrmView showToast={showToast}/>}
        {view==='settlement' && <SettlementView showToast={showToast}/>}
        {view==='instructor-schedule' && <InstructorScheduleView showToast={showToast}/>}
      </main>
      {toast && <Toast message={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
