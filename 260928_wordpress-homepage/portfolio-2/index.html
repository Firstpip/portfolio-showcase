<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오·인사이트 콘텐츠 관리 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (hue 265°, dark) ── */
:root{
  --m50:#f3eff9; --m100:#e8e0f4; --m200:#d1c0e8; --m300:#b59adb; --m400:#9570cb;
  --m500:#7847bd; --m600:#5a1fae; --m700:#4a198f; --m800:#3a146f; --m900:#280e4e;
  --n0:#1e1e20; --n1:#17171a; --n2:#56535a; --n3:#74717a; --n4:#939098; --n5:#9a9aa1;
  --n6:#d6d5d7; --n7:#e5e5e6; --n8:#f0eff0; --n9:#f5f5f6; --n10:#fcfcfd;
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf;
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686;
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586;
  --radius-panel:4px; --radius-btn:6px; --radius-pill:999px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body,#root{width:100%; height:100%;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--n0); color:var(--n8); line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--n3); border-radius:4px;}

.app-shell{display:flex; width:100%; height:100vh;}

/* ── 트리 사이드바 (notion-blocks-tree 시그니처) ── */
.tree-sidebar{position:fixed; left:0; top:0; bottom:0; width:252px; background:var(--n1); border-right:1px solid var(--n2); display:flex; flex-direction:column; z-index:20;}
.sidebar-brand{display:flex; align-items:center; gap:8px; padding:16px 16px 12px; font-size:14px; font-weight:700; color:var(--n9); border-bottom:1px solid var(--n2);}
.sidebar-brand i{color:var(--m400);}
.sidebar-search{display:flex; gap:6px; padding:12px 12px 8px;}
.search-btn, .quick-add{flex:1; display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--n5); background:var(--n0); border:1px solid var(--n2); border-radius:var(--radius-panel); padding:8px 10px; transition:border-color .15s ease;}
.search-btn:hover, .quick-add:hover{border-color:var(--n4); color:var(--n7);}
.tree-nav{flex:1; overflow-y:auto; padding:6px 8px;}
.tree-item{display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:var(--radius-panel); font-size:13px; color:var(--n6); cursor:pointer; transition:background .12s ease, color .12s ease;}
.tree-item:hover{background:var(--n2); color:var(--n8);}
.tree-item.active{background:var(--m900); color:var(--m200);}
.tree-item.section-label{color:var(--n4); font-size:11px; font-weight:700; letter-spacing:.05em; cursor:default; margin-top:10px;}
.tree-item.section-label:hover{background:none; color:var(--n4);}
.tree-toggle{width:14px; flex-shrink:0; color:var(--n4); display:flex; align-items:center; justify-content:center;}
.tree-toggle-placeholder{width:14px; flex-shrink:0;}
.tree-icon{width:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--n4);}
.tree-item.active .tree-icon{color:var(--m300);}
.tree-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tree-badge{font-size:10px; padding:1px 6px; border-radius:var(--radius-pill); background:var(--n2); color:var(--n5);}
.sidebar-footer{padding:10px 12px; border-top:1px solid var(--n2); display:flex; flex-direction:column; gap:2px;}
.footer-link{display:flex; align-items:center; gap:8px; padding:7px 8px; font-size:12.5px; color:var(--n5); border-radius:var(--radius-panel);}
.footer-link:hover{background:var(--n2); color:var(--n8);}

/* ── 메인 페이지 영역 ── */
.page{margin-left:252px; flex:1; min-width:0; width:calc(100% - 252px); height:100vh; overflow-y:auto; background:var(--n0);}
.page-breadcrumb{display:flex; align-items:center; gap:6px; padding:16px 32px; font-size:12.5px; color:var(--n4); border-bottom:1px solid var(--n1);}
.page-breadcrumb a{color:var(--n5);}
.page-breadcrumb .current{color:var(--n8); font-weight:600;}
.page-cover{height:184px; margin:0 32px; border-radius:var(--radius-panel); background:linear-gradient(125deg, var(--m900) 0%, var(--m700) 40%, var(--m500) 78%, var(--m300) 100%); margin-top:16px; position:relative; overflow:hidden;}
.page-cover::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 88% 18%, rgba(255,255,255,.22), transparent 46%); mix-blend-mode:screen;}
.page-cover::after{content:''; position:absolute; left:-8%; bottom:-42%; width:70%; height:120%; border-radius:50%; border:1px solid rgba(255,255,255,.16); }
.page-body{max-width:840px; margin:0 auto; padding:24px 32px 80px;}
.page-icon-row{display:flex; align-items:center; justify-content:space-between; margin-top:8px; margin-bottom:6px;}
.page-icon-large{width:52px; height:52px; border-radius:var(--radius-panel); background:var(--m900); color:var(--m200); display:flex; align-items:center; justify-content:center; font-size:26px;}
.page-meta{display:flex; gap:6px;}
.meta-action{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--n5); padding:6px 10px; border-radius:var(--radius-panel);}
.meta-action:hover{background:var(--n1); color:var(--n8);}
.page-title{font-size:40px; line-height:1.1; font-weight:700; color:var(--n9); margin:14px 0 28px; letter-spacing:-0.015em;}

/* ── 블록 ── */
.block-list{display:flex; flex-direction:column; gap:2px;}
.block{position:relative; padding:6px 4px; border-radius:var(--radius-panel); display:flex; gap:10px;}
.block:hover{background:var(--n1);}
.block:hover .block-handle, .block:hover .block-add{opacity:1;}
.block-handle{position:absolute; left:-30px; top:8px; opacity:0; color:var(--n4); font-size:13px; cursor:grab; transition:opacity .12s ease;}
.block-add{position:absolute; left:-52px; top:8px; opacity:0; color:var(--n4); font-size:14px; transition:opacity .12s ease;}
.block-add:hover, .block-handle:hover{color:var(--n7);}
.block-toolbar{margin-left:auto; display:none; gap:4px; align-items:flex-start; padding-top:4px;}
.block:hover .block-toolbar{display:flex;}
.block-toolbar button{width:22px; height:22px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--n4); font-size:12px;}
.block-toolbar button:hover{background:var(--n2); color:var(--n8);}
.block-text p{font-size:15px; color:var(--n7); line-height:1.7;}
.block-heading h2{font-size:22px; font-weight:700; color:var(--n9); margin-top:4px;}
.block-toggle{flex-direction:column;}
.toggle-row{display:flex; align-items:center; gap:8px; cursor:pointer;}
.toggle-arrow{color:var(--n4); font-size:11px; transition:transform .15s ease;}
.toggle-arrow.open{transform:rotate(90deg);}
.toggle-summary{font-size:15px; color:var(--n8); font-weight:600;}
.toggle-content{margin-left:20px; margin-top:8px; padding:12px 14px; background:var(--n1); border-radius:var(--radius-panel); font-size:13.5px; color:var(--n6); display:none;}
.toggle-content.open{display:block;}
.block-callout{background:var(--m900); border-left:3px solid var(--m400); padding:12px 14px; border-radius:var(--radius-panel); align-items:flex-start;}
.block-callout i{color:var(--m300); margin-top:2px;}
.block-callout p{font-size:13.5px; color:var(--m100);}
.block-checklist{flex-direction:column; gap:6px;}
.check-row{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--n7);}
.check-row i{color:var(--n4); cursor:pointer;}
.check-row.done{color:var(--n5); text-decoration:line-through;}
.check-row.done i{color:var(--s1);}
.block-divider hr{border:none; border-top:1px solid var(--n2); margin:10px 0; width:100%;}
.block-image img{width:100%; border-radius:var(--radius-panel); border:1px solid var(--n2);}
.block-table{flex-direction:column;}
.block-table table{width:100%; border-collapse:collapse; font-size:13px;}
.block-table th{text-align:left; color:var(--n4); font-weight:600; font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--n2);}
.block-table td{padding:8px; border-bottom:1px solid var(--n1); color:var(--n7);}
.slash-empty{width:100%; padding:6px 8px; font-size:14px; color:var(--n4); border-radius:var(--radius-panel); cursor:text; border:1px dashed transparent;}
.slash-empty:hover{border-color:var(--n2);}
.slash-menu{position:absolute; top:100%; left:8px; margin-top:4px; width:220px; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); box-shadow:0 12px 28px rgba(0,0,0,.45); z-index:30; padding:6px;}
.slash-group-title{font-size:10.5px; color:var(--n4); font-weight:700; letter-spacing:.05em; padding:6px 8px 2px;}
.slash-item{display:flex; align-items:center; gap:8px; padding:8px; font-size:13px; color:var(--n7); border-radius:4px;}
.slash-item:hover{background:var(--m900); color:var(--m100);}

/* ── 표(work 관리 테이블) ── */
.rich-table{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); overflow:hidden; margin:8px 0 4px;}
.rt-head{display:grid; grid-template-columns:28px 56px 1.6fr 100px 110px 90px; gap:10px; padding:9px 12px; font-size:11px; color:var(--n4); font-weight:700; border-bottom:1px solid var(--n2);}
.rt-row{display:grid; grid-template-columns:28px 56px 1.6fr 100px 110px 90px; gap:10px; padding:11px 12px; align-items:center; border-bottom:1px solid var(--n1); font-size:13px; color:var(--n7); cursor:pointer; transition:background .12s ease;}
.rt-row:last-child{border-bottom:none;}
.rt-row:hover{background:var(--n2);}
.rt-row.dragging{opacity:.4;}
.rt-drag{color:var(--n4); cursor:grab; font-size:14px;}
.rt-thumb{width:44px; height:32px; border-radius:4px; object-fit:cover; border:1px solid var(--n2);}
.rt-title{color:var(--n8); font-weight:600;}
.status-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill);}
.status-chip.published{background:var(--s1-bg); color:var(--s1-text);}
.status-chip.draft{background:var(--n2); color:var(--n6);}
.lang-progress{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--n5);}
.lang-bar{width:48px; height:5px; border-radius:var(--radius-pill); background:var(--n2); overflow:hidden;}
.lang-bar-fill{height:100%; background:var(--m400); border-radius:var(--radius-pill);}
.rt-actions{display:flex; gap:6px; justify-content:flex-end;}
.rt-actions button{width:26px; height:26px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--n4);}
.rt-actions button:hover{background:var(--n0); color:var(--n8);}
.rt-detail{grid-column:1/-1; background:var(--n0); border-top:1px solid var(--n2); padding:18px 16px; display:grid; grid-template-columns:1fr 1fr; gap:20px; animation:fadeInUp .25s ease both;}
.rt-detail-field label{display:block; font-size:11px; color:var(--n4); font-weight:600; margin-bottom:6px;}
.rt-detail-field input, .rt-detail-field select{width:100%; padding:8px 10px; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); color:var(--n8); font-size:13px;}
.dropzone{border:1.5px dashed var(--n3); border-radius:var(--radius-panel); padding:20px; text-align:center; color:var(--n5); font-size:12.5px; cursor:pointer;}
.dropzone:hover{border-color:var(--m400); color:var(--m200);}
.progress-track{height:6px; background:var(--n2); border-radius:var(--radius-pill); overflow:hidden; margin-top:10px;}
.progress-fill{height:100%; background:var(--m500); border-radius:var(--radius-pill); transition:width .12s linear;}

/* ── 버튼/뱃지 공통 ── */
.btn{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; padding:9px 18px; border-radius:var(--radius-pill); transition:background .15s ease, transform .1s ease;}
.btn-primary{background:var(--m500); color:#ffffff;}
.btn-primary:hover{background:var(--m400);}
.btn-outline{background:transparent; border:1px solid var(--n3); color:var(--n7);}
.btn-outline:hover{border-color:var(--n5); color:var(--n9);}
.btn-sm{padding:6px 14px; font-size:12px;}
.thumb-chip{width:64px; height:64px; border-radius:var(--radius-panel); overflow:hidden; border:1px solid var(--n2); position:relative;}
.thumb-chip img{width:100%; height:100%; object-fit:cover;}

/* ── 댓글 drawer ── */
.drawer-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed; top:0; right:-360px; width:340px; height:100vh; background:var(--n1); border-left:1px solid var(--n2); z-index:91; transition:right .25s ease; display:flex; flex-direction:column;}
.drawer.open{right:0;}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--n2);}
.drawer-head h3{font-size:14px; color:var(--n9);}
.drawer-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px;}
.comment-item{display:flex; gap:10px;}
.avatar{width:28px; height:28px; border-radius:50%; background:var(--n2); color:var(--n6); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.comment-body{font-size:12.5px; color:var(--n6); background:var(--n0); border-radius:var(--radius-panel); padding:10px 12px;}
.comment-body strong{color:var(--n8); display:block; margin-bottom:3px; font-size:12.5px;}

/* ── i18n/SEO 페이지 ── */
.seo-grid{display:grid; grid-template-columns:1fr 340px; gap:24px; margin-top:8px;}
.lang-tabs{display:inline-flex; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-pill); padding:3px; margin-bottom:20px;}
.lang-tab{padding:7px 20px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:600; color:var(--n5);}
.lang-tab.active{background:var(--m600); color:#ffffff;}
.seo-field{margin-bottom:18px;}
.seo-field label{display:flex; justify-content:space-between; font-size:12px; color:var(--n5); margin-bottom:7px; font-weight:600;}
.char-count{color:var(--n4);}
.char-count.warn{color:var(--s3-text);}
.seo-field input, .seo-field textarea{width:100%; padding:10px 12px; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); color:var(--n8); font-size:13.5px;}
.seo-field textarea{min-height:76px; resize:vertical;}
.og-preview{border:1px solid var(--n2); border-radius:var(--radius-panel); overflow:hidden; background:var(--n1); position:sticky; top:16px;}
.og-preview img{width:100%; aspect-ratio:1.91/1; object-fit:cover;}
.og-preview-body{padding:12px 14px;}
.og-domain{font-size:11px; color:var(--n4); text-transform:uppercase; letter-spacing:.03em;}
.og-title{font-size:14px; color:var(--n9); font-weight:600; margin:4px 0 2px;}
.og-desc{font-size:12px; color:var(--n5); line-height:1.4;}
.translation-badges{display:flex; gap:10px; margin-top:18px;}
.tbadge{flex:1; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); padding:12px; text-align:center;}
.tbadge-val{font-size:20px; font-weight:700; color:var(--n9);}
.tbadge-label{font-size:11px; color:var(--n5); margin-top:2px;}

/* ── analytics 페이지 ── */
.kpi-strip{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.kpi-pill{display:flex; align-items:center; gap:8px; background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-pill); padding:8px 16px; font-size:12.5px; color:var(--n6);}
.kpi-pill strong{color:var(--n9); font-size:14px;}
.chart-card{background:var(--n1); border:1px solid var(--n2); border-radius:var(--radius-panel); padding:18px 20px; margin-bottom:18px;}
.chart-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.chart-card-head h3{font-size:14px; color:var(--n9); font-weight:700;}
.period-toggle{display:flex; gap:4px; background:var(--n0); border-radius:var(--radius-pill); padding:3px;}
.period-btn{padding:5px 12px; font-size:11.5px; border-radius:var(--radius-pill); color:var(--n5);}
.period-btn.active{background:var(--m600); color:#ffffff;}
.chart-wrap{height:240px; position:relative;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.queue-item{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--n2); font-size:13px;}
.queue-item:last-child{border-bottom:none;}
.queue-time{background:var(--n2); color:var(--n7); font-size:11px; padding:4px 9px; border-radius:var(--radius-pill); flex-shrink:0;}

/* ── 토스트 ── */
.toast{position:fixed; bottom:24px; left:calc(252px + 32px); background:var(--n9); color:var(--n1); padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:200;}
.toast.show{opacity:1; transform:translateY(0);}
.toast i{color:var(--s1);}

@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes spin{ from{transform:rotate(0);} to{transform:rotate(360deg);} }
@keyframes pillPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(90,31,174,.4);} 50%{box-shadow:0 0 0 6px rgba(90,31,174,0);} }
.spin-icon{animation:spin 1s linear infinite;}
.pulse-live{animation:pillPulse 2s ease-in-out infinite;}

@media (max-width:1100px){ .seo-grid{grid-template-columns:1fr;} .two-col{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
const { PieChart, Pie, Cell, ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip, CartesianGrid } = Recharts;

const M = { 50:'#f3eff9',100:'#e8e0f4',200:'#d1c0e8',300:'#b59adb',400:'#9570cb',500:'#7847bd',600:'#5a1fae',700:'#4a198f',800:'#3a146f',900:'#280e4e' };
const N = { 0:'#1e1e20',1:'#17171a',2:'#56535a',3:'#74717a',4:'#939098',5:'#9a9aa1',6:'#d6d5d7',7:'#e5e5e6',8:'#f0eff0',9:'#f5f5f6',10:'#fcfcfd' };

const INITIAL_WORKS = [
  { id:1, order:1, title:'그린리프 유기농 브랜드 리뉴얼', status:'published', koPct:100, enPct:100, img:'https://picsum.photos/seed/cms-work-1/120/90' },
  { id:2, order:2, title:'뉴텍스 산업 장비 소개 사이트', status:'published', koPct:100, enPct:80, img:'https://picsum.photos/seed/cms-work-2/120/90' },
  { id:3, order:3, title:'클로버핀 금융 서비스 랜딩', status:'draft', koPct:100, enPct:20, img:'https://picsum.photos/seed/cms-work-3/120/90' },
  { id:4, order:4, title:'모먼트베이 호스피탈리티 그룹', status:'published', koPct:100, enPct:60, img:'https://picsum.photos/seed/cms-work-4/120/90' },
  { id:5, order:5, title:'루멘스튜디오 포트폴리오 사이트', status:'draft', koPct:70, enPct:0, img:'https://picsum.photos/seed/cms-work-5/120/90' },
];

const INITIAL_THUMBS = [

function useToast(){
  const [msg, setMsg] = useState(null);
  const timerRef = useRef(null);
  const show = (text) => {
    setMsg(text);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setMsg(null), 2600);
  };
  return { msg, show };
}

function MainPage({ works, setWorks, selectedWorkId, setSelectedWorkId, toast, setActivePage }){

  const [commentsOpen, setCommentsOpen] = useState(false);
  const [advOpen, setAdvOpen] = useState(false);
  const [dragId, setDragId] = useState(null);
  const [thumbs, setThumbs] = useState(INITIAL_THUMBS);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);

  const sorted = [...works].sort((a,b) => a.order - b.order);

  const onDrop = (targetId) => {
    if (dragId === null || dragId === targetId) { setDragId(null); return; }
    const list = [...sorted];
    const from = list.findIndex(w => w.id === dragId);
    const to = list.findIndex(w => w.id === targetId);
    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    const renum = list.map((w, i) => ({ ...w, order: i + 1 }));
    setWorks(renum);
    setDragId(null);
    toast.show('게시글 순서가 변경되었습니다');
  };

  const toggleStatus = (id) => {
    setWorks(works.map(w => w.id === id ? { ...w, status: w.status === 'published' ? 'draft' : 'published' } : w));
  };

  const startUpload = () => {
    setUploading(true); setProgress(0);
    const iv = setInterval(() => {
      setProgress(p => {
        if (p >= 100) {
          clearInterval(iv);
          setUploading(false);
          setThumbs(t => [...t, `https://picsum.photos/seed/cms-thumb-new-${Date.now()}/120/120`]);
          toast.show('이미지 업로드가 완료되었습니다');
          return 0;
        }
        return p + 14;
      });

            <div className="rt-head">

            </div>
            {sorted.map(w => (
              <React.Fragment key={w.id}>
                <div className={`rt-row ${dragId === w.id ? 'dragging' : ''}`}

                  </span>

                    <button onClick={() => toggleStatus(w.id)} title="게시 상태 전환"><Icon name="arrows-clockwise" /></button>

                          )}
                        </div>
                      </div>
                    </div>
                    <div style={{gridColumn:'1/-1', display:'flex', justifyContent:'flex-end', gap:8}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setSelectedWorkId(null)}>취소</button>
                      <button className="btn btn-primary btn-sm" onClick={() => { toast.show('게시글 정보가 저장되었습니다'); setSelectedWorkId(null); }}>저장</button>
                    </div>
                  </div>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>

        <div className="block block-divider"><hr /></div>

        <div className="block block-toggle">
          <div className="toggle-row" onClick={() => setAdvOpen(!advOpen)}>
            <span className={`toggle-arrow ${advOpen ? 'open' : ''}`}><Icon name="caret-right" /></span>
            <span className="toggle-summary">고급 옵션</span>
          </div>
          <div className={`toggle-content ${advOpen ? 'open' : ''}`}>
            SEO 메타 설정과 언어별 번역 진행률은 다국어·SEO 관리 화면에서 한 번에 편집할 수 있습니다.
            <div style={{marginTop:10}}>
              <button className="btn btn-outline btn-sm" onClick={() => setActivePage('i18n-seo')}><Icon name="arrow-square-out" /> 다국어·SEO 관리로 이동</button>
            </div>
          </div>
        </div>

        <div className="block block-heading"><h2>최근 업로드 이미지</h2></div>
        <div className="block" style={{gap:10, flexWrap:'wrap'}}>
          {thumbs.map((t, i) => (
            <div className="thumb-chip" key={i} style={{position:'relative'}}>
              <img src={t} alt="" />
              <button onClick={() => removeThumb(i)} style={{position:'absolute', top:2, right:2, width:18, height:18, background:'rgba(0,0,0,.55)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                <Icon name="x" style={{fontSize:10, color:'#ffffff'}} />
              </button>

          ))}

      <div className={`drawer-overlay ${commentsOpen ? 'open' : ''}`} onClick={() => setCommentsOpen(false)}></div>

          <h3>댓글</h3>
          <button onClick={() => setCommentsOpen(false)}><Icon name="x" /></button>
        </div>
        <div className="drawer-body">
          <div className="comment-item">
            <div className="avatar">이</div>
            <div className="comment-body"><strong>이지은</strong>대표 이미지가 새 브랜드 컬러와 더 잘 어울리도록 톤을 조정해주세요.</div>
          </div>
          <div className="comment-item">
            <div className="avatar">박</div>
            <div className="comment-body"><strong>박서준</strong>영문 번역본 검수 요청드립니다. 제목 문구만 확인 부탁드려요.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

  { type:'checklist', label:'체크박스', icon:'check-square' },
  { type:'callout', label:'콜아웃', icon:'megaphone' },
  { type:'toggle', label:'토글', icon:'caret-right' },
  { type:'table', label:'표', icon:'table' },

];

function EditorPage({ toast }){
  const [blocks, setBlocks] = useState([
    { id:1, type:'heading', content:'Work 상세 페이지 — 그린리프 유기농 브랜드' },
    { id:2, type:'text', content:'브랜드 리뉴얼 배경과 목표를 소개하는 도입부 문단입니다. 클라이언트의 요청 사항과 핵심 방향성을 정리합니다.' },
    { id:3, type:'callout', content:'이 프로젝트는 스크롤 인터랙션과 반응형 퍼블리싱을 핵심 과제로 진행합니다.' },
    { id:4, type:'image', content:'https://picsum.photos/seed/cms-editor-1/720/380' },
    { id:5, type:'toggle', summary:'프로젝트 상세 스펙', content:'페이지 수 7개, 사용 언어 2종(KR/EN), 반응형 브레이크포인트 3단계, 예상 작업 기간 8주.', open:false },
    { id:6, type:'checklist', items:[ {text:'정보구조 설계', done:true}, {text:'스크롤 모션 프로토타입', done:true}, {text:'다국어 콘텐츠 입력', done:false} ] },
    { id:7, type:'table' },
    { id:8, type:'divider' },
    { id:9, type:'text', content:'' },
  ]);
  const [slashOpenId, setSlashOpenId] = useState(null);

  const addBlockAfter = (id, type) => {
    const newBlock = { id: Date.now(), type, content: type === 'callout' ? '새 콜아웃 메모' : '', items: type === 'checklist' ? [{text:'새 항목', done:false}] : undefined };
    const idx = blocks.findIndex(b => b.id === id);
    const next = [...blocks];
    next.splice(idx + 1, 0, newBlock);
    setBlocks(next);
    setSlashOpenId(null);
    toast.show('블록이 추가되었습니다');
  };
  const insertFromEmpty = (id, type) => {
    setBlocks(blocks.map(b => b.id === id ? { type, content:'', items: type === 'checklist' ? [{text:'새 항목', done:false}] : undefined } : b).map(b => ({...b, id: b.id})));
    setSlashOpenId(null);
  };
  const removeBlock = (id) => setBlocks(blocks.filter(b => b.id !== id));
  const duplicateBlock = (id) => {
    const b = blocks.find(x => x.id === id);
    const idx = blocks.findIndex(x => x.id === id);
    const clone = { ...b, id: Date.now() };
    const next = [...blocks];
    next.splice(idx + 1, 0, clone);
    setBlocks(next);
  };
  const toggleOpen = (id) => setBlocks(blocks.map(b => b.id === id ? { ...b, open: !b.open } : b));
  const toggleCheck = (id, i) => setBlocks(blocks.map(b => {
    if (b.id !== id) return b;
    const items = b.items.map((it, idx2) => idx2 === i ? { ...it, done: !it.done } : it);
    return { ...b, items };
  }));

  const renderBlock = (b) => {
    switch (b.type) {
      case 'heading':
        return <div className="block-heading"><h2>{b.content}</h2></div>;
      case 'text':
        if (!b.content) {
          return (
            <div style={{position:'relative', width:'100%'}}>
              <div className="slash-empty" onClick={() => setSlashOpenId(slashOpenId === b.id ? null : b.id)}>빈 블록 — 클릭해서 / 명령 입력…</div>
              {slashOpenId === b.id && (
                <div className="slash-menu">
                  <div className="slash-group-title">블록 삽입</div>
                  {BLOCK_TYPES.map(bt => (
                    <div className="slash-item" key={bt.type} onClick={() => insertFromEmpty(b.id, bt.type)}>
                      <Icon name={bt.icon} /> {bt.label}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }
        return <div className="block-text"><p>{b.content}</p></div>;
      case 'callout':
        return <div className="block-callout"><Icon name="megaphone" /><p>{b.content}</p></div>;
      case 'image':
        return <div className="block-image"><img src={b.content} alt="" /></div>;
      case 'toggle':
        return (
          <div className="block-toggle">
            <div className="toggle-row" onClick={() => toggleOpen(b.id)}>
              <span className={`toggle-arrow ${b.open ? 'open' : ''}`}><Icon name="caret-right" /></span>
              <span className="toggle-summary">{b.summary}</span>
            </div>
            <div className={`toggle-content ${b.open ? 'open' : ''}`}>{b.content}</div>
          </div>
        );
      case 'checklist':
        return (
          <div className="block-checklist">
            {b.items.map((it, i) => (
              <div key={i} className={`check-row ${it.done ? 'done' : ''}`} onClick={() => toggleCheck(b.id, i)}>
                <Icon name={it.done ? 'check-square' : 'square'} /> {it.text}
              </div>
            ))}
          </div>
        );
      case 'table':
        return (
          <div className="block-table">
            <table>
              <thead><tr><th>블록 타입</th><th>용도</th><th>상태</th></tr></thead>
              <tbody>
                <tr><td>텍스트</td><td>본문 서술</td><td>사용중</td></tr>
                <tr><td>이미지</td><td>대표/갤러리 이미지</td><td>사용중</td></tr>
                <tr><td>콜아웃</td><td>강조 메모</td><td>사용중</td></tr>
              </tbody>
            </table>
          </div>
        );
      case 'divider':
        return <div className="block-divider"><hr /></div>;
      default:
        return null;
    }
  };

  return (
    <div className="page-body">
      <div className="page-icon-row">
        <div className="page-icon-large"><Icon name="puzzle-piece" /></div>
        <div className="page-meta">
          <button className="meta-action" onClick={() => toast.show('임시 저장되었습니다')}><Icon name="floppy-disk" /> 임시 저장</button>
        </div>
      </div>
      <h1 className="page-title">블록 기반 콘텐츠 에디터</h1>
      <div className="block-list">
        {blocks.map(b => (
          <div className="block" key={b.id}>
            <span className="block-handle"><Icon name="dots-six-vertical" /></span>
            <span className="block-add" onClick={() => addBlockAfter(b.id, 'text')}><Icon name="plus" /></span>
            {renderBlock(b)}
            <div className="block-toolbar">
              <button onClick={() => duplicateBlock(b.id)} title="복제"><Icon name="copy" /></button>
              <button onClick={() => removeBlock(b.id)} title="삭제"><Icon name="trash" /></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function I18nSeoPage({ works, toast }){
  const [langTab, setLangTab] = useState('ko');
  const [selectedId, setSelectedId] = useState(works[0].id);
  const [meta, setMeta] = useState({
    ko: { title:'그린리프 유기농 브랜드 리뉴얼 | 하일로 스튜디오', desc:'유기농 식품 브랜드의 아이덴티티를 재정립하고 반응형 홈페이지로 확장한 프로젝트입니다.' },
    en: { title:'', desc:'' },
  });
  const active = works.find(w => w.id === selectedId) || works[0];
  const current = meta[langTab];
  const titleLen = current.title.length;
  const descLen = current.desc.length;

  const update = (field, val) => setMeta(m => ({ ...m, [langTab]: { ...m[langTab], [field]: val } }));

  return (
    <div className="page-body">
      <div className="page-icon-row">
        <div className="page-icon-large"><Icon name="globe" /></div>
        <div className="page-meta">
          <button className="meta-action" onClick={() => toast.show('SEO 메타 정보가 저장되었습니다')}><Icon name="floppy-disk" /> 저장</button>
        </div>
      </div>
      <h1 className="page-title">다국어 콘텐츠 관리 & SEO 메타 설정</h1>

      <div style={{marginBottom:18}}>
        <select value={selectedId} onChange={(e) => setSelectedId(Number(e.target.value))}
          style={{padding:'9px 12px', background:'var(--n1)', border:'1px solid var(--n2)', borderRadius:'var(--radius-panel)', color:'var(--n8)', fontSize:13}}>
          {works.map(w => <option key={w.id} value={w.id}>{w.title}</option>)}
        </select>
      </div>

      <div className="lang-tabs">
        <button className={`lang-tab ${langTab === 'ko' ? 'active' : ''}`} onClick={() => setLangTab('ko')}>한국어</button>
        <button className={`lang-tab ${langTab === 'en' ? 'active' : ''}`} onClick={() => setLangTab('en')}>English</button>
      </div>

      <div className="seo-grid">
        <div>
          <div className="seo-field">
            <label><span>메타 타이틀</span><span className={`char-count ${titleLen > 60 ? 'warn' : ''}`}>{titleLen}/60</span></label>
            <input value={current.title} onChange={(e) => update('title', e.target.value)} placeholder={langTab === 'en' ? 'Enter English title…' : '페이지 타이틀을 입력하세요'} />
          </div>
          <div className="seo-field">
            <label><span>메타 설명</span><span className={`char-count ${descLen > 155 ? 'warn' : ''}`}>{descLen}/155</span></label>
            <textarea value={current.desc} onChange={(e) => update('desc', e.target.value)} placeholder={langTab === 'en' ? 'Enter English description…' : '검색 결과에 노출될 설명을 입력하세요'} />
          </div>
          <div className="seo-field">
            <label>OG 이미지</label>
            <div className="dropzone" onClick={() => toast.show('OG 이미지가 교체되었습니다')}><Icon name="upload-simple" /> 클릭해서 OG 이미지 업로드 (권장 1200×630)</div>
          </div>
          <div className="translation-badges">
            <div className="tbadge"><div className="tbadge-val">{active.koPct}%</div><div className="tbadge-label">한국어 번역</div></div>
            <div className="tbadge"><div className="tbadge-val">{active.enPct}%</div><div className="tbadge-label">영어 번역</div></div>
          </div>
        </div>
        <div className="og-preview">
          <img src={active.img.replace('120/90','600/315')} alt="" />
          <div className="og-preview-body">
            <div className="og-domain">hailo-studio.co.kr</div>
            <div className="og-title">{current.title || '메타 타이틀을 입력해주세요'}</div>
            <div className="og-desc">{current.desc || '검색 결과·SNS 카드에 노출될 설명이 여기 표시됩니다.'}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

const TREND_DATA = {
  day: [ {l:'09',v:120},{l:'12',v:280},{l:'15',v:190},{l:'18',v:340},{l:'21',v:260} ],
  week: [ {l:'월',v:420},{l:'화',v:380},{l:'수',v:510},{l:'목',v:460},{l:'금',v:600},{l:'토',v:340},{l:'일',v:290} ],
  month: [ {l:'1주',v:2100},{l:'2주',v:2600},{l:'3주',v:2300},{l:'4주',v:3100} ],
};
const STATUS_DATA = [
  { name:'게시중', value:3, color: M[500] },
  { name:'임시저장', value:2, color: N[3] },
];

function AnalyticsPage(){
  const [period, setPeriod] = useState('week');
  const data = TREND_DATA[period];
  const queue = [
    { title:'루멘스튜디오 포트폴리오 사이트', time:'10/02 09:00' },
    { title:'클로버핀 금융 서비스 랜딩', time:'10/05 14:00' },
  ];
  return (
    <div className="page-body">
      <div className="page-icon-row">
        <div className="page-icon-large"><Icon name="chart-bar" /></div>
      </div>
      <h1 className="page-title">게시 현황 & 사이트 분석 대시보드</h1>

      <div className="kpi-strip">
        <div className="kpi-pill"><Icon name="files" /> 총 게시글 <strong>13건</strong></div>
        <div className="kpi-pill"><Icon name="check-circle" /> 게시중 <strong>3건</strong></div>
        <div className="kpi-pill"><Icon name="clock-countdown" /> 예약 게시 <strong>2건</strong></div>
        <div className="kpi-pill pulse-live"><Icon name="pulse" /> 실시간 방문 <strong>18명</strong></div>
      </div>

      <div className="chart-card">
        <div className="chart-card-head">
          <h3>페이지별 방문 추이</h3>
          <div className="period-toggle">
            <button className={`period-btn ${period === 'day' ? 'active' : ''}`} onClick={() => setPeriod('day')}>일간</button>
            <button className={`period-btn ${period === 'week' ? 'active' : ''}`} onClick={() => setPeriod('week')}>주간</button>
            <button className={`period-btn ${period === 'month' ? 'active' : ''}`} onClick={() => setPeriod('month')}>월간</button>
          </div>
        </div>
        <div className="chart-wrap">
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={data} margin={{top:6,right:10,left:-16,bottom:0}}>
              <defs>
                <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={M[500]} stopOpacity={0.35} />
                  <stop offset="100%" stopColor={M[500]} stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke={N[2]} strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="l" stroke={N[4]} fontSize={11} tickLine={false} axisLine={false} />
              <YAxis stroke={N[4]} fontSize={11} tickLine={false} axisLine={false} />
              <Tooltip contentStyle={{background:N[1], border:`1px solid ${N[2]}`, borderRadius:6, fontSize:12, color:N[8]}} />
              <Area type="monotone" dataKey="v" stroke={M[400]} strokeWidth={2} fill="url(#trendFill)" />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="two-col">
        <div className="chart-card">
          <div className="chart-card-head"><h3>게시 상태 분포</h3></div>
          <div className="chart-wrap" style={{height:200}}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={STATUS_DATA} dataKey="value" nameKey="name" innerRadius={52} outerRadius={78} paddingAngle={3}>
                  {STATUS_DATA.map((d, i) => <Cell key={i} fill={d.color} />)}
                </Pie>
                <Tooltip contentStyle={{background:N[1], border:`1px solid ${N[2]}`, borderRadius:6, fontSize:12, color:N[8]}} />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div style={{display:'flex', gap:16, justifyContent:'center', marginTop:8}}>
            {STATUS_DATA.map((d,i) => (
              <div key={i} style={{display:'flex', alignItems:'center', gap:6, fontSize:12, color:N[6]}}>
                <span style={{width:8, height:8, borderRadius:'50%', background:d.color, display:'inline-block'}}></span>{d.name} {d.value}
              </div>
            ))}
          </div>
        </div>
        <div className="chart-card">
          <div className="chart-card-head"><h3>예약 게시 큐</h3></div>
          {queue.map((q, i) => (
            <div className="queue-item" key={i}>
              <span className="queue-time">{q.time}</span>
              <span style={{color:N[8]}}>{q.title}</span>
            </div>
          ))}
          <p style={{fontSize:12, color:N[5], marginTop:10}}>지정된 시각이 되면 별도 조작 없이 자동으로 게시 상태로 전환됩니다.</p>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [activePage, setActivePage] = useState('main');
  const [works, setWorks] = useState(INITIAL_WORKS);
  const [selectedWorkId, setSelectedWorkId] = useState(null);
  const toast = useToast();

  return (
    <div className="app-shell" data-archetype="notion-blocks-tree">
      <TreeSidebar activePage={activePage} setActivePage={setActivePage} works={works} selectedWorkId={selectedWorkId} setSelectedWorkId={setSelectedWorkId} toast={toast} />
      <main className="page">
        <Breadcrumb activePage={activePage} />
        {activePage === 'main' && <MainPage works={works} setWorks={setWorks} selectedWorkId={selectedWorkId} setSelectedWorkId={setSelectedWorkId} toast={toast} setActivePage={setActivePage} />}
        {activePage === 'editor' && <EditorPage toast={toast} />}
        {activePage === 'i18n-seo' && <I18nSeoPage works={works} toast={toast} />}
        {activePage === 'analytics' && <AnalyticsPage />}
      </main>
      <div className={`toast ${toast.msg ? 'show' : ''}`}><Icon name="check-circle" />{toast.msg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
