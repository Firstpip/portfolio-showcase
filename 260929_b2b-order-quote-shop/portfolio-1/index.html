<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B 거래처별 가격·견적 주문 포털 — 구현 데모</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 221°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#f0f4fe;
  --m100:#e0e9fc;
  --m200:#c2d3f9;
  --m300:#9db9f6;
  --m400:#739bf2;
  --m500:#4c7fef;
  --m600:#2563eb;
  --m700:#1e51c1;
  --m800:#183f96;
  --m900:#112d6a;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f5f5f5;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909298;
  --n7:#71747a;
  --n8:#262626;
  --n9:#36373a;
  --n10:#111111;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:'Pretendard',-apple-system,sans-serif;font-size:13px;color:var(--n10);background:var(--n0);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--n10)}
#root{width:100%;height:100%}
.app{display:flex;width:100%;height:100vh;overflow:hidden;background:var(--n0)}
@keyframes fadeUp{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}70%{box-shadow:0 0 0 6px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toastIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.enter{animation:fadeUp .28s ease both}
.spin{animation:spin .8s linear infinite}
/* strip */
.workspace-strip{width:64px;flex:none;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.ws-item{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--n5);font-weight:600;font-size:13px;position:relative;transition:background .15s,color .15s}
.ws-item:hover{background:var(--n9);color:var(--n1);transform:scale(1.06)}
.ws-item.active{background:var(--n1);color:var(--n10)}
.ws-item.active::before{content:'';position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--n1)}
.ws-divider{width:24px;height:1px;background:var(--n9);margin:4px 0}
.ws-foot{margin-top:auto}
/* channel list */
.channel-list{width:260px;flex:none;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;overflow:hidden}
.channel-header{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between}
.ws-name{font-size:15px;font-weight:600;letter-spacing:-.02em}
.ws-sub{font-size:11px;color:var(--n7);margin-top:2px}
.channel-search{padding:0 14px 10px}
.channel-search .box{display:flex;align-items:center;gap:6px;border:1px solid var(--n10);border-radius:6px;padding:0 10px;height:32px;background:var(--n1)}
.channel-search input{border:none;outline:none;flex:1;background:transparent;height:30px}
.channel-section{padding:4px 8px}
.section-toggle{display:flex;align-items:center;gap:4px;width:100%;padding:6px;font-size:11px;font-weight:600;color:var(--n7);letter-spacing:.02em}
.channel-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--n9);font-size:13px;line-height:1.3;transition:background .12s}
.channel-item:hover{background:var(--n2)}
.channel-item.active{background:var(--m50);color:var(--m700);font-weight:600}
.nav-row{position:relative}
.nav-count{position:absolute;right:8px;top:50%;margin-top:-9px;min-width:18px;height:18px;border-radius:9px;background:var(--n10);color:var(--n1);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px;pointer-events:none}
.client-scroll{flex:1;overflow:auto;padding:0 8px 8px}
.dm-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;transition:background .12s}
.dm-item:hover{background:var(--n2)}
.dm-item.active{background:var(--m50);box-shadow:inset 2px 0 0 var(--m600)}
.dm-item .nm{font-weight:500;font-size:13px}
.dm-item .sb{font-size:11px;color:var(--n7)}
.grade{margin-left:auto;font-size:10px;font-weight:600;border:1px solid var(--n4);border-radius:9999px;padding:1px 7px;color:var(--n8)}
.presence{width:8px;height:8px;border-radius:50%;background:var(--n5);flex:none}
.presence.online{background:var(--s1)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
/* main */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n1)}
.conv-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--n3);min-height:56px}
.conv-title-row{display:flex;align-items:center;gap:10px}
.conv-title{font-size:18px;font-weight:500;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 9px;font-size:11px;font-weight:500;background:var(--n2);color:var(--n8);white-space:nowrap}
.pill.line{background:var(--n1);border:1px solid var(--n4)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text)}
.pill.sel{background:var(--m50);color:var(--m700)}
.conv-actions{display:flex;gap:6px;align-items:center}
.conv-action{height:32px;padding:0 12px;border:1px solid var(--n3);border-radius:8px;display:inline-flex;align-items:center;gap:6px;background:var(--n1);font-weight:500;transition:background .12s,border-color .12s}
.conv-action:hover{background:var(--n1);border-color:var(--n5)}
.conv-action.icon{width:32px;padding:0;justify-content:center}
.btn-primary{height:32px;padding:0 14px;border-radius:8px;background:var(--n10);color:var(--n1);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .12s;position:relative;overflow:hidden}
.btn-primary:hover{background:var(--n9);transform:scale(1.02)}
.btn-primary:active{transform:scale(.97)}
.btn-primary[disabled]{background:var(--n3);color:var(--n6);cursor:not-allowed}
.btn{height:30px;padding:0 12px;border:1px solid var(--n3);border-radius:8px;background:var(--n1);display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:border-color .12s}
.btn:hover{border-color:var(--n6);transform:scale(1.02)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{color:var(--n6);cursor:not-allowed;border-color:var(--n3)}
.link{color:var(--m600);font-weight:500}
.conv-body{flex:1;overflow:auto;padding:16px 20px 20px}
.meta-line{display:flex;gap:16px;color:var(--n7);font-size:12px;margin-bottom:12px;flex-wrap:wrap}
.meta-line b{color:var(--n10);font-weight:600}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hint{color:var(--n7);font-size:12px}
.card{border:1px solid var(--n3);border-radius:12px;background:var(--n1)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--n3);font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--n7);text-align:left;padding:8px 12px;border-bottom:1px solid var(--n3);white-space:nowrap;background:var(--n1)}
td{padding:9px 12px;border-bottom:1px solid var(--n3);font-size:13px;vertical-align:middle}
tbody tr.row{cursor:pointer;transition:background .12s}
tbody tr.row:hover{background:var(--n1)}
tbody tr.row:hover td{background:var(--n1)}
tbody tr.row.sel td{background:var(--m50)}
tbody tr.row.sel td:first-child{box-shadow:inset 2px 0 0 var(--m600)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--n8)}
.snap{display:inline-flex;align-items:center;gap:5px}
.msg-group{display:flex;gap:10px;padding:8px 0}
.msg-name{font-weight:600}
.msg-time{color:var(--n6);font-size:11px;margin-left:6px}
.msg-content{color:var(--n9);line-height:1.5;margin-top:2px}
.conv-input{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--n3);background:var(--n1)}
.msg-input{flex:1;height:34px;border:1px solid var(--n10);border-radius:6px;padding:0 12px;outline:none}
.msg-input:focus{box-shadow:0 0 0 3px var(--m100)}
/* info */
.info-panel{width:320px;flex:none;background:var(--n1);border-left:1px solid var(--n3);overflow:auto;display:flex;flex-direction:column}
.info-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--n3);min-height:56px}
.info-header h3{font-size:14px;font-weight:600}
.info-section{padding:14px 16px;border-bottom:1px solid var(--n3)}
.info-label{font-size:11px;color:var(--n7);font-weight:500;margin-bottom:8px;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}
.kv span:first-child{color:var(--n7)}
.step{display:flex;gap:10px;padding:6px 0;align-items:flex-start;position:relative}
.step .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;flex:none;background:var(--n1);color:var(--n6)}
.step.done .dot{background:var(--n10);border-color:var(--n10);color:var(--n1)}
.step.cur .dot{border-color:var(--m600);color:var(--m600);animation:pulseDot 1.8s infinite}
.step .t{font-weight:500;font-size:12.5px}
.step .d{color:var(--n7);font-size:11.5px;margin-top:1px}
.mini-bar{height:6px;border-radius:3px;background:var(--n2);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--m600);transform-origin:left;animation:barGrow .6s ease both}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 11px;border:1px solid var(--n3);border-radius:9999px;font-size:12px;font-weight:500;background:var(--n1)}
.chip.on{background:var(--n10);color:var(--n1);border-color:var(--n10)}
.skeleton{background:linear-gradient(90deg,var(--n2) 25%,var(--n1) 50%,var(--n2) 75%);background-size:600px 100%;animation:shimmer 1.1s infinite linear;border-radius:6px}
.paste{width:100%;height:132px;border:1px solid var(--n10);border-radius:6px;padding:10px 12px;resize:none;outline:none;font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7}
.paste:focus{box-shadow:0 0 0 3px var(--m100)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;color:var(--n7);font-weight:500}
.field input,.field select{height:32px;border:1px solid var(--n10);border-radius:6px;padding:0 10px;outline:none;background:var(--n1)}
.field input:focus,.field select:focus{box-shadow:0 0 0 3px var(--m100)}
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.38);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeUp .2s ease both}
.modal{width:460px;background:var(--n1);border-radius:16px;border:1px solid var(--n3);padding:20px;box-shadow:rgba(0,0,0,.1) 0 10px 15px -3px}
.modal h4{font-size:16px;font-weight:500;letter-spacing:-.01em;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:76px;margin-left:-160px;background:var(--n10);color:var(--n1);border-radius:10px;padding:10px 16px;z-index:60;display:flex;align-items:center;gap:8px;animation:toastIn .25s ease both;box-shadow:rgba(0,0,0,.1) 0 10px 15px -3px}
.display{font-size:36px;line-height:1.12;font-weight:500;letter-spacing:-.03em;margin:2px 0 14px;max-width:640px}
.empty{padding:28px;text-align:center;color:var(--n7)}
.rise{display:flex;gap:2px;align-items:flex-end;height:22px}
.rise i{width:4px;background:var(--n4);border-radius:1px}
.rise i:last-child{background:var(--m600)}
.trace{border:1px solid var(--n3);border-radius:10px;overflow:hidden}
.trace .tr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--n3)}
.trace .tr:last-child{border-bottom:none}
.trace .tr.pick{background:var(--m50)}
.trace .tr .lb{flex:1}
.trace .tr .st{font-size:11px;color:var(--n7)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const won=n=>n.toLocaleString('ko-KR')+'원';
const Icon=({n,s=16,sw=1.6,style,cls})=>{
  let node=(window.lucide&&window.lucide.icons&&window.lucide.icons[n])||[['circle',{cx:12,cy:12,r:9}]];
  if(node[0]==='svg'&&Array.isArray(node[2])) node=node[2];
  node=node.filter(x=>Array.isArray(x));
  return <svg className={cls} width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{flex:'none',...style}}>{node.map(([t,a],i)=>React.createElement(t,{...a,key:i}))}</svg>;
};
const Avatar=({name,size=28})=><span className="avatar" style={{width:size,height:size,fontSize:size*.42}}>{name.trim().charAt(0)}</span>;

const CLIENTS=[
 {id:'c1',name:'한빛유통',grade:'A',mgr:'김도현',since:'2023.04',ov:{'CL-3308':7300,'PP-5002':19800},online:true},
 {id:'c2',name:'대성산업자재',grade:'B',mgr:'이서준',since:'2022.11',ov:{'SF-2205':30500},online:true},
 {id:'c3',name:'미래식자재',grade:'A',mgr:'박지우',since:'2024.01',ov:{},online:false},
 {id:'c4',name:'세종메디텍',grade:'C',mgr:'최윤아',since:'2024.06',ov:{'HG-2041':9200},online:true},
 {id:'c5',name:'동해상사',grade:'B',mgr:'정하늘',since:'2023.09',ov:{},online:false},
 {id:'c6',name:'늘솔푸드',grade:'A',mgr:'강민재',since:'2021.12',ov:{'PK-1120':1180,'TP-6104':820},online:true},
];
const DISC={A:12,B:8,C:4};
const PRODUCTS=[
 {code:'HG-2041',name:'니트릴 장갑 100매입',cat:'소모품',base:9800,moq:20,unit:10},
 {code:'PK-1120',name:'골판지 박스 5호',cat:'포장재',base:1450,moq:100,unit:50},
 {code:'CL-3308',name:'다목적 세정제 4L',cat:'위생용품',base:8200,moq:12,unit:12},
 {code:'PP-5002',name:'복사용지 A4 2,500매',cat:'사무용품',base:21500,moq:10,unit:5},
 {code:'ST-7710',name:'스트레치 필름 500mm',cat:'포장재',base:6900,moq:24,unit:6},
 {code:'SF-2205',name:'KS 안전화 (작업용)',cat:'안전용품',base:34000,moq:10,unit:1},
 {code:'TP-6104',name:'OPP 테이프 48mm',cat:'포장재',base:1050,moq:60,unit:60},
 {code:'BG-4402',name:'PE 봉투 (대) 100장',cat:'포장재',base:12300,moq:20,unit:10},
];
const priceOf=(p,c,mk=0)=>{
  const base=Math.round(p.base*(1+mk/100)/10)*10;
  if(c.ov[p.code]!==undefined) return {v:c.ov[p.code],rule:'거래처 개별가',kind:'ov',base};
  return {v:Math.round(base*(1-DISC[c.grade]/100)/10)*10,rule:'등급 할인 '+c.grade+' · '+DISC[c.grade]+'%',kind:'gr',base};
};

const NAV=[
 {id:'main',label:'거래처별 가격 엔진·주문 스냅샷',icon:'Percent'},
 {id:'bulk-order',label:'MOQ 검증 대량 주문',icon:'ClipboardPaste'},
 {id:'quote',label:'견적 요청·견적서·주문 전환',icon:'FileText',badge:2},
 {id:'payment',label:'결제·입금 기한 자동 취소',icon:'CreditCard',badge:1},
];

function useToast(){
  const [t,setT]=useState(null);
  const show=m=>{setT(m);setTimeout(()=>setT(null),2600)};
  return [t,show];
}

/* ───────── 1. 가격 엔진 ───────── */
function PriceScreen({client,role,markup,setMarkup,selP,setSelP,toast,memos}){
  const rows=PRODUCTS.map(p=>({p,cur:priceOf(p,client,markup),snap:priceOf(p,client,0)}));
  const ovCount=rows.filter(r=>r.cur.kind==='ov').length;
  return <div className="conv-body enter">
    <h1 className="display">{role==='admin'?client.name+'의 가격은 주문 시점에 확정되어 고정됩니다':'우리 회사에 정해진 가격만 보입니다'}</h1>
    <div className="meta-line">
      <span>판매 가능 상품 <b>{PRODUCTS.length}개</b></span>
      <span>개별가 적용 <b>{ovCount}건</b></span>
      <span>등급 <b>{client.grade}</b> · 기본 할인 <b>{DISC[client.grade]}%</b></span>
      <span>스냅샷 주문 <b>ORD-24-0318</b></span>
    </div>
    <div className="toolbar">
      <button className={markup?'btn-primary':'btn'} onClick={()=>{setMarkup(markup?0:5);toast(markup?'기본 공급가를 원래 값으로 되돌립니다':'기본 공급가 5% 인상을 시뮬레이션합니다 — 기존 주문 금액은 그대로 유지됩니다')}}>
        <Icon n="TrendingUp" s={14}/>{markup?'인상 시뮬레이션 해제':'기본 공급가 5% 인상 시뮬레이션'}
      </button>
      <span className="hint">주문 확정 후 단가를 바꿔도 이미 들어온 주문 금액은 스냅샷 값으로 고정됩니다.</span>
    </div>
    <div className="card" style={{overflow:'hidden',borderRadius:8}}>
      <table>
        <thead><tr>

const INIT_PASTE='HG-2041, 15\nPK-1120, 200\nCL-3308, 20\nST-7710, 24\nXX-9999, 10';
function parseLines(txt){
  return txt.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{
    const [code,q]=s.split(/[,\s\t]+/);
    const qty=parseInt(q,10);
    const p=PRODUCTS.find(x=>x.code===(code||'').toUpperCase());
    let err=null,fix=null;
    if(!p) err='등록되지 않은 품목코드입니다';
    else if(!qty||qty<1) err='수량을 확인해 주세요';
    else if(qty<p.moq){err='최소 주문 수량은 '+p.moq+'개입니다';fix=p.moq}
    else if(qty%p.unit!==0){fix=Math.ceil(qty/p.unit)*p.unit;err='주문 단위는 '+p.unit+'개입니다';}
    return {i,code:(code||'').toUpperCase(),qty:qty||0,p,err,fix};
  });
}

      <div className="hint" style={{lineHeight:1.7}}>요청 → 작성중 → 발송 → 수락 → 주문 전환<br/>발송 이후 유효기간이 지나면 만료 상태로 전이되며 수락 버튼이 비활성화됩니다. 허용되지 않은 전이는 서버에서 차단합니다.</div>
    </div>
  </>;
}

/* ───────── 4. 결제 ───────── */
const OINIT=[
 {no:'ORD-24-0318',amt:1284600,pay:'카드 · 토스페이먼츠',st:'배송 중',due:null,inv:'한진 6021 4478 1290',h:['주문 접수 09.12 10:21','카드 결제 승인 09.12 10:22','송장 등록 09.13 09:40']},
 {no:'ORD-24-0325',amt:842500,pay:'무통장 입금',st:'입금 대기',due:'2026.09.30 18:00',inv:null,h:['주문 접수 09.27 15:03','입금 기한 안내 메일 예약']},
 {no:'ORD-24-0309',amt:377300,pay:'무통장 입금',st:'입금 대기',due:'2026.09.28 18:00',inv:null,over:true,h:['주문 접수 09.25 11:40','입금 기한 안내 메일 발송']},
 {no:'ORD-24-0322',amt:1560000,pay:'카드 · 토스페이먼츠',st:'결제 완료',due:null,inv:null,h:['주문 접수 09.26 16:12','카드 결제 승인 09.26 16:13']},
];
const FLOW=['주문 접수','결제 확인','송장 등록','배송 중','배송 완료'];
const flowIdx=o=>o.st==='입금 대기'?0:o.st==='자동 취소'?-1:o.st==='결제 완료'?1:o.st==='배송 중'?3:4;
function PayScreen({orders,setOrders,selO,setSelO,wh,setWh,toast}){
  const [busy,setBusy]=useState(false);
  const [carrier,setCarrier]=useState('한진택배');
  const [invNo,setInvNo]=useState('6021 4478 5533');
  const o=orders.find(x=>x.no===selO)||orders[0];
  const sweep=()=>{
    setBusy(true);
    setTimeout(()=>{
      setBusy(false);
      const n=orders.filter(x=>x.over&&x.st==='입금 대기').length;
      setOrders(orders.map(x=>x.over&&x.st==='입금 대기'?{...x,st:'자동 취소',h:[...x.h,'입금 기한 초과 — 자동 취소 · 안내 메일 발송']}:x));
      toast(n?'기한 초과 주문 '+n+'건이 자동 취소됩니다':'취소 대상 주문이 없습니다');
    },900);
  };
  const stPill=s=>s==='배송 중'||s==='결제 완료'?'ok':s==='자동 취소'?'bad':'';
  return <div className="conv-body enter">
    <div className="toolbar">
      <button className="btn-primary" onClick={sweep}>{busy?<Icon n="LoaderCircle" s={14} cls="spin"/>:<Icon n="Clock" s={14}/>}입금 기한 점검 실행</button>
      <button className="btn" onClick={()=>{setWh([{k:'evt_7c1e',m:'PAYMENT_STATUS_CHANGED · 동일 키 재수신',r:'중복 무시',t:'방금'},...wh]);toast('동일한 웹훅을 다시 전송합니다 — 상태는 한 번만 변경됩니다')}}><Icon n="Webhook" s={14}/>웹훅 재전송 테스트</button>
      <span className="hint">스케줄러는 매 시 정각에 무통장 입금 기한을 점검합니다.</span>
    </div>
    <div className="card" style={{overflow:'hidden',marginBottom:14,borderRadius:8}}>
      <table>
        <thead><tr><th>주문번호</th><th>결제 수단</th><th>입금 기한</th><th className="num">결제 금액</th><th>상태</th></tr></thead>
        <tbody>{orders.map(x=><tr key={x.no} className={'row'+(o.no===x.no?' sel':'')} onClick={()=>setSelO(x.no)}>
          <td className="mono">{x.no}</td><td>{x.pay}</td>
          <td>{x.due||'-'}{x.over&&x.st==='입금 대기'&&<span className="pill warn" style={{marginLeft:6}}>기한 초과</span>}</td>
          <td className="num" style={{fontWeight:600}}>{won(x.amt)}</td>
          <td><span className={'pill '+stPill(x.st)}>{x.st}</span></td>
        </tr>)}</tbody>
      </table>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div className="card">
        <div className="card-h"><span>송장 등록 · {o.no}</span></div>
        <div style={{padding:14}}>
          {o.st==='결제 완료'||o.st==='배송 중'?<>
            <div className="field"><label>택배사</label><select value={carrier} onChange={e=>setCarrier(e.target.value)}><option>한진택배</option><option>대한통운</option><option>로젠택배</option></select></div>
            <div className="field"><label>송장번호</label><input value={o.inv||invNo} disabled={!!o.inv} onChange={e=>setInvNo(e.target.value)}/></div>
            <button className="btn-primary" disabled={!!o.inv} onClick={()=>{setOrders(orders.map(x=>x.no===o.no?{...x,st:'배송 중',inv:carrier.slice(0,2)+' '+invNo,h:[...x.h,'송장 등록 · 배송 조회 링크 안내 메일 예약']}:x));toast('송장이 등록되어 거래처 배송 현황에 표시됩니다')}}><Icon n="Truck" s={14}/>{o.inv?'송장 등록됨':'송장 등록'}</button>
          </>:<div className="hint">결제가 확인된 주문부터 송장을 등록할 수 있습니다.</div>}
        </div>
      </div>
      <div className="card">
        <div className="card-h"><span>PG 웹훅 수신 로그</span></div>
        <div style={{padding:'4px 14px 8px'}}>
          {wh.map((w,i)=><div key={i} className="msg-group" style={{padding:'6px 0'}}>
            <Icon n={w.r==='중복 무시'?'CopyX':'Check'} s={15} style={{color:'var(--n7)',marginTop:2}}/>
            <div style={{flex:1}}><div className="mono">{w.k}</div><div style={{fontSize:12,color:'var(--n7)'}}>{w.m}</div></div>
            <span className={'pill '+(w.r==='중복 무시'?'':'ok')}>{w.r}</span>
          </div>)}
        </div>
      </div>
    </div>
  </div>;
}
function PayInfo({orders,selO}){
  const o=orders.find(x=>x.no===selO)||orders[0];
  const idx=flowIdx(o);
  return <>
    <div className="info-section">
      <div className="info-label">주문</div>
      <div style={{fontWeight:600,fontSize:14}}>{o.no}</div>
      <div className="kv" style={{marginTop:6}}><span>결제 수단</span><b>{o.pay}</b></div>
      <div className="kv"><span>결제 금액</span><b>{won(o.amt)}</b></div>
      {o.inv&&<div className="kv"><span>송장</span><b className="mono">{o.inv}</b></div>}
    </div>
    <div className="info-section">
      <div className="info-label">주문 상태 머신</div>
      {o.st==='자동 취소'?<div className="step done"><span className="dot"><Icon n="X" s={11} sw={2.4}/></span><div><div className="t">입금 기한 초과 — 자동 취소</div><div className="d">이력에 사유가 기록됩니다</div></div></div>
      :FLOW.map((f,i)=><div key={f} className={'step'+(i<idx?' done':i===idx?' cur':'')}><span className="dot">{i<idx?<Icon n="Check" s={11} sw={2.4}/>:<span style={{fontSize:10}}>{i+1}</span>}</span><div><div className="t">{f}</div></div></div>)}
    </div>
    <div className="info-section">
      <div className="info-label">처리 이력</div>
      {o.h.map((t,i)=><div key={i} className="hint" style={{padding:'3px 0',color:'var(--n9)'}}>{t}</div>)}
    </div>
    <div className="info-section">
      <div className="info-label">이메일 알림 (Nodemailer)</div>
      <div className="hint" style={{lineHeight:1.7}}>결제 확인 · 입금 기한 안내 · 자동 취소 · 송장 등록 시 거래처 담당자에게 템플릿 메일이 발송됩니다.</div>
    </div>
  </>;
}

/* ───────── App ───────── */
function App(){
  const [screen,setScreen]=useState('main');
  const [role,setRole]=useState('admin');
  const [cid,setCid]=useState('c1');
  const [q,setQ]=useState('');
  const [infoOpen,setInfoOpen]=useState(true);
  const [markup,setMarkup]=useState(0);
  const [selP,setSelP]=useState('CL-3308');
  const [text,setText]=useState(INIT_PASTE);
  const [quotes,setQuotes]=useState(QINIT);
  const [selQ,setSelQ]=useState('Q-0925-002');
  const [hist,setHist]=useState([{t:'09.12 14:05',m:'Q-0912-001 수락 → ORD-24-0318 생성 (금액 일치)'},{t:'09.10 09:31',m:'Q-0912-001 견적서 발송'}]);
  const [orders,setOrders]=useState(OINIT);
  const [selO,setSelO]=useState('ORD-24-0325');
  const [wh,setWh]=useState([{k:'evt_7c1e',m:'PAYMENT_STATUS_CHANGED · 카드 승인',r:'처리',t:'09.26'},{k:'evt_6b90',m:'PAYMENT_STATUS_CHANGED · 카드 승인',r:'처리',t:'09.12'}]);
  const [memos,setMemos]=useState([]);
  const [memo,setMemo]=useState('');
  const [toastMsg,toast]=useToast();
  const client=CLIENTS.find(c=>c.id===cid);
  const cur=NAV.find(n=>n.id===screen);
  const shown=CLIENTS.filter(c=>c.name.includes(q));
  const submitMemo=()=>{if(!memo.trim())return;setMemos([...memos,memo.trim()]);setMemo('');toast('메모가 이력에 추가됩니다')};
  return <div className="app" data-archetype="slack-3pane">
    <nav className="workspace-strip" data-workspace-strip style={{width:64}}>
      <button className={'ws-item'+(role==='admin'?' active':'')} title="관리자 시점" onClick={()=>{setRole('admin');toast('관리자 시점 — 전체 규칙과 기본 공급가가 표시됩니다')}}>관</button>
      <button className={'ws-item'+(role==='client'?' active':'')} title="거래처 시점" onClick={()=>{setRole('client');setScreen('main');toast('거래처 시점 — 본인에게 정해진 가격만 표시됩니다')}}>거</button>
      <div className="ws-divider"/>
      <button className="ws-item" title="알림" onClick={()=>toast('알림 3건 · 견적 발송 대기, 입금 기한 초과 1건')}><Icon n="Bell" s={18}/></button>
      <button className="ws-item ws-foot" title="설정" onClick={()=>toast('권한·등급 설정은 관리자 콘솔에서 관리합니다')}><Icon n="Settings" s={18}/></button>
    </nav>
    <aside className="channel-list" data-channel-list style={{width:260}}>
      <header className="channel-header">
        <div><h2 className="ws-name">거래 포털</h2><div className="ws-sub">{role==='admin'?'관리자 워크스페이스':'거래처 워크스페이스'}</div></div>
        <button className="conv-action icon" onClick={()=>toast('새 거래처 등록 폼을 엽니다')} title="거래처 추가"><Icon n="Plus" s={15}/></button>
      </header>
      <div className="channel-search"><div className="box"><Icon n="Search" s={14} style={{color:'var(--n7)'}}/><input placeholder="거래처 검색" value={q} onChange={e=>setQ(e.target.value)}/></div></div>
      <div className="channel-section">
        <div className="section-toggle"><Icon n="ChevronDown" s={12}/>업무 화면</div>
        {NAV.map(n=><div className="nav-row" key={n.id}>
          <button className={'channel-item'+(screen===n.id?' active':'')} onClick={()=>setScreen(n.id)}><Icon n={n.icon} s={15}/><span>{n.label}</span></button>
          {n.badge&&screen!==n.id&&<span className="nav-count">{n.badge}</span>}
        </div>)}
      </div>
      <div className="channel-section" style={{paddingBottom:0}}><div className="section-toggle"><Icon n="ChevronDown" s={12}/>거래처 {shown.length}</div></div>
      <div className="client-scroll">
        {shown.map(c=><button key={c.id} className={'dm-item'+(cid===c.id?' active':'')} onClick={()=>{setCid(c.id);setMarkup(0)}}>
          <span style={{position:'relative'}}><Avatar name={c.name}/></span>
          <span><div className="nm">{c.name}</div><div className="sb">{c.mgr} · {c.since} 거래 시작</div></span>
          <span className="grade">{c.grade}</span>
        </button>)}
      </div>
    </aside>
    <main className="conv-main">
      <header className="conv-header">
        <div className="conv-title-row">
          <Avatar name={client.name} size={30}/>
          <div><h2 className="conv-title">{cur.label}</h2><div className="hint">{client.name} · 등급 {client.grade} · 담당 {client.mgr}</div></div>
          <span className="pill sel">{role==='admin'?'관리자 시점':'거래처 시점'}</span>
        </div>
        <div className="conv-actions">
          <button className="conv-action" onClick={()=>toast('가격표를 엑셀로 내려받습니다 — 생성 중')}><Icon n="Download" s={14}/>가격표 내보내기</button>
          <button className="conv-action icon info-toggle" title="상세 패널" onClick={()=>setInfoOpen(!infoOpen)}><Icon n={infoOpen?'PanelRightClose':'PanelRightOpen'} s={16}/></button>
        </div>
      </header>
      <div key={screen+cid} style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
        {screen==='main'&&<PriceScreen client={client} role={role} markup={markup} setMarkup={setMarkup} selP={selP} setSelP={setSelP} toast={toast} memos={memos}/>}
        {screen==='bulk-order'&&<BulkScreen client={client} text={text} setText={setText} toast={toast} setScreen={setScreen}/>}
        {screen==='quote'&&<QuoteScreen client={client} quotes={quotes} setQuotes={setQuotes} selQ={selQ} setSelQ={setSelQ} toast={toast} setHist={setHist}/>}
        {screen==='payment'&&<PayScreen orders={orders} setOrders={setOrders} selO={selO} setSelO={setSelO} wh={wh} setWh={setWh} toast={toast}/>}
      </div>
      <footer className="conv-input">
        <input className="msg-input" placeholder="가격 규칙 메모를 남기고 Enter" value={memo} onChange={e=>setMemo(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitMemo()}}/>
        <button className="btn-primary" onClick={submitMemo}><Icon n="Send" s={14}/>남기기</button>
      </footer>
    </main>
    {infoOpen&&<aside className="info-panel" data-info-panel style={{width:320}}>
      <header className="info-header"><h3>{screen==='main'?'가격 결정 상세':screen==='bulk-order'?'주문서':screen==='quote'?'전환 상세':'주문 상세'}</h3><button className="conv-action icon close-info" onClick={()=>setInfoOpen(false)}><Icon n="X" s={15}/></button></header>
      {screen==='main'&&<PriceInfo client={client} selP={selP} markup={markup} role={role}/>}
      {screen==='bulk-order'&&<BulkInfo client={client} text={text} toast={toast}/>}
      {screen==='quote'&&<QuoteInfo quotes={quotes} selQ={selQ} client={client} hist={hist}/>}
      {screen==='payment'&&<PayInfo orders={orders} selO={selO}/>}
    </aside>}
    {toastMsg&&<div className="toast"><Icon n="Check" s={14}/>{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
