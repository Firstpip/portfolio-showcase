:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#faf2ef;
  --m100:#f5e5e0;
  --m200:#ebcbc0;
  --m300:#dfac9a;
  --m400:#d28970;
  --m500:#c56847;
  --m600:#b8471f;
  --m700:#973a19;
  --m800:#762d14;
  --m900:#53200e;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f6f3f1;
  --n1:#ffffff;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#797776;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#242424;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;color:var(--n10);background:var(--n0);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select{font-family:inherit;font-size:14px;color:var(--n10)}
#root{width:100%;min-height:100vh}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drawLine{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rot{to{transform:rotate(360deg)}}
.page{width:100%;min-height:100vh;display:flex;flex-direction:column}
.rise{animation:riseIn .4s cubic-bezier(.2,.7,.2,1) both}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n7)}
.tab{font-family:'JetBrains Mono','Pretendard',ui-monospace,monospace;letter-spacing:-.01em}
/* topnav */
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 32px;background:var(--n0);border-bottom:1px solid var(--n3)}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:-.02em;font-weight:500}
.brand .mk{width:30px;height:30px;border-radius:50%;background:var(--m600);color:var(--n1);display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs{display:flex;gap:4px;background:var(--n1);border:1px solid var(--n3);border-radius:40px;padding:4px}
.tab{padding:8px 16px;border-radius:40px;font-size:13px;color:var(--n8);transition:background .15s,color .15s;white-space:nowrap}
.tab:hover{background:var(--n2)}
.tab.on{background:var(--n10);color:var(--n1)}
.right{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--n3);background:var(--n1);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;transition:transform .15s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--m600);animation:breathe 2s infinite}
.me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--n3);border-radius:40px;background:var(--n1)}
.av{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.wrap{width:100%;max-width:1400px;margin:0 auto;padding:24px 32px 40px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(120deg,var(--m800),var(--m600));color:var(--n1);padding:28px 32px;display:flex;justify-content:space-between;align-items:flex-end;min-height:150px}
.hero h1{font-size:46px;font-weight:400;letter-spacing:-.04em;line-height:1.15;max-width:720px}
.hero .flow{position:absolute;right:32px;top:24px;display:flex;align-items:center;gap:0;z-index:1}
.hero .node{border:1px solid var(--m300);border-radius:40px;padding:6px 14px;font-size:12px;color:var(--n1);background:rgba(255,255,255,.08);animation:riseIn .5s ease both;white-space:nowrap}
.hero .wire{width:26px;height:1px;background:var(--m300);opacity:.7;position:relative;overflow:hidden}
.hero .wire i{position:absolute;inset:0;background:var(--n1);transform-origin:left;animation:fill 1.6s ease-in-out infinite alternate}
.hero{min-height:230px}
.hero .mono{color:var(--m100)}
.hero .art{position:absolute;right:0;top:0;height:100%;opacity:.9}
.hero .acts{display:flex;gap:8px;position:relative;z-index:1}
.btn-light{height:38px;padding:0 18px;border-radius:40px;background:var(--n1);color:var(--n10);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.btn-light:hover{transform:translateY(-1px)}
.btn-ghost-w{height:38px;padding:0 18px;border-radius:40px;border:1px solid var(--m300);color:var(--n1);display:inline-flex;align-items:center;gap:6px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:16px}
.tile{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:20px;box-shadow:rgba(0,0,0,.04) 0 2px 8px;transition:transform .2s,box-shadow .2s,border-color .2s;animation:riseIn .45s cubic-bezier(.2,.7,.2,1) both;position:relative;text-align:left}
.tile.click{cursor:pointer}
.tile.click:hover{transform:translateY(-3px);box-shadow:rgba(0,0,0,.08) 0 10px 24px}
.tile.on{border-color:var(--m600);background:var(--m50)}
.tile h3{font-size:14px;font-weight:500;color:var(--n8);display:flex;align-items:center;gap:8px}
.tile .big{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--n7);margin-top:8px}
.tile .ic{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.tile.on .ic{background:var(--m100);color:var(--m700)}
.span4{grid-column:span 4}.span2{grid-column:span 2}.rows2{grid-row:span 2}.span3{grid-column:span 3}.span6{grid-column:span 6}
.seg{display:inline-flex;background:var(--n2);border-radius:40px;padding:3px}
.seg button{padding:5px 14px;border-radius:40px;font-size:12.5px;color:var(--n8)}
.seg button.on{background:var(--n1);box-shadow:rgba(0,0,0,.08) 0 1px 3px;color:var(--n10);font-weight:500}
.chart-svg{width:100%;height:220px;display:block;margin-top:8px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--n7);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.h2{font-size:22px;font-weight:400;letter-spacing:-.03em}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:20px;overflow:hidden;box-shadow:rgba(0,0,0,.04) 0 2px 8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 18px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--n7);font-weight:500;border-bottom:1px solid var(--n3);white-space:nowrap}
td{padding:13px 18px;border-bottom:1px solid var(--n3);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--n0)}
tr.row.sel td{background:var(--m50)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:40px;padding:3px 11px;font-size:12px;background:var(--n2);color:var(--n8);white-space:nowrap}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.dark{background:var(--n10);color:var(--n1)}
.pill.sel{background:var(--m50);color:var(--m700)}
.btn{height:36px;padding:0 16px;border-radius:40px;border:1px solid var(--n4);background:var(--n1);display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:transform .15s,border-color .15s}
.btn:hover{border-color:var(--n8);transform:translateY(-1px)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.pri{background:var(--m600);border-color:var(--m600);color:var(--n1)}
.btn.pri:hover{background:var(--m700)}
.btn[disabled]{color:var(--n6);border-color:var(--n3);cursor:not-allowed;transform:none;background:var(--n1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:40px;border:1px solid var(--n3);background:var(--n1);font-size:13px;color:var(--n8)}
.chip.on{background:var(--n10);color:var(--n1);border-color:var(--n10)}
.sel-sel{height:32px;border:1px solid var(--n4);border-radius:40px;padding:0 12px;background:var(--n1);outline:none}
/* drawer */
.veil{position:fixed;inset:0;background:rgba(36,36,36,.28);z-index:40;display:flex;justify-content:flex-end;animation:riseIn .2s ease both}
.drawer{width:460px;height:100%;background:var(--n1);border-left:1px solid var(--n3);padding:24px;overflow:auto;animation:slideIn .3s cubic-bezier(.2,.7,.2,1) both}
.drawer h3{font-size:22px;font-weight:400;letter-spacing:-.03em}
.dsec{margin-top:20px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--n3);font-size:13.5px}
.kv span:first-child{color:var(--n7)}
.doc{border:1px solid var(--n4);border-radius:14px;padding:16px;background:var(--n0);position:relative;overflow:hidden}
.doc .ln{height:8px;border-radius:4px;background:var(--n3);margin:8px 0}
.doc .stamp{position:absolute;right:16px;bottom:14px;width:54px;height:54px;border:2px solid var(--m600);border-radius:50%;color:var(--m600);display:flex;align-items:center;justify-content:center;font-size:11px;transform:rotate(-12deg);font-weight:600}
.tl{position:relative;padding-left:22px}
.tl .it{position:relative;padding:6px 0 12px}
.tl .it::before{content:'';position:absolute;left:-17px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--n4)}
.tl .it.cur::before{background:var(--m600);animation:breathe 1.6s infinite}
.tl::before{content:'';position:absolute;left:-13px;top:14px;bottom:14px;width:1px;background:var(--n4);margin-left:0}
.tl{margin-left:12px}

.modal{width:480px;background:var(--n1);border-radius:28px;padding:28px;box-shadow:rgba(0,0,0,.14) 0 20px 40px}
.modal h4{font-size:20px;font-weight:400;letter-spacing:-.02em;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--n7)}
.field input,.field select{height:40px;border:1px solid var(--n4);border-radius:14px;padding:0 14px;background:var(--n0);outline:none}
.field input:focus,.field select:focus{border-color:var(--m600);box-shadow:0 0 0 3px var(--m100)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:12px 20px;border-radius:40px;z-index:70;display:flex;gap:8px;align-items:center;animation:riseIn .3s ease both;box-shadow:rgba(0,0,0,.14) 0 10px 24px}

.progress i{display:block;height:100%;background:var(--m600);transform-origin:left;animation:fill 1.2s ease both}
.barcol{transform-origin:bottom;animation:growBar .7s cubic-bezier(.2,.7,.2,1) both}
.spin{animation:rot .9s linear infinite;display:inline-block}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff>div{border:1px solid var(--n3);border-radius:14px;padding:12px;background:var(--n0)}
.diff .after{background:var(--m50);border-color:var(--m200)}
.rank{display:flex;align-items:center;gap:12px;padding:8px 0}
.rank .bar{flex:1;height:8px;background:var(--n2);border-radius:4px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--n4);border-radius:4px;transform-origin:left;animation:fill .8s ease both}
.rank.top .bar i{background:var(--m600)}
</style>

function Chart({period}){
  const d=SERIES[period];
  const W=760,H=220,P=28;
  const max=Math.max(...d.s)*1.1;
  const x=i=>P+i*(W-2*P)/(d.s.length-1);
  const y=v=>H-P-(v/max)*(H-2*P);
  const line=d.s.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');
  const area=line+' L'+x(d.s.length-1)+' '+(H-P)+' L'+x(0)+' '+(H-P)+' Z';
  const bw=14;
  return <svg className="chart-svg" viewBox={'0 0 '+W+' '+H} preserveAspectRatio="none" key={period}>
    {[0,1,2,3].map(i=><line key={i} x1={P} x2={W-P} y1={P+i*(H-2*P)/3} y2={P+i*(H-2*P)/3} stroke="var(--n3)" strokeDasharray="3 4"/>)}
    {d.o.map((v,i)=><rect key={i} className="barcol" style={{animationDelay:i*40+'ms'}} x={x(i)-bw/2} y={y(v*1.6)} width={bw} height={H-P-y(v*1.6)} rx="4" fill="var(--n3)"/>)}
    <path d={area} fill="var(--m100)" opacity=".7" style={{animation:'riseIn .8s ease both'}}/>
    <path d={line} fill="none" stroke="var(--m600)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{'--len':1600,strokeDasharray:1600,animation:'drawLine 1.3s ease both'}}/>
    {d.s.map((v,i)=>i===d.s.length-1&&<circle key={i} cx={x(i)} cy={y(v)} r="5" fill="var(--n1)" stroke="var(--m600)" strokeWidth="2.5"/>)}
    {d.l.map((l,i)=>(i%2===0||i===d.l.length-1)&&<text key={l} x={x(i)} y={H-8} textAnchor="middle" fontSize="11" fill="var(--n7)">{l}</text>)}
  </svg>;
}

        <div className="panel" style={{padding:14}}><b>{cur.pay==='카드'?'PG 카드 취소':'무통장 환불 대기'}</b><div style={{color:'var(--n7)',fontSize:13,marginTop:4}}>{cur.pay==='카드'?'토스페이먼츠 취소 API를 호출하고 결과를 이력에 기록합니다.':'환불 계좌 확인 후 환불 대기 목록에 쌓이며 처리 완료 시 상태가 갱신됩니다.'}</div>
        <button className="btn pri" style={{marginTop:12}} onClick={()=>{setOrders(orders.map(o=>o.no===cur.no?{...o,st:'배송 완료'}:o));setDw(null);toast(cur.pay==='카드'?'카드 취소 요청이 전송됩니다':'환불 대기에 등록됩니다')}}>{cur.pay==='카드'?'카드 취소 승인':'환불 대기 등록'}</button></div></div>}
    </aside></div>}
  </div>;
}

/* stats */
function Stats({toast}){
  const [period,setPeriod]=useState('월간');
  const [phase,setPhase]=useState('idle');
  const [busy,setBusy]=useState(false);
  const rows=[
    {r:2,co:'PK-1120',msg:'주문 단위 50개 위반',ok:false},
    {r:3,co:'HG-2041',msg:'정상',ok:true},{r:4,co:'CL-3308',msg:'정상',ok:true},
    {r:5,co:'ZZ-0001',msg:'미등록 품목코드',ok:false},{r:6,co:'ST-7710',msg:'정상',ok:true},{r:7,co:'TP-6104',msg:'정상',ok:true},
  ];
  const good=rows.filter(r=>r.ok).length;
  const apply=()=>{setPhase('run');setTimeout(()=>{setPhase('done');toast('정상 '+good+'행이 배치로 반영되고 오류 행 리포트가 생성됩니다')},1300)};
  const down=()=>{setBusy(true);setTimeout(()=>{setBusy(false);toast('통계 엑셀 파일이 생성됩니다')},900)};
  const d=SERIES[period];
  const H=170,max=Math.max(...d.s);
  return <div className="wrap">
    <div className="sec-head" style={{marginTop:0}}><div><div className="mono">sales analytics</div><h2 className="h2" style={{marginTop:4}}>매출 통계·엑셀 일괄 처리</h2></div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}><div className="seg">{['주간','월간'].map(p=><button key={p} className={period===p?'on':''} onClick={()=>setPeriod(p)}>{p}</button>)}</div>
      <button className="btn" onClick={down}>{busy?<I n="circle-notch" style={{}}/>:<I n="download-simple"/>}통계 엑셀 내려받기</button></div></div>
    <div className="bento" style={{marginTop:0}}>
      <div className="tile span4">
        <h3><span className="ic"><I n="chart-bar"/></span>기간별 매출과 주문 현황</h3>
        <div style={{display:'flex',alignItems:'flex-end',gap:10,height:H+24,marginTop:18}} key={period}>
          {d.s.map((v,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
            <div className="barcol" style={{width:'100%',height:v/max*H,borderRadius:20,background:i===d.s.length-1?'var(--m600)':'var(--n3)',animationDelay:i*45+'ms'}} title={String(v)}></div>
            <span style={{fontSize:11,color:'var(--n7)'}}>{d.l[i]}</span></div>)}
        </div>
      </div>
      <div className="tile span2">
        <h3><span className="ic"><I n="ranking"/></span>거래처별 구매 순위</h3>
        <div style={{marginTop:10}}>{RANK.map(([n,v],i)=><div key={n} className={'rank'+(i===0?' top':'')}><span style={{width:88,fontSize:13}}>{n}</span><div className="bar"><i style={{width:v/RANK[0][1]*100+'%',animationDelay:i*80+'ms'}}></i></div><span className="mono" style={{width:54,textAlign:'right',textTransform:'none'}}>{v}백만</span></div>)}</div>
      </div>
      <div className="tile span6" style={{borderRadius:20,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h3><span className="ic"><I n="microsoft-excel-logo"/></span>엑셀 일괄 등록 · 검증 미리보기 후 확정</h3>
          <button className="btn sm" onClick={()=>{setPhase('preview');toast('샘플 파일 6행을 검증합니다')}}>샘플 파일 선택</button>
        </div>
        {phase==='idle'&&<div className="drop" style={{marginTop:14}}><I n="upload-simple" style={{fontSize:26}}/><div style={{marginTop:6}}>상품 일괄 등록 파일을 끌어 놓거나 샘플 파일을 선택합니다</div></div>}
        {phase!=='idle'&&<div style={{marginTop:14}}>
          <table><thead><tr><th>행</th><th>품목코드</th><th>검증 결과</th></tr></thead><tbody>
            {rows.map(r=><tr key={r.r} className="row" style={r.ok?{}:{background:'var(--n0)'}}><td className="mono">{r.r}</td><td className="mono" style={{textTransform:'none'}}>{r.co}</td><td>{r.ok?<span className="pill ok"><I n="check"/>{r.msg}</span>:<span className="pill dark"><I n="warning"/>{r.msg}</span>}</td></tr>)}
          </tbody></table>
          {phase==='run'&&<div className="progress" style={{marginTop:14}}><i></i></div>}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14}}>
            <span style={{color:'var(--n7)',fontSize:13}}>정상 {good}행 · 오류 {rows.length-good}행 — 오류 행은 제외하고 반영합니다</span>
            <div style={{display:'flex',gap:8}}><button className="btn" onClick={()=>toast('오류 행 리포트를 내려받습니다')}>오류 리포트</button><button className="btn pri" disabled={phase!=='preview'} onClick={apply}>정상 행 {good}건 반영</button></div>
          </div>
        </div>}
      </div>
    </div>
  </div>;
}

/* audit */
function Audit({toast}){
  const [flt,setFlt]=useState('전체');
  const [selId,setSelId]=useState(1);
  const [tax,setTax]=useState(TAXV0);
  const [modal,setModal]=useState(false);
  const [mail,setMail]=useState('tax@hanbit-demo.example');
  const list=LOGS0.filter(l=>flt==='전체'||l.type===flt);
  const cur=LOGS0.find(l=>l.id===selId)||LOGS0[0];
  return <div className="wrap">
    <div className="sec-head" style={{marginTop:0}}><div><div className="mono">audit trail</div><h2 className="h2" style={{marginTop:4}}>세금계산서 정보·감사 로그</h2></div>
      <button className="btn" onClick={()=>toast('선택한 조건의 로그를 엑셀로 내려받습니다')}><I n="download-simple"/>로그 내려받기</button></div>
    <div className="bento" style={{marginTop:0}}>
      <div className="tile span4" style={{padding:0,overflow:'hidden'}}>
        <div style={{padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div className="chips">{['전체','주문','결제','취소','반품','가격'].map(f=><button key={f} className={'chip'+(flt===f?' on':'')} onClick={()=>setFlt(f)}>{f}</button>)}</div>
          <span className="mono">append-only</span>
        </div>
        <table><thead><tr><th>일시</th><th>유형</th><th>행위자</th><th>대상</th></tr></thead><tbody>
          {list.map(l=><tr key={l.id} className={'row'+(selId===l.id?' sel':'')} onClick={()=>setSelId(l.id)}><td className="mono" style={{textTransform:'none'}}>{l.t}</td><td><span className="pill">{l.type}</span></td><td>{l.who}</td><td>{l.tgt}</td></tr>)}
        </tbody></table>
      </div>
      <div className="tile span2">
        <h3><span className="ic"><I n="git-diff"/></span>변경 전후 값</h3>
        <div className="mono" style={{marginTop:12,textTransform:'none'}}>{cur.tgt}</div>
        <div className="diff" style={{marginTop:10}} key={cur.id}>
          <div><div className="mono">이전</div><div style={{marginTop:6}}>{cur.b}</div></div>
          <div className="after"><div className="mono" style={{color:'var(--m700)'}}>이후</div><div style={{marginTop:6}}>{cur.a}</div></div>
        </div>
        <div style={{color:'var(--n7)',fontSize:12.5,marginTop:12}}>{cur.who} · {cur.t}</div>
      </div>
      <div className="tile span6" style={{borderRadius:20,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h3><span className="ic"><I n="receipt"/></span>세금계산서 발행 정보 · 한빛유통</h3>
          <button className="btn sm" onClick={()=>setModal(true)}>정보 수정</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28,marginTop:14}}>
          <div><div className="kv"><span>사업자등록번호</span><b>123-45-*****</b></div><div className="kv"><span>발행 이메일</span><b>{mail}</b></div><div className="kv"><span>업태 / 종목</span><b>도소매 / 산업용 소모품</b></div><div className="kv"><span>현재 버전</span><b>v{tax[0].v}</b></div></div>
          <div className="tl">{tax.map((x,i)=><div key={x.v} className={'it'+(i===0?' cur':'')}><b>v{x.v}</b> · {x.m}<div className="mono" style={{textTransform:'none',marginTop:2}}>{x.t}</div></div>)}</div>
        </div>
      </div>
    </div>
    {modal&&<div className="modal-veil" onClick={()=>setModal(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h4>세금계산서 정보 수정</h4>
      <div className="field"><label>발행 이메일</label><input value={mail} onChange={e=>setMail(e.target.value)}/></div>
      <div style={{color:'var(--n7)',fontSize:13,marginBottom:16}}>저장하면 이전 값은 버전 이력에 보관되고 발행 이력과 연결됩니다.</div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8}}><button className="btn" onClick={()=>setModal(false)}>취소</button><button className="btn pri" onClick={()=>{setTax([{v:tax[0].v+1,t:'방금',m:'발행 이메일 변경'},...tax]);setModal(false);toast('새 버전 v'+(tax[0].v+1)+'이 저장되고 이전 값은 이력에 보관됩니다')}}>저장</button></div>
    </div></div>}
  </div>;
}

function App(){
  const [tab,setTab]=useState(0);
  const [msg,setMsg]=useState(null);
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(null),2800)};
  return <div className="page" data-archetype="bento-grid">
    <header className="topnav">
      <div className="brand"><span className="mk"><I n="stack"/></span>모아 오더스<span className="mono" style={{marginLeft:6}}>admin</span></div>
      <nav className="tabs">{TABS.map((t,i)=><button key={t} className={'tab'+(tab===i?' on':'')} onClick={()=>setTab(i)}>{t}</button>)}</nav>
      <div className="right">
        <button className="iconbtn" onClick={()=>toast('알림 4건 · 승인 대기와 기한 초과 주문이 있습니다')}><I n="bell"/><span className="dot"></span></button>
        <button className="me" onClick={()=>toast('마스터 권한 · 전체 메뉴가 표시됩니다')}><span className="av">김</span><span style={{fontSize:13}}>김도현 · 마스터</span></button>
      </div>
    </header>
    <main key={tab} className="rise" style={{flex:1}} data-screen={SCREEN_ID[tab]}>
      {tab===0&&<Main toast={toast} goto={setTab}/>}
      {tab===1&&<Orders toast={toast}/>}
      {tab===2&&<Stats toast={toast}/>}
      {tab===3&&<Audit toast={toast}/>}
    </main>
    {msg&&<div className="toast"><I n="check-circle"/>{msg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
