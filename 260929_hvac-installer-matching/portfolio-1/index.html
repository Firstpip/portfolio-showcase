<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 추천형 주거 공조 시공 매칭 플랫폼 — 고객용 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- icon set: Lucide 스타일 (inline SVG, data-lucide 표기) -->
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#edf5ff;
  --m100:#dbeaff;
  --m200:#b8d6ff;
  --m300:#8cbcff;
  --m400:#5ca0ff;
  --m500:#2e86ff;
  --m600:#006bff;
  --m700:#0058d1;
  --m800:#0044a3;
  --m900:#003073;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f8f9fb;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#71757a;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
:root{--ink:var(--n10);--sh:0 4px 5px rgba(71,103,136,.04),0 8px 15px rgba(71,103,136,.03),0 30px 50px rgba(71,103,136,.08);--sh-s:0 1px 2px rgba(71,103,136,.08),0 6px 18px rgba(71,103,136,.06)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(31,137,75,.45)}70%{box-shadow:0 0 0 7px rgba(31,137,75,0)}}
@keyframes airDrift{0%{transform:translateX(-30px)}100%{transform:translateX(40px)}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes barGrow{from{width:0}}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
/* 검색 헤더 (sticky) */
.search-header{position:sticky;top:0;z-index:40;background:var(--n1);border-bottom:1px solid var(--n3)}
.header-row{display:flex;align-items:center;gap:20px;padding:12px 32px;max-width:1440px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--m700);white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--m600);display:grid;place-items:center;color:var(--n1)}
.search-bar{display:flex;align-items:center;border:1px solid var(--n4);border-radius:40px;background:var(--n1);box-shadow:var(--sh-s);padding:4px 4px 4px 8px;flex:0 1 560px;margin-left:8px}
.search-segment{text-align:left;padding:6px 18px;border-radius:30px;flex:1;transition:background .2s}
.search-segment:hover{background:var(--n2)}
.segment-label{font-size:11px;font-weight:600;color:var(--n7)}
.segment-value{font-size:13px;font-weight:500;color:var(--n9);white-space:nowrap}
.search-divider{width:1px;height:26px;background:var(--n3)}
.search-submit{width:40px;height:40px;border-radius:50%;background:var(--m600);color:var(--n1);display:grid;place-items:center;position:relative;overflow:hidden}
.header-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-btn{padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--n8);display:flex;align-items:center;gap:6px;transition:background .2s}
.nav-btn:hover{background:var(--n2)}
.nav-btn.on{background:var(--m50);color:var(--m700)}
.filter-chips{display:flex;gap:10px;overflow-x:auto;padding:4px 32px 14px;max-width:1440px;margin:0 auto;width:100%;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:50px;border:1px solid var(--n4);font-size:13px;font-weight:600;color:var(--n8);white-space:nowrap;background:var(--n1);transition:all .2s}
.chip:hover{border-color:var(--n6)}
.chip.active{border-color:var(--m600);background:var(--m50);color:var(--m700)}
.filter-toggle{margin-left:auto}
.main{width:100%;flex:1;max-width:1440px;margin:0 auto;padding:28px 32px 56px}
/* hero */
.hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,var(--m700),var(--m900));color:var(--n1);padding:52px 56px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:420px}
.hero h1{font-size:56px;line-height:1.08;letter-spacing:-.035em;font-weight:700}
.hero p{margin-top:18px;font-size:18px;line-height:1.6;color:var(--m100);max-width:460px}
.hero-art{position:absolute;inset:0;pointer-events:none;opacity:.5}
.hero-art .wave{animation:airDrift 7s ease-in-out infinite alternate}
.hero-art .wave2{animation:airDrift 9s ease-in-out infinite alternate-reverse}
.hero-left,.form-card{position:relative;z-index:2}
.form-card{background:var(--n1);color:var(--n9);border-radius:24px;padding:26px;box-shadow:var(--sh);animation:fadeUp .6s both}
.form-card h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.field{margin-bottom:16px}
.field label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--n7);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border:1px solid var(--n4);border-radius:8px;font-size:13px;font-weight:600;color:var(--n8);background:var(--n1);transition:all .15s}
.seg button.on{border-color:var(--m600);background:var(--m50);color:var(--m700)}
input[type=range]{width:100%;accent-color:var(--m600)}
.btn-primary{position:relative;overflow:hidden;background:var(--m600);color:var(--n1);border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .15s}
.btn-primary:hover{background:var(--m700);transform:translateY(-1px)}
.btn-primary:disabled{background:var(--n4);cursor:not-allowed;transform:none}
.btn-primary .rp{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.4);animation:ripple .6s ease-out forwards;pointer-events:none}
.btn-ghost{border:1px solid var(--n4);background:var(--n1);color:var(--n9);border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s,background .2s}
.btn-ghost:hover{border-color:var(--n7);background:var(--n0)}
.block{width:100%}
/* result */
.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:44px 0 18px}
.section-title h2{font-size:26px;letter-spacing:-.03em;font-weight:700}
.section-title span{font-size:14px;color:var(--n7)}
.reco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.reco-card{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:24px;box-shadow:var(--sh-s);animation:fadeUp .5s both;position:relative;transition:transform .2s,box-shadow .2s}
.reco-card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.reco-card.best{border:2px solid var(--m600)}
.badge-best{position:absolute;top:-12px;left:20px;background:var(--m600);color:var(--n1);font-size:12px;font-weight:700;padding:4px 12px;border-radius:50px}
.reco-card h4{font-size:19px;letter-spacing:-.02em;margin-bottom:6px}
.match{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n7);margin-bottom:14px}
.bar{flex:1;height:6px;border-radius:6px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m600);border-radius:6px;animation:barGrow 1s ease-out}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;padding:14px;border-radius:12px;background:var(--n0)}
.spec div{font-size:12px;color:var(--n7)}.spec b{display:block;font-size:15px;color:var(--n9);margin-top:2px}
.price-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:13px;color:var(--n7)}
.price-line strong{font-size:22px;color:var(--n10);letter-spacing:-.02em}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--s3-bg);color:var(--s3-text);padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:18px}
.skel{height:260px;border-radius:20px;background:linear-gradient(90deg,var(--n2) 25%,var(--n3) 50%,var(--n2) 75%);background-size:600px 100%;animation:shimmer 1.2s infinite linear}
/* grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.listing-card{cursor:pointer;animation:fadeUp .5s both;transition:transform .25s}
.listing-card:hover{transform:scale(1.02)}
.card-image-wrap{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--n2)}
.card-image-wrap svg.art{width:100%;height:100%;display:block}
.card-favorite{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--n8)}
.card-favorite.on{color:var(--s2)}
.card-tag{position:absolute;left:12px;top:12px;background:var(--n1);font-size:11px;font-weight:700;padding:5px 10px;border-radius:50px;color:var(--n9)}
.card-body{padding:12px 4px}
.card-row-1{display:flex;justify-content:space-between;gap:8px}
.card-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.card-rating{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600}
.card-meta{font-size:13px;color:var(--n7);margin-top:3px}
.card-price{font-size:16px}
.price-unit{font-size:13px;color:var(--n7);margin-left:3px}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--s1-text);font-size:12px;font-weight:600}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,30,32,.35);z-index:60;animation:fadeUp .2s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--n1);z-index:70;overflow-y:auto;animation:slideIn .3s both;box-shadow:var(--sh)}
.drawer-head{padding:24px 28px 0}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:220px;margin:16px 28px}
.gal>*{border-radius:12px;overflow:hidden;background:var(--n2)}.gal>*:first-child{grid-row:span 2}
.gal svg{width:100%;height:100%;display:block}
.dsec{padding:0 28px;margin-bottom:22px}.dsec h5{font-size:15px;margin-bottom:10px}
.review{border-top:1px solid var(--n3);padding:12px 0;font-size:14px;line-height:1.55;color:var(--n8)}
.review b{color:var(--n9)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--m100);color:var(--m700);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
/* chat */
.chat-wrap{display:grid;grid-template-columns:320px 1fr 300px;border:1px solid var(--n3);border-radius:20px;overflow:hidden;background:var(--n1);height:640px;box-shadow:var(--sh-s)}
.rooms{border-right:1px solid var(--n3);overflow-y:auto}
.room{display:flex;gap:12px;padding:16px 18px;width:100%;text-align:left;border-bottom:1px solid var(--n2);transition:background .15s}
.room:hover{background:var(--n0)}.room.on{background:var(--m50)}
.room .t{font-size:14px;font-weight:600}.room .s{font-size:12px;color:var(--n7);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.convo{display:flex;flex-direction:column;min-width:0}
.convo-head{padding:16px 22px;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--n0)}
.bubble{max-width:70%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeUp .3s both}
.bubble.me{align-self:flex-end;background:var(--m600);color:var(--n1);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--n1);border:1px solid var(--n3);border-bottom-left-radius:4px}
.bubble .time{display:block;font-size:11px;opacity:.7;margin-top:4px}
.bubble svg.photo{width:220px;height:140px;border-radius:10px;display:block;margin-bottom:6px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;background:var(--n1);border:1px solid var(--n3);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--n6);animation:pulseDot 1.2s infinite}
.composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--n3);align-items:center}
.composer input{flex:1;border:1px solid var(--n4);border-radius:50px;padding:11px 18px;font-size:14px;outline:none}
.composer input:focus{border-color:var(--m600)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--n4);display:grid;place-items:center;color:var(--n8);flex:none}
.icon-btn:hover{background:var(--n2)}
.info{border-left:1px solid var(--n3);padding:20px;overflow-y:auto;font-size:13px;color:var(--n8)}
.info h6{font-size:12px;color:var(--n7);margin:16px 0 8px}
/* booking */
.book-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:26px;box-shadow:var(--sh-s)}
.panel h3{font-size:19px;letter-spacing:-.02em;margin-bottom:16px}
.stepper{display:flex;margin-bottom:26px}
.step{flex:1;text-align:center;position:relative;font-size:12px;font-weight:600;color:var(--n6)}
.step .dot{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:grid;place-items:center;margin:0 auto 8px;position:relative;z-index:1;font-size:13px}
.step::before{content:'';position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--n3)}
.step:first-child::before{display:none}
.step.done .dot{background:var(--m600);color:var(--n1)}
.step.done::before{background:var(--m600)}
.step.done,.step.cur{color:var(--n9)}
.step.cur .dot{background:var(--n1);border:2px solid var(--m600);color:var(--m700);animation:pulseDot 1.6s infinite}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--n7);padding:6px 0}
.cal button{aspect-ratio:1;border-radius:10px;font-size:14px;font-weight:500;color:var(--n9)}
.cal button:hover{background:var(--n2)}.cal button.sel{background:var(--m600);color:var(--n1)}
.cal button:disabled{color:var(--n5);cursor:not-allowed;background:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.slots button{padding:10px;border:1px solid var(--n4);border-radius:8px;font-size:13px;font-weight:600}
.slots button.sel{border-color:var(--m600);background:var(--m50);color:var(--m700)}
.sum-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;color:var(--n8);border-bottom:1px solid var(--n2)}
.sum-row.total{border:none;font-size:18px;font-weight:700;color:var(--n10);padding-top:16px}
.escrow{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--n0);font-size:13px;line-height:1.5;color:var(--n8);margin:16px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:50px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n7)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}.pill.bad{background:var(--s2-bg);color:var(--s2-text)}.pill.wait{background:var(--n2);color:var(--n7)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:90;animation:fadeUp .3s both;display:flex;gap:8px;align-items:center}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;color:var(--n7);padding:10px 12px;border-bottom:1px solid var(--n3)}
.table td{padding:14px 12px;border-bottom:1px solid var(--n2)}
.my-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.footer{border-top:1px solid var(--n3);padding:28px 32px;color:var(--n7);font-size:13px;text-align:center;background:var(--n1)}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:32px}.hero h1{font-size:38px}.reco-grid,.book-grid,.my-grid{grid-template-columns:1fr}.chat-wrap{grid-template-columns:1fr}.rooms,.info{display:none}.search-bar{display:none}.header-row{padding:12px 16px}.main{padding:20px 16px}}
</style>

  /* ---------- 예약·결제 ---------- */
const Booking=()=>{
  const {cat,setCat,sort,setSort,minRate,setMinRate,list,fav,toggleFav,setQuick,go,say,chatWith,setChatWith,bookWith,setBookWith}=React.useContext(Ctx);
    const [step,setStep]=useState(1);
    const [day,setDay]=useState(17);
    const [slot,setSlot]=useState('오전 09:00');
    const [busy,setBusy]=useState(false);
    const steps=['예약 요청','업체 확정','에스크로 결제','시공 완료'];
    const pay=()=>{ if(busy)return; setBusy(true); setTimeout(()=>{setStep(3);setBusy(false);say('에스크로 보관이 완료되었습니다')},1400)};
    return (<div className="book-grid">
      <div className="panel">
        <h3>{bookWith.name} · 시공 예약</h3>
        <div className="stepper">{steps.map((s,i)=>(<div key={s} className={'step'+(i<step?' done':i===step?' cur':'')}><div className="dot">{i<step?<Ic n="check" s={15} sw={2.4}/>:i+1}</div>{s}</div>))}</div>
        <div style={{fontWeight:600,marginBottom:10}}>10월 시공 희망일</div>
        <div className="cal">
          {['일','월','화','수','목','금','토'].map(d=><div key={d} className="h">{d}</div>)}
          {[...Array(4)].map((_,i)=><div key={'e'+i}/>)}
          {[...Array(31)].map((_,i)=>{const d=i+1;return <button key={d} className={day===d?'sel':''} disabled={d<12||d%7===0} onClick={()=>setDay(d)}>{d}</button>})}
        </div>
        <div className="slots">{['오전 09:00','오전 11:00','오후 01:00','오후 03:00','오후 05:00','협의'].map(s=>(<button key={s} className={slot===s?'sel':''} onClick={()=>setSlot(s)}>{s}</button>))}</div>
      </div>
      <div className="panel">
        <h3>결제 요약</h3>
        <div className="sum-row"><span>시스템 에어컨 4대 설치</span><span>7,200,000원</span></div>
        <div className="sum-row"><span>배관·전기 공사</span><span>860,000원</span></div>
        <div className="sum-row"><span>철거 · 폐기</span><span>240,000원</span></div>
        <div className="sum-row total"><span>총 결제 금액</span><span>8,300,000원</span></div>
        <div className="escrow"><Ic n="lock" s={20}/><div>결제 금액은 <b>에스크로</b>에 보관되고, 시공 완료 확인 후 업체에 지급됩니다. 취소·환불은 단계별 규정에 따릅니다.</div></div>
        <div className="sum-row" style={{border:'none'}}><span>시공 일정</span><b>10월 {day}일 · {slot}</b></div>
        {step<2&&<button className="btn-primary block" onClick={()=>{setStep(2);say('업체가 예약을 확정했습니다')}} style={{marginTop:6}}><Ic n="cal" s={16}/>예약 요청 보내기</button>}
        {step===2&&<button className="btn-primary block" onClick={pay} disabled={busy}><Ic n="card" s={16}/>{busy?'결제 처리 중…':'에스크로 안전 결제하기'}</button>}
        {step>=3&&<div className="pill ok" style={{width:'100%',justifyContent:'center',padding:12,fontSize:14}}><Ic n="shield" s={16}/>에스크로 보관 중 · 시공 완료 후 지급</div>}
        {step>=3&&<button className="btn-ghost block" style={{justifyContent:'center',marginTop:10}} onClick={()=>{setStep(4);say('시공 완료 확인 · 대금이 지급됩니다')}}>시공 완료 확인</button>}
      </div>
    </div>);
  };

  /* ---------- 마이페이지 ---------- */
const My=()=>{const {cat,setCat,sort,setSort,minRate,setMinRate,list,fav,toggleFav,setQuick,go,say,chatWith,setChatWith,bookWith,setBookWith}=React.useContext(Ctx);return (<div className="my-grid">
    <div className="panel"><h3>내 예약</h3>
      <table className="table"><thead><tr><th>업체</th><th>일정</th><th>금액</th><th>상태</th></tr></thead><tbody>
        <tr><td>한빛 에어시스템</td><td>10월 17일</td><td>8,300,000원</td><td><span className="pill wait">업체 확정 대기</span></td></tr>
        <tr><td>맑은숨 환기연구소</td><td>9월 24일</td><td>1,450,000원</td><td><span className="pill ok">시공 완료</span></td></tr>
        <tr><td>새벽 클린에어</td><td>9월 02일</td><td>270,000원</td><td><span className="pill bad">환불 완료</span></td></tr>
      </tbody></table></div>
    <div className="panel"><h3>관심 업체</h3>
      {INSTALLERS.filter(i=>fav[i.id]).length===0&&<div style={{color:'var(--n7)',fontSize:14}}>관심 업체를 하트로 저장해 보세요.</div>}
      {INSTALLERS.filter(i=>fav[i.id]).map(i=>(<div key={i.id} style={{display:'flex',gap:12,alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--n2)'}}><div className="avatar">{i.name[0]}</div><div style={{flex:1}}><b>{i.name}</b><div style={{fontSize:12,color:'var(--n7)'}}>{i.area}</div></div><button className="btn-ghost" onClick={()=>setQuick(i)}>보기</button></div>))}
      <h3 style={{marginTop:28}}>AI 추천 이력</h3>
      <div className="spec" style={{gridTemplateColumns:'1fr'}}><div>아파트 · 34평 · 노후 교체<b>시스템 에어컨 멀티 (일치도 94%)</b></div></div>
    </div>
  </div>);};

function App(){
  const [view,setView]=useState('main');
  const [toast,setToast]=useState(null);
  const [fav,setFav]=useState({1:true});
  const [quick,setQuick]=useState(null);
  const [cat,setCat]=useState('전체');
  const [sort,setSort]=useState('추천순');
  const [minRate,setMinRate]=useState(0);
  const [chatWith,setChatWith]=useState(INSTALLERS[0]);
  const [bookWith,setBookWith]=useState(INSTALLERS[0]);
  const say=(m)=>{setToast(m);setTimeout(()=>setToast(null),2200)};
  const go=(v)=>{setView(v);setQuick(null);window.scrollTo({top:0})};
  const list=useMemo(()=>{
    let l=INSTALLERS.filter(i=>(cat==='전체'||i.cat===cat)&&i.rate>=minRate);
    if(sort==='평점순') l=[...l].sort((a,b)=>b.rate-a.rate);
    if(sort==='경력순') l=[...l].sort((a,b)=>b.years-a.years);
    return l;
  },[cat,sort,minRate]);
  const toggleFav=(id,e)=>{e&&e.stopPropagation();setFav(f=>({...f,[id]:!f[id]}));};

  const nav=[['main','AI 추천','bolt'],['installer','업체 탐색','search'],['chat','실시간 채팅','chat'],['booking','예약·결제','cal'],['mypage','마이페이지','user']];
  const ctxv={cat,setCat,sort,setSort,minRate,setMinRate,list,fav,toggleFav,setQuick,go,say,chatWith,setChatWith,bookWith,setBookWith};
  return (<Ctx.Provider value={ctxv}><div className="app">
    <header className="search-header" data-search-header>
      <div className="header-row">
        <div className="brand"><span className="brand-mark"><Ic n="wind" s={18}/></span>공기결</div>
        <div className="search-bar">
          <button className="search-segment" onClick={()=>go('installer')}><div className="segment-label">지역</div><div className="segment-value">화성시 전체</div></button>
          <div className="search-divider"/>
          <button className="search-segment" onClick={()=>go('main')}><div className="segment-label">주거 · 평수</div><div className="segment-value">아파트 34평</div></button>
          <div className="search-divider"/>
          <button className="search-segment" onClick={()=>go('installer')}><div className="segment-label">시공 종류</div><div className="segment-value">{cat}</div></button>
          <button className="search-submit" onClick={()=>go('installer')} aria-label="검색"><Ic n="search" s={18}/></button>
        </div>
        <nav className="header-nav">{nav.map(([k,l,ic])=>(<button key={k} className={'nav-btn'+(view===k?' on':'')} onClick={()=>go(k)}>{l}</button>))}</nav>
      </div>
      <div className="filter-chips" data-filter-chips>
        <button className={'chip'+(cat==='전체'?' active':'')} onClick={()=>{setCat('전체');setView('installer')}}><Ic n="wind" s={15}/><span className="chip-label">전체</span></button>
        <button className={'chip'+(cat==='시스템 에어컨'?' active':'')} onClick={()=>{setCat('시스템 에어컨');setView('installer')}}><Ic n="sliders" s={15}/><span className="chip-label">시스템 에어컨</span></button>
        <button className={'chip'+(cat==='벽걸이 에어컨'?' active':'')} onClick={()=>{setCat('벽걸이 에어컨');setView('installer')}}><Ic n="bolt" s={15}/><span className="chip-label">벽걸이 에어컨</span></button>
        <button className={'chip'+(cat==='전열교환 환기'?' active':'')} onClick={()=>{setCat('전열교환 환기');setView('installer')}}><Ic n="wind" s={15}/><span className="chip-label">전열교환 환기</span></button>
        <button className={'chip'+(cat==='에어컨 청소'?' active':'')} onClick={()=>{setCat('에어컨 청소');setView('installer')}}><Ic n="shield" s={15}/><span className="chip-label">에어컨 청소</span></button>
        <button className={'chip'+(cat==='덕트 · 배관'?' active':'')} onClick={()=>{setCat('덕트 · 배관');setView('installer')}}><Ic n="pin" s={15}/><span className="chip-label">덕트 · 배관</span></button>
        <button className="chip filter-toggle" onClick={()=>{setMinRate(minRate?0:4.8);setView('installer');say(minRate?'평점 필터 해제':'평점 4.8 이상만 표시')}}><Ic n="sliders" s={15}/> 필터</button>
      </div>
    </header>
    <main className="main" data-layout="grid-or-split">
      {view==='main'&&<Main/>}{view==='installer'&&<Installer/>}{view==='chat'&&<Chat/>}{view==='booking'&&<Booking/>}{view==='mypage'&&<My/>}
    </main>
    <footer className="footer">© 2026 공기결 (가상 서비스) — 자체 개발 데모 프로젝트 · 화면의 업체·리뷰·금액은 예시 데이터입니다</footer>
    {quick&&<>
      <div className="scrim" onClick={()=>setQuick(null)}/>
      <aside className="drawer">
        <div className="drawer-head"><div style={{display:'flex',justifyContent:'space-between'}}><div><h2 style={{fontSize:22,letterSpacing:'-.02em'}}>{quick.name}</h2><div className="card-meta">{quick.area} · {quick.cat}</div></div><button className="icon-btn" onClick={()=>setQuick(null)} aria-label="닫기"><Ic n="x" s={17}/></button></div></div>
        <div className="gal"><div><Art seed={quick.id}/></div><div><Art seed={quick.id+1}/></div><div><Art seed={quick.id+2}/></div></div>
        <div className="dsec"><div style={{display:'flex',gap:16,fontSize:14,color:'var(--n8)'}}><span><b>★ {quick.rate}</b> 후기 {quick.rv}</span><span>경력 {quick.years}년</span><span>시공 {quick.jobs}건</span></div></div>
        <div className="dsec"><h5>시공 사례</h5><div className="spec" style={{gridTemplateColumns:'1fr 1fr'}}><div>아파트 34평<b>시스템 에어컨 4대</b></div><div>빌라 22평<b>벽걸이 3대 + 환기</b></div></div></div>
        <div className="dsec"><h5>리뷰</h5>{REVIEWS.map((r,i)=>(<div key={i} className="review"><b>{r.n}</b> · ★ {r.r}<br/>{r.t}</div>))}</div>
        <div className="dsec" style={{display:'flex',gap:10,paddingBottom:30}}>
          <button className="btn-ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>{setChatWith(quick);go('chat')}}><Ic n="chat" s={16}/>채팅 문의</button>
          <button className="btn-primary" style={{flex:1}} onClick={()=>{setBookWith(quick);go('booking')}}><Ic n="cal" s={16}/>예약하기</button>
        </div>
      </aside></>}
    {toast&&<div className="toast"><Ic n="check" s={16} sw={2.4}/>{toast}</div>}
  </div></Ctx.Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
