<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공조 시공 파트너스 정산·백오피스 — 관리자 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 305°, dark) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#ffe1fd;
  --m100:#ffc4fa;
  --m200:#ffa0f7;
  --m300:#ff77f4;
  --m400:#ff51f1;
  --m500:#ff2bee;
  --m600:#d123c3;
  --m700:#a31c98;
  --m800:#73136b;
  --m900:#73136b;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#000000;
  --n1:#141414;
  --n2:#5a535a;
  --n3:#7a7179;
  --n4:#989097;
  --n5:#9aa3ad;
  --n6:#d7d5d7;
  --n7:#e6e5e6;
  --n8:#f0eff0;
  --n9:#f8f7f8;
  --n10:#ffffff;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#3bce78; --s1-bg:#183926; --s1-text:#86eaaf; /* 성공/진행/정상/상승 */
  --s2:#ff5c5c; --s2-bg:#391818; --s2-text:#ea8686; /* 오류/위험/실패/하락/환불 */
  --s3:#d6a95c; --s3-bg:#392d18; --s3-text:#eac586; /* 경고/주의 */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sweep{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes drawLine{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spinIt{to{transform:rotate(360deg)}}
.layout{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n2);padding:16px 12px;display:flex;flex-direction:column;overflow-y:auto}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--m500);display:grid;place-items:center;color:var(--n0)}
.sidebar-brand b{font-size:15px;letter-spacing:-.01em;color:var(--n10)}
.env{margin:0 4px 14px;border:1px solid var(--n2);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--n7);font-size:12px;width:calc(100% - 8px)}
.env i{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;margin-right:7px;position:relative}
.env i::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--s1);animation:ping 1.8s infinite}
.sidebar-section{margin-bottom:14px}
.sidebar-section-title{font-size:11px;color:var(--n5);font-weight:600;padding:6px 10px;letter-spacing:.04em}
.sidebar-link{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--n7);font-weight:500;text-align:left;transition:background .15s,color .15s;position:relative}
.sidebar-link:hover{background:var(--n2);color:var(--n9)}
.sidebar-link.active{background:var(--n2);color:var(--m300)}
.sidebar-link.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--m500)}
.cnt{margin-left:auto;font-size:11px;background:var(--n2);color:var(--n7);padding:1px 7px;border-radius:50px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--n2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.main{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);padding:20px 28px 40px}
.page-header{margin-bottom:16px}
.page-title-row{display:flex;justify-content:space-between;align-items:center}
.page-title{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--n10)}
.page-meta{color:var(--n6);font-size:12px;margin-top:4px}
.page-actions{display:flex;gap:8px}
.btn-primary{background:var(--m500);color:var(--n0);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn-primary:hover{background:var(--m400)}
.btn-primary:disabled{background:var(--n2);color:var(--n5);cursor:not-allowed}
.btn-secondary{border:1px solid var(--n3);border-radius:8px;padding:8px 14px;font-weight:500;color:var(--n8);display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn-secondary:hover{background:var(--n2)}
.btn-danger{border:1px solid var(--s2);color:var(--s2-text);border-radius:8px;padding:8px 14px;font-weight:600}
.btn-danger:hover{background:var(--s2-bg)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--n1);border:1px solid var(--n2);border-radius:8px;padding:16px 18px;position:relative;animation:fadeIn .4s both}
.stat-label{color:var(--n6);font-size:12px}
.stat-value{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;color:var(--n10)}
.stat-delta{font-size:12px;font-weight:600}
.stat-delta.positive{color:var(--s1-text)}.stat-delta.negative{color:var(--s2-text)}
.stat-sparkline{position:absolute;right:14px;bottom:14px;width:84px;height:30px}
.stat-sparkline path{fill:none;stroke:var(--n6);stroke-width:1.6;stroke-dasharray:400;animation:drawLine 1.4s ease-out forwards}
.stat-card.hl .stat-sparkline path{stroke:var(--m500)}
.data-section{background:var(--n1);border:1px solid var(--n2);border-radius:8px}
.tab-bar{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--n2)}
.tab{padding:12px 12px;color:var(--n6);font-weight:500;position:relative}
.tab:hover{color:var(--n9)}
.tab.active{color:var(--n10)}
.tab.active::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--m500)}
.data-toolbar{display:flex;gap:8px;padding:12px 14px;align-items:center;border-bottom:1px solid var(--n2)}
.search{flex:1;max-width:280px;background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:7px 10px;color:var(--n9);outline:none}
.search:focus{border-color:var(--m500)}
.filter-chip{border:1px solid var(--n3);border-radius:50px;padding:5px 11px;color:var(--n7);font-size:12px;transition:all .15s}
.filter-chip.on{border-color:var(--m500);color:var(--m300);background:var(--n2)}
.md{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr)}
.list-rail{border-right:1px solid var(--n2);min-width:0}
.detail-panel{padding:18px;animation:fadeIn .3s both;min-width:0}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11px;color:var(--n5);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--n2);letter-spacing:.03em}
.data-table td{padding:0 14px;height:46px;border-bottom:1px solid var(--n2);color:var(--n8);white-space:nowrap}
.data-table tr.row{cursor:pointer;transition:background .12s}
.data-table tr.row:hover{background:var(--n2)}
.data-table tr.row.sel{background:var(--n2);box-shadow:inset 3px 0 0 var(--m500)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--n2);color:var(--n7)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}.badge.bad{background:var(--s2-bg);color:var(--s2-text)}.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.dl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--n2);color:var(--n7)}
.dl b{color:var(--n9);font-weight:600}.dl.tot{border:none;font-size:15px;padding-top:12px}.dl.tot b{color:var(--n10);font-size:17px}
.dh{font-size:16px;font-weight:600;color:var(--n10);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sub{color:var(--n6);font-size:12px;margin-bottom:14px}
.timeline{margin-top:16px;border-left:1px solid var(--n3);padding-left:14px}
.tl{position:relative;margin-bottom:12px;color:var(--n7)}
.tl::before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--n3);border:2px solid var(--n1)}
.tl.done::before{background:var(--s1)}.tl.fail::before{background:var(--s2)}
.tl b{color:var(--n9);display:block;font-weight:600}
.check{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n2);cursor:pointer;width:100%;text-align:left}
.box{width:16px;height:16px;border-radius:4px;border:1px solid var(--n4);display:grid;place-items:center;flex:none;color:var(--n0)}
.check.on .box{background:var(--m500);border-color:var(--m500)}
.doc{background:var(--n2);border:1px solid var(--n3);border-radius:8px;height:170px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:12px}
.doc::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);background-size:200px 100%;animation:sweep 2.4s infinite linear}
textarea.reason{width:100%;background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:9px;color:var(--n9);resize:none;height:64px;outline:none;margin:10px 0}
textarea.reason:focus{border-color:var(--m500)}
.json{background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:12px;color:var(--n7);line-height:1.6;overflow:auto;max-height:190px;margin-bottom:10px}
.json em{color:var(--m300);font-style:normal}.json u{color:var(--s2-text);text-decoration:none}
.bn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--n2);border-radius:8px;margin-bottom:8px;background:var(--n0);transition:border-color .15s}
.bn:hover{border-color:var(--n4)}
.bn.dragging{opacity:.4}
.thumb{width:92px;height:44px;border-radius:6px;background:var(--n2);flex:none;overflow:hidden}
.toggle{width:34px;height:20px;border-radius:20px;background:var(--n3);position:relative;transition:background .2s;flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--n10);transition:left .2s}
.toggle.on{background:var(--m500)}.toggle.on::after{left:16px;background:var(--n0)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.field{margin-bottom:10px}.field label{display:block;color:var(--n6);font-size:12px;margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--n0);border:1px solid var(--n2);border-radius:8px;padding:8px 10px;color:var(--n9);outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--m500)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n1);border:1px solid var(--n3);border-left:3px solid var(--m500);padding:12px 16px;border-radius:8px;color:var(--n10);z-index:99;animation:fadeIn .25s both;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--n4);border-top-color:var(--m500);border-radius:50%;animation:spinIt .8s linear infinite;display:inline-block}
.chartbox{padding:16px}
.ch-bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--n2)}
.ch-bars div{flex:1;background:var(--m700);border-radius:3px 3px 0 0;transform-origin:bottom;animation:growBar .8s ease-out both;transition:background .15s}
.ch-bars div:hover{background:var(--m500)}
.ch-lab{display:flex;gap:8px;color:var(--n6);font-size:11px;margin-top:6px}.ch-lab span{flex:1;text-align:center}
.flow{position:relative;border:1px solid var(--n2);border-radius:8px;background:var(--n1);margin-bottom:16px;overflow:hidden;padding:18px 22px;display:flex;align-items:center;gap:26px;animation:fadeIn .5s both}
.flow h2{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:var(--n10);max-width:300px}
.flow p{color:var(--n6);margin-top:8px;max-width:300px;line-height:1.5}
.flow svg{flex:1;height:110px;min-width:0}
.flow .rail{stroke:var(--n3);stroke-width:2;fill:none}
.flow .live{stroke:var(--m500);stroke-width:2.4;fill:none;stroke-dasharray:6 10;animation:dashMove 1.4s linear infinite}
.flow .node{fill:var(--n0);stroke:var(--n4);stroke-width:1.5}
.flow .node.hi{stroke:var(--m500)}
.flow text{fill:var(--n7);font-size:11px;font-family:inherit}
@keyframes dashMove{to{stroke-dashoffset:-32}}
@media (max-width:1100px){.md{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:820px){.sidebar{position:static;width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--n2)}.layout{flex-direction:column}.main{margin-left:0;width:100%;padding:16px}.sidebar-section-title,.env,.me{display:none}}
</style>

          <pre className="json mono">{!bad?`{ "system": "ceiling-4way-multi",\n  "cap_kw": 22.4, "match": 0.94 }`:cur.type==='타임아웃'?'// 5,000ms 초과 — 응답 없음':cur.type==='파싱 실패'?'{ "system": "ceiling-4way-multi", "cap_kw": 22.4,  // 응답 본문 JSON 종료 누락':'{ "system": null, "cap_kw": "22.4kW" }  // cap_kw: number 기대'}</pre>
          <div className="timeline">
            <div className="tl done"><b>1차 호출</b>{bad?cur.type:'정상 응답'}</div>
            {bad&&<div className="tl done"><b>재시도 #1 · 500ms 후</b>동일 예외</div>}
            {bad&&<div className="tl done"><b>재시도 #2 · 1,000ms 후</b>동일 예외</div>}
            {cur.fb&&<div className="tl done"><b>폴백 전환</b>규칙 기반 추천 응답 · 고객에 안내 문구 노출</div>}
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}><button className="btn-secondary" onClick={()=>say('동일 요청을 재시도 큐에 등록했습니다')}><Ic n="redo"/>재호출</button></div>
        </div>
      </div>
    </section>
  </div>);
};

/* ---------- 배너 · 공지 ---------- */
const Content=()=>{
  const {say}=useContext(Ctx);
  const [bn,setBn]=useState([
    {id:1,t:'가을 환기 점검 캠페인',p:'09.20 ~ 10.15',on:true},
    {id:2,t:'AI 공조 추천 오픈 안내',p:'09.01 ~ 10.31',on:true},
    {id:3,t:'신규 입점 업체 프로모션',p:'10.01 ~ 10.20',on:false},
    {id:4,t:'에스크로 안전 결제 소개',p:'상시',on:true},
  ]);
  const [notes,setNotes]=useState([{id:1,t:'추석 연휴 시공 일정 안내',d:'09-20',pub:true},{id:2,t:'에스크로 수수료 정책 변경 안내',d:'09-12',pub:true},{id:3,t:'시스템 점검 안내 (초안)',d:'09-28',pub:false}]);
  const [dragId,setDragId]=useState(null);
  const [title,setTitle]=useState('');const [body,setBody]=useState('');
  const move=(i,d)=>setBn(b=>{const a=[...b];const j=i+d;if(j<0||j>=a.length)return a;[a[i],a[j]]=[a[j],a[i]];return a});
  const drop=(id)=>setBn(b=>{const a=[...b];const from=a.findIndex(x=>x.id===dragId),to=a.findIndex(x=>x.id===id);if(from<0||to<0)return a;const [m]=a.splice(from,1);a.splice(to,0,m);return a});
  const add=()=>{if(!title.trim())return say('제목을 입력해 주세요');setNotes(n=>[{id:Date.now(),t:title,d:'방금',pub:false},...n]);setTitle('');setBody('');say('공지 초안을 저장했습니다')};
  return (<div>
    <div className="page-header"><div className="page-title-row"><h1 className="page-title">배너·공지</h1><div className="page-actions"><button className="btn-primary" onClick={()=>say('변경 사항을 게시했습니다 · 노출 스케줄 갱신')}><Ic n="check"/>게시</button></div></div><div className="page-meta">메인 배너 순서·노출 기간은 스케줄러가 자동 게시·종료합니다</div></div>
    <section className="data-section" style={{marginBottom:16}}>
      <nav className="tab-bar" data-tabs><button className="tab active" onClick={()=>say('메인 배너 4개')}>메인 배너</button><button className="tab" onClick={()=>say('푸터 배너는 확장 범위입니다')}>푸터 배너</button></nav>
      <div style={{padding:16}}>
        {bn.map((b,i)=>(<div key={b.id} className={'bn'+(dragId===b.id?' dragging':'')} draggable onDragStart={()=>setDragId(b.id)} onDragOver={e=>e.preventDefault()} onDrop={()=>{drop(b.id);setDragId(null)}} onDragEnd={()=>setDragId(null)}>
          <span style={{color:'var(--n5)',width:18,fontWeight:600}}>{i+1}</span>
          <div className="thumb"><svg width="92" height="44" viewBox="0 0 92 44"><rect width="92" height="44" fill="var(--n2)"/><path d="M0 30q20-14 40 0t52-6" stroke={b.on?'var(--m500)':'var(--n4)'} strokeWidth="2" fill="none"/><rect x="8" y="8" width="34" height="5" rx="2" fill="var(--n4)"/></svg></div>
          <div style={{flex:1}}><b style={{color:'var(--n10)'}}>{b.t}</b><div style={{color:'var(--n6)',marginTop:2}}>노출 {b.p}</div></div>
          <button className="btn-secondary" style={{padding:'5px 8px'}} onClick={()=>move(i,-1)} aria-label="위로"><Ic n="up" s={13}/></button>
          <button className="btn-secondary" style={{padding:'5px 8px'}} onClick={()=>move(i,1)} aria-label="아래로"><Ic n="down" s={13}/></button>
          <button className={'toggle'+(b.on?' on':'')} onClick={()=>setBn(a=>a.map(x=>x.id===b.id?{...x,on:!x.on}:x))} aria-label="노출 전환"/>
        </div>))}
      </div>
    </section>
    <section className="data-section"><nav className="tab-bar" data-tabs><button className="tab active" onClick={()=>say('공지 목록')}>공지사항</button></nav>
      <div className="two">
        <div>{notes.map(n=>(<div key={n.id} className="bn" style={{background:'var(--n1)'}}><div style={{flex:1}}><b style={{color:'var(--n10)'}}>{n.t}</b><div style={{color:'var(--n6)',marginTop:2}}>{n.d}</div></div><span className={'badge '+(n.pub?'ok':'')}><i/>{n.pub?'게시중':'초안'}</span>
          <button className="btn-secondary" style={{padding:'5px 10px'}} onClick={()=>setNotes(a=>a.map(x=>x.id===n.id?{...x,pub:!x.pub}:x))}>{n.pub?'내리기':'게시'}</button>
          <button className="btn-danger" style={{padding:'5px 10px'}} onClick={()=>{setNotes(a=>a.filter(x=>x.id!==n.id));say('공지를 삭제했습니다')}}>삭제</button></div>))}</div>
        <div><div className="field"><label>제목</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="공지 제목"/></div>
          <div className="field"><label>본문 (저장 시 서버에서 HTML sanitize)</label><textarea rows="5" value={body} onChange={e=>setBody(e.target.value)} placeholder="공지 내용을 입력하세요"/></div>
          <button className="btn-primary" onClick={add}><Ic n="file"/>초안 저장</button></div>
      </div>
    </section>
  </div>);
};

/* ---------- 결제 모니터링 ---------- */
const Payments=()=>{
  const {say}=useContext(Ctx);
  const [f,setF]=useState('전체');
  const list=PAYS.filter(p=>f==='전체'||p.st===f);
  const bars=[42,55,48,70,64,88,76,93,81,99,90,112];
  return (<div>
    <div className="page-header"><div className="page-title-row"><h1 className="page-title">결제 모니터링</h1><div className="page-actions"><button className="btn-secondary" onClick={()=>say('결제 내역 CSV를 생성합니다')}><Ic n="export"/>내보내기</button></div></div><div className="page-meta">PG 웹훅 검증 통과 건만 상태에 반영됩니다 · 멱등성 키 중복 차단 활성</div></div>
    <section className="stat-row" data-stat-row>
      <Stat i={0} hl label="에스크로 보관 잔액" value="1억 1,500만" delta="+9.3%" d={[6,7,7,9,8,11,12]}/>
      <Stat i={1} label="이번 달 결제 건수" value="214건" delta="+18건" d={[5,6,8,7,9,10,12]}/>
      <Stat i={2} label="환불 처리" value="6건" delta="-2건" d={[4,3,5,3,2,3,2]}/>
      <Stat i={3} label="웹훅 검증 실패" value="2건" delta="+2건 · 확인 필요" neg d={[0,0,0,1,0,1,2]}/>
    </section>
    <section className="data-section" style={{marginBottom:16}}><nav className="tab-bar" data-tabs><button className="tab active" onClick={()=>say('최근 12주 집계')}>주간 결제 금액</button></nav>
      <div className="chartbox"><div className="ch-bars">{bars.map((v,i)=>(<div key={i} style={{height:v+'%',animationDelay:i*50+'ms'}} title={v+'백만원'}/>))}</div><div className="ch-lab">{bars.map((_,i)=><span key={i}>{i+1}주</span>)}</div></div></section>
    <section className="data-section"><nav className="tab-bar" data-tabs>{['전체','보관중','정산대기','정산완료','정산실패','환불'].map(t=>(<button key={t} className={'tab'+(f===t?' active':'')} onClick={()=>setF(t)}>{t}</button>))}</nav>
      <table className="data-table"><thead><tr><th>결제번호</th><th>고객</th><th>업체</th><th className="num">금액</th><th>일시</th><th>상태</th></tr></thead>
        <tbody>{list.map(p=>(<tr key={p.id} className="row" onClick={()=>say(p.id+' 웹훅 이력: 검증 통과')}><td className="mono">{p.id}</td><td>{p.cust}</td><td>{p.vendor}</td><td className="num">{p.amt.toLocaleString()}</td><td>{p.at}</td><td><span className={'badge '+stBadge(p.st)}><i/>{p.st}</span></td></tr>))}</tbody></table></section>
  </div>);
};

const App=()=>{
  const [view,setView]=useState('main');
  const [toast,setToast]=useState(null);
  const [pending,setPending]=useState(2);
  const say=(m)=>{setToast(m);setTimeout(()=>setToast(null),2400)};
  const nav=[['운영',[['main','정산 관리','wallet'],['approval','입점 승인','user'],['payment','결제 모니터링','card']]],['시스템',[['ailog','AI 연동 로그','robot'],['content','배너·공지','flag']]]];
  return (<Ctx.Provider value={{say,setPending}}><div className="layout">
    <aside className="sidebar" data-sidebar style={{width:240}}>
      <div className="sidebar-brand"><span className="logo"><Ic n="gear" s={16}/></span><b>공기결 Admin</b></div>
      <button className="env" onClick={()=>say('운영 환경입니다')}><span><i/>Production</span><span>ap-northeast-2</span></button>
      {nav.map(([g,items])=>(<div key={g} className="sidebar-section"><div className="sidebar-section-title">{g}</div>
        {items.map(([k,l,ic])=>(<button key={k} className={'sidebar-link'+(view===k?' active':'')} onClick={()=>setView(k)}><Ic n={ic}/>{l}{k==='approval'&&<span className="cnt">{pending}</span>}</button>))}</div>))}
      <div className="me"><span className="avatar">관</span><div><b style={{color:'var(--n10)'}}>운영 관리자</b><div style={{color:'var(--n6)',fontSize:11}}>admin@demo.example</div></div><button className="sidebar-link" style={{width:'auto',marginLeft:'auto',padding:6}} onClick={()=>say('알림 4건')}><Ic n="bell"/></button></div>
    </aside>
    <main className="main">
      {view==='main'&&<Settle/>}{view==='approval'&&<Approval/>}{view==='payment'&&<Payments/>}{view==='ailog'&&<AiLog/>}{view==='content'&&<Content/>}
    </main>
    {toast&&<div className="toast"><Ic n="check"/>{toast}</div>}
  </div></Ctx.Provider>);
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
