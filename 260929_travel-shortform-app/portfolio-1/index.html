<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다낭로그 — 여행 숏폼·여행정보 앱 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#efefef;
  --m100:#efefef;
  --m200:#efefef;
  --m300:#dfdfdf;
  --m400:#bebfbf;
  --m500:#979899;
  --m600:#6b6c6e;
  --m700:#414245;
  --m800:#17191c;
  --m900:#131517;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#777b86;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--n10)}
i.ph,i.ph-fill{line-height:1;display:inline-block}
.serif{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:400}
.num{font-variant-numeric:tabular-nums}

@keyframes fadeUp{from{opacity:0;transform:translate(0,12px)}to{opacity:1;transform:none}}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes steam{0%{transform:translate(0,0);opacity:0}30%{opacity:.7}100%{transform:translate(0,-36px);opacity:0}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:30;height:56px;background:color-mix(in srgb,var(--n0) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:24px;padding:0 32px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--n10);letter-spacing:-.2px}
.brand-mark{width:28px;height:28px;border-radius:50%;background:var(--m800);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:15px}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.nav-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9999px;color:var(--n7);font-weight:500;white-space:nowrap;transition:background .15s,color .15s,transform .1s}
.nav-btn:hover{background:var(--n2);color:var(--n10)}
.nav-btn:active{transform:scale(.98)}
.nav-btn:focus-visible,.btn:focus-visible,.chip:focus-visible,.act:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--m500);outline-offset:2px}
.nav-btn.on{background:var(--m800);color:var(--n0)}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9999px;background:var(--n1);width:200px;color:var(--n7)}
.search input{border:0;background:none;outline:none;width:100%}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.avatar.sm{width:32px;height:32px;font-size:15px}

/* 레이아웃 */
.layout{display:flex;justify-content:center;gap:32px;padding:32px 32px 64px;width:100%}
.feed{width:100%;max-width:560px;min-width:0;animation:fadeUp .4s ease both}
.right-rail{width:296px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:88px;align-self:flex-start}
.mast{margin-bottom:24px}
.mast .kicker{color:var(--n7);font-weight:500;margin-bottom:8px}
.mast h1{font-size:46px;line-height:1.3;letter-spacing:-1px;color:var(--n10)}
.mast p{color:var(--n7);margin-top:8px;font-size:17px}
.composer{position:sticky;top:56px;z-index:20;background:var(--n0);padding:12px 0;margin-bottom:16px;border-bottom:1px solid var(--n3);display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;align-items:center}
.chip{height:36px;padding:0 16px;border-radius:9999px;border:1px solid var(--n4);color:var(--n8);font-weight:500;background:var(--n0);transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--n8);color:var(--n10)}
.chip:active{transform:scale(.98)}
.chip.on{background:var(--m800);border-color:var(--m800);color:var(--n0)}
.chip.sm{height:32px;padding:0 12px}
.select{height:36px;border-radius:9999px;border:1px solid var(--n4);padding:0 16px;background:var(--n0);outline:none;font-weight:500;color:var(--n8)}
.select:focus-visible,.field:focus-visible{outline:2px solid var(--m500);outline-offset:2px}

/* 포스트 */
.post{background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:20px;margin-bottom:24px;animation:fadeUp .45s ease both}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.post-head .who{flex:1;min-width:0}
.author{font-weight:600;color:var(--n10);display:block;line-height:1.3}
.post-head time{color:var(--n7);font-size:15px}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:9999px;background:var(--n2);color:var(--n8);font-weight:500;font-size:15px}
.media{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:9/12;background:var(--n2);cursor:pointer}
.media svg.scene{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s ease}
.media:hover svg.scene{transform:scale(1.03)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--n10) 78%,transparent) 0%,transparent 55%)}
.ov{position:absolute;left:20px;right:20px;bottom:24px;color:var(--n0);display:flex;flex-direction:column;gap:8px}
.ov .pl{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.ov .meta{display:flex;flex-wrap:wrap;gap:8px}
.pill-ov{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:9999px;background:color-mix(in srgb,var(--n10) 46%,transparent);backdrop-filter:blur(6px);color:var(--n0);font-weight:500}
.ov .rv{font-size:17px;line-height:1.4}
.play{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--n10) 46%,transparent);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(6px)}
.dur{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;color:var(--n0);font-weight:500}
.dur .dot{width:8px;height:8px;border-radius:50%;background:var(--n0);animation:pulse 1.4s infinite}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--n0);opacity:.9;animation:prog 12s linear infinite}
.post-actions{display:flex;align-items:center;gap:4px;margin-top:16px}
.act{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:9999px;color:var(--n8);font-weight:500;transition:background .15s,transform .1s}
.act:hover{background:var(--n2);color:var(--n10)}
.act:active{transform:scale(.98)}
.act i{font-size:20px}
.act.on{color:var(--n10)}
.act.pop i{animation:heartPop .35s ease}
.act.save{margin-left:auto}
.cmts{margin-top:8px;border-top:1px solid var(--n3);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:12px}
.cmt b{color:var(--n10)}
.cmt p{color:var(--n8)}
.cmt-in{display:flex;gap:8px}
.field{flex:1;height:44px;border-radius:16px;border:1px solid var(--n4);padding:0 16px;background:var(--n0);outline:none}
.field:focus{border-color:var(--n9)}
textarea.field{height:96px;padding:12px 16px;resize:none;width:100%;display:block}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:9999px;font-weight:600;transition:background .15s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--m800);color:var(--n0)}
.btn.primary:hover{background:var(--m700)}
.btn.ghost{border:1px solid var(--m800);color:var(--m800)}
.btn.ghost:hover{background:var(--n2)}
.btn.link{padding:0;height:auto;color:var(--m800);font-weight:500;border-radius:0}
.btn.link:hover{text-decoration:underline}
.btn:disabled{background:var(--n3);color:var(--n6);cursor:not-allowed;border-color:var(--n3);transform:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--n5);border-top-color:var(--n0);animation:spin .7s linear infinite}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--n8);transition:background .15s}
.icon-btn:hover{background:var(--n2)}

/* 카드/레일 */
.card{background:var(--n1);border-radius:24px;padding:20px}
.card h3{font-size:17px;font-weight:700;color:var(--n10);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.rank{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left;border-radius:12px;transition:background .15s}
.rank:hover{background:var(--n2)}
.rank .no{width:24px;font-weight:700;color:var(--n10);font-size:17px}
.rank .nm{flex:1;min-width:0;font-weight:500;color:var(--n10);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sub{color:var(--n7);font-size:15px}
.gap-row{display:flex;justify-content:space-between;padding:8px 0;color:var(--n8)}
.gap-row b{color:var(--n10)}

/* 스텝퍼 */
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.stp{display:flex;align-items:center;gap:8px;color:var(--n6);font-weight:500}
.stp .c{width:28px;height:28px;border-radius:50%;border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.stp.on{color:var(--n10)}
.stp.on .c{background:var(--m800);border-color:var(--m800);color:var(--n0)}
.stp.done .c{background:var(--n2);color:var(--n9);border-color:var(--n2)}
.stp-line{flex:1;height:1px;background:var(--n4);min-width:12px}
.panel{background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:24px;animation:fadeUp .35s ease both}
.panel h2{font-size:26px;letter-spacing:-.4px;line-height:1.3;color:var(--n10);margin-bottom:8px}
.panel .hint{color:var(--n7);margin-bottom:24px}
.grp{margin-bottom:24px}
.grp>label,.lbl{display:block;font-weight:600;color:var(--n10);margin-bottom:8px}
.err{color:var(--s2-text);margin-top:8px;display:flex;align-items:center;gap:4px}
.drop{border:1px dashed var(--n5);border-radius:20px;padding:24px;display:flex;align-items:center;gap:16px;background:var(--n1)}
.drop .ic{width:48px;height:48px;border-radius:16px;background:var(--n2);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--n8)}
.photos{display:flex;flex-direction:column;gap:8px}
.ph-row{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--n3);border-radius:16px;background:var(--n0);animation:fadeUp .25s ease both}
.ph-row .th{width:48px;height:48px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0}
.ph-row .th svg{position:absolute;inset:0;width:100%;height:100%}
.ph-row .no{width:24px;height:24px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.ph-row .nm{flex:1;min-width:0}
.ph-row .nm small{display:block;color:var(--n7);font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pr-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.pr-head{display:grid;grid-template-columns:1.4fr 1fr 1fr 44px;gap:8px;color:var(--n7);font-weight:500;margin-bottom:8px}
.stars{display:flex;gap:4px}
.stars button{font-size:28px;color:var(--n4);width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .1s,color .15s}
.stars button:hover{background:var(--n2)}
.stars button:active{transform:scale(.98)}
.stars button.on{color:var(--n10)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sum-line{display:flex;justify-content:space-between;padding:8px 0;color:var(--n8);border-bottom:1px solid var(--n3)}
.sum-line:last-child{border:0}
.sum-line b{color:var(--n10);font-weight:600;text-align:right}
.sum-line.miss b{color:var(--n6);font-weight:400}
.meter{height:8px;background:var(--n3);border-radius:9999px;overflow:hidden;margin:8px 0 16px}
.meter>i{display:block;height:100%;background:var(--m800);border-radius:9999px;transition:width .4s ease}

/* 생성 */
.gen-wrap{display:grid;grid-template-columns:200px 1fr;gap:24px}
.phone{width:200px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;position:relative;background:var(--n2);border:4px solid var(--n10)}
.phone svg.scene{position:absolute;inset:0;width:100%;height:100%}
.phone .shade{background:linear-gradient(to top,color-mix(in srgb,var(--n10) 80%,transparent) 0%,transparent 60%)}
.phone .tplA{position:absolute;left:12px;right:12px;bottom:16px;color:var(--n0);display:flex;flex-direction:column;gap:4px}
.phone .tplA b{font-size:17px;line-height:1.3}
.phone .tplA span{font-size:15px}
.phone .tplB{position:absolute;left:16px;right:16px;top:24px;color:var(--n0);font-size:17px;line-height:1.4;font-weight:600}
.phone .tplB small{display:block;margin-top:8px;font-weight:500;font-size:15px;opacity:.9}
.phone .lock{position:absolute;inset:0;background:var(--n1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--n7)}
.skel{background:linear-gradient(90deg,var(--n2) 0,var(--n3) 50%,var(--n2) 100%);background-size:240px 100%;animation:shimmer 1.2s linear infinite;border-radius:12px}
.stage{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--n6)}
.stage .c{width:28px;height:28px;border-radius:50%;border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--n0)}
.stage.on{color:var(--n10);font-weight:600}
.stage.on .c{border-color:var(--m800)}
.stage.done{color:var(--n8)}
.stage.done .c{background:var(--s1-bg);border-color:var(--s1-bg);color:var(--s1-text)}
.stage.fail .c{background:var(--s2-bg);border-color:var(--s2-bg);color:var(--s2-text)}
.stage.fail{color:var(--s2-text);font-weight:600}
.stage .t{flex:1}
.stage .t small{display:block;font-weight:400;color:var(--n7);font-size:15px}
.info-box{border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.info-box.fail{background:var(--s2-bg);color:var(--s2-text)}
.info-box.ok{background:var(--s1-bg);color:var(--s1-text)}
.info-box.plain{background:var(--n1);color:var(--n8)}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px}
.spec div{display:flex;justify-content:space-between;color:var(--n7)}
.spec b{color:var(--n10);font-weight:600}

/* 장소 */
.place-hero{position:relative;height:200px;border-radius:24px;overflow:hidden;margin-bottom:24px}
.place-hero svg{position:absolute;inset:0;width:100%;height:100%}
.place-hero .ov{bottom:20px}
.map{border-radius:20px;overflow:hidden;position:relative;height:200px;background:var(--n2)}
.map svg{width:100%;height:100%;display:block}
.sec{margin-bottom:32px}
.sec>h3{font-size:20px;letter-spacing:-.3px;color:var(--n10);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:500;color:var(--n7);padding:8px 0;border-bottom:1px solid var(--n3)}
.tbl td{padding:12px 0;border-bottom:1px solid var(--n3);color:var(--n8)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td b{color:var(--n10)}
.gapbar{height:8px;border-radius:9999px;background:var(--n3);position:relative;overflow:hidden;margin-top:8px}
.gapbar i{position:absolute;left:0;top:0;bottom:0;background:var(--n5);border-radius:9999px}
.gapbar i.p{background:var(--m800)}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rel button{position:relative;aspect-ratio:9/13;border-radius:16px;overflow:hidden;transition:transform .15s}
.rel button:hover{transform:scale(1.03)}
.rel button svg{position:absolute;inset:0;width:100%;height:100%}
.rel .cap{position:absolute;left:8px;right:8px;bottom:8px;color:var(--n0);font-weight:600;text-align:left;font-size:15px;line-height:1.3}
.rev{padding:16px 0;border-bottom:1px solid var(--n3);display:flex;gap:12px}
.rev:last-child{border:0}
.rev p{color:var(--n8);margin-top:4px}
.dist{display:flex;align-items:center;gap:12px;color:var(--n7);margin-bottom:4px}
.dist .b{flex:1;height:8px;border-radius:9999px;background:var(--n3);overflow:hidden}
.dist .b i{display:block;height:100%;background:var(--m800);border-radius:9999px}
.back{display:inline-flex;align-items:center;gap:8px;height:44px;color:var(--n8);font-weight:500;margin-bottom:8px}
.back:hover{color:var(--n10)}

/* My Trip */
.trip{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--n3);border-radius:20px;margin-bottom:12px;background:var(--n0);animation:fadeUp .3s ease both}
.trip .th{width:72px;height:72px;border-radius:16px;overflow:hidden;position:relative;flex-shrink:0;cursor:pointer}
.trip .th svg{position:absolute;inset:0;width:100%;height:100%}
.trip .bd{flex:1;min-width:0;cursor:pointer}
.trip .bd b{display:block;color:var(--n10);font-size:17px}
.trip .bd span{color:var(--n7)}
.empty{text-align:center;padding:64px 24px;color:var(--n7)}
.empty i{font-size:40px;color:var(--n5);display:block;margin-bottom:16px}
.empty p{margin-bottom:24px}

const byId=id=>PLACES.find(p=>p.id===id);

/* ── 절차적 장면 (사진 대신 코드로 그린 무채색 스틸) ── */
const TONES={food:['n3','n7'],beach:['n2','n6'],cable:['n4','n8'],lantern:['n7','n10'],stay:['n1','n5'],noodle:['n3','n6']};
function Scene({kind}){
  const id=useId().replace(/:/g,'');
  const [a,b]=TONES[kind]||TONES.food;
  const f=k=>({fill:`var(--${k})`});
  const s=(k,w=2)=>({fill:'none',stroke:`var(--${k})`,strokeWidth:w,strokeLinecap:'round'});
  let art=null;
  if(kind==='food'||kind==='noodle'){
    art=<g>
      <ellipse cx="180" cy="330" rx="118" ry="34" style={f('n9')}/>
      <path d="M62 330 Q180 490 298 330 Z" style={f('n10')}/>
      {[0,1,2].map(i=><path key={i} d={`M${140+i*40} 290 q-12 -20 0 -40 q12 -20 0 -40`} style={{...s('n0',4),animation:`steam 2.4s ${i*.5}s infinite`}}/>)}
      {[0,1,2,3,4].map(i=><path key={'n'+i} d={`M${100+i*16} 330 q40 ${-14+i*4} 120 ${4-i*3}`} style={s('n3',4)}/>)}
      <path d="M250 150 L310 320" style={s('n0',5)}/><path d="M270 146 L330 316" style={s('n0',5)}/>
    </g>;
  }else if(kind==='beach'){
    art=<g>
      <circle cx="240" cy="180" r="58" style={{...f('n0'),opacity:.92}}/>
      <rect x="0" y="300" width="360" height="220" style={f('n6')}/>
      <g style={{animation:'drift 4s linear infinite'}}>
        {[0,1,2,3,4].map(i=><path key={i} d={`M-40 ${330+i*34} q30 -16 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0`} style={s('n0',3)}/>)}
      </g>
      <path d="M60 520 L84 300" style={s('n10',7)}/><path d="M84 300 q-50 -20 -70 20 M84 300 q40 -34 80 -6 M84 300 q-6 -44 -46 -54" style={s('n10',6)}/>
    </g>;
  }else if(kind==='cable'){
    art=<g>
      <polygon points="0,400 110,210 190,330 270,190 360,340 360,520 0,520" style={f('n7')}/>
      <polygon points="0,470 90,320 170,420 250,310 360,430 360,520 0,520" style={f('n9')}/>
      <path d="M0 110 L360 250" style={s('n10',3)}/>
      <g style={{animation:'drift 5s ease-in-out infinite alternate'}}><line x1="190" y1="176" x2="190" y2="204" style={s('n10',3)}/><rect x="166" y="204" width="48" height="34" rx="8" style={f('n0')}/><rect x="176" y="212" width="12" height="12" rx="2" style={f('n3')}/><rect x="192" y="212" width="12" height="12" rx="2" style={f('n3')}/></g>
    </g>;
  }else if(kind==='lantern'){
    art=<g>
      {Array.from({length:11}).map((_,i)=><g key={i}><line x1={20+i*32} y1="0" x2={20+i*32} y2={80+(i%3)*44} style={s('n5',1.5)}/><ellipse cx={20+i*32} cy={96+(i%3)*44} rx="15" ry="20" style={{...f('n0'),opacity:.92}}/><line x1={20+i*32} y1={116+(i%3)*44} x2={20+i*32} y2={130+(i%3)*44} style={s('n0',2)}/></g>)}
      <rect x="0" y="380" width="360" height="140" style={f('n9')}/>
      <g style={{animation:'drift 3s linear infinite'}}>{[0,1,2].map(i=><path key={i} d={`M-40 ${410+i*30} q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0`} style={s('n5',2)}/>)}</g>
      <path d="M120 372 q60 30 120 0 l-14 24 h-92 z" style={f('n0')}/>
    </g>;
  }else{
    art=<g>
      <rect x="70" y="150" width="140" height="300" style={f('n8')}/><rect x="210" y="220" width="90" height="230" style={f('n7')}/>
      {Array.from({length:5}).map((_,r)=>Array.from({length:3}).map((_,c)=><rect key={r+'-'+c} x={86+c*40} y={170+r*52} width="24" height="30" rx="3" style={{...f(r===2&&c===1?'n0':'n4')}}/>))}
      <rect x="0" y="440" width="360" height="80" style={f('n9')}/>
      <g style={{animation:'drift 3.5s linear infinite'}}>{[0,1].map(i=><path key={i} d={`M-40 ${470+i*24} q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0`} style={s('n0',3)}/>)}</g>
    </g>;
  }
  return <svg className="scene" viewBox="0 0 360 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id={'g'+id} x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{stopColor:`var(--${a})`}}/><stop offset="1" style={{stopColor:`var(--${b})`}}/></linearGradient></defs>
    <rect width="360" height="520" fill={`url(#g${id})`}/>{art}
  </svg>;
}
const Avatar=({name,sm})=><span className={'avatar'+(sm?' sm':'')}>{(name||'?').trim().charAt(0)}</span>;
const Stars=({v})=><span style={{display:'inline-flex',gap:2,color:'var(--n10)'}}>{[1,2,3,4,5].map(i=><i key={i} className={(v>=i-0.25?'ph-fill':'ph')+' ph-star'} style={{fontSize:15}}/>)}</span>;

/* ── 피드 포스트 ── */
function Post({p,saved,onOpen,onPlace,onSave,onToast}){
  const pl=byId(p.pid);
  const [playing,setPlaying]=useState(true);
  const [liked,setLiked]=useState(false);
  const [pop,setPop]=useState(false);
  const [open,setOpen]=useState(false);
  const [cm,setCm]=useState(p.cmts);
  const [txt,setTxt]=useState('');
  const like=()=>{setLiked(!liked);setPop(true);setTimeout(()=>setPop(false),400)};
  const send=()=>{if(!txt.trim())return;setCm([...cm,['나',txt.trim()]]);setTxt('')};
  return <article className="post">
    <header className="post-head">
      <Avatar name={p.author}/>
      <div className="who"><span className="author">{p.author}</span><time>{p.ago}</time></div>
      <button className="badge" onClick={()=>onPlace(pl.id)}><i className="ph ph-map-pin"/>{pl.region}</button>
    </header>
    <div className="media" onClick={()=>onOpen(p.id)}>
      <Scene kind={pl.kind}/><div className="shade"/>
      <div className="dur"><span className="dot"/>17초 · 9:16</div>
      <button className="play" aria-label={playing?'일시정지':'재생'} onClick={e=>{e.stopPropagation();setPlaying(!playing)}}><i className={'ph-fill ph-'+(playing?'pause':'play')}/></button>
      <div className="ov">
        <div className="pl">{pl.name}</div>
        <div className="meta">
          <span className="pill-ov num"><i className="ph ph-coins"/>{vnd(p.paid)}</span>
          <span className="pill-ov num"><i className="ph-fill ph-star"/>{p.score.toFixed(1)}</span>
          <span className="pill-ov"><i className="ph ph-calendar-blank"/>{p.date} 방문</span>
        </div>
        <div className="rv">“{p.review}”</div>
      </div>
      <div className="bar" style={{animationPlayState:playing?'running':'paused'}}/>
    </div>
    <footer className="post-actions">
      <button className={'act like'+(liked?' on':'')+(pop?' pop':'')} onClick={like} aria-pressed={liked}><i className={(liked?'ph-fill':'ph')+' ph-heart'}/><span className="num">{p.likes+(liked?1:0)}</span></button>
      <button className="act comment" onClick={()=>setOpen(!open)}><i className="ph ph-chat-circle"/><span className="num">{cm.length}</span></button>
      <button className="act share" onClick={()=>onToast('링크를 복사했어요')}><i className="ph ph-share-network"/>공유</button>
      <button className={'act save'+(saved?' on':'')} onClick={()=>onSave(pl.id)}><i className={(saved?'ph-fill':'ph')+' ph-bookmark-simple'}/>{saved?'저장됨':'My Trip에 저장'}</button>
    </footer>
    {open&&<div className="cmts">
      {cm.map((c,i)=><div className="cmt" key={i}><Avatar name={c[0]} sm/><div><b>{c[0]}</b><p>{c[1]}</p></div></div>)}
      {cm.length===0&&<p style={{color:'var(--n7)'}}>첫 댓글을 남겨 보세요.</p>}
      <div className="cmt-in"><input className="field" placeholder="댓글을 입력해 주세요" value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><button className="btn primary" onClick={send}>등록하기</button></div>
    </div>}
  </article>;
}

/* ── 화면: 피드 ── */
function FeedView({posts,saved,onOpen,onPlace,onSave,onToast}){
  const [tab,setTab]=useState('recommend');
  const [region,setRegion]=useState('전체 지역');
  const [cat,setCat]=useState(null);
  const list=useMemo(()=>{
    let l=posts.filter(p=>{const pl=byId(p.pid);return (region==='전체 지역'||pl.region===region)&&(!cat||pl.cat===cat)});
    return [...l].sort((a,b)=>tab==='latest'?a.mins-b.mins:b.likes-a.likes);
  },[posts,tab,region,cat]);
  return <>
    <div className="mast">
      <div className="kicker">다낭 · 이번 주 여행 기록</div>
      <h1 className="serif">가격까지 보이는<br/>여행 한 장면</h1>
      <p>영상 한 컷과 사진 몇 장이면 15~20초 숏폼이 만들어져요.</p>
    </div>
    <div className="composer">
      <div className="tabs">
        <button className={'chip'+(tab==='recommend'?' on':'')} onClick={()=>setTab('recommend')}>추천</button>
        <button className={'chip'+(tab==='latest'?' on':'')} onClick={()=>setTab('latest')}>최신</button>
        <select className="select" value={region} onChange={e=>setRegion(e.target.value)} aria-label="지역">{REGIONS.map(r=><option key={r}>{r}</option>)}</select>
      </div>
      <div className="tabs" style={{flexWrap:'wrap'}}>
        {CATS.map(c=><button key={c} className={'chip sm'+(cat===c?' on':'')} onClick={()=>setCat(cat===c?null:c)}>{c}</button>)}
      </div>
    </div>
    {list.map((p,i)=><div key={p.id} style={{animationDelay:i*60+'ms'}}><Post p={p} saved={saved.includes(p.pid)} onOpen={onOpen} onPlace={onPlace} onSave={onSave} onToast={onToast}/></div>)}
    {list.length===0&&<div className="empty"><i className="ph ph-film-slate"/><p>조건에 맞는 숏폼이 아직 없어요.</p><button className="btn ghost" onClick={()=>{setRegion('전체 지역');setCat(null)}}>필터 초기화하기</button></div>}
  </>;
}

/* ── 화면: 콘텐츠 상세 ── */
function DetailView({post,saved,onBack,onPlace,onSave,onToast}){
  const pl=byId(post.pid);
  const [playing,setPlaying]=useState(true);
  return <div>
    <button className="back" onClick={onBack}><i className="ph ph-arrow-left"/>피드로 돌아가기</button>
    <div className="media" style={{aspectRatio:'9/13'}} onClick={()=>setPlaying(!playing)}>
      <Scene kind={pl.kind}/><div className="shade"/>
      <div className="dur"><span className="dot"/>17초 · 9:16</div>
      <div className="play"><i className={'ph-fill ph-'+(playing?'pause':'play')}/></div>
      <div className="ov"><div className="pl">{pl.name}</div><div className="rv">“{post.review}”</div></div>
      <div className="bar" style={{animationPlayState:playing?'running':'paused'}}/>
    </div>
    <div className="detail-meta">
      <span className="badge num"><i className="ph ph-coins"/>실결제 {vnd(post.paid)}</span>
      <span className="badge"><i className="ph ph-calendar-blank"/>{post.date} 방문</span>
      <span className="badge"><i className="ph ph-users"/>2명</span>
      <span className="badge"><i className="ph ph-tag"/>{pl.cat}</span>
    </div>
    <div style={{display:'flex',gap:12,marginBottom:32}}>
      <button className="btn primary" onClick={()=>onPlace(pl.id)}><i className="ph ph-map-pin"/>장소 상세 보기</button>
      <button className="btn ghost" onClick={()=>onSave(pl.id)}><i className={(saved?'ph-fill':'ph')+' ph-bookmark-simple'}/>{saved?'저장됨':'My Trip에 저장하기'}</button>
      <button className="btn ghost" onClick={()=>onToast('신고가 접수됐어요')}>신고하기</button>
    </div>
    <div className="sec"><h3>댓글 {post.cmts.length}개</h3>
      {post.cmts.length===0&&<p style={{color:'var(--n7)'}}>아직 댓글이 없어요.</p>}
      {post.cmts.map((c,i)=><div className="rev" key={i}><Avatar name={c[0]} sm/><div><b style={{color:'var(--n10)'}}>{c[0]}</b><p>{c[1]}</p></div></div>)}
    </div>
  </div>;
}

const starOn=(r,i)=>r>=i;

  const [v,setV]=useState({place:'',date:'2025-09-24',people:2,cat:''});

  const [rating,setRating]=useState(0);
  const [text,setText]=useState('');
  const [errs,setErrs]=useState({});
  const addPhoto=()=>{const n=PHOTO_POOL[photos.length%PHOTO_POOL.length];setPhotos([...photos,{id:Date.now()+photos.length,...n}])};
  const move=(i,d)=>{const a=[...photos];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setPhotos(a)};
  const validate=s=>{
    const e={};
    if(s===0){if(!video)e.video='현장 영상 1개를 먼저 선택해 주세요.';if(photos.length<2)e.photos='사진을 2장 이상 올려 주세요.'}
    if(s===1){if(!v.place)e.place='방문한 장소를 선택해 주세요.';if(!v.cat)e.cat='카테고리를 골라 주세요.'}
    if(s===2){if(rows.some(r=>!r.n||!r.m||!r.p))e.rows='메뉴명, 메뉴 가격, 실제 결제금액을 모두 입력해 주세요.'}
    if(s===3){if(!rating)e.rating='별점을 선택해 주세요.';if(text.trim().length<5)e.text='한줄 리뷰를 5자 이상 적어 주세요.'}
    setErrs(e);return Object.keys(e).length===0;
  };
  const next=()=>{if(validate(step)){if(step<3)setStep(step+1);else onSubmit({place:v.place,cat:v.cat,date:v.date,people:v.people,rows,rating,text,photos:photos.length})}};
  const setRow=(i,k,val)=>{const a=[...rows];a[i]={...a[i],[k]:val.replace(k==='n'?/$^/:/[^0-9]/g,'')};setRows(a)};
  const menuSum=rows.reduce((s,r)=>s+(+r.m||0),0),paidSum=rows.reduce((s,r)=>s+(+r.p||0),0);
  const pct=Math.round(((step+(step===3&&rating&&text.length>=5?1:0))/4)*100);
  const pname=v.place?byId(+v.place).name:'';
  return <div>
    <div className="stepper">
      {STEPS.map((s,i)=><React.Fragment key={s}>
        <div className={'stp'+(i===step?' on':'')+(i<step?' done':'')}><span className="c">{i<step?<i className="ph ph-check"/>:i+1}</span>{s}</div>
        {i<3&&<span className="stp-line"/>}
      </React.Fragment>)}
    </div>
    <div className="panel" key={step}>
      {step===0&&<>
        <h2 className="serif">오늘의 한 장면을 올려 주세요</h2>
        <p className="hint">현장 영상 1개와 사진 여러 장이면 충분해요. 편집은 자동으로 해 드려요.</p>
        <div className="grp"><label>현장 영상 (1개)</label>
          {!video?<div className="drop"><span className="ic"><i className="ph ph-video-camera"/></span><div style={{flex:1}}><b style={{color:'var(--n10)'}}>영상 파일을 선택해 주세요</b><div style={{color:'var(--n7)'}}>세로 영상 권장 · 최대 60초</div></div><button className="btn primary" onClick={()=>{setVideo(true);setErrs({})}}>영상 선택하기</button></div>
          :<div className="ph-row"><span className="th"><Scene kind="food"/></span><div className="nm"><b style={{color:'var(--n10)'}}>IMG_2041.mov</b><small>0:09 · 1080×1920 · 38MB</small></div><button className="icon-btn" aria-label="영상 삭제" onClick={()=>setVideo(false)}><i className="ph ph-trash"/></button></div>}
          {errs.video&&<div className="err"><i className="ph ph-warning-circle"/>{errs.video}</div>}
        </div>
        <div className="grp"><label>사진 (순서대로 노출돼요)</label>
          <div className="photos">
            {photos.map((p,i)=><div className="ph-row" key={p.id}><span className="no num">{i+1}</span><span className="th"><Scene kind={p.kind}/></span><div className="nm"><b style={{color:'var(--n10)'}}>{p.label}</b><small>사진 {i+1}번 · 숏폼 {(9+i*2.2).toFixed(1)}초 지점</small></div>
              <button className="icon-btn" aria-label="위로" onClick={()=>move(i,-1)} disabled={i===0}><i className="ph ph-arrow-up"/></button>
              <button className="icon-btn" aria-label="아래로" onClick={()=>move(i,1)} disabled={i===photos.length-1}><i className="ph ph-arrow-down"/></button>
              <button className="icon-btn" aria-label="삭제" onClick={()=>setPhotos(photos.filter(x=>x.id!==p.id))}><i className="ph ph-x"/></button></div>)}
            <button className="btn ghost" style={{alignSelf:'flex-start'}} onClick={addPhoto}><i className="ph ph-plus"/>사진 추가하기</button>
          </div>
          {errs.photos&&<div className="err"><i className="ph ph-warning-circle"/>{errs.photos}</div>}
        </div>
      </>}
      {step===1&&<>
        <h2 className="serif">어디를 다녀오셨나요?</h2>
        <p className="hint">방문한 장소와 날짜, 함께한 인원을 알려 주세요.</p>
        <div className="grp"><label>장소</label>
          <select className="field" style={{width:'100%'}} value={v.place} onChange={e=>{const pl=byId(+e.target.value);setV({...v,place:e.target.value,cat:pl?pl.cat:v.cat})}}><option value="">장소를 선택해 주세요</option>{PLACES.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
          {errs.place&&<div className="err"><i className="ph ph-warning-circle"/>{errs.place}</div>}
        </div>
        <div className="two grp">
          <div><label className="lbl">방문일</label><input type="date" className="field" style={{width:'100%'}} value={v.date} onChange={e=>setV({...v,date:e.target.value})}/></div>
          <div><label className="lbl">방문 인원</label><div style={{display:'flex',alignItems:'center',gap:8}}><button className="icon-btn" aria-label="인원 줄이기" onClick={()=>setV({...v,people:Math.max(1,v.people-1)})}><i className="ph ph-minus"/></button><b className="num" style={{width:40,textAlign:'center',color:'var(--n10)',fontSize:20}}>{v.people}명</b><button className="icon-btn" aria-label="인원 늘리기" onClick={()=>setV({...v,people:Math.min(12,v.people+1)})}><i className="ph ph-plus"/></button></div></div>
        </div>
        <div className="grp"><label>카테고리</label><div className="seg">{CATS.map(c=><button key={c} className={'chip'+(v.cat===c?' on':'')} onClick={()=>setV({...v,cat:c})}>{c}</button>)}</div>{errs.cat&&<div className="err"><i className="ph ph-warning-circle"/>{errs.cat}</div>}</div>
      </>}
      {step===2&&<>
        <h2 className="serif">메뉴 가격과 실제 낸 돈을 나눠 적어요</h2>
        <p className="hint">표기 가격과 실제 결제금액이 다르면 다음 여행자에게 가장 도움이 돼요.</p>
        <div className="pr-head"><span>메뉴·서비스</span><span>메뉴 가격(₫)</span><span>실결제(₫)</span><span/></div>
        {rows.map((r,i)=><div className="pr-row" key={i}>
          <input className="field" style={{minWidth:0}} value={r.n} placeholder="예: 분짜 세트" onChange={e=>{const a=[...rows];a[i]={...a[i],n:e.target.value};setRows(a)}}/>
          <input className="field num" style={{minWidth:0}} inputMode="numeric" value={r.m} onChange={e=>setRow(i,'m',e.target.value)}/>
          <input className="field num" style={{minWidth:0}} inputMode="numeric" value={r.p} onChange={e=>setRow(i,'p',e.target.value)}/>
          <button className="icon-btn" aria-label="행 삭제" onClick={()=>setRows(rows.filter((_,j)=>j!==i))} disabled={rows.length===1}><i className="ph ph-trash"/></button>
        </div>)}
        <button className="btn ghost" onClick={()=>setRows([...rows,{n:'',m:'',p:''}])}><i className="ph ph-plus"/>항목 추가하기</button>
        {errs.rows&&<div className="err"><i className="ph ph-warning-circle"/>{errs.rows}</div>}
        <div className="info-box plain" style={{marginTop:24,marginBottom:0}}><i className="ph ph-info" style={{fontSize:20}}/><div>메뉴 가격 합계 <b className="num">{vnd(menuSum)}</b> · 실결제 합계 <b className="num">{vnd(paidSum)}</b>{menuSum>paidSum&&<> · <b className="num">{vnd(menuSum-paidSum)}</b> 덜 냈어요</>}</div></div>
      </>}
      {step===3&&<>
        <h2 className="serif">한 줄로 남겨 주세요</h2>
        <p className="hint">평점과 한줄 리뷰는 숏폼 위에 그대로 표시돼요.</p>
        <div className="grp"><label>평점</label><div className="stars">{[1,2,3,4,5].map(i=><button key={i} className={starOn(rating,i)?'on':''} aria-label={i+'점'} onClick={()=>setRating(i)}><i className={(starOn(rating,i)?'ph-fill':'ph')+' ph-star'}/></button>)}</div>{errs.rating&&<div className="err"><i className="ph ph-warning-circle"/>{errs.rating}</div>}</div>
        <div className="grp"><label>한줄 리뷰</label><textarea className="field" maxLength={60} placeholder="예: 국물이 맑고 면이 쫄깃해요. 아침에 가면 한산해요." value={text} onChange={e=>setText(e.target.value)}/><div style={{textAlign:'right',color:'var(--n7)'}} className="num">{text.length}/60</div>{errs.text&&<div className="err"><i className="ph ph-warning-circle"/>{errs.text}</div>}</div>
      </>}
      <div className="foot">
        <button className="btn link" onClick={()=>step>0&&setStep(step-1)} disabled={step===0} style={step===0?{visibility:'hidden'}:null}><i className="ph ph-arrow-left"/>이전 단계</button>
        <button className="btn primary" onClick={next}>{step<3?'다음 단계로':'숏폼 만들기'}<i className={'ph ph-'+(step<3?'arrow-right':'sparkle')}/></button>
      </div>
    </div>
    <div className="card" style={{marginTop:24}}>
      <h3><i className="ph ph-list-checks"/>입력 요약</h3>
      <div className="meter"><i style={{width:pct+'%'}}/></div>
      <div className={'sum-line'+(video?'':' miss')}><span>영상</span><b>{video?'IMG_2041.mov':'미선택'}</b></div>
      <div className={'sum-line'+(photos.length?'':' miss')}><span>사진</span><b>{photos.length?photos.length+'장':'미선택'}</b></div>
      <div className={'sum-line'+(pname?'':' miss')}><span>장소</span><b>{pname||'미선택'}</b></div>
      <div className="sum-line"><span>실결제 합계</span><b className="num">{vnd(paidSum)}</b></div>
      <div className={'sum-line'+(rating?'':' miss')}><span>평점</span><b>{rating?rating.toFixed(1)+'점':'미입력'}</b></div>
    </div>
  </div>;
}

/* ── 화면: 자동 숏폼 생성 ── */
const DEMO_JOB={place:6,cat:'맛집',date:'2025-09-24',people:2,rating:5,text:'국물이 맑고 면이 쫄깃해요. 아침 식사로 딱이에요.',photos:4,rows:[{n:'미꽝 국수',m:'50000',p:'50000'},{n:'튀김 만두',m:'20000',p:'20000'}]};
const STAGES=[['대기열 등록','작업 ID를 발급하고 큐에 넣는 중'],['템플릿 합성','영상·사진 배치와 정보 오버레이 적용'],['9:16 인코딩','15~20초로 길이를 맞추고 파일 생성'],['피드 게시 준비','썸네일과 재생 주소 확정']];
function GenerateView({job,onPublish,onToast}){
  const j=job||DEMO_JOB;
  const pl=byId(+j.place)||byId(6);
  const [tpl,setTpl]=useState('A');
  const [pg,setPg]=useState(0);
  const [failed,setFailed]=useState(false);
  const [run,setRun]=useState(0);
  useEffect(()=>{
    if(failed)return;setPg(0);
    const t=setInterval(()=>setPg(p=>{if(p>=100){clearInterval(t);return 100}return Math.min(100,p+3)}),110);
    return ()=>clearInterval(t);
  },[run,failed,tpl]);
  const stage=pg>=100?4:pg<12?0:pg<50?1:pg<90?2:3;
  const dur=Math.min(20,Math.max(15,9+j.photos*2.2));
  const paid=j.rows.reduce((s,r)=>s+(+r.p||0),0);
  const done=stage===4&&!failed;
  const [pub,setPub]=useState(false);
  const publish=()=>{setPub(true);setTimeout(()=>onPublish(j,dur),900)};
  return <div>
    <div className="panel">
      <h2 className="serif">숏폼을 자동으로 만들고 있어요</h2>
      <p className="hint">고정 템플릿에 영상·사진을 합성해 {dur.toFixed(1)}초 세로 영상으로 만들어요.</p>
      <div className="gen-wrap">
        <div className="phone">
          <Scene kind={pl.kind}/>
          {!done&&!failed&&<div className="lock"><div className="skel" style={{width:'70%',height:12}}/><div className="skel" style={{width:'50%',height:12}}/><span className="num" style={{fontSize:26,color:'var(--n10)',fontWeight:700}}>{pg}%</span></div>}
          {failed&&<div className="lock"><i className="ph ph-warning-circle" style={{fontSize:32,color:'var(--s2-text)'}}/><span>합성에 실패했어요</span></div>}
          {(done||(pg>=50&&!failed))&&<><div className="shade"/>
            {tpl==='A'?<div className="tplA"><b>{pl.name}</b><span className="num">{vnd(paid)} · 평점 {j.rating.toFixed(1)}</span><span>“{j.text.slice(0,26)}”</span></div>
            :<div className="tplB">“{j.text.slice(0,34)}”<small className="num">{pl.name} · {vnd(paid)}</small></div>}</>}
        </div>
        <div>
          {failed&&<div className="info-box fail"><i className="ph ph-warning-circle" style={{fontSize:20}}/><div><b>실패 사유: 영상 인코딩 시간 초과</b><div>사진 순서는 그대로 보관돼 있어요. 다시 시도하면 처음부터 합성해요.</div></div></div>}
          {done&&<div className="info-box ok"><i className="ph ph-check-circle" style={{fontSize:20}}/><div><b>숏폼이 완성됐어요</b><div>9:16 · {dur.toFixed(1)}초 · 4.2MB</div></div></div>}
          {STAGES.map((s,i)=>{const st=failed&&i===2?'fail':i<stage?'done':i===stage?'on':'';
            return <div key={s[0]} className={'stage '+st}><span className="c">{st==='done'?<i className="ph ph-check"/>:st==='fail'?<i className="ph ph-x"/>:i===stage?<span className="spinner" style={{borderColor:'var(--n4)',borderTopColor:'var(--m800)'}}/>:i+1}</span><span className="t">{s[0]}<small>{s[1]}</small></span></div>})}
          <div className="meter" style={{marginTop:16}}><i style={{width:(failed?58:pg)+'%'}}/></div>
        </div>
      </div>
    </div>
    <div className="card" style={{marginTop:24}}>
      <h3><i className="ph ph-layout"/>템플릿과 규격</h3>
      <div className="seg" style={{marginBottom:16}}>
        <button className={'chip'+(tpl==='A'?' on':'')} onClick={()=>setTpl('A')}>정보 강조형</button>
        <button className={'chip'+(tpl==='B'?' on':'')} onClick={()=>setTpl('B')}>리뷰 강조형</button>
      </div>
      <div className="spec num">
        <div>화면 비율<b>9:16 세로</b></div><div>길이<b>{dur.toFixed(1)}초 (15~20초)</b></div>
        <div>사진<b>{j.photos}장</b></div><div>전환 효과<b>페이드</b></div>
      </div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        <button className="btn primary" disabled={!done||pub} onClick={publish}>{pub?<><span className="spinner"/>게시하는 중</>:<>피드에 게시하기</>}</button>
        {failed?<button className="btn ghost" onClick={()=>{setFailed(false);setRun(run+1)}}><i className="ph ph-arrow-clockwise"/>다시 시도하기</button>
        :<button className="btn ghost" onClick={()=>{setFailed(true);onToast('실패 상황을 미리 보여드려요')}}>실패 상황 보기</button>}
        {done&&<button className="btn ghost" onClick={()=>setRun(run+1)}><i className="ph ph-arrows-clockwise"/>다시 만들기</button>}
      </div>
    </div>
  </div>;
}

/* ── 화면: 장소 상세 ── */

        {[[40,20,90,50],[150,30,70,40],[240,10,110,60],[380,26,90,44],[30,88,100,36],[300,150,120,40],[440,140,60,50]].map((b,i)=><rect key={i} x={b[0]} y={b[1]} width={b[2]} height={b[3]} rx="8" style={{fill:'var(--n1)'}}/>)}
        {['M0 74 L520 84','M180 0 L200 200','M360 0 L340 200'].map((d,i)=><path key={i} d={d} style={{fill:'none',stroke:'var(--n0)',strokeWidth:6}}/>)}
        {[[110,60],[330,40],[420,120]].map((c,i)=><circle key={i} cx={c[0]} cy={c[1]} r="6" style={{fill:'var(--n6)'}}/>)}
        <g transform="translate(250 72)"><circle r="20" style={{fill:'var(--m800)',opacity:.15,animation:'pulse 2s infinite'}}/><path d="M0 -14 a10 10 0 1 1 0.01 0 L0 10 Z" transform="translate(0 4)" style={{fill:'var(--m800)'}}/><circle cy="-6" r="4" style={{fill:'var(--n0)'}}/></g>
      </svg></div>
      <div style={{color:'var(--n8)',marginTop:12,display:'flex',gap:8,alignItems:'center'}}><i className="ph ph-map-pin"/>{pl.addr}</div>
    </div>
    <div className="sec"><h3>메뉴 가격 · 실결제가</h3>
      <table className="tbl num"><thead><tr><th>메뉴·서비스</th><th className="r">메뉴 가격</th><th className="r">실결제 평균</th></tr></thead>

        <div className="gapbar"><i style={{width:'100%'}}/></div>
        <div className="gap-row" style={{marginTop:8}}><span>실결제 평균</span><b className="num">{vnd(avgP)} <span style={{color:'var(--n7)',fontWeight:400}}>({won(avgP)}원)</span></b></div>

      </div>
    </div>
    <div className="sec"><h3>이용 정보</h3><div style={{display:'flex',flexDirection:'column',gap:8}}>{pl.info.map(t=><div key={t} style={{display:'flex',gap:8,color:'var(--n8)'}}><i className="ph ph-check" style={{marginTop:4,color:'var(--n9)'}}/>{t}</div>)}</div></div>
    <div className="sec"><h3>관련 숏폼<span style={{fontSize:15,color:'var(--n7)',fontWeight:400}} className="num">{rel.length}개</span></h3>
      {rel.length?<div className="rel">{rel.map(p=><button key={p.id} onClick={()=>onOpenPost(p.id)}><Scene kind={pl.kind}/><div className="shade"/><span className="cap">{p.author}<br/>{vnd(p.paid)}</span></button>)}</div>:<p style={{color:'var(--n7)'}}>아직 이 장소의 숏폼이 없어요.</p>}
    </div>
    <div className="sec"><h3>평점 · 리뷰</h3>
      <div style={{marginBottom:24}}>{dist.map(d=><div className="dist" key={d[0]}><span className="num" style={{width:16}}>{d[0]}</span><span className="b"><i style={{width:d[1]+'%'}}/></span><span className="num" style={{width:40,textAlign:'right'}}>{d[1]}%</span></div>)}</div>
      <div className="cmt-in" style={{marginBottom:8}}><input className="field" placeholder="방문 후기를 한 줄로 남겨 주세요" value={rv} onChange={e=>setRv(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/><button className="btn primary" onClick={add}>등록하기</button></div>
      {revs.map((r,i)=><div className="rev" key={i}><Avatar name={r[0]} sm/><div style={{flex:1}}><div style={{display:'flex',justifyContent:'space-between'}}><b style={{color:'var(--n10)'}}>{r[0]}</b><span style={{color:'var(--n7)'}}>{r[3]}</span></div><Stars v={r[1]}/><p>{r[2]}</p></div></div>)}
    </div>
  </div>;
}

/* ── 화면: My Trip ── */
function TripView({saved,onPlace,onSave,onGoFeed}){
  const list=saved.map(byId).filter(Boolean);
  return <div>
    <div className="mast" style={{marginBottom:24}}><div className="kicker">관심 장소</div><h1 className="serif" style={{fontSize:46}}>내 여행 리스트</h1><p className="num">저장한 장소 {list.length}곳</p></div>
    {list.length===0?<div className="empty"><i className="ph ph-bookmark-simple"/><p>아직 저장한 장소가 없어요.<br/>마음에 드는 숏폼에서 저장해 보세요.</p><button className="btn primary" onClick={onGoFeed}>숏폼 둘러보기</button></div>
    :list.map(p=><div className="trip" key={p.id}>
      <div className="th" onClick={()=>onPlace(p.id)}><Scene kind={p.kind}/></div>
      <div className="bd" onClick={()=>onPlace(p.id)}><b>{p.name}</b><span>{p.region} · {p.cat} · 평점 {p.rating}</span></div>
      <button className="icon-btn" aria-label="저장 해제" onClick={()=>onSave(p.id)}><i className="ph-fill ph-bookmark-simple"/></button>
    </div>)}
  </div>;
}

/* ── 앱 ── */
const NAV=[['feed','세로형 숏폼 피드','film-strip'],['upload','업로드·방문정보 입력','upload-simple'],['generate','자동 숏폼 생성','magic-wand'],['place','장소 상세·지도','map-pin'],['mytrip','My Trip','bookmark-simple']];
function App(){
  const [view,setView]=useState('feed');
  const [posts,setPosts]=useState(POSTS0);
  const [saved,setSaved]=useState([3,4]);
  const [pid,setPid]=useState(1);
  const [postId,setPostId]=useState(101);
  const [job,setJob]=useState(null);
  const [toast,setToast]=useState('');
  const tRef=useRef();
  const say=m=>{setToast(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToast(''),2200)};
  const go=v=>{setView(v);window.scrollTo({top:0})};
  const save=id=>{setSaved(s=>{const has=s.includes(id);say(has?'My Trip에서 뺐어요':'My Trip에 저장했어요');return has?s.filter(x=>x!==id):[...s,id]})};
  const openPlace=id=>{setPid(id);go('place')};
  const openPost=id=>{setPostId(id);go('detail')};
  const submitUpload=d=>{setJob(d);go('generate')};
  const publish=(j,dur)=>{
    const pl=byId(+j.place)||byId(6);
    setPosts(p=>[{id:Date.now(),pid:pl.id,author:'나',ago:'방금 전',mins:0,likes:0,cmts:[],review:j.text,paid:j.rows.reduce((s,r)=>s+(+r.p||0),0),date:'9월 24일',score:j.rating},...p]);
    setJob(null);go('feed');say('숏폼이 피드에 게시됐어요');
  };
  const activeNav=view==='detail'?'feed':view;
  const post=posts.find(p=>p.id===postId)||posts[0];
  const top=[...PLACES].sort((a,b)=>b.cnt-a.cnt).slice(0,4);
  const p6=byId(6);
  return <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <header className="topbar">
      <div className="brand"><span className="brand-mark"><i className="ph-fill ph-compass"/></span><span>다낭로그</span></div>
      <nav className="nav">{NAV.map(n=><button key={n[0]} className={'nav-btn'+(activeNav===n[0]?' on':'')} onClick={()=>go(n[0])}><i className={'ph ph-'+n[2]}/>{n[1]}</button>)}</nav>
      <label className="search"><i className="ph ph-magnifying-glass"/><input placeholder="장소·지역·카테고리" aria-label="검색" onKeyDown={e=>{if(e.key==='Enter'){go('feed');say('검색 결과를 보여드려요')}}}/></label>
      <Avatar name="나"/>
    </header>
    <main className="layout" style={{flex:1}}>
      <section className="feed" key={view}>
        {view==='feed'&&<FeedView posts={posts} saved={saved} onOpen={openPost} onPlace={openPlace} onSave={save} onToast={say}/>}
        {view==='detail'&&<DetailView post={post} saved={saved.includes(post.pid)} onBack={()=>go('feed')} onPlace={openPlace} onSave={save} onToast={say}/>}
        {view==='upload'&&<UploadView onSubmit={submitUpload}/>}
        {view==='generate'&&<GenerateView job={job} onPublish={publish} onToast={say}/>}
        {view==='place'&&<PlaceView pid={pid} saved={saved.includes(pid)} onSave={save} onOpenPost={openPost} onToast={say} posts={posts}/>}
        {view==='mytrip'&&<TripView saved={saved} onPlace={openPlace} onSave={save} onGoFeed={()=>go('feed')}/>}
      </section>
      <aside className="right-rail">
        <div className="card"><h3><i className="ph ph-trend-up"/>이번 주 인기 장소</h3>
          {top.map((p,i)=><button key={p.id} className="rank" onClick={()=>openPlace(p.id)}><span className="no num">{i+1}</span><span className="nm">{p.name}</span><span className="sub num">{p.cnt}</span></button>)}
        </div>
        <div className="card"><h3><i className="ph ph-coins"/>{p6.name}</h3>
          <div className="gap-row"><span>메뉴 가격 평균</span><b className="num">{vnd(26667)}</b></div>
          <div className="gap-row"><span>실결제 평균</span><b className="num">{vnd(26667)}</b></div>
          <button className="btn link" onClick={()=>openPlace(6)}>가격 자세히 보기<i className="ph ph-arrow-right"/></button>
        </div>
        <div className="card"><h3><i className="ph ph-magic-wand"/>내 숏폼 작업</h3>
          <p style={{color:'var(--n7)',marginBottom:16}}>{job?'업로드한 소재로 숏폼을 만드는 중이에요.':'진행 중인 작업이 없어요.'}</p>
          <button className="btn ghost" onClick={()=>go(job?'generate':'upload')}>{job?'진행 상황 보기':'새 숏폼 만들기'}</button>
        </div>
      </aside>
    </main>
    {toast&&<div className="toast" role="status"><i className="ph ph-check-circle"/>{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
