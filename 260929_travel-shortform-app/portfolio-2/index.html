<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다낭로그 운영 콘솔 — 콘텐츠·장소 백오피스 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#edf5ff;
  --m100:#dbeaff;
  --m200:#b8d6ff;
  --m300:#8cbcff;
  --m400:#5ca0ff;
  --m500:#2e86ff;
  --m600:#006bff;
  --m700:#0058d1;
  --m800:#0044a3;
  --m900:#003073;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f8f9fb;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#71757a;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--n10)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:100%;height:100%}
.num{font-variant-numeric:tabular-nums}
:root{--sh:0 4px 5px color-mix(in srgb,var(--m800) 4%,transparent),0 8px 15px color-mix(in srgb,var(--m800) 3%,transparent),0 30px 50px color-mix(in srgb,var(--m800) 8%,transparent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes stripe{from{background-position:0 0}to{background-position:24px 0}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.app{display:flex;width:100%;height:100vh}
/* 1) 워크스페이스 strip */
.workspace-strip{width:64px;flex-shrink:0;background:var(--n10);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.ws-item{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n5);font-weight:700;font-size:14px;transition:background .15s,color .15s;position:relative}
.ws-item:hover{background:var(--n9);color:var(--n0)}
.ws-item:active{transform:scale(.98)}
.ws-item.active{background:var(--m600);color:var(--n0)}
.ws-item.active::before{content:'';position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--n0)}
.ws-divider{width:24px;height:1px;background:var(--n8);margin:4px 0}
.ws-item:focus-visible,.channel-item:focus-visible,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--m500);outline-offset:2px}
/* 2) 채널 리스트 */
.channel-list{width:260px;flex-shrink:0;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;overflow-y:auto}
.channel-header{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);position:sticky;top:0;background:var(--n1);z-index:2}
.ws-name{font-size:18px;font-weight:700;color:var(--n10);letter-spacing:-.2px}
.new-conv{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n8);transition:background .15s}
.new-conv:hover{background:var(--n3)}
.channel-search{padding:12px 16px 4px}
.channel-search label{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--n0);border:1px solid var(--n3);color:var(--n6)}
.channel-search input{border:0;outline:none;background:none;width:100%}
.channel-section{padding:12px 8px 4px}
.section-toggle{display:flex;align-items:center;gap:4px;width:100%;padding:4px 8px;color:var(--n7);font-weight:600;font-size:12px;letter-spacing:.3px;text-transform:uppercase}
.section-toggle:hover{color:var(--n10)}
.channel-row{position:relative}
.channel-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;color:var(--n8);transition:background .15s,color .15s}
.channel-item:hover{background:var(--n2);color:var(--n10)}
.channel-item:active{transform:scale(.99)}
.channel-item.active{background:var(--m50);color:var(--m700);font-weight:700}
.channel-item.sub{color:var(--n7)}
.channel-unread{position:absolute;right:8px;top:6px;min-width:20px;height:20px;padding:0 6px;border-radius:9999px;background:var(--m600);color:var(--n0);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dm-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;color:var(--n8);transition:background .15s}
.dm-item:hover{background:var(--n2)}
.dm-item.active{background:var(--m50);color:var(--m700);font-weight:700}
.presence{position:relative;width:20px;height:20px;border-radius:6px;background:var(--n3);color:var(--n8);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.presence i{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;border:2px solid var(--n1);background:var(--n5)}
.presence i.on{background:var(--s1)}
/* 3) 메인 */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0);width:calc(100% - 644px)}
.conv-header{height:56px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);background:var(--n1)}
.conv-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.conv-title{font-size:18px;font-weight:700;color:var(--n10);letter-spacing:-.2px}
.member-count{color:var(--n7);font-size:12px;padding:2px 8px;border-radius:9999px;background:var(--n2)}
.conv-actions{display:flex;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--n7);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--n2);color:var(--n10)}
.icon-btn:active{transform:scale(.98)}
.icon-btn.on{background:var(--m50);color:var(--m700)}
.icon-btn:disabled{color:var(--n5);cursor:not-allowed;background:none}
.conv-body{flex:1;overflow-y:auto;padding:24px;animation:fadeIn .3s ease both}
.hl{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px}
.hl .k{color:var(--n7);font-size:12px;font-weight:600}
.hl .v{font-size:40px;line-height:1.1;font-weight:700;color:var(--n10);letter-spacing:-1px}
.hl .v small{font-size:18px;font-weight:500;color:var(--n7);letter-spacing:0;margin-left:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chip{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--n4);background:var(--n0);color:var(--n8);font-weight:500;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--n7);color:var(--n10)}
.chip:active{transform:scale(.98)}
.chip.on{background:var(--m50);border-color:var(--m600);color:var(--m700);font-weight:700}
.chip .n{font-size:12px;color:var(--n7)}
.chip.on .n{color:var(--m700)}
.field{height:32px;border-radius:8px;border:1px solid var(--n4);padding:0 12px;background:var(--n0);outline:none;transition:border-color .15s}
.field:focus{border-color:var(--m600);box-shadow:0 0 0 3px var(--m100)}
textarea.field{height:auto;padding:8px 12px;resize:none;display:block;width:100%}
select.field{padding-right:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;font-weight:600;transition:background .15s,transform .1s;white-space:nowrap;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--m600);color:var(--n0)}
.btn.primary:hover{background:var(--m700)}
.btn.ghost{border-color:var(--n4);color:var(--n9);background:var(--n0)}
.btn.ghost:hover{background:var(--n1);border-color:var(--n6)}
.btn.danger{background:var(--n0);border-color:var(--s2);color:var(--s2-text)}
.btn.danger:hover{background:var(--s2-bg)}
.btn:disabled{background:var(--n3);color:var(--n6);border-color:var(--n3);cursor:not-allowed;transform:none}
.btn.lg{height:40px;padding:0 16px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--n5);border-top-color:var(--n0);animation:spin .7s linear infinite}
.list{border:1px solid var(--n3);border-radius:8px;overflow:hidden;background:var(--n0)}
.row{display:grid;align-items:center;gap:12px;width:100%;padding:12px 16px;border-bottom:1px solid var(--n3);transition:background .12s;cursor:pointer;animation:fadeIn .3s ease both;background:var(--n0)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--n1)}
.row.sel{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.row-head{display:grid;gap:12px;padding:8px 16px;background:var(--n1);color:var(--n7);font-size:12px;font-weight:600;border-bottom:1px solid var(--n3)}
.r-rep{grid-template-columns:32px 1fr 96px 88px 72px}
.r-job{grid-template-columns:88px 1fr 64px 1.1fr 72px}
.r-place{grid-template-columns:32px 1fr 88px 64px 72px}
.r-mem{grid-template-columns:32px 1.2fr 72px 64px 64px 72px}
.r-push{grid-template-columns:1fr 132px 72px 88px}
.av{width:32px;height:32px;border-radius:8px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.tt{font-weight:600;color:var(--n10);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub{color:var(--n7);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.m{background:var(--m50);color:var(--m700)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text)}
.pill.run i{animation:pulse 1.2s infinite}
.prog{height:6px;border-radius:9999px;background:var(--n3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9999px;background:var(--m600);transition:width .8s linear;background-image:linear-gradient(45deg,color-mix(in srgb,var(--n0) 30%,transparent) 25%,transparent 25%,transparent 50%,color-mix(in srgb,var(--n0) 30%,transparent) 50%,color-mix(in srgb,var(--n0) 30%,transparent) 75%,transparent 75%);background-size:24px 24px;animation:stripe 1s linear infinite}
.prog i.still{animation:none;background-image:none}
.prog i.bad{background:var(--s2)}
.prog i.done{background:var(--n6);animation:none;background-image:none}
.hist{display:flex;align-items:flex-end;gap:4px;height:48px;margin-bottom:24px}
.hist i{flex:1;background:var(--n4);border-radius:2px 2px 0 0;transform-origin:bottom;animation:barGrow .6s ease both}
.hist i.cur{background:var(--m600)}
.conv-input{flex-shrink:0;position:sticky;bottom:0;padding:12px 24px;border-top:1px solid var(--n3);background:var(--n1);display:flex;gap:8px;align-items:center}
.conv-input .msg-input{flex:1;height:36px}
/* 4) 정보 패널 */
.info-panel{width:320px;flex-shrink:0;border-left:1px solid var(--n3);background:var(--n1);display:flex;flex-direction:column;overflow-y:auto;animation:slideIn .25s ease both}
.info-header{height:56px;flex-shrink:0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);position:sticky;top:0;background:var(--n1);z-index:2}
.info-header h3{font-size:18px;color:var(--n10);letter-spacing:-.2px}
.info-section{padding:16px;border-bottom:1px solid var(--n3)}
.info-label{font-size:12px;font-weight:600;color:var(--n7);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.info-value{color:var(--n9)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--n7)}
.kv b{color:var(--n10);font-weight:600;text-align:right}
.tile{border-radius:8px;background:var(--n2);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tile .big{width:40px;height:56px;border-radius:6px;background:var(--n9);color:var(--n0);display:flex;align-items:center;justify-content:center}
.tl{position:relative;padding-left:16px;margin-top:4px}
.tl::before{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--n4)}
.tl-i{position:relative;padding:0 0 12px}
.tl-i::before{content:'';position:absolute;left:-16px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--n5);border:1px solid var(--n1)}
.tl-i.new::before{background:var(--m600)}
.tl-i b{color:var(--n10);font-weight:600}
.tl-i span{display:block;color:var(--n7);font-size:12px}
.act-col{display:flex;flex-direction:column;gap:8px}
.empty{padding:48px 24px;text-align:center;color:var(--n7)}
.empty .ic{width:32px;height:32px;color:var(--n5);margin-bottom:12px}
.empty p{margin-bottom:16px}
.sw{width:36px;height:20px;border-radius:9999px;background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--n0);transition:transform .2s}
.sw.on{background:var(--m600)}
.sw.on::after{transform:translateX(16px)}
.card{border:1px solid var(--n3);border-radius:8px;padding:16px;background:var(--n0);margin-bottom:16px}
.card h4{font-size:14px;color:var(--n10);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--n3);margin-bottom:16px}
.tab-row button{padding:8px 12px;color:var(--n7);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-row button:hover{color:var(--n10)}
.tab-row button.on{color:var(--m700);border-color:var(--m600)}
.form-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.form-row>label{color:var(--n7);font-weight:500}
.mrow{display:grid;grid-template-columns:1fr 92px 92px 32px;gap:8px;margin-bottom:8px;align-items:center}
.pv{border:1px solid var(--n3);border-radius:8px;background:var(--n0);padding:12px;display:flex;gap:12px;box-shadow:var(--sh);animation:pop .3s ease both}
.pv .app-ic{width:32px;height:32px;border-radius:8px;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center}
.map-mini{height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--n3);margin-bottom:12px;position:relative}
.map-mini svg{width:100%;height:100%;display:block}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .15s ease both}
.modal{width:440px;max-width:calc(100% - 32px);background:var(--n0);border-radius:8px;box-shadow:var(--sh);padding:24px;animation:pop .2s ease both}
.modal h3{font-size:24px;line-height:1.3;color:var(--n10);margin-bottom:8px}
.modal p{color:var(--n7);margin-bottom:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:8px 16px;border-radius:8px;font-weight:500;z-index:60;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);animation:pop .2s ease both}
.err{color:var(--s2-text);font-size:12px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--n4);border-radius:8px;overflow:hidden}
.seg button{padding:4px 12px;color:var(--n7);font-weight:600;background:var(--n0)}
.seg button.on{background:var(--m50);color:var(--m700)}
.seg button:hover{color:var(--n10)}
@media(max-width:1200px){.info-panel{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--sh);z-index:20}.conv-main{width:auto}}
</style>
</head>
<body data-archetype="slack-3pane">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const Ic=({n,s=16,style})=>{
  useEffect(()=>{if(window.lucide)window.lucide.createIcons()},[n]);

};
const vnd=v=>Number(v||0).toLocaleString('ko-KR')+'₫';

/* ── 더미 데이터 ── */
const REP0=[
  {id:1,kind:'영상',title:'미케비치 야경 숏폼',author:'user_4821',place:'미케비치 선셋 카페',reason:'광고성 콘텐츠',count:5,status:'접수',ago:'12분 전',body:'영상 하단에 외부 예약 링크와 할인 코드가 반복 노출돼요.'},
  {id:2,kind:'리뷰',title:'분짜 세트 가격 후기',author:'user_1937',place:'한시장 분짜 골목',reason:'가격 정보가 사실과 다름',count:3,status:'검수 중',ago:'38분 전',body:'실결제 70,000₫로 적었지만 영수증 사진에는 85,000₫로 보여요.'},

function statusPill(s){
  const m={접수:'',['검수 중']:'m',비공개:'warn',삭제:'bad',반려:'ok'};
  return <span className={'pill '+(m[s]||'')}><i/>{s}</span>;
}
function Modal({title,desc,okLabel,needReason,reasons,onOk,onClose,danger}){
  const [reason,setReason]=useState('');
  const [memo,setMemo]=useState('');
  const [err,setErr]=useState('');
  const ok=()=>{if(needReason&&!reason){setErr('처리 사유를 선택해 주세요.');return}onOk(reason,memo)};
  return <div className="modal-bg" onClick={onClose}><div className="modal" role="dialog" onClick={e=>e.stopPropagation()}>
    <h3>{title}</h3><p>{desc}</p>
    {needReason&&<div style={{marginBottom:12}}><select className="field" style={{width:'100%'}} value={reason} onChange={e=>{setReason(e.target.value);setErr('')}} aria-label="처리 사유"><option value="">처리 사유를 선택해 주세요</option>{reasons.map(r=><option key={r}>{r}</option>)}</select>{err&&<div className="err">{err}</div>}</div>}
    <textarea className="field" rows={3} placeholder="처리 메모를 남겨 주세요 (선택)" value={memo} onChange={e=>setMemo(e.target.value)}/>
    <div className="foot"><button className="btn ghost" onClick={onClose}>취소하기</button><button className={'btn '+(danger?'danger':'primary')} onClick={ok}>{okLabel}</button></div>
  </div></div>;
}
function History({items}){

}

function PushView({pushes,setPushes,toast}){
  const [title,setTitle]=useState('');
  const [body,setBody]=useState('');
  const [seg,setSeg]=useState('전체 회원');
  const [err,setErr]=useState({});
  const [busy,setBusy]=useState(false);
  const SEG={'전체 회원':1204,'최근 7일 업로드자':142,'저장 목록 보유자':386};
  const send=()=>{
    const e={};if(title.trim().length<5)e.t='제목을 5자 이상 입력해 주세요.';if(body.trim().length<5)e.b='본문을 5자 이상 입력해 주세요.';
    setErr(e);if(Object.keys(e).length)return;
    setBusy(true);setTimeout(()=>{setBusy(false);setPushes([{id:Date.now(),title:title.trim(),seg,cnt:SEG[seg],st:'발송 완료',at:'방금 전'},...pushes]);setTitle('');setBody('');toast('푸시 알림 '+SEG[seg].toLocaleString('ko-KR')+'건을 큐에 등록했어요')},900);
  };

    <div className="hl"><div><div className="k">이번 주 발송 대상</div><div className="v num">{pushes.reduce((s,p)=>s+p.cnt,0).toLocaleString('ko-KR')}<small>명</small></div></div></div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 260px',gap:24,marginBottom:24}}>
      <div className="card" style={{marginBottom:0}}><h4>새 알림 작성</h4>
        <div className="form-row"><label>대상</label><select className="field" value={seg} onChange={e=>setSeg(e.target.value)}>{Object.keys(SEG).map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="form-row" style={{alignItems:'start'}}><label style={{paddingTop:6}}>제목</label><div><input className="field" style={{width:'100%'}} maxLength={40} value={title} placeholder="예: 새 숏폼이 도착했어요" onChange={e=>setTitle(e.target.value)}/>{err.t&&<div className="err">{err.t}</div>}</div></div>
        <div className="form-row" style={{alignItems:'start'}}><label style={{paddingTop:6}}>본문</label><div><textarea className="field" rows={3} maxLength={80} value={body} placeholder="예: 저장한 장소 근처의 새 후기를 확인해 보세요." onChange={e=>setBody(e.target.value)}/>{err.b&&<div className="err">{err.b}</div>}</div></div>
        <div style={{display:'flex',justifyContent:'flex-end'}}><button className="btn primary lg" disabled={busy} onClick={send}>{busy?<><span className="spinner"/>등록하는 중</>:<><Ic n="send" s={14}/>발송 등록하기</>}</button></div>
      </div>
      <div><div className="info-label" style={{marginBottom:8}}>미리보기</div><div className="pv"><span className="app-ic"><Ic n="compass" s={16}/></span><div style={{minWidth:0}}><b style={{color:'var(--n10)',display:'block'}}>{title||'알림 제목이 여기에 보여요'}</b><span style={{color:'var(--n7)'}}>{body||'본문이 여기에 보여요.'}</span><div className="sub" style={{marginTop:4}}>다낭로그 · 지금</div></div></div>
        <p className="sub" style={{whiteSpace:'normal',marginTop:12}}>Firebase 메시징 큐로 등록되고, 실패한 발송은 자동으로 재시도해요.</p></div>
    </div>
    <div className="list"><div className="row-head r-push"><span>알림</span><span>대상</span><span>대상 수</span><span>상태</span></div>
      {pushes.map((p,i)=><div key={p.id} className="row r-push" style={{cursor:'default',animationDelay:i*30+'ms'}}><span style={{minWidth:0}}><span className="tt">{p.title}</span><span className="sub">{p.at}</span></span><span className="sub" style={{color:'var(--n8)'}}>{p.seg}</span><span className="sub num" style={{color:'var(--n8)'}}>{p.cnt.toLocaleString('ko-KR')}</span><span className={'pill '+(p.st==='예약'?'':'ok')}><i/>{p.st}</span></div>)}
    </div>
  </>;

    }
    if(a.kind==='retry'){setJobs(js=>js.map(j=>j.id===a.j.id?{...j,st:'대기',pg:0,err:null,tries:j.tries+1}:j));addHist('job:'+a.j.id,{who:'김서연',t:'재처리 등록',d:note||'같은 템플릿으로 재등록',n:1});say('작업을 큐에 다시 등록했어요')}
    if(a.kind==='cancel'){setJobs(js=>js.filter(j=>j.id!==a.j.id));setSelAll(s=>({...s,queue:null}));say('작업을 취소했어요')}
    if(a.kind==='pub'){const next=!a.p.pub;setPlaces(ps=>ps.map(p=>p.id===a.p.id?{...p,pub:next}:p));addHist('place:'+a.p.id,{who:'김서연',t:next?'공개 전환':'비공개 전환',d:next?note:'연결 콘텐츠 '+a.p.cnt+'개도 함께 비노출',n:1});say(next?'장소를 공개했어요':'장소와 연결 콘텐츠를 비공개로 바꿨어요')}
    if(a.kind==='stop'||a.kind==='resume'){const st=a.kind==='stop'?'정지':'정상';setMembers(ms=>ms.map(m=>m.id===a.m.id?{...m,st}:m));addHist('member:'+a.m.id,{who:'김서연',t:st==='정지'?'활동 정지':'정지 해제',d:note,n:1});say(st==='정지'?'회원 활동을 정지했어요':'정지를 해제했어요')}
    closeM();
  };
  const MD={
    hide:{title:'비공개로 처리할까요?',desc:'사용자 피드와 장소 상세에서 바로 보이지 않게 돼요. 언제든 되돌릴 수 있어요.',ok:'비공개 처리하기',need:true,reasons:['정책 위반 의심','저작권 문제','개인정보 노출','사실과 다른 정보']},
    del:{title:'콘텐츠를 삭제할까요?',desc:'삭제하면 되돌릴 수 없어요. 처리 이력에는 사유가 남아요.',ok:'삭제하기',need:true,danger:true,reasons:['광고·홍보','욕설·비방','저작권 침해','개인정보 노출']},
    rej:{title:'신고를 반려할까요?',desc:'정책 위반이 확인되지 않아 콘텐츠를 그대로 공개해요.',ok:'반려하기',need:true,reasons:['위반 사항 없음','중복 신고','근거 부족']},
    retry:{title:'작업을 재처리할까요?',desc:'실패한 작업을 같은 템플릿으로 큐 맨 뒤에 다시 등록해요.',ok:'재처리하기'},
    cancel:{title:'작업을 취소할까요?',desc:'대기·진행 중인 작업이 큐에서 빠져요.',ok:'작업 취소하기',danger:true},
    pub:{title:modal&&modal.kind==='pub'&&modal.p.pub?'비공개로 전환할까요?':'공개로 전환할까요?',desc:modal&&modal.kind==='pub'&&modal.p.pub?'연결된 콘텐츠도 함께 비노출돼요. 하나의 작업으로 처리돼요.':'장소와 연결 콘텐츠가 다시 노출돼요.',ok:'전환하기'},
    stop:{title:'활동을 정지할까요?',desc:'업로드와 리뷰 등록이 막혀요. 변경 이력에 사유가 남아요.',ok:'활동 정지하기',need:true,danger:true,reasons:['반복 신고 누적','홍보성 게시','정책 위반']},
    resume:{title:'정지를 해제할까요?',desc:'업로드와 리뷰 등록을 다시 사용할 수 있어요.',ok:'정지 해제하기'}
  };
  const cur=view;
  const selId=sel[cur];
  const addMemo=()=>{if(!memo.trim()||selId==null)return;const map={report:'report:',queue:'job:',place:'place:',member:'member:'};if(!map[cur])return;addHist(map[cur]+selId,{who:'김서연',t:'메모',d:memo.trim(),n:1});setMemo('');say('메모를 남겼어요')};
  const T=TITLES[cur];
  const counts={report:reps.filter(r=>r.status==='접수').length,queue:jobs.filter(j=>j.st==='대기').length};
  const showInfo=infoOpen&&cur!=='push';
  const selRep=reps.find(r=>r.id===sel.report),selJob=jobs.find(j=>j.id===sel.queue),selPlace=places.find(p=>p.id===sel.place),selMem=members.find(m=>m.id===sel.member);
  const infoTitle={report:'신고 상세',queue:'작업 상세',place:'장소 편집',member:'회원 상세'}[cur];
  const modalCfg=modal&&MD[modal.kind];
  return <div className="app">
    <nav className="workspace-strip" data-workspace-strip>
      <button className="ws-item active" title="다낭 베타" onClick={()=>say('다낭 베타 워크스페이스예요')}>다</button>
      <button className="ws-item" title="하노이 (확장 예정)" onClick={()=>say('하노이 워크스페이스는 2차 확장 범위예요')}>하</button>
      <div className="ws-divider"/>
      <button className="ws-item" title="워크스페이스 추가" aria-label="워크스페이스 추가" onClick={()=>say('워크스페이스 추가는 2차 확장 범위예요')}><Ic n="plus" s={18}/></button>
    </nav>
    <aside className="channel-list" data-channel-list>
      <header className="channel-header"><h2 className="ws-name">다낭로그 운영</h2><button className="new-conv" aria-label="새 항목" onClick={()=>{setView('place');setNewP(true)}}><Ic n="square-pen" s={16}/></button></header>
      <div className="channel-search"><label><Ic n="search" s={14}/><input placeholder="메뉴 검색" aria-label="메뉴 검색"/></label></div>
      <div className="channel-section"><div className="section-toggle"><Ic n="chevron-down" s={12}/>운영 채널</div>
        {CH.map(c=><div className="channel-row" key={c[0]}><button className={'channel-item'+(cur===c[0]?' active':'')} onClick={()=>{setView(c[0]);setAssignee('')}}><Ic n={c[2]} s={16}/><span>{c[1]}</span></button>{counts[c[0]]?<span className="channel-unread num">{counts[c[0]]}</span>:null}</div>)}
      </div>
      <div className="channel-section"><div className="section-toggle"><Ic n="chevron-down" s={12}/>빠른 필터</div>
        <div className="channel-row"><button className="channel-item sub" onClick={()=>{setView('report');setSelAll(s=>({...s,report:5}))}}><Ic n="hash" s={14}/><span>비방·욕설 신고</span></button></div>
        <div className="channel-row"><button className="channel-item sub" onClick={()=>{setView('queue');setSelAll(s=>({...s,queue:'J-3016'}))}}><Ic n="hash" s={14}/><span>소스 손상 실패</span></button></div>
        <div className="channel-row"><button className="channel-item sub" onClick={()=>{setView('place');setSelAll(s=>({...s,place:5}))}}><Ic n="hash" s={14}/><span>비공개 장소</span></button></div>
        <div className="channel-row"><button className="channel-item sub" onClick={()=>{setView('member');setSelAll(s=>({...s,member:6}))}}><Ic n="hash" s={14}/><span>활동 정지 회원</span></button></div>
      </div>
      <div className="channel-section"><div className="section-toggle"><Ic n="chevron-down" s={12}/>운영 담당자</div>
        {OPS.map(o=><button key={o[0]} className={'dm-item'+(assignee===o[0]?' active':'')} onClick={()=>{setView('report');setAssignee(assignee===o[0]?'':o[0]);say(assignee===o[0]?'담당자 보기를 해제했어요':o[0]+' 담당 신고를 보고 있어요')}}><span className="presence">{o[0].charAt(0)}<i className={o[1]==='on'?'on':''}/></span><span>{o[0]}</span></button>)}
      </div>
    </aside>
    <main className="conv-main">
      <header className="conv-header">
        <div className="conv-title-row"><Ic n={T[1]} s={18} style={{color:'var(--n7)'}}/><h2 className="conv-title">{T[0]}</h2><span className="member-count">운영자 {OPS.filter(o=>o[1]==='on').length}명 접속 중</span></div>
        <div className="conv-actions"><button className="icon-btn" aria-label="새로고침" onClick={()=>say('최신 상태로 새로고침했어요')}><Ic n="refresh-cw" s={16}/></button><button className={'icon-btn toggle-info'+(showInfo?' on':'')} aria-label="상세 패널 전환" disabled={cur==='push'} onClick={()=>setInfoOpen(!infoOpen)}><Ic n="panel-right" s={16}/></button></div>
      </header>
      <div className="conv-body" key={cur}>
        {cur==='report'&&<ReportView sel={sel.report} setSel={setSel('report')} reps={reps} setReps={setReps} hist={hist} addHist={addHist} ask={ask} assignee={assignee}/>}
        {cur==='queue'&&<QueueView jobs={jobs} setJobs={setJobs} sel={sel.queue} setSel={setSel('queue')} tpls={tpls} setTpls={setTpls} toast={say}/>}
        {cur==='place'&&<PlaceView places={places} sel={sel.place} setSel={setSel('place')} openNew={()=>setNewP(true)}/>}
        {cur==='member'&&<MemberView members={members} sel={sel.member} setSel={setSel('member')}/>}
        {cur==='push'&&<PushView pushes={pushes} setPushes={setPushes} toast={say}/>}
      </div>
      <footer className="conv-input">
        <input className="field msg-input" placeholder={cur==='push'?'푸시 알림은 위 작성 영역에서 등록해 주세요':'선택한 항목에 처리 메모를 남겨 주세요'} disabled={cur==='push'} value={memo} onChange={e=>setMemo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMemo()} aria-label="처리 메모"/>
        <button className="btn primary" disabled={cur==='push'||!memo.trim()} onClick={addMemo}><Ic n="send" s={14}/>메모 남기기</button>
      </footer>
    </main>
    {showInfo&&<aside className="info-panel" data-info-panel key={cur}>
      <header className="info-header"><h3>{infoTitle}</h3><button className="icon-btn close-info" aria-label="패널 닫기" onClick={()=>setInfoOpen(false)}><Ic n="x" s={16}/></button></header>
      {cur==='report'&&<ReportInfo r={selRep} hist={hist} ask={ask}/>}
      {cur==='queue'&&<JobInfo j={selJob} hist={hist} ask={ask}/>}
      {cur==='place'&&<PlaceInfo p={selPlace} setPlaces={setPlaces} ask={ask} toast={say} hist={hist} addHist={addHist}/>}
      {cur==='member'&&<MemberInfo m={selMem} hist={hist} ask={ask}/>}
    </aside>}
    {modal&&modalCfg&&<Modal title={modalCfg.title} desc={modalCfg.desc} okLabel={modalCfg.ok} needReason={modalCfg.need} reasons={modalCfg.reasons||[]} danger={modalCfg.danger} onOk={confirmM} onClose={closeM}/>}
    {newP&&<NewPlaceModal onClose={()=>setNewP(false)} onAdd={p=>{setPlaces(ps=>[...ps,{...p,id:Date.now(),pub:true,cnt:0,menu:[{n:'대표 메뉴',m:0,p:0}]}]);setNewP(false);say('장소를 등록했어요')}}/>}
    {toast&&<div className="toast" role="status"><Ic n="check-circle-2" s={16}/>{toast}</div>}
  </div>;
}
function NewPlaceModal({onClose,onAdd}){
  const [n,setN]=useState('');const [c,setC]=useState('맛집');const [r,setR]=useState('시내');const [err,setErr]=useState('');
  const ok=()=>{if(n.trim().length<2){setErr('장소명을 2자 이상 입력해 주세요.');return}onAdd({name:n.trim(),cat:c,region:r,lat:'16.0600',lng:'108.2200'})};
  return <div className="modal-bg" onClick={onClose}><div className="modal" role="dialog" onClick={e=>e.stopPropagation()}>
    <h3>새 장소를 등록할까요?</h3><p>관리자가 직접 장소를 등록하는 방식이에요. 좌표와 메뉴는 등록 후 수정해요.</p>
    <div className="form-row" style={{alignItems:'start'}}><label style={{paddingTop:6}}>장소명</label><div><input className="field" style={{width:'100%'}} placeholder="예: 논누억 해변 식당" value={n} onChange={e=>{setN(e.target.value);setErr('')}}/>{err&&<div className="err">{err}</div>}</div></div>
    <div className="form-row"><label>카테고리</label><select className="field" value={c} onChange={e=>setC(e.target.value)}>{['맛집','카페','액티비티','숙소'].map(x=><option key={x}>{x}</option>)}</select></div>
    <div className="form-row"><label>지역</label><select className="field" value={r} onChange={e=>setR(e.target.value)}>{['시내','미케비치','바나힐','호이안'].map(x=><option key={x}>{x}</option>)}</select></div>
    <div className="foot"><button className="btn ghost" onClick={onClose}>취소하기</button><button className="btn primary" onClick={ok}>등록하기</button></div>
  </div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
