<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜테리어 공간 배치 에디터 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 89°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#eff1ed;
  --m100:#eff1ed;
  --m200:#eff1ed;
  --m300:#dfe2db;
  --m400:#bfc6b8;
  --m500:#98a38c;
  --m600:#6c7c5c;
  --m700:#43582e;
  --m800:#1a3300;
  --m900:#152a00;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fcfaf5;
  --n1:#f4f1e8;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d6d7d5;
  --n5:#b8bab5;
  --n6:#949890;
  --n7:#757a71;
  --n8:#575a53;
  --n9:#383a36;
  --n10:#1f201e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--n0);color:var(--n9);font-size:15px;line-height:1.5;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:14px;color:var(--n9)}
.app{width:100%;height:100vh;display:flex;flex-direction:column;background:var(--n0)}
/* 상단 내비 — 스케치북 종이 위 얇은 점선 테두리 */
.topnav{margin:12px 20px 0;height:60px;border:1px dashed var(--n5);border-radius:16px;background:var(--n0);display:flex;align-items:center;padding:0 14px 0 12px;gap:18px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--n10)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--m800);display:grid;place-items:center;color:var(--n0);font-size:19px}
.nav{display:flex;gap:4px;flex:1;justify-content:center}
.nav-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;color:var(--n8);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav-btn i{font-size:18px;color:var(--n7)}
.nav-btn:hover{background:var(--n2)}
.nav-btn.on{background:var(--m50);color:var(--m700);box-shadow:inset 0 -2px 0 var(--m700)}
.nav-btn.on i{color:var(--m700)}
.nav-right{display:flex;align-items:center;gap:12px}
.saved{font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:var(--n7);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;animation:pulseDot 2s ease-in-out infinite}
.btn{height:40px;padding:0 18px;border-radius:6px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--n9);transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--m800);border-color:var(--m800);color:var(--n0)}
.btn-ghost{background:transparent;color:var(--n9)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px;border:1px solid var(--n4);background:var(--n0)}
.btn-icon:disabled{opacity:.4}
/* 히어로 스트립 */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 28px 10px;flex:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:12px;background:var(--m100);color:var(--n9);padding:3px 10px;border-radius:5px;margin-bottom:6px}
.h-display{font-size:48px;line-height:1.08;font-weight:800;letter-spacing:.03em;color:var(--n10)}
.h-display mark{background:linear-gradient(transparent 58%,var(--m200) 58%);color:inherit}
.hero-meta{display:flex;gap:8px;align-items:center;padding-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--n2);color:var(--n8);font-size:13px;font-weight:500;border:1px solid transparent}
.chip.on{background:var(--m50);border-color:var(--m700);color:var(--m700)}
.chip:hover{border-color:var(--n5)}
.view{flex:1;min-height:0;padding:0 20px 16px;animation:fadeUp .35s ease both}
/* 에디터 3단 */
.editor{height:100%;display:grid;grid-template-columns:268px 1fr 300px;gap:14px}
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-h{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;color:var(--n10)}
.panel-h small{font-family:ui-monospace,monospace;font-weight:400;font-size:11px;color:var(--n7)}
.panel-b{overflow:auto;padding:0 12px 12px;flex:1;min-height:0}
.lyr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid transparent;width:100%;text-align:left}
.lyr:hover{background:var(--n2)}
.lyr.sel{background:var(--m50);border-color:var(--m600)}
.lyr .thumb{width:34px;height:40px;border-radius:7px;background:var(--n2);display:grid;place-items:center;flex:none}
.lyr .nm{font-size:13.5px;font-weight:600;color:var(--n10);line-height:1.25}
.lyr .sb{font-size:11.5px;color:var(--n7)}
.lyr .grow{flex:1;min-width:0}
.sect{font-family:ui-monospace,monospace;font-size:11px;color:var(--n7);letter-spacing:.06em;padding:10px 6px 6px;text-transform:uppercase}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 2px}
.addbtn{border:1px solid var(--n4);border-radius:10px;padding:8px 4px 6px;background:var(--n0);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--n8);transition:transform .15s,border-color .15s}
.addbtn:hover{transform:translateY(-2px);border-color:var(--m700)}
/* 캔버스 */
.canvas-wrap{position:relative;background:var(--n2);border:1px solid var(--n3);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.canvas-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--n1);border-bottom:1px solid var(--n3);flex:none}
.canvas-bar .sp{flex:1}
.zoomtxt{font-family:ui-monospace,monospace;font-size:12px;width:48px;text-align:center;color:var(--n8)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:default}
.stage-inner{position:absolute;left:50%;top:50%;transform-origin:center center;width:1000px;height:620px;margin:-310px 0 0 -500px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--n4)}
.hint{position:absolute;left:14px;bottom:12px;background:var(--n10);color:var(--n0);font-size:12px;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:8px;opacity:.92}
.plant{cursor:grab}
.plant:active{cursor:grabbing}
.lf1{fill:var(--m600)}.lf2{fill:var(--m700)}.lf3{fill:var(--m500)}.lf4{fill:var(--m400)}
.pot{fill:var(--n5)}.pot2{fill:var(--n7)}.stem{stroke:var(--m700);fill:none;stroke-linecap:round}
.selbox{fill:none;stroke:var(--m700);stroke-width:1.5;stroke-dasharray:6 5}
.handle{fill:var(--n0);stroke:var(--m700);stroke-width:2.5;cursor:nwse-resize}
.ring{fill:none;stroke:var(--m600);stroke-width:2;animation:pulseRing 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
/* 인스펙터 */
.field{padding:0 4px 14px}
.field label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--n8);margin-bottom:6px}
.field label b{font-family:ui-monospace,monospace;font-weight:400;color:var(--n7)}
input[type=range]{width:100%;accent-color:var(--m700)}
.seg{display:flex;background:var(--n2);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--n8)}
.seg button.on{background:var(--n0);color:var(--m700);box-shadow:0 0 0 1px var(--n4)}
.kv{display:flex;align-items:center;gap:10px;background:var(--n0);border:1px solid var(--n3);border-radius:10px;padding:10px 12px;margin:0 4px 10px;font-size:13px}
.kv i{font-size:20px;color:var(--n7)}
.kv small{display:block;color:var(--n7);font-size:11.5px}
.empty{padding:26px 16px;text-align:center;color:var(--n7);font-size:13px}
.empty svg{display:block;margin:0 auto 10px}
/* 공통 섹션 */
.page{height:100%;overflow:auto;display:grid;gap:16px;grid-template-columns:1fr 340px;align-content:start}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:12px;padding:18px}
.card h3{font-size:16px;font-weight:700;color:var(--n10);margin-bottom:4px}
.card p.sub{font-size:13px;color:var(--n7);margin-bottom:12px}
.drop{border:1.5px dashed var(--n5);border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;background:var(--n0);cursor:pointer}
.drop:hover{border-color:var(--m700)}
.drop i{font-size:32px;color:var(--n7)}
.err{display:flex;gap:8px;align-items:flex-start;background:var(--s2-bg);color:var(--s2-text);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:10px}
.okmsg{display:flex;gap:8px;background:var(--s1-bg);color:var(--s1-text);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:10px}
.steps{display:grid;gap:8px;margin-top:12px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--n7)}
.step .ic{width:24px;height:24px;border-radius:50%;background:var(--n2);display:grid;place-items:center;font-size:14px;flex:none}
.step.done{color:var(--n10)}.step.done .ic{background:var(--s1);color:var(--n0)}
.step.cur{color:var(--n10);font-weight:600}.step.cur .ic{background:var(--m700);color:var(--n0)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--n0);border-right-color:transparent;animation:k-spin .7s linear infinite}
.bar{height:8px;border-radius:99px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m700);border-radius:99px;transition:width .3s ease}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--n3);font-size:14px}
.sw{width:40px;height:22px;border-radius:99px;background:var(--n4);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--n0);transition:transform .2s}
.sw.on{background:var(--m700)}.sw.on::after{transform:translateX(18px)}
.tag{display:inline-block;background:var(--n2);color:var(--n8);font-size:11.5px;padding:2px 9px;border-radius:999px;margin-right:4px}
.badge-ok{background:var(--s1-bg);color:var(--s1-text);font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600}
.badge-n{background:var(--n2);color:var(--n8);font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600}
/* 라이브러리 */
.lib{height:100%;overflow:auto}
.filters{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:4px 2px 14px}
.fgroup{display:flex;gap:6px;align-items:center}
.fgroup>span{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--n7);margin-right:4px}
.search{height:34px;border:1px solid var(--n4);border-radius:8px;padding:0 12px 0 34px;width:220px;background:var(--n0)}
.search-w{position:relative}.search-w i{position:absolute;left:11px;top:8px;font-size:17px;color:var(--n7)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{background:var(--n1);border:1px solid var(--n3);border-radius:12px;overflow:hidden;text-align:left;transition:transform .18s,border-color .18s;animation:fadeUp .4s ease both}
.pcard:hover{transform:translateY(-3px);border-color:var(--m700)}
.pcard .art{height:150px;background:var(--n2);display:grid;place-items:end center;padding-bottom:10px;position:relative}
.pcard .art .num{position:absolute;left:12px;top:10px;font-family:ui-monospace,monospace;font-size:11px;color:var(--n7)}
.pcard .bd{padding:12px 14px 14px}
.pcard .bd b{display:block;font-size:15px;color:var(--n10)}
.pcard .bd small{color:var(--n7);font-size:12px;display:block;margin-bottom:8px}
.skel{border-radius:12px;height:262px;background:linear-gradient(100deg,var(--n2) 30%,var(--n1) 50%,var(--n2) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border:1px solid var(--n3)}
.drawer-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 35%,transparent);z-index:40;animation:fadeIn .2s both}
.drawer{position:fixed;right:0;top:0;bottom:0;width:400px;background:var(--n0);z-index:41;padding:24px;overflow:auto;border-left:1px solid var(--n4);animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s both}
.modal{background:var(--n0);border-radius:16px;width:440px;padding:24px;border:1px solid var(--n4);animation:pop .25s ease both}
.modal h3{font-size:20px;font-weight:800;margin-bottom:14px;color:var(--n10)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.txt{width:100%;height:40px;border:1.5px solid var(--n4);border-radius:8px;padding:0 12px;background:var(--n0)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:11px 18px;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:14px;z-index:60;animation:fadeUp .3s both}
/* 렌더 */
.render{height:100%;overflow:auto;display:grid;grid-template-columns:1fr 360px;gap:16px;align-content:start}
.result{border-radius:12px;overflow:hidden;border:1px solid var(--n3);background:var(--n2);aspect-ratio:1000/620;position:relative}
.result svg{width:100%;height:100%;display:block}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--n3);width:100%;text-align:left}
.vrow .v{font-family:ui-monospace,monospace;font-size:12px;background:var(--m100);color:var(--n9);padding:3px 8px;border-radius:5px}
.vrow .grow{flex:1}.vrow b{display:block;font-size:14px;color:var(--n10)}.vrow small{color:var(--n7);font-size:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes pulseDot{50%{opacity:.35}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useMemo,useCallback}=React;

/* ── 식물 카탈로그 ── */
const CATALOG=[
 {id:'monstera',name:'몬스테라 델리시오사',kind:'관엽',size:'대',light:'밝은 간접광',water:'주 1회',h:'120cm'},
 {id:'fig',name:'떡갈고무나무',kind:'관엽',size:'대',light:'밝은 간접광',water:'주 1회',h:'140cm'},
 {id:'snake',name:'산세베리아 래디언스',kind:'공기정화',size:'중',light:'반음지',water:'2주 1회',h:'70cm'},
 {id:'olive',name:'올리브 나무',kind:'수목',size:'대',light:'직사광',water:'주 1회',h:'150cm'},
 {id:'pothos',name:'스킨답서스 행잉',kind:'행잉',size:'소',light:'반음지',water:'주 1회',h:'40cm'},
 {id:'palm',name:'아레카야자',kind:'관엽',size:'대',light:'밝은 간접광',water:'주 2회',h:'130cm'},
 {id:'rubber',name:'러버 플랜트',kind:'관엽',size:'중',light:'밝은 간접광',water:'10일 1회',h:'90cm'},
 {id:'zz',name:'금전수',kind:'공기정화',size:'중',light:'반음지',water:'3주 1회',h:'60cm'},
 {id:'succ',name:'에케베리아 모둠',kind:'다육',size:'소',light:'직사광',water:'3주 1회',h:'15cm'},
 {id:'bamboo',name:'테이블 야자',kind:'관엽',size:'소',light:'반음지',water:'주 1회',h:'45cm'}
];

/* ── 에디터 ── */
function Editor({plants,setPlants,hist,pushHist,undo,redo,sel,setSel,zoom,setZoom,variant,light,toast}){
  const stageRef=useRef(null),svgRef=useRef(null),drag=useRef(null),ptrs=useRef(new Map()),pinch=useRef(null);
  const toSvg=(e)=>{const r=svgRef.current.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*620}};
  const upd=(id,patch)=>setPlants(ps=>ps.map(p=>p.id===id?{...p,...patch}:p));
  const down=(e,p,mode)=>{e.stopPropagation();e.currentTarget.setPointerCapture?.(e.pointerId);setSel(p.id);const pt=toSvg(e);drag.current={id:p.id,mode,ox:pt.x-p.x,oy:pt.y-p.y,snap:plants,p0:{...p},start:pt,moved:false}};
  const move=e=>{
    if(ptrs.current.has(e.pointerId))ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.current.size===2){const [a,b]=[...ptrs.current.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch.current)setZoom(z=>Math.min(2,Math.max(.5,z*d/pinch.current)));pinch.current=d;return}
    const d=drag.current;if(!d)return;const pt=toSvg(e);d.moved=true;
    if(d.mode==='move')upd(d.id,{x:Math.round(Math.min(980,Math.max(20,pt.x-d.ox))),y:Math.round(Math.min(610,Math.max(120,pt.y-d.oy)))});
    else{const dist=Math.hypot(pt.x-d.p0.x,pt.y-(d.p0.y-140*d.p0.s));const base=Math.hypot(0,140*d.p0.s*.5)+60;upd(d.id,{s:+Math.min(2,Math.max(.35,d.p0.s*(1+(pt.x-d.start.x-(pt.y-d.start.y))/500))).toFixed(2)})}
  };
  const up=e=>{ptrs.current.delete(e.pointerId);if(ptrs.current.size<2)pinch.current=null;const d=drag.current;if(d&&d.moved)pushHist(d.snap);drag.current=null};
  const bgDown=e=>{ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});setSel(null)};
  const wheel=e=>{setZoom(z=>Math.min(2,Math.max(.5,+(z-e.deltaY*.001).toFixed(2))))};
  const selP=plants.find(p=>p.id===sel);
  return <div className="stage" ref={stageRef} onPointerDown={bgDown} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onWheel={wheel}>
    <div className="stage-inner" style={{transform:`scale(${zoom*0.98})`}}>
      <div style={{position:'absolute',inset:0}}><Room variant={variant} light={light}/></div>
      <svg ref={svgRef} viewBox="0 0 1000 620" width="1000" height="620" style={{position:'absolute',inset:0,touchAction:'none'}}>
        {[...plants].sort((a,b)=>a.y-b.y).map(p=>{
          const w=100*p.s,h=140*p.s;
          return <g key={p.id} className="plant" transform={`translate(${p.x} ${p.y}) rotate(${p.r})`} onPointerDown={e=>down(e,p,'move')}>
            <ellipse cx="0" cy="2" rx={38*p.s} ry={7*p.s} fill="var(--n10)" opacity=".13"/>
            <g transform={`translate(${-50*p.s} ${-140*p.s}) scale(${p.s})`}><PlantArt type={p.type}/></g>
            {sel===p.id&&<g>
              <rect className="selbox" x={-w/2-6} y={-h-6} width={w+12} height={h+12} rx="8"/>
              <circle className="ring" cx={w/2+6} cy={-h-6} r="12"/>
              <circle className="handle" cx={w/2+6} cy={-h-6} r="9" onPointerDown={e=>down(e,p,'resize')}/>
            </g>}
          </g>})}
      </svg>
    </div>
    <div className="hint"><i className="ph ph-hand-pointing"></i>{selP?`${selP.name} 선택됨 — 끌어서 이동, 모서리 핸들로 크기 조절`:'식물을 끌어 옮기고, 두 손가락 핀치나 휠로 확대합니다'}</div>
  </div>
}

function Inspector({p,upd,commit,del,dup}){
  if(!p)return <div className="panel-b"><div className="empty">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="var(--n6)" strokeWidth="1.6"><rect x="10" y="10" width="44" height="44" rx="10" strokeDasharray="5 4"/><path d="M32 40V26M25 32l7-7 7 7"/></svg>
    캔버스에서 식물을 선택하면<br/>크기·각도·레이어 순서를<br/>여기서 조정할 수 있습니다.</div></div>;
  const c=byId(p.type);
  return <div className="panel-b" style={{paddingTop:4}}>
    <div className="kv"><i className="ph ph-plant"></i><div><b>{p.name}</b><small>{c.kind} · {c.light} · 물주기 {c.water}</small></div></div>
    <div className="field"><label>크기 <b>{Math.round(p.s*100)}%</b></label><input type="range" min="35" max="200" value={Math.round(p.s*100)} onChange={e=>upd({s:e.target.value/100})} onPointerUp={commit}/></div>
    <div className="field"><label>회전 <b>{p.r}°</b></label><input type="range" min="-30" max="30" value={p.r} onChange={e=>upd({r:+e.target.value})} onPointerUp={commit}/></div>
    <div className="field"><label>빛 조건 적합도</label>
      <div className="bar"><i style={{width:c.light==='직사광'?'92%':c.light==='밝은 간접광'?'78%':'54%'}}></i></div>
      <div style={{fontSize:12,color:'var(--n7)',marginTop:6}}>북서향 창가에서 오후 채광 기준으로 계산합니다.</div></div>
    <div style={{display:'flex',gap:8,padding:'0 4px'}}>
      <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={dup}><i className="ph ph-copy"></i>복제</button>
      <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={del}><i className="ph ph-trash"></i>삭제</button>
    </div>
  </div>
}

/* ── 공간 사진 분석 ── */
const SAMPLES=[{n:'북서향 거실',v:0},{n:'침실 창가',v:1},{n:'서재 코너',v:2}];
function Analysis({variant,setVariant,toast,goEditor}){
  const [zones,setZones]=useState({floor:true,wall:false,light:true});
  const [stage,setStage]=useState(3);const [err,setErr]=useState('');const [fname,setFname]=useState('living_room_01.jpg');
  const fileRef=useRef(null);
  const run=()=>{setStage(0);let s=0;const t=setInterval(()=>{s++;setStage(s);if(s>=3)clearInterval(t)},900)};
  const pick=e=>{const f=e.target.files[0];if(!f)return;setErr('');
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)){setErr(`허용되지 않는 형식입니다 (${f.type||'알 수 없음'}). JPG·PNG·WEBP만 업로드할 수 있습니다.`);return}
    if(f.size>10*1024*1024){setErr('파일 용량이 10MB를 넘습니다. 10MB 이하로 줄여 주세요.');return}
    setFname(f.name);run();toast('검증 통과 — 분석을 시작합니다')};
  const labels=['파일 형식·용량 검증','서명 URL 업로드','공간 구조 분석 요청','배치 가능 영역 계산'];
  const cur=Math.min(stage,3);
  return <div className="page" style={{height:'100%'}}>
    <div className="card" style={{gridRow:'span 2'}}>
      <h3>분석 결과 — {fname}</h3><p className="sub">분석 영역을 켜고 끄며 식물을 놓을 수 있는 위치를 확인합니다.</p>
      <div style={{borderRadius:10,overflow:'hidden',border:'1px solid var(--n3)',aspectRatio:'1000/620',position:'relative'}}>
        <div style={{transform:'scale(.64)',transformOrigin:'top left',width:1000,height:620}}><Room variant={variant} light zones={zones}/></div>
        {stage<3&&<div style={{position:'absolute',inset:0,background:'color-mix(in srgb,var(--n0) 70%,transparent)',display:'grid',placeItems:'center'}}><div style={{display:'flex',gap:10,alignItems:'center',background:'var(--n10)',color:'var(--n0)',padding:'10px 16px',borderRadius:999}}><span className="spin"></span>분석 중</div></div>}
      </div>
      <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
        {[['floor','바닥 배치 영역','ph-square-half-bottom'],['wall','벽면 구조','ph-wall'],['light','채광 범위','ph-sun']].map(([k,l,ic])=>
          <button key={k} className={'chip'+(zones[k]?' on':'')} onClick={()=>setZones(z=>({...z,[k]:!z[k]}))}><i className={'ph '+ic}></i>{l}</button>)}
        <span style={{flex:1}}></span>
        <button className="btn btn-primary btn-sm" onClick={goEditor}><i className="ph ph-arrow-right"></i>이 공간으로 배치 시작</button>
      </div>
    </div>
    <div className="card">
      <h3>사진 업로드</h3><p className="sub">JPG·PNG·WEBP, 10MB 이하</p>
      <div className="drop" onClick={()=>fileRef.current.click()}><i className="ph ph-cloud-arrow-up"></i><div><b>방 사진을 끌어 놓거나 선택</b><div style={{fontSize:12.5,color:'var(--n7)'}}>형식·용량을 먼저 검증한 뒤 업로드합니다</div></div></div>
      <input ref={fileRef} type="file" hidden onChange={pick}/>
      {err&&<div className="err"><i className="ph ph-warning"></i><span>{err}</span></div>}
      <div style={{display:'flex',gap:8,marginTop:12}}>
        {SAMPLES.map(s=><button key={s.v} className={'chip'+(variant===s.v?' on':'')} onClick={()=>{setVariant(s.v);setFname(s.n+'.jpg');run()}}>{s.n}</button>)}
      </div>
    </div>
    <div className="card">
      <h3>분석 진행</h3>
      <div className="steps">{labels.map((l,i)=><div key={i} className={'step '+(i<cur||stage>=3?'done':i===cur?'cur':'')}>
        <span className="ic">{i<cur||stage>=3?<i className="ph ph-check"></i>:i===cur?<span className="spin" style={{width:12,height:12}}></span>:i+1}</span>{l}</div>)}</div>
      {stage>=3&&<div className="okmsg"><i className="ph ph-check-circle"></i><span>북서향 · 오후 채광 · 배치 가능 영역 3곳을 찾았습니다.</span></div>}
      {stage>=3&&<div style={{marginTop:12,display:'grid',gap:8}}>
        {[['창가 바닥','직사광 · 대형 식물 적합'],['소파 옆 코너','밝은 간접광 · 중형'],['벽 선반 위','반음지 · 행잉·소형']].map((r,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13.5}}><b style={{color:'var(--n10)'}}>{r[0]}</b><span style={{color:'var(--n7)'}}>{r[1]}</span></div>)}</div>}
    </div>
  </div>
}

/* ── 식물 라이브러리 ── */
function Library({addPlant,toast}){
  const [kind,setKind]=useState('전체'),[size,setSize]=useState('전체'),[light,setLight]=useState('전체'),[q,setQ]=useState('');
  const [loading,setLoading]=useState(false),[open,setOpen]=useState(null);
  const tm=useRef(null);
  const change=fn=>v=>{fn(v);setLoading(true);clearTimeout(tm.current);tm.current=setTimeout(()=>setLoading(false),650)};
  const list=CATALOG.filter(c=>(kind==='전체'||c.kind===kind)&&(size==='전체'||c.size===size)&&(light==='전체'||c.light===light)&&(!q||c.name.includes(q)));
  const G=({label,vals,val,set})=><div className="fgroup"><span>{label}</span>{['전체',...vals].map(v=><button key={v} className={'chip'+(val===v?' on':'')} onClick={()=>change(set)(v)}>{v}</button>)}</div>;
  return <div className="lib">
    <div className="filters">
      <div className="search-w"><i className="ph ph-magnifying-glass"></i><input className="search" placeholder="식물 이름 검색" value={q} onChange={e=>change(setQ)(e.target.value)}/></div>
      <G label="종류" vals={['관엽','공기정화','행잉','수목','다육']} val={kind} set={setKind}/>
      <G label="크기" vals={['소','중','대']} val={size} set={setSize}/>
      <G label="빛" vals={['직사광','밝은 간접광','반음지']} val={light} set={setLight}/>
    </div>
    <div className="grid">
      {loading?Array.from({length:8}).map((_,i)=><div className="skel" key={i}></div>):
       list.length?list.map((c,i)=><button key={c.id} className="pcard" style={{animationDelay:i*40+'ms'}} onClick={()=>setOpen(c)}>
        <div className="art"><span className="num">{String(i+1).padStart(2,'0')} / {c.h}</span><svg width="92" height="128" viewBox="0 0 100 140"><PlantArt type={c.id}/></svg></div>
        <div className="bd"><b>{c.name}</b><small>물주기 {c.water}</small><span className="tag">{c.kind}</span><span className="tag">{c.size}형</span><span className="tag">{c.light}</span></div></button>)
       :<div className="empty" style={{gridColumn:'1/-1'}}>조건에 맞는 식물이 없습니다. 필터를 줄여 보세요.</div>}
    </div>
    {open&&<><div className="drawer-bg" onClick={()=>setOpen(null)}></div>
      <div className="drawer">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span className="eyebrow">식물 상세</span><button className="btn-icon btn" onClick={()=>setOpen(null)}><i className="ph ph-x"></i></button></div>
        <div style={{background:'var(--n2)',borderRadius:12,display:'grid',placeItems:'end center',height:240,margin:'12px 0',padding:14}}><svg width="150" height="210" viewBox="0 0 100 140"><PlantArt type={open.id}/></svg></div>
        <h3 style={{fontSize:24,fontWeight:800,letterSpacing:'.02em',color:'var(--n10)'}}>{open.name}</h3>
        <div style={{margin:'10px 0 16px'}}><span className="tag">{open.kind}</span><span className="tag">{open.size}형 · {open.h}</span></div>
        {[['ph-sun','빛 조건',open.light],['ph-drop','물주기',open.water],['ph-house-line','권장 위치',open.size==='대'?'창가 바닥':open.size==='중'?'소파 옆 코너':'선반·테이블']].map(r=><div className="kv" style={{margin:'0 0 8px'}} key={r[1]}><i className={'ph '+r[0]}></i><div><small>{r[1]}</small><b>{r[2]}</b></div></div>)}
        <label style={{display:'block',fontSize:12.5,fontWeight:600,margin:'14px 0 6px'}}>메모</label>
        <input className="txt" placeholder="예: 창가 쪽 화분 받침 필요"/>
        <div className="row" style={{justifyContent:'space-between'}}>
          <button className="btn btn-ghost" onClick={()=>{toast('관심 식물에 담았습니다');setOpen(null)}}><i className="ph ph-bookmark-simple"></i>담아두기</button>
          <button className="btn btn-primary" onClick={()=>{addPlant(open.id);setOpen(null)}}><i className="ph ph-plus"></i>에디터에 추가</button></div>
      </div></>}
  </div>
}

/* ── 렌더링 및 저장 ── */
function RenderView({plants,variant,saved,restore,openSave,toast}){
  const [st,setSt]=useState('done'),[pct,setPct]=useState(100);
  const [opts,setOpts]=useState({shadow:true,light:true,hi:false});
  const run=()=>{setSt('spin');setPct(0);setTimeout(()=>{setSt('bar');let p=0;const t=setInterval(()=>{p+=9+Math.random()*7;if(p>=100){p=100;clearInterval(t);setSt('skel');setTimeout(()=>{setSt('done');toast('렌더링 완료 — 결과 이미지로 전환했습니다')},900)}setPct(Math.round(p))},260)},800)};
  return <div className="render">
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div><h3>렌더링 결과 미리보기</h3><p className="sub" style={{margin:0}}>배치한 {plants.length}개 식물을 공간 사진에 합성합니다.</p></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" onClick={run} data-loading={st==='spin'||st==='bar'?'true':undefined}><i className="ph ph-arrows-clockwise"></i>다시 렌더링</button>
          <button className="btn btn-primary" onClick={openSave}><i className="ph ph-floppy-disk"></i>프로젝트 저장</button></div></div>
      <div className="result">
        {st==='done'&&<svg viewBox="0 0 1000 620"><foreignObject width="1000" height="620"><div xmlns="http://www.w3.org/1999/xhtml" style={{width:1000,height:620}}><Room variant={variant} light={opts.light}/></div></foreignObject>
          {[...plants].sort((a,b)=>a.y-b.y).map(p=><g key={p.id} transform={`translate(${p.x} ${p.y}) rotate(${p.r})`}>{opts.shadow&&<ellipse cx="0" cy="2" rx={44*p.s} ry={8*p.s} fill="var(--n10)" opacity=".2"/>}<g transform={`translate(${-50*p.s} ${-140*p.s}) scale(${p.s})`}><PlantArt type={p.type}/></g></g>)}
        </svg>}
        {st==='skel'&&<div className="skel" style={{height:'100%',borderRadius:0}}></div>}
        {(st==='spin'||st==='bar')&&<div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',background:'var(--n2)'}}>
          <div style={{width:340,textAlign:'center'}}>
            {st==='spin'?<div style={{display:'inline-flex',gap:10,alignItems:'center',background:'var(--n10)',color:'var(--n0)',padding:'10px 18px',borderRadius:999}}><span className="spin"></span>렌더링 작업 대기열 확인 중</div>
            :<><div style={{fontWeight:700,marginBottom:10,color:'var(--n10)'}}>이미지 합성 {pct}%</div><div className="bar"><i style={{width:pct+'%'}}></i></div></>}
          </div></div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'0 24px',marginTop:10}}>
        {[['shadow','그림자 합성'],['light','창가 채광 효과'],['hi','고해상도 출력']].map(([k,l])=><div key={k} className="tgl"><span>{l}</span><button className={'sw'+(opts[k]?' on':'')} aria-label={l} onClick={()=>setOpts(o=>({...o,[k]:!o[k]}))}></button></div>)}
      </div>
    </div>
    <div className="card">
      <h3>저장된 프로젝트</h3><p className="sub">저장할 때마다 배치 스냅샷이 버전으로 남습니다.</p>
      {saved.map(s=><button key={s.id} className="vrow" onClick={()=>restore(s)}>
        <span className="v">v{s.ver}</span><span className="grow"><b>{s.name}</b><small>{s.time} · 식물 {s.plants.length}개</small></span><i className="ph ph-clock-counter-clockwise" style={{fontSize:20,color:'var(--n7)'}}></i></button>)}
      <div className="empty" style={{paddingBottom:0,fontSize:12.5}}>버전을 누르면 에디터에 그 배치가 그대로 복원됩니다.</div>
    </div>
  </div>
}

/* ── 앱 ── */
function App(){
  const [view,setView]=useState('main');
  const [plants,setPlantsRaw]=useState(INIT);
  const [past,setPast]=useState([]),[future,setFuture]=useState([]);
  const [sel,setSel]=useState(1),[zoom,setZoom]=useState(1),[variant,setVariant]=useState(0);
  const [saved,setSaved]=useState(SAVED0),[saveOpen,setSaveOpen]=useState(false),[pname,setPname]=useState('북서향 거실 A안');
  const [msg,setMsg]=useState(''),[light]=useState(true);
  const [when,setWhen]=useState('14:32');
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),2200)};
  const setPlants=fn=>setPlantsRaw(fn);
  const pushHist=snap=>{setPast(p=>[...p.slice(-30),snap]);setFuture([])};
  const undo=()=>{if(!past.length)return;setFuture(f=>[plants,...f]);setPlantsRaw(past[past.length-1]);setPast(p=>p.slice(0,-1))};
  const redo=()=>{if(!future.length)return;setPast(p=>[...p,plants]);setPlantsRaw(future[0]);setFuture(f=>f.slice(1))};
  const selP=plants.find(p=>p.id===sel);
  const snapRef=useRef(null);
  const upd=patch=>{if(!snapRef.current)snapRef.current=plants;setPlantsRaw(ps=>ps.map(p=>p.id===sel?{...p,...patch}:p))};
  const commit=()=>{if(snapRef.current){pushHist(snapRef.current);snapRef.current=null}};
  const addPlant=type=>{const c=byId(type);pushHist(plants);const id=Date.now();setPlantsRaw(ps=>[...ps,{id,type,x:480+Math.round(Math.random()*120-60),y:560,s:SIZE_SCALE[c.size],r:0,name:c.name}]);setSel(id);setView('main');toast(`${c.name}을(를) 캔버스에 추가했습니다`)};
  const del=()=>{pushHist(plants);setPlantsRaw(ps=>ps.filter(p=>p.id!==sel));setSel(null)};
  const dup=()=>{const c=selP;if(!c)return;pushHist(plants);const id=Date.now();setPlantsRaw(ps=>[...ps,{...c,id,x:Math.min(960,c.x+70)}]);setSel(id)};
  const save=()=>{const last=saved.find(s=>s.name===pname);const ver=last?last.ver+1:1;setSaved(s=>[{id:'v'+Date.now(),name:pname,ver,time:'방금',plants},...s]);setSaveOpen(false);setWhen('방금');toast(`“${pname}” v${ver}로 저장했습니다`)};
  const restore=s=>{pushHist(plants);setPlantsRaw(s.plants);setSel(null);setView('main');toast(`v${s.ver} 배치를 복원했습니다`)};
  const NAV=[['main','식물 배치 에디터','ph-squares-four'],['analysis','공간 사진 분석','ph-image'],['library','식물 라이브러리 탐색','ph-plant'],['render','렌더링 및 프로젝트 저장','ph-cube']];
  const titles={main:['북서향 거실,','식물 '+plants.length+'그루로 채우기'],analysis:['방 사진에서','빛과 공간 읽기'],library:['우리 집에 맞는','식물 고르기'],render:['배치 결과를','이미지로 완성하기']};
  return <div className="app">
    <header className="topnav">
      <div className="brand"><span className="brand-mark"><i className="ph ph-leaf"></i></span>플랜트스케이프</div>
      <nav className="nav">{NAV.map(([k,l,ic])=><button key={k} className={'nav-btn'+(view===k?' on':'')} onClick={()=>setView(k)}><i className={'ph '+ic}></i>{l}</button>)}</nav>
      <div className="nav-right"><span className="saved"><span className="dot"></span>{when} 저장됨</span>
        <button className="btn btn-primary" onClick={()=>setView('render')}><i className="ph ph-play"></i>렌더링 시작</button></div>
    </header>
    <section className="hero">
      <div><span className="eyebrow"><i className="ph ph-house-line"></i>거실 · 북서향 · 오후 채광</span>
        <h1 className="h-display">{titles[view][0]} <mark>{titles[view][1]}</mark></h1></div>
      {view==='main'&&<div className="hero-meta"><span className="chip"><i className="ph ph-sun"></i>직사광 2시간</span><span className="chip"><i className="ph ph-ruler"></i>바닥 영역 3곳</span></div>}
    </section>
    <main className="view" key={view}>
      {view==='main'&&<div className="editor">
        <aside className="panel"><div className="panel-h">레이어 <small>{plants.length} items</small></div>
          <div className="panel-b">
            {[...plants].reverse().map(p=><button key={p.id} className={'lyr'+(sel===p.id?' sel':'')} onClick={()=>setSel(p.id)}>
              <span className="thumb"><Mini type={p.type} w={22}/></span><span className="grow"><div className="nm">{p.name}</div><div className="sb">{byId(p.type).size}형 · {Math.round(p.s*100)}%</div></span></button>)}
            <div className="sect">빠른 추가</div>
            <div className="addrow">{['monstera','olive','snake'].map(t=><button key={t} className="addbtn" onClick={()=>addPlant(t)}><Mini type={t} w={26}/>{byId(t).name.split(' ')[0]}</button>)}</div>
          </div></aside>
        <div className="canvas-wrap">
          <div className="canvas-bar">
            <button className="btn-icon btn" title="실행 취소" disabled={!past.length} onClick={undo}><i className="ph ph-arrow-counter-clockwise"></i></button>
            <button className="btn-icon btn" title="다시 실행" disabled={!future.length} onClick={redo}><i className="ph ph-arrow-clockwise"></i></button>
            <span className="sp"></span>
            <button className="btn-icon btn" title="축소" onClick={()=>setZoom(z=>Math.max(.5,+(z-.1).toFixed(2)))}><i className="ph ph-magnifying-glass-minus"></i></button>
            <span className="zoomtxt num">{Math.round(zoom*100)}%</span>
            <button className="btn-icon btn" title="확대" onClick={()=>setZoom(z=>Math.min(2,+(z+.1).toFixed(2)))}><i className="ph ph-magnifying-glass-plus"></i></button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setSaveOpen(true)}><i className="ph ph-floppy-disk"></i>저장</button>
          </div>
          <Editor plants={plants} setPlants={setPlants} pushHist={pushHist} sel={sel} setSel={setSel} zoom={zoom} setZoom={setZoom} variant={variant} light={light} toast={toast}/>
        </div>
        <aside className="panel"><div className="panel-h">속성 <small>{selP?'선택됨':'없음'}</small></div><Inspector p={selP} upd={upd} commit={commit} del={del} dup={dup}/></aside>
      </div>}
      {view==='analysis'&&<Analysis variant={variant} setVariant={setVariant} toast={toast} goEditor={()=>setView('main')}/>}
      {view==='library'&&<Library addPlant={addPlant} toast={toast}/>}
      {view==='render'&&<RenderView plants={plants} variant={variant} saved={saved} restore={restore} openSave={()=>setSaveOpen(true)} toast={toast}/>}
    </main>
    {saveOpen&&<Modal onClose={()=>setSaveOpen(false)}>
      <h3>프로젝트 저장</h3>
      <label style={{fontSize:12.5,fontWeight:600}}>프로젝트 이름</label>
      <input className="txt" style={{margin:'6px 0 12px'}} value={pname} onChange={e=>setPname(e.target.value)}/>
      <div className="tgl"><span>공유 링크 만들기</span><button className="sw" aria-label="공유" onClick={e=>e.currentTarget.classList.toggle('on')}></button></div>
      <p style={{fontSize:12.5,color:'var(--n7)',marginTop:10}}>배치 {plants.length}개가 레이어 JSON 스냅샷으로 기록되고, 같은 이름이면 다음 버전으로 저장됩니다.</p>
      <div className="row"><button className="btn btn-ghost" onClick={()=>setSaveOpen(false)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
    </Modal>}
    <Toast msg={msg}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
