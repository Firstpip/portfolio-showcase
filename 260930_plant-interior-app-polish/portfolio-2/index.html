<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜테리어 서비스 운영 콘솔 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 18°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#faf3f0;
  --m100:#f5e7e1;
  --m200:#eacfc3;
  --m300:#ddb29f;
  --m400:#cf9177;
  --m500:#c27250;
  --m600:#b4532a;
  --m700:#944422;
  --m800:#73351b;
  --m900:#512513;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#f0f0ef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#777b86;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 18°와 18° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{--ink:#17191c;--peach:#fbe1d1;font-family:'Pretendard',system-ui,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.45;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--n9)}
.shell{display:flex;width:100%;height:100vh}
.sidebar{width:240px;flex:none;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:18px 14px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;font-family:'Pretendard';font-size:20px;font-weight:400;letter-spacing:-.02em;color:var(--n10)}
.mark{width:30px;height:30px;border-radius:9px;background:var(--m600);display:grid;place-items:center;color:var(--n0)}
.env{margin:0 6px 14px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--n4);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--n8);background:var(--n0)}
.sidebar-section-title{font-size:11px;letter-spacing:.08em;color:var(--n6);padding:14px 10px 6px;font-weight:600}
.sidebar-link{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--n8);width:100%;text-align:left;font-weight:450;transition:background .15s}
.sidebar-link svg{color:var(--n7);flex:none}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.active{background:var(--m50);color:var(--m700);box-shadow:inset 3px 0 0 var(--m600);font-weight:600}
.sidebar-link.active svg{color:var(--m600)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--n3);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--n7)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:600;font-size:12px}
.main{flex:1;min-width:0;overflow:auto;padding:22px 28px 28px;animation:fadeUp .3s ease both}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.page-title{font-size:46px;line-height:1.1;font-weight:400;letter-spacing:-.045em;color:var(--ink)}
.page-meta{font-size:12.5px;color:var(--n7);margin-top:6px;display:flex;align-items:center;gap:8px}
.page-actions{display:flex;gap:8px}
.btn{height:36px;padding:0 16px;border-radius:999px;font-weight:450;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--n10);transition:transform .12s,background .15s;white-space:nowrap}
.btn:hover{background:var(--n2)}
.btn-primary:hover{background:var(--m700)}
.btn-primary{background:var(--m600);border-color:var(--m600);color:var(--n0)}
.btn-secondary{background:transparent;color:var(--n10)}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn-x{width:30px;height:30px;padding:0;justify-content:center;border-color:var(--n4)}
.live{width:7px;height:7px;border-radius:50%;background:var(--s1);animation:pulse 1.6s ease-in-out infinite;display:inline-block}
/* 슬림 상태바 (KPI 카드 행 대체) */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--n3);border-radius:6px;background:var(--n1);margin-bottom:14px;overflow:hidden}
.stat-card{display:flex;align-items:center;gap:12px;padding:12px 18px;border-right:1px solid var(--n3)}
.stat-card:last-child{border-right:0}
.stat-card.hl{background:var(--peach)}
.stat-label{font-size:12px;color:var(--n7)}
.stat-value{font-size:30px;line-height:1.1;font-weight:400;letter-spacing:-.03em;color:var(--n10);font-variant-numeric:tabular-nums}
.stat-delta{font-size:12px;color:var(--s1-text);margin-left:6px}
.stat-delta.neutral{color:var(--n7)}
.stat-sparkline{margin-left:auto;flex:none}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-bottom:14px}
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:6px;padding:16px 18px}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panel-h h3{font-size:15px;font-weight:500;color:var(--n10)}
.panel-h small{color:var(--n7);font-size:12px}
/* 간트 */
.gantt{position:relative}
.g-scale{display:grid;grid-template-columns:150px 1fr;font-size:11px;color:var(--n6);margin-bottom:4px}
.g-scale div:last-child{display:flex;justify-content:space-between}
.g-row{display:grid;grid-template-columns:150px 1fr;align-items:center;height:34px;border-top:1px solid var(--n3);width:100%;text-align:left}
.g-row:hover{background:var(--n2)}
.g-name{font-size:12.5px;color:var(--n9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.g-track{position:relative;height:100%;background-image:linear-gradient(90deg,var(--n3) 1px,transparent 1px);background-size:12.5% 100%}
.g-bar{position:absolute;top:8px;height:18px;border-radius:6px;background:var(--n5);animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.g-bar.run{background:var(--m600);background-image:repeating-linear-gradient(45deg,transparent 0 8px,color-mix(in srgb,var(--n0) 25%,transparent) 8px 16px);background-size:22px 22px;animation:grow .8s both,stripes 1s linear infinite}
.g-bar.done{background:var(--m300)}
.g-bar.fail{background:var(--n10)}
.g-now{position:absolute;top:0;bottom:0;left:calc(150px + (100% - 150px) * .62);width:1.5px;background:var(--m600)}
.g-now span{position:absolute;top:-18px;left:-16px;font-size:10.5px;background:var(--m600);color:var(--n0);padding:1px 6px;border-radius:99px}
/* 우선 큐 */
.q-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--n3);width:100%;text-align:left;align-items:flex-start}
.q-item:hover{background:var(--n2)}
.q-rank{width:22px;height:22px;border-radius:6px;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;margin-top:1px}
.q-item b{display:block;font-size:13px;font-weight:500;color:var(--n10)}
.q-item small{color:var(--n7);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.badge.dark{background:var(--n10);color:var(--n0)}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
/* 탭 + 테이블 */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--n3);margin-bottom:10px}
.tab{height:38px;padding:0 14px;color:var(--n7);font-weight:450;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--n10);border-bottom-color:var(--m600);font-weight:600}
.data-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{height:32px;border:1px solid var(--n4);border-radius:999px;padding:0 14px;width:240px;background:var(--n0)}
.filter-chip{height:30px;padding:0 13px;border-radius:999px;background:var(--n2);font-size:12.5px;color:var(--n8);border:1px solid transparent}
.filter-chip.on{background:var(--m50);border-color:var(--m600);color:var(--m700)}
.spacer{flex:1}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11.5px;font-weight:500;color:var(--n7);padding:8px 10px;border-bottom:1px solid var(--n4);letter-spacing:.02em}
.data-table td{height:46px;padding:0 10px;border-bottom:1px solid var(--n3);font-size:13px}
.data-table tbody tr{cursor:pointer;transition:background .12s}
.data-table tbody tr:hover{background:var(--n2)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.asset-th{width:34px;height:34px;border-radius:8px;background:var(--n2);display:grid;place-items:center;color:var(--n7)}
.mono{font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:var(--n7)}
/* 보안 */
.sec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sec-card{background:var(--n1);border:1px solid var(--n3);border-radius:6px;padding:16px;text-align:left;transition:transform .15s,border-color .15s;animation:fadeUp .4s ease both}
.sec-card:hover{transform:scale(1.015);border-color:var(--m600)}
.sec-card b{display:block;font-size:14px;font-weight:500;margin:10px 0 2px;color:var(--n10)}
.sec-card small{color:var(--n7);font-size:12px;display:block;margin-bottom:10px}
.code{background:var(--n10);color:var(--n1);border-radius:4px;padding:12px 14px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;overflow:auto;white-space:pre}
.bar{height:6px;border-radius:99px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m600);border-radius:99px;transition:width .3s}
/* 분석 */
.seg{display:inline-flex;background:var(--n2);border-radius:999px;padding:3px}
.seg button{height:28px;padding:0 14px;border-radius:999px;font-size:12.5px;color:var(--n8)}
.seg button.on{background:var(--n0);color:var(--n10);box-shadow:0 0 0 1px var(--n4)}
.funnel{display:grid;gap:10px}
.f-row{display:grid;grid-template-columns:140px 1fr 90px;align-items:center;gap:12px;font-size:13px}
.f-bar{height:26px;border-radius:7px;background:var(--m600);animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;display:flex;align-items:center;padding-left:10px;color:var(--n0);font-size:12px}
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s both}
.modal{background:var(--n0);border-radius:8px;width:520px;max-height:86vh;overflow:auto;padding:26px;animation:pop .25s both}
.modal h3{font-size:26px;font-weight:400;letter-spacing:-.03em;margin-bottom:14px;color:var(--n10)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--n7);margin-bottom:5px}
.fld input,.fld select{width:100%;height:38px;border:1px solid var(--n4);border-radius:4px;padding:0 12px;background:var(--n0)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;right:28px;bottom:26px;background:var(--n10);color:var(--n0);padding:11px 16px;border-radius:12px;display:flex;align-items:center;gap:9px;z-index:60;animation:fadeUp .3s both;font-size:13.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--n0);border-right-color:transparent;animation:k-spin .7s linear infinite;display:inline-block}
.sk{height:14px;border-radius:5px;background:linear-gradient(100deg,var(--n2) 30%,var(--n1) 50%,var(--n2) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.hero-band{position:relative;border-radius:6px;overflow:hidden;margin-bottom:14px;padding:26px 28px;background:radial-gradient(520px 220px at 88% 10%,var(--peach),transparent 70%),radial-gradient(420px 200px at 55% 120%,color-mix(in srgb,var(--peach) 55%,var(--n0)),transparent 70%),var(--n1);border:1px solid var(--n3);box-shadow:0 1px 2px rgba(23,25,28,.06)}
.hero-band h2{font-size:44px;line-height:1.15;font-weight:400;letter-spacing:-.045em;color:var(--ink);max-width:560px}
.hero-band h2 em{font-style:italic;color:var(--m700)}
.hero-band p{color:var(--n7);margin-top:8px;font-size:14.5px;max-width:480px}
.float{position:absolute;background:var(--n0);border-radius:24px;padding:14px 16px;box-shadow:0 10px 30px rgba(23,25,28,.08);border:1px solid var(--n3);animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stripes{to{background-position:22px 0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.3}}
</style>
</head>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span className="asset-th"><Icon n={it[3].slice(3)==='lock'?'lock':it[3].slice(3)} s={17}/></span><span className={'badge '+(it[2]==='ok'?'ok':'warn')}><span className="d"></span>{it[2]==='ok'?'통과':'주의'}</span></div>
      <b>{it[0]}</b><small>{it[1]}</small><div className="bar"><i style={{width:it[5]+'%',background:it[2]==='ok'?'var(--m600)':'var(--s3)'}}></i></div></button>)}</div>
    {sel&&<Modal onClose={()=>setSel(null)}><h3>{sel[0]}</h3><div style={{marginBottom:12}}><span className={'badge '+(sel[2]==='ok'?'ok':'warn')}>{sel[2]==='ok'?'통과':'주의'}</span></div>
      <p style={{color:'var(--n7)',marginBottom:12}}>{sel[1]}</p><div className="code">{sel[4]}</div>
      <div className="row-end"><button className="btn btn-secondary" onClick={()=>setSel(null)}>닫기</button><button className="btn btn-primary" onClick={()=>{toast('조치 항목을 작업 목록에 추가했습니다');setSel(null)}}>조치 작업 만들기</button></div></Modal>}
  </>
}

/* ── 사용 분석 리포트 ── */
function Analytics({toast}){
  const [rng,setRng]=useState(14),[load,setLoad]=useState(false);
  const pick=r=>{setLoad(true);setRng(r);setTimeout(()=>setLoad(false),500)};
  const d=RANGE[rng].v,W=640,H=210,mx=Math.max(...d)*1.15;
  const pts=d.map((v,i)=>[40+i/(d.length-1)*(W-56),H-26-v/mx*(H-46)]);
  const area='M'+pts.map(p=>p.join(' ')).join('L')+`L${pts[pts.length-1][0]} ${H-26}L${pts[0][0]} ${H-26}z`;
  const sum=d.reduce((a,b)=>a+b,0);
  const steps=[['프로젝트 생성',1.0],['사진 업로드',.82],['식물 배치',.64],['렌더링 요청',.47],['프로젝트 저장',.39]].map(s=>[s[0],Math.round(sum*s[1]),s[1]]);
  return <>
    <div className="page-header"><div><h1 className="page-title">사용 분석 리포트</h1><div className="page-meta">{RANGE[rng].l} · 단계별 도달 수와 일별 프로젝트 생성</div></div>
      <div className="page-actions"><div className="seg">{[7,14,30].map(r=><button key={r} className={rng===r?'on':''} onClick={()=>pick(r)}>{r}일</button>)}</div><button className="btn btn-secondary" onClick={()=>toast('리포트 CSV를 내보냈습니다')}><Icon n="down" s={15}/>내보내기</button></div></div>
    <section className="stat-row" data-stat-row>
      {[['프로젝트 생성',sum+'건',d.slice(-7)],['배치 횟수',Math.round(sum*6.4)+'회',d.slice(-7).map(x=>x*6)],['저장 완료',Math.round(sum*.39)+'건',d.slice(-7).map(x=>x*.4)],['평균 배치 식물',(4.8).toFixed(1)+'개',[4.1,4.4,4.3,4.6,4.7,4.8,4.8]]].map((s,i)=>
        <div className={"stat-card"+(i===3&&s[0]==="재시도 대기"?" hl":"")} key={i}><div><div className="stat-label">{s[0]}</div><span className="stat-value">{s[1]}</span></div><Spark d={s[2]}/></div>)}
    </section>
    <div className="grid-main">
      <section className="panel" style={{borderRadius:6,boxShadow:'0 1px 2px rgba(23,25,28,.06)'}}><div className="panel-h"><h3>일별 프로젝트 생성</h3><small>{RANGE[rng].l}</small></div>
        {load?<div style={{height:H,display:'grid',gap:10,alignContent:'center'}}>{[90,70,80].map(w=><div key={w} className="sk" style={{width:w+'%'}}></div>)}</div>:
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
          {[0,1,2,3].map(i=><g key={i}><line x1="40" x2={W-16} y1={H-26-i*(H-46)/3} y2={H-26-i*(H-46)/3} stroke="var(--n3)"/><text x="30" y={H-22-i*(H-46)/3} fontSize="10" textAnchor="end" fill="var(--n6)">{Math.round(mx*i/3)}</text></g>)}
          <path d={area} fill="var(--m100)" opacity=".8"/><path d={'M'+pts.map(p=>p.join(' ')).join('L')} fill="none" stroke="var(--m600)" strokeWidth="2.2" strokeLinejoin="round"/>
          {pts.map((p,i)=>(i%Math.ceil(d.length/7)===0||i===d.length-1)&&<g key={i}><circle cx={p[0]} cy={p[1]} r="3.4" fill="var(--n0)" stroke="var(--m600)" strokeWidth="2"/><text x={p[0]} y={H-8} fontSize="10" textAnchor="middle" fill="var(--n6)">{d.length-i-1===0?'오늘':`-${d.length-i-1}일`}</text></g>)}
        </svg>}</section>
      <section className="panel" style={{borderRadius:6,boxShadow:'0 1px 2px rgba(23,25,28,.06)'}}><div className="panel-h"><h3>단계별 도달 수</h3><small>생성 기준</small></div>
        <div className="funnel">{steps.map((s,i)=><div className="f-row" key={s[0]}><span>{s[0]}</span><div><div className="f-bar" style={{width:s[2]*100+'%',background:`var(--m${[700,600,500,400,300][i]})`,animationDelay:i*90+'ms',color:i>2?'var(--n10)':'var(--n0)'}}>{Math.round(s[2]*100)}%</div></div><span className="num">{s[1]}건</span></div>)}</div></section>
    </div>
    <section className="panel" style={{borderRadius:6,boxShadow:'0 1px 2px rgba(23,25,28,.06)'}}><div className="panel-h"><h3>많이 배치된 식물</h3><small>{RANGE[rng].l}</small></div>
      <table className="data-table"><thead><tr><th>순위</th><th>식물</th><th>종류</th><th className="num">배치 횟수</th><th className="num">저장 포함</th></tr></thead>
        <tbody>{['몬스테라 델리시오사','산세베리아 래디언스','올리브 나무','스킨답서스 행잉','떡갈고무나무','아레카야자'].map((n,i)=><tr key={n} onClick={()=>toast(`${n} 상세 지표를 열었습니다`)}><td className="mono">{i+1}</td><td style={{fontWeight:500}}>{n}</td><td>{['관엽','공기정화','수목','행잉','관엽','관엽'][i]}</td><td className="num">{Math.round(sum*(1.9-i*.25))}</td><td className="num">{Math.round(sum*(.8-i*.1))}</td></tr>)}</tbody></table></section>
  </>
}

function App(){
  const [view,setView]=useState('main'),[job,setJob]=useState(null),[msg,setMsg]=useState('');
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),2200)};
  const NAV=[['현황',[['main','서비스 현황 관제','gauge']]],['콘텐츠',[['assets','식물 에셋 관리','leaf']]],['운영',[['security','보안 점검 센터','shield'],['analytics','사용 분석 리포트','chart']]]];
  return <div className="shell" data-archetype="stripe-multipane">
    <aside className="sidebar" data-sidebar style={{width:240}}>
      <div className="sidebar-brand"><span className="mark"><Icon n="leaf" s={17}/></span>플랜트스케이프</div>
      <div className="env"><span>Production</span><span className="mono">ap-northeast-2</span></div>
      {NAV.map(([t,items])=><div key={t}><div className="sidebar-section-title">{t}</div>
        {items.map(([k,l,ic])=><button key={k} className={'sidebar-link'+(view===k?' active':'')} onClick={()=>setView(k)}><Icon n={ic}/>{l}</button>)}</div>)}
      <div className="side-foot"><span className="ava">관</span><div><div style={{color:'var(--n9)',fontWeight:500}}>운영 관리자</div>admin@sample-demo.kr</div></div>
    </aside>
    <main className="main" key={view}>
      {view==='main'&&<Overview toast={toast} openJob={setJob}/>}
      {view==='assets'&&<Assets toast={toast}/>}
      {view==='security'&&<Security toast={toast}/>}
      {view==='analytics'&&<Analytics toast={toast}/>}
    </main>
    {job&&<Modal onClose={()=>setJob(null)}><h3>{job.proj}</h3>
      <div style={{display:'flex',gap:8,marginBottom:14}}><span className={'badge '+ST[job.st][1]}>{ST[job.st][0]}</span><span className="badge mono">{job.id}</span><span className="badge">{job.tag}</span></div>
      <div className="two" style={{marginBottom:12,fontSize:13}}><div><div className="stat-label">요청자</div>{job.user}</div><div><div className="stat-label">진행 메모</div>{job.note}</div></div>
      <div className="code">{`job ${job.id}\nstage: ${job.st==='run'?'compose':job.st==='done'?'finished':job.st==='fail'?'retry_wait':'queued'}\nengine: external-image-api\nchannel: realtime:render_jobs`}</div>
      <div className="fld" style={{marginTop:12}}><label>처리 메모</label><input placeholder="예: 엔진 응답 회복 후 재시도"/></div>
      <div className="row-end"><button className="btn btn-secondary" onClick={()=>setJob(null)}>닫기</button><button className="btn btn-primary" onClick={()=>{toast(`${job.id} 작업을 큐 앞으로 올렸습니다`);setJob(null)}}>우선 처리</button></div></Modal>}
    <Toast msg={msg}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
