<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코치 레슨 앱 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 207°, light) ── */
:root{
  --m50:#edf5fc;--m100:#dbebf9;--m200:#b8d8f3;--m300:#8cc0eb;--m400:#5ca5e3;--m500:#2e8cdb;--m600:#0073d3;--m700:#005ead;--m800:#004a87;--m900:#00345f;
  --n0:#ffffff;--n1:#f2f5fa;--n2:#eff0f0;--n3:#e5e6e6;--n4:#d5d6d7;--n5:#b5b8ba;--n6:#909498;--n7:#71767a;--n8:#53575a;--n9:#36383a;--n10:#1e1f20;
  --s1:#1f894b;--s1-bg:#e2f3e9;--s1-text:#14713b;
  --s2:#cf3f3f;--s2-bg:#f9e7e7;--s2-text:#ad1f1f;
  --s3:#d48d11;--s3-bg:#f6f1ea;--s3-text:#8b6118;
}
/* ── 상태 레이어 ── */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m600);outline-offset:2px;}
button:not(:disabled):active{transform:scale(.97);}
button:disabled{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--n10);border-right-color:transparent;animation:spin .7s linear infinite;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m600);box-shadow:0 0 0 3px color-mix(in srgb,var(--m600) 24%,transparent);}
input[aria-invalid="true"]{border-color:var(--s2)!important;}
.num{font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:16px;line-height:1.5;letter-spacing:.013px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n9);}
svg{flex-shrink:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m600) 40%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes barGrow{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.eyebrow{font-size:12px;letter-spacing:.125em;text-transform:uppercase;font-weight:600;color:var(--n7)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:40px;font-weight:600;font-size:15px;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--m600);color:var(--n0)}
.btn-primary:hover{background:var(--m700);transform:translateY(-2px);box-shadow:rgba(24,31,56,.25) 0 14px 22px -14px}
.btn-ghost{background:var(--n0);border:1px solid var(--n4);color:var(--n9)}
.btn-ghost:hover{border-color:var(--n7);transform:translateY(-2px)}
.btn-sm{height:34px;padding:0 16px;font-size:13px}
.ripple-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);width:40px;height:40px;margin:-20px 0 0 -20px;animation:ripple .6s ease-out forwards;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.sel{background:var(--m50);color:var(--m700)}
.pill.err{background:var(--s2-bg);color:var(--s2-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--n5);display:inline-block}

/* header */
.search-header{position:sticky;top:0;z-index:40;background:var(--n0);border-bottom:1px solid var(--n3)}
.header-row{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;height:64px;padding:0 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--n10);cursor:default}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center}
.header-nav{display:flex;gap:4px;flex:1;justify-content:center}
.nav-tab{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:40px;font-size:14px;font-weight:600;color:var(--n7);transition:.2s}
.nav-tab:hover{background:var(--n2);color:var(--n9)}
.nav-tab.active{background:var(--m50);color:var(--m700)}
.user-menu{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 14px;border:1px solid var(--n4);border-radius:40px;font-size:13px;font-weight:600;position:relative}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.badge-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--m600);color:var(--n0);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.search-row{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 32px 14px}
.search-bar{display:flex;align-items:center;border:1px solid var(--n4);border-radius:40px;padding:4px 4px 4px 8px;box-shadow:rgba(24,31,56,.25) 0 25px 45px -45px;position:relative;flex-shrink:0}
.search-segment{text-align:left;padding:6px 20px;border-radius:30px;min-width:138px;transition:.15s}
.search-segment:hover{background:var(--n1)}
.segment-label{font-size:11px;font-weight:700;color:var(--n7);letter-spacing:.04em}
.segment-value{font-size:14px;color:var(--n9);font-weight:500}
.search-divider{width:1px;height:28px;background:var(--n3)}
.search-submit{width:42px;height:42px;border-radius:50%;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center;margin-left:4px}
.menu-pop{position:absolute;top:calc(100% + 8px);left:0;background:var(--n0);border-radius:16px;box-shadow:rgba(24,31,56,.25) 0 25px 45px -25px;border:1px solid var(--n3);padding:8px;min-width:190px;z-index:50;animation:scaleIn .15s}
.menu-pop button{display:block;width:100%;text-align:left;padding:9px 14px;border-radius:10px;font-size:14px}
.menu-pop button:hover{background:var(--n1)}
.menu-pop button.on{background:var(--m50);color:var(--m700);font-weight:600}
.filter-chips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px 2px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--n4);font-size:13px;font-weight:600;color:var(--n8);white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--n8)}
.chip.active{background:var(--m50);border-color:var(--m600);color:var(--m700)}
.chip.filter-toggle{margin-left:auto}

/* hero */
.hero{background:linear-gradient(120deg,var(--m50),var(--n0) 70%);border-bottom:1px solid var(--n3)}
.hero-in{max-width:1280px;margin:0 auto;padding:36px 32px 32px;display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:44px;line-height:1.16;font-weight:700;color:var(--n10);letter-spacing:-.4px;margin:10px 0 12px}
.hero h1 em{font-style:normal;color:var(--m600)}
.hero p{color:var(--n7);font-size:16px;max-width:480px}
.hero-stats{display:flex;gap:36px;margin-top:22px}
.hero-stats b{display:block;font-size:26px;color:var(--n10)}
.hero-stats span{font-size:12px;color:var(--n7)}
.hero-art{position:relative;height:210px}
.hero-card{position:absolute;background:var(--n0);border-radius:20px;box-shadow:rgba(24,31,56,.25) 0 25px 45px -35px;padding:16px 18px;font-size:13px}

main.main{max-width:1280px;margin:0 auto;padding:28px 32px 64px;width:100%}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-head h2{font-size:22px;font-weight:700;color:var(--n10)}
.sec-head span{font-size:13px;color:var(--n7)}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.listing-card{background:var(--n0);border-radius:20px;border:1px solid var(--n3);overflow:hidden;cursor:pointer;transition:.25s;animation:fadeIn .45s both}
.listing-card:hover{transform:translateY(-6px);box-shadow:rgba(24,31,56,.25) 0 25px 45px -35px;border-color:var(--n4)}
.card-image-wrap{position:relative;aspect-ratio:4/3;background:var(--n2);overflow:hidden}
.card-image-wrap svg.bg{position:absolute;inset:0;width:100%;height:100%}
.card-sport{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:20px;background:var(--n0);color:var(--n8);display:flex;align-items:center;justify-content:center;box-shadow:rgba(24,31,56,.25) 0 18px 30px -20px}
.card-favorite{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--n0);display:flex;align-items:center;justify-content:center;color:var(--n8)}
.card-favorite.on{color:var(--m600)}
.card-tag{position:absolute;left:12px;top:12px}
.card-body{padding:16px 18px 18px}
.card-row-1{display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:17px;font-weight:700;color:var(--n10)}
.card-rating{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.card-meta{font-size:13px;color:var(--n7)}
.card-row-4{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.card-price{font-size:17px;color:var(--n10)}
.price-unit{font-size:12px;color:var(--n7);margin-left:2px}
.empty{grid-column:1/-1;padding:70px 0;text-align:center;color:var(--n7)}

/* drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(30,31,32,.42);z-index:80;display:flex;justify-content:flex-end;animation:fadeIn .2s both}
.overlay.center{justify-content:center;align-items:center}
.drawer{width:440px;max-width:100%;height:100%;background:var(--n0);padding:28px;overflow-y:auto;animation:slideInRight .3s both;box-shadow:rgba(24,31,56,.25) 0 25px 45px -25px}
.modal{width:480px;max-width:92%;background:var(--n0);border-radius:20px;padding:28px;animation:scaleIn .25s both;box-shadow:rgba(24,31,56,.25) 0 25px 45px -25px}
.stepper{display:flex;align-items:center;gap:0;margin:16px 0 22px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--n7);flex:1;position:relative}
.step i{width:30px;height:30px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;z-index:1}
.step.done i{background:var(--m600);color:var(--n0)}
.step.cur i{background:var(--m50);color:var(--m700);box-shadow:0 0 0 2px var(--m600)}
.step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--n3)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--m600)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--n7);margin:14px 0 6px}
.input{width:100%;height:42px;border:1px solid var(--n4);border-radius:8px;padding:0 14px;background:var(--n0)}
textarea.input{height:auto;padding:12px 14px;line-height:1.55;resize:vertical}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 22px;border-radius:30px;font-size:14px;z-index:120;animation:fadeIn .25s both;display:flex;gap:8px;align-items:center}

/* schedule */
.sched{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.panel{background:var(--n0);border:1px solid var(--n3);border-radius:20px;padding:22px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;background:var(--n2);border-radius:30px;padding:4px}
.seg button{height:32px;padding:0 18px;border-radius:26px;font-size:13px;font-weight:600;color:var(--n7)}
.seg button.on{background:var(--n0);color:var(--n10);box-shadow:rgba(24,31,56,.25) 0 10px 16px -12px}
.week{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative}
.week .hd{text-align:center;padding:6px 0 12px;font-size:12px;color:var(--n7)}
.week .hd b{display:flex;margin:4px auto 0;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-size:16px;color:var(--n10)}
.week .hd.today b{background:var(--m600);color:var(--n0)}
.week .tm{font-size:11px;color:var(--n6);text-align:right;padding-right:8px;height:52px;transform:translateY(-8px)}
.week .col{position:relative;border-left:1px solid var(--n3)}
.week .cell{height:52px;border-top:1px solid var(--n3)}
.lesson{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 8px;background:var(--n2);border-left:4px solid var(--n6);font-size:11.5px;line-height:1.3;text-align:left;overflow:hidden;transition:.15s;animation:scaleIn .3s both}
.lesson:hover{transform:translateY(-2px);box-shadow:rgba(24,31,56,.25) 0 14px 20px -14px}
.lesson b{display:block;font-size:12px;color:var(--n10)}
.lesson.sel{background:var(--m50);border-left-color:var(--m600)}
.lesson.chg{border-left-style:dashed}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month .dow{font-size:12px;color:var(--n7);text-align:center;padding-bottom:4px}
.mcell{min-height:84px;border:1px solid var(--n3);border-radius:12px;padding:6px 8px;font-size:12px;text-align:left;transition:.15s}
.mcell:hover{border-color:var(--n7)}
.mcell.today{border-color:var(--m600);background:var(--m50)}
.mcell .mp{display:block;margin-top:3px;font-size:11px;background:var(--n2);border-radius:6px;padding:1px 6px;color:var(--n8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayline{display:flex;flex-direction:column;gap:10px}
.dayrow{display:flex;gap:16px;align-items:center;border:1px solid var(--n3);border-radius:16px;padding:14px 18px;text-align:left;transition:.15s;width:100%}
.dayrow:hover{border-color:var(--n7)}
.dayrow.sel{border-color:var(--m600);background:var(--m50)}
.att-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--n3)}
.att-btns{display:flex;gap:6px}
.att-btns button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--n4);font-size:12px;font-weight:600;color:var(--n8)}
.att-btns button.p{background:var(--s1-bg);border-color:var(--s1);color:var(--s1-text)}
.att-btns button.a{background:var(--s2-bg);border-color:var(--s2);color:var(--s2-text)}
.wk{display:flex;gap:6px;margin-top:6px}
.wk button{width:40px;height:40px;border-radius:50%;border:1px solid var(--n4);font-weight:600;font-size:13px}
.wk button.on{background:var(--m600);border-color:var(--m600);color:var(--n0)}

/* note */
.note-grid{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.rec{display:flex;flex-direction:column;align-items:center;padding:26px 22px}
.rec-btn{width:84px;height:84px;border-radius:50%;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center;margin:14px 0 8px}
.rec-btn.live{animation:pulse 1.4s infinite}
.wave{display:flex;align-items:center;gap:3px;height:48px}
.wave i{display:block;width:4px;height:100%;border-radius:2px;background:var(--m300);transform:scaleY(.2);transform-origin:center}
.wave.live i{animation:barGrow .9s ease-in-out infinite;background:var(--m600)}
.pipe{display:flex;flex-direction:column;gap:0;width:100%;margin-top:18px}
.pipe .ps{display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
.pipe .ps::before{content:"";position:absolute;left:13px;top:36px;bottom:-8px;width:2px;background:var(--n3)}
.pipe .ps:last-child::before{display:none}
.pipe .ic{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center}
.pipe .ps.done .ic{background:var(--s1-bg);color:var(--s1-text)}
.pipe .ps.run .ic{background:var(--m50);color:var(--m700)}
.pipe .ps.fail .ic{background:var(--s2-bg);color:var(--s2-text)}
.skel{background:linear-gradient(90deg,var(--n2) 0,var(--n3) 50%,var(--n2) 100%);background-size:400px 100%;animation:shimmer 1.2s infinite linear;border-radius:8px;height:14px;margin-bottom:8px}
.tabs-u{display:flex;gap:20px;border-bottom:1px solid var(--n3);margin-bottom:18px}
.tabs-u button{padding:10px 2px;font-weight:600;font-size:14px;color:var(--n7);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-u button.on{color:var(--m700);border-color:var(--m600)}
.nb{margin-bottom:14px}
.nb h4{font-size:13px;color:var(--n7);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.past{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--n3);font-size:14px}

/* guardian */
.g-grid{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--m600)}
.child{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--n3);border-radius:16px;margin-bottom:10px;transition:.2s}
.child:hover{border-color:var(--n7)}
.child.on{border-color:var(--m600);background:var(--m50)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--n7);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--n3)}
table.t td{padding:11px 6px;border-bottom:1px solid var(--n3)}
footer.footer{max-width:1280px;margin:0 auto;padding:24px 32px 40px;color:var(--n6);font-size:12px;border-top:1px solid var(--n3)}
@media (max-width:1100px){.card-grid{grid-template-columns:repeat(2,1fr)}.hero-in,.sched,.note-grid,.g-grid{grid-template-columns:1fr}.header-nav{display:none}}
</style>
</head>
<body data-archetype="airbnb-search-grid">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ───── Lucide 아이콘 (UMD iconNode → inline SVG) ───── */
function Icon({ n, s = 18, w = 2, style }) {
  const full = (lucide.icons && (lucide.icons[n] || lucide.icons.Circle)) || ['svg', {}, []];
  const node = full[2] || [];
  const inner = node.map(([t, a]) => '<' + t + ' ' + Object.entries(a).map(([k, v]) => k + '="' + v + '"').join(' ') + '/>').join('');
  return <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={w} strokeLinecap="round" strokeLinejoin="round" style={style} dangerouslySetInnerHTML={{ __html: inner }} />;
}

/* ───── 공통 ───── */
function CountUp({ to, suffix = '' }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let cur = 0; const step = Math.max(1, Math.ceil(to / 30));
    const id = setInterval(() => { cur += step; if (cur >= to) { cur = to; clearInterval(id); } setV(cur); }, 30);
    return () => clearInterval(id);
  }, [to]);
  return <span className="num">{v.toLocaleString()}{suffix}</span>;
}
function Btn({ cls = 'btn-primary', onClick, children, ...rest }) {
  const ref = useRef(null);
  const click = (e) => {
    const r = ref.current.getBoundingClientRect();
    const d = document.createElement('span'); d.className = 'ripple-dot';
    d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px';
    ref.current.appendChild(d); setTimeout(() => d.remove(), 600);
    onClick && onClick(e);
  };
  return <button ref={ref} className={'btn ' + cls} onClick={click} {...rest}>{children}</button>;
}
function Toast({ msg }) { return msg ? <div className="toast"><Icon n="Check" s={16} />{msg}</div> : null; }

        <div className="wk">{DOW.map((d, i) => <button key={d} className={days.includes(i) ? 'on' : ''} onClick={() => setDays(x => x.includes(i) ? x.filter(y => y !== i) : [...x, i])}>{d}</button>)}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <div><label className="f">시작 시간</label><select className="input" value={time} onChange={e => setTime(e.target.value)}>{[10, 14, 15, 16, 17, 18, 19, 20].map(h => <option key={h} value={h}>{fmt(h)}</option>)}</select></div>
          <div><label className="f">총 회차</label><input className="input num" type="number" min="1" max="52" value={cnt} onChange={e => setCnt(Number(e.target.value))} /></div>
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 24 }}>
          <Btn cls="btn-ghost" onClick={onClose}>취소</Btn>
          <Btn onClick={save} disabled={bad || days.length === 0}>등록하기</Btn>
        </div>
      </div>
    </div>
  );
}

          {stage >= 3 && NOTE_FIELDS.map(([k, label]) => (

          {fail && <div className="empty" style={{ padding: '50px 0' }}><Icon n="CircleAlert" s={34} /><p style={{ marginTop: 10 }}>받아쓰기 요청이 실패해 재시도 대기 중입니다.</p></div>}
          {stage >= 3 && <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 6 }}>

              {segs.map(([label, val, opts, set], i) => (
                <React.Fragment key={label}>
                  {i > 0 && <div className="search-divider" />}
                  <div style={{ position: 'relative' }}>
                    <button className="search-segment" onClick={(e) => { e.stopPropagation(); setMenu(menu === label ? null : label); }}><div className="segment-label">{label}</div><div className="segment-value">{val}</div></button>
                    {menu === label && <div onClick={e => e.stopPropagation()}><SearchMenu options={opts} value={val} onPick={set} onClose={() => setMenu(null)} /></div>}
                  </div>
                </React.Fragment>
              ))}
              <button className="search-submit" onClick={() => toast('조건에 맞는 코치를 불러왔습니다')}><Icon n="Search" s={18} /></button>
            </div>
            <div className="filter-chips" data-filter-chips>
              {SPORTS.map(s => <button key={s} className={'chip' + (sport === s ? ' active' : '')} onClick={() => setSport(s)}>{s !== '전체' && <Icon n={SPORT_ICON[s]} s={14} />}{s}</button>)}
              <div style={{ position: 'relative', marginLeft: 'auto' }}>
                <button className="chip filter-toggle" onClick={(e) => { e.stopPropagation(); setMenu(menu === 'sort' ? null : 'sort'); }}><Icon n="SlidersHorizontal" s={14} />정렬 · {sort}</button>
                {menu === 'sort' && <div onClick={e => e.stopPropagation()} style={{ position: 'absolute', right: 0, top: 0 }}><div className="menu-pop" style={{ left: 'auto', right: 0 }}>{['추천순', '평점순', '경력순', '낮은 가격순'].map(o => <button key={o} className={o === sort ? 'on' : ''} onClick={() => { setSort(o); setMenu(null); }}>{o}</button>)}</div></div>}
              </div>
            </div>
          </div>
        )}
      </header>

      {view === 'main' && <MainView {...{ sport, area, career, sort, favs, setFavs, inq }} openCoach={(c) => { setCoach(c); setMsg(''); }} />}
      {view === 'schedule' && <ScheduleView {...{ lessons, setLessons, att, setAtt, toast }} />}
      {view === 'note' && <NoteView toast={toast} />}
      {view === 'guardian' && <GuardianView toast={toast} />}

      <footer className="footer">© 2026 레슨온 샘플 — 자체 개발 프로젝트 구현 데모 · 모든 인물·수치는 가상의 예시 데이터입니다</footer>

      {coach && (
        <div className="overlay" onClick={() => setCoach(null)}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span className="pill sel">{coach.sport}</span><button onClick={() => setCoach(null)} aria-label="닫기"><Icon n="X" s={20} /></button></div>
            <h2 style={{ fontSize: 26, margin: '14px 0 4px' }}>{coach.name} 코치</h2>
            <div className="card-meta">{coach.area} · 경력 {coach.years}년 · {coach.kind} 레슨 · 평점 {coach.rating}</div>
            <div className="stepper">{INQ_STEPS.map((s, i) => { const idx = curInq ? INQ_STEPS.indexOf(curInq.status) : -1; return <div key={s} className={'step' + (i < idx ? ' done' : i === idx ? ' cur' : '')}><i>{i < idx ? <Icon n="Check" s={14} /> : i + 1}</i>{s}</div>; })}</div>
            {curInq ? (
              <div>
                <div style={{ background: 'var(--n1)', borderRadius: 16, padding: 16, fontSize: 14 }}><b>보낸 문의</b><p style={{ marginTop: 6, color: 'var(--n8)' }}>{curInq.msg || '레슨 문의'}</p></div>
                <div className="card-meta" style={{ margin: '12px 0' }}>현재 상태: <b>{curInq.status === '확정' ? '레슨 확정' : curInq.status === '회신' ? '코치 회신 도착' : '코치 회신 대기'}</b></div>
                {curInq.status !== '확정' && <Btn onClick={() => { adv(coach.id); toast(curInq.status === '문의' ? '코치 회신이 도착했습니다' : '레슨이 확정되었습니다'); }} style={{ width: '100%' }}>{curInq.status === '문의' ? '코치 회신 받기 (시연)' : '레슨 확정하기'}</Btn>}
              </div>
            ) : (
              <div>
                <label className="f">문의 내용</label>
                <textarea className="input" rows="5" placeholder="희망 요일·시간대, 수강 목적을 적어 주세요" value={msg} onChange={e => setMsg(e.target.value)} />
                <Btn onClick={send} disabled={msg.trim().length < 5} style={{ width: '100%', marginTop: 16 }}><Icon n="Send" s={16} />문의 보내기</Btn>
                <div className="card-meta" style={{ marginTop: 10 }}>로그인 없이도 코치 목록은 둘러볼 수 있고, 문의 시점에 가입 안내가 표시됩니다.</div>
              </div>
            )}
          </div>
        </div>
      )}
      {inbox && (
        <div className="overlay" onClick={() => setInbox(false)}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}><h2 style={{ fontSize: 22 }}>문의 내역</h2><button onClick={() => setInbox(false)} aria-label="닫기"><Icon n="X" s={20} /></button></div>
            {inq.map(q => { const c = COACHES.find(x => x.id === q.coachId); return (
              <div key={q.coachId} style={{ border: '1px solid var(--n3)', borderRadius: 16, padding: 16, marginTop: 14 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><b>{c.name} 코치 · {c.sport}</b><span className={'pill ' + (q.status === '확정' ? 'ok' : '')}>{q.status === '확정' ? '확정' : q.status === '회신' ? '회신 도착' : '회신 대기'}</span></div>
                <p className="card-meta" style={{ margin: '6px 0 10px' }}>{q.msg}</p>
                <Btn cls="btn-ghost btn-sm" onClick={() => { setInbox(false); setCoach(c); }}>상세 보기</Btn>
              </div>); })}
          </div>
        </div>
      )}
      <Toast msg={toastMsg} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
