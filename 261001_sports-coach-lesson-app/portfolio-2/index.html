            <path d={line} fill="none" stroke="var(--m500)" strokeWidth="2.5" strokeLinejoin="round" strokeDasharray="1200" style={{ animation: 'drawLine 1.1s ease-out both' }} />
            {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r={hover === i ? 6 : 3.5} fill="var(--n1)" stroke="var(--n10)" strokeWidth="2" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer', transition: '.12s' }} />)}
            {hover !== null && <g><rect x={Math.min(pts[hover][0] - 38, W - 90)} y={pts[hover][1] - 38} width="76" height="26" rx="6" fill="var(--n10)" /><text x={Math.min(pts[hover][0], W - 52)} y={pts[hover][1] - 21} fontSize="12" fill="var(--n0)" textAnchor="middle">{data[hover]}건</text></g>}
          </svg>
        </div>
        <div className="block" data-block-type="table" style={{ marginTop: 22 }}>
          <h2 style={{ fontSize: 20, marginBottom: 8 }}>코치별 한도 설정</h2>
          <div className="pcard"><table className="t"><thead><tr><th>코치</th><th>호출량 / 한도</th><th>추정 비용</th><th>한도 (건/월)</th><th>상태</th></tr></thead><tbody>
            {rows.map((r, i) => { const p = Math.min(100, Math.round(r.calls / r.lim * 100)); const full = r.calls >= r.lim; return (
              <tr key={r.n} style={{ animation: 'slideUp .35s both', animationDelay: i * 40 + 'ms' }}>
                <td><b>{r.n}</b></td>
                <td><div style={{ display: 'flex', alignItems: 'center', gap: 10 }}><div className="bar"><i className={full ? 'full' : p >= 80 ? 'warn' : ''} style={{ width: p + '%' }} /></div><span className="num" style={{ fontSize: 12.5 }}>{r.calls.toLocaleString()} / {r.lim.toLocaleString()}</span></div></td>
                <td className="num">₩{(r.calls * 42).toLocaleString()}</td>
                <td><div style={{ display: 'flex', gap: 6 }}><input className="limit num" value={draft[r.n] !== undefined ? draft[r.n] : r.lim} onChange={e => setDraft(d => ({ ...d, [r.n]: e.target.value.replace(/\D/g, '') }))} aria-label={r.n + ' 한도'} />
                  {draft[r.n] !== undefined && <Btn cls="btn-dark btn-sm" onClick={() => save(r.n)}>저장</Btn>}</div></td>
                <td>{full ? <span className="tag dark"><I n="pause-circle" s={13} />호출 보류</span> : p >= 80 ? <span className="tag warn">한도 임박</span> : <span className="tag ok">정상</span>}</td>
              </tr>); })}
          </tbody></table></div>
        </div>
      </div>
    </>
  );
}

/* ───── 4. 알림 규칙 관리 ───── */
const EVENTS = [
  { k: 'inq', t: '레슨 문의 접수', d: '수강생이 코치에게 문의를 보낼 때 → 코치에게 발송' },
  { k: 'rep', t: '코치 회신 도착', d: '코치가 문의에 회신했을 때 → 수강생·보호자에게 발송' },
  { k: 'cfm', t: '레슨 확정', d: '문의가 확정으로 전환될 때 → 양쪽에 발송' },
  { k: 'pre', t: '레슨 전 안내', d: '레슨 시작 전 설정한 시점에 자동 발송' },
  { k: 'note', t: '레슨노트 등록', d: '코치가 노트를 공개하면 수강생·보호자에게 발송' },
];
const LOGS0 = [
  ['16:24', '레슨 전 안내', '앱 푸시', '성공'], ['16:24', '레슨 전 안내', '이메일', '성공'], ['15:02', '레슨노트 등록', '앱 푸시', '재시도 2/3'], ['14:41', '코치 회신 도착', '이메일', '실패'], ['13:10', '레슨 확정', '앱 푸시', '성공'],
];
function AlertsView({ toast }) {
  const [on, setOn] = useState({ 'inq-push': true, 'inq-mail': false, 'rep-push': true, 'rep-mail': true, 'cfm-push': true, 'cfm-mail': true, 'pre-push': true, 'pre-mail': false, 'note-push': true, 'note-mail': true });
  const [lead, setLead] = useState('3시간 전');
  const [pv, setPv] = useState('pre');
  const [logs, setLogs] = useState(LOGS0);
  const [saved, setSaved] = useState(true);
  const [sending, setSending] = useState(false);
  const flip = (k) => { setOn(o => ({ ...o, [k]: !o[k] })); setSaved(false); };
  const ev = EVENTS.find(e => e.k === pv);
  const msgs = { inq: ['새 레슨 문의가 도착했어요', '김하준 수강생이 주 2회 레슨을 문의했습니다.'], rep: ['코치 회신이 도착했어요', '한도윤 코치가 가능한 시간대를 안내했습니다.'], cfm: ['레슨이 확정되었어요', '매주 수요일 18:00 레슨이 확정되었습니다.'], pre: ['레슨 ' + lead + ' 안내', '오늘 18:00 성인 입문반 · 코트 2번'], note: ['새 레슨노트가 등록되었어요', '오늘 레슨 내용과 다음 과제를 확인해 보세요.'] };
  const test = () => { setSending(true); setTimeout(() => { setSending(false); setLogs(l => [['16:45', ev.t + ' (테스트)', on[pv + '-push'] ? '앱 푸시' : '이메일', '성공'], ...l]); toast('테스트 알림을 발송 대기열에 넣었습니다'); }, 900); };
  const retry = (i) => { setLogs(l => l.map((x, j) => j === i ? [x[0], x[1], x[2], '성공'] : x)); toast('재시도 후 발송 성공'); };
  return (
    <>
      <Crumb path={['레슨온 관리', '알림', '알림 규칙 관리']} />
      <div className="page-body">
        <div className="prose">
          <span className="page-icon-large"><I n="bell-ringing" s={44} /></span>
          <h1 className="page-title">알림 규칙</h1>
          <div className="block" data-block-type="quote"><p style={{ borderLeft: '3px solid var(--n10)', paddingLeft: 14 }}>이벤트마다 앱 푸시와 이메일을 따로 켜고 끌 수 있습니다. 발송은 대기열에서 처리되고 채널별로 재시도됩니다.</p></div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 320px', gap: 24, alignItems: 'start', marginTop: 14 }}>
          <div className="pcard" style={{ padding: '8px 20px' }}>
            <div className="rule" style={{ borderBottom: '1px solid var(--n4)', padding: '8px 4px' }}><span className="eyebrow" style={{ fontSize: 12, fontWeight: 700, color: 'var(--n7)' }}>이벤트</span><span style={{ fontSize: 12, fontWeight: 700, color: 'var(--n7)' }}>앱 푸시</span><span style={{ fontSize: 12, fontWeight: 700, color: 'var(--n7)' }}>이메일</span></div>
            {EVENTS.map((e, i) => (
              <div className="rule" key={e.k} style={{ animation: 'slideUp .35s both', animationDelay: i * 50 + 'ms' }}>
                <button onClick={() => setPv(e.k)} style={{ display: 'block' }}><b style={{ display: 'flex', alignItems: 'center', gap: 8 }}>{e.t}{pv === e.k && <span className="tag sel">미리보기</span>}</b><span className="sub">{e.d}</span>
                  {e.k === 'pre' && <select className="field" style={{ width: 130, height: 30, marginTop: 8 }} value={lead} onClick={ev2 => ev2.stopPropagation()} onChange={x => { setLead(x.target.value); setSaved(false); }}>{['1일 전', '3시간 전', '1시간 전'].map(o => <option key={o}>{o}</option>)}</select>}</button>
                <div className="swwrap"><button role="switch" aria-checked={on[e.k + '-push']} className={'sw' + (on[e.k + '-push'] ? ' on' : '')} onClick={() => flip(e.k + '-push')} aria-label={e.t + ' 앱 푸시'} />{on[e.k + '-push'] ? '켜짐' : '꺼짐'}</div>
                <div className="swwrap"><button role="switch" aria-checked={on[e.k + '-mail']} className={'sw' + (on[e.k + '-mail'] ? ' on' : '')} onClick={() => flip(e.k + '-mail')} aria-label={e.t + ' 이메일'} />{on[e.k + '-mail'] ? '켜짐' : '꺼짐'}</div>
              </div>
            ))}
            <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: 12, padding: '16px 0 10px' }}>
              <span style={{ fontSize: 13, color: 'var(--n7)' }}>{saved ? '모든 변경이 저장되었습니다' : '저장하지 않은 변경이 있습니다'}</span>
              <Btn onClick={() => { setSaved(true); toast('알림 규칙을 저장했습니다 — 대기열에 즉시 반영'); }} disabled={saved}>규칙 저장</Btn>
            </div>
          </div>
          <div>
            <div className="eyebrow" style={{ fontSize: 12, fontWeight: 700, color: 'var(--n7)', marginBottom: 8 }}>규칙 미리보기 · {ev.t}</div>
            <div className="push" key={pv + lead}><span className="avatar" style={{ borderRadius: 10, background: 'var(--n10)', color: 'var(--n0)' }}><I n="trophy" s={16} /></span><div><b style={{ fontSize: 14 }}>{msgs[pv][0]}</b><div style={{ fontSize: 13, color: 'var(--n8)' }}>{msgs[pv][1]}</div><small style={{ color: 'var(--n7)' }}>레슨온 · 방금</small></div></div>
            <div style={{ display: 'flex', gap: 6, margin: '12px 0' }}>{on[pv + '-push'] ? <span className="tag ok">앱 푸시 켜짐</span> : <span className="tag">앱 푸시 꺼짐</span>}{on[pv + '-mail'] ? <span className="tag ok">이메일 켜짐</span> : <span className="tag">이메일 꺼짐</span>}</div>
            {sending && <><div className="skel" style={{ width: '80%', marginBottom: 8 }} /><div className="skel" style={{ width: '55%' }} /></>}
            <Btn cls="btn-line btn-sm" onClick={test} data-loading={sending ? 'true' : 'false'} style={{ marginTop: 6 }}><I n="paper-plane-tilt" s={14} />테스트 발송</Btn>
          </div>
        </div>
        <div className="block" data-block-type="table" style={{ marginTop: 28 }}>
          <h2 style={{ fontSize: 20, marginBottom: 8 }}>발송 로그</h2>
          <div className="pcard"><table className="t"><thead><tr><th>시각</th><th>이벤트</th><th>채널</th><th>상태</th><th /></tr></thead><tbody>
            {logs.map((l, i) => <tr key={i} style={i === 0 ? { animation: 'slideUp .35s both' } : undefined}><td className="num">{l[0]}</td><td>{l[1]}</td><td>{l[2]}</td><td><span className={'tag ' + (l[3] === '성공' ? 'ok' : l[3] === '실패' ? 'dark' : 'warn')}>{l[3]}</span></td><td style={{ textAlign: 'right' }}>{l[3] !== '성공' && <Btn cls="btn-line btn-sm" onClick={() => retry(i)}>재시도</Btn>}</td></tr>)}
          </tbody></table></div>
        </div>
      </div>
    </>
  );
}

/* ───── 셸 ───── */
const TREE = [
  { id: 'main', label: '관리자 대시보드', ic: 'squares-four', depth: 0 },
  { id: 'g1', label: '코치 운영', ic: 'folder-simple', depth: 0, kids: [{ id: 'review', label: '코치 심사·승인', ic: 'seal-check' }, { id: 'prof', label: '코치 프로필 공개 설정', ic: 'identification-card' }] },
  { id: 'g2', label: '회원·보호자', ic: 'folder-simple', depth: 0, kids: [{ id: 'minor', label: '미성년 동의 현황', ic: 'shield-check' }, { id: 'terms', label: '약관·동의 이력', ic: 'scroll' }] },
  { id: 'g3', label: 'AI 운영', ic: 'folder-simple', depth: 0, kids: [{ id: 'usage', label: 'AI 호출량·비용 관리', ic: 'chart-line-up' }] },
  { id: 'g4', label: '알림', ic: 'folder-simple', depth: 0, kids: [{ id: 'alerts', label: '알림 규칙 관리', ic: 'bell-ringing' }] },
];
function App() {
  const [view, setView] = useState('main');
  const [openG, setOpenG] = useState({ g1: true, g2: false, g3: true, g4: true });
  const [toastMsg, setToastMsg] = useState('');
  const tt = useRef(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(tt.current); tt.current = setTimeout(() => setToastMsg(''), 2600); };
  useEffect(() => { window.scrollTo(0, 0); }, [view]);
  const go = (id) => { if (['main', 'review', 'usage', 'alerts'].includes(id)) setView(id); else { setView('main'); toast('이 화면은 데모 범위 밖입니다 — 대시보드로 이동합니다'); } };
  return (
    <div className="shell">
      <aside className="sidebar tree-sidebar" data-tree-sidebar style={{ width: 248 }}>
        <div className="sidebar-brand"><span className="ws-mark"><I n="trophy" s={16} /></span>레슨온 관리 콘솔<I n="caret-down" s={13} style={{ marginLeft: 'auto', color: 'var(--n7)' }} /></div>
        <div className="sidebar-search">
          <button className="sbtn" onClick={() => toast('검색은 Cmd+K 팔레트로 연결할 예정입니다')}><I n="magnifying-glass" s={16} />검색</button>
          <button className="sbtn" onClick={() => toast('새 페이지 템플릿을 불러옵니다')}><I n="plus-circle" s={16} />새 페이지</button>
        </div>
        <nav className="tree-nav">
          <div className="tree-label-h">워크스페이스</div>
          {TREE.map(n => (
            <div key={n.id}>
              <div className={'tree-item' + (view === n.id ? ' active' : '')} style={{ paddingLeft: 8 }}>
                {n.kids ? <button className="tree-toggle" onClick={() => setOpenG(o => ({ ...o, [n.id]: !o[n.id] }))} aria-label="펼치기"><I n={openG[n.id] ? 'caret-down' : 'caret-right'} s={11} /></button> : <span style={{ width: 18 }} />}
                <button style={{ display: 'flex', alignItems: 'center', gap: 6, flex: 1, height: '100%' }} onClick={() => n.kids ? setOpenG(o => ({ ...o, [n.id]: !o[n.id] })) : go(n.id)}><span className="ic"><I n={n.ic} s={17} /></span><span>{n.label}</span></button>
              </div>
              {n.kids && openG[n.id] && n.kids.map(k => (
                <button key={k.id} className={'tree-item' + (view === k.id ? ' active' : '')} style={{ paddingLeft: 36 }} onClick={() => go(k.id)}><span className="ic"><I n={k.ic} s={17} /></span><span>{k.label}</span></button>
              ))}
            </div>
          ))}
          <div className="tree-label-h">즐겨찾기</div>
          <button className="tree-item" style={{ paddingLeft: 56 }} onClick={() => go('review')}><span className="ic"><I n="star" s={15} /></span><span>대기 중 심사</span><span className="tree-count">3</span></button>
        </nav>
        <div className="sidebar-footer">
          <button className="sbtn" onClick={() => toast('휴지통은 30일간 보관하는 구조로 설계합니다')}><I n="trash" s={16} />휴지통</button>
          <button className="sbtn" onClick={() => toast('권한·감사 로그 설정 화면은 확장 범위입니다')}><I n="gear" s={16} />설정</button>
        </div>
      </aside>
      <div className="main-wrap">
        {view === 'main' && <DashboardView toast={toast} />}
        {view === 'review' && <ReviewView toast={toast} />}
        {view === 'usage' && <UsageView toast={toast} />}
        {view === 'alerts' && <AlertsView toast={toast} />}
        <div className="block" data-block-type="divider" style={{ maxWidth: 880, margin: '0 auto', padding: '0 40px 40px' }}><hr className="divider" /><div style={{ fontSize: 12, color: 'var(--n6)' }}>© 2026 레슨온 샘플 — 자체 개발 프로젝트 구현 데모 · 모든 인물·수치는 가상의 예시 데이터입니다</div></div>
      </div>
      {toastMsg && <div className="toast"><I n="check-circle" s={16} fill />{toastMsg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
