<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크롤링·AI 매칭 통합 CRM — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#e8e6ff;
  --m100:#d2cdff;
  --m200:#b7aeff;
  --m300:#988cff;
  --m400:#7b6cff;
  --m500:#5e4cff;
  --m600:#4d3ed1;
  --m700:#3c31a3;
  --m800:#2a2273;
  --m900:#2a2273;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f6f8fa;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#a4abb8;
  --n6:#909098;
  --n7:#72717a;
  --n8:#54535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:14px;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:14px;color:var(--n9)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s1) 45%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes drawLine{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}

.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:16px 12px;z-index:5}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--n7)}
.env-select{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--n3);background:var(--n0);border-radius:8px;padding:8px 12px;margin:0 0 24px;font-size:12px;color:var(--n8)}
.env-select:hover{background:var(--n2)}
.sidebar-section-title{font-size:12px;color:var(--n7);font-weight:600;padding:0 12px 8px;letter-spacing:.02em}
.sidebar-section{margin-bottom:24px}
.sidebar-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;color:var(--n8);font-weight:500;position:relative;transition:background .15s,color .15s}
.sidebar-link svg{color:var(--n7);flex-shrink:0}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.active{background:var(--m50);color:var(--n10);font-weight:700;box-shadow:inset 3px 0 0 var(--m600)}
.sidebar-link.active svg{color:var(--m600)}
.sidebar-link .cnt{margin-left:auto;font-size:12px;color:var(--n7);background:var(--n2);border-radius:99px;padding:0 8px}
.sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px 0;border-top:1px solid var(--n3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n8);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}

.main{margin-left:240px;width:calc(100% - 240px);min-width:0;min-height:100vh;flex:1;padding:24px 32px 48px;background-image:radial-gradient(var(--n3) 1px,transparent 1px);background-size:16px 16px;background-position:-8px -8px}
.page-header{margin-bottom:24px;animation:rise .4s both}
.page-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.page-title{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em;color:var(--n10)}
.page-meta{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--n7);font-size:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--s1);animation:pulse 2s infinite}
.page-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-weight:600;border:1px solid var(--n4);background:var(--n0);color:var(--n9);transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--n1);border-color:var(--n5)}
.btn-primary{background:var(--m600);border-color:var(--m600);color:var(--n0)}
.btn-primary:hover:not(:disabled){background:var(--m700);border-color:var(--m700)}
.btn-sm{height:32px;padding:0 12px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--n8)}
.pixel-cluster{display:grid;grid-template-columns:repeat(5,8px);grid-auto-rows:8px;gap:0;opacity:.9}
.pixel-cluster i{display:block}

.card{background:var(--n0);border:1px solid var(--n3);border-radius:12px;box-shadow:0 1px 2px rgba(30,30,32,.04);animation:rise .45s both}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-bottom:16px}
.hero-card{padding:24px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--n0) 55%,var(--m50) 140%)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:16px}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--n10)}
.card-sub{font-size:12px;color:var(--n7);margin-top:2px}
.seg{display:inline-flex;background:var(--n2);border-radius:8px;padding:4px;gap:4px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--n7)}
.seg button.on{background:var(--n0);color:var(--n10);box-shadow:0 1px 2px rgba(30,30,32,.1)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--n8);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-wrap{position:relative;height:260px}
.bar{transform-origin:bottom;animation:barGrow .6s cubic-bezier(.2,.8,.2,1) both}
.stat-col{display:flex;flex-direction:column;gap:16px}
.stat-card{padding:16px 20px;display:flex;flex-direction:column;gap:4px;position:relative;cursor:pointer;transition:border-color .15s,transform .15s}
.stat-card:hover{border-color:var(--n5);transform:translateY(-2px)}
.stat-label{font-size:12px;color:var(--n7);font-weight:600}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--n10);line-height:1.2}
.stat-value small{font-size:14px;font-weight:500;color:var(--n7);margin-left:4px}
.stat-delta{font-size:12px;color:var(--n7)}
.stat-delta.positive{color:var(--n8)}
.stat-delta.negative{color:var(--n8)}
.stat-sparkline{position:absolute;right:16px;bottom:16px;width:80px;height:32px}

.data-section{margin-bottom:16px;animation:rise .5s both}
.tab-bar{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--n3)}
.tab{padding:16px 0 12px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--n9)}
.tab.active{color:var(--n10);border-bottom-color:var(--m600)}
.data-toolbar{display:flex;gap:8px;align-items:center;padding:16px 24px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);border-radius:8px;padding:0 12px;height:32px;background:var(--n0);width:280px;color:var(--n7)}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:12px}
.search:focus-within{border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb,var(--m500) 20%,transparent)}
.filter-chip{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--n4);font-size:12px;font-weight:600;color:var(--n8);background:var(--n0)}
.filter-chip:hover{background:var(--n1)}
.filter-chip.on{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.spacer{flex:1}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:12px;font-weight:600;color:var(--n7);text-align:left;padding:8px 24px;background:var(--n1);border-top:1px solid var(--n3);border-bottom:1px solid var(--n3)}
.data-table td{padding:0 24px;height:48px;border-bottom:1px solid var(--n3);color:var(--n8)}
.data-table tr.row{cursor:pointer;transition:background .12s}
.data-table tr.row:hover{background:var(--n1)}
.data-table tr.sel{background:var(--m50)}
.data-table td.num,.data-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;color:var(--n8)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.err{background:var(--s2-bg);color:var(--s2-text)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.widget-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.widget{padding:20px 24px}
.hbar{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--n8)}
.hbar .track{flex:1;height:8px;background:var(--n2);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;background:var(--n6);border-radius:99px;transform-origin:left;animation:fadeIn .6s both}
.hbar .fill.main{background:var(--m500)}
.timeline-row{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.timeline-row .dot{width:8px;height:8px;border-radius:50%;background:var(--n5);margin-top:6px;flex-shrink:0}
.timeline-row .dot.next{background:var(--m500)}
.switch{width:36px;height:20px;border-radius:99px;background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--n0);transition:transform .2s}
.switch.on{background:var(--m500)}
.switch.on::after{transform:translateX(16px)}
.sched-row{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--n3)}
.sched-row .grow{flex:1}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .2s both}
.modal{width:480px;max-width:92vw;background:var(--n0);border-radius:12px;padding:24px;box-shadow:0 20px 48px rgba(30,30,32,.2);animation:rise .25s both}
.drawer-wrap{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 30%,transparent);z-index:50;display:flex;justify-content:flex-end;animation:fadeIn .2s both}
.drawer{width:440px;max-width:94vw;height:100%;background:var(--n0);border-left:1px solid var(--n3);padding:24px;overflow:auto;animation:slideIn .28s both}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.field select,.field input{height:40px;border:1px solid var(--n4);border-radius:8px;padding:0 12px;background:var(--n0)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--n10);color:var(--n0);padding:12px 16px;border-radius:8px;display:flex;gap:12px;align-items:center;z-index:80;animation:rise .3s both;box-shadow:0 8px 24px rgba(30,30,32,.25)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--n7);font-size:12px;padding-top:2px}
.kv dd{color:var(--n9)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.queue-chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.q-chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--n3);background:var(--n0);border-radius:12px;font-weight:600;color:var(--n8);transition:border-color .15s}
.q-chip:hover{border-color:var(--n5)}
.q-chip.on{border-color:var(--m600);background:var(--m50);color:var(--n10)}
.rawtext{padding:16px;background:var(--n1);border:1px solid var(--n3);border-radius:8px;line-height:1.9;font-size:14px;color:var(--n8);white-space:pre-wrap}
.mask{background:var(--n10);color:var(--n10);border-radius:4px;padding:0 4px;cursor:pointer;user-select:none;transition:all .2s}
.mask.show{background:var(--n3);color:var(--n9)}
.hl{background:var(--n2);border-radius:4px;padding:0 2px;color:var(--m800)}
.conf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n7)}
.conf .track{width:56px;height:4px;background:var(--n3);border-radius:99px;overflow:hidden}
.conf .fill{height:100%;background:var(--n7)}
.field-row{display:grid;grid-template-columns:96px 1fr 88px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--n3)}
.field-row .k{font-size:12px;color:var(--n7);font-weight:600}
.field-row input{height:32px;border:1px solid transparent;border-radius:6px;padding:0 8px;background:transparent;width:100%}
.field-row input:hover{border-color:var(--n4)}
.compare{display:grid;grid-template-columns:96px 1fr 1fr;font-size:14px}
.compare>div{padding:12px 16px;border-bottom:1px solid var(--n3)}
.compare .h{font-size:12px;font-weight:600;color:var(--n7);background:var(--n1)}
.compare .diff{background:var(--m50)}
.score-ring{width:56px;height:56px;flex-shrink:0}
.room-card{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--n3);cursor:pointer;transition:background .12s}
.room-card:hover{background:var(--n1)}
.room-card.sel{background:var(--m50)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.chip.must{background:var(--n10);color:var(--n0)}
.note-box{border:1px solid var(--n3);border-radius:8px;padding:16px;background:var(--n1);font-size:14px;line-height:1.7;margin-bottom:12px}
.note-box h4{font-size:12px;color:var(--n7);margin-bottom:4px}
.hist{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:12px;color:var(--n8);border-bottom:1px solid var(--n3)}
.screen{animation:fadeIn .3s both}
</style>
</head>

function Spark({pts, main}) {
  const w = 80, h = 32, mx = Math.max(...pts), mn = Math.min(...pts);
  const xy = pts.map((v, i) => [i * (w - 4) / (pts.length - 1) + 2, h - 4 - (v - mn) / (mx - mn || 1) * (h - 8)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return (
    <svg className="stat-sparkline" viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <path d={d} fill="none" style={{stroke: main ? 'var(--m500)' : 'var(--n6)', strokeWidth: 1.75, strokeLinecap:'round', strokeDasharray:300, ['--len']:300, animation:'drawLine 1.1s ease both'}} />
    </svg>
  );
}

function HeroChart({days}) {
  const W = 760, H = 260, pl = 36, pb = 28, pt = 8;
  const mx = 280, bw = (W - pl) / days.length;
  const y = v => H - pb - v / mx * (H - pb - pt);
  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="none" role="img" aria-label="일별 수집 건수 추이">
        {[0, 70, 140, 210, 280].map(t => (
          <g key={t}><line x1={pl} x2={W} y1={y(t)} y2={y(t)} style={{stroke:'var(--n3)', strokeDasharray: t ? '3 4' : '0'}} /><text x={pl - 8} y={y(t) + 4} textAnchor="end" style={{fontSize:11, fill:'var(--n7)'}}>{t}</text></g>
        ))}
        {days.map((d, i) => {
          const x = pl + i * bw + bw * 0.22, w = bw * 0.56;
          return (
            <g key={d.d}>
              <rect className="bar" x={x} y={y(d.a)} width={w} height={y(0) - y(d.a)} rx="2" style={{fill:'var(--m500)', animationDelay: i * 40 + 'ms'}} />
              <rect className="bar" x={x} y={y(d.a + d.b)} width={w} height={y(d.a) - y(d.a + d.b)} rx="2" style={{fill:'var(--n4)', animationDelay: i * 40 + 'ms'}} />
              {d.f >= 4 && <circle cx={x + w / 2} cy={y(d.a + d.b) - 10} r="4" style={{fill:'var(--s2)'}} />}
              <text x={x + w / 2} y={H - 8} textAnchor="middle" style={{fontSize:11, fill:'var(--n7)'}}>{i % 2 === 0 ? d.d : ''}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function Donut({v, main}) {

  return (
    <svg className="score-ring" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r={r} fill="none" style={{stroke:'var(--n3)', strokeWidth:6}} />
      <circle cx="28" cy="28" r={r} fill="none" transform="rotate(-90 28 28)" style={{stroke: main ? 'var(--m500)' : 'var(--n7)', strokeWidth:6, strokeLinecap:'round', strokeDasharray: c, strokeDashoffset: c * (1 - v / 100), transition:'stroke-dashoffset .6s'}} />

    </svg>
  );
}

        </section>
        <section className="card" style={{padding:24}}>
          <div className="card-head"><div><div className="card-title">기존 데이터와 비교</div><div className="card-sub">{cur.why} · 대조 대상 {cur.base}</div></div></div>
          <div className="compare"><div className="h">항목</div><div className="h">신규 건</div><div className="h">기존 건</div>
            {cur.fields.map(([k, a, b]) => <React.Fragment key={k}><div style={{color:'var(--n7)', fontSize:12}}>{k}</div><div className={a !== b ? 'diff' : ''}>{a}</div><div className={a !== b ? 'diff' : ''}>{b}</div></React.Fragment>)}</div>
          <div style={{display:'flex', gap:8, marginTop:24, flexWrap:'wrap'}}>
            <button className="btn btn-primary" disabled={cur.state !== '검토 대기'} onClick={() => act([cur.id], '승인')}><Icon n="check" />신규 등록하기</button>
            <button className="btn" disabled={cur.state !== '검토 대기'} onClick={() => act([cur.id], '병합')}><Icon n="merge" />기존 건에 병합하기</button>
            <button className="btn" disabled={cur.state !== '검토 대기'} onClick={() => act([cur.id], '반려')}><Icon n="ban" />중복으로 반려하기</button>
          </div>
          <div style={{marginTop:24}}><div className="card-title" style={{marginBottom:8}}>처리 이력</div>
            {hist.slice(0, 5).map((h, k) => <div className="hist" key={k}><Icon n="clock" s={14} /><span className="mono">{h.t}</span><span>{h.m}</span></div>)}</div>
        </section>
      </div>
    </div>
  );
}

function Matching({toast}) {
  const [g, setG] = useState(0);
  const [r, setR] = useState(0);
  const [busy, setBusy] = useState(false);
  const [dec, setDec] = useState({});
  const guest = GUESTS[g], room = guest.rooms[Math.min(r, guest.rooms.length - 1)];
  const key = guest.id + room.id;
  const recalc = () => { setBusy(true); setTimeout(() => { setBusy(false); toast(guest.name + ' 님의 적합도를 다시 계산했습니다'); }, 1300); };
  const decide = d => { setDec({...dec, [key]: d}); toast(room.t + ' · ' + d + ' 결정을 매칭 이력에 저장했습니다'); };
  return (
    <div className="screen">
      <header className="page-header"><div className="page-title-row"><div>
        <h1 className="page-title">게스트-방 적합도 매칭</h1>
        <div className="page-meta"><Icon n="bolt" s={14} />필수 조건 충족 여부로 먼저 거르고, 선호 조건 가중합으로 점수를 계산합니다. 추천 사유는 AI가 문장으로 정리합니다.</div></div>
        <div className="page-actions"><button className="btn btn-primary" data-loading={busy ? 'true' : 'false'} disabled={busy} onClick={recalc}><Icon n="refresh" />적합도 다시 계산하기</button></div></div></header>
      <div className="queue-chips">{GUESTS.map((x, k) => <button key={x.id} className={'q-chip' + (k === g ? ' on' : '')} onClick={() => { setG(k); setR(0); }}><span className="avatar" style={{width:24, height:24}}>{x.name[0]}</span>{x.name}<span className="badge">{x.id}</span></button>)}</div>
      <div className="split" style={{gridTemplateColumns:'minmax(0,1fr) minmax(0,1.2fr)'}}>
        <div style={{display:'flex', flexDirection:'column', gap:16}}>
          <section className="card" style={{padding:24}}>
            <div className="card-title">게스트 조건 규격화</div><div className="card-sub" style={{marginBottom:12}}>자유 서술을 필수·선호 조건으로 나눈 결과입니다</div>
            <div className="note-box" style={{fontSize:14}}><h4>원문</h4>{guest.raw}</div>
            <div className="card-sub" style={{marginBottom:8}}>필수 조건</div><div className="chips" style={{marginBottom:16}}>{guest.must.map(c => <span key={c} className="chip must">{c}</span>)}</div>
            <div className="card-sub" style={{marginBottom:8}}>선호 조건</div><div className="chips">{guest.pref.map(c => <span key={c} className="chip">{c}</span>)}</div>
          </section>
          <section className="card" style={{padding:24}}>
            <div className="card-title" style={{marginBottom:8}}>매칭 이력</div>
            {Object.keys(dec).length === 0 && <div className="card-sub">아직 저장된 결정이 없어요. 방을 고르고 선택·보류·제외 중 하나를 눌러 주세요.</div>}
            {Object.entries(dec).map(([k, d]) => <div className="hist" key={k}><span className={'badge' + (d === '선택' ? ' ok' : '')}>{d}</span><span>{k.slice(0, 5)} → {k.slice(5)}</span></div>)}
          </section>
        </div>
        <section className="card" style={{overflow:'hidden'}}>
          <div className="data-toolbar"><div className="card-title">추천 방 {guest.rooms.length}곳</div><span className="spacer" /><span className="card-sub">점수 높은 순</span></div>
          {guest.rooms.map((x, k) => (
            <div key={x.id} className={'room-card' + (k === r ? ' sel' : '')} onClick={() => setR(k)}>
              <Donut v={x.score} main={k === 0} />
              <div style={{flex:1, minWidth:0}}><div style={{fontWeight:600, color:'var(--n10)'}}>{x.t}</div><div className="card-sub">{x.id} · 월 {x.rent}</div>
                <div className="chips" style={{marginTop:8}}>{x.ok.map(c => <span key={c} className="chip">{c}</span>)}{x.no.map(c => <span key={c} className="badge err">{c}</span>)}</div></div>
              {dec[guest.id + x.id] && <span className="badge">{dec[guest.id + x.id]}</span>}
            </div>))}
          <div style={{padding:24}}>
            <div className="note-box"><h4>AI 추천 요약</h4>{room.sum}</div>
            <div className="note-box" style={{marginBottom:16}}><h4>주의점</h4>{room.warn}</div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn-primary" onClick={() => decide('선택')}><Icon n="check" />이 방으로 선택하기</button>
              <button className="btn" onClick={() => decide('보류')}><Icon n="pause" />보류하기</button>
              <button className="btn" onClick={() => decide('제외')}><Icon n="ban" />제외하기</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}

const NAV = [
  ['수집', [['크롤링 수집 현황 관제', 'radar', 'main'], ['AI 구조화·마스킹 검수', 'scan', 'extract'], ['중복 확인·검토 승인 큐', 'copy', 'review']]],
  ['매칭', [['게스트-방 적합도 매칭', 'spark', 'matching']]]
];

function App() {
  const [screen, setScreen] = useState('main');
  const [msg, setMsg] = useState('');
  const toast = m => { setMsg(m); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(''), 2600); };
  const Screen = {main: Monitor, extract: Extract, review: Review, matching: Matching}[screen];
  return (
    <div data-archetype="stripe-multipane" style={{width:'100%', minHeight:'100vh', display:'flex'}}>
      <aside className="sidebar" data-sidebar>
        <div className="sidebar-brand"><div className="brand-mark"><Icon n="db" s={18} /></div><div><div className="brand-name">하우스링크 CRM</div><div className="brand-sub">자체 개발 프로젝트</div></div></div>
        <button className="env-select" onClick={() => toast('운영 환경과 시험 환경을 전환할 수 있어요')}><span>환경 · 운영 서버</span><Icon n="down" s={14} /></button>
        {NAV.map(([g, items]) => (
          <div className="sidebar-section" key={g}><div className="sidebar-section-title">{g}</div>
            {items.map(([label, ic, key]) => <button key={key} className={'sidebar-link' + (screen === key ? ' active' : '')} onClick={() => setScreen(key)}><Icon n={ic} />{label}</button>)}
          </div>))}
        <div className="sidebar-foot"><span className="avatar">최</span><div><div style={{fontWeight:600, fontSize:12}}>최서연 운영자</div><div className="brand-sub">관리자 권한</div></div></div>
      </aside>
      <main className="main"><Screen key={screen} toast={toast} /></main>
      <Toast msg={msg} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
