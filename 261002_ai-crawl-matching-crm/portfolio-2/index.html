:root{

  --m50:#efefef;
  --m100:#efefef;
  --m200:#efefef;
  --m300:#dfdfdf;
  --m400:#bebfbf;
  --m500:#979899;
  --m600:#6b6c6e;
  --m700:#414245;
  --m800:#17191c;
  --m900:#131517;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#777b86;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}

.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:14px;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n9)}
.serif{font-family:'Noto Serif KR','Pretendard',serif;font-weight:400;letter-spacing:-.02em}
@keyframes rise{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise2{from{transform:scaleY(.1);opacity:.4}to{transform:scaleY(1);opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}

.app{display:flex;width:100%;height:100vh;background:var(--n0)}
.workspace-strip{width:64px;flex-shrink:0;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px}

.ws-bottom{margin-top:auto}

.channel-search{margin:12px 16px;display:flex;align-items:center;gap:8px;background:var(--n0);border:1px solid var(--n3);border-radius:20px;padding:0 12px;height:36px;color:var(--n7)}

.section-title{padding:12px 20px 4px;font-size:12px;font-weight:600;color:var(--n7);letter-spacing:.04em}
.channel-item{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px;padding:0 12px;height:40px;border-radius:12px;text-align:left;color:var(--n8);font-weight:500;transition:background .12s}
.channel-item i{font-size:18px;color:var(--n7)}

.list-scroll{flex:1;overflow:auto;padding-bottom:16px}
.dm-item{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px;padding:8px 12px;border-radius:12px;text-align:left;transition:background .12s}

.dm-item.active{background:var(--n0);box-shadow:inset 0 0 0 1px var(--n4)}
.dm-main{flex:1;min-width:0}

.presence.away{background:var(--s3)}
.channel-unread{font-size:12px;font-weight:600;background:var(--n2);color:var(--n8);border-radius:99px;padding:0 8px}

.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0)}

.conv-actions{display:flex;gap:8px}
.conv-action{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--n4);font-weight:600;display:inline-flex;align-items:center;gap:8px;background:var(--n0);transition:background .15s}

.kpi{background:var(--n1);border-radius:24px;padding:24px;animation:rise .4s both}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--n4)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--n0);border:2px solid var(--n5)}

.bars{display:flex;align-items:flex-end;gap:16px;height:180px;padding-top:8px}

.info-panel{width:320px;flex-shrink:0;border-left:1px solid var(--n3);background:var(--n0);overflow:auto;animation:slideIn .3s both}

.field{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.field label{font-size:12px;font-weight:600;color:var(--n8)}

.empty{padding:48px 16px;text-align:center;color:var(--n7)}

        {MODS.map(([k, t, ic]) => <button key={k} className={'ws-item' + (screen === k ? ' active' : '')} title={t} aria-label={t} onClick={() => { setScreen(k); setQ(''); }}><i className={'ti ' + ic} /></button>)}
        <div className="ws-divider" />
        <button className="ws-item" title="운영 알림" aria-label="운영 알림" onClick={() => toast('새 운영 알림이 없어요')}><i className="ti ti-bell" /></button>
        <button className="ws-item ws-bottom" title="계정" aria-label="계정" onClick={() => toast('최서연 운영자 · 관리자 권한')}><i className="ti ti-user-circle" /></button>
      </nav>
      <aside className="channel-list" data-channel-list>
        <header className="channel-header"><h2 className="ws-name">하우스링크 CRM</h2><div className="ws-sub">자체 개발 프로젝트 · 운영 콘솔</div></header>
        <div className="channel-search"><i className="ti ti-search" /><input placeholder={secTitle + ' 검색'} value={q} onChange={e => setQ(e.target.value)} /></div>
        <div className="section-title">운영 모듈</div>
        {MODS.map(([k, t, ic]) => <button key={k} className={'channel-item' + (screen === k ? ' active' : '')} onClick={() => { setScreen(k); setQ(''); }}><i className={'ti ' + ic} /><span>{t}</span></button>)}
        <div className="section-title" style={{marginTop:8}}>{secTitle} ({list.length})</div>
        <div className="list-scroll">
          {list.map(x => (
            <button key={x.id} className={'dm-item' + (sel[screen] === x.id ? ' active' : '')} onClick={() => pick(x.id)}>
              <span className={'presence ' + (x.presence || '')} /><div className="dm-main"><div className="dm-name">{x.name}</div><div className="dm-sub">{x.sub}</div></div>
              {x.un > 0 && <span className="channel-unread">{x.un}</span>}
            </button>))}
          {list.length === 0 && <div className="empty">검색 결과가 아직 없어요.</div>}
        </div>
      </aside>
      <main className="conv-main">
        <header className="conv-header">
          <div className="conv-title-row"><span className="conv-prefix">#</span><h2 className="conv-title">{curMod[1]}</h2><span className="member-count">{list.length}</span></div>
          <div className="conv-actions">
            <button className="conv-action" onClick={() => toast('현재 화면을 운영 고정 목록에 추가했습니다')}><i className="ti ti-pin" />고정하기</button>
            <button className="conv-action icon toggle-info" aria-label="정보 패널 전환" onClick={() => setInfo(!info)}><i className="ti ti-info-circle" /></button>
          </div>
        </header>
        <div className="conv-body" key={screen + sel[screen]}>
          {screen === 'main' && <Hosts sel={sel.main} setSel={pick} hosts={hosts} setHosts={setHosts} toast={toast} />}
          {screen === 'contract' && <Contract sel={sel.contract} toast={toast} />}
          {screen === 'dashboard' && <Dash sel={sel.dashboard} toast={toast} />}
          {screen === 'backup' && <Backup sel={sel.backup} toast={toast} backups={backups} setBackups={setBackups} />}
        </div>
        <footer className="conv-input">
          <input className="msg-input" placeholder={curMod[1] + '에 운영 메모 남기기…'} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === 'Enter' && post()} />
          <button className="conv-action solid" onClick={post}><i className="ti ti-send" />메모 남기기</button>
        </footer>
      </main>
      {info && <aside className="info-panel" data-info-panel>
        <header className="info-header"><h3>상세 정보</h3><button className="conv-action icon close-info" aria-label="닫기" onClick={() => setInfo(false)}><i className="ti ti-x" /></button></header>
        <div className="info-section"><div className="info-label">{screen === 'main' ? '호스트 요약' : screen === 'contract' ? '계약 요약' : screen === 'dashboard' ? '집계 안내' : '보관 정책'}</div>
          <div className="info-value">
            {screen === 'main' && <>{curHost.name}<div className="dm-sub">담당 {curHost.mgr} · 연락처는 마스킹되어 저장됩니다</div></>}
            {screen === 'contract' && <>{curCon.id} · {curCon.room}<div className="dm-sub mono">월 {curCon.rent}만원 · {curCon.term}</div></>}
            {screen === 'dashboard' && <>월별 집계는 읽기 전용 뷰와 캐시로 제공됩니다<div className="dm-sub">원천 데이터가 바뀌면 캐시를 무효화합니다</div></>}
            {screen === 'backup' && <>자동 백업은 매일 새벽 3시에 실행됩니다<div className="dm-sub">복구는 관리자 권한만 가능해요</div></>}
          </div></div>
        <div className="info-section"><div className="info-label">운영 메모 ({memos.length})</div>
          {memos.map((m, i) => <div className="memo" key={i}><b>{m.w} · {m.t}</b>{m.m}</div>)}</div>
        <div className="info-section"><div className="info-label">담당 운영자</div>
          {['최서연', '박지훈'].map(n => <div className="r-row" key={n} style={{padding:0}}><span className="presence online" /><span className="grow" style={{fontWeight:600}}>{n}</span><span className="dm-sub">운영 관리자</span></div>)}</div>
      </aside>}
      <Toast msg={msg} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
