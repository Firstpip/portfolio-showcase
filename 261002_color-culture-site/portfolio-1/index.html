<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컬러결 — 컬러 문화 사전·갤러리 맞춤 구현 데모</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 0°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#efefef;
  --m100:#efefef;
  --m200:#efefef;
  --m300:#dfdfdf;
  --m400:#bfbfbf;
  --m500:#989898;
  --m600:#6c6c6c;
  --m700:#424242;
  --m800:#191919;
  --m900:#151515;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f7f4ed;
  --n1:#ffffff;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d5d5;
  --n5:#bab5b5;
  --n6:#989090;
  --n7:#7a7171;
  --n8:#333333;
  --n9:#3a3636;
  --n10:#242424;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 0°와 0° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */
/* ⚠ primary #191919가 거의 무채색(채도 0%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.serif{font-family:'Noto Serif KR','Pretendard',serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* nav */
.topnav{position:sticky;top:0;z-index:30;background:var(--n0);border-bottom:1px solid var(--n10)}
.topnav .in{display:flex;align-items:center;gap:32px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Noto Serif KR',serif;font-weight:600;font-size:22px;letter-spacing:-.04em}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:4px;flex:1}
.nav button{padding:8px 14px;font-size:14px;color:var(--n8);border-radius:4px;transition:background .2s}
.nav button:hover{background:var(--n2)}
.nav button.on{color:var(--n10);font-weight:600;box-shadow:inset 0 -2px 0 var(--m800);border-radius:0}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--m800);color:var(--n1);border-radius:999px;padding:12px 24px;font-size:14px;font-weight:600;position:relative;overflow:hidden;transition:transform .2s,background .2s}
.pill:hover{background:var(--n10)}
.pill.ghost{background:transparent;color:var(--n10);border:1px solid var(--n10)}
.pill.ghost:hover{background:var(--n2)}
.pill svg,.pill i{width:16px;height:16px}
.ripple-dot{position:absolute;border-radius:50%;background:var(--n1);opacity:.35;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reveal{animation:slideUp .6s cubic-bezier(.2,.7,.2,1) both}
.view{animation:fadeIn .35s ease both}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding:72px 0 56px;border-bottom:1px solid var(--n10)}
.hero h1{font-family:'Noto Serif KR',serif;font-weight:400;font-size:clamp(46px,7vw,92px);line-height:1.08;letter-spacing:-.055em;margin-bottom:28px}
.hero p{font-size:20px;color:var(--n8);max-width:520px;margin-bottom:32px;line-height:1.6}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;aspect-ratio:1/1;max-height:460px}
.hero-art svg{width:100%;height:100%}
.float{animation:floatY 6s ease-in-out infinite;transform-origin:center}
/* home body */
.home-body{display:grid;grid-template-columns:220px 1fr;gap:48px;padding:48px 0 80px}
.rail h4{font-size:12px;letter-spacing:.12em;color:var(--n7);text-transform:uppercase;margin:0 0 12px}
.rail .grp{margin-bottom:32px}
.rail button{display:flex;width:100%;justify-content:space-between;padding:9px 0;font-size:15px;color:var(--n8);border-bottom:1px solid var(--n3);text-align:left}
.rail button.on{color:var(--n10);font-weight:600}
.rail button:hover{color:var(--n10)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border:1px solid var(--n4);border-radius:999px;font-size:13px;color:var(--n8)}
.tag.on{background:var(--m800);color:var(--n1);border-color:var(--m800)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}
.sec-h h2{font-family:'Noto Serif KR',serif;font-weight:400;font-size:32px;letter-spacing:-.04em}
.sec-h span{font-size:14px;color:var(--n7)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px}
.card{text-align:left;background:var(--n1);border:1px solid var(--n3);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(25,25,25,.06);transition:transform .25s,box-shadow .25s;display:block;width:100%}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(25,25,25,.1)}
.card .th{aspect-ratio:4/3;background:var(--n2);border-bottom:1px solid var(--n3)}
.card .th svg{width:100%;height:100%;display:block}
.card .bd{padding:18px 18px 22px}
.card .cat{font-size:12px;color:var(--n7);letter-spacing:.06em;margin-bottom:8px}
.card h3{font-family:'Noto Serif KR',serif;font-weight:600;font-size:19px;line-height:1.4;letter-spacing:-.03em;margin-bottom:8px}
.card p{font-size:14px;color:var(--n8)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(25,25,25,.4);z-index:50;animation:fadeIn .25s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--n0);z-index:60;padding:36px;overflow:auto;animation:slideInRight .35s cubic-bezier(.2,.7,.2,1) both;border-left:1px solid var(--n10)}
.drawer h3{font-family:'Noto Serif KR',serif;font-weight:400;font-size:30px;line-height:1.3;letter-spacing:-.04em;margin:16px 0}
.x{position:absolute;top:18px;right:18px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.x:hover{background:var(--n2)}
/* page shell */
.page{padding:56px 0 96px}
.page h1{font-family:'Noto Serif KR',serif;font-weight:400;font-size:clamp(40px,5.4vw,64px);letter-spacing:-.05em;line-height:1.12;margin-bottom:12px}
.page .lead{font-size:18px;color:var(--n8);margin-bottom:36px;max-width:640px}
/* search */
.sbox{display:flex;align-items:center;gap:12px;border:1px solid var(--n10);background:var(--n1);border-radius:4px;padding:6px 8px 6px 18px;max-width:640px}
.sbox input{flex:1;border:none;background:transparent;font-size:18px;padding:12px 0;outline:none}
.sugg{max-width:640px;border:1px solid var(--n4);border-top:none;background:var(--n1);animation:fadeIn .2s both}
.sugg button{display:flex;width:100%;justify-content:space-between;padding:12px 18px;font-size:15px;text-align:left}
.sugg button:hover{background:var(--n2)}
.res{display:grid;grid-template-columns:340px 1fr;gap:48px;margin-top:48px;animation:slideUp .5s both}
.swatch{aspect-ratio:1/1;border-radius:4px;border:1px solid var(--n10);display:flex;align-items:flex-end;padding:18px;color:var(--n1);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--n10);border-radius:999px;overflow:hidden;margin:20px 0 12px}
.seg button{padding:8px 18px;font-size:13px}
.seg button.on{background:var(--m800);color:var(--n1)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:-.02em}
.rel{margin-top:32px;border-top:1px solid var(--n10)}
.rel a,.rel button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--n3);font-size:16px;text-align:left}
.rel button:hover{padding-left:8px}
.rel button{transition:padding .2s}
/* wizard */
.steps{display:flex;gap:8px;margin-bottom:36px}
.steps i{display:block;height:4px;flex:1;background:var(--n4);border-radius:2px;position:relative;overflow:hidden;font-style:normal}
.steps i.on::after{content:"";position:absolute;inset:0;background:var(--m800);transform-origin:left;animation:barGrow .6s both}
.q{font-family:'Noto Serif KR',serif;font-size:clamp(28px,3.6vw,44px);letter-spacing:-.045em;line-height:1.25;margin-bottom:28px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.opt{text-align:left;padding:22px;border:1px solid var(--n4);background:var(--n1);border-radius:4px;transition:border-color .2s,transform .2s;animation:slideUp .5s both}
.opt:hover{border-color:var(--n10);transform:translateY(-3px)}
.opt b{display:block;font-size:18px;margin-bottom:6px}
.opt span{font-size:14px;color:var(--n7)}
/* gallery */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.masonry{columns:4 220px;column-gap:20px}
.tile{break-inside:avoid;margin-bottom:20px;display:block;width:100%;text-align:left;position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--n3);animation:slideUp .5s both}
.tile .art{display:block;width:100%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(25,25,25,.7));color:var(--n1);font-size:14px;opacity:0;transition:opacity .25s}
.tile:hover .cap{opacity:1}
.tile:hover{transform:scale(1.02)}.tile{transition:transform .25s}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px}
.modal .box{background:var(--n1);border:1px solid var(--n10);border-radius:4px;max-width:880px;width:100%;display:grid;grid-template-columns:1.3fr 1fr;animation:slideUp .35s both;position:relative}
.modal .box .pic{min-height:360px}
.modal .box .tx{padding:36px}
/* post */
.article{max-width:720px;margin:0 auto}
.article h1{font-size:clamp(36px,4.6vw,56px)}
.article p{font-family:'Noto Serif KR',serif;font-size:18px;line-height:2;margin-bottom:22px;color:var(--n9)}
.article blockquote{border-left:3px solid var(--n10);padding:6px 0 6px 22px;margin:32px 0;font-family:'Noto Serif KR',serif;font-size:24px;line-height:1.6;letter-spacing:-.03em}
.meta{display:flex;gap:16px;font-size:14px;color:var(--n7);margin-bottom:32px;align-items:center}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:14px 22px;border-radius:999px;font-size:14px;z-index:90;animation:slideUp .3s both;display:flex;gap:8px;align-items:center}
footer{border-top:1px solid var(--n10);padding:36px 0;font-size:14px;color:var(--n7)}
footer .in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:900px){
 .wrap{padding:0 20px}
 .hero{grid-template-columns:1fr;padding:40px 0}
 .hero-art{max-height:260px}
 .home-body{grid-template-columns:1fr;gap:24px}
 .res{grid-template-columns:1fr;gap:28px}
 .modal .box{grid-template-columns:1fr}
 .topnav .in{gap:12px;height:60px}
 .nav{overflow-x:auto}
 .nav button{white-space:nowrap;padding:8px 10px}
}
@media(max-width:560px){.brand span{display:none}}
</style>

function toHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));const x=v=>Math.round(255*v).toString(16).padStart(2,'0');return ('#'+x(f(0))+x(f(8))+x(f(4))).toUpperCase();}
function toRgb(h,s,l){const hx=toHex(h,s,l);return `rgb(${parseInt(hx.slice(1,3),16)}, ${parseInt(hx.slice(3,5),16)}, ${parseInt(hx.slice(5,7),16)})`;}

function Ripple({className,onClick,children,...rest}){
  const [dots,setDots]=useState([]);
  const go=e=>{const r=e.currentTarget.getBoundingClientRect();const d={id:Date.now(),x:e.clientX-r.left-10,y:e.clientY-r.top-10};setDots(a=>[...a,d]);setTimeout(()=>setDots(a=>a.filter(z=>z.id!==d.id)),650);onClick&&onClick(e);};
  return <button className={className} onClick={go} {...rest}>{children}{dots.map(d=><span key={d.id} className="ripple-dot" style={{left:d.x,top:d.y,width:20,height:20}}/>)}</button>;
}

function Art({i,small}){

  return (

    {v===2&&<><rect x="60" y="40" width="170" height="220" fill="var(--n10)"/><rect x="200" y="90" width="140" height="170" fill="var(--n4)"/><circle cx="290" cy="70" r="30" fill="var(--n8)"/></>}
    {v===3&&<>{[0,1,2,3,4,5].map(k=><path key={k} d={`M0 ${60+k*36} Q100 ${20+k*36} 200 ${60+k*36} T400 ${60+k*36}`} stroke={k%2?'var(--n7)':'var(--n10)'} strokeWidth="6" fill="none"/>)}</>}
    {v===4&&<><circle cx="200" cy="150" r="120" fill="var(--n3)"/><circle cx="200" cy="150" r="80" fill="var(--n6)"/><circle cx="200" cy="150" r="40" fill="var(--n10)"/></>}
    {v===5&&<>{Array.from({length:20}).map((_,k)=><rect key={k} x={(k%5)*80+10} y={Math.floor(k/5)*70+14} width="64" height="56" fill={['var(--n10)','var(--n5)','var(--n8)','var(--n3)'][(k*7)%4]}/>)}</>}

/* ── 컬러 사전 검색 ── */
function Search({toast}){
  const [q,setQ]=useState('인디고');
  const [sel,setSel]=useState(COLORS[1]);
  const [fmt,setFmt]=useState('HEX');
  const [focus,setFocus]=useState(false);
  const m=q.trim()?COLORS.filter(c=>c.word.includes(q.trim())||c.en.toLowerCase().includes(q.trim().toLowerCase())):COLORS;
  const code=fmt==='HEX'?toHex(sel.h,sel.s,sel.l):fmt==='RGB'?toRgb(sel.h,sel.s,sel.l):hsl(sel.h,sel.s,sel.l);
  return (<div className="view wrap page">
   <h1>컬러 사전</h1>
   <p className="lead">낱말을 입력하면 색 견본, 코드 값, 설명과 연관 자료를 한 화면에서 보여주는 검색 구조를 제안합니다.</p>
   <div className="sbox">
    <Ic n="search" s={20}/>
    <input value={q} onFocus={()=>setFocus(true)} onBlur={()=>setTimeout(()=>setFocus(false),150)} onChange={e=>setQ(e.target.value)} placeholder="색 이름을 입력하세요 (예: 버밀리언)" aria-label="컬러 검색"/>
    {q&&<button onClick={()=>setQ('')} aria-label="지우기" style={{width:36,height:36,display:'grid',placeItems:'center'}}><Ic n="x" s={16}/></button>}
   </div>
   {focus&&m.length>0&&<div className="sugg">{m.map(c=><button key={c.id} onMouseDown={()=>{setSel(c);setQ(c.word);}}><span>{c.word} <span style={{color:'var(--n7)'}}>{c.en}</span></span><span style={{color:'var(--n7)'}}>{c.tone}</span></button>)}</div>}
   {m.length===0?<p style={{marginTop:40,color:'var(--n7)'}}>검색 결과가 없습니다. 다른 낱말로 찾아보세요.</p>:
   <div className="res" key={sel.id}>
    <div>
     <div className="swatch" style={{background:hsl(sel.h,sel.s,sel.l)}}>{sel.en}</div>
     <div className="seg">{['HEX','RGB','HSL'].map(f=><button key={f} className={fmt===f?'on':''} onClick={()=>setFmt(f)}>{f}</button>)}</div>
     <div className="code num">{code}</div>
     <button className="pill ghost" style={{marginTop:16}} onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(code).catch(()=>{});toast('색 코드를 복사했습니다');}}><Ic n="copy" s={16}/>코드 복사</button>
    </div>
    <div>
     <div style={{fontSize:13,color:'var(--n7)',letterSpacing:'.1em'}}>{sel.tone}</div>
     <h2 className="serif" style={{fontSize:44,fontWeight:400,letterSpacing:'-.05em',margin:'6px 0 16px'}}>{sel.word}</h2>
     <p style={{fontSize:17,color:'var(--n9)',maxWidth:560}}>{sel.desc}</p>
     <div className="rel">
      <div style={{fontSize:13,letterSpacing:'.1em',color:'var(--n7)',padding:'18px 0 6px'}}>연관 자료</div>
      {sel.rel.map(r=><button key={r} onClick={()=>toast('외부 링크로 이동하는 예시입니다')}><span>{r}</span><Ic n="external-link" s={16}/></button>)}
     </div>
    </div>
   </div>}
  </div>);
}

/* ── 나의 컬러 찾기 ── */
function Wizard({go}){
  const [a1,setA1]=useState(null);
  const [a2,setA2]=useState(null);
  const step=a2?3:a1?2:1;
  const res=a2?COLORS.find(c=>c.id===a2.r):null;
  return (<div className="view wrap page">
   <h1>나의 컬러 찾기</h1>

   <div className="steps"><i className="on"/><i className={step>=2?'on':''}/><i className={step>=3?'on':''}/></div>
   {step===1&&<div key="s1"><div className="q">오늘 어떤 기분에 가까운가요?</div>
    <div className="opts">{Q1.map((o,i)=><button key={o.k} className="opt" style={{animationDelay:`${i*.06}s`}} onClick={()=>setA1(o)}><b>{o.t}</b><span>{o.d}</span></button>)}</div></div>}
   {step===2&&<div key="s2"><div className="q">{a1.t}에 어울리는 장면을 골라 주세요</div>
    <div className="opts">{Q2[a1.k].map((o,i)=><button key={o.t} className="opt" style={{animationDelay:`${i*.06}s`}} onClick={()=>setA2(o)}><b>{o.t}</b></button>)}</div>
    <button className="pill ghost" style={{marginTop:28}} onClick={()=>setA1(null)}><Ic n="arrow-left" s={16}/>이전 질문</button></div>}
   {step===3&&<div key="s3" className="res">
    <div><div className="swatch" style={{background:hsl(res.h,res.s,res.l)}}>{res.en}</div></div>
    <div>
     <div style={{fontSize:13,color:'var(--n7)',letterSpacing:'.1em'}}>{a1.t} · {a2.t}</div>
     <h2 className="serif" style={{fontSize:48,fontWeight:400,letterSpacing:'-.05em',margin:'6px 0 16px'}}>오늘의 색은 {res.word}</h2>
     <p style={{fontSize:17,color:'var(--n9)',maxWidth:540,marginBottom:16}}>{res.desc}</p>
     <div className="code num" style={{marginBottom:28}}>{toHex(res.h,res.s,res.l)}</div>
     <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
      <Ripple className="pill" onClick={()=>go('search')}>사전에서 더 보기</Ripple>
      <Ripple className="pill ghost" onClick={()=>{setA1(null);setA2(null);}}>다시 찾기</Ripple>
     </div>
    </div>
   </div>}
  </div>);
}

   {view==='search'&&<Search toast={toast}/>}
   {view==='wizard'&&<Wizard go={go}/>}
   {view==='gallery'&&<Gallery/>}
   {view==='post'&&<Post toast={toast}/>}
   <footer><div className="wrap in"><span>© 컬러결 샘플 — 자체 개발 프로젝트 (구현 데모)</span><span>샘플 콘텐츠와 가상 데이터로 구성된 화면입니다</span></div></footer>
   <Toast msg={msg}/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
