<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컬러결 관리자 — 콘텐츠 통합 CMS 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 30°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#f2f1f1;
  --m100:#f2f1f1;
  --m200:#f2f1f1;
  --m300:#e4e3e3;
  --m400:#cac8c6;
  --m500:#a9a6a4;
  --m600:#85817d;
  --m700:#625d59;
  --m800:#403a34;
  --m900:#34302b;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f6f1eb;
  --n1:#f6f1eb;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d6d5;
  --n5:#bab8b5;
  --n6:#989490;
  --n7:#7a7571;
  --n8:#333333;
  --n9:#3a3836;
  --n10:#201f1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
}
/* ⚠ s3(경고/주의) — 메인 hue 30°와 8° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */
/* ⚠ primary #403a34가 거의 무채색(채도 10%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--m800);line-height:1.5;font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
.num{font-variant-numeric:tabular-nums}
i.ph,i.ph-bold{font-size:16px;vertical-align:-3px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ripple{to{transform:scale(3);opacity:0}}
.app{display:grid;grid-template-columns:208px 1fr;height:100vh;overflow:hidden}
/* sidebar */
.side{border-right:1px solid var(--m800);display:flex;flex-direction:column;background:var(--n0)}
.side .logo{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--m800);font-weight:700;font-size:15px;letter-spacing:-.02em}
.side .logo small{font-weight:400;font-size:11px;color:var(--n7);margin-left:auto;border:1px solid var(--m800);padding:0 5px}
.side nav{padding:8px 0;flex:1}
.side .lb{font-size:10px;letter-spacing:.14em;color:var(--n7);padding:12px 16px 4px}
.side nav button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 16px;text-align:left;border-left:3px solid transparent;transition:background .15s}
.side nav button:hover{background:var(--n2)}
.side nav button.on{background:var(--m800);color:var(--n0);border-left-color:var(--m800)}
.side .me{border-top:1px solid var(--m800);padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:12px}
.av{width:28px;height:28px;border:1px solid var(--m800);display:grid;place-items:center;font-weight:700;font-size:11px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar{height:52px;border-bottom:1px solid var(--m800);display:flex;align-items:center;gap:12px;padding:0 20px;flex:none}
.bar h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--m800);padding:6px 12px;font-weight:600;position:relative;overflow:hidden;background:var(--n0);transition:background .15s}
.btn:hover{background:var(--n2)}
.btn.pri{background:var(--m800);color:var(--n0)}
.btn.pri:hover{background:var(--n10)}
.btn.sm{padding:3px 8px;font-size:12px}
.rp{position:absolute;width:20px;height:20px;border-radius:50%!important;background:var(--n0);opacity:.4;animation:ripple .55s ease-out forwards;pointer-events:none}
.scroll{flex:1;overflow:auto}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--m800);padding:0 6px;font-size:11px;font-weight:600}
.badge.ok{border-color:var(--s1);color:var(--s1-text);background:var(--s1-bg)}
.badge.dk{background:var(--m800);color:var(--n0)}
.badge.er{border-color:var(--s2);color:var(--s2-text);background:var(--s2-bg)}
/* editor 3 pane */
.ed{display:grid;grid-template-columns:230px 1fr 260px;height:100%;min-height:0}
.pane{border-right:1px solid var(--m800);overflow:auto;min-height:0}
.pane:last-child{border-right:none;border-left:1px solid var(--m800)}
.ph-t{padding:8px 14px;border-bottom:1px solid var(--m800);font-size:10px;letter-spacing:.14em;color:var(--n7);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--n0);z-index:2}
.blk{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--n4);width:100%;text-align:left;animation:slideUp .35s both}
.blk.on{background:var(--n2);box-shadow:inset 3px 0 0 var(--m800)}
.blk:hover{background:var(--n2)}
.blk .gr{color:var(--n6);cursor:grab}
.cv{background:var(--n2);padding:28px;overflow:auto;min-height:0}
.dh{max-width:620px;margin:0 auto 18px;border:1px solid var(--m800);display:grid;grid-template-columns:1fr 150px;background:linear-gradient(135deg,var(--n0) 0%,var(--n2) 100%);animation:slideUp .5s both}
.dh h2{font-size:clamp(40px,5vw,64px);font-weight:300;letter-spacing:-.06em;line-height:.95;padding:20px 22px;text-transform:uppercase}
.dh h2 small{display:block;font-size:11px;letter-spacing:.2em;font-weight:600;margin-top:12px}
.dh svg{width:100%;height:100%;border-left:1px solid var(--m800)}
.paper{max-width:620px;margin:0 auto;background:var(--n0);border:1px solid var(--m800)}
.paper .sel{outline:2px solid var(--m800);outline-offset:-2px;background:var(--n2)}
.pb{padding:18px 26px;border-bottom:1px dashed var(--n5);cursor:pointer;transition:background .15s}
.pb:hover{background:var(--n2)}
.pb h2{font-size:38px;letter-spacing:-.04em;line-height:1.3}
.pb p{font-size:14px;line-height:1.8;color:var(--n9)}
.pic{height:150px;border:1px solid var(--m800);background:repeating-linear-gradient(135deg,var(--n3) 0 8px,var(--n0) 8px 16px);display:grid;place-items:center;color:var(--n7)}
.fld{padding:12px 14px;border-bottom:1px solid var(--n4)}
.fld label{display:block;font-size:11px;font-weight:600;margin-bottom:6px;color:var(--n8)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--m800);padding:6px 8px;background:var(--n0)}
.saved{font-size:12px;color:var(--n7);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;background:var(--s1);border-radius:50%!important;animation:pulse 1.6s infinite}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-align:left;letter-spacing:.06em;color:var(--n7);padding:8px 14px;border-bottom:1px solid var(--m800);position:sticky;top:0;background:var(--n0)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--n4)}
.tbl tr.row{cursor:pointer;animation:slideUp .35s both}
.tbl tr.row:hover td{background:var(--n2)}
.tbl tr.row.on td{background:var(--n2);box-shadow:inset 0 0 0 0 var(--m800)}
.sw{display:inline-block;width:18px;height:18px;border:1px solid var(--m800);vertical-align:-5px;margin-right:8px}
.two{display:grid;grid-template-columns:1fr 340px;height:100%;min-height:0}
.csv{border:1px dashed var(--m800);padding:14px;margin:14px;display:flex;gap:10px;align-items:center}
.prog{height:6px;border:1px solid var(--m800);margin-top:6px}
.prog i{display:block;height:100%;background:var(--m800);transform-origin:left;animation:barGrow 1s both}
/* flow */
.flow{background:var(--n2);padding:24px;overflow:auto;position:relative;min-height:0;background-image:radial-gradient(var(--n5) 1px,transparent 1px);background-size:18px 18px}
.node{position:absolute;width:176px;border:1px solid var(--m800);background:var(--n0);cursor:pointer;transition:transform .15s;animation:slideUp .4s both}
.node:hover{transform:translateY(-2px)}
.node.on{outline:2px solid var(--m800);outline-offset:2px}
.node .nh{padding:5px 10px;border-bottom:1px solid var(--m800);font-size:10px;letter-spacing:.1em;font-weight:700;background:var(--m800);color:var(--n0)}
.node .nb{padding:8px 10px;font-size:12px}
.node.res .nh{background:var(--n0);color:var(--m800)}
/* gallery */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;padding:16px}
.gi{border:1px solid var(--m800);background:var(--n0);text-align:left;animation:slideUp .35s both;position:relative}
.gi .im{aspect-ratio:1/1;border-bottom:1px solid var(--m800)}
.gi .tt{padding:6px 8px;font-size:12px}
.gi.up{border-style:dashed;display:grid;place-items:center;aspect-ratio:1/1;color:var(--n7)}
.gi .ck{position:absolute;top:6px;left:6px;width:18px;height:18px;border:1px solid var(--m800);background:var(--n0);display:grid;place-items:center}
.gi .ck.on{background:var(--m800);color:var(--n0)}
.skel{background:linear-gradient(90deg,var(--n3) 25%,var(--n2) 50%,var(--n3) 75%);background-size:400px 100%;animation:shimmer 1.4s infinite linear}
/* handover */
.hd{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--m800)}
.hd>div{padding:20px;border-right:1px solid var(--m800)}
.hd>div:last-child{border-right:none}
.ck-l{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--n4);width:100%;text-align:left}
.box{width:16px;height:16px;border:1px solid var(--m800);flex:none;display:grid;place-items:center;margin-top:2px}
.box.on{background:var(--m800);color:var(--n0)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--m800);color:var(--n0);padding:10px 16px;z-index:90;animation:slideUp .3s both;display:flex;gap:8px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(32,31,30,.45);display:grid;place-items:center;z-index:80;animation:fadeIn .2s both}
.modal .mb{background:var(--n0);border:1px solid var(--m800);width:min(440px,92%);animation:slideUp .3s both}
.modal .mb h3{padding:12px 16px;border-bottom:1px solid var(--m800);font-size:14px}
.modal .mb .c{padding:16px;line-height:1.7}
.modal .mb .f{padding:10px 16px;border-top:1px solid var(--m800);display:flex;justify-content:flex-end;gap:8px}
@media(max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh;overflow:visible}
 .side{border-right:none;border-bottom:1px solid var(--m800)}
 .side nav{display:flex;overflow-x:auto;padding:0}
 .side nav button{white-space:nowrap;width:auto;border-left:none;border-bottom:3px solid transparent}
 .side nav button.on{border-bottom-color:var(--n0)}
 .side .lb,.side .me{display:none}
 .ed,.two{grid-template-columns:1fr;height:auto}
 .pane{border-right:none;border-bottom:1px solid var(--m800)}
 .hd{grid-template-columns:1fr}
 .hd>div{border-right:none;border-bottom:1px solid var(--m800)}
 .flow{min-height:520px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const hsl=(h,s,l)=>`hsl(${h} ${s}% ${l}%)`;
const P=({n,b})=><i className={(b?'ph-bold ph-':'ph ph-')+n}/>;

function Btn({cls='',onClick,children,...r}){
  const [d,setD]=useState([]);
  const go=e=>{const b=e.currentTarget.getBoundingClientRect();const x={id:Date.now()+Math.random(),l:e.clientX-b.left-10,t:e.clientY-b.top-10};setD(a=>[...a,x]);setTimeout(()=>setD(a=>a.filter(z=>z.id!==x.id)),600);onClick&&onClick(e);};
  return <button className={'btn '+cls} onClick={go} {...r}>{children}{d.map(x=><span key={x.id} className="rp" style={{left:x.l,top:x.t}}/>)}</button>;
}

const DICT=[
 {id:1,w:'버밀리언',en:'Vermilion',h:12,s:78,l:50,st:'공개',up:'10.01'},
 {id:2,w:'인디고',en:'Indigo',h:232,s:46,l:32,st:'공개',up:'09.30'},
 {id:3,w:'세이지',en:'Sage',h:96,s:18,l:56,st:'공개',up:'09.28'},
 {id:4,w:'오커',en:'Ochre',h:38,s:70,l:46,st:'초안',up:'09.27'},
 {id:5,w:'라일락',en:'Lilac',h:272,s:42,l:72,st:'공개',up:'09.25'},
 {id:6,w:'틸',en:'Teal',h:178,s:60,l:30,st:'초안',up:'09.24'},
 {id:7,w:'테라코타',en:'Terracotta',h:16,s:48,l:48,st:'공개',up:'09.22'}
];
const hex=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));const x=v=>Math.round(255*v).toString(16).padStart(2,'0');return('#'+x(f(0))+x(f(8))+x(f(4))).toUpperCase();};

/* ── 페이지 복제 콘텐츠 에디터 (main) ── */
function Editor({toast}){
  const [blocks,setBlocks]=useState([
   {id:1,t:'heading',lb:'제목 블록',v:'붉은 안료가 걸어온 길'},
   {id:2,t:'image',lb:'이미지 블록',v:'대표 이미지'},
   {id:3,t:'text',lb:'본문 블록 1',v:'광물을 곱게 갈아 아교에 개어 쓰던 시절의 이야기를 소개합니다.'},
   {id:4,t:'video',lb:'영상 블록',v:'안료 제작 영상'},
   {id:5,t:'text',lb:'본문 블록 2',v:'오늘 사전에 오른 색 이름의 유래를 정리합니다.'}
  ]);
  const [sel,setSel]=useState(1);
  const [cloned,setCloned]=useState(false);
  const [status,setStatus]=useState('임시 저장');
  const cur=blocks.find(b=>b.id===sel)||blocks[0];
  const upd=v=>{setBlocks(bs=>bs.map(b=>b.id===cur.id?{...b,v}:b));setStatus('저장 중');setTimeout(()=>setStatus('임시 저장'),700);};
  const move=(id,d)=>setBlocks(bs=>{const i=bs.findIndex(b=>b.id===id);const j=i+d;if(j<0||j>=bs.length)return bs;const a=[...bs];[a[i],a[j]]=[a[j],a[i]];return a;});
  const add=()=>{const id=Date.now();setBlocks(b=>[...b,{id,t:'text',lb:'본문 블록 '+(b.filter(x=>x.t==='text').length+1),v:'새 본문 내용을 입력하세요.'}]);setSel(id);toast('본문 블록을 추가했습니다');};
  const clone=()=>{setBlocks(bs=>bs.map(b=>({...b,v:b.t==='heading'?'새 글 제목을 입력하세요':b.t==='text'?'':b.v})));setCloned(true);setSel(1);toast('기존 페이지를 복제했습니다 · 레이아웃은 유지됩니다');};
  const icon={heading:'text-h',image:'image',text:'text-align-left',video:'play-circle'};
  return (<>
   <div className="bar"><h1>페이지 복제 콘텐츠 에디터</h1><span className="badge">{cloned?'복제본':'원본'}</span>
    <span className="saved"><span className="dot"/>{status}</span><span className="sp"/>
    <Btn onClick={clone}><P n="copy"/>페이지 복제</Btn>
    <Btn cls="pri" onClick={()=>toast('발행 전 검토 단계로 이동합니다')}><P n="paper-plane-tilt"/>발행</Btn></div>
   <div className="ed">
    <div className="pane"><div className="ph-t"><span>블록 트리</span><button className="btn sm" onClick={add}><P n="plus"/>추가</button></div>
     {blocks.map((b,i)=><button key={b.id} className={'blk'+(sel===b.id?' on':'')} style={{animationDelay:`${i*.05}s`}} onClick={()=>setSel(b.id)}>
      <span className="gr"><P n="dots-six-vertical"/></span><P n={icon[b.t]}/><span style={{flex:1}}>{b.lb}</span>
      <span onClick={e=>{e.stopPropagation();move(b.id,-1);}} role="button" tabIndex={0} aria-label="위로"><P n="caret-up"/></span>
      <span onClick={e=>{e.stopPropagation();move(b.id,1);}} role="button" tabIndex={0} aria-label="아래로"><P n="caret-down"/></span></button>)}
    </div>
    <div className="cv"><div className="dh"><h2>Atelier<small>PAGE CLONE WORKBENCH · 블록 {blocks.length}개</small></h2>
     <svg viewBox="0 0 150 120" aria-hidden="true"><rect width="150" height="120" fill="var(--n2)"/><circle cx="75" cy="60" r="46" fill="none" stroke="var(--m800)" strokeWidth="1"/><circle cx="75" cy="60" r="30" fill="var(--m700)"/><path d="M0 100 H150 M0 80 H150" stroke="var(--m800)" strokeWidth=".6"/></svg></div><div className="paper" style={{borderRadius:0}}>
     {blocks.map(b=><div key={b.id} className={'pb'+(sel===b.id?' sel':'')} onClick={()=>setSel(b.id)}>
      {b.t==='heading'&&<h2>{b.v}</h2>}
      {b.t==='text'&&<p>{b.v||'내용을 입력하세요'}</p>}
      {b.t==='image'&&<div className="pic"><span><P n="image" b/> {b.v}</span></div>}
      {b.t==='video'&&<div className="pic"><span><P n="play-circle" b/> {b.v}</span></div>}
     </div>)}
    </div></div>
    <div className="pane"><div className="ph-t"><span>속성</span></div>
     <div className="fld"><label>블록 종류</label><input value={cur.lb} readOnly/></div>
     <div className="fld"><label>내용</label>{cur.t==='text'?<textarea rows={5} value={cur.v} onChange={e=>upd(e.target.value)}/>:<input value={cur.v} onChange={e=>upd(e.target.value)}/>}</div>
     <div className="fld"><label>카테고리</label><select defaultValue="색 이야기"><option>색 이야기</option><option>공간</option><option>전시</option></select></div>
     <div className="fld"><label>태그</label><input defaultValue="전통, 안료"/></div>
     <div className="fld"><label>공개 상태</label><div style={{display:'flex',gap:8}}><span className="badge dk">임시 저장</span><span className="badge">발행 전</span></div></div>
    </div>
   </div></>);
}

/* ── 컬러 사전 관리 ── */
function Dictionary({toast}){
  const [rows,setRows]=useState(DICT);
  const [sel,setSel]=useState(DICT[0]);
  const [csv,setCsv]=useState(false);
  const upd=(k,v)=>{setSel(s=>({...s,[k]:v}));setRows(r=>r.map(x=>x.id===sel.id?{...x,[k]:v}:x));};
  return (<>
   <div className="bar"><h1>컬러 사전 관리</h1><span className="badge num">{rows.length}개 항목</span><span className="sp"/>
    <Btn onClick={()=>setCsv(true)}><P n="upload-simple"/>CSV 일괄 등록</Btn>
    <Btn cls="pri" onClick={()=>{const id=Date.now();const n={id,w:'새 항목',en:'New',h:200,s:40,l:50,st:'초안',up:'10.02'};setRows(r=>[n,...r]);setSel(n);toast('새 항목을 만들었습니다');}}><P n="plus"/>항목 추가</Btn></div>
   {csv&&<div className="csv" style={{animation:'slideUp .3s both'}}><P n="file-csv" b/><div style={{flex:1}}><b>사전_일괄등록.csv</b> · 42행 검증 완료<div className="prog"><i/></div><span style={{fontSize:12,color:'var(--n7)'}}>통과 40행 · 오류 2행(코드 형식) — 통과 행만 등록합니다</span></div>
    <Btn cls="pri" onClick={()=>{setCsv(false);toast('40행을 등록했습니다');}}>통과 행 등록</Btn><Btn onClick={()=>setCsv(false)}>취소</Btn></div>}
   <div className="two scroll" style={{overflow:'hidden'}}>
    <div style={{overflow:'auto',borderRight:'1px solid var(--m800)'}}>
     <table className="tbl"><thead><tr><th>색 견본 · 낱말</th><th>영문</th><th>HEX</th><th>상태</th><th>수정일</th></tr></thead><tbody>
      {rows.map((r,i)=><tr key={r.id} className={'row'+(sel.id===r.id?' on':'')} style={{animationDelay:`${i*.04}s`}} onClick={()=>setSel(r)}>
       <td><span className="sw" style={{background:hsl(r.h,r.s,r.l)}}/>{r.w}</td><td>{r.en}</td><td className="num">{hex(r.h,r.s,r.l)}</td>
       <td><span className={'badge '+(r.st==='공개'?'ok':'')}>{r.st}</span></td><td className="num">{r.up}</td></tr>)}
     </tbody></table></div>
    <div style={{overflow:'auto'}}><div className="ph-t"><span>항목 편집</span></div>
     <div className="fld"><label>낱말</label><input value={sel.w} onChange={e=>upd('w',e.target.value)}/></div>
     <div className="fld"><label>영문 표기</label><input value={sel.en} onChange={e=>upd('en',e.target.value)}/></div>
     <div className="fld"><label>색 코드</label><input value={hex(sel.h,sel.s,sel.l)} readOnly className="num"/></div>
     <div className="fld"><label>설명</label><textarea rows={4} defaultValue="색의 유래와 쓰임을 입력합니다."/></div>
     <div className="fld"><label>연관 자료 링크 (외부 이동)</label><input defaultValue="https://example.com/related"/></div>
     <div className="fld"><label>변경 이력</label><div style={{fontSize:12,color:'var(--n8)',lineHeight:1.8}}>10.01 설명 수정 · 관리자<br/>09.28 항목 등록 · 관리자</div></div>
     <div style={{padding:14,display:'flex',gap:8}}><Btn cls="pri" onClick={()=>upd('st','공개')}>공개로 저장</Btn><Btn onClick={()=>upd('st','초안')}>초안으로</Btn></div>
    </div>
   </div></>);
}

/* ── 컬러 찾기 분기 편집 ── */
const NODES=[
 {id:'q1',x:30,y:150,h:'질문 1',b:'오늘 어떤 기분에 가까운가요? (선택지 5개)',on:true},
 {id:'a1',x:290,y:30,h:'선택지 · 고요함',b:'질문 2-A로 연결 (3개)'},
 {id:'a2',x:290,y:150,h:'선택지 · 설렘',b:'질문 2-B로 연결 (4개)'},
 {id:'a3',x:290,y:270,h:'선택지 · 활력',b:'질문 2-C로 연결 (5개)'},
 {id:'r1',x:550,y:30,h:'결과',b:'세이지 · 인디고',res:true},
 {id:'r2',x:550,y:150,h:'결과',b:'라일락 · 버밀리언',res:true},
 {id:'r3',x:550,y:270,h:'결과',b:'틸 · 오커',res:true}
];
function WizardCms({toast}){
  const [sel,setSel]=useState('a2');
  const [pub,setPub]=useState(false);
  const n=NODES.find(x=>x.id===sel);
  const links=[['q1','a1'],['q1','a2'],['q1','a3'],['a1','r1'],['a2','r2'],['a3','r3']];
  const by=Object.fromEntries(NODES.map(x=>[x.id,x]));
  return (<>
   <div className="bar"><h1>컬러 찾기 분기 편집</h1><span className="badge ok">경로 검증 통과</span><span className="sp"/>
    <Btn onClick={()=>toast('경로 7개를 검사했습니다 · 끊긴 경로 없음')}><P n="path"/>경로 검증</Btn>
    <Btn cls="pri" onClick={()=>setPub(true)}><P n="rocket-launch"/>변경 발행</Btn></div>
   <div className="two" style={{minHeight:0,flex:1}}>
    <div className="flow">
     <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}} aria-hidden="true">
      {links.map(([a,b])=><path key={a+b} d={`M${by[a].x+176} ${by[a].y+34} C ${by[a].x+226} ${by[a].y+34}, ${by[b].x-50} ${by[b].y+34}, ${by[b].x} ${by[b].y+34}`} stroke="var(--m800)" strokeWidth="1.5" fill="none"/>)}
     </svg>
     {NODES.map((x,i)=><div key={x.id} className={'node'+(x.res?' res':'')+(sel===x.id?' on':'')} style={{left:x.x,top:x.y,animationDelay:`${i*.06}s`}} onClick={()=>setSel(x.id)} role="button" tabIndex={0}><div className="nh">{x.h}</div><div className="nb">{x.b}</div></div>)}
    </div>
    <div style={{overflow:'auto'}}><div className="ph-t"><span>노드 속성</span></div>
     <div className="fld"><label>유형</label><input value={n.h} readOnly/></div>
     <div className="fld"><label>문구</label><textarea rows={3} defaultValue={n.b}/></div>
     <div className="fld"><label>분기 규칙</label><select defaultValue="1"><option value="1">이 선택지 → 질문 2 세트 연결</option><option>결과로 바로 이동</option></select></div>
     <div className="fld"><label>연결 결과 색</label><select defaultValue="r2"><option>세이지 · 인디고</option><option value="r2">라일락 · 버밀리언</option><option>틸 · 오커</option></select></div>
     <div style={{padding:14,display:'flex',gap:8}}><Btn cls="pri" onClick={()=>toast('노드를 저장했습니다')}>저장</Btn><Btn onClick={()=>toast('선택지를 추가했습니다')}><P n="plus"/>선택지 추가</Btn></div>
    </div></div>
   {pub&&<div className="modal" onClick={()=>setPub(false)}><div className="mb" onClick={e=>e.stopPropagation()}><h3>변경 내용을 발행할까요?</h3>
    <div className="c">질문 2개 · 선택지 12개 · 결과 6개의 연결을 검증했습니다. 발행하면 공개 사이트의 나의 컬러 찾기에 바로 반영됩니다.</div>
    <div className="f"><Btn onClick={()=>setPub(false)}>취소</Btn><Btn cls="pri" onClick={()=>{setPub(false);toast('분기 규칙을 발행했습니다');}}>발행</Btn></div></div></div>}
  </>);
}

/* ── 갤러리 관리 ── */
const GCATS=['전체','자연','공간','전시','안료'];
function GalleryAdmin({toast}){
  const [cat,setCat]=useState('전체');
  const [chk,setChk]=useState([]);
  const items=Array.from({length:17},(_,i)=>({id:i,cat:GCATS[1+(i%4)],h:(i*37)%360,s:[38,52,24,64][i%4],l:[44,58,36,66][i%3],n:`연작_${String(i+1).padStart(2,'0')}.jpg`}));
  const list=items.filter(x=>cat==='전체'||x.cat===cat);
  const tog=id=>setChk(c=>c.includes(id)?c.filter(z=>z!==id):[...c,id]);
  return (<>
   <div className="bar"><h1>갤러리 관리</h1><span className="badge num">{items.length}장</span><span className="sp"/>
    {chk.length>0&&<><span className="saved">{chk.length}장 선택</span><Btn onClick={()=>{toast(`${chk.length}장의 카테고리를 변경했습니다`);setChk([]);}}><P n="folder-simple"/>카테고리 이동</Btn></>}
    <Btn cls="pri" onClick={()=>toast('업로드 큐에 3장을 추가했습니다')}><P n="upload-simple"/>이미지 업로드</Btn></div>
   <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--m800)'}}>{GCATS.map(c=><button key={c} className="btn" style={{borderTop:'none',borderLeft:'none',borderBottomWidth:0,background:cat===c?'var(--m800)':'var(--n0)',color:cat===c?'var(--n0)':'inherit'}} onClick={()=>setCat(c)}>{c}</button>)}</div>
   <div className="scroll"><div className="gg">
    <div className="gi up"><div style={{textAlign:'center'}}><P n="image-square" b/><div style={{fontSize:12,marginTop:4}}>여기에 끌어 놓기</div></div></div>
    {list.map((x,i)=><div key={x.id} className="gi" style={{animationDelay:`${(i%10)*.04}s`}} onClick={()=>tog(x.id)} role="button" tabIndex={0}>
     <div className={'ck'+(chk.includes(x.id)?' on':'')}>{chk.includes(x.id)&&<P n="check" b/>}</div>
     <div className="im" style={{background:`linear-gradient(160deg, ${hsl(x.h,x.s,x.l+14)}, ${hsl(x.h,x.s,x.l)})`}}/>
     <div className="tt"><div style={{fontWeight:600}}>{x.n}</div><div style={{color:'var(--n7)'}}>{x.cat}</div></div></div>)}
    <div className="gi"><div className="im skel"/><div className="tt"><div style={{fontWeight:600}}>업로드 중…</div><div className="prog"><i/></div></div></div>
   </div></div></>);
}

/* ── 소유권 이관 ── */
function Handover({toast}){
  const [done,setDone]=useState([true,true,true,false,false]);
  const items=[['전체 소스코드 압축본','프런트·백엔드·관리자 저장소를 한 번에 내려받습니다'],['DB 스키마 문서','테이블·인덱스·관계 정의서'],['관리자 사용 안내서','화면별 조작 방법과 자주 묻는 질문'],['배포·운영 매뉴얼','서버 구성, SSL 갱신, 백업 절차'],['도메인·계정 이전 확인','발주사 명의로 계정과 키를 전환합니다']];
  const pct=Math.round(done.filter(Boolean).length/items.length*100);
  return (<>
   <div className="bar"><h1>소유권 이관</h1><span className="badge dk num">{pct}% 준비</span><span className="sp"/>
    <Btn cls="pri" onClick={()=>toast('이관 패키지를 만들고 있습니다')}><P n="package"/>이관 패키지 생성</Btn></div>
   <div className="scroll">
    <div className="hd">
     <div><div style={{fontSize:10,letterSpacing:'.14em',color:'var(--n7)',marginBottom:8}}>인수 인계 체크리스트</div>
      {items.map(([t,d],i)=><button key={t} className="ck-l" onClick={()=>setDone(a=>a.map((v,j)=>j===i?!v:v))}><span className={'box'+(done[i]?' on':'')}>{done[i]&&<P n="check" b/>}</span><span><b>{t}</b><br/><span style={{color:'var(--n7)'}}>{d}</span></span></button>)}
      <div className="prog" style={{marginTop:16}}><i style={{width:pct+'%'}}/></div></div>
     <div><div style={{fontSize:10,letterSpacing:'.14em',color:'var(--n7)',marginBottom:8}}>이전 가능 구조</div>
      <table className="tbl"><tbody>
       {[['데이터베이스','표준 PostgreSQL 덤프'],['파일 저장소','S3 호환 어댑터 분리'],['배포','Docker Compose 한 벌'],['환경 변수','.env 예시 파일 제공'],['관리자 계정','발주사 명의로 재발급']].map(([a,b])=><tr key={a}><td style={{fontWeight:600,paddingLeft:0}}>{a}</td><td>{b}</td><td><span className="badge ok">이전 가능</span></td></tr>)}
      </tbody></table></div>
    </div>
   </div></>);
}

function App(){
  const [v,setV]=useState('main');
  const [msg,setMsg]=useState('');
  const t=useRef(null);
  const toast=m=>{setMsg(m);clearTimeout(t.current);t.current=setTimeout(()=>setMsg(''),2200);};
  const NAV=[['콘텐츠',[['main','페이지 복제 콘텐츠 에디터','note-pencil']]],['데이터',[['dictionary','컬러 사전 관리','book-open-text'],['wizard','컬러 찾기 분기 편집','git-fork'],['gallery','갤러리 관리','images']]],['운영',[['handover','소유권 이관','key']]]];
  return (<div className="app">
   <aside className="side"><div className="logo"><P n="palette" b/>컬러결<small>ADMIN</small></div>
    <nav>{NAV.map(([g,it])=><div key={g}><div className="lb">{g}</div>{it.map(([k,l,ic])=><button key={k} className={v===k?'on':''} onClick={()=>setV(k)}><P n={ic}/>{l}</button>)}</div>)}</nav>
    <div className="me"><div className="av">관</div><div><b>콘텐츠 관리자</b><br/><span style={{color:'var(--n7)'}}>샘플 계정</span></div></div></aside>
   <div className="main" key={v} style={{animation:'fadeIn .3s both'}}>
    {v==='main'&&<Editor toast={toast}/>}
    {v==='dictionary'&&<Dictionary toast={toast}/>}
    {v==='wizard'&&<WizardCms toast={toast}/>}
    {v==='gallery'&&<GalleryAdmin toast={toast}/>}
    {v==='handover'&&<Handover toast={toast}/>}
   </div>
   {msg&&<div className="toast" role="status"><P n="check-circle" b/>{msg}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
