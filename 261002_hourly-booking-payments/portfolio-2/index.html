<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아워플레이스 운영 콘솔 — 예약·결제 대사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --m50:#fcfdf0;
  --m100:#f9fce0;
  --m200:#f2f9c1;
  --m300:#ebf59c;
  --m400:#e2f072;
  --m500:#daec4b;
  --m600:#d2e823;
  --m700:#acbe1d;
  --m800:#869416;
  --m900:#5e6810;
  --n0:#f3f3f1;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d7d5;
  --n5:#babab5;
  --n6:#979890;
  --n7:#797a71;
  --n8:#676b5f;
  --n9:#3a3a36;
  --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--n10);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:translate(1px,1px);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--n10);border-right-color:transparent;animation:k-spin .7s linear infinite;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--n10);box-shadow:0 0 0 3px var(--m600);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:14px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit;letter-spacing:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--n10);letter-spacing:inherit}
i.ph{font-size:18px;line-height:1;flex:none}
.u-cap{font-size:12px;line-height:1.5;color:var(--n8);letter-spacing:0}
.u-sub{font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.u-title{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.04em}

/* 시그니처 1 — 상단 글로벌 내비 */
.app-header{position:sticky;top:0;z-index:30;height:60px;background:var(--n1);border-bottom:2px solid var(--n10);display:flex;align-items:center;gap:20px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.04em;white-space:nowrap}
.brand .mk{width:32px;height:32px;border-radius:12px;background:var(--m600);border:2px solid var(--n10);display:grid;place-items:center}
.project-switcher{position:relative}
.sw-btn{height:34px;padding:0 14px;border-radius:99px;border:2px solid var(--n10);display:inline-flex;align-items:center;gap:6px;font-weight:600;background:var(--n1);white-space:nowrap}
.sw-btn:hover{background:var(--n2)}
.menu{position:absolute;top:42px;left:0;min-width:210px;background:var(--n1);border:2px solid var(--n10);border-radius:16px;padding:6px;z-index:40;animation:pop .18s ease both}
.menu.right{left:auto;right:0}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;text-align:left;font-weight:500}
.menu button:hover{background:var(--n2)}
.menu button.on{background:var(--m200);font-weight:700}
.global-nav{display:flex;gap:2px;flex:1;justify-content:center;min-width:0}
.nav-link{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;font-weight:600;color:var(--n8);transition:background .15s;white-space:nowrap;font-size:13px}
.nav-link:hover{background:var(--n2);color:var(--n10)}
.nav-link.active{background:var(--m600);color:var(--n10);box-shadow:inset 0 0 0 2px var(--n10)}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:36px;height:36px;border-radius:99px;border:2px solid var(--n10);display:grid;place-items:center;background:var(--n1)}
.icon-btn:hover{background:var(--n2)}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--n10);color:var(--n1);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:36px;height:36px;border-radius:99px;background:var(--n10);color:var(--n1);display:grid;place-items:center;font-weight:700;font-size:13px}

/* 시그니처 2 — 보조 탭 */
.tab-bar{display:flex;gap:4px;padding:0 24px;background:var(--n0);border-bottom:2px solid var(--n10)}
.tab{height:44px;padding:0 16px;font-weight:600;color:var(--n8);border-bottom:4px solid transparent;margin-bottom:-2px;transition:color .15s}
.tab:hover{color:var(--n10)}
.tab.active{color:var(--n10);border-bottom-color:var(--m600);box-shadow:0 2px 0 var(--n10)}
.tab .cnt{margin-left:6px;font-size:12px;font-weight:700;background:var(--n10);color:var(--n1);border-radius:99px;padding:1px 8px}

/* 시그니처 3 — 콘텐츠 */
.content{max-width:1320px;margin:0 auto;padding:20px 24px 48px;animation:rise .35s ease both}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat-card{background:var(--n1);border:2px solid var(--n10);border-radius:24px;padding:16px 20px;position:relative;overflow:hidden;transition:transform .15s}
.stat-card:hover{transform:translate(-2px,-2px)}
.stat-card.ink{background:var(--n10);color:var(--n1)}
.stat-card.ink .stat-label{color:var(--n5)}
.stat-label{font-size:12px;color:var(--n8);font-weight:600;letter-spacing:0}
.stat-value{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.1;display:block;margin-top:2px}
.stat-value small{font-size:14px;font-weight:600;letter-spacing:-.02em;margin-left:4px;color:var(--n8)}
.stat-card.ink .stat-value small{color:var(--n5)}
.sparkline{position:absolute;right:14px;bottom:14px;width:92px;height:32px}
.panel{background:var(--n1);border:2px solid var(--n10);border-radius:24px;padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cal-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

/* 캘린더/타임라인 */
.tl{display:grid;grid-template-columns:150px repeat(10,1fr);position:relative}
.tl .hh{font-size:12px;font-weight:600;color:var(--n8);padding:0 0 8px 6px;border-left:1px dashed var(--n4)}
.tl .rn{display:flex;align-items:center;gap:8px;height:54px;font-weight:600;border-top:1px solid var(--n3)}
.tl .cell{height:54px;border-top:1px solid var(--n3);border-left:1px dashed var(--n4);position:relative}
.tl .av{width:26px;height:26px;border-radius:99px;background:var(--n2);border:2px solid var(--n10);display:grid;place-items:center;font-size:11px;font-weight:700}
.blk{position:absolute;top:6px;bottom:6px;border-radius:14px;border:2px solid var(--n10);padding:0 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden;font-size:12px;font-weight:700;text-align:left;transition:transform .15s;z-index:2}
.blk:hover{transform:translate(-1px,-1px)}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.3}
.blk small{font-weight:500;font-size:11px;opacity:.8}
.blk.ok{background:var(--n10);color:var(--n1)}
.blk.hold{background:var(--m200);border-style:dashed;color:var(--n10)}
.blk.block{background:repeating-linear-gradient(135deg,var(--n3) 0 6px,var(--n2) 6px 12px);color:var(--n8);border-color:var(--n6)}
.blk.conflict{background:var(--s2-bg);color:var(--s2-text);border-color:var(--s2)}
.blk.sel{box-shadow:0 0 0 3px var(--m600),0 0 0 5px var(--n10)}
.nowline{position:absolute;top:26px;bottom:0;width:2px;background:var(--n10);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--n10);animation:pulse 1.6s ease-in-out infinite}
.lg{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--n8);flex-wrap:wrap;align-items:center}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i.sq{display:block;width:14px;height:14px;border-radius:5px;border:2px solid var(--n10)}

/* slot-side (aside 아님) */
.slot-side{display:flex;flex-direction:column;gap:16px}
.q-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--n3);width:100%;text-align:left}
.q-item:first-of-type{border-top:0}
.q-item:hover .q-t{text-decoration:underline}
.q-ic{width:34px;height:34px;border-radius:12px;border:2px solid var(--n10);display:grid;place-items:center;background:var(--n2);flex:none}
.q-t{font-weight:700;display:block;line-height:1.3}

/* 공통 컴포넌트 */
.btn{height:40px;padding:0 20px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s,background .15s}
.btn:hover{background:var(--n2);transform:translate(-1px,-1px)}
.btn.primary{background:var(--m600);color:var(--n10)}
.btn.primary:hover{background:var(--m500)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;border:2px solid var(--n10);font-size:12px;font-weight:700;background:var(--n2);white-space:nowrap}
.pill.ok{background:var(--s1-bg);color:var(--s1-text);border-color:var(--s1)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text);border-color:var(--s2)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text);border-color:var(--s3)}
.pill.main{background:var(--m200)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.dot.live{animation:pulse 1.4s ease-in-out infinite}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--n8);font-weight:700;text-align:left;padding:8px 10px;border-bottom:2px solid var(--n10);letter-spacing:0}
td{padding:11px 10px;border-bottom:1px solid var(--n3)}
tr.rw{cursor:pointer;transition:background .12s}
tr.rw:hover{background:var(--n2)}
tr.rw.sel{background:var(--m100)}
td.num,th.num{text-align:right}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
pre{background:var(--n10);color:var(--n2);padding:14px 16px;border-radius:16px;line-height:1.7;overflow:auto}
pre .k{color:var(--n5)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--n8)}
.field input,.field select{height:42px;border-radius:12px;border:2px solid var(--n10);padding:0 14px;background:var(--n1);outline:none}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;height:42px;border-radius:99px;border:2px solid var(--n10);font-weight:700;background:var(--n1);transition:background .15s}
.seg button.on{background:var(--m600)}
.flow{display:flex;gap:8px;margin:14px 0}
.flow div{flex:1;font-size:12px;font-weight:700;color:var(--n7)}
.flow div i{display:block;height:8px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);margin-bottom:6px;overflow:hidden;position:relative}
.flow div i::after{content:"";position:absolute;inset:0;background:var(--m600);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.flow div.on{color:var(--n10)}
.flow div.on i::after{transform:scaleX(1)}
.sw{position:relative;width:46px;height:26px;border-radius:99px;border:2px solid var(--n10);background:var(--n2);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--n10);transition:transform .2s}
.sw.on{background:var(--m600)}
.sw.on::after{transform:translateX(20px)}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--n3)}
.lrow:first-of-type{border-top:0}
.lrow .nm{flex:1;font-weight:700}
.heat{display:grid;grid-template-columns:120px repeat(7,1fr);gap:6px;align-items:center}
.heat .c.hot{background:var(--n10);color:var(--n1)}.heat .c.mid{background:var(--n4)}.heat .c.low{background:var(--n2)}
.heat .c{height:38px;border-radius:12px;border:2px solid var(--n10);display:grid;place-items:center;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:12px 22px;border-radius:99px;font-weight:700;display:flex;gap:8px;align-items:center;z-index:60;animation:rise .3s ease both;border:2px solid var(--n10)}
.empty{text-align:center;padding:28px 0;color:var(--n8)}

.band{position:relative;overflow:hidden;background:var(--m600);border:2px solid var(--n10);border-radius:32px;padding:26px 32px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;min-height:168px;animation:pop .4s ease both}
.band h1{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.055em;color:var(--n10)}
.band p{margin-top:12px;font-size:16px;font-weight:500;color:var(--n10);max-width:460px}
.band .acts{display:flex;gap:10px;margin-top:18px}
.band .btn.dark{background:var(--n10);color:var(--n1)}
.tiles{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:64px;gap:10px;transform:rotate(3deg);margin-right:24px}
.tiles div{border:2px solid var(--n10);border-radius:24px;background:var(--n1);display:grid;place-items:center}
.tiles div.k{background:var(--n10);color:var(--n1)}
.tiles div.w2{grid-column:span 2;border-radius:99px}
.tiles div.t2{grid-row:span 2;border-radius:32px}
.tiles i.ph{font-size:26px}
.stat-value.long{font-size:34px;padding-top:6px}
@media (max-width:900px){
  .app-header{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
  .global-nav{order:5;flex:none;width:100%;justify-content:flex-start;overflow-x:auto}
  .tab-bar{overflow-x:auto;padding:0 16px}
  .stat-row{grid-template-columns:1fr 1fr}
  .cal-wrap,.two{grid-template-columns:1fr!important}
  .tl{min-width:640px}.panel{overflow-x:auto}
  .band h1{font-size:36px}.tiles{display:none}
  .content{padding:16px}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes drawLine{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.sparkline path{stroke-dasharray:200;animation:drawLine 1.1s ease both}
</style>
</head>

function Spark({ pts }) {
  const w = 92, h = 32, mx = Math.max(...pts), mn = Math.min(...pts);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + (i * w / (pts.length - 1)).toFixed(1) + ' ' + (h - 3 - ((p - mn) / (mx - mn || 1)) * (h - 8)).toFixed(1)).join(' ');
  return <svg className="sparkline" viewBox={'0 0 ' + w + ' ' + h} fill="none"><path d={d} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}

              <div className="panel-h"><div className="u-sub">환불 요청</div></div>
              {refunds.filter((f) => tab === 0 || (tab === 1 && (f.st === 'req' || f.st === 'run')) || (tab === 2 && (f.st === 'done' || f.st === 'fail'))).map((f) => (
                <button key={f.id} className="q-item" style={{ background: fSel === f.id ? 'var(--m100)' : 'transparent', borderRadius: 12, padding: '10px 8px' }} onClick={() => { setFSel(f.id); setFlowStep(f.st === 'done' ? 3 : f.st === 'run' ? 2 : 0); }}>
                  <span className="q-ic"><i className="ph ph-receipt"></i></span>
                  <span style={{ flex: 1 }}><span className="q-t">{f.who}</span><span className="u-cap">{f.no} · {f.why}</span></span>
                  <span className={'pill ' + (f.st === 'done' ? 'ok' : f.st === 'fail' ? 'bad' : f.st === 'run' ? 'warn' : '')}>{FST[f.st]}</span>
                </button>
              ))}
            </section>
            <section className="panel">
              <div className="panel-h"><div className="u-sub">{fr.who} · {fr.no}</div><span className="u-cap num">결제 {money(fr.paid, cur)}</span></div>
              <div className="seg">
                <button className={mode === 'full' ? 'on' : ''} onClick={() => { setMode('full'); setAmt(fr.paid); }}>전액 환불</button>
                <button className={mode === 'part' ? 'on' : ''} onClick={() => setMode('part')}>부분 환불</button>
              </div>
              <div className="field"><label>환불 금액 (KRW)</label><input className="num" type="number" value={mode === 'full' ? fr.paid : amt} onChange={(e) => setAmt(Number(e.target.value))} disabled={mode === 'full'} aria-invalid={mode === 'part' && amt > fr.paid ? 'true' : 'false'} /></div>
              <div className="field"><label>취소 시점</label>
                <select value={fr.when} onChange={(e) => { const v = Number(e.target.value); setRefunds((rs) => rs.map((f) => f.id === fr.id ? { ...f, when: v } : f)); }}>
                  <option value={30}>예약 30시간 전</option><option value={12}>예약 12시간 전</option><option value={2}>예약 2시간 전</option>
                </select>
              </div>
              <div className="pill main" style={{ marginBottom: 6 }}>정책 환불율 {policy(fr.when)[0]}% · {policy(fr.when)[1]}</div>
              <div className="u-cap">정책 금액 {money(Math.round(fr.paid * policy(fr.when)[0] / 100), cur)}</div>
              <div className="flow">
                {['요청', 'PSP 전송', '진행 중', '완료'].map((s, i) => <div key={s} className={flowStep >= i ? 'on' : ''}><i></i>{s}</div>)}
              </div>
              <button className="btn primary" onClick={sendRefund} disabled={fr.st === 'done'} data-loading={busy === 'rf' ? 'true' : 'false'}>환불 요청 보내기</button>
            </section>
          </div>
        )}

        {view === 'global' && (
          <div>
            {tab === 0 && (
              <div className="two">
                <section className="panel">
                  <div className="u-sub" style={{ marginBottom: 6 }}>고객 화면 언어</div>
                  <div className="u-cap" style={{ marginBottom: 8 }}>번역 키는 JSON 리소스로 관리하고 고객 브라우저 언어로 기본값을 정합니다</div>
                  {[['ko', '한국어', '기본 언어'], ['en', 'English', '번역 완료 100%'], ['zh', '中文 (简体)', '번역 완료 96%'], ['ja', '日本語', '번역 진행 62%']].map((l) => (
                    <div key={l[0]} className="lrow">
                      <span className="q-ic" style={{ fontWeight: 800, fontSize: 12 }}>{l[0].toUpperCase()}</span>
                      <span className="nm">{l[1]}<span className="u-cap" style={{ display: 'block', fontWeight: 400 }}>{l[2]}</span></span>
                      <button className={'sw' + (langs[l[0]] ? ' on' : '')} aria-pressed={langs[l[0]]} aria-label={l[1] + ' 사용'} onClick={() => l[0] === 'ko' ? flash('기본 언어는 끌 수 없음') : setLangs({ ...langs, [l[0]]: !langs[l[0]] })}></button>
                    </div>
                  ))}
                </section>
                <section className="panel">
                  <div className="u-sub" style={{ marginBottom: 12 }}>미리보기</div>
                  <div className="stat-card" style={{ boxShadow: 'none' }}>
                    <span className="stat-label">{langs.zh ? '预订确认' : 'Booking confirmed'}</span>
                    <span className="stat-value num">{money(78000, cur)}</span>
                    <div className="u-cap" style={{ marginTop: 6 }}>{langs.ja ? '10月6日 (火) 14:00' : '2026.10.06 (Tue) 14:00'}</div>
                  </div>
                </section>
              </div>
            )}
            {tab === 1 && (
              <section className="panel">
                <div className="panel-h"><div><div className="u-sub">통화 환산 기준</div><div className="u-cap">결제는 승인 통화로, 화면 표시는 고객 선택 통화로 환산합니다</div></div></div>
                <table>
                  <thead><tr><th>통화</th><th className="num">환율 (1 KRW)</th><th className="num">78,000원 환산</th><th>반올림</th><th></th></tr></thead>
                  <tbody>
                    {Object.keys(CUR).map((c) => (
                      <tr key={c} className={'rw' + (cur === c ? ' sel' : '')} onClick={() => setCur(c)}>
                        <td style={{ fontWeight: 700 }}>{c}</td><td className="num">{CUR[c].rate}</td><td className="num">{money(78000, c)}</td><td>{CUR[c].d === 0 ? '정수' : '소수 ' + CUR[c].d + '자리'}</td>
                        <td>{cur === c && <span className="pill main">표시 중</span>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </section>
            )}
            {tab === 2 && (
              <div className="two" style={{ gridTemplateColumns: '1.3fr 1fr' }}>
                <section className="panel">
                  <div className="u-sub" style={{ marginBottom: 4 }}>확장 대비 데이터 모델</div>
                  <div className="u-cap" style={{ marginBottom: 12 }}>판매 채널을 별도 테이블로 분리해 외부 플랫폼 연동을 후속 범위로 둡니다</div>
                  <svg viewBox="0 0 560 300" width="100%" fill="none" role="img" aria-label="데이터 모델">
                    {[['resources', 20, 20, 'id · name · tz'], ['bookings', 210, 20, 'id · resource_id · channel_id'], ['payments', 400, 20, 'id · booking_id · psp_ref'], ['channels', 210, 170, 'id · type · active'], ['channel_listings', 20, 170, 'channel_id · resource_id'], ['webhook_events', 400, 170, 'idem_key · payload']].map((t) => {
                      const hi = t[0] === 'channels';
                      return (
                        <g key={t[0]}>
                          <rect x={t[1]} y={t[2]} width="150" height="84" rx="18" fill={hi ? 'var(--m600)' : 'var(--n1)'} stroke="var(--n10)" strokeWidth="2.5" />
                          <text x={t[1] + 14} y={t[2] + 32} fontSize="14" fontWeight="800" fill="var(--n10)">{t[0]}</text>
                          <text x={t[1] + 14} y={t[2] + 56} fontSize="10.5" fill="var(--n9)">{t[3]}</text>
                        </g>
                      );
                    })}
                    {[['M170 62 H210'], ['M360 62 H400'], ['M285 104 V170'], ['M170 212 H210'], ['M95 104 V170'], ['M475 104 V170']].map((p, i) => <path key={i} d={p[0]} stroke="var(--n10)" strokeWidth="2.5" strokeLinecap="round" strokeDasharray="200" style={{ animation: 'drawLine 1s ease ' + i * 0.1 + 's both' }} />)}
                  </svg>
                </section>
                <section className="panel">
                  <div className="u-sub" style={{ marginBottom: 6 }}>판매 채널</div>
                  {[['direct', '직접 판매 (고객 웹)', '현재 운영'], ['ota', '외부 마켓 연동', '후속 범위 · 슬롯 동기화 API 예정'], ['kiosk', '현장 키오스크', '후속 범위']].map((c) => (
                    <div key={c[0]} className="lrow">
                      <span className="nm">{c[1]}<span className="u-cap" style={{ display: 'block', fontWeight: 400 }}>{c[2]}</span></span>
                      <button className={'sw' + (chan[c[0]] ? ' on' : '')} aria-pressed={chan[c[0]]} aria-label={c[1]} onClick={() => c[0] === 'direct' ? flash('직접 판매는 항상 켜짐') : setChan({ ...chan, [c[0]]: !chan[c[0]] })}></button>
                    </div>
                  ))}
                  <div style={{ marginTop: 12 }}><button className="btn primary" onClick={() => flash('채널 설정 저장 — 감사 로그 기록')}>채널 설정 저장하기</button></div>
                </section>
              </div>
            )}
          </div>
        )}
      </main>
      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
