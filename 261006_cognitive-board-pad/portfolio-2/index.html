<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생각조각 콘솔 — 문제 관리·진행 기록 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 240°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#eeeeee;
  --m100:#eeeeee;
  --m200:#eeeeee;
  --m300:#dcdcdd;
  --m400:#bababa;
  --m500:#8f8f90;
  --m600:#606062;
  --m700:#343435;
  --m800:#070709;
  --m900:#060607;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#f5f5f5;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b5b5ba;
  --n6:#8b8b8b;
  --n7:#71717a;
  --n8:#53535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ primary #070709가 거의 무채색(채도 13%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--n2);color:var(--n10);font-size:16px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,select{font:inherit;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--m500);outline-offset:2px}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
:root{--shadow:0 1px 2px rgba(36,36,40,.10),0 3px 3px rgba(36,36,40,.09),0 6px 4px rgba(36,36,40,.05),0 11px 4px rgba(36,36,40,.01)}

/* 상단 내비 */
.app-header{height:64px;display:flex;align-items:center;gap:24px;padding:0 32px;background:var(--n1);border-bottom:1px solid var(--n3);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:-0.02em}
.brand-mark{width:32px;height:32px;border-radius:100px;background:var(--m800);color:var(--n1);display:grid;place-items:center;font-size:18px}
.project-switcher{position:relative}
.project-switcher>button{height:36px;padding:0 16px;border:1px solid var(--n4);border-radius:100px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;transition:background .15s}
.project-switcher>button:hover{background:var(--n2)}
.menu{position:absolute;top:44px;left:0;min-width:240px;background:var(--n1);border:1px solid var(--n3);border-radius:18px;box-shadow:var(--shadow);padding:8px;animation:fadeUp .2s ease both;z-index:50}
.menu button{width:100%;text-align:left;padding:12px 16px;border-radius:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu button:hover{background:var(--n2)}
.menu button.on{font-weight:600}
.global-nav{display:flex;gap:4px}
.nav-link{height:36px;padding:0 16px;border-radius:100px;font-size:14px;font-weight:500;color:var(--n7);display:flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.nav-link:hover{background:var(--n2);color:var(--n10)}
.nav-link:active{transform:scale(.98)}
.nav-link.active{background:var(--m800);color:var(--n1)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--n4);border-radius:100px;color:var(--n7);width:240px}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px;min-width:0}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--n4);display:grid;place-items:center;font-size:18px;position:relative;transition:background .15s}
.icon-btn:hover{background:var(--n2)}
.icon-btn .pip{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--m800);border:2px solid var(--n1)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--n3);color:var(--n8);display:grid;place-items:center;font-size:14px;font-weight:600}

/* 보조 탭 */
.tab-bar{display:flex;gap:24px;padding:0 32px;background:var(--n1);border-bottom:1px solid var(--n3);height:48px;align-items:stretch}
.tab{font-size:14px;font-weight:500;color:var(--n7);border-bottom:2px solid transparent;padding:0 2px;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--n10)}
.tab.active{color:var(--n10);border-bottom-color:var(--m800);font-weight:600}

/* 콘텐츠 */
.content{width:100%;max-width:1280px;margin:0 auto;padding:40px 32px 64px;flex:1;animation:fadeUp .35s ease both}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:32px}
.h-display{font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-0.04em}
.h-head{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-0.03em}
.lead{font-size:16px;color:var(--n7);margin-top:8px;max-width:560px}
.small{font-size:14px;color:var(--n7)}
.cap{font-size:12px;color:var(--n7)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--n1);border:1px solid var(--n3);border-radius:18px;padding:24px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.stat-label{font-size:14px;color:var(--n7)}
.stat-value{font-size:44px;font-weight:600;letter-spacing:-0.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-value small{font-size:16px;font-weight:500;color:var(--n7);margin-left:4px;letter-spacing:0}
.sparkline{flex:none}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.btn{height:44px;padding:0 24px;border-radius:100px;border:1px solid var(--n5);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,transform .1s}
.btn:hover{background:var(--n2)}
.btn:active{transform:scale(.98);background:var(--n3)}
.btn.primary{background:var(--m800);color:var(--n1);border-color:var(--m800);box-shadow:var(--shadow)}
.btn.primary:hover{background:var(--m700)}
.btn:disabled{background:var(--n3);color:var(--n6);border-color:var(--n3);cursor:not-allowed;box-shadow:none}
.btn.sm{height:36px;padding:0 16px}
.chip{height:36px;padding:0 16px;border-radius:100px;border:1px solid var(--n4);font-size:14px;font-weight:500;color:var(--n8);transition:background .15s}
.chip:hover{background:var(--n2)}
.chip.on{background:var(--m800);border-color:var(--m800);color:var(--n1)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:100px;font-size:12px;font-weight:600}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.bad{background:var(--s2-bg);color:var(--s2-text)}
.badge.idle{background:var(--n2);color:var(--n7)}


.hero{display:flex;justify-content:space-between;align-items:center;gap:32px;border-radius:28px;padding:48px 56px;margin-bottom:32px;background:linear-gradient(180deg,#779bc1 0%,#9abfda 58%,#cbdcec 100%);position:relative;overflow:hidden;min-height:280px}
.hero-copy{max-width:520px;position:relative;z-index:1}
.hero-art{position:relative;width:420px;height:220px;flex:none}
.float-card{position:absolute;background:var(--n1);border-radius:18px;padding:16px;box-shadow:0 17px 37px rgba(16,55,132,.12),0 4px 8px rgba(16,55,132,.08);animation:float 4s ease-in-out infinite}
.fc0{left:0;top:30px;transform:rotate(-6deg)}
.fc1{left:150px;top:0;animation-delay:.8s;transform:rotate(3deg)}
.fc2{left:290px;top:50px;animation-delay:1.6s;transform:rotate(-2deg)}
/* 라이브러리 */
.filter-bar{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;margin-bottom:24px}
.fgroup{display:flex;gap:8px;align-items:center}
.fgroup>span{font-size:12px;color:var(--n7);margin-right:4px}
.sort{height:36px;border:1px solid var(--n4);border-radius:100px;padding:0 16px;background:var(--n1);font-size:14px;margin-left:auto}
.problem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{background:var(--n1);border:1px solid var(--n3);border-radius:18px;box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .15s,border-color .15s;animation:fadeUp .4s ease both}
.pcard:hover{transform:translateY(-3px);border-color:var(--n5)}
.pcard .thumb{background:var(--n2);border-radius:12px;display:grid;place-items:center;padding:16px}
.pcard b{font-size:16px;font-weight:600;letter-spacing:-0.02em}
.pcard .meta{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--n1);border:1px dashed var(--n5);border-radius:18px;padding:64px 24px;text-align:center;color:var(--n7)}
.empty i{font-size:40px;color:var(--n6);animation:float 3s ease-in-out infinite;display:inline-block}
.progress-strip{margin-top:32px;display:flex;align-items:center;gap:16px;padding:16px 24px;background:var(--n1);border:1px solid var(--n3);border-radius:100px;overflow:hidden}
.progress-strip .lab{font-size:14px;font-weight:600;flex:none}
.progress-strip .items{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden}
.progress-strip .it{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:100px;background:var(--n2);font-size:12px;color:var(--n8);white-space:nowrap}

/* 드로어 / 모달 */
.scrim{position:fixed;inset:0;background:rgba(7,7,9,.32);z-index:60;animation:fade .2s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--n1);border-left:1px solid var(--n3);z-index:70;padding:32px;display:flex;flex-direction:column;gap:24px;animation:slideIn .28s ease both;overflow:auto}
.modal-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--n1);border-radius:24px;padding:32px;width:480px;max-width:100%;box-shadow:var(--shadow);animation:fadeUp .25s ease both;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.input{height:44px;border:1px solid var(--n4);border-radius:12px;padding:0 16px;background:var(--n1);font-size:14px;width:100%}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--n3);font-size:14px}
.kv span:first-child{color:var(--n7)}

/* 편집기 */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.pal{border:1px solid var(--n4);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--n8);min-width:76px;transition:background .15s,border-color .15s;background:var(--n1)}
.pal:hover{background:var(--n2)}
.pal.on{border-color:var(--m800);box-shadow:0 0 0 1px var(--m800)}
.egrid{display:grid;grid-template-columns:repeat(5,64px);grid-template-rows:repeat(5,64px);gap:4px;padding:12px;background:var(--n2);border-radius:18px;width:max-content;margin:0 auto;position:relative}
.ecell{border-radius:10px;background:var(--n1);border:1px solid var(--n3);transition:background .1s}
.ecell:hover{background:var(--n3)}
.ecell.pv{background:var(--n3);border:1px dashed var(--n7)}
.ecell.bad{background:var(--s2-bg);border:1px dashed var(--s2)}
.ecell.p0{background:var(--n10);border-color:var(--n10)}.ecell.p1{background:var(--n8);border-color:var(--n8)}.ecell.p2{background:var(--n6);border-color:var(--n6)}.ecell.p3{background:var(--n5);border-color:var(--n5)}.ecell.p4{background:var(--n4);border-color:var(--n4)}
.ecell.selc{outline:2px solid var(--m800);outline-offset:1px}
.tool{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--n3);font-size:14px}
.check i{font-size:20px;flex:none}
.check.ok i{color:var(--s1)}.check.bad i{color:var(--s2)}

/* 진행 기록 */
.chart-panel{margin-bottom:24px}
.bars{display:flex;align-items:flex-end;gap:16px;height:200px;padding:16px 0 0;border-bottom:1px solid var(--n4)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.bar-fill{width:100%;max-width:56px;border-radius:12px 12px 4px 4px;background:var(--n4);transform-origin:bottom;animation:barGrow .7s ease both;transition:background .15s}
.bar-fill.cur{background:var(--m800)}
.bar-lab{font-size:12px;color:var(--n7);padding-top:8px;text-align:center;white-space:nowrap}
.rowx{display:grid;grid-template-columns:48px 1.4fr 1fr 1fr 1fr 32px;gap:16px;align-items:center;padding:16px 8px;border-top:1px solid var(--n3);text-align:left;width:100%;font-size:14px;transition:background .15s;border-radius:12px;font-variant-numeric:tabular-nums}
.rowx:hover{background:var(--n2)}
.flow{display:flex;gap:8px;align-items:center;padding:0 8px 16px 72px;flex-wrap:wrap;animation:fadeUp .25s ease both}
.flow i.arrow{color:var(--n6)}

/* 콘텐츠 팩 */
.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pack{display:flex;flex-direction:column;gap:16px;animation:fadeUp .4s ease both}
.pack .art{height:120px;border-radius:12px;background:var(--n2);display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--m800);color:var(--n1);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:500;z-index:100;display:flex;gap:8px;align-items:center;animation:toastIn .3s ease both;box-shadow:var(--shadow)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--n1);border-right-color:transparent;animation:spin .7s linear infinite}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

/* ───────── 조각 · 데이터 ───────── */
const SHAPES = {
  I2:[[0,0],[0,1]], I3:[[0,0],[0,1],[0,2]], L3:[[0,0],[1,0],[1,1]], O4:[[0,0],[0,1],[1,0],[1,1]],
  T4:[[0,0],[0,1],[0,2],[1,1]], L4:[[0,0],[1,0],[2,0],[2,1]], S4:[[0,1],[0,2],[1,0],[1,1]]
};
const NAMES = {I2:'막대 2',I3:'막대 3',L3:'꺾쇠',O4:'네모',T4:'티자',L4:'기역자',S4:'지그재그'};
const norm = cells => {
  const mr = Math.min(...cells.map(c=>c[0])), mc = Math.min(...cells.map(c=>c[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rotCells = (type,rot) => {
  let cells = SHAPES[type];
  for (let i=0;i<(rot%4);i++) cells = norm(cells.map(([r,c])=>[c,-r]));
  return norm(cells);
};
const cellsOf = p => rotCells(p.type,p.rot).map(([r,c])=>[r+p.r,c+p.c]);
const inBoard = cs => cs.every(([r,c])=>r>=0&&c>=0&&r<5&&c<5);
const overlaps = (cs, list, skipId) => {
  const occ = new Set();
  list.forEach(o => { if (o.id!==skipId) cellsOf(o).forEach(([r,c])=>occ.add(r*5+c)); });
  return cs.some(([r,c])=>occ.has(r*5+c));
};
const SOL = (arr) => arr.map(([type,rot,r,c],i)=>({id:'s'+i,type,rot,r,c}));
const BASE = [
  {id:1,title:'작은 집',level:'쉬움',age:'만 4~5세',kind:'모양 채우기 퍼즐',made:'10.01',sol:SOL([['O4',0,1,1],['L3',0,0,3],['I3',0,3,0]])},
  {id:2,title:'긴 다리',level:'쉬움',age:'만 4~5세',kind:'모양 채우기 퍼즐',made:'10.01',sol:SOL([['I3',0,2,0],['L4',0,0,3],['I2',0,4,1]])},
  {id:3,title:'나비',level:'보통',age:'만 6~7세',kind:'모양 채우기 퍼즐',made:'10.02',sol:SOL([['T4',0,0,1],['S4',0,2,0],['L3',2,3,3]])},
  {id:4,title:'지그재그 길',level:'보통',age:'만 6~7세',kind:'모양 채우기 퍼즐',made:'10.02',sol:SOL([['S4',0,0,0],['I3',1,0,4],['L3',0,2,1],['O4',0,3,3]])},
  {id:5,title:'왕관',level:'어려움',age:'만 8세 이상',kind:'모양 채우기 퍼즐',made:'10.03',sol:SOL([['T4',2,0,0],['O4',0,0,3],['L4',1,3,2],['I2',1,3,0]])},
  {id:6,title:'물고기',level:'어려움',age:'만 8세 이상',kind:'모양 채우기 퍼즐',made:'10.03',sol:SOL([['I3',0,0,0],['O4',0,1,1],['T4',1,0,3],['L3',1,3,0],['S4',0,3,2]])},
  {id:7,title:'모자',level:'쉬움',age:'만 4~5세',kind:'모양 채우기 퍼즐',made:'10.05',sol:SOL([['O4',0,0,0],['I3',0,0,2],['I2',1,3,3]])},
  {id:8,title:'계단',level:'보통',age:'만 6~7세',kind:'모양 채우기 퍼즐',made:'10.05',sol:SOL([['L3',0,0,0],['L3',0,2,1],['S4',0,3,2]])}

const GRAY = ['var(--n10)','var(--n8)','var(--n6)','var(--n5)','var(--n4)'];
function PieceBoard({sol,S=24,gap=2,bg=true}) {
  const all = sol.map(p=>cellsOf(p));
  const rects = [];
  all.forEach((cs,i) => cs.forEach(([r,c]) => rects.push(
    <rect key={i+'-'+r+'-'+c} x={c*S+gap/2} y={r*S+gap/2} width={S-gap} height={S-gap} rx={S*0.22} fill={GRAY[i%5]} />)));
  const cells = [];
  if (bg) for (let r=0;r<5;r++) for (let c=0;c<5;c++) cells.push(<rect key={'b'+r+c} x={c*S+gap/2} y={r*S+gap/2} width={S-gap} height={S-gap} rx={S*0.22} fill="var(--n1)" stroke="var(--n3)" />);
  const W = bg ? 5 : Math.max(...all.flat().map(x=>x[1]))+1, H = bg ? 5 : Math.max(...all.flat().map(x=>x[0]))+1;
  return <svg width={W*S} height={H*S} viewBox={`0 0 ${W*S} ${H*S}`} aria-hidden="true">{cells}{rects}</svg>;
}
function Spark({data,w=96,h=40}) {
  const mx = Math.max(...data), mn = Math.min(...data);
  const pts = data.map((v,i)=>[i*(w-4)/(data.length-1)+2, h-4-((v-mn)/(mx-mn||1))*(h-8)]);
  return (
    <svg className="sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <polyline points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke="var(--m800)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="3.5" fill="var(--m800)" />
    </svg>
  );
}
const lvBadge = l => <span className="badge idle">{l}</span>;

function PackArt({kind}) {
  const R = (x,y,w,h,f,k) => <rect key={k} x={x} y={y} width={w} height={h} rx="8" fill={f} />;
  if (kind==='fill') return <svg width="132" height="84" aria-hidden="true">{[R(8,8,36,36,'var(--n10)',1),R(48,8,36,36,'var(--n8)',2),R(48,48,36,28,'var(--n6)',3),R(88,8,36,68,'var(--n4)',4)]}</svg>;
  if (kind==='order') return <svg width="132" height="84" aria-hidden="true">{[R(6,20,34,44,'var(--n4)',1),R(49,12,34,44,'var(--n6)',2),R(92,20,34,44,'var(--n10)',3)]}</svg>;
  if (kind==='shadow') return <svg width="132" height="84" aria-hidden="true">{[R(10,16,44,52,'var(--n10)',1),<circle key="c" cx="96" cy="42" r="26" fill="none" stroke="var(--n6)" strokeWidth="3" strokeDasharray="6 5" />]}</svg>;
  return <svg width="132" height="84" aria-hidden="true">{[0,1,2,3,4].map(i=>R(6+i*25,i%2?44:16,20,20,i%2?'var(--n6)':'var(--n10)',i))}</svg>;
}

                  </svg>
                </div>
                <div className="kv" style={{marginTop:16}}><span>채울 칸</span><b>{total}칸</b></div>
                <div className="kv"><span>사용 조각</span><b>{ed.placed.length}개</b></div>
                <div className="kv"><span>난이도</span><b>{ed.level}</b></div>
              </>)}
              {tab.edit==='문제 정보' && (<>
                <h2 className="h-head" style={{marginBottom:16}}>문제 정보</h2>
                <div className="field" style={{marginBottom:16}}><label htmlFor="ttl">문제 이름</label><input id="ttl" className="input" value={ed.title} placeholder="예: 작은 집" onChange={e=>setEd({...ed,title:e.target.value})} /></div>
                <div className="field" style={{marginBottom:16}}><label htmlFor="lv">난이도</label>
                  <select id="lv" className="input" value={ed.level} onChange={e=>setEd({...ed,level:e.target.value})}><option>쉬움</option><option>보통</option><option>어려움</option></select></div>
                <div className="field"><label htmlFor="ag">권장 연령</label>
                  <select id="ag" className="input" value={ed.age} onChange={e=>setEd({...ed,age:e.target.value})}><option>만 4~5세</option><option>만 6~7세</option><option>만 8세 이상</option></select></div>
              </>)}
              {tab.edit==='검증 결과' && (<>
                <h2 className="h-head" style={{marginBottom:8}}>저장 전 검증</h2>
                {checks.map((c,i)=>(
                  <div key={i} className={'check '+(c.ok?'ok':'bad')}><i className={'ph '+(c.ok?'ph-check-circle':'ph-warning-circle')}></i><span>{c.t}</span></div>
                ))}
                <p className="small" style={{marginTop:16}}>{allOk?'모든 항목을 통과했습니다. 저장할 수 있습니다.':'통과하지 못한 항목을 수정한 뒤 저장해 주세요.'}</p>
              </>)}
            </section>
          </div>
        </>)}

        {view==='prog' && (<>
          <div className="page-head">
            <div><h1 className="h-display">{tab.prog}의 풀이 기록</h1><p className="lead">{kid.age} · 문제별 시도 횟수와 재시도 흐름을 시간순으로 확인합니다.</p></div>
            <button className="btn" onClick={()=>say('기록 파일(CSV) 내보내기를 준비합니다')}><i className="ph ph-download-simple"></i>기록 내보내기</button>
          </div>
          <section className="stat-row">
            <div className="stat-card"><div><div className="stat-label">푼 문제</div><div className="stat-value">{clearedN}<small>개</small></div></div><Spark data={[0,1,1,2,3,3,clearedN+1]} /></div>
            <div className="stat-card"><div><div className="stat-label">평균 시도</div><div className="stat-value">{avgTry}<small>번</small></div></div><Spark data={[4,3.5,3.6,3,2.8,2.6,Number(avgTry)]} /></div>
            <div className="stat-card"><div><div className="stat-label">푼 시간 합계</div><div className="stat-value">{kid.rows.reduce((s,r)=>s+r.min,0)}<small>분</small></div></div><Spark data={[5,8,6,12,10,14,kid.rows.reduce((s,r)=>s+r.min,0)]} /></div>
          </section>
          <section className="card chart-panel">
            <h2 className="h-head" style={{marginBottom:8}}>문제별 시도 횟수</h2>
            <div className="bars">
              {kid.rows.map((r,i)=>(
                <div className="bcol" key={r.pid}>
                  <span className="small" style={{fontWeight:600}}>{r.tries}번</span>
                  <div className={'bar-fill'+(r.res==='진행 중'?' cur':'')} style={{height:Math.round(r.tries/maxTry*130)+'px',animationDelay:i*90+'ms'}}></div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:16}}>{kid.rows.map(r=><div className="bar-lab" style={{flex:1}} key={r.pid}>{titleOf(r.pid)}</div>)}</div>
          </section>
          <section className="card">
            <div className="rowx" style={{borderTop:0,color:'var(--n7)',fontSize:12,cursor:'default'}}><span>No.</span><span>문제</span><span>시도</span><span>소요 시간</span><span>결과</span><span></span></div>
            {kid.rows.map((r,i)=>(
              <React.Fragment key={r.pid}>
                <button className="rowx" onClick={()=>setExpand(expand===tab.prog+r.pid?null:tab.prog+r.pid)}>
                  <span className="small">{String(i+1).padStart(2,'0')}</span>
                  <span><b style={{fontWeight:600}}>{titleOf(r.pid)}</b><br /><span className="cap">{r.at}</span></span>
                  <span>{r.tries}번</span><span>{r.min}분</span>
                  <span><span className={'badge '+(r.res==='정답'?'ok':'idle')}>{r.res}</span></span>
                  <i className={'ph '+(expand===tab.prog+r.pid?'ph-caret-up':'ph-caret-down')}></i>
                </button>
                {expand===tab.prog+r.pid && (
                  <div className="flow">
                    {r.flow.map((f,j)=>(
                      <React.Fragment key={j}>
                        <span className={'badge '+(f==='정답'?'ok':f==='실패'?'bad':'idle')}>{j+1}번째 {f}</span>
                        {j<r.flow.length-1 && <i className="ph ph-arrow-right arrow"></i>}
                      </React.Fragment>
                    ))}
                  </div>
                )}
              </React.Fragment>
            ))}
          </section>
        </>)}

        {view==='pack' && (<>
          <div className="page-head">
            <div><h1 className="h-display">콘텐츠 팩</h1><p className="lead">퍼즐 외의 인지발달 콘텐츠를 팩 단위로 추가합니다. 같은 문제 데이터 구조를 공유해 새 팩을 빠르게 붙일 수 있습니다.</p></div>
            <button className="btn primary" onClick={()=>setModal({mode:'new'})}><i className="ph ph-plus"></i>새 팩 만들기</button>
          </div>
          <div className="pack-grid">
            {packShown.map((p,i)=>(
              <div className="card pack" key={p.id} style={{animationDelay:i*60+'ms'}}>
                <div className="art"><PackArt kind={p.art} /></div>
                <div><h2 style={{fontSize:20,fontWeight:600,letterSpacing:'-0.02em'}}>{p.name}</h2><p className="small" style={{marginTop:4}}>{p.desc}</p></div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}><span className="badge idle">문제 {p.count}개</span><span className="badge idle">{p.age}</span></div>
                {p.on
                  ? <button className="btn" onClick={()=>{setProj(p.name);go('lib');}}><i className="ph ph-check-circle"></i>설치됨 · 라이브러리 보기</button>
                  : <button className="btn primary" onClick={()=>setModal({mode:'install',pack:p})}><i className="ph ph-plus"></i>추가하기</button>}
              </div>
            ))}
          </div>
        </>)}
      </main>

      {openP && (<>
        <div className="scrim" onClick={()=>setOpen(null)}></div>
        <div className="drawer" role="dialog" aria-label="문제 상세">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <h2 className="h-head">{openP.title}</h2>
            <button className="icon-btn" aria-label="닫기" onClick={()=>setOpen(null)}><i className="ph ph-x"></i></button>
          </div>
          <div style={{background:'var(--n2)',borderRadius:18,padding:24,display:'grid',placeItems:'center'}}><PieceBoard sol={openP.sol} S={44} gap={3} /></div>
          <div>
            <div className="kv"><span>난이도</span><b>{openP.level}</b></div>
            <div className="kv"><span>권장 연령</span><b>{openP.age}</b></div>
            <div className="kv"><span>조각 구성</span><b>{openP.sol.map(s=>NAMES[s.type]).join(' · ')}</b></div>
            <div className="kv"><span>등록일</span><b>{openP.made}</b></div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:'auto'}}>
            <button className="btn primary" style={{flex:1}} onClick={()=>editFrom(openP)}><i className="ph ph-pencil-simple-line"></i>편집하기</button>
            <button className="btn" onClick={()=>setOpen(null)}>닫기</button>
          </div>
        </div>
      </>)}

      {modal && (
        <div className="modal-wrap">
          <div className="scrim" onClick={()=>setModal(null)}></div>
          <form className="modal" style={{position:'relative',zIndex:71}} onSubmit={submitPack}>
            <h2 className="h-head">{modal.mode==='install'?'콘텐츠 팩 추가':'새 팩 만들기'}</h2>
            <div className="field"><label htmlFor="pn">팩 이름</label><input id="pn" name="name" className="input" defaultValue={modal.mode==='install'?modal.pack.name:''} placeholder="예: 숫자 놀이" /></div>
            <div className="field"><label htmlFor="pa">권장 연령</label>
              <select id="pa" name="age" className="input" defaultValue={modal.mode==='install'?modal.pack.age:'만 4~8세'}><option>만 4~6세</option><option>만 4~8세</option><option>만 5~7세</option><option>만 6~8세</option></select></div>
            <div className="field"><label htmlFor="pc">문제 수</label><input id="pc" name="count" type="number" min="0" className="input" defaultValue={modal.mode==='install'?modal.pack.count:0} /></div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
              <button type="button" className="btn" onClick={()=>setModal(null)}>취소</button>
              <button type="submit" className="btn primary">{modal.mode==='install'?'팩 추가하기':'팩 만들기'}</button>
            </div>
          </form>
        </div>
      )}
      {toast && <div className="toast" role="status"><i className="ph ph-info"></i>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
