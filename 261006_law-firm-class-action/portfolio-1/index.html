<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 220°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#eff2f8;
  --m100:#dfe5f2;
  --m200:#bfcce4;
  --m300:#99add4;
  --m400:#6e8ac2;
  --m500:#4569b1;
  --m600:#1c48a0;
  --m700:#173b83;
  --m800:#122e66;
  --m900:#0d2048;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f7f4ed;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909298;
  --n7:#71747a;
  --n8:#333333;
  --n9:#36373a;
  --n10:#242424;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--n0);color:var(--n10);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--n10)}
.serif{font-family:'Noto Serif KR','Pretendard',serif;letter-spacing:-.02em}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
.view{animation:slideUp .5s ease both}
/* top nav */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--n0) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--n10)}
.top-in{max-width:1240px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;gap:36px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;white-space:nowrap}
.brand .mark{width:30px;height:30px;border:1.5px solid var(--m600);color:var(--m600);display:grid;place-items:center;border-radius:2px}
.nav{display:flex;gap:4px;flex:1}
.nav button{padding:8px 14px;border-radius:2px;font-size:15px;color:var(--n8);position:relative;transition:color .2s}
.nav button:hover{color:var(--n10)}
.nav button.on{color:var(--m600);font-weight:600}
.nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-14px;height:2px;background:var(--m600)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:600;font-size:15px;position:relative;overflow:hidden;transition:background .2s,transform .15s}
.btn-main{background:var(--m600);color:var(--n1)}
.btn-main:hover{background:var(--m700)}
.btn-line{border:1px solid var(--n10);color:var(--n10);background:transparent}
.btn-line:hover{background:var(--n10);color:var(--n0)}
.btn-sm{padding:8px 14px;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
/* hero */
.hero{border-bottom:1px solid var(--n10);overflow:hidden;background:radial-gradient(900px 420px at 88% 20%,var(--m100),transparent 70%),linear-gradient(180deg,var(--n0),var(--n2))}
.hero-in{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;min-height:640px;padding:64px 0}
.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--m600);font-weight:600;text-transform:uppercase}
.hero h1{font-size:92px;line-height:.98;font-weight:400;margin:20px 0 26px;letter-spacing:-.055em}
.hero p.lead{font-size:18px;color:var(--n8);max-width:520px}
.hero-cta{display:flex;gap:12px;margin-top:32px}
.hero-art{position:relative;height:440px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.float-card{position:absolute;background:var(--n1);border:1px solid var(--n10);padding:14px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.08);animation:floatY 5s ease-in-out infinite}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s1);margin-right:6px;animation:pulse 1.8s infinite}
.strip{border-bottom:1px solid var(--n10);background:var(--n1)}
.strip-in{display:grid;grid-template-columns:repeat(3,1fr)}
.strip-item{padding:22px 28px;border-right:1px solid var(--n3);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .2s}
.strip-item:last-child{border-right:0}
.strip-item:hover{background:var(--n0)}
.strip-item b{display:block;font-size:15px}
.strip-item span{font-size:13px;color:var(--n7)}
.sec{padding:84px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:20px}
.sec-h h2{font-size:38px;font-weight:400;line-height:1.25}
.areas{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--n10);border-left:1px solid var(--n10)}
.area{padding:30px 26px;border-right:1px solid var(--n10);border-bottom:1px solid var(--n10);background:var(--n1);text-align:left;transition:background .25s;min-height:210px;display:flex;flex-direction:column;gap:10px}
.area:hover{background:var(--m50)}
.area h3{font-size:20px;font-weight:600}
.area p{font-size:14px;color:var(--n7)}
.area .num{font-size:12px;color:var(--n6);letter-spacing:.1em}
.news{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.news-row{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--n4);text-align:left;width:100%;transition:padding .2s}
.news-row:hover{padding-left:8px}
.news-row small{color:var(--n7);white-space:nowrap}
/* lawsuits */
.pg-h{padding:56px 0 28px;border-bottom:1px solid var(--n10)}
.pg-h h1{font-size:46px;font-weight:400;line-height:1.2}
.pg-h p{color:var(--n8);margin-top:10px;max-width:640px}
.gf{display:grid;grid-template-columns:260px 1fr;gap:44px;padding:36px 0 84px}
.rail{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:26px}
.rail h4{font-size:12px;letter-spacing:.14em;color:var(--n7);margin-bottom:10px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--n10);background:var(--n1);padding:0 12px;border-radius:4px}
.search input{border:0;outline:0;background:transparent;padding:11px 0;flex:1;min-width:0}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--m500) 28%,transparent)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:2px;font-size:15px;color:var(--n8);transition:background .15s}
.opt:hover{background:var(--n2)}
.opt.on{background:var(--n10);color:var(--n0)}
.opt small{font-size:12px;opacity:.7}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--m600)}
select.sel{width:100%;padding:10px 12px;border:1px solid var(--n10);background:var(--n1);border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.lcard{background:var(--n1);border:1px solid var(--n4);padding:26px;text-align:left;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s,box-shadow .2s;animation:slideUp .45s ease both}
.lcard:hover{border-color:var(--n10);transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.07)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:2px;background:var(--n2);color:var(--n9);width:fit-content}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.end{background:var(--n3);color:var(--n7)}
.lcard h3{font-size:21px;font-weight:600;line-height:1.4}
.lcard p{font-size:14px;color:var(--n7)}
.meter{height:6px;background:var(--n3);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--m600);transform-origin:left;animation:barGrow 1s .2s ease both}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--n7)}
.empty{grid-column:1/-1;padding:64px;text-align:center;border:1px dashed var(--n5);color:var(--n7)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;animation:fadeIn .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--n1);z-index:51;padding:32px;overflow:auto;animation:drawerIn .3s ease;border-left:1px solid var(--n10);display:flex;flex-direction:column;gap:16px}
.drawer h3{font-size:26px;font-weight:600;line-height:1.35}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;font-size:15px;padding:16px 0;border-top:1px solid var(--n4);border-bottom:1px solid var(--n4)}
.kv dt{color:var(--n7)}
/* detail */
.dt-grid{display:grid;grid-template-columns:200px 1fr 300px;gap:48px;padding:40px 0 140px}
.toc{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--n4)}
.toc button{text-align:left;padding:8px 16px;font-size:14px;color:var(--n7);margin-left:-1px;border-left:2px solid transparent}
.toc button.on{color:var(--m600);border-left-color:var(--m600);font-weight:600}
.blk{padding:0 0 44px}
.blk h2{font-size:28px;font-weight:600;margin-bottom:14px;scroll-margin-top:96px}
.blk p{color:var(--n9);max-width:640px}
.steps{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--n5);margin-left:8px}
.step{padding:0 0 22px 26px;position:relative}
.step::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--n1);border:2px solid var(--n6)}
.step.done::before{background:var(--m600);border-color:var(--m600)}
.step b{display:block}
.step small{color:var(--n7)}
.faq{border-top:1px solid var(--n4)}
.faq button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--n4);font-weight:600}
.faq .ans{padding:12px 0 18px;color:var(--n8);animation:fadeIn .3s;max-width:620px}
.side-box{position:sticky;top:96px;align-self:start;background:var(--n1);border:1px solid var(--n10);padding:24px;display:flex;flex-direction:column;gap:14px}
.fixbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--n10);color:var(--n0);animation:slideUp .5s}
.fixbar-in{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.fixbar .btn-main{background:var(--m500)}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 320px;gap:56px;padding:40px 0 90px}
.stepper{display:flex;gap:0;margin-bottom:30px;border:1px solid var(--n10)}
.stepper div{flex:1;padding:12px 16px;font-size:14px;color:var(--n7);border-right:1px solid var(--n10);background:var(--n1)}
.stepper div:last-child{border-right:0}
.stepper div.on{background:var(--n10);color:var(--n0);font-weight:600}
.stepper div.done{color:var(--m600)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.fld label{font-size:14px;font-weight:600}
.fld input,.fld select,.fld textarea{padding:12px 14px;border:1px solid var(--n5);background:var(--n1);border-radius:4px}
.fld textarea{min-height:120px;resize:vertical}
.err{font-size:13px;color:var(--n10);font-weight:600}
.seg{display:flex;border:1px solid var(--n10);width:fit-content;margin-bottom:22px}
.seg button{padding:10px 20px;font-size:14px;background:var(--n1)}
.seg button.on{background:var(--n10);color:var(--n0)}
.consent{border:1px solid var(--n4);background:var(--n1);padding:16px;font-size:14px;color:var(--n8);margin-bottom:12px}
.done-box{border:1px solid var(--n10);background:var(--n1);padding:44px;text-align:center;animation:slideUp .5s}
.done-box .rcpt{font-size:30px;font-weight:600;color:var(--m600);letter-spacing:.04em;margin:10px 0}
/* members */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:40px 0 90px}
.mcard{background:var(--n1);border:1px solid var(--n4);text-align:left;transition:transform .2s,border-color .2s}
.mcard:hover{transform:translateY(-3px);border-color:var(--n10)}
.mcard .ph{height:210px;background:linear-gradient(160deg,var(--n2),var(--n4));display:grid;place-items:center;position:relative;overflow:hidden}
.mcard .ph .ini{font-size:64px;color:var(--n7);font-weight:400}
.mcard .bd{padding:20px 22px 24px}
.mcard h3{font-size:20px;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:2px 8px;background:var(--n2);color:var(--n9);margin:8px 6px 0 0;border-radius:2px}
.foot{background:var(--n10);color:var(--n4);padding:56px 0 40px;font-size:14px}
.foot-in{display:flex;justify-content:space-between;gap:40px}
.foot b{color:var(--n0)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 20px;border-radius:4px;z-index:80;animation:slideUp .3s;font-size:14px}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);width:20px;height:20px;margin:-10px;animation:ripple .6s ease-out forwards;pointer-events:none}
@media(max-width:900px){.hero h1{font-size:46px}.hero-in,.gf,.dt-grid,.form-grid{grid-template-columns:1fr}.hero h1{font-size:42px}.cards,.areas,.mem,.news{grid-template-columns:1fr}.top-in{gap:12px;padding:0 16px;overflow-x:auto}.drawer{width:100%}.toc,.rail,.side-box{position:static}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo} = React;

function Ic({n,s=18}){
  useEffect(()=>{ if(window.lucide) lucide.createIcons(); });
  return <span style={{display:'inline-flex',width:s,height:s,flex:'none'}} dangerouslySetInnerHTML={{__html:`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`}}/>;
}
function Btn({className='',onClick,children,...r}){
  const [d,setD]=useState([]);
  const go=e=>{const b=e.currentTarget.getBoundingClientRect();const id=Math.random();setD(x=>[...x,{id,x:e.clientX-b.left,y:e.clientY-b.top}]);setTimeout(()=>setD(x=>x.filter(q=>q.id!==id)),600);onClick&&onClick(e);};
  return <button className={'btn '+className} onClick={go} {...r}>{children}{d.map(p=>React.createElement('span',{key:p.id,className:'rp',style:{left:p.x,top:p.y}}))}</button>;
}

const AREAS=[
 {n:'01',t:'집단·단체 소송',d:'같은 피해를 입은 다수의 참여자를 모아 하나의 소송으로 진행합니다.'},
 {n:'02',t:'소비자·개인정보',d:'정보 유출, 허위 광고, 환불 분쟁 등 소비자 피해 사건을 다룹니다.'},
 {n:'03',t:'기업·계약 분쟁',d:'가맹, 하도급, 계약 해석 분쟁에 대한 자문과 소송을 수행합니다.'},
 {n:'04',t:'부동산·건설',d:'시공 하자와 임대차, 재건축 관련 분쟁을 지원합니다.'}
];
const LAWSUITS=[

   </div>
   <div className="fixbar"><div className="fixbar-in">
     <div><b className="serif" style={{fontSize:17}}>{closed?'모집이 종료된 소송입니다':'지금 참여 신청을 시작할 수 있습니다'}</b><div style={{fontSize:13,opacity:.7}}>{closed?'결과 안내문은 문의 폼으로 요청해 주세요':'마감 '+l.deadline+' · 3단계 간편 신청'}</div></div>
     <Btn className="btn-main" onClick={()=>go('참여·문의 폼')}>{closed?'결과 안내 문의':'참여 신청하기'} <Ic n="arrow-right" s={16}/></Btn>
   </div></div>
  </div>);
}

function Apply({sel,go,toast}){
  const [mode,setMode]=useState('참여 신청');const [step,setStep]=useState(0);const [busy,setBusy]=useState(false);const [rcpt,setRcpt]=useState(null);
  const [f,setF]=useState({law:sel||1,name:'',phone:'',email:'',body:'',c1:false,c2:false});const [err,setErr]=useState({});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const validate=()=>{const e={};
    if(step===0){if(!f.name.trim())e.name='이름을 입력해 주세요.';if(!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(f.phone))e.phone='휴대전화 번호 형식을 확인해 주세요.';if(!/^\S+@\S+\.\S+$/.test(f.email))e.email='이메일 형식을 확인해 주세요.';}
    if(step===1&&f.body.trim().length<10)e.body='피해 내용을 10자 이상 입력해 주세요.';
    if(step===2){if(!f.c1)e.c1='필수 동의가 필요합니다.';}
    setErr(e);return !Object.keys(e).length;};
  const next=()=>{if(!validate())return;if(step<2){setStep(step+1);return;}setBusy(true);setTimeout(()=>{setBusy(false);setRcpt('R-'+(260000+Math.floor(Math.random()*9000)));toast('접수가 저장되었습니다');},900);};
  const law=LAWSUITS.find(x=>x.id==f.law);
  return (<div className="view">
   <div className="pg-h"><div className="wrap"><div className="eyebrow">APPLY</div><h1 className="serif">참여 신청 · 상담 문의</h1><p>입력하신 개인정보는 암호화하여 저장하며, 수집 동의 이력이 함께 기록됩니다.</p></div></div>
   <div className="wrap form-grid">
    <div>
     {rcpt?<div className="done-box" style={{borderRadius:4,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}><Ic n="circle-check" s={40}/><h2 className="serif" style={{fontSize:28,marginTop:10}}>접수가 완료되었습니다</h2><div className="rcpt num">{rcpt}</div><p style={{color:'var(--n8)'}}>담당 변호사가 영업일 기준 2일 이내에 연락드립니다.</p>
       <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:22}}><Btn className="btn-line" onClick={()=>go('소송 목록')}>소송 목록으로</Btn><Btn className="btn-main" onClick={()=>{setRcpt(null);setStep(0);setF({...f,name:'',phone:'',email:'',body:'',c1:false,c2:false});}}>추가 신청</Btn></div></div>:<>
      <div className="seg">{['참여 신청','일반 문의'].map(m=><button key={m} className={mode===m?'on':''} onClick={()=>setMode(m)}>{m}</button>)}</div>
      <div className="stepper">{['신청자 정보','피해·문의 내용','동의 및 제출'].map((s,i)=><div key={s} className={step===i?'on':i<step?'done':''}>{i+1}. {s}</div>)}</div>
      {step===0&&<>
        {mode==='참여 신청'&&<div className="fld"><label>참여할 소송</label><select value={f.law} onChange={e=>set('law',e.target.value)}>{LAWSUITS.filter(l=>l.status==='모집중').map(l=><option key={l.id} value={l.id}>{l.title}</option>)}</select></div>}
        <div className="fld"><label>이름</label><input value={f.name} onChange={e=>set('name',e.target.value)} aria-invalid={!!err.name} placeholder="홍길동"/>{err.name&&<span className="err">{err.name}</span>}</div>
        <div className="fld"><label>휴대전화</label><input value={f.phone} onChange={e=>set('phone',e.target.value)} aria-invalid={!!err.phone} placeholder="010-0000-0000"/>{err.phone&&<span className="err">{err.phone}</span>}</div>
        <div className="fld"><label>이메일</label><input value={f.email} onChange={e=>set('email',e.target.value)} aria-invalid={!!err.email} placeholder="name@example.com"/>{err.email&&<span className="err">{err.email}</span>}</div></>}
      {step===1&&<div className="fld"><label>{mode==='참여 신청'?'피해 내용':'문의 내용'}</label><textarea value={f.body} onChange={e=>set('body',e.target.value)} aria-invalid={!!err.body} placeholder="발생 시기와 피해 상황을 간단히 적어 주세요."/>{err.body&&<span className="err">{err.body}</span>}</div>}
      {step===2&&<>
        <div className="consent"><b>[필수] 개인정보 수집·이용 동의</b><br/>수집 항목: 이름, 연락처, 이메일, 피해 내용 · 목적: 소송 참여 상담 · 보관: 소송 종료 후 3년</div>
        <label className="chk"><input type="checkbox" checked={f.c1} onChange={e=>set('c1',e.target.checked)}/>필수 동의에 동의합니다</label>{err.c1&&<span className="err">{err.c1}</span>}
        <label className="chk"><input type="checkbox" checked={f.c2} onChange={e=>set('c2',e.target.checked)}/>[선택] 소송 진행 소식 알림 수신</label></>}
      <div style={{display:'flex',gap:10,marginTop:24}}>
        {step>0&&<Btn className="btn-line" onClick={()=>setStep(step-1)}>이전</Btn>}
        <Btn className="btn-main" data-loading={busy?'true':undefined} disabled={busy} onClick={next}>{step<2?'다음 단계':'제출하기'}</Btn>
      </div></>}
    </div>
    <aside className="side-box" style={{borderRadius:4,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}><b className="serif" style={{fontSize:18}}>선택한 소송</b>
      {mode==='참여 신청'&&law?<><span className="badge ok"><span className="live"/>{law.status}</span><div style={{fontWeight:600}}>{law.title}</div><div className="row"><span>마감</span><span className="num">{law.deadline}</span></div></>:<p style={{color:'var(--n7)',fontSize:14}}>일반 문의는 소송과 무관하게 접수됩니다.</p>}
      <div style={{borderTop:'1px solid var(--n4)',paddingTop:14,fontSize:13,color:'var(--n7)'}}>연락처는 AES-256-GCM으로 암호화하여 저장하고 접수 알림은 큐로 발송하는 구조를 제안합니다.</div></aside>
   </div>
  </div>);
}

function Members({go}){
  const [sel,setSel]=useState(null);
  return (<div className="view">
   <div className="pg-h"><div className="wrap"><div className="eyebrow">LAWYERS</div><h1 className="serif">구성원 소개</h1><p>분야별 전담 변호사가 사건을 함께 검토합니다.</p></div></div>
   <div className="wrap mem">{MEMBERS.map((m,i)=><button key={m.n} className="mcard" style={{animation:'slideUp .5s '+i*70+'ms both'}} onClick={()=>setSel(sel===i?null:i)}>
     <div className="ph"><span className="ini serif">{m.n[0]}</span></div>
     <div className="bd"><h3 className="serif">{m.n}</h3><div style={{color:'var(--n7)',fontSize:14}}>{m.r}</div>{m.tags.map(t=><span key={t} className="tag">{t}</span>)}{sel===i&&<p style={{marginTop:12,fontSize:14,color:'var(--n8)',animation:'fadeIn .3s'}}>{m.c}</p>}</div></button>)}</div>
  </div>);
}

function App(){
  const [view,setView]=useState('법인 소개 홈');const [sel,setSel]=useState(1);const [msg,setMsg]=useState(null);
  const go=v=>{setView(v);window.scrollTo({top:0,behavior:'instant'});};
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(null),2200);};
  return (<>
   <header className="top"><div className="top-in">
     <button className="brand serif" onClick={()=>go('법인 소개 홈')}><span className="mark"><Ic n="scale" s={17}/></span>법무법인 해든 <small style={{fontSize:11,color:'var(--n7)',fontWeight:400}}>샘플</small></button>
     <nav className="nav">{NAV.map(n=><button key={n} className={view===n?'on':''} onClick={()=>go(n)}>{n}</button>)}</nav>
     <Btn className="btn-main btn-sm" onClick={()=>go('참여·문의 폼')}>상담 신청</Btn>
   </div></header>
   {view==='법인 소개 홈'&&<Hero go={go} setSel={setSel}/>}
   {view==='소송 목록'&&<Lawsuits go={go} setSel={setSel}/>}
   {view==='소송 상세'&&<Detail sel={sel} go={go} setSel={setSel}/>}
   {view==='참여·문의 폼'&&<Apply sel={sel} go={go} toast={toast}/>}
   {view==='구성원 소개'&&<Members go={go}/>}
   {view!=='소송 상세'&&<footer className="foot"><div className="wrap foot-in"><div><b className="serif" style={{fontSize:18}}>법무법인 해든</b><br/>서울특별시 샘플구 데모로 100 · 대표번호 02-000-0000<br/>© 2026 샘플 법무법인 — 자체 개발 프로젝트(구현 데모)</div><div>개인정보 처리방침 · 이용약관 안내(데모)</div></div></footer>}
   {msg&&<div className="toast">{msg}</div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
