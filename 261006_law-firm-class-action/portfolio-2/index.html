function Block({b,onChange}){
  const [type,val]=b;
  const H=<span className="hdl"><P n="dots-six-vertical"/></span>;
  const txt=onChange?<textarea className="ed" rows={Math.max(1,Math.ceil(String(val).length/70))} value={val} onChange={e=>onChange(e.target.value)}/>:<span>{val}</span>;
  if(type==='h') return <div className="block" data-block-type="heading">{H}<h2>{val}</h2></div>;
  if(type==='l') return <div className="block" data-block-type="list">{H}<ul>{val.map((x,i)=><li key={i}>{x}</li>)}</ul></div>;
  if(type==='t') return <div className="block" data-block-type="table">{H}<table className="t"><tbody>{val.map((r,i)=><tr key={i}>{r.map((c,j)=>i===0?<th key={j}>{c}</th>:<td key={j}>{c}</td>)}</tr>)}</tbody></table></div>;
  if(type==='c') return <div className="block callout" data-block-type="callout">{H}<P n="lightbulb"/>{txt}</div>;
  if(type==='q') return <div className="block quote" data-block-type="quote">{H}{txt}</div>;
  return <div className="block" data-block-type="paragraph">{H}{txt}</div>;
}

    <div className="card" style={{borderRadius:12,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',padding:14,alignSelf:'start'}}>
      <input className="inp" placeholder="가이드 검색" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
      {groups.map(g=><div key={g}><div className="tree-group">{g}</div>{hits.filter(x=>x.g===g).map(x=><button key={x.id} className={'tree-item '+(doc.id===x.id?'on':'')} style={{paddingLeft:28}} onClick={()=>setFocus(x.id)}><P n="file-text"/>{x.t}</button>)}</div>)}
      {!hits.length&&<div style={{color:'var(--n7)',padding:10}}>검색 결과가 없습니다</div>}
      <div style={{borderTop:'1px solid var(--n3)',marginTop:10,paddingTop:10,fontSize:12,color:'var(--n7)'}}>최근 열람: {rec.map(id=>GUIDE.find(g=>g.id===id).t).join(' · ')}</div>
    </div>
    <div className="card doc" style={{borderRadius:12,boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}><div className="blocks"><div className="page-breadcrumb" style={{marginBottom:10}}><span>가이드</span><span>›</span><span>{doc.g}</span></div>
      <div className="page-title" style={{fontSize:32}}>{doc.t}</div>
      {doc.blocks.map((b,i)=><Block key={doc.id+i} b={b}/>)}</div></div>
   </div></div>);
}

function History({his}){
  const [f,setF]=useState('전체');const types=['전체',...new Set(his.map(h=>h.type))];
  return (<div className="page"><div className="page-title">변경 이력</div><div className="page-sub">상태 변경·개인정보 열람·이관 작업이 변경자와 시각과 함께 기록됩니다.</div>
   <div className="card" style={{borderRadius:12,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',padding:16}}>
    <div className="chips" style={{marginBottom:12}}>{types.map(t=><button key={t} className={'chip '+(f===t?'on':'')} onClick={()=>setF(t)}>{t}</button>)}</div>
    <table className="t"><thead><tr><th>시각</th><th>작업자</th><th>유형</th><th>대상</th><th>변경 내용</th></tr></thead>
     <tbody>{his.filter(h=>f==='전체'||h.type===f).map(h=><tr key={h.id}><td className="num">{h.at}</td><td>{h.who}</td><td><span className="badge">{h.type}</span></td><td>{h.tgt}</td><td>{h.diff}</td></tr>)}</tbody></table>
   </div></div>);
}

function App(){
  const [view,setView]=useState('소송 관리');const [laws,setLaws]=useState(LAW0);const [inq,setInq]=useState(INQ0);const [his,setHis]=useState(HIS0);const [msg,setMsg]=useState(null);const [gf,setGf]=useState('g1');
  const [openG,setOpenG]=useState({'소송 운영':true,'데이터·문서':true,'감사':true});
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(null),2400);};
  const log=(type,tgt,diff)=>setHis(h=>[{id:h.length+1,at:'10-06 '+new Date().toTimeString().slice(0,5),who:'한도윤',type,tgt,diff},...h]);
  const setHelp=id=>{setGf(id);setView('사용 가이드');};
  const cnt={'참여·문의 접수함':inq.filter(i=>i.st==='신규').length};
  return (<div className="app">
   <aside className="sidebar tree-sidebar" data-tree-sidebar style={{width:240}}>
    <div className="sidebar-brand"><span className="lg"><P n="scales" b/></span>해든 관리자 <small style={{color:'var(--n7)',fontWeight:400}}>샘플</small></div>
    <div className="sidebar-search"><button className="sb-btn" onClick={()=>toast('검색은 소송·접수·가이드 전체에서 동작합니다')}><P n="magnifying-glass"/>검색</button><button className="sb-btn" onClick={()=>setView('소송 관리')}><P n="plus"/>새 소송 등록</button></div>
    <nav className="tree-nav">{NAVS.map(([g,items])=><div key={g}>
      <button className="tree-group" onClick={()=>setOpenG(o=>({...o,[g]:!o[g]}))}><P n={openG[g]?'caret-down':'caret-right'}/>{g}</button>
      {openG[g]&&items.map(([n,ic])=><button key={n} className={'tree-item child '+(view===n?'on':'')} style={{paddingLeft:28}} onClick={()=>setView(n)}><P n={ic}/><span className="tree-label">{n}</span>{cnt[n]>0&&<span className="cnt">{cnt[n]}</span>}</button>)}
    </div>)}
    <div className="tree-item child grandchild" style={{paddingLeft:56,fontSize:12,color:'var(--n7)'}}><span className="tree-toggle-placeholder"/>알림 큐 정상</div></nav>
    <div className="sidebar-footer"><span className="av">한</span><div style={{fontSize:12}}><b>한도윤</b><br/><span style={{color:'var(--n7)'}}>관리자 · 대표 변호사</span></div></div>
   </aside>
   <div className="main">
    <header className="topbar page-breadcrumb"><div className="page-breadcrumb"><span>관리자</span><span>›</span><span>{view}</span></div><button className="btn btn-ghost btn-sm" onClick={()=>setHelp(view==='데이터 이관'?'g4':view==='참여·문의 접수함'?'g3':'g2')}><P n="question"/>도움말</button></header>
    {view==='소송 관리'&&<Lawsuits laws={laws} setLaws={setLaws} log={log} toast={toast} setHelp={setHelp}/>}
    {view==='참여·문의 접수함'&&<Inbox inq={inq} setInq={setInq} laws={laws} log={log} toast={toast}/>}
    {view==='데이터 이관'&&<Migration log={log} toast={toast}/>}
    {view==='사용 가이드'&&<Guide focus={gf} setFocus={setGf}/>}
    {view==='변경 이력'&&<History his={his}/>}
   </div>
   {msg&&<div className="toast">{msg}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
