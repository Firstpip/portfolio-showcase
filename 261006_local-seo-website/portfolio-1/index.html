<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지역 서비스 SEO 웹사이트 빌더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m400 = plan primary */
  --m50:#e2ddff;
  --m100:#d0c8ff;
  --m200:#bcb1ff;
  --m300:#a99bff;
  --m400:#9685ff;
  --m500:#7b6dd1;
  --m600:#6055a3;
  --m700:#443c73;
  --m800:#443c73;
  --m900:#443c73;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#ffffff;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b6b5ba;
  --n6:#8f8f8f;
  --n7:#72717a;
  --n8:#54535a;
  --n9:#36363a;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=floating theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{font-family:'Pretendard',sans-serif;background:var(--n0);color:var(--n10);font-size:16px;line-height:1.43;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;letter-spacing:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--n10)}
.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;padding:20px 32px 40px;gap:24px}
/* 상단 알약 내비 */
.topnav{width:100%;max-width:1280px;margin:0 auto;height:64px;border-radius:52px;background:var(--n1);box-shadow:rgba(0,0,0,.06) 0 8px 30px;display:flex;align-items:center;padding:0 12px 0 28px;gap:12px;position:sticky;top:12px;z-index:20}
.brand{font-size:20px;font-weight:500;letter-spacing:-.017em;display:flex;align-items:center;gap:8px;color:var(--n10)}
.brand i{font-size:22px;color:var(--m600)}
.navlist{display:flex;gap:4px;margin-left:24px;flex:1}
.navbtn{height:40px;padding:0 16px;border-radius:30px;font-size:14px;color:var(--n7);transition:background .2s,color .2s;white-space:nowrap}
.navbtn:hover{background:var(--n2);color:var(--n10)}
.navbtn.on{background:var(--n10);color:var(--n0)}
.pill{height:40px;padding:0 22px;border-radius:30px;border:1px solid var(--n10);background:var(--n1);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform .2s,background .2s;position:relative;overflow:hidden}
.pill:hover{background:var(--n2)}
.pill.accent{border-color:var(--m600);color:var(--m600)}
.pill.lg{height:52px;padding:0 28px;font-size:16px}
.page{width:100%;max-width:1280px;margin:0 auto;animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glowDrift{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-46%,-14px) scale(1.08)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m400) 55%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card{background:var(--n1);border-radius:30px;padding:32px;box-shadow:rgba(0,0,0,.06) 0 8px 30px;border:1px solid var(--n3)}
.eyebrow{font-size:14px;color:var(--n6);display:flex;align-items:center;gap:8px}
.h-lg{font-size:44px;line-height:1.15;font-weight:400;letter-spacing:-.017em}
.h-sm{font-size:32px;line-height:1.2;font-weight:400;letter-spacing:-.017em}
.sub{font-size:20px;line-height:1.25;color:var(--n9)}
.muted{color:var(--n6)}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:30px;background:var(--n2);font-size:14px;color:var(--n8)}
.tag.ok{background:var(--s1-bg);color:var(--s1-text)}
.tag.warn{background:var(--s3-bg);color:var(--s3-text)}
.tag.err{background:var(--s2-bg);color:var(--s2-text)}
.tag.live{background:var(--n10);color:var(--n0)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--m400);animation:pulseDot 1.8s infinite}
/* 에디터 */
.editor-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
.editor{display:grid;grid-template-columns:288px minmax(0,1fr) 320px;gap:20px;align-items:start}
.panel{background:var(--n1);border-radius:30px;padding:24px;box-shadow:rgba(0,0,0,.06) 0 8px 30px;border:1px solid var(--n3)}
.panel h3{font-size:20px;font-weight:500;letter-spacing:-.012em;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.blk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;border:1px solid var(--n3);margin-bottom:8px;width:100%;text-align:left;transition:border-color .2s,background .2s,transform .2s;background:var(--n1)}
.blk:hover{background:var(--n2);transform:translateX(2px)}
.blk.sel{border-color:var(--n10);background:var(--n2)}
.blk i{font-size:20px;color:var(--n7)}
.blk b{font-weight:500;font-size:14px;display:block}
.blk span{font-size:14px;color:var(--n6)}
.regionbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{height:36px;padding:0 16px;border-radius:30px;border:1px solid var(--n4);font-size:14px;color:var(--n8);transition:all .2s}
.chip:hover{border-color:var(--n10)}
.chip.on{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.urlbar{display:flex;align-items:center;gap:10px;background:var(--n2);border-radius:30px;padding:10px 18px;font-size:14px;color:var(--n8);margin-bottom:16px}
.urlbar i{color:var(--n6)}
.canvas{border-radius:30px;border:1px solid var(--n3);background:var(--n1);overflow:hidden;box-shadow:rgba(0,0,0,.12) 0 27px 104px}
.cv-block{padding:28px 36px;border-bottom:1px dashed var(--n3);position:relative;cursor:pointer;transition:background .2s}
.cv-block:hover{background:var(--n2)}
.cv-block.sel{outline:2px solid var(--n10);outline-offset:-2px;background:var(--n1)}
.cv-tag{position:absolute;top:10px;right:14px;font-size:12px;color:var(--n6);opacity:0;transition:opacity .2s}
.cv-block:hover .cv-tag,.cv-block.sel .cv-tag{opacity:1}
.cv-hero h2{font-size:44px;line-height:1.15;letter-spacing:-.017em;font-weight:400;color:var(--m600)}
.cv-hero p{margin-top:12px;color:var(--n7);font-size:18px}
.cv-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.cv-feat div{border:1px solid var(--n3);border-radius:20px;padding:16px;font-size:14px}
.cv-feat b{display:block;font-size:16px;font-weight:500;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:14px;color:var(--n7)}
.input{width:100%;height:44px;border:1px solid var(--n4);border-radius:16px;padding:0 14px;background:var(--n1);transition:border-color .2s}
textarea.input{height:96px;padding:12px 14px;resize:none;line-height:1.5}
.field .hint{font-size:12px;color:var(--n6)}
.field .err{font-size:12px;color:var(--s2-text);display:flex;gap:4px;align-items:center}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:14px 22px;border-radius:30px;font-size:14px;display:flex;gap:10px;align-items:center;animation:popIn .3s ease both;z-index:50}
.row-actions{display:flex;gap:6px}
.mini{width:32px;height:32px;border-radius:50%;border:1px solid var(--n4);display:inline-flex;align-items:center;justify-content:center;color:var(--n7);transition:all .2s}
.mini:hover{border-color:var(--n10);color:var(--n10)}
/* 랜딩 */
.hero{position:relative;text-align:center;padding:56px 0 24px;overflow:hidden}
.glow{position:absolute;left:50%;top:150px;width:720px;height:480px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--m400) 38%,transparent),transparent);transform:translate(-50%,0);animation:glowDrift 9s ease-in-out infinite;pointer-events:none}
.hero h1{position:relative;font-size:84px;line-height:1.1;font-weight:400;letter-spacing:-.017em;color:var(--m600)}
.hero h1 span{color:var(--n10)}
.hero p{position:relative;margin:20px auto 0;font-size:20px;color:var(--n7);max-width:560px}
.hero .ctas{position:relative;display:flex;gap:12px;justify-content:center;margin-top:28px}
.browser{position:relative;margin:44px auto 0;width:760px;max-width:100%;border-radius:30px;background:var(--n1);box-shadow:rgba(0,0,0,.25) 0 9px 46px;overflow:hidden;text-align:left;border:1px solid var(--n3)}
.browser .bar{height:44px;border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:8px;padding:0 18px;font-size:12px;color:var(--n6)}
.browser .bar i.d{width:10px;height:10px;border-radius:50%;background:var(--n4);display:inline-block}
.browser .body{padding:24px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--n2) 0,var(--n3) 100px,var(--n2) 200px);background-size:400px 100%;animation:shimmer 1.6s linear infinite;margin-bottom:10px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.icon-tile{width:96px;height:96px;border-radius:45px;background:var(--n1);box-shadow:rgba(0,0,0,.12) 0 27px 104px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:28px}
.sec{margin-top:90px;text-align:center}
.faq{max-width:760px;margin:32px auto 0;text-align:left}
.faq-item{border-bottom:1px solid var(--n3);padding:20px 4px}
.faq-q{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:18px;text-align:left}
.faq-a{color:var(--n7);margin-top:10px;font-size:16px;animation:fadeUp .3s ease both}
.cta-band{margin-top:90px;border-radius:45px;padding:56px;text-align:center;background:var(--n1);box-shadow:rgba(0,0,0,.11) 0 8px 127px;border:1px solid var(--n3)}
/* SEO */
.tabs{display:flex;gap:8px;margin-bottom:20px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-weight:400;color:var(--n6);padding:10px 12px;border-bottom:1px solid var(--n3)}
.table td{padding:14px 12px;border-bottom:1px solid var(--n3);vertical-align:middle}
.table tr.hl td{background:var(--n2)}
.table tr{transition:background .2s}
.meter{height:6px;border-radius:3px;background:var(--n3);width:90px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--n10);transform-origin:left;animation:barGrow .8s ease both}
pre.code{background:var(--n10);color:var(--n2);border-radius:20px;padding:24px;font-size:13px;line-height:1.7;overflow:auto;font-family:ui-monospace,Menlo,monospace;letter-spacing:0}
pre.code .k{color:var(--n5)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.checklist li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--n3);font-size:14px}
.checklist i{font-size:20px;margin-top:1px}
/* 문의 */
.inq{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.success{text-align:center;padding:48px 16px;animation:popIn .4s ease both}
.success .ring{width:96px;height:96px;border-radius:45px;background:var(--n1);box-shadow:rgba(0,0,0,.12) 0 27px 104px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:40px}
.log li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--n3);font-size:14px}
@media (max-width:1100px){.editor,.inq,.two{grid-template-columns:1fr}.hero h1{font-size:52px}.svc-grid{grid-template-columns:1fr}.navlist{overflow:auto}}
@media (max-width:480px){.shell{padding:12px}.topnav{padding:0 12px;overflow:auto}.hero h1{font-size:40px}.h-lg{font-size:32px}.cv-feat,.grid2,.browser .body{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="width:100%">
<div id="root" style="width:100%"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef} = React;
const REGIONS=[
 {slug:'gangnam',name:'강남',city:'서울',svc:'방문 상담'},
 {slug:'haeundae',name:'해운대',city:'부산',svc:'방문 상담'},
 {slug:'bundang',name:'분당',city:'경기',svc:'방문 상담'},
 {slug:'suwon',name:'수원',city:'경기',svc:'방문 상담'},
];
const BLOCK_TYPES={hero:{icon:'ph-image-square',label:'히어로'},feat:{icon:'ph-squares-four',label:'서비스 카드'},faq:{icon:'ph-question',label:'자주 묻는 질문'},cta:{icon:'ph-cursor-click',label:'문의 유도'}};
const INIT=[
 {id:1,type:'hero',title:'{지역명}에서 가장 가까운 방문 서비스',body:'{지역명} 전 지역 당일 방문 상담을 제안드립니다.'},
 {id:2,type:'feat',title:'{지역명} 대표 서비스 3가지',body:'상담 · 현장 방문 · 사후 관리'},
 {id:3,type:'faq',title:'{지역명} 방문 일정은 어떻게 잡나요?',body:'문의 접수 후 담당자가 일정을 안내합니다.'},
 {id:4,type:'cta',title:'{지역명} 상담 신청하기',body:'연락처만 남기면 담당자가 연락드립니다.'},
];
const fill=(s,r)=>s.split('{지역명}').join(r.name);
function Toast({msg}){return msg?<div className="toast"><i className="ph ph-check-circle"></i>{msg}</div>:null}

function Editor({toast}){
 const [region,setRegion]=useState(REGIONS[0]);
 const [blocks,setBlocks]=useState(INIT);
 const [sel,setSel]=useState(1);
 const [saving,setSaving]=useState(false);
 const cur=blocks.find(b=>b.id===sel);
 const upd=(k,v)=>setBlocks(bs=>bs.map(b=>b.id===sel?{...b,[k]:v}:b));
 const move=(id,d)=>setBlocks(bs=>{const i=bs.findIndex(b=>b.id===id),j=i+d;if(j<0||j>=bs.length)return bs;const c=[...bs];[c[i],c[j]]=[c[j],c[i]];return c});
 const del=id=>{setBlocks(bs=>bs.filter(b=>b.id!==id));if(sel===id)setSel(null)};
 const add=t=>{const id=Date.now();setBlocks(bs=>[...bs,{id,type:t,title:'{지역명} 새 블록',body:'내용을 입력해 주세요.'}]);setSel(id)};
 const save=()=>{setSaving(true);setTimeout(()=>{setSaving(false);toast(region.name+' 페이지가 저장되었습니다')},900)};
 const titleErr=cur&&cur.title.trim()===''?'제목을 입력해 주세요':'';
 return <div className="page">
  <div className="editor-head">
   <div><div className="eyebrow"><span className="dot"></span>템플릿 · 지역 방문 서비스</div>
    <h1 className="h-lg" style={{marginTop:8}}>지역 페이지 편집</h1></div>
   <div style={{display:'flex',gap:10}}>
    <button className="pill" onClick={()=>{setBlocks(INIT);setSel(1);toast('기본 템플릿으로 되돌렸습니다')}}><i className="ph ph-arrow-counter-clockwise"></i>초기화</button>
    <button className="pill accent" data-loading={saving} onClick={save}><i className="ph ph-floppy-disk"></i>저장하기</button>
   </div>
  </div>
  <div className="editor">
   <aside className="panel">
    <h3>블록 구성 <span className="tag">{blocks.length}개</span></h3>
    {blocks.map((b,i)=>(
     <div key={b.id} style={{position:'relative'}}>
      <button className={'blk'+(b.id===sel?' sel':'')} onClick={()=>setSel(b.id)}>
       <i className={'ph '+BLOCK_TYPES[b.type].icon}></i>
       <div style={{flex:1,minWidth:0}}><b>{BLOCK_TYPES[b.type].label}</b><span>{fill(b.title,region).slice(0,16)}</span></div>
      </button>
      {b.id===sel&&<div className="row-actions" style={{position:'absolute',right:10,top:10,background:'var(--n1)'}}>
       <button className="mini" aria-label="위로" onClick={()=>move(b.id,-1)} disabled={i===0}><i className="ph ph-arrow-up"></i></button>
       <button className="mini" aria-label="아래로" onClick={()=>move(b.id,1)} disabled={i===blocks.length-1}><i className="ph ph-arrow-down"></i></button>
       <button className="mini" aria-label="삭제" onClick={()=>del(b.id)}><i className="ph ph-trash"></i></button>
      </div>}
     </div>))}
    <div style={{marginTop:16,display:'flex',gap:8,flexWrap:'wrap'}}>
     {Object.keys(BLOCK_TYPES).map(t=><button key={t} className="chip" onClick={()=>add(t)}>+ {BLOCK_TYPES[t].label}</button>)}
    </div>
   </aside>
   <section>
    <div className="regionbar">{REGIONS.map(r=><button key={r.slug} className={'chip'+(r.slug===region.slug?' on':'')} onClick={()=>setRegion(r)}>{r.city} · {r.name}</button>)}</div>
    <div className="urlbar"><i className="ph ph-lock-simple"></i>샘플도메인.kr/<b style={{color:'var(--n10)',fontWeight:500}}>{region.slug}</b><span style={{marginLeft:'auto'}} className="tag live">미리보기</span></div>
    <div className="canvas">
     {blocks.length===0&&<div style={{padding:60,textAlign:'center'}} className="muted">블록이 없습니다. 좌측에서 블록을 추가해 주세요.</div>}
     {blocks.map(b=>(
      <div key={b.id} className={'cv-block'+(b.id===sel?' sel':'')} onClick={()=>setSel(b.id)}>
       <span className="cv-tag">{BLOCK_TYPES[b.type].label}</span>
       {b.type==='hero'?<div className="cv-hero"><h2>{fill(b.title,region)}</h2><p>{fill(b.body,region)}</p></div>
       :b.type==='feat'?<div><div className="sub" style={{marginBottom:14}}>{fill(b.title,region)}</div><div className="cv-feat">{['상담','현장 방문','사후 관리'].map((t,i)=><div key={i}><b>{t}</b><span className="muted">{region.name} 담당 팀 배정</span></div>)}</div></div>
       :b.type==='faq'?<div><div className="sub">{fill(b.title,region)}</div><p className="muted" style={{marginTop:8}}>{fill(b.body,region)}</p></div>
       :<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:16}}><div><div className="sub">{fill(b.title,region)}</div><p className="muted" style={{marginTop:6}}>{fill(b.body,region)}</p></div><span className="pill">상담 신청</span></div>}
      </div>))}
    </div>
   </section>
   <aside className="panel">
    <h3>속성 {cur&&<span className="tag">{BLOCK_TYPES[cur.type].label}</span>}</h3>
    {cur?<>
     <div className="field"><label>제목</label><input className="input" value={cur.title} aria-invalid={!!titleErr} onChange={e=>upd('title',e.target.value)}/>
      {titleErr?<span className="err"><i className="ph ph-warning-circle"></i>{titleErr}</span>:<span className="hint">{'{지역명}'} 변수는 지역별로 자동 치환됩니다</span>}</div>
     <div className="field"><label>본문</label><textarea className="input" value={cur.body} onChange={e=>upd('body',e.target.value)}/></div>
     <div className="field"><label>미리보기 지역</label><select className="input" value={region.slug} onChange={e=>setRegion(REGIONS.find(r=>r.slug===e.target.value))}>{REGIONS.map(r=><option key={r.slug} value={r.slug}>{r.city} {r.name}</option>)}</select></div>
     <div style={{background:'var(--n2)',borderRadius:20,padding:16,fontSize:13,color:'var(--n8)',lineHeight:1.6}}>이 템플릿을 쓰는 지역 페이지 <b>{REGIONS.length}개</b>에 변경이 일괄 적용됩니다.</div>
    </>:<p className="muted" style={{fontSize:14}}>캔버스에서 블록을 선택하면 속성을 편집할 수 있습니다.</p>}
   </aside>
  </div>
 </div>;
}

function Landing({toast,go}){
 const [r,setR]=useState(REGIONS[0]);
 const [open,setOpen]=useState(0);
 const faqs=[['방문 가능한 지역은 어디까지인가요?','서울·경기 전 지역과 부산 일부 지역을 제안드립니다.'],['상담 후 일정은 어떻게 잡나요?','접수한 연락처로 담당자가 가능한 일정을 안내합니다.'],['비용은 어떻게 안내되나요?','현장 확인 후 항목별 견적을 먼저 제안드립니다.']];
 return <div className="page">
  <div className="hero">
   <div className="glow"></div>
   <div className="regionbar" style={{justifyContent:'center',position:'relative'}}>{REGIONS.map(x=><button key={x.slug} className={'chip'+(x.slug===r.slug?' on':'')} onClick={()=>setR(x)}>{x.name}</button>)}</div>
   <h1>{r.name}<span> 방문 서비스,</span><br/>가까운 곳에서</h1>
   <p>{r.city} {r.name} 지역 고객을 위한 방문 상담과 사후 관리를 제안드립니다.</p>
   <div className="ctas"><button className="pill lg" onClick={()=>go('inquiry')}><i className="ph ph-calendar-check"></i>방문 상담 신청</button><button className="pill lg" onClick={()=>toast('전화 상담 안내가 표시됩니다')}><i className="ph ph-phone"></i>전화 상담</button></div>
   <div className="browser">
    <div className="bar"><i className="d"></i><i className="d"></i><i className="d"></i><span style={{marginLeft:10}}>샘플도메인.kr/{r.slug}</span></div>
    <div className="body"><div><div className="skel" style={{width:'70%',height:18}}></div><div className="skel"></div><div className="skel" style={{width:'86%'}}></div><div className="skel" style={{width:'60%'}}></div></div>
     <div style={{display:'flex',flexDirection:'column',gap:10}}><span className="tag live" style={{alignSelf:'flex-start'}}><span className="dot"></span>서버에서 렌더링됨</span><span className="tag">title · {r.name} 방문 서비스</span><span className="tag">h1 · {r.name} 방문 서비스, 가까운 곳에서</span><span className="tag">JSON-LD · LocalBusiness</span></div></div>
   </div>
  </div>
  <div className="sec"><div className="icon-tile" style={{margin:'0 auto 28px'}}><i className="ph ph-map-pin-area"></i></div>
   <h2 className="h-lg">{r.name}에서 제공하는 서비스</h2>
   <div className="svc-grid" style={{textAlign:'left'}}>
    {[['ph-chats-circle','방문 전 상담','접수 즉시 담당자가 연락해 방문 일정을 조율합니다.'],['ph-house-line','현장 방문','지역 담당 팀이 직접 방문해 상태를 확인합니다.'],['ph-shield-check','사후 관리','방문 이후 변경 사항을 접수하고 이력을 관리합니다.']].map(([ic,t,d])=>
     <div key={t} className="card" style={{transition:'transform .25s'}} onMouseEnter={e=>e.currentTarget.style.transform='translateY(-6px)'} onMouseLeave={e=>e.currentTarget.style.transform='none'}><i className={'ph '+ic} style={{fontSize:32}}></i><h3 className="h-sm" style={{marginTop:20,fontSize:28}}>{t}</h3><p className="muted" style={{marginTop:12,fontSize:18}}>{d}</p></div>)}
   </div></div>
  <div className="sec"><h2 className="h-lg">자주 묻는 질문</h2>
   <div className="faq">{faqs.map(([q,a],i)=><div key={i} className="faq-item"><button className="faq-q" onClick={()=>setOpen(open===i?-1:i)}>{q.replace('지역',r.name+' 지역')}<i className={'ph '+(open===i?'ph-minus':'ph-plus')}></i></button>{open===i&&<p className="faq-a">{a}</p>}</div>)}</div></div>
  <div className="cta-band"><h2 className="h-lg">{r.name} 상담, 지금 접수하세요</h2><p className="muted" style={{margin:'12px 0 24px',fontSize:18}}>연락처를 남기면 담당자가 일정을 안내합니다.</p><button className="pill lg" onClick={()=>go('inquiry')}>상담 신청하기<i className="ph ph-arrow-right"></i></button></div>
 </div>;
}

const PAGES=[
 {p:'/gangnam',t:'강남 방문 서비스 | 샘플 로컬',tl:26,d:78,h:'강남 방문 서비스, 가까운 곳에서',st:'ok'},
 {p:'/haeundae',t:'해운대 방문 서비스 | 샘플 로컬',tl:28,d:74,h:'해운대 방문 서비스, 가까운 곳에서',st:'ok'},
 {p:'/bundang',t:'분당 방문 서비스 | 샘플 로컬',tl:26,d:0,h:'분당 방문 서비스, 가까운 곳에서',st:'err'},
 {p:'/suwon',t:'강남 방문 서비스 | 샘플 로컬',tl:26,d:70,h:'수원 방문 서비스, 가까운 곳에서',st:'warn'},
];
function Seo({toast}){
 const [tab,setTab]=useState('meta');
 const [selP,setSelP]=useState(0);
 const pg=PAGES[selP];
 const label={ok:'정상',warn:'제목 중복',err:'설명 누락'};
 const ld=`{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "샘플 로컬 ${pg.p.slice(1)}",
  "areaServed": "${pg.h.split(' ')[0]}",
  "url": "https://샘플도메인.kr${pg.p}",
  "makesOffer": { "@type": "Offer", "name": "방문 상담" }
}`;
 return <div className="page">
  <div className="editor-head"><div><div className="eyebrow"><i className="ph ph-magnifying-glass"></i>서버 렌더링 결과 점검</div><h1 className="h-lg" style={{marginTop:8}}>메타 · 구조화 데이터</h1></div>
   <button className="pill accent" onClick={()=>toast('사이트맵 4개 URL이 갱신되었습니다')}><i className="ph ph-arrows-clockwise"></i>사이트맵 갱신</button></div>
  <div className="tabs">{[['meta','메타태그'],['ld','JSON-LD'],['map','사이트맵 · robots']].map(([k,l])=><button key={k} className={'chip'+(tab===k?' on':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
  <div className="two">
   <div className="card" style={{padding:24}}>
    {tab==='meta'&&<table className="table"><thead><tr><th>경로</th><th>Title</th><th>Description</th><th>상태</th></tr></thead><tbody>
     {PAGES.map((x,i)=><tr key={x.p} className={i===selP?'hl':''} style={{cursor:'pointer'}} onClick={()=>setSelP(i)}><td>{x.p}</td><td>{x.t}</td><td><div className="meter"><i style={{width:Math.min(100,x.d/1.6)+'%'}}></i></div><span className="muted num" style={{fontSize:12}}>{x.d}자</span></td><td><span className={'tag '+x.st}>{label[x.st]}</span></td></tr>)}</tbody></table>}
    {tab==='ld'&&<pre className="code">{ld}</pre>}
    {tab==='map'&&<pre className="code">{`User-agent: *\nAllow: /\nDisallow: /admin\nSitemap: https://샘플도메인.kr/sitemap.xml\n\n`}{PAGES.map(x=>`<url><loc>https://샘플도메인.kr${x.p}</loc></url>`).join('\n')}</pre>}
   </div>
   <div className="card" style={{padding:24}}>
    <h3 className="sub" style={{marginBottom:6}}>{pg.p} 점검</h3><p className="muted" style={{fontSize:14}}>선택한 지역 페이지의 서버 렌더링 결과입니다.</p>
    <ul className="checklist" style={{marginTop:12}}>
     {[['Title 고유함',pg.st!=='warn','ph-check-circle'],['Description 입력됨',pg.d>0,'ph-check-circle'],['H1 1개 포함',true,'ph-check-circle'],['canonical 지정',true,'ph-check-circle'],['JSON-LD 필수 속성',true,'ph-check-circle'],['사이트맵 포함',true,'ph-check-circle']].map(([l,ok])=><li key={l}><i className={'ph '+(ok?'ph-check-circle':'ph-warning')} style={{color:ok?'var(--n10)':'var(--s3)'}}></i><span>{l}</span><span style={{marginLeft:'auto'}} className={'tag '+(ok?'':'warn')}>{ok?'통과':'확인 필요'}</span></li>)}
    </ul>
    <button className="pill" style={{marginTop:18}} onClick={()=>toast(pg.p+' 점검을 다시 실행했습니다')}><i className="ph ph-play"></i>다시 점검</button>
   </div>
  </div>
 </div>;
}

function Inquiry({toast}){
 const [f,setF]=useState({name:'',phone:'',region:'gangnam',date:'',memo:''});
 const [errs,setErrs]=useState({});
 const [busy,setBusy]=useState(false);
 const [done,setDone]=useState(false);
 const [log,setLog]=useState([['김민수','강남','방금 전'],['이지은','분당','12분 전'],['박서준','해운대','1시간 전']]);
 const set=(k,v)=>setF({...f,[k]:v});
 const submit=()=>{
  const e={};
  if(!f.name.trim())e.name='이름을 입력해 주세요';
  if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(f.phone))e.phone='연락처 형식을 확인해 주세요 (예: 010-1234-5678)';
  if(!f.date)e.date='희망 일정을 선택해 주세요';
  setErrs(e);if(Object.keys(e).length)return;
  setBusy(true);setTimeout(()=>{setBusy(false);setDone(true);setLog([[f.name,REGIONS.find(r=>r.slug===f.region).name,'방금 전'],...log]);toast('접수가 저장되었습니다')},900);
 };
 return <div className="page">
  <div className="editor-head"><div><div className="eyebrow"><i className="ph ph-envelope-simple"></i>방문자 접수</div><h1 className="h-lg" style={{marginTop:8}}>문의 · 예약 접수</h1></div></div>
  <div className="inq">
   <div className="card">
    {done?<div className="success"><div className="ring"><i className="ph ph-check"></i></div><h2 className="h-sm">접수가 완료되었습니다</h2><p className="muted" style={{margin:'12px 0 24px',fontSize:18}}>유입 지역: {REGIONS.find(r=>r.slug===f.region).name} 페이지 · 담당자가 연락드립니다</p><button className="pill" onClick={()=>{setDone(false);setF({name:'',phone:'',region:'gangnam',date:'',memo:''})}}>새 문의 작성</button></div>:<>
    <div className="grid2">
     <div className="field"><label>이름</label><input className="input" placeholder="홍길동" value={f.name} aria-invalid={!!errs.name} onChange={e=>set('name',e.target.value)}/>{errs.name&&<span className="err"><i className="ph ph-warning-circle"></i>{errs.name}</span>}</div>
     <div className="field"><label>연락처</label><input className="input" placeholder="010-0000-0000" value={f.phone} aria-invalid={!!errs.phone} onChange={e=>set('phone',e.target.value)}/>{errs.phone&&<span className="err"><i className="ph ph-warning-circle"></i>{errs.phone}</span>}</div>
     <div className="field"><label>문의 지역</label><select className="input" value={f.region} onChange={e=>set('region',e.target.value)}>{REGIONS.map(r=><option key={r.slug} value={r.slug}>{r.city} {r.name}</option>)}</select></div>
     <div className="field"><label>희망 일정</label><input type="date" className="input" value={f.date} aria-invalid={!!errs.date} onChange={e=>set('date',e.target.value)}/>{errs.date&&<span className="err"><i className="ph ph-warning-circle"></i>{errs.date}</span>}</div>
    </div>
    <div className="field"><label>문의 내용</label><textarea className="input" placeholder="필요한 서비스를 알려 주세요" value={f.memo} onChange={e=>set('memo',e.target.value)}/></div>
    <button className="pill lg" data-loading={busy} onClick={submit}>접수하기<i className="ph ph-paper-plane-tilt"></i></button></>}
   </div>
   <div className="card" style={{padding:24}}>
    <h3 className="sub">최근 접수</h3><p className="muted" style={{fontSize:14,margin:'4px 0 8px'}}>유입 지역 페이지와 함께 저장됩니다</p>
    <ul className="log">{log.map(([n,r,t],i)=><li key={i}><span><b style={{fontWeight:500}}>{n}</b> <span className="muted">· {r}</span></span><span className="muted">{t}</span></li>)}</ul>
   </div>
  </div>
 </div>;
}

function App(){
 const [view,setView]=useState('main');
 const [msg,setMsg]=useState('');
 const t=useRef();
 const toast=m=>{setMsg(m);clearTimeout(t.current);t.current=setTimeout(()=>setMsg(''),2200)};
 const NAV=[['main','지역 페이지 템플릿 에디터'],['landing','지역별 동적 랜딩페이지'],['seo','테크니컬 SEO 메타 및 구조화 데이터'],['inquiry','문의·예약 접수 폼']];
 return <div className="shell" style={{width:'100%'}}>
  <header className="topnav">
   <div className="brand"><i className="ph-bold ph-map-pin-line"></i>로컬리프</div>
   <nav className="navlist">{NAV.map(([k,l])=><button key={k} className={'navbtn'+(view===k?' on':'')} onClick={()=>setView(k)}>{l}</button>)}</nav>
   <button className="pill" onClick={()=>toast('게시 전 점검을 먼저 실행합니다')}><i className="ph ph-rocket-launch"></i>게시하기</button>
  </header>
  <main style={{flex:1,width:'100%'}} key={view}>
   {view==='main'&&<Editor toast={toast}/>}
   {view==='landing'&&<Landing toast={toast} go={setView}/>}
   {view==='seo'&&<Seo toast={toast}/>}
   {view==='inquiry'&&<Inquiry toast={toast}/>}
  </main>
  <footer className="muted" style={{textAlign:'center',fontSize:14}}>© 2026 샘플 로컬 — 자체 개발 프로젝트</footer>
  <Toast msg={msg}/>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
