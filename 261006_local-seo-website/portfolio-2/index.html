<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지역 페이지 CMS·SEO 운영 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#edfdf7;
  --m100:#dbfaef;
  --m200:#b8f6df;
  --m300:#8cf0cc;
  --m400:#5ceab7;
  --m500:#2ee4a2;
  --m600:#00de8e;
  --m700:#00b674;
  --m800:#008e5b;
  --m900:#006440;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f6f5f4;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e6e6;
  --n4:#d5d7d7;
  --n5:#b5bab8;
  --n6:#909895;
  --n7:#757575;
  --n8:#535a58;
  --n9:#363a39;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:'Pretendard',sans-serif;background:var(--n0);color:var(--n10);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--n10)}
.app{display:flex;width:100%;min-height:100vh}
.tree-sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n2);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:12px 8px;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-weight:600;font-size:14px;margin-bottom:8px}
.ws .lg{width:24px;height:24px;border-radius:6px;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:14px}
.tree-item{display:flex;align-items:center;gap:6px;height:30px;border-radius:8px;padding-right:8px;font-size:14px;color:var(--n8);width:100%;text-align:left;transition:background .15s;animation:slideIn .3s ease both}
.tree-item:hover{background:var(--n3)}
.tree-item.on{background:var(--n3);color:var(--n10);font-weight:500}
.tree-toggle,.tree-toggle-placeholder{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--n6);font-size:14px;flex:none}
.tree-icon{font-size:16px;color:var(--n7)}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{font-size:12px;color:var(--n6);padding:14px 8px 4px;letter-spacing:.01em}
.sb-foot{margin-top:auto;border-top:1px solid var(--n3);padding-top:8px}
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:44px;border-bottom:1px solid var(--n3);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;color:var(--n7);background:var(--n0);position:sticky;top:0;z-index:10}
.page-breadcrumb{display:flex;gap:8px;align-items:center}
.page-breadcrumb .cur{color:var(--n10)}
.btn{height:32px;padding:6px 15px;border-radius:8px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s,filter .15s}
.btn.pri{background:var(--m600);color:var(--n10)}
.btn.pri:hover{background:var(--m700)}
.btn.sec{background:var(--n2);color:var(--n10)}
.btn.sec:hover{background:var(--n3)}
.btn.ghost{color:var(--n8)}
.btn.ghost:hover{background:var(--n2)}
.btn.out{border:1px solid var(--n4);border-radius:4px;height:28px;padding:5px 10px;font-size:13px}
.btn.out:hover{background:var(--n2)}
.content{flex:1;min-height:0;display:flex}
.list-rail{width:288px;flex:none;border-right:1px solid var(--n3);padding:16px 12px;overflow:auto;height:calc(100vh - 44px);position:sticky;top:44px}
.search{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--n4);border-radius:8px;padding:0 10px;background:var(--n1);margin-bottom:10px}
.search input{border:none;outline:none;flex:1;background:none}
.fl{display:flex;gap:6px;margin-bottom:12px}
.pillf{height:26px;padding:0 12px;border-radius:9999px;font-size:12px;background:var(--n2);color:var(--n8);transition:background .15s}
.pillf.on{background:var(--n10);color:var(--n0)}
.li{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid transparent;transition:background .15s;margin-bottom:2px}
.li:hover{background:var(--n2)}
.li.on{background:var(--n1);border-color:var(--n3)}
.li b{font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.li span.p{font-size:12px;color:var(--n6)}
.detail-panel{flex:1;min-width:0;overflow:auto;height:calc(100vh - 44px)}
.page-body{max-width:880px;margin:0 auto;padding:32px 40px 80px;animation:fadeUp .35s ease both}
.page-title{font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px}
.meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:24px;font-size:14px;color:var(--n7)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;background:var(--n3);color:var(--n9)}
.pill.dark{background:var(--n10);color:var(--n0)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.err{background:var(--s2-bg);color:var(--s2-text)}
.card{background:var(--n1);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:24px}
.block{position:relative;padding:4px 0;margin-bottom:4px}
.block-handle{position:absolute;left:-30px;top:6px;color:var(--n5);opacity:0;font-size:16px;transition:opacity .15s}
.block:hover .block-handle{opacity:1}
.block h2{font-size:30px;line-height:1.25;font-weight:600;letter-spacing:-.025em;margin:20px 0 8px}
.block h3{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.011em;margin:16px 0 6px}
.block p{font-size:16px;color:var(--n9)}
.block-callout{display:flex;gap:12px;background:var(--n2);border-radius:12px;padding:16px 20px;margin:12px 0;border-left:4px solid var(--m600)}
.block-callout i{font-size:20px;margin-top:2px}
.field{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--n3)}
.field label{font-size:14px;color:var(--n7);padding-top:8px}
.input{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;transition:background .15s,border-color .15s}
.input:hover{background:var(--n2)}
.input:focus{background:var(--n1);border-color:var(--m600)}
textarea.input{resize:none;line-height:1.5;min-height:64px}
.cnt{font-size:12px;color:var(--n6);text-align:right;padding-top:2px}
.cnt.bad{color:var(--s2-text)}
.toggle{display:flex;gap:8px;align-items:center;padding:4px 0;width:100%;text-align:left;font-size:15px}
.toggle-content{margin-left:26px;color:var(--n8);font-size:14px;animation:fadeUp .25s ease both}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.tbl th{text-align:left;font-weight:500;color:var(--n7);padding:8px 10px;border-bottom:1px solid var(--n4);font-size:13px}
table.tbl td{padding:10px;border-bottom:1px solid var(--n3)}
table.tbl tr{transition:background .15s}
table.tbl tbody tr:hover{background:var(--n2)}
.slash{margin-top:10px;font-size:14px;color:var(--n6);display:flex;align-items:center;gap:8px;padding:6px 0}
.slash kbd{border:1px solid var(--n4);border-radius:4px;padding:0 6px;font-size:12px;background:var(--n1)}
.bar{height:8px;border-radius:4px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m600);transform-origin:left;animation:barGrow .7s ease both}
.status-line{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.stat{flex:1;min-width:140px;border:1px solid var(--n3);border-radius:12px;padding:14px 16px;background:var(--n1)}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--n6)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n0);border-radius:8px;padding:12px 16px;font-size:14px;display:flex;gap:8px;align-items:center;animation:slideIn .25s ease both;z-index:60}
.sw{width:36px;height:20px;border-radius:10px;background:var(--n4);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--n1);transition:transform .2s}
.sw.on{background:var(--n10)}
.sw.on::after{transform:translateX(16px)}
.spin{animation:spin .8s linear infinite;display:inline-block}
.cover{height:132px;border-radius:12px;margin-bottom:20px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--m100) 0%,var(--n2) 55%,var(--n3) 100%);border:1px solid var(--n3)}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .route{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-width:1100px){.list-rail{width:220px}.page-body{padding:24px 20px}.field{grid-template-columns:1fr}}
@media (max-width:480px){.tree-sidebar{display:none}.main-wrap{margin-left:0;width:100%}.content{flex-direction:column}.list-rail{width:100%;height:auto;position:static}.detail-panel{height:auto}.page-title{font-size:30px}}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body data-archetype="notion-blocks-tree" style="width:100%">
<div id="root" style="width:100%"></div>
<script type="text/babel">
const {useState,useMemo,useRef} = React;
const PAGES0=[
 {id:1,city:'서울',name:'강남',slug:'gangnam',status:'published',title:'강남 방문 서비스 | 샘플 로컬',desc:'강남 전 지역 당일 방문 상담과 사후 관리를 제안드립니다.',h1:'강남 방문 서비스, 가까운 곳에서',inq:14},
 {id:2,city:'서울',name:'송파',slug:'songpa',status:'published',title:'송파 방문 서비스 | 샘플 로컬',desc:'송파 지역 방문 상담과 일정 조율을 안내합니다.',h1:'송파 방문 서비스',inq:6},
 {id:3,city:'경기',name:'분당',slug:'bundang',status:'published',title:'분당 방문 서비스 | 샘플 로컬',desc:'',h1:'분당 방문 서비스, 가까운 곳에서',inq:9},
 {id:4,city:'경기',name:'수원',slug:'suwon',status:'draft',title:'강남 방문 서비스 | 샘플 로컬',desc:'수원 지역 방문 서비스 안내 문구를 작성 중입니다.',h1:'수원 방문 서비스',inq:0},
 {id:5,city:'부산',name:'해운대',slug:'haeundae',status:'published',title:'해운대 방문 서비스 | 샘플 로컬',desc:'해운대 지역 방문 상담을 제안드립니다.',h1:'해운대 방문 서비스, 가까운 곳에서',inq:5},
];
const INBOX0=[
 {id:1,name:'김민수',region:'강남',type:'예약',st:'new',at:'오늘 09:42',phone:'010-2345-6789',memo:'다음 주 화요일 오전 방문을 희망합니다.',log:['접수 오늘 09:42']},
 {id:2,name:'이지은',region:'분당',type:'문의',st:'seen',at:'오늘 08:15',phone:'010-3456-7890',memo:'방문 가능한 시간대와 비용 범위를 알고 싶습니다.',log:['접수 오늘 08:15','확인 오늘 08:50 · 운영팀']},
 {id:3,name:'박서준',region:'해운대',type:'예약',st:'done',at:'어제 17:30',phone:'010-4567-8901',memo:'토요일 방문 일정 확정 요청.',log:['접수 어제 17:30','확인 어제 17:41','완료 오늘 09:00 · 운영팀']},
 {id:4,name:'최유진',region:'강남',type:'문의',st:'new',at:'어제 14:02',phone:'010-5678-9012',memo:'사후 관리 범위를 확인하고 싶습니다.',log:['접수 어제 14:02']},
];
const ST={new:'신규',seen:'확인',done:'완료'};
function Toast({m}){return m?<div className="toast"><i className="ti ti-circle-check"></i>{m}</div>:null}

function TreeItem({depth,icon,label,on,onClick,open,toggle,leaf}){
 return <button className={'tree-item'+(on?' on':'')} style={{paddingLeft:8+depth*28}} onClick={onClick}>
  {leaf?<span className="tree-toggle-placeholder"></span>:<span className="tree-toggle" onClick={e=>{e.stopPropagation();toggle&&toggle()}}><i className={'ti '+(open?'ti-chevron-down':'ti-chevron-right')}></i></span>}
  <i className={'tree-icon ti '+icon}></i><span className="tree-label">{label}</span></button>;
}

function Pages({pages,setPages,toast}){
 const [sel,setSel]=useState(1);
 const [q,setQ]=useState('');
 const [flt,setFlt]=useState('all');
 const [open,setOpen]=useState({0:true});
 const [saving,setSaving]=useState(false);
 const list=pages.filter(p=>(flt==='all'||p.status===flt)&&(p.name+p.city+p.slug).includes(q));
 const p=pages.find(x=>x.id===sel);
 const upd=(k,v)=>setPages(ps=>ps.map(x=>x.id===sel?{...x,[k]:v}:x));
 const save=()=>{setSaving(true);setTimeout(()=>{setSaving(false);toast(p.name+' 페이지를 저장했습니다')},800)};
 const add=()=>{const id=Date.now();setPages(ps=>[...ps,{id,city:'경기',name:'새 지역',slug:'new-region',status:'draft',title:'',desc:'',h1:'',inq:0}]);setSel(id);toast('새 지역 페이지를 추가했습니다')};
 const dup=pages.filter(x=>x.title&&x.title===p?.title).length>1;
 return <div className="content">
  <div className="list-rail">
   <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><b style={{fontSize:14}}>지역 페이지 <span style={{color:'var(--n6)',fontWeight:400}}>{pages.length}</span></b><button className="btn sec" onClick={add}><i className="ti ti-plus"></i>추가</button></div>
   <div className="search"><i className="ti ti-search" style={{color:'var(--n6)'}}></i><input placeholder="지역 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
   <div className="fl">{[['all','전체'],['published','게시'],['draft','비공개']].map(([k,l])=><button key={k} className={'pillf'+(flt===k?' on':'')} onClick={()=>setFlt(k)}>{l}</button>)}</div>
   {list.map(x=><button key={x.id} className={'li'+(x.id===sel?' on':'')} onClick={()=>setSel(x.id)}><b>{x.city} · {x.name}<span className={'pill'+(x.status==='draft'?'':' dark')}>{x.status==='draft'?'비공개':'게시'}</span></b><span className="p">/{x.slug}</span></button>)}
   {list.length===0&&<p style={{fontSize:14,color:'var(--n6)',padding:12}}>조건에 맞는 페이지가 없습니다.</p>}
  </div>
  {p?<div className="detail-panel"><div className="page-body">
   <div className="cover page-cover"><svg viewBox="0 0 800 132" preserveAspectRatio="xMidYMid slice"><defs><pattern id="gd" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000" opacity=".12"/></pattern><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stopColor="#fff" stopOpacity=".0"/><stop offset="1" stopColor="#fff" stopOpacity=".7"/></linearGradient></defs><rect width="800" height="132" fill="url(#gd)"/><rect width="800" height="132" fill="url(#gl)"/><path className="route" d="M60 96 C180 20 260 120 380 64 S600 30 740 78" fill="none" stroke="#006440" strokeWidth="2" opacity=".5"/>{[[60,96],[380,64],[560,52],[740,78]].map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r="14" fill="#fff" opacity=".85"/><circle cx={x} cy={y} r="5" fill="#000"/></g>)}</svg></div>
   <div className="page-icon-row" style={{fontSize:14,color:'var(--n7)'}}><i className="ti ti-map-pin" style={{fontSize:40,color:'var(--n10)'}}></i></div>
   <h1 className="page-title">{p.city} {p.name} 방문 서비스</h1>
   <div className="meta-row"><span className={'pill'+(p.status==='draft'?'':' dark')}>{p.status==='draft'?'비공개':'게시 중'}</span><span>/{p.slug}</span><span>·</span><span>접수 {p.inq}건</span>
    <span style={{marginLeft:'auto',display:'flex',gap:8}}>
     <button className="btn sec" onClick={()=>{upd('status',p.status==='draft'?'published':'draft');toast(p.status==='draft'?'게시했습니다':'비공개로 전환했습니다')}}>{p.status==='draft'?'게시하기':'비공개 전환'}</button>
     <button className="btn pri" data-loading={saving} onClick={save}>저장</button></span></div>
   {dup&&<div className="block block-callout" data-block-type="callout"><i className="ti ti-alert-triangle"></i><p>다른 페이지와 Title이 같습니다. 지역명을 포함해 고유하게 바꿔 주세요.</p></div>}
   <div className="block" data-block-type="heading-2"><span className="block-handle"><i className="ti ti-grip-vertical"></i></span><h2>검색 노출 설정</h2></div>
   <div className="block" data-block-type="text">
    <div className="field"><label>Title</label><div><input className="input" value={p.title} onChange={e=>upd('title',e.target.value)} placeholder="페이지 제목"/><div className={'cnt'+(p.title.length>30||p.title.length===0?' bad':'')}>{p.title.length} / 30자</div></div></div>
    <div className="field"><label>Description</label><div><textarea className="input" value={p.desc} onChange={e=>upd('desc',e.target.value)} placeholder="설명 문구를 입력해 주세요"/><div className={'cnt'+(p.desc.length===0||p.desc.length>80?' bad':'')}>{p.desc.length===0?'비어 있음':p.desc.length+' / 80자'}</div></div></div>
    <div className="field"><label>H1</label><div><input className="input" value={p.h1} onChange={e=>upd('h1',e.target.value)} placeholder="페이지당 1개"/></div></div>
   </div>
   <div className="block" data-block-type="heading-2"><span className="block-handle"><i className="ti ti-grip-vertical"></i></span><h2>본문 블록</h2></div>
   <div className="block" data-block-type="toggle"><button className="toggle" onClick={()=>setOpen({...open,a:!open.a})}><i className={'ti '+(open.a?'ti-caret-down-filled':'ti-caret-right-filled')} style={{fontSize:12}}></i><b style={{fontWeight:500}}>히어로 · {p.name}에서 가까운 방문 서비스</b></button>{open.a&&<div className="toggle-content">{p.name} 전 지역 당일 방문 상담을 제안드립니다.</div>}</div>
   <div className="block" data-block-type="toggle"><button className="toggle" onClick={()=>setOpen({...open,b:!open.b})}><i className={'ti '+(open.b?'ti-caret-down-filled':'ti-caret-right-filled')} style={{fontSize:12}}></i><b style={{fontWeight:500}}>서비스 카드 3개</b></button>{open.b&&<div className="toggle-content">상담 · 현장 방문 · 사후 관리</div>}</div>
   <div className="block" data-block-type="toggle"><button className="toggle" onClick={()=>setOpen({...open,c:!open.c})}><i className={'ti '+(open.c?'ti-caret-down-filled':'ti-caret-right-filled')} style={{fontSize:12}}></i><b style={{fontWeight:500}}>자주 묻는 질문 3개</b></button>{open.c&&<div className="toggle-content">방문 지역 · 일정 안내 · 비용 안내</div>}</div>
   <div className="block" data-block-type="divider"><hr style={{border:'none',borderTop:'1px solid var(--n3)',margin:'20px 0'}}/></div>
   <div className="block" data-block-type="table"><h3>지역 페이지 변수</h3>
    <table className="tbl"><thead><tr><th>변수</th><th>값</th><th>사용 위치</th></tr></thead><tbody><tr><td>{'{지역명}'}</td><td>{p.name}</td><td>Title · H1 · 본문</td></tr><tr><td>{'{도시}'}</td><td>{p.city}</td><td>구조화 데이터</td></tr><tr><td>{'{슬러그}'}</td><td>{p.slug}</td><td>URL · 사이트맵</td></tr></tbody></table></div>
   <div className="slash"><kbd>/</kbd>입력하면 블록을 추가할 수 있습니다</div>
   <div style={{marginTop:24}}><button className="btn out" onClick={()=>{setPages(ps=>ps.filter(x=>x.id!==sel));setSel(pages.find(x=>x.id!==sel)?.id);toast('페이지를 삭제했습니다')}}><i className="ti ti-trash"></i>이 페이지 삭제</button></div>
  </div></div>:<div className="detail-panel"><div className="page-body" style={{color:'var(--n6)'}}>왼쪽에서 지역 페이지를 선택해 주세요.</div></div>}
 </div>;
}

function Inbox({items,setItems,toast}){
 const [sel,setSel]=useState(1);
 const [f,setF]=useState('all');
 const [memo,setMemo]=useState('');
 const list=items.filter(x=>f==='all'||x.st===f);
 const it=items.find(x=>x.id===sel);
 const next={new:'seen',seen:'done'};
 const advance=()=>{setItems(xs=>xs.map(x=>x.id===sel?{...x,st:next[x.st],log:[...x.log,ST[next[x.st]]+' 방금 · 운영팀']}:x));toast('처리 상태를 변경했습니다')};
 return <div className="content">
  <div className="list-rail">
   <b style={{fontSize:14,display:'block',marginBottom:10}}>접수 {items.length}건</b>
   <div className="fl">{[['all','전체'],['new','신규'],['seen','확인'],['done','완료']].map(([k,l])=><button key={k} className={'pillf'+(f===k?' on':'')} onClick={()=>setF(k)}>{l}</button>)}</div>
   {list.map(x=><button key={x.id} className={'li'+(x.id===sel?' on':'')} onClick={()=>setSel(x.id)}><b>{x.name}<span className={'pill'+(x.st==='new'?' dark':'')}>{ST[x.st]}</span></b><span className="p">{x.region} · {x.type} · {x.at}</span></button>)}
  </div>
  <div className="detail-panel">{it&&<div className="page-body">
   <i className="ti ti-mail-opened" style={{fontSize:40}}></i>
   <h1 className="page-title">{it.name} · {it.type} 접수</h1>
   <div className="meta-row"><span className={'pill'+(it.st==='new'?' dark':'')}>{ST[it.st]}</span><span>유입 /{{강남:'gangnam',분당:'bundang',해운대:'haeundae'}[it.region]}</span><span>·</span><span>{it.at}</span>
    <span style={{marginLeft:'auto'}}>{next[it.st]?<button className="btn pri" onClick={advance}>{ST[next[it.st]]}(으)로 변경</button>:<span className="pill">처리 완료</span>}</span></div>
   <div className="block block-callout" data-block-type="callout"><i className="ti ti-phone"></i><p>{it.phone}</p></div>
   <div className="block" data-block-type="heading-2"><h2>접수 내용</h2></div>
   <div className="block" data-block-type="quote"><p>{it.memo}</p></div>
   <div className="block" data-block-type="heading-2"><h2>처리 이력</h2></div>
   <div className="block" data-block-type="list"><ul style={{paddingLeft:20,fontSize:15,lineHeight:1.9}}>{it.log.map((l,i)=><li key={i}>{l}</li>)}</ul></div>
   <div className="block" data-block-type="heading-2"><h2>담당자 메모</h2></div>
   <div className="block"><textarea className="input" style={{border:'1px solid var(--n4)'}} placeholder="메모를 입력해 주세요" value={memo} onChange={e=>setMemo(e.target.value)}/><div style={{marginTop:8}}><button className="btn sec" onClick={()=>{if(!memo.trim())return toast('메모 내용을 입력해 주세요');setItems(xs=>xs.map(x=>x.id===sel?{...x,log:[...x.log,'메모 · '+memo]}:x));setMemo('');toast('메모를 저장했습니다')}}>메모 저장</button></div></div>
  </div>}</div>
 </div>;
}

function Audit({pages,toast,goPage}){
 const [running,setRunning]=useState(false);
 const [ran,setRan]=useState(true);
 const rows=pages.map(p=>{const is=[];if(!p.desc)is.push(['err','Description 누락']);if(pages.filter(x=>x.title&&x.title===p.title).length>1)is.push(['warn','Title 중복']);if(!p.title)is.push(['err','Title 누락']);if(p.status==='draft')is.push(['warn','비공개 — 사이트맵 제외']);return{p,is}});
 const err=rows.filter(r=>r.is.some(i=>i[0]==='err')).length,warn=rows.filter(r=>!r.is.some(i=>i[0]==='err')&&r.is.length).length,ok=rows.length-err-warn;
 const run=()=>{setRunning(true);setRan(false);setTimeout(()=>{setRunning(false);setRan(true);toast('전체 점검을 마쳤습니다')},1400)};
 return <div className="content"><div className="detail-panel"><div className="page-body">
  <i className="ti ti-report-search" style={{fontSize:40}}></i>
  <h1 className="page-title">SEO 점검 대시보드</h1>
  <div className="meta-row"><span>마지막 점검 오늘 09:10</span><span style={{marginLeft:'auto'}}><button className="btn pri" onClick={run}>{running?<><i className="ti ti-loader-2 spin"></i>점검 중</>:<><i className="ti ti-player-play"></i>전체 점검 실행</>}</button></span></div>
  {running?<div className="block"><div className="bar"><i style={{width:'100%',animationDuration:'1.4s'}}></i></div><p style={{fontSize:14,color:'var(--n7)',marginTop:8,animation:'blink 1s infinite'}}>페이지 {pages.length}개를 점검하는 중입니다</p></div>:<>
  <div className="status-line">
   <div className="stat"><b>{ok}</b><span>통과</span></div><div className="stat"><b>{warn}</b><span>경고</span></div><div className="stat"><b>{err}</b><span>오류</span></div><div className="stat"><b>{rows.length}</b><span>전체 페이지</span></div></div>
  <div className="block" data-block-type="heading-2"><h2>페이지별 결과</h2></div>
  <div className="block" data-block-type="table"><table className="tbl"><thead><tr><th>페이지</th><th>결과</th><th></th></tr></thead><tbody>
   {rows.map(({p,is})=><tr key={p.id}><td>{p.city} · {p.name}<div style={{fontSize:12,color:'var(--n6)'}}>/{p.slug}</div></td><td>{is.length===0?<span className="pill dark"><i className="ti ti-check"></i>통과</span>:is.map((i,k)=><span key={k} className={'pill '+i[0]} style={{marginRight:4}}>{i[1]}</span>)}</td><td style={{textAlign:'right'}}>{is.length>0&&<button className="btn out" onClick={()=>goPage(p.id)}>편집으로 이동</button>}</td></tr>)}</tbody></table></div>
  <div className="block block-callout" data-block-type="callout"><i className="ti ti-git-compare"></i><p>이전 점검 대비 새 오류 <b>1건</b>, 해결된 오류 <b>2건</b>입니다.</p></div></>}
 </div></div></div>;
}

function Integrations({toast}){
 const [ga,setGa]=useState('G-DEMO12345');
 const [https,setHttps]=useState(true);
 const [robots,setRobots]=useState(true);
 const bad=ga&&!/^G-[A-Z0-9]{6,}$/.test(ga);
 return <div className="content"><div className="detail-panel"><div className="page-body">
  <i className="ti ti-plug-connected" style={{fontSize:40}}></i>
  <h1 className="page-title">분석·검색엔진 연동 설정</h1>
  <div className="meta-row"><span>방문자 사이트에 즉시 반영됩니다</span></div>
  <div className="block" data-block-type="heading-2"><h2>Google Analytics 4</h2></div>
  <div className="block"><div className="field"><label>측정 ID</label><div><input className="input" style={{border:'1px solid var(--n4)'}} value={ga} aria-invalid={!!bad} onChange={e=>setGa(e.target.value.toUpperCase())}/>{bad&&<div className="cnt bad">G- 로 시작하는 측정 ID 형식이 아닙니다</div>}</div></div>
   <div style={{marginTop:12}}><button className="btn pri" disabled={!!bad} onClick={()=>toast('측정 ID를 저장했습니다. 태그가 삽입됩니다')}>저장</button></div></div>
  <div className="block" data-block-type="heading-2"><h2>검색엔진 · 보안</h2></div>
  <div className="block">{[['HTTPS 강제 리다이렉트','http 요청을 https 로 301 이동합니다',https,setHttps],['robots.txt 자동 생성','비공개 페이지와 /admin 경로를 제외합니다',robots,setRobots]].map(([t,d,v,s])=><button key={t} className="toggle" style={{padding:'12px 0',borderBottom:'1px solid var(--n3)'}} onClick={()=>{s(!v);toast(t+(v?' 해제':' 적용'))}}><span className={'sw'+(v?' on':'')}></span><span style={{flex:1}}><b style={{fontWeight:500,display:'block'}}>{t}</b><span style={{fontSize:13,color:'var(--n6)'}}>{d}</span></span></button>)}</div>
  <div className="block" data-block-type="heading-2"><h2>사이트맵 제출</h2></div>
  <div className="block block-callout" data-block-type="callout"><i className="ti ti-link"></i><p style={{flex:1}}>https://샘플도메인.kr/sitemap.xml</p><button className="btn out" onClick={()=>toast('사이트맵 주소를 복사했습니다')}><i className="ti ti-copy"></i>복사</button></div>
  <div className="block"><p style={{fontSize:14,color:'var(--n7)'}}>Search Console 사이트맵 메뉴에 위 주소를 제출하면 지역 페이지 추가 시 자동 반영됩니다.</p></div>
 </div></div></div>;
}

function App(){
 const [view,setView]=useState('pages');
 const [pages,setPages]=useState(PAGES0);
 const [items,setItems]=useState(INBOX0);
 const [open,setOpen]=useState({root:true,seoul:true,gg:true});
 const [m,setM]=useState('');const tm=useRef();
 const toast=x=>{setM(x);clearTimeout(tm.current);tm.current=setTimeout(()=>setM(''),2200)};
 const newCnt=items.filter(x=>x.st==='new').length;
 const T={pages:'지역 페이지 트리 관리',inbox:'문의·예약 접수함',audit:'SEO 점검 대시보드',int:'분석·검색엔진 연동 설정'};
 const tg=k=>setOpen(o=>({...o,[k]:!o[k]}));
 return <div className="app" style={{width:'100%'}}>
  <aside className="tree-sidebar" data-tree-sidebar style={{width:240}}>
   <div className="ws"><span className="lg"><i className="ti ti-map-2"></i></span>로컬 운영 콘솔<i className="ti ti-selector" style={{marginLeft:'auto',color:'var(--n6)'}}></i></div>
   <div className="grp">콘텐츠</div>
   <nav className="tree-nav">
    <TreeItem depth={0} icon="ti-sitemap" label="지역 페이지 트리 관리" on={view==='pages'} open={open.root} toggle={()=>tg('root')} onClick={()=>setView('pages')}/>
    {open.root&&<>
     <TreeItem depth={1} icon="ti-folder" label="서울" open={open.seoul} toggle={()=>tg('seoul')} onClick={()=>{setView('pages');tg('seoul')}}/>
     {open.seoul&&pages.filter(p=>p.city==='서울').map(p=><TreeItem key={p.id} depth={2} leaf icon="ti-file-text" label={p.name} onClick={()=>setView('pages')}/>)}
     <TreeItem depth={1} icon="ti-folder" label="경기" open={open.gg} toggle={()=>tg('gg')} onClick={()=>{setView('pages');tg('gg')}}/>
     {open.gg&&pages.filter(p=>p.city==='경기').map(p=><TreeItem key={p.id} depth={2} leaf icon="ti-file-text" label={p.name} onClick={()=>setView('pages')}/>)}
     <TreeItem depth={1} leaf icon="ti-folder" label={'부산 · '+pages.filter(p=>p.city==='부산').length+'개'} onClick={()=>setView('pages')}/>
    </>}
   </nav>
   <div className="grp">운영</div>
   <nav className="tree-nav">
    <TreeItem depth={0} leaf icon="ti-inbox" label="문의·예약 접수함" on={view==='inbox'} onClick={()=>setView('inbox')}/>
    <TreeItem depth={0} leaf icon="ti-report-search" label="SEO 점검 대시보드" on={view==='audit'} onClick={()=>setView('audit')}/>
    <TreeItem depth={0} leaf icon="ti-plug-connected" label="분석·검색엔진 연동 설정" on={view==='int'} onClick={()=>setView('int')}/>
   </nav>
   <div className="sb-foot"><button className="tree-item" onClick={()=>toast('휴지통은 30일간 보관됩니다')}><span className="tree-toggle-placeholder"></span><i className="tree-icon ti ti-trash"></i><span className="tree-label">휴지통</span></button></div>
  </aside>
  <div className="main-wrap">
   <header className="topbar"><div className="page-breadcrumb"><a>콘솔</a><span>›</span><a>{view==='pages'?'콘텐츠':'운영'}</a><span>›</span><span className="cur">{T[view]}</span></div>
    <div style={{display:'flex',alignItems:'center',gap:12}}>{newCnt>0&&<span className="pill dark" style={{animation:'blink 2s infinite'}}>신규 접수 {newCnt}</span>}<button className="btn ghost" onClick={()=>toast('관리자 세션이 유지됩니다')}><i className="ti ti-shield-lock"></i>관리자</button></div></header>
   {view==='pages'&&<Pages pages={pages} setPages={setPages} toast={toast}/>}
   {view==='inbox'&&<Inbox items={items} setItems={setItems} toast={toast}/>}
   {view==='audit'&&<Audit pages={pages} toast={toast} goPage={()=>setView('pages')}/>}
   {view==='int'&&<Integrations toast={toast}/>}
  </div>
  <Toast m={m}/>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
