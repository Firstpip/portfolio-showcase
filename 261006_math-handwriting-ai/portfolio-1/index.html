<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이풀이 노트 — 손글씨 풀이 AI 진단 (구현 데모)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 240°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#eeeeee;
  --m100:#eeeeee;
  --m200:#eeeeee;
  --m300:#dcdcdd;
  --m400:#bababa;
  --m500:#8f8f90;
  --m600:#606062;
  --m700:#343435;
  --m800:#070709;
  --m900:#060607;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#f5f5f5;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b5b5ba;
  --n6:#8b8b8b;
  --n7:#71717a;
  --n8:#53535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ primary #070709가 거의 무채색(채도 13%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:16px;line-height:1.49;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
input{font-family:inherit;letter-spacing:inherit}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:18px;height:18px;stroke-width:1.75}
.ic.sm svg{width:14px;height:14px}
.ic.lg svg{width:22px;height:22px}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--n7) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes drawLine{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;height:56px;background:color-mix(in srgb,var(--n0) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:24px;padding:0 32px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--n10);letter-spacing:-.03em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--m800);color:var(--n0);display:flex;align-items:center;justify-content:center}
.brand-mark .ic svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{height:36px;padding:0 16px;border-radius:100px;font-size:14px;font-weight:500;color:var(--n7);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab:hover{background:var(--n2);color:var(--n9)}
.tab.on{background:var(--m800);color:var(--n0);font-weight:600}
.searchbox{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:100px;background:var(--n2);color:var(--n7);width:200px}
.searchbox input{border:none;background:none;outline:none!important;box-shadow:none!important;font-size:14px;width:100%;color:var(--n9)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.avatar.big{width:40px;height:40px;font-size:14px}

/* layout */
.layout{display:flex;justify-content:center;gap:24px;padding:24px 24px 64px;width:100%}
.feed{width:600px;max-width:100%;display:flex;flex-direction:column;gap:16px}
.right-rail{width:300px;display:flex;flex-direction:column;gap:16px;position:sticky;top:80px;align-self:flex-start}
.card{background:var(--n1);border-radius:18px;box-shadow:0 1px 2px color-mix(in srgb,var(--n10) 6%,transparent),0 8px 24px -12px color-mix(in srgb,var(--n10) 12%,transparent);border:1px solid var(--n3)}

/* composer */
.composer{position:sticky;top:64px;z-index:20;padding:12px 16px;display:flex;align-items:center;gap:12px}
.composer-field{flex:1;height:40px;border-radius:100px;background:var(--n2);padding:0 16px;text-align:left;color:var(--n7);font-size:14px;transition:background .2s}
.composer-field:hover{background:var(--n3)}
.btn{height:40px;padding:0 20px;border-radius:100px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s}
.btn.primary{background:var(--m800);color:var(--n0)}
.btn.primary:hover{background:var(--m700);transform:scale(1.02)}
.btn.outline{border:1.5px solid var(--n4);color:var(--n9);background:var(--n1)}
.btn.outline:hover{background:var(--n2)}
.btn.ghost{color:var(--n8);padding:0 12px}
.btn.ghost:hover{background:var(--n2)}
.btn.sm{height:32px;padding:0 16px;font-size:12px}

/* hero strip */
.hero{padding:24px;background:linear-gradient(180deg,var(--n2) 0%,var(--n0) 100%);overflow:hidden;position:relative}
.hero h1{font-size:32px;line-height:1.2;letter-spacing:-.04em;color:var(--n10);font-weight:700;max-width:300px}
.hero p{font-size:14px;color:var(--n7);margin-top:8px;max-width:320px}
.hero-art{position:absolute;right:-8px;top:18px;display:flex;gap:8px}
.hero-art .mini{width:128px;border-radius:12px;background:var(--n1);border:1px solid var(--n3);padding:8px;box-shadow:0 8px 20px -10px color-mix(in srgb,var(--n10) 25%,transparent)}
.hero-art .mini:first-child{transform:rotate(-4deg)}
.hero-art .mini:last-child{transform:rotate(3deg) translateY(14px)}
.mini-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--n7);margin-bottom:4px}
.mini-hand{font-family:'Nanum Pen Script',cursive;font-size:18px;line-height:1.1;color:var(--n9)}
.mini-clean{font-size:12px;line-height:1.5;color:var(--n9)}
.mini-clean b{display:block;font-weight:600}

/* post */
.post{padding:16px;animation:fadeUp .5s both}
.post-head{display:flex;align-items:center;gap:12px}
.author{font-weight:600;font-size:14px;color:var(--n10)}
.post-head time{font-size:12px;color:var(--n6);margin-left:4px}
.post-head .spacer{flex:1}
.post-title{margin:12px 0 8px;font-size:16px;font-weight:600;color:var(--n10);line-height:1.4}
.post-body{display:flex;flex-direction:column;gap:12px}
.post-actions{display:flex;gap:4px;margin-top:12px;padding-top:8px;border-top:1px solid var(--n3)}
.post-actions button{height:36px;padding:0 12px;border-radius:100px;font-size:12px;font-weight:600;color:var(--n7);display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.post-actions button:hover{background:var(--n2);color:var(--n10)}
.post-actions button.active{color:var(--m800);background:var(--n2)}
.clickable{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:100px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.err{background:var(--s2-bg);color:var(--s2-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--n6)}
.dot.live{background:var(--n8);animation:pulseDot 1.4s infinite}
.pill .ic svg{width:12px;height:12px}

/* handwriting paper */
.paper{position:relative;border-radius:12px;background:var(--n1);border:1px solid var(--n3);overflow:hidden}
.paper svg{display:block;width:100%;height:auto}
.hand-t{font-family:'Nanum Pen Script',cursive;fill:var(--n10)}
.rule{stroke:var(--n3);stroke-width:1}
.err-ul{fill:none;stroke:var(--s2);stroke-width:3;stroke-linecap:round;stroke-dasharray:260;animation:drawLine 1.1s .3s both}
.err-box{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.pin-c{fill:var(--s2)}
.pin-t{fill:var(--n0);font-size:12px;font-weight:700;font-family:'Pretendard',sans-serif}
.ok-ul{fill:none;stroke:var(--s1);stroke-width:3;stroke-linecap:round;stroke-dasharray:260;animation:drawLine 1.1s .3s both}
.skel{height:96px;border-radius:12px;background:linear-gradient(90deg,var(--n2) 0,var(--n3) 120px,var(--n2) 240px);background-size:480px 100%;animation:shimmer 1.4s linear infinite}
.skel-line{height:12px;border-radius:6px;margin-top:8px;background:linear-gradient(90deg,var(--n2) 0,var(--n3) 120px,var(--n2) 240px);background-size:480px 100%;animation:shimmer 1.4s linear infinite}

/* rail */
.rail-card{padding:16px}
.rail-card h3{font-size:14px;font-weight:700;color:var(--n10);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--n2);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;color:var(--n10);line-height:1.2}
.stat span{font-size:12px;color:var(--n7)}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--n8);margin-bottom:4px}
.bar-track{height:8px;border-radius:4px;background:var(--n2);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--n5);transform-origin:left;animation:barGrow .9s both}
.bar-fill.main{background:var(--m600)}
.note{font-size:12px;color:var(--n6);line-height:1.5}

/* diagnosis */
.dx-section{padding:16px;display:flex;flex-direction:column;gap:12px}
.dx-section h3{font-size:16px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px}
.line-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--n2);font-size:14px}
.line-item.bad{background:var(--s2-bg)}
.line-item .no{width:20px;height:20px;border-radius:50%;background:var(--n1);color:var(--n8);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line-item.bad .no{background:var(--s2);color:var(--n0)}
.line-item .txt{flex:1;color:var(--n10);font-weight:500}
.line-item .conf{font-size:12px;color:var(--n7)}
.hint-step{display:flex;gap:12px;padding:12px;border-radius:12px;border:1.5px solid var(--n3);align-items:flex-start;transition:border-color .2s,background .2s}
.hint-step.open{border-color:var(--m800);background:var(--n1)}
.hint-step.locked{background:var(--n2);color:var(--n6)}
.hint-step .badge{width:28px;height:28px;border-radius:50%;background:var(--n3);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.hint-step.open .badge{background:var(--m800);color:var(--n0)}
.hint-step p{font-size:14px;line-height:1.5}
.hint-step .h{font-weight:600;font-size:14px;color:var(--n10);margin-bottom:4px}
.hint-step.locked .h{color:var(--n6)}
.cross{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cross > div{background:var(--n2);border-radius:12px;padding:12px;font-size:14px}
.cross small{display:block;font-size:12px;color:var(--n7);margin-bottom:4px}
.cross b{color:var(--n10);font-variant-numeric:tabular-nums}

/* retry */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figcaption{font-size:12px;font-weight:600;color:var(--n7);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.tl{position:relative;padding-left:24px;display:flex;flex-direction:column;gap:16px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--n3)}
.tl-item{position:relative;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-24px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--n1);border:2px solid var(--n5)}
.tl-item.cur::before{border-color:var(--m800);background:var(--m800)}
.tl-item b{display:block;color:var(--n10);font-weight:600}
.tl-item span{font-size:12px;color:var(--n7)}

/* triage */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 16px;border-radius:100px;font-size:12px;font-weight:600;background:var(--n1);border:1.5px solid var(--n4);color:var(--n8);transition:background .2s}
.chip:hover{background:var(--n2)}
.chip.on{background:var(--m800);border-color:var(--m800);color:var(--n0)}
.code{font-family:ui-monospace,monospace;font-size:12px;color:var(--n8);background:var(--n2);padding:2px 8px;border-radius:6px}
.expand{margin-top:12px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .35s both}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--n10) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeUp .25s both}
.modal{width:100%;max-width:440px;background:var(--n1);border-radius:24px;padding:24px;animation:sheetIn .35s both;display:flex;flex-direction:column;gap:16px}
.modal h2{font-size:20px;font-weight:700;color:var(--n10);letter-spacing:-.03em}
.drop{border:2px dashed var(--n4);border-radius:18px;padding:24px;text-align:center;color:var(--n7);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--n0)}
.check-list{display:flex;flex-direction:column;gap:8px}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px}
.check-row .v{margin-left:auto;font-size:12px;color:var(--n7);font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:4px;background:var(--n2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--m800);transition:width .3s}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:80;background:var(--n10);color:var(--n0);padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;animation:fadeUp .3s both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Icon = ({ n, c = '' }) => (
  <span className={'ic ' + c} dangerouslySetInnerHTML={{ __html: '<i data-lucide="' + n + '"></i>' }} />
);

/* 손글씨 풀이 이미지 (절차적 SVG) */
const Hand = ({ lines, errIdx, okIdx, pin, h = 190 }) => (
  <div className="paper">
    <svg viewBox={'0 0 560 ' + h} role="img" aria-label="학생 손글씨 풀이 이미지">
      {[0, 1, 2, 3, 4, 5].map(i => <line key={i} className="rule" x1="0" x2="560" y1={34 + i * 40} y2={34 + i * 40} />)}
      {lines.map((t, i) => (
        <text key={i} className="hand-t" x={28 + (i % 2) * 6} y={28 + i * 40} fontSize="30" transform={'rotate(' + (i % 2 ? -0.6 : 0.5) + ' 280 ' + (28 + i * 40) + ')'}>{t}</text>
      ))}
      {errIdx != null && <>
        <rect className="err-box" x="16" y={errIdx * 40 + 2} width="400" height="38" rx="8" />
        <path className="err-ul" d={'M24 ' + (errIdx * 40 + 36) + ' q 14 -8 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0'} />
        {pin && <g><circle className="pin-c" cx="440" cy={errIdx * 40 + 21} r="12" /><text className="pin-t" x="440" y={errIdx * 40 + 25} textAnchor="middle">1</text></g>}
      </>}
      {okIdx != null && <path className="ok-ul" d={'M24 ' + (okIdx * 40 + 36) + ' q 14 -8 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0'} />}
    </svg>
  </div>
);

const STEPS = [
  { h: '1단계 · 방향 잡기', p: '두 식의 곱이 0이 되려면 각각의 식이 0이어야 해요. 어떤 식들이 있는지 먼저 짚어 볼까요?' },
  { h: '2단계 · 식 세우기', p: '(x − 2) = 0 에서 x 만 남기려면 어떤 계산이 필요한지 한 줄로 적어 보세요.' },
  { h: '3단계 · 확인하기', p: '구한 값을 처음 식 x² − 5x + 6 에 넣어 0이 되는지 직접 확인해 보세요.' },
];

const SEED = [
  { id: 1, title: '이차방정식 x² − 5x + 6 = 0 의 해 구하기', time: '3분 전', st: 'dx', lines: ['x² − 5x + 6 = 0', '(x − 2)(x − 3) = 0', 'x = −2 또는 x = −3'], err: 2, meta: '오류 1곳 · 부호 처리' },
  { id: 2, title: '일차함수 y = 2x − 3 의 그래프 기울기', time: '어제 오후 9:12', st: 'done', lines: ['y = 2x − 3', '기울기 = 2', 'y절편 = −3'], ok: 1, meta: '재풀이 완료 · 오류 해소' },
  { id: 3, title: '연립방정식 x + y = 5, x − y = 1', time: '2시간 전', st: 'wait', lines: [], meta: '분석 중' },
  { id: 4, title: '인수분해 x² − 9 를 곱의 꼴로', time: '3일 전', st: 'teacher', lines: ['x² − 9', '= (x − 3)(x + 3)', '= (x − 3)²'], err: 2, meta: '교사 확인 필요 · 독립 풀이 불일치' },
  { id: 5, title: '이차함수 y = (x − 1)² + 2 의 꼭짓점', time: '4일 전', st: 'done', lines: ['y = (x − 1)² + 2', '꼭짓점 (1, 2)'], ok: 1, meta: '진단 정상' },
  { id: 6, title: '복습 문제 도착 · 이차방정식 인수분해 (중3 · 난이도 중)', time: '5일 전', st: 'review', lines: ['x² − 7x + 12 = 0'], meta: '독립 풀이 일치 검사 통과' },
];

function Pill({ st }) {
  if (st === 'dx') return <span className="pill err"><Icon n="alert-circle" />오류 지점 확인</span>;
  if (st === 'done') return <span className="pill ok"><Icon n="check" />완료</span>;
  if (st === 'wait') return <span className="pill"><span className="dot live" />분석 중</span>;
  if (st === 'teacher') return <span className="pill warn"><Icon n="user-check" />교사 확인 필요</span>;
  return <span className="pill"><Icon n="shield-check" />검증 통과</span>;
}

function App() {
  const [view, setView] = useState('main');
  const [posts, setPosts] = useState(SEED);
  const [hint, setHint] = useState(1);
  const [modal, setModal] = useState(false);

  const [retried, setRetried] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const go = v => setView(v);
  const uploading = prog > 0 && prog < 100;

  const startUpload = () => {
    setProg(0);

    const iv = setInterval(() => {
      p += 20;
      setProg(p);
      if (p >= 100) {

        setTimeout(() => {
          const id = Date.now();
          setPosts(ps => [{ id, title: '새 풀이 · 연립방정식 3x + y = 7', time: '방금', st: 'wait', lines: [], meta: '분석 중' }, ...ps]);
          setModal(false);
          setToast('업로드를 마쳤어요. 분석이 끝나면 알려 드릴게요.');
          setTimeout(() => setPosts(ps => ps.map(x => x.id === id ? { ...x, st: 'done', lines: ['3x + y = 7', 'x = 2 이면 y = 1'], ok: 1, meta: '진단 정상' } : x)), 3200);
        }, 350);
      }

  };

  const rerun = () => {

  };

  const Rail = ({ kind }) => (

          <div className="stat"><b className="num">{hint}</b><span>열람 힌트</span></div>
          <div className="stat"><b className="num">{retried ? 2 : 1}</b><span>재풀이</span></div>
        </div>
      </div>
      <div className="card rail-card">

          <div className="bar-row" key={l}>
            <div className="bar-label"><span>{l}</span><span className="num">{Math.round(w / 26)}회</span></div>

      <div className="card rail-card">

        <p className="note">이름과 연락처는 AI 분석 단계에 전달하지 않고, 익명 학생 코드(S-0417)와 풀이 이미지만 사용하는 구조를 제안합니다.</p>
        <p className="note" style={{ marginTop: 8 }}>샘플 데모 · 자체 개발 프로젝트</p>
      </div>
    </aside>
  );

  const PostCard = ({ p, i }) => (
    <article className="card post" style={{ animationDelay: i * 0.06 + 's' }}>
      <header className="post-head">

      <h3 className="post-title">{p.title}</h3>

            <div className="drop"><Icon n="camera" c="lg" /><b style={{ color: 'var(--n10)' }}>교재 풀이를 화면 안에 맞춰 촬영해 주세요</b><span>밝은 곳에서 종이를 평평하게 두면 더 정확해요</span></div>
            <div className="check-list">
              <div className="check-row"><span className="pill ok"><Icon n="check" />통과</span>해상도<span className="v num">2,400 × 3,200</span></div>
              <div className="check-row"><span className="pill ok"><Icon n="check" />통과</span>기울기<span className="v num">3도</span></div>
              <div className="check-row"><span className="pill warn"><Icon n="sun" />주의</span>밝기<span className="v">조금 어두워요</span></div>
            </div>
            <div className="progress"><i style={{ width: prog + '%' }} /></div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn outline" onClick={() => setModal(false)}>닫기</button>
              <button className="btn primary" data-loading={uploading ? 'true' : undefined} onClick={startUpload}>업로드하기</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast"><Icon n="check-circle-2" c="sm" />{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
