<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업준비·검수·리포트 통합 플랫폼 — 구현 데모</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 16°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#feece5;
  --m100:#fcd9cc;
  --m200:#fbc2ad;
  --m300:#f9a88a;
  --m400:#f88f69;
  --m500:#f67748;
  --m600:#ca623b;
  --m700:#9d4c2e;
  --m800:#6f3620;
  --m900:#6f3620;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdf9f4;
  --n1:#ffffff;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#7a7371;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 16°와 16° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n9)}
i.ph{font-size:18px;line-height:1;flex-shrink:0}

@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cellIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawPath{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.app{display:flex;width:100%;height:100vh;overflow:hidden}
/* workspace strip */
.workspace-strip{width:64px;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px;flex-shrink:0}
.ws-item{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--n0) 14%,transparent);color:var(--n0);font-weight:700;font-size:14px;position:relative;transition:background .2s}
.ws-item:hover{background:color-mix(in srgb,var(--n0) 26%,transparent)}
.ws-item.active{background:var(--m500);color:var(--n10)}
.ws-item.active::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--n0)}
.ws-divider{width:24px;height:1px;background:color-mix(in srgb,var(--n0) 24%,transparent)}
/* channel list */
.channel-list{width:260px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;flex-shrink:0;overflow:auto}
.channel-header{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3)}
.ws-name{font-size:16px;font-weight:700;color:var(--n10);letter-spacing:-.02em}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--n7);transition:background .2s}
.icon-btn:hover{background:var(--n2);color:var(--n10)}
.icon-btn.on{background:var(--n2);color:var(--n10)}
.channel-search{padding:12px 16px 4px}
.channel-search label{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--n4);border-radius:8px;background:var(--n0);color:var(--n6)}
.channel-search input{border:none;background:none;outline:none!important;box-shadow:none!important;width:100%;font-size:12px}
.channel-section{padding:12px 8px 4px}
.section-toggle{display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--n7);width:100%;text-align:left}
.channel-row{display:flex;align-items:center;padding-right:8px;border-radius:8px}
.channel-row:hover{background:var(--n2)}
.channel-row.active{background:var(--m50)}
.channel-item{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-size:14px;color:var(--n8);text-align:left;border-radius:8px}
.channel-item::before{content:"#";color:var(--n6);font-weight:600;width:12px}
.channel-row.active .channel-item{color:var(--m700);font-weight:700}
.channel-row.active .channel-item::before{color:var(--m700)}
.channel-unread{min-width:18px;height:18px;border-radius:9px;background:var(--n10);color:var(--n0);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.dm-row{display:flex;align-items:center;padding-right:8px;border-radius:8px}
.dm-row:hover{background:var(--n2)}
.dm-row.active{background:var(--n2)}
.dm-item{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-size:14px;color:var(--n8);text-align:left}
.dm-row.active .dm-item{font-weight:700;color:var(--n10)}
.presence{width:8px;height:8px;border-radius:50%;background:var(--n5);flex-shrink:0}
.presence.online{background:var(--s1)}
/* main */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0)}
.conv-header{height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);background:var(--n1);flex-shrink:0}
.conv-title-row{display:flex;align-items:center;gap:8px}
.conv-prefix{color:var(--n6);font-weight:700;font-size:16px}
.conv-title{font-size:16px;font-weight:700;color:var(--n10);letter-spacing:-.02em}
.member-count{font-size:12px;color:var(--n7);padding:2px 8px;border:1px solid var(--n3);border-radius:8px;background:var(--n1)}
.conv-actions{display:flex;gap:4px}
.conv-body{flex:1;overflow:auto;padding:16px 24px 8px}
.conv-input{padding:12px 24px 16px;background:var(--n0);border-top:1px solid var(--n3);flex-shrink:0}
.input-box{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);border-radius:8px;background:var(--n1);padding:4px 4px 4px 12px}
.msg-input{flex:1;border:none;outline:none!important;box-shadow:none!important;background:none;height:32px}
.input-box:focus-within{border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb,var(--m500) 22%,transparent)}
/* messages */
.msg-group{display:flex;gap:12px;padding:8px 0;animation:msgIn .4s both}
.msg-avatar{width:36px;height:36px;border-radius:8px;background:var(--n2);color:var(--n7);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-meta{display:flex;align-items:baseline;gap:8px}
.msg-name{font-weight:700;color:var(--n10);font-size:14px}
.msg-tag{font-size:12px;color:var(--n7);border:1px solid var(--n4);border-radius:4px;padding:0 4px}
.msg-time{font-size:12px;color:var(--n6)}
.msg-content{flex:1;min-width:0;font-size:14px;color:var(--n9)}
.msg-content p{margin-top:2px}
.attach{margin-top:8px;border:1px solid var(--n3);border-left:3px solid var(--n5);border-radius:0 8px 8px 0;padding:12px 16px;background:var(--n1);max-width:760px}
.attach.main{border-left-color:var(--m500)}
.attach h4{font-size:14px;font-weight:700;color:var(--n10);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.btn{height:32px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s}
.btn.primary{background:var(--m500);color:var(--n10)}
.btn.primary:hover{background:var(--m400)}
.btn.outline{border:1px solid var(--n4);background:var(--n1);color:var(--n9)}
.btn.outline:hover{background:var(--n2)}
.btn.text{color:var(--n8);padding:0 8px}
.btn.text:hover{background:var(--n2)}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.tag.ok{background:var(--s1-bg);color:var(--s1-text)}
.tag.warn{background:var(--s3-bg);color:var(--s3-text)}
.tag.dark{background:var(--n10);color:var(--n0)}
.tag.main{background:var(--m50);color:var(--m700)}
.tag i.ph{font-size:12px}
/* heatmap */
.heat{display:grid;grid-template-columns:96px repeat(4,1fr);gap:4px;font-size:12px}
.heat .h{color:var(--n7);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}
.heat .r{color:var(--n8);display:flex;align-items:center;font-weight:600}
.cell{height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;animation:cellIn .45s both;background:var(--n2);color:var(--n7)}
.cell.l1{background:var(--m100);color:var(--m700)}
.cell.l2{background:var(--m300);color:var(--m800)}
.cell.l3{background:var(--m500);color:var(--n10)}
.todo{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--n3)}
.todo:last-child{border-bottom:none}
.todo label{flex:1;display:flex;gap:8px;align-items:center;cursor:pointer}
.todo input{accent-color:var(--m500);width:16px;height:16px}
.todo .done{text-decoration:line-through;color:var(--n6)}
/* tables / diff */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--n7);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--n3)}
td{padding:8px;border-bottom:1px solid var(--n3);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.sel td{background:var(--m50)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.diff > div{padding:8px 12px;border:1px solid var(--n3);border-radius:8px;background:var(--n0)}
.diff small{display:block;font-size:12px;color:var(--n7);font-weight:600;margin-bottom:4px}
.diff .del{text-decoration:line-through;color:var(--n6)}
.diff .add{font-weight:700;color:var(--n10);background:var(--m50);padding:0 4px;border-radius:4px}
/* form */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--n7)}
.field select,.field input,.field textarea{height:36px;padding:0 12px;border:1px solid var(--n4);border-radius:8px;background:var(--n1)}
.field textarea{height:72px;padding:8px 12px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
.cand{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--n3);animation:msgIn .4s both}
.cand:last-child{border-bottom:none}
.cand .q{flex:1;font-size:14px}
.cand .q b{display:block;color:var(--n10);margin-bottom:4px}
.cand .q small{display:block;font-size:12px;color:var(--n7);margin-top:4px}
.cand.discard .q b{color:var(--n6);text-decoration:line-through}
/* report */
.doc{background:var(--n1);border:1px solid var(--n3);border-radius:8px;padding:24px;max-width:760px;margin-top:8px}
.doc h3{font-size:36px;line-height:1.2;font-weight:700;color:var(--n10);letter-spacing:-.02em}
.doc .sub{font-size:12px;color:var(--n7);margin:4px 0 16px}
.doc h5{font-size:14px;font-weight:700;color:var(--n10);margin:16px 0 8px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:12px}
.bar span:first-child{width:80px;color:var(--n8)}
.bar .t{flex:1;height:8px;background:var(--n2);border-radius:4px;overflow:hidden}
.bar .f{height:100%;background:var(--n4);transform-origin:left;animation:growX .8s both;border-radius:4px}
.bar .f.m{background:var(--m500)}
.trend path.l{fill:none;stroke:var(--m500);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;animation:drawPath 1.4s both}
.trend circle{fill:var(--n1);stroke:var(--m500);stroke-width:2}
.trend text{font-size:12px;fill:var(--n7)}
.trend line{stroke:var(--n3)}
/* info */
.info-panel{width:320px;background:var(--n1);border-left:1px solid var(--n3);flex-shrink:0;overflow:auto;animation:slideIn .3s both}
.info-header{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3)}
.info-header h3{font-size:14px;font-weight:700;color:var(--n10)}
.info-section{padding:16px;border-bottom:1px solid var(--n3)}
.info-label{font-size:12px;font-weight:600;color:var(--n7);margin-bottom:8px}
.info-value{font-size:14px;color:var(--n10);font-variant-numeric:tabular-nums}
.member-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.member-avatar{width:28px;height:28px;border-radius:8px;background:var(--n2);color:var(--n7);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.member-role{margin-left:auto;font-size:12px;color:var(--n7)}
.pinned-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--n9);cursor:pointer;width:100%;text-align:left}
.pinned-item:hover{text-decoration:underline}
.live{animation:blink 1.6s infinite}
.brief{position:relative;overflow:hidden;border:1px solid var(--n3);border-radius:8px;background:linear-gradient(135deg,var(--m50) 0%,var(--n0) 70%);padding:24px 32px;margin:4px 0 16px;max-width:760px;animation:msgIn .4s both}
.brief-k{font-size:12px;font-weight:700;color:var(--m700);letter-spacing:.02em}
.brief-h{font-size:36px;line-height:1.2;font-weight:700;color:var(--n10);letter-spacing:-.03em;margin:4px 0 8px}
.brief p{font-size:14px;color:var(--n8);max-width:420px}
.brief svg{position:absolute;right:16px;top:12px;width:230px;height:110px}
.brief svg .sc{fill:none;stroke:var(--m500);stroke-width:3;stroke-linecap:round;stroke-dasharray:400;animation:drawPath 1.6s .2s both}
.brief svg .gr{fill:var(--n3)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:var(--n10);color:var(--n0);padding:8px 16px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:8px;animation:msgIn .3s both}
.overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--n10) 40%,transparent);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:100%;max-width:420px;background:var(--n1);border-radius:8px;border:1px solid var(--n4);padding:24px;animation:msgIn .3s both}
.modal h2{font-size:16px;font-weight:700;color:var(--n10);margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const Ph = ({ n }) => <i className={'ph ph-' + n} />;

const STUDENTS = [
  { code: 'S-0417', on: true, wait: 2 },
  { code: 'S-0302', on: true, wait: 1 },
  { code: 'S-0288', on: false, wait: 0 },
  { code: 'S-0511', on: true, wait: 0 },
  { code: 'S-0126', on: false, wait: 1 },
  { code: 'S-0349', on: false, wait: 0 },
];
const UNITS = ['이차방정식', '이차함수', '연립방정식', '인수분해', '부등식'];
const TYPES = ['부호 처리', '검산 생략', '식 세우기', '계산 실수'];
const HEAT = [[3, 2, 1, 0], [1, 1, 0, 2], [0, 1, 2, 0], [2, 0, 0, 1], [0, 0, 1, 0]];
const lv = v => (v >= 3 ? 'l3' : v === 2 ? 'l2' : v === 1 ? 'l1' : '');

const REASONS = ['인식 오류 보정', '오개념 분류 변경', '힌트 부적절', '기타'];

function App() {
  const [scr, setScr] = useState('main');
  const [stu, setStu] = useState('S-0417');
  const [info, setInfo] = useState(true);
  const [toast, setToast] = useState(null);
  const [todos, setTodos] = useState({ a: false, b: false, c: false });
  const [log, setLog] = useState({});
  const [draft, setDraft] = useState('');
  const [versions, setVersions] = useState([{ v: 'v1', who: 'AI 원본', t: '10.05 21:04', miscon: '계산 실수', note: '3번째 줄 계산 오류로 판정' }]);
  const [reason, setReason] = useState(REASONS[1]);
  const [miscon, setMiscon] = useState('부호 처리 오개념');
  const [memo, setMemo] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [gen, setGen] = useState({ grade: '중3', unit: '이차방정식', diff: '중', miscon: '부호 처리' });
  const [busy, setBusy] = useState(false);
  const [cands, setCands] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [qOpen, setQOpen] = useState(true);
  const [modal, setModal] = useState(false);

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 2200); return () => clearTimeout(t); } }, [toast]);

      {info && (
        <aside className="info-panel" data-info-panel style={{ width: 320 }}>
          <header className="info-header"><h3>{stu} 학생 정보</h3><button className="icon-btn close-info" aria-label="닫기" onClick={() => setInfo(false)}><Ph n="x" /></button></header>
          <div className="info-section">
            <div className="info-label">최근 2주</div>
            <div className="info-value">풀이 14건 · 재풀이 5건 · 확인 대기 {STUDENTS.find(s => s.code === stu).wait}건</div>
          </div>
          <div className="info-section">
            <div className="info-label">연결된 계정 (3)</div>
            <div className="member-item"><span className="member-avatar">학</span>학생 계정<span className="member-role">본인 풀이</span></div>
            <div className="member-item"><span className="member-avatar">부</span>학부모 계정<span className="member-role">리포트만</span></div>
            <div className="member-item"><span className="member-avatar">교</span>교사 계정<span className="member-role">전체</span></div>
          </div>
          <div className="info-section">
            <div className="info-label">고정된 항목</div>
            <button className="pinned-item" onClick={() => setScr('review')}><Ph n="clipboard-text" />부호 처리 진단 검수 기록</button>
            <button className="pinned-item" onClick={() => setScr('report')}><Ph n="file-pdf" />10월 1주차 리포트</button>
          </div>
          <div className="info-section">
            <div className="info-label">개인정보 처리</div>
            <div className="info-value" style={{ fontSize: 12, color: 'var(--n7)' }}>AI 분석에는 익명 학생 코드와 풀이 이미지만 전달합니다. 식별 정보 연결표는 별도 저장소에 분리 보관합니다.</div>
            <p style={{ fontSize: 12, color: 'var(--n6)', marginTop: 8 }}>샘플 데모 · 자체 개발 프로젝트</p>
          </div>
        </aside>
      )}

      {modal && (
        <div className="overlay" onClick={e => { if (e.target === e.currentTarget) setModal(false); }}>
          <div className="modal" role="dialog" aria-label="열람 권한 설정">
            <h2>열람 권한 설정</h2>
            <div className="field"><label>대상 계정</label><select><option>학부모 계정 (연결된 자녀 1명)</option><option>학부모 계정 추가 연결</option></select></div>
            <div className="field"><label>공개 항목</label><select><option>주간 리포트만</option><option>주간 리포트 + 재풀이 이력</option></select></div>
            <div className="field"><label>보관 기간</label><select><option>6개월</option><option>1년</option></select></div>
            <div className="btn-row" style={{ justifyContent: 'flex-end' }}>
              <button className="btn outline" onClick={() => setModal(false)}>취소</button>
              <button className="btn primary" onClick={() => { setModal(false); setToast('열람 권한을 저장했습니다.'); }}>저장</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast"><Ph n="check-circle" />{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
