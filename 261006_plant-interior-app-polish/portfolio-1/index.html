<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜테리어 공간 시뮬레이션 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 67°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fcfdf0;
  --m100:#f9fce0;
  --m200:#f2f9c1;
  --m300:#ebf59c;
  --m400:#e2f072;
  --m500:#daec4b;
  --m600:#d2e823;
  --m700:#acbe1d;
  --m800:#869416;
  --m900:#5e6810;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f3f3f1;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d7d5;
  --n5:#babab5;
  --n6:#979890;
  --n7:#797a71;
  --n8:#676b5f;
  --n9:#3a3a36;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--n0);color:var(--n10);-webkit-font-smoothing:antialiased}
#root{width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{position:relative;width:100%;height:100vh;overflow:hidden}
.map{position:absolute;inset:0;background:var(--n2)}
.map svg.scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* floating nav pill */
.topbar{width:max-content;white-space:nowrap;position:absolute;z-index:30;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 10px 8px 18px;background:var(--n1);border:2px solid var(--n10);border-radius:99px;box-shadow:4px 4px 0 var(--n10)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.03em;margin-right:10px}
.brand i{font-size:22px}
.navbtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;border:2px solid transparent;transition:background .15s,transform .15s}
.navbtn:hover{background:var(--n2)}
.navbtn.active{background:var(--m600);border-color:var(--n10);font-weight:700}
.navbtn:active{transform:scale(.97)}
.navbtn i{font-size:18px}
.topbar .sep{width:2px;height:24px;background:var(--n4);margin:0 4px}
.pillbtn{height:40px;padding:0 18px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.pillbtn:hover{background:var(--n2);transform:scale(1.03)}
.pillbtn.primary{background:var(--m600)}
.pillbtn.dark{background:var(--n10);color:var(--n1)}
.pillbtn:disabled{opacity:.45;cursor:default}
.ripple-dot{position:absolute;border-radius:50%;background:var(--n10);opacity:.18;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
/* overlays */
.panel{position:absolute;z-index:20;background:var(--n1);border:2px solid var(--n10);border-radius:32px;box-shadow:6px 6px 0 var(--n10)}
.drawer{left:20px;top:88px;bottom:20px;width:372px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;overflow:hidden;animation:slideInLeft .45s cubic-bezier(.2,.8,.2,1) both}
.display{font-size:44px;line-height:1.02;font-weight:800;letter-spacing:-.045em}
.lead{font-size:14px;line-height:1.5;color:var(--n8)}
.h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.dropzone{border:2px dashed var(--n10);border-radius:24px;padding:16px;background:var(--n0);display:flex;gap:12px;align-items:center}
.thumb{width:64px;height:48px;border-radius:12px;border:2px solid var(--n10);overflow:hidden;flex:none;background:var(--n3)}
.thumb svg{width:100%;height:100%;display:block}
.bar{height:12px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--m600);border-right:2px solid var(--n10);transform-origin:left;animation:barGrow 1.2s ease-out both}
.list-panel{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0;padding-right:2px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--n10);border-radius:20px;background:var(--n1);text-align:left;width:100%;transition:transform .15s,background .15s;animation:slideUp .4s ease-out both}
.row:hover{transform:scale(1.02);background:var(--n0)}
.row.sel{background:var(--m600)}
.row .ico{width:40px;height:40px;border-radius:14px;border:2px solid var(--n10);display:grid;place-items:center;font-size:20px;background:var(--n2);flex:none}
.row.sel .ico{background:var(--n1)}
.row b{display:block;font-size:14px;letter-spacing:-.02em}
.row span{display:block;font-size:12px;color:var(--n8);margin-top:2px}
.row.sel span{color:var(--n10)}
.chip{height:32px;padding:0 14px;border-radius:99px;border:2px solid var(--n10);font-size:12.5px;font-weight:700;background:var(--n1)}
.chip.on{background:var(--n10);color:var(--n1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:44px;border:2px solid var(--n10);border-radius:99px;padding:0 16px;background:var(--n1)}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:14px;background:transparent;min-width:0}
.search:focus-within{outline:3px solid var(--m600)}
.detail-card{right:20px;bottom:20px;width:340px;padding:22px 22px;display:flex;flex-direction:column;gap:12px;animation:slideInRight .45s cubic-bezier(.2,.8,.2,1) both}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--n8);padding:6px 0;border-bottom:2px solid var(--n3)}
.kv b{color:var(--n10)}
.map-control{right:20px;top:88px;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;padding:0;animation:fadeIn .5s both}
.map-control button{width:52px;height:52px;display:grid;place-items:center;font-size:22px;background:var(--n1)}
.map-control button+button{border-top:2px solid var(--n10)}
.map-control button:hover{background:var(--m600)}
.legend{left:412px;bottom:20px;padding:10px 16px;border-radius:99px;display:flex;gap:16px;font-size:12px;font-weight:700;align-items:center;box-shadow:4px 4px 0 var(--n10);animation:fadeIn .6s both}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--n10);display:inline-block}
.marker{position:absolute;z-index:15;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid var(--n10);background:var(--n1);display:grid;place-items:center;box-shadow:3px 3px 0 var(--n10);transition:transform .15s}
.marker i{transform:rotate(45deg);font-size:20px}
.marker.on{background:var(--m600)}
.marker:hover{transform:rotate(-45deg) scale(1.1)}
.marker::after{content:"";position:absolute;inset:-8px;border-radius:inherit;border:2px solid var(--n10);opacity:0;animation:pulse 2.2s ease-out infinite}
.mtag{position:absolute;z-index:16;padding:4px 10px;border-radius:99px;background:var(--n10);color:var(--n1);font-size:11.5px;font-weight:700;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700;border:2px solid var(--n10);background:var(--n2)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text);border-color:var(--s1)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text);border-color:var(--s3)}
.range{width:100%;accent-color:var(--n10)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700}
.field .top{display:flex;justify-content:space-between}
.toast{position:absolute;z-index:60;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:12px 22px;border-radius:99px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;animation:slideUp .35s ease-out both}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;color:var(--n7)}
.step .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--n10);display:grid;place-items:center;font-size:13px;background:var(--n1);color:var(--n10);flex:none}
.step.done{color:var(--n10)}
.step.done .n{background:var(--n10);color:var(--n1)}
.step.cur{color:var(--n10)}
.step.cur .n{background:var(--m600);animation:pulse2 1.2s ease-in-out infinite}
.shimmer-layer{position:absolute;inset:0;z-index:12;background:linear-gradient(100deg,transparent 30%,var(--m100) 50%,transparent 70%);background-size:200% 100%;opacity:.8;animation:shimmer 1.4s linear infinite;pointer-events:none}
.compare-bar{position:absolute;z-index:25;left:412px;right:392px;bottom:20px;height:64px;display:flex;align-items:center;gap:16px;padding:0 26px;border-radius:99px}
.divider{position:absolute;z-index:14;top:0;bottom:0;width:4px;background:var(--n10);margin-left:-2px}
.divider::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--m600);border:2px solid var(--n10)}
.tag-ba{position:absolute;z-index:16;top:96px;padding:6px 14px;border-radius:99px;background:var(--n1);border:2px solid var(--n10);font-size:12px;font-weight:800}
.saved{display:flex;gap:10px;align-items:center;padding:8px;border:2px solid var(--n10);border-radius:18px;background:var(--n0)}
/* ipad */
.device{position:absolute;z-index:18;left:calc(50% + 160px);top:calc(50% + 10px);width:800px;height:570px;transform:translate(-50%,-50%) scale(var(--ds,1));padding:18px;border-radius:48px;background:var(--n10);border:2px solid var(--n10);box-shadow:8px 8px 0 var(--n5);animation:fadeInScale .5s both}
.device.desktop{width:860px;height:530px;padding:14px;border-radius:24px}
.device .screen{position:relative;width:100%;height:100%;border-radius:30px;background:var(--n0);overflow:hidden;display:grid;grid-template-columns:160px 1fr 180px}
.device.desktop .screen{border-radius:12px}
.dpanel{padding:18px 14px;background:var(--n1);display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.dpanel.r{border-left:2px solid var(--n10)}
.dpanel.l{border-right:2px solid var(--n10)}
.dmini{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--n10);border-radius:14px;font-weight:700;font-size:12px;background:var(--n0)}
.dcenter{position:relative;overflow:hidden}
.dcenter svg{position:absolute;inset:0;width:100%;height:100%}
.safe{position:absolute;inset:10px;border:2px dashed var(--n6);border-radius:24px;pointer-events:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInScale{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(var(--ds,1))}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translate(0,12px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.6)}}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes beamIn{from{opacity:0}to{opacity:1}}
.beam{animation:beamIn 1s ease-out both}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ───────── 데이터 ───────── */
const ASSETS = [
  { kind: 'monstera', name: '몬스테라 델리시오사', meta: '중대형 · 반그늘 · 물 주 1회', cat: '잎식물', icon: 'ph-leaf' },
  { kind: 'snake',    name: '산세베리아 로렌티',   meta: '중형 · 저광량 · 물 월 2회', cat: '공기정화', icon: 'ph-plant' },
  { kind: 'palm',     name: '아레카야자',           meta: '대형 · 밝은 간접광',         cat: '대형목', icon: 'ph-tree-palm' },
  { kind: 'ficus',    name: '벤자민 고무나무',      meta: '대형 · 밝은 곳',             cat: '대형목', icon: 'ph-tree' },
  { kind: 'pothos',   name: '스킨답서스 행잉',      meta: '소형 · 저광량 · 덩굴형',     cat: '잎식물', icon: 'ph-flower-lotus' },
  { kind: 'zz',       name: '금전수',               meta: '중형 · 저광량 · 건조 내성',   cat: '공기정화', icon: 'ph-plant' },
];
const CATS = ['전체', '잎식물', '공기정화', '대형목'];
const ZONES = [
  { id: 'z1', label: '창가 밝은 영역', x: 72, y: 66, icon: 'ph-sun', light: '직사광 4시간 구간', fit: '대형목·몬스테라 적합', area: '1.8㎡' },
  { id: 'z2', label: '소파 옆 반그늘', x: 28, y: 62, icon: 'ph-plant', light: '간접광 중간', fit: '산세베리아·금전수 적합', area: '1.2㎡' },
  { id: 'z3', label: '벽면 선반 상단', x: 14, y: 36, icon: 'ph-flower-lotus', light: '밝은 간접광', fit: '행잉·덩굴형 적합', area: '0.6㎡' },
];
const INIT_PLANTS = [
  { id: 1, kind: 'monstera', x: 560, y: 815, s: 0.72, r: 0 },
  { id: 2, kind: 'snake',    x: 1010, y: 800, s: 0.7,  r: 0 },
  { id: 3, kind: 'palm',     x: 455,  y: 715, s: 0.58, r: 0 },
];
const KIND_NAME = Object.fromEntries(ASSETS.map(a => [a.kind, a.name]));

/* ───────── 작은 유틸 ───────── */
function useCountUp(target, ms = 1200, run = true) {
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!run) { setV(target); return; }
    setV(0);
    const t0 = Date.now();
    const id = setInterval(() => {
      const p = Math.min(1, (Date.now() - t0) / ms);
      setV(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p >= 1) clearInterval(id);
    }, 30);
    return () => clearInterval(id);
  }, [target, run]);
  return v;
}
function Btn({ className = '', onClick, children, disabled, title }) {
  const [dots, setDots] = useState([]);
  const click = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const d = { id: Date.now() + Math.random(), x: e.clientX - r.left - 8, y: e.clientY - r.top - 8 };
    setDots(p => [...p, d]);
    setTimeout(() => setDots(p => p.filter(q => q.id !== d.id)), 650);
    onClick && onClick(e);
  };
  return <button className={className} onClick={click} disabled={disabled} title={title}>{children}{dots.map(d => <span key={d.id} className="ripple-dot" style={{ left: d.x, top: d.y, width: 16, height: 16 }} />)}</button>;
}

/* ───────── 식물 SVG ───────── */
function PlantShape({ kind, hl }) {
  const leaf = hl ? 'var(--m400)' : 'var(--n1)';
  const leaf2 = hl ? 'var(--m300)' : 'var(--n3)';
  const st = { stroke: 'var(--n10)', strokeWidth: 3.5, strokeLinejoin: 'round', strokeLinecap: 'round' };
  const pot = (w = 54, h = 62, fill = 'var(--n1)') => (
    <g>
      <path d={`M${-w} -${h} L${w} -${h} L${w - 12} 0 L${-w + 12} 0 Z`} fill={fill} {...st} />
      <path d={`M${-w - 5} -${h} L${w + 5} -${h}`} {...st} strokeWidth="6" />
      <path d={`M${-w + 14} -${h - 22} L${w - 14} -${h - 22}`} {...st} strokeWidth="2.5" opacity=".5" />
    </g>
  );
  const monsteraLeaf = (rot, len, sw, fill) => (
    <g transform={`rotate(${rot})`}>
      <path d={`M0 0 C ${-sw} ${-len * .3}, ${-sw} ${-len * .75}, 0 ${-len} C ${sw} ${-len * .75}, ${sw} ${-len * .3}, 0 0 Z`} fill={fill} {...st} />
      <path d={`M0 -6 L0 ${-len + 12}`} {...st} strokeWidth="2.5" />
      <path d={`M${-sw * .55} ${-len * .45} l${sw * .5} 10 M${sw * .55} ${-len * .45} l${-sw * .5} 10 M${-sw * .5} ${-len * .68} l${sw * .5} 8 M${sw * .5} ${-len * .68} l${-sw * .5} 8`} {...st} strokeWidth="2.5" />
    </g>
  );
  if (kind === 'monstera') return (
    <g>
      <g transform="translate(0 -62)">
        <g className="sway">
          {monsteraLeaf(-50, 120, 40, leaf2)}{monsteraLeaf(48, 125, 42, leaf2)}
          {monsteraLeaf(-20, 160, 48, leaf)}{monsteraLeaf(22, 168, 50, leaf)}{monsteraLeaf(0, 130, 40, leaf2)}
        </g>
      </g>
      {pot()}
    </g>
  );
  if (kind === 'snake') {
    const blade = (x, h, w, rot, f) => <path transform={`translate(${x} -52) rotate(${rot})`} d={`M${-w} 0 Q${-w * 1.3} ${-h * .55} 0 ${-h} Q${w * 1.3} ${-h * .55} ${w} 0 Z`} fill={f} {...st} />;
    return <g><g className="sway">{blade(-26, 180, 14, -12, leaf2)}{blade(26, 200, 14, 10, leaf2)}{blade(-6, 240, 16, -3, leaf)}{blade(12, 210, 15, 5, leaf)}{blade(-16, 150, 12, -22, leaf)}</g>{pot(48, 56)}</g>;
  }
  if (kind === 'palm') {
    const frond = (rot, len, f) => (
      <g transform={`rotate(${rot})`}>
        <path d={`M0 0 Q${len * .15} ${-len * .6} ${len * .5} ${-len}`} fill="none" {...st} />
        <path d={`M${len * .05} ${-len * .2} l-30 -8 M${len * .1} ${-len * .35} l-34 -6 M${len * .18} ${-len * .5} l-34 -2 M${len * .06} ${-len * .22} l28 -14 M${len * .12} ${-len * .38} l30 -14 M${len * .2} ${-len * .55} l26 -16`} fill="none" {...st} strokeWidth="3" />
        <ellipse cx={len * .22} cy={-len * .5} rx="26" ry={len * .38} transform={`rotate(14 ${len * .22} ${-len * .5})`} fill={f} {...st} opacity=".92" />
      </g>
    );
    return <g><g transform="translate(0 -62)"><g className="sway">{frond(-62, 230, leaf2)}{frond(62, 230, leaf2)}{frond(-28, 260, leaf)}{frond(30, 258, leaf)}{frond(0, 220, leaf)}</g></g><path d="M0 -62 L0 -150" {...st} />{pot(58, 70)}</g>;
  }
  if (kind === 'ficus') return (
    <g>
      <path d="M0 -60 C-6 -120 6 -170 0 -230" fill="none" {...st} strokeWidth="9" />
      <g className="sway">
        <circle cx="-58" cy="-210" r="54" fill={leaf2} {...st} /><circle cx="54" cy="-216" r="58" fill={leaf2} {...st} />
        <circle cx="0" cy="-262" r="60" fill={leaf} {...st} /><circle cx="-8" cy="-190" r="52" fill={leaf} {...st} />
        <path d="M-60 -220 q10 -10 20 0 M40 -230 q12 -10 22 0 M-10 -270 q10 -10 20 0 M-14 -196 q10 -10 20 0" fill="none" {...st} strokeWidth="2.5" />
      </g>
      {pot(56, 66)}
    </g>
  );
  if (kind === 'pothos') return (
    <g>
      <g className="sway">
        {[[-40, 150], [-10, 210], [28, 170], [52, 120]].map(([x, h], i) => (
          <g key={i}>
            <path d={`M${x * .4} -64 C${x} -90 ${x * 1.1} ${-64 + h * .5} ${x} ${-64 + h}`} fill="none" {...st} />
            {[.25, .5, .75, 1].map((t, j) => <path key={j} transform={`translate(${x * (.5 + t * .55)} ${-64 + h * t * .95})`} d="M0 0 C-18 -6 -22 20 0 28 C22 20 18 -6 0 0 Z" fill={j % 2 ? leaf2 : leaf} {...st} strokeWidth="3" />)}
          </g>
        ))}
        <path d="M-30 -64 C-40 -100 -10 -120 0 -110 C10 -120 40 -100 30 -64 Z" fill={leaf} {...st} />
      </g>
      {pot(46, 60, 'var(--n1)')}
    </g>
  );
  /* zz */
  const stem = (rot, h) => <g transform={`rotate(${rot})`}><path d={`M0 0 L0 ${-h}`} {...st} />{[.2, .35, .5, .65, .8, 1].map((t, i) => <g key={i}><ellipse cx="-14" cy={-h * t} rx="16" ry="8" transform={`rotate(-30 -14 ${-h * t})`} fill={i % 2 ? leaf2 : leaf} {...st} strokeWidth="3" /><ellipse cx="14" cy={-h * t + 6} rx="16" ry="8" transform={`rotate(30 14 ${-h * t + 6})`} fill={i % 2 ? leaf : leaf2} {...st} strokeWidth="3" /></g>)}</g>;
  return <g><g transform="translate(0 -58)"><g className="sway">{stem(-28, 150)}{stem(0, 190)}{stem(26, 160)}</g></g>{pot(50, 58)}</g>;
}

/* ───────── 화면: 식물 배치 캔버스 ───────── */
function CanvasScreen({ toast, plants, setPlants, selId, setSelId, history, setHistory }) {
  const [cat, setCat] = useState('전체');
  const [q, setQ] = useState('');
  const [zoom, setZoom] = useState(1);
  const gRef = useRef(null);
  const drag = useRef(null);
  const sel = plants.find(p => p.id === selId);
  const assets = ASSETS.filter(a => (cat === '전체' || a.cat === cat) && a.name.includes(q));

  const toLocal = e => {
    const g = gRef.current; if (!g) return { x: 0, y: 0 };
    const svg = g.ownerSVGElement; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(g.getScreenCTM().inverse());
  };
  const snapshot = () => setHistory(h => [...h.slice(-19), plants]);
  const onPlantDown = (e, p) => {
    e.stopPropagation(); setSelId(p.id);
    const pt = toLocal(e); drag.current = { mode: 'move', id: p.id, dx: p.x - pt.x, dy: p.y - pt.y, snap: false };
    e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId);
  };
  const onHandleDown = (e, p) => {
    e.stopPropagation(); drag.current = { mode: 'resize', id: p.id, snap: false };
    e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId);
  };
  const onMove = e => {
    const d = drag.current; if (!d) return;
    const pt = toLocal(e);
    if (!d.snap) { snapshot(); d.snap = true; }
    setPlants(ps => ps.map(p => {
      if (p.id !== d.id) return p;
      if (d.mode === 'move') return { ...p, x: Math.max(60, Math.min(1380, pt.x + d.dx)), y: Math.max(660, Math.min(880, pt.y + d.dy)) };
      const dist = Math.hypot(pt.x - p.x, pt.y - (p.y - 250 * p.s));
      return { ...p, s: Math.max(.4, Math.min(2.2, Math.hypot(pt.x - p.x, pt.y - p.y) / 262)) };
    }));
  };
  const onUp = () => { drag.current = null; };
  const add = a => {
    snapshot();
    const id = Date.now();
    setPlants(ps => [...ps, { id, kind: a.kind, x: 600 + Math.round(Math.random() * 360), y: 820 + Math.round(Math.random() * 40), s: .65, r: 0 }]);
    setSelId(id); toast(a.name + ' 배치');
  };
  const patch = o => setPlants(ps => ps.map(p => p.id === selId ? { ...p, ...o } : p));
  const undo = () => { if (!history.length) { toast('되돌릴 배치가 없습니다'); return; } setPlants(history[history.length - 1]); setHistory(h => h.slice(0, -1)); toast('직전 배치로 되돌립니다'); };
  const dup = () => { if (!sel) return; snapshot(); const id = Date.now(); setPlants(ps => [...ps, { ...sel, id, x: Math.min(1380, sel.x + 90) }]); setSelId(id); toast('복제 완료'); };
  const del = () => { if (!sel) return; snapshot(); setPlants(ps => ps.filter(p => p.id !== selId)); setSelId(null); toast('삭제 완료'); };

  return (
    <>
      <div className="map" onPointerMove={onMove} onPointerUp={onUp}>
        <Scene plants={plants} selId={selId} interactive zoom={zoom} groupRef={gRef} onPlantDown={onPlantDown} onHandleDown={onHandleDown} onBg={() => setSelId(null)} />
      </div>
      <aside className="panel drawer" style={{ borderRadius: 32 }}>
        <div>
          <div className="h3" style={{ fontSize: 22, letterSpacing: '-.03em' }}>식물 에셋</div>
          <p className="lead" style={{ marginTop: 4 }}>항목을 누르면 방 안에 놓이고, 끌어서 위치를 옮깁니다.</p>
        </div>
        <label className="search"><i className="ph ph-magnifying-glass" /><input placeholder="식물 이름 검색" value={q} onChange={e => setQ(e.target.value)} /></label>
        <div className="chips">{CATS.map(c => <button key={c} className={'chip' + (cat === c ? ' on' : '')} onClick={() => setCat(c)}>{c}</button>)}</div>
        <div className="list-panel">
          {assets.map((a, i) => (
            <button key={a.kind} className="row" style={{ animationDelay: i * 60 + 'ms' }} onClick={() => add(a)}>
              <span className="ico"><i className={'ph ' + a.icon} /></span>
              <div style={{ flex: 1 }}><b>{a.name}</b><span>{a.meta}</span></div>
              <i className="ph ph-plus-circle" style={{ fontSize: 22 }} />
            </button>
          ))}
          {!assets.length && <div className="lead" style={{ padding: 12 }}>검색 결과가 없습니다.</div>}
        </div>
      </aside>
      <div className="panel map-control">
        <button onClick={() => setZoom(z => Math.min(1.8, +(z + .2).toFixed(1)))} title="확대"><i className="ph ph-magnifying-glass-plus" /></button>
        <button onClick={() => setZoom(z => Math.max(.8, +(z - .2).toFixed(1)))} title="축소"><i className="ph ph-magnifying-glass-minus" /></button>
        <button onClick={undo} title="실행 취소"><i className="ph ph-arrow-counter-clockwise" /></button>
      </div>
      <div className="panel legend">
        <span><i className="dot" style={{ background: 'var(--m600)' }} />선택</span>
        <span><i className="dot" style={{ background: 'var(--n1)' }} />배치 완료 {plants.length}개</span>
        <span>배율 {Math.round(zoom * 100)}%</span>
      </div>
      <div className="panel detail-card" style={{ borderRadius: 32 }}>
        {sel ? (<>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span className="badge"><i className="ph ph-hand-grabbing" />선택됨</span>
            <span style={{ fontSize: 12, color: 'var(--n8)' }}>x {Math.round(sel.x)} · y {Math.round(sel.y)}</span>
          </div>
          <h3 style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.03em' }}>{KIND_NAME[sel.kind]}</h3>
          <label className="field"><div className="top"><span>크기</span><span>{Math.round(sel.s * 100)}%</span></div><input className="range" type="range" min="40" max="220" value={Math.round(sel.s * 100)} onChange={e => patch({ s: +e.target.value / 100 })} /></label>
          <label className="field"><div className="top"><span>회전</span><span>{sel.r}°</span></div><input className="range" type="range" min="-30" max="30" value={sel.r} onChange={e => patch({ r: +e.target.value })} /></label>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn className="pillbtn" onClick={dup}><i className="ph ph-copy" />복제</Btn>
            <Btn className="pillbtn" onClick={del}><i className="ph ph-trash" />삭제</Btn>
          </div>
        </>) : (<>
          <span className="badge"><i className="ph ph-cursor-click" />선택 없음</span>
          <h3 style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.03em' }}>식물을 눌러 보세요</h3>
          <p className="lead">선택하면 크기·회전 조절 도구와 모서리 핸들이 나타납니다.</p>
          <Btn className="pillbtn" onClick={undo}><i className="ph ph-arrow-counter-clockwise" />직전 배치 되돌리기</Btn>
        </>)}
      </div>
    </>
  );
}

/* ───────── 화면: 렌더링·저장 ───────── */
function RenderScreen({ toast, plants }) {
  const [phase, setPhase] = useState('done');
  const [pct, setPct] = useState(100);
  const [cut, setCut] = useState(52);
  const [saved, setSaved] = useState([{ id: 1, name: '거실 · 몬스테라 배치', at: '10.04 14:20' }, { id: 2, name: '서재 · 선반 구성', at: '10.02 09:41' }]);
  const timer = useRef(null);
  useEffect(() => () => clearInterval(timer.current), []);
  const run = () => {
    clearInterval(timer.current); setPhase('running'); setPct(0);
    let p = 0;
    timer.current = setInterval(() => { p += 4; setPct(Math.min(100, p)); if (p >= 100) { clearInterval(timer.current); setPhase('done'); toast('렌더링 완료'); } }, 120);
  };
  const stage = pct < 15 ? 0 : pct < 50 ? 1 : pct < 100 ? 2 : 3;
  const labels = ['작업 대기열 등록', '이미지 엔진 요청 전송', '합성·보정 진행', '결과 이미지 저장 준비'];
  const save = () => { setSaved(s => [{ id: Date.now(), name: '거실 · 최신 렌더 결과', at: '방금' }, ...s]); toast('내 프로젝트에 저장했습니다'); };
  return (
    <>
      <div className="map">
        <Scene plants={[]} beams={false} />
        <div style={{ position: 'absolute', inset: 0, clipPath: `inset(0 0 0 ${cut}%)` }}><Scene plants={plants} beams glow /></div>
        {phase === 'running' && <div className="shimmer-layer" />}
        <div className="divider" style={{ left: cut + '%' }} />
        <span className="tag-ba" style={{ left: `calc(${cut}% - 74px)` }}>원본</span>
        <span className="tag-ba" style={{ left: `calc(${cut}% + 18px)` }}>렌더 결과</span>
      </div>
      <aside className="panel drawer" style={{ borderRadius: 32 }}>
        <div>
          <h1 className="display">자연스럽게<br />완성합니다</h1>
          <p className="lead" style={{ marginTop: 10 }}>배치한 식물 {plants.length}개를 이미지 엔진에 보내 빛과 그림자를 맞춘 결과로 합성합니다.</p>
        </div>
        <div className="bar"><b key={phase + pct} style={{ width: pct + '%', animation: 'none' }} /></div>
        <div className="steps">
          {labels.map((l, i) => {
            const cls = phase === 'done' || i < stage ? 'done' : i === stage ? 'cur' : '';
            return <div key={l} className={'step ' + cls}><span className="n">{cls === 'done' ? <i className="ph ph-check" /> : i + 1}</span>{l}</div>;
          })}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 'auto' }}>
          <Btn className="pillbtn primary" onClick={run} disabled={phase === 'running'}><i className="ph ph-sparkle" />{phase === 'running' ? '진행 중' : '다시 렌더'}</Btn>
          <Btn className="pillbtn" onClick={() => { toast('실패 시 사유 안내와 함께 같은 설정으로 재시도합니다'); }}><i className="ph ph-arrow-clockwise" />재시도 안내</Btn>
        </div>
      </aside>
      <div className="panel map-control">
        <button onClick={() => setCut(c => Math.max(5, c - 10))} title="원본 쪽"><i className="ph ph-caret-left" /></button>
        <button onClick={() => setCut(c => Math.min(95, c + 10))} title="결과 쪽"><i className="ph ph-caret-right" /></button>
      </div>
      <div className="panel compare-bar">
        <span style={{ fontSize: 12.5, fontWeight: 800, whiteSpace: 'nowrap' }}>원본 ↔ 결과</span>
        <input className="range" type="range" min="5" max="95" value={cut} onChange={e => setCut(+e.target.value)} />
      </div>
      <div className="panel detail-card" style={{ borderRadius: 32 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.03em' }}>내 프로젝트</h3>
          <span className={'badge ' + (phase === 'done' ? 'ok' : 'warn')}>{phase === 'done' ? '렌더 완료' : '렌더 중 ' + pct + '%'}</span>
        </div>
        <Btn className="pillbtn dark" onClick={save} disabled={phase !== 'done'}><i className="ph ph-floppy-disk" />내 프로젝트에 저장</Btn>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 190, overflow: 'auto' }}>
          {saved.map(s => (
            <div className="saved" key={s.id}>
              <div className="thumb"><svg viewBox="0 0 64 48"><rect width="64" height="48" fill="var(--n2)" /><rect y="32" width="64" height="16" fill="var(--n4)" /><circle cx="20" cy="26" r="9" fill="var(--n1)" stroke="var(--n10)" strokeWidth="2" /><rect x="34" y="10" width="14" height="20" fill="var(--n1)" stroke="var(--n10)" strokeWidth="2" /></svg></div>
              <div style={{ flex: 1, minWidth: 0 }}><b style={{ fontSize: 13 }}>{s.name}</b><div style={{ fontSize: 11.5, color: 'var(--n8)' }}>{s.at}</div></div>
              <Btn className="chip" onClick={() => toast('보관함에서 다시 엽니다')}>열기</Btn>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

/* ───────── 화면: 아이패드 가로 화면 대응 ───────── */
function IpadScreen({ toast, plants }) {
  const [mode, setMode] = useState('ipad');
  const [checks, setChecks] = useState({ safe: true, touch: true, rotate: false });
  const items = [
    { k: 'safe', t: '안전 영역 여백', d: '노치·홈 인디케이터를 피한 패널 배치' },
    { k: 'touch', t: '터치 타깃 44px', d: '핸들·버튼 최소 크기 점검' },
    { k: 'rotate', t: '회전 시 상태 유지', d: '가로↔세로 전환 후 배치 보존' },
  ];
  return (
    <>
      <div className="map"><Scene plants={[]} beams={false} /></div>
      <div className={'device' + (mode === 'desktop' ? ' desktop' : '')} style={{ '--ds': 1 }}>
        <div className="screen">
          <div className="dpanel l">
            <b style={{ fontSize: 13 }}>식물 에셋</b>
            {ASSETS.slice(0, 5).map(a => <div className="dmini" key={a.kind}><i className={'ph ' + a.icon} style={{ fontSize: 18 }} />{a.name.split(' ')[0]}</div>)}
          </div>
          <div className="dcenter"><Scene plants={plants} beams /><div className="safe" /></div>
          <div className="dpanel r">
            <b style={{ fontSize: 13 }}>속성</b>
            <div className="kv"><span>크기</span><b>100%</b></div>
            <div className="kv"><span>회전</span><b>0°</b></div>
            <div className="bar" style={{ marginTop: 6 }}><b style={{ width: '64%' }} /></div>
            <div className="dmini" style={{ background: 'var(--m600)', justifyContent: 'center' }}>렌더 요청</div>
          </div>
        </div>
      </div>
      <button className="marker on" style={{ left: 'calc(50% + 160px - 380px)', top: 'calc(50% - 250px)' }} onClick={() => toast('안전 영역 점검 위치')}><i className="ph ph-frame-corners" /></button>
      <button className="marker" style={{ left: 'calc(50% + 160px + 420px)', top: 'calc(50% + 10px)' }} onClick={() => toast('터치 타깃 점검 위치')}><i className="ph ph-hand-tap" /></button>
      <button className="marker" style={{ left: 'calc(50% + 160px)', top: 'calc(50% + 330px)' }} onClick={() => toast('홈 인디케이터 영역')}><i className="ph ph-minus" /></button>
      <aside className="panel drawer" style={{ borderRadius: 32 }}>
        <div>
          <h1 className="display">어느 화면에서도<br />같은 흐름</h1>
          <p className="lead" style={{ marginTop: 10 }}>가로 모드 기준으로 세 패널을 배치하고, 같은 코드로 웹과 앱을 함께 대응합니다.</p>
        </div>
        <div className="chips">
          <Btn className={'chip' + (mode === 'ipad' ? ' on' : '')} onClick={() => setMode('ipad')}><i className="ph ph-device-tablet" /> 태블릿 가로</Btn>
          <Btn className={'chip' + (mode === 'desktop' ? ' on' : '')} onClick={() => setMode('desktop')}><i className="ph ph-desktop" /> 데스크톱</Btn>
        </div>
        <div className="h3">점검 체크리스트</div>
        <div className="list-panel">
          {items.map(it => (
            <button key={it.k} className={'row' + (checks[it.k] ? ' sel' : '')} onClick={() => setChecks(c => ({ ...c, [it.k]: !c[it.k] }))}>
              <span className="ico"><i className={'ph ' + (checks[it.k] ? 'ph-check-circle' : 'ph-circle')} /></span>
              <div><b>{it.t}</b><span>{it.d}</span></div>
            </button>
          ))}
        </div>
        <div className="kv"><span>패키징 구성</span><b>Next.js · Ionic · Capacitor</b></div>
      </aside>
      <div className="panel detail-card" style={{ borderRadius: 32, width: 300 }}>
        <span className="badge ok"><i className="ph ph-check-circle" />점검 {Object.values(checks).filter(Boolean).length}/3</span>
        <h3 style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.03em' }}>{mode === 'ipad' ? '태블릿 가로 레이아웃' : '데스크톱 레이아웃'}</h3>
        <p className="lead">{mode === 'ipad' ? '좌 에셋 · 중 캔버스 · 우 속성 3패널을 겹침 없이 배치합니다.' : '패널 폭을 넓혀 같은 편집 플로우를 유지합니다.'}</p>
        <Btn className="pillbtn dark" onClick={() => toast('점검 체크리스트를 저장했습니다')}><i className="ph ph-clipboard-text" />점검 기록 남기기</Btn>
      </div>
    </>
  );
}

/* ───────── 앱 ───────── */
function App() {
  const [screen, setScreen] = useState('main');
  const [plants, setPlants] = useState(INIT_PLANTS);
  const [selId, setSelId] = useState(1);
  const [history, setHistory] = useState([]);
  const [msg, setMsg] = useState(null);
  const tt = useRef(null);
  const toast = useCallback(t => { setMsg(t); clearTimeout(tt.current); tt.current = setTimeout(() => setMsg(null), 2200); }, []);
  const NAV = [
    { id: 'main', label: '사진 업로드·공간 분석', icon: 'ph-image' },
    { id: 'canvas', label: '식물 배치 캔버스', icon: 'ph-plant' },
    { id: 'render', label: '렌더링·저장', icon: 'ph-sparkle' },
    { id: 'ipad', label: '아이패드 가로 화면 대응', icon: 'ph-device-tablet' },
  ];
  return (
    <div className="app" data-archetype="map-canvas" style={{ width: '100%' }}>
      <div className="topbar">
        <div className="brand"><i className="ph ph-flower-tulip" />리프룸 스튜디오</div>
        {NAV.map(n => <button key={n.id} className={'navbtn' + (screen === n.id ? ' active' : '')} onClick={() => setScreen(n.id)}><i className={'ph ' + n.icon} />{n.label}</button>)}
        <span className="sep" />
        <button className="pillbtn dark" onClick={() => toast('프로필 메뉴는 데모에서 제공하지 않습니다')}><i className="ph ph-user" />내 공간</button>
      </div>
      {screen === 'main' && <AnalysisScreen toast={toast} goto={setScreen} />}
      {screen === 'canvas' && <CanvasScreen toast={toast} plants={plants} setPlants={setPlants} selId={selId} setSelId={setSelId} history={history} setHistory={setHistory} />}
      {screen === 'render' && <RenderScreen toast={toast} plants={plants} />}
      {screen === 'ipad' && <IpadScreen toast={toast} plants={plants} />}
      {msg && <div className="toast"><i className="ph ph-check-circle" />{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
