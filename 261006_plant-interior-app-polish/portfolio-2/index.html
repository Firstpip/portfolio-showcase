<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜테리어 운영 관리·보안 점검 콘솔 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 240°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#eeeeee;
  --m100:#eeeeee;
  --m200:#eeeeee;
  --m300:#dcdcdd;
  --m400:#bababa;
  --m500:#8f8f90;
  --m600:#606062;
  --m700:#343435;
  --m800:#070709;
  --m900:#060607;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#f5f5f5;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b5b5ba;
  --n6:#8b8b8b;
  --n7:#71717a;
  --n8:#53535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ primary #070709가 거의 무채색(채도 13%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--n0);color:var(--m800);-webkit-font-smoothing:antialiased;font-size:13px}
#root{width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.shell{display:flex;width:100%;height:100vh}
/* 사이드바 */
.sidebar{width:240px;flex:none;background:var(--n1);border-right:1px solid var(--n4);display:flex;flex-direction:column;padding:18px 14px;gap:18px;animation:slideInLeft .4s ease-out both}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--m800);color:var(--n1);display:grid;place-items:center}
.sidebar-brand b{font-size:15px;letter-spacing:-.03em;display:block}
.sidebar-brand span{font-size:11px;color:var(--n7)}
.env{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border:1px solid var(--n4);border-radius:12px;background:var(--n0);font-weight:600;font-size:12.5px;width:100%}
.env:hover{background:var(--n2)}
.env i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s1);margin-right:8px}
.sidebar-section-title{font-size:11px;font-weight:700;color:var(--n6);letter-spacing:.06em;padding:0 10px 6px}
.sidebar-link{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--n8);text-align:left;position:relative;transition:background .15s,color .15s}
.sidebar-link:hover{background:var(--n2);color:var(--m800)}
.sidebar-link.active{background:var(--m800);color:var(--n1)}
.sidebar-link .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--n3);color:var(--n9);border-radius:99px;padding:2px 8px}
.sidebar-link.active .cnt{background:var(--n1);color:var(--m800)}
.sidebar-foot{margin-top:auto;padding:12px;border:1px solid var(--n4);border-radius:14px;font-size:11.5px;color:var(--n8);line-height:1.5;background:var(--n0)}
/* 메인 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.page-header{padding:22px 28px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;animation:fadeIn .4s both}
.page-title{font-size:48px;line-height:1;font-weight:700;letter-spacing:-.04em}
.page-meta{margin-top:8px;color:var(--n7);font-size:12.5px;display:flex;gap:14px;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s1);animation:pulse 1.6s ease-out infinite}
.page-actions{display:flex;gap:8px}
.btn{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--n4);background:var(--n1);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden;transition:background .15s,transform .1s}
.btn:hover{background:var(--n2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--m800);color:var(--n1);border-color:var(--m800)}
.btn.primary:hover{background:var(--m700)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.ripple-dot{position:absolute;border-radius:50%;background:var(--n10);opacity:.15;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
/* 상태 스트립 (큰 KPI 행 대체) */
.stat-row{margin:0 28px;box-shadow:0 1px 3px rgba(7,7,9,.05);display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--n4);border-radius:16px;background:var(--n1);overflow:hidden;animation:slideUp .45s ease-out both}
.stat-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-right:1px solid var(--n3);min-width:0}
.stat-card:last-child{border-right:0}
.stat-label{font-size:11.5px;color:var(--n7);font-weight:600;white-space:nowrap}
.stat-value{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat-delta{font-size:11.5px;font-weight:700;margin-top:2px}
.stat-delta.positive{color:var(--s1-text)}.stat-delta.negative{color:var(--s2-text)}.stat-delta.flat{color:var(--n7)}
.stat-sparkline{width:84px;height:30px;margin-left:auto;flex:none}
/* 탭·툴바 */
.data-section{flex:1;min-height:0;display:flex;flex-direction:column;margin:14px 28px 20px;gap:10px}
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--n4)}
.tab{height:36px;padding:0 14px;font-weight:600;color:var(--n7);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--m800)}
.tab.active{color:var(--m800);border-bottom-color:var(--m800)}
.tab .c{font-size:11px;background:var(--n3);border-radius:99px;padding:1px 7px}
.data-toolbar{display:flex;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--n4);border-radius:99px;background:var(--n1);width:280px;color:var(--n7)}
.search input{border:0;outline:0;background:transparent;font:inherit;flex:1;min-width:0;color:var(--m800)}
.search:focus-within{border-color:var(--m800)}
.filter-chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--n4);background:var(--n1);font-size:12px;font-weight:600}
.filter-chip.on{background:var(--m800);color:var(--n1);border-color:var(--m800)}
.grow{flex:1}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:14px}
.data-table-wrap{border:1px solid var(--n4);border-radius:16px;background:var(--n1);overflow:auto;min-height:0}
.data-table{width:100%;border-collapse:collapse}
.data-table th{position:sticky;top:0;background:var(--n2);text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:0 14px;height:36px;border-bottom:1px solid var(--n4);white-space:nowrap}
.data-table td{height:46px;padding:0 14px;border-bottom:1px solid var(--n3);white-space:nowrap;font-size:13px}
.data-table tr{animation:slideUp .35s ease-out both}
.data-table tbody tr{cursor:pointer;transition:background .12s}
.data-table tbody tr:hover{background:var(--n2)}
.data-table tbody tr.sel{background:var(--n3)}
.data-table td b{font-weight:600}
.data-table td small{display:block;color:var(--n7);font-size:11.5px;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--n3);color:var(--n9)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.bad{background:var(--s2-bg);color:var(--s2-text)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.data-table tfoot td{height:34px;font-size:11.5px;color:var(--n7);background:var(--n0);border-bottom:0;position:sticky;bottom:0}
.hero-art{position:absolute!important;right:300px;top:4px;width:300px;height:104px;pointer-events:none;animation:fadeIn .8s both}
.page-header{position:relative;margin:18px 28px 14px;padding:26px 30px 22px;border-radius:18px;overflow:hidden;background:linear-gradient(170deg,var(--n4) 0%,var(--n2) 45%,var(--n1) 100%);box-shadow:0 1px 3px rgba(7,7,9,.06)}
.page-header::before{content:'';position:absolute;left:-60px;top:-90px;width:380px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--n1) 0%,transparent 70%);opacity:.8}
.page-header>*{position:relative}
.pbar{width:110px;height:6px;border-radius:99px;background:var(--n3);overflow:hidden;display:inline-block;vertical-align:middle}
.pbar b{display:block;height:100%;background:var(--m800);border-radius:99px;transform-origin:left;animation:barGrow .9s ease-out both}
.toggle{width:36px;height:20px;border-radius:99px;background:var(--n4);position:relative;transition:background .2s;display:inline-block}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--n1);transition:transform .2s}
.toggle.on{background:var(--m800)}.toggle.on::after{transform:translateX(16px)}
.thumb{width:34px;height:34px;border-radius:10px;border:1px solid var(--n4);background:var(--n2);display:inline-grid;place-items:center;vertical-align:middle;margin-right:10px}
/* 우측 레일 */
.rail{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{border:1px solid var(--n4);border-radius:16px;background:var(--n1);padding:14px 16px;animation:slideInRight .45s ease-out both}
.card h4{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.rail-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--n3);width:100%;text-align:left}
.rail-item:first-of-type{border-top:0}
.rail-item .rk{width:22px;height:22px;border-radius:50%;background:var(--m800);color:var(--n1);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.rail-item b{font-size:12.5px;display:block}
.rail-item span{font-size:11.5px;color:var(--n7)}
.rail-item:hover b{text-decoration:underline}
.dist{display:flex;gap:14px;align-items:center}
.legend-line{display:flex;flex-direction:column;gap:6px;font-size:12px}
.legend-line i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
/* 슬라이드 상세 / 모달 */
.scrim{position:fixed;inset:0;background:rgba(7,7,9,.28);z-index:40;animation:fadeIn .2s both}
.sheet{position:fixed;right:0;top:0;bottom:0;width:400px;z-index:50;background:var(--n1);border-left:1px solid var(--n4);padding:24px;display:flex;flex-direction:column;gap:14px;animation:slideInRight .3s ease-out both}
.sheet h3{font-size:20px;letter-spacing:-.03em}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--n3);font-size:13px}
.kv span{color:var(--n7)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;z-index:50;background:var(--n1);border-radius:20px;border:1px solid var(--n4);padding:24px;display:flex;flex-direction:column;gap:14px;animation:scaleIn .25s ease-out both}
.modal h3{font-size:19px;letter-spacing:-.03em}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12.5px}
.fld input,.fld select{height:38px;border:1px solid var(--n4);border-radius:12px;padding:0 12px;font:inherit;font-weight:500;background:var(--n0);outline:0;color:var(--m800)}
.fld input:focus,.fld select:focus{border-color:var(--m800);background:var(--n1)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--m800);color:var(--n1);padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:70;animation:slideUp .3s ease-out both}
.timeline{display:flex;flex-direction:column;gap:7px}
.tl-row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;font-size:11.5px;color:var(--n7)}
.tl-track{height:14px;border-radius:99px;background:var(--n2);position:relative}
.tl-track b{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--m700);animation:barGrow .8s ease-out both;transform-origin:left}
.tl-track b.f{background:var(--s2)}
.tl-track b.w{background:var(--n5)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--s1-bg)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ───────── Lucide 아이콘 (UMD 아이콘 데이터를 React SVG로 렌더) ───────── */
const ALIAS = { TriangleAlert: ['TriangleAlert', 'AlertTriangle'], BarChart: ['ChartColumn', 'BarChart3', 'BarChart'] };
function Icon({ n, size = 16, className = '' }) {
  const L = window.lucide || {};
  const set = L.icons || {};
  const node = (ALIAS[n] || [n]).map(k => set[k]).find(Boolean);
  const kids = node ? (node[0] === 'svg' ? node[2] : node) : [];
  return (
    <svg data-lucide={n} className={'lucide ' + className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
      {kids.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
    </svg>
  );
}
function useCountUp(target, ms = 900) {
  const [v, setV] = useState(0);
  useEffect(() => {
    const t0 = Date.now();
    const id = setInterval(() => {
      const p = Math.min(1, (Date.now() - t0) / ms);
      setV(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p >= 1) clearInterval(id);
    }, 30);
    return () => clearInterval(id);
  }, [target]);
  return v;
}
function Btn({ className = 'btn', onClick, children, disabled }) {
  const [dots, setDots] = useState([]);
  const click = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const d = { id: Date.now() + Math.random(), x: e.clientX - r.left - 8, y: e.clientY - r.top - 8 };
    setDots(p => [...p, d]); setTimeout(() => setDots(p => p.filter(q => q.id !== d.id)), 650);
    onClick && onClick(e);
  };
  return <button className={className} onClick={click} disabled={disabled}>{children}{dots.map(d => <span key={d.id} className="ripple-dot" style={{ left: d.x, top: d.y, width: 16, height: 16 }} />)}</button>;
}
function Spark({ pts, tone }) {
  const max = Math.max(...pts), min = Math.min(...pts);
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1)) * 84} ${28 - ((v - min) / (max - min || 1)) * 24}`).join(' ');
  return <svg className="stat-sparkline" viewBox="0 0 84 30"><path d={d + ' L84 30 L0 30 Z'} fill="var(--n3)" opacity=".6" /><path d={d} fill="none" stroke={tone === 'bad' ? 'var(--s2)' : 'var(--m800)'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}
function Stat({ s }) {
  const v = useCountUp(s.value);
  return (
    <div className="stat-card">
      <div style={{ minWidth: 0 }}>
        <div className="stat-label">{s.label}</div>
        <div className="stat-value">{v}{s.unit && <span style={{ fontSize: 14, fontWeight: 600, marginLeft: 3, color: 'var(--n7)' }}>{s.unit}</span>}</div>
        <div className={'stat-delta ' + s.tone}>{s.delta}</div>
      </div>
      <Spark pts={s.spark} tone={s.tone === 'negative' ? 'bad' : ''} />
    </div>
  );
}
const TONE = { ok: 'ok', bad: 'bad', warn: 'warn', n: '' };

/* ───────── 화면 데이터 ───────── */
const SCREENS = {
  main: {
    nav: '보안 점검 현황', icon: 'ShieldCheck', title: '보안 점검 현황', count: 5,
    meta: '테이블별 RLS 정책과 요청 제한, 업로드 검증 항목',
    strip: [
      { label: '점검 항목', value: 24, delta: '이번 주 +3', tone: 'flat', spark: [14, 16, 15, 19, 21, 22, 24] },
      { label: '조치 필요', value: 5, delta: '위험 2 · 주의 3', tone: 'negative', spark: [9, 8, 8, 7, 7, 6, 5] },
      { label: 'RLS 적용 테이블', value: 7, unit: '/ 8', delta: '미적용 1개', tone: 'negative', spark: [4, 5, 5, 6, 6, 7, 7] },
      { label: '요청 제한 규칙', value: 6, delta: '활성 6 · 점검 중 0', tone: 'positive', spark: [2, 3, 3, 4, 5, 6, 6] },
    ],
    primary: '점검 항목 추가', modal: [['항목명', 'text', '예: 업로드 MIME 검증'], ['대상', 'select', ['storage.room_photos', 'public.projects', 'public.renders', 'api/render']], ['위험도', 'select', ['위험', '주의', '낮음']]],
    tabs: [['all', '전체'], ['todo', '조치 필요'], ['doing', '진행 중'], ['done', '완료']],
    cols: ['항목', '대상', '위험도', '조치 상태', '담당', '갱신'],
    rows: [

/* ───────── 도넛 ───────── */
function Donut({ data }) {
  const total = data.reduce((a, d) => a + d[1], 0) || 1;
  let acc = 0; const R = 34, C = 2 * Math.PI * R;
  return (
    <svg width="92" height="92" viewBox="0 0 92 92" style={{ flex: 'none' }}>
      <g transform="rotate(-90 46 46)">
        {data.map((d, i) => { const len = (d[1] / total) * C; const el = <circle key={i} cx="46" cy="46" r={R} fill="none" stroke={d[2]} strokeWidth="12" strokeDasharray={`${len - 2} ${C - len + 2}`} strokeDashoffset={-acc} />; acc += len; return el; })}
      </g>
      <text x="46" y="51" textAnchor="middle" fontSize="16" fontWeight="700" fill="var(--m800)">{total}</text>
    </svg>
  );
}

              <tbody>
                {shown.map((r, i) => (
                  <tr key={r.id} className={open === r.id ? 'sel' : ''} style={{ animationDelay: i * 35 + 'ms' }} onClick={() => setOpen(r.id)}>
                    {id === 'main' && <>
                      <td><b>{r.name}</b><small>{r.id} · {r.sub}</small></td><td>{r.target}</td>
                      <td><span className={'badge ' + TONE[r.risk[1]]}>{r.risk[0]}</span></td>
                      <td><span className={'badge ' + TONE[r.stl[1]]}>{r.stl[0]}</span></td><td>{r.who}</td><td style={{ color: 'var(--n7)' }}>{r.at}</td></>}
                    {id === 'assets' && <>
                      <td><span className="thumb"><Icon n="Leaf" size={16} /></span><b>{r.name}</b><small style={{ marginLeft: 44 }}>{r.id} · {r.sub}</small></td><td>{r.target}</td><td style={{ color: 'var(--n8)' }}>{r.tags}</td>
                      <td><span className={'badge ' + TONE[r.risk[1]]}>{r.risk[0]}</span></td>
                      <td onClick={e => { e.stopPropagation(); flip(r); }}><span className={'toggle' + (r.on ? ' on' : '')} /></td>
                      <td style={{ color: 'var(--n7)' }}>{r.at}</td></>}
                    {id === 'queue' && <>
                      <td><b>{r.name}</b><small>{r.id} · {r.sub}</small></td><td>{r.target}</td>
                      <td><span className="pbar"><b style={{ width: r.pct + '%' }} /></span> <span style={{ color: 'var(--n7)', marginLeft: 6 }}>{r.pct}%</span></td>
                      <td>{r.tries}</td><td><span className={'badge ' + TONE[r.stl[1]]}>{r.stl[0]}</span></td>
                      <td onClick={e => e.stopPropagation()}>{r.st === 'fail' ? <Btn className="btn sm" onClick={() => retry(r)}><Icon n="RefreshCw" size={13} />재시도</Btn> : <span style={{ color: 'var(--n6)' }}>—</span>}</td></>}
                    {id === 'analytics' && <>
                      <td><b>{r.name}</b><small>{r.sub}</small></td><td>{r.target}</td>
                      <td style={{ fontVariantNumeric: 'tabular-nums' }}>{r.cnt.toLocaleString()}</td>
                      <td><span className="pbar"><b style={{ width: r.pct * 2 + '%' }} /></span> <span style={{ color: 'var(--n7)', marginLeft: 6 }}>{r.pct}%</span></td>
                      <td>{r.tries}</td><td><span className={'badge ' + TONE[r.stl[1]]}>{r.stl[0]}</span></td></>}
                  </tr>
                ))}
                {!shown.length && <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--n7)', height: 120 }}>조건에 맞는 항목이 없습니다.</td></tr>}
              </tbody>
              <tfoot>
                <tr><td colSpan="3">표시 중 {shown.length}건 / 전체 {rows.length}건</td><td colSpan="3" style={{ textAlign: 'right' }}>페이지 1 / 1</td></tr>
                <tr><td colSpan="3">정렬 기준 · 위험도 → 갱신 시각</td><td colSpan="3" style={{ textAlign: 'right' }}>마지막 동기화 14:22</td></tr>
                <tr><td colSpan="3">환경 · {id === 'main' ? '점검 대상 3종' : '운영 데이터'}</td><td colSpan="3" style={{ textAlign: 'right' }}>자체 개발 데모</td></tr>
              </tfoot>
            </table>
          </div>
          <aside className="rail">
            <div className="card" style={{ borderRadius: 12 }}>
              <h4>{cfg.rail.title}<span className="badge">{rail.length}건</span></h4>
              {rail.map((r, i) => (
                <button key={r.id} className="rail-item" onClick={() => setOpen(r.id)}>
                  <span className="rk">{i + 1}</span><div style={{ minWidth: 0 }}><b>{r.name}</b><span>{cfg.rail.sub(r)}</span></div>
                </button>
              ))}
              {!rail.length && <span style={{ color: 'var(--n7)' }}>대응할 항목이 없습니다.</span>}
            </div>
            {cfg.timeline && <div className="card" style={{ animationDelay: '.1s', borderRadius: 12 }}>
              <h4>작업 타임라인</h4>
              <div className="timeline">
                {[['R-9021', 6, 52, ''], ['R-9020', 12, 40, ''], ['R-9019', 2, 70, ''], ['R-9012', 30, 24, 'f'], ['R-9018', 56, 20, 'w']].map(([k, l, w, c]) => <div className="tl-row" key={k}><span>{k}</span><div className="tl-track"><b className={c} style={{ left: l + '%', width: w + '%' }} /></div></div>)}
              </div>
            </div>}
            <div className="card" style={{ animationDelay: '.15s', borderRadius: 12 }}>
              <h4>분포</h4>
              <div className="dist"><Donut data={cfg.dist} /><div className="legend-line">{cfg.dist.map(d => <span key={d[0]}><i style={{ background: d[2] }} />{d[0]} {d[1]}</span>)}</div></div>
              {log.length > 0 && <div style={{ marginTop: 10, borderTop: '1px solid var(--n3)', paddingTop: 8, fontSize: 11.5, color: 'var(--n8)' }}>{log.map((l, i) => <div key={i}>조치 이력 · {l}</div>)}</div>}
            </div>
          </aside>
        </div>
      </section>

      {cur && <>
        <div className="scrim" onClick={() => setOpen(null)} />
        <aside className="sheet">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span className="badge">{cur.id}</span>
            <button className="btn sm" onClick={() => setOpen(null)}><Icon n="X" size={14} />닫기</button>
          </div>
          <h3>{cur.name}</h3>
          <p style={{ color: 'var(--n8)', lineHeight: 1.5 }}>{cur.sub}</p>
          <div>
            <div className="kv"><span>대상</span><b>{cur.target}</b></div>
            <div className="kv"><span>상태</span><span className={'badge ' + TONE[(cur.stl || cur.risk)[1]]}>{(cur.stl || cur.risk)[0]}</span></div>
            {cur.who && <div className="kv"><span>담당</span><b>{cur.who}</b></div>}
            {cur.at && <div className="kv"><span>갱신</span><b>{cur.at}</b></div>}
          </div>
          {id === 'main' && <Btn className="btn primary" onClick={() => advance(cur)}><Icon n="Check" />조치 상태 변경</Btn>}
          {id === 'queue' && cur.st === 'fail' && <Btn className="btn primary" onClick={() => { retry(cur); setOpen(null); }}><Icon n="RefreshCw" />같은 설정으로 재시도</Btn>}
          {id === 'assets' && <Btn className="btn primary" onClick={() => flip(cur)}><Icon n="Eye" />노출 상태 전환</Btn>}
          {id === 'analytics' && <Btn className="btn primary" onClick={() => toast('단계별 상세 보기는 확장 범위입니다')}><Icon n="Activity" />단계 상세 보기</Btn>}
        </aside>
      </>}
      {modal && <>
        <div className="scrim" onClick={() => setModal(false)} />
        <form className="modal" onSubmit={submit}>
          <h3>{cfg.primary}</h3>
          {cfg.modal.map(([label, type, opt]) => (
            <label className="fld" key={label}>{label}
              {type === 'select' ? <select name={label}>{opt.map(o => <option key={o}>{o}</option>)}</select> : <input name={label} placeholder={opt} />}
            </label>
          ))}
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" className="btn" onClick={() => setModal(false)}>취소</button>
            <button type="submit" className="btn primary">저장</button>
          </div>
        </form>
      </>}
    </>
  );
}

function App() {
  const [id, setId] = useState('main');
  const [msg, setMsg] = useState(null);
  const [env, setEnv] = useState('Production');
  const tt = useRef(null);
  const toast = useCallback(t => { setMsg(t); clearTimeout(tt.current); tt.current = setTimeout(() => setMsg(null), 2200); }, []);
  return (
    <div className="shell" data-archetype="stripe-multipane" style={{ width: '100%' }}>
      <aside className="sidebar" data-sidebar style={{ width: 240 }}>
        <div className="sidebar-brand"><div className="logo"><Icon n="Leaf" size={18} /></div><div><b>리프룸 운영 콘솔</b><span>구현 데모</span></div></div>
        <button className="env" onClick={() => { setEnv(e => e === 'Production' ? 'Staging' : 'Production'); toast('환경을 전환합니다'); }}><span><i />{env}</span><Icon n="ChevronDown" size={14} /></button>
        <div>
          <div className="sidebar-section-title">운영</div>
          {ORDER.map(k => { const c = SCREENS[k]; return (
            <button key={k} className={'sidebar-link' + (id === k ? ' active' : '')} onClick={() => setId(k)}><Icon n={c.icon} size={17} />{c.nav}</button>
          ); })}
        </div>
        <div>
          <div className="sidebar-section-title">관리</div>
          <button className="sidebar-link" onClick={() => toast('팀 권한 설정은 확장 범위입니다')}><Icon n="Users" size={17} />팀 권한</button>
          <button className="sidebar-link" onClick={() => toast('알림 규칙은 확장 범위입니다')}><Icon n="Bell" size={17} />알림 규칙</button>
          <button className="sidebar-link" onClick={() => toast('환경 설정은 확장 범위입니다')}><Icon n="Settings" size={17} />환경 설정</button>
        </div>
        <div className="sidebar-foot">베타 오픈 이후 확장을 고려한 운영 화면 구현 데모입니다. 자체 개발 프로젝트.</div>
      </aside>
      <main className="main"><Screen key={id} id={id} toast={toast} /></main>
      {msg && <div className="toast"><Icon n="Check" size={15} />{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
