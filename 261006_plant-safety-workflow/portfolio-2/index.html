<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협력업체 작업허가·안전서류 관리 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 213°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#f0f4fb;
  --m100:#e0eaf6;
  --m200:#c1d5ed;
  --m300:#9cbbe2;
  --m400:#729ed6;
  --m500:#4a83cb;
  --m600:#2268bf;
  --m700:#1c559d;
  --m800:#16437a;
  --m900:#0f2f56;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdf9f4;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#71757a;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1f20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n10)}
.num{font-variant-numeric:tabular-nums}
i.ph,i.ph-bold{line-height:1;flex-shrink:0}

@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ringDraw{from{stroke-dashoffset:214}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* shell — sidebar-classic + linear cmdk */
.shell{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:16px 12px;z-index:10}
.sidebar-brand{height:48px;display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:700;font-size:14px;color:var(--n10)}
.mark{width:32px;height:32px;border-radius:12px;background:var(--m600);color:var(--n1);display:flex;align-items:center;justify-content:center;font-size:20px}
.sidebar-brand small{display:block;font-weight:500;font-size:12px;color:var(--n7)}
.sidebar-cmdk-hint{margin:12px 0 16px;height:40px;border-radius:999px;border:1px solid var(--n4);background:var(--n0);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--n7);font-size:12px;width:100%;transition:border-color .15s}
.sidebar-cmdk-hint:hover{border-color:var(--n6)}
.sidebar-cmdk-hint .kbd{margin-left:auto}
.kbd{font-size:12px;font-weight:600;color:var(--n7);background:var(--n2);border-radius:8px;padding:0 8px;height:20px;display:inline-flex;align-items:center}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.navwrap{position:relative}
.sidebar-link{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 16px 0 12px;border-radius:12px;font-weight:600;color:var(--n8);text-align:left;position:relative;transition:background .12s,color .12s}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.active{background:var(--m50);color:var(--m700)}
.sidebar-link.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--m600)}
.sidebar-link i{font-size:18px}
.cnt{position:absolute;right:12px;top:10px;height:20px;min-width:20px;padding:0 6px;border-radius:20px;background:var(--n3);color:var(--n8);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;pointer-events:none}
.cnt.hot{background:var(--s2-bg);color:var(--s2-text)}
.sidebar-section-title{font-size:12px;font-weight:600;color:var(--n7);letter-spacing:.06em;padding:24px 12px 8px}
.sub-link{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px;border-radius:12px;color:var(--n8);font-size:12px;font-weight:500;text-align:left}
.sub-link:hover{background:var(--n2)}
.sub-link i{font-size:14px;color:var(--n6)}
.sidebar-user{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid var(--n3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n8);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.sidebar-user b{display:block;font-size:12px;color:var(--n10)}
.sidebar-user span.s{font-size:12px;color:var(--n7)}
.main-wrap{margin-left:260px;flex:1;min-width:0;width:calc(100% - 260px);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--n3);background:var(--n0);position:sticky;top:0;z-index:5}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n7)}
.breadcrumb .divider{color:var(--n5)}
.breadcrumb b{color:var(--n10);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:12px}
.btn{height:40px;padding:0 20px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--m600);color:var(--n1)}
.btn-primary:hover{background:var(--m700)}
.btn-line{border:2px solid var(--n10);color:var(--n10);background:transparent}
.btn-line:hover{background:var(--n2)}
.btn-dark{background:var(--n9);color:var(--n1)}
.btn-dark:hover{background:var(--n10)}
.btn-ghost{height:32px;padding:0 12px;border-radius:12px;color:var(--n8);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.btn-ghost:hover{background:var(--n2)}
.btn-sm{height:32px;padding:0 16px;font-size:12px}
.btn:disabled{background:var(--n3);color:var(--n6);border-color:var(--n3)}
.content{padding:32px;flex:1}
.screen{animation:rise .35s ease both}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}
.page-head h1{font-size:32px;line-height:1.2;font-weight:700;color:var(--n10);letter-spacing:-.02em}
.page-head p{color:var(--n7);margin-top:8px}
.seg{display:inline-flex;gap:4px;background:var(--n2);padding:4px;border-radius:999px}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-size:12px;font-weight:600;color:var(--n7)}
.seg button.on{background:var(--n1);color:var(--n10);border:1px solid var(--n3)}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8);white-space:nowrap}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.main{background:var(--m50);color:var(--m700)}

/* master-detail */
.md{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
.rail{background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:16px;position:sticky;top:80px;max-height:calc(100vh - 104px);overflow:auto}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:999px;background:var(--n2);padding:0 16px;color:var(--n7);margin-bottom:12px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.fchips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.fchip{height:28px;padding:0 12px;border-radius:999px;background:var(--n2);font-size:12px;font-weight:600;color:var(--n8)}
.fchip.on{background:var(--n9);color:var(--n1)}
.item{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:16px;border:2px solid transparent;transition:background .12s;margin-bottom:4px}
.item:hover{background:var(--n0)}
.item.on{background:var(--m50);border-color:var(--m600)}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:14px;color:var(--n10);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r2{font-size:12px;color:var(--n7);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.detail{background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:32px;animation:slideIn .3s ease both;min-width:0}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dh h2{font-size:20px;line-height:1.4;font-weight:700;color:var(--n10)}
.dh .meta{font-size:12px;color:var(--n7);margin-top:4px}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}
.sumcell{background:var(--n0);border-radius:16px;padding:12px 16px}
.sumcell span{font-size:12px;color:var(--n7);display:block}
.sumcell b{font-size:14px;color:var(--n10);display:block;margin-top:4px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--n3);margin-bottom:16px}
.dtab{height:40px;padding:0 16px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtab.on{color:var(--m700);border-color:var(--m600)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--n7)}
.kv dd{color:var(--n10);min-width:0}
.chg{background:var(--m50);border-radius:8px;padding:0 8px;color:var(--m800);font-weight:600}
.old{color:var(--n6);text-decoration:line-through;margin-right:8px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--n7);text-align:left;padding:8px 12px;border-bottom:1px solid var(--n3)}
td{padding:12px;border-bottom:1px solid var(--n3);font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:0}
.checks{margin-top:24px;background:var(--n0);border-radius:24px;padding:16px 24px}
.checks h3,.cardh{font-size:14px;font-weight:700;color:var(--n10);margin-bottom:8px}
.cb{display:flex;align-items:center;gap:12px;width:100%;min-height:36px;text-align:left;color:var(--n9)}
.cb .box{width:20px;height:20px;border-radius:8px;border:2px solid var(--n5);display:flex;align-items:center;justify-content:center;color:var(--n1);font-size:12px;flex-shrink:0;transition:background .12s}
.cb.on .box{background:var(--m600);border-color:var(--m600)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.inline-form{margin-top:16px;background:var(--m50);border-radius:24px;padding:16px 24px;animation:pop .25s ease both}
.field{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.input{height:40px;border:1px solid var(--n4);border-radius:16px;padding:0 16px;background:var(--n1);width:100%}
textarea.input{height:80px;padding:12px 16px;resize:none}
select.input{appearance:none;cursor:pointer}
.err{font-size:12px;color:var(--s2-text)}
.tl{display:flex;flex-direction:column}
.tl .e{display:flex;gap:16px;padding-bottom:16px;position:relative}
.tl .e::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--n3)}
.tl .e:last-child::before{display:none}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--n5);margin-top:4px;flex-shrink:0;z-index:1}
.tl .d.m{background:var(--m600)}
.tl b{display:block;font-size:14px;color:var(--n10)}
.tl span{font-size:12px;color:var(--n7)}

/* safety-log */
.three{display:grid;grid-template-columns:300px 1fr 320px;gap:24px;align-items:start}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:24px;min-width:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.formgrid .field.full{grid-column:1/-1}
.sigbtn{height:40px;border-radius:16px;border:2px dashed var(--n5);color:var(--n7);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;width:100%}
.sigbtn.on{border:2px solid var(--m600);background:var(--m50);color:var(--m700)}
.qc-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14px}
.qc-row i{font-size:18px;margin-top:2px}
.qc-row.ok i{color:var(--s1)}
.qc-row.miss i{color:var(--n6)}
.qc-row.fail i{color:var(--s2)}
.qc-row .why{font-size:12px;color:var(--n7);display:block}
.banner{border-radius:16px;padding:12px 16px;font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:16px;animation:pop .25s ease both;background:var(--n2);color:var(--n8)}
.banner.ok{background:var(--s1-bg);color:var(--s1-text)}
.banner.bad{background:var(--s2-bg);color:var(--s2-text)}
pre{background:var(--n9);color:var(--n1);border-radius:16px;padding:16px;font-size:12px;line-height:1.6;overflow:auto;margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* export */
.two{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{height:32px;padding:0 16px;border-radius:999px;background:var(--n2);font-size:12px;font-weight:600;color:var(--n8);display:inline-flex;align-items:center;gap:4px}
.opt button.on{background:var(--m50);color:var(--m700);box-shadow:inset 0 0 0 2px var(--m600)}
.job{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--n3)}
.job:last-child{border-bottom:0}
.job .ic{width:40px;height:40px;border-radius:16px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.job .t{flex:1;min-width:0}
.job .t b{display:block;font-size:14px;color:var(--n10)}
.job .t span{font-size:12px;color:var(--n7)}
.pbar{height:6px;border-radius:6px;background:var(--n3);margin-top:8px;overflow:hidden}
.pbar div{height:100%;border-radius:6px;background:var(--m600);transition:width .4s ease}
.pbar div.run{background:linear-gradient(90deg,var(--m500),var(--m300),var(--m500));background-size:200px 100%;animation:shimmer 1.2s linear infinite}
.logrow{cursor:pointer;transition:background .12s}
.logrow:hover{background:var(--n0)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px}
.diff div{background:var(--n0);border-radius:12px;padding:12px 16px}
.diff b{display:block;color:var(--n7);margin-bottom:4px}

/* emergency */
.pinned{border:2px solid var(--s2)!important;background:var(--s2-bg)!important;animation:pop .35s ease both}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--s2);display:inline-block;animation:blink 1.4s infinite}
.notice{border-bottom:1px solid var(--n3);padding:12px 0;width:100%;text-align:left;display:block}
.notice:last-child{border-bottom:0}
.notice .h{display:flex;justify-content:space-between;gap:16px;align-items:center}
.notice b{font-size:14px;color:var(--n10)}
.notice p{font-size:14px;color:var(--n8);margin-top:8px;animation:rise .25s ease both}

/* cmd-k, modal, toast */
.cmdk-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;animation:fadeIn .15s ease both}
.cmdk-modal{width:560px;max-width:calc(100% - 32px);background:var(--n1);border-radius:24px;overflow:hidden;animation:pop .2s ease both;border:1px solid var(--n3)}
.cmdk-input{width:100%;height:56px;border:0;border-bottom:1px solid var(--n3);padding:0 24px;font-size:14px;outline:none;background:var(--n1)}
.cmdk-results{max-height:320px;overflow:auto;padding:8px}
.cmdk-group-title{font-size:12px;font-weight:600;color:var(--n7);padding:8px 16px}
.cmdk-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border-radius:12px;width:100%;text-align:left}
.cmdk-item:hover,.cmdk-item.sel{background:var(--m50);color:var(--m700)}
.cmdk-item .kbd{margin-left:auto}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fadeIn .15s ease both}
.modal{background:var(--n1);border-radius:32px;border:1px solid var(--n3);width:100%;max-width:520px;max-height:calc(100vh - 48px);overflow:auto;padding:32px;animation:pop .25s ease both}
.modal h3{font-size:20px;font-weight:700;color:var(--n10)}
.toast{position:fixed;left:292px;bottom:32px;z-index:80;background:var(--n10);color:var(--n1);padding:12px 24px;border-radius:999px;font-weight:600;display:flex;align-items:center;gap:8px;animation:pop .25s ease both}

/* ───── 화면 2: 안전일지·점검서류 관리 ───── */
function SafetyLog({ toast }) {
  const [type, setType] = useState('TBM');
  const [vals, setVals] = useState({ 'TBM': FORMS['TBM'].init, '안전교육': FORMS['안전교육'].init, '점검일지': FORMS['점검일지'].init });
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [showDef, setShowDef] = useState(false);
  const [docSel, setDocSel] = useState(0);
  const form = FORMS[type]; const v = vals[type];
  const need = f => f.req === true || (typeof f.req === 'string' && v[f.req] === '이상 있음');
  const filled = f => f.t === 'chk' || f.t === 'att' || f.t === 'sig' ? !!v[f.k] : !!(v[f.k] || '').toString().trim();
  const rules = form.fields.filter(need).map(f => ({ f, ok: filled(f) }));
  const miss = rules.filter(r => !r.ok);
  const set = (k, val) => { setVals(s => ({ ...s, [type]: { ...s[type], [k]: val } })); setRes(null); };
  const run = () => { setBusy(true); setTimeout(() => { setBusy(false); setRes(miss.length ? 'fail' : 'ok'); }, 900); };
  const schema = JSON.stringify({ type, version: 3, fields: form.fields.map(f => ({ key: f.k, label: f.l, required: !!f.req })) }, null, 2);
  return (
    <div className="screen">
      <div className="page-head">
        <div><h1>안전일지·점검서류 관리</h1><p>서류 유형별 필수 항목을 양식 정의로 관리하고, 제출 전에 누락 항목을 자동 검증합니다.</p></div>
        <div className="seg">{Object.keys(FORMS).map(k => <button key={k} className={type === k ? 'on' : ''} onClick={() => { setType(k); setRes(null); setDocSel(0); setShowDef(false); }}>{k}</button>)}</div>
      </div>
      <div className="three">
        <aside className="rail" style={{ position: 'static' }}>
          <div className="cardh" style={{ padding: '4px 8px 8px' }}>{type} 서류</div>
          {DOCS[type].map((d, i) => (
            <button key={d[0]} className={'item' + (docSel === i ? ' on' : '')} onClick={() => { setDocSel(i); toast(d[0] + ' 서류를 불러옵니다'); }}>
              <div className="r1"><b>{d[0]}</b><span className={d[1] === '제출' ? 'pill ok' : 'pill'}>{d[1]}</span></div>
              <div className="r2"><span>버전 {i === 0 ? 3 : 2}</span><span className="num">10.0{8 - i}</span></div>
            </button>
          ))}
        </aside>
        <section className="card" key={type} style={{ animation: 'slideIn .3s ease both' }}>
          <div className="dh"><h2 style={{ fontSize: 20, fontWeight: 700, color: 'var(--n10)' }}>{form.title}</h2><button className="btn-ghost" onClick={() => setShowDef(!showDef)}><I n="code" s={14} />{showDef ? '양식 정의 닫기' : '양식 정의 보기'}</button></div>
          {showDef && <pre>{schema}</pre>}
          <div className="formgrid" style={{ marginTop: 8 }}>
            {form.fields.map(f => (
              <div key={f.k} className={'field' + (f.full ? ' full' : '')}>
                <label>{f.l}{need(f) && <span style={{ color: 'var(--s2-text)' }}> *</span>}</label>
                {f.t === 'text' && <input className="input" value={v[f.k] || ''} onChange={e => set(f.k, e.target.value)} aria-invalid={res === 'fail' && need(f) && !filled(f) ? 'true' : 'false'} />}
                {f.t === 'area' && <textarea className="input" value={v[f.k] || ''} onChange={e => set(f.k, e.target.value)} aria-invalid={res === 'fail' && need(f) && !filled(f) ? 'true' : 'false'} />}
                {f.t === 'sel' && <select className="input" value={v[f.k]} onChange={e => set(f.k, e.target.value)}><option>이상 없음</option><option>이상 있음</option></select>}
                {f.t === 'chk' && <button className={'cb' + (v[f.k] ? ' on' : '')} onClick={() => set(f.k, !v[f.k])}><span className="box">{v[f.k] && <I n="check" s={12} />}</span>확인했음</button>}
                {f.t === 'att' && <button className={'sigbtn' + (v[f.k] ? ' on' : '')} onClick={() => set(f.k, !v[f.k])}><I n="paperclip" s={16} />{v[f.k] ? '사진 2장 첨부됨' : '사진 첨부하기'}</button>}
                {f.t === 'sig' && <button className={'sigbtn' + (v[f.k] ? ' on' : '')} onClick={() => set(f.k, !v[f.k])}><I n="pencil-simple" s={16} />{v[f.k] ? '서명 완료' : '서명하기'}</button>}
              </div>
            ))}
          </div>
        </section>
        <aside className="card">
          <div className="cardh">누락 검증 (QC)</div>
          {res === 'ok' && <div className="banner ok"><I n="check-circle" s={18} />필수 항목이 모두 채워졌습니다</div>}
          {res === 'fail' && <div className="banner bad"><I n="warning" s={18} />누락 {miss.length}건 · 제출할 수 없습니다</div>}
          {rules.map(r => (
            <div key={r.f.k} className={'qc-row ' + (r.ok ? 'ok' : res === 'fail' ? 'fail' : 'miss')}>
              <I n={r.ok ? 'check-circle' : res === 'fail' ? 'warning-circle' : 'circle'} s={18} />
              <div>{r.f.l.replace(' (이상 있음 선택 시 필수)', '')}<span className="why">{r.ok ? '입력됨' : '필수 항목이 비어 있습니다'}</span></div>
            </div>
          ))}
          <div className="actions" style={{ flexDirection: 'column' }}>
            <button className="btn btn-line" data-loading={busy ? 'true' : 'false'} onClick={run}><I n="list-checks" s={16} />QC 검증 실행하기</button>
            <button className="btn btn-primary" disabled={res !== 'ok'} onClick={() => toast('서류가 제출되어 새 버전으로 저장됩니다')}>서류 제출하기</button>
          </div>
        </aside>
      </div>
    </div>
  );
}

          </div>
          {e.st !== '완료' && <>
            <div className="field"><label>조치 내용</label><div style={{ display: 'flex', gap: 8 }}><input className="input" placeholder="예: 밸브 차단 후 출입 통제" value={note} onChange={x => setNote(x.target.value)} /><button className="btn btn-dark" onClick={addLog}>조치 기록 남기기</button></div></div>
            <div className="actions"><button className="btn btn-line" onClick={finish}>조치 완료로 종료하기</button></div>
          </>}
        </section>
      </div>
      <section className="card" style={{ marginTop: 24 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div className="seg">{['공지사항', '비상연락망'].map(k => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{k}</button>)}</div>
          {tab === '비상연락망' && <div className="search" style={{ width: 260, margin: 0 }}><I n="magnifying-glass" s={16} /><input placeholder="이름·역할·현장 검색" value={cq} onChange={x => setCq(x.target.value)} /></div>}
        </div>
        {tab === '공지사항' && NOTICES.map((n, i) => (
          <button key={n.t} className="notice" onClick={() => setNOpen(nOpen === i ? -1 : i)}>
            <div className="h"><b>{n.pin && <I n="push-pin" s={14} />} {n.t}</b><span className="sub num" style={{ color: 'var(--n7)', fontSize: 12 }}>{n.d}</span></div>
            {nOpen === i && <p>{n.b}</p>}
          </button>
        ))}
        {tab === '비상연락망' && <table>
          <thead><tr><th>이름</th><th>역할</th><th>담당 현장</th><th>연락처</th><th></th></tr></thead>
          <tbody>{cons.map(c => <tr key={c[0]}><td style={{ fontWeight: 600 }}>{c[0]}</td><td>{c[1]}</td><td>{c[2]}</td><td className="num">{c[3]}</td><td style={{ textAlign: 'right' }}><button className="btn-ghost" onClick={() => toast(c[0] + '에게 연락 요청 알림을 보냅니다')}><I n="phone" s={14} />연락하기</button></td></tr>)}</tbody>
        </table>}
      </section>
      {modal && <Modal onClose={() => setModal(false)}>
        <h3>긴급작업 접수</h3>
        <div className="field"><label>현장</label><select className="input" value={form.site} onChange={x => setForm({ ...form, site: x.target.value })}><option>2공장 보일러동</option><option>플랜트 3구역</option><option>A동 압축기실</option><option>야적장 B</option></select></div>
        <div className="field"><label>긴급 내용</label><textarea className="input" placeholder="무엇이 어디서 발생했는지 적어 주세요" value={form.text} onChange={x => setForm({ ...form, text: x.target.value })} aria-invalid={fErr && !form.text.trim() ? 'true' : 'false'} />{fErr && !form.text.trim() && <span className="err">긴급 내용을 입력해 주세요</span>}</div>
        <div className="actions"><button className="btn btn-line" onClick={() => setModal(false)}>취소</button><button className="btn btn-primary" data-loading={busy ? 'true' : 'false'} onClick={create}>접수하고 담당자에게 알리기</button></div>
      </Modal>}
    </div>
  );
}

/* ───── App ───── */
const NAV = [
  { k: 'main', t: '작업허가 신청·승인', i: 'clipboard-text', c: '3' },
  { k: 'log', t: '안전일지·점검서류 관리', i: 'file-text', c: '5' },
  { k: 'export', t: '문서 내보내기·감사 로그', i: 'export', c: '1' },
  { k: 'emg', t: '긴급작업·공지·비상연락망', i: 'siren', c: '2', hot: true },
];
function App() {
  const [screen, setScreen] = useState('main');
  const [permits, setPermits] = useState(PERMITS0);
  const [cmd, setCmd] = useState(false);
  const [cq, setCq] = useState('');
  const [toastMsg, setToastMsg] = useState(null);
  const tm = useRef(null);
  const toast = msg => { setToastMsg(msg); clearTimeout(tm.current); tm.current = setTimeout(() => setToastMsg(null), 2600); };
  useEffect(() => {
    const h = e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmd(c => !c); } if (e.key === 'Escape') setCmd(false); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, []);
  const go = k => { setScreen(k); setCmd(false); setCq(''); };
  const crumb = { main: ['안전서류', '작업허가'], log: ['안전서류', '안전일지'], export: ['보고', '내보내기'], emg: ['현장 운영', '긴급작업'] }[screen];
  const cmds = [...NAV.map(n => ({ t: n.t + '으로 이동', i: n.i, f: () => go(n.k) })), { t: '긴급작업 접수 화면 열기', i: 'siren', f: () => go('emg') }, { t: '검토 대기 신청만 보기', i: 'list-checks', f: () => go('main') }].filter(c => c.t.includes(cq));
  return (
    <div className="shell" data-archetype="linear-sidebar-cmdk" style={{ width: '100%' }}>
      <aside className="sidebar" data-sidebar style={{ width: 260 }}>
        <div className="sidebar-brand"><span className="mark"><I n="hard-hat" s={20} /></span><div>PlantDesk<small>1공장 · 안전팀</small></div></div>
        <button className="sidebar-cmdk-hint" data-cmdk-trigger onClick={() => setCmd(true)}><I n="magnifying-glass" s={14} />빠른 이동·검색<span className="kbd">⌘K</span></button>
        <nav className="sidebar-nav">
          {NAV.map(n => (
            <div className="navwrap" key={n.k}>
              <button className={'sidebar-link' + (screen === n.k ? ' active' : '')} onClick={() => go(n.k)}><I n={n.i} s={18} />{n.t}</button>
              <span className={'cnt' + (n.hot ? ' hot' : '')}>{n.c}</span>
            </div>
          ))}
        </nav>
        <div className="sidebar-section-title">저장된 보기</div>
        <button className="sub-link" onClick={() => go('main')}><I n="clock-counter-clockwise" s={14} />검토 대기 신청</button>
        <button className="sub-link" onClick={() => go('log')}><I n="warning-circle" s={14} />QC 누락 서류</button>
        <button className="sub-link" onClick={() => go('emg')}><I n="push-pin" s={14} />고정된 공지</button>
        <div className="sidebar-user"><span className="avatar">이</span><div><b>이서연</b><span className="s">안전관리자</span></div></div>
      </aside>
      <div className="main-wrap">
        <header className="topbar" style={{ height: 56 }}>
          <nav className="breadcrumb"><span>PlantDesk</span><span className="divider">/</span><span>{crumb[0]}</span><span className="divider">/</span><b>{crumb[1]}</b></nav>
          <div className="topbar-actions"><button className="btn-ghost" onClick={() => toast('알림 3건을 확인합니다')}><I n="bell" s={16} />알림</button><button className="btn-ghost btn-cmdk" onClick={() => setCmd(true)}><I n="command" s={14} />K</button></div>
        </header>
        <main className="content">
          {screen === 'main' && <Permits toast={toast} permits={permits} setPermits={setPermits} />}
          {screen === 'log' && <SafetyLog toast={toast} />}
          {screen === 'export' && <Export toast={toast} />}
          {screen === 'emg' && <Emergency toast={toast} />}
          <div style={{ textAlign: 'center', color: 'var(--n7)', fontSize: 12, marginTop: 40 }}>© 2026 샘플 안전서류 플랫폼 — 자체 개발 프로젝트 데모</div>
        </main>
      </div>
      {cmd && <div className="cmdk-overlay" data-cmdk onClick={() => setCmd(false)}>
        <div className="cmdk-modal" onClick={e => e.stopPropagation()}>
          <input className="cmdk-input" autoFocus placeholder="명령 또는 화면 검색…" value={cq} onChange={e => setCq(e.target.value)} />
          <div className="cmdk-results"><div className="cmdk-group-title">바로가기</div>
            {cmds.map((c, i) => <button key={c.t} className={'cmdk-item' + (i === 0 ? ' sel' : '')} onClick={c.f}><I n={c.i} s={16} />{c.t}{i === 0 && <span className="kbd">⏎</span>}</button>)}
            {cmds.length === 0 && <div style={{ padding: 16, color: 'var(--n7)' }}>일치하는 명령이 없습니다</div>}
          </div>
        </div>
      </div>}
      {toastMsg && <div className="toast" role="status"><I n="check-circle" s={16} />{toastMsg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
