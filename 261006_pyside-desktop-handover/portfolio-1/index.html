.stat-card:hover{transform:translateY(-2px)}

  const line=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${line(s.cur)} L${x(11)},${H-B} L${x(0)},${H-B} Z`;
  const ticks=[0,.25,.5,.75,1];
  const onMove=e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*W;
    setHv(Math.max(0,Math.min(11,Math.round((px-L)/((W-L-R)/11)))));
  };
  return (
    <div style={{padding:'0 8px',position:'relative'}} key={k}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}} onMouseMove={onMove} onMouseLeave={()=>setHv(null)}>
        {ticks.map(t=><g key={t}><line x1={L} x2={W-R} y1={y(s.max*t)} y2={y(s.max*t)} stroke="var(--n3)"/><text x={L-8} y={y(s.max*t)+4} textAnchor="end" fontSize="11" fill="var(--n6)">{Math.round(s.max*t)}</text></g>)}
        {Array.from({length:12}).map((_,i)=><text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="11" fill="var(--n6)">{i+1}주</text>)}
        <line x1={L} x2={W-R} y1={y(s.target)} y2={y(s.target)} stroke="var(--n7)" strokeDasharray="4 4"/>
        <text x={W-R} y={y(s.target)-6} textAnchor="end" fontSize="11" fill="var(--n7)">목표 {s.target}{s.unit}</text>
        <path d={area} fill="var(--m100)" opacity=".7" style={{animation:'fadeUp .8s ease both'}}/>
        <path d={line(s.prev)} fill="none" stroke="var(--n5)" strokeWidth="1.5" strokeDasharray="3 3"/>
        <path d={line(s.cur)} fill="none" stroke="var(--m600)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" style={{'--len':1200,strokeDasharray:1200,animation:'drawIn 1.1s ease both'}}/>
        {hv!==null&&<g><line x1={x(hv)} x2={x(hv)} y1={T} y2={H-B} stroke="var(--n5)"/><circle cx={x(hv)} cy={y(s.cur[hv])} r="5" fill="var(--n0)" stroke="var(--m700)" strokeWidth="2"/></g>}
      </svg>
      {hv!==null&&<div style={{position:'absolute',left:`${Math.min(78,(x(hv)/W)*100)}%`,top:8,background:'var(--n10)',color:'var(--n0)',borderRadius:6,padding:'8px 12px',fontSize:12,pointerEvents:'none'}}>
        <b>{hv+1}주차</b><br/>올해 <span className="num">{s.cur[hv]}{s.unit}</span> · 전년 <span className="num">{s.prev[hv]}{s.unit}</span></div>}
    </div>
  );
}

function Donut({sel,setSel}){
  const D=[['A',212,'var(--m800)'],['B',604,'var(--m600)'],['C',336,'var(--m400)'],['D',98,'var(--m200)'],['E',34,'var(--s2)']];
  const tot=1284,R=52,C=2*Math.PI*R;let off=0;
  return (
    <div style={{display:'flex',gap:16,alignItems:'center'}}>
      <svg width="132" height="132" viewBox="0 0 132 132" style={{flexShrink:0}}>
        <g transform="rotate(-90 66 66)">
          {D.map(([g,v,c])=>{const len=v/tot*C;const el=<circle key={g} cx="66" cy="66" r={R} fill="none" stroke={c} strokeWidth={sel===g?20:16} strokeDasharray={`${len-1.5} ${C-len+1.5}`} strokeDashoffset={-off} style={{transition:'stroke-width .15s',cursor:'pointer'}} onClick={()=>setSel(sel===g?null:g)}/>;off+=len;return el;})}
        </g>
        <text x="66" y="62" textAnchor="middle" fontSize="20" fontWeight="700" fill="var(--n10)">{sel?D.find(d=>d[0]===sel)[1]:fmt(tot)}</text>
        <text x="66" y="80" textAnchor="middle" fontSize="12" fill="var(--n7)">{sel?`${sel}등급`:'평가 완료'}</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:4,flex:1}}>
        {D.map(([g,v,c])=><button key={g} onClick={()=>setSel(sel===g?null:g)} style={{display:'flex',alignItems:'center',gap:8,padding:'2px 4px',borderRadius:4,background:sel===g?'var(--m50)':'transparent'}}>
          <i style={{width:8,height:8,borderRadius:2,background:c,display:'inline-block'}}/><span style={{width:16,fontWeight:600}}>{g}</span><span className="num cap" style={{marginLeft:'auto'}}>{v}건</span></button>)}
      </div>
    </div>
  );
}

            <div><span className="mono">{f.no}</span><div className="h-sub" style={{margin:'4px 0 8px'}}>{f.name}</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}><span className="pill">{f.kind}</span><span className="pill">{f.grp}</span><span className="pill main">최근 {all[0].y}년 {all[0].t} · {all[0].grade}등급</span></div></div>
            <svg viewBox={`0 0 ${W} ${H}`} width="100%"><line x1="12" x2={W-12} y1={py(80)} y2={py(80)} stroke="var(--n3)" strokeDasharray="3 3"/><text x={W-12} y={py(80)-4} textAnchor="end" fontSize="10" fill="var(--n6)">B등급 기준 80점</text>
              <polyline fill="none" stroke="var(--m600)" strokeWidth="2.5" strokeLinejoin="round" points={sc.map((v,i)=>`${px(i)},${py(v)}`).join(' ')} style={{strokeDasharray:600,'--len':600,animation:'drawIn 1s ease both'}}/>
              {sc.map((v,i)=><circle key={i} cx={px(i)} cy={py(v)} r="3.5" fill="var(--n0)" stroke="var(--m700)" strokeWidth="2"/>)}</svg></div></div>
          <div className="card" style={{overflow:'hidden'}}>
            <div className="tabbar"><div className="tab-bar">{['전체','점검','진단'].map(t=><button key={t} className={'tab'+(kind===t?' active':'')} onClick={()=>setKind(t)}>{t}</button>)}</div></div>
            <table><thead><tr><th>연도·차수</th><th>구분</th><th>평가자</th><th className="num">점수</th><th>등급</th><th>결과</th></tr></thead><tbody>
              {rows.map((r,i)=>[
                <tr key={i} className={'rowlink'+(open===i?' sel':'')} onClick={()=>setOpen(open===i?null:i)}>
                  <td style={{fontWeight:600}}>{r.y}년 {r.t}</td><td>{r.kind}</td><td>{r.ev}</td><td className="num">{r.score.toFixed(1)}</td><td><span className={'grade'+(r.grade==='E'?' low':'')}>{r.grade}</span></td><td>{r.res}</td></tr>,
                open===i&&<tr key={i+'d'}><td colSpan="6" style={{background:'var(--n1)'}}><div style={{display:'flex',gap:24,fontSize:13}}>
                  <span><span className="cap">평가 의견</span><br/>균열 폭 0.3mm 이하로 관리 기준 이내이며 다음 차수에 동일 지점을 재측정합니다.</span>
                  <span><span className="cap">시정조치 기한</span><br/>{r.grade>='D'?'등록일 +60일':'해당 없음'}</span></div></td></tr>])}
              {!rows.length&&<tr><td colSpan="6"><div className="empty">해당 구분의 평가 이력이 아직 없습니다.</div></td></tr>}
            </tbody></table>
          </div>
        </div>
      </div>
    </div>
  );
}

const OPT=[['사실관계조사 완료 건수',412],['결함 판정 시설물 수',468],['시정조치 기한 내 완료 건수',233],['시정조치 대상 건수',260],['평가 마감 준수 건수',1198],['평가 대상 전체 건수',1284]];
function IndicatorScreen({notify}){
  const [list,setList]=useState([
    {id:'BSC-03',name:'평가 마감 준수율',year:2026,cond:'전체 시설물',num:4,den:5,target:92,on:true},
    {id:'BSC-05',name:'시정조치 기한 내 완료율',year:2026,cond:'결함 판정 시설물',num:2,den:3,target:88,on:true},
    {id:'BSC-07',name:'사실관계조사 완료율',year:2026,cond:'결함 판정 시설물',num:0,den:1,target:90,on:true},
    {id:'BSC-09',name:'전 차수 대비 재평가율',year:2025,cond:'전체 시설물',num:4,den:5,target:80,on:false},
  ]);
  const [selId,setSelId]=useState('BSC-07');
  const [modal,setModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const cur=list.find(x=>x.id===selId)||list[0];
  const upd=p=>setList(l=>l.map(x=>x.id===cur.id?{...x,...p}:x));
  const rate=Math.round(OPT[cur.num][1]/OPT[cur.den][1]*1000)/10;
  const save=()=>{setSaving(true);setTimeout(()=>{setSaving(false);notify(`${cur.id} 지표 저장 완료 · 현황 보드에 반영`);},1000);};
  const [nn,setNn]=useState('');
  const add=()=>{if(!nn.trim()){return;}const id='BSC-'+String(10+list.length).padStart(2,'0');setList(l=>[...l,{id,name:nn.trim(),year:2026,cond:'전체 시설물',num:0,den:1,target:80,on:true}]);setSelId(id);setModal(null);setNn('');notify('새 지표 추가 완료');};
  return (
    <div className="screen">
      <div className="page-head"><div><h1>지표 관리</h1><p>경영평가·BSC 지표를 코드 수정 없이 화면에서 정의하고 달성률을 확인합니다.</p></div>
        <div className="page-actions"><button className="btn primary" onClick={()=>setModal('add')}><Ic n="plus"/>새 지표 추가</button></div></div>
      <div className="split" style={{gridTemplateColumns:'minmax(0,1fr) 420px'}}>
        <div className="card" style={{overflow:'hidden'}}><table><thead><tr><th>코드</th><th>지표명</th><th>연도</th><th className="num">목표</th><th className="num">달성률</th><th>반영</th></tr></thead><tbody>
          {list.map(x=>{const r=Math.round(OPT[x.num][1]/OPT[x.den][1]*1000)/10;return <tr key={x.id} className={'rowlink'+(x.id===cur.id?' sel':'')} onClick={()=>setSelId(x.id)}>
            <td className="mono">{x.id}</td><td style={{fontWeight:600}}>{x.name}</td><td className="num">{x.year}</td><td className="num">{x.target}%</td>
            <td className="num"><span className={'pill '+(r>=x.target?'ok':r>=x.target-10?'':'warn')}>{r}%</span></td><td>{x.on?<span className="pill main">반영 중</span>:<span className="pill">미반영</span>}</td></tr>})}
        </tbody></table></div>
        <div className="card" key={cur.id}><div className="card-h"><h3>지표 정의 · {cur.id}</h3><button className="btn sm ghost" style={{marginLeft:'auto'}} onClick={()=>setModal('del')}><Ic n="trash-2" s={12}/>삭제</button></div>
          <div className="card-b" style={{display:'flex',flexDirection:'column',gap:16}}>
            <div className="field"><label>지표명</label><input className="input" value={cur.name} onChange={e=>upd({name:e.target.value})}/></div>
            <div className="grid2"><div className="field"><label>적용 연도</label><select className="input" value={cur.year} onChange={e=>upd({year:+e.target.value})}><option>2026</option><option>2025</option><option>2024</option></select></div>
              <div className="field"><label>대상 조건</label><select className="input" value={cur.cond} onChange={e=>upd({cond:e.target.value})}><option>전체 시설물</option><option>결함 판정 시설물</option><option>D·E등급 시설물</option></select></div></div>
            <div className="field"><label>분자 (산식)</label><select className="input" value={cur.num} onChange={e=>upd({num:+e.target.value})}>{OPT.map((o,i)=><option key={i} value={i}>{o[0]}</option>)}</select></div>
            <div className="field"><label>분모 (산식)</label><select className="input" value={cur.den} onChange={e=>upd({den:+e.target.value})}>{OPT.map((o,i)=><option key={i} value={i}>{o[0]}</option>)}</select></div>
            <div className="field"><label>목표치 {cur.target}%</label><input type="range" min="50" max="100" value={cur.target} onChange={e=>upd({target:+e.target.value})} style={{accentColor:'var(--m700)'}}/></div>
            <div style={{background:'var(--n1)',border:'1px solid var(--n3)',borderRadius:6,padding:16}}>
              <div className="cap">현재 달성률 미리보기</div>
              <div style={{display:'flex',alignItems:'baseline',gap:8}}><span className="h-sub num" style={{fontSize:32}}>{rate}%</span><span className="cap">목표 {cur.target}% · {rate>=cur.target?'달성':`${(cur.target-rate).toFixed(1)}%p 부족`}</span></div>
              <div className="prog" style={{marginTop:8,position:'relative'}}><i style={{width:Math.min(100,rate)+'%'}}/><span style={{position:'absolute',left:cur.target+'%',top:-2,bottom:-2,width:2,background:'var(--n9)'}}/></div></div>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}><input type="checkbox" checked={cur.on} onChange={e=>upd({on:e.target.checked})} style={{accentColor:'var(--m700)'}}/>현황 탭 달성률에 표시</label>
            <button className="btn primary" data-loading={saving?'true':'false'} onClick={save}><Ic n="save"/>지표 저장</button>
          </div></div>
      </div>
      {modal==='add'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-h"><h3>새 지표 추가</h3></div>
        <div className="modal-b"><div className="field"><label>지표명</label><input className="input" autoFocus placeholder="예: 사실관계조사 완료율" value={nn} onChange={e=>setNn(e.target.value)}/></div><span className="cap">산식·목표치는 추가 후 오른쪽 정의 패널에서 설정합니다.</span></div>
        <div className="modal-f"><button className="btn" onClick={()=>setModal(null)}>취소</button><button className="btn primary" onClick={add}>지표 추가하기</button></div></div></div>}
      {modal==='del'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-h"><h3>지표를 삭제하시겠습니까?</h3></div>
        <div className="modal-b"><span>{cur.id} {cur.name} 지표와 과거 달성률 기록이 현황 보드에서 제외됩니다.</span></div>
        <div className="modal-f"><button className="btn" onClick={()=>setModal(null)}>취소</button><button className="btn primary" onClick={()=>{setList(l=>l.filter(x=>x.id!==cur.id));setSelId(list.find(x=>x.id!==cur.id).id);setModal(null);notify('지표 삭제 완료');}}>삭제하기</button></div></div></div>}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('main');
  const [hsel,setHsel]=useState('F-0412');
  const [detail,setDetail]=useState(null);
  const [toast,setToast]=useState(null);
  const [q,setQ]=useState('');
  const tt=useRef();
  const notify=m=>{setToast(m);clearTimeout(tt.current);tt.current=setTimeout(()=>setToast(null),2600);};
  const go=s=>{setScreen(s);window.scrollTo(0,0);};
  const nav=[['main','평가 현황·지표 달성률 보드','layout-dashboard'],['import','평가결과 엑셀 등록·과거 자료 적재','file-spreadsheet'],['history','시설물 평가 이력 조회','history'],['indicators','지표 관리','sliders-horizontal']];
  const doSearch=e=>{if(e.key!=='Enter')return;const f=FAC.find(x=>(x.name+x.no).includes(q.trim()));if(f){setHsel(f.id);go('history');setQ('');}else notify('일치하는 시설물이 없습니다. 번호를 다시 확인해 주십시오');};
  return (
    <div data-archetype="stripe-multipane" style={{display:'flex',width:'100%',minHeight:'100vh'}}>
      <aside className="sidebar">
        <div className="brand"><span className="brand-mark"><Ic n="building-2" s={16}/></span><span>시설평가 관리<small>데모 시설안전센터</small></span></div>
        <div className="nav-label">업무 메뉴</div>
        {nav.map(([id,l,ic])=><button key={id} className={'nav-item'+(screen===id?' active':'')} onClick={()=>go(id)}><Ic n={ic}/>{l}</button>)}
        <div className="side-foot">샘플 데이터 · 자체 개발 프로젝트<br/>동시 접속 3대 시험 환경</div>
      </aside>
      <main className="main-wrap">
        <header className="topbar"><div className="crumb">평가 관리 <Ic n="chevron-right" s={12}/> <b>{nav.find(n=>n[0]===screen)[1]}</b></div>
          <div className="search"><Ic n="search" s={14}/><input placeholder="시설물명·번호로 이력 바로 조회" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={doSearch}/></div>
          <Av name="관리자" size={32}/></header>
        <div className="content">
          {screen==='main'&&<Board go={go} notify={notify} openFac={setDetail}/>}
          {screen==='import'&&<ImportScreen notify={notify} go={go}/>}
          {screen==='history'&&<HistoryScreen sel={hsel} setSel={setHsel} notify={notify}/>}
          {screen==='indicators'&&<IndicatorScreen notify={notify}/>}
        </div>
      </main>
      {detail&&<div className="overlay" onClick={()=>setDetail(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h"><h3>{detail.name}</h3><span className="pill" style={{marginLeft:'auto'}}>{detail.stage}</span></div>
        <div className="modal-b"><div className="grid2"><div><div className="cap">시설물번호</div><span className="mono">{detail.no}</span></div><div><div className="cap">구분 · 담당 조</div>{detail.kind} · {detail.grp}</div>
          <div><div className="cap">평가자</div>{detail.ev}</div><div><div className="cap">마감 예정</div>10월 {detail.due.slice(3)}일</div></div>
          <div className="field"><label>메모</label><textarea className="input" style={{height:72,padding:8}} placeholder="평가 중 확인한 사항을 남겨 주십시오"/></div></div>
        <div className="modal-f"><button className="btn" onClick={()=>setDetail(null)}>닫기</button><button className="btn primary" onClick={()=>{setHsel(detail.id);setDetail(null);go('history');}}>평가 이력 보기</button></div></div></div>}
      {toast&&<div className="toast"><Ic n="check" s={16}/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
