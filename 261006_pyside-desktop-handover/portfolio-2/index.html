<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 354°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */

  --m100:#f2e0e2;
  --m200:#e4c1c5;
  --m300:#d49ca1;
  --m400:#c2727a;
  --m500:#b14a54;
  --m600:#a0222f;
  --m700:#831c27;
  --m800:#66161e;
  --m900:#480f15;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#eef2e3;
  --n1:#fcfcfc;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d5d5;
  --n5:#bab5b5;
  --n6:#989090;
  --n7:#7a7172;
  --n8:#242423;
  --n9:#3a3636;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 354°와 6° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */
/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=elevated theme=light */

</style></head><body><div id="root"></div><script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const P=({n})=><i className={'ph ph-'+n}/>;
const R16={borderRadius:16,boxShadow:"0 0 24px rgba(0,0,0,0.10)"};
const NAMES=['김태윤','서은우','문지호','조아라','강하준','유나연','임도윤','배서아','장민규','노은채','황지안','안시우','홍예린','전우진','구하늘','남도겸','송채원','권나래','마준서','신아영'];
const FN=['한빛대교','샘터 지하차도','푸른들 배수펌프장','새얼터널','가온 육교','누리 옹벽','다온 제방','하늬교','솔바람 육교','온새미 터널','아라 배수문','여울교','마루 지하차도','소담 옹벽','별빛대교','나루 배수펌프장','도담 제방','보람 터널','우리 육교','한솔교'];
const CO=['한결구조','대원안전진단','미래토질','정담안전','새로움기술단','오름구조'];
const RANK=['수석','책임','선임','주임'];
const QUOTA=[3,4,5,4];
const GROUPS=['1조','2조','3조','4조','5조'];
const evName=(g,i)=>NAMES[(g*4+i)%20];
function gen(g,seed){
  return Array.from({length:16},(_,i)=>{
    const ev=i<3?0:i<7?1:i<12?2:3;
    return {id:`g${g}-${i}`,name:FN[(i+g*3)%20],co:CO[(i*5+g+seed)%6],ev:(ev+seed)%4,prev:i%4===0};
  });
}
const loadOf=(cards,ev)=>cards.filter(c=>c.ev===ev).length;
const dupOf=(cards,ev)=>{const m={};cards.filter(c=>c.ev===ev).forEach(c=>m[c.co]=(m[c.co]||0)+1);return Math.max(0,...Object.values(m));};

function Hero({eyebrow,title,desc,sm,right}){
  return <section className="hero"><div><div className="eyebrow">{eyebrow}</div><h1 className={'serif'+(sm?' sm':'')}>{title}</h1><p>{desc}</p></div><div style={{marginLeft:'auto'}}>{right}</div></section>;
}

function Wizard({step,setStep,plan,go,notify,confirmed,setConfirmed}){
  const [gs,setGs]=useState(0);
  const [chk,setChk]=useState(false);
  const [modal,setModal]=useState(false);
  const [busy,setBusy]=useState(false);
  const viol=GROUPS.reduce((a,_,g)=>a+[0,1,2,3].filter(e=>loadOf(plan[g],e)>QUOTA[e]).length,0);
  useEffect(()=>{
    if(step!==1)return;
    setGs(0);const t=[1,2,3,4].map(i=>setTimeout(()=>setGs(i),i*700));return()=>t.forEach(clearTimeout);
  },[step]);
  const steps=['기준 확인','임시안 생성','조정','확정'];
  const gen4=['대상 시설물 2,310건 읽기','조별 분배 기준 5세트 적용','실시업체 분산·직급 기준 검토','임시 분배안 완성'];
  const confirm=()=>{setBusy(true);setTimeout(()=>{setBusy(false);setModal(false);setConfirmed(true);notify('4분기 분배안 확정 완료 · 평가자 20명에게 안내가 전달됩니다');},1200);};
  return (
    <div className="screen">
      <Hero eyebrow="2026년 4분기 · 평가대상 2,310건 · 5개 조" title="이번 분기 평가대상을 조별 기준에 맞춰 나눕니다" desc="분배 기준 확인부터 임시안 생성, 조장 조정, 확정까지 네 단계로 진행합니다."/>
      <div className="body"><div className="wiz">
        <div>
          <div className="stepper">{steps.map((s,i)=><React.Fragment key={s}>
            {i>0&&<span className={'bar'+(i<=step?' done':'')}/>}
            <button className={'step'+(i===step?' cur':i<step?' done':'')} onClick={()=>i<=step&&setStep(i)}><span className="dot">{i<step?<P n="check"/>:i+1}</span>{s}</button></React.Fragment>)}</div>
          <div className="card" key={step} style={{animation:'riseIn .4s ease both'}}>
            {step===0&&<>
              <h3>조별 분배 기준 확인</h3><p className="cap" style={{margin:'4px 0 8px'}}>조(분야)마다 기준이 다르게 설정되어 있습니다.</p>
              {GROUPS.map((g,i)=><div className="row" key={g}><b style={{width:40}}>{g}</b>
                <span style={{display:'flex',gap:8,flexWrap:'wrap',flex:1}}><span className="chip" style={{fontWeight:600,color:"var(--n10)"}}>우선순위 {['전 차수 담당자','실시업체 분산','직급별 수량','지역 근접도','실시업체 분산'][i]}</span><span className="chip">업체 분산 ≤{[2,2,3,2,3][i]}건</span>{i!==3&&<span className="chip">전 차수 담당자 유지</span>}</span>
                <button className="btn sm quiet" onClick={()=>go('criteria')}>기준 수정</button></div>)}
              <div style={{display:'flex',justifyContent:'flex-end',marginTop:24}}><button className="btn primary" onClick={()=>setStep(1)}>임시안 생성하기<P n="arrow-right"/></button></div></>}
            {step===1&&<>
              <h3>임시 분배안 생성 중</h3><div className="gen">{gen4.map((t,i)=><div key={t} style={{opacity:gs>=i?1:.35}}>
                <span style={{color:gs>i?'var(--s1-text)':'var(--n7)'}}>{gs>i?<P n="check-circle"/>:gs===i?<P n="circle-notch"/>:<P n="circle"/>}</span>{t}</div>)}</div>
              <div className="prog"><i key={gs} style={{width:(gs/4*100)+'%',animation:'none'}}/></div>
              <div style={{display:'flex',justifyContent:'flex-end',marginTop:24}}><button className="btn primary" disabled={gs<4} onClick={()=>setStep(2)}>임시안 조정하기<P n="arrow-right"/></button></div></>}
            {step===2&&<>
              <h3>조별 담당 현황</h3><p className="cap" style={{margin:'4px 0 8px'}}>평가자별 배정 건수를 기준 수량과 비교합니다. 조정은 조장이 직접 진행합니다.</p>
              {GROUPS.map((g,gi)=><div className="row" key={g}><b style={{width:40}}>{g}</b>
                <div style={{flex:1,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>{[0,1,2,3].map(e=>{const n=loadOf(plan[gi],e);return <div key={e}><div className="cap">{evName(gi,e)} · {n}/{QUOTA[e]}</div><div className="prog" style={{marginTop:4}}><i style={{width:Math.min(100,n/QUOTA[e]*100)+'%',background:n>QUOTA[e]?'var(--n10)':'var(--m600)'}}/></div></div>})}</div></div>)}
              <div style={{display:'flex',justifyContent:'space-between',marginTop:24}}><button className="btn" onClick={()=>go('draft')}><P n="arrows-left-right"/>상세 조정 열기</button><button className="btn primary" onClick={()=>setStep(3)}>확정 단계로 이동<P n="arrow-right"/></button></div></>}
            {step===3&&<>
              <h3>확정 전 점검</h3>
              {[['대상 시설물 2,310건 전체 배정',true],['조별 기준 5세트 적용',true],[viol?`기준 수량 초과 평가자 ${viol}명`:'기준 수량 초과 평가자 없음',!viol]].map(([t,ok])=><div className="row" key={t}><span style={{color:ok?'var(--s1-text)':'var(--s3-text)'}}><P n={ok?'check-circle':'warning'}/></span>{t}<span className={'chip '+(ok?'ok':'warn')} style={{marginLeft:'auto'}}>{ok?'통과':'확인 필요'}</span></div>)}
              <label className="row" style={{cursor:'pointer'}}><input type="checkbox" checked={chk} onChange={e=>setChk(e.target.checked)} style={{accentColor:'var(--m600)',width:18,height:18}}/>조장 5명이 임시안을 확인했습니다</label>
              <div style={{display:'flex',justifyContent:'flex-end',marginTop:24}}>{confirmed?<span className="chip ok" style={{height:48,padding:'0 24px',fontSize:14}}><P n="seal-check"/>확정 완료</span>:<button className="btn primary" disabled={!chk} onClick={()=>setModal(true)}>분배안 확정하기</button>}</div></>}
          </div>
        </div>
        <aside className="card" style={{...R16,position:"sticky",top:96}}>
          <h3>누적 요약</h3>
          <dl className="sum"><dt>대상 시설물</dt><dd className="serif num">2,310건</dd><dt>조 · 평가자</dt><dd className="serif num">5개 조 · 20명</dd><dt>기준 수량 초과</dt><dd className="serif num">{step>=1?viol:'-'}{step>=1?'명':''}</dd><dt>현재 단계</dt><dd className="sm">{confirmed?'확정 완료':`${step+1}단계 · ${steps[step]}`}</dd></dl>
          <div className="prog" style={{margin:'24px 0 8px'}}><i style={{width:((confirmed?4:step)/4*100)+'%',animation:'none',transition:'width .5s'}}/></div>
          <p className="cap">{['기준을 확인한 뒤 임시안을 생성합니다.','생성이 끝나면 조정 단계로 넘어갑니다.','평가자별 수량이 기준과 맞는지 살핍니다.','조장 확인 후 확정하면 시정조치 기한이 시작됩니다.'][step]}</p>
          {confirmed&&<button className="btn quiet" style={{marginTop:16,width:'100%'}} onClick={()=>go('deadline')}>확정 현황 보기<P n="arrow-right"/></button>}
        </aside>
      </div></div>
      {modal&&<div className="overlay" onClick={()=>setModal(false)}><div className="modal" onClick={e=>e.stopPropagation()}><h3 className="serif">이 분배안으로 확정하시겠습니까?</h3><p>확정 후에는 조장 권한으로만 수정할 수 있으며, 평가자 20명에게 담당 시설물이 전달됩니다.</p>
        <div className="mf"><button className="btn" onClick={()=>setModal(false)}>취소</button><button className="btn primary" data-loading={busy?'true':'false'} onClick={confirm}>확정하기</button></div></div></div>}
    </div>
  );
}

function Criteria({notify}){
  const [g,setG]=useState(0);
  const base=['전 차수 담당자 유지','실시업체 분산','직급별 기준 수량','지역 근접도'];
  const [cr,setCr]=useState(GROUPS.map((_,i)=>({prio:i%2?[base[1],base[0],base[2],base[3]]:[...base],spread:[2,2,3,2,3][i],quota:[...QUOTA],keep:i!==3})));
  const [busy,setBusy]=useState(false);
  const c=cr[g];
  const upd=p=>setCr(l=>l.map((x,i)=>i===g?{...x,...p}:x));
  const mv=(i,d)=>{const a=[...c.prio];const j=i+d;if(j<0||j>3)return;[a[i],a[j]]=[a[j],a[i]];upd({prio:a});};
  const setQ=(i,d)=>upd({quota:c.quota.map((v,k)=>k===i?Math.max(1,Math.min(9,v+d)):v)});
  const total=c.quota.reduce((a,b)=>a+b,0);
  const save=()=>{setBusy(true);setTimeout(()=>{setBusy(false);notify(`${GROUPS[g]} 분배 기준 저장 완료`);},1000);};
  return (
    <div className="screen">
      <Hero sm eyebrow="조(분야)별 개별 설정" title="분배 기준을 조마다 따로 정합니다" desc="우선순위, 실시업체 분산, 직급별 기준 수량, 전 차수 담당자 유지 여부를 설정하면 임시안 생성에 그대로 반영됩니다."
        right={<div className="seg">{GROUPS.map((x,i)=><button key={x} className={g===i?'on':''} onClick={()=>setG(i)}>{x}</button>)}</div>}/>
      <div className="body"><div className="crit" key={g}>
        <div style={{display:'flex',flexDirection:'column',gap:24}}>
          <div className="card"><h3>우선순위</h3><p className="cap" style={{margin:'4px 0 16px'}}>위에 있을수록 먼저 적용합니다.</p>
            {c.prio.map((p,i)=><div className="prio" key={p}><span className="rk">{i+1}</span><b style={{flex:1}}>{p}</b>
              <button className="btn sm ghost" aria-label="위로" onClick={()=>mv(i,-1)}><P n="arrow-up"/></button><button className="btn sm ghost" aria-label="아래로" onClick={()=>mv(i,1)}><P n="arrow-down"/></button></div>)}</div>
          <div className="card"><h3>직급별 기준 수량</h3><p className="cap" style={{margin:'4px 0 8px'}}>평가자 1명이 한 분기에 맡는 건수입니다.</p>
            {RANK.map((r,i)=><div className="row" key={r}><b style={{width:56}}>{r}</b><span className="cap" style={{flex:1}}>{evName(g,i)} 외</span><div className="stepnum"><button aria-label="감소" onClick={()=>setQ(i,-1)}><P n="minus"/></button><span className="num">{c.quota[i]}</span><button aria-label="증가" onClick={()=>setQ(i,1)}><P n="plus"/></button></div></div>)}</div>
          <div className="card"><h3>분산·유지 규칙</h3>
            <div className="row"><span style={{flex:1}}><b>동일 실시업체 최대 배정</b><br/><span className="cap">한 평가자가 같은 실시업체 시설물을 맡는 상한</span></span><div className="stepnum"><button aria-label="감소" onClick={()=>upd({spread:Math.max(1,c.spread-1)})}><P n="minus"/></button><span className="num">{c.spread}건</span><button aria-label="증가" onClick={()=>upd({spread:Math.min(5,c.spread+1)})}><P n="plus"/></button></div></div>
            <div className="row"><span style={{flex:1}}><b>전 차수 담당자 유지</b><br/><span className="cap">직전 차수에 평가한 시설물은 같은 평가자에게 우선 배정</span></span><button role="switch" aria-checked={c.keep} aria-label="전 차수 담당자 유지" className={'sw'+(c.keep?' on':'')} onClick={()=>upd({keep:!c.keep})}/></div></div>
        </div>
        <aside className="card" style={{...R16,position:"sticky",top:96}}><h3>{GROUPS[g]} 예상 결과</h3>
          <dl className="sum"><dt>조 전체 배정 가능 건수</dt><dd className="serif num">{total*5}건</dd><dt>1순위 기준</dt><dd className="sm">{c.prio[0]}</dd><dt>업체 분산 상한</dt><dd className="sm">{c.spread}건 이하</dd></dl>
          <p className="cap" style={{margin:'24px 0'}}>저장하면 4분기 임시안 생성부터 이 기준으로 적용됩니다.</p>
          <button className="btn primary" style={{width:'100%',justifyContent:'center'}} data-loading={busy?'true':'false'} onClick={save}><P n="floppy-disk"/>조별 기준 저장</button></aside>
      </div></div>
    </div>
  );
}

function Draft({plan,setPlan,notify}){
  const [g,setG]=useState(2);
  const [over,setOver]=useState(null);
  const [busy,setBusy]=useState(false);
  const cards=plan[g];
  const move=(id,ev)=>setPlan(p=>({...p,[g]:p[g].map(c=>c.id===id?{...c,ev}:c)}));
  const regen=()=>{setBusy(true);setTimeout(()=>{setPlan(p=>({...p,[g]:gen(g,(Math.random()*3|0)+1)}));setBusy(false);notify(`${GROUPS[g]} 임시 분배안 재생성 완료`);},1200);};
  return (
    <div className="screen">
      <Hero sm eyebrow="임시안 · 조장 조정 화면" title="카드를 끌어 담당 평가자를 바꿉니다" desc="기준 수량을 넘거나 같은 실시업체가 몰리면 해당 평가자 열에 표시됩니다."
        right={<div style={{display:'flex',gap:12,alignItems:'center'}}><div className="seg">{GROUPS.map((x,i)=><button key={x} className={g===i?'on':''} onClick={()=>setG(i)}>{x}</button>)}</div>
          <button className="btn" data-loading={busy?'true':'false'} onClick={regen}><P n="magic-wand"/>임시안 다시 생성</button></div>}/>
      <div className="body"><div className="cols" key={g}>
        {[0,1,2,3].map(e=>{const mine=cards.filter(c=>c.ev===e);const n=mine.length;const d=dupOf(cards,e);
          return <div key={e} className={'col'+(over===e?' over':'')} onDragOver={ev=>{ev.preventDefault();setOver(e);}} onDragLeave={()=>setOver(null)} onDrop={ev=>{ev.preventDefault();move(ev.dataTransfer.getData('text/plain'),e);setOver(null);}}>
            <div className="col-h"><span className="avatar" style={{width:40,height:40}}>{evName(g,e).charAt(0)}</span><span style={{flex:1}}><b>{evName(g,e)}</b><br/><span className="cap">{RANK[e]} · 기준 {QUOTA[e]}건</span></span>
              <span className={'chip '+(n>QUOTA[e]?'dark':'')}>{n}건</span></div>
            {(n>QUOTA[e]||d>2)&&<div className="chip warn" style={{marginBottom:12,height:'auto',padding:'4px 12px'}}><P n="warning"/>{n>QUOTA[e]?`기준 초과 +${n-QUOTA[e]}`:`동일 업체 ${d}건 집중`}</div>}
            {mine.map(c=><div key={c.id} className="fcard" draggable onDragStart={ev=>ev.dataTransfer.setData('text/plain',c.id)}>
              <div style={{display:'flex',alignItems:'center',gap:8}}><b style={{flex:1}}>{c.name}</b><span style={{color:'var(--n6)'}}><P n="dots-six-vertical"/></span></div>
              <span className="cap">{c.co}</span>{c.prev&&<span className="chip main" style={{marginLeft:8,height:20}}>전 차수 담당</span>}
              <select aria-label="담당 변경" value={c.ev} onChange={ev=>move(c.id,+ev.target.value)}>{[0,1,2,3].map(x=><option key={x} value={x}>{evName(g,x)} {RANK[x]}</option>)}</select></div>)}
            {!n&&<div className="empty">배정된 시설물이 아직 없어요.<br/>다른 열에서 카드를 끌어 놓습니다.</div>}
          </div>})}
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:32}}>
        <button className="btn" onClick={()=>notify('임시 저장 완료')}>임시 저장</button><button className="btn primary" onClick={()=>notify(`${GROUPS[g]} 조장 확인 요청 전송 완료`)}><P n="paper-plane-tilt"/>조장 확인 요청</button></div></div>
    </div>
  );
}

const DL0=[
 {id:1,fac:'샘터 지하차도',ev:'서은우',item:'배수구 퇴적물 제거',d:3,st:'진행'},{id:2,fac:'누리 옹벽',ev:'문지호',item:'상단부 균열 보수',d:-2,st:'지연'},
 {id:3,fac:'한빛대교',ev:'김태윤',item:'받침부 도장 보수',d:9,st:'진행'},{id:4,fac:'새얼터널',ev:'조아라',item:'조명 설비 교체',d:3,st:'진행'},
 {id:5,fac:'다온 제방',ev:'강하준',item:'제방 사면 보강',d:15,st:'진행'},{id:6,fac:'푸른들 배수펌프장',ev:'유나연',item:'펌프 점검 기록 정비',d:-6,st:'완료'},
 {id:7,fac:'하늬교',ev:'임도윤',item:'신축이음 교체',d:9,st:'진행'},{id:8,fac:'가온 육교',ev:'배서아',item:'계단 난간 보수',d:21,st:'진행'},
];
function Deadline({notify,confirmed}){
  const [rows,setRows]=useState(DL0);
  const [day,setDay]=useState(null);
  const [f,setF]=useState('전체');
  const [ext,setExt]=useState(null);
  const [why,setWhy]=useState('');
  const [nd,setNd]=useState(5);
  const dayOf=r=>6+r.d;
  const list=rows.filter(r=>(f==='전체'||r.st===f)&&(day===null||dayOf(r)===day));
  const cells=[...Array(4).fill(null),...Array.from({length:31},(_,i)=>i+1)];
  const pill=r=>r.st==='완료'?<span className="chip ok"><P n="check"/>완료</span>:r.d<0?<span className="chip dark"><P n="clock-countdown"/>{-r.d}일 지연</span>:r.d<=3?<span className="chip warn">D-{r.d}</span>:<span className="chip">D-{r.d}</span>;
  const submit=()=>{if(!why.trim())return;setRows(l=>l.map(r=>r.id===ext.id?{...r,d:r.d+nd,st:'진행'}:r));setExt(null);setWhy('');notify('기한 연장 요청 접수 완료');};
  return (
    <div className="screen">
      <Hero sm eyebrow={confirmed?'4분기 분배안 확정됨':'3분기 확정 분배안 기준'} title="시정조치 기한을 한눈에 살핍니다" desc="확정된 분배안에 따라 시정조치 기한과 진행 상태를 달력과 목록으로 확인합니다."
        right={<div className="seg">{['전체','진행','지연','완료'].map(x=><button key={x} className={f===x?'on':''} onClick={()=>setF(x)}>{x}</button>)}</div>}/>
      <div className="body"><div className="crit" style={{gridTemplateColumns:'360px minmax(0,1fr)'}}>
        <div className="card"><div style={{display:'flex',alignItems:'center',marginBottom:16}}><h3 className="serif" style={{fontSize:22}}>2026년 10월</h3>{day!==null&&<button className="btn sm ghost" style={{marginLeft:'auto'}} onClick={()=>setDay(null)}>날짜 선택 해제</button>}</div>
          <div className="cal">{['일','월','화','수','목','금','토'].map(h=><span className="hd" key={h}>{h}</span>)}
            {cells.map((c,i)=>c===null?<span key={i}/>:<button key={i} className={(day===c?'sel ':'')+(c===6?'today':'')} onClick={()=>setDay(day===c?null:c)}><span className="num">{c}</span>{rows.some(r=>dayOf(r)===c)&&<i className="d"/>}</button>)}</div>
          <p className="cap" style={{marginTop:16}}>점이 있는 날짜는 시정조치 기한이 있는 날입니다.</p></div>
        <div className="card" style={{padding:8,overflow:'hidden'}}>
          <table><thead><tr><th>시설물</th><th>시정조치 내용</th><th>담당 평가자</th><th>기한</th><th/></tr></thead><tbody>
            {list.map(r=><tr key={r.id} className="rl"><td><b>{r.fac}</b></td><td>{r.item}</td><td>{r.ev}</td><td>{pill(r)}<br/><span className="cap num">10월 {dayOf(r)}일</span></td>
              <td style={{textAlign:'right'}}>{r.st!=='완료'&&<button className="btn sm quiet" onClick={()=>{setExt(r);setNd(5);}}>기한 연장 요청</button>}</td></tr>)}
            {!list.length&&<tr><td colSpan="5"><div className="empty">이 조건에 해당하는 시정조치가 아직 없어요.<br/><button className="btn sm" style={{marginTop:12}} onClick={()=>{setF('전체');setDay(null);}}>전체 목록 보기</button></div></td></tr>}
          </tbody></table></div>
      </div></div>
      {ext&&<div className="overlay" onClick={()=>setExt(null)}><div className="modal" onClick={e=>e.stopPropagation()}><h3 className="serif">기한 연장 요청</h3>
        <div><b>{ext.fac}</b><br/><span className="cap">{ext.item} · 현재 기한 10월 {dayOf(ext)}일</span></div>
        <div className="field"><label>연장 일수</label><div className="stepnum" style={{alignSelf:'flex-start'}}><button aria-label="감소" onClick={()=>setNd(Math.max(1,nd-1))}><P n="minus"/></button><span className="num">{nd}일</span><button aria-label="증가" onClick={()=>setNd(Math.min(30,nd+1))}><P n="plus"/></button></div></div>
        <div className="field"><label>연장 사유</label><textarea className="input" style={{height:96,padding:12}} placeholder="예: 보수 자재 입고 지연으로 5일 연장이 필요합니다" value={why} onChange={e=>setWhy(e.target.value)} aria-invalid={!why.trim()&&nd>0?'false':'false'}/></div>
        <div className="mf"><button className="btn" onClick={()=>setExt(null)}>취소</button><button className="btn primary" disabled={!why.trim()} onClick={submit}>연장 요청 보내기</button></div></div></div>}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('main');
  const [step,setStep]=useState(0);
  const [plan,setPlan]=useState(()=>Object.fromEntries(GROUPS.map((_,g)=>[g,gen(g,0)])));
  const [confirmed,setConfirmed]=useState(false);
  const [toast,setToast]=useState(null);
  const tt=useRef();
  const notify=m=>{setToast(m);clearTimeout(tt.current);tt.current=setTimeout(()=>setToast(null),2800);};
  const go=s=>{setScreen(s);window.scrollTo(0,0);};
  const nav=[['main','분기 분배 마법사'],['criteria','분배 기준 설정'],['draft','임시 분배안 자동 생성·조정'],['deadline','시정조치 기한·확정 현황']];
  return (
    <div style={{width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <header className="topnav">
        <div className="logo"><span className="logo-mark"><P n="buildings"/></span>평가분배 센터</div>
        <nav className="tabs">{nav.map(([id,l])=><button key={id} className={'tnav'+(screen===id?' active':'')} onClick={()=>go(id)}>{l}</button>)}</nav>
        <div className="nav-right"><span className="cap">샘플 데이터 · 자체 개발 프로젝트</span><span className="avatar">조</span></div>
      </header>
      <main style={{flex:1,width:'100%'}}>
        {screen==='main'&&<Wizard step={step} setStep={setStep} plan={plan} go={go} notify={notify} confirmed={confirmed} setConfirmed={setConfirmed}/>}
        {screen==='criteria'&&<Criteria notify={notify}/>}
        {screen==='draft'&&<Draft plan={plan} setPlan={setPlan} notify={notify}/>}
        {screen==='deadline'&&<Deadline notify={notify} confirmed={confirmed}/>}
      </main>
      {toast&&<div className="toast"><P n="check-circle"/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
