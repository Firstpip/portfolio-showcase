:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#efefef;
  --m100:#efefef;
  --m200:#efefef;
  --m300:#dfdfdf;
  --m400:#bebfbf;
  --m500:#979899;
  --m600:#6b6c6e;
  --m700:#414245;
  --m800:#17191c;
  --m900:#131517;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#777b86;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

function Spark({ data, w = 120, h = 36 }) {
  const mx = Math.max(...data), mn = Math.min(...data);
  const pts = data.map((v, i) => [i * (w / (data.length - 1)), h - 4 - ((v - mn) / (mx - mn || 1)) * (h - 8)]);

}

function LineArea({ a, b, labels, w = 640, h = 260 }) {
  const mx = Math.max(...a) * 1.1;
  const X = i => 32 + i * ((w - 48) / (a.length - 1));
  const Y = v => h - 28 - (v / mx) * (h - 52);

  return (
    <svg className="chart" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {[0, 1, 2, 3].map(i => <line key={i} x1="32" x2={w - 16} y1={24 + i * ((h - 52) / 3)} y2={24 + i * ((h - 52) / 3)} stroke="var(--n3)" strokeWidth="1" />)}

          <svg className="chart" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
            {[0, 1, 2, 3].map(i => <line key={i} x1="32" x2={w - 16} y1={24 + i * 64} y2={24 + i * 64} stroke="var(--n3)" />)}
            {data.map((d, i) => { const bh = (d.i / mx) * (h - 56); const on = sel === i; return (
              <g key={d.l} style={{ cursor: 'pointer' }} onClick={() => setSel(on ? null : i)}>
                <rect x={32 + i * bw + bw * 0.18} y={h - 28 - bh} width={bw * 0.64} height={bh} rx="6" fill={on ? 'var(--m800)' : 'var(--n4)'} style={{ transformOrigin: `0 ${h - 28}px`, animation: `growY .8s ${i * 0.04}s ease both` }} />
                <text x={32 + i * bw + bw / 2} y={h - 8} fontSize="11" textAnchor="middle" fill="var(--n6)">{d.l}</text>
              </g>); })}
            <polyline fill="none" stroke="var(--m600)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={data.map((d, i) => `${32 + i * bw + bw / 2},${h - 28 - (d.p / Math.max(...data.map(x => x.p)) * 0.8) * (h - 56)}`).join(' ')} />
          </svg>}
          <div className="legend"><span><i className="b"></i>노출(천 회)</span><span><i></i>참여 추이</span></div>
        </section>
        <section className="tile wide">
          <div className="sub" style={{ marginBottom: 16 }}>집행 금액 비중</div>
          <div style={{ display: 'flex', gap: 24, alignItems: 'center' }}>
            <svg width="152" height="152" viewBox="0 0 152 152">
              {arcs.map((a, i) => <circle key={i} cx="76" cy="76" r={R} fill="none" stroke={a.col} strokeWidth="22" strokeDasharray={`${a.f * C2} ${C2}`} strokeDashoffset={-a.s * C2} transform="rotate(-90 76 76)" />)}
              <text x="76" y="82" textAnchor="middle" fontSize="15" fontWeight="600" fill="var(--n10)">{won(total / 10000).replace('₩', '')}만</text>
            </svg>
            <div className="stack" style={{ flex: 1, gap: 8 }}>{arcs.map((a, i) => <div key={i} className="row2 cap" style={{ color: 'var(--n9)' }}><span><span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: 3, background: a.col, marginRight: 8 }}></span>{a.c.name.slice(0, 11)}</span><b className="num">{(a.f * 100).toFixed(1)}%</b></div>)}</div>
          </div>
        </section>
        <section className="tile wide" style={{ gridColumn: 'span 4' }}>
          <div className="row2" style={{ marginBottom: 16 }}><div className="sub">구간 상세 {sel !== null ? '· ' + data[sel].l : '· 전체'}</div><button className="btn gho sm" onClick={() => toast('상세 표 CSV 저장 완료')}><Icon n="file-csv" /> CSV 저장</button></div>
          {empty ? <div className="empty">표시할 구간이 없습니다.</div> :
          <table><thead><tr><th>캠페인</th><th className="r">노출</th><th className="r">참여</th><th className="r">참여율</th><th className="r">집행 금액</th></tr></thead>

        </section>
      </div>
    </div>
  );
}

          <div className="sub" style={{ marginBottom: 16 }}>광고주 로그인</div>
          <div className="stack">
            <div className="field"><label>이메일</label><input className="inp" value={email} onChange={e => setEmail(e.target.value)} /></div>
            <div className="field"><label>비밀번호</label><input className="inp" type="password" defaultValue="demo-password" /></div>
            <button className="btn pri" data-loading={busy && !logged} onClick={login}><Icon n="lock-key" /> 로그인하기</button>
            {logged && <div className="pill ok" style={{ alignSelf: 'flex-start' }}><Icon n="check-circle" /> 샘플교육미디어 소속 · 캠페인 6건 접근 가능</div>}
          </div>
        </section>
        <section className="tile" style={{ gridColumn: 'span 2' }}>
          <div className="sub" style={{ marginBottom: 16 }}>데이터 격리 구조</div>
          <div className="stack" style={{ gap: 16 }}>{flow.map((f, i) => <div key={i} className={'step' + (i <= step ? ' on' : '')} style={{ cursor: 'pointer' }} onClick={() => setStep(i)}><span className="n">{i + 1}</span><div><b>{f[0]}</b><div className="cap">{f[1]}</div></div></div>)}</div>
        </section>
        <section className="tile art" style={{ gridColumn: 'span 4' }}>
          <div className="row2" style={{ marginBottom: 16 }}><div className="sub">격리 테스트 — 캠페인 ID로 직접 요청</div><div className="chips"><button className="chip" onClick={() => setReq('C-2410')}>내 캠페인 C-2410</button><button className="chip" onClick={() => setReq('C-3307')}>타 광고주 C-3307</button></div></div>
          <div className="split">
            <div className="stack"><div className="field"><label>GET /api/campaigns/:id</label><input className="inp" value={req} onChange={e => setReq(e.target.value)} /></div><button className="btn pri" data-loading={busy} onClick={send}><Icon n="paper-plane-tilt" /> 요청 보내기</button></div>
            <div>{res ? <div><span className={'pill ' + (res.code === 200 ? 'ok' : 'bad')} style={{ marginBottom: 8 }}>HTTP {res.code}</span><div className="code">{res.body}</div></div> : <div className="skel" style={{ height: 120 }}></div>}</div>
          </div>
        </section>
      </div>
      {expired && <div className="modalwrap"><div className="modal"><Icon n="clock-countdown" size={32} /><div className="sub">세션이 만료되었습니다</div><div>보안을 위해 로그아웃되었습니다. 다시 로그인하면 이전 화면으로 돌아옵니다.</div><button className="btn pri" onClick={() => { setExpired(false); toast('재로그인 완료 — 이전 화면 복귀'); }}>다시 로그인하기</button></div></div>}
    </div>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [tick, setTick] = useState(0);
  const [drawer, setDrawer] = useState(null);
  const [msg, setMsg] = useState('');
  useEffect(() => { const t = setInterval(() => setTick(v => v + 1), 3000); return () => clearInterval(t); }, []);
  const toast = m => { setMsg(m); setTimeout(() => setMsg(''), 2200); };
  const openC = (c, mode) => { if (mode === 'export') { toast('현황 리포트 저장 완료'); } else setDrawer(c); };
  return (
    <div className="shell">
      <Nav view={view} setView={v => { setView(v); window.scrollTo(0, 0); }} />
      {view === 'main' && <MainView tick={tick} openC={openC} />}
      {view === 'analytics' && <AnalyticsView toast={toast} />}
      {view === 'settlement' && <SettleView toast={toast} />}
      {view === 'auth' && <AuthView toast={toast} />}
      <div className="foot">© 2026 샘플 광고주 허브 — 자체 개발 프로젝트 (데모 데이터)</div>
      {drawer && <CampaignDrawer c={drawer} onClose={() => setDrawer(null)} toast={toast} />}
      <Toast msg={msg} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<style>@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style>
</body>
</html>
