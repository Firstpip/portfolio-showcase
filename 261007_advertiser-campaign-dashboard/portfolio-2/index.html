<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 246°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#e8e6ff;
  --m100:#d2cdff;
  --m200:#b7aeff;
  --m300:#988cff;
  --m400:#7b6cff;
  --m500:#5e4cff;
  --m600:#4d3ed1;
  --m700:#3c31a3;
  --m800:#2a2273;
  --m900:#2a2273;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f6f8fa;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#a4abb8;
  --n6:#909098;
  --n7:#72717a;
  --n8:#54535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */

button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n1);color:var(--n9);font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px;color:var(--n10)}
.layout{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n0);border-right:1px solid var(--n4);padding:16px 12px;display:flex;flex-direction:column;gap:16px;z-index:10}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:4px 8px;font-weight:600;color:var(--n10);font-size:14px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:6px;background:var(--m500);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:16px}
.env{display:flex;align-items:center;justify-content:space-between;padding:8px;border:1px solid var(--n4);border-radius:8px;font-size:12px;color:var(--n7)}
.sidebar-section-title{font-size:12px;color:var(--n6);padding:8px 8px 4px;font-weight:500}
.sidebar-link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px;border-radius:8px;color:var(--n8);font-size:14px;transition:background .15s,color .15s;line-height:1.35}
.sidebar-link:hover{background:var(--n1)}
.sidebar-link.active{background:var(--n2);color:var(--n10);font-weight:600;box-shadow:inset 3px 0 0 var(--m500)}
.sidebar-link i{font-size:18px;flex-shrink:0}
.side-foot{margin-top:auto;padding:8px;font-size:12px;color:var(--n6);border-top:1px solid var(--n3)}
.main{margin-left:240px;width:calc(100% - 240px);flex:1;min-width:0;min-height:100vh;padding:24px 32px 32px;animation:fadeIn .35s ease both}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:16px;position:relative}
.page-title{font-size:38px;line-height:1.15;letter-spacing:-.025em;font-weight:600;color:var(--n10)}
.page-meta{font-size:12px;color:var(--n7);margin-top:4px;display:flex;gap:12px;align-items:center}
.page-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--m500);color:var(--n0)}
.btn-primary:hover{background:var(--m600)}
.btn-secondary{border:1px solid var(--n4);background:var(--n0);color:var(--n9)}
.btn-secondary:hover{background:var(--n1);border-color:var(--n5)}
.btn-ghost{color:var(--n7);padding:0 8px}
.btn-ghost:hover{background:var(--n2)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--n4);background:var(--n0);border-radius:8px;margin-bottom:16px}
.stat-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-right:1px solid var(--n4);min-height:72px;animation:rise .5s ease both}
.stat-card:last-child{border-right:none}
.stat-label{font-size:12px;color:var(--n7)}
.stat-value{font-size:28px;line-height:1.15;font-weight:600;color:var(--n10);letter-spacing:-.02em}
.stat-delta{font-size:12px;color:var(--n7)}
.stat-delta.neg{color:var(--s2-text)}
.stat-sparkline{flex-shrink:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.panel{background:var(--n0);border:1px solid var(--n4);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n4)}
.panel-h b{font-size:20px;font-weight:600;color:var(--n10);letter-spacing:-.02em}
.panel-b{padding:16px}
.tab-bar{display:flex;gap:16px}
.tab{padding:4px 0 8px;margin-bottom:-9px;font-size:14px;color:var(--n7);border-bottom:2px solid transparent;transition:color .15s}
.tab:hover{color:var(--n10)}
.tab.active{color:var(--n10);border-bottom-color:var(--m500);font-weight:600}
.gantt{padding:8px 16px 16px;position:relative}
.g-axis{display:grid;grid-template-columns:168px 1fr;font-size:12px;color:var(--n6);padding:4px 0}
.g-axis div:last-child{display:flex;justify-content:space-between}
.g-row{display:grid;grid-template-columns:168px 1fr;align-items:center;height:36px;border-top:1px solid var(--n3);cursor:pointer;transition:background .15s}
.g-row:hover{background:var(--n1)}
.g-row .nm{font-size:13px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--n9)}
.g-track{position:relative;height:100%;background-image:linear-gradient(to right,var(--n3) 1px,transparent 1px);background-size:calc(100%/6) 100%}
.g-bar{position:absolute;top:10px;height:16px;border-radius:4px;background:var(--m500);transform-origin:left;animation:barGrow .9s ease both}
.g-bar.mute{background:var(--n5)}
.g-bar.hot{background:var(--m500);box-shadow:inset 0 0 0 2px var(--s2)}
.g-now{position:absolute;top:28px;bottom:16px;width:2px;background:var(--s2);z-index:2}
.g-now::before{content:'지금';position:absolute;top:-18px;left:-12px;font-size:12px;color:var(--s2-text)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--n7);text-align:left;padding:8px 12px;background:var(--n1);border-bottom:1px solid var(--n4)}
td{padding:0 12px;height:44px;border-bottom:1px solid var(--n3);font-size:14px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--n1)}
tbody tr.clickable{cursor:pointer}
th.r,td.r{text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--n2);color:var(--n8);border:1px solid var(--n3)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text);border-color:transparent}
.badge.bad{background:var(--s2-bg);color:var(--s2-text);border-color:transparent}
.badge.warn{background:var(--s3-bg);color:var(--s3-text);border-color:transparent}
.badge.main{background:var(--n2);color:var(--n8)}
.queue{list-style:none}
.queue li{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-bottom:1px solid var(--n3);cursor:pointer;transition:background .15s}
.queue li:hover{background:var(--n1);transform:scale(1.01)}
.queue li.sel{background:var(--n2)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{height:4px;border-radius:2px;background:var(--n3);overflow:hidden}
.meter b{display:block;height:100%;background:var(--n6);transform-origin:left;animation:barGrow .9s ease both}
.queue li.sel .meter b{background:var(--m500)}
.meter.hot b{background:var(--s2)}
.meter.warn b{background:var(--s3)}
.evt{list-style:none;max-height:280px;overflow:hidden}
.evt li{display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid var(--n3);font-size:13px}
.evt li:first-child{animation:slideDown .4s ease both}
.evt time{color:var(--n6);min-width:56px}
.sw{width:36px;height:20px;border-radius:10px;background:var(--n5);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--n0);transition:transform .2s}
.sw.on{background:var(--m500)}
.sw.on::after{transform:translateX(16px)}
.inp{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--n4);background:var(--n0);width:100%}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--n7)}
.err{font-size:12px;color:var(--s2-text)}
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--n10) 32%,transparent);display:flex;justify-content:flex-end;animation:fadeIn .2s ease both}
.slide{width:400px;max-width:100%;height:100%;background:var(--n0);border-left:1px solid var(--n4);padding:24px;display:flex;flex-direction:column;gap:16px;animation:slideLeft .25s ease both}
.modalwrap{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--n10) 32%,transparent);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease both}
.modal{width:420px;background:var(--n0);border:1px solid var(--n4);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:rise .25s ease both}
.toast{position:fixed;right:24px;bottom:24px;z-index:80;background:var(--n10);color:var(--n0);border-radius:8px;padding:8px 16px;font-size:14px;display:flex;align-items:center;gap:8px;animation:rise .25s ease both}
.progress{height:6px;border-radius:3px;background:var(--n3);overflow:hidden}
.progress b{display:block;height:100%;background:var(--m500);transition:width .3s}
.check{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n3);cursor:pointer}
.check:hover{background:var(--n1)}
.cb{width:18px;height:18px;border-radius:4px;border:1px solid var(--n5);display:flex;align-items:center;justify-content:center;color:var(--n0);font-size:14px;flex-shrink:0}
.cb.on{background:var(--m500);border-color:var(--m500)}
.cb.miss{border-color:var(--s2);background:var(--s2-bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pix{position:absolute;right:0;top:-8px;opacity:.9;pointer-events:none}
.mx{display:grid;grid-template-columns:140px repeat(3,1fr);font-size:13px}
.mx>div{padding:8px 12px;border-bottom:1px solid var(--n3)}
.mx .h{background:var(--n1);color:var(--n7);font-size:12px}
.empty{padding:32px;text-align:center;color:var(--n7)}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--n2),var(--n3),var(--n2));background-size:200% 100%;animation:shimmer 1.2s linear infinite;height:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translate(0,8px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes slideLeft{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translate(0,-8px);background:var(--n2)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.liveDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s1);animation:blink 1.4s ease-in-out infinite}
.liveDot.off{background:var(--s2);animation:none}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:760px){.sidebar{position:static;width:100%;flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--n4)}.layout{flex-direction:column}.main{margin-left:0;width:100%;padding:16px}.page-title{font-size:28px}}
</style>
</head>

function I({ n }) { return <i className={'ti ti-' + n}></i>; }
function Spark({ d, w = 72, h = 28, c = "var(--m500)" }) {

        <section className="panel">
          <div className="panel-h"><b>담당자</b><span className="badge">{mem.length}명</span></div>
          <table><thead><tr><th>이름</th><th>역할</th><th>최근 접속</th></tr></thead>
            <tbody>{mem.map(m => <tr key={m.id}><td>{m.n}<div style={{ fontSize: 12, color: 'var(--n7)' }}>{m.m}</div></td><td><select className="inp" style={{ width: 110 }} value={m.r} onChange={e => { setMem(mem.map(x => x.id === m.id ? { ...x, r: e.target.value } : x)); toast(m.n + ' 역할 변경 완료'); }}><option>관리</option><option>내보내기</option><option>조회</option></select></td><td className="num" style={{ fontSize: 13 }}>{m.last}</td></tr>)}</tbody></table>
        </section>
        <section className="panel" style={{ alignSelf: 'start' }}>
          <div className="panel-h"><b>역할별 권한</b></div>
          <div className="mx"><div className="h">기능</div><div className="h">관리</div><div className="h">내보내기</div><div className="h">조회</div>
            <div>현황·정산 조회</div><div>허용</div><div>허용</div><div>허용</div>
            <div>엑셀·증빙 내보내기</div><div>허용</div><div>허용</div><div style={{ color: 'var(--s2-text)' }}>차단</div>
            <div>담당자·규칙 관리</div><div>허용</div><div style={{ color: 'var(--s2-text)' }}>차단</div><div style={{ color: 'var(--s2-text)' }}>차단</div></div>
        </section>
      </div>
      <section className="panel">
        <div className="panel-h"><div className="tab-bar" data-tabs>{['전체', '로그인', '엑셀 내보내기', '권한 변경', '조회'].map(t => <button key={t} className={'tab' + (act === t ? ' active' : '')} onClick={() => setAct(t)}>{t}</button>)}</div><input className="inp" style={{ width: 200 }} placeholder="담당자 이름 검색" value={q} onChange={e => setQ(e.target.value)} /></div>
        <table><thead><tr><th>시각</th><th>담당자</th><th>행위</th><th>대상</th></tr></thead>
          <tbody>{logs.map((a, i) => <tr key={i}><td className="num">{a[0]}</td><td>{a[1]}</td><td><span className="badge">{a[2]}</span></td><td>{a[3]}</td></tr>)}</tbody></table>
        {!logs.length && <div className="empty">조건에 맞는 기록이 없습니다. 행위 탭을 전체로 바꿔 보세요.</div>}
      </section>
      {inv && <div className="modalwrap" onClick={() => setInv(false)}><div className="modal" onClick={e => e.stopPropagation()}>
        <b style={{ fontSize: 20 }}>담당자 초대</b>
        <div className="field"><label>이메일 주소</label><input className="inp" placeholder="name@company.example" value={email} onChange={e => setEmail(e.target.value)} aria-invalid={email.length > 0 && !email.includes('@')} /></div>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}><button className="btn btn-secondary" onClick={() => setInv(false)}>취소하기</button><button className="btn btn-primary" onClick={invite}>초대 메일 보내기</button></div>
      </div></div>}
    </main>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [msg, setMsg] = useState('');
  const toast = m => { setMsg(m); setTimeout(() => setMsg(''), 2200); };
  return (
    <div className="layout">
      <Side view={view} setView={v => { setView(v); window.scrollTo(0, 0); }} />
      {view === 'main' && <MainView toast={toast} />}
      {view === 'alerts' && <AlertsView toast={toast} />}
      {view === 'evidence' && <EvidenceView toast={toast} />}
      {view === 'access' && <AccessView toast={toast} />}
      <Toast msg={msg} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
