<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>AI OCR 문서 검수 및 룰 엔진 플랫폼 — 맞춤 구현 데모</title>

<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 16°, light) ── */
:root{
  --m50:#feece5; --m100:#fcd9cc; --m200:#fbc2ad; --m300:#f9a88a; --m400:#f88f69; --m500:#f67748; --m600:#ca623b; --m700:#9d4c2e; --m800:#6f3620; --m900:#6f3620;
  --n0:#fdf9f4; --n1:#ffffff; --n2:#f0efef; --n3:#e6e5e5; --n4:#d7d6d5; --n5:#bab6b5; --n6:#989290; --n7:#7a7371; --n8:#5a5553; --n9:#3a3736; --n10:#201e1e;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
/* ── 상태 레이어 P1 ── */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:15px;line-height:1.5;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n9)}
i.ph,i.ph-bold{line-height:1;flex:none}

/* 레이아웃 : strip 64 · channel-list 264 · main · info 320 */
.app{display:flex;width:100%;height:100vh}
.workspace-strip{width:64px;flex:none;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px}
.ws-item{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--n5);background:var(--n9);font-weight:700;font-size:14px;position:relative;transition:border-radius .2s,background .2s,color .2s}
.ws-item:hover{border-radius:10px;color:var(--n1)}
.ws-item.active{background:var(--m600);color:var(--n1);border-radius:10px}
.ws-item.active::before{content:"";position:absolute;left:-11px;top:10px;width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--n1)}
.ws-divider{width:26px;height:1px;background:var(--n9);margin:2px 0}
.ws-item i{font-size:20px}
.channel-list{width:264px;flex:none;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;min-height:0}
.channel-header{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.ws-name{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ws-sub{font-size:12px;color:var(--n7);margin-top:2px}
.channel-search{padding:0 14px 10px}
.channel-search label{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--n4);border-radius:999px;background:var(--n0);color:var(--n6)}
.channel-search input{border:0;background:none;width:100%;outline:none!important;box-shadow:none!important}
.channel-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px}
.section-toggle{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;font-size:12px;font-weight:600;color:var(--n7);letter-spacing:.04em;width:100%;text-align:left}
.channel-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:12px;color:var(--n8);font-size:15px;text-align:left;position:relative}
.channel-item i{font-size:18px;color:var(--n6)}
.channel-item:hover{background:var(--n2)}
.channel-item.active{background:var(--m50);color:var(--m700);font-weight:600}
.channel-item.active i{color:var(--m600)}
.channel-item[data-count]::after{content:attr(data-count);margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--n9);color:var(--n1);font-size:11px;font-weight:600;display:grid;place-items:center}
.dm-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;text-align:left;border:1px solid transparent}
.dm-item:hover{background:var(--n2)}
.dm-item.active{background:var(--n0);border-color:var(--m600)}
.dm-main{min-width:0;flex:1}
.dm-name{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-meta{font-size:12px;color:var(--n7);display:block}
.presence{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--n1);box-shadow:0 0 0 1px var(--n5);background:var(--n4)}
.presence.s-ok{background:var(--s1);box-shadow:0 0 0 1px var(--s1)}
.presence.s-check{background:var(--s3);box-shadow:0 0 0 1px var(--s3)}
.presence.s-run{background:var(--m500);box-shadow:0 0 0 1px var(--m500);animation:pulse 1.6s ease-in-out infinite}
.presence.s-bad{background:var(--n10);box-shadow:0 0 0 1px var(--n10)}
.profile{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--n3)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--m100);color:var(--m700);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.n{background:var(--n2);color:var(--n7)}

.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0)}
.conv-header{height:64px;flex:none;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);background:var(--n1)}
.conv-title-row{display:flex;align-items:center;gap:10px;min-width:0}
.conv-title{font-size:22px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.conv-sub{font-size:13px;color:var(--n7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--n7);font-size:18px}
.icon-btn:hover{background:var(--n2)}
.icon-btn.on{background:var(--m50);color:var(--m700)}
.conv-body{flex:1;overflow-y:auto;padding:22px 24px 28px;min-height:0}
.conv-input{flex:none;padding:12px 24px 16px;background:var(--n0);border-top:1px solid var(--n3)}
.conv-input form{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px;border:1px solid var(--n4);border-radius:999px;background:var(--n1)}
.conv-input input{flex:1;border:0;outline:none!important;box-shadow:none!important;background:none;height:34px}
.info-panel{width:320px;flex:none;background:var(--n1);border-left:1px solid var(--n3);overflow-y:auto;transition:width .25s,opacity .2s}
.info-panel[data-open="false"]{width:0;opacity:0;border:0;overflow:hidden}
.info-inner{width:320px;padding:20px}
.info-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.info-header h3{font-size:17px;font-weight:700}
.info-label{font-size:12px;font-weight:600;color:var(--n7);letter-spacing:.04em;margin:18px 0 8px}

/* 공통 컴포넌트 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;border:2px solid var(--n3);background:var(--n1);color:var(--n9);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--n5)}
.btn.primary{background:var(--m600);border-color:var(--m600);color:var(--n1)}
.btn.primary:hover{background:var(--m700);border-color:var(--m700)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--n2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n7);white-space:nowrap}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.check{background:var(--s3-bg);color:var(--s3-text)}
.pill.bad{background:var(--n10);color:var(--n1)}
.pill.sel{background:var(--m50);color:var(--m700)}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:18px 20px}
.card{transition:transform .2s}.card:hover{transform:scale(1.015)}
.card h4{font-size:15px;font-weight:700;margin-bottom:10px}
.field-input{width:100%;height:38px;padding:0 12px;border:1px solid var(--n4);border-radius:12px;background:var(--n1)}
select.field-input{appearance:auto}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--n7);margin:0 0 6px;letter-spacing:.02em}
.hint{font-size:13px;color:var(--n7)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.conf-bar{height:6px;border-radius:999px;background:var(--n3);overflow:hidden;width:64px}
.conf-bar>span{display:block;height:100%;border-radius:999px;background:var(--m500);transform-origin:left;animation:barGrow .8s cubic-bezier(.2,.8,.2,1) both}
.conf-bar.low>span{background:var(--n7)}
.shimmer{background:linear-gradient(90deg,var(--n2) 0,var(--n3) 50%,var(--n2) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes scan{0%{top:0}100%{top:100%}}
@keyframes rise{from{opacity:0;transform:translate(0,8px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}

.headline{font-size:36px;font-weight:500;line-height:1.2;letter-spacing:-.025em;margin:0 0 6px}
.headline em{font-style:normal;color:var(--m700)}
.display-no{font-size:64px;font-weight:500;line-height:1;letter-spacing:-.04em}
/* 원본 대조 */
.compare{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(340px,1fr);gap:20px;align-items:start}
.doc-stage{position:relative;background:var(--n2);border-radius:20px;padding:18px;overflow:hidden}
.doc-stage svg{display:block;width:100%;height:auto;border-radius:6px;background:var(--n1);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.scanline{position:absolute;left:18px;right:18px;top:18px;bottom:18px;pointer-events:none;overflow:hidden;border-radius:6px}
.scanline::after{content:"";position:absolute;left:0;right:0;height:46px;background:linear-gradient(180deg,transparent,var(--m200),transparent);opacity:.45;animation:scan 3.6s ease-in-out infinite alternate}
.ftable{width:100%;border-collapse:separate;border-spacing:0 6px}
.frow{background:var(--n1);cursor:pointer}
.frow td{padding:10px 12px;border-top:1px solid var(--n3);border-bottom:1px solid var(--n3);vertical-align:middle}
.frow td:first-child{border-left:1px solid var(--n3);border-radius:14px 0 0 14px;font-size:13px;color:var(--n7);width:92px}
.frow td:last-child{border-right:1px solid var(--n3);border-radius:0 14px 14px 0;text-align:right}
.frow:hover td{background:var(--n0)}
.frow .pill.ok{background:var(--n2);color:var(--n7)}
.frow.sel td{background:var(--m50);border-color:var(--m400)}
.val-input{width:100%;height:32px;border:1px solid transparent;background:none;border-radius:8px;padding:0 8px;font-weight:600;font-size:14px}
.val-input:hover{border-color:var(--n4)}
.timeline-item{display:flex;gap:10px;padding:8px 0;font-size:13px}
.timeline-item .dot{width:8px;height:8px;border-radius:50%;background:var(--n5);margin-top:7px;flex:none}
.timeline-item .dot.m{background:var(--m500)}
.note-msg{padding:10px 14px;border-radius:14px;background:var(--n0);border:1px solid var(--n3);font-size:13px;margin-bottom:8px}

/* 요청 · 룰 */
.dropzone{border:2px dashed var(--n4);border-radius:20px;padding:30px;text-align:center;background:var(--n1);cursor:pointer;transition:border-color .2s,background .2s}
.dropzone:hover,.dropzone.over{border-color:var(--m500);background:var(--m50)}
.dropzone i{font-size:34px;color:var(--m600)}
.job{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--n3)}
.stage-track{display:flex;gap:4px;margin-top:6px}
.stage-track span{height:5px;flex:1;border-radius:999px;background:var(--n3)}
.stage-track span.done{background:var(--m500)}
.stage-track span.cur{background:var(--m300);animation:pulse 1s ease-in-out infinite}
.rule-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.rule-item{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--n3);background:var(--n1);text-align:left;margin-bottom:8px}
.rule-item:hover{border-color:var(--n5)}
.rule-item.sel{border-color:var(--m600);background:var(--m50)}
.rule-prio{width:26px;height:26px;border-radius:50%;background:var(--n2);color:var(--n7);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.cond{display:grid;grid-template-columns:130px 110px 1fr 36px;gap:8px;margin-bottom:8px}
.ver-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-size:13px;cursor:pointer}
.ver-row:hover{background:var(--n2)}
.ver-row.sel{background:var(--m50);color:var(--m700);font-weight:600}
.trace{position:relative;padding-left:26px}
.trace::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--n3)}
.trace-step{position:relative;padding:8px 0 12px}
.trace-step .tdot{position:absolute;left:-26px;top:9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--n1)}
.tdot.ok{background:var(--s1-bg)!important;color:var(--s1-text)}
.tdot.bad{background:var(--n10)!important;color:var(--n1)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:11px 20px;border-radius:999px;font-size:14px;z-index:60;display:flex;gap:8px;align-items:center;animation:rise .3s ease both}
.overlay{position:fixed;inset:0;background:rgba(32,30,30,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{width:440px;background:var(--n1);border-radius:24px;padding:26px;box-shadow:0 12px 40px rgba(0,0,0,.2);animation:rise .25s ease both}
.modal h3{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
</style>
</head>

];
const VERS = { 'R-01': ['v4 · 2026-09-28 · 한도윤', 'v3 · 2026-09-12 · 오서연', 'v2 · 2026-08-30 · 한도윤', 'v1 · 2026-08-18 · 오서연'] };

/* 룰 평가 */
const num = (s) => Number(String(s).replace(/[^\d.-]/g, '')) || 0;
function evalField(doc, f, confirmed) {
  if (f.k === 'total') {
    const g = doc.fields; const sum = num(g.find(x => x.k === 'supply').ocr) + num(g.find(x => x.k === 'tax').ocr);
    if (sum !== num(f.ocr)) return { st: 'bad', msg: '공급가액 + 세액 = ' + sum.toLocaleString() + ' 원과 다릅니다' };
  }
  if (f.fmt && !f.fmt.test(f.ocr)) return { st: 'bad', msg: '입력 형식이 맞지 않습니다' };
  if (f.ocr !== f.orig) return { st: 'check', msg: '원본 글자와 다를 수 있습니다' };
  if (f.conf < 0.85 && !confirmed[doc.id + f.k]) return { st: 'check', msg: '신뢰도 ' + Math.round(f.conf * 100) + '%로 확인이 필요합니다' };
  return { st: 'ok', msg: '모든 룰을 통과했습니다' };
}
const ST = { ok: ['통과', 'ok', 'check-circle'], check: ['확인 필요', 'check', 'warning'], bad: ['불일치', 'bad', 'x-circle'] };

/* ───────── 원본 문서 SVG ───────── */

  const txt = (k, x, y, size = 15, w = 600) => <text x={x} y={y} fontSize={size} fontWeight={w} fill="var(--n10)">{f(k).orig}</text>;
  return (
    <svg viewBox="0 0 600 780" role="img" aria-label={doc.title + ' 원본 이미지'}>
      <rect width="600" height="780" fill="var(--n1)" />
      <text x="300" y="70" textAnchor="middle" fontSize="28" fontWeight="700" letterSpacing="14" fill="var(--n10)">{doc.title}</text>
      <line x1="60" y1="92" x2="540" y2="92" stroke="var(--n9)" strokeWidth="2" /><line x1="60" y1="97" x2="540" y2="97" stroke="var(--n9)" strokeWidth=".8" />
      <text x="60" y="140" fontSize="11" fill="var(--n7)">거래처</text><text x="370" y="140" fontSize="11" fill="var(--n7)">발행일</text>
      {txt('vendor', 66, 169)}{txt('date', 376, 169)}
      <text x="60" y="203" fontSize="11" fill="var(--n7)" dy="-4">사업자등록번호</text>
      {txt('bizno', 66, 224, 14, 500)}
      <rect x="60" y="262" width="480" height="30" fill="var(--n2)" /><text x="70" y="282" fontSize="12" fill="var(--n8)">품목</text><text x="392" y="282" fontSize="12" fill="var(--n8)">수량</text><text x="470" y="282" fontSize="12" fill="var(--n8)">비고</text>
      {txt('item', 66, 320, 14, 500)}{txt('qty', 386, 320, 14, 500)}
      {[345, 375, 405, 435, 465, 495, 525].map((y, i) => <g key={y}><line x1="60" y1={y} x2="540" y2={y} stroke="var(--n3)" /><rect x="66" y={y - 22} width={90 + (i * 37) % 160} height="7" rx="3" fill="var(--n3)" /></g>)}
      <line x1="60" y1="548" x2="540" y2="548" stroke="var(--n9)" strokeWidth="1.2" />
      <text x="260" y="580" fontSize="12" fill="var(--n7)">공급가액</text>{txt('supply', 346, 580, 15, 500)}
      <text x="260" y="616" fontSize="12" fill="var(--n7)">세 액</text>{txt('tax', 346, 616, 15, 500)}
      <text x="260" y="660" fontSize="13" fontWeight="600" fill="var(--n10)">합계금액</text>{txt('total', 346, 660, 18, 700)}
      <circle cx="120" cy="705" r="30" fill="none" stroke="var(--n5)" strokeWidth="2" /><text x="120" y="710" textAnchor="middle" fontSize="13" fill="var(--n6)">직인</text>
      <text x="540" y="745" textAnchor="end" fontSize="10" fill="var(--n6)">샘플 데이터 · 자체 개발 프로젝트 데모</text>
      {doc.fields.map(fl => {
        const r = res[fl.k]; const on = sel === fl.k; const [x, y, w, h] = fl.box;
        const stroke = on ? 'var(--m600)' : r.st === 'bad' ? 'var(--n10)' : r.st === 'check' ? 'var(--s3)' : 'var(--n4)';
        return <rect key={fl.k} x={x - 6} y={y - 4} width={w + 12} height={h + 8} rx="6" fill={on ? 'var(--m50)' : 'none'} fillOpacity={on ? .55 : 1} stroke={stroke} strokeWidth={on ? 2.5 : r.st === 'ok' ? 1 : 2} strokeDasharray={r.st === 'bad' && !on ? '5 3' : 'none'} style={{ cursor: 'pointer' }} onClick={() => onPick(fl.k)} />;
      })}
    </svg>
  );
}

  const titles = { main: ['원본 대조 검수', doc.id + ' · ' + doc.type + ' · ' + doc.who], request: ['검수 요청 접수', '문서를 올리면 비동기 큐가 순서대로 처리합니다'], rules: ['룰 모델 관리', '조건·동작 구조의 룰을 버전으로 관리합니다'], 'rule-test': ['룰 시험 실행', '검수 데이터에 반영하기 전에 결과를 미리 확인합니다'] };

              <span className={'presence ' + dotCls(d.id)} />

      {toastMsg && <div className="toast"><I n="check-circle" />{toastMsg}</div>}

/* 원본 대조 검수 — master(좌측 대기열) ↔ detail(원본 + 추출값) */

    <div className="rise">

        <div style={{ marginLeft: 'auto' }} className="row">

      <div className="compare">
        <div className="doc-stage" style={{ borderRadius: 24, boxShadow: '0 6px 20px rgba(0,0,0,0.10)' }}>
          <DocSvg doc={doc} sel={sel} onPick={setSel} res={res} />
          <div className="scanline" />
        </div>
        <div>
          <table className="ftable"><tbody>
            {doc.fields.map(f => { const r = res[f.k]; const [lb, cl, ic] = ST[r.st]; return (

                <td style={{ width: 84 }}><div className={'conf-bar' + (f.conf < 0.85 ? ' low' : '')} title={'신뢰도 ' + Math.round(f.conf * 100) + '%'}><span style={{ width: f.conf * 100 + '%' }} /></div><div className="hint num" style={{ fontSize: 11 }}>{Math.round(f.conf * 100)}%</div></td>
                <td><span className={'pill ' + cl}><I n={ic} />{lb}</span></td>
              </tr>); })}
          </tbody></table>
          <div className="card rise" style={{ marginTop: 10, borderRadius: 20, boxShadow: '0 4px 16px rgba(0,0,0,0.10)' }}>
            <div className="row"><h4 style={{ margin: 0 }}>{selF.label}</h4><span className="hint">원본 글자 <b className="num" style={{ color: 'var(--n9)' }}>{selF.orig}</b></span></div>
            <div className="hint" style={{ margin: '6px 0 12px' }}>{res[sel].msg}</div>
            <div className="row">
              <button className="btn sm" disabled={selF.ocr === selF.orig} onClick={() => { editVal(selF.k, selF.orig); commitEdit({ ...selF, ocr: selF.orig }); }}><I n="pencil-simple" />원본 값으로 수정</button>
              <button className="btn sm" disabled={res[sel].st === 'ok'} onClick={() => confirmField(selF)}><I n="check" />확인 처리</button>
              <button className="btn ghost sm" onClick={() => commitEdit(selF)}><I n="floppy-disk" />수정 저장</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* 검수 요청 접수 */
function Request({ toast, docs, setDocs, setDstat }) {
  const [type, setType] = useState('거래명세서');
  const [set, setSet] = useState('기본 룰 세트 (5개)');
  const [files, setFiles] = useState([{ name: '대성정밀_명세서_1002.pdf', size: '1.8MB' }]);
  const [busy, setBusy] = useState(false);
  const [over, setOver] = useState(false);
  const [jobs, setJobs] = useState([{ id: 'J-0318', name: '한울금속_성적서_1001.pdf', type: '검사성적서', stage: 5 }, { id: 'J-0319', name: '세진패키징_납품_1003.png', type: '납품확인서', stage: 3 }]);
  const inp = useRef();
  const OK = ['pdf', 'png', 'jpg', 'jpeg', 'tif'];
  const add = (list) => {
    const bad = [], good = [];
    [...list].forEach(f => { const ext = f.name.split('.').pop().toLowerCase(); if (!OK.includes(ext)) bad.push(f.name + ' — 허용되지 않는 확장자'); else if (f.size > 20 * 1024 * 1024) bad.push(f.name + ' — 20MB 초과'); else good.push({ name: f.name, size: (f.size / 1048576).toFixed(1) + 'MB' }); });
    if (good.length) setFiles(p => [...p, ...good]);
    if (bad.length) toast('거부: ' + bad[0]);
  };
  useEffect(() => { const t = setInterval(() => setJobs(js => js.map(j => j.stage < 5 ? { ...j, stage: j.stage + 1 } : j)), 1700); return () => clearInterval(t); }, []);
  const submit = () => {
    if (!files.length) { toast('업로드할 파일을 먼저 선택해 주세요'); return; }
    setBusy(true);
    setTimeout(() => { setBusy(false); setJobs(js => [...files.map((f, i) => ({ id: 'J-' + (320 + js.length + i), name: f.name, type, stage: 0 })), ...js]); setFiles([]); toast('검수 요청을 큐에 등록했습니다'); }, 1100);
  };
  return (
    <div className="rise" style={{ maxWidth: 880 }}>
      <h1 className="headline" style={{ marginBottom: 16 }}>문서를 올리면 <em>검수</em>가 시작됩니다</h1>
      <div className="dropzone" onClick={() => inp.current.click()} onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)} onDrop={e => { e.preventDefault(); setOver(false); add(e.dataTransfer.files); }}>
        <I n="upload-simple" /><div style={{ fontWeight: 700, fontSize: 17, marginTop: 8 }}>검수할 문서를 끌어놓거나 클릭해 선택합니다</div>
        <div className="hint">PDF · PNG · JPG · TIF, 파일당 20MB 이하</div>
        <input ref={inp} type="file" multiple style={{ display: 'none' }} onChange={e => add(e.target.files)} />
      </div>
      <div className="row" style={{ margin: '10px 0 18px', flexWrap: 'wrap' }}>
        {files.map((f, i) => <span key={i} className="pill sel"><I n="file-pdf" />{f.name} · {f.size}<button title="제거" onClick={() => setFiles(p => p.filter((_, j) => j !== i))} style={{ display: 'grid' }}><I n="x" b style={{ fontSize: 11 }} /></button></span>)}
        <button className="btn ghost sm" onClick={() => add([{ name: '시험_스캔.hwp', size: 1200 }])}><I n="flask" />허용되지 않는 파일 시험</button>
      </div>
      <div className="card" style={{ borderRadius: 20, boxShadow: '0 4px 16px rgba(0,0,0,0.10)', display: 'grid', gridTemplateColumns: '1fr 1fr auto', gap: 14, alignItems: 'end' }}>
        <div><label className="lbl">문서 유형</label><select className="field-input" value={type} onChange={e => setType(e.target.value)}>{['거래명세서', '검사성적서', '납품확인서', '입고검수표'].map(t => <option key={t}>{t}</option>)}</select></div>
        <div><label className="lbl">적용 룰 세트</label><select className="field-input" value={set} onChange={e => setSet(e.target.value)}>{['기본 룰 세트 (5개)', '금액 검증 전용 (2개)', '성적서 전용 (3개)'].map(t => <option key={t}>{t}</option>)}</select></div>
        <button className="btn primary" data-loading={busy ? 'true' : undefined} onClick={submit}><I n="paper-plane-tilt" />검수 요청 접수</button>
      </div>
      <div className="card" style={{ marginTop: 18, borderRadius: 20, boxShadow: '0 4px 16px rgba(0,0,0,0.10)' }}>
        <h4>요청 진행 상태 <span className="hint" style={{ fontWeight: 400 }}>— 새로고침 없이 갱신됩니다</span></h4>
        {jobs.map(j => (
          <div key={j.id} className="job rise">
            <span className="avatar n"><I n={j.stage === 5 ? 'check' : 'spinner-gap'} b /></span>
            <div className="grow"><div className="row"><b style={{ fontSize: 14 }}>{j.name}</b><span className="hint">{j.id} · {j.type}</span></div>
              <div className="stage-track">{STAGES.map((s, i) => <span key={s} className={i < j.stage ? 'done' : i === j.stage ? 'cur' : ''} title={s} />)}</div></div>
            <span className={'pill ' + (j.stage === 5 ? 'ok' : '')}>{STAGES[j.stage]}</span>
          </div>))}
      </div>
    </div>
  );
}

/* 룰 모델 관리 */
function Rules({ rules, setRules, toast }) {
  const [sid, setSid] = useState('R-01');
  const [vsel, setVsel] = useState(0);
  const r = rules.find(x => x.id === sid);
  const upd = (patch) => setRules(rs => rs.map(x => x.id === sid ? { ...x, ...patch } : x));
  const move = (d) => setRules(rs => { const i = rs.findIndex(x => x.id === sid), j = i + d; if (j < 0 || j >= rs.length) return rs; const c = [...rs];[c[i], c[j]] = [c[j], c[i]]; return c.map((x, k) => ({ ...x, prio: k + 1 })); });
  const vers = VERS[sid] || ['v' + r.ver + ' · 2026-09-20 · 오서연', 'v' + Math.max(1, r.ver - 1) + ' · 2026-09-02 · 한도윤'];
  return (
    <div className="rise"><h1 className="headline" style={{ marginBottom: 16 }}>룰을 화면에서 정의하고 <em>버전</em>으로 관리합니다</h1>
    <div className="rule-grid">
      <div>
        <div className="row" style={{ marginBottom: 10 }}><b>룰 {rules.length}개</b><span className="hint">위에서부터 평가</span>
          <button className="btn sm" style={{ marginLeft: 'auto' }} onClick={() => { const id = 'R-0' + (rules.length + 1); setRules(rs => [...rs, { id, name: '새 룰 ' + (rs.length + 1), types: '전체 문서', prio: rs.length + 1, conds: [['품목', '포함', '']], action: '확인 필요 표시', ver: 1 }]); setSid(id); toast('새 룰 초안을 만들었습니다'); }}><I n="plus" b />룰 추가</button></div>
        {rules.map(x => <button key={x.id} className={'rule-item' + (x.id === sid ? ' sel' : '')} onClick={() => { setSid(x.id); setVsel(0); }}><span className="rule-prio">{x.prio}</span><span className="grow"><b style={{ fontSize: 14 }}>{x.name}</b><br /><span className="hint" style={{ fontSize: 12 }}>{x.types}</span></span><span className="pill">v{x.ver}</span></button>)}
      </div>
      <div>
        <div className="card">
          <div className="row" style={{ marginBottom: 14 }}>
            <input className="field-input" style={{ fontWeight: 700, fontSize: 16, maxWidth: 320 }} value={r.name} onChange={e => upd({ name: e.target.value })} />
            <span className="pill sel">우선순위 {r.prio}</span>
            <button className="icon-btn" title="우선순위 올리기" onClick={() => move(-1)}><I n="arrow-up" /></button>
            <button className="icon-btn" title="우선순위 내리기" onClick={() => move(1)}><I n="arrow-down" /></button>
          </div>
          <label className="lbl">조건 (모두 만족할 때 동작 실행)</label>
          {r.conds.map((c, i) => <div key={i} className="cond">
            <select className="field-input" value={c[0]} onChange={e => upd({ conds: r.conds.map((x, j) => j === i ? [e.target.value, x[1], x[2]] : x) })}>{['합계금액', '사업자번호', '발행일', '신뢰도', '수량', '품목', '공급가액'].map(o => <option key={o}>{o}</option>)}</select>
            <select className="field-input" value={c[1]} onChange={e => upd({ conds: r.conds.map((x, j) => j === i ? [x[0], e.target.value, x[2]] : x) })}>{['=', '<', '>', '범위', '정규식', '포함'].map(o => <option key={o}>{o}</option>)}</select>
            <input className="field-input" value={c[2]} onChange={e => upd({ conds: r.conds.map((x, j) => j === i ? [x[0], x[1], e.target.value] : x) })} />
            <button className="icon-btn" title="조건 삭제" onClick={() => r.conds.length > 1 ? upd({ conds: r.conds.filter((_, j) => j !== i) }) : toast('조건은 최소 1개가 필요합니다')}><I n="trash" /></button>
          </div>)}
          <div className="row" style={{ marginTop: 6 }}>
            <button className="btn sm" onClick={() => upd({ conds: [...r.conds, ['신뢰도', '<', '0.85']] })}><I n="plus" b />조건 추가</button>
            <div style={{ marginLeft: 'auto' }} className="row"><label className="lbl" style={{ margin: 0 }}>동작</label>
              <select className="field-input" style={{ width: 160 }} value={r.action} onChange={e => upd({ action: e.target.value })}>{['불일치 표시', '확인 필요 표시', '자동 통과'].map(o => <option key={o}>{o}</option>)}</select></div>
          </div>
        </div>
        <div className="card" style={{ marginTop: 14, borderRadius: 20, boxShadow: '0 4px 16px rgba(0,0,0,0.10)' }}>
          <div className="row" style={{ marginBottom: 8 }}><h4 style={{ margin: 0 }}>버전 이력</h4><span className="hint">저장하면 이전 버전은 변경 없이 보존됩니다</span>
            <button className="btn primary sm" style={{ marginLeft: 'auto' }} onClick={() => { upd({ ver: r.ver + 1 }); toast(r.name + ' v' + (r.ver + 1) + ' 버전을 저장했습니다'); }}><I n="floppy-disk" />새 버전으로 저장</button></div>
          {vers.map((v, i) => <div key={v} className={'ver-row' + (vsel === i ? ' sel' : '')} onClick={() => setVsel(i)}><I n={i === 0 ? 'circle-wavy-check' : 'circle'} /><span className="grow">{v}</span>{i === 0 && <span className="pill ok">현재</span>}{i > 0 && vsel === i && <span className="pill sel">비교 중</span>}</div>)}
          {vsel > 0 && <div className="note-msg" style={{ marginTop: 8 }}><b>현재 버전과의 차이</b><div className="hint" style={{ marginTop: 4 }}>조건 값 1건이 바뀌었고, 동작 항목은 같습니다. 이전 버전으로 시험 실행해 결과를 비교할 수 있습니다.</div></div>}
        </div>
      </div>
    </div></div>
  );
}

/* 룰 시험 실행 */
function RuleTest({ rules, docs, toast }) {
  const [rid, setRid] = useState('R-01');
  const [did, setDid] = useState('D-2417');
  const [run, setRun] = useState(null);
  const [busy, setBusy] = useState(false);
  const [batch, setBatch] = useState(null);
  const rule = rules.find(r => r.id === rid); const d = docs.find(x => x.id === did);
  const trace = (rl, dc) => {
    const g = (k) => dc.fields.find(f => f.k === k);
    if (rl.id === 'R-01') { const s = num(g('supply').ocr) + num(g('tax').ocr); const t = num(g('total').ocr); return [[true, '공급가액 ' + g('supply').ocr + ' 읽기'], [true, '세액 ' + g('tax').ocr + ' 읽기'], [true, '합계 기대값 ' + s.toLocaleString() + ' 계산'], [s === t, '합계금액 ' + g('total').ocr + (s === t ? ' = 기대값 일치' : ' ≠ 기대값 ' + s.toLocaleString())]]; }
    if (rl.id === 'R-02') { const ok = /^\d{3}-\d{2}-\d{5}$/.test(g('bizno').ocr); return [[true, '사업자번호 ' + g('bizno').ocr + ' 읽기'], [ok, ok ? '정규식 형식 일치' : '정규식 형식 불일치']]; }
    if (rl.id === 'R-04') { const mn = Math.min(...dc.fields.map(f => f.conf)); return [[true, '필드 ' + dc.fields.length + '개의 신뢰도 읽기'], [mn >= 0.85, '최저 신뢰도 ' + Math.round(mn * 100) + '% ' + (mn >= 0.85 ? '— 하한 이상' : '— 하한 0.85 미만')]]; }
    return [[true, rl.conds[0][0] + ' 값 읽기'], [true, '조건 ' + rl.conds[0][1] + ' ' + rl.conds[0][2] + ' 평가']];
  };
  const exec = () => { setBusy(true); setRun(null); setTimeout(() => { setRun(trace(rule, d)); setBusy(false); }, 900); };
  const execBatch = () => { setBatch(docs.map(dc => { const t = trace(rule, dc); return { dc, pass: t.every(x => x[0]), why: (t.find(x => !x[0]) || t[t.length - 1])[1] }; })); toast('샘플 ' + docs.length + '건을 일괄 시험했습니다'); };
  const pass = run && run.every(x => x[0]);
  return (
    <div className="rise"><h1 className="headline" style={{ marginBottom: 16 }}>적용 전에 <em>시험 실행</em>으로 먼저 확인합니다</h1>
    <div style={{ display: 'grid', gridTemplateColumns: '320px 1fr', gap: 18, alignItems: 'start' }}>
      <div className="card">
        <h4>시험 조건</h4>
        <label className="lbl">룰 · 버전</label>
        <select className="field-input" value={rid} onChange={e => { setRid(e.target.value); setRun(null); setBatch(null); }}>{rules.map(r => <option key={r.id} value={r.id}>{r.name} (v{r.ver})</option>)}</select>
        <label className="lbl" style={{ marginTop: 14 }}>샘플 문서</label>
        {docs.map(x => <button key={x.id} className={'ver-row' + (did === x.id ? ' sel' : '')} style={{ width: '100%', textAlign: 'left' }} onClick={() => { setDid(x.id); setRun(null); }}><I n="file-text" /><span className="grow">{x.id} · {x.fields[0].orig}</span></button>)}
        <div className="row" style={{ marginTop: 16 }}>
          <button className="btn primary" data-loading={busy ? 'true' : undefined} onClick={exec}><I n="play" b />시험 실행</button>
          <button className="btn" onClick={execBatch}><I n="stack" />일괄 시험</button>
        </div>
        <div className="hint" style={{ marginTop: 12 }}>읽기 전용으로 실행하며 검수 이력에는 기록하지 않습니다.</div>
      </div>
      <div>
        <div className="card" style={{ minHeight: 230, borderRadius: 20, boxShadow: '0 4px 16px rgba(0,0,0,0.10)' }}>
          <div className="row" style={{ marginBottom: 12 }}><h4 style={{ margin: 0 }}>{rule.name}</h4><span className="hint">대상 {d.id}</span>{run && <span className={'pill ' + (pass ? 'ok' : 'bad')} style={{ marginLeft: 'auto' }}><I n={pass ? 'check-circle' : 'x-circle'} />{pass ? '통과' : '실패'}</span>}</div>
          {busy && <div><div className="shimmer" style={{ height: 18, marginBottom: 12 }} /><div className="shimmer" style={{ height: 18, width: '70%', marginBottom: 12 }} /><div className="shimmer" style={{ height: 18, width: '85%' }} /></div>}
          {!busy && !run && <div className="hint" style={{ padding: '30px 0', textAlign: 'center' }}><I n="flask" style={{ fontSize: 30, color: 'var(--n5)' }} /><br />룰과 샘플 문서를 고르고 시험 실행을 눌러 조건별 결과를 확인합니다.</div>}
          {run && <div className="trace">{run.map(([ok, m], i) => <div key={i} className="trace-step rise" style={{ animationDelay: i * 0.12 + 's' }}><span className={'tdot ' + (ok ? 'ok' : 'bad')}><I n={ok ? 'check' : 'x'} b /></span><div style={{ fontSize: 14, fontWeight: i === run.length - 1 ? 700 : 400 }}>{m}</div><div className="hint" style={{ fontSize: 12 }}>단계 {i + 1}</div></div>)}</div>}
        </div>
        {batch && <div className="card rise" style={{ marginTop: 14 }}>
          <div className="row" style={{ marginBottom: 8 }}><h4 style={{ margin: 0 }}>일괄 시험 결과</h4><button className="btn sm" style={{ marginLeft: 'auto' }} onClick={() => toast('결과 표를 CSV로 내보냅니다')}><I n="download-simple" />표 내보내기</button></div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}><tbody>{batch.map(b => <tr key={b.dc.id} style={{ borderTop: '1px solid var(--n3)' }}><td style={{ padding: '8px 4px' }}>{b.dc.id} · {b.dc.fields[0].orig}</td><td style={{ color: 'var(--n7)' }}>{b.why}</td><td style={{ textAlign: 'right' }}><span className={'pill ' + (b.pass ? 'ok' : 'bad')}>{b.pass ? '통과' : '실패'}</span></td></tr>)}</tbody></table>
        </div>}
      </div>
    </div></div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
