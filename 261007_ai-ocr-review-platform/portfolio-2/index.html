function Tower({ tab, fails, setFails, retried, setRetried, toast }) {
  const [type, setType] = useState('전체');
  const [busy, setBusy] = useState(null);
  const [tip, setTip] = useState(null);
  const d = FLOW[type];
  const mult = tab === '오늘' ? 1 : tab === '최근 7일' ? 6.4 : 26;
  const tot = (a) => Math.round(a.reduce((x, y) => x + y, 0) * mult);
  const done = tot(d.done), fail = tot(d.fail) - retried, wait = Math.round(d.wait[9] + d.wait[8] * 0.4);
  const rate = ((fail + 0) / (done + fail) * 100).toFixed(1);
  const max = Math.max(...d.done.map((v, i) => v + d.fail[i] + d.wait[i]));
  const X0 = 44, W = 640, H = 230, bw = 42;

  const retryAll = () => { if (!fails.length) { toast('재실행할 실패 건이 없습니다'); return; } setBusy('all'); setTimeout(() => { setRetried(r => r + fails.length); setFails([]); setBusy(null); toast('실패 ' + fails.length + '건을 일괄 재실행합니다'); }, 1100); };
  const [ctr, setCtr] = useState(0); useEffect(() => { const t = setInterval(() => setCtr(c => c + 1), 2600); return () => clearInterval(t); }, []);

        <div className="ss-item stat-card"><span className="ss-k">대기</span><span className="ss-v num">{wait}<small>건</small></span></div>
        <div className="ss-item stat-card"><span className="ss-k">실패</span><span className="ss-v num">{Math.max(fail, 0)}<small>{rate}%</small></span></div>
        <div className="ss-item stat-card"><span className="ss-k">큐 연결</span><span className="live" style={{ fontSize: 13 }}><i />SSE 수신 중</span></div>

      <div className="row" style={{ marginBottom: 12 }}>
        <span className="hint" style={{ fontWeight: 600 }}>문서 유형</span>

        <button className="btn sm" style={{ marginLeft: 'auto' }} onClick={() => toast('시간대·유형 필터를 적용한 집계를 내보냅니다')}><Icon n="download" size={13} />집계 내보내기</button>
      </div>
      <div className="focus-grid">
        <section className="panel" style={{ borderRadius: 6 }}>
          <div className="panel-h"><h3>시간대별 검수 흐름</h3><span className="sub">{tab === '오늘' ? '10월 6일 08시~17시' : tab === '최근 7일' ? '최근 7일 누적 평균 시간대' : '월간 누적 평균 시간대'}</span>
            <span className="row" style={{ marginLeft: 'auto', gap: 12, fontSize: 12, color: 'var(--n7)' }}><span className="row" style={{ gap: 5 }}><i style={{ width: 9, height: 9, background: 'var(--m600)', borderRadius: 2 }} />완료</span><span className="row" style={{ gap: 5 }}><i style={{ width: 9, height: 9, background: 'var(--n5)', borderRadius: 2 }} />대기</span><span className="row" style={{ gap: 5 }}><i style={{ width: 9, height: 9, background: 'var(--s2)', borderRadius: 2 }} />실패</span></span></div>
          <div className="panel-b" style={{ position: 'relative' }}>
            <svg className="gantt" viewBox={`0 0 ${W + 60} ${H + 36}`} role="img" aria-label="시간대별 검수 흐름 막대 차트">
              {[0, .25, .5, .75, 1].map(g => <g key={g}><line x1={X0} x2={W + 50} y1={H - g * (H - 14)} y2={H - g * (H - 14)} stroke="var(--n3)" /><text x={X0 - 8} y={H - g * (H - 14) + 4} fontSize="11" textAnchor="end" fill="var(--n7)">{Math.round(max * g)}</text></g>)}
              {HOURS.map((h, i) => {
                const x = X0 + 12 + i * 62; const sc = (H - 14) / max; const dn = d.done[i] * sc, wt = d.wait[i] * sc, fl = d.fail[i] * sc;
                const lab = `${h}시 · 완료 ${d.done[i]} · 대기 ${d.wait[i]} · 실패 ${d.fail[i]}`;
                return <g key={h} onMouseMove={e => setTip({ x: e.clientX + 12, y: e.clientY - 28, t: lab })} onMouseLeave={() => setTip(null)}>
                  <rect className="gbar" x={x} y={H - dn} width={bw} height={dn} fill="var(--m600)" rx="2" style={{ animationDelay: i * 0.05 + 's' }} />
                  <rect className="gbar" x={x} y={H - dn - wt} width={bw} height={wt} fill="var(--n5)" style={{ animationDelay: i * 0.05 + .1 + 's' }} />
                  <rect className="gbar" x={x} y={H - dn - wt - fl} width={bw} height={fl} fill="var(--s2)" rx="2" style={{ animationDelay: i * 0.05 + .2 + 's' }} />
                  <rect x={x - 6} y="0" width={bw + 12} height={H} fill="transparent" />
                  <text x={x + bw / 2} y={H + 18} fontSize="11" textAnchor="middle" fill="var(--n7)">{h}시</text>
                </g>;
              })}
            </svg>
            {tip && <div className="tip" style={{ left: tip.x, top: tip.y }}>{tip.t}</div>}
          </div>
        </section>
        <section className="panel">
          <div className="panel-h"><h3>우선 대응 큐</h3><span className="tag bad">{list.length}건</span>
            <button className="btn primary sm" style={{ marginLeft: 'auto' }} data-loading={busy === 'all' ? 'true' : undefined} onClick={retryAll}><Icon n="refresh-cw" size={12} />일괄 재실행</button></div>
          {list.map(f => <div key={f.id} className="rail-item fade">
            <div className={'score' + (f.score >= 80 ? ' hi' : '')} title="우선순위 점수">{f.score}</div>
            <div className="grow"><div style={{ fontWeight: 600, fontSize: 13, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.file}</div><div className="hint">{f.id} · {f.why} · {f.since}</div></div>
            <button className="btn sm" data-loading={busy === f.id ? 'true' : undefined} onClick={() => retry(f)}><Icon n="rotate-cw" size={12} />재실행</button>
          </div>)}
          {!list.length && <div className="panel-b hint" style={{ textAlign: 'center', padding: '34px 14px' }}><Icon n="check-circle-2" size={26} /><br />우선 대응이 필요한 건이 없습니다</div>}
        </section>
      </div>
      <div className="sec-grid">
        <section className="panel" style={{ borderRadius: 6 }}><div className="panel-h"><h3>문서 유형 분포</h3></div><div className="panel-b">
          {[['거래명세서', 46], ['검사성적서', 29], ['납품확인서', 17], ['입고검수표', 8]].map(([k, v], i) => <div key={k} style={{ marginBottom: 10 }}><div className="row" style={{ fontSize: 12, marginBottom: 4 }}><span className="grow">{k}</span><b className="num">{v}%</b></div><div className="hbar"><span style={{ width: v * 2 + '%', background: i === 0 ? 'var(--m600)' : i === 1 ? 'var(--n7)' : i === 2 ? 'var(--n5)' : 'var(--n4)', animationDelay: i * .08 + 's' }} /></div></div>)}
        </div></section>
        <section className="panel" style={{ borderRadius: 6 }}><div className="panel-h"><h3>검수 결과 구성</h3></div><div className="panel-b row" style={{ gap: 18 }}>
          <svg width="108" height="108" viewBox="0 0 42 42" role="img" aria-label="검수 결과 도넛"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--n3)" strokeWidth="6" />
            {[[78, 'var(--m600)', 0], [14, 'var(--n6)', 78], [8, 'var(--s2)', 92]].map(([p, c, o]) => <circle key={c} cx="21" cy="21" r="15.9" fill="none" stroke={c} strokeWidth="6" strokeDasharray={`${p} ${100 - p}`} strokeDashoffset={25 - o} />)}
          </svg>
          <div style={{ fontSize: 12, lineHeight: 2 }}><div><i style={{ display: 'inline-block', width: 9, height: 9, background: 'var(--m600)', borderRadius: 2, marginRight: 6 }} />자동 통과 78%</div><div><i style={{ display: 'inline-block', width: 9, height: 9, background: 'var(--n6)', borderRadius: 2, marginRight: 6 }} />확인 필요 14%</div><div><i style={{ display: 'inline-block', width: 9, height: 9, background: 'var(--s2)', borderRadius: 2, marginRight: 6 }} />불일치 8%</div></div>
        </div></section>
        <section className="panel" style={{ borderRadius: 6 }}><div className="panel-h"><h3>평균 처리 시간</h3><span className="tag ok">정상</span></div><div className="panel-b">
          <div className="ss-v num" style={{ color: 'var(--n10)' }}>41<small style={{ color: 'var(--n7)' }}>초 / 건</small></div>
          <svg viewBox="0 0 220 60" style={{ width: '100%', marginTop: 8 }} role="img" aria-label="처리 시간 추이"><polyline fill="none" stroke="var(--m600)" strokeWidth="2" strokeLinejoin="round" points="0,40 24,34 48,38 72,26 96,30 120,22 144,28 168,18 192,24 220,16" strokeDasharray="400" strokeDashoffset="400"><animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.2s" fill="freeze" /></polyline></svg>

            <button className="btn ghost sm" title="순서 올리기" onClick={() => move(i, -1)}><Icon n="arrow-up" size={13} /></button>
            <button className="btn ghost sm" title="순서 내리기" onClick={() => move(i, 1)}><Icon n="arrow-down" size={13} /></button>
            <button className="btn sm" data-loading={busy === e.id ? 'true' : undefined} onClick={() => check(e)}><Icon n="heart-pulse" size={13} />상태 점검</button>
            <button className={'switch' + (e.on ? ' on' : '')} role="switch" aria-checked={e.on} title="사용 여부" onClick={() => setEng(es => es.map(x => x.id === e.id ? { ...x, on: !x.on } : x))} />
          </div>
        </div>)}
      </section>
      <section className="panel" style={{ marginTop: 14, borderRadius: 6 }}><div className="panel-h"><h3>웹훅 수신 주소</h3></div><div className="panel-b row"><input className="input" defaultValue="https://검수콘솔.example.invalid/api/ocr/callback" /><button className="btn" onClick={() => toast('시험 호출을 보냈습니다')}><Icon n="send" size={13} />시험 호출</button></div></section>
    </div>
  );
}

/* ───────── 감사 로그·알림 규칙 ───────── */
function Audit({ tab, toast, setModal }) {
  const [q, setQ] = useState('');
  const [kind, setKind] = useState('전체');
  const [alerts, setAlerts] = useState(ALERTS0);
  const logs = LOGS0.filter(l => (kind === '전체' || l[2].includes(kind)) && (!q || l.join(' ').includes(q)));
  if (tab === '알림 규칙') return (
    <div className="fade panel"><div className="panel-h"><h3>알림 규칙</h3><span className="sub">룰 엔진 평가기와 같은 조건 모델을 사용합니다</span><button className="btn primary" style={{ marginLeft: 'auto' }} onClick={() => setModal('alert')}><Icon n="plus" size={14} />규칙 추가</button></div>
      {alerts.map(a => <div key={a.id} className="rail-item"><div className="grow"><b>{a.name}</b><div className="hint" style={{ marginTop: 3 }}>{a.cond} → 이메일 · {a.to}</div></div>
        <button className="btn ghost sm" onClick={() => toast(a.name + ' 시험 발송을 요청했습니다')}><Icon n="mail" size={13} />시험 발송</button>
        <button className={'switch' + (a.on ? ' on' : '')} role="switch" aria-checked={a.on} title="사용 여부" onClick={() => setAlerts(as => as.map(x => x.id === a.id ? { ...x, on: !x.on } : x))} /></div>)}</div>);
  if (tab === '발송 이력') return (
    <div className="fade panel"><div className="panel-h"><h3>알림 발송 이력</h3></div>
      <table className="t"><thead><tr><th>시각</th><th>규칙</th><th>수신자</th><th>결과</th><th>사유</th></tr></thead><tbody>
        {[['09:05', '실패 건 5건 이상 누적', '한도윤', '성공', '-'], ['09:05', '실패 건 5건 이상 누적', '신하은', '성공', '-'], ['11:20', '불일치 비율 급증', '품질팀 관리자', '실패', '수신 주소 도메인 응답 없음 (재시도 대기)'], ['11:35', '불일치 비율 급증', '품질팀 관리자', '성공', '재시도 1회 후 발송']].map((r, i) => <tr key={i}><td className="num">{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td><td><span className={'tag ' + (r[3] === '성공' ? 'ok' : 'bad')}>{r[3]}</span></td><td style={{ color: 'var(--n7)' }}>{r[4]}</td></tr>)}</tbody></table></div>);
  return (
    <div className="fade">
      <div className="row" style={{ marginBottom: 12 }}>
        <div style={{ position: 'relative' }}><input className="input" style={{ width: 260 }} placeholder="사용자·대상·내용 검색" value={q} onChange={e => setQ(e.target.value)} /></div>
        {['전체', '설정', '룰', '검수', '계정'].map(t => <button key={t} className={'chip' + (kind === t ? ' on' : '')} onClick={() => setKind(t)}>{t}</button>)}
        <button className="btn" style={{ marginLeft: 'auto' }} onClick={() => toast('조회 기간 로그를 CSV로 내보냅니다')}><Icon n="download" size={14} />내보내기</button>
      </div>
      <div className="panel"><table className="t"><thead><tr><th>시각</th><th>행위자</th><th>행위</th><th>대상</th><th>변경 내용</th></tr></thead><tbody>
        {logs.map((l, i) => <tr key={i}><td className="num">{l[0]}</td><td>{l[1] === '시스템' ? <span className="tag">시스템</span> : l[1]}</td><td><span className={'tag' + (l[2].includes('실패') || l[2].includes('반려') ? ' bad' : l[2].includes('승인') ? ' ok' : '')}>{l[2]}</span></td><td className="num">{l[3]}</td><td style={{ color: 'var(--n7)' }}>{l[4]}</td></tr>)}
      </tbody></table>{!logs.length && <div className="panel-b hint" style={{ textAlign: 'center' }}>검색 결과가 없습니다</div>}</div>
      <p className="hint" style={{ marginTop: 10 }}>감사 로그는 추가 전용으로 저장하며 변경 전후 값을 함께 기록합니다.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
