<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 도서 검색·수업자료 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 17°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fbf3f0;
  --m100:#f6e7e1;
  --m200:#eecfc3;
  --m300:#e4b29f;
  --m400:#d89277;
  --m500:#cd7350;
  --m600:#c2542a;
  --m700:#9f4522;
  --m800:#7c361b;
  --m900:#572613;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f2f3;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#777b86;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 17°와 17° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */
/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--ink:#17191c;--peach:#fbe1d1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{width:100%;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.serif{font-family:'Noto Serif KR',Georgia,serif;font-weight:400}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
/* header — sticky 검색바 */
.search-header{position:sticky;top:0;z-index:30;background:var(--n0);border-bottom:1px solid var(--n3)}
.header-row{display:flex;align-items:center;gap:24px;padding:16px 48px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;color:var(--n10);white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:12px;background:var(--m600);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:20px}
.search-bar{flex:1;max-width:760px;display:flex;align-items:stretch;border:1px solid var(--n4);border-radius:9999px;background:var(--n0);height:56px;padding:4px 4px 4px 8px;transition:box-shadow .2s,border-color .2s}
.search-bar:hover{border-color:var(--n6)}
.search-bar:focus-within{border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb,var(--m500) 20%,transparent)}
.search-segment{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px;min-width:0;text-align:left;border-radius:9999px}
.search-segment:hover{background:var(--n1)}
.segment-label{font-size:15px;line-height:1.2;color:var(--n7);font-weight:500}
.segment-value{font-size:15px;line-height:1.3;color:var(--n9);background:none;border:none;outline:none;width:100%;padding:0;appearance:none;-webkit-appearance:none;cursor:pointer;text-overflow:ellipsis}
input.segment-value{cursor:text}
.search-segment.grow{flex:1.6}
.search-divider{width:1px;background:var(--n3);margin:8px 0}
.search-submit{width:48px;height:48px;border-radius:50%;background:var(--m600);color:var(--n0);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.search-submit:hover{background:var(--m700)}
.header-nav{display:flex;gap:4px;margin-left:auto}
.nav-link{padding:8px 16px;border-radius:9999px;font-size:15px;font-weight:500;color:var(--n8);white-space:nowrap;transition:background .2s}
.nav-link:hover{background:var(--n2)}
.nav-link.active{background:var(--m50);color:var(--m700)}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:0 48px 16px;max-width:1440px;margin:0 auto;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;border:1px solid var(--n4);font-size:15px;color:var(--n8);white-space:nowrap;background:var(--n0);transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--n8);background:var(--n1)}
.chip.active{border-color:var(--ink);background:var(--ink);color:var(--n0)}
.chip i{font-size:20px}
.chip.filter-toggle{margin-left:auto;border-color:var(--n10);color:var(--n10)}
/* hero */
.hero{max-width:1440px;margin:0 auto;padding:48px 48px 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;width:100%}
.hero h1{font-size:48px;line-height:1.3;letter-spacing:-0.96px;color:var(--ink)}
.hero h1 em{font-style:italic;color:var(--m600)}
.hero p{margin-top:16px;color:var(--n7);font-size:17px;max-width:520px}
.hero-art{position:relative;height:240px}
.float-card{position:absolute;background:var(--n0);border:1px solid var(--n3);border-radius:24px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;animation:floatY 6s ease-in-out infinite}
.float-card.a{left:0;top:0;width:260px}
.float-card.b{right:0;top:96px;width:240px;background:var(--peach);border-color:var(--m100);animation-delay:-3s}
.float-card .fc-title{font-size:15px;color:var(--n7)}
.float-card .fc-row{display:flex;justify-content:space-between;font-size:15px;color:var(--n9)}
.float-card .fc-big{font-size:26px;line-height:1.2;letter-spacing:-0.23px;color:var(--n10)}
.float-card .bar{height:8px;border-radius:9999px;background:var(--n3);overflow:hidden}
.float-card .bar i{display:block;height:100%;background:var(--m600);border-radius:9999px;animation:barGrow 1.6s ease-out both}
/* main */
.main{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:0 48px 64px}
.results-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:16px 0 24px}
.type-tabs{display:flex;gap:4px;padding:4px;background:var(--n1);border-radius:9999px}
.type-tab{padding:8px 20px;border-radius:9999px;font-size:15px;font-weight:500;color:var(--n8);transition:background .2s}
.type-tab.active{background:var(--n0);color:var(--n10);border:1px solid var(--n3)}
.type-tab span{color:var(--n6);margin-left:4px}
.url-pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px dashed var(--n4);border-radius:9999px;font-size:15px;color:var(--n7);max-width:440px}
.url-pill code{font-family:ui-monospace,Menlo,monospace;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url-pill button{color:var(--m700);font-weight:500;display:flex;align-items:center;gap:4px}
.layout-grid{display:grid;grid-template-columns:240px 1fr;gap:32px}
.filter-rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:168px;align-self:start}
.rail-group h4{font-size:15px;font-weight:600;color:var(--n10);margin-bottom:8px}
.rail-opt{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:15px;color:var(--n8);cursor:pointer}
.rail-opt input{width:16px;height:16px;accent-color:var(--m600)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.listing-card{cursor:pointer;animation:fadeUp .5s ease-out both;transition:transform .25s;text-align:left;display:block;width:100%}
.listing-card:hover{transform:scale(1.02)}
.listing-card:hover .card-image{border-color:var(--n6)}
.card-image-wrap{position:relative}
.card-image{aspect-ratio:4/3;border-radius:20px;background:var(--n1);border:1px solid var(--n3);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .2s}
.card-favorite{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--n0);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--n8);border:1px solid var(--n3);transition:transform .2s}
.card-favorite:hover{transform:scale(1.12)}
.card-favorite.on{color:var(--m600)}
.card-type{position:absolute;left:12px;top:12px;padding:4px 12px;border-radius:9999px;background:var(--n0);border:1px solid var(--n3);font-size:15px;color:var(--n8)}
.card-body{padding:12px 4px 0;display:flex;flex-direction:column;gap:4px}
.card-title{font-size:17px;font-weight:600;color:var(--n10);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card-meta{font-size:15px;color:var(--n7);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card-price{font-size:17px;font-weight:600;color:var(--n10)}
.card-mat{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--n7)}
.cover{width:112px;aspect-ratio:3/4;border-radius:8px 16px 16px 8px;background:var(--n0);border:1px solid var(--n4);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px 12px 12px 20px;overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cv,var(--n4))}
.cover .ct{font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.3;color:var(--n10);letter-spacing:-0.3px}
.cover .cs{font-size:15px;color:var(--n7)}
.cover .shape{position:absolute;right:-16px;bottom:24px;width:64px;height:64px;border-radius:50%;border:8px solid var(--cv,var(--n3));opacity:.6}
.cover.lg{width:240px;padding:24px 16px 16px 32px}
.cover.lg .ct{font-size:26px}
.cover.lg::before{width:16px}
.empty{grid-column:1/-1;padding:64px 0;text-align:center;color:var(--n7)}
.empty i{font-size:48px;color:var(--n5)}
.empty h3{font-size:26px;margin:8px 0}
.skeleton{border-radius:20px;aspect-ratio:4/3;background:linear-gradient(90deg,var(--n2),var(--n1),var(--n2));background-size:200% 100%;animation:shimmer 1.2s infinite}
/* shared */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:9999px;font-size:15px;font-weight:500;border:1px solid var(--n10);color:var(--n10);background:var(--n0);transition:background .2s,transform .2s}
.btn:hover{background:var(--n2)}
.btn.primary{background:var(--m600);border-color:var(--m600);color:var(--n0)}
.btn.primary:hover{background:var(--m700);border-color:var(--m700)}
.btn.sm{height:40px;padding:0 16px}
.page{animation:fadeUp .4s ease-out both}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--n7);font-size:15px;margin:24px 0 16px}
.back:hover{color:var(--n10)}
/* book detail */
.detail{display:grid;grid-template-columns:320px 1fr;gap:48px;margin-top:8px}
.detail-cover{background:var(--n1);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:48px 0;border:1px solid var(--n3)}
.detail h1{font-size:44px;line-height:1.3;letter-spacing:-0.66px;color:var(--n10)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 16px;margin:24px 0;font-size:15px}
.kv dt{color:var(--n7)}
.kv dd{color:var(--n9)}
.link-chip{color:var(--m700);font-weight:500;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.mat-group{margin-top:32px}
.mat-group h3{font-size:26px;letter-spacing:-0.23px;line-height:1.2;margin-bottom:12px;color:var(--n10)}
.mat-row{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--n3);border-radius:16px;margin-bottom:8px;transition:border-color .2s}
.mat-row:hover{border-color:var(--n6)}
.mat-icon{width:48px;height:48px;border-radius:12px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-size:24px}
.mat-info{flex:1;min-width:0}
.mat-info b{display:block;font-weight:600;color:var(--n10)}
.mat-info span{font-size:15px;color:var(--n7)}
.log{margin-top:32px;background:var(--n1);border-radius:24px;padding:20px}
.log h4{font-size:17px;margin-bottom:8px}
.log li{list-style:none;font-size:15px;color:var(--n8);padding:4px 0;display:flex;gap:8px;align-items:center;animation:fadeUp .3s ease-out both}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:9999px;background:var(--n2);color:var(--n8);font-size:15px}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.pin{background:var(--m50);color:var(--m700)}
/* reading edu */
.edu-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:24px 0 32px;flex-wrap:wrap}
.edu-head h1{font-size:44px;line-height:1.3;letter-spacing:-0.66px;color:var(--n10)}
.edu-head p{color:var(--n7);margin-top:8px}
.edu-search{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);border-radius:9999px;padding:0 20px;height:48px;min-width:320px}
.edu-search:focus-within{border-color:var(--m500)}
.edu-search input{border:none;outline:none;flex:1;background:none;font-size:15px}
.edu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.edu-card{border:1px solid var(--n3);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;animation:fadeUp .5s ease-out both;transition:border-color .2s,transform .25s;background:var(--n0)}
.edu-card:hover{border-color:var(--n6);transform:translateY(-4px)}
.edu-card.pinned{background:var(--peach);border-color:var(--m100)}
.edu-card h3{font-size:22px;line-height:1.4;letter-spacing:-0.2px;color:var(--n10);font-family:'Noto Serif KR',serif;font-weight:500}
.edu-card p{font-size:15px;color:var(--n8)}
.book-chips{display:flex;gap:8px;flex-wrap:wrap}
.book-chip{padding:4px 12px;border-radius:9999px;background:var(--n0);border:1px solid var(--n4);font-size:15px;color:var(--n8);transition:border-color .2s}
.book-chip:hover{border-color:var(--n10)}
.edu-meta{display:flex;gap:16px;font-size:15px;color:var(--n7);margin-top:auto}
/* authors */
.auth-layout{display:grid;grid-template-columns:320px 1fr;gap:48px;margin-top:24px}
.auth-list{display:flex;flex-direction:column;gap:4px}
.auth-item{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;text-align:left;transition:background .2s}
.auth-item:hover{background:var(--n1)}
.auth-item.active{background:var(--m50)}
.auth-item.active b{color:var(--m700)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.auth-item b{display:block;font-weight:600}
.auth-item span{font-size:15px;color:var(--n7)}
.auth-detail h1{font-size:44px;letter-spacing:-0.66px;line-height:1.3;color:var(--n10)}
.auth-detail .bio{color:var(--n8);margin:12px 0 16px;max-width:640px}
.genre-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;margin-top:16px}
/* drawer / modal / toast */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);z-index:50;animation:fadeIn .2s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--n0);z-index:60;padding:32px;overflow:auto;animation:slideIn .3s ease-out both;display:flex;flex-direction:column;gap:16px}
.drawer h2{font-size:26px;line-height:1.2;letter-spacing:-0.23px;color:var(--n10)}
.drawer .x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
.drawer .x:hover{background:var(--n2)}
.drawer .opt{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:var(--n0);padding:12px 24px;border-radius:9999px;font-size:15px;z-index:80;display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease-out both}
.footer{border-top:1px solid var(--n3);padding:32px 48px;color:var(--n7);font-size:15px;margin-top:auto}
.footer-cols{max-width:1440px;margin:0 auto;display:flex;gap:64px;flex-wrap:wrap}
.footer-col h4{color:var(--n10);font-size:15px;margin-bottom:8px}
.footer-col a{display:block;padding:4px 0;cursor:pointer}
.footer-col a:hover{color:var(--n10)}
.copy{max-width:1440px;margin:24px auto 0}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes barGrow{from{width:0}}
@media (max-width:900px){
  .header-row{flex-wrap:wrap;padding:16px}.header-nav{display:none}
  .hero{grid-template-columns:1fr;padding:32px 16px}.hero-art{display:none}.hero h1{font-size:32px}
  .main{padding:0 16px 48px}.filter-chips{padding:0 16px 16px}
  .layout-grid,.detail,.auth-layout{grid-template-columns:1fr}.filter-rail{display:none}
  .url-pill{margin-left:0;max-width:100%}.edu-search{min-width:0;width:100%}
}
</style>
</head>
<body>
<div id="root"></div>

      {view === 'book' && (
        <main className="main page">
          <button className="back" onClick={() => go('main')}><i className="ph ph-arrow-left"></i>검색 결과로 돌아가요</button>
          <div className="detail">
            <div className="detail-cover"><Cover book={sb} lg /></div>
            <div>
              <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}><span className="pill">{sb.type}</span><span className="pill">{sb.subject}</span><span className="pill">{sb.grade}</span></div>
              <h1 className="serif">{sb.title}</h1>
              <dl className="kv">
                <dt>작가</dt><dd><span className="link-chip" onClick={() => { setAuthSel(AUTHORS.find(a => a.works.includes(sb.id))?.name || '윤하람'); setAuthGenre('전체'); go('authors'); }}>{sb.author}</span></dd>
                <dt>시리즈</dt><dd>{sb.series}</dd>
                <dt>도서 코드</dt><dd className="num">{sb.isbn}</dd>
                <dt>쪽수·발행</dt><dd className="num">{sb.pages}쪽 · {sb.year}년</dd>
                <dt>정가</dt><dd className="num">{sb.price}</dd>
              </dl>
              <p style={{ color: 'var(--n8)', maxWidth: 560 }}>{sb.summary}</p>
              <div style={{ display: 'flex', gap: 12, marginTop: 24 }}>
                <button className="btn primary" onClick={() => download(null, sb.title + ' 자료 전체')} data-loading={dlBusy === sb.title + ' 자료 전체' ? 'true' : undefined}><i className="ph ph-download-simple"></i>수록 자료 전체 내려받기</button>
                <button className="btn" onClick={e => toggleFav(sb.id, e)}><i className={favs.includes(sb.id) ? 'ph-fill ph-heart' : 'ph ph-heart'}></i>관심 도서</button>
              </div>
              {linked.length === 0 ? <div className="mat-group"><p style={{ color: 'var(--n7)' }}>연동된 자료가 아직 없어요.</p></div> :
                ['수업 PPT', '활동지', '지도안', '평가지'].filter(k => linked.some(m => m.kind === k)).map(k => (
                  <div className="mat-group" key={k}>
                    <h3 className="serif">{k}</h3>
                    {linked.filter(m => m.kind === k).map(m => (
                      <div className="mat-row" key={m.id}>
                        <div className="mat-icon"><i className={'ph ' + KIND_ICON[m.kind]}></i></div>
                        <div className="mat-info"><b>{m.title}</b><span className="num">파일 {m.files}개 · {m.date} 등록</span></div>
                        <button className="btn sm" onClick={() => download(m, m.title)} data-loading={dlBusy === m.title ? 'true' : undefined}>내려받기</button>
                      </div>
                    ))}
                  </div>
                ))}
              <div className="log">
                <h4>내려받기 기록</h4>
                {dl.length === 0 ? <span style={{ fontSize: 15, color: 'var(--n7)' }}>내려받은 자료가 여기에 쌓여요.</span> :
                  <ul>{dl.map((d, i) => <li key={i}><i className="ph ph-check-circle" style={{ color: 'var(--s1)' }}></i>{d.n}<span style={{ marginLeft: 'auto', color: 'var(--n6)' }}>{d.t}</span></li>)}</ul>}
              </div>
            </div>
          </div>
        </main>
      )}

      {view === 'edu' && (
        <main className="main page">
          <div className="edu-head">
            <div><h1 className="serif">독서 교육 제안</h1><p>하나의 자료가 여러 도서에 연결돼요. 상단 고정 자료를 먼저 보여 드려요.</p></div>
            <label className="edu-search"><i className="ph ph-magnifying-glass"></i><input placeholder="자료·도서 이름으로 찾아요" value={eduQ} onChange={e => setEduQ(e.target.value)} /></label>
          </div>
          <div className="edu-grid">
            {eduList.length === 0 && <div className="empty"><i className="ph ph-folder-open"></i><h3 className="serif">맞는 자료가 아직 없어요</h3><p>다른 검색어로 찾아보세요.</p></div>}
            {eduList.map((m, i) => (
              <article key={m.id} className={'edu-card' + (m.pinned ? ' pinned' : '')} style={{ animationDelay: (i * 60) + 'ms' }} onClick={() => setEduSel(m)} role="button" tabIndex={0}>
                <div style={{ display: 'flex', gap: 8 }}>
                  {m.pinned && <span className="pill pin"><i className="ph ph-push-pin"></i>상단 고정</span>}
                  <span className="pill"><i className={'ph ' + KIND_ICON[m.kind]}></i>{m.kind}</span>
                </div>
                <h3>{m.title}</h3>
                <p>{m.desc}</p>
                <div className="book-chips">{m.books.map(id => <span key={id} className="book-chip">{bookOf(id).title}</span>)}</div>
                <div className="edu-meta"><span className="num">도서 {m.books.length}권 연동</span><span className="num">파일 {m.files}개</span><span className="num" style={{ marginLeft: 'auto' }}>{m.date}</span></div>
              </article>
            ))}
          </div>
        </main>
      )}

      {view === 'authors' && (
        <main className="main page">
          <div className="edu-head"><div><h1 className="serif">작가·카테고리 탐색</h1><p>한 권이 여러 작가와 여러 장르에 함께 속할 수 있어요.</p></div></div>
          <div className="filter-chips" style={{ padding: '0 0 16px' }}>
            {allGenres.map(g => <button key={g} className={'chip' + (authGenre === g ? ' active' : '')} onClick={() => setAuthGenre(g)}>{g}</button>)}
          </div>
          <div className="auth-layout">
            <div className="auth-list">
              {AUTHORS.filter(a => authGenre === '전체' || a.genres.includes(authGenre)).map(a => (
                <button key={a.name} className={'auth-item' + (authSel === a.name ? ' active' : '')} onClick={() => setAuthSel(a.name)}>
                  <span className="avatar">{a.name.charAt(0)}</span>
                  <span><b>{a.name}</b><span>{a.genres.join(' · ')}</span></span>
                </button>
              ))}
            </div>
            <div className="auth-detail">
              <h1 className="serif">{au.name}</h1>
              <p className="bio">{au.bio}</p>
              <div className="genre-row">{au.genres.map(g => <span key={g} className="pill">{g}</span>)}</div>
              <h3 className="serif" style={{ fontSize: 26, lineHeight: 1.2 }}>대표작</h3>
              <div className="works">
                {authWorks.length === 0 ? <p style={{ color: 'var(--n7)' }}>이 장르의 대표작이 아직 없어요.</p> : authWorks.map((b, i) => <BookCard key={b.id} b={b} i={i} />)}
              </div>
              <h3 className="serif" style={{ fontSize: 26, lineHeight: 1.2, marginTop: 32 }}>관련 자료</h3>
              <div style={{ marginTop: 12 }}>
                {MATS.filter(m => m.books.some(id => au.works.includes(id))).map(m => (
                  <div className="mat-row" key={m.id}>
                    <div className="mat-icon"><i className={'ph ' + KIND_ICON[m.kind]}></i></div>
                    <div className="mat-info"><b>{m.title}</b><span>{m.kind} · 도서 {m.books.length}권 연동</span></div>
                    <button className="btn sm" onClick={() => setEduSel(m)}>살펴보기</button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </main>
      )}

      <footer className="footer">
        <div className="footer-cols">
          <div className="footer-col"><h4>도서</h4><a onClick={() => go('main')}>교과서·참고서</a><a onClick={() => { setTypeSel('단행본'); go('main'); }}>단행본</a></div>
          <div className="footer-col"><h4>수업 지원</h4><a onClick={() => go('edu')}>독서 교육 제안</a><a onClick={() => go('book')}>자료 내려받기</a></div>
          <div className="footer-col"><h4>둘러보기</h4><a onClick={() => go('authors')}>작가·카테고리</a></div>
        </div>
        <div className="copy">© 다온 북스 샘플 — 자체 개발 프로젝트 (가상 출판사 데모)</div>
      </footer>

      {quick && (
        <>
          <div className="overlay" onClick={() => setQuick(null)}></div>
          <aside className="drawer">
            <button className="x" aria-label="닫기" onClick={() => setQuick(null)}><i className="ph ph-x"></i></button>
            <div className="detail-cover" style={{ padding: 32 }}><Cover book={quick} lg /></div>
            <div style={{ display: 'flex', gap: 8 }}><span className="pill">{quick.type}</span><span className="pill">{quick.subject}</span></div>
            <h2 className="serif">{quick.title}</h2>
            <p style={{ fontSize: 15, color: 'var(--n7)' }}>{quick.author} · {quick.series}</p>
            <p style={{ color: 'var(--n8)' }}>{quick.summary}</p>
            <div style={{ display: 'flex', gap: 8, marginTop: 'auto' }}>
              <button className="btn primary" style={{ flex: 1 }} onClick={() => openBook(quick.id)}>자료 보러 가기</button>
              <button className="btn" onClick={e => toggleFav(quick.id, e)}><i className={favs.includes(quick.id) ? 'ph-fill ph-heart' : 'ph ph-heart'}></i>관심</button>
            </div>
          </aside>
        </>
      )}

      {filterOpen && (
        <>
          <div className="overlay" onClick={() => setFilterOpen(false)}></div>
          <aside className="drawer">
            <button className="x" aria-label="닫기" onClick={() => setFilterOpen(false)}><i className="ph ph-x"></i></button>
            <h2 className="serif">검색 조건</h2>
            <div><h4 style={{ fontSize: 15, marginBottom: 8 }}>학년</h4><div className="opt">{['전체', '초등', '초4', '중등', '중1', '고등', '일반'].map(g => <button key={g} className={'chip' + (grade === g ? ' active' : '')} onClick={() => setGrade(g)}>{g}</button>)}</div></div>
            <div><h4 style={{ fontSize: 15, marginBottom: 8 }}>구분</h4><div className="opt">{['전체', '교과서', '참고서', '단행본'].map(g => <button key={g} className={'chip' + (typeSel === g ? ' active' : '')} onClick={() => setTypeSel(g)}>{g}</button>)}</div></div>
            <label className="rail-opt"><input type="checkbox" checked={onlyMat} onChange={e => setOnlyMat(e.target.checked)} />자료 3개 이상 연동된 도서만 봐요</label>
            <button className="btn primary" style={{ marginTop: 'auto' }} onClick={() => { setFilterOpen(false); setToast('조건을 적용해요'); }}>{filtered.length}권 보기</button>
          </aside>
        </>
      )}

      {eduSel && (
        <>
          <div className="overlay" onClick={() => setEduSel(null)}></div>
          <aside className="drawer">
            <button className="x" aria-label="닫기" onClick={() => setEduSel(null)}><i className="ph ph-x"></i></button>
            <div style={{ display: 'flex', gap: 8 }}>{eduSel.pinned && <span className="pill pin"><i className="ph ph-push-pin"></i>상단 고정</span>}<span className="pill">{eduSel.kind}</span></div>
            <h2 className="serif">{eduSel.title}</h2>
            <p style={{ color: 'var(--n8)' }}>{eduSel.desc}</p>
            <h4 style={{ fontSize: 15 }}>연동된 도서 {eduSel.books.length}권</h4>
            {eduSel.books.map(id => (
              <div className="mat-row" key={id} style={{ cursor: 'pointer' }} onClick={() => { setEduSel(null); openBook(id); }}>
                <div className="mat-info"><b>{bookOf(id).title}</b><span>{bookOf(id).author} · {bookOf(id).type}</span></div>
                <i className="ph ph-arrow-right"></i>
              </div>
            ))}
            <button className="btn primary" style={{ marginTop: 'auto' }} onClick={() => download(eduSel, eduSel.title)} data-loading={dlBusy === eduSel.title ? 'true' : undefined}><i className="ph ph-download-simple"></i>자료 내려받기</button>
          </aside>
        </>
      )}

      {toast && <div className="toast"><i className="ph ph-check-circle"></i>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
