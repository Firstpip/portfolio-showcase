<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서·자료 통합 관리 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 246°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#e8e6ff;
  --m100:#d2cdff;
  --m200:#b7aeff;
  --m300:#988cff;
  --m400:#7b6cff;
  --m500:#5e4cff;
  --m600:#4d3ed1;
  --m700:#3c31a3;
  --m800:#2a2273;
  --m900:#2a2273;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f6f8fa;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#a4abb8;
  --n6:#909098;
  --n7:#72717a;
  --n8:#54535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--n0);color:var(--n9);font-family:'Pretendard',-apple-system,sans-serif;font-size:16px;line-height:1.5;letter-spacing:-0.16px;-webkit-font-smoothing:antialiased}
#root{width:100%;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit;letter-spacing:inherit}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:-0.28px}
.app{width:100%;min-height:100vh;display:flex}
/* 트리 사이드바 */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:12px 8px;overflow:auto}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;font-weight:600;font-size:14px;color:var(--n10);cursor:pointer}
.sidebar-brand:hover{background:var(--n2)}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--m500);color:var(--n0);display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-search{display:flex;flex-direction:column;gap:4px;margin:8px 0 12px}
.side-btn{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;font-size:14px;color:var(--n8);text-align:left;width:100%}
.side-btn:hover{background:var(--n2)}
.tree-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.tree-group{padding:12px 8px 4px;font-size:14px;color:var(--n6);font-weight:600}
.tree-item{display:flex;align-items:center;gap:4px;border-radius:6px}
.tree-item:hover{background:var(--n2)}
.tree-item.active{background:var(--n3)}
.tree-item.active .tree-label{color:var(--n10);font-weight:600}
.tree-item.active .tree-icon{color:var(--m600)}
.tree-toggle,.tree-toggle-placeholder{width:20px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--n6);font-size:14px;flex-shrink:0}
.tree-toggle{border-radius:4px}
.tree-toggle:hover{background:var(--n3)}
.tree-label{flex:1;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 0;font-size:14px;color:var(--n8);text-align:left}
.tree-icon{font-size:16px;color:var(--n7)}
.child{padding-left:20px}
.grandchild{padding-left:40px}
.sidebar-footer{border-top:1px solid var(--n3);padding-top:8px;margin-top:8px}
/* 페이지 */
.main-wrap{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);min-height:100vh;display:flex;flex-direction:column}
.page-breadcrumb{display:flex;align-items:center;gap:8px;padding:12px 32px;font-size:14px;color:var(--n7);border-bottom:1px solid var(--n3);position:sticky;top:0;background:var(--n0);z-index:10}
.page-breadcrumb a{cursor:pointer}
.page-breadcrumb a:hover{color:var(--n10)}
.page-breadcrumb .cur{color:var(--n10);font-weight:600}
.page-breadcrumb .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.page-cover{height:80px;background:repeating-linear-gradient(90deg,var(--n1) 0 1px,transparent 1px 16px),repeating-linear-gradient(0deg,var(--n1) 0 1px,transparent 1px 16px);border-bottom:1px solid var(--n3);position:relative;overflow:hidden}
.page-cover::after{content:"";position:absolute;right:32px;top:16px;width:16px;height:16px;background:var(--m500);box-shadow:-16px 16px 0 var(--m300),-32px 0 0 var(--m100),-16px -16px 0 var(--m200),16px 16px 0 var(--m100);animation:pixelPulse 3s ease-in-out infinite}
.page-body{width:100%;max-width:1120px;margin:0 auto;padding:24px 32px 64px;animation:fadeUp .35s ease-out both}
.page-icon-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.page-icon-large{width:40px;height:40px;border-radius:6px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;font-size:24px}
.meta-action{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--n7);padding:4px 8px;border-radius:6px}
.meta-action:hover{background:var(--n2)}
.page-title{font-size:40px;line-height:1.2;letter-spacing:-0.8px;font-weight:600;color:var(--n10);margin-bottom:8px}
.page-sub{font-size:16px;color:var(--n7);margin-bottom:24px}
.block-list{display:flex;flex-direction:column;gap:12px}
.block{position:relative;padding:4px 0}
.block-handle{position:absolute;left:-32px;top:8px;color:var(--n5);opacity:0;font-size:16px;cursor:grab;transition:opacity .15s}
.block:hover .block-handle{opacity:1}
.block h2{font-size:24px;line-height:1.3;letter-spacing:-0.48px;font-weight:600;color:var(--n10)}
.block-callout{display:flex;gap:12px;padding:12px 16px;background:var(--n1);border:1px solid var(--n3);border-left:4px solid var(--n5);border-radius:6px;font-size:16px;color:var(--n8)}
.callout-icon{font-size:20px;color:var(--n7);margin-top:2px}
.block-toggle summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--n9);padding:4px 0;list-style:none}
.block-toggle summary::-webkit-details-marker{display:none}
.block-toggle summary i{transition:transform .2s}
.block-toggle[open] summary i{transform:rotate(90deg)}
.toggle-content{padding:8px 0 4px 24px;font-size:14px;color:var(--n8)}
.card{border:1px solid var(--n3);border-radius:6px;background:var(--n0);box-shadow:0 1px 2px color-mix(in srgb,var(--n10) 6%,transparent)}
.card-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--n3);font-size:14px;font-weight:600;color:var(--n10)}
.card-head .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-pad{padding:16px}
/* insight-board: hero-viz + kpi-side */
.board{display:grid;grid-template-columns:1fr 260px;gap:16px}
.kpi-side{display:flex;flex-direction:column;gap:8px}
.kpi{border:1px solid var(--n3);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;background:var(--n0);animation:fadeUp .4s ease-out both}
.kpi span{font-size:14px;color:var(--n7)}
.kpi b{font-size:24px;line-height:1.2;letter-spacing:-0.48px;color:var(--n10);font-variant-numeric:tabular-nums}
.kpi.warn b{color:var(--n10)}
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.viz{display:grid;grid-template-columns:1fr 240px}
.viz svg{display:block;width:100%}
.viz-side{border-left:1px solid var(--n3);padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.viz-side h4{font-size:14px;color:var(--n10)}
.tag-set{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;background:var(--n2);color:var(--n8);font-size:14px;border:1px solid transparent;transition:border-color .15s,background .15s}
button.tag:hover{border-color:var(--n5)}
.tag.on{background:var(--n2);color:var(--n10);border-color:var(--n9);font-weight:600}
.node{cursor:pointer}
.node rect{fill:var(--n0);stroke:var(--n4);stroke-width:1;transition:stroke .2s,fill .2s}
.node text{font-size:14px;fill:var(--n8);font-family:inherit}
.node:hover rect{stroke:var(--n7)}
.node.sel rect{fill:var(--n1);stroke:var(--m600);stroke-width:2}
.node.sel text{fill:var(--n10);font-weight:600}
.node.rel rect{stroke:var(--n9);stroke-width:1.5}
.link{fill:none;stroke:var(--n4);stroke-width:1.2;transition:stroke .2s}
.link.on{stroke:var(--m500);stroke-width:2;stroke-dasharray:700;animation:draw .7s ease-out both}
.col-label{font-size:14px;fill:var(--n6);font-weight:600;font-family:inherit}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--n7);padding:8px 12px;border-bottom:1px solid var(--n3);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--n3);vertical-align:middle}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:var(--n1)}
tr.sel-row td{background:var(--m50)}
td.num,th.num{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:500;border:1px solid var(--n4);background:var(--n0);color:var(--n9);transition:background .15s,transform .15s}
.btn:hover{background:var(--n1)}
.btn.primary{background:var(--m500);border-color:var(--m500);color:var(--n0)}
.btn.primary:hover{background:var(--m600);border-color:var(--m600)}
.btn.icon{width:32px;padding:0}
.btn.danger{color:var(--s2-text);border-color:var(--s2-bg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:14px;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.err{background:var(--s2-bg);color:var(--s2-text)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.switch{width:32px;height:20px;border-radius:9999px;background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--n0);transition:transform .2s}
.switch.on{background:var(--m500)}
.switch.on::after{transform:translateX(12px)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;color:var(--n7);font-weight:500}
.field input,.field select,.field textarea{height:32px;border:1px solid var(--n4);border-radius:6px;padding:0 8px;background:var(--n0)}
.field textarea{height:80px;padding:8px;resize:none}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.type-card{border:1px solid var(--n4);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s;background:var(--n0)}
.type-card:hover{border-color:var(--n7)}
.type-card.on{border-color:var(--m500);background:var(--m50);box-shadow:0 0 0 1px var(--m500)}
.type-card b{font-size:14px;color:var(--n10);display:flex;align-items:center;gap:8px}
.type-card span{font-size:14px;color:var(--n7)}
.mini-prev{height:56px;border-radius:4px;background:var(--n1);border:1px solid var(--n3);display:grid;gap:4px;padding:8px}
.mini-prev i{background:var(--n4);border-radius:2px;display:block}
.prev-list{grid-template-columns:1fr}
.prev-gal{grid-template-columns:repeat(3,1fr)}
.prev-file{grid-template-columns:16px 1fr 24px}
.two{display:grid;grid-template-columns:1fr 320px;gap:16px}
.stage{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--n3)}
.stage:last-child{border-bottom:none}
.stage .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--n4);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--n0);flex-shrink:0;margin-top:2px}
.stage .dot.done{background:var(--s1);border-color:var(--s1)}
.stage .dot.now{border-color:var(--m500);background:var(--n0);animation:pulseRing 1.6s ease-out infinite}
.stage b{font-size:14px;color:var(--n10)}
.stage span.d{display:block;font-size:14px;color:var(--n7)}
.progress{height:8px;border-radius:9999px;background:var(--n3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--m500);border-radius:9999px;transition:width .4s}
.slash-menu{position:absolute;z-index:20;width:260px;background:var(--n0);border:1px solid var(--n4);border-radius:6px;box-shadow:0 4px 12px color-mix(in srgb,var(--n10) 12%,transparent);padding:4px;animation:fadeUp .15s both}
.slash-group-title{font-size:14px;color:var(--n6);padding:4px 8px}
.slash-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:4px;font-size:14px;cursor:pointer;color:var(--n9)}
.slash-item:hover{background:var(--n2)}
.slash-input{width:100%;height:32px;border:1px dashed var(--n4);border-radius:6px;padding:0 12px;background:var(--n0)}
.slash-wrap{position:relative}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s both}
.modal{width:480px;max-width:92%;background:var(--n0);border-radius:8px;padding:20px;animation:fadeIn .2s both;max-height:90vh;overflow:auto}
.modal h3{font-size:24px;line-height:1.3;letter-spacing:-0.48px;margin-bottom:16px;color:var(--n10)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n0);padding:8px 16px;border-radius:6px;font-size:14px;z-index:90;display:flex;align-items:center;gap:8px;animation:slideUp .25s ease-out both}
.hist li{list-style:none;display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--n3);font-size:14px;color:var(--n8)}
.hist li:last-child{border:none}
.hist time{margin-left:auto;color:var(--n6);white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes pixelPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m500) 40%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@media (max-width:1000px){.board,.viz,.two,.widget-grid{grid-template-columns:1fr}.sidebar{display:none}.main-wrap{margin-left:0;width:100%}}
</style>

const INIT_BOARDS = [
  { id:1, name:'공지사항', type:'일반형', fields:['제목','본문','첨부'], open:'전체', n:24 },
  { id:2, name:'수업 현장 사진', type:'갤러리형', fields:['제목','썸네일','본문'], open:'전체', n:18 },
  { id:3, name:'교사용 자료 모음', type:'파일 다운로드 전용', fields:['제목','파일','버전'], open:'로그인', n:42 },
];
const INIT_ROUTES = [
  { id:1, site:'구 단행본', from:'/book/view?id=1021', to:'/books/9101', st:'ok', stage:1 },
  { id:2, site:'구 단행본', from:'/book/list', to:'/search?type=단행본', st:'ok', stage:1 },
  { id:3, site:'구 단행본', from:'/qr/b/dw9102', to:'/books/9102', st:'wait', stage:1 },
  { id:4, site:'구 교과서', from:'/text/main', to:'/search?type=교과서', st:'wait', stage:2 },
  { id:5, site:'구 교과서', from:'/text/view/2201', to:'/books/2201', st:'wait', stage:2 },
  { id:6, site:'구 교과서', from:'/ref/list', to:'/search?type=참고서', st:'wait', stage:2 },
];
const TREE = [
  { g:'도서·작가', items:[ { k:'main', label:'작가·카테고리 매핑 관리', icon:'ti-arrows-exchange' }, { k:'materials', label:'자료 관리·노출 제어', icon:'ti-file-download' } ] },
  { g:'게시판', items:[ { k:'boards', label:'가변 게시판 유형 관리', icon:'ti-layout-grid' } ] },
  { g:'이관·전환', items:[ { k:'cutover', label:'301 리다이렉트·컷오버 현황', icon:'ti-route' } ] },
];

function App() {
  const [view, setView] = useState('main');
  const [open, setOpen] = useState({ '도서·작가': true, '게시판': true, '이관·전환': true });
  const [books, setBooks] = useState(INIT_BOOKS);
  const [sel, setSel] = useState(3);
  const [mats, setMats] = useState(INIT_MATS);
  const [boards, setBoards] = useState(INIT_BOARDS);
  const [routes, setRoutes] = useState(INIT_ROUTES);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [slash, setSlash] = useState(false);
  const [notes, setNotes] = useState([]);
  const [hist, setHist] = useState([{ t:'「함께 읽는 세계 단편선」 작가 지정 필요', w:'검증 큐', d:'오늘 09:12' }, { t:'「여름의 문장들」 공동 작가 2명 매핑', w:'담당자', d:'어제 17:40' }]);
  const [newMat, setNewMat] = useState({ t:'', kind:'활동지', books:[] });
  const [newBoard, setNewBoard] = useState({ name:'', type:'일반형', fields:['제목','본문'], open:'전체' });
  const [busy, setBusy] = useState(null);
  const [csv, setCsv] = useState(0);
  const [verified, setVerified] = useState(false);
  const [rollbacks, setRollbacks] = useState([{ d:'2026.10.02 22:10', n:'단행본 1차 리허설 — 301 규칙 오타 발견으로 롤백' }]);

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 2200); return () => clearTimeout(t); } }, [toast]);
  useEffect(() => { if (csv > 0 && csv < 100) { const t = setTimeout(() => setCsv(c => Math.min(100, c + 20)), 300); return () => clearTimeout(t); } if (csv === 100) { setToast('작가 CSV 6명을 정합성 검증까지 마쳐요'); } }, [csv]);
  const go = k => { setView(k); window.scrollTo({ top: 0 }); };
  const run = (key, ms, fn) => { setBusy(key); setTimeout(() => { setBusy(null); fn(); }, ms); };

  const book = books.find(b => b.id === sel);
  const toggleMap = (kind, v) => {
    setBooks(bs => bs.map(b => b.id !== sel ? b : { ...b, [kind]: b[kind].includes(v) ? b[kind].filter(x => x !== v) : [...b[kind], v] }));
    setHist(h => [{ t:'「' + book.t + '」 ' + (kind === 'a' ? '작가' : '장르') + ' 매핑 변경 — ' + v, w:'담당자', d:'방금 전' }, ...h].slice(0, 5));
    setToast('매핑을 저장해요');
  };
  const unmapped = books.filter(b => b.a.length === 0 || b.g.length === 0);

  // viz layout
  const rowH = 44, top = 40;
  const ay = n => top + AUTHORS.indexOf(n) * 56;
  const gy = n => top + GENRES.indexOf(n) * 56;
  const by = id => top + books.findIndex(b => b.id === id) * 42;
  const link = (x1, y1, x2, y2) => 'M' + x1 + ',' + y1 + ' C' + (x1 + (x2 - x1) / 2) + ',' + y1 + ' ' + (x1 + (x2 - x1) / 2) + ',' + y2 + ' ' + x2 + ',' + y2;

  const orderedMats = [...mats].sort((a, b) => (b.pin - a.pin));
  const move = (id, dir) => {
    setMats(ms => { const arr = [...ms].sort((a, b) => (b.pin - a.pin)); const i = arr.findIndex(m => m.id === id); const j = i + dir; if (j < 0 || j >= arr.length || arr[j].pin !== arr[i].pin) return ms; [arr[i], arr[j]] = [arr[j], arr[i]]; return arr; });
    setToast('노출 순서를 바꿔요');
  };
  const togglePin = id => { setMats(ms => ms.map(m => m.id === id ? { ...m, pin: !m.pin } : m)); setToast('상단 고정을 바꿔요'); };
  const toggleShow = id => { setMats(ms => ms.map(m => m.id === id ? { ...m, show: !m.show } : m)); setToast('노출 상태를 바꿔요'); };
  const addMat = () => {
    if (!newMat.t.trim()) { setToast('자료 이름을 입력해 주세요'); return; }
    setMats(ms => [{ id: Date.now(), t: newMat.t, kind: newMat.kind, books: newMat.books, pin: false, show: true, date: '2026.10.07' }, ...ms]);
    setModal(null); setNewMat({ t:'', kind:'활동지', books:[] }); setToast('자료를 등록해요');
  };
  const addBoard = () => {
    if (!newBoard.name.trim()) { setToast('게시판 이름을 입력해 주세요'); return; }
    setBoards(bs => [...bs, { id: Date.now(), ...newBoard, n: 0 }]);
    setNewBoard({ name:'', type:'일반형', fields:['제목','본문'], open:'전체' }); setToast('게시판을 만들어요');
  };
  const verifyAll = () => run('verify', 1400, () => {
    setRoutes(rs => rs.map((r, i) => r.stage === 1 ? { ...r, st: i === 2 ? 'err' : 'ok' } : r));
    setVerified(true); setToast('1차 매핑 3건을 검증해요');
  });
  const fixRoute = id => { setRoutes(rs => rs.map(r => r.id === id ? { ...r, to:'/books/9102', st:'ok' } : r)); setToast('매핑을 고쳐 301로 확인해요'); };
  const rollback = () => run('rb', 1000, () => { setRollbacks(r => [{ d:'2026.10.07 10:05', n:'단행본 1차 리허설 — 롤백 스크립트 점검' }, ...r]); setToast('롤백 이력을 남겨요'); });
  const s1 = routes.filter(r => r.stage === 1);
  const okN = s1.filter(r => r.st === 'ok').length;

  const crumb = TREE.flatMap(g => g.items.map(i => ({ ...i, g: g.g }))).find(i => i.k === view);
  const slashItems = [['ti-text-size','텍스트'],['ti-bulb','콜아웃'],['ti-checkbox','체크 항목'],['ti-minus','구분선']];

  return (
    <div className="app" data-archetype="notion-blocks-tree" style={{ width: '100%' }}>
      <aside className="sidebar tree-sidebar" data-tree-sidebar style={{ width: 240 }}>
        <div className="sidebar-brand" onClick={() => go('main')}><span className="brand-mark"><i className="ti ti-books"></i></span>다온 북스 관리 콘솔<i className="ti ti-chevron-down" style={{ marginLeft: 'auto', color: 'var(--n6)' }}></i></div>
        <div className="sidebar-search">
          <button className="side-btn" onClick={() => setToast('검색은 / 로 열어요')}><i className="ti ti-search"></i>검색</button>
          <button className="side-btn" onClick={() => setModal('mat')}><i className="ti ti-plus"></i>새 자료 등록</button>
        </div>
        <nav className="tree-nav">
          {TREE.map(g => (
            <React.Fragment key={g.g}>
              <div className="tree-item expanded" style={{ marginTop: 8 }}>
                <button className="tree-toggle" aria-label="펼치기" onClick={() => setOpen(o => ({ ...o, [g.g]: !o[g.g] }))}><i className={'ti ' + (open[g.g] ? 'ti-chevron-down' : 'ti-chevron-right')}></i></button>
                <span className="tree-icon"><i className="ti ti-folder"></i></span>
                <span className="tree-label" style={{ fontWeight: 600, color: 'var(--n10)', padding: '8px 8px 8px 8px' }}>{g.g}</span>
              </div>
              {open[g.g] && g.items.map(it => (
                <div key={it.k} className={'tree-item child' + (view === it.k ? ' active' : '')}>
                  <span className="tree-toggle-placeholder"></span>
                  <button className="tree-label" onClick={() => go(it.k)}><i className={'tree-icon ti ' + it.icon}></i>{it.label}</button>
                </div>
              ))}
            </React.Fragment>
          ))}
        </nav>
        <div className="sidebar-footer">
          <button className="side-btn" onClick={() => setToast('휴지통에는 삭제한 자료가 30일 보관돼요')}><i className="ti ti-trash"></i>휴지통</button>
          <button className="side-btn" onClick={() => setToast('설정은 관리자 권한에서 열려요')}><i className="ti ti-settings"></i>설정</button>
        </div>
      </aside>

      <div className="main-wrap">
        <header className="page-breadcrumb">
          <a onClick={() => go('main')}>콘솔</a><i className="ti ti-chevron-right"></i><a>{crumb.g}</a><i className="ti ti-chevron-right"></i><span className="cur">{crumb.label}</span>
          <div className="right"><span className="badge"><i className="ti ti-circle-check"></i>저장 완료</span><button className="btn" onClick={() => setToast('공유 링크가 복사돼요')}><i className="ti ti-link"></i>공유</button></div>
        </header>
        <div className="page-cover"></div>
        <main className="page page-body" key={view}>
          <div className="page-icon-row">
            <span className="page-icon-large"><i className={'ti ' + crumb.icon}></i></span>
            <button className="meta-action" onClick={() => setToast('아이콘은 설정에서 바꿔요')}><i className="ti ti-plus"></i>아이콘 추가</button>
            <button className="meta-action" onClick={() => setToast('댓글은 담당자에게 알려요')}><i className="ti ti-message"></i>댓글</button>
          </div>

          {view === 'main' && (<>
            <h1 className="page-title">작가·카테고리 매핑 관리</h1>
            <p className="page-sub">도서 한 권에 여러 작가와 여러 장르를 연결해요. 도서를 누르면 연결선이 강조돼요.</p>
            <div className="block-list">
              <div className="block block-callout" data-block-type="callout"><span className="block-handle"><i className="ti ti-grip-vertical"></i></span><i className="callout-icon ti ti-bulb"></i><span>작가 마스터는 한 곳에서만 수정하고, 도서마다 수동으로 연결해요. 미매핑 도서는 아래 큐에서 바로 지정할 수 있어요.</span></div>
              <div className="block board" data-block-type="board">
                <span className="block-handle"><i className="ti ti-grip-vertical"></i></span>
                <div className="card viz">
                  <div>
                    <div className="card-head"><i className="ti ti-arrows-exchange"></i>작가 – 도서 – 장르 매핑 보기</div>
                    <svg viewBox="0 0 640 400" height="400" role="img" aria-label="작가 도서 장르 매핑 그래프">
                      <text className="col-label" x="16" y="24">작가</text><text className="col-label" x="268" y="24">도서</text><text className="col-label" x="524" y="24">장르</text>
                      {books.map(b => b.a.map(n => <path key={'a' + b.id + n} className={'link' + (b.id === sel ? ' on' : '')} d={link(112, ay(n) + 16, 252, by(b.id) + 16)} />))}
                      {books.map(b => b.g.map(n => <path key={'g' + b.id + n} className={'link' + (b.id === sel ? ' on' : '')} d={link(388, by(b.id) + 16, 520, gy(n) + 16)} />))}
                      {AUTHORS.map(n => <g key={n} className={'node' + (book.a.includes(n) ? ' rel' : '')} onClick={() => toggleMap('a', n)}><rect x="16" y={ay(n)} width="96" height="32" rx="6" /><text x="28" y={ay(n) + 21}>{n}</text></g>)}
                      {books.map(b => <g key={b.id} className={'node' + (b.id === sel ? ' sel' : '')} onClick={() => setSel(b.id)}><rect x="252" y={by(b.id)} width="136" height="32" rx="6" /><text x="262" y={by(b.id) + 21}>{b.t.length > 9 ? b.t.slice(0, 9) + '…' : b.t}</text></g>)}
                      {GENRES.map(n => <g key={n} className={'node' + (book.g.includes(n) ? ' rel' : '')} onClick={() => toggleMap('g', n)}><rect x="520" y={gy(n)} width="104" height="32" rx="6" /><text x="532" y={gy(n) + 21}>{n}</text></g>)}
                    </svg>
                  </div>
                  <div className="viz-side">
                    <h4>{book.t}</h4>
                    <div><div style={{ color: 'var(--n7)', marginBottom: 4 }}>작가</div><div className="tag-set">{AUTHORS.map(n => <button key={n} className={'tag' + (book.a.includes(n) ? ' on' : '')} onClick={() => toggleMap('a', n)}>{n}</button>)}</div></div>
                    <div><div style={{ color: 'var(--n7)', marginBottom: 4 }}>장르</div><div className="tag-set">{GENRES.map(n => <button key={n} className={'tag' + (book.g.includes(n) ? ' on' : '')} onClick={() => toggleMap('g', n)}>{n}</button>)}</div></div>
                  </div>
                </div>
                <div className="kpi-side">
                  <div className="kpi" style={{ animationDelay: '0ms' }}><span>등록 도서</span><b>{books.length}권</b></div>
                  <div className="kpi" style={{ animationDelay: '80ms' }}><span>작가 마스터</span><b>{AUTHORS.length}명</b></div>
                  <div className="kpi" style={{ animationDelay: '160ms' }}><span>미매핑 도서</span><b>{unmapped.length}권</b></div>
                  <div className="kpi" style={{ animationDelay: '240ms' }}><span>다중 작가 도서</span><b>{books.filter(b => b.a.length > 1).length}권</b></div>
                </div>
              </div>
              <div className="block widget-grid" data-block-type="table" style={{ marginTop: 0 }}>
                <span className="block-handle"><i className="ti ti-grip-vertical"></i></span>
                <div className="card">
                  <div className="card-head"><i className="ti ti-alert-triangle"></i>미매핑 큐<span className="sp"><span className="badge warn">{unmapped.length}</span></span></div>
                  <table><tbody>
                    {unmapped.length === 0 && <tr><td>모두 연결됐어요.</td></tr>}
                    {unmapped.map(b => <tr key={b.id} className="row-click" onClick={() => setSel(b.id)}><td>{b.t}</td><td style={{ color: 'var(--n7)' }}>{b.a.length === 0 ? '작가 없음' : '장르 없음'}</td></tr>)}
                  </tbody></table>
                </div>
                <div className="card">
                  <div className="card-head"><i className="ti ti-upload"></i>작가 CSV 가져오기</div>
                  <div className="card-pad">
                    <p style={{ fontSize: 14, color: 'var(--n7)', marginBottom: 12 }}>작가 목록 파일을 올리면 중복·누락을 검증해요.</p>
                    <div className="progress"><i style={{ width: csv + '%' }}></i></div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 14 }}><span className="num" style={{ fontVariantNumeric: 'tabular-nums' }}>{csv}%</span>
                      <button className="btn primary" onClick={() => setCsv(1)} disabled={csv > 0 && csv < 100}>{csv === 100 ? '다시 가져오기' : '파일 선택'}</button></div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-head"><i className="ti ti-history"></i>최근 변경</div>
                  <ul className="hist" style={{ padding: '0 16px' }}>{hist.map((h, i) => <li key={i}>{h.t}<time>{h.d}</time></li>)}</ul>
                </div>
              </div>
              {notes.map((n, i) => <div key={i} className="block block-text" data-block-type="text" style={{ animation: 'fadeUp .3s both' }}><span className="block-handle"><i className="ti ti-grip-vertical"></i></span><p style={{ fontSize: 16 }}>{n}</p></div>)}
              <div className="block slash-wrap" data-block-type="text">
                <span className="block-handle"><i className="ti ti-grip-vertical"></i></span>
                <input className="slash-input" placeholder="/ 를 입력해 블록을 추가해요" onChange={e => setSlash(e.target.value.startsWith('/'))} onKeyDown={e => { if (e.key === 'Enter' && e.target.value && !e.target.value.startsWith('/')) { setNotes(n => [...n, e.target.value]); e.target.value = ''; } }} />
                {slash && <div className="slash-menu" data-slash-menu><div className="slash-group-title">기본 블록</div>{slashItems.map(([ic, t]) => <div key={t} className="slash-item" onClick={() => { setNotes(n => [...n, t + ' 블록 — 담당자 메모']); setSlash(false); setToast(t + ' 블록을 추가해요'); }}><i className={'ti ' + ic}></i>{t}</div>)}</div>}
              </div>
            </div>
          </>)}

          {view === 'materials' && (<>
            <h1 className="page-title">자료 관리·노출 제어</h1>
            <p className="page-sub">기본은 최신순 자동 정렬이고, 필요한 자료만 상단에 고정하거나 순서를 바꿔요.</p>
            <div className="block-list">
              <div className="block block-callout" data-block-type="callout"><i className="callout-icon ti ti-pinned"></i><span>상단 고정 {mats.filter(m => m.pin).length}건은 항상 먼저 보이고, 나머지는 등록일 순서를 따라요.</span></div>
              <div className="block two" data-block-type="table">
                <div className="card">
                  <div className="card-head"><i className="ti ti-files"></i>자료 목록<span className="sp"><button className="btn primary" onClick={() => setModal('mat')}><i className="ti ti-plus"></i>자료 등록</button></span></div>
                  <table><thead><tr><th>자료</th><th>연결 도서</th><th>노출</th><th>고정</th><th>순서</th></tr></thead>
                    <tbody>{orderedMats.map(m => (
                      <tr key={m.id} className="row-click" onClick={() => setModal({ detail: m })}>
                        <td><b style={{ fontWeight: 600 }}>{m.t}</b><div style={{ color: 'var(--n7)' }}>{m.kind} · {m.date}</div></td>
                        <td>{m.books.length === 0 ? <span className="badge warn">미연결</span> : <span className="num">{m.books.length}권</span>}</td>
                        <td onClick={e => e.stopPropagation()}><button className={'switch' + (m.show ? ' on' : '')} aria-label="노출" onClick={() => toggleShow(m.id)}></button></td>
                        <td onClick={e => e.stopPropagation()}><button className="btn icon" aria-label="상단 고정" onClick={() => togglePin(m.id)}><i className={'ti ' + (m.pin ? 'ti-pinned-filled' : 'ti-pin')} style={{ color: m.pin ? 'var(--m600)' : 'var(--n7)' }}></i></button></td>
                        <td onClick={e => e.stopPropagation()}><div style={{ display: 'flex', gap: 4 }}><button className="btn icon" aria-label="위로" onClick={() => move(m.id, -1)}><i className="ti ti-arrow-up"></i></button><button className="btn icon" aria-label="아래로" onClick={() => move(m.id, 1)}><i className="ti ti-arrow-down"></i></button></div></td>
                      </tr>))}</tbody></table>
                </div>
                <div className="card">
                  <div className="card-head"><i className="ti ti-eye"></i>메인 노출 미리보기</div>
                  <div className="card-pad" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {orderedMats.filter(m => m.show).map((m, i) => (
                      <div key={m.id} style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 14, padding: 8, border: '1px solid var(--n3)', borderRadius: 6, animation: 'fadeUp .3s both' }}>
                        <span className="num" style={{ color: 'var(--n6)', width: 16, fontVariantNumeric: 'tabular-nums' }}>{i + 1}</span><span style={{ flex: 1 }}>{m.t}</span>{m.pin && <i className="ti ti-pinned-filled" style={{ color: 'var(--m600)' }}></i>}
                      </div>))}
                  </div>
                </div>
              </div>
            </div>
          </>)}

          {view === 'boards' && (<>
            <h1 className="page-title">가변 게시판 유형 관리</h1>
            <p className="page-sub">유형과 필드를 설정 값으로 정의해요. 코드를 고치지 않고 게시판을 추가할 수 있어요.</p>
            <div className="block-list">
              <div className="block two" data-block-type="table">
                <div className="card">
                  <div className="card-head"><i className="ti ti-layout-grid"></i>게시판 목록</div>
                  <table><thead><tr><th>이름</th><th>유형</th><th>필드</th><th>공개</th><th className="num">글</th></tr></thead>
                    <tbody>{boards.map(b => (
                      <tr key={b.id} className="row-click" onClick={() => setModal({ board: b })}>
                        <td><b style={{ fontWeight: 600 }}>{b.name}</b></td><td><span className="badge">{b.type}</span></td>
                        <td style={{ color: 'var(--n7)' }}>{b.fields.join(', ')}</td><td>{b.open}</td><td className="num" style={{ fontVariantNumeric: 'tabular-nums' }}>{b.n}</td>
                      </tr>))}</tbody></table>
                </div>
                <div className="card">
                  <div className="card-head"><i className="ti ti-plus"></i>새 게시판 만들기</div>
                  <div className="card-pad">
                    <div className="field"><label>게시판 이름</label><input value={newBoard.name} onChange={e => setNewBoard({ ...newBoard, name: e.target.value })} placeholder="예: 독서 행사 안내" /></div>
                    <div className="type-grid" style={{ gridTemplateColumns: '1fr', marginBottom: 12 }}>
                      {[['일반형','제목·본문 목록','prev-list',1],['갤러리형','썸네일 카드 그리드','prev-gal',3],['파일 다운로드 전용','파일 목록과 버전','prev-file',3]].map(([t, d, cls, n]) => (
                        <button key={t} className={'type-card' + (newBoard.type === t ? ' on' : '')} onClick={() => setNewBoard({ ...newBoard, type: t, fields: t === '갤러리형' ? ['제목','썸네일'] : t === '일반형' ? ['제목','본문'] : ['제목','파일','버전'] })}>
                          <b>{t}</b><span>{d}</span>
                          <div className={'mini-prev ' + cls}>{Array.from({ length: n === 1 ? 3 : 3 }).map((_, i) => <i key={i}></i>)}</div>
                        </button>))}
                    </div>
                    <div className="field"><label>공개 범위</label><select value={newBoard.open} onChange={e => setNewBoard({ ...newBoard, open: e.target.value })}><option>전체</option><option>로그인</option><option>교사 인증</option></select></div>
                    <div className="field"><label>추가 필드</label><div className="tag-set">{['첨부','댓글','태그','고정글'].map(f => <button key={f} className={'tag' + (newBoard.fields.includes(f) ? ' on' : '')} onClick={() => setNewBoard({ ...newBoard, fields: newBoard.fields.includes(f) ? newBoard.fields.filter(x => x !== f) : [...newBoard.fields, f] })}>{f}</button>)}</div></div>
                    <button className="btn primary" style={{ width: '100%' }} onClick={addBoard}>게시판 만들기</button>
                  </div>
                </div>
              </div>
            </div>
          </>)}

          {view === 'cutover' && (<>
            <h1 className="page-title">301 리다이렉트·컷오버 현황</h1>
            <p className="page-sub">기존 경로가 통합 경로로 정확히 이어지는지 확인하고, 단계별 전환 상황을 한눈에 봐요.</p>
            <div className="block-list">
              <div className="block block-callout" data-block-type="callout"><i className="callout-icon ti ti-alert-triangle"></i><span>인쇄된 QR 경로가 포함된 매핑은 전환 전에 반드시 301 응답을 확인해요. 실패 건은 바로 고칠 수 있어요.</span></div>
              <div className="block two" data-block-type="table">
                <div className="card">
                  <div className="card-head"><i className="ti ti-route"></i>경로 매핑표<span className="sp"><span className="badge ok num">1차 {okN}/{s1.length} 확인</span><button className="btn primary" onClick={verifyAll} data-loading={busy === 'verify' ? 'true' : undefined}><i className="ti ti-player-play"></i>전체 검증 실행</button></span></div>
                  <table><thead><tr><th>구분</th><th>기존 경로</th><th>통합 경로</th><th>상태</th><th></th></tr></thead>
                    <tbody>{routes.map(r => (
                      <tr key={r.id}><td>{r.site}</td><td><code>{r.from}</code></td><td><code>{r.to}</code></td>
                        <td>{r.st === 'ok' ? <span className="badge ok"><i className="ti ti-check"></i>301</span> : r.st === 'err' ? <span className="badge err"><i className="ti ti-x"></i>404</span> : <span className="badge">대기</span>}</td>
                        <td>{r.st === 'err' && <button className="btn" onClick={() => fixRoute(r.id)}>매핑 고치기</button>}</td></tr>))}</tbody></table>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                  <div className="card">
                    <div className="card-head"><i className="ti ti-timeline"></i>단계별 전환</div>
                    <div className="card-pad">
                      <div className="stage"><span className="dot done"><i className="ti ti-check" style={{ fontSize: 14 }}></i></span><div><b>1차 · 단행본 데이터 이관</b><span className="d">CSV 적재와 정합성 검증 완료</span></div></div>
                      <div className="stage"><span className={'dot ' + (okN === s1.length ? 'done' : 'now')}>{okN === s1.length && <i className="ti ti-check" style={{ fontSize: 14 }}></i>}</span><div><b>1차 · 301 검증</b><span className="d">{okN}/{s1.length}건 확인</span></div></div>
                      <div className="stage"><span className="dot"></span><div><b>1차 · 컷오버 당일 확인</b><span className="d">DNS 전환 후 QR 경로 샘플 점검</span></div></div>
                      <div className="stage"><span className="dot"></span><div><b>2차 · 교과서·참고서 이관</b><span className="d">1차 안정화 이후 착수</span></div></div>
                    </div>
                  </div>
                  <div className="card">
                    <div className="card-head"><i className="ti ti-history"></i>롤백 이력<span className="sp"><button className="btn" onClick={rollback} data-loading={busy === 'rb' ? 'true' : undefined}><i className="ti ti-rotate-clockwise-2"></i>리허설</button></span></div>
                    <ul className="hist" style={{ padding: '0 16px' }}>{rollbacks.map((r, i) => <li key={i}>{r.n}<time>{r.d}</time></li>)}</ul>
                  </div>
                </div>
              </div>
            </div>
          </>)}
        </main>
      </div>

      {modal === 'mat' && (
        <div className="overlay" onClick={() => setModal(null)}><div className="modal" onClick={e => e.stopPropagation()}>
          <h3>새 자료 등록</h3>
          <div className="field"><label>자료 이름</label><input value={newMat.t} onChange={e => setNewMat({ ...newMat, t: e.target.value })} placeholder="예: 가을 독서 주간 활동지" /></div>
          <div className="field"><label>유형</label><select value={newMat.kind} onChange={e => setNewMat({ ...newMat, kind: e.target.value })}><option>활동지</option><option>수업 PPT</option><option>지도안</option><option>평가지</option></select></div>
          <div className="field"><label>연결할 도서 (여러 권 가능)</label><div className="tag-set">{books.map(b => <button key={b.id} className={'tag' + (newMat.books.includes(b.id) ? ' on' : '')} onClick={() => setNewMat({ ...newMat, books: newMat.books.includes(b.id) ? newMat.books.filter(x => x !== b.id) : [...newMat.books, b.id] })}>{b.t}</button>)}</div></div>
          <div className="modal-actions"><button className="btn" onClick={() => setModal(null)}>취소</button><button className="btn primary" onClick={addMat}>자료 등록</button></div>
        </div></div>
      )}
      {modal && modal.detail && (
        <div className="overlay" onClick={() => setModal(null)}><div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{modal.detail.t}</h3>
          <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}><span className="badge">{modal.detail.kind}</span>{modal.detail.pin && <span className="badge">상단 고정</span>}<span className="badge">{modal.detail.show ? '노출 중' : '숨김'}</span></div>
          <div style={{ fontSize: 14, color: 'var(--n7)', marginBottom: 8 }}>연결 도서</div>
          <div className="tag-set">{modal.detail.books.length === 0 ? <span className="badge warn">연결된 도서가 없어요</span> : modal.detail.books.map(id => <span key={id} className="tag">{(books.find(b => b.id === id) || { t: '도서 ' + id }).t}</span>)}</div>
          <div className="modal-actions"><button className="btn" onClick={() => setModal(null)}>닫기</button><button className="btn primary" onClick={() => { togglePin(modal.detail.id); setModal(null); }}>고정 상태 바꾸기</button></div>
        </div></div>
      )}
      {modal && modal.board && (
        <div className="overlay" onClick={() => setModal(null)}><div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{modal.board.name}</h3>
          <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}><span className="badge">{modal.board.type}</span><span className="badge">공개: {modal.board.open}</span></div>
          <div style={{ fontSize: 14, color: 'var(--n7)', marginBottom: 8 }}>필드 구성</div>
          <div className="tag-set">{modal.board.fields.map(f => <span key={f} className="tag">{f}</span>)}</div>
          <div className="modal-actions"><button className="btn danger" onClick={() => { setBoards(bs => bs.filter(b => b.id !== modal.board.id)); setModal(null); setToast('게시판을 휴지통으로 보내요'); }}><i className="ti ti-trash"></i>삭제</button><button className="btn" onClick={() => setModal(null)}>닫기</button></div>
        </div></div>
      )}
      {toast && <div className="toast"><i className="ti ti-check"></i>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
