<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWG 도면 기반 비계·동바리 개략 물량 산출 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 211°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#eff4fa;
  --m100:#e0eaf4;
  --m200:#c1d4ea;
  --m300:#9bbbdd;
  --m400:#709ece;
  --m500:#4882c1;
  --m600:#2067b3;
  --m700:#1a5493;
  --m800:#144273;
  --m900:#0e2e51;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f2f5fa;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b8ba;
  --n6:#909498;
  --n7:#71757a;
  --n8:#53575a;
  --n9:#36383a;
  --n10:#1e1f20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:var(--n1);color:var(--n9);font-size:14px;line-height:1.5;letter-spacing:.013px;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n10)}
i.ti{font-size:18px;line-height:1;flex-shrink:0}

/* 글자 네 단: 20 제목 / 16 소제목 / 14 본문 / 12 보조 (+ 핵심 숫자 32) */
.t-title{font-size:20px;font-weight:700;line-height:1.38;color:var(--n10)}
.t-sub{font-size:16px;font-weight:600;line-height:1.4;color:var(--n10)}
.t-cap{font-size:12px;color:var(--n7);line-height:1.6;letter-spacing:.125px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.125em;text-transform:uppercase;color:var(--n7)}
.big{font-size:32px;font-weight:700;line-height:1.25;color:var(--n10);font-variant-numeric:tabular-nums}
.unit{font-size:14px;font-weight:600;color:var(--n7);margin-left:4px}

/* ── 스테이지: 풀블리드 캔버스 + 떠 있는 패널 ── */
.stage{position:relative;width:100%;height:100vh;overflow:hidden;background:var(--n1)}
.map{position:absolute;inset:0;cursor:grab;touch-action:none}
.map.dragging{cursor:grabbing}
.map svg{width:100%;height:100%;display:block}
.float{position:absolute;background:var(--n0);border-radius:20px;border:1px solid var(--n3);box-shadow:0 14px 36px -12px color-mix(in srgb,var(--n10) 30%,transparent)}

/* 상단 바 */
.topbar{position:absolute;left:16px;right:16px;top:16px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:0 20px 0 8px;height:52px;border-radius:40px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--m600);display:flex;align-items:center;justify-content:center;color:var(--n0)}
.brand b{font-size:16px;font-weight:700;color:var(--n10)}
.brand span{font-size:12px;color:var(--n7)}
.nav{display:flex;gap:4px;padding:6px;border-radius:40px;height:52px}
.nav button{display:flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:40px;font-weight:600;color:var(--n8);transition:background .2s,color .2s}
.nav button:hover{background:var(--n2)}
.nav button.on{background:var(--m50);color:var(--m700);box-shadow:inset 0 0 0 1.5px var(--m600)}
.tools{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;border-radius:40px;height:52px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n7);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:40px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.chip.ok{background:var(--s1-bg);color:var(--s1-text)}
.chip.warn{background:var(--s3-bg);color:var(--s3-text)}
.chip.main{background:var(--m50);color:var(--m700)}

/* 좌측 떠 있는 리스트 패널 */
.drawer{left:16px;top:84px;bottom:16px;width:392px;display:flex;flex-direction:column;overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.drawer-head{padding:20px 20px 12px}
.drawer-body{flex:1;overflow:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{padding:12px 20px 20px;border-top:1px solid var(--n3);display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:40px;font-weight:600;white-space:nowrap;transition:background .2s,box-shadow .2s}
.btn.pri{background:var(--m600);color:var(--n0)}
.btn.pri:hover{background:var(--m700)}
.btn.out{background:var(--n0);box-shadow:inset 0 0 0 1px var(--n4);color:var(--n9)}
.btn.out:hover{background:var(--n2)}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.grow{flex:1}
.link{color:var(--m600);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--m800)}

/* 업로드 존 */
.drop{border:1.5px dashed var(--n5);border-radius:16px;padding:16px;background:var(--n1);display:flex;gap:12px;align-items:center}
.drop .ico{width:40px;height:40px;border-radius:12px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center}
.drop.run{border-color:var(--m500);background:var(--m50)}
.fname{font-weight:600;color:var(--n10);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m600);border-radius:6px;transition:width .15s linear}
.bar.live i{background:linear-gradient(90deg,var(--m500),var(--m700),var(--m500));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:32px;bottom:-8px;width:2px;background:var(--n3)}
.step .dot{width:24px;height:24px;border-radius:50%;background:var(--n2);color:var(--n6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
.step.done .dot{background:var(--s1);color:var(--n0)}
.step.cur .dot{background:var(--m600);color:var(--n0);animation:ring 1.4s ease-out infinite}
.step .dot i.ti{font-size:14px}
.step b{display:block;font-weight:600;color:var(--n10)}

/* 리스트 행 */
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;width:100%;transition:background .2s,box-shadow .2s;border:1px solid transparent}
.row:hover{background:var(--n1)}
.row.on{background:var(--m50);border-color:var(--m600)}
.row .ic{width:32px;height:32px;border-radius:10px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row.on .ic{background:var(--m100);color:var(--m700)}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:600;color:var(--n10);display:block}
.row .num{font-weight:600;color:var(--n10);font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;padding:4px;border-radius:40px;background:var(--n2);gap:4px}
.seg button{flex:1;height:32px;border-radius:40px;font-weight:600;color:var(--n7);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--n0);color:var(--m700);box-shadow:0 1px 3px color-mix(in srgb,var(--n10) 18%,transparent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--n1);border-radius:16px;padding:16px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.sw{width:40px;height:24px;border-radius:24px;background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--n0);transition:transform .2s}
.sw.on{background:var(--m600)}
.sw.on::after{transform:translateX(16px)}
.note{display:flex;gap:8px;padding:12px;border-radius:12px;background:var(--n1);color:var(--n8);font-size:12px;line-height:1.6}
.note i.ti{font-size:16px;color:var(--n7)}
.hr{height:1px;background:var(--n3)}
.lay{display:flex;align-items:center;gap:12px;padding:8px 0}
.lay code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--n8);background:var(--n2);padding:2px 8px;border-radius:6px}
.lay .grow{flex:1;min-width:0}
.eye{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--n7)}
.eye:hover{background:var(--n2)}
.eye.off{color:var(--n5)}

/* 우하단 상세 카드 */
.detail-card{right:16px;bottom:16px;width:352px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:rise .5s .08s cubic-bezier(.2,.7,.2,1) both;max-height:calc(100vh - 220px);overflow:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv span:first-child{color:var(--n7)}
.kv b{font-weight:600;color:var(--n10);font-variant-numeric:tabular-nums}
.formula{background:var(--n1);border-radius:12px;padding:12px;font-variant-numeric:tabular-nums;color:var(--n9)}
.formula b{color:var(--m700)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.inp{height:40px;border:1px solid var(--n4);border-radius:8px;padding:0 12px;background:var(--n0);width:100%;transition:border-color .2s}
.inp:hover{border-color:var(--n6)}
.inp.edited{background:var(--m50);border-color:var(--m400)}
.err{font-size:12px;color:var(--n10);display:flex;align-items:center;gap:4px;font-weight:600}
textarea.inp{height:72px;padding:8px 12px;resize:none}

/* 컨트롤·범례 */
.map-control{right:16px;top:84px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;animation:rise .5s .12s both}
.map-control button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--n8)}
.map-control button+button{border-top:1px solid var(--n3)}
.map-control button:hover{background:var(--n2)}
.legend{left:424px;bottom:16px;display:flex;gap:4px;padding:6px;border-radius:40px;animation:rise .5s .16s both}
.legend button{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:40px;font-size:12px;font-weight:600;color:var(--n8)}
.legend button:hover{background:var(--n2)}
.legend button.off{color:var(--n5);text-decoration:line-through}
.sw-line{width:16px;height:0;border-top:3px solid var(--n9);border-radius:2px}
.sw-fill{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--n6);background:var(--n3)}
.title-tag{left:424px;top:84px;padding:8px 16px;border-radius:40px;display:flex;align-items:center;gap:8px;font-weight:600;animation:rise .5s .1s both}

/* 캔버스 도형 */
.wall-ext{stroke:var(--n9);stroke-width:7;fill:none;stroke-linecap:square;stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.6s ease-out forwards}
.wall-in{stroke:var(--n6);stroke-width:2.5;fill:none}
.grid-ln{stroke:var(--n4);stroke-width:1;stroke-dasharray:14 6 3 6;fill:none}
.col{fill:var(--n9)}
.dim{stroke:var(--n6);stroke-width:1;fill:none}
.dim-t{font-size:12px;fill:var(--n8);font-weight:600;font-variant-numeric:tabular-nums}
.lab{font-size:12px;fill:var(--n7);font-weight:600}
.zone-hl{fill:var(--m100);fill-opacity:.55;stroke:var(--m600);stroke-width:2;animation:pulsefill 2.4s ease-in-out infinite}
.zone-hl-line{stroke:var(--m600);stroke-width:10;stroke-linecap:round;fill:none;opacity:.9}
.zone-warn{fill:var(--s3-bg);fill-opacity:.8;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 5}
.marker{cursor:pointer}
.marker .pin-bg{fill:var(--n9);stroke:var(--n0);stroke-width:3}
.marker.sel .pin-bg{fill:var(--m600)}
.marker.warn .pin-bg{fill:var(--s3)}
.marker text{fill:var(--n0);font-size:12px;font-weight:700;pointer-events:none}
.marker .halo{fill:none;stroke:var(--m500);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.marker.sel .halo{animation:halo 1.8s ease-out infinite}

/* 견적 요청 시트 */
.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:92px 16px 16px;background:color-mix(in srgb,var(--n10) 26%,transparent);animation:fade .25s both}
.sheet{width:min(960px,100%);max-height:100%;display:grid;grid-template-columns:1fr 1.1fr;overflow:hidden;animation:rise .45s cubic-bezier(.2,.7,.2,1) both;position:relative;border-radius:20px;background:var(--n0);border:1px solid var(--n3);box-shadow:0 14px 36px -12px color-mix(in srgb,var(--n10) 30%,transparent)}
.sheet-l{background:var(--n1);padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.sheet-r{padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hist{display:flex;align-items:center;gap:12px;padding:12px;background:var(--n0);border-radius:12px}
.sheet-x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n7)}
.sheet-x:hover{background:var(--n2)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--n8);background:var(--n0);border-radius:8px;padding:8px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 20px;border-radius:40px;display:flex;align-items:center;gap:8px;font-weight:600;animation:rise .35s both;z-index:50}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m600) 40%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes halo{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(2.2)}}
@keyframes pulsefill{0%,100%{fill-opacity:.4}50%{fill-opacity:.7}}

@media (max-width:900px){
  .topbar{flex-wrap:wrap;height:auto}
  .brand span,.tools{display:none}
  .nav{overflow:auto;max-width:100%}
  .nav button{padding:0 12px;font-size:12px}
  .drawer{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46vh}
  .detail-card,.legend,.title-tag{display:none}
  .map-control{top:132px;right:8px}
  .sheet{grid-template-columns:1fr;overflow:auto}
  .form2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ── 더미 데이터 ── */
const FLOORS = [
  { k: '1F', per: 148.2, h: 4.2, open: 38.4, slab: 0,     ih: 0 },
  { k: '2F', per: 148.2, h: 3.6, open: 31.2, slab: 812.4, ih: 3.95 },
  { k: '3F', per: 148.2, h: 3.6, open: 31.2, slab: 812.4, ih: 3.35 },
  { k: '4F', per: 148.2, h: 3.6, open: 31.2, slab: 812.4, ih: 3.35 },
  { k: '5F', per: 148.2, h: 3.6, open: 28.8, slab: 790.8, ih: 3.35 },
  { k: '옥탑', per: 62.4, h: 3.0, open: 4.6, slab: 78.6, ih: 2.75 },
];
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => v.toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const scaf = (f, ded) => r1(f.per * f.h - (ded ? f.open : 0));
const vol = f => r1(f.slab * f.ih);

const LAYERS = [
  { id: 'wall', code: 'A-WALL-EXT', use: '외벽', n: 142, icon: 'ti-border-outer' },
  { id: 'col',  code: 'S-COL',      use: '기둥', n: 54,  icon: 'ti-square' },
  { id: 'slab', code: 'S-SLAB',     use: '슬래브', n: 23, icon: 'ti-layout-board' },
  { id: 'dim',  code: 'A-ANNO-DIM', use: '치수·층고 표기', n: 318, icon: 'ti-ruler-measure' },
];

const ZONES = [
  { id: 'Z1', no: 1, kind: '외벽', name: '북측 외벽 A구간', layer: 'A-WALL-EXT', len: 50.4, h: 3.6, src: 'auto', x: 822, y: 330 },
  { id: 'Z2', no: 2, kind: '외벽', name: '동측 외벽 B구간', layer: 'A-WALL-EXT', len: 23.7, h: 3.6, src: 'auto', x: 1152, y: 485 },
  { id: 'Z3', no: 3, kind: '슬래브(RC)', name: '3F 슬래브 S1', layer: 'S-SLAB', area: 520.3, h: 3.35, src: 'auto', x: 560, y: 600 },
  { id: 'Z4', no: 4, kind: '슬래브(DECK)', name: '3F 슬래브 S2', layer: 'S-SLAB', area: 292.1, h: 3.35, src: 'edited', x: 1060, y: 420 },
  { id: 'Z5', no: 5, kind: '코어', name: '계단실 코어 내부 높이', layer: 'A-ANNO-DIM', area: 46.8, h: null, src: 'miss', x: 961, y: 560 },
];

const STEPS = [
  { t: '파일 업로드', d: '확장자·용량 검증' },
  { t: 'DXF 변환', d: '변환기를 별도 프로세스로 실행' },
  { t: '레이어 분류', d: '레이어 규칙 테이블로 용도 지정' },
  { t: '영역 추출', d: '외벽·슬래브 폐합 도형 검출' },
];

/* ── 도면(SVG) ── */
function Plan({ view, mode, sel, floor, onPick, layers, ded }) {
  const gx = [492, 602, 712, 822, 932, 1042, 1152];
  const gy = [330, 407.5, 485, 562.5, 640];
  const wallHl = (view === 'quantity' && mode === 'scaf') || (view === 'main' && sel === 'Z1');
  const slabHl = view === 'quantity' && mode === 'vol';
  return (
    <g>
      <defs>
        <pattern id="hatchA" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="var(--n4)" strokeWidth="1.5" /></pattern>
        <pattern id="hatchB" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0H12M0 0V12" stroke="var(--n4)" strokeWidth="1" fill="none" /></pattern>
      </defs>
      {/* 통로심 */}
      <g>
        {gx.map((x, i) => (<g key={'gx' + i}><line className="grid-ln" x1={x} y1={290} x2={x} y2={690} /><circle cx={x} cy={272} r="13" fill="var(--n0)" stroke="var(--n5)" /><text x={x} y={277} textAnchor="middle" className="lab">{i + 1}</text></g>))}
        {gy.map((y, i) => (<g key={'gy' + i}><line className="grid-ln" x1={452} y1={y} x2={1192} y2={y} /><circle cx={432} cy={y} r="13" fill="var(--n0)" stroke="var(--n5)" /><text x={432} y={y + 4} textAnchor="middle" className="lab">{'ABCDE'[i]}</text></g>))}
      </g>
      {/* 슬래브 */}
      {layers.slab && (<g>
        <path d="M492 330H822V640H492Z M602 407.5H712V562.5H602Z" fill="url(#hatchA)" fillRule="evenodd" stroke="var(--n5)" strokeWidth="1.5" />
        <path d="M822 330H1152V640H822Z M922 420H1000V545H922Z" fill="url(#hatchB)" fillRule="evenodd" stroke="var(--n5)" strokeWidth="1.5" />
        <text x="657" y="378" textAnchor="middle" className="lab">S1 · RC</text>
        <text x="1040" y="378" textAnchor="middle" className="lab">S2 · DECK</text>
        <text x="657" y="490" textAnchor="middle" className="lab">중정(개구부)</text>
      </g>)}
      {slabHl && <path className="zone-hl" d="M492 330H1152V640H492Z M602 407.5H712V562.5H602Z M922 420H1000V545H922Z" fillRule="evenodd" />}
      {view === 'viewer' && sel === 'Z3' && <path className="zone-hl" d="M492 330H822V640H492Z M602 407.5H712V562.5H602Z" fillRule="evenodd" />}
      {view === 'viewer' && sel === 'Z4' && <path className="zone-hl" d="M822 330H1152V640H822Z M922 420H1000V545H922Z" fillRule="evenodd" />}
      {view === 'main' && (sel === 'Z3') && <path className="zone-hl" d="M492 330H822V640H492Z M602 407.5H712V562.5H602Z" fillRule="evenodd" />}
      {view === 'main' && (sel === 'Z4') && <path className="zone-hl" d="M822 330H1152V640H822Z M922 420H1000V545H922Z" fillRule="evenodd" />}
      {/* 코어 */}
      <rect className="zone-warn" x="922" y="420" width="78" height="125" rx="4" />
      {[0, 1, 2, 3, 4, 5, 6, 7].map(i => <line key={'st' + i} x1="928" x2="994" y1={436 + i * 14} y2={436 + i * 14} stroke="var(--s3)" strokeWidth="1.2" />)}
      <text x="961" y="412" textAnchor="middle" className="lab">계단실 · EV</text>
      {/* 내부 벽 */}
      <g>
        <line className="wall-in" x1="822" y1="330" x2="822" y2="640" />
        <line className="wall-in" x1="1042" y1="330" x2="1042" y2="407.5" />
        <line className="wall-in" x1="1042" y1="562.5" x2="1042" y2="640" />
        <line className="wall-in" x1="1042" y1="485" x2="1152" y2="485" />
      </g>
      {/* 기둥 */}
      {layers.col && gx.flatMap((x, i) => gy.map((y, j) => <rect key={'c' + i + j} className="col" x={x - 6} y={y - 6} width="12" height="12" />))}
      {/* 외벽 */}
      {layers.wall && (<g>
        <rect className="wall-ext" x="492" y="330" width="660" height="310" />
        {wallHl && <rect className="zone-hl-line" x="492" y="330" width="660" height="310" style={{ fill: 'none', opacity: .55 }} />}
        {view === 'viewer' && sel === 'Z1' && <line className="zone-hl-line" x1="492" y1="330" x2="1152" y2="330" />}
        {view === 'viewer' && sel === 'Z2' && <line className="zone-hl-line" x1="1152" y1="330" x2="1152" y2="640" />}
        {view === 'main' && sel === 'Z2' && <line className="zone-hl-line" x1="1152" y1="330" x2="1152" y2="640" />}
      </g>)}
      {/* 치수 */}
      {layers.dim && (<g>
        <line className="dim" x1="492" y1="306" x2="1152" y2="306" /><line className="dim" x1="492" y1="298" x2="492" y2="314" /><line className="dim" x1="1152" y1="298" x2="1152" y2="314" />
        <rect x="788" y="297" width="68" height="18" fill="var(--n1)" /><text x="822" y="311" textAnchor="middle" className="dim-t">50,400</text>
        <line className="dim" x1="1178" y1="330" x2="1178" y2="640" /><line className="dim" x1="1170" y1="330" x2="1186" y2="330" /><line className="dim" x1="1170" y1="640" x2="1186" y2="640" />
        <rect x="1161" y="476" width="34" height="18" fill="var(--n1)" /><text x="1178" y="490" textAnchor="middle" className="dim-t">23,700</text>
        <text x="520" y="662" className="dim-t">FL +{floor === '1F' ? '0.00' : floor === '2F' ? '4.20' : floor === '3F' ? '7.80' : floor === '4F' ? '11.40' : floor === '5F' ? '15.00' : '18.60'}  ·  층고 {fmt((FLOORS.find(f => f.k === floor) || FLOORS[2]).h).replace('.0', '.00')}m</text>
      </g>)}
      {/* 마커 */}
      {ZONES.map(z => {
        const on = sel === z.id;
        return (
          <g key={z.id} className={'marker' + (on ? ' sel' : '') + (z.src === 'miss' ? ' warn' : '')} transform={`translate(${z.x} ${z.y})`} onClick={e => { e.stopPropagation(); onPick(z.id); }}>
            <circle className="halo" r="16" />
            <path className="pin-bg" d="M0 22 L-9 8 A16 16 0 1 1 9 8 Z" transform="translate(0 -22)" />
            <text x="0" y="-18" textAnchor="middle">{z.no}</text>
          </g>
        );
      })}
    </g>
  );
}

/* ── 앱 ── */
function App() {
  const [view, setView] = useState('main');
  const [sel, setSel] = useState('Z1');
  const [floor, setFloor] = useState('3F');
  const [mode, setMode] = useState('scaf');
  const [ded, setDed] = useState(false);
  const [layers, setLayers] = useState({ wall: true, col: true, slab: true, dim: true });
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [drag, setDrag] = useState(null);
  const [toast, setToast] = useState(null);
  const [up, setUp] = useState({ pct: 100, run: false });
  const [tool, setTool] = useState('select');
  const [edit, setEdit] = useState({ h: '3.60', area: '', memo: '' });
  const [saving, setSaving] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [form, setForm] = useState({ co: '가온종합건설', site: '문정동 근린생활시설 신축', who: '박정훈 과장', tel: '', memo: '' });
  const [errs, setErrs] = useState({});
  const [sent, setSent] = useState([{ id: 'Q-0412', site: '하남 물류센터 증축', at: '10.02', st: '회신 완료' }]);
  const timer = useRef(null);

  const say = (m, icon = 'ti-circle-check') => { setToast({ m, icon }); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 2600); };
  const z = ZONES.find(x => x.id === sel) || ZONES[0];
  const fl = FLOORS.find(f => f.k === floor);
  const totalScaf = useMemo(() => r1(FLOORS.reduce((s, f) => s + scaf(f, ded), 0)), [ded]);
  const totalVol = useMemo(() => r1(FLOORS.reduce((s, f) => s + vol(f), 0)), []);

  useEffect(() => () => clearInterval(timer.current), []);
  useEffect(() => { setEdit({ h: z.h ? z.h.toFixed(2) : '', area: z.area ? String(z.area) : '', memo: '' }); }, [sel]);

  const startUpload = () => {
    clearInterval(timer.current);
    setUp({ pct: 0, run: true });
    timer.current = setInterval(() => {
      setUp(u => {
        const n = Math.min(100, u.pct + 4);
        if (n >= 100) { clearInterval(timer.current); setTimeout(() => say('도면 인식이 완료되었습니다 — 구간 17곳을 찾았습니다'), 100); return { pct: 100, run: false }; }
        return { pct: n, run: true };
      });
    }, 110);
  };
  const stepState = i => { const t = (i + 1) * 25; return up.pct >= t ? 'done' : up.pct >= t - 25 && up.run ? 'cur' : up.run ? '' : 'done'; };

  const go = v => { setView(v); if (v === 'viewer' && !['Z1', 'Z2', 'Z3', 'Z4', 'Z5'].includes(sel)) setSel('Z5'); if (v === 'viewer') setSel('Z5'); if (v === 'main') setSel('Z1'); };
  const zoomBy = d => setZoom(v => Math.max(.6, Math.min(2.4, +(v + d).toFixed(2))));
  const toggleLayer = id => setLayers(l => ({ ...l, [id]: !l[id] }));

  const onDown = e => { if (e.target.closest('.marker')) return; setDrag({ x: e.clientX, y: e.clientY, px: pan.x, py: pan.y }); };
  const onMove = e => { if (drag) setPan({ x: drag.px + (e.clientX - drag.x) * 1.1, y: drag.py + (e.clientY - drag.y) * 1.1 }); };
  const onUp = () => setDrag(null);

  const save = () => {
    setSaving(true);
    setTimeout(() => { setSaving(false); say('수정값이 저장되었습니다 — 산출 합계에 바로 반영했습니다'); }, 1100);
  };
  const doExport = () => {
    setExporting(true);
    setTimeout(() => { setExporting(false); say('엑셀 파일 2개 시트(층별 요약·산식)를 내려받았습니다', 'ti-file-spreadsheet'); }, 1300);
  };
  const submit = () => {
    const e = {};
    if (!form.co.trim()) e.co = '업체명을 입력해 주세요';
    if (!form.site.trim()) e.site = '현장명을 입력해 주세요';
    if (!/^[0-9]{9,11}$/.test(form.tel.replace(/-/g, ''))) e.tel = '연락처는 숫자만 입력해 주세요';
    setErrs(e);
    if (Object.keys(e).length) { say('필수 항목을 확인해 주세요', 'ti-alert-circle'); return; }
    setSent(s => [{ id: 'Q-0431', site: form.site, at: '10.07', st: '접수 완료' }, ...s]);
    setForm(f => ({ ...f, tel: '', memo: '' }));
    say('견적 요청이 접수되었습니다 — 담당자가 확인 후 회신합니다');
  };

  const NAV = [
    { v: 'main', t: '도면 업로드', i: 'ti-cloud-upload' },
    { v: 'quantity', t: '물량 산출', i: 'ti-calculator' },
    { v: 'viewer', t: '수동 보정', i: 'ti-edit' },
    { v: 'estimate', t: '견적 요청', i: 'ti-file-invoice' },
  ];
  const view2 = view === 'estimate' ? 'quantity' : view;

  return (
    <div data-archetype="map-canvas" className="stage">
      {/* 풀블리드 캔버스 */}
      <div className={'map canvas' + (drag ? ' dragging' : '')} onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
           onClick={() => { if (view === 'main') setSel('Z1'); }}>
        <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
          <defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="var(--n4)" /></pattern></defs>
          <rect width="1600" height="1000" fill="url(#dots)" />
          <g transform={`translate(${pan.x} ${pan.y}) translate(822 485) scale(${zoom}) translate(-822 -485)`} style={{ transition: drag ? 'none' : 'transform .3s ease' }}>
            <Plan view={view2} mode={mode} sel={sel} floor={floor} onPick={id => { setSel(id); }} layers={layers} ded={ded} />
          </g>
        </svg>
      </div>

      {/* 상단 바 */}
      <header className="topbar">
        <div className="float brand">
          <div className="brand-mark"><i className="ti ti-ruler-3"></i></div>
          <div><b>가설플로우</b> <span>물량 산출</span></div>
        </div>
        <nav className="float nav">
          {NAV.map(n => (
            <button key={n.v} className={view === n.v ? 'on' : ''} onClick={() => go(n.v)}><i className={'ti ' + n.i}></i>{n.t}</button>
          ))}
        </nav>
        <div className="float tools">
          <span className="chip"><i className="ti ti-code" style={{ fontSize: 14 }}></i>홈페이지 임베드</span>
          <span className="avatar">김</span>
        </div>
      </header>

      {view !== 'estimate' && (
        <div className="float title-tag"><i className="ti ti-file-type-dwg" style={{ color: 'var(--n7)' }}></i>
          <span>{floor} 평면도 · 신축현장_A동_건축평면도_R3</span><span className="chip">개략 산출용</span></div>
      )}

      {/* 좌측 떠 있는 리스트 패널 */}
      {view === 'main' && (
        <div className="float drawer list-panel" key="d-main">
          <div className="drawer-head"><div className="eyebrow">STEP 1</div><div className="t-title">도면 업로드·자동 인식</div>
            <div className="t-cap">DWG 파일을 올리면 서버에서 DXF로 변환하고 레이어별로 분류합니다.</div></div>
          <div className="drawer-body">
            <div className={'drop' + (up.run ? ' run' : '')}>
              <div className="ico"><i className={'ti ' + (up.run ? 'ti-loader-2' : 'ti-file-check')} style={up.run ? { animation: 'k-spin .8s linear infinite' } : null}></i></div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="fname">신축현장_A동_건축평면도_R3.dwg</div>
                <div className="t-cap">14.2 MB · 건축·구조 통합 도면</div>
                {up.run && <div className={'bar live'} style={{ marginTop: 8 }}><i style={{ width: up.pct + '%' }}></i></div>}
              </div>
              {!up.run && <span className="chip ok">변환 완료</span>}
            </div>
            <div className="steps">
              {STEPS.map((s, i) => {
                const st = stepState(i);
                return (
                  <div key={s.t} className={'step ' + st}>
                    <div className="dot">{st === 'done' ? <i className="ti ti-check"></i> : i + 1}</div>
                    <div><b>{s.t}</b><span className="t-cap">{s.d}</span></div>
                  </div>
                );
              })}
            </div>
            <div className="hr"></div>
            <div>
              <div className="t-sub" style={{ marginBottom: 4 }}>인식된 레이어</div>
              {LAYERS.map(l => (
                <div className="lay" key={l.id}>
                  <div className="grow"><code>{l.code}</code></div>
                  <div style={{ textAlign: 'right' }}><b style={{ fontWeight: 600 }}>{l.use}</b><div className="t-cap num">{l.n}개 도형</div></div>
                  <button className={'eye' + (layers[l.id] ? '' : ' off')} title="레이어 표시" onClick={() => toggleLayer(l.id)}><i className={'ti ' + (layers[l.id] ? 'ti-eye' : 'ti-eye-off')}></i></button>
                </div>
              ))}
            </div>
          </div>
          <div className="drawer-foot">
            <button className="btn out grow" onClick={startUpload} disabled={up.run}><i className="ti ti-upload"></i>다른 도면 올리기</button>
            <button className="btn pri grow" onClick={() => go('quantity')} disabled={up.run}>물량 산출하기<i className="ti ti-arrow-right"></i></button>
          </div>
        </div>
      )}

      {view === 'quantity' && (
        <div className="float drawer list-panel" key="d-q">
          <div className="drawer-head"><div className="eyebrow">STEP 2</div><div className="t-title">개략 물량 산출</div>
            <div className="t-cap">산출 기준을 바꾸면 층별 합계가 다시 계산됩니다.</div></div>
          <div className="drawer-body">
            <div className="seg">
              <button className={mode === 'scaf' ? 'on' : ''} onClick={() => setMode('scaf')}>시스템비계 면적</button>
              <button className={mode === 'vol' ? 'on' : ''} onClick={() => setMode('vol')}>시스템동바리 체적</button>
            </div>
            <div className="kpis">
              <div className="kpi"><div className="t-cap">시스템비계 설치면적</div><div className="big">{fmt(totalScaf)}<span className="unit">㎡</span></div></div>
              <div className="kpi"><div className="t-cap">동바리 RC·DECK 체적</div><div className="big">{totalVol.toLocaleString('ko-KR', { minimumFractionDigits: 1 })}<span className="unit">㎥</span></div></div>
            </div>
            <div>
              {FLOORS.filter(f => mode === 'scaf' || f.slab > 0).map(f => (
                <button key={f.k} className={'row' + (floor === f.k ? ' on' : '')} onClick={() => setFloor(f.k)}>
                  <span className="ic"><i className={'ti ' + (mode === 'scaf' ? 'ti-building' : 'ti-stack-2')}></i></span>
                  <span className="grow"><span className="nm">{f.k}</span><span className="t-cap">{mode === 'scaf' ? `둘레 ${fmt(f.per)}m × 층고 ${f.h.toFixed(1)}m` : `슬래브 ${fmt(f.slab)}㎡ × 높이 ${f.ih.toFixed(2)}m`}</span></span>
                  <span className="num">{mode === 'scaf' ? fmt(scaf(f, ded)) : fmt(vol(f))}<span className="unit">{mode === 'scaf' ? '㎡' : '㎥'}</span></span>
                </button>
              ))}
            </div>
            <div className="switch">
              <div><b style={{ fontWeight: 600 }}>개구부 공제 적용</b><div className="t-cap">창호·출입구 면적을 비계 면적에서 제외합니다</div></div>
              <button className={'sw' + (ded ? ' on' : '')} role="switch" aria-checked={ded} onClick={() => { setDed(!ded); say(ded ? '개구부 공제를 해제했습니다' : '개구부 공제를 적용해 다시 계산했습니다', 'ti-refresh'); }}></button>
            </div>
            <div className="note"><i className="ti ti-info-circle"></i><span>견적 검토용 개략 물량입니다. 정밀 구조계산과 3D 모델링은 포함되지 않습니다.</span></div>
          </div>
          <div className="drawer-foot">
            <button className="btn out grow" onClick={() => go('viewer')}><i className="ti ti-edit"></i>수정하러 가기</button>
            <button className="btn pri grow" onClick={() => go('estimate')}>견적 요청하기<i className="ti ti-arrow-right"></i></button>
          </div>
        </div>
      )}

      {view === 'viewer' && (
        <div className="float drawer list-panel" key="d-v">
          <div className="drawer-head"><div className="eyebrow">STEP 3</div><div className="t-title">인식 구간 확인·수정</div>
            <div className="t-cap">도면에서 구간을 고르고 높이·면적을 직접 지정할 수 있습니다.</div></div>
          <div className="drawer-body">
            <div className="seg">
              {[['select', 'ti-pointer', '선택'], ['poly', 'ti-polygon', '구간 지정'], ['measure', 'ti-ruler-2', '길이 측정']].map(t => (
                <button key={t[0]} className={tool === t[0] ? 'on' : ''} onClick={() => { setTool(t[0]); say(t[2] + ' 도구를 사용합니다', 'ti-tool'); }}><i className={'ti ' + t[1]} style={{ fontSize: 16 }}></i>{t[2]}</button>
              ))}
            </div>
            <div>
              <div className="t-sub" style={{ marginBottom: 8 }}>인식 구간 {ZONES.length}곳</div>
              {ZONES.map(zz => (
                <button key={zz.id} className={'row' + (sel === zz.id ? ' on' : '')} onClick={() => setSel(zz.id)}>
                  <span className="ic" style={{ fontWeight: 700, fontSize: 12 }}>{zz.no}</span>
                  <span className="grow"><span className="nm">{zz.name}</span><span className="t-cap">{zz.kind} · {zz.layer}</span></span>
                  {zz.src === 'auto' && <span className="chip">자동</span>}
                  {zz.src === 'edited' && <span className="chip main">수정됨</span>}
                  {zz.src === 'miss' && <span className="chip warn">미인식</span>}
                </button>
              ))}
            </div>
            <div className="note"><i className="ti ti-bulb"></i><span>층고 표기가 없는 구간은 미인식으로 분류됩니다. 오른쪽 카드에서 높이를 입력해 주세요.</span></div>
          </div>
        </div>
      )}

      {/* 우하단 상세 카드 */}
      {view === 'main' && (
        <div className="float detail-card" key={'c-main' + sel}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div className="t-sub">구간 {z.no} · {z.name}</div><span className="chip">{z.kind}</span></div>
          <div className="kv"><span>레이어</span><b>{z.layer}</b></div>
          <div className="kv"><span>{z.len ? '길이' : '면적'}</span><b>{z.len ? fmt(z.len) + ' m' : fmt(z.area) + ' ㎡'}</b></div>
          <div className="kv"><span>높이 인식</span><b>{z.h ? z.h.toFixed(2) + ' m' : '미인식'}</b></div>
          <div><div className="t-cap" style={{ marginBottom: 4 }}>인식 신뢰도</div><div className="bar"><i style={{ width: z.src === 'miss' ? '38%' : z.src === 'edited' ? '100%' : '94%', background: z.src === 'miss' ? 'var(--s3)' : 'var(--m600)' }}></i></div></div>
          {z.src === 'miss'
            ? <button className="btn out" onClick={() => go('viewer')}><i className="ti ti-edit"></i>높이 직접 입력하기</button>
            : <span className="t-cap">규칙 테이블 기준 자동 인식 결과입니다.</span>}
        </div>
      )}

      {view === 'quantity' && fl && (
        <div className="float detail-card" key={'c-q' + floor + mode + ded}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div className="t-sub">{floor} 산출 근거</div><span className="chip main">{mode === 'scaf' ? '시스템비계' : '시스템동바리'}</span></div>
          {mode === 'scaf' ? (<>
            <div className="formula t-cap">외벽 둘레 <b>{fmt(fl.per)} m</b> × 층고 <b>{fl.h.toFixed(1)} m</b>{ded && <> − 개구부 <b>{fmt(fl.open)} ㎡</b></>}</div>
            <div><span className="big">{fmt(scaf(fl, ded))}</span><span className="unit">㎡</span></div>
            <div className="kv"><span>근거 도형</span><b>A-WALL-EXT 외벽 폴리라인 4개</b></div>
          </>) : (<>
            <div className="formula t-cap">슬래브 면적 <b>{fmt(fl.slab)} ㎡</b> × 내부 높이 <b>{fl.ih.toFixed(2)} m</b></div>
            <div><span className="big">{fmt(vol(fl))}</span><span className="unit">㎥</span></div>
            <div className="kv"><span>근거 도형</span><b>S-SLAB 폐합 영역 {fl.k === '옥탑' ? 1 : 2}개</b></div>
          </>)}
          <div className="kv"><span>출처</span><b>{floor === '3F' ? '자동 인식 5 · 수동 1' : '자동 인식'}</b></div>
          <button className="link" style={{ alignSelf: 'flex-start' }} onClick={() => { go('viewer'); }}>도면에서 구간 확인하기<i className="ti ti-arrow-up-right" style={{ fontSize: 16 }}></i></button>
        </div>
      )}

      {view === 'viewer' && (
        <div className="float detail-card" key={'c-v' + sel}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div className="t-sub">구간 {z.no} 값 수정</div>
            {z.src === 'miss' ? <span className="chip warn">미인식</span> : z.src === 'edited' ? <span className="chip main">수정됨</span> : <span className="chip">자동</span>}</div>
          <div className="t-cap">{z.name} · {z.layer}</div>
          <div className="form2" style={{ gap: 12 }}>
            <div className="field"><label>높이 (m)</label>
              <input className={'inp num' + (z.src === 'miss' && !edit.h ? '' : '')} aria-invalid={z.src === 'miss' && !edit.h} placeholder="예: 3.35" value={edit.h} onChange={e => setEdit({ ...edit, h: e.target.value })} /></div>
            <div className="field"><label>{z.len ? '길이 (m)' : '면적 (㎡)'}</label>
              <input className="inp num" value={z.len ? String(z.len) : edit.area} onChange={e => setEdit({ ...edit, area: e.target.value })} readOnly={!!z.len} /></div>
          </div>
          {z.src === 'miss' && !edit.h && <div className="err"><i className="ti ti-alert-triangle" style={{ fontSize: 14 }}></i>층고 표기를 찾지 못했습니다. 높이를 입력해 주세요</div>}
          <div className="field"><label>수정 사유</label><textarea className="inp" placeholder="예: 단면도 기준 내부 높이" value={edit.memo} onChange={e => setEdit({ ...edit, memo: e.target.value })}></textarea></div>
          <div className="kv"><span>자동 산출값</span><b>{z.h ? fmt((z.len || z.area) * z.h) : '—'}</b></div>
          <div className="kv"><span>수정 반영값</span><b>{edit.h && (z.len || z.area || edit.area) ? fmt((z.len || z.area || +edit.area || 0) * (+edit.h || 0)) : '—'}</b></div>
          <button className="btn pri" data-loading={saving ? 'true' : undefined} disabled={saving || !edit.h} onClick={save}><i className="ti ti-device-floppy"></i>수정값 저장하기</button>
        </div>
      )}

      {/* 컨트롤 · 범례 */}
      {view !== 'estimate' && (<>
        <div className="float map-control">
          <button title="확대" onClick={() => zoomBy(.2)}><i className="ti ti-plus"></i></button>
          <button title="축소" onClick={() => zoomBy(-.2)}><i className="ti ti-minus"></i></button>
          <button title="화면 맞춤" onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }}><i className="ti ti-focus-2"></i></button>
        </div>
        <div className="float legend layer-control">
          {[['wall', '외벽', <span className="sw-line"></span>], ['col', '기둥', <span className="sw-fill" style={{ background: 'var(--n9)' }}></span>], ['slab', '슬래브', <span className="sw-fill"></span>], ['dim', '치수', <i className="ti ti-ruler-measure" style={{ fontSize: 14 }}></i>]].map(l => (
            <button key={l[0]} className={layers[l[0]] ? '' : 'off'} onClick={() => toggleLayer(l[0])}>{l[2]}{l[1]}</button>
          ))}
        </div>
      </>)}

      {/* 견적 요청 시트 */}
      {view === 'estimate' && (
        <div className="scrim" onClick={() => go('quantity')}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <button className="sheet-x" title="닫기" onClick={() => go('quantity')}><i className="ti ti-x"></i></button>
            <div className="sheet-l">
              <div><div className="eyebrow">STEP 4</div><div className="t-title">산출 결과 확인·엑셀 출력</div></div>
              <div className="kpis">
                <div className="kpi" style={{ background: 'var(--n0)' }}><div className="t-cap">시스템비계</div><div className="big">{fmt(totalScaf)}<span className="unit">㎡</span></div></div>
                <div className="kpi" style={{ background: 'var(--n0)' }}><div className="t-cap">시스템동바리</div><div className="big">{totalVol.toLocaleString('ko-KR', { minimumFractionDigits: 1 })}<span className="unit">㎥</span></div></div>
              </div>
              <button className="btn out" data-loading={exporting ? 'true' : undefined} disabled={exporting} onClick={doExport}><i className="ti ti-file-spreadsheet"></i>엑셀 내려받기</button>
              <div className="hr"></div>
              <div><div className="t-sub" style={{ marginBottom: 8 }}>요청 이력</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {sent.map(s => (
                    <div className="hist" key={s.id}><span className="ic row-ic" style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--n2)', color: 'var(--n7)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><i className="ti ti-file-invoice"></i></span>
                      <div style={{ flex: 1, minWidth: 0 }}><b style={{ fontWeight: 600 }}>{s.site}</b><div className="t-cap">{s.id} · {s.at}</div></div>
                      <span className={'chip' + (s.st === '접수 완료' ? ' main' : '')}>{s.st}</span></div>
                  ))}
                </div></div>
              <div className="hr"></div>
              <div><div className="t-sub" style={{ marginBottom: 8 }}>기존 홈페이지 연동</div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <div className="code" style={{ flex: 1 }}>&lt;iframe src="…/embed/quantity" height="auto"&gt;</div>
                  <button className="btn out sm" onClick={() => say('임베드 코드를 복사했습니다', 'ti-copy')}><i className="ti ti-copy" style={{ fontSize: 14 }}></i>복사하기</button>
                </div></div>
            </div>
            <div className="sheet-r">
              <div><div className="t-title">견적 요청서</div><div className="t-cap">담당자가 산출 결과를 검토한 뒤 회신합니다.</div></div>
              <div className="form2">
                <div className="field"><label>업체명</label><input className="inp" aria-invalid={!!errs.co} value={form.co} onChange={e => setForm({ ...form, co: e.target.value })} />{errs.co && <div className="err"><i className="ti ti-alert-circle" style={{ fontSize: 14 }}></i>{errs.co}</div>}</div>
                <div className="field"><label>현장명</label><input className="inp" aria-invalid={!!errs.site} value={form.site} onChange={e => setForm({ ...form, site: e.target.value })} />{errs.site && <div className="err"><i className="ti ti-alert-circle" style={{ fontSize: 14 }}></i>{errs.site}</div>}</div>
                <div className="field"><label>담당자</label><input className="inp" value={form.who} onChange={e => setForm({ ...form, who: e.target.value })} /></div>
                <div className="field"><label>연락처</label><input className="inp" inputMode="numeric" aria-invalid={!!errs.tel} placeholder="숫자만 입력" value={form.tel} onChange={e => setForm({ ...form, tel: e.target.value })} />{errs.tel && <div className="err"><i className="ti ti-alert-circle" style={{ fontSize: 14 }}></i>{errs.tel}</div>}</div>
              </div>
              <div className="field"><label>요청 메모</label><textarea className="inp" style={{ height: 96 }} placeholder="착공 예정일, 공사 구간 등 검토에 필요한 내용을 적어 주세요" value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })}></textarea></div>
              <div className="note"><i className="ti ti-paperclip"></i><span>도면 1개와 산출 결과(비계 {fmt(totalScaf)}㎡ · 동바리 {totalVol.toLocaleString('ko-KR', { minimumFractionDigits: 1 })}㎥)가 함께 전달됩니다.</span></div>
              <button className="btn pri" style={{ marginTop: 'auto' }} onClick={submit}><i className="ti ti-send"></i>견적 요청 보내기</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast"><i className={'ti ' + toast.icon} style={{ color: 'var(--n0)' }}></i>{toast.m}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
