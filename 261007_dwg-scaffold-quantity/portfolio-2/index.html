<!DOCTYPE html>
<html lang="ko">

<title>비계·동바리 물량 산출 관리자 운영 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 16°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fdf2ee;
  --m100:#fbe5dd;
  --m200:#f7cbbb;
  --m300:#f3ab91;
  --m400:#ee8863;
  --m500:#e96637;
  --m600:#e4450b;
  --m700:#bb3909;
  --m800:#922c07;
  --m900:#671f05;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdf9f4;
  --n1:#ffffff;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#7a7371;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s2(오류/위험/실패/하락/환불) — 메인 hue 16°와 16° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n10)}
i.ph{font-size:16px;line-height:1;flex-shrink:0}

/* 글자: 12 / 14 / 16 / 20 + 핵심 숫자 28 */
.t-title{font-size:20px;font-weight:700;color:var(--n10);line-height:1.4}
.t-sub{font-size:16px;font-weight:600;color:var(--n10)}
.t-cap{font-size:12px;color:var(--n7)}
.num{font-variant-numeric:tabular-nums}
.stat-value{font-size:28px;font-weight:700;color:var(--n10);line-height:1.2;font-variant-numeric:tabular-nums}

/* ── 상단 글로벌 내비 (좌측 사이드바 없음) ── */
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
.app-header{position:sticky;top:0;z-index:20;height:56px;background:var(--n1);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:20px;padding:0 24px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--n10)}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--m600);color:var(--n1);display:flex;align-items:center;justify-content:center}
.project-switcher{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--n4);border-radius:6px;background:var(--n1);font-weight:500;color:var(--n8)}
.project-switcher:hover{background:var(--n2)}
.global-nav{display:flex;gap:2px;flex:1;height:100%}
.nav-link{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;font-weight:500;color:var(--n7);position:relative;transition:color .15s}
.nav-link:hover{color:var(--n10)}
.nav-link.active{color:var(--m700);font-weight:600}
.nav-link.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--m600);animation:grow-x .3s ease both;transform-origin:left}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--n7);position:relative}
.icon-btn:hover{background:var(--n2);color:var(--n10)}
.icon-btn .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--m600);border:1.5px solid var(--n1)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n8);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

.tab-bar{background:var(--n1);border-bottom:1px solid var(--n3);padding:0 24px;display:flex;gap:4px;align-items:flex-end}
.tab{height:44px;padding:0 12px;font-weight:500;color:var(--n7);position:relative;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--n10)}
.tab.active{color:var(--n10);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--n10)}
.tab .cnt{font-size:12px;background:var(--n2);color:var(--n8);border-radius:10px;padding:0 8px;font-variant-numeric:tabular-nums}
.tab-bar .grow{flex:1}
.tab-bar .meta{display:flex;align-items:center;gap:8px;height:44px;color:var(--n7);font-size:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--s1);animation:blink 1.6s ease-in-out infinite}

.content{width:100%;max-width:1320px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px;animation:fade-up .35s both}
.head-row .t-title{font-size:32px;line-height:1.25;letter-spacing:-.01em}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}

.card{background:var(--n1);border:1px solid var(--n3);border-radius:6px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n3)}
.card-b{padding:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;font-weight:600;white-space:nowrap;transition:background .15s,filter .15s}
.btn.pri{background:var(--m600);color:var(--n1)}
.btn.pri:hover{background:var(--m700)}
.btn.out{background:var(--n1);border:1px solid var(--n4);color:var(--n9)}
.btn.out:hover{background:var(--n2)}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.link{color:var(--m700);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8);white-space:nowrap}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.fail{background:var(--n10);color:var(--n1)}
.pill.main{background:var(--m50);color:var(--m700)}

/* 슬림 stat 스트립 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--n1);border:1px solid var(--n3);border-radius:6px}
.stat-card{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-right:1px solid var(--n3);transition:background .15s}
.stat-card:last-child{border-right:0}
.stat-card:hover{background:var(--n0)}
.stat-label{font-size:12px;color:var(--n7);font-weight:500}
.delta{font-size:12px;font-weight:600;color:var(--n7)}
.delta.up{color:var(--n8)}
.sparkline{width:72px;height:32px}

/* 듀얼 모니터 */
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.chart-wrap{padding:8px 16px 12px;position:relative}
.chart{width:100%;height:260px;display:block}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar-grow .7s cubic-bezier(.2,.7,.2,1) both}
.tip{position:absolute;pointer-events:none;background:var(--n10);color:var(--n1);padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.6;z-index:5;white-space:nowrap}
.seg{display:flex;border:1px solid var(--n4);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 12px;font-size:12px;font-weight:600;color:var(--n7);background:var(--n1)}
.seg button+button{border-left:1px solid var(--n4)}
.seg button.on{background:var(--n10);color:var(--n1)}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--n8)}
.legend button{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n8)}
.legend button.off{color:var(--n5);text-decoration:line-through}
.sw{width:10px;height:10px;border-radius:2px}
.feed{max-height:340px;overflow:auto}
.feed-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n3);animation:feed-in .45s both}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:28px;height:28px;border-radius:6px;background:var(--n2);color:var(--n8);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feed-ic.fail{background:var(--n10);color:var(--n1)}
.feed-ic.ok{background:var(--s1-bg);color:var(--s1-text)}
.feed-ic.main{background:var(--m50);color:var(--m700)}
.feed-t{flex:1;min-width:0}
.feed-t b{font-weight:600;color:var(--n10)}

/* 표 */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--n7);text-align:left;padding:8px 16px;background:var(--n0);border-bottom:1px solid var(--n3);white-space:nowrap}
.tbl td{padding:8px 16px;height:40px;border-bottom:1px solid var(--n3);white-space:nowrap}
.tbl tr.r{cursor:pointer;transition:background .12s}
.tbl tr.r:hover{background:var(--n0)}
.tbl tr.r.on{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.tbl td.t-cap{white-space:nowrap}
.tbl .co{font-weight:600;color:var(--n10)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--n8)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{height:32px;border:1px solid var(--n4);border-radius:6px;padding:0 12px;background:var(--n1);min-width:0;transition:border-color .15s}
.inp:hover{border-color:var(--n6)}
textarea.inp{height:72px;padding:8px 12px;resize:none;width:100%}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.err{font-size:12px;font-weight:600;color:var(--n10);display:flex;align-items:center;gap:4px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv span:first-child{color:var(--n7)}
.kv b{font-weight:600;color:var(--n10);font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--n3);margin:8px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:12px;padding:8px 0;position:relative}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:1px;background:var(--n4)}
.tl-d{width:11px;height:11px;border-radius:50%;background:var(--n1);border:2px solid var(--n5);margin-top:5px;flex-shrink:0}
.tl-i.cur .tl-d{border-color:var(--m600);background:var(--m600)}
.switch{width:36px;height:20px;border-radius:20px;background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--n1);transition:transform .2s}
.switch.on{background:var(--m600)}
.switch.on::after{transform:translateX(16px)}
.diff-old{color:var(--n6);text-decoration:line-through;margin-right:8px}
.diff-new{color:var(--n10);font-weight:700}

/* 우측 슬라이드오버 */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 30%,transparent);z-index:40;display:flex;justify-content:flex-end;animation:fade .2s both}
.slide{width:420px;max-width:100%;height:100%;background:var(--n1);border-left:1px solid var(--n3);display:flex;flex-direction:column;animation:slide-in .3s cubic-bezier(.2,.7,.2,1) both}
.slide-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:8px 16px;border-radius:6px;display:flex;align-items:center;gap:8px;font-weight:600;z-index:60;animation:fade-up .3s both}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bar-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes feed-in{from{opacity:0;background:var(--m50)}to{opacity:1;background:transparent}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw-line{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}

@media (max-width:900px){
  .app-header{overflow-x:auto;gap:12px;padding:0 12px}
  .project-switcher,.header-actions{display:none}
  .stat-row{grid-template-columns:1fr 1fr}
  .split,.two{grid-template-columns:1fr}
  .tab-bar{overflow-x:auto;padding:0 12px}
  .content{padding:16px 12px 32px}
  .tbl-scroll{overflow-x:auto}
}
</style>
</head>

const pad = v => v.toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

/* ── 작은 컴포넌트 ── */
const Spark = ({ data }) => {
  const mx = Math.max(...data), mn = Math.min(...data);
  const p = data.map((v, i) => `${(i / (data.length - 1)) * 72},${30 - ((v - mn) / (mx - mn || 1)) * 26}`).join(' ');
  return (<svg className="sparkline" viewBox="0 0 72 32"><polyline points={p} fill="none" stroke="var(--n6)" strokeWidth="1.6" strokeLinejoin="round" strokeDasharray="900" style={{ animation: 'draw-line 1.1s ease-out both' }} /></svg>);
};

const MiniPlan = ({ hl }) => (

/* ── 앱 ── */
function App() {
  const [sec, setSec] = useState('main');

  const [selQ, setSelQ] = useState('Q-0430');

  const [shown, setShown] = useState(6);
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);

  const say = (m, ic = 'ph-check-circle') => { setToast({ m, ic }); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 2600); };

    const t = setInterval(() => {
      const p = FEED_POOL[feedN.current % FEED_POOL.length];

      setFeed(f => [{ ...p, id: ++feedN.current * 100, at: `09:${String(m).padStart(2, '0')}` }, ...f].slice(0, 10));
    }, 5200);
    return () => clearInterval(t);
  }, []);

  const data = useMemo(() => ({ d: DAYS.slice(-range), u: UP.slice(-range), q: QT.slice(-range), f: FL.slice(-range) }), [range]);
  const todayUp = UP[29], todayQt = QT[29];
  const failCount = rows.filter(r => r.st === '변환 실패').length;

  const retry = () => {
    setRetrying(true);
    setTimeout(() => {

      setRows(rs => rs.map(r => r.st === '변환 실패' ? { ...r, st: '변환 중' } : r));

      say('변환 실패 ' + failCount + '건을 재처리 큐에 등록했습니다', 'ph-arrows-clockwise');
    }, 1100);
  };

    const r = rows.find(x => x.id === id);

    say(`${id} 상태를 ${to}(으)로 변경했습니다`);

  const saveCfg = () => {
    setSaving(true);
    setTimeout(() => { setSaving(false); setVer(v => v + 1); say(`산출 기준 v${ver + 1}로 저장했습니다 — 기존 견적은 제출 당시 기준을 유지합니다`); }, 1200);
  };

  /* 화면: 대시보드 */

                  <td><span className={'pill ' + pillOf(r.st)}>{r.st === '변환 실패' && <i className="ph ph-x-circle"></i>}{r.st}</span></td>

              <MiniPlan hl={d.sc > 0} />

              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn pri" style={{ flex: 1 }} onClick={() => say('서명 URL을 10분간 발급했습니다 — 관리자 권한으로 내려받는 중입니다', 'ph-lock-key')}><i className="ph ph-download-simple"></i>원본 도면 내려받기</button>
                <button className="btn out" onClick={() => say('읽기 전용 뷰어를 새 창으로 엽니다', 'ph-arrow-square-out')}><i className="ph ph-arrow-square-out"></i>뷰어 열기</button>
              </div>
              <div className="t-cap">원본 파일은 비공개 저장소에 보관되며 관리자 권한에서만 열람됩니다.</div>
            </div>
          </div>
        </div>
      </>
    );
  };

  /* 화면: 견적 요청 */
  const Quotes = () => {
    const status = ['', '접수', '검토', '회신', '보류'][tab];
    const all = rows.filter(r => r.kind === '견적' && (!status || r.st === status));
    const d = rows.find(r => r.id === selQ) || all[0];
    return (
      <>
        <div className="head-row">
          <div><div className="t-title">견적 요청 관리</div><div className="t-cap">요청 건별 업체 정보와 산출 결과를 보고 상태와 메모를 관리합니다.</div></div>
          <button className="btn out" onClick={() => say('견적 요청 ' + all.length + '건을 엑셀로 내려받았습니다', 'ph-file-xls')}><i className="ph ph-file-xls"></i>목록 엑셀 내려받기</button>
        </div>
        <div className="two">
          <div className="card">
            <div className="tbl-scroll"><table className="tbl">
              <thead><tr><th>번호</th><th>업체</th><th>현장</th><th>비계(㎡)</th><th>동바리(㎥)</th><th>상태</th><th>접수</th></tr></thead>
              <tbody>{all.map(r => (
                <tr key={r.id} className={'r' + (selQ === r.id ? ' on' : '')} onClick={() => setSelQ(r.id)}>
                  <td className="mono">{r.id}</td><td className="co">{CO[r.co]}</td><td>{SITE[r.site]}</td>
                  <td className="num">{pad(r.sc)}</td><td className="num">{pad(r.vo)}</td>
                  <td><span className={'pill ' + pillOf(r.st)}>{r.st}</span></td><td className="t-cap num">{r.at}</td>
                </tr>))}
                {all.length === 0 && <tr><td colSpan="7" style={{ textAlign: 'center', padding: 32 }} className="t-cap">이 상태의 요청이 아직 없습니다</td></tr>}</tbody>
            </table></div>
          </div>
          {d && <div className="card">
            <div className="card-h"><div className="t-sub">{d.id} 처리</div><span className={'pill ' + pillOf(d.st)}>{d.st}</span></div>
            <div className="card-b stack">
              <div><div className="kv"><span>업체명</span><b>{CO[d.co]}</b></div><div className="kv"><span>현장명</span><b>{SITE[d.site]}</b></div>
                <div className="kv"><span>담당자 연락처</span><b style={{ display: 'flex', alignItems: 'center', gap: 8 }}>***-****-4821<button className="link" onClick={() => say('원문 열람은 대표 관리자 권한이 필요합니다', 'ph-lock-key')}>원문 보기</button></b></div></div>
              <div className="hr"></div>
              <div className="t-cap" style={{ fontWeight: 600, color: 'var(--n8)' }}>상태 변경</div>
              <div className="seg" style={{ width: '100%' }}>
                {['접수', '검토', '회신', '보류'].map(s => <button key={s} style={{ flex: 1 }} className={d.st === s ? 'on' : ''} onClick={() => changeStatus(d.id, s)}>{s}</button>)}
              </div>
              <div className="t-cap">접수 → 검토 → 회신 순서로만 진행됩니다. 허용되지 않은 변경은 서버에서 거부됩니다.</div>
              <div className="hr"></div>
              <div className="t-cap" style={{ fontWeight: 600, color: 'var(--n8)' }}>메모 이력</div>
              <div className="tl">
                {memos.map((m, i) => (<div key={i} className={'tl-i' + (i === 0 ? ' cur' : '')}><span className="tl-d"></span><div><div style={{ fontWeight: 600 }}>{m.m}</div><div className="t-cap">{m.w} · {m.at}</div></div></div>))}
              </div>
              <div className="field"><textarea className="inp" placeholder="회신 전 확인할 내용을 남겨 주세요" value={memo} onChange={e => setMemo(e.target.value)}></textarea></div>
              <button className="btn pri" disabled={!memo.trim()} onClick={() => { setMemos([{ w: '김관리', at: '10.07 10:' + (20 + memos.length), m: memo }, ...memos]); setMemo(''); say('메모를 저장했습니다'); }}><i className="ph ph-note-pencil"></i>메모 저장하기</button>
            </div>
          </div>}
        </div>
      </>
    );
  };

  /* 화면: 설정 */
  const DIFF = [
    ['층고 여유값', '0.30 m', cfg.margin + ' m'],
    ['개구부 공제', '적용', cfg.deduct ? '적용' : '미적용'],
    ['동바리 RC 단가', '2,250원/㎥', cfg.p2 + '원/㎥'],
  ];
  const Settings = () => (
    <>
      <div className="head-row">
        <div><div className="t-title">산출 기준·단가 설정</div><div className="t-cap">기준 값은 버전으로 보관되며, 이미 제출된 견적은 제출 당시 버전을 유지합니다.</div></div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span className="pill main">현재 적용 v{ver}</span>
          <button className="btn pri" data-loading={saving ? 'true' : undefined} disabled={saving} onClick={saveCfg}><i className="ph ph-floppy-disk"></i>새 버전으로 저장하기</button></div>
      </div>
      <div className="two">
        <div className="card">
          <div className="card-h"><div className="t-sub">{TABS.settings[tab]}</div><span className="t-cap">설정 변경은 저장 전까지 적용되지 않습니다</span></div>
          <div className="card-b stack">
            {tab === 0 && (<>
              <div className="field"><label>층고 여유값 (m)</label><input className="inp num" style={{ width: 160 }} value={cfg.margin} onChange={e => setCfg({ ...cfg, margin: e.target.value })} /><span className="t-cap">외벽 높이에 더하는 여유 길이입니다</span></div>
              <div className="field"><label>최소 구간 길이 (m)</label><input className="inp num" style={{ width: 160 }} value={cfg.minLen} onChange={e => setCfg({ ...cfg, minLen: e.target.value })} /><span className="t-cap">이보다 짧은 외벽 선분은 산출에서 제외합니다</span></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><b style={{ fontWeight: 600 }}>개구부 면적 공제</b><div className="t-cap">창호·출입구를 비계 면적에서 뺍니다</div></div>
                <button className={'switch' + (cfg.deduct ? ' on' : '')} role="switch" aria-checked={cfg.deduct} onClick={() => setCfg({ ...cfg, deduct: !cfg.deduct })}></button></div>
            </>)}
            {tab === 1 && (<table className="tbl"><thead><tr><th>내부 높이 구간</th><th>적용 규칙</th><th>비고</th></tr></thead><tbody>
              <tr><td className="num">2.0 m 미만</td><td>DECK 영역만 산입</td><td className="t-cap">소규모 슬래브</td></tr>
              <tr><td className="num">2.0 ~ 3.5 m</td><td>RC·DECK 전체 체적</td><td className="t-cap">표준</td></tr>
              <tr><td className="num">3.5 m 초과</td><td>RC·DECK 전체 + 가산 1.1</td><td className="t-cap">고층고 할증</td></tr></tbody></table>)}
            {tab === 2 && (<>
              <div className="field"><label>시스템비계 (원/㎡)</label><input className="inp num" style={{ width: 200 }} value={cfg.p1} onChange={e => setCfg({ ...cfg, p1: e.target.value })} /></div>
              <div className="field"><label>시스템동바리 RC (원/㎥)</label><input className="inp num" style={{ width: 200 }} value={cfg.p2} onChange={e => setCfg({ ...cfg, p2: e.target.value })} /></div>
              <div className="field"><label>시스템동바리 DECK (원/㎥)</label><input className="inp num" style={{ width: 200 }} value={cfg.p3} onChange={e => setCfg({ ...cfg, p3: e.target.value })} /></div></>)}
            {tab === 3 && (<div className="tl">
              {[['v7', '10.01', '박지수', '층고 여유값 0.30 → 0.40 m'], ['v6', '09.18', '박지수', '개구부 공제 적용 → 미적용'], ['v5', '09.02', '김관리', 'RC 단가 2,100 → 2,250원/㎥']].map((v, i) => (
                <div key={v[0]} className={'tl-i' + (i === 0 ? ' cur' : '')}><span className="tl-d"></span><div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>{v[0]} · {v[3]}</div><div className="t-cap">{v[1]} · {v[2]}</div></div>
                  <button className="link" onClick={() => setCmp(v[0])}>변경 비교</button></div>))}</div>)}
          </div>
        </div>
        <div className="card">
          <div className="card-h"><div className="t-sub">{cmp ? cmp + ' ↔ 현재 편집값' : '이전 버전과 비교'}</div></div>
          <div className="card-b stack">
            {DIFF.map(d => (<div key={d[0]} className="kv"><span>{d[0]}</span><b><span className="diff-old">{d[1]}</span><span className="diff-new">{d[2]}</span></b></div>))}
            <div className="hr"></div>
            <div className="kv"><span>기준 버전 고정</span><b>제출 시점 v 유지</b></div>
            <div className="kv"><span>캐시</span><b>저장 시 즉시 무효화</b></div>
            <div className="t-cap">단위 가격은 견적 검토 보조용이며 최종 견적은 담당자 검토 후 회신됩니다.</div>
          </div>
        </div>
      </div>
    </>
  );

  const sl = slide && rows.find(r => r.id === slide);
  return (
    <div data-archetype="topbar-analytics" className="app">
      <header className="app-header">
        <div className="brand"><span className="brand-mark"><i className="ph ph-ruler"></i></span>가설플로우 관리자</div>
        <button className="project-switcher" onClick={() => say('현재 프로젝트: 물량 산출 운영 환경', 'ph-buildings')}><i className="ph ph-buildings"></i>운영 환경<i className="ph ph-caret-down"></i></button>
        <nav className="global-nav">
          {NAV.map(n => (<button key={n.k} className={'nav-link' + (sec === n.k ? ' active' : '')} onClick={() => setSec(n.k)}><i className={'ph ' + n.i}></i>{n.t}</button>))}
        </nav>
        <div className="header-actions">
          <button className="icon-btn" title="검색" onClick={() => say('Ctrl+K 로 전체 검색을 엽니다', 'ph-magnifying-glass')}><i className="ph ph-magnifying-glass"></i></button>
          <button className="icon-btn" title="알림" onClick={() => say('새 알림 3건이 있습니다', 'ph-bell')}><i className="ph ph-bell"></i><span className="dot"></span></button>
          <span className="avatar">김</span>
        </div>
      </header>
      <nav className="tab-bar">
        {TABS[sec].map((t, i) => (<button key={t} className={'tab' + (tab === i ? ' active' : '')} onClick={() => setTab(i)}>{t}</button>))}
        <span className="grow"></span>
        <span className="meta"><span className="live-dot"></span>마지막 갱신 10:21</span>
      </nav>
      <main className="content" key={sec}>
        {sec === 'main' && Main()}
        {sec === 'drawings' && Drawings()}
        {sec === 'quotes' && Quotes()}
        {sec === 'settings' && Settings()}
      </main>

      {sl && (
        <div className="scrim" onClick={() => setSlide(null)}>
          <div className="slide" onClick={e => e.stopPropagation()}>
            <div className="card-h"><div className="t-sub">{sl.id} · {sl.kind}</div><button className="icon-btn" title="닫기" onClick={() => setSlide(null)}><i className="ph ph-x"></i></button></div>
            <div className="slide-b">
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}><span className={'pill ' + pillOf(sl.st)}>{sl.st}</span><span className="t-cap">{sl.at}</span></div>
              <div><div className="kv"><span>업체</span><b>{CO[sl.co]}</b></div><div className="kv"><span>현장</span><b>{SITE[sl.site]}</b></div>{sl.file && <div className="kv"><span>파일</span><b className="mono">{sl.file}</b></div>}</div>
              {sl.kind === '도면' && <MiniPlan hl={sl.sc > 0} />}
              <div><div className="kv"><span>시스템비계</span><b>{sl.sc ? pad(sl.sc) + ' ㎡' : '산출 전'}</b></div><div className="kv"><span>시스템동바리</span><b>{sl.vo ? pad(sl.vo) + ' ㎥' : '산출 전'}</b></div></div>
              <div className="tl">
                {['업로드 수신', '변환·레이어 분류', '물량 산출', '견적 요청 연결'].map((s, i) => (<div key={s} className={'tl-i' + (i === (sl.st === '변환 완료' ? 2 : sl.st === '변환 실패' ? 1 : 3) ? ' cur' : '')}><span className="tl-d"></span><div style={{ fontWeight: 500 }}>{s}</div></div>))}
              </div>
              {sl.st === '변환 실패' && <div className="t-cap" style={{ color: 'var(--n10)', fontWeight: 600 }}>DWG 헤더를 읽지 못했습니다. 재처리 큐에 올리거나 고객에게 재업로드를 안내해 주세요.</div>}
            </div>
            <div className="card-h" style={{ borderTop: '1px solid var(--n3)', borderBottom: 0, gap: 8 }}>
              <button className="btn out" style={{ flex: 1 }} onClick={() => { setSlide(null); setSec(sl.kind === '도면' ? 'drawings' : 'quotes'); sl.kind === '도면' ? setSelD(sl.id) : setSelQ(sl.id); }}>상세 화면으로 이동하기</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast"><i className={'ph ' + toast.ic}></i>{toast.m}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
