<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 리워드 퀴즈 앱 UI/UX 리뉴얼·온보딩 재설계 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 215°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#edf5ff;
  --m100:#dbeaff;
  --m200:#b8d6ff;
  --m300:#8cbcff;
  --m400:#5ca0ff;
  --m500:#2e86ff;
  --m600:#006bff;
  --m700:#0058d1;
  --m800:#0044a3;
  --m900:#003073;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f8f9fb;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#909398;
  --n7:#71757a;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=floating theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rewardUp{0%{opacity:0;transform:translateY(10px)}25%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}

/* topnav */
.topnav{position:sticky;top:0;z-index:20;height:68px;background:var(--n1);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:32px;padding:0 40px;width:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--n10);color:var(--n0);display:grid;place-items:center;font-size:18px}
.tabs{display:flex;gap:4px;flex:1}
.tab{height:40px;padding:0 16px;border-radius:999px;color:var(--n7);font-weight:600;display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab:hover{background:var(--n2);color:var(--n9)}
.tab.on{background:var(--m50);color:var(--m700)}
.nav-actions{display:flex;gap:8px}
.btn{height:44px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s}
.btn-primary{background:var(--m600);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--m600) 24%,transparent)}
.btn-primary:hover{background:var(--m700)}
.btn-ghost{background:var(--n1);border:1px solid var(--n4);color:var(--n9)}
.btn-ghost:hover{background:var(--n2)}
.btn-sm{height:36px;padding:0 14px;font-size:12px;border-radius:10px}

/* page */
.page{width:100%;max-width:1240px;margin:0 auto;padding:36px 40px 56px;flex:1}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--n7);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eyebrow i{font-size:16px}
.display{font-size:44px;line-height:1.2;font-weight:700;letter-spacing:-1.2px;color:var(--n10)}
.sub{margin-top:12px;color:var(--n7);font-size:16px;max-width:560px}
.card{background:var(--n1);border-radius:24px;box-shadow:0 1px 2px rgba(30,30,32,.04),0 12px 32px rgba(30,30,32,.07)}
.label{font-size:12px;font-weight:700;color:var(--n7);letter-spacing:.3px}

/* wizard */
.wizard{display:grid;grid-template-columns:232px minmax(0,1fr) 312px;gap:24px;align-items:start}
.stepper{padding:24px 20px}
.step{display:flex;gap:14px;position:relative;padding-bottom:26px;width:100%;text-align:left}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--n3)}
.step.done:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--n10);transform-origin:top;animation:barGrow .5s ease both;transform:scaleY(1)}
.dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--n2);color:var(--n7);z-index:1}
.step.on .dot{background:var(--m600);color:#fff;animation:pop .4s ease}
.step.done .dot{background:var(--n10);color:var(--n0)}
.step b{display:block;font-size:14px;color:var(--n9)}
.step span.s{font-size:12px;color:var(--n7)}
.step.lock{opacity:.5;cursor:not-allowed}
.body{padding:36px 40px;min-height:540px;display:flex;flex-direction:column}
.body-in{flex:1;animation:fadeUp .45s ease both}
.step-no{font-size:12px;font-weight:700;color:var(--n7);margin-bottom:8px}
.h2{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.6px;color:var(--n10)}
.p{margin-top:10px;color:var(--n7);font-size:16px}
.art{height:176px;border-radius:20px;background:var(--n2);margin:24px 0;position:relative;overflow:hidden}
.art .blob{position:absolute;border-radius:40% 60% 55% 45%;background:var(--n3)}
.art .blob.b2{background:var(--n4)}
.art .card-mini{position:absolute;background:var(--n1);border-radius:16px;box-shadow:0 8px 20px rgba(30,30,32,.1);padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700}
.art .card-mini i{font-size:22px;color:var(--n8)}
.art .card-mini.c1{left:14%;top:26px;animation:floaty 5s ease-in-out infinite}
.art .card-mini.c2{right:12%;bottom:24px;animation:floaty 6s ease-in-out infinite .8s}
.art .card-mini .pt{color:var(--m600)}
.points{display:grid;gap:12px}
.point{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--n0)}
.point i{font-size:22px;color:var(--n8)}
.point b{display:block}
.point small{color:var(--n7);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--n4);font-weight:600;color:var(--n8);display:inline-flex;align-items:center;gap:8px;background:var(--n1);transition:all .2s}
.chip:hover{background:var(--n2)}
.chip.on{background:var(--n10);border-color:var(--n10);color:var(--n0);animation:pop .3s ease}
.seg{display:inline-flex;background:var(--n2);border-radius:14px;padding:4px;margin-top:10px}
.seg button{height:40px;padding:0 20px;border-radius:10px;font-weight:600;color:var(--n7)}
.seg button.on{background:var(--n1);color:var(--n10);box-shadow:0 2px 6px rgba(30,30,32,.1)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt2{padding:18px;border-radius:16px;border:1.5px solid var(--n4);text-align:left;font-weight:600;background:var(--n1);transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.opt2:hover{background:var(--n2)}
.opt2.pick{border-color:var(--n10)}
.opt2.ok{background:var(--s1-bg);border-color:var(--s1);color:var(--s1-text)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--n3)}
.link{color:var(--n7);font-weight:600;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 8px}
.link:hover{color:var(--n10)}
.side{padding:24px;display:grid;gap:20px}
.kv{display:grid;gap:12px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span{color:var(--n7)}
.kv b{text-align:right;max-width:170px}
.bar{height:8px;border-radius:99px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m600);border-radius:99px;transform-origin:left;animation:barGrow .6s ease both;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--n2);font-size:12px;font-weight:700;color:var(--n8)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
pre.code{background:var(--n10);color:var(--n2);border-radius:14px;padding:14px 16px;font-size:12px;line-height:1.6;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* stage with phone */
.stage{display:grid;grid-template-columns:300px 392px minmax(0,1fr);gap:32px;align-items:start;justify-content:center}
.panel{padding:24px;display:grid;gap:14px}
.panel h3{font-size:16px;font-weight:700;color:var(--n10)}
.hrow{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--n0);width:100%;text-align:left;align-items:flex-start;transition:background .2s,box-shadow .2s}
.hrow:hover{background:var(--n2)}
.hrow.on{background:var(--n1);box-shadow:inset 0 0 0 1.5px var(--n10)}
.hrow i{font-size:20px;color:var(--n8);margin-top:2px}
.hrow b{display:block;font-size:14px}
.hrow small{font-size:12px;color:var(--n7)}
.ac{display:grid;gap:10px}
.ac li{display:flex;gap:10px;font-size:14px;color:var(--n8)}
.ac i{color:var(--n7);font-size:16px;margin-top:3px}
.phone{width:376px;height:756px;border-radius:52px;background:var(--n10);padding:10px;margin:0 auto;box-shadow:0 24px 48px rgba(30,30,32,.18)}
.screen{width:100%;height:100%;border-radius:42px;background:var(--n0);overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:44px;padding:14px 26px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;flex:none}
.sbar .ico{display:flex;gap:6px;font-size:14px}
.scroll{flex:1;overflow:hidden;padding:8px 20px 16px;display:flex;flex-direction:column;gap:14px}
.tabbar{height:72px;flex:none;background:var(--n1);border-top:1px solid var(--n3);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--n6);font-weight:600;height:52px}
.tabbar button i{font-size:22px}
.tabbar button.on{color:var(--n10)}
.sec{border-radius:20px;transition:box-shadow .25s}
.sec.hl{box-shadow:0 0 0 2px var(--m600),0 0 0 6px color-mix(in srgb,var(--m600) 14%,transparent)}
.reward{background:var(--n10);color:var(--n0);border-radius:20px;padding:18px}
.reward small{font-size:12px;color:var(--n5)}
.reward .amt{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
.spark{display:flex;align-items:flex-end;gap:5px;height:34px}
.spark i{flex:1;background:var(--n7);border-radius:4px;transform-origin:bottom;animation:barGrow .7s ease both}
.spark i:last-child{background:var(--n0)}
.cont{background:var(--n1);border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(30,30,32,.06)}
.cont .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--n1);width:100%;text-align:left;transition:background .2s}
.q-row:hover{background:var(--n2)}
.q-ico{width:38px;height:38px;border-radius:12px;background:var(--n2);display:grid;place-items:center;font-size:20px;color:var(--n8);flex:none}
.q-row b{display:block;font-size:14px}
.q-row small{font-size:12px;color:var(--n7)}
.q-row .pt{margin-left:auto;font-weight:700;font-size:12px}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--n2) 0,var(--n3) 120px,var(--n2) 240px);background-size:480px 100%;animation:shimmer 1.2s linear infinite}
.week{display:flex;justify-content:space-between;align-items:flex-end;height:64px;padding:0 6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--n7)}
.week i{display:block;width:20px;border-radius:6px;background:var(--n3);transform-origin:bottom;animation:barGrow .6s ease both}
.week div.t i{background:var(--m600)}

/* ad slot */
.slot{height:96px;border-radius:18px;background:var(--n1);border:1px dashed var(--n4);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .3s}
.slot .tag{position:absolute;left:10px;top:8px;font-size:10px;font-weight:700;color:var(--n7);background:var(--n2);border-radius:6px;padding:1px 6px}
.slot.collapsed{height:36px}
.ad-art{width:100%;height:100%;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 16px;background:var(--n2);animation:fadeUp .4s ease both}
.ad-art .sq{width:64px;height:64px;border-radius:16px;background:var(--n10);color:var(--n0);display:grid;place-items:center;font-size:26px;flex:none}
.ad-art b{display:block;font-size:14px}
.ad-art small{font-size:12px;color:var(--n7)}
.slot-msg{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--n7);font-size:12px;text-align:center}
.slot-msg i{font-size:22px}
.hint{font-size:12px;color:var(--n7)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qhead i.x{font-size:22px;color:var(--n7)}
.qtext{font-size:20px;line-height:1.4;font-weight:700;letter-spacing:-.4px;color:var(--n10);margin:6px 0 4px}
.qopt{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:var(--n1);border:1.5px solid var(--n3);width:100%;text-align:left;font-weight:600;transition:all .18s;position:relative}
.qopt:hover{background:var(--n2)}
.qopt .k{width:26px;height:26px;border-radius:50%;background:var(--n2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.qopt.pick{border-color:var(--n10);animation:pop .28s ease}
.qopt.pick .k{background:var(--n10);color:var(--n0)}
.qopt.ok{background:var(--s1-bg);border-color:var(--s1);color:var(--s1-text)}
.qopt.ok .k{background:var(--s1);color:#fff}
.qopt.bad{background:var(--s2-bg);border-color:var(--s2);color:var(--s2-text)}
.qopt.bad .k{background:var(--s2);color:#fff}
.qopt i.r{margin-left:auto;font-size:20px}
.reward-toast{position:absolute;left:50%;top:210px;margin-left:-40px;width:80px;text-align:center;font-weight:700;color:var(--s1-text);animation:rewardUp 1.4s ease both;pointer-events:none}
.fsm{display:grid;gap:8px}
.fsm div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--n0);font-weight:600;color:var(--n7);transition:all .25s}
.fsm div.on{background:var(--n10);color:var(--n0)}
.fsm div i{font-size:18px}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px;animation:fadeUp .45s ease both}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--n10) calc(var(--v)*1%),var(--n3) 0);display:grid;place-items:center}
.ring span{width:104px;height:104px;border-radius:50%;background:var(--n0);display:grid;place-items:center;font-size:28px;font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,30,32,.36);z-index:40;animation:fadeUp .2s ease both}
.drawer{position:fixed;right:0;top:0;bottom:0;width:460px;max-width:100%;background:var(--n1);z-index:41;padding:28px;overflow:auto;box-shadow:-16px 0 48px rgba(30,30,32,.18);animation:fadeUp .3s ease both}
.drawer h3{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.drawer ul.b{display:grid;gap:10px;margin:14px 0 22px}
.drawer ul.b li{display:flex;gap:10px;color:var(--n8)}
.drawer ul.b i{color:var(--n7);margin-top:4px;font-size:16px}
.hl-box{background:var(--n2);border-radius:16px;padding:16px;margin-bottom:22px;color:var(--n9)}
footer{padding:20px 40px;color:var(--n7);font-size:12px;border-top:1px solid var(--n3);text-align:center;background:var(--n1)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TABS = [
  { id: 'main', label: '온보딩 플로우 재설계', icon: 'ph-path' },
  { id: 'home', label: '홈 화면 UI 개선', icon: 'ph-house' },
  { id: 'quiz', label: '퀴즈 풀이 화면 UI 개선', icon: 'ph-question' },
  { id: 'ad', label: '광고 노출 영역 UX 개선', icon: 'ph-megaphone' },
];

const NOTES = {
  main: {

            </div>
            <div className={'sec' + (hl === 'today' ? ' hl' : '')} style={{ display: 'grid', gap: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between' }}><b>오늘의 퀴즈</b><span className="hint">3개</span></div>
              {sk && loading ? [0, 1, 2].map(i => <div key={i} className="skel" style={{ height: 62 }}></div>) : rows.map(([ic, t, d, p]) => (
                <button key={t} className="q-row" onClick={() => goTab('quiz')}><span className="q-ico"><i className={'ph ' + ic}></i></span><span><b>{t}</b><small>{d}</small></span><span className="pt">{p}</span></button>
              ))}
            </div>
            <div className={'sec' + (hl === 'ad' ? ' hl' : '')}>
              <AdSlot where="home" state={sk && loading ? 'loading' : adState} onRetry={() => setAdState('ok')} />
            </div>
          </div>
        </Phone>

        <aside style={{ display: 'grid', gap: 20 }}>
          <div className="card panel">
            <h3>상태 전환 미리보기</h3>
            <div className="seg" style={{ width: '100%', marginTop: 0 }}>
              {[['content', '콘텐츠'], ['skeleton', '스켈레톤'], ['none', '이어 풀기 없음']].map(([id, t]) => <button key={id} className={mode === id ? 'on' : ''} style={{ flex: 1, padding: 0 }} onClick={() => setMode(id)}>{t}</button>)}
            </div>
            <p className="hint">스켈레톤은 약 1.6초 뒤 콘텐츠로 바뀝니다. 새로고침 아이콘을 눌러도 같은 흐름을 볼 수 있어요.</p>
          </div>
          <div className="card panel">
            <h3>이 화면의 수용 기준</h3>
            <ul className="ac">
              <li><i className="ph ph-check-circle"></i>홈 첫 화면에서 오늘의 퀴즈와 보유 리워드를 스크롤 없이 확인할 수 있다</li>
              <li><i className="ph ph-check-circle"></i>데이터 로딩 중에는 각 섹션이 스켈레톤으로 표시된다</li>
              <li><i className="ph ph-check-circle"></i>풀던 퀴즈가 있으면 이어 풀기 카드가 최상단 섹션에 노출된다</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ---------- 퀴즈 ---------- */
function Quiz({ openNote, goTab }) {
  const [i, setI] = useState(0);
  const [sel, setSel] = useState(null);
  const [phase, setPhase] = useState('idle');
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [toastKey, setToastKey] = useState(0);
  const q = QUESTIONS[i];
  const pick = n => { if (phase === 'idle' || phase === 'selected') { setSel(n); setPhase('selected'); } };
  const confirm = () => { if (phase !== 'selected') return; setPhase('confirmed'); if (sel === q.a) { setScore(s => s + 1); setToastKey(k => k + 1); } };
  const next = () => { if (i < QUESTIONS.length - 1) { setI(i + 1); setSel(null); setPhase('idle'); } else { setDone(true); setPhase('result'); } };
  const reset = () => { setI(0); setSel(null); setPhase('idle'); setScore(0); setDone(false); };
  const states = [['idle', '대기', 'ph-circle'], ['selected', '선택', 'ph-hand-tap'], ['confirmed', '확정', 'ph-seal-check'], ['result', '결과', 'ph-flag-checkered']];
  return (
    <div className="page">
      <div className="hero">
        <div>
          <div className="eyebrow"><i className="ph ph-question"></i>QUIZ SCREEN</div>
          <h1 className="display">누르는 순간 달라지는<br />선택지와 정답 피드백</h1>
          <p className="sub">문항 상태를 대기·선택·확정·결과 네 단계로 정의하고, 각 단계마다 눌림·표시·보상 안내가 같은 규칙으로 나오게 합니다.</p>
        </div>
        <div className="nav-actions">
          <button className="btn btn-ghost" onClick={reset}><i className="ph ph-arrow-counter-clockwise"></i>처음부터</button>
          <button className="btn btn-ghost" onClick={() => openNote('quiz')}><i className="ph ph-note-pencil"></i>구현 메모</button>
        </div>
      </div>
      <div className="stage">
        <aside className="card panel">
          <h3>문항 상태 머신</h3>
          <div className="fsm">{states.map(([id, t, ic]) => <div key={id} className={phase === id ? 'on' : ''}><i className={'ph ' + ic}></i>{t}</div>)}</div>
          <p className="hint">선택지를 누르면 선택, 정답 확인을 누르면 확정, 마지막 문항 뒤에는 결과 상태가 됩니다.</p>
        </aside>

        <Phone>
          {!done ? (
            <div className="scroll" style={{ position: 'relative' }}>
              <div className="qhead"><i className="ph ph-x x"></i><div className="bar"><i style={{ width: ((i + (phase === 'confirmed' ? 1 : 0)) / QUESTIONS.length * 100) + '%' }}></i></div><span className="hint num">{i + 1}/{QUESTIONS.length}</span></div>
              <div className="label" style={{ marginTop: 10 }}>{i === 0 ? '경제 용어' : i === 1 ? '영어 단어' : '한국사'}</div>
              <div className="qtext" key={i} style={{ animation: 'fadeUp .4s ease both' }}>{q.q}</div>
              <div style={{ display: 'grid', gap: 10, marginTop: 8 }}>
                {q.o.map((o, n) => {
                  let c = 'qopt';
                  if (phase === 'confirmed') { if (n === q.a) c += ' ok'; else if (n === sel) c += ' bad'; }
                  else if (n === sel) c += ' pick';
                  return (
                    <button key={o} className={c} onClick={() => pick(n)} aria-label={'선택지 ' + (n + 1) + ' ' + o}>
                      <span className="k">{'ABCD'[n]}</span>{o}
                      {phase === 'confirmed' && n === q.a && <i className="ph ph-check-circle r"></i>}
                      {phase === 'confirmed' && n === sel && n !== q.a && <i className="ph ph-x-circle r"></i>}
                    </button>
                  );
                })}
              </div>
              {phase === 'confirmed' && sel === q.a && <div className="reward-toast" key={toastKey}>+30P</div>}
              <div style={{ marginTop: 'auto' }}>
                {phase === 'confirmed' && <p className="hint" style={{ marginBottom: 10, color: sel === q.a ? 'var(--s1-text)' : 'var(--s2-text)' }}>{sel === q.a ? '정답이에요. 리워드 30P가 적립돼요.' : '아쉬워요. 정답은 ' + 'ABCD'[q.a] + '번이에요.'}</p>}
                {phase !== 'confirmed'
                  ? <button className="btn btn-primary" style={{ width: '100%' }} disabled={phase !== 'selected'} onClick={confirm}>정답 확인</button>
                  : <button className="btn btn-primary" style={{ width: '100%' }} onClick={next}>{i < QUESTIONS.length - 1 ? '다음 문제' : '결과 보기'}</button>}
                <div style={{ marginTop: 10 }}><AdSlot where="quiz" state="ok" collapsed /></div>
              </div>
            </div>
          ) : (
            <div className="scroll">
              <div className="result">
                <div className="ring" style={{ '--v': score / QUESTIONS.length * 100 }}><span className="num">{score}/{QUESTIONS.length}</span></div>
                <div className="h2" style={{ fontSize: 20 }}>첫 퀴즈를 마쳤어요</div>
                <p className="hint">맞힌 문제 {score}개 · 획득 리워드 {score * 30}P</p>
                <div className="cont" style={{ width: '100%', marginTop: 12 }}>
                  <div className="row"><b>풀이 요약</b><span className="hint">3문제</span></div>
                  {QUESTIONS.map((x, n) => <div key={n} className="hint" style={{ padding: '6px 0', display: 'flex', gap: 8 }}><i className="ph ph-dot-outline"></i>{x.q.slice(0, 20)}…</div>)}
                </div>
                <button className="btn btn-primary" style={{ width: '100%', marginTop: 8 }} onClick={() => goTab('home')}>홈으로 가기</button>
                <button className="btn btn-ghost" style={{ width: '100%' }} onClick={reset}>다음 퀴즈 이어서 풀기</button>
              </div>
            </div>
          )}
        </Phone>

        <aside style={{ display: 'grid', gap: 20 }}>
          <div className="card panel">
            <h3>피드백 규칙</h3>
            <ul className="ac">
              <li><i className="ph ph-hand-tap"></i>눌림: 0.98배 축소 후 선택 표시로 전환</li>
              <li><i className="ph ph-check-circle"></i>정답: 초록 면과 체크 아이콘, 보상 문구가 위로 떠오름</li>
              <li><i className="ph ph-x-circle"></i>오답: 선택지는 빨강, 정답 선택지를 함께 표시</li>
              <li><i className="ph ph-vibrate"></i>햅틱: 정답과 오답에 서로 다른 진동 패턴 적용 설계</li>
            </ul>
          </div>
          <div className="card panel">
            <h3>이 화면의 수용 기준</h3>
            <ul className="ac">
              <li><i className="ph ph-check-circle"></i>선택지를 누르면 선택 상태가 즉시 시각적으로 구분된다</li>
              <li><i className="ph ph-check-circle"></i>정답 확정 시 피드백과 획득 리워드가 같은 화면에서 표시된다</li>
              <li><i className="ph ph-check-circle"></i>결과 화면에서 풀이 요약과 다음 퀴즈 버튼이 제공된다</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ---------- 광고 ---------- */
function Ad({ openNote, goTab }) {
  const [state, setState] = useState('loading');
  const [collapsed, setCollapsed] = useState(false);
  useEffect(() => { if (state === 'loading') { const t = setTimeout(() => setState('ok'), 1800); return () => clearTimeout(t); } }, [state]);
  const sts = [['loading', '로딩'], ['ok', '노출'], ['empty', '빈 응답'], ['fail', '불러오기 실패']];
  const cfg = '{\n  "home": { "after": "todayQuiz", "height": 96 },\n  "quizResult": { "position": "bottom", "height": 96 },\n  "quizPlaying": { "position": "belowOptions", "collapsible": true },\n  "onEmpty": "' + (collapsed ? 'collapse' : 'placeholder') + '",\n  "onError": "retryButton"\n}';
  return (
    <div className="page">
      <div className="hero">
        <div>
          <div className="eyebrow"><i className="ph ph-megaphone"></i>AD SLOT UX</div>
          <h1 className="display">광고가 늦게 와도<br />화면은 흔들리지 않게</h1>
          <p className="sub">기존 광고 SDK 호출부는 그대로 두고, 슬롯을 감싸는 UI 래퍼에서 로딩·빈 응답·실패 상태를 같은 높이로 처리합니다.</p>
        </div>
        <button className="btn btn-ghost" onClick={() => openNote('ad')}><i className="ph ph-note-pencil"></i>구현 메모</button>
      </div>
      <div className="stage">
        <aside className="card panel">
          <h3>슬롯 상태</h3>
          {sts.map(([id, t]) => <button key={id} className={'hrow' + (state === id ? ' on' : '')} onClick={() => setState(id)}><i className={'ph ' + ({ loading: 'ph-spinner-gap', ok: 'ph-image', empty: 'ph-tray', fail: 'ph-wifi-slash' }[id])}></i><span><b>{t}</b><small>{{ loading: '자리표시로 높이 유지', ok: '소재가 같은 높이로 표시', empty: '대체 안내 또는 접힘', fail: '재시도 버튼 제공' }[id]}</small></span></button>)}
          <div className="label" style={{ marginTop: 6 }}>빈 응답 처리 방식</div>
          <div className="seg" style={{ marginTop: 0 }}><button className={!collapsed ? 'on' : ''} onClick={() => setCollapsed(false)}>대체 안내</button><button className={collapsed ? 'on' : ''} onClick={() => setCollapsed(true)}>접기</button></div>
        </aside>

        <Phone tab={0} tabbar={i => { if (i === 1) goTab('quiz'); }}>
          <div className="scroll">
            <b style={{ fontSize: 20, letterSpacing: '-.3px' }}>오늘의 퀴즈</b>
            <div className="q-row" style={{ cursor: 'default' }}><span className="q-ico"><i className="ph ph-translate"></i></span><span><b>영어 단어 · 일상 표현</b><small>3분 · 5문제</small></span><span className="pt">+30P</span></div>
            <AdSlot where="home" state={state} collapsed={collapsed} onRetry={() => setState('loading')} />
            <div className="q-row" style={{ cursor: 'default' }}><span className="q-ico"><i className="ph ph-coins"></i></span><span><b>경제 용어 · 금리와 이자</b><small>4분 · 5문제</small></span><span className="pt">+40P</span></div>
            <div className="q-row" style={{ cursor: 'default' }}><span className="q-ico"><i className="ph ph-bank"></i></span><span><b>한국사 · 조선 전기</b><small>3분 · 4문제</small></span><span className="pt">+30P</span></div>
          </div>
        </Phone>

        <aside style={{ display: 'grid', gap: 20 }}>
          <div className="card panel">
            <h3>슬롯 배치 설정</h3>
            <pre className="code">{cfg}</pre>
            <p className="hint">배치 위치와 빈 응답 처리를 설정 객체로 분리해 화면별 실험이 가능한 구조를 제안합니다.</p>
          </div>
          <div className="card panel">
            <h3>이 화면의 수용 기준</h3>
            <ul className="ac">
              <li><i className="ph ph-check-circle"></i>광고가 로딩되는 동안 슬롯 높이가 유지되어 주변 콘텐츠가 밀리지 않는다</li>
              <li><i className="ph ph-check-circle"></i>광고가 비어 있거나 실패하면 대체 안내 영역 또는 접힌 상태가 표시된다</li>
              <li><i className="ph ph-check-circle"></i>퀴즈 풀이 중에는 선택지 영역을 가리지 않는 위치에만 슬롯이 배치된다</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('main');
  const [note, setNote] = useState(null);
  const goTab = t => { setTab(t); window.scrollTo(0, 0); };
  return (
    <div className="app" data-layout="topnav-hero">
      <header className="topnav">
        <div className="brand"><span className="brand-mark"><i className="ph ph-graduation-cap"></i></span>퀴즈포인트 <span className="pill">데모</span></div>
        <nav className="tabs">
          {TABS.map(t => <button key={t.id} className={'tab' + (tab === t.id ? ' on' : '')} onClick={() => goTab(t.id)}>{t.label}</button>)}
        </nav>
      </header>
      {tab === 'main' && <Onboarding goQuiz={() => goTab('quiz')} openNote={setNote} />}
      {tab === 'home' && <Home openNote={setNote} goTab={goTab} />}
      {tab === 'quiz' && <Quiz openNote={setNote} goTab={goTab} />}
      {tab === 'ad' && <Ad openNote={setNote} goTab={goTab} />}
      <footer>© 샘플 학습 앱 — 자체 개발 프로젝트 · 화면의 모든 데이터는 예시입니다</footer>
      {note && (<>
        <div className="scrim" onClick={() => setNote(null)}></div>
        <aside className="drawer">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div><div className="label">구현 메모</div><h3>{NOTES[note].title}</h3></div>
            <button className="btn btn-ghost btn-sm" onClick={() => setNote(null)}><i className="ph ph-x"></i>닫기</button>
          </div>
          <ul className="b">{NOTES[note].bullets.map(b => <li key={b}><i className="ph ph-check"></i>{b}</li>)}</ul>
          <div className="hl-box"><div className="label" style={{ marginBottom: 6 }}>핵심 설계</div>{NOTES[note].highlight}</div>
          <button className="btn btn-primary" style={{ width: '100%' }} onClick={() => setNote(null)}>확인</button>
        </aside>
      </>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
