<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 리워드 앱 화면 설계 스튜디오·온보딩 진행 보드 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 22°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fff4ed;
  --m100:#fee8db;
  --m200:#fed2b8;
  --m300:#fdb68c;
  --m400:#fc975c;
  --m500:#fb7a2e;
  --m600:#fa5d00;
  --m700:#cd4c00;
  --m800:#a03c00;
  --m900:#712a00;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fff8f1;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab7b5;
  --n6:#989390;
  --n7:#7a7471;
  --n8:#615f5c;
  --n9:#3a3836;
  --n10:#1d1e1c;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
}
/* ⚠ s3(경고/주의) — 메인 hue 22°와 16° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100vh}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:13px;color:var(--n9)}
ul{list-style:none}
table{border-collapse:collapse;width:100%}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:16px;height:16px;stroke-width:1.75}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sheen{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes drop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

.shell{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:16px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:14px}
.logo .mk{width:28px;height:28px;border-radius:6px;background:var(--n10);color:var(--n0);display:grid;place-items:center}
.logo .mk svg{width:15px;height:15px}
.grp{font-size:11px;font-weight:700;color:var(--n6);letter-spacing:.5px;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;color:var(--n8);font-weight:500;width:100%;text-align:left;border-left:2px solid transparent}
.nav:hover{background:var(--n2)}
.nav.on{background:var(--n0);color:var(--n10);font-weight:700;border-left-color:var(--m600)}
.nav.on .ic{color:var(--m600)}
.side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--n3);font-size:11px;color:var(--n7)}
.main-wrap{margin-left:232px;flex:1;min-width:0;width:calc(100% - 232px);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 28px 14px;border-bottom:1px solid var(--n3);background:var(--n0)}
.crumb{font-size:12px;color:var(--n7);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.crumb svg{width:12px;height:12px}
.title{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.8px;color:var(--n10)}
.actions{display:flex;gap:8px;align-items:center}
.btn{height:32px;padding:0 12px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--n4);background:var(--n1);color:var(--n9);transition:background .15s}
.btn:hover{background:var(--n2)}
.btn.pri{background:var(--m600);border-color:var(--m600);color:#fff}
.btn.pri:hover{background:var(--m700)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.content{padding:18px 28px 32px;flex:1}
.box{background:var(--n1);border:1px solid var(--n3);border-radius:6px}
.box-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--n3);font-weight:700;font-size:13px}
.lbl{font-size:11px;font-weight:700;color:var(--n7);letter-spacing:.3px;margin-bottom:6px;display:block}
.seg{display:inline-flex;border:1px solid var(--n4);border-radius:6px;overflow:hidden;background:var(--n1)}
.seg button{height:28px;padding:0 12px;font-weight:600;color:var(--n7);border-right:1px solid var(--n4)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--n10);color:var(--n0)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font-size:11px;font-weight:700;background:var(--n2);color:var(--n8)}
.tag.ok{background:var(--s1-bg);color:var(--s1-text)}
.tag.bad{background:var(--s2-bg);color:var(--s2-text)}
input[type=text],select{height:30px;border:1px solid var(--n4);border-radius:6px;padding:0 8px;background:var(--n1);width:100%}
input[type=range]{width:100%;accent-color:var(--m600)}
input[type=checkbox]{accent-color:var(--m600)}

/* editor */
.editor{display:grid;grid-template-columns:236px minmax(0,1fr) 272px;gap:14px;align-items:start}
.layer{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;width:100%;text-align:left;border-left:2px solid transparent;color:var(--n8)}
.layer:hover{background:var(--n0)}
.layer.on{background:var(--n0);border-left-color:var(--m600);color:var(--n10);font-weight:700}
.layer .eye{margin-left:auto;color:var(--n6)}
.layer.hid{opacity:.5}
.canvas{background:var(--n2);background-image:radial-gradient(var(--n4) 1px,transparent 1px);background-size:16px 16px;min-height:640px;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;border-radius:0 0 6px 6px}
.phone{width:330px;background:var(--n1);border-radius:30px;border:6px solid var(--n10);padding:14px 14px 18px;min-height:590px;display:flex;flex-direction:column;gap:10px;animation:rise .35s ease both}
.el{position:relative;cursor:pointer;transition:box-shadow .15s}
.el:hover{box-shadow:0 0 0 1px var(--n5)}
.el.sel{box-shadow:0 0 0 2px var(--m600)}
.el.sel::before{content:attr(data-name);position:absolute;left:-2px;top:-19px;font-size:10px;font-weight:700;background:var(--m600);color:#fff;padding:1px 6px;border-radius:4px 4px 0 0;z-index:2}
.el.hid{display:none}
.el .t1{font-weight:700;letter-spacing:-.2px}
.el .t2{font-size:12px;opacity:.7}
.row-i{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--n3)}
.row-i:first-child{border-top:0}
.dotb{width:30px;height:30px;border-radius:8px;background:var(--n2);display:grid;place-items:center;color:var(--n8)}
.hist{display:flex;gap:6px;align-items:center;color:var(--n7);font-size:12px}
.field{margin-bottom:14px}

/* tokens */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tr{display:grid;grid-template-columns:150px 1fr 120px 70px;align-items:center;gap:10px;height:40px;padding:0 14px;border-top:1px solid var(--n3);width:100%;text-align:left}
.tr:hover{background:var(--n0)}
.tr.on{background:var(--n0);box-shadow:inset 2px 0 0 var(--m600)}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid var(--n4);display:inline-block;vertical-align:middle;margin-right:8px}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diff div{border:1px solid var(--n3);border-radius:6px;padding:10px}
.diff .new{border-color:var(--m600)}

/* funnel */
.fgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.frow{display:grid;grid-template-columns:132px 1fr 64px 64px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--n3);width:100%;text-align:left}
.frow:hover{background:var(--n0)}
.frow.on{background:var(--n0);box-shadow:inset 2px 0 0 var(--m600)}
.fbar{height:12px;background:var(--n2);border-radius:3px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--n9);transform-origin:left;animation:grow .6s ease both;transition:width .4s}
.frow.on .fbar i{background:var(--m600)}
.th{font-size:11px;font-weight:700;color:var(--n7)}
td,th{padding:8px 14px;text-align:left;border-top:1px solid var(--n3);font-size:13px}
th{font-size:11px;color:var(--n7);font-weight:700;background:var(--n0)}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}

/* report */
.rgrid{display:grid;grid-template-columns:280px minmax(0,1fr) 280px;gap:14px;align-items:start}
.chk{display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;border-top:1px solid var(--n3);width:100%;text-align:left}
.chk:first-of-type{border-top:0}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--n5);display:grid;place-items:center;color:#fff}
.cb svg{width:11px;height:11px;stroke-width:3}
.cb.on{background:var(--n10);border-color:var(--n10)}
.doc{background:var(--n1);border:1px solid var(--n3);border-radius:4px;padding:34px 40px;min-height:520px;box-shadow:0 8px 24px rgba(30,30,32,.06);animation:rise .35s ease both}
.doc h4{font-size:20px;letter-spacing:-.4px;margin-bottom:4px}
.doc .toc li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--n4)}
.skl{height:10px;border-radius:3px;margin:8px 0;background:linear-gradient(90deg,var(--n2) 0,var(--n3) 100px,var(--n2) 200px);background-size:400px 100%;animation:sheen 1.2s linear infinite}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--m600);animation:blink 1s ease infinite;display:inline-block}

/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(29,30,28,.4);display:flex;align-items:center;justify-content:center;z-index:50;animation:rise .2s ease both}
.modal{width:480px;max-width:92vw;background:var(--n1);border-radius:8px;border:1px solid var(--n3);box-shadow:0 24px 64px rgba(29,30,28,.25);animation:drop .25s ease both}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--n3);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--n3);display:flex;justify-content:flex-end;gap:8px}
pre.code{background:var(--n10);color:var(--n2);border-radius:6px;padding:12px;font-size:12px;line-height:1.6;max-height:260px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n0);padding:10px 16px;border-radius:6px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:60;animation:rise .25s ease both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useIcons() { useEffect(() => { lucide.createIcons(); }); }
function I({ n }) { return <span className="ic" dangerouslySetInnerHTML={{ __html: '<i data-lucide="' + n + '"></i>' }}></span>; }

const NAV = [
  { id: 'main', label: '화면 구성 캔버스 편집기', icon: 'layout-template' },
  { id: 'tokens', label: '디자인 토큰 관리', icon: 'palette' },
  { id: 'funnel', label: '온보딩 진행 현황 보드', icon: 'activity' },
  { id: 'report', label: '화면 설계서·결과보고서 생성', icon: 'file-text' },
];

const BGS = [['n1', '흰색 표면'], ['n2', '연한 회색'], ['n10', '짙은 회색'], ['m600', '메인색'], ['m50', '연한 메인']];
const onDark = bg => bg === 'n10' || bg === 'm600';

const SCREENS = {
  home: { name: '홈', els: [
    { id: 'h1', type: 'head', name: '인사 헤더', text: '김민지님, 오늘도 한 문제부터', bg: 'n1', radius: 0, pad: 4, vis: true },
    { id: 'h2', type: 'card', name: '리워드 카드', text: '보유 리워드 12,480 P', bg: 'n10', radius: 14, pad: 16, vis: true },
    { id: 'h3', type: 'btn', name: '이어 풀기 버튼', text: '이어 풀기', bg: 'm600', radius: 10, pad: 12, vis: true },
    { id: 'h4', type: 'list', name: '오늘의 퀴즈 목록', text: '오늘의 퀴즈', bg: 'n2', radius: 12, pad: 12, vis: true },
    { id: 'h5', type: 'ad', name: '광고 슬롯', text: '광고 슬롯 · 높이 96 고정', bg: 'n2', radius: 12, pad: 12, vis: true },
  ] },
  onb: { name: '온보딩', els: [
    { id: 'o1', type: 'head', name: '스텝 표시', text: '2 / 4 단계 · 관심사 선택', bg: 'n1', radius: 0, pad: 4, vis: true },
    { id: 'o2', type: 'card', name: '안내 카드', text: '어떤 분야가 궁금하세요?', bg: 'n2', radius: 14, pad: 18, vis: true },
    { id: 'o3', type: 'list', name: '관심사 목록', text: '관심사 선택', bg: 'n1', radius: 12, pad: 12, vis: true },
    { id: 'o4', type: 'btn', name: '다음 버튼', text: '다음', bg: 'm600', radius: 10, pad: 12, vis: true },
  ] },
  quiz: { name: '퀴즈', els: [
    { id: 'q1', type: 'head', name: '진행 헤더', text: '3 / 10 · 경제 용어', bg: 'n1', radius: 0, pad: 4, vis: true },
    { id: 'q2', type: 'card', name: '문제 카드', text: '"복리"의 의미로 가장 알맞은 것은?', bg: 'n2', radius: 14, pad: 18, vis: true },
    { id: 'q3', type: 'list', name: '선택지 목록', text: '선택지', bg: 'n1', radius: 12, pad: 12, vis: true },
    { id: 'q4', type: 'btn', name: '정답 확인 버튼', text: '정답 확인', bg: 'm600', radius: 10, pad: 12, vis: true },
  ] },
};
const clone = o => JSON.parse(JSON.stringify(o));

function ElView({ e, sel, onSel }) {
  const style = { background: 'var(--' + e.bg + ')', color: onDark(e.bg) ? '#fff' : 'var(--n9)', borderRadius: e.radius, padding: e.pad };
  let inner = null;
  if (e.type === 'head') inner = <div className="t1" style={{ fontSize: 17 }}>{e.text}</div>;
  if (e.type === 'card') inner = <div><div className="t2">{e.name}</div><div className="t1" style={{ fontSize: 17, marginTop: 4 }}>{e.text}</div></div>;
  if (e.type === 'btn') inner = <div className="t1" style={{ textAlign: 'center' }}>{e.text}</div>;
  if (e.type === 'list') inner = (
    <div><div className="t1" style={{ marginBottom: 6 }}>{e.text}</div>
      {['영어 단어 · 일상 표현', '경제 용어 · 금리와 이자', '한국사 · 조선 전기'].map((t, i) => <div key={t} className="row-i"><span className="dotb"><I n={['languages', 'coins', 'landmark'][i]} /></span><span>{t}</span></div>)}
    </div>);
  if (e.type === 'ad') inner = <div className="t2" style={{ textAlign: 'center', padding: '22px 0' }}>{e.text}</div>;
  return <div className={'el' + (sel ? ' sel' : '') + (e.vis ? '' : ' hid')} data-name={e.name} style={style} onClick={() => onSel(e.id)}>{inner}</div>;
}

/* ---------- 캔버스 편집기 ---------- */
function Editor({ toast }) {
  useIcons();
  const [screens, setScreens] = useState(() => clone(SCREENS));
  const [cur, setCur] = useState('home');
  const [selId, setSelId] = useState('h2');
  const [past, setPast] = useState([]);
  const [future, setFuture] = useState([]);
  const [saved, setSaved] = useState(true);
  const els = screens[cur].els;
  const sel = els.find(x => x.id === selId) || els[0];
  const commit = fn => { setPast(p => [...p.slice(-19), clone(screens)]); setFuture([]); const n = clone(screens); fn(n[cur].els.find(x => x.id === sel.id)); setScreens(n); setSaved(false); };
  const undo = () => { if (!past.length) return; setFuture(f => [clone(screens), ...f]); setScreens(past[past.length - 1]); setPast(past.slice(0, -1)); setSaved(false); };
  const redo = () => { if (!future.length) return; setPast(p => [...p, clone(screens)]); setScreens(future[0]); setFuture(future.slice(1)); setSaved(false); };
  const pickScreen = k => { setCur(k); setSelId(screens[k].els[0].id); };
  const save = () => { setSaved(true); toast('화면 정의를 저장했어요 (v' + (3 + past.length) + ')'); };
  const iconOf = t => ({ head: 'type', card: 'square', btn: 'rectangle-horizontal', list: 'list', ad: 'megaphone' }[t]);
  return (
    <>
      <div className="top">
        <div>
          <div className="crumb">스튜디오<I n="chevron-right" />화면 편집<I n="chevron-right" />{screens[cur].name} 화면</div>
          <h1 className="title">화면 구성 캔버스</h1>
        </div>
        <div className="actions">
          <span className="hist">{saved ? '저장됨' : '변경 사항 있음'}<span style={{ marginLeft: 6 }}>이력 {past.length}</span></span>
          <button className="btn" onClick={undo} disabled={!past.length}><I n="undo-2" />실행 취소</button>
          <button className="btn" onClick={redo} disabled={!future.length}><I n="redo-2" />다시 실행</button>
          <button className="btn pri" onClick={save}><I n="save" />저장</button>
        </div>
      </div>
      <div className="content">
        <div className="editor" data-region="editor-canvas">
          <aside className="box" data-region="left-panel">
            <div className="box-h">화면 · 레이어</div>
            <div style={{ padding: '10px 14px' }}>
              <div className="seg" style={{ width: '100%' }}>{Object.entries(screens).map(([k, v]) => <button key={k} style={{ flex: 1, padding: 0 }} className={cur === k ? 'on' : ''} onClick={() => pickScreen(k)}>{v.name}</button>)}</div>
            </div>
            {els.map(e => (
              <button key={e.id} className={'layer' + (e.id === sel.id ? ' on' : '') + (e.vis ? '' : ' hid')} onClick={() => setSelId(e.id)}>
                <I n={iconOf(e.type)} />{e.name}
                <span className="eye"><I n={e.vis ? 'eye' : 'eye-off'} /></span>
              </button>
            ))}
          </aside>

          <section className="box" data-region="canvas" style={{ overflow: 'hidden' }}>
            <div className="box-h"><span>캔버스 · 모바일 미리보기</span><span className="tag">390 × 844 기준</span></div>
            <div className="canvas">
              <div className="phone" key={cur}>
                {els.map(e => <ElView key={e.id} e={e} sel={e.id === sel.id} onSel={setSelId} />)}
              </div>
            </div>
          </section>

          <aside className="box" data-region="right-panel">
            <div className="box-h">속성 · {sel.name}</div>
            <div style={{ padding: 14 }}>
              <div className="field"><label className="lbl">문구</label><input type="text" value={sel.text} onChange={ev => commit(x => { x.text = ev.target.value; })} /></div>
              <div className="field"><label className="lbl">모서리 {sel.radius}px</label><input type="range" min="0" max="32" value={sel.radius} onChange={ev => commit(x => { x.radius = +ev.target.value; })} /></div>
              <div className="field"><label className="lbl">안쪽 여백 {sel.pad}px</label><input type="range" min="0" max="32" step="2" value={sel.pad} onChange={ev => commit(x => { x.pad = +ev.target.value; })} /></div>
              <div className="field"><label className="lbl">배경 토큰</label>
                <select value={sel.bg} onChange={ev => commit(x => { x.bg = ev.target.value; })}>{BGS.map(([k, t]) => <option key={k} value={k}>{k} · {t}</option>)}</select>
              </div>
              <div className="field"><button className="btn" style={{ width: '100%', justifyContent: 'center' }} onClick={() => commit(x => { x.vis = !x.vis; })}><I n={sel.vis ? 'eye-off' : 'eye'} />{sel.vis ? '이 요소 숨기기' : '이 요소 보이기'}</button></div>
              <div className="hist"><I n="history" />속성을 바꾸면 캔버스에 바로 반영돼요</div>
            </div>
          </aside>
        </div>
      </div>
    </>
  );
}

/* ---------- 토큰 ---------- */
const TOKENS = {
  '색': [['--m600', '#fa5d00', 14], ['--m50', '#fff4ed', 6], ['--n0', '#fff8f1', 9], ['--n10', '#1d1e1c', 11], ['--s1', '#1f894b', 5], ['--s2', '#cf3f3f', 4]],
  '간격': [['--space-1', '4px', 18], ['--space-2', '8px', 26], ['--space-3', '12px', 22], ['--space-4', '16px', 31]],
  '타이포': [['--text-title', '28px', 7], ['--text-body', '16px', 29], ['--text-caption', '12px', 21]],
  '모서리': [['--radius-card', '20px', 12], ['--radius-btn', '16px', 17], ['--radius-chip', '999px', 8]],
};
const USERS = ['홈 · 리워드 카드', '홈 · 오늘의 퀴즈 행', '온보딩 · 관심사 칩', '퀴즈 · 선택지 버튼', '광고 슬롯 래퍼', '결과 화면 · 요약 카드'];

function Tokens({ toast }) {
  useIcons();
  const [grp, setGrp] = useState('색');
  const [data, setData] = useState(() => clone(TOKENS));
  const [selI, setSelI] = useState(0);
  const [draft, setDraft] = useState(null);
  const [modal, setModal] = useState(null);
  const rows = data[grp];
  const r = rows[Math.min(selI, rows.length - 1)];
  const cur = draft !== null ? draft : r[1];
  const apply = () => { const n = clone(data); n[grp][selI][1] = draft; setData(n); setDraft(null); setModal(null); toast(r[0] + ' 값을 적용했어요'); };
  const json = JSON.stringify(Object.fromEntries(Object.values(data).flat().map(x => [x[0], x[1]])), null, 2);
  const isColor = grp === '색';
  return (
    <>
      <div className="top">
        <div><div className="crumb">스튜디오<I n="chevron-right" />토큰</div><h1 className="title">디자인 토큰 관리</h1></div>
        <div className="actions"><button className="btn pri" onClick={() => setModal('export')}><I n="download" />JSON 내보내기</button></div>
      </div>
      <div className="content">
        <div className="tgrid">
          <section className="box">
            <div className="box-h"><div className="seg">{Object.keys(data).map(k => <button key={k} className={grp === k ? 'on' : ''} onClick={() => { setGrp(k); setSelI(0); setDraft(null); }}>{k}</button>)}</div><span className="hist">토큰 {Object.values(data).flat().length}개</span></div>
            <div className="tr" style={{ borderTop: 0, background: 'var(--n0)', height: 32 }}><span className="th">이름</span><span className="th">값</span><span className="th">사용처</span><span></span></div>
            {rows.map((t, i) => (
              <button key={t[0]} className={'tr' + (i === selI ? ' on' : '')} onClick={() => { setSelI(i); setDraft(null); }}>
                <code>{t[0]}</code>
                <span className="mono">{isColor && <span className="sw" style={{ background: t[1] }}></span>}{t[1]}</span>
                <span className="num" style={{ textAlign: 'left' }}>컴포넌트 {t[2]}개</span>
                <span className="tag">{i === selI ? '선택됨' : '보기'}</span>
              </button>
            ))}
          </section>
          <aside className="box">
            <div className="box-h">토큰 상세 · <code>{r[0]}</code></div>
            <div style={{ padding: 14 }}>
              <div className="field"><label className="lbl">값 수정</label>
                {isColor ? <input type="color" value={cur} onChange={ev => setDraft(ev.target.value)} style={{ width: '100%', height: 34, border: '1px solid var(--n4)', borderRadius: 6, background: 'var(--n1)' }} /> : <input type="text" value={cur} onChange={ev => setDraft(ev.target.value)} />}
              </div>
              <div className="field"><label className="lbl">이 토큰을 쓰는 컴포넌트</label>
                <ul style={{ display: 'grid', gap: 6 }}>{USERS.slice(0, Math.min(6, 3 + (r[2] % 4))).map(u => <li key={u} className="hist"><I n="component" />{u}</li>)}</ul>
              </div>
              <button className="btn pri" style={{ width: '100%', justifyContent: 'center' }} disabled={draft === null || draft === r[1]} onClick={() => setModal('diff')}>변경 내용 검토</button>
            </div>
          </aside>
        </div>
      </div>
      {modal === 'diff' && (
        <div className="mback" onClick={() => setModal(null)}><div className="modal" onClick={e => e.stopPropagation()}>
          <div className="mh">변경 전후 비교<button className="btn sm" onClick={() => setModal(null)}><I n="x" /></button></div>
          <div className="mb">
            <p className="hist" style={{ marginBottom: 12 }}><code>{r[0]}</code> 값을 바꾸면 컴포넌트 {r[2]}개에 적용돼요.</p>
            <div className="diff"><div><span className="lbl">이전</span><span className="mono">{isColor && <span className="sw" style={{ background: r[1] }}></span>}{r[1]}</span></div><div className="new"><span className="lbl">변경</span><span className="mono">{isColor && <span className="sw" style={{ background: draft }}></span>}{draft}</span></div></div>
          </div>
          <div className="mf"><button className="btn" onClick={() => { setDraft(null); setModal(null); }}>적용 안 함</button><button className="btn pri" onClick={apply}>적용</button></div>
        </div></div>
      )}
      {modal === 'export' && (
        <div className="mback" onClick={() => setModal(null)}><div className="modal" onClick={e => e.stopPropagation()}>
          <div className="mh">토큰 JSON 내보내기<button className="btn sm" onClick={() => setModal(null)}><I n="x" /></button></div>
          <div className="mb"><p className="hist" style={{ marginBottom: 10 }}>앱의 토큰 파일로 바로 읽을 수 있는 형식이에요.</p><pre className="code">{json}</pre></div>
          <div className="mf"><button className="btn" onClick={() => { toast('tokens.json 다운로드를 시작해요'); setModal(null); }}><I n="download" />파일로 받기</button><button className="btn pri" onClick={() => setModal(null)}>닫기</button></div>
        </div></div>
      )}
    </>
  );
}

/* ---------- 현황 보드 ---------- */
const STEPS = [['인트로', 1000, 940, '0:12'], ['관심사 선택', 940, 861, '0:34'], ['튜토리얼', 861, 702, '0:48'], ['첫 퀴즈 시작', 702, 655, '1:05']];
function Funnel() {
  useIcons();
  const [period, setPeriod] = useState('7일');
  const [plat, setPlat] = useState('전체');
  const [selS, setSelS] = useState(1);
  const k = (period === '7일' ? 1 : 3.8) * (plat === '전체' ? 1 : plat === 'iOS' ? 0.55 : 0.45);
  const f = n => Math.round(n * k).toLocaleString();
  const max = STEPS[0][1];
  const evs = [['step_enter', '단계 진입', 1], ['step_complete', '단계 완료', 0.93], ['step_skip', '건너뛰기', 0.12], ['step_back', '이전 이동', 0.07]];
  const slots = [['홈 · 오늘의 퀴즈 아래', 812, 14, 38], ['퀴즈 · 선택지 아래', 640, 22, 61], ['결과 화면 하단', 355, 6, 17]];
  return (
    <>
      <div className="top">
        <div><div className="crumb">스튜디오<I n="chevron-right" />현황</div><h1 className="title">온보딩 진행 현황</h1></div>
        <div className="actions">
          <div className="seg">{['7일', '30일'].map(p => <button key={p} className={period === p ? 'on' : ''} onClick={() => setPeriod(p)}>{p}</button>)}</div>
          <div className="seg">{['전체', 'iOS', 'Android'].map(p => <button key={p} className={plat === p ? 'on' : ''} onClick={() => setPlat(p)}>{p}</button>)}</div>
        </div>
      </div>
      <div className="content">
        <div className="fgrid">
          <div style={{ display: 'grid', gap: 14 }}>
            <section className="box">
              <div className="box-h">단계별 진입 · 완료 수 <span className="hist">단계를 눌러 상세 이벤트 보기</span></div>
              <div className="frow" style={{ background: 'var(--n0)', borderTop: 0, padding: '6px 14px' }}><span className="th">단계</span><span className="th">완료 수 비중</span><span className="th num">진입</span><span className="th num">완료</span></div>
              {STEPS.map((s, i) => (
                <button key={s[0]} className={'frow' + (i === selS ? ' on' : '')} onClick={() => setSelS(i)}>
                  <b>{i + 1}. {s[0]}</b>
                  <span className="fbar"><i style={{ width: (s[2] / max * 100) + '%', animationDelay: i * 80 + 'ms' }}></i></span>
                  <span className="num">{f(s[1])}</span><span className="num">{f(s[2])}</span>
                </button>
              ))}
            </section>
            <section className="box">
              <div className="box-h">{STEPS[selS][0]} · 이벤트 상세 <span className="tag">평균 소요 {STEPS[selS][3]}</span></div>
              <table><thead><tr><th>이벤트</th><th>설명</th><th className="num">건수</th></tr></thead>
                <tbody>{evs.map(e => <tr key={e[0]}><td><code>{e[0]}</code></td><td>{e[1]}</td><td className="num">{f(STEPS[selS][1] * e[2])}</td></tr>)}</tbody></table>
            </section>
          </div>
          <section className="box">
            <div className="box-h">광고 슬롯별 상태 <span className="hist">건수 기준</span></div>
            <table><thead><tr><th>슬롯</th><th className="num">성공</th><th className="num">실패</th><th className="num">빈 응답</th></tr></thead>
              <tbody>{slots.map(s => <tr key={s[0]}><td>{s[0]}</td><td className="num">{f(s[1])}</td><td className="num"><span className="tag bad">{f(s[2])}</span></td><td className="num"><span className="tag">{f(s[3])}</span></td></tr>)}</tbody></table>
            <p className="hist" style={{ padding: 14 }}>화면에 표시되는 수치는 모두 예시 데이터이며, 실제 앱에서는 이벤트 수집 API의 집계 값으로 대체됩니다.</p>
          </section>
        </div>
      </div>
    </>
  );
}

/* ---------- 보고서 ---------- */
const DOCS = [['home', '홈 화면', 5], ['onb', '온보딩 플로우', 4], ['quiz', '퀴즈 풀이 화면', 4], ['ad', '광고 노출 영역', 3]];
function Report({ toast }) {
  useIcons();
  const [chk, setChk] = useState({ home: true, onb: true, quiz: true, ad: false });
  const [fmt, setFmt] = useState('PDF');
  const [busy, setBusy] = useState(false);
  const [list, setList] = useState([['화면 설계서 v2 · 3개 화면', '10.06 14:20', 'PDF'], ['결과보고서 초안 · 4개 화면', '10.05 17:42', '워드']]);
  const sel = DOCS.filter(d => chk[d[0]]);
  const gen = () => { if (!sel.length) return; setBusy(true); setTimeout(() => { setBusy(false); setList(l => [['화면 설계서 v3 · ' + sel.length + '개 화면', '10.07 12:40', fmt], ...l]); toast(fmt + ' 문서를 만들었어요'); }, 1300); };
  return (
    <>
      <div className="top">
        <div><div className="crumb">스튜디오<I n="chevron-right" />문서</div><h1 className="title">화면 설계서·결과보고서</h1></div>
        <div className="actions">
          <div className="seg">{['PDF', '워드'].map(p => <button key={p} className={fmt === p ? 'on' : ''} onClick={() => setFmt(p)}>{p}</button>)}</div>
          <button className="btn pri" onClick={gen} disabled={busy || !sel.length}>{busy ? <><span className="ldot"></span>생성 중</> : <><I n="file-down" />문서 생성</>}</button>
        </div>
      </div>
      <div className="content">
        <div className="rgrid">
          <section className="box">
            <div className="box-h">대상 화면</div>
            {DOCS.map(d => (
              <button key={d[0]} className="chk" onClick={() => setChk(c => ({ ...c, [d[0]]: !c[d[0]] }))}>
                <span className={'cb' + (chk[d[0]] ? ' on' : '')}>{chk[d[0]] && <I n="check" />}</span>{d[1]}<span className="tag" style={{ marginLeft: 'auto' }}>요소 {d[2]}</span>
              </button>
            ))}
          </section>
          <section className="doc">
            <span className="tag">미리보기</span>
            <h4 style={{ marginTop: 12 }}>화면 설계서</h4>
            <p className="hist" style={{ marginBottom: 18 }}>학습 리워드 앱 UI/UX 리뉴얼 · 샘플 문서</p>
            {busy ? <div>{[100, 90, 96, 70, 84, 60].map((w, i) => <div key={i} className="skl" style={{ width: w + '%' }}></div>)}</div> : (
              sel.length ? (<>
                <ul className="toc">{sel.map((d, i) => <li key={d[0]}><span>{i + 1}. {d[1]} 구성</span><span className="mono">p.{i * 2 + 3}</span></li>)}</ul>
                <table style={{ marginTop: 22 }}><thead><tr><th>화면</th><th>요소</th><th>토큰</th></tr></thead>
                  <tbody>{sel.map(d => <tr key={d[0]}><td>{d[1]}</td><td>{d[2]}개 요소</td><td><code>--radius-card</code></td></tr>)}</tbody></table>
              </>) : <p className="hist">왼쪽에서 화면을 하나 이상 선택해 주세요.</p>
            )}
          </section>
          <section className="box">
            <div className="box-h">생성 이력</div>
            {list.map((h, i) => (
              <div key={h[0] + i} className="chk" style={{ height: 'auto', padding: '10px 14px', alignItems: 'flex-start', cursor: 'default', animation: i === 0 ? 'slideIn .3s ease both' : undefined }}>
                <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>{h[0]}</div><div className="hist">{h[1]} · {h[2]}</div></div>
                <button className="btn sm" onClick={() => toast(h[0] + ' 다시 내려받기')}><I n="download" /></button>
              </div>
            ))}
          </section>
        </div>
      </div>
    </>
  );
}

function App() {
  const [tab, setTab] = useState('main');
  const [msg, setMsg] = useState(null);
  const tm = useRef();
  const toast = t => { setMsg(t); clearTimeout(tm.current); tm.current = setTimeout(() => setMsg(null), 2200); };
  useIcons();
  return (
    <div className="shell" data-layout="sidebar-classic">
      <aside className="sidebar">
        <div className="logo"><span className="mk"><I n="layers" /></span>화면 스튜디오</div>
        <div className="grp">작업 공간</div>
        {NAV.map(n => <button key={n.id} className={'nav' + (tab === n.id ? ' on' : '')} onClick={() => setTab(n.id)}><I n={n.icon} />{n.label}</button>)}
        <div className="side-foot">샘플 학습 앱 · 자체 개발 프로젝트<br />모든 데이터는 예시입니다</div>
      </aside>
      <main className="main-wrap">
        {tab === 'main' && <Editor toast={toast} />}
        {tab === 'tokens' && <Tokens toast={toast} />}
        {tab === 'funnel' && <Funnel />}
        {tab === 'report' && <Report toast={toast} />}
      </main>
      {msg && <div className="toast"><I n="check" />{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
