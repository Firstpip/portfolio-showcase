<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 253°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m700 = plan primary */
  --m50:#f1f0f5;
  --m100:#f1f0f5;
  --m200:#e3e1ea;
  --m300:#c7c3d6;
  --m400:#a59fbd;
  --m500:#8076a1;
  --m600:#5c5086;
  --m700:#38296c;
  --m800:#2e2259;
  --m900:#241a45;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f7f7f7;
  --n1:#ffffff;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d6d5d7;
  --n5:#b6b5ba;
  --n6:#929098;
  --n7:#727578;
  --n8:#55535a;
  --n9:#37363a;
  --n10:#171618;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=elevated theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
/* header */
.search-header{position:sticky;top:0;z-index:40;background:var(--n1);border-bottom:1px solid var(--n3)}
.header-row{display:flex;align-items:center;gap:24px;padding:14px 40px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--m700)}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--m700);color:var(--n1);display:grid;place-items:center}
.search-bar{flex:1;max-width:720px;margin:0 auto;display:flex;align-items:center;border:1px solid var(--n4);border-radius:40px;background:var(--n1);box-shadow:0 2px 10px rgba(23,22,24,.06);padding:5px 6px 5px 8px;transition:box-shadow .2s}
.search-bar:hover{box-shadow:0 6px 18px rgba(23,22,24,.1)}
.search-segment{flex:1;text-align:left;padding:6px 16px;border-radius:30px;display:flex;flex-direction:column;min-width:0}
.search-segment:hover{background:var(--n2)}
.segment-label{font-size:11px;font-weight:700;color:var(--n8);letter-spacing:.02em}
.segment-value{font-size:14px;color:var(--n7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-input{border:none;outline:none;background:transparent;width:100%;font-size:14px;color:var(--n10)}
.search-input::placeholder{color:var(--n6)}
.search-divider{width:1px;height:26px;background:var(--n3)}
.search-submit{width:42px;height:42px;border-radius:50%;background:var(--m700);color:var(--n1);display:grid;place-items:center;flex:none;transition:transform .15s}
.search-submit:hover{transform:scale(1.06)}
.header-nav{display:flex;align-items:center;gap:6px}
.nav-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:24px;font-weight:600;font-size:14px;color:var(--n8);position:relative}
.nav-btn:hover{background:var(--n2)}
.cart-count{position:absolute;top:2px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--n10);color:var(--n1);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .3s}

.chip{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:24px;border:1px solid var(--n4);background:var(--n1);font-size:14px;font-weight:600;color:var(--n8);white-space:nowrap;transition:all .18s;flex:none}
.chip:hover{border-color:var(--n8)}

.chip-icon{display:flex}
.step-rail{display:flex;gap:4px;padding:0 40px;max-width:1440px;margin:0 auto;border-top:1px solid var(--n2)}
.step-tab{display:flex;align-items:center;gap:8px;padding:12px 18px;font-weight:700;font-size:14px;color:var(--n7);border-bottom:3px solid transparent;margin-bottom:-1px;position:relative}

.hero-art{flex:none;width:300px;height:170px;position:relative}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.float-a{animation:floaty 4s ease-in-out infinite}

.panel{background:var(--n1);border-radius:20px;box-shadow:0 4px 20px rgba(23,22,24,.07);padding:24px}
.panel h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
.panel .sub{font-size:13px;color:var(--n7);margin-top:2px}
.field{margin-top:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--n8);margin-bottom:6px}
.input{width:100%;height:44px;border-radius:14px;border:1px solid var(--n4);background:var(--n0);padding:0 14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--m600)}
.seg{display:flex;background:var(--n2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:11px;font-weight:700;font-size:14px;color:var(--n7);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.seg button.on{background:var(--n1);color:var(--n10);box-shadow:0 1px 6px rgba(23,22,24,.12)}
.btn{height:46px;padding:0 22px;border-radius:24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}
.btn-primary{background:var(--m700);color:var(--n1)}
.btn-primary:hover{background:var(--m800)}
.btn-ghost{border:1px solid var(--n4);background:var(--n1);color:var(--n9)}
.btn-ghost:hover{border-color:var(--n8)}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.age-box{margin-top:14px;border-radius:16px;background:var(--n2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.age-big{font-size:26px;font-weight:800;letter-spacing:-.04em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--n2);color:var(--n8)}
.pill.main{background:var(--n10);color:var(--n1)}
.pill.ok{background:var(--s1-bg);color:var(--s1-text)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text)}
.alias-note{margin-top:8px;font-size:12px;color:var(--n7);display:flex;align-items:center;gap:6px}
.pet-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.pet-card{border-radius:20px;border:2px solid var(--n3);background:var(--n1);padding:18px;text-align:left;transition:all .2s;display:block;width:100%}
.pet-card:hover{transform:translateY(-3px)}
.pet-card.on{border-color:var(--m600);background:var(--m50)}
.pet-top{display:flex;align-items:center;gap:12px}
.pet-ava{width:46px;height:46px;border-radius:16px;background:var(--n2);color:var(--n8);display:grid;place-items:center}
.pet-card.on .pet-ava{background:var(--m700);color:var(--n1)}
.pet-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.pet-meta{font-size:12px;color:var(--n7)}
.pet-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;margin:30px 0 4px}
.sec-title h2{font-size:24px;font-weight:800;letter-spacing:-.04em}
.sec-title span{font-size:13px;color:var(--n7)}
/* grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:16px}
.listing-card{cursor:pointer;animation:riseIn .5s both;transition:transform .2s;text-align:left;display:block;width:100%}
.listing-card:hover{transform:scale(1.02)}
.card-image-wrap{position:relative;aspect-ratio:4/3;border-radius:20px;background:var(--n2);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.card-image{display:flex;flex-direction:column;gap:2px;color:var(--n8)}
.card-vol{font-size:34px;font-weight:800;letter-spacing:-.05em;color:var(--n10);line-height:1.05}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.card-tags span{background:var(--n1);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--n8)}
.card-favorite{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--n1);display:grid;place-items:center;color:var(--n8)}
.card-favorite.on{color:var(--m700)}
.card-favorite.on svg{fill:var(--m700)}
.card-match{position:absolute;top:12px;left:12px}
.card-body{padding:12px 4px 0}
.card-row-1{display:flex;justify-content:space-between;gap:8px}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-rating{font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px;flex:none}
.card-meta{font-size:13px;color:var(--n7)}
.card-price{font-size:17px;font-weight:800;letter-spacing:-.02em}
.price-unit{font-size:13px;color:var(--n7);margin-left:4px}
.card-sub{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--n8);margin-left:8px;font-weight:600}
.rule-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--n8)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--n4);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--n1);transition:transform .2s}
.sw.on{background:var(--m600)}
.sw.on::after{transform:translateX(16px)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(23,22,24,.4);z-index:80;display:flex;justify-content:flex-end;animation:fadeIn .2s}
.overlay.center{justify-content:center;align-items:center}
.drawer{width:440px;max-width:100%;height:100%;background:var(--n1);padding:28px;overflow-y:auto;animation:drawerIn .3s}
.modal{width:460px;max-width:92%;background:var(--n1);border-radius:24px;padding:30px;animation:riseIn .3s}
.quick-tile{border-radius:20px;background:var(--n2);padding:24px;margin:18px 0}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--n3);font-size:14px}
.kv span:first-child{color:var(--n7)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:var(--n1);padding:13px 22px;border-radius:24px;font-weight:600;font-size:14px;z-index:100;animation:riseIn .3s;display:flex;align-items:center;gap:8px}
/* subscription */
.sub-grid{display:grid;grid-template-columns:1fr 400px;gap:28px;margin-top:28px;align-items:start}
.sub-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--n3)}
.sub-tile{width:64px;height:64px;border-radius:16px;background:var(--n2);display:grid;place-items:center;flex:none;font-weight:800;letter-spacing:-.04em;font-size:16px}
.sub-info{flex:1;min-width:0}
.sub-name{font-weight:700;letter-spacing:-.02em}
.sub-sm{font-size:12px;color:var(--n7)}
.qty{display:flex;align-items:center;border:1px solid var(--n4);border-radius:20px;overflow:hidden}

.qty button:hover{background:var(--n2)}
.qty b{min-width:26px;text-align:center;font-size:14px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--n5);display:grid;place-items:center;flex:none;color:transparent;transition:all .15s}
.chk.on{background:var(--m700);border-color:var(--m700);color:var(--n1)}
.tier{position:relative;height:12px;border-radius:6px;background:var(--n3);margin:34px 0 8px}
.tier-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--m600);width:var(--w);animation:barGrow .7s ease-out;transition:width .4s}
.tier-mark{position:absolute;top:-24px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--n7);text-align:center;white-space:nowrap}
.tier-mark.hit{color:var(--m700)}
.tier-tick{position:absolute;top:0;bottom:0;width:2px;background:var(--n1)}
.sum-line{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.sum-line.total{font-size:22px;font-weight:800;letter-spacing:-.03em;border-top:1px solid var(--n3);margin-top:8px;padding-top:16px}
.sum-line .neg{color:var(--m700);font-weight:700}
.timeline{display:flex;gap:10px;margin-top:12px}
.tl-item{flex:1;border-radius:16px;background:var(--n2);padding:12px;font-size:12px;color:var(--n7)}

.tl-item.first{background:var(--m50)}

.note-box{display:flex;gap:10px;background:var(--n2);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--n8);margin-top:14px;line-height:1.5}
/* checkout */
.radio-row{display:flex;gap:10px;margin-top:6px}
.radio{flex:1;border:2px solid var(--n3);border-radius:16px;padding:14px;text-align:left;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center}
.radio.on{border-color:var(--m600);background:var(--m50)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer.footer{border-top:1px solid var(--n3);background:var(--n1);padding:30px 40px}
.footer-cols{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px;font-size:13px;color:var(--n7)}

<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const TODAY=new Date(2026,9,7);

function Icon({name,size=18,stroke=1.8}){
  const raw=(window.lucide&&window.lucide.icons&&window.lucide.icons[name])||[];
  const node=Array.isArray(raw[2])?raw[2]:(Array.isArray(raw[0])?raw:[]);
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {node.map((n,i)=>{const a={...n[1]};delete a.key;return React.createElement(n[0],{...a,key:i});})}
    </svg>
  );
}
const won=n=>n.toLocaleString('ko-KR')+'원';
const fmtDate=d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* 생년월일 → 현재 나이·연령대 (월말·윤년 경계는 달 단위 비교로 처리) */
function calcAge(birth){
  const b=new Date(birth);
  if(isNaN(b)||b>TODAY) return null;
  let months=(TODAY.getFullYear()-b.getFullYear())*12+(TODAY.getMonth()-b.getMonth());
  if(TODAY.getDate()<b.getDate()){
    const lastOfMonth=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
    if(!(b.getDate()>lastOfMonth&&TODAY.getDate()===lastOfMonth)) months-=1;
  }
  const y=Math.floor(months/12), m=months%12;
  return {months,y,m,text:y>0?`${y}세 ${m}개월`:`${m}개월`};
}
function lifeStage(months,species){
  if(months<12) return species==='고양이'?'키튼':'퍼피';
  if(months<24) return '주니어';
  if(months<84) return '어덜트';
  return '시니어';
}
const BREEDS={
  '강아지':[['말티즈',['몰티즈','말티']],['푸들',['토이푸들','미니푸들']],['포메라니안',['포메']],['비숑 프리제',['비숑']],['골든 리트리버',['골든','골댕이']]],
  '고양이':[['코리안 숏헤어',['코숏','한국 고양이']],['러시안 블루',['러블']],['페르시안',['페르시안 고양이']],['브리티시 숏헤어',['브숏']]]
};
function resolveBreed(species,text){
  const t=text.trim();
  if(!t) return null;
  for(const [std,aliases] of BREEDS[species]){
    if(std===t) return {std,alias:null};
    if(aliases.includes(t)) return {std,alias:t};
  }
  return {std:null,alias:t};
}

function recommend(pet,cat,exclude,limitBrand){
  const stage=lifeStage(calcAge(pet.birth).months,pet.species);
  let list=PRODUCTS.filter(p=>p.sp===pet.species).map(p=>{
    let s=20;
    if(p.tags.includes(pet.breed)) s+=40; else if(p.tags.includes('전품종')) s+=18; else if(p.tags.includes('소형견')&&pet.breed==='말티즈') s+=26;
    if(p.ages.includes(stage)) s+=30;
    const hit=p.all.filter(a=>pet.allergy.includes(a));
    return {p,score:Math.min(s,99),blocked:hit.length>0};
  });
  if(exclude) list=list.filter(x=>!x.blocked);
  if(cat==='정기배송 가능') list=list.filter(x=>x.p.sub);
  else if(cat!=='전체') list=list.filter(x=>x.p.cat===cat);
  list.sort((a,b)=>b.score-a.score);
  if(limitBrand){ /* 같은 브랜드 연속 노출 제한 */
    const out=[];const rest=[...list];
    while(rest.length){
      const last=out.length?out[out.length-1].p.brand:null;
      let i=rest.findIndex(x=>x.p.brand!==last);
      if(i<0) i=0;
      out.push(rest.splice(i,1)[0]);
    }
    list=out;
  }
  return {list,stage};
}

      </div>
      <div className="rule-bar"><span className="chip sel" style={{cursor:'default'}}><Icon name="PawPrint" size={14}/>{rep.name} · {rep.breed}</span><span className="chip sel" style={{cursor:'default'}}><Icon name="Calendar" size={14}/>{stage}</span><span className="chip sel" style={{cursor:'default'}}><Icon name="Tag" size={14}/>{cat}</span></div>
      {exclude&&blocked>0&&<div className="note-box" style={{maxWidth:640}}><Icon name="ShieldCheck" size={16}/><span>알레르기 조건에 해당하는 {blocked}개 상품은 후보에서 먼저 제외되었습니다. 필터를 끄면 다시 노출됩니다.</span></div>}
      <div className="card-grid">
        {list.map((x,i)=><Card key={x.p.id} p={x.p} pet={rep} score={x.score} fav={fav.includes(x.p.id)} onFav={onFav} onOpen={onOpen} delay={i*45}/>)}
      </div>
      {list.length===0&&<div className="panel" style={{marginTop:20,textAlign:'center',color:'var(--n7)'}}>조건에 맞는 상품이 없습니다. 카테고리를 바꿔 보세요.</div>}
    </div>
  );
}

/* ---- 화면 3: 정기배송 ---- */
const TIERS=[[50000,7],[80000,10],[150000,12]];
function discountRate(sum){let r=0;for(const [t,v] of TIERS) if(sum>t) r=v;return r;}
function SubView({pets,repId,items,setItems,goCheckout,toast}){
  const rep=pets.find(p=>p.id===repId)||pets[0];
  const [cycle,setCycle]=useState(30);
  const [skipSupp,setSkipSupp]=useState(false);
  const pool=PRODUCTS.filter(p=>p.sp===rep.species&&p.sub);
  const toggle=id=>setItems(items.some(i=>i.id===id)?items.filter(i=>i.id!==id):[...items,{id,qty:1}]);
  const setQty=(id,d)=>setItems(items.map(i=>i.id===id?{...i,qty:Math.max(1,i.qty+d)}:i));
  const lines=items.map(i=>({...i,p:PRODUCTS.find(p=>p.id===i.id)})).filter(l=>l.p&&l.p.sp===rep.species);
  const sum=lines.reduce((s,l)=>s+l.p.price*l.qty,0);
  const eligible=lines.filter(l=>!(skipSupp&&l.p.cat==='영양제')).reduce((s,l)=>s+l.p.price*l.qty,0);
  const rate=discountRate(eligible);
  const disc=Math.round(eligible*rate/100);
  const total=sum-disc;
  const pct=Math.min(eligible/180000*100,100);
  return (
    <div className="sub-grid">
      <div className="panel">
        <h2>{rep.name}의 정기배송 구성</h2>
        <div className="sub">고정상품을 고르고 수량을 정하면 합계와 할인 구간이 바로 계산됩니다</div>
        <div className="rule-bar"><button className="toggle" onClick={()=>setSkipSupp(!skipSupp)}><span className={'sw '+(skipSupp?'on':'')}/>영양제 제외하고 할인 계산</button></div>
        {pool.map(p=>{const on=items.find(i=>i.id===p.id);return (
          <div key={p.id} className="sub-row">
            <button className={'chk '+(on?'on':'')} aria-label="선택" onClick={()=>toggle(p.id)}><Icon name="Check" size={15} stroke={3}/></button>
            <div className="sub-tile">{p.vol}</div>
            <div className="sub-info"><div className="sub-name">{p.name}</div><div className="sub-sm">{p.brand} · {p.cat} · {p.spec}</div></div>
            {on?<div className="qty"><button aria-label="감소" onClick={()=>setQty(p.id,-1)}><Icon name="Minus" size={14}/></button><b className="num">{on.qty}</b><button aria-label="증가" onClick={()=>setQty(p.id,1)}><Icon name="Plus" size={14}/></button></div>:<span className="sub-sm">선택 안 됨</span>}
            <b className="num" style={{minWidth:84,textAlign:'right'}}>{won(p.price)}</b>
          </div>);})}
      </div>
      <aside className="panel" style={{position:'sticky',top:190}}>
        <h2>주기와 할인</h2>
        <div className="field"><label>배송 주기</label>
          <div className="seg">{[30,45,60].map(c=><button key={c} className={cycle===c?'on':''} onClick={()=>setCycle(c)}>{c}일</button>)}</div>
        </div>
        <div className="tier">
          <div className="tier-fill" style={{'--w':pct+'%',width:pct+'%'}}/>
          {TIERS.map(([t,v])=><React.Fragment key={t}><span className="tier-tick" style={{left:(t/180000*100)+'%'}}/><span className={'tier-mark '+(eligible>t?'hit':'')} style={{left:(t/180000*100)+'%'}}>{t/10000}만 초과<br/>{v}%</span></React.Fragment>)}
        </div>
        <div className="sum-line"><span>상품 합계</span><b className="num">{won(sum)}</b></div>
        <div className="sum-line"><span>할인 대상 금액</span><span className="num">{won(eligible)}</span></div>
        <div className="sum-line"><span>적용 할인율</span><span className="neg num">{rate}%</span></div>
        <div className="sum-line"><span>정기배송 할인</span><span className="neg num">-{won(disc)}</span></div>
        <div className="sum-line total"><span>회차당 결제</span><span className="num">{won(total)}</span></div>
        <div className="timeline">
          {[0,1,2].map(i=><div key={i} className={'tl-item '+(i===0?'first':'')}>{i+1}회차<b className="num">{fmtDate(addDays(TODAY,3+cycle*i))}</b></div>)}
        </div>
        <div className="note-box"><Icon name="Info" size={15}/><span>다른 할인과는 중복되지 않습니다. 주문 시 서버가 같은 계산 모듈로 금액을 다시 확인하고, 다르면 서버 값을 기준으로 안내합니다.</span></div>
        <button className="btn btn-primary btn-block" style={{marginTop:16}} disabled={lines.length===0} onClick={()=>goCheckout({lines,cycle,sum,disc,total,rate})}><Icon name="Repeat" size={17}/>정기배송 신청하기</button>
      </aside>
    </div>
  );
}

/* ---- 화면 4: 결제 ---- */
function PayView({order,toast}){
  const [usePt,setUsePt]=useState(3000);
  const [method,setMethod]=useState('card');
  const [agree,setAgree]=useState(true);
  const [loading,setLoading]=useState(false);
  const [done,setDone]=useState(null);
  const BAL=12400;
  const ship=order.total>=50000?0:3000;
  const maxUse=Math.min(BAL,Math.floor(order.total*0.3));
  const pt=Math.min(Math.max(usePt,0),maxUse);
  const pay=order.total+ship-pt;
  const submit=()=>{
    if(!agree){toast('반복 결제 동의가 필요합니다');return;}
    setLoading(true);
    setTimeout(()=>{setLoading(false);setDone({no:'PF-261007-0412'});},1300);
  };
  return (
    <div className="sub-grid">
      <div>
        <div className="panel">
          <h2>배송지</h2>
          <div className="row2"><div className="field"><label>받는 분</label><input className="input" defaultValue="김하늘"/></div><div className="field"><label>연락처</label><input className="input" defaultValue="010-5555-0123"/></div></div>
          <div className="field"><label>주소</label><input className="input" defaultValue="서울특별시 마포구 월드컵로 120, 301호"/></div>
        </div>
        <div className="panel" style={{marginTop:20}}>
          <h2>적립금 사용</h2>
          <div className="sub">보유 {BAL.toLocaleString()}P · 주문당 결제금액의 30%까지 · 정기배송 할인과 중복 불가 항목 제외</div>
          <div style={{display:'flex',gap:10,marginTop:14}}>
            <input className="input num" type="number" value={usePt} onChange={e=>setUsePt(Number(e.target.value))}/>
            <button className="btn btn-ghost" style={{flex:'none'}} onClick={()=>setUsePt(maxUse)}>최대 사용</button>
          </div>
          <div className="sub-sm" style={{marginTop:8}}>사용 가능 한도 {maxUse.toLocaleString()}P</div>
        </div>
        <div className="panel" style={{marginTop:20}}>
          <h2>결제 수단</h2>
          <div className="radio-row">
            <button className={'radio '+(method==='card'?'on':'')} onClick={()=>setMethod('card')}><Icon name="CreditCard" size={20}/>신용·체크카드</button>
            <button className={'radio '+(method==='easy'?'on':'')} onClick={()=>setMethod('easy')}><Icon name="Wallet" size={20}/>간편결제</button>
          </div>
          <button className="toggle" style={{marginTop:16}} onClick={()=>setAgree(!agree)}><span className={'chk '+(agree?'on':'')} style={{width:22,height:22}}><Icon name="Check" size={13} stroke={3}/></span>{order.cycle}일마다 자동 결제되는 반복 결제에 동의합니다 (빌링 키만 저장)</button>
        </div>
      </div>
      <aside className="panel" style={{position:'sticky',top:190}}>
        <h2>주문 요약</h2>
        {order.lines.map(l=><div key={l.id} className="sum-line"><span>{l.p.name} ×{l.qty}</span><span className="num">{won(l.p.price*l.qty)}</span></div>)}
        <div className="sum-line"><span>정기배송 할인 ({order.rate}%)</span><span className="neg num">-{won(order.disc)}</span></div>
        <div className="sum-line"><span>적립금 사용</span><span className="neg num">-{pt.toLocaleString()}P</span></div>
        <div className="sum-line"><span>배송비</span><span className="num">{ship?won(ship):'무료'}</span></div>
        <div className="sum-line total"><span>첫 결제 금액</span><span className="num">{won(pay)}</span></div>
        <div className="note-box"><Icon name="ShieldCheck" size={15}/><span>결제 승인 전 서버가 가격·재고·할인·배송비를 다시 계산해 일치할 때만 승인합니다. 같은 주문 번호는 두 번 처리되지 않습니다.</span></div>
        <button className="btn btn-primary btn-block" style={{marginTop:16}} data-loading={loading?'true':undefined} onClick={submit}>{loading?'승인 확인 중…':`${won(pay)} 결제하기`}</button>
      </aside>
      {done&&<div className="overlay center" onClick={()=>setDone(null)}>
        <div className="modal" onClick={e=>e.stopPropagation()} style={{textAlign:'center'}}>
          <div className="pet-ava" style={{margin:'0 auto',background:'var(--s1-bg)',color:'var(--s1-text)',width:60,height:60,borderRadius:'50%'}}><Icon name="Check" size={30} stroke={2.6}/></div>
          <h2 style={{fontSize:24,fontWeight:800,letterSpacing:'-.04em',marginTop:16}}>정기배송 신청이 접수됩니다</h2>
          <p className="sub-sm" style={{marginTop:8,fontSize:14}}>주문 번호 {done.no}<br/>빌링 키 등록 · 다음 결제 예정일 {fmtDate(addDays(TODAY,3+order.cycle))}</p>
          <button className="btn btn-primary btn-block" style={{marginTop:22}} onClick={()=>setDone(null)}>확인</button>
        </div>
      </div>}
    </div>
  );
}

function App(){
  const [view,setView]=useState('main');
  const [pets,setPets]=useState(PETS0);
  const [repId,setRepId]=useState(1);
  const [cat,setCat]=useState('전체');
  const [fav,setFav]=useState([2]);
  const [open,setOpen]=useState(null);
  const [cart,setCart]=useState(0);
  const [items,setItems]=useState([{id:1,qty:1},{id:6,qty:1},{id:8,qty:1}]);
  const [order,setOrder]=useState(null);
  const [q,setQ]=useState('');
  const [t,toast]=useToast();
  const STEPS=[['main','반려동물 등록·나이 자동 계산','PawPrint'],['recommend','품종·연령 맞춤 추천','Heart'],['subscription','정기배송 구성·할인 미리 계산','Repeat'],['checkout','결제·적립금 사용','CreditCard']];
  const rep=pets.find(p=>p.id===repId)||pets[0];
  useEffect(()=>{window.scrollTo(0,0);},[view]);
  const onFav=id=>setFav(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]);
  const goCheckout=o=>{setOrder(o);setView('checkout');};
  const fallback={lines:items.map(i=>({...i,p:PRODUCTS.find(p=>p.id===i.id)})),cycle:30,sum:0,disc:0,total:0,rate:0};
  if(!order){const s=fallback.lines.reduce((a,l)=>a+l.p.price*l.qty,0);const r=discountRate(s);fallback.sum=s;fallback.rate=r;fallback.disc=Math.round(s*r/100);fallback.total=s-fallback.disc;}
  const addCart=p=>{setCart(c=>c+1);setOpen(null);toast(`${p.name}이(가) 장바구니에 담깁니다`);};
  const addSub=p=>{setItems(it=>it.some(i=>i.id===p.id)?it:[...it,{id:p.id,qty:1}]);setOpen(null);setView('subscription');toast('정기배송 구성에 담깁니다');};
  const icons=Object.fromEntries(CATS.map(c=>[c[0],c[1]==='layout-grid'?'LayoutGrid':c[1]]));
  return (
    <div className="app">
      <header className="search-header" data-search-header>
        <div className="header-row">
          <a className="brand" href="#" onClick={e=>{e.preventDefault();setView('main');}}><span className="brand-mark"><Icon name="PawPrint" size={19}/></span>포근펫</a>
          <div className="search-bar">
            <div className="search-segment"><div className="segment-label">검색</div><input type="search" className="search-input" placeholder="상품명·브랜드·품종 별칭" value={q} onChange={e=>setQ(e.target.value)}/></div>
            <div className="search-divider"/>
            <button className="search-segment" onClick={()=>{const i=pets.findIndex(p=>p.id===repId);setRepId(pets[(i+1)%pets.length].id);}}><div className="segment-label">반려동물</div><div className="segment-value">{rep.name} · {rep.breed}</div></button>
            <div className="search-divider"/>
            <button className="search-segment" onClick={()=>setView('recommend')}><div className="segment-label">연령대</div><div className="segment-value">{lifeStage(calcAge(rep.birth).months,rep.species)} · {calcAge(rep.birth).text}</div></button>
            <button className="search-submit" aria-label="검색" onClick={()=>{setView('recommend');toast(q?`'${q}' 검색 결과를 보여드립니다`:'맞춤 추천으로 이동합니다');}}><Icon name="Search" size={18}/></button>
          </div>
          <nav className="header-nav">
            <button className="nav-btn" onClick={()=>toast('MYMENU: 주문 내역·배송지·동의 이력')}><Icon name="User" size={17}/>MYMENU</button>
            <button className="nav-btn" onClick={()=>toast(`장바구니 ${cart}개`)}><Icon name="ShoppingBag" size={17}/>장바구니{cart>0&&<span className="cart-count">{cart}</span>}</button>
          </nav>
        </div>
        <div className="filter-chips" data-filter-chips>
          {CATS.map(([c,ic])=><button key={c} className={'chip '+(cat===c?'active':'')} onClick={()=>setCat(c)}><span className="chip-icon"><Icon name={icons[c]} size={15}/></span><span className="chip-label">{c}</span></button>)}
        </div>
        <div className="step-rail">
          {STEPS.map(([id,label,ic],i)=><button key={id} className={'step-tab '+(view===id?'on':'')} onClick={()=>setView(id)}><span className="step-no">{i+1}</span>{label}</button>)}
        </div>
      </header>
      <main className="main" data-layout="grid-or-split" key={view}>
        {view==='main'&&<PetView pets={pets} setPets={setPets} repId={repId} setRepId={setRepId} cat={cat} fav={fav} onFav={onFav} onOpen={setOpen} toast={toast}/>}
        {view==='recommend'&&<RecView pets={pets} repId={repId} setRepId={setRepId} cat={cat} fav={fav} onFav={onFav} onOpen={setOpen}/>}
        {view==='subscription'&&<SubView pets={pets} repId={repId} items={items} setItems={setItems} goCheckout={goCheckout} toast={toast}/>}
        {view==='checkout'&&<PayView order={order||fallback} toast={toast}/>}
      </main>
      <footer className="footer"><div className="footer-cols">
        <div className="footer-col"><h4>포근펫</h4>반려동물 맞춤 쇼핑·정기배송 몰 데모<br/>© 2026 포근펫 샘플 몰 — 자체 개발 프로젝트</div>
        <div className="footer-col"><h4>쇼핑</h4><a>강아지</a><a>고양이</a><a>맞춤추천</a></div>
        <div className="footer-col"><h4>정기배송</h4><a>고정상품</a><a>내 마음대로</a><a>할인 구간</a></div>
        <div className="footer-col"><h4>고객센터</h4><a>1:1 문의</a><a>배송 조회</a><a>반품·교환</a></div>
      </div></footer>
      {open&&<Quick p={open} onClose={()=>setOpen(null)} onAdd={addCart} onSub={addSub}/>}
      {t&&<div className="toast"><Icon name="Check" size={16}/>{t}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
