<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 27°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m700 = plan primary */
  --m50:#f6f2f0;
  --m100:#f6f2f0;
  --m200:#ece6e0;
  --m300:#daccc1;
  --m400:#c3ae9c;
  --m500:#aa8b72;
  --m600:#926b4a;
  --m700:#7a4a22;
  --m800:#643d1c;
  --m900:#4e2f16;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f6f1eb;
  --n1:#fbf8f4;
  --n2:#f0f0ef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab7b5;
  --n6:#989490;
  --n7:#7a7571;
  --n8:#5a5653;
  --n9:#3a3836;
  --n10:#201f1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
}
/* ⚠ s3(경고/주의) — 메인 hue 27°와 11° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Walnut Ink — 헤어라인 테두리 전용 무채색 */
:root{--walnut:#403a34}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.app{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;border-right:1px solid var(--walnut);background:var(--n0);display:flex;flex-direction:column;z-index:30}
.sidebar-brand{height:64px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--walnut)}
.brand-mark{width:26px;height:26px;border:1px solid var(--walnut);display:grid;place-items:center;font-size:15px;color:var(--m700)}
.brand-name{font-weight:700;letter-spacing:-.02em;font-size:15px}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--n7)}
.sidebar-cmdk-hint{margin:16px 22px 8px;border:1px solid var(--walnut);height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--n7);width:calc(100% - 44px);text-align:left}
.sidebar-cmdk-hint:hover{background:var(--n2)}
.sidebar-cmdk-hint kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--n5);padding:0 5px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--n7);font-weight:600}
.sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.sidebar-section-title{padding:18px 22px 6px}
.sidebar-link{display:flex;align-items:center;gap:11px;padding:10px 10px;color:var(--n8);font-weight:500;text-align:left;border-left:2px solid transparent;width:100%}
.sidebar-link i{font-size:18px}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.on{color:var(--m700);background:var(--m50);border-left-color:var(--m700);font-weight:700}
.sidebar-link .cnt{margin-left:auto;font-size:11px;color:var(--n7);border:1px solid var(--n5);padding:0 6px}
.sidebar-user{margin-top:auto;border-top:1px solid var(--walnut);padding:16px 22px;display:flex;gap:10px;align-items:center}
.ava{width:30px;height:30px;border:1px solid var(--walnut);display:grid;place-items:center;font-weight:700;background:var(--n2)}
.main{margin-left:260px;width:calc(100% - 260px);flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;border-bottom:1px solid var(--walnut);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;background:var(--n0);z-index:20}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--n7)}
.breadcrumb .divider{color:var(--n5)}
.breadcrumb b{color:var(--n10)}
.topbar-actions{display:flex;gap:10px;align-items:center}
.btn{height:34px;padding:0 16px;border:1px solid var(--walnut);background:var(--n0);font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn:hover{background:var(--n2)}
.btn-primary{background:var(--m700);border-color:var(--m700);color:var(--n0)}
.btn-primary:hover{background:var(--m800)}
.btn-quiet{border-color:var(--n5);color:var(--n8)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-cmdk{font-size:12px}
.content{padding:32px;flex:1;animation:fadeIn .3s}
.display{font-size:clamp(44px,5vw,76px);font-weight:500;letter-spacing:-.045em;line-height:1}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px}
.ledger-art{order:2;width:340px;height:110px;flex:none}
.ledger-line{stroke-dasharray:600;stroke-dashoffset:600;animation:lineDrawS 1.4s .2s forwards}
@keyframes lineDrawS{to{stroke-dashoffset:0}}
.page-head p{max-width:520px;color:var(--n7);margin-top:12px}
.strip{display:flex;border:1px solid var(--walnut);margin-bottom:22px}
.strip>div{flex:1;padding:14px 18px;border-right:1px solid var(--walnut);animation:slideUp .5s both}
.strip>div:last-child{border-right:none}
.strip .big{font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.strip .big small{font-size:12px;color:var(--n7);letter-spacing:0;margin-left:4px}
.md{display:grid;grid-template-columns:400px 1fr;border:1px solid var(--walnut);min-height:560px}
.list-rail{border-right:1px solid var(--walnut);display:flex;flex-direction:column;min-width:0}
.rail-head{padding:12px 14px;border-bottom:1px solid var(--walnut);display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--n5);height:32px;padding:0 10px}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0}
.tabs{display:flex;gap:0}
.tab{padding:5px 12px;border:1px solid var(--n5);margin-right:-1px;font-size:12px;font-weight:600;color:var(--n7)}
.tab.on{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.rail-body{overflow-y:auto;flex:1}
.row{width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--n3);display:flex;gap:12px;align-items:flex-start;animation:rowIn .4s both;border-left:2px solid transparent}
.row:hover{background:var(--n2)}
.row.on{background:var(--m50);border-left-color:var(--m700)}
.row .t{font-weight:600;letter-spacing:-.01em}
.row .s{color:var(--n7);font-size:12px;margin-top:2px}
.row .r{margin-left:auto;text-align:right;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--n5);display:inline-block;margin-top:6px;flex:none}
.dot.bad{background:var(--s2);animation:blink 1.6s infinite}
.dot.ok{background:var(--s1)}
.detail-panel{padding:26px 30px;min-width:0;animation:fadeIn .3s}
.detail-title{font-size:30px;font-weight:500;letter-spacing:-.04em;line-height:1.15;margin-top:6px}
.kvs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--walnut);margin:20px 0}
.kvs>div{padding:12px 14px;border-right:1px solid var(--walnut)}
.kvs>div:last-child{border-right:none}
.kvs b{display:block;font-size:16px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.sec{margin-top:24px}
.sec h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--n7);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--walnut);margin-bottom:4px}
.line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--n3)}
.line .l{color:var(--n7)}
.log{position:relative;padding-left:18px;border-left:1px solid var(--walnut);margin-left:4px}
.log>div{position:relative;padding:0 0 14px 8px}
.log>div::before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;background:var(--n0);border:1px solid var(--walnut)}
.log>div.fail::before{background:var(--s2);border-color:var(--s2)}
.log>div.pass::before{background:var(--s1);border-color:var(--s1)}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--n5);padding:0 7px;height:20px;font-size:11px;font-weight:600;color:var(--n8);background:var(--n0)}
.badge.fail{background:var(--s2-bg);color:var(--s2-text);border-color:var(--s2)}
.badge.pass{background:var(--s1-bg);color:var(--s1-text);border-color:var(--s1)}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--walnut);padding:3px 4px 3px 10px;font-weight:500}
.tag button{width:20px;height:20px;display:grid;place-items:center;color:var(--n7)}
.tag button:hover{background:var(--n2)}
.tag.ghost{border-color:var(--n5);border-style:dashed;padding-right:10px;color:var(--n7)}
.field{margin-top:12px}
.field label{display:block;margin-bottom:5px}
.inp{width:100%;height:34px;border:1px solid var(--walnut);background:var(--n0);padding:0 10px;outline:none}
.inp:focus{border-color:var(--m700)}
textarea.inp{height:70px;padding:8px 10px;resize:none}
.matrix{width:100%;border-collapse:collapse;margin-top:6px}
.matrix th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--n7);font-weight:600;text-align:center;padding:8px 6px;border-bottom:1px solid var(--walnut)}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td{padding:9px 6px;border-bottom:1px solid var(--n3);text-align:center}
.cell{width:22px;height:22px;border:1px solid var(--walnut);display:inline-grid;place-items:center;color:transparent;transition:background .15s}
.cell.on{background:var(--n10);color:var(--n0)}
.cell.dis{border-color:var(--n4);cursor:not-allowed}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--walnut);margin-top:10px}
.bars>div{flex:1;background:var(--m600);transform-origin:bottom;animation:barGrow .7s both;position:relative}
.bars>div.low{background:var(--n4)}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--n7)}
.log-table{width:100%;border-collapse:collapse;margin-top:6px}
.log-table td,.log-table th{padding:9px 8px;border-bottom:1px solid var(--n3);text-align:left;vertical-align:top}
.log-table th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--n7);font-weight:600;border-bottom:1px solid var(--walnut)}
.diff{color:var(--n7)}
.diff b{color:var(--n10)}
.overlay{position:fixed;inset:0;background:rgba(64,58,52,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;animation:fadeIn .15s}
.overlay.center{align-items:center;padding-top:0}
.modal{width:480px;max-width:92%;background:var(--n0);border:1px solid var(--walnut);padding:26px;animation:slideUp .25s}
.cmdk{width:560px;max-width:92%;background:var(--n0);border:1px solid var(--walnut);animation:slideUp .2s}
.cmdk input{width:100%;height:50px;border:none;border-bottom:1px solid var(--walnut);padding:0 18px;font-size:15px;outline:none;background:var(--n0)}
.cmdk-item{width:100%;text-align:left;padding:11px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--n3)}
.cmdk-item.on,.cmdk-item:hover{background:var(--m50);color:var(--m700)}
.toast{position:fixed;right:28px;bottom:28px;background:var(--n10);color:var(--n0);padding:12px 18px;z-index:100;animation:slideUp .3s;display:flex;gap:10px;align-items:center}
.note{display:flex;gap:10px;border:1px solid var(--n5);padding:10px 12px;color:var(--n8);margin-top:14px;background:var(--n0)}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;width:100%}.md{grid-template-columns:1fr}.strip{flex-wrap:wrap}.strip>div{flex:1 1 45%}.kvs{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}}
</style>

            <div className="tagrow">{p.tags.map(t=><span key={t} className="tag">{t}<button aria-label="태그 삭제" onClick={()=>edit(ts=>ts.filter(x=>x!==t))}><i className="ph ph-x"/></button></span>)}</div>
          </div>
          {p.need.length>0&&<div className="sec"><h3>제안 태그</h3><div className="tagrow">{p.need.map(t=><button key={t} className="tag ghost" onClick={()=>edit(ts=>ts.includes(t)?ts:[...ts,t])}><i className="ph ph-plus"/>{t}</button>)}</div></div>}
          <div className="sec"><h3>사전에서 추가</h3>
            <div style={{display:'flex',gap:10,marginTop:8}}>
              <select className="inp" style={{maxWidth:240}} value={add} onChange={e=>setAdd(e.target.value)}>{DICT.map(d=><option key={d}>{d}</option>)}</select>
              <button className="btn" onClick={()=>edit(ts=>ts.includes(add)?ts:[...ts,add])}><i className="ph ph-plus"/>태그 추가</button>
            </div>
          </div>
          <div className="actions">
            <button className="btn btn-primary" onClick={()=>verdict('ok')}><i className="ph ph-check"/>검수 승인</button>
            <button className="btn" onClick={()=>verdict('no')}>반려하고 보완 요청</button>
          </div>
          <div className="note" style={{marginTop:22}}><i className="ph ph-user-circle" style={{fontSize:18}}/><span>등록자는 태그를 붙이고, 검수자는 예외만 확인하며, 승인 확정은 총괄 관리자만 가능합니다.</span></div>
        </section>
      </div>
    </div>
  );
}

/* ---- 권한·이력 ---- */
function AuditPage({toast}){
  const [roles,setRoles]=useState(ROLES0);
  const [sel,setSel]=useState('R4');
  const [log,setLog]=useState(LOG0);
  const [why,setWhy]=useState('');
  const [draft,setDraft]=useState(null);
  const r=roles.find(x=>x.id===sel);
  const perm=draft||r.perm;
  const dirty=draft&&JSON.stringify(draft)!==JSON.stringify(r.perm);
  useEffect(()=>{setDraft(null);setWhy('');},[sel]);
  const flip=(i,j)=>{if(r.id==='R1')return;const d=perm.map(x=>[...x]);d[i][j]=d[i][j]?0:1;setDraft(d);};
  const save=()=>{
    if(why.trim().length<5){toast('변경 사유를 5자 이상 입력해 주세요');return;}
    const ch=[];perm.forEach((row,i)=>row.forEach((v,j)=>{if(v!==r.perm[i][j])ch.push([RES[i]+' · '+OPS[j],OPS[j]+': '+(r.perm[i][j]?'허용':'해제'),OPS[j]+': '+(v?'허용':'해제')]);}));
    setLog([...ch.map(c=>['10.07 14:12','이도윤 (최고 관리자)',r.name+' · '+c[0],c[1],c[2],why]),...log]);
    setRoles(roles.map(x=>x.id===r.id?{...x,perm}:x));setDraft(null);setWhy('');toast('변경 전후 값과 사유가 이력에 기록됩니다');
  };
  return (
    <div>
      <div className="page-head"><div><div className="eyebrow">ACCESS & AUDIT</div><h1 className="display" style={{marginTop:10}}>직무 권한과 변경 이력</h1><p>권한은 서버에서 한 번 더 확인되며, 모든 변경은 변경 전후 값·담당자·사유와 함께 남습니다.</p></div></div>
      <div className="md" style={{minHeight:420}}>
        <div className="list-rail">
          <div className="rail-head"><div className="eyebrow">직무</div></div>
          <div className="rail-body">
            {roles.map((x,i)=><button key={x.id} className={'row '+(sel===x.id?'on':'')} style={{animationDelay:i*60+'ms'}} onClick={()=>setSel(x.id)}>
              <i className="ph ph-key" style={{fontSize:18,color:'var(--n8)',marginTop:2}}/>
              <div><div className="t">{x.name}</div><div className="s">담당자 {x.who}명</div></div>
              <div className="r"><span className="badge">{x.perm.flat().filter(Boolean).length}/24</span></div>
            </button>)}
          </div>
        </div>
        <section className="detail-panel" key={sel}>
          <div className="eyebrow">{r.id}</div>
          <h2 className="detail-title">{r.name} 권한</h2>
          <table className="matrix"><thead><tr><th>대상</th>{OPS.map(o=><th key={o}>{o}</th>)}</tr></thead>
            <tbody>{RES.map((res,i)=><tr key={res}><td>{res}</td>{OPS.map((o,j)=>{const lock=r.id==='R1';return <td key={o}><button className={'cell '+(perm[i][j]?'on':'')+(lock?' dis':'')} aria-label={res+' '+o} onClick={()=>flip(i,j)}><i className="ph ph-check" style={{fontSize:13}}/></button></td>;})}</tr>)}</tbody>
          </table>
          {r.id==='R1'?<div className="note"><i className="ph ph-lock-key" style={{fontSize:18}}/><span>최고 관리자 권한은 이 화면에서 변경할 수 없습니다.</span></div>:
          <div className="field"><label className="eyebrow">변경 사유 (필수)</label><textarea className="inp" value={why} onChange={e=>setWhy(e.target.value)} placeholder="예: 고객 문의 응대를 위해 보기 권한이 필요합니다"/></div>}
          <div className="actions"><button className="btn btn-primary" disabled={!dirty||r.id==='R1'} onClick={save}><i className="ph ph-floppy-disk"/>변경 저장</button><button className="btn" disabled={!dirty} onClick={()=>setDraft(null)}>되돌리기</button></div>
        </section>
      </div>
      <div className="sec" style={{marginTop:30}}><h3>변경 이력</h3>
        <table className="log-table"><thead><tr><th>일시</th><th>담당자</th><th>대상</th><th>변경 전</th><th>변경 후</th><th>사유</th></tr></thead>
          <tbody>{log.map((l,i)=><tr key={i} style={{animation:'rowIn .4s both',animationDelay:i*40+'ms'}}><td className="num">{l[0]}</td><td>{l[1]}</td><td>{l[2]}</td><td className="diff">{l[3]}</td><td><b>{l[4]}</b></td><td className="diff">{l[5]}</td></tr>)}</tbody></table>
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState('main');
  const [cmd,setCmd]=useState(false);
  const [cq,setCq]=useState('');
  const [t,toast]=useToast();
  const NAV=[['main','처리 현황 대시보드','squares-four',null],['subscription','정기배송 회차·결제 실패 재처리','arrows-clockwise',3],['tags','맞춤 태그 검수','tag',82],['audit','직무 권한·변경 이력','shield-check',null]];
  useEffect(()=>{
    const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(c=>!c);}if(e.key==='Escape')setCmd(false);};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);
  const go=v=>{setView(v);setCmd(false);setCq('');window.scrollTo(0,0);};
  const cur=NAV.find(n=>n[0]===view);
  const cmds=[...NAV.map(n=>({k:n[0],l:n[1]+' 이동',i:n[2]})),{k:'subscription',l:'결제 실패 회차 바로 보기',i:'warning-circle'}].filter(c=>c.l.includes(cq));
  return (
    <div className="app" id="app-shell">
      <aside className="sidebar" data-sidebar style={{width:260}}>
        <div className="sidebar-brand"><div className="brand-mark"><i className="ph ph-paw-print"/></div><div><div className="brand-name">포근펫 운영 콘솔</div><div className="brand-sub">Back Office</div></div></div>
        <button className="sidebar-cmdk-hint" data-cmdk-trigger onClick={()=>setCmd(true)}><i className="ph ph-magnifying-glass"/>빠른 이동<kbd>⌘K</kbd></button>
        <div className="sidebar-section-title eyebrow">운영</div>
        <nav className="sidebar-nav">
          {NAV.map(([id,label,ic,n])=><a key={id} href="#" className={'sidebar-link '+(view===id?'on':'')} onClick={e=>{e.preventDefault();go(id);}}><i className={'ph ph-'+ic}/><span>{label}</span>{n&&<span className="cnt num">{n}</span>}</a>)}
        </nav>
        <div className="sidebar-section-title eyebrow">정책 기준표</div>
        <nav className="sidebar-nav">
          <a href="#" className="sidebar-link" onClick={e=>{e.preventDefault();toast('할인 구간: 5만·8만·15만원 초과 시 7·10·12%');}}><i className="ph ph-percent"/><span>정기배송 할인 구간</span></a>
          <a href="#" className="sidebar-link" onClick={e=>{e.preventDefault();toast('적립금: 주문당 결제금액 30% 한도');}}><i className="ph ph-coins"/><span>적립금 사용 규칙</span></a>
          <a href="#" className="sidebar-link" onClick={e=>{e.preventDefault();toast('알림톡 템플릿: 결제 예정·실패·배송 안내');}}><i className="ph ph-chat-circle-text"/><span>알림톡 템플릿</span></a>
          <a href="#" className="sidebar-link" onClick={e=>{e.preventDefault();toast('백업: 일 1회 · 복구 리허설 분기 1회');}}><i className="ph ph-database"/><span>백업·복구 기준</span></a>
        </nav>
        <div className="sidebar-user"><div className="ava">이</div><div><div style={{fontWeight:600}}>이도윤</div><div className="eyebrow">최고 관리자</div></div></div>
      </aside>
      <main className="main">
        <header className="topbar" style={{height:56}}>
          <nav className="breadcrumb"><a href="#" onClick={e=>{e.preventDefault();go('main');}}>포근펫</a><span className="divider">/</span><a href="#" onClick={e=>{e.preventDefault();go('main');}}>운영</a><span className="divider">/</span><b>{cur[1]}</b></nav>
          <div className="topbar-actions">
            <button className="btn btn-cmdk" onClick={()=>setCmd(true)}><i className="ph ph-command"/>K</button>
            <button className="btn btn-primary" onClick={()=>go('subscription')}><i className="ph ph-arrows-clockwise"/>실패 건 처리</button>
          </div>
        </header>
        <div className="content" key={view}>
          {view==='main'&&<Dashboard go={go} toast={toast}/>}
          {view==='subscription'&&<SubPage toast={toast}/>}
          {view==='tags'&&<TagPage toast={toast}/>}
          {view==='audit'&&<AuditPage toast={toast}/>}
          <div style={{marginTop:36,color:'var(--n7)',fontSize:11}}>© 2026 포근펫 샘플 몰 — 자체 개발 프로젝트 데모</div>
        </div>
      </main>
      {cmd&&<div className="overlay" onClick={()=>setCmd(false)}><div className="cmdk" onClick={e=>e.stopPropagation()}>
        <input autoFocus placeholder="이동할 화면이나 작업을 입력하세요" value={cq} onChange={e=>setCq(e.target.value)}/>
        {cmds.map(c=><button key={c.l} className="cmdk-item" onClick={()=>go(c.k)}><i className={'ph ph-'+c.i} style={{fontSize:18}}/>{c.l}</button>)}
        {cmds.length===0&&<div style={{padding:18,color:'var(--n7)'}}>일치하는 항목이 없습니다.</div>}
      </div></div>}
      {t&&<div className="toast"><i className="ph ph-check-circle"/>{t}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
