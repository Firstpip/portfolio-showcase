  --m50:#eeeeee;
  --m100:#eeeeee;
  --m200:#eeeeee;
  --m300:#dcdcdd;
  --m400:#bababa;
  --m500:#8f8f90;
  --m600:#606062;
  --m700:#343435;
  --m800:#070709;
  --m900:#060607;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#ffffff;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b5b5ba;
  --n6:#8b8b8b;
  --n7:#71717a;
  --n8:#53535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--n0);color:var(--n9);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit;text-align:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
i.ti{font-size:16px;line-height:1;flex:none}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.shell{display:flex;width:100%;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:20}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--n3);font-weight:700;color:var(--n10)}
.ws-mark{width:26px;height:26px;border-radius:7px;background:var(--m800);color:var(--n1);display:grid;place-items:center}
.ws-sub{font-size:11px;font-weight:500;color:var(--n7)}
.sidebar-search{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.search-btn,.quick-add{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--n8);width:100%;transition:background .12s}
.search-btn:hover,.quick-add:hover{background:var(--n2)}
.search-btn kbd{margin-left:auto;font-size:11px;color:var(--n6);border:1px solid var(--n4);border-radius:4px;padding:0 5px}
.tree-nav{flex:1;overflow-y:auto;padding:4px 8px}
.tree-item{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:7px;color:var(--n8);font-size:13px;transition:background .12s,color .12s}
.tree-item:hover{background:var(--n2);color:var(--n10)}
.tree-item.l0{padding-left:8px;font-weight:600;color:var(--n10);margin-top:8px}
.tree-item.l1{padding-left:28px}
.tree-item.l2{padding-left:48px}
.tree-item.l3{padding-left:56px}
.tree-item.on{background:var(--n3);color:var(--n10);font-weight:600}
.tree-toggle{width:14px;display:inline-flex;transition:transform .15s;color:var(--n6)}
.tree-toggle.open{transform:rotate(90deg)}
.tree-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-count{font-size:11px;color:var(--n6)}
.sidebar-footer{border-top:1px solid var(--n3);padding:10px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--n9);color:var(--n1);display:grid;place-items:center;font-size:11px;font-weight:700}
.content{margin-left:240px;flex:1;min-width:0;width:calc(100% - 240px);display:flex;flex-direction:column;min-height:100vh}
.page-breadcrumb{display:flex;align-items:center;gap:6px;padding:12px 24px;border-bottom:1px solid var(--n3);background:var(--n1);color:var(--n7);font-size:12.5px;position:sticky;top:0;z-index:10}
.page-breadcrumb b{color:var(--n10);font-weight:600}
.crumb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--n4);background:var(--n1);color:var(--n9);transition:background .12s,border-color .12s,transform .1s,opacity .12s}
.btn:hover{background:var(--n2);border-color:var(--n6)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tree-item:focus-visible,.row:focus-visible,.chip-x:focus-visible{outline:2px solid var(--m800);outline-offset:2px}
.btn.primary{background:var(--m800);border-color:var(--m800);color:var(--n1)}
.btn.primary:hover{background:var(--m700)}
.btn.danger{color:var(--s2-text);border-color:var(--n4)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.icon{padding:5px 7px}
.workarea{display:flex;flex:1;min-height:0}
.list-rail{width:310px;flex:none;border-right:1px solid var(--n3);background:var(--n1);display:flex;flex-direction:column;position:sticky;top:45px;height:calc(100vh - 45px)}
.rail-head{padding:12px;border-bottom:1px solid var(--n3);display:flex;flex-direction:column;gap:8px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);border-radius:8px;padding:6px 10px;background:var(--n1);transition:border-color .12s}
.field:focus-within{border-color:var(--n9)}
.field input{border:0;outline:0;flex:1;background:transparent;min-width:0}
.seg{display:flex;gap:2px;background:var(--n2);border-radius:8px;padding:2px}
.seg button{flex:1;text-align:center;padding:4px 6px;border-radius:6px;font-size:12px;color:var(--n8)}
.seg button.on{background:var(--n1);color:var(--n10);font-weight:600;box-shadow:0 1px 2px rgba(30,30,32,.12)}
.rail-list{flex:1;overflow-y:auto}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--n2);width:100%;animation:rowIn .3s both;transition:background .12s}
.row:hover{background:var(--n0)}
.row.on{background:var(--n2);box-shadow:inset 3px 0 0 var(--m800)}
.row .t{font-weight:600;color:var(--n10);font-size:13px}
.row .s{font-size:12px;color:var(--n7)}
input[type=checkbox]{accent-color:var(--m800);width:15px;height:15px;margin-top:3px;flex:none}
.rail-foot{padding:10px 12px;border-top:1px solid var(--n3);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--n7)}
.page{flex:1;min-width:0;overflow-y:auto}
.page-body{max-width:880px;margin:0 auto;padding:28px 32px 80px;animation:fadeIn .3s both}
.page-icon-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.page-icon-large{width:40px;height:40px;border-radius:10px;border:1px solid var(--n4);display:grid;place-items:center;background:var(--n1);color:var(--n9)}
.page-title{font-size:40px;line-height:1.12;font-weight:700;color:var(--n10);letter-spacing:-.04em}
.hero-art{height:132px;border-radius:12px;margin-bottom:20px;background:linear-gradient(135deg,var(--n3) 0%,var(--n1) 55%,var(--n2) 100%);border:1px solid var(--n3);overflow:hidden;position:relative}
.hero-art svg{width:100%;height:100%;display:block}
.hero-art .ln{stroke-dasharray:6 6;animation:dash 2.4s linear infinite}

.page-meta{display:flex;gap:14px;color:var(--n7);font-size:12.5px;margin:6px 0 18px;flex-wrap:wrap}
.block{position:relative;padding:6px 0}
.block-handle{position:absolute;left:-22px;top:9px;color:var(--n5);opacity:0;transition:opacity .12s;font-size:13px}
.block:hover .block-handle{opacity:1}
.block h2{font-size:17px;font-weight:700;color:var(--n10);margin-top:14px;letter-spacing:-.01em}
.block p{color:var(--n8)}
.callout{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--n4);background:var(--n1);border-radius:10px}
.callout.warn{background:var(--s3-bg);border-color:var(--n4)}
.callout.warn i{color:var(--s3-text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--n4);border-radius:7px;background:var(--n1);font-size:12.5px;animation:popIn .2s both}
.chip.flat{padding:3px 10px}
.chip-x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--n7)}
.chip-x:hover{background:var(--n3);color:var(--n10)}
.chip-x i{font-size:12px}
.add-chip{border-style:dashed;color:var(--n7);padding:3px 10px;cursor:pointer;background:transparent}
.add-chip:hover{color:var(--n10);border-color:var(--n8)}
.select-inline{border:1px solid var(--n4);border-radius:7px;padding:3px 8px;background:var(--n1)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--n7);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--n4);background:var(--n1);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--n3);vertical-align:middle}
tr.trow{animation:rowIn .3s both}
tr.trow:hover td{background:var(--n1)}
.tbl{border:1px solid var(--n3);border-radius:10px;overflow:hidden;background:var(--n1)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.bad{background:var(--s2-bg);color:var(--s2-text)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.badge.dark{background:var(--n10);color:var(--n1)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;animation:pulse 1.5s infinite}
.toggle-row{display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;padding:4px 0;color:var(--n10);font-weight:600}
.toggle-arrow{transition:transform .15s;display:inline-flex}
.toggle-arrow.open{transform:rotate(90deg)}
.toggle-content{padding:6px 0 6px 24px;color:var(--n8)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--n3);border-radius:10px;background:var(--n1);padding:14px}

.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}

.input{border:1px solid var(--n4);border-radius:8px;padding:7px 10px;background:var(--n1);width:100%;outline:0;transition:border-color .12s,box-shadow .12s}

.switch{width:32px;height:18px;border-radius:10px;background:var(--n4);position:relative;transition:background .15s;flex:none}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--n1);transition:transform .15s}
.switch.on{background:var(--m800)}
.switch.on::after{transform:translateX(14px)}
.pin{color:var(--n6)}
.pin.on{color:var(--n10)}
.bar{height:6px;border-radius:4px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m800);border-radius:4px;animation:barGrow .9s ease-out both}
.stat-row{display:flex;gap:10px;margin:8px 0 14px}
.stat{flex:1;border:1px solid var(--n3);border-radius:10px;padding:10px 12px;background:var(--n1)}
.stat .k{font-size:12px;color:var(--n7)}
.stat .v{font-size:20px;font-weight:700;color:var(--n10);font-variant-numeric:tabular-nums}
.spinner{width:13px;height:13px;border-radius:50%;border:2px solid var(--n4);border-top-color:var(--n10);animation:spin .7s linear infinite;display:inline-block}
.scrim{position:fixed;inset:0;background:rgba(30,30,32,.4);z-index:60;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s both}
.modal{width:480px;max-width:92%;background:var(--n1);border-radius:12px;padding:20px;animation:popIn .2s both;box-shadow:0 24px 60px rgba(30,30,32,.25)}
.modal h3{font-size:16px;color:var(--n10);margin-bottom:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n1);padding:10px 16px;border-radius:9px;z-index:90;display:flex;align-items:center;gap:8px;animation:popIn .2s both}
.preview-box{border:1px dashed var(--n5);border-radius:10px;padding:12px;background:var(--n0)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{padding:34px;text-align:center;color:var(--n7)}
.drag-hint{font-size:12px;color:var(--n7)}

/* design-ref(Letters) 반영: 알약형 버튼·18px 카드·큰 디스플레이 타이포·하늘빛 분위기 히어로(무채색 그라데이션) */
.page-title{font-size:56px;line-height:1.02;letter-spacing:-.04em;font-weight:600}
.btn,.seg,.seg button,.badge,.chip,.field,.switch{border-radius:100px}
.card,.tbl,.stat,.callout,.preview-box,.modal{border-radius:18px}
.card,.stat,.tbl{box-shadow:0 1px 2px rgba(30,30,32,.05),0 8px 24px rgba(30,30,32,.04)}
.hero-art{height:190px;border-radius:18px;background:radial-gradient(120% 140% at 50% 0%,var(--n4) 0%,var(--n2) 45%,var(--n0) 100%)}
.page-meta{font-size:14px;margin-bottom:22px}
.block h2{font-size:22px;letter-spacing:-.03em;font-weight:600}
.stat .v{font-size:32px;letter-spacing:-.04em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:900px){.sidebar{display:none}.content{margin-left:0;width:100%}.list-rail{display:none}.grid2{grid-template-columns:1fr}.page-body{padding:18px}}
</style>

/* ───── 1. 작가·카테고리 매핑 (master-detail) ───── */
function MappingView({books,setBooks,authors,toast}){
  const [sel,setSel]=useState(1);
  const [q,setQ]=useState('');
  const [typ,setTyp]=useState('전체');
  const [checked,setChecked]=useState([]);
  const [open,setOpen]=useState(false);
  const [bulk,setBulk]=useState(false);
  const [bulkAuthor,setBulkAuthor]=useState('a1');
  const [saving,setSaving]=useState(false);
  const list=books.filter(b=>(typ==='전체'||b.type===typ)&&(!q||b.title.includes(q)));
  const cur=books.find(b=>b.id===sel);
  const patch=(id,fn)=>setBooks(bs=>bs.map(b=>b.id===id?fn(b):b));
  const addAuthor=(id)=>{patch(sel,b=>b.authors.includes(id)?b:{...b,authors:[...b.authors,id]})};
  const save=()=>{setSaving(true);setTimeout(()=>{setSaving(false);toast('매핑을 한 번의 트랜잭션으로 저장했습니다')},900)};
  const applyBulk=()=>{setBooks(bs=>bs.map(b=>checked.includes(b.id)&&!b.authors.includes(bulkAuthor)?{...b,authors:[...b.authors,bulkAuthor]}:b));setBulk(false);toast(checked.length+'권에 '+authorName(authors,bulkAuthor)+' 작가를 일괄 배정했습니다');setChecked([])};
  const dup=authors.filter(a=>authors.some(o=>o.id!==a.id&&o.name===a.name));
  const unmapped=books.filter(b=>b.authors.length===0).length;
  return <div className="workarea">
    <div className="list-rail">
      <div className="rail-head">
        <div className="field"><I n="search"/><input placeholder="도서 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <div className="seg">{['전체','교과서','참고서','단행본'].map(t=><button key={t} className={typ===t?'on':''} onClick={()=>setTyp(t)}>{t}</button>)}</div>
      </div>
      <div className="rail-list">
        {list.length===0&&<div className="empty">조건에 맞는 도서가 없습니다</div>}
        {list.map((b,i)=><div key={b.id} style={{display:'flex',alignItems:'flex-start',gap:0}}>
          <label style={{padding:'12px 0 0 12px'}}><input type="checkbox" checked={checked.includes(b.id)} onChange={()=>setChecked(c=>c.includes(b.id)?c.filter(x=>x!==b.id):[...c,b.id])}/></label>
          <button className={'row'+(sel===b.id?' on':'')} style={{animationDelay:i*30+'ms'}} onClick={()=>setSel(b.id)}>
            <div style={{flex:1,minWidth:0}}><div className="t">{b.title}</div><div className="s">{b.type} · {b.authors.length?b.authors.map(a=>authors.find(x=>x.id===a)?.name).join(', '):'작가 미배정'}</div></div>
            {b.authors.length===0&&<span className="badge warn">미배정</span>}
          </button></div>)}
      </div>
      <div className="rail-foot"><span>{checked.length}권 선택</span><button className="btn sm primary" disabled={!checked.length} onClick={()=>setBulk(true)}><I n="users-plus"/>일괄 배정</button></div>
    </div>
    <div className="page"><div className="page-body" style={{maxWidth:880}}>
      <Hero/><div className="page-icon-row"><span className="page-icon-large"><I n="book-2" s={20}/></span><span className="badge dark">{cur.type}</span><span className={'badge '+(cur.pub?'ok':'')}>{cur.pub?'노출 중':'비노출'}</span></div>
      <h1 className="page-title">{cur.title}</h1>
      <div className="page-meta"><span><I n="calendar"/> 최종 수정 2026.10.06</span><span><I n="user"/> 편집 담당 김지원</span><span>도서 ID {String(cur.id).padStart(4,'0')}</span></div>

      <div className="block" data-block-type="callout">
        <div className={'callout'+(unmapped?' warn':'')}><I n="info-circle" s={18}/><div><b>전체 {books.length}권 중 작가 미배정 {unmapped}권</b><div style={{color:'var(--n7)'}}>작가가 없는 도서는 통합 검색에서 작가명으로 찾을 수 없습니다. 좌측 목록에서 미배정 배지를 먼저 처리하세요.</div></div></div>
      </div>

      <div className="block" data-block-type="heading-2"><span className="block-handle"><I n="grip-vertical"/></span><h2>작가 연결 (N:M)</h2></div>
      <div className="block" data-block-type="text"><span className="block-handle"><I n="grip-vertical"/></span>
        <div className="chips">
          {cur.authors.map(id=><span className="chip" key={id}>{authorName(authors,id)}<button className="chip-x" aria-label="연결 해제" onClick={()=>patch(sel,b=>({...b,authors:b.authors.filter(x=>x!==id)}))}><I n="x"/></button></span>)}
          {cur.authors.length===0&&<span style={{color:'var(--n7)'}}>연결된 작가가 없습니다</span>}
          <button className="chip add-chip" onClick={()=>setOpen(o=>!o)}><I n="plus"/> 작가 추가</button>
        </div>
        {open&&<div className="card" style={{marginTop:8,padding:6,maxWidth:340,animation:'popIn .15s both'}}>{authors.map(a=><button key={a.id} className="tree-item" style={{paddingLeft:8}} onClick={()=>{addAuthor(a.id);setOpen(false)}}><span className="tree-label">{a.name} <span style={{color:'var(--n6)'}}>{a.born}년생 · {a.note}</span></span></button>)}</div>}
      </div>

      <div className="block" data-block-type="heading-2"><h2>카테고리(장르) 다중 매핑</h2></div>
      <div className="block" data-block-type="text">
        <div className="chips">
          {CATS.map(c=>{const on=cur.cats.includes(c);return <button key={c} className={'chip flat'} style={{background:on?'var(--m800)':'var(--n1)',color:on?'var(--n1)':'var(--n8)',borderColor:on?'var(--m800)':'var(--n4)'}} onClick={()=>patch(sel,b=>({...b,cats:on?b.cats.filter(x=>x!==c):[...b.cats,c]}))}>{on&&<I n="check" s={13}/>}{c}</button>})}
        </div>
      </div>

      <hr/>
      <div className="block" data-block-type="heading-2"><h2>같은 작가의 다른 도서</h2></div>
      <div className="block" data-block-type="table"><div className="tbl"><table>
        <thead><tr><th>도서</th><th>유형</th><th>카테고리</th></tr></thead>
        <tbody>{books.filter(b=>b.id!==cur.id&&b.authors.some(a=>cur.authors.includes(a))).map((b,i)=><tr className="trow" key={b.id} style={{animationDelay:i*40+'ms'}}><td><button style={{fontWeight:600}} onClick={()=>setSel(b.id)}>{b.title}</button></td><td>{b.type}</td><td>{b.cats.join(' · ')}</td></tr>)}
        {!books.some(b=>b.id!==cur.id&&b.authors.some(a=>cur.authors.includes(a)))&&<tr><td colSpan="3" style={{color:'var(--n7)'}}>공통 작가를 가진 다른 도서가 없습니다</td></tr>}</tbody></table></div></div>

      <div className="block" data-block-type="callout" style={{marginTop:10}}>
        <div className="callout warn"><I n="alert-triangle" s={18}/><div><b>동명이인 후보 {dup.length/2|0}건</b><div style={{color:'var(--n7)'}}>‘한서윤’이 생년 1981·1992로 두 명 등록되어 있습니다. 병합하기 전에 생년과 대표 저서를 확인하세요.</div></div></div>
      </div>

      <div className="block" data-block-type="list"><ul style={{marginLeft:18,color:'var(--n8)'}}><li>저장하면 도서-작가, 도서-카테고리 매핑을 한 번의 트랜잭션으로 반영합니다.</li><li>일괄 배정 중 하나라도 실패하면 전체가 되돌려집니다.</li></ul></div>
      <div style={{display:'flex',gap:8,marginTop:14}}><button className="btn primary" disabled={saving} onClick={save}>{saving?<span className="spinner" style={{borderTopColor:'var(--n1)'}}/>:<I n="device-floppy"/>}{saving?'저장 중':'매핑 저장'}</button><button className="btn" onClick={()=>toast('변경 내용을 되돌렸습니다')}><I n="arrow-back-up"/>되돌리기</button></div>
    </div></div>
    {bulk&&<div className="scrim" onClick={()=>setBulk(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>선택한 {checked.length}권에 작가 일괄 배정</h3>
      <div className="form-row"><label>배정할 작가</label><select className="input" value={bulkAuthor} onChange={e=>setBulkAuthor(e.target.value)}>{authors.map(a=><option key={a.id} value={a.id}>{a.name} ({a.born})</option>)}</select></div>
      <div className="preview-box" style={{fontSize:12.5}}>{books.filter(b=>checked.includes(b.id)).map(b=><div key={b.id}>· {b.title}</div>)}</div>
      <div className="modal-foot"><button className="btn" onClick={()=>setBulk(false)}>취소</button><button className="btn primary" onClick={applyBulk}>배정 적용</button></div>
    </div></div>}
  </div>;
}

/* ───── 2. 작가 마스터 ───── */
function AuthorsView({authors,setAuthors,toast}){
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [csv,setCsv]=useState(false);
  const [step,setStep]=useState(0);
  const [form,setForm]=useState({name:'',born:'',note:''});
  const list=authors.filter(a=>!q||a.name.includes(q)||a.note.includes(q));
  const submit=()=>{if(!form.name.trim()){toast('작가명을 입력하세요');return}setAuthors(a=>[...a,{id:'a'+(a.length+1+Math.random()*100|0),name:form.name.trim(),born:+form.born||0,works:0,note:form.note||'-'}]);setModal(null);setForm({name:'',born:'',note:''});toast('작가를 등록했습니다')};
  const runCsv=()=>{setStep(1);setTimeout(()=>setStep(2),1300)};
  return <div className="page"><div className="page-body" style={{maxWidth:880}}>
    <Hero/><div className="page-icon-row"><span className="page-icon-large"><I n="users" s={20}/></span></div>
    <h1 className="page-title">작가 마스터</h1>
    <div className="page-meta"><span>세 사이트의 작가를 한 곳에서 관리합니다</span></div>
    <div className="stat-row"><div className="stat"><div className="k">등록 작가</div><div className="v">{authors.length}</div></div><div className="stat"><div className="k">동명이인 후보</div><div className="v">1</div></div><div className="stat"><div className="k">연결 도서</div><div className="v">{authors.reduce((s,a)=>s+a.works,0)}</div></div></div>
    <div className="block" data-block-type="text" style={{display:'flex',gap:8,marginBottom:10}}>
      <div className="field" style={{flex:1}}><I n="search"/><input placeholder="작가명 또는 메모 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <button className="btn" onClick={()=>{setCsv(true);setStep(0)}}><I n="file-import"/>CSV 가져오기</button>
      <button className="btn primary" onClick={()=>setModal(true)}><I n="plus"/>작가 등록</button>
    </div>
    <div className="block" data-block-type="table"><div className="tbl"><table>
      <thead><tr><th>작가명</th><th>생년</th><th>연결 도서</th><th>메모</th><th></th></tr></thead>
      <tbody>{list.map((a,i)=><tr className="trow" key={a.id} style={{animationDelay:i*30+'ms'}}><td style={{fontWeight:600}}>{a.name}{authors.some(o=>o.id!==a.id&&o.name===a.name)&&<span className="badge warn" style={{marginLeft:6}}>동명이인</span>}</td><td className="mono">{a.born||'-'}</td><td>{a.works}권</td><td style={{color:'var(--n7)'}}>{a.note}</td><td style={{textAlign:'right'}}><button className="btn sm danger" onClick={()=>{setAuthors(x=>x.filter(y=>y.id!==a.id));toast(a.name+' 작가를 삭제했습니다')}}>삭제</button></td></tr>)}</tbody></table></div></div>
    {modal&&<div className="scrim" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><h3>작가 등록</h3>
      <div className="form-row"><label>작가명</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="예: 김하늘"/></div>
      <div className="form-row"><label>생년</label><input className="input" value={form.born} onChange={e=>setForm({...form,born:e.target.value})} placeholder="1985"/></div>
      <div className="form-row"><label>메모</label><input className="input" value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="대표 분야"/></div>
      <div className="modal-foot"><button className="btn" onClick={()=>setModal(null)}>취소</button><button className="btn primary" onClick={submit}>등록</button></div></div></div>}
    {csv&&<div className="scrim" onClick={()=>setCsv(false)}><div className="modal" onClick={e=>e.stopPropagation()}><h3>작가 목록 CSV 가져오기</h3>
      <div className="preview-box mono" style={{whiteSpace:'pre'}}>{'name,born,note\n김하늘,1985,초등 국어\n박서준,1979,중등 과학\n한서윤,1992,시 에세이'}</div>
      {step>=1&&<div style={{marginTop:12}}><div className="bar"><i style={{'--w':step===1?'60%':'100%'}}/></div>
        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:4}}>{step===1?<span><span className="spinner"/> 정합성 검증 중</span>:<><span><span className="badge ok">통과</span> 형식 오류 0건 · 필수값 누락 0건</span><span><span className="badge warn">확인</span> 기존 작가와 이름이 겹치는 행 1건(한서윤 · 생년 동일 시 병합 제안)</span></>}</div></div>}
      <div className="modal-foot"><button className="btn" onClick={()=>setCsv(false)}>닫기</button>{step===0&&<button className="btn primary" onClick={runCsv}>검증 실행</button>}{step===2&&<button className="btn primary" onClick={()=>{setAuthors(a=>[...a,{id:'c1',name:'김하늘',born:1985,works:0,note:'초등 국어'},{id:'c2',name:'박서준',born:1979,works:0,note:'중등 과학'}]);setCsv(false);toast('2명을 가져왔고 1건은 확인 대기로 남겼습니다')}}>가져오기</button>}</div></div></div>}
  </div></div>;
}

/* ───── 3. 자료 매핑·노출 제어 ───── */
function MaterialView({mats,setMats,toast}){
  const [selId,setSelId]=useState('m1');
  const cur=mats.find(m=>m.id===selId);
  const move=(id,d)=>setMats(ms=>{const i=ms.findIndex(m=>m.id===id);const j=i+d;if(j<0||j>=ms.length)return ms;const c=[...ms];[c[i],c[j]]=[c[j],c[i]];return c});
  const upd=(id,p)=>setMats(ms=>ms.map(m=>m.id===id?{...m,...p}:m));
  const ordered=[...mats.filter(m=>m.pinned),...mats.filter(m=>!m.pinned).sort((a,b)=>b.date.localeCompare(a.date))].filter(m=>m.main);
  const BK={1:'중학 국어 1-1',2:'중학 수학 2',3:'개념 잡는 수학',4:'완자 국어 문법',5:'바다가 들려준 이야기',6:'세계를 걷는 지도책',8:'과학 개념',9:'오늘의 시',10:'초등 사회 5-2'};
  return <div className="page"><div className="page-body" style={{maxWidth:880}}>
    <Hero/><div className="page-icon-row"><span className="page-icon-large"><I n="files" s={20}/></span></div>
    <h1 className="page-title">자료 매핑·노출 제어</h1>
    <div className="page-meta"><span>자료를 독립 등록하고 도서와 N:M으로 연결합니다</span></div>
    <div className="block" data-block-type="heading-2"><h2>자료 목록</h2></div>
    <div className="block" data-block-type="table"><div className="tbl"><table>
      <thead><tr><th>고정</th><th>자료</th><th>연결 도서</th><th>메인</th><th>자료실</th><th>순서</th></tr></thead>
      <tbody>{mats.map((m,i)=><tr className="trow" key={m.id} style={{animationDelay:i*40+'ms',background:selId===m.id?'var(--n2)':undefined}}>
        <td><button className={'btn icon sm pin'+(m.pinned?' on':'')} aria-label="상단 고정" onClick={()=>{upd(m.id,{pinned:!m.pinned});toast(m.pinned?'고정을 해제했습니다':'메인 상단에 고정했습니다')}}><I n={m.pinned?'pin-filled':'pin'}/></button></td>
        <td><button style={{fontWeight:600}} onClick={()=>setSelId(m.id)}>{m.name}</button><div style={{fontSize:12,color:'var(--n7)'}}>{m.ext} · {m.date}</div></td>
        <td>{m.books.length}권</td>
        <td><button className={'switch'+(m.main?' on':'')} aria-label="메인 노출" onClick={()=>upd(m.id,{main:!m.main})}/></td>
        <td><button className={'switch'+(m.room?' on':'')} aria-label="자료실 노출" onClick={()=>upd(m.id,{room:!m.room})}/></td>
        <td style={{whiteSpace:'nowrap'}}><button className="btn icon sm" aria-label="위로" onClick={()=>move(m.id,-1)}><I n="arrow-up"/></button> <button className="btn icon sm" aria-label="아래로" onClick={()=>move(m.id,1)}><I n="arrow-down"/></button></td></tr>)}</tbody></table></div></div>
    <div className="grid2" style={{marginTop:16}}>
      <div className="card"><div className="block" data-block-type="heading-2" style={{padding:0}}><h2 style={{marginTop:0}}>‘{cur.name}’ 연결 도서</h2></div>
        <div className="chips" style={{marginTop:8}}>{cur.books.map(id=><span className="chip" key={id}>{BK[id]}<button className="chip-x" aria-label="해제" onClick={()=>upd(cur.id,{books:cur.books.filter(x=>x!==id)})}><I n="x"/></button></span>)}
          <select className="select-inline" value="" onChange={e=>{const v=+e.target.value;if(v&&!cur.books.includes(v))upd(cur.id,{books:[...cur.books,v]})}}><option value="">+ 도서 연결</option>{Object.entries(BK).filter(([k])=>!cur.books.includes(+k)).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <p className="drag-hint" style={{marginTop:10}}>하나의 자료를 여러 도서에 연결하면 각 도서 상세에서 같은 자료를 내려받을 수 있습니다.</p></div>
      <div className="card"><div className="block" data-block-type="heading-2" style={{padding:0}}><h2 style={{marginTop:0}}>메인 노출 미리보기</h2></div>
        <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:8}}>{ordered.map((m,i)=><div key={m.id} className="chip flat" style={{borderRadius:8,padding:'6px 10px',justifyContent:'space-between',animationDelay:i*50+'ms'}}><span>{i+1}. {m.name}</span>{m.pinned?<span className="badge dark"><I n="pin-filled" s={11}/>고정</span>:<span className="badge">최신순</span>}</div>)}</div>
        <p className="drag-hint" style={{marginTop:10}}>고정 자료가 먼저, 나머지는 등록일 최신순으로 노출됩니다.</p></div>
    </div>
  </div></div>;
}

/* ───── 4. 게시판 유형 관리 ───── */
function BoardView({boards,setBoards,toast}){
  const [type,setType]=useState('general');
  const [name,setName]=useState('');
  const [opts,setOpts]=useState({comment:false,attach:true,secret:false});
  const [saving,setSaving]=useState(false);
  const bt=BOARD_TYPES.find(b=>b.k===type);
  const create=()=>{if(!name.trim()){toast('게시판 이름을 입력하세요');return}setSaving(true);setTimeout(()=>{setSaving(false);setBoards(b=>[...b,{id:Date.now(),name:name.trim(),type:bt.t,posts:0}]);setName('');toast('‘'+name.trim()+'’ 게시판을 생성했습니다')},800)};
  return <div className="page"><div className="page-body" style={{maxWidth:880}}>
    <Hero/><div className="page-icon-row"><span className="page-icon-large"><I n="layout-board" s={20}/></span></div>
    <h1 className="page-title">게시판 유형 관리</h1>
    <div className="page-meta"><span>유형을 고르고 옵션을 설정하면 새 게시판이 만들어집니다</span></div>
    <div className="block" data-block-type="heading-2"><h2>1. 유형 선택</h2></div>
    <div className="grid2" style={{gridTemplateColumns:'repeat(3,1fr)'}}>{BOARD_TYPES.map(t=><button key={t.k} className={'card type-card'+(type===t.k?' sel':'')} onClick={()=>setType(t.k)}><I n={t.ic} s={22}/><h4>{t.t}</h4><p>{t.d}</p></button>)}</div>
    <div className="block" data-block-type="heading-2"><h2>2. 기본 설정</h2></div>
    <div className="grid2">
      <div>
        <div className="form-row"><label>게시판 이름</label><input className="input" placeholder="예: 수업 자료실" value={name} onChange={e=>setName(e.target.value)}/></div>
        {[['comment','댓글 허용'],['attach','첨부파일 허용'],['secret','비밀글 허용']].map(([k,l])=><div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--n3)'}}><span>{l}</span><button className={'switch'+(opts[k]?' on':'')} aria-label={l} onClick={()=>setOpts({...opts,[k]:!opts[k]})}/></div>)}
        <button className="btn primary" style={{marginTop:14}} disabled={saving} onClick={create}>{saving?<span className="spinner" style={{borderTopColor:'var(--n1)'}}/>:<I n="plus"/>}{saving?'생성 중':'게시판 생성'}</button>
      </div>
      <div className="preview-box"><div style={{fontSize:12,color:'var(--n7)',marginBottom:8}}>미리보기 · {bt.t}</div>
        {type==='general'&&[1,2,3].map(i=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--n3)'}}><span>{['2026학년도 교과서 정오표 안내','신학기 자료 업데이트 공지','웹서비스 점검 안내'][i-1]}</span><span style={{color:'var(--n7)'}}>10.0{i}</span></div>)}
        {type==='gallery'&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>{[1,2,3,4,5,6].map(i=><div key={i} style={{aspectRatio:'4/3',borderRadius:8,background:i%2?'var(--n3)':'var(--n4)'}}/>)}</div>}
        {type==='file'&&[1,2,3].map(i=><div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:'1px solid var(--n3)'}}><I n="file-download"/><span style={{flex:1}}>{['단원별 지도안.hwp','평가 문항.pdf','수업 PPT.pptx'][i-1]}</span><span className="mono" style={{color:'var(--n7)'}}>{[128,96,214][i-1]}회</span></div>)}
        {opts.comment&&<div style={{marginTop:8}}><span className="badge">댓글 사용</span></div>}</div>
    </div>
    <div className="block" data-block-type="heading-2"><h2>운영 중인 게시판</h2></div>
    <div className="tbl"><table><thead><tr><th>이름</th><th>유형</th><th>게시글</th><th></th></tr></thead><tbody>{boards.map((b,i)=><tr className="trow" key={b.id} style={{animationDelay:i*40+'ms'}}><td style={{fontWeight:600}}>{b.name}</td><td><span className="badge">{b.type}</span></td><td>{b.posts}</td><td style={{textAlign:'right'}}><button className="btn sm danger" onClick={()=>{setBoards(x=>x.filter(y=>y.id!==b.id));toast('게시판을 삭제했습니다')}}>삭제</button></td></tr>)}</tbody></table></div>
  </div></div>;
}

/* ───── 5. 301 리다이렉트 검증 대시보드 ───── */
function RedirectView({toast}){
  const [rows,setRows]=useState(REDIR0.map(r=>({...r,res:null})));
  const [run,setRun]=useState(false);
  const [f,setF]=useState('all');
  const [prog,setProg]=useState(0);
  const verify=(ids)=>{
    setRun(true);setProg(0);
    let n=0;const tick=setInterval(()=>{n+=1;setProg(Math.min(100,n*20));if(n>=5){clearInterval(tick);setRun(false);
      setRows(rs=>rs.map(r=>ids.includes(r.id)?{...r,res:r.code===301?{ok:true,ms:40+r.id*7}:{ok:false,ms:0}}:r));toast('검증을 마쳤습니다')}},260);
  };
  const done=rows.filter(r=>r.res);const ok=done.filter(r=>r.res.ok).length;const bad=done.length-ok;
  const shown=rows.filter(r=>f==='all'||(f==='bad'&&r.res&&!r.res.ok)||(f==='todo'&&!r.res));
  return <div className="page"><div className="page-body" style={{maxWidth:880}}>
    <Hero/><div className="page-icon-row"><span className="page-icon-large"><I n="arrows-split" s={20}/></span><span className="badge ok"><span className="dot-live"/>검증 도구 가동</span></div>
    <h1 className="page-title">301 리다이렉트 검증 대시보드</h1>
    <div className="page-meta"><span>인쇄된 QR 주소가 새 통합 도메인으로 이동하는지 전수 점검합니다</span></div>
    <div className="stat-row"><div className="stat"><div className="k">점검 대상</div><div className="v">{rows.length}</div></div><div className="stat"><div className="k">통과</div><div className="v">{ok}</div></div><div className="stat"><div className="k">실패</div><div className="v" style={{color:bad?'var(--s2-text)':undefined}}>{bad}</div></div><div className="stat"><div className="k">미검증</div><div className="v">{rows.length-done.length}</div></div></div>
    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
      <div className="seg" style={{width:260}}>{[['all','전체'],['bad','실패'],['todo','미검증']].map(([k,l])=><button key={k} className={f===k?'on':''} onClick={()=>setF(k)}>{l}</button>)}</div>
      <button className="btn primary" style={{marginLeft:'auto'}} disabled={run} onClick={()=>verify(rows.map(r=>r.id))}>{run?<span className="spinner" style={{borderTopColor:'var(--n1)'}}/>:<I n="player-play"/>}{run?'검증 중':'전체 검증 실행'}</button>
      <button className="btn" disabled={run||!bad} onClick={()=>verify(rows.filter(r=>r.res&&!r.res.ok).map(r=>r.id))}><I n="refresh"/>실패 재검증</button>
    </div>
    {run&&<div className="bar" style={{marginBottom:10}}><i style={{'--w':prog+'%',animation:'none',width:prog+'%',transition:'width .25s'}}/></div>}
    <div className="tbl"><table>
      <thead><tr><th>구분</th><th>기존 주소 (인쇄 QR)</th><th>이동 대상</th><th>결과</th></tr></thead>
      <tbody>{shown.map((r,i)=><tr className="trow" key={r.id} style={{animationDelay:i*35+'ms'}}>
        <td>{r.phase}</td><td className="mono" style={{maxWidth:260,wordBreak:'break-all'}}>{r.src}</td><td className="mono">{r.dst||'매핑 없음'}</td>
        <td>{!r.res?<span className="badge">대기</span>:r.res.ok?<span className="badge ok"><I n="check" s={12}/>301 · {r.res.ms}ms</span>:<span className="badge bad"><I n="x" s={12}/>매핑 누락</span>}</td></tr>)}
      {shown.length===0&&<tr><td colSpan="4" className="empty">표시할 항목이 없습니다</td></tr>}</tbody></table></div>
    {bad>0&&<div className="callout warn" style={{marginTop:12}}><I n="alert-triangle" s={18}/><div><b>매핑이 없는 경로 {bad}건</b><div style={{color:'var(--n7)'}}>이 경로는 통합 검색으로 안내됩니다. 매핑 테이블에 추가하면 재검증에서 통과로 바뀝니다.</div>
      <button className="btn sm" style={{marginTop:8}} onClick={()=>{setRows(rs=>rs.map(r=>r.res&&!r.res.ok?{...r,dst:'/notice/88',code:301,res:null}:r));toast('매핑을 추가했습니다. 재검증하세요')}}>매핑 추가</button></div></div>}
  </div></div>;
}

function App(){
  const [view,setView]=useState('mapping');
  const [books,setBooks]=useState(BOOKS0);
  const [authors,setAuthors]=useState(AUTHORS0);
  const [mats,setMats]=useState(MATS0);
  const [boards,setBoards]=useState([{id:1,name:'공지사항',type:'일반형',posts:42},{id:2,name:'행사 소식',type:'갤러리형',posts:17},{id:3,name:'수업 자료실',type:'파일 다운로드 전용',posts:128}]);
  const [openG,setOpenG]=useState({g0:true,g1:true,g2:true,g3:true,g4:true,g5:true,g6:true});
  const [toastMsg,toast]=useToast();
  const tg=(k)=>setOpenG(o=>({...o,[k]:!o[k]}));
  const Leaf=({k,l,lv,ic,cnt})=><button className={'tree-item '+lv+(view===k?' on':'')} onClick={()=>setView(k)}><I n={ic}/><span className="tree-label">{l}</span>{cnt!=null&&<span className="tree-count">{cnt}</span>}</button>;
  const Grp=({g,l,lv,children})=><div><button className={'tree-item '+lv} onClick={()=>tg(g)}><span className={'tree-toggle'+(openG[g]?' open':'')}><I n="chevron-right" s={13}/></span><span className="tree-label">{l}</span></button>{openG[g]&&children}</div>;
  const labels={mapping:['출판 콘텐츠','도서','작가·카테고리 매핑 관리'],authors:['출판 콘텐츠','도서','작가 마스터'],material:['출판 콘텐츠','자료','자료 매핑·노출 제어'],board:['사이트 운영','게시판','게시판 유형 관리'],redirect:['전환 점검','1차 단행본 · 2차 교과서','301 리다이렉트 검증 대시보드']};
  const bc=labels[view];
  return <div className="shell" style={{width:'100%'}} data-archetype="notion-blocks-tree">
    <aside className="sidebar tree-sidebar" data-tree-sidebar style={{width:240}}>
      <div className="sidebar-brand"><span className="ws-mark"><I n="books"/></span><div>나래북스 편집 콘솔<div className="ws-sub">통합 관리자</div></div></div>
      <div className="sidebar-search">
        <button className="search-btn" onClick={()=>toast('전체 검색은 데모에서 도서 목록 검색으로 연결됩니다')}><I n="search"/>검색<kbd>⌘K</kbd></button>
        <button className="quick-add" onClick={()=>{setView('authors');toast('작가 마스터에서 작가를 등록하세요')}}><I n="plus"/>새 작가</button>
      </div>
      <nav className="tree-nav">
        <Grp g="g0" l="출판 콘텐츠" lv="l0">
          <Grp g="g1" l="도서" lv="l1">
            <Leaf k="mapping" l="작가·카테고리 매핑 관리" lv="l3" ic="link"/>
            <Leaf k="authors" l="작가 마스터" lv="l3" ic="users"/>
          </Grp>
          <Grp g="g2" l="자료" lv="l1"><Leaf k="material" l="자료 매핑·노출 제어" lv="l3" ic="files"/></Grp>
        </Grp>
        <Grp g="g3" l="사이트 운영" lv="l0"><Grp g="g4" l="게시판" lv="l1"><Leaf k="board" l="게시판 유형 관리" lv="l3" ic="layout-board"/></Grp></Grp>
        <Grp g="g5" l="전환 점검" lv="l0"><Grp g="g6" l="URL 호환" lv="l1"><Leaf k="redirect" l="301 리다이렉트 검증 대시보드" lv="l3" ic="arrows-split"/></Grp></Grp>
      </nav>
      <div className="sidebar-footer"><span className="avatar">지</span><div style={{fontSize:12}}><b style={{color:'var(--n10)'}}>김지원</b><div style={{color:'var(--n7)'}}>편집 관리자</div></div></div>
    </aside>
    <div className="content" style={{width:'calc(100% - 240px)'}}>
      <header className="page-breadcrumb"><span>{bc[0]}</span><I n="chevron-right" s={13}/><span>{bc[1]}</span><I n="chevron-right" s={13}/><b>{bc[2]}</b>
        <div className="crumb-right"><span className="badge ok"><span className="dot-live"/>동기화됨</span><button className="btn sm" onClick={()=>toast('변경 이력은 감사 로그에 기록됩니다')}><I n="history"/>이력</button></div></header>
      {view==='mapping'&&<MappingView books={books} setBooks={setBooks} authors={authors} toast={toast}/>}
      {view==='authors'&&<AuthorsView authors={authors} setAuthors={setAuthors} toast={toast}/>}
      {view==='material'&&<MaterialView mats={mats} setMats={setMats} toast={toast}/>}
      {view==='board'&&<BoardView boards={boards} setBoards={setBoards} toast={toast}/>}
      {view==='redirect'&&<RedirectView toast={toast}/>}
      <footer style={{padding:'14px 24px',color:'var(--n7)',fontSize:12,borderTop:'1px solid var(--n3)',background:'var(--n1)'}}>© 2026 나래북스 샘플 — 자체 개발 프로젝트 · 구현 데모이며 모든 데이터는 가상입니다.</footer>
    </div>
    {toastMsg&&<div className="toast"><I n="check"/>{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
