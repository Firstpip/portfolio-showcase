<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숨결 사이트 관리 콘솔 — 확장 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 46°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fffbed;
  --m100:#fff7db;
  --m200:#ffefb8;
  --m300:#ffe58c;
  --m400:#ffda5c;
  --m500:#ffcf2e;
  --m600:#ffc500;
  --m700:#d1a200;
  --m800:#a37e00;
  --m900:#735900;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdfcf3;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d7d5;
  --n5:#bab9b5;
  --n6:#989690;
  --n7:#6e6e6e;
  --n8:#5a5953;
  --n9:#3a3936;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
}
/* ⚠ s3(경고/주의) — 메인 hue 46°와 8° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--n0);color:var(--n10);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
.num{font-variant-numeric:tabular-nums}

@keyframes rise{from{opacity:0;transform:translate(0,10px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flowDot{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sweep{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translate(0,-6px)}to{opacity:1;transform:none}}

/* ── 상단 유틸리티 바 ── */
.util{position:sticky;top:0;z-index:40;background:var(--n1);border-bottom:1px solid var(--n4)}
.util-in{max-width:1380px;margin:0 auto;height:44px;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
.util-l,.util-r{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:700}
.util-l button,.util-r .lnk{display:flex;align-items:center;gap:6px;color:var(--n10)}
.util-l button:hover,.util-r .lnk:hover{color:var(--n7)}
.cta{height:30px;padding:0 16px;background:var(--m600);color:var(--n10);font-size:12.5px;font-weight:700;letter-spacing:.01em;border-radius:0;display:flex;align-items:center;gap:6px}
.cta:hover{background:var(--m700)}

/* ── 마스트헤드 ── */
.mast{max-width:1380px;margin:0 auto;padding:22px 28px 0}
.mast-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.mast-meta{font-size:12.5px;color:var(--n7);line-height:1.5;border-left:3px solid var(--n10);padding-left:10px}
.mast-meta b{color:var(--n10);display:block;font-size:13px}
.mast-title{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center}
.mast-title small{display:block;font-size:12px;font-weight:600;letter-spacing:.075em;color:var(--n7);margin-bottom:8px;text-align:center}
.mast-art{justify-self:end;display:flex;gap:12px;align-items:center;color:var(--n7);font-size:12.5px;text-align:right;line-height:1.4}
.nav{margin-top:18px;border-top:1px solid var(--n10);border-bottom:1px solid var(--n4);display:flex;justify-content:center;flex-wrap:wrap}
.nav button{padding:12px 20px;font-size:14px;font-weight:600;color:var(--n8);position:relative;white-space:nowrap}
.nav button+button{border-left:1px solid var(--n4)}
.nav button:hover{color:var(--n10)}
.nav button[aria-current="page"]{color:var(--n10)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;background:var(--n10)}

/* ── 공통 ── */
.page{max-width:1380px;margin:0 auto;padding:22px 28px 56px;animation:rise .4s ease both}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--n7)}
.h-xl{font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.04em}
.h-md{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.sub{color:var(--n7);font-size:13.5px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--n1);border:1px solid var(--n4);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;animation:rise .45s ease both}
.tile.feature{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile.accent{background:var(--m600);border-color:var(--m600);color:var(--n10)}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.big{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.04em}
.btn{height:32px;padding:0 13px;border:1px solid var(--n10);border-radius:4px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--n1);white-space:nowrap}
.btn:hover{background:var(--n2)}
.btn-solid{background:var(--n10);color:var(--n1)}
.btn-solid:hover{background:var(--n9)}
.btn-sm{height:26px;padding:0 9px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:2px;font-size:11.5px;font-weight:700}
.b-ok{background:var(--s1-bg);color:var(--s1-text)}
.b-err{background:var(--s2-bg);color:var(--s2-text)}
.b-wait{background:var(--n2);color:var(--n8)}
.b-ink{background:var(--n10);color:var(--n1)}
.input{height:34px;border:1px solid var(--n5);border-radius:4px;padding:0 10px;background:var(--n1);width:100%;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--n8)}
.hair{border:0;border-top:1px solid var(--n4);margin:2px 0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--n10)}
.table td{padding:9px 10px;border-bottom:1px solid var(--n3)}
.table tr:last-child td{border-bottom:0}
.chk{width:18px;height:18px;border:1.5px solid var(--n6);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:var(--n1);flex:none;color:var(--n1)}
.chk[aria-checked="true"]{background:var(--n10);border-color:var(--n10)}
.switch{width:38px;height:22px;border-radius:2px;background:var(--n4);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:var(--n1);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--n10)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:inline-flex;border:1px solid var(--n10);border-radius:4px;overflow:hidden}
.seg button{height:30px;padding:0 13px;font-size:12.5px;font-weight:700;color:var(--n8)}
.seg button+button{border-left:1px solid var(--n10)}
.seg button[aria-pressed="true"]{background:var(--n10);color:var(--n1)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.code{background:var(--n10);color:var(--n2);border-radius:4px;padding:14px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
.code .k{color:var(--n5)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--n10);color:var(--n1);padding:11px 18px;border-radius:4px;font-size:13px;display:flex;gap:8px;align-items:center;animation:rise .25s ease;max-width:90%}

/* ── 이미지 파이프라인 타일 ── */
.pipe{position:relative;height:150px;border:1px solid var(--n3);border-radius:4px;background:var(--n0);overflow:hidden}
.pipe-node{position:absolute;top:50%;transform:translateY(-50%);width:104px;border:1px solid var(--n10);background:var(--n1);padding:9px 8px;text-align:center;font-size:12px;font-weight:700;border-radius:4px}
.pipe-node i{display:block;font-size:22px;margin-bottom:3px}
.pipe-node small{display:block;font-weight:500;color:var(--n7);font-size:11px;margin-top:1px}
.dotflow{position:absolute;left:0;top:0;width:8px;height:8px;background:var(--n10);border-radius:50%;offset-path:path('M 20 75 L 640 75');offset-rotate:0deg;animation:flowDot 3.2s linear infinite}
.img-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n3);width:100%;text-align:left}
.img-row:last-child{border-bottom:0}
.img-row[aria-selected="true"]{background:var(--n0)}
.ph-box{width:36px;height:36px;border:1px solid var(--n4);background:var(--n2);display:flex;align-items:center;justify-content:center;color:var(--n7);font-size:18px;border-radius:2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--n10);padding-bottom:0}
.bar{flex:1;background:var(--n4);transform-origin:bottom;animation:barGrow .6s ease both;min-width:0;position:relative}
.bar.hot{background:var(--n10)}
.bar.key{background:var(--m600)}
.skel{background:linear-gradient(90deg,var(--n2) 0,var(--n3) 50%,var(--n2) 100%);background-size:200px 100%;animation:sweep 1.4s linear infinite;height:10px;border-radius:2px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.live i{width:7px;height:7px;border-radius:50%;background:var(--s1);animation:blink 1.4s infinite}

/* ── 마스터-디테일 ── */
.md{display:grid;grid-template-columns:380px 1fr;gap:12px;align-items:start}
.panel{background:var(--n1);border:1px solid var(--n4);border-radius:4px}
.list-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;width:100%;text-align:left;border-bottom:1px solid var(--n3);border-left:3px solid transparent}
.list-row:hover{background:var(--n0)}
.list-row[aria-selected="true"]{background:var(--n0);border-left-color:var(--n10)}
.stack-bar{display:flex;height:10px;border:1px solid var(--n10);border-radius:2px;overflow:hidden}
.stack-bar i{display:block;height:100%;animation:rise .5s ease both}
.step-row{display:flex;gap:0;border:1px solid var(--n10);border-radius:4px;overflow:hidden}
.step-row div{flex:1;padding:8px 10px;font-size:12px;font-weight:700;color:var(--n7);border-left:1px solid var(--n4);text-align:center}
.step-row div:first-child{border-left:0}
.step-row div[data-on="true"]{background:var(--n10);color:var(--n1)}

/* ── 폼 · 영문 ── */
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:start}
.glos{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.prev-head{display:flex;gap:18px;align-items:center;border:1px solid var(--n4);background:var(--n0);padding:12px 14px;font-weight:700;font-size:13px;border-radius:4px;flex-wrap:wrap}

/* ── 권한 ── */
.term{background:var(--n10);color:var(--n2);border-radius:4px;padding:14px 16px;min-height:150px;line-height:1.7}
.term b{color:var(--n0)}
.term .ok{color:var(--s1)}
.term .no{color:var(--s2)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

.foot{border-top:1px solid var(--n10);max-width:1380px;margin:0 auto;padding:16px 28px 36px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--n7)}
@media(max-width:1000px){.bento{grid-template-columns:repeat(2,1fr)}.md,.two{grid-template-columns:1fr}.mast-row{grid-template-columns:1fr}.mast-art,.mast-meta{display:none}}
</style>
</head>
<body data-archetype="bento-grid">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
const Ph = ({ n, s = 16, style }) => <i className={'ph ph-' + n} style={{ fontSize: s, flex: 'none', ...style }} aria-hidden="true"></i>;

const VIEWS = [
  ['main', '이미지 최적화·부하 대응 현황'],
  ['migration', '카페24 데이터 이전·301 리디렉션 매핑'],
  ['forms', '구글시트 연동 폼·영문 변환'],
  ['roles', '권한 관리·비공개 글 접근 차단'],
];

function App() {
  const [view, setView] = useState('main');
  const [toast, setToast] = useState(null);
  const tRef = useRef();
  const say = m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 2600); };
  const go = v => { setView(v); window.scrollTo(0, 0); };
  return (
    <div style={{ width: '100%', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div className="util">
        <div className="util-in">
          <div className="util-l">
            <button onClick={() => say('메뉴 — 이미지·이전·폼·권한 4개 업무 영역으로 이동합니다')}><Ph n="list" s={18} />메뉴</button>
            <button onClick={() => go('main')}>대시보드</button>
            <button onClick={() => say('작업 이력 — 이전·권한·폼 재시도 기록을 시간순으로 봅니다')}>작업 이력</button>
          </div>
          <div className="util-r">
            <button className="lnk" onClick={() => say('검색 — 이미지·주소 매핑·접수 건을 한 번에 찾습니다')}><Ph n="magnifying-glass" s={17} /></button>
            <button className="lnk" onClick={() => say('관리자 계정 — 관리자 역할로 로그인 중입니다')}>관리자</button>
            <button className="cta" onClick={() => say('변경 사항을 게시했습니다 — 공개 사이트 캐시가 갱신됩니다')}><Ph n="upload-simple" s={14} />변경 게시</button>
          </div>
        </div>
      </div>

      <header className="mast">
        <div className="mast-row">
          <div className="mast-meta"><b>제 12호 · 사이트 운영 면</b>이미지 · 이전 · 접수 · 권한<br />한 면에서 확인하는 관리 현황</div>
          <div className="mast-title"><small>SUMGYEOL SITE CONSOLE</small>숨결 관리 콘솔</div>
          <div className="mast-art">
            <span>비개발자 운영진이<br />코드 없이 쓰는 도구</span>
            <svg width="56" height="48" viewBox="0 0 56 48" fill="none" stroke="var(--n10)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M10 40c-4-10 0-22 8-24l4 6c4-2 8-2 12 0l4-6c8 2 12 14 8 24-3 5-10 6-18 6s-12-1-18-6z" /><circle cx="22" cy="28" r="1.6" fill="var(--n10)" /><circle cx="36" cy="28" r="1.6" fill="var(--n10)" /><path d="M26 34c2 2 4 2 6 0" />
            </svg>
          </div>
        </div>
        <nav className="nav">
          {VIEWS.map(([k, l]) => <button key={k} aria-current={view === k ? 'page' : undefined} onClick={() => go(k)}>{l}</button>)}
        </nav>
      </header>

      <main style={{ flex: 1, width: '100%' }}>
        {view === 'main' && <ImageView say={say} />}
        {view === 'migration' && <MigrationView say={say} />}
        {view === 'forms' && <FormsView say={say} />}
        {view === 'roles' && <RolesView say={say} />}
      </main>

      <footer className="foot">
        <span>© 샘플 단체 관리 콘솔 — 자체 개발 프로젝트 데모 · 화면의 모든 데이터는 가상의 예시입니다</span>
        <span className="eyebrow">Next.js · Prisma · Redis · S3</span>
      </footer>
      {toast && <div className="toast"><Ph n="check-circle" s={16} />{toast}</div>}
    </div>
  );
}

/* ═════ 1. 이미지 최적화·부하 대응 ═════ */
const IMGS = [
  { id: 1, n: '구조현장_0412.jpg', o: '4.2 MB', w: '4032×3024', st: 'ok', v: ['1600w WebP · 312 KB', '800w WebP · 118 KB', '320w 썸네일 · 24 KB'] },
  { id: 2, n: '치료실_0418.jpg', o: '3.6 MB', w: '3840×2880', st: 'ok', v: ['1600w WebP · 276 KB', '800w WebP · 102 KB', '320w 썸네일 · 21 KB'] },
  { id: 3, n: '입양후기_0420.png', o: '5.8 MB', w: '3000×3000', st: 'run', v: ['1600w WebP · 변환 중', '800w WebP · 대기', '320w 썸네일 · 대기'] },

          </div>
          <table className="table">
            <thead><tr><th>구분</th><th>이름</th><th>접수</th><th>시트 전달</th><th></th></tr></thead>
            <tbody>
              {subs.map(s => (
                <tr key={s.id}>
                  <td style={{ fontWeight: 700 }}>{s.k}</td><td>{s.who}</td><td className="num sub">{s.at}</td>
                  <td>{s.st === 'ok' ? <span className="badge b-ok">전달됨</span> : s.st === 'err' ? <span className="badge b-err">전달 실패 · 시트 응답 지연</span> : <span className="badge b-wait"><Ph n="arrows-clockwise" s={11} />전달 중</span>}</td>
                  <td style={{ textAlign: 'right' }}>{s.st === 'err' && <button className="btn btn-sm" onClick={() => retry(s.id)}>재시도</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--n4)', display: 'flex', gap: 10, alignItems: 'center' }}>
            <span className="chk" aria-checked="true"><Ph n="check" s={12} /></span><span className="sub" style={{ fontSize: 12.5 }}>실패한 건은 사유와 함께 이 목록에 남고, 재시도 큐가 순서대로 다시 전달합니다.</span>
          </div>
        </div>
        <div className="panel" style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="row-between"><h2 className="h-md">영문 변환 설정</h2>
            <div className="seg">{[['glossary', '용어집 적용'], ['auto', '자동 번역 위젯']].map(([k, l]) => <button key={k} aria-pressed={mode === k} onClick={() => { setMode(k); say(k === 'glossary' ? '용어집 우선 방식으로 설정했습니다' : '자동 번역 위젯 방식으로 설정했습니다'); }}>{l}</button>)}</div></div>
          <div className="prev-head">
            <span style={{ fontSize: 15 }}>숨결</span>
            {['입양&임시보호', '봉사', '후원'].map(m => <span key={m}>{t(m)}</span>)}
            <button className="seg" style={{ marginLeft: 'auto', height: 28 }} onClick={() => setLang(lang === 'KO' ? 'EN' : 'KO')}><span style={{ padding: '0 11px', fontSize: 12, fontWeight: 700, lineHeight: '26px' }}><Ph n="translate" s={13} /> {lang === 'KO' ? 'EN' : 'KO'}</span></button>
          </div>
          <div>
            <div className="lbl" style={{ marginBottom: 6 }}>번역 용어집 {mode === 'auto' && <span className="sub" style={{ fontWeight: 400 }}>(자동 번역에서도 이 용어는 제외)</span>}</div>
            <table className="table">
              <thead><tr><th>한글</th><th>영문</th><th></th></tr></thead>
              <tbody>{glos.map(([a, b], i) => <tr key={a}><td style={{ fontWeight: 700 }}>{a}</td><td className="mono">{b}</td><td style={{ textAlign: 'right' }}><button className="btn btn-sm" aria-label="삭제" onClick={() => setGlos(g => g.filter((_, j) => j !== i))}><Ph n="x" s={12} /></button></td></tr>)}</tbody>
            </table>
            <div className="glos" style={{ marginTop: 10 }}>
              <input className="input" placeholder="한글 용어" value={ko} onChange={e => setKo(e.target.value)} />
              <input className="input" placeholder="영문 표기" value={en} onChange={e => setEn(e.target.value)} />
              <button className="btn" onClick={addTerm}><Ph n="plus" s={13} />추가</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═════ 4. 권한 · 비공개 글 ═════ */
const ROLES = ['관리자', '편집자', '열람자'];
const PERMS0 = [
  ['소식 글쓰기', [true, true, false]], ['개체 등록·수정', [true, true, false]], ['공개·숨김 전환', [true, true, false]],
  ['이전·리디렉션 관리', [true, false, false]], ['권한·계정 관리', [true, false, false]], ['접수 내역 열람', [true, true, true]],
];
function RolesView({ say }) {
  const [perms, setPerms] = useState(PERMS0);
  const [sess, setSess] = useState('out');
  const [url, setUrl] = useState('/news/private/2026-board-minutes');
  const [log, setLog] = useState([{ t: '10:12', who: '관리자', m: '‘열람자’ 역할의 접수 내역 열람을 허용' }]);
  const [res, setRes] = useState(null);
  const toggle = (i, j) => {
    setPerms(p => p.map((r, a) => a === i ? [r[0], r[1].map((v, b) => b === j ? !v : v)] : r));
    setLog(l => [{ t: '방금', who: '관리자', m: '‘' + ROLES[j] + '’ 역할의 ‘' + perms[i][0] + '’ ' + (perms[i][1][j] ? '허용 해제' : '허용') }, ...l]);
  };
  const send = () => {
    const priv = url.includes('private');
    const role = sess === 'out' ? null : sess === 'editor' ? 1 : 2;
    let code = 200, why = '공개 글 — 누구나 열람';
    if (priv) {
      if (role === null) { code = 401; why = '세션 없음 — 로그인이 필요합니다'; }
      else if (!perms[0][1][role]) { code = 403; why = '열람자 역할은 비공개 글 접근 권한이 없습니다'; }
      else { code = 200; why = ROLES[role] + ' 역할 — 접근 허용'; }
    }
    setRes({ code, why, at: new Date().toLocaleTimeString('ko-KR', { hour12: false }) });
    setLog(l => priv && code !== 200 ? [{ t: '방금', who: '서버', m: '비공개 글 직접 접근 차단 — ' + url }, ...l] : l);
  };
  return (
    <div className="page">
      <div className="row-between" style={{ marginBottom: 14, alignItems: 'flex-end' }}>
        <div><span className="eyebrow">Roles · Access</span><h1 className="h-xl" style={{ marginTop: 6 }}>링크를 숨기는 게 아니라, 서버가 문 앞에서 막습니다</h1></div>
        <span className="badge b-ink"><Ph n="shield-check" s={12} />서버 단 검사</span>
      </div>
      <section className="bento" style={{ gridTemplateColumns: '1.3fr 1fr' }}>
        <div className="tile" style={{ gridRow: 'span 2' }}>
          <div className="tile-head"><div><span className="eyebrow">Permission matrix</span><h2 className="h-md" style={{ marginTop: 4 }}>역할별 권한표</h2></div></div>
          <table className="table matrix">
            <thead><tr><th>작업</th>{ROLES.map(r => <th key={r}>{r}</th>)}</tr></thead>
            <tbody>{perms.map(([name, vals], i) => (
              <tr key={name}><td style={{ fontWeight: 700 }}>{name}</td>
                {vals.map((v, j) => <td key={j}><button className="chk" role="checkbox" aria-checked={v} aria-label={ROLES[j] + ' ' + name} onClick={() => toggle(i, j)}>{v && <Ph n="check" s={12} />}</button></td>)}</tr>
            ))}</tbody>
          </table>
          <p className="sub" style={{ fontSize: 12 }}>변경하면 변경자·시각과 함께 감사 목록에 남고, 편집자는 허용된 메뉴만 화면에 보입니다.</p>
          <hr className="hair" />
          <div className="lbl">감사 로그</div>
          <div>
            {log.slice(0, 5).map((l, i) => (
              <div key={i} className="row-between" style={{ padding: '8px 0', borderBottom: '1px solid var(--n3)', fontSize: 12.5, animation: 'slideDown .3s ease' }}>
                <span><b>{l.who}</b> · {l.m}</span><span className="sub num">{l.t}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="tile">
          <span className="eyebrow">Private post · request test</span>
          <h2 className="h-md">비공개 글 직접 접근 시험</h2>
          <div className="field"><label>요청 주소</label><input className="input mono" value={url} onChange={e => setUrl(e.target.value)} /></div>
          <div className="field"><label>세션</label>
            <div className="seg" style={{ alignSelf: 'flex-start' }}>{[['out', '로그아웃'], ['reader', '열람자'], ['editor', '편집자']].map(([k, l]) => <button key={k} aria-pressed={sess === k} onClick={() => setSess(k)}>{l}</button>)}</div></div>
          <button className="btn btn-solid" style={{ alignSelf: 'flex-start' }} onClick={send}><Ph n="paper-plane-tilt" s={14} />요청 보내기</button>
        </div>
        <div className="tile" style={{ background: 'var(--n10)', borderColor: 'var(--n10)' }}>
          <span className="eyebrow" style={{ color: 'var(--n5)' }}>Server response</span>
          <div className="mono" style={{ color: 'var(--n2)', lineHeight: 1.8, minHeight: 112 }}>
            {!res ? <span style={{ color: 'var(--n5)' }}>요청을 보내면 서버의 응답이 여기에 표시됩니다.</span> : (
              <div style={{ animation: 'fadeIn .3s ease' }}>
                <div><span style={{ color: 'var(--n5)' }}>GET</span> {url}</div>
                <div style={{ fontSize: 30, fontWeight: 800, color: res.code === 200 ? 'var(--s1)' : 'var(--s2)', letterSpacing: '-.03em' }}>{res.code} {res.code === 200 ? 'OK' : res.code === 401 ? 'Unauthorized' : 'Forbidden'}</div>
                <div>{res.why}</div><div style={{ color: 'var(--n5)' }}>{res.at}</div>
              </div>
            )}
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
