<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숨결 동물구조단체 — 홈페이지·입양 CMS 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 208°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#edf5fd;
  --m100:#dbecfa;
  --m200:#b8d8f6;
  --m300:#8cc1f0;
  --m400:#5ca7ea;
  --m500:#2e8ee4;
  --m600:#0075de;
  --m700:#0060b6;
  --m800:#004b8e;
  --m900:#003564;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f6f5f4;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e6e6;
  --n4:#d5d6d7;
  --n5:#b5b8ba;
  --n6:#909498;
  --n7:#757575;
  --n8:#53575a;
  --n9:#36383a;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--n0);color:var(--n10);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
.num{font-variant-numeric:tabular-nums}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pawStep{0%,18%{opacity:0;transform:scale(.6)}30%,80%{opacity:1;transform:scale(1)}100%{opacity:.25;transform:scale(1)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s1) 45%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--s1) 0%,transparent)}}
@keyframes barGrow{from{width:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── 상단 메뉴 바 ── */
.menu-bar{background:var(--n1);border-bottom:1px solid var(--n3);position:relative;z-index:30}
.menu-inner{max-width:1360px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--m600);color:var(--n1);display:flex;align-items:center;justify-content:center}
.menus{display:flex;gap:2px;flex:1}
.menu-wrap{position:relative}
.menu-btn{padding:8px 13px;border-radius:8px;font-size:15px;font-weight:500;color:var(--n8);display:flex;align-items:center;gap:4px;transition:background .2s,color .2s}
.menu-btn:hover,.menu-btn[data-open="true"]{background:var(--n2);color:var(--n10)}
.menu-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:190px;background:var(--n1);border:1px solid var(--n3);border-radius:12px;padding:6px;animation:fadeIn .15s ease;box-shadow:0 8px 24px color-mix(in srgb,var(--n10) 10%,transparent)}
.menu-item{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--n9)}
.menu-item:hover{background:var(--m50);color:var(--m700)}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:8px;font-size:14px;font-weight:500;transition:background .2s,transform .2s;white-space:nowrap}
.btn-primary{background:var(--m600);color:var(--n1)}
.btn-primary:hover{background:var(--m700)}
.btn-ghost{background:var(--m50);color:var(--m700)}
.btn-ghost:hover{background:var(--m100)}
.btn-line{border:1px solid var(--n4);color:var(--n9);background:var(--n1)}
.btn-line:hover{background:var(--n2)}
.btn-lg{height:48px;padding:0 24px;font-size:16px;border-radius:10px}
.btn-dark{background:var(--n0);color:var(--n10)}

/* ── 데모 화면 전환 ── */
.demo-tabs{background:var(--n1);border-bottom:1px solid var(--n3)}
.demo-inner{max-width:1360px;margin:0 auto;padding:0 32px;height:50px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.demo-label{font-size:12px;color:var(--n6);margin-right:8px;white-space:nowrap;letter-spacing:.01em}
.view-tab{height:34px;padding:0 14px;border-radius:9999px;font-size:14px;font-weight:500;color:var(--n8);white-space:nowrap;border:1px solid transparent;transition:background .2s}
.view-tab:hover{background:var(--n2)}
.view-tab[aria-selected="true"]{background:var(--m50);color:var(--m700);border-color:var(--m200)}

/* ── sticky 검색 + 칩 ── */
.search-header{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--n0) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--n3)}
.search-inner{max-width:1360px;margin:0 auto;padding:14px 32px 0}
.search-bar{display:flex;align-items:stretch;background:var(--n1);border:1px solid var(--n4);border-radius:9999px;max-width:760px;margin:0 auto;height:56px}
.search-segment{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px;border-radius:9999px;cursor:pointer;min-width:0;transition:background .2s}
.search-segment:hover{background:var(--n2)}
.segment-label{font-size:11px;font-weight:600;color:var(--n7)}
.search-segment select,.search-segment input{border:0;background:none;outline:none;font-size:14px;color:var(--n9);width:100%;padding:0;cursor:pointer;box-shadow:none!important}
.search-segment input{cursor:text}
.search-divider{width:1px;margin:12px 0;background:var(--n3)}
.search-submit{width:44px;height:44px;margin:5px 6px 5px 0;border-radius:50%;background:var(--m600);color:var(--n1);display:flex;align-items:center;justify-content:center;flex:none}
.search-submit:hover{background:var(--m700)}
.filter-chips{display:flex;gap:8px;padding:14px 0;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 15px;border-radius:9999px;font-size:14px;font-weight:500;color:var(--n8);background:var(--n1);border:1px solid var(--n4);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--n6)}
.chip[data-active="true"]{background:var(--n10);color:var(--n1);border-color:var(--n10)}

/* ── 공통 ── */
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.view{animation:fadeUp .45s ease both}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:600}
.badge-ok{background:var(--s1-bg);color:var(--s1-text)}
.badge-wait{background:var(--n2);color:var(--n8)}
.badge-done{background:var(--n10);color:var(--n1)}
.badge-hide{background:var(--n2);color:var(--n7)}
.eyebrow{font-size:12px;font-weight:600;color:var(--n7);letter-spacing:.04em}
.sec-title{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.035em}
.sec-sub{color:var(--n7);font-size:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s1);animation:pulseDot 1.8s infinite}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--n8)}
.input{height:42px;border:1px solid var(--n4);border-radius:8px;padding:0 12px;background:var(--n1);font-size:14px;width:100%}
textarea.input{height:auto;padding:12px;line-height:1.6;resize:vertical}
.seg{display:flex;background:var(--n2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:600;color:var(--n7);transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--n1);color:var(--n10);box-shadow:0 1px 2px color-mix(in srgb,var(--n10) 12%,transparent)}
.switch{width:44px;height:26px;border-radius:9999px;background:var(--n4);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--n1);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--m600)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ── 메인 히어로 ── */
.hero{padding:44px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:64px;line-height:1.08;font-weight:700;letter-spacing:-.04em}
.hl{display:inline-block;background:var(--m100);color:var(--m800);border-radius:9999px;padding:0 .3em;margin:0 .04em}
.hero p.lead{margin-top:22px;font-size:19px;color:var(--n8);max-width:520px;line-height:1.6}
.hero-cta{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.hero-meta{display:flex;gap:28px;margin-top:40px}
.hero-meta strong{display:block;font-size:30px;letter-spacing:-.03em;font-weight:700}
.hero-meta span{font-size:13px;color:var(--n7)}
.hero-art{position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:end}
.paw{position:absolute;opacity:0;animation:pawStep 4.8s ease-in-out infinite;color:var(--n5)}

/* ── 리스팅 카드 ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.listing-card{cursor:pointer;transition:transform .2s,border-color .2s;overflow:hidden;animation:fadeUp .4s ease both;display:flex;flex-direction:column;text-align:left}
.listing-card:hover{transform:translateY(-3px);border-color:var(--n5)}
.card-image-wrap{position:relative;aspect-ratio:4/3;background:var(--n2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.card-badge{position:absolute;left:12px;top:12px}
.card-favorite{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--n1);display:flex;align-items:center;justify-content:center;color:var(--n7)}
.card-favorite[aria-pressed="true"]{color:var(--m600)}
.card-body{padding:16px 18px 18px}
.card-title{font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
.card-meta{font-size:13px;color:var(--n7);margin-top:4px}
.card-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 9px;border-radius:9999px;background:var(--n2);color:var(--n8)}
.section{padding:56px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.news-card{padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;transition:border-color .2s;min-height:190px}
.news-card:hover{border-color:var(--n5)}
.news-card h3{font-size:19px;line-height:1.4;letter-spacing:-.02em}
.news-ico{width:40px;height:40px;border-radius:10px;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center}
.step-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step-card{padding:22px}
.step-no{font-size:13px;font-weight:700;color:var(--m700)}
.step-card h4{margin:8px 0 6px;font-size:17px;letter-spacing:-.02em}
.step-card p{font-size:14px;color:var(--n7)}
.donate-band{background:var(--n10);color:var(--n0);border-radius:12px;padding:44px 48px;display:flex;justify-content:space-between;align-items:center;gap:32px}
.donate-band h3{font-size:34px;letter-spacing:-.035em;font-weight:700;line-height:1.2}
.donate-band p{color:var(--n5);margin-top:8px}
.footer{border-top:1px solid var(--n3);margin-top:72px;padding:40px 0 100px;background:var(--n1)}
.footer-cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;font-size:14px}
.footer-col h4{font-size:13px;color:var(--n7);margin-bottom:10px}
.footer-col a{display:block;padding:3px 0;color:var(--n9)}

/* ── 플로팅 ── */
.floating{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:9999px;background:var(--n1);border:1px solid var(--n4);font-size:14px;font-weight:600;box-shadow:0 4px 14px color-mix(in srgb,var(--n10) 10%,transparent);transition:transform .2s}
.fab:hover{transform:translateX(-3px)}
.fab-main{background:var(--n10);color:var(--n1);border-color:var(--n10)}

/* ── 입양 목록 ── */
.adopt-layout{display:grid;grid-template-columns:280px 1fr;gap:28px;padding:32px 0 0;align-items:start}
.filter-rail{padding:22px;position:sticky;top:150px;display:flex;flex-direction:column;gap:18px}
.filter-rail h3{font-size:16px;letter-spacing:-.02em}
.share-box{font-size:12px;background:var(--n2);border-radius:8px;padding:10px 12px;color:var(--n8);word-break:break-all;line-height:1.5}
.result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.empty{padding:64px 24px;text-align:center;color:var(--n7);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ── 드로어 · 모달 · 토스트 ── */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 38%,transparent);z-index:60;animation:fadeIn .2s ease}
.overlay-center{display:flex;align-items:center;justify-content:center;padding:24px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:460px;max-width:100%;background:var(--n1);z-index:61;overflow-y:auto;animation:drawerIn .3s ease;border-left:1px solid var(--n3)}
.modal{background:var(--n1);border-radius:12px;width:480px;max-width:100%;padding:28px;animation:fadeUp .25s ease;max-height:90vh;overflow-y:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.fact{background:var(--n2);border-radius:10px;padding:10px 14px}
.fact span{display:block;font-size:12px;color:var(--n7)}
.fact b{font-size:15px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:90;background:var(--n10);color:var(--n1);padding:12px 20px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;animation:toastIn .25s ease;max-width:90%}

/* ── CMS ── */
.admin-bar{background:var(--n1);border-bottom:1px solid var(--n3)}
.admin-bar .wrap{height:56px;display:flex;align-items:center;justify-content:space-between}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--n7)}
.crumbs b{color:var(--n10)}
.cms-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;padding:28px 0}
.steps3{display:flex;gap:10px;margin-bottom:18px}
.steps3 .s{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--n1);border:1px solid var(--n3);font-size:14px;font-weight:600;color:var(--n7)}
.steps3 .s i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--n2);display:flex;align-items:center;justify-content:center;font-size:12px}
.steps3 .s[data-on="true"]{color:var(--n10);border-color:var(--m300)}
.steps3 .s[data-on="true"] i{background:var(--m600);color:var(--n1)}
.editor-card{padding:24px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;gap:4px;padding:6px;border:1px solid var(--n3);border-radius:10px;background:var(--n0);width:fit-content}
.toolbar button{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n8)}
.toolbar button:hover{background:var(--n3)}
.dropzone{border:2px dashed var(--n4);border-radius:12px;padding:26px;text-align:center;background:var(--n0);cursor:pointer;transition:border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.dropzone:hover,.dropzone[data-over="true"]{border-color:var(--m500);background:var(--m50)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.thumb{border:1px solid var(--n3);border-radius:10px;overflow:hidden;background:var(--n1);animation:fadeUp .3s ease both}
.thumb-img{aspect-ratio:1/1;background:var(--n2);display:flex;align-items:center;justify-content:center;position:relative}
.thumb-bar{height:4px;background:var(--n3)}
.thumb-bar i{display:block;height:100%;background:var(--m600);animation:barGrow .6s ease}
.thumb-meta{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-size:12px;color:var(--n7);gap:4px}
.thumb-meta div{display:flex}
.thumb-meta button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--n7)}
.thumb-meta button:hover{background:var(--n2)}
.side-card{padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{font-size:12px;color:var(--n7);line-height:1.5}
.err{font-size:12px;color:var(--s2-text)}
.table{width:100%;border-collapse:collapse;font-size:14px}

  const [over, setOver] = useState(false);
  const [tried, setTried] = useState(false);
  const [posts, setPosts] = useState([
    { id: 1, t: '이동 봉사 11월 일정 안내', c: '공지', s: 'public', d: '2026.10.27' },
    { id: 2, t: '하루와 다올의 입양 후기', c: '입양 후기', s: 'public', d: '2026.11.01' },
    { id: 3, t: '후원 물품 영수 내역 정리', c: '후원 내역', s: 'hidden', d: '2026.10.20' },
  ]);
  const nid = useRef(10);

  const addFiles = names => {
    const items = names.map(([n, s]) => ({ id: nid.current++, n, s, p: 8, v: nid.current % 4 }));
    setFiles(p => [...p, ...items]);
    items.forEach(it => {
      let p = 8;
      const t = setInterval(() => {
        p = Math.min(100, p + 14 + Math.random() * 18);
        setFiles(prev => prev.map(x => x.id === it.id ? { ...x, p } : x));
        if (p >= 100) clearInterval(t);
      }, 260);
    });
  };
  const onDrop = e => {
    e.preventDefault(); setOver(false);
    const dropped = Array.from(e.dataTransfer.files || []).map(fl => [fl.name, (fl.size / 1048576).toFixed(1) + ' MB']);
    addFiles(dropped.length ? dropped : DEMO_FILES.slice(0, 3));
  };
  const move = (i, d) => setFiles(p => { const a = [...p]; const j = i + d; if (j < 0 || j >= a.length) return p; [a[i], a[j]] = [a[j], a[i]]; return a; });
  const save = st => {
    setTried(true);
    if (!title.trim()) { say('제목을 먼저 입력해 주세요'); return; }
    setStatus(st);
    setPosts(p => [{ id: nid.current++, t: title, c: cat, s: st, d: '방금' }, ...p]);
    say(st === 'public' ? '공개했습니다 — 방문자 화면 목록에 바로 나타납니다' : st === 'draft' ? '임시저장했습니다 — 방문자에게는 보이지 않습니다' : '숨김으로 저장했습니다');
  };
  const toggleVis = id => setPosts(p => p.map(x => x.id === id ? { ...x, s: x.s === 'public' ? 'hidden' : 'public' } : x));
  const stepOn = [true, files.length > 0, status === 'public'];

  return (
    <div className="view">
      <div className="admin-bar">
        <div className="wrap">
          <div className="crumbs"><Icon name="file-text" size={16} />관리자<Icon name="chevron-down" size={14} style={{ transform: 'rotate(-90deg)' }} /><b>소식 글쓰기</b></div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-line" onClick={() => say('방문자 화면 미리보기를 새 창으로 엽니다')}><Icon name="eye" size={15} />미리보기</button>
            <button className="btn btn-line" onClick={() => save('draft')}><Icon name="save" size={15} />임시저장</button>
          </div>
        </div>
      </div>
      <div className="wrap">
        <div className="cms-grid">
          <div>
            <div className="steps3">
              <div className="s" data-on={stepOn[0]}><i>1</i>글 쓰기</div>
              <div className="s" data-on={stepOn[1]}><i>2</i>사진 끌어놓기</div>
              <div className="s" data-on={stepOn[2]}><i>3</i>공개하기</div>
            </div>
            <div className="card editor-card" style={{ borderRadius: 12 }}>
              <div className="field"><label>제목</label>
                <input className="input" aria-invalid={tried && !title.trim()} placeholder="예: 폐업 번식장에서 열두 마리를 구조했습니다" value={title} onChange={e => setTitle(e.target.value)} />
                {tried && !title.trim() && <span className="err">제목을 입력하면 저장할 수 있습니다.</span>}
              </div>
              <div className="field"><label>게시판</label>
                <select className="input" value={cat} onChange={e => setCat(e.target.value)}>
                  {['구조동물 소식', '공지', '입양 후기', '후원 내역', '재능기부', '뉴스레터'].map(c => <option key={c}>{c}</option>)}
                </select></div>
              <div className="field"><label>본문</label>
                <div className="toolbar">
                  <button aria-label="굵게" onClick={() => setBody(b => b + '**굵은 글씨**')}><Icon name="bold" size={16} /></button>
                  <button aria-label="목록" onClick={() => setBody(b => b + '\n- 목록 항목')}><Icon name="list" size={16} /></button>
                  <button aria-label="링크" onClick={() => setBody(b => b + '[링크 문구](주소)')}><Icon name="link" size={16} /></button>
                  <button aria-label="사진 넣기" onClick={() => addFiles(DEMO_FILES.slice(0, 2))}><Icon name="image" size={16} /></button>
                </div>
                <textarea className="input" rows={6} placeholder="코드 없이 글만 쓰면 됩니다. 사진은 아래 영역에 끌어다 놓으세요." value={body} onChange={e => setBody(e.target.value)} />
              </div>
              <div className="field"><label>사진 <span style={{ fontWeight: 400, color: 'var(--n7)' }}>— 여러 장을 한 번에 끌어놓을 수 있어요</span></label>
                <div className="dropzone" data-over={over} onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)} onDrop={onDrop} onClick={() => addFiles(DEMO_FILES.slice(0, 3))}>
                  <Icon name="upload" size={28} style={{ color: 'var(--n7)' }} />
                  <b style={{ fontSize: 15 }}>여기에 사진을 끌어다 놓으세요</b>
                  <span className="hint">또는 이 영역을 눌러 시연 사진 3장을 올려 봅니다 · 업로드 후 서버에서 크기와 썸네일을 자동으로 맞춥니다</span>
                </div>
              </div>
              {files.length > 0 && (
                <div className="thumbs">
                  {files.map((x, i) => (
                    <div className="thumb" key={x.id}>
                      <div className="thumb-img"><Pet species={i % 2 ? 'cat' : 'dog'} v={x.v} size={84} /></div>
                      <div className="thumb-bar"><i style={{ width: x.p + '%' }}></i></div>
                      <div className="thumb-meta">
                        <span className="num" style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{x.p >= 100 ? (i === 0 ? '대표 사진' : x.s) : Math.round(x.p) + '%'}</span>
                        <div>
                          <button aria-label="앞으로" onClick={() => move(i, -1)}><Icon name="arrow-left" size={13} /></button>
                          <button aria-label="뒤로" onClick={() => move(i, 1)}><Icon name="arrow-right" size={13} /></button>
                          <button aria-label="삭제" onClick={() => setFiles(p => p.filter(y => y.id !== x.id))}><Icon name="x" size={13} /></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
          <aside className="card side-card">
            <h3 style={{ fontSize: 16, letterSpacing: '-.02em' }}>게시 설정</h3>
            <div className="field"><label>공개 상태</label>
              <div className="seg">
                {[['draft', '임시저장'], ['public', '공개'], ['hidden', '숨김']].map(([k, l]) => <button key={k} aria-pressed={status === k} onClick={() => setStatus(k)}>{l}</button>)}
              </div>
              <span className="hint">{status === 'draft' ? '임시저장 글은 방문자 화면에 나타나지 않습니다.' : status === 'public' ? '공개하면 소식 목록에 바로 나타납니다.' : '숨김 글은 목록과 주소 접근 모두 서버에서 막습니다.'}</span>
            </div>
            <div className="row-between"><div><div className="lbl">메인 소식에 고정</div><span className="hint">메인 화면 최신 소식에 우선 노출</span></div>
              <SwitchBtn /></div>
            <button className="btn btn-primary btn-lg" onClick={() => save('public')}>공개하기</button>
            <button className="btn btn-line" onClick={() => save('hidden')}><Icon name="eye-off" size={15} />숨김으로 저장</button>
          </aside>
        </div>
        <div className="card" style={{ marginBottom: 32, overflow: 'hidden' }}>
          <div className="row-between" style={{ padding: '16px 20px', borderBottom: '1px solid var(--n3)' }}><h3 style={{ fontSize: 16 }}>최근 글</h3><span className="hint">공개·숨김 전환은 한 번의 클릭입니다</span></div>
          <table className="table">
            <thead><tr><th>제목</th><th>게시판</th><th>상태</th><th>수정일</th><th></th></tr></thead>
            <tbody>
              {posts.map(p => (
                <tr key={p.id}>
                  <td style={{ fontWeight: 600 }}>{p.t}</td><td>{p.c}</td>
                  <td>{p.s === 'public' ? <span className="badge badge-ok">공개</span> : p.s === 'draft' ? <span className="badge badge-wait">임시저장</span> : <span className="badge badge-hide">숨김</span>}</td>
                  <td className="num" style={{ color: 'var(--n7)' }}>{p.d}</td>
                  <td style={{ textAlign: 'right' }}><button className="btn btn-line" style={{ height: 30, fontSize: 12 }} onClick={() => toggleVis(p.id)}>{p.s === 'public' ? '숨기기' : '공개하기'}</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
function SwitchBtn() {
  const [on, setOn] = useState(true);
  return <button className="switch" role="switch" aria-checked={on} aria-label="메인 고정" onClick={() => setOn(!on)}></button>;
}

/* ── 개체 관리: 상태 변경일 자동 기록 ── */
const SHELTER = ['구조 직후', '치료 중', '보호 중', '임시보호 중', '입양 완료'];
function AnimalsView({ say }) {
  const today = () => { const d = new Date(); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); };
  const [rows, setRows] = useState(() => ANIMALS.map(a => ({ ...a, hidden: false, draft: false, hist: [{ d: '2026.10.12', t: '구조 · 개체 등록', k: 0 }, { d: '2026.10.30', t: '보호 상태 ' + a.shelter + '로 기록', k: 1 }] })));
  const [sel, setSel] = useState(1);
  const [q, setQ] = useState('');
  const [form, setForm] = useState(null);
  const [add, setAdd] = useState(false);
  const cur = rows.find(r => r.id === sel);
  useEffect(() => { if (cur) setForm({ name: cur.name, shelter: cur.shelter, status: cur.status, hidden: cur.hidden }); }, [sel]);
  const vis = rows.filter(r => r.name.includes(q.trim()));
  const nid = useRef(100);

  const submit = asDraft => {
    const changes = [];
    if (form.shelter !== cur.shelter) changes.push('보호 상태 ' + cur.shelter + ' → ' + form.shelter);
    if (form.status !== cur.status) changes.push('입양 상태 ' + STATUS[cur.status] + ' → ' + STATUS[form.status]);
    setRows(p => p.map(r => r.id === sel ? { ...r, name: form.name, shelter: form.shelter, status: form.status, hidden: form.hidden, draft: asDraft,
      hist: [...changes.map(c => ({ d: today(), t: c, k: 2 })), ...r.hist] } : r));
    say(asDraft ? '임시저장했습니다 — 공개 목록에는 나타나지 않습니다' : changes.length ? '저장했습니다 — 변경일 ' + today() + '이 자동으로 기록됩니다' : '저장했습니다');
  };
  if (!cur || !form) return null;
  const dirty = form.shelter !== cur.shelter || form.status !== cur.status;

  return (
    <div className="view">
      <div className="admin-bar">
        <div className="wrap">
          <div className="crumbs"><Icon name="paw-print" size={16} />관리자<Icon name="chevron-down" size={14} style={{ transform: 'rotate(-90deg)' }} /><b>개체 관리</b></div>
          <button className="btn btn-primary" onClick={() => setAdd(true)}><Icon name="plus" size={15} />새 개체 등록</button>
        </div>
      </div>
      <div className="wrap">
        <div className="mgr-grid">
          <div className="card list-rail">
            <div className="list-head">
              <div className="field"><input className="input" placeholder="개체 이름 검색" value={q} onChange={e => setQ(e.target.value)} /></div>
              <div className="card-meta" style={{ margin: 0 }}>전체 <b className="num">{rows.length}</b>마리 · 숨김 <b className="num">{rows.filter(r => r.hidden).length}</b>마리</div>
            </div>
            <div style={{ maxHeight: 640, overflowY: 'auto' }}>
              {vis.map(r => (
                <button key={r.id} className="list-row" aria-selected={sel === r.id} onClick={() => setSel(r.id)}>
                  <span className="mini"><Pet species={r.species} v={r.v} size={44} /></span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <b style={{ display: 'block', fontSize: 15 }}>{r.name}</b>
                    <span className="card-meta" style={{ margin: 0 }}>{r.shelter}</span>
                  </span>
                  {r.hidden ? <span className="badge badge-hide">숨김</span> : r.draft ? <span className="badge badge-wait">임시저장</span> : <StatusBadge s={r.status} />}
                </button>
              ))}
            </div>
          </div>
          <div className="card detail">
            <div className="row-between">
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <span className="mini" style={{ width: 60, height: 60 }}><Pet species={cur.species} v={cur.v} size={60} /></span>
                <div><h2 style={{ fontSize: 26, letterSpacing: '-.03em' }}>{cur.name}</h2><span className="card-meta">{cur.species === 'dog' ? '강아지' : '고양이'} · {SEX[cur.sex]} · {cur.age} · <span className="num">{cur.weight}kg</span></span></div>
              </div>
              <StatusBadge s={cur.status} />
            </div>
            <div className="form-grid">
              <div className="field"><label>이름</label><input className="input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
              <div className="field"><label>보호 상태</label>
                <select className="input" value={form.shelter} onChange={e => setForm({ ...form, shelter: e.target.value })}>{SHELTER.map(s => <option key={s}>{s}</option>)}</select></div>
              <div className="field"><label>입양 상태</label>
                <select className="input" value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>{Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
              <div className="field"><label>공개 여부</label>
                <div className="row-between" style={{ height: 42 }}>
                  <span style={{ fontSize: 14 }}>{form.hidden ? '숨김 — 방문자에게 보이지 않음' : '공개 — 목록과 검색에 표시'}</span>
                  <button className="switch" role="switch" aria-checked={!form.hidden} aria-label="공개 여부" onClick={() => setForm({ ...form, hidden: !form.hidden })}></button>
                </div></div>
            </div>
            {dirty && (
              <div className="card" style={{ padding: 12, display: 'flex', gap: 10, alignItems: 'center', fontSize: 13, background: 'var(--m50)', borderColor: 'var(--m200)', color: 'var(--m800)' }}>
                <Icon name="calendar" size={16} />상태가 바뀌었습니다. 저장하면 변경일 <b className="num">{today()}</b>이 이력에 자동으로 남습니다.
              </div>
            )}
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-primary btn-lg" onClick={() => submit(false)}><Icon name="save" size={17} />저장하기</button>
              <button className="btn btn-line btn-lg" onClick={() => submit(true)}>임시저장</button>
            </div>
            <div>
              <div className="row-between" style={{ marginBottom: 14 }}><h3 style={{ fontSize: 16 }}>상태 변경 이력</h3><span className="hint">서버가 변경일과 이전 상태를 함께 저장합니다</span></div>
              <div className="timeline">
                {cur.hist.map((h, i) => (
                  <div className="tl-item" key={i}><div className="tl-date num">{h.d}</div><div className="tl-text">{h.t}</div></div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
      {add && <AddAnimal onClose={() => setAdd(false)} onAdd={nm => {
        const id = nid.current++;
        setRows(p => [{ id, name: nm.name, species: nm.species, sex: nm.sex, age: '미상', ageGroup: 'young', weight: 0, wg: 's', status: 'available', v: id % 4, shelter: '구조 직후', place: '구조 지역 입력 예정', health: '', story: '', hidden: false, draft: true, hist: [{ d: today(), t: '구조 · 개체 등록 (임시저장)', k: 0 }] }, ...p]);
        setSel(id); setAdd(false); say(nm.name + ' 개체를 임시저장으로 등록했습니다');
      }} />}
    </div>
  );
}
function AddAnimal({ onClose, onAdd }) {
  const [nm, setNm] = useState({ name: '', species: 'dog', sex: 'M' });
  const [tried, setTried] = useState(false);
  return (
    <div className="overlay overlay-center" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3 style={{ fontSize: 22, letterSpacing: '-.03em', marginBottom: 18 }}>새 개체 등록</h3>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="field"><label>이름</label>
            <input className="input" aria-invalid={tried && !nm.name.trim()} placeholder="예: 다온" value={nm.name} onChange={e => setNm({ ...nm, name: e.target.value })} />
            {tried && !nm.name.trim() && <span className="err">이름을 입력해 주세요.</span>}</div>
          <div className="field"><label>동물 구분</label>
            <div className="seg"><button aria-pressed={nm.species === 'dog'} onClick={() => setNm({ ...nm, species: 'dog' })}>강아지</button><button aria-pressed={nm.species === 'cat'} onClick={() => setNm({ ...nm, species: 'cat' })}>고양이</button></div></div>
          <div className="field"><label>성별</label>
            <div className="seg"><button aria-pressed={nm.sex === 'M'} onClick={() => setNm({ ...nm, sex: 'M' })}>수컷</button><button aria-pressed={nm.sex === 'F'} onClick={() => setNm({ ...nm, sex: 'F' })}>암컷</button></div></div>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 22 }}>
          <button className="btn btn-primary btn-lg" style={{ flex: 1 }} onClick={() => { setTried(true); if (nm.name.trim()) onAdd(nm); }}>임시저장으로 등록</button>
          <button className="btn btn-line btn-lg" onClick={onClose}>취소</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
