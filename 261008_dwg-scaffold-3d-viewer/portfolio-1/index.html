<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (hue 151°, light) ── */
:root{
  --m50:#eef9f4;--m100:#ddf2e8;--m200:#bbe6d1;--m300:#92d7b6;--m400:#64c597;--m500:#39b579;--m600:#0da55c;--m700:#0b874b;--m800:#086a3b;--m900:#064a29;
  --n0:#ffffff;--n1:#f2f5fa;--n2:#eff0f0;--n3:#e5e6e6;--n4:#d5d7d6;--n5:#b5bab8;--n6:#909894;--n7:#717a75;--n8:#535a57;--n9:#363a38;--n10:#1e201f;
  --s2:#cf3f3f;--s2-bg:#f9e7e7;--s2-text:#ad1f1f;
  --s3:#d48d11;--s3-bg:#f6f1ea;--s3-text:#8b6118;
}
/* ── 상태 레이어 P1 ── */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n1);color:var(--n9);font-size:14px;line-height:1.5;overflow:hidden}
a{text-decoration:none;color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--n10)}
i.ph,i.ph-bold{font-size:18px;line-height:1;flex-shrink:0}

/* 4단 위계: 12 / 14 / 18 / 24 + 디스플레이 40 */
.t-cap{font-size:12px;color:var(--n7);line-height:1.6}
.t-sub{font-size:18px;font-weight:700;color:var(--n10);line-height:1.4}
.t-head{font-size:24px;font-weight:700;color:var(--n10);line-height:1.3}
.t-disp{font-size:40px;font-weight:800;color:var(--n10);line-height:1.1;letter-spacing:-.02em}

.app{display:flex;width:100%;height:100vh}
.workspace-strip{width:64px;flex-shrink:0;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:12px}
.ws-item{width:40px;height:40px;border-radius:12px;background:var(--n9);color:var(--n4);display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;transition:border-radius .2s,background .2s}
.ws-item:hover{border-radius:20px;background:var(--n8)}
.ws-item.active{background:var(--m600);color:var(--n0);border-radius:20px}
.ws-item.active::before{content:"";position:absolute;left:-12px;top:10px;width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--n0)}
.ws-divider{width:24px;height:2px;background:var(--n8);border-radius:2px}
.channel-list{width:260px;flex-shrink:0;background:var(--n0);border-right:1px solid var(--n3);display:flex;flex-direction:column;overflow:hidden}
.channel-header{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ws-name{font-size:18px;font-weight:700;color:var(--n10);line-height:1.3}
.channel-search{padding:0 16px 12px}
.channel-search input{width:100%;height:40px;border:1px solid var(--n4);border-radius:8px;padding:0 12px;background:var(--n1)}
.channel-scroll{flex:1;overflow:auto;padding:0 8px 16px}
.section-title{font-size:12px;font-weight:700;color:var(--n7);padding:16px 8px 8px}
.channel-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:12px;color:var(--n8);font-weight:500;transition:background .15s}
.channel-item:hover{background:var(--n1)}
.channel-item.active{background:var(--m50);color:var(--n10);font-weight:700;box-shadow:inset 3px 0 0 var(--m600)}
.dm-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:12px;transition:background .15s}
.dm-item:hover{background:var(--n1)}
.dm-item.active{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.dm-item .nm{flex:1;min-width:0;font-weight:600;color:var(--n9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-item .sub{font-size:12px;color:var(--n7)}
.presence{width:8px;height:8px;border-radius:50%;background:var(--n5);flex-shrink:0}
.presence.on{background:var(--n10)}
.presence.run{background:var(--n10);animation:pulseDot 1.2s ease-in-out infinite}
.presence.bad{background:var(--s2)}
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n1)}
.conv-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--n0);border-bottom:1px solid var(--n3);gap:16px}

.pill.dark{background:var(--n10);color:var(--n0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:40px;font-weight:600;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn.primary{background:var(--m600);color:var(--n0)}

.msg-name{font-weight:700;color:var(--n10)}
.conv-input{position:sticky;bottom:0;background:var(--n0);border-top:1px solid var(--n3);padding:16px 24px;display:flex;gap:12px;align-items:center}
.msg-input{flex:1;height:40px;border:1px solid var(--n4);border-radius:40px;padding:0 20px;background:var(--n1)}

.info-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--n3)}

.kv span:first-child{color:var(--n7)}

tr.row{cursor:pointer;transition:background .15s}
tr.row:hover{background:var(--n1)}
tr.row.sel{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.num-in{width:80px;height:32px;border:1px solid var(--n4);border-radius:8px;padding:0 8px;text-align:right;background:var(--n0)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:600;color:var(--n8)}
.field input,.field textarea{border:1px solid var(--n4);border-radius:8px;padding:8px 12px;background:var(--n0);height:40px}
.field textarea{height:96px;resize:none;padding:12px}
.err{font-size:12px;color:var(--s2-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.steps{display:flex;gap:8px}
.step{flex:1;display:flex;flex-direction:column;gap:8px}
.step .bar{height:8px;border-radius:8px;background:var(--n3);overflow:hidden;position:relative}
.step .bar>i{position:absolute;inset:0;background:var(--m600);transform-origin:left;animation:barGrow .9s ease both}
.step .bar>i.half{background:linear-gradient(90deg,var(--m600),var(--m300),var(--m600));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.step .lb{font-size:12px;font-weight:600;color:var(--n8)}
.drop{border:2px dashed var(--n4);border-radius:20px;padding:32px;display:flex;align-items:center;gap:24px;background:var(--n1);transition:border-color .2s,background .2s}
.drop:hover{border-color:var(--m500);background:var(--m50)}
.viewer-wrap{position:relative;height:420px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,var(--n0) 0%,var(--n2) 100%);box-shadow:0 12px 32px -16px rgba(0,0,0,.18)}
.viewer-wrap canvas{display:block;cursor:grab}
.viewer-hint{position:absolute;left:16px;bottom:16px;display:flex;gap:8px}
.viewer-legend{position:absolute;right:16px;top:16px;background:var(--n0);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:9999px;border:1px solid var(--n4);background:var(--n0);font-weight:600;color:var(--n8);transition:background .15s}
.chip.on{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.toast{position:fixed;left:96px;bottom:24px;background:var(--n10);color:var(--n0);padding:12px 24px;border-radius:12px;display:flex;align-items:center;gap:12px;animation:fadeUp .3s ease both;z-index:50;box-shadow:0 12px 32px -12px rgba(0,0,0,.4)}
.browser{border:1px solid var(--n4);border-radius:12px;overflow:hidden;background:var(--n0)}
.browser .bar{height:32px;background:var(--n2);display:flex;align-items:center;gap:8px;padding:0 12px}
.browser .dot{width:8px;height:8px;border-radius:50%;background:var(--n5)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--n10);color:var(--n3);padding:12px 16px;border-radius:12px;overflow:auto;white-space:pre}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px;color:var(--n7);text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (max-width:1180px){.info-panel{display:none}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const C = k => getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();

const SITES = [
  { id:'d1', name:'동탄 물류센터 A동', file:'DT-LC-A_평면_rev3.dwg', ini:'동', status:'done', unit:'mm', layers:41, when:'10.08 09:12', owner:'김도윤',
    poly:[[0,0],[48,0],[48,22],[30,22],[30,36],[0,36]], floors:[5.5,4.5,4.5,4.5] },
  { id:'d2', name:'판교 오피스 신축', file:'PG-OF-본동_입면_rev1.dwg', ini:'판', status:'fix', unit:'mm', layers:63, when:'10.07 17:40', owner:'이서연',
    poly:[[0,0],[40,0],[40,18],[26,18],[26,30],[0,30]], floors:[4.8,4.2,4.2,4.2,4.2,4.2,4.2,4.2] },
  { id:'d3', name:'김포 주상복합 2단지', file:'GP-RS-2단지_배치.dwg', ini:'김', status:'run', unit:'m', layers:52, when:'10.08 10:05', owner:'박지훈',
    poly:[[0,0],[34,0],[34,14],[20,14],[20,26],[0,26]], floors:[4.5,3.6,3.6,3.6,3.6,3.6] },
  { id:'d4', name:'청주 공장 증축', file:'CJ-FA-증축_평면.dwg', ini:'청', status:'fail', unit:'mm', layers:0, when:'10.06 14:21', owner:'최유나',
    poly:[[0,0],[60,0],[60,24],[0,24]], floors:[7.0,5.0] },
  { id:'d5', name:'세종 근린생활시설', file:'SJ-NL-2동_입면.dwg', ini:'세', status:'done', unit:'mm', layers:28, when:'10.05 11:48', owner:'김도윤',
    poly:[[0,0],[26,0],[26,12],[16,12],[16,20],[0,20]], floors:[4.5,3.9,3.9] },
];
const STATUS = { done:['인식 완료','dark','on'], fix:['보정 중','main','on'], run:['변환 중','','run'], fail:['변환 실패','bad','bad'] };
const NAV = [
  ['main','DWG 도면 업로드·DXF 변환','upload-simple'],
  ['viewer3d','3D 외관 뷰어','cube'],
  ['quantity','개략 물량 산출·수동 보정','ruler'],
  ['estimate','엑셀 출력·견적 요청','file-xls'],
];
const perim = p => p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+Math.hypot(b[0]-a[0],b[1]-a[1]);},0);
const fmt = (n,d=1) => n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});

function Ico({n,b}){ return <i className={(b?'ph-bold ph-':'ph ph-')+n}></i>; }

/* 2D 평면 — 인식된 외곽선과 치수 */
function Plan({site, emphasis}){
  const W=420,H=280,pad=40;
  const xs=site.poly.map(p=>p[0]), ys=site.poly.map(p=>p[1]);
  const mx=Math.max(...xs), my=Math.max(...ys);
  const s=Math.min((W-pad*2)/mx,(H-pad*2)/my);
  const ox=(W-mx*s)/2, oy=(H-my*s)/2;
  const pt=p=>[ox+p[0]*s, oy+p[1]*s];
  const pts=site.poly.map(pt);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' Z';
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',background:'var(--n1)',borderRadius:12}} role="img" aria-label="인식된 외곽선">
      <defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--n4)"/></pattern></defs>
      <rect width={W} height={H} fill="url(#dots)"/>
      <path d={d} fill="var(--n0)" stroke="var(--n6)" strokeWidth="1.5"/>
      <path d={d} fill="none" stroke="var(--m600)" strokeWidth={emphasis?4:2.5} strokeLinejoin="round"/>
      {pts.map((p,i)=>{
        const q=pts[(i+1)%pts.length], a=site.poly[i], b=site.poly[(i+1)%site.poly.length];
        const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
        return <g key={i}><circle cx={p[0]} cy={p[1]} r="3.5" fill="var(--n0)" stroke="var(--m700)" strokeWidth="1.5"/>
          <text x={(p[0]+q[0])/2} y={(p[1]+q[1])/2-6} fontSize="10" textAnchor="middle" fill="var(--n8)" style={{fontVariantNumeric:'tabular-nums'}}>{fmt(len)}m</text></g>;
      })}
    </svg>
  );
}

/* three.js — 외곽선 압출 + 비계 설치 구간 띠 */
function Viewer3D({site, heights, hidden}){
  const ref = useRef(null);
  const rot = useRef({y:0.6, drag:false, lx:0, dist:1});
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const w = el.clientWidth, h = el.clientHeight;
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(w,h);
    el.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, w/h, 0.1, 1000);
    const xs=site.poly.map(p=>p[0]), ys=site.poly.map(p=>p[1]);
    const cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2;
    const total=heights.reduce((a,b)=>a+b,0);
    const span=Math.max(Math.max(...xs),Math.max(...ys),total*1.4);
    scene.add(new THREE.AmbientLight(0xffffff,0.75));
    const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(30,60,40); scene.add(dl);
    const grid=new THREE.GridHelper(span*2.2,22,new THREE.Color(C('n4')),new THREE.Color(C('n3'))); scene.add(grid);
    const g=new THREE.Group(); scene.add(g);
    const pts=site.poly.map(p=>new THREE.Vector2(p[0]-cx,-(p[1]-cy)));
    let signed=0; pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length];signed+=a.x*b.y-b.x*a.y;});
    let z0=0;
    heights.forEach((fh,i)=>{
      if(!hidden.includes(i)){
        const shape=new THREE.Shape(pts);
        const geo=new THREE.ExtrudeGeometry(shape,{depth:fh*0.96,bevelEnabled:false});
        geo.rotateX(-Math.PI/2); geo.translate(0,z0,0);
        const mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:new THREE.Color(i%2?C('n4'):C('n3'))}));
        g.add(mesh);
        const ed=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:new THREE.Color(C('n6'))})); g.add(ed);
        // 비계 설치 구간: 외곽선 바깥 0.9m 띠
        pts.forEach((a,k)=>{
          const b=pts[(k+1)%pts.length]; const len=Math.hypot(b.x-a.x,b.y-a.y);
          let nx=(b.y-a.y)/len, ny=-(b.x-a.x)/len; if(signed<0){nx=-nx;ny=-ny;}
          const mx=(a.x+b.x)/2+nx*0.9, my=(a.y+b.y)/2+ny*0.9;
          const pg=new THREE.PlaneGeometry(len,fh*0.96);
          const pm=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:new THREE.Color(C('m500')),transparent:true,opacity:0.28,side:THREE.DoubleSide,depthWrite:false}));
          pm.position.set(mx,z0+fh*0.48,-my);
          pm.rotation.y=Math.atan2(b.y-a.y,b.x-a.x);
          g.add(pm);
          const pe=new THREE.LineSegments(new THREE.EdgesGeometry(pg),new THREE.LineBasicMaterial({color:new THREE.Color(C('m700'))}));
          pe.position.copy(pm.position); pe.rotation.copy(pm.rotation); g.add(pe);
        });
      }
      z0+=fh;
    });
    g.position.y=0;
    const dist=span*2.1;
    const draw=()=>{
      const r=rot.current;
      if(!r.drag) r.y+=0.0035;
      g.rotation.y=r.y; grid.rotation.y=r.y;
      const d=dist*r.dist;
      cam.position.set(d*0.62,d*0.55,d*0.62); cam.lookAt(0,total*0.38,0);
      renderer.render(scene,cam);
    };
    let raf; const loop=()=>{draw();raf=requestAnimationFrame(loop)}; loop();
    const cv=renderer.domElement;
    const down=e=>{rot.current.drag=true;rot.current.lx=e.clientX;cv.style.cursor='grabbing'};
    const move=e=>{const r=rot.current;if(!r.drag)return;r.y+=(e.clientX-r.lx)*0.01;r.lx=e.clientX};
    const up=()=>{rot.current.drag=false;cv.style.cursor='grab'};
    const wheel=e=>{e.preventDefault();rot.current.dist=Math.min(1.6,Math.max(0.55,rot.current.dist+e.deltaY*0.001))};
    cv.addEventListener('pointerdown',down); window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); cv.addEventListener('wheel',wheel,{passive:false});
    return ()=>{
      cancelAnimationFrame(raf);
      cv.removeEventListener('pointerdown',down); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); cv.removeEventListener('wheel',wheel);
      renderer.dispose(); if(cv.parentNode) cv.parentNode.removeChild(cv);
    };
  },[site.id, heights.join(','), hidden.join(',')]);
  return <div ref={ref} style={{position:'absolute',inset:0}} />;
}

                    <div className="field"><label>업체명</label><input value={form.co} aria-invalid={!!errs.co} onChange={e=>setForm({...form,co:e.target.value})} placeholder="예: 샘플건설"/>{errs.co&&<span className="err">{errs.co}</span>}</div>
                    <div className="field"><label>현장명</label><input value={form.site} aria-invalid={!!errs.site} onChange={e=>setForm({...form,site:e.target.value})} placeholder="예: 동탄 A동 신축"/>{errs.site&&<span className="err">{errs.site}</span>}</div>
                    <div className="field"><label>연락처</label><input value={form.tel} aria-invalid={!!errs.tel} onChange={e=>setForm({...form,tel:e.target.value})} placeholder="010-0000-0000"/>{errs.tel&&<span className="err">{errs.tel}</span>}</div>
                    <button className="btn primary" onClick={submit}>견적 요청 보내기</button>
                  </>) : (
                    <div className="empty" style={{animation:'fadeUp .3s ease both'}}>
                      <Ico n="check-circle" b/><div className="t-sub">견적 요청이 접수됐어요</div>
                      <span className="pill dark num">접수 번호 {sent}</span>
                      <button className="btn line sm" onClick={()=>{setSent(null);setForm({co:'',site:'',tel:'',note:''})}}>새 요청 쓰기</button>
                    </div>)}
                </div>
              </div>
              <div className="card">
                <div className="card-head"><span className="t-sub">기존 홈페이지에 넣기</span><span className="t-cap">iframe 한 줄로 같은 화면을 쓸 수 있어요</span></div>
                <div className="grid2">
                  <div className="code">{'<iframe\n  src="https://demo.example.com/embed/quote"\n  width="100%" height="720"\n  allow="clipboard-write"></iframe>'}</div>
                  <div className="browser">
                    <div className="bar"><i className="dot"></i><i className="dot"></i><i className="dot"></i><span className="t-cap" style={{marginLeft:8}}>샘플 가설재 홈페이지</span></div>
                    <div style={{padding:16,display:'flex',flexDirection:'column',gap:8}}>
                      <div style={{height:8,width:'50%',borderRadius:8,background:'var(--n3)'}}></div>
                      <div style={{border:'2px solid var(--m500)',borderRadius:12,padding:16}}><b>도면 올리고 견적 받기</b><div className="t-cap">이 영역이 임베드 화면이에요</div></div>
                    </div>
                  </div>
                </div>
                <button className="btn line sm" style={{alignSelf:'flex-start'}} onClick={()=>say('임베드 코드를 복사했어요.')}><Ico n="copy"/>코드 복사하기</button>
              </div>
            </div>)}
        </div>

        <footer className="conv-input">
          <input className="msg-input" value={memo} onChange={e=>setMemo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMemo()} placeholder={site.name+' 도면에 메모 남기기'} aria-label="도면 메모"/>
          <button className="btn primary sm" onClick={sendMemo}>메모 남기기</button>
        </footer>
      </main>

      {info && (
        <aside className="info-panel detail-panel" data-info-panel style={{width:320}}>
          <header className="info-header"><h3 className="t-sub">도면 정보</h3><button className="icon-btn close-info" title="패널 닫기" onClick={()=>setInfo(false)}><Ico n="x"/></button></header>
          <div className="info-section">
            <div className="kv"><span>파일</span><span style={{maxWidth:170,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{site.file}</span></div>
            <div className="kv"><span>변환기</span><span>LibreDWG (별도 프로세스)</span></div>
            <div className="kv"><span>단위</span><span>{site.unit}</span></div>
            <div className="kv"><span>레이어</span><span className="num">{site.layers}개</span></div>
            <div className="kv"><span>올린 시각</span><span>{site.when}</span></div>
          </div>
          <div className="info-section">
            <div className="info-label">담당자 (3)</div>
            {[[site.owner,'도면 검토'],['이서연','산출 보정'],['최유나','견적 회신']].map(([n,r])=>(
              <div className="member-item item" key={n}><span className="member-avatar">{n.charAt(0)}</span><span style={{flex:1,fontWeight:600}}>{n}</span><span className="t-cap">{r}</span></div>))}
          </div>
          <div className="info-section">
            <div className="info-label">현장 메모</div>
            {(memos[sid]||[]).length===0 && <div className="t-cap">아직 메모가 없어요. 아래 입력창에서 남겨 보세요.</div>}
            {(memos[sid]||[]).map((m,i)=>(
              <div className="msg-group" key={i}><span className="msg-avatar" style={{width:32,height:32,fontSize:12}}>{m.w.charAt(0)}</span>
                <div><div className="msg-meta"><span className="msg-name">{m.w}</span><span className="t-cap">{m.t}</span></div><div>{m.m}</div></div></div>))}
          </div>
          <div className="info-section">
            <div className="info-label">변경 이력</div>
            <div className="t-cap">10.08 09:12 · 층고 1건 자동 추출</div>
            <div className="t-cap">10.08 09:14 · 외곽선 후보 4개 중 1개 선택</div>
            <div className="t-cap">10.08 09:20 · 하역장 구간 수동 추가</div>
          </div>
        </aside>)}
      {toast && <div className="toast"><Ico n="check-circle" b/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
