    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat));
    let y=0; const ring=(arr,yy)=>{const v=[];arr.forEach((p,i)=>{const q=arr[(i+1)%arr.length];v.push(p[0],yy,-p[1],q[0],yy,-q[1])});const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute(v,3));return new THREE.LineSegments(bg,scMat)};
    site.fl.forEach(f=>{y+=f; g.add(ring(off,y));});
    g.add(ring(off,0.2));
    const pv=[]; off.forEach((p,i)=>{const q=off[(i+1)%off.length];const len=Math.hypot(q[0]-p[0],q[1]-p[1]);const n=Math.max(1,Math.round(len/3));
      for(let k=0;k<n;k++){const t=k/n;const px=p[0]+(q[0]-p[0])*t,pz=-(p[1]+(q[1]-p[1])*t);pv.push(px,0.2,pz,px,total,pz);}});
    const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.Float32BufferAttribute(pv,3)); g.add(new THREE.LineSegments(pg,scMat));
    const floor=new THREE.GridHelper(span*2.4,24,new THREE.Color(C('n4')),new THREE.Color(C('n3'))); scene.add(floor);
    const dist=span*2.2; let ang=0.9, raf;
    const loop=()=>{ang+=0.006;g.rotation.y=ang;floor.rotation.y=ang;cam.position.set(dist*0.6,dist*0.5,dist*0.6);cam.lookAt(0,total*0.4,0);renderer.render(scene,cam);raf=requestAnimationFrame(loop)}; loop();
    return ()=>{cancelAnimationFrame(raf);renderer.dispose();if(renderer.domElement.parentNode)renderer.domElement.parentNode.removeChild(renderer.domElement)};
  },[site.id]);
  return <div ref={ref} style={{position:'absolute',inset:0}}/>;
}

                <div>
                  <div className="field"><label>허용 도메인</label>
                    <div style={{display:'flex',gap:8}}><input className="inp" style={{flex:1}} value={dom} disabled={!canEdit} aria-invalid={!!domErr} onChange={e=>setDom(e.target.value)} placeholder="www.example.kr"/><button className="btn line" onClick={addDom} disabled={!canEdit}>도메인 추가하기</button></div>
                    {domErr && <span className="err">{domErr}</span>}</div>
                  <div style={{marginTop:8}}>{doms.map(d=>(<div key={d} className="kv" style={{alignItems:'center',borderBottom:'1px solid var(--n2)'}}><span className="num" style={{color:'var(--n10)'}}>{d}</span><button className="btn txt" disabled={!canEdit} onClick={()=>setDoms(x=>x.filter(v=>v!==d))}>삭제하기</button></div>))}</div>
                  <div className="t-cap" style={{marginTop:8}}>목록에 없는 도메인에서 오는 임베드 요청은 차단돼요.</div>
                </div>
              </div>
            </div>
          </div>
        </main>)}

      {detail && (<>
        <div className="overlay" onClick={()=>setOpen(null)}></div>
        <aside className="drawer" role="dialog" aria-label="견적 요청 상세">
          <header className="card-h"><span className="t-sub">{detail.name}</span><button className="btn txt" onClick={()=>setOpen(null)}><Ti n="x"/>닫기</button></header>
          <div className="drawer-b">
            <div className="step-line">
              {['new','review','reply'].map((k,i,a)=>{const idx=a.indexOf(detail.status);return (<React.Fragment key={k}><span className={'dotx '+(i<idx?'done':i===idx?'cur':'')}>{i+1}</span><span className="t-cap" style={{color:'var(--n9)',fontWeight:700}}>{ST[k][0]}</span>{i<2&&<span className="ln"></span>}</React.Fragment>)})}
            </div>
            <div>
              <div className="kv"><span>업체명</span><span>{detail.co}</span></div>
              <div className="kv"><span>연락처</span><span className="num">{detail.tel}</span></div>
              <div className="kv"><span>첨부 도면</span><span className="num" style={{fontSize:13}}>{detail.file}</span></div>
              <div className="kv"><span>개략 면적</span><span className="num">{fmt(detail.area)}㎡</span></div>
              <div className="kv"><span>기준 버전</span><span>{vers[0].v}</span></div>
            </div>
            <div style={{display:'flex',gap:8}}>
              {detail.status!=='reply' ? <button className="btn primary" onClick={()=>advance(detail.id)} disabled={!canEdit}>{detail.status==='new'?'검토 시작하기':'회신 완료로 바꾸기'}</button> : <span className="tag ok"><Ti n="check"/>회신을 마쳤어요</span>}
              <button className="btn line" onClick={()=>{setSel(detail.id);setOpen(null);setTab('main')}}>지도에서 보기</button>
            </div>
            <div>
              <div className="t-cap" style={{fontWeight:700,marginBottom:8}}>담당자 메모</div>
              {(notes[detail.id]||[]).length===0 && <div className="t-cap">아직 메모가 없어요.</div>}
              {(notes[detail.id]||[]).map((n,i)=>(<div key={i} style={{padding:'8px 0',borderBottom:'1px solid var(--n2)'}}><b>{n.w}</b> <span className="t-cap num">{n.t}</span><div>{n.m}</div></div>))}
              <div style={{display:'flex',gap:8,marginTop:12}}><input className="inp" style={{flex:1}} value={memo} onChange={e=>setMemo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote(detail.id)} placeholder="회신 전 확인할 내용" aria-label="메모"/><button className="btn line" onClick={()=>addNote(detail.id)}>메모 남기기</button></div>
            </div>
          </div>
        </aside>
      </>)}
      {toast && <div className="toast"><Ti n="circle-check"/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
