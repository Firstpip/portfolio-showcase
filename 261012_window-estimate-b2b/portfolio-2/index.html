<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창호 견적 DB 및 실측·시공 운영 관리 웹 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 211°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#f0f5fb;
  --m100:#e0ebf6;
  --m200:#c1d6ed;
  --m300:#9cbee2;
  --m400:#72a2d6;
  --m500:#4a88cb;
  --m600:#226ebf;
  --m700:#1c5a9d;
  --m800:#16467a;
  --m900:#0f3156;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdf9f4;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b8ba;
  --n6:#909498;
  --n7:#71757a;
  --n8:#53575a;
  --n9:#36383a;
  --n10:#1e1f20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:14px;color:var(--n10)}
.ti{font-size:18px;line-height:1;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
/* 사이드바 */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--n1);border-right:1px solid var(--n3);padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:4px 12px 16px;font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--n10)}
.logo{width:32px;height:32px;border-radius:12px;background:var(--m600);display:grid;place-items:center}.logo .ti{color:var(--n0);font-size:18px}
.env{margin:0 8px 12px;height:36px;border-radius:999px;border:1px solid var(--n4);background:var(--n0);padding:0 12px;font-weight:600;color:var(--n8)}
.sidebar-section-title{font-size:12px;font-weight:600;color:var(--n7);padding:16px 12px 4px}
.sidebar-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:40px;padding:0 12px;border-radius:999px;font-weight:600;color:var(--n8);transition:background .15s}
.sidebar-link .ti{color:var(--n7)}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.active{background:var(--m50);color:var(--m700)}.sidebar-link.active .ti{color:var(--m600)}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--n3);font-size:12px;color:var(--n7)}
.av{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:700;font-size:14px}
.me b{display:block;color:var(--n10);font-size:14px}
/* 메인 */
.main-wrap{margin-left:240px;width:calc(100% - 240px);flex:1;min-width:0;min-height:100vh;padding:24px 32px 32px}
.main{min-width:0}
.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.page-title{font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.03em;color:var(--n10)}
.page-meta{margin-top:4px;font-size:14px;color:var(--n7);display:flex;gap:12px;align-items:center}
.page-actions{display:flex;gap:8px}
.btn{height:36px;padding:0 16px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:background .15s,filter .15s;white-space:nowrap}
.btn .ti{font-size:16px}
.btn-primary{background:var(--m600);color:var(--n0)}.btn-primary:hover{background:var(--m700)}.btn-primary .ti{color:var(--n0)}
.btn-secondary{background:var(--n1);border:1px solid var(--n4);color:var(--n9)}.btn-secondary:hover{background:var(--n2)}
.btn.block{width:100%;justify-content:center;height:40px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.stat-card{background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-end;animation:rise .4s ease backwards}
.stat-card:nth-child(2){animation-delay:.05s}.stat-card:nth-child(3){animation-delay:.1s}.stat-card:nth-child(4){animation-delay:.15s}
.stat-label{font-size:12px;font-weight:600;color:var(--n7)}
.stat-value{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.03em;color:var(--n10);margin-top:4px}
.stat-delta{font-size:12px;font-weight:600;margin-top:4px;color:var(--n7)}.stat-delta.positive{color:var(--s1-text)}.stat-delta.negative{color:var(--s2-text)}
.stat-sparkline{width:72px;height:32px;flex-shrink:0}
.stat-sparkline polyline{fill:none;stroke:var(--n6);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;animation:draw 1s ease forwards}
.stat-card:first-child .stat-sparkline polyline{stroke:var(--m600)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;margin-top:16px;align-items:start}
.data-section{background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:8px 24px 16px;min-width:0}
.tab-bar{display:flex;gap:24px;border-bottom:1px solid var(--n3)}
.tab{height:48px;font-weight:600;color:var(--n7);position:relative}
.tab.active{color:var(--m700)}.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--m600);border-radius:2px;animation:grow .25s ease}
.data-toolbar{display:flex;align-items:center;gap:8px;padding:16px 0 8px}
.search{height:36px;flex:1;max-width:280px;border-radius:999px;border:1px solid var(--n4);background:var(--n0);padding:0 16px}
.filter-chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--n4);background:var(--n1);font-weight:600;font-size:12px;color:var(--n8);display:inline-flex;align-items:center;gap:4px}
.filter-chip.on{border-color:var(--m600);background:var(--m50);color:var(--m700)}
.export-btn{margin-left:auto;height:32px;padding:0 12px;border-radius:999px;font-weight:600;font-size:12px;color:var(--n8);display:inline-flex;align-items:center;gap:4px}.export-btn:hover{background:var(--n2)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:12px;font-weight:600;color:var(--n7);height:36px;padding:0 12px;border-bottom:1px solid var(--n3);white-space:nowrap}
.data-table td{height:44px;padding:0 12px;border-bottom:1px solid var(--n3);white-space:nowrap}
.data-table .r{text-align:right}
.data-table tbody tr{cursor:pointer;transition:background .12s;animation:rise .3s ease backwards}
.data-table tbody tr:hover td{background:var(--n2)}
.data-table tbody tr.sel td{background:var(--m50)}.data-table tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--m600)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}.badge.bad{background:var(--s2-bg);color:var(--s2-text)}.badge.dark{background:var(--n10);color:var(--n0)}
.badge.sel{background:var(--m50);color:var(--m700)}
/* 상세 패널 */
.detail-panel{position:sticky;top:16px;background:var(--n1);border:1px solid var(--n3);border-radius:32px;padding:24px;animation:slideIn .3s ease;min-height:420px}
.detail-panel h3{font-size:18px;font-weight:800;color:var(--n10);letter-spacing:-.02em}
.dsub{font-size:12px;color:var(--n7);margin-top:4px}
.dkv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--n3);color:var(--n7)}.dkv b{color:var(--n10)}
.dsec{margin-top:20px}.dsec h5{font-size:12px;font-weight:600;color:var(--n7);margin-bottom:8px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--n8);margin:12px 0 4px}
.inp{height:40px;width:100%;border-radius:16px;border:1px solid var(--n4);background:var(--n0);padding:0 12px;font-weight:600}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:16px;border:1px solid var(--n3);background:var(--n0);margin-bottom:8px;text-align:left;transition:border-color .15s}
.pick:hover{border-color:var(--n5)}.pick.on{border-color:var(--m600);background:var(--m50)}
.pick:disabled{background:var(--n2)}
.pick .t{flex:1}.pick .t b{display:block;color:var(--n10)}.pick .t span{font-size:12px;color:var(--n7)}
.meter{height:8px;border-radius:8px;background:var(--n3);overflow:hidden}.meter span{display:block;height:100%;border-radius:8px;background:var(--m600);transform-origin:left;animation:grow .8s ease}
.diff{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:12px;color:var(--n8)}.diff .meter{flex:1}.diff .meter span{background:var(--m300)}.diff .meter span.hi{background:var(--m600)}
.mx{width:100%;border-collapse:collapse;font-size:12px}.mx th,.mx td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--n3)}.mx td:first-child,.mx th:first-child{text-align:left}.mx th{color:var(--n7);font-weight:600}
.mx .ti{font-size:16px;color:var(--n9)}.mx .no{color:var(--n5)}
.lock{display:flex;gap:8px;align-items:center;padding:12px;border-radius:16px;background:var(--n2);font-size:12px;color:var(--n8);margin-top:12px}
/* 모달 */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 45%,transparent);display:none;align-items:center;justify-content:center;z-index:60}
.overlay.on{display:flex;animation:fadeIn .2s ease}
.modal{width:440px;background:var(--n1);border-radius:32px;padding:32px;animation:rise .25s ease}
.modal h3{font-size:20px;font-weight:800;color:var(--n10)}.modal p{margin-top:8px;color:var(--n7)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
.toast{position:fixed;right:32px;bottom:32px;background:var(--n10);color:var(--n0);padding:12px 20px;border-radius:999px;font-weight:600;display:none;align-items:center;gap:8px;z-index:70}
.toast.on{display:flex;animation:slideIn .25s ease}.toast .ti{color:var(--n0)}
</style>
</head>

<div style="display:flex;width:100%;min-height:100vh" data-archetype="stripe-multipane">
<aside class="sidebar" data-sidebar>

<div class="main-wrap">

</div>

  d.innerHTML=h;if(cur==='main')prevAdj();
}
function prevAdj(){const r=curRow();if(!r||cur!=='main')return;const base=r.raw.c[2];const v=parseFloat(adjVal)||0;const nv=Math.round((adjMode==='pct'?base*(1+v/100):base+v)/100)*100;const el=$('#adjPrev');if(el)el.textContent=`조정 후 ${won(nv)} (${nv>=base?'+':''}${won(nv-base)})`}
function applyAdj(){const b=$('#adjBtn');b.setAttribute('data-loading','true');setTimeout(()=>{b.removeAttribute('data-loading');toast('초안 v4에 일괄 조정을 반영했습니다','adjustments')},1000)}
function cfDiff(){const r=curRow();const base=parseInt(r.raw[2].replace(/,/g,''));const v=parseInt($('#cfAmt').value.replace(/[^\d]/g,''))||0;const dif=v-base;$('#cfNote').textContent=`가견적 대비 ${dif>=0?'+':''}${dif.toLocaleString('ko-KR')}원 (${(dif/base*100).toFixed(1)}%)`}
function assignOne(i){if(pickIdx===null){toast('배정할 실측자를 먼저 선택해 주세요','user-question');return}REQ[i][3]=['배정 완료','sel'];toast('실측자를 배정했습니다','user-check');renderTable();renderDetail()}
function openConfirm(i){$('#md').innerHTML=`<h3>정밀실측 금액을 확정할까요?</h3><p>확정하면 요청 건 상태가 다음 단계로 바뀌고 앱 사용자에게 최종견적 안내가 전달됩니다.</p><label class="lbl">확정 금액</label><input class="inp num" value="${$('#cfAmt').value}원" disabled><div class="acts"><button class="btn btn-secondary" onclick="closeModal()">취소하기</button><button class="btn btn-primary" onclick="doConfirm(${i})">확정하기</button></div>`;$('#ov').classList.add('on')}
function doConfirm(i){REQ[i][3]=['실측 완료','ok'];closeModal();toast('정밀실측 금액을 확정했습니다','circle-check');renderTable();renderDetail()}
function closeModal(){$('#ov').classList.remove('on')}
function confirmSettle(i){const b=$('#stlBtn');b.setAttribute('data-loading','true');setTimeout(()=>{SETL[i][5]='정산 확정';toast('정산을 확정했습니다 — 이후 수정할 수 없습니다','circle-check');renderTable();renderDetail()},1000)}
function primaryAct(){const m={main:()=>toast('초안 v4를 게시하면 v3는 읽기 전용으로 유지됩니다','rocket'),versions:()=>toast('v3를 기준으로 새 초안을 만들었습니다','git-fork'),assign:()=>{pickIdx===null?toast('실측자를 먼저 선택해 주세요','user-question'):assignOne(curRow().i)},settlement:()=>confirmSettle(curRow().i),access:()=>toast('초대 메일 발송 화면이 열리는 위치입니다','mail')};m[cur]()}
function exportCsv(){toast('현재 목록을 CSV로 내보내는 중입니다','download')}
/* ── 화면 전환 ── */
function show(s){cur=s;tab='all';selId=null;filt=null;pickIdx=null;const sc=SCREENS[s];
  document.querySelectorAll('.sidebar-link').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  $('#pTitle').textContent=sc.title;$('#pMeta').innerHTML=`<span>${sc.meta}</span>`;$('#pPrimary').innerHTML=`<i class="ti ${sc.primary[0]}"></i>${sc.primary[1]}`;
  $('#stats').innerHTML=sc.stats.map(x=>`<div class="stat-card"><div><div class="stat-label">${x.l}</div><div class="stat-value num">${x.v}</div><div class="stat-delta ${x.dc}">${x.d}</div></div>${spark(x.a.split(',').map(Number))}</div>`).join('');
  $('#tabs').innerHTML=sc.tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
  $('#chips').innerHTML=sc.chips.map(c=>`<button class="filter-chip" onclick="setFilt(this,'${c}')">${c}</button>`).join('');
  $('#q').value='';renderTable();renderDetail();renderTable();}
function setTab(t){tab=t;selId=null;document.querySelectorAll('#tabs .tab').forEach((b,i)=>b.classList.toggle('active',SCREENS[cur].tabs[i][0]===t));renderTable();renderDetail()}
function setFilt(el,c){const on=filt===c;filt=on?null:c;document.querySelectorAll('#chips .filter-chip').forEach(b=>b.classList.remove('on'));if(!on)el.classList.add('on');selId=null;renderTable();renderDetail()}
function toast(t,ic='check'){const el=$('#toast');$('#toastT').textContent=t;el.querySelector('i').className='ti ti-'+ic;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
const DNA={borderRadius:32,boxShadow:'none',hoverScale:'scale(1.02)'};
document.querySelectorAll('.stat-card').forEach(el=>{el.style.borderRadius=DNA.borderRadius+'px';el.style.transition='transform .18s';
  el.addEventListener('mouseenter',()=>{el.style.transform='scale(1.02)';});el.addEventListener('mouseleave',()=>{el.style.transform='';});});
show('main');
</script>
