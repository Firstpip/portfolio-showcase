<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈페이지 관리자 콘솔 — 구현 데모</title>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 298°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fdeefd;
  --m100:#fadefb;
  --m200:#f5bdf7;
  --m300:#ef95f2;
  --m400:#e968ec;
  --m500:#e23de7;
  --m600:#dc13e2;
  --m700:#b410b9;
  --m800:#8d0c91;
  --m900:#630966;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f0f0f0;
  --n2:#f0eff0;
  --n3:#e6e5e6;
  --n4:#d7d5d7;
  --n5:#bab5ba;
  --n6:#989098;
  --n7:#7a717a;
  --n8:#5a5a5a;
  --n9:#3a363a;
  --n10:#080808;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
.num,[data-num]{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;z-index:20}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--n3);font-weight:700;font-size:15px}
.mark{width:24px;height:24px;border-radius:4px;background:var(--m600);color:#fff;display:grid;place-items:center;font-size:14px}
.sidebar-brand small{margin-left:auto;font-weight:500;color:var(--n6);font-size:11px}
.sidebar-cmdk-hint{margin:12px;padding:7px 10px;border:1px solid var(--n4);border-radius:4px;display:flex;align-items:center;gap:8px;color:var(--n7);font-size:13px;width:calc(100% - 24px);text-align:left}
.sidebar-cmdk-hint:hover{border-color:var(--n6)}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--n4);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--n7);background:var(--n0)}
.sidebar-nav{padding:4px 8px;display:grid;gap:2px}
.sidebar-section-title{font-size:11px;font-weight:600;color:var(--n6);padding:16px 16px 6px}
.sidebar-link{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;color:var(--n8);font-size:14px;cursor:pointer;transition:background .1s}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.active{background:var(--m50);color:var(--m700);font-weight:600}
.sidebar-link.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:4px;border-radius:0 2px 2px 0;background:var(--m600)}
.sidebar-link i{font-size:17px;color:var(--n6)}
.sidebar-link.active i{color:var(--m600)}
.sidebar-user{margin-top:auto;border-top:1px solid var(--n3);padding:12px 16px;display:flex;gap:10px;align-items:center}
.av{width:28px;height:28px;border-radius:50%;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:600;font-size:12px}
.sidebar-user b{display:block;font-size:13px}.sidebar-user span{font-size:12px;color:var(--n6)}

.main{margin-left:260px;width:calc(100% - 260px);flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--n0);border-bottom:1px solid var(--n3);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:10}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--n6);font-size:13px}
.breadcrumb .divider{color:var(--n5)}.breadcrumb b{color:var(--n10);font-weight:600}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:4px;border:1px solid var(--n4);background:var(--n1);transition:background .1s,box-shadow .15s}
.btn:hover{background:var(--n2)}
.btn.primary{background:var(--m600);border-color:var(--m600);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.btn.primary:hover{background:var(--m700)}
.btn.danger{color:var(--s2-text)}
.btn-cmdk{color:var(--n7)}
.content{padding:24px;flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.page-h{position:relative;overflow:hidden;border:1px solid var(--n3);border-radius:8px;padding:24px 28px;background:linear-gradient(120deg,var(--n1),var(--m50))}.page-h h1{font-size:40px;line-height:1.04;font-weight:600;letter-spacing:-.4px}.page-h .art{position:absolute;right:0;top:0;height:100%;width:340px;pointer-events:none}.eb{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--n7);margin-bottom:12px}.page-h p{font-size:16px;margin-top:10px}.page-h .wave{animation:drift 8s ease-in-out infinite}@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
.page-h p{color:var(--n7)}

.md{display:grid;grid-template-columns:340px 1fr;gap:0;background:var(--n1);border:1px solid var(--n3);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px -12px rgba(0,0,0,.12);flex:1;min-height:540px;animation:rise .35s both}
.rail{border-right:1px solid var(--n3);display:flex;flex-direction:column;min-height:0}
.rail-top{padding:12px;border-bottom:1px solid var(--n3);display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);border-radius:4px;padding:0 10px;background:var(--n0)}
.search input{flex:1;border:0;background:none;padding:7px 0;font:inherit;outline:none!important;box-shadow:none!important}
.search i{color:var(--n6)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{font-size:12px;font-weight:600;padding:4px 10px;border-radius:3px;color:var(--n7)}
.tab:hover{background:var(--n2)}.tab.on{background:var(--n10);color:var(--n0)}
.list{overflow:auto;flex:1}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--n3);transition:background .1s}
.item:hover{background:var(--n0)}
.item.sel{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12px;color:var(--n7)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:3px;background:var(--n2);color:var(--n8);border:1px solid var(--n3);white-space:nowrap}
.badge.ok{background:var(--s1-bg);color:var(--s1-text);border-color:transparent}
.badge.bad{background:var(--s2-bg);color:var(--s2-text);border-color:transparent}
.badge.warn{background:var(--s3-bg);color:var(--s3-text);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--n5);flex:none}
.dot.new{background:var(--m600)}
.rail-foot{padding:10px 12px;border-top:1px solid var(--n3);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--n7)}
.detail{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;animation:fade .25s both}
.d-head{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--n3)}
.d-head h2{font-size:16px;font-weight:700}
.d-head .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.d-body{padding:24px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 280px;align-items:start}
.d-body.one{grid-template-columns:minmax(0,1fr)}
.form{display:grid;gap:16px}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:600;color:var(--n8)}
.fld .help{font-size:12px;color:var(--n6)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--n4);border-radius:4px;background:var(--n1);width:100%}
.fld textarea{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{font-size:12px;color:var(--s2-text);font-weight:500}
.sw{display:flex;align-items:center;gap:10px;font-size:13px}
.sw button{width:34px;height:20px;border-radius:10px;background:var(--n4);position:relative;transition:background .15s;flex:none}
.sw button::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw button.on{background:var(--m600)}.sw button.on::after{transform:translateX(14px)}
.panel{border:1px solid var(--n3);border-radius:4px;background:var(--n0)}
.panel h4{font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--n3);color:var(--n8);display:flex;align-items:center;gap:6px}
.panel .pb{padding:12px;font-size:13px}
.pv{background:var(--n1);border:1px solid var(--n3);border-radius:4px;padding:14px}
.pv .y{font-size:12px;font-weight:700;color:var(--n7)}.pv .e{font-weight:600;margin-top:2px}.pv .s{font-size:12px;color:var(--n7)}
.msg{background:var(--n0);border:1px solid var(--n3);border-radius:4px;padding:14px;font-size:14px;line-height:1.7}
.tlm{display:grid;gap:12px;position:relative;padding-left:16px}
.tlm::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--n4)}
.tlm div{position:relative;font-size:13px}
.tlm div::before{content:"";position:absolute;left:-16px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--n1);border:1.5px solid var(--n5)}
.tlm small{display:block;color:var(--n6);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--n7);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--n4)}
.tbl td{padding:10px;border-bottom:1px solid var(--n3)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:700;font-size:15px;border-bottom:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc{border:1px solid var(--n3);border-radius:4px;padding:12px;background:var(--n1)}
.sc small{color:var(--n7);font-size:12px}.sc b{display:block;font-size:14px;margin:2px 0 6px}
.term{background:var(--n10);color:var(--n3);font-family:ui-monospace,Menlo,monospace;font-size:12px;border-radius:4px;padding:12px 14px;line-height:1.8}
.term i{color:var(--n6);font-style:normal}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}.chk input{accent-color:var(--m600);width:15px;height:15px}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--n3);background:var(--n0);font-size:12px;color:var(--n7)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100}
.cmdk-modal{width:560px;max-width:92vw;background:var(--n1);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;animation:rise .2s both}
.cmdk-input{width:100%;border:0;border-bottom:1px solid var(--n3);padding:14px 16px;font:inherit;font-size:15px;outline:none!important;box-shadow:none!important}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;cursor:pointer;width:100%;text-align:left}
.cmdk-item:hover,.cmdk-item.on{background:var(--n2)}
.cmdk-group-title{font-size:11px;font-weight:600;color:var(--n6);padding:10px 16px 4px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--n10);color:var(--n0);padding:10px 16px;border-radius:4px;font-size:13px;display:flex;gap:8px;align-items:center;animation:rise .25s both;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.spark{display:block}
.spark path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.2s .2s forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m600) 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.dot.new{animation:ping 1.8s infinite}
@media(max-width:1100px){.d-body{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;

const NAV=[
  {id:'home',label:'관리 홈',icon:'ph-house-line'},
  {id:'history',label:'연혁·기본정보 편집',icon:'ph-clock-counter-clockwise'},
  {id:'notice-admin',label:'공지사항 관리',icon:'ph-megaphone'},
  {id:'inbox',label:'문의 접수함',icon:'ph-tray'},
  {id:'hosting',label:'호스팅·유지비 현황',icon:'ph-hard-drives'}
];

function Toast({msg}){return msg?<div className="toast"><i className="ph ph-check-circle"/>{msg}</div>:null}
function Switch({on,onChange,label}){return <div className="sw"><button className={on?'on':''} onClick={()=>onChange(!on)} aria-pressed={on}/><span>{label}</span></div>}

/* ---------- 연혁·기본정보 ---------- */
const H0=[
  {id:1,year:'2026',title:'차세대 업무 플랫폼 공개 서비스 준비',desc:'고객 맞춤형 모듈 확장',show:true},
  {id:2,year:'2024',title:'본사 이전 및 연구개발 조직 확대',desc:'서울 샘플구 신사옥',show:true},
  {id:3,year:'2022',title:'주요 협력 프로젝트 다수 수행',desc:'파트너사 네트워크 구성',show:true},
  {id:4,year:'2020',title:'기업부설연구소 설립',desc:'핵심 기술 내재화',show:true},
  {id:5,year:'2018',title:'법인 설립',desc:'솔루션 개발 사업 시작',show:false}
];
function HistoryScreen({toast}){
  const [items,setItems]=useState(H0);
  const [sel,setSel]=useState(1);
  const [q,setQ]=useState('');
  const [prev,setPrev]=useState(true);
  const [loading,setLoading]=useState(false);
  const [basic,setBasic]=useState({name:'누리솔루션',tel:'02-000-0000',addr:'서울특별시 샘플구 데모로 100'});
  const cur=items.find(i=>i.id===sel);
  const upd=(k,v)=>setItems(a=>a.map(i=>i.id===sel?{...i,[k]:v}:i));
  const add=()=>{const id=Math.max(...items.map(i=>i.id))+1;setItems([{id,year:'',title:'',desc:'',show:false},...items]);setSel(id)};
  const invalid=cur&&(!/^\d{4}$/.test(cur.year)||!cur.title.trim());
  const save=()=>{setLoading(true);setTimeout(()=>{setLoading(false);toast('연혁 항목이 저장되었습니다')},700)};
  const list=items.filter(i=>(i.title+i.year).includes(q));
  return <div className="md">
    <div className="rail">
      <div className="rail-top">
        <div className="search"><i className="ph ph-magnifying-glass"/><input placeholder="연혁 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
      </div>
      <div className="list">
        <button className={'item '+(sel===0?'sel':'')} onClick={()=>setSel(0)}><i className="ph ph-buildings" style={{fontSize:18,color:'var(--n6)'}}/><div className="t"><b>회사 기본정보</b><span>상호·연락처·주소</span></div></button>
        {list.map(i=><button key={i.id} className={'item '+(sel===i.id?'sel':'')} onClick={()=>setSel(i.id)}>
          <span className="dot" style={{background:i.show?'var(--n7)':'var(--n4)'}}/>
          <div className="t"><b>{i.year||'연도 미입력'} · {i.title||'새 연혁'}</b><span>{i.desc||'설명 없음'}</span></div>
          {!i.show&&<span className="badge">비공개</span>}
        </button>)}
      </div>
      <div className="rail-foot"><span className="num">{items.length}개 항목</span><button className="btn" onClick={add}><i className="ph ph-plus"/>항목 추가</button></div>
    </div>
    <div className="detail" key={sel}>
      {sel===0?<>
        <div className="d-head"><h2>회사 기본정보</h2><div className="sp"><button className="btn primary" onClick={()=>toast('기본정보가 저장되었습니다')}>저장</button></div></div>
        <div className="d-body one"><div className="form">
          <div className="fld"><label>상호</label><input value={basic.name} onChange={e=>setBasic({...basic,name:e.target.value})}/><span className="help">푸터와 문의 메일 발신자명에 표시됩니다.</span></div>
          <div className="g2"><div className="fld"><label>대표 전화</label><input value={basic.tel} onChange={e=>setBasic({...basic,tel:e.target.value})}/></div>
          <div className="fld"><label>대표 이메일</label><input defaultValue="hello@sample-nuri.example"/></div></div>
          <div className="fld"><label>주소</label><input value={basic.addr} onChange={e=>setBasic({...basic,addr:e.target.value})}/></div>
        </div></div></>
      :cur&&<>

    <div className="cmdk-group-title">화면 이동</div>
    {items.map(n=><button key={n.id} className="cmdk-item" onClick={()=>{go(n.id);close()}}><i className={'ph '+n.icon}/>{n.label}<span className="kbd">Enter</span></button>)}
    <div style={{height:8}}/>
  </div></div>
}
function App(){
  const [view,setView]=useState('home');
  const [k,setK]=useState(false);
  const [toastMsg,setToast]=useState('');
  const toast=m=>{setToast(m);setTimeout(()=>setToast(''),2200)};
  useEffect(()=>{const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setK(true)}if(e.key==='Escape')setK(false)};addEventListener('keydown',h);return()=>removeEventListener('keydown',h)},[]);
  const cur=NAV.find(n=>n.id===view);
  const Screen={home:HomeScreen,history:HistoryScreen,'notice-admin':NoticeScreen,inbox:InboxScreen,hosting:HostingScreen}[view];
  const sub={home:'오늘 처리할 항목을 한눈에 확인합니다.',history:'공개 홈페이지의 연혁과 기본정보를 수정합니다.','notice-admin':'작성부터 공개 예약까지 한 목록에서 처리합니다.',inbox:'홈페이지 문의의 처리 상태와 메일 발송 결과를 확인합니다.',hosting:'호스팅 방식별 월 유지비와 점검 상태를 비교합니다.'}[view];
  return <div data-archetype="linear-sidebar-cmdk" style={{display:'flex',width:'100%',minHeight:'100vh'}}>
    <aside className="sidebar" data-sidebar>
      <div className="sidebar-brand"><span className="mark"><i className="ph ph-hexagon"/></span>누리솔루션<small>관리자</small></div>
      <button className="sidebar-cmdk-hint" onClick={()=>setK(true)}><i className="ph ph-magnifying-glass"/>빠른 이동<span className="kbd">⌘K</span></button>
      <div className="sidebar-section-title">홈페이지 관리</div>
      <nav className="sidebar-nav">{NAV.map(n=><a key={n.id} className={'sidebar-link '+(view===n.id?'active':'')} onClick={()=>setView(n.id)}><i className={'ph '+n.icon}/>{n.label}</a>)}</nav>
      <div className="sidebar-section-title">바로가기</div>
      <div className="sidebar-nav"><a className="sidebar-link" onClick={()=>toast('사용 매뉴얼 보기 화면을 열 예정입니다')}><i className="ph ph-book-open"/>관리자 매뉴얼</a><a className="sidebar-link" onClick={()=>toast('지원 요청 화면을 열 예정입니다')}><i className="ph ph-lifebuoy"/>하자보수 요청</a></div>
      <div className="sidebar-user"><span className="av">김</span><div><b>김담당</b><span>내부 운영 담당자</span></div></div>
    </aside>
    <main className="main">
      <header className="topbar">
        <nav className="breadcrumb"><a>관리자</a><span className="divider">/</span><a>홈페이지</a><span className="divider">/</span><b>{cur.label}</b></nav>
        <div className="topbar-actions"><button className="btn btn-cmdk" data-cmdk-trigger onClick={()=>setK(true)}>⌘ K</button><button className="btn" onClick={()=>toast('공개 사이트 미리보기를 새 창으로 열 예정입니다')}><i className="ph ph-arrow-square-out"/>사이트 보기</button></div>
      </header>
      <div className="content">
        <div className="page-h"><svg className="art" viewBox="0 0 340 140" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="var(--m200)"/><stop offset="1" stopColor="var(--m600)"/></linearGradient></defs><g className="wave"><circle cx="290" cy="40" r="90" fill="url(#g1)" opacity=".22"/><circle cx="250" cy="110" r="60" fill="none" stroke="var(--m300)" strokeWidth="1.5"/><rect x="190" y="30" width="90" height="60" rx="4" fill="var(--n1)" stroke="var(--n4)"/><rect x="200" y="42" width="40" height="6" rx="3" fill="var(--n4)"/><rect x="200" y="56" width="64" height="4" rx="2" fill="var(--n3)"/><rect x="200" y="66" width="52" height="4" rx="2" fill="var(--n3)"/></g></svg><div><div className="eb">Admin Console</div><h1>{cur.label}</h1><p>{sub}</p></div></div>
        <Screen toast={toast} go={setView}/>
      </div>
    </main>
    {k&&<CmdK go={setView} close={()=>setK(false)}/>}
    <Toast msg={toastMsg}/>
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
