<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도담펫 서초점 — 지사몰 모바일 쇼핑 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 77°, light) ── */
:root{
  --m50:#f9fcf0;
  --m100:#f3fae1;
  --m200:#e7f4c3;
  --m300:#d8ed9f;
  --m400:#c7e677;
  --m500:#b8df50;
  --m600:#a8d82a;
  --m700:#8ab122;
  --m800:#6c8a1b;
  --m900:#4c6113;
  --n0:#f3f3f1;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d7d5;
  --n5:#b9bab5;
  --n6:#969890;
  --n7:#777a71;
  --n8:#676b5f;
  --n9:#393a36;
  --n10:#000000;
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b;
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f;
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118;
}
/* ── 상태 레이어 P1 (gen-component-kit.js 산출) ── */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* design-ref Bento: Lime Spark #d2e823 / Lavender #e9c0e9 — plan primary #a8d82a 로 hue 분리(P2와 60° 규칙), 라벤더는 장식에 쓰지 않음 */
/* ── 리셋 ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:'Pretendard',-apple-system,sans-serif;color:var(--n10);background:var(--n2);-webkit-font-smoothing:antialiased}
body{background-color:var(--n2);background-image:radial-gradient(var(--n4) 1.5px,transparent 1.5px);background-size:24px 24px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select{font-family:inherit;font-size:14px;color:var(--n10)}
#root{width:100%;min-height:100vh;display:flex;justify-content:center}
i.ph{line-height:1;flex-shrink:0}

/* ── 글자 위계: 40 / 24 / 16 / 14 / 12 ── */
.t-display{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.t-title{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.t-sub{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.t-body{font-size:14px;font-weight:500;letter-spacing:-.01em;line-height:1.5;color:var(--n9)}
.t-cap{font-size:12px;font-weight:500;line-height:1.5;color:var(--n7)}

/* ── 모바일 고정폭 1벌 ── */
.phone{width:100%;max-width:440px;min-height:100vh;background:var(--n0);border-left:2px solid var(--n10);border-right:2px solid var(--n10);display:flex;flex-direction:column;position:relative}
.screen{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px;animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── 검색 헤더 (sticky) ── */
.search-header{position:sticky;top:0;z-index:20;background:var(--n0);border-bottom:2px solid var(--n10);padding:12px 16px 0}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border-radius:50%;border:2px solid var(--n10);background:var(--m600);display:flex;align-items:center;justify-content:center;font-size:16px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--n10);background:var(--n1);display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .15s}
.icon-btn:hover{transform:translateY(-2px)}
.icon-btn .count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--n10);color:var(--n1);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.search-bar{display:flex;align-items:center;gap:8px;height:48px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);padding:0 16px;margin-bottom:12px}
.search-bar input{flex:1;border:none;background:none;outline:none;height:100%;font-weight:500}
.search-bar input:focus{box-shadow:none}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 16px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;transition:transform .15s,background .15s}
.chip:hover{background:var(--n2)}
.chip.active{background:var(--n10);color:var(--n1)}

/* ── 스티커 카드 ── */
.card{background:var(--n1);border:2px solid var(--n10);border-radius:24px;padding:16px}
.card.flat{background:var(--n0)}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--n1);border:2px solid var(--n10);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero-blob{position:absolute;right:-24px;top:-24px;width:112px;height:112px;border-radius:50%;border:2px solid var(--n10);background:var(--m100)}
.hero-body{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:240px}
.btn{height:48px;padding:0 24px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--m600)}
.btn.primary:hover{background:var(--m700)}
.btn.sm{height:36px;padding:0 16px}
.btn.block{width:100%}
.sec-head{display:flex;align-items:baseline;justify-content:space-between}

/* ── 상품 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.listing-card{background:var(--n1);border:2px solid var(--n10);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;animation:cardIn .4s ease both;transition:transform .15s}
.listing-card:hover{transform:translateY(-4px)}
.card-image-wrap{position:relative;aspect-ratio:4/3;background:var(--n2);border-bottom:2px solid var(--n10);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:12px;gap:4px}
.tile-icon{font-size:20px;color:var(--n7)}
.tile-num{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tile-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{height:20px;padding:0 8px;border-radius:99px;border:1.5px solid var(--n10);background:var(--n1);font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.card-favorite{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:2px solid var(--n10);background:var(--n1);display:flex;align-items:center;justify-content:center;font-size:16px}
.card-favorite.on{background:var(--m600)}
.card-body{padding:12px;display:flex;flex-direction:column;gap:4px}
.card-title{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35;min-height:38px}
.card-price{font-size:16px;font-weight:800;letter-spacing:-.02em}
.price-unit{font-size:12px;color:var(--n7);font-weight:500;margin-left:4px}

/* ── 하단 탭 ── */
.tabbar{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--n1);border-top:2px solid var(--n10);margin-top:auto}
.tab{min-height:64px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;line-height:1.2;text-align:center;color:var(--n7);position:relative;word-break:keep-all}
.tab i{font-size:20px}
.tab.active{color:var(--n10);background:var(--m100)}
.tab.active::before{content:"";position:absolute;top:-2px;left:16px;right:16px;height:4px;border-radius:0 0 4px 4px;background:var(--m600);border:2px solid var(--n10);border-top:none}

/* ── 시트·토스트 ── */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-end}
.sheet{width:100%;max-width:440px;background:var(--n1);border:2px solid var(--n10);border-bottom:none;border-radius:32px 32px 0 0;padding:24px 16px 24px;display:flex;flex-direction:column;gap:16px;animation:sheetUp .3s ease both;max-height:88vh;overflow-y:auto}
.grab{width:48px;height:4px;border-radius:4px;background:var(--n4);align-self:center;margin-top:-8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:var(--n10);color:var(--n1);border-radius:99px;padding:12px 24px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;animation:sheetUp .25s ease both;white-space:nowrap}

/* ── 폼 ── */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:700;color:var(--n8)}
.input{height:48px;border-radius:16px;border:2px solid var(--n10);background:var(--n1);padding:0 16px;width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--n10);border-radius:99px;overflow:hidden;background:var(--n1)}
.seg button{height:44px;font-weight:700;font-size:14px;color:var(--n7)}
.seg button.on{background:var(--n10);color:var(--n1)}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border-radius:20px;border:2px solid var(--n10);background:var(--n1);text-align:left;width:100%;font-weight:700;font-size:14px;transition:transform .15s}
.opt:hover{transform:translateX(4px)}
.opt.on{background:var(--m100);box-shadow:inset 0 0 0 2px var(--n10)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--n10);background:var(--n1);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--n10)}
.progress{height:12px;border-radius:99px;border:2px solid var(--n10);background:var(--n1);overflow:hidden}
.progress>div{height:100%;background:var(--m600);border-right:2px solid var(--n10);transition:width .35s ease}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--n4)}
.row:last-child{border-bottom:none}
.badge{height:24px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;background:var(--n2);color:var(--n8);border:1.5px solid var(--n5)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text);border-color:var(--s1)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text);border-color:var(--s3)}
.badge.bad{background:var(--s2-bg);color:var(--s2-text);border-color:var(--s2)}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--s1);display:inline-block}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--s1);animation:ping 1.6s ease-out infinite}
.qty{display:inline-flex;align-items:center;border:2px solid var(--n10);border-radius:99px;overflow:hidden}
.qty button{width:40px;height:40px;font-size:16px}
.qty span{min-width:32px;text-align:center;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:8px;height:112px;padding-top:8px}
.bar{flex:1;border:2px solid var(--n10);border-radius:12px 12px 4px 4px;background:var(--n3);transform-origin:bottom;animation:barGrow .7s ease both;min-height:8px}
.bar.hi{background:var(--m600)}
.stat{display:flex;flex-direction:column;gap:4px}
.hr{height:2px;background:var(--n10);border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const won = n => n.toLocaleString('ko-KR');

const Ic = ({ n, s }) => <i className={'ph ph-' + n} style={s ? { fontSize: s } : null} />;

const PRODUCTS = [
  { id: 1, name: '그레인프리 연어 사료', spec: '2kg', cat: '사료', attr: '곡물 프리', price: 38000, icon: 'bowl-food', desc: '연어와 고구마를 주원료로 한 전연령 사료예요. 곡물 알레르기가 있는 아이에게 맞춰요.' },
  { id: 2, name: '오리 & 고구마 소형견 사료', spec: '1.5kg', cat: '사료', attr: '소형견', price: 29000, icon: 'bowl-food', desc: '작은 알갱이로 씹기 편하고 기호성이 높아요.' },
  { id: 3, name: '저알러지 닭가슴살 져키', spec: '300g', cat: '간식', attr: '무첨가', price: 12500, icon: 'cookie', desc: '국내 공장에서 저온 건조한 단일 단백질 간식이에요.' },
  { id: 4, name: '동결건조 북어 트릿', spec: '120g', cat: '간식', attr: '고단백', price: 9800, icon: 'fish', desc: '훈련 보상용으로 가볍게 나눠 주기 좋아요.' },
  { id: 5, name: '관절 케어 영양제', spec: '60정', cat: '영양제', attr: '관절', price: 32000, icon: 'pill', desc: '글루코사민과 콘드로이친을 담은 데일리 영양제예요.' },
  { id: 6, name: '프로바이오틱스 유산균', spec: '30포', cat: '영양제', attr: '장 건강', price: 27000, icon: 'pill', desc: '식사에 섞어 급여하는 분말형 유산균이에요.' },
  { id: 7, name: '퍼피 성장 사료', spec: '1kg', cat: '사료', attr: '퍼피', price: 21000, icon: 'bowl-food', desc: '성장기에 필요한 단백질과 칼슘 비율로 구성했어요.' },
  { id: 8, name: '시니어 고양이 사료', spec: '2kg', cat: '사료', attr: '고양이', price: 34000, icon: 'bowl-food', desc: '신장과 요로 건강을 고려한 저인 처방이에요.' },
  { id: 9, name: '덴탈 케어 껌', spec: '12입', cat: '간식', attr: '구강', price: 11000, icon: 'bone', desc: '치석 관리를 돕는 지그재그 결 구조예요.' },
  { id: 10, name: '오메가3 피쉬오일', spec: '90ml', cat: '영양제', attr: '피부·모질', price: 24000, icon: 'fish', desc: '피부와 모질 케어를 위한 액상 오일이에요.' },
];

function Product({ id, q, cat, favs, onFav, onOpen, delay }) {
  const p = PRODUCTS.find(x => x.id === id);
  const hit = (cat === '전체' || p.cat === cat || (cat === '구독 추천' && p.cat !== '간식')) && (!q || p.name.includes(q) || p.attr.includes(q));
  if (!hit) return null;
  return (
    <article className="listing-card" style={{ animationDelay: delay + 'ms' }} onClick={() => onOpen(p)}>
      <div className="card-image-wrap">
        <button className={'card-favorite' + (favs.includes(p.id) ? ' on' : '')} aria-label="찜하기" onClick={e => { e.stopPropagation(); onFav(p.id); }}><Ic n="heart" /></button>
        <Ic n={p.icon} s={24} />
        <strong className="tile-num num">{p.spec}</strong>
        <div className="tile-tags"><span className="tag">{p.cat}</span><span className="tag">{p.attr}</span></div>
      </div>
      <div className="card-body">
        <h3 className="card-title">{p.name}</h3>
        <div><strong className="card-price num">{won(p.price)}</strong><span className="price-unit">원</span></div>
      </div>
    </article>
  );
}

function Shop({ go, cart, addCart, toast }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('전체');
  const [favs, setFavs] = useState([3]);
  const [sel, setSel] = useState(null);
  const [qty, setQty] = useState(1);
  const [pwa, setPwa] = useState(false);
  const open = p => { setSel(p); setQty(1); };
  const toggleFav = id => { setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]); };
  const props = { q, cat, favs, onFav: toggleFav, onOpen: open };
  const chip = c => <button key={c} className={'chip' + (cat === c ? ' active' : '')} onClick={() => setCat(c)}>{c}</button>;
  return (
    <>
      <header className="search-header" data-search-header>
        <div className="header-row">
          <div className="brand"><span className="brand-mark"><Ic n="paw-print" /></span>도담펫 서초점</div>
          <button className="icon-btn" aria-label="장바구니" onClick={() => go('checkout')}><Ic n="shopping-bag" />{cart > 0 && <span className="count num">{cart}</span>}</button>
        </div>
        <div className="search-bar"><Ic n="magnifying-glass" s={20} /><input type="search" placeholder="사료, 간식, 영양제를 찾아보세요" value={q} onChange={e => setQ(e.target.value)} /></div>
        <div className="filter-chips" data-filter-chips>
          <button className={'chip' + (cat === '전체' ? ' active' : '')} onClick={() => setCat('전체')}>전체</button>
          <button className={'chip' + (cat === '사료' ? ' active' : '')} onClick={() => setCat('사료')}>사료</button>
          <button className={'chip' + (cat === '간식' ? ' active' : '')} onClick={() => setCat('간식')}>간식</button>
          <button className={'chip' + (cat === '영양제' ? ' active' : '')} onClick={() => setCat('영양제')}>영양제</button>
          <button className={'chip' + (cat === '구독 추천' ? ' active' : '')} onClick={() => setCat('구독 추천')}><Ic n="arrows-clockwise" /> 구독 추천</button>

function Balance({ go, setMode, toast }) {
  const [step, setStep] = useState(0);
  const [ans, setAns] = useState([]);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  if (done) {
    const allergy = ans[5] === 1 ? '그레인프리 연어 사료' : '오리 & 고구마 소형견 사료';

        <div className="card" style={{ background: 'var(--m100)', display: 'flex', flexDirection: 'column', gap: 16 }}>

          <div className="hr" />

          </div>
        </div>
        <div className="card flat">

          {TIERS.map(t => (
            <div className="row" key={t.k} style={{ fontWeight: t.k === tier.k ? 800 : 500 }}>
              <span className="t-body">{t.k}{t.k === tier.k && ' (우리 아이)'}</span><span className="t-body num">{won(t.price)}원 / 월</span>
            </div>
          ))}
        </div>
        <button className="btn primary block" onClick={() => { setMode('subscription'); go('checkout'); }}>정기구독 결제 등록하기</button>

    );
  }
  return (
    <section className="screen">
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="icon-btn" aria-label="이전 문항" disabled={step === 0} onClick={() => setStep(step - 1)}><Ic n="caret-left" /></button>
        <div style={{ flex: 1 }} className="progress"><div style={{ width: ((step + 1) / QUIZ.length * 100) + '%' }} /></div>
        <span className="t-cap num" style={{ minWidth: 32, textAlign: 'right' }}>{step + 1}/8</span>
      </div>
      <div style={{ padding: '8px 0' }}><span className="t-cap">문항 {step + 1}</span><h2 className="t-title" style={{ marginTop: 4 }}>{cur.q}</h2></div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }} key={step}>
        {cur.o.map((o, i) => (
          <button key={o} className={'opt' + (ans[step] === i ? ' on' : '')} onClick={() => { const a = [...ans]; a[step] = i; setAns(a); }}><span className="radio" />{o}</button>
        ))}

      <p className="t-cap">응답은 저장되지 않고, 추천 결과 계산에만 쓰여요.</p>
      <button className="btn primary block" style={{ marginTop: 'auto' }} disabled={ans[step] === undefined} data-loading={busy ? 'true' : 'false'} onClick={next}>{step === QUIZ.length - 1 ? '결과 보기' : '다음 문항으로'}</button>
    </section>
  );
}

            {sheet === 'pause' && <>
              <h3 className="t-title">{state === 'pause' ? '구독을 다시 시작할까요?' : '구독을 잠시 멈출까요?'}</h3>
              <p className="t-body">언제든 다시 재개할 수 있고, 멈춘 동안은 결제되지 않아요.</p>
              <button className="btn primary block" onClick={() => { setState(state === 'pause' ? 'active' : 'pause'); setSheet(null); toast('구독 상태를 바꿨어요'); }}>{state === 'pause' ? '구독 재개하기' : '일시정지하기'}</button>
            </>}
            {sheet === 'cancel' && <>
              <h3 className="t-title">정말 해지하시겠어요?</h3>
              <p className="t-body">이번 달 배송분까지 받고 다음 결제부터 멈춰요.</p>
              <button className="btn primary block" onClick={() => { setState('cancel'); setSheet(null); toast('해지를 예약했어요'); }}>해지 예약하기</button>
            </>}
            <button className="btn block" onClick={() => setSheet(null)}>닫기</button>
          </div>
        </div>
      )}
    </section>
  );
}

function Owner({ toast }) {
  const [sheet, setSheet] = useState(false);
  const [amt, setAmt] = useState('300000');
  const [issued, setIssued] = useState(false);
  const [busy, setBusy] = useState(false);
  const bad = Number(amt) < 300000;
  const issue = () => { setBusy(true); setTimeout(() => { setBusy(false); setIssued(true); }, 1100); };
  const days = [['월', 42], ['화', 56], ['수', 38], ['목', 71], ['금', 64], ['토', 88], ['일', 52]];
  return (
    <section className="screen">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div><span className="t-cap">점주 전용 · 도담펫 서초점</span><h2 className="t-title" style={{ marginTop: 4 }}>점주 대시보드</h2></div>
        <span className="badge ok"><span className="dot" /> 영업 중</span>
      </div>
      <div className="card" style={{ background: 'var(--n10)', color: 'var(--n1)', display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div className="sec-head"><span className="t-cap" style={{ color: 'var(--n4)' }}>예치금 잔액</span><span className="badge warn">잔액 임계 근접</span></div>
        <strong className="t-display num">1,284,500<span className="t-sub">원</span></strong>
        <button className="btn primary block" onClick={() => { setSheet(true); setIssued(false); }}>예치금 충전하기</button>
      </div>
      <div className="card">
        <div className="sec-head"><h3 className="t-sub">이번 주 판매 현황</h3><span className="t-cap">주문 건수</span></div>
        <div className="bars">
          {days.map(([d, v], i) => <div key={d} className={'bar' + (i === 5 ? ' hi' : '')} style={{ height: v + '%', animationDelay: i * 70 + 'ms' }} title={d + ' ' + v + '건'} />)}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>{days.map(([d]) => <span key={d} className="t-cap" style={{ flex: 1, textAlign: 'center' }}>{d}</span>)}</div>
      </div>
      <div className="card flat">
        <h3 className="t-sub">최근 예치금 차감</h3>
        <div className="row"><div><strong className="t-body num">PM-0482</strong><p className="t-cap">공급가 38,400 + 택배비 3,000</p></div><strong className="t-body num">- 41,400원</strong></div>
        <div className="row"><div><strong className="t-body num">PM-0481</strong><p className="t-cap">공급가 52,000 + 택배비 3,000</p></div><strong className="t-body num">- 55,000원</strong></div>
        <div className="row"><div><strong className="t-body num">PM-0479</strong><p className="t-cap">공급가 24,600 + 택배비 3,000</p></div><strong className="t-body num">- 27,600원</strong></div>
        <div className="row"><div><strong className="t-body num">충전</strong><p className="t-cap">가상계좌 입금 확인</p></div><strong className="t-body num">+ 500,000원</strong></div>
      </div>
      <div className="card flat">
        <h3 className="t-sub">오늘 주문</h3>
        <div className="row"><span className="t-body">김서연 · 연어 사료 외 1건</span><span className="badge">결제 완료</span></div>
        <div className="row"><span className="t-body">이도윤 · 오메가3 피쉬오일</span><span className="badge ok">배송 중</span></div>
        <div className="row"><span className="t-body">박지후 · 관절 케어 영양제</span><span className="badge warn">환불 요청</span></div>
      </div>
      {sheet && (
        <div className="overlay" onClick={() => setSheet(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <span className="grab" />
            <h3 className="t-title">예치금 충전</h3>
            {!issued ? <>
              <div className="field"><label>충전 금액 · 최소 300,000원</label><input className="input num" value={amt} aria-invalid={bad ? 'true' : 'false'} onChange={e => setAmt(e.target.value.replace(/[^0-9]/g, ''))} />{bad && <span className="t-cap" style={{ color: 'var(--s2-text)' }}>충전은 30만 원부터 가능해요</span>}</div>
              <p className="t-body">점주별 고정 가상계좌로 입금하면 충전 내역에 자동 반영돼요.</p>
              <button className="btn primary block" disabled={bad} data-loading={busy ? 'true' : 'false'} onClick={issue}>가상계좌 확인하기</button>
            </> : <>
              <div className="card flat"><div className="row"><span className="t-body">입금 계좌</span><strong className="t-body num">우리 1002-***-482910</strong></div><div className="row"><span className="t-body">예금주</span><strong className="t-body">도담펫 서초점</strong></div><div className="row"><span className="t-body">입금 금액</span><strong className="t-body num">{won(Number(amt))}원</strong></div></div>
              <button className="btn primary block" onClick={() => { setSheet(false); toast('입금이 확인되면 잔액에 반영돼요'); }}>확인했어요</button>
            </>}
            <button className="btn block" onClick={() => setSheet(false)}>닫기</button>
          </div>
        </div>
      )}
    </section>
  );
}

function App() {
  const [view, setView] = useState('main');
  const [cart, setCart] = useState(2);
  const [mode, setMode] = useState('order');
  const [msg, setMsg] = useState('');
  const toast = t => { setMsg(t); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(''), 2200); };
  const go = v => { setView(v); window.scrollTo(0, 0); };
  const tab = (id, icon, label) => <button className={'tab' + (view === id ? ' active' : '')} onClick={() => { if (id === 'checkout') setMode('order'); go(id); }}><i className={'ph ph-' + icon} />{label}</button>;
  return (
    <div className="phone" data-archetype="airbnb-search-grid">
      {view === 'main' && <Shop go={go} cart={cart} addCart={q => setCart(c => c + q)} toast={toast} />}
      {view === 'balancekit' && <Balance go={go} setMode={setMode} toast={toast} />}
      {view === 'checkout' && <Checkout go={go} mode={mode} cart={cart} toast={toast} />}
      {view === 'subscription' && <Sub toast={toast} />}
      {view === 'owner' && <Owner toast={toast} />}
      <nav className="tabbar">
        {tab('main', 'house', '지사몰 상품 탐색')}
        {tab('balancekit', 'clipboard-text', '밸런스키트 문진')}
        {tab('checkout', 'credit-card', '간편 주문 결제')}
        {tab('subscription', 'arrows-clockwise', '구독 관리')}
        {tab('owner', 'chart-line-up', '점주 대시보드')}
      </nav>
      {msg && <div className="toast"><Ic n="check-circle" />{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
