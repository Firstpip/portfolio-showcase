<style>
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#eff4fc;
  --m100:#dfe9f8;
  --m200:#c0d4f1;
  --m300:#99b9e9;
  --m400:#6e9cdf;
  --m500:#4680d6;
  --m600:#1d64cd;
  --m700:#1852a8;
  --m800:#134083;
  --m900:#0d2d5c;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#f5f5f5;
  --n2:#eff0f0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b7ba;
  --n6:#8b8b8b;
  --n7:#71747a;
  --n8:#53565a;
  --n9:#36383a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

:root{--w:#ffffff;--r:18px;--pill:100px}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{text-decoration:none;color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select{font-family:inherit;font-size:14px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:1em;height:1em;stroke-width:1.7}
.num{font-variant-numeric:tabular-nums}

@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dotBlink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes cardRise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m500) 40%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.app{display:flex;width:100%;height:100vh}
/* 워크스페이스 strip */
.workspace-strip{width:64px;flex-shrink:0;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px}
.ws-logo{animation:ringPulse 2.6s ease-out infinite;width:40px;height:40px;border-radius:var(--r);background:var(--m600);display:flex;align-items:center;justify-content:center;color:var(--w);font-size:20px;margin-bottom:16px}
.ws-item{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--n7);font-size:20px;transition:background .15s,color .15s}
.ws-item:hover{background:var(--n2);color:var(--n10)}
.ws-item.active{background:var(--m50);color:var(--m700)}
.ws-spacer{flex:1}
/* 대화 리스트 */
.channel-list{width:272px;flex-shrink:0;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;min-height:0}
.channel-header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.ws-name{font-size:16px;font-weight:700;color:var(--n10);letter-spacing:-.02em}
.new-conv{width:32px;height:32px;border-radius:var(--pill);border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--n8)}
.new-conv:hover{background:var(--n2)}
.channel-search{margin:8px 16px 12px;position:relative}
.channel-search input{width:100%;height:36px;border-radius:var(--pill);border:1px solid var(--n4);background:var(--n0);padding:0 14px 0 36px;color:var(--n9)}
.channel-search .ic{position:absolute;left:12px;top:10px;color:var(--n6);font-size:16px}
.channel-scroll{flex:1;overflow-y:auto;padding:0 8px 16px}
.section-title{font-size:12px;color:var(--n7);font-weight:600;padding:12px 8px 8px;display:flex;align-items:center;gap:4px}
.channel-item{width:100%;display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;color:var(--n8);font-weight:500;transition:background .15s}
.channel-item:hover{background:var(--n2)}
.channel-item.active{background:var(--m50);color:var(--m700);font-weight:700;box-shadow:inset 3px 0 0 var(--m600)}
.channel-item .ic{font-size:16px;color:var(--n6)}
.channel-item.active .ic{color:var(--m600)}
.conv-hist{width:100%;display:block;padding:8px;border-radius:12px;transition:background .15s}
.conv-hist:hover{background:var(--n2)}
.conv-hist b{display:block;font-weight:600;color:var(--n9);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-hist span{font-size:12px;color:var(--n7)}
/* 메인 */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0);position:relative}
.conv-header{height:64px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3);background:linear-gradient(180deg,var(--m100),var(--n0))}
.conv-title{font-size:16px;font-weight:700;color:var(--n10);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.conv-sub{font-size:12px;color:var(--n7)}
.conv-actions{display:flex;gap:8px}
.conv-action{height:36px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--n4);background:var(--w);display:flex;align-items:center;gap:6px;font-weight:500;color:var(--n8)}
.conv-action:hover{background:var(--n2)}
.conv-body{flex:1;overflow-y:auto;padding:24px 24px 16px}
.stage{max-width:760px;margin:0 auto}
.msg-group{display:flex;gap:12px;margin-bottom:24px;animation:msgIn .35s ease both}
.msg-avatar{width:36px;height:36px;border-radius:50%;background:var(--n2);color:var(--n7);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:14px}
.msg-avatar.bot{background:var(--m600);color:var(--w);font-size:18px}
.msg-name{font-weight:700;color:var(--n10);margin-right:8px}
.msg-time{font-size:12px;color:var(--n6)}
.msg-content{margin-top:4px;color:var(--n9);font-size:16px;line-height:1.6;letter-spacing:-.01em}
.msg-content p+p{margin-top:8px}
.msg-content .muted{color:var(--n7);font-size:14px}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--n6);animation:dotBlink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
/* 칩 */
.chip-tray{background:var(--w);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:rgba(36,36,40,.08) 0 1px 2px,rgba(16,55,132,.05) 0 12px 28px}
.chip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.chip-row+.chip-row{border-top:1px dashed var(--n4)}
.chip-label{width:48px;font-size:12px;font-weight:700;color:var(--n8)}
.chip{height:32px;padding:0 6px 0 12px;border-radius:var(--pill);border:1px solid var(--n4);background:var(--w);display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--n9)}
.chip .x{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--n6);font-size:12px}
.chip .x:hover{background:var(--n3);color:var(--n10)}
.chip.must{background:var(--w);border-color:var(--m400);color:var(--n10);font-weight:600}
.chip.not{border-style:dashed;color:var(--n7);text-decoration:line-through}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{height:36px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--n10);background:var(--w);font-weight:500;color:var(--n10);transition:background .15s}
.quick button:hover{background:var(--n2)}
.quick button.on{background:var(--n10);color:var(--n0)}
/* 입력 */
.conv-input{position:sticky;bottom:0;padding:12px 24px 20px;background:linear-gradient(180deg,transparent,var(--n0) 30%)}
.input-box{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--w);border:1px solid var(--n4);border-radius:var(--pill);padding:6px 6px 6px 20px;box-shadow:rgba(36,36,40,.1) 0 1px 2px,rgba(36,36,40,.05) 0 6px 4px}
.msg-input{flex:1;border:0;outline:0;background:none;height:40px;font-size:16px;color:var(--n10)}
.send{height:40px;padding:0 20px;border-radius:var(--pill);background:var(--m600);color:var(--w);font-weight:600;display:flex;align-items:center;gap:6px;transition:background .15s,transform .1s}
.send:hover{background:var(--m700)}
.send:active{transform:scale(.98)}
.notice{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--n7);text-align:center}
/* 카드 */
.dcard{background:var(--w);border-radius:var(--r);padding:20px;margin-top:12px;display:flex;gap:16px;box-shadow:rgba(36,36,40,.08) 0 1px 2px,rgba(16,55,132,.04) 0 14px 32px;animation:cardRise .45s ease both;width:100%;transition:transform .2s}
.dcard:hover{transform:translateY(-2px)}
.dcard.sel{box-shadow:0 0 0 2px var(--m600),rgba(16,55,132,.06) 0 14px 32px}
.dphoto{width:56px;height:56px;border-radius:50%;background:var(--n2);color:var(--n5);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.dbody{flex:1;min-width:0}
.dname{font-size:16px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rank{font-size:12px;font-weight:700;color:var(--n8);background:var(--n2);border-radius:var(--pill);padding:2px 10px}
.dmeta{color:var(--n7);font-size:14px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:3px 10px;border-radius:var(--pill);background:var(--n2);color:var(--n8);font-weight:500}
.why{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--n0);font-size:14px;color:var(--n8)}
.why b{color:var(--n10)}
.dfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px;flex-wrap:wrap}
.rec{font-size:12px;color:var(--n7);display:flex;align-items:center;gap:4px}
.btn-o{height:34px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--n10);background:var(--w);font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--n10)}
.btn-o:hover{background:var(--n2)}
.btn-o:active{transform:scale(.98)}
.score{display:flex;align-items:baseline;gap:4px}
.score strong{font-size:20px;color:var(--n10);font-weight:700}
.badge-none{font-size:12px;background:var(--n2);color:var(--n7);border-radius:var(--pill);padding:3px 10px;display:inline-flex;gap:4px;align-items:center}
/* info */
.info-panel{width:336px;flex-shrink:0;background:var(--n1);border-left:1px solid var(--n3);overflow-y:auto;animation:slideIn .3s ease both}
.info-header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n3)}
.info-header h3{font-size:16px;font-weight:700;color:var(--n10)}
.info-section{padding:16px 20px;border-bottom:1px solid var(--n3)}
.info-label{font-size:12px;font-weight:700;color:var(--n7);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.kv span:first-child{color:var(--n7)}
.kv span:last-child{color:var(--n10);font-weight:500;text-align:right}
.code{background:var(--n10);color:var(--n2);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap}
.ver{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:14px}
.ver .ic{margin-top:3px;color:var(--s1);font-size:16px}
.ver.warn .ic{color:var(--s3)}
.ver small{display:block;color:var(--n7);font-size:12px}
/* 비교표 */
.cmp{width:100%;border-collapse:collapse;background:var(--w);border-radius:var(--r);overflow:hidden;margin-top:12px;font-size:14px;box-shadow:rgba(36,36,40,.08) 0 1px 2px;animation:cardRise .4s ease both}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--n3);text-align:left;vertical-align:top}
.cmp th{font-size:12px;color:var(--n7);font-weight:600;width:96px;background:var(--n0)}
.cmp thead th{color:var(--n10);font-size:14px;background:var(--w)}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
/* 지역 */
.region-bar{background:var(--w);border-radius:var(--r);padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;box-shadow:rgba(36,36,40,.08) 0 1px 2px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--n7);margin-bottom:6px}
.field select{width:100%;height:40px;border-radius:12px;border:1px solid var(--n4);background:var(--w);padding:0 12px;color:var(--n10)}
.switch{width:44px;height:26px;border-radius:var(--pill);background:var(--n4);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--w);transition:transform .2s}
.switch.on{background:var(--m600)}
.switch.on::after{transform:translateX(18px)}
.consent{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--w);margin-top:12px;box-shadow:rgba(36,36,40,.08) 0 1px 2px}
.consent b{display:block;color:var(--n10)}
.consent small{color:var(--n7);font-size:12px}
.consent .ic{font-size:20px;color:var(--n7)}
.range{width:100%;accent-color:var(--m600)}
.radar{position:relative;width:100%;aspect-ratio:1.5;background:var(--w);border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:rgba(36,36,40,.08) 0 1px 2px}
.radar svg{width:100%;height:100%;display:block}
.radar .sweepline{transform-origin:50% 50%;animation:sweep 6s linear infinite}
.dist{font-size:12px;color:var(--n8);font-weight:600}
/* 모달 */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 40%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;animation:msgIn .2s ease both}
.modal{width:480px;max-width:92vw;background:var(--w);border-radius:24px;padding:32px;box-shadow:rgba(16,55,132,.12) 0 24px 64px}
.modal h4{font-size:20px;font-weight:700;color:var(--n10);letter-spacing:-.03em;margin-bottom:8px}
.modal p{color:var(--n8);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 20px;border-radius:var(--pill);font-weight:500;z-index:60;animation:msgIn .25s ease both}
@media (max-width:1180px){.info-panel{display:none}}
</style>

    </>}
    {view === 'match' && <>
      <div className="info-section"><div className="info-label">답변 문장 ↔ DB 레코드</div>
        {DOCTORS.slice(0, 3).map(d => <div key={d.id} className="ver"><Icon n="shield-check" /><div>{d.name} · {d.hos}<small>{d.id} · 평가 {d.score ? '있음' : '없음 → 세부진료분야만 표시'}</small></div></div>)}</div>
      <div className="info-section"><div className="info-label">차단 규칙</div>
        <div className="ver warn"><Icon n="database" /><div>DB에 없는 의사·병원·평가는 생성하지 않아요<small>생성 후 값 대조에서 불일치 시 문장 삭제</small></div></div></div>
    </>}
    {view === 'followup' && <>
      <div className="info-section"><div className="info-label">누적 조건</div>
        <div className="kv"><span>증상</span><span>허리 통증</span></div><div className="kv"><span>지역</span><span>강남구 인근</span></div><div className="kv"><span>선호</span><span>평가순 · 비수술</span></div><div className="kv"><span>제외</span><span>수술</span></div></div>
      <div className="info-section"><div className="info-label">참조 해석</div>
        <div className="kv"><span>“첫 번째 병원”</span><span>D-20418</span></div><div className="kv"><span>“두 번째 분”</span><span>D-31877</span></div><div className="kv"><span>더 보기</span><span>중복 3건 제외</span></div></div>
    </>}
    {view === 'region' && <>
      <div className="info-section"><div className="info-label">위치정보 처리</div>
        <div className="ver"><Icon n="check" /><div>동의 전에는 좌표를 받지 않아요</div></div>
        <div className="ver"><Icon n="check" /><div>동의해도 응답 생성 후 저장하지 않아요</div></div>
        <div className="ver"><Icon n="check" /><div>조건 완화·범위 확대는 동의 후에만</div></div></div>
      <div className="info-section"><div className="info-label">지역 정규화</div>
        <div className="kv"><span>입력</span><span>강남 근처</span></div><div className="kv"><span>시·도</span><span>서울특별시</span></div><div className="kv"><span>시·군·구</span><span>강남구 + 인접 3개</span></div></div>
    </>}
  </aside>
);

const NAV = ['조건 칩 기반 질문 이해', '근거 카드 의사·병원 매칭', '후속 질문·비교·더 보기', '동의 기반 지역·거리 탐색'];
const KEYS = ['main', 'match', 'followup', 'region'];
const ICONS = ['list-filter', 'hospital', 'git-compare', 'map-pin'];

const App = () => {
  const [view, setView] = useState('main');
  const [info, setInfo] = useState(true);
  const [detail, setDetail] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const toast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(''), 2200); };
  const idx = KEYS.indexOf(view);
  return (
    <div className="app" style={{ width: '100%' }}>
      <nav className="workspace-strip" data-workspace-strip>
        <div className="ws-logo"><Icon n="stethoscope" /></div>
        <button className="ws-item active" title="대화" onClick={() => setView('main')}><Icon n="message-circle" /></button>
        <button className="ws-item" title="저장한 의사" onClick={() => toast('저장한 의사 목록은 다음 단계에서 연결할 예정이에요.')}><Icon n="bookmark" /></button>
        <button className="ws-item" title="최근 기록" onClick={() => toast('대화 기록은 가명 처리되어 보관돼요.')}><Icon n="clock" /></button>
        <div className="ws-spacer" />
        <button className="ws-item" title="설정" onClick={() => toast('알림·위치 동의 설정을 이곳에 둘 예정이에요.')}><Icon n="settings" /></button>
      </nav>
      <aside className="channel-list" data-channel-list>
        <header className="channel-header"><h2 className="ws-name">의사 찾기</h2><button className="new-conv" onClick={() => { setView('main'); toast('새 대화를 시작했어요.'); }} aria-label="새 대화"><Icon n="plus" /></button></header>
        <div className="channel-search"><Icon n="search" /><input placeholder="지난 대화 검색" onChange={() => { }} /></div>
        <div className="channel-scroll">
          <div className="section-title">대화 시나리오</div>
          {NAV.map((t, i) => <button key={t} className={'channel-item' + (view === KEYS[i] ? ' active' : '')} onClick={() => setView(KEYS[i])}><Icon n={ICONS[i]} />{t}</button>)}
          <div className="section-title" style={{ marginTop: 8 }}>지난 대화</div>
          {[['허리 통증 · 강남 · 비수술', '오늘'], ['무릎 시술 후 재활 병원', '어제'], ['아이 비염 · 야간 진료', '10월 11일'], ['눈 떨림 진료과 문의', '10월 8일'], ['당뇨 전문 · 분당 인근', '10월 3일']].map(([a, b]) =>
            <button key={a} className="conv-hist" onClick={() => toast('지난 대화는 가명 처리된 요약으로 불러올 예정이에요.')}><b>{a}</b><span>{b}</span></button>)}
        </div>
      </aside>
      <main className="conv-main">
        <header className="conv-header">
          <div><div className="conv-title"><Icon n="message-circle" /> {NAV[idx]}</div><div className="conv-sub">허리 통증 · 강남구 · 비수술 · 평가순</div></div>
          <div className="conv-actions">
            <button className="conv-action" onClick={() => toast('현재 대화 조건을 요약해 복사할 수 있어요.')}><Icon n="rotate-ccw" />조건 초기화</button>
            <button className="conv-action toggle-info info-toggle" onClick={() => setInfo(!info)}><Icon n="info" />{info ? '정보 닫기' : '정보 열기'}</button>
          </div>
        </header>
        {view === 'main' && <MainView toast={toast} />}
        {view === 'match' && <MatchView openDetail={setDetail} toast={toast} />}
        {view === 'followup' && <FollowView openDetail={setDetail} toast={toast} />}
        {view === 'region' && <RegionView openDetail={setDetail} toast={toast} />}
      </main>
      {info && <Info view={view} onClose={() => setInfo(false)} />}
      {detail && (
        <div className="overlay" onClick={() => setDetail(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h4>{detail.hos}</h4>
            <p>{detail.name} · {detail.dept}<br />{detail.area}</p>
            <div className="kv"><span>레코드 ID</span><span className="num">{detail.id}</span></div>
            <div className="kv"><span>세부진료분야</span><span>{detail.sub.join(', ')}</span></div>
            <div className="kv"><span>환자경험 평가</span><span className="num">{detail.score ? detail.score + ' (' + detail.reviews + '건)' : '평가 정보 없음'}</span></div>
            <div className="modal-actions">
              <button className="btn-o" onClick={() => setDetail(null)}>닫기</button>
              <button className="send" onClick={() => { setDetail(null); toast('서비스 상세 페이지로 연결할 링크예요(데모).'); }}><Icon n="link-2" />서비스에서 보기</button>
            </div>
          </div>
        </div>
      )}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
