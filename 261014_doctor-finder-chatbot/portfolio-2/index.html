const Lexicon = ({ toast }) => {
  const [terms, setTerms] = useState(TERMS);
  const [sel, setSel] = useState(0);
  const [q, setQ] = useState('');
  const [add, setAdd] = useState('');
  const [busy, setBusy] = useState(false);
  const [queue, setQueue] = useState([]);
  const t = terms[sel];
  const list = terms.map((x, i) => [x, i]).filter(([x]) => (x.k + x.syn.join('')).includes(q));
  const remove = s => setTerms(ts => ts.map((x, i) => i === sel ? { ...x, syn: x.syn.filter(y => y !== s) } : x));
  const addSyn = () => { if (!add.trim()) return; setTerms(ts => ts.map((x, i) => i === sel ? { ...x, syn: [...x.syn, add.trim()] } : x)); setAdd(''); toast('동의어를 추가했어요. 다음 색인 갱신에 반영돼요.'); };
  const draft = () => { setBusy(true); setTimeout(() => { setBusy(false); setQueue([{ w: '허리 삐끗', to: '요추 염좌' }, { w: '손목 터널', to: '수근관 증후군' }]); toast('초안 2건을 만들었어요. 사람이 확인한 뒤 반영해요.'); }, 1400); };
  const decide = (w, ok) => { setQueue(qs => qs.filter(x => x.w !== w)); toast(ok ? '"' + w + '"을 사전에 반영했어요.' : '"' + w + '"은 반영하지 않았어요.'); };
  return (
    <div className="bento">
      <section className="tile span4">
        <h3>표준질환 <span className="num">{terms.length}개 표시 · 전체 수백 개</span></h3>
        <div className="search"><i className="ph ph-magnifying-glass" /><input placeholder="질환·동의어 검색" value={q} onChange={e => setQ(e.target.value)} /></div>
        {list.map(([x, i]) => <button key={x.k} className={'term' + (i === sel ? ' on' : '')} onClick={() => setSel(i)}><div><b>{x.k}</b><br /><span>{x.dept.join(' · ')}</span></div><span className="num">{x.n}명</span></button>)}
      </section>
      <section className="tile span5">
        <h3>{t.k} <span>동의어 {t.syn.length}개</span></h3>
        <div className="syn">{t.syn.map(s => <span key={s} className="s">{s}<button onClick={() => remove(s)} aria-label={s + ' 삭제'}><P n="x" b /></button></span>)}</div>
        <div className="add"><input placeholder="동의어 추가" value={add} onChange={e => setAdd(e.target.value)} onKeyDown={e => e.key === 'Enter' && addSyn()} /><button className="ghost" onClick={addSyn}><P n="plus" /> 추가하기</button></div>
        <div style={{ marginTop: 16 }}>
          <div className="kvr"><span>연관 진료과</span><span>{t.dept.join(', ')}</span></div>
          <div className="kvr"><span>세부진료분야 매핑</span><span>{t.sub}</span></div>
          <div className="kvr"><span>연결된 의사</span><span className="num">{t.n}명</span></div>
        </div>
      </section>
      <section className="tile span3">
        <h3>검수 대기 초안 <span className="num">{queue.length}건</span></h3>
        <button className="cta" data-loading={busy ? 'true' : 'false'} disabled={busy} onClick={draft} style={{ width: '100%', justifyContent: 'center' }}>초안 만들기</button>
        <div className="cap">클라이언트 DB의 세부진료분야에서 LLM이 초안을 만들어요.</div>
        {queue.map(x => <div key={x.w} className="queue"><div><b>{x.w}</b><br /><span className="mono">→ {x.to}</span></div>
          <div style={{ display: 'flex', gap: 4 }}><button className="ghost sm" onClick={() => decide(x.w, true)}>반영</button><button className="ghost sm" onClick={() => decide(x.w, false)}>제외</button></div></div>)}
        {queue.length === 0 && !busy && <div className="cap" style={{ marginTop: 12 }}>대기 중인 초안이 없어요.</div>}
      </section>
    </div>
  );
};

              <h4>{drawer.t}</h4><div className="cap">{drawer.cat} · {drawer.sev} 결함</div>
              <div className="dsec"><div className="lab">기대 결과</div><div className="box">{drawer.exp}</div></div>
              <div className="dsec"><div className="lab">실제 결과</div><div className="box bad">{drawer.act}</div></div>
              <div className="dsec" style={{ display: 'flex', gap: 8 }}>
                <button className="cta" onClick={() => { setDrawer(null); toast('보완 작업으로 등록했어요.'); }}>보완 등록하기</button>
                <button className="ghost" onClick={() => { setDrawer(null); toast('재검수 대기 목록에 넣었어요.'); }}>재검수에 넣기</button>
              </div>
            </> : <>
              <h4>{drawer.q}</h4><div className="cap">{drawer.time} · {drawer.res === 'pass' ? '통과' : '차단 후 재생성'}</div>
              <div className="dsec"><div className="lab">LLM 초안</div><div className={'box' + (drawer.res === 'block' ? ' bad' : '')}>{drawer.res === 'block' ? <del>{drawer.draft}</del> : drawer.draft}</div></div>
              <div className="dsec"><div className="lab">사용자에게 나간 문장</div><div className="box">{drawer.fin}</div></div>
              <div className="dsec"><div className="lab">DB 대조 항목</div>
                {drawer.ok.map(o => <div key={o} className="kvr"><span><P n="check" b /> {o}</span><span>일치</span></div>)}
                {drawer.bad.map(o => <div key={o} className="kvr"><span><P n="warning" b /> {o}</span><span style={{ color: 'var(--s2-text)' }}>불일치</span></div>)}</div>
            </>}
          </aside>
        </div>
      )}
      {toastMsg && <div className="toast"><P n="check-circle" /> {toastMsg}</div>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
