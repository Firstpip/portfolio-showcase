<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드론 외벽 균열 점검 워크스페이스 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 154°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#eef9f4;
  --m100:#ddf2e9;
  --m200:#bbe6d3;
  --m300:#92d7b9;
  --m400:#64c59b;
  --m500:#39b57f;
  --m600:#0da563;
  --m700:#0b8751;
  --m800:#086a3f;
  --m900:#064a2d;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#f6f8fa;
  --n2:#eff0f0;
  --n3:#e5e6e6;
  --n4:#d5d7d6;
  --n5:#a4abb8;
  --n6:#909894;
  --n7:#717a76;
  --n8:#535a57;
  --n9:#363a38;
  --n10:#1e201f;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s1(성공/진행/정상/상승) — 메인 hue 154°와 9° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--n0);color:var(--n9);font-size:14px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;overflow:hidden}
a{text-decoration:none;color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:13px;color:var(--n9)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--n4)}::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m500) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
@keyframes boxPing{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes scanLine{0%{top:0}100%{top:100%}}

#root{height:100vh}
.app{display:flex;width:100%;height:100vh}

/* 워크스페이스 strip 64px */
.workspace-strip{width:64px;flex:none;background:var(--n10);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px}
.ws-brand{width:36px;height:36px;background:var(--m600);color:var(--n0);display:grid;place-items:center;font-size:20px;margin-bottom:6px}
.ws-item{width:38px;height:38px;border:1px solid var(--n8);color:var(--n4);display:grid;place-items:center;font-weight:700;font-size:15px;position:relative;transition:.15s}
.ws-item:hover{border-color:var(--n4);color:var(--n0)}
.ws-item.active{background:var(--n0);color:var(--n10);border-color:var(--n0)}
.ws-item.active::before{content:"";position:absolute;left:-14px;top:9px;width:3px;height:20px;background:var(--m500)}
.ws-divider{width:24px;height:1px;background:var(--n8);margin:2px 0}
.ws-spacer{flex:1}

/* 채널(구역) 리스트 260px */
.channel-list{width:240px;flex:none;background:var(--n1);border-right:1px solid var(--n4);display:flex;flex-direction:column;min-height:0}
.channel-header{padding:18px 16px 12px}
.channel-header .ws-name{font-size:16px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;justify-content:space-between}
.channel-header .ws-sub{font-size:12px;color:var(--n7);margin-top:2px}
.channel-search{padding:0 16px 10px}
.channel-search label{display:flex;align-items:center;gap:8px;border:1px solid var(--n4);background:var(--n0);padding:0 10px;height:34px;color:var(--n6)}
.channel-search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%}
.channel-scroll{flex:1;overflow:auto;padding-bottom:12px}
.channel-section{margin-top:4px}
.section-toggle{width:100%;display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:12.5px;font-weight:700;color:var(--n8);text-align:left}
.section-toggle:hover{background:var(--n2)}
.section-toggle .cnt{margin-left:auto;font-weight:500;color:var(--n6)}
.section-toggle i.chev{transition:transform .18s;font-size:14px}
.section-toggle.closed i.chev{transform:rotate(-90deg)}
.channel-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 16px 7px 32px;color:var(--n8);font-size:13.5px;text-align:left;border-left:3px solid transparent}
.channel-item:hover{background:var(--n2)}
.channel-item .channel-prefix{color:var(--n5);font-weight:600}
.channel-item .channel-name{flex:1}
.channel-item .channel-unread{min-width:22px;height:18px;padding:0 6px;background:var(--n3);color:var(--n8);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.channel-item .channel-unread.hot{background:var(--n10);color:var(--n0)}
.channel-item.active{background:var(--m50);border-left-color:var(--m600);color:var(--m800);font-weight:700}
.channel-item.active .channel-prefix{color:var(--m600)}
.batch-card{margin:10px 16px 14px;padding:12px;border:1px solid var(--n4);background:var(--n0)}
.batch-card .t{display:flex;justify-content:space-between;font-size:12px;color:var(--n7)}
.batch-card .t b{color:var(--n9)}
.bar{height:6px;background:var(--n3);margin:8px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--m600);transform-origin:left;animation:barGrow 1.2s cubic-bezier(.2,.7,.2,1) both}
.batch-card .s{font-size:11.5px;color:var(--n6);display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--m500);animation:pulseDot 1.8s infinite}

/* 메인 */
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--n0)}
.conv-header{padding:20px 24px 0;border-bottom:1px solid var(--n4);position:relative}
.conv-title-row{display:flex;align-items:center;gap:10px}
.conv-prefix{font-size:22px;color:var(--m600);font-weight:700}
.conv-title{font-size:21px;font-weight:700;letter-spacing:-0.025em}
.conv-sub{color:var(--n7);font-size:12.5px;margin-left:4px}
.conv-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.conv-action{height:32px;padding:0 10px;border:1px solid var(--n4);display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--n8);background:var(--n0)}
.conv-action:hover{border-color:var(--n6)}
.conv-action.on{background:var(--n1);border-color:var(--n6)}
.mosaic{display:grid;grid-template-columns:repeat(3,7px);gap:5px;margin-right:6px}
.mosaic i{width:7px;height:7px;background:var(--n3)}
.mosaic i.a{background:var(--m500)}.mosaic i.b{background:var(--m300)}
.tabs{display:flex;gap:2px;margin-top:16px}
.tab{height:42px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--n9);background:var(--n1)}
.tab.active{color:var(--m700);border-bottom-color:var(--m600)}
.conv-body{flex:1;overflow:auto;padding:24px 28px;background:var(--n0)}
.conv-input{border-top:1px solid var(--n4);padding:12px 28px;display:flex;gap:10px;align-items:center;background:var(--n1)}
.msg-input{flex:1;height:38px;border:1px solid var(--n4);background:var(--n0);padding:0 12px;outline:0}
.btn{height:36px;padding:0 14px;border:1px solid var(--n4);background:var(--n0);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--n8)}
.btn:hover{border-color:var(--n7)}
.btn.primary{background:var(--m600);border-color:var(--m600);color:var(--n0)}
.btn.primary:hover{background:var(--m700)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent}

.hero-row{display:flex;align-items:flex-end;gap:36px;margin-bottom:22px;animation:fadeUp .4s both}
.hero-num{font-size:44px;font-weight:700;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero-num small{font-size:16px;font-weight:600;color:var(--n7);margin-left:4px;letter-spacing:-0.01em}
.hero-lab{font-size:12px;color:var(--n7);margin-bottom:6px}
.hero-sep{width:1px;align-self:stretch;background:var(--n4)}
.chips{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border:1px solid var(--n4);font-size:12.5px;font-weight:600;color:var(--n8);display:inline-flex;align-items:center;gap:6px;background:var(--n0)}
.chip:hover{border-color:var(--n7)}
.chip.on{background:var(--n10);border-color:var(--n10);color:var(--n0)}
.chip .dot{width:8px;height:8px;background:var(--n6)}
.chip .dot.hi{background:var(--s2)}.chip .dot.mid{background:var(--s3)}.chip .dot.lo{background:var(--m600)}
.chips select{height:30px;border:1px solid var(--n4);padding:0 8px;background:var(--n0)}
.chips .grow{flex:1}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.photo-item{border:1px solid var(--n4);background:var(--n0);text-align:left;display:block;animation:fadeUp .4s both;transition:border-color .15s,background .15s}
.photo-item:hover{border-color:var(--n7)}
.photo-item.sel{border-color:var(--m600);background:var(--m50);box-shadow:inset 0 0 0 1px var(--m600)}
.thumb{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--n3)}
.thumb svg{display:block;width:100%;height:100%}
.dbox{position:absolute;border:1.5px solid var(--m600)}
.dbox.hi{border-color:var(--s2)}.dbox.mid{border-color:var(--s3)}.dbox.lo{border-color:var(--m600)}
.thumb .badge-ct{position:absolute;left:6px;top:6px;background:var(--n10);color:var(--n0);font-size:11px;font-weight:700;padding:1px 6px}
.photo-cap{padding:9px 11px 10px;display:flex;flex-direction:column;gap:3px}
.photo-cap .fn{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
.photo-cap .mt{font-size:11.5px;color:var(--n7);display:flex;justify-content:space-between}
.sev{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;font-size:11.5px;font-weight:700}
.sev.hi{background:var(--s2-bg);color:var(--s2-text)}
.sev.mid{background:var(--s3-bg);color:var(--s3-text)}
.sev.lo{background:var(--n2);color:var(--n8)}
.sev.ok{background:var(--n10);color:var(--n0)}
.sev.wait{background:var(--n2);color:var(--n7)}
.skel{height:150px;background:linear-gradient(90deg,var(--n2) 25%,var(--n3) 50%,var(--n2) 75%);background-size:480px 100%;animation:shimmer 1.2s infinite linear}
.memo-list{margin-top:24px;border-top:1px solid var(--n4);padding-top:14px}
.memo-list h4{font-size:12.5px;color:var(--n7);margin-bottom:8px}
.msg-group{display:flex;gap:10px;padding:8px 0;animation:fadeUp .3s both}
.msg-avatar{width:30px;height:30px;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.msg-name{font-weight:700;font-size:13px}.msg-time{color:var(--n6);font-size:11.5px;margin-left:6px}
.msg-content p{font-size:13px;color:var(--n8)}

/* info panel 320px */
.info-panel{width:320px;flex:none;border-left:1px solid var(--n4);background:var(--n1);overflow:auto}
.info-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;font-weight:700}
.info-header h3{font-size:14px}
.info-section{padding:14px 20px;border-top:1px solid var(--n3)}
.info-label{font-size:11.5px;color:var(--n6);margin-bottom:4px;font-weight:600}
.info-value{font-size:13px;color:var(--n9);font-weight:600}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 8px;font-size:12.5px}
.kv dt{color:var(--n6)}.kv dd{color:var(--n9);font-weight:600}
.member-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.member-avatar{width:26px;height:26px;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-size:11px;font-weight:700}
.member-role{margin-left:auto;color:var(--n6);font-size:11.5px}
.panel-thumb{border:1px solid var(--n4);margin:0 20px 12px}

/* viewer */
.viewer-wrap{display:grid;grid-template-columns:1fr 230px;gap:16px;animation:fadeUp .35s both}
.vp{position:relative;height:540px;border:1px solid var(--n4);background:var(--n2);overflow:hidden;cursor:grab;user-select:none}
.vp.drag{cursor:grabbing}
.vp-inner{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0}
.vp-inner.anim{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.vp-inner svg{width:100%;height:100%;display:block}
.vp-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--n5) 1px,transparent 1px),linear-gradient(90deg,var(--n5) 1px,transparent 1px);background-size:300px 200px;opacity:.35}
.vp-tool{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;background:var(--n0);border:1px solid var(--n4);z-index:3}
.vp-tool button{width:34px;height:34px;display:grid;place-items:center;font-size:17px;color:var(--n8)}
.vp-tool button+button{border-top:1px solid var(--n3)}
.vp-tool button:hover{background:var(--n1)}
.vp-tool button.on{background:var(--m50);color:var(--m700)}
.vp-zoom{position:absolute;left:12px;bottom:12px;z-index:3;background:var(--n10);color:var(--n0);font-size:12px;font-weight:700;padding:4px 9px}
.vp-tile{position:absolute;left:62px;bottom:12px;z-index:3;background:var(--n0);border:1px solid var(--n4);font-size:11.5px;padding:4px 9px;color:var(--n7)}
.mini{position:absolute;right:12px;bottom:12px;width:150px;height:100px;border:1px solid var(--n6);background:var(--n0);z-index:3;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
.mini .rect{position:absolute;border:1.5px solid var(--m600);background:color-mix(in srgb,var(--m500) 14%,transparent)}
.vp-defect{position:absolute;border-style:solid;border-color:var(--m600)}
.vp-defect.hi{border-color:var(--s2);animation:boxPing 1.6s infinite}
.vp-defect.mid{border-color:var(--s3)}
.vp-defect .tag{position:absolute;left:-2px;top:-22px;background:var(--n10);color:var(--n0);font-weight:700;white-space:nowrap}
.vp-defect.focus{box-shadow:0 0 0 4000px color-mix(in srgb,var(--n10) 22%,transparent)}
.dlist{border:1px solid var(--n4);height:540px;overflow:auto;background:var(--n0)}
.dlist h4{font-size:12px;color:var(--n7);padding:10px 12px;border-bottom:1px solid var(--n3);position:sticky;top:0;background:var(--n1)}
.drow{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--n3)}
.drow:hover{background:var(--n1)}
.drow.sel{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.drow .a{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.drow .b{font-size:11.5px;color:var(--n7);margin-top:2px}
.vnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.vnav .grow{flex:1}

/* items */
.items-top{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-bottom:18px;animation:fadeUp .35s both}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--n5);background:var(--n1)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--n3);vertical-align:middle}
.tbl tr:hover td{background:var(--n1)}
.conf{display:flex;align-items:center;gap:8px}
.conf .bar{width:70px;margin:0}
.conf .bar>i{background:var(--n7)}
.seg{display:inline-flex;border:1px solid var(--n4)}
.seg button{height:28px;padding:0 10px;font-size:12px;font-weight:600;color:var(--n7)}
.seg button.on{background:var(--n10);color:var(--n0)}
.sum-strip{display:flex;gap:24px;font-size:12.5px;color:var(--n7);margin:10px 0 14px}
.sum-strip b{color:var(--n9);font-size:18px;margin-right:3px;font-variant-numeric:tabular-nums}

/* report */
.rep-grid>div{min-width:0}
.rep-grid{display:grid;grid-template-columns:300px 1fr;gap:22px;animation:fadeUp .35s both}
.panel{border:1px solid var(--n4);background:var(--n0)}
.panel h4{font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--n3);background:var(--n1);display:flex;justify-content:space-between}
.panel .pb{padding:12px 14px}
.ck{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--m600);width:15px;height:15px}
.ck .n{margin-left:auto;color:var(--n6);font-size:12px}
.field-list{display:flex;flex-wrap:wrap;gap:6px}
.xl{border:1px solid var(--n5);font-size:12px;overflow:auto;max-height:300px}
.xl table{border-collapse:collapse;width:100%;min-width:640px}
.xl th{background:var(--n2);font-weight:600;color:var(--n7);border:1px solid var(--n4);padding:4px 8px;text-align:center;font-size:11px;position:sticky;top:0}
.xl td{border:1px solid var(--n4);padding:4px 8px;white-space:nowrap}
.xl td.rn{background:var(--n2);color:var(--n7);text-align:center;width:34px}
.xl td.hd{background:var(--n10);color:var(--n0);font-weight:700}
.xl .mini-img{width:56px;height:32px;display:block;border:1px solid var(--n4)}
.result{border:1px solid var(--m600);background:var(--m50);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;animation:fadeUp .3s both}
.result i.big{font-size:26px;color:var(--m700)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n0);padding:11px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:50;animation:fadeUp .25s both}
.empty{padding:50px 0;text-align:center;color:var(--n6)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="mortar" width="30" height="20" patternUnits="userSpaceOnUse">
      <rect width="30" height="20" style="fill:var(--n3)"/>
      <path d="M0 10H30M15 0V10M0 20V10" style="stroke:var(--n4);fill:none" stroke-width=".7"/>
    </pattern>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--n0);stop-opacity:.35"/>
      <stop offset="1" style="stop-color:var(--n8);stop-opacity:.18"/>
    </linearGradient>
  </defs>
</svg>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ───── 시드 난수 · 더미 데이터 (모두 로컬 mock) ───── */
function rng(seed){let t=seed+0x6D2B79F5;return()=>{t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const BUILDINGS = [
  {id:'301', zones:['남측면','북측면','동측면','서측면','옥상 파라펫']},
  {id:'302', zones:['남측면','북측면','동측면','서측면','옥상 파라펫']},
  {id:'303', zones:['남측면','북측면','동측면','서측면']},
  {id:'304', zones:['남측면','북측면','동측면','서측면']},
];
const INSPECTORS = ['김서윤','박도현','이하준','최민재'];
const TYPES = {hi:['철근 노출','박리·탈락','균열 (폭 넓음)'],mid:['균열','백태·누수 흔적','도장 들뜸'],lo:['미세 균열','오염 얼룩']};
const SEV_LABEL = {hi:'심각',mid:'주의',lo:'경미'};
const zoneKey = (b,z)=>b+'|'+z;
function seedOf(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function makePhotos(b,z){
  const r=rng(seedOf(zoneKey(b,z)));
  const day=['03','04','05','07','10'][Math.floor(r()*5)];
  return Array.from({length:12},(_,i)=>{
    const n=1+Math.floor(r()*3);
    const floor=2+Math.floor(r()*13);
    const defects=Array.from({length:n},(_,k)=>{
      const p=r();const sev=p<.22?'hi':p<.6?'mid':'lo';
      const w=9+r()*14,h=7+r()*14;
      const type=TYPES[sev][Math.floor(r()*TYPES[sev].length)];
      return {id:`${b}-${z[0]}-${i+1}-${k+1}`,n:k+1,sev,type,x:4+r()*(92-w),y:6+r()*(86-h),w,h,
        conf:Math.round((.62+r()*.36)*100)/100,len:Math.round(300+r()*2400)};
    });
    return {id:`${b}-${z}-${i}`,file:`DJI_${String(4120+Math.floor(r()*5400)).padStart(4,'0')}.JPG`,
      floor:`${floor}~${floor+2}층`,date:`2026-10-${day}`,time:`${9+Math.floor(r()*7)}:${String(Math.floor(r()*60)).padStart(2,'0')}`,
      by:INSPECTORS[Math.floor(r()*INSPECTORS.length)],seed:seedOf(b+z)+i*17,defects};
  });
}
const ALL = {};
BUILDINGS.forEach(B=>B.zones.forEach(z=>{ALL[zoneKey(B.id,z)]=makePhotos(B.id,z)}));
const countOf = k=>ALL[k].reduce((a,p)=>a+p.defects.length,0);

/* ───── 외벽 사진(절차적 SVG) — 균열·박리 등을 그려 넣음 ───── */
function Facade({photo,detail}){
  const r=rng(photo.seed);
  const els=[];
  const cols=6,rows=3;
  for(let c=0;c<cols;c++)for(let q=0;q<rows;q++){
    const x=14+c*48,y=18+q*62;
    els.push(<g key={'w'+c+q}><rect x={x} y={y} width="30" height="34" style={{fill:'var(--n6)'}}/><rect x={x+2} y={y+2} width="26" height="30" style={{fill:'var(--n5)'}}/><path d={`M${x+15} ${y+2}V${y+32}`} style={{stroke:'var(--n6)'}} strokeWidth="1.2"/></g>);
  }
  [60,122,184].forEach(y=>els.push(<rect key={'s'+y} x="0" y={y} width="300" height="3" style={{fill:'var(--n5)'}}/>));
  for(let i=0;i<4;i++)els.push(<ellipse key={'st'+i} cx={r()*300} cy={r()*200} rx={14+r()*30} ry={5+r()*14} style={{fill:'var(--n4)',opacity:.5}}/>);
  photo.defects.forEach(d=>{
    const X=d.x*3,Y=d.y*2,W=d.w*3,H=d.h*2;
    if(d.type.includes('균열')){
      let px=X,py=Y,pts=`M${px} ${py}`;const steps=7;
      for(let i=1;i<=steps;i++){px=X+W*i/steps+(r()-.5)*7;py=Y+H*i/steps+(r()-.5)*9;pts+=` L${px.toFixed(1)} ${py.toFixed(1)}`}
      els.push(<path key={d.id} d={pts} style={{stroke:'var(--n10)',fill:'none'}} strokeWidth={d.sev==='hi'?1.8:1} strokeLinecap="round"/>);
      if(d.sev!=='lo')els.push(<path key={d.id+'b'} d={`M${X+W*.5} ${Y+H*.5} l${W*.3} ${-H*.2} l${W*.2} ${H*.1}`} style={{stroke:'var(--n9)',fill:'none'}} strokeWidth=".8"/>);
    }else if(d.type.includes('박리')){
      els.push(<polygon key={d.id} points={`${X},${Y+H*.3} ${X+W*.4},${Y} ${X+W},${Y+H*.4} ${X+W*.8},${Y+H} ${X+W*.2},${Y+H*.9}`} style={{fill:'var(--n7)'}}/>);
    }else if(d.type.includes('철근')){
      els.push(<rect key={d.id} x={X} y={Y} width={W} height={H} style={{fill:'var(--n8)'}}/>);
      [.3,.55,.8].forEach((f,i)=>els.push(<path key={d.id+i} d={`M${X} ${Y+H*f}H${X+W}`} style={{stroke:'var(--n4)'}} strokeWidth="1.4"/>));
    }else{
      els.push(<ellipse key={d.id} cx={X+W/2} cy={Y+H/2} rx={W/2} ry={H/2} style={{fill:'var(--n2)',opacity:.85}}/>);
    }
  });
  return (<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice">
    <rect width="300" height="200" style={{fill:'url(#mortar)'}}/>
    {els}
    <rect width="300" height="200" style={{fill:'url(#light)'}}/>
  </svg>);
}
const Boxes=({photo,show=true})=>show?photo.defects.map(d=>(
  <div key={d.id} className={'dbox '+d.sev} style={{left:d.x+'%',top:d.y+'%',width:d.w+'%',height:d.h+'%'}}/>
)):null;

const worst = p => p.defects.some(d=>d.sev==='hi')?'hi':p.defects.some(d=>d.sev==='mid')?'mid':'lo';
const Sev = ({s,children})=><span className={'sev '+s}>{children||SEV_LABEL[s]}</span>;

function App(){
  const [tab,setTab]=useState('main');
  const [open,setOpen]=useState({'301':true,'302':true,'303':false,'304':false});
  const [zone,setZone]=useState(zoneKey('301','남측면'));
  const [sevF,setSevF]=useState('all');
  const [sort,setSort]=useState('sev');
  const [loading,setLoading]=useState(false);
  const [selId,setSelId]=useState(null);
  const [infoOpen,setInfoOpen]=useState(true);
  const [review,setReview]=useState({});
  const [sevOver,setSevOver]=useState({});
  const [memos,setMemos]=useState([{n:'박도현',t:'09:42',m:'남측 4~6층 가로 균열 구간은 보수 우선순위에 포함해 주세요.'}]);
  const [memoText,setMemoText]=useState('');
  const [toast,setToast]=useState(null);
  const [q,setQ]=useState('');

  const photos=ALL[zone];
  const [bId,zName]=zone.split('|');
  const sel=photos.find(p=>p.id===selId)||photos[0];
  const say=(t)=>{setToast(t);setTimeout(()=>setToast(null),2200)};
  const pick=(k)=>{setLoading(true);setZone(k);setSelId(null);setTimeout(()=>setLoading(false),450)};
  const sevOf=d=>sevOver[d.id]||d.sev;
  const list=useMemo(()=>{
    let l=photos.filter(p=>sevF==='all'||p.defects.some(d=>sevOf(d)===sevF));
    const rank={hi:0,mid:1,lo:2};
    l=[...l].sort((a,b)=>sort==='sev'?rank[worst(a)]-rank[worst(b)]:sort==='cnt'?b.defects.length-a.defects.length:a.file.localeCompare(b.file));
    return l;
  },[zone,sevF,sort,sevOver]);
  const total=photos.reduce((a,p)=>a+p.defects.length,0);
  const hiN=photos.reduce((a,p)=>a+p.defects.filter(d=>sevOf(d)==='hi').length,0);
  const midN=photos.reduce((a,p)=>a+p.defects.filter(d=>sevOf(d)==='mid').length,0);

  const TABS=[['main','ti-layout-grid','그룹별 탐지 결과 목록'],['viewer','ti-zoom-in','파손 오버레이·원본 위치 확인'],['items','ti-list-details','사진별 파손 항목 리스트'],['report','ti-file-spreadsheet','구역별 엑셀 보고서 출력']];
  const addMemo=()=>{
    if(!memoText.trim())return;
    setMemos(m=>[...m,{n:'김서윤',t:'방금',m:memoText.trim()}]);setMemoText('');say('구역 메모가 기록됩니다');
  };
  const filtBuildings=BUILDINGS.map(B=>({...B,zones:B.zones.filter(z=>!q||(B.id+z).includes(q))})).filter(B=>B.zones.length||!q);

  return (
  <div className="app" data-archetype="slack-3pane">
    <nav className="workspace-strip" data-workspace-strip>
      <div className="ws-brand"><i className="ti ti-building-skyscraper"></i></div>
      <button className="ws-item active" title="푸른숲 3단지" onClick={()=>say('푸른숲 3단지 작업 공간입니다')}>푸</button>
      <button className="ws-item" title="한빛 2단지" onClick={()=>say('한빛 2단지는 분석 대기 중입니다')}>한</button>
      <button className="ws-item" title="물빛 1단지" onClick={()=>say('물빛 1단지는 사진 등록 전입니다')}>물</button>
      <div className="ws-divider"></div>
      <button className="ws-item" title="새 단지 등록" onClick={()=>say('새 단지 등록 화면이 열립니다')}><i className="ti ti-plus"></i></button>
      <div className="ws-spacer"></div>
      <button className="ws-item" title="점검자 설정" onClick={()=>say('점검자 목록을 관리합니다')}><i className="ti ti-user"></i></button>
    </nav>

    <aside className="channel-list" data-channel-list>
      <header className="channel-header">
        <h2 className="ws-name">푸른숲 3단지 <i className="ti ti-chevron-down" style={{color:'var(--n6)'}}></i></h2>
        <div className="ws-sub">4개 동 · 사진 15,284장 · 데모 데이터</div>
      </header>
      <div className="channel-search"><label><i className="ti ti-search"></i><input placeholder="동·구역 검색…" value={q} onChange={e=>setQ(e.target.value)}/></label></div>
      <div className="channel-scroll">
        {filtBuildings.map(B=>(
          <div className="channel-section" key={B.id}>
            <button className={'section-toggle '+(open[B.id]||q?'':'closed')} onClick={()=>setOpen(o=>({...o,[B.id]:!o[B.id]}))}>
              <i className="ti ti-chevron-down chev"></i>{B.id}동<span className="cnt">{B.zones.reduce((a,z)=>a+countOf(zoneKey(B.id,z)),0)}건</span>
            </button>
            {(open[B.id]||q)&&B.zones.map(z=>{const k=zoneKey(B.id,z);const c=countOf(k);const hot=ALL[k].some(p=>p.defects.some(d=>d.sev==='hi'));
              return <button key={k} className={'channel-item '+(zone===k?'active':'')} onClick={()=>pick(k)}>
                <span className="channel-prefix">#</span><span className="channel-name">{z}</span>
                <span className={'channel-unread '+(hot?'hot':'')}>{c}</span></button>})}
          </div>))}
      </div>
      <div className="batch-card">
        <div className="t"><span>배치 분석 진행</span><b className="num">11,420 / 15,284장</b></div>
        <div className="bar"><i style={{width:'74.7%'}}></i></div>
        <div className="s"><span className="live-dot"></span>3개 작업 처리 중 · 실패 2건 재개 대기</div>
      </div>
    </aside>

    <main className="conv-main">
      <header className="conv-header">
        <div className="conv-title-row">
          <span className="conv-prefix">#</span>
          <h2 className="conv-title">{bId}동 {zName}</h2>
          <span className="conv-sub">탐지 사진 {photos.length}장 · 점검자 {sel.by}</span>
          <div className="conv-actions">
            <div className="mosaic" aria-hidden="true"><i></i><i className="b"></i><i></i><i className="a"></i><i></i><i className="b"></i><i></i><i className="a"></i><i></i></div>
            <button className="conv-action" onClick={()=>{setSevF('hi');setTab('main');say('심각 등급만 모아 봅니다')}}><i className="ti ti-alert-triangle"></i>심각만</button>
            <button className={'conv-action toggle-info info-toggle '+(infoOpen?'on':'')} onClick={()=>setInfoOpen(v=>!v)}><i className="ti ti-info-circle"></i>사진 정보</button>
          </div>
        </div>
        <div className="tabs" role="tablist">
          {TABS.map(([k,ic,label])=>(
            <button key={k} role="tab" className={'tab '+(tab===k?'active':'')} onClick={()=>setTab(k)}><i className={'ti '+ic}></i>{label}</button>
          ))}
        </div>
      </header>

      <div className="conv-body">
        {tab==='main'&&MainView()}
        {tab==='viewer'&&<ViewerView photo={sel} photos={photos} setSel={setSelId} review={review} sevOf={sevOf}/>}
        {tab==='items'&&<ItemsView photo={sel} photos={photos} setSel={setSelId} review={review} setReview={setReview} sevOf={sevOf} setSevOver={setSevOver} go={setTab} say={say}/>}
        {tab==='report'&&<ReportView say={say} review={review}/>}
      </div>

      <footer className="conv-input">
        <i className="ti ti-message-2" style={{color:'var(--n6)',fontSize:18}}></i>
        <input className="msg-input" placeholder={`${bId}동 ${zName}에 점검 메모 남기기…`} value={memoText} onChange={e=>setMemoText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMemo()}/>
        <button className="btn primary" onClick={addMemo}><i className="ti ti-send"></i>남기기</button>
      </footer>
    </main>

    {infoOpen&&<aside className="info-panel detail-panel" data-info-panel>
      <header className="info-header"><h3>선택한 사진</h3><button className="btn sm ghost close-info" onClick={()=>setInfoOpen(false)}><i className="ti ti-x"></i></button></header>
      <div className="panel-thumb"><div className="thumb"><Facade photo={sel}/><Boxes photo={sel}/></div></div>
      <div className="info-section">
        <dl className="kv">
          <dt>파일</dt><dd>{sel.file}</dd>
          <dt>촬영일</dt><dd className="num">{sel.date} {sel.time}</dd>
          <dt>해상도</dt><dd className="num">5472 × 3648</dd>
          <dt>점검자</dt><dd>{sel.by}</dd>
          <dt>위치</dt><dd>{bId}동 {zName} · {sel.floor}</dd>
          <dt>탐지</dt><dd>{sel.defects.length}건</dd>
        </dl>
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn sm primary" onClick={()=>setTab('viewer')}><i className="ti ti-zoom-in"></i>원본에서 보기</button>
          <button className="btn sm" onClick={()=>setTab('items')}>항목 리스트</button>
        </div>
      </div>
      <div className="info-section">
        <div className="info-label">구역 점검자</div>
        {INSPECTORS.slice(0,3).map((n,i)=><div className="member-item" key={n}><span className="member-avatar">{n[0]}</span><span>{n}</span><span className="member-role">{['책임','드론 촬영','검수'][i]}</span></div>)}
      </div>
      <div className="info-section">
        <div className="info-label">구역 메모</div>
        {memos.map((m,i)=><div className="msg-group" key={i}><div className="msg-avatar">{m.n[0]}</div><div className="msg-content"><div><span className="msg-name">{m.n}</span><span className="msg-time">{m.t}</span></div><p>{m.m}</p></div></div>)}
      </div>
    </aside>}
    {toast&&<div className="toast"><i className="ti ti-check"></i>{toast}</div>}
  </div>);

  function MainView(){
    return (<div>
      <div className="hero-row">
        <div><div className="hero-lab">탐지된 파손 부위</div><div className="hero-num num">{total}<small>건</small></div></div>
        <div className="hero-sep"></div>
        <div><div className="hero-lab">심각</div><div className="hero-num num" style={{fontSize:30}}>{hiN}<small>건</small></div></div>
        <div><div className="hero-lab">주의</div><div className="hero-num num" style={{fontSize:30}}>{midN}<small>건</small></div></div>
        <div><div className="hero-lab">경미</div><div className="hero-num num" style={{fontSize:30}}>{total-hiN-midN}<small>건</small></div></div>
      </div>
      <div className="chips">
        {[['all','전체',null],['hi','심각','hi'],['mid','주의','mid'],['lo','경미','lo']].map(([k,l,d])=>(
          <button key={k} className={'chip '+(sevF===k?'on':'')} onClick={()=>setSevF(k)}>{d&&<span className={'dot '+d}></span>}{l}</button>))}
        <span className="grow"></span>
        <select value={sort} onChange={e=>setSort(e.target.value)} aria-label="정렬"><option value="sev">심각도 순</option><option value="cnt">탐지 건수 순</option><option value="file">파일명 순</option></select>
      </div>
      <div className="photo-grid">
        {loading?Array.from({length:6}).map((_,i)=><div key={i} className="photo-item"><div className="skel"></div></div>)
        :list.map((p,i)=>(
          <button key={p.id} className={'photo-item '+(sel.id===p.id?'sel':'')} style={{animationDelay:i*35+'ms'}} onClick={()=>setSelId(p.id)} onDoubleClick={()=>{setSelId(p.id);setTab('viewer')}}>
            <div className="thumb"><Facade photo={p}/><Boxes photo={p}/><span className="badge-ct">{p.defects.length}건</span></div>
            <div className="photo-cap"><div className="fn"><span>{p.file}</span><Sev s={worst(p)}/></div><div className="mt"><span>{p.floor}</span><span className="num">{p.date.slice(5)}</span></div></div>
          </button>))}
      </div>
      {!loading&&list.length===0&&<div className="empty">선택한 등급의 탐지 사진이 없습니다.</div>}
      <div className="memo-list"><h4>구역 메모 {memos.length}건</h4>
        {memos.map((m,i)=><div className="msg-group" key={i}><div className="msg-avatar">{m.n[0]}</div><div className="msg-content"><div><span className="msg-name">{m.n}</span><span className="msg-time">{m.t}</span></div><p>{m.m}</p></div></div>)}
      </div>
    </div>);
  }
}

/* ───── 딥줌 뷰어 (타일 기반 확대·이동을 CSS 변환으로 시연) ───── */
function ViewerView({photo,photos,setSel,review,sevOf}){
  const vpRef=useRef(null);
  const W=1200,H=800;
  const [view,setView]=useState({s:.6,x:0,y:0});
  const [anim,setAnim]=useState(false);
  const [drag,setDrag]=useState(null);
  const [overlay,setOverlay]=useState(true);
  const [grid,setGrid]=useState(true);
  const [fd,setFd]=useState(null);
  const size=()=>{const e=vpRef.current;return e?[e.clientWidth,e.clientHeight]:[800,470]};
  const fit=()=>{const[w,h]=size();const s=Math.min(w/W,h/H);setAnim(true);setFd(null);setView({s,x:(w-W*s)/2,y:(h-H*s)/2})};
  useEffect(()=>{fit()},[photo.id]);
  const zoomTo=(s2)=>{const[w,h]=size();s2=Math.max(.3,Math.min(4,s2));setAnim(true);setView(v=>{const cx=(w/2-v.x)/v.s,cy=(h/2-v.y)/v.s;return{s:s2,x:w/2-cx*s2,y:h/2-cy*s2}})};
  const focus=(d)=>{const[w,h]=size();const s=2.2;const cx=(d.x+d.w/2)/100*W,cy=(d.y+d.h/2)/100*H;setFd(d.id);setAnim(true);setView({s,x:w/2-cx*s,y:h/2-cy*s})};
  const idx=photos.findIndex(p=>p.id===photo.id);
  const [w,h]=size();
  const mini={l:Math.max(0,-view.x/view.s/W*100),t:Math.max(0,-view.y/view.s/H*100),w:Math.min(100,w/view.s/W*100),h:Math.min(100,h/view.s/H*100)};
  return (<div>
    <div className="vnav">
      <button className="btn sm" onClick={()=>setSel(photos[(idx+photos.length-1)%photos.length].id)}><i className="ti ti-chevron-left"></i>이전</button>
      <button className="btn sm" onClick={()=>setSel(photos[(idx+1)%photos.length].id)}>다음<i className="ti ti-chevron-right"></i></button>
      <b style={{marginLeft:6}}>{photo.file}</b><span style={{color:'var(--n7)'}}>{photo.floor} · 원본 5472 × 3648</span>
      <span className="grow"></span>
      <button className="btn sm" onClick={fit}><i className="ti ti-arrows-maximize"></i>화면에 맞춤</button>
    </div>
    <div className="viewer-wrap">
      <div className={'vp '+(drag?'drag':'')} ref={vpRef}
        onMouseDown={e=>{setAnim(false);setDrag({x:e.clientX-view.x,y:e.clientY-view.y})}}
        onMouseMove={e=>drag&&setView(v=>({...v,x:e.clientX-drag.x,y:e.clientY-drag.y}))}
        onMouseUp={()=>setDrag(null)} onMouseLeave={()=>setDrag(null)}>
        <div className={'vp-inner '+(anim?'anim':'')} style={{transform:`translate(${view.x}px,${view.y}px) scale(${view.s})`}}>
          <Facade photo={photo}/>
          {grid&&view.s>1.2&&<div className="vp-grid"></div>}
          {overlay&&photo.defects.map((d,i)=>{const s=sevOf(d);return(
            <div key={d.id} className={'vp-defect '+s+(fd===d.id?' focus':'')} style={{left:d.x+'%',top:d.y+'%',width:d.w+'%',height:d.h+'%',borderWidth:2.5/view.s}}>
              <span className="tag" style={{fontSize:12/view.s,padding:`${1/view.s}px ${6/view.s}px`,top:-22/view.s}}>#{d.n} {d.type}</span>
            </div>)})}
        </div>
        <div className="vp-tool">
          <button title="확대" onClick={()=>zoomTo(view.s*1.4)}><i className="ti ti-zoom-in"></i></button>
          <button title="축소" onClick={()=>zoomTo(view.s/1.4)}><i className="ti ti-zoom-out"></i></button>
          <button title="원본 100%" onClick={()=>zoomTo(1)}><i className="ti ti-focus-2"></i></button>
          <button title="파손 표시" className={overlay?'on':''} onClick={()=>setOverlay(v=>!v)}><i className={'ti '+(overlay?'ti-eye':'ti-eye-off')}></i></button>
          <button title="타일 격자" className={grid?'on':''} onClick={()=>setGrid(v=>!v)}><i className="ti ti-layout-grid"></i></button>
        </div>
        <div className="vp-zoom num">{Math.round(view.s*100)}%</div>
        <div className="vp-tile">타일 레벨 {view.s>2?3:view.s>1?2:1} · 필요한 타일만 요청</div>
        <div className="mini"><Facade photo={photo}/><div className="rect" style={{left:mini.l+'%',top:mini.t+'%',width:mini.w+'%',height:mini.h+'%'}}></div></div>
      </div>
      <div className="dlist">
        <h4>탐지 {photo.defects.length}건 · 클릭하면 원본 위치로 이동</h4>
        {photo.defects.map(d=>(
          <button key={d.id} className={'drow '+(fd===d.id?'sel':'')} onClick={()=>focus(d)}>
            <div className="a"><span>#{d.n} {d.type}</span><Sev s={sevOf(d)}/></div>
            <div className="b num">신뢰도 {d.conf.toFixed(2)} · 길이 {d.len.toLocaleString()}px</div>
          </button>))}
        <div style={{padding:12}}><button className="btn sm" onClick={()=>photo.defects[0]&&focus(photo.defects[0])}><i className="ti ti-focus-2"></i>첫 항목으로 이동</button></div>
      </div>
    </div>
  </div>);
}

/* ───── 사진별 파손 항목 리스트 ───── */
function ItemsView({photo,photos,setSel,review,setReview,sevOf,setSevOver,go,say}){
  const idx=photos.findIndex(p=>p.id===photo.id);
  const st=d=>review[d.id]||'wait';
  const n=(v)=>photo.defects.filter(d=>st(d)===v).length;
  return (<div>
    <div className="items-top">
      <div className="thumb" style={{border:'1px solid var(--n4)'}}><Facade photo={photo}/><Boxes photo={photo}/></div>
      <div>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <button className="btn sm" onClick={()=>setSel(photos[(idx+photos.length-1)%photos.length].id)}><i className="ti ti-chevron-left"></i></button>
          <select value={photo.id} onChange={e=>setSel(e.target.value)} style={{height:30,border:'1px solid var(--n4)',padding:'0 8px'}}>
            {photos.map(p=><option key={p.id} value={p.id}>{p.file} · {p.defects.length}건</option>)}
          </select>
          <button className="btn sm" onClick={()=>setSel(photos[(idx+1)%photos.length].id)}><i className="ti ti-chevron-right"></i></button>
          <button className="btn sm" style={{marginLeft:'auto'}} onClick={()=>go('viewer')}><i className="ti ti-zoom-in"></i>원본에서 보기</button>
        </div>
        <div className="sum-strip"><span><b>{photo.defects.length}</b>탐지</span><span><b>{n('ok')}</b>승인</span><span><b>{n('no')}</b>제외</span><span><b>{n('wait')}</b>검수 대기</span></div>
        <button className="btn primary sm" onClick={()=>{const r={...review};photo.defects.forEach(d=>{if(!r[d.id])r[d.id]='ok'});setReview(r);say('대기 항목을 모두 승인합니다')}}><i className="ti ti-check"></i>대기 항목 일괄 승인</button>
      </div>
    </div>
    <table className="tbl">
      <thead><tr><th>#</th><th>유형</th><th>길이·면적</th><th>탐지 신뢰도</th><th>심각도 등급</th><th>검수</th><th></th></tr></thead>
      <tbody>{photo.defects.map(d=>(
        <tr key={d.id}>
          <td className="num">{d.n}</td><td style={{fontWeight:700}}>{d.type}</td>
          <td className="num">{d.len.toLocaleString()}px</td>
          <td><div className="conf"><div className="bar"><i style={{width:d.conf*100+'%'}}></i></div><span className="num">{d.conf.toFixed(2)}</span></div></td>
          <td><div className="seg">{['hi','mid','lo'].map(s=><button key={s} className={sevOf(d)===s?'on':''} onClick={()=>setSevOver(o=>({...o,[d.id]:s}))}>{SEV_LABEL[s]}</button>)}</div></td>
          <td>{st(d)==='ok'?<span className="sev ok"><i className="ti ti-check"></i>승인</span>:st(d)==='no'?<span className="sev lo">제외</span>:<span className="sev wait">대기</span>}</td>
          <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
            <button className="btn sm" onClick={()=>setReview(r=>({...r,[d.id]:'ok'}))}>승인</button>{' '}
            <button className="btn sm" onClick={()=>setReview(r=>({...r,[d.id]:'no'}))}>제외</button>
          </td>
        </tr>))}</tbody>
    </table>
  </div>);
}

/* ───── 엑셀 보고서 출력 ───── */
function ReportView({say,review}){
  const [zones,setZones]=useState({'301|남측면':true,'301|북측면':true});
  const [fields,setFields]=useState({sev:true,date:true,by:true,res:true,dur:true,img:true});
  const [state,setState]=useState('idle');
  const [pct,setPct]=useState(0);
  const F=[['img','사진 이미지'],['sev','파손 정도(심각도)'],['date','촬영 날짜'],['by','점검자 이름'],['res','사진 해상도'],['dur','점검 소요 시간']];
  const picked=Object.keys(zones).filter(k=>zones[k]);
  const rows=picked.flatMap(k=>ALL[k].slice(0,3).map(p=>({k,p})));
  const run=()=>{if(!picked.length){say('구역을 하나 이상 선택해 주세요');return}
    setState('run');setPct(0);let v=0;const t=setInterval(()=>{v+=14+Math.random()*10;if(v>=100){clearInterval(t);setPct(100);setState('done');say('엑셀 보고서가 준비됩니다')}else setPct(v)},260)};
  return (<div className="rep-grid">
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="panel"><h4>출력 구역<span style={{color:'var(--n6)'}}>{picked.length}개 선택</span></h4>
        <div className="pb">
          {BUILDINGS.slice(0,2).map(B=><div key={B.id}><div style={{fontWeight:700,fontSize:12.5,margin:'6px 0 2px'}}>{B.id}동</div>
            {B.zones.slice(0,4).map(z=>{const k=zoneKey(B.id,z);return <label className="ck" key={k}><input type="checkbox" checked={!!zones[k]} onChange={e=>setZones(o=>({...o,[k]:e.target.checked}))}/>{z}<span className="n num">{countOf(k)}건</span></label>})}</div>)}
        </div></div>
      <div className="panel"><h4>포함 항목</h4><div className="pb field-list">
        {F.map(([k,l])=><button key={k} className={'chip '+(fields[k]?'on':'')} onClick={()=>setFields(o=>({...o,[k]:!o[k]}))}>{l}</button>)}
      </div></div>
      <button className="btn primary" style={{height:42,justifyContent:'center'}} data-loading={state==='run'} onClick={run}><i className="ti ti-file-spreadsheet"></i>엑셀 보고서 생성</button>
    </div>
    <div>
      {state==='run'&&<div className="panel" style={{marginBottom:12}}><div className="pb"><div style={{display:'flex',justifyContent:'space-between',fontSize:12.5}}><span>이미지 삽입 · 시트 구성 중</span><b className="num">{Math.round(pct)}%</b></div><div className="bar"><i style={{width:pct+'%',animation:'none',transform:'none',transition:'width .25s'}}></i></div></div></div>}
      {state==='done'&&<div className="result"><i className="ti ti-file-spreadsheet big"></i><div style={{flex:1}}><b>푸른숲3단지_외벽점검_{picked.length}개구역.xlsx</b><div style={{fontSize:12,color:'var(--n7)'}}>시트 {picked.length}개 · 항목 {rows.length*2}행 · 이미지 포함</div></div><button className="btn primary sm" onClick={()=>say('파일 다운로드가 시작됩니다')}><i className="ti ti-download"></i>다운로드</button></div>}
      <div className="panel"><h4>미리보기 — {picked[0]?picked[0].replace('|',' '):'구역 선택 필요'} 시트<span style={{color:'var(--n6)'}}>상위 {Math.min(rows.length,6)}행</span></h4>
        <div className="xl"><table>
          <thead><tr><th></th>{['A','B','C','D','E','F','G','H'].map(c=><th key={c}>{c}</th>)}</tr></thead>
          <tbody>
            <tr><td className="rn">1</td><td className="hd">구역</td><td className="hd">사진</td><td className="hd">파일명</td><td className="hd">심각도</td><td className="hd">촬영 날짜</td><td className="hd">점검자</td><td className="hd">해상도</td><td className="hd">점검 시간</td></tr>
            {rows.slice(0,6).map(({k,p},i)=>(
              <tr key={i}><td className="rn">{i+2}</td><td>{k.replace('|',' ')}</td>
                <td>{fields.img?<div className="thumb mini-img"><Facade photo={p}/></div>:'—'}</td><td>{p.file}</td>
                <td>{fields.sev?SEV_LABEL[worst(p)]:'—'}</td><td>{fields.date?p.date:'—'}</td><td>{fields.by?p.by:'—'}</td><td>{fields.res?'5472×3648':'—'}</td><td>{fields.dur?`${40+i*7}분`:'—'}</td></tr>))}
          </tbody></table></div></div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
