<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다국어 모바일 구직 플랫폼 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 226°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#e5ebff;
  --m100:#cbd7ff;
  --m200:#abbfff;
  --m300:#88a3ff;
  --m400:#668aff;
  --m500:#4570ff;
  --m600:#395cd1;
  --m700:#2c48a3;
  --m800:#1f3273;
  --m900:#1f3273;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#ffffff;
  --n1:#ffffff;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d6d7;
  --n5:#b5b6ba;
  --n6:#909298;
  --n7:#6e6d6c;
  --n8:#53555a;
  --n9:#36373a;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m500) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes drawLine{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@keyframes ringFill{from{stroke-dashoffset:176}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.view{animation:fadeUp .45s ease both}
/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--n1);border-bottom:1px solid var(--n3)}
.topbar-in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--m500);color:var(--n0);display:grid;place-items:center;font-weight:700;font-size:17px}
.search-bar{flex:1;max-width:520px;position:relative}
.search-bar input{width:100%;height:42px;border-radius:9999px;border:1px solid var(--n4);background:var(--n2);padding:0 18px 0 44px;outline:none}
.search-bar i,.search-bar svg{position:absolute;left:15px;top:12px;width:18px;height:18px;color:var(--n7)}
.lang{display:flex;background:var(--n2);border-radius:9999px;padding:3px;margin-left:auto}
.lang button{padding:5px 12px;border-radius:9999px;font-size:12px;font-weight:500;color:var(--n8)}
.lang button.on{background:var(--n1);color:var(--n10);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--n3);color:var(--n8);display:grid;place-items:center;font-weight:600;font-size:13px;position:relative}
.nav-row{max-width:1200px;margin:0 auto;padding:0 24px 12px;display:flex;gap:8px;overflow-x:auto}
.nav-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9999px;font-weight:500;color:var(--n8);white-space:nowrap;border:1px solid transparent;transition:.2s}
.nav-btn:hover{background:var(--n2)}
.nav-btn.on{background:var(--m500);color:var(--n0)}
.nav-btn svg{width:16px;height:16px}
.badge-n{min-width:18px;height:18px;border-radius:9px;background:var(--n10);color:var(--n0);font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.main{max-width:1200px;margin:0 auto;padding:24px}
/* hero */
.hero{border-radius:28px;background:linear-gradient(135deg,var(--m50),var(--n1) 62%);border:1px solid var(--n3);padding:44px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;overflow:hidden}
.hero h1{font-size:48px;line-height:1.15;font-weight:700;letter-spacing:-.03em}
.hero h1 em{font-style:normal;position:relative;white-space:nowrap}
.hero h1 em svg{position:absolute;left:0;bottom:-10px;width:100%;height:12px}
.hero h1 em path{stroke-dasharray:240;animation:drawLine 1.2s .3s ease both}
.hero p{margin-top:18px;color:var(--n7);font-size:16px;max-width:460px}
.hero-cta{margin-top:24px;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 22px;border-radius:9999px;font-weight:500;font-size:14px;transition:.2s}
.btn-p{background:var(--m500);color:var(--n0)}
.btn-p:hover{background:var(--m600)}
.btn-o{border:1px solid var(--n4);background:var(--n1)}
.btn-o:hover{background:var(--n2)}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px}
.phone{justify-self:center;width:230px;height:300px;border-radius:30px;background:var(--n1);border:1px solid var(--n4);box-shadow:0 12px 30px rgba(0,0,0,.1);padding:16px;transform:rotate(3deg)}
.phone .ln{height:10px;border-radius:5px;background:var(--n3);margin-bottom:10px;background-image:linear-gradient(90deg,var(--n3) 0,var(--n2) 100px,var(--n3) 200px);background-size:400px 100%;animation:shimmer 2.2s linear infinite}
.phone .mini{border:1px solid var(--n3);border-radius:14px;padding:10px;margin-bottom:10px;display:flex;gap:8px;align-items:center;font-size:11px}
.phone .mini b{display:block;font-size:12px}
.phone .go{height:34px;border-radius:9999px;background:var(--m500);color:var(--n0);display:grid;place-items:center;font-size:12px;font-weight:600;animation:pulseDot 2s infinite;margin-top:14px}
/* filters */
.filters{margin:26px 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .sep{width:1px;height:22px;background:var(--n4);margin:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:9999px;border:1px solid var(--n4);background:var(--n1);font-size:13px;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--n6)}
.chip.on{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.chip svg{width:14px;height:14px}
.result-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.result-row h2{font-size:18px;font-weight:600}
.result-row span{color:var(--n7);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.job-card{background:var(--n1);border:1px solid var(--n3);border-radius:20px;overflow:hidden;transition:.25s;animation:fadeUp .5s both;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.job-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.thumb{aspect-ratio:16/8;background:var(--n2);position:relative;overflow:hidden}
.thumb svg.pat{position:absolute;inset:0;width:100%;height:100%}
.type-pill{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:5px;background:var(--n1);border-radius:9999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:600}
.type-pill .at{width:16px;height:16px;border-radius:50%;background:var(--n10);color:var(--n0);display:grid;place-items:center;font-size:10px;font-weight:700}
.save{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--n1);display:grid;place-items:center}
.save svg{width:16px;height:16px;color:var(--n8)}
.save.on svg{fill:var(--n10);color:var(--n10)}
.card-b{padding:16px 18px 18px}
.card-b h3{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.co{color:var(--n7);font-size:13px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{padding:3px 9px;border-radius:9999px;background:var(--n2);font-size:12px;color:var(--n8)}
.card-f{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.pay{font-weight:700;font-size:16px}
.pay small{font-weight:400;font-size:12px;color:var(--n7)}
.quick{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--m700);font-weight:600}
.quick svg{width:13px;height:13px}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--n7);border:1px dashed var(--n4);border-radius:20px}
/* panels */
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:22px}
.panel h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.panel h3{font-size:14px;font-weight:600}
.sub{color:var(--n7);font-size:13px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px;align-items:start}
.view-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}
.view-h h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.stepper{display:flex;align-items:center;margin:22px 0 4px}
.st{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--n6)}
.st .no{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--n4);display:grid;place-items:center;font-size:13px;background:var(--n1)}
.st.done{color:var(--n10)} .st.done .no{background:var(--n10);color:var(--n0);border-color:var(--n10)}
.st.cur{color:var(--n10)} .st.cur .no{background:var(--m500);color:var(--n0);border-color:var(--m500);animation:pulseDot 2s infinite}
.st-line{flex:1;height:2px;background:var(--n3);margin:0 12px;border-radius:1px}
.st-line.on{background:var(--n10)}
.field{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--n3)}
.field:last-child{border:0}
.field span{color:var(--n7)}
.field b{font-weight:600;text-align:right}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--n4);border-radius:16px;margin-top:10px;cursor:pointer}
.opt.on{border-color:var(--n10);background:var(--n2)}
.opt svg{width:20px;height:20px;color:var(--n8)}
.opt p{flex:1}
.opt p small{display:block;color:var(--n7)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--n4);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--n1);transition:.2s}
.sw.on{background:var(--n10)} .sw.on::after{left:19px}
.foot-r{display:flex;justify-content:space-between;margin-top:22px}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--n10);color:var(--n0);display:grid;place-items:center;margin:8px auto 14px;animation:popIn .5s both}
.okmark svg{width:30px;height:30px}
.ring{position:relative;width:76px;height:76px}
.ring svg{transform:rotate(-90deg)}
.ring circle.v{stroke-dasharray:176;animation:ringFill 1.1s ease both}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.sec{border-top:1px solid var(--n3);padding:18px 0}
.sec:first-of-type{border:0}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.in{height:40px;border:1px solid var(--n4);border-radius:12px;padding:0 12px;width:100%;background:var(--n1)}
.lab{font-size:12px;color:var(--n7);margin-bottom:4px;display:block}
.tl{position:relative;padding-left:26px;margin-top:16px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--n3)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:-26px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--n1);border:2px solid var(--n4)}
.tl-i.d::before{background:var(--n10);border-color:var(--n10)}
.tl-i.c::before{background:var(--m500);border-color:var(--m500);animation:pulseDot 2s infinite}
.tl-i b{display:block;font-weight:600}
.tl-i small{color:var(--n7)}
.app-i{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--n3);border-radius:16px;margin-top:10px;cursor:pointer;width:100%;text-align:left}
.app-i.on{border-color:var(--n10)}
.app-i .ic{width:40px;height:40px;border-radius:12px;background:var(--n2);display:grid;place-items:center;flex:none}
.app-i .ic svg{width:18px;height:18px;color:var(--n8)}
.app-i p{flex:1;min-width:0} .app-i p b{display:block;font-weight:600} .app-i p small{color:var(--n7)}
.st-b{padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n9)}
.st-b.ok{background:var(--s1-bg);color:var(--s1-text)}
.st-b.no{background:var(--s2-bg);color:var(--s2-text)}
.st-b.wait{background:var(--s3-bg);color:var(--s3-text)}
.noti{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--n3);cursor:pointer;width:100%;text-align:left}
.noti i,.noti svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--n7)}
.noti.un b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--m500);margin-left:6px}
.noti small{color:var(--n7);display:block}
.drop{border:1.5px dashed var(--n5);border-radius:20px;padding:30px;text-align:center;background:var(--n2);margin-top:14px}
.drop svg{margin:0 auto 8px;width:30px;height:30px;color:var(--n7)}
.vbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;border-radius:9999px;background:var(--n10);color:var(--n0);font-size:12px;font-weight:600}
.vbadge svg{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 22px;border-radius:9999px;font-size:14px;z-index:50;animation:fadeUp .3s both}
.foot{text-align:center;color:var(--n6);font-size:12px;padding:30px 0 40px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr;padding:30px}.hero h1{font-size:36px}.phone{display:none}.two{grid-template-columns:1fr}.search-bar{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.view-h h1{font-size:32px}.topbar-in{padding:10px 16px}.main{padding:16px}}
</style>
</head>
<body>
<div id="root" data-archetype="airbnb-search-grid">
<header class="topbar">
  <div class="topbar-in">
    <div class="logo"><span class="logo-mark">@</span><span>잡웨이</span></div>
    <label class="search-bar"><i data-lucide="search"></i><input type="search" id="q" placeholder="직무, 회사, 지역 검색" oninput="S.q=this.value;go('home',true)"></label>
    <div class="lang" id="lang"></div>
    <button class="avatar" onclick="go('status')" aria-label="알림">지<span id="bellN" class="badge-n" style="position:absolute;right:-6px;top:-6px"></span></button>
  </div>
  <nav class="nav-row" id="nav"></nav>
</header>
<main class="main" id="view"><div class="filters"><span class="chip" style="width:60px;height:32px;background:var(--n2);border-color:var(--n2)"></span><span class="chip" style="width:110px;height:32px;background:var(--n2);border-color:var(--n2)"></span><span class="chip" style="width:120px;height:32px;background:var(--n2);border-color:var(--n2)"></span><span class="chip" style="width:90px;height:32px;background:var(--n2);border-color:var(--n2)"></span><span class="chip" style="width:100px;height:32px;background:var(--n2);border-color:var(--n2)"></span></div><div class="grid"><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article><article class="card job-card"><div class="thumb"></div><div class="card-b"><div class="ln" style="height:14px;width:70%;border-radius:7px;background:var(--n2)"></div><div class="ln" style="height:12px;width:45%;border-radius:6px;background:var(--n2);margin-top:10px"></div></div></article></div></main>
<div class="foot">© 2026 잡웨이 샘플 — 자체 개발 데모 프로젝트</div>

 return `<div class="view-h"><div><h1>지원 현황·알림</h1><p class="sub">지원 건별 진행 상태와 알림 수신 채널을 관리합니다.</p></div></div>
 <div class="two" style="grid-template-columns:1fr 1fr 320px"><div class="panel"><h2>지원 내역 <span class="num" style="color:var(--n7);font-weight:400">${S.apps.length}</span></h2>${S.apps.map((x,i)=>`<button class="app-i ${i===S.sel?'on':''}" onclick="S.sel=${i};render()"><span class="ic"><i data-lucide="building-2"></i></span><p><b>${x.job}</b><small>${x.co} · ${x.at}</small></p><span class="st-b ${x.cls}">${x.st}</span></button>`).join('')}</div>
 <div class="panel"><h2>진행 타임라인</h2><p class="sub">${a.job}</p><div class="tl">${STEPS.map((n,i)=>`<div class="tl-i ${i<a.step?'d':i===a.step?'c':''}"><b>${i===3&&a.st==='합격'?'합격':n}</b><small>${i<=a.step?(i===a.step?'현재 단계':'완료 · '+a.at):'대기'}</small></div>`).join('')}</div></div>
 <div class="panel"><h2>알림 센터</h2><div style="margin-top:6px">${S.noti.map((n,i)=>`<button class="noti ${n.un?'un':''}" onclick="S.noti[${i}].un=0;S.sel=Math.min(${i},S.apps.length-1);render()"><i data-lucide="${n.i}"></i><span><b>${n.t}</b><small>${n.s}</small></span></button>`).join('')}</div>
 <h3 style="margin-top:18px">수신 채널</h3><button class="opt ${S.ch.push?'on':''}" style="width:100%;text-align:left;padding:10px 12px" onclick="S.ch.push=!S.ch.push;render()"><p>앱 푸시</p><span class="sw ${S.ch.push?'on':''}"></span></button><button class="opt ${S.ch.wa?'on':''}" style="width:100%;text-align:left;padding:10px 12px" onclick="S.ch.wa=!S.ch.wa;render()"><p>WhatsApp</p><span class="sw ${S.ch.wa?'on':''}"></span></button></div></div>`;
}
function verified(){
 const st=['신분증 업로드','관리자 검토','Verified 표시'];
 return `<div class="view-h"><div><h1>신원확인</h1><p class="sub">신원만 확인하며 학력·경력은 확인하지 않습니다.</p></div><span class="vbadge"><i data-lucide="shield-check"></i>Verified</span></div>
 <div class="two"><div class="panel"><div class="stepper" style="margin-top:0">${st.map((n,i)=>`${i?`<div class="st-line ${S.vstep>=i?'on':''}"></div>`:''}<div class="st ${S.vstep>i||S.vstep===2?'done':S.vstep===i?'cur':''}"><span class="no">${S.vstep>i||S.vstep===2?'✓':i+1}</span>${n}</div>`).join('')}</div>
 ${S.vstep===0?`<div class="drop"><i data-lucide="id-card"></i><b>신분증 앞면을 선택하세요</b><p class="sub">JPG·PNG, 암호화되어 저장됩니다</p><button class="btn btn-o btn-sm" style="margin-top:12px" onclick="S.vstep=1;render();toast('신분증이 업로드되었습니다')">파일 선택</button></div>`:S.vstep===1?`<div class="drop"><i data-lucide="hourglass"></i><b>관리자가 서류를 검토하고 있습니다</b><p class="sub">승인되면 알림으로 안내합니다</p><button class="btn btn-p btn-sm" style="margin-top:12px" onclick="S.vstep=2;render()">관리자 승인 시연</button></div>`:`<div style="text-align:center;padding:26px"><div class="okmark"><i data-lucide="shield-check"></i></div><h2>신원확인이 승인되었습니다</h2><p class="sub">프로필과 지원서에 Verified 뱃지가 표시됩니다.</p><button class="btn btn-o btn-sm" style="margin-top:12px" onclick="S.vstep=0;render()">처음으로</button></div>`}</div>
 <aside class="panel"><h3>개인정보 보관 정책</h3><div class="field"><span>저장 방식</span><b>암호화 저장</b></div><div class="field"><span>접근 권한</span><b>관리자 한정</b></div><div class="field"><span>원본 삭제</span><b>승인 후 설정 기간</b></div><p class="sub" style="margin-top:10px">보관·삭제 기간은 법률 검토 결과에 맞춰 조정하도록 설계합니다.</p></aside></div>`;
}
function render(){
 renderChrome();
 const f={home,apply,profile,status,verified}[S.v];
 const v=$('#view');v.innerHTML='<div class="view">'+f()+'</div>';
 if(window.lucide)lucide.createIcons();
 window.scrollTo({top:0});
}
render();
</script>
