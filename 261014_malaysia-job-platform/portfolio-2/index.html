<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기업·관리자 채용 관리 플랫폼 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 155°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m700 = plan primary */
  --m50:#eef8f4;
  --m100:#eef8f4;
  --m200:#ddf1e9;
  --m300:#bce4d3;
  --m400:#93d3b9;
  --m500:#65c09b;
  --m600:#3aaf7f;
  --m700:#0f9d63;
  --m800:#0c8151;
  --m900:#0a643f;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f7f5f3;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e6e6;
  --n4:#d5d7d6;
  --n5:#b5bab8;
  --n6:#909895;
  --n7:#6e6a69;
  --n8:#535a57;
  --n9:#363a39;
  --n10:#0d0d0d;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ s1(성공/진행/정상/상승) — 메인 hue 155°와 10° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */
/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.num{font-variant-numeric:tabular-nums}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drawLine{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.view{animation:fadeUp .4s ease both}
header.topnav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--n0) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3)}
.tn-in{max-width:1320px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--n10);color:var(--n0);display:grid;place-items:center;font-size:17px}
.menu{display:flex;gap:4px;background:var(--n1);border:1px solid var(--n3);border-radius:9999px;padding:4px;overflow-x:auto}
.mi{padding:8px 16px;border-radius:9999px;font-weight:500;color:var(--n7);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.2s}
.mi:hover{color:var(--n10)}
.mi.on{background:var(--n10);color:var(--n0)}
.mi .cnt{background:var(--m700);color:var(--n1);border-radius:9px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--n7);font-size:13px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--n3);display:grid;place-items:center;font-weight:600;color:var(--n9)}
.wrap{max-width:1320px;margin:0 auto;padding:32px}
.ph-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}
.ph-h h1{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.035em}
.ph-h p{color:var(--n7);margin-top:8px}
.tabs{display:flex;gap:4px;background:var(--n2);border-radius:9999px;padding:4px}
.tab{padding:7px 16px;border-radius:9999px;font-weight:500;color:var(--n7);font-size:13px}
.tab.on{background:var(--n1);color:var(--n10);box-shadow:0 0 0 1px var(--n3)}
.card{background:var(--n1);border-radius:16px;border:1px solid var(--n3);padding:24px}
.card h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card .sub{color:var(--n7);font-size:13px;margin-top:2px}
.board{display:grid;grid-template-columns:1fr 360px;gap:20px}
.kcol{display:flex;flex-direction:column;gap:14px}
.stat-card{background:var(--n1);border:1px solid var(--n3);border-radius:16px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.stat-card small{color:var(--n7);display:block}
.stat-card b{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15;display:block}
.stat-card .ico{width:44px;height:44px;border-radius:50%;background:var(--n2);display:grid;place-items:center;font-size:20px;color:var(--n8)}
.pend{border-radius:16px;background:var(--n10);color:var(--n0);padding:20px 22px}
.pend h2{font-size:15px;font-weight:600;color:var(--n0)}
.pend-i{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--n9);width:100%;text-align:left}
.pend-i:last-child{border:0}
.pend-i span{color:var(--n5);font-size:13px}
.pend-i b{font-size:15px}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--m400);margin-right:6px;animation:blink 1.6s infinite}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.bars{display:flex;align-items:flex-end;gap:12px;height:140px;margin-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;font-size:12px;color:var(--n7)}
.bars i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--n3);transform-origin:bottom;animation:barGrow .7s ease both}
.bars i.hi{background:var(--m700)}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px;font-size:13px}
.legend p{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.legend b{margin-left:auto;font-weight:600}
.tline{margin-top:14px}
.tline p{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--n3);font-size:13px}
.tline p:last-child{border:0}
.tline time{color:var(--n6);width:44px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 20px;border-radius:9999px;font-weight:500;transition:.2s}
.btn-p{background:var(--m700);color:var(--n1)}
.btn-p:hover{background:var(--m800)}
.btn-d{background:var(--n10);color:var(--n0)}
.btn-o{border:1px solid var(--n4);background:var(--n1)}
.btn-o:hover{background:var(--n2)}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--n7);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--n3)}
td{padding:14px 12px;border-bottom:1px solid var(--n3);vertical-align:middle}
tr:last-child td{border:0}
tr.sel td{background:var(--n0)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:9999px;font-size:12px;font-weight:600;background:var(--n2);color:var(--n9)}
.pill.dk{background:var(--n10);color:var(--n0)}
.pill.warn{background:var(--s3-bg);color:var(--s3-text)}
.pill.bad{background:var(--s2-bg);color:var(--s2-text)}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.cb{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--n5);display:inline-grid;place-items:center;background:var(--n1);vertical-align:middle}
.cb.on{background:var(--n10);border-color:var(--n10);color:var(--n0);font-size:12px}
.bulk{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding:12px 16px;border-radius:12px;background:var(--n0);border:1px solid var(--n3)}
.bulk select,.in{height:38px;border:1px solid var(--n4);border-radius:12px;padding:0 12px;background:var(--n1)}
.prod{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.pr{border:1.5px solid var(--n3);border-radius:16px;padding:20px;text-align:left;background:var(--n1);transition:.2s}
.pr:hover{border-color:var(--n6)}
.pr.on{border-color:var(--n10);background:var(--n0)}
.pr i{font-size:24px;color:var(--n8)}
.pr b{display:block;font-size:26px;margin-top:10px;letter-spacing:-.02em}
.pr small{color:var(--n7)}
.pr ul{list-style:none;margin-top:10px;font-size:13px;color:var(--n8)}
.pr li{padding:2px 0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--n7)}
.field .in,.field textarea{width:100%}
textarea.in{height:90px;padding:10px 12px;resize:none}
.q-i{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--n3)}
.q-i:last-child{border:0}
.q-i .ph-ic{width:44px;height:44px;border-radius:12px;background:var(--n2);display:grid;place-items:center;font-size:20px;color:var(--n8);flex:none}
.q-i p{flex:1} .q-i p b{display:block;font-weight:600} .q-i p small{color:var(--n7)}
.doc{aspect-ratio:3/2;border-radius:12px;background:repeating-linear-gradient(135deg,var(--n2) 0 10px,var(--n3) 10px 11px);display:grid;place-items:center;color:var(--n7);font-size:13px;margin:10px 0}
.meter{height:8px;border-radius:4px;background:var(--n3);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--m700);border-radius:4px;animation:barGrow .8s ease both;transform-origin:left}
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--n10) 45%,transparent);display:grid;place-items:center;z-index:40}
.modal{background:var(--n1);border-radius:20px;padding:28px;width:440px;max-width:92vw;animation:sheetIn .3s both}
.modal h2{font-size:20px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--n10);color:var(--n0);padding:12px 22px;border-radius:9999px;z-index:60;animation:fadeUp .3s both}
.foot{text-align:center;color:var(--n6);font-size:12px;padding:20px 0 40px}
@media(max-width:1000px){.board,.two,.wg{grid-template-columns:1fr}.prod{grid-template-columns:1fr}.tn-in{flex-wrap:wrap;gap:12px;padding:12px 16px}.wrap{padding:18px 16px}.ph-h h1{font-size:34px}.who{display:none}}
</style>
</head>
<body>
<div id="root" data-archetype="topbar-analytics">
<header class="topnav">
  <div class="tn-in">
    <div class="brand"><span class="brand-mark"><i class="ph ph-briefcase"></i></span>잡웨이 비즈</div>
    <nav class="menu" id="menu"></nav>
    <div class="who"><span>샘플 리테일 · 채용 담당</span><span class="av">김</span></div>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="foot">© 2026 잡웨이 샘플 — 자체 개발 데모 프로젝트</div>
</div>
<script>
const MENU=[['dash','채용 현황 대시보드','ph-chart-line-up'],['jobs','공고·지원자 관리','ph-clipboard-text'],['billing','공고 상품 결제·헤드헌팅 의뢰','ph-credit-card'],['review','인증·신고 승인','ph-seal-check'],['i18n','번역 문구 관리','ph-translate']];
const SERIES={7:[18,26,22,34,30,41,38],30:[22,28,31,27,35,40,38,44,41,52,48,55,50,58,61,57,66,63,70,68,74,71,79,76,83,80,88,85,92,96],90:[30,38,45,52,50,61,70,66,78,85,82,95,104,99,112]};
const LAB={7:'지난 7일',30:'지난 30일',90:'지난 90일'};
const S={v:'dash',per:30,sel:{},jobTab:'open',prod:1,pay:null,paid:[{d:'10.08',n:'상단 노출 14일',a:'RM 480',s:'결제 완료'},{d:'09.24',n:'상단 노출 7일',a:'RM 280',s:'결제 완료'}],hh:{done:false},
 q:[{id:1,k:'biz',t:'Bina Teguh Sdn Bhd',s:'기업 인증 · 사업자 서류 3건'},{id:2,k:'biz',t:'Kopi Tiga Lorong',s:'기업 인증 · 사업자 서류 2건'},{id:3,k:'id',t:'아이샤 빈티 라만',s:'신원확인 · 신분증 앞면'},{id:4,k:'id',t:'탄 웨이 밍',s:'신원확인 · 신분증 앞면'},{id:5,k:'rep',t:'허위 급여 표기 신고',s:'공고 신고 · 고객지원 팀원'}],qt:'biz',
 apps:[{id:1,n:'아이샤 빈티 라만',r:'고객지원',st:'접수',ver:1},{id:2,n:'탄 웨이 밍',r:'매장 운영',st:'접수',ver:1},{id:3,n:'라지브 쿠마르',r:'물류 스태프',st:'열람',ver:0},{id:4,n:'누르 하피자',r:'바리스타',st:'면접',ver:1},{id:5,n:'리 메이링',r:'회계 어시스턴트',st:'접수',ver:0}],bulk:'열람',
 tr:[['login.title','로그인','Log in','Log masuk','登录'],['job.apply','간편지원','Quick apply','Mohon pantas','快速申请'],['job.type.fields','현장직','Fields','Lapangan','现场'],['noti.status','지원 상태가 변경되었습니다','Your application status changed','Status permohonan berubah','申请状态已更新']],lg:'ms'};
const $=s=>document.querySelector(s);
function toast(m){const o=$('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function go(v){S.v=v;render()}
function menu(){const n=S.q.length;$('#menu').innerHTML=MENU.map(([k,t,ic])=>`<button class="mi ${S.v===k?'on':''}" onclick="go('${k}')"><i class="ph ${ic}"></i>${t}${k==='review'&&n?`<span class="cnt">${n}</span>`:''}</button>`).join('')}
function chart(){
 const d=SERIES[S.per],w=720,h=240,mx=Math.max(...d)*1.15,p=i=>[i*(w/(d.length-1)),h-d[i]/mx*h];
 const pts=d.map((_,i)=>p(i).join(',')).join(' L');const area=`M0,${h} L${pts} L${w},${h} Z`;
 const base=d.map((v,i)=>[i*(w/(d.length-1)),h-(v*.55)/mx*h].join(',')).join(' L');
 return `<svg viewBox="0 0 ${w} ${h+10}" width="100%" style="margin-top:14px;overflow:visible"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--m700)" stop-opacity=".22"/><stop offset="1" stop-color="var(--m700)" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="0" x2="${w}" y1="${i*h/3}" y2="${i*h/3}" stroke="var(--n3)" stroke-dasharray="3 5"/>`).join('')}<path d="${area}" fill="url(#ag)" style="animation:areaIn 1s both"/><path d="M${base}" fill="none" stroke="var(--n5)" stroke-width="2" stroke-dasharray="1200" style="animation:drawLine 1.6s ease both"/><path d="M${pts}" fill="none" stroke="var(--m700)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1200" style="animation:drawLine 1.6s ease both"/><circle cx="${p(d.length-1)[0]}" cy="${p(d.length-1)[1]}" r="6" fill="var(--n1)" stroke="var(--m700)" stroke-width="3"/></svg>`;
}
function dash(){
 const tot=SERIES[S.per].reduce((a,b)=>a+b,0);
 const seg=[['모집 중',46,'var(--n10)'],['심사 중',24,'var(--m700)'],['마감',22,'var(--n5)'],['숨김',8,'var(--n3)']];let off=0;
 const R=48,C=2*Math.PI*R;
 return `<div class="ph-h"><div><h1>채용 현황</h1><p>플랫폼 전체의 가입·공고·지원 흐름을 기간별로 확인합니다.</p></div><div class="tabs" role="tablist">${[7,30,90].map(p=>`<button class="tab ${S.per===p?'on':''}" role="tab" onclick="S.per=${p};render()">${LAB[p]}</button>`).join('')}</div></div>
 <div class="board"><section class="card"><div style="display:flex;justify-content:space-between"><div><h2>지원 추이</h2><p class="sub">${LAB[S.per]} · 일별 지원 접수</p></div><div style="text-align:right"><b class="num" style="font-size:34px;letter-spacing:-.03em">${tot.toLocaleString()}</b><p class="sub">누적 지원 건</p></div></div>${chart()}<div class="legend" style="flex-direction:row;gap:20px;margin-top:10px"><p><i style="background:var(--m700)"></i>지원 접수</p><p><i style="background:var(--n5)"></i>공고 조회 대비 기준선</p></div></section>
 <div class="kcol"><div class="stat-card"><div><small>가입자</small><b class="num">${(S.per*41).toLocaleString()}</b></div><span class="ico"><i class="ph ph-users"></i></span></div><div class="stat-card"><div><small>게시 중 공고</small><b class="num">${(S.per*3+120)}</b></div><span class="ico"><i class="ph ph-megaphone"></i></span></div><div class="stat-card"><div><small>이번 기간 지원 수</small><b class="num">${tot}</b></div><span class="ico"><i class="ph ph-paper-plane-tilt"></i></span></div>
 <div class="pend"><h2><span class="dot-live"></span>승인 대기</h2><button class="pend-i" onclick="S.qt='biz';go('review')"><span>기업 인증</span><b class="num">${S.q.filter(x=>x.k==='biz').length}건</b></button><button class="pend-i" onclick="S.qt='id';go('review')"><span>신원확인</span><b class="num">${S.q.filter(x=>x.k==='id').length}건</b></button><button class="pend-i" onclick="S.qt='rep';go('review')"><span>신고</span><b class="num">${S.q.filter(x=>x.k==='rep').length}건</b></button></div></div></div>
 <div class="wg"><section class="card"><h2>공고 상태 분포</h2><div style="display:flex;gap:18px;align-items:center;margin-top:10px"><svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);flex:none">${seg.map(([n,v,c])=>{const l=v/100*C;const e=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return e}).join('')}</svg><div class="legend" style="flex:1">${seg.map(([n,v,c])=>`<p><i style="background:${c}"></i>${n}<b class="num">${v}%</b></p>`).join('')}</div></div></section>
 <section class="card"><h2>지역별 공고 수</h2><div class="bars">${[['KL',92],['Sel',78],['Pen',46],['JB',38],['기타',20]].map(([n,v],i)=>`<div><i class="${i===0?'hi':''}" style="height:${v}%;animation-delay:${i*90}ms"></i>${n}</div>`).join('')}</div></section>
 <section class="card"><h2>최근 활동</h2><div class="tline">${[['09:42','기업 인증 서류가 접수되었습니다'],['09:15','헤드헌팅 의뢰가 접수되었습니다'],['08:50','신고된 공고가 숨김 처리되었습니다'],['08:21','상단 노출 상품 결제가 승인되었습니다']].map(([t,x])=>`<p><time class="num">${t}</time>${x}</p>`).join('')}</div></section></div>`;
}
function jobs(){
 const sel=Object.keys(S.sel).filter(k=>S.sel[k]).length;
 const J=[['고객지원 팀원 (영어·중국어)','게시 중','open',31],['매장 운영 어시스턴트','게시 중','open',18],['카페 바리스타 (주말)','게시 중','open',24],['회계·경리 어시스턴트','마감','closed',42]];
 const vis=J.filter(j=>j[2]===S.jobTab);
 return `<div class="ph-h"><div><h1>공고·지원자 관리</h1><p>공고 상태를 바꾸고 지원자를 한 번에 선별합니다.</p></div><button class="btn btn-p" onclick="toast('인증이 승인된 기업만 게시할 수 있습니다')"><i class="ph ph-plus"></i>공고 등록</button></div>
 <div class="two"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>공고 목록</h2><div class="tabs" role="tablist"><button class="tab ${S.jobTab==='open'?'on':''}" role="tab" onclick="S.jobTab='open';render()">게시 중</button><button class="tab ${S.jobTab==='closed'?'on':''}" role="tab" onclick="S.jobTab='closed';render()">마감</button><button class="tab" role="tab" onclick="toast('작성 중인 공고가 없습니다')">작성 중</button></div></div>
 <table><thead><tr><th>공고</th><th>상태</th><th>지원자</th><th></th></tr></thead><tbody>${vis.map((j,i)=>`<tr><td><b>${j[0]}</b></td><td><span class="pill ${j[2]==='open'?'dk':''}">${j[1]}</span></td><td class="num">${j[3]}명</td><td style="text-align:right">${j[2]==='open'?`<button class="btn btn-o btn-sm" onclick="toast('마감 처리하면 검색에서 제외됩니다')">마감</button>`:`<button class="btn btn-o btn-sm" onclick="toast('공고를 다시 게시합니다')">재게시</button>`}</td></tr>`).join('')}</tbody></table></section>
 <section class="card"><h2>지원자 · 고객지원 팀원</h2><p class="sub">여러 명을 골라 상태를 한 번에 변경합니다. 전부 적용되거나 전부 취소됩니다.</p>
 <div class="bulk" style="margin-top:14px"><span class="num"><b>${sel}</b>명 선택</span><select onchange="S.bulk=this.value">${['열람','면접','합격','불합격'].map(s=>`<option ${S.bulk===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-d btn-sm" ${sel?'':'disabled'} onclick="bulkApply()">상태 변경</button></div>
 <table><tbody>${S.apps.map(a=>`<tr class="${S.sel[a.id]?'sel':''}"><td style="width:30px"><button class="cb ${S.sel[a.id]?'on':''}" onclick="S.sel[${a.id}]=!S.sel[${a.id}];render()" aria-label="선택">${S.sel[a.id]?'✓':''}</button></td><td><b>${a.n}</b> ${a.ver?'<span class="pill dk"><i class="ph ph-seal-check"></i>Verified</span>':''}<br><small style="color:var(--n7)">${a.r}</small></td><td><span class="pill ${a.st==='불합격'?'bad':a.st==='합격'?'dk':''}">${a.st}</span></td><td style="text-align:right"><button class="btn btn-o btn-sm" onclick="toast('${a.n}님에게 연락 메시지를 보냅니다')">연락</button></td></tr>`).join('')}</tbody></table></section></div>`;
}
function bulkApply(){S.apps.forEach(a=>{if(S.sel[a.id])a.st=S.bulk});const n=Object.keys(S.sel).filter(k=>S.sel[k]).length;S.sel={};render();toast(n+'명의 상태를 '+S.bulk+'(으)로 변경했습니다')}
function billing(){
 const P=[['상단 노출 7일','RM 280','ph-arrow-fat-line-up',['검색 결과 상단 고정','Fields·Office 모두 적용']],['상단 노출 14일','RM 480','ph-rocket-launch',['검색 결과 상단 고정','긴급 뱃지 포함']],['긴급 채용 뱃지','RM 90','ph-lightning',['카드에 뱃지 표시','7일 적용']]];
 return `<div class="ph-h"><div><h1>공고 상품 결제·헤드헌팅 의뢰</h1><p>단건 상품으로 시작하고 월 정액 상품을 추가할 수 있는 구조로 설계합니다.</p></div></div>
 <div class="two"><section class="card"><h2>유료 공고 상품</h2><div class="prod">${P.map((p,i)=>`<button class="pr ${S.prod===i?'on':''}" onclick="S.prod=${i};render()"><i class="ph ${p[2]}"></i><b class="num">${p[1]}</b><small>${p[0]}</small><ul>${p[3].map(x=>`<li>· ${x}</li>`).join('')}</ul></button>`).join('')}</div><div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn btn-p" onclick="S.pay=${'S.prod'};render()"><i class="ph ph-credit-card"></i>${P[S.prod][0]} 결제하기</button></div>
 <h2 style="margin-top:26px">결제 내역</h2><table><thead><tr><th>일자</th><th>상품</th><th>금액</th><th>상태</th></tr></thead><tbody>${S.paid.map(r=>`<tr><td class="num">${r.d}</td><td>${r.n}</td><td class="num">${r.a}</td><td><span class="pill dk"><i class="ph ph-check"></i>${r.s}</span></td></tr>`).join('')}</tbody></table></section>
 <section class="card"><h2>헤드헌팅 의뢰</h2><p class="sub">직접 채용이 어려운 경우 제휴 헤드헌팅사에 상담을 요청합니다.</p>${S.hh.done?`<div style="text-align:center;padding:36px 0"><i class="ph ph-handshake" style="font-size:44px;color:var(--n8)"></i><h2 style="margin-top:10px">의뢰가 접수되었습니다</h2><p class="sub">관리자 화면의 의뢰 목록에 표시되며 제휴사로 전달됩니다.</p><button class="btn btn-o btn-sm" style="margin-top:14px" onclick="S.hh.done=false;render()">새 의뢰</button></div>`:`<div style="margin-top:16px"><div class="field"><label>채용 직무</label><input class="in" value="물류 매니저"></div><div class="field"><label>희망 연봉 범위</label><input class="in" value="RM 5,000 ~ 6,500"></div><div class="field"><label>요청 사항</label><textarea class="in">경력 3년 이상, 영어·말레이어 가능자</textarea></div><button class="btn btn-d" style="width:100%;justify-content:center" onclick="S.hh.done=true;render();toast('헤드헌팅 의뢰를 접수했습니다')">상담 요청 보내기</button></div>`}</section></div>
 ${S.pay!==null?`<div class="modal-bg" onclick="S.pay=null;render()"><div class="modal" onclick="event.stopPropagation()"><h2>결제 확인</h2><p class="sub">iPay88 결제창으로 이동하는 흐름을 시연합니다.</p><div style="margin:18px 0"><div class="q-i"><p><b>${P[S.pay][0]}</b><small>결제 요청과 웹훅 결과를 분리해 저장합니다</small></p><b class="num">${P[S.pay][1]}</b></div></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-o" onclick="S.pay=null;render()">취소</button><button class="btn btn-p" onclick="S.paid.unshift({d:'오늘',n:'${P[S.pay][0]}',a:'${P[S.pay][1]}',s:'결제 완료'});S.pay=null;render();toast('결제가 승인되었습니다')">결제 진행</button></div></div></div>`:''}`;
}
function review(){
 const T=[['biz','기업 인증','ph-buildings'],['id','신원확인','ph-identification-card'],['rep','신고','ph-flag']];
 const list=S.q.filter(x=>x.k===S.qt);
 return `<div class="ph-h"><div><h1>인증·신고 승인</h1><p>서류를 확인하고 승인하거나 반려합니다. 승인 결과는 뱃지와 알림으로 이어집니다.</p></div><div class="tabs" role="tablist">${T.map(([k,n])=>`<button class="tab ${S.qt===k?'on':''}" role="tab" onclick="S.qt='${k}';render()">${n} <span class="num">${S.q.filter(x=>x.k===k).length}</span></button>`).join('')}</div></div>
 <div class="two"><section class="card"><h2>대기 목록</h2>${list.length?list.map(x=>`<div class="q-i"><span class="ph-ic"><i class="ph ${T.find(t=>t[0]===x.k)[2]}"></i></span><p><b>${x.t}</b><small>${x.s}</small></p>${x.k==='rep'?`<button class="btn btn-d btn-sm" onclick="decide(${x.id},'숨김 처리')">게시물 숨김</button><button class="btn btn-o btn-sm" onclick="decide(${x.id},'기각')">기각</button>`:`<button class="btn btn-p btn-sm" onclick="decide(${x.id},'승인')">승인</button><button class="btn btn-o btn-sm" onclick="decide(${x.id},'반려')">반려</button>`}</div>`).join(''):`<div style="text-align:center;padding:50px;color:var(--n7)"><i class="ph ph-check-circle" style="font-size:36px"></i><p style="margin-top:8px">대기 중인 건이 없습니다</p></div>`}</section>
 <section class="card"><h2>서류 미리보기</h2><p class="sub">원본은 암호화 저장되며 관리자 권한으로만 열람합니다.</p><div class="doc">${S.qt==='rep'?'신고 내용 캡처':'제출 서류 미리보기 영역'}</div><div class="field"><label>처리 메모</label><textarea class="in" placeholder="반려 사유 등을 남깁니다"></textarea></div><p class="sub">모든 처리는 이력과 감사 로그에 기록되도록 설계합니다.</p></section></div>`;
}
function decide(id,r){S.q=S.q.filter(x=>x.id!==id);render();toast('처리했습니다: '+r)}
function i18n(){
 const idx={ko:1,en:2,ms:3,zh:4};const L=[['ko','한국어',100],['en','English',100],['ms','Bahasa Melayu',92],['zh','简体中文',88]];
 return `<div class="ph-h"><div><h1>번역 문구 관리</h1><p>저장한 문구는 앱을 다시 빌드하지 않고 화면에 반영됩니다.</p></div><div class="tabs" role="tablist">${L.map(([k,n])=>`<button class="tab ${S.lg===k?'on':''}" role="tab" onclick="S.lg='${k}';render()">${n}</button>`).join('')}</div></div>
 <div class="two" style="grid-template-columns:1fr 320px"><section class="card"><h2>문구 편집 · ${L.find(l=>l[0]===S.lg)[1]}</h2><table style="margin-top:8px"><thead><tr><th>키</th><th>한국어 기준</th><th>번역</th></tr></thead><tbody>${S.tr.map((r,i)=>`<tr><td><code style="font-size:12px;color:var(--n7)">${r[0]}</code></td><td>${r[1]}</td><td><input class="in" style="width:100%" value="${r[idx[S.lg]]}" oninput="S.tr[${i}][${idx[S.lg]}]=this.value"></td></tr>`).join('')}</tbody></table><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-p" onclick="toast('번역 문구를 저장했습니다 · 앱에 즉시 반영됩니다')">저장 후 배포</button></div></section>
 <section class="card"><h2>언어별 입력 현황</h2>${L.map(([k,n,v])=>`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between"><span>${n}</span><b class="num">${v}%</b></div><div class="meter"><i style="width:${v}%"></i></div></div>`).join('')}<p class="sub" style="margin-top:16px">번역할 문구 목록은 엑셀로 내려받아 클라이언트가 채우는 흐름을 지원합니다.</p><button class="btn btn-o btn-sm" style="margin-top:10px" onclick="toast('문구 목록 엑셀을 내려받습니다')"><i class="ph ph-download-simple"></i>엑셀 내려받기</button></section></div>`;
}
function render(){menu();$('#view').innerHTML='<div class="view">'+({dash,jobs,billing,review,i18n}[S.v])()+'</div>';window.scrollTo({top:0})}
render();
</script>
</body>
</html>
