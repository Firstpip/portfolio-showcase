<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 매장 쇼윈도 모바일 웹 — 맞춤 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 67°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m600 = plan primary */
  --m50:#fcfdf0;
  --m100:#f9fce0;
  --m200:#f2f9c1;
  --m300:#ebf59c;
  --m400:#e2f072;
  --m500:#daec4b;
  --m600:#d2e823;
  --m700:#acbe1d;
  --m800:#869416;
  --m900:#5e6810;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f3f3f1;
  --n1:#ffffff;
  --n2:#f0f0ef;
  --n3:#e6e6e5;
  --n4:#d7d7d5;
  --n5:#babab5;
  --n6:#979890;
  --n7:#797a71;
  --n8:#676b5f;
  --n9:#3a3a36;
  --n10:#000000;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{filter:brightness(.94);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--n0);color:var(--n10);font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{text-decoration:none;color:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
i.ph,i.ph-bold,i.ph-fill{line-height:1;flex-shrink:0}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:30;background:var(--n0);display:flex;align-items:center;gap:20px;height:72px;padding:0 32px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.04em}
.brand-mark{width:40px;height:40px;border-radius:14px;background:var(--m600);border:2px solid var(--n10);display:flex;align-items:center;justify-content:center}
.dong{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:2px solid var(--n10);border-radius:100px;background:var(--n1);font-weight:700;font-size:14px}
.dong:hover{background:var(--n2)}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;height:44px;border:2px solid var(--n10);border-radius:100px;background:var(--n1);padding:0 18px 0 44px;font-size:14px;outline:none}
.search input:focus{box-shadow:0 0 0 3px var(--m300)}
.search>i{position:absolute;left:16px;top:13px;font-size:18px;color:var(--n8)}
.mode{display:flex;border:2px solid var(--n10);border-radius:100px;background:var(--n1);padding:3px;margin-left:auto}
.mode button{height:34px;padding:0 16px;border-radius:100px;font-size:13px;font-weight:700;color:var(--n8)}
.mode button.on{background:var(--n10);color:var(--n1)}
.me{width:44px;height:44px;border-radius:50%;border:2px solid var(--n10);background:var(--n2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tabs{position:sticky;top:72px;z-index:29;background:var(--n0);display:flex;gap:10px;padding:0 32px 14px;border-bottom:2px solid var(--n10);overflow:auto}
.tabs button{display:flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:100px;border:2px solid var(--n10);background:var(--n1);font-size:14px;font-weight:700;white-space:nowrap;transition:transform .15s}
.tabs button:hover{transform:scale(1.03)}
.tabs button.on{background:var(--m600)}

/* 본문 */
.layout{display:flex;justify-content:center;gap:32px;padding:32px;width:100%;flex:1;align-items:flex-start}
.feed{width:100%;max-width:600px;display:flex;flex-direction:column;gap:20px}
.rail{width:320px;display:flex;flex-direction:column;gap:20px;position:sticky;top:176px}
.view{animation:fadeUp .35s ease both}
.card{background:var(--n1);border:2px solid var(--n10);border-radius:24px;padding:24px}
.card h3{font-size:18px;font-weight:800;letter-spacing:-.03em}
.eyebrow{font-size:12px;font-weight:700;color:var(--n8);letter-spacing:.02em}
.display{font-size:44px;line-height:1.08;font-weight:800;letter-spacing:-.045em}
.sub{font-size:14px;color:var(--n8)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:100px;border:2px solid var(--n10);background:var(--n1);font-size:14px;font-weight:700;transition:transform .15s}
.btn:hover{transform:scale(1.03)}
.btn.primary{background:var(--m600)}
.btn.dark{background:var(--n10);color:var(--n1)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}

.filterbar{position:sticky;top:130px;z-index:20;background:var(--n0);padding:6px 0 10px;display:flex;flex-direction:column;gap:10px}
.fb-row{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:2px solid var(--n10);border-radius:100px;background:var(--n1);padding:3px;margin-left:auto}
.seg button{height:30px;padding:0 14px;border-radius:100px;font-size:13px;font-weight:700;color:var(--n8);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--n10);color:var(--n1)}
.chips{display:flex;gap:8px;overflow:auto}
.chip{height:34px;padding:0 14px;border-radius:100px;border:2px solid var(--n10);background:var(--n1);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--m600)}
.addr{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}

/* 포스트 */
.post{background:var(--n1);border:2px solid var(--n10);border-radius:24px;overflow:hidden;transition:transform .2s}
.post:hover{transform:scale(1.01)}
.post-head{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.avatar{width:44px;height:44px;border-radius:16px;background:var(--n2);border:2px solid var(--n10);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--n9)}
.who{flex:1;min-width:0;text-align:left}
.author{font-weight:800;font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.meta{font-size:12px;color:var(--n8)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:100px;background:var(--n2);border:1.5px solid var(--n10);font-size:11px;font-weight:700}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--n10)}
.pill.open .dot{background:var(--s1);animation:pulse 1.6s infinite}
.post-body{padding:14px 20px 0;font-size:15px;line-height:1.6}
.tile{margin:14px 20px 0;height:170px;border-radius:18px;background:var(--n2);border:2px solid var(--n10);display:flex;align-items:flex-end;justify-content:space-between;padding:18px;position:relative;overflow:hidden}
.tile .big{font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1}
.tile .tg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tile .ic{position:absolute;top:16px;left:18px;font-size:30px;color:var(--n9)}
.tile .ring{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:2px solid var(--n10);opacity:.25}
.post-actions{display:flex;align-items:center;gap:6px;padding:12px 14px 14px}
.act{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:100px;font-size:13px;font-weight:700;color:var(--n8)}
.act:hover{background:var(--n2)}
.act.like.on{color:var(--n10);background:var(--m600)}
.act.like.on i{animation:pop .35s}
.act.save{margin-left:auto}
.act.save.on{background:var(--n10);color:var(--n1)}

/* 지도 */
.map{position:relative;height:470px;border-radius:24px;border:2px solid var(--n10);background:var(--n1);overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pin b{background:var(--n1);border:2px solid var(--n10);border-radius:100px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pin i{font-size:30px;color:var(--n10)}
.pin.sel b{background:var(--m600)}
.pin.closed i{color:var(--n5)}

/* 리스트 */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1.5px solid var(--n3);text-align:left;width:100%}
.row:first-of-type{border-top:0}
.row .nm{font-weight:700;font-size:14px}
.row .ds{font-size:12px;color:var(--n8)}
.row .go{margin-left:auto;color:var(--n7)}
.rowbtn:hover{background:var(--n2)}

/* 상세 */
.hero{display:flex;gap:20px;align-items:center}
.hero .logo{width:96px;height:96px;border-radius:28px;border:2px solid var(--n10);background:var(--n2);display:flex;align-items:center;justify-content:center;font-size:40px}
.stabs{display:flex;gap:8px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1.5px solid var(--n3)}
.menu-item:first-child{border-top:0}
.menu-item .mi{width:52px;height:52px;border-radius:16px;background:var(--n2);border:2px solid var(--n10);display:flex;align-items:center;justify-content:center;font-size:22px}
.menu-item .px{margin-left:auto;font-weight:800}
.dd{position:absolute;left:0;right:0;top:52px;background:var(--n1);border:2px solid var(--n10);border-radius:20px;padding:10px 14px;z-index:40;display:none}
.dd.show{display:block}
.dd h6{font-size:11px;font-weight:700;color:var(--n8);padding:6px 0 2px}

/* 등록 */
.steps{display:flex;gap:10px;margin-bottom:6px}
.step{flex:1;height:8px;border-radius:8px;background:var(--n3)}
.step.on{background:var(--n10)}
.photo-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph-opt{height:96px;border-radius:18px;border:2px solid var(--n10);background:var(--n2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700}
.ph-opt i{font-size:26px}
.ph-opt.on{background:var(--m600)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:800}
textarea,.inp{width:100%;border:2px solid var(--n10);border-radius:18px;background:var(--n1);padding:14px 16px;font-size:15px;outline:none;line-height:1.6;resize:none}
textarea:focus,.inp:focus{box-shadow:0 0 0 3px var(--m300)}
.kw{display:flex;gap:8px;flex-wrap:wrap}
.shim{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--n3),var(--n1),var(--n3));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.quota{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--n8)}
.quota .bar{flex:1;height:8px;border-radius:8px;background:var(--n3);overflow:hidden}
.quota .bar i{display:block;height:100%;background:var(--n10);border-radius:8px;transition:width .4s}

/* 사장님 */
.sw{width:72px;height:40px;border-radius:100px;border:2px solid var(--n10);background:var(--n3);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:var(--n1);border:2px solid var(--n10);transition:transform .25s}
.sw.on{background:var(--m600)}
.sw.on i{transform:translateX(32px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border:2px solid var(--n10);border-radius:20px;background:var(--n1);padding:16px 18px}
.stat b{display:block;font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center}
.bars span{width:14px;border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:barGrow .7s ease both}
.bars .v{background:var(--m600);border:1.5px solid var(--n10)}
.bars .l{background:var(--n4);border:1.5px solid var(--n10)}
.col small{font-size:11px;color:var(--n8)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--n10);margin-right:6px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--n8);text-align:left;font-weight:700;padding:8px 6px}
td{padding:12px 6px;border-top:1.5px solid var(--n3);font-size:14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* 모달/토스트 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60}
.ov.show{display:flex;animation:fadeIn .2s}
.modal{width:480px;max-width:92vw;background:var(--n1);border:2px solid var(--n10);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px}
.dong-opt{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:18px;border:2px solid var(--n10);background:var(--n1);font-weight:700;font-size:14px;width:100%;text-align:left}
.dong-opt.on{background:var(--m600)}
.dong-opt small{margin-left:auto;font-weight:500;color:var(--n8)}
input[type=range]{width:100%;accent-color:var(--n10)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);translate:0 20px;background:var(--n10);color:var(--n1);padding:14px 22px;border-radius:100px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:80;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;translate:0 0}
.hide{display:none!important}

@keyframes fadeUp{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,137,75,.5)}50%{box-shadow:0 0 0 6px rgba(31,137,75,0)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (max-width:900px){.tabs{flex-wrap:wrap;overflow:visible}.tabs button{white-space:normal;flex:1 1 auto}}
@media (max-width:1100px){.rail{display:none}.search{display:none}}
@media (max-width:480px){.topbar{padding:0 14px;gap:10px}.dong span.t{display:none}.mode{display:none}.tabs{padding:0 14px 12px}.layout{padding:16px 14px}.display{font-size:32px}.stats{grid-template-columns:1fr}.chart{gap:6px}}
</style>
</head>
<body data-archetype="feed-timeline">
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><i class="ph-bold ph-storefront" style="font-size:22px"></i></span>골목쇼윈도</div>
    <button class="dong" onclick="openDong()"><i class="ph-bold ph-map-pin"></i><span class="t" id="dongLabel">서교동 · 반경 1.5km</span><i class="ph ph-caret-down"></i></button>
    <div class="search" id="searchBox"><i class="ph ph-magnifying-glass"></i><input id="q" placeholder="매장, 메뉴를 검색해 보세요" oninput="doSearch(this.value)" onfocus="doSearch(this.value)"><div class="dd" id="dd"></div></div>
    <div class="mode"><button class="on" id="m-guest" onclick="setMode('guest')">손님</button><button id="m-owner" onclick="setMode('owner')">사장님</button></div>
    <button class="me" onclick="toast('내 정보 화면으로 이동합니다','user')">김</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="main" class="on" onclick="go('main')"><i class="ph-bold ph-compass"></i>동네 설정·추천 피드 탐색</button>
    <button data-v="detail" onclick="go('detail')"><i class="ph-bold ph-storefront"></i>매장 상세·관심 저장·검색</button>
    <button data-v="compose" onclick="go('compose')"><i class="ph-bold ph-sparkle"></i>30초 소식 등록·AI 문구 작성</button>
    <button data-v="owner" onclick="go('owner')"><i class="ph-bold ph-toggle-right"></i>영업 토글·조회·관심 수</button>
  </nav>
  <div class="layout" id="layout"></div>
</div>

<div class="ov" id="ovDong" onclick="if(event.target===this)closeDong()">
  <div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:22px;font-weight:800;letter-spacing:-.04em">우리 동네 설정</h3><button class="act" onclick="closeDong()"><i class="ph-bold ph-x"></i></button></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="dongList"></div>
    <div class="field"><label>탐색 반경 <b id="radLabel">1.5km</b></label><input type="range" min="5" max="30" value="15" id="rad" oninput="radChange(this.value)"></div>
    <div class="row" style="border:0;padding:0"><div><div class="nm">현재 위치 사용</div><div class="ds">동의하지 않아도 저장한 동네 기준으로 탐색합니다</div></div><button class="sw" id="geoSw" style="margin-left:auto" onclick="toggleGeo()"><i></i></button></div>
    <button class="btn primary" onclick="applyDong()">이 동네로 설정</button>
  </div>
</div>
<div class="toast" id="toast"><i class="ph-bold ph-check-circle"></i><span id="toastT"></span></div>

<script>
const STORES=[
 {id:1,name:'골목빵집 담온',cat:'베이커리',ic:'bread',d:120,open:true,hr:'07:30 – 20:00',addr:'서교동 활기로 18',tel:'02-555-0118',menu:[['소금빵',3200],['단팥 크루아상',4500],['호밀 깜빠뉴',6800],['우유 식빵',5400]]},
 {id:2,name:'한뼘 꽃방',cat:'꽃·소품',ic:'flower-tulip',d:260,open:true,hr:'10:00 – 19:00',addr:'서교동 어울길 7',tel:'02-555-0207',menu:[['미니 부케',12000],['드라이플라워 리스',18000],['계절 화분',9000]]},
 {id:3,name:'국수집 하루',cat:'식당',ic:'bowl-food',d:340,open:true,hr:'11:00 – 21:00',addr:'서교동 모퉁이로 31',tel:'02-555-0331',menu:[['잔치국수',7000],['비빔국수',7500],['들기름 막국수',9500]]},
 {id:4,name:'모퉁이 책방',cat:'책방',ic:'books',d:480,open:false,hr:'12:00 – 20:00 (오늘 휴무)',addr:'서교동 골목길 4',tel:'02-555-0404',menu:[['독립출판 잡지',12000],['엽서 세트',4000]]},
 {id:5,name:'카페 낮은언덕',cat:'카페',ic:'coffee',d:620,open:true,hr:'09:00 – 22:00',addr:'서교동 언덕길 52',tel:'02-555-0520',menu:[['필터 커피',5500],['말차 라떼',6500],['치즈 케이크',7200]]},
 {id:6,name:'소반 반찬가게',cat:'식당',ic:'cooking-pot',d:710,open:true,hr:'10:00 – 19:30',addr:'서교동 시장길 12',tel:'02-555-0612',menu:[['제철 나물 3종',8000],['수제 장조림',9500]]}
];
const POSTS=[
 {id:1,s:1,t:'12분 전',x:'오늘 첫 소금빵이 나왔어요. 갓 구운 향이 골목 끝까지 퍼지는 중이에요. 오후 3시에 한 판 더 구워요.',ic:'bread',big:'3,200원',tags:['오늘의 빵','한정 24개'],like:48,cm:6},
 {id:2,s:2,t:'35분 전',x:'비 오는 날엔 작은 꽃 한 다발이 제일 좋아요. 미니 부케 열 다발만 한뼘 가격으로 내놓습니다.',ic:'flower-tulip',big:'12,000원',tags:['미니 부케','당일 한정'],like:31,cm:4},
 {id:3,s:3,t:'1시간 전',x:'점심 한정 들기름 막국수 시작합니다. 국물 없이 고소하게 비벼 드셔 보세요.',ic:'bowl-food',big:'9,500원',tags:['점심 한정','포장 가능'],like:62,cm:11},
 {id:4,s:5,t:'2시간 전',x:'오늘의 필터 커피는 에티오피아 구지입니다. 베리 향이 선명해서 치즈 케이크와 잘 맞아요.',ic:'coffee',big:'5,500원',tags:['오늘의 원두','디저트 세트'],like:27,cm:3},
 {id:4.5,s:6,t:'3시간 전',x:'제철 나물 3종 세트가 들어왔어요. 퇴근길에 가볍게 들러 가세요.',ic:'cooking-pot',big:'8,000원',tags:['제철 나물','저녁 6시 마감'],like:19,cm:2},
 {id:5,s:4,t:'어제',x:'이번 주 독립출판 신간 세 권이 들어왔습니다. 목요일은 쉬어 가요.',ic:'books',big:'12,000원',tags:['신간 입고','목요일 휴무'],like:24,cm:5}
];
const DONGS=[['서교동','마포구'],['연남동','마포구'],['망원동','마포구'],['성수동','성동구']];
const st={view:'main',mode:'list',cat:'전체',saved:new Set([3]),liked:new Set([3]),sel:1,dong:'서교동',rad:15,geo:false,tab:'소식',open:true,tmpDong:'서교동',pick:1,kw:['소금빵','갓 구움'],ai:'',aiCount:3,loading:false,tmpGeo:false};
const $=s=>document.querySelector(s);
const S=id=>STORES.find(x=>x.id===id);
function toast(t,ic){$('#toastT').textContent=t;const e=$('#toast');e.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('show'),2200)}
function setMode(m){document.querySelectorAll('.mode button').forEach(b=>b.classList.remove('on'));$('#m-'+m).classList.add('on');go(m==='owner'?'owner':'main')}
function go(v){st.view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const owner=(v==='owner'||v==='compose');document.querySelectorAll('.mode button').forEach(b=>b.classList.remove('on'));$(owner?'#m-owner':'#m-guest').classList.add('on');render();window.scrollTo(0,0)}
function openStore(id,tab){st.sel=id;st.tab=tab||'소식';go('detail')}
function toggleSave(id){st.saved.has(id)?st.saved.delete(id):st.saved.add(id);toast(st.saved.has(id)?S(id).name+' 관심 매장에 저장합니다':'관심 매장에서 제외합니다');render()}
function toggleLike(id){st.liked.has(id)?st.liked.delete(id):st.liked.add(id);render()}
function setCat(c){st.cat=c;render()}
function setList(m){st.mode=m;render()}
function openDong(){st.tmpDong=st.dong;st.tmpGeo=st.geo;$('#rad').value=st.rad;$('#radLabel').textContent=(st.rad/10)+'km';$('#geoSw').classList.toggle('on',st.tmpGeo);drawDong();$('#ovDong').classList.add('show')}
function closeDong(){$('#ovDong').classList.remove('show')}
function drawDong(){$('#dongList').innerHTML=DONGS.map(d=>`<button class="dong-opt ${st.tmpDong===d[0]?'on':''}" onclick="st.tmpDong='${d[0]}';drawDong()"><i class="ph-bold ph-map-pin"></i>${d[0]}<small>${d[1]}</small></button>`).join('')}
function radChange(v){st.rad=+v;$('#radLabel').textContent=(v/10)+'km'}
function toggleGeo(){st.tmpGeo=!st.tmpGeo;$('#geoSw').classList.toggle('on',st.tmpGeo)}
function applyDong(){st.dong=st.tmpDong;st.geo=st.tmpGeo;$('#dongLabel').textContent=st.dong+' · 반경 '+(st.rad/10)+'km';closeDong();toast(st.geo?'현재 위치 기준으로 탐색합니다':st.dong+' 기준으로 탐색합니다');render()}
function doSearch(v){const dd=$('#dd');v=v.trim();if(!v){dd.classList.remove('show');return}
  const ss=STORES.filter(s=>s.name.includes(v)||s.cat.includes(v));const ms=[];STORES.forEach(s=>s.menu.forEach(m=>{if(m[0].includes(v))ms.push([s,m])}));
  dd.innerHTML=(ss.length?'<h6>매장</h6>'+ss.map(s=>`<button class="row rowbtn" onclick="pickRes(${s.id})"><div class="avatar" style="width:34px;height:34px;border-radius:12px"><i class="ph ph-${s.ic}"></i></div><div><div class="nm">${s.name}</div><div class="ds">${s.cat} · ${s.d}m</div></div></button>`).join(''):'')
   +(ms.length?'<h6>메뉴</h6>'+ms.map(([s,m])=>`<button class="row rowbtn" onclick="pickRes(${s.id},'메뉴')"><div><div class="nm">${m[0]}</div><div class="ds">${s.name} · ${m[1].toLocaleString()}원</div></div></button>`).join(''):'')
   +((!ss.length&&!ms.length)?'<div class="ds" style="padding:12px 0">검색 결과가 없습니다</div>':'');dd.classList.add('show')}
function pickRes(id,t){$('#dd').classList.remove('show');$('#q').value='';openStore(id,t)}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#dd').classList.remove('show')});

function postHTML(p){const s=S(p.s);const lk=st.liked.has(p.id),sv=st.saved.has(s.id);
 return `<article class="post"><header class="post-head"><button class="avatar" onclick="openStore(${s.id})">${s.name.slice(0,1)}</button><div class="who"><div class="author">${s.name}<span class="pill ${s.open?'open':''}"><span class="dot"></span>${s.open?'영업 중':'영업 종료'}</span></div><div class="meta"><time>${p.t}</time> · ${s.cat} · ${s.d}m</div></div></header>
 <div class="post-body">${p.x}</div>
 <div class="tile"><i class="ph ph-${p.ic} ic"></i><span class="ring"></span><span class="big num">${p.big}</span><span class="tg">${p.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</span></div>
 <footer class="post-actions"><button class="act like ${lk?'on':''}" onclick="toggleLike(${p.id})"><i class="ph${lk?'-fill':''} ph-heart"></i>${p.like+(lk&&p.id!==3?1:0)}</button><button class="act comment" onclick="openStore(${s.id})"><i class="ph ph-chat-circle"></i>댓글 ${p.cm}</button><button class="act share" onclick="toast('소식 링크를 복사합니다')"><i class="ph ph-share-network"></i>공유</button><button class="act save ${sv?'on':''}" onclick="toggleSave(${s.id})"><i class="ph${sv?'-fill':''} ph-bookmark-simple"></i>${sv?'저장됨':'관심 저장'}</button></footer></article>`}

function mapHTML(){const pos={1:[30,38],2:[58,26],3:[72,58],4:[40,72],5:[20,64],6:[84,34]};
 const roads='<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><g fill="none" stroke="var(--n4)" stroke-width=".7"><path d="M0 30 L100 36"/><path d="M0 62 L100 56"/><path d="M26 0 L34 100"/><path d="M64 0 L58 100"/><path d="M0 84 L100 80" stroke-dasharray="2 2"/></g><circle cx="50" cy="50" r="30" fill="none" stroke="var(--n10)" stroke-width=".4" stroke-dasharray="1.5 1.5"/></svg>';
 return `<div class="map">${roads}${STORES.map(s=>`<button class="pin ${s.open?'':'closed'} ${s.id===st.sel?'sel':''}" style="left:${pos[s.id][0]}%;top:${pos[s.id][1]}%" onclick="st.sel=${s.id};render()"><b>${s.name.split(' ').pop()}</b><i class="ph-fill ph-map-pin"></i></button>`).join('')}
 <div style="position:absolute;left:16px;bottom:16px;right:16px;background:var(--n1);border:2px solid var(--n10);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px"><div class="avatar" style="width:40px;height:40px"><i class="ph ph-${S(st.sel).ic}"></i></div><div style="flex:1"><div class="nm" style="font-weight:800">${S(st.sel).name}</div><div class="ds">${S(st.sel).cat} · ${S(st.sel).d}m · ${S(st.sel).hr}</div></div><button class="btn sm dark" onclick="openStore(${st.sel})">매장 보기</button></div></div>`}

function vMain(){const cats=['전체','지금 영업 중','베이커리','식당','카페','꽃·소품'];
 let ps=POSTS.filter(p=>{const s=S(p.s);if(s.d>st.rad*100)return false;if(st.cat==='전체')return true;if(st.cat==='지금 영업 중')return s.open;return s.cat===st.cat});
 const feed=ps.length?ps.map(postHTML).join(''):'<div class="card sub">이 조건의 소식이 없습니다. 반경을 넓혀 보세요.</div>';
 return `<main class="feed view"><div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${st.geo?'현재 위치 기준':'저장한 동네 기준'}</span><h1 class="display">${st.dong}에서<br>지금 열린 가게</h1><p class="sub">사장님이 올린 오늘의 소식을 동네 반경 안에서 둘러봅니다.</p></div>
 <div class="filterbar"><div class="fb-row"><span class="addr"><i class="ph-bold ph-map-pin"></i>${st.dong} 반경 ${(st.rad/10)}km</span><div class="seg"><button class="${st.mode==='list'?'on':''}" onclick="setList('list')"><i class="ph ph-list-bullets"></i>목록</button><button class="${st.mode==='map'?'on':''}" onclick="setList('map')"><i class="ph ph-map-trifold"></i>지도</button></div></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${st.cat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div></div>
 ${st.mode==='map'?mapHTML():feed}</main>
 <aside class="rail view"><div class="card"><h3>지금 열린 매장</h3><div style="margin-top:8px">${STORES.filter(s=>s.open).slice(0,4).map(s=>`<button class="row rowbtn" onclick="openStore(${s.id})"><div class="avatar" style="width:38px;height:38px;border-radius:14px"><i class="ph ph-${s.ic}"></i></div><div><div class="nm">${s.name}</div><div class="ds">${s.cat} · ${s.d}m</div></div><i class="ph ph-caret-right go"></i></button>`).join('')}</div></div>
 <div class="card"><h3>추천 이유</h3><p class="sub" style="margin:8px 0 12px">피드는 거리, 관심 매장, 시간대 규칙 점수로 정렬됩니다.</p>${[['거리',82],['관심 매장',64],['시간대',48]].map(r=>`<div class="quota" style="margin-top:8px"><span style="width:60px">${r[0]}</span><div class="bar"><i style="width:${r[1]}%"></i></div></div>`).join('')}<button class="btn sm" style="margin-top:14px" onclick="openDong()">동네 설정 바꾸기</button></div></aside>`}

function vDetail(){const s=S(st.sel);const sv=st.saved.has(s.id);const tabs=['소식','메뉴','정보'];
 let body='';
 if(st.tab==='소식')body=POSTS.filter(p=>p.s===s.id).map(postHTML).join('')||'<div class="card sub">등록된 소식이 없습니다.</div>';
 if(st.tab==='메뉴')body=`<div class="card">${s.menu.map(m=>`<div class="menu-item"><div class="mi"><i class="ph ph-${s.ic}"></i></div><div><div class="nm" style="font-weight:700">${m[0]}</div><div class="ds">${s.cat} 대표 메뉴</div></div><span class="px num">${m[1].toLocaleString()}원</span></div>`).join('')}</div>`;
 if(st.tab==='정보')body=`<div class="card" style="display:flex;flex-direction:column;gap:14px">${[['clock','영업시간',s.hr],['map-pin','주소',s.addr],['phone','전화',s.tel],['navigation-arrow','현재 위치에서',s.d+'m']].map(r=>`<div class="row" style="padding:0;border:0"><i class="ph-bold ph-${r[0]}" style="font-size:20px"></i><div><div class="ds">${r[1]}</div><div class="nm">${r[2]}</div></div></div>`).join('')}</div>`;
 return `<main class="feed view"><div class="card"><div class="hero"><div class="logo"><i class="ph ph-${s.ic}"></i></div><div style="flex:1"><span class="pill ${s.open?'open':''}"><span class="dot"></span>${s.open?'영업 중':'영업 종료'}</span><h1 class="display" style="font-size:34px;margin-top:8px">${s.name}</h1><p class="sub">${s.cat} · ${s.d}m · ${s.hr}</p></div></div>
 <div style="display:flex;gap:10px;margin-top:18px"><button class="btn ${sv?'dark':'primary'}" style="flex:1" onclick="toggleSave(${s.id})"><i class="ph${sv?'-fill':''} ph-bookmark-simple"></i>${sv?'관심 매장에 저장됨':'관심 매장으로 저장'}</button><button class="btn" onclick="toast('새 소식 알림을 켭니다')"><i class="ph ph-bell-ringing"></i>알림</button></div></div>
 <div class="stabs">${tabs.map(t=>`<button class="chip ${st.tab===t?'on':''}" onclick="st.tab='${t}';render()">${t}</button>`).join('')}</div>${body}</main>
 <aside class="rail view"><div class="card"><h3>저장한 매장</h3><div style="margin-top:8px">${[...st.saved].map(id=>S(id)).map(x=>`<button class="row rowbtn" onclick="openStore(${x.id})"><div class="avatar" style="width:38px;height:38px;border-radius:14px"><i class="ph ph-${x.ic}"></i></div><div><div class="nm">${x.name}</div><div class="ds">${x.cat}</div></div><i class="ph ph-caret-right go"></i></button>`).join('')||'<p class="sub">저장한 매장이 없습니다</p>'}</div></div>
 <div class="card"><h3>다른 매장 둘러보기</h3><div style="margin-top:8px">${STORES.filter(x=>x.id!==s.id).slice(0,3).map(x=>`<button class="row rowbtn" onclick="openStore(${x.id})"><div class="nm">${x.name}</div><i class="ph ph-caret-right go"></i></button>`).join('')}</div></div></aside>`}

const KW=['소금빵','갓 구움','한정 수량','비 오는 날','신메뉴','점심 특선'];
function toggleKw(k){const i=st.kw.indexOf(k);i>=0?st.kw.splice(i,1):st.kw.push(k);render()}
function runAI(){if(st.loading)return;if(st.aiCount<=0){toast('오늘 AI 호출 한도에 도달합니다. 직접 입력은 계속 가능합니다');return}
 st.loading=true;render();setTimeout(()=>{st.loading=false;st.aiCount--;const k=st.kw.join(', ')||'오늘의 소식';st.ai=`오늘 ${k} 소식이에요. 골목 끝까지 퍼지는 향기와 함께 한 걸음 들러 가세요. 수량이 넉넉하지 않으니 일찍 오시면 좋아요.`;render()},1300)}
function publish(){if(!st.ai.trim()){toast('문구를 먼저 작성해 주세요');return}
 POSTS.unshift({id:100+POSTS.length,s:1,t:'방금',x:st.ai,ic:['bread','flower-tulip','coffee'][st.pick-1],big:'3,200원',tags:st.kw.slice(0,2),like:0,cm:0});toast('소식을 등록합니다');st.ai='';st.view='main';go('main')}
function vCompose(){const ph=[['bread','소금빵 사진'],['flower-tulip','진열대 사진'],['coffee','음료 사진']];
 const step=st.ai?3:(st.kw.length?2:1);
 return `<main class="feed view"><div class="card" style="display:flex;flex-direction:column;gap:18px"><div><span class="eyebrow">사장님 모드 · 골목빵집 담온</span><h1 class="display" style="font-size:36px;margin-top:4px">사진 한 장, 키워드 몇 개면 충분해요</h1></div>
 <div class="steps">${[1,2,3].map(i=>`<span class="step ${i<=step?'on':''}"></span>`).join('')}</div>
 <div class="field"><label>1. 사진 선택</label><div class="photo-pick">${ph.map((p,i)=>`<button class="ph-opt ${st.pick===i+1?'on':''}" onclick="st.pick=${i+1};render()"><i class="ph ph-${p[0]}"></i>${p[1]}</button>`).join('')}</div></div>
 <div class="field"><label>2. 키워드 선택</label><div class="kw">${KW.map(k=>`<button class="chip ${st.kw.includes(k)?'on':''}" onclick="toggleKw('${k}')">${k}</button>`).join('')}</div></div>
 <div class="field"><label>3. 소식 문구</label>${st.loading?'<div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px;border-radius:18px"><div class="shim"></div><div class="shim" style="width:85%"></div><div class="shim" style="width:60%"></div></div>':`<textarea id="ta" rows="4" placeholder="문구를 직접 입력하거나 AI 초안을 받아 보세요" oninput="st.ai=this.value">${st.ai}</textarea>`}
 <div class="quota"><span>오늘 AI 초안 ${10-st.aiCount}/10회 사용</span><div class="bar"><i style="width:${(10-st.aiCount)*10}%"></i></div></div></div>
 <div style="display:flex;gap:10px"><button class="btn" onclick="runAI()"><i class="ph-bold ph-sparkle"></i>AI 문구 작성</button><button class="btn primary" style="flex:1" onclick="publish()">소식 등록</button></div></div></main>
 <aside class="rail view"><div class="card"><h3>손님 피드 미리보기</h3><p class="sub" style="margin:6px 0 12px">등록 즉시 이렇게 표시됩니다</p><div class="post" style="border-radius:18px"><div class="post-head" style="padding:14px 14px 0"><div class="avatar" style="width:36px;height:36px;border-radius:12px">골</div><div class="who"><div class="author" style="font-size:14px">골목빵집 담온</div><div class="meta">방금 · 120m</div></div></div><div class="post-body" style="padding:10px 14px;font-size:13px">${st.ai||'<span class="sub">작성한 문구가 여기에 표시됩니다</span>'}</div><div class="tile" style="margin:0 14px 14px;height:100px"><i class="ph ph-${ph[st.pick-1][0]} ic" style="font-size:24px"></i><span class="big" style="font-size:26px">3,200원</span></div></div></div>
 <div class="card"><h3>문구 검수 규칙</h3><p class="sub" style="margin-top:8px">과장 표현과 금칙어는 등록 전에 걸러내고, 최종 문구는 사장님이 확인한 뒤 등록합니다.</p></div></aside>`}

function toggleOpen(){st.open=!st.open;S(1).open=st.open;toast(st.open?'영업 중으로 전환합니다':'영업 종료로 전환합니다');render()}
function vOwner(){const days=['월','화','수','목','금','토','일'],v=[42,55,38,71,64,98,86],l=[8,12,6,15,13,24,19];const mx=100;
 return `<main class="feed view"><div class="card" style="display:flex;align-items:center;gap:18px"><div style="flex:1"><span class="eyebrow">골목빵집 담온</span><h1 class="display" style="font-size:36px;margin-top:4px">${st.open?'지금 영업 중':'영업 종료'}</h1><p class="sub">토글 한 번으로 손님 피드와 검색에 바로 반영됩니다.</p></div><button class="sw ${st.open?'on':''}" role="switch" aria-checked="${st.open}" onclick="toggleOpen()"><i></i></button></div>
 <div class="stats"><div class="stat"><span class="eyebrow">오늘 조회</span><b>86</b></div><div class="stat"><span class="eyebrow">오늘 관심</span><b>19</b></div><div class="stat"><span class="eyebrow">등록한 소식</span><b>${POSTS.filter(p=>p.s===1).length}</b></div></div>
 <div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><h3>최근 7일 추이</h3><div class="legend"><span><i style="background:var(--m600)"></i>조회</span><span><i style="background:var(--n4)"></i>관심</span></div></div>
 <div class="chart">${days.map((d,i)=>`<div class="col"><div class="bars"><span class="v" style="height:${v[i]/mx*100}%;animation-delay:${i*.06}s"></span><span class="l" style="height:${l[i]/mx*100}%;animation-delay:${i*.06+.05}s"></span></div><small>${d}</small></div>`).join('')}</div></div>
 <div class="card"><h3>소식별 조회·관심</h3><table style="margin-top:8px"><thead><tr><th>소식</th><th class="num">조회</th><th class="num">관심</th><th></th></tr></thead><tbody>${[['오늘 첫 소금빵이 나왔어요',86,19],['호밀 깜빠뉴 예약 안내',64,11],['주말 한정 단팥 크루아상',52,14]].map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td style="text-align:right"><button class="btn sm" onclick="go('compose')">수정</button></td></tr>`).join('')}</tbody></table></div></main>
 <aside class="rail view"><div class="card"><h3>오늘 할 일</h3><div style="margin-top:8px">${[['camera','새 소식 한 장 올리기','compose'],['clock','영업시간 확인하기','owner'],['chat-circle','손님 댓글 3건','owner']].map(r=>`<button class="row rowbtn" onclick="go('${r[2]}')"><i class="ph-bold ph-${r[0]}" style="font-size:20px"></i><div class="nm">${r[1]}</div><i class="ph ph-caret-right go"></i></button>`).join('')}</div></div></aside>`}

function render(){const v=st.view;$('#layout').innerHTML=v==='main'?vMain():v==='detail'?vDetail():v==='compose'?vCompose():vOwner()}
render();
</script>
</body>
</html>
