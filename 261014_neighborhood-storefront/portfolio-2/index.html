<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 매장 관리자 운영 허브 — 구현 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 240°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#eeeeee;
  --m100:#eeeeee;
  --m200:#eeeeee;
  --m300:#dcdcdd;
  --m400:#bababa;
  --m500:#8f8f90;
  --m600:#606062;
  --m700:#343435;
  --m800:#070709;
  --m900:#060607;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f5f5f5;
  --n1:#f5f5f5;
  --n2:#efeff0;
  --n3:#e5e5e6;
  --n4:#d5d5d7;
  --n5:#b5b5ba;
  --n6:#8b8b8b;
  --n7:#71717a;
  --n8:#53535a;
  --n9:#36363a;
  --n10:#1e1e20;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* ⚠ primary #070709가 거의 무채색(채도 13%) — 메인 램프가 회색 계열이 된다. 브랜드 포인트가 필요하면 plan primary를 유채색으로 */

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #ffffff;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--s2);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:13.5px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{text-decoration:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.lucide{width:16px;height:16px;stroke-width:1.6;flex-shrink:0}
.sidebar{width:260px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--n1);border-right:1px solid var(--n3);display:flex;flex-direction:column;padding:0 12px 12px}
.sidebar-brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:700;font-size:14px;border-bottom:1px solid var(--n3);margin:0 -12px 12px;padding:0 18px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--n10);color:var(--n1);display:flex;align-items:center;justify-content:center}
.sidebar-cmdk-hint{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--n4);border-radius:8px;color:var(--n7);margin-bottom:14px;font-size:12.5px;width:100%;background:var(--n0)}
.sidebar-cmdk-hint kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--n4);border-radius:5px;padding:0 5px;background:var(--n1)}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.sidebar-link{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--n8);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s}
.sidebar-link:hover{background:var(--n2)}
.sidebar-link.on{background:var(--n10);color:var(--n1)}
.sidebar-link .cnt{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--n7)}
.sidebar-link.on .cnt{color:var(--n4)}
.sidebar-section-title{font-size:11px;font-weight:600;color:var(--n7);padding:18px 10px 6px;letter-spacing:.03em}
.sidebar-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--n3);margin:auto -12px 0;padding:12px 18px 0}
.av{width:28px;height:28px;border-radius:50%;background:var(--n2);border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--n8)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--n3);background:var(--n1)}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--n7);font-size:13px}
.breadcrumb b{color:var(--n10);font-weight:600}
.breadcrumb .divider{color:var(--n5)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:100px;border:1px solid var(--n4);background:var(--n1);font-size:12.5px;font-weight:500;transition:background .15s,transform .1s}
.btn:hover{background:var(--n2)}
.btn.btn-primary{background:var(--n10);border-color:var(--n10);color:var(--n1)}
.btn.btn-primary:hover{background:var(--n9)}
.btn.danger{color:var(--s2-text)}
.btn-cmdk{font-size:12px;color:var(--n7)}
.content{flex:1;overflow:auto;padding:20px 24px}
.view{animation:rise .3s ease both;height:100%}
h1{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.03em}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;background:linear-gradient(135deg,var(--n2) 0%,var(--n1) 55%,var(--n3) 100%);border:1px solid var(--n3);animation:drift 12s ease-in-out infinite alternate;background-size:140% 140%}
.page-h>div,.page-h>button,.page-h>.hbtns{position:relative;z-index:1}
.page-h .art{position:absolute;right:-40px;top:-60px;width:300px;height:220px;opacity:.9;pointer-events:none}
.page-h p{color:var(--n7);font-size:12.5px;margin-top:2px}
.panel{background:var(--n1);border:1px solid var(--n3);border-border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ph{padding:14px 16px;border-bottom:1px solid var(--n3);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.pb{padding:16px}
.md{display:grid;grid-template-columns:340px 1fr;gap:16px;height:calc(100% - 92px);min-height:520px}
.list-rail{display:flex;flex-direction:column;overflow:hidden}
.list-rail .scroll{overflow:auto;flex:1}
.fil{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--n3)}
.tg{height:26px;padding:0 10px;border-radius:100px;border:1px solid var(--n4);font-size:12px;color:var(--n8);transition:background .15s}
.tg:hover{background:var(--n2)}
.tg.on{background:var(--n10);color:var(--n1);border-color:var(--n10)}
.li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--n2);width:100%;text-align:left;transition:background .12s;position:relative}
.li:hover{background:var(--n0)}
.li.on{background:var(--n2)}
.li.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--n10)}
.li .t{font-weight:600;font-size:13px}
.li .s{font-size:12px;color:var(--n7)}
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:100px;font-size:11px;font-weight:600;background:var(--n2);color:var(--n8)}
.st i{width:6px;height:6px;border-radius:50%;background:var(--n7)}
.st.ok{background:var(--s1-bg);color:var(--s1-text)}.st.ok i{background:var(--s1)}
.st.no{background:var(--s2-bg);color:var(--s2-text)}.st.no i{background:var(--s2)}
.st.wa{background:var(--s3-bg);color:var(--s3-text)}.st.wa i{background:var(--s3)}
.detail{overflow:auto;display:flex;flex-direction:column}
.kv{display:grid;grid-template-columns:110px 1fr;row-gap:8px;font-size:13px}
.kv dt{color:var(--n7)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shot{height:92px;border-radius:8px;border:1px solid var(--n3);background:var(--n2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--n7);font-size:11.5px;background-image:repeating-linear-gradient(45deg,transparent 0 10px,var(--n3) 10px 11px)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--n2)}
.chk:first-of-type{border-top:0}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--n5);display:flex;align-items:center;justify-content:center;color:var(--n1);flex-shrink:0;transition:.15s}
.cb.on{background:var(--n10);border-color:var(--n10)}
.cb svg{width:12px;height:12px;stroke-width:2.5}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--n4)}
.tl div{position:relative;padding:4px 0;font-size:12.5px;color:var(--n8)}
.tl div::before{content:'';position:absolute;left:-18px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--n1);border:1.5px solid var(--n6)}
.tl time{color:var(--n7);margin-right:8px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--n7);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--n3);background:var(--n0)}
td{padding:11px 14px;border-bottom:1px solid var(--n2);font-size:13px;vertical-align:middle}
tr.rw{cursor:pointer;transition:background .12s}
tr.rw:hover{background:var(--n0)}
tr.rw.on{background:var(--n2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.prev{border:1px solid var(--n3);border-radius:8px;padding:12px;background:var(--n0);font-size:13px;line-height:1.6}
.sl{display:grid;grid-template-columns:90px 1fr 44px;gap:12px;align-items:center;padding:9px 0}
.sl output{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
input[type=range]{width:100%;accent-color:var(--n10)}
select,.inp{height:32px;border:1px solid var(--n4);border-radius:8px;padding:0 10px;background:var(--n1);font-size:12.5px;outline:none}
.inp:focus,select:focus{border-color:var(--n10)}
textarea.inp{height:auto;padding:8px 10px;line-height:1.5;resize:none;width:100%}
.rk{display:grid;grid-template-columns:22px 1fr 120px 44px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--n2);transition:transform .3s}
.rk:first-child{border-top:0}
.rk .n{width:22px;height:22px;border-radius:6px;background:var(--n2);font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.bar{height:6px;border-radius:6px;background:var(--n3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--n10);border-radius:6px;animation:grow .6s ease both;transform-origin:left}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{padding:14px 16px}
.tile small{color:var(--n7);font-size:12px}
.tile b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:11.5px;color:var(--n7)}
.spark{display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 0}
.spark i{flex:1;background:var(--n4);border-radius:3px 3px 0 0;transform-origin:bottom;animation:grow2 .6s ease both}
.spark i.hi{background:var(--n10)}
.sw{width:34px;height:20px;border-radius:20px;background:var(--n4);position:relative;transition:.2s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--n1);transition:.2s}
.sw.on{background:var(--n10)}.sw.on i{transform:translateX(14px)}
.ov{position:fixed;inset:0;background:rgba(7,7,9,.4);display:none;align-items:center;justify-content:center;z-index:50}
.ov.show{display:flex;animation:fade .15s}
.ov.top{align-items:flex-start;padding-top:14vh}
.modal{width:440px;max-width:92vw;background:var(--n1);border-radius:12px;border:1px solid var(--n3);box-shadow:0 20px 50px rgba(0,0,0,.18);padding:20px;display:flex;flex-direction:column;gap:14px}
.cmdk-modal{width:520px;max-width:92vw;background:var(--n1);border-radius:12px;border:1px solid var(--n3);box-shadow:0 20px 50px rgba(0,0,0,.18);overflow:hidden}
.cmdk-input{width:100%;height:48px;border:0;border-bottom:1px solid var(--n3);padding:0 16px;font-size:14px;outline:none;background:var(--n1)}
.cmd{display:flex;align-items:center;gap:10px;height:38px;padding:0 16px;width:100%;text-align:left}
.cmd:hover{background:var(--n2)}
.cmd small{margin-left:auto;color:var(--n7)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--n10);color:var(--n1);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:80;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:none}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--s1);display:inline-block;animation:blink 1.6s infinite}
@keyframes drift{from{background-position:0 0}to{background-position:100% 100%}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow2{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:900px){.sidebar{width:64px}.sidebar span.lb,.sidebar-cmdk-hint,.sidebar-section-title,.sidebar-link .cnt{display:none}.md,.split{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.content{padding:14px}}
</style>
</head>
<body data-archetype="linear-sidebar-cmdk">
<aside class="sidebar" data-sidebar>
  <div class="sidebar-brand"><span class="logo"><i data-lucide="store"></i></span><span class="lb">골목쇼윈도 관리자</span></div>
  <button class="sidebar-cmdk-hint" data-cmdk-trigger onclick="openCmd()"><i data-lucide="search"></i><span class="lb">명령 또는 검색</span><kbd>⌘ K</kbd></button>
  <nav class="sidebar-nav" id="nav">
    <a class="sidebar-link on" role="button" tabindex="0" data-v="main" onclick="go('main')"><i data-lucide="badge-check"></i>매장 승인 심사 콘솔</a>
    <a class="sidebar-link" role="button" tabindex="0" data-v="report" onclick="go('report')"><i data-lucide="shield-alert"></i>신고·숨김 콘텐츠 모니터링</a>
    <a class="sidebar-link" role="button" tabindex="0" data-v="reco" onclick="go('reco')"><i data-lucide="sliders-horizontal"></i>AI 추천 점수 조정 보드</a>
    <a class="sidebar-link" role="button" tabindex="0" data-v="push" onclick="go('push')"><i data-lucide="bell-ring"></i>푸시 알림·통계 요약</a>
  </nav>

<main class="main">
  <header class="topbar">
    <nav class="breadcrumb"><a onclick="go('main')">관리자</a><span class="divider">/</span><a id="bc1">심사</a><span class="divider">/</span><b id="bc2">매장 승인 심사 콘솔</b></nav>

  <div style="font-weight:700;font-size:15px" id="rejT">반려 사유 입력</div>
  <textarea class="inp" id="rejTx" rows="4" placeholder="사유를 입력하면 매장 사장님에게 안내됩니다 (필수)"></textarea>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeRej()">취소</button><button class="btn btn-primary" onclick="confirmRej()">확정</button></div>
</div></div>
<div class="ov" id="ovNew" onclick="if(event.target===this)closeNew()"><div class="modal">
  <div style="font-weight:700;font-size:15px">공지 작성</div>
  <input class="inp" placeholder="제목" id="nTitle"><textarea class="inp" rows="4" placeholder="전체 매장에 전달할 공지 내용"></textarea>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeNew()">취소</button><button class="btn btn-primary" onclick="closeNew();toast('공지를 발송 큐에 추가합니다')">발송 큐에 추가</button></div>
</div></div>
<div class="ov top" id="ovCmd" data-cmdk hidden onclick="if(event.target===this)closeCmd()"><div class="cmdk-modal">
  <input class="cmdk-input" id="cmdIn" placeholder="명령 또는 검색…" oninput="drawCmd()">
  <div id="cmdList" style="padding:6px 0"></div>
</div></div>
<div class="toast" id="toast"><i data-lucide="check"></i><span id="toastT"></span></div>

<script>
const $=s=>document.querySelector(s);

 {id:1,n:'골목빵집 담온',cat:'베이커리',st:'대기',at:'10.14 09:12',own:'박서연',biz:'***-**-*4821',ad:'서교동 활기로 18',tel:'02-555-0118',chk:[1,1,0]},

const ic=()=>lucide.createIcons();
function toast(t){$('#toastT').textContent=t;const e=$('#toast');e.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('show'),2200);ic()}
function go(v){st.v=v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));$('#bc1').textContent=NAV[v][0];$('#bc2').textContent=NAV[v][1];render();closeCmd()}
function stc(s){return s==='승인'||s==='처리됨'?'ok':s==='반려'?'no':s==='보완 요청'?'wa':''}
function openNew(){$('#ovNew').classList.add('show')}function closeNew(){$('#ovNew').classList.remove('show')}
function openCmd(){const o=$('#ovCmd');o.hidden=false;o.classList.add('show');$('#cmdIn').value='';drawCmd();$('#cmdIn').focus()}
function closeCmd(){const o=$('#ovCmd');o.classList.remove('show');o.hidden=true}
function drawCmd(){const q=$('#cmdIn').value.trim();const items=[['badge-check','매장 승인 심사 콘솔','main'],['shield-alert','신고·숨김 콘텐츠 모니터링','report'],['sliders-horizontal','AI 추천 점수 조정 보드','reco'],['bell-ring','푸시 알림·통계 요약','push']].filter(i=>!q||i[1].includes(q));
 $('#cmdList').innerHTML=items.map(i=>`<button class="cmd" onclick="go('${i[2]}')"><i data-lucide="${i[0]}"></i>${i[1]}<small>이동</small></button>`).join('')||'<div style="padding:14px 16px;color:var(--n7)">결과가 없습니다</div>';ic()}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}if(e.key==='Escape'){closeCmd();closeRej();closeNew()}
 if(st.v==='main'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){const l=vis();const i=l.findIndex(a=>a.id===st.app);if(e.key==='j'&&l[i+1]){st.app=l[i+1].id;render()}if(e.key==='k'&&l[i-1]){st.app=l[i-1].id;render()}}});

function setStatus(id,s,why){const a=APPS.find(x=>x.id===id);a.st=s;a.hist=(a.hist||[]);a.hist.unshift([s,why||'']);toast(a.n+' — '+s+' 처리를 기록합니다');render()}
function openRej(m){st.rejMode=m;$('#rejT').textContent=m+' 사유 입력';$('#rejTx').value='';$('#ovRej').classList.add('show')}
function closeRej(){$('#ovRej').classList.remove('show')}
function confirmRej(){const v=$('#rejTx').value.trim();if(!v){toast('사유를 입력해야 확정할 수 있습니다');return}closeRej();setStatus(st.app,st.rejMode,v)}
function toggleChk(i){const a=APPS.find(x=>x.id===st.app);a.chk[i]=a.chk[i]?0:1;render()}

 <div class="md"><div class="panel list-rail"><div class="fil">${['전체','대기','보완 요청','승인','반려'].map(f=>`<button class="tg ${st.af===f?'on':''}" onclick="st.af='${f}';render()">${f}</button>`).join('')}</div><div class="scroll">${l.map(x=>`<button class="li ${x.id===a.id?'on':''}" onclick="st.app=${x.id};render()"><span class="av">${x.n.slice(0,1)}</span><div style="flex:1;min-width:0"><div class="t">${x.n}</div><div class="s">${x.cat} · ${x.at}</div></div><span class="st ${stc(x.st)}"><i></i>${x.st}</span></button>`).join('')}</div></div>

 return `<div class="view"><div class="page-h"><svg class="art" viewBox="0 0 300 220" fill="none" stroke="var(--n5)" stroke-width="1"><circle cx="190" cy="100" r="30"/><circle cx="190" cy="100" r="62"/><circle cx="190" cy="100" r="96"/><circle cx="190" cy="100" r="132" stroke-dasharray="3 5"/><circle cx="190" cy="100" r="5" fill="var(--n10)" stroke="none"/><circle cx="140" cy="70" r="3.5" fill="var(--n10)" stroke="none"/><circle cx="238" cy="132" r="3.5" fill="var(--n10)" stroke="none"/><path d="M190 100 L140 70 M190 100 L238 132" stroke="var(--n7)"/></svg><div><h1>푸시 알림·통계 요약</h1><p><span class="dot-live"></span> 발송 큐를 실시간으로 확인합니다</p></div><button class="btn btn-primary" onclick="toast('대기 중인 알림을 지금 발송합니다')"><i data-lucide="send"></i>대기 건 발송</button></div>
 <div class="tiles">${[['등록 기기 토큰','1,284','유효 1,241 · 만료 43'],['입점 매장','86','심사 대기 3'],['가입 회원','3,920','이번 주 신규 212'],['게시된 소식','1,507','숨김 처리 12']].map(t=>`<div class="panel tile"><small>${t[0]}</small><b>${t[1]}</b><span>${t[2]}</span></div>`).join('')}</div>

function render(keep){const y=$('#content').scrollTop;$('#content').innerHTML={main:vMain,report:vReport,reco:vReco,push:vPush}[st.v]();ic();if(keep)$('#content').scrollTop=y}
render();
