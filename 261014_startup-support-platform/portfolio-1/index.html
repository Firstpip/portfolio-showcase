<style>
/* ── 컬러 역할 토큰 P1 — 메인 1 · 서브 2 · 나머지 무채색 (gen-color-tokens.js 산출, hue 16°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m500 = plan primary */
  --m50:#feece5;
  --m100:#fcd9cc;
  --m200:#fbc2ad;
  --m300:#f9a88a;
  --m400:#f88f69;
  --m500:#f67748;
  --m600:#ca623b;
  --m700:#9d4c2e;
  --m800:#6f3620;
  --m900:#6f3620;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#fdf9f4;
  --n1:#ffffff;
  --n2:#f0efef;
  --n3:#e6e5e5;
  --n4:#d7d6d5;
  --n5:#bab6b5;
  --n6:#989290;
  --n7:#7a7371;
  --n8:#5a5553;
  --n9:#3a3736;
  --n10:#201e1e;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}
/* 주의 s2(오류/위험/실패/하락/환불) — 메인 hue 16°와 16° 겹침 → 제거, 해당 상태는 무채색(n9/n10 필 + 아이콘)으로 표현 */

/* ── 상태 레이어 P1 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=subtle theme=light */
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--m500);outline-offset:2px;}
button:not(:disabled):active,[role="button"]:not([aria-disabled="true"]):active{transform:scale(.98);}
button:disabled,button[aria-disabled="true"],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:grayscale(1) opacity(.55);transform:none;}
[data-loading="true"]{position:relative;color:transparent!important;pointer-events:none;}
[data-loading="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid #111111;border-right-color:transparent;animation:k-spin .7s linear infinite;mix-blend-mode:difference;}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--n10);}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.6;}
.num,[data-num],td.num,th.num{font-variant-numeric:tabular-nums;}
@keyframes k-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--n0);color:var(--n9);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a,button{text-decoration:none;font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--n10)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s1) 50%,transparent)}100%{box-shadow:0 0 0 8px color-mix(in srgb,var(--s1) 0%,transparent)}}
@keyframes grow{from{width:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in srgb,var(--n0) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:24px;padding:0 32px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--n10);cursor:pointer}
.logo-mark{width:32px;height:32px;border-radius:12px;background:var(--m500);display:flex;align-items:center;justify-content:center;color:var(--n1)}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{height:40px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--n8);display:flex;align-items:center;gap:8px;transition:background .13s}

.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--n1);border:1px solid var(--n3);width:240px;color:var(--n7)}
.search input{border:none;outline:none;background:none;width:100%;font-size:13px}
.search:focus-within{border-color:var(--m500)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--n2);color:var(--n8);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.avatar.sm{width:32px;height:32px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--n8);position:relative}
.icon-btn:hover{background:var(--n2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--m500);border:2px solid var(--n0)}
.layout{display:flex;justify-content:center;gap:24px;padding:32px 24px 64px;width:100%;flex:1}
.layout.wide{padding-left:48px;padding-right:48px}
main.feed{width:100%;max-width:640px;min-width:0}
main.wide{max-width:1120px}
.rail{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:96px;align-self:flex-start}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:32px;background:linear-gradient(135deg,var(--m600),var(--m800));color:var(--n1);margin-bottom:16px;animation:fadeUp .5s both}
.hero h1{font-size:32px;line-height:1.25;font-weight:800;letter-spacing:-.03em;max-width:420px}
.hero p{margin-top:12px;font-size:15px;opacity:.9;max-width:400px}
.hero .hero-art{position:absolute;right:-24px;top:-24px;opacity:.5}
.hero-cta{margin-top:20px;display:flex;gap:8px}
.btn{height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .13s,transform .13s;white-space:nowrap}
.btn.primary{background:var(--m600);color:var(--n1)}
.btn.primary:hover{background:var(--m700)}
.btn.light{background:var(--n1);color:var(--n10)}
.btn.outline{border:2px solid var(--n3);color:var(--n9);background:var(--n1)}
.btn.outline:hover{border-color:var(--n5)}
.btn.ghost{color:var(--n8)}
.btn.ghost:hover{background:var(--n2)}
.btn.sm{height:36px;padding:0 16px;font-size:13px}
.btn:disabled{cursor:not-allowed}
.composer{position:sticky;top:64px;z-index:10;background:var(--n0);padding:8px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 16px;border-radius:999px;background:var(--n1);border:1px solid var(--n3);font-size:13px;font-weight:600;color:var(--n8);transition:all .13s}
.chip:hover{border-color:var(--n5)}
.chip.on{background:var(--m50);border-color:var(--m600);color:var(--m700)}
.post{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:24px;margin-bottom:16px;animation:fadeUp .45s both;transition:transform .18s,box-shadow .18s;cursor:pointer}
.post:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--n10) 8%,transparent)}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.author{font-weight:700;color:var(--n10)}
time{font-size:13px;color:var(--n7)}
.post-head .meta{display:flex;flex-direction:column;line-height:1.4}
.post-head .right{margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--n2);color:var(--n8)}
.badge.ok{background:var(--s1-bg);color:var(--s1-text)}
.badge.warn{background:var(--s3-bg);color:var(--s3-text)}
.badge.dark{background:var(--n9);color:var(--n1)}
.post h3{font-size:18px;font-weight:700;line-height:1.4;color:var(--n10);letter-spacing:-.02em}
.post-body p{margin-top:8px;color:var(--n8)}
.tile-row{display:flex;gap:8px;margin-top:16px}
.tile{flex:1;background:var(--n0);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:13px;color:var(--n7)}
.tile .v{font-size:18px;font-weight:800;color:var(--n10);font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:999px;background:var(--n2);overflow:hidden;margin-top:16px}
.progress>i{display:block;height:100%;border-radius:999px;background:var(--m500);animation:grow .9s ease both}
.post-actions{display:flex;align-items:center;gap:4px;margin-top:16px;padding-top:12px;border-top:1px solid var(--n3)}
.post-actions button{height:36px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;color:var(--n8);font-size:13px;font-weight:600}
.post-actions button:hover{background:var(--n2)}
.post-actions button.act{color:var(--m700)}
.post-actions .grow{margin-left:auto}
.post-actions button.primary:hover{background:var(--m700)}
.post-actions button.primary{color:var(--n1)}
.card{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:24px}
.card h4{font-size:15px;font-weight:700;color:var(--n10);display:flex;align-items:center;gap:8px}
.card .sub{font-size:13px;color:var(--n7);margin-top:4px}
.stat-mini{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--n3)}
.stat-mini:last-child{border:none}
.stat-mini b{font-size:18px;font-variant-numeric:tabular-nums}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--n3)}
.list-row:last-child{border:none}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:600;color:var(--n10)}
.list-row .s{font-size:13px;color:var(--n7)}
.page-title{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--n10);line-height:1.3}
.page-desc{color:var(--n7);margin-top:4px;margin-bottom:24px}
.overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--n10) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s both}
.modal{background:var(--n1);border-radius:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:32px;animation:fadeUp .25s both}
.modal h2{font-size:18px;font-weight:800;color:var(--n10)}
.drawer-wrap{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--n10) 40%,transparent);display:flex;justify-content:flex-end;animation:fadeIn .18s both}
.drawer{width:480px;max-width:100%;height:100%;background:var(--n1);padding:32px;overflow:auto;animation:slideIn .26s both}
.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--n8);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--n4);border-radius:12px;padding:12px 16px;background:var(--n1)}
.field textarea{min-height:96px;resize:vertical}
.field .err{font-size:13px;color:var(--n10);margin-top:8px;display:flex;gap:4px;align-items:center;font-weight:600}
.stepper{display:flex;gap:8px;margin:20px 0 4px}
.stepper span{flex:1;height:6px;border-radius:999px;background:var(--n3)}
.stepper span.on{background:var(--m500)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:90;background:var(--n10);color:var(--n1);padding:12px 24px;border-radius:999px;font-weight:600;display:flex;gap:8px;align-items:center;animation:fadeUp .25s both}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--n3);margin-bottom:24px}
.tabs button{height:44px;padding:0 16px;font-weight:600;color:var(--n7);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--m700);border-bottom-color:var(--m600)}
.week-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:24px}
.week{min-width:88px;border:1px solid var(--n3);background:var(--n1);border-radius:16px;padding:12px;text-align:left;transition:all .13s}
.week b{display:block;font-size:15px;color:var(--n10)}
.week small{font-size:13px;color:var(--n7)}
.week.on{border-color:var(--m600);background:var(--m50)}
.drop{border:2px dashed var(--n4);border-radius:16px;padding:24px;text-align:center;color:var(--n7);margin-top:16px;cursor:pointer}
.drop:hover{border-color:var(--m500)}
.thread{margin-top:16px}
.cmt{display:flex;gap:12px;margin-bottom:16px}
.cmt .bubble{background:var(--n0);border-radius:16px;padding:12px 16px;flex:1}
.cmt .bubble b{font-size:13px}
.cmt.reply{margin-left:44px}
.seg{display:inline-flex;background:var(--n2);border-radius:999px;padding:4px}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--n8)}
.seg button.on{background:var(--n1);color:var(--n10);box-shadow:0 1px 3px color-mix(in srgb,var(--n10) 12%,transparent)}
.grid-wrap{background:var(--n1);border:1px solid var(--n3);border-radius:20px;padding:24px;overflow:auto}
.grid{display:grid;grid-template-columns:96px repeat(18,minmax(40px,1fr));gap:4px;min-width:900px}
.grid .hd{font-size:13px;color:var(--n7);text-align:center;font-variant-numeric:tabular-nums}
.grid .rn{font-size:13px;font-weight:700;color:var(--n9);display:flex;align-items:center}
.slot{height:36px;border-radius:8px;background:var(--n0);border:1px solid var(--n3);transition:all .1s}
.slot:hover:not(:disabled){border-color:var(--m500);background:var(--m50)}
.slot.sel{background:var(--m500);border-color:var(--m600)}
.slot.bk{background:var(--n3);border-color:var(--n3);filter:none}
.slot:disabled{cursor:not-allowed;filter:none}
.bar-fixed{position:sticky;bottom:16px;margin-top:16px;background:var(--n10);color:var(--n1);border-radius:20px;padding:16px 24px;display:flex;align-items:center;gap:16px;animation:fadeUp .25s both}
.bar-fixed .btn.primary{margin-left:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--n7);margin-bottom:16px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:1px solid var(--n4)}
table.board{width:100%;border-collapse:collapse;background:var(--n1);border:1px solid var(--n3);border-radius:20px;overflow:hidden}
table.board th{font-size:13px;color:var(--n7);text-align:left;padding:12px 16px;background:var(--n0);font-weight:600}

table.board tr.r{cursor:pointer}
table.board tr.r:hover td{background:var(--n0)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s1);animation:pulseDot 1.6s infinite}
.banner{display:flex;align-items:center;gap:16px;background:var(--n1);border:1px solid var(--m300);border-radius:20px;padding:16px 24px;margin-bottom:24px}
.banner .grow{flex:1}
.toolbar{display:flex;gap:4px;border:1px solid var(--n4);border-bottom:none;border-radius:12px 12px 0 0;padding:8px;background:var(--n0)}
.toolbar button{width:32px;height:32px;border-radius:8px;color:var(--n8)}
.toolbar button.on{background:var(--m50);color:var(--m700)}
.editor{width:100%;min-height:140px;border:1px solid var(--n4);border-radius:0 0 12px 12px;padding:12px 16px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--n8);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--m600)}
@media(max-width:900px){.rail{display:none}.search{display:none}.topbar{padding:0 16px;gap:8px}.nav button{padding:0 12px}.nav span.lbl{display:none}}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef} = React;
const I = ({n,s=18,f}) => <i className={(f?'ph-fill':'ph')+' ph-'+n} style={{fontSize:s}} />;
const Avatar = ({name,sm}) => <span className={'avatar'+(sm?' sm':'')}>{(name||'?').trim().charAt(0)}</span>;

const PROGRAMS = [
  {id:1,title:'예비창업 부트캠프 12기',kind:'교육형',state:'open',d:'D-6',cap:40,applied:28,period:'11.04 ~ 12.20',place:'온라인 + 오프라인 병행',desc:'아이디어를 검증하고 첫 고객 인터뷰까지 8주 동안 팀과 함께 달리는 과정입니다. 주차별 교육자료와 워크시트가 제공되고, 수료 팀에는 입주 심사 가산점이 주어집니다.',time:'1시간 전'},
  {id:2,title:'초기 스타트업 성장 트랙 7기',kind:'액셀러레이팅',state:'open',d:'D-13',cap:20,applied:9,period:'11.18 ~ 02.28',place:'강남 캠퍼스 입주',desc:'매출 검증 단계 팀을 위한 3개월 집중 성장 프로그램입니다. 전담 멘토 매칭, 투자 연계 데모데이, 회의실 우선 예약 권한을 함께 지원합니다.',time:'어제'},

function useToast(){
  const [t,setT]=useState(null);
  const show=(m,icon='check-circle')=>{setT({m,icon});clearTimeout(window.__tt);window.__tt=setTimeout(()=>setT(null),2400)};
  return [t,show];
}

function ProgramPost({p,onOpen,onApply,notified,onNotify}){
  const pct=Math.round(p.applied/p.cap*100);
  const badge=p.state==='open'?<span className="badge ok"><span className="live"/>모집 중 {p.d}</span>:p.state==='soon'&&p.d==='모집 예정'?<span className="badge">모집 예정</span>:p.state==='soon'?<span className="badge warn">마감 임박 {p.d}</span>:<span className="badge dark">모집 마감</span>;
  return (
    <article className="post" onClick={()=>onOpen(p)} style={{animationDelay:(p.id*60)+'ms'}}>
      <header className="post-head">
        <Avatar name="운영" />
        <div className="meta"><span className="author">프로그램 운영팀</span><time>{p.time}</time></div>
        <div className="right">{badge}</div>
      </header>
      <div className="post-body">
        <h3>{p.title}</h3>
        <p>{p.desc.slice(0,62)}…</p>
      </div>
      <div className="tile-row">
        <div className="tile"><span className="k">유형</span><span className="v">{p.kind}</span></div>
        <div className="tile"><span className="k">기간</span><span className="v" style={{fontSize:15}}>{p.period}</span></div>
        <div className="tile"><span className="k">지원 현황</span><span className="v num">{p.applied}/{p.cap}</span></div>
      </div>
      <div className="progress"><i style={{width:pct+'%'}}/></div>
      <footer className="post-actions" onClick={e=>e.stopPropagation()}>
        <button className={'like'+(notified?' act':'')} onClick={()=>onNotify(p)}><I n={notified?'bell-ringing':'bell'} f={notified} />{notified?'모집 알림 신청됨':'모집 알림 받기'}</button>
        <button className="comment" onClick={()=>onOpen(p)}><I n="info"/>상세 보기</button>
        <button className="share grow btn primary sm" disabled={p.state==='closed'} onClick={()=>onApply(p)}>{p.state==='closed'?'대기 신청하기':'지원하기'}</button>
      </footer>
    </article>
  );
}

function ApplyModal({p,onClose,onSubmit,toast}){
  const [step,setStep]=useState(0);

  const [saving,setSaving]=useState(false);
  const [sending,setSending]=useState(false);
  const [err,setErr]=useState({});
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  const next=()=>{
    const e={};
    if(step===1){ if(!f.item.trim()) e.item='사업 아이템을 한 줄로 적어 주세요'; if(f.problem.trim().length<10) e.problem='해결하려는 문제를 10자 이상 적어 주세요'; }
    if(step===2 && !f.role.trim()) e.role='본인의 역할을 입력해 주세요';
    setErr(e);
    if(Object.keys(e).length) return;
    setStep(s=>s+1);
  };
  const save=()=>{setSaving(true);setTimeout(()=>{setSaving(false);toast('임시저장했어요. 다음에 이어서 작성할 수 있어요','floppy-disk')},900)};
  const send=()=>{setSending(true);setTimeout(()=>{setSending(false);onSubmit(p)},1200)};
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1}}><h2>{p.title}</h2><div className="page-desc" style={{margin:0,fontSize:13}}>지원서 작성 · {step+1}/{SECTIONS.length} {SECTIONS[step]}</div></div>
          <button className="icon-btn" onClick={onClose} aria-label="닫기"><I n="x"/></button>
        </div>
        <div className="stepper">{SECTIONS.map((s,i)=><span key={s} className={i<=step?'on':''}/>)}</div>
        {step===0&&<>
          <div className="field"><label>이름</label><input value={f.name} onChange={e=>set('name',e.target.value)}/></div>
          <div className="field"><label>이메일</label><input value={f.email} onChange={e=>set('email',e.target.value)}/></div>
          <div className="field"><label>연락처</label><input value={f.phone} onChange={e=>set('phone',e.target.value)}/></div>
        </>}
        {step===1&&<>
          <div className="field"><label>사업 아이템</label><input aria-invalid={!!err.item} placeholder="예: 소상공인 재고 자동 발주 서비스" value={f.item} onChange={e=>set('item',e.target.value)}/>{err.item&&<div className="err"><I n="warning-circle"/>{err.item}</div>}</div>
          <div className="field"><label>해결하려는 문제</label><textarea aria-invalid={!!err.problem} placeholder="고객이 겪는 문제와 현재 대안을 적어 주세요" value={f.problem} onChange={e=>set('problem',e.target.value)}/>{err.problem&&<div className="err"><I n="warning-circle"/>{err.problem}</div>}</div>
        </>}
        {step===2&&<>
          <div className="field"><label>팀 인원</label><select value={f.team} onChange={e=>set('team',e.target.value)}>{['1','2','3','4','5'].map(n=><option key={n} value={n}>{n}명</option>)}</select></div>
          <div className="field"><label>본인 역할</label><input aria-invalid={!!err.role} placeholder="예: 대표 · 서비스 기획" value={f.role} onChange={e=>set('role',e.target.value)}/>{err.role&&<div className="err"><I n="warning-circle"/>{err.role}</div>}</div>
        </>}
        {step===3&&<>
          <div className="drop" onClick={()=>set('file','사업계획서_v2.pdf')}>
            {f.file?<><I n="file-pdf" s={28}/><div style={{fontWeight:700,color:'var(--n10)',marginTop:8}}>{f.file}</div><div style={{fontSize:13}}>2.4MB · 업로드 완료</div></>:<><I n="upload-simple" s={28}/><div style={{marginTop:8}}>사업계획서를 끌어다 놓거나 눌러서 선택해 주세요</div><div style={{fontSize:13}}>PDF, 최대 20MB</div></>}
          </div>
          <div className="card" style={{marginTop:16,background:'var(--n0)',border:'none'}}>
            <div className="stat-mini"><span>지원자</span><b style={{fontSize:15}}>{f.name} 외 {Number(f.team)-1}명</b></div>
            <div className="stat-mini"><span>사업 아이템</span><b style={{fontSize:15}}>{f.item}</b></div>
          </div>
        </>}
        <div style={{display:'flex',gap:8,marginTop:24}}>
          <button className="btn outline" data-loading={saving} onClick={save}>임시저장하기</button>
          <div style={{flex:1}}/>
          {step>0&&<button className="btn ghost" onClick={()=>setStep(s=>s-1)}>이전 단계</button>}

  );

      <section className="card" style={{marginBottom:16,animation:'fadeUp .4s both'}}>
        <h4><I n="book-open"/>{w.w}주차 · {w.t}</h4>
        <div style={{marginTop:8}}>{w.items.map(it=><div className="list-row" key={it}><I n={it.includes('영상')?'play-circle':'file-text'} s={20}/><div className="grow t">{it}</div><button className="btn outline sm" onClick={()=>toast('자료를 열었어요','arrow-square-out')}>열람하기</button></div>)}</div>
      </section>
      <section className="card" style={{marginBottom:16,animation:'fadeUp .5s both'}}>
        <h4><I n="upload-simple"/>워크시트 제출</h4>
        <div className="sub">마감 11.08 (금) 23:59</div>
        <div className="drop" onClick={upload}>{file?<><I n="file-xls" s={28}/><div style={{fontWeight:700,color:'var(--n10)',marginTop:8}}>{file}</div><div className="progress" style={{maxWidth:240,margin:'12px auto 0'}}><i style={{width:prog+'%',animation:'none',transition:'width .25s'}}/></div></>:<><I n="cloud-arrow-up" s={28}/><div style={{marginTop:8}}>파일을 끌어다 놓거나 눌러서 선택해 주세요</div></>}</div>
      </section>
      <section className="card" style={{marginBottom:16,animation:'fadeUp .6s both'}}>
        <div style={{display:'flex',alignItems:'center'}}><h4><I n="users-three"/>우리 팀 · 오늘의 한 걸음</h4><div style={{flex:1}}/><button className="btn outline sm" onClick={()=>setInvite(true)}>팀원 초대하기</button></div>
        <div style={{display:'flex',gap:8,marginTop:16}}>{['김지원','박준호','이하늘'].map(n=><div key={n} style={{display:'flex',alignItems:'center',gap:8}}><Avatar name={n} sm/><span style={{fontSize:13,fontWeight:600}}>{n}</span></div>)}</div>
        <div className="thread">
          {thread.map((c,i)=><div key={i} className={'cmt'+(c.r?' reply':'')}><Avatar name={c.n} sm/><div className="bubble"><b>{c.n}</b> <time>{c.t}</time><div style={{marginTop:4}}>{c.b}</div></div></div>)}
          <div style={{display:'flex',gap:8}}><div className="field" style={{margin:0,flex:1}}><input placeholder="팀 피드백에 답글을 남겨 보세요" value={reply} onChange={e=>setReply(e.target.value)}/></div><button className="btn primary" onClick={post}>답글 남기기</button></div>
        </div>
      </section>
      <section className="card" style={{animation:'fadeUp .7s both'}}>
        <h4><I n="ticket"/>이벤트 신청</h4>
        {EVENTS.map(e=>{const c=ev[e.id];const full=c.n>=e.cap&&!c.mine;return <div className="list-row" key={e.id}><div className="grow"><div className="t">{e.t}</div><div className="s">{e.when} · <span className="num">{c.n}/{e.cap}</span>명{wait[e.id]?' · 대기 '+wait[e.id]+'명':''}</div></div>{c.mine&&<span className="badge ok">{c.n>e.cap||wait[e.id]&&c.n>=e.cap?'대기 중':'신청 완료'}</span>}<button className={'btn sm '+(c.mine?'outline':full?'outline':'primary')} onClick={()=>toggleEv(e)}>{c.mine?'신청 취소하기':full?'대기 신청하기':'신청하기'}</button></div>})}
      </section>
    </main>
    <aside className="rail">
      <div className="card"><h4><I n="target"/>12기 진행률</h4><div className="progress"><i style={{width:'38%'}}/></div><div className="sub" style={{marginTop:8}}>6주 중 2주차 진행 중</div></div>
      <div className="card"><h4><I n="clock-countdown"/>다가오는 일정</h4>
        <div className="stat-mini"><span>워크시트 마감</span><b className="num">11.08</b></div>
        <div className="stat-mini"><span>중간 점검</span><b className="num">11.15</b></div>
        <div className="stat-mini"><span>데모데이</span><b className="num">12.20</b></div></div>
    </aside>
    {invite&&<div className="overlay" onClick={()=>setInvite(false)}><div className="modal" onClick={e=>e.stopPropagation()}><h2>팀원 초대하기</h2><div className="field"><label>초대할 이메일</label><input placeholder="teammate@example.com"/></div><div className="field"><label>초대 링크</label><input readOnly value="https://demo.example/team/join/7F2K9Q"/></div><div style={{display:'flex',gap:8,marginTop:24,justifyContent:'flex-end'}}><button className="btn ghost" onClick={()=>setInvite(false)}>닫기</button><button className="btn primary" onClick={()=>{setInvite(false);toast('초대 메일을 보냈어요','envelope-simple')}}>초대 메일 보내기</button></div></div></div>}

function RoomView({toast,onBooked}){
  const [tab,setTab]=useState('보드');
  const [booked,setBooked]=useState(BOOKED0);
  const [sel,setSel]=useState(null);
  const [form,setForm]=useState(false);
  const [purpose,setPurpose]=useState('');
  const [rent,setRent]=useState([{t:'11.23 팀 워크숍 대관',s:'승인',d:'11.10 신청'},{t:'12.07 외부 강연 대관',s:'검토 중',d:'11.11 신청'},{t:'11.30 투자자 미팅 대관',s:'반려',d:'11.05 신청'}]);
  const click=(r,i)=>{
    if(!sel||sel.r!==r){setSel({r,a:i,b:i});return}
    if(i<sel.a){setSel({r,a:i,b:sel.b});return}
    for(let k=sel.a;k<=i;k++) if(booked[r].includes(k)){toast('이미 예약된 시간이 포함돼 있어요. 보드를 새로 불러왔어요','warning-circle');setSel(null);return}
    setSel({...sel,b:i});
  };
  const confirm=()=>{
    const arr=[];for(let k=sel.a;k<=sel.b;k++)arr.push(k);
    setBooked(o=>({...o,[sel.r]:[...o[sel.r],...arr]}));
    onBooked();setForm(false);toast(ROOMS[sel.r]+' '+SLOTS[sel.a]+' 예약을 완료했어요','calendar-check');setSel(null);setPurpose('');
  };
  const len=sel?sel.b-sel.a+1:0;
  return (<main className="feed wide">
    <div style={{display:'flex',alignItems:'flex-end'}}>
      <div><h1 className="page-title">회의실 예약</h1><p className="page-desc">합격 대상자 전용 · 30분 단위로 연속 선택할 수 있어요</p></div>
      <div style={{flex:1}}/>
      <div className="seg" style={{marginBottom:24}}>{['보드','대관 신청'].map(t=><button key={t} className={tab===t?'on':''} onClick={()=>setTab(t)}>{t}</button>)}</div>
    </div>
    {tab==='보드'?<>
      <div className="legend"><span><i style={{background:'var(--n0)'}}/>예약 가능</span><span><i style={{background:'var(--n3)'}}/>예약됨</span><span><i style={{background:'var(--m500)'}}/>내 선택</span><span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}><span className="live"/>11월 12일 (화) 기준</span></div>
      <div className="grid-wrap"><div className="grid">
        <div/>{SLOTS.map((s,i)=><div key={s} className="hd">{i%2===0?s.slice(0,2):''}</div>)}
        {ROOMS.map((rn,r)=><React.Fragment key={rn}><div className="rn">{rn}</div>{SLOTS.map((s,i)=>{const bk=booked[r].includes(i);const on=sel&&sel.r===r&&i>=sel.a&&i<=sel.b;return <button key={s} className={'slot'+(bk?' bk':'')+(on?' sel':'')} disabled={bk} title={rn+' '+s} onClick={()=>click(r,i)}/>})}</React.Fragment>)}
      </div></div>
      {sel&&<div className="bar-fixed"><I n="clock" s={20}/><div><div style={{fontWeight:700}}>{ROOMS[sel.r]} · {SLOTS[sel.a]} ~ {SLOTS[sel.b+1]||'18:00'}</div><div style={{fontSize:13,opacity:.7}}>{len*30}분 선택됨</div></div><button className="btn primary" onClick={()=>setForm(true)}>예약 정보 입력하기</button></div>}
    </>:<div className="card"><h4><I n="buildings"/>대관 신청 내역</h4>
      {rent.map(r=><div className="list-row" key={r.t}><div className="grow"><div className="t">{r.t}</div><div className="s">{r.d}</div></div><span className={'badge '+(r.s==='승인'?'ok':r.s==='반려'?'dark':'')}>{r.s}</span></div>)}
      <button className="btn primary" style={{marginTop:16}} onClick={()=>{setRent(x=>[{t:'12.14 팀 오프라인 모임 대관',s:'검토 중',d:'방금 신청'},...x]);toast('대관 신청을 접수했어요. 결과는 알림으로 안내해 드려요','paper-plane-tilt')}}>대관 신청하기</button></div>}
    {form&&<div className="overlay" onClick={()=>setForm(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h2>예약 정보 입력</h2>
      <div className="card" style={{background:'var(--n0)',border:'none',marginTop:16}}><div className="stat-mini"><span>회의실</span><b style={{fontSize:15}}>{ROOMS[sel.r]}</b></div><div className="stat-mini"><span>시간</span><b style={{fontSize:15}}>{SLOTS[sel.a]} ~ {SLOTS[sel.b+1]||'18:00'}</b></div></div>
      <div className="field"><label>사용 목적</label><input aria-invalid={form&&purpose===''&&false} placeholder="예: 고객 인터뷰, 팀 스프린트" value={purpose} onChange={e=>setPurpose(e.target.value)}/></div>
      <div className="field"><label>참석 인원</label><select><option>2~4명</option><option>5~8명</option></select></div>
      <div style={{display:'flex',gap:8,marginTop:24,justifyContent:'flex-end'}}><button className="btn ghost" onClick={()=>setForm(false)}>취소하기</button><button className="btn primary" onClick={confirm}>예약 완료하기</button></div>
    </div></div>}
  </main>);
}

  const [bold,setBold]=useState(false);

          <div className="post-body"><h3>{p.title}</h3><p>{p.body}</p></div>
          <footer className="post-actions">
            <button className={'like'+(p.liked?' act':'')} onClick={()=>upd(p.id,x=>({...x,liked:!x.liked,like:x.like+(x.liked?-1:1)}))}><I n="heart" f={p.liked}/><span className="num">{p.like}</span></button>
            <button className="comment" onClick={()=>toast('댓글 입력창을 열었어요','chat-circle')}><I n="chat-circle"/><span className="num">{p.cmt}</span></button>
            <button className="share grow" onClick={()=>{upd(p.id,x=>({...x,saved:!x.saved}));toast(p.saved?'저장을 취소했어요':'저장했어요','bookmark-simple')}}><I n="bookmark-simple" f={p.saved}/>{p.saved?'저장됨':'저장하기'}</button>
          </footer>
        </article>

        <div className="list-row"><div className="grow"><div className="t" style={{fontSize:13}}>초기 팀이 지표를 고르는 세 가지 기준</div><div className="s">읽는 시간 6분</div></div><I n="caret-right"/></div>
        <div className="list-row"><div className="grow"><div className="t" style={{fontSize:13}}>첫 투자 미팅 체크리스트</div><div className="s">읽는 시간 4분</div></div><I n="caret-right"/></div></div>
      <div className="card"><h4><I n="rocket-launch"/>포트폴리오 스타트업</h4>
        {['모아펫','리플로우','단단랩'].map(n=><div className="list-row" key={n}><Avatar name={n} sm/><div className="grow t" style={{fontSize:13}}>{n}</div><span className="badge">입주 중</span></div>)}</div>

        {err&&<div className="err"><I n="warning-circle"/>{err}</div>}
      </div>
      <label className="check"><input type="checkbox" checked={anon} onChange={e=>setAnon(e.target.checked)}/>익명으로 작성하기 (작성자 정보는 다른 회원에게 표시되지 않아요)</label>
      <div style={{display:'flex',gap:8,marginTop:24,justifyContent:'flex-end'}}><button className="btn ghost" onClick={()=>setWr(false)}>취소하기</button><button className="btn primary" onClick={submit}>등록하기</button></div>
    </div></div>}
  </>);
}

function App(){

  const [toastT,toast]=useToast();
  const [applyP,setApplyP]=useState(null);
  const [applied,setApplied]=useState([{t:'창업 아이디어 해커톤',d:'10.20 제출',s:'심사 중'},{t:'예비창업 부트캠프 11기',d:'09.02 제출',s:'합격'}]);
  const [rooms,setRooms]=useState([{t:'회의실 A2 · 11.13 14:00 ~ 15:30',d:'고객 인터뷰'},{t:'집중실 D1 · 11.15 10:00 ~ 12:00',d:'팀 스프린트'}]);
  const NAV=[['main','프로그램 지원','squares-four'],['campus','온라인 캠퍼스','graduation-cap'],['room','회의실 예약','door'],['community','커뮤니티','chats-circle'],['mypage','마이페이지','user-circle']];
  const submit=p=>{setApplied(a=>[{t:p.title,d:'방금 제출',s:'접수 완료'},...a]);setApplyP(null);toast('지원서를 제출했어요. 결과는 마이페이지에서 확인해요','paper-plane-tilt')};
  return (
    <div className="app" data-archetype="feed-timeline">
      <header className="topbar">
        <div className="logo" onClick={()=>setView('main')}><span className="logo-mark"><I n="rocket-launch" f s={18}/></span>스타트업 허브</div>
        <nav className="nav">{NAV.map(([k,l,ic])=><button key={k} className={view===k?'on':''} onClick={()=>setView(k)}><I n={ic} s={18}/>{l}</button>)}</nav>
        <div className="top-right">
          <div className="search"><I n="magnifying-glass" s={16}/><input placeholder="프로그램·글 검색"/></div>
          <button className="icon-btn" aria-label="알림" onClick={()=>toast('새 알림 3건이 있어요','bell')}><I n="bell" s={20}/><span className="dot"/></button>
          <Avatar name="김지원"/>
        </div>
      </header>
      <div className={'layout'+(view==='room'?' wide':'')}>
        {view==='main'&&<MainView applied={applied} openApply={setApplyP} toast={toast}/>}
        {view==='campus'&&<CampusView toast={toast}/>}
        {view==='room'&&<RoomView toast={toast} onBooked={()=>setRooms(r=>[{t:'새 예약 · 방금 등록',d:'회의실 보드에서 예약'},...r])}/>}
        {view==='community'&&<CommunityView toast={toast}/>}
        {view==='mypage'&&<MyView applied={applied} rooms={rooms} toast={toast}/>}
      </div>
      {applyP&&<ApplyModal p={applyP} onClose={()=>setApplyP(null)} onSubmit={submit} toast={toast}/>}
      {toastT&&<div className="toast"><I n={toastT.icon} s={18}/>{toastT.m}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
