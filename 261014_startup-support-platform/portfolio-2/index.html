<style>
/* ── 컬러 역할 토큰 P2 — 메인 1 · 서브 3 · 나머지 무채색 (gen-color-tokens.js 산출, hue 180°, light) ── */
:root{
  /* 메인 — 브랜드 마크·primary CTA(화면당 1)·활성 nav·링크·주 차트·포커스. 앵커 m800 = plan primary */
  --m50:#edefef;
  --m100:#edefef;
  --m200:#edefef;
  --m300:#dbe0e0;
  --m400:#b8c0c0;
  --m500:#8c9a9a;
  --m600:#5c7070;
  --m700:#2e4747;
  --m800:#001f1f;
  --m900:#001919;
  /* 무채색 — 배경(n0~n2)·테두리/비활성(n3~n5)·아이콘/보조텍스트(n6~n8)·본문/다크필(n9~n10). 아바타·태그·아이콘박스·KPI배경·보조 차트는 전부 여기 */
  --n0:#f7f6f2;
  --n1:#ffffff;
  --n2:#eff0f0;
  --n3:#e5e6e6;
  --n4:#d5d7d7;
  --n5:#b5baba;
  --n6:#909898;
  --n7:#6a7878;
  --n8:#535a5a;
  --n9:#363a3a;
  --n10:#1e2020;
  /* 서브 — 상태 의미가 있을 때만. 배지=bg+text, 점/셀/바=solid */
  --s1:#1f894b; --s1-bg:#e2f3e9; --s1-text:#14713b; /* 성공/진행/정상/상승 */
  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */
  --s3:#d48d11; --s3-bg:#f6f1ea; --s3-text:#8b6118; /* 경고/주의 */
}

/* ── 상태 레이어 P2 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */
/* state-layer elevation=flat theme=light */

input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{outline:none;border-color:var(--m500);box-shadow:0 0 0 3px color-mix(in srgb, var(--m500) 28%, transparent);}

function Spark({d,w=84,h=32}){
  const mx=Math.max(...d),mn=Math.min(...d);
  const pts=d.map((v,i)=>[i*(w/(d.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-6)]);
  const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return <svg className="stat-spark" viewBox={'0 0 '+w+' '+h}><path d={p} fill="none" style={{stroke:'var(--m600)'}} strokeWidth="1.75" strokeLinejoin="round" strokeDasharray="1600" strokeDashoffset="0" /><circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.5" style={{fill:'var(--m800)'}}/></svg>;
}

function AreaChart(){
  const [hv,setHv]=useState(null);
  const W=760,H=260,L=40,B=28,T=12;
  const mx=80;
  const x=i=>L+i*((W-L-8)/(INVEST.length-1));
  const y=v=>T+(H-T-B)*(1-v/mx);
  const line=INVEST.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=line+' L'+x(INVEST.length-1)+' '+(H-B)+' L'+x(0)+' '+(H-B)+' Z';
  return (
    <div style={{position:'relative'}}>
      <svg viewBox={'0 0 '+W+' '+H} width="100%" style={{display:'block'}} onMouseLeave={()=>setHv(null)}>
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style={{stopColor:'var(--m600)',stopOpacity:.28}}/><stop offset="100%" style={{stopColor:'var(--m600)',stopOpacity:0}}/></linearGradient></defs>
        {[0,20,40,60,80].map(g=><g key={g}><line x1={L} x2={W-8} y1={y(g)} y2={y(g)} style={{stroke:'var(--n3)'}} strokeDasharray={g?'3 4':'0'}/><text x={L-8} y={y(g)+4} textAnchor="end" fontSize="11" style={{fill:'var(--n7)'}}>{g}</text></g>)}
        <path d={area} style={{fill:'url(#ag)'}}/>
        <path d={line} fill="none" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="1600" style={{stroke:'var(--m800)',animation:'drawLine 1.4s ease-out both'}}/>
        {INVEST.map((v,i)=><g key={i}>
          <rect x={x(i)-20} y={T} width="40" height={H-T-B} fill="transparent" onMouseEnter={()=>setHv(i)} onClick={()=>setHv(i)}/>
          <circle cx={x(i)} cy={y(v)} r={hv===i?5:3} style={{fill:hv===i?'var(--m800)':'var(--n1)',stroke:'var(--m800)'}} strokeWidth="2"/>
          <text x={x(i)} y={H-8} textAnchor="middle" fontSize="11" style={{fill:'var(--n7)'}}>{MONTHS[i]}</text>
        </g>)}
      </svg>
      {hv!==null&&<div className="chart-tip" style={{left:Math.min(x(hv)/W*100,88)+'%',top:Math.max(y(INVEST[hv])/H*100-14,0)+'%',transform:'translateX(-50%)'}}>{MONTHS[hv]} · 유치 {INVEST[hv]}억 원</div>}
    </div>
  );
}

        <div className="sidebar-brand"><span className="brand-mark"><Ic n="landmark" s={18}/></span><div><div className="brand-name">통합 관리자</div><div className="brand-env">운영 환경 · 데모</div></div></div>
        {NAV.map(([g,items])=><div className="sidebar-section" key={g}><div className="sidebar-section-title">{g}</div>{items.map(([k,l,ic])=><button key={k} className={'sidebar-link'+(view===k?' active':'')} onClick={()=>setView(k)}><Ic n={ic} s={16}/>{l}{k==='ledger'&&admit>0&&<span className="cnt">+{admit}</span>}</button>)}</div>)}
        <div className="sidebar-foot"><Av name="김운영"/><div><div style={{fontWeight:700,fontSize:13,color:'var(--n10)'}}>김운영</div><div style={{fontSize:12,color:'var(--n7)'}}>최고 관리자 · OTP 인증됨</div></div></div>
      </aside>
      <div className="main-wrap">
        <div className="topbar"><div className="crumb"><Ic n="home" s={14}/>관리자<Ic n="chevron-right" s={12}/><b>{label[view]}</b></div><div className="sbox"><Ic n="search" s={14}/><input placeholder="회원·팀·프로그램 검색"/><kbd>/</kbd></div><button className="ibtn" aria-label="알림" onClick={()=>toast('새 알림이 없어요','bell')}><Ic n="bell"/></button></div>
        <main className="main">
          {view==='main'&&<MainView toast={toast}/>}
          {view==='wizard'&&<WizardView toast={toast}/>}
          {view==='review'&&<ReviewView toast={toast} onAdmit={n=>setAdmit(a=>a+n)}/>}
          {view==='migration'&&<MigrationView toast={toast}/>}
          {view==='ledger'&&<LedgerView toast={toast}/>}
          {view==='security'&&<SecurityView toast={toast}/>}
        </main>
      </div>
      {toastT&&<div className="toast"><Ic n={toastT.ic} s={16}/>{toastT.m}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
