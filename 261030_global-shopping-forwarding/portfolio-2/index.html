/* ── 배너·기획전 ── */
function Banners({ banners, setBanners }) {
  const p = useParams();
  const [filter, setFilter] = useState(p.filter || "all");
  const [stop, setStop] = useState(p.stop || null);
  const [adding, setAdding] = useState(false);
  const blank = { title: "", from: "", to: "" };
  const [f, setF] = useState(blank);
  const [tried, setTried] = useState(false);
  useEffect(() => { setFilter(p.filter || "all"); setStop(p.stop || null); }, [p]);
  const FILTERS = [{ key: "all", label: "전체" }, { key: "live", label: "노출 중" }, { key: "plan", label: "예정" }, { key: "end", label: "종료" }];
  const MAP = { live: "노출 중", plan: "예정", end: "종료" };
  const list = banners.filter((b) => filter === "all" || b.status === MAP[filter]);
  const cur = banners.find((b) => b.id === stop);
  const bad = { title: f.title.trim().length < 2, from: !/^\d{2}\.\d{2}$/.test(f.from), to: !/^\d{2}\.\d{2}$/.test(f.to) || f.to < f.from };
  const doStop = () => {
    const prev = banners;
    setBanners((b) => b.map((x) => (x.id === stop ? { ...x, status: "종료" } : x)));
    setStop(null);
    toast("노출을 중지했습니다", "ok", null, () => setBanners(prev));
  };
  const add = () => {
    setTried(true);
    if (bad.title || bad.from || bad.to) return;
    setBanners((b) => [{ id: "B-0" + (b.length + 1), title: f.title.trim(), from: f.from, to: f.to, status: "예정" }, ...b]);
    setF(blank); setTried(false); setAdding(false);
    toast("배너를 예정 상태로 등록했습니다");
  };
  return (
    <>
      <PageHead title="배너·기획전" sub="노출 기간이 되면 스토어 메인에 자동으로 나타납니다." right={<><Segmented label="노출 상태" value={filter} onChange={setFilter} options={FILTERS} /><Button variant="primary" onClick={() => setAdding(true)}>배너 등록</Button></>} />
      {list.length === 0 ? <Empty>이 상태의 배너가 없습니다. 배너를 등록해 주세요.</Empty> : (
        <>
          <Table head={[{ label: "순서" }, { label: "제목" }, { label: "노출 기간" }, { label: "상태" }, { sr: "작업" }]}>
            {list.map((b, i) => <tr key={b.id}><td className="tnum text-ink-2">{b.id}</td><td className="font-semibold">{b.title}</td><td className="tnum whitespace-nowrap text-ink-2">{b.from} ~ {b.to}</td><td><Pill tone={BANNER_TONE[b.status]}>{b.status}</Pill></td><td className="text-right">{b.status === "노출 중" && <Button size="sm" onClick={() => setStop(b.id)}>노출 중지</Button>}</td></tr>)}
          </Table>
          <ul className="grid gap-2.5 md:hidden">{list.map((b) => <CardRow key={b.id} onClick={() => b.status === "노출 중" && setStop(b.id)} title={b.title} right={<Pill tone={BANNER_TONE[b.status]}>{b.status}</Pill>} sub={`${b.id} · ${b.from} ~ ${b.to}`} />)}</ul>
        </>
      )}
      <Modal open={!!cur} onClose={() => setStop(null)} title="노출을 중지할까요?" sub={cur ? `${cur.id} · ${cur.title}` : ""} footer={<><Button onClick={() => setStop(null)}>그대로 두기</Button><Button variant="danger" onClick={doStop}>노출 중지</Button></>}>
        <p className="pb-1 text-[15px] text-ink-2">중지하면 스토어 메인에서 바로 빠집니다. 중지 직후 알림의 되돌리기로 복원할 수 있습니다.</p>
      </Modal>
      <Modal open={adding} onClose={() => setAdding(false)} title="배너 등록" footer={<><Button onClick={() => setAdding(false)}>취소</Button><Button variant="primary" onClick={add}>배너 등록</Button></>}>
        <div className="grid gap-4 pb-1">
          <Field id="b-title" label="제목" error={tried && bad.title ? "제목을 두 글자 이상 적어 주세요." : null}><input id="b-title" className="field" value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} aria-invalid={tried && bad.title} /></Field>
          <div className="grid gap-4 sm:grid-cols-2">
            <Field id="b-from" label="노출 시작(월.일)" error={tried && bad.from ? "11.05 형식으로 적어 주세요." : null}><input id="b-from" className="field tnum" value={f.from} onChange={(e) => setF({ ...f, from: e.target.value })} placeholder="11.05" aria-invalid={tried && bad.from} /></Field>
            <Field id="b-to" label="노출 종료(월.일)" error={tried && bad.to ? "시작일보다 늦은 날짜를 적어 주세요." : null}><input id="b-to" className="field tnum" value={f.to} onChange={(e) => setF({ ...f, to: e.target.value })} placeholder="11.20" aria-invalid={tried && bad.to} /></Field>
          </div>
        </div>
      </Modal>
    </>
  );
}

/* ── 주문·신청 처리 ── */
function Orders({ orders, setOrders, role }) {
  const p = useParams();
  const [type, setType] = useState(p.type || "전체");
  const [status, setStatus] = useState(p.status || "전체");
  const [openId, setOpenId] = useState(p.open || null);
  const [rejectId, setRejectId] = useState(p.reject || null);
  const [reason, setReason] = useState("");
  const [tried, setTried] = useState(false);
  useEffect(() => { setType(p.type || "전체"); setStatus(p.status || "전체"); setOpenId(p.open || null); setRejectId(p.reject || null); setReason(""); setTried(false); }, [p]);
  const TYPES = ["전체", "주문", "배송대행", "구매대행", "묶음배송"];
  const list = orders.filter((o) => (type === "전체" || o.type === type) && (status === "전체" || (status === "지연" ? o.late && o.status !== "완료" : o.status === status)));
  const cur = orders.find((o) => o.id === openId);
  const rej = orders.find((o) => o.id === rejectId);
  const patch = (id, d) => setOrders((os) => os.map((o) => (o.id === id ? { ...o, ...d } : o)));
  const confirmIn = () => { patch(openId, { status: "처리 중", late: false }); toast(`${openId} 입고를 확인했습니다. 고객 화면에 검수 단계로 보입니다`); setOpenId(null); };
  const doReject = () => {
    setTried(true);
    if (reason.trim().length < 5) return;
    patch(rejectId, { status: "반려" }); toast(`${rejectId} 신청을 반려했습니다`, "warn"); setRejectId(null); setReason(""); setTried(false);
  };
  return (
    <>
      <PageHead title="주문·신청 처리" sub={`${list.length}건 표시 중 · 접수 순`} right={<Segmented label="유형" value={type} onChange={setType} options={TYPES.map((t) => ({ key: t, label: t }))} />} />
      {status !== "전체" && <p className="mb-3 text-[14px] text-ink-2">상태 조건: {status} <button type="button" className="ml-2 font-semibold text-accent-700 hover:underline" onClick={() => setStatus("전체")}>조건 해제</button></p>}
      {list.length === 0 ? <Empty>조건에 맞는 건이 없습니다. 유형을 전체로 바꿔 보세요.</Empty> : (
        <>
          <Table head={[{ label: "번호" }, { label: "유형" }, { label: "내용" }, { label: "고객" }, { label: "접수" }, { label: "담당" }, { label: "상태" }, { sr: "처리" }]}>
            {list.map((o) => <tr key={o.id}><td className="tnum whitespace-nowrap font-semibold">{o.id}</td><td className="text-ink-2">{o.type}</td><td className="max-w-[240px] truncate">{o.item}</td><td className="text-ink-2">{o.who}</td><td className="tnum whitespace-nowrap text-ink-2">{o.at}</td><td className={o.owner === "미지정" ? "text-warn" : "text-ink-2"}>{o.owner}</td><td><Pill tone={STATUS_TONE[o.status]} fill={o.status === "접수"}>{o.status}</Pill></td><td className="text-right"><Button size="sm" onClick={() => setOpenId(o.id)}>처리</Button></td></tr>)}
          </Table>
          <ul className="grid gap-2.5 md:hidden">{list.map((o) => <CardRow key={o.id} onClick={() => setOpenId(o.id)} title={o.item} right={<Pill tone={STATUS_TONE[o.status]}>{o.status}</Pill>} sub={`${o.id} · ${o.type} · ${o.owner}`} />)}</ul>
        </>
      )}
      <Modal open={!!cur} onClose={() => setOpenId(null)} title={cur ? cur.item : ""} sub={cur ? `${cur.id} · ${cur.type} · ${cur.who}` : ""}
        footer={cur && <>{role.key === "manager" && cur.status !== "완료" && cur.status !== "반려" && <Button variant="danger" onClick={() => { setRejectId(cur.id); setOpenId(null); }}>반려</Button>}{(cur.status === "접수" || cur.late) && <Button variant="primary" onClick={confirmIn}>입고 확인</Button>}</>}>
        {cur && (
          <div className="grid gap-4 pb-1">
            <KV rows={[["접수", <span key="a" className="tnum">{cur.at}</span>], ["상태", <Pill key="s" tone={STATUS_TONE[cur.status]}>{cur.status}</Pill>], ["입고 지연", cur.late ? "이틀 초과" : "없음"]]} />
            <Field id="owner" label="담당자"><select id="owner" className="field" value={cur.owner} onChange={(e) => { patch(cur.id, { owner: e.target.value }); toast(`담당자를 ${e.target.value}으로 지정했습니다`); }}>{OWNERS.map((n) => <option key={n}>{n}</option>)}</select></Field>
            {role.key === "staff" && <p className="text-[13.5px] text-ink-3">반려는 운영 관리자만 할 수 있습니다.</p>}
          </div>
        )}
      </Modal>
      <Modal open={!!rej} onClose={() => setRejectId(null)} title="신청을 반려할까요?" sub={rej ? `${rej.id} · ${rej.item}` : ""} footer={<><Button onClick={() => setRejectId(null)}>취소</Button><Button variant="danger" onClick={doReject}>반려하기</Button></>}>
        <div className="pb-1"><Field id="reason" label="반려 사유(고객에게 그대로 보입니다)" error={tried && reason.trim().length < 5 ? "사유를 다섯 글자 이상 적어 주세요." : null}><textarea id="reason" className="field min-h-24" value={reason} onChange={(e) => setReason(e.target.value)} aria-invalid={tried && reason.trim().length < 5} /></Field></div>
      </Modal>
    </>
  );
}

/* ── 묶음배송·요율 ── */
function Rates({ rates, setRates, hist, setHist }) {
  const p = useParams();
  const [edit, setEdit] = useState(p.edit || null);
  const [f, setF] = useState({ base: "", step: "", from: "" });
  const [tried, setTried] = useState(false);
  useEffect(() => { setEdit(p.edit || null); setTried(false); }, [p]);
  useEffect(() => { if (edit) setF({ base: String(rates[edit].base), step: String(rates[edit].step), from: "11.01" }); }, [edit]);
  const next = { base: Number(f.base) || 0, step: Number(f.step) || 0 };
  const bad = { base: next.base < 1000, step: next.step < 500, from: !/^\d{2}\.\d{2}$/.test(f.from) || f.from < "10.30" };
  const save = () => {
    setTried(true);
    if (bad.base || bad.step || bad.from) return;
    setHist((h) => [{ id: "h" + (h.length + 3), at: "10.30 09:50", who: "윤관리", what: `${rates[edit].name} 요율 변경(적용 ${f.from})` }, ...h]);
    setRates((r) => ({ ...r, [edit]: { ...r[edit], ...next } }));
    setEdit(null); setTried(false);
    toast("요율을 저장했습니다. 스토어 배송비 계산기에 같은 값이 반영됩니다");
  };
  return (
    <>
      <PageHead title="묶음배송·요율" sub="스토어 배송비 계산기와 같은 계산식을 씁니다." />
      <SectionTitle>국가별 배송비 요율</SectionTitle>
      <Table head={[{ label: "국가" }, { label: "기본(500g까지)", num: true }, { label: "500g 추가", num: true }, { label: "2.3kg 예시", num: true }, { sr: "수정" }]}>
        {Object.entries(rates).map(([k, r]) => <tr key={k}><td className="font-semibold">{r.name}</td><td className="num">{fmtWon(r.base)}</td><td className="num">{fmtWon(r.step)}</td><td className="num">{fmtWon(calcShip(r, SAMPLE_G))}</td><td className="text-right"><Button size="sm" onClick={() => setEdit(k)}>수정</Button></td></tr>)}
      </Table>
      <ul className="grid gap-2.5 md:hidden">{Object.entries(rates).map(([k, r]) => <CardRow key={k} onClick={() => setEdit(k)} title={r.name} right={<span className="tnum text-[14.5px] font-bold">{fmtWon(calcShip(r, SAMPLE_G))}</span>} sub={`기본 ${fmtWon(r.base)} · 추가 ${fmtWon(r.step)}`} />)}</ul>
      <div className="mt-8 grid gap-6 lg:grid-cols-2">
        <section><SectionTitle>합포장 대기 3건</SectionTitle>
          <ul className="grid gap-2">{[["BD-0318", "상품 4건 · 1,320g", "독일"], ["BD-0319", "상품 2건 · 640g", "일본"], ["BD-0320", "상품 3건 · 2,010g", "미국"]].map((b) => <li key={b[0]} className="card flex items-center justify-between gap-3 px-5 py-3.5"><span className="tnum text-[15px] font-semibold">{b[0]}</span><span className="tnum text-[14px] text-ink-2">{b[1]} · {b[2]}행</span></li>)}</ul>
        </section>
        <section><SectionTitle>변경 이력</SectionTitle>
          <ul className="grid gap-2">{hist.map((h, i) => <li key={h.id || i} className="card px-5 py-3.5"><p className="text-[14.5px]">{h.what}</p><p className="tnum text-[13.5px] text-ink-3">{h.at} · {h.who}</p></li>)}</ul>
        </section>
      </div>
      <Modal open={!!edit} onClose={() => setEdit(null)} title={edit ? `${rates[edit].name} 요율 수정` : ""} footer={<><Button onClick={() => setEdit(null)}>취소</Button><Button variant="primary" onClick={save}>요율 저장</Button></>}>
        {edit && (
          <div className="grid gap-4 pb-1">
            <div className="grid gap-4 sm:grid-cols-2">
              <Field id="r-base" label="기본 요율(원)" error={tried && bad.base ? "1,000원 이상으로 적어 주세요." : null}><input id="r-base" className="field tnum" type="number" value={f.base} onChange={(e) => setF({ ...f, base: e.target.value })} aria-invalid={tried && bad.base} /></Field>
              <Field id="r-step" label="500g 추가 요율(원)" error={tried && bad.step ? "500원 이상으로 적어 주세요." : null}><input id="r-step" className="field tnum" type="number" value={f.step} onChange={(e) => setF({ ...f, step: e.target.value })} aria-invalid={tried && bad.step} /></Field>
            </div>
            <Field id="r-from" label="적용 시작(월.일)" error={tried && bad.from ? "오늘(10.30) 이후 날짜를 11.01 형식으로 적어 주세요." : null}><input id="r-from" className="field tnum" value={f.from} onChange={(e) => setF({ ...f, from: e.target.value })} aria-invalid={tried && bad.from} /></Field>
            <KV rows={[["2.3kg 현재", <span key="a" className="tnum">{fmtWon(calcShip(rates[edit], SAMPLE_G))}</span>], ["2.3kg 변경 후", <span key="b" className="tnum font-bold">{fmtWon(calcShip(next, SAMPLE_G))}</span>]]} />
          </div>
        )}
      </Modal>
    </>
  );
}

/* ── 블로그 관리 ── */
function BlogAdmin({ posts, setPosts }) {
  const p = useParams();
  const [filter, setFilter] = useState(p.filter || "전체");
  const [cat, setCat] = useState("전체");
  const [writing, setWriting] = useState(false);
  const blank = { title: "", cat: BLOG_CATS[0], body: "" };
  const [f, setF] = useState(blank);
  const [tried, setTried] = useState(false);
  useEffect(() => { setFilter(p.filter || "전체"); }, [p]);
  const list = posts.filter((x) => (filter === "전체" || x.status === filter) && (cat === "전체" || x.cat === cat));
  const bad = { title: f.title.trim().length < 4, body: f.body.trim().length < 10 };
  const save = (status) => {
    setTried(true);
    if (bad.title || bad.body) return;
    setPosts((ps) => [{ id: "b-" + (ps.length + 20), cat: f.cat, title: f.title.trim(), status, date: "10.30" }, ...ps]);
    setF(blank); setTried(false); setWriting(false);
    toast(status === "게시" ? "글을 게시했습니다" : "초안으로 저장했습니다");
  };

  return (
    <>
      <PageHead title="블로그 관리" sub={`카테고리 ${BLOG_CATS.length}개 · 글 ${posts.length}건`} right={<><Segmented label="글 상태" value={filter} onChange={setFilter} options={["전체", "초안", "게시"].map((k) => ({ key: k, label: k }))} /><Button variant="primary" onClick={() => setWriting(true)}>글 작성</Button></>} />
      <div className="mb-4 max-w-[240px]"><label className="sr-only" htmlFor="cat">카테고리</label><select id="cat" className="field" value={cat} onChange={(e) => setCat(e.target.value)}>{["전체", ...BLOG_CATS].map((c) => <option key={c}>{c}</option>)}</select></div>
      {list.length === 0 ? <Empty>조건에 맞는 글이 없습니다. 상태나 카테고리를 바꿔 보세요.</Empty> : (
        <>
          <Table head={[{ label: "제목" }, { label: "카테고리" }, { label: "작성일" }, { label: "상태" }, { sr: "작업" }]}>
            {list.map((x) => <tr key={x.id}><td className="font-semibold">{x.title}</td><td className="text-ink-2">{x.cat}</td><td className="tnum text-ink-2">{x.date}</td><td>{x.status === "초안" ? <Pill tone="warn">초안</Pill> : <span className="text-ink-2">게시</span>}</td><td className="text-right">{x.status === "초안" && <Button size="sm" onClick={() => publish(x.id)}>게시</Button>}</td></tr>)}
          </Table>
          <ul className="grid gap-2.5 md:hidden">{list.map((x) => <CardRow key={x.id} onClick={() => x.status === "초안" && publish(x.id)} title={x.title} right={x.status === "초안" ? <Pill tone="warn">초안</Pill> : null} sub={`${x.cat} · ${x.date}`} />)}</ul>
        </>
      )}
      <Modal open={writing} onClose={() => setWriting(false)} title="글 작성" footer={<><Button onClick={() => save("초안")}>초안 저장</Button><Button variant="primary" onClick={() => save("게시")}>글 게시</Button></>}>
        <div className="grid gap-4 pb-1">
          <Field id="w-title" label="제목" error={tried && bad.title ? "제목을 네 글자 이상 적어 주세요." : null}><input id="w-title" className="field" value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} aria-invalid={tried && bad.title} /></Field>
          <Field id="w-cat" label="카테고리"><select id="w-cat" className="field" value={f.cat} onChange={(e) => setF({ ...f, cat: e.target.value })}>{BLOG_CATS.map((c) => <option key={c}>{c}</option>)}</select></Field>
          <Field id="w-body" label="본문" error={tried && bad.body ? "본문을 열 글자 이상 적어 주세요." : null}><textarea id="w-body" className="field min-h-32" value={f.body} onChange={(e) => setF({ ...f, body: e.target.value })} aria-invalid={tried && bad.body} /></Field>
        </div>
      </Modal>
    </>
  );
}

/* ── 301 매핑 ── */
function Redirects({ rows, setRows }) {
  const p = useParams();
  const [filter, setFilter] = useState(p.filter || "all");
  const [adding, setAdding] = useState(null);
  const [to, setTo] = useState("");
  const [tried, setTried] = useState(false);
  useEffect(() => { setFilter(p.filter || "all"); }, [p]);
  const list = rows.filter((r) => filter === "all" || (filter === "missing" ? !r.to : !!r.to));
  const missing = rows.filter((r) => !r.to).length;
  const target = rows.find((r) => r.id === adding);
  const badTo = !/^\/[\w\-/?=&.%]*$/.test(to.trim());
  const save = () => {
    setTried(true);
    if (badTo) return;
    setRows((rs) => rs.map((r) => (r.id === adding ? { ...r, to: to.trim() } : r)));
    toast("새 주소를 연결했습니다. 301 응답에 바로 반영됩니다");
    setAdding(null); setTo(""); setTried(false);
  };
  return (
    <>
      <PageHead title="301 매핑표" sub={`옛 주소 ${rows.length}건 중 연결 누락 ${missing}건`} right={<Segmented label="연결 상태" value={filter} onChange={setFilter} options={[{ key: "all", label: "전체" }, { key: "missing", label: "누락" }, { key: "ok", label: "연결됨" }]} />} />
      {list.length === 0 ? <Empty>조건에 맞는 주소가 없습니다. 전체 목록으로 돌아가 보세요.</Empty> : (
        <>
          <Table head={[{ label: "출처" }, { label: "옛 주소" }, { label: "새 주소" }, { label: "상태" }, { sr: "연결" }]}>
            {list.map((r) => <tr key={r.id}><td className="text-ink-2">{r.src}</td><td className="tnum">{r.old}</td><td className="tnum text-ink-2">{r.to || "—"}</td><td>{r.to ? <span className="text-ink-2">연결됨</span> : <Pill tone="warn">누락</Pill>}</td><td className="text-right">{!r.to && <Button size="sm" onClick={() => { setAdding(r.id); setTo(""); }}>새 주소 연결</Button>}</td></tr>)}
          </Table>
          <ul className="grid gap-2.5 md:hidden">{list.map((r) => <CardRow key={r.id} onClick={() => !r.to && setAdding(r.id)} title={r.old} right={r.to ? null : <Pill tone="warn">누락</Pill>} sub={`${r.src} · ${r.to || "새 주소 없음"}`} />)}</ul>
        </>
      )}
      <Modal open={!!target} onClose={() => setAdding(null)} title="새 주소 연결" sub={target ? `${target.src} · ${target.old}` : ""} footer={<><Button onClick={() => setAdding(null)}>취소</Button><Button variant="primary" onClick={save}>연결 저장</Button></>}>
        <div className="pb-1"><Field id="to" label="새 주소(경로)" error={tried && badTo ? "/ 로 시작하는 경로를 적어 주세요." : null}><input id="to" className="field tnum" value={to} onChange={(e) => setTo(e.target.value)} placeholder="/shop/p/1042" aria-invalid={tried && badTo} /></Field></div>
      </Modal>
    </>
  );
}

/* ── 앱 ── */
function App() {
  const route = useRoute();
  const role = useRole();
  const [orders, setOrders] = useState(ORDERS0);
  const [banners, setBanners] = useState(BANNERS0);
  const [posts, setPosts] = useState(POSTS0);
  const [rates, setRates] = useState(COUNTRIES0);
  const [hist, setHist] = useState(HIST0.map((h, i) => ({ ...h, id: h.id || "h" + (i + 1) })));
  const [rows, setRows] = useState(REDIRECTS0);
  const onReset = () => { setOrders(ORDERS0); setBanners(BANNERS0); setPosts(POSTS0); setRates(COUNTRIES0); setRows(REDIRECTS0); };
  const waiting = orders.filter((o) => o.status === "접수").length;
  const items = [
    { route: "dashboard", label: "대시보드", icon: "grid" },
    { route: "banners", label: "배너·기획전", icon: "image" },
    { route: "orders", label: "주문·신청 처리", icon: "clipboard", badge: () => waiting },
    { route: "rates", label: "묶음배송·요율", icon: "truck" },
    { route: "blog", label: "블로그 관리", icon: "edit" },
    { route: "redirects", label: "301 매핑", icon: "link" },
  ].filter((i) => role.key === "manager" || !ROUTES_MANAGER_ONLY.includes(i.route));
  const blocked = role.key !== "manager" && ROUTES_MANAGER_ONLY.includes(route);
  return (
    <>
      <DemoBar onReset={onReset} />
      <ConsoleShell groups={[{ title: "운영", items }]}>
        {blocked ? <NoAccess>이 화면은 운영 관리자만 볼 수 있습니다. 시연 막대에서 보는 사람을 바꿔 보세요.</NoAccess>
          : route === "banners" ? <Banners banners={banners} setBanners={setBanners} />
          : route === "orders" ? <Orders orders={orders} setOrders={setOrders} role={role} />
          : route === "rates" ? <Rates rates={rates} setRates={setRates} hist={hist} setHist={setHist} />
          : route === "blog" ? <BlogAdmin posts={posts} setPosts={setPosts} />
          : route === "redirects" ? <Redirects rows={rows} setRows={setRows} />
          : <Dashboard orders={orders} banners={banners} posts={posts} />}
      </ConsoleShell>
      <Toaster />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
