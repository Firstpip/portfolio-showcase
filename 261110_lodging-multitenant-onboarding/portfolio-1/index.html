  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */

/* ── 연출 층 (레퍼런스 결, 2026-11-10 3차): 캡처 도구(navigator.webdriver)·?still=1·움직임 줄이기면 모든 연출을 끝 상태로 ── */
const RF_STILL = /[?&]still=1\b/.test(location.search) || navigator.webdriver === true || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function rfStickyTop() {
  let o = 0;
  document.querySelectorAll("body > *, body > * > *").forEach((el) => {
    const cs = getComputedStyle(el);
    if (cs.position !== "sticky" && cs.position !== "fixed") return;
    const r = el.getBoundingClientRect();
    if (r.height > 160 || r.width < innerWidth * 0.8) return;
    const top = parseFloat(cs.top);
    if (isNaN(top) || top > 120) return;
    o = Math.max(o, top + el.offsetHeight);
  });
  return o;
}
/* 화면이 바뀔 때마다 .rf-fade(바로 등장)·.rf-reveal(스크롤 등장)·.rf-w(글자 채움)·.rf-float(히어로 카드) 를 연출한다 */
function useRfMotion(route) {
  useEffect(() => {
    window.scrollTo(0, 0);   // 화면이 바뀌면 맨 위부터(캡처·시연 안내가 스크롤된 상태로 넘어오지 않게)
    const root = document.getElementById("rf-root"); if (!root) return;
    if (RF_STILL || !window.gsap || !window.ScrollTrigger) { root.classList.add("still"); return; }
    root.classList.add("ready");
    gsap.registerPlugin(ScrollTrigger);
    const ctx = gsap.context(() => {
      gsap.from(".rf-fade", { y: 28, opacity: 0, duration: 0.8, delay: 0.15, stagger: 0.1, ease: "power2.out" });
      gsap.from(".rf-float", { y: 36, opacity: 0, duration: 0.9, delay: 0.45, stagger: 0.14, ease: "power3.out" });
      gsap.utils.toArray(".rf-reveal").forEach((t) => gsap.from(t, { y: 48, opacity: 0, duration: 0.9, ease: "power3.out", scrollTrigger: { trigger: t, start: "top 88%", once: true } }));
      const st = document.querySelector(".rf-statement p");
      if (st) gsap.to(".rf-w", { opacity: 1, stagger: 0.6, ease: "none", scrollTrigger: { trigger: st, start: "top 78%", end: "bottom 60%", scrub: 0.4 } });
    }, root);
    const t = setTimeout(() => ScrollTrigger.refresh(), 300);
    return () => { clearTimeout(t); ctx.revert(); };
  }, [route]);
}

function Stepper({ step, done }) {
  return (
    <ol className="grid gap-1">
      {STEPS.map((s, i) => {
        const n = i + 1; const isDone = n <= done && n !== step; const cur = n === step;
        return (
          <li key={s}>
            <button type="button" onClick={() => go("onboarding", { step: String(n) })} aria-current={cur ? "step" : undefined}
              className={cx("flex w-full items-center gap-3 rounded-[var(--r-ctl)] px-3 py-3 text-left transition-colors", cur ? "bg-[var(--n10)] text-[var(--n0)]" : "hover:bg-[var(--n2)]")}>
              <span className={cx("num flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-[13px] font-bold", cur ? "bg-[var(--n0)] text-[var(--n10)]" : isDone ? "bg-[var(--s1-bg)] text-[var(--s1-text)]" : "bg-[var(--n2)] text-[var(--n6)]")}>{isDone ? <Icon name="check" size={15} /> : n}</span>
              <span className={cx("font-semibold", !cur && !isDone && "text-[var(--n6)]")}>{s}</span>
            </button>
          </li>
        );
      })}
    </ol>
  );
}

/* ── 기기 관리 ── */
function Devices({ st, setSt }) {
  const p = useParams();
  const [confirmAll, setConfirmAll] = useState(p.confirm === "all");
  useEffect(() => { setConfirmAll(p.confirm === "all"); }, [p]);
  const unknown = st.devices.find((d) => d.unknown);
  const logout = (d) => { setSt((s) => ({ ...s, devices: s.devices.filter((x) => x.id !== d.id) })); toast(`${d.dev}에서 로그아웃했어요. 그 기기는 다시 로그인해야 해요`); };
  const others = st.devices.filter((d) => !d.current).length;
  const logoutAll = () => { setSt((s) => ({ ...s, devices: s.devices.filter((d) => d.current) })); setConfirmAll(false); toast(`다른 기기 ${others}대에서 로그아웃했어요`); };
  return (
    <main id="main">
      <PageTitle photoIndex={5} sub="이 계정으로 로그인한 기기예요. 모르는 기기는 바로 로그아웃할 수 있어요." right={<Btn onClick={() => setConfirmAll(true)}><Icon name="log-out" size={18} /> 다른 모든 기기 로그아웃</Btn>}>로그인 기기</PageTitle>
      <section className="mx-auto max-w-[1200px] px-4 py-8 sm:px-6 sm:py-10">
        <div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px] lg:gap-10">
          <div className="min-w-0">
            <Panel className="hidden overflow-x-auto md:block">
              <table className="tbl-look">
                <thead><tr><th>기기</th><th>브라우저 · OS</th><th>위치</th><th>마지막 활동</th><th className="relative"><span className="sr-only">동작</span></th></tr></thead>
                <tbody>
                  {st.devices.map((d) => (
                    <tr key={d.id}>
                      <td><span className="flex items-center gap-2.5 font-semibold"><Icon name={d.icon} size={18} className="text-[var(--n6)]" />{d.dev}{d.current && <Chip tone="m">현재 세션</Chip>}{d.unknown && <Chip tone="warn">새 기기</Chip>}</span></td>
                      <td className="text-[var(--n7)]">{d.ua}</td><td className="text-[var(--n7)]">{d.loc}</td><td className="num whitespace-nowrap text-[var(--n7)]">{d.at}</td>
                      <td className="text-right">{d.current ? <span className="text-[13.5px] text-[var(--n6)]">이 기기</span> : <Btn size="sm" onClick={() => logout(d)}>로그아웃</Btn>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Panel>
            <ul className="grid gap-2.5 md:hidden">
              {st.devices.map((d) => (
                <Panel as="li" key={d.id} className="px-5 py-4">
                  <div className="flex items-center justify-between gap-3"><span className="flex items-center gap-2 font-bold"><Icon name={d.icon} size={18} className="text-[var(--n6)]" />{d.dev}</span>{d.current ? <Chip tone="m">현재 세션</Chip> : d.unknown ? <Chip tone="warn">새 기기</Chip> : null}</div>
                  <p className="num mt-1 text-[13.5px] text-[var(--n6)]">{d.ua} · {d.loc} · {d.at}</p>
                  {!d.current && <div className="mt-3"><Btn size="sm" onClick={() => logout(d)}>로그아웃</Btn></div>}
                </Panel>
              ))}
            </ul>
            {st.devices.length === 1 && <Panel className="mt-4 px-5 py-8 text-center" data-empty><p className="text-[var(--n7)]">이 기기만 로그인돼 있어요. 다른 기기에서 로그인하면 여기에 보여요.</p></Panel>}
          </div>
          <aside className="grid content-start gap-5">
            <Panel className="p-5">
              <div className="flex items-start justify-between gap-3">
                <div><h2 className="text-[17px] font-bold">새 기기 로그인 알림</h2><p className="mt-1 text-[13.5px] text-[var(--n6)]">처음 보는 기기에서 로그인하면 메일로 알려요.</p></div>
                <Switch on={st.alert} onChange={(v) => { setSt((s) => ({ ...s, alert: v })); toast(v ? "새 기기 알림을 켰어요" : "새 기기 알림을 껐어요", "info"); }} label="새 기기 로그인 알림" />
              </div>
              <p className="num mt-3 text-[13.5px] text-[var(--n7)]">받는 곳 jian.seo@example.com</p>
            </Panel>
            {unknown && (
              <Panel className="p-5">
                <div className="flex items-center gap-2"><Icon name="bell-ring" size={18} className="text-[var(--s3)]" /><h2 className="text-[16px] font-bold">어제 받은 알림</h2></div>
                <div className="mt-3"><KV rows={[["기기", unknown.dev], ["시각", unknown.at], ["위치", unknown.loc]]} /></div>
                <div className="mt-4 flex flex-wrap gap-2">
                  <Btn size="sm" onClick={() => { setSt((s) => ({ ...s, devices: s.devices.map((d) => d.id === unknown.id ? { ...d, unknown: false } : d) })); toast("이 기기를 내 기기로 표시했어요"); }}>내가 로그인했어요</Btn>
                  <Btn size="sm" kind="danger" onClick={() => { logout(unknown); toast("비밀번호 변경 안내 메일을 보냈어요", "info"); }}>계정 보호</Btn>
                </div>
              </Panel>
            )}
          </aside>
        </div>
      </section>
      <Modal open={confirmAll} onClose={() => setConfirmAll(false)} title="다른 모든 기기에서 로그아웃할까요" sub={`지금 쓰는 기기를 뺀 ${others}대가 로그아웃돼요`}
        footer={<><Btn kind="ghost" onClick={() => setConfirmAll(false)}>그대로 두기</Btn><Btn kind="danger" onClick={logoutAll}>{others}대 로그아웃</Btn></>}>
        <p className="text-[length:var(--c-body)] text-[var(--n7)]">로그아웃된 기기는 다시 로그인해야 하고, 되돌릴 수 없어요.</p>
      </Modal>
    </main>
  );
}

          </Panel>
          <div className="min-w-0">
            <SectionHead right={<span className="num text-[length:var(--c-small)] text-[var(--n6)]">숙소 {props.filter((x) => x.rooms > 0).length}곳 · 객실 타입 {props.reduce((a, x) => a + x.rooms, 0)}</span>}>가져온 숙소</SectionHead>
            <Panel className="overflow-x-auto">

        </div>
      </section>
    </main>

}

const INIT = () => ({ done: 3, devices: DEVICES0, alert: true, perm: PERM0, team: TEAM0, synced: "오늘 06:00" });
function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const [st, setSt] = useState(INIT);
  const [selected, setSelected] = useState("B-102");
  const biz = useMemo(() => BIZ0.map((b) => b.id === "B-102" ? { ...b, onboard: Math.min(5, Math.max(b.onboard, st.done)) } : b), [st.done]);

  const nav = [{ route: "main", label: "운영 홈" }, { route: "onboarding", label: "온보딩" }, { route: "devices", label: "기기 관리" }, { route: "roles", label: "권한 표" }, { route: "integrations", label: "연동 설정" }];
  return (
    <>
      <DemoBar onReset={reset} />
      <div id="rf-root" className="rf-root">
        <Header nav={nav} />
        {route === "onboarding" ? <Onboarding st={st} setSt={setSt} /> : route === "devices" ? <Devices st={st} setSt={setSt} /> : route === "roles" ? <Roles st={st} setSt={setSt} /> : route === "integrations" ? <Integrations st={st} setSt={setSt} /> : <Home biz={biz} selected={selected} setSelected={setSelected} />}
        <Footer />
      </div>
      <Toaster />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
