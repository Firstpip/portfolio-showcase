const store = (() => {
  let s = { products: seedProducts(), alerts: seedAlerts(), toasts: [], seq: 1 };
  const subs = new Set();
  const set = (n) => { s = { ...s, ...n }; subs.forEach(f => f()); };
  return {
    get: () => s,
    sub: (f) => { subs.add(f); return () => subs.delete(f); },
    reset: () => set({ products: seedProducts(), alerts: seedAlerts(), toasts: [] }),
    setStep(id, idx, status, by, silent) {
      const prod = s.products.find(p => p.id === id); if (!prod) return null;
      const prev = prod.steps[idx - 1]; if (prev === status) return prev;
      const steps = prod.steps.slice(); steps[idx - 1] = status;
      const log = { ...prod.log, [idx]: { by: by || '김태호', at: '11.10 09:47' } };
      const products = s.products.map(p => (p.id === id ? { ...p, steps, log } : p));
      let alerts = s.alerts;
      if (!silent && status !== 'prog' && status !== 'wait') {
        const kind = status === 'hold' ? 'hold' : idx === 20 ? 'done' : 'info';
        alerts = [{ id: 'n' + (s.seq + 1), pid: id, kind, text: `${id} ${prod.name}의 ${STEP_NAMES[idx - 1]} 단계가 ${ST_LABEL[status]}(으)로 바뀌었어요 · ${by || '김태호'}`, at: '11.10 09:47', read: false }, ...alerts];
      }
      set({ products, alerts, seq: s.seq + 1 });
      return prev;
    },
    addProduct(p) { set({ products: [...s.products, p] }); },
    markRead(id) { set({ alerts: s.alerts.map(a => (a.id === id ? { ...a, read: true } : a)) }); },
    readAll() { set({ alerts: s.alerts.map(a => ({ ...a, read: true })) }); },

    dismiss(id) { set({ toasts: s.toasts.filter(t => t.id !== id) }); },
  };
})();

/* ── 1. 공정 현황판 (목록 + 고른 제품 상세) ── */
function Board() {
  const s = useStore(); const p = useParams();
  const DEF = 'W-5023';
  const [filter, setFilter] = useState(p.filter || 'all');
  const [q, setQ] = useState(p.q || '');
  const [stepF, setStepF] = useState(p.step || 'all');
  const [sort, setSort] = useState(p.sort || 'due');
  const [sel, setSel] = useState(p.sel || DEF);
  useEffect(() => { setFilter(p.filter || 'all'); setQ(p.q || ''); setStepF(p.step || 'all'); setSort(p.sort || 'due'); setSel(p.sel || DEF); }, [p]);

  const all = s.products;
  const counts = { all: all.length, today: all.filter(isToday).length, late: all.filter(isLate).length, hold: all.filter(x => !isDone(x) && isHold(x)).length, done: all.filter(isDone).length };
  const rows = useMemo(() => {
    const kw = q.trim().toLowerCase();
    let r = all.filter(x => {
      if (filter === 'today' && !isToday(x)) return false;
      if (filter === 'late' && !isLate(x)) return false;
      if (filter === 'hold' && (isDone(x) || !isHold(x))) return false;
      if (filter === 'done' && !isDone(x)) return false;
      if (filter === 'all' && isDone(x) && false) return false;
      if (stepF !== 'all' && curIdx(x) !== Number(stepF)) return false;
      if (kw && !(`${x.id} ${x.po} ${x.name}`.toLowerCase().includes(kw))) return false;
      return true;
    });
    r = [...r].sort(sort === 'progress' ? (a, b) => doneCount(b) - doneCount(a) : (a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.id < b.id ? -1 : 1));
    return r;
  }, [all, filter, q, stepF, sort]);
  const cur = all.find(x => x.id === sel) || all.find(x => x.id === DEF);
  const chips = [['all', '전체'], ['today', '오늘 출하'], ['late', '지연'], ['hold', '보류'], ['done', '출하완료']];
  const clear = () => { setFilter('all'); setQ(''); setStepF('all'); };

  return (
    <main id="main" className="mx-auto max-w-[1120px] px-4 py-8 sm:px-6 md:py-10">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 className={H1}>공정 현황판</h1>
          <p className="mt-2 text-[length:var(--c-body)] text-[var(--n7)]">11월 10일(화) 09:47 기준 · 진행 중 {all.filter(x => !isDone(x)).length}건</p>
        </div>
        <button type="button" onClick={() => go('register')} className={btnSec}><Icon name="plus" size={16} />제품 등록</button>
      </div>

      <LineFlow products={all} />

      <div className="scroll-x mt-6 -mx-4 flex gap-2 px-4 sm:mx-0 sm:flex-wrap sm:px-0" role="group" aria-label="상태로 거르기">
        {chips.map(([k, label]) => {
          const on = filter === k;
          const warn = (k === 'late' && counts.late > 0);
          return (
            <button key={k} type="button" aria-pressed={on} onClick={() => setFilter(on && k !== 'all' ? 'all' : k)}
              className={cx('chip inline-flex shrink-0 items-center gap-2 rounded-full border px-4 text-[14px] [font-weight:500] h-10', on ? 'border-[var(--m600)] bg-[var(--m50)] text-[var(--m800)]' : 'border-[var(--n4)] bg-[var(--n0)] text-[var(--n8)] hover:bg-[var(--n1)]')}>
              {label}<span className={cx('num', warn && !on ? 'text-[var(--s2-text)]' : on ? 'text-[var(--m700)]' : 'text-[var(--n7)]')}>{counts[k]}</span>
            </button>
          );
        })}
      </div>

      <div className="mt-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_200px_170px]">
        <label className="relative block">
          <span className="sr-only">제품 검색</span>
          <Icon name="search" size={18} className="pointer-events-none absolute left-3.5 top-[11px] text-[var(--n6)]" />
          <input className={cx(inputCls, 'pl-10')} value={q} onChange={e => setQ(e.target.value)} placeholder="PO No, Work No, 제품명 검색" />
        </label>
        <label className="block"><span className="sr-only">공정 단계</span>
          <select className={inputCls} value={stepF} onChange={e => setStepF(e.target.value)}>
            <option value="all">전체 공정</option>
            {STEP_NAMES.map((n, i) => <option key={n} value={String(i + 1)}>{i + 1}. {n}</option>)}
          </select>
        </label>
        <label className="block"><span className="sr-only">정렬</span>
          <select className={inputCls} value={sort} onChange={e => setSort(e.target.value)}>
            <option value="due">출하일 빠른순</option>
            <option value="progress">진행률 높은순</option>
          </select>
        </label>
      </div>

      <div className="mt-6 grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_380px]">
        <section aria-label="제품 목록">
          {rows.length === 0 ? (
            <div data-empty className={cx(card, 'flex flex-col items-start gap-3 p-8')}>
              <p className="text-[length:var(--c-body)] text-[var(--n8)]">조건에 맞는 제품이 없어요</p>
              <button type="button" onClick={clear} className={btnSec}>조건 지우기</button>
            </div>
          ) : (
            <ul className={cx(card, 'divide-y divide-[var(--n3)] overflow-hidden')}>
              {rows.map((x, i) => {
                const on = cur && cur.id === x.id; const d = dayDiff(x.due);
                return (
                  <li key={x.id} className="rise-in" style={{ animationDelay: Math.min(i, 7) * 30 + 'ms' }}>
                    <button type="button" onClick={() => setSel(x.id)} aria-current={on ? 'true' : undefined}
                      className={cx('row-btn block w-full px-[var(--c-card-px)] py-4 text-left', on ? 'bg-[var(--m50)] shadow-[inset_3px_0_0_var(--m600)]' : 'hover:bg-[var(--n1)]')}>
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <div className="flex flex-wrap items-baseline gap-x-3 gap-y-0.5">
                            <span className="num text-[15px] [font-weight:700] text-[var(--n10)]">{x.id}</span>
                            <span className="num text-[length:var(--c-small)] text-[var(--n7)]">{x.po}</span>
                          </div>
                          <p className="mt-0.5 truncate text-[15px] text-[var(--n9)]">{x.name}</p>
                        </div>
                        <div className="shrink-0 text-right">
                          <p className="num text-[14px] text-[var(--n9)]">{fmtDue(x.due)}</p>
                          <p className={cx('num text-[length:var(--c-small)]', isLate(x) ? 'text-[var(--s2-text)] [font-weight:600]' : 'text-[var(--n7)]')}>{isDone(x) ? '출하 완료' : d < 0 ? `${-d}일 지연` : d === 0 ? '오늘 출하' : `${d}일 남음`}</p>
                        </div>
                      </div>
                      <div className="mt-3"><Bar p={x} /></div>
                      <div className="mt-2 flex items-center justify-between gap-3 text-[length:var(--c-small)] text-[var(--n7)]">
                        <span className="truncate">{stepLabel(x)}</span><StateText p={x} />
                      </div>
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
        </section>

        {cur && (
          <aside aria-label="고른 제품 상세" className={cx(card, 'overflow-hidden lg:sticky lg:top-6')}>
            <div className="aspect-[16/9] bg-[var(--n2)]"><img src={PH[cur.ph % PH.length].url} alt={PH[cur.ph % PH.length].alt} loading="lazy" className="h-full w-full object-cover" /></div>
            <div className="p-[var(--c-card-px)] sm:p-5">
              <p className="num text-[length:var(--c-small)] text-[var(--n7)]">{cur.po} · {cur.id}</p>
              <h2 className="mt-1 text-[length:var(--t-section)] [font-weight:700] leading-[1.3] text-[var(--n10)] max-sm:text-[20px]">{cur.name}</h2>
              <dl className="mt-4 grid grid-cols-[88px_minmax(0,1fr)] gap-y-2 text-[length:var(--c-body)]">
                <dt className="text-[var(--n7)]">출하 예정</dt><dd className="num text-[var(--n9)]">{fmtDue(cur.due)}</dd>
                <dt className="text-[var(--n7)]">수량</dt><dd className="num text-[var(--n9)]">{cur.qty}대</dd>
                <dt className="text-[var(--n7)]">담당 라인</dt><dd className="text-[var(--n9)]">{cur.line}</dd>
                <dt className="text-[var(--n7)]">현재 단계</dt><dd className="text-[var(--n9)]">{stepLabel(cur)}</dd>
              </dl>
              <div className="mt-4 border-t border-[var(--n3)] pt-4">
                <div className="flex items-center justify-between text-[length:var(--c-small)] text-[var(--n7)]"><span>공정 진행</span><span className="num">{doneCount(cur)} / 20단계</span></div>
                <ol className="mt-3 grid grid-cols-2 gap-x-4 gap-y-1">
                  {STEP_NAMES.map((n, i) => {
                    const st = cur.steps[i];
                    return (
                      <li key={n} className={cx('flex items-center gap-2 rounded-[var(--r-ctl)] px-1.5 py-1 text-[13px]', st === 'prog' || st === 'hold' ? 'bg-[var(--m50)] text-[var(--n10)] [font-weight:600]' : st === 'done' ? 'text-[var(--n7)]' : 'text-[var(--n6)]')}>
                        {st === 'done' ? <Icon name="check" size={13} /> : st === 'hold' ? <Icon name="pause" size={13} className="text-[var(--s3)]" /> : st === 'prog' ? <Icon name="play" size={13} className="text-[var(--m600)]" /> : <span className="inline-block w-[13px] text-center">·</span>}
                        <span className="truncate"><span className="num">{i + 1}</span> {n}</span>
                      </li>
                    );
                  })}
                </ol>
              </div>
              <button type="button" onClick={() => go('process', { id: cur.id })} className={cx(btnPri, 'mt-5 w-full')}>공정 상태 변경<Icon name="chevron-right" size={16} /></button>
            </div>
          </aside>
        )}
      </div>
    </main>
  );
}

/* ── 2. 제품 등록 ── */
const FILLED = { po: 'PO-261110', work: 'W-5033', name: '인버터 제어반 IC-12', qty: '2', due: '2026-11-27', line: LINES[1] };
const EMPTY = { po: '', work: '', name: '', qty: '', due: '', line: LINES[0] };
function Register() {
  const s = useStore(); const p = useParams();
  const [f, setF] = useState(p.fill ? FILLED : EMPTY);
  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  useEffect(() => { setF(p.fill ? FILLED : EMPTY); setErr({}); }, [p]);
  const up = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!f.po.trim()) er.po = 'PO No를 입력하세요 (예: PO-261110)';
    if (!f.work.trim()) er.work = 'Work No를 입력하세요 (예: W-5033)';
    else if (s.products.some(x => x.id.toLowerCase() === f.work.trim().toLowerCase())) er.work = `${f.work.trim()}는 이미 등록돼 있어요. 다른 Work No를 입력하세요`;
    if (!f.name.trim()) er.name = '제품명을 입력하세요';
    if (!f.qty || Number(f.qty) < 1) er.qty = '수량은 1 이상으로 입력하세요';
    if (!f.due) er.due = '출하 예정일을 선택하세요';
    setErr(er);
    const n = Object.keys(er).length;
    if (n) return;
    setBusy(true);
    setTimeout(() => {
      const id = f.work.trim();
      const np = { id, po: f.po.trim(), name: f.name.trim(), qty: Number(f.qty), due: f.due, line: f.line, ph: s.products.length % 6, steps: mkSteps(1, false), log: mkLog(id.length > 2 && /\d/.test(id) ? id : 'W-5099') };
      store.addProduct(np); setBusy(false);
      store.toast(`${id} 등록 · 공정 20단계가 만들어졌어요`, { action: { label: '현황판 보기', fn: () => go('main', { sel: id }) } });
      go('main', { sel: id });
    }, 500);
  };
  const recent = [...s.products].slice(-3).reverse();
  const nErr = Object.keys(err).length;
  const L = 'mb-1.5 block text-[14px] [font-weight:600] text-[var(--n9)]';
  const E = ({ k }) => err[k] ? <p className="enter-err rise-in mt-1.5 text-[13px] text-[var(--s2-text)]">{err[k]}</p> : null;
  return (
    <main id="main" className="mx-auto max-w-[1120px] px-4 py-8 sm:px-6 md:py-10">
      <h1 className={H1}>제품 등록</h1>
      <p className="mt-2 text-[length:var(--c-body)] text-[var(--n7)]">등록하면 공정 20단계가 함께 만들어져 모든 화면에 바로 나타나요.</p>
      <div className="mt-8 grid items-start gap-8 lg:grid-cols-[minmax(0,1fr)_380px]">
        <form onSubmit={submit} noValidate className={cx(card, 'p-5 sm:p-6')}>
          <div className="grid gap-5 sm:grid-cols-2">
            <div><label className={L} htmlFor="po">PO No</label><input id="po" className={inputCls} value={f.po} onChange={up('po')} aria-invalid={!!err.po} placeholder="PO-261110" /><E k="po" /></div>
            <div><label className={L} htmlFor="work">Work No</label><input id="work" className={inputCls} value={f.work} onChange={up('work')} aria-invalid={!!err.work} placeholder="W-5033" /><E k="work" /></div>
            <div className="sm:col-span-2"><label className={L} htmlFor="pname">제품명</label><input id="pname" className={inputCls} value={f.name} onChange={up('name')} aria-invalid={!!err.name} placeholder="인버터 제어반 IC-12" /><E k="name" /></div>
            <div><label className={L} htmlFor="qty">수량</label><input id="qty" type="number" min="1" className={inputCls} value={f.qty} onChange={up('qty')} aria-invalid={!!err.qty} placeholder="2" /><E k="qty" /></div>
            <div><label className={L} htmlFor="due">출하 예정일</label><input id="due" type="date" className={inputCls} value={f.due} onChange={up('due')} aria-invalid={!!err.due} /><E k="due" /></div>
            <div className="sm:col-span-2"><label className={L} htmlFor="line">담당 라인</label>
              <select id="line" className={inputCls} value={f.line} onChange={up('line')}>{LINES.map(l => <option key={l}>{l}</option>)}</select></div>
          </div>
          <div className="mt-7 flex flex-wrap items-center gap-3">
            <button type="submit" data-loading={busy ? 'true' : undefined} className={btnPri}>제품 등록하기</button>
            <button type="button" onClick={() => { setF(EMPTY); setErr({}); }} className={btnSec}>입력 지우기</button>
            {nErr > 1 && <span className="rise-in text-[13px] text-[var(--s2-text)]">{nErr}곳을 채워 주세요</span>}
          </div>
        </form>
        <div className="grid gap-6">
          <section className={cx(card, 'p-5')} aria-label="등록 후 만들어지는 공정">
            <h2 className="text-[length:var(--c-body)] [font-weight:700] text-[var(--n10)]">만들어지는 공정 20단계</h2>
            <ol className="mt-3 grid grid-cols-2 gap-x-4 gap-y-1.5 text-[13px] text-[var(--n8)]">
              {STEP_NAMES.map((n, i) => <li key={n} className="truncate"><span className="num mr-1.5 text-[var(--n6)]">{i + 1}</span>{n}</li>)}
            </ol>
          </section>
          <section className={cx(card, 'p-5')} aria-label="최근 등록">
            <h2 className="text-[length:var(--c-body)] [font-weight:700] text-[var(--n10)]">최근 등록 제품</h2>
            <ul className="mt-2 divide-y divide-[var(--n3)]">
              {recent.map(x => (
                <li key={x.id}><button type="button" onClick={() => go('main', { sel: x.id })} className="row-btn flex w-full items-center justify-between gap-3 py-3 text-left hover:bg-[var(--n1)]">
                  <span className="min-w-0"><span className="num block text-[14px] [font-weight:600] text-[var(--n10)]">{x.id}</span><span className="block truncate text-[13px] text-[var(--n7)]">{x.name}</span></span>
                  <span className="num shrink-0 text-[13px] text-[var(--n7)]">{fmtDue(x.due)}</span></button></li>
              ))}
            </ul>
          </section>
        </div>
      </div>
    </main>
  );
}

/* ── 3. 공정 상태 변경 ── */
function Process() {
  const s = useStore(); const p = useParams();
  const id = p.id || 'W-5023';
  const prod = s.products.find(x => x.id === id) || s.products[0];
  const [selStep, setSelStep] = useState(Number(p.step) || curIdx(prod) || 1);
  const [pick, setPick] = useState(null);
  const [confirm, setConfirm] = useState(p.confirm || null);
  const [flash, setFlash] = useState(null);
  useEffect(() => {
    setConfirm(p.confirm || null); setPick(null);
    const c = Number(p.step) || Math.min(curIdx(prod), 20);
    setSelStep(c);
    if (p.synced === '1') {
      const pr = store.get().products.find(x => x.id === (p.id || 'W-5023'));
      if (pr && pr.steps[11] !== 'done') { store.setStep(pr.id, 12, 'done', '윤성호'); store.setStep(pr.id, 13, 'prog', '윤성호', true); }
      setFlash(12);
    } else setFlash(null);
  }, [p]);
  const st = prod.steps[selStep - 1];
  const target = pick || st;
  const apply = (idx, status, undoable) => {
    const prev = store.setStep(prod.id, idx, status, '김태호');
    if (prev) store.toast(`${STEP_NAMES[idx - 1]} 단계를 ${ST_LABEL[status]}(으)로 바꿨어요`, undoable ? { undo: () => store.setStep(prod.id, idx, prev, '김태호', true) } : {});
    setPick(null);
  };
  const change = () => { if (target === st) { store.toast('이미 같은 상태예요'); return; } if (target === 'done') setConfirm('done'); else apply(selStep, target, true); };
  const log = prod.log[selStep];
  return (
    <main id="main" className="mx-auto max-w-[1120px] px-4 py-8 sm:px-6 md:py-10">
      <button type="button" onClick={() => go('main', { sel: prod.id })} className={cx(btnGhost, '-ml-3')}><Icon name="arrow-left" size={16} />현황판</button>
      <div className="mt-2 flex flex-wrap items-end justify-between gap-4">
        <div className="min-w-0">
          <h1 className={H1}>{prod.name}</h1>
          <p className="num mt-2 text-[length:var(--c-body)] text-[var(--n7)]">{prod.po} · {prod.id} · 출하 {fmtDue(prod.due)} · {doneCount(prod)}/20단계 완료</p>
        </div>
        <div className="flex items-center gap-3" aria-label="함께 보는 사람">
          <div className="flex -space-x-2">{['김', '박', '윤'].map(n => <span key={n} className="inline-flex h-8 w-8 items-center justify-center rounded-full border-2 border-[var(--n0)] bg-[var(--n2)] text-[12px] [font-weight:600] text-[var(--n8)]">{n}</span>)}</div>
          <span className="text-[length:var(--c-small)] text-[var(--n7)]">지금 3명이 함께 보고 있어요</span>
        </div>
      </div>
      <label className="mt-5 block max-w-[320px]"><span className="sr-only">제품 바꾸기</span>
        <select className={inputCls} value={prod.id} onChange={e => go('process', { id: e.target.value })}>{s.products.filter(x => !isDone(x)).map(x => <option key={x.id} value={x.id}>{x.id} · {x.name}</option>)}</select>
      </label>
      {flash && p.synced === '1' && (
        <div className="rise-in mt-5 flex items-center gap-3 rounded-[var(--r-card)] border border-[var(--m200)] bg-[var(--m50)] px-4 py-3 text-[14px] text-[var(--n9)]" role="status">
          <Icon name="refresh-cw" size={16} className="text-[var(--m700)]" />윤성호님이 방금 도장 단계를 완료로 바꿨어요. 새로고침 없이 이 화면에 반영됐어요.
        </div>
      )}
      <div className="mt-6 grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_400px]">
        <ol className={cx(card, 'divide-y divide-[var(--n3)] overflow-hidden')} aria-label="공정 단계">
          {STEP_NAMES.map((n, i) => {
            const k = i + 1; const sv = prod.steps[i]; const on = k === selStep;
            return (
              <li key={n}>
                <button type="button" onClick={() => { setSelStep(k); setPick(null); }} aria-current={on ? 'step' : undefined}
                  className={cx('row-btn flex w-full items-center gap-3 px-4 py-3 text-left max-sm:min-h-[48px]', on ? 'bg-[var(--m50)] shadow-[inset_3px_0_0_var(--m600)]' : 'hover:bg-[var(--n1)]', flash === k && sv === 'done' && 'step-flash')}>
                  <span className="num w-6 text-right text-[13px] text-[var(--n6)]">{k}</span>
                  <span className={cx('min-w-0 flex-1 truncate text-[15px]', sv === 'wait' ? 'text-[var(--n7)]' : 'text-[var(--n10)] [font-weight:600]')}>{n}</span>
                  <span className={cx('inline-flex items-center gap-1.5 text-[13px]', sv === 'prog' ? 'text-[var(--m700)]' : sv === 'hold' ? 'text-[var(--s3-text)]' : 'text-[var(--n7)]')}>
                    {sv === 'done' && <Icon name="check" size={14} />}{sv === 'hold' && <Icon name="pause" size={14} />}{sv === 'prog' && <Icon name="play" size={14} />}{ST_LABEL[sv]}
                  </span>
                </button>
              </li>
            );
          })}
        </ol>
        <aside className={cx(card, 'p-5 lg:sticky lg:top-6')} aria-label="단계 상세">
          <p className="num text-[length:var(--c-small)] text-[var(--n7)]">{selStep} / 20단계</p>
          <h2 className="mt-1 text-[length:var(--t-section)] [font-weight:700] leading-[1.3] text-[var(--n10)]">{STEP_NAMES[selStep - 1]}</h2>
          <p className="mt-2 text-[length:var(--c-body)] text-[var(--n7)]">현재 {ST_LABEL[st]} · 마지막 변경 {log.by} · <span className="num">{log.at}</span></p>
          <div role="radiogroup" aria-label="바꿀 상태" className="mt-5 grid grid-cols-4 gap-1 rounded-[var(--r-ctl)] bg-[var(--n2)] p-1">
            {['wait', 'prog', 'done', 'hold'].map(k => (
              <button key={k} type="button" role="radio" aria-checked={target === k} onClick={() => setPick(k)}
                className={cx('h-10 rounded-[var(--r-ctl)] text-[14px] [font-weight:500] transition-colors max-sm:min-h-[44px]', target === k ? 'bg-[var(--n0)] text-[var(--n10)] shadow-card' : 'text-[var(--n7)] hover:text-[var(--n10)]')}>{ST_LABEL[k]}</button>
            ))}
          </div>
          <button type="button" onClick={change} className={cx(btnPri, 'mt-5 w-full')}>상태 변경</button>
          <div className="mt-5 border-t border-[var(--n3)] pt-4 text-[length:var(--c-small)] text-[var(--n7)]">
            <p>같은 제품을 보는 사람 3명 · 변경은 모두에게 바로 보여요</p>
          </div>
        </aside>
      </div>
      <Modal open={confirm === 'done'} onClose={() => setConfirm(null)} title={`${STEP_NAMES[selStep - 1]} 단계를 완료로 바꿀까요?`}
        footer={<><button type="button" onClick={() => setConfirm(null)} className={btnSec}>취소</button><button type="button" onClick={() => { setConfirm(null); apply(selStep, 'done', true); }} className={btnPri}>완료로 바꾸기</button></>}>
        <p className="text-[length:var(--c-body)] text-[var(--n8)]"><span className="num">{prod.id}</span> {prod.name}</p>
        <p className="mt-2 text-[length:var(--c-body)] text-[var(--n8)]">{ST_LABEL[st]}에서 완료로 바뀌고, 함께 보는 3명에게 바로 보여요. 알림도 1건 만들어져요.</p>
      </Modal>
    </main>
  );
}

/* ── 4. 알림 센터 ── */
function Alerts() {
  const s = useStore(); const p = useParams();
  const [dlg, setDlg] = useState(p.dlg || null);
  const [tab, setTab] = useState('safari');
  const [push, setPush] = useState(true);
  useEffect(() => { setDlg(p.dlg || null); }, [p]);
  const unread = s.alerts.filter(a => !a.read); const read = s.alerts.filter(a => a.read);
  const open = (a) => { store.markRead(a.id); go('process', { id: a.pid }); };
  const icon = (k) => k === 'late' ? 'triangle-alert' : k === 'hold' ? 'pause' : k === 'done' ? 'truck' : 'bell';
  const tone = (k) => k === 'late' ? 'text-[var(--s2)]' : k === 'hold' ? 'text-[var(--s3)]' : 'text-[var(--n7)]';
  const Row = ({ a }) => (
    <li><button type="button" onClick={() => open(a)} className="row-btn flex w-full items-start gap-3 px-4 py-3.5 text-left hover:bg-[var(--n1)]">
      <Icon name={icon(a.kind)} size={18} className={cx('mt-0.5', tone(a.kind))} />
      <span className="min-w-0 flex-1"><span className={cx('block text-[15px] leading-[1.5]', a.read ? 'text-[var(--n8)]' : 'text-[var(--n10)] [font-weight:600]')}>{a.text}</span><span className="num mt-0.5 block text-[length:var(--c-small)] text-[var(--n7)]">{a.at}</span></span>
      <Icon name="chevron-right" size={16} className="mt-1 text-[var(--n5)]" />
    </button></li>
  );
  const dev = [['아이폰 · 사파리', '홈 화면에 추가한 뒤 푸시 가능'], ['안드로이드 · 크롬', '바로 푸시 가능'], ['PC · 크롬', '바로 푸시 가능']];
  const steps = tab === 'safari' ? ['사파리 하단의 공유 버튼을 눌러요', '“홈 화면에 추가”를 골라요', '이름을 확인하고 추가를 눌러요', '홈 화면의 라인온을 열고 알림을 허용해요'] : ['크롬 오른쪽 위 메뉴를 눌러요', '“홈 화면에 추가” 또는 “앱 설치”를 골라요', '설치를 눌러요', '홈 화면의 라인온을 열고 알림을 허용해요'];
  return (
    <main id="main" className="mx-auto max-w-[1120px] px-4 py-8 sm:px-6 md:py-10">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div><h1 className={H1}>알림 센터</h1><p className="mt-2 text-[length:var(--c-body)] text-[var(--n7)]">읽지 않은 알림 <span className="num">{unread.length}</span>건</p></div>
        <button type="button" onClick={() => { store.readAll(); store.toast('모든 알림을 읽음으로 바꿨어요'); }} className={btnSec} disabled={unread.length === 0}>모두 읽음 처리</button>
      </div>
      <div className="mt-8 grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_380px]">
        <div className="grid gap-6">
          {unread.length > 0 && <section aria-label="읽지 않은 알림"><h2 className="mb-2 text-[length:var(--c-body)] [font-weight:700] text-[var(--n10)]">읽지 않음</h2><ul className={cx(card, 'divide-y divide-[var(--n3)] overflow-hidden')}>{unread.map(a => <Row key={a.id} a={a} />)}</ul></section>}
          <section aria-label="이전 알림"><h2 className="mb-2 text-[length:var(--c-body)] [font-weight:700] text-[var(--n10)]">이전 알림</h2><ul className={cx(card, 'divide-y divide-[var(--n3)] overflow-hidden')}>{read.map(a => <Row key={a.id} a={a} />)}</ul></section>
        </div>
        <section className={cx(card, 'p-5')} aria-label="홈 화면에 추가">
          <h2 className="text-[length:var(--c-body)] [font-weight:700] text-[var(--n10)]">홈 화면에 추가</h2>
          <ul className="mt-3 divide-y divide-[var(--n3)]">
            {dev.map(([n, d]) => <li key={n} className="flex items-center justify-between gap-3 py-2.5 text-[14px]"><span className="text-[var(--n9)]">{n}</span><span className="text-right text-[13px] text-[var(--n7)]">{d}</span></li>)}
          </ul>
          <label className="mt-4 flex items-center justify-between gap-3 text-[15px] text-[var(--n9)]"><span>푸시 알림 받기</span><input type="checkbox" checked={push} onChange={e => { setPush(e.target.checked); store.toast(e.target.checked ? '푸시 알림을 켰어요' : '푸시 알림을 껐어요'); }} /></label>
          <button type="button" onClick={() => setDlg('install')} className={cx(btnPri, 'mt-5 w-full')}><Icon name="smartphone" size={16} />설치 방법 보기</button>
        </section>
      </div>
      <Modal open={dlg === 'install'} onClose={() => setDlg(null)} title="홈 화면에 추가"
        footer={<button type="button" onClick={() => setDlg(null)} className={btnSec}>닫기</button>}>
        <div role="tablist" aria-label="브라우저" className="grid grid-cols-2 gap-1 rounded-[var(--r-ctl)] bg-[var(--n2)] p-1">
          {[['safari', '사파리'], ['chrome', '크롬']].map(([k, l]) => <button key={k} type="button" role="tab" aria-selected={tab === k} onClick={() => setTab(k)} className={cx('h-10 rounded-[var(--r-ctl)] text-[14px] [font-weight:500]', tab === k ? 'bg-[var(--n0)] text-[var(--n10)] shadow-card' : 'text-[var(--n7)]')}>{l}</button>)}
        </div>
        <ol className="mt-4 grid gap-3">{steps.map((t, i) => <li key={t} className="flex gap-3 text-[length:var(--c-body)] text-[var(--n9)]"><span className="num inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[var(--n2)] text-[13px] text-[var(--n8)]">{i + 1}</span>{t}</li>)}</ol>
        {tab === 'safari' && <p className="mt-4 text-[13px] text-[var(--n7)]">아이폰은 홈 화면에 추가한 뒤에만 푸시 알림을 받을 수 있어요.</p>}
      </Modal>
    </main>
  );
}

/* ── 앱 ── */
function App() {
  const route = useRoute();
  useLucide();
  useEffect(() => { window.scrollTo(0, 0); }, [route]);
  return (
    <>
      <DemoBar onReset={() => { store.reset(); store.toast('예시 데이터를 처음 상태로 되돌렸어요'); go('main'); }} />
      <Header route={route} />
      {route === 'register' ? <Register /> : route === 'process' ? <Process /> : route === 'alerts' ? <Alerts /> : <Board />}
      <Footer />
      <Toasts />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
