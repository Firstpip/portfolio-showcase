function slotsFor(date) {
  const d = +date.slice(8);
  if (d % 7 === 1) return [];
  const out = [];
  TIMES.forEach((t, i) => {
    if ((d + i * 3) % 5 === 0) return;
    const teams = i % 3 === 0 ? 2 : 1;
    out.push({ id: date + '-' + t, date, time: t, teams, base: (d * (i + 2)) % (teams + 1), closed: (d + i) % 11 === 0 });
  });
  return out;
}
function slotState(s, rs) {
  const mine = rs.filter(r => r.status !== 'cancelled' && r.date === s.date && r.time === s.time).length;
  const booked = Math.min(s.teams, s.base + mine);
  const left = s.teams - booked;
  const key = s.closed ? 'closed' : left <= 0 ? 'full' : 'open';
  return { key, left, booked, label: key === 'closed' ? '마감' : key === 'full' ? '예약 완료' : '예약 가능' };
}
function dayLeft(date, rs) { return slotsFor(date).reduce((a, s) => { const st = slotState(s, rs); return a + (st.key === 'open' ? st.left : 0); }, 0); }

              const n = +d.slice(8); const left = dayLeft(d, rs); const none = slotsFor(d).length === 0; const past = d < DEMO_TODAY; const sel = d === date;
              return (
                <button key={d} type="button" disabled={past || none} onClick={() => go('booking', { date: d })} aria-pressed={sel} className={cx('flex h-[52px] flex-col items-center justify-center rounded-[var(--r-ctl)] border cursor-pointer', sel ? 'border-[var(--m600)] bg-[var(--m50)] text-[var(--m700)]' : 'border-transparent hover:bg-[var(--n1)] text-[var(--n9)]', (past || none) && 'text-[var(--n5)]')}>
                  <span className="num font-semibold">{n}</span>
                  <span className={cx('num text-[length:var(--c-small)]', left > 0 && !past ? 'text-[var(--m700)]' : 'text-[var(--n5)]')}>{none ? '휴장' : past ? '' : left > 0 ? left : '0'}</span>
                </button>
              );
            })}
          </div>
        </section>
        <section className="space-y-4">
          <div className={cx(card, 'overflow-hidden')}>
            <div className="flex items-center justify-between border-b border-[var(--n3)] px-[var(--c-card-px)] py-3"><h2 className="text-[length:var(--t-section)] font-bold">{fmtKo(date)} 티타임</h2><span className="text-[length:var(--c-small)] text-[var(--n6)]">관리사무소 갱신 기준</span></div>
            {slots.length === 0 ? <div className="px-6 py-10 text-center text-[var(--n7)]" data-empty><p>이 날은 골프장 정기 휴장일이라 등록된 잔여티가 없어요.</p><button type="button" className={cx(btnSec, 'mt-4')} onClick={() => go('booking', { date: dkey(14) })}>가능한 날짜 보기</button></div> : (
              <ul>
                {slots.map(s => {
                  const st = slotState(s, rs); const on = s.id === pickId;
                  return (
                    <li key={s.id} className="border-b border-[var(--n2)] last:border-b-0">
                      <button type="button" disabled={st.key !== 'open'} onClick={() => go('booking', { date, pick: s.id })} aria-pressed={on} className={cx('flex w-full items-center gap-4 px-[var(--c-card-px)] py-3.5 text-left', on ? 'bg-[var(--m50)]' : st.key === 'open' ? 'hover:bg-[var(--n1)] cursor-pointer' : 'opacity-70')}>
                        <span className="num w-14 text-[length:var(--t-section)] font-bold text-[var(--n9)]">{s.time}</span>
                        <span className="flex-1 text-[var(--n7)]">{s.teams}팀 중 <b className="num text-[var(--n9)]">{st.booked}</b>팀 신청</span>
                        <StatusTag k={st.key}>{st.label}</StatusTag>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
          <div className={cx(card, 'flex flex-wrap items-center gap-3 px-[var(--c-card-px)] py-[var(--c-card-py)]')} data-summary>
            {pick && pickSt ? (<><div className="min-w-0 flex-1"><p className="text-[length:var(--c-small)] text-[var(--n6)]">선택한 티타임</p><p className="font-bold text-[var(--n9)]">{fmtKo(date)} {pick.time} · 남은 {pickSt.left}팀</p></div><button type="button" className={btnPri} onClick={() => { setError(''); setConfirm(true); }}>예약 신청하기</button></>) : <p className="text-[var(--n7)]">예약 가능한 시간을 고르면 여기에서 신청할 수 있어요.</p>}
          </div>
        </section>
      </div>
      <Modal open={confirm && !!pick} onClose={() => setConfirm(false)} title="예약 신청 확인" footer={<><button type="button" className={btnSec} onClick={() => setConfirm(false)}>돌아가기</button><button type="button" data-loading={busy ? 'true' : undefined} className={btnPri} onClick={submit}>예약 신청하기</button></>}>
        {pick && (
          <div className="space-y-4">
            <div className="rounded-[var(--r-ctl)] bg-[var(--n1)] px-4 py-3"><p className="font-bold">{fmtKo(date)} {pick.time}</p><p className="text-[var(--n7)]">{ME.name} · {ME.lot}</p></div>
            <label className="block"><span className="mb-1.5 block font-semibold">인원</span><select className={fieldCls} value={form.players} onChange={(e) => setForm({ ...form, players: e.target.value })}>{[1, 2, 3, 4].map(n => <option key={n} value={n}>{n}명</option>)}</select></label>
            <label className="block"><span className="mb-1.5 block font-semibold">연락처</span><input className={fieldCls} aria-invalid={!!error && error.includes('연락처')} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></label>
            <fieldset><legend className="mb-1.5 font-semibold">알림 받는 방법</legend><div className="flex gap-2">{['알림톡', '이메일'].map(c => (<button key={c} type="button" aria-pressed={form.channel === c} onClick={() => setForm({ ...form, channel: c })} className={cx('h-9 rounded-full px-4 font-semibold cursor-pointer', form.channel === c ? 'border border-[var(--m600)] bg-[var(--m50)] text-[var(--m700)]' : 'border border-[var(--n3)] text-[var(--n7)]')}>{c}</button>))}</div></fieldset>
            {error && <p role="alert" className="look-rise rounded-[var(--r-ctl)] bg-[var(--s2-bg)] px-3.5 py-2.5 text-[var(--s2-text)]">{error}</p>}
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ── 내 예약 ── */
function MyRes({ member, onLogin, rs, setRs, toast }) {
  const p = useParams();
  const [tab, setTab] = useState('up');
  const [openId, setOpenId] = useState(p.open || null);
  const [cancelId, setCancelId] = useState(p.cancel ? p.open : null);
  useEffect(() => { setOpenId(p.open || null); setCancelId(p.cancel ? p.open : null); const r = rs.find(x => x.id === p.open); if (r) setTab(r.status === 'confirmed' ? 'up' : 'past'); }, [p]);
  if (!member) return <div className={cx(SEC, 'py-[var(--c-section)]')}><Gate what="내 예약" onLogin={onLogin} /></div>;
  const up = rs.filter(r => r.status === 'confirmed'); const past = rs.filter(r => r.status !== 'confirmed');
  const list = tab === 'up' ? up : past;
  const cur = rs.find(r => r.id === openId); const target = rs.find(r => r.id === cancelId);
  const doCancel = () => {
    const id = target.id; setRs(rs.map(r => r.id === id ? { ...r, status: 'cancelled' } : r)); setCancelId(null);
    toast(fmtKo(target.date) + ' ' + target.time + ' 예약을 취소했어요', () => setRs(prev => prev.map(r => r.id === id ? { ...r, status: 'confirmed' } : r)));
  };
  const tag = (r) => r.status === 'confirmed' ? <StatusTag k="open">예약 확정</StatusTag> : r.status === 'done' ? <StatusTag k="plain">이용 완료</StatusTag> : <StatusTag k="danger">취소됨</StatusTag>;
  return (
    <div className={cx(SEC, 'py-[var(--c-section)]')}>
      <PageTitle title="내 예약" sub={ME.name + ' 님 · ' + ME.lot + ' · 3월에 ' + up.length + '건 예정'} />
      <div role="tablist" className="mb-4 flex gap-1.5">{[['up', '예정 ' + up.length], ['past', '지난 예약 ' + past.length]].map(([k, l]) => (<button key={k} type="button" role="tab" aria-selected={tab === k} onClick={() => { setTab(k); setOpenId(null); }} className={cx('h-9 rounded-full px-4 font-semibold cursor-pointer', tab === k ? 'border border-[var(--m600)] bg-[var(--m50)] text-[var(--m700)]' : 'border border-[var(--n3)] text-[var(--n7)] hover:bg-[var(--n1)]')}>{l}</button>))}</div>
      <div className="grid gap-5 lg:grid-cols-[1fr_1fr]">
        <div className={cx(card, 'overflow-hidden self-start')}>
          {list.length === 0 ? <div className="px-6 py-12 text-center text-[var(--n7)]" data-empty><p>{tab === 'up' ? '예정된 예약이 없어요.' : '지난 예약이 아직 없어요.'}</p><button type="button" className={cx(btnPri, 'mt-4')} onClick={() => go('booking', { date: dkey(14) })}>잔여티 보러 가기</button></div> : (
            <ul className="divide-y divide-[var(--n2)]">{list.map(r => (
              <li key={r.id}><button type="button" onClick={() => go('myres', { open: r.id })} className={cx('flex w-full items-center gap-3 px-[var(--c-card-px)] py-3.5 text-left cursor-pointer', openId === r.id ? 'bg-[var(--m50)]' : 'hover:bg-[var(--n1)]')}><span className="min-w-0 flex-1"><span className="block font-semibold text-[var(--n9)]">{fmtKo(r.date)} {r.time}</span><span className="text-[length:var(--c-small)] text-[var(--n6)]">{r.id} · {r.players}명</span></span>{tag(r)}</button></li>
            ))}</ul>
          )}
        </div>
        <div className={cx(card, 'self-start px-[var(--c-card-px)] py-[var(--c-card-py)]')}>
          {!cur ? <div className="py-10 text-center text-[var(--n6)]" data-empty>예약을 고르면 상세와 알림 내역이 여기에 보여요.</div> : (
            <div className="look-rise" key={cur.id}>
              <div className="flex items-center justify-between gap-3"><h2 className="text-[length:var(--t-section)] font-bold">{fmtKo(cur.date)} {cur.time}</h2>{tag(cur)}</div>
              <dl className="mt-3 divide-y divide-[var(--n2)]">{[['예약 번호', cur.id], ['인원', cur.players + '명'], ['연락처', cur.phone], ['알림 방법', cur.channel], ['접수', cur.at]].map(([k, v]) => (<div key={k} className="flex justify-between gap-4 py-2.5"><dt className="text-[var(--n6)]">{k}</dt><dd className="num font-semibold text-[var(--n9)]">{v}</dd></div>))}</dl>
              <div className="mt-4 rounded-[var(--r-ctl)] bg-[var(--n1)] px-4 py-3 text-[length:var(--c-small)] text-[var(--n7)]"><p className="font-semibold text-[var(--n8)]">알림 발송 내역</p><p className="mt-1">3월 {cur.status === 'cancelled' ? '6일 11:20 취소 안내' : '6일 21:14 예약 완료 안내'}를 {cur.channel}으로 보냈어요.</p></div>
              {cur.status === 'confirmed' && <div className="mt-4 flex justify-end"><button type="button" className={btnSec} onClick={() => go('myres', { open: cur.id, cancel: '1' })}>예약 취소하기</button></div>}
            </div>
          )}
        </div>
      </div>
      <Modal open={!!target} onClose={() => setCancelId(null)} title="예약을 취소할까요?" footer={<><button type="button" className={btnSec} onClick={() => setCancelId(null)}>유지하기</button><button type="button" className={btnPri} onClick={doCancel}>예약 취소하기</button></>}>
        {target && <p className="text-[var(--n8)]">{fmtKo(target.date)} {target.time}, {target.players}명 예약을 취소해요. 취소하면 이 티타임은 바로 다른 이웃이 예약할 수 있는 상태로 돌아가고, 안내가 {target.channel}으로 가요. 취소 직후에는 되돌릴 수 있어요.</p>}
      </Modal>
    </div>
  );
}

function Toasts({ items, onClose }) {
  return (
    <div className="pointer-events-none fixed inset-x-0 bottom-4 z-[70] flex flex-col items-center gap-2 px-4" aria-live="polite">
      {items.map(t => (
        <div key={t.id} className="look-rise pointer-events-auto flex items-center gap-3 rounded-[var(--r-ctl)] bg-[var(--n10)] px-4 py-2.5 text-[var(--n0)] shadow-pop">
          <Ic name="check" size={16} /><span>{t.text}</span>
          {t.undo && <button type="button" className="rounded-[var(--r-ctl)] px-2 py-1 font-bold text-[var(--m200)] hover:bg-white/10 cursor-pointer" onClick={() => { t.undo(); onClose(t.id); }}>되돌리기</button>}
        </div>
      ))}
    </div>
  );
}

function App() {
  const route = useRoute();
  useLucide();
  const [member, setMember] = useState(true);
  const [rs, setRs] = useState(SEED_RES);
  const [toasts, setToasts] = useState([]);
  const toast = (text, undo) => { const id = Math.random().toString(36).slice(2); setToasts(t => [...t, { id, text, undo }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), undo ? 6000 : 3200); };
  const closeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
  const onLogin = () => { setMember(true); toast(ME.name + ' 님으로 로그인했어요'); };
  const reset = () => { setRs(SEED_RES); setMember(true); toast('예시 데이터를 처음 상태로 돌렸어요'); go('main'); };
  const NAV = [['intro', '마을 소개'], ['life', '마을 생활'], ['community', '커뮤니티'], ['booking', '잔여티 예약'], ['myres', '내 예약']];
  const screen = route === 'intro' ? <Intro /> : route === 'life' ? <Life toast={toast} /> : route === 'community' ? <Community member={member} onLogin={onLogin} toast={toast} /> : route === 'booking' ? <Booking member={member} onLogin={onLogin} rs={rs} setRs={setRs} toast={toast} /> : route === 'myres' ? <MyRes member={member} onLogin={onLogin} rs={rs} setRs={setRs} toast={toast} /> : <Home member={member} rs={rs} onLogin={onLogin} />;
  const ph = LOOK_DEMO.photos;
  return (
    <>
      <DemoBar onReset={reset} />
      <header className="sticky top-9 z-40 border-b border-[var(--n3)] bg-[var(--n0)]">
        <div className={cx(SEC, 'flex items-center justify-between')} style={{ height: 'var(--c-nav-h)' }}>
          <button type="button" onClick={() => go('main')} className="cursor-pointer text-[22px] font-extrabold tracking-[-0.05em] text-[var(--m700)]" aria-label="마을 홈으로">솔레이크<span className="ml-1 font-semibold text-[var(--n9)]">빌리지</span></button>
          <div className="flex items-center gap-2">
            {member ? <><span className="hidden text-[var(--n7)] sm:inline">{ME.name} 님 · {ME.lot}</span><button type="button" className={btnGhost} onClick={() => { setMember(false); toast('로그아웃했어요'); }}><Ic name="log-out" size={16} /> 로그아웃</button></> : <button type="button" className={btnSec} onClick={onLogin}><Ic name="user" size={16} /> 입주민 로그인</button>}
          </div>
        </div>
        <nav className={cx(SEC, 'flex gap-1 overflow-x-auto')} aria-label="주 메뉴">
          {NAV.map(([r, l]) => (<button key={r} type="button" onClick={() => go(r)} aria-current={route === r ? 'page' : undefined} className={cx('h-11 shrink-0 border-b-2 px-3.5 font-semibold cursor-pointer', route === r ? 'border-[var(--m600)] text-[var(--m700)]' : 'border-transparent text-[var(--n7)] hover:text-[var(--n9)]')}>{l}</button>))}
        </nav>
      </header>
      <main id="main" className="min-h-[60vh]">{screen}</main>
      <footer className="border-t border-[var(--n3)] bg-[var(--n1)] py-8">
        <div className={cx(SEC, 'flex flex-wrap justify-between gap-4 text-[length:var(--c-small)] text-[var(--n6)]')}>
          <p>솔레이크 빌리지 관리사무소 · 032-555-0142 · 평일 09:00~18:00</p>
          <p>사진 · {ph[0].source} ({ph[0].credit}, {ph[1].credit})</p>
        </div>
      </footer>
      <Toasts items={toasts} onClose={closeToast} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
