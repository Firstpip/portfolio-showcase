function Selection({ toast }) {

  const save = () => { setChanges({ ...changes, [cur.id]: { model: pick, why: reasonText.trim() } }); setModal(null); toast('변경 사유와 함께 기록돼요'); };

        <div className="lk-tabs" role="tablist" aria-label="선정 결과 보기">

          <button type="button" role="tab" aria-selected={tab === 'exception'} onClick={() => go('selection', { tab: 'exception' })}>예외 {exCount}</button>

        <div className="lk-two">
          <ul className="lk-rows lk-sel" role="list">
            {list.map(s => {
              const ch = changes[s.id]; const st = s.st === 'none' ? ST.error : ST[s.st];
              return (
                <li key={s.id}>
                  <button type="button" className="lk-row sel" aria-pressed={cur && cur.id === s.id} onClick={() => go('selection', { tab, item: s.id })}>
                    <span className="l"><b>{s.tag}</b><small>{s.need}</small></span>
                    <span className="v">{ch ? ch.model : s.model}</span>
                    <Pill cls={ch ? '' : st.cls} icon={ch ? 'pencil' : st.icon}>{ch ? '직접 변경' : s.st === 'ok' ? '조건 통과' : s.st === 'missing' ? '조건 누락' : '후보 없음'}</Pill>
                  </button>
                </li>
              );
            })}
          </ul>
          {cur && (
            <section className="lk-detail card">
              <p className="lk-kicker">{cur.tag} · 적용한 조건</p>
              <h3 className="lk-h3">{changes[cur.id] ? changes[cur.id].model : cur.model}</h3>
              <ul className="lk-rules" role="list">
                {cur.rules.map(([t, ok], i) => (<li key={i}><Icon name={ok === true ? 'check' : ok === false ? 'x' : 'circle-help'} size={16} /><span>{t}</span><em>{ok === true ? '통과' : ok === false ? '미통과' : '확인 불가'}</em></li>))}
              </ul>
              {changes[cur.id] && <p className="lk-ok"><Icon name="pencil" size={16} />사유 · {changes[cur.id].why}</p>}
              <div className="lk-btnrow left"><button type="button" className="lk-btn sec" onClick={() => go('selection', { tab, item: cur.id, modal: 'reason' })}>모델 직접 변경</button></div>
            </section>
          )}
        </div>
      </div>
      {modal === 'reason' && cur && (
        <div className="lk-overlay" onClick={(e) => { if (e.target === e.currentTarget) go('selection', { tab, item: cur.id }); }}>
          <div className="lk-dialog" role="dialog" aria-modal="true" aria-labelledby="rs-t">
            <h3 id="rs-t">{cur.tag} 모델을 직접 바꿔요</h3>
            <label className="lk-label" htmlFor="rs-m">변경할 모델</label>
            <select id="rs-m" className="lk-input" value={pick} onChange={(e) => setPick(e.target.value)}>{MODELS.map(m => <option key={m}>{m}</option>)}</select>
            <label className="lk-label" htmlFor="rs-r">변경 사유</label>
            <textarea id="rs-r" className="lk-input area" rows={3} value={reasonText} onChange={(e) => setReasonText(e.target.value)} placeholder="고객사와 협의한 내용을 적어 주세요" aria-invalid={reasonText === '' ? 'true' : undefined} />
            <p className="lk-small">사유를 적어야 저장돼요.</p>
            <div className="lk-btnrow"><button type="button" className="lk-btn sec" onClick={() => go('selection', { tab, item: cur.id })}>닫기</button><button type="button" className="lk-btn pri" disabled={!reasonText.trim()} onClick={save}>저장하기</button></div>
          </div>
        </div>
      )}
    </main>
  );
}

        <ul className="lk-rows" role="list">
          {VERS.map(x => (
            <li key={x.id}><button type="button" className="lk-row ver" aria-pressed={ver === x.id} onClick={() => go('versions', { ver: x.id })}>
              <span className="l"><b>{x.label}</b><small>{x.when} · {x.who}</small></span><span className="v">{x.why}</span><Pill cls={x.latest ? 's1' : ''} icon={x.latest ? 'check' : 'clock'}>{x.latest ? '최신' : '이전'}</Pill></button></li>
          ))}
        </ul>
        {cmp && (
          <section className="lk-detail card lk-gap" aria-label="버전 비교">
            <p className="lk-kicker">v3 와 v2 · 바뀐 항목 3개</p>
            <table className="lk-table wide"><thead><tr><th scope="col">항목</th><th scope="col">v2</th><th scope="col">v3</th></tr></thead><tbody>
              {DIFF.map(d => (<tr key={d.item}><th scope="row">{d.item}</th><td className="num">{d.a}</td><td className="num"><b>{d.b}</b></td></tr>))}
            </tbody></table>
          </section>
        )}
        {v && (
          <section className="lk-detail card lk-gap" aria-label="이전 버전 상세">
            <p className="lk-kicker">{v.label} · 읽기 전용</p>
            <h3 className="lk-h3">{v.when}</h3>
            <p className="lk-note">당시 입력 데이터와 규칙 기준으로 남은 선정 결과예요. 기준이 바뀐 뒤에도 같은 근거로 열려요.</p>
            <div className="lk-btnrow left"><button type="button" className="lk-btn sec" onClick={() => toast(v.label + ' 문서를 다시 받아요')}>문서 다시 받기</button></div>
          </section>
        )}
      </div>
    </main>
  );
}

function App() {
  const route = useRoute();
  const [msg, setMsg] = useState('');
  useLucide();
  useRfMotion(route);
  useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(''), 2200); return () => clearTimeout(t); }, [msg]);
  const toast = (m) => setMsg(m);
  return (
    <>
      <DemoBar onReset={() => { go('main'); }} />
      <div id="rf-root" className="rf-root" data-tone="light">
        <Header route={route} />
        {route === 'selection' ? <Selection toast={toast} /> : route === 'documents' ? <Documents toast={toast} /> : route === 'versions' ? <Versions toast={toast} /> : <Home toast={toast} />}
        <Footer />
      </div>
      {msg && <div className="look-toast" role="status" aria-live="polite">{msg}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
