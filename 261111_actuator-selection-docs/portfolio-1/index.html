            <p className="rf-fade m-0 mt-5 flex items-center gap-2 text-[13px] text-[var(--n5)]">입력 형식<span className="grid h-[28px] w-[28px] place-items-center rounded-full bg-[var(--n9)] text-[var(--n1)]"><Icon name="file-spreadsheet" size={14} /></span><span className="grid h-[28px] w-[28px] place-items-center rounded-full bg-[var(--n9)] text-[var(--n1)]"><Icon name="file-text" size={14} /></span><span className="grid h-[28px] w-[28px] place-items-center rounded-full bg-[var(--n9)] text-[var(--n1)]"><Icon name="ruler" size={14} /></span></p>
          </div>
        </div>
        <div className="mx-[80px] mt-[56px] rounded-t-[48px] bg-[var(--n2)] px-12 pb-[40px] pt-[52px] text-[var(--n10)] max-[900px]:mx-3 max-[900px]:px-5">
          <p className="m-0 text-center text-[length:clamp(16px,1.4vw,20px)] leading-[26px] text-[var(--n10)]">접수에서 문서 출력까지 이어지는 입력 형식<br />고객사 양식마다 읽을 <strong className="font-semibold">위치</strong>를 데이터로 저장합니다.</p>
          <ul className="m-0 mt-10 grid list-none grid-cols-5 gap-3 p-0 max-[900px]:grid-cols-2">{fmts.map(([ic, a, b]) => <li key={a} className="rounded-[14px] bg-[var(--n1)] px-4 py-5 shadow-card"><Icon name={ic} size={20} /><p className="m-0 mt-5 text-[15px] font-medium text-[var(--n10)]">{a}</p><p className="m-0 text-[13px] text-[var(--n7)]">{b}</p></li>)}</ul>
        </div>
      </section>
      {/* dashboard */}
      <section data-ref="dashboard" className="bg-[var(--n1)] pb-[64px] pt-[56px]" style={{ minHeight: 1020 }}>
        <div className="mx-auto max-w-[1184px] px-5 text-center">
          <h2 className={cx(D1, "rf-reveal m-0")}>선정 담당자가<br />하나의 화면에서 일합니다</h2>
          <p className="rf-reveal m-0 mt-6 text-[length:clamp(16px,1.4vw,20px)] leading-[26px] text-[var(--n10)]">접수한 자료의 값을 확인하고, 규칙으로 고른 모델과 근거를 보고,<br className="max-[900px]:hidden" /> 문서와 이전 버전까지 같은 화면에서 이어서 확인합니다.</p>
          <div role="tablist" aria-label="제품 화면" className="mt-10 flex flex-wrap justify-center gap-3">{TABS.map(([k, t]) => <button key={k} type="button" role="tab" aria-selected={tab === k} onClick={() => pick(k)} className={cx("h-[46px] rounded-[12px] border-0 px-5 text-[16px] cursor-pointer", tab === k ? "bg-[var(--m600)] text-[var(--on-main)]" : "bg-[var(--n2)] text-[var(--n10)]")}>{t}</button>)}</div>
          <div className="text-left" style={{ minHeight: 780 }}>{tab === "selection" ? <SelectionMock /> : tab === "docs" ? <DocMock /> : tab === "versions" ? <VerMock /> : <IntakeMock />}</div>
        </div>
      </section>
      {/* forms */}
      <section data-ref="forms" className="bg-[var(--n1)] px-5 pb-[56px] pt-[96px]" style={{ minHeight: 519 }}>
        <h2 className="rf-reveal m-0 text-center text-[length:clamp(30px,3.4vw,48px)] font-medium leading-[1.04] tracking-[-0.031em] text-[var(--n10)]">무엇을 선정하고 싶으신가요?</h2>
        <div className="mx-auto mt-6 max-w-[640px]">
          <label className="block"><span className="sr-only">선정 요청 입력</span><textarea value={q} onChange={e => setQ(e.target.value)} placeholder="예: 24V·스트로크 100mm·추력 800N 조건의 모델을 찾아 주세요" className="block h-[160px] w-full resize-none rounded-[28px] border border-[var(--n3)] bg-[var(--n1)] px-6 py-5 text-[16px] text-[var(--n10)] shadow-card placeholder:text-[var(--n6)]" /></label>
          <div className="mx-3 -mt-1 flex items-center gap-2 rounded-b-[20px] bg-[var(--n2)] px-3 pb-3 pt-4">
            <div className="flex flex-1 flex-wrap gap-2">{chips.map(([t, v]) => <button key={t} type="button" onClick={() => setQ(v)} className="h-[38px] rounded-[10px] border-0 bg-[var(--n1)] px-4 text-[14px] text-[var(--n8)] cursor-pointer">{t}</button>)}</div>
            <button type="button" aria-label="요청 보내기" onClick={() => go(q.includes("v2와") ? "versions" : "main", q.includes("v2와") ? { view: "compare" } : { view: "extract" })} className="grid h-[40px] w-[48px] place-items-center rounded-[10px] border-0 bg-[var(--n10)] text-[var(--n1)] cursor-pointer"><Icon name="arrow-right" size={16} /></button>
          </div>
        </div>
      </section>
      <Feat role="features" first bg="bg-[var(--n2)]" tag="접수" l1="자료에서 필요한 값만" l2="표 하나로 모읍니다" body="엑셀 요청서와 텍스트 PDF 사양서에서 정해진 위치의 값만 읽어 옵니다. 값이 빠졌는지는 올리는 즉시 항목별로 알려 드립니다." icons={["file-spreadsheet", "file-text", "table"]} proof="양식별 읽을 위치를 데이터로 저장해, 새 고객사 양식도 코드 수정 없이 추가하도록 설계합니다." cta={["자료 올리기", "main", { view: "extract" }]} link={["처음 화면 보기", "main"]} photo={0} alt="공장 라인에 놓인 공압 실린더" />
      <Feat role="features-2" bg="bg-[var(--n3)]" tag="선정" l1="규칙으로 모델을 고르고" l2="근거를 함께 남깁니다" body="정격 전압·스트로크·추력·보호 등급 같은 조건을 규칙으로 평가해 항목별 적합 모델을 고릅니다. 통과한 조건과 빠진 조건이 결과 옆에 보입니다." icons={["list-checks", "triangle-alert", "refresh-cw"]} proof="입력이 바뀌면 그 값에 걸린 규칙만 다시 평가하고, 달라진 결과를 표시하도록 구현합니다." cta={["선정 결과 보기", "selection"]} link={["예외 건 보기", "selection", { tab: "exceptions" }]} photo={2} alt="유압 배관과 실린더 로드" />
      <Feat role="features-3" bg="bg-[var(--n2)]" tag="문서" l1="선정 결과 하나로" l2="문서를 한 번에" body="선정리스트·데이터시트·외형도·회로도를 같은 선정 결과 기준으로 만들어 모델명과 리비전이 서로 어긋나지 않게 합니다." icons={["file-check", "ruler", "file-down"]} proof="기존 데이터시트 양식 위에 값을 얹고, 도면은 PDF 변환본 기준으로 문구를 맞춥니다." cta={["기술문서 보기", "documents"]} link={["도면 리비전 보기", "documents", { tab: "drawing" }]} photo={3} alt="모터 고정자 코일" />
      <Feat role="features-4" bg="bg-[var(--n3)]" tag="이력" l1="규칙이 바뀌어도" l2="이전 선정을 다시 엽니다" body="버전마다 입력·결과·문서와 당시의 기준 정보를 함께 저장해, 이전 버전의 근거와 문서를 그대로 다시 받을 수 있게 합니다." icons={["history", "git-compare", "archive"]} proof="두 버전을 고르면 바뀐 항목만 나란히 보여 주는 비교 화면을 구현합니다." cta={["버전 이력 보기", "versions"]} link={["버전 비교", "versions", { view: "compare" }]} photo={4} alt="맞물린 기어" />
      <section data-ref="features-5" className="bg-[var(--n1)] px-3 pb-[40px] pt-[24px]">
        <div className="mx-auto max-w-[1280px] rounded-[48px] bg-[var(--n2)] px-12 pb-12 pt-12 max-[900px]:px-5">
          <div className="grid grid-cols-2 gap-10 max-[900px]:grid-cols-1">
            <div>
              <p className="m-0 text-[12px] font-medium text-[var(--m700)]">선정 업무 전체</p>
              <h2 className={cx(D2, "rf-reveal m-0 mt-4 text-[var(--n10)]")}>접수부터 문서까지<br /><span className="text-[var(--m600)]">한 흐름으로 이어집니다</span></h2>
              <button type="button" onClick={() => go("main", { view: "extract" })} className="mt-5 inline-flex items-center gap-2 border-0 border-b border-[var(--n10)] bg-transparent p-0 pb-[2px] text-[15px] text-[var(--n10)] cursor-pointer">의뢰 시작하기<Icon name="arrow-right" size={14} /></button>
            </div>
            <div>
              <p className="rf-reveal m-0 text-[length:clamp(16px,1.4vw,20px)] leading-[26px] text-[var(--n10)]">규칙에 맞는 선정은 자동으로, 조건이 빠졌거나 후보가 없는 항목은 예외로 모아 담당자가 판단합니다.</p>
              <div className="mt-6 flex items-center gap-4"><Cluster icons={["scan-search", "file-warning", "user-check"]} /><p className="m-0 max-w-[290px] text-[13px] leading-[18px] text-[var(--n7)]">스캔본 PDF는 별도 OCR 단계로 범위를 나눠 협의합니다.</p></div>
            </div>
          </div>
          <div className="rf-zoom relative mt-9 h-[534px] overflow-hidden rounded-[24px] bg-[var(--n3)] max-[900px]:h-[300px]"><img src={P(7)} alt="모터 단면 모형" className="absolute inset-0 h-full w-full object-cover" /></div>
        </div>
      </section>
      <section data-ref="testimonials" className="bg-[var(--n1)] pb-[72px] pt-[64px]" style={{ minHeight: 805 }}>
        <h2 className="rf-reveal m-0 text-center text-[length:clamp(26px,2.9vw,42px)] font-medium leading-[1.04] tracking-[-0.031em] text-[var(--n10)]">이렇게 쓰이는<br />선정 포털입니다</h2>
        <div className="relative mx-auto mt-10 h-[532px] max-w-[1184px] overflow-hidden max-[900px]:h-[380px]">
          <div className="absolute top-0 h-full rounded-[28px] bg-[var(--n3)] p-6 max-[900px]:hidden" style={{ left: "-837px", width: 947 }}><p className="m-0 text-right text-[15px] text-[var(--n8)]">예외 건을 모아 보는 장면</p></div>
          <div className="rf-zoom absolute top-0 h-full overflow-hidden rounded-[28px] bg-[var(--n3)] max-[900px]:!left-3 max-[900px]:!w-[calc(100%-24px)]" style={{ left: 118, width: 947 }}>
            <img src={P(6)} alt="유압 실린더와 조작부" className="absolute inset-0 h-full w-full object-cover" />
            <div aria-hidden="true" className="absolute inset-0" style={{ background: "linear-gradient(180deg, transparent 55%, color-mix(in oklab, var(--n10) 62%, transparent) 100%)" }} />
            <p className="absolute inset-x-8 bottom-7 m-0 text-[length:clamp(15px,1.5vw,20px)] leading-[1.45] text-[var(--n1)]">설비 담당자가 고객사 자료를 올리고, 누락된 값을 채운 뒤 선정리스트와 데이터시트를 한 번에 내려받는 장면입니다.</p>
          </div>
          <div className="absolute top-0 h-full rounded-[28px] bg-[var(--n2)] p-6 max-[900px]:hidden" style={{ left: 1073, width: 947 }}><p className="m-0 text-[15px] text-[var(--n8)]">이전 버전을 다시 여는 장면</p></div>
        </div>
      </section>
    </main>
  );
}

/* ── 앱 ── */
function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const body = route === "selection" ? <Selection /> : route === "documents" ? <Documents /> : route === "versions" ? <Versions /> : <Home />;
  return (
    <>
      <DemoBar onReset={() => { go("main"); }} />
      <div id="rf-root" className="rf-root" data-tone="light">
        <Header route={route} />
        {body}
        <Footer />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
