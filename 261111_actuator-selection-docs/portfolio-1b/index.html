        <div className="rf-head"><div><h2 className="rf-h2 sm">최근 선정 이력</h2><p className="sub-t mt-1">행을 누르면 그때의 입력 조건이 위 작업 화면에 복원돼요</p></div></div>
        <div className="card overflow-x-auto"><table className="tbl"><thead><tr><th>프로젝트</th><th>고객사</th><th>선정 모델</th><th>사용 문서</th><th>작성자</th><th>일시</th></tr></thead>
          <tbody>{RECENT.map((r) => <tr key={r[0]} className="clk" tabIndex={0} onClick={() => { setSpec(r[6]); window.scrollTo({ top: 0, behavior: RF_STILL ? "auto" : "smooth" }); notify(r[0] + " 조건을 불러왔어요"); }} onKeyDown={(e) => { if (e.key === "Enter") { setSpec(r[6]); notify(r[0] + " 조건을 불러왔어요"); } }}><td className="font-semibold">{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td><td>{r[3]}</td><td>{r[4]}</td><td className="num text-[var(--n7)]">{r[5]}</td></tr>)}</tbody></table></div>
      </div></section>

      <section className="rf-sec rf-reveal"><div className="rf-in">
        <h2 className="rf-h2 sm mb-8">선정은 세 단계로 끝나요</h2>
        <ol className="grid md:grid-cols-3 gap-6 list-none p-0 m-0">{[["file-up", "조건 입력", "접수 자료에서 정해진 값을 불러오고 누락 항목을 표시해요."], ["list-checks", "자동 선정", "규칙으로 항목별 적합 모델과 적용 조건을 보여 줘요."], ["file-text", "문서 생성", "같은 선정 결과로 선정리스트·데이터시트·도면을 맞춰요."]].map(([ic, t, d], i) => <li key={t} className="border-t-2 border-[var(--n9)] pt-5"><div className="flex items-center gap-3 mb-2"><span className="num text-[28px] font-extrabold text-[var(--m600)]">{i + 1}</span><Icon name={ic} size={22} className="text-[var(--n8)]" /></div><b className="text-[17px] block mb-1">{t}</b><p className="text-[var(--n7)] leading-[1.65]">{d}</p></li>)}</ol>
      </div></section>
    </>
  );
}

/* ── 선정 결과 ── */
function Selection({ rerun, setRerun, over, setOver, log, setLog, selId, setSelId, notify }) {
  const p = useParams();
  const [tab, setTab] = useState("all");
  const [dlg, setDlg] = useState(false);
  const [pick, setPick] = useState("");
  const [why, setWhy] = useState("");
  useEffect(() => { setTab(p.tab || "all"); if (p.item) setSelId(p.item); setDlg(p.dialog === "change"); }, [p]);
  const items = itemsFor(rerun);
  const base = itemsFor(false).map((it) => solveItem(it, {}).code);
  const rows = items.map((it, i) => ({ ...solveItem(it, over), prev: rerun ? base[i] : null }));
  const shown = rows.filter((r) => tab === "all" || r.exc);
  const sel = rows.find((r) => r.it.id === selId) || rows[0];
  const excN = rows.filter((r) => r.exc).length;
  const openDlg = () => { setPick(sel.code || MODELS[0].code); setWhy(""); setDlg(true); };
  const save = () => { if (!why.trim()) return; setOver((o) => ({ ...o, [sel.it.id]: { code: pick } })); setLog((l) => [{ id: sel.it.id, from: sel.code || "후보 없음", to: pick, why: why.trim() }, ...l]); setDlg(false); notify(sel.it.id + " 모델을 " + pick + "(으)로 바꿨어요"); };
  return (
    <>
      <SubHead route="selection" title="선정 결과" sub="규칙을 적용한 항목별 적합 모델과 적용 조건이에요. 고객사 데이터가 바뀌면 바뀐 조건만 다시 선정해요." right={<button type="button" className="btn btn-sec" onClick={() => { setRerun(true); notify("바뀐 조건만 다시 선정했어요"); }} disabled={rerun}><Icon name="refresh-cw" size={16} />{rerun ? "재선정 완료" : "바뀐 자료 재선정"}</button>} />
      <main id="main" className="rf-in py-8 pb-16">
        <div className="flex gap-2 mb-4" role="tablist" aria-label="선정 보기">{[["all", "전체 " + rows.length], ["exception", "예외 " + excN]].map(([k, t]) => <button key={k} type="button" role="tab" className="chip" aria-selected={tab === k} aria-pressed={tab === k} onClick={() => setTab(k)}>{t}</button>)}</div>
        <div className="grid lg:grid-cols-[minmax(0,1fr)_360px] gap-6 items-start">
          <div className="card overflow-x-auto"><table className="tbl"><thead><tr><th>항목</th><th>요구 사양</th><th>선정 모델</th><th>판정</th></tr></thead>
            <tbody>{shown.map((r) => <tr key={r.it.id} className="clk" aria-selected={sel.it.id === r.it.id ? "true" : undefined} tabIndex={0} onClick={() => setSelId(r.it.id)} onKeyDown={(e) => { if (e.key === "Enter") setSelId(r.it.id); }}>
              <td className="font-semibold">{r.it.id} · {r.it.name}</td><td className="num text-[13px] text-[var(--n7)]">{fmtNum(Number(r.it.load))} N · {r.it.stroke} mm · {r.it.speed} mm/s</td>
              <td>{r.code ? <b>{r.code}</b> : <span className="text-[var(--n7)]">후보 없음</span>}{r.prev && r.prev !== r.code && <div className="text-[12px] text-[var(--m700)]">변경 전 {r.prev || "후보 없음"}</div>}{r.manual && <div className="text-[12px] text-[var(--n7)]">담당자 변경</div>}</td>
              <td>{r.exc ? <span className="pill dark"><Icon name="triangle-alert" size={13} />{r.exc}</span> : <StPill st={r.ev.status} />}</td></tr>)}
              {shown.length === 0 && <tr><td colSpan={4} className="text-center text-[var(--n7)] py-10" data-empty>예외 건이 없어요</td></tr>}</tbody></table></div>
          <aside className="card p-5 flex flex-col gap-4 lg:sticky lg:top-[170px]" aria-label="선정 근거">
            <div><b className="text-[17px]">{sel.it.id} · {sel.it.name}</b><p className="sub-t mt-1">{sel.code ? "선정 모델 " + sel.code : "선정 가능한 모델이 없어요"}</p></div>
            {sel.ev ? <ul className="flex flex-col gap-2 text-[13px]">{sel.ev.checks.map((c) => <li key={c.k} className="flex gap-2"><Icon name={c.skip ? "minus" : c.ok ? "circle-check" : "circle-x"} size={15} className={c.ok || c.skip ? "text-[var(--n7)]" : "text-[var(--s2)]"} /><span><b>{c.k}</b> · {c.txt}</span></li>)}</ul> : <p className="text-[13px] text-[var(--n7)] leading-[1.6]">하중 {fmtNum(Number(sel.it.load))} N을 만족하는 모델이 없어요. 사양을 고객사와 다시 확인해야 해요.</p>}
            {sel.exc && <p className="pill dark !h-auto !py-1.5 !whitespace-normal"><Icon name="triangle-alert" size={13} />{sel.exc}</p>}
            <button type="button" className="btn btn-sec btn-sm" onClick={openDlg}><Icon name="pencil" size={15} />모델 변경</button>
            {log.length > 0 && <div className="border-t border-[var(--n3)] pt-3 text-[12.5px] flex flex-col gap-2"><b>변경 이력</b>{log.map((l, i) => <p key={i} className="leading-[1.55] text-[var(--n8)]">{l.id} · {l.from} 에서 {l.to} · 사유: {l.why}</p>)}</div>}
            <button type="button" className="btn btn-pri" onClick={() => go("documents", { tab: "list" })}>기술문서 만들기<Icon name="arrow-right" size={16} /></button>
          </aside>
        </div>
      </main>
      {dlg && (
        <div className="dlg-bg" role="dialog" aria-modal="true" aria-labelledby="chg-t" onClick={(e) => { if (e.target === e.currentTarget) setDlg(false); }}>
          <div className="card w-[min(460px,100%)] p-6 flex flex-col gap-4 !rounded-[var(--r-modal)] enter">
            <h2 id="chg-t" className="ttl !text-[20px]">{sel.it.id} 모델 변경</h2>
            <div className="fld"><label htmlFor="chg-m">변경할 모델</label><select id="chg-m" className="inp" value={pick} onChange={(e) => setPick(e.target.value)}>{MODELS.map((m) => <option key={m.code}>{m.code}</option>)}</select></div>
            <div className="fld"><label htmlFor="chg-w">변경 사유 (필수)</label><textarea id="chg-w" className="inp" rows={3} value={why} onChange={(e) => setWhy(e.target.value)} placeholder="예: 고객사 요청으로 상위 모델 적용" aria-invalid={why.trim() === "" ? "true" : undefined} /><span className="text-[12px] text-[var(--n7)]">사유를 적어야 저장할 수 있어요</span></div>
            <div className="flex justify-end gap-2"><button type="button" className="btn btn-sec btn-sm" onClick={() => setDlg(false)}>취소</button><button type="button" className="btn btn-pri btn-sm" disabled={why.trim() === ""} onClick={save}>저장하기</button></div>
          </div>
        </div>
      )}
    </>
  );
}

/* ── 기술문서 출력 ── */
function Documents({ over, selId, spec, notify }) {
  const p = useParams();
  const [tab, setTab] = useState("list");
  const [fixed, setFixed] = useState(false);
  useEffect(() => { setTab(p.tab || "list"); }, [p]);
  const rows = itemsFor(false).map((it) => solveItem(it, over));
  const cur = rows.find((r) => r.it.id === selId) || rows[0];
  const code = cur.code || "AL-63S"; const m = MODELS.find((x) => x.code === code);
  const TABS = [["list", "선정리스트"], ["datasheet", "데이터시트"], ["drawing", "외형도·회로도"]];
  return (
    <>
      <SubHead route="documents" title="기술문서 출력" sub="하나의 선정 결과를 기준으로 선정리스트·데이터시트·도면의 모델명과 리비전을 맞춰요." right={<button type="button" className="btn btn-pri" onClick={() => notify("프로젝트 문서 묶음 내려받기를 시작했어요")}><Icon name="download" size={16} />묶음 내려받기</button>} />
      <main id="main" className="rf-in py-8 pb-16 flex flex-col gap-5">
        <div className="flex gap-2 flex-wrap" role="tablist" aria-label="문서 종류">{TABS.map(([k, t]) => <button key={k} type="button" role="tab" className="chip" aria-selected={tab === k} aria-pressed={tab === k} onClick={() => setTab(k)}>{t}</button>)}</div>
        {tab === "list" && (
          <section className="enter grid lg:grid-cols-[minmax(0,1fr)_300px] gap-6 items-start"><div className="card overflow-x-auto"><table className="tbl"><thead><tr><th>항목</th><th>선정 모델</th><th>정격 하중</th><th>리비전</th></tr></thead><tbody>{rows.map((r) => { const mm = MODELS.find((x) => x.code === r.code); return <tr key={r.it.id}><td className="font-semibold">{r.it.id} · {r.it.name}</td><td>{r.code || "후보 없음"}</td><td className="num">{mm ? fmtNum(mm.load) + " N" : "-"}</td><td>{mm ? "Rev." + mm.rev : "-"}</td></tr>; })}</tbody></table></div>
            <div className="card p-5 flex flex-col gap-3"><b>선정리스트 내려받기</b><button type="button" className="btn btn-sec btn-sm" onClick={() => notify("엑셀 내려받기를 시작했어요")}><Icon name="file-spreadsheet" size={15} />엑셀로 받기</button><button type="button" className="btn btn-sec btn-sm" onClick={() => notify("PDF 내려받기를 시작했어요")}><Icon name="file-text" size={15} />PDF로 받기</button></div></section>
        )}
        {tab === "datasheet" && (
          <section className="enter grid lg:grid-cols-[minmax(0,1fr)_300px] gap-6 items-start"><DocPreview kind="데이터시트" code={code} spec={spec} />
            <div className="card p-5 flex flex-col gap-3"><b>양식에 반영한 값</b><ul className="text-[13px] flex flex-col gap-2 text-[var(--n8)]"><li className="flex gap-2"><Icon name="circle-check" size={15} />선정 모델 {m.code}</li><li className="flex gap-2"><Icon name="circle-check" size={15} />프로젝트 사양 {spec.load} N · {spec.stroke} mm</li><li className="flex gap-2"><Icon name="circle-check" size={15} />리비전 Rev.{m.rev}</li></ul>
              <button type="button" className="btn btn-sec btn-sm" onClick={() => notify("데이터시트 PDF 내려받기를 시작했어요")}><Icon name="download" size={15} />PDF로 받기</button><button type="button" className="btn btn-sec btn-sm" onClick={() => notify("선정리스트 엑셀 내려받기를 시작했어요")}><Icon name="file-spreadsheet" size={15} />엑셀로 받기</button></div></section>
        )}
        {tab === "drawing" && (
          <section className="enter flex flex-col gap-5">
            <div className="grid md:grid-cols-2 gap-5"><DocPreview kind="외형도" code={code} spec={spec} /><DocPreview kind="회로도" code={code} spec={spec} /></div>
            <div className="card overflow-x-auto"><table className="tbl"><thead><tr><th>도면</th><th>도면 표기</th><th>선정 결과</th><th>대조</th></tr></thead><tbody>
              <tr><td className="font-semibold">외형도</td><td>{code} · Rev.{m.rev}</td><td>{code} · Rev.{m.rev}</td><td><span className="pill ok"><Icon name="circle-check" size={13} />일치</span></td></tr>
              <tr><td className="font-semibold">회로도</td><td>{code} · Rev.{fixed ? m.rev : "B"}</td><td>{code} · Rev.{m.rev}</td><td>{fixed || m.rev === "B" ? <span className="pill ok"><Icon name="circle-check" size={13} />일치</span> : <button type="button" className="pill dark !cursor-pointer border-0" onClick={() => { setFixed(true); notify("회로도 리비전을 선정 결과에 맞췄어요"); }}><Icon name="triangle-alert" size={13} />리비전 불일치 · 맞추기</button>}</td></tr></tbody></table></div>
          </section>
        )}
      </main>
    </>
  );
}

/* ── 버전 이력 ── */
function Versions({ notify }) {
  const p = useParams();
  const [a, setA] = useState("v3"); const [b, setB] = useState("v2"); const [open, setOpen] = useState(null);
  useEffect(() => { if (p.compare) { const [x, y] = p.compare.split("-"); setA(x); setB(y); } setOpen(p.open || null); }, [p]);
  const diff = ITEMS0.filter((it) => VERS[a].sel[it.id] !== VERS[b].sel[it.id]);
  return (
    <>
      <SubHead route="versions" title="버전 이력" sub="입력 데이터·선정 결과·생성 문서를 버전별로 묶어 보관해요. 이전 버전은 읽기 전용이에요." />
      <main id="main" className="rf-in py-8 pb-16 grid lg:grid-cols-[360px_minmax(0,1fr)] gap-6 items-start">
        <ul className="card" aria-label="버전 목록">{Object.entries(VERS).map(([k, v]) => <li key={k} className="px-4 py-4 border-b border-[var(--n2)] last:border-b-0 flex items-center justify-between gap-3" aria-current={open === k ? "true" : undefined}><div><b>{v.label}</b><p className="text-[13px] text-[var(--n7)]">{v.date} · {v.by} · 문서 {v.docs}종</p></div><button type="button" className="btn-txt" onClick={() => setOpen(k)}>상세<Icon name="chevron-right" size={15} /></button></li>)}</ul>
        <div className="flex flex-col gap-5 min-w-0">
          {open ? (
            <section className="card p-5 enter flex flex-col gap-3" aria-label="버전 상세">
              <div className="flex items-center justify-between gap-3 flex-wrap"><b className="text-[17px]">{VERS[open].label} 상세</b>{open !== "v3" ? <span className="pill"><Icon name="lock" size={13} />읽기 전용</span> : <span className="pill ok">최신</span>}</div>
              <table className="tbl"><thead><tr><th>항목</th><th>선정 모델</th></tr></thead><tbody>{ITEMS0.map((it) => <tr key={it.id}><td>{it.id} · {it.name}</td><td>{VERS[open].sel[it.id]}</td></tr>)}</tbody></table>
              <div className="flex gap-2 flex-wrap"><button type="button" className="btn btn-sec btn-sm" onClick={() => notify(VERS[open].label + " 데이터시트를 다시 내려받아요")}><Icon name="download" size={15} />문서 다시 받기</button><button type="button" className="btn btn-sec btn-sm" onClick={() => notify(VERS[open].label + " 입력 데이터를 내려받아요")}><Icon name="file-spreadsheet" size={15} />입력 데이터 받기</button><button type="button" className="btn-txt" onClick={() => setOpen(null)}>닫기</button></div>
            </section>
          ) : (
            <section className="card p-5 flex flex-col gap-4" aria-label="버전 비교">
              <div className="flex gap-3 flex-wrap items-end"><div className="fld"><label htmlFor="va">기준 버전</label><select id="va" className="inp" value={a} onChange={(e) => setA(e.target.value)}>{Object.keys(VERS).map((k) => <option key={k}>{k}</option>)}</select></div><div className="fld"><label htmlFor="vb">비교 버전</label><select id="vb" className="inp" value={b} onChange={(e) => setB(e.target.value)}>{Object.keys(VERS).map((k) => <option key={k}>{k}</option>)}</select></div><span className="sub-t pb-3">바뀐 항목 {diff.length}건만 보여 줘요</span></div>
              <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>항목</th><th>{b}</th><th>{a}</th></tr></thead><tbody>{diff.map((it) => <tr key={it.id}><td className="font-semibold">{it.id} · {it.name}</td><td>{VERS[b].sel[it.id]}</td><td><b>{VERS[a].sel[it.id]}</b></td></tr>)}{diff.length === 0 && <tr><td colSpan={3} className="text-center text-[var(--n7)] py-8" data-empty>바뀐 항목이 없어요</td></tr>}</tbody></table></div>
            </section>
          )}
        </div>
      </main>
    </>
  );
}

/* ── 화면 ── */
function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const [spec, setSpec] = useState(SPEC0);
  const [rerun, setRerun] = useState(false);
  const [over, setOver] = useState({});
  const [log, setLog] = useState([]);
  const [selId, setSelId] = useState("A-2");
  const [note, setNote] = useState("");
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(""), 2600); return () => clearTimeout(t); }, [note]);
  const reset = () => { setSpec(SPEC0); setRerun(false); setOver({}); setLog([]); setSelId("A-2"); };
  return (
    <>
      <DemoBar onReset={reset} />
      <div id="rf-root" className="rf-root" data-tone="deep-neutral">
        <Header route={route} />
        {route === "selection" ? <Selection rerun={rerun} setRerun={setRerun} over={over} setOver={setOver} log={log} setLog={setLog} selId={selId} setSelId={setSelId} notify={setNote} />
          : route === "documents" ? <Documents over={over} selId={selId} spec={spec} notify={setNote} />
          : route === "versions" ? <Versions notify={setNote} />
          : <main id="main"><Main spec={spec} setSpec={setSpec} notify={setNote} goSel={() => go("selection", { item: "A-1" })} /></main>}
        <Footer />
        {note && <div className="look-toast" role="status" aria-live="polite">{note}</div>}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
