              </button></li>
            ))}
          </ul>
          {cur ? (
            <aside className="rounded-[var(--r-panel)] bg-[var(--n1)] px-6 py-6 shadow-card" data-tour-focus>
              <h2 className="m-0 text-[length:var(--t-section)] font-medium tracking-[var(--t-track)] text-[var(--n10)]">{cur.name}</h2><p className="m-0 mt-1 text-[14px] text-[var(--n6)]">{overrides[cur.id] || cur.model}</p>
              <p className="m-0 mt-5 text-[11px] tracking-[0.08em] text-[var(--n6)]">적용된 조건</p>
              {cur.checks.map(([a, b]) => <p key={a} className="m-0 flex items-center gap-2 border-b border-[var(--n3)] py-[10px] text-[15px] text-[var(--n8)]"><Icon name={b ? "check" : "triangle-alert"} size={15} />{a}{b ? null : <span className="ml-auto"><Tag tone={cur.st === "none" ? "danger" : "warn"}>미충족</Tag></span>}</p>)}
              <p className={cx(BODYC, "m-0 mt-4 !text-[14px]")}>{cur.st === "ok" ? "모든 조건을 통과해 자동으로 선정되었습니다." : cur.st === "missing" ? "피드백 방식이 접수 자료에 없어 한 조건을 확인하지 못했습니다. 접수 화면에서 값을 입력하면 이 항목만 다시 평가합니다." : "스트로크와 추력을 만족하는 후보가 없습니다. 조건을 조정하거나 별도 협의가 필요합니다."}</p>
            </aside>
          ) : null}
        </div>
      </div>
      {dlg ? (
        <div className="look-confirm" role="dialog" aria-modal="true" aria-labelledby="why-t" onClick={e => { if (e.target === e.currentTarget) setDlg(false); }}>
          <div>
            <h3 id="why-t">모델 변경 사유</h3>
            <p>{ITEMS[0].name}의 선정 모델을 바꿉니다. 사유를 적어야 저장됩니다.</p>
            <label className="mt-4 block text-[13px] text-[var(--n7)]">변경할 모델
              <select value={pick} onChange={e => setPick(e.target.value)} className="mt-1 block h-[var(--c-input-h)] w-full rounded-[var(--r-field)] border border-[var(--n4)] bg-[var(--n1)] px-[var(--c-input-px)] text-[length:var(--c-input-size)]"><option>LA-24-100-HD</option><option>LA-24-120-IP65</option></select></label>
            <label className="mt-3 block text-[13px] text-[var(--n7)]">변경 사유
              <textarea value={why} onChange={e => setWhy(e.target.value)} rows={3} placeholder="예: 고객사 요청으로 고하중형 적용" className="mt-1 block w-full rounded-[var(--r-field)] border border-[var(--n4)] bg-[var(--n1)] px-[var(--c-input-px)] py-3 text-[length:var(--c-input-size)]" /></label>
            <div className="row"><button type="button" onClick={() => setDlg(false)}>취소</button><button type="button" className="pri" disabled={!why.trim()} onClick={() => { setOverrides({ ...overrides, 1: pick }); setDlg(false); setWhy(""); }}>저장</button></div>
          </div>
        </div>
      ) : null}
    </main>
  );
}

function Documents() {
  const p = useParams();
  const [tab, setTab] = useState(p.tab === "drawing" ? "drawing" : "datasheet");
  const [note, setNote] = useState("");
  useEffect(() => { setTab(p.tab === "drawing" ? "drawing" : "datasheet"); }, [p]);
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(""), 2400); return () => clearTimeout(t); }, [note]);
  return (
    <main id="main">
      <PageHead title="기술문서 출력" sub="선정 결과 하나를 기준으로 선정리스트·데이터시트·외형도·회로도의 모델명과 리비전을 맞춥니다." right={<div className="flex gap-2"><button type="button" onClick={() => setNote("선정리스트 엑셀을 내려받았습니다(예시)")} className={BTN_WHITE}>엑셀 내려받기</button><button type="button" onClick={() => setNote("선정리스트 PDF를 내려받았습니다(예시)")} className={BTN_DARK}>PDF 내려받기</button></div>} />
      <div className={cx(WRAP, "pb-[96px]")}>
        <Tabs tabs={[["datasheet", "데이터시트"], ["drawing", "외형도·회로도"]]} cur={tab} onPick={setTab} />
        {tab === "datasheet" ? (
          <div className="mt-6 grid grid-cols-[1fr_340px] gap-8 max-[900px]:grid-cols-1" data-tour-focus>
            <div className="rounded-[var(--r-panel)] bg-[var(--n1)] px-10 py-9 shadow-card">
              <p className="m-0 text-[12px] text-[var(--n6)]">데이터시트 미리보기 · 리비전 C</p>
              <h2 className="m-0 mt-2 text-[length:var(--t-title)] font-medium tracking-[var(--t-track)] text-[var(--n10)]">LA-24-100-IP65</h2>
              <table className="mt-6 w-full border-collapse text-[15px]"><tbody>{[["프로젝트", "예시-0731 · 1번 라인 슬라이딩 도어"], ["정격 전압", "DC 24V"], ["스트로크", "100mm"], ["최대 추력", "1,000N"], ["보호 등급", "IP65"], ["설치 방식", "후방 클레비스"]].map(([a, b]) => <tr key={a} className="border-b border-[var(--n3)]"><th className="w-[140px] py-3 text-left font-normal text-[var(--n7)]">{a}</th><td className="py-3 text-[var(--n10)]">{b}</td></tr>)}</tbody></table>
            </div>
            <aside className="rounded-[var(--r-panel)] bg-[var(--n1)] px-6 py-6 shadow-card"><p className="m-0 text-[15px] text-[var(--n10)]">반영된 선정 결과</p><p className={cx(BODYC, "m-0 mt-2 !text-[14px]")}>선정 결과 v3의 1번 항목입니다. 모델명·사양이 선정리스트와 같은 값을 씁니다.</p><div className="mt-4 flex gap-2 flex-wrap"><Tag tone="ok">선정리스트 일치</Tag><Tag tone="ok">리비전 C</Tag></div><button type="button" onClick={() => setNote("문서 묶음을 내려받았습니다(예시)")} className={cx(BTN_MAIN, "mt-5")}>문서 묶음 받기</button></aside>
          </div>
        ) : (
          <div className="mt-6 rounded-[var(--r-panel)] bg-[var(--n1)] px-8 py-7 shadow-card" data-tour-focus>
            <p className={cx(BODYC, "m-0 !text-[14px]")}>도면은 PDF 변환본 기준으로 모델명·사양·리비전 문구를 맞춥니다. 캐드 원본은 변환 경로를 확인한 뒤 반영합니다.</p>
            <table className="mt-5 w-full border-collapse text-[15px]"><thead><tr className="border-b border-[var(--n3)] text-left text-[13px] text-[var(--n6)]"><th className="py-2 font-normal">문서</th><th className="font-normal">표기 모델명</th><th className="font-normal">리비전</th><th className="font-normal">선정 결과와</th></tr></thead><tbody>{[["외형도", "LA-24-100-IP65", "C", true], ["회로도", "LA-24-100-IP65", "C", true], ["외형도 (2번 라인)", "LA-24-050-IP54", "B", true], ["회로도 (4번 라인)", "LA-24-200-FB", "A", false]].map(([a, b, c, ok]) => <tr key={a} className="border-b border-[var(--n3)]"><td className="py-3 text-[var(--n10)]">{a}</td><td className="text-[var(--n8)]">{b}</td><td className="text-[var(--n8)]">{c}</td><td>{ok ? <Tag tone="ok">일치</Tag> : <Tag tone="warn">피드백 방식 확인 후 반영</Tag>}</td></tr>)}</tbody></table>
          </div>
        )}
      </div>
      <ToastNote msg={note} />
    </main>
  );
}

function Versions() {
  const p = useParams();
  const [view, setView] = useState(p.view === "compare" || p.view === "prev" ? p.view : "list");
  const [a, setA] = useState("v2"); const [b, setB] = useState("v3");
  const [note, setNote] = useState("");
  useEffect(() => { setView(p.view === "compare" || p.view === "prev" ? p.view : "list"); }, [p]);
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(""), 2400); return () => clearTimeout(t); }, [note]);
  const diff = [["2번 라인 클램프 · 필요 추력", "300N", "400N"], ["2번 라인 클램프 · 선정 모델", "LA-24-050-IP50", "LA-24-050-IP54"], ["포장 라인 푸셔 · 스트로크", "120mm", "150mm"]];
  return (
    <main id="main">
      <PageHead title="버전 이력" sub="같은 프로젝트의 입력 데이터·선정 결과·생성 문서를 버전별로 묶어 보관하고 두 버전을 비교합니다." right={<button type="button" onClick={() => setView("compare")} className={BTN_DARK}>버전 비교</button>} />
      <div className={cx(WRAP, "pb-[96px]")}>
        <Tabs tabs={[["list", "목록"], ["compare", "비교"], ["prev", "이전 버전"]]} cur={view} onPick={setView} />
        {view === "list" ? (
          <ul className="m-0 mt-6 grid list-none rounded-[var(--r-panel)] bg-[var(--n1)] p-0 shadow-card">{VERSIONS.map(v => <li key={v.v} className="flex items-center justify-between border-b border-[var(--n3)] px-6 py-4 last:border-0"><span className="text-[16px] text-[var(--n10)]">{v.v} <span className="ml-3 text-[13px] text-[var(--n6)]">{v.date} · {v.note}</span></span>{v.latest ? <Tag tone="ok">최신</Tag> : <Tag>이전 버전</Tag>}</li>)}</ul>
        ) : view === "compare" ? (
          <div className="mt-6 rounded-[var(--r-panel)] bg-[var(--n1)] px-8 py-7 shadow-card" data-tour-focus>
            <div className="flex flex-wrap items-center gap-3 text-[14px] text-[var(--n7)]">비교할 버전
              <select aria-label="기준 버전" value={a} onChange={e => setA(e.target.value)} className="h-[40px] rounded-[var(--r-field)] border border-[var(--n4)] bg-[var(--n1)] px-3"><option>v1</option><option>v2</option></select>에서
              <select aria-label="대상 버전" value={b} onChange={e => setB(e.target.value)} className="h-[40px] rounded-[var(--r-field)] border border-[var(--n4)] bg-[var(--n1)] px-3"><option>v3</option><option>v2</option></select>
              <Tag>바뀐 항목 {diff.length}건만 표시</Tag></div>
            <table className="mt-5 w-full border-collapse text-[15px]"><thead><tr className="border-b border-[var(--n3)] text-left text-[13px] text-[var(--n6)]"><th className="py-2 font-normal">항목</th><th className="font-normal">{a}</th><th className="font-normal">{b}</th></tr></thead><tbody>{diff.map(([x, y, z]) => <tr key={x} className="border-b border-[var(--n3)]"><td className="py-3 text-[var(--n10)]">{x}</td><td className="text-[var(--n7)]">{y}</td><td className="text-[var(--n10)]">{z}</td></tr>)}</tbody></table>
          </div>
        ) : (
          <div className="mt-6 rounded-[var(--r-panel)] bg-[var(--n1)] px-8 py-7 shadow-card" data-tour-focus>
            <div className="flex items-center gap-3"><h2 className="m-0 text-[length:var(--t-section)] font-medium text-[var(--n10)]">v1 · 2026.11.03</h2><Tag>읽기 전용</Tag></div>
            <p className={cx(BODYC, "m-0 mt-2 !text-[14px]")}>최초 접수 시점의 입력 데이터와 선정 결과, 당시의 규칙·제품 정보 기준으로 만든 문서입니다.</p>
            <ul className="m-0 mt-4 grid list-none p-0">{["입력 데이터 · 항목 5개", "선정 결과 · 5개 항목", "선정리스트.xlsx", "데이터시트.pdf", "외형도·회로도.pdf"].map(x => <li key={x} className="flex items-center justify-between border-b border-[var(--n3)] py-3 text-[15px] text-[var(--n10)]">{x}<button type="button" onClick={() => setNote(x + " 을(를) 다시 받았습니다(예시)")} className={cx(BTN_WHITE, "!h-[34px] !text-[13px] !font-medium !px-3")}>다시 받기</button></li>)}</ul>
          </div>
        )}
      </div>
      <ToastNote msg={note} />
    </main>
  );
}

/* ── 앱 ── */
function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const body = route === "selection" ? <Selection /> : route === "documents" ? <Documents /> : route === "versions" ? <Versions /> : <Home />;
  return (
    <>
      <DemoBar onReset={() => { go("main"); }} />
      <div id="rf-root" className="rf-root" data-tone="light">
        <Header route={route} />
        {body}
        <Footer />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
