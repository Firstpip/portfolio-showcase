  --m500:#cb7035;

  --m700:#9d4207;

  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */

          <div className="rf-head rf-reveal"><h2 id="rc-t" className="rf-h2">최근 견적 건</h2><p className="text-[length:var(--c-body)] text-[var(--n7)]">행을 누르면 그 건의 작업 화면이 열려요.</p></div>
          <div className="pg-job overflow-x-auto">
            <table className="pg-tbl min-w-[560px]">
              <thead><tr><th>현장명</th><th className="num">면적</th><th className="num">금액</th><th>상태</th></tr></thead>
              <tbody>
                {RECENT.map((r) => (
                  <tr key={r.id} data-pick tabIndex={0} onClick={() => { setJob(JOBS.find((j) => j.id === r.id) || JOBS[0]); toWork(); say(r.site + " 작업 화면을 열어요."); }} onKeyDown={(e) => e.key === "Enter" && e.currentTarget.click()}>
                    <td><span className="block font-[550]">{r.site}</span><span className="block text-[length:var(--c-small)] text-[var(--n7)]">{r.id}</span></td>
                    <td className="num">{r.area}</td><td className="num">{fmtWon(r.amount)}</td><td><StatusPill s={r.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section aria-labelledby="hw-t" className="rf-sec alt">
        <div className="rf-in">
          <div className="rf-head rf-reveal"><h2 id="hw-t" className="rf-h2">도면에서 내역서까지<br />네 단계로 이어져요</h2></div>
          <ol className="rf-steps">
            {flow.map(([t, i, o, r], n) => (
              <li key={t} className="rf-reveal">
                <button onClick={() => { setStep(n + 1); go(r, r === "recognition" ? { view: "list" } : {}); }} aria-pressed={step === n + 1}>
                  <span className="n">{n + 1}</span>
                  <b>{t}</b>
                  <span className="d">{i}</span>
                  <span className="d">{o}</span>
                </button>
              </li>
            ))}
          </ol>
        </div>
      </section>

      <section className="rf-close" aria-labelledby="cl-t">
        {PH[0] && <div className="rf-close-media"><img src={PH[0].url} alt="" aria-hidden="true" style={{ objectPosition: "50% 88%" }} /></div>}
        <div className="rf-in rf-close-in">
          <h2 id="cl-t" className="rf-reveal">도면 한 벌로<br />견적 흐름을 직접 따라가 보세요</h2>
          <p className="rf-reveal sub">예시 도면 5종이 들어 있어요. 올리기부터 엑셀 미리보기까지 이어서 볼 수 있어요.</p>
          <div className="rf-reveal mt-8 flex flex-wrap gap-3">
            <button className="pg-btn pg-btn-lg" onClick={() => go("recognition", { view: "list" })}><Icon name="upload" size={18} />도면 올리기</button>
            <button className="rf-ghost" onClick={() => go("export", { sheet: "detail" })}>엑셀 미리보기</button>
          </div>
        </div>
      </section>
    </>
  );
}

/* ── 도면 인식 ── */
function Recognition() {
  const p = useParams();
  const [page, setPage] = useQueryState(p, "page", "IF-003");
  const [mat, setMat] = useQueryState(p, "mat", "all");
  const [move, setMove] = useQueryState(p, "move", null);
  const [low, setLow] = useQueryState(p, "low", null);
  const [pages, setPages] = useState(() => Object.fromEntries(DRAWINGS.map((d) => [d.no, d.pages])));
  useEffect(() => { setPages(Object.fromEntries(DRAWINGS.map((d) => [d.no, d.pages]))); }, [p]);
  const rows = (RECOG[page] || []).filter((r) => mat === "all" || r.code === mat);
  const lowRows = (RECOG[page] || []).filter((r) => r.conf < 80);
  const cur = DRAWINGS.find((d) => d.no === page);
  const total = Object.values(pages).reduce((a, b) => a + b, 0);
  return (
    <main id="main" className="pt-10">
      <Band title="도면 인식" photo={LOOK_DEMO.photos[2]?.url} sub="업로드한 도면을 번호별로 나누고 품명·치수·마감재 코드를 표로 정리해요." right={<button className="rf-ghost" onClick={() => say("추가로 올릴 PDF·DXF 파일을 고르는 창이 열려요.")}>도면 더 올리기</button>} />
      <div className="rf-in grid gap-6 py-10 lg:grid-cols-[320px_1fr]">
        <section aria-labelledby="dl-t" className="min-w-0">
          <div className="mb-3 flex items-end justify-between"><h2 id="dl-t" className="text-[length:var(--t-section)] font-[var(--t-weight)] tracking-[var(--t-track)] text-[var(--n10)]">도면 목록</h2><span className="text-[length:var(--c-small)] text-[var(--n7)]">총 {total}페이지</span></div>
          <div className="pg-card px-1 py-1">
            <ul>{DRAWINGS.map((d) => (
              <li key={d.no}><button onClick={() => { setPage(d.no); setMat("all"); }} aria-current={page === d.no ? "true" : undefined}
                className={cx("flex w-full items-center justify-between gap-3 rounded-[var(--r-ctl)] px-4 py-3 text-left", page === d.no ? "bg-[var(--m50)] text-[var(--m700)]" : "hover:bg-[var(--n2)]")}>
                <span className="min-w-0"><span className="block font-[650]">{d.no}</span><span className="block truncate text-[length:var(--c-small)] text-[var(--n7)]">{d.name}</span></span>
                <span className="text-[length:var(--c-small)] tabular-nums text-[var(--n7)]">{pages[d.no]}p</span></button></li>
            ))}</ul>
          </div>
          <button className="pg-btn2 mt-3 w-full" onClick={() => setMove("IF-005")}><Icon name="layers" size={16} />잘못 묶인 페이지 옮기기</button>
        </section>

        <section aria-labelledby="rt-t" className="min-w-0">
          <div className="mb-3 flex flex-wrap items-end justify-between gap-3">
            <div><h2 id="rt-t" className="text-[length:var(--t-section)] font-[var(--t-weight)] tracking-[var(--t-track)] text-[var(--n10)]">{page} {cur?.name} 인식 결과</h2><p className="mt-1 text-[length:var(--c-small)] text-[var(--n7)]">표제란에서 도면 번호를, 치수선에서 외형 치수를, 지시선에서 마감재 코드를 읽어요.</p></div>
            {lowRows.length > 0 && <button className="pg-btn2 sm" aria-expanded={!!low} onClick={() => setLow(low ? null : "1")}><Icon name="circle-alert" size={14} />신뢰 낮은 값 {lowRows.length}건</button>}
          </div>
          <div className="mb-3 flex flex-wrap gap-2" role="group" aria-label="마감재 거르기">
            <button className="pg-chip" aria-pressed={mat === "all"} onClick={() => setMat("all")}>전체</button>
            {Object.entries(MATS).map(([c, n]) => <button key={c} className="pg-chip" aria-pressed={mat === c} onClick={() => setMat(mat === c ? "all" : c)}>{c} {n}</button>)}
          </div>
          {low && lowRows.length > 0 && (
            <div className="pg-card mb-3 border-[var(--n9)] p-4" role="region" aria-label="신뢰 낮은 값 확인">
              <p className="font-[650] text-[var(--n10)]">먼저 확인할 값</p>
              <ul className="mt-2 divide-y divide-[var(--n2)]">{lowRows.map((r) => (
                <li key={r.part} className="flex flex-wrap items-center justify-between gap-2 py-2 text-[length:var(--c-body)]"><span>{r.part} · {r.size} · 신뢰 {r.conf}%</span><span className="flex gap-2"><button className="pg-btn2 sm" onClick={() => say(r.part + " 값을 맞는 값으로 확정해요.")}>맞아요</button><button className="pg-btn2 sm" onClick={() => go("review")}>검수에서 고치기</button></span></li>
              ))}</ul>
            </div>
          )}
          <div className="pg-card overflow-x-auto">
            <table className="pg-tbl min-w-[560px]">
              <thead><tr><th>품명</th><th>외형 규격 (가로×세로×높이)</th><th className="num">수량</th><th>마감재</th><th className="num">신뢰도</th></tr></thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.part}><td className="font-[550]">{r.part}</td><td>{r.size}</td><td className="num">{r.qty}</td>
                    <td><span className="pg-pill">{r.code} {MATS[r.code]}</span></td>
                    <td className="num">{r.conf < 80 ? <span className="pg-pill dark"><Icon name="circle-alert" size={12} />{r.conf}%</span> : r.conf + "%"}</td></tr>
                ))}
                {rows.length === 0 && <tr data-empty><td colSpan={5} className="py-8 text-center text-[var(--n7)]">이 마감재를 쓰는 품목이 없어요. 다른 칩을 눌러 보세요.</td></tr>}
              </tbody>
            </table>
          </div>
        </section>
      </div>
      {move && (
        <Dialog title="페이지를 다른 도면으로 옮길까요?" sub="IF-004 7페이지가 선반장 B가 아니라 수유실 수납장 도면으로 읽혔어요." onClose={() => setMove(null)}
          footer={<><button className="pg-btn2" onClick={() => setMove(null)}>취소</button><button className="pg-btn" onClick={() => { setPages((x) => ({ ...x, "IF-004": x["IF-004"] - 1, "IF-005": x["IF-005"] + 1 })); setMove(null); say("IF-004 7페이지를 IF-005로 옮겨요."); }}>IF-005로 옮기기</button></>}>
          <dl className="grid grid-cols-2 gap-3 rounded-[var(--r-ctl)] bg-[var(--n2)] p-4 text-[length:var(--c-body)]">
            <div><dt className="text-[length:var(--c-small)] text-[var(--n7)]">IF-004 선반장 B</dt><dd className="font-[650] tabular-nums">{pages["IF-004"]}p에서 {pages["IF-004"] - 1}p로</dd></div>
            <div><dt className="text-[length:var(--c-small)] text-[var(--n7)]">IF-005 수유실 수납장</dt><dd className="font-[650] tabular-nums">{pages["IF-005"]}p에서 {pages["IF-005"] + 1}p로</dd></div>
          </dl>
        </Dialog>
      )}
    </main>
  );
}

/* ── 검수 ── */
function Review() {
  const p = useParams();
  const [sel, setSel] = useState("mdf18");
  const [qtys, setQtys] = useState({});
  const [confirm, setConfirm] = useQueryState(p, "confirm", null);
  useEffect(() => { if (p.edit === "qty") { setQtys({ mdf18: 8 }); setSel("mdf18"); } else setQtys({}); }, [p]);
  const changed = ITEMS.filter((i) => qtys[i.id] !== undefined && qtys[i.id] !== i.qty);
  const base = sumBy(null), now = sumBy(null, qtys);
  return (
    <main id="main" className="pt-10">
      <Band title="도면-내역서 검수" photo={LOOK_DEMO.photos[1]?.url} sub="왼쪽 도면을 보면서 오른쪽 수량을 고치면 금액과 합계가 바로 바뀌어요." right={<button className="pg-btn" onClick={() => setConfirm("1")}><Icon name="check" size={18} />검수 확정</button>} />
      <div className="rf-in py-10">
        <div className="rf-scene grid lg:grid-cols-[1.05fr_1fr]">
          <div className="border-b border-[var(--n3)] p-4 lg:border-b-0 lg:border-r">
            <div className="mb-2 flex items-center justify-between text-[length:var(--c-small)] text-[var(--n7)]"><span className="inline-flex items-center gap-1"><Icon name="ruler" size={14} />원본 도면 IF-003</span><span>{ITEMS.find((i) => i.id === sel)?.name}</span></div>
            <DrawingSheet sel={sel} />
          </div>
          <div className="min-w-0 p-2"><EstimateTable sel={sel} setSel={setSel} qtys={qtys} editable onQty={(id, v) => setQtys((q) => ({ ...q, [id]: v }))} /></div>
        </div>
        <p className="mt-4 flex items-center gap-2 text-[length:var(--c-body)] text-[var(--n7)]" aria-live="polite"><Icon name="info" size={16} />{changed.length ? `수정한 항목 ${changed.length}개 · 합계 ${fmtWon(base)}에서 ${fmtWon(now)}로 바뀌었어요.` : "수정한 항목이 없어요. 수량 칸을 고치면 합계가 바뀌어요."}</p>
      </div>
      {confirm && (
        <Dialog title="검수 내용을 확정할까요?" sub="확정하면 수정 전후 값이 견적 이력에 남고, 출력 화면의 내역서에 반영돼요." onClose={() => setConfirm(null)}
          footer={<><button className="pg-btn2" onClick={() => setConfirm(null)}>돌아가기</button><button className="pg-btn" onClick={() => { setConfirm(null); say("검수 내용을 이력에 남기고 확정해요."); go("export", { sheet: "cover" }); }}>확정하고 출력으로</button></>}>
          {changed.length ? (
            <ul className="divide-y divide-[var(--n2)] rounded-[var(--r-ctl)] bg-[var(--n2)] px-4 text-[length:var(--c-body)]">
              {changed.map((i) => <li key={i.id} className="flex justify-between gap-3 py-3"><span>{i.name}</span><span className="tabular-nums font-[650]">{i.qty}{i.unit}에서 {qtys[i.id]}{i.unit}로</span></li>)}
              <li className="flex justify-between gap-3 py-3 font-[700]"><span>합계</span><span className="tabular-nums">{fmtWon(base)}에서 {fmtWon(now)}로</span></li>
            </ul>
          ) : <p className="rounded-[var(--r-ctl)] bg-[var(--n2)] p-4 text-[var(--n7)]">수정한 항목이 없어요. 자동 산출 값 그대로 확정해요.</p>}
        </Dialog>
      )}
    </main>
  );
}

/* ── 출력 ── */
function Export() {
  const p = useParams();
  const [sheet, setSheet] = useQueryState(p, "sheet", "cover");
  const [hist, setHist] = useState([["갑지·상세 내역서·원가산출서", "11.10 17:42", "한서윤"], ["갑지", "11.09 11:08", "윤태호"]]);
  const mat = sumBy("mat"), lab = sumBy("labor"), out = sumBy("out"), sub = mat + lab + out, adm = Math.round(sub * 0.05), grand = sub + adm;
  const tabs = [["cover", "갑지"], ["detail", "상세 내역서"], ["cost", "원가산출서"]];
  return (
    <main id="main" className="pt-10">
      <Band title="견적 출력" photo={LOOK_DEMO.photos[0]?.url} sub="내부 원가를 제출 양식으로 변환해 엑셀 3종을 내려받는 화면이에요." right={<button className="pg-btn" onClick={() => { setHist((h) => [["갑지·상세 내역서·원가산출서", "방금 전", "한서윤"], ...h]); say("엑셀 3종 내보내기를 시작해요. 시연에서는 파일 저장을 생략해요."); }}><Icon name="download" size={18} />엑셀 3종 받기</button>} />
      <div className="rf-in grid gap-6 py-10 lg:grid-cols-[1fr_320px]">
        <section aria-labelledby="pv-t" className="min-w-0">
          <h2 id="pv-t" className="sr-only">시트 미리보기</h2>
          <div className="pg-seg mb-4" role="tablist" aria-label="시트 선택">{tabs.map(([k, l]) => <button key={k} role="tab" aria-selected={sheet === k} onClick={() => setSheet(k)}>{l}</button>)}</div>
          <div className="pg-card overflow-x-auto">
            {sheet === "cover" && (
              <table className="pg-tbl min-w-[480px]"><thead><tr><th>구분</th><th className="num">금액</th></tr></thead>
                <tbody><tr><td>재료비</td><td className="num">{fmtNum(mat)}</td></tr><tr><td>노무비</td><td className="num">{fmtNum(lab)}</td></tr><tr><td>외주 가공비</td><td className="num">{fmtNum(out)}</td></tr><tr><td>일반관리비 (5%)</td><td className="num">{fmtNum(adm)}</td></tr></tbody>
                <tfoot><tr><td>공급가 합계</td><td className="num">{fmtWon(grand)}</td></tr></tfoot></table>
            )}
            {sheet === "detail" && (
              <table className="pg-tbl min-w-[640px]"><thead><tr><th>품명·규격</th><th className="num">수량</th><th className="num">재료비 단가</th><th className="num">노무비 단가</th><th className="num">금액</th></tr></thead>
                <tbody>{ITEMS.map((i) => <tr key={i.id}><td><span className="block font-[550]">{i.name}</span><span className="block text-[length:var(--c-small)] text-[var(--n7)]">{i.spec}</span></td><td className="num">{i.qty}{i.unit}</td><td className="num">{i.kind === "labor" ? "-" : fmtNum(i.price)}</td><td className="num">{i.kind === "labor" ? fmtNum(i.price) : "-"}</td><td className="num">{fmtNum(amountOf(i))}</td></tr>)}</tbody>
                <tfoot><tr><td colSpan={4}>소계</td><td className="num">{fmtWon(sub)}</td></tr></tfoot></table>
            )}
            {sheet === "cost" && (
              <table className="pg-tbl min-w-[560px]"><thead><tr><th>구분</th><th>적용 룰셋</th><th className="num">로스율</th><th className="num">원가</th></tr></thead>
                <tbody><tr><td>자재</td><td>테넌트 바 룰 v3</td><td className="num">5%</td><td className="num">{fmtNum(mat)}</td></tr><tr><td>노무</td><td>목공·도장 일당</td><td className="num">-</td><td className="num">{fmtNum(lab)}</td></tr><tr><td>외주</td><td>인조대리석 협력사 견적</td><td className="num">-</td><td className="num">{fmtNum(out)}</td></tr></tbody>
                <tfoot><tr><td colSpan={3}>내부 원가 합계</td><td className="num">{fmtWon(sub)}</td></tr></tfoot></table>
            )}
          </div>
          <p className="mt-3 flex items-center gap-2 text-[length:var(--c-body)] text-[var(--s1-text)]"><Icon name="check" size={16} />세 시트의 합계가 같은 견적에서 만들어져요.</p>
        </section>
        <aside aria-labelledby="hi-t" className="min-w-0">
          <h2 id="hi-t" className="mb-3 text-[length:var(--t-section)] font-[var(--t-weight)] tracking-[var(--t-track)] text-[var(--n10)]">출력 이력</h2>
          <ul className="pg-card divide-y divide-[var(--n2)] px-[var(--c-card-px)]">
            {hist.map((h, n) => <li key={n} className="flex items-center justify-between gap-3 py-4"><span className="min-w-0"><span className="block truncate font-[550]">{h[0]}</span><span className="block text-[length:var(--c-small)] text-[var(--n7)]">{h[1]} · {h[2]}</span></span><button className="pg-btn2 sm" onClick={() => say("이 출력본을 다시 내려받아요.")}>다시 받기</button></li>)}
          </ul>
        </aside>
      </div>
    </main>
  );
}

function App() {
  const route = useRoute();
  const [msg, setMsg] = useState(null);
  say = (m) => { setMsg(m); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(null), 2600); };
  useLucide();
  useRfMotion(route);
  useEffect(() => { window.scrollTo(0, 0); }, [route]);
  return (
    <>
      <DemoBar />
      <div id="rf-root" className="rf-root" data-tone="deep-neutral">
        <Header route={route} />
        {route === "recognition" ? <Recognition /> : route === "review" ? <Review /> : route === "export" ? <Export /> : <main id="main"><Main /></main>}
        <Footer />
      </div>
      {msg && <div className="pg-toast-wrap" role="status"><p className="pg-toast">{msg}</p></div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>(function(){try{if(document.getElementById("demo-chrome-css"))return;var st=document.createElement("style");st.id="demo-chrome-css";st.textContent="[data-house=\"demobar\"]{position:sticky;top:0;z-index:70}\nhtml{scroll-padding-top:var(--demo-chrome-h,0px)}\n.demo-hint-pulse{position:relative}\n.demo-hint-pulse::after{content:\"\";position:absolute;inset:-4px;border-radius:12px;box-shadow:0 0 0 0 rgba(255,255,255,.85);animation:demoHintPulse 1.6s ease-out 4;pointer-events:none}\n@keyframes demoHintPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}\n.demo-hint{position:fixed;z-index:80;width:min(300px,calc(100vw - 32px));background:#1d1d1d;color:#fff;border-radius:12px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font:14px/1.55 Pretendard,\"Apple SD Gothic Neo\",system-ui,sans-serif;opacity:0;transform:translateY(-4px);transition:opacity .25s ease,transform .25s ease}\n.demo-hint.on{opacity:1;transform:none}\n.demo-hint b{display:block;font-weight:600;margin-bottom:4px;font-size:14.5px}\n.demo-hint .demo-hint-arrow{position:absolute;top:-6px;width:12px;height:12px;background:#1d1d1d;transform:rotate(45deg);border-radius:2px}\n.demo-hint .demo-hint-row{display:flex;justify-content:flex-end;margin-top:10px}\n.demo-hint button{appearance:none;border:0;background:#fff;color:#1d1d1d;border-radius:8px;padding:6px 12px;font:600 13px/1.2 inherit;cursor:pointer}\n.demo-hint button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.demo-hint-pulse::after{animation:none}.demo-hint{transition:none}}\n@media print{.demo-hint{display:none}}";document.head.appendChild(st);}catch(e){}})();
(function(){try{
// 데모마다 따로 기억한다 — 모든 데모가 한 주소(firstpip.github.io) 아래라 키 하나면 한 데모에서 닫은 뒤 다른 데모에서도 안 떴다(2026-11-13 실측). P1·P2 는 같은 프로젝트라 한 번
var KEY=(function(){var p=location.pathname,i=p.lastIndexOf('/portfolio-');return 'demo-tour-hint-v1:'+(i>0?p.slice(0,i):p);})();
var FROM_TOUR=location.hash==='#tour'; // 키트가 해시를 곧 지우므로 실행 즉시 기록
function tourIsOpen(){return !!document.querySelector('[aria-current="step"]')||document.body.classList.contains('hk-tour-open');}
function bar(){return document.querySelector('[data-house="demobar"]');}
function tourBtn(){var b=bar();if(!b)return null;var els=b.querySelectorAll('button,a');for(var i=0;i<els.length;i++){if(/\uC2DC\uC5F0\s*\uC548\uB0B4/.test(els[i].textContent||''))return els[i];}return null;}
function stackH(){var h=0,b=bar();if(b)h+=b.getBoundingClientRect().height;var hs=document.querySelectorAll('header,nav');for(var i=0;i<hs.length;i++){var e=hs[i];if(b&&b.contains(e))continue;var cs=getComputedStyle(e);if(cs.position==='sticky'||cs.position==='fixed'){var r=e.getBoundingClientRect();if(r.top<=(b?b.getBoundingClientRect().height+2:2)&&r.height<200){h+=r.height;break;}}}return Math.round(h)+12;}
function setPad(){try{document.documentElement.style.setProperty('--demo-chrome-h',stackH()+'px');}catch(e){}}
var tries=0;(function wait(){var btn=tourBtn();if(!btn){if(++tries<40)return setTimeout(wait,250);return;}setPad();window.addEventListener('resize',setPad);
if(navigator.webdriver||/[?&]still=1/.test(location.search)||FROM_TOUR||location.hash==='#tour')return;
var seen=false;try{seen=localStorage.getItem(KEY)==='1';}catch(e){}if(seen)return;
setTimeout(function(){show(btn);},1200);})();
function show(btn){
if(!document.body.contains(btn)||tourIsOpen())return;
var tip=document.createElement('div');tip.className='demo-hint';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','\uC2DC\uC5F0 \uC548\uB0B4 \uB3C4\uC6C0\uB9D0');
var arrow=document.createElement('span');arrow.className='demo-hint-arrow';tip.appendChild(arrow);
var t=document.createElement('b');t.textContent='\uCC98\uC74C \uC624\uC168\uB098\uC694?';tip.appendChild(t);
var p=document.createElement('div');p.textContent="'\uC2DC\uC5F0 \uC548\uB0B4'\uB97C \uB204\uB974\uBA74 \uC774 \uD654\uBA74\uC758 \uC8FC\uC694 \uAE30\uB2A5\uC744 \uB2E8\uACC4\uBCC4\uB85C \uC9C1\uC811 \uB20C\uB7EC \uBCF4\uBA70 \uD655\uC778\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694.";tip.appendChild(p);
var row=document.createElement('div');row.className='demo-hint-row';var ok=document.createElement('button');ok.type='button';ok.textContent='\uC54C\uACA0\uC5B4\uC694';row.appendChild(ok);tip.appendChild(row);
document.body.appendChild(tip);btn.classList.add('demo-hint-pulse');
function place(){var r=btn.getBoundingClientRect(),w=tip.offsetWidth,vw=document.documentElement.clientWidth;var left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16);tip.style.left=left+'px';tip.style.top=(r.bottom+12)+'px';arrow.style.left=Math.max(14,Math.min(w-26,r.left+r.width/2-left-6))+'px';}
place();requestAnimationFrame(function(){tip.classList.add('on');});
var timer=setTimeout(function(){close(false);},25000);
function close(remember){clearTimeout(timer);if(remember){try{localStorage.setItem(KEY,'1');}catch(e){}}btn.classList.remove('demo-hint-pulse');tip.classList.remove('on');setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},300);window.removeEventListener('resize',place);window.removeEventListener('scroll',place,true);document.removeEventListener('keydown',onKey);btn.removeEventListener('click',onBtn,true);}
function onKey(e){if(e.key==='Escape')close(true);}
function onBtn(){close(true);}
ok.addEventListener('click',function(){close(true);});btn.addEventListener('click',onBtn,true);document.addEventListener('keydown',onKey);window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
}
}catch(e){}})();</script>
