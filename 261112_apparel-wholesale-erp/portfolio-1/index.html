/* ── 색상·사이즈 주문서 ── */
function OrderSheet({ cart, setCart, onSubmit }) {
  const p = useParams();
  const presetFor = (q) => (q.over ? OVER : q.fill || q.confirm ? FILL : {});
  const strOf = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, String(v)]));
  const [pid, setPid] = useState(p.product || "A-2301");
  const [qty, setQty] = useState(() => strOf(presetFor(p)));
  const [ask, setAsk] = useState(!!p.confirm);
  useEffect(() => { setPid(p.product || "A-2301"); setQty(strOf(presetFor(p))); setAsk(!!p.confirm); }, [p]);
  const product = PRODUCTS.find((x) => x.id === pid) || PRODUCTS[0];
  const cur = linesOf(product, qty);
  const all = [...cart, ...cur];
  const total = all.reduce((a, l) => a + l.qty * l.unit, 0);
  const qtyAll = all.reduce((a, l) => a + l.qty, 0);
  const overs = cur.filter((l) => l.over);
  const addToCart = () => { if (!cur.length) { say("수량을 입력한 뒤 담아 주세요"); return; } setCart([...cart, ...cur]); setQty({}); say(`${product.name} ${cur.reduce((a, l) => a + l.qty, 0)}개를 장바구니에 담았어요`); };
  return (
    <div className="cl-wrap cl-sub">
      <h1 className="cl-h2">색상·사이즈 주문서</h1>
      <p className="cl-p mt-2">상품을 고르고 색상 행과 사이즈 열에 수량을 입력하세요. 가용 수량보다 많이 넣으면 그 칸이 표시돼요.</p>
      <div className="cl-layout">
        <section className="cl-card-w" aria-label="수량 입력">
          <div className="flex flex-wrap items-center gap-3">
            <label htmlFor="sel-prod" className="text-[14px] font-semibold" style={{ color: "var(--n8)" }}>상품</label>
            <select id="sel-prod" className="cl-field" style={{ width: "min(360px,100%)" }} value={pid} onChange={(e) => { setPid(e.target.value); setQty({}); }}>
              {PRODUCTS.map((x) => <option key={x.id} value={x.id}>{x.id} · {x.name}</option>)}
            </select>
            <span className="text-[14px]" style={{ color: "var(--n7)" }}>적용 단가 <b style={{ color: "var(--n10)", fontVariantNumeric: "tabular-nums" }}>{fmtWon(unitOf(product))}</b>{product.own != null ? " · 개별 단가" : ""}</span>
          </div>
          <div className="mt-4 overflow-x-auto"><Matrix product={product} qty={qty} setQty={setQty} /></div>
          {overs.length > 0 && <div role="alert" className="mt-4 rounded-[12px] p-3 text-[14px]" style={{ background: "var(--s2-bg)", color: "var(--s2-text)" }}>{overs.map((l) => <p key={l.opt} className="m-0">{l.opt}: 가용 {l.stock}개인데 {l.qty}개를 넣었어요. {l.stock}개 이하로 줄여 주세요.</p>)}</div>}
          <div className="mt-5 flex flex-wrap gap-2"><button type="button" className="cl-btn line" onClick={addToCart}>장바구니에 담기</button><button type="button" className="cl-btn ghost" onClick={() => setQty({})}>입력 지우기</button></div>
        </section>
        <aside className="cl-card-w" aria-label="주문 요약" style={{ position: "sticky", top: 120 }}>
          <h2 className="cl-h3" style={{ fontSize: 18 }}>주문 요약</h2>
          <ul className="m-0 mt-3 list-none p-0 text-[14px]">
            {all.length === 0 && <li data-empty style={{ color: "var(--n6)" }}>담긴 품목이 없어요. 칸에 수량을 입력하면 여기에 쌓여요.</li>}
            {all.map((l, i) => <li key={i} className="flex justify-between gap-3 py-2" style={{ borderTop: i ? "1px solid var(--n2)" : 0 }}><span className="min-w-0" style={{ color: "var(--n9)" }}>{l.name}<span className="block text-[13px]" style={{ color: "var(--n6)" }}>{l.opt} · {fmtNum(l.unit)}원</span></span><span style={{ fontVariantNumeric: "tabular-nums" }}>{l.qty}개</span></li>)}
          </ul>
          <dl className="cl-kv mt-4" style={{ borderTop: "1px solid var(--n3)", paddingTop: 14 }}><dt>수량</dt><dd>{fmtNum(qtyAll)}개</dd><dt>금액</dt><dd className="font-semibold">{fmtWon(total)}</dd></dl>
          <button type="button" className="cl-btn main mt-5 w-full justify-center" disabled={!all.length || overs.length > 0} onClick={() => setAsk(true)}>주문 접수</button>
          {overs.length > 0 && <p className="m-0 mt-2 text-[13px]" style={{ color: "var(--s2-text)" }}>가용 수량을 넘는 칸을 고친 뒤 접수할 수 있어요.</p>}
        </aside>
      </div>
      {ask && <Dialog title="주문을 접수할까요?" onClose={() => setAsk(false)} footer={<><button type="button" className="cl-btn line" onClick={() => setAsk(false)}>그대로 두기</button><button type="button" className="cl-btn main" onClick={() => { setAsk(false); onSubmit(all); setQty({}); }}>접수하기</button></>}>
        <ul className="m-0 list-none p-0 text-[14.5px]">{all.map((l, i) => <li key={i} className="flex justify-between gap-3 py-2" style={{ borderTop: i ? "1px solid var(--n2)" : 0 }}><span>{l.name} · {l.opt}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{l.qty}개 × {fmtNum(l.unit)}원</span></li>)}</ul>
        <dl className="cl-kv mt-4"><dt>합계 금액</dt><dd className="font-semibold">{fmtWon(total)}</dd><dt>접수 뒤</dt><dd>직원 콘솔의 배정 대기로 들어가요</dd></dl>
      </Dialog>}
    </div>
  );
}

        </section>
        <section className="cl-card-w cl-rise" key={o.id} aria-label="주문 상세" style={{ padding: "24px 26px" }}>
          <div className="flex items-center justify-between gap-3"><h2 className="cl-h3" style={{ fontSize: 18, fontVariantNumeric: "tabular-nums" }}>{o.id}</h2><Badge tone={stageTone(o.stage)}>{STAGES[o.stage]}</Badge></div>
          <ol className="cl-tl mt-4">{STAGES.map((s, i) => <li key={s} className={i < o.stage + (o.stage === 4 ? 1 : 0) ? "done" : i === o.stage ? "now" : ""}><span className="dot" /><span>{s}</span><span className="text-[13px]" style={{ fontVariantNumeric: "tabular-nums" }}>{o.times[i] || ""}</span></li>)}</ol>
          <button type="button" className="cl-link mt-4" aria-expanded={items} onClick={() => setItems(!items)}>{items ? "품목별 수량 접기" : "품목별 수량 보기"}<Icon name={items ? "chevron-up" : "chevron-down"} size={15} /></button>
          {items && <div className="cl-rise mt-3 overflow-x-auto"><table className="cl-tbl"><thead><tr><th>품목</th><th className="num">주문</th><th className="num">출고</th><th className="num">남은 수량</th></tr></thead><tbody>
            {o.lines.map((l, i) => <tr key={i}><td>{l[0]}<span className="block text-[13px]" style={{ color: "var(--n6)" }}>{l[1]}</span></td><td className="num">{l[2]}</td><td className="num">{l[3]}</td><td className="num" style={l[2] - l[3] > 0 ? { color: "var(--s3-text)", fontWeight: 600 } : null}>{l[2] - l[3]}</td></tr>)}
          </tbody></table></div>}
          <dl className="cl-kv mt-4" style={{ borderTop: "1px solid var(--n3)", paddingTop: 14 }}><dt>주문금액</dt><dd className="font-semibold">{fmtWon(amountOf(o))}</dd></dl>
        </section>
      </div>
    </div>
  );
}

/* ── 미수금 조회 ── */
function Ledger() {
  const p = useParams();
  const [month, setMonth] = useState(p.month || "2026-11");
  const [stmt, setStmt] = useState(!!p.statement);
  useEffect(() => { setMonth(p.month || "2026-11"); setStmt(!!p.statement); }, [p]);
  const m = LEDGER[month] || LEDGER["2026-11"];
  const orderSum = m.rows.filter((r) => r[3] > 0).reduce((a, r) => a + r[3], 0) + m.rows.filter((r) => r[1] === "반품").reduce((a, r) => a + r[3], 0);
  const paid = -m.rows.filter((r) => r[1] === "입금").reduce((a, r) => a + r[3], 0);
  const end = m.open + orderSum - paid;
  let run = m.open;
  return (
    <div className="cl-wrap cl-sub">
      <div className="flex flex-wrap items-end justify-between gap-4"><div><h1 className="cl-h2">미수금 조회</h1><p className="cl-p mt-2">월을 고르면 주문금액·입금액·미수금과 거래 내역이 보여요.</p></div>
        <div className="flex flex-wrap gap-2" role="group" aria-label="월 선택">{Object.keys(LEDGER).map((k) => <button key={k} type="button" className="cl-chip" aria-pressed={month === k} onClick={() => setMonth(k)}>{k.slice(5).replace(/^0/, "")}월</button>)}</div></div>
      <div className="mt-6 grid gap-4 md:grid-cols-3">
        {[["주문금액", orderSum, "반품 차감 포함"], ["입금액", paid, "연결된 입금 합계"], ["월말 미수금", end, `이월 ${fmtNum(m.open)}원 포함`]].map(([l, v, s], i) => <div key={l} className="cl-card-w"><p className="m-0 text-[13px]" style={{ color: "var(--n6)" }}>{l}</p><p className="m-0 mt-1 text-[26px] font-semibold" style={{ color: "var(--n10)", fontVariantNumeric: "tabular-nums" }}>{fmtWon(v)}</p><p className="m-0 mt-1 text-[13px]" style={{ color: "var(--n7)" }}>{s}</p></div>)}
      </div>
      <section className="cl-card-w mt-6" style={{ padding: "16px 16px" }} aria-label="거래 내역">
        <div className="flex flex-wrap items-center justify-between gap-3 px-2 pb-3"><h2 className="cl-h3" style={{ fontSize: 18 }}>거래 내역</h2><button type="button" className="cl-btn line sm" onClick={() => setStmt(true)}><Icon name="receipt-text" size={16} />거래명세서 보기</button></div>
        <div className="overflow-x-auto"><table className="cl-tbl"><thead><tr><th>일자</th><th>구분</th><th>번호</th><th className="num">금액</th><th className="num">잔액</th></tr></thead><tbody>
          <tr><td colSpan={4} style={{ color: "var(--n7)" }}>이월 미수금</td><td className="num">{fmtNum(m.open)}</td></tr>
          {m.rows.map((r, i) => { run += r[3]; return <tr key={i}><td style={{ fontVariantNumeric: "tabular-nums" }}>{r[0]}</td><td>{r[1]}</td><td style={{ fontVariantNumeric: "tabular-nums", color: "var(--n7)" }}>{r[2]}</td><td className="num" style={r[3] < 0 ? { color: "var(--s1-text)" } : null}>{fmtNum(r[3])}</td><td className="num">{fmtNum(run)}</td></tr>; })}
        </tbody></table></div>
      </section>
      {stmt && <Dialog title={`거래명세서 · ${month.slice(0, 4)}년 ${month.slice(5).replace(/^0/, "")}월`} wide onClose={() => setStmt(false)} footer={<><button type="button" className="cl-btn line" onClick={() => setStmt(false)}>닫기</button><button type="button" className="cl-btn main" onClick={() => { say("거래명세서를 PDF로 내려받습니다"); setStmt(false); }}>PDF로 내려받기</button></>}>
        <p className="cl-p" style={{ fontSize: 14 }}>유림상회 · 10월 24일 주문 기준 품목 내역(예시)</p>
        <div className="mt-3 overflow-x-auto"><table className="cl-tbl"><thead><tr><th>품목</th><th className="num">수량</th><th className="num">단가</th><th className="num">금액</th></tr></thead><tbody>
          {STATEMENT.map(([n, o, q, u]) => <tr key={n}><td>{n}<span className="block text-[13px]" style={{ color: "var(--n6)" }}>{o}</span></td><td className="num">{q}</td><td className="num">{fmtNum(u)}</td><td className="num">{fmtNum(q * u)}</td></tr>)}
          <tr><td colSpan={3} style={{ fontWeight: 600 }}>합계</td><td className="num" style={{ fontWeight: 600 }}>{fmtNum(STATEMENT.reduce((a, r) => a + r[2] * r[3], 0))}</td></tr>
        </tbody></table></div>
      </Dialog>}
    </div>
  );
}

function Footer() {
  const col = (t, items) => <div><h4>{t}</h4>{items.map(([l, f]) => <button key={l} type="button" onClick={f}>{l}</button>)}</div>;
  return (
    <footer data-ref="footer" className="cl-foot">
      <div className="cl-wrap">
        <div className="cols">
          {col("주문", [["상품 카탈로그", () => go("main")], ["색상·사이즈 주문서", () => go("order-sheet")], ["엑셀로 주문 올리기", () => say("엑셀 주문서를 올리면 품목과 수량을 읽어 주문서에 채웁니다")]])}
          {col("조회", [["주문 내역", () => go("orders")], ["미수금 조회", () => go("ledger")], ["거래명세서", () => go("ledger", { statement: "1" })]])}
          {col("안내", [["단가표 받기", () => say("거래처 단가표를 엑셀로 내려받습니다")], ["알림톡 설정", () => say("알림톡 템플릿은 착수 직후 심사를 신청합니다")], ["이용 방법", () => go("main")]])}
          {col("정책", [["거래처 계정", () => say("거래처별 계정 발급과 사용 중지는 관리 화면에서 처리합니다")], ["개인정보 처리", () => say("데모 화면의 이름과 금액은 모두 예시입니다")]])}
          <div><h4>온결도매</h4><button type="button" onClick={() => say("연락처는 데모에 포함되지 않습니다")}>문의하기</button><p className="cr">구현 데모 · 화면의 이름·금액·내역은 모두 예시입니다.</p><p className="cr" style={{ marginTop: 6 }}>사진 · {PHOTO.source} ({PHOTO.credit})</p></div>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const [note, setNote] = useState("");
  sayFn = setNote;
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(""), 2600); return () => clearTimeout(t); }, [note]);
  const seedCart = () => [{ name: "플리스 후드 집업", opt: "차콜 / L", qty: 30, unit: 21000 }, { name: "플리스 후드 집업", opt: "블랙 / XL", qty: 18, unit: 21000 }];
  const [cart, setCart] = useState(seedCart);
  const [orders, setOrders] = useState(seedOrders);
  const submit = (lines) => {
    const id = "S-1112-" + String(19 + orders.filter((o) => o.id.startsWith("S-1112")).length - 1).padStart(3, "0");
    const nid = orders.some((o) => o.id === id) ? id + "A" : id;
    setOrders([{ id: nid, stage: 0, times: ["11.12 10:" + String(20 + orders.length).padStart(2, "0")], lines: lines.map((l) => [l.name, l.opt, l.qty, 0, l.unit]) }, ...orders]);
    setCart([]);
    say(`${nid} 주문을 접수했어요. 직원 콘솔의 배정 대기로 들어가요`);
    go("orders", { open: nid });
  };
  const reset = () => { setCart(seedCart()); setOrders(seedOrders()); };
  return (
    <>
      <DemoBar onReset={reset} />
      <div id="rf-root" className="rf-root cl-root" data-tone="light">
        <Header route={route} />
        <main id="main">
          {route === "order-sheet" ? <OrderSheet cart={cart} setCart={setCart} onSubmit={submit} />
            : route === "orders" ? <Orders orders={orders} />
            : route === "ledger" ? <Ledger />
            : <Landing cart={cart} />}
        </main>
        <Footer />
      </div>
      {note && <div className="look-toast" role="status" aria-live="polite">{note}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
