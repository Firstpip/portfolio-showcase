          <div className="tx"><span><Icon name="bell" size={20} /></span><h3>재입고 알림 신청</h3><p>품절 상품은 알림을 신청해 두면 입고가 확정될 때 알려 주고, 같은 화면에서 바로 주문을 이어 가요.</p></div>
        </article>
        <article className="oc-tcard l">
          <div className="vis"><div className="oc-mini">
            <div className="oc-code">{`GET /orders/export.xlsx\n  ?from=2026-11-01\n  &to=2026-11-30`}</div>
            <div style={{ borderTop: '1px solid var(--n3)', marginTop: 12, paddingTop: 10, fontSize: 12.5, color: 'var(--s1-text)' }}>주문 내역 5건 · 엑셀 파일 준비됨</div>
          </div></div>
          <div className="tx"><span><Icon name="download" size={20} /></span><h3>엑셀 내려받기</h3><p>주문 내역과 거래명세서를 기간을 골라 엑셀로 내려받아 거래처 자체 장부에 바로 붙여 넣어요.</p></div>
        </article>
      </div>
    </section>
  );
}

function Footer() {
  const cols = [['상품', [['신상품', 'main'], ['분류별 보기', 'main'], ['재입고 알림', 'main'], ['단가표', 'main']]], ['주문', [['주문서 작성', 'order-sheet'], ['주문 조회', 'orders'], ['부분 출고', 'orders'], ['반품 접수', 'orders']]], ['정산', [['미수금 조회', 'ledger'], ['거래명세서', 'ledger'], ['입금 확인', 'ledger'], ['월 마감 내역', 'ledger']]], ['안내', [['이용 안내', 'main'], ['계정 안내', 'main'], ['문의하기', 'main'], ['개인정보 처리', 'main']]]];
  return (
    <footer className="oc-foot" data-ref="footer">
      <div className="oc-foot-in">
        <div className="oc-fcols">{cols.map(([h, ls]) => <div key={h}><h5>{h}</h5>{ls.map(([t, r]) => <button key={t} type="button" onClick={() => go(r)}>{t}</button>)}</div>)}</div>
        <div className="oc-fbar"><span>2026 {BRAND} 거래처 주문 웹 · 맞춤 구현 데모</span><span>사진 · {[...new Set(DEMO.photos.map((p) => 'Pixabay (' + p.credit + ')'))].join(', ')}</span></div>
        <div className="oc-wm" aria-hidden="true">{BRAND.slice(0, 2)}</div>
      </div>
    </footer>
  );
}

function ProductDialog({ id, onClose }) {
  const p = PRODUCTS.find((x) => x.id === id);
  if (!p) return null;
  return (
    <Modal title={p.name} onClose={onClose} foot={[
      <button key="a" type="button" className="oc-btn line" onClick={onClose}>닫기</button>,
      <button key="b" type="button" className="oc-btn pri" onClick={() => go('order-sheet', { s: 'fill' })}>이 상품 주문하기</button>,
    ]}>
      <img src={PHOTO(p.ph)} alt={p.name} style={{ width: '100%', height: 200, objectFit: 'cover', borderRadius: 16 }} />
      <table className="oc-tbl" style={{ marginTop: 14 }}><tbody>
        <tr><td>분류 · 사이즈</td><td className="r">{p.catLabel} · {p.sizes}</td></tr>
        <tr><td>등급 단가 (A)</td><td className="r num">{fmtWon(p.grade)}</td></tr>
        <tr><td>거래처 개별 단가</td><td className="r num"><b>{fmtWon(p.indiv)}</b></td></tr>
        <tr><td>색상</td><td className="r">{p.colors.join(' · ')}</td></tr>
        <tr><td>가용 수량</td><td className="r num">{fmtNum(p.avail)}벌</td></tr>
      </tbody></table>
    </Modal>
  );
}

function Home() {
  const p = useParams();
  const [cat, setCat] = useState(p.cat || 'all');
  const [dlg, setDlg] = useState(p.dialog || null);
  useEffect(() => { setCat(p.cat || 'all'); setDlg(p.dialog || null); }, [p]);
  useLucide();
  return (
    <>
      <Hero onOpen={setDlg} />
      <Features />
      <Gallery cat={cat} setCat={setCat} onOpen={setDlg} />
      <Features2 />
      <Dashboard />
      <Features3 />
      <Dashboard2 />
      <Features4 />
      {dlg && <ProductDialog id={dlg} onClose={() => setDlg(null)} />}
    </>
  );
}

/* ── 하위 화면 ── */
function PageHead({ title, sub, right }) {
  return <div className="oc-ph"><div><h1>{title}</h1>{sub && <p>{sub}</p>}</div>{right}</div>;
}
function OrderSheet({ say }) {
  const p = useParams();
  const seed = (s) => (s === 'over' ? { ...FILL, '인디고-32': 60 } : s === 'fill' || s === 'submit' ? FILL : {});
  const [qty, setQty] = useState(seed(p.s));
  const [ask, setAsk] = useState(p.s === 'submit');
  const [done, setDone] = useState(false);
  useEffect(() => { setQty(seed(p.s)); setAsk(p.s === 'submit'); }, [p]);
  useLucide();
  const prod = PRODUCTS.find((x) => x.id === 'p5');
  const tot = sumQty(qty); const ov = overList(qty);
  return (
    <div className="oc-page">
      <PageHead title="색상·사이즈 주문서" sub="수량을 칸마다 넣으면 합계와 거래처 단가 금액이 바로 바뀌어요." right={<button type="button" className="oc-btn line" onClick={() => go('main')}>상품 목록으로</button>} />
      <div className="oc-two">
        <div className="oc-box">
          <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
            <img src={PHOTO(prod.ph)} alt={prod.name} style={{ width: 88, height: 88, borderRadius: 16, objectFit: 'cover' }} />
            <div><div style={{ fontSize: 'var(--t-section)', fontWeight: 600, color: 'var(--n10)' }}>{prod.name}</div><div style={{ color: 'var(--n7)', fontSize: 'var(--c-small)' }}>등급 단가 {fmtWon(prod.grade)} · 개별 단가 {fmtWon(prod.indiv)}</div></div>
          </div>
          <div style={{ overflowX: 'auto' }}><SizeMatrix qty={qty} setQty={setQty} /></div>
          {ov.length > 0 && (
            <div role="alert" style={{ marginTop: 16, padding: '12px 16px', borderRadius: 16, background: 'var(--s2-bg)', color: 'var(--s2-text)', fontSize: 'var(--c-small)', display: 'flex', gap: 10 }}>
              <span><Icon name="circle-alert" size={18} /></span>
              <span>{ov.map((x) => x.c + ' ' + x.s + ' 사이즈는 가용 ' + x.a + '벌까지 담을 수 있어요(현재 ' + x.v + '벌). 수량을 줄이거나 재입고 알림을 신청해 보세요.').join(' ')}</span>
            </div>
          )}
        </div>
        <aside className="oc-box" aria-label="주문 요약">
          <div style={{ fontSize: 'var(--t-section)', fontWeight: 600, color: 'var(--n10)' }}>장바구니 요약</div>
          <div className="oc-kv" style={{ marginTop: 16 }}><span>합계 수량</span><b className="num">{fmtNum(tot)}벌</b></div>
          <div className="oc-kv" style={{ marginTop: 10 }}><span>적용 단가</span><b className="num">{fmtWon(prod.indiv)}</b></div>
          <div className="oc-kv" style={{ marginTop: 10, paddingTop: 12, borderTop: '1px solid var(--n3)' }}><span>주문 금액</span><b className="num" style={{ fontSize: 20 }}>{fmtWon(tot * prod.indiv)}</b></div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 20 }}>
            <button type="button" className="oc-btn pri" disabled={!tot || ov.length > 0} onClick={() => setAsk(true)}>주문 접수</button>
            <button type="button" className="oc-btn line" onClick={() => { say('임시 저장됐어요'); }}>임시 저장</button>
          </div>
        </aside>
      </div>
      {ask && (
        <Modal title="주문을 접수할까요?" onClose={() => setAsk(false)} foot={[
          <button key="c" type="button" className="oc-btn line" onClick={() => setAsk(false)}>취소</button>,
          <button key="o" type="button" className="oc-btn pri" onClick={() => { setAsk(false); setDone(true); say('주문이 접수됐어요'); }}>접수하기</button>,
        ]}>
          <table className="oc-tbl"><tbody>
            <tr><td>상품</td><td className="r">{prod.name}</td></tr>
            <tr><td>수량</td><td className="r num">{fmtNum(tot)}벌</td></tr>
            <tr><td>금액</td><td className="r num"><b>{fmtWon(tot * prod.indiv)}</b></td></tr>
          </tbody></table>
        </Modal>
      )}
      {done && <div className="oc-box" style={{ marginTop: 20 }} data-empty="false"><b style={{ color: 'var(--n10)' }}>접수 완료.</b> 진행 상황은 주문 진행 조회에서 확인해요. <button type="button" className="oc-chip-btn" onClick={() => go('orders', { open: 'OD-2611-0412' })}>주문 진행 조회로</button></div>}
    </div>
  );
}
function Orders() {
  const p = useParams();
  const [open, setOpen] = useState(p.open || null);
  const [items, setItems] = useState(p.items === '1');
  useEffect(() => { setOpen(p.open || null); setItems(p.items === '1'); }, [p]);
  useLucide();
  const o = ORDERS.find((x) => x.id === open);
  const steps = [['접수', '2026.11.12 09:20'], ['확인', '2026.11.12 10:05'], ['재고 배정', '2026.11.12 10:40'], ['부분 출고', '2026.11.13 14:10'], ['출고 완료', '남은 수량 입고 후']];
  return (
    <div className="oc-page">
      <PageHead title="주문 진행 조회" sub="주문 한 건을 누르면 접수부터 출고까지 지금 어느 단계인지 보여요." />
      <div className="oc-two" style={{ gridTemplateColumns: 'minmax(0,1fr) 400px' }}>
        <div className="oc-box" style={{ padding: 0, overflow: 'hidden' }}>
          <table className="oc-tbl"><thead><tr><th style={{ width: '30%' }}>주문번호</th><th>접수일</th><th className="r">수량</th><th>상태</th><th className="r">금액</th></tr></thead><tbody>
            {ORDERS.map((x) => (
              <tr key={x.id} onClick={() => setOpen(x.id)} style={{ cursor: 'pointer', background: open === x.id ? 'var(--m50)' : undefined }} aria-selected={open === x.id}>
                <td><button type="button" style={{ background: 'none', border: 0, padding: 0, color: 'var(--m700)', fontWeight: 600 }} onClick={() => setOpen(x.id)}>{x.id}</button></td>
                <td>{x.date}</td><td className="r num">{x.qty}</td><td><span className={cx('oc-pill', pillOf(x.st))}>{x.stl}</span></td><td className="r num">{fmtWon(x.amt)}</td>
              </tr>
            ))}
          </tbody></table>
        </div>
        <aside className="oc-box" aria-label="주문 상세">
          {!o ? (
            <div className="oc-empty" data-empty="true"><p>왼쪽에서 주문 한 건을 눌러 보세요.</p><button type="button" className="oc-btn line" onClick={() => setOpen('OD-2611-0412')}>부분 출고 건 보기</button></div>
          ) : (
            <>
              <div style={{ fontSize: 'var(--t-section)', fontWeight: 600, color: 'var(--n10)' }}>{o.id}</div>
              <div style={{ color: 'var(--n7)', fontSize: 'var(--c-small)', marginTop: 4 }}>{o.items}개 품목 · {o.qty}벌 · {fmtWon(o.amt)}</div>
              <ol className="oc-tl" style={{ marginTop: 14 }}>
                {steps.map((s, k) => <li key={s[0]}><span className={cx('oc-dot', k <= 3 && 'on')}></span><span style={{ color: k <= 3 ? 'var(--n10)' : 'var(--n6)', fontWeight: k === 3 ? 700 : 500 }}>{s[0]}</span><span style={{ color: 'var(--n7)', fontSize: 13 }}>{s[1]}</span></li>)}
              </ol>
              <button type="button" className="oc-btn line" style={{ width: '100%' }} aria-expanded={items} onClick={() => setItems(!items)}>{items ? '품목별 수량 접기' : '품목별 수량 펼치기'}</button>
              {items && (
                <table className="oc-tbl" style={{ marginTop: 12 }}><thead><tr><th style={{ width: '46%' }}>품목</th><th className="r">주문</th><th className="r">출고</th><th className="r">잔량</th></tr></thead><tbody>
                  {ITEMS.map((x) => <tr key={x.name}><td title={x.name}>{x.name}</td><td className="r num">{x.ord}</td><td className="r num">{x.out}</td><td className="r num"><b>{x.ord - x.out}</b></td></tr>)}
                </tbody></table>
              )}
            </>
          )}
        </aside>
      </div>
    </div>
  );
}
function Ledger({ say }) {
  const p = useParams();
  const [stmt, setStmt] = useState(p.stmt === '1');
  useEffect(() => { setStmt(p.stmt === '1'); }, [p]);
  useLucide();
  const rows = [['11월', 47800000, 41200000], ['10월', 43000000, 40000000], ['9월', 46000000, 43000000], ['8월', 41000000, 38000000]];
  return (
    <div className="oc-page">
      <PageHead title="미수금·거래명세서" sub="월별 주문금액에서 입금액을 뺀 미수금을 거래처 원장으로 확인해요." right={<button type="button" className="oc-btn pri" onClick={() => setStmt(true)}>거래명세서 보기</button>} />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 16, marginBottom: 20 }}>
        {[['11월 주문금액', fmtWon(47800000)], ['11월 입금액', fmtWon(41200000)], ['11월 미수금', fmtWon(6600000)]].map((x) => <div key={x[0]} className="oc-box"><div style={{ color: 'var(--n7)', fontSize: 'var(--c-small)' }}>{x[0]}</div><div className="num" style={{ fontSize: 26, fontWeight: 600, color: 'var(--n10)', marginTop: 6 }}>{x[1]}</div></div>)}
      </div>
      <div className="oc-box" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="oc-tbl"><thead><tr><th>월</th><th className="r">주문금액</th><th className="r">입금액</th><th className="r">미수금</th><th></th></tr></thead><tbody>
          {rows.map((r) => <tr key={r[0]}><td>{r[0]}</td><td className="r num">{fmtWon(r[1])}</td><td className="r num">{fmtWon(r[2])}</td><td className="r num"><b>{fmtWon(r[1] - r[2])}</b></td><td className="r"><button type="button" className="oc-chip-btn" onClick={() => setStmt(true)}>명세서</button></td></tr>)}
        </tbody></table>
      </div>
      {stmt && (
        <Modal title="2026년 11월 거래명세서" onClose={() => setStmt(false)} foot={[
          <button key="x" type="button" className="oc-btn line" onClick={() => { say('엑셀 파일을 준비했어요'); }}>엑셀 내려받기</button>,
          <button key="c" type="button" className="oc-btn pri" onClick={() => setStmt(false)}>확인</button>,
        ]}>
          <table className="oc-tbl"><thead><tr><th style={{ width: '50%' }}>품목</th><th className="r">수량</th><th className="r">금액</th></tr></thead><tbody>
            <tr><td>스트레이트 데님 팬츠</td><td className="r num">96</td><td className="r num">{fmtWon(96 * 16900)}</td></tr>
            <tr><td>라운드 니트 풀오버</td><td className="r num">72</td><td className="r num">{fmtWon(72 * 16200)}</td></tr>
            <tr><td>컬러 후드 모음</td><td className="r num">48</td><td className="r num">{fmtWon(48 * 20900)}</td></tr>
            <tr><td><b>합계</b></td><td className="r num"><b>216</b></td><td className="r num"><b>{fmtWon(96 * 16900 + 72 * 16200 + 48 * 20900)}</b></td></tr>
          </tbody></table>
          <div style={{ marginTop: 12, fontSize: 13, color: 'var(--n7)' }}>입금 확인분은 다음 달 장부에서 미수금에서 빠져요.</div>
        </Modal>
      )}
    </div>
  );
}

/* ── 앱 ── */
function App() {
  const route = useRoute();
  const [toast, setToast] = useState('');
  useLucide();
  useRfMotion(route);
  const say = (m) => { setToast(m); setTimeout(() => setToast(''), 2200); };
  return (
    <>
      <DemoBar onReset={() => { setToast(''); go('main'); }} />
      <div id="rf-root" className="rf-root oc" data-tone="light">
        <Header route={route} />
        <main id="main">
          {route === 'main' && <Home />}
          {route === 'order-sheet' && <OrderSheet say={say} />}
          {route === 'orders' && <Orders />}
          {route === 'ledger' && <Ledger say={say} />}
        </main>
        <Footer />
      </div>
      {toast && <div className="look-toast" role="status">{toast}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
