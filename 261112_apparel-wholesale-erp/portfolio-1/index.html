const REASONS = ['사이즈 교환 요청', '봉제 불량', '염색 얼룩', '오배송', '색상 상이', '박스 파손'];
function Returns({ returns, setReturns, orders, toast }) {
  useLucide();
  const p = useParams();
  const shipped = orders.filter(o => o.shipDate && o.status === '출고 완료');
  const [oid, setOid] = useState(shipped[0].id);
  const ord = shipped.find(o => o.id === oid) || shipped[0];
  const [li, setLi] = useState(0); const [size, setSize] = useState('M'); const [qty, setQty] = useState(2); const [reason, setReason] = useState(REASONS[0]);
  const line = ord.lines[li] || ord.lines[0];
  useEffect(() => { if (!(size in line.sh)) setSize(Object.keys(line.sh)[0]); }, [oid, li]);
  const maxQ = line.sh[size] || 0;
  const add = () => { let n = 615; while (returns.some(r => r.id === 'RT-2611-' + String(n).padStart(4, '0'))) n++; const id = 'RT-2611-' + String(n).padStart(4, '0'); setReturns(rs => [{ id, date: TODAY, cust: ME, order: ord.id, pid: line.pid, color: line.color, size, qty: Number(qty), reason, status: '접수' }, ...rs]); toast(`반품 접수 ${id} · 접수되었습니다`); };
  useEffect(() => { if (p.done) { setOid('OD-2611-0372'); setSize('L'); setQty(3); setReason('사이즈 교환 요청'); setReturns(rs => rs.some(r => r.id === 'RT-2611-0615') ? rs : [{ id: 'RT-2611-0615', date: TODAY, cust: ME, order: 'OD-2611-0372', pid: 'PT-3305', color: '베이지', size: 'M', qty: 2, reason: '색상 상이', status: '접수' }, ...rs]); } }, [p]);
  const resultOf = (r) => r.status === '재입고 완료' ? `재입고 · 크레딧 ${won(retCredit(r))}` : r.status === '불량 처리' ? `불량 확인 · 크레딧 ${won(retCredit(r))}` : r.status === '검수 중' ? '검수 결과 대기' : '접수 확인 중';
  return (
    <div className="pg-page mx-auto max-w-[1280px] px-5 pb-16 pt-8">
      <h1 className="pg-h1">반품 접수</h1><p className="pg-small mt-1">출고가 끝난 주문의 품목을 골라 사유와 수량을 입력하세요. 검수 후 재입고 또는 불량으로 처리됩니다.</p>
      <div className="mt-6 grid gap-5 lg:grid-cols-[360px_1fr]">
        <div className="pg-card flex h-fit flex-col gap-4 p-6">
          <label className="pg-small block">출고 주문<select className="pg-input mt-1.5" value={oid} onChange={(e) => { setOid(e.target.value); setLi(0); }}>{shipped.map(o => <option key={o.id} value={o.id}>{o.id} · {md(o.shipDate)} 출고</option>)}</select></label>
          <label className="pg-small block">품목<select className="pg-input mt-1.5" value={li} onChange={(e) => setLi(Number(e.target.value))}>{ord.lines.map((l, i) => <option key={i} value={i}>{PBY[l.pid].name} · {l.color}</option>)}</select></label>
          <div className="grid grid-cols-2 gap-3">
            <label className="pg-small block">사이즈<select className="pg-input mt-1.5" value={size} onChange={(e) => setSize(e.target.value)}>{Object.keys(line.sh).map(s => <option key={s}>{s}</option>)}</select></label>
            <label className="pg-small block">수량 (최대 {maxQ})<input type="number" min="1" max={maxQ} className="pg-input mt-1.5" value={qty} onChange={(e) => setQty(e.target.value)} aria-invalid={Number(qty) > maxQ} /></label>
          </div>
          <label className="pg-small block">반품 사유<select className="pg-input mt-1.5" value={reason} onChange={(e) => setReason(e.target.value)}>{REASONS.map(r => <option key={r}>{r}</option>)}</select></label>
          <button className="pg-btn" disabled={!qty || Number(qty) > maxQ || Number(qty) < 1} onClick={add}><Icon name="rotate-ccw" size={16} />반품 접수</button>
          <p className="pg-small">반품이 확정되면(재입고·불량 모두) 반품 금액이 거래 내역에 크레딧으로 반영돼요.</p>
        </div>
        <div className="pg-card pg-tblwrap"><table className="pg-tbl">
          <thead><tr><th>접수번호</th><th>접수일</th><th>주문번호</th><th>품목</th><th className="r">수량</th><th>사유</th><th>상태</th><th>처리 결과</th></tr></thead>
          <tbody>{returns.map(r => <tr key={r.id} className={r.date === TODAY ? 'pg-flash' : ''}><td className="num font-medium">{r.id}</td><td>{md(r.date)}</td><td className="num">{r.order}</td><td>{PBY[r.pid].name}<div className="pg-small">{r.color} {r.size}</div></td><td className="r num">{r.qty}</td><td>{r.reason}</td><td><Pill>{r.status}</Pill></td><td className="pg-small whitespace-nowrap">{resultOf(r)}</td></tr>)}</tbody>
        </table></div>
      </div>
    </div>
  );
}

/* ── 거래 내역·미수금 ── */
function Ledger({ orders, returns }) {
  useLucide();
  const p = useParams();
  const months = useMemo(() => monthsOf(ME, orders, DEPOSITS0, {}, returns), [orders, returns]);
  const tx = useMemo(() => txOf(ME, orders, DEPOSITS0, {}, returns), [orders, returns]);
  const run = useMemo(() => { let b = CUST[ME].opening; return tx.map(t => ({ ...t, bal: (b += t.delta) })); }, [tx]);
  const rows = run.slice().reverse().slice(0, 12);
  const [selKey, setSelKey] = useState(null);
  const key = (t) => t.date + t.kind + t.ref;
  useEffect(() => { if (p.open) { const t = rows.find(x => x.ref.endsWith(p.open) || x.ref === p.open); if (t) setSelKey(key(t)); } }, [p]);
  const sel = rows.find(t => key(t) === selKey) || rows.find(t => t.kind === '출고' && t.ref.startsWith('OD-2611')) || rows[0];
  const so = sel.kind === '출고' ? orders.find(o => o.id === sel.ref) : null;
  const sr = sel.kind === '반품' ? returns.find(r => r.id === sel.ref) : null;
  const cur = months[months.length - 1]; const bal = cur.bal;
  return (
    <div className="pg-page mx-auto max-w-[1280px] px-5 pb-16 pt-8">
      <h1 className="pg-h1">거래 내역·미수금</h1><p className="pg-small mt-1">출고 금액에서 입금과 반품 크레딧을 뺀 미수금이에요. 마감된 달은 수정할 수 없습니다.</p>
      <div className="mt-6 grid gap-4 sm:grid-cols-3">
        {[['11월 출고 금액', cur.ship], ['11월 입금액', cur.dep], ['현재 미수금', bal]].map(([k, v], i) => <div key={k} className="pg-card p-5"><div className="pg-small">{k}</div><div className={cx('mt-1 text-[24px] font-bold num', i === 2 && 'text-[var(--m700)]')}>{won(v)}</div></div>)}
      </div>
      <div className="mt-5 grid gap-5 lg:grid-cols-[1fr_1.15fr]">
        <div className="flex flex-col gap-5"><div className="pg-card pg-tblwrap"><table className="pg-tbl">
          <thead><tr><th>월</th><th className="r">출고 금액</th><th className="r">입금액</th><th className="r">반품 크레딧</th><th className="r">월말 미수금</th><th>상태</th></tr></thead>
          <tbody>{months.slice().reverse().map(m => <tr key={m.key}><td className="font-medium">{m.key.replace('-', '.')}</td><td className="r num">{fmtNum(m.ship)}</td><td className="r num">{fmtNum(m.dep)}</td><td className="r num">{fmtNum(m.ret)}</td><td className="r num font-semibold">{fmtNum(m.bal)}</td><td>{m.key <= CLOSED0 ? <span className="inline-flex items-center gap-1 pg-small"><Icon name="lock" size={13} />마감</span> : <Pill tone="s3">집계 중</Pill>}</td></tr>)}</tbody>
        </table></div>
        <div className="pg-card p-6"><div className="pg-h2">{cur.key.replace('-', '.')} 미수금 계산</div><div className="mt-2"><Kv k="이월 미수금" v={won(months[months.length - 2] ? months[months.length - 2].bal : 0)} /><Kv k="+ 출고 금액" v={won(cur.ship)} /><Kv k="- 입금액" v={won(cur.dep)} /><Kv k="- 반품 크레딧" v={won(cur.ret)} /><div className="flex items-baseline justify-between border-t border-[var(--n3)] pt-3"><span className="pg-body font-semibold">현재 미수금</span><span className="text-[19px] font-bold num">{won(bal)}</span></div></div></div></div>
        <div className="pg-card p-6" key={key(sel)}>
          <div className="flex items-center justify-between"><div><div className="pg-small">{sel.date.replace(/-/g, '.')} · {sel.kind}</div><div className="pg-h2">{sel.kind === '입금' ? '입금 확인' : sel.ref.startsWith('OD') ? sel.ref : sel.ref}</div></div>{sel.kind === '출고' && so && <button className="pg-btn2 pg-sm" onClick={() => go('shipments', { stmt: so.id.slice(-4) })}><Icon name="file-text" size={15} />거래명세서</button>}</div>
          {so ? <div className="pg-tblwrap mt-3"><table className="pg-tbl"><thead><tr><th>품목</th><th className="r">출고</th><th className="r">단가</th><th className="r">금액</th></tr></thead><tbody>{so.lines.filter(l => qtyOf(l.sh)).map((l, i) => <tr key={i}><td>{PBY[l.pid].name}<div className="pg-small">{l.color}</div></td><td className="r num">{qtyOf(l.sh)}</td><td className="r num">{fmtNum(priceFor(ME, l.pid))}</td><td className="r num">{fmtNum(qtyOf(l.sh) * priceFor(ME, l.pid))}</td></tr>)}</tbody></table></div>
            : sr ? <div className="mt-3"><Kv k="반품 품목" v={`${PBY[sr.pid].name} ${sr.color} ${sr.size} ${sr.qty}벌`} /><Kv k="사유" v={sr.reason} /><Kv k="처리" v={sr.status} /></div>
            : <div className="mt-3"><Kv k="구분" v={sel.kind} /><Kv k="내용" v={sel.kind === '입금' ? '계좌 입금 확인' : '마감된 달의 출고분'} /></div>}
          <div className="mt-3 border-t border-[var(--n3)] pt-2"><Kv k={sel.kind + ' 금액'} v={won(sel.amount)} /><Kv k="이 거래 후 미수금" v={won(sel.bal)} /></div>
        </div>
      </div>
      <div className="pg-card pg-tblwrap mt-5"><table className="pg-tbl">
        <thead><tr><th>날짜</th><th>구분</th><th>내용</th><th className="r">금액</th><th className="r">누계 미수금</th></tr></thead>
        <tbody>{rows.map(t => <tr key={key(t)} data-row data-sel={key(t) === key(sel)} onClick={() => setSelKey(key(t))}><td>{t.date.slice(5).replace('-', '.')}</td><td><Pill tone={t.kind === '출고' ? 'gray' : t.kind === '입금' ? 's1' : 's2'}>{t.kind}</Pill></td><td className="num">{t.kind === '입금' ? '계좌 입금' : t.kind === '반품' ? t.ref + ' 반품 크레딧' : t.ref + ' 출고분'}</td><td className="r num">{t.kind === '출고' ? '' : '-'}{fmtNum(t.amount)}</td><td className="r num font-semibold">{fmtNum(t.bal)}</td></tr>)}</tbody>
      </table></div>
    </div>
  );
}

/* ── 내 계정 ── */
function Account() {
  useLucide();
  const c = CUST[ME]; const [tg, setTg] = useState({ order: true, ship: true, pay: false });
  const staff = [['박서윤', '대표 · 주문·정산 전체', '오늘 09:02'], ['김지후', '주문 담당 · 주문서 작성', '어제 17:40'], ['이나은', '경리 · 거래 내역 조회', '11.10 14:25']];
  const indiv = Object.entries(INDIV[ME]).map(([pid, pr]) => [pid, PBY[pid].name, PBY[pid].list, pr]);
  return (
    <div className="pg-page mx-auto max-w-[1280px] px-5 pb-16 pt-8">
      <h1 className="pg-h1">내 계정</h1><p className="pg-small mt-1">계정 정보와 적용 단가 등급, 함께 쓰는 담당자 계정을 확인할 수 있어요.</p>
      <div className="mt-6 grid gap-5 lg:grid-cols-3">
        <div className="pg-card p-6"><div className="pg-h2">거래처 정보</div><div className="mt-2"><Kv k="상호" v={ME} /><Kv k="대표 담당자" v={c.mgr} /><Kv k="연락처" v={c.tel} /><Kv k="사업자 구분" v="법인사업자" /><Kv k="결제 조건" v="월 1회 마감 후 입금" /></div></div>
        <div className="pg-card p-6"><div className="pg-h2">적용 단가</div><div className="mt-3 flex items-baseline gap-2"><span className="text-[35px] font-bold text-[var(--m700)]">A</span><span className="pg-body">등급 · 표준 도매가의 92%</span></div><div className="pg-tblwrap mt-3"><table className="pg-tbl"><thead><tr><th>개별 단가 상품</th><th className="r">표준가</th><th className="r">적용 단가</th></tr></thead><tbody>{indiv.map(([id, n, l, pr]) => <tr key={id}><td>{n}</td><td className="r num">{fmtNum(l)}</td><td className="r num font-semibold">{fmtNum(pr)}</td></tr>)}</tbody></table></div><p className="pg-small mt-2">개별 단가가 있으면 등급 단가보다 먼저 적용돼요.</p></div>
        <div className="pg-card p-6"><div className="pg-h2">알림 받기</div>{[['order', '주문 접수·확인 알림'], ['ship', '출고·송장 알림'], ['pay', '입금 확인 알림']].map(([k, l]) => <div key={k} className="flex items-center justify-between border-b border-[var(--n2)] py-3 last:border-0"><span className="pg-body">{l}</span><button role="switch" aria-checked={tg[k]} aria-label={l} onClick={() => setTg(t => ({ ...t, [k]: !t[k] }))} className={cx('relative h-6 w-11 rounded-full transition-colors', tg[k] ? 'bg-[var(--m600)]' : 'bg-[var(--n4)]')}><span className={cx('absolute top-0.5 h-5 w-5 rounded-full bg-[var(--n1)] transition-all', tg[k] ? 'left-[22px]' : 'left-0.5')} /></button></div>)}</div>
      </div>
      <div className="pg-card pg-tblwrap mt-5"><div className="px-6 pt-5 pg-h2">담당자 계정 3개</div><table className="pg-tbl mt-2"><thead><tr><th>이름</th><th>권한</th><th>최근 접속</th><th>상태</th></tr></thead><tbody>{staff.map(s => <tr key={s[0]}><td className="font-medium">{s[0]}</td><td>{s[1]}</td><td>{s[2]}</td><td><Pill tone="s1">사용 중</Pill></td></tr>)}</tbody></table></div>
    </div>
  );
}

/* ── 앱 ── */
const MENU = [['main', '상품 목록'], ['order-sheet', '주문서'], ['orders', '주문 내역'], ['shipments', '출고·명세서'], ['returns', '반품 접수'], ['ledger', '거래 내역·미수금']];
const CART0 = { 'TS-1102|핑크': { M: 12, L: 12 }, 'TS-1102|레드': { M: 8, L: 8 }, 'PT-3305|블루': { M: 6, L: 6 }, 'JK-5201|올리브': { M: 4, L: 4 } };
function App() {
  const route = useRoute();
  useLucide();
  const [cart, setCart] = useState(CART0);
  const [orders, setOrders] = useState(() => ORDERS0.filter(o => o.cust === ME));
  const [returns, setReturns] = useState(() => RETURNS0.filter(r => r.cust === ME));
  const [msg, setMsg] = useState(null);
  const toast = (t) => { setMsg(t); clearTimeout(window.__tt); window.__tt = setTimeout(() => setMsg(null), 3200); };
  const reset = () => { setCart(CART0); setOrders(ORDERS0.filter(o => o.cust === ME)); setReturns(RETURNS0.filter(r => r.cust === ME)); go('main'); toast('예시 데이터를 처음 상태로 되돌렸어요'); };
  const submit = (entries) => {
    const id = '0433'; const lines = entries.map(e => ({ pid: e.pid, color: e.color, q: { ...e.q }, sh: {} }));
    setOrders(os => [{ id: 'OD-2611-' + id, date: TODAY, cust: ME, status: '접수', lines, shipDate: null, waybill: null }, ...os.filter(o => o.id !== 'OD-2611-' + id)]);
    setCart({}); toast('주문이 접수되었습니다 · OD-2611-' + id); go('orders', { id });
  };
  const cartKinds = new Set(Object.keys(cart).map(k => k.split('|')[0])).size;
  useEffect(() => { window.scrollTo(0, 0); }, [route]);
  return (
    <>
      <DemoBar onReset={reset} />
      <div className="min-h-screen bg-[var(--n0)] text-[var(--n9)]">
        <header className="sticky top-[var(--look-bar-h)] z-30 border-b border-[var(--n3)] bg-[var(--n1)]">
          <div className="mx-auto flex h-[var(--c-nav-h)] max-w-[1280px] items-center gap-6 px-5">
            <button onClick={() => go('main')} className="shrink-0 text-[22px] font-extrabold tracking-[-0.05em] text-[var(--n9)]" aria-label="결도매 홈">결도매<span className="ml-1.5 rounded-md border border-[var(--n4)] px-1.5 py-0.5 align-middle text-[11px] font-medium tracking-normal text-[var(--n7)]">거래처</span></button>
            <nav aria-label="주 메뉴" className="hidden h-full flex-1 items-stretch gap-5 overflow-x-auto md:flex">{MENU.map(([r, l]) => <button key={r} className="pg-nav shrink-0" aria-current={route === r ? 'page' : undefined} onClick={() => go(r)}>{l}</button>)}</nav>
            <div className="ml-auto flex items-center gap-3">
              <button className="pg-btn pg-sm" onClick={() => go('order-sheet')}><Icon name="shopping-cart" size={16} />주문서 작성 · {cartKinds}</button>
              <button aria-label="내 계정" className="flex items-center gap-2 rounded-full border border-[var(--n3)] py-1 pl-1 pr-3 hover:bg-[var(--n2)]" onClick={() => go('account')}><span className="grid h-8 w-8 place-items-center rounded-full bg-[var(--n2)] text-[13px] font-semibold text-[var(--n7)]">온</span><span className="hidden pg-body sm:inline">온결상사 · A등급</span></button>
            </div>
          </div>
          <nav aria-label="모바일 메뉴" className="flex gap-4 overflow-x-auto border-t border-[var(--n2)] px-5 md:hidden">{MENU.map(([r, l]) => <button key={r} className="pg-nav h-11 shrink-0" aria-current={route === r ? 'page' : undefined} onClick={() => go(r)}>{l}</button>)}</nav>
        </header>
        <main id="main">
          {route === 'main' && <ProductList onOpen={(pid) => go('order-sheet', { pid })} />}
          {route === 'order-sheet' && <OrderSheet cart={cart} setCart={setCart} onSubmit={submit} />}
          {route === 'orders' && <Orders orders={orders} />}
          {route === 'shipments' && <Shipments orders={orders} />}
          {route === 'returns' && <Returns returns={returns} setReturns={setReturns} orders={orders} toast={toast} />}
          {route === 'ledger' && <Ledger orders={orders} returns={returns} />}
          {route === 'account' && <Account />}
          {!MENU.concat([['account']]).some(m => m[0] === route) && <ProductList onOpen={(pid) => go('order-sheet', { pid })} />}
        </main>
        <footer className="border-t border-[var(--n3)] py-8 text-center pg-small">결도매 거래처 주문 · 문의 02-555-0100 · 사진 · {PH()[0] ? PH()[0].source : 'Pixabay'} ({[...new Set(PH().map(p => p.credit))].join(', ')})</footer>
      </div>
      {msg && <div role="status" className="pg-toast fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-[var(--n9)] px-5 py-3 pg-body text-[var(--n1)]">{msg}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
