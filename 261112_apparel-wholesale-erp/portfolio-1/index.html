const DEMO_FILL = { "차콜|S": 12, "차콜|M": 24, "차콜|L": 24, "차콜|XL": 12, "아이보리|M": 12, "아이보리|L": 18, "아이보리|XL": 6, "카멜|S": 6, "카멜|M": 12, "카멜|L": 12 };
function OrderSheet({ cart, setCart }) {
  const p = useParams();
  const [pid, setPid] = useState(p.product || "p101");
  const [q, setQ] = useState({});
  const [confirm, setConfirm] = useState(false);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const prod = p.product || "p101"; setPid(prod); setDone(false);
    if (p.step === "fill") { setQ(DEMO_FILL); setConfirm(false); }
    else if (p.step === "over") { setQ({ ...DEMO_FILL, "아이보리|XL": 99, "카멜|M": 87 }); setConfirm(false); }
    else if (p.step === "cart") { setQ(DEMO_FILL); setConfirm(true); }
    else { setQ({}); setConfirm(false); }
  }, [p]);
  const prod = PRODUCTS.find((x) => x.id === pid) || PRODUCTS[0];
  const avail = (c, s) => stockOf(prod.id, COLORS.indexOf(c), SIZES.indexOf(s));
  const set = (c, s, v) => setQ((o) => ({ ...o, [c + "|" + s]: Math.max(0, parseInt(v, 10) || 0) }));
  const total = COLORS.reduce((a, c) => a + SIZES.reduce((b, s) => b + (q[c + "|" + s] || 0), 0), 0);
  const over = COLORS.flatMap((c) => SIZES.filter((s) => (q[c + "|" + s] || 0) > avail(c, s)).map((s) => c + " " + s));
  const lines = COLORS.flatMap((c) => SIZES.filter((s) => q[c + "|" + s] > 0).map((s) => ({ pid: prod.id, c, s, n: q[c + "|" + s] })));
  const addCart = () => { if (!lines.length || over.length) return; setCart((a) => [...a.filter((l) => l.pid !== prod.id), ...lines]); };
  const cartLines = cart.length ? cart : (p.step === "cart" ? lines : []);
  const cartSum = cartLines.reduce((a, l) => a + l.n * (PRODUCTS.find((x) => x.id === l.pid) || prod).price, 0);
  const cartN = cartLines.reduce((a, l) => a + l.n, 0);
  return (
    <div className="pg">
      <Band title="색상·사이즈 주문서" sub="수량을 한 번에 채우면 거래처 단가로 합계가 계산됩니다." photo={PH[3].url} />
      <div style={{ display: "flex", gap: 12, alignItems: "center", margin: "32px 0 16px", flexWrap: "wrap" }}>
        <label htmlFor="pp" style={{ fontWeight: 600 }}>상품</label>
        <select id="pp" className="sel" value={pid} onChange={(e) => go("order-sheet", { product: e.target.value })}>{PRODUCTS.map((x) => <option key={x.id} value={x.id}>{x.no} {x.name}</option>)}</select>
        <span className="num">거래처 단가 <b>{won(prod.price)}</b></span>
      </div>
      <div className="g2">
        <section className="box">
          <div className="sc"><table className="tbl">
            <thead><tr><th>색상</th>{SIZES.map((s) => <th key={s} className="r">{s}</th>)}<th className="r">합계</th></tr></thead>
            <tbody>{COLORS.map((c) => (
              <tr key={c}><td><b>{c}</b></td>
                {SIZES.map((s) => { const a = avail(c, s); const v = q[c + "|" + s] || 0; const bad = v > a;
                  return <td key={s} className="r"><input className="qty num" inputMode="numeric" aria-label={c + " " + s + " 수량"} aria-invalid={bad ? "true" : undefined} disabled={a === 0} value={v || ""} placeholder="0" onChange={(e) => set(c, s, e.target.value)} />
                    <div style={{ fontSize: 11, marginTop: 2, color: bad ? "var(--s2-text)" : "var(--n7)" }} className="num">{a === 0 ? "품절" : bad ? "가용 " + a + " 초과" : "가용 " + a}</div></td>; })}
                <td className="r num"><b>{SIZES.reduce((b, s) => b + (q[c + "|" + s] || 0), 0)}</b></td></tr>))}
              <tr><td><b>합계</b></td>{SIZES.map((s) => <td key={s} className="r num">{COLORS.reduce((b, c) => b + (q[c + "|" + s] || 0), 0)}</td>)}<td className="r num"><b>{total}</b></td></tr>
            </tbody></table></div>
          {over.length > 0 && <p role="alert" style={{ margin: "16px 0 0", color: "var(--s2-text)", fontSize: 13 }}>가용 수량을 넘는 칸이 있어요: {over.join(", ")}. 가용 수량 안으로 줄여 주세요.</p>}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 20, flexWrap: "wrap", gap: 12 }}>
            <span className="num">이 상품 합계 <b>{won(total * prod.price)}</b> ({total}장)</span>
            <button type="button" className="btn pri" disabled={!total || over.length > 0} onClick={addCart}>장바구니에 담기</button>
          </div>
        </section>
        <aside className="box" aria-label="장바구니">
          <h3 style={{ margin: "0 0 12px", fontSize: 18, fontWeight: 700 }}>장바구니</h3>
          {cartLines.length ? <ul style={{ listStyle: "none", margin: 0, padding: 0, fontSize: 14 }}>
            {cartLines.slice(0, 8).map((l, i) => <li key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--n3)" }}><span>{(PRODUCTS.find((x) => x.id === l.pid) || prod).no} {l.c} {l.s}</span><span className="num">{l.n}장</span></li>)}
          </ul> : <div data-empty style={{ color: "var(--n7)", fontSize: 14 }}>담은 품목이 없어요. 수량을 채우고 장바구니에 담아 주세요.</div>}
          <div style={{ display: "flex", justifyContent: "space-between", margin: "16px 0", fontWeight: 700 }} className="num"><span>합계 {cartN}장</span><span>{won(cartSum)}</span></div>
          <button type="button" className="btn pri" style={{ width: "100%" }} disabled={!cartN} onClick={() => setConfirm(true)}>주문 접수하기</button>
        </aside>
      </div>
      {confirm && (
        <div className="ovl" role="dialog" aria-modal="true" aria-labelledby="oc-t" onClick={(e) => { if (e.target === e.currentTarget) setConfirm(false); }}>
          <div className="dlg">
            <h3 id="oc-t" style={{ margin: 0, fontSize: 20, fontWeight: 700 }}>{done ? "주문이 접수 상태로 등록됩니다" : "이 내용으로 주문을 접수할까요?"}</h3>
            <p style={{ color: "var(--n8)", fontSize: 14 }}>{cartN}장 · 거래처 단가 합계 <b className="num">{won(cartSum)}</b>. 접수 후 직원이 확인하고 재고를 배정합니다.</p>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
              <button type="button" className="btn" onClick={() => setConfirm(false)}>닫기</button>
              {!done && <button type="button" className="btn pri" onClick={() => { setDone(true); setCart([]); }}>접수하기</button>}
              {done && <button type="button" className="btn pri" onClick={() => go("orders")}>주문 내역 보기</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── 주문 내역 ── */
const STEPS = ["접수", "확인", "재고 배정", "부분 출고", "출고 완료"];
const ORDERS = [
  { id: "O-2611-034", date: "2026.11.12", st: 1, amount: 1368000, items: [["No. 104 릴렉스 코튼 셔츠 · 아이보리 M", 24, 0], ["No. 105 헤비 코튼 라운드 티 · 차콜 L", 60, 0]] },
  { id: "O-2611-033", date: "2026.11.11", st: 2, amount: 912000, items: [["No. 107 와이드 코튼 팬츠 · 카멜 L", 48, 0]] },
  { id: "O-2611-031", date: "2026.11.10", st: 3, amount: 2186000, items: [["No. 101 오버핏 울 블렌드 자켓 · 차콜 M", 24, 12], ["No. 101 오버핏 울 블렌드 자켓 · 아이보리 L", 18, 18], ["No. 103 경량 패딩 베스트 · 카멜 S", 12, 0]] },
  { id: "O-2611-028", date: "2026.11.07", st: 4, amount: 754000, items: [["No. 109 플리츠 롱 스커트 · 차콜 FREE", 40, 40]] },
  { id: "O-2610-097", date: "2026.10.29", st: 5, amount: 330000, items: [["No. 111 셔링 반팔 원피스 · 아이보리 M", 10, 10]], ret: true },
];
const stLabel = (o) => o.ret ? "반품" : STEPS[o.st - 1] === "출고 완료" ? "출고 완료" : STEPS[o.st - 1];
function Orders() {
  const p = useParams();
  const [open, setOpen] = useState(p.open || null);
  const [items, setItems] = useState(p.items === "1");
  useEffect(() => { setOpen(p.open || null); setItems(p.items === "1"); }, [p]);
  const sel = ORDERS.find((o) => o.id === open);
  return (
    <div className="pg">
      <Band title="주문 내역" sub="접수부터 출고까지 진행 단계를 확인합니다. 본인 주문만 조회됩니다." photo={PH[2].url} />
      <div className="g2" style={{ marginTop: 32 }}>
        <section className="box sc"><table className="tbl">
          <thead><tr><th>주문번호</th><th>주문일</th><th>상태</th><th className="r">금액</th></tr></thead>
          <tbody>{ORDERS.map((o) => (
            <tr key={o.id} style={{ cursor: "pointer", background: open === o.id ? "var(--m50)" : undefined }} onClick={() => go("orders", { open: o.id })} aria-selected={open === o.id}>
              <td><button type="button" className="btn sm" onClick={(e) => { e.stopPropagation(); go("orders", { open: o.id }); }}>{o.id}</button></td>
              <td className="num">{o.date}</td>
              <td><span className={cx("pill", o.ret ? "bad" : o.st === 5 && "ok")}>{stLabel(o)}</span></td>
              <td className="r num">{won(o.amount)}</td></tr>))}</tbody></table></section>
        <aside className="box" aria-label="주문 상세">
          {!sel ? <div data-empty style={{ color: "var(--n7)", fontSize: 14 }}>주문 한 건을 선택하면 진행 단계가 보입니다.</div> : (
            <>
              <h3 style={{ margin: "0 0 12px", fontSize: 18, fontWeight: 700 }}>{sel.id}</h3>
              <ol className="tl">{STEPS.map((s, i) => <li key={s} className={i < sel.st ? "on" : ""}><b>{s}</b><div style={{ color: "var(--n7)", fontSize: 12 }}>{i < sel.st ? sel.date.slice(5) + " " + (9 + i) + ":" + (10 + i * 7) : "대기"}</div></li>)}</ol>
              <button type="button" className="btn sm" aria-expanded={items} onClick={() => setItems((v) => !v)}>{items ? "품목 접기" : "품목 펼치기"}</button>
              {items && <div className="sc" style={{ marginTop: 12 }}><table className="tbl"><thead><tr><th>품목</th><th className="r">주문</th><th className="r">출고</th><th className="r">남음</th></tr></thead>
                <tbody>{sel.items.map((it, i) => <tr key={i}><td>{it[0]}</td><td className="r num">{it[1]}</td><td className="r num">{it[2]}</td><td className="r num"><b>{it[1] - it[2]}</b></td></tr>)}</tbody></table></div>}
            </>)}
        </aside>
      </div>
    </div>
  );
}

/* ── 미수금 조회 ── */
const LEDGER = {
  "2026.11": { carry: 1480000, rows: [["11.03", "주문", "O-2611-020", 1420000], ["11.07", "주문", "O-2611-028", 754000], ["11.08", "입금", "농협 입금 매칭", -1480000], ["11.10", "주문", "O-2611-031", 2186000], ["11.11", "반품", "R-2611-004 불량 반품", -330000]] },
  "2026.10": { carry: 620000, rows: [["10.05", "주문", "O-2610-041", 1860000], ["10.19", "입금", "농협 입금 매칭", -620000], ["10.29", "주문", "O-2610-097", 330000], ["10.31", "입금", "농협 입금 매칭", -90000]] },
};
function Ledger() {
  const p = useParams();
  const [m, setM] = useState("2026.11"); const [st, setSt] = useState(p.statement === "1"); const [note, setNote] = useState("");
  useEffect(() => { setSt(p.statement === "1"); }, [p]);
  const d = LEDGER[m];
  const sum = (t) => d.rows.filter((r) => r[1] === t).reduce((a, r) => a + Math.abs(r[3]), 0);
  const ord = sum("주문"), dep = sum("입금"), ret = sum("반품"); const bal = d.carry + ord - dep - ret;
  return (
    <div className="pg">
      <Band title="미수금 조회" sub="월별 주문금액·입금액·미수금을 거래 내역과 같은 기준으로 합산합니다." photo={PH[0].url} />
      <div style={{ display: "flex", gap: 12, alignItems: "center", margin: "32px 0 16px", flexWrap: "wrap" }}>
        <label htmlFor="mm" style={{ fontWeight: 600 }}>조회 월</label>
        <select id="mm" className="sel" value={m} onChange={(e) => setM(e.target.value)}>{Object.keys(LEDGER).map((k) => <option key={k}>{k}</option>)}</select>
        <button type="button" className="btn" onClick={() => setSt(true)}><Icon name="download" size={16} /> 거래명세서</button>
      </div>
      <div className="g3" style={{ marginBottom: 16 }}>
        {[["전월 이월", d.carry], ["주문금액 − 반품", ord - ret], ["입금액", dep]].map(([k, v]) => <div key={k} className="box"><div style={{ color: "var(--n7)", fontSize: 12 }}>{k}</div><div className="num" style={{ fontSize: 26, fontWeight: 700 }}>{won(v)}</div></div>)}
      </div>
      <div className="box" style={{ marginBottom: 16, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}><b>이번 달 미수금</b><b className="num" style={{ color: "var(--m700)" }}>{won(bal)}</b></div>
      <section className="box sc"><table className="tbl"><thead><tr><th>일자</th><th>구분</th><th>내용</th><th className="r">금액</th></tr></thead>
        <tbody>{d.rows.map((r, i) => <tr key={i}><td className="num">{r[0]}</td><td><span className="pill">{r[1]}</span></td><td>{r[2]}</td><td className="r num">{r[3] < 0 ? "−" + won(-r[3]) : won(r[3])}</td></tr>)}</tbody></table></section>
      {st && (
        <div className="ovl" role="dialog" aria-modal="true" aria-labelledby="st-t" onClick={(e) => { if (e.target === e.currentTarget) setSt(false); }}>
          <div className="dlg">
            <h3 id="st-t" style={{ margin: 0, fontSize: 20, fontWeight: 700 }}>{m} 거래명세서 미리보기</h3>
            <p style={{ color: "var(--n7)", fontSize: 13 }}>해든패션 · B등급 거래처</p>
            <table className="tbl"><tbody>{d.rows.filter((r) => r[1] !== "입금").map((r, i) => <tr key={i}><td className="num">{r[0]}</td><td>{r[2]}</td><td className="r num">{r[3] < 0 ? "−" + won(-r[3]) : won(r[3])}</td></tr>)}
              <tr><td colSpan="2"><b>합계</b></td><td className="r num"><b>{won(ord - ret)}</b></td></tr></tbody></table>
            {note && <p role="status" style={{ fontSize: 13, color: "var(--n8)" }}>{note}</p>}
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
              <button type="button" className="btn" onClick={() => setSt(false)}>닫기</button>
              <button type="button" className="btn pri" onClick={() => setNote("거래명세서 PDF를 내려받습니다.")}>PDF 내려받기</button>
            </div>
          </div>
        </div>)}
    </div>
  );
}

function App() {
  const route = useRoute();
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem("og-cart") || "[]"); } catch (e) { return []; } });
  useEffect(() => { try { localStorage.setItem("og-cart", JSON.stringify(cart)); } catch (e) {} }, [cart]);
  useLucide();
  useRfMotion(route);
  const cartN = cart.reduce((a, l) => a + l.n, 0);
  const R = { "order-sheet": <OrderSheet cart={cart} setCart={setCart} />, orders: <Orders />, ledger: <Ledger /> }[route] || <Home cartN={cartN} />;
  return (
    <>
      <DemoBar onReset={() => { setCart([]); go("main"); }} />
      <div id="rf-root" className="rf-root" data-tone="light">
        <Header route={route} cartN={cartN} />
        <main id="main">{R}</main>
        <Footer />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
