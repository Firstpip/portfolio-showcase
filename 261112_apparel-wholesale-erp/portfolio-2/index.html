const availOf = (l) => Math.max(0, l.stock - l.hold - (l.assigned - l.shipped));
const STATUS_TONE = { "접수": "warn", "배정": "accent", "부분 출고": "accent", "완료": "gray", "반품": "danger" };

/* ── 주문 상세·처리 대화상자: 같은 건을 상세·배정·출고·반품 모드로 연다 ── */
function OrderModal({ o, mode, onMode, onClose, onAssign, onShip, onReturn }) {
  const [shipQty, setShipQty] = useState({});
  const [branch, setBranch] = useState("재입고");
  const [retQty, setRetQty] = useState(2);
  useEffect(() => { setShipQty({}); setBranch("재입고"); setRetQty(2); }, [o && o.id, mode]);
  if (!o) return null;
  const todo = (l) => Math.max(0, Math.min(l.assigned - l.shipped, l.stock));
  const qtyOf = (l, i) => (shipQty[i] == null ? todo(l) : Math.min(Math.max(0, Number(shipQty[i]) || 0), todo(l)));
  const shortAll = o.lines.reduce((a, l) => a + Math.max(0, l.qty - Math.min(l.qty, l.stock - l.hold)), 0);
  const title = mode === "assign" ? "재고 배정" : mode === "ship" ? "출고 처리" : mode === "return" ? "반품 접수" : o.id;
  const sub = mode === "detail" ? `${o.client} · ${o.at} 접수` : `${o.id} · ${o.client}`;
  let body, footer;
  if (mode === "assign") {
    body = (
      <div className="space-y-3">
        <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>품목</th><th className="num">주문</th><th className="num">가용</th><th className="num">배정될 수량</th></tr></thead><tbody>
          {o.lines.map((l, i) => { const give = Math.min(l.qty, Math.max(0, l.stock - l.hold)); const lack = l.qty - give; return (
            <tr key={i}><td>{l.name}<span className="block text-[13px] text-ink-3">{l.opt}</span></td><td className="num tnum">{l.qty}</td><td className="num tnum">{Math.max(0, l.stock - l.hold)}</td><td className="num tnum">{give}{lack > 0 && <Pill tone="warn" className="ml-2">부족 {lack}</Pill>}</td></tr>); })}
        </tbody></table></div>
        <p className="text-[14px] text-ink-2">{shortAll > 0 ? `가용 수량이 모자란 품목은 ${shortAll}개가 부족으로 남고, 입고되면 이어서 배정합니다.` : "모든 품목이 가용 수량 안에서 배정됩니다."}</p>
      </div>);
    footer = <><Button onClick={() => onMode("detail")}>돌아가기</Button><Button variant="primary" onClick={() => onAssign(o.id)}>배정 확정</Button></>;
  } else if (mode === "ship") {
    body = (
      <div className="space-y-3">
        <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>품목</th><th className="num">주문</th><th className="num">기출고</th><th className="num">이번 출고</th><th className="num">남는 수량</th></tr></thead><tbody>
          {o.lines.map((l, i) => { const q = qtyOf(l, i); return (
            <tr key={i}><td>{l.name}<span className="block text-[13px] text-ink-3">{l.opt}</span></td><td className="num tnum">{l.qty}</td><td className="num tnum">{l.shipped}</td>
              <td className="num"><input className="field tnum !w-20 text-right" type="number" min="0" max={todo(l)} value={q} onChange={(e) => setShipQty({ ...shipQty, [i]: e.target.value })} aria-label={`${l.name} ${l.opt} 이번 출고 수량`} /></td>
              <td className="num tnum">{l.qty - l.shipped - q}</td></tr>); })}
        </tbody></table></div>
        <p className="text-[14px] text-ink-2">출고 수량이 주문 수량보다 적으면 상태가 부분 출고로 바뀌고 남는 수량이 잔량으로 남습니다.</p>
      </div>);
    footer = <><Button onClick={() => onMode("detail")}>돌아가기</Button><Button variant="primary" onClick={() => onShip(o.id, o.lines.map((l, i) => qtyOf(l, i)))}>출고 확정</Button></>;
  } else if (mode === "return") {
    body = (
      <div className="space-y-4">
        <KV rows={[["반품 품목", `${o.lines[0].name} · ${o.lines[0].opt}`], ["출고 수량", <span key="a" className="tnum">{o.lines[0].shipped}개</span>]]} />
        <Field id="rq" label="반품 수량"><input id="rq" className="field tnum !w-28" type="number" min="1" max={o.lines[0].shipped} value={retQty} onChange={(e) => setRetQty(Math.max(1, Math.min(o.lines[0].shipped, Number(e.target.value) || 1)))} /></Field>
        <div><p className="lbl mb-2">처리 분기</p><Segmented label="반품 처리 분기" value={branch} onChange={setBranch} options={[{ key: "재입고", label: "재입고" }, { key: "불량", label: "불량 처리" }]} /></div>
        <p className="text-[14px] text-ink-2">{branch === "재입고" ? `${retQty}개가 실재고로 돌아오고 거래처 원장에서 차감됩니다.` : `${retQty}개는 불량 재고로 분리되고 사입처 반품 목록에 올라갑니다.`}</p>
      </div>);
    footer = <><Button onClick={() => onMode("detail")}>돌아가기</Button><Button variant="primary" onClick={() => onReturn(o.id, branch, retQty)}>반품 접수</Button></>;
  } else {
    body = (
      <div className="space-y-4">
        <div className="flex flex-wrap items-center gap-3"><Pill tone={STATUS_TONE[o.status]} fill={o.status === "접수"}>{o.status}</Pill><span className="tnum text-[14px] text-ink-2">주문금액 {fmtWon(sumOrder(o))}</span></div>
        <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>품목</th><th className="num">주문</th><th className="num">실재고</th><th className="num">배정</th><th className="num">가용</th><th className="num">출고</th></tr></thead><tbody>
          {o.lines.map((l, i) => (<tr key={i}><td>{l.name}<span className="block text-[13px] text-ink-3">{l.opt}</span></td><td className="num tnum">{l.qty}</td><td className="num tnum">{l.stock}</td><td className="num tnum">{l.assigned}</td><td className="num tnum">{availOf(l)}</td><td className="num tnum">{l.shipped}</td></tr>))}
        </tbody></table></div>
        {o.ret && <p className="text-[14px] text-ink-2">반품 {o.ret.qty}개 · {o.ret.branch} 처리</p>}
      </div>);
    const canAssign = o.status === "접수"; const canShip = o.status === "배정" || o.status === "부분 출고"; const canRet = o.status === "완료" || o.status === "부분 출고";
    footer = <><Button onClick={onClose}>닫기</Button>{canRet && <Button onClick={() => onMode("return")}>반품 접수</Button>}{canShip && <Button variant="primary" onClick={() => onMode("ship")}>출고 처리</Button>}{canAssign && <Button variant="primary" onClick={() => onMode("assign")}>재고 배정</Button>}</>;
  }
  return <Modal open onClose={onClose} title={title} sub={sub} footer={footer} width="max-w-2xl">{body}</Modal>;
}

/* ── 현황판 ── */

/* ── 주문 처리·재고 배정 ── */
const FILTERS = ["전체", "접수", "배정", "부분 출고", "완료", "반품"];
function Orders({ orders, setOrders }) {
  const p = useParams();
  const [filter, setFilter] = useState(p.status || "전체");
  const [openId, setOpenId] = useState(p.open || null);
  const [mode, setMode] = useState(p.assign ? "assign" : p.ship ? "ship" : p.ret ? "return" : "detail");
  useEffect(() => { setFilter(p.status || "전체"); setOpenId(p.open || null); setMode(p.assign ? "assign" : p.ship ? "ship" : p.ret ? "return" : "detail"); }, [p]);
  const list = filter === "전체" ? orders : orders.filter((o) => o.status === filter);
  const open = orders.find((o) => o.id === openId);
  const patch = (id, fn) => setOrders((all) => all.map((o) => (o.id === id ? fn(o) : o)));
  const close = () => { setOpenId(null); setMode("detail"); };
  const assign = (id) => {
    const before = orders;
    patch(id, (o) => ({ ...o, status: "배정", lines: o.lines.map((l) => ({ ...l, assigned: Math.min(l.qty, Math.max(0, l.stock - l.hold)) })) }));
    setMode("detail");
    toast(`${id} 재고를 배정했습니다`, "ok", null, () => setOrders(before));
  };
  const ship = (id, qtys) => {
    const total = qtys.reduce((a, b) => a + b, 0);
    if (total === 0) { toast("출고할 수량을 입력해 주세요", "warn"); return; }
    patch(id, (o) => { const lines = o.lines.map((l, i) => ({ ...l, shipped: l.shipped + qtys[i], stock: l.stock - qtys[i] })); const done = lines.every((l) => l.shipped >= l.qty); return { ...o, lines, status: done ? "완료" : "부분 출고" }; });
    setMode("detail");
    toast(`${id} ${fmtNum(total)}개를 출고했습니다`, "ok");
  };
  const ret = (id, branch, qty) => {
    patch(id, (o) => ({ ...o, status: "반품", ret: { branch: branch === "재입고" ? "재입고" : "불량", qty }, lines: o.lines.map((l, i) => (i === 0 && branch === "재입고" ? { ...l, stock: l.stock + qty, shipped: l.shipped - qty, assigned: l.assigned - qty } : l)) }));
    setMode("detail");
    toast(`${id} 반품 ${qty}개를 ${branch === "재입고" ? "재입고" : "불량"}로 접수했습니다`, "ok");
  };
  return (
    <>
      <PageHead title="주문 처리·재고 배정" sub="접수된 주문에 재고를 배정하고 출고·반품까지 처리합니다." right={<Segmented label="상태로 거르기" value={filter} onChange={(k) => { setFilter(k); }} options={FILTERS.map((f) => ({ key: f, label: f }))} />} />
      {list.length === 0 ? <Empty>{filter} 상태인 주문이 없습니다. 다른 상태를 골라 보세요.</Empty> : (
        <div className="card overflow-x-auto px-2 py-2">
          <table className="tbl"><thead><tr><th>주문 번호</th><th>거래처</th><th>접수</th><th className="num">품목 수량</th><th className="num">금액</th><th>상태</th><th></th></tr></thead><tbody>
            {list.map((o, i) => (
              <tr key={o.id}>
                <td><button type="button" className="tnum font-semibold text-accent hover:underline" onClick={() => { setOpenId(o.id); setMode("detail"); }}>{o.id}</button></td>
                <td>{o.client}</td><td className="tnum text-ink-2">{o.at}</td>
                <td className="num tnum">{fmtNum(o.lines.reduce((a, l) => a + l.qty, 0))}</td><td className="num tnum">{fmtWon(sumOrder(o))}</td>
                <td><Pill tone={STATUS_TONE[o.status]} fill={o.status === "접수" && i === 0}>{o.status}</Pill></td>
                <td className="text-right"><Button size="sm" variant="secondary" onClick={() => { setOpenId(o.id); setMode(o.status === "접수" ? "assign" : o.status === "완료" || o.status === "반품" ? "detail" : "ship"); }}>{o.status === "접수" ? "배정" : o.status === "완료" || o.status === "반품" ? "열기" : "출고"}</Button></td>
              </tr>))}
          </tbody></table>
        </div>)}
      <OrderModal o={open} mode={mode} onMode={setMode} onClose={close} onAssign={assign} onShip={ship} onReturn={ret} />
    </>
  );
}

/* ── 입고 검수 ── */
function Receiving({ pos, setPos }) {
  const p = useParams();
  const [poId, setPoId] = useState(p.po || (pos.find((x) => !x.done) || pos[0]).id);
  const [ask, setAsk] = useState(!!p.confirm);
  const [code, setCode] = useState("");
  useEffect(() => { setPoId(p.po || (pos.find((x) => !x.done) || pos[0]).id); setAsk(!!p.confirm); }, [p]);
  const po = pos.find((x) => x.id === poId) || pos[0];
  const patch = (fn) => setPos((all) => all.map((x) => (x.id === po.id ? fn(x) : x)));
  const scan = (c, n) => {
    const line = po.lines.find((l) => l.code === c || l.code.endsWith(c));
    if (!line) { toast(`${c} 바코드는 이 발주에 없습니다`, "warn"); return; }
    patch((x) => ({ ...x, lines: x.lines.map((l) => (l === line ? { ...l, received: l.received + n } : l)) }));
  };
  const short = po.lines.reduce((a, l) => a + Math.max(0, l.ordered - l.received), 0);
  const over = po.lines.reduce((a, l) => a + Math.max(0, l.received - l.ordered), 0);
  const confirm = () => { patch((x) => ({ ...x, done: true })); setAsk(false); toast(`${po.id} 입고를 확정했습니다. 재고에 ${fmtNum(po.lines.reduce((a, l) => a + l.received, 0))}개가 반영됩니다`, "ok"); };
  return (
    <>
      <PageHead title="입고 검수" sub="사입 발주 대비 입고 수량을 바코드로 확인하고 확정합니다." right={<Segmented label="발주 고르기" value={po.id} onChange={setPoId} options={pos.map((x) => ({ key: x.id, label: x.id }))} />} />
      <div className="grid gap-5 lg:grid-cols-[1fr_20rem] [&>*]:min-w-0">
        <section className="card overflow-x-auto px-2 py-2">
          <table className="tbl"><thead><tr><th>품목</th><th className="num">발주</th><th className="num">스캔</th><th className="num">과부족</th><th></th></tr></thead><tbody>
            {po.lines.map((l) => { const diff = l.received - l.ordered; return (
              <tr key={l.code}><td>{l.name}<span className="block text-[13px] text-ink-3">{l.opt} · <span className="tnum">{l.code}</span></span></td>
                <td className="num tnum">{l.ordered}</td><td className="num tnum">{l.received}</td>
                <td className="num">{diff === 0 ? <span className="text-ink-3">일치</span> : <Pill tone={diff < 0 ? "warn" : "danger"}>{diff < 0 ? `부족 ${-diff}` : `초과 ${diff}`}</Pill>}</td>
                <td className="text-right"><Button size="sm" variant="secondary" disabled={po.done} onClick={() => scan(l.code, 1)}>1개 스캔</Button></td></tr>); })}
          </tbody></table>
        </section>
        <aside className="card space-y-4 px-5 py-5">
          <SectionTitle>{po.vendor}</SectionTitle>
          <KV rows={[["발주일", po.date], ["미입고 잔량", <span key="a" className="tnum">{fmtNum(short)}개</span>], ["초과 입고", <span key="b" className="tnum">{fmtNum(over)}개</span>]]} />
          <Field id="bc" label="바코드 입력" hint="PC 스캐너는 이 칸으로 읽힙니다."><input id="bc" className="field tnum" value={code} placeholder="마지막 4자리 또는 전체" onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && code) { scan(code, 1); setCode(""); } }} disabled={po.done} /></Field>
          <div className="flex flex-wrap gap-2">
            <Button variant="secondary" disabled={po.done || !code} onClick={() => { scan(code, 1); setCode(""); }}>스캔 입력</Button>
            <Button variant="secondary" disabled={po.done} onClick={() => toast("휴대폰에서는 카메라가 열려 바코드를 읽습니다", "info")}>카메라로 읽기</Button>
          </div>
          {po.done ? <p className="text-[14px] text-ink-2">입고가 확정된 발주입니다.</p> : <Button variant="primary" className="w-full" onClick={() => setAsk(true)}>입고 확정</Button>}
        </aside>
      </div>
      <Modal open={ask} onClose={() => setAsk(false)} title={`${po.id} 입고를 확정할까요?`} sub={`${po.vendor} · 확정하면 되돌릴 수 없습니다.`}
        footer={<><Button onClick={() => setAsk(false)}>그대로 두기</Button><Button variant="warn" onClick={confirm}>입고 확정</Button></>}>
        <KV rows={[["스캔 합계", <span key="a" className="tnum">{fmtNum(po.lines.reduce((a, l) => a + l.received, 0))}개</span>], ["미입고 잔량", <span key="b" className="tnum">{fmtNum(short)}개 · 발주에 남습니다</span>], ["재고 반영", "품목별 실재고에 더해집니다"]]} />
      </Modal>
    </>
  );
}

/* ── 정산·입금 매칭 ── */
function Settlement({ deposits, setDeposits }) {
  const p = useParams();
  const [tab, setTab] = useState(p.tab || "deposit");
  const [filter, setFilter] = useState(p.filter || "all");
  const [ask, setAsk] = useState(!!p.close);
  const [closed, setClosed] = useState(false);
  const [pick, setPick] = useState(null);
  useEffect(() => { setTab(p.tab || "deposit"); setFilter(p.filter || "all"); setAsk(!!p.close); }, [p]);
  if (!useCan("settlement")) return <NoAccess href="#/main" label="현황판으로">정산·입금 매칭은 운영 관리자만 볼 수 있습니다. 위 &lsquo;보는 사람&rsquo;을 운영 관리자로 바꾸면 보입니다.</NoAccess>;
  const shown = filter === "unmatched" ? deposits.filter((d) => d.status !== "매칭") : deposits;
  const link = (d, client) => { setDeposits((all) => all.map((x) => (x.id === d.id ? { ...x, client, conf: "수동", status: "매칭" } : x))); setPick(null); toast(`${d.payer} 입금을 ${client}에 연결했습니다`, "ok"); };
  return (
    <>
      <PageHead title="정산·입금 매칭" sub="은행 입금 내역을 거래처에 연결하고 거래처·사입처 원장을 마감합니다." right={<Segmented label="정산 구분" value={tab} onChange={setTab} options={[{ key: "deposit", label: "입금 매칭" }, { key: "ledger", label: "거래처 원장" }, { key: "vendor", label: "사입처 지급" }]} />} />
      {tab === "deposit" && (
        <>
          <div className="mb-3 flex flex-wrap items-center justify-between gap-3"><Segmented label="입금 거르기" value={filter} onChange={setFilter} options={[{ key: "all", label: "전체" }, { key: "unmatched", label: "연결 필요" }]} /><span className="text-[13.5px] text-ink-3">은행 조회는 어댑터로 받고, 못 읽은 입금은 직접 등록합니다.</span></div>
          {shown.length === 0 ? <Empty>연결이 필요한 입금이 없습니다. 모든 입금이 거래처에 연결됐습니다.</Empty> : (
            <div className="card overflow-x-auto px-2 py-2"><table className="tbl"><thead><tr><th>입금 시각</th><th>입금자</th><th>은행</th><th className="num">금액</th><th>거래처</th><th>상태</th><th></th></tr></thead><tbody>
              {shown.map((d) => (
                <tr key={d.id}><td className="tnum text-ink-2">{d.at}</td><td>{d.payer}</td><td>{d.bank}</td><td className="num tnum">{fmtWon(d.amount)}</td><td>{d.client || <span className="text-ink-3">미지정</span>}</td>
                  <td><Pill tone={d.status === "매칭" ? "gray" : d.status === "확인 대기" ? "warn" : "danger"}>{d.status}</Pill></td>
                  <td className="text-right">{d.status === "매칭" ? null : <Button size="sm" variant="secondary" onClick={() => setPick(d)}>{d.status === "확인 대기" ? "확인" : "직접 연결"}</Button>}</td></tr>))}
            </tbody></table></div>)}
        </>)}
      {tab === "ledger" && (
        <>
          <div className="mb-3 flex flex-wrap items-center justify-between gap-3"><span className="text-[14px] text-ink-2">2026년 11월 · {closed ? "마감됨. 이후 수정은 조정 전표로만 가능합니다." : "마감 전"}</span><Button variant="warn" disabled={closed} onClick={() => setAsk(true)}>월 마감</Button></div>
          <div className="card overflow-x-auto px-2 py-2"><table className="tbl"><thead><tr><th>거래처</th><th>등급</th><th className="num">주문금액</th><th className="num">입금액</th><th className="num">미수금</th></tr></thead><tbody>
            {CLIENTS.map((c) => (<tr key={c.name}><td>{c.name}</td><td className="text-ink-2">{c.grade}</td><td className="num tnum">{fmtWon(c.order)}</td><td className="num tnum">{fmtWon(c.paid)}</td><td className="num tnum font-semibold">{fmtWon(c.order - c.paid)}</td></tr>))}
          </tbody></table></div>
        </>)}
      {tab === "vendor" && (
        <div className="card overflow-x-auto px-2 py-2"><table className="tbl"><thead><tr><th>사입처</th><th className="num">매입금액</th><th className="num">지급액</th><th className="num">미지급</th><th>지급 예정</th></tr></thead><tbody>
          {VENDORS.map((v) => (<tr key={v.name}><td>{v.name}</td><td className="num tnum">{fmtWon(v.buy)}</td><td className="num tnum">{fmtWon(v.paid)}</td><td className="num tnum font-semibold">{fmtWon(v.buy - v.paid)}</td><td className="tnum text-ink-2">{v.due}</td></tr>))}
        </tbody></table></div>)}
      <Modal open={ask} onClose={() => setAsk(false)} title="2026년 11월을 마감할까요?" sub="마감하면 이 달의 원장은 조정 전표로만 바꿀 수 있습니다."
        footer={<><Button onClick={() => setAsk(false)}>그대로 두기</Button><Button variant="warn" onClick={() => { setClosed(true); setAsk(false); toast("11월 원장을 마감했습니다", "ok"); }}>월 마감</Button></>}>
        <KV rows={[["거래처 미수금 합계", <span key="a" className="tnum">{fmtWon(CLIENTS.reduce((a, c) => a + c.order - c.paid, 0))}</span>], ["미연결 입금", <span key="b" className="tnum">{deposits.filter((d) => d.status !== "매칭").length}건 · 마감 전에 연결하는 편이 좋습니다</span>]]} />
      </Modal>
      <Modal open={!!pick} onClose={() => setPick(null)} title="입금을 연결할 거래처" sub={pick ? `${pick.payer} · ${fmtWon(pick.amount)}` : ""} footer={<Button onClick={() => setPick(null)}>닫기</Button>}>
        <div className="flex flex-wrap gap-2">{CLIENTS.map((c) => (<button key={c.name} type="button" className={pick && pick.client === c.name ? CHIP_ON : CHIP_OFF} onClick={() => link(pick, c.name)}>{c.name}</button>))}</div>
      </Modal>
    </>
  );
}

/* ── 화면 ── */
function App() {
  const route = useRoute();
  const [orders, setOrders] = useState(seedOrders);
  const [pos, setPos] = useState(seedPos);
  const [deposits, setDeposits] = useState(seedDeposits);
  const reset = () => { setOrders(seedOrders()); setPos(seedPos()); setDeposits(seedDeposits()); };
  const groups = [
    { title: "업무", items: [{ route: "main", label: "현황판" }, { route: "orders", label: "주문 처리·재고 배정", cap: "orders" }, { route: "receiving", label: "입고 검수", cap: "receiving" }] },
    { title: "정산", items: [{ route: "settlement", label: "정산·입금 매칭", cap: "settlement" }] },
  ];
  return (
    <>
      <DemoBar onReset={reset} />
      <ConsoleShell groups={groups}>
        {route === "orders" ? <Orders orders={orders} setOrders={setOrders} />
          : route === "receiving" ? <Receiving pos={pos} setPos={setPos} />
          : route === "settlement" ? <Settlement deposits={deposits} setDeposits={setDeposits} />
          : <Dashboard orders={orders} pos={pos} deposits={deposits} />}
      </ConsoleShell>
      <Toaster />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
