const OCR = [['혈청 CRP', '68', 'mg/L'], ['백혈구', '12400', '/uL'], ['크레아티닌', '1.O', 'mg/dL'], ['산소포화도', '93', '%'], ['체온', '38.4', '도'], ['호흡수', '2O', '회/분'], ['혈압(수축)', '128', 'mmHg'], ['심박수', '96', '회/분']];
function Intake() {
  const S = useS(); const { notify } = S; const p = useParams();
  const [step, setStep] = useState(p.step || 'ocr');
  const [vals, setVals] = useState(OCR.map(r => r[1])); const [fixed, setFixed] = useState([false, false]);
  useEffect(() => { setStep(p.step || 'ocr'); }, [p]);
  const target = S.cases.find(c => c.status === 'OCR 확인') || S.cases[0];
  const bad = [2, 5]; const remain = bad.filter((_, i) => !fixed[i]).length;
  const steps = [['input', '임상 정보 입력'], ['ocr', 'OCR 결과 확인'], ['save', '저장과 추천']];
  const save = () => { if (remain > 0) { notify('수정이 필요한 칸이 ' + remain + '개 남아 있어요'); return; } notify(target.id + ' 입력을 저장했어요'); go('result', { id: target.id }); };
  return (<SubPage title="임상 입력" sub={target.id + ' · ' + target.dx + ' · ' + target.who}>
    <ol className="mb-8 grid gap-3 md:grid-cols-3">{steps.map(([k, t], i) => <li key={k}><button type="button" aria-current={step === k ? 'step' : undefined} onClick={() => go('intake', { step: k })} className={cx('flex w-full items-center gap-3 rounded-[var(--r-card)] border px-5 py-4 text-left', step === k ? 'border-[var(--m600)] bg-[var(--m50)]' : 'border-[var(--n3)] hover:bg-[var(--n1)]')}><span className={cx('grid h-8 w-8 place-items-center rounded-full text-[14px] font-bold', step === k ? 'bg-[var(--m600)] text-[var(--on-main)]' : 'bg-[var(--n2)] text-[var(--n7)]')}>{i + 1}</span><span className="text-[16px] font-semibold">{t}</span></button></li>)}</ol>
    {step === 'input' && <Card className="p-6 md:p-8"><div className="grid gap-5 md:grid-cols-2">
      <Field label="진단군" id="i-dx"><select id="i-dx" defaultValue={target.dx} className={inputCls}><option>UTI</option><option>폐렴</option></select></Field>
      <Field label="나이대와 성별" id="i-who"><input id="i-who" defaultValue={target.who} className={inputCls} /></Field>
      <Field label="주요 증상" id="i-sym"><select id="i-sym" className={inputCls}><option>발열과 기침</option><option>배뇨통과 빈뇨</option><option>호흡곤란</option></select></Field>
      <Field label="알레르기 기록" id="i-al"><select id="i-al" className={inputCls}><option>없음</option><option>페니실린계 알레르기</option></select></Field></div>

    <div className="mt-6 grid gap-4"><Field label="이메일" id="l-mail"><input id="l-mail" value={mail} onChange={(e) => setMail(e.target.value)} aria-invalid={!!err && !mail.includes('@')} className={inputCls} /></Field>
      <Field label="비밀번호" id="l-pw"><input id="l-pw" type="password" value={pw} onChange={(e) => setPw(e.target.value)} className={inputCls} /></Field>
      {err && <p role="alert" className="text-[15px] text-[var(--s2-text)]">{err}</p>}</div>
    <div className="mt-6"><BtnP className="w-full" onClick={submit}>로그인하기</BtnP></div></Card></div>);
}

const SCREENS = { main: Home, cases: Cases, intake: Intake, result: Result, envs: Envs, recovery: Recovery, practice: Practice };
function App() {
  const route = useRoute();
  const [S, setS] = useState(initState);
  const [toastText, setToast] = useState('');
  useLucide(); useRfMotion(route);
  useEffect(() => { if (!toastText) return; const t = setTimeout(() => setToast(''), 2600); return () => clearTimeout(t); }, [toastText]);
  const Screen = (!S.authed || route === 'login') ? Login : (SCREENS[route] || Home);
  const val = { ...S, setS, toastText, notify: setToast };
  return (<Ctx.Provider value={val}>
    <DemoBar onReset={() => { setS(initState()); go('main'); }} />
    <Shell><Screen key={route} /></Shell>
  </Ctx.Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
