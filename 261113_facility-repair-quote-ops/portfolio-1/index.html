          {fail && <div className="mt-2 grid gap-2"><textarea className="min-h-20 w-full border border-[var(--n4)] bg-transparent p-2.5 text-[14px] outline-none" value={alt} onChange={(e) => setAlt(e.target.value)} placeholder="예) 현장 통신 불량으로 업로드 실패. 외벽 북측 12㎡ 도장 완료, 고객 확인함" /><Btn kind="sec" disabled={alt.trim().length < 6} onClick={() => toast("대체 기록을 저장했어요")}>대체 기록 저장</Btn></div>}</section>
        <section><h3 className="mb-2 text-[15px] font-bold text-[var(--n10)]">추가 작업 요청</h3><div className="grid gap-3"><Field label="연결할 원작업"><input className={inputCls} value={j.no + " · " + j.title} readOnly /></Field><Field label="사유"><input className={inputCls} value={exWhy} onChange={(e) => setExWhy(e.target.value)} placeholder="예) 벽면 균열 보수 필요" /></Field><Field label="추가 비용(원)"><input className={inputCls + " text-right tabular-nums"} value={exAmt} inputMode="numeric" onChange={(e) => setExAmt(parseInt(e.target.value.replace(/\D/g, "") || "0", 10))} /></Field><Btn kind="sec" disabled={exWhy.trim().length < 4} onClick={() => toast("추가 작업 " + fmtWon(exAmt) + " 을 요청했어요. 운영 확인과 고객 승인을 모두 받아야 진행해요")}>추가 작업 요청 보내기</Btn></div></section>
        <section><h3 className="mb-2 text-[15px] font-bold text-[var(--n10)]">완료 보고 · 점검 {checks.filter(Boolean).length}/{CK.length}</h3><ul className="grid gap-1.5">{CK.map((c, i) => <li key={c}><label className="flex min-h-11 cursor-pointer items-center gap-3 border-b border-[var(--n2)] text-[15px]"><input type="checkbox" className="h-5 w-5 accent-[var(--m600)]" checked={checks[i]} onChange={() => setChecks(checks.map((x, k) => (k === i ? !x : x)))} />{c}</label></li>)}</ul></section>
        <section aria-label="수령 금액 확인"><h3 className="mb-2 text-[15px] font-bold text-[var(--n10)]">수령 금액 확인</h3><div className="flex items-center justify-between text-[14.5px] text-[var(--n7)]"><span>견적 합계</span><b className="tabular-nums text-[var(--n10)]">{fmtWon(due)}</b></div><Field label="받은 금액(원)"><input className={inputCls + " text-right text-[18px] font-bold tabular-nums"} value={recv} inputMode="numeric" onChange={(e) => setRecv(parseInt(e.target.value.replace(/\D/g, "") || "0", 10))} /></Field>
          {diff !== 0 && recv > 0 && <p className="mt-2 border-l-2 border-[var(--s2)] bg-[var(--s2-bg)] p-2.5 text-[14px] text-[var(--s2-text)]" role="status">견적 합계와 {fmtWon(Math.abs(diff))} 달라요. 보내면 운영 담당자가 두 금액을 비교해 다시 확인을 요청해요.</p>}
          <Btn className="mt-3 w-full" disabled={!recv} onClick={() => toast("수령 " + fmtWon(recv) + " 을 확인했어요" + (diff !== 0 ? ". 금액 차이는 운영 확인으로 넘어가요" : ""), diff !== 0 ? "warn" : "ok")}>수령 확인 보내기</Btn></section>
      </div></div></div></>);
}

function App() {
  const route = useRoute(); useLucide(); useRfMotion(route);
  const init = { receipt: null, chosen: null, extraOk: null, as: [], joined: null, sentQuote: null };
  const [st, setSt] = useState(init);
  const api = useMemo(() => ({ ...st,
    submit: (cat) => { const n = "R-2611-0496"; setSt((s) => ({ ...s, receipt: n })); return n; }, clear: () => setSt((s) => ({ ...s, receipt: null })),
    choose: (id) => setSt((s) => ({ ...s, chosen: id })), approveExtra: (no) => setSt((s) => ({ ...s, extraOk: no })),
    addAs: (a) => setSt((s) => ({ ...s, as: [a, ...s.as] })), join: (n) => setSt((s) => ({ ...s, joined: n })), sendQuote: (n) => setSt((s) => ({ ...s, sentQuote: n })) }), [st]);
  const Screen = { login: Login, main: Main, quotes: Quotes, progress: Progress, as: As, "partner-join": PartnerJoin, "partner-quote": PartnerQuote, "partner-work": PartnerWork }[route] || Main;
  return (<Ctx.Provider value={api}>
    <DemoBar onReset={() => { setSt(init); go("main", {}); }} />
    <div id="rf-root" className="rf-root" data-tone="deep-neutral"><Header /><main id="main"><Screen /></main><Footer /></div>
    <Toaster2 />
  </Ctx.Provider>);
}
/* 토스트: 화면 아래 한 줄 */
let _toastSet = null;
function toast(t, kind) { if (_toastSet) _toastSet({ t, kind, k: Date.now() }); }
function Toaster2() { const [m, set] = useState(null); _toastSet = set; useEffect(() => { if (!m) return; const x = setTimeout(() => set(null), 3200); return () => clearTimeout(x); }, [m]); return m ? <div role="status" aria-live="polite" className="fixed bottom-20 left-1/2 z-[80] -translate-x-1/2 bg-[var(--n10)] px-5 py-3 text-[14.5px] font-bold text-white">{m.t}</div> : null; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
