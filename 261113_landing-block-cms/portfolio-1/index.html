  const ph = phOf(5);
  const sellers = {}; det.forEach(d => { sellers[d.seller] = sellers[d.seller] || []; sellers[d.seller].push(d); });
  const groups = Object.entries(sellers).filter(([, a]) => a.length > 0).sort((a, b) => b[1].length - a[1].length).slice(0, 4);
  const rows = [
    { t: '의심 이미지를 정품 기준과 나란히 봐요', d: '판독 결과는 서체·봉제·인쇄처럼 사람이 확인하는 항목 단위로 나뉘어요.', visual: ph ? <img src={ph.url} alt="분석 화면이 켜진 노트북" className="w-full h-full object-cover" /> : null },
    { t: '같은 판매자의 반복 게시물을 묶어요', d: '판매자별로 걸린 게시물 수와 마켓을 모아 보면 어디부터 신고할지 보여요.', visual: <table className="w-full text-[length:var(--c-small)]"><thead><tr className="text-left text-[var(--n7)]"><th className="py-2 px-4 font-semibold">판매자</th><th className="py-2 font-semibold">마켓</th><th className="py-2 px-4 text-right font-semibold">게시물</th></tr></thead><tbody>{groups.map(([s, a]) => <tr key={s} className="border-t border-[var(--n2)]"><td className="py-2.5 px-4 font-semibold text-[var(--n9)] num">{s}</td><td className="py-2.5 text-[var(--n8)]">{a[0].site}</td><td className="py-2.5 px-4 text-right num text-[var(--n9)]">{a.length}건</td></tr>)}</tbody></table> },
    { t: '삭제 요청의 진행을 한곳에서 확인해요', d: '접수·검토·삭제 확인 단계마다 상태가 남아 다음 할 일이 바로 보여요.', visual: <ul className="divide-y divide-[var(--n2)]">{det.filter(d => d.status === '삭제 요청 중' || d.status === '삭제 완료').slice(0, 4).map(d => <li key={d.id} className="flex items-center gap-3 px-4 py-2.5"><span className="min-w-0 flex-1 truncate font-semibold text-[var(--n9)] text-[length:var(--c-small)]">{d.product}</span><SPill s={d.status} /></li>)}</ul> },
  ];
  return (
    <section className="rf-sec" id="process-block">
      <div className="rf-in">
        <h2 className="rf-h2 rf-reveal max-w-[30rem]">{c.title}</h2>
        <div className="mt-10 grid gap-14">
          {rows.map((r, i) => (
            <div key={r.t} className="grid gap-8 lg:grid-cols-2 items-center rf-reveal">
              <div className={cx('min-w-0', i % 2 ? 'lg:order-2' : '')}>
                <div className="text-[length:var(--c-small)] text-[var(--n7)] num">0{i + 1}</div>
                <h3 className="mt-1 text-[length:var(--t-section)] font-bold tracking-[-0.03em] text-[var(--n10)]">{r.t}</h3>
                <p className="mt-3 text-[length:var(--c-body)] leading-[var(--c-body-lh)] text-[var(--n8)] max-w-[30rem]">{r.d}</p>
              </div>
              <div className={cx('border border-[var(--n3)] rounded-[var(--r-card)] overflow-hidden bg-[var(--n0)] min-w-0', i === 0 ? 'aspect-[16/10]' : 'py-1')}>{r.visual}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function CaseCard({ k }) {
  return (
    <li className="border border-[var(--n3)] rounded-[var(--r-card)] bg-[var(--n0)] p-5 flex flex-col min-w-0">
      <span className="self-start px-2.5 h-6 inline-flex items-center rounded-full bg-[var(--n2)] text-[var(--n7)] text-[length:var(--c-small)] font-semibold">{fieldName(k.field)}</span>
      <div className="mt-4 text-[length:var(--c-small)] text-[var(--n7)]">{k.brand}</div>
      <h3 className="mt-1 text-[length:var(--c-body)] font-bold leading-snug text-[var(--n10)] flex-1">{k.title}</h3>
      <div className="mt-4 pt-3 border-t border-[var(--n2)] text-[length:var(--c-small)] text-[var(--n7)] num">마켓 {k.markets}곳 · 등록 상품 {k.items}종</div>
    </li>
  );
}
function Grid({ c, p, route, go }) {
  const field = p.field || 'all';
  const list = CASES.filter(k => field === 'all' || k.field === field);
  return (
    <section className="rf-sec alt" id="case-grid">
      <div className="rf-in">
        <div className="rf-head"><h2 className="rf-h2 rf-reveal">{c.title}</h2><p className="text-[length:var(--c-small)] text-[var(--n7)] num" aria-live="polite">사례 {list.length}건</p></div>
        <div className="flex flex-wrap gap-2" role="group" aria-label="분야로 거르기">
          {[['all', '전체'], ...FIELDS].map(([k, l]) => <button key={k} aria-pressed={field === k} className={CHIP(field === k)} onClick={() => go(route, k === 'all' ? {} : { field: k })}>{l}</button>)}
        </div>
        <ul className="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">{list.map(k => <CaseCard key={k.id} k={k} />)}</ul>
      </div>
    </section>
  );
}

function Slider({ items, render, label, w }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(0);
  const move = (d) => { const el = ref.current; if (!el) return; el.scrollBy({ left: d * (w + 16), behavior: 'smooth' }); };
  useEffect(() => { const el = ref.current; if (!el) return; const f = () => setPos(Math.round(el.scrollLeft / (w + 16))); el.addEventListener('scroll', f, { passive: true }); return () => el.removeEventListener('scroll', f); }, []);
  return (
    <div>
      <ul ref={ref} aria-label={label} className="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-2 [scrollbar-width:none]" style={{ scrollbarWidth: 'none' }}>{items.map((it, i) => <li key={i} className="snap-start shrink-0" style={{ width: w }}>{render(it)}</li>)}</ul>
      <div className="mt-4 flex items-center justify-between">
        <span className="text-[length:var(--c-small)] text-[var(--n7)] num">{Math.min(pos + 1, items.length)} / {items.length}</span>
        <div className="flex gap-2"><button className={BTN2} aria-label="이전" onClick={() => move(-1)}><Icon name="chevron-left" size={16} /></button><button className={BTN2} aria-label="다음" onClick={() => move(1)}><Icon name="chevron-right" size={16} /></button></div>
      </div>
    </div>
  );
}
function Logos({ c }) {
  return (
    <section className="rf-sec" id="logo-block">
      <div className="rf-in">
        <h2 className="rf-h2 sm rf-reveal">{c.title}</h2>
        <div className="mt-8"><Slider label="고객사 로고" items={LOGOS} w={180} render={(n) => <div className="h-20 grid place-items-center border border-[var(--n3)] rounded-[var(--r-card)] bg-[var(--n0)] text-[var(--n8)] text-[20px]"><span className={MARK(n, LOGOS.indexOf(n))}>{n}</span></div>} /></div>
      </div>
    </section>
  );
}
function CaseSlider({ c }) {
  return (
    <section className="rf-sec alt" id="case-slider">
      <div className="rf-in">
        <h2 className="rf-h2 rf-reveal">{c.title}</h2>
        <div className="mt-8"><Slider label="도입 사례" items={CASES.slice(0, 4)} w={300} render={(k) => <ul><CaseCard k={k} /></ul>} /></div>
      </div>
    </section>
  );
}
function Cta({ c, go }) {
  const ph = phOf(6);
  const [email, setEmail] = useState(''); const [err, setErr] = useState('');
  const submit = (e) => { e.preventDefault(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr('회사 이메일 형식으로 입력해 주세요. 예: name@company.co.kr'); return; } go('contact', { email }); };
  return (
    <section className="rf-close" id="contact-band">
      {ph && <div className="rf-close-media"><img src={ph.url} alt="" /></div>}
      <div className="rf-close-in rf-in">
        <h2 className="rf-reveal">{c.title}</h2>
        <p className="sub">{c.body}</p>
        <form onSubmit={submit} noValidate className="mt-7 flex flex-wrap gap-3 max-w-[34rem]">
          <div className="flex-1 min-w-[220px]"><label htmlFor="band-email" className="sr-only">회사 이메일</label><input id="band-email" className={FIELD} type="email" value={email} onChange={(e) => { setEmail(e.target.value); setErr(''); }} placeholder="name@company.co.kr" aria-invalid={!!err} /></div>
          <button type="submit" className={BTN}>{c.cta}</button>
          {err && <p className="basis-full text-[length:var(--c-small)] text-[var(--rf-ink)]" role="alert">{err}</p>}
        </form>
      </div>
    </section>
  );
}

function Contact({ p, go, setMsg }) {
  const init = { company: '', name: '', email: p.email || '', brand: '', memo: '' };
  const [f, setF] = useState(init); const [errs, setErrs] = useState({}); const [sent, setSent] = useState(p.sent === '1');
  useEffect(() => { setSent(p.sent === '1'); if (p.sent === '1') setF({ company: '오르비 코리아', name: '정하윤', email: 'hayoon@orbi.example', brand: '오르비 스마트워치 밴드', memo: '해외 직구 마켓의 위조 밴드 판매를 먼저 살펴보고 싶어요.' }); else setF(x => ({ ...x, email: p.email || x.email })); }, [p]);
  const set = (k) => (e) => { setF({ ...f, [k]: e.target.value }); setErrs({ ...errs, [k]: '' }); };
  const submit = (e) => {
    e.preventDefault(); const er = {};
    if (!f.company.trim()) er.company = '회사 이름을 입력해 주세요.'; if (!f.name.trim()) er.name = '담당자 이름을 입력해 주세요.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) er.email = '회사 이메일 형식으로 입력해 주세요.'; if (!f.brand.trim()) er.brand = '보호하려는 브랜드나 상품을 입력해 주세요.';
    setErrs(er); if (Object.keys(er).length) return; setSent(true); setMsg('상담 신청을 접수했어요');
  };
  const L = ({ id, label, children, err }) => <div><label htmlFor={id} className="block mb-1.5 text-[length:var(--c-small)] font-semibold text-[var(--n9)]">{label}</label>{children}{err && <p className="mt-1.5 text-[length:var(--c-small)] text-[var(--s2-text)]" role="alert">{err}</p>}</div>;
  return (
    <section className="rf-sec" id="contact-form">
      <div className="rf-in grid gap-10 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
        {sent ? (
          <div className="border border-[var(--n3)] rounded-[var(--r-card)] p-8 self-start" data-sent role="status">
            <span className="grid place-items-center w-11 h-11 rounded-full bg-[var(--s1-bg)] text-[var(--s1-text)]"><Icon name="check" size={22} /></span>
            <h2 className="mt-4 text-[length:var(--t-section)] font-bold tracking-[-0.03em] text-[var(--n10)]">상담 신청이 접수됐어요</h2>
            <dl className="mt-5 grid gap-3 text-[length:var(--c-body)]">{[['회사', f.company], ['담당자', f.name], ['이메일', f.email], ['보호 대상', f.brand]].map(([a, b]) => <div key={a} className="flex gap-4"><dt className="w-20 shrink-0 text-[var(--n7)]">{a}</dt><dd className="font-semibold text-[var(--n10)] min-w-0 break-all">{b}</dd></div>)}</dl>
            <p className="mt-5 text-[length:var(--c-small)] text-[var(--n7)]">영업일 기준 1일 안에 이메일로 상담 일정을 안내해 드려요.</p>
            <div className="mt-6"><button className={BTN2} onClick={() => go('main')}>메인으로 돌아가기</button></div>
          </div>
        ) : (
          <form onSubmit={submit} noValidate className="border border-[var(--n3)] rounded-[var(--r-card)] p-6 sm:p-8 grid gap-5">
            <L id="c-company" label="회사 이름" err={errs.company}><input id="c-company" className={FIELD} value={f.company} onChange={set('company')} aria-invalid={!!errs.company} /></L>
            <div className="grid gap-5 sm:grid-cols-2">
              <L id="c-name" label="담당자 이름" err={errs.name}><input id="c-name" className={FIELD} value={f.name} onChange={set('name')} aria-invalid={!!errs.name} /></L>
              <L id="c-email" label="회사 이메일" err={errs.email}><input id="c-email" type="email" className={FIELD} value={f.email} onChange={set('email')} aria-invalid={!!errs.email} /></L>
            </div>
            <L id="c-brand" label="보호하려는 브랜드·상품" err={errs.brand}><input id="c-brand" className={FIELD} value={f.brand} onChange={set('brand')} aria-invalid={!!errs.brand} /></L>
            <L id="c-memo" label="궁금한 점"><textarea id="c-memo" rows={4} className={cx(FIELD, 'h-auto py-3')} value={f.memo} onChange={set('memo')} /></L>
            <div><button type="submit" className={BTN}>상담 신청하기</button></div>
          </form>
        )}
        <aside className="self-start">
          <h2 className="text-[length:var(--t-section)] font-bold tracking-[-0.03em] text-[var(--n10)]">상담은 이렇게 진행돼요</h2>
          <ol className="mt-5 grid gap-4">{['신청 내용을 보고 담당자가 이메일로 일정을 안내해요', '30분 화상 상담에서 보호하려는 브랜드와 마켓 범위를 함께 정해요', '상담 뒤 탐지 범위와 일정을 정리한 안내서를 보내 드려요'].map((s, i) => <li key={s} className="flex gap-4"><span className="grid place-items-center w-8 h-8 shrink-0 rounded-full bg-[var(--n9)] text-[var(--n0)] text-[length:var(--c-small)] font-bold num">{i + 1}</span><span className="pt-1 text-[length:var(--c-body)] leading-[var(--c-body-lh)] text-[var(--n8)]">{s}</span></li>)}</ol>
        </aside>
      </div>
    </section>
  );
}

const REG = { hero: Hero, numbers: Numbers, cards: Cards, tabs: Tabs, alt: Alt, logos: Logos, cases: CaseSlider, cta: Cta };
const BLOCKS_PUB = PUBLISHED_ORDER.map(id => BLOCK0.find(b => b.id === id));
const renderBlock = (b, props) => {
  const C = b.id === 'B-06' ? Grid : REG[b.type];
  return C ? <C key={b.id} c={CONTENT0[b.id]} {...props} /> : null;
};
const NAV = [['tech', '핵심 기술'], ['flow', '서비스 흐름'], ['cases', '도입 사례'], ['contact', '문의하기']];
const TITLES = {
  tech: ['핵심 기술', '세 가지 기술이 같은 규격으로 이어져요'],
  flow: ['서비스 흐름', '탐지에서 삭제 요청까지 단계마다 근거가 남아요'],
  cases: ['도입 사례', '분야마다 지켜야 할 마켓과 상품이 달라요'],
  contact: ['문의하기', '보호하려는 브랜드를 알려 주세요'],
};

function App() {
  const route = useRoute(); const p = useParams();
  useLucide();
  useRfMotion(route);
  const [det, setDet] = useState(DET0);
  const [msg, setMsg] = useState('');
  useEffect(() => { window.__mkToast = (m) => setMsg(m); }, []);
  useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(''), 2400); return () => clearTimeout(t); }, [msg]);
  const props = { det, setDet, p, route, go };
  const credit = [...new Set([phOf(1), phOf(5), phOf(6)].filter(Boolean).map(x => x.credit))].join(', ');
  let body;
  if (route === 'tech') body = <><Band title={TITLES.tech[0]} sub={TITLES.tech[1]} /><Cards c={CONTENT0['B-03']} {...props} /><Alt c={CONTENT0['B-05']} det={det} /></>;
  else if (route === 'flow') body = <><Band title={TITLES.flow[0]} sub={TITLES.flow[1]} /><Tabs c={CONTENT0['B-04']} {...props} /><FlowList det={det} /></>;
  else if (route === 'cases') body = <><Band title={TITLES.cases[0]} sub={TITLES.cases[1]} /><Logos c={CONTENT0['B-07']} /><Grid c={CONTENT0['B-06']} {...props} /><CaseSlider c={CONTENT0['B-08']} /></>;
  else if (route === 'contact') body = <><Band title={TITLES.contact[0]} sub={TITLES.contact[1]} /><Contact p={p} go={go} setMsg={setMsg} /></>;
  else body = BLOCKS_PUB.filter(b => b.on).map(b => renderBlock(b, props));
  return (
    <>
      <DemoBar onReset={() => { setDet(DET0); setMsg('예시 데이터를 처음 상태로 돌렸어요'); go('main'); }} />
      <div id="rf-root" className="rf-root" data-tone="deep-neutral">
        <header className="rf-header">
          <div className="rf-in flex flex-wrap items-center gap-x-8 gap-y-1 min-h-[var(--c-nav-h)] py-2">
            <button onClick={() => go('main')} aria-label={BRAND + ' 메인으로'} className="text-[22px] font-black tracking-[-0.05em] cursor-pointer">{BRAND}<span className="text-[var(--m300)]">.</span></button>
            <nav aria-label="주 메뉴" className="flex gap-1 overflow-x-auto order-3 w-full md:order-none md:w-auto md:flex-1">{NAV.map(([r, l]) => <button key={r} aria-current={route === r ? 'page' : undefined} onClick={() => go(r)} className={cx('h-10 px-3 rounded-[var(--r-ctl)] whitespace-nowrap font-semibold cursor-pointer text-[length:var(--c-small)]', route === r ? 'bg-[color-mix(in_oklab,white_14%,transparent)]' : 'text-[var(--rf-ink-2)] hover:text-[var(--rf-ink)]')}>{l}</button>)}</nav>
            <button className={cx(BTN, 'ml-auto md:ml-0')} onClick={() => go('contact')}>상담 신청</button>
          </div>
        </header>
        <main id="main" className={route === 'main' ? '' : 'pt-10'}>{body}</main>
        <footer className="bg-[var(--n10)] text-[var(--n3)]">
          <div className="rf-in py-10 flex flex-wrap items-end justify-between gap-6 text-[length:var(--c-small)]">
            <div><div className="text-[20px] font-black tracking-[-0.05em] text-[var(--n0)]">{BRAND}</div><p className="mt-2 text-[var(--n5)]">온라인 위조 상품 모니터링과 브랜드 보호</p></div>
            <p className="text-[var(--n5)]">사진 · Pixabay ({credit})</p>
          </div>
        </footer>
      </div>
      {msg && <div className="look-toast" role="status">{msg}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/portfolio-showcase/assets/sv.js" defer data-sv="1"></script>
</body>
</html>
