          <p className="mt-3 text-[14px] text-[var(--n9)]">사무국이 서류를 확인한 뒤 영업일 기준 3일 안에 승인 안내 메일을 보내요.</p>

            {[['corp', '기업회원', '출판사 단위로 가입해요. 사업자등록증과 신고확인증이 필요해요.', 'building-2'], ['indiv', '개인회원', '편집자·저자 등 출판 종사자가 개인 자격으로 가입해요.', 'user']].map(([k, l, d, ic]) => (

              : <input id={'j-' + k} className="pa-input" value={f[k] || ''} placeholder={ph} aria-invalid={!!err[k]} onChange={(e) => setF({ ...f, [k]: e.target.value })} />}</Field>)}</div>

          <dl className="mt-4 border-t border-[var(--n3)]">{[['가입 유형', corp ? '기업회원' : '개인회원'], ...DEFS.map(([k, l]) => [l.replace(' (선택)', ''), k === 'phone' ? maskPhoneNo(f[k]) : k === 'mail' ? maskMail(f[k]) : (f[k] || '-')])].map(([k, v]) => <div key={k} className="flex gap-4 border-b border-[var(--n2)] py-2.5"><dt className="w-[130px] shrink-0 text-[var(--n7)]">{k}</dt><dd className="num text-[var(--n10)]">{v}</dd></div>)}</dl>

          {!agree && <p className="pa-err">접수하려면 동의가 필요해요.</p>}
          <div className="mt-6 flex justify-between"><button type="button" className={btn2} onClick={() => setStep(2)}>이전</button><button type="button" className={btnMain} disabled={!agree} onClick={() => setDone(true)}>가입 접수</button></div></div>)}
      </div>
      <aside className="grid content-start gap-4">
        <div className="pa-card p-5"><h3 className="text-[17px] font-bold text-[var(--n10)]">필요 서류 4가지</h3>

        <div className="pa-card p-5"><h3 className="text-[17px] font-bold text-[var(--n10)]">이미 가입했나요</h3><p className="mt-2 text-[14px] leading-relaxed text-[var(--n8)]">개편 전에 가입한 계정은 그대로 이어져요. 기존 아이디로 로그인하면 됩니다.</p><button type="button" className={btn2 + ' mt-3'} onClick={() => go('login')}>로그인하러 가기</button></div>
      </aside>
    </div></div>
  </>);
}

/* ── 로그인·내 정보 ── */
function LoginScreen({ logged, setLogged, me, setMe }) {
  useLucide();
  const p = useParams();
  const [id, setId] = useState('hanbit_pub');
  const [pw, setPw] = useState('demo-pass-26');
  const [lerr, setLerr] = useState('');
  const [ftab, setFtab] = useState('id');
  const [fmail, setFmail] = useState('');
  const [fmsg, setFmsg] = useState(null);
  const [form, setForm] = useState(me);
  const [saved, setSaved] = useState(false);
  useEffect(() => { setForm(me); setSaved(false); }, [p, logged]);
  const login = (e) => { e.preventDefault(); if (!id.trim() || !pw) { setLerr('아이디와 비밀번호를 모두 입력해 주세요.'); return; } setLerr(''); setLogged(true); };
  const find = (e) => {
    e.preventDefault();
    if (fmail.trim().toLowerCase() === me.mail) setFmsg({ t: (ftab === 'id' ? '가입한 아이디를 ' : '비밀번호 재설정 링크를 ') + maskMail(me.mail) + ' 으로 보냈어요.' });
    else setFmsg({ bad: true, t: '등록된 이메일이 아니에요. 가입할 때 쓴 이메일을 다시 확인해 주세요.' });
  };
  const save = () => { setMe(form); setSaved(true); };
  return (<>
    <SubTop title={logged ? '내 정보' : '로그인'} sub={logged ? '연락처는 일부를 가려서 보여 드려요. 수정하면 바로 반영돼요.' : '개편 전 아이디와 비밀번호로 그대로 로그인해요.'} />
    <div className="rf-in pa-pull pb-16">{logged ? (
      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <section className="pa-card p-5 sm:p-8 pa-fade" aria-label="내 정보 카드"><h2 className={sectionH}>{ME_NAME}</h2><p className="mt-1 text-[14px] text-[var(--n7)]">기업회원 · 가입 {dotDate(MEMBERS[0].joined)}</p>
          <dl className="mt-5 border-t border-[var(--n3)]">{[['출판사 등록번호', MEMBERS[0].reg], ['담당자', me.manager], ['연락처', maskPhoneNo(me.phone)], ['이메일', maskMail(me.mail)], ['주소', me.addr], ['홈페이지', me.site]].map(([k, v]) => <div key={k} className="flex gap-4 border-b border-[var(--n2)] py-3"><dt className="w-[110px] shrink-0 text-[var(--n7)]">{k}</dt><dd className="num min-w-0 text-[var(--n10)]">{v}</dd></div>)}</dl>
          <button type="button" className={btn2 + ' mt-5'} onClick={() => { setLogged(false); go('main'); }}><Icon name="log-out" size={16} />로그아웃</button></section>
        <section className="pa-card p-5 sm:p-8" aria-label="정보 수정"><h2 className={sectionH}>정보 수정</h2>
          <div className="mt-4 grid gap-4">{[['manager', '담당자명'], ['phone', '연락처'], ['mail', '이메일'], ['addr', '출판사 주소'], ['site', '홈페이지']].map(([k, l]) => <Field key={k} id={'e-' + k} label={l}><input id={'e-' + k} className="pa-input" value={form[k]} onChange={(e) => { setForm({ ...form, [k]: e.target.value }); setSaved(false); }} /></Field>)}</div>
          <div className="mt-5 flex items-center gap-3"><button type="button" className={btnDark} onClick={save}>저장하기</button>{saved && <span className="text-[14px] text-[var(--s1-text)]" role="status">저장했어요. 왼쪽 카드에 바로 반영됐어요.</span>}</div></section>
      </div>
    ) : (
      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <form className="pa-card p-5 sm:p-8" onSubmit={login} noValidate><h2 className={sectionH}>회원 로그인</h2>
          <div className="mt-4 grid gap-4"><Field id="l-id" label="아이디"><input id="l-id" className="pa-input" value={id} onChange={(e) => setId(e.target.value)} autoComplete="username" /></Field>
            <Field id="l-pw" label="비밀번호" error={lerr}><input id="l-pw" type="password" className="pa-input" value={pw} onChange={(e) => setPw(e.target.value)} autoComplete="current-password" aria-invalid={!!lerr} /></Field></div>
          <button type="submit" className={btnMain + ' mt-5 w-full'}>로그인하기</button>
          <p className="mt-4 text-[14px] text-[var(--n7)]">아직 회원이 아니라면 <button type="button" className="font-bold text-[var(--m700)]" onClick={() => go('join')}>가입 신청</button>을 해 주세요.</p></form>
        <section className="pa-card p-5 sm:p-8" aria-label="계정 찾기"><h2 className={sectionH}>계정 찾기</h2>
          <div role="tablist" className="mt-3 flex border-b border-[var(--n3)]">{[['id', '아이디 찾기'], ['pw', '비밀번호 찾기']].map(([k, l]) => <button key={k} type="button" role="tab" aria-selected={ftab === k} className="pa-tab" onClick={() => { setFtab(k); setFmsg(null); }}>{l}</button>)}</div>
          <form className="mt-4" onSubmit={find} noValidate><Field id="f-mail" label="가입한 이메일" error={fmsg && fmsg.bad ? fmsg.t : null}><input id="f-mail" className="pa-input" value={fmail} onChange={(e) => { setFmail(e.target.value); setFmsg(null); }} placeholder="m1001@mail.example" aria-invalid={!!(fmsg && fmsg.bad)} /></Field>
            <button type="submit" className={btnDark + ' mt-4'}>{ftab === 'id' ? '아이디 찾기' : '재설정 링크 받기'}</button>
            {fmsg && !fmsg.bad && <p className="mt-3 text-[14px] text-[var(--s1-text)]" role="status">{fmsg.t}</p>}</form>
          <p className="mt-5 border-t border-[var(--n2)] pt-4 text-[13px] leading-relaxed text-[var(--n7)]">휴면으로 분리 보관된 계정은 사무국 확인 뒤 다시 열어 드려요. 02-555-0172로 문의해 주세요.</p></section>
        <section className="pa-card p-5 sm:p-8 lg:col-span-2" aria-label="로그인 안내"><div className="flex items-center justify-between border-b border-[var(--n9)] pb-2"><h2 className="text-[18px] font-bold text-[var(--n10)]">로그인 전에 확인해 주세요</h2><button type="button" className="text-[13px] text-[var(--n7)] hover:text-[var(--m700)]" onClick={() => go('board', { board: 'notice' })}>공지 더보기</button></div>
          <ul className="mt-1">{postsFor(POSTS, 'notice').slice(0, 5).map((x) => <li key={x.id}><button type="button" className="pa-row" onClick={() => go('board', { board: 'notice', open: x.id })}><span className="min-w-0 flex-1">{x.title}</span><span className="num shrink-0 whitespace-nowrap text-[13px] text-[var(--n7)]">{dotDate(x.date)}</span></button></li>)}</ul>
          <p className="mt-3 text-[13px] text-[var(--n7)]">개편 전에 가입한 계정은 그대로 이어져요. 로그인이 되지 않으면 계정 찾기를 먼저 써 보세요.</p></section>
      </div>)}</div>
  </>);
}

/* ── 자료실 ── */
function ResourcesScreen() {
  useLucide();
  const p = useParams();
  const [cat, setCat] = useState(p.cat || '전체');
  const [open, setOpen] = useState(p.open || null);
  const [done, setDone] = useState({});
  useEffect(() => { setCat(p.cat || '전체'); setOpen(p.open || null); }, [p]);
  const list = FILES.filter((x) => cat === '전체' || x.cat === cat);
  const cur = FILES.find((x) => x.id === open && list.includes(x)) || list[0];
  return (<>
    <SubTop title="자료실" sub="납본·회원·행사 서식을 내려받아요." stats={[[FILES.length, '서식 자료'], [FILE_CATS.length, '분류']]} />
    <div className="rf-in pa-pull pb-16"><div className="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,1fr)_340px]">
      <div className="pa-card p-4 sm:p-6">
        <div className="mb-4 flex flex-wrap gap-2" role="group" aria-label="분류">{['전체', ...FILE_CATS].map((c) => <button key={c} type="button" className="pa-chip" aria-pressed={cat === c} onClick={() => go('resources', { cat: c })}>{c} <span className="num">{c === '전체' ? FILES.length : FILES.filter((x) => x.cat === c).length}</span></button>)}</div>
        <div className="overflow-x-auto"><table className="pa-tbl"><thead><tr><th>파일 이름</th><th className="hidden sm:table-cell">형식</th><th>용량</th><th className="hidden md:table-cell">등록일</th><th className="text-right">내려받기</th></tr></thead>
          <tbody>{list.map((x) => <tr key={x.id} data-click onClick={() => setOpen(x.id)} style={cur && cur.id === x.id ? { background: 'var(--m50)' } : null}>
            <td><span className="flex items-center gap-2"><Icon name="file-text" size={16} className="text-[var(--n6)]" /><b className="font-semibold text-[var(--n10)]">{x.name}</b></span></td>
            <td className="hidden sm:table-cell"><Pill>{x.ext.toUpperCase()}</Pill></td><td className="num text-[var(--n8)]">{fileSize(x.kb)}</td><td className="num hidden md:table-cell text-[var(--n7)]">{dotDate(x.date)}</td>
            <td className="text-right"><button type="button" className={btn2} onClick={(e) => { e.stopPropagation(); setOpen(x.id); setDone({ ...done, [x.id]: true }); }}><Icon name="download" size={14} />{done[x.id] ? '받음' : '받기'}</button></td></tr>)}</tbody></table></div>
      </div>
      {cur && <aside className="pa-card p-5 sm:p-6 self-start pa-fade" key={cur.id} aria-label="선택한 자료"><Pill>{cur.cat} 서식</Pill><h2 className="mt-3 text-[20px] font-bold leading-snug text-[var(--n10)]">{cur.name}</h2>
        <p className="mt-2 text-[14px] leading-relaxed text-[var(--n8)]">{cur.desc}</p>
        <dl className="mt-4 border-t border-[var(--n3)] text-[14px]">{[['형식', cur.ext.toUpperCase()], ['용량', fileSize(cur.kb)], ['등록일', dotDate(cur.date)]].map(([k, v]) => <div key={k} className="flex justify-between border-b border-[var(--n2)] py-2.5"><dt className="text-[var(--n7)]">{k}</dt><dd className="num text-[var(--n10)]">{v}</dd></div>)}</dl>
        <button type="button" className={btnMain + ' mt-5 w-full'} onClick={() => setDone({ ...done, [cur.id]: true })}><Icon name="download" size={18} />{done[cur.id] ? '내려받는 중' : '내려받기'}</button>
        {done[cur.id] && <p className="mt-2 text-[13px] text-[var(--s1-text)]" role="status">{cur.name}.{cur.ext} 파일을 내려받고 있어요.</p>}</aside>}
    </div></div>
  </>);
}

/* ── 납본 조회 ── */
function DepositScreen({ logged }) {
  useLucide();
  const p = useParams();
  const [q, setQ] = useState(p.q || '');
  const [guide, setGuide] = useState(!!p.guide);
  const [opened, setOpened] = useState(false);
  const [more, setMore] = useState(8);
  useEffect(() => { setQ(p.q || ''); setGuide(!!p.guide); setMore(8); setOpened(false); }, [p]);
  const needle = q.trim();
  const list = DEPOSITS.filter((d) => !needle || d.pub.includes(needle) || d.title.includes(needle) || d.reg.includes(needle));
  const tone = (s) => (s === '확인 완료' ? 'ok' : s === '보완 요청' ? 'bad' : undefined);
  return (<>
    <SubTop title="납본 조회" sub="출판사 이름이나 등록번호로 납본 접수 현황을 확인해요." stats={[[nf(NUM.depositsYear), '올해 접수'], [DEPOSITS.filter((d) => d.status === '보완 요청').length, '보완 요청']]} />
    <div className="rf-in pa-pull pb-16"><div className="pa-card p-4 sm:p-6">
      <div className="flex flex-wrap items-end gap-3"><div className="min-w-[240px] flex-1"><label htmlFor="d-q" className="pa-label">출판사명·등록번호·도서명</label><input id="d-q" className="pa-input" value={q} onChange={(e) => { setQ(e.target.value); setMore(8); }} placeholder="예: 한빛 출판사" /></div>
        <button type="button" className={btn2} aria-pressed={guide} onClick={() => setGuide(!guide)}><Icon name="external-link" size={16} />납본 사이트 바로가기</button></div>
      {guide && <div className="mt-4 border border-[var(--n3)] bg-[var(--n1)] p-5 pa-fade" aria-label="납본 사이트 안내"><b className="text-[16px] text-[var(--n10)]">납본 접수는 납본 사이트에서 해요</b>
        <ol className="mt-3 grid gap-2 text-[14px] text-[var(--n9)]">{['납본 사이트에서 같은 회원 계정으로 로그인합니다', '납본 접수 신청서를 작성해 도서와 함께 제출합니다', '접수가 끝나면 이곳 납본 조회에서 현황이 확인돼요'].map((s, i) => <li key={s} className="pa-step"><b className="num">{i + 1}</b><span className="pt-0.5">{s}</span></li>)}</ol>
        <button type="button" className={btnDark + ' mt-4'} onClick={() => setOpened(true)}>납본 사이트 열기</button>{opened && <p className="mt-2 text-[13px] text-[var(--s1-text)]" role="status">새 창에서 납본 사이트가 열렸어요. 접수를 마치면 이 화면으로 돌아와 현황을 확인해 주세요.</p>}</div>}
      <p className="mt-4 text-[13px] text-[var(--n7)]" aria-live="polite">검색 결과 <b className="num text-[var(--n10)]">{list.length}</b>건{logged ? ' · 내 접수는 ' + DEPOSITS.filter((d) => d.pub === ME_NAME).length + '건' : ''}</p>
      <div className="mt-2 overflow-x-auto"><table className="pa-tbl"><thead><tr><th className="hidden md:table-cell">접수 번호</th><th>출판사</th><th className="hidden lg:table-cell">등록번호</th><th>도서명</th><th>구분</th><th>접수일</th><th>상태</th></tr></thead>
        <tbody>{list.length === 0 && <tr><td colSpan={7} data-empty className="py-10 text-center text-[var(--n7)]">일치하는 접수 건이 없어요. 출판사 이름을 다시 확인해 주세요.</td></tr>}
          {list.slice(0, more).map((d) => <tr key={d.id}><td className="num hidden md:table-cell text-[var(--n7)]">{d.id}</td><td className="font-semibold text-[var(--n10)]">{d.pub}</td><td className="num hidden lg:table-cell text-[var(--n8)]">{d.reg}</td><td>{d.title}</td><td className="text-[var(--n8)]">{d.kind}</td><td className="num text-[var(--n7)]">{dotDate(d.received)}</td><td><Pill tone={tone(d.status)}>{d.status}</Pill></td></tr>)}</tbody></table></div>
      {list.length > more && <div className="mt-4 text-center"><button type="button" className={btn2} onClick={() => setMore(more + 8)}>더 보기 ({list.length - more}건)</button></div>}
    </div></div>
  </>);
}


/* ── 협회 소개 ── */

  return (<>

    <div className="rf-in pa-pull pb-16"><div className="pa-card p-4 sm:p-8">

/* ── 앱 ── */
function App() {
  const route = useRoute(); const p = useParams();
  useLucide(); useRfMotion(route);
  const [logged, setLogged] = useState(false);
  const [me, setMe] = useState(ME0);
  const [posts, setPosts] = useState(POSTS);
  const [menu, setMenu] = useState(false);
  useEffect(() => { if (p.as === 'me') setLogged(true); }, [p]);
  useEffect(() => { setMenu(false); }, [route]);
  const NAV = [['about', '협회 소개'], ['board', '게시판'], ['resources', '자료실'], ['deposit', '납본 조회'], ['join', '회원가입']];
  const reset = () => { setLogged(false); setMe(ME0); setPosts(POSTS); go('main'); };
  const screen = route === 'board' ? <BoardScreen posts={posts} setPosts={setPosts} logged={logged} setLogged={setLogged} me={me} />
    : route === 'join' ? <JoinScreen setLogged={setLogged} />
    : route === 'login' ? <LoginScreen logged={logged} setLogged={setLogged} me={me} setMe={setMe} />
    : route === 'about' ? <AboutScreen />
    : route === 'resources' ? <ResourcesScreen />
    : route === 'deposit' ? <DepositScreen logged={logged} />
    : <Home logged={logged} me={me} />;
  const photoCredits = [...new Set(PHOTOS.map((x) => x.credit))].join(', ');
  return (
    <>
      <DemoBar onReset={reset} />
      <div id="rf-root" className="rf-root" data-tone="light">
        <header className="rf-header light">
          <div className="rf-in flex items-center justify-between gap-4" style={{ height: 'var(--c-nav-h)' }}>
            <button type="button" onClick={() => go('main')} className="text-left text-[26px] font-extrabold tracking-[-0.05em] text-[var(--n10)]" aria-label="책마루 출판협회 메인">책마루<span className="ml-2 text-[14px] font-medium tracking-normal">출판협회</span></button>
            <nav className="pa-nav pa-nav-d flex h-full items-stretch gap-2" aria-label="주 메뉴">{NAV.map(([r, l]) => <button key={r} type="button" onClick={() => go(r)} aria-current={route === r ? 'page' : undefined}>{l}</button>)}</nav>
            <div className="flex items-center gap-2">
              {logged ? <><button type="button" className={btn2} onClick={() => go('login')}><Icon name="user" size={16} />{me.manager} 님</button></> : <button type="button" className={btn2} onClick={() => go('login')}>로그인</button>}
              <button type="button" className={btn2 + ' pa-nav-m !px-2.5'} aria-label="메뉴 열기" aria-expanded={menu} onClick={() => setMenu(!menu)}><Icon name={menu ? 'x' : 'menu'} size={18} /></button>
            </div>
          </div>
          {menu && <div className="pa-nav-m border-t border-[var(--n3)] bg-[var(--n0)] pa-fade"><div className="rf-in grid py-2">{NAV.map(([r, l]) => <button key={r} type="button" className="h-12 text-left text-[16px] font-semibold text-[var(--n9)]" onClick={() => go(r)}>{l}</button>)}</div></div>}
        </header>
        <main id="main" className="min-h-[60vh]">{screen}</main>
        <footer className="pa-footer"><div className="rf-in grid gap-1">
          <p><b className="text-[var(--n10)]">책마루 출판협회</b> · 서울특별시 마포구 책마루길 21 · 대표전화 02-555-0172 · 평일 09:00~18:00</p>
          <p>사진 · {PHOTOS[0] ? PHOTOS[0].source : 'pixabay'} ({photoCredits})</p></div></footer>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
