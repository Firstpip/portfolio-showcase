function Viewer360({ item, angle0 = 0, zoom0 = 1, full = false }) {
  const [frame, setFrame] = useState(Math.round(angle0 / 10) % 36);

  const [pan, setPan] = useState({ x: 0, y: 0 });
  const ptrs = useRef(new Map());
  const last = useRef(null);
  const acc = useRef(0);
  const pinch = useRef(0);
  useEffect(() => { setFrame(Math.round(angle0 / 10) % 36); setZoom(zoom0); setPan({ x: 0, y: 0 }); }, [angle0, zoom0, item.id]);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const dist = () => { const v = [...ptrs.current.values()]; return v.length < 2 ? 0 : Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y); };
  const down = (e) => { e.currentTarget.setPointerCapture(e.pointerId); ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY }); last.current = { x: e.clientX, y: e.clientY }; if (ptrs.current.size === 2) pinch.current = dist(); };
  const move = (e) => {
    if (!ptrs.current.has(e.pointerId)) return;
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.current.size === 2) { const d = dist(); if (pinch.current) setZoom((z) => clamp(z * d / pinch.current, 1, 3)); pinch.current = d; return; }
    const dx = e.clientX - last.current.x, dy = e.clientY - last.current.y;
    last.current = { x: e.clientX, y: e.clientY };
    if (zoom > 1) { const lim = 90 * (zoom - 1); setPan((p) => ({ x: clamp(p.x + dx, -lim, lim), y: clamp(p.y + dy, -lim, lim) })); }
    else { acc.current += dx; const s = Math.trunc(acc.current / 9); if (s) { acc.current -= s * 9; setFrame((f) => (((f - s) % 36) + 36) % 36); } }
  };
  const up = (e) => { ptrs.current.delete(e.pointerId); pinch.current = 0; };
  const key = (e) => { if (e.key === "ArrowLeft") setFrame((f) => (f + 35) % 36); if (e.key === "ArrowRight") setFrame((f) => (f + 1) % 36); };
  const deg = frame * 10;
  const tb = "inline-flex items-center justify-center h-10 w-10 rounded-full border border-[var(--n4)] bg-[var(--n1)] text-[var(--n9)] hover:bg-[var(--n2)] cursor-pointer";
  return (
    <div className="flex flex-col gap-3" data-viewer="360">
      <div className={cx("vw-stage relative overflow-hidden rounded-[var(--r-card)] bg-[var(--n2)] select-none", full ? "aspect-[4/4.4]" : "aspect-[4/4.2]")}
        role="img" aria-label={`${item.name} 360도 회전 뷰어, 현재 ${deg}도`} tabIndex={0}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onKeyDown={key}
        style={{ touchAction: zoom > 1 ? "none" : "pan-y", cursor: zoom > 1 ? "grab" : "ew-resize" }}>
        <svg viewBox="0 0 300 340" className="absolute inset-0 h-full w-full text-[var(--n9)]" style={{ transform: `translate(${pan.x}px,${pan.y}px) scale(${zoom})`, transformOrigin: "50% 50%" }}>
          <Garment kind={item.kind} deg={deg} />
        </svg>
        <span className="absolute left-3 top-3 rounded-full bg-[var(--n10)] px-3 py-1 text-[length:var(--c-small)] font-semibold text-[var(--n0)] num">각도 {deg}° · {frame + 1}/36</span>
        <span className="absolute bottom-3 left-3 inline-flex items-center gap-1 text-[length:var(--c-small)] text-[var(--n7)]"><Ic name="move-horizontal" size={14} />좌우로 끌면 돌아가요</span>
        {zoom > 1 && <span className="absolute right-3 top-3 rounded-full bg-[var(--m600)] px-3 py-1 text-[length:var(--c-small)] font-semibold text-[var(--on-main)] num">{zoom.toFixed(1)}배</span>}
      </div>
      <div className="flex items-center gap-2">
        <button type="button" className={tb} aria-label="왼쪽으로 돌리기" onClick={() => setFrame((f) => (f + 35) % 36)}><Ic name="chevron-left" size={18} /></button>
        <input type="range" min="0" max="35" value={frame} onChange={(e) => setFrame(Number(e.target.value))} aria-label="회전 각도" className="h-2 min-w-0 flex-1 cursor-pointer" style={{ accentColor: "var(--m600)" }} />
        <button type="button" className={tb} aria-label="오른쪽으로 돌리기" onClick={() => setFrame((f) => (f + 1) % 36)}><Ic name="chevron-right" size={18} /></button>

  );

function App() {

}
