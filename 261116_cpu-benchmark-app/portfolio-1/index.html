/* ── 작은 부품: 모양은 STYLE.md 값으로 직접 ── */
const Pl = ({ tone = "idle", children }) => <span className={"pl pl-" + tone}>{children}</span>;
const Btn = ({ kind = "sec", children, className = "", onClick, ...r }) => (
  <button type="button" onClick={onClick} {...r} className={cx("btn", kind === "pri" ? "btn-pri" : "btn-sec", className)}>{children}</button>
);
function Gauge({ value, max = 4000, size = 168 }) {
  const R = 64, C = 2 * Math.PI * R, f = Math.min(1, value / max);
  return (
    <div className="relative" style={{ width: size, height: size }} role="img" aria-label={`종합 점수 ${fmtNum(value)}점`}>
      <svg viewBox="0 0 160 160" width={size} height={size} className="-rotate-90">
        <circle cx="80" cy="80" r={R} fill="none" stroke="var(--n3)" strokeWidth="12" />
        <circle cx="80" cy="80" r={R} fill="none" stroke="var(--m600)" strokeWidth="12" strokeDasharray={`${C * f} ${C}`} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <b className="num text-[34px] font-extrabold leading-none tracking-[-0.03em] text-[var(--n10)]">{fmtNum(value)}</b>
        <span className="mt-1 text-[13px] text-[var(--n7)]">종합 점수</span>
      </div>
    </div>
  );
}
function Line({ pts, h = 120, w = 360, color = "var(--m600)", label }) {
  if (pts.length < 2) return <div className="grid h-[120px] place-items-center text-[13px] text-[var(--n6)]">측정을 시작하면 그래프가 그려져요</div>;
  const mn = Math.min(...pts), mx = Math.max(...pts), sp = mx - mn || 1;
  const d = pts.map((v, i) => `${i ? "L" : "M"}${(i / (pts.length - 1)) * w},${h - 8 - ((v - mn) / sp) * (h - 16)}`).join(" ");
  return <svg viewBox={`0 0 ${w} ${h}`} className="h-[120px] w-full" role="img" aria-label={label}><path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" /></svg>;
}
function RepeatBars({ run }) {
  const mx = Math.max(...run.repeats), mn = Math.min(...run.repeats);
  return (
    <ul className="flex h-[132px] items-end gap-3" aria-label="반복 5회 종합 점수">
      {run.repeats.map((v, i) => (
        <li key={i} className="flex flex-1 flex-col items-center justify-end gap-1">
          <span className="num text-[12px] text-[var(--n7)]">{fmtNum(v)}</span>
          <span className="block w-full" style={{ height: 24 + ((v - mn) / (mx - mn || 1)) * 56, background: v === mx || v === mn ? "var(--m300)" : "var(--m600)" }} />
          <span className="text-[12px] text-[var(--n6)]">{i + 1}회</span>
        </li>
      ))}
    </ul>
  );
}
const Credit = () => {

/* ── 실행 콘솔 (첫 화면의 주인공) ── */
const SNAP = {
  idle: { prog: [0, 0, 0, 0], st: ["wait", "wait", "wait", "wait"] },
  running: { prog: [100, 62, 0, 0], st: ["done", "run", "wait", "wait"] },
  timeout: { prog: [100, 100, 100, 71], st: ["done", "done", "done", "timeout"] },
};
function RunConsole({ run, settings, initial }) {
  const [phase, setPhase] = useState(initial);
  const [paused, setPaused] = useState(false);
  const [sim, setSim] = useState(SNAP[initial] || SNAP.idle);
  const live = useRef(false);
  useEffect(() => { setPhase(initial); setSim(SNAP[initial] || SNAP.idle); setPaused(false); live.current = false; }, [initial]);
  useEffect(() => {
    if (!live.current || phase !== "running" || paused) return;
    const t = setInterval(() => {
      setSim((s) => {
        const prog = [...s.prog], st = [...s.st];
        const i = st.findIndex((x) => x === "run" || x === "wait");
        if (i < 0) return s;
        st[i] = "run"; prog[i] = Math.min(100, prog[i] + 5);
        if (prog[i] === 100) st[i] = "done";
        return { prog, st };
      });
    }, 160);
    return () => clearInterval(t);
  }, [phase, paused]);
  const finished = sim.st.every((x) => x === "done");
  const start = () => { live.current = true; setSim({ prog: [0, 0, 0, 0], st: ["run", "wait", "wait", "wait"] }); setPhase("running"); setPaused(false); };
  const stop = () => { live.current = false; setPhase("idle"); setSim(SNAP.idle); setPaused(false); };
  const retry = () => { live.current = true; setSim((s) => ({ prog: [100, 100, 100, 0], st: ["done", "done", "done", "run"] })); setPhase("running"); };
  const partial = Math.round(MODS.reduce((a, m, i) => a + m.w * run.scores[i] * (sim.prog[i] / 100), 0));
  const total = sim.prog.reduce((a, b) => a + b, 0);
  const n = Math.round(total / 10) + 2;
  const clock = Array.from({ length: n }, (_, i) => 3.9 - 0.012 * i + 0.12 * Math.sin(i * 0.9));
  const temp = Array.from({ length: n }, (_, i) => 52 + i * 0.7 + 1.5 * Math.cos(i * 0.7));
  const hasTimeout = sim.st.includes("timeout");
  return (
    <div className="grid gap-0 md:grid-cols-[1.05fr_1fr]" data-console>
      <div className="min-w-0 border-b border-[var(--n3)] p-5 md:border-b-0 md:border-r md:p-7">
        <div className="mb-5 flex flex-wrap items-center gap-2">
          <Btn kind="pri" onClick={start} disabled={phase === "running" && !paused}><Icon name="play" size={16} /> 측정 시작</Btn>
          <Btn onClick={() => setPaused((p) => !p)} disabled={phase !== "running" || finished}><Icon name="pause" size={16} /> {paused ? "이어서 하기" : "일시정지"}</Btn>
          <Btn onClick={stop} disabled={phase === "idle"}><Icon name="square" size={16} /> 중단</Btn>
          <span className="ml-auto text-[13px] text-[var(--n7)]">반복 {settings.repeat}회 · 제한 시간 {settings.timeout}초</span>
        </div>
        <ul className="grid gap-4">
          {MODS.map((m, i) => (
            <li key={m.key}>
              <div className="mb-1.5 flex items-center justify-between gap-3">
                <span className="text-[15px] font-semibold text-[var(--n10)]">{m.name}</span>
                {sim.st[i] === "done" && <Pl tone="ok">완료</Pl>}
                {sim.st[i] === "run" && <Pl tone="ok">{paused ? "일시정지" : "실행 중"}</Pl>}
                {sim.st[i] === "wait" && <Pl>대기</Pl>}
                {sim.st[i] === "timeout" && <Pl tone="err">시간 초과</Pl>}
              </div>
              <div className="h-2 bg-[var(--n3)]" role="progressbar" aria-valuenow={sim.prog[i]} aria-valuemin="0" aria-valuemax="100" aria-label={m.name + " 진행률"}>
                <div className="h-2" style={{ width: sim.prog[i] + "%", background: sim.st[i] === "timeout" ? "var(--s2)" : "var(--m600)" }} />
              </div>
              <div className="mt-1 flex justify-between text-[12.5px] text-[var(--n7)]"><span className="num">{sim.prog[i]}%</span><span className="num">제한 {m.sec}초</span></div>
            </li>
          ))}
        </ul>
        {hasTimeout && (
          <div className="mt-5 flex flex-wrap items-center justify-between gap-3 border border-[var(--s2)] bg-[var(--s2-bg)] px-4 py-3" data-error>
            <p className="text-[14px] text-[var(--s2-text)]"><b>E-201</b> 멀티스레드 스케일링이 제한 시간 60초를 넘어 중단됐어요. 앞의 세 모듈 점수는 그대로 남아 있어요.</p>
            <Btn kind="pri" onClick={retry}><Icon name="rotate-ccw" size={16} /> 이 모듈만 다시 시도</Btn>
          </div>
        )}
        {finished && phase === "running" && (
          <div className="mt-5 flex flex-wrap items-center justify-between gap-3 border border-[var(--s1)] bg-[var(--s1-bg)] px-4 py-3">
            <p className="text-[14px] text-[var(--s1-text)]">측정이 끝났어요. 종합 점수는 <b className="num">{fmtNum(partial)}</b>점이에요.</p>
            <Btn kind="pri" onClick={() => go("report", { run: run.id })}>리포트 열기</Btn>
          </div>
        )}
      </div>
      <div className="min-w-0 p-5 md:p-7">
        <div className="flex items-end justify-between">
          <div><p className="mb-2 text-[13px] leading-[1.4] text-[var(--n7)]">점수 합계</p><b className="num block text-[40px] font-extrabold leading-none tracking-[-0.03em] text-[var(--n10)]">{fmtNum(partial)}</b></div>
          <div className="text-right text-[13px] text-[var(--n7)]"><p>클럭 <b className="num text-[var(--n9)]">{clock[clock.length - 1].toFixed(2)} GHz</b></p><p>온도 <b className="num text-[var(--n9)]">{Math.round(temp[temp.length - 1])} °C</b></p></div>
        </div>
        <div className="mt-4 text-[var(--m600)]"><p className="mb-1 text-[12.5px] text-[var(--n7)]">클럭 (GHz)</p><Line pts={phase === "idle" ? [] : clock} color="var(--m600)" label="클럭 선 그래프" /></div>
        <div className="mt-3 text-[var(--n7)]"><p className="mb-1 text-[12.5px] text-[var(--n7)]">온도 (°C)</p><Line pts={phase === "idle" ? [] : temp} color="var(--n7)" label="온도 선 그래프" /></div>
      </div>
    </div>
  );
}

/* ── 리포트 한 덩어리: 종합 점수 + 모듈별 + 수집·검증·계산 ── */

function Report() {

            <div className="mt-6 flex justify-end gap-2"><Btn onClick={() => setSave(false)}>닫기</Btn><Btn kind="pri" onClick={() => setDone(true)}>저장하기</Btn></div>

}

function Settings({ settings, setSettings, notify }) {
  const p = useParams();
  const [f, setF] = useState(settings);
  const [saving, setSaving] = useState(false);
  useEffect(() => { if (p.state === "saved") { const n = { ...settings, repeat: 7, timeout: 90 }; setF(n); setSettings(n); notify("측정 설정을 저장했어요.", settings); } else setF(settings); }, [p]);
  const set = (k, v) => setF((o) => ({ ...o, [k]: v }));
  const save = () => { setSaving(true); setTimeout(() => { const prev = settings; setSettings(f); setSaving(false); notify("측정 설정을 저장했어요.", prev); }, 500); };
  const lab = "mb-1.5 block text-[13px] font-semibold text-[var(--n8)]";
  return (
    <main id="main">
      <Band title="설정" sub="측정 방식과 결과 파일 위치를 정해요. 저장한 값은 다음 측정부터 적용돼요." />
      <div className="rf-in" style={{ paddingBottom: 80 }}>
        <div className="rf-overlap grid gap-6 md:grid-cols-[1.4fr_1fr]" style={{ marginTop: "-2.5rem" }}>
          <form className="grid gap-5 bg-[var(--n1)] p-6 shadow-card" onSubmit={(e) => { e.preventDefault(); save(); }} data-settings>
            <div className="grid gap-5 md:grid-cols-2">
              <label><span className={lab}>반복 횟수</span><select className="field" value={f.repeat} onChange={(e) => set("repeat", +e.target.value)}>{[3, 5, 7].map((n) => <option key={n} value={n}>{n}회</option>)}</select></label>
              <label><span className={lab}>모듈 제한 시간(초)</span><input className="field num" type="number" min="30" max="300" value={f.timeout} onChange={(e) => set("timeout", +e.target.value)} /></label>
              <label><span className={lab}>전원 모드</span><select className="field" value={f.power} onChange={(e) => set("power", e.target.value)}>{["최고 성능", "균형", "절전"].map((n) => <option key={n}>{n}</option>)}</select></label>
              <label><span className={lab}>온도 한계(°C)</span><input className="field num" type="number" min="60" max="100" value={f.limit} onChange={(e) => set("limit", +e.target.value)} /></label>
            </div>
            <label><span className={lab}>결과 폴더</span><input className="field" value={f.folder} onChange={(e) => set("folder", e.target.value)} /></label>
            <fieldset><legend className={lab}>측정할 모듈</legend><div className="flex flex-wrap gap-4">{MODS.map((m) => <label key={m.key} className="flex items-center gap-2 text-[15px]"><input type="checkbox" checked={f.mods.includes(m.key)} onChange={(e) => set("mods", e.target.checked ? [...f.mods, m.key] : f.mods.filter((k) => k !== m.key))} style={{ accentColor: "var(--m600)" }} />{m.name}</label>)}</div></fieldset>
            <label className="flex items-center justify-between gap-4 border-t border-[var(--n3)] pt-4"><span><b className="block text-[15px]">서버급 장비 모드</b><span className="text-[13.5px] text-[var(--n7)]">화면 출력 없이 측정하고 결과 CSV만 저장해요</span></span><input type="checkbox" role="switch" checked={f.server} onChange={(e) => set("server", e.target.checked)} style={{ accentColor: "var(--m600)", width: 22, height: 22 }} /></label>
            <div className="flex justify-end"><Btn kind="pri" type="submit" data-loading={saving} disabled={saving}>설정 저장하기</Btn></div>
          </form>
          <aside className="self-start bg-[var(--n1)] p-6 shadow-card"><h2 className="text-[length:var(--t-section)] font-bold">지금 적용된 값</h2>
            <dl className="mt-3 grid gap-2 text-[14.5px]">{[["반복 횟수", settings.repeat + "회"], ["제한 시간", settings.timeout + "초"], ["전원 모드", settings.power], ["온도 한계", settings.limit + "°C"], ["모듈", settings.mods.length + "종"], ["서버급 모드", settings.server ? "켜짐" : "꺼짐"]].map(([k, v]) => <div key={k} className="flex justify-between border-b border-[var(--n2)] pb-2"><dt className="text-[var(--n7)]">{k}</dt><dd className="num font-semibold">{v}</dd></div>)}</dl></aside>
        </div>
      </div>
    </main>
  );
}

const REQS = [["운영체제", "Windows 10 22H2 이상 · Windows Server 2019 이상"], ["CPU", "64비트 x64, 코어 2개 이상"], ["메모리", "8GB 이상"], ["저장 공간", "설치 " + SETUP_MB + "MB + 결과 폴더 200MB"], ["권한", "설치 시 관리자 권한 한 번"], ["화면", "1280×720 이상 (서버급 모드는 화면 불필요)"]];

        {toast && <div className="fixed bottom-6 left-1/2 z-[80] flex -translate-x-1/2 items-center gap-4 bg-[var(--n10)] px-5 py-3 text-[14px] text-[var(--n0)] shadow-pop" role="status">{toast.text}<button type="button" className="font-bold text-[var(--m200)]" onClick={() => { setSettings(toast.prev); setToast(null); }}>되돌리기</button></div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}

function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
