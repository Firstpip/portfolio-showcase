const LABEL = { company: '회사명', site: '홈페이지 주소', industry: '업종', product: '제품·서비스', founded: '설립 연도', staff: '직원 수(명)', customers: '주요 고객', motive: '고객의 구매 동기', region: '주요 지역', budget: '월 마케팅 예산(만원)', comp1: '경쟁사 1', comp2: '경쟁사 2', comp3: '경쟁사 3' };
const SAMPLE_FILES = [['캠페인_결과_10월.xlsx', 420, 'XLSX'], ['브랜드_가이드_v3.pdf', 2400, 'PDF'], ['배송_후기_정리.docx', 180, 'DOCX'], ['원산지_증빙.zip', 49800, 'ZIP']];
function Diagnosis({ S, upd, say, p }) {
  const d = S.diag; const view = p.view; const step = Math.min(5, Math.max(1, +p.step || 1));
  const [bad, setBad] = useState([]); const [open, setOpen] = useState(0);
  const setD = (k, v) => upd(s => ({ diag: { ...s.diag, [k]: v } }));
  const used = sumBy(S.files, f => f.kb);
  const allKeys = STEPS.flatMap(s => s[1]); const filled = allKeys.filter(k => String(d[k]).trim()).length;
  const chosenOk = (n) => STEPS[n - 1][1].every(k => String(d[k]).trim()) && (n !== 4 || d.channels.length > 0);
  const next = () => {
    const miss = STEPS[step - 1][1].filter(k => !String(d[k]).trim());
    if (step === 4 && d.channels.length === 0) { setBad(['channels']); say('채널을 한 곳 이상 골라 주세요'); return; }
    if (miss.length) { setBad(miss); say(miss.length + '곳을 채워 주세요: ' + miss.map(k => LABEL[k]).join(', ')); return; }
    setBad([]); if (step === 5) go('diagnosis', { view: 'result' }); else go('diagnosis', { step: String(step + 1) });
  };
  const items = [
    ['브랜드 포지션', d.product + '로 ' + d.customers + '의 점심을 해결하는 서비스', '제품·서비스와 주요 고객 입력(1~2단계)'],
    ['핵심 구매 동기', d.motive, '구매 동기 입력(2단계)과 업로드한 고객 설문 요약'],
    ['운영 규모', d.industry + ', 설립 ' + d.founded + '년, 직원 ' + d.staff + '명', '회사 정보 입력(1단계)'],
    ['우선 채널', d.channels.slice(0, 2).join(', ') || '선택 없음', '현재 운영 채널 ' + d.channels.length + '곳 중 앞의 두 곳'],
    ['예산 배분', '월 ' + fmtNum(d.budget) + '만원을 ' + d.channels.length + '개 채널에 나눠 운영', '월 마케팅 예산과 채널 선택(4단계)'],
    ['경쟁 구도', [d.comp1, d.comp2, d.comp3].filter(Boolean).join(', ') + ' ' + [d.comp1, d.comp2, d.comp3].filter(Boolean).length + '곳과 비교', '경쟁사 입력(5단계)과 업로드한 경쟁사 가격표'],
    ['확인 필요', '업로드 자료 ' + S.files.length + '건 중 가격표·후기 원문은 근거가 부족해요', '업로드 자료 목록(3단계)'],
    ['다음 30일 과제', '맥락 보드 카드 10장을 검토하고 캠페인 1건을 만들어요', '위 7개 항목을 종합'],
  ];
  if (view === 'result') return <section className="ap-screen">
    <PageHead title="진단 결과 요약" sub={d.company + ' · 입력 12칸과 자료 ' + S.files.length + '건을 기준으로 정리했어요'} right={[<Btn key="a" onClick={() => go('diagnosis', { step: '1' })}><Icon name="pencil" size={15} />입력 수정</Btn>, <Btn key="b" v="pri" onClick={() => { say('진단 내용으로 맥락 카드 10장을 갱신했어요'); go('context', {}); }}>맥락 보드로 이어가기</Btn>]} />
    <div className="ap-card flat">{items.map(([t, v, why], i) => <div key={t} style={{ borderBottom: i < items.length - 1 ? '1px solid var(--n2)' : 0 }}>
      <button type="button" className="ap-row" style={{ padding: '14px 20px' }} aria-expanded={open === i} onClick={() => setOpen(open === i ? -1 : i)}>
        <span style={{ width: 120, fontWeight: 600 }}>{t}</span><span className="t"><b style={{ fontWeight: 400 }}>{v}</b></span>
        {t === '확인 필요' ? <Pill t="warn">근거 부족</Pill> : <Pill>근거 있음</Pill>}<Icon name={open === i ? 'chevron-down' : 'chevron-right'} size={16} />
      </button>
      {open === i && <div style={{ padding: '0 20px 14px 152px', color: 'var(--n7)', fontSize: 13 }}>근거 · {why}</div>}
    </div>)}</div>
  </section>;
  const set = (k) => ({ value: d[k], onChange: (e) => setD(k, e.target.value), 'aria-invalid': bad.includes(k) ? 'true' : undefined });
  const input = (k, extra) => <Field key={k} label={LABEL[k]} hint={bad.includes(k) ? LABEL[k] + ' 칸을 채워 주세요' : undefined}><input className="ap-input" {...set(k)} {...extra} /></Field>;
  return <section className="ap-screen">
    <PageHead title="진단 위저드" sub="회사 정보를 한 번 입력하면 맥락 보드와 캠페인 플래너에 이어져요" right={[<Btn key="s" onClick={() => { const t = new Date(); upd({ saved: pad(t.getHours()) + ':' + pad(t.getMinutes()) }); say('임시저장했어요'); }}><Icon name="save" size={15} />임시저장</Btn>]} />
    <div className="ap-split">
      <div className="ap-card" style={{ padding: 12 }}>
        <div className="ap-steps">{STEPS.map(([t], i) => <button key={t} type="button" className={i + 1 < step && chosenOk(i + 1) ? 'done' : ''} aria-current={step === i + 1 ? 'step' : undefined} onClick={() => go('diagnosis', { step: String(i + 1) })}><span className="no">{i + 1 < step && chosenOk(i + 1) ? <Icon name="check" size={13} /> : i + 1}</span>{t}</button>)}
          <button type="button" onClick={() => go('diagnosis', { view: 'result' })}><span className="no"><Icon name="target" size={13} /></span>진단 결과</button></div>
        <p className="ap-hint" style={{ padding: '10px 12px 4px' }}>{S.saved ? '마지막 임시저장 ' + S.saved : '임시저장한 기록이 없어요'}</p>
      </div>
      <div className="ap-card">
        <h2 style={{ marginBottom: 16 }}>{step}단계 · {STEPS[step - 1][0]}</h2>
        {step === 1 && <div className="ap-two">{['company', 'industry', 'product', 'site', 'founded', 'staff'].map(k => input(k, k === 'founded' || k === 'staff' ? { inputMode: 'numeric' } : {}))}</div>}
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid var(--n2)' }}><div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--n7)', marginBottom: 6 }}><span>입력 {filled}칸 / {allKeys.length}칸</span><span>업로드 자료 {S.files.length}건 · 채널 {d.channels.length}곳</span></div><div className="ap-bar"><i style={{ width: (filled / allKeys.length * 100) + '%' }}></i></div><p className="ap-hint">입력한 내용은 맥락 보드의 브랜드 카드와 캠페인 플래너의 기본값으로 이어져요. 단계 사이를 오가도 값은 그대로 남아요.</p></div>
        {step === 2 && <div className="ap-grid">{['customers', 'motive', 'region'].map(k => input(k))}</div>}
        {step === 3 && <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, gap: 12, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 220 }}><p style={{ fontSize: 13, color: 'var(--n7)', marginBottom: 6 }}>사용 {kbText(used)} / {kbText(MAX_KB)}</p><div className="ap-bar"><i style={{ width: Math.min(100, used / MAX_KB * 100) + '%' }}></i></div></div>
            <Btn onClick={() => { const f = SAMPLE_FILES[S.files.length % SAMPLE_FILES.length]; if (used + f[1] > MAX_KB) { say('용량 한도 ' + kbText(MAX_KB) + '를 넘어서 올릴 수 없어요'); return; } upd(s => ({ files: [...s.files, { id: 'F' + (s.files.length + 1) + Date.now() % 1000, name: f[0], kb: f[1], type: f[2] }] })); say(f[0] + ' 업로드를 마쳤어요'); }}><Icon name="upload" size={15} />파일 추가</Btn>
          </div>
          <div className="ap-card flat"><table className="ap-table"><thead><tr><th>파일명</th><th>형식</th><th className="num">크기</th><th></th></tr></thead><tbody>
            {S.files.map(f => <tr key={f.id}><td><Icon name="file-text" size={15} className="mr-2" /> {f.name}</td><td>{f.type}</td><td className="num">{kbText(f.kb)}</td><td style={{ textAlign: 'right' }}><Btn v="ghost" sm onClick={() => { upd(s => ({ files: s.files.filter(x => x.id !== f.id) })); say(f.name + ' 파일을 삭제했어요'); }} aria-label={f.name + ' 삭제'}><Icon name="trash-2" size={15} /></Btn></td></tr>)}
            {S.files.length === 0 && <tr><td colSpan="4"><div className="ap-empty" data-empty>올린 자료가 없어요. 파일 추가로 브랜드 소개서부터 올려 보세요.</div></td></tr>}
          </tbody></table></div>
        </div>}
        {step === 4 && <div className="ap-grid">{input('budget', { inputMode: 'numeric' })}
          <Field label="지금 운영하는 채널" hint={bad.includes('channels') ? '채널을 한 곳 이상 골라 주세요' : '여러 곳을 고를 수 있어요'}><div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>{CH.map(c => <button key={c} type="button" className="ap-chip" aria-pressed={d.channels.includes(c)} onClick={() => setD('channels', d.channels.includes(c) ? d.channels.filter(x => x !== c) : [...d.channels, c])}>{c}</button>)}</div></Field></div>}
        {step === 5 && <div className="ap-three">{['comp1', 'comp2', 'comp3'].map(k => input(k))}</div>}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 24 }}>
          <Btn onClick={() => go('diagnosis', { step: String(Math.max(1, step - 1)) })}>이전 단계</Btn>
          <Btn v="pri" onClick={next}>{step === 5 ? '진단 결과 보기' : '다음 단계'}</Btn>
        </div>
      </div>
    </div>
  </section>;
}

/* ───────── 맥락 보드 ───────── */
const NX = (id) => 10 + POS[id][0] / 100 * 488; const NY = (id) => 10 + POS[id][1] / 100 * 300;
const edgeEnd = (c, o) => { const dx = o[0] - c[0], dy = o[1] - c[1]; const t = Math.min(66 / (Math.abs(dx) || 1e-9), 20 / (Math.abs(dy) || 1e-9)); return [c[0] + dx * t, c[1] + dy * t]; };
function Context({ S, upd, say, p }) {
  const sel = p.card || 'K-01'; const view = p.view;
  const card = S.cards.find(c => c.id === sel) || S.cards[0];
  const [link, setLink] = useState(null); const [mode, setMode] = useState(false);
  const [body, setBody] = useState(card.body); const [ask, setAsk] = useState(null);
  useEffect(() => setBody(card.body), [card.id, card.body]);
  const title = (id) => (S.cards.find(c => c.id === id) || {}).title;
  const pick = (id) => {
    if (!mode) { go('context', { card: id }); return; }
    if (!link) { setLink(id); say('연결할 카드를 하나 더 눌러 주세요'); return; }
    if (link === id) { setLink(null); return; }
    if (S.edges.some(e => e[0] === link && e[1] === id)) { say('이미 연결된 카드예요'); setLink(null); return; }
    upd(s => ({ edges: [...s.edges, [link, id, '연관']] })); say(title(link) + ' 와 ' + title(id) + ' 연결을 추가했어요'); setLink(null); setMode(false);
  };
  const save = () => {
    if (body.trim() === card.body) { say('바뀐 내용이 없어요'); return; }
    if (!body.trim()) { say('카드 내용을 비울 수 없어요'); return; }
    upd(s => { const cards = s.cards.map(c => c.id === card.id ? { ...c, body: body.trim() } : c); const snap = Object.fromEntries(cards.map(c => [c.id, c.body])); return { cards, versions: [...s.versions, { id: 'v' + (s.versions.length + 1), sum: card.title + ' 수정', by: ME.name, at: md(TODAY) + ' ' + '09:40', snap }] }; });
    say(card.title + ' 카드를 저장하고 새 버전을 만들었어요');
  };
  const vers = S.versions; const A = vers.find(v => v.id === (p.a || 'v6')) || vers[0]; const B = vers.find(v => v.id === (p.b || vers[vers.length - 1].id)) || vers[vers.length - 1];
  const diffs = S.cards.filter(c => A.snap[c.id] !== B.snap[c.id]);
  const restore = (v) => { upd(s => { const cards = s.cards.map(c => ({ ...c, body: v.snap[c.id] })); return { cards, versions: [...s.versions, { id: 'v' + (s.versions.length + 1), sum: v.id + '으로 되돌림', by: ME.name, at: md(TODAY) + ' 09:41', snap: { ...v.snap } }] }; }); say(v.id + ' 내용으로 되돌리고 새 버전을 만들었어요'); setAsk(null); };
  return <section className="ap-screen">
    <PageHead title="맥락 보드" sub={'브랜드 맥락 카드 ' + S.cards.length + '장 · 관계 ' + S.edges.length + '건 · 현재 ' + vers[vers.length - 1].id} right={[<Btn key="m" aria-pressed={mode} onClick={() => { setMode(!mode); setLink(null); }}><Icon name="link" size={15} />{mode ? '연결 모드 끄기' : '연결 추가'}</Btn>]} />
    <Tabs value={view === 'versions' ? 'v' : 'c'} onPick={(k) => go('context', k === 'v' ? { view: 'versions', a: 'v6', b: vers[vers.length - 1].id } : { card: sel })} items={[['c', '카드와 관계도'], ['v', '버전 이력 ' + vers.length]]} />
    {view !== 'versions' ? <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 360px', gap: 20, alignItems: 'start' }} className="ctx-grid">
      <div className="ap-grid">
        <div className="ap-card" style={{ padding: 8 }}>
          <svg viewBox="0 0 640 360" style={{ width: '100%', display: 'block' }} role="img" aria-label="브랜드 맥락 카드 관계도">
            <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor" /></marker></defs>
            {S.edges.map(([a, b, l], i) => { const ca = [NX(a) + 66, NY(a) + 20], cb = [NX(b) + 66, NY(b) + 20]; const p1 = edgeEnd(ca, cb), p2 = edgeEnd(cb, ca); return <g key={i} style={{ color: 'var(--n5)' }}><line x1={p1[0]} y1={p1[1]} x2={p2[0]} y2={p2[1]} stroke="currentColor" strokeWidth="1.4" markerEnd="url(#arr)" /><text x={(p1[0] + p2[0]) / 2} y={(p1[1] + p2[1]) / 2 - 4} fontSize="11" textAnchor="middle" paintOrder="stroke" strokeWidth="4" style={{ fill: 'var(--n8)', stroke: 'var(--n1)' }}>{l}</text></g>; })}
            {S.cards.map(c => { const on = c.id === card.id; return <g key={c.id} transform={'translate(' + NX(c.id) + ',' + NY(c.id) + ')'} style={{ cursor: 'pointer' }} onClick={() => pick(c.id)} role="button" tabIndex={0} aria-label={c.title + ' 카드'} onKeyDown={(e) => { if (e.key === 'Enter') pick(c.id); }}>
              <rect width="132" height="40" rx="7" style={{ fill: on ? 'var(--m50)' : 'var(--n1)', stroke: link === c.id ? 'var(--s3)' : on ? 'var(--m700)' : 'var(--n4)' }} strokeWidth={on || link === c.id ? 2 : 1} />
              <text x="12" y="17" fontSize="10" style={{ fill: 'var(--n7)' }}>{c.type}</text><text x="12" y="32" fontSize="13" fontWeight="600" style={{ fill: 'var(--n9)' }}>{c.title}</text></g>; })}
          </svg>
        </div>
        <div className="ap-card flat"><table className="ap-table"><thead><tr><th>연결</th><th>관계</th><th></th></tr></thead><tbody>
          {S.edges.map(([a, b, l], i) => <tr key={i}><td>{title(a)} · {title(b)}</td><td><Pill>{l}</Pill></td><td style={{ textAlign: 'right' }}><Btn v="ghost" sm aria-label="연결 삭제" onClick={() => { upd(s => ({ edges: s.edges.filter((_, k) => k !== i) })); say('연결을 삭제했어요'); }}><Icon name="x" size={15} /></Btn></td></tr>)}
        </tbody></table></div>
      </div>
      <div className="ap-card" style={{ position: 'sticky', top: 'calc(var(--look-bar-h,48px) + var(--c-nav-h) + 16px)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}><h3>{card.title}</h3><Pill>{card.type}</Pill></div>
        <Field label="카드 내용" hint={'저장하면 새 버전이 만들어져요 · 현재 ' + body.length + '자'}><textarea className="ap-area" rows="6" value={body} onChange={(e) => setBody(e.target.value)} /></Field>
        <div style={{ marginTop: 14 }}><p className="ap-label">이 카드와 연결된 카드</p><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{S.edges.filter(e => e[0] === card.id || e[1] === card.id).map((e, i) => { const o = e[0] === card.id ? e[1] : e[0]; return <button key={i} type="button" className="ap-chip" onClick={() => go('context', { card: o })}>{title(o)}</button>; })}</div></div>
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 18 }}><Btn v="pri" onClick={save}>카드 저장</Btn></div>
      </div>
    </div> : <div className="ap-grid">
      <div className="ap-card flat"><table className="ap-table"><thead><tr><th>버전</th><th>변경 요약</th><th>작성</th><th>일시</th><th></th></tr></thead><tbody>
        {[...vers].reverse().map(v => <tr key={v.id} data-on={v.id === A.id || v.id === B.id}><td><b>{v.id}</b></td><td>{v.sum}</td><td>{v.by}</td><td>{v.at}</td><td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}><Btn sm v="ghost" onClick={() => go('context', { view: 'versions', a: v.id, b: B.id })}>왼쪽에 놓기</Btn><Btn sm v="ghost" onClick={() => go('context', { view: 'versions', a: A.id, b: v.id })}>오른쪽에 놓기</Btn></td></tr>)}
      </tbody></table></div>
      <div className="ap-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14, flexWrap: 'wrap', gap: 8 }}><h3>{A.id}과 {B.id} 비교 · 바뀐 카드 {diffs.length}장</h3>
          <Btn onClick={() => setAsk(A)}><Icon name="history" size={15} />{A.id}로 되돌리기</Btn></div>
        {diffs.length === 0 ? <div className="ap-empty" data-empty>두 버전의 내용이 같아요. 다른 버전을 골라 보세요.</div> : <div className="ap-grid">{diffs.map(c => <div key={c.id} className="ap-two" style={{ borderTop: '1px solid var(--n2)', paddingTop: 12 }}>
          <div><p className="ap-label">{c.title} · {A.id}</p><p style={{ color: 'var(--n7)' }}>{A.snap[c.id]}</p></div>
          <div><p className="ap-label">{c.title} · {B.id}</p><p>{B.snap[c.id]}</p></div></div>)}</div>}
      </div>
    </div>}
    {ask && <Modal title={ask.id + '으로 되돌릴까요?'} onClose={() => setAsk(null)} foot={[<Btn key="c" onClick={() => setAsk(null)}>그대로 두기</Btn>, <Btn key="o" v="pri" onClick={() => restore(ask)}>되돌리기</Btn>]}>
      <p>{S.cards.filter(c => ask.snap[c.id] !== c.body).length}장의 카드 내용이 {ask.id} 시점으로 바뀌고, 되돌린 기록이 새 버전으로 남아요.</p></Modal>}
  </section>;
}

/* ───────── 캠페인 플래너 ───────── */
const PLAN_DEF = {
  A: { name: '검색 집중', main: ['네이버 검색광고', '구글 검색광고'], sub: ['네이버 블로그'], split: [60, 25, 15], msg: '지금 메뉴를 찾는 사람에게 바로 답해요', posts: 8, ppl: 2, ask: '검색어 후보와 랜딩 페이지 주소' },
  B: { name: '소셜 확산', main: ['인스타그램 광고', '인스타그램 계정'], sub: ['유튜브 숏츠'], split: [55, 30, 15], msg: '재료와 구성을 사진과 짧은 영상으로 보여줘요', posts: 14, ppl: 3, ask: '촬영 가능한 메뉴 수와 일정' },
  C: { name: '콘텐츠 허브', main: ['네이버 블로그', '뉴스레터'], sub: ['카카오톡 채널'], split: [50, 30, 20], msg: '구성·원산지·식단 정보를 글로 쌓아 두어요', posts: 10, ppl: 2, ask: '원산지 표기 자료와 배송 일정표' },
};
function Gantt({ camp, tasks, onChange }) {
  const ref = useRef(null); const rs = addDays(camp.start, -3); const total = 49; const [drag, setDrag] = useState(null);
  const pos = (s, l) => ({ left: (dayDiff(rs, s) / total * 100) + '%', width: (l / total * 100) + '%' });
  const down = (e, i, mode) => { e.preventDefault(); e.stopPropagation(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} const w = ref.current.getBoundingClientRect().width; setDrag({ i, mode, x0: e.clientX, ppd: w / total, s0: tasks[i].s, l0: tasks[i].l }); };
  const move = (e) => { if (!drag) return; const dd = Math.round((e.clientX - drag.x0) / drag.ppd); if (drag.mode === 'move') onChange(drag.i, { s: addDays(drag.s0, dd) }); else onChange(drag.i, { l: Math.max(1, drag.l0 + dd) }); };
  const ticks = Array.from({ length: 8 }, (_, k) => addDays(rs, k * 7));
  return <div className="ap-gantt" style={{ display: 'grid', gridTemplateColumns: '150px 1fr' }} onPointerMove={move} onPointerUp={() => setDrag(null)} onPointerCancel={() => setDrag(null)}>
    <div></div><div ref={ref} style={{ position: 'relative', height: 28, borderBottom: '1px solid var(--n3)' }}>{ticks.map((t, k) => <span key={k} style={{ position: 'absolute', left: (k * 7 / total * 100) + '%', fontSize: 11, color: 'var(--n7)' }}>{md(t)}</span>)}</div>
    {tasks.map((t, i) => <React.Fragment key={t.name}>
      <div style={{ height: 34, display: 'flex', alignItems: 'center', fontSize: 13, borderBottom: '1px solid var(--n2)', paddingRight: 8 }}>{t.name}</div>
      <div style={{ position: 'relative', height: 34, borderBottom: '1px solid var(--n2)', backgroundImage: 'linear-gradient(to right, var(--n2) 1px, transparent 1px)', backgroundSize: (7 / total * 100) + '% 100%' }}>
        <div className={cx('ap-gbar', drag && drag.i === i && 'drag')} style={{ top: 6, ...pos(t.s, t.l) }} onPointerDown={(e) => down(e, i, 'move')} role="slider" aria-label={t.name + ' 기간'} aria-valuetext={md(t.s) + ' 부터 ' + md(addDays(t.s, t.l - 1)) + ' 까지'} tabIndex={0} onKeyDown={(e) => { if (e.key === 'ArrowRight') onChange(i, { s: addDays(t.s, 1) }); if (e.key === 'ArrowLeft') onChange(i, { s: addDays(t.s, -1) }); }}>
          {md(t.s)}-{md(addDays(t.s, t.l - 1))}<span className="rs" onPointerDown={(e) => down(e, i, 'size')}></span></div>
      </div></React.Fragment>)}
  </div>;
}
function Campaign({ S, upd, say, p }) {
  const cid = p.c || 'C-01'; const view = p.view === 'plans' ? 'plans' : 'gantt';
  const camp = S.camps.find(c => c.id === cid) || S.camps[0]; const tasks = S.tasks[camp.id];
  const timers = useRef([]); useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const start = tasks.reduce((m, t) => t.s < m ? t.s : m, tasks[0].s); const end = tasks.reduce((m, t) => { const e = addDays(t.s, t.l - 1); return e > m ? e : m; }, addDays(tasks[0].s, tasks[0].l - 1));
  const setC = (patch) => upd(s => ({ camps: s.camps.map(c => c.id === camp.id ? { ...c, ...patch } : c) }));
  const chTask = (i, patch) => upd(s => ({ tasks: { ...s.tasks, [camp.id]: s.tasks[camp.id].map((t, k) => k === i ? { ...t, ...patch } : t) } }));
  const shiftAll = (n) => upd(s => ({ tasks: { ...s.tasks, [camp.id]: s.tasks[camp.id].map(t => ({ ...t, s: addDays(t.s, n) })) } }));
  const lastIdx = tasks.findIndex(t => ymd(addDays(t.s, t.l - 1)) === ymd(end));
  const req = (label, id) => {
    const rid = id || 'Q' + (S.reqs.length + 1) + (Date.now() % 100);
    if (!id) upd(s => ({ reqs: [{ id: rid, c: camp.id, label, st: '대기', at: md(TODAY) + ' 09:45' }, ...s.reqs] })); else upd(s => ({ reqs: s.reqs.map(r => r.id === id ? { ...r, st: '대기' } : r) }));
    const setSt = (st) => upd(s => ({ reqs: s.reqs.map(r => r.id === rid ? { ...r, st } : r) }));
    timers.current.push(setTimeout(() => setSt('진행'), 500)); timers.current.push(setTimeout(() => { setSt('완료'); say(camp.name + ' ' + label + ' 요청이 끝났어요'); }, 1900));
  };
  const picked = S.plan[camp.id];
  return <section className="ap-screen">
    <PageHead title="캠페인 플래너" sub={'캠페인 ' + S.camps.length + '건 · 선택 ' + camp.name} right={[<Btn key="r" v="pri" onClick={() => { go('campaign', { c: camp.id, view: 'plans' }); req('기획안 3안 생성'); }}><Icon name="message-square" size={15} />기획안 생성 요청</Btn>]} />
    <div className="ap-split">
      <div className="ap-card flat">{S.camps.map(c => <button key={c.id} type="button" className="ap-row" aria-current={c.id === camp.id} onClick={() => go('campaign', { c: c.id, view })}><span className="t"><b>{c.name}</b><span>{c.goal} · {fmtNum(c.budget)}만원</span></span><Pill t={c.status === '진행' ? 'ok' : undefined}>{c.status}</Pill></button>)}</div>
      <div className="ap-grid">
        <div className="ap-card">
          <div className="ap-two" style={{ marginBottom: 14 }}>
            <Field label="캠페인 목표"><input className="ap-input" value={camp.goal} onChange={(e) => setC({ goal: e.target.value })} /></Field>
            <Field label="타깃"><input className="ap-input" value={camp.target} onChange={(e) => setC({ target: e.target.value })} /></Field>
            <Field label="예산(만원)"><input className="ap-input" inputMode="numeric" value={camp.budget} onChange={(e) => setC({ budget: +String(e.target.value).replace(/\D/g, '') || 0 })} /></Field>
            <div className="ap-two"><Field label="시작일"><input className="ap-input" type="date" value={ymd(start)} onChange={(e) => { const dt = parseYmd(e.target.value); if (dt) shiftAll(dayDiff(start, dt)); }} /></Field>
              <Field label="종료일"><input className="ap-input" type="date" value={ymd(end)} onChange={(e) => { const dt = parseYmd(e.target.value); if (dt) chTask(lastIdx, { l: Math.max(1, tasks[lastIdx].l + dayDiff(end, dt)) }); }} /></Field></div>
          </div>
          <p className="ap-label">채널</p><div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>{CH.map(c => <button key={c} type="button" className="ap-chip" aria-pressed={camp.channels.includes(c)} onClick={() => setC({ channels: camp.channels.includes(c) ? camp.channels.filter(x => x !== c) : [...camp.channels, c] })}>{c}</button>)}</div>
        </div>
        <Tabs value={view} onPick={(k) => go('campaign', { c: camp.id, view: k })} items={[['gantt', '간트 일정표'], ['plans', '기획안 비교']]} />
        {view === 'gantt' ? <div className="ap-card"><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10, gap: 8, flexWrap: 'wrap' }}><h3>작업 {tasks.length}개 · {md(start)}부터 {md(end)}까지 {dayDiff(start, end) + 1}일</h3><p className="ap-hint" style={{ margin: 0 }}>막대를 끌면 날짜가 바뀌고, 오른쪽 끝을 끌면 기간이 바뀌어요</p></div><Gantt camp={camp} tasks={tasks} onChange={chTask} /></div>
          : <div className="ap-grid">
            <div className="ap-card flat"><table className="ap-table"><thead><tr><th>생성 요청</th><th>캠페인</th><th>요청 시각</th><th>상태</th><th></th></tr></thead><tbody>
              {S.reqs.map(r => <tr key={r.id}><td>{r.label}</td><td>{(S.camps.find(c => c.id === r.c) || {}).name}</td><td>{r.at}</td><td><Pill t={r.st === '완료' ? 'ok' : r.st === '실패' ? 'bad' : r.st === '진행' ? 'acc' : undefined}>{r.st}</Pill></td><td style={{ textAlign: 'right' }}>{r.st === '실패' && <Btn sm onClick={() => req(r.label, r.id)}><Icon name="rotate-ccw" size={14} />다시 시도</Btn>}</td></tr>)}</tbody></table></div>
            <div className="ap-card flat"><table className="ap-table"><thead><tr><th style={{ width: 120 }}>항목</th>{Object.entries(PLAN_DEF).map(([k, v]) => <th key={k}>{k}안 · {v.name}{picked === k && <> <Pill t="ok">반영됨</Pill></>}</th>)}</tr></thead><tbody>
              {[['핵심 메시지', v => v.msg], ['주력 채널', v => v.main.join(', ')], ['보조 채널', v => v.sub.join(', ')], ['예산 배분', v => { const a = Math.round(camp.budget * v.split[0] / 100), b = Math.round(camp.budget * v.split[1] / 100); return '주력 ' + fmtNum(a) + '만원 · 보조 ' + fmtNum(b) + '만원 · 예비 ' + fmtNum(camp.budget - a - b) + '만원'; }], ['콘텐츠 수', v => v.posts + '건'], ['진행 기간', () => (dayDiff(start, end) + 1) + '일'], ['필요 인력', v => v.ppl + '명'], ['확인 필요', v => v.ask]].map(([n, f]) => <tr key={n}><td><b>{n}</b></td>{Object.values(PLAN_DEF).map((v, i) => <td key={i}>{f(v)}</td>)}</tr>)}
              <tr><td></td>{Object.entries(PLAN_DEF).map(([k, v]) => <td key={k}><Btn sm onClick={() => { upd(s => ({ plan: { ...s.plan, [camp.id]: k }, camps: s.camps.map(c => c.id === camp.id ? { ...c, channels: [...v.main, ...v.sub] } : c) })); say(camp.name + '에 ' + k + '안을 반영했어요'); }}>{k}안 반영</Btn></td>)}</tr>
            </tbody></table></div>
          </div>}
      </div>
    </div>
  </section>;
}

/* ───────── 성과 대시보드 ───────── */
function Performance({ S, upd, say, p }) {
  const view = ['csv', 'reports'].includes(p.view) ? p.view : 'overview'; const [prev, setPrev] = useState(null);
  const timers = useRef([]); useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const agg = CH.map(c => { const b = PERF0[c], e = S.extra[c] || { imp: 0, clk: 0, cv: 0, spend: 0 }; return { c, imp: b.imp + e.imp, clk: b.clk + e.clk, cv: b.cv + e.cv, spend: b.spend + e.spend, rev: b.rev }; });
  const tot = agg.reduce((s, r) => ({ imp: s.imp + r.imp, clk: s.clk + r.clk, cv: s.cv + r.cv, spend: s.spend + r.spend, rev: s.rev + r.rev }), { imp: 0, clk: 0, cv: 0, spend: 0, rev: 0 });
  const wk = weekly('cv', S.extra); const mx = Math.max(...wk) * 1.2;
  const rows = parseCsv(S.csv); const okRows = rows.filter(r => !r.err);
  const apply = () => { if (!okRows.length) { say('반영할 정상 행이 없어요'); return; } upd(s => { const ex = { ...s.extra }; okRows.forEach(r => { const e = ex[r.v.ch] || { imp: 0, clk: 0, cv: 0, spend: 0 }; ex[r.v.ch] = { imp: e.imp + r.v.imp, clk: e.clk + r.v.clk, cv: e.cv + r.v.cv, spend: e.spend + r.v.spend }; }); return { extra: ex, csv: s.csv.split('\n').filter((ln, i) => i === 0 || rows[i - 1].err).join('\n') }; }); say('정상 ' + okRows.length + '행을 성과 표에 반영했어요'); };
  const mkReport = (id) => { upd(s => ({ reports: s.reports.map(r => r.id === id ? { ...r, st: '생성 중' } : r) })); timers.current.push(setTimeout(() => { upd(s => ({ reports: s.reports.map(r => r.id === id ? { ...r, st: '완료' } : r) })); say('월간 리포트를 만들었어요'); }, 1500)); };

function Shell({ onReset }) {
  const route = useRoute(); const p = useParams(); useLucide();
  const [S, setS] = useState(initDb); const [open, setOpen] = useState(false); const [seed, setSeed] = useState(''); const [toast, setToast] = useState('');
  const tt = useRef(null);
  const upd = (patch) => setS(s => ({ ...s, ...(typeof patch === 'function' ? patch(s) : patch) }));
  const say = (m) => { setToast(m); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(''), 2600); };
  const askAgent = (t) => { setSeed(t + ' '); setOpen(true); };
  useEffect(() => { if (p.agent === '1') setOpen(true); }, [route, p]);
  const r = route === 'context-board' ? 'context' : (ROUTE_NAME[route] ? route : 'diagnosis');
  const props = { S, upd, say, p, askAgent };
  const Screen = { diagnosis: Diagnosis, context: Context, campaign: Campaign, studio: Studio, performance: Performance, workspace: Workspace }[r];
  return <div className="ap">
    <DemoBar onReset={onReset} />
    <header className="ap-head"><div className="ap-head-in">
      <button type="button" className="ap-logo" onClick={() => go('diagnosis', {})}>마케터루프</button>
      <nav className="ap-menu" aria-label="주 메뉴">{Object.entries(ROUTE_NAME).map(([k, n]) => <button key={k} type="button" aria-current={r === k ? 'page' : undefined} onClick={() => go(k, {})}>{n}</button>)}</nav>
      <Btn aria-pressed={open} onClick={() => setOpen(!open)}><Icon name="message-square" size={15} />Agent</Btn>
      <div className="ap-acct"><span className="ap-av">{ME.name[0]}</span><span className="nm">{ME.name} · {ME.ws}</span></div>
    </div></header>
    <main id="main" className={cx('ap-wrap', open && 'agent-open')}><Screen key={r} {...props} /></main>
    <div className="ap-foot">{ME.ws} 워크스페이스 · 사진 · Pixabay (Pexels, StockSnap)</div>
    {open && <AgentPanel route={r} S={S} seed={seed} onClose={() => setOpen(false)} />}
    {toast && <div className="ap-toast" role="status" aria-live="polite">{toast}</div>}
  </div>;
}
function App() { const [rev, setRev] = useState(0); return <Shell key={rev} onReset={() => setRev(x => x + 1)} />; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
