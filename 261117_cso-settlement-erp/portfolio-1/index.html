/* ── 인식 확인 ── */
function Ocr({ st }) {
  const p = useParams();
  const pending = st.subs.find((s) => s.status === 'OCR 확인 대기');
  const sbId = p.sb || (pending ? pending.id : st.subs[0].id);
  const sub = st.subs.find((s) => s.id === sbId) || st.subs[0];
  const base = OCR0[sub.id] || st.ocrOf[sub.id] || null;
  const [q, setQ] = useState([]);
  const [match, setMatch] = useState({});
  useEffect(() => {
    if (!base) return;
    setQ(base.rows.map((r) => (p.fix === '1' && r.conf === '낮음' ? r.shown : r.ocr)));
    setMatch({});
  }, [p.sb, p.fix, st.subs.length]);
  if (!base) {
    const ls = LINES.filter((l) => l.sb === sub.id);
    return (
      <div className="ph-pad" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <h1 className="ph-h1">인식 결과</h1>
        <div className="ph-card">
          <div className="ph-kv"><span>접수번호</span><b className="tn">{sub.id}</b></div>
          <div className="ph-kv"><span>요양기관</span><b>{ALT(sub.inst)}</b></div>
          <div className="ph-kv"><span>상태</span><Pill t="ok">{sub.status}</Pill></div>
        </div>
        <p className="ph-sub">검수가 끝난 자료예요. 확정된 실적 줄은 아래와 같아요.</p>
        <div className="ph-card" style={{ padding: '4px 16px' }}>
          {ls.map((l) => <div key={l.id} className="ph-row"><span>{PRODUCTS[l.pr].name} · {fmtNum(l.qty)}</span><b className="tn">{won(amountOf(l))}</b></div>)}
        </div>
        <button type="button" className="ph-btn2" onClick={() => go('submissions')}>제출 내역으로</button>
      </div>
    );
  }
  const done = sub.status !== 'OCR 확인 대기';
  const ocrSum = sum(q, (x) => Number(x) || 0);
  const ok = ocrSum === base.screenTotal;
  const lowIdx = base.rows.findIndex((r) => r.conf === '낮음');
  const est = sum(base.rows.map((r, i) => ({ r, i })), ({ r, i }) => (Number(q[i]) || 0) * PRODUCTS[r.pr].price);
  const confirm = () => { st.confirmOcr(sub.id); st.toast('실적으로 확인했어요'); go('submissions'); };
  return (
    <div className="ph-pad" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div><h1 className="ph-h1">인식 결과 확인</h1><p className="ph-sub" style={{ marginTop: 4 }}>{sub.id} · {ALT(sub.inst)} · {sub.date}</p></div>
      <div>
        <p className="ph-lbl">촬영한 원본</p>
        <div className="ph-card" style={{ padding: 12, background: 'var(--n2)' }}><RxShot instId={base.inst} rows={base.rows} total={base.screenTotal} rot={-3} hi={lowIdx >= 0 && !done ? lowIdx : null} /></div>
      </div>
      <div>
        <p className="ph-lbl">읽은 값</p>
        <div className="ph-card" style={{ padding: '4px 14px' }}>
          {base.rows.map((r, i) => {
            const low = r.conf === '낮음';
            return (
              <div key={i} className={cx('ph-ocr', low && !done && 'low')}>
                <div className="flex items-center justify-between gap-2">
                  <select className="ph-in ph-sel" aria-label={'품목 ' + (i + 1) + ' 매칭'} value={match[i] || r.pr} disabled={done} onChange={(e) => { setMatch({ ...match, [i]: e.target.value }); st.toast('품목을 바꿨어요'); }}>
                    {Object.entries(PRODUCTS).filter(([, v]) => v.ph === PRODUCTS[r.pr].ph).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                  </select>
                  <Pill t={low ? 'warn' : 'ok'}>신뢰 {r.conf}</Pill>
                </div>
                <div className="flex items-center gap-2" style={{ marginTop: 8 }}>
                  <label className="ph-small" htmlFor={'q' + i}>수량</label>
                  <input id={'q' + i} className="ph-in tn" inputMode="numeric" style={{ maxWidth: 150, textAlign: 'right' }} value={q[i] === undefined ? '' : fmtNum(q[i])} disabled={done}
                    onChange={(e) => { const v = e.target.value.replace(/\D/g, '').slice(0, 6); const n = q.slice(); n[i] = v === '' ? 0 : Number(v); setQ(n); }} />
                  <span className="ph-small" style={{ flex: 1, textAlign: 'right' }}>{PRODUCTS[match[i] || r.pr].name.split(' ')[0]} 처방</span>
                </div>
                {low && !done && <p className="ph-small" style={{ marginTop: 6, color: 'var(--s3-text)' }}>글자가 흐려 확실하지 않아요. 원본과 맞는지 봐 주세요.</p>}
              </div>
            );
          })}
        </div>
      </div>
      <div className={cx('ph-check', ok ? 'ok' : 'bad')} role="status">
        <div className="flex items-center gap-2"><Icon name={ok ? 'circle-check' : 'triangle-alert'} size={18} /><b>합계 검산 {ok ? '일치' : '불일치'}</b></div>
        <div className="ph-kv"><span>읽은 값 합계</span><b className="tn">{fmtNum(ocrSum)}</b></div>
        <div className="ph-kv"><span>화면에 적힌 합계</span><b className="tn">{fmtNum(base.screenTotal)}</b></div>
        {!ok && <p className="ph-small" style={{ marginTop: 4 }}>차이 {fmtNum(Math.abs(base.screenTotal - ocrSum))} · 수량을 고치면 바로 다시 맞춰 봐요.</p>}
        <div className="ph-kv"><span>실적 금액</span><b className="tn">{won(est)}</b></div>
      </div>
      {done ? <Pill t="ok">이미 확인한 자료예요</Pill> : <button type="button" className="ph-btn" disabled={!ok} onClick={confirm}>확인했어요, 실적으로 올리기</button>}
    </div>
  );
}

<script>
(function(){try{

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}

function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
