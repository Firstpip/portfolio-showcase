        <dt>상품</dt><dd>{d.name} · {o.qty}개</dd><dt>금액</dt><dd className="num">{won(amount)}</dd><dt>채널</dt><dd>{o.ch}</dd>

      </dl>
      {canInvoice ? (
        <div style={{ marginTop: 20, display: "grid", gap: 12 }}>
          <div><label className="lbl" htmlFor={"c-" + o.no}>택배사</label><select id={"c-" + o.no} className="inp" value={carrier} onChange={(e) => setCarrier(e.target.value)}>{CARRIERS.map((c) => <option key={c}>{c}</option>)}</select></div>
          <div><label className="lbl" htmlFor={"t-" + o.no}>송장번호</label><input id={"t-" + o.no} className="inp num" inputMode="numeric" value={trk} aria-invalid={!!err} onChange={(e) => { setTrk(e.target.value); setErr(""); }} placeholder="숫자 10~13자리" />{err && <div className="err">{err}</div>}</div>
          <button className="btn" onClick={save}>송장 일괄 처리</button>
        </div>
      ) : <p style={{ margin: "20px 0 0", color: "var(--n7)" }}>{o.tracking ? o.carrier + " " + o.tracking + " · 채널에 전송됐어요"   : (o.state === "신규" ? "결제 확인이 끝나면 송장 대기로 바뀌어요" : "송장을 입력할 수 없는 상태예요")}</p>}
    </div>
  );
}

      </Dlg>
      <Dlg open={xl} onClose={() => setXl(false)} title="주문 엑셀 내려받기" sub={"현재 조건의 주문 " + list.length + "건 · 취소를 뺀 금액 " + won(net)}
        foot={<><button className="btn2 sm" onClick={() => setXl(false)}>닫기</button><button className="btn sm" onClick={() => { S.download("주문_최근_" + ME + ".csv", ["주문번호,채널,공구,수량,금액,상태,받는 지역", ...list.map((o) => [o.no, o.ch, dealOf(o.deal).name, o.qty, amountOf(o), o.state, o.region].join(","))].join("\n")); setXl(false); S.toast("주문 " + list.length + "건을 내려받았어요"); }}>내려받기</button></>}>

}

/* ───────── 송장 입력 ───────── */
function Invoice({ S }) {
  const p = useParams();
  const pend = S.orders.filter((o) => o.state === "송장 대기");
  const init = () => { const m = {}; pend.forEach((o) => { m[o.no] = { carrier: CARRIERS[0], tracking: "" }; }); if (p.demo) { m["SS-261117-0409"] = { carrier: "CJ대한통운", tracking: "631244090331" }; m["SL-261117-0093"] = { carrier: "롯데택배", tracking: "2538184" }; } return m; };
  const [rows, setRows] = useState(init);
  const [errs, setErrs] = useState(() => (p.demo ? { "SL-261117-0093": "송장번호는 숫자 10~13자리로 입력해 주세요" } : {}));
  const [paste, setPaste] = useState(false);
  const [txt, setTxt] = useState("SS-261117-0412\tCJ대한통운\t631244090118\nSS-261117-0409\t한진택배\t410291883801");
  useEffect(() => { setRows(init()); setErrs(p.demo ? { "SL-261117-0093": "송장번호는 숫자 10~13자리로 입력해 주세요" } : {}); setPaste(false); }, [p]);
  const set = (no, k, v) => { setRows((r) => ({ ...r, [no]: { ...(r[no] || { carrier: CARRIERS[0], tracking: "" }), [k]: v } })); setErrs((e) => ({ ...e, [no]: "" })); };
  const save = () => {
    const ok = [], bad = {};
    pend.forEach((o) => { const r = rows[o.no]; if (!r || !r.tracking) return; if (carrierOk(r.tracking)) ok.push({ no: o.no, carrier: r.carrier, tracking: r.tracking.replace(/[\s-]/g, "") }); else bad[o.no] = "송장번호는 숫자 10~13자리로 입력해 주세요"; });
    setErrs(bad);
    if (ok.length) { S.saveInvoice(ok); S.toast("송장 " + ok.length + "건을 저장했어요 · 채널 전송을 시작해요"); }
    else if (!Object.keys(bad).length) S.toast("입력한 송장번호가 없어요");
  };
  const applyPaste = () => {
    const next = { ...rows }; let n = 0;
    txt.split("\n").forEach((ln) => { const [no, c, t] = ln.split(/\t|,/).map((x) => (x || "").trim()); if (next[no] && CARRIERS.includes(c)) { next[no] = { carrier: c, tracking: t || "" }; n += 1; } });
    setRows(next); setPaste(false); S.toast(n + "줄을 채웠어요");
  };
  const done = S.orders.filter((o) => o.tracking && o.date >= "2026-11-14");
  return (
    <>
      <Band title="송장 입력" sub={"송장 대기 " + pend.length + "건 · 저장하면 판매 채널로 송장번호가 전송돼요"} right={<button className="btn2 on-deep" onClick={() => setPaste(true)}><Icon name="clipboard-paste" size={18} />엑셀에서 붙여넣기</button>} />
      <div className="rf-in"><div className="sub-card">
        <div style={{ overflowX: "auto", padding: 8 }}>
          <table className="pt" aria-label="송장 입력 표">
            <thead><tr><th>주문번호</th><th>상품</th><th className="r">수량</th><th>받는 지역</th><th>택배사</th><th>송장번호</th></tr></thead>
            <tbody>{pend.map((o) => { const r = rows[o.no] || { carrier: CARRIERS[0], tracking: "" }; return (
              <tr key={o.no}><td className="num" style={{ fontWeight: 600, whiteSpace: "nowrap" }}>{o.no}</td><td>{dealOf(o.deal).name}</td><td className="r num">{o.qty}</td><td>{o.region}</td>
                <td style={{ minWidth: 140 }}><select className="inp" aria-label={o.no + " 택배사"} value={r.carrier} onChange={(e) => set(o.no, "carrier", e.target.value)}>{CARRIERS.map((c) => <option key={c}>{c}</option>)}</select></td>
                <td style={{ minWidth: 200 }}><input className="inp num" inputMode="numeric" aria-label={o.no + " 송장번호"} aria-invalid={!!errs[o.no]} value={r.tracking} onChange={(e) => set(o.no, "tracking", e.target.value)} placeholder="숫자 10~13자리" />{errs[o.no] && <div className="err">{errs[o.no]}</div>}</td></tr>); })}
              {pend.length === 0 && <tr><td colSpan="6" data-empty style={{ padding: 32, textAlign: "center", color: "var(--n7)" }}>송장을 기다리는 주문이 없어요 · 아래에서 등록한 송장을 확인하세요</td></tr>}</tbody>
          </table>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "8px 20px 20px" }}><button className="btn" onClick={save} disabled={pend.length === 0}>송장 저장하기</button></div>
      </div>
      <div className="card" style={{ marginTop: 32, padding: 8 }}>
        <div style={{ padding: "16px 16px 4px" }}><h2 style={{ margin: 0, fontSize: 20, fontWeight: 700 }}>송장 등록 내역</h2></div>
        <div style={{ overflowX: "auto" }}><table className="pt"><thead><tr><th>주문번호</th><th>택배사</th><th>송장번호</th><th>채널</th><th>채널 전송</th></tr></thead>
          <tbody>{done.map((o) => <tr key={o.no} className={S.sent[o.no] === "전송 대기" ? "row-in" : ""}><td className="num" style={{ fontWeight: 600 }}>{o.no}</td><td>{o.carrier}</td><td className="num">{o.tracking}</td><td>{o.ch}</td><td><Pill tone={S.sent[o.no] === "전송 완료" ? "ok" : "main"}>{S.sent[o.no] || "전송 대기"}</Pill></td></tr>)}</tbody></table></div>
      </div></div>
      <div style={{ height: 64 }}></div>
      <Dlg open={paste} onClose={() => setPaste(false)} title="엑셀에서 붙여넣기" sub="주문번호, 택배사, 송장번호 순서로 한 줄씩 붙여 넣어요" foot={<><button className="btn2 sm" onClick={() => setPaste(false)}>닫기</button><button className="btn sm" onClick={applyPaste}>표에 채우기</button></>}>
        <label className="lbl" htmlFor="paste" style={{ marginTop: 16 }}>붙여넣을 내용</label><textarea id="paste" className="inp num" rows="5" value={txt} onChange={(e) => setTxt(e.target.value)}></textarea>
      </Dlg>
    </>
  );
}

/* ───────── 정산 내역 ───────── */

          </div>

<script>
