        {lr && <div><span className="x-lbl">ERP 후보</span><div className="x-card" style={{ padding: 14, background: "var(--m50)", borderColor: "var(--m600)" }}><b style={{ color: "var(--n9)" }}>{ERP_CAND[lr.it.id][0]}</b> · {ERP_CAND[lr.it.id][1]}</div><p style={{ fontSize: 13, color: "var(--n6)", marginTop: 10 }}>연결하면 다음 수신부터 현재고와 출고가 이 품목으로 들어오고 산출에 포함됩니다.</p></div>}

/* ── 발주 검증 — 지난 4주 발주일마다 담당자가 실제 넣은 수량과, 같은 재고에서 산출 규칙이 냈을 수량을 나란히 놓는다.
      재고 흐름 두 벌(실제 발주대로 · 산출 수량대로)을 같은 출고 이력으로 돌려 품절이 난 날과 보유 일수를 센다. 숫자는 전부 여기서 계산한다 ── */
const VERIFY_END = "2026-11-14";
function replayItem(it) {
  const v = vendorOf(it.vendor), r = rng(5000 + hashStr(it.id));
  const bias = 0.88 + r() * 0.28;                      /* 품목마다 넉넉히·빠듯하게 넣던 버릇 */
  const avg = sumBy(it.hist, (x) => x.qty) / 28;
  const std = Math.sqrt(sumBy(it.hist, (x) => (x.qty - avg) ** 2) / 28);
  const safety = Math.ceil(Z * std * Math.sqrt(v.lead + 1));
  const nice = it.step > 1 ? it.step : avg >= 20 ? 10 : avg >= 8 ? 5 : 1;   /* 사람은 끊어지는 수로 넣는다 */
  const start = Math.round(avg * (v.lead + 3)) + safety;
  const mk = () => ({ stock: start, arr: {}, short: 0, hold: 0 });
  const H = mk(), P = mk(), days = [];
  const pend = (X, d) => sumBy(Object.keys(X.arr).filter((k) => k > d), (k) => X.arr[k]);
  it.hist.forEach((h, i) => {
    if (h.date > VERIFY_END) return;
    [H, P].forEach((X) => { X.stock += X.arr[h.date] || 0; });
    if (v.days.includes(dayOf(h.date))) {
      let gap = 7; for (let g = 1; g <= 7; g++) if (v.days.includes(dayOf(addDays(h.date, g)))) { gap = g; break; }
      const cover = Math.min(gap + v.lead, SHELF_CAP[it.shelf]);
      const prog = (X) => { const need = avg * cover + safety - X.stock - pend(X, h.date); const raw = need <= 0 ? 0 : Math.ceil(need / it.step) * it.step; return raw > 0 ? Math.ceil(Math.max(raw, v.minQty) / it.step) * it.step : 0; };
      const last = it.hist.slice(Math.max(0, i - 6), i + 1), a7 = sumBy(last, (x) => x.qty) / last.length;
      const hNeed = a7 * cover * bias + avg * 0.75 - H.stock - pend(H, h.date);
      const human = hNeed <= 0 ? 0 : Math.max(v.minQty, Math.ceil(hNeed / nice) * nice);
      const atSame = prog(H), own = prog(P), ad = addDays(h.date, v.lead);
      days.push({ date: h.date, stock: H.stock, human, prog: atSame });
      if (human) H.arr[ad] = (H.arr[ad] || 0) + human;
      if (own) P.arr[ad] = (P.arr[ad] || 0) + own;
    }
    [H, P].forEach((X) => { if (h.qty > 0 && X.stock < h.qty) X.short++; X.stock = Math.max(0, X.stock - h.qty); X.hold += X.stock; });
  });
  const n = it.hist.filter((h) => h.date <= VERIFY_END).length;
  const sumH = sumBy(days, (d) => d.human), sumP = sumBy(days, (d) => d.prog);
  const diff = sumH ? Math.round(((sumP - sumH) / sumH) * 100) : 0;
  const close = days.filter((d) => Math.abs(d.prog - d.human) <= Math.max(nice, d.human * 0.1)).length;
  const holdH = Math.round((H.hold / n / Math.max(avg, 0.1)) * 10) / 10, holdP = Math.round((P.hold / n / Math.max(avg, 0.1)) * 10) / 10;
  const verdict = P.short > H.short || Math.abs(diff) > 20 ? "확인 필요" : P.short < H.short ? "품절 줄어듦" : "비슷함";
  return { it, v, days, sumH, sumP, diff, close, shortH: H.short, shortP: P.short, holdH, holdP, verdict };
}
const REPLAY = ITEMS.filter((i) => i.erp).map(replayItem);
const VERDICT_CLS = { "확인 필요": "warn", "품절 줄어듦": "ok", "비슷함": "" };
const JUDGE = ["산출 수량이 맞음", "현장 판단이 맞음 — 규칙을 고쳐야 함", "그때만의 사정(행사·품절 통보)"];

function Verify({ st, set, toast }) {
  const p = useParams();
  const [f, setF] = useState(p.f || "all");
  const [sel, setSel] = useState(p.item || null);
  const [memo, setMemo] = useState("");
  useEffect(() => { setF(p.f || "all"); setSel(p.item || null); }, [p]);
  const list = REPLAY.filter((x) => f === "all" || x.verdict === "확인 필요").slice().sort((a, b) => (b.verdict === "확인 필요") - (a.verdict === "확인 필요") || Math.abs(b.diff) - Math.abs(a.diff));
  const cur = REPLAY.find((x) => x.it.id === sel) || list[0];
  const orders = sumBy(REPLAY, (x) => x.days.length), close = sumBy(REPLAY, (x) => x.close);
  const shortH = sumBy(REPLAY, (x) => x.shortH), shortP = sumBy(REPLAY, (x) => x.shortP);
  const holdH = Math.round((sumBy(REPLAY, (x) => x.holdH) / REPLAY.length) * 10) / 10, holdP = Math.round((sumBy(REPLAY, (x) => x.holdP) / REPLAY.length) * 10) / 10;
  const need = REPLAY.filter((x) => x.verdict === "확인 필요").length;
  const keep = (extra = {}) => ({ ...(f !== "all" ? { f } : {}), ...extra });
  const j = cur && st.judge[cur.it.id];
  useEffect(() => { setMemo(j ? j.memo : ""); }, [cur && cur.it.id]);
  const record = (what) => { set((s) => ({ ...s, judge: { ...s.judge, [cur.it.id]: { what, memo: memo.trim(), at: mdw(TODAY) } } })); toast(cur.it.name + " 판단을 기록했습니다 · " + what); };
  const sign = (n) => (n > 0 ? "+" + n : String(n));
  return (
    <>
      <Head title="발주 검증" sub={"지난 4주(" + md(ITEMS[0].hist[0].date) + "~" + md(VERIFY_END) + ") 발주일마다, 담당자가 실제로 넣은 수량과 같은 재고에서 산출 규칙이 낸 수량을 나란히 놓았습니다."}
        right={<div className="flex gap-2" role="group" aria-label="보기">{[["all", "전체 " + REPLAY.length + "개"], ["need", "확인 필요 " + need + "개"]].map(([k, l]) => <button key={k} className="x-chip" aria-pressed={f === k} onClick={() => go("verify", k === "all" ? {} : { f: k })}>{l}</button>)}</div>} />
      <div className="x-kpi mb-5 x-rise">
        <div><b>{orders}건</b><span>비교한 발주(품목 × 발주일)</span></div>
        <div><b>{Math.round((close / orders) * 100)}%</b><span>수량 차이 10% 안쪽 · {close}건</span></div>
        <div><b>{shortH}일 · {shortP}일</b><span>재고가 모자랐던 날 · 실제 발주 · 산출대로</span></div>
        <div><b>{holdH}일 · {holdP}일</b><span>평균 보유 재고(출고 일수) · 실제 · 산출대로</span></div>
      </div>
      <div className="x-split">
        <div className="x-card" style={{ padding: "8px 8px 4px" }}><div className="x-sc"><table className="x-tbl x-vt">
          <thead><tr><Th>품목</Th><th className="hm">매입처</th><th className="n hm">실제 발주 합계</th><th className="n hm">산출 합계</th><Th n>차이</Th><Th n>모자란 날</Th><Th>판정</Th></tr></thead>
          <tbody>{list.map((x) => (
            <tr key={x.it.id} data-row aria-selected={cur && cur.it.id === x.it.id} onClick={() => go("verify", keep({ item: x.it.id }))}>
              <td style={{ fontWeight: 600 }}>{x.it.name}</td><td className="hm">{x.v.name}</td><td className="n hm">{x.sumH} {x.it.unit}</td><td className="n hm">{x.sumP} {x.it.unit}</td><td className="n" style={{ fontWeight: 700 }}>{sign(x.diff)}%</td><td className="n">{x.shortH}일 · {x.shortP}일</td>
              <td><Pill s={x.verdict} cls={VERDICT_CLS[x.verdict]} />{st.judge[x.it.id] && <span className="x-pill" style={{ marginLeft: 6 }}>기록함</span>}</td>
            </tr>))}
            {list.length === 0 && <tr><td colSpan="7" data-empty>확인이 필요한 품목이 없습니다.</td></tr>}</tbody></table></div></div>
        {cur && (
          <aside className="x-card x-pad x-rise" aria-label="발주일별 비교" style={{ position: "sticky", top: "calc(var(--look-bar-h) + var(--c-nav-h) + 16px)" }}>
            <div className="flex items-start justify-between gap-3">
              <div><p className="x-lbl" style={{ marginBottom: 2 }}>발주일별 비교</p><h2 style={{ fontSize: "var(--t-section)", fontWeight: 700, color: "var(--n9)" }}>{cur.it.name}</h2><p className="x-sub" style={{ fontSize: "var(--c-small)", marginTop: 2 }}>{cur.v.name} · {daysLabel(cur.v.days)} 발주 · 발주 {cur.days.length}회</p></div>
              <Pill s={cur.verdict} cls={VERDICT_CLS[cur.verdict]} />
            </div>
            <div className="x-cmp mt-4"><div><b>{cur.shortH}일 · {cur.shortP}일</b><span>재고가 모자랐던 날(실제 · 산출)</span></div><div><b>{cur.holdH}일 · {cur.holdP}일</b><span>보유 재고 일수(실제 · 산출)</span></div></div>
            <div className="x-sc mt-3" style={{ maxHeight: 300, overflowY: "auto" }}><table className="x-tbl"><thead><tr><Th>발주일</Th><th className="n hm">그때 재고</th><Th n>실제</Th><Th n>산출</Th><Th n>차이</Th></tr></thead>
              <tbody>{cur.days.map((d) => <tr key={d.date}><td>{mdw(d.date)}</td><td className="n hm">{d.stock}</td><td className="n">{d.human}</td><td className="n" style={{ fontWeight: 700 }}>{d.prog}</td><td className="n">{sign(d.prog - d.human)}</td></tr>)}</tbody></table></div>

              <div className="mt-3 flex flex-wrap gap-2">{JUDGE.map((w, i) => <button key={w} className={i === 0 ? "x-btn2" : "x-btn2"} aria-pressed={!!j && j.what === w} style={j && j.what === w ? { borderColor: "var(--m600)", boxShadow: "inset 0 0 0 1px var(--m600)" } : undefined} onClick={() => record(w)}>{w}</button>)}</div>

            </div>
          </aside>

      </div>
    </>

function App() {

  const calc = (date, o = {}) => calcAll(date, { adj: st.adj, vend: st.vend, shelf: st.shelf, mapped: st.mapped, ...o }).map((r) => { const ov = date === TODAY && r.status === "발주" ? st.ovr[r.it.id] : null; return ov ? { ...r, qty: ov.qty, ovr: ov } : r; });
  const r = NAV.some(([k]) => k === route) ? route : "main";
  const props = { st, set: setSt, calc, toast };
  const page = { main: <Today {...props} />, safety: <Safety {...props} />, vendors: <Vendors {...props} />, items: <Items {...props} />, orders: <Orders {...props} />, verify: <Verify {...props} />, sync: <Sync {...props} /> }[r];

}

var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
