}

/* ── 견적서 발송 ── */
const mailRowsOf = (st) => [...st.mailExtra, ...DB.mail.map(m => ({ ...m }))].sort((a, b) => a.ago - b.ago || String(b.t || '').localeCompare(String(a.t || ''))).slice(0, 10);

  const p = useParams(); const st = useSt();
  const list = allQuotes(st).filter(q => ['발송 대기', '발송 완료'].includes(statusOf(q, st)) || (st.mailExtra.some(m => m.qid === q.id)));
  const sel = allQuotes(st).find(q => q.id === p.q) || DB.qById['Q-2611-115'];
  const c = custOf(sel), d = sel.calc, s = statusOf(sel, st);
  const [to, setTo] = useState(c.mail); const [subject, setSubject] = useState('');
  useEffect(() => { setTo(c.mail); setSubject('[소담린넨] ' + c.name + ' 침구 렌탈 견적서 (' + sel.id + ')'); }, [sel.id]);
  const approved = ['발송 대기', '발송 완료'].includes(s);
  const lastFail = mailRowsOf(st).find(m => m.qid === sel.id && !m.ok);

  const vat = Math.round(d.rev * 0.1);
  const rows = mailRowsOf(st);
  const cols = [
    { h: '일시', r: m => <span className="tnum">{DB.md(DB.ago(m.ago))} {m.extra ? '10:32' : m.t}</span> },
    { h: '견적', r: m => <span className="tnum">{m.qid}</span> },
    { h: '고객', r: m => custOf(DB.qById[m.qid] || sel).name },
    { h: '결과', r: m => m.ok ? <Pill tone="ok">성공</Pill> : <Pill tone="danger">실패</Pill> },
    { h: '사유', r: m => m.ok ? <span className="text-[var(--n6)]">–</span> : <span className="text-[var(--n8)]">{m.reason}</span> },
    { h: '', r: m => !m.ok ? <button className={btnS} onClick={() => { go('send', { q: m.qid }); toast(m.reason + ' 확인 후 아래에서 다시 발송해 주세요', 'warn'); }}>재발송</button> : null },
  ];
  return (
    <>
      <PageTitle title="견적서 발송" sub="승인된 견적서를 확인하고 메일로 보냅니다." />
      <div className="grid items-start gap-4 xl:grid-cols-[300px_1fr_340px]">
        <Sect title={'승인된 견적 ' + list.length + '건'}>
          <ul className="px-3 pb-3 space-y-1.5 xl:max-h-[452px] xl:overflow-y-auto">{list.map(q => { const on = q.id === sel.id; return <li key={q.id}><button onClick={() => go('send', { q: q.id })} aria-selected={on} className={cx("w-full text-left rounded-[var(--r-panel)] border px-3 py-2.5", on ? "border-[var(--m700)] bg-[var(--m50)]" : "border-[var(--n3)] hover:border-[var(--n5)]")}>
            <div className="flex justify-between"><span className="tnum text-[length:var(--c-small)] text-[var(--n7)]">{q.id}</span><Pill tone={STATUS_TONE[statusOf(q, st)]}>{statusOf(q, st)}</Pill></div>
            <div className="font-semibold text-[var(--n10)]">{custOf(q).name}</div><div className="tnum text-[var(--n8)]">{money(q.calc.rev)}</div></button></li>; })}</ul>
        </Sect>
        <Sect title="견적서 미리보기" right={<Pill tone={approved ? 'ok' : 'gray'}>{approved ? '승인 완료' : '승인 전'}</Pill>}>
          <div className="px-5 pb-5"><div className="rounded-[var(--r-panel)] border border-[var(--n4)] bg-[var(--n0)] p-6">
            <div className="flex justify-between items-start"><div><div className="text-[22px] font-semibold text-[var(--n10)] tracking-[-0.03em]">견적서</div><div className="mt-1 tnum text-[var(--n7)]">{sel.id} · {DB.ymd(DB.ago(sel.createdAgo))}</div></div><div className="text-right text-[var(--n8)]"><div className="font-semibold text-[var(--n10)]">소담린넨</div><div>침구 렌탈·세탁</div></div></div>
            <div className="mt-4 text-[var(--n9)]"><span className="font-semibold">{c.name}</span> {c.contact}님 귀하 · 대여 {sel.months || 1}개월 · {sel.region || '서울'} 배송</div>
            <div className="mt-3 overflow-x-auto"><table className="w-full text-left"><thead><tr className="text-[length:var(--c-small)] text-[var(--n7)] border-b border-[var(--n4)]"><th className="py-1.5 font-medium">품목</th><th className="py-1.5 font-medium text-right">수량</th><th className="py-1.5 font-medium text-right">금액</th></tr></thead>
              <tbody>{d.lines.map(l => <tr key={l.key} className="border-b border-[var(--n3)]"><td className="py-1.5">{l.name}<span className="sr-only"> {sel.id}</span></td><td className="py-1.5 text-right tnum">{l.key === 'transport' ? '1식' : fmtNum(l.qty) + '세트'}</td><td className="py-1.5 text-right tnum">{money(l.rev)}</td></tr>)}</tbody></table></div>
            <dl className="mt-3 ml-auto max-w-[260px] grid grid-cols-2 gap-y-1 text-right"><dt className="text-left text-[var(--n7)]">공급가액</dt><dd className="tnum">{money(d.rev)}</dd><dt className="text-left text-[var(--n7)]">부가세</dt><dd className="tnum">{money(vat)}</dd><dt className="text-left font-semibold text-[var(--n10)]">합계</dt><dd className="tnum font-semibold text-[var(--n10)]">{money(d.rev + vat)}</dd></dl>
            <p className="mt-3 text-[length:var(--c-small)] text-[var(--n7)]">견적 유효기간은 발행일부터 14일입니다.</p>
          </div></div>
        </Sect>
        <Sect title="메일 보내기">
          <div className="px-5 pb-5 space-y-3">
            {lastFail && <div className="rounded-[var(--r-panel)] bg-[var(--s2-bg)] text-[var(--s2-text)] p-3 flex gap-2"><Icon name="triangle-alert" size={16} /><span>직전 발송이 실패했습니다 — {lastFail.reason}. {lastFail.note}</span></div>}
            <Field label="받는 사람"><input className={inputC} value={to} onChange={e => setTo(e.target.value)} /></Field>
            <Field label="제목"><textarea aria-label="메일 제목" rows={2} className={inputC} style={{ height: 64, paddingTop: 8, paddingBottom: 8, lineHeight: 1.5, resize: 'none' }} value={subject} onChange={e => setSubject(e.target.value)} /></Field>
            <Field label="본문"><textarea className={cx(inputC, "h-24 py-2 leading-relaxed")} defaultValue={c.contact + '님, 요청하신 침구 렌탈 견적서를 보내 드립니다. 검토 후 궁금한 점은 회신 부탁드립니다.'} key={sel.id} /></Field>
            <button className={cx(btnP, "w-full")} disabled={!approved || !to.includes('@')} onClick={() => doSend()}><Icon name="send" size={15} />{lastFail ? '다시 발송' : s === '발송 완료' ? '한 번 더 발송' : '견적서 발송'}</button>

      </div>
      <Sect title="최근 발송 이력" className="mt-4" right={<span className="text-[length:var(--c-small)] text-[var(--n7)]">성공 {rows.filter(m => m.ok).length} · 실패 {rows.filter(m => !m.ok).length}</span>}>
        <div className="px-2 pb-2"><DataTable cols={cols} rows={rows} rowKey={m => m.qid + m.ago + m.ok + (m.extra ? 'x' : '')} /></div>
      </Sect>
    </>
  );
}

/* ── 주문 진행(알림톡) ── */
const TALK = ['[소담린넨] #{고객명}님, 견적 문의가 접수되었습니다. 접수번호 #{견적번호}', '[소담린넨] 주문이 확정되었습니다. 대여기간 #{기간}', '[소담린넨] 내일 #{지역}으로 침구가 출고됩니다. 수령 담당자를 확인해 주세요.', '[소담린넨] 침구 배송이 완료되었습니다. 수량을 확인해 주세요.', '[소담린넨] 회수일이 3일 남았습니다. 회수 가능 시간을 알려 주세요.', '[소담린넨] 침구 회수가 완료되었습니다. 이용해 주셔서 감사합니다.'];
function Orders() {
  const p = useParams(); const st = useSt();
  const sel = DB.orders.find(o => o.qid === p.open) || DB.orders[2];
  const [stage, setStage] = useState(p.stage != null ? Number(p.stage) : null);
  useEffect(() => { setStage(p.stage != null ? Number(p.stage) : null); }, [p]);
  const q = sel.q, c = custOf(q);
  const rec = (o, k) => DB.talkAll.find(t => t.qid === o.qid && t.stage === k);
  const okOf = (o, k) => { const r = rec(o, k); return r && (r.ok || st.talkOk[o.qid + k]); };
  const failN = (o) => DB.talkAll.filter(t => t.qid === o.qid && !t.ok && !st.talkOk[t.qid + t.stage]).length;
  const cols = [
    { h: '견적', r: o => <span className="tnum font-medium text-[var(--n10)]">{o.qid}</span> },
    { h: '고객', r: o => custOf(o.q).name },
    { h: '대여', r: o => (o.q.months) + '개월' },
    { h: '진행', r: o => <Pill tone="accent">{DB.STAGES[o.stage]}</Pill> },
    { h: '알림톡', r: o => failN(o) ? <Pill tone="danger">실패 {failN(o)}건</Pill> : <Pill tone="ok">정상</Pill> },
  ];
  const stageDate = (o, k) => { const a = o.q.ago - o.off[k]; return DB.md(DB.ago(a)); };
  const talks = DB.talkAll.filter(t => t.qid === sel.qid).sort((a, b) => a.stage - b.stage);
  const retry = DB.talkAll.filter(t => !t.ok && !st.talkOk[t.qid + t.stage]);
  const resend = (t) => { upd(x => { x.talkOk[t.qid + t.stage] = true; }); toast('알림톡을 다시 보냈습니다'); };
  const filled = (k) => TALK[k].replace('#{고객명}', c.contact).replace('#{견적번호}', q.id).replace('#{기간}', q.months + '개월').replace('#{지역}', q.region);
  return (
    <>
      <PageTitle title="주문 진행" sub="확정된 주문의 단계마다 고객 알림톡이 나갔는지 확인합니다." />
      <div className="grid items-start gap-4 xl:grid-cols-[1fr_1.1fr]">
        <Sect title={'확정 주문 ' + DB.orders.length + '건'}><div className="px-2 pb-2"><DataTable cols={cols} rows={DB.orders} rowKey={o => o.qid} selected={sel.qid} onRow={o => go('orders', { open: o.qid })} /></div></Sect>
        <Sect title={'다시 보낼 알림톡 ' + retry.length + '건'} className="xl:col-start-1 xl:row-start-2">
          {retry.length === 0 ? <p className="px-5 pb-5 text-[var(--s1-text)] flex items-center gap-1.5"><Icon name="circle-check" size={15} />실패한 알림톡이 없습니다.</p> :
          <ul className="px-5 pb-4 divide-y divide-[var(--n3)]">{retry.map(t => { const o = DB.orders[t.oi]; return (
            <li key={t.qid + t.stage} className="py-2.5 flex flex-wrap items-center justify-between gap-x-3 gap-y-1.5">
              <button className="text-left min-w-0" onClick={() => go('orders', { open: t.qid, stage: String(t.stage) })}><span className="block font-medium text-[var(--n10)]">{custOf(o.q).name} <span className="tnum font-normal text-[var(--n7)]">{t.qid}</span></span><span className="block text-[length:var(--c-small)] text-[var(--n7)]">{DB.STAGES[t.stage]} 알림 · <span className="tnum">{DB.md(DB.ago(t.ago))} {t.t}</span> · {t.reason}</span></button>
              <button className={btnS} onClick={() => resend(t)}><Icon name="rotate-cw" size={14} />다시 보내기</button>
            </li>); })}</ul>}
        </Sect>
        <Sect title={c.name + ' · ' + sel.qid} className="xl:col-start-2 xl:row-start-1 xl:row-span-2" right={<span className="tnum text-[var(--n7)]">{money(q.calc.rev)}</span>}>
          <dl className="mx-5 mb-4 rounded-[var(--r-panel)] bg-[var(--n2)] p-3 grid grid-cols-[72px_1fr] gap-x-3 gap-y-1.5">
            <dt className="text-[var(--n7)]">품목</dt><dd className="text-[var(--n10)]">{itemsText(q.items)}</dd>
            <dt className="text-[var(--n7)]">대여</dt><dd>{q.months}개월 · {q.region} 배송 · 받는 분 {c.contact}</dd>
            <dt className="text-[var(--n7)]">출고·회수</dt><dd className="tnum">{DB.ymd(DB.ago(sel.shipAgo))} 출고 · {DB.ymd(DB.ago(sel.backAgo))} 회수{sel.backAgo < 0 ? ' 예정' : ''}</dd>
          </dl>
          <ol className="px-5 pb-4">{DB.STAGES.map((nm, k) => {
            const reached = k <= sel.stage, r = rec(sel, k), ok = okOf(sel, k), on = stage === k;
            return (
              <li key={k} className="relative pl-9 pb-4 last:pb-0">
                {k < 5 && <span className="absolute left-[13px] top-7 bottom-0 w-px bg-[var(--n4)]" />}
                <span className={cx("absolute left-0 top-0 grid place-items-center h-7 w-7 rounded-full", reached ? (ok ? "bg-[var(--s1)] text-[var(--n0)]" : "bg-[var(--s2)] text-[var(--n0)]") : "bg-[var(--n3)] text-[var(--n7)]")}><Icon name={reached ? (ok ? 'check' : 'x') : 'clock'} size={14} /></span>
                <button className="w-full text-left flex flex-wrap items-center justify-between gap-2" aria-pressed={on} onClick={() => setStage(on ? null : k)}>
                  <span className="font-semibold text-[var(--n10)]">{nm}</span>
                  <span className="flex items-center gap-2"><span className="tnum text-[length:var(--c-small)] text-[var(--n7)]">{reached ? stageDate(sel, k) : '예정 ' + DB.md(DB.ago(q.ago - sel.off[k]))}</span>{reached ? (ok ? <Pill tone="ok">발송 성공</Pill> : <Pill tone="danger">발송 실패</Pill>) : <Pill>예정</Pill>}</span>
                </button>
                {on && <div className="mt-2 rounded-[var(--r-panel)] bg-[var(--n2)] p-3">
                  <div className="text-[length:var(--c-small)] text-[var(--n7)] mb-1">알림톡 문구</div><div className="text-[var(--n9)] leading-relaxed">{filled(k)}</div>
                  {reached && r && !ok && <div className="mt-2 flex items-center justify-between gap-2"><span className="text-[var(--s2-text)]">실패 사유 · {r.reason}</span><button className={btnS} onClick={() => { upd(x => { x.talkOk[sel.qid + k] = true; }); toast('알림톡을 다시 보냈습니다'); }}>다시 보내기</button></div>}
                  {!reached && <div className="mt-2 text-[var(--n7)]">해당 시점이 되면 자동으로 발송됩니다.</div>}
                </div>}
              </li>);
          })}</ol>
          <div className="px-5 pb-5">
            <div className="flex items-center justify-between pt-3 pb-1 border-t border-[var(--n3)]"><h3 className="font-semibold text-[var(--n10)]">알림톡 발송 내역 {talks.length}건</h3><span className="text-[length:var(--c-small)] text-[var(--n7)]">성공 {talks.filter(t => t.ok || st.talkOk[t.qid + t.stage]).length} · 실패 {talks.filter(t => !t.ok && !st.talkOk[t.qid + t.stage]).length}</span></div>
            <ul className="divide-y divide-[var(--n3)]">{talks.map(t => { const re = !t.ok && st.talkOk[t.qid + t.stage]; return (
              <li key={t.stage} className="py-2 flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
                <span className="min-w-0"><span className="font-medium text-[var(--n10)]">{DB.STAGES[t.stage]}</span> <span className="tnum text-[length:var(--c-small)] text-[var(--n7)]">{DB.md(DB.ago(t.ago))} {t.t} · {c.contact}님</span>{!t.ok && <span className="block text-[length:var(--c-small)] text-[var(--n7)]">{re ? '처음 발송 실패(' + t.reason + ') 뒤 다시 보냄' : '실패 사유 · ' + t.reason}</span>}</span>
                <span className="flex items-center gap-2">{t.ok ? <Pill tone="ok">성공</Pill> : re ? <Pill tone="ok">재발송 성공</Pill> : <><Pill tone="danger">실패</Pill><button className={btnS} onClick={() => resend(t)}><Icon name="rotate-cw" size={14} />다시 보내기</button></>}</span>
              </li>); })}</ul>
          </div>
        </Sect>
      </div>
    </>
  );
}

/* ── 고객·거래 이력 ── */
function History() {
  const st = useSt();
  const [qs, setQs] = useState(''); const [reg, setReg] = useState('전체'); const [selId, setSelId] = useState(0); const [open, setOpen] = useState(false);

  const c = DB.customers[selId];

            <ul className="mt-2 divide-y divide-[var(--n3)]">{hist.map(q => <li key={q.id} className="py-2.5 flex items-center justify-between gap-3"><div className="min-w-0"><div className="tnum font-medium text-[var(--n10)]">{q.id}</div><div className="text-[length:var(--c-small)] text-[var(--n7)]">{DB.ymd(DB.ago(q.createdAgo))} · {itemsText(q.items)}</div></div><div className="text-right shrink-0"><div className="tnum whitespace-nowrap">{money(q.calc.rev)}</div><Pill tone={STATUS_TONE[statusOf(q, st)]}>{statusOf(q, st)}</Pill></div></li>)}</ul>

        <div className="grid grid-cols-2 gap-3"><div className="col-span-2"><Field label="품목"><select className={inputC} value={pid} onChange={e => setPid(e.target.value)}>{DB.products.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></Field></div>
          <Field label="수량(세트)"><input type="number" min="1" className={inputC} value={nq} onChange={e => setNq(Math.max(1, Number(e.target.value) || 1))} /></Field>
          <Field label="대여기간(개월)"><input type="number" min="1" className={inputC} value={nm} onChange={e => setNm(Math.max(1, Number(e.target.value) || 1))} /></Field></div>
        <div className="mt-4 rounded-[var(--r-panel)] bg-[var(--n2)] p-3 grid grid-cols-2 gap-y-1"><span className="text-[var(--n7)]">추천 견적가</span><span className="text-right tnum font-semibold">{money(draft.rev)}</span><span className="text-[var(--n7)]">예상 이익률</span><span className="text-right tnum">{pct(draft.margin)}</span></div>

/* ── 단가·가용수량 ── */

  const p0 = P[pid]; const days = [0, 1, 2, 3, 4, 5, 6].map(d => ({ d, a: DB.availOn(pid, d), ev: DB.events.filter(e => e.pid === pid && e.day === d) }));

          <select aria-label="분류" className={cx(inputC, "w-[120px] h-9")} value={cat} onChange={e => setCat(e.target.value)}><option>전체</option><option>침구</option><option>베개·패드</option><option>타월·기타</option></select></div>}>

/* ── 초안 검증 ── */
const parseItems = (s) => s.split(' ').map(t => ({ pid: t[0], qty: Number(t.slice(1)) }));
const PAST = DB.quotes.filter(q => q.status === '완료').slice(0, 8).map(q => { const ai = DB.calcLines(parseItems(q.aiSpec[0]), q.months, q.region, q.aiSpec[1]); return { q, ai, diff: ai.rev - q.calc.rev }; });
const diffRows = (x) => { const keys = [...new Set([...x.q.calc.lines.map(l => l.key), ...x.ai.lines.map(l => l.key)])]; return keys.map(k => { const a = x.q.calc.lines.find(l => l.key === k), b = x.ai.lines.find(l => l.key === k); return { key: k, name: (a || b).name, a, b, d: (b ? b.rev : 0) - (a ? a.rev : 0) }; }); };
const SEED = () => { const o = [...PAST].sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)); return [1, 2].map((n, i) => { const x = o[n + 1]; const r = diffRows(x).find(r => r.d !== 0); return r ? { qid: x.q.id, key: r.key, name: r.name, d: r.d, pick: i ? '실제 유지' : '기준 보정', why: i ? '현장 협의로 정한 단가라 그대로 둠' : '수량 구간별 할인 기준을 6%로 조정', ago: 3 + i } : null; }).filter(Boolean); };
function Verify() {
  const p = useParams(); const st = useSt();
  const sorted = [...PAST].sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  const sel = PAST.find(x => x.q.id === p.open) || sorted[0];
  const rows = diffRows(sel); const recs = st.records || SEED();
  const [pick, setPick] = useState({}); const [why, setWhy] = useState({});
  useEffect(() => { setPick({}); setWhy({}); }, [sel.q.id]);
  const same = PAST.filter(x => x.diff === 0).length;
  const cols = [
    { h: '기관', r: x => <span className="font-medium text-[var(--n10)]">{custOf(x.q).name}</span> },
    { h: '실제 견적가', right: true, r: x => money(x.q.calc.rev) }, { h: '초안가', right: true, r: x => money(x.ai.rev) },
    { h: '차이', right: true, r: x => x.diff === 0 ? <Pill tone="ok">일치</Pill> : <span className={x.diff > 0 ? "text-[var(--n9)]" : "text-[var(--s2-text)]"}>{(x.diff > 0 ? '+' : '−') + money(Math.abs(x.diff))}</span> },
  ];
  const save = (r) => { upd(x => { x.records = [{ qid: sel.q.id, key: r.key, name: r.name, d: r.d, pick: pick[r.key], why: why[r.key] || '사유 없음', ago: 0 }, ...(x.records || SEED())]; }); toast(r.name + ' 판단을 기록했습니다'); };
  return (
    <>
      <PageTitle title="초안 검증" sub="과거 실제 견적과 같은 문의에서 만든 초안을 나란히 놓고, 다른 곳마다 어느 쪽이 맞는지 기록합니다." right={<div className="text-[var(--n8)]">{PAST.length}건 중 일치 {same}건 · 차이 큰 순</div>} />
      <div className="grid items-start gap-4 xl:grid-cols-[1fr_1.3fr]">
        <div className="space-y-4 min-w-0">
        <Sect title="과거 실제 견적"><div className="px-2 pb-2"><DataTable cols={cols} rows={sorted} rowKey={x => x.q.id} selected={sel.q.id} onRow={x => go('verify', { open: x.q.id })} /></div></Sect>
        <Sect title={'판단 기록 ' + recs.length + '건'} ><ul className="px-5 pb-4 divide-y divide-[var(--n3)]">{recs.map((r, i) => <li key={i} className="py-2.5 grid gap-1 md:grid-cols-[96px_1fr_auto_48px] md:items-center"><span className="tnum text-[var(--n8)]">{r.qid}</span><span><span className="font-medium text-[var(--n10)]">{r.name}</span> <span className="text-[var(--n7)]">· {r.why}</span></span><span><Pill tone={r.pick === '기준 보정' ? 'warn' : 'gray'}>{r.pick}</Pill></span><span className="tnum text-[length:var(--c-small)] text-[var(--n7)] md:text-right">{r.ago ? DB.md(DB.ago(r.ago)) : '오늘'}</span></li>)}</ul></Sect>
        </div>
        <Sect title={custOf(sel.q).name + ' · ' + sel.q.id} right={<span className="tnum text-[var(--n7)]">{DB.ymd(DB.ago(sel.q.createdAgo))}</span>}>
          <div className="px-2 pb-2"><div className="hidden md:block overflow-x-auto"><table className="w-full text-left"><thead><tr className="text-[length:var(--c-small)] text-[var(--n7)] border-b border-[var(--n3)]"><th className="px-3 py-2 font-medium">항목</th><th className="px-3 py-2 font-medium text-right">실제 수량·금액</th><th className="px-3 py-2 font-medium text-right">초안 수량·금액</th><th className="px-3 py-2 font-medium text-right">차이</th></tr></thead>
            <tbody>{rows.map(r => <tr key={r.key} className="border-b border-[var(--n3)] last:border-0"><td className="px-3 py-2.5 font-medium text-[var(--n10)]">{r.name}</td><td className="px-3 py-2.5 text-right tnum">{r.a ? (r.a.key === 'transport' ? '1식' : fmtNum(r.a.qty) + '세트') + ' · ' + money(r.a.rev) : <span className="text-[var(--n6)]">없음</span>}</td><td className="px-3 py-2.5 text-right tnum">{r.b ? (r.b.key === 'transport' ? '1식' : fmtNum(r.b.qty) + '세트') + ' · ' + money(r.b.rev) : <span className="text-[var(--n6)]">없음</span>}</td><td className="px-3 py-2.5 text-right tnum">{r.d === 0 ? <span className="text-[var(--n6)]">–</span> : (r.d > 0 ? '+' : '−') + money(Math.abs(r.d))}</td></tr>)}</tbody></table></div>
            <ul className="md:hidden divide-y divide-[var(--n3)]">{rows.map(r => <li key={r.key} className="px-4 py-3"><div className="font-semibold text-[var(--n10)]">{r.name}</div><div className="mt-1 grid grid-cols-2 gap-1 text-[length:var(--c-small)]"><span className="text-[var(--n7)]">실제 {r.a ? money(r.a.rev) : '없음'}</span><span className="text-[var(--n7)]">초안 {r.b ? money(r.b.rev) : '없음'}</span></div></li>)}</ul></div>
          <div className="px-5 pb-5">
            <div className="flex items-center justify-between py-3 border-t border-[var(--n3)]"><span className="font-semibold text-[var(--n10)]">합계</span><span className="tnum">실제 {money(sel.q.calc.rev)} · 초안 {money(sel.ai.rev)}</span></div>
            {rows.filter(r => r.d !== 0).length === 0 ? <p className="text-[var(--s1-text)] flex items-center gap-1.5"><Icon name="circle-check" size={15} />모든 항목이 같습니다. 판단할 것이 없습니다.</p> : rows.filter(r => r.d !== 0).map(r => (
              <div key={r.key} className="mt-2 rounded-[var(--r-panel)] border border-[var(--n3)] p-3">
                <div className="flex items-center justify-between gap-2 mb-2"><span className="font-medium text-[var(--n10)]">{r.name} 차이 {(r.d > 0 ? '+' : '−') + money(Math.abs(r.d))}</span></div>
                <div className="flex flex-wrap gap-1.5" role="group" aria-label={r.name + ' 판단'}>{['초안 채택', '실제 유지', '기준 보정'].map(o => <button key={o} aria-pressed={pick[r.key] === o} onClick={() => setPick(x => ({ ...x, [r.key]: o }))} className={cx("h-8 px-3 rounded-full border text-[length:var(--c-body)]", pick[r.key] === o ? "border-[var(--m700)] bg-[var(--m50)] text-[var(--m800)] font-semibold" : "border-[var(--n4)] text-[var(--n8)]")}>{o}</button>)}</div>
                <div className="mt-2 flex gap-2"><input aria-label={r.name + ' 사유'} className={cx(inputC, "h-9")} placeholder="사유를 한 줄로 남깁니다" value={why[r.key] || ''} onChange={e => setWhy(x => ({ ...x, [r.key]: e.target.value }))} /><button className={btnS} disabled={!pick[r.key]} onClick={() => save(r)}>기록</button></div>
              </div>))}
          </div>
        </Sect>
      </div>
    </>
  );
}

function tourIsOpen(){return !!document.querySelector('[aria-current="step"]')||document.body.classList.contains('hk-tour-open');}
function bar(){return document.querySelector('[data-house="demobar"]');}
function tourBtn(){var b=bar();if(!b)return null;var els=b.querySelectorAll('button,a');for(var i=0;i<els.length;i++){if(/\uC2DC\uC5F0\s*\uC548\uB0B4/.test(els[i].textContent||''))return els[i];}return null;}
function stackH(){var h=0,b=bar();if(b)h+=b.getBoundingClientRect().height;var hs=document.querySelectorAll('header,nav');for(var i=0;i<hs.length;i++){var e=hs[i];if(b&&b.contains(e))continue;var cs=getComputedStyle(e);if(cs.position==='sticky'||cs.position==='fixed'){var r=e.getBoundingClientRect();if(r.top<=(b?b.getBoundingClientRect().height+2:2)&&r.height<200){h+=r.height;break;}}}return Math.round(h)+12;}
function setPad(){try{document.documentElement.style.setProperty('--demo-chrome-h',stackH()+'px');}catch(e){}}
var tries=0;(function wait(){var btn=tourBtn();if(!btn){if(++tries<40)return setTimeout(wait,250);return;}setPad();window.addEventListener('resize',setPad);
if(navigator.webdriver||/[?&]still=1/.test(location.search)||FROM_TOUR||location.hash==='#tour')return;
var seen=false;try{seen=localStorage.getItem(KEY)==='1';}catch(e){}if(seen)return;
setTimeout(function(){show(btn);},1200);})();
function show(btn){
if(!document.body.contains(btn)||tourIsOpen())return;
var tip=document.createElement('div');tip.className='demo-hint';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','\uC2DC\uC5F0 \uC548\uB0B4 \uB3C4\uC6C0\uB9D0');
var arrow=document.createElement('span');arrow.className='demo-hint-arrow';tip.appendChild(arrow);
var t=document.createElement('b');t.textContent='\uCC98\uC74C \uC624\uC168\uB098\uC694?';tip.appendChild(t);
var p=document.createElement('div');p.textContent="'\uC2DC\uC5F0 \uC548\uB0B4'\uB97C \uB204\uB974\uBA74 \uC774 \uD654\uBA74\uC758 \uC8FC\uC694 \uAE30\uB2A5\uC744 \uB2E8\uACC4\uBCC4\uB85C \uC9C1\uC811 \uB20C\uB7EC \uBCF4\uBA70 \uD655\uC778\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694.";tip.appendChild(p);
var row=document.createElement('div');row.className='demo-hint-row';var ok=document.createElement('button');ok.type='button';ok.textContent='\uC54C\uACA0\uC5B4\uC694';row.appendChild(ok);tip.appendChild(row);
document.body.appendChild(tip);btn.classList.add('demo-hint-pulse');
function place(){var r=btn.getBoundingClientRect(),w=tip.offsetWidth,vw=document.documentElement.clientWidth;var left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16);tip.style.left=left+'px';tip.style.top=(r.bottom+12)+'px';arrow.style.left=Math.max(14,Math.min(w-26,r.left+r.width/2-left-6))+'px';}
place();requestAnimationFrame(function(){tip.classList.add('on');});
var timer=setTimeout(function(){close(false);},25000);
function close(remember){clearTimeout(timer);if(remember){try{localStorage.setItem(KEY,'1');}catch(e){}}btn.classList.remove('demo-hint-pulse');tip.classList.remove('on');setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},300);window.removeEventListener('resize',place);window.removeEventListener('scroll',place,true);document.removeEventListener('keydown',onKey);btn.removeEventListener('click',onBtn,true);}
function onKey(e){if(e.key==='Escape')close(true);}
function onBtn(){close(true);}
ok.addEventListener('click',function(){close(true);});btn.addEventListener('click',onBtn,true);document.addEventListener('keydown',onKey);window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
}
}catch(e){}})();</script>

<!-- tour-shift-v3 — scripts/lib/tour-shift.js 가 주입한다. 손으로 고치지 말 것 -->
<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
