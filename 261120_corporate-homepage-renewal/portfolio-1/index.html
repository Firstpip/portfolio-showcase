  --m300:#d7b994;
  --m400:#c59b67;

  --m600:#a56312;
  --m700:#87510f;
  --m800:#6a3f0c;

  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */

/* ── 상태 레이어 P1 서비스 룩 — 모양은 페이지가, 상태는 여기서 (gen-component-kit.js 산출, 색은 토큰만) ── */

function useParamState(p, key, dflt) {
  const [v, setV] = useState(p[key] !== undefined ? p[key] : dflt);
  useEffect(() => { setV(p[key] !== undefined ? p[key] : dflt); }, [p]);
  return [v, setV];
}

function InquiryForm({ initialProduct, compact, onDone }) {
  const [f, setF] = useState({ name: '', company: '', phone: '', product: initialProduct || '', body: '' });
  const [err, setErr] = useState({});
  const [done, setDone] = useState(null);
  const [sending, setSending] = useState(false);
  useEffect(() => { if (initialProduct) setF((x) => ({ ...x, product: initialProduct })); }, [initialProduct]);
  const set = (k) => (e) => setF((x) => ({ ...x, [k]: e.target.value }));
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!f.name.trim()) er.name = '담당자 이름을 입력해 주세요';
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(f.phone.trim())) er.phone = '연락처를 010-1234-5678 형식으로 입력해 주세요';
    if (!f.product) er.product = '문의 제품을 골라 주세요';
    if (f.body.trim().length < 10) er.body = '문의 내용을 10자 이상 적어 주세요';
    setErr(er);
    if (Object.keys(er).length) return;
    setSending(true);
    setTimeout(() => { setSending(false); setDone({ no: nextInquiryNo(), ...f }); if (onDone) onDone(); }, 500);
  };
  if (done) return <InquiryDone d={done} />;
  const Fld = ({ k, label, children }) => (<label className="block"><span className="mb-1.5 block text-[length:var(--c-small)] font-semibold text-[var(--n8)]">{label}</span>{children}{err[k] && <span className="mt-1 block text-[13px] text-[var(--s2-text)]" role="alert">{err[k]}</span>}</label>);
  return (
    <form onSubmit={submit} className="grid gap-3" noValidate aria-label="온라인 문의 폼">
      <div className="grid grid-cols-2 gap-3">
        <Fld k="name" label="담당자 이름"><input className="p1-field" value={f.name} onChange={set('name')} placeholder="홍길 담당자" aria-invalid={!!err.name} /></Fld>
        <Fld k="company" label="회사명"><input className="p1-field" value={f.company} onChange={set('company')} placeholder="회사명(선택)" /></Fld>
      </div>
      <Fld k="phone" label="연락처"><input className="p1-field" value={f.phone} onChange={set('phone')} placeholder="010-1234-5678" inputMode="tel" aria-invalid={!!err.phone} /></Fld>
      <Fld k="product" label="문의 제품">
        <select className="p1-field" value={f.product} onChange={set('product')} aria-invalid={!!err.product}>
          <option value="">제품을 골라 주세요</option>
          {GROUPS.map((g) => <optgroup key={g.k} label={g.n}>{g.items.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}</optgroup>)}
        </select>
      </Fld>
      <Fld k="body" label="문의 내용"><textarea className="p1-field" value={f.body} onChange={set('body')} placeholder="용도·치수·수량을 적어 주세요" style={{ minHeight: compact ? 84 : 120 }} aria-invalid={!!err.body} /></Fld>
      <p className="text-[13px] text-[var(--n7)]">입력하신 정보는 문의 답변에만 쓰이며, 스팸 방지를 위해 접수 속도를 제한합니다.</p>
      <button type="submit" className="p1-btn" data-loading={sending}>문의 접수하기</button>
    </form>
  );
}

var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
