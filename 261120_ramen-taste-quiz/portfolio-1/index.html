  useEffect(() => { if (left <= 0 && !RF_STILL) go("result"); }, [left]);

  );
}
function useCountUp(to, run, ms = 1400) {
  const [v, setV] = useState(RF_STILL ? to : 0);
  useEffect(() => {
    if (RF_STILL) { setV(to); return undefined; }
    if (!run) return undefined;
    let raf, t0;
    const f = (ts) => { if (!t0) t0 = ts; const k = Math.min(1, (ts - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(f); };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, [to, run]);
  return v;
}

/* ── How to cook ── */
function Cook({ lang, answers }) {
  const p = useParams();
  const t = T[lang];
  const rec = useMemo(() => recommend(answers), [answers]);
  const list = rec.roles.map((r) => r.p);
  const fromId = p.p ? PRODUCT(+p.p) : null;
  const startTab = p.tab ? clampN(+p.tab - 1, 0, list.length - 1) : (fromId ? Math.max(0, list.findIndex((x) => x.id === fromId.id)) : 0);
  const [tab, setTab] = useState(startTab);
  useEffect(() => { setTab(startTab); }, [p]);
  const prod = list[tab] || list[0];
  const steps = t.steps2[prod.form];
  const tops = TOP_BY(prod.id);
  return (
    <section className="nm-screen nm-cook">
      <div className="nm-cook-photo"><BowlArt w={210} /><span>{t.cookTitle}</span></div>
      <div className="nm-tabs" role="tablist">
        {list.map((x, i) => <button key={x.id} type="button" role="tab" aria-selected={tab === i} className={cx(tab === i && "on")} onClick={() => setTab(i)}>{t.roles[i]}</button>)}
      </div>
      <div className="nm-cook-head"><Pack p={prod} size={52} /><div><b>{prod.name}</b><span>{t.cookFor} {t.forms[prod.form]} · {tx(SPICE[prod.spice - 1], lang)}</span></div></div>
      <ol className="nm-cs">
        {steps.map(([s, tm], i) => (<li key={i}><span className="nm-n">{i + 1}</span><span className="nm-st">{s}</span><em>{tm}</em></li>))}
      </ol>
      <div className="nm-tops"><p>{t.toppings}</p>
        <div>{tops.map((k) => (<span key={k} className="nm-top"><Topping k={k} s={56} />{t.topNames[k]}</span>))}</div>
      </div>
      <div className="nm-actions"><button type="button" className="nm-ghost" onClick={() => go("result")}><Icon name="arrow-left" size={18} />{t.back}</button></div>
    </section>
  );
}

/* ── 익명 수집 안내 ── */
function Privacy({ lang }) {
  const p = useParams();
  const t = T[lang];
  const [open, setOpen] = useState(p.open === "all" ? "all" : "both");
  useEffect(() => { setOpen(p.open === "all" ? "all" : "both"); }, [p]);
  const is = (k) => open === "all" || open === k || (open === "both" && k !== "lang");
  return (
    <section className="nm-screen nm-priv">
      <h2 className="nm-qt">{t.privTitle}</h2>
      <p className="nm-sub2">{t.privSub}</p>
      <div className="nm-sess"><Icon name="fingerprint" size={20} /><div><span>{t.sess}</span><b>S-7F3K-92QA</b></div></div>
      <div className="nm-acc">
        <button type="button" onClick={() => setOpen(is("col") ? "none" : "col")} aria-expanded={is("col")}><span>{t.collected} · {t.items.length}</span><Icon name={is("col") ? "chevron-up" : "chevron-down"} size={18} /></button>
        {is("col") && <ul>{t.items.map((s) => <li key={s}><Icon name="check" size={16} />{s}</li>)}</ul>}
        <button type="button" onClick={() => setOpen(is("not") ? "none" : "not")} aria-expanded={is("not")}><span>{t.notCol}</span><Icon name={is("not") ? "chevron-up" : "chevron-down"} size={18} /></button>
        {is("not") && <ul className="no">{t.nots.map((s) => <li key={s}><Icon name="x" size={16} />{s}</li>)}</ul>}
        <button type="button" onClick={() => setOpen(is("lang") ? "none" : "lang")} aria-expanded={is("lang")}><span>{t.langs}</span><Icon name={is("lang") ? "chevron-up" : "chevron-down"} size={18} /></button>
        {is("lang") && <div className="nm-langs"><span className="on">EN English</span><span className="on">DE Deutsch</span><p>{t.soon}</p></div>}
      </div>
    </section>
  );
}

function App() {
  const route = useRoute();
  const p = useParams();
  useLucide();
  const [lang, setLang] = useState("en");
  const [answers, setAnswers] = useState(DEFAULT_ANS);
  useEffect(() => { if (p.lang === "de" || p.lang === "en") setLang(p.lang); }, [p]);
  const reset = () => { setAnswers(DEFAULT_ANS); setLang("en"); go("start"); };
  const Scr = { start: Start, quiz: Quiz, calc: Calc, result: Result, cook: Cook, privacy: Privacy }[route] || Start;

    <>
      <DemoBar onReset={reset} />
      <Frame route={route} lang={lang} setLang={setLang}>
        <Scr lang={lang} answers={answers} setAnswers={setAnswers} />
      </Frame>
    </>
  );
}
