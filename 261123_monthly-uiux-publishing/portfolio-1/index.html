/* ── 공통 부품 ── */
const useToast = (() => { const set = new Set(); let cur = null; return { show(msg) { cur = { msg, k: Date.now() }; set.forEach(f => f()); setTimeout(() => { if (cur && Date.now() - cur.k >= 2400) { cur = null; set.forEach(f => f()); } }, 2500); }, use() { const [, t] = useState(0); useEffect(() => { const f = () => t(n => n + 1); set.add(f); return () => set.delete(f); }, []); return cur; } }; })();
const toast = (m) => useToast.show(m);
function Toast() { const c = useToast.use(); if (!c) return null; return <div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] rounded-[var(--r-ctl)] bg-[var(--n9)] px-5 py-3 text-[length:var(--c-small)] text-white shadow-lg">{c.msg}</div>; }
const Logo = ({ size = 22 }) => <span className="select-none tracking-[-0.04em] text-[var(--n9)]" style={{ fontSize: size, lineHeight: 1 }}><b style={{ fontWeight: 800 }}>다듬</b><span style={{ fontWeight: 300 }}>결</span></span>;
const Mono = ({ children, className = '' }) => <span className={cx('font-mono text-[12px] tracking-[0.02em] text-[var(--n6)] tabular-nums', className)}>{children}</span>;
const Fig = ({ n, children }) => <div className="flex items-center gap-2 text-[12px] font-mono text-[var(--n6)]"><span className="text-[var(--n9)]">FIG {n}</span><span className="h-px w-6 bg-[var(--n3)]" /><span>{children}</span></div>;
/* 상태 배지 — 요청 접수=무채색, 디자인·퍼블리싱=진행(s1), 전달 완료=무채색 체크 */
function StatusBadge({ status }) {
  const lab = DB.STATUS[status];

}

function PayModal({ variant = 'after', state = 'default', pins = false, activePin = 0, onPin, compact = false }) {
  const after = variant === 'after';

  const sel = err ? 'new' : 'card1';

  return (
    <div className="relative w-full overflow-hidden rounded-[var(--r-card)] border border-[var(--n3)] bg-[var(--n1)]" style={{ height: 460 }} data-variant={variant}>
      <div className="absolute inset-0 bg-[var(--n2)]/50" aria-hidden="true" />
      <div className="absolute left-[5%] top-[3%] h-[94%] w-[90%] rounded-[var(--r-modal)] bg-white shadow-lg" style={{ borderRadius: after ? 13 : 4 }}>
        <div className="absolute left-0 right-0 top-0 flex items-start justify-between px-[6%] pt-[4%]" style={{ height: '17%' }}>
          <div><div style={{ fontSize: after ? 17 : 15, fontWeight: after ? 600 : 500 }} className="text-[var(--n9)]">결제 수단 변경</div><div className="mt-1 text-[12px] text-[var(--n6)]">주문 ORD-24118 · 결제 예정 48,000원</div></div>
          <Icon name="x" size={16} className="text-[var(--n6)]" />

        <ul className="absolute left-[6%] right-[6%] flex flex-col" style={{ top: listTop + '%', gap }}>

            return (
              <li key={m.id} className="flex items-center gap-2.5 px-2.5" style={{ height: rowH, borderRadius: after ? 9 : 3, background: on && after ? 'color-mix(in oklab, var(--m600) 9%, white)' : h ? 'var(--n1)' : 'transparent', border: '1px solid ' + (on ? (after ? 'var(--m600)' : 'var(--n5)') : 'var(--n3)') }}>

}
function Footer() {
  return <footer className="border-t border-[var(--n3)] bg-[var(--n1)] py-8"><div className="mx-auto flex max-w-[1280px] flex-wrap items-center justify-between gap-3 px-6 text-[13px] text-[var(--n6)]"><Logo size={18} /><span>수정 건 납품 포털 · 과업 {DB.mdw(DB.PROJECT.start)}~{DB.mdw(DB.PROJECT.end)} · 오늘 {DB.mdw(DB.TODAY)}</span></div></footer>;
}

function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const Page = SCREENS[route] || SCREENS.requests || (() => null);
  return (
    <>
      <DemoBar onReset={() => { toast('예시 데이터를 처음 상태로 되돌렸어요'); go('requests'); }} />
      <div id="rf-root" className="rf-root" data-tone="light" style={{ background: 'var(--n0)' }}>
        <Header route={route} />
        <main id="main"><Page key={route} /></main>
        <Footer />
      </div>
      <Toast />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}

function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;

function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});

}catch(e){}})();
</script>
