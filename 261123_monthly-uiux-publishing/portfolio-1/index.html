  --s2:#cf3f3f; --s2-bg:#f9e7e7; --s2-text:#ad1f1f; /* 오류/위험/실패/하락/환불 */

.p1-menu button[aria-current="page"]{color:var(--m700);border-bottom-color:var(--m600);font-weight:600}
.p1-acct{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--n8);white-space:nowrap}
.p1-acct .av{width:32px;height:32px;border-radius:50%;background:var(--n2);color:var(--n8);display:grid;place-items:center;font-weight:600}
.p1-main{max-width:1360px;margin:0 auto;padding:26px 24px 64px}
.p1-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.p1-head h1{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;color:var(--n10)}
.p1-head p{margin:4px 0 0;color:var(--n7);font-size:15px}
.p1-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.p1-two{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.p1-panel{background:var(--n1);border:1px solid var(--n3);border-radius:var(--r-card)}
.p1-panel>h2,.p1-ph{margin:0;padding:12px 16px;font-size:16px;font-weight:600;border-bottom:1px solid var(--n3);display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--n10)}
.p1-pb{padding:14px 16px;display:grid;gap:12px}
.p1-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.p1-sheet{overflow:auto;border:1px solid var(--n3);border-radius:var(--r-card);background:var(--n1)}
.p1-sheet tbody tr{cursor:pointer}.p1-sheet tbody tr:hover td{background:var(--n0)}
.p1-sheet tbody tr[aria-selected="true"] td{background:var(--m50)}
.p1-sheet tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--m600)}
.p1-foot{display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--n3);font-size:13.5px;color:var(--n7);background:var(--n0)}
.p1-msg{border-top:1px solid var(--n2);padding:9px 0;font-size:14px}
.p1-msg b{font-size:12.5px;color:var(--n7);font-weight:500;display:block}
.p1-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.p1-card{border:1px solid var(--n3);border-radius:var(--r-card);padding:12px 14px;background:var(--n1);text-align:left;display:grid;gap:6px;width:100%}
.p1-card[aria-pressed="true"]{border-color:var(--m600);background:var(--m50)}
.p1-card .l{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--n8)}
.p1-plan{border:1px solid var(--n3);border-radius:var(--r-card);padding:14px 16px;background:var(--n1);text-align:left;display:grid;gap:8px;width:100%}
.p1-plan[aria-pressed="true"]{border-color:var(--m600);background:var(--m50)}
.p1-plan ul{margin:0;padding-left:18px;font-size:14px;color:var(--n8);display:grid;gap:3px}
.p1-sub{font-size:13px;color:var(--n7)}
.p1-kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px}
.p1-kv dt{color:var(--n7)}.p1-kv dd{margin:0;color:var(--n9)}
.p1-w{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1100px){.p1-grid,.p1-two{grid-template-columns:1fr}.p1-nav .in{gap:12px}.p1-acct .tx{display:none}}
body.look-tour-open .p1-grid{grid-template-columns:minmax(0,1fr) 300px}
body.look-tour-open .hm{display:none}
body.look-tour-open .p1-two{grid-template-columns:260px minmax(0,1fr)}
body.look-tour-open .p1-acct .tx{display:none}
body.look-tour-open .p1-cards{grid-template-columns:1fr}
@media (max-width:720px){.p1-main{padding:18px 14px 48px}.p1-cards{grid-template-columns:1fr}.p1-head h1{font-size:24px}.p1-brand span.t{display:none}}
.p1-panel[data-focus="true"]{box-shadow:0 0 0 2px var(--m600)}
.p1-sheet tfoot td{background:var(--n0)}
.sx-tag[data-t="dark"]{background:var(--n8);color:var(--n1)}
.sx-tag[data-t="line"]{background:transparent;box-shadow:inset 0 0 0 1px var(--n4);color:var(--n8)}
.sx-pick{appearance:none;-webkit-appearance:none;padding:0 8px;cursor:pointer}
.sx-pick[data-prio="높음"]{box-shadow:inset 3px 0 0 var(--m600)}
.p1-sheet .sx-tbl td{padding:4px 12px;font-size:15px;height:38px}
.p1-sheet .sx-tbl th{padding:8px 12px}
.p1-main{padding-top:18px}
.p1-head{margin-bottom:12px}
.p1-head p{margin-top:2px;font-size:14px}
.p1-head .p1-bar .sx-in{height:40px}
.p1-grid{grid-template-columns:minmax(0,1fr) 340px}
.sx-checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;border:1px solid var(--n3)}
.sx-checks li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--n2);font-size:14px}
@media (max-width:720px){.sx-checks{grid-template-columns:1fr}}
.p1-head>div:first-child{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.p1-main{padding-top:12px}
.p1-sheet .sx-tbl td{padding:2px 12px;font-size:14.5px;height:36px}

</style>
</head>

}

<script>
(function(){try{

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}

function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}

function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
