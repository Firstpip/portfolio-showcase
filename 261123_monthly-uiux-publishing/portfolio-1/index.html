              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, borderTop: '1px solid ' + MC.line, paddingTop: 10 }}>{btn('닫기', false)}{btn('저장', true)}</div>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {fields.concat([['메모', '없음']]).map(([t, v]) => <div key={t} style={{ minWidth: 0 }}><div style={{ fontSize: 9, color: MC.mute }}>{t}</div><div style={{ height: 20, border: '1px solid ' + MC.line, borderRadius: 4, padding: '0 4px', fontSize: 9, color: MC.ink, overflow: 'hidden', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center' }}>{v}</div></div>)}
              <div style={{ gridColumn: '1 / 3', display: 'flex', justifyContent: 'flex-end', gap: 6, marginTop: 6 }}>{btn('닫기', false)}{btn('저장', true)}</div>
            </div>
          )}
        </div>
      </div>
    );
  } else if (kind === 'form') {
    body = (
      <div style={{ flex: 1, padding: 16, display: 'grid', alignContent: 'start', gap: after ? 12 : 8 }}>
        <b style={{ fontSize: 14, color: MC.ink }}>로그인</b>
        {[['이메일', 'user@example.com'], ['비밀번호', '••••••']].map(([t, v], i) => (
          <div key={t}>
            <div style={{ fontSize: 11, color: MC.mute, marginBottom: 3 }}>{t}</div>
            <div style={{ height: after ? 38 : 30, border: '1px solid ' + (after && i === 1 ? MC.warn : MC.line), borderRadius: 8, padding: '0 10px', display: 'flex', alignItems: 'center', fontSize: 12, color: MC.ink }}>{v}</div>
            {after && i === 1 && <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 4, fontSize: 11, color: MC.warn }}>{ico('alert', 12)}비밀번호를 다시 확인해 주세요</div>}
          </div>
        ))}
        {btn('로그인', true)}
        {!after && <div style={{ fontSize: 10, color: MC.warn }}>비밀번호를 다시 확인해 주세요</div>}
      </div>
    );
  } else {
    body = (
      <div style={{ flex: 1, padding: 16, display: 'grid', alignContent: 'start', gap: 10 }}>
        {after ? (
          <>
            <b style={{ fontSize: 14, color: MC.ink }}>접수가 끝났습니다</b>
            {['내용 확인', '담당자 배정', '결과 안내'].map((t, i) => <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 8, height: 34, fontSize: 12, color: MC.ink }}><span style={{ width: 20, height: 20, borderRadius: 10, background: i === 0 ? MC.acc : MC.soft, color: i === 0 ? MC.onAcc : MC.mute, display: 'grid', placeItems: 'center' }}>{i === 0 ? ico('check', 12) : <span style={{ fontSize: 10 }}>{i + 1}</span>}</span>{t}</div>)}
            {btn('내역 보기', true)}
          </>
        ) : (
          <>
            <b style={{ fontSize: 12, color: MC.ink }}>접수가 끝났습니다</b>
            {txt('내용 확인 후 담당자를 배정하고 결과를 안내합니다. 진행 상황은 내역에서 볼 수 있습니다.', { mute: 1 })}
            <div>{btn('내역 보기', true)}</div>
          </>
        )}
      </div>
    );
  }
  return <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', background: MC.bg, overflow: 'hidden', fontFamily: 'inherit' }}>{head}{body}</div>;
}

const MC = { bg: 'var(--n1)', line: 'var(--n3)', ink: 'var(--n9)', mute: 'var(--n7)', soft: 'var(--n2)', acc: 'var(--m600)', onAcc: 'var(--on-main)', warn: 'var(--s2)' };
const ico = (n, s) => <Icon name={{ menu: 'menu', close: 'x', check: 'check', alert: 'circle-alert' }[n] || n} size={s || 16} />;
const Mini = (props) => <MiniFrame MC={MC} ico={ico} {...props} />;
const Pill = ({ tone = 'n', fill, children }) => <span className={'pill pill-' + tone + (fill ? ' fill' : '')}>{children}</span>;
const stageTone = (s) => (s === 2 ? 'acc' : s === 5 ? 'ok' : 'n');
const MENU = [['main', '수정 건 보드'], ['request', '건 요청'], ['compare', '시안 확인'], ['result', '퍼블리싱 결과'], ['monthly', '월간 현황'], ['pricing', '견적·단가 기준']];
const THREAD_KEYS = ['하윤', '서준'];

function Header({ route }) {
  return (
    <header className="app-head">
      <div className="in">
        <button type="button" className="wm" onClick={() => go('main')} aria-label="수정노트 처음 화면"><span className="wm-g" aria-hidden="true"><Icon name="pen-line" size={16} /></span>수정노트</button>
        <nav aria-label="주요 메뉴" className="menu">
          {MENU.map(([r, l]) => <button key={r} type="button" aria-current={route === r ? 'page' : undefined} onClick={() => go(r)}>{l}</button>)}

}

function Main({ db, setDb, say }) {
  const p = useParams();
  const [sel, setSel] = useState('R-2411-06');
  const [q, setQ] = useState('');
  const [st, setSt] = useState('전체');
  useEffect(() => { if (p.open) setSel(p.open); }, [p]);
  const cases = db.cases;
  const rows = [...cases].filter((c) => (st === '전체' || STAGES[c.stage] === st) && (c.title + c.id + c.screen).includes(q)).sort((a, b) => (a.stage === 2 ? 0 : 1) - (b.stage === 2 ? 0 : 1) || a.pri - b.pri || a.id.localeCompare(b.id));
  const cur = cases.find((c) => c.id === sel) || cases[0];
  const upd = (id, f) => setDb((d) => ({ ...d, cases: d.cases.map((c) => (c.id === id ? { ...c, ...f(c) } : c)) }));
  const decide = (c, v) => {
    if (v === '승인') { upd(c.id, () => ({ stage: 3 })); setDb((d) => ({ ...d, log: [...d.log, [c.id, '승인', '11.24 14:05']] })); say(c.id + ' 시안을 승인했습니다'); }
    if (v === '수정 요청') { upd(c.id, (x) => ({ stage: 1, ver: 'v' + (parseInt(x.ver.slice(1), 10) + 1) })); setDb((d) => ({ ...d, log: [...d.log, [c.id, '수정 요청', '11.24 14:05']] })); say(c.id + ' 수정 요청을 보냈습니다'); }
  };
  const ck = checksOf(cur);
  const confirmVal = (c) => (c.stage === 2 ? '대기' : c.stage >= 3 ? '승인' : '—');
  return (
    <div data-comp="worksheet" className="page">
      <div className="ph">
        <div><h1>이번 달 수정 건</h1><p className="sub tnum">{cases.length}건 · 확인 대기 {waiting(cases)}건 · 퍼블리싱 이후 {cases.filter((c) => c.stage >= 3).length}건</p></div>
        <button type="button" className="btn btn-p" onClick={() => go('request', { new: '1' })}>수정 건 등록</button>
      </div>
      <div className="ws-grid">
        <section className="card sheet" data-part="sheet" aria-label="수정 건 시트">
          <div className="toolbar">
            <label className="srch"><Icon name="search" size={16} /><input aria-label="수정 건 찾기" placeholder="번호·제목·화면 찾기" value={q} onChange={(e) => setQ(e.target.value)} /></label>
            <select aria-label="단계로 좁히기" className="fld" value={st} onChange={(e) => setSt(e.target.value)}><option>전체</option>{STAGES.map((s) => <option key={s}>{s}</option>)}</select>
          </div>
          <table className="tbl">
            <thead><tr><th>수정 건</th><th>우선순위</th><th>단계</th><th>확인</th></tr></thead>
            <tbody>
              {rows.map((c) => (
                <tr key={c.id} aria-selected={sel === c.id} onClick={() => setSel(c.id)} className={sel === c.id ? 'on' : ''}>
                  <td><b className="tt">{c.title}</b><small className="mu tnum">{c.id} · {c.screen} · {TYPES[c.type]} · {SIZES[c.size]} · 시안 {c.ver}</small></td>
                  <td onClick={(e) => e.stopPropagation()}><select data-part="cell" aria-label={c.id + ' 우선순위'} className="fld sm" value={c.pri} onChange={(e) => upd(c.id, () => ({ pri: +e.target.value }))}>{PRI.map((l, i) => <option key={l} value={i}>{l}</option>)}</select></td>
                  <td><Pill tone={stageTone(c.stage)} fill={c.stage === 2}>{STAGES[c.stage]}</Pill></td>
                  <td onClick={(e) => e.stopPropagation()}>
                    {c.stage === 2 ? <select data-part="cell" aria-label={c.id + ' 확인'} className="fld sm" value="대기" onChange={(e) => decide(c, e.target.value)}><option>대기</option><option>승인</option><option>수정 요청</option></select>
                      : <span className="mu">{confirmVal(c)}</span>}
                  </td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td colSpan={4} className="mu" style={{ padding: 24 }}>조건에 맞는 수정 건이 없습니다.</td></tr>}
            </tbody>
          </table>
          <div className="sumrow"><span className="tnum">확인 대기 <b>{waiting(cases)}건</b> · 가정 단가 {WON(sumPrice(cases.filter((c) => c.stage === 2)))} <span className="mu">/ 전체 {cases.length}건 가정 단가 합계 {WON(sumPrice(cases))}</span></span></div>
          <div className="band-act">
            <span className="mu">대기 건을 한 번에 처리합니다</span>
            <button type="button" className="btn btn-s btn-sm" onClick={() => { cases.filter((c) => c.stage === 2).forEach((c) => decide(c, '승인')); }}>전체 승인</button>
            <button type="button" className="btn btn-s btn-sm" onClick={() => setSt('클라이언트 확인')}>대기 건만 보기</button>
            <button type="button" className="btn btn-s btn-sm" onClick={() => say('우선순위 순으로 정렬했습니다')}>우선순위 정렬</button>
          </div>
        </section>
        <aside className="card basis" aria-label="완료 기준">
          <div className="bh"><span className="mu tnum">{cur.id}</span><h2>{cur.title}</h2><p className="mu">{cur.screen} · {TYPES[cur.type]} · {SIZES[cur.size]} · 시안 {cur.ver}</p></div>
          <div className="brow"><span className="lbl">완료 기준</span><b className="tnum">{doneCount(cur)}/6</b></div>
          <ol className="chk">{ck.map((x, i) => <li key={x.t} className={x.done ? 'ok' : ''}><span className="n">{x.done ? <Icon name="check" size={13} /> : i + 1}</span>{x.t}</li>)}</ol>
          <div className="brow"><span className="lbl">전달 방식</span><span className="chips"><span className="chip"><i>대상</i>HTML·CSS</span><span className="chip"><i>대상</i>변경 메모</span></span></div>
          <div className="brow"><span className="lbl">가정 단가</span><b className="tnum">{WON(priceOf(cur))}</b></div>
          <div className="bact">
            {cur.stage === 2 ? <button type="button" className="btn btn-p" onClick={() => decide(cur, '승인')}>시안 승인</button> : <button type="button" className="btn btn-p" onClick={() => go('compare', { frame: '1' })}>시안 확인 열기</button>}
          </div>
        </aside>
      </div>
    </div>
  );
}

function Request({ db, setDb, say }) {
  const p = useParams();
  const [sel, setSel] = useState('R-2411-03');
  const [dlg, setDlg] = useState(false);
  const [msg, setMsg] = useState('');
  const [f, setF] = useState({ screen: '공통 헤더', type: 0, pri: 1, memo: '' });
  useEffect(() => { setDlg(p.new === '1'); if (p.open) setSel(p.open); }, [p]);
  const cases = db.cases;
  const cur = cases.find((c) => c.id === sel) || cases[0];
  const list = [...cases].sort((a, b) => a.pri - b.pri || a.id.localeCompare(b.id));
  const extra = (db.extra[cur.id] || []);
  const th = threadOf(cur).concat(extra);
  const submit = () => {
    const id = 'R-2411-' + String(db.seq).padStart(2, '0');
    const kind = { '공통 헤더': 'menu', 로그인: 'form', '상세 보기': 'modal' }[f.screen] || 'card';
    setDb((d) => ({ ...d, seq: d.seq + 1, cases: [...d.cases, { id, title: f.memo.trim() || f.screen + ' 수정', kind, screen: f.screen, type: +f.type, size: 0, stage: 0, pri: +f.pri, day: '11.24', ver: 'v1' }] }));
    setSel(id); setDlg(false); say(id + ' 수정 건을 등록했습니다'); setF({ screen: '공통 헤더', type: 0, pri: 1, memo: '' });
  };
  const send = () => { if (!msg.trim()) return; setDb((d) => ({ ...d, extra: { ...d.extra, [cur.id]: [...(d.extra[cur.id] || []), ['하윤', '담당자', '11.24 14:10', msg.trim()]] } })); setMsg(''); };
  const approve = () => { if (cur.stage !== 2) { say('확인 대기 단계의 건만 승인할 수 있습니다'); return; } setDb((d) => ({ ...d, cases: d.cases.map((c) => (c.id === cur.id ? { ...c, stage: 3 } : c)), log: [...d.log, [cur.id, '승인', '11.24 14:12']] })); say(cur.id + ' 시안을 승인했습니다'); };
  return (
    <div className="page">
      <div className="ph"><div><h1>건 요청</h1><p className="sub">수정 건을 등록하고 건마다 대화를 이어 갑니다. 우선순위가 높은 건부터 작업합니다.</p></div><button type="button" className="btn btn-p" onClick={() => setDlg(true)}>새 건 등록</button></div>
      <div className="two">
        <section className="card sheet" aria-label="우선순위 목록">
          <table className="tbl">
            <thead><tr><th>우선순위</th><th>수정 건</th><th>단계</th></tr></thead>
            <tbody>{list.map((c) => <tr key={c.id} aria-selected={sel === c.id} className={sel === c.id ? 'on' : ''} onClick={() => setSel(c.id)}><td className="mu">{PRI[c.pri]}</td><td><b className="tt">{c.title}</b><small className="mu tnum">{c.id} · {c.screen}</small></td><td><Pill tone={stageTone(c.stage)} fill={c.stage === 2}>{STAGES[c.stage]}</Pill></td></tr>)}</tbody>
          </table>
        </section>
        <aside className="card thread" aria-label="코멘트">
          <div className="bh"><span className="mu tnum">{cur.id}</span><h2>{cur.title}</h2></div>
          <ul className="msgs">{th.map((m, i) => <li key={i} className={m[1] === '담당자' ? 'me' : ''}><div className="mh"><b>{m[0]}</b><span className="mu">{m[1]} · {m[2]}</span><span className="mu tnum">#{i + 1}</span></div><p>{m[3]}</p></li>)}</ul>
          <div className="compose"><input aria-label="코멘트 입력" className="fld" placeholder="코멘트를 남깁니다" value={msg} onChange={(e) => setMsg(e.target.value)} /><button type="button" className="btn btn-s btn-sm" onClick={send}>보내기</button><button type="button" className="btn btn-p btn-sm" onClick={approve}>확인 승인</button></div>
        </aside>
      </div>
      {dlg && (
        <div className="dlg-back" onClick={() => setDlg(false)}>
          <div role="dialog" aria-modal="true" aria-label="새 건 등록" className="dlg" onClick={(e) => e.stopPropagation()}>
            <div className="dh"><h2>새 건 등록</h2><button type="button" aria-label="닫기" className="x" onClick={() => setDlg(false)}><Icon name="x" size={18} /></button></div>
            <label>대상 화면<select className="fld" value={f.screen} onChange={(e) => setF({ ...f, screen: e.target.value })}>{['공통 헤더', '로그인', '상세 보기', '결제 완료', '마이페이지', '목록', '공통 하단'].map((s) => <option key={s}>{s}</option>)}</select></label>
            <label>수정 유형<select className="fld" value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>{TYPES.map((t, i) => <option key={t} value={i}>{t}</option>)}</select></label>
            <label>우선순위<select className="fld" value={f.pri} onChange={(e) => setF({ ...f, pri: e.target.value })}>{PRI.map((t, i) => <option key={t} value={i}>{t}</option>)}</select></label>
            <label>수정 내용<textarea className="fld ta" rows={3} placeholder="예: 메뉴 닫기 버튼 위치 변경" value={f.memo} onChange={(e) => setF({ ...f, memo: e.target.value })} /></label>
            <div className="df"><button type="button" className="btn btn-s" onClick={() => setDlg(false)}>닫기</button><button type="button" className="btn btn-p" onClick={submit}>등록</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

const Zm = ({ z = 1.3, children }) => <div style={{ width: (100 / z) + '%', height: (100 / z) + '%', transform: 'scale(' + z + ')', transformOrigin: '0 0' }}>{children}</div>;
const HLBOX = (kind) => (HL[kind] || []).map((b, i) => <div key={i} className="hlbox" style={{ left: b[0] + '%', top: b[1] + '%', width: b[2] + '%', height: b[3] + '%' }}><span>{i + 1}</span></div>);

function Compare({ db, setDb, say }) {
  const p = useParams();
  const [sel, setSel] = useState('R-2411-03');
  const [at, setAt] = useState(50);
  const [fr, setFr] = useState(0);
  useEffect(() => { if (p.at) setAt(+p.at); if (p.frame) setFr(+p.frame - 1); }, [p]);
  const cases = db.cases;
  const cur = cases.find((c) => c.id === sel) || cases[0];
  const recs = db.log.filter((r) => r[0] === cur.id).slice(-4).reverse();
  const hist = histOf(cur);
  const approve = () => { setDb((d) => ({ ...d, cases: d.cases.map((c) => (c.id === cur.id && c.stage === 2 ? { ...c, stage: 3 } : c)), log: [...d.log, [cur.id, '승인', '11.24 14:20']] })); say(cur.id + ' · ' + FRAMES[fr] + ' 승인 기록을 남겼습니다'); };
  return (
    <div className="page">
      <div className="ph"><div><h1>시안 확인</h1><p className="sub tnum">{cur.id} · {cur.title} · 시안 {cur.ver}</p></div>
        <div className="tools"><select aria-label="수정 건 고르기" className="fld" value={sel} onChange={(e) => setSel(e.target.value)}>{cases.map((c) => <option key={c.id} value={c.id}>{c.id.slice(2)} {c.title}</option>)}</select></div></div>
      <div className="cmp-grid">
        <aside className="card frames" aria-label="디자인 프레임">
          <div className="lbl pad">디자인 프레임 {FRAMES.length}개</div>
          <ul>{FRAMES.map((f, i) => <li key={f}><button type="button" aria-pressed={fr === i} className={fr === i ? 'on' : ''} onClick={() => setFr(i)}><span className="tt">{f}</span><small className="mu">{cur.screen} · {cur.ver}</small></button></li>)}</ul>
        </aside>
        <section className="card cmpbox" aria-label="전·후 비교">
          <div className="cmp-top"><span className="tag">수정 전</span><span className="mu">{FRAMES[fr]} · 슬라이더 {at}%</span><span className="tag after">수정 후</span></div>
          <div className="cmp">
            <div className="layer"><Zm><Mini kind={cur.kind} after={false} /></Zm></div>
            <div className="layer" style={{ clipPath: 'inset(0 0 0 ' + at + '%)' }}><Zm><Mini kind={cur.kind} after /></Zm></div>
            <div className="hl-wrap" style={{ clipPath: 'inset(0 0 0 ' + at + '%)' }}>{HLBOX(cur.kind)}</div>
            <div className="handle" style={{ left: at + '%' }}><span><Icon name="chevrons-left-right" size={14} /></span></div>
          </div>
          <input aria-label="전·후 슬라이더" type="range" min="0" max="100" value={at} onChange={(e) => setAt(+e.target.value)} className="range" />
          <div className="legend">{[['①', '위치·크기'], ['②', '간격'], ['③', '문구']].map(([n, t], i) => <span key={n} className="chip"><i>{i + 1}</i>{t}</span>)}<span className="mu">변경 영역 {HL[cur.kind].length}곳</span></div>
        </section>
        <aside className="card thread" aria-label="코멘트와 승인">
          <div className="lbl pad">코멘트</div>
          <ul className="msgs">{threadOf(cur).slice(3, 6).map((m, i) => <li key={i} className={m[1] === '담당자' ? 'me' : ''}><div className="mh"><b>{m[0]}</b><span className="mu">{m[2]}</span><span className="mu tnum">#{i + 2}</span></div><p>{m[3]}</p></li>)}</ul>

function Result({ db }) {
  const p = useParams();

function Monthly({ db, say }) {
  const p = useParams();
  const [m, setM] = useState('11월');
  const [slot, setSlot] = useState(0);
  useEffect(() => { if (p.m) setM(p.m); if (p.slot) setSlot(+p.slot); }, [p]);
  const total = m === '11월' ? db.cases.length : PLAN_MONTH[m];
  const weeks = weekSplit(total);
  const processed = m === '11월' ? db.cases.filter((c) => c.stage >= 4).length : 0;
  const rate = total ? Math.round((processed / total) * 100) : 0;
  const peak = Math.max(...weeks);
  return (
    <div className="page">
      <div className="ph"><div><h1>월간 현황</h1><p className="sub">30일 과업(11.18~12.17)과 30일 이후 월 단위 이어가기를 같은 기준으로 봅니다. 12월 이후 건수는 예상 건수이며 11월 처리 현황을 보고 정합니다.</p></div>
        <div className="seg" role="group" aria-label="월 선택">{MONTHS.map(([k]) => <button key={k} type="button" aria-pressed={m === k} className={m === k ? 'on' : ''} onClick={() => setM(k)}>{k}</button>)}</div></div>
      <div className="two">
        <section className="card pad" aria-label="월별 처리 건수">
          <div className="brow"><span className="lbl">{m} {m === '11월' ? '수정 건' : '가정 처리 건수'}</span><b className="tnum">{total}건</b></div>
          <div className="bars">{weeks.map((n, i) => <div key={i} className="bar"><div style={{ height: (n / peak) * 120 }} className={m === '11월' ? '' : 'asm'} /><span className="tnum">{n}</span><small className="mu">{i + 1}주차</small></div>)}</div>
          <div className="brow"><span className="lbl">처리율(전달 이후)</span><b className="tnum">{rate}%</b></div>
          <div className="track"><div style={{ width: rate + '%' }} /></div>
          <p className="mu">{m === '11월' ? '수정 건 시트의 단계에서 센 값입니다.' : '착수 전이라 처리율은 0%입니다. 건수는 11월 규모를 기준으로 한 예상 건수입니다.'}</p>
          <div className="lbl" style={{ marginTop: 20 }}>30일 과업 타임라인</div>
          <ol className="tl">{[['11.18 ~ 11.24', '접수·디자인'], ['11.25 ~ 12.01', '시안 확인·수정'], ['12.02 ~ 12.08', '퍼블리싱'], ['12.09 ~ 12.17', '전달·반영 확인']].map(([d, t], i) => <li key={d}><span className="tnum mu">{d}</span><div className="tlbar" style={{ width: 40 + i * 14 + '%' }}>{t}</div></li>)}</ol>
        </section>
        <section className="card pad" aria-label="대면 미팅">
          <div className="lbl">대전 대면 미팅 가능 일정</div>
          <p className="mu">대면 미팅은 대전에서 1회 가능한 일정으로 둡니다. 하나를 고릅니다.</p>
          <div className="slots">{SLOTS.map((s, i) => <button key={s} type="button" aria-pressed={slot === i} className={'slot tnum ' + (slot === i ? 'on' : '')} onClick={() => { setSlot(i); say(s + ' 미팅 일정을 골랐습니다'); }}>{s}</button>)}</div>
          <div className="lbl" style={{ marginTop: 20 }}>소통 채널</div>
          <ul className="chan">{[['messages-square', '메신저', '건별 코멘트와 일상 확인'], ['video', '화상 미팅', '주 1회 진행 점검'], ['map-pin', '대전 대면', '선택한 일정 ' + SLOTS[slot]]].map(([i, t, d]) => <li key={t}><Icon name={i} size={18} /><div><b>{t}</b><small className="mu">{d}</small></div></li>)}</ul>
        </section>
      </div>
    </div>
  );
}

function Pricing({ db }) {
  const p = useParams();
  const [t, setT] = useState(0);
  const [s, setS] = useState(1);
  const [n, setN] = useState(1);
  useEffect(() => { if (p.type) setT({ text: 0, layout: 1, new: 2, resp: 3 }[p.type] ?? 0); if (p.size) setS({ small: 0, mid: 1, large: 2 }[p.size] ?? 1); }, [p]);
  const unit = RATE[t][s];
  const total = unit * n;
  return (
    <div className="page">
      <div className="ph"><div><h1>견적·단가 기준</h1><p className="sub">수정 건 1건의 단가는 작업 유형과 규모로 정합니다.</p></div></div>
      <div className="note"><Icon name="info" size={16} />표시된 단가는 기준 금액이며, 건 목록을 확인한 뒤 미팅에서 확정합니다.</div>
      <div className="two">
        <section className="card sheet" aria-label="가정 단가표">
          <table className="tbl"><thead><tr><th>작업 유형</th>{SIZES.map((z) => <th key={z} className="num">{z}</th>)}</tr></thead>
            <tbody>{TYPES.map((tn, i) => <tr key={tn}><td><b>{tn}</b></td>{RATE[i].map((v, j) => <td key={j} className={'num tnum ' + (i === t && j === s ? 'pick' : '')}>{WON(v)}</td>)}</tr>)}</tbody></table>

        </section>
        <section className="card pad" aria-label="건 견적 계산기">
          <div className="lbl">건 견적 계산기</div>
          <label className="fl">작업 유형<select className="fld" value={t} onChange={(e) => setT(+e.target.value)}>{TYPES.map((x, i) => <option key={x} value={i}>{x}</option>)}</select></label>
          <label className="fl">규모<select className="fld" value={s} onChange={(e) => setS(+e.target.value)}>{SIZES.map((x, i) => <option key={x} value={i}>{x}</option>)}</select></label>
          <label className="fl">건수<input className="fld" type="number" min="1" max="30" value={n} onChange={(e) => setN(Math.max(1, Math.min(30, +e.target.value || 1)))} /></label>
          <table className="tbl mini"><tbody>{SPLIT.map(([k, r]) => <tr key={k}><td>{k}</td><td className="num tnum">{WON(Math.round(total * r))}</td></tr>)}<tr><td><b>가정 견적 합계</b></td><td className="num tnum"><b>{WON(total)}</b></td></tr></tbody></table>
          <p className="mu">{TYPES[t]} · {SIZES[s]} · {n}건 기준, 건당 {WON(unit)}</p>
        </section>
      </div>
    </div>
  );
}

function Cases({ db }) {
  const pick = (id) => db.cases.find((c) => c.id === id);
  const feat = pick('R-2411-07');
  const rest = [['R-2411-03', true], ['R-2411-02', true], ['R-2411-04', true], ['R-2411-01', false]];
  const ff = (c) => { const f = fileCount(c); return 'HTML ' + f.html + ' · CSS ' + f.css; };
  return (
    <div className="page">
      <div className="ph"><div><h1>작업 사례</h1><p className="sub">수정 건마다 디자인 시안과 퍼블리싱 결과를 한 묶음으로 확인합니다.</p></div></div>
      <section className="card feat">
        <div className="feat-media">
          <figure><div className="pf lg"><Mini kind={feat.kind} after={false} /></div><figcaption className="mu">수정 전</figcaption></figure>
          <figure><div className="pf lg"><Mini kind={feat.kind} after /></div><figcaption className="mu">수정 후 · 모바일 375</figcaption></figure>
          <figure><div className="pf lg wide"><Mini kind={feat.kind} after narrow={false} /></div><figcaption className="mu">퍼블리싱 결과 · PC 1280</figcaption></figure>
        </div>
        <div className="feat-info"><span className="mu tnum">{feat.id} · 대표 사례</span><h2>{feat.title}</h2><p className="mu">{feat.screen} · {TYPES[feat.type]} · {SIZES[feat.size]}</p>
          <div className="chips" style={{ justifyContent: 'flex-start' }}><span className="chip"><i>시안</i>{feat.ver}</span><span className="chip"><i>파일</i>{ff(feat)}</span><span className="chip"><i>단계</i>{STAGES[feat.stage]}</span></div>
          <button type="button" className="btn btn-p" onClick={() => go('compare', { frame: '1' })}>시안 확인 열기</button></div>
      </section>
      <ul className="case-list">{rest.map(([id, nar]) => { const c = pick(id); return (
        <li key={id} className="card">
          <div className="pair"><div className="pf sm"><Mini kind={c.kind} after={false} narrow={nar} /></div><Icon name="arrow-right" size={14} /><div className="pf sm"><Mini kind={c.kind} after narrow={nar} /></div></div>
          <div><b className="tt">{c.title}</b><small className="mu tnum">{c.id} · {TYPES[c.type]} · {SIZES[c.size]}</small><small className="mu">시안 {c.ver} · {ff(c)}</small></div>
          <Pill tone={c.stage === 5 ? 'ok' : 'n'}>{STAGES[c.stage]}</Pill>
        </li>); })}</ul>
    </div>
  );
}

function App() {
  const route = useRoute();
  useLucide();
  useRfMotion(route);
  const [db, setDb] = useState(initDb);
  const [toastMsg, setToast] = useState('');
  const say = (m) => { setToast(m); setTimeout(() => setToast(''), 2600); };
  const common = { db, setDb, say };
  return (
    <>
      <DemoBar onReset={() => { setDb(initDb()); say('예시 데이터를 처음 상태로 되돌렸습니다'); }} />
      <Header route={route} />
      <main id="main">
        {route === 'request' ? <Request {...common} /> : route === 'compare' ? <Compare {...common} /> : route === 'result' ? <Result {...common} /> : route === 'monthly' ? <Monthly {...common} /> : route === 'pricing' ? <Pricing {...common} /> : route === 'cases' ? <Cases db={db} /> : <Main {...common} />}
      </main>
      <footer className="app-foot"><span className="mu">수정노트 · 수정 건 요청·확인</span><button type="button" onClick={() => go('cases')}>작업 사례</button></footer>
      {toastMsg && <div className="look-toast" role="status">{toastMsg}</div>}

}

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
