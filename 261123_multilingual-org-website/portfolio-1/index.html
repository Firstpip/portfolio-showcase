var tip=document.createElement('div');tip.className='demo-hint';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','\uC2DC\uC5F0 \uC548\uB0B4 \uB3C4\uC6C0\uB9D0');
var arrow=document.createElement('span');arrow.className='demo-hint-arrow';tip.appendChild(arrow);
var t=document.createElement('b');t.textContent='\uCC98\uC74C \uC624\uC168\uB098\uC694?';tip.appendChild(t);
var p=document.createElement('div');p.textContent="'\uC2DC\uC5F0 \uC548\uB0B4'\uB97C \uB204\uB974\uBA74 \uC774 \uD654\uBA74\uC758 \uC8FC\uC694 \uAE30\uB2A5\uC744 \uB2E8\uACC4\uBCC4\uB85C \uC9C1\uC811 \uB20C\uB7EC \uBCF4\uBA70 \uD655\uC778\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694.";tip.appendChild(p);
var row=document.createElement('div');row.className='demo-hint-row';var ok=document.createElement('button');ok.type='button';ok.textContent='\uC54C\uACA0\uC5B4\uC694';row.appendChild(ok);tip.appendChild(row);
document.body.appendChild(tip);btn.classList.add('demo-hint-pulse');
function place(){var r=btn.getBoundingClientRect(),w=tip.offsetWidth,vw=document.documentElement.clientWidth;var left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16);tip.style.left=left+'px';tip.style.top=(r.bottom+12)+'px';arrow.style.left=Math.max(14,Math.min(w-26,r.left+r.width/2-left-6))+'px';}
place();requestAnimationFrame(function(){tip.classList.add('on');});
var timer=setTimeout(function(){close(false);},25000);
function close(remember){clearTimeout(timer);if(remember){try{localStorage.setItem(KEY,'1');}catch(e){}}btn.classList.remove('demo-hint-pulse');tip.classList.remove('on');setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},300);window.removeEventListener('resize',place);window.removeEventListener('scroll',place,true);document.removeEventListener('keydown',onKey);btn.removeEventListener('click',onBtn,true);}
function onKey(e){if(e.key==='Escape')close(true);}
function onBtn(){close(true);}
ok.addEventListener('click',function(){close(true);});btn.addEventListener('click',onBtn,true);document.addEventListener('keydown',onKey);window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
}
}catch(e){}})();</script>

<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
