}

function Safety() {

  const mk = () => SAFETY.map((_, k) => k < start ? true : null);
  const [i, setI] = useState(start);
  const [ans, setAns] = useState(mk);
  useEffect(() => { setI(start); setAns(mk()); }, [p]);
  const finished = i >= SAFETY.length;
  const answer = v => { setAns(a => a.map((x, k) => k === i ? v : x)); if (v === false) toastOf(`팀장 ${leadOf(ME.id).name}에게 전달했어요`); setI(n => n + 1); };
  const noN = ans.filter(a => a === false).length;
  return (
    <div className="phone-body">
      <section className="bg-[var(--n1)] px-5 pb-5 pt-4">
        <h1 className="text-[20px] font-bold tracking-[-0.03em] text-[var(--n10)]">출근 안전점검</h1>
        <div className="mt-3 flex items-baseline justify-between"><span className="text-[13.5px] text-[var(--n7)]">{TODAY_STORE.name} · {fmtD(TODAY_N)}</span><span className="num text-[14px] text-[var(--n8)]"><b className="text-[var(--n10)]">{Math.min(i + 1, 6)}</b> / 6</span></div>
        <div data-part="progress" className="p-bar mt-2"><i style={{ width: `${(Math.min(i, 6) / 6) * 100}%` }}></i></div>
      </section>
      <section className="px-5 pt-5">
        {!finished ? <>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] p-5"><div className="text-[13px] text-[var(--n7)]">문항 {i + 1}</div><div className="mt-2 text-[22px] font-bold leading-snug tracking-[-0.03em] text-[var(--n10)]" style={{ minHeight: 96 }}>{SAFETY[i]}</div></div>
          <div className="mt-4 grid grid-cols-2 gap-3">
            <button className="rounded-[var(--r-card)] bg-[var(--m600)] text-[19px] font-bold text-[var(--on-main)]" style={{ height: 64 }} onClick={() => answer(true)}>예</button>
            <button className="rounded-[var(--r-card)] border border-[var(--s3)] bg-[var(--s3-bg)] text-[19px] font-bold text-[var(--s3-text)]" style={{ height: 64 }} onClick={() => answer(false)}>아니오</button>
          </div>
          <div className="mt-3 text-[13px] text-[var(--n7)]">'아니오'를 누르면 기록으로 남고 팀장 {leadOf(ME.id).name}에게 전달돼요</div>
        </> : <div className="rounded-[var(--r-card)] bg-[var(--n1)] p-5"><div className="text-[18px] font-bold text-[var(--n10)]">6문항 답변을 마쳤어요</div><div className="mt-1 text-[14px] text-[var(--n8)]">예 {6 - noN}건 · 아니오 {noN}건{noN > 0 ? ' — 팀장에게 전달됐어요' : ''}</div><button className="mt-4 h-[56px] w-full rounded-[var(--r-card)] bg-[var(--m600)] text-[17px] font-bold text-[var(--on-main)]" onClick={() => go('main')}>출근 체크로 돌아가기</button></div>}
        <div className="mb-6 mt-5 overflow-hidden rounded-[var(--r-card)] bg-[var(--n1)]">
          {SAFETY.map((q, k) => <div key={k} data-part="check" className={cx('flex items-center gap-3 px-4 py-2.5 text-[13.5px]', k !== 0 && 'border-t border-[var(--n3)]')}><span className={cx('grid h-5 w-5 shrink-0 place-items-center rounded-full text-[11px] font-bold', ans[k] === true ? 'bg-[var(--s1)] text-[var(--n1)]' : ans[k] === false ? 'bg-[var(--s3)] text-[var(--n1)]' : 'bg-[var(--n3)] text-[var(--n7)]')}>{ans[k] === true ? <Ic name="check" size={12} /> : ans[k] === false ? '!' : k + 1}</span><span className={cx('flex-1', k === i ? 'font-semibold text-[var(--n10)]' : 'text-[var(--n8)]')}>{q}</span><span className="text-[12.5px] text-[var(--n7)]">{ans[k] === true ? '예' : ans[k] === false ? '아니오' : ''}</span></div>)}
        </div>
      </section>
    </div>
  );
}

        </div>
        <div className="mt-2 text-[13.5px] text-[var(--n7)]">{TODAY_STORE.name} · {TODAY_ASSIGN.type} · 근무조 {TODAY_STORE.shift}</div>
      </section>
      <section className="px-5 pt-4">
        {inAt ? <>
          <div className="mb-2 text-[15px] font-semibold text-[var(--n10)]">퇴근 사진 2장 <span className="num text-[var(--n7)]">({ph.filter(Boolean).length}/2)</span></div>
          <div className="grid grid-cols-2 gap-3">

              : <button key={k} className="grid aspect-[4/3] place-items-center rounded-[var(--r-panel)] border border-dashed border-[var(--n5)] bg-[var(--n1)] text-[14px] font-semibold text-[var(--n8)]" onClick={() => setPh(a => a.map((v, j) => j === k ? true : v))}><span className="inline-flex flex-col items-center gap-1"><Ic name="camera" size={22} />사진 {k + 1} 촬영</span></button>)}

        </> : <div className="rounded-[var(--r-card)] bg-[var(--n1)] p-4"><div className="text-[15px] font-semibold text-[var(--n10)]">아직 출근 전이에요</div><div className="mt-1 text-[13.5px] text-[var(--n8)]">출근 사진 2장과 안전점검을 마치면 퇴근 사진 칸이 열려요</div><button className="mt-3 h-12 w-full rounded-[var(--r-card)] bg-[var(--m600)] text-[16px] font-bold text-[var(--on-main)]" onClick={() => go('main')}>출근하러 가기</button></div>}
      </section>
      <section className="px-5 pb-6 pt-5">
        <div className="mb-2 text-[15px] font-semibold text-[var(--n10)]">최근 근무 기록</div>
        <div className="overflow-hidden rounded-[var(--r-panel)] bg-[var(--n1)]">
          {recent.map((r, i) => (
            <div key={r.n} className={cx('flex items-center gap-3 px-4 py-3', i !== 0 && 'border-t border-[var(--n3)]')}>
              <div className="num w-[68px] shrink-0 text-[14px] font-semibold text-[var(--n10)]">{fmtD(r.n)}</div>

              <div className="num w-[68px] shrink-0 text-[14px] font-semibold text-[var(--n10)]">{fmtD(c.n)}</div>

<script>
