/* ───────── F&B ───────── */
function Fnb({ w, p, fcart, setFcart, buyFnb }) {

  const setQ = (id, n) => setFcart(c => n <= 0 ? c.filter(l => l.id !== id) : c.some(l => l.id === id) ? c.map(l => l.id === id ? { ...l, q: n } : l) : c.concat({ id, q: n }));
  const seatText = ZONES.find(z => z.id === sec).name + ' ' + row + '열 ' + no + '번';
  const validate = () => { const r = Number(row), n = Number(no); if (!lines.length) return '메뉴를 먼저 담아 주세요'; if (!(r >= 1 && r <= 30)) return '열은 1~30 사이로 입력해 주세요'; if (!(n >= 1 && n <= 40)) return '좌석 번호는 1~40 사이로 입력해 주세요'; return null; };
  const submit = () => { const e = validate(); setErr(e); if (!e) setPay(true); };
  if (p.step === 'status') {
    const o = ordersOf(w).find(x => x.id === (p.order || 'F-1129-0030')) || ordersOf(w).find(x => x.kind === 'fnb');
    const idx = Math.max(0, ['received', 'cooking', 'ready', 'picked'].indexOf(o.status)); const STEPS = [['접수', '주문이 매장에 전달됐어요'], ['조리', '메뉴를 만들고 있어요'], ['픽업 대기', '매장 앞 번호판에서 받아 가세요'], ['픽업 완료', '맛있게 드세요']];
    return (
      <Screen route="fnb">

          <ol className="mt-4 space-y-0">{STEPS.map((s, i) => (<li key={s[0]} className="flex gap-3" aria-current={i === idx ? 'step' : undefined}>
            <div className="flex flex-col items-center"><span className={cx('w-7 h-7 rounded-full grid place-items-center text-[13px] font-bold', i < idx ? 'bg-[var(--s1)] text-white' : i === idx ? 'bg-[var(--m600)] text-[var(--on-main)]' : 'bg-[var(--n2)] text-[var(--n6)]')}>{i < idx ? <Icon name="check" size={15} /> : i + 1}</span>{i < STEPS.length - 1 && <span className={cx('w-0.5 h-8', i < idx ? 'bg-[var(--s1)]' : 'bg-[var(--n3)]')} />}</div>
            <div className="pb-3"><div className={cx('text-[15px] font-bold', i > idx && 'text-[var(--n6)]')}>{s[0]}{i === idx && <Tag tone="accent" className="ml-2">지금</Tag>}</div><div className="text-[13px] text-[var(--n7)]">{s[1]}</div></div></li>))}</ol></Lift>
        <div className="mx-4 mt-3"><Btn kind="secondary" className="w-full" onClick={() => go('fnb')}>새로 주문하기</Btn></div>
      </Screen>

  }
  return (
    <Screen route="fnb" overlay={<PaySheet open={pay} onClose={() => setPay(false)} title="결제 수단 선택" rows={lines.map(l => [l.f.name + ' × ' + l.q, fmtWon(l.f.price * l.q)]).concat([['좌석', seatText]])} total={total} onPay={() => { const id = buyFnb(lines, seatText); setPay(false); go('fnb', { step: 'status', order: id }); }} />}>
      <Top title="경기장 주문" sub="좌석에서 주문하고 준비되면 받아 가세요" stats={[['담은 메뉴', sum(lines, l => l.q) + '개'], ['예상 대기', '약 8분']]} />
      {(() => { const mo = ordersOf(w).filter(o => o.owner === 'me' && o.kind === 'fnb' && o.status !== 'picked' && o.status !== 'refunded')[0]; if (!mo) return null; const ix = ['received', 'cooking', 'ready'].indexOf(mo.status); return (

      <Lift className={cx('!p-3', mo0 && '!mt-3')}><div className="divide-y divide-[var(--n3)]">{MENU.map(f => { const l = fcart.find(x => x.id === f.id); return (

          <label className="block"><span className="text-[12px] text-[var(--n7)]">번호</span><input inputMode="numeric" value={no} onChange={e => setNo(e.target.value.replace(/\D/g, '').slice(0, 2))} placeholder="15" aria-invalid={!!err && !(Number(no) >= 1 && Number(no) <= 40)} className="mt-1 w-full h-[var(--c-input-h)] px-2 border border-[var(--n4)] rounded-[var(--r-field)] text-[15px]" /></label>

        <div className="mt-3 flex items-baseline justify-between border-t border-[var(--n3)] pt-3"><span className="text-[13px] text-[var(--n7)]">메뉴 {sum(lines, l => l.q)}개</span><span className="text-[22px] font-extrabold num">{fmtWon(total)}</span></div>
        <Btn className="w-full mt-3" onClick={submit}>주문하고 결제하기</Btn></Card>
      <div className="mx-4 mt-3 mb-4"><Btn kind="text" onClick={() => go('fnb', { step: 'status', order: 'F-1129-0030' })}>내 진행 중인 주문 보기</Btn></div>
    </Screen>

/* ───────── 아카데미·사회공헌 ───────── */
function Apply({ w, p, submitApp }) {

  const [f, setF] = useState({ name: '정민서', phone: '010-4821-7390', qty: 1, reason: '' }); const [err, setErr] = useState({});
  useEffect(() => { setErr({}); }, [p]);

  const seg = (<div className="flex gap-1.5" role="tablist" aria-label="신청 구분">{[['programs', '프로그램'], ['mine', '내 신청 내역 ' + mine.length]].map(t => <button type="button" key={t[0]} role="tab" aria-selected={tab === t[0] || (tab === 'form' && t[0] === 'programs')} onClick={() => go('apply', { tab: t[0] })} className={cx('h-9 px-3.5 rounded-full text-[14px] font-semibold border', (tab === t[0] || (tab === 'form' && t[0] === 'programs')) ? 'bg-[var(--n10)] border-[var(--n10)] text-white' : 'border-[var(--n4)] text-[var(--n7)]')}>{t[1]}</button>)}</div>);
  if (tab === 'form' && prog) {
    const left = prog.cap - progFilled(w, prog);
    const submit = () => { const e = {}; if (!f.name.trim()) e.name = '이름을 입력해 주세요'; if (!/^01\d-\d{3,4}-\d{4}$/.test(f.phone)) e.phone = '010-0000-0000 형식으로 입력해 주세요'; if (f.reason.trim().length < 5) e.reason = '신청 사유를 5자 이상 적어 주세요'; if (f.qty > left) e.qty = '남은 정원은 ' + left + '명이에요'; setErr(e); if (Object.keys(e).length) return; submitApp(prog, f); setF({ ...f, reason: '' }); go('apply', { tab: 'mine' }); };
    return (
      <Screen route="apply">
        <Top title="신청서 작성" sub={prog.kind + ' · ' + prog.name} back={() => go('apply')} />
        <Lift><div className="text-[13px] text-[var(--n7)]">{prog.when}</div><div className="mt-1 text-[13px]">정원 <b className="num">{prog.cap}</b>명 · 남은 자리 <b className="num">{left}</b>명</div>
          {[['name', '신청자 이름', 'text'], ['phone', '연락처', 'tel']].map(x => <label key={x[0]} className="block mt-3"><span className="text-[13px] font-semibold">{x[1]}</span><input type={x[2]} value={f[x[0]]} onChange={e => setF({ ...f, [x[0]]: e.target.value })} aria-invalid={!!err[x[0]]} className="mt-1 w-full h-[var(--c-input-h)] px-3 border border-[var(--n4)] rounded-[var(--r-field)] text-[15px]" />{err[x[0]] && <span className="text-[12px] font-semibold text-[var(--s2-text)]">{err[x[0]]}</span>}</label>)}
          <div className="mt-3 flex items-center justify-between"><span className="text-[13px] font-semibold">참가 인원</span><Stepper value={f.qty} max={Math.max(1, Math.min(5, left))} onChange={n => setF({ ...f, qty: n })} label="참가 인원" /></div>{err.qty && <span className="text-[12px] font-semibold text-[var(--s2-text)]">{err.qty}</span>}
          <label className="block mt-3"><span className="text-[13px] font-semibold">신청 사유</span><textarea value={f.reason} onChange={e => setF({ ...f, reason: e.target.value })} rows={3} aria-invalid={!!err.reason} className="mt-1 w-full px-3 py-2 border border-[var(--n4)] rounded-[var(--r-field)] text-[15px]" placeholder="참여하고 싶은 이유를 적어 주세요" />{err.reason && <span className="text-[12px] font-semibold text-[var(--s2-text)]">{err.reason}</span>}</label>
          <Btn className="w-full mt-4" disabled={left <= 0} onClick={submit}>{left <= 0 ? '정원이 마감됐어요' : '신청서 제출하기'}</Btn></Lift>

      <Screen route="apply">

        <Lift>{seg}<div className="mt-3 space-y-2">{mine.map(a => { const g = PROGRAMS.find(x => x.id === a.pid); return (

      </Screen>
    );
  }
  const openCnt = PROGRAMS.filter(g => progFilled(w, g) < g.cap).length;
  return (
    <Screen route="apply">
      <Top title="아카데미·사회공헌" sub="신청서를 내면 구단 담당자가 확인하고 승인해요" stats={[['모집 중', openCnt + '건'], ['내 신청', mine.length + '건']]} />
      <Lift>{seg}<div className="mt-3 space-y-2">{PROGRAMS.map(g => { const fl = progFilled(w, g); const full = fl >= g.cap; return (

    </Screen>
  );

    </>

<script>
