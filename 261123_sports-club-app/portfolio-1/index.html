/* 좌석 구역도 */

  const col = (z) => { const r = zoneRemain(sold, match, z) / z.cap; return r <= 0 ? "var(--n4)" : r <= .08 ? "var(--m800)" : r <= .15 ? "var(--m600)" : r <= .3 ? "var(--m400)" : "var(--m200)"; };
  const Z = (id, d, tx, ty, label) => { const zn = ZONES.find(z => z.id === id); return <g key={id} role="button" tabIndex={0} aria-label={zn.name} onClick={() => onPick(id)} onKeyDown={e => e.key === "Enter" && onPick(id)} style={{ cursor: "pointer" }}><path d={d} fillRule="evenodd" fill={col(zn)} stroke={zone === id ? "var(--n9)" : "var(--n0)"} strokeWidth={zone === id ? 3 : 1.5} /><text x={tx} y={ty} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--on-main)" style={{ pointerEvents: "none" }}>{label}</text></g>; };
  return <svg viewBox="0 0 340 240" className="w-full" role="group" aria-label="경기장 구역도"><path d="M58 14h224a44 44 0 0 1 44 44v124a44 44 0 0 1-44 44H58a44 44 0 0 1-44-44V58a44 44 0 0 1 44-44z" fill="none" />
    {Z("cheer", "M58 14h224a44 44 0 0 1 44 44v124a44 44 0 0 1-44 44H58a44 44 0 0 1-44-44V58a44 44 0 0 1 44-44zM76 46h188a26 26 0 0 1 26 26v96a26 26 0 0 1-26 26H76a26 26 0 0 1-26-26V72a26 26 0 0 1 26-26z", 170, 31, "2층 응원석")}
    {Z("main", "M76 46h188a26 26 0 0 1 26 26v96a26 26 0 0 1-26 26H76a26 26 0 0 1-26-26V72a26 26 0 0 1 26-26zM90 70h160a12 12 0 0 1 12 12v76a12 12 0 0 1-12 12H90a12 12 0 0 1-12-12V82a12 12 0 0 1 12-12z", 170, 60, "1층 메인석")}
    {Z("family", "M50 90h28v60H50zM262 90h28v60h-28z", 0, 0, "")}
    
    {Z("premium", "M90 70h160v14H90z", 170, 81, "프리미엄")}
    <rect x="92" y="92" width="156" height="56" fill="var(--s1)" opacity=".28" /><rect x="92" y="92" width="156" height="56" fill="none" stroke="var(--n9)" strokeWidth="1" opacity=".6" /><line x1="170" y1="92" x2="170" y2="148" stroke="var(--n9)" opacity=".6" /><circle cx="170" cy="120" r="12" fill="none" stroke="var(--n9)" opacity=".6" /></svg>;
}

  if (step === "pay") return <div className="relative min-h-full"><AppBar title="예매 확인" back="tickets" />
    <div className="px-5 pt-4"><div className="border border-[var(--n4)] bg-[var(--n1)] p-4"><p className="num text-[13px] text-[var(--n7)]">{m.date.slice(5).replace("-", ".")}({m.dow}) {m.time} · {mid}</p><p className="text-[17px] font-bold mt-1">블레이즈 FC 대 {m.opp}</p><dl className="mt-3 text-[14px] grid grid-cols-[72px_1fr] gap-y-1.5"><dt className="text-[var(--n7)]">좌석</dt><dd>{z.name}</dd><dt className="text-[var(--n7)]">매수</dt><dd className="num">{qty}매 × {fmtWon(z.price)}</dd><dt className="text-[var(--n7)]">합계</dt><dd className="num font-bold text-[17px]">{fmtWon(total)}</dd></dl></div>
      <h3 className="text-[15px] font-bold mt-5 mb-2">결제수단</h3></div>

  return <div><AppBar title="예매 완료" back="tickets" />

      <p className="num text-[13px] text-[var(--n7)] mt-3">{z.name} 잔여 {fmtNum(zoneRemain(st.sold, mid, z))}석</p>
      <div className="grid grid-cols-2 gap-2 mt-4"><Big tone="line" onClick={() => setRefund(true)} disabled={o.status === "환불 요청"}>{o.status === "환불 요청" ? "환불 요청됨" : "환불 요청"}</Big><Big onClick={() => go("my")}>내 예매 보기</Big></div></div>

/* 샵 */
function Shop() {
  const st = useST(); const p = useParams(); const [cat, setCat] = useState(p.cat || "전체"); const [item, setItem] = useState(p.item || null); const [opt, setOpt] = useState(null); const [ask, setAsk] = useState(false);
  useEffect(() => { setCat(p.cat || "전체"); setItem(p.item || null); setOpt(p.bought || null); }, [p]);
  const buy = (pr, o) => setST(s => s.orders.some(x => x.id === SH_ORDER_NO) || s.stock[pr.id][o] < 1 ? s : { ...s, stock: { ...s.stock, [pr.id]: { ...s.stock[pr.id], [o]: s.stock[pr.id][o] - 1 } }, orders: [{ id: SH_ORDER_NO, kind: "상품", who: ME.name, at: "11.29 12:41", lines: [L(`${pr.name} ${o}`, pr.price, 1)], status: "결제 완료", mine: true }, ...s.orders] });
  useEffect(() => { if (p.bought && p.item) { const pr = PRODUCTS.find(x => x.id === p.item); if (pr) { buy(pr, p.bought); } } }, [p.bought, p.item]);
  const cats = ["전체", "유니폼", "키즈", "응원도구", "모자·가방", "잡화"];

  if (pr) { const stock = st.stock[pr.id]; const bought = st.orders.find(o => o.id === SH_ORDER_NO && pr.id === "P-101"); const ph = null;
    return <div className="relative min-h-full"><AppBar title={pr.name} back="shop" />
      {ph ? <img src={ph.url} alt={pr.name} className="w-full h-[170px] object-cover" /> : <div className="h-[96px] bg-[var(--m800)] px-5 flex items-end pb-3"><b className="text-[28px] font-extrabold text-[var(--on-main)] tracking-[-0.03em]">{pr.cat === "유니폼" || pr.cat === "키즈" ? "26-27 시즌" : pr.cat}</b></div>}

        <div className="flex items-center justify-between mt-5 mb-2"><h3 className="text-[15px] font-bold">옵션별 남은 수량</h3><span className="text-[12px] text-[var(--n7)] flex items-center gap-1.5"><i className="w-2 h-2 rounded-full bg-[var(--s1)]" />실시간</span></div>
        <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="옵션">{pr.opts.map(([k]) => { const n = stock[k]; return <button key={k} type="button" role="radio" aria-checked={opt === k} disabled={n === 0} onClick={() => setOpt(k)} className={cx("min-w-[64px] px-3 py-2 border text-left", opt === k ? "border-[var(--m600)] bg-[var(--m900)]" : "border-[var(--n4)]")}><b className="block text-[15px]">{k}</b><span className={cx("num text-[12px]", n === 0 ? "text-[var(--n6)]" : n <= 5 ? "text-[var(--s3)]" : "text-[var(--n7)]")}>{stockText(n)}</span></button>; })}</div>
        {bought && <p className="mt-4 text-[14px] text-[var(--s1)] flex items-center gap-1.5"><Icon name="circle-check" size={18} />주문 {SH_ORDER_NO} · {opt || "L"} 사이즈 구매 완료</p>}
        <Big className="mt-5 mb-6" disabled={!opt || !!bought} onClick={() => setAsk(true)}>{bought ? "구매 완료" : opt ? `${opt} 구매하기` : "옵션을 골라 주세요"}</Big></div>

  const list = PRODUCTS.filter(x => cat === "전체" || x.cat === cat);
  return <div><AppBar title="구단 샵" /><div className="flex gap-2 overflow-x-auto no-bar px-5 py-3">{cats.map(c => <Chip key={c} on={cat === c} onClick={() => setCat(c)}>{c}</Chip>)}</div>

    <ul className="px-5">{list.map(x => { const sto = st.stock[x.id]; const total = sum(Object.values(sto), n => n); const out = total === 0; const ph = null; return <li key={x.id} className="border-b border-[var(--n3)]"><button type="button" onClick={() => { setItem(x.id); go("shop", { item: x.id }); }} className="w-full flex items-center gap-3 py-3.5 text-left">{ph && <img src={ph.url} alt={x.name} className="w-16 h-16 object-cover" />}<span className="flex-1 min-w-0"><span className="block text-[12px] text-[var(--n7)]">{x.cat}</span><span className="block text-[16px] font-bold truncate">{x.name}</span><span className="block text-[12px] text-[var(--n7)] num mt-0.5">{x.opts.length > 1 ? x.opts.map(([k]) => `${k} ${sto[k]}`).join(" · ") : `남은 수량 ${fmtNum(total)}`}</span></span><span className="text-right"><b className="num block text-[16px]">{fmtWon(x.price)}</b>{out && <Tag tone="line">품절</Tag>}</span></button></li>; })}</ul></div>;
}

  const [track, setTrack] = useState(p.track || null); const [stage, setStage] = useState(0);
  useEffect(() => { setTrack(p.track || null); }, [p]);
  const mine = st.orders.filter(o => o.kind === "F&B" && o.mine);
  const fb = st.orders.find(o => o.id === FB_ORDER_NO);
