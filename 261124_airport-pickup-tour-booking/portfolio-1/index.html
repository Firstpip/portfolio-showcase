function useDraftCalc(d) {
  return useMemo(() => {
    const auto = autoVeh(d.pax, d.bags);
    const pick = d.vehPick && VEH[d.vehPick] ? d.vehPick : null;
    let veh = auto; let over = auto === null;
    if (auto && pick && VEH[pick].rank > VEH[auto].rank) veh = pick;
    const used = veh || 'van';
    const q = quote({ route: d.route, veh: used, type: d.type, time: d.time, stops: d.stops, seats: d.seats });
    const closed = CLOSED.includes(d.date);
    const free = new Date(new Date(d.date + 'T' + d.time + ':00+09:00').getTime() - 48 * 3600000);
    const dl = addHours(NOW.toISOString(), 24);
    return { veh: used, auto, over, q, closed, free, dl, changed: auto && veh !== auto };
  }, [d.route, d.type, d.time, d.pax, d.bags, d.stops, d.seats, d.date, d.vehPick]);
}
