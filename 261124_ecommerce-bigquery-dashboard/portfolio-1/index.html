/* ── 월 손익 ── */
function Waterfall({ t }) {
  const steps = [['매출', t.rev, 'total'], ['원가', -t.cogs, 'cut'], ['광고비', -t.ad, 'cut'], ['기타 비용', -t.other, 'cut'], ['이익', t.profit, 'end']];
  const W = 640, H = 230, pl = 12, pr = 12, top = 24, bot = 34; const bw = 78, gap = (W - pl - pr - bw * 5) / 4;
  const mx = t.rev * 1.05, y = (v) => top + (1 - v / mx) * (H - top - bot);
  let run = 0;
  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full h-auto text-[var(--n7)]" role="img" aria-label="매출에서 이익까지 워터폴">
      <line x1={pl} x2={W - pr} y1={y(0)} y2={y(0)} stroke="currentColor" opacity="0.3" />
      {steps.map(([l, v, k], i) => {
        let a, b; if (k === 'total') { a = 0; b = v; run = v; } else if (k === 'cut') { a = run + v; b = run; run = a; } else { a = Math.min(0, v); b = Math.max(0, v); }
        const x = pl + i * (bw + gap); const yt = y(b), yb = y(a);
        const fill = k === 'total' ? 'var(--m600)' : k === 'cut' ? 'var(--n4)' : (v >= 0 ? 'var(--s1)' : 'var(--s2)');
        return <g key={l}><rect x={x} y={yt} width={bw} height={Math.max(2, yb - yt)} rx="3" fill={fill} /><text x={x + bw / 2} y={yt - 7} textAnchor="middle" fontSize="12" fontWeight="700" fill="currentColor" className="num">{(v < 0 ? '−' : '') + man(Math.abs(v))}</text><text x={x + bw / 2} y={H - 12} textAnchor="middle" fontSize="12" fill="currentColor">{l}</text></g>;
      })}
    </svg>
  );
}

<script>
(function(){try{
