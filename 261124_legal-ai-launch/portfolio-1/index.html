    { id: 'upload', label: '계약서 올리기', icon: 'upload' },
    { id: 'review', label: '조항별 검토', icon: 'file-search' },
    { id: 'plan', label: '이용권·잔여 횟수', icon: 'ticket' },
  ];
  const ACCEPT = ['pdf', 'doc', 'docx'];
  const MAX_MB = 20;
  const VIEW_DOC = DB.docs[0];
  const MARK_NOS = [1, 2, 5, 9, 4, 6];
  const marks = MARK_NOS.map((n) => DB.clauses.find((c) => c.no === n));
  const riskMarks = marks.filter((c) => c.level !== '낮음');
  const checkMarks = marks.filter((c) => c.level === '낮음');
  const sub = DB.clauses.find((c) => c.no === 3);
  const myOrders3 = DB.myOrders.slice(-3).reverse();
  const recentUse = DB.usage.slice(0, 3).map((u) => ({ ...u, docName: (DB.docs.find((d) => d.id === u.doc) || {}).name }));
  const myApproved = DB.myOrders.filter((o) => o.status === '승인').length;

  const pickTab = (t) => (TABS.some((x) => x.id === t) ? t : null);
  const [tab, setTab] = useState(pickTab(params.tab) || (params.clause ? 'review' : 'upload'));
  const [sel, setSel] = useState(Number(params.clause) && MARK_NOS.includes(Number(params.clause)) ? Number(params.clause) : 5);
  const [items, setItems] = useState(() => [{ ...DB.uploads[0], id: 'u0' }]);
  const [err, setErr] = useState('');
  const fileRef = React.useRef(null);
  const paperRef = React.useRef(null);

  useEffect(() => {
    const t = pickTab(params.tab);
    if (t) setTab(t);
    const c = Number(params.clause);
    if (c && MARK_NOS.includes(c)) { setSel(c); if (!t) setTab('review'); }
  }, [params]);

  useEffect(() => {
    if (RF_STILL) return undefined;
    const timer = setInterval(() => {
      setItems((list) => {
        if (!list.some((u) => u.pct < 100)) return list;
        let finished = 0;
        const next = list.map((u) => {
          if (u.pct >= 100) return u;
          const step = u.mb > 2 ? 3 : u.mb > 1 ? 5 : 8;
          const pct = Math.min(100, u.pct + step);
          if (pct >= 100) finished += 1;
          return { ...u, pct };
        });
        if (finished) setTimeout(() => toast('내 문서함에 검토 대기로 올라갔어요'), 0);
        return next;
      });
    }, 650);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    const box = paperRef.current;
    if (!box || tab !== 'review') return;
    const el = box.querySelector('[data-clause="' + sel + '"]');
    if (el) box.scrollTo({ top: Math.max(0, el.offsetTop - 90), behavior: RF_STILL ? 'auto' : 'smooth' });
  }, [sel, tab]);

  function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const mb = f.size / 1048576;
    setTab('upload');
    if (!ACCEPT.includes(ext)) { setErr(f.name + ' 파일은 올릴 수 없어요. PDF·Word(doc, docx) 계약서만 검토할 수 있어요. 이용권은 차감되지 않았어요.'); return; }
    if (mb > MAX_MB) { setErr('파일이 ' + mb.toFixed(1) + 'MB 예요. ' + MAX_MB + 'MB 이하로 줄이거나 나눠서 올려 주세요. 이용권은 차감되지 않았어요.'); return; }

SCREENS["review"] = function Review() {
  const params = useParams() || {};
  const LEVELS = ['전체', '높음', '중간', '낮음'];
  const clauses = DB.clauses;
  const doc = DB.docs.find((d) => d.name === '매장 임대차계약서_성수점.pdf') || DB.docs[0];
  const highCount = clauses.filter((c) => c.level === '높음').length;
  const defaultNo = (clauses.find((c) => c.level === '높음') || clauses[0]).no;
  const validLevel = (l) => (LEVELS.includes(l) ? l : '전체');
  const validNo = (n) => { const v = Number(n); return clauses.some((c) => c.no === v) ? v : defaultNo; };

  const [level, setLevel] = useState(validLevel(params.level));
  const [sel, setSel] = useState(params.clause ? validNo(params.clause) : defaultNo);
  const viewerRef = React.useRef(null);
  const paraRefs = React.useRef({});

  useEffect(() => {
    const lv = validLevel(params.level);
    setLevel(lv);
    const no = params.clause ? validNo(params.clause) : defaultNo;
    setSel(no);
  }, [params.level, params.clause]);

  const shown = useMemo(() => clauses.filter((c) => level === '전체' || c.level === level), [level]);
  const isShown = (no) => shown.some((c) => c.no === no);
  const cur = clauses.find((c) => c.no === sel) || clauses[0];

  /* 선택한 조항 위치로 문서 뷰어 안쪽만 스크롤 */
  const firstRun = React.useRef(true);
  useEffect(() => {
    const box = viewerRef.current; const el = paraRefs.current[sel];
    if (!box || !el) return;
    const top = Math.max(0, el.offsetTop - 16);
    const smooth = !firstRun.current; firstRun.current = false;
    if (box.scrollTo) box.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' }); else box.scrollTop = top;
  }, [sel]);

  /* 문서 본문 — 조항 문단(위험 문장에 형광). 조항 번호와 연결된 문장은 hl 로 표시 */
  const BODY = {
    3: ['임대차 기간은 인도일로부터 24개월로 하며, 임차인은 ', { hl: '계약갱신요구권을 법령이 정한 기간 안에서 행사할 수 있다' }, '.'],

    14: ['임차인이 계약 기간 중 해지하는 경우 ', { hl: '월 차임의 6개월분을 위약금으로 지급' }, '한다.'],

    20: ['이 계약에 관한 분쟁은 ', { hl: '임대인 주소지를 관할하는 법원' }, '을 제1심 관할로 한다.'],
    0: ['임차인이 지급하는 금액은 ', { hl: '기타 임대인이 정하는 사항에 따른다' }, '는 문구로 정해지는 특약을 포함한다.'],
  };
  const NO_OF_WHERE = (w) => (w === '별지' ? 0 : Number(String(w).replace(/[^0-9]/g, '')));
  const ARTICLES = [
    { art: 1, name: '목적', plain: '이 계약은 임대인이 임차인에게 아래 점포를 임대하고 임차인이 이를 사용·수익하는 조건을 정함을 목적으로 한다.' },

  ].sort((a, b) => (a.art === 0 ? 100 : a.art) - (b.art === 0 ? 100 : b.art));

  };

  const copyFix = async () => {
    try { if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(cur.fix); } catch (e) { /* 권한이 없으면 안내만 */ }
    toast('수정 문구를 복사했어요');
  };

  const pick = (no) => { setSel(no); };
  const changeLevel = (l) => {
    setLevel(l);
    const list = clauses.filter((c) => l === '전체' || c.level === l);
    if (!list.some((c) => c.no === sel) && list.length) setSel(list[0].no);
  };
  const countOf = (l) => (l === '전체' ? clauses.length : clauses.filter((c) => c.level === l).length);

  return (
    <div className="pt-10">
      <section className="rf-band" aria-labelledby="rf-band-title">
        <div className="rf-band-in" style={{ paddingTop: 30, paddingBottom: 40, alignItems: 'center' }}>
          <h1 id="rf-band-title" className="rf-fade" style={{ fontSize: 30, lineHeight: 1.2 }}>{doc.name}</h1>
          <dl className="flex gap-8 text-left m-0 rf-fade">
            {[['검토한 조항', clauses.length + '개'], ['높음 등급', highCount + '건'], ['검토 일시', doc.at]].map(([k, v]) => (
              <div key={k}><dt className="text-[length:var(--c-small)] opacity-70">{k}</dt><dd className="m-0 mt-0.5 text-[18px] font-bold tracking-[var(--t-track)] tabular-nums">{v}</dd></div>
            ))}
          </dl>
        </div>
      </section>
      <div className="rf-in -mt-4 relative z-[3] pb-16">
        <div className="bg-[var(--n0)] border border-[var(--n3)] rounded-[var(--r-card)] overflow-hidden">
          <div className="grid lg:grid-cols-[320px_minmax(0,1fr)_340px]">
            {/* 왼쪽 — 필터와 조항 목록 */}
            <section className="border-b lg:border-b-0 lg:border-r border-[var(--n3)] min-w-0" aria-label="조항 목록">
              <div className="p-4 border-b border-[var(--n2)]">
                <div className="text-[length:var(--c-small)] font-semibold text-[var(--n6)] mb-2">위험 등급</div>
                <div className="flex flex-wrap gap-1.5" role="group" aria-label="위험 등급 필터">
                  {LEVELS.map((l) => (
                    <BtnLine key={l} active={level === l} onClick={() => changeLevel(l)}>
                      {l}<span className="tabular-nums opacity-70">{countOf(l)}</span>
                    </BtnLine>
                  ))}
                </div>
              </div>
              <ul className="list-none m-0 p-0 max-h-[540px] overflow-y-auto">
                {shown.map((c) => {
                  const on = c.no === sel;
                  return (
                    <li key={c.no}>
                      <button type="button" onClick={() => pick(c.no)} aria-current={on ? 'true' : undefined}
                        className={cx('w-full text-left px-4 py-3 border-b border-[var(--n2)] flex gap-3 hover:bg-[var(--n1)]', on && 'bg-[var(--m50)] shadow-[inset_3px_0_0_var(--m600)]')}>
                        <span className="w-11 shrink-0 pt-0.5 text-[length:var(--c-small)] font-semibold text-[var(--n7)] tabular-nums">{c.where}</span>
                        <span className="min-w-0 flex-1">
                          <span className="flex items-center justify-between gap-2">
                            <span className={cx('truncate text-[length:var(--c-body)] font-semibold', on ? 'text-[var(--m700)]' : 'text-[var(--n9)]')}>{c.title}</span>
                            <Tag tone={levelTone(c.level)}>{c.level}</Tag>
                          </span>
                                                    <span className="block text-[length:var(--c-small)] text-[var(--n7)] mt-1 line-clamp-1">{c.why}</span>
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            </section>

            {/* 가운데 — 코드로 그린 계약서 문서 */}
            <section className="min-w-0 bg-[var(--n2)] p-3 sm:p-4" aria-label="계약서 문서">
              <div ref={viewerRef} className="relative max-h-[540px] overflow-y-auto bg-[var(--n0)] border border-[var(--n3)] rounded-[var(--r-card)] px-8 sm:px-12 py-7">
                <div className="text-center mb-5">
                  <div className="text-[20px] font-bold tracking-[0.3em] text-[var(--n10)]">상가건물 임대차계약서</div>
                  <div className="mt-2 text-[length:var(--c-small)] text-[var(--n6)]">{doc.pages}쪽 중 본문 발췌</div>
                </div>
                <div className="space-y-5 text-[length:var(--c-body)] leading-[1.9] text-[var(--n9)]" style={{ fontFamily: 'inherit' }}>
                  {ARTICLES.map((a) => {
                    if (a.sign) {
                      return (
                        <div key="sign" className="pt-8 mt-4 border-t border-[var(--n3)] grid grid-cols-2 gap-6 text-[length:var(--c-small)] text-[var(--n7)]">
                          {['임대인', '임차인'].map((r) => (
                            <div key={r} className="flex items-end gap-2">{r}<span className="flex-1 border-b border-[var(--n6)] h-6" /><span className="text-[var(--s2)] border border-[var(--s2)] rounded-full w-8 h-8 inline-flex items-center justify-center text-[11px] font-bold shrink-0">인</span></div>
                          ))}
                        </div>
                      );
                    }
                    const heading = a.art === 0 ? '별지 특약 사항' : '제' + a.art + '조 (' + a.name + ')';
                    const c = a.clause;
                    const on = c && isShown(c.no);
                    return (
                      <p key={a.art} ref={(el) => { if (c) paraRefs.current[c.no] = el; }} onClick={c ? () => pick(c.no) : undefined}
                        className={cx('m-0 scroll-mt-4', c && 'cursor-pointer')}>
                        <b className="text-[var(--n10)]">{heading}</b>{' '}
                        {c ? BODY[a.art].map((seg, i) => (typeof seg === 'string' ? <span key={i}>{seg}</span> :
                          <mark key={i} className="text-inherit rounded-[2px] px-0.5 [box-decoration-break:clone]" style={hlStyle(c, on)}>{seg.hl}</mark>)) : a.plain}
                      </p>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* 오른쪽 — 선택 조항의 근거·이유·수정 제안 */}
            <aside className="border-t lg:border-t-0 lg:border-l border-[var(--n3)] p-5 min-w-0" aria-label="선택한 조항">
              <div className="flex items-center gap-2 text-[length:var(--c-small)] text-[var(--n6)]">
                <span>{cur.where}</span>
                <span className="ml-auto"><Tag tone={levelTone(cur.level)}>{cur.level}</Tag></span>
              </div>
              <h2 className="mt-2 mb-0 text-[length:var(--t-section)] font-bold tracking-[var(--t-track)] text-[var(--n10)] leading-tight">{cur.title}</h2>

              <div className="mt-5">
                <div className="flex items-center gap-1.5 text-[length:var(--c-small)] font-semibold text-[var(--n6)]"><Icon name="scale" size={14} />근거 조문</div>
                <p className="mt-1.5 mb-0 text-[length:var(--c-body)] text-[var(--n9)] font-medium">{cur.law || '해당 조문이 없는 계약 관행 점검 항목입니다.'}</p>
              </div>
              <div className="mt-5">
                <div className="flex items-center gap-1.5 text-[length:var(--c-small)] font-semibold" style={{ color: cur.level === '높음' ? 'var(--s2-text)' : 'var(--n6)' }}><Icon name="triangle-alert" size={14} />왜 위험한가요</div>
                <p className="mt-1.5 mb-0 text-[length:var(--c-body)] leading-[1.7] text-[var(--n8)]">{cur.why}</p>
              </div>
              <div className="mt-5 rounded-[var(--r-card)] border border-[var(--n3)] bg-[var(--n1)] p-4">
                <div className="flex items-center gap-1.5 text-[length:var(--c-small)] font-semibold text-[var(--m700)]"><Icon name="pencil-line" size={14} />수정 제안</div>
                <p className="mt-1.5 mb-0 text-[length:var(--c-body)] leading-[1.7] text-[var(--n9)]">{cur.fix}</p>
              </div>
              <BtnPrimary className="w-full mt-5" onClick={copyFix}><Icon name="copy" size={16} />수정 문구 복사</BtnPrimary>
            </aside>
          </div>

          {/* 면책 고지 — 항상 보임 */}
          <div className="flex items-start gap-2 px-5 py-3.5 border-t border-[var(--n3)] bg-[var(--n1)] text-[length:var(--c-small)] text-[var(--n7)] leading-relaxed">
            <Icon name="info" size={14} />
            <p className="m-0">AI 검토는 법률 자문이 아닙니다. 위험 등급과 수정 제안은 계약서 문구를 바탕으로 한 참고 의견이며, 서명 전에 중요한 조항은 변호사 등 전문가와 확인해 주세요.</p>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ── 화면 usage (screens/usage.jsx) ── */
SCREENS["usage"] = function Usage() {
  const params = useParams();
  const normTab = (t) => (t === 'pay' ? 'pay' : 'usage');
  const [tab, setTab] = useState(normTab(params.tab));
  const [orderNo, setOrderNo] = useState(params.order || '');
  useEffect(() => {
    setTab(params.order ? 'pay' : normTab(params.tab));
    setOrderNo(params.order || '');
  }, [params]);

  const docName = (id) => { const d = DB.docs.find((x) => x.id === id); return d ? d.name : id; };
  const usageRows = useMemo(() => [...DB.usage].sort((a, b) => (a.at < b.at ? 1 : -1)), []);
  const payRows = useMemo(() => [...DB.myOrders].sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1)), []);
  const pct = DB.myGranted > 0 ? Math.round((DB.remaining / DB.myGranted) * 100) : 0;
  const usedPct = 100 - pct;
  const order = orderNo ? DB.orders.find((o) => o.no === orderNo) : null;
  const plan = order ? DB.planOf(order.plan) : null;
  const dots = (d) => d.replace(/-/g, '.');

  const pickTab = (t) => go('usage', { tab: t });
  const openOrder = (no) => go('usage', { tab: 'pay', order: no });
  const closeOrder = () => go('usage', { tab: 'pay' });

  const summary = [
    { k: '남은 검토', v: DB.remaining, u: '회', big: true },
    { k: '이번 달 사용', v: DB.usedThisMonth, u: '회' },
    { k: '총 지급', v: DB.myGranted, u: '회' },
  ];

  return (
    <div className="pt-10">
      <Band
        title="이용 내역"
        sub="이번 달 검토 차감 내역과 결제 내역을 한곳에서 확인합니다."
        right={
          <dl className="flex items-end gap-8">
            {summary.map((s) => (
              <div key={s.k} className={s.big ? '' : 'pb-1'}>
                <dt className="text-[length:var(--c-small)]" style={{ color: 'var(--rf-ink-2)' }}>{s.k}</dt>
                <dd className="m-0 num font-bold tracking-[var(--t-track)] leading-none mt-1" style={{ color: s.big ? 'var(--m200)' : 'var(--rf-ink)', fontSize: s.big ? 'var(--t-hero)' : 'var(--t-section)' }}>
                  {s.v}<span className="text-[length:var(--c-body)] font-semibold ml-1" style={{ color: 'var(--rf-ink-2)' }}>{s.u}</span>
                </dd>
              </div>
            ))}
          </dl>
        }
      />

      <div className="rf-in">
        <div className="-mt-6 relative z-[3] bg-[var(--n0)] border border-[var(--n3)] rounded-[var(--r-card)] p-[var(--c-card-px)]">
          {DB.remaining === 0 && (
            <div className="mb-5 flex flex-wrap items-center gap-3 rounded-[var(--r-card)] border border-[var(--s3)] bg-[var(--s3-bg)] px-4 py-3">
              <Icon name="ticket" size={18} className="text-[var(--s3-text)]" />
              <p className="m-0 flex-1 min-w-[220px] text-[length:var(--c-body)] text-[var(--s3-text)] font-semibold">남은 검토 횟수가 없어요. 계약서를 올리려면 먼저 이용권을 골라 주세요.</p>
              <BtnLine onClick={() => go('billing', {})}>이용권 고르기<Icon name="chevron-right" size={14} /></BtnLine>
            </div>
          )}

          <section aria-label="잔여 횟수" className="flex flex-wrap items-center gap-x-8 gap-y-3 pb-5 border-b border-[var(--n2)]">
            <div className="min-w-[160px]">
              <p className="m-0 text-[length:var(--c-small)] text-[var(--n6)]">이번 달 이용권 기준</p>
              <p className="m-0 mt-0.5 text-[length:var(--c-body)] font-semibold text-[var(--n10)]">총 {DB.myGranted}회 중 <span className="num">{DB.usedThisMonth}회</span> 사용</p>
            </div>
            <div className="flex-1 min-w-[260px]">
              <div className="h-2.5 rounded-full bg-[var(--n2)] overflow-hidden flex" role="progressbar" aria-valuemin={0} aria-valuemax={DB.myGranted} aria-valuenow={DB.remaining} aria-label="남은 검토 횟수">
                <div className="h-full bg-[var(--n8)]" style={{ width: usedPct + '%' }} />
                <div className="h-full bg-[var(--m600)]" style={{ width: pct + '%' }} />
              </div>
              <div className="mt-1.5 flex justify-between text-[length:var(--c-small)] text-[var(--n6)]">
                <span className="inline-flex items-center gap-1.5"><i className="inline-block w-2 h-2 rounded-full bg-[var(--n8)]" />사용 {DB.usedThisMonth}회</span>
                <span className="inline-flex items-center gap-1.5"><i className="inline-block w-2 h-2 rounded-full bg-[var(--m600)]" />남음 {DB.remaining}회 ({pct}%)</span>
              </div>
            </div>
            <BtnLine onClick={() => go('billing', {})}><Icon name="ticket" size={14} />이용권 더 받기</BtnLine>
          </section>

          <div role="tablist" aria-label="내역 종류" className="flex gap-1 mt-4 border-b border-[var(--n2)]">
            {[{ id: 'usage', label: '이용 내역', n: usageRows.length }, { id: 'pay', label: '결제 내역', n: payRows.length }].map((t) => (
              <button key={t.id} role="tab" type="button" aria-selected={tab === t.id} onClick={() => pickTab(t.id)}
                className={cx('h-11 px-4 -mb-px text-[15px] font-semibold border-b-2', tab === t.id ? 'border-[var(--m600)] text-[var(--m700)]' : 'border-transparent text-[var(--n7)] hover:text-[var(--n10)]')}>
                {t.label}<span className="ml-1.5 num text-[length:var(--c-small)] text-[var(--n6)]">{t.n}</span>
              </button>
            ))}
          </div>

          {tab === 'usage' ? (
            <section aria-label="이용 내역" className="overflow-x-auto">
              <table className="w-full text-left text-[length:var(--c-body)]">
                <thead>
                  <tr className="text-[length:var(--c-small)] text-[var(--n6)] border-b border-[var(--n2)]">
                    <th className="py-3 pr-4 font-semibold">문서</th>
                    <th className="py-3 pr-4 font-semibold w-[170px]">일시</th>
                    <th className="py-3 pr-4 font-semibold w-[100px] text-right">차감</th>
                    <th className="py-3 font-semibold w-[110px]">구분</th>
                  </tr>
                </thead>
                <tbody>
                  {usageRows.map((u, i) => (
                    <tr key={u.at + u.doc} className="border-b border-[var(--n2)] last:border-0 hover:bg-[var(--n1)]">
                      <td className="py-3.5 pr-4">
                        <a href={'#/review'} className="inline-flex items-center gap-2 font-semibold text-[var(--n10)] hover:text-[var(--m700)]">
                          <Icon name="file-text" size={16} className="text-[var(--n6)]" />{docName(u.doc)}
                        </a>
                      </td>
                      <td className="py-3.5 pr-4 num text-[var(--n7)]">{u.at}</td>
                      <td className="py-3.5 pr-4 num text-right font-semibold text-[var(--n10)]">-{u.n}회</td>
                      <td className="py-3.5">{u.again ? <Tag tone="warn">재검토</Tag> : <span className="text-[var(--n6)] text-[length:var(--c-small)]">첫 검토</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="m-0 mt-3 text-[length:var(--c-small)] text-[var(--n6)]">같은 문서를 다시 검토하면 재검토로 1회가 차감됩니다.</p>
            </section>
          ) : (
            <section aria-label="결제 내역" className="overflow-x-auto">
              <table className="w-full text-left text-[length:var(--c-body)]">
                <thead>
                  <tr className="text-[length:var(--c-small)] text-[var(--n6)] border-b border-[var(--n2)]">
                    <th className="py-3 pr-4 font-semibold">주문번호</th>
                    <th className="py-3 pr-4 font-semibold">결제 일시</th>
                    <th className="py-3 pr-4 font-semibold">이용권</th>
                    <th className="py-3 pr-4 font-semibold">수단</th>
                    <th className="py-3 pr-4 font-semibold text-right">금액</th>
                    <th className="py-3 pr-4 font-semibold">상태</th>
                    <th className="py-3 font-semibold">만료일</th>
                  </tr>
                </thead>
                <tbody>
                  {payRows.map((o) => (
                    <tr key={o.no} className="border-b border-[var(--n2)] last:border-0 hover:bg-[var(--n1)]">
                      <td className="py-3.5 pr-4">
                        <button type="button" onClick={() => openOrder(o.no)} className="inline-flex items-center gap-1.5 num font-semibold text-[var(--m700)] hover:underline">
                          <Icon name="receipt" size={15} />{o.no}
                        </button>
                      </td>
                      <td className="py-3.5 pr-4 num text-[var(--n7)]">{dots(o.date)} {o.time}</td>
                      <td className="py-3.5 pr-4 text-[var(--n10)] font-semibold">{DB.planOf(o.plan).name}</td>
                      <td className="py-3.5 pr-4 text-[var(--n7)]">{o.method}</td>
                      <td className="py-3.5 pr-4 num text-right font-semibold text-[var(--n10)]">{won(o.amount)}</td>
                      <td className="py-3.5 pr-4"><Tag tone={statusTone(o.status)}>{o.status}</Tag></td>
                      <td className="py-3.5 num text-[var(--n7)]">{o.expires}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="m-0 mt-3 text-[length:var(--c-small)] text-[var(--n6)]">주문번호를 누르면 영수증을 볼 수 있어요.</p>
            </section>
          )}
        </div>
      </div>

      <Modal
        open={!!order}
        onClose={closeOrder}
        title="결제 영수증"
        sub={order ? order.no : ''}
        width={460}
        footer={<><BtnLine onClick={() => toast('영수증 PDF를 내려받았어요')}><Icon name="download" size={14} />PDF 받기</BtnLine><BtnPrimary onClick={closeOrder} className="!h-10 !px-5 !text-[15px]">확인</BtnPrimary></>}
      >
        {order && (
          <dl className="m-0 text-[length:var(--c-body)]">
            {[
              ['주문번호', order.no],
              ['이용권', plan.name + ' · 검토 ' + plan.reviews + '회'],
              ['결제 수단', order.method],
              ['결제 일시', dots(order.date) + ' ' + order.time],
              ['이용권 만료일', order.expires],
            ].map(([k, v]) => (
              <div key={k} className="flex justify-between gap-4 py-2.5 border-b border-[var(--n2)]">
                <dt className="text-[var(--n6)]">{k}</dt>
                <dd className="m-0 num font-semibold text-[var(--n10)] text-right">{v}</dd>
              </div>
            ))}
            <div className="flex justify-between items-center gap-4 py-2.5 border-b border-[var(--n2)]">
              <dt className="text-[var(--n6)]">상태</dt>
              <dd className="m-0"><Tag tone={statusTone(order.status)}>{order.status}</Tag></dd>
            </div>
            <div className="flex justify-between items-baseline gap-4 pt-4">
              <dt className="font-semibold text-[var(--n10)]">결제 금액</dt>
              <dd className="m-0 num font-bold text-[length:var(--t-section)] text-[var(--n10)]">{won(order.amount)}</dd>
            </div>
          </dl>
        )}
      </Modal>
    </div>
  );
};

<script>(function(){try{if(document.getElementById("demo-chrome-css"))return;var st=document.createElement("style");st.id="demo-chrome-css";st.textContent="[data-house=\"demobar\"]{position:sticky;top:0;z-index:70}\nhtml{scroll-padding-top:var(--demo-chrome-h,0px)}\n.demo-hint-pulse{position:relative}\n.demo-hint-pulse::after{content:\"\";position:absolute;inset:-4px;border-radius:12px;box-shadow:0 0 0 0 rgba(255,255,255,.85);animation:demoHintPulse 1.6s ease-out 4;pointer-events:none}\n@keyframes demoHintPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}\n.demo-hint{position:fixed;z-index:80;width:min(300px,calc(100vw - 32px));background:#1d1d1d;color:#fff;border-radius:12px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font:14px/1.55 Pretendard,\"Apple SD Gothic Neo\",system-ui,sans-serif;opacity:0;transform:translateY(-4px);transition:opacity .25s ease,transform .25s ease}\n.demo-hint.on{opacity:1;transform:none}\n.demo-hint b{display:block;font-weight:600;margin-bottom:4px;font-size:14.5px}\n.demo-hint .demo-hint-arrow{position:absolute;top:-6px;width:12px;height:12px;background:#1d1d1d;transform:rotate(45deg);border-radius:2px}\n.demo-hint .demo-hint-row{display:flex;justify-content:flex-end;margin-top:10px}\n.demo-hint button{appearance:none;border:0;background:#fff;color:#1d1d1d;border-radius:8px;padding:6px 12px;font:600 13px/1.2 inherit;cursor:pointer}\n.demo-hint button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.demo-hint-pulse::after{animation:none}.demo-hint{transition:none}}\n@media print{.demo-hint{display:none}}";document.head.appendChild(st);}catch(e){}})();
(function(){try{
// 데모마다 따로 기억한다 — 모든 데모가 한 주소(firstpip.github.io) 아래라 키 하나면 한 데모에서 닫은 뒤 다른 데모에서도 안 떴다(2026-11-13 실측). P1·P2 는 같은 프로젝트라 한 번
var KEY=(function(){var p=location.pathname,i=p.lastIndexOf('/portfolio-');return 'demo-tour-hint-v1:'+(i>0?p.slice(0,i):p);})();
var FROM_TOUR=location.hash==='#tour'; // 키트가 해시를 곧 지우므로 실행 즉시 기록
function tourIsOpen(){return !!document.querySelector('[aria-current="step"]')||document.body.classList.contains('hk-tour-open');}
function bar(){return document.querySelector('[data-house="demobar"]');}
function tourBtn(){var b=bar();if(!b)return null;var els=b.querySelectorAll('button,a');for(var i=0;i<els.length;i++){if(/\uC2DC\uC5F0\s*\uC548\uB0B4/.test(els[i].textContent||''))return els[i];}return null;}
function stackH(){var h=0,b=bar();if(b)h+=b.getBoundingClientRect().height;var hs=document.querySelectorAll('header,nav');for(var i=0;i<hs.length;i++){var e=hs[i];if(b&&b.contains(e))continue;var cs=getComputedStyle(e);if(cs.position==='sticky'||cs.position==='fixed'){var r=e.getBoundingClientRect();if(r.top<=(b?b.getBoundingClientRect().height+2:2)&&r.height<200){h+=r.height;break;}}}return Math.round(h)+12;}
function setPad(){try{document.documentElement.style.setProperty('--demo-chrome-h',stackH()+'px');}catch(e){}}
var tries=0;(function wait(){var btn=tourBtn();if(!btn){if(++tries<40)return setTimeout(wait,250);return;}setPad();window.addEventListener('resize',setPad);
if(navigator.webdriver||/[?&]still=1/.test(location.search)||FROM_TOUR||location.hash==='#tour')return;
var seen=false;try{seen=localStorage.getItem(KEY)==='1';}catch(e){}if(seen)return;
setTimeout(function(){show(btn);},1200);})();
function show(btn){
if(!document.body.contains(btn)||tourIsOpen())return;
var tip=document.createElement('div');tip.className='demo-hint';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','\uC2DC\uC5F0 \uC548\uB0B4 \uB3C4\uC6C0\uB9D0');
var arrow=document.createElement('span');arrow.className='demo-hint-arrow';tip.appendChild(arrow);
var t=document.createElement('b');t.textContent='\uCC98\uC74C \uC624\uC168\uB098\uC694?';tip.appendChild(t);
var p=document.createElement('div');p.textContent="'\uC2DC\uC5F0 \uC548\uB0B4'\uB97C \uB204\uB974\uBA74 \uC774 \uD654\uBA74\uC758 \uC8FC\uC694 \uAE30\uB2A5\uC744 \uB2E8\uACC4\uBCC4\uB85C \uC9C1\uC811 \uB20C\uB7EC \uBCF4\uBA70 \uD655\uC778\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694.";tip.appendChild(p);
var row=document.createElement('div');row.className='demo-hint-row';var ok=document.createElement('button');ok.type='button';ok.textContent='\uC54C\uACA0\uC5B4\uC694';row.appendChild(ok);tip.appendChild(row);
document.body.appendChild(tip);btn.classList.add('demo-hint-pulse');
function place(){var r=btn.getBoundingClientRect(),w=tip.offsetWidth,vw=document.documentElement.clientWidth;var left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16);tip.style.left=left+'px';tip.style.top=(r.bottom+12)+'px';arrow.style.left=Math.max(14,Math.min(w-26,r.left+r.width/2-left-6))+'px';}
place();requestAnimationFrame(function(){tip.classList.add('on');});
var timer=setTimeout(function(){close(false);},25000);
function close(remember){clearTimeout(timer);if(remember){try{localStorage.setItem(KEY,'1');}catch(e){}}btn.classList.remove('demo-hint-pulse');tip.classList.remove('on');setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},300);window.removeEventListener('resize',place);window.removeEventListener('scroll',place,true);document.removeEventListener('keydown',onKey);btn.removeEventListener('click',onBtn,true);}
function onKey(e){if(e.key==='Escape')close(true);}
function onBtn(){close(true);}
ok.addEventListener('click',function(){close(true);});btn.addEventListener('click',onBtn,true);document.addEventListener('keydown',onKey);window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
}
}catch(e){}})();</script>

<!-- tour-shift-v3 — scripts/lib/tour-shift.js 가 주입한다. 손으로 고치지 말 것 -->
<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
