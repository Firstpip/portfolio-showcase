<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;

function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}

return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;

</script>
