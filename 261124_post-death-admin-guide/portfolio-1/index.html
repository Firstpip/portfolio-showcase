const ddLabel = (n) => n === 0 ? 'D-day' : n > 0 ? 'D-' + n : '기한 지남 ' + (-n) + '일';
const ddClass = (it) => stateOf(it) === 'done' ? 'chip' : ddayOf(it) < 0 ? 'chip over' : ddayOf(it) <= 7 ? 'chip warn' : 'chip';
const progress = () => { const a = applicable(); const d = a.filter(i => stateOf(i) === 'done').length; return { done: d, total: a.length, pct: a.length ? Math.round(d / a.length * 100) : 0 }; };

const toggleDone = (it) => { S.st[it.id] = stateOf(it) === 'done' ? 'todo' : 'done'; bump(); say(stateOf(it) === 'done' ? it.t + ' 을 완료로 표시했어요' : it.t + ' 을 다시 할 일로 되돌렸어요'); };
const pById = (id) => PARTNERS.find(p => p.id === id);

function Sheet({ open, onClose, title, children }) {

}
function Ring({ pct, size = 76 }) {

}
function TabBar({ route }) {

const Switch = ({ on, label, onClick }) => <button type="button" role="switch" aria-checked={on} aria-label={label} className={'sw' + (on ? ' on' : '')} onClick={onClick}><i /></button>;

/* ── 본인확인 ── */

    <>

/* ── 전체 체크리스트 ── */
function Checklist() {
  const s = useS(); const p = useParams();
  const [f, setF] = useState(p.filter || 'all'); const [open, setOpen] = useState(p.open || null);
  useEffect(() => { setF(p.filter || 'all'); setOpen(p.open || null); }, [p]);
  const a = applicable(); const pr = progress();
  const rows = a.filter(i => f === 'all' || (f === 'doing' ? stateOf(i) === 'doing' : f === 'done' ? stateOf(i) === 'done' : stateOf(i) === 'todo'));
  const cnt = (k) => a.filter(i => stateOf(i) === k).length;
  return (
    <>
      <Head title="전체 체크리스트" sub={'해당 ' + a.length + '항목 · 완료 ' + pr.done + '개'} />
