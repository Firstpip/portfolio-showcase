/* 두 사진의 적재물 영역을 같은 크기로 놓고 대응점을 잇는다 */
function Match({ c, lines = true, only = '' }) {
  const uid = useId().replace(/[^a-zA-Z0-9]/g, '');
  const A = layoutOf(c.n); const B = layoutOf(c.type === 'cargo' || c.type === 'file' ? c.n : c.n + 777);
  const fa = (p) => [(p[0] - 150) * 1.15 + 20, (p[1] - 150) * 1.15 + 14];
  const fb = (p) => { const x2 = TB.cx + TB.s * (p[0] - TB.cx) + TB.dx, y2 = TB.cy + TB.s * (p[1] - TB.cy) + TB.dy; return [(x2 - 150) * 1.15 + 526, (y2 - 150) * 1.15 + 14]; };
  const pts = (bx, kind) => { const q = boxRect(bx); return kind === 0 ? [q.x + q.w / 2, q.y + q.h / 2] : kind === 1 ? [q.x, q.y] : [q.x + q.w, q.y]; };
  const pairs = []; const n = Math.min(A.length, B.length);
  for (let i = 0; i < 14; i++) { const kind = i < 6 ? 0 : i < 11 ? 1 : 2; const bi = (kind === 0 ? i : kind === 1 ? i - 6 : i - 11 + 1) % n; pairs.push({ kind, a: fa(pts(A[bi], kind)), b: fb(pts(B[bi], kind)) }); }
  const sty = [{ stroke: 'var(--m600)', strokeWidth: 1.6 }, { stroke: 'var(--m400)', strokeWidth: 1.6, strokeDasharray: '5 3' }, { stroke: 'var(--n10)', strokeWidth: 2.2, strokeDasharray: '1 4', strokeLinecap: 'round' }];
  const draw = (bxs, f) => bxs.map((bx, i) => { const q = boxRect(bx); const [x, y] = f([q.x, q.y]); const [x2, y2] = f([q.x + q.w, q.y + q.h]); return <rect key={i} x={x} y={y} width={x2 - x} height={y2 - y} style={{ fill: 'var(--m500)', fillOpacity: 0.2, stroke: 'var(--m600)', strokeWidth: 1.2 }} />; });
  return (
    <svg viewBox="0 0 1000 236" className="block h-auto w-full" role="img" aria-label="적재물 영역 대응점 14쌍">
      <defs><clipPath id={'ca' + uid}><rect x="20" y="14" width="454" height="208" /></clipPath><clipPath id={'cb' + uid}><rect x="526" y="14" width="454" height="208" /></clipPath></defs><rect width="1000" height="236" style={{ fill: 'var(--n2)' }} />
      <rect x="20" y="14" width="454" height="208" style={{ fill: 'var(--n1)', stroke: 'var(--n4)' }} /><rect x="526" y="14" width="454" height="208" style={{ fill: 'var(--n1)', stroke: 'var(--n4)' }} />
      <g clipPath={'url(#ca' + uid + ')'}>{draw(A, fa)}</g><g clipPath={'url(#cb' + uid + ')'}>{draw(B, fb)}</g>
      {lines && pairs.map((p, i) => <g key={i} style={{ opacity: only === '' || Number(only) === p.kind ? 1 : 0.12 }}><line x1={p.a[0]} y1={p.a[1]} x2={p.b[0]} y2={p.b[1]} style={sty[p.kind]} /><circle cx={p.a[0]} cy={p.a[1]} r="3.2" style={{ fill: 'var(--n10)' }} /><circle cx={p.b[0]} cy={p.b[1]} r="3.2" style={{ fill: 'var(--n10)' }} /></g>)}
    </svg>
  );
}

      {open && <RecordDialog c={c} onClose={() => go('review', { case: String(c.n) })} />}

}

/* ── 사진 이력 ── */
function ReusePage() {
  const [c, p] = useCase(); const kind = p.kind || 'all'; const ki = kind === 'all' ? 0 : kind === 'car' ? 1 : 2;
  const [pick, setPick] = useState(null);
  const sim = (o) => o.n === c.n ? 1 : (o.type === 'file' && c.type === 'file') ? 0.96 - hsh(o.n, 31) * 0.05 : Math.round((0.46 + hsh(c.n * 31 + o.n, ki + 40) * 0.42) * 100) / 100;
  const cand = CASES.filter((o) => o.n !== c.n).map((o) => ({ o, s: sim(o) })); const own = c.sims ? c.sims[ki] : 0.9;
  const rows = [{ o: { ...c, __b: true }, s: own }, ...cand].sort((x, y) => y.s - x.s).slice(0, 10);
  const files = CASES.filter((x) => x.type === 'file').slice(0, 3); const hashes = CASES.filter((x) => x.type !== 'file' && x.sims && x.sims[0] > 0.8).slice(0, 5);

    <div className="mx-auto max-w-[1440px] px-6 pb-16 pt-4">

      <div className="grid gap-4" style={{ gridTemplateColumns: 'minmax(0,1.5fr) 340px' }}>
        <div className="panel overflow-x-auto"><table className="tbl"><thead><tr><th>유사도</th><th className="hide-m">사업장</th><th>차량번호</th><th className="hide-m">계근 시각</th><th className="r">실중량</th></tr></thead><tbody>{rows.map(({ o, s }, i) => <tr key={i} className="cursor-pointer" aria-selected={cur === o || (o.__b && !pick && i === 0)} onClick={() => setPick(o.__b ? c.n : o.n)}><td><span className="bar sm"><i style={{ width: s * 100 + '%', background: s >= (kind === 'all' ? THR.all : kind === 'car' ? THR.car : THR.cargo) ? 'var(--m600)' : 'var(--n5)' }} /></span><b className="mono ml-2">{s.toFixed(2)}</b></td><td className="hide-m">{o.__b ? c.siteB : o.site}</td><td className="mono">{o.plate}</td><td className="mono hide-m">{fmtMD(o.__b ? c.t2 : o.t1)}</td><td className="mono r">{kgs(o.__b ? c.net2 : o.net1)}</td></tr>)}</tbody></table></div>
        <aside className="panel p-4"><h2 className="mb-2 text-[14px] font-semibold">고른 후보</h2><Shot c={cur.__b ? c : cur} side={cur.__b ? 'b' : 'a'} compact /><p className="mono mt-2 text-[12.5px] text-[var(--n8)]">{cur.plate} · {fmtMD(cur.__b ? c.t2 : cur.t1)} · {cur.__b ? c.siteB : cur.site}</p><button type="button" className="btn pri mt-3 w-full" onClick={() => flash((cur.plate) + ' 후보를 의심 사례로 올렸습니다')}>의심 사례로 올리기</button></aside>
      </div>

        <Panel title="지각 해시 유사 후보" right={<span className="text-[12px] text-[var(--n7)]">{hashes.length}건</span>}><table className="tbl compact"><thead><tr><th>차량번호</th><th className="hide-m">사업장</th><th className="r">해시 거리</th></tr></thead><tbody>{hashes.map((f) => <tr key={f.n}><td className="mono">{f.plate}</td><td className="hide-m">{f.site}</td><td className="mono r">{2 + (f.n % 5)}</td></tr>)}</tbody></table></Panel>

/* ── 검토 이력 ── */
function HistoryPage() {
  const p = useParams(); const recs = useRecords();

  const list = base.filter((r) => !dec || r.dec === dec);
  return (
    <div className="mx-auto max-w-[1440px] px-6 pb-16 pt-5">
      <div className="mb-3 flex flex-wrap items-end justify-between gap-3"><div><h1 className="h1">검토 이력</h1><p className="mt-1 text-[13.5px] text-[var(--n7)]">기록 {recs.length}건 · 방금 남긴 결정이 맨 위에 쌓입니다</p></div>
        <div className="flex items-center gap-2"><select id="h-who" aria-label="담당자" className="field" value={who} onChange={(e) => set('who', e.target.value === '김지원' ? 'me' : e.target.value)}><option value="">담당자 전체</option>{PEOPLE.map((n) => <option key={n} value={n}>{n}{n === '김지원' ? ' (나)' : ''}</option>)}</select></div></div>

      <div className="panel overflow-x-auto">{list.length === 0 ? <p className="px-6 py-12 text-center text-[14px] text-[var(--n7)]">조건에 맞는 기록이 없습니다.</p> : <table className="tbl"><thead><tr><th>기록 시각</th><th className="hide-m">사례</th><th className="hide-m">담당자</th><th>결정</th><th>사유</th><th /></tr></thead><tbody>{list.map((r, i) => { const c = byN(r.n); const open = p.open === String(r.n) + '-' + i; return (<React.Fragment key={i}><tr className="cursor-pointer" aria-expanded={open} onClick={() => set('open', open ? '' : r.n + '-' + i)}><td className="mono">{fmtMD(r.ts)}</td><td className="mono hide-m">{c.id}</td><td className="hide-m">{r.who}</td><td>{r.dec === DECISIONS[1] ? <span className="pill warn">{r.dec}</span> : r.dec}</td><td className="text-[var(--n8)]">{r.why}</td><td><Icon name={open ? 'chevron-up' : 'chevron-down'} size={15} /></td></tr>{open && <tr><td colSpan={6} className="!h-auto bg-[var(--n0)] !whitespace-normal !p-3"><div className="grid items-start gap-4" style={{ gridTemplateColumns: '170px 170px 1fr' }}><Shot c={c} side="a" compact /><Shot c={c} side="b" compact /><div className="text-[13px] leading-[1.7]"><b>{TYPES[c.type]}</b> · {c.plate} · {c.site}<br /><span className="mono">{fmtMD(c.t1)} · 실중량 {kgs(c.net1)} 대 {fmtMD(c.t2)} · {kgs(c.net2)}</span><br /><button type="button" className="btn mt-1" onClick={() => go('review', { case: String(c.n) })}>비교 검토 열기</button></div></div></td></tr>}</React.Fragment>); })}</tbody></table>}</div>
    </div>
  );
}

function App() {
  const route = useRoute(); useLucide(); useRfMotion(route);
  const [msg, setMsg] = useState('');
  useEffect(() => { const f = (m) => { setMsg(m); setTimeout(() => setMsg(''), 2600); }; flashSet.add(f); return () => flashSet.delete(f); }, []);
  const Page = { cases: CasesPage, review: ReviewPage, cargo: CargoPage, rules: RulesPage, ai: AiPage, reuse: ReusePage, history: HistoryPage }[route] || CasesPage;
  return (
    <>
      <DemoBar onReset={() => { store.records = seedRecords(); emit(); go('cases'); }} />
      <Header route={Page === CasesPage && route !== 'cases' ? 'cases' : route} />
      <main id="main"><Page /></main>
      {msg && <div className="look-toast" role="status" aria-live="polite">{msg}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<script>
(function(){try{
