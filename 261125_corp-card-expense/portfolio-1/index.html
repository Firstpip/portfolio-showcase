  E1_ROWS.forEach((r) => {

    else if (st === "c") {

    } else out.push({ ...base, status: "입력 완료", account: acc, memo, withs, reason });
  });
  // 다른 직원: 부서 목표 사용액에 맞춰 생성
  const rnd = mk(20261125);
  Object.keys(DEPT_TARGET).forEach((did) => {
    const emps = EMPLOYEES.filter((e) => e.dept === did && e.id !== "e16" && e.id !== "e1");

    const fixed = out.filter((x) => x.emp === "e1" && did === "d22").reduce((s, x) => s + x.amount, 0);
    const n = Math.max(24, Math.round((target - fixed) / 52000));
    const raw = [];
    for (let i = 0; i < n; i++) {
      let w = rnd() * 100, acc = ACC_WEIGHT[0][0];
      for (const [a, wt] of ACC_WEIGHT) { if (w < wt) { acc = a; break; } w -= wt; }
      const base = acc === "접대비" ? 90000 : acc === "출장비" ? 110000 : acc === "교통비" ? 22000 : acc === "복리후생비" ? 36000 : acc === "회의비" ? 28000 : 40000;

    const sum = raw.reduce((s, x) => s + x.v, 0); const k = (target - fixed) / sum;

    raw.forEach((x, i) => {

      let amt = Math.round((x.v * k) / 100) * 100;
      if (i === raw.length - 1) amt = target - fixed - acc2;
      acc2 += amt;
      const ms = MERCHANTS[x.acc]; const m = ms[Math.floor(rnd() * ms.length)];

    });
  });
  return out.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
}

  const list = kind === "전체" ? [...mixFirst, ...DB.alerts.filter((a) => !mixFirst.includes(a))] : DB.alerts.filter((a) => a.kind === kind);
  const latest = DB.alerts.slice(0, 2);
  const last = DB.tx[0];
  const clock = (at) => at.slice(11, 16);
  const dateOf = (at) => at.slice(0, 10);
  const when = (at) => (dateOf(at) === TODAY ? clock(at) : Number(at.slice(5, 7)) + "/" + Number(at.slice(8, 10)) + " " + clock(at));

  const onOpen = (a) => {
    markRead(a.id);
    if (a.kind === "사용내역") go("history");
  };

  const IOS = ["단축어 앱 열기", "자동화 · 메시지", "보낸 사람 신한카드", "묻기 끄고 실행"];
  const AND = ["전달 앱 권한 허용", "카드사 번호 지정", "받는 주소 붙여넣기", "배터리 제한 제외"];

  const Steps = ({ title, steps }) => (
    <div className="min-w-0 flex-1 rounded-[var(--r-card)] border border-[var(--n3)] bg-[var(--n1)] px-2.5 py-1.5">
      <p className="truncate text-[13px] font-bold text-[var(--n9)]">{title}</p>
      <ol className="mt-0.5">
        {steps.map((s, i) => (
          <li key={i} className="flex h-[22px] items-center gap-1.5">
            <span className="grid h-[18px] w-[18px] shrink-0 place-items-center rounded-full bg-[var(--m600)] text-[12px] font-bold tabular-nums leading-none text-[var(--on-main)]">{i + 1}</span>
            <span className="min-w-0 flex-1 truncate text-[12px] leading-[1.3] text-[var(--n7)]">{s}</span>
          </li>
        ))}
      </ol>
    </div>
  );

  const pwOk = pw.cur.length > 0 && pw.next.length >= 8 && pw.next === pw.again;

  return (
    <div className="pb-6">
      <div data-must="M6" className="px-4 pt-3">
        {/* ① 푸시 알림 모습 */}
        <div className="rounded-[16px] bg-[var(--n9)] px-3 pb-3 pt-3.5">
          <p className="text-center text-[13px] text-white">{dayLabel(TODAY)}</p>
          <p className="text-center font-light tabular-nums text-white" style={{ fontSize: 28, lineHeight: 1.15 }}>{clock(latest[0].at)}</p>
          <div className="mt-2.5 flex flex-col gap-1.5">
            {latest.map((a) => (
              <div key={a.id} className="flex min-w-0 items-center gap-2.5 rounded-[14px] bg-white/15 px-2.5 py-2">
                <span className="grid h-7 w-7 shrink-0 place-items-center rounded-[8px] bg-[var(--m600)] text-[var(--on-main)]"><Icon name="receipt-text" size={16} /></span>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-1.5">
                    <span className="min-w-0 flex-1 truncate text-[12px] font-semibold text-white/85">경비로그 · {a.kind}</span>
                    <span className="whitespace-nowrap text-[12px] tabular-nums text-white/60">{when(a.at)}</span>
                  </div>
                  <p className="truncate text-[12.5px] leading-[1.3] text-white">{a.text}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* ② 문자 전달 설정 */}
        <div className="mt-2 rounded-[var(--r-card)] p-1" style={{ border: guideOn ? "2px solid var(--m600)" : "2px solid transparent" }}>
          <div className="flex items-baseline justify-between gap-2 px-1">
            <p className="text-[14px] font-bold text-[var(--n9)]">결제 문자 전달 설정</p>
            <button type="button" onClick={() => setPwOpen(true)} className="whitespace-nowrap text-[12px] text-[var(--n6)]">비밀번호 변경</button>
          </div>
          <div className="mt-1 flex gap-2">
            <Steps title="아이폰 · 단축어" steps={IOS} />
            <Steps title="안드로이드 · 전달 앱" steps={AND} />
          </div>
          <p className="mt-1 truncate px-1 text-[12px] text-[var(--n7)]">마지막 문자 수신 {dayLabel(last.date).replace(/ .요일$/, "")} {last.time} · 인식 성공</p>
        </div>
        {/* ③ 알림함 */}
        <div data-hero className="mt-3">
        <p className="text-[30px] font-bold leading-[1.2] tracking-[-0.02em] text-[var(--n9)]">알림함 · 새 알림 {DB.alerts.filter((x) => !x.read).length}건</p>
        <div className="-mx-4 mt-2 flex gap-2 overflow-x-auto px-4 pb-1">
          {KINDS.map((k) => <Chip key={k} on={kind === k} onClick={() => setKind(k)}>{k}</Chip>)}
        </div>
        <div className="mt-1.5 overflow-hidden rounded-[var(--r-card)] border border-[var(--n3)] bg-[var(--n1)]">
          {list.map((a, i) => (
            <button key={a.id} type="button" onClick={() => onOpen(a)} className={cx("flex h-[50px] w-full items-center gap-2 px-3 text-left", i > 0 && "border-t border-[var(--n3)]")}>
              <span className="h-2 w-2 shrink-0 rounded-full" style={{ background: a.read ? "transparent" : "var(--m600)" }} aria-label={a.read ? "읽음" : "안 읽음"} />
              <span className="min-w-0 flex-1">
                <span className="flex items-center justify-between gap-2">
                  <span className={cx("whitespace-nowrap text-[12px] font-semibold", a.kind === "예산 경고" ? "text-[var(--s3)]" : "text-[var(--n6)]")}>{a.kind}</span>
                  <span className="whitespace-nowrap text-[12px] tabular-nums text-[var(--n6)]">{when(a.at)}</span>
                </span>
                <span className={cx("block truncate text-[13px] leading-[1.35]", a.read ? "text-[var(--n7)]" : "font-semibold text-[var(--n9)]")}>{a.text}</span>
              </span>
            </button>
          ))}
          {list.length === 0 && <p className="px-4 py-6 text-center text-[13px] text-[var(--n6)]">이 종류의 알림이 없어요</p>}
        </div>
        </div>
      </div>

      <Sheet
        open={pwOpen}
        onClose={() => setPwOpen(false)}
        title="비밀번호 변경"
        footer={<Btn className="w-full" disabled={!pwOk} onClick={() => { setPwOpen(false); setPw({ cur: "", next: "", again: "" }); showToast("비밀번호를 변경했어요"); }}>변경하기</Btn>}
      >
        <div className="space-y-3">
          {[["cur", "현재 비밀번호"], ["next", "새 비밀번호"], ["again", "새 비밀번호 확인"]].map(([k, label]) => (
            <label key={k} className="block">
              <span className="text-[13px] text-[var(--n6)]">{label}</span>
              <input type="password" value={pw[k]} onChange={(e) => setPw({ ...pw, [k]: e.target.value })} className="mt-1 h-12 w-full min-w-0 rounded-[var(--r-card)] border border-[var(--n3)] bg-[var(--n1)] px-3 text-[15px] text-[var(--n9)]" />
            </label>
          ))}
          <p className="text-[13px] text-[var(--n6)]">8자 이상으로 정해 주세요. 새 비밀번호와 확인이 같아야 해요.</p>
        </div>
      </Sheet>
    </div>
  );
};

/* ── 화면 budget (screens/budget.jsx) ── */
SCREENS["budget"] = function Budget() {
  useDB();
  const params = useParams();
  const rep = params.tab === "report";
  const limit = MY_CARD.limit;
  const used = usedTotal("e1", THIS_MONTH);
  const remain = limit - used;
  const byAcc = usedByAccount("e1", THIS_MONTH);
  const byAccLast = {};
  ACCOUNTS.forEach((a) => { const h = histOf("e1", a).find((x) => x.month === LAST_MONTH); byAccLast[a] = h ? h.used : 0; });
  const warnLine = (1 - WARN_RATE) * 100;
  const warnCount = ACCOUNTS.filter((a) => isWarn("e1", THIS_MONTH, a)).length;

  const totals = monthTotals("e1");
  const last = totals[totals.length - 1];
  const prev = totals[totals.length - 2];
  const diff = last.used - prev.used;
  const pct = prev.used ? (diff / prev.used) * 100 : 0;
  const sgn = diff > 0 ? "+" : diff < 0 ? "-" : "";
  const mLabel = (m) => Number(m.slice(5)) + "월";

  const W = 340, H = rep ? 140 : 80, L = 40, R = 8, T = 8, B = 18;
  const maxV = Math.max(...totals.map((t) => t.used));
  const top = Math.ceil(maxV / 500000) * 500000 || 500000;
  const ticks = [0, top];
  const bw = (W - L - R) / totals.length;
  const xOf = (i) => L + bw * i + bw / 2;
  const yOf = (v) => T + (H - T - B) * (1 - v / top);
  const linePts = totals.map((t, i) => `${xOf(i)},${yOf(t.used)}`).join(" ");
  const cmpMax = Math.max(1, ...ACCOUNTS.map((a) => Math.max(byAcc[a], byAccLast[a])));

  return (
    <div className="pb-4">
      <div data-hero data-must="M4" className="px-4 pt-3">
        <p className="whitespace-nowrap font-bold tabular-nums tracking-[-0.03em] text-[var(--n9)]" style={{ fontSize: 30, lineHeight: "34px", fontVariantNumeric: "tabular-nums" }}>{won(remain)}</p>
        <div className="mt-1.5"><Meter used={used} limit={limit} h={6} /></div>
        <p className="mt-1 whitespace-nowrap text-[12px] text-[var(--n6)]">남은 카드 한도 · {man(limit)} 중 {man(used)} 사용</p>
        <div className="flex items-center justify-between gap-2 border-t border-[var(--n3)] pb-1 pt-2">
          <p className="whitespace-nowrap text-[14px] font-semibold text-[var(--n9)]">{rep ? `계정과목 ${ACCOUNTS.length}개 · ${warnCount}곳 기준 아래` : "계정과목별 잔여"}</p>
          <p className="min-w-0 truncate text-[12px] text-[var(--n6)]">{rep ? `기준 잔여 ${Math.round(WARN_RATE * 100)}%` : `${warnCount}곳이 기준 아래 · 경고 기준 잔여 ${Math.round(WARN_RATE * 100)}%`}</p>
        </div>
        {ACCOUNTS.filter((a) => !rep || isWarn("e1", THIS_MONTH, a)).map((a) => {
          const budget = accountBudget("e1", a);
          const rem = accountRemain("e1", THIS_MONTH, a);
          const warn = isWarn("e1", THIS_MONTH, a);
          return (
            <div key={a} className="py-1" style={{ minHeight: 44 }}>
              <div className="flex items-baseline justify-between gap-2" style={{ lineHeight: "20px" }}>
                <span className="whitespace-nowrap text-[15px] font-semibold text-[var(--n9)]">{a}</span>
                <p className={cx("shrink-0 whitespace-nowrap text-[15px] font-bold tabular-nums", warn ? "text-[var(--s2)]" : "text-[var(--n9)]")} style={{ fontVariantNumeric: "tabular-nums" }}>잔여 {won(rem)}</p>
              </div>
              <div className="relative my-1">
                <Meter used={byAcc[a]} limit={budget} warn={warn} h={8} />
                <span aria-hidden="true" className="absolute w-[2px] bg-[var(--n9)]" style={{ left: warnLine + "%", top: -4, height: 16 }} />
              </div>
              <p className="truncate text-[13px] tabular-nums text-[var(--n6)]" style={{ lineHeight: "16px" }}>사용 {won(byAcc[a])} · 한도 {won(budget)}</p>
            </div>
          );
        })}
      </div>

      <div data-must="M5" className={cx("px-4", rep ? "mx-3 mt-3 rounded-[var(--r-card)] pb-2" : "mt-2")} style={rep ? { border: "1.5px solid var(--m600)" } : undefined}>
        <div className="border-t border-[var(--n3)] pt-2">
          <div className="flex items-baseline justify-between gap-2">
            <p className="whitespace-nowrap text-[14px] font-semibold text-[var(--n9)]">예산 리포트 <span className="text-[12px] font-normal text-[var(--n6)]">단위 만원</span></p>
            <p className="min-w-0 truncate text-[12px] tabular-nums text-[var(--n7)]">지난달 대비 <b className="text-[var(--n9)]">{sgn}{won(Math.abs(diff))}</b> ({sgn}{Math.abs(pct).toFixed(1)}%)</p>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="최근 6개월 월별 사용액 추이" className="mt-1 block" style={{ height: "auto" }}>
            {ticks.map((v) => (
              <g key={v}>
                <line x1={L} x2={W - R} y1={yOf(v)} y2={yOf(v)} stroke="var(--n3)" strokeWidth="1" />
                <text x={L - 5} y={yOf(v) + 4} textAnchor="end" fontSize="12" fill="var(--n6)">{v === 0 ? "0" : man(v)}</text>
              </g>
            ))}
            {totals.map((t, i) => {
              const isLast = i === totals.length - 1;
              const bwid = Math.min(24, bw * 0.5);
              return (
                <g key={t.month}>
                  <rect x={xOf(i) - bwid / 2} y={yOf(t.used)} width={bwid} height={Math.max(0, yOf(0) - yOf(t.used))} rx="2" fill={isLast ? "var(--m600)" : "var(--n3)"} />
                  <text x={xOf(i)} y={H - 3} textAnchor="middle" fontSize="12" fontWeight={isLast ? 700 : 400} fill={isLast ? "var(--n9)" : "var(--n6)"}>{mLabel(t.month)}</text>
                </g>
              );
            })}
            <polyline points={linePts} fill="none" stroke="var(--m600)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
            <circle cx={xOf(totals.length - 1)} cy={yOf(last.used)} r="3.5" fill="var(--m600)" />
          </svg>

          <div className="mt-1.5 flex items-center justify-between gap-2">
            <p className="whitespace-nowrap text-[12px] font-semibold text-[var(--n9)]">계정과목 비교</p>
            <div className="flex items-center gap-3 text-[12px] text-[var(--n6)]">
              <span className="flex items-center gap-1 whitespace-nowrap"><span className="inline-block h-2 w-2 rounded-full bg-[var(--m600)]" />{mLabel(THIS_MONTH)}</span>
              <span className="flex items-center gap-1 whitespace-nowrap"><span className="inline-block h-2 w-2 rounded-full bg-[var(--n4)]" />{mLabel(LAST_MONTH)}</span>
            </div>
          </div>
          {ACCOUNTS.map((a) => (
            <div key={a} className="flex items-center gap-2" style={{ height: rep ? 26 : 20 }}>
              <span className="w-[66px] shrink-0 truncate text-[13px] text-[var(--n7)]">{a}</span>
              <div className="flex min-w-0 flex-1 flex-col gap-[2px]">
                <div className="h-[9px] overflow-hidden rounded-full bg-[var(--n2)]"><div className="h-full rounded-full" style={{ width: (byAcc[a] / cmpMax) * 100 + "%", background: "var(--m600)" }} /></div>
                <div className="h-[9px] overflow-hidden rounded-full bg-[var(--n2)]"><div className="h-full rounded-full" style={{ width: (byAccLast[a] / cmpMax) * 100 + "%", background: "var(--n4)" }} /></div>
              </div>
              <span className="w-[112px] shrink-0 whitespace-nowrap text-right text-[13px] tabular-nums text-[var(--n7)]">{man(byAcc[a])} · {man(byAccLast[a])}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ── 화면 entry (screens/entry.jsx) ── */
SCREENS["entry"] = function Entry() {
  useDB();
  const params = useParams();
  const tx = DB.tx.find((t) => t.id === params.tx && t.emp === "e1") || FIRST_U;
  const done = tx.status === "입력 완료";
  const prev = (() => {
    const same = DB.tx.filter((t) => t.id !== tx.id && t.merchant === tx.merchant && t.status === "입력 완료" && t.account);
    return (same.find((t) => t.emp === "e1") || same[0] || {}).account || null;
  })();
  const mates = EMPLOYEES.filter((e) => e.id !== "e1").slice(0, 8);
  const REASONS = ["팀 회식", "고객사 미팅", "야근 식대"];
  const filled = params.filled === "1" && !done;

  const [account, setAccount] = useState(() => (done ? tx.account : filled ? prev || ACCOUNTS[0] : null));
  const [memo, setMemo] = useState(() => (done ? tx.memo : filled ? tx.merchant + " 이용" : ""));
  const [withs, setWiths] = useState(() => (done ? tx.withs || [] : filled ? mates.slice(0, 2).map((e) => e.name) : []));
  const [reason, setReason] = useState(() => (done ? tx.reason : filled ? REASONS[0] : ""));
  const [openAcc, setOpenAcc] = useState(params.open === "account");
  const [openWith, setOpenWith] = useState(false);
  const [err, setErr] = useState({});

  const order = prev ? [prev, ...ACCOUNTS.filter((a) => a !== prev)] : ACCOUNTS;
  const toggleWith = (n) => setWiths((w) => (w.includes(n) ? w.filter((x) => x !== n) : [...w, n]));
  const remainOf = (a) => accountRemain("e1", THIS_MONTH, a);

  const save = () => {
    const e = {};
    if (!account) e.account = "계정과목을 골라 주세요.";
    if (!memo.trim()) e.memo = "적요를 한 줄로 적어 주세요.";
    if (!reason.trim()) e.reason = "이용 사유를 적어 주세요.";
    setErr(e);
    if (Object.keys(e).length) { if (e.account) setOpenAcc(true); return; }
    saveEntry(tx.id, { account, memo: memo.trim(), withs, reason: reason.trim() });
    showToast(`${account}으로 저장했어요. 잔여 ${won(remainOf(account))}`);
    go("history");
  };

  const label = "mb-1.5 flex items-center justify-between text-[14px] font-semibold text-[var(--n7)]";
  const input = "h-11 w-full min-w-0 rounded-[var(--r-card)] border bg-[var(--n1)] px-3.5 text-[15px] text-[var(--n9)] outline-none focus:border-[var(--m600)]";
  const errLine = (k) => err[k] ? <p className="mt-1.5 text-[13px] text-[var(--s2)]">{err[k]}</p> : null;

  return (
    <div className="flex min-h-full flex-col">
      <div data-must="M3" className="flex-1 px-4 pb-3 pt-3">
        <Card className="sticky top-0 z-10 mb-2.5 border-b-2 border-b-[var(--n4)] bg-[var(--n1)] px-4 py-3">
          <div className="mb-1 flex items-center justify-between text-[12.5px] font-medium text-[var(--n6)]"><span>결제 정보(수정 불가)</span><Icon name="lock" size={14} /></div>
          <div className="flex items-center justify-between gap-3">
            <div className="min-w-0 truncate text-[15px] font-semibold text-[var(--n9)]">{tx.merchant}</div>
            <Badge tone={STATUS_TONE[tx.status] || "gray"}>{tx.status}</Badge>
          </div>
          <div data-hero className="text-[clamp(28px,8vw,32px)] font-bold tracking-[-0.03em] text-[var(--n9)] tabular-nums whitespace-nowrap">{won(tx.amount)}</div>
          <div className="mt-1 text-[13px] text-[var(--n6)]">{tx.date.slice(5).replace("-", "월 ")}일 {tx.time} · 카드 {MY_CARD.last4}</div>
          <div className="mt-0.5 truncate text-[13px] text-[var(--n6)]">승인번호 {tx.no} · {tx.kind || "국내"} 결제 · {tx.src || "문자"} 수신</div>
        </Card>

        <section className="mb-2.5">
          <div className={label}><span>계정과목</span></div>
          <button type="button" aria-expanded={openAcc} onClick={() => setOpenAcc(!openAcc)} className={cx(input, "flex items-center justify-between text-left", err.account ? "border-[var(--s2)]" : "border-[var(--n3)]")}>
            <span className={cx("truncate", account ? "" : "text-[var(--n6)]")}>{account || "계정과목을 고르면 잔여 한도가 보여요"}</span>
            <Icon name={openAcc ? "chevron-up" : "chevron-down"} size={18} />
          </button>
          {openAcc && (
            <Card className="mt-2 overflow-hidden">
              {order.map((a, i) => {
                const warn = isWarn("e1", THIS_MONTH, a);
                const sel = account === a;
                return (
                  <button key={a} type="button" onClick={() => { setAccount(a); setOpenAcc(false); setErr((x) => ({ ...x, account: null })); }} className={cx("flex min-h-[56px] w-full items-center justify-between gap-3 px-4 text-left", i ? "border-t border-[var(--n3)]" : "", sel ? "bg-[var(--m50)]" : "")}>
                    <span className="min-w-0">
                      <span className={cx("block truncate text-[15px]", sel ? "font-semibold text-[var(--m700)]" : "text-[var(--n9)]")}>{a}</span>
                      {prev && i === 0 && <span className="block text-[12.5px] text-[var(--n6)]">이전 분류</span>}
                    </span>
                    <span className={cx("shrink-0 whitespace-nowrap text-[13px] tabular-nums", warn ? "font-semibold text-[var(--s2)]" : "text-[var(--n6)]")}>잔여 {won(remainOf(a))} · 한도 {won(accountBudget("e1", a))}</span>
                  </button>
                );
              })}
            </Card>
          )}
          {account && (() => { const a = account; const w = isWarn("e1", THIS_MONTH, a); return <p className={cx("mt-1.5 text-[13px] tabular-nums", w ? "font-semibold text-[var(--s2)]" : "text-[var(--n7)]")}>{a} 월 한도 {won(accountBudget("e1", a))} 중 잔여 {won(remainOf(a))}</p>; })()}
          {errLine("account")}
        </section>

        <section className="mb-2.5">
          <div className={label}><span>적요</span><span className="shrink-0 whitespace-nowrap pl-2 text-[12.5px] font-normal text-[var(--n7)] tabular-nums">{memo.length}자</span></div>

SCREENS["history"] = function History() {
  useDB();
  const params = useParams();
  const [view, setView] = useState(params.view === "day" ? "day" : "month");
  const [f, setF] = useState(["unentered", "done", "cancel"].includes(params.f) ? params.f : "all");
  const [open, setOpen] = useState({});
  const [sel, setSel] = useState(null);

  const all = txOf("e1", THIS_MONTH);
  const isCancel = (t) => t.status === "승인취소";
  const FILTERS = [
    { key: "all", label: "전체", fn: () => true },
    { key: "unentered", label: "미입력", fn: (t) => t.status === "미입력" },
    { key: "done", label: "입력 완료", fn: (t) => t.status === "입력 완료" },
    { key: "cancel", label: "승인취소", fn: isCancel },
  ];
  const cur = FILTERS.find((x) => x.key === f);
  const rows = all.filter(cur.fn);
  const cancelRows = all.filter(isCancel);
  const cancelPairs = cancelRows.filter((t) => t.amount < 0).length;
  const total = f === "cancel" ? sum(rows.filter((t) => t.amount < 0), (t) => -t.amount) : sum(rows, (t) => t.amount);
  const big = (n) => (Math.abs(n) >= 1000000 ? man(n) : won(n));
  const countLabel = f === "cancel" ? `${rows.length}행 · 취소 합계` : `${rows.length}건 · 합계`;

  // 날짜별 묶음(최신순 유지)
  const groups = [];
  rows.forEach((t) => {
    let g = groups[groups.length - 1];
    if (!g || g.date !== t.date) { g = { date: t.date, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  const gSum = (g) => sum(g.items, (t) => t.amount);
  const pick = (t) => (t.status === "미입력" ? go("entry", { tx: t.id }) : setSel(t));
  const toggle = (d) => setOpen((o) => ({ ...o, [d]: !o[d] }));

  const origOf = sel && sel.amount < 0 ? all.find((t) => t.merchant === sel.merchant && t.amount === -sel.amount) : null;
  const firstCancel = cancelRows.find((t) => t.amount < 0);
  const firstOrig = firstCancel ? all.find((t) => t.merchant === firstCancel.merchant && t.amount === -firstCancel.amount) : null;

  const EMB = { 복리후생비: "utensils", 접대비: "handshake", 교통비: "car", 소모품비: "package", 출장비: "briefcase", 회의비: "coffee", 도서인쇄비: "book-open" };
  const Row = ({ t }) => {
    const c = isCancel(t);
    return (
      <button type="button" onClick={() => pick(t)} data-tx={t.id} className={cx("flex h-16 w-full items-center gap-3 px-4 text-left active:bg-[var(--n2)]", c && "border-l-[3px] border-l-[var(--n5)] bg-[var(--n2)]")}>
        <span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--n2)] text-[var(--n7)]"><Icon name={c ? "rotate-ccw" : (EMB[t.account] || "circle-help")} size={18} /></span>
        <span className="min-w-0 flex-1">
          <span className={cx("block truncate text-[15px] font-semibold", c && t.amount > 0 ? "text-[var(--n6)] line-through" : "text-[var(--n9)]")}>{t.merchant}{t.amount < 0 ? " 승인취소" : ""}</span>
          <span className="block truncate text-[11.5px] text-[var(--n6)]">{[t.time, t.account || (t.status === "미입력" ? "계정과목 미입력" : null), MY_CARD.last4].filter(Boolean).join(" · ")}</span>
        </span>
        <span className="flex shrink-0 flex-col items-end gap-0.5">
          <Money n={t.amount} className={cx("text-[15px] font-semibold", c && t.amount > 0 ? "text-[var(--n6)] line-through" : "text-[var(--n9)]")} />
          <StatusMark tx={t} />
        </span>
      </button>
    );
  };

  return (
    <div className="pb-6">
      <div data-must="M2" className="px-4 pt-3">
        <div className="flex h-8 items-center justify-between gap-3">
          <div className="whitespace-nowrap text-[18px] font-bold text-[var(--n9)]">2026년 11월</div>
          <div className="w-[148px] shrink-0 [&_button]:h-7 [&_button]:text-[13px]">
            <Seg label="보기 방식" value={view} onChange={setView} options={[{ key: "month", label: "월별" }, { key: "day", label: "일별" }]} />
          </div>
        </div>
        <div className="mt-2 flex gap-1.5">
          {FILTERS.map((x) => (
            <button key={x.key} type="button" aria-pressed={f === x.key} onClick={() => setF(x.key)} className={cx("flex h-9 min-w-0 flex-1 items-center justify-center gap-1 whitespace-nowrap rounded-full border px-1.5 text-[13px]", f === x.key ? "border-[var(--m600)] bg-[var(--m50)] font-semibold text-[var(--m700)]" : "border-[var(--n3)] bg-[var(--n1)] text-[var(--n7)]")}>
              {x.label}
              <span className="text-[11px] font-normal tabular-nums opacity-70">{all.filter(x.fn).length}</span>
            </button>
          ))}
        </div>

        <div className="mt-2 flex items-baseline justify-between gap-2">
          <div className="min-w-0 whitespace-nowrap text-[13px] text-[var(--n6)]">
            {countLabel} <span data-hero className="text-[28px] font-extrabold leading-none tracking-[-0.03em] tabular-nums text-[var(--m600)]">{big(total)}</span>
          </div>
          {f !== "cancel" && cancelPairs > 0 && (
            <button type="button" onClick={() => setF("cancel")} className="shrink-0 whitespace-nowrap text-[12.5px] font-semibold text-[var(--n7)]">승인취소 {cancelPairs}건 보기</button>
          )}
        </div>
        {f !== "cancel" && firstCancel && firstOrig && (
          <button type="button" onClick={() => setSel(firstCancel)} className="mt-1 flex h-7 w-full items-center gap-2 text-left text-[12.5px] text-[var(--n6)]">
            <span className="truncate line-through">{firstOrig.merchant} {won(firstOrig.amount)}</span>
            <span className="shrink-0 rounded bg-[var(--n2)] px-1.5 py-0.5 text-[11.5px] font-semibold text-[var(--n7)]">승인취소</span>
            <span className="ml-auto shrink-0 tabular-nums">{firstCancel.date.slice(5).replace("-", ".")}</span>
          </button>
        )}
      </div>

      {rows.length === 0 && <div className="px-4 py-12 text-center text-[14px] text-[var(--n6)]">조건에 맞는 결제가 없어요.</div>}

      {view === "month" ? (
        <div className="mt-2">
          {groups.map((g) => (
            <section key={g.date}>
              <div className="flex items-baseline justify-between bg-[var(--n0)] px-4 pb-1 pt-4 text-[13px] text-[var(--n6)]">
                <span className="font-semibold text-[var(--n7)]">{dayLabel(g.date)}{g.date === TODAY ? " · 오늘" : ""}</span>
                <span className="tabular-nums">{g.items.length}건 · {won(gSum(g))}</span>
              </div>
              <div className="divide-y divide-[var(--n3)] border-y border-[var(--n3)] bg-[var(--n1)]">
                {g.items.map((t) => (
                  <Row key={t.id} t={t} />
                ))}
              </div>
            </section>
          ))}
        </div>
      ) : (
        <div className="mt-2 divide-y divide-[var(--n3)] border-y border-[var(--n3)] bg-[var(--n1)]">
          {groups.map((g) => {
            const isOpen = !!open[g.date];
            const un = g.items.filter((t) => t.status === "미입력").length;
            return (
              <div key={g.date}>
                <button type="button" aria-expanded={isOpen} onClick={() => toggle(g.date)} className="flex w-full items-center gap-3 px-4 py-3.5 text-left active:bg-[var(--n2)]">
                  <span className="min-w-0 flex-1">
                    <span className="block truncate text-[15px] font-semibold text-[var(--n9)]">{dayLabel(g.date)}</span>
                    <span className="mt-0.5 block truncate text-[13px] text-[var(--n6)]">{g.items.length}건{un ? ` · 미입력 ${un}건` : ""}</span>
                  </span>
                  <Money n={gSum(g)} className="text-[15px] font-semibold text-[var(--n9)]" />
                  <Icon name={isOpen ? "chevron-up" : "chevron-down"} size={16} className="text-[var(--n5)]" />
                </button>
                {isOpen && (
                  <div className="divide-y divide-[var(--n3)] border-t border-[var(--n3)] bg-[var(--n0)]">
                    {g.items.map((t) => (
                      <Row key={t.id} t={t} />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <Sheet open={!!sel} onClose={() => setSel(null)} title={sel ? sel.merchant : ""}
        footer={<Btn variant="secondary" className="w-full" onClick={() => setSel(null)}>닫기</Btn>}>
        {sel && (
          <div>
            <div className="flex items-center justify-between">
              <Money n={sel.amount} className={cx("text-[20px] font-bold tracking-[-0.03em]", sel.amount > 0 && isCancel(sel) && "line-through text-[var(--n6)]")} />
              <StatusMark tx={sel} />
            </div>
            <div className="mt-1 text-[13px] text-[var(--n6)]">{dayLabel(sel.date)} {sel.time}</div>
            {isCancel(sel) && (
              <div className="mt-3 rounded-[var(--r-card)] bg-[var(--n2)] px-3 py-2.5 text-[13.5px] text-[var(--n7)]">
                {sel.amount < 0 ? `원 결제 ${origOf ? won(origOf.amount) : ""}을 취소한 내역이에요. 예산에서 빠졌어요.` : "승인취소된 결제예요. 취소 행과 합쳐 0원으로 계산해요."}
              </div>
            )}
            <dl className="mt-3 divide-y divide-[var(--n3)] text-[14px]">
              {[
                ["계정과목", sel.account || "-"],
                ["적요", sel.memo || "-"],
                ["동행", sel.withs && sel.withs.length ? sel.withs.join(", ") : "없음"],
                ["사유", sel.reason || "-"],
              ].map(([k, v]) => (

                </div>
              ))}
            </dl>
          </div>
        )}
      </Sheet>
    </div>
  );
