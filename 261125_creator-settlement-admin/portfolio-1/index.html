    setQ(v);

  return (

        </label>
        <label className="csa-select" style={{ flex: "2 1 280px", minWidth: 0 }}>
          <Icon name="file-text" size={16} />
          <select value={cid} onChange={(e) => pick(e.target.value)} aria-label="계약 선택" style={{ width: "100%", minWidth: 0 }}>

        {cr && c && <span style={{ fontSize: 13, color: "var(--n7)", whiteSpace: "nowrap" }}>{cr.field} · {BIZ[bizAt(c.creator, CUR_MONTH)].label}</span>}

      <div data-hero data-must="M6" className="csa-card" style={{ padding: 0, marginBottom: 16, minWidth: 120, minHeight: 60, overflow: "hidden" }}>
        <TableBox minWidth={820}>
          <thead>
            <tr>
              <th>정산 월</th>
              <th className="num">분배율</th>
              <th className="num">매출</th>
              <th className="num">지출 공제</th>
              <th className="num">원천세</th>
              <th className="num">지급액</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.month} data-click aria-selected={r.month === CUR_MONTH ? "true" : undefined} onClick={() => go("result", { calc: cid })}>
                <td style={{ fontWeight: 600 }}>{monthLabel(r.month)}</td>
                <td className="num">{pct(r.rate)}{r.rateChanged && <span style={{ marginLeft: 6, fontSize: 12, color: "var(--s3-text)" }}>변경</span>}</td>
                <td className="num">{won(r.calc.revenue)}</td>
                <td className="num">{r.calc.deduct ? won(-r.calc.deduct) : "0"}</td>
                <td className="num">{r.calc.tax ? won(-r.calc.tax) : "0"}</td>

                <td><StatusChip status={r.state} /></td>

            ))}

            <tr>

              <td className="num"></td>

/* ── 화면 main (screens/main.jsx) ── */

  const [sel, setSel] = useState(p.open || "C-1042");
  const [cell, setCell] = useState(p.open || "C-1042");
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const [draft, setDraft] = useState({ cat: "props", memo: "", amount: "" });
  const [bad, setBad] = useState(false);
  const inputs = useRef({});
  useEffect(() => { setSel(p.open || "C-1042"); setCell(p.open || "C-1042"); }, [p]);
  useEffect(() => { const el = inputs.current[cell]; if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) {} } }, [cell, month]);

  const locked = isFinal(month);
  const rows = monthRows(month);
  const counts = statusCount(month);
  const total = monthTotal(month);
  const stateOf = (r) => (locked ? "paid" : (r.entry || { status: "empty" }).status);
  const kw = q.trim();
  const shown = rows.filter((r) => (filter === "all" || stateOf(r) === filter) && (!kw || r.creator.name.includes(kw) || r.contract.id.toLowerCase().includes(kw.toLowerCase()) || r.contract.title.includes(kw)));
  const selRow = rows.find((r) => r.contract.id === sel) || rows[0];
  const selId = selRow ? selRow.contract.id : null;
  const selEntry = selRow ? selRow.entry : null;
  const selCalc = selRow ? selRow.calc : null;

  const steps = calcSteps(selCalc);

  const FILTERS = [
    { key: "all", label: "전체", n: rows.length },
    ...(locked ? [] : ["done", "check", "editing", "empty"].map((k) => ({ key: k, label: ENTRY_STATUS[k].label, n: counts[k] || 0 }))),
  ];

  const pick = (cid) => go("main", { open: cid });
  const onRevenue = (cid, v) => {
    const digits = String(v).replace(/[^0-9]/g, "");

    const r = saveEntries(month);

  };
  const onCalc = () => {
    if (!locked) saveEntries(month);
    go("result", { calc: selId });
  };

    const amt = Number(String(draft.amount).replace(/[^0-9]/g, ""));
    if (!amt) { setBad(true); toast("지출 금액을 넣어 주세요", "warn"); return; }
    if (!selEntry) { toast("매출을 먼저 입력해 주세요", "warn"); return; }

                <button key={f.key} type="button" role="tab" aria-selected={filter === f.key} onClick={() => setFilter(f.key)}
                  className={cx("inline-flex items-center gap-1.5 h-8 px-3 rounded-[var(--r-ctl)] text-[13px] font-semibold whitespace-nowrap shrink-0 transition-colors",

                          <span className={c && c.over > 0 ? "text-[var(--s2-text)] font-semibold" : ""}>{c ? won(c.deduct) : r.entry && r.entry.expenses.length ? won(sum(r.entry.expenses, (x) => x.amount)) : "—"}</span>

                      <td className="text-[13px] text-[var(--n6)] tabular-nums">{lastAt(r.entry)}</td>

                  <td className="num">{won(total.deduct)}</td>

                  <span className="ml-auto inline-flex items-center gap-1.5 text-[13px] text-[var(--n6)] tabular-nums whitespace-nowrap"><Icon name="receipt-text" size={14} />지출 공제 · {selId}</span>
                </div>
                <div className="text-[13px] text-[var(--n7)] truncate">{selRow.contract.title}</div>
                {issue && (

                    <Icon name="triangle-alert" size={15} className="mt-0.5" />{issue}
                  </div>
                )}
              </div>

              <div className="px-5 py-3">
                <div className="flex items-center justify-between text-[12.5px] font-semibold text-[var(--n6)] pb-1.5">
                  <span>지출 항목</span><span>금액</span>
                </div>
                {(selEntry ? selEntry.expenses : []).map((x) => {
                  const k = expCat(x.cat) || { name: x.cat, deductible: true };
                  return (
                    <div key={x.id} className="flex items-center gap-2 py-1.5 border-t border-[var(--n3)]">
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5 text-[14px] font-semibold text-[var(--n9)] whitespace-nowrap">
                          {k.name}{k.deductible === false && <span className="csa-chip bg-[var(--n2)] text-[var(--n7)]" style={{ height: 20, padding: "0 7px", fontSize: 11.5 }}>공제 불가</span>}
                        </div>
                        {x.memo && <div className="text-[12.5px] text-[var(--n6)] truncate">{x.memo}</div>}
                      </div>
                      <input className="csa-input cell" style={{ width: 112, flex: "none" }} inputMode="numeric" disabled={locked} aria-label={k.name + " 금액"}
                        value={won(x.amount)} onChange={(e) => updateExpense(selId, month, x.id, { amount: e.target.value.replace(/[^0-9]/g, "") || 0 })} />
                      {!locked && (
                        <button type="button" className="csa-x shrink-0" style={{ width: 30, height: 30 }} aria-label={k.name + " 삭제"}
                          onClick={() => { removeExpense(selId, month, x.id); toast(k.name + " 항목을 뺐어요"); }}>
                          <Icon name="x" size={15} />
                        </button>
                      )}
                    </div>
                  );
                })}
                {selEntry && selEntry.expenses.length === 0 && (
                  <div className="py-3 border-t border-[var(--n3)] text-[13px] text-[var(--n6)]">이 달에 공제할 지출이 없어요</div>
                )}

                {!locked && (
                  <div className="mt-1 pt-3 border-t border-dashed border-[var(--n4)] grid gap-2">
                    <div className="flex gap-2">
                      <label className="csa-select flex-1 min-w-0" style={{ height: 36, fontWeight: 500 }}>
                        <select value={draft.cat} onChange={(e) => setDraft({ ...draft, cat: e.target.value })} aria-label="지출 항목" className="min-w-0 flex-1">
                          {EXP_CATS.map((k) => <option key={k.id} value={k.id}>{k.name}{k.deductible ? "" : " (공제 불가)"}</option>)}
                        </select>
                        <Icon name="chevron-down" size={14} />
                      </label>
                      <input className="csa-input cell" style={{ width: 112, flex: "none", height: 36 }} inputMode="numeric" placeholder="금액" aria-label="추가할 지출 금액" aria-invalid={bad ? "true" : undefined}
                        value={draft.amount ? Number(draft.amount).toLocaleString("ko-KR") : ""} onChange={(e) => { setBad(false); setDraft({ ...draft, amount: e.target.value.replace(/[^0-9]/g, "") }); }}
                        onKeyDown={(e) => { if (e.key === "Enter") onAdd(); }} />
                    </div>
                    <div className="flex gap-2">
                      <input className="csa-input flex-1" style={{ height: 36, fontSize: 14 }} placeholder="메모(증빙 내용)" aria-label="지출 메모" value={draft.memo} onChange={(e) => setDraft({ ...draft, memo: e.target.value })} onKeyDown={(e) => { if (e.key === "Enter") onAdd(); }} />
                      <Btn kind="secondary" size="sm" icon="plus" onClick={onAdd}>항목 추가</Btn>
                    </div>
                  </div>
                )}

                <div className="mt-3 flex items-center justify-between rounded-[var(--r-ctl)] bg-[var(--n0)] px-3 h-11">
                  <span className="text-[14px] font-semibold text-[var(--n9)]">공제 합계</span>
                  <span className="text-[16px] font-bold tabular-nums text-[var(--n10)]">{selCalc ? won(selCalc.deduct) : won(sum((selEntry || { expenses: [] }).expenses.filter((x) => (expCat(x.cat) || {}).deductible !== false), (x) => x.amount))}<span className="text-[13px] font-medium ml-0.5">원</span></span>
                </div>
              </div>

              <div className="px-5 pt-3 pb-3.5 border-t border-[var(--n3)]">
                <div className="text-[12.5px] font-semibold text-[var(--n6)] mb-1">지급액 계산 내역 · {monthShort(month)}</div>
                {steps.length === 0 && <div className="py-3 text-[13px] text-[var(--n6)]">매출을 입력하면 지급액이 계산돼요</div>}
                {steps.map((s) => {
                  const last = s.key === "payout";
                  return (
                    <div key={s.key} className={cx("flex items-baseline gap-3 py-1", last && "mt-1.5 pt-2.5 border-t-2 border-[var(--n9)]")}>
                      <div className="min-w-0 flex-1">
                        <div className={cx("text-[14px] whitespace-nowrap", last ? "font-bold text-[var(--n10)]" : s.key === "deduct" ? "font-semibold text-[var(--n9)]" : "text-[var(--n8)]")}>{s.label}</div>
                        <div className="text-[12px] text-[var(--n6)] truncate">{s.formula}</div>
                      </div>
                      <div className={cx("tabular-nums whitespace-nowrap text-right", last ? "font-bold text-[var(--m700)]" : "text-[14px] text-[var(--n9)]")} style={last ? { fontSize: "clamp(20px,1.8vw,24px)" } : undefined}>
                        {won(s.amount)}{last && <span className="text-[14px] font-semibold ml-0.5">원</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </aside>
      </div>
    </Wrap>
  );
};

/* ── 화면 migrate (screens/migrate.jsx) ── */
SCREENS["migrate"] = function Migrate() {
  useDB();
  const job = DB.importJob;
  const sum = importSummary();
  const registered = job.status === "registered";
  const [busy, setBusy] = useState(false);

  const run = () => {
    if (registered || busy || sum.ok === 0) return;
    setBusy(true);
    setTimeout(() => {
      const n = registerImport();
      setBusy(false);
      toast(n + "행을 등록했어요", "ok");
    }, 450);
  };

  const sub = registered
    ? "등록을 마쳤어요. 확인 필요 행은 엑셀에서 고친 뒤 다시 올려 주세요."
    : "정상 행만 등록하고, 확인 필요 행은 보류해요.";

  return (
    <Wrap>
      <ScreenHead title="데이터 이관" sub={sub} />

      <section data-must="M8" className="csa-card" style={{ overflow: "hidden", minWidth: 0 }}>
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: "12px 24px", padding: "16px 20px", borderBottom: "1px solid var(--n3)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0, flex: "1 1 260px" }}>
            <span style={{ width: 40, height: 40, flex: "none", borderRadius: 10, background: "var(--m50)", color: "var(--m700)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="file-spreadsheet" size={20} />
            </span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: "var(--n10)", overflowWrap: "anywhere" }}>{job.file}</div>
              <div style={{ fontSize: 13, color: "var(--n7)", fontVariantNumeric: "tabular-nums" }}>
                {job.size} · 시트 {job.sheet} · {job.by} · {job.uploadedAt} 업로드
              </div>
            </div>
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: "10px 16px", marginLeft: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
              {registered ? (
                <StatusChip status="done" map={IMPORT_STATUS} label={"등록됨 " + sum.done + "건"} />
              ) : (
                <StatusChip status="ok" map={IMPORT_STATUS} label={"정상 " + sum.ok + "건"} />
              )}
              <StatusChip status="check" map={IMPORT_STATUS} label={"확인 필요 " + sum.check + "건"} />
            </div>
            <Btn kind="primary" icon={registered ? "check" : "upload"} onClick={run} disabled={registered || busy || sum.ok === 0} data-loading={busy ? "true" : undefined}>
              {registered ? "등록 완료" : busy ? "등록하는 중" : "정상 행 등록"}
            </Btn>
          </div>
        </div>

        <div data-hero style={{ minWidth: 0 }}>
          <TableBox minWidth={980}>
            <thead>
              <tr>
                <th className="num">행</th>
                <th>크리에이터</th>
                <th>사업자 유형</th>
                <th>계약</th>
                <th>정산 월</th>
                <th className="num">분배율</th>
                <th className="num">매출</th>
                <th className="num">지출 공제</th>
                <th>상태</th>
                <th>오류 사유</th>
              </tr>
            </thead>
            <tbody>
              {job.rows.map((r) => {
                const bad = r.status === "check";
                return (
                  <tr key={r.row}>
                    <td className="num" style={{ color: "var(--n7)" }}>{r.row}</td>
                    <td style={{ fontWeight: 600 }}>{r.creator}</td>
                    <td style={r.biz ? undefined : { color: "var(--s3-text)" }}>{r.biz || "비어 있음"}</td>
                    <td>{r.contract}</td>
                    <td style={r.month ? undefined : { color: "var(--s3-text)" }}>{r.month}</td>
                    <td className="num">{r.rate} : {r.companyRate}</td>
                    <td className="num">{won(r.revenue)}</td>
                    <td className="num">{won(r.deduct)}</td>
                    <td><StatusChip status={r.status} map={IMPORT_STATUS} /></td>
                    <td style={{ color: bad ? "var(--s3-text)" : "var(--n6)" }}>{bad ? r.reason : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </TableBox>
        </div>
      </section>
    </Wrap>
  );
};

/* ── 화면 result (screens/result.jsx) ── */
SCREENS["result"] = function Result() {
  useDB();
  const p = useParams();
  const rows = monthRows(CUR_MONTH);
  const ready = rows.filter((r) => r.calc);
  const first = (ready[0] || rows[0]).contract.id;
  const [sel, setSel] = useState(p.calc || first);
  useEffect(() => { setSel(p.calc || first); }, [p]);
  const cur = ready.find((r) => r.contract.id === sel) || ready[0];
  const r = cur ? cur.calc : null;
  const steps = calcSteps(r);
  const tot = monthTotal(CUR_MONTH);
  const byBiz = totalsByBiz(CUR_MONTH);
  const nowrap = { whiteSpace: "nowrap" };
  const stepRow = (s, i) => {
    const last = s.key === "payout";
    return (
      <li key={s.key} style={{ display: "grid", gridTemplateColumns: "28px minmax(0,1fr) auto", gap: 10, alignItems: "baseline", padding: "7px 0", borderTop: i ? "1px solid var(--n3)" : "none" }}>
        <span style={{ fontSize: 13, color: "var(--n6)", fontVariantNumeric: "tabular-nums" }}>{i + 1}</span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: "var(--n9)", ...nowrap }}>{s.label}</div>
          <div style={{ fontSize: 13, color: "var(--n6)", marginTop: 2 }}>{s.formula}</div>
        </div>
        {last ? (
          <span style={{ fontSize: "clamp(28px,6vw,40px)", fontWeight: 800, color: "var(--m600)", fontVariantNumeric: "tabular-nums", textAlign: "right", ...nowrap }}>{won(s.amount)}원</span>
        ) : (
          <span style={{ fontSize: 15, color: s.amount < 0 ? "var(--n7)" : "var(--n9)", fontVariantNumeric: "tabular-nums", textAlign: "right", ...nowrap }}>{s.amount < 0 ? "−" + won(-s.amount) : won(s.amount)}원</span>
        )}
      </li>
    );
  };
  return (
    <Wrap>
      <ScreenHead
        title="정산 결과"
        sub={monthLabel(CUR_MONTH) + " 정산 · 지급 예정일 " + dotDate(PAYDAY)}
        right={<div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}><label className="csa-select" style={{ maxWidth: "100%" }}>
              <Icon name="file-text" size={16} />
              <select aria-label="계약 고르기" value={sel} onChange={(e) => setSel(e.target.value)}>
                {ready.map((x) => <option key={x.contract.id} value={x.contract.id}>{x.contract.id} {x.contract.title}</option>)}
              </select>
            </label>
<Btn kind="secondary" size="sm" icon="download" onClick={() => toast("지급 내역을 엑셀로 내려받았어요", "ok")}>엑셀로 내보내기</Btn></div>}
      />
      <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 400px", minWidth: 0, display: "flex", flexDirection: "column", gap: 12 }}>
        <section data-must="M5" data-hero="true" className="csa-card" style={{ padding: "14px 18px", minWidth: 0, borderTop: "2px solid var(--m600)" }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13, color: "var(--n6)" }}>계산 내역</div>
              <div style={{ fontSize: 17, fontWeight: 700, color: "var(--n9)" }}>{cur ? cur.contract.title + " · " + cur.creator.name : "계약 없음"}</div>
            </div>
          </div>
          <ol style={{ listStyle: "none", margin: 0, padding: 0 }}>{steps.map(stepRow)}</ol>
          {r && (
            <div style={{ marginTop: 6, padding: "8px 12px", background: "var(--n1)", borderRadius: 10, fontSize: 13, color: "var(--n7)" }}>
              {BIZ[r.biz].label} · {BIZ[r.biz].tax} · 기준 {TAX_RULE.base} · {TAX_RULE.cut}
            </div>
          )}
        </section>

        <section data-must="M4" className="csa-card" style={{ padding: "12px 18px", minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: "var(--n9)", marginBottom: 4 }}>사업자 유형별 원천세</div>
          {byBiz.map((b, i) => (
            <div key={b.biz} style={{ padding: "6px 0", borderTop: i ? "1px solid var(--n3)" : "none", display: "flex", justifyContent: "space-between", gap: 10, alignItems: "baseline" }}>
              <span style={{ minWidth: 0, fontSize: 13, color: "var(--n7)" }}><b style={{ color: "var(--n9)", whiteSpace: "nowrap" }}>{b.label} {b.count}건</b> · {BIZ[b.biz].tax}</span>
              <span style={{ fontSize: 14, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap", color: b.tax ? "var(--n9)" : "var(--n6)" }}>{b.tax ? "−" + won(b.tax) + "원" : "공제 없음"}</span>
            </div>
          ))}
        </section>
        </div>

      <div style={{ flex: "1.3 1 440px", minWidth: 0 }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: "var(--n9)", margin: "0 0 8px" }}>{monthLabel(CUR_MONTH)} 크리에이터별 지급액</div>
        <TableBox minWidth={520}>
          <thead>
            <tr>
              <th style={nowrap}>계약</th>
              <th style={nowrap}>크리에이터</th>
              <th style={nowrap}>사업자 유형</th>
              <th className="num" style={nowrap}>매출</th>
              <th className="num" style={nowrap}>원천세</th>
              <th className="num" style={nowrap}>지급액</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((x) => (
              <tr key={x.contract.id} data-click="true" aria-selected={x.contract.id === sel} onClick={() => x.calc && setSel(x.contract.id)}>
                <td style={nowrap}>{x.contract.title}</td>
                <td style={nowrap}>{x.creator.name}</td>
                <td style={nowrap}>{x.calc ? BIZ[x.calc.biz].label + (BIZ[x.calc.biz].invoice ? "" : " · 3.3%") : "—"}</td>
                <td className="num" style={{ fontVariantNumeric: "tabular-nums" }}>{x.calc ? won(x.calc.revenue) : "미입력"}</td>
                <td className="num" style={{ fontVariantNumeric: "tabular-nums" }}>{x.calc ? (x.calc.tax ? "−" + won(x.calc.tax) : "없음") : "—"}</td>
                <td className="num" style={{ fontVariantNumeric: "tabular-nums", fontWeight: 600 }}>{x.calc ? won(x.calc.payout) : "—"}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{ borderTop: "2px solid var(--n9)", fontWeight: 700 }}>
              <td colSpan={3} style={nowrap}>월 합계 {tot.count}건</td>
              <td className="num" style={{ fontVariantNumeric: "tabular-nums" }}>{won(tot.revenue)}</td>
              <td className="num" style={{ fontVariantNumeric: "tabular-nums" }}>−{won(tot.tax)}</td>
              <td className="num" style={{ fontVariantNumeric: "tabular-nums", color: "var(--m600)" }}>{won(tot.payout)}</td>
            </tr>
          </tfoot>
        </TableBox>
      </div>
      </div>
    </Wrap>
  );
};

<script>(function(){try{if(document.getElementById("demo-chrome-css"))return;var st=document.createElement("style");st.id="demo-chrome-css";st.textContent="[data-house=\"demobar\"]{position:sticky;top:0;z-index:70}\nhtml{scroll-padding-top:var(--demo-chrome-h,0px)}\n.demo-hint-pulse{position:relative}\n.demo-hint-pulse::after{content:\"\";position:absolute;inset:-4px;border-radius:12px;box-shadow:0 0 0 0 rgba(255,255,255,.85);animation:demoHintPulse 1.6s ease-out 4;pointer-events:none}\n@keyframes demoHintPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}\n.demo-hint{position:fixed;z-index:80;width:min(300px,calc(100vw - 32px));background:#1d1d1d;color:#fff;border-radius:12px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font:14px/1.55 Pretendard,\"Apple SD Gothic Neo\",system-ui,sans-serif;opacity:0;transform:translateY(-4px);transition:opacity .25s ease,transform .25s ease}\n.demo-hint.on{opacity:1;transform:none}\n.demo-hint b{display:block;font-weight:600;margin-bottom:4px;font-size:14.5px}\n.demo-hint .demo-hint-arrow{position:absolute;top:-6px;width:12px;height:12px;background:#1d1d1d;transform:rotate(45deg);border-radius:2px}\n.demo-hint .demo-hint-row{display:flex;justify-content:flex-end;margin-top:10px}\n.demo-hint button{appearance:none;border:0;background:#fff;color:#1d1d1d;border-radius:8px;padding:6px 12px;font:600 13px/1.2 inherit;cursor:pointer}\n.demo-hint button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.demo-hint-pulse::after{animation:none}.demo-hint{transition:none}}\n@media print{.demo-hint{display:none}}";document.head.appendChild(st);}catch(e){}})();
(function(){try{
// 데모마다 따로 기억한다 — 모든 데모가 한 주소(firstpip.github.io) 아래라 키 하나면 한 데모에서 닫은 뒤 다른 데모에서도 안 떴다(2026-11-13 실측). P1·P2 는 같은 프로젝트라 한 번
var KEY=(function(){var p=location.pathname,i=p.lastIndexOf('/portfolio-');return 'demo-tour-hint-v1:'+(i>0?p.slice(0,i):p);})();
var FROM_TOUR=location.hash==='#tour'; // 키트가 해시를 곧 지우므로 실행 즉시 기록
function tourIsOpen(){return !!document.querySelector('[aria-current="step"]')||document.body.classList.contains('hk-tour-open');}
function bar(){return document.querySelector('[data-house="demobar"]');}
function tourBtn(){var b=bar();if(!b)return null;var els=b.querySelectorAll('button,a');for(var i=0;i<els.length;i++){if(/\uC2DC\uC5F0\s*\uC548\uB0B4/.test(els[i].textContent||''))return els[i];}return null;}
function stackH(){var h=0,b=bar();if(b)h+=b.getBoundingClientRect().height;var hs=document.querySelectorAll('header,nav');for(var i=0;i<hs.length;i++){var e=hs[i];if(b&&b.contains(e))continue;var cs=getComputedStyle(e);if(cs.position==='sticky'||cs.position==='fixed'){var r=e.getBoundingClientRect();if(r.top<=(b?b.getBoundingClientRect().height+2:2)&&r.height<200){h+=r.height;break;}}}return Math.round(h)+12;}
function setPad(){try{document.documentElement.style.setProperty('--demo-chrome-h',stackH()+'px');}catch(e){}}
var tries=0;(function wait(){var btn=tourBtn();if(!btn){if(++tries<40)return setTimeout(wait,250);return;}setPad();window.addEventListener('resize',setPad);
if(navigator.webdriver||/[?&]still=1/.test(location.search)||FROM_TOUR||location.hash==='#tour')return;
var seen=false;try{seen=localStorage.getItem(KEY)==='1';}catch(e){}if(seen)return;
setTimeout(function(){show(btn);},1200);})();
function show(btn){
if(!document.body.contains(btn)||tourIsOpen())return;
var tip=document.createElement('div');tip.className='demo-hint';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','\uC2DC\uC5F0 \uC548\uB0B4 \uB3C4\uC6C0\uB9D0');
var arrow=document.createElement('span');arrow.className='demo-hint-arrow';tip.appendChild(arrow);
var t=document.createElement('b');t.textContent='\uCC98\uC74C \uC624\uC168\uB098\uC694?';tip.appendChild(t);
var p=document.createElement('div');p.textContent="'\uC2DC\uC5F0 \uC548\uB0B4'\uB97C \uB204\uB974\uBA74 \uC774 \uD654\uBA74\uC758 \uC8FC\uC694 \uAE30\uB2A5\uC744 \uB2E8\uACC4\uBCC4\uB85C \uC9C1\uC811 \uB20C\uB7EC \uBCF4\uBA70 \uD655\uC778\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694.";tip.appendChild(p);
var row=document.createElement('div');row.className='demo-hint-row';var ok=document.createElement('button');ok.type='button';ok.textContent='\uC54C\uACA0\uC5B4\uC694';row.appendChild(ok);tip.appendChild(row);
document.body.appendChild(tip);btn.classList.add('demo-hint-pulse');
function place(){var r=btn.getBoundingClientRect(),w=tip.offsetWidth,vw=document.documentElement.clientWidth;var left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16);tip.style.left=left+'px';tip.style.top=(r.bottom+12)+'px';arrow.style.left=Math.max(14,Math.min(w-26,r.left+r.width/2-left-6))+'px';}
place();requestAnimationFrame(function(){tip.classList.add('on');});
var timer=setTimeout(function(){close(false);},25000);
function close(remember){clearTimeout(timer);if(remember){try{localStorage.setItem(KEY,'1');}catch(e){}}btn.classList.remove('demo-hint-pulse');tip.classList.remove('on');setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},300);window.removeEventListener('resize',place);window.removeEventListener('scroll',place,true);document.removeEventListener('keydown',onKey);btn.removeEventListener('click',onBtn,true);}
function onKey(e){if(e.key==='Escape')close(true);}
function onBtn(){close(true);}
ok.addEventListener('click',function(){close(true);});btn.addEventListener('click',onBtn,true);document.addEventListener('keydown',onKey);window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
}
}catch(e){}})();</script>

<script>
(function(){try{
if(window.__tourShift)return;window.__tourShift=1;
var PANEL='aside[aria-label="\uC2DC\uC5F0 \uC548\uB0B4"]',BAR='[data-house="demobar"],.look-demobar';
var SKIP=BAR+',[aria-live],script,style,template,noscript,'+PANEL;
var MINW=1024,GAP=12,shifted=[],key='',overlayKey='',timer=null;
function panel(){var p=document.querySelector(PANEL);if(!p)return null;var r=p.getBoundingClientRect();if(!(r.width>0&&r.height>0)||r.left>=innerWidth-4)return null;return {el:p,r:r};}
function inFlow(el){var cs=getComputedStyle(el);return cs.display!=='none'&&cs.position!=='fixed'&&cs.position!=='absolute';}
function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
