SCREENS["search"] = function Search() {
  useDB();
  const params = useParams();
  const [q, setQ] = useState("");
  const [game, setGame] = useState("");
  const [grade, setGrade] = useState("");
  const [region, setRegion] = useState(params.filter === "overseas" ? "overseas" : "");
  const [sort, setSort] = useState("");

  useEffect(() => {
    setRegion(params.filter === "overseas" ? "overseas" : "");
  }, [params.filter]);

  const pick = (cur, v, set) => set(cur === v ? "" : v);
  const reset = () => { setQ(""); setGame(""); setGrade(""); setRegion(""); setSort(""); };

  const postedRank = (l) => (l.posted === "오늘" ? 0 : 1);
  let rows = DB.listings.filter((l) => !l.mine);
  const term = q.trim();
  if (term) rows = rows.filter((l) => l.name.includes(term));
  if (game) rows = rows.filter((l) => l.game === game);
  if (grade) rows = rows.filter((l) => l.grade === grade);
  if (region === "domestic") rows = rows.filter((l) => sellerOf(l).country === "KR");
  if (region === "overseas") rows = rows.filter((l) => sellerOf(l).country !== "KR");
  if (sort === "price") rows = rows.slice().sort((a, b) => krwOf(a) - krwOf(b));
  if (sort === "new") rows = rows.slice().sort((a, b) => postedRank(a) - postedRank(b));

  const nKR = rows.filter((l) => sellerOf(l).country === "KR").length;
  const nFO = rows.length - nKR;

  return (
    <div className="flex min-h-full flex-col bg-[var(--n0)]">
      <div className="px-4 pt-2">
        <label className="flex h-[var(--c-input-h)] items-center gap-2 rounded-[var(--r-field)] bg-[var(--n2)] px-3">
          <Icon name="search" size={18} />
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="카드 이름을 입력하세요"
            className="min-w-0 flex-1 bg-transparent text-[15px] text-[var(--n9)] outline-none"
          />
          {q && (
            <button type="button" aria-label="입력 지우기" onClick={() => setQ("")} className="shrink-0 text-[var(--n6)]">
              <Icon name="x" size={16} />
            </button>
          )}
        </label>
      </div>

      <div className="flex items-center gap-2 overflow-x-auto px-4 py-2" style={{ scrollbarWidth: "none" }}>
        {GAMES.map((g) => (
          <Chip key={g} on={game === g} onClick={() => pick(game, g, setGame)}>{g}</Chip>
        ))}
        {["NM", "LP", "MP"].map((g) => (
          <Chip key={g} on={grade === g} onClick={() => pick(grade, g, setGrade)}>{g}</Chip>
        ))}
        <Chip on={region === "domestic"} onClick={() => pick(region, "domestic", setRegion)}>국내 판매자만</Chip>
        <Chip on={region === "overseas"} onClick={() => pick(region, "overseas", setRegion)}>해외 판매자만</Chip>
        <Chip on={sort === "price"} onClick={() => pick(sort, "price", setSort)}>낮은 가격순</Chip>
        <Chip on={sort === "new"} onClick={() => pick(sort, "new", setSort)}>최신순</Chip>
      </div>

      <div className="flex items-center justify-between gap-2 px-4 pb-1">
        <span className="min-w-0 truncate text-[13px] text-[var(--n6)]">
          국내 <b className="tabular-nums text-[var(--n9)]">{nKR}</b> · 해외 <b className="tabular-nums text-[var(--n9)]">{nFO}</b>
        </span>
        <div className="flex shrink-0 items-center gap-1">
          {["KRW", "USD", "JPY"].map((c) => (
            <button
              key={c}
              type="button"
              aria-pressed={DB.cur === c}
              onClick={() => setCur(c)}
              className={cx(
                "h-7 whitespace-nowrap rounded-full border px-2.5 text-[12px] font-semibold",
                DB.cur === c
                  ? "border-[var(--m600)] bg-[var(--m600)] text-[var(--n0)]"
                  : "border-[var(--n3)] bg-[var(--n1)] text-[var(--n6)]"
              )}
            >
              {c}
            </button>
          ))}
        </div>
      </div>

      {rows.length === 0 ? (
        <div className="flex flex-1 flex-col items-center justify-center gap-3 px-6 py-16 text-center">
          <p className="text-[14px] text-[var(--n6)]">조건에 맞는 카드가 없어요. 거르기를 풀고 다시 찾아보세요.</p>
          <Btn variant="primary" onClick={reset}>거르기 풀기</Btn>
        </div>
      ) : (
        <div data-must="M8" data-hero className="divide-y divide-[var(--n3)] border-y border-[var(--n3)] bg-[var(--n1)]">
          {rows.map((l) => (
            <div key={l.id}>
              <ListingRow l={l} onOpen={() => go("home", { open: l.id })} />
              <div className="-mt-2 flex items-center pb-1.5 pl-[76px] pr-4">
                {sellerOf(l).country === "KR" ? (

                ) : (
                  <Badge tone="main">해외 직배송</Badge>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};
