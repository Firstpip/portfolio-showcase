/* ── 화면 graph (screens/graph.jsx) ── */
SCREENS["graph"] = function Graph() {
  const params = useParams();
  const pKey = JSON.stringify(params);
  const validRange = (r) => DB.graphRanges.some(x => x.k === r) ? r : '12h';
  const [range, setRange] = useState(validRange(params.range));
  const [marks, setMarks] = useState(params.marks === 'on');
  const boxRef = useRef(null);
  const [pick, setPick] = useState(null);

  useEffect(() => {
    setRange(validRange(params.range));
    setMarks(params.marks === 'on' || (params.range === '24h' && params.marks !== 'off'));
  }, [pKey]);

  const hours = DB.graphRanges.find(x => x.k === range).h;

  // 마운트 직후·범위가 바뀔 때 차트 중앙 시점을 한 번 짚는다
  useEffect(() => {
    const t = setTimeout(() => {
      const el = boxRef.current && boxRef.current.querySelector('svg');
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + r.width * 0.62, clientY: r.top + r.height / 2, bubbles: true }));
    }, 60);
    return () => clearTimeout(t);
  }, [range, marks]);

  const sl = slice(hours);
  const cnt = { low: 0, in: 0, high: 0 };
  sl.vals.forEach(v => { cnt[zoneOf(v)] += 1; });
  const dur = (n) => { const m = n * 5, h = Math.floor(m / 60), mm = m % 60; return h > 0 ? (mm ? h + '시간 ' + mm + '분' : h + '시간') : mm + '분'; };

  let minI = 0;
  sl.vals.forEach((v, i) => { if (v < sl.vals[minI]) minI = i; });
  const minV = sl.vals[minI];
  const minAt = hhmm(idxMinOfDay(sl.from + minI));

  const parts = [
    { z: 'in', label: '범위 안', icon: ZONE.in.icon },
    { z: 'high', label: '범위 위', icon: ZONE.high.icon },
    { z: 'low', label: '범위 아래', icon: ZONE.low.icon },
  ];

  return (
    <div style={{ paddingBottom: 24 }}>
      <ScreenHead title="그래프" sub="측정 간격 5분" />
      <div data-must="M3" data-hero style={{ padding: '0 16px' }}>
        <Seg label="시간 범위" value={range} options={DB.graphRanges.map(x => ({ k: x.k, label: x.label }))} onChange={setRange} />
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 12, minHeight: 44, whiteSpace: 'nowrap', fontVariantNumeric: 'tabular-nums' }}>
          {pick ? <>
            <span style={{ fontSize: 36, fontWeight: 700, lineHeight: '40px', color: 'var(--n10)' }}>{pick.v}</span>
            <span style={{ fontSize: 14, color: 'var(--n8)' }}>mg/dL</span>
            <span style={{ fontSize: 14, color: 'var(--n8)' }}>{hhmm(pick.min)}</span>
            <span style={{ marginLeft: 'auto', alignSelf: 'center' }}><ZoneChip z={pick.z || zoneOf(pick.v)} /></span>
          </> : <span style={{ fontSize: 14, color: 'var(--n7)' }}>곡선을 눌러 시점 확인</span>}
        </div>
        <div ref={boxRef} style={{ marginTop: 6, minHeight: 300 }}>
          <GlucoseChart hours={hours} height={300} pickable marks={marks} hero onPick={setPick} />
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginTop: 4 }}>
          <span style={{ fontSize: 13, color: 'var(--n7)', whiteSpace: 'nowrap' }}>곡선을 눌러 시점 확인</span>
          <button onClick={() => setMarks(m => !m)} aria-pressed={marks} style={{ height: 32, padding: '0 12px', borderRadius: 999, whiteSpace: 'nowrap', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 600, border: '1px solid ' + (marks ? 'var(--m700)' : 'var(--n4)'), background: marks ? 'var(--m50)' : 'var(--n0)', color: marks ? 'var(--m800)' : 'var(--n8)' }}>
            <Icon name={marks ? 'eye' : 'eye-off'} size={14} />식사·인슐린·운동 {marks ? '켜짐' : '꺼짐'}
          </button>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', margin: '12px 16px 0', borderTop: '1px solid var(--n3)', borderBottom: '1px solid var(--n3)' }}>
        {parts.map((p, i) => (
          <div key={p.z} style={{ padding: '10px 8px', borderLeft: i ? '1px solid var(--n3)' : 0, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, color: ZONE[p.z].text, fontWeight: 600, whiteSpace: 'nowrap' }}>
              <Icon name={p.icon} size={14} />{p.label}
            </div>
            <div style={{ marginTop: 4, fontSize: 14, fontWeight: 700, color: 'var(--n10)', whiteSpace: 'nowrap', fontVariantNumeric: 'tabular-nums' }}>{dur(cnt[p.z])}</div>
          </div>
        ))}
      </div>

      {range === '24h' && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '12px 16px 0', padding: '10px 12px', borderRadius: 12, background: minV < TARGET.low ? ZONE.low.bg : 'var(--n2)', color: minV < TARGET.low ? ZONE.low.text : 'var(--n9)', fontSize: 13 }}>
          <Icon name={minV < TARGET.low ? 'arrow-down-to-line' : 'activity'} size={16} />
          <span style={{ minWidth: 0 }}>{minV < TARGET.low ? '목표 범위 아래 구간' : '24시간 최저'} · {minAt} 최저 {minV} mg/dL</span>
        </div>
      )}
    </div>
  );
};

SCREENS["report"] = function Report() {
  const params = useParams();
  const pKey = JSON.stringify(params);
  const validPeriod = (p) => DB.reportRanges.some(x => x.k === p) ? p : '2w';
  const [period, setPeriod] = useState(validPeriod(params.period));
  useEffect(() => { setPeriod(validPeriod(params.period)); }, [pKey]);

  const rng = DB.reportRanges.find(x => x.k === period);
  const st = stats(rng.days);
  const W = 358, H = 200, L = 34, R = 6, T = 10, B = 26;
  const yMax = 250;
  const pw = W - L - R, ph = H - T - B;
  const y = (v) => T + ph - (Math.min(v, yMax) / yMax) * ph;
  const slot = pw / st.daily.length;
  const bw = Math.max(4, slot * 0.62);
  const labelEvery = st.daily.length <= 7 ? 1 : st.daily.length <= 14 ? 2 : 4;
  const segs = [
    { z: 'in', p: st.pIn },
    { z: 'high', p: st.pHigh },
    { z: 'low', p: st.pLow },
  ];

  return (
    <div style={{ paddingBottom: 24 }}>
      <ScreenHead title="리포트" sub="기준일 2026.11.26" />
      <div data-must="M4" style={{ padding: '0 20px' }}>
        <Seg label="리포트 기간" value={period} options={DB.reportRanges.map(r => ({ k: r.k, label: r.label }))} onChange={setPeriod} />

        <div data-hero style={{ marginTop: 18 }}>
          <div style={{ fontSize: 13, color: 'var(--n6)', whiteSpace: 'nowrap' }}>최근 {rng.days}일 평균</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 2 }}>
            <span style={{ fontSize: 60, fontWeight: 700, lineHeight: 1.05, color: 'var(--n10)', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>{st.avg}</span>
            <span style={{ fontSize: 15, color: 'var(--n6)', whiteSpace: 'nowrap' }}>mg/dL</span>
          </div>
        </div>

        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--n9)', whiteSpace: 'nowrap', marginBottom: 8 }}>시간 비율</div>
          <div role="img" aria-label={`목표 범위 안 ${st.pIn}%, 위 ${st.pHigh}%, 아래 ${st.pLow}%`} style={{ display: 'flex', height: 22, borderRadius: 11, overflow: 'hidden', background: 'var(--n2)', gap: 2 }}>
            {segs.filter(s => s.p > 0).map(s => (
              <div key={s.z} style={{ width: s.p + '%', background: ZONE[s.z].color, minWidth: 3 }} />
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 8, marginTop: 10 }}>
            {segs.map(s => (
              <div key={s.z} style={{ minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 4, color: ZONE[s.z].text, fontSize: 13, whiteSpace: 'nowrap' }}>
                  <Icon name={ZONE[s.z].icon} size={14} />
                  <span>{s.z === 'in' ? '범위 안' : s.z === 'high' ? '범위 위' : '범위 아래'}</span>
                </div>
                <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--n10)', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap', marginTop: 2 }}>{s.p.toFixed(1)}%</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginTop: 22 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--n9)', whiteSpace: 'nowrap' }}>일별 평균</span>
            <span style={{ fontSize: 13, color: 'var(--n6)', whiteSpace: 'nowrap' }}>목표 {TARGET.low}~{TARGET.high} mg/dL</span>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={`일별 평균 혈당 막대 ${st.daily.length}개`} style={{ display: 'block' }}>
            <rect x={L} y={y(TARGET.high)} width={pw} height={y(TARGET.low) - y(TARGET.high)} fill="var(--m50)" />
            {[0, 50, 100, 150, 200, 250].map(v => (
              <g key={v}>
                <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="var(--n3)" strokeWidth="1" />
                <text x={L - 5} y={y(v) + 4} textAnchor="end" fontSize="11" fill="var(--n6)">{v}</text>
              </g>
            ))}
            {st.daily.map((d, i) => {
              const z = zoneOf(d.avg);
              const x = L + i * slot + (slot - bw) / 2;
              return (
                <g key={i}>
                  <rect x={x} y={y(d.avg)} width={bw} height={y(0) - y(d.avg)} rx={2} fill={ZONE[z].color} />
                  {(st.daily.length - 1 - i) % labelEvery === 0 && (
                    <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="10.5" fill="var(--n6)">{d.date}</text>
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      </div>
    </div>
  );
};
