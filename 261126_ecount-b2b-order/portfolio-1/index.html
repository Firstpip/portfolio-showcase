SCREENS["products"] = function Products() {
  const params = useParams();

  const [q, setQ] = useState(params.q || "");
  const [sort, setSort] = useState("recommend");
  const [price, setPrice] = useState("all");
  const [inStock, setInStock] = useState(false);
  const [specialOnly, setSpecialOnly] = useState(false);
  const [sel, setSel] = useState(params.add || null);
  const [view, setView] = useState("card");
  const [qtyMap, setQtyMap] = useState(() => (params.add ? { [params.add]: 5 } : {}));
  const totals = useCartTotals();

  useEffect(() => {
    setCategory(params.category || "all");
    setQ(params.q || "");
  }, [params.category, params.q]);

  useEffect(() => {
    if (!params.add || !byId(params.add)) return;
    setQtyMap((m) => ({ ...m, [params.add]: 5 }));
    setSel(params.add);
    cartApi.setQty(params.add, 5);
  }, [params.add]);

  const cartQty = (id) => (totals.lines.find((l) => l.id === id) || {}).qty || 0;
  const qtyOfCard = (id) => (qtyMap[id] != null ? qtyMap[id] : cartQty(id) || 1);

  const keyword = q.trim().toLowerCase();
  const shown = useMemo(() => {
    let list = PRODUCTS.filter((p) => !p.unlisted).filter((p) => {
      if (category !== "all" && p.cat !== category) return false;
      if (keyword && !(p.name.toLowerCase().includes(keyword) || p.id.toLowerCase().includes(keyword))) return false;
      if (specialOnly && !(p.special < p.list)) return false;
      if (inStock && p.stock !== "재고 있음") return false;
      if (price === "u1" && !(p.special < 10000)) return false;
      if (price === "m1" && !(p.special >= 10000 && p.special < 20000)) return false;
      if (price === "o2" && !(p.special >= 20000)) return false;
      return true;
    });
    if (sort === "low") list = list.slice().sort((a, b) => a.special - b.special);
    if (sort === "high") list = list.slice().sort((a, b) => b.special - a.special);
    if (sort === "name") list = list.slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
    return list;
  }, [category, keyword, specialOnly, inStock, price, sort]);

  const narrowed = keyword || specialOnly || inStock || price !== "all";
  const catCount = category === "all" ? TOTAL_PRODUCTS : (CATS.find((c) => c.key === category) || {}).count || 0;
  const baseCount = narrowed ? shown.length : catCount;
  const pageCount = Math.max(1, Math.ceil(baseCount / PAGE_SIZE));
  const picked = sel ? byId(sel) : null;
  const showList = view === "list";

  const addToCart = (id) => cartApi.setQty(id, qtyOfCard(id));

  const Qty = (p) => {
    const v = qtyOfCard(p.id);
    const set = (n) => setQtyMap((m) => ({ ...m, [p.id]: Math.max(1, n) }));
    return (
      <div data-part="cell" onClick={(e) => e.stopPropagation()} className="flex items-center gap-2">
        <div className="inline-flex items-center border border-[var(--n3)] rounded-[var(--r-ctl-sm)] bg-[var(--n1)] h-9">
          <button type="button" aria-label="수량 줄이기" className="w-8 h-full text-[var(--n7)]" onClick={() => set(v - 1)}><Icon name="minus" size={12} /></button>
          <input aria-label="수량" inputMode="numeric" className="w-10 h-full text-center text-[14px] tabular-nums outline-none bg-transparent" value={v} onChange={(e) => set(parseInt(e.target.value.replace(/\D/g, ""), 10) || 1)} />

        </div>
        <Btn kind="sub" className="flex-1 min-w-0 !h-9 px-3 !text-[14px]" onClick={() => addToCart(p.id)}>담기</Btn>
      </div>
    );
  };

  return (

          </div>
