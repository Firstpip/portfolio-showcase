function Person({ i = 0, u }) {
  const p = PEOPLE[i % 4];

    const th = Math.PI * (0.88 + (k / 21) * 1.24);
    const sx = 150 + Math.cos(th) * 45, sy = 166 + Math.sin(th) * 45;
    const len = 9 + rnd(k, i + 20) * 15, bend = (rnd(k, i + 30) - 0.5) * 16;
    const ex = sx + Math.cos(th) * len + bend, ey = sy + Math.sin(th) * len + 6 + (p.style === 'long' || p.style === 'bob' ? rnd(k, 4) * 12 : 0);
    return <path key={k} d={`M${sx.toFixed(1)} ${sy.toFixed(1)} Q${(sx + Math.cos(th) * len * 0.6 + bend).toFixed(1)} ${(sy + Math.sin(th) * len * 0.6).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`} stroke={p.hair} strokeWidth={0.7 + rnd(k, 5) * 0.8} fill="none" strokeLinecap="round" opacity={0.45 + rnd(k, 6) * 0.35} />;

/* ── 화면 pen (screens/pen.jsx) ── */
const COLOR_NAMES = ['흰색', '노랑', '분홍', '빨강', '주황', '초록', '하늘', '보라'];
SCREENS["pen"] = function PenScreen() {
  const d = useDeco();
  const p = useParams();
  const tool = p.tool === 'eraser' ? 'eraser' : p.tool === 'pen' ? 'pen' : d.tool;
  const [mine, setMine] = React.useState([]);
  const [cur, setCur] = React.useState(null);
  const svgRef = React.useRef(null);
  const wpx = (PEN_W.find(w => w.k === d.width) || PEN_W[1]).px;
  const pt = (e) => {
    const r = svgRef.current.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) / r.width * 624), Math.round((e.clientY - r.top) / r.height * 824)];
  };
  const down = (e) => {
    if (tool === 'eraser') { setMine(m => m.slice(0, -1)); return; }
    e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
    const [x, y] = pt(e);
    setCur({ pts: [[x, y]], color: d.color, w: wpx });
  };
  const move = (e) => { if (!cur) return; const q = pt(e); setCur(c => c && ({ ...c, pts: [...c.pts, q] })); };
  const up = () => { if (cur && cur.pts.length > 0) setMine(m => [...m, cur]); setCur(null); };
  const pathOf = (s) => 'M' + s.pts.map(q => q.join(' ')).join(' L') + (s.pts.length === 1 ? ' l0.1 0' : '');
  const all = cur ? [...mine, cur] : mine;
  const pickTool = (t) => { d.setTool(t); go('pen', { tool: t }); };
  const cname = (c) => (PALETTE.indexOf(c) >= 0 ? COLOR_NAMES[PALETTE.indexOf(c)] : '기타');
  const wname = (px) => (px <= 4 ? PEN_W[0] : px <= 8 ? PEN_W[1] : PEN_W[2]).label;
  const kindOf = (s) => (s.d ? (/Z\s*$/i.test(s.d) ? '하트' : '선') : '선');
  const rows = [
    ...d.strokes.map((s, i) => ({ key: 'd' + i, kind: kindOf(s), color: s.color, w: s.w, src: '저장됨' })),
    ...mine.map((s, i) => ({ key: 'm' + i, kind: s.pts.length > 1 ? '선' : '점', color: s.color, w: s.w, src: '방금' })),
    ...(d.text ? [{ key: 't', kind: '손글씨', label: d.text, color: null, w: null, src: '저장됨' }] : []),
    { key: 'n', kind: tool === 'eraser' ? '지우개' : '다음 선', color: tool === 'eraser' ? null : d.color, w: wpx, src: '대기' },
  ];
  const toolRows = [
    ['펜', cname(d.color) + ' · ' + (PEN_W.find(w => w.k === d.width) || PEN_W[1]).label],
    ['지우개', '탭 한 번에 낙서 1개'],
    ['선택된 도구', tool === 'eraser' ? '지우개' : '펜'],
  ];
  const toolBtn = (t, icon, label, sub) => (
    <button type="button" key={t} onClick={() => pickTool(t)} aria-pressed={tool === t}
      className="flex items-center gap-3 rounded-[var(--r-ctl)] border-2 text-left min-w-0"
      style={{ minHeight: 72, padding: '10px 16px', borderColor: tool === t ? 'var(--m500)' : 'var(--n2)', background: tool === t ? 'var(--m800)' : 'var(--n1)', color: 'var(--n10)' }}>
      <span className="shrink-0 grid place-items-center" style={{ width: 28 }}><Icon name={icon} size={24} /></span>
      <span className="flex flex-col min-w-0 leading-tight">
        <span className="text-[17px] font-bold">{label}</span>
        <span className="text-[12px] opacity-75" style={{ overflowWrap: 'anywhere' }}>{sub}</span>
      </span>
    </button>
  );

  return (
    <div className="h-full p-5">
      <div data-must="M5" className="h-full flex gap-5 min-h-0" style={{ flexWrap: 'wrap', minWidth: 0 }}>
        <div data-hero className="relative flex items-center justify-center min-h-0 rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)]" style={{ flex: '1 1 min(420px,100%)', minWidth: 0, height: '100%', padding: 12 }}>
          <div className="relative h-full" style={{ aspectRatio: '624 / 824', maxWidth: '100%' }}>
            <FramePreview cuts={d.cuts} stickers={d.stickers} strokes={d.strokes} text={d.text} handles={false} style={{ height: '100%' }} />
            <svg ref={svgRef} viewBox="0 0 624 824" aria-label="그리기 영역" className="absolute inset-0 w-full h-full"
              style={{ touchAction: 'none', cursor: tool === 'eraser' ? 'cell' : 'crosshair' }}
              onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
              {all.map((s, i) => <path key={i} d={pathOf(s)} stroke={s.color} strokeWidth={s.w} fill="none" strokeLinecap="round" strokeLinejoin="round" />)}
            </svg>
          </div>
        </div>
        <div className="flex flex-col gap-4 min-h-0" style={{ flex: '0 1 420px', minWidth: 'min(320px,100%)' }}>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)] p-4">
            <div className="text-[16px] font-semibold text-[var(--n10)] mb-3 whitespace-nowrap">색</div>
            <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(4,minmax(56px,1fr))' }}>
              {PALETTE.map(c => {
                const on = d.color === c && tool === 'pen';
                return (
                  <button key={c} aria-label={'색 ' + c} onClick={() => { d.setColor(c); if (tool !== 'pen') pickTool('pen'); }}
                    className="rounded-full"
                    style={{ minHeight: 56, minWidth: 56, aspectRatio: '1', background: c, border: '2px solid var(--n2)',
                      outline: on ? '3px solid var(--m500)' : 'none', outlineOffset: 3, boxShadow: on ? '0 0 0 3px var(--n1)' : 'none' }} />
                );
              })}
            </div>
          </div>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)] p-4">
            <div className="text-[16px] font-semibold text-[var(--n10)] mb-3 whitespace-nowrap">굵기</div>
            <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(3,minmax(0,1fr))' }}>
              {PEN_W.map(w => {
                const on = d.width === w.k;
                return (
                  <button key={w.k} onClick={() => d.setWidth(w.k)} aria-pressed={on}
                    className="flex flex-col items-center justify-center gap-2 rounded-[var(--r-ctl)] border"
                    style={{ minHeight: 72, borderColor: on ? 'var(--m500)' : 'var(--n2)', background: on ? 'var(--m800)' : 'var(--n0)', borderWidth: on ? 2 : 1 }}>
                    <svg width="56" height="14" viewBox="0 0 56 14" aria-hidden="true"><line x1="6" y1="7" x2="50" y2="7" stroke={d.color} strokeWidth={w.px} strokeLinecap="round" /></svg>
                    <span className="text-[14px] whitespace-nowrap text-[var(--n10)]">{w.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
          <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(170px,1fr))' }}>
            {toolBtn('pen', 'pen-line', '펜', '손가락으로 그리고 글씨 쓰기')}
            {toolBtn('eraser', 'eraser', '지우개', '마지막 낙서 지우기')}
          </div>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)] px-4 py-3 flex flex-col gap-2">
            <div className="flex items-center gap-3" style={{ minHeight: 32 }}>
              <span className="text-[14px] text-[var(--n7)] whitespace-nowrap">{tool === 'eraser' ? '지우개 선택됨' : '펜 미리보기'}</span>
              <svg className="flex-1" height="20" viewBox="0 0 120 20" preserveAspectRatio="none" aria-hidden="true">
                <path d="M4 12 C24 2 40 20 60 10 S98 4 116 10" stroke={d.color} strokeWidth={wpx} fill="none" strokeLinecap="round" opacity={tool === 'eraser' ? 0.4 : 1} />
              </svg>
              <span className="text-[14px] text-[var(--n10)] whitespace-nowrap">{(PEN_W.find(w => w.k === d.width) || PEN_W[1]).label}</span>
            </div>
            <div className="text-[14px] text-[var(--n7)]">
              {tool === 'eraser' ? '탭할 때마다 가장 최근에 그린 낙서부터 지워요' : (PALETTE.indexOf(d.color) >= 0 ? COLOR_NAMES[PALETTE.indexOf(d.color)] : '선택한') + ' 색 · ' + (PEN_W.find(w => w.k === d.width) || PEN_W[1]).label + ' 굵기로 그리는 중'}
            </div>
            <div className="text-[14px] text-[var(--n10)] font-semibold">
              손글씨 {d.text} · 낙서 {d.strokes.length + mine.length}개
            </div>
          </div>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)] p-4 flex flex-col gap-2 flex-1 min-h-0" style={{ minHeight: 200 }}>
            <div className="flex items-center justify-between gap-3">
              <span className="text-[16px] font-semibold text-[var(--n10)]">낙서·글씨 목록</span>
              <span className="text-[14px] text-[var(--n7)] whitespace-nowrap">총 {rows.length}줄</span>
            </div>
            <ul className="flex flex-col min-h-0 overflow-auto" style={{ margin: 0, padding: 0, listStyle: 'none' }}>
              {rows.map((r, i) => (
                <li key={r.key} className="flex items-center gap-3 py-2 min-w-0" style={{ borderTop: i ? '1px solid var(--n2)' : 'none', minHeight: 44 }}>
                  <span className="shrink-0 rounded-full" style={{ width: 20, height: 20, background: r.color || 'var(--n5)', border: '1px solid var(--n2)' }} />
                  <span className="text-[14px] font-semibold text-[var(--n10)] whitespace-nowrap">{r.kind}</span>
                  <span className="flex-1 min-w-0 text-[14px] text-[var(--n7)]" style={{ overflowWrap: 'anywhere' }}>
                    {r.label ? '“' + r.label + '”' : cname(r.color) + ' · ' + wname(r.w)}
                  </span>
                  <span className="text-[12px] text-[var(--n7)] whitespace-nowrap">{r.src}</span>
                </li>
              ))}
            </ul>
          </div>
          <div className="rounded-[var(--r-card)] bg-[var(--n1)] border border-[var(--n2)] p-4 flex flex-col gap-1">
            <div className="text-[16px] font-semibold text-[var(--n10)] mb-1">도구별 현재 설정</div>
            {toolRows.map(([k, v]) => (
              <div key={k} className="flex items-center justify-between gap-3 min-w-0" style={{ minHeight: 32 }}>
                <span className="text-[14px] text-[var(--n7)] whitespace-nowrap">{k}</span>
                <span className="text-[14px] text-[var(--n10)] text-right min-w-0" style={{ overflowWrap: 'anywhere' }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};
