  "3902": ["하계 휴양소 신청을 4월 1일부터 받습니다. 이용 기간과 객실 배정 기준은 안내문에 정리했습니다.", "신청은 로그인 후 복지사업 메뉴에서 하실 수 있습니다."],

  "3908": ["임금교섭 제3차 본교섭 결과를 알려 드립니다. 교섭위원회는 기본급 인상률과 성과급 산정 방식을 중심으로 사측과 협의했습니다.", "다음 교섭 일정이 확정되는 대로 소식 제4호로 안내하겠습니다."],
  "3906": ["사무국 휴무일과 업무 시간을 안내합니다. 평일 09:00~18:00에 운영하며 점심시간은 12:00~13:00입니다.", "현장 상담일에는 생산동 휴게실에서 방문 상담을 받습니다."],
  "3903": ["건강검진 지원 대상은 조합원 인증을 마친 정규직 조합원입니다. 검진 기관과 지원 한도는 첨부 문서를 참고해 주십시오.", "신청 방법은 로그인 후 복지사업의 건강검진 지원 항목에서 확인하실 수 있습니다."],
  "3899": ["새 홈페이지는 사번과 휴대전화 인증을 거쳐 가입합니다. 기존 홈페이지의 회원정보는 옮기지 않으므로 새로 가입해 주셔야 합니다.", "인증이 끝나면 복지 신청과 고충상담, 조합원 전용 게시글을 이용하실 수 있습니다."],
  "3897": ["2026년 회계 감사 결과를 조합원께 공개합니다. 수입과 지출 내역, 감사 의견은 첨부된 보고서에 수록했습니다.", "문의 사항은 회계감사 담당에게 고충상담·건의 메뉴로 보내 주십시오."],
  "3894": ["설 명절 귀향 교통 지원 신청을 안내합니다. 지원 대상은 지방 거주 조합원이며 기차·고속버스 영수증이 필요합니다.", "신청은 연휴 시작 전까지 사무국으로 제출해 주십시오."],
  "3890": ["동계 휴양소를 다녀온 조합원들의 후기와 사진을 모았습니다. 객실 상태와 식당 이용, 주변 시설에 대한 의견이 담겨 있습니다.", "후기를 보내 주신 분들께 감사드리며, 지적해 주신 점은 내년 운영 기준에 반영하겠습니다."],
  "A0412": ["설악 휴양소에서 보낸 가족 여행 후기입니다. 아이들과 함께 해변을 걷고 가까운 사찰까지 다녀왔습니다.", "숙소가 깨끗하고 직원분들이 친절해서 다음 해에도 신청하려고 합니다."],
  "A1788": ["2018년 임금협약을 체결했습니다. 협약의 주요 내용은 기본급 인상, 상여금 지급 시기, 휴가 일수 조정입니다.", "협약서 전문은 첨부파일에서 확인하실 수 있습니다."],
  "A2230": ["학자금 신청에 필요한 서류 양식을 한곳에 모았습니다. 신청서와 재직 증명 요청서를 내려받아 작성해 주십시오.", "서류는 사무국에 직접 제출하거나 우편으로 보내실 수 있습니다."],
  "A2915": ["사내 식당 메뉴 개선 건의에 대해 사측과 협의한 결과를 알려 드립니다. 주 2회 메뉴를 바꾸고 조합원 의견함을 설치하기로 했습니다.", "추가 의견은 건의 게시판에 남겨 주십시오."],
  "A3377": ["2022년 송년 체육대회에서 찍은 사진을 올립니다. 팀별 줄다리기와 계주 경기 장면을 담았습니다.", "사진 사용에 문제가 있으면 사무국으로 연락해 주십시오."],
};
SCREENS["board"] = function Board() {
  const params = useParams();
  const a = useAuth();
  const [kind, setKind] = useState("제목");
  const [draft, setDraft] = useState("");
  const [query, setQuery] = useState("");
  const [note, setNote] = useState("");
  const [extra, setExtra] = useState({});
  const [reply, setReply] = useState("");
  const [, bump] = useState(0);
  useEffect(() => { const f = () => bump((n) => n + 1); AUTH.listeners.add(f); return () => AUTH.listeners.delete(f); }, []);

  const tab = params.tab || "board";
  const cat = params.cat || "";
  const TABS = [
    { id: "board", label: "전체", p: { tab: "board" } },
    { id: "notice", label: "공지사항", p: { tab: "notice" } },
    { id: "복지후기", label: "복지후기", p: { tab: "board", cat: "복지후기" } },
    { id: "회계", label: "회계", p: { tab: "board", cat: "회계" } },
    { id: "files", label: "자료실", p: { tab: "files" } },
    { id: "archive", label: "이전 게시물 2015~2022", p: { tab: "archive" } },
  ];
  const activeId = tab === "archive" ? "archive" : tab === "files" ? "files" : tab === "notice" ? "notice" : cat || "board";

  const showCat = activeId === "board";
  const base = tab === "archive"
    ? DB.archive.map((p) => ({ ...p, key: p.id, no: p.origNo, author: "사무국", old: true }))
    : sortPosts(DB.posts).map((p) => ({ ...p, key: String(p.no) }));
  let list = base;
  if (activeId === "notice") list = base.filter((p) => p.cat === "공지사항");
  else if (activeId === "files") list = base.filter((p) => (p.files || []).length > 0);
  else if (cat) list = base.filter((p) => p.cat === cat);
  const q = query.trim();
  if (q) list = list.filter((p) => (kind === "제목" ? p.title : p.title + (BOARD_BODY[p.key] || []).join(" ")).includes(q));

  const everything = DB.posts.map((p) => ({ ...p, key: String(p.no) })).concat(DB.archive.map((p) => ({ ...p, key: p.id, no: p.origNo, author: "사무국", old: true })));
  const openKey = params.open ? String(params.open) : (list[0] ? list[0].key : "");
  const cur = everything.find((p) => p.key === openKey) || list[0] || null;
  const goTab = (p) => { setQuery(""); setDraft(""); setNote(""); go("board", p); };
  const openRow = (p) => { setNote(""); go("board", { ...(tab === "archive" ? { tab } : cat ? { tab, cat } : { tab }), open: p.key }); };

  const locked = cur && cur.memberOnly && !a.on;
  const paras = cur ? (BOARD_BODY[cur.key] || ["내용은 첨부 문서를 참고해 주십시오."]) : [];
  const total = cur ? cur.comments || 0 : 0;
  const cmts = cur ? DB.commentsOf(cur.no, cur.comments) : [];
  const mine = cur ? extra[cur.key] || [] : [];
  const nPhoto = cur && cur.cat === "복지후기" ? Math.min(cur.photos || 0, 2) : 0;
  const submit = () => {
    const t = reply.trim();
    if (!t || !cur) return;
    setExtra({ ...extra, [cur.key]: mine.concat([{ who: ME.name, text: t, date: DB.baseDate }]) });
    setReply("");
  };
  const th = "whitespace-nowrap border-b border-[var(--n3)] bg-[var(--n1)] px-3 py-2.5 text-left text-[length:var(--c-small)] font-bold text-[var(--n8)]";
  const td = "border-b border-[var(--n3)] px-3 py-3 text-[length:var(--c-small)] tabular-nums text-[var(--n8)]";

  return (
    <div className="bg-[var(--n0)]">
      <PageHeading title={tab === "archive" ? "이전 게시물" : tab === "files" ? "자료실" : tab === "notice" ? "공지사항" : "게시판"} crumbs={params.tab ? ["게시판", (TABS.find((t) => t.id === activeId) || TABS[0]).label.replace(/ 2015~2022$/, "")] : ["게시판"]} />
      <Wrap className="py-4">
        <div data-must="M3">
          <div role="tablist" aria-label="게시판 분류" className="flex flex-wrap border-b border-[var(--n3)]">
            {TABS.map((t) => (
              <button key={t.id} role="tab" type="button" aria-selected={activeId === t.id} onClick={() => goTab(t.p)}
                className={cx("h-11 whitespace-nowrap bg-transparent px-4 text-[length:var(--c-body)]", activeId === t.id ? "border-b-2 border-[var(--m600)] font-bold text-[var(--m600)]" : "border-b-2 border-transparent text-[var(--n8)]")}>{t.label}</button>
            ))}
          </div>

          <div className="grid grid-cols-1 gap-6 lg:grid-cols-[62fr_38fr] lg:items-start">
          <div className="min-w-0">
          <form className="flex flex-wrap items-center justify-end gap-2 py-3 max-md:justify-start" onSubmit={(e) => { e.preventDefault(); setQuery(draft); }}>
            <select aria-label="검색 대상" value={kind} onChange={(e) => setKind(e.target.value)} className="h-[var(--c-input-h)] rounded-none border border-[var(--n3)] bg-[var(--n0)] px-2 text-[14px] text-[var(--n9)]">
              <option>제목</option><option>내용</option>
            </select>
            <input data-measure="input" aria-label="검색어" value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="검색어를 입력하세요" className="h-[var(--c-input-h)] w-64 rounded-none border border-[var(--n3)] bg-[var(--n0)] px-3 text-[14px] text-[var(--n9)] max-md:w-full max-md:flex-1" />
            <button type="submit" className="flex h-[var(--c-input-h)] items-center gap-1 whitespace-nowrap rounded-none border border-[var(--n3)] bg-[var(--n1)] px-4 text-[14px] text-[var(--n9)]"><Icon name="search" size={15} />검색</button>
          </form>

          <div data-hero className="overflow-x-auto border-t-2 border-[var(--n9)]">
            <table className="w-full table-fixed border-collapse">
              <thead>
                <tr>
                  <th className={cx(th, "hidden w-20 md:table-cell")}>번호</th>
                  {showCat && <th className={cx(th, "hidden w-20 md:table-cell")}>분류</th>}
                  <th className={th}>제목</th>
                  <th className={cx(th, "w-10")}><span className="sr-only">첨부</span></th>
                  <th className={cx(th, "w-28")}>작성일</th>
                  <th className={cx(th, "hidden w-20 md:table-cell")}>조회수</th>
                </tr>
              </thead>
              <tbody>
                {list.map((p) => {
                  const sel = cur && cur.key === p.key;
                  const lock = p.memberOnly && !a.on;
                  return (
                    <tr key={p.key} onClick={() => openRow(p)} aria-selected={sel} className={cx("cursor-pointer", sel ? "bg-[var(--n1)]" : "")}>
                      <td className={cx(td, "hidden md:table-cell")}>
                        {p.pinned ? <span className="whitespace-nowrap bg-[var(--s3-bg)] px-2 py-0.5 text-[13px] font-bold text-[var(--s3-text)]">고정</span> : p.no}
                      </td>
                      {showCat && <td className={cx(td, "hidden whitespace-nowrap md:table-cell")}>{p.cat}</td>}
                      <td className={cx(td, "text-[length:var(--c-body)] text-[var(--n9)]", p.pinned || sel ? "font-bold" : "")}>
                        <span className="flex items-center gap-2">
                          {p.pinned && <span className="whitespace-nowrap bg-[var(--s3-bg)] px-2 py-0.5 text-[13px] font-bold text-[var(--s3-text)] md:hidden">고정</span>}
                          {lock && <Icon name="lock" size={14} />}
                          <span className="min-w-0 flex-1 break-keep">{lock ? "조합원 전용 — " : ""}{p.title}</span>
                          {p.comments > 0 && <span className="whitespace-nowrap text-[13px] font-normal text-[var(--m600)]">[{p.comments}]</span>}
                        </span>
                        <span className="mt-0.5 block text-[13px] font-normal text-[var(--n7)] md:hidden">{p.cat} · {p.author} · 조회 {fmtNum(p.views)}</span>
                      </td>
                      <td className={cx(td, "w-10 text-center")}>{(p.files || []).length > 0 && <Icon name="paperclip" size={14} />}</td>
                      <td className={cx(td, "whitespace-nowrap")}>{p.date}</td>
                      <td className={cx(td, "hidden md:table-cell")}>{fmtNum(p.views)}</td>
                    </tr>
                  );
                })}
                {list.length === 0 && (
                  <tr><td colSpan={6} className={cx(td, "py-10 text-center")}>검색 결과가 없습니다.</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <div className="flex items-center justify-center gap-1 py-5" aria-label="페이지">
            <button type="button" disabled className="flex h-9 w-9 items-center justify-center rounded-none border border-[var(--n3)] bg-[var(--n0)] text-[var(--n6)]" aria-label="이전 페이지"><Icon name="chevron-left" size={16} /></button>
            <span aria-current="page" className="inline-flex h-9 w-9 items-center justify-center rounded-none bg-[var(--m600)] text-[14px] font-bold text-[var(--on-main)]">1</span>
            <button type="button" disabled className="flex h-9 w-9 items-center justify-center rounded-none border border-[var(--n3)] bg-[var(--n0)] text-[var(--n6)]" aria-label="다음 페이지"><Icon name="chevron-right" size={16} /></button>
          </div>

          </div>
          {cur && (
            <article className="mt-4 border-t-2 border-[var(--n9)]" aria-label="글 상세">
              <header className="border-b border-[var(--n3)] py-3">
                <div className="mb-1 text-[length:var(--c-small)] text-[var(--n7)]">{cur.cat}{cur.old ? " · 이전된 글" : ""}</div>
                <h2 className="text-[length:var(--t-section)] font-bold tracking-[var(--t-track)] text-[var(--n9)]">{cur.title}</h2>
                <dl className="mt-3 flex flex-wrap gap-x-6 gap-y-1 text-[length:var(--c-small)] tabular-nums text-[var(--n8)]">
                  <div className="flex gap-1.5"><dt className="text-[var(--n7)]">작성자</dt><dd>{cur.author}</dd></div>
                  <div className="flex gap-1.5"><dt className="text-[var(--n7)]">작성일</dt><dd>{cur.date}</dd></div>
                  <div className="flex gap-1.5"><dt className="text-[var(--n7)]">조회수</dt><dd>{fmtNum(cur.views)}</dd></div>
                  {cur.old && <div className="flex gap-1.5"><dt className="text-[var(--n7)]">원 게시번호</dt><dd>{cur.no}</dd></div>}
                </dl>
              </header>

              {locked ? (
                <div className="flex flex-col items-start gap-3 border-b border-[var(--n3)] py-8">
                  <div className="flex items-center gap-2 text-[length:var(--c-body)] font-bold text-[var(--n9)]"><Icon name="lock" size={18} />조합원 전용 글입니다.</div>
                  <p className="text-[length:var(--c-body)] text-[var(--n8)]">조합원 인증을 마친 뒤 로그인하면 본문과 첨부파일을 볼 수 있습니다.</p>
                  <button type="button" onClick={() => setAuth(true)} className="h-[var(--c-btn2-h)] whitespace-nowrap rounded-none border border-[var(--n3)] bg-[var(--n0)] px-5 text-[length:var(--c-body)] text-[var(--n9)]">로그인</button>
                </div>
              ) : (
                <>
                  <div className="space-y-3 border-b border-[var(--n3)] py-3 text-[length:var(--c-small)] leading-relaxed text-[var(--n9)]">
                    <p className="line-clamp-3">{paras[0]}</p>
                    {nPhoto > 0 && (
                      <div className="flex gap-2">
                        {Array.from({ length: nPhoto }, (_, i) => (
                          <img key={i} src={photoOf((cur.no % 8) + 1 + i)} alt={`${cur.title} 관련 사진 ${i + 1}`} className="h-[72px] w-28 rounded-[var(--r-img)] object-cover" />
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="border-b border-[var(--n3)] py-3">
                    <div className="mb-2 text-[length:var(--c-small)] font-bold text-[var(--n8)]">첨부파일 {(cur.files || []).length}</div>
                    {(cur.files || []).length === 0 && <div className="text-[length:var(--c-small)] text-[var(--n7)]">첨부된 파일이 없습니다.</div>}
                    <ul className="space-y-1">
                      {(cur.files || []).map((f) => (
                        <li key={f}>
                          <button type="button" onClick={() => setNote(`${f.replace(/\s*\(.*\)$/, "")} 내려받기를 시작합니다.`)} className="flex max-w-full items-center gap-2 bg-transparent py-1.5 text-left text-[length:var(--c-body)] text-[var(--n9)]">
                            <Icon name="paperclip" size={16} /><span className="min-w-0 break-all">{f}</span><Icon name="download" size={15} />
                          </button>
                        </li>
                      ))}
                    </ul>
                    {note && <div role="status" className="mt-2 border border-[var(--n3)] bg-[var(--n1)] px-3 py-2 text-[length:var(--c-small)] text-[var(--n9)]">{note}</div>}
                  </div>
                  <section className="py-3" aria-label="댓글">
                    <h3 className="mb-3 text-[length:var(--c-body)] font-bold text-[var(--n9)]">댓글 {cmts.length + mine.length}</h3>
                    <ul className="border-t border-[var(--n3)]">
                      {cmts.concat(mine).map((c, i) => (
                        <li key={i} className="border-b border-[var(--n3)] py-3">
                          <div className="flex items-center gap-3 text-[length:var(--c-small)] tabular-nums"><span className="font-bold text-[var(--n9)]">{c.who}</span><span className="text-[var(--n7)]">{c.date}</span></div>
                          <p className="mt-1 text-[length:var(--c-body)] text-[var(--n9)]">{c.text}</p>
                        </li>
                      ))}
                      {total === 0 && mine.length === 0 && <li className="border-b border-[var(--n3)] py-4 text-[length:var(--c-small)] text-[var(--n7)]">등록된 댓글이 없습니다.</li>}
                    </ul>
                    <form className="mt-4 flex flex-wrap gap-2" onSubmit={(e) => { e.preventDefault(); submit(); }}>
                      <input aria-label="댓글 입력" value={reply} onChange={(e) => setReply(e.target.value)} placeholder={a.on ? "댓글을 입력하세요" : "로그인 후 댓글을 남길 수 있습니다"} className="h-[var(--c-input-h)] min-w-0 flex-1 rounded-none border border-[var(--n3)] bg-[var(--n0)] px-3 text-[14px] text-[var(--n9)]" />
                      <button type="submit" disabled={!a.on || !reply.trim()} className="h-[var(--c-input-h)] whitespace-nowrap rounded-none border border-[var(--n3)] bg-[var(--n1)] px-5 text-[14px] text-[var(--n9)] disabled:text-[var(--n6)]">등록</button>
                    </form>
                  </section>
                </>
              )}
            </article>
          )}
          </div>
        </div>
      </Wrap>
    </div>
  );
};

/* ── 화면 counsel (screens/counsel.jsx) ── */
SCREENS["counsel"] = function Counsel() {
  const params = useParams();

function collect(box,p,out,depth){var k=box.children;for(var i=0;i<k.length;i++){var c=k[i];if(c.matches(SKIP))continue;if(c.contains(p)||c.querySelector(BAR)){if(depth<4)collect(c,p,out,depth+1);continue;}if(inFlow(c))out.push(c);}return out;}
function clear(){for(var i=0;i<shifted.length;i++){var s=shifted[i],st=s.el.style;st.removeProperty('padding-right');st.removeProperty('box-sizing');if(s.pr)st.setProperty('padding-right',s.pr,s.prI);if(s.bs)st.setProperty('box-sizing',s.bs,s.bsI);s.el.removeAttribute('data-tour-shift');}shifted=[];key='';}
function sample(roots){var out=[];for(var i=0;i<roots.length&&out.length<300;i++){var all=roots[i].querySelectorAll('*');for(var j=0;j<all.length&&out.length<300;j++){var e=all[j];var r=e.getBoundingClientRect();if(r.width<120||r.height<8||r.bottom<0||r.top>innerHeight)continue;var tx=false;for(var c=e.firstChild;c;c=c.nextSibling){if(c.nodeType===3&&c.textContent.trim().length>=2){tx=true;break;}}if(tx)out.push([e,r.width,r.left]);}}return out;}
function setW(w){for(var m=0;m<shifted.length;m++)shifted[m].el.style.setProperty('padding-right',w+'px','important');}
function ok(w,sm,strict){setW(w);var de=document.documentElement;if(de.scrollWidth>de.clientWidth+2)return false;
for(var i=0;i<shifted.length;i++){var e=shifted[i].el;if(e.scrollWidth>e.clientWidth+2)return false;}
var lim=innerWidth-w+2,fr=document.querySelectorAll('[data-frame]');for(var j=0;j<fr.length;j++){var r=fr[j].getBoundingClientRect();if(r.width>0&&(r.left<-1||(strict&&r.right>lim)))return false;}
var n=0;for(var q=0;q<sm.length;q++){var b=sm[q][0].getBoundingClientRect();if(b.width<Math.max(40,sm[q][1]*0.25))n++;if(b.left<8&&sm[q][2]>=8)return false;if(strict&&b.width>0&&b.left<lim-2&&b.right>lim+40&&sm[q][2]+sm[q][1]<=innerWidth)return false;}
return n<3;}
function oldRule(){var s=document.querySelectorAll('style[data-house="tour-fix"]');for(var i=0;i<s.length;i++){if(/tour-open>#root main\{padding-right/.test(s[i].textContent||''))s[i].disabled=true;}}
function apply(){timer=null;oldRule();
var p=panel(),root=document.getElementById('root')||document.body,html=document.documentElement;
if(!p||innerWidth<MINW){if(shifted.length)clear();html.removeAttribute('data-tour-shift-mode');return;}
var w=Math.max(0,Math.round(innerWidth-p.r.left+GAP)),k=innerWidth+'|'+w+'|'+location.hash.split('?')[0];
if(overlayKey===k)return;
var t=collect(root,p.el,[],0);
if(key===k&&shifted.length===t.length&&t.every(function(e,i){return shifted[i].el===e;}))return;
clear();
var sm=sample(t);
for(var i=0;i<t.length;i++){var e=t[i],st=e.style;shifted.push({el:e,pr:st.getPropertyValue('padding-right'),prI:st.getPropertyPriority('padding-right'),bs:st.getPropertyValue('box-sizing'),bsI:st.getPropertyPriority('box-sizing')});st.setProperty('box-sizing','border-box','important');e.setAttribute('data-tour-shift','');}
key=k;
if(shifted.length&&ok(w,sm,true)){html.setAttribute('data-tour-shift-mode','shift');return;}
var lo=80,hi=w-1,best=0;for(var it=0;it<8&&lo<=hi&&shifted.length;it++){var mid=(lo+hi)>>1;if(ok(mid,sm,false)){best=mid;lo=mid+1;}else hi=mid-1;}
if(best>=80){setW(best);html.setAttribute('data-tour-shift-mode','partial');return;}
clear();overlayKey=k;html.setAttribute('data-tour-shift-mode','overlay');}
function later(ms){if(timer)clearTimeout(timer);timer=setTimeout(apply,ms||60);}
function start(){new MutationObserver(function(){later(60);}).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
addEventListener('resize',function(){overlayKey='';later(80);});addEventListener('hashchange',function(){later(120);});
document.addEventListener('transitionend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
document.addEventListener('animationend',function(e){if(e.target&&e.target.closest&&e.target.closest(PANEL))later(30);},true);
later(0);}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
}catch(e){}})();
</script>
