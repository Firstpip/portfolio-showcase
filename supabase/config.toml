
[functions.delete-portfolios]
enabled = true
# 게이트웨이에서 JWT 서명 검증(미인증/위조 토큰 차단). 함수 내부에서 role==='authenticated'도 추가 확인.
# 대시보드는 supabase.functions.invoke()로 로그인 세션 JWT를 자동 첨부하므로 정상 동작.
verify_jwt = true
import_map = "./functions/delete-portfolios/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-portfolios/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-portfolios/*.html" ]

[functions.showcase-view]
enabled = true
# 쇼케이스 페이지(assets/sv.js)가 로그인 없이 방문을 보낸다 — sendBeacon 은 헤더를 못 붙이므로 JWT 검증 끔.
# 대신 함수 안에서 Origin(firstpip.github.io)·페이로드 형식·IP 해시당 빈도를 검사한다.
verify_jwt = false
import_map = "./functions/showcase-view/deno.json"
entrypoint = "./functions/showcase-view/index.ts"

[functions.calendar-push]
enabled = true
# pg_cron 이 공개 anon 키로 5분마다 부른다(게이트웨이 JWT 검증 통과). 보낼 차례인 알림만 push_sent 키로 한 번씩 나가므로
# 외부에서 직접 불러도 중복·임의 발송이 생기지 않는다. 테스트 알림은 함수 안에서 로그인 사용자를 다시 확인한다.
verify_jwt = true
import_map = "./functions/calendar-push/deno.json"
entrypoint = "./functions/calendar-push/index.ts"
